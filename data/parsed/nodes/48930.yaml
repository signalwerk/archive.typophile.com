    html: |-
      <p>kerning is neither supported by wordpad nor by word with default settings.</p>
      <p>in word you can turn it on this way:<br>
         1. Select the text whose kerning you want to adjust.<br>
         2. Choose Font from the Format menu. Word displays the Font dialog box.<br>
         3. Display the Character Spacing tab. (Click here to see a related figure.)<br>
         4. Click on the Kerning for Fonts check box.<br>
         5. Adjust the character point size to indicate when Word should start adjusting kerning.</p>
