    html: <p>I suspect there is more to it. In my experience that I had to constantly do matchmaking between AAT and OT, a TTF specs kerning (supported in AAT) is always directly between two consecutive glyphs. I'm not sure if we can make a parallel between vowels in Arabic script and say, circumflex accent on an e but I know that if a vowel is in between two kerned glyphs, the kern is lost. In 'kern' feature of OT you have the lookup with the 'ignore' option.</p>
