    <p>Hi all,</p>
    <p>Yeah I am new here.....</p>
    <p>Thought maybe some experts on here could help.... I ran up against a problem with one font I made on a Mac (using TypeTool btw).  First off the font is heavily manually kerned, since it is a cursive script where every glyph connects to every other letter.  There isn't really a way to connect the glyphs properly without a very large kerning list.</p>
    <p>Now when finished it, I see the font works like a dream on Mac.  It's working absolutely perfect.  </p>
    <p>Next I try to use it on PC.  BIG PROBLEM!  The font can be used in PC, but loses all its kerning so looks ugly.  I've tried putting it in different formats supported by TypeTool, different ways of zipping it, no luck.</p>
    <p>I've successfully made cursive fonts in the past.... these work fine on both platforms.  The only difference I can think of with this one is the larger amount of kerning.  Never have I run into this type of problem before.</p>
    <p>Please help me, I am at a total loss of what to try next....  How can I get this font to work on a PC?</p>
    <p>I've thought of buying a conversion software, but don't know if that would help in this case.  Maybe I don't need it, since the font translates, its only the kerning that gets lost.  If I do need conversion software, any recommendations (preferrably free ones)?</p>
