      <p><cite>This is why it so many people say it’s a good idea ( if possible ) to design your fonts so they work as well as possible prior to kerning. Of course if you don’t care about word or apps that don’t have kerning you can do as you like...</cite></p>
      <p>Reading this before the background of a previous discussion about using or not using the extension lookup type makes me feel quite uncomfortable. Effectively you describe the type designer as someone who produces plugins for this or that application and its limitations (e.g. Word).<br>
      As a designer I would say that design should decide which technology is required to implement it, i.e. whether kerning is needed, even if so much kerning is needed that it can be dealt with only by employing newer aspects of OT specs. Not the other way round.<br>
      It is nice if a particular typeface can get away with little or no kerning, but no or little kerning should not be a goal in itself. It is not a design virtue.</p>
      <p>Rather, we should encourage OS and application developers to access <em>all</em> the data present in a font, all of which are documented in specs. And with 'we' I not only mean type designers but also users of fonts who -- I think -- would like to use every bit of what they paid for, rather than a few pieces to which OS and application developers give access.</p>
      <p>Karsten</p>
