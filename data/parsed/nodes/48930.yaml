      <p>&gt;... we should encourage OS and application developers to access all the data present in a font...</p>
      <p>...or, what I would like to suggest, is that fonts contain in a table-o-'recommendations' indication of what tables and subsets of tables can and cannot be done without, in a given environment and use. </p>
      <p>Examples of this: Ed Interlock works fine without OT, but why bother? Courier can go to the ends of the earth without kerning, but we suggest you not justify it. Augsburger initials is 'appropriate' for all uses, (;)), just please don't make it blink. </p>
      <p>So, while encouraging OS and application developers to access 'all the data present in a font', that's only 1/3 of the problem, IMHO.</p>
      <p>Cheers</p>
