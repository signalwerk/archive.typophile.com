    <p></p><div class="imageWrap"><img src="http://typophile.com/files/LOYOLA_Engraving_Workshop_Poste_3890.jpg"></div><p></p>
    <p>Engraving workshop this Friday. This is a breezy overview of what is contemporary, commercial "engraving".</p>
    <p>Friday, March 18 @ 6:00pm<br>
    Loyola University New Orleans<br>
    Media Room 1<br>
    Monroe Library</p>
    <p>(This workshop was also recently given at)<br>
    Tuesday, March 1 @ 5:00pm<br>
    Southeastern Louisiana University)</p>
    <p>Each workshop will include:</p>
    <p>	•	what is engraving and why do we love it.<br>
    	•	historic specimens of weird and fantastic engraving.<br>
    	•	contemporary applications for engraving.<br>
    	•	how to prepare art for engraving, and the various kinds of "engraving".<br>
    	•	how to engrave...<br>
    	•	...or, how to work with an engraver (so you just have to design and leave the engraving to somebody else.)<br>
    	•	<a class="freelinking external" href="http://handengravedstationery.blogspot.com/2011/02/resources-for-engraving_25.html" rel="nofollow">engraving resources</a> (so, I have this engraving-appropriate type or art. Now, how and to whom do I send it to get it "engraved?").         </p>
    <p>Students of host university, ATypI, SOTA and AIGA members free; moderate fees may apply for non-members and students of other institutions.</p>
