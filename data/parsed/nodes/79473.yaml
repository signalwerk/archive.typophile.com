      <p>dear wiganwebs,</p>
      <p>thank you for your comment. actually, it is as often seen spelled "photoengraving".</p>
      <p>according to one of the inventors of the photo-engraving system for print (and, especially) stationery:</p>
      <p>"TECHNICAL ASSOCIATION OF THE GRAPHIC ARTS . Thirteenth Annual Meeting, June 12-14, 1961<br>
      POWDERLESS ETCHING OF COPPER<br>
      PAUL F. BORTH<br>
      MARVIN C. ROGERS<br>
      Photo-Engravers Research, Inc., Park Forest, Illinois"</p>
      <p>in this highly important trade publication about the PERI-etch system of intaglio etching for commercial printing (on paper), borth spells the subject "photo-engraving" in the title then "photoengraving" in the body of the article.</p>
      <p>i would trust that borth knows how to spell the method he pioneered, and of which he published papers in the double digits.</p>
      <p>this being written, thank you for the observation. in the engraving blog, i have added all three spellings.</p>
      <p>please note: the link you provided was for etching on product surfaces. a like process but not the highly specialized form of etching developed expressly for print (and, in especially, stationery engraving, which is the subject of the engraving blog.)</p>
