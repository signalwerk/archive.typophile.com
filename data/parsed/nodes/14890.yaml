    html: |-
      <p>My advice would be to work closely and directly with the font vendor on this process. Obviously just posting the modified fonts to your suppliers prior to them obtaining rights to accept them makes your actions illegal. </p>
      <p>I’d contact the font vendor and say that you’re planning to use a modified version of their font X in your templates and that ‘n’ named suppliers need to be invoiced. You might be able to negotiate a discount if ‘n’ is a large enough number. </p>
      <p>Then let your suppliers know that you’ve provided their contact details to the font vendor who will invoice them directly and require payment within 30 days.</p>
      <p>If the font vendor doesn’t hear from all the suppliers then they’ll know who at the corporation to contact. </p>
      <p>Cheers, Si</p>
