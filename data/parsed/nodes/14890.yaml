  html: |-
    <p>We here at MegaCorporation use outside vendors for some of our printed materials. For particular campaigns that last over a period of weeks or months, we create a style sheet that indicates standards of usage for logos, graphics, color palettes, typefaces, etc. Our vendors are able to access the style sheet as well as all graphics through an FTP site. For the typefaces, we use the following language:</p>
    <p><strong>To maintain the integrity of the design for the brand/season, only the following approved fonts are to be used. It is the vendor’s legal responsibility to license these fonts.</strong></p>
    <p>In the listing of typefaces, we provide the following information: </p>
    <p><strong>Available for purchase from www.[foundryname].com</strong></p>
    <p>I am now confronting a new issue. We are contemplating altering a font slightly for a future campaign. We plan to get permission to alter the font from the foundry and designer. </p>
    <p>What concerns me is the legal responsibilities the corporation has to the original foundry and designer if this new custom font is distributed to vendors. I believe the vendors should be required to purchase a license to the existing font (from which our font is derived) before receiving a copy of our modified font.</p>
    <p>As font designers, what would you expect a responsible corporation do in such a circumstance? </p>
    <p>• Should we strongly urge our vendors to purchase the license and provide the font to them? </p>
    <p>• Should our corporation ask the vendor for physical proof of proper licensing before distributing the custom font?</p>
    <p>• Should the corporation contact the foundry to make sure a particular vendor has the proper licensing before distributing the font. (I can just imagine how happy our project coordinators would be to have such a delay built in to the process.)</p>
    <p>This presumes that the corporation has gotten permission from the original foundry and/or designer to alter the original font. I will, of course, follow the licensing requirements from the particular foundry we contact on this particular campaign. What I’m asking for is what you would consider “best practice” for a corporation when this issue arises. Trying to be proactive here….</p>
    <p>Thanks,</p>
    <p>Kristin</p>
