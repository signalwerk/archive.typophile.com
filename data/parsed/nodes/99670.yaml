    <p>Hi,</p>
    <p>I'm currently working on a rough draft for an event poster, but have no idea what to do about font. This is for a fashion show and I'm hoping to make the font a bit more modern just so the poster doesn't read too dated or overly feminine yet I'm having a lot of trouble pinning something down so was hoping for some advice, ideas, brainstorming, etc. </p>
    <p>Basically, what I want is 3 lines of text and at least 2 different fonts so the text goes like this:</p>
    <p>[ORGANIZATION NAME] - much larger<br>
    [EVENT NAME]<br>
    [ LOCATION ● DATE]</p>
    <p>Any thoughts?</p>
    <p>Thank you in advance!</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/poster_5291.jpg"></div><p></p>
