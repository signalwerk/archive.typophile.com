  html: |-
    <p>Does anyone know of a good multilingual glossary of common typographic terms?</p>
    <p>I'm looking for something which would help with localizing name tables, so I'm primarily interested in commonly used names for font weights, widths, and other terms frequently found in font names (italic, small caps, etc) in a variety of languages along with any gender or case rules which might be relevant to constructing font names.</p>
    <p>Any pointers would be appreciated.</p>
    <p>André</p>
