    <p></p><div class="imageWrap"><img src="http://typophile.com/files/CIMG2959_4550.JPG"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/CIMG2971_6422.JPG"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/CIMG2972_3928.JPG"></div><p></p>
    <p>In New Orleans, there are some pretty unique signs. Most of them, however, have a few characteristics in common. First of all, most signs in New Orleans appear old and worn, as in the Ignatius sign above. Some signs are on wooden planks hung in front of the business, others are places directly on the exterior walls of the buildings. Either way, the wood is warped or the paint is chipped. There are water marks and rust, dirt, grit and grime. This is because New Orleans is surrounded with a deep rooted tradition. New Orleans is unique because of its culture. In order to preserve the diverse cultural history of New Orleans, people tend to cling to their traditions and heritage. </p>
    <p>Secondly, Most of the signs in New Orleans are hand painted, as in the Reina Gallery sign above. The personal touch gives New Orleans an artful quality. New Orleans has always been an artful city. The business owners most often choose hand painted signs over big, gaudy mass-produced plastic signs. Another typical characteristic of signs in New Orleans is the presence of a Fleur de lis. One unique type of sign I found in New Orleans is the street signs. While most street signs in the US are printed on those little green sheets of metal and mounted on a post, in New Orleans, street signs are also tiled into the sidewalks. This also adds to the artistic nature of New Orleans.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/CIMG2963_5265.JPG"></div><p></p>
    <p>Here is another sign that I found in New Orleans. I just thought that it was hilarious and I HAD to post it.</p>
    <p>Here are a few more interesting signs..</p>
