    html: |-
      <p>It depends on what country you live in. IIRC, in the States, you cannot copyright a design. If *you* digitize a font, say from a printed source, it is perfectly legal. You can then copyright your font data, but again, not the design. The font *name* may well have to be different. Some names are in the public domain (Janson, Baskerville, etc.) </p>
      <p>Believe the situation on protecting a design is different in Europe. Don't ask about Asia.</p>
      <p>Notice I said *legal*. Opinions vary on the ethics.</p>
