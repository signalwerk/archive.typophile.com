    html: <p>We set old-style numbers in tables fairly often. For Type 1 fonts, we make up tabular and "proportional" numbers, both os &amp; lining,. All glyphs in a font (e.g., "roman") are put in one font &amp; we write an encoding vector to get what we need. If you're using QuarkMaker, that won't work, but I believe some people like Sumner Stone have made up multiple fonts having different figure styles &amp; setwidths. <br> <br>For OpenType, the problem dissappears, you can have both tabular and proportional, oldstyle and lining in a single font. <br> <br>When you have to set a table &amp; bold is called for, it's mandatory that the bold have the same setwidth as the roman &amp; italic -- otherwise the proof will come back marked "P.E. Align on decimal." <br> <br>FWIW, <br> <br>Charles</p>
