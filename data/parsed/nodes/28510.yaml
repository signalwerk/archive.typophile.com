      <p>If they claim trademark, then they will have spent money registering the name and may be likely to act in order to protect their investment (read; they'll see you in court for infringement). I don't know how the big foundries worked it out between each other historically, because this is one of the continuing refrains of type development. Lots of faces got the same name, only distinguished by the foundry appellation (ie. ATF Garamond, Monotype Garamond). From my own research I know of one name (a generic noun), common to three typefaces, all visually distinct from each other – one by T-26 in 1999, one by Linotype in 2000 and one by Bauer in 1934. </p>
      <p>A couple of suggestions to get around this. Can you spell it differently to the Linotype name? Or hyphenate it to form a compound name with either the second half of your trio name or the weight? Or put your own foundry name in front of it. All of these have established precedents.</p>
