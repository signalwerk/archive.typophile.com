      <p>Youch. What and odd, but lousy thing! Hope they end up okay.</p>
      <p>The pick another name strategy has won, for different reasons than I imagined. Since Linotype can't market themselves without sharing/borrowing the names of others' fonts, I'm not too worried. Besides, my pockets are of no fascination to any lawyer on earth, and it would end up a PR fiasco. Nevertheless, I want to make my own name in type design, and not even appear to ride the shoulders of others.</p>
      <p>The upcoming font is now dubbed "<strong>!Square Engine</strong>". I'll post a release in a few days, after I get the final bits jsut so. I hope anybody out there enjoys it anywhere near as much as I do. I suspect that most 'philes are not into what I'm doing, but, hey, someone might.</p>
      <p>Choz Cunningham<br>
      !Exclamachine Type Foundry<br>
      |\/|O D S 4 L 3 T T 0 R Z</p>
