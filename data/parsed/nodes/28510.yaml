      <p>I am aware that American font copyright policy is actually more liberal than many other developed nations, but the articles on the subject I've found so far aren't as thorough as those on other mediums, which each have thier own nuances.</p>
      <p>Ben -<br>
      All !Exclamachine fonts have a '!' before them, which I intend as a icon or ideograph to represent the foundry name in it's most abbreviated sense. So, Lino's font would be (like) "Bob™", and mine would be (like) "!Bob Lob". Seems different enough to me, especially if Linotype has been on the opposite end of this situation. And meets two of the suggested ideas, sorta.</p>
      <p>That thing about all those same-name/same-art fonts from different foundries I've always wondered about. I guessed they were all rip-offs of typefaces created  before our current age of infinite copyrights?</p>
      <p>sii-</p>
      <p>That's a bit gruff. I haven't asked Linotype anything at all. When checking myfonts.com for similar names, I came across the font family page for the face in question. It had the bottom-of-page notice, " <em>'...’ is a trademark of Linotype GmbH which <strong>may</strong> be registered in <strong>certain</strong> jurisdictions.</em>" (Emph. added.) I thought I would get the impressions of a mixture of enthusiasts and professionals.</p>
      <p>I do not have a specialized IP Lawyer in my budget at this time. Currently, I make and give away free fonts at my own expense, primarly for the glamour and the fun.</p>
      <p>Choz Cunningham<br>
      !Exclamachine Type Foundry</p>
