    <p>One of the most agonizing yet fun parts of creating a font, to me, is the naming. Usually, it is one of the last steps taken. After deciding on a name, I found a font from Linotype that is virtually identical to the family name I chose. Of course, it seems like a very generic word to me, but they claim a trademark in unnamed jurisdictions.</p>
    <p>Is this important? Is it considered immoral in the comunity, or unimportant? Is it simply unwise to choose such a similar name when it's a major foundry owning the other font? I see each font as a work of art, and feel that the name should be whatever is appropriate like a book or painting. However, to many I am certain this is a business first, and I'm not in the mood to step on the toes of giants (or regular Joes) needlessly.</p>
    <p>To note, the fonts are in no way visually similar, and the word in question is a common  word, used as the first half of the name of a trio of faces in my project, and as the sole name of the Linotype font. I look forward to your thoughts on this. Thank you all.</p>
