      <p>&gt; is a trademark of Linotype GmbH which may be registered in certain jurisdictions.”</p>
      <p>The phrase "X is a trademark of Y which MAY be registered" is used to trick gullible font buyers.</p>
      <p>In the funny font forging industry, it even happens that two or more font forgers slap the same trademark on two or more font forgeries.</p>
      <p>Example: Look at the two forgeries of the font Candida depicted on page 11 in the "Slab" section of the new FontBook 2006. For your convenience, I uploaded a scan:</p>
      <p><a href="http://sanskritweb.de/files/candida.gif" title="http://sanskritweb.de/files/candida.gif">http://sanskritweb.de/files/candida.gif</a></p>
      <p>Both font forgeries of Candida are provided with the "TM" (= trademark) claim, so both font forgers make gullible font buyers believe that they "own" the same identical "trademark". Since the editors of the FontBook did not disclose the names of the font forgers, you will have to act as a private detective to find out who made which forgery.</p>
      <p>A lawsuit would be most funny, for both font forgers would claim at court to be the "owner" of the same "trademark" slapped on their forgeries of a font which they never designed.</p>
