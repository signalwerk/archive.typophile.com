      <p>Unfortunately, Linotype, I assume, must be motivated to err on the side of caution, and should, rightfully, be biased towards their own interests.</p>
      <p>I brought this discussion here specifically to find out the type community's point of view, morally even more than legally.</p>
      <p>The existing piles and piles of shared and "Trademarked" fonts that clone each other's names and forms, and the fact that it seems to be accepted by the community tells me that it would likely not be a problem at all, from an ethical standpoint.</p>
      <p>Meanwehile, I've decided, in this situation, that the existing font is  "too famous". When I create a face, one thing I like is a "freedom from connotation" since no media has used it before. Likewise, I do not want to seem to attach myself to an existing type designer's works. So, I will be finding a new name.</p>
      <p>Time to go surfing the net again... Thank you all for your time and input on this, it has been very insightful.</p>
      <p>Choz Cunningham<br>
      !Exclamachine Type Foundry</p>
