      <p>Cool idea.<br>
      I don't really mind that Switzerland seems to be abbreviated – it's admittedly a tough one to fit – but it makes me wonder, mightn't it have been interesting to use different widths (and maybe weights) of a given typeface*?<br>
      (* And why oh why do people who make cool stuff with type so often fall back on this most nondescript of typefaces?)</p>
