  html: <p>The variation in thickness and symmetry of a type’s <a href="/node/add/wiki?edit%5Btitle%5D=stroke" title="Create node &quot;stroke&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">stroke</a> or outlines. Degree of modulation covers a very wide range, from zero modulation (<a href="/node/40400" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Monolinear</a>) to the subtle variation of a stressed linear type, and strokes so erratic they are classified as fractured. Modulation is related to the <a href="/node/39906" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Cursive</a> property, or condition of being&nbsp;cursive.</p>
  html_clean: <p>The variation in thickness and symmetry of a type’s <a href="/node/add/wiki?edit%5Btitle%5D=stroke" title="Create node &quot;stroke&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">stroke</a> or outlines. Degree of modulation covers a very wide range, from zero modulation (<a href="/node/40400/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Monolinear</a>) to the subtle variation of a stressed linear type, and strokes so erratic they are classified as fractured. Modulation is related to the <a href="/node/39906/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Cursive</a> property, or condition of being&nbsp;cursive.</p>
