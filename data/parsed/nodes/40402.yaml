  html: <p>The variation in thickness and symmetry of a type's <a href="/wiki/stroke" class="freelinking" rel="nofollow">stroke</a> or outlines. Degree of modulation covers a very wide range, from zero modulation (<a href="/wiki/monolinear" class="freelinking" rel="nofollow">monolinear</a>) to the subtle variation of a stressed linear type, and strokes so erratic they are classified as fractured. Modulation is related to the <a href="/wiki/cursive" class="freelinking" rel="nofollow">cursive</a> property, or condition of being cursive.</p>
  html_clean: <p>The variation in thickness and symmetry of a type's <a href="/wiki/stroke" class="freelinking link-lost" rel="nofollow">stroke</a> or outlines. Degree of modulation covers a very wide range, from zero modulation (<a href="/wiki/monolinear" class="freelinking link-lost" rel="nofollow">monolinear</a>) to the subtle variation of a stressed linear type, and strokes so erratic they are classified as fractured. Modulation is related to the <a href="/wiki/cursive" class="freelinking link-lost" rel="nofollow">cursive</a> property, or condition of being cursive.</p>
