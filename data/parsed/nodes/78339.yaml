      <p>Energizing, yes. Head-turning, ok. I'm not sure a logo can be motivational, but this one's punchy at least.</p>
      <p>An issue to consider: the black dots in the corners and black beveling make the ticket shape look like a riveted metal plate. That combined with the machined lettering made me think "auto parts."</p>
      <p>You've got some energy, now rein it in a bit, find where that energy is coming from and preserve that—and only that.</p>
  - id: 448800
    user_id: 58010
    user_name: JamesM
    user_path: null
    user_image: null
    date_raw: 24 Jan 2011 — 9:16am
    date: 2011-01-24T09:16:00
    votes: null
    html: |-
      <p>The large empty space after "fit" sucks the energy out of the logo. I'd suggest making "fit" much larger.  "Ticket" could be much smaller; the ticket shape already communicates that message. Make "fit" the typographic focal point.</p>
      <p>The black fill below "fit" reduces contrast; I'd eliminating it.</p>
      <p>Small type below logo is way too small.</p>
      <p>To me the orange background circle draws too much attention. Focus should be on the ticket and name, not the background. I'd either eliminate it or tone it down in some way. </p>
      <p>Maybe the ticket itself should be orange, and the type reversed out in white.</p>
      <p>Don't mean to sound overly critical with all these suggestions; just trying to offer some friendly advice.</p>
