    html: |-
      <p>Energizing, yes. Head-turning, ok. I'm not sure a logo can be motivational, but this one's punchy at least.</p>
      <p>An issue to consider: the black dots in the corners and black beveling make the ticket shape look like a riveted metal plate. That combined with the machined lettering made me think "auto parts."</p>
      <p>You've got some energy, now rein it in a bit, find where that energy is coming from and preserve that—and only that.</p>
