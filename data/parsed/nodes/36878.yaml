      <p><em>The quote is interesting, but I’m not sure I agree with it!</em></p>
      <p>Really? It's hard to judge the phrase completely out of context, but I think it can apply to a lot of industrial design, or to modernist ideas about design in general -- uncluttering rather than cluttering, making things easier to use rather than harder. Good design usually has these objectives.</p>
      <p>I had to read a couple of Munari's books in my first year of design school, but that was a long time ago (the mid-1980s), and I can't recall if this phrase was in them.  :-)</p>
