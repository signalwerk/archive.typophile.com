      <p>Current examples of "progress" not answering to simplification.</p>
      <p><strong>Design &amp; Aesthetics</strong><br>
      The leading edge in linear or sans serif typeface design is moving away from the simple models of the 19th &amp; 20th centuries towards models of increased complexity, borrowing from seriffed type designs. The trend began with fonts like Rotis sans and its jarred rounds, designed by Otl Aicher. According to Identifont.com, "With Rotis, Aicher was searching for the clearest legibility by combining elements of serif and sans serif." The Rotis series (superfamily) also introduced the semi-sans (designed 1989), using a stressed stroke in an otherwise linear type design.</p>
      <p>More complexity came with FF Legato, designed by Evert Bloemsma 2004, and is continuing with Microsoft Candara, designed by Gary Munch. According to Ascender Corporation, "Candara is a casual humanist sans with verticals showing a graceful entasis on stems, high-branching arcades in the lowercase, large apertures in all open forms, and unique ogee curves on diagonals. The resultant texture is lively but not intrusive, and makes for a friendly and readable text." According to Wikipedia, "Candara is featured in the Microsoft ClearType Font Collection, a set of fonts developed to take advantage of ClearType to improve the reading experience in Windows Vista and Office 2007."</p>
      <p>ITC Officina, designed by Erik Spiekermann and Ole Schäfer 1990 - 1998, promoted serifs on i &amp; j, curled stem tips and bent entry &amp; exit strokes for a condensed information sans with enhanced text performance. </p>
      <p>Nick Shinn's Preface (2003), "...switches the emphasis, driving out diagonals to create a dominant harmony of curves and perpendiculars, matched with a greater variety of inter-character space shapes. <a href="http://www.myfonts.com/fonts/shinn/preface/" rel="nofollow">Nick describes the design and its principles.</a> </p>
      <p>Then there is <a href="http://www.myfonts.com/fonts/storm/sebastian/" rel="nofollow">Frantisek Storm's Sebastian</a> (2003). According to the blurb, "Sebastian Sans-serif typefaces compensate for their basic handicap – an absence of serifs – with a softening modulation typical of roman typefaces."</p>
      <p>Formata (1984), designed by Bernd Möllenstädt, "Instead of linear severity common to many sans serifs, Formata offers curved strokes and interesting details that are subtle in smaller sizes but distinguishable in larger sizes, thus, appropriate for both text and display."</p>
      <p>Surely these developments are considered progress? Sans serif typeface design is not becoming simpler, it is moving away from reductive modernism by growing in richness and complexity.</p>
      <p><strong>Technology</strong><br>
      Font technology has grown from the simple Type 1 format of yesteryear to the increasingly complex monster called OpenType. A feature-laden OT font simplifies typesetting matters for the user, but for typeface designers and developers the job is becoming more and more complex. Try developing a text font with built-in smallcaps and trying to make the kerning values for the lowercase work with those smallcaps.</p>
      <p>j a m e s</p>
