      <p><em>I think technological progress is often an illusion of simplicity. The designer’s task is often made more compex in the pursuit of simplicity!</em></p>
      <p>Yes, no doubt about that.</p>
      <p><em>Perhaps the quote itself is a simplification of the issue!</em></p>
      <p>The implication of progress is improvement over what existed before. But progress is more complex and involved than that.</p>
      <p><em>Against aesthetics it holds quite true...</em> </p>
      <p>Part of me wants to believe it, but history shows progress in art and design to be cyclic. What starts off simple (artefacting of the medium and tools notwithstanding) is made more complex and elaborate by the addition of "new" ideas and philosophies; sometimes these additions are called "refinement", and conceived of as progress, a "progression" over what came before them. Complexity accumulates until the state of the art is incapacitated by excessive detail and protuberances. At this point a backlash usually occurs and art is returned to a simpler state.</p>
      <p>After a while we become bored by simplicity, and the process begins again. Complexity builds and builds until we can stand it no more. The cycle of progress goes on, like a tide. Simplicity and complexity fall in and out of fashion. </p>
      <p>Munari's conception of progress appears typical of the early 20th century modernist backlash against the decorative excesses of late 19th century art and design. Tschichold prescribed simple sans serif typefaces and simple compositions as the ideal for the 20th century---to begin with---but later recanted in favor of more sophisticated classical design from the 16th and 15th centuries. </p>
      <p>In essence, progress, or progression, is change, a move towards something either less complex of more complex. The definition given for progress depends on what part of the cycle we're in.</p>
      <p>j a m e s</p>
