      <p>&gt; it’s still common and it’s more interesting to me.</p>
      <p>I'm all for reform, but laziness or abandonment to<br>
      cultural impoverishment to me is not interesting.</p>
      <p>&gt; Flat accents are more elegant (see Estee Lauder’s logo)<br>
      &gt; and more readable, in my opinion.</p>
      <p>Depending on what you mean by flat,<br>
      I agree and disagree in varying ways...</p>
      <p>I think <cite>totally</cite> flat accents <cite>can</cite> be more elegant, like in a light monoline face; but steep accents are more elegant to me in a contrasty serif face for example. As for almost-totally flat accents, I don't see any elegance at all - to me they seem... confused more than anything else. And when it comes to readability (a totally different animal than the display stuff above) even only moderately-flat accents can leave the reader guessing (and guessing in a non-productive direction). On the other hand when accents are too prominent they can be disruptive of readability,<br>
      I agree (assuming that's what you're thinking).</p>
      <p>hhp</p>
