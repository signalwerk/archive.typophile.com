      <p>Do all the accents look the same, Nick?</p>
      <p>Giordano, I'm not sure I understand your question, by 'horizontal' do you mean more horizontal that e.g. the preferred Polish form (which is also a style of accent that one sees more and more in non-specifically Polish designs), or actually horizontal lines like Nick shows here?</p>
      <p>I think some of the discussion about accent angle has mistakenly focused on the Poles liking steep accents, because this is a style, as I note, that is not uncommon in e.g. contemporary French design, and is the model I follow for the default accents in all my designs. Rather, the focus should be on the Czech preference, which is the more distinct cultural preference, for quite flat accents. This is one of the reasons why, after my trip to Prague, I became convinced that the only way to set the Czech language is to use a Czech typeface. Veronika Burian's <a href="http://www.fontshop.com/?fuseaction=catalog.fontpackage&amp;searchby=manufacturer&amp;displayfontid=FF.11497.0.0" rel="nofollow">Maiola</a> is a good recent design in the Czech tradition that exhibits this form of accent.</p>
