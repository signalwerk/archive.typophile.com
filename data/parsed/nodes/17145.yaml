    html: <p>On the subject of accent angle in contemporary, non-culturally specific type design, the story of Matthew Carter's Fenway is quite interesting. The original Fenway has grave and acute accents with angles close to 45 degrees. When Maxim Zhukov asked if Matthew would donate copies of the fonts to use in the ATypI Country Delegates report a few years ago, Matthew supplied a modified version to set the Polish report, so that Polish names would be displayed with steeper accents. The publication used both sets of fonts, tailored to different nationalities, much to Adam Twardoch's delight. When we came to typeset the ATypI/Graphis publication <em>Language Culture Type,</em> Maxim wanted to use Fenway again, and I went about making an OpenType version to facilitate the typesetting and added a number of diacritics for other languages not supported by the Matthew's fonts (e.g. Chinese and Arabic transliteration characters). Matthew at this point decided that he preferred the steeper accents he had made for the Polish fonts to the original forms, and so these became the default forms in the OpenType font used to set <em>Language Culture Type.</em></p>
    html_clean: <p>On the subject of accent angle in contemporary, non-culturally specific type design, the story of Matthew Carter's Fenway is quite interesting. The original Fenway has grave and acute accents with angles close to 45 degrees. When Maxim Zhukov asked if Matthew would donate copies of the fonts to use in the ATypI Country Delegates report a few years ago, Matthew supplied a modified version to set the Polish report, so that Polish names would be displayed with steeper accents. The publication used both sets of fonts, tailored to different nationalities, much to Adam Twardoch's delight. When we came to typeset the ATypI/Graphis publication <em>Language Culture Type,</em> Maxim wanted to use Fenway again, and I went about making an OpenType version to facilitate the typesetting and added a number of diacritics for other languages not supported by the Matthew's fonts (e.g. Chinese and Arabic transliteration characters). Matthew at this point decided that he preferred the steeper accents he had made for the Polish fonts to the original forms, and so these became the default forms in the OpenType font used to set <em>Language Culture Type.</em></p>
