      <p>The flatter accent allows for less leading and more economy. (You can cram more on a page.)<br>
      I tend to like the flatter look because it seems more clear as a diacritic and is less likely to be confused with a vertical ascender.  The very straight vertical marks seem to hinder readability to me personally although I have no data to support it.</p>
      <p>ChrisL</p>
