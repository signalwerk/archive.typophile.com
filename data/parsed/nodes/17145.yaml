      <p>Well, to answer your questions, firstly I meant horizontal as in "more horizontal...". There are a few resons for this. Firstly, because of the space economy and the fact that nearly horizontal (or flatter, if you will) accents are easier to work with, especially for accented caps. You see, in French (from France), it is preferred to just leave the accents off caps. In Italian, the accent is replaced by an apostrophe after the letter (since the accents occur almost exclusively at the ends of words).</p>
      <p>However, in Quebec usage, caps are supposed to be accented as well. Besides that, I just like the freedom of having as many options as possible.</p>
      <p>The second reason for the horizontal accents is that it's much closer to the way accents are handwritten. I don't think I've ever seen handwriting or printing with accents like those of most typefaces, but rather they are usually quite horizontal and take up the full width of the letter. So, I personally find that this style of accent is more natural.</p>
      <p>As far as your 1950s French Bodoni, Nick, I can understand the disctiction between the two (since they can be seen as two distinct symbols rather than mirror images of each other). </p>
      <p>Another weird thing about accents is Italian. It makes frequent use of the grave accent (to signify stress), but the accent is often replaced by an apostrophe (a carryover from the days of typewriters I guess), or, the accent is sometimes written toward the right side of the letter:</p>
      <p>Si può dire "un bambino", quindi la forma maschile sarà tronca<br>
      Si puo' [...] sara' tronca<br>
      Si puo` [...] sara` tronca</p>
      <p>In printed and handwritten texts the first two are both common (the second one because some people are just too lazy to bother finding accents on their keyboards). The last one is just a variation on the placement of the accent (probably because people in the old days were too lazy to go backwards on their typewriter to type the accent <cite>over</cite> the letter) and is only seen in handwriting. For the record, only the actual accented letter is "correct", not that anyone takes heed.</p>
      <p>In an all-caps setting, both of these would be common:</p>
      <p>SI PUO' [...] SARA' TRONCA</p>
      <p>SI PUÒ […] SARÀ TRONCA</p>
      <p>Why? Probably just because Italians have to do everything in the most complicated way possible. Variety is the spice of life, after all...</p>
      <p>Anyway, in my limited experience with accents (I only speak French, Italian, and Spanish, so I can only speak from those viewpoints), I have come to the conclusion that while, on the surface, it seems like all these languages use the exact same accents (because we give the same name to the same direction of accent), in fact the preference of shape varies from language to language and country to country. I guess in a perfect world we would have several choices of accents to use, so that Poles, Czechs, Quebecers, and Italians, and the many other users of diactrical marks could all be contented.</p>
      <p>In the meantime I need to create some tighly lead all-caps French for consuption in Quebec so... any suggestions?</p>
