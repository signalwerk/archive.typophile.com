      <p><em>You see, in French (from France), it is preferred to just leave the accents off caps.</em></p>
      <p>This is a fairly recent and bad habit adopted as a result of the limitations of typewriters. If you look at older French books, you will see the accents on caps. If you look at quality French typesetting such as practiced by the Imprimerie nationale, you will see the accents on caps.</p>
      <p>The accents on caps are almost always flatter than on the lowercase letters (unless the font is specifically Polish), so I guess you are looking for <em>very</em> flat cap accents.</p>
