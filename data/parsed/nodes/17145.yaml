      <p><em>Do all the accents look the same, Nick?</em></p>
      <p>Acute, grave, and circumflex are identical. But it's not fully "monotonic": dieresis and ring are distinct.<br>
      I figured that as the reductive design system of this font made no distinction between 5 and S, or O and 0, relying on context, then the same would be appropriate for the angled accents.</p>
      <p><em>...the only way to set the Czech language is to use a Czech typeface.</em></p>
      <p>Unless you don't mind "speaking" with an accent.<br>
      I'm reminded of Stephen Banham's comment about being an Australian confronted with a lot of Gill Sans and always hearing an English voice.</p>
      <p>***</p>
      <p>Why do the Czech's prefer a flatter accent? Is it because they have a preference for faces with a large x-height?</p>
      <p>***</p>
      <p>I came across a 1950s French setting of Bodoni the other day, and noticed that the acute was at a steeper angle than the grave. An interesting visual rendering of the difference between a sharp and a flat sound.</p>
