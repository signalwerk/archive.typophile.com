      <p>I think the accents in Panoptica Doesburg are fine,<br>
      appropriate even. But -alluding to that other thread-<br>
      there's a difference between display and text faces.</p>
      <p>&gt; Unless you don’t mind “speaking” with an accent.</p>
      <p>I love accents (at least the spoken kind) but only in their place.<br>
      Why would a Czech author writing for Czech readers want have<br>
      an accent? That just makes him seem like he thinks he's too good<br>
      for them.</p>
      <p>&gt; Is it because they have a preference for faces with a large x-height?</p>
      <p>They actually prefer small x-heights I think.</p>
      <p>&gt; I came across a 1950s French setting of Bodoni the other day,<br>
      &gt; and noticed that the acute was at a steeper angle than the grave.</p>
      <p>Possibly a chirographic artefact.<br>
      It wasn't simply an italic though, was it?</p>
      <p>&gt; because of the space economy and the fact that nearly<br>
      &gt; horizontal (or flatter, if you will) accents are easier<br>
      &gt; to work with, especially for accented caps.</p>
      <p>But:<br>
      1) According to Mandel at least, "authentic" French requires<br>
      a small x-height; and this gives more room to the accents.<br>
      2) That's why good fonts have less steep accents on the caps.<br>
      And good fonts have short caps too, which helps even more.</p>
      <p>&gt; in French (from France), it is preferred to just leave the accents off caps.</p>
      <p>Not by people who know that that's a mistake.</p>
      <p>&gt; The second reason for the horizontal accents is that<br>
      &gt; it’s much closer to the way accents are handwritten. </p>
      <p>Which is however essentially moot.</p>
      <p>&gt; the preference of shape varies from language<br>
      &gt; to language and country to country.</p>
      <p>Indeed. And we should relish that!</p>
      <p>hhp</p>
