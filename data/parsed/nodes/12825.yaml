    html: <p>Sergej, May I ask what some of your problems with Typophile and its members are, beside Flash.? <em>( You sure seem annoyed, by almost everything and everyone, recently.? )</em></p>
  - id: 73901
    user: 1085
    date: 2005-06-01T13:05:00
    date_raw: 1 Jun 2005 — 1:05pm
    votes: null
    html: |-
      <p>I like the flash interface. Almost every browser in use today supports flash. And since so many sites implement it, quite a lot of users have installed the plug-in. I can't see why any internet user would not mind "going through the trouble" of downloading the plug-in…</p>
      <p>However, typophile *does* work without the flash parts… I was at a conference center in the middle of nowhere last week… internet access, but the computers did not have flash installed! I surfed Typophile anyway.<br>
      __<br>
      <a href="http://www.typeoff.de" title="www.typeoff.de">www.typeoff.de</a></p>
  - id: 74063
    user: 1286
    date: 2005-06-02T22:20:00
    date_raw: 2 Jun 2005 — 10:20pm
    votes: null
    html: <p>I myself am not normally a fan of a flash interface, but it works in this instance. Although I would echoe some of the other requests to get some screen fonts for the main page. If not an ultrafont, then maybe just something aliased? That small fuzzy text will be the death of me.</p>
  - id: 74092
    user: 1461
    date: 2005-06-03T07:36:00
    date_raw: 3 Jun 2005 — 7:36am
    votes: null
    html: |-
      <p><em>I like the flash interface. Almost every browser in use today supports flash.</em></p>
      <p>Yep. That's true. But really has nothing to do with user preferences.</p>
      <p>I've installed FlashBlock on most of my browsers. This has made the web so much nicer. Granted, it makes sIFR rather annoying.</p>
      <p>I don't MIND the flash on this site, but it's not really necessary. It also messes up my javascript fix a bit that changes the width of the forums, but that's my doing, I suppose. ;o)</p>
      <p>My BIGGEST gripe with the flash navigation is that I can't launch pages into new tabs.</p>
