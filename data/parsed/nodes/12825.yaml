      <p>I like the flash interface. Almost every browser in use today supports flash. And since so many sites implement it, quite a lot of users have installed the plug-in. I can't see why any internet user would not mind "going through the trouble" of downloading the plug-in…</p>
      <p>However, typophile *does* work without the flash parts… I was at a conference center in the middle of nowhere last week… internet access, but the computers did not have flash installed! I surfed Typophile anyway.<br>
      __<br>
      <a href="http://www.typeoff.de" title="www.typeoff.de">www.typeoff.de</a></p>
