      <p>I have not found LinkedIn particularly useful professionally. I’m on it but like Stephen only to accept connection requests.Other people have told me they have gotten job queries from it though. I don’t know what they’re doing that I’m not necessarily.</p>
      <p>Facebook - I dunno - it is a LOT of fun but I can’t see that any of it is professional. I play Scrabulous, superpoke my friends, get told that I look like a cat, figure out all the places in the world I’ve been,  and match up words to protect the rainforest. Excellent way to waste time!</p>
      <p>LinkedIn ramped up first among my crew - both professional and personal connections. But Facebook is the Obama of the two - it surged out of nowhere and now it seems more people I know are on that. Probably just to play quizzes and conquer the world though.</p>
      <p>My brother (who is in the tech world) tells me people he know use Facebook for their primary email nowadays because there is no spam. I wouldn’t do that because I can’t see any way to organize the InBox.</p>
      <p>Put another way - I’m on Facebook all the time. Linked In I look at maybe once a week.</p>
