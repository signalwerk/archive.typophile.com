      <p>&gt;  It seems to mainly be a vehicle for delivering movie quizzes. </p>
      <p>Only if you want it to be. Facebook is really quite flexible — and it’s simple too. I think it’s currently the best way for most people to create a web page about themselves and to find others.</p>
      <p>I can’t really say much for Linkedin. I’m on it, but I’ve only visited the site to accept connection requests. It is certainly more oriented towards job seeking and business relationships.</p>
