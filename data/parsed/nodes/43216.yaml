    <p><a href="https://web.archive.org/web/20081008041247/http://www.linkedin.com/">http://www.linkedin.com&gt;It seems like it might be a useful tool.</a></p>
    <p>Linked in certainly looks more serious, but is it really useful for professional networking? Is it just another Facebook but with a resume attached?</p>
    <p>Facebook, I don’t think I quite get the point of. Yeah, OK it can be fun, and I can find out about events I’m interested in but I could find out about them as easily bay different means. It seems to mainly be a vehicle for delivering movie quizzes. Is it fair to compare the two?</p>
