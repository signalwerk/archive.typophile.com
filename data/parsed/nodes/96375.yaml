    <p>Unicode defines the characters U+090D (ऍ - Devanagari Letter Candra E) and U+0911 (ऑ - Devanagari Letter Candra O) but those characters are not mentioned <a class="freelinking external" href="http://en.wikipedia.org/wiki/Devanagari" rel="nofollow">here</a>, neither <a class="freelinking external" href="http://en.wikisource.org/wiki/Sanskrit_Grammar/Chapter_I" rel="nofollow">here</a>.</p>
    <p>I also noticed that the diacritics U+0945(ॅ - Devanagari Vowel Sign Candra E) can be used after consonants, like क,ख,त,थ,प,फ as follows : कॅ,खॅ,तॅ,थॅ,पॅ,फॅ, but those links do not make any reference to this sign.</p>
    <p> Would appreciate some help on this. Thanks.</p>
