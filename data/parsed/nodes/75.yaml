  html: <p>Hi all, <br> <br>This is my first attempt at typeface design, so, uh, take that into account here (i.e., don't kill me.)  <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> Any comments? My main problem is the spacing ... the face is really screwy that way and for this sample I manually kerned the heck out of it. The face is meant to be idiosyncratic, but I realize that some characters are much heavier than others, while some are too light.  <br> <br><img src="http://www.typophile.com/forums/messages/29/10555.gif" alt="sample"></p>
