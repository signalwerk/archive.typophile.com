    <p><a class="freelinking external" href="http://www.typofonderie.com/alphabets/view/allumistd" rel="nofollow">Allumi Std</a> was originally created by Jean François Porchez in 2009. This new variation “Std” is the basic version of the tailored <a class="freelinking external" href="http://www.typofonderie.com/alphabets/view/AllumiPTFx3" rel="nofollow">Allumi PTF.</a> Allumi is a sleek typeface designed with technology in mind. It’s a perfect font family of 27 series for any communication concerning design, robotics, or functionality.</p>
    <p>6 weights pack: from € 140 / $ 145 for 2 users. <a class="freelinking external" href="http://www.typofonderie.com/alphabets/order/Allumi" rel="nofollow">Buy it!</a></p>
    <p>One weight: from € 50 / $ 65 for 2 users. <a class="freelinking external" href="http://www.typofonderie.com/alphabets/order/AllumiRegular" rel="nofollow">Buy it!</a></p>
