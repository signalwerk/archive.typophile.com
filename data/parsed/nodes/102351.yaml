  html: |-
    <p>In trying to help out finding Gustavian typefaces <a class="freelinking external" href="http://typophile.com/node/102344" rel="nofollow">here</a>, I ended up thrawling through old documents at Litteraturbanken.se, which is a good resource for swedish type from the time.</p>
    <p>Of course, my knowledge is somewhat limited in the area. <a class="freelinking external" href="http://litteraturbanken.se/#!forfattare/AlfEP/titlar/StroddaSkaldestycken/sida/15/faksimil" rel="nofollow">This anthology page</a> (and the rest of the book, click through if you want, press the little "5" icon to zoom) is printed almost entirely in an unfamiliar Italic, which is clearly not Caslon but shares some similar properties. Still, that looped w, that squarish a, that oblique g, that rather extreme cursiveness... what is this? Also note the Roman capital G's supremely right-leaning barb.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/lb2428951_5_0036_6486.jpeg"></div><p></p>
