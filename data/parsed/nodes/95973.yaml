    html: |-
      <p>Belloc, the background here is that in order to encode Arabic text you only need one character code per letter, but that in order to display Arabic text you need multiple glyphs per letter. Before smart glyph processing technologies like ACE and OpenType, some styles of Arabic text could be adequately displayed by performing character-level substitutions of presentation form characters (initial, medial and/or final, plus ligature presentation forms), so Unicode encoded a set of these for compatibility with such systems. Some fonts contain mappings for presentation forms even though they also contain e.g. OpenType Layout tables and are not expected to used the presentation form characters during display. This is done for backwards compatibility only, so that older documents can be displayed in those fonts.</p>
      <p>The other phenomenon that you will likely notice is that some of the characters in the Arabic range (0600) appear to be identical if you only look at the default encoded glyphs or at the Unicode glyph charts. This is because there are letters in various Arabic-script orthographies that take identical isolated forms but that have different joining behaviour and/or take different forms in initial, medial or final positions. Unicode made the decision to separately encode such characters, rather than relying on language-specific glyph processing to ensure correct display. [This topic can be especially confusing for newbies, because the differential behaviour of some letters is derived from different styles of the Arabic script, so in some fonts the difference will disappear. For example, the character ھ (<em>do chashmī he</em>) is a letter in the Urdu alphabet that is differentiated in Unicode from the Arabic <em>hā’</em> because in some common styles of type it takes different forms in different positions. But the <em>do chashmī he</em> originated as the standard form of <em>hā’</em> in the  Persian <em>nastaliq</em> style (which is the normative style for Urdu), and in a <em>nastaliq</em> font one would expect both the Arabic and Urdu letters to behave identically. Confusing?]</p>
