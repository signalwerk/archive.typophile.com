    <p>Given the table below, one can see that the only noticeable difference in the glyphs, is the one between the character U+FBE5 and the characters U+FBE4 and U+0620. For the other characters the glyphs from the Arial font are identical. One other thing that called my attention was the fact that indeed the Arial font considers the character pairs (FBE4, 06D0), (FBE2, 06C9) and (FBD7, 06C7) equivalent, as they have the same GlyphID's.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Unicode Arabic Letters_3781.png"></div><p></p>
