    votes: null
    html: |-
      <p>If this is really your first font, you've got talent. General advice: Try out all suggestions before ditching them, and add pics to your posts, you'll get more feedback.</p>
      <p>- Some of your curves are quirky. Try RMX tools if you want to make this into something worth selling.<br>
      - The middle strokes of 'a' and e are too thick.<br>
      - The top terminal of a is too small. Make space for it by moving it to the left, and decreasing the size of the bowl.<br>
      -The tail of 'a' is cut off at a weird angle.<br>
      - Lovely curves in b and d!<br>
      - c is falling backwards. Move the top to the right, or the bottom to the left.<br>
      - Top right of e is too squarish, not round.<br>
      - f is nice, but perhaps a bit wide. Check how it looks next to some other letters.<br>
      - Bottom terminal in g still too large. I'd ditch it entirely though.<br>
      - Because of your open serif structure, n and h look too wide next to o.<br>
      - Nice k!<br>
      - Compare the thin part of the curve in n, to that of p.<br>
      - o is too light<br>
      - You might want to try to enlarge that little spur on the q, to add character.<br>
      - The bottom serifs on the inside of p, q, f, and r need to be bigger than usual, to prevent the letter from falling.<br>
      - The shoulder in r is somewhat unsatisfying. I think it needs to increase in thickness already before it hits the ball terminal.<br>
      - s spine is too thick, and s is top-heavy. Make the top narrower, and compare the serifs.<br>
      - t's curve is too sharp, not round. The top horizontal stroke could extend a bit further to the right.<br>
      - u is too wide. It sometimes needs to be even smaller than n, but your n is also too wide, I think.<br>
      - Serifs on diagonals (v, w, etc.) lack character, and too small.<br>
      - Compare the serifs on top of x, to those on the bottom.<br>
      - I think you need to push the ball terminal of y to the right, less curvy.<br>
      - Nice subtle curves in z! Perhaps try a similar subtlety in k, to tone it down a bit, and make this more suitable a a text font.</p>
      <p>Good luck. Don't trust your critiques blindly, but try their suggestions. Take care of details, but don't lose the bigger picture. Look at stroke thickness, some of your thicks and thins are a bit out of tune.</p>
      <p>Cheers! jasper</p>
