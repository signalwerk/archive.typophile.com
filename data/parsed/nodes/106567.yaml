    <p>Hi,</p>
    <p>I got bit by the typography bug last winter and subsequently learned and experimented by making a typeface (lower case only as for now), as I didn't have access to formal teaching. I won't try to classify my influences as they're obvious enough. I'd be happy for any and all critique, as nitpicky or general as you like. I'm also interested in your ideas of serifed upright cursives in general and if the fact that some letters are cursive and some not bothers you.</p>
    <p><a class="freelinking external" href="http://users.tkk.fi/ituomi/sample.pdf" rel="nofollow">Link to sample pdf file</a></p>
    <p>Also if there's some other typefaces I could learn from, let me know!<br>
    I'm very grateful for your time, thank you!</p>
