      <p>Ohh, and start working on some caps. They'll give you helpful insights for your lowercase, and allow for a bit more creativity. Think of how you want to incorporate the 'cursive' style in the naturally more rigid uppercase.</p>
      <p>What you're trying to do with the middle stroke in 'a' and e might be a bit too calligraphic for this style of font.</p>
