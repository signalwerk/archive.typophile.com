    html: |-
      <p>Kerning might be too much but the final size should be taken into account too, if this is for a large(ish) size (above 80mm, 2 1/2 inches or so wide) I would think that it will be fine, much smaller and the strap and Re-elect will be too small. I share your concern on the “ho” but the “ma” is, to my eyes, good although I might close “as” a touch. I’m not really familiar with this kind of work but shouldn’t Re-elect be more prominent, the positioning is a problem though. In the strapline “OV”, “FO” are a touch too tight and “ER”, “OU” too loose and I would make the “NIN” evenly spaced between the verticals and ignore the spur on the righthand N (for the purpose of kerning).<br>
      Tim</p>
