      <p>Costa’s own small caps, possibly the regular weight, would be my suggestion. If you stick with the italic and present copy for the slogan you might make it a little larger, the f is slightly too far to the right to visually align with the T.<br>
      Try the tiniest bit of kerning on the om of Thomas and similarly on the an of Nancy, just a gnat’s. As for the colour, I don’t know what standard the printing is like on this but you should consider that if the two colours crash you might get a green halo, I would look at a more intense colour in a thinner block and either align it on the right or extend it a bit further.<br>
      Tim</p>
