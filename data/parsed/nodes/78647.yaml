  html: |-
    <p>Hi Typophiles –</p>
    <p>I am doing some pro bono work for the Muslim Jewish Conference <a href="http://www.mjconference.org" title="http://www.mjconference.org">http://www.mjconference.org</a>. Their goal is to disassemble stereotypes and prejudices between the muslim and jewish people—which I think is a very noble goal. They started out last year and need some help with their online and print appearance. Since I have nearly no knowledge of typefaces I need your help. </p>
    <p>The typeface should…</p>
    <ul>
    <li>handle big chunks of text;</li>
    <li>go along nicely with the logo (that was there already)</li>
    <li>maybe have a web version of it too</li>
    <li>and most importantly it must work for a very diverse audience.</li>
    </ul>
    <p>Maybe someone here can point me to the right direction. I look forward to your answers.</p>
    <p>All the best –<br>
    Ferdinand</p>
