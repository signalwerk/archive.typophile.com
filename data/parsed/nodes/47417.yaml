      <p>&gt; <em>Not sure if this was done intentionally by Slimbach, or by someone else assisting in the production. But I agree with you, it looks wrong.</em></p>
      <p>I did the production of Arno Pro and I was not sure myself. After further investigation it turned out this was a deliberate decision on Robert's part. (FWIW, in Garamond Premier Pro the baseline quotes are also different from the raised quotes)<br>
      I discussed this subject with Robert and he agreed that the baseline quotes should be changed.</p>
