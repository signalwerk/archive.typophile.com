      <p>Quick workaround: Use »guillemets« – if I remember correctly, they may be used in Romanian, too. Plus, they look nicer.<br>
      Dirty workaround (if it’s just for a couple of lines): Use the Right Double Quotation Mark and shift down its baseline.</p>
