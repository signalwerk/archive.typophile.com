      <p>Looks like the baseline quotation marks were based more on the comma and not the raised quotation marks. That's why they look larger and more upright. Not sure if this was done intentionally by Slimbach, or by someone else assisting in the production. But I agree with you, it looks wrong.</p>
      <p>-- K.</p>
