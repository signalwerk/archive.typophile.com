    <p>Hi guys!</p>
    <p>Do you like puzzles? </p>
    <p>I made a Logo for my music project a while back in mspaint on another computer.  I really like the font. It has nicely shaped 'O'  the arrows on the 'S', the lanting 't', the roman style 'V'.  Here it is below:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/What is this muvverfonting font_5209.jpg"></div><p></p>
    <p>I now need a banner printed and there is a special offer on right now , but the jpeg I made is way too small so I need to redo it as a vector. However I can't find the font.  I've tried the online image font search tools and even went through about 100 questions on one site trying to narrow it down. </p>
    <p>Maximum kudos for he/she who finds it first ! =)</p>
    <p>Hoping you can help. regards,</p>
    <p>David</p>
