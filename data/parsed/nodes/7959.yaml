    html: "<p>WOW! <br>Dear Tiffany! <br>Thank u a lot for ur time and critics! <br>i never thought i will get 1080 characters in a critic! <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\"> <br> <br>i tried to put the comments into this version. maybe its better. <br> <br><img src=\"http://www.typophile.com/forums/messages/29/55374.jpg\" alt=\"bkf_1206_a\"> <br> <br>So what happenes about the adverts, atthe top with the black lines: <br>they were only inspirational photographs i took in the school, to c what shades, what color system they might have. so they r aint designs, they r just screenshots from ACDC with the black borders on top and at the sides - depending if it was a portrait or a landscape pict. - i promise i gonna use fullbleed picts, in case of.. err... everywhere where it is possible ! <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\"> <br> <br>talky baloon direction:  <br>prety much u r right.. they r taking attention out of the poster. thanks. its remade. <br> <br>Posters: <br>white space? okay. i try. u might b right... <br>but tell me why have u thought so? <br>word spacing in the headlines? gee.. i soo much aint pay attention about theese. excuse me.. i'll correct it. <br> <br>u say: <br>\"talking voices making together one...\" <br>why i havent posted this thread earlyer? <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\"> <br>i realy could tell this as the story behind it to the client... <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\"> <br> <br>u say: <br>\"instead of the headline mimicking the color of the logo used I think it would be really strong to somehow use the 3 colors in the logo.\" <br>i dont get this. 3 coors + black typo could get expensive. 3+1 colors in one little logo could make a mess. <br> <br>what have u imagined about this?</p>"
