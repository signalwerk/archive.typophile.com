    html: "<p>The bottom sample of the logo: I read this as multiple voices. Your idead, Scott, of somehow overlapping, could also somehow help it read more along the lines of multiple voices heard as one voice. Or something like that? <br> <br>The use of the logo in the adverts and the posters: I wonder if the talky-balloon could face the other direction. Sometimes? In the adverts especially it causes visual direction away from the ad instead into the ad. Where/How it is used at the bottom of the posters however seems to be directional in a positive way. <br> <br>Adverts: Not sure about the different sizes used on the black bars. Might be better if the photos could be full-bleed. They look as if they are very dramatic and I think the forceful (too assymetrical?) use of black is diminishing this. <br> <br>Posters: The paragraphs seem too close to the sides, more white space? And instead of the headline mimicking the color of the logo used I think it would be really strong to somehow use the 3 colors in the logo. Maybe? The word spacing is too much in the headlines also.  <br> <br>Very fun solution overall.</p>"
