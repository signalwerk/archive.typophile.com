    <p>The Tugra is a fantastic calligraphic device. It was invented by Uthmani calligraphers to represent the seal of the Uthmani Sultan. However, it is now used for various sorts of calligraphic representations such as Quranic script, signatures, and logos.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/tugrapagesmall_5761.jpg"></div><p></p>
    <p>In an <a class="freelinking external" href="http://arabictype.wordpress.com/2011/05/31/tugra/" rel="nofollow">article on the Tugra</a>, I demonstrate how non-Arabs have contributed to the Arabic script, particularly in the refinement of the Thuluth calligraphic style and the invention of the Tugra by the Uthmani Turks. I also try to show the origins of the shape of the Turga and analyze its visual characteristics. Finally, I show the impact of the Tugra on the design of modern logos such as that used by Al-Jazerra and by Bahrain TV.</p>
    <p>I try to include some goodies with my blog entries, and this article includes a vector-based drawing of a Tugra in Adobe Illustrator format and an example of its usage with Arabic type in a PDF file. Both files are <a class="freelinking external" href="http://www.automason.com/download/tugra.zip" rel="nofollow">freely available for download and experimentation</a>.</p>
