    html: |-
      <p>We are in the process of registering copyrights on all of our font software with the USPTO. As I understand our lawyer's explanation, doing so allows one to sue for damages and costs. Without the formal registration, one can only sue for damages.</p>
      <p>As more font makers allow some sort of web embedding to their EULA. (We plan on updating our license to allow EOT) registering the copyright will become more important.</p>
      <p>One cannot stop font piracy, but with registered copyrights it can be viewed as a potential revenue stream, depending, of course, on who is the pirate.</p>
      <p>James</p>
