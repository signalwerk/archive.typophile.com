    html: |-
      <p>Hi Angie.<br>
      Been a while.</p>
      <p>Unfortunately the US will not allow copyright of fonts. They will, however, cover the digital data or software part. </p>
      <p>So what that means is: if somebody redistributes the digital file and you can prove so you have a case. I think even if they alter it slightly and rename. If, however, somebody scans images of your letters and redigitizes it… the law will not cover it. That being said I've managed to stop that end of it as well. Most foundries will drop fonts that are from questionable sources. People selling fonts that are not theirs don't want to be publicly embarrassed at being exposed. </p>
      <p>Some foundries add digital watermarks to help track pirated versions, but its very hard to stop. My last P22 font was being pirated 2 days after release.</p>
      <p>Stephen</p>
