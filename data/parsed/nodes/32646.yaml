    html: |-
      <p>HI,</p>
      <p>About the bend of the italic ascenders, I see what you mean, but my intention with it was to give it something of calligraphy, inspired in gothic fonts (like Duc de Berry) or calligraphy. I wanted to stylize the curved ascenders of the calligraphic fonts and combine it with the rigid forms of the monolines and slab serifs. Maybe you'r right, but for now I still like it. Hope I don't grow tired of it!:)</p>
      <p>About the "d" serif they usually go left on slab faces, and in this one they also go left. But in the light version in this pdf it is going right, due to a mistake that escaped my eye. Sorry about that. I agree with William Berkson, its distracting when it goes right.</p>
      <p>William Berkeson, i think the problem you see in the rhythm is due to the kerning which is not perfect. Or maybe the lack of kerning pairs that desappeared when I generated the font files (although I whanted it to work with the least kerning pairs as possible). I have to work on it.</p>
      <p>Thanks.</p>
