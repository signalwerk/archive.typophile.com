      <p>This has a very nice look. </p>
      <p>I think something may be slightly off in the rhythm of the letters. This is so nice that it is worth tracking down and correcting. I am not sure what it is, as it is subtle, but eg. check if the bd etc need to be just a hair wider? Or maybe a spacing issue?  </p>
      <p>On the terminals. Since most of the terminals have a slab serif, I am wondering whether the ends of the ce and some of the others without slabs need to be slightly fatter, especially in the light weights. (Compare the e in Frutiger and Myriad for some variations.)</p>
      <p>Do you think there is a gain in having the top serif on the d 'backwards'? I don't see it; it think it's distracting. </p>
      <p>For me the ascenders and descenders on the italic bend too much.</p>
