      <p>Very nice, especially the 'y' and the italic 'w'. Other glyphs as well of course, but those caught my eye.</p>
      <p>I agree with William Berkson, that the bend of the italic ascenders and descenders might be a bit much. But that's a matter of personal taste, I guess. But I don't see a reversed serif on the top of the 'd'? Serifs in slab faces usually go 'left' on the 'd'? Or do I misunderstand the comment? :)</p>
  - id: 193772
    user_id: 12433
    user_name: rui abreu
    user_path: null
