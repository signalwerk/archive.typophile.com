      <p>The lowercase might be a little too light compared to the upper. It's hard to say with so few characters.</p>
      <p>The "b" definitely needs some work. The right side seems to flatten out a bit (I think it should be more round). The bottom right corner looks a little too thick. And the stem on the left is too narrow. It also looks like your overshoot below the baseline might be a little much.</p>
      <p>And I'd probably shorten the lower horizontal bar on the "F" a bit</p>
      <p>Keep working on it and post another version once you've got more characters done.</p>
