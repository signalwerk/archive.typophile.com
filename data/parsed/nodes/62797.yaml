    html: |-
      <p>Here are a few more suggestions:</p>
      <p>• Generally, you'll want your vertical strokes to be a little thicker than the horizontals. This applies to  curved characters like the D and O, too.</p>
      <p>• Diagonal strokes will need to be a little thicker so they look the same weight as other strokes. Doing this will help the K match the other characters. Try moving the bottom leg of the K a little to the right so it extends beyond the top arm.</p>
      <p>you might want to check out Karen Cheng's book "Designing Type." I think it's a really good reference for these kind of rules</p>
      <p>• The crossbar on the H might be a bit too high?</p>
      <p>• The curve on the top of the D doesn't quite go with the bottom. You might want to try making the D a bt wider, too.</p>
