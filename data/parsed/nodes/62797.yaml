    html: |-
      <p>there are probably not enough characters to judge - you should start with /a/, /n/, /o/ and, as you already did, /b/ or /d/. lowercase characters are bette suitable to define the character of the typeface...</p>
      <p>your /b/ is too egg-shaped (compare the left part (where the bowl comes out of the stem) to the lower right part)</p>
      <p>the weight of the uppercase characters is unbalanced (/A/ too heavy compared to /D/ or /K/; heavy joins of stems at /A/ and /N/) your /O/ is too light on its left and right side. the vertical strokes should be thinner than the vertical ones, because of its optical weight.</p>
      <p>what works really great when designing your first typeface is a lot of drawing, erasing and trying again... with pen and paper, not on the screen</p>
