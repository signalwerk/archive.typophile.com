      <p>According to the horses mouth:<br>
      <a href="http://www.economist.com/help/DisplayHelp.cfm?folder=663377" title="http://www.economist.com/help/DisplayHelp.cfm?folder=663377">http://www.economist.com/help/DisplayHelp.cfm?folder=663377</a></p>
      <p>About the Logo:<br>
      "The corporate logotype of The Economist has evolved from the gothic lettering used on the cover of the first issue, published in 1843, to the box device designed in 1959 by Reynolds Stone, a British engraver and typographer. It now incorporates a font from The Economist Typefamily, a typeface created specifically for our use."</p>
      <p>The typeface:<br>
      "The Economist has used a specially designed family of typefaces since May 1991. Development work focused specifically on how the new type family would respond to electronic transmission and different printing conditions at The Economist's seven international production sites. In our recent re-design a new typeface, Officina, was introduced for cover headlines and all navigational information. Ecotype, The Economist’s main typeface, was also redrawn to make it easier to read. If you would like to buy a copy of our type family, or if you would simply like to find out more about it, please go to Agfa Monotype's website"</p>
      <p>A truly great publication! They document everything, the style guide regarding the use of English language within their articles is also pretty special:<br>
      <a href="http://www.economist.com/research/styleguide/?CFID=13548251&amp;CFTOKEN=61264069" title="http://www.economist.com/research/styleguide/?CFID=13548251&amp;CFTOKEN=61264069">http://www.economist.com/research/styleguide/?CFID=13548251&amp;CFTOKEN=6126...</a></p>
      <p>Hope that helps. Peace!</p>
