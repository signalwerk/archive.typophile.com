    <p>What is this font used in the opening screens of Stanley Kubrick's A Clockwork Orange?</p>
    <p><img src="/sites/default/files/old-images/aco-1_6248.jpg"><br><img src="/sites/default/files/old-images/aco2_5897.jpg"><br><img src="/sites/default/files/old-images/aco3_6203.jpg"></p>
    <p>My group is trying to imitate the title sequence for a class project. The closest we've been able to come up with is Akzidenz Grotesk BQ Bold Extended, but the S still looks a little off to me.</p>
    <p>What do you think?</p>
    <p>If for some reason the images don't show up, here is a link to the video clip: </p>
    <p><a href="http://" title="Click to visit an external URL." class="freelink freelink-external freelink-internal">http://</a></p>
