    <p>This is a gradient type design I recently "finished". I have used this type without the shadows in several projects but this was the initial idea. The idea stems from blackletter decorations I saw in an old bible. </p>
    <p>Comments are very welcome! </p>
    <p>Thanks Kai </p>
    <p>Full projectlink: <a href="https://www.behance.net/gallery/22219973/Shadow-Font">https://www.behance.net/gallery/22219973/Shadow-Font</a></p>
