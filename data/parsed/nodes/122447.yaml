    html: <p>I would suggest rearranging the shadows on letters that would make another letter if a part fell away. With imperfect vision and/or increased contrast, "E" becomes "F." and "L" becomes "I." The tail of "R" isn't quite shaped like punctuation but still seems a bit like a lost object lurking under a "P" all the same. Even if confusion is unlikely in practice, the differentiation will add more visual interest.</p>
