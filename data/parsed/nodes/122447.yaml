      <p>If you are attempting to produce a digital font version, as opposed to an eps format which allows gradual shading, check the discussions of the problems in in making a digital font of Roger Excoffon's Calypso type using a dot size variation. For example <a href="http://typophile.com/node/102099">http://typophile.com/node/102099</a><br>
      Don</p>
