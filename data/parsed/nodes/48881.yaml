    <p>Hi all.</p>
    <p>My mother works as a “laction consultant” (midwife with lactation as main area). And she wants a business card. I tried some designs, but I can’t get anything good out of it. </p>
    <p>She wants the font “avant garde” (gothic or somehting like that I think).</p>
    <p>As she is a stand-alone consultant, she doesn’t have a logotype - and I don’t think that’s necessery. Are these designs too plain? They aren’t mine, but I was thinking something like that.</p>
