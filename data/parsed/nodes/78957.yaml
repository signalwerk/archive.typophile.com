    <p>Hi,</p>
    <p>I'm thinking of buying Typetool and then later upgrading to Fontographer or Fontlab Studio.</p>
    <p>My first question is if I upgrade from Typetool to Fontographer later then would that mean I have to give up my license for Typetool and no longer be able to use it?</p>
    <p>Secondly, I currently use Windows and am thinking of moving to a Mac in the near future. In that case would I have to buy the Mac versions again?</p>
    <p>Thanks,<br>
    Jason</p>
