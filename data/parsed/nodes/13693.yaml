    <p><strong>Virus</strong> is is the type foundry of <a href="/wiki/Jonathan%20Barnbrook" class="freelinking" rel="nofollow">Jonathan Barnbrook</a>. You may rember Jonathan from such <a href="/wiki/Emigre" class="freelinking" rel="nofollow">Emigre</a> fonts as <a href="/wiki/Exocet" class="freelinking" rel="nofollow">Exocet</a>, <a href="/wiki/Mason" class="freelinking" rel="nofollow">Mason</a> and <a href="/wiki/Priori" class="freelinking" rel="nofollow">Priori</a>. But he has multitude of other counter culture typefaces stockpiled.</p>
    <p>Web site: <a href="http://www.virusfonts.com/" title="http://www.virusfonts.com/">http://www.virusfonts.com/</a></p>
