    <p>Hey everyone,<br>
    I'm doing a small survey of typography, comparing design students to design professionals. Please answer the questions that follow. It should only take a minute or two. Please included whether you're a student or a professional.</p>
    <p>1. Favorite Typeface<br>
    2. Most Used Typeface<br>
    3. Guilty Pleasure (you know that you shouldn't love it)<br>
    4. Most hated (get pretentious!)<br>
    5. Preferred method of adding emphasis (italics, bold).<br>
    6. Preferred Typeface (Choose one. List derived from separate typophile thread)<br>
              Bodoni<br>
              DIN<br>
              Frutiger<br>
              Futura<br>
              Garamond<br>
              Gotham<br>
              Helvetica<br>
              Minion<br>
              Scala<br>
              Univers<br>
    7. Favorite letterforms, upper and lowercase.</p>
    <p>Thanks Typophiles!!!!!!!!!!!!!!!!!!!!!!!!!!<br>
    Either post here or email me at <a href="mailto:reganfredjohnson@gmail.com">reganfredjohnson@gmail.com</a></p>
