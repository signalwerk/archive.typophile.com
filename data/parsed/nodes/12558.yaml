    <p>»Tage der Typografie« (Days of Typography) is organised by the German trade union »ver.di«. This event started the first time in 1998, meaning four days with workshops and lectures about typography, typedesign, design of books, posters and icons. During the years, designers like <a href="/wiki/Hans%20Peter%20Willberg" class="freelinking" rel="nofollow">Hans Peter Willberg</a>, <a href="/wiki/Gerard%20Unger" class="freelinking" rel="nofollow">Gerard Unger</a>, <a href="/wiki/Susanna%20Stammbach" class="freelinking" rel="nofollow">Susanna Stammbach</a> (CH), Prof. Klaus Detjen, <a href="/wiki/Peter%20Reichard" class="freelinking" rel="nofollow">Peter Reichard</a>, Adrian Lacour and Richard Frick (CH) hold some workshops and gave lectures.</p>
    <p>In 2005 ,»Tage der Typografie« took place at the end of May, starting with a lecture of <a href="/wiki/Ralf%20de%20Jong" class="freelinking" rel="nofollow">Ralf de Jong</a> (Author of the book »Detailtypografie«). The conference topic is »1000% detail« with workshops about how to design covers for music cds (Kai Büschl), the magic of signs (Gabine Heinze), bookdesign (<a href="/wiki/Typonauten" class="freelinking" rel="nofollow">Typonauten</a>) and how to show typefaces at their best (<a href="/wiki/spatium" class="freelinking" rel="nofollow">spatium</a> – magazine for typography).</p>
    <p>The website is in German only: <a href="http://www.tagedertypografie.de" title="http://www.tagedertypografie.de">http://www.tagedertypografie.de</a></p>
