    <div class="info">Submitted by <a href="/user/108" title="View user profile.">Miss Tiffany</a> : 28.Mar.2006 12.25pm </div>
      <p>=====</p>
    <p><strong>Special Issue of the Journal “Document Numérique”<br>
    Coordinators of this issue:<br>
    Yannis Haralambous (ENST Bretagne) &amp; Jacques André (IRISA Rennes)<br>
    </strong></p>
    <p>Context</p>
    <p>Fonts are essential resources, not only for publishing (on paper or on the Web) but also for all computer systems since it is through them that man and machine interact, at least at the level of text. In the last 30 years fonts have evolved in at least four main areas: their file format (from bitmap to vector outlines, with the data described in a programming language or stored in binary tables), their internationalization with respect to the writing systems of the world (including universal notation systems such as math formulas, music, electronic diagrams, braille, etc.), their “intelligence,” (in the sense that they supply an increasing amount of information to the operating system concerning typographical conventions like ligatures, contextual behavior during typesetting, diacritics, etc.), and finally, the security aspects (fonts being constantly accessed by the rendering engine, they are a high vulnerability factor for the system). Due to the increasing number of fonts and to the quantitative explosion of electronic documents on the Web, a new issue has emerged: that of copyright and the intellectual ownership of fonts.</p>
    <p>This special issue of “Document numérique” invites all researchers and developers in the area of fonts to submit papers 10-20 pages in length presenting their areas of R&amp;D, their points of view and their open questions. We seek survey papers, research papers, design and engineering papers, and experience papers; submitted papers should analyze the underlying issues rather than just describe issues, systems, and fonts. Submissions can be written in French or English.</p>
    <p>Themes</p>
    <ul>
    <li>Use of fonts</li>
    <li>Font file formats</li>
    <li>Rendering, glyph recognition</li>
    <li>Fonts and encodings, in particular: fonts and Unicode</li>
    <li>Font creation tools</li>
    <li>Protection of intellectual property in fonts</li>
    <li>From historical typefaces to digital fonts</li>
    <li>New perspectives</li>
    <li>...</li>
    </ul>
    <p>Editorial committee</p>
    <ul>
    <li>Jacques André, IRISA (Rennes) (coördinator)</li>
    <li>Patrick Andries, Conseils Hapax (Québec)</li>
    <li>Gábor Bella, ENST Bretagne (Brest)</li>
    <li>Michel Bovani</li>
    <li>Luc Devroye, MacGill (Montreal)</li>
    <li>Jean-Louis Estève, Estienne (Paris)</li>
    <li>Yannis Haralambous, ENST Bretagne (Brest) (coördinator)</li>
    <li>John Hudson, Tiro Typeworks</li>
    <li>Franck Jalleau, Estienne (Paris)</li>
    <li>Thomas Linard</li>
    <li>Ole Lund</li>
    <li>Hrant Papazian, The MicroFoundry</li>
    <li>Erik Spiekermann</li>
    <li>Beat Stamm, Microsoft</li>
    <li>Nicolas Taffin</li>
    <li>Sivan Toledo, Tel-Aviv University</li>
    </ul>
    <p>Schedule</p>
    <ul>
    <li>April 21st, 2006 if possible: short abstract (10-20 lines)</li>
    <li>June 18th, 2006: submission of papers,</li>
    <li>July 31st, 2006: notification of authors,</li>
    <li>September 30th, 2006: deadline for submission of final corrected version,</li>
    <li>December 2006: publication.</li>
    </ul>
    <p>Publisher and journal</p>
    <p>Revue Document numérique<br>
    Service éditorial Hermès<br>
    LAVOISIER<br>
    14, rue de Provigny<br>
    94236 CACHAN cedex<br>
    Tél. 01 47 40 67 00 - Fax 01 47 40 67 02<br>
    <a href="http://dn.revuesonline.com/">http://dn.revuesonline.com/</a></p>
    <p>Recommendations to authors</p>
    <p>Submissions are to be sent to <a href="mailto:docnum-typo@enst-bretagne.fr">Yannis Haralambous</a>  (coördinates see below) and have to respect the Hermès stylesheet, available on<br>
    <a href="http://dn.revuesonline.com/appel.jsp">http://dn.revuesonline.com/appel.jsp</a> (or by request to the coördinator)</p>
    <p>Papers should be 10 to 20 pages long. They can be written in French or English. Complete bibliography is required for each paper.</p>
    <p>Submissions should be sent in the form of PDF file. Final versions will be accepted in LaTeX, DocBook XML, OpenOffice or MS Word, and will be converted to LaTeX by the editor. Papers written in English will be translated to French, as far as possible.</p>
    <p>Authors are invited to submit papers which have not yet been published or submitted to publication.</p>
    <p>Contact</p>
    <p>Yannis Haralambous<br>
    Département Informatique<br>
    ENST Bretagne<br>
    29238 BREST Cedex 3<br>
    France<br>
    <a href="mailto:docnum-typo@enst-bretagne.fr">mailto:docnum-typo@enst-bretagne.fr</a></p>
    <p>=================================</p>
    <p><strong>Numéro spécial de la revue «Document Numérique»<br>
    Coordinateurs de ce numéro :<br>
    Yannis Haralambous (ENST Bretagne) &amp; Jacques André (IRISA Rennes)</strong></p>
    <p>Contexte</p>
    <p>Les fontes (ou «polices de caractères») sont des ressources essentielles non seulement pour leur usage en édition (papier ou sur le web) mais aussi pour tout système informatique puisque c’est à travers elles qu’interagissent l’homme et la machine, du moins en ce qui concerne le texte. Pendant les 30 dernières années nous avons assisté à quatre grandes évolutions de ces ressources : leur format informatique (du bitmap au vectoriel, avec des données décrites dans un langage de programmation ou stockées dans des tables binaires), leur adaptation aux systèmes d’écriture du monde entier (y compris les différents systèmes de notation universels : formules mathématiques, musique, circuits éléctroniques, braille, etc.), leur «intelligence» (dans le sens où elles fournissent de plus en plus d’informations au système d’exploitation concernant des opérations typographiques à effectuer comme les ligatures, le comportement contextuel lors de la composition, l’accentuation, etc.), et enfin leur sécurisation (les fontes étant ouvertes en permanence par le moteur d’affichage, elles constituent de points d’extrême vulnérabilité pour le système). La profusion de fontes et la diffusion de plus en plus croissante de documents électroniques sur le Web a également engendré une autre problématique : celle des droits d’auteur et de leur protection. Tous ces domaines sont toujours en évolution et il est temps de faire le point sur les recherches techniques liées aux «fontes».</p>
    <p>Ce numéro spécial de «Document numérique» invite tous les chercheurs et praticiens du domaine des fontes à soumettre des articles de 10-20 pages présentant leurs domaines de recherche ou de développement, leurs points de vue ou leurs interrogations. Les soumissions peuvent être rédigées en français (ou en anglais pour les individus ou équipes non francophones).</p>
    <p>Thèmes</p>
    <ul>
    <li>Utilisation des fontes</li>
    <li>Formats de fonte</li>
    <li>Rendu, reconnaissance de glyphes</li>
    <li>Fontes et codages, en particulier : fontes et Unicode</li>
    <li>Outils de création de fontes</li>
    <li>Protection de la propriété intellectuelle des fontes</li>
    <li>Caractères anciens (inventaire, reconnaissance, etc.)</li>
    <li>Nouvelles perspectives</li>
    <li>...</li>
    </ul>
    <p>Comité de rédaction</p>
    <ul>
    <li>Jacques André, IRISA (Rennes) (coordinateur)</li>
    <li>Patrick Andries, Conseils Hapax (Québec)</li>
    <li>Gábor Bella, ENST Bretagne (Brest)</li>
    <li>Michel Bovani</li>
    <li>Luc Devroye, MacGill (Montreal)</li>
    <li>Jean-Louis Estève, Estienne (Paris)</li>
    <li>Yannis Haralambous, ENST Bretagne (Brest) (coordinateur)</li>
    <li>John Hudson, Tiro Typeworks</li>
    <li>Franck Jalleau, Estienne (Paris)</li>
    <li>Thomas Linard</li>
    <li>Ole Lund</li>
    <li>Hrant Papazian, The MicroFoundry</li>
    <li>Erik Spiekermann</li>
    <li>Beat Stamm, Microsoft</li>
    <li>Nicolas Taffin</li>
    <li>Sivan Toledo, University of Tel-Aviv</li>
    </ul>
    <p>Calendrier</p>
    <ul>
    <li>21 avril 2006, si possible : déclaration d’intention et résumé (10-20 lignes)</li>
    <li>18 juin 2006 : soumission des articles,</li>
    <li>31 juillet 2006 : notification aux auteurs</li>
    <li>30 septembre 2006 : date limite remise de la version finale corrigée,</li>
    <li>décembre 2006 : parution du numéro spécial.</li>
    </ul>
    <p>L’éditeur et la revue</p>
    <p>Revue Document numérique<br>
    Service éditorial Hermès<br>
    LAVOISIER<br>
    14, rue de Provigny<br>
    94236 CACHAN cedex<br>
    Tél. 01 47 40 67 00 - Fax 01 47 40 67 02<br>
    <a href="http://dn.revuesonline.com/">http://dn.revuesonline.com/</a></p>
    <p>Recommandations aux auteurs</p>
    <p>Les soumissions sont à envoyer à <a href="mailto:docnum-typo@enst-bretagne.fr">Yannis Haralambous</a> (coordonnées ci-dessous) et devront respecter la feuille de style de la revue disponible sur <a href="http://dn.revuesonline.com/appel.jsp" title="http://dn.revuesonline.com/appel.jsp">http://dn.revuesonline.com/appel.jsp</a> (ou sur demande au coordinateur)</p>
    <p>Les articles auront une longueur comprise entre 10 et 20 pages. Ils seront écrits en français ou en anglais pour les non francophones. Une bibliographie pertinente et complète est demandée pour chaque article.</p>
    <p>Les soumissions doivent être envoyées sous forme de fichier PDF. La mise en page sera effectuée en LaTeX par la rédaction. Seront acceptés (et convertis en LaTeX) également des documents en XML DocBook, OpenOffice ou MS Word. Dans la mesure du possible, les articles écrits en anglais seront traduits en français.</p>
    <p>Les auteurs sont invités à proposer des articles originaux qui n’auraient pas déjà été publiés dans un autre cadre.</p>
    <p>Contact</p>
    <p>Yannis Haralambous<br>
    Département Informatique<br>
    ENST Bretagne<br>
    29238 BREST Cedex 3<br>
    France<br>
    <a href="mailto:docnum-typo@enst-bretagne.fr">mailto:docnum-typo@enst-bretagne.fr</a></p>
