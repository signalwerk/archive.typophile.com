    html: |-
      <p><cite>Maybe a line or a 2x2 square?</cite></p>
      <p>The smallest possible closed (!) contour consists of three overlaying (!) nodes. But even that is displayed in Photoshop as from a font size of round about 110 pixel.</p>
      <p>You have the following alternatives:</p>
      <p>1. You ignore the problem, because it is not a bug in your font, and provide a warning information in the manual of the font.</p>
      <p>2. You provide an OpenType layout feature, which replaces the d by a d without aligner and which is applied by default. Disadvantage: That does not work in all programs.</p>
      <p>3.  I did not try it and cannot exclude negative side effects / error in reasoning: The d of the font without aligner (font A) may hide the aligner of the other font (B), if the aligner is exactly placed with the coordinates of the highest point of the d of A in B. In this case you had to provide an info in the manual, that the user has to use A above B.</p>
      <p>Edited: Does not work in case of your two fonts, because the font with the dots is intended to overlay the font without dots.</p>
      <p>4. I did not try it and cannot exclude negative side effects / error in reasoning: You place the aligner horizontally very far away from the outline of the d (left side) and give the d a corresponding negative left side bearing. This would require short lines, because the bbox (or character) width cannot be bigger as a certain size (4000 units?), which I actually don’t remember.</p>
      <p>5. You provide a third font, that covers the aligner. That font is always on the top of the other two text layers and the text color must be the same as the color of the bottom text layer. That font could (and should!) only contain the aligner and space characters (same width and kerning as in the other two fonts), because otherwise the anti-aliasing would be doubled or you have a problem with half transparent layers. And you had to add an information to the manual of the font.</p>
      <p>But note, that users often don’t read manuals. I think, I would go with alternative 1.</p>
