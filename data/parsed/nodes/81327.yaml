    <p>I have 2 fonts that work together overlapped. One with letters and no dots, other with dots.<br>
    I have a problem I can't solve.<br>
    Only when I use a text box, the dots font is not matching, the linebase is different.<br>
    This happen in Photoshop and Illustrator. Works ok on InDesign.<br>
    I have the same metric values in both fonts, also the TrueType specific ones. I tried in OTF and TTf, nothing works.</p>
    <p>Now is the weirdest thing I ever seen.<br>
    If I draw a box with the caps height in the letter «d» the font will match the line spacing. Only happen with «d» glyph. The dot font have only dots and little square inside the caps height and baseline space.</p>
    <p>I also tried filling all the character set with my letters. It works always, excepting when i put the centered dot in «d» glyph.</p>
    <p>Does anybody knows the origin of this problem and how to solve it?</p>
    <p>PD: The strange thing with the «d» makes me think I'm completely crazy.</p>
