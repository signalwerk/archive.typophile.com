    <p>Hi all. I am new to FL. I have designed a font in illustrator and am importing it as an illustrator EPS file. This is for a uni project on a tight deadline.</p>
    <p>I have looked at similar blogs on here but still unsure what to do.</p>
    <p>the warning message:<br>
    ''Some glyphs in the font that is being exported contain open contours which cannot be exported as open into the font file''</p>
    <p>I have clicked the 'Contour' tab and selected 'correct connections', 'join broken contours' and 'close open contours' but this seems to have no effect.</p>
    <p>Is there any way to get round this or will I have to redraw in fontlab?</p>
    <p>thanks</p>
