    html: <p>It might be the little dots you can see in each of the rectangles. Illustrator (by default) places individual points at the center of shapes created using the rectangle tool and these can be carried over to FontLab when you import the art. You can eliminate them in Illustrator by selecting everything, opening the Attributes palette and clicking on the "Don't Show Center" button (middle left part of the palette). If you already got everything in FontLab, you'll have to manually delete them all.</p>
    html_clean: <p>It might be the little dots you can see in each of the rectangles. Illustrator (by default) places individual points at the center of shapes created using the rectangle tool and these can be carried over to FontLab when you import the art. You can eliminate them in Illustrator by selecting everything, opening the Attributes palette and clicking on the "Don't Show Center" button (middle left part of the palette). If you already got everything in FontLab, you'll have to manually delete them all.</p>
