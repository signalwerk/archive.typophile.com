      <p>Another pair of basic tips,  for moving AI files into Fontlab:<br>
      Flatten/expand appearance of any object not drawn with the pen tool, and<br>
      Save the exported file in the earliest version of Illustrator/EPS file available in the Illustrator version you are using -- e.g. Legacy formats.</p>
