    <p>Hey guys, I am developing a branding concept for a company that provides CFOs that require a salary of over 100,000 for  companies that need a financial leader for the big decisions.</p>
    <p>What would be some typefaces and combinations with the strong character of a CFO?: </p>
    <p>Strategist, Gentleman, DealMaker, Confidante, Friend, Diplomat, ClassAct, Genius, Wingman, Magician, Manager, Planner, Partner, Intellect, DragonSlayer, Workaholic, Advisor, PitBull Leader.</p>
    <p>Much appreciated.</p>
