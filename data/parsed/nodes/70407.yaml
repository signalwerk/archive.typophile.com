      <p>See - <a href="http://emigre.com/Editorial.php?sect=2" title="http://emigre.com/Editorial.php?sect=2">http://emigre.com/Editorial.php?sect=2</a> </p>
      <p>More important than rights around the design are rights around the name. Not just the original trademark name but also any rights around the designer's name - He's been dead for a while, but issuing a font "Elvis Presley Hand" may raise objections from his estate.</p>
