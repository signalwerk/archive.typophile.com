    <p>Hi.<br>
    I've been asked to redo a logo since the original vector art is lost and the company that designed it has gone under. There are no records as to which font is used.<br>
    Please see the logo and the font in question in the <a class="freelinking external" href="http://leadwithit.com/" rel="nofollow">top left corner</a>. Key characteristics are the pointed serifs, or tips, and the slanted e.<br>
    Any help would be greatly appreciated.</p>
