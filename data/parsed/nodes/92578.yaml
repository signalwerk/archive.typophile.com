      <p>“A communication regarding yoga” is somewhat vague. If you’re communicating with folks who are already into yoga, any typeface whose chakras are aligned would do. If you're promoting it to the public, you may choose to work with or against stereotype. This is pretty stereotypical...</p>
      <p><a href="http://www.myfonts.com/fonts/itc/tempus-sans/" title="http://www.myfonts.com/fonts/itc/tempus-sans/">http://www.myfonts.com/fonts/itc/tempus-sans/</a></p>
      <p>while something as prosaic as Helvetica is not.</p>
