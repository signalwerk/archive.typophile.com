    date_raw: 5 May 2010 — 12:53pm
    votes: null
    html: |-
      <p>Best advice for anything with many images is to batch them in Photoshop to 72dpi to use as placeholders for the real images, better for me than the coarse display options. If you use the same names for the files you can just replace the packaged image folder with the high resolution folder when layout is complete and the links won't break. Perhaps the latest InDesign copes well anyway, on my laptop it makes a big difference.</p>
      <p>Style sheets, master pages and baseline grids to keep everything easy.</p>
