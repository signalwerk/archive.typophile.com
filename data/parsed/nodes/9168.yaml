    html: '<p>nice job, raphael!  <br> <br>my comments:  <br>- the "a" looks too narrow;  <br>- the "straight vertical" strokes on rounded <br>characters (bdpqo) seems a little disturbing;  <br>- the uppercase and numbers are ok;  <br>- the section is great.  <br> <br>can we see a text sample? (even without the  <br>proper spacing, i think it is very helpful for  <br>critique)</p>'
