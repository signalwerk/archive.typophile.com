    html: <p>Raphael <br> <br>it really very nice <br> <br>I agree with eduardo that the vertical strokes on the rounded charactes are disturbing, maybe you can make them shorter in order to extend the curve. <br> <br>in the numerals 6 abd 9 I think that the eyes close to abrupt, maybe you can give them a more curvy way to close <br> <br>in your @ I think the a is too big and too square. <br> <br>the lc 2 is too heavy in the upper curve <br> <br>in the UC 7 i think the diagonal is a little bit to the left. <br> <br>anyway, these is a great font, i am anxious to see it working on a long text <br> <br>CG</p>
