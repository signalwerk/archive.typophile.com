    <!--/attachment--><!--/attachment--><p> <br> <br>This is my first type design, though this is probably the fifth version. It is necessary to precise that I haven't start the spacing job, I don't really know what to start with. I understand that a good spacing job will make the kerning job easier (a little), then how to do a good spacing. If the regular goes well, I planned to do the italics, small caps and at least three weights. Every feedback will be welcome. <br> <br>Thanks from Montreal <br>Rapha</p>
