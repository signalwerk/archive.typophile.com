    <p>Ludwig <span class="amp">&amp;</span> Mayer was a large typefoundry in Frankfurt, Germany, which closed in 1984. When it closed its doors, its collection passed to <a href="/node/add/wiki?edit%5Btitle%5D=Neufville" title="Create node &quot;Neufville&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">Neufville</a>.</p>
    <p>Some of its many typefaces included <a href="/node/13491" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-lost">Elegance</a> (by <a href="/node/13485/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Karlgeorg Hoefer</a>), all the fonts of <a href="/node/13376/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Jakob Erbar</a> (including, obviously enough, <a href="/node/13675/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Erbar</a>), and&nbsp;Rhapsodie.</p>
