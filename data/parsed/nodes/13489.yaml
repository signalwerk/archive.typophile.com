    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indicies" title="Create node &quot;Indicies&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indicies</a>&nbsp;: <a href="/wiki/foundries" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Foundries</a>&nbsp;: Ludwig and&nbsp;Mayer</strong></p>
    <p>Ludwig <span class="amp">&amp;</span> Mayer was a large typefoundry in Frankfurt, Germany, which closed in 1984. When it closed its doors, its collection passed to <a href="/node/add/wiki?edit%5Btitle%5D=Neufville" title="Create node &quot;Neufville&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Neufville</a>.</p>
    <p>Some of its many typefaces included <a href="/node/13491" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Elegance</a> (by <a href="/node/13485" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Karlgeorg Hoefer</a>), all the fonts of <a href="/node/13376" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Jakob Erbar</a> (including, obviously enough, <a href="/node/13675" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Erbar</a>), and&nbsp;Rhapsodie.</p>
