    <p><strong><a href="/wiki/Indicies" class="freelinking" rel="nofollow">Indicies</a> : <a href="/wiki/Foundries" class="freelinking" rel="nofollow">Foundries</a> : Ludwig and Mayer</strong></p>
    <p>Ludwig &amp; Mayer was a large typefoundry in Frankfurt, Germany, which closed in 1984. When it closed its doors, its collection passed to <a href="/wiki/Neufville" class="freelinking" rel="nofollow">Neufville</a>.</p>
    <p>Some of its many typefaces included <a href="/wiki/Elegance" class="freelinking" rel="nofollow">Elegance</a> (by <a href="/wiki/Karlgeorg%20Hoefer" class="freelinking" rel="nofollow">Karlgeorg Hoefer</a>), all the fonts of <a href="/wiki/Jakob%20Erbar" class="freelinking" rel="nofollow">Jakob Erbar</a> (including, obviously enough, <a href="/wiki/Erbar" class="freelinking" rel="nofollow">Erbar</a>), and Rhapsodie.</p>
