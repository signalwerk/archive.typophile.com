      <p></p><div class="imageWrap"><img src="http://typophile.com/files/schwabacher-empathy_3940.gif"></div><p></p>
      <p>I'm not into the Christian part of xmas or any of the hype, but I try hard to live by these principals. <em>"Human is"</em> --- to forgive, to empathize and have compassion for others, no matter what you believe personally.</p>
      <p>In other words, it's okay to differ---diversity is strength &amp; richness in any community---as long as after all is said and done we can put aside our ideology and be human, forgive each other's errors and faults, and try to see each other's point of view.</p>
      <p>That's not hiding behind a veil of relativism, but an explanation of empathy.</p>
      <p>Wishing all typophiles the very best.</p>
      <p>j a m e s</p>
    html_clean: |-
