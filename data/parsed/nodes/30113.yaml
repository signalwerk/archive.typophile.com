      <p>Hi Claudio. The ancient Greek word "polis" meant city, or city state. <a href="http://en.wikipedia.org/wiki/Polis" rel="nofollow">A link to a solid and reliably-sourced Wikipedia article</a>.</p>
      <p>"Politic" is derived from "polis".</p>
      <p><em>Also politics (from the Greek πολιτικος; πόλις was the community of citizens) is meant to be a positive word, and any word is inherently positive, at least in its root</em></p>
      <p>My Shorter Oxford English Dictionary gives this definition for "politic":<br>
      <strong>Politic</strong> <em>a.</em> and  Late ME. [-(O)Fr. <em>politique</em> sb. and adj. - L. <em>politicus</em> _ Gr. civic, civil political (as sb., politician), f. citizen, f. city, state; see -ic.]  <em>adj.</em> †<strong>1.</strong> = Political <em>a.</em> 1 (by which it is now superseded)) -1756. <strong>b.</strong> Pertaining to a constitutional state, as dist. from a despotism; constitutional (<em>rare</em>) 1449. <strong>2.</strong> Characterized by policy; (of persons) actions or sagacious, prudent, shrewd; (of actions or things) judicious, expedient, skillfully contrived. Late ME. <strong>b.</strong> In a sinister sense: scheming, crafty, cunning; diplomatic, artfully contriving or contrived 1580.</p>
      <p><em>. . . and any word is inherently positive, at least in its root</em></p>
      <p>That makes no sense to me. Even tho I find this assertion lacking in merit I send you my best wishes for the festive season. Keep the spirit of joy alive in your heart Claudio, and go on doing what you do best. Go with what makes sense to you and don't let anyone else, least of all me, tell you what to do or what to believe.</p>
      <p>Kind &amp; warm regards,<br>
      j a m e s</p>
