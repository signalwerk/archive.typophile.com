    html: |-
      <p>Thank you all for your reply.</p>
      <p>Jens &amp; Jan - In fact, I started having my initial question after I had had a look at the letterforms of Helvetica on the <strong>Die Neue Haas Grotesk</strong> specimen book and on the <strong>Helvetica Plakat</strong> specimen book; these letterforms look neither like (not Neue) Helvetica nor like Neue Helvetica.</p>
      <p>Looking at the logos in question, my first thought was that "Berthold Helvetica" (if it's the same as AG Book of Berthold) had been used.</p>
      <p>Finally, what riccard0 has to say may be the reason; before the advent of the digital technology, especially with phototypesetting being around, it may be difficult to maintain consistent contours in letterforms.</p>
      <p>I don't know...</p>
      <p>RG</p>
