    <p>Hello!</p>
    <p>They always say that the AmericanAirlines and the Lufthansa logo use Helvetica. However, the "a" or the "r" don't look like any version of Helvetica, but are very similar to AG Book.</p>
    <p>So, do they use (some version of) Helvetica or AG Book? (Please see samples attached.)</p>
    <p>Thanks,</p>
    <p>RG</p>
