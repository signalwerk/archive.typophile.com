    html: <p>Indigo is quite impressive, especially on matte. You should ask your printer if they have any spot colours in stock for their Indigo. Because that might make the difference. Indigos can print white ink which might be really striking. But it wouldn't be worth it price-wise if they had to order in the spot colour just for your job.  Maybe print indigo cover and a few inserts and the rest laser?</p>
