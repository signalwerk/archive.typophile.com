    html: <p>I have found on Indigo prints there is a yellow haze (four color) in some instances and some color shift. Don't know how to quantify it, it just seems to exist to my eye. Also I have seen splotchy printing on solids (that was three years ago and I do not know if they have corrected it but I have been hesitant to try again). Overall it is quite nice and it does allow, at least with my printer, each piece to be personalized (I have never tried this though).</p>
