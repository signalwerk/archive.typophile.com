      <p>&gt; splotchy printing on solids</p>
      <p>We've been placing quite a lot of our work recently on Indigo machines. Many pieces use areas of flood colour and have yet come across this problem. I know that on older digital presses flat colour, especially blues/pure cyan, banded horribly. </p>
