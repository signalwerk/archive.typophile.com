    html: |-
      <p>Indigo is a digital printing machine, very offset-like in quality. Successive generations have been improving a lot. It’s an ideal way to produce small runs.</p>
      <p>Viz: <a href="http://h10088.www1.hp.com/cda/gap/display/main/index.jsp?zn=gap&amp;cp=20000-13698-16021_4041_100" title="http://h10088.www1.hp.com/cda/gap/display/main/index.jsp?zn=gap&amp;cp=20000-13698-16021_4041_100">http://h10088.www1.hp.com/cda/gap/display/main/index.jsp?zn=gap&amp;cp=20000...</a></p>
      <p>Indigo uses paper that has been chemically optimized for it. As it is a lot of paper companies offer different qualities, so there is a wide range of stock available (at least that is the case in the Netherlands).</p>
      <p>The latest generations of Indigo’s can print white with a special formula. Depending on the design and stock several runs are needed to get decent coverage.</p>
      <p><a href="http://whattheythink.com/news/44305-hp-expands-with-first-ever-white-ink-digital-sheet-fed/" title="http://whattheythink.com/news/44305-hp-expands-with-first-ever-white-ink-digital-sheet-fed/">http://whattheythink.com/news/44305-hp-expands-with-first-ever-white-ink...</a></p>
