      <p>Adam, if you want a nice source of inspiration concerning old French commercial signage, check out the book “Entrez: Signs of France” (S Rothfeld &amp; A Aciman, Artisan, New York, 2001). In fact many of the examples happen to be for charcuterie shops!</p>
