    html: |-
      <p>Strange indeed. But lovely in its own way. It reminds of ’Choc’ (by Roger Excoffon?) in it’s top-heaviness on the curved characters but it’s also stencil-like on the ’A’... I also think it may never have been digitised.</p>
      <p>Like Hrants ref to a good book on old commercial signage, I would recommend Arnold Schwartzman’s ’Designage’ (pub. Chronicle Books, San Francisco 1998) for further reading.</p>
