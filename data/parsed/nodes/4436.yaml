    html: <p>Hrant,  <br> <br>please look at <a href="http://www.twardoch.com/tmp/verdanahints.htm" target="_blank">http://www.twardoch.com/tmp/verdanahints.htm</a>  <br> <br>I created a "Verdana Semibold" by just interpolating Verdana Regular and Verdana Bold at 50% (you can see it at the glyph sample). Then, original hinting of Verdana Regular and Verdana Bold is shown.  <br> <br>Below, two variants of FontLab-autohinted "Verdana Semibold" are shown. It is pure FontLab autohinting, with no manually set instructions.  <br> <br>As you can see, with just a small modification of PPM parameters, it is possible to enforce very bold appearance of the Semibold -- actually, even bolder than of the actual Bold (esp. at the PPMs 14 to 16 which IMO are hinted too light in Verdana Bold).  <br> <br>Adam <br></p>
