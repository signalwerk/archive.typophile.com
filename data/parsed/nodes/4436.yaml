    html: <p>Hrant,  <br> <br>in hinting terms, "stems" are both horizontal and vertical "corridors" of node alignment. You can control the thresholds when PPMs switch to 2, 3, 4 etc. pixels for both horizontal and vertical stems, separately. So you can control the stroke contrast, and keep it linear. As for arches, you cannot hint them explicitly -- all Type 1 hints and most TrueType instructions work in either horizontal or vertical direction only (there is some diagonal control in TTH).  <br> <br>You say "setting a threshold (as opposed to tediously hinting every glyph)". Stem control does not occur OPPOSED to hinting, it IS hinting. In fact, it is the fundament of any hinting -- you always start with the font-wide parameters (that go into the control value table "cvt" and the font preprogram "prep").  <br> <br>Only after you've reasonably set the font-wide hinting parameters such as stems and alignment zones, you start with per-glyph hinting, since instructing individual glyphs is basically fixing and fine-tuning what the font-wide hinting has achieved.  <br> <br>Adam <br></p>
