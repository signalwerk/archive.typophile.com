    html: "<p>But don't let the process become the point! And it shouldn't be so linear. In practice it's very iterative: you make some glyphs, you see how they behave in <i>groups</i> (where spacing already comes in), you can even allow the [eventual] kerning to affect the letterforms! Even hinting can have such a \"backwards\" effect - just look at the Bolds in the MS core fonts - they wouldn't have been so bold without the necessity to eventually not have to hint every single stem, etc. <br> <br>Practically speaking, the greatest amount of iteration will be between the letterforms and the sidebearings: because the <i>relationship between the Black and the White</i> is what matters most, the \"internal\" counters of glyphs are tied to the \"external\" sidebearings. So you make some key glyphs (different for each designer, but also dependent on the intended use of the font - for example a display face will rely more on the memorability of individual glyphs, while a text face will rely more on the integration of the whole), then see how they fit together, modify them, add some more glyphs, try those in combo, modify, etc. Yeah, it's a pain.  :-) <br> <br>hhp <br></p>"
    html_clean: "<p>But don't let the process become the point! And it shouldn't be so linear. In practice it's very iterative: you make some glyphs, you see how they behave in <i>groups</i> (where spacing already comes in), you can even allow the [eventual] kerning to affect the letterforms! Even hinting can have such a \"backwards\" effect - just look at the Bolds in the MS core fonts - they wouldn't have been so bold without the necessity to eventually not have to hint every single stem, etc. <br> <br>Practically speaking, the greatest amount of iteration will be between the letterforms and the sidebearings: because the <i>relationship between the Black and the White</i> is what matters most, the \"internal\" counters of glyphs are tied to the \"external\" sidebearings. So you make some key glyphs (different for each designer, but also dependent on the intended use of the font - for example a display face will rely more on the memorability of individual glyphs, while a text face will rely more on the integration of the whole), then see how they fit together, modify them, add some more glyphs, try those in combo, modify, etc. Yeah, it's a pain.  :-) <br> <br>hhp <br></p>"
