    html: <p>Verdana, like Georgia, was designed by making bitmaps and then drawing outlines that wrapped to those bitmaps without very much hinting. That approach likely explains why the bolds are so bold, regardless of whether they actually needed to be so bold in order to achieve the same result.</p>
