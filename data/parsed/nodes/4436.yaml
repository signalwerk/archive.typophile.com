  html: "<p>When building a typeface, what is a reasonable order of tasks? For example: <br> <br>1. Complete all glyphs <br>2. Set sidebearings <br>3. Set kerning pairs <br>4. Hint all glyphs <br>5. Test and refine any settings <br> <br>I feel like I need a process in place to guide me. I need order. Any thoughts?</p>"
