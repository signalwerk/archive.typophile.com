    html: <p>I agree with Hrant that it's very iterative. <br> <br>That being said, the most important thing is to try to finalize the spacing before getting into kerning. If you mess with the spacing much after you get into kerning, you will likely need to throw out all your kerning and start over again. <br> <br>If you're working in PostScript style outlines, there's no reason not to hint your glyphs as you're working on them. If you're working with TrueType outlines, you pretty much have to leave hinting to absolute dead last. <br> <br>Other than that, it's a matter of taste and preference. <br> <br>Personally, working with PS outlines, I complete a handful of glyphs, and while I'm working on them I space and hint them. I then test them together and fix the spacing some more. Then I continue to expand the glyph complement (hinting all the while), periodically stopping and refining the spacing. <br> <br>The typeface I'm working on right now I have tweaked the spacing too much, so I will be tossing out the moderate amount of kerning I already did and starting over. I didn't invest a lot of time in the kerning because I knew I wasn't 100% done with the spacing. <br> <br>Hope that's of some help. <br> <br>Cheers, <br> <br>T</p>
