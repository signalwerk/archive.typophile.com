    html: "<p>It comes down to the near-requirement of avoiding touching: you want the words to set tightly, but scripts that have letters with a lot of lateral \"protrusions\" will collide a lot (with kerning off). You can either set everything loose and use a ton of negative pairs to correct, or you can set everything with \"natural\" tightness and use some positive pairs to remove collisions. Which way you go depends on a number of things, like the degree of collision in the script, the intended user base of the font, but also the amount of time/effort you want/can_afford_to put into the design.  And this last consideration isn't limited to lazy/cheap people like me. :-) The MS core fonts have too-dark Bolds basically because it would have been ridiculous* to hint every single stem to snap wider to two pixels. <br> <br>* Both in effort and resultant file size - note that about 50% of the file of an MS core font is the hinting!! <br> <br>Let me give a real example: Armenian has a fair amount of \"collision potential\" (mostly in the descenders). You can tame the protrusions, but that's culturally and functionally (think boumas) bad - although you still do it a little bit (in the same way that a \"g\" in a [good] Latin text face needs to look slightly cramped). To save myself having to set everything loose and then tighten with a ton of pairs, I went the other way. With 546 pairs* I got really good texture. My estimate of how many pairs would have been required with the other (non-kern-reliant) method is 3-4000, so a lot more work. With kerning off, this kern-reliant method will produce some collisions when set without kerning, but: it will also produce better \"x-band\" spacing; people with kerning off aren't likely to mind some touching anyway. <br> <br>* Tellingly (although not surprisingly) about half of the pairs were positive - very unlike the typical Latin font. BTW, Mana uses some reliance on positive pairs too - this allows it to be tight (unlike Verdana for example). Over 1/3-rd of Mana's pairs are positive. <br> <br>&gt; application of kerning should be part of the language <br>&gt; shaping engine, not something turned on by the user. <br> <br>But in practice the user -and the app- end up sharing the responsability. Most notably, MS Word does support kerning, but the user has to turn it on (and every time) - never gonna happen.  :-( <br> <br>hhp <br></p>"
    html_clean: "<p>It comes down to the near-requirement of avoiding touching: you want the words to set tightly, but scripts that have letters with a lot of lateral \"protrusions\" will collide a lot (with kerning off). You can either set everything loose and use a ton of negative pairs to correct, or you can set everything with \"natural\" tightness and use some positive pairs to remove collisions. Which way you go depends on a number of things, like the degree of collision in the script, the intended user base of the font, but also the amount of time/effort you want/can_afford_to put into the design.  And this last consideration isn't limited to lazy/cheap people like me. :-) The MS core fonts have too-dark Bolds basically because it would have been ridiculous* to hint every single stem to snap wider to two pixels. <br> <br>* Both in effort and resultant file size - note that about 50% of the file of an MS core font is the hinting!! <br> <br>Let me give a real example: Armenian has a fair amount of \"collision potential\" (mostly in the descenders). You can tame the protrusions, but that's culturally and functionally (think boumas) bad - although you still do it a little bit (in the same way that a \"g\" in a [good] Latin text face needs to look slightly cramped). To save myself having to set everything loose and then tighten with a ton of pairs, I went the other way. With 546 pairs* I got really good texture. My estimate of how many pairs would have been required with the other (non-kern-reliant) method is 3-4000, so a lot more work. With kerning off, this kern-reliant method will produce some collisions when set without kerning, but: it will also produce better \"x-band\" spacing; people with kerning off aren't likely to mind some touching anyway. <br> <br>* Tellingly (although not surprisingly) about half of the pairs were positive - very unlike the typical Latin font. BTW, Mana uses some reliance on positive pairs too - this allows it to be tight (unlike Verdana for example). Over 1/3-rd of Mana's pairs are positive. <br> <br>&gt; application of kerning should be part of the language <br>&gt; shaping engine, not something turned on by the user. <br> <br>But in practice the user -and the app- end up sharing the responsability. Most notably, MS Word does support kerning, but the user has to turn it on (and every time) - never gonna happen.  :-( <br> <br>hhp <br></p>"
  - id: 32722
    user: 909
