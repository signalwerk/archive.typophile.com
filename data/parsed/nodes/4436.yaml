    html: "<p>Hrant wrote: <br> <br>\"The MS core fonts have too-dark Bolds basically because it would have been ridiculous* to hint every single stem to snap wider to two pixels.\" <br> <br>\"* Both in effort and resultant file size - note that about 50% of the file of an MS core font is the hinting!!\" <br> <br>That is simply untrue. You're presenting incorrect speculation as fact (again). Given a well-hinted TrueType font in the first place, it is literally a single line of code that accomplishes this. <br> <br>In any superhinted TT font, one is controlling when the stems change from one thickness to the next, at least for most of the lower levels (one, two, three pixels thick). This is especially necessary when there's a matching italic, since one needs to make sure they break at the same ppem sizes for those lower levels. <br> <br>In other words, the \"additonal\" work involved and font size added, rounded to the nearest whole number as a percentage, is zero. (Though of course if one had already done the detailed hinting and then changed the stem widths, that would entail more work. But like spacing vs. kerning, that's not the order one does these tasks in.) <br> <br>If I were to speculate, I'd *guess* that the reason the bolds are so heavy for those fonts is to keep them more WYSIWYG between what they look like at typical screen sizes and what they look like in print. But that would be just speculation, though with a little more basis. <br> <br>This is somehow comforting. I think I had agreed with the last half dozen posts of Hrant's that I had read. I was wondering if it was a sign of the apocalypse or something.  <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\"> <br> <br>That aside, I do understand and agree with Hrant's comments about different scripts needing a different spacing vs. kerning strategy. I believe my original comments apply reasonably well to Latin, Greek and Cyrillic. <br> <br>Regards, <br> <br>T</p>"
