    html: <p>That has more to do with issues around shapes where changing the shape requires delta hints, which do add (substantially) to file size. A global stem width adjustment does not affect file size significantly, given that individual stems already have their own CVTs, and on top of that they have inheritance set up so that all the vertical stems can be controlled at one go. <br> <br>Another way of realizing that this is not such a big deal is to remember that plenty of superhinted fonts that do not have such a strong weight difference in the outlines (between regular and bold) have been superhinted so that the bold is consistently heavier than the regular even at low ppem sizes. Times New Roman, Arial, Palatino Linotype, and a bunch of others.... <br> <br>Regards, <br> <br>T</p>
