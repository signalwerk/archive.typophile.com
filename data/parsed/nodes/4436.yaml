    html: "<p>A follow-up question: <br>I can believe that making a Bold's outlines snap [wider] to two pixels is simply a matter of setting a threshold  (as opposed to tediously hinting every glyph), but: if this applies only to stems (and not arches for example) is it possible that this would create an imbalance in a glyph's rendering, like in fact sometimes introducing stroke contrast? Especially in a monoweight* font like Verdana. <br> <br>* As a side question: is that a good term, or is \"monoline\" better? <br> <br>hhp <br></p>"
