    html: "<p>Adam, naughty boy - thou shalt not modify MS fonts!  ;-) <br> <br>&gt; That approach likely explains why the bolds are so bold <br> <br>I still can't see that. The fact that the onscreen stem difference between the Regular and Bold has to be 100% (below 17 PPEM) only translates to the outlines needing to have the same relationship <i>if</i> hinting effort is an issue. <br> <br>&gt; Which has the effect of making the screen <br>&gt; font more WYSIWYG relative to the outline font. <br> <br>Only below 17 PPEM. Above that it's only 50% (upto ~25). And consider that the higher the PPEM the more WYSIWYG a screen font becomes... So what were they really shooting for? <br> <br>BTW, in this old interview <br><a href=\"http://www.will-harris.com/verdana-georgia.htm\" target=\"_blank\">http://www.will-harris.com/verdana-georgia.htm</a> <br>Carter says \"The bitmaps dictated the weight.\" <br>Could he really have meant they \"dictated\" via WYSIWYG? Or isn't it probable it was via <i>hinting</i>? <br> <br>Returning to the \"easy\" bit: exactly what becomes <i>easier</i> by making the Bold too dark? WYSIWYG becomes easier?! That doesn't seem to make sense. <br> <br>hhp <br></p>"
