    html: <p><i>especially for some non-Latin scripts where building kerning on top of "perfect" base spacing can become prohibitive</i> <br> <br>I don't understand this statement, Hrant; can you explain what you mean by prohibitive? I do agree, if this is what you are getting at, that some scripts require extensive kerning to achieve acceptable basic spacing, i.e. that kerning is not always 'exceptions' to basic spacing as it usually is in Latin fonts. In that case, application of kerning should be part of the language shaping engine, not something turned on by the user.</p>
