    html: <p>I've done some "superhinting", but not tons - so maybe I don't realize how easy it is to pop all the stems wider. On the other hand, your explanation for the exteme weight of the MS core Bolds doesn't seem very probable to me. There's so little WYSIWYG between <i>different sizes of the Geogia bitmaps</i> (which is actually good news though), much less between the bitmaps and print - so WYSIWYG of <i>the color relationship between screen and print</i> seems pretty far-fetched. Not least because it would have to be based on a specific PPEM! Kind of destroys the point. <br> <br>Maybe it was a filesize issue? <br> <br>hhp <br></p>
