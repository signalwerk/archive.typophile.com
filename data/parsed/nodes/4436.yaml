    html: <p>&gt; finalize the spacing before getting into kerning. <br> <br>On the other hand, the intended use of the font can affect the relationship between spacing and kerning (especially for some non-Latin scripts where building kerning on top of "perfect" base spacing can become prohibitive). If you can safely assume that kerning will be available virtually all the time*, you can make different (more efficient) spacing decisions, and sometimes even different letterform decisions (like in the beak of the "r" or the size of the serifs on the "v"). <br> <br>* And when it fails because of amateurism on the user's end, such users won't notice anyway! <br> <br>hhp <br></p>
