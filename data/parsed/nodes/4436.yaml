    date: 2004-04-23T19:53:00
    date_raw: 23 Apr 2004 — 7:53pm
    votes: null
    html: "<p>Right. Which has the effect of making the screen font more WYSIWYG relative to the outline font. <br> <br>In the broader sense, Hrant is right, and that's what Vinnie was saying: the closer the outlines are to the desired bitmap pattern, the easier it is to achieve that look with hinting. It's just that the *particular* issue of weight is one that is trivially easy to adjust with hinting. Well, in TrueType, anyway. <br> <br>(Note: Type 1 and PostScript flavored OpenType have a concept called \"force bold\" which accomplishes some of the same goals, in a cruder but even easier way.) <br> <br>Regards, <br> <br>T</p>"
