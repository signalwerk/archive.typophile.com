      <p>There are trends in all forms of design — architecture, clothing, interior design, graphic design, etc. — and many designers like to keep up with trends so their work looks current and perhaps is more likely to win awards.</p>
      <p>But I wouldn't consider the trends in your link to be prominent, and some of the trends you mention seem more like experimental work by college students than what most designers are actually doing.  </p>
      <p>The vast majority of graphic design is done for businesses and corporations (because they have the budgets to pay for it) and many of them are conservative.  </p>
      <p>One general trend I've noticed is a preference for lighter weight fonts in headlines.</p>
      <p>If you're looking for trends, you might check the websites of large, successful design firms (Pentagram, for example) and advertising agencies. There are also magazines read by many professionals, such as Communication Arts.</p>
