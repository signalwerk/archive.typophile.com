      <div class="comment-spam-body"><p>"My question is, do you think using popular trends in your designs is a good or bad thing? Does it show that your work is "of the times" and that you have your finger on the pulse of the moment or are you simply being an unoriginal follower?"</p>
      <p>The answer is, it depends. It depends on the client, the application, the audience, and the objective. Designing snowboard designs for Burton is very different than designing logos for Fortune 100 companies.</p>
      <p>I'm a big fan of Paul Rand's writings, and the lesson that I take from him it to always look for  the simplest, most elegant design solution to any problem. Simplicity, all other things being equal, translates into strength and durability. That said I'm not an ideologue and I'm happy to bend rules or break them outright if the ends justify the means and it works.</p>
      <p>I see a lot of trendy design that I love. It's exciting, fresh, and different, even if it's a flash in the pan and I know it will looked ridiculously dated in a few years. If it is strong enough it will become iconic and get woven into the lexicon of design. A lot of stuff from the 50's, for example, is "of a piece" and dove straight into a design cul-de-sac, but it still makes us smile when we see it.</p>
      <p>Some design is meant to endure, like corporate logos and book design. Some of it, like magazine design, is ephemeral and makes no pretense to longevity. Certainly watching trends and integrating them into your work as opportunity allows or requires makes the act of design more interesting.</p>
      </div>
