      <p>I keep up with the larger stylistic changes that happen over time, but I pay no attention whatsoever to the minor trends of various sorts that other people claim to notice.</p>
      <p>For the most part, the supposed trends listed on the site you link to are the same sort of thing that I've noticed for years. I mean the site claims that, um, gradients and circles are trendy. I really can't take this person's observations all that seriously.</p>
      <p>As a designer, it's important to avoid looking either dated or trendy. Designers should be setting trends — not following them. Just my opinion, but any designer who intentionally latches onto a trend just for the sake of doing so has pretty much self-identified him or herself as also-ran talent.</p>
