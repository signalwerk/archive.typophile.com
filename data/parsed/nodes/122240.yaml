    <p>In the past few years (especially 2014) of looking at design blogs on Tumblr or browsing Behance, I've come across a lot of similarities between designs, aka "trends". And I think trends are driving a lot of the most celebrated design work of today.</p>
    <p>You can look at <a href="http://trendlist.org/" title="http://trendlist.org/">http://trendlist.org/</a> for a good example of what I'm talking about. </p>
    <p>Just a few of the most popular design trends:</p>
    <p>- Letterspace: spacing out or throwing around the letters of a word within a design<br>
    - Hyphens: adding hyphens somewhat randomly to words<br>
    - Left, Right, Up, Down: placing words on the sides of the design, forcing people to read sideways<br>
    - IK (International Klein) Blue: the use of a bold saturated shade of blue<br>
    - Squiggles: using squiggly lines across the design -- this one seems like one of the oddest<br>
    - Apercu Typeface: This isn't on trendlist but I would consider just the use of Apercu online as a pretty big trend</p>
    <p>I'm sure you've all seen a number of these trends while browsing online. My question is, do you think using popular trends in your designs is a good or bad thing? Does it show that your work is "of the times" and that you have your finger on the pulse of the moment or are you simply being an unoriginal follower? </p>
    <p> <strong> + What are your favourite design trends, and what are your most loathed?</strong></p>
