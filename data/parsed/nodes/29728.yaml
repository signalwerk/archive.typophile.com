    <p>Last I had heard, there were some people unhappy with the latest upgrade of Font Explorer for Mac.  I don't recall which version it was, though.  I've been getting messages to upgrade to version 1.1.  I'm quite happy with 1.0.1.</p>
    <p>Anyone know if 1.1 is working fine or has any nasty bugs?</p>
    <p>Thanks</p>
