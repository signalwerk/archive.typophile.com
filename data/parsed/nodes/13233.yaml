      <p>I would definately try to push a vibrant spring fresh alive green. This blue isn't winter cold, but I think it could give off that connotation. I don't agree with having to use the AIDS ribbon. Do all company's aimed at breast cancer have to use a pink ribbon? Or one's for teachers use an apple and books? No, it gets old and is too generic. I agree that it does pigeonhole the company, who may branch out to other things in the future and would be stuck with the ribbon sympbol. Some people may also unrightfully associate the AIDS ribbon only with the gay community and not seek the company's services.<br>
      I don't like the curves on the ends of some of the letters, it's not on all the letters so it kind of detracts from the overall look once you notice it.</p>
