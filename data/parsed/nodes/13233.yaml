    html: |-
      <p>We definetly explored warmer colors.  Greens especially.  But the client felt a vibrant blue had the life they were looking for.  </p>
      <p>As for the mark, they are in a tricky position of being and AIDS services instituion but not to pigeon-hole themselves as such.  Getting funding for solely AIDS is very difficult.  So it's fine balance.  Hence the subversion of the AIDS ribbon. </p>
      <p>Besides I don't think it would be very originial or distinguishing to use the AIDS ribbon.</p>
      <p>We also presented all lower case type treatments, but they weren't bold enough for them.  They really want 'bold' and 'vital'.  We almost went with a V-like dove treatment, but they felt that was too Non-Profit and wimpy looking.</p>
      <p>Thanks for the feedback though.</p>
