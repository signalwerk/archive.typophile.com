      <p>Possibly what doesn't seem entirely right is that you've created a slightly abstracted <a href="http://images.google.com/images?q=pretzel&amp;hl=en" rel="nofollow">pretzel</a>. In spite of that, I like the mark. Perhaps the ribbons in the back could be outlines, rather than solid shapes? This will emphasize the 'V' more and play down the pretzel thing.</p>
      <p>As for the blue, it says 'healthcare provider' to me, so that's good. But it also says 'faceless HMO'. So there's that.</p>
      <p>What I really don't understand is this statement: "As for the mark, they are in a tricky position of being and AIDS services instituion but not to pigeon-hole themselves as such. Getting funding for solely AIDS is very difficult. So it’s fine balance. Hence the subversion of the AIDS ribbon." If their sole service is AIDS life services, how would marking them as an AIDS-only institution be putting them in a "pigeon-hole"? That <em>is</em> all they do. Right?</p>
      <p>All-in-all, I think it works. But some tweaks may be necessary to take it to the next level.</p>
