    html: <p>My first thoughts looking at your logo. It could be for a hardware manufacturer. Its not warm or accessible. Shouldn't the type, and color reflect "care" and "understanding" rather than "corporate" and "cold". I would look at other typefaces and not use all caps and I'd use a warm color. As for the ribbon why not use the accepted symbol for Aids awareness? Why do you feel you have to recreate the wheel? I bet who ever invented it in the first place would be happy to let you use it and it already has a history and an idenity.</p>
