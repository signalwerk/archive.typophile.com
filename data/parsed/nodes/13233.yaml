    html: |-
      <p>thanks for all the comments folks. </p>
      <p>daniel: I tried again to change their mind on the color. I did talk them out of the blue, but into Blue 072u!  This wasn't intentional of course.  My client is 5 women who run this organizaton and during this recent meeting they grabbed my pantone book and went nuts.  I thought I was doomed.  But they miraculously chose the same color. </p>
      <p>72u is more of an unique color for an organization, but I am not sure it is any better than 801u.  It isn't warm and perhaps even colder than the initial choice, but I guess it is earthy.  They definetly want something that isn't "the straight and narrow."  Which is why they liked the flourescent 801 first, and why they like the indigo. </p>
      <p>Gave them a few reasons as to why this may not be the way to go, but focussed on how I think this is color has a "down emotion" instead of something up and lively.</p>
      <p>They did say I could recommend something else.  One caveat though, the Executive Coordinator said,"I can't stand Greens, don't like oranges or mustards, and we don't want any kind of pink."</p>
      <p><strong>So if any of you can think of something warm that isn't the above, then PLEASE let me know.</strong></p>
      <p>Great ideas on the mark.  And yes, they are an AIDS org but due to the rapidly evaporating AIDS funding, they need to position themselves as LIFE SERVICES for all the critically ill, with a specialty in AIDS patients I guess.  So they absolutely do not want and AIDS ribbon, and that is why they were into the inverting of the AIDS ribbon concept.</p>
      <p>I told them I want to step back a bit since their deadline isn't as hard now.  I am going to look into these shading ideas Eben suggested (thanks).  I am also going to try and render Sim's idea as I think it is much more simple, but also more of a direct reference to the AIDS ribbon so it might not fly.</p>
      <p>I also think making it a little more 'flowy' might lighten things up a bit.</p>
      <p>Nice type idea on the A.</p>
      <p>I'm going to posting my edits here in the next few days. Please stay tuned.</p>
      <p>Thanks,<br>
      Peter.</p>
