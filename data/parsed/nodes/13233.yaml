      <p>I really like the mark, I have a sew suggestions for improving it &amp; adding warmth/humanity.</p>
      <p>- I wonder if the V-ness of the mark wouldn't be enhanced by using some old fashioned engraving lines behind the main V to shadow the bandage/ribbon behind the V. The lines could be just lines ( very sixties/seventies ) , or they could be ornate like on Currency or something in between. This hatching would feel warmer &amp; would clarify the V without requiring a second color.</p>
      <p>- You could go with a second color, a green or a two blue </p>
      <p>- I wonder how an A ( the A in vitAl ) which is rounded on top would feel. I bet it would feel warmer.</p>
