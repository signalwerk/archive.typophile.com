    <p>This ID project is well under way, but I wanted to get some feed back on it before it gets published.</p>
    <p>I'm especially curious to see whether anymore/anyless can be done to the logotype.  Something doesn't seem entirely right.</p>
    <p>Vital provides Life Services to AIDS patients.  So the mark is taking the AIDS ribbon and flipping it over into a V.  We want to stay away from Red, so we went with a fluorescent blue.</p>
    <p>Your comments are always appreciated.</p>
    <p>Thanks,<br>
    Peter</p>
