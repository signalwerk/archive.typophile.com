  html: |-
    <p>Hi,</p>
    <p>I’m currently building a website for myself in HTML and wanted to include a .swf file in it. Its a 220x100px, 12k file, basically a logo that slowly changes colour. Thing is, when previewing the site the .swf loads just late enough to show a white background (site has black background) for a split second before loading and running normally.</p>
    <p>Is there anyway around this without resorting to a preloader in the beginning?</p>
    <p>Hope this wasn’t too unclear. Thanks.</p>
    <div class="forum-topic-navigation clear-block"><a href="/node/40720" class="topic-previous" title="Go to previous forum topic">‹ Corporate Identity and Magazine Design</a> <a href="/node/40697" class="topic-next" title="Go to next forum topic">Bullets, Outlined Lists and Indenture - Rule of Thumb ›</a></div>
