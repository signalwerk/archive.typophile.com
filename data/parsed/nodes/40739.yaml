      <p>Thanks for the reply. Unfortunately I can’t seem to get it to work. In case it matters, its a XHTML site with CSS. I insert the SWF using Dreamweaver/Insert/Media/Flash and get the following code:</p>
      <p></p><div class="imageWrap"><img src="/files/code_3739.gif"></div><p></p>
      <p>Does it have to be in a specific place within the code? I put it in under the line setting the quality.</p>
