    html: |-
      <p>When a SWF is embedded in HTML, you can set its background color, like this (assuming you’re using the regular <code>&lt;object&gt;</code> tag):<br>
      <code><br>
      &lt;param name="bgcolor" value="#000000" /&gt;<br>
      </code></p>
      <p>This will prevent it from showing a white square before the SWF finishes loading.</p>
      <p>— <a href="http://www.omine.net/">omine.net</a></p>
