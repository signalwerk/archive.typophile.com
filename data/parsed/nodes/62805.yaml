    html: |-
      <p>I agree with you that the stems on the lowercase are far too thin (they look a little brittle) but the caps are lovely and elegant with beautifully judged serifs. </p>
      <p>so, maybe not a body text font yet, but I would say definitely worth continuing, I like it a lot.</p>
      <p>one thing; the serifs on the uppercase T; they are quite different to the others??? in scale, mostly...</p>
