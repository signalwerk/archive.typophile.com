    html: <p>I know it looks like it could be a typeface, but I think there is a good possibility that it was custom lettering. It doesn't look like any typeface that I know, plus the "D" and "I" are noticeably different in the smaller and larger sizes. Notice that the serifs are about the same size, even though the letters aren't. The two "F"s look different, too.</p>
