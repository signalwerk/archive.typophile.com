  html: |-
    <p>I am working on a project to catalog movie titles, and one of the things I want to do is include the typefaces that are used. I expect that there will be many that I can't ID, so I am going to use this board as a resource. If this gets annoying, just ask me to cool it.</p>
    <p>My first movie puzzler is Federico Fellini's 8 1/2. The title itself is probably custom but based on a typeface, and the credits are some type of Clarendon/Egyptian/*Italienne* that I can't find. Anyone know better?</p>
    <p><img src="/sites/default/files/old-images/8_1-2_TitlePic_6522.png"></p>
