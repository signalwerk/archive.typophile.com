      <p>It's extremely close to the <a href="http://www.fontshop.com/?fuseaction=catalog.fontdetail&amp;searchby=manufacturer&amp;displayfontid=EF.100678.0.1" target="_blank" rel="nofollow">Elsner &amp; Flake version of Papyrus</a>, but there are some discrepancies. Whatever it is, it's been contorted in a way no font should ever be contorted.</p>
      <p>I remember someone requesting a similar font before. It wasn't Ereshkigal, and it wasn't Papyrus, but I can't remember exactly what it was.</p>
      <p> - Lex</p>
