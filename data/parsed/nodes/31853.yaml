      <p>i don't know the article but it seems like it would be easy to do. was it about<br>
      starting from scratch or tracing existing images ?</p>
      <p>i'd draw it by hand first, at least the primary curves. scan, place in illustrator, vector trace.<br>
      the illustrator point/blunt distortion filter might come in handy.<br>
      copy, paste, reduce, enlarge, for rhythmic repetitions.</p>
      <p>tribal art is a vague term for several styles so it depends...</p>
