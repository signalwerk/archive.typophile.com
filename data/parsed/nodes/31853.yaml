    <p>I receive several design magazines and I have a very hard time keeping track of articles I read. Just the other day I read a tutorial describing a way to make vector tribal art with Adobe Illustrator. Wouldn't you know it? I can not for the life of me find the article. I've looked in all of my Adobe Illustrator mags, Photoshop User, Layers, Before and After UGH!</p>
    <p>Would anyone be able to point me in the right direction? Your assistance is VERY much appreciated.</p>
