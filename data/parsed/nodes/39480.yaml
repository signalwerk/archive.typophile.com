    html: |-
      <p>“BTW, how many characters would require a typeface for a major language in India?”</p>
      <p>Well it differs from language to language, but nowhere near as complex as the languages of the Far East.</p>
      <p>For the Devangari script which is the basis of most northern Indian languages, and therefore the most widely used, it should be around under 90 characters including numerals accents, ligatures etc. But I must admit I’m no expert on Devanagari.</p>
      <p>In the 70s and 80s many Indian languages, including the one I speak, went through script reforms mainly to rationalize the number of characters and make them viable on typewriters. With recent advances in language technology, there are moves to return to earlier schemes which had far more characters (and I must add character:).</p>
    html_clean: |-
