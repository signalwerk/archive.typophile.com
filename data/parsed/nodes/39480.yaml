      <p>&gt;I for one do not care how closely any revival of, say, a Garamond model or a Caslon model hews to any particular earlier Garamond or Caslon. This is a fruitless quest. &amp; any resulting face will be the subject of many gaseous arguments about how close it is to the “true” model.</p>
      <p>I agree that seeking the holy grail of ’authenticity’ is misguided. In the case of Caslon, this was attempted by the late Justin Howe, but the metal type he used included 19th century recuttings of Caslon, as well as some damaged old type. He also digitized his face based on his modern prints from the metal types, and the result is much lighter than 18th century or even most later letter press printing of Caslon. The result in my view is good for an ’antique’ look, but not so good for general use. </p>
      <p>My fantasy for Electra is that Monotype Imaging will commission Kent Lew to do a good version.</p>
