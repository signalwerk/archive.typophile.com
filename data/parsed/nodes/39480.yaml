      <p>Aside from revivals - today when there are so many text typefaces available, does it happen that you need a font for a project but you go for a compromise because nothing on the market exactly matches what you imagine as the most suitable? Do graphic designers and typographers ever imagine non-existing fonts? I guess yes as this is one of the reasons why typefaces are commissioned. My question is if you ever think of something quite specific that is not a revival.</p>
      <p>(Years ago I had a very specific image of a sans typeface in my mind. Then Joshua Darden’s Freight Sans was released - and it’s a 90% match of what I had imagined. Now, someone will tease me to death because of another thread on lowercase a, but I imagined the “a” a little different, maybe less inclined to the left, but that’s really not important and I’m happy it’s out.)</p>
