      <p>For years, starting about 1988 I pestered people toward getting a good digital version of Linotype Monticello. &amp; For most of those years I was laughed at and told no one would buy it. Or I was met with uncomprehending stares from the many people who had never heard of it.</p>
      <p>Thanks to Princeton University Press and its Thomas Jefferson papers project, we now have a very nice Monticello, created by Matthew Carter.</p>
      <p>Over the past ten years or so, though, I have become much less interested in “revivals” of older faces. As James Puckett suggests above, rather let us encourage typeface designers to start anew, to create types go beyond “revivals.” In book types [at least for setting English] it may be argued that it will be tough to do anything wholly “new.” Basic forms are set, and both readers and typographers have expectations from text types. But recent work from folks such as Kent Lew and Stefan Hattenbach shows that standard forms can be subtly adjusted and re-worked to make new types that both meet those expectations and present us with intelligent variations on the model.</p>
      <p>I for one do not care how closely any revival of, say, a Garamond model or a Caslon model hews to any particular earlier Garamond or Caslon. This is a fruitless quest. &amp; any resulting face will be the subject of many gaseous arguments about how close it is to the “true” model. Why should anyone care about that? What I want is a face of robust color for offset printing, and one that makes full use of the technologies for both creating and using the new fonts.</p>
      <p>That said, as soon as someone comes up with a really good version of Electra, I shall want it. Electra fills a unique typographic niche. Nothing since has come close, and all digital versions are purely watered down; I shall not use them. But there are times when I have wished for it.</p>
      <p>powers</p>
