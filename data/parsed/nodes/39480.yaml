      <p>“stay tuned for this one too!!!”<br>
      Great!</p>
      <p>“I was informed today that a good font for Devanagari literary texts could have 800 characters, 300 is more of a working mininum”</p>
      <p>Most of those would be ligatures, or rather, compound characters. I know that’s the case with Malayalam, a Dravidian language spoken in south of the country. We had about 900 characters which in the reformed script was brought down to less than a hundred largely by doing away with the need for compound characters. </p>
      <p>I can read and write Sankrit and Hindi - both Languages that use Devanagari - tolerably well. I really don’t think there are 800, or for that matter 300 unique characters in use today. </p>
      <p>But like I said I’m not an expert on Devanagari, or a typeface designer. If you’ve been talking to somebody at Reading, you could be right.</p>
