  html: |-
    <p>Hi, Type ID-Detectives,</p>
    <p>I really like the way the three typefaces work together (i.e. the sans, the serif &amp; the slab), but I am frustrated by inability to identify ‘em due to a misplaced Rockledge and, perhaps, a lack of zeal due to a current bout of brochonitis.  Would y’all be so kind and help out this uffering b-tard?  Thanx, Geo.</p>
    <p>The serif looks look a Bodoni, but I don’t believe it is.<br>
    The slab looks loike a variation on Egyptianne but it isn’t.<br>
    And, the cap ” R ” in the sans is really throwing my weezing and conjested brain for a loop.</p><div class="imageWrap"><img src="files/type_3906.samples.jpg"></div><p></p>
