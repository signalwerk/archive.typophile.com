  html: <p>Hi all, <br> <br>I'm considering drawing a script font using existing handwriting. I never did any script fonts so starting from something existing seems a little reassuring for a start. It's all photocopies so a little bit rough. I'll also have to extrapolate a lot of punctuation signs.  <br> <br>I was wondering if anyone would have advice or tips on planning for drawing scripts? Any common mistakes I should avoid? <br> <br>Also, do you believe it is harmful/beneficial to one's skills to redraw letters to make a font? <br> <br>Thanks, <br></p>
