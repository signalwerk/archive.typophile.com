    html: "<p>(OK, I guess I'll reply here. ;-) <br> <br>First of all, I can't imagine any legal barriers to making a font from somebody's handwriting. But of course the ethical requirement to ask for permission is there. If he gives you a good reason why you shouldn't do it, I don't think you should. But if he says no because he's become a crazy old man, ignore him (but still be kind). And if he's dead, a token seance attempt would be a nice gesture.  ;-) <br> <br>I've never really made a script face (TMF Roupen is not an original design), so I hope others can help you more - I do remember some threads on Typophile addressing script design (with Stuart and Mark giving good pointers IIRC), but in the technical realm I would point out this: If it's an <i>irregular</i> script (as most handwriting fonts are), take time studying letter adjacency frequencies (something Excoffon took very seriously). If you do, this might be useful: <a href=\"http://www.typophile.com/forums/messages/4100/37652.html\" target=\"_blank\">http://www.typophile.com/forums/messages/4100/37652.html</a> <br> <br>hhp</p>"
