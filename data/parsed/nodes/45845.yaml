    html: |-
      <p>Subset them.</p>
      <p>I'm assuming this is for a specimen. If you turn the fonts to outlines you are not showing the fonts in action. People will not be getting to see the actual fonts. Also, turning them to outlines gives anyone access to the outlines who wants them.</p>
