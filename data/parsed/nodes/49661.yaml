    <p>Hey there,</p>
    <p>I just happened to stumble upon MacRabbit’s <strong><a class="freelinking-external" href="http://macrabbit.com/espresso/m">Espresso</a></strong> preview website and have instantly fallen in love with the font of the “<em>Espresso</em>”. Does anyone know what typeface this is? I guess it’s not that hard to identify for a pro, but since I have absolutely no expertise on this I thought you might help me out here. Thanks!</p>
