    <p>Hey Everyone.</p>
    <p>Well, It is definitely not done yet, but I have been working some time on it in my Font Design class at Art Center College of Design (in Pasadena, CA).</p>
    <p>I wasn't really referencing any specific grotesques when first designing it, but if I had to describe it in any way, i'd have to say it is a grotesque that takes some contemporary liberties, and has a little Franklin Gothic/ Monotype Grotesque/ Akzidenz Grotesk feel to it (not that any of those typefaces are that similar, but id say my typeface has some similar characteristics).</p>
    <p>I'd love to hear what everyone has to think. Still much more to go, but i'm hoping that after this semester doing an independent study with a great teacher and type designer named Leah Hoffmitz I can have the full character set in 1 weight fleshed out.  Any feedback is welcome!</p>
    <img typeof="foaf:Image" class="img-responsive" src="http://www.typophile.com/sites/default/files/old-images/character_set_0.jpg" width="757" height="403" alt="">
    <img typeof="foaf:Image" class="img-responsive" src="http://www.typophile.com/sites/default/files/old-images/sample_63.jpg" width="630" height="441" alt="">
