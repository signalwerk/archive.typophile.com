      <p>Good list by Ryuk, of paperclip and similar fonts, but none really match the boxy design of these letters.<br>
      If you can't get a license, you can make something similar by doing a continuous line of thin width, with narrow radius corners, jumping at right angles from side to side of the strokes in a boxy sans serif of median weight per the model shown in the letters on the website.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/HowlerBarTypophile115004_6269.jpg"></div><br>
      As for the H in the logo, if it's a trademark, there could be legal problems if you made an exact replica. But the concept shown in the letters can probably be used in a font design inspired by the posted letters. Some of the corners have to be squared to differentiate letters that would otherwise look the same, e.g. O and D. Note the different placement of gaps in the line used to differentiate A and R.<br>
      Possible base fonts include Bank Gothic Condensed <a href="http://www.myfonts.com/fonts/ef/bank-sans-caps-ef/" title="http://www.myfonts.com/fonts/ef/bank-sans-caps-ef/">http://www.myfonts.com/fonts/ef/bank-sans-caps-ef/</a> For the A flip the U and add a crossbar. Straighten the leg on R. Have no idea as to the best way to differentiate U and V -- no angles in the design, perhaps add a tail to U.<br>
      Don<p></p>
