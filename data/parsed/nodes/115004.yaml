      <p>OK, this is what the site tells me. Based in Australia, like you, "Howler is a multifunctional, multifaceted arts hub and bar - a concept space hidden within a Brunswick warehouse that encapsulates all that is good about design, music, theatre, cinema, art and a unique night out." Seems quite likely that they did this design themselves. It's not a web font in use at the site. If you need further info about the design it seems best at this point to follow their contact tab and ask them. If it is a font they may be prepared to license it.<br>
      Good luck.<br>
      Don</p>
