  html: |-
    <p>Any suggestions for a good font to use on formal invitations for the sections requiring all caps (for example, post/zip codes) where the main body of the text is set in a script - such as Bickham Script - in order to avoid this (see image)? </p>
    <p>Any help gratefully received! </p>
    <p>Thanks</p>
    <p>Pete</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Bickham-eg_5448.jpg"></div><p></p>
