      <p>I agree about the colors.</p>
      <p>Regarding the lettering: "r"/"i" doesn't read well for me, but that might very well be culture specific. Also, and this might be a stupid question, what's that crossbar on top of the "M"? Looks like it's trying to be a "T" or a pi. Pie spices? :-)</p>
