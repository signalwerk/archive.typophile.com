    <p>I am working on rebranding a spice company in southern Indiana.<br>
    Here's just a sampling of what I have to work with:<br>
    <a href="http://www.marionkay.com/home.htm" title="http://www.marionkay.com/home.htm">http://www.marionkay.com/home.htm</a></p>
    <p>I drew up this fairly quickly from a sketch I had done.<br>
    I'm eager to have better eyes tell me what needs to change.<br>
    As I'm posting this I am already seeing a couple weight issues.<br>
    I'm not sure about that K...</p>
    <p>Let me know where you see I need to change things.<br>
    Thanks,</p>
    <p>Luke</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/MKLOGO_4020.gif"></div><p></p>
