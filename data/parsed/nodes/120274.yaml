    html: |-
      <p>Found a match in Phil Martin's AI Celebration (1969) - a photolettering font. Now to find a decent image of it ...</p>
      <p>Digitally, the only font I'm aware of is Opti Wycombe. But, George, Opti "borrowed" lots of other foundries fonts and gave them new names. They've been out of business for years. We always caution against using an Opti font commercially.</p>
