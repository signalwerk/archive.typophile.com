      <p>While Aphabet Innovations (AI) was Phil Martin's company, I see that <a href="http://r.search.yahoo.com/_ylt=AwrSbDv5ejRUwCIAjHBXNyoA;_ylu=X3oDMTE0Z2JrYm5tBHNlYwNzcgRwb3MDMjUEY29sbwNncTEEdnRpZANTTUU2MTJfMQ--/RV=2/RE=1412754298/RO=10/RU=http%3a%2f%2fluc.devroye.org%2ffonts-25315.html/RK=0/RS=EoVID2z8wYK_.d4LYV5516ckH_A-" target="_blank" rel="nofollow">Luc Devroye</a> attributes Celebration to Roc Mitchell.</p>
      <p>Edit: I see <a href="http://typographica.org/on-typography/credit-overdue/" target="_blank" rel="nofollow">Mark Simonson</a> also credits Roc Mitchell.</p>
