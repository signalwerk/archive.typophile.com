    html: |-
      <p>Usual caveat about orphan fonts from OPTI but I agree OPTI Wycombe seems to have the letters of Clelebration.<br>
      OPTI did some original digitizations and in the absence of another digital version of Celebration, I suspect this is one of them. But there is no legitimate way to acquire or use an OPTI font.<br>
      Kevin's suggestion of Liberation could work for making a reasonable facsimile.<br>
      Don</p>
