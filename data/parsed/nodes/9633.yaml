    votes: null
    html: <p>I think the only problem with ITC Garamond is that it isn't Garamond. <br> <br>It is a right face with a wrong name. Too many people uses it as a classical face, but it doesn't look classical at all. <br> <br>It's a good testimony of the Herb Lubalin typographic thought.</p>
