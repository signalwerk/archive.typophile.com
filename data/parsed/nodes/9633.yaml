    html: <p>What is it with ITC and <a href="http://www.myfonts.com/fonts/linotype/itc-kabel/">ridiculous x-height</a>?</p>
    html_clean: <p>What is it with ITC and <a href="http://www.myfonts.com/fonts/linotype/itc-kabel/" class="link-external">ridiculous x-height</a>?</p>
  - id: 61498
    user: null
    date: null
    date_raw: null
    votes: null
    html: <p>My personal theory is that ITC was trying to make everything look like Helvetica, particularly its x-height. But, <a href="http://www.myfonts.com/fonts/linotype/americana/" target="_blank">they</a> <a href="http://www.myfonts.com/fonts/linotype/antique-olive/" target="_blank">weren't</a> <a href="http://www.myfonts.com/fonts/ef/stilla/" target="_blank">alone</a>. <br> <br>I do remember that the prevailing wisdom in the seventies (promoted by ITC and others) was that typefaces with large x-heights were easier to read and used space more efficiently. There is a certain amount of truth to this (for example, newspaper faces), but it was mostly just the changing winds of taste and fashion.</p>
    html_clean: <p>My personal theory is that ITC was trying to make everything look like Helvetica, particularly its x-height. But, <a href="http://www.myfonts.com/fonts/linotype/americana/" target="_blank" class="link-external">they</a> <a href="http://www.myfonts.com/fonts/linotype/antique-olive/" target="_blank" class="link-external">weren't</a> <a href="http://www.myfonts.com/fonts/ef/stilla/" target="_blank" class="link-external">alone</a>. <br> <br>I do remember that the prevailing wisdom in the seventies (promoted by ITC and others) was that typefaces with large x-heights were easier to read and used space more efficiently. There is a certain amount of truth to this (for example, newspaper faces), but it was mostly just the changing winds of taste and fashion.</p>
