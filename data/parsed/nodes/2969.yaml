    html: <p>Don't let it get you down Mark. Identifont's data base is an eclectic selection (to put it nicely), and some choices are rather subjective calls, even if you have the whole font in front of you, which is rare for ID'ing. <br> <br>I'm not trying to suggest that maybe the database is skewed towards affiliates/sponsors ...   well, yes I am!</p>
