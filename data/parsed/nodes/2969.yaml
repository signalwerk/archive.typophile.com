    html: <p>Looks like <a href="http://www.fonthaus.com/products/fonts/view.cfm?SKU=PN10135">Luther</a>, except the designer took the lower-case s and o and increased them to the cap height. It also looks a bit extended, and, of course, distressed.</p>
