    html: <p>Thanks to Identifont, which worked for me for once. Though the reason I used it -- that if anything the identifier would be that straight middle on the S -- was undercut by the fact that I was looking for the wrong glyph. In the end, neither the upper- or lower-case s had anything to do with the id. So I got extremely lucky.  <br> <br>By the way, given my responses to Identifont's questions, Coquette came up as a better match than Luther. Thought you'd like to know.</p>
