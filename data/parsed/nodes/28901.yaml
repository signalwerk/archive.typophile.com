    <p>Hello Typophiles!!</p>
    <p>Please tell me how to use the pen tool while drawing a typeface?<br>
    I am designing a Devanagari typeface(attached) and really don't know how to use the tool so that it look more professional and finished. Any tricks_??</p>
    <p>I tried converting few existing faces into the curves to see the node structure and they really looks so perfect and almost the same structure in most of the typefaces.<br>
    But mine looks totally unprofessional and dirty. Please tell me how they work in the industry_? Or they use completely different tools_?</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/how to use pen tool_4500.jpg"></div><p></p>
    <p>This is a snapshot from the Illustrator just to show the node structure of my Devanagari face am working at the moment.</p>
    <p>thanks a lot<br>
    satya</p>
