      <p>&gt;benefits of having minimum nodes in letters?</p>
      <p>1. Theoretically, it will operate as a program more quickly, but this is not significant with modern computers, I have heard. </p>
      <p>2. Putting nodes at the extremes tells automatic hinting to hint correctly. As I understand it this is the main reason to put them there. Some of the tech-savy people can tell you more about this. </p>
      <p>3. On your 'S', it does normally have some nodes along the spine. This is not a problem. But you have a stray node off any line. This might mess up your font. You will probably get a warning from FontLab that you have off-curve points, if you try to generate a font (which you can't do with the demo, I think).</p>
      <p>4. Generally, when you have more nodes you have more problem making a smooth curve. The trade-off is that with fewer nodes, you may not be able to get the curve you want. There are no rules about this, so far as I know. You just work with it until it looks good to your eyes.</p>
