      <p>Different rendering systems will draw curves differently. For example, I've found that when I use Windows TrueType fonts on Mac OS (it's not so bad with newer versions) or Linux, the shapes of the curves can be look weird. Putting nodes at the extremes helps at least keep them in the same place. I notice this more with less professional fonts that have poor node placement, except it doesn't seem to matter with Linux.<br>
      PostScript curves don't seem to have this problem in Mac OS, but they do in Linux.</p>
