    html: |-
      <p>Remember to paste your outlines to mask before you put nodes at extremes. Then it is easy to adjust to get back to the look you wanted. You may well need to put a point here or there to get the curves you want, but this is ok so long as you have points at the extremes. (Also there are some exceptions to needing points at the extremes, such as at the terminal of the e and similar situations.)</p>
      <p>In Font Lab control-e (windows) will automatically put the nodes at extremes, but you may want to do it selectively.</p>
