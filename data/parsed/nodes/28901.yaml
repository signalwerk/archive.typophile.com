      <p>If it's Frutiger, those aren't "extra": those are what it took to get the curve he wanted. If you ask me Frutiger typeface is one of those that is worth studying again and again--a masterwork from a master. </p>
      <p>Because with Bezier curves you are dealing with cubic equations, there is a limit on what shape you can draw from point to point. So if you want a different shape between nodes than what you can get with one Bezier curve, you need more nodes to get what you want.  </p>
      <p>More experienced type heads than I can tell you more, but I would say draw it with as many nodes as it takes to get the shape you want. Then copy to mask and take away all but the extremes. Then adjust handles and maybe nodes to approximate what you had originally. Then add more nodes if not satisfied. Repeat again and again and ..... </p>
      <p>If you open a number of good typefaces you will see in what situations intermediate points are added. But the eye is the final arbiter.</p>
