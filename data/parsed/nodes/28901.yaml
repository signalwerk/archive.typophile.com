      <p>I am relatively new to drawing type, but experienced pros here on typophile say they used to start drawings in Illustrator but now work directly in Font Lab. </p>
      <p>The most basic thing, according to Leslie Cabarga, is that when you delete a node the outline springs out instead of collapsing as in Illustrator. For letters this is useful. The are a whole lot of other things also that FontLab does, but download a free demo of one of their products and you can try it and explore for yourself.</p>
      <p>FontLab is not very intuitive at first, but is very powerful, and you will keep discovering new things as you use it.</p>
