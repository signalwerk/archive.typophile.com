    html: "<p>For the record: Typeface names are protected by *trademark,* not copyright -- two different sorts of intellectual property protection. You can't copyright a name, but you can trademark it. Trademarks can and do become abandoned when they are not active in commercial use for a certain period of time. The specifics will probably vary from jurisdiction to jurisdiction.  <br> <br>One should consult with a trademark attorney or expert before deciding that an old trademark has been abandoned. <br> <br>-- K. <br></p>"
