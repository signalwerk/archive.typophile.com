    html: <p>Hrant is right. The only digital typeface from Stanislav Marso (1910-1975) is RePublic by Brousil. Marso was an employee of Grafotechna, Czech metal type foundry. There are even more typefaces created by him, but you can only find them in old Czech books on type and in some past issues of Typografia magazine. Typografia is a Czech magazine for printers and typographers since 1888; it is now published by son of Mr Marso.</p>
    html_clean: <p>Hrant is right. The only digital typeface from Stanislav Marso (1910-1975) is RePublic by Brousil. Marso was an employee of Grafotechna, Czech metal type foundry. There are even more typefaces created by him, but you can only find them in old Czech books on type and in some past issues of Typografia magazine. Typografia is a Czech magazine for printers and typographers since 1888; it is now published by son of Mr Marso.</p>
