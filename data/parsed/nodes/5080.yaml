  html: <p>Hi All.  <br>while reading "Schriftkunst" by Adolf Kapr I found an interesting piece of type, by an obviously czech designer called Stanislav Marso - the Marsuv Grotesk. I was searching through google but couldn't find anything further than his name for about three times nor could I find any digital piece of his work.  <br> <br>So you're my last chance. Has anyone round here Information about this guy and his typefaces - maybe I was just too stupid to find something that is too obvious (Maybe the type is now common under another name or something). <br> <br>I'm sure someone in here can help me. <br> <br>Servus <br> <br>Dominik <br> <br></p>
