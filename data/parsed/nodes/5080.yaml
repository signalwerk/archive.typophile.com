    html: <p>Thanks for the support guys and sorry for not tuning  in a while. <br> <br>I haven't spent a single thought on the legal issues yet.(Thanks, Victor, for that hint, how naive can one be, doh!) <br>But that would be something I sould surely check before starting something like this. It was more of a heart to arm decision than thought about very well. (I don't know if this was idiomatic but I hope the picture delivers) <br> <br>For me the whole thing should be fun at first.I didn't have any commercial issues in background. To be able to sell something like that, I'd surely  need to have the original metal. Since I'm surely not able to pay for these, the aspect of making money with it is out of play. <br> <br>I don't really know it from original source, but at least in the U.S. it seems to be only the name is under copyright protection. How else so many derivates for popoular fonts would have been developed. (I don't tell no company names). <br> <br>I'll check about the legal issues. But it would be a pity if this shouldn't work. <br> <br>Servus <br> <br>Dominik <br></p>
