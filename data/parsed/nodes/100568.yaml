      <p>I haven't used AutoCAD in a while, but as far as the vector drawing is concerned there is a lot of things I like. As a lefty it was easier for me to use their shortcuts system, with the striking of one or two keys then pressing the spacebar, unlike the right-handed dominant Adobe and Fontlab system. </p>
      <p>I also think the way AutoCAD uses construction lines and such could be a benefit in Fontlab. Using tools like Line, Offset, Mirror, Fillet, Trim, Extend...despite the simple spline tool (and no Em measure) I bet you could knock out a font pretty quickly with AutoCAD.</p>
