    html: <p>I ran into this working on the signage and controls for a boat. The type design eventually had all the minor kerning removed, and the major pairs "AW" e.g. had to be made into slugs like the olden days and then subbed in at output.  I also talked the builders into using a 1:1 scale so the type sizes would be understandable. This was accepted because no one actually measures off the drawings anymore, preferring to pass .dwg files around and measure in screen.</p>
