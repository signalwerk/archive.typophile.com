      <p>My reason for asking here is that I happen to be reviewing a set of consultant's drawings with a number number of large dimensional-letter architectural signs - Part of a project going out for tender. The sign layouts were prepared in AutoCAD and the kerning is terrible. I thought, OK, no sweat -- Just report back that someone "turned the kerning off". Fix it and we're good to go. Easy, right?  I looked a little deeper.</p>
      <p>Usually the graphic design work is done with graphic design tools and brought into construction CAD drawings later. But it appears it was done in AutoCAD, and it Appears that AutoCAD does not read kerning tables. I could be wrong, but I have AutoCAD on my work computer. I spent some time trying to get a decent looking string of text and it was not happening. there is no mechanism (that I could find) to make it happen. </p>
      <p>I used to use an AutoCAD based program many years ago to run vinyl cutting plotters and a CAD-CAM router -- Back when it was DOS based. They made it 'user friendly' and I was lost. Thankfully vector based graphics applications like CorelDraw and Illustrator came along because I couldn't draw a box with AutoCAD anymore. As it happens I took a refresher course yesterday. How's that for serendipity? </p>
      <p>It has some nifty tricks but it is not meant for graphics. When I bring an architectural or civil CAD drawing of a building floor or site plan into Illustrator What I get is thousands of line segments, a bloated file and a headache.</p>
