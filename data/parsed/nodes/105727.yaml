  html: |-
    <p>I'm looking for Cyrillic fonts that have a "forked" yat similar to the ones in Old Standard v2 or Linux Libertine. The intended use is for the web rather than print, so unfortunately that rules out a high-contrast face like Old Standard.</p>
    <p>I've already browsed all of the serif faces at <a href="http://paratype.com" title="http://paratype.com">http://paratype.com</a> that supports 19th-century Russian orthography, and have also looked at just about everything at <a href="http://free.type.org.ua/en/" title="http://free.type.org.ua/en/">http://free.type.org.ua/en/</a>. The forked variant of the yat character seems to be pretty rare.</p>
    <p>Linux Libertine has a fairly neutral appearance that would be OK for the intended use, and the yat fits the pre-revolutionary feeling I have in mind. However, there's something about the high bar in the lowercase "e" that says "not a traditional Cyrillic letter form". So I wonder whether Libertine is considered to be a good or bad face for Cyrillic.</p>
    <p>Something like Leksa would be great -- but as far as I can tell it lacks the yat variant I'm seeking (unless there's a stylistic variant that's not shown in the glyph maps).</p>
    <p>Any opinions welcome. Thanks!</p>
