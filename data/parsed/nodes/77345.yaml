    <p>Hi,</p>
    <p>This is a long-awaited revision to my personal wordmark; you can find the first version on Typophile in <a href="http://typophile.com/node/52253" rel="nofollow">this</a> node. This wordmark represents my initials which I am hoping the viewer can interpret clearly right away (they are posted in the O.P. of the above node if you cannot).</p>
    <p>New version:</p>
    <p><a href="http://i51.tinypic.com/2m4u2zc.jpg" title="http://i51.tinypic.com/2m4u2zc.jpg">http://i51.tinypic.com/2m4u2zc.jpg</a></p>
    <p>I love how it looks right now, but I will also take into account any (constructive) feedback.</p>
    <p>~ corey</p>
