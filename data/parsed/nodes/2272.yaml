    html: <p>This <b>IS</b> amazing. And I completely agree with Stephen. I <b>WANT</b> to see this on the typophile t-shirt contest! <br> <br>Also, Stephen's idea about 3 separate fonts -- Did you mean this (for my visual impairment) to be similar to the woodcut fonts that have fills? <br> <br>Short lines -- because they only appear in such small amounts, this is perhaps why they don't quite jive with the rest (?) <br> <br>LOVE -- ABEFGIJNPTUVXY <br>TWEAK -- C, go a little more traditional on the heavy stroke; D, not sure about the tiny little corner; H, not loopy enough; K, could the scrolling lines intertwine just as the heavy strokes (?); L, too similar to the J; M, i see an R; O, short lines; Q, short lines; R, short lines; S, again a little more traditional on the darker stroke <br>WORK -- MWZ all three are a little too wacky. <br> <br>but hey. this is amazing and maybe my boring old traditional eyes are wanting too much? as for the I &amp; J, what if there was a hanging alternate J ? by the way, i think the T rocks!</p>
