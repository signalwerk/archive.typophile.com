    html: "<p> Daniel, you've certainly captured that fin-de-siecle decadence of Beardsley and Wilde. It's also strangely reminiscent of some good ol' Letraset stuff, ca. early 70s. <br> <br>One technical question: It's hard to tell exactly from just a screen rasterization, but did you build any overshoot into all those rounds? I can't see any in the samples, and it's disturbing the rhythm, to my eye. But maybe its just the low resolution of the gifs. </p>"
