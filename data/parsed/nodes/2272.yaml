    date: 2002-08-16T02:56:00
    date_raw: 16 Aug 2002 — 2:56am
    votes: null
    html: "<p>Ok, ok. I'm getting very giddy here at 4 a.m. <br>thinking about the emense possibilities this <br>font holds. For instance: <br> <br>1 - Consider making 3 seperate fonts, one as it <br>is now, one with the heavy \"alphabetic\" lines, <br>and one with the windy scroll lines. This would <br>allow the designer to combine the fonts and color  <br>the two elements seperately. Layering is hip. <br> <br>2 - Create another font in which the windy scroll <br>lines extend out of the letters. Could also be <br>another layerable font. <br> <br>3 - Create a bitmap version. You think I'm kidding? <br>Talk to this guy: <a href=\"http://www.typophile.com/forums/messages/29/1944.html?\" target=\"_top\">Miguel Hernandez</a>. He makes <br>display fonts out of pixels. <br> <br>About the short lines... I'm beginning to see why <br>some work and some don't. On the 'M' the lines <br>are a continuation of the flow of the lines above <br>it - they are just crossed by another pair. So <br>I think they work on the 'M' and 'R'. On the 'Q' <br>and 'O' they seem to be space fillers rather <br>than continuations of the lines. This makes them <br>distracting. You see? Or am I dillusional from <br>lack of sleep? <br> <br>Stephen</p>"
