    votes: null
    html: "<p> Uh oh - Tiffany has become code happy. (Those bolds!) <br> <br>The 3 fonts... <br> <br>Font A - The design as it exists. <br>Font B - Contains only the thick lines - the forms of the letters. <br>Font C - Contains only the curly, scroll lines. <br> <br>The idea is to allow the user to seperately <br>control the color of each element. For instance: <br>if there was a legibility concern, the user could <br>make the alphabetic forms a slightly darker color <br>than the inside ornamentation. The different fonts <br>would allow this change much quicker than tedius <br>editing in Illustrator. <br> <br>If there is room for expiramentation with the inside <br>curls, there is an opportunity for two more fonts: <br> <br>Font D - Could contain alternate (maybe longer), scroll lines. <br>Font E - The full design with the alternate scroll lines. </p>"
    html_clean: "<p> Uh oh - Tiffany has become code happy. (Those bolds!) <br> <br>The 3 fonts... <br> <br>Font A - The design as it exists. <br>Font B - Contains only the thick lines - the forms of the letters. <br>Font C - Contains only the curly, scroll lines. <br> <br>The idea is to allow the user to seperately <br>control the color of each element. For instance: <br>if there was a legibility concern, the user could <br>make the alphabetic forms a slightly darker color <br>than the inside ornamentation. The different fonts <br>would allow this change much quicker than tedius <br>editing in Illustrator. <br> <br>If there is room for expiramentation with the inside <br>curls, there is an opportunity for two more fonts: <br> <br>Font D - Could contain alternate (maybe longer), scroll lines. <br>Font E - The full design with the alternate scroll lines. </p>"
