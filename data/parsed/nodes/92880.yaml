      <p>I think these are 2 different fonts...</p>
      <p>The first one ("MAMAA") is <strong><a class="freelinking external" href="http://www.findmyfont.com/index.php/fonts/font-preview?fset=Dafont&amp;ffam=Digit%20-%20LoFi&amp;fid=31eae64f32dc2930482d48feb18b3559&amp;fsize=60&amp;text=MAma&amp;fit=1" rel="nofollow">Digit ( LoFi)</a></strong></p>
      <p>...while the second one ("new itas !") must be <strong><a class="freelinking external" href="http://www.findmyfont.com/index.php/fonts/font-preview?fset=Dafont&amp;ffam=Billo%20Dream%20-%20Regular&amp;fid=5d0d4a30bdf2c65742bf9729fb329461&amp;fsize=60&amp;text=new%20itas%20!&amp;fit=1" rel="nofollow">Billo Dream</a></strong><br>
      both by Ben Balvanz (Fontalicious)</p>
      <p>-----------------------------------------------<br>
      I found them using Find my Font - <a href="http://www.findmyfont.com" title="http://www.findmyfont.com">http://www.findmyfont.com</a></p>
