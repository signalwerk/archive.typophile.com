    <p>I’ve started a new group on Flickr for photos of manicules (aka printer’s fists, indexes, pointers, hands, digits, etc):<br>
    <a href="http://www.flickr.com/groups/manicule/" title="http://www.flickr.com/groups/manicule/">http://www.flickr.com/groups/manicule/</a></p>
    <p>Many of the submissions extend beyond the confines of typography, even into the third dimension, but I figured it might be of interest nonetheless.</p>
    <p>For those of you with Flickr accounts, please feel free to add any images you might have!</p>
