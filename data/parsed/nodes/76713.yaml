    <p>Hey I'm Looking for a condensed Sans which fits better to the Akzidenz Grotesk than the original „Akzidenz Grotesk Condensed“ does. I think the letterforms of the condensed AG are too awkward an it doesn't look like belonging to the family. Anybody an idea which could fit better?</p>
    <p>cheers</p>
    <p>Benny</p>
