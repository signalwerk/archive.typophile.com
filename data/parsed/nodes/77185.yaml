  html: |-
    <p>I clearly remember reading someone's comment here that Adobe EULA was very liberal in terms of allowing web use of their fonts. Anything from SiFR and Cufon and up to @font-face was permitted. And now I can't find that thread. Nor can I find any traces of any web/online usage permissions on Adobe's website. Their Font FAQ page is 404 too. </p>
    <p>Does anyone has any experience with this? I am looking to use ITC Franklin Gothic on a page for the body text. Would hate to pre-render it :-|</p>
    <p>Thanks</p>
