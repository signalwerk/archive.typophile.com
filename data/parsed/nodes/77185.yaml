      <p>Oh, I understand it's a stretch :) However the meaning of "secure" varies depending on whom one asks, so the only unambiguous way to read (ii) is to take it as an actual <em>definition</em> of "secure". If something does not permit "editing, altering, enhancing, or modifying" of the document, then it is "secure". And HTML is "secure" under that definition.</p>
      <p>And I'm guessing you meant to link to <a href="http://www.adobe.com/type/embedding.html" title="http://www.adobe.com/type/embedding.html">http://www.adobe.com/type/embedding.html</a>, which basically says "open the font file and look at the foundry info". Hardly practical.</p>
