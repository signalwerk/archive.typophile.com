    html: "<p>Myself, I have found InD CS slightly faster than 2.0, although it is still slower than QuarkXPress. OTOH, QXP 6 is considerably slower than previous versions of QXP.... <br> <br>Steve's right that many of the standard features of InDesign will slow it down. For example: <br>- hi-res graphics previews <br>- paragraph composer <br>- unlimited undo <br> <br>If performance is an issue, one can adjust some of these (and other options) to improve performance, at a cost of features. I believe there is a standard tech note on improving InD performance on the Adobe Web site. <br> <br>(BTW, no clue on the grey box in Illustrator. Sorry.) <br> <br>Cheers, <br> <br>T</p>"
