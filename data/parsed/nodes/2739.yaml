    html: <p>&gt;&gt;In my mind it seems it should be able to be as fast as quark. Why isn't it? <br> <br>This isn't really my field, so I could be talking nonsense, but the thing that springs to mind is that you are probably doing much more with InD, than you did with Quark - even if you don't realise it. <br>For example, if your Quark experience is pre-version 6, then you were working without multiple undo. Think of all the available options that make you want to use InD, rather than Quark. Now, even if you're not using them, you might be, so InD has to check to see if you are, and it has to leave the door open in case you want to in the future, and then it has to leave a route back to anywhere in your session, incase you want to undo your way all the way back to lunchtime. <br>This is why we all have to keep buying new hardware - because the software does so many new things (which we all take for granted after about 15 seconds). <br></p>
