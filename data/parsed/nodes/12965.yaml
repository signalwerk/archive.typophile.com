      <p>The only versions I could find were also TTF. I think this font was used as a film typeface. I show a number of old scans as well as some current multi-line fonts in the <a href="http://bowfinprintworks.com/LinedFontGuide01.html" target="new" rel="nofollow">Lined Fonts ID Guide</a>. That might help you find an alternative. Sources are listed in the Guide.</p>
      <p>Another possbility, which may not work well, is to convert the font from TTF to Type1. I say it may not work well, because the TT outlines may not be good quality, and that would make 'garbage in- garbage out' situation.</p>
      <p>- Mike Yanega</p>
