      <p>Patty, I thought most of us Mac users had our utilities to convert TTF files to Mac format (I use Fontgrapher, but there are cheaper options). For my purposes that has always worked well. </p>
      <p>I think typOasis is geared to <em>most</em> font users, which are PC users (just based on the distribution of computers, with Macs still not much above 10%), whether we like it or not. You'd also have to admit that not all font lovers are professional graphics designers (yet), and even that not all graphics designers use Macs any more.</p>
      <p>Mike, I'd love to get my hands on your copy of the Solotype Catalog. I have also got mine full of notes, but I have apparently not been as thorough, or wide-ranging, in my correlations.</p>
      <p>- Mike Yanega</p>
