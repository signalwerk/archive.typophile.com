    html: |-
      <p>Thanks Mike. I've got a very marked up Solotype Catalog in which I note every digitization (excluding renamed clones) that I find of a typeface shown in there. I've started, too, to make notations in my Homage To The Alphabet and an old VGC catalog as well for the typefaces in those that don't make an appearance in the Solotype Catalog.</p>
      <p>My days of "scouring the web's free sites" – except for a few Asian ones - are well behind me. Pretty much the only freebie revivals I see any more come from those who contribute fonts directly to Cybapee's wonderful TypOasis. Herr Steffmann used to offer his fonts – complete with graphic samples – from his own website, but that got too expensive and Petra stepped in to the rescue (as seems to be in her nature).</p>
      <p>I rely on DaFont's New Releases to monitor what's out there freebie-wise and I check TypOasis and MyFonts' What's New pages regularly. On the latter, I love to see new revivals pop up by Dan Solo, Nick Curtis and Canada Type (the latter splendid old scripts, but you probably are well aware of their stuff).</p>
