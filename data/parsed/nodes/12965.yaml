      <p>Prisma was originally produced by the <a href="/wiki/Klingspor" class="freelinking" rel="nofollow">Klingspor</a> foundry. It is a special version of <a href="/wiki/Rudolf%20Koch" class="freelinking" rel="nofollow">Rudolf Koch</a>'s <a href="/wiki/Kabel" class="freelinking" rel="nofollow">Kabel</a>. I am working on a digitization of it. I don't have a complete version of it. E-mail me offline, and I will let you know if there is anything that I can do to help you.</p>
      <p>__<br>
      <a href="http://www.typeoff.de" title="www.typeoff.de">www.typeoff.de</a></p>
