    <p>Anybody know if there is a postcript or opentype version available of a font commonly known as Prisma, I have a TT version which wont outline in illustrator. The typeface is made up of four geometric thin lines and it looks like it is based around Futura or similar and as far as I can tell ther is only a caps version.</p>
