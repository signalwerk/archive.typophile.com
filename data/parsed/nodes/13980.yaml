      <p>Four things immediately leap out to me,<br>
      1 Use the fi ligature<br>
      2 Why is a fraction so much bigger than the whole number<br>
      3 Turnover "for" in 2nd para 1st page and "on" in 1st para Caviar Napoleon*<br>
      4 Why use an ampersand in the Grappa scented salmon and not in seared tuna<br>
      On the whole I would prefer that each instruction were given a paragraph to itself to aid the cook who is trying to read and prepare at the same time.<br>
      *Another approach might be to slightly increase the measure to bring words back, with ragged right text it is not critical that every page has the same measure and if it improves the rag it is worth considering.<br>
      I realise that projects like this are driven by time and budget and so this might not always be possible but if you get used to picking this kind of thing you will be able to produce a better looking job without blowing the budget, I find it easier to spot them from a runout rather than on screen with the distractions of toolbars, guides etc.<br>
      Tim</p>
