      <div class="comment-spam-body"><p>Edited:<br>
      Today's Trivia -- addressed mainly to English speaking readers.<br>
      Berlin Alexanderplatz is an amazing novel by Alfred Döblin, published in 1929. It relates the story of Franz Biberkopf, an ex-convict, who has to deal with misery, lack of opportunities, crime and the imminent Nazism lived in Germany during the 1920s. During his struggle to survive against all odds, life rewards him with an unsuspected surprise but his happiness will not last as the story continues. <a href="http://en.wikipedia.org/wiki/Berlin_Alexanderplatz" title="http://en.wikipedia.org/wiki/Berlin_Alexanderplatz">http://en.wikipedia.org/wiki/Berlin_Alexanderplatz</a>.<br>
      I have no information on the 1931 movie.<br>
      Berlin Alexanderplatz  was made into a film mini-series for West German TV in 1980. <a href="http://en.wikipedia.org/wiki/Berlin_Alexanderplatz_%28miniseries%29" title="http://en.wikipedia.org/wiki/Berlin_Alexanderplatz_%28miniseries%29">http://en.wikipedia.org/wiki/Berlin_Alexanderplatz_%28miniseries%29</a><br>
      I first saw in it the 1980s as a film art house series running about 16 hours. Its now available on DVD and includes English subtitles. I highly recommend it as a compelling story and character study.<br>
      Regrettably, The publicity for the mini-series did not use this period appropriate lettering.<br>
      Don</p>
      </div>
