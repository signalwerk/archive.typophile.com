      <div class="comment-spam-body"><p>Note the variation in the shape of repeating letters. Handlettered in a popular Art deco style.<br>
      This is shown in a font by Jacob Erbar released in 1927 as Erbar Grotesk Garnitur<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/ErbarGroteskGarnitur1927SM_3524.jpg"></div><div class="imageWrap"><img src="http://typophile.com/files/ErbarGroteskGarnitur1927AsKNICK_4095.jpg"></div><br>
      Unfortunately, the digital versions of Erbar Grotesk are  more conventional.<br>
      There are some digital fonts with some similarity to the Plakat lettering, such as Neutraface bold from House Industries <div class="imageWrap"><img src="http://typophile.com/files/NeutrafaceHIbold_5342.gif"></div> <a href="http://www.houseind.com/fonts/neutraface" title="http://www.houseind.com/fonts/neutraface">http://www.houseind.com/fonts/neutraface</a><br>
      Don<p></p>
      </div>
