  html: |-
    <p>First: are people still using enough apps without support for [KERN] that I should convert to a plain kerning table when I generate final fonts?</p>
    <p>Second: I created an all-uppercase font, and want to fill in the lowercase characters with the uppercase glyphs. It seems like the best option is to expand my kerning classes and copy/paste the uppercase characters (with kerning) into the lowercase slots. The other option is to just have classes for every character to match the uppercase to lowercase but that seems kind of odd. Suggestions?</p>
