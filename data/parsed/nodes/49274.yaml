    html: |-
      <p>There is no functional difference between class-based or pure-pair-based kerning within the "kern" feature of the OpenType "GPOS" table. </p>
      <p>But the other type of kerning, the old-style non-OpenType "kern" table, is still needed for OpenType TT (.ttf) fonts. If you don't include non-OpenType kerning in .ttf fonts, there will be no kerning whatsoever in, say, Microsoft Word. </p>
      <p>For OpenType PS (.otf) fonts, if you don't include non-OpenType kerning, the Western subset of your character set will automatically get "virtual" non-OpenType kerning, so AV and ÄV will have kerning in Word but ĄV will not. </p>
      <p>As for the all-uppercase font, I'd do it by setting up classes this way: </p>
      <p>_A: A' a Aacute aacute Adieresis adieresis<br>
      _B: B' b</p>
      <p>etc. </p>
      <p>Adam</p>
