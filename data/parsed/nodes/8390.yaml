    html: <p><i>&gt;Maybe we aren't the right crowd to be asked these questions. :^/ </i> <br> <br>Like Tiffany and Armin are hinting at, we are an obviously pro-InD crowd, since many of us are type designers, and all of us are type lovers. And with where else other than in InDesign (or other Adobe products) can we test out all of those OpenType features? <br> <br>But I suspect that the average graphic designer doesn't really even understand OpenType yet, what it is, how simple and unradical a change it presents to daily workflow, and what it shows of the future. This is something that, while marketing fonts, I think about alot. Education is still really important here. <br> <br>As type designers and producers, it is important to remember who our users are, and what they can do. I like OpenType's features, and think that they should be in more typefaces. Honestly, it is less important to me which programs my customers users than whether of not they use the fonts I am promoting. Therefore, I welcome broader OpenType support.</p>
