    html: <p>I think Quark is a goner. InDesign has an indisputable edge in that the top two graphic design applications in the world -- PSD &amp; AI -- are its cousins. <br> <br>Also I think a lot of designers who used Quark on a daily basis in the late '90s felt let down by the "upgrades" Quark put out between 4.1 and 6. I mean, there was a period of five or six years when we got nothing. Quark just took their kazillion dollars and sat on it. The only reason they put out 6 was that they needed a version that would run on OSX. As a daily user of Quark 6.0 (pity me) I  can tell you it's not all that different than 4. <br> <br>I can make it work. It still does what it was intended to do. But a combination of lack of innovation and ID's easy compatibility with other Adobe products make me much more likely to use ID than Quark when the choice is mine.</p>
