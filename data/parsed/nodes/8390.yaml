    html: <p>Maybe we aren't the right crowd to be asked these questions. :^/  <br> <br>I still do have one client, an anarchist publisher in Northern Cali, that requests all books in Quark 4 and are not looking into upgrading or switching and so being the obedient person that I am, I continue to keep Quark 4 on my machine. If, however, they so much as hint about switching to Quark 7, I will do my utmost to get them to switch to InDesign because that is what I do use now. <br> <br>I recently spent a little over an hour on the phone with a Quark rep. They really wanted us to upgrade and were willing to upgrade even our non-upgradable versions just to get us to do it. I told them if we did any upgrading it would only be for two machines. Not even a drop in the bucket really. But they've offered us the deal twice now. I wonder how many larger (by quite a lot) companies are getting deals phoned in to them.</p>
