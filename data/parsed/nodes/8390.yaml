    html: <p>IMHO--I used to be the biggest Quark advocate on Earth.  I had been using it since version 1.0.  After a while, it became clear that Quark felt it had the market so locked up that it could do nothing and rake in money anyway. They felt they could screw their customers time-after-time with bad upgrade policy and dump out buggy software after years of wasted time.  Frankly, I just don't trust Quark anymore.  They have created a self-inflicted cancerous lesion on themselves which has festered into a total-body eruption. Their only prayer is if someone else would by XPress who actually cares and turn it into a viable product.   <br>To answer your question, I would not touch 7 with a 10 foot job stick. <br>Quark is dead; long live InD. <br> <br>ChrisL</p>
