    html: <p>Nick, assuming you're using some variation of InDesign's keyboard shortcuts (i.e., you didn't select the "Shortcuts for QXP 4" set in Edit/Keyboard Shortcuts), hit Option and the down/up arrow to increase/decrease your leading by the amount specified in Preferences/Units &amp; Increments. (Yes, down = greater leading, up = lesser leading.) Works with paragraphs with different leading values.</p>
