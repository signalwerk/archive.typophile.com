    date_raw: 31 Dec 2004 — 7:52am
    votes: null
    html: <p>I've stopped using Quark for over a year, but I miss it, and am still much slower on InD. <br> <br>I wouldn't say InDesign's big gimmicks, transparency and instant dropshadows, are very 'pro-typography'. (And OpenType doesn't deserve to be buried on a 3rd-level palette.) But perhaps my definition of typography is a little narrow and outdated. <br> <br>As someone who likes to experiment by varying the type specs of a layout, the thing I miss most in InDesign is the ability, (which I had in Quark), to incrementally "nudge" the leading of a multi-paragraph piece of text, where each paragraph has different leading. <br> <br>*** <br> <br>I have a lot of good clients in the newspaper business still using Quark. Often they use a mixture of Quark on Mac (with Type 1 fonts) for the front end, and a proprietary pagination program on some kind of PC operating system (with TrueType fonts) for the back end. Throw in a mixture of languages, and things can get pretty hairy. This is exactly the kind of situation that OpenType's "one font fits all" functionality is supposed to remedy, but it's one of the slowest area of the business to change!</p>
