    html: "<p>Dan, where I work full time, we upgraded from QX 4.1 to QX 6. It's definitely worth it if you're in an OS X environment. It's also just a better program. But, for my freelance, I'm 100% InD CS. I didn't even install QX 4.1 (which I have at home) on my laptop, and I haven't had a reason to yet. I will not upgrade Quark unless I find that I can't interact with vendors/clients without it. Otherwise, there's little to no compelling reason for me. <br> <br>QX 7 will have to output PDFs* as well and InD and have full OT features <i>just so I'll consider maybe updgrading if I have to</i>. QX 7 will have to blow InDesign away for me to go back. Adobe showed a real desire to listen and improve. Quark did not, and now wants us to believe they've changed. I believe it when I see it. <br> <br>As for a question I'd ask the reps: How do you plan to compete with a company that is responsible for the bulk of the technologies necessary for digital print design? How will you make your offering more relevant to the direction we're going in both technologically and in terms of typographic sophistication, and why would I spend $1000 with Quark when I can spend the same amount with Adobe and get <i>so much more</i>?  <br> <br>*This is a big thing with my clients, many of whom I communicate with over email.</p>"
