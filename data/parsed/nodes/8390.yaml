    date_raw: 15 Jan 2005 — 11:18pm
    votes: null
    html: <p>I work at a large commercial printing company in the US, today we get about 85% Quark Xpress files, maybe 10% Adobe InDesign CS.  Of the Quark Xpress files, almost all are Quark Xpress 6.  So, I can tell you without question that Quark Xpress is still the industry leading page layout applicatio without question.  I use both, whatever the customer wants. <br> <br>Adobe InDesign CS is cool, but let's face it, it's way too bold with allowing designers to create a document that is sure to fail.  I mean why would it allow a designer to feather images at a fraction of a pixel and with transparency layer them all up to the point an adobe rip won't output them.  I see atleast 1 job a week that simply will not even output, rip, and trap.  InDesign has gone far but is no quark killer, now that quark 6 is out, that's as far as adobe indesign will go.</p>
