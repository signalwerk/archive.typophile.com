    votes: null
    html: "<p>Armin, your statement regarding native Photoshop files not being optimal for printing just isn't true.  <br> <br>The magazine publisher I work for produces thousands of pages per month using PSD files as our main image format. Likewise, we use transparency and (gasp!) drop shadows on some of those pages with no problems.* <br> <br>Setting up a reliable PSD/InD/PDF workflow is, as you put it, a matter of, um, doing it. <br> <br>*We do occasionally have problems with spot colors and transparency. But since 99% of our work is 4C, this isn't a big issue. <br> <br>To keep this post slightly on topic: Our company will buy a copy or two of QXP7 so that we can handle problem files supplied by advertisers in that format. But I don't see us returning to the Quark fold anytime soon. <br> <br>Nick: Can you explain more specifically the effect you want and why you can't achieve it with InDesign? I'm sure the collective brainpower here can find a solution.</p>"
