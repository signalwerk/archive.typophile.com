    html: "<p>Quark2pdf, is that 85% of all jobs received, or 85% of the native files your customers supply?  <br> <br>From your username I'm assuming you use some kind of PDF workflow. Do you actually check each PDF to see which application created it? My prediction is that more than 10% of the PDFs you receive were created by InD users. <br> <br>Here's another unscientific way to judge market share: look at employment ads and count the growing number of companies that include InDesign as a job requirement. It's definitely higher than 10%, and growing. <br> <br>I'm sympathetic to the printer's plight: they're at the bottom of the hill, and we all know which way the feces rolls. But to say an application shouldn't include features that can be potentially misused is silly. There were ways to create un-RIPable files long before InDesign arrived.</p>"
    html_clean: "<p>Quark2pdf, is that 85% of all jobs received, or 85% of the native files your customers supply?  <br> <br>From your username I'm assuming you use some kind of PDF workflow. Do you actually check each PDF to see which application created it? My prediction is that more than 10% of the PDFs you receive were created by InD users. <br> <br>Here's another unscientific way to judge market share: look at employment ads and count the growing number of companies that include InDesign as a job requirement. It's definitely higher than 10%, and growing. <br> <br>I'm sympathetic to the printer's plight: they're at the bottom of the hill, and we all know which way the feces rolls. But to say an application shouldn't include features that can be potentially misused is silly. There were ways to create un-RIPable files long before InDesign arrived.</p>"
  - id: 55751
    user: 2851
    date: 2005-01-16T19:07:00
    date_raw: 16 Jan 2005 — 7:07pm
    votes: null
    html: "<p>My two cents: As a graphic designer, I have also been using Quark since 1989. I have upgraded faithfully since that time and continue to use Quark for most of my print layout jobs. I have to tell you that I have never been satisfied with the price I have had to pay for the program, the crappy service or now the fact that I have two computers at home and am only able to install the program on one of my computers due to the licensing software limitations.  <br> <br>Recently, I have been using InDesign for layout and it's not half bad. I can tell you that up here where I am (Ottawa, Canada), most all of the design firms and big companies continue to use Quark. So do our main newspapers. The basic reason (they give me) is that they have hundreds and hundreds of archived documents (comprised of hundreds of pages) that are in Quark and the conversion over to ID is just too painful. That's understandable. Of course, there's also the learning curve on InDesign (which isn't that steep but still does require time, effort and money). We also have printers that are not as happy to take InDesign files - and that also deters use of the new product. <br> <br>I look at our college and the young future designers who are learning both programs and they really prefer InDesign. If they are the new generation of design, then the industry is going to have to change: There's no doubt about it. There's also the fact that Quark charges $1000 for its single application whereas the entire Adobe Creative Suite costs about the same.  <br> <br>Regarding \"features that can be potentially misued\", one has to wonder why Quark included all those new tools for webdesign. I mean, does anyone ever use those tools? Now that's silly. As for me, I can't see myself getting the upgrade to Quark 7. I just don't see the benefit.</p>"
    html_clean: "<p>My two cents: As a graphic designer, I have also been using Quark since 1989. I have upgraded faithfully since that time and continue to use Quark for most of my print layout jobs. I have to tell you that I have never been satisfied with the price I have had to pay for the program, the crappy service or now the fact that I have two computers at home and am only able to install the program on one of my computers due to the licensing software limitations.  <br> <br>Recently, I have been using InDesign for layout and it's not half bad. I can tell you that up here where I am (Ottawa, Canada), most all of the design firms and big companies continue to use Quark. So do our main newspapers. The basic reason (they give me) is that they have hundreds and hundreds of archived documents (comprised of hundreds of pages) that are in Quark and the conversion over to ID is just too painful. That's understandable. Of course, there's also the learning curve on InDesign (which isn't that steep but still does require time, effort and money). We also have printers that are not as happy to take InDesign files - and that also deters use of the new product. <br> <br>I look at our college and the young future designers who are learning both programs and they really prefer InDesign. If they are the new generation of design, then the industry is going to have to change: There's no doubt about it. There's also the fact that Quark charges $1000 for its single application whereas the entire Adobe Creative Suite costs about the same.  <br> <br>Regarding \"features that can be potentially misued\", one has to wonder why Quark included all those new tools for webdesign. I mean, does anyone ever use those tools? Now that's silly. As for me, I can't see myself getting the upgrade to Quark 7. I just don't see the benefit.</p>"
