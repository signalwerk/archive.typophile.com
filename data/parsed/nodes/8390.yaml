  - id: 55738
    user: 1947
    date: 2004-12-31T08:19:00
    date_raw: 31 Dec 2004 — 8:19am
    votes: null
    html: <p>I have used Quark since 1989, and stopped when InD came out. But InD and OpenType still have alot of ground to cover. This past summer I spoke at the Stanford Publishing Seminar and before my talk I asked for a show of hands regarding Quark v InD. 95% of the audience used Quark (these were mostly magazine publishers and editors, with a few designers scattered about). When I ased for a show of hands regarding OpenType, no one had ever heard of it. Now you may say that publishers and editors are not the target audience for OpenType and InD, but these are the people who more closely control a magazine's finances. And if their art directors are not pushing them for this stuff then it is still a way's off. <br>On the plus side, I know of at least two major international magazine publishing conglomorates who are slowly but surely moving to InDesign. One is interested in OpenType and the other is making the move for InDesign's XML tagging so they can reuse their content across multiple venues.</p>
