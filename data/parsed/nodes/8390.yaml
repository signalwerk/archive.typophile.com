    html: <p>I use InDesign for typesetting books and so far I have had no problems sending pdfs for print all over the world (read USA, Canada, UK and Israel). When Quark starts to support the typographic features that InDesign has had in the past 3 or 4 versions, then Quark would have a fighting chance, but in the meantime, when it comes to typography, Quark is now irrelevant unless the latest versions now have support for full ligatures, true small caps (as well as superiors, subscripts etc), old-style figures, symbol capitatisation, hanging punctuation, paragraph (rather than line) justification, contextual alternatives, swash capitals (need I go on?)</p>
