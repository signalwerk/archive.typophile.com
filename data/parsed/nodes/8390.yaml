    html: <p>When I was In Phoenix recently looking for work I went in to two places where they were still using Quark. I went in to the Arizona Republic and they had me test on Quark 4 and I bombed partly because Quark isn't as intuitive to me as InD after using Adobe products for so long (and partly because i was in a car wreck on my way to the testing!) <br>I went in and worked for a print shop for a week or so and they were using Quark 6, which is an improvement upon 4, but still not as easy to use as InD. I don't think I personally will ever buy any version of Quark, but may have to pick it up sometime in the future... if so, i dread that day! <br>But to address your initial question, I do think that there is a substantial percentage of the design market that is stuck in the Quark habit and just hasn't discovered the wonderful world of InD.</p>
