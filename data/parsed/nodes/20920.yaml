      <p>I'm sitting in front of my mac, laughing out loud! Ahh, a bit of levity always helps. </p>
      <p>Mellel turned out to be a pleasant surprise. Kerning seems to be on by default, it has automatic ligatures - dicretionary and others, auto swashes, historical forms/ligatures, auto small caps, you name it. It recognizes *most* of Musee's OT features, not all (i.e., a number of swashes), but until I get InDesign this will do very nicely. A great value at around 40-50 bucks, too. Well worth checking out. </p>
      <p>Another one that more or less did justice to Musee's beauty is Nisus Writer Express. I'm not sure about its kerning capabilities, though, seemed a bit shaky to me. </p>
      <p>In any case, Mellel is far better than MS Office when it comes to taking advantage of OT features such as are in Musee.</p>
