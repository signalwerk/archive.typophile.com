    html: |-
      <p>Miguel, </p>
      <p>&gt; AFAIK, OTL typography support for<br>
      &gt; non-Latin scripts is available in<br>
      &gt; Windows Office, correct? If so,<br>
      &gt; wouldn’t Latin OTL support come<br>
      &gt; for free? If so, what I fail to<br>
      &gt; understand is why isn’t that in<br>
      &gt; place already.</p>
      <p>First, there is the problem of user interface. The linguistic OTL features usually are supposed to "just work" while for user-controlled OTL features you need decent UI. If you look at Adobe's inconsistent solutions between Illustrator (OpenType, Character and Glyph palettes), InDesign (Character and Glyph palette but no OpenType palette), and Photoshop (only Character palette), you'll realize that it's not at all trivial. </p>
      <p>Second, there is the issue of backwards-compatibility in line-breaking. For Arabic or Indic scripts, there was constant improvement across Office versions (97, 2000, XP, 2003, 2007) which, however, often resulted in text reflow when you open the same document in different editors. In this case, the advantage of having ortographically more correct handling of the scripts was valued higher than the disadvantage of reflow. </p>
      <p>But for simple scripts, the Office team aimed for consistent line- and page-breaks in Word across versions. If at some point, you get ligatures and different kerning (GPOS-sourced class kerning vs. traditional plain kerning which usually is a subset of the earlier), your documents will certainly reflow. Apparently, the advantage of having typographic refinement has not yet outweighed the reflow risk in the Microsoft Office team members' heads. </p>
      <p>A.</p>
