    <p>I've got a problem. I just downlaoded the gorgeous "Musee" by DSType, which comes in OpenType and TrueType flavours. </p>
    <p>I'm using MS Office 2004 for Mac. The problem is that although the weights contain the special swashes, ligatures and other goodies I love, I have no access to them when I select "insert symbol." Seems a generic character map shows up. Same thing for the TrueType flavour. </p>
    <p>How can I access these special sets through Word 2004 for Mac?</p>
