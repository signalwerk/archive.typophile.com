      <p>&gt; <em>Write Microsoft and ask them to support the font format they codeveloped!</em></p>
      <p>LOL :^D<br>
      I'd say, write to MS but c/o the Word and/or Office team(s). AFAIK, they're the ones that don't give a penny to the good work the MS Typography team and other font developers are doing...</p>
      <p>&gt; <em>isn’t there any solution? How do I access the keyboard viewer?</em></p>
      <p>I believe Adobe was trying to overcome this problem when they decided to use <a href="/wiki/PUA" class="freelinking" rel="nofollow">PUA</a>'s in their fonts*. I don't think you'll be able to get any character into Word unless it has an <a href="/wiki/Unicode" class="freelinking" rel="nofollow">Unicode</a> value associated with it.</p>
      <p>&gt; <em>Or zhould I be using something other than Word for my Word Processing/design needs? Maybe InDesign?</em></p>
      <p>That's one option. I believe there are other out there. It will depend on the kind of work you do and how you need to output it. A simple word processing application is fine for office-like documents, but not for heavy-graphical documents that need to be offset printed.</p>
      <p>&gt; <em>I’m really disappointed.</em></p>
      <p>(As sorry as I am to have to say this in mid-2006,) Welcome to the <em>real</em> (type) world !! :^/<br>
      I completely understand your grief.</p>
