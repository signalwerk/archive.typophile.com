      <p><em>AFAIK, OTL typography support for non-Latin scripts is available in Windows Office, correct? If so, wouldn’t Latin OTL support come for free? If so, what I fail to understand is why isn’t that in place already.</em></p>
      <p>The OTL features implemented in Windows Office are all language shaping features, i.e. features that are active by default for the script and are not considered discretionary. Such features are also implemented for the Latin script, e.g. the ccmp and mark positioning features. What Office do not support, for any script, are features that require user interface.</p>
