      <p>Take a large-screen laptop with you, plus have all the stuff on a CD or DVD to possibly show on another system and/or leave behind (with all the files both separate and compiled into one zip). Also put everything on a flash drive just in case. And even if you don't need all those parts, casually mention that you brought all that along just in case.</p>
      <p>hhp</p>
