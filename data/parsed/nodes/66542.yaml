    <p>Hello all!</p>
    <p>I am in line for a graphic portfolio review some time next month with a potential employer and while I'm ecstatic about being offered one...</p>
    <p>I have really no idea what it is. While some internet searches have offered some help, most of what I've found is tailored to traditional physical art as opposed to digital. </p>
    <p>I was wondering if you'd all be willing to offered some general advice. I also was wondering how many pieces I should bring. The email I sent had five, but should I bring more? And how does one "bring" digital work?</p>
    <p>Thank you all—</p>
