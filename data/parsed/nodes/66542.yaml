      <p>Does that only happen on screen nowadays? Most times I've had to go show my work, I've been expected to bring printed samples (at least of those works not purely designed for the screen). This certainly depends on the sort of work you do (and the sort of work they do).</p>
      <p>Don't show too much, but make a good and concise selection. And bring additional work that you don't «need» to show but could, in case they're curious for more.<br>
      For a screen presentation, I'd recommend making a PDF (or Flash, or Keynote or whatever you prefer) that you can show full-screen, and that shows off your work in a nice unified layout. No digging around for separate project files (but do have additional project files with you, in case they end up wanting to know/see more about any one project).</p>
      <p>Extra nice might be to do a screen presentation but also bring printed samples to optionally supplement that. Like if you show a logo design it might be very cool to pull the matching business card out and show that in «real life».</p>
