      <p>I went to Identifont to have a look at Zapfino.</p>
      <p>It doesn't seem to have been as popular as Times Roman or Papyrus, or even Palatino and Optima. But I did find it scary.</p>
      <p>Both Zapfino and the completely different Zapfino Two are <em>script</em> faces. While I think one could make good use of them, say, on an album cover, and it certainly is narrow to think that script faces are only good for wedding invitations, their narrower domain of applicability reduces their opportunities to be used well.</p>
      <p>Using a face for a wildly inappropriate purpose, after all, is using it badly. Being popular hasn't stopped Goudy Old Style from being used well on occasion.</p>
