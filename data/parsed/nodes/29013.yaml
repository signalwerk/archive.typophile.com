      <p>eron,<br>
      thanks very. this is my first face (though the fourth version) and i am much in need of critical eyes. </p>
      <p>re: the k, my concern is that the horizontals are too close together. see sample words below.</p>
      <p>re: the e, yes.... i wrestled with that bar a lot. numerous variations. I think that inline and especially at smaller scale, the angle is less noticable, but i would be glad to hear your thoughts.  the weight i am still very uncertain of. the stress is the same as the other rounds except the o and d, whose interiors are rotated slightly to keep the set line from appearing to wobble and in the q. </p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Sample words_5541.png"></div>36pts. <p></p>
      <p>Note: these are all hand set and the spacing is various. any comments on spacing would be greatly appreciated, as i am preparing to 'fontify' these chars now (or as soon as i make any mods based on critiques recieved here).</p>
      <p>geo.</p>
