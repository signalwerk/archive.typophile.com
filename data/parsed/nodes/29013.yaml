      <p>That's really beautiful Geo. I didn't recognize the k at first, but seeing it in some words will probably make it more recognizable. I don't like the sloping bar of the e--it seems heavier then the thins in the other letters and I don't see the same stress angle in the other round letters.</p>
      <p>Eron</p>
