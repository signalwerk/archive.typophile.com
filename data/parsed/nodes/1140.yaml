    html: "<p> If any of you haven't seen OmniWeb's anti-aliasing, you should check it out. I for one am all for anti-aliasing, as long as it is a good algorithm. Photoshop, for example, does horrible anti-aliasing (and really fuzzy downsamples for that matter). Fireworks' anti-alias routines are better. Perhaps the answer is to give the user more controls over the parameters of the anti-aliasing algorithm. <br> <br>About aspect ratio: Now that I have been using my titanium g4 for a while (1152 x 768), I can't stand the horrible almost square ratio of the traditional monitor. I was going to buy a larger lcd to work on when I'm at my desk and I couldn't bring myself to do it. </p>"
