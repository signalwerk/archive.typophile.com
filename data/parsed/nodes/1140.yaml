    html: "<p> OK, no long-winded reply from me (for a change). <br> <br>To me the bottom line -irrespective of precendent, practical formatting issues, etc.- is that the human vision system (the retina, the neck, even our environment) is naturally horizontal. <br> <br>Just one specific rebuttal: <br>&gt; screen resolution is the best way to address this problem, beating anti-aliasing hands-down. <br> <br>They're not mutually exclusive, and each of us does what he can: I can't help to improve resolution, but I *can* make nice A-A bitmaps (until there's no longer a need). <br> <br>hhp </p>"
