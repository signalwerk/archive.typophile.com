    date_raw: 21 Jun 2002 — 2:28pm
    votes: null
    html: "<p> I will always be \"so print.\" The look of print is the ideal towards which screen graphics is trying to move. Why do you think all this anti-aliasing business is pursued in the first place? Say what you like about the quality, I see it slowly improving. But screen resolution is the best way to address this problem, beating anti-aliasing hands-down. And companies are investing in higher LCD resolution. IBM already has some 300dpi prototypes. And I haven't kept up with medical imaging technology either, which I bet is further along in the resolution game. <br> <br>Most book pages have a portrait aspect ratio. Notable exceptions like LetterLetter exist, but most print designers use portrait mode. The widely predicted End Of Print turned out to be a farce: the number of books being printed continues to grow. <br> <br>For designing fonts, most letters themselves have a portrait aspect ratio, so in portrait mode, you can get more detail in a maximized glyph window in FontLab. Try it sometime. <br> <br>But regardless, there are certainly situations where it's good to be able to use landscape mode as well, and the technology to rotate the screen is simple and cheap, so users should be given a choice. Apart from sites designed to work at 800pix wide or greater, I quite prefer my web browsing in portrait mode. </p>"
