    html: "<p> It is not time to design for 1024x768. It is time to design for 768x1024. LCD monitors are getting incredibly cheap, and folks smart enough to ask for it will get the pivoting kind (not much of any price difference.) <br> <br>Why the new iMac didn't do this I will never know. I'm so sick of landscape mode. Once we get over the crutch of a physical keyboard, we can have laptops/\"slates\" that support this too. (The touch screen LCD technology is already here and cheap.) I'm seeing rumors of an upcoming touchscreen Mac. That would be a great leap forward for designers. Draw on the screen already! <br> <br>My ideal portable: <br> <br>* pivot <br>* finely granular pressure-sensitive touch screen <br>* handwriting recognition or grafitti area w/ pop-up virtual keyboard <br>* snap-on \"real\" keyboard for those who want it <br>* 300 dpi screen <br>* Mac OS X <br> <br>The only thing anywhere near this is the still-not-shipping OQO (www.oqo.com) </p>"
