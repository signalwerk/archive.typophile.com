    date: 2002-06-22T16:31:00
    date_raw: 22 Jun 2002 — 4:31pm
    votes: null
    html: <p> I think it's hard to anticipate what the schism between electronic and printed information is going to be, but it's certainly coming. Some things are always going to exist in print, some things will cease to exist in print. Dostoyevsky and TV Guide offer a nice juxtaposition, or Pat The Bunny and the OAG Frequent Flyer Airline Schedule. We take for granted that books and newspapers contain different kinds of information; their formats reflect this, as does their typography. Although I wholly agree with John's excellent and succinct comments above, I have to acknowledge that a folded The New York Times is long rather than tall. That said, The New York Times is just the kind of thing that's best served up on a monitor. <br> <br>Speaking as a focus group of one, very little of the information I gather online resembles what I'm accustomed to on the printed page. I rarely read more than 250 consecutive words on screen, with the exception of e-mail, which arrives in windows that I stretch to fit the natural cadences of their content. The valuable information delivered over my monitor tends to be expressed in widely ranging proportions, just as the shape of a spreadsheet is determined by the data it contains. Travel itineraries seem to naturally flow vertically, product comparisons are generally horizontal. Neither of these kinds of information resembles John's book or Hrant's horizon, leading me to wonder if the Portrait v. Landscape debate might not be so relevant after all. <br> <br>If we're going to indulge in Things I'd Like To See (tm Mad Magazine), I'll vote for the 1200dpi digital paper in scroll format, which the user can unfurl as the situation dictates. Or the projection hologram, which sounds equally fun, and refreshingly non-rectangular. Until then, I'll use whatever Apple sees fit to manufacture. </p>
