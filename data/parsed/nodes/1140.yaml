    html: <p>While it may be time to break the 800px rule, <br>I find sites that _require_ the full 1024  <br>widths cumbersome. I think something in between  <br>is better, like 900 or so. <br> <br>And, yes a vertical aspect ratio is nice.  <br>However, there's something great about a truly  <br>cinematic (letter box) aspect ratio when it  <br>comes to motion graphics. I'm personally  <br>hoping the web goes more in this direction,  <br>than in a static, print-centric direction.  <br> <br>I've recently been re-inspired by the article  <br>format at the International Herald Tribune site  <br><a href="http://www.iht.com/articles/62077.html" target="_blank"> www.iht.com</a>. It uses set column widths and by <br>putting multiple  columns on the screen,  <br>doesn't require scrolling. It's a much more  <br>natural approach to reading on screen.</p>
