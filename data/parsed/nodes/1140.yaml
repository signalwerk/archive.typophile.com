  date_raw: 17 Jun 2002 — 10:43am
  votes: null
  html: "<p>A trip to Versiontracker this morning pointed me to an update of Internet Explorer for Mac OS X.  This latest version, v5.2, includes support for the new Quartz text smoothing feature included in X 10.1.5.  <br> <br>Even as I type this message, all the type on my screen is smoothed. I'm not sure I like it- the small type loses that crisp edge we've grown accustomed to, and the aliasing makes the type appear as if in a lighter color. I have to ask myself: Is this really more legible? <br> <br>Here's a quick screenshot comparison of Yahoo: <br> <br>Yesterday's Mac IE: <br><img src=\"http://www.typophile.com/forums/messages/30/1535.gif\" alt=\"yahoo1\"> <br> <br>Today's Mac IE: <br><img src=\"http://www.typophile.com/forums/messages/30/1536.gif\" alt=\"yahoo2\"> <br> <br>Here's my two cents on where I think this might go:  <br> <br>Small type on the web, as we know it now, will become  a thing of the past, if anti-aliased type is to become the norm.  Designers will have to allow for larger type selections in their site designs, which could pose a problem if we remain prisoners to the 800x600 browser size. Isn't about time we start designing for 1024x768?</p>"
  html_clean: "<p>A trip to Versiontracker this morning pointed me to an update of Internet Explorer for Mac OS X.  This latest version, v5.2, includes support for the new Quartz text smoothing feature included in X 10.1.5.  <br> <br>Even as I type this message, all the type on my screen is smoothed. I'm not sure I like it- the small type loses that crisp edge we've grown accustomed to, and the aliasing makes the type appear as if in a lighter color. I have to ask myself: Is this really more legible? <br> <br>Here's a quick screenshot comparison of Yahoo: <br> <br>Yesterday's Mac IE: <br><img src=\"http://www.typophile.com/forums/messages/30/1535.gif\" alt=\"yahoo1\"> <br> <br>Today's Mac IE: <br><img src=\"http://www.typophile.com/forums/messages/30/1536.gif\" alt=\"yahoo2\"> <br> <br>Here's my two cents on where I think this might go:  <br> <br>Small type on the web, as we know it now, will become  a thing of the past, if anti-aliased type is to become the norm.  Designers will have to allow for larger type selections in their site designs, which could pose a problem if we remain prisoners to the 800x600 browser size. Isn't about time we start designing for 1024x768?</p>"
