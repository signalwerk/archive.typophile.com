    html: |-
      <p>2706: Telephone receiver.<br>
      213B: Fax sign. This is supposed to be an alphabetic glyph that says "FAX" but I think function is more pertinent than form.</p>
      <p>For the rest, PUA. I am not sure whether it is legally acceptable to imitate the PUA codepoints used by Microsoft's Wingdings, which uses F02A for an envelope and F03A for a computer. The "glyph order" is supposedly patented. It's probably not worth it anyway since it's still just PUA.</p>
      <p>For my part, I already have been spending my time italicizing <em>clouds.</em></p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/italicairs_3703.png"></div><p></p>
