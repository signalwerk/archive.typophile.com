    html: |-
      <p>Why not?</p>
      <p>The symbols aren't letters or numbers or any other textual character.  They're images. Try this: set anything in Zapf Dingbats. Then italicize the line. Nothing happens. The font is designed not to be italicized. I tried it in InDesign. I had to apply a manual skew to the Zapf characters. </p>
      <p>When image glyphs are slanted, they seem to be tilted in perspective, not just skewed. I don't see lines of type that way, unless the line tapers in some way (like the Superman nameplate on the comic strip or the narration to the first Star Wars movie).</p>
    html_clean: |-
