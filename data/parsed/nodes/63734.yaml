    <p>Hi everybody,</p>
    <p>I have a major problem: my font is completely ready, I double checked everything, opentype features, opentype classes, kerning classes and so on. When I generate the font, fontlab does not complain about anything (just slowing around 92%). And then when I try to install it through Font Book, Font Book refuses to install it and warn me that the file is not good and can corrupt the system. Yet when I put the font in the "Fonts" file of InDesign, it works perfectly. What could the problem be? As I have no tip from Fontlab about any problem, I am a bit lost...</p>
