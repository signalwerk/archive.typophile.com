    html: <p>I don't mind that the logo is the only angled element. It helps it stick out a bit.  <br> <br>It does seem to work well on the card, though. I like the staggered one. Working on the diagonal actually gives you a bit more room in terms of line lengths to work with. <br> <br>BTW, very nice solution overall. Have you considered actually getting sticker-tape with that printed on it? (Kind of like the continuous rolls of printed tape they stick on your gallons of milk at the grocery store...)</p>
