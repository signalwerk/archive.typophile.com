    html: <p>Well, actually you might aply that to the system. But it's up to u, either you do it or not it's stil same strong identity, just 2 diferent aplications. I rally like your aproach to this project, but I would simplify it a bit. Try this, white ifon in the red background in one side, all red not pattern, pattern is dated, always, after a while you get tired of that, doesn't matter how nice it looks at first sight. logo in the other side exactly how it is. Again, I know you like assymetry that's ok. In type that is given beautifully by left alignment. so why do you got stuck in tha stagged type. doesn't work for, just look a wank design. you are mixing too  much in my opinion. SIMPLE AND EFFECTIVE, keep in mind.</p>
