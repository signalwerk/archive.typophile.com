  html: <p>Kinda stuck on trying to get this to work. <br> <br>The client likes the repeating angled logo lockup.  Alludes to film (they will make political commercials), and sort of hints at the idea of "red tape" (turning this metaphor on its head as they are anti-bureaucracy). <br> <br>My problem is trying to figure out how to deal with the contact info.  Should I angle it or keep it horizontal.  My goal would be to make it work angled, but it seems to work better on the business card than the letterhead. <br> <br>Also, if any angled Identities come to mind, please pass them along. <br> <br>thanks. <br>peter <br> <br><img src="http://www.typophile.com/cgibin/board-post.pl?action=posting_upload_form&amp;what=show&amp;img=49543" alt="can.gif"> </p>
