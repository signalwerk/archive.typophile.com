  html: |-
    <p>Following up on <a href="http://www.flickr.com/photos/hardwig/5890727918/" rel="nofollow">Luc(as) de Groot’s experiment</a> of alternating typefaces in every other paragraph of a newspaper, I threw together letters from both Univers and Helvetica and did some scaling. I used the open source versions of the fonts by URW.</p>
    <p>The <a href="http://www.artifex.com/downloads/doc/Public.htm" rel="nofollow">Aladdin Free Public License</a> applies.</p>
    <p>Remarkably, to me the result looks more like Univers than Helvetica, and on Windows the hinting helps a bit to unify the appearance. Because of the different stem widths and weird spacing, in print it has the feel of an irregular typewriter or rub-down lettering face.</p>
    <p>Check it out for yourself: <a href="http://www.kutilek.de/download/helvers.zip" title="http://www.kutilek.de/download/helvers.zip">http://www.kutilek.de/download/helvers.zip</a></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/helvers_4570.png"></div><p></p>
