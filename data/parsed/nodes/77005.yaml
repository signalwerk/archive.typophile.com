    <p>Hey everyone!</p>
    <p>It's been a while since my last post, but I've become very intrigued in this typeface. Now attending college, the OED has become one of my greatest tools, and the typeface used for the header in each entry ("definition, n." below in red) is gorgeous. If I'm not mistaken, the serifed text in the definitions are also of the same family.</p>
    <p>Though, I have to say, without the "fi" ligature, this particular example is not so pretty.</p>
    <p>Any and all help is greatly appreciated as always!</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/definition_5078.png"></div><p></p>
