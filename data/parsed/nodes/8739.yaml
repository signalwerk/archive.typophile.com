  - id: 57389
    user: 2915
    date: 2005-01-20T14:43:00
    date_raw: 20 Jan 2005 — 2:43pm
    votes: null
    html: "<p>I agree with Chris \"don't shoot the Phoenix\". I don't love how rigid and compartmentized everything is. Did you investigate letting the Phoenix emerge from the O. That way you could loose the rules and loosen up the design so It can vary to circumstances of use.  <br> <br>An aside: Why are all the logos I'm seeing lately here justified? Is Justifing the lines making it a logo? What I feel is you need to create a corporate or business idenity and make it flexible enough that it works in all your busniness environments. Then make the mark or logo fit the business scheme. It seems lately the opposite is true.</p>"
    html_clean: "<p>I agree with Chris \"don't shoot the Phoenix\". I don't love how rigid and compartmentized everything is. Did you investigate letting the Phoenix emerge from the O. That way you could loose the rules and loosen up the design so It can vary to circumstances of use.  <br> <br>An aside: Why are all the logos I'm seeing lately here justified? Is Justifing the lines making it a logo? What I feel is you need to create a corporate or business idenity and make it flexible enough that it works in all your busniness environments. Then make the mark or logo fit the business scheme. It seems lately the opposite is true.</p>"
