    html: "<p>I like version B, but I think you'd have to create a second version for small applications, with the following alterations: <br> <br>1 Solidify Phoenix (no feather lines) with no stroke (it's causing the shape to lose detail) <br>2 Enlarge the word \"Phoenix\" to fill the space that is framed by the horizontal lines <br>3 Relocate \"PRINT &amp; DESIGN\" and also \"SPI INC\" outside of the framed area <br> <br>Aloha! <br>Scott</p>"
