    date_raw: 21 Jan 2005 — 1:51am
    votes: null
    html: <p>Our company also has an unwieldy registered name, so we use the 'snappy' name in the logo, and put the full name in the address block of our stationery etc. Would that be an option to solve the 'SPI INC' problem? <br> <br>I share Daniel's thoughts about the risks of 'designing yourself into a corner'. You need to think about all the possible future applications of your logo and the potential problems of adapting your logo to them. <br> <br>BTW, I noticed from your profile that you're also a tattoo artist. I read a great thread here about tattoos last year that might interest you, if you haven't already read it. I can't seem to find it, though.</p>
