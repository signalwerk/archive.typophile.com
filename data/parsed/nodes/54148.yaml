    html: |-
      <p>When Times Roman was introduced in the 1930s, it was a breath of fresh air. It had a narrow shape to fit well in newspaper columns, and a generous x-height for ease of reading. With its oblique stress, it was much easier on the eye than the newspaper types it replaced, variants of the Scotch Roman family with vertical stress, wide serifs and exaggerated contrast between thick and thin strokes (this example is from the London Times in 1922).<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/london_4679.times.close.jpg"></div><br>
      On the Linotype, Times had not only a bold and an italic, but a bold italic (most text faces didn't), so it became the workhorse typeface for all kinds of text composition. This made it the obvious serif font for the early desktop publishing systems, which caused it to spread like kudzu.<br>
      Like Helvetica, Times is a perfectly good font that was undone by its own success, reduced to the visual equivalent of white noise.<p></p>
      <p>That being said, I agree the guy who combined Times with Comic Sans initials ought to be waterboarded.</p>
