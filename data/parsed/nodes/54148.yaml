      <p>Huh? But why should it? Signage typefaces are in a league of their own—like, say, typefaces for the screen, for the phone directories, for classified ads, etc. There are a few custom variations of Times New Roman—<em>and</em> Times Roman (those are different typefaces)—created for specific purposes and uses, like Semibold, Claritas, Series 569, Seven, Medium, Small Text, Ten, Eighteen. What would be wrong with developing a special version for signage?</p>
