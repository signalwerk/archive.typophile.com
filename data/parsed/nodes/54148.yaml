      <p>Yehan (Mark) that was an inside joke about my forthcoming new text Caslon. It's actually not going to be in the same 'space', as it is not so condensed as Times New Roman. I have tried to make it better for many uses, but certainly not for all. </p>
      <p>What Times New Roman did better than any previous face was to cram more letters into the line while remaining very readable, and also achieving a crisp, modern look. The trick, which according to one story was Stanley Morrison's idea, was to put the sharp, lapidary serifs of Gill's Perpetua onto Monotype Plantin. This concept--very well executed by Victor Lardent--made Plantin look more modern and crisp. (There is an alternative theory of the origin of Times Roman, which may be true, but this one reveals what is distinctive about it.)</p>
      <p>Times Roman shines at small sizes in narrow columns, and in small format books. The main weakness of Times New Roman to my eyes is that it is a trifle too condensed and dark. </p>
      <p>It is severely compromised with normal margins on letter sized office stationary. At sizes that are good for Times the measure--line length--is too long for comfortable reading. In that sense it was not a great choice for computers, as most of the output from computer goes onto letter sized paper. But it is still one of the great faces of the 20th century. </p>
      <p>Of course it is so ubiquitous that if you want a fresh or distinctive look, it is much easier to go for an alternative. Still, good designers sometimes figure out how to make it look good and fresh again.</p>
