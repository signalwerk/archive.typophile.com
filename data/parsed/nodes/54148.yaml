      <p>The popularity/over-use of a font has only partial relevance to its functionality. Times came out OK in the printing of early 20th century newspapers, but now it's too light and too contrasty. There's actually a nice demi weight of Times, but it's a rara avis. As for Helvetica, its various parameters (vertical proportions, weight, spacing) are out of whack with each other, so it has never really worked well (with the possible exception of the hairline weight at very large sizes). People tend to like Helvetica because they take their particular pet ideology too seriously, subverting the world to it.</p>
      <p>hhp</p>
