      <p>The original TNR was (of course) conceived for use by the newspaper. Which was a very upmarket newspaper at the time: twice as expensive as the rest, printed with great care on superior paper. The combination of all this resulted in a very nice looking product, which showcased TNR to the fullest.</p>
      <p>Later usage has done a lot to diminish this high quality image. And the first digital versions were pretty awful, imo.<br>
      It may be just the moment for TNR to make a come back...</p>
      <p>. . .<br>
      Bert Vanderveen BNO</p>
