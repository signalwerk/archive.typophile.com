    <p></p><div class="imageWrap"><img src="http://typophile.com/files/schild_hib_3c_4449.png"></div><p></p>
    <p>It took a while in the pipeline but now it’s there: I’m pleased to announce the release of <a class="freelinking external" href="http://www.myfonts.com/fonts/andreas-stotzner/hibernica/" rel="nofollow">Hibernica</a>.<br>
    Hibernica is the ‘Irish sister’ of Lapidaria, on which design it has been based. So you have even the possibility to combine those two for a perfect harmonized look in multilingual settings.<br>
    All fonts contain the full set of dotted ḃ ċ ḋ ḟ ġ ṁ ṗ ṡ ṫ in upper- and lowercase and an additional set of a dozen celtic ornaments.<br>
    Thank you all typophiles who commented earlier upon single aspects of the design. I’m not Irish nor do I command any of the Gaelic languages, but, as a type freak, I enjoyed very much to dig into this matter. Maybe, you interested parties make something of it … </p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/schild_hib_4_4527.png"></div><p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/schild_hib_5_4526.png"></div><p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/schild_hib_7_4033.png"></div><p></p>
