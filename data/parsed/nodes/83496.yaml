  html: |-
    <p>Does anyone know this typeface and can provide a link to the font? I'm restoring my old wagon for my daughter and want to use the same vintage logo. I can't find it as a decal anywhere and may just recreate it instead of doing a traced stencil. But if there is a font out there I can use it will make it much easier.</p>
    <p>"radio" looks very similar to Bauhaus but there are differences especially with the "r" and "i" and "flyer" isn't anywhere close. hopefully the "18" is a match as well.</p>
    <p>Thanks for any help!</p>
    <p><img src="/sites/default/files/old-images/radioFlyer_4049.jpg"></p>
