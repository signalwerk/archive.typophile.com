    <div class="info">Submitted by <a href="/web/20081014001836/http://typophile.com/user/108" title="View user profile.">Miss Tiffany</a> : 19.May.2008 5.59pm </div>
      <p>The Hamilton Type Festival features a series of events focused around typography and signage in Hamilton Ontario. Some events include:</p>
    <p>May 9 - June 6<br>
    Ghost Signs of Hamilton - A photographic exhibition documenting Hamilton’s ghost signs originated at the Art Gallery of Hamilton last year. Showing at Mixed Media until June 6.</p>
    <p>Thursday, May 22, 7pm<br>
    Helvetica (the film) - Hamilton premiere at Staircase Theatre</p>
    <p>Saturday, May 24th, 1-3pm free<br>
    Greg Smith, typesetting demonstration At The Print Studio<br>
    173 James St. N.</p>
    <p>Saturday, May 24th, 1-3pm free<br>
