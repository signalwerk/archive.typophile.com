      <p>@dtw:<br>
      <cite>it would be nice if the minus key on the numeric keypad would simply, by default, insert U+2212 instead of U+002D!</cite></p>
      <p>That might make sense under some conditions - under which the * and / keys on the numeric keypad ought to insert U+00D7 (×) and U+00F7 (÷) respectively too. The trouble, of course, is determining when those conditions apply.</p>
      <p>Under <em>normal</em> conditions, it would be extremely confusing for the keyboard to generate anything outside of the conventional ASCII range from U+0000 to U+007F from any key which could plausibly be associated with a character within that range. Of course, defining "normal" conditions as typing text into Notepad, Programmer's File Editor, or gedit for input into, say, a FORTRAN compiler <em>may</em> seem to some as being perverse these days...</p>
      <p>Oh, and I even have a cute little reference chart of the extra characters on the Macintosh:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/acctd_5767.gif"></div><p></p>
      <p>having been aware of its useful feature in this area.</p>
