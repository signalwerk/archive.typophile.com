      <p>The current Mac keyboard alternates:</p>
      <p>Plain: `1234567890-=   qwertyuiop[]\   asdfghjkl;'   zxcvbnm,./<br>
      Shift: ~!@#$%^&amp;*()_+   QWERTYUIOP{}|   ASDFGHJKL:"   ZXCVBNM&lt;&gt;?<br>
      Option: `¡™£¢∞§¶•ªº–≠   œ∑´®†¥¨ˆøπ“‘«&nbsp;&nbsp;&nbsp;åß∂ƒ©˙∆˚¬…æ&nbsp;&nbsp;&nbsp;Ω≈ç√∫˜µ≤≥÷<br>
      Opt/shift: `⁄€‹›ﬁﬂ‡°·‚—±&nbsp;&nbsp;&nbsp;Œ„´‰ˇÁ¨ˆØ∏”’»&nbsp;&nbsp;&nbsp;ÅÍÎÏ˝ÓÔÒÚÆ&nbsp;&nbsp;&nbsp;¸˛Ç◊ı˜Â¯˘¿</p>
      <p>It is possible, with the option key, to type most common special characters for the Latin alphabet (other than special typesetter's spaces) if you know the keystrokes involved. En dash, for instance, is opt+hyphen. Accents work as follows:</p>
      <p>á = opt+e; then a</p>
      <p>Some other commonly used typographic symbols — I have these memorized from frequent use:</p>
      <p>em dash — opt+shift+hyphen<br>
      ellipsis … opt+semicolon<br>
      midpoint · opt+shift+9<br>
      bullet • opt+8<br>
      Spanish question ¿ opt+shift+question<br>
      Spanish exclamation ¡ opt+1<br>
      aesc æ opt+comma<br>
      oethel œ opt+q</p>
      <p>There are a few other InDesign-specific ones, like cmd+n for an en space and cmd+m for an em space.</p>
      <p>Bringhurst, by the way, proposes a method of combining opt/shift keys to cover all characters needed for (I believe) all uses of the Latin alphabet in European languages, plus a few additional characters.</p>
      <p>Oh, and to address the original topic of this thread, I use an en dash for minus, with spaces on either side if in an equation, without spaces if for a single negative number.</p>
      <p>3 – 2 = 1</p>
      <p>–30 ˚F</p>
