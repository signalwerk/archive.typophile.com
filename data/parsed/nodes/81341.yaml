    html: |-
      <p>Many fonts don't have the U+2212 minus sign, but any that is intended for typesetting math really ought to. If it's just an incidental negative number in a body of text, and not a mathematics publication, a U+002D hyphen-minus should be adequate.</p>
      <p>Just my opinion.<br>
      I'd go with oldnick and use an en-dash in columnar setting, just not in body text.</p>
