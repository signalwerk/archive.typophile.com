      <p>I often (eg Bodoni Egyptian, Figgins) make the en-dash and minus identical, so that the en-dash will "do" for the minus sign, and matches the plus sign in alignment, weight, and width.</p>
      <p>But design-wise that's not always in the best interests of the typeface, so I don't make it a standard practice.</p>
