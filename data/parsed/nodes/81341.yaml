    html: |-
      <p>The font you're using will probably have a plus sign and an equal sign. The minus is supposed to match them in length. If the font lacks a minus, use the nearest thing to it, which will usually be the en dash. If it's noticeably different from the ideal length, you can scale it!</p>
      <p>The substitution of a hyphen only started to happen with monospaced typewriters and computers. Bringing that habit back to a proportional face is bad practice. In most text faces a hyphen is rather too small and can get overlooked. No matter what the context, the difference between a negative number and a positive one is going to be important enough that it <em>should</em> break the color of a body of text.</p>
