    html: <p>Quite often our (academic journal) authors will use a hyphen for negative numbers in their manuscripts (simply because it's a helluva lot easier to get at than the proper minus, and/or they're unaware that the font may contain such a separate character), but our copyeditors will always replace it with a minus for the final typeset articles.</p>
