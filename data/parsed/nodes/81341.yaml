      <p>@cerulean:<br>
      <cite>The substitution of a hyphen only started to happen with monospaced typewriters and computers. Bringing that habit back to a proportional face is bad practice.</cite></p>
      <p>@dtw:<br>
      <cite>simply because it's a helluva lot easier to get at than the proper minus, and/or they're unaware that the font may contain such a separate character</cite></p>
      <p>This is one symptom of a larger problem.</p>
      <p>In Latin-alphabet languages other than English, things are made worse by the need to accommodate accented letters on the conventional keyboard. But even on the English-language keyboard, several character positions make sense for computer programming only. They don't even make sense for "word processing"... business document typing, which used to be monospaced, but which, even with a proportional typestyle, is <em>not</em> typesetting.</p>
      <p>An English-language keyboard, thus, for use in the U.S. environment, ought to be switchable into a "word processing" mode, where the following characters get substituted on the keys:</p>
      <p>~ is replaced by ±<br>
      ` is replaced by º<br>
      &lt; is replaced by ¶<br>
      &gt; is replaced by §<br>
      | is replaced by ¼<br>
      \ is replaced by ½<br>
      { is replaced by £<br>
      } is replaced by ¾<br>
      ^ is replaced by ¢</p>
      <p>For <em>typesetting</em> mode, it is necessary to replace the underscore with the em-dash, to make † and ‡ accessible, and, ideally, ⅛, ⅜, ⅝, and ⅞ as well. (One doesn't need @ and # in that mode, which will help a little - ~ and ` can also have their substitutes changed. That's still two characters short, but the European keyboard <em>does</em> have one extra key...)</p>
      <p>And, as I've noted, for typesetting, the keyboard really should provide small capitals as a third shift, which would require turning Unicode upside down, as small capitals are not currently recognized as a "case".</p>
      <p>If one is going to use a special symbol for minus, however, one has (in however much of a small way) entered into the domain of the typesetting of mathematics. At this point, one has reached a level at which "Abandon all hope, ye who enter here" or at least "May God have mercy on your soul" seems like the appropriate comment.</p>
      <p>Thus, while it is already foolish to hope that Windows (<em>or even the Mac</em>, which at least does offer special characters with an alt shift on its default keyboard) might someday offer "US English - Word Processing" and "US English - Typesetting" alternate keyboard layouts... making the math stuff handy goes beyond that.</p>
      <p>Not that it's impossible; after all, keyboards that looked like this</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/scadet_6089.gif"></div><p></p>
      <p>(this is a drawing I made for my web page, so as to avoid rights questions; there are <a class="freelinking external" href="http://world.std.com/~jdostale/kbd/SpaceCadet.htm" rel="nofollow">photographs</a> of this keyboard on the web as well, if you would like to see the real thing) existed, and there are the three keyboard layouts for the IBM Selectric Composer for Mathematical Greek, Mathematical and Technical elements, and various mathematical keyboard layouts for photocomposition machines... but we don't even get the APL layout offered to us as standard.</p>
