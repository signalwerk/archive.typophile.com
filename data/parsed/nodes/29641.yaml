    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Typefaces" class="freelinking" rel="nofollow">Typefaces</a> : Californian</strong></p>
    <p><img src="http://www.fontbureau.com/media/images/specimen/splash/californianfb.gif" img=""></p>
    <p>Considered of one his finest type designs, <a href="/wiki/frederic_w_goudy" class="freelinking" rel="nofollow">Frederic W. Goudy</a> designed Californian as a private commission for the University of California at Berkeley in <a href="/wiki/1939" class="freelinking" rel="nofollow">1939</a>. Californian was later released by <a href="/wiki/Lanston%20Monotype" class="freelinking" rel="nofollow">Lanston Monotype</a> for general use by designers and printers.</p>
