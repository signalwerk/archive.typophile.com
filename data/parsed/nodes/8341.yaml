  html: <p><img src="http://www.typophile.com/forums/messages/29/56610.gif" alt=""> <br> <br>I have been designing it on an LCD screen, so It will be good to see how it holds up on Mr. Anybody's screen. I took no gret pains to pick suitable greys, but I forsee I will need to make careful revisions. As it stands, there is Black and three greys. <br> <br>Still havent got that X right, and the V and W are giving me trouble at this size. <br> <br>If you've seen my brother's post about his bitmap font composition software (made in php or html or something) then know that I'll probably adding this one to its catologue. By catologue I mean the severely unfinished one that already exists :-S. <br> <br>- Chris</p>
  html_clean: <p><img src="http://www.typophile.com/forums/messages/29/56610.gif" alt=""> <br> <br>I have been designing it on an LCD screen, so It will be good to see how it holds up on Mr. Anybody's screen. I took no gret pains to pick suitable greys, but I forsee I will need to make careful revisions. As it stands, there is Black and three greys. <br> <br>Still havent got that X right, and the V and W are giving me trouble at this size. <br> <br>If you've seen my brother's post about his bitmap font composition software (made in php or html or something) then know that I'll probably adding this one to its catologue. By catologue I mean the severely unfinished one that already exists :-S. <br> <br>- Chris</p>
