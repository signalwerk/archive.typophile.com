    html: <p>Black, white and three grays is a solid basis, but your results are too fuzzy - too reliant on Gray. I bet you're using a Mac, which has a flatter gamma than Windows, but the latter should be your [main] target. Another thing you don't want is light grays at the ends by themselves; around 70 is the lightest you should go for "body" elements. <br> <br>Also I'd suggest taking one pixel from the descenders and giving it to the x-height. <br> <br>hhp</p>
