    <p>hi, my client needs their letterhead to be in word... so logo needs to print from word because it is not already preprinted on the paper.<br>
    my problem is that the logo prints out pixelated or jagged or blurred looking no matter what format i bring it into word in... jpg, pdf eps all have issues. anyway i can have it print out flawless?</p>
