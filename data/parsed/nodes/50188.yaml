    <p>The 1st day of classes is coming and all the students are excited! It's actually just an IT briefing but somehow it seems symbolic to everyone. I get my bike back from the shop tomorrow.  I think I'll bike over to Waitrose and get some lovely dover sole.</p>
    <p>-e.</p>
