      <p>Thanks for all the support! I really appreciate it!</p>
      <p>I think that there is very limited blogging going on so far. I am have something in process but it will be a little while before I shows up. I will ask the other students to send me their links &amp; create a compendium 'o links. Dan - you set quite a high bar for us to meet! </p>
