      <p>Songti, or Song typeface, refers to a basic serif style of Chinese characters. Simsun is a Song typeface for Simplified Chinese (as used in Mainland China) shipped with Windows XP. All major operating systems and several office suites will come with typefaces in this style. You can also buy Song typefaces at <a href="http://www.ascenderfonts.com" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Ascender Fonts</a> (any Chinese font with 'Song' in the name). Make sure you use fonts for Simplified Chinese, as this is what you will presumably need considering that they are asking for Simsun.</p>
      <p>More information here: <a href="http://en.wikipedia.org/wiki/Ming_(typeface)" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://en.wikipedia.org/wiki/Ming_(typeface)</a></p>
