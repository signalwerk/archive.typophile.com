      <p><cite>OS X comes with STSong, which is also very nice and might serve so long as your workflow does not include PDF: as licensed by Apple, none of the SintoType (ST) fonts allow embedding in PDFs.</cite></p>
      <p>On OS X 10.6, if I look at the STSong info with Font Book, it says "Embeddable". If I use it in TextEdit and either save as pdf or print as pdf, the font is embedded. </p>
