    <p>Greeting from Ireland, I have been in the industry longer than I wish to remember and have been asked to design my first chinese advert, the fonts asked for are Simsun or Songti.<br>
    I cannot find where to buy these but can download them from numerous sites but only wish to work above board.<br>
    Anyone with experience of using chinese fonts your advice would be greatly appreciated.</p>
    <p>Kind regards</p>
    <p>Dob</p>
