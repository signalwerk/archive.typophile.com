      <p>Glad to hear that's changed.  I used to use the Windows version of STSong a lot -- it is embeddable, and I missed it for Mac jobs.  One of these days I'll have to update OS X.  But unless the revised STSong has also picked up the variant forms feature I'd probably use Adobe Song.  I see I also mistyped "SinoType."</p>
      <p>David</p>
