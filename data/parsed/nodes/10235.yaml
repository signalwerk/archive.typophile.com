    html: <p>Mana comes in 13* and 16 PPEM - you can see them on the Ultrafonts site. It's probably not too expensive for you to buy them just to test; and if they don't work you might find a use for them in the future. <br> <br>* Which actually has an Arial air to it, at least in the Regular lowercase. <br> <br>I think a decent fallback would be to use a 1-bit font, which I'm pretty sure that new Flash feature can handle. But hopefully you can get grayscale to work. <br> <br>Do let us know what happens! <br> <br>hhp</p>
