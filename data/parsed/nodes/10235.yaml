    html: <p>I've had a quick look at Mana on Ultrafonts. <br>Unfortunately if you right click and choose 'quality- low' in the flash player, we go straight back to the beginning, and the fonts become very aliased. <br> <br>Is there no such thing as a font that contains no outline data, but only bitmap data ? <br>Greyscale if possible ? <br> <br>All I'm really looking for is a test greyscale bitmap ttf font to play with. It doesn't even have to have real glyphs in it. We're only interested in seeing if it works in Flash, and if there is any performance boost over standard outline fonts. <br> <br>Can anyone send us a 'demo' greyscale bitmap ttf font to test ? <br> <br>Rob.</p>
