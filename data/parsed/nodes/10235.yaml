    html: <p>Hmmm... was a bit worried about that. <br> <br>We're basically trying to get away from using vector fonts (outlines fonts with or without 'clever' hinting). <br> <br>Nor are we too worried about 'tiny' fonts, but rather more traditional "Arial' derivatives at 12px, 14px and 18px. So there is no real worry about 'blurry' visuals at very small font sizes. <br> <br>We are ONLY worried about performance issues. <br> <br>Ideally we would like to use 'low-quality' mode fonts in flash and have the nice anti-aliased edges of 'high-quality' mode. <br> <br>The only way I can see this happening, is if there is a bitmap font... the trick is... does flash support greyscale bitmap fonts or not... <br> <br>...if it does, all I really want to be able to do is convert a standard outline font into a greyscale one and use it in Flash. <br> <br>...if it doesn't, then there are 2 ways forward. <br>1. Use standard 1 bit fonts during high calculation areas, and then use high quality mode for notifications and interaction. *ugh* <br>2. Use a bitmap based lookup graphic element table and chain 'words' together. Just requires more programming I guess, and kerning goes right out the window. Then for the interactive areas, I would then switch to standard fonts in high quality mode. *not so ugh, just more work* <br> <br>I guess it all really depends on how thoroughly flash has embraced the relatively not-so-new TTF specification. *heh* <br> <br>Any further light ? <br> <br>Rob.</p>
