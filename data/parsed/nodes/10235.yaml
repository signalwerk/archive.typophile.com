  html: <p>We've got a flash project that we are trying to squeeze every cpu cycle out of. <br>Obviously the best way to do this and get any form or decent quality, is to go with bitmaps, rather than vectors in low-quality mode. <br>So we're looking to test the performance of greyscale fonts in Flash in low-quailty mode. <br>If this works out I guess we'll have to investigate the next steps of building such a font, although after reading previous posts in this forum it might be a lot less painful to us if we outsouce it. <br> <br>So... we're looking for a demo greyscal bitmap font to be tested in flash MX 2004. <br> <br>Any offers ?</p>
  html_clean: <p>We've got a flash project that we are trying to squeeze every cpu cycle out of. <br>Obviously the best way to do this and get any form or decent quality, is to go with bitmaps, rather than vectors in low-quality mode. <br>So we're looking to test the performance of greyscale fonts in Flash in low-quailty mode. <br>If this works out I guess we'll have to investigate the next steps of building such a font, although after reading previous posts in this forum it might be a lot less painful to us if we outsouce it. <br> <br>So... we're looking for a demo greyscal bitmap font to be tested in flash MX 2004. <br> <br>Any offers ?</p>
