      <p>With respect to your original design intentions, in all honesty I think it looks great with the space before the @.</p>
      <p>Think about the psychology of a user reading your card: </p>
      <p>1.<br>
      user thinks: "right, what is the first user part of the e-mail address?"<br>
      ---card facilitates legibility of this, by appropriately and easily indentifying and emphasising mdg2184 (which is a mouthful)--</p>
      <p>2.<br>
      user thinks: "right got it, what is the end part after the @ symbol?"<br>
      --card facilitates legibiligy of @, with the extra preceeding space--</p>
      <p>The e-mail address still looks like the same chunk of information, thanks to the bracket of your area code.</p>
      <p>Again with respect, I think all designers are guilty of getting caught up in TOO much detail, at times unnecessarily. You sound pretty tense, and I think it's best to accept it and look at the bright side this time.</p>
