    <p>Recently graduating, I absolutely had to have business cards to hand out, and I noticed this unfortunate mistake. I double-checked my digital file, and it is not reflected there, nor did I encounter it in my proofs. I have no idea what happened, and this really is one of the first times I have had this type of issue in all my printing experience. Being affiliated with commercial print shops and presses for the past three years, employed in two different pre-press departments. this is one of the worst shifts or mistakes I have ever seen.</p>
    <p>Notice how far away the "@" is away from the email address. How BAD is this REALLY. Some argue that its like a natural stop before the server info, I say its a typographical nightmare. I have 1000 of these puppies, and I just can't seem to to get over this. Maybe the sagely advice of some other typophiles will calm my nerves.</p>
