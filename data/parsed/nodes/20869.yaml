      <p>To answer that, I have to say that:</p>
      <p>A) I received way more prints than I was supposed to. I ordered 500, paid for 500, but actually got 1000+. This isn't a reason to not have them reprinted, but, I really do hate wasting. Recycling is great, but in the end, if you do a little research, the amount of resources it actually takes to run the recycling plants barely breaks even with the recycled product that is produced.</p>
      <p>B) It was a friend that printed them, and even though are relationship is good, people don't always take criticism well, and often times may not offer to do favors and such for you in the future. This job was small, and certainly was not a "favor", but, in the end I still appreciate it more.</p>
      <p>C) Sometimes, we all get caught up in our own designs, and nitpick them beyond belief. I asked many people before coming here about what they thought of this dilemma. This thread proves that "good things do come from bad things" as Andi had a great idea. That is exactly why I posted this thread.</p>
      <p>Furthermore, if you doubt or have questions about my credentials in terms of my "experience", i would be happy to provide you a copy of my résumé.</p>
