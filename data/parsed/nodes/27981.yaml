    html: |-
      <p>Hello Everyone,<br>
      I Hope everyone is well. I'm the author of the book you've all been discussing, so I thought who best to answer all your questions than myself.</p>
      <p>Firstly, I would like to say please don't judge the book off this picture, Originally this picture was created for the sole purpose of showing the printers where the foil was intended to go and was produced incredibly quickly (hence the spelling mistake, no it wasn't a stunt!) This picture has now been used on pretty much everything, which I wouldn't say I'm over the moon about really, but thats one of those things, Very well spotted though!</p>
      <p>Regards the line break on the cover, I considered the title to be too long to occupy one line and ideally I wanted to keep the 'ten commandments of typography' part together. If you think thats odd then thats fair enough, I respect your opinion and if we all had the same opinions regarding typography the world would be a very dull place, so I do accept that.</p>
      <p>Regarding the comment about never buying it, that again is totally fine, I'm often just as guilty of making decisions on a book purely by the cover, but I personally think its a bit harsh to make the comments you have without actually viewing the content. Judging by the fact that Matthew Carter, Jeff Keedy and Jonathan Barnbrook have all seen the content and were happy to be associated with it, plus the review in this months Grafik magazine it can't be that bad.</p>
      <p>I don't want to go on too much but I think the Type Heresy section, needs clearing up too. The book is a flip format book, so the image you can see is only the Commandments cover, I know its a bit hard to understand with just that cover image, the white section is essentially a belly band, its alot easier to understand when you actually have the book in front of you.</p>
      <p>I hope I don't come across like I'm having a rant because I'm not, I just wanted to get my case across! Maybe I can arrange to post a copy out to one of you guys and then make a judgement, Its not strictly buying it so you wouldn't be going back on your word! Plus if you still think its crap then I will hold my hands up and respect your decision!</p>
      <p>Sorry to ramble on but I hope to hear back from you all soon</p>
      <p>Paul</p>
    html_clean: |-
