      <p>Unless I'm mistaken, it looks from the Amazon UK picture that the white on the sides is not part of the cover, so the 'H', which Chris finds a redeeming device, isn't there. Ouch. </p>
      <p>Ok, I'm game. Here are my commandments of Typography (pinched from others):</p>
      <p>1. Thy type shall be legible.<br>
      Obedience here.<br>
      Ok, but now downhill. </p>
      <p>2. Thy visual hierarchy shall express the conceptual relationships of the author.<br>
      Violation.<br>
      The idea of the book is a duality: Those who represent classic type wisdom and obey the rules, including Tschichold and Spiekermann, verses type 'heretics' who break the rules. </p>
      <p>Here there are random sized bits of brown and white, no relation. A way to do this would be to split the cover in half, eg horizontally or diagonally, with one side black on white and the other black with white knocked out, or red and black or another two colors. The border could look like torn paper, indicating visually the opposition and disruption. I don't know if this particular concept would work, but it would be a. more visually arresting and b. reflect the idea of the book. Both a plus. </p>
      <p>...to be continued...</p>
    html_clean: |-
