      <p>"Instead of sniping why not be constructive and say why you dislike it?"</p>
      <p>The difficulty in this is that your cover is supposed to be bad on purpose so whatever is specifically wrong is obvious.  My objection is that the parody has not gone far enough to make me want to look at it.  I think you could have done more with the heresy aspect. The problem is that it is just boring looking. Having a concept in your mind of doing bad typography as a joke is not enough.  You have to execute it so that it works.  It still has to function as a book cover and do its job.  If I saw this at a bookstore, I would never have given it a second glance. I would not have looked at it long enough to see that it was a joke. It just melts into the visual clutter. The only half-way saving grace in it may be an accident--the two brown rectangles appear to be the negative space in the letter "H" which may be Heresy. Other than that, snore zzzzzzz.</p>
      <p>ChrisL</p>
