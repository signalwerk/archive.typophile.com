  - id: 156195
    user: 1551
    date: 2006-09-05T17:02:00
    date_raw: 5 Sep 2006 — 5:02pm
    votes: null
    html: |-
      <p>3. Thy placement of type will have a pleasing relation to the space it occupies.</p>
      <p>Violation.  </p>
      <p>Aside from being centered, the type seems to have no visual logic. Does the shape of the cross relate to the top brown block? No. Does the Cross plus the text relate? No. Why do we have a short line, long line then small short line, followed by a new color with lines all different lengths again? Why the color block again at the bottom? I at any rate can't see any rhyme or reason. </p>
      <p>Part of the problem here is the two titles and subtitles of the book. The full thing according to Amazon: The Ten Commandments of Typography/Type Heresy: Breaking the Ten Commandments of Typography</p>
      <p>Now having two titles and subtitles is breaking the rules. In my opinion this breaking can be ok because it has a compensating benefit: it is an arresting, interesting opposition. But the cover doesn't have the whole two titles, so the whole thing becomes a muddle. The point is, if you are going to break rules, you need to make a virtue of it. It has to have a strong point. Here the point is just lost because the two titles are not even put on the cover! </p>
      <p>But--back to placement of text--as it is there is no rhyme or reason to the placement. And that is what looks most weak in the layout. </p>
      <p>4. Thou shalt keep logically related words visually together.</p>
      <p>Violation. </p>
      <p>The important concepts are: 'Ten Commandments' and 'Typography'.</p>
      <p>So the designer *breaks up* the words 'Ten' and 'Commandments'!</p>
      <p>The other key concept is "Type Heresy", which as Erik Spiekermann points out are separated now by a double word space or something. </p>
      <p>3. Thy typeface shall be well suited to the subject matter.  </p>
      <p>Ok if the top title were in Sabon (Tschichold) or Meta (Spiekermann) that would make sense. But it's not, it seems. Since the subject is actually type, I don't understand why the avoidance. Also is the 'Type Heresy' one of Branbrook's fonts? Maybe but I couldn't spot it checking. Why not use Mason or one of his other wonderfully disturbing faces?</p>
      <p>Also why put 'Heresy' in black letter and Ten Commandments in Roman? If you are playing on the association of Church and Blackletter, then *both* should be in blackletter. The two titles should also be massaged so they are parallel. That is a failing of the author or publisher, but the designer could ask. Then perhaps you could have 'Ten Commandments' twice in black letter, and 'Heresy' in Mason.</p>
      <p>4. Space and size thy lines, word spaces and letter spaces in a way that suits their function and purpose.</p>
      <p>Violations.</p>
      <p>Why is the top title smaller than the bottom title? Why is the second subtitle in a different font again? Why is the second time the author mentioned smaller than the first? </p>
      <p>I could go on, but I'm now tired of the game. </p>
      <p>As others have said: if this was trying to break rules in a funny way, it doesn't succeed. If it wasn't trying to break rules, well it does, all over the place.</p>
    html_clean: |-
