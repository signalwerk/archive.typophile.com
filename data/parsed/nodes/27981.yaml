      <p>Five Stages Of Grief<br>
      1. Denial - "Is this a real book coming out or a joke?"<br>
      2. Anger - "Am I the only one that thinks this a really ugly cover, with bad typography?"<br>
      3. Bargaining - "Instead of sniping why not be constructive and say why you dislike it?"<br>
      4. Depression - "As PR stunts go, I have to say this one is pretty sad"<br>
      5. Acceptance - "I do believe we are now participating in something called ‘viral marketing.’"</p>
