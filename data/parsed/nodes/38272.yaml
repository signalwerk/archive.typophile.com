    html: |-
      <p>After trying out Cambria/Candara as my standard web fonts for two days, I’ve switched back to Georgia/Tahoma. The major problem with Cambria/Candara is that they’ve got terrible kerning in the hinted version — it’s so bad that some letter spacing are indistinguishable with real spaces. Plus, both appear too thick — almost bold — in the hinted version. I don’t know how they look in ClearType, but at least on old fashioned CRT monitors those fonts are definitely unusable as web fonts. Actually, I’d even go so far as to say they look like fonts designed by amateurs:</p>
      <p></p><div class="imageWrap"><img src="/files/cambria_4462.png"></div><p></p>
      <p></p><div class="imageWrap"><img src="/files/candara_4364.png"></div><p></p>
      <p>What’s also quite obvious is that the x-height of Candara is very small (significantly so in comparison to Tahoma, for instance) — also a property unsuitable for web viewing, this one regardless of ClearType or not.</p>
      <p>So I guess my question is, are those fonts actually intended to be “web fonts”? If so, how can those obvious mistakes go undetected, and if not, why are people saying they are?</p>
