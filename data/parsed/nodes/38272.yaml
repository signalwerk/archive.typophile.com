      <p>I’m sure if you look hard enough you’ll be able to find some loophole to avoid paying for the fonts, but is it really worth the effort? </p>
      <p>I think people point to the PPT viewer, rather than the Office 2007 Compatibility pack which also includes the fonts, so they can claim getting one over on MS. Fact is that these fonts are available to Windows customers in various forms, and anyone who needs them on Linux, Mac, or their Symbian smartphone can license them like any other font.</p>
