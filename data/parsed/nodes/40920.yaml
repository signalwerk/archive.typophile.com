      <p><em>déjà vu</em></p>
      <p>I wouldn't be surprised if I'm repeating myself without realizing it! (Doesn't everyone?)</p>
      <p>I'm not familiar with Atma. It's nicely done, but not the kind of conservative design I would have looked at twice in 2001, or subsequently recognize in use, and I probably didn't notice the multi-small-caps, as that's something that has only really interested me since I started working in OpenType. Thanks for bringing it to my attention Stephen.</p>
      <p>I see that Atma is pre-OpenType, and has Small Caps = Petite Caps, Mid Caps = Small Caps, and Quarter Caps = "Moyen" Caps.<br>
      Presumably its terminology was adopted prior to an awareness of how things shaped up in the OpenType Feature Tag specifications.<br>
      I wonder how Atma's various small caps will be implemented in OpenType...</p>
