    html: |-
      <p>There are many ways that small caps can work.<br>
      A typeface would need at least THREE kinds (i.e. three different heights) to satisy them all.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Sc_5105.jpg"></div><p></p>
      <p>1. This is probably the most useful, noticeably taller than lower-case x-height. Good for acronyms, and still plenty of size contrast with full caps (unless the full capitals are smallish). Also a good size for Cyrillic small caps, where Maxim Zhukov has argued that size differentiation from lower case is helpful, given the commonality of so many letter forms between the Cyrillic upper and lower case, and the few extenders, especially in Russian.</p>
      <p>2. These could be termed <em>moyen</em> caps and petite caps. The petite caps are the same height as lower-case x-height. Moyen caps would be larger than small caps, to allow sufficient contrast with petite caps for setting this kind of titular alphabet soup.</p>
      <p>3. A traditional way of setting petite caps, with copious lettespacing.</p>
      <p>A fourth size of small caps (bébé?) might be necessary to deal with "Mc/Mac" names that are set in all small caps, although this is so infrequent that the typographer should best handle it by tweaking, rather than with a separate font. If foundries wish to remedy the situation in-font, perhaps just two glyphs, "Scots A and C for small caps", would do the job.</p>
      <p>Another issue is ordinals and superiors--occasionally, typographers may wish to set these in capital letter style. </p>
      <p>So, my thinking is that the ultimate solution would be to include small caps in the main font, and have a separate Caps font, which contains moyen and petite cap sizes at the basic upper and lower case keystrokes, and also has superiors that are capital in form. </p>
      <p>With this configuration, the difficult titles (B.Des etc.) could be set entirely with the Caps font, simplifying that chore for the typographer. Small caps could also be included, so that it would be possible to set both moyen caps with petite caps (basic "upper and lower" keystrokes) and moyen caps with small caps (small caps feature applied), as separate styles.</p>
