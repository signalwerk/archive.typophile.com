    <p>Here is a predicament that has been bugging me for the past year. I never know what to do with a pluralized word that requires <a href="/wiki/small%20caps" class="freelinking" rel="nofollow">small caps</a>. I have inquired within the pages of Elements, Chicago Manual, and a few type books back from school.</p>
    <p>Take for instance the words TVs or GMOs. Should they be set like this;</p>
    <p>&lt; sc &gt; TV &lt; /sc &gt; s<br>
    &lt; sc &gt; GMO &lt; /sc &gt; s</p>
    <p>Or should all the letters be set in small caps? My art director says that we should just leave them capitalized (TVs GMOs) and ignore the small caps in this instance. I, by nature, push back against him. Thoughts, guidelines, rules, opinions … anything would do. Take care.</p>
