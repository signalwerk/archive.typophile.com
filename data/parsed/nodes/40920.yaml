    html: <p>I wouldn't use small caps for something like "TV". Usual practice is to use full caps for two or three letters, and small caps for four letters or longer. I can't think of any of the latter that would ever be pluralized, with the exception of OB/GYNs which I think has been making the move to lowercase lately.</p>
