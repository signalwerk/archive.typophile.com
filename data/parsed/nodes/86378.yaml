    html: |-
      <p>Thanks, Nick ... but ouch! When you contrast my pre-production backyard research, half-digested philosophizing and naive inquiries with the post-fact slick rationalization of Monocle's Creative Director, I feel like quite the dilettante. I guess I had it coming. :)</p>
      <p>What attracted me to Monocle's design on this occasion was the crisp legibility of the text. The text in the magazine I will be working on tend to be very academic and heavy (one could at times even argue that some of it is indecipherable). So, in order to make the material as available as possible, I wanted to pull the layout in the extreme opposite direction: while I might not manage to make it <em>easy</em> to read, I can at least create as few speed bumps as possible. What is more, I dare even hope that I can make it look good and attractive. Concern number two was that I have very little control over paper and printing quality of the final product, even less so because the magazine will also be available for download online, and thus some pages might be printed with all sorts of crappy printers on all sorts of crappy paper. That's why I need a type that "scales" well, by which I mean that it needs to work for low budget print jobs, while it simultaneously has a certain seductive finesse, some sort of low key glamorous mojo. This legibility was one of the reasons I chose <strong>Graphik.</strong> And <strong>Rawlinson</strong> appears to me to have the same quality.</p>
