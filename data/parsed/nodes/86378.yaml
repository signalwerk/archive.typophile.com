    html: |-
      <p>OK Martin, since you asked…</p>
      <p>Plantin was something of a novelty in Monocle at the time.<br>
      I suspect that it is a particular favorite of the designer's:</p>
      <blockquote><p>“We knew we wanted a bookish, crisp white uncoated paper, and that a serif would be core to the look of the project. So Plantin was first choice, it has more character than most serifs, more charm, and holds ink very well and is hence extremely legible. The old style numerals and italics are really beautiful too, lowercase ‘v’ is a particular favourite. Plantin also possesses, to my mind at least, that rare quality that it seems to elevate a simple typed word into a logotype. Something that Helvetica has achieved for a long time.”</p></blockquote>
      <p>Perhaps you should approach your project with the same depth of design thinking, driven by the criteria of the project in hand and personal taste, rather than merely tweaking someone else's design from several years ago.</p>
      <p>Lead, don't follow, and trust your instincts.</p>
      <p>OK, so you like Graphik, that's a personal preference. So why not just pair it with a contemporary serifed face you'd like to work with? Perhaps they won't mesh immediately when you first drop them into the layout, but then you have to work to make it work.</p>
      <p>I recall when I first got hold of the digital fonts for Shinn Sans, which I had designed prior to DTP, and which were digitized by Steve Jackaman; I started using the fonts, and it looked like crap, and I felt gutted that my type design was too. But then I worked with it a bit, and it wasn't too bad after all. Best of all was the way that Andy Cowles used it in <em>Woman</em> magazine.</p>
      <p>So what I'm saying is what I always say, that a font is a tool, and that its inherent qualities will only take you so far, because it's the typographer who adds the magic by experimenting with all the variables of layout.</p>
