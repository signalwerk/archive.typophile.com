      <p>If PDF distribution is important, please look up the End User License Agreement of the foundry in question. Not everybody allows this purpose. If in doubt, don't give up, but contact the Foundry to get an "off the records" precise answer, as EULAs are often in a language does not shed enough insight how a specific situation would be under the EULA. </p>
