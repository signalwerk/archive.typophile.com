      <p>Nick: </p>
      <p>"... I do think a modern would be the best pairing for Graphik."</p>
      <p>Monocle Magazine combines Helvetica and Plantin. Plantin is a Transitional (rather than a Modern). For me those two combine pretty well in Monocle. My reasoning was that I wanted to switch Graphik for their Helvetica, and then figured I would try to switch their Plantin for another Transitional with a lower x-height, to see if I could get a decent result. However, from what I read on Wikipedia, Helvetica is classified as a Neo-grotesque or Transitional or Realist, and I suppose Graphik is more of a Geometric ... Am I tweaking this in two different directions, here, getting a weird result?</p>
