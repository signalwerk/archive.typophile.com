  html: <p>I'm looking for a serif font to combine with Christian Schwartz' Graphik. I will need it for magazine layouts, and I will use it for shorter, and longer texts, as well as for headlines. I like Plantin, but feel the difference between Graphik and Plantin in x-height might be a problem. Minion Pro is much closer, but I'm thinking that a serif with a slightly(!) greater x-height might do well. And if it looked a little sturdier than Minion Pro does (like the feel I get from Plantin) I would probably like it. I especially like the lower case 'a' of Plantin better than the lowercase 'a' of Minion. I would also like it to be a font that works well over a wide variety of printing techniques and paper qualities. Am I asking too much? Or does any of you have any suggestions?</p>
