    html: |-
      <p>It's close to Newhouse DT Super Condensed Bold</p>
      <p><a href="http://www.myfonts.com/fonts/dtptypes/newhouse-dt/super-condensed-bold/" title="http://www.myfonts.com/fonts/dtptypes/newhouse-dt/super-condensed-bold/">http://www.myfonts.com/fonts/dtptypes/newhouse-dt/super-condensed-bold/</a></p>
      <p>But the shapes of the letters are actually more rounded, the a has an extending foot and the t has an angled top.</p>
      <p>It's possible this is a custom font for Towergate, but I don't actually know for sure.</p>
      <p>A larger image:</p><div class="imageWrap"><img src="http://typophile.com/files/towergate_5980.jpg"></div><p></p>
