    html: <p> ohh, it was trebuchet! I was actually wondering what typeface it was <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":)">  <br>I think it is quite a friendly font... although I haven't used it for anything but webpages (it looks surprisingly good as shorter body copy). <br> <br>Anyway, their brief was very fuzzy and I tried to make the best of it.. Basically what the above logo is (if you look closely), almost the same swoosh I've used, but rotated with a gradient. <br> <br>I'm ok though, as I find my piece better, it's still going in my portfolio. (as a suggested design or something...) </p>
