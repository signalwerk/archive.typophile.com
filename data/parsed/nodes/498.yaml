  html: <p>Hi, I've been designing a logo for sort a union of culture &amp; research... I really don't know how to explain it, as it's fuzzy already in Swedish. <br> <br>Oh well, I went the swash way (don't kill me, they're supposed to symbolize the northern lights), and now I'm stuck with the type... <br>It's Gill sans bold for the "Nordkalottens" part and Adobe caslon semibold for the "Kultur &amp; Forskningscentrum". I don't like the type... please help me <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":)"> <br> <br><img src="http://www.typophile.com/forums/messages/29/1240.gif" alt="logo"> <br> <br>Thanks.</p>
