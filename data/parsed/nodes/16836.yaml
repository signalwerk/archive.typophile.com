    html: |-
      <p><em>“oh, your Dialogic… I didn’t know who DCC was. I’ve heard of your product but know the company as dialogic.”</em></p>
      <p>The reason your boss wanted to rebrand was because the name “Dialogic” is known but no one associates DCC with company.<br>
      They might like the chain concept, but it still doesn’t utilize the strength of the company’s brand, which apparently is the name and not the logo.</p>
      <p>If their name is their best asset, they should capitalize on it, and not subordinate it by placing it under a confusing image/monogram.</p>
      <p>If one calls by phone and is greeted by “Hello, Dialogic…” and not “Hello, DCC…” then that is also part of the branding strategy.<br>
      Use the name and forget creating a “mark” as the focus of the logo.<br>
      Dan Weaver made a similar suggestion above and I agree.</p>
      <p>The BEST thing your company can do is to strengthen the NAME brand and forget any graphic/icon on the logo.</p>
