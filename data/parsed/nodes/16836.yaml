      <p>This is a hard statement to tell a boss, but I have tactfully mentioned to higher-ups that personal favorites are less important than how it is perceived from the outside.</p>
      <p>I’ve had one boss tell me that he wanted to show my design to his wife before “he decides.” Honest truth.</p>
      <p>If any of your competitors are branded well, yours will look pretty chintzy.</p>
      <p>Rebranding shouldn’t be taken lightly and SHOULDN’T be based SOLEY on the logo. Because once they have decided, they are stuck with it for quite a while.</p>
      <p>Look at the reactions the <a href="http://typophile.com/node/15064" target="new">new Quark logo</a> stirred.</p>
      <p>Honestly, I don’t think any of those logos would do the company any good. But I also know how it feels when the “captains of industry” won’t listen to the lowely worker. :-(</p>
