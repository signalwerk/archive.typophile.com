      <p>I agree with most comments, the logo concepts shown are somewhat forced, but still a step up from the dish of DCC identity currently in use. What your firm needs is branding with<br>
      the implementation of narrative design (narrative design is essentially story telling). Tell a story of how the company was founded, what drives it, who drives it, how it’s services are improving customers lives, profits, etc..the visual elements will fall in place once this is established. Hire a consultant to get you through this phase if required. It may well be a wordmark that will ends up being the visual identity that becomes the final solution, but the proper solution should not be guess work. </p>
      <p>All implementation aside here is my critique on a purely aesthetic basis-<br>
      A. feels a bit CSA retro, it is legible and may well imply a connection of some sort by the honeycomb hex shaped grid connecting the DCC. I like this.<br>
      B. simply sucks, unbalanced, heavy handed, poor proportions, dated-delete asap<br>
      C. hard to read, at first I was seeing slanted “s” shapes, concept is not bad, just requires a<br>
      some more work.<br>
      D. looks like a lot of mid 90’s electronica music labels, concept is nice with the links between the letters which works best with the D-C but not quite as well with the second C-C link<br>
      E. again the honeycomb/ hex concept. would recommend a very neutral typeface for dialogic communications, and decrease space between logo and type as well as make type slightly smaller<br>
      F.most people will see the DC as an X and wonder what the second C is. it is cool looking but will not work.</p>
      <p>there is an obviously fascination with horizontal flipping of C glyphs. this sometimes works but I think traditional options should be further explored.</p>
