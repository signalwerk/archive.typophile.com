    html: <p>A good rule of thumb is, don’t ever show a design you wouldn’t want your client to pick.. But we’ve all been there. The best way to talk someone out of a “bad” design that they’ve latched onto is to give them a better alternative, and a well thought out explanation, after that, it’s out of your hands. I think if you could tell us which one they’ve picked, and which one you prefer, it might be a bit easier to critique…</p>
