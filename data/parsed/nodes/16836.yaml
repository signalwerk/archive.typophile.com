      <p>Well… If <a href="http://www.dccusa.com/images/hdr-logo.gif">this is your current logo</a>, I can see why they might feel inclined to redesign. That mark is a little dated (seems “early Internet start-up” to me… must be the swoosh).</p>
      <p>I <em>do</em> tend to agree with Dan that these options seem somewhat forced and/or arbitrary. However, I understand you’re at a point where you can only go forward. So here are my thoughts:</p>
      <p>I like the concept behind <strong>C</strong> and <strong>D</strong> — the chain of communication. However, it took me a while to figure that out… it’s not immediately obvious in either one.</p>
      <p>Also, in the marks which use ‘DCC’, but don’t include the text for “Corporation” I get confused by what the second ‘C’ is for.</p>
      <p>I don’t really understand the meaning of the marks in <strong>A</strong>, <strong>E</strong> and <strong>F</strong>. </p>
      <p><strong>B</strong> frankly has a 1980s feel to me. It also bugs me that the text is trying to be justified, but isn’t (due to the italics?).</p>
      <p>The condensed typefaces in several of them could be problematic at small sizes/on the Web. </p>
      <p>Just some random thoughts… sorry, it’s not really a “ranking.”</p>
