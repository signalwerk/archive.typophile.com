    html: <p>Another problem with a ABC type of mark is how much support will go behind the mark. International Business Machines spent millions to get consumers to recognize IBM and it was justified because consumers (even corporate ones) didn’t associate their main product (computers) with machines. My feeling is if it isn’t broke don’t fix it. If its slightly flawed tweek it. My guess is you need just a tweek and to make a major overhaul without a major expense (signage, redoing the website, stationary and ads to introduce the mark) is probably way beyond any budget conciderations. I would suggest a study about how much it would cost to change your idenity and a budget and a time period to implement it. I think upon review your company will think twice about what someone comments at a trade fair.</p>
