    html: |-
      <p>Wow! I just found this site today…great stuff!</p>
      <p>I had sent the same graphic to several design buddies to get some outside feedback. I heard exactly what I wanted to from them but my boss just thought the opinions were biased.</p>
      <p>Now a little background on my situation… I was ask on a Wednesday afternoon to create a new logo by Friday.</p>
      <p>My boss had gone to a trade show and someone told him that</p>
      <p>“oh, your Dialogic… I didn’t know who DCC was. I’ve heard of your product but know the company as dialogic.”</p>
      <p>That prompted the whole new identity issues…</p>
      <p>Now that was several weeks ago and there’s a long story go along with how we got to where we are today. I was given the new requirements…”let’s emphasize DIALOGIC and minimize the DCC.</p>
      <p>I took on the challenge anyway, expressing my concerns knowing that the time frame was ridiculous.</p>
      <p>I submitted some very rough ideas by Friday as ask…but my boss didn’t have time to review. (Put off until Monday) I show up Monday morning and my boss and the VP of Marketing pull me in the conference room to tell me they have outsourced the job to someone who specializes in branding. Hey, I’m cool with that (didn’t like the circumstances but the heat was off me). Hey fresh ideas… a group that specializes in this area (I’m kinda the Jack-of-all-trades, design, web, flash, multimedia…ok at all but not great at any).</p>
      <p>A week and a half later…the new ideas are presented. Initially they didn’t like anything…they went back and forth for another week to make suggested changes by my bosses. (I’m not involved in the process at all at this point)</p>
      <p>Several days after that I was pulled back into the project…I was told to try to come up with something, we we’re at a dead end. So here I go again…this is where the “forcing is an understatement” comes in. So at this point you can imagine my frustration… I’m reaching for anything and everything. That would explain the real lack of meaning to my designs.</p>
      <p>I am impressed that several of you could see the fact that they were “forced”.</p>
      <p>Now here’s the deal with the logo comps I provided…they have decided to go with “D” as the new logo. I’m not particularly attached to any but think several have some potential with refinement. I’m having a very difficult time accepting this choice. They are set on this chain thing…linking and all that. Although there is a concept behind it, I don’t think the logo works. Am I just too attached to the project or can somebody back me up on this design?</p>
      <p>Thanks guys!</p>
    html_clean: |-
