    html: <p>This is a designed logotype either based on <a class="freelinking external" href="http://lineto.com/The+Fonts/Font+Categories/Text+Fonts/Akkurat/" rel="nofollow">Akkurat</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/linotype/neuzeit-s/neuzeits-bookheavy/" rel="nofollow">Neuzeit S</a> or Helvetica Neue. If it is Helvetica, the designer compressed the lowercase e’s slightly and corrected the s shape. But I think the letters s, e and r fit with Akkurat. The dots on the i were drawn and the letter t was modified to fit with the design.</p>
    html_clean: <p>This is a designed logotype either based on <a class="freelinking external" href="http://lineto.com/The+Fonts/Font+Categories/Text+Fonts/Akkurat/" rel="nofollow">Akkurat</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/linotype/neuzeit-s/neuzeits-bookheavy/" rel="nofollow">Neuzeit S</a> or Helvetica Neue. If it is Helvetica, the designer compressed the lowercase e’s slightly and corrected the s shape. But I think the letters s, e and r fit with Akkurat. The dots on the i were drawn and the letter t was modified to fit with the design.</p>
