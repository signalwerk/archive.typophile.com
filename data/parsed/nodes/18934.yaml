    html: <p>As Tiffany says, a licence agreement may contain any provision. Furthermore, as Tiffany also says, the courts have (to put it mildly) a say in what is legally binding. Just because something is included in a written contract doesn't make it legally binding. As mentioned by Kesh, the legal rules vary from country to country. I'd suggest that you carefully consider the ethical ramifications of a provision before you add it to a (standard) contract.</p>
