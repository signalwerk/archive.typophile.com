    html: <p>Nick is right, if you want to control or influence the way your type is used you need to have a relationship with the user. Trying to legislate good use via the EULA isn't going to work. Providing a manual containing best practices, and providing templates is likely a better approach, but still you can't teach everyone to be a typographer.</p>
