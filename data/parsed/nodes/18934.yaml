  html: |-
    <p>totally theoretical:</p>
    <p>licenses can be used to manage how many machines type is used on, what formats it may or may not be converted into, and whether or not the license can be resold.</p>
    <p>but!</p>
    <p>can licenses be taken a step further - and be used to enforce how a font can be used ... aesthetically? i.e., face may not be mechanically extended or compressed, may never be combined with comic sans, its lowercase may not be letterspaced, it may not be extruded and printed in hot pink spot ... etc.</p>
    <p>what say you typophiles?</p>
