      <p>As Tiffany says, a licence agreement may contain any provision, so if the licensor says "you can't use this above 14 pt size" and the licensee does, that would be legal grounds for the licensor to cancel the contract.</p>
      <p>But really, there are practical ways to channel the aesthetic usage of fonts, such as:</p>
      <p>1. make the type "small on the body" if you want to encourage a spacious look<br>
      2. fit it very tightly (i.e. narrow sidebearings) if you want it to be used for display<br>
      3. price it high to avoid the riff-raff getting their hands on it<br>
      4. similarly, don't sell through mass distributors<br>
      5. provide condensed, regular and extended versions to reduce incidence of horizontal scaling</p>
