      <p>Be careful with any font copyright information given by Uli Stiehl. He's notorius of accusing foundries of "forging" or "plagiarizing" others, but he is not really well informed (nor am I, but I'm not pointing fingers at others in a moralizing way) about all the to-and-fro licensing that took place or may have occurred between foundries. </p>
      <p>URW, e.g., have digitized a number of fonts for established foundries and, in return, reserved the rights to use the outlines (but not the original names) and have sub-licensed these outlines again to other foundries. So not every "clone" is illegal (talking of pre-digital font design digitized by URW). </p>
      <p>In Europe the font design cannot be protected longer than 25 years, while the names are treated as trademarks and thus protected for a much longer time. In the US where you live the situation is not quite clear, AFAIK it is contentious whether fonts are "software" and as such protected by copyright. That's why foundries like to say "font software" for fonts. </p>
      <p>After all the legal trouble Southern Software had before they went out of business I don't think anyone who has inherited rights of that company will try to impose the regulations of their EULAs on anyone. So the question is more or less about morality rather than of legality. </p>
      <p>Andreas</p>
