      <p>1) Viamedia:</p>
      <p>&gt; <cite>I’m bleary from reading obtuse EULAs.</cite></p>
      <p>As far as I know, SSI sold its font CD without EULA.</p>
      <p>SSI charged less than 1 Cent for 1 font !!!</p>
      <p>SSI advertised its "a dime a dozen" CD as follows:</p>
      <p><strong>"Southern Software, Inc. gives you the BEST font package on the planet! The price is only $29.95 (plus shipping and handling) for "Just My Type" - 3320 professional quality fonts on one CD."</strong></p>
      <p>The defunct SSI website is archived here</p>
      <p><a href="http://web.archive.org/web/*/http://www.ssifonts.com" title="http://web.archive.org/web/*/http://www.ssifonts.com">http://web.archive.org/web/*/http://www.ssifonts.com</a></p>
      <p>2) Fontgrube:</p>
      <p>&gt; <cite>In Europe the font design cannot be protected longer than 25 years</cite></p>
      <p>... provided that the font design is original and provided that you register the German font design  at least at the German patent office in Munich (or better for all countries of Europe in Alicante).</p>
      <p>Here are two interesting examples for Typophile discussion:</p>
      <p>1) If you registered <strong>"Nimbus Roman"</strong>, which is a clone of <strong>"Times"</strong>, at the German patent office in Munich, would you cheat the registration office, if you claimed on the registration form that <strong>"Nimbus Roman"</strong> is an original font design?</p>
      <p>2) If you registered <strong>"Nimbus Sans"</strong>, which is a clone of <strong>"Helvetica"</strong>, at the German patent office in Munich, would you cheat the registration office, if you claimed on the registration form that <strong>"Nimbus Sans"</strong> is an original font design?</p>
