      <p>At least in the case they were sued over, SSi copied outlines from existing commerical fonts (and admitted doing that on thousands of fonts). He scaled them up 1% vertically to make them not identical. There was a summary judgment on that issue.</p>
      <p>See <a href="http://en.wikipedia.org/wiki/Adobe_Systems,_Inc._v._Southern_Software,_Inc" title="http://en.wikipedia.org/wiki/Adobe_Systems,_Inc._v._Southern_Software,_Inc">http://en.wikipedia.org/wiki/Adobe_Systems,_Inc._v._Southern_Software,_Inc</a>.<br>
      <a href="http://directory.serifmagazine.com/Ethics_and_Law/Copyright/judgement.php4" title="http://directory.serifmagazine.com/Ethics_and_Law/Copyright/judgement.php4">http://directory.serifmagazine.com/Ethics_and_Law/Copyright/judgement.php4</a></p>
      <p>I don't know if or how many SSi fonts were ever made that did not involve lightly modified outlines.</p>
