    <p>Okay. So I have been freaking out about fonts for the last couple of weeks. Specifically around EULA issues and what are my rights with fonts I have licensed directly, have been bundled with software (like Adobe), or that I downloaded from the internet in more innocent and less litigious times.</p>
    <p>I'm bleary from reading obtuse EULAs. My brain hurts from grappling with concepts of IP, derivative work, "font software" and other considerations. I just read the whole thread on the FontBureau / NBC debacle with a mixture of horror and fascination. (Kinda like a train wreck and you can't look away.)</p>
    <p>I want to put the 4,000-plus members of my font house in order and play by the rules. The prospect is just hideously daunting. I use FontAgentPro to manage my fonts and am able to sort the lists by foundry. I figured I'd try to prioritize documenting things based on which foundry represented the biggest chunk of my library.</p>
    <p>During my several days of research I learned <strong>The Legend of Southern Software</strong>. Not knowing any better, at some point I acquired one of their products with several hundred fonts. Setting aside questions of morality (they did a bad-bad thing) and questions of quality (why wear a knock-off Dior when you can get the real thing), I have a question of legality.</p>
    <p>Specifically, since they went out of business, does that void any EULA that may have existed and render any fonts sporting the SSI foundry appellation as free and unrestricted for use in any way, shape or form? Is there any entity that survives that has any power to enforce any EULA that might have existed? I searched the entire forum and read every post that mentioned Southern and, other than generally disparaging comments about them, I could not find an answer to my question.</p>
    <p>The others on my "top ten foundries to sort out" list are:</p>
    <p>Adobe Systems<br>
    Apple<br>
    Bitstream<br>
    International Typeface<br>
    Linotype<br>
    Microsoft<br>
    Monotype<br>
    URW<br>
    and the dreaded Unknown!</p>
    <p>If anyone has been through this process and has pointers, please write!</p>
    <p>Robert</p>
