    html: |-
      <p>Typo Script has been digitized by the <a class="freelinking external" href="http://www.cthulhulives.org/toybox/PROPDOCS/PropFonts.html" rel="nofollow">HPLovecraftHistoricalSociety</a> (AKA Andrew Leman) and is available on the linked page. It is NOT  included in the selection of free fonts.</p>
      <p>Note- there was also a Ballantine script by The Font Company, which might still be found. It doesn't seem to be among the Font Company fonts taken over and renamed by URW++.</p>
      <p> Brendel/B&amp;P/Softmaker sold copies of this font, with many additional weights and variations.</p>
      <p> - Herb</p>
