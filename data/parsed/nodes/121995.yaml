      <p>That |G| is highly unusual for a gothic. Does your sample date from the 1920s?</p>
      <p>I’m not sure what the original metal typeface was, but here are a few digital typefaces (with a bit of surgery on the crossbar of the |G|) that could help you replicate the look:</p>
      <p><a href="http://www.myfonts.com/fonts/linotype/alternate-gothic-lt/" title="http://www.myfonts.com/fonts/linotype/alternate-gothic-lt/">http://www.myfonts.com/fonts/linotype/alternate-gothic-lt/</a><br>
      <a href="http://www.myfonts.com/fonts/flat-it/rama-gothic/" title="http://www.myfonts.com/fonts/flat-it/rama-gothic/">http://www.myfonts.com/fonts/flat-it/rama-gothic/</a><br>
      <a href="http://www.felicianotypefoundry.com/cms/fonts/grotzec-condensed" title="http://www.felicianotypefoundry.com/cms/fonts/grotzec-condensed">http://www.felicianotypefoundry.com/cms/fonts/grotzec-condensed</a><br>
      <a href="https://klim.co.nz/retail-fonts/founders-grotesk-condensed/" title="https://klim.co.nz/retail-fonts/founders-grotesk-condensed/">https://klim.co.nz/retail-fonts/founders-grotesk-condensed/</a></p>
