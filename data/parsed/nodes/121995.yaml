      <div class="comment-spam-body"><p>After considering various options I would suggest as the closest substitute, KLIM's Founders Grotesk Extra Condensed Medium, which is based on a 1912 Miller &amp; Richard specimen of No.7 Grotesque all-caps.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/FoundersGrotXCondMedAsSong_5036.jpg"></div><br>
      For a closer match clip the bar on _G_<br>
      Also compare to the Semibold weight<br>
      <div class="imageWrap"><img src="http://typophile.com/files/FoundersGrotXCondSemiBoldAsSong_5562.jpg"></div><br>
      Don<p></p>
      </div>
