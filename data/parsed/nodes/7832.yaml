  html: "<p>Hi. It's been a while. <br> <br>I don't know if I'm reinventing the wheel here, but this is something I did the other day. It is one-bit and it is teeny. <br> <br><img src=\"http://www.typophile.com/forums/messages/29/54242.gif\" alt=\"Fourmat\"> <br> <br>I think it's more effective for light text on a dark background. At that size, the glow of the screen has \"gain\" that breaks up black on white: <br> <br><img src=\"http://www.typophile.com/forums/messages/29/54243.gif\" alt=\"Fourmat\"></p>"
