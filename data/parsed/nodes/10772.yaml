    html: <p>I think Helvetica is mostly a victim of its success. Designers get tired of seeing the same typefaces over and over. I can't think of any typefaces that have become as popular as Helvetica that have not had the same over-exposure problem with designers. I used to like Times Roman a lot more before it became a default font.  <br>  <br>As a young proto-designer in high school in the '70s, I was infatuated with Helvetica. My first sheet of Letraset was a sheet of 72-point Helvetica Medium, and I remember marveling over the subtle curves or the lowercase <i>a, e,</i> and <i>s.</i> My design teacher in college said "when in doubt, use Helvetica." I, like many others I think, imagined it as some kind of ultimate standard that all others were to be judged by; that it was a typeface with all the pretensions of style and ornamentation peeled away.   <br>  <br>I grew out of my infatuation (or got bored with it) within a couple of years as I became more acquainted with the charms of other typefaces. But I can still remember a time when I imagined that in a perfect world everything would be set in Helvetica. (Ha! Heaven help us.) <br>  <br>I mostly think it's boring now, though I find that the way it has come back into fashion is interesting, were it's brought to center stage again. I couldn't use it like that without feeling ironic. Helvetica used to represent end of style. Now it's just another style.</p>
