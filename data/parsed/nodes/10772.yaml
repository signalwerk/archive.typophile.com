  - id: 67773
    user: 1202
    date: 2003-03-22T11:41:00
    date_raw: 22 Mar 2003 — 11:41am
    votes: null
    html: "<p><b>...in most cases, how one sets it is what matters most. Just  <br>one of these days I was seeing a book, published  <br>in the early fifties, set in Futura, a very clean, not  <br>darkish, metal composition, well leaded. It was very  <br>nice and invited reading.</b> <br> <br>Oh, sure. It depends on which cut of Futura too. Not enough leading is generally the problem for Futura. Metal Futura could be really nice. But the trouble is, a lot of people use Adobe's Futura, which really isn't good for text setting. <br> <br><b>Thank God, no?</b> <br> <br>Yes! And it shows how geometric the construction of Roman Capitals is and how adaptable it is to 'modern' type. <br> <br><b>I was referring to proportions, not the shapes themselves.</b> <br> <br>Me too. In fact that's what Renner wanted to achieve: to reference classical proportions, and let the grometrical principles behind the construction of the letters cohere them together. 'It is not little marks, rather it is the \"spiritual bond\" that binds the many individual marks into a unity of form.' (From Chris Burke's <i>Paul Renner: the art of typography</i>) <br> <br><b>proportions are what matter.</b> <br> <br>Yes, but it's not everything. Subtle details of Futura made it a really good type, not just its proportions. Look at how bowls join the stems. Every detail mattered.  <br> <br><b>BTW, are you saying that the Gill Sans caps were an actual influence in the development of Futura? I'd like to know about references for this, if you have them. Thanks.</b> <br> <br>No, I have no evidence to support that. But lineage could be made between Johnston's type/calligraphic teaching and Futura, maybe?</p>"
    html_clean: "<p><b>...in most cases, how one sets it is what matters most. Just  <br>one of these days I was seeing a book, published  <br>in the early fifties, set in Futura, a very clean, not  <br>darkish, metal composition, well leaded. It was very  <br>nice and invited reading.</b> <br> <br>Oh, sure. It depends on which cut of Futura too. Not enough leading is generally the problem for Futura. Metal Futura could be really nice. But the trouble is, a lot of people use Adobe's Futura, which really isn't good for text setting. <br> <br><b>Thank God, no?</b> <br> <br>Yes! And it shows how geometric the construction of Roman Capitals is and how adaptable it is to 'modern' type. <br> <br><b>I was referring to proportions, not the shapes themselves.</b> <br> <br>Me too. In fact that's what Renner wanted to achieve: to reference classical proportions, and let the grometrical principles behind the construction of the letters cohere them together. 'It is not little marks, rather it is the \"spiritual bond\" that binds the many individual marks into a unity of form.' (From Chris Burke's <i>Paul Renner: the art of typography</i>) <br> <br><b>proportions are what matter.</b> <br> <br>Yes, but it's not everything. Subtle details of Futura made it a really good type, not just its proportions. Look at how bowls join the stems. Every detail mattered.  <br> <br><b>BTW, are you saying that the Gill Sans caps were an actual influence in the development of Futura? I'd like to know about references for this, if you have them. Thanks.</b> <br> <br>No, I have no evidence to support that. But lineage could be made between Johnston's type/calligraphic teaching and Futura, maybe?</p>"
