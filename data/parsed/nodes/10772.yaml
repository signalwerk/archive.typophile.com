    html: <p>I think that Helvetica has stong virtues and terrible weaknesses. Its virtue is that it is very stong as a display type, while retaining some grace. Its weakness is that it is one of the most unreadable typefaces as a text face. Its value as a display face has, however, been almost totally eliminated by overuse.  <br><br>Even in display sizes, it can have problems with readability. Frutiger’s opening up of letter forms in a Sans Serif certainly helped readability, and has been widely imitated.  <br><br>Still, I wouldn’t be surprised that if after 10 or 15 years, it couldn’t be used judiciously as a display type and look very good&nbsp;again.  </p>
