    html: <p>Maybe I'm revealing too much about myself, but when I was   <br>a second-year design student I used <a href="&quot;http://store.bitstream.com/searchresults.asp?category=&amp;searchtext=swiss&amp;platform=&amp;format=&amp;Search.x=0&amp;Search.y=0&quot;" target="_blank">Bitstream's Swiss</a> for  <br>a whole year believing I was following the footsteps of the   <br>Swiss masters. (Ok, I'm exaggerating a little.) I was crushed   <br>to find out it was the same as Helvetica. But, I honestly   <br>think it opened my eyes to the beauty of a face I would   <br>have otherwise written off.  <br>  <br>That said, I still take great lengths to avoid using it.</p>
