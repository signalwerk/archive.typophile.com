    html: <p>Please tell me in what ways Helvetica is bad (ﬂinch, nicely, even though this topic seems to be like poking an irritable bear or Judge Judy with a sharp stick).  <br><br>Look at that lovely R! Helvetica’s R alone is enough to endear it to me. Why do so many other sans serifs have such ugly capital Rs? “Frankenletters” that look to have been cobbled together with spare parts? <br><br>Compressed, Condensed, Neue, Ultra Light… there are so many ways that it’s good. And Helvetica is versatile, too… Nothing awkward about it, Helvetica manages to be utilitarian without being soulless. Though even the most virtuous typefaces can be abused, I guess… ﬂinch. <br><br></p>
