    html: "<p>I never used to care for Helvetica, but I didn’t dislike it particularly either. It just wasn’t an aesthetic I had any interest in. I always thought, and still think, that the use of Helvetica for text in wide columns on glossy-paged books of the early ’70s was hideous and unreadable, but as a heading and display face it seemed to work okay.  <br><br>Then I had the great pleasure of being commissioned to design a new Cyrillic, Greek and Hebrew for Helvetica, which obliged me to spend a lot more time looking at the design than I had previously. I’m still not inclined to make much use of Helvetica, but I have a lot more respect for it than I used to. One of the things I really came to appreciate was the sheer quirkiness and unpredictability of what most people think of as a very rationalised and geometric design. It’s actually pleasantly perverse.  <br><br>Note that I’m talking here about the original Helvetica. Helvetica Neue is a completely diﬀerent design: superior in almost every way, but much less&nbsp;quirky.</p>"
    html_clean: "<p>I never used to care for Helvetica, but I didn’t dislike it particularly either. It just wasn’t an aesthetic I had any interest in. I always thought, and still think, that the use of Helvetica for text in wide columns on glossy-paged books of the early ’70s was hideous and unreadable, but as a heading and display face it seemed to work okay.  <br><br>Then I had the great pleasure of being commissioned to design a new Cyrillic, Greek and Hebrew for Helvetica, which obliged me to spend a lot more time looking at the design than I had previously. I’m still not inclined to make much use of Helvetica, but I have a lot more respect for it than I used to. One of the things I really came to appreciate was the sheer quirkiness and unpredictability of what most people think of as a very rationalised and geometric design. It’s actually pleasantly perverse.  <br><br>Note that I’m talking here about the original Helvetica. Helvetica Neue is a completely diﬀerent design: superior in almost every way, but much less&nbsp;quirky.</p>"
