    html: <p>&gt;&gt;Helvetica is seen but not heard unless  <br>&gt;&gt;you want it to be. <br> <br>I think Helvetica, despite its faults is very close to Tschicholds and Morrisons demand that typography shouldn't get between author and reader. While I personally think that such a thing is unlikely to actually happen and also that it isn't wrong at all to get between those two and to interpret and act as a catalysator in the communicative process, it seems that Miedinger succeeded in making Helvetica very very invisible. I think it says a LOT about German companies that they're so in love (or simply used to) this typeface... and I think that as a designer we shouldn't take Helv as granted but look for alternatives... but sometimes there simply is none. I know of know other typeface, except maybe DIN that is as sterile and functional as Helv... And in a minimalist design you WANT a typeface to look that way. </p>
