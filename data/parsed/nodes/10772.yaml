    html: '<p><i>Futura is really brutal for any extended amounts   <br>of text for reading. The long ascenders/descenders,   <br>geometric construction and incoherence of the   <br>letterforms lack ﬂow and making reading very   <br>uncomforable.</i>  <br><br>Well, I wrote that with tongue partially in cheek,   <br>but only partially. I could answer that, as in most   <br>cases, how one sets it is what matters most. Just  <br>one of these days I was seeing a book, published  <br>in the early ﬁfties, set in Futura, a very clean, not   <br>darkish, metal composition, well leaded. It was very <br>nice and invited reading.  <br><br><i>The caps certainly owe a lot to the Trajan Roman  <br>caps (and to the caps of Edward Johnston’s Underground   <br>type and Gill Sans), but the lowercase to me doesn’t   <br>say a lot about the Renaissance&nbsp;? quite purely geometric.</i>  <br><br>Thank God, no? In fact, I was referring to proportions, not  <br>the shapes themselves. I’m with St. Bernard de Clairvaux  <br>on this: proportions are what matter.  <br><br><span class="caps">BTW</span>, are you saying that the Gill Sans caps were an   <br>actual inﬂuence in the development of Futura? I’d like  <br>to know about references for this, if you have them.   <br>Thanks.</p>'
    html_clean: '<p><i>Futura is really brutal for any extended amounts   <br>of text for reading. The long ascenders/descenders,   <br>geometric construction and incoherence of the   <br>letterforms lack ﬂow and making reading very   <br>uncomforable.</i>  <br><br>Well, I wrote that with tongue partially in cheek,   <br>but only partially. I could answer that, as in most   <br>cases, how one sets it is what matters most. Just  <br>one of these days I was seeing a book, published  <br>in the early ﬁfties, set in Futura, a very clean, not   <br>darkish, metal composition, well leaded. It was very <br>nice and invited reading.  <br><br><i>The caps certainly owe a lot to the Trajan Roman  <br>caps (and to the caps of Edward Johnston’s Underground   <br>type and Gill Sans), but the lowercase to me doesn’t   <br>say a lot about the Renaissance&nbsp;? quite purely geometric.</i>  <br><br>Thank God, no? In fact, I was referring to proportions, not  <br>the shapes themselves. I’m with St. Bernard de Clairvaux  <br>on this: proportions are what matter.  <br><br><span class="caps">BTW</span>, are you saying that the Gill Sans caps were an   <br>actual inﬂuence in the development of Futura? I’d like  <br>to know about references for this, if you have them.   <br>Thanks.</p>'
  - id: 67773
    user: 1202
    date: 2003-03-22T13:41:00
    date_raw: 22 March 2003 - 1:41pm
    votes: 0
    html: '<p><b>…in most cases, how one sets it is what matters most. Just  <br>one of these days I was seeing a book, published  <br>in the early ﬁfties, set in Futura, a very clean, not  <br>darkish, metal composition, well leaded. It was very  <br>nice and invited reading.</b> <br><br>Oh, sure. It depends on which cut of Futura too. Not enough leading is generally the problem for Futura. Metal Futura could be really nice. But the trouble is, a lot of people use Adobe’s Futura, which really isn’t good for text setting. <br><br><b>Thank God, no?</b> <br><br>Yes! And it shows how geometric the construction of Roman Capitals is and how adaptable it is to ‘modern’ type. <br><br><b>I was referring to proportions, not the shapes themselves.</b> <br><br>Me too. In fact that’s what Renner wanted to achieve: to reference classical proportions, and let the grometrical principles behind the construction of the letters cohere them together. ‘It is not little marks, rather it is the “spiritual bond” that binds the many individual marks into a unity of form.’ (From Chris Burke’s <i>Paul Renner: the art of typography</i>) <br><br><b>proportions are what matter.</b> <br><br>Yes, but it’s not everything. Subtle details of Futura made it a really good type, not just its proportions. Look at how bowls join the stems. Every detail mattered.  <br><br><b><span class="caps">BTW</span>, are you saying that the Gill Sans caps were an actual inﬂuence in the development of Futura? I’d like to know about references for this, if you have them. Thanks.</b> <br><br>No, I have no evidence to support that. But lineage could be made between Johnston’s type/calligraphic teaching and Futura,&nbsp;maybe?</p>'
