    html: <p>“There is no bad type.” <br><br>Funny, I heard those exact words earlier yesterday after curling my lip at Cheltenham Handtooled. “There is no bad type because each and every one serves a purpose somewhere… even Hobo,” my older/wiser partner said. This coming from the guy who professed aversion to Helvetica until I begged to use it; now he just can’t get enough of it. Lesson learned, nonetheless.   <br><br>Neutral is a good word. I love that some Helveticas, as you said, are great large and others are perfect for supporting roles.  <br><br>Helvetica is seen but not heard unless you want it to&nbsp;be.</p>
