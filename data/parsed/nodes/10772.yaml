    html: <p>&gt;Also what does "Anti-Renaissance-statement" &gt;means?  <br>I think Renner et al wanted the new typography of the 1920s as a concious statement against the typographic look coined by Venetian and French Renaissance. While Futura harkens back to the Capitalis Monumentalis in  that it is based on circles and squares as base forms, it is a geometric contruction, done with compasses and ruler, not created in a more dynamic way by hand with a nib/pen. That is what I mean by sterile. Although the finished version, of course, is by no way as regid as the first designs (the o, e.g., isn't just a circle anymore but rather returned to the slightly oval form we know since the 14th century to be optically correct, it still, imo, was a statement against the old-fashioned typography that went before the 20th century.  <br> <br>The digital Futura, btw, isn't too good for longer text, I think. The digial version needs a lot of manual kerning because of the geometric shape of the letters, and while with a LOT of manual editing you can get a decent looking text, it's just too much work to bother. Also, I tend to think that a more dynamic letterform is just more gentle on the reader :-D. I couldn't imagine reading a book or a lengthy article in Futura, even Helvetica would be better. </p>
    html_clean: <p>&gt;Also what does "Anti-Renaissance-statement" &gt;means?  <br>I think Renner et al wanted the new typography of the 1920s as a concious statement against the typographic look coined by Venetian and French Renaissance. While Futura harkens back to the Capitalis Monumentalis in  that it is based on circles and squares as base forms, it is a geometric contruction, done with compasses and ruler, not created in a more dynamic way by hand with a nib/pen. That is what I mean by sterile. Although the finished version, of course, is by no way as regid as the first designs (the o, e.g., isn't just a circle anymore but rather returned to the slightly oval form we know since the 14th century to be optically correct, it still, imo, was a statement against the old-fashioned typography that went before the 20th century.  <br> <br>The digital Futura, btw, isn't too good for longer text, I think. The digial version needs a lot of manual kerning because of the geometric shape of the letters, and while with a LOT of manual editing you can get a decent looking text, it's just too much work to bother. Also, I tend to think that a more dynamic letterform is just more gentle on the reader :-D. I couldn't imagine reading a book or a lengthy article in Futura, even Helvetica would be better. </p>
