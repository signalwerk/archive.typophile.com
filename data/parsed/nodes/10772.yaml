    html: <p>I think the strength of Helvetica is that it HAS no individuality. Overused to death and mundande and -- thanks to Monotypes Arial bastardization of Akzidenz and Helv -- everyday in fron of half the population of the world, I think there is not a single typeface in the world that is more bland. And I really have started to love that quality. Sometymes you just don't WANT a typeface with personality. Sometimes a grey suit is just the right thing and you don't need the lavender-striped piece.  <br>I remember that I hated Helv for most of the 80s and early 90s. But most of the so-called replacements like, say, already look old-fashioned, as their aesthetic is so much coined by the times they were created in, while the Helvetica still looks fresh, maybe because it looks so 60s bland and neutral.  <br> <br>I think its a bad choice for corporate design, and I'm burdened with two clients who use Helvetica so I know what I'm talking about, but it is often perfect for jobs that have such a strong photographic or design impact that any kind of playful type would just be too much . The classicist static and stoic Helvetica is just the right counterpoint here. Just as I find that Futura, which I hated with just as much fervor, is sometimes dead right in creating a certain </p>
