    html: "<p>HD Schellnack wrote:    <br>BTW, the new (well, relatively) design of the second German television, ZDF, was done in SWISS!!! ...of all typefaces in the world, a cheap clone of a typeface you shouldn't use for CD. Probably because he used CorelDraw, as Swiss is part of that package. The rest of the design is overwhelmingly awful as well. I remember Erik Spiekermann blasting it to pieces in the Page, and even the German newsmagazine DER SPIEGEL was having gun at the expense of the design :-D.   <br>   <br>The 'broadband group' at Razorfish, New York (formerly Lee    <br>Hunt Associates, circa 2000) did the ZDF stuff. So I can at    <br>least vouch that they didn't use CorelDraw to do it. =)  <br>  <br>I won't comment on the ZDF stuff (since I've never seen it),  <br>but I will say their recent work for PBS, PBS Kids and the  <br>Disney Channel is great.</p>"
