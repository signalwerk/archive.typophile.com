    html: "<p>HD Schellnack: <br><i>Some day somebody will get the right idea and give  <br>the Helvetica Ligatures, Small Caps and OSFs. It  <br>would give the font a whole new dimension of irony.</i> <br> <br> <br>Ten years ago I designed a set of lowercase figures for  <br>Neue Helvetica 75. It was used, exclusively, in the <br>signage for an exhibition: <br> <br><img src=\"http://www.typophile.com/forums/messages/30/7811.gif\" alt=\"neue H 75, lc figs\"> <br> <br>But there was nothing new here, in fact. Akzidenz Grotesk, <br>the mother of all Helveticas, had already had lc figures <br>for some time (but only in the \"light\" weight, curiously). <br> <br>I don't think, BTW, that this was such a necessary thing <br>(small caps would be particularly pathetic). In my case,  <br>the motivation was to follow the exhibition logo, designed  <br>by Goebel Weyne, a great designer here: <br> <br><img src=\"http://www.typophile.com/forums/messages/30/7812.gif\" alt=\"ESdi30\"> <br> <br>In the case of Futura (and Gill Sans!) the lc figures are, <br>on the other hand, essential, in my opinion. I haven't seen <br>the de Groot figures that you mention. The original Renner <br>ones, as released by The Foundry, are perfect.</p>"
