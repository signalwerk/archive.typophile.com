      <p>Ray Larabie's <a class="freelinking external" href="http://www.abstractfonts.com/font/136?text=ORACLE" rel="nofollow">Good Times</a> is very similar, and could be easily tweaked to re-create this logo. Use the C to make the E, and taper the terminals. The R editing ought to be easy too.</p>
      <p>- Mike Yanega</p>
