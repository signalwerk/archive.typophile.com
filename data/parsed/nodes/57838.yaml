    html: <p>I think the sign maker intended hilarity. So many times the fonts used on these kinds of signs are either rugged or meant to suggest a rustic sensibility, which is meant to be closer to nature. Really though that stuff is just more human culture &amp; is not closer to nature than say ... helvetica or any other font. So why not push back?</p>
