    votes: null
    html: <p>You could try "Generate Glyphs".  Using the original glyph name followed by a period and suffix of your choice will force FL to reference the original glyph. Once the new glyph is present, you can rename it if necessary.</p>
    html_clean: <p>You could try "Generate Glyphs".  Using the original glyph name followed by a period and suffix of your choice will force FL to reference the original glyph. Once the new glyph is present, you can rename it if necessary.</p>
