      <p>jmontalbano - thanks for your answer. I have copied the glyph from the Font windows, and still, hinting is not the same for the two glyphs. I have also tried the 'Paste Special' option, selecting all the check buttons. When I have open the new glyph and try to see its hinting,<br>
