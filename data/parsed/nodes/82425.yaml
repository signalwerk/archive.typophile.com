  html: |-
    <p>I have taken a TrueType font with a free license, DejaVu Sans. Then created a new empty glyph, and copy-paste one of its glyphs to the empty one. </p>
    <p>However, I saw that the hinting for the two is not exactly the same. When viewing the two glyphs in a word processor, I saw a difference between the two. So how can I make an exact copy of a glyph? Should I also duplicate some information inside the font’s table? Any simpler solution?</p>
