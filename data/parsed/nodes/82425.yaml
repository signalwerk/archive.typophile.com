    html: <p>I suppose the really simple solution would be to create a new glyph and place the original glyph as a Component.</p>
    html_clean: <p>I suppose the really simple solution would be to create a new glyph and place the original glyph as a Component.</p>
  - id: 465573
    user: 145679
    date: 2011-05-23T15:58:00
    date_raw: 23 May 2011 — 3:58pm
    votes: null
    html: |-
      <p>jmontalbano, Thanks a lot for your help - I added the original as a component and it works perfect. I'm new to font editors and didn't know about this option.</p>
      <p>It seems to me that DejaVu sans is manually hinted, so when copy an outline of a glyph, you get an original glyph manually hinted, and a second one auto hinted. And when making a full copy from the Font Window, you get a message indicating that this operation will cause a loss of the font's original OpenType tables.</p>
