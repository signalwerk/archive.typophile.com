    html: <p>There is a Photo-Lettering type called Edridge Bookhand that looks a lot like this. It's in the 1960 Photo-Lettering Alphabet Thesaurus (Vol 1). The problem is that the sample is too brief to see many letters. It seems that the possibility of film type being used must be a possibility too.  <br> <br>You asked if anything we know is close to it, and I would say <a href="http://www.myfonts.com/fonts/bitstream/lydian/" target="_blank">Lydian/Lisbon</a>, but that has no serifs. I guess you could add some if the need was sufficient.</p>
