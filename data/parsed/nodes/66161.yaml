      <p>Another proposed definition, from Ken Robinson's TED talk:</p>
      <p><em>the process of having original ideas that have value</em></p>
      <p>This one is interesting in a couple of ways. The notion of value, of course, presumes judgement, although Robinson smartly does not provide criteria for such judgement. But perhaps the key aspect of this definition, that differs from those put forward so far in this discussion, is that Robinson defines creativity as a process, rather than as an ability or a property.</p>
