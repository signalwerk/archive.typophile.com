      <p>Can creativity be taught?</p>
      <p>No, I don't think it can be taught.</p>
      <p>To me creativity is the ability to bring out a meaning. And even better, a coherent meaning, and even better than that, a coherent and fresh meaning. </p>
      <p>So, when I think of creativity I think of guys like Mozart, Van Gogh, Rodin, and to a lesser extent a huge bunch of 'others' including Picasso, Hokusai, Thoreau, even Miles Davis. And then, to an even lesser extent, others such as F.L.Wright, Glaser, Rand, D. Thomas...</p>
      <p>But to say that if one combines A with B and gets AB (as seen in a lot of today's logos) this is not creativity - it is a formulated approach to communication. Problem solving as a means to communicate - a base yet meaningful process / skill.</p>
      <p>Very few people in graphic design are creative. But, there a heck of a lot of sound problem solvers.</p>
      <p>Problem solving on the other hand can be taught.</p>
