      <p>So far, we have the following proposed definitions of creativity (with the caveat that the people who put forward these definitions may not be committed to them):</p>
      <p>Darrel: <em>the ability to create</em></p>
      <p>Me: <em>a presumed enabling property of beings that create</em></p>
      <p>Jack: <em>the ability to let go and be open to multiple directions and new mental wanderings</em> [cf: Russell's suggestion that ‘uncreative’ people are ‘afraid to make mistakes, or make fools of them selves’]</p>
      <p>Christopher: <em>a neurophysiological process in which the brain forms new associative neural pathways</em></p>
      <p>***</p>
      <p>It seems to me that we either need to distinguish mental creativity or ‘creative thinking’ from creative acts, i.e. making things (as Chris put it with admirable clarity), or find a way to unify the mental and physical phenomena.</p>
      <p>I don't find the romantic view of mental creativity helpful, since it relies entirely on metaphors (openness, wandering, road maps, blue-prints, highway); it may be an <em>example</em> of creative thinking -- and perhaps even evidence that creativity is not something that can be nailed down analytically --, but it is also a demonstration that metaphors tend to lead only to more metaphors.</p>
      <p>Chrisopher's proposed definition seems unromantic, but it strikes me as begging the question to apply the label ‘creativity’ to the formation of new associative neural pathways, since the formation of such pathways does not necessarily correspond to what we commonly understand by creativity as e.g. observable in the making of things. If a definition requires abandoning common usage in favour of a novel scientific application, we have to acknowledge that we are no longer talking about the same things. Both common and specialised usage of terms may have their place, but one can't be taken to trump the other.</p>
      <p>This leaves us with the notion of ability or enabling property, another word for which is talent. As I said above, I think such a property is presumed on the basis of observation: we see people creating things or we see the things that people have created, and we presume a property in the people that enables them to create things, and we label this property ‘creativity’. Like most enabling properties, it has to be innate at some level; even virtuoso performances requiring highly developed enabling properties rely on innate properties that in enable such development. So I don't think creativity could be taught, as it were, from scratch, as a purely cultural transmission without a pre-existing natural transmission of an innate creative property. It follows then, that if the phrase ‘teaching creativity’ has any sensible meaning, then it must imply fostering or developing of that innate property.</p>
      <p>It may also imply, in many situations, simply getting the hell out of the way.</p>
    html_clean: |-
      <p>So far, we have the following proposed definitions of creativity (with the caveat that the people who put forward these definitions may not be committed to them):</p>
      <p>Darrel: <em>the ability to create</em></p>
      <p>Me: <em>a presumed enabling property of beings that create</em></p>
      <p>Jack: <em>the ability to let go and be open to multiple directions and new mental wanderings</em> [cf: Russell's suggestion that ‘uncreative’ people are ‘afraid to make mistakes, or make fools of them selves’]</p>
      <p>Christopher: <em>a neurophysiological process in which the brain forms new associative neural pathways</em></p>
      <p>***</p>
      <p>It seems to me that we either need to distinguish mental creativity or ‘creative thinking’ from creative acts, i.e. making things (as Chris put it with admirable clarity), or find a way to unify the mental and physical phenomena.</p>
      <p>I don't find the romantic view of mental creativity helpful, since it relies entirely on metaphors (openness, wandering, road maps, blue-prints, highway); it may be an <em>example</em> of creative thinking -- and perhaps even evidence that creativity is not something that can be nailed down analytically --, but it is also a demonstration that metaphors tend to lead only to more metaphors.</p>
      <p>Chrisopher's proposed definition seems unromantic, but it strikes me as begging the question to apply the label ‘creativity’ to the formation of new associative neural pathways, since the formation of such pathways does not necessarily correspond to what we commonly understand by creativity as e.g. observable in the making of things. If a definition requires abandoning common usage in favour of a novel scientific application, we have to acknowledge that we are no longer talking about the same things. Both common and specialised usage of terms may have their place, but one can't be taken to trump the other.</p>
      <p>This leaves us with the notion of ability or enabling property, another word for which is talent. As I said above, I think such a property is presumed on the basis of observation: we see people creating things or we see the things that people have created, and we presume a property in the people that enables them to create things, and we label this property ‘creativity’. Like most enabling properties, it has to be innate at some level; even virtuoso performances requiring highly developed enabling properties rely on innate properties that in enable such development. So I don't think creativity could be taught, as it were, from scratch, as a purely cultural transmission without a pre-existing natural transmission of an innate creative property. It follows then, that if the phrase ‘teaching creativity’ has any sensible meaning, then it must imply fostering or developing of that innate property.</p>
      <p>It may also imply, in many situations, simply getting the hell out of the way.</p>
