    html: "<p>Let me propose, by way of a thought experiment, that creativity is a construct, a label for a presumed enabling property of beings that create, a property whose existence is presumed from observation of created things or the process of creating them. So what would the practical difference be between teaching creativity -- by which I would understand deliberately encouraging, fostering and developing this presumed enabling property -- and teaching creation -- by which I would mean teaching the making of things? Put it another way: how could you tell whether you had successfully taught creativity other than by observation of things created? I've met many people over the years who claim to be creative -- by which they mean that they have an idea of themselves, which they like, as creative people -- but who don't actually make anything. I think they're full of... but that's because the proof of the pudding is, if not in the eating, at very least in its tangible existence.</p>"
