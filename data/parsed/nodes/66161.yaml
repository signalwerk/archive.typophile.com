      <p>Bill: <em>Creative making is to me just another case of creative problem solving. Popper said this explicitly, incidentally.</em></p>
      <p>I think I disagree with Popper on this, or at least I think one needs to over-generalise the notion of ‘problem solving’ in order to rope in all creative activity. Most obviously, I don't think art can be explained in terms of problem solving, because, really, what's the problem that a painting solves? There are material problems in the making of things, and compositional problems, and these may benefit from -- but do not necessarily require -- creative solutions, but neither these problems nor their solutions constitute art.</p>
      <p>I also don't accept the notion of design as problem solving; or, rather, I accept that only as one working approach to design, and not always the best one. Most often, it is an educational approach, i.e. a way to teach design, which produces designers who use this approach. But every once in a while one meets designers who, either because they were trained in a different way or because they have consciously rejected the problem-solving approach, do things differently. Peter Bil'ak, for example, considers reading, rather than problem solving, to be the paradigm of design. I find this an especially interesting idea, because it allows the possibility that even those designers who imagine themselves to be problem solving might actually be reading. :)</p>
