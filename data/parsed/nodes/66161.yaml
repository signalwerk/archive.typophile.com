      <p>We humans are routinely creative, for example in creating new sentences, never written or said before. So talking about creativity can sound rather pretentious.  </p>
      <p>But I do think that there is something real when people talk about teaching creativity. I think they are referring to finding innovative and good solutions to problems. The problem can be of any sort: it may have to do with how to paint trees or prove a mathematical theorem or run a successful political campaign. But in all cases it refers to a difficult problem, and finding innovative solutions. </p>
      <p>Things that are involved are imagination, focus, discipline, and the ability to get into that state now called "flow". I think the nature of this kind of creativity, and whether you can foster it, are really interesting questions. I don't know the answers.</p>
      <p>edit: Ok so I lied. I do know a small part of the answer, as I wrote a book about it: <a class="freelinking external" href="http://www.amazon.com/Learning-Error-Karl-Poppers-Psychology/dp/0912050748/ref=sr_1_7?ie=UTF8&amp;s=books&amp;qid=1263410545&amp;sr=8-7" rel="nofollow">Learning from Error: Karl Popper's Psychology of Learning</a> (also in <a class="freelinking external" href="http://www.amazon.de/Bedeutung-Lerntheorie-Psychologie-Philosophie-Wissenschaft/dp/B0020I1UI6/ref=sr_1_5?ie=UTF8&amp;s=books&amp;qid=1263410680&amp;sr=8-5" rel="nofollow">German edition</a>.  This is really about creative problem-solving. One aspect of really innovative work is that you don't take past ideas as a given, but are willing to look critically at where the old ideas don't work. Then you try to find solutions that work better for those places the old ideas didn't work so well. Einstein had this kind of attitude--in spades, as they say.</p>
    html_clean: |-
