      <p><em>And artistic problems are at their root not practical, but something else, having to do with expression and communication, but hard to define exactly.</em></p>
      <p>In my experience, artistic problems are almost always problems of form and how to get form. Sure such problems emerge in the process of making something that may transcend form, but form is the level at which the problems resolve, present themselves and need to be dealt with. It is not that I am limiting problems to practical problems, but that I am distinguishing problems within the making of a thing from the thing itself, and saying that the latter is the evidence that we have of creativity, if such a thing exists, whether we are aware or not of the problems involved in its making. Sometimes, this distinction is explicit in the purpose of making: do I make a thing <em>in order</em> to solve the problems that emerge during its making? or do I make a thing for purposes that are independent of that process? If the latter, are those purpose not creative?</p>
