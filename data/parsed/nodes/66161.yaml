      <p>In Popper's terms, problems are difficulties achieving a goal. The goal orientation of human behavior, and the constant effort to overcome difficulties to achieve goals I think is very accurate. I don't think it's generality means that it's not a useful concept. On the contrary, looking at goals and difficulties is an extremely useful tool for analysis of many activities. </p>
      <p>Please don't saddle Popper with the idea of art as self-expression, as he rejected it. He ridiculed it by saying that sneezing is also self expression. </p>
      <p>I think there's an element of truth in the idea that art is partly self expression, but I was referring to that theory mainly to include the personal and emotional element in art. </p>
      <p>I haven't read much in aesthetics, and only know What is Art by R.G. Collingwood--a pretty interesting book, at least in the first half. I don't know a general definition of the goal of art, but if you go to something specific, like a sculptor, and ask the sculptor about his work, you will get a problem-solving story not unlike that of a scientist. He or she was try to get a certain effect, or something new, and thought about other sculptures, the materials, probably the emotion, and started working. One of the things Collingwood claims is that a feature of artistic work is that you discover the goal explicitly as you go along. You start out with a general idea, but discover the goal and form in interaction with the work you make, be it a sculpture or a play. </p>
      <p>But the point is that as you go along--and Popper would agree with this part--you are constantly critiquing whether you have got something you like, and how it needs to be developed or changed. That is problem solving. </p>
      <p>The framework of problem-solving doesn't answer very many questions in itself, but if you don't start there as a framework, you get everything else wrong, in my opinion. </p>
      <p>In the design process, people in type usually talk about the 'brief' they have, and how they went through a process of trial and error--goal oriented problem-solving to solve it. The <a class="freelinking external" href="http://typoberlin.de/video/index.php?node_id=9&amp;lang_id=1&amp;scope=front&amp;ds_target_id=819" rel="nofollow">recently posted video of Christian Schwartz</a> talking about his developing Georgio for the New York Times goes clearly goes through a whole problem-solving process, in discussion with the art director.</p>
