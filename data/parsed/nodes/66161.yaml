      <p>John, I agree with you that the purpose of a creative act is not simply to create, but to get a result, whether that be a painting, poem, scientific theory or new computer. But I believe that when people talk about creativity, and study it, they refer to the process involved in getting an innovative and excellent product, whatever the goal. </p>
      <p>The qualities of the result is how we judge whether something is 'creative', but what the literature on creativity focuses on, I believe, is the process to do that, which is a problem-solving process.</p>
      <p>Chris, I do think that creative effort is purposive, and how one struggles to achieve the purpose is a problem-solving process, even though it's not a problem in the sense of something that worries or troubles you. It may be pursued purely for joy, but still fall under 'problem-solving' in this general sense. </p>
      <p>The reason I think that framework is helpful, is that then you can see what fosters creativity.</p>
      <p>By the way, in the case of Archimedes, when he cried 'Eureka', "I found it", it was because he was looking for something, the solution to a problem.</p>
