      <p>Bill: <em>The qualities of the result is how we judge whether something is 'creative', but what the literature on creativity focuses on, I believe, is the process to do that, which is a problem-solving process.</em></p>
      <p>I think this is a fair assessment, but my concern is that such literature -- and notions of teaching or fostering creativity derived from that literature -- talks about creativity in terms of process and problem solving <em>because that's the only way its found in which to say definite things about creativity.</em> My belief is that this approach to creativity is too narrow, and at least the literature should acknowledge that it is limiting its discussion to what is easily describable rather than suggesting, as it seems to, that creativity = problem solving. It seems to me at least possible that it would be more sensible to say that creativity is <em>applied to</em> problem solving, as evidenced by the fact that problems also get solved in non-creative ways and by the fact that evidence of creativity can be found in works that do not exist to solve problems.</p>
