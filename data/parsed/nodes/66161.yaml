      <p>Popper has an essay called <a class="freelinking external" href="http://www.amazon.com/Life-Problem-Solving-Karl-Popper/dp/0415249929/ref=sr_1_8?ie=UTF8&amp;s=books&amp;qid=1263414930&amp;sr=8-8" rel="nofollow">All life is problem solving</a>, so obviously he would have disagreed with you about whether art and design are problem-solving. </p>
