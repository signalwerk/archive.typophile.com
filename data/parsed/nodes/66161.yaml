      <p>Panda, language solves communication problems. Design solves problems created by design, i.e. by failure to use language. :)</p>
      <p>But accepting, for the sake of argument, your claim that design does solve problems, that doesn't imply that problem solving is either the primary function of design or the singular approach to be taken to design. It just happens to be an approach that has proven itself saleable. It sounds better to walk into a client's offices and say ‘I'm here to solve your problems’ than it does to say ‘I'm your new esthetician’. Of course, Popper would say that an esthetician is problem solving when she's buffing your nails, but that's what I mean when I say that Popper over-generalised the notion of problem solving to the point where it means everything -- ‘all life’ in his own words -- and hence means nothing very useful. I don't doubt that a case can be made that manicures solve problems, but that doesn't mean that problem solving is the essential nature of what a manicurist does and I don't believe it is the essential nature of design. It is possible to practice design -- and probably manicures -- in a way that puts a focus on problem solving processes, and many people do this very successfully and many teachers in design schools encourage or enforce this approach (and is <em>that</em> ‘teaching creativity’?). My point is that it is not a focus or an approach that is essential to the nature of design, that other approaches and foci are possible, and that they may, in fact, be more creative.<br>
      _____</p>
