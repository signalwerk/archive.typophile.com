      <p>Well, I agree with Popper that talking about essences (as did Aristotle) is generally a way to run a discussion into futility, so I won't go there. </p>
      <p>I didn't say creativity was problem-solving, I said it was an aspect of problem-solving. And the creativity that people are interested in is the outstanding kind--difficult and important problems, innovative solutions. But the process is no doubt rooted in skills we use routinely--problem-solving skills. The question is what lifts those to a higher level. And answers include imagination, focus, discipline, passion etc.   </p>
      <p>But I am starting to suspect we are at cross purposes here because we mean different things by 'problem'. You seem to be restricting problems to practical problems, and that's not at all what I mean, or the concept that Popper had in mind. Technological problems are at their root practical problems, but scientific problems are problems of understanding, intellectual problems. A physicist wants to understand matter and motion, a sociologist wants to understand society etc. </p>
      <p>And artistic problems are at their root not practical, but something else, having to do with expression and communication, but hard to define exactly.</p>
