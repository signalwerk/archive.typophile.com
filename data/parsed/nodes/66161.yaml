      <p>Personally, I've found the idea that much thinking is problem-solving the single most useful idea I learned from Popper. </p>
      <p>For example, if you are trying to understand any field--electromagnetic theory, sculpture, statecraft, type design--if you ask: What are the main problems? What are the alternative solutions? What are the arguments pro and con the different approaches? What were past problems and solutions that led to the current situation? You get the lay of the land more quickly than any other way. </p>
      <p>The idea of problem-solving being a key to understanding cognition arose in the 19th century after Darwin, with C.S. Peirce in the US and Ostwald Kuelpe in Germany. The idea was that purpose and trial and error are very important to the way we operate. "Error" means you have some standards about what kinds of thing will serve your purpose or not. I've avoided using the word "problem-solving", but that's what it is: trial and error to achieve a goal, with some mental criteria of what counts as good and bad solutions. </p>
      <p>Routine or very innovative thinking both has these. The question is whether the very innovative and good kind has something more or special, and what it is.</p>
      <p>John, Chris, if you can get a better theory of creativity without the problem-solving framework, more power to you. I'd be delighted to see it.</p>
