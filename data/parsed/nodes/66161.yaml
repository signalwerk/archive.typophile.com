      <p><em>But the point is that as you go along--and Popper would agree with this part--you are constantly critiquing whether you have got something you like, and how it needs to be developed or changed. That is problem solving.</em></p>
      <p>As I wrote above, there are lots of kinds of problem solving <em>within</em> the creating of something, but that doesn't imply that problem solving is the essence or even the purpose of creating something and, hence, creativity equals problem solving ability or process. If Popper is right, then I doubt if problem solving can be considered the essence of anything except insofar as it is a common essence of all activities of goal oriented life. If we want to talk usefully about the essential nature of particular activities, then we need to talk about what is particularly essential to them, what differentiates them. Certainly, it is unhelpful to say that ‘design is problem solving’, if problem solving is a general essence of all activities. ‘Manicure is problem solving.’ There is a sense in which the claim is true, but it isn't a useful sense, especially not if everything else is also problem solving.</p>
      <p>There is also the problem, er, issue of utility. If creativity is problem solving to overcome difficulties in achieving a goal, then the products of creativity are utile and must favour ease and efficiency. But many of the products of creative acts are not utile or are strongly characterised by their extra-utile aspects or components (their art, rather than their craft). I believe this is because creativity is only sometimes and only partly concerned with problem solving, and when it is concerned with art it is no less creative than when concerned with craft. You don't need to be solving problems in order to be creative.</p>
      <p>To me, the equation of creativity with problem solving ability looks like either a cultural or profressional specialised usage. We have a culture that favours problem solving approaches to deliberately goal oriented activities, and hence that favours, financially, problem solving approaches to things like design, and we have a specialised application of design skills in the resulting market that favours a problem solving approach. That's fine: there's nothing wrong with either cultural-specific or specialised usages of words, so long as one recognises the limits of these uses. As you wrote, Bill, this is ‘what people are usually interested in when they talk about creativity’ or, at least, what they are interested in in this culture and in the design profession. I note that education reformers such as Ken Robinson present their ideas about creativity explicitly in the context of this cultural framework and its current structural and technological phase, pointing to the value of fostering creativity in contributing to economic vitality.</p>
      <p>I'm interested in a more general usage, in which creativity is linked in some way to creating, to making things. Creating may involve innovative, original ideas that solve problems, but it doesn't have to. That's a subclass of creating, resulting in a subclass of created things. I'm interested in a notion of creativity that applies in some way to all creative acts, including those that are non-innovative, unoriginal and don't solve problems.</p>
      <p><a href="http://www.zakariya.net/gallery/gallery/after-yesari.jpg" rel="nofollow">Here's an example.</a> It isn't innovative, it is traditional. It isn't original, it is after a piece by another master calligrapher. It doesn't solve any problem or, at least, it doesn't solve any problem that hasn't already been solved hundreds of times, often in easier and more efficient ways.</p>
      <p>I think there are two responses to a piece like this. One must either say that creativity involves more than innovative, original problem solving, or one must say that this is an uncreative piece, that it doesn't exhibit creativity, that although it is a created thing it does not render to observation evidence of creativity. I think either perspective is valid, and if you want to stick with your definition of creativity and deny that this piece exhibits creativity, that's fine. What I don't think would be right would be to try to pervert the nature of a piece like this to make it fit a definition of creativity that it cannot meet.</p>
      <p>Ultimately -- and most often primarily too! --, what interests me is the thing made, not the ideas or processes behind it. This is why I suggested that creativity is a <em>presumed</em> enabling property that we only know through observation of created things. Frankly, I can do without the concept so long as people keep making things.</p>
    html_clean: |-
      <p><em>But the point is that as you go along--and Popper would agree with this part--you are constantly critiquing whether you have got something you like, and how it needs to be developed or changed. That is problem solving.</em></p>
      <p>As I wrote above, there are lots of kinds of problem solving <em>within</em> the creating of something, but that doesn't imply that problem solving is the essence or even the purpose of creating something and, hence, creativity equals problem solving ability or process. If Popper is right, then I doubt if problem solving can be considered the essence of anything except insofar as it is a common essence of all activities of goal oriented life. If we want to talk usefully about the essential nature of particular activities, then we need to talk about what is particularly essential to them, what differentiates them. Certainly, it is unhelpful to say that ‘design is problem solving’, if problem solving is a general essence of all activities. ‘Manicure is problem solving.’ There is a sense in which the claim is true, but it isn't a useful sense, especially not if everything else is also problem solving.</p>
      <p>There is also the problem, er, issue of utility. If creativity is problem solving to overcome difficulties in achieving a goal, then the products of creativity are utile and must favour ease and efficiency. But many of the products of creative acts are not utile or are strongly characterised by their extra-utile aspects or components (their art, rather than their craft). I believe this is because creativity is only sometimes and only partly concerned with problem solving, and when it is concerned with art it is no less creative than when concerned with craft. You don't need to be solving problems in order to be creative.</p>
      <p>To me, the equation of creativity with problem solving ability looks like either a cultural or profressional specialised usage. We have a culture that favours problem solving approaches to deliberately goal oriented activities, and hence that favours, financially, problem solving approaches to things like design, and we have a specialised application of design skills in the resulting market that favours a problem solving approach. That's fine: there's nothing wrong with either cultural-specific or specialised usages of words, so long as one recognises the limits of these uses. As you wrote, Bill, this is ‘what people are usually interested in when they talk about creativity’ or, at least, what they are interested in in this culture and in the design profession. I note that education reformers such as Ken Robinson present their ideas about creativity explicitly in the context of this cultural framework and its current structural and technological phase, pointing to the value of fostering creativity in contributing to economic vitality.</p>
      <p>I'm interested in a more general usage, in which creativity is linked in some way to creating, to making things. Creating may involve innovative, original ideas that solve problems, but it doesn't have to. That's a subclass of creating, resulting in a subclass of created things. I'm interested in a notion of creativity that applies in some way to all creative acts, including those that are non-innovative, unoriginal and don't solve problems.</p>
      <p><a href="http://www.zakariya.net/gallery/gallery/after-yesari.jpg" rel="nofollow">Here's an example.</a> It isn't innovative, it is traditional. It isn't original, it is after a piece by another master calligrapher. It doesn't solve any problem or, at least, it doesn't solve any problem that hasn't already been solved hundreds of times, often in easier and more efficient ways.</p>
      <p>I think there are two responses to a piece like this. One must either say that creativity involves more than innovative, original problem solving, or one must say that this is an uncreative piece, that it doesn't exhibit creativity, that although it is a created thing it does not render to observation evidence of creativity. I think either perspective is valid, and if you want to stick with your definition of creativity and deny that this piece exhibits creativity, that's fine. What I don't think would be right would be to try to pervert the nature of a piece like this to make it fit a definition of creativity that it cannot meet.</p>
      <p>Ultimately -- and most often primarily too! --, what interests me is the thing made, not the ideas or processes behind it. This is why I suggested that creativity is a <em>presumed</em> enabling property that we only know through observation of created things. Frankly, I can do without the concept so long as people keep making things.</p>
