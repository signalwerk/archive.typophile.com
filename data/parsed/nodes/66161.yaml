      <p>To me, creativity is something innately human that exists to some degree in all of us. But, by its nature, is not easily defined or fostered.<br>
      To me, creativity is not a product of investigational process but something that comes without being consciously provoked from within OR without. It is the whimsical ignorance of logic that occurs in spite of all of our attempts to make it logical. It is on one hand, the "Eureka Effect" that logic can be applied to later as proof of concept but not spelled out while arriving at a "solution".<br>
      Creativity can be arrived at without seeking a solution or even having a problem to solve. Sometimes people do things or make things in an impromptu manner and the application (if there is one) comes later. Art is not created as a solution to a problem, it is just something the human does and others give it value. That is not to say that problems cannot be solved creatively--it merely means it is not required to either solve or not solve a problem. Even if not intended, the problem/solution part can be applied after the fact. Someone invents the wheel and later someone else uses it to propel a vehicle.</p>
      <p>ChrisL</p>
