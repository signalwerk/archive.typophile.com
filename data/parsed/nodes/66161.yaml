      <p>Creativity can be taught, I believe in this because I don't consider myself a creative person. I have methods to make my designs be creative and original. </p>
      <p>When I met graphic designer Lorenzo Shakespear from the <a class="freelinking external" href="http://www.webshakespear.com.ar/" rel="nofollow">Estudio Shakespear</a> he said that I shouldn't read too many graphic design books. Instead he encouraged me to keep reading literature, magazines, listening to good music, travelling, meeting people, etc. All these things conform our cultural packbag, and as we keep learning things, this packbag will get bigger. </p>
      <p>The cultural packbag is a tool that helps to provide a solution of a problem without having too many input information about it. </p>
      <p>Another tool that we can add is our "eye training". Watching and studing good design will help us have a more accurate selfcriticism about what we do. </p>
      <p>This tools make us see things in a different way, in a creative way, because sometimes (I don't know who said this) creativity is not only to create something that nobody has ever seen, but also, to think what nobody ever thought about something that everybody sees.</p>
