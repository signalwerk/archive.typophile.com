    html: <p>By the way, as long as we're throwing some book recommendations around, an interesting take on the structure of problem-solving is <a class="freelinking external" href="http://www.amazon.com/gp/product/1560526793/" rel="nofollow">The Universal Traveler</a>. Written in the early 70s and has some of the flavor of the Whole Earth Catalog or a pasted-together Fluxus newspaper. It and Edward de Bono's contemporary <a class="freelinking external" href="http://www.amazon.com/Lateral-Thinking-Creativity-Perennial-Library/dp/0060903252/" rel="nofollow">Lateral Thinking</a> are fun reads and pragmatically useful in my experience. Perhaps that era was also key in marrying the concepts of creativity and problem solving.</p>
