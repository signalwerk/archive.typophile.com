      <p><em>some fonts just don’t kern very well with decimal places</em></p>
      <p>I'm not sure if I understand what you mean by that ... I would expect that for price listings, tabular figures would be required, in which no kerning is involved (or the numbers would not align). Or are your prices not in tabular form?</p>
      <p>The default figures of Helvetica are tabular, but Helvetica's figures are not easy to tell apart in small sizes – which makes them less than ideal for price settings.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/helvetica-dax_4304.jpg"></div><p></p>
      <p>(Top: Helvetica, bottom: Dax)</p>
