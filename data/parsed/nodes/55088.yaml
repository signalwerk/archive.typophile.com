  html: |-
    <p>OK... I  have so far got away with using Helvetica that shipped with Mac OSX, and a couple of weights from Adobe I purchased yonks ago just for particular jobs.</p>
    <p>However, I now need a Sans with good readability, and <strong>with condensed and expanded options</strong> within the family. It must also be excellent for providing prices in catalogues (some fonts just don't kern very well with decimal places) in the UK, so a nice straightforward Pound sign is essential. I own a good part of Dax, but the kerning for decimals (e.g. £3.45) is distracting IMHO.</p>
    <p>I have looked at Proxima Nova, Humanist 777, Swiss 721, Akzidenz Grot (nice but not sure about the Pound sign), but I keep coming back to the dreaded Helvetica... but I don't want to spend that kind of money, when Nimbus offers all I need for less...</p>
    <p>So, is there any good reason to avoid Nimbus over Adobe Helvetica (I don't see one), or are there any other real alternatives?</p>
