    <p>Hello Typophiles,</p>
    <p>I've got a little problem.</p>
    <p>I've submitted a font to a retailer and everything is OK - except the following message that I just received:</p>
    <p>"When I install the font in Mac OS X (I used 10.4), the character preview in Font Book is completely blank."</p>
    <p>As I work on PC I not really know what would be the problem. Export setting related? Other? </p>
    <p>Could someone please help me or suggest something to try? </p>
    <p>Maybe it is a simple problem, but I just know what would cause this.</p>
    <p>Many thanks in advance.</p>
