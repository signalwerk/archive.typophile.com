  html: |-
    <p>-<br>
    <a href="http://www.typefolio.com" rel="nofollow"> <strong>Typefolio</strong> </a> - a new brazilian type foundry - is proud to announce the release of <strong>Adriane Text</strong>. <a href="http://typefolio.com/Adriane_Text_Specimen.pdf" rel="nofollow">PDF here</a><br>
    -<br>
    Adriane Text was designed between 2006 and 2007, and with<br>
    its core objectives to become an adequate text composition<br>
    and characteristics, it can be classified as a transitional typeface.<br>
    However, details in its anatomy offer a certain personality that<br>
    without it, it becomes excessively visible, in addition to an<br>
    excellent legibility in small sizes. The typeface has a medium<br>
    contrast and the axis is predominately vertical. The size of<br>
    x-height counter forms gives an extreme legible effect applied<br>
    on every typographical composition. </p>
    <p>Adriane Text acquires two styles: regular and bold; with its<br>
    respective italic versions, small caps, tabular and proportional<br>
    figures in old style and lining, an extensive set of ligatures for<br>
    different combinations, as well as ornaments,<br>
    dingbats and several ampersands. </p>
    <p>Its italic version possesses fluidity that contrast with<br>
    the severity of the roman special characteristics in its drawing.<br>
    The degree of the italic inclination between the upper and<br>
    lowercase are only slightly different, but offering<br>
    more rhythm to the text.</p>
    <p>Furthermore, the use of advanced typographical projects,<br>
    all font types are accessible throughout the OpenType features.</p>
    <p>More about <strong>Adriane Text</strong> <a href="http://www.typefolio.com/adriane.htm" rel="nofollow">here</a></p>
