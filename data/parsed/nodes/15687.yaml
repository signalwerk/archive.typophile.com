    <p>German punchcutter. 1893–1980.</p>
    <p>August Rosenberger was a punchcutter at the <a href="/wiki/D.%20Stempel%20AG" class="freelinking" rel="nofollow">D. Stempel AG</a> typefoundry in Frankfurt. Among other things, he cut many of <a href="/wiki/Hermann%20Zapf" class="freelinking" rel="nofollow">Hermann Zapf</a>'s typefaces, including <a href="/wiki/Palatino" class="freelinking" rel="nofollow">Palatino</a> and <a href="/wiki/Optima" class="freelinking" rel="nofollow">Optima</a>. He also engraved the illustrations for some books by Hermann Zapf as well.</p>
