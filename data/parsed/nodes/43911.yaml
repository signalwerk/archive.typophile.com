    html: <p>Eben, these aren't at all digraphs. The letter c is not so common in German. I believe that, in true German words (i.e., not loan words from Latin, Greek, French, English, etc.), it never comes alone, but rather always followed by either an h or a k. So it made sense to write &amp; set ch and ck together, I guess. I do not believe that there were any exceptions to this rule, except perhaps when mixing foreign language words into the text (church would look mighty weird indeed wit two closely spaced and/or ligated ch combinations).</p>
