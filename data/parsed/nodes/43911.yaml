      <p>Unless the fonts are made for historians I wouln't give the digraphs any special treatment. Actually, the majority of German readers might even think there's something wrong with the font, because this simply isn't used anymore for some decades now.<br>
      Adam mentioned another important point in the other thread. As you know we can build endless words:<br>
      <a href="http://en.wikipedia.org/wiki/Rinderkennzeichnungs-_und_Rindfleischetikettierungs%C3%BCberwachungsaufgaben%C3%BCbertragungsgesetz" title="http://en.wikipedia.org/wiki/Rinderkennzeichnungs-_und_Rindfleischetikettierungs%C3%BCberwachungsaufgaben%C3%BCbertragungsgesetz">http://en.wikipedia.org/wiki/Rinderkennzeichnungs-_und_Rindfleischetiket...</a></p>
      <p>So, occasionally such ligatures might be wrong, because the two letters don't stand for the sound, but belong to separate parts of a compound word. So any automatic replacement would fail. So I don't think it's a good idea to have it in any standard feature like liga,calt,clig, ...<br>
      Anyone who wants to use is, has to do it manually. This is always the case for setting blackletter texts in German.</p>
      <p>Ralf</p>
