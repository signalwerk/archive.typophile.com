      <p>Eben, &lt;ch&gt; and &lt;ck&gt;<em>are</em> are digraphs in German (and &lt;sch&gt; is a trigraph). Digraph simply means by definition that more than one character is used to represent one sound. &lt;ch&gt; represents the phoneme /x/ (phonetic realisations: [x] and [ç] in literary German) and &lt;ck&gt; represents /kː/, or to be more precise a /k/ marking the preceding vowel to be short.<br>
      It seems to me from your earlier point that you partially mix the terminology ligature and digraph. Digraph means one sound represented by more than one character (often but not always considered one letter), ligature means the visual combination of two characters.<br>
      Digraphs may or may not be written with ligatures depending on orthography and/or tradition, while ligatures can be applied for digraphs but for simplex graphemes as well.</p>
      <p>Examples<br>
      +digraph, +ligature: German &lt;ch&gt;, &lt;ck&gt; in blackletter tradition, Hungarian sz up to the early 19th century<br>
      +digraph, -ligature: spanish &lt;ch&gt;, German &lt;ch&gt;, &lt;ck&gt; in antiqua tradition, all Hungarian digraphs (&lt;cs&gt;, &lt;zs&gt;, &lt;gy&gt;, etc. incl. &lt;sz&gt;) since the 19th century<br>
      -digraph, +ligature: &lt;fi&gt;, &lt;fl&gt; in English<br>
      -digraph, -ligature: most letter combinations in most Latin languages, like &lt;om&gt; in "combination" in English</p>
      <p>[edit: lesser/greater signs corrected]</p>
