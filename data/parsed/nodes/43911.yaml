      <p>Eben,</p>
      <p>There's also a difference between <em>letter</em> and <em>digraph</em> (and <em>character</em>).</p>
      <p>¶ Character is usually the smallest composing entity of a writing system.<br>
      Letter is what shows up in dictionaries and alphabet listings.<br>
      ¶ Digraphs are as specified above character combinations to designate phonetic or phonemic elements of the language different from the meaning of the single characters. ¶ They may or may not be treated as letters.<br>
      Whether something is a digraph, one can determine from the mapping sound &lt;-&gt; character sequence. Whether it's a letter, that's a "higher protocol" convention not determinable from the first information.</p>
      <p>Consequently, character is a property of a writing system (e.g. Latin "alphabet"), while digraphs and letters are concepts of a particular language's orthography (e.g. English, German, ...).</p>
      <p>¶ Thus, Hungarian cs, dz, gy, ly, ny, sz, ty, zs, are digraphs and letters of the Hungarian alphabet. dzs is a trigraph and a letter there. ch is a digraph, but not a letter in Hungarian (it's used in foreign words, is an allograph in that sense of Hungarian h, but not counted as letter, sorted as c+h in dictionaries).<br>
      ¶ In German, ch, ck are digraphs, but are not considered as letters. sch is a trigraph but not a letter either in German.*, **<br>
      ¶ In Polish dz, dż, ch is a digraph, but not a letter AFAIK. But Slovak, where dz, dž, ch are digraphs alike, they are considered separate letters as well.<br>
      ¶ French aux is a trigraph (standing for /oː/, among a lot of other character sequences), but not a letter...<br>
      ¶ English gh, ch, sh, etc. are digraphs, but not considered letters.<br>
      ¶!!! Such conventions can change even. ch and ll were digraphs <em>and</em> letters in Spanish. They are invariably digraphs, but they are not considered letters any more.</p>
      <p>* In German, the diphtongs' writing (except for au) can be seen as digraphs as well, as in German ei, eu, äu, ie are pronounced not what the individually denoted vowels would sound in a diphthong. (&lt;e&gt; stands for [ɛ] or [e], &lt;i&gt; for [i], but &lt;ei&gt; is pronounced [aj], not [ɛj] or [ej]; etc.).<br>
      ** Analytically, ck additionally could be seen as a surface realisation of kk; one could imagine an underlying kk encoding with "contextual alternate" of k &gt; c under the condition of being followed by a: _k. But th</p>
      <p>PS: the letter sz has a very interesting history in Hungarian <em>printing</em>, and I have some very interesting information on that. However, I'm very careful not to draw too early conclusions or to publish incomplete research. (Additionally, the historical distributions/rules of long-s and s in Hungarian printing history is also very interesting, though even more complex). I'd not like to fall into the same mistake as diacritics.typo.cz does, i.e. publishing wrong or premature results.</p>
      <p>——— I hope that terribly long post does not overexplain things and I hope equally I don't seem like an egghead now :-)</p>
