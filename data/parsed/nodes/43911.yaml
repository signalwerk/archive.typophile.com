      <p>They are just a relic of blackletter writing/printing where they were mandatory. When we finally got rid of blackletter, many serif and sans serif typefaces also got them, sort of as compromise for everyone who grew up with blackletter. But I don't think they belong in a non-blackletter typeface.<br>
      They represent a distinct sound, but it doesn't make a difference if you use a ligature or not.</p>
