      <p>My understanding - possibly false - was that a digraph had an entry in dictionaries and phone books which was proof that people thought of the digraph as a unit. But I can see where you could use your definition, and how on some level it is a more useful one in general. From a type making point of view the way something is spoken is interesting but not perhaps crucial. For type making the issue is what sort of form or forms does it need to take to be accepted; and does this need a code point of it's own; and how do you use it as a typographer. I say his not as refutation but as an example of how a term takes on more than one meaning in different groups of people. Probably when speaking of digraphs in the future I should specify that I am using it according to your (liguistic) rules since they are more specific.</p>
      <p>Ligature as we commonly use it just means touching. But historically "ligature" could and did also mean a single piece of lead type with one or more glyph on it touching or not. You could have the word "The" even. And the ch &amp; &amp; ck were exactly that - two glyphs on one peice of metal type. So in this sense the "digraphs" in question were by one acceptable definition of ligatures - ligatures. </p>
