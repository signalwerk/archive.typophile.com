      <p>Matthew, I won't argue here with you, as you seem to be native (?) Spanish speaker.<br>
      However, my information was?, that in a recent reform CH and LL were ripped their letter status, and also consequent are sorted as C+H and L+L in newer dictionaries, while they sorted as separate letters earlier.<br>
      Doublechecking the information now, I see that there has been a reform in sorting (indead sorting them as simple character combinations, but still considering them an own letter of the alphabet. Sorry for that misinformation.</p>
      <p>Oisín: I'd mostly use italics to refer to letters as themselves or in bold face (in texts where italics is used for indicating sound values). As the idea is that the letter should stand out of the text, if I'm lazy to type the tags or if only plain text is permitted, I would use the capital form of all constituting components (i.e. SH, SZ, CH, LL, GY) independently of capitalisation practices of letters in the language. Here capitalisation has the function of making something standing out.<br>
      When doing so I understand that digraphs considered letters are sometimes "fully" capitalised, sometimes not.<br>
      Dutch IJ is capitalised with both components at the beginning of a sentence or in proper names, Hungarian, Spanish digraph-letters are not, only in all-caps setting.<br>
      My name (consisting of sz-a-b-o-l-cs) is such written Szabolcs or all caps SZABOLCS (not *SzABOLCs). (Chili, Llamar,...). In that sense the digraph-letters behave in a lowercase-titlecase-uppercase triad, but as they are composed of individual characters, in in most encoding schemes e.g. Unicode, etc. such a distinction is not necessary.</p>
      <p>Concerning the sz-ligature.</p>
      <p>I wrote about the sz-ligature in Hungarian used up to the (approx) beginning of the 19th century and that woke your interest. The grapheme of the sound (IPA) [s] in Hungarian has a very complicated history, if you view it from a typographic point of view, if you ask me (orthographically, approx. from the 15-16th century it was fixed as &lt;sz&gt;, previously it was also orthographically adventurous). So that ligature was only one typographic realisation. It is built by the long-s and a normal z ligated. It is very different from the german sharp-s (ß), which is an longs_(long)z ligature in Blackletter, but a longs_s ligature in Antiqua (or in some Antiqua forms it's a longs_longz ligature, but never a longs_normalz lig).<br>
      I have scans at home which I can share later. However, this is only a typographic curiosity, as it's long deprecated...</p>
