      <p><cite> &gt; Ligature as we commonly use it just means touching. But historically “ligature” could and did also mean a single piece of lead type with one or more glyph on it touching or not. You could have the word “The” even.</cite></p>
      <p>Eben -- I have a different understanding of the historical use of "ligature" in relation to type. The word derives from Latin and means "tied" more than "touching." As such, ligature was used only to refer to sorts where the letters were actually connected or tied -- fi fl st ct, etc.</p>
      <p>Sorts containing two or more letters (for fitting purposes, say) would be more properly called "logotypes." From the glossary of a printer's guide published by the Graphic Arts Company in Boston in 1924: </p>
      <p><cite><strong>Logotype.</strong> Two or more letters, or a whole word, cast on one body.</cite></p>
      <p>Nowadays, of course, the term "logotype" has slightly different connotations.</p>
      <p>-- K.</p>
