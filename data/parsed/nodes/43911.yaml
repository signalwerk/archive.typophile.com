    <p>So about the "ch" &amp; "ck" in German : please enlighten me!</p>
    <ol>
    <li>These have been made into ligatures at times but they are not true digraphs - are they? </li>
    <li>Are we talking all instances of "ch" &amp; "ck" in German or just some in certain words?</li>
    <li>Erik Spiekermann commented ( I quote waaay too loosely here) one that there was a need in the age of contextual alternatives to look again at "ch" &amp; "ck". What could he have been getting at?</li>
    <li> If you did change these would it be to a ligated (ligature) form; one where the two glyphs touch, or would it be a spacing difference?</li>
    <li> If it was a spacing change how does that impact the pattern of light/dark and the or the "balance" of a word?</li>
    </ol>
    <p>Thanks!</p>
