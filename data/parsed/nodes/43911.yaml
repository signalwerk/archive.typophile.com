      <p>Okay so there is no true digraph here. And to be clear I am not talking about blackletter which has it's own considerations but a Roman serif fonts and/or a Sans made for broadest uses : text, information/signage, headlines, &amp; so on.  </p>
      <p>So as to the question of if it would be desirable to set up language specific kerning in order to accommodate the most likely use of the c in German; or if it would be better to have a language specific (german) liga feature for German. It seem like the answwer is no. I am inclined to agree with Ralph because if you have a good kern for the combination in question that kern should be based on optical considerations. If you wanted to make a special touching on non-touching liga or calt combination then it seem like the consideration would be similar eg does it read well, is it distracting, is it right optically speaking &amp; so on. Reading the thread that Paul linked to it looks like Karsten isn't too keen on the idea of giving them special treatment.  Adam says "Since the "c_h" and "c_k" ligatures are of historic interest only, I recommend putting them in the "hlig" feature, and also in the "dlig" feature, but NOT in the "liga" feature." Which resolves it for me. For me the optical aspect dominates, but also I can't disagree with Karsten Adam &amp; Ralf all at once with some really compelling reason.</p>
      <p>Andy, thanks for showing us your work.</p>
      <p>Paul thanks for the link!</p>
