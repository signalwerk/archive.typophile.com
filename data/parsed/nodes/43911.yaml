      <p>1. What Ralf said. In addition to that: I saw veteran typographers applying tighter spacing to sch, ch and ck – in digital typesetting. Thus, not via ligatures, but customized kerning tables and the like.</p>
      <p>2. All instances. There might be exceptions with loanwords/names, but I can’t think of even a single one.</p>
      <p>3. I assume this is the quote?</p>
      <p><cite>In German, ch, sch and ck are pronounced as one sound, as ck is in English. The c always looks too far from the h or the s, and in metal we had ligatures for these (as for tz by the way), also a time-saving device. I cannot kern the c for these combinations, as they would look bad in all the other languages.</cite> — <a href="http://www.typophile.com/node/40729#comment-250951" rel="nofollow">Erik Spiekermann</a></p>
      <p>4. Slightly tighter spacing (and even that is a controversial issue, see Ralf’s opinion). Certainly no touching.</p>
      <p>5. Yes, of course a ‘blotchier’ colour would be the downside, if you only alter the spacing.<br>
      I once saw a short ‘c’, similar to this (quick and bad) simulation:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/cache_6718.png"></div>I think it was in the headlines of an old (1980s?) Swiss newspaper, but I’d have to investigate to say for sure. One must add that a lowercase ‘c’ almost always is followed by ‘h’ or ‘k’ in German language. Hence, a situation like this (‘cache’), where both forms – a full and a ‘short c’ – appear side by side and could possibly cause confusion, is rare. I think there was no ‘full c’ in the sample I’m talking about.<p></p>
      <p>F</p>
