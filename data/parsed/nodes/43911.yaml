      <p><em>When we finally got rid of blackletter, many serif and sans serif typefaces also got them, sort of as compromise for everyone who grew up with blackletter.</em></p>
      <p>Futura, as one of the faces designed to do away with black letter, had an interesting solution to this problem. It did include ch and ck composite characters in its original release set.<br>
      But the main feature was the vertical termination to the ends of the arms of both the cap and lower case c, which allowed for tighter right hand character space. The paired characters were done away with c. 1933, but the C and c with their elegant cross-language solution remained.</p>
