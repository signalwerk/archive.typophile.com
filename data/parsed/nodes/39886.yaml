  html: |-
    <p>Could anyone please identify this font. It is the sort of typeface that was hand-drawn  for logos and labels back in the old days of rotring and tee-square - and sure enough, I have to reproduce an old label at least 30 years old using this typeface.<br>
    I attach a jpg of the word in the hope that someone will recognise it.</p>
