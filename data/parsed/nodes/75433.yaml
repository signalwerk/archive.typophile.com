      <p>Just a quick guess; could be that different stem values are assigned (by mistake if you auto hinted the font) to stems that should have the same width. And on top of that perhaps the ppm size change are different, so the rasterizer thinks that *this* stem should be thicker at *that* size and a similar stem should be thicker at another size. I could take a look if I had the VFB of course, now it’s just a guess.</p>
      <p>I know people say OSX doesn't read hints but I see a lot of differences when hinting TrueType fonts even on Mac’s. Acrobat uses Adobes rasterizer I think...</p>
