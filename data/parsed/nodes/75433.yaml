      <p>This issue is as old as OSX, we've discussed it here at great length, and I'm surprised someone called it a "bug". </p>
      <p>Even if your stems are identical, without x hints they will not remain so when rasterized on the Mac or Windows. In addition, the Mac is using sub-pixel positioning; each glyph may be positioned at one of three possible sub-pixel locations, giving each letter three possible renderings.</p>
      <p>In your example, if you look closely, there are three different l.c. "n" renderings in the very first line.</p>
    html_clean: |-
