      <p>Hey, Guy Kawasaki has come back as a typography guru!</p>
      <p>The other day a friend with a virus-infested Mac took<br>
      her system to an Apple store and managed to convince<br>
      them to fix her persona-non-grata machine*, but to the<br>
      very end they used the term "unwanted software". I have<br>
      to think they get fired in 5 seconds for saying "virus".<br>
      To be fair many companies seem to do this: I remember<br>
      in the 90s I called Adobe to report a bug (it was not<br>
      including the correct Black and White in Indexed Color<br>
      and Macromedia Director refused to import the images);<br>
      the woman actually congratulated me for finding a feature,<br>
      and when I pestered her she wouldn't budge. Next release,<br>
      "feature" is gone... I should have called and complained<br>
      why they removed my favorite feature! The problem is, it's<br>
      best if non-employees don't engage in this sort of thing...</p>
      <p>* It took two trips. The first time they told her:<br>
      "Somebody hacked your email account. Go away."</p>
      <p>I don't care who calls it a bug, a feature, or a moot<br>
      point; it looks like somebody left dog puke in a ziploc<br>
      under the sun for a week.</p>
      <p>--</p>
      <p>1) The stems are identical in width. Requiring them<br>
      to have x-direction hints sounds like one of those<br>
      government forms where you have to enter your<br>
      full name in three places, on page 1.</p>
      <p>2) It sounds like Claus has hints anyway.</p>
      <p>3) Georgia looks fine in Windows.</p>
      <p>4) What's this about using subpixel positioning without<br>
      subpixel rendering? And if you're using subpixel positioning<br>
      of any kind, you better get your shades of gray/color adding<br>
      up to even perceptions. Maybe it's a gamma issue?</p>
      <p>--</p>
      <p>Does an allegedly typographically-savvy tech company<br>
      really let something like this sit around for two years?</p>
      <p>hhp</p>
