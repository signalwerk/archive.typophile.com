    html: |-
      <p>If you're going to anti-alias a pattern, in this case regular vertical<br>
      lines (stems), the various left_gray + center_black + right_gray totals<br>
      need to fall within a tight range so as not to jump out as too light/dark.<br>
      And "unplanned" gamma deviation is the first thing to throw that off.<br>
      Also, the narrower the center_black the more obvious it gets.</p>
      <p>hhp</p>
