      <p>Based on these posts, the bottleneck seems to be the outdated (also dangerous and standards-noncompliant) practice of “E-mail blasts.” Can’t you just run a blog, with updates every now and then saying “We’re not dead. We’ve got a big announcement coming up,” then run the big announcement? RSS (and the twit’s RSS, Twitter) will get the word out.</p>
