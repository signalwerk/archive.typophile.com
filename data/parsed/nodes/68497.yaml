      <p>I'm also a board member. There is a lot going on behind the scenes. I actually spent part of my afternoon proofreading email blasts that are scheduled to go out next week. The call for submissions and venue information was included in these.</p>
      <p>The conference itself is being held a little later than normal this year. It will be held a the end of August in Los Angeles, California. We're really excited about the location. LA has a great design community and so many good schools. We're working hard to re-vamp the education forum and to make this the best conference ever. </p>
      <p>At the end of January, the Font Aid project distracted us quite a bit. We made an effort to put the project together quickly. We still plan to post the PDF speciman book to Lulu.com for people to print-on-demand. </p>
      <p>Now that the Font Aid project is wrapping up, we're more focused on conference logistics and we plan to get more details to everyone very soon. We appreciate people being patient. The board members are all volunteers with busy day jobs, but we all care very much about SoTA and Typecon and want to see the organization thrive for many years to come.</p>
      <p>Michelle</p>
