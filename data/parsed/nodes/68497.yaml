      <p>And though the official call for speakers hasn't gone out, the program is already being discussed. Each year we make an effort to find interesting speakers in the local community. LA is providing us with countless interesting possibilities. Sometimes speakers approach us and sometimes we approach them. We've had several people already approach us this year who are well known in the Typographic community, but who have never spoken at Typecon. We're excited to have fresh faces on the program, but I don't think we can announce any names yet. I know that's a tease, but I don't want to make announcements until proposals are approved and people are 100% committed.</p>
      <p>We're also putting together some great panel discussions including one Juliet is working on about post-graduate Typographic education in the US.</p>
      <p>Feedback on our previous conferences is always welcome. After each conference we spend many hours discussing the conference, what worked and what didn't. As far as content we try to keep a delicate balance between history and technology, academia and industry. We're always curious how people feel about this balance and how we can improve.</p>
      <p>Michelle</p>
