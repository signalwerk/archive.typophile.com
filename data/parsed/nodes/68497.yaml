      <p>This year, I am one of the n00b members of the SoTA board.</p>
      <p>I absolutely agree with the comments that communication and timeliness have been areas where SoTA has needed to improve. This year will mark my eighth TypeCon. From my own experience, any delay which prevents getting important information out to the community can often be a source of frustration. </p>
      <p>Speaking of delegation, one of my goals as a board member is to increase the number and the quality of these communications, particularly related to email blasts. We will be getting more information out to the community much faster and on a more regular basis as we move forward. I am dedicating a fair amount of my time specifically to this task.</p>
      <p>I would also like to echo Juliet and Michelle’s statements that SoTA is actively working on several TypeCon-related announcements and updates. The general call for speakers (along with a call for the education forum) will be posted and delivered within the next week or so.</p>
      <p>Naturally, any additional suggestions are always welcome.</p>
      <p>(Thanks for squeaking Chris.)</p>
      <p>Grant</p>
