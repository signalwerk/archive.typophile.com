      <p>Each year we have about 20 students who volunteer at the conference in exchange for free admission. Usually these are local students, but we sometimes have out-of-town students and a few professionals. It's a lot of work, but a great experience. We generally require that volunteers commit to 3 days of volunteering. The main conference sessions always start on Friday and we generally need the most volunteer help on the Tuesday, Wednesday and Thursday before that. I've been the volunteer coordinator for the last 3 years. We formalized the process a bit last year and required volunteers to submit an application. I haven't updated the application for Typecon 2010, but hope to get it out soon. With students, it's sometimes hard to pin them down too far in advance.</p>
      <p>For students who aren't able to volunteer, we offer discounted rates. In the next week, we'll also be announcing a new student award that we're really excited about.</p>
