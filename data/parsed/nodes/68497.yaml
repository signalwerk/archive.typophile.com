    <p>I recently received my membership renewal from SoTA. It is hard to support a phantom organization.<br>
    Has SoTA ceased to exist? It seems they do nothing anymore. Other than the wonderful Ampersands for Haiti project, they seem to be in a coma.  Last year, the somewhat ho-hum TypeCon program was barely posted before the event and this year is no better. By now, everyone should know who the speakers are and what the conference will cost. A Professional organization should be run, well, professionally.</p>
    <p>It takes a lot to get me to bitch on a public forum but sometimes only the squeaky wheel gets oiled.</p>
    <p>Chris</p>
