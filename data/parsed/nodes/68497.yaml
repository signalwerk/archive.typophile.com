      <p>Believe it or don‘t, not everyone will actively bookmark and read a blog on a regular basis. Nor will they subscribe to RSS feeds or actively engage via Twitter or Facebook. Yes, we should be more regularly ‘vocal’ through these other avenues (as described) … I’m not dismissing that at all. It’s just that email remains the single most reliable (and common) method of distributing (read: broadcasting) information in digital form.</p>
      <p>The society has thousands of individuals signed up to receive information via their inbox (with more being added each week). We would be remiss to ignore this particularly powerful venue of communication. However, I promise that we will be spreading the word through Facebook and Twitter and other social channels. Honest.</p>
    html_clean: |-
      <p>Believe it or don‘t, not everyone will actively bookmark and read a blog on a regular basis. Nor will they subscribe to RSS feeds or actively engage via Twitter or Facebook. Yes, we should be more regularly ‘vocal’ through these other avenues (as described) … I’m not dismissing that at all. It’s just that email remains the single most reliable (and common) method of distributing (read: broadcasting) information in digital form.</p>
      <p>The society has thousands of individuals signed up to receive information via their inbox (with more being added each week). We would be remiss to ignore this particularly powerful venue of communication. However, I promise that we will be spreading the word through Facebook and Twitter and other social channels. Honest.</p>
