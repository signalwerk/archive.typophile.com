    html: <p> There has been some discussion in these forums about faces that have only one or two odd-ball characters. It seems that some don't like them, but I really do. It seems like a good way to push the boundries of what's acceptable. They also makes for really interesting text faces, I think. I don't think that the 'speed bump' created by some wacky characters really causes a problem, if they are done right. For some reason g's and Q's give a lot of room for expression, but I also really like the 'a' and the 'k' for their expressive potential. <br> <br>I am undecided about the a and the p, to be completely honest. They almost seem contrived, like they are an excuse to keep the g that I like so much. I don't think that I would provide an alternate g, though I did right here... <br> <br>Note to BJ- I think you still have a flash 4 player. You can upgrade quickly and easily with the link in my last post. </p>
