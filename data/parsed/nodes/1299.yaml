    html: "<p> This design presents a dilemma. <br>To me the centerpiece is the \"g\" (although it could just be me) - it can be argued that the join between the bowls (in the traditional bicam structure) is superfluous, and you've gotten rid of it very nicely: on its own your glyph looks like a legitimate alphabetic character. <br> <br>The question is, how much of that approach do you apply to the other letters? The \"a\" works well, and the \"p\" has merit, but if you take it too far the font might become a parody. In fact it's not inconceivable to me to make *only* the \"g\" unorthodox, and build the rest as a traditional text face. The interesting result might be a font that some people will discredit as half-baked, some people will love without knowing -or caring- why, and *everybody* will have something to saw about that \"g\" - in part a promotional trick that Carter often mentions as Spiekermann having revealed to him (concerning Meta, although it could very well have been post-rationalization). <br> <br>If you do that, you must not provide a traditional \"g\" as an alternate. <br> <br>hhp </p>"
    html_clean: "<p> This design presents a dilemma. <br>To me the centerpiece is the \"g\" (although it could just be me) - it can be argued that the join between the bowls (in the traditional bicam structure) is superfluous, and you've gotten rid of it very nicely: on its own your glyph looks like a legitimate alphabetic character. <br> <br>The question is, how much of that approach do you apply to the other letters? The \"a\" works well, and the \"p\" has merit, but if you take it too far the font might become a parody. In fact it's not inconceivable to me to make *only* the \"g\" unorthodox, and build the rest as a traditional text face. The interesting result might be a font that some people will discredit as half-baked, some people will love without knowing -or caring- why, and *everybody* will have something to saw about that \"g\" - in part a promotional trick that Carter often mentions as Spiekermann having revealed to him (concerning Meta, although it could very well have been post-rationalization). <br> <br>If you do that, you must not provide a traditional \"g\" as an alternate. <br> <br>hhp </p>"
