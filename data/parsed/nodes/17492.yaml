  html: |-
    <p>I would need a recommendation for a font which goes well with Avant Garde.</p>
    <p>I tried the Lubalin Graph, but it’s so wide and not very legible and I have to use it for quit a large amount of text...<br>
    It’s for a work about Avant Garde and Herb Lubalin..</p>
    <p>By the way, I am now using the AG for the first time. While it was fun to set the word Avant Garde (with the ligatures of course), everything else isn’t that funny with this font ;)</p>
    <p>Thanks for your help!</p>
