    <p>Hey guys</p>
    <p>I am looking for a strong/”dark” cut of baskerville that will work well set negative. (hvite on black background) I am looking for a version that has thicker hairlines basically. The client i am buying it for have a lot of old readers / brochures are read under bad lighting conditions / a lot of different designers are handling the typeface etc., so it needs to be.. well, easy to handle. </p>
    <p>Anyone know any good alternatives? Or revivals, or fonts that are based on Baskerville? I am using it with Futura so it needs to work well with that font too.</p>
    <p>Cheers</p>
