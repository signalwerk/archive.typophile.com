    html: |-
      <p>Just a historical clarification: ITC (International Typeface Corporation) wasn't technically a foundry, in the sense that they did not manufacture or distribute any type fonts themselves, at least not initially. It was formed to *license* designs to foundries and manufacturers, and to control the quality, consistency, and names of said designs. </p>
      <p>But as John states, ITC represents a key paradigm shift in the history of typefaces by separating the activity of design from its dependence upon specific means of manufacture and machinery.</p>
      <p>-- K.</p>
