      <p>I agree with James Puckett when he says this list seems largely arbitrary. I think any such list would naturally be pretty arbitrary. How can one really tell how influential a face has been? The true influence of typefaces is probably subtle, subliminal, and perhaps subconscious.</p>
      <p>However, I also think this is an interesting question, and I'm curious: what is the purpose of compiling this list? (I'm not trying to be snarky; I'm really curious.) Are you an aspiring type designer who intends to examine the influential faces of the past to learn some good type design tips? Are you a graphic designer who intends to avoid using type that has previously been influential, in effort to break new ground?</p>
