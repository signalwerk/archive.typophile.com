      <p>I think the biggest influences on type history have not been type faces at all. First, non-metal hardware, like typositor machines and Compugraphic photo typesetters, finally got us away from metal decisively and created new sources of supply staffed more by designers than skilled blue collar. Second, ITC seems to me to be the key influential foundry; it successfully repositioned type design as a truly happening medium open to all comers and goosed its competitors to fresher, more ambitious effort and stronger marketing. Type design became visible to the public. The big bang in type history occurred around 1970, with more instant classics appearing since than in the whole history of movable type until then--e.g., Sabon and Galliard, to start with. All this happened before Macs and Postscript, but PS was obviously the next big bang that allowed a new surge of creativity even more awesome. Now everybody could build their own type library at home. </p>
      <p>The last influence of note was stylistic: I can't imagine how it happened, but oldstyle figures, largely ignored in photo-typesetting, kept gaining steadily until now they count as our key stylistic option globally--even the New York Times online uses Georgia, with oldstyle figures! Go figure! And thank God, OpenType finally makes accessing OSFs a snap; no more excuses like having to reach into the expert folder.</p>
      <p>We should be careful ascribing influence to type faces because they are often a matter of fashion, coming and going in exactly that way. I remember when ITC Tiffany and Korinna were huge; now, who cares? </p>
      <p>We still need revised industry standards in two areas: no more text families that lack bold and/or bold italic, and keystroke font links between roman and matching italic at a minimum. The cool boutique foundries are the worst perps here; the big boys never gave us these problems.</p>
