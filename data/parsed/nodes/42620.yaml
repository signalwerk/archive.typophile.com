    <p>Hi,<br>
    I posted a request earlier this week for the top 20 influential typefaces. After reading the numerous helpful replies I’ve come to realise that my question was a little ambiguous. Rather than typefaces that have influenced other typefaces, I was instead more interested in the top 20 typefaces that have impacted upon the design world itself.<br>
    After this reflection my list now looks a little more like this:</p>
    <p>-	Helvetica<br>
    -	Garamond<br>
    -	Univers<br>
    -	Bembo<br>
    -	Times<br>
    -	Futura<br>
    -	Optima<br>
    -	Bodoni<br>
    -	Gill Sans<br>
    -	Frutiger<br>
    -	OCR<br>
    -	Cooper Black<br>
    -	Myriad<br>
    -	Franklin Gothic<br>
    -	Rockwell<br>
    -	Mrs Eaves<br>
    -	Avant Garde<br>
    -	Baskerville<br>
    -	Caslon<br>
    -	Dax</p>
    <p>Thanks for all your comments on my other post and again I’d value your opinions and feedback on this one.</p>
