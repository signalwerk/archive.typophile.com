    html: <p>I don't think Times has had impact. Perhaps you mean fonts that have been HUGE and so over-used that one can't use them without thinking of that time period? Your list could be fine-tuned. For instance, Futura Ex-Bold Condensed instead of just Futura. I'd use Didot instead of Bodoni, but I'm thinking of Bazaar magazine, Italian Vogue, and Madonna's...  well her "book". You are missing Meta and Avant Garde. Myriad, OCR, and Bembo... not so much. ITC Garamond, as much as we loathe it, was huge when it was released. Bell Gothic lead the way, IMHO, to our loving weird traps (Amplitude) and Freight Micro. I'd not include Rockwell but would include Lubalin. Caslon 540 perhaps.</p>
