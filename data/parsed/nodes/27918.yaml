      <p>Dude, whaddya call this:</p>
      <p>"If the lining figures aren’t full cap height, you also need another big set for the “case” (all caps) feature!"</p>
      <p>?</p>
      <p>If the lining figures are not cap height, and you're proliferating figures to match every situation, then the lining figs should be cap height. You wouldn't need any 3/4 height figs. </p>
      <p>In general, my answer to your original question is "x-height or lowercase", for the reasons named above. They are meant for use with lc, and they have extenders, which increases their apparent size, so they don't need to be as big as small caps. But I agree,  if the lc is very tiny compared to SC then the osfs should be somewhere in the middle where they would work with both, or else make a set for every single alphabet. Keep in mind, though, figures aren't read like words, and they only need to blend into text so much, whatever height. </p>
      <p>This could become its own unhealthy obsession, however. Or at least delay your typeface release by months. "I've got superior and inferior figures for my demi-petite caps!"</p>
