      <p><em>This means that an OpenType font has six figure styles,</em></p>
      <p>If the lining figures aren't full cap height, you also need another big set for the "case" (all caps) feature!</p>
      <p>I don't really think tabular small cap figures serve any purpose, and how would they be supported in the application menu? </p>
      <p>I propose that the logical disposition is to connect the "Small Caps" menu choice with proportional Old Style Figures, on the assumption that they will likely be used in text with U&amp;lc -- whereas "All Small Caps" would bring up lining, proportional, small-cap height figures.</p>
      <p>Or perhaps "Small Caps" should have no special provision for figures, but just leave the default or whatever other figure style is applied to the text.</p>
      <p>But "All Small Caps" should definitely have lining, proportional figures, for use in places like a page folio, or in very small captions -- as a sort of optically scaled all-caps setting.</p>
      <p>**</p>
      <p>Back to the thread: my preference, where small caps are significantly larger than x-height, is for OSF with an "x-height" that matches small cap height. Otherwise things like postal codes will look scrappy; the proviso is that the form of "zero" be different than lower case "o".</p>
