      <p>Since this post, I’ve taken to proliferating ﬁgure sets in my OpenType fonts, a practice which I had previously derided as featuritis; however, several other threads at Typophile pointed me in this direction, in particular one in which the need for tabular small-cap-height lining ﬁgures was convincingly argued, with layouts shown. However, I do vary the ﬁgure sets according to the typeface.</p>
      <p><em>If the lining figures are not cap height, and you’re proliferating figures to match every situation, then the lining figs should be cap height. You wouldn’t need any 3/4 height figs.</em></p>
      <p>As the Venetian 301 samples show, three-quarter ﬁgures (whether lining or ranging) are an alternative to old-style ﬁgures in a mixed-case setting. IMO both are required, as they cater to two distinct preferences amongst typographers (and their clients).</p>
      <p>Two sets of lining ﬁgures are particularly necessary for grotesque faces, where the default ﬁgure style is lining. For these faces, three-quarter ﬁgures have always been a compromise: lining to sort-of match capitals and weighted to match lower case, but with height too short and stem width too thin for all-cap settings. </p>
      <p>Hence this solution (Figgins Sans):<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/kp1928_3499.png"></div><br>
      There are three kinds of lining ﬁgures:<p></p>
      <ul>
      <li>Cap-height lining ﬁgures, with upper-case stem thickness, for use in all-caps text</li>
      <li>Three-quarter lining ﬁgures, with lower-case stem thickness, for use in U&amp;lc text</li>

      <li>Small-cap-height lining ﬁgures, with small-cap stem thickness, and wider proportions, for use in all-small-cap text (c2sc feature)</li>
      </ul>
    html_clean: |-
      <p>Since this post, I’ve taken to proliferating ﬁgure sets in my OpenType fonts, a practice which I had previously derided as featuritis; however, several other threads at Typophile pointed me in this direction, in particular one in which the need for tabular small-cap-height lining ﬁgures was convincingly argued, with layouts shown. However, I do vary the ﬁgure sets according to the typeface.</p>
      <p><em>If the lining figures are not cap height, and you’re proliferating figures to match every situation, then the lining figs should be cap height. You wouldn’t need any 3/4 height figs.</em></p>
      <p>As the Venetian 301 samples show, three-quarter ﬁgures (whether lining or ranging) are an alternative to old-style ﬁgures in a mixed-case setting. IMO both are required, as they cater to two distinct preferences amongst typographers (and their clients).</p>
      <p>Two sets of lining ﬁgures are particularly necessary for grotesque faces, where the default ﬁgure style is lining. For these faces, three-quarter ﬁgures have always been a compromise: lining to sort-of match capitals and weighted to match lower case, but with height too short and stem width too thin for all-cap settings. </p>
      <p>Hence this solution (Figgins Sans):<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/kp1928_3499.png"></div><br>
      There are three kinds of lining ﬁgures:<p></p>
      <ul>
      <li>Cap-height lining ﬁgures, with upper-case stem thickness, for use in all-caps text</li>
      <li>Three-quarter lining ﬁgures, with lower-case stem thickness, for use in U&amp;lc text</li>

      <li>Small-cap-height lining ﬁgures, with small-cap stem thickness, and wider proportions, for use in all-small-cap text (c2sc feature)</li>
      </ul>
