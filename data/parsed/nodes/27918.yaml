      <p>To the lowercase. It is nice to make special "small cap figures" for the caps, too… yet another figure option. But we've started to do this with some Linotype designs (Avenir Next, for instance). This means that an OpenType font has six figure styles, not including fractions, numerators, demoninators, etc.:</p>
      <p>Proportional Lining<br>
      Tabular Lining<br>
      Proportional Small Cap Figures<br>
      Tabular Small Cap Figures<br>
      Proportional OsF<br>
      Tabular OsF</p>
      <p>There isn't a pre-defined feature for SC figures, but you can write the small caps features so that if the number default is lining fuigures, and you turn on a small caps feature, the numbers will switch to SC figures when the letters switch to small caps.</p>
