      <p>Another important question is the height (meaning vertical size, not position) of 3 5 7 9 and 6 8. Most designers simply shift cap-height numerals down to get the oldstyle 3 5 7 9. However, depending on the typeface they can be too tall and might descend even further than the descenders, which just looks wrong. This is a mistake seen quite frequently.</p>
      <p>As a second step, I would always adjust (decrease) the size of 3 5 7 9. As a result, 6 and 8 also have to become smaller, making them smaller than the lining numbers. </p>
      <p>Myriad and Minion are two examples where this is done particularly well.</p>
    html_clean: |-
