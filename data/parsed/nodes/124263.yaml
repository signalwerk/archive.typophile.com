  html: |-
    <p>Myriad is our corporate typeface. I would like to replace it with something more contemporary and friendly. </p>
    <p>Alright Sans is the current contender. Its grotesque nature, clean junctions and tall x-height are appealing. I find the open aperture and shallow bowl of the lowercase ‘a’ especially pleasing. Unlike Myriad, Alright Sans has eight weights and small caps.</p>
    <p>Any suggestions?</p>
