    html: |-
      <p>John, this isn’t “a booklet about designing type, the entire text of which was completely handwritten,” but it is still in the same universe, I think:</p>
      <p>Edward Johnston, Mark Argetsinger, David Pankow: <em>Thinking in script</em> <a href="http://carypress.rit.edu/publications/books/thinking-script.html" title="http://carypress.rit.edu/publications/books/thinking-script.html">http://carypress.rit.edu/publications/books/thinking-script.html</a></p>
      <p>This is a letter from Edward Johnston to Paul Standard, reproduced by the RIT Cary Arts Press in facsimile—in book form, instead of letter sheets. It is a quite nice little thing.</p>
