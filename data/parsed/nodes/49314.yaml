      <p>this is interesting, however</p>
      <p>I was trawling through my local cd shop and noticed a cover which caught my eye. It was an album by indy Australian band, The Fauves titled WHEN GOOD TIMES GO GOOD. Upon its sleeve face was a photograph of an old message board (like one from a 50th wedding anniversary or what have you). Whilst the digital rendering was spot on the designer made a fatal error of judgment. Mr Michael Ebbels - although your random kerning amused me, Din (designed in 1994) was not, has not been made into plastic pin on lettering for primitive message boards. </p>
      <p>Discuss,</p>
