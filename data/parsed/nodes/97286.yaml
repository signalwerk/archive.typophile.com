      <p>This doesn't really scan as a word (at least not in English), but when I try really hard to figure it out, I read <em>Xrvjo</em>. Maybe you could try another solution besides making all your letterforms out of triangles.</p>
      <p>If you are going to spray-paint the logo onto the product with a stencil, you'll have a hard time replicating the gradient fill. You'll get better results silk-screening the logo onto the product. You can order printed labels, too, but be sure to ask for ones that use inks, substrates, and adhesives designed for outdoor use.</p>
