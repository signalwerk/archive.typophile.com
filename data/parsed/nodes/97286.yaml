  html: |-
    <p>Hi everyone,</p>
    <p>A friend of mines is starting a small side business making making custom volumes (holds) for climbing gyms. The idea here is that all of his products are made from triangles, so all of the typography is derived from a 30,60,90 triangle.The name of the company is Irujo.</p>
    <p>I am trying to put together a solid logo for him to use and I would love to hear some feedback from everyone. Feel free to critique color palette, typographic form, and readability.</p>
    <p>Also, The logo needs to work printed and as a stencil to spray paint onto the products.</p>
