      <p>What kind of sicko befriends mines?! (Kidding.)</p>
      <p>Seriously, in situations like this the key is to resist the temptation to make it totally literal, otherwise the results typically end up totally gimmicky. Either use actual triangles very sparingly, or merely allude to triangles. Subtlety is key. You might even go for -or start from- something as subtle as this:<br>
      <a href="https://www.fontfont.com/fonts/primary/bold" title="https://www.fontfont.com/fonts/primary/bold">https://www.fontfont.com/fonts/primary/bold</a></p>
      <p>hhp</p>
