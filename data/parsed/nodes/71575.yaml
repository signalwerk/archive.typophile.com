      <p>Ooops, a search turned up a previous ID request. I belive this is <a class="freelinking external" href="http://www.veer.com/products/typedetail.aspx?image=JBT0000108" rel="nofollow">Silver Thread</a>, a digital revival of <a href="/wiki/L%2526C%20Hairline" class="freelinking" rel="nofollow">L&amp;C Hairline</a> by <a href="/wiki/Jason%20Walcott" class="freelinking" rel="nofollow">Jason Walcott</a>.</p>
      <p>There are some nice images of the original in <a class="freelinking external" href="http://typophile.com/node/42829" rel="nofollow">this thread</a>.</p>
