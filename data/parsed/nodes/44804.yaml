      <p>I'm not saying Word is wonderful, but this is most likely NOT primarily a Word bug.</p>
      <p>1) How are you getting the ligatures into your document? Are you manually inserting them in some way (and if so how?), or are you relying on automatic ligature formation in the application?</p>
      <p>2) If you're using automatic ligature formation (as I would hope/assume), then the problem most likely lies in what iWork is putting on the clipboard when you copy the text. It should be the underlying text, and apparently it is not.</p>
      <p>Cheers,</p>
      <p>T</p>
