      <p>Normal disclaimers, I’m not a professional psychologist, but I think Eric’s initial post is text-book “seven stages of grief” over the loss of his Mac Book... </p>
      <p>Shock or Disbelief<br>
      Denial<br>
      Bargaining<br>
      Guilt<br>
      Anger<br>
      Depression<br>
      Acceptance and Hope</p>
      <p>Fortunately he’s at the latter stages (anger, depression) but is using Word as a kind of surrogate for his subconscious feelings towards Apple. So I'm concerned that without tackling the Apple issue head on he'll reach the acceptance and hope stage without fully facing the root cause of the problem. It's okay to feel betrayed and let down by Apple, it's okay.*</p>
      <p>Cheers, Si</p>
      <p>*unless of course the Mac was the victim of some college drinking game.</p>
