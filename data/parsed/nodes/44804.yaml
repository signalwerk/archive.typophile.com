      <p>:) Well, just to add my bit. I once had a nasty argument with Word. You know the<br>
      crazy "hide unused menu entries to simplify navigation" feature that came with Word 2000 (or whichever version it was) ? It made my life much more difficult because suddenly the position of entries became unstable - they can appear anywhere (vertically in menu) or not appear at all, depending on whichever other entries Word decides to hide. Instead of mechanically clicking to the same position in menu as always, I now need to actually read the menu contents each time what takes unnecessary time. </p>
      <p>It happened once that I moved my mouse quite fast through the whole menu in desperate search for some apparently lost entry (that I had been using for years before) - when a pop-up window showed up saying: "Dear user, it seems you are using MS-Word for the first time. Do you want to watch our introductory video ?". I answered no and continued in my search for the lost option. In a couple seconds another pop-up came saying "Dear user, are you sure you do not want to try the introductory video ?". I could not undestand my eyes. I clicked yes, I am sure I do not want to see the bloody video and moved on to other things. Guess what, it took just another minute or so before Word just defiantly launched the bloody introductory vid !! </p>
      <p>Well, now this is what I call the "Artificial Intelligence to Improve User Experience", Microsoft-style.</p>
