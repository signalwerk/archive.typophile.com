      <p>Fair enough, Si; I actually reached the acceptance stage before writing this post, so Word is not a surrogate for my frustration. I wasn't shocked, because I've had issues with my MacBook in the past. Electronics kind of hate me. I'm not convinced I'd have any fewer problems with a Windows book, and I like the UI better in OS X (not to mention the whole loyalty thing, since I've been using Macs since I was 3). Also, the fact that I can bring my computer to the mall and get it back in working condition for free in less than a week is nice.</p>
      <p>It was really hard to feel upset when my hard drive crapped out, because even though I've apparently lost all of my data (because I was too stupid and lazy to back it up and $500 isn't worth it), it couldn't have come at a better time. It was four hours after I had finished my last paper during regular-class-time, and I hadn't started any of my finals yet. I was actually thinking about wiping my entire hard drive and starting over.</p>
      <p>This wasn't so much a "Gah! Why do I have to use Word?" post as a "Hey, I never realized how much I dislike Word until I used Pages" post. Right now I'm using InDesign on one of the Mac Minis in the library, and it's not altogether unenjoyable.</p>
      <p>Also, Thomas, I'm not asking for help about a bug; this was kind of a short essay that I had worked out in my head, and I needed to find an appreciative audience. I tried to tell my friends about how much I dislike Word's type management, and they just rolled their eyes.</p>
      <p>For the record, I'm blaming Facebook. I was using Facebook chat for the first time when my computer locked up on me.</p>
