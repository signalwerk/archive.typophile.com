  html: <p>I have os 10.1.4. <br>Unfortunatly i dont have a font manager. <br>When i bring my fonts to the system 9 fonts folder (i have an ibook with classic) it works for indesign and photoshop but i cant get the fonts i wish to use to appear in illustrator 10. <br> <br>Has anyone an idea of why this is not working and what could i try instead? <br> <br>Thanks alot, <br>David.</p>
