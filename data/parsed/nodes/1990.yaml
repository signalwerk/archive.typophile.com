    html: <p>Have you quit and restart illustrator? that solves many quirky errors. <br> <br>So you are using indesign, photoshop and illustrator all in classic? (That's what I understand from what you wrote above) why not at least use OS X for illustrator. <br> <br>Volume\Library\Fonts. <br>or Volume\users\username\Library\Fonts <br> <br>If not be sure you are running Illustrator in classic if that's where you are storing the fonts. <br></p>
