    <p>I am currently a senior at the American University Dubai, majoring in graphic design. However I have a strong liking towards type design and I was wondering if anyone could recommend good type design firms to intern at.</p>
    <p>I was and still am working on a typeface that I created for my senior project.</p>
    <p>The typeface that I am working on is based on the Devanagri script however is an adaptation to the latin typeface futura. I have worked independently on the typeface teaching myself how letterforms work. I was determine to get my basics right and therefore flew out to India for 5 days where an Indian type designer ( Prof. Mahendra Patel) guided me as I had no faculty member on campus or in Dubai to help me understand the script and build my sensitivity towards letterforms.</p>
    <p>I want to make my typeface part of reality. I need a lot more experience and if I get the chance to be exposed to the felid will help me develop my skill a lot more.</p>
    <p>As of now this is my most important project and it is based on type design and it is one field I want to pursue.</p>
    <p>I have attached an image of what my typeface looks like.</p>
    <p>I graduate in May and just gaining some experience in the world of type would be a great opportunity for me.</p><div class="imageWrap"><img src="http://typophile.com/files/Screen Shot 2013-01-21 at 10_4709.09.12 PM.png"></div><div class="imageWrap"><img src="http://typophile.com/files/Screen Shot 2013-01-21 at 10_5585.09.25 PM.png"></div><p></p>
