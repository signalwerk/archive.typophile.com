    html: <p>I don't think the lower bowl of B works well -- the way the upper one intrudes makes me shiver... <br>The D is somehow obese, compared to the rest <br>G's hook could be lower <br>M's upper connections are too heavy <br>R is a bit unbalanced, looks like it's stooping <br>Y makes me wonder why the stem on baseline has no 'flares' <br>Hope this helps -- nice classic looking typeface!</p>
