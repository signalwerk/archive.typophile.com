  html: |-
    <p>Hello, <br> <br>Well, please don't look for what I previously posted, I have learnt alot since then, and my typeface has made many developments. This is my first typeface. I won't go into where it came from because it has made such a drastic evolution that almost nothing of the original design remains. In fact, absolutely nothing. <br> <br>It has never really had any direction; I have just based it on some classical proportions and adapted to suit. I can see that I am having alot of problems with weightings (largely due to its mono-weight sans-serif beginnings), but what of the general "look" of the face? Is there anything that really sticks out? <br> <br>It's sort of a semi-serif-nearing-some-kind-of-optima-type-look at the moment. <br> <br>... <br>Well, go for it I guess. <br> <br>Thanks, <br> <br>- Chris <br></p>
