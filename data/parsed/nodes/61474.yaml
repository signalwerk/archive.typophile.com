    <p>After years of work, I finally have a <a href="http://levien.com/phd/phd.html" rel="nofollow">final draft</a> of my thesis done. There's still time to make some more tweaks, but for the most part this is the version I plan to submit formally.</p>
    <p>My defense is <a href="http://events.berkeley.edu/index.php/calendar/sn/eecs.html?event_ID=21552" rel="nofollow">scheduled</a> for Sept 3, on the UC Berkeley campus. If you're in the area and fascinated by the technical aspects of curves and font design, you're welcome.</p>
    <p>Now that the PhD is done, I'm hoping to have more time to actually draw fonts, but we'll see - there are a bunch of last minute things, as well as other important stuff I've pushed aside while I've been crunch mode on the thesis.</p>
    <p>Many thanks to all of you for the encouragement and feedback over the years. It's amazing to finally feel done, but it hasn't quite sunk in yet.</p>
