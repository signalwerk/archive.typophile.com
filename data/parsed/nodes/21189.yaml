      <p>Peter, Amplitude and all other Font Bureau families are available for license as individual styles. No one expects you to pay a lot of money if you only need a few weights and widths. You can view, test, and select particular styles by hitting the "STYLES" tab<br>
      <a href="http://www.fontbureau.com/fonts/Amplitude/styles" title="http://www.fontbureau.com/fonts/Amplitude/styles">http://www.fontbureau.com/fonts/Amplitude/styles</a></p>
      <p>Arizona Daily Star commissioned smoothed-out versions for headlines, which I think is what Tiffany referred to. Designer Christian Schwartz shows a preview of this on his site: <a href="http://www.orangeitalic.com/amphead.shtml" title="http://www.orangeitalic.com/amphead.shtml">http://www.orangeitalic.com/amphead.shtml</a> Amplitude Headline is currently available to publication designers. Once the family is entirely filled out, Font Bureau will publish it online. If you're interested in Amplitude Headline specifically, or other Font Bureau sans, just get in touch with us.</p>
      <p>and this is just cute: Amplitude on Sports Illustrated for Kids, World Cup Fantastic Four-style:<br>
      <a href="http://www.magazines.com/magcom/covers/0/06/323/0063235.jpg" title="http://www.magazines.com/magcom/covers/0/06/323/0063235.jpg">http://www.magazines.com/magcom/covers/0/06/323/0063235.jpg</a></p>
