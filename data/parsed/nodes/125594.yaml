    html: <p>I haven’t really thought about this in a long time, but IIRC, system fonts are the first choice for browser defaults; hence the old selections of Times New Roman, Arial and Courier New on Windows systems and Times, Helvetica and Courier on Apple systems. Anyway, googling for, say, 'system fontfamily' should help you find some pointers from others that have been through these headaches.</p>
