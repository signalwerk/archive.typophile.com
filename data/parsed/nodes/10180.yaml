    html: <p>Hah, I actually have a little trouble discerning free from comes-with-the-computer sometimes. I thought Gill Sans was a font you had to buy, but I have it somehow. Who knows? Probably part of a freeware office-type program. hmm. <br> <br>You're right Daniel.  I did do a google search, but I got discouraged by the number of results. Perhaps I should have just asked for a few comprehensive free font sites. I am quite weary of wading through million hit searches for pages with thousands of possible searchs designed to just get a hit. <br> <br>Sorry, I ramble. <br> <br>Many thanks Daniel. I lost the bit of paper my typography tutor gave me with all the free type sites. <br> <br>- Chris</p>
