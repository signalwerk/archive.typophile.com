  html: <p>I am to be doing my first real (like, paid even) design job. My client is wanting business cards, a letterhead and some other pre-press work done. I believe the business is multimedia. <br> <br>For his business card, he is wanting me to use Arial, because it is clean and simple etc. I think the reason for this is he either doesn't realise there are other typefaces available to purchase, (which could lend the design a distinctive quality and hint of character) or does not want to invest. <br> <br>I am scheduled to work initially for 4 hours, by the way. (this could be a squeeze &gt;_&lt; ) <br> <br>So, I am looking to some free alternatives to Arial in the mean-time.  I would even rather use Helvetica. (it's just more well crafted). I also don't think he would want to go to the extra trouble of purchasing a font considering the duration of my employment. <br> <br>Alternatives anyone? Thanks <br> <br>- Chris</p>
  html_clean: <p>I am to be doing my first real (like, paid even) design job. My client is wanting business cards, a letterhead and some other pre-press work done. I believe the business is multimedia. <br> <br>For his business card, he is wanting me to use Arial, because it is clean and simple etc. I think the reason for this is he either doesn't realise there are other typefaces available to purchase, (which could lend the design a distinctive quality and hint of character) or does not want to invest. <br> <br>I am scheduled to work initially for 4 hours, by the way. (this could be a squeeze &gt;_&lt; ) <br> <br>So, I am looking to some free alternatives to Arial in the mean-time.  I would even rather use Helvetica. (it's just more well crafted). I also don't think he would want to go to the extra trouble of purchasing a font considering the duration of my employment. <br> <br>Alternatives anyone? Thanks <br> <br>- Chris</p>
