      <p><cite>As far as I understand, licensing tends to be by machine or individual, regardless of end-use.</cite></p>
      <p>Yes. The license is tied to the user of the actual font software, not for example the publisher of a printed book, that uses that design.<br>
      However, it gets more complicated, when the font software becomes part of the “end-use”, e.g. in an e-book.</p>
