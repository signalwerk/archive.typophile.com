    <p>Just received an enquiry about one of my fonts not behaving in Word. It looks like line tops are clipped in the Page View, it looks OK in Normal View, and it prints fine. What is more, my font is not the only one, huh :|<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/clipping_4923.png"></div><br>
    Most other fonts (TNR, Helvetica, etc.) do not share this problem.<br>
    What is going on, please?<p></p>
