  html: <p>Some time ago while reading Müller-Brockmann's <em>Grid Systems</em> I came across a lettered list that skipped the letter 'J'. At the time I thought it was just a typo, but I've just read Jan Tschichold's essay "Consistent Correlation Between Book Page and Type Area" and there's also a list that skips 'J'. Googling turned out nothing so, so I'm hoping someone here might provide some insight on why it's done this way in (at least) Swiss German.</p>
