    html: |-
      <p>In German the ambiguity of I and J remained longer than in other areas where the Latin script was used. In blackletter fonts I and J weren’t differentiated at all until the 19th century. And in turn for Roman fonts, people often also didn’t feel a need for clear differentiation. So they rather used a J-like design to represent an I – which could otherwise be mistaken for a lowercase l. (See riccard0’s link)<br>
      Tschichold didn’t like that at all. And regarding the I and J in blackletter he had a traditional view and hated the development of making a different design of blackletter I and J. So to him, the existence of a differentiation was directly connected to the type style.</p>
