    html: |-
      <p>The letter "J" was only relatively recently distinguished from "I". In Fraktur in particular, the capital I and J are often very similar or identical, so it might cause confusion to distinguish them in indexing. Here's a reference specific to German:<br>
       <a href="http://feefhs.org/guides/German_Gothic.pdf" title="http://feefhs.org/guides/German_Gothic.pdf">http://feefhs.org/guides/German_Gothic.pdf</a> </p>
      <p>In general, it seems like this was also once a more widespread practice based off of the Latin Alphabet; see page 186 of the following:<br>
      <a href="http://www.iapt-taxon.org/historic/Congress/IBC_1959/Prop021.pdf" title="http://www.iapt-taxon.org/historic/Congress/IBC_1959/Prop021.pdf">http://www.iapt-taxon.org/historic/Congress/IBC_1959/Prop021.pdf</a></p>
      <p>Possibly related, the U.S. Library of Congress classification scheme uses only J and not I. It does distinguish U and V however, so the reason for not including I might be simply to avoid confusion with 1.</p>
