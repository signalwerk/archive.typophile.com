    <p>Just found TYPO’s summer issue in my mailbox and boy — it’s a winner. Somehow these guys in Prague step up their game with each issue. The result: TYPO is now the best type magazine around.</p>
    <p>Anyone care to differ?</p>
    <p>_ _ _<br>
    Bert Vanderveen BNO</p>
