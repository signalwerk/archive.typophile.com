  html: |-
    <p>Gerard Unger's multi-award winning typeface now features small caps in all of its styles. After the release of <a class="freelinking external" href="http://www.type-together.com/Capitolium%202" rel="nofollow">Capitolium 2</a> and <a class="freelinking external" href="http://www.type-together.com/Capitolium%202" rel="nofollow">Capitolium News 2</a>, which take advantage of OpenType possibilities and feature a broader language coverage –including accents for northern and central Europe languages– editorial designers from around the globe started to ask for small cap support... You asked for it, we deliver!</p>
    <p><a class="freelinking external" href="http://www.type-together.com/index.php?action=portal/viewContent&amp;cntId_content=2668&amp;id_section=138#frm_contacto" rel="nofollow">Contact us</a> for an upgrade!</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Capitolium2_SC2_5928.gif"></div><p></p>
