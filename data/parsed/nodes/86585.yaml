    <p>Newbie in the world of Typography and techie with middle brain just got fascinated with types. I'm designing a website which I originally chose Helvetica for my headings and Bodoni MT for my text. However, I noticed that Bodoni did not quite displayed as I expected. I still like Helvetica for my heading, and just tried Deja Vu for my text and scratching my head over this one. Can any one suggest a good pairing with my Helvetica?<br>
    I would really appreciate that!</p>
    <p>Cheers,</p>
