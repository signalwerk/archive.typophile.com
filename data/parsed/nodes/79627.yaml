      <p>You’ll never need a Thousands of fonts, being they as cheap as they may.</p>
      <p>MyFonts currently lists <a class="freelinking external" href="http://new.myfonts.com/search/tag%3Afree/fonts/" rel="nofollow">about 600 free fonts</a>. Much crap, ok, but if you look into it you’ll find some very decent offerings adding to your basic starter set: e.g. Museo, Secca or Novel. In any case, check with the glyph contents of freefonts, it tends to be limited. </p>
      <p>And, of course, you’re welcome to give <a class="freelinking external" href="http://www.signographie.de/cms/front_content.php?idart=194" rel="nofollow">Andron</a> and <a class="freelinking external" href="http://new.myfonts.com/fonts/andreas-stotzner/lapidaria/medior-light/" rel="nofollow">Lapidaria</a> a try as well  ;-)</p>
