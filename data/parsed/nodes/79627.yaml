      <p>As a student, it's certainly important to be aware of tradition and the mainstream, which is well represented by Adobe.<br>
      But typography is a practical discipline, and your education will be limited and limiting if you develop work habits in such a straight groove.</p>
      <p>I wrote about this issue <a href="http://www.shinntype.com/Writing/PerfcSet.pdf" rel="nofollow">here</a>; that was ten years ago (before OpenType), so the examples are out of date—but I stick by the theory and principle.</p>
