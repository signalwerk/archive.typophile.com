      <p>I am also a student, and I bought the adobe package and am happy with it. A lot of the fonts are "Pro" fonts with lots of opentype features, extended glyph sets, large families with different weights, optical sizes...</p>
      <p>The PDF adobe provides is very long and hard to read - they used to have another PDF on this page: <a href="http://blogs.adobe.com/typblography/2008/03/ffee.html" title="http://blogs.adobe.com/typblography/2008/03/ffee.html">http://blogs.adobe.com/typblography/2008/03/ffee.html</a></p>
      <p>but the link is dead now. I have the one-page PDF with a summary of the families that that page used to link to - how can I attach a PDF?.</p>
      <p>Some of the non-Adobe-created families only have a few fonts, so they're kind of a teaser (DIN, Futura, Baskerville, Officina, etc.), but it's still great to have a legal copy of at least some of the weights of those great families.</p>
      <p>There is a bunch of overlap with the fonts that come with Creative Suite, but I found it worth the price to get the additional fonts.</p>
      <p>There's also this: <a href="http://www.adobe.com/education/products/typeclassics.html" title="http://www.adobe.com/education/products/typeclassics.html">http://www.adobe.com/education/products/typeclassics.html</a> - slightly cheaper but not as good.</p>
      <p>I keep meaning to do a chart showing the differences between the CS5, the FFEE, and the TypeClassics font lists. That would be useful...</p>
