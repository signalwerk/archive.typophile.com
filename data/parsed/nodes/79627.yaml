      <p>Thank you all for the responses.</p>
      <p>Mugford - Very helpful, yeah the overlap isn't necessarily that much and it seems like it still is a quality package at a ridiculous price, so I think I will be purchasing the education essentials to get started off. Thanks for taking the time to compile the links and the actual details of the adobe collection super helpful.</p>
      <p>Andreas - Thanks for the suggestion, your right it is a bit novel to think that I need that many faces, I would spend hours looking at all the various fonts packages with the corel product, that I probably wouldn't get anything done design wise as I ogle through the list haha. Very nice suggestions though. Thank you.</p>
      <p>Nick - Thanks for that link, that really put something in perspective for myself in regards to how I view the practice of typography, it was critically informative. Thank you.</p>
      <p>Thomas - Your right, although I would need much restraint, purchasing the corel pack doesn't automatically mean I have to let myself drown in a sea of fonts, well taken advice. Thank you.</p>
      <p>Aluminum - Yeah that was the page which actually led me to post this question as I wanted to deepen my knowledge of whats effective and not, thanks, that page is an invaluable source.</p>
      <p>I guess one lesson that I came across is that even though this is a big start for myself, it is only a small step in my life long journey of type education it appears.</p>
