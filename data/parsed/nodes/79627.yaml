    <p>Hi,</p>
    <p>I am a student, currently in the process of purchasing my first font pack. After doing some research on this forum I came across two particular options that seems to fit what I need</p>
    <p>Adobe FontFolio Education Essentials,</p>
    <p>or</p>
    <p>the 1000 fonts from bitstream that are stored with CorelDraw Graphic Suite X5</p>
    <p>now my question is which would be better for someone in my position?</p>
    <p>Should I stick with the Adobe collection because of the versatility of it's collection, or get the CorelDraw fonts because of the vast immensity in the scale of what it offers? Which of the two would offer me a better ground as far as building up my skills, and collection from?</p>
    <p>Excuse this post if it's in the wrong section, and if this has been posted before feel free to close it and redirect me towards the thread.</p>
    <p>Here are links to the mentioned packs</p>
    <p>CorelDraw list<br>
    <a href="http://graphics-unleashed.unleash.com/2010/02/coreldraw-x5-font-list-posted.asp" title="http://graphics-unleashed.unleash.com/2010/02/coreldraw-x5-font-list-posted.asp">http://graphics-unleashed.unleash.com/2010/02/coreldraw-x5-font-list-pos...</a></p>
    <p>Adobe Font Folio Education Essentials<br>
    <a href="http://www.adobe.com/education/products/fontfolioeducationessentials/" title="http://www.adobe.com/education/products/fontfolioeducationessentials/">http://www.adobe.com/education/products/fontfolioeducationessentials/</a></p>
    <p>Thank you in advanced for any guidance in the matter.</p>
