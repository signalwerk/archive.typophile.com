    html: |-
      <p>I looked into it a bit more. There is actually not that much overlap between Adobe Font Folio Education Essentials and the fonts that come with CS5:</p>
      <p>--Rosewood Std: both have 2 fonts<br>
      --Trajan Pro: both have 2 fonts<br>
      --Caslon Pro: both have 6 fonts<br>
      --Chaparral Pro: CS5 has 6 fonts, FFEE has 32<br>
      --Myriad Pro: CS5 has 12 fonts, FFEE has 40<br>
      --Adobe Garamond: CS5 has 4 fonts of Garamond Pro, FFEE has 34 fonts of Garamond Premier Pro</p>
