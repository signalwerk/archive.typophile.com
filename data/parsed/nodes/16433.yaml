    html: <p>I'm just not sure about all those circular cuts in the glyphs, at some points they act as an ink trap would (which works?) but at other times it just seems random. You've got lots of glyphs that are just copies of each other, flipped ie. the s and the z, p and the q etc. If you examine other faces you'll find that this is not the case. This practice seems to give your idea a rather bland/haphazard feel to it. What does this look like without all those random cuts in it? That might be worth pursuing.</p>
