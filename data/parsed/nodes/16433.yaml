      <p>Intention? I guess I was interested in designing a gothic/industrial looking typeface that wasn't so heavy. I also like the idea of individual letters that are constructed using 'generic' elements.</p>
      <p>As for the intention of the typeface, it would be cool if someone was interested in it enough to run it through Fontographer or whatever so it could be used as an actual typable font. That's something that's not currently within my capabilities, but something I'd like to see happen in some capacity.</p>
