    html: |-
      <p>I think with a an increased contrast in the strokes this might be pretty sweet. The question is Asian brush contrast or western nib?  </p>
      <p>Also specifically - the 2579 f &amp; s all have some form issues.. The 2 5 and s have a crossbar that's unfortunate. It needs thinking through. Also the f is just too programatic. It draws on the font's formula for it's solution to too great an extent. </p>
      <p>The age in which this might have been a really popular/fashionable font is over - but if you want to finnish it I would encourage you. There is enough here that's worthwhile to give it a go. If I really like the direction I might even be willing to 'fontify it'  - maybe.</p>
