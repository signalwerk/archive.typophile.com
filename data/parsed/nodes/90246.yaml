  html: |-
    <p>Hello everybody!</p>
    <p>I'd like to promote two new type families!</p>
    <p> <a class="freelinking external" href="http://www.myfonts.com/fonts/armasen/caturrita-extra/" rel="nofollow">Caturrita Extra</a> is a re-evaluation of a typeface family with several adjustments in features with a more careful look. </p>
    <p><a class="freelinking external" href="http://www.myfonts.com/fonts/armasen/caturrita-display/" rel="nofollow">Caturrita Display</a> is a new version of Caturrita. Better for titles and small pieces, with a large contrast in the heavy weights.</p>
    <p>Thank you very much for your support!<br>
    Hope you like it.</p>
