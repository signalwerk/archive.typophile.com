    html: <p> The outlines of Verdana you clearly can't re-use. But the bitmaps are a more confusing issue. If you just took the Verdana bitmaps and made them all fit a fixed-sized box, I think it's not ethical to redistribute (you could always use it yourself), even though it might very well be legal. <br> <br>On the other hand, there are few ways to make bitmaps at that size, and if you pretend you made them yourself nobody can complain (but you'd need to hide the association). It's better to get permission, but considering it's MS you're extremely unlikely to get it... <br> <br>I think your only real recourse is to start from scratch and make a mono bitmap font, perhaps visually compatible with Verdana. The bonus with this approach is that you can fine-tune the letterforms to better fit the mono space. The outlines you'd have to make yourself (or re-use a public source). But I see no problem with "Veranda" - it's actually nice, especially when you consider that it's a wide and flat design.  :-) <br> <br>hhp </p>
