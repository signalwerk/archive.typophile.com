    html: <p>While I mostly agree with you, I've just found out FFF Star (<a href="http://www.myfonts.com/fonts/fontsforflash/fff-star/" target="_blank">http://www.myfonts.com/fonts/fontsforflash/fff-star/</a>)  by Fonts For Flash (<a href="http://www.fontsforflash.com/" target="_blank">http://www.fontsforflash.com/</a>), which is a 8px bitmap font based (imho) on Verdana. <br> <br>I don't follow the if-they-steal-I-can-steal-too philosophy, and I know nothing about them, but they're selling FFF Star by the light of the day, via MyFonts, so maybe, and I say maybe, a thing like this is perfectly legal. <br> <br>If so, and I still doubt it, I could distribute my little font to the six persons who asked me, and sell it to the one who was willing to pay for it... <br> <br>g. <br></p>
