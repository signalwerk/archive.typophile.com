  html: <p><b>Veranda mono</b> is a monospaced version of <i>Verdana</i> at 8 px. <br> <br><img src="http://www.typophile.com/forums/messages/29/1952.gif" alt="Veranda mono"> <br> <br></p><ul><li>Is is legal?  I love small-size Verdana, this is a homage or a simple copy?  I think it's like a sans-serif Bodoni... </li><li>Should I change the name?  Should I cite the original?  Should I write and ask for permission?</li></ul> <br> <br>Thanks, <br>g.<p></p>
