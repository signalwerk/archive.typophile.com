    html: |-
      <p>I think the problem is that we don't know what it is you're going for: contrast, harmony? What's the piece for, what's the feeling?</p>
      <p>I have a hard time understanding why you're using Letter Gothic for body copy (unless it's short), but perhaps Franklin Gothic for titles? .... unless you're looking for contrast, in which case you the field is wide open. You could go with a fifties script, for example.</p>
      <p>You might look at something like Unit, which has a broad range of weights, and could be used instead of Letter Gothic, and might be an improvement, IMHO.</p>
