    html: <p>If you like the TEFF fonts you mention but find them <em>too</em> formal (and the price is quite up there), you might have a look at a typeface like <a class="freelinking external" href="http://www.underware.nl/site2/index.php3?id1=dolly&amp;id2=roman" rel="nofollow">Dolly</a>. It somewhat has the Lexicon-look, but less serious looking, yet not too playful either. :)</p>
