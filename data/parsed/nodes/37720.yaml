    html: |-
      <p>Thanks... so, my personality: technology educator by day, poet by night. I love letterpress objects and fine books, though I can't afford too much of either. When I read, I tend to read with a pen in hand and mark liberally (I love marginalia and notes by others), so I don't revere every printed book as sacred. My taste is eclectic in just about everything (modern pop to classic jazz, prose poetry to classical forms) but if push comes to shove I'll take the old school over the new school. My own writing consists primarily of short poems, prose poems, and lyric personal essays.</p>
      <p>Moving to typing letters is painful for me because I have a real crazy fetish for fountain pens (I have scads) and fine cotton papers. Very close to that is my penchant for buying every kind of notebook/blank book/journal I find, which I fill with a lot of journalling, drafting of creative pieces, commonplace books of quotations, etc. For all of that, my handwriting is atrocious and I have not one whit of artistic talent, though I've tried calligraphy and sumi-e and even type design.</p>
      <p>In person I'm the introvert in the crowd until the switch is flipped and then I'm the class clown, the one with the quick joke and I always have a sarcastic and/or ironic addition... I like making people laugh, particularly the ones with the secret, radiant smile. I teach, and my teaching includes some elements of stand-up comedy, performance art and monologue :)</p>
      <p>My letters tend to be long, philosophical, include quotes and assemblages of words that have caught my fancy, and often don't include any of the typical "news" (the weather is fine, the kids are good, etc) or even a well-defined beginning or end. They stop and start and the assumption is the reader knows who I am and that I will likely write again to add more. </p>
      <p>Handwriting and comic faces aren't my thing... I want something that has a touch of formality but isn't all play... and not all work (I love TEFF Trinite and Lexicon, Storm  Jannon and Regent but they seem more suited to a memoir than a letter) either.</p>
      <p>That probably doesn't help a bit :)</p>
