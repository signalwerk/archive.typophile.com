    html: <p>As you are a poet, you might like Kent Lew's <a href="http://www.kentlew.com/WhitmanCharSet2.html" rel="nofollow">Whitman Italic</a>, a font which he has previously suggested might be useful for setting poetry. In my experience, it certainly looks very good in pull quotes. And a range of Display weights have now been added and will soon be available from Font Bureau.</p>
