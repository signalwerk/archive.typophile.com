  - id: 231301
    user: 19337
    date: 2007-10-02T13:59:00
    date_raw: 2 Oct 2007 — 1:59pm
    votes: null
    html: "<p>Handwriting fonts say more about the creator's personality and tend to wear out their welcome in long correspondence. The italic versions of some of the regular text fonts are extremely readable and would give a more informal feel if that's what you're after (e.g Goudy Oldstyle italic). But Stephen is right: you need a font to match your personality, or at least the tone you prefer to convey.</p>"
    html_clean: "<p>Handwriting fonts say more about the creator's personality and tend to wear out their welcome in long correspondence. The italic versions of some of the regular text fonts are extremely readable and would give a more informal feel if that's what you're after (e.g Goudy Oldstyle italic). But Stephen is right: you need a font to match your personality, or at least the tone you prefer to convey.</p>"
