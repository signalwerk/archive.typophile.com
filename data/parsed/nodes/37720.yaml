  html: <p>What face(s) do you use for personal letters and correspondence? For health reasons I am having to drastically scale back a serious handwriting habit-- I write many personal letters each week and journal constantly. I'm not looking for a face that replicates handwriting (though if any exist that don't get annoying after more than a paragraph or so, I'd be glad to know).</p>
