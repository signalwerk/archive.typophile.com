    html: <p>I find <a class="freelinking external" href="http://www.itcfonts.com/fonts/font/pid/243015/Elysium+Complete+Family+Pack/detail&amp;grab_id=0&amp;page_id=50305&amp;query=Elysium&amp;SCOPE=ITCFonts" rel="nofollow">Elysium</a> works well where you have crafted your narrative and want the reader to savour and think about what you've written. A distinctive typeface with a bit more weight than typical text faces. Has an attractive, legible italic, old style figures and small caps, and you can get it in a reasonably priced OpenType package.</p>
