  - id: 413766
    user: 16911
    date: 2010-05-31T14:36:00
    date_raw: 31.May.2010 2.36pm
    votes: null
    html: |-
      <p>I agree, Slogan is your best bet.<br>
      The extra loop in the ‘g’ is not necessarily a signature style of Matheis, but a relic of German Kurrentschrift, see <a href="http://www.flickr.com/photos/ninastoessinger/4184236243/" rel="nofollow">this lettering chart on Nina’s Flickr pages</a>. So is the stemless ‘d’.</p>
    html_clean: |-
