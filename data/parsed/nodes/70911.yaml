  - id: 413808
    user: 16911
    date: 2010-06-01T00:23:00
    date_raw: 1.Jun.2010 12.23am
    votes: null
    html: <p>Of course! This form of ‘d’ is not unique to Kurrent; for example, it can also be found in the French Ronde and typefaces inspired by it, like <a href="http://new.myfonts.com/fonts/linotype/gando/?refby=mfde" rel="nofollow">Gando</a>, <a href="http://new.myfonts.com/fonts/agfa/fling/?refby=mfde" rel="nofollow">Fling</a>, or even <a href="http://new.myfonts.com/fonts/adobe/cochin/?refby=mfde" rel="nofollow">Cochin Italic</a>. For 1940’s Germany, Kurrentschrift is just a much more obvious source of influence.</p>
