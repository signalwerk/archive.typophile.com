      <p><em>In Word increasing the leading should solve the problem on-screen.</em></p>
      <p>But only if you use 'exact' leading values. If you use a multiple of the default linespacing, e.g. 1.5, you may still get clipping at some type sizes.</p>
      <p>The Word clipping issue is related to their interpretation of VDMX table data, which means that there isn't an obvious way to correct it in font metrics: the clipping may occur at some sizes even if the OS/2 table win metrics are sufficiently large to clear the tallest glyphs in the font.</p>
