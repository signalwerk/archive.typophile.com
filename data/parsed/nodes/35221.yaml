      <p>As I understand it, the acute accented A ring may occur in grammars, dictionaries and other linguistic texts, perhaps also in some poetry. Any Danish vowel can be marked for stress with the acute accent, and since the A ring is an independent vowel it can take the acute.</p>
      <p>This is what I have gathered from past discussions on this topic: The acute should always be above the ring, not beside it. Above the uppercase A, the ring can be lowered slightly, but it is preferred if it does not merge with the top of the letter. Both accents can be made slightly smaller and more vertically compressed than their normal forms, but not so as to look squashed. In the lowercase, the ring may be lowered slightly, but since there is usually enough vertical space for both marks they should not be otherwise modified.</p>
      <p>Generally speaking, merging diacritic marks is a bad idea, because this creates new forms that interrupt reading while we decipher them. It is better for the marks to be distinct and with enough space between them for both to be clearly identifiable. This is a general rule for pretty much all writing systems, especially those that use a heavy number of diacritic marks and combinations of marks (e.g. Biblical Hebrew or Qur'anic Arabic).</p>
