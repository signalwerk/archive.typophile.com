    <p>When searching the web for information about U+01FA, I have found here a topic where John Hudson explained that <a href="/web/20190924182712/http://www.typophile.com/node/35575" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">aringacute</a> is a Danish character and thus should be normally present in a well-designed Western font despite of the problems with vertical spacing it causes.</p>
    <p>Now the question: so, how should I design this character, if increasing vertical font metrics is heavily undesired? Would it be possible, for example, to put the acute next to the ring rather than above it? Also, does anybody know, what this letter might look like in the traditional Danish typography?</p>
