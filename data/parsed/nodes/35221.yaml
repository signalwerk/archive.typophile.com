    html: |-
      <p>When it comes to this type of thing, and for text fonts in particular, what's worse, clipping on screen (should print fine) or crashing of the marks and base character together, which looks bad on screen and in print? In general I'd vote for clipping.</p>
      <p>Fot a UI font, where on screen legibility is the most important aspect of the design, crashing may be the best option, or as I've seen done on mobile devices the base character is shorter to accomodate the two marks (these tend to be one-off precomposed characters).</p>
      <p>In Word increasing the leading should solve the problem on-screen.</p>
