      <p>It's not just Word. A lot of the Mac apps do similar things with clipping, which I observed when testing Inconsolata.</p>
      <p>I think the answer is that you can set the height metrics so that ascender + descender + line gap define an expanded bounding box greater than the usual 1000 em units (I've seen 1200 bandied about, but a typical line gap is 90, or at least that's the default in FontForge, so 1090 might be the target to shoot for).</p>
      <p>Thing is, I don't know exactly _how_ to specify these in OpenType values so that apps recognize them. The rules seem to have changed, especially since the days of Type1. I would like to get to the bottom of it, but don't have time to do a research project of trying various height metrics settings with lots of apps.</p>
