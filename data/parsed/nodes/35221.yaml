    html: <p>Aringacute is not used in Danish. You can not stress an Å with an extra accent in Danish. The Å an å characters are themselves a rather new invention in Danish spelling. They were implemented in a post WWII reform of Danish spelling in 1948, in part to distance Danish from German influences as Germany, Germans and German was very much out of vogue. So Hudson's claim that it's an archaic  Danish form is not correct.</p>
