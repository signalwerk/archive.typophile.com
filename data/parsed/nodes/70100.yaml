    html: <p>There are quite different text and display versions (reflecting substantial differences in the metal) (making this one of the first digital families with 'opticals' to use that ghastly Adobespeak). It's miles better than Monotype's own, very poor digital adaptation. Berthold's photo and digital adaptations of Monotype faces are, by and large, much better than Mono's, but there must be some sort of licensing difficulty which prevents them from being sold. I guess the only way to do it is to get an existing licenseholder to transfer his or her license. But it won't be me! Interestingly, I couldn't get the pdf you reference to render on Acro 8 Win 7. The design of the display (i.e something like 16 pt) version is much, much, niftier! With enormous and utterly gorgeous ascenders. A fabulous type to use for large text.</p>
