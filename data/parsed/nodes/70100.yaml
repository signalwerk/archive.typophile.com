    html: |-
      <p>Well - - and the italic seems too dark and too tightly spaced.</p>
      <p>It would be interesting to see some informative (extensive!) comparisons between the metal and Berthold digital. I think the general feeling about Mono Van Dijck is that it was one of their more flawed revivals. But you would have expected Berthold to deal with those problems. Why release Van Dijck at all if you aren't going to get it right? One would really like to know Berthold's approach to the revival, why they did what they did and who they expected to use it and why and when. Is there anyone still around who would know? I would hesitate to guess anything - - . It's hard to imagine Berthold saying 'this is freaky, we love it, we don't care what you think - - up to you to figure it out.' Given the cost of producing one of their photo typefaces - - well, they simply must have thought it out.</p>
      <p>It's interesting puzzle to try to figure out what is wrong with a typeface that almost, but doesn't quite, make it. And it's quite possible that something that looks dreadful as shown here could somehow just work when used by someone who had figured out how to use it.</p>
