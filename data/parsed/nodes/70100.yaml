    html: <p>I think you could be right on this one. I'm still so hypnotized by the Berthold PR . . . but the fact is, they did do a lot of careless work, as I've discovered whenever I've dug deeply into the library. I guess it's like everyone in type - - sometimes you get it right, but mostly you have to compromise because there just isn't enough time. Also, I haven't compared this to photo, and it is just possible that the digital conversion was very badly done. What baffles me here, though, is to find so many things done right among so many done wrong. <em>Why?</em></p>
