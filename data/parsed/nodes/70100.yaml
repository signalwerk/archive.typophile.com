    <p>I’ve discovered a Van Dijck revival I didn’t know:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/berthold_van_dijck_1_5836.png"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/berthold_van_dijck_2_3455.png"></div><p></p>
    <p>(The whole document can be found <a class="freelinking external" href="http://www.kirchentag.de/uploads/media/DEKT33_KirchentagDasMagazin01-10.pdf" rel="nofollow">here</a>.)</p>
    <p>It seems to be a better version than the Monotype one (see <a class="freelinking external" href="http://typophile.com/node/30938" rel="nofollow">this</a> discussion). The PDF info panel shows “VanDijckBookBQ-Regular / Italic / ExpertBQ-Regular”, but I can’t find anything on the Berthold font site. Does someone know anything about this font? Is it still available for licensing?</p>
