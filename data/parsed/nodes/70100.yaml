    html: <p>Worth noting as a footnote, van Krimpen's opinion that van Dijck should not be revived as being too difficult to get right either philosophically or practically. I must admit I find that the spirit of van Dijck seems singularly absent from the spiky, narrow, and strangely Victorian-in-feeling Elzevir and the plodding, humourless, charmless Custodia, which looks like Quadraat crossed with Adobe Garamond. The problem is van Dijck. Everyone who has revived it has been phenomenally talented, phenomenally well-informed. Yet somehow the typeface slips out of their grasp.</p>
