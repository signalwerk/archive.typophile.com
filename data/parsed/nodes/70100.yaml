    votes: null
    html: <p>Bill, it's possible that Berthold's Van Dijck might have been produced at the request of a particular customer, as happened more often during the metal, photo and early digital period than we might think. Compared to the cost of the typsetting machines, development of a new type family was relatively inexpensive, and would sometimes be undertaken in order to seal a contract for purchase of the machine. [A good example of this was Mike Parker's commitment to provide Greek versions of any Latin typeface requested by Linotype's Greek sales rep in the 1970s, supporting a practical monopoly in the local typesetting machine market.] If this were the case, then it is also possible that the project had external deadlines that might have affected the quality of the revival.</p>
