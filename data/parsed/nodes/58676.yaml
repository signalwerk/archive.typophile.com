    html: <p>Is there some sort of practical limit to how big the Winascent, Windescent, HHEA Ascender and HHEA Descender can actually be? Mine are 1325 and -1290. The font appears to be fine, it works in TextEdit and Indesign, it validates as fine in Fontbook, but if I try using the font in Word it insists that the font is bad and disables it.</p>
