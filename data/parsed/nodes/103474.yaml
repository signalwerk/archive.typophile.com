      <p>If it's on a statue and it's 50-60 years old, it's hand-cut and not a font.</p>
      <p>That being said, T.M. Cleland's <a class="freelinking external" href="http://www.myfonts.com/fonts/bitstream/della-robbia/" rel="nofollow">Della Robbia</a> (1902) may have been the inspiration for the inscription you saw.</p>
