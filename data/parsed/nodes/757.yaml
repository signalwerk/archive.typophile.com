    html: "<p>Based on some of the 'artifacts' displayed on the Bata Memories web site, I'd have to agree that the logotype has been around for much of the company's existance and is probably was originally a hand-drafted design. <br> <br><a href=\"http://www.batamemories.org.uk/\" target=\"_blank\">http://www.batamemories.org.uk/</a> <br> <br>On a related note, check out the rather wonderful variation of the typeface used in the masthead of the company newspaper from the 1940's: <br> <br><a href=\"http://www.batamemories.org.uk/batarecord.html\" target=\"_blank\">http://www.batamemories.org.uk/batarecord.html</a> </p>"
