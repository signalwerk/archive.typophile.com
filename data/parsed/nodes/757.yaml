    html: <p>The other possibility is that no specific font was used. I know that logo has been around for a long time - I could easily believe it was more than twenty years ago that I first saw it as a kid. Is it possible the letters were drawn explicitly for the logo? I'm not a graphic designer, but I have to assume that happens/-ed, especially in the days before digital type.</p>
