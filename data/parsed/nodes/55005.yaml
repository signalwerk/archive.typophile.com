    <p>Hello,</p>
    <p>I am Mary Beth (Mudgett) ODonnell and I am looking for an email or other address for<br>
    Carol Twombly. I knew her from High School  - where we were in some Art classes together.<br>
    If anyone knows where I might find her, I can be reached at emailmb [atsign] mac [dot] com. ( I lost access to the other accounts)<br>
    NickName (for me)  was Fung... </p>
    <p>Any help would be appreciated.<br>
    Thank you,</p>
    <p>I'd love to just say Hi, Carol... Hope you are well.</p>
    <p>Mary Beth Mudgett O'Donnell<br>
    from Massachusetts - now a bit further North in the Mountains...<br>
    August 6, 2009</p>
