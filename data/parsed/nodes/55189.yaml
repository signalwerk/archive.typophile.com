    <p>I love the minimal sans look that you get on a lot of sites as text. I was thinking it may be arial, but without any antialiasing on it. Whatever the case, I wanna recreate it in Adobe... Arial in adobe is anti-aliased and clean as can be.. not the look I need. </p>
    <p>Am I correct on the ID of types like this? Let me who you what I mean. </p>
    <p>Even the "loading data" text uses it. The type in this site. What am I not finding?</p>
    <p><a href="http://kashiwasato.com/" title="http://kashiwasato.com/">http://kashiwasato.com/</a>?</p>
