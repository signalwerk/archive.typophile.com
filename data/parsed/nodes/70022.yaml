      <p>Looking much better, well done!</p>
      <p>Hyphens don't really bother me all that much. For me reading isn't hindered, except for two cases: when there are two hyphenated lines consecutively (looks bad having lots of lines end with -), and when a hyphenated word's other half is on a new column or new page. I always avoid those, as they are a bit tacky.</p>
      <p>As for the poster: the only things I notice now are some of the line lengths seem a bit varied. GRAHAM SYDNEY's copy below it flows well, as it appears to end around the same vertical point, where POOR RACER's copy seems to come way too close to the next column. Maybe try dropping those back a little bit? The other thing I notice is instead (for columns 2 and 6) of aligning them to the bottom, just align the dates (as in "13 WEDNESDAY" and "17 SUNDAY" being on the same horizontal line.) That way the last column won't stick out as awkwardly.</p>
      <p>It's definitely coming together! The overall grid/unity has greatly increased since the last draft.</p>
