    <p>Hello all,</p>
    <p>I am a student at Massey Unversity in Wellington, New Zealand studying Graphic Design. For our typography paper we have to come up with an A2 events calendar for the Wellington City Gallery Spring Programme, 2010. </p>
    <p>I was wondering if I could gauge your feedback on it, I'm not entirely sure what's not working, but I know something isn't.</p>
    <p>Many thanks,</p>
    <p>Michael</p>
