      <p>Just taking a quick glance, the first thing I'd do is get rid of the second horizontal rule after the dates.</p>
      <p>=============<br>
      GRAHAM SYDNEY<br>
      FREE---------</p>
      <p>Graham Sydney: Life &amp; Vision<br>
      Meet at the front desk / 6 pm<br>
      -------------       &lt;-this one isn't necessary at all and adds a lot of visual clutter.</p>
      <p>Also, the titles' sizes change (like from COLIN McCAHON to ART IN THE MORNING) which adds a little bit of clutter as well. They should all the the same size.</p>
      <p>The type in the top left box still needs a bit of adjusting. If you're going to have such huge line breaks and have the horizontal rules coming across, they should both have the same amount of buffer room on the type (the thicker one is too close to the type.)</p>
      <p>Lastly, I think the photo may be a bit too dark. It's hard to see anything there.</p>
      <p>An experiment: not sure how it will look, but try aligning columns 2 and 6 to the bottom. It may be effective, but also might look horrible. Give it a shot!</p>
      <p>On the plus, the hierarchy is good, the colors look great, and everything seems to be well organized.</p>
