      <p>Carl, you make some good points. And really, Optima might be too lapidary/monumental/architectural (at least in its UC) to qualify as a true Humanist Sans.</p>
      <p>I would however add:<br>
      1) Maybe Zapf's "between" business was due to terminological paucity and/or a layman-targeted dumbing-down thing.<br>
      2) You could say that stroke contrast makes it <strong>more</strong> humanist... So maybe Paul was in a way right that it's the epitome.</p>
      <p>hhp</p>
