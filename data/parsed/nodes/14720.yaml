    <p>Greetings!</p>
    <p>I'd like some recommendations for a text companion face to be used with <a href="/wiki/Optima" class="freelinking" rel="nofollow">Optima</a>. Optima is being used in an identity for a medical practice, and I'd like to find a good workhorse (but elegant) companion text family to be used for correspondence, letter writing, advertising, etc.</p>
    <p>Any thoughts?  Your views are greatly appreciated.</p>
    <p>Thanks in advance,</p>
    <p>Andrew</p>
