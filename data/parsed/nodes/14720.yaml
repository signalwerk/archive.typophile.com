      <p>Optima can serve in text. It's not been used a lot for books, but it is designed for that use. You might investigate the new Optima Nova, whose italics are more useful for their intended purpose than the original sloped romans. It has 7 weights, small caps, even italic small caps, plus a few condensed weights. There are several weights that would be very nice to see used together in small sizes. If you have the budget, spring for the whole family and get the beautiful titling caps too. </p>
      <p>Otherwise, Optima is quite difficult to use with other faces. Other Zapf designs seem most comfortable with it. Try Aldus, or Melior, or for a little freshness Zapf Renaissance or Aurelia.</p>
