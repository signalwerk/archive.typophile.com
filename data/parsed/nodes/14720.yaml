      <p>I'm not going to call your bluff. I remember what Bringhurst says about a sans companion to Bodoni. That's interesting! </p>
      <p>HZ says:</p>
      <p>"Optima was designed in 1952 ...... It is an alphabet design between a neo-classical roman (like Bodoni) and a sans serif (like Futura)."</p>
      <p>This is from his notes in the Grolier Club exhibit catalog "The Fine Art of Letters".</p>
      <p>Optima is also described as a serifless roman. Because of its contrast, it's a little of an outlier if included in the "Humanist Sans" category.</p>
      <p>Zapf's modern faces also have many of the aforementioned traits. In Marconi, Zapf Book, etc. etc. he reshapes the proportions of the Modern idiom to something more juicy, more calligraphic, with a little more proportional interest. So it's no surprise he sees Optima as a serifless version of what would be a "modern" face in his hands. </p>
      <p>I'm not going to argue about how to classify Optima. The reason is the very problem raised in this thread: What can you use with it? Again, stay inside the world of Zapf's faces and you're sure to find a suitable serifed companion. There are plenty. </p>
      <p>I think John Nolan's suggestions are excellent. Acanthus' italic would agree nicely with the new italics in Optima Nova.</p>
