    html: <p>Optima is very humanist in its modulation of stroke and perhaps also in the variation in the width of its caps. But it is much more like the 'modern' typefaces and geometric sans in having very wide bowls in its lower case. The more recent sans called 'humanist', following syntax, have oval bowls.</p>
