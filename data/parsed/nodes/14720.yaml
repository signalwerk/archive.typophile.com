      <p>Century Schoolbook + Optima???? </p>
      <p>Ahem. </p>
      <p>Yes, Optima in metal. I think the usefulness of Optima might be revitalized by the presence of so many new text weights in Optima Nova. The Regular, Medium and Demi could help relieve some of the wispiness, but the design is relentlessly vertical in its axis, which can give a sleepy texture at any weight.</p>
      <p>Zapf has described Optima as a serifless Modern face, which implies that Bodoni would be a good companion, but the proportions are so different from most Moderns that I would expect to reject a pile of them before you found one that worked. Still, it's worth a try, if you think the text can withstand it.</p>
