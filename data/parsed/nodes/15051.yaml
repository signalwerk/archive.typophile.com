    html: |-
      <p>This is pretty cool, especially some of the caps. But are you sure you want to make the UC [that much] darker? And I think the ascenders should either be exactly cap height, or they should be a full "notch" higher. I myself would go with the latter, as I think it would give the face some added elegance too, which would be refreshing.</p>
      <p>f: Your original form has the problem of "E"-confusion, and it looks like it's leaning backwards. You don't think just the form with no serifs at the bottom makes great sense?<br>
      g: I wonder if you couldn't do <cite>something</cite> with it...<br>
      i: I might try removing the half-serif, to somewhat relieve paragraph texture of all those top-left half-serifs.<br>
      j: Make the tail terminal much stronger.<br>
      k: Either move the right half-serif to the bottom, or make the leg stronger than the arm (maybe by raising the joint height).<br>
      s: I would try putting the weight in the (horizontal) spine, taking it away from the top-left and bottom-right sidewalls.<br>
      t: I would make it wider (on the right). This would prevent the bottom looking like a half-serif.<br>
      u: Maybe move the half-serif from the top-left to the bottom-right.<br>
      v, w, y: You sure you want half-serifs at the top-rights?<br>
      x: I'd give half-serifs to the top-left and bottom-right only.<br>
      eszet: I might dump the nick. And maybe make the bottom bowl wider.<br>
      B: Narrower top?<br>
      D: Killer.<br>
      E: Shorter top bar.<br>
      F: Wider.<br>
      J: Love the nick, but maybe give the bottom a diagonal finish, or even an angled stroke, to help recognition.<br>
      K: Same as in the lc.<br>
      L: Shorter up-serif. Wider.<br>
      N: Very nice.<br>
      Q: No go. Maybe a stub coming straight down from the right wall?<br>
      T: Wider.<br>
      V, W, Y, X: Same as above. And the slant in the "X" join doesn't work for me. But the "Y" is super.<br>
      Z: Too much like a "2".<br>
      &amp;: No go.<br>
      Nums: I like your originals - I'd just dump the serif on the "2". And make the "7" wider. Plus the one needs a straight beak.<br>
      ?: I wonder if you couldn't do something special with it.<br>
      Euro: Love it!!<br>
      Registered/Copyright: It would be nice if you could make the former [relatively] smaller.</p>
      <p>I can see this selling; the texture is compelling.</p>
      <p>hhp</p>
