      <p>I've got a thing about this Russian Constructivist style… a lot of fonts billed as "Russian Constructivist" were actually made in <em>fin-de-siècle</em> Germany. (The basic model for this face included).</p>
      <p>My theory, which I need to investigate, is this: these forward-thinking German Display Faces were not really accepted or used in Germany at the time. People tended more toward organic art nouveau things. Then during and after World War I, a lot of display work moved (back?) into solid calligraphic blackletter styles, a la Rudolf Koch.</p>
      <p>But German typefoundries did big buisness with printers in Czarist Russia. Somehow, these types must have gotten to Russia <strong>before</strong> the revolution (because international trade shut down after it…). I suspect that, when the Bolsheviks took over, things kept being printed in typefaces that were on hand. It must have taken a while for new "Soviet" types to be cast.</p>
      <p>Or maybe Russian designers and typefounders just copied and changed similar European designs? Perhaps it wasn't so commercial. But I still think it is pre-revolution.</p>
      <p>By the 1930s, I think that what a lot of what westerners typically think of as "Russian Constructivist" was gone. I think that the Stalinist regime had other ideas of what Soviet design should look like. But I can't speak with any authority on Russian typography. Paul? Anybody?</p>
