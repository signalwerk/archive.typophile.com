    date_raw: 11 September 2005 - 10:10am
    votes: 0
    html: |-
      <p>Interesting effort--this can be a unique look. My feeling is that it doesn't quite 'click' yet as far as the relative weights of the horizontal and vertical strokes, and as far as the widths--too narrow in the lower case. On the weight, I suspect the horizontal and vertical should have less contrast. </p>
      <p>On the serifs on diagonal letters, I think the exit strokes on the caps work, but not the lower case. It should be possible to space them without right serifs because this kind of thing is on some traditional serifed italics. Kerning probably very needed. On the x, you could try the serif on the exit lower right instead of upper right. </p>
      <p>The diagonal cuts on the stem of the D look good, but out of place. In think it would be better either made to conform with the rest, or change others to conform with it.</p>
      <p>The bottom of the S looks squashed; I would make it more like the lower case s. The join of the P bowl at the bottom is too low, it threatens to become a D. Should the cap X have serifs on the bottom too? Right bottom of N distracting. K too wide? M not wide enough? Serif on the lower E bar looks way too heavy. The one serif on the H looks lonely, it needs bottom right or all four, maybe. </p>
      <p>The lc e might look better wider. I think when you divide the letter &amp; have the smaller counters it needs width for balance. </p>
      <p>Overall, I think this is very promising, but needs a lot of work on relative width of characters and weight of strokes and where to put serifs &amp; their length to look really balanced and good. Varying more the widths of characters and lengths of serifs will eventually get everything to look more optically uniform and balanced. Being more physically uniform will always look awkward. </p>
      <p>Because it is a good concept, it demands a lot of work to bring it to its full potential. You will see new things every day for months, and then it will be what you want. </p>
      <p>Good luck!</p>
