      <p>The Russian Avant Garde movement with Rodchenko, Malevich, and El Lizzitsky, et al., with Supremacists bloomed in the early revolutionary time.  There was also interaction with the Dutch De Stihl.  Stalin wasn't a fan of many of these guys (I think he thought them to be too intellectual for the "worker" and pushed for a national worker style. The Bauhaus people were fans however and you can see the relationship. To me, this was a design culture which blurred national borders.  Later, Stalin kibashed the Russian avant garde and Hitler in time did the same to the Bauhaus gang.  Nationalism triumphed over the young cutting edge designers. Later, the Basel folks "rediscovered" El Lizzitsky and Rodchenko and their typography reflected that. The so-called "New Wave" designers of the 80's grew out of this extension with designers like Dan Friedman and April Greiman.</p>
      <p>ChrisL</p>
