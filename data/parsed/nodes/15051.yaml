    <p>Hello everyone. I'm working on a semi-serif display face, which is currently unnamed. My working title is "Teutonia Serif", because the letterforms are in part based on Teutonia, a geometric display face that was cut in Offenbach by the Roos &amp; Junge type foundry in 1902.</p>
    <p>I'd love to hear any feedback that anyone here might have.</p>
