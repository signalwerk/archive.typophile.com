      <p>Dan, it's progressing well. I don't think the upper case is too heavy; in the current state it's working better than the lower case. The whole design is going to be very assertive because of its squareness, so I would say just go with it. </p>
      <p>My only current problems with the upper case letter forms as far as balance are the vertical serifs on the bottom of the E and L, and the horizontal serif on the T. The vertical serifs look to heavy. I would thin them slightly. I think they can be subtly thinner than the other verticals, because they are serifs. The T starts to read as an I, which is distracting. Your F doesn't have a foot serif, and I suspect the T will do fine without it. </p>
      <p>On the lower case, I think the basic forms are good now. The vertical serifs on the c and r might be thinned slightly like the E and L on the upper case. or maybe only the c serif. </p>
      <p>The striking thing is that now the lower case, while wider has way too much 'dazzle'in the smaller size. Currently there is an optical illusion of the corners having hairlines shooting from them, which is surprising. I suspect this has to do with the weight of it --did you increase the weight? --but particularly with too tight spacing.  </p>
      <p>I think you have a lot of spacing issues, on both the upper and lower case, but it's affecting the lower case most. On the upper case alphabet, for example, the HIJ look much tighter than your MON. You might have to adjust your serifs, like the top of the J in order to get everything to work. </p>
      <p>My suspicion is that the lower case would be better lighter, but mainly with looser spacing. I guess you need to figure what is the minimum size you want this used at, and then work on it accordingly. Again the spacing on the lower case is quite uneven. For example in the alphabet the nop are much looser than the lmn. I would loosen the latter rather than tighten the former, because of the dazzle issue, but basically see what works.</p>
      <p>I think at this point working on the spacing is key, because that will also tell you what letter forms or weights you need to modify as well. </p>
      <p>So overall, I think you have the basic letter forms down pretty well, and the issue is spacing and color--both the overall darkness, and  particular the issue of evenness. </p>
      <p>On evenness, is your eszett too dark on the top? Maybe try thinning the left vertical slightly, and the diagonal? The thing is, to get evenness of color--and I think that it the main challenge at this point--you will probably need to vary the width of stems slightly, as well as respace. For example the B stem is often thinned slightly. Playing around with this kind of stuff and getting right will make  this design 'itself' and polished. </p>
      <p>One thing you might think about to get the direction is what this will be used for. Sports? Bands? That mood might help guide you in finishing it.</p>
