  html: |-
    <p>Howdy all, love the site. I am a huge fan of both typography AND Drupal, so this is like a little slice of heaven for me… right! on to it:</p>
    <p>M$ just revealed another piece of potential vaporware dubbed Project Natal. Who cares? Well, check out the typeface used in the presentation. I could swear I’ve seen it before, but I am stumped. Please feel free to laugh and point. </p>
    <p>If you know it, spill the beans! I think it’s pretty hot in an awkward sort of way.</p><div class="imageWrap"><img src="/files/proj-natal-typeface_3949.png"></div><p></p>
