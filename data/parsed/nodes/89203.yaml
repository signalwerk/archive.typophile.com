    html: |-
      <p>If the files are physically damaged -- say, part of them are missing or overwritten with random garbage -- it's virtually impossible to "repair" them. Even getting to find out what's wrong with them is difficult for a pro, let along having to <em>guess</em> what there was in the first place.</p>
      <p>Have your original bill ready and contact your font supplier for replacement files.</p>
