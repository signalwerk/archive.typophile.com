    <p>Hi all.</p>
    <p>I recently suffered a computer failure. :(<br>
    I lost a few fonts I'm having to replace. Thankfully I was able to retrieve a very valuable font to me. But somehow they got slightly damaged. Certain fonts in the <em>Interstate</em> family lost their proper name/file info. They all install, but don't show up.<br>
    For instance, installing Regular shows up as regular. Installing Regular Italic doesn't show up at all, but is listed in the fonts folder in C:\Windows\Fonts.<br>
    I want them to be properly named again. Could anybody do this or teach me how to fix this error? I have no idea where to start.</p>
