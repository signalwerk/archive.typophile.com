    html: |-
      <p>I agree with adnik the logo conjures up the image of a fat butt squeezed into an uncompromising space. This is maybe true for many taking up yoga initially, but I am sure the overall projected image should be what those going to yoga aspire to. Fit, sleek, this doesnt necessarily mean slim, but always well formed. </p>
      <p>Remember this is more than typography this is branding, Stefan hit on another good point, the baseline for clothing branding is people have got to want to wear the brand, be seen wearing the brand, want to buy the brand and want to show off the brand. This is the premise clothing brands are built on, and when you have a particular focus like yoga pants, or indeed yoga, there is an aesthetic to aspire to. As a designer this is your target, to build, with what you create, as asset for your client.</p>
