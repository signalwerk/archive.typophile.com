    html: |-
      <p>Hi, this is a fascinating topic!</p>
      <p>Unfortunately, only after the advent of machine cut letters into stone can one really begin to talk about “typography” in stone carving.</p>
      <p>Typography is the setting of text in a particular medium. Typefaces are families of characters that can be set by the user in any combination. Today, when machines cut stone, they use “fonts” just like everyone else. But before this, stones were lettered… the stone carver would draw each letter on the stone by hand before he cut it. This is not typography!</p>
      <p>Just because something isn’t typography does not mean that it cannot be good!</p>
      <p>But when you look at old stones, you are looking at lettering, not typography.</p>
      <p>Now, lettering has always influenced typography, and vice versa. John Baskerville was a stone cutter before he started making type and printing books. And a lot of 19th century grave stones use letter designs that look a lot like Bodoni’s typefaces. But you can’t say, “that grave stone over there is set in Bodoni” because, actually, it isn’t typeset in anything.</p>
      <p>There are A TON of digital typefaces that are inspired by the old lettering that can be found on stone monuments. A few typefaces by <a href="/wiki/Storm%252BType%252BFoundry" class="wiki">Storm Type Foundry</a> come to mind, as does (of course…) Adobe’s <a href="/wiki/Trajan" class="wiki">Trajan</a>. There are many more. Try some keywords at MyFonts.com. I’m sure more typophiles will posts ideas here, too.</p>
      <p>Today, of course, you can have your gravestone set in a condensed Times New Roman, but I wouldn’t recommend it ;-)</p>
      <p>Thankfully, there are still a few real stone carvers in the world who make beautiful hand-lettered monuments. Most of them work in New England or the UK, as far as I can tell.</p>
