      <p>Dan is of course right about the terminology - something too often overlooked by many who should know better*. And yes, there are so many interesting things to glean from epigraphy, like how common the open-bottom binocular “g” was. One person who knows a lot specifically about gravestone lettering is Matthew Carter - he’s given talks about the topic, with an emphasis on a particular burial ground in Boston notable for its age and for the fact that the stone used is slate: very brittle, but highly resistant to the ravages of time. BTW, I think that’s the one I must have briefly visited (by sheer luck, actually) during my recent trip - it’s called Copp’s Hill. As soon as I walked in I realized it was hopeless: I would need to dedicate an entire day, or maybe even two (preferably with a mini-tripod) to do it justice.</p>
      <p>* Leading to things like writing in the air with a lightbulb being<br>
      called a “font”... True story - it happened on Typographica a while back.</p>
      <p>&gt; John Baskerville was a stone cutter</p>
      <p>Actually, a calligrapher (although not in the usual contemporary sense).</p>
      <p>hhp</p>
