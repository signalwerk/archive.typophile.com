      <p>I bought (2years ago) an Epson EPL6100PS it’s a4 and main specs are as follows: (pasted from Epson website)<br>
          * Print Speed of up to 16ppm<br>
          * Resolution of up to 1200dpi<br>
          * First page out in 15 seconds<br>
          * Standard USB 1.1 and IEEE 1284 parallel interfaces<br>
          * 200MHz High Performance Processor<br>
          * Standard 8MB memory upgradeable to up to 136MB<br>
          * Flexible paper handling: 250 sheet paper cassette<br>
          * EPL-6100PS - Standard unit plus Adobe® PostScript® 3™ and a total of 40MB RAM.</p>
      <p>I don’t know if Epson do an up-to-date version of this printer but it’s well worth a look if they do as this one has lasted me well and I can’t fault it on anything. It’s easy to maintain and couldn’t be simpler to replace toner etc. Oh and most importantly it’d fit your budget too!</p>
