    date: 2005-08-12T16:15:00
    date_raw: 12.Aug.2005 4.15pm
    votes: null
    html: <p>We had this discussion not too long ago, and I ended up buying an HP 1320. I think it is more flexible with regards to stock, and also has a built in duplexer. However, and for whatever technical reasons, I find that the quality of the output suffers noticeable when using the duplexer. So when quality counts, I still do manual duplexing. I would say that it renders text quite well at its best quality setting. Its graphics printing is probably average for a 1200dpi laser printer. I do not know whether I would recommend this or not, since I haven’t directly compared its output to other similarly priced printers. The one Ed bought seems to be a better value overall, especially if you can get the Samsung on sale.</p>
