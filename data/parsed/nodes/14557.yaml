    <p>i’m looking for a postcript laser printer to use with my powerbook for printing proofs of my college work, and other projects. i don’t really know where to start though! had a browse of a mac specialist site i’ve used for other purchases, but there were at least 50 different models to choose between.</p>
    <p>we do have printers at college, but only 4, and they’re shared between the entire graphics department (a good few hundred, there’s 55 in my pathway alone). plus it’s not open during the holidays, which doesn’t help. so rather than queue for an hour or so i think it’s time to take the plunge and fork out the money.</p>
    <p>i’m on a typo/graphic pathway, so something that deals with type quite nicely would be good.<br>
    and also, preferably something that can deal with fairly thick stock (up to 200gsm).<br>
    my budget isn’t that great, £200 or £300 max, as i’m a student...<br>
    oh, and something that works well on mac os X would be handy too!</p>
    <p>thanks...</p>
