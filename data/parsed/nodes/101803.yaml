      <p>I have a similar problem.<br>
      Nearly always, when I BOLD some Arial text in Microsoft Word, the text jumps a point or two higher than the baseline.  I am using Word 2007 with Windows XP Professional. Our IT man, who uses Word 2010 on Windows 7, has the same problem using Arial text in Word.</p><div class="imageWrap"><img src="http://typophile.com/files/screen-grab_4877.gif"></div><br>
      I'd prefer not to switch to another font, because Arial has a nice high x-height and is very easy to read. Can you advise?<p></p>
