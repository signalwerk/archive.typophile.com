    html: |-
      <p>I checked the PDF posted for the one on the left and it is indeed “New Gothic BT Bold” and “News Gothic BT Light”.</p>
      <p>For the one on the right...</p>
      <p>The “Q” is way off which leads me to believe it’s not “TheSans”.</p>
      <p>If I had to guess I’d bet it was <a href="http://www.fontshop.com/fonts/downloads/creative_alliance/myriad_pro_virtual/">Myriad Pro</a> or <a href="http://www.fontshop.com/fonts/downloads/creative_alliance/myriad_semi_condensed_pro_virtual/">Myriad Pro Semi Condensed</a>.</p>
      <p>The letters and numbers match and the “Q” is much better. However, still something isn’t right with the “e”... maybe they customized that one letter?</p>
