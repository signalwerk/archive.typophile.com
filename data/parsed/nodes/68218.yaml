    html: |-
      <p>the client has absolutely no other source images to give me—so, no more characters, &amp; no higher res.</p>
      <p>upon reflection, i feel like an idiot for suggesting andale mono. ugh. i was really tired that night.</p>
      <p>[&amp; yeah, i meant bitmap as in all i have to work with is that tiny raster image. i don’t know how you can get somebody to design a logo for you &amp; not keep the source files...but, whatever.]</p>
      <p>i tried absara sans, a&amp;s sign gothic, &amp; adobe pi std to no avail.</p>
      <p>absara sans is the closest i’ve gotten so far, but the bottom &amp; top of the D bulge too much, &amp; the S still seems subtly off. the U &amp; O is too wide too. any other ideas of fonts to try? i really want to avoid having to actually modify the letterforms’s paths in illustrator...that could easily lead to a night of being compulsive that i...am not really in the mood for at the moment.</p>
      <p>i’m attaching a screenshot of my current situation in illustrator [absara sans tf medium regular, 15 pt &amp; stretched horizontally a little.]:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/N7STUDIOS_absara-sans-med-reg-15pt_6597.png"></div><p></p>
