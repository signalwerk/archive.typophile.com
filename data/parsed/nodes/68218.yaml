    <p>source, which i’ve also included as an attachment: <a href="http://i43.tinypic.com/4ru5id.jpg" title="http://i43.tinypic.com/4ru5id.jpg">http://i43.tinypic.com/4ru5id.jpg</a></p>
    <p>can anybody ID this font, or something that looks extremely similar to it? it’s like andale mono, but the corners seem a little more curved &amp; i think the weight’s different.</p>
    <p>i have a client who wants me to vectorize his tiny bitmap source, &amp; he is no longer in touch with the original designer &amp; has no larger source image.</p>
    <p>[i tried to ID it using whatthefont, but the source is too small to yield much in the way of accurate results.]</p>
