    html: <p>Ha! Intriguing. As a counter-example, Gary Hustwit, in his film <em>Helvetica</em>, briefly focuses on some NYC subway signage, attributing it to Vignelli (and, of course, implying that it's Helvetica). The plot thickens.</p>
