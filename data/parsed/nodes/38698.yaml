    <p>Hi folks,</p>
    <p>Thought this item might be of interest, since the typography on this 'authentic' NYC subway sign on eBay just looks wrong to me. It doesn't look like Helvetica; the spacing of the station name seems all wrong, and the odd positioning of the two small lines of text top right just seem clumsy. Tell me I'm wrong (and if I am wrong, don't go bidding against me!). Maybe some NYC subway signs do actually look this bad?</p>
    <p><a class="freelinking external" href="http://cgi.ebay.com/Authentic-NYC-Subway-Sign-42nd-Street-Not-a-repro_W0QQitemZ300166157792QQihZ020QQcategoryZ4152QQssPageNameZWDVWQQrdZ1QQcmdZViewItem" rel="nofollow">ebay subway sign</a></p>
    <p>All best,</p>
    <p>Matt aka Deltic</p>
