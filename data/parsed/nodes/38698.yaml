      <p><cite>It doesn’t look like Helvetica</cite></p>
      <p>I thought most of it is Standard Medium aka Akzidenz Grotesk – but then, I’ve never been to NY.</p>
      <p>In <a href="http://www.designobserver.com/archives/000218.html" rel="nofollow">his article for Design Observer</a>, Michael Bierut wrote:<br>
      <cite>Bob Noorda and Massimo Vignelli, developed a signage plan […] The typeface they recommended, the then-exotic, imported-from-Switzerland Helvetica Medium, was unavailable; they settled for something at hand in the New York City Metropolitan Transit Authority train shop called Standard Medium.</cite></p>
