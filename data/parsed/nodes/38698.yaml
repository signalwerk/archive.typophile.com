    html: <p>Ha! Intriguing. As a counter-example, Gary Hustwit, in his film <em>Helvetica</em>, briefly focuses on some NYC subway signage, attributing it to Vignelli (and, of course, implying that it's Helvetica). The plot thickens.</p>
  - id: 236788
    user_id: 110
    user_name: Bald Condensed
    user_path: null
    user_image: /files/pictures/picture-110.png
    date_raw: 1 Nov 2007 — 9:26am
    date: 2007-11-01T09:26:00
    votes: null
    html: <p>What happened is that -- although originally all signage was done in Standard Medium which is a 'version' of Akzidenz-Grotesk -- subsequently they switched to Helvetica for the signs. So originally it was all Akzidenz-Grotesk, but now there's also a lot of Helvetica.</p>
