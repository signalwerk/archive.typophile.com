    <p>Hello! I have a somewhat technical font question and I was told this website would be a good place to ask. I also posted this question in the Hebrew typeface board, but noticed that the board's latest post was two weeks ago, so I decided to post here too.</p>
    <p>I've just begun to work with my university's student run TV station. I got an email from the graphics team leader with a supposedly all-encompassing list of the fonts available on the titling machine ( this list provided below). I noticed quickly that most of these are foreign fonts- arabic, thai, han, hebrew, etc. Only a few were roman character fonts. I responded telling her that most of those fonts aren't actually fit for our use, and was surprised at the discussion over which fonts people like more, Aharoni or David.</p>
    <p>It seems to me that typing English sentences under one of these fonts will result in the use of a generic font, since trying that out in many of these got me thin, non-smoothed, ugly fonts. I was confused though, by the fact that they all did look slightly different, and that the Hebrew fonts, in word, didn't work (trying to format normal text as Arabic just reverted back to the default Word font).</p>
    <p>Could someone explain exactly whether or not these fonts contain English character sets, and whether or not they're actually improper to use for English writing? I tried to do some research of my own but didn't find anything besides endless websites advertising foreign font downloads without explanation of their inner-workings.</p>
    <p>This is the list:<br>
    Cordia New, Cordia UPC, DilleniaUPC, Dotum, Dotum Che, EucrosiaUPC, FressiaUPC, Gulim, Gulim Che, Gungsuh, GungsuhChe, IrisUPC, JasmineUPC, KodchiangUPC, LilyUPC, MS Gothic, MS Mincho, MS PGothic, MS PMincho, MS UI Gothic, Microsoft Sans Serif, MingLiU, NSimSun, P Ming Liu, SimHei, SimSun, Simplified arabic, Simplified Arabic Fixed, Tahoma, Traditional Arabic, Verdana</p>
