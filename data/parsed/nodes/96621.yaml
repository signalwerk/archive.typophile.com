      <p>My personal opinion on a good subtitling font tends towards a slightly-condensed low-contrast slab serif, similar to Rockwell. Still, I think that Droid Sans or PT Sans might work. Both are available freely, by the way.</p>
      <p>Hmm... Computer Modern Concrete is a slab serif, and you school folk may already be familiar with it through Donald Knuth's other works. Plus, if there's a good Metafont hacker on hand, (s)he could very likely customise its weight and width for your specific needs.</p>
