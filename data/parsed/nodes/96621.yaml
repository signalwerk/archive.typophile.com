      <p>I'm pretty sure that all these fonts contain at least an ASCII Latin set and possibly a Win ANSI (CP 1252) set. It is Microsoft policy to include support for at least one full 8-bit Windows codepage in every font, regardless of the targeted script(s) for the font, and all of those codepages have an ASCII 7-bit set as their core. So, for example, the <a href="http://en.wikipedia.org/wiki/Windows-1255" rel="nofollow">Windows Hebrew codepage (CP 1255)</a><a> has Latin characters and symbols in the lower half, and Hebrew characters in the upper half.</a></p>
      <p>This isn't a functional requirement for most modern software, i.e. it is possible to make a font that contains only particular Unicode characters, not a full 8-bit codepage, which will work correctly in most places. But for backwards compatibility reasons it is still recommended to support at least one 8-bit codepage, and Microsoft do so even in fonts targeting scripts that never had their own Windows codepages defined. Such fonts usually contain the Win ANSI (CP 1252) set.</p>
      <p>In many cases, as you have noted, the Latin inclusion in the fonts is 'generic' or, rather, will tend to be one of the core Windows fonts such as Times New Roman or Arial. Sometimes the Latin is scaled to better harmonise with the target script.</p>
      <p>I would not use any of the fonts you list for setting Latin script text, since the same designs exist in fonts that probably support them more fully, e.g. with better kerning or additional characters.</p>
      <p>Note that a few of the MS fonts targeting particular scripts have custom designed Latin inclusions that harmonise with the target script. Examples are 'Arabic Typesetting' and 'Nyala' (Ethiopic). These Latin designs are not accessible outside of those fonts, so they are sometimes used to typeset English and other Latin script languages. However, their character sets and language coverage is more limited than for most Latin script fonts on Windows, since they aim only to support one or two 8-bit codepages, and they only exist in one weight and style.</p>
