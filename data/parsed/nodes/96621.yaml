      <p>{Copying my reply from your other post.}</p>
      <p>Many Latin components of non-Latin fonts are illegitimate and/or low-quality. Except for "official" ones (like the ones that come with Windows) which are however usually very generic, hence do not match the non-Latin in style (and are rarely highly usable just for Latin anyway).</p>
      <p>It sounds like you need some real (and non-OS) fonts. But do you do a fair amount of non-Latin as well?</p>
      <p>BTW make sure laymen don't get to choose which fonts to use - that's what designers are for.</p>
      <p>hhp</p>
