    <p>I'll cut right to the chase: I'm to write an academic paper that covers any topic related to lead type in general. Since we're encouraged to research a topic that we know little to nothing about, I thought it would be interesting to delve into the relationship between digital and foundry type, or more specifically, typefaces that were born in the digital and brought to metal post-issue. </p>
    <p>The closest that I can find would be our dear friend Jim's <a class="freelinking external" href="http://new.myfonts.com/fonts/rimmer/stern/" rel="nofollow">Stern</a>, which was simultaneously issued in both metal and digital forms. </p>
    <p>So this might be a stretch—given that the skills for producing metal type are anything but common in this age—but is anyone familiar with any such faces or the process that goes into the conversion?</p>
