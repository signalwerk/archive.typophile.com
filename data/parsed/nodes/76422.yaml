      <p>Hi Peter,</p>
      <p>As the lucky bastard who acquired Jim Rimmer's typecasting equipment, I'm currently beginning work on two types that I've drawn digitally which will eventually be cut and cast in metal. My process will be somewhat different than the one Jim used, but will make use of all of the machines and tools Jim utilized in the development of a new metal face, with the exception of Ikarus (used for digitizing drawings - I'll be working directly from digitally-drawn outlines).</p>
      <p>There are likely more folks out there with the ability to make new metal types than you might think, but many (perhaps most) of them are busy casting type from Monotype/Linotype/Ludlow matrices, rather than cutting new mats for new faces. Micah Courier (at the Dale Guild) is working on cutting new mats, but I think only to replace those that are missing/damaged from the Guild's collection.</p>
      <p>One has to consider the precision required for the production of a metal face. On screen, to adjust the fitting of a new type is simply a matter of shoving the side-bearings in Fontlab. Need to make a glyph a bit darker? No problem at all digitally. In metal, though, this would mean cutting a new matrix. You also have depth-of-drive to worry about, to be sure your type will be exactly .918". Then there's kerns to worry about. Let alone the process of making a matrix that will actually fit/work in whatever kind of caster you're working with.</p>
      <p>As an opener, I'd recommend you get your hands on Jim's book, <em>Memories from the Cutting Room Floor</em> (which is the trade edition of Jim's limited edition <em>Leaves from the Pie Tree</em>); this book walks step by step through Jim's process.</p>
      <p>Then, of course, there's Rich Kegler's nearly-completed documentary on Jim's process, <em>Making Faces</em>: <a href="http://makingfacesfilm.blogspot.com/" target="_blank" rel="nofollow">http://makingfacesfilm.blogspot.com/</a></p>
      <p>Beyond all of this, I'd be happy to tell you a bit more about the process I'll be using, but starting with Jim's book and Rich's film is likely your best approach.</p>
