      <p>Dan Carr at Golgonooza Press is another who, like Jim (R.I.P.), is comfortable in both metal and digital realms. He has cut both metal and digital fonts. But I don't know that he has ever translated a digital design into metal. I believe he prefers to work directly and let the material suggest the form. </p>
      <p>I seem to recall Sumner Stone saying just last week that the late Gerald Giampa actually cut a metal version of his Stone Serif. But maybe that was only a few letters and not a complete font. </p>
      <p>Jason -- I wondered what became of Jim's equipment. You lucky dog. I'm glad it all wound up in good, appreciative hands.</p>
