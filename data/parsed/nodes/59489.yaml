      <p>With the release of Firefox 3.5, don't we effectively already have font linking/embedding, since every major browser now has some kind of support? - All it requires is a couple of lines of code to determine whether the browser is IE or other: if so use EOT font, otherwise use TTF/OTF. [Either do this yourself or get a service like <em>TypeKit</em> to do it for you]. </p>
      <p>Haven't we lost the plot? Shouldn't we be talking about the licensing model not the format? In the long run, is any web-only font format going to be any more effective at "protecting" fonts than various digital audio formats have been at "protecting" music? If there was going to be a special font format as standard for the web, shouldn't that have been sorted out *years* ago? </p>
      <p>Unlicensed use of fonts on the internet should be *far* easier to police than unlicensed use of fonts in printed publications as you can devise a bot to search for them. Isn't it going to be much easier to search for and find sites using your fonts (legally or illegally) where the original un-obfuscated, un-subsetted fonts are being used? </p>
      <p>No reputable commercial site is going to use unlicensed fonts - and those are the people who will actually pay for fonts. Won't the increased licensing fees for use of fonts on these sites far outweigh decreased sales (if any) from increased piracy?</p>
      <p>- C</p>
