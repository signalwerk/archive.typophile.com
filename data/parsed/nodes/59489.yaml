    html: |-
      <p>Richard Fink -- <cite>I’m still not getting it.</cite></p>
      <p>EOT, in the most simple case, is nothing but a wrapper around a TTF/OTF, more exactly a few header data which are followed by the actual TTF/OTF font data. (Font data <em>can</em> be compressed, or <em>can</em> be modestly obfuscated, but do not need to. Actually it would be easier especially for smaller foundries to do without these two options and just add the header.)<br>
      That certain browsers only support one flavor but not the other is hard to understand. If an issue, it is a browser issue rather than a font format issue. As simple as that.</p>
      <p>Christopher Fynn -- <cite>Haven’t we lost the plot?</cite></p>
      <p>Yes.<br>
      Since @font-face is not heavily used yet (is it used at all), it is not too late to agree on supporting only EOT rather than also TTF/OTF. It is be a clean solution, and with information given in the EOT header, services like TypeKit were mostly superfluous.<br>
      Discussions -- including on www-style and www-font list -- do not make any sense to me. The funny thing is that my own position has changed thanks to said discussions. Before, I was all for plain TTF/OTF. But web guys' "for free" and "-anti" ideology and fabricated arguments showed me how they tick.<br>
      The point is that EOT's header info expressly states who may use the font (by URL info as well as by EOT "format" itself which tells a OS "that's not for you") -- which additional information prevents abuse in the first place. No need for policing which I am not particularly fond of.</p>
      <p>In so far, I welcome the new proposal.</p>
