      <p><cite>Wouldnt CFF fonts look like garbage on the web, since they lack TT hinting?</cite></p>
      <p>That will depend on the font and operating system. Lighter weights of sans fonts work pretty well on Mac OS, but bold weights render poorly at small sizes. Hinting will be the next big stumbling block for web fonts: designers are going to go up in arms when they realize how bad the fonts look and blame font designers, but they won’t want to pay for well-hinted screen fonts because so few exist that there’s really no baseline for what they should cost. On the upside, I think many experienced web designers learned to think about legibility issues when nobody could read all those eight-pixel bitmap fonts that were hot in Flash sites a few years back, so hopefully we won’t have to live through two years of godawful unhinted serif faces.</p>
