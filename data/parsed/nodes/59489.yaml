    html: |-
      <p>I don't know if this is helpful as bricks/mortar vs virtual and often not fair analogies: Let's say you two tool stores.</p>
      <p>Tool store A has only one employee, an inattentive cashier with poor eyesight. The tools have price tags on them.</p>
      <p>Tool store B doesn't use price tags and they leave all the tools out on the sidewalk.</p>
      <p>It's fairly easy to steal from store A but only certain kinds of people would do that. They would use the tools with the full knowledge that they are stolen tools. In this example, the </p>
      <p>It's just as easy to pick up tools from the sidewalk in front of Store B. Some people would assume that they're supposed to be free. There's no price tag and they're just sitting there. They might assume that it's okay to use those tools since they're not stolen . . . they were sort of found. Some people would assume the unmarked sidewalk tools belong to a store, some wouldn't.</p>
      <p>The tools are fonts. The price tag is the EULA. I'm not saying piracy and stealing are the same thing; they're not. If somebody deliberaately took an drill from Store A without paying, we'd call them a shoplifter. If someone spotted a drill on the sidewalk with no price tag and picked it up we wouldn't call them a shoplifter.</p>
      <p>So it's not about how many paying customers are lost to piracy. That's not the issue. Piracy can't be stopped. If people want to pirate fonts, they can pirate fonts. If you bring that into it, you're clouding the real issue which is: the difference between Store A and Store B. It's not just about how easy it is to get at the fonts. It's about the difference between having to defeat security using a font ripper browser plugin or just straight downloading from a URL.</p>
      <p>The EULA, to me is very important. Whatever embedding solutions people come up with, that's the most important factor to me. At the very least, I deserve to be protected by a liability disclaimer, no?</p>
