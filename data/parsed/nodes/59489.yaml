    html: |-
      <p>"the difference between Store A and Store B"</p>
      <p>B&amp;M analogies aren't always ideal, but yours is pretty good. However, if I may, I think to fully equate the analogy to web fonts, we need a C option:</p>
      <p>store A) commercial tools, but easy to shoplift if one desires. It's also very easy to legitimately purchase quickly and efficiently for those that like to buy their products legitimately. </p>
      <p>store B) commercial tools, but difficult to shoplift if one desires. It's also a bit of a pain to purchase products as there are long lines, crowded parking, and that really annoying person that insists that they look in your card and put a smiley face on the receipt before you can leave since they don't trust any of their customers. </p>
      <p>free bin C) commercial tools that have been left in boxes out behind the abandoned warehouse for anyone to take that wants them. </p>
      <p>I think those into getting software for free for the sake of getting it for free are fully aware of location C and use that most of the time (.ru sites, any number of newsgroups or bittorrent trackers, private file sharing groups, sendspace/yousendit/megadownload/etc). Some of these folks, if they can't find the tool they want at option C will go into store A and sneak it out in their coat. </p>
      <p>Which leaves the question: What if Store A didn't exist? What would that group of people do if option C didn't have what they want? I see a few scenarios:</p>
      <p>1) They'd decide that it's not worth the effort to steal from store B and do nothing.</p>
      <p>2) They'd be determined to get it anyways and do what it takes to lift it from store B.</p>
      <p>3) They'd decide to pay money legitimately at store B.</p>
      <p>What percentage of people that rarely if ever pay for fonts would fit into each of those 3 groups? I don't know. Does getting rid of option A turn off some legitimate purchasers who no longer will bother as they don't want to deal with the hassle of store B? I don't know that either.</p>
      <p>"It’s about the difference between having to defeat security using a font ripper browser plugin or just straight downloading from a URL."</p>
      <p>IMHO, I don't see a real difference there. In fact, I imagine the 'font ripper' plugin would ultimately be easier to use ('STEAL ANY FONTS ON THIS SITE' one click vs. VIEW SOURCE -&gt; Find CSS URL -&gt; View CSS -&gt; find @font-face path -&gt; Download font).</p>
      <p>Aside from all of that, I do agree that a consensus needs to be formed sooner than later. Something that the type community can present to the W3C as their own proposal as a group.</p>
