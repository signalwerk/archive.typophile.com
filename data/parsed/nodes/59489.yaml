      <p>abattis —  <em>"I don’t think so, no, and it seems almost no one does."</em></p>
      <p>Since the advent of the <code>alt.fonts.binary</code> group on Usenet, and now with peer-to-peer file sharing, unlicensed copies of almost every digital font have been easy enough for people to obtain without paying for them. On the internet at least, substantial font piracy may be older than music piracy. It's hard to imagine how TTF / OTF embedding could make the situation substantially any worse.  </p>
      <p>People who now pay for commercial fonts will continue to pay for them. Those who don't want to pay for commercial fonts, and think they can get away using them without paying, will continue to do so - though using an unlicensed font on a web site would be pretty stupid since it is so likely you'll get found out. A few people will link/embed only FOSS fonts - and that number may grow if commercial vendors continue not to license fonts for web use, or if licensing fees are felt to be too high.</p>
      <p>- C</p>
