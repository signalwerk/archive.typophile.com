    html: |-
      <p><cite>Wouldnt CFF fonts look like garbage on the web, since they lack TT hinting?</cite></p>
      <p>On Mac OS using the system rasterizer, hinting is irrelevant or nearly so.</p>
      <p>ClearType is capable of working very nicely with CFF OpenType, as demonstrated by the WPF rasterizer for CFF. But this is hardly mainstream, I guess.</p>
      <p><cite>As web fonts take off, is it worth it to try and convince designers to make TTF-flavored OT, with delta hints?</cite></p>
      <p>Delta hints are not of much interest for web fonts any more, because most are ignored by ClearType, and all are irgnored by the Mac OS rasterizer. At least, that's my impression. (With the possible exception in ClearType of deltas on Y-direction CVTs rather than directly on points, which could increase x-height at some key sizes or the like.)</p>
      <p>I could be mistaken about the degree of uselessness of delta hints, and am open to being corrected.</p>
      <p>Note also that regular GDI ClearType is turned on in IE 6 and higher, even when not on at the OS level. </p>
      <p>Regards,</p>
      <p>T</p>
