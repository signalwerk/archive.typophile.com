      <p>&gt;I could be mistaken about the degree of uselessness of delta hints, and am open to being corrected.</p>
      <p>Both Windows and Mac ignore x hints but not y. Delta instructions are ignored on the Mac. Windows only ignores them if they are 'out of line.'  But since deltas can be used in the places other than glyph instructions and in ways other than to disturb the priceless rendering of ClearType, they are neither totally useless nor completely ignored. </p>
      <p>Both of these OS have fallen qualitatively behind places like Pre and soon, some other vendors who use FreeType. </p>
      <p>&gt;Wouldnt CFF fonts look like garbage on the web, since they lack TT hinting?<br>
      Most will. But the true garbage time comes when people start using fonts that are not as robust as the few they have now, i.e. hints wouldn't even help. </p>
      <p>Cheers!</p>
