    <p>Hello!</p>
    <p>I navigated my way over to <a href="http://thedecoderring.com" title="http://thedecoderring.com">http://thedecoderring.com</a> to see what The Decoder Ring Design Concern had crackin' and noticed this HUGE "HELLO!" Here's my question: is there an easy way to do the 3D letter thing? I know that it's possible to do in Illustrator with the 3D "tool", but the type isn't forward facing anymore. </p>
    <p>Help!</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/home_splash_3_4152.gif"></div><p></p>
