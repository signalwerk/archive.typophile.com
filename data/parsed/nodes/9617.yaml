    html: <p>a) try to define the design problem that you have to solve and your personal approach to it b) take a hot bath or a cold shower (depending on what kind of person you are) c) walk at least for 45 minutes (best without seeing any person) d) start with something (you know the final result will look totally different anyway)</p>
