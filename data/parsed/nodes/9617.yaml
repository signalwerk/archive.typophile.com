  html: <p>Hi everyone, I am currently stuck for fresh ideas and the deadline is racing towards me, does anyone have tips for getting the brain back in gear?</p>
  html_clean: <p>Hi everyone, I am currently stuck for fresh ideas and the deadline is racing towards me, does anyone have tips for getting the brain back in gear?</p>
comments:
  - id: 61429
    user: null
    date: null
    date_raw: null
    votes: null
    html: "<p>1. I take the project to a friend and talk through where I'm at. Often having to articulate the problem jars loose a solid or obvious idea I was having a hard time seeing. Or, their perspective gives me a fresh idea or perspective of my own. I find that sometimes this works best when the other person isn't a designer. <br> <br>2. Caffeine. <br> <br>3. Change the music I'm listening to. <br> <br>4. Go and read about a successful design project in a book/mag/website. Sometimes I'm not suffering from creative block, but creative fatigue and it helps to see a successful process and get excited and on track again. <br> <br>5. Stop. Look at what I'm doing. Do it <i>completely</i> differently. This includes things like what I'm looking at, computer vs. hand drawing, type vs. image, the application I'm in, being specific vs. being general, medium vs. message. <br> <br>Hope that helps. I just used #1 this weekend to much success.</p>"
