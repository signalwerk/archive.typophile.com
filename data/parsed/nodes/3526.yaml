  html: <p>I know. I admit it, Macintosh is all I use. I have a customer that wants to install a font. PC T1 <br> <br>I send it to him in a "zip file". <br> <br>What next? <br> <br>You can laugh as long as you give me straight goods. I thank you for your help in advance.</p>
comments:
  - id: 27144
    user: 799
    date: 2004-03-10T00:28:00
    date_raw: 10 Mar 2004 — 12:28am
    votes: null
    html: "<p>This is what Ive been told by PC owners: <br> <br>If you send it as an PS1 version the customer has to have ATM on his machine. <br> <br>If you send it as Truetype he can install it through the font installer found in the Control Panel. <br> <br></p>"
  - id: 27145
    user: 869
    date: 2004-03-10T01:30:00
    date_raw: 10 Mar 2004 — 1:30am
    votes: null
    html: "<p>I believe that Adibe's ATM Lite is required to use PS fonts in Windows 95, 98, and NT 4.0. PS support is built into Windows 2000 and higher (XP Home, XP Pro). <br> <br>You can get ATM lite for free here: <br> <br><a href=\"http://www.adobe.com/products/atmlight/main.html\" target=\"_blank\">http://www.adobe.com/products/atmlight/main.html</a> <br> <br></p>"
  - id: 27146
    user: 1275
    date: 2004-03-10T05:12:00
    date_raw: 10 Mar 2004 — 5:12am
    votes: null
    html: '<p>Many foundries websites describe Type 1 install on Windows. 3 examples: <br><a href="http://www.typofonderie.com/alphabets/technical/#windows" target="_blank">http://www.typofonderie.com/alphabets/technical/#windows</a> <br><a href="http://www.typography.com/support/install.html" target="_blank">http://www.typography.com/support/install.html</a> <br><a href="http://houseind.com/house.php?page=support" target="_blank">http://houseind.com/house.php?page=support</a> <br> <br>There is two ways to built Type 1 for PC: <br>Pfb and Pfm or Pfb, Afm, Inf <br> <br>Result is almost identical.</p>'
