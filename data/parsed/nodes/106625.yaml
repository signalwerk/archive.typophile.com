      <p>The magazine is a youth-orientated, political, current affairs and culture magazine. It has interviews with politicians, film reviews, investigative journalism and all that kind of stuff.</p>
      <p>Thanks <em>sevag</em> ... I really do like what Type Together offers, and some of their body fonts are absolutely wonderful. </p>
      <p>However: I think Tablet Gothic is too similar to Titling Gothic. I was hoping for something in the same realm, but not something which looks like it's been heavily inspired by Titling Gothic (I don't know the <em>actual</em> history of the font.)</p>
      <p>Are there any other display fonts that have as many styles and weights while also being a bit different? Maybe more "rounder" than Titling Gothic?</p>
      <p>Thanks for your help.</p>
