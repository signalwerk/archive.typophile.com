      <li>Before you pick your trim size, type size, and margins, look at <em>all</em> the poems in the book and see how long the longest lines are. You may not be able to avoid line breaks altogether, but design to avoid frequent line breaks.</li>
      <li>Pay careful attention to leading.</li>
      <li>Look at the lengths of the poems, and design your trim size and margins to avoid either excessively short pages or too many page breaks. When you do have a page break, put the break where it makes sense in the poem, not just where you run out of room.</li>
      <li>You'll have a lot of paper showing, so choose a good quality paper, off-white rather than bright white.</li>
      <li>Don't use running heads at all, and don't use folios (page numbers) unless the book is longer than 40-50 pages. Pages of poetry usually have a lot of white space, so running heads and folios are much more conspicuous--and distracting--than they are in books of prose. </li>
      <p>My first book design assignment was a book of poems. Good luck, and please post some sample pages here when you're done.</p>
