      <p>&gt; Why must academic books be 6” x 9” instead of 5.5” x 8.5?</p>
      <p>Because publishers charge a fortune for them, since adopted texts are a captive audience, and the larger size is a rationale they can use for the higher fee. (Like a unit price of 4.27 for the smaller size, and a unit price of 4.59 for the larger price justified selling the book for $40 more).</p>
      <p>Computer books in the 90s were other books that would sell at any price, and thus were overpriced. They also tended to be a slightly larger format.</p>
      <p>(I just got a book from the college bookstore yesterday for a course I am building. 1 inch thick (500+ pages) 9x12 hardcover format, and a price tag of $142.75 Canadian. Something tells me that the poetry book that this thread is about will cost closer to 10% of that.)</p>
