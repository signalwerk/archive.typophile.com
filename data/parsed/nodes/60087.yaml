      <p>I'll echo what Will said. Having also been involved in some of these "calculations" when I was Creative Director at Storey Publishing, I will say that there are a number of factors which make up the "arcana." </p>
      <p>Production economics are an important factor. Those being met, then design considerations and suitability to the content may come into play. But market expectations and trade considerations will also play a key part. (Even down to what will fit on the shelves in a particular section of a bookstore, as Will pointed out; some sections will have taller or shorter or deeper or shallower shelf sections -- think art books vs. fiction.)</p>
      <p>You could theoretically have the exact same book (same title, same content, same production costs and price point) but markedly different proportions -- say, one tall and slender, the other nearly squarish (remember, I did say "theoretically") -- and one will be deemed more sellable than the other.</p>
      <p>As with any design destined for the marketplace, there is a delicate dance to be found between going with the flow and standing out from the crowd.</p>
