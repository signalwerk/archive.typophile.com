      <p>I am sorry that you have to go back to the drawing board, for you have something really nice here. I'm pretty stodgy, but this does not seem "too experimental" to me.</p>
      <p>I had meant to post some comments when you posted the first sample on the 23rd, but I got too busy. So I'll give them here anyway.</p>
      <p>I really like the titles at the bottom, and the varying line lengths of the poems moving up. The undulation is very nice. I think I would have gone with italic for the poem titles. For some contrast, and to keep the idea of "flow" going.</p>
      <p>The folios bother me a bit. At the risk of getting too fussy, I might have looked at a light sans for them.</p>
      <p>In the poems on pages 11 and 12, how about tracking out the all-cap lines a bit? And then you'll need to adjust some pairs, such as RA to get even latter spacing throughout those poems.</p>
      <p>The horizontal poem looks fine. A nice jolt there.</p>
      <p>Type size and lead are fine; don't mess with them, especially differential leading among poems. The note at the first poem looks very nice; italic is right for that element. &amp; don't worry about show-through. Unless you print the thing on cover paper you'll always have some show through. And for this book (if this is the whole extent of it) you will want a nice, flexible book.</p>
      <p>As I say: I’m sorry to see you need to re-work this. We’ll be interested to see what you come up with.</p>
      <p>powers</p>
