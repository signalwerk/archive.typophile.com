      <p>Let me add a few things to Mojo's very sensible comments. </p>
      <p>PAGE SIZE is very often dictated by the publisher. Even publishers most sensitive to poetry will often tell designers what the page size is to be. Publishers have their own arcana on this matter, which they consult during séances. When the publisher tells the designer the page size it almost inevitably creates difficulties (OOOPS: I mean "challenges and opportunities") for the designer and/or compositor.</p>
      <p>PAPER is also often chosen by the production manager at the publishing house. If this book will be printed by a book printer, paper choice will be further limited by papers the printer keeps in stock. Few books of poetry will have sales enough to warrant a special order of paper. Mojo's right: natural or off-white is best.</p>
      <p>FOLIOS need to be discreet in size and placement. Head to the library and look at a lot of poetry books and folio placement. This can be a tough nut to crack with poetry books, thanks to the white space Mojo mentions.</p>
      <p>RUNNING HEADS cannot be automatically dismissed. A poetry anthology may require them. Even at times a book by a single author may require them. This may be more of an editorial call than a design call.</p>
      <p>Designing poetry books can be a lot of fun. In my current job I miss doing poetry. At times designers get lucky and end up collaborating with editors and poets, engaging them in discussion and showing alternate examples of settings. It often reduces the profit margin on design &amp; composition even further than its already low state. But you may find some excellent writing and you may make a pal of a poet who gets a good design. I'm eager to see what you come up with. Good luck; have fun.</p>
      <p>powers</p>
