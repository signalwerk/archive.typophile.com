      <p>&gt; Publishers have their own arcana on this matter, which they consult during séances. </p>
      <p>Ha, ha. However, for those who might not see this as a quip, I want to point out that the publishers dictate page size based on press specifications. If you add even a quarter inch in dimension to a page, you make it too large to be printed economically on a certain press. The result is that the job has to be printed 8 pages at time instead of 16, effectively doubling most of the production costs.</p>
      <p>It may seem like arcana if you don't know the procedure, but in fact it is simple math. And economics.</p>
