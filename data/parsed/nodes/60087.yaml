      <p>ravel said:<br>
      &gt;   Running text is set in 9 pt<br>
      &gt;   with generous leading at 12 pt,<br>
      &gt;   and titles in 14.56 pt.</p>
      <p>i'd use 10-point, or even 11-point, (or 10.7-point),<br>
      and still feel 12-point leading gives enough spacing.</p>
      <p>i also feel comfortable changing the leading of pieces.<br>
      so i'd go with a generous leading for most of the book,<br>
      and tighten it up only on the few pieces when needed.<br>
      (oftentimes i'll make sure the leading matches for the<br>
      two pieces that compose a facing-pages spread, but<br>
      i don't think readers notice a change between pages.<br>
      and even if they do, what difference does it make?<br>
      i've known poets who set every poem in its own font,<br>
      specifically chosen for it, and i liked that just fine, so<br>
      i see no problem with doing intelligent copy-fitting.)</p>
      <p>i'd also size the titles down, and count on bolding and<br>
      their separation/appearance to make their role clear...<br>
      that would give you a touch more room, when needed.</p>
