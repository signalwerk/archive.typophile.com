      <p>I agree with bowerbird about the majority of poetry books being rather uninteresting in terms of typesetting.</p>
      <p>To me, careful and individual placement of poems is the most important aspect; each poem must relate to the page as a whole. This fails miserably in the case of short poems clinging to the upper left corner of the text block. The most pleasing -- but also the most functional -- placements, which allow the poems to breathe, are (visually) centered on the horizontal and have maybe a generous vertical indent, too.</p>
      <p>I've seen many books where the poems were set so that their last line was always at the bottom of the text block -- what was changing was the vertical position of the first line. This doesn't always work, though, and sometimes too much jumping around can also become distracting. You have to figure it out accordingly.</p>
      <p>There's an example of a poetry book in Hochuli's Desining Books with the title on the verso and the poem on the recto.</p>
      <p>Nothing fancy, no poetic cliches, but make sure that individual poems don't look like they were falling down or out of the page. Don't make them look ashamed of their existence, place them in a way that will underline their self-sustained aesthetic importance.</p>
