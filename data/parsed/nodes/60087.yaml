      <p>Don:</p>
      <p>I was indeed attempting a quip. But there's a bit more to it than the purely math and economic aspects of paper size and press size. Why, for instance, do many publishers reckon the "right" size for a book of memoirs is to be 5.5" x 8.5"? Why not 6" x 9"? Why must academic books be 6" x 9" instead of 5.5" x 8.5?</p>
      <p>Why cannot a book be an "odd" (say, tall, and slender) size if the economics are not negatively affected? Trying to get these notions changed for a book that may need a special treatment can be a tough nut to crack. I've been exposed to these decisions for decades now, and I'm often flabbergasted. Especially with poetry, some works call out for a different size, but publishers cannot be convinced. Often the discussions do take on the aspect of a séance.</p>
      <p>It should also be noted that bookstore shelf size is also a factor in deciding the size of many books.</p>
      <p>powers</p>
