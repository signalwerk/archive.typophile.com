      <p>Paper can comprise half the cost of manufacturing a book, so publishers and printers are keen not to waste any. 6 by 9 inches is an economical size because most book papers are manufactured in a 25-by-38-inch size, which just fits 16 pages (four 6's out of 25 and four 9's out of 38, with just enough left over for folding and trimming).<br>
      If you're printing a quarter-million copies of <em>Harry Potter and the Dingbats of Doom</em>, it makes an enormous difference whether your trim size is 6 or 6-1/2.<br>
      But this ain't Harry Potter, it's poetry, and if the print run is more than 1000, I'll eat my Haberule.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Haberule_5976.jpg"></div><br>
      <em>(My Haberule)</em><p></p>
      <p>Poetry lives on the fringes of the publishing world, where you don't enjoy economies of scale, but you're not subject to the tyranny of scale, either. Random House can't afford to let a designer suggest a different trim size or kind of paper, but most poetry publishers are small, independent operations who are more likely to engage in a dialogue.</p>
