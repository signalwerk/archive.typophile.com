      <p>Mr. Electricity, folios centered north-south on the outside edge of the page can be an elegant and distinguished look, but remember that most poetry is ragged right. The pages have a clearly defined left edge and no visible right edge, so your left-hand folios will have a very different relation to the mass of type on the page than your right-hand folios will.</p>
      <p>But maybe that's the effect you wanted.</p>
