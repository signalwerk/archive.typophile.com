      <p>excellent input, omeld...</p>
      <p>i'm a performance poet, who no longer even bothers<br>
      to output pieces to the page, but back when i did that,<br>
      and cared about what they looked like on paper, i'd<br>
      adjust the _leading_ of each piece so that top lines and<br>
      bottom lines always fell at page-top and page-bottom.<br>
      (my lines are always centered, if it helps you visualize it.)</p>
      <p>it worked for me; i liked its sensibility.</p>
      <p>so if the poet has interest or input on how s/he would<br>
      like the poems to look on the page, i'd listen carefully...</p>
      <p>as for graphics, a friend and i designed his chapbook<br>
      using maps as graphics on most of the pages, which<br>
      would be extremely simple today with google maps...</p>
      <p>i'm also constantly on the lookout for the poet who<br>
      wants to hand print her chapbook in her own writing,<br>
      because i sense that i'm going to find her _eventually_.<br>
      (that's how i know it's a woman.)  however, if you should<br>
      find her first, do please go ahead and suggest it to her...<br>
      (she'll know immediately it's what she wants to do, and<br>
      she will thank you then and there, and later, repeatedly.)</p>
      <p>-bowerbird</p>
