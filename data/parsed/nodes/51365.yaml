  html: |-
    <p>View the rough cut created from 13 interviews of graphic artists, type setters and designers in the deep south for the 2008 Southeastern College Art Conference (SECAC). These craft and trades folk range in age from 21 to 96 and live in south Louisiana in an area flanked by Pineville to the north, Thibodaux to the south west and Covington to the east including Baton Rouge and New Orleans. </p>
    <p>This is a work-in-progress trailer for a feature-length version of revisionist history of type and graphic design focusing on the American south.</p>
    <p><a href="http://vimeo.com/2100555">AIGA New Orleans People’s History of Graphic Design</a> from <a href="http://vimeo.com/aiganeworleans">AIGA New Orleans</a> on <a href="http://vimeo.com">Vimeo</a>.</p>
