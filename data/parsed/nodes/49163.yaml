      <p>Duely noted; you all do have a point, even though there was no intent of mocking this community at all, or anything of the likes. In any case, i still highlight that that reflects the spirit of the blog – it is meant to play with that. Designers used to play with concepts and ideas, last time I checked.</p>
      <p>I'm not trying at all to play deffensive on this – don't take me wrong: I embrace your critique, I just think it evades the whole purpose picking with the blog title instead of checking for content – but, if I'm not mistaken the greek suffix <cite>phagos</cite>, stands for voracious/voraciousness; as much as the <cite>philos</cite> one stands for friend / being friendly (exactly).<br>
      All the more one would assume that especially this community would be less impenetrable.</p>
      <p>I truly want to thank you all for your opinions and statements – which help in not only the blog's, but in my own personal growth –, that are crucial for avoiding future mistakes.</p>
