    <p>Hello, Typophile community.</p>
    <p>Hereby, I'd like to present you this blog, <a class="freelinking external" href="http://typophagy.blogspot.com" rel="nofollow">Typophagy</a> created by myself and <a class="freelinking external" href="http://www.loligovulgaris.com" rel="nofollow">Fábio Martins</a>.<br>
    The above mentioned has the objective of uncovering some essays, thoughts, and what-nots about not only typography but also design in general. </p>
    <p>It is definitely yet an up-and-coming project, but it counts on critique, opinions and appreciation to go forward.<br>
    I post this here because it shares a mutual interest and focus with this community – which in my opinion has exactly the right people to appreciate it. </p>
    <p>I know I am not properly what you would call an active participant in typophile, but that is due mainly to the lack of time and production, as well as involvement in other matters; so this comes as a manner to show the love drawn towards the crafts here discussed and practiced – all of those which such visible fullness of heart.</p>
    <p>Thank you all already,</p>
    <p>André Reis</p>
