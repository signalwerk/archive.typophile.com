    <p>Hello all,</p>
    <p>I've been given the fortunate opportunity to live in barcelona for several months, and hope to travel around mainland europe during this time -- with a bit of an initial adventure in the Czech Republic and Poland beginning this friday. </p>
    <p>I was wondering if anyone here could recommend some <a href="/wiki/typographic%20destinations" class="freelinking" rel="nofollow">typographic destinations</a> on the continent.  I'm generally not much for the tourist bit, but i imagine letting typography influence the wandering a bit could be quite qood.</p>
    <p>Currently the only thing i had planned was to go to Belgium and stalk Yves so i could observe him in his natural environment, but i'm sure there are better suggestions... (or at least, other suggestions?)</p>
