      <p>While you're in the Czech Republic, if you can get to Prague, there's the Museum of Decorative Arts (lots of writing / bookbinding / graphics). And there's supposed to be an important collection of typographic works and manuscripts at one of the monasteries, although I haven't been......you could ask around about this, probably at the MDA.</p>
      <p>********************************************<br>
      Museum of Decorative Arts in Prague<br>
      Main building<br>
      17. listopadu 2<br>
      110 00 Prague 1</p>
      <p>T) +420 251 093 111<br>
      F) +420 251 093 296<br>
      E) <a href="mailto:info@upm.cz">info@upm.cz</a>)</p>
      <p>transportation<br>
      Metro line A, Tram num. 17 or 18, Bus 133<br>
      Staroměstská stop</p>
      <p>opening hours<br>
      Museum<br>
      Tuesday 10 a.m.—7 p.m.<br>
      Wednesday — Sunday 10 a.m.—6 p.m.</p>
      <p>Library<br>
      Monday 12 noon—6 p.m., Tuesday 10 a.m.—8 p.m., Wednesday — Friday 10 a.m.—6 p.m.<br>
      July — August closed</p>
      <p>Café<br>
      Monday — Friday 10 a.m.—7 p.m., Saturday and Sunday 10.30<br>
      a.m.—7 p.m.</p>
      <p>admission charges<br>
      Combined ticket: permanent and temporary exhibitions 120 CZK (concessions 60 CZK)<br>
      Temporary exhibition: 60 CZK (concessions 30 CZK)<br>
      Permanent exhibitions only: 80 CZK (concessions 40 CZK)</p>
      <p>free entry<br>
      Tuesday 5 p.m.—7 p.m.<br>
      **************************************</p>
