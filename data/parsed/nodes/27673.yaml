    html: |-
      <p>If you make it to Belgium quick, there's still a (tiny) exhibition of illustrators (until 26-08-2006) in a local comic book store (Mekanik, St. Jacobsmarkt 73) here in Antwerp. It only features a few works, but is definitely worth seeing if you happen to be in the neighbourhood. The 2 works of Eduardo Recife alone make it worth the while!<br>
      And if you're also into comics or graphic design, it's a fun store to visit anyway.</p>
      <p>Good food tips are also available on request ;-)</p>
