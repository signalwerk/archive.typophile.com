      <p>Come through Frankfurt (well, Offenbach, actually), Germany, on the 29th of August ;-) Some local typographers/type designers and I meet once a month for drinks, and that's the next date. During the day you can go to the Klingspor Museum (<a href="http://www.klingspor-museum.de" title="www.klingspor-museum.de">www.klingspor-museum.de</a>). There are two great little type design exhibits there new, one on <a href="/wiki/Rudolf%20Koch" class="freelinking" rel="nofollow">Rudolf Koch</a>.</p>
      <p>There is also the Gutenberg Museum in Mainz, which I like quite a lot.</p>
      <p>At the end of September, the ATypI's annual conference will take place on the other side of the Iberian pennisula in Lisbon.</p>
