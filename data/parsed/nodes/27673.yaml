      <p>If you go to Ghent or Antwerp in Belgium, be sure to visit the bookstore Copyright. They have a great selection of graphic design books &amp; -depending on the moment- also some nice books on typography. The Fnac-stores sometimes also have great books on their shelves.<br>
      The adresses for the Copyright bookstores are:</p>
      <p>Jakobijnenstraat 8, 9000 Ghent<br>
      (openinghours: Mo-Sa: 10h00 - 18h30)</p>
      <p>Nationalestraat 28a, 2000 Antwerpen<br>
      (openinghours: Tu-Sa: 11h00 - 18h30, Su: 14h00 - 18h00)</p>
