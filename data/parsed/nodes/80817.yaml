  html: |-
    <p>Hello, </p>
    <p>I'm a experimental film student from Brussels, I like tattoo's and I just got my first ink. I don't want any drawings on my body, just fonts. Because they are figurative AND the have a direct meaning and message.</p>
    <p>I want to put a piece of text on my chest. A fragment of a monologue from "Mad Men".</p>
    <p>"νοσταλγία</p>
    <p>it's delicate, but potent.<br>
    in Greek, "nostalgia" literally means "the pain from an old wound."<br>
    It's a twinge in your heart far more powerful than memory alone.<br>
    Nostalgia isn't a spaceship, it's a time machine.<br>
    It goes backwards, and forwards...<br>
    It takes us to a place where we ache to go again.<br>
    It let's us travel the way a child travels - around and around, and back home again.<br>
    To a place where we know we are loved."</p>
    <p>It's a piece of text about nostalgia. So I want something matchable but not kitschy.<br>
    I've been looking for fonts and I found some that could work.<br>
    Now I want your opinion. (Ps: I like sans serif fonts, especialy "Futura")</p>
    <p>Greetings and thanks<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/Fonts_5546.png"></div><p></p>
