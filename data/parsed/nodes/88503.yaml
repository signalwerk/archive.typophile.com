      <p>I am!</p>
      <p>A little update. I wrote that the overall spacing width ('beat') <cite>is an aspect that Kindersley dealt with rather silently in his approach</cite>. In the Cardozo Kindersley workshop's "Optical letter spacing for new printing systems" publication (2001 edition) he does mention it when discussing the OILIO test string: <cite>For practical reasons kerning is undesirable in the initial stages of dtermining relative optical spaces for characters. Therefore close setting which would produce this is to be avoided. ... The ideal working set therefore would be when the 'L' is provided with the minimum space without any part of it projecting beyond its space.</cite> (p 31) Though the description of his approach begins with the spacing of O and I, actually it is the L which determines the 'beat' for spacing O and I. (The dramaturgical order doesn't necessarily mirror the order of what the story is about, true for fiction as well as non-fiction.)</p>
    html_clean: |-
