      <p>To clarify: I merely observed that there were two opposing and rather pessimistic viewpoints expressed in this thread.</p>
      <p>One pointing out that the inexperience of type designers in setting type may impact the quality of their work, the other noting the typographic shortcomings of graphic designers.</p>
