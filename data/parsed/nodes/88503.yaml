      <p><cite>I'm now thinking all caps is such an ugly state of affairs it's probably not worth taking the time to altering their inbuilt spacing and kern.</cite></p>
      <p>Oft times, the decision on whether or not to use full caps is the designers for display type, but the editors in running text.</p>
      <p>It's fine for you to not kern them. Just make sure your EULA allows the end user to modify the fonts, for their own use only. There are very few type designers in the world who actually use type professionally. Kent Lew comes immediately to mind. If your one of the few, I suppose you might be able to make such decisions; if not, leave the decision to those with the expertise.</p>
