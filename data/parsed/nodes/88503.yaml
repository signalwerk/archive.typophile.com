      <p>I've been told that you should space the caps with the H and O, and then kern caps to the lower case. Otherwise, it will never be right in all caps settings. To start with I think you want the H and O to not be wildly far away from the lower case. That means your caps will be a bit too tight in all caps setting. But then either set as is or tracked out by the software or cpsp they won't look heinous. Even after you kern the caps to caps, in titles they will need more kerning by the user; there seems to be no way to avoid the need for that. </p>
      <p>Also with this approach the kerning to the lower case of the other letters is generally not too extreme. That is important because you never know when your font is not going to be kerned at all. And your all-caps will generally look non-heinous even kerning off, as well, with this approach.  </p>
      <p>So text face, or not, that is the way to go. Or so I've been told. Makes sense to me.</p>
