      <p>Sorry it's late here, and I'm tired so I probably wasn't so clear.</p>
      <p>The first step, to my thinking is to make sure that the right side bearings of the H and O are close enough to lower case letters, eg n and o, not to look weird unkerned. And you want the H to be spaced equidistant between two Os, and Os between two Hs. Your HHOHHOOHOHO also needs to look decently balanced without kerning. That's a balancing act that's likely going to put them closer than ideal in all caps settings, at least by traditional ideas about all caps spacing. So the sensitive user will track out the all caps, or use cpsp, which you instruct to space them out some.</p>
      <p>What I actually have done while spacing the caps to caps (after setting the H and O) is always to check at the effect of the caps to caps spacing on caps to lower case letters, just to make sure things aren't getting too weird. Of course, the letters need to be well designed so they space properly. It doesn't just happen. If you have screwed up then you can catch and correct it. Of course then you still have to do cap to cap and cap to lower case kerning. But even if kerning is turned off (as in Word), or in a publication, your font will then still look decent.</p>
