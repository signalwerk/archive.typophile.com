    html: <p>Karsten, I was aware of the idea of initially determining looseness or tightness with the L. But somewhere he also says that overlapping is preferable to changing side bearings. so the idea of further kerning seems to be something added after the death of Kindersley. But I may have the story wrong, and I don't have time to look back over it. In the end, I think Kindersley's idea of an optical center is good, but his ways of determining it—other than by eye—never really worked. And he didn't acknowledge that at tighter settings kerning involves compromise between different ideals, such as even color vs not having letters touching.</p>
