      <p>I didn’t consciously develop a method for spacing Parity (unicase).<br>
      It struck me that it has more of the qualities of minuscule setting when set tight, and the qualities of all-cap setting when letterspaced. That  may have something to do with the fact that it’s a lining style.</p>
      <p>Another thing with Parity; as it is configured as “Unicase with Small Unicase”, I was forced to be more specific and describe letters as majuscule, minuscule, or common, rather than in terms of “Upper and Lower Case”.</p>
      <p>Anyway, I think I have acquired some extra knowledge about spacing through working on this style, although I’m not sure how it will play out in my next bicameral design. </p>
      <p>I try not to systematize things like letter spacing; I don't think spacing is something to be added on after glyph shaping—there’s a feedback loop in which glyph shape and spacing evolve in sync during the design process. </p>
      <p>Some ideas I’ve tried: wider sidebearings for “I”; narrower serifs for letters such as “E”; different serif widths at top and bottom.</p>
      <p>Slab serif types are the worst to space without kerning.</p>
