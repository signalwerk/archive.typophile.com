      <p>Hello Bill, in more general terms: Caps need one kind of spacing when in all-caps context and another kind of spacing when in lowercase context. By "spacing" I mean the determination of distances between letters, irrespective of how this is implemented. (In the currently dominant paradigm, spacing needs to be implemented by way of sidebearings and kerning. Plus, more or less as an optional add-on, some contextual positioning.)<br>
      The steps which you describe reflect one possible implementation. There are other ways to implement it, like via contextual positioning. Even when avoiding contextuality and restricting oneself to sidebearings plus kerning, there are still a variety of approaches left. The problem which I see with all non-contextual approaches is that when starting with a (for a given typeface) less-than-perfect beat then it is impossible to get the rhythm right. You indicate this when you write: <cite>To start with I think you want the H and O to not be wildly far away from the lower case. That means your caps will be a bit too tight in all caps setting.</cite> This compromise is, one way or another, a built-in feature of all sidebearings plus kerning approaches: Once H and O are already too close (they need to be or caps to lowercase spacing will be too wide), there is not enough default space left between caps that helps special ones like A L V W Y etc to disappear, and they will always stand out as being surrounded by more space than other caps. After all, the trick of all-caps spacing – the essence of Tschichold's advices or Kindersley's mechanism – is simple: Make sure that inter-caps spacing is wide enough so that the spaces caused by special caps does not stand out. Don't let letters that can be spaced tightly determine the beat. Let special ones determine the beat.<br>
      (A completely different issue is all-caps spacing aesthetics. In book typography, good all-caps spacing is rather wide, causing word images of evenly distributed black and white. In magazine &amp; advertising typography, it is rather tight, causing word images of irregularly distributed of black and white. What is considered as bad all-caps spacing in book typography is what makes magazine typography interesting.)<br>
      This is a bit theoretical. It is not to suggest that your implementation approach is wrong but rather that it is but one among many possible ones. And, given current technology and its limitations, each approach has its own drawback, either in terms of design or in terms of being supported.</p>
      <p>[Sorry for some post posting edits.]</p>
