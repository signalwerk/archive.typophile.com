      <p>Bill – <cite>Kindersley believed that once you had correctly positioned a glyph between its side bearings, and had the total advance width correct in relationship to other glyphs, then tracking should make no difference.</cite></p>
      <p>The middle part, <cite>and had the total advance width correct in relationship to other glyphs</cite>, is the crucial one and, my impression, is an aspect that Kindersley dealt with rather silently in his approach, possibly didn't even care about. His article "Optical Letter Spacing" (Penrose Annual, volume 62, 1969, pp 167–176) shows, on p 175, a comparison of tight (left) and wide (right) spacing as created with his approach, by example of the caps alphabets of Folio, Times, Perpetua and Optima. The tight spacing column is telling: The L is too close to, and sometimes even touches, the M which follows. He doesn't mention this explicitly yet this demo <em>shows</em> that overall spacing width is an implicit factor. If too tight, the method does not yield proper results.</p>
      <p><cite>Could you explain more what you mean by "contextual positioning?"</cite></p>
      <p>It is how I translate my initial observation, that <cite>caps need one kind of spacing when in all-caps context and another kind of spacing when in lowercase context</cite>, into the current spacing-plus-kerning paradigm and OpenType add-on: There is one set of sidebearings for lowercase context; this is the default sidebearings. Then there is another set of sidebearings for all-caps context; these 'alternative' sidebearings are implemented by adjusting glyphs' positioning and/or advance widths contextually, via the GPOS table. (This is what I did in some of my fonts. Another factor, though, is each typeface's design. Not every typeface needs caps to be spaced differently for different contexts – a number of recent typefaces have rather narrow caps which produce the same 'beat' as lowercase letters anyway.)<br>
      Indeed 'normal' kerning can be interpreted as a special case of contextually adjusting positioning and/or advance width.<br>
      Kerning triplets sound interesting for dealing with a few exception cases but is not what I was thinking of.</p>
      <p><cite>The approach I followed was as you say trying to cope with our existing system. ... But I was also concerned with the practical problem that you don't want your font totally wrecked with both kerning and contextual alternatives not used.</cite></p>
      <p>And this makes pretty much sense. When I wrote that my comment <cite>is not to suggest that your implementation approach is wrong</cite>, this was not mere rhetorics. Over time I got weary of trying to push the boundaries of the current paradigm within the current paradigm. It only gets one so far. I realized that one better acknowledges a given technology's limitations – or come up with new technology. And, like you say, <cite>it looks like no one else gave a shit</cite>. :(</p>
      <p>hhp – <cite>BTW Karsten: All good, just no "rhythm" involved.</cite></p>
      <p>I guess you aren't surprised that I am not surprised reading this. ;-)</p>
