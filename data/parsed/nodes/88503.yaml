      <p>Karsten, nice post. </p>
      <p>As I understand it, Kindersley believed that once you had correctly positioned a glyph between its side bearings, and had the total advance width correct in relationship to other glyphs, then tracking should make no difference. You might get overlaps (eg KA) with tight kerning, but otherwise everything would be optimally balanced, as you go looser or tighter with tracking. I really wonder whether he was right, though. It seems like all caps titles always benefit from re-fitting. And, as you say, what appropriate tightness or looseness is different with the usage. </p>
      <p>Could you explain more what you mean by "contextual positioning?" Kerning is one kind of contextual positioning. Another is contextual alternatives. In Williams Caslon Text to handle the old style long-nosed f's, in addition to kerning I used contextual alternatives, sensitive to the following letter or space. Also, inspired by Charles's comments on Typophile, I also used contextual alternatives to handle triplets involving spaces, like f space T.  </p>
      <p>Are you advocating more widespread use of contextual alternatives? What do you have in mind? Are you thinking of more sensitivity to triplets?</p>
      <p>I know John Hudson would like to see a system of "envelope" shapes that would determine fitting and erase the spacing/kerning distinction, which is an anachronism in digital type. </p>
      <p>I agree that this would be an advance. The approach I followed was as you say trying to cope with our existing system. I tried to get the final result with kerning and contextual alternatives have "right rhythm," as you put it. But I was also concerned with the practical problem that you don't want your font totally wrecked with both kerning and contextual alternatives not used.</p>
      <p>This isn't just a theoretical possibility, as Boston Magazine, the years when it was using Williams Caslon Text, didn't have any kerning. I winced occasionally when I looked at samples, but it looks like no one else gave a shit :)</p>
