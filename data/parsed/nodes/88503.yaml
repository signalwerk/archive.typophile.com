    <p>Just wondering...</p>
    <p>I'm spacing my caps to work with lowercase, since I'm designing a text face where all caps settings will be rare. However, it struck me that it could actually be possible to accommodate all caps settings as well, by adding some extra units to the left sidebearings of capital letters: this wouldn't affect how they look with lowercase (except in situations with interCaps) but could make the caps look nicely spaced amongst themselves. Would this be useful, perhaps for situations where OpenType cpsp isn't available? Have other type designers tried this? Or is it undesirable to have the caps off-centre like this?</p>
