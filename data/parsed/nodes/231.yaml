  html: <p>Pica 2002 <br> <br>2002-02-28 <br> <br>National Design Conference Invites Designers to Take Their Creativity Further  <br> <br>The Alberta Chapter North of the Society of Graphic Designers of Canada (GDC/AB-N) is hosting PICA 2002, a design conference, May 3-5, 2002 in Banff, Alberta. The three-day conference will feature prominent speakers from both the design and advertising industry.  <br> <br>The theme of the conference is How Far Will You Go? </p>
