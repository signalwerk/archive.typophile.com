    html: |-
      <p>I like the “useless” connotations. If you saw a sign that said “Useless ” you would probably stop and look. I saw a similar campaign around my city last year called “FLICK OFF” (the LI combination was kerned just a little too tightly) and it made you do a double take.</p>
      <p>That being said, the ’ul’ mark you’ve come up with doesn’t work. I would like to see a mark that really says “use less” of whatever you’re trying to get Toledo to use less of. That way the initial shock of having your city called “useless” is immediately replaced by the notion of using less.</p>
      <p> - Lex</p>
