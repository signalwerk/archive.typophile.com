  html: |-
    <p>My first reaction to seeing a book called Letter Fontein in the bookshop of the Graphic Design Museum in Breda on a study trip in February was to wonder when it might become available in English. It’s a reflection of the world we now live in that the book in question, printed in China by a German publisher, but authored and designed by a Dutchman, is available in my own language (and Spanish, French and German), a mere ten or twelve  weeks later...</p>
    <p>Taschen offer a flick-through preview on their website at</p>
    <p><a href="http://www.taschen.com/pages/en/catalogue/design/all/06770/facts.letter_fountain.htm" title="http://www.taschen.com/pages/en/catalogue/design/all/06770/facts.letter_fountain.htm">http://www.taschen.com/pages/en/catalogue/design/all/06770/facts.letter_...</a></p>
    <p>You can see bigger previews and find out more about the Dutch edition at</p>
    <p><a href="http://www.letterfontein.nl/" title="http://www.letterfontein.nl/">http://www.letterfontein.nl/</a></p>
