    html: <p>No, actually, I don't. I don't give out that assignment, in fact. I teach students the history of the alphabet, the history of type, where it comes from; and I try to map the path of how we got to where we are today. I have very little time to cover so very much history and I think this is very important to students. I mean, you can't know where you are going if you don't know where you've been. It's also hard to pick and choose what to teach - there are so many great things to study! One of the reasons why I enjoy coming here so often is to find out the answers to a lot of questions, get resources that people recommend, hear opinions and facts from people who know more than I do, participate as best I can and, ultimately, learn. I've learned a great deal from the people here - and I love it.</p>
