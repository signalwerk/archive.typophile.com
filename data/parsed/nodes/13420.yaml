      <p>Oddly enough, pre-digital use of type galleys and photo-headlines gave the basic graphic designer literal hands-on experience with letterforms.</p>
      <p>Kerning headlines on  paste-ups with an X-acto blade, and building missing letters a la Frankenstein as you mentioned were all part of everyday production (unless you had your own typesetting equipment).</p>
      <p>If tracing letterforms is abandoned by new teachers of typography, at least some excercise of manipulating spacing by hand should be retained.</p>
      <p>Once a student associates real physical space with visual space a better sense of balanced type color can be attained.</p>
      <p>----------------------------------------------------<br>
      Yes, I'm old, but I'm back in style!</p>
