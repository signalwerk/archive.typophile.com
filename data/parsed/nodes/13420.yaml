      <p>Tina, I don't know if you are at the <a href="/wiki/Art%20Center%20College%20of%20Design" class="freelinking" rel="nofollow">Art Center College of Design</a>,<br>
      but <a href="/wiki/Doyald%20Young" class="freelinking" rel="nofollow">Doyald Young</a>, who taught about letter forms and logos there for<br>
      many years tells the story in his <a href="http://www.delphipress.com/" rel="nofollow">Fonts  and Logos</a> that his<br>
      first lesson in drawing letters was <a href="/wiki/Caslon" class="freelinking" rel="nofollow">Caslon</a>. At the time he started, I<br>
      would guess Caslon was probably the most used typeface in books. I<br>
      believe he continued the practice. So you are receiving a tradition. </p>
      <p>Historically, probably <a href="/wiki/Garamond" class="freelinking" rel="nofollow">Garamond</a> should be the one, as it really seems<br>
      to be the architype of printed letters following it. </p>
      <p>Caslon has through the centuries been probably the most widely used<br>
      typeface for the English language, but also controversial. Some say<br>
      it is a collection of mistakes, and others that it has a great<br>
      harmony and readability as a whole. Perhaps the controversies over it<br>
      make it still a good place to start.</p>
