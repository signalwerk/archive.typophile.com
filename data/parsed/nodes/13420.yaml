      <p>I was thoroughly interested in this question, Tina, so I did a little bit of digging through my type books. I wanted to know more about the reason too! I came up with much the same information that William posted — and a little bit more. I thought I would share this with you, in case you were interested, too.:</p>
      <p>"Despite the many hundreds of text faces designed since 1460, the original old style faces (Garamond, Plantin, Janson, Caslon, etc.) are still considered to be among the most readable ever designed and therefore, are commonly used in publications where an abundance of continuous text is necessary. The essential humanistic qualities of this type style (a sense of rhythm, strong horizontal stress, with a flowing, easy interaction between characters) are commonly strived for in contemporary typeface design even, occasionally, in sans serif."<br>
      — taken from <a href="/wiki/David%20Jury" class="freelinking" rel="nofollow">David Jury's</a> <a href="/wiki/About%20Face%3A%20Reviving%20the%20rules%20of%20typography" class="freelinking" rel="nofollow">About Face: Reviving the rules of typography</a></p>
      <p><a href="/wiki/D.B.%20Updike" class="freelinking" rel="nofollow">D.B. Updike</a> explains the popularity of Caslon's type thus: "While Caslon modelled his letters on Dutch types, they were much better; for he introduced into his fonts a quality of interest, a variety of design, and a delicacy of modelling, which few Dutch types possessed. Dutch fonts were monotonous, but Caslon's fonts were not so. His letters, when analyzed, especially in the smaller sizes, are not perfect, individually; but in mass their effect is agreeable". Caslon does not have the elegance of Garamond's letters but their 'defects' are recognized as being typically Anglo-Saxon and as such have come to represent perfectly the sturdy English tradition in typography.</p>
      <p>Thanks!</p>
