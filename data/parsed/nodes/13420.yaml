      <p>&gt; Updike was famous for hating the Dutch.</p>
      <p>Yes, he really was unfair. And he had <strong>too much</strong> praise for Spanish type. On the other hand, anybody who's been to Spain might excuse that.  :-)</p>
      <p>In the case of Caslon, frankly I think that to some degree at least sloppiness has been mistaken for creative flair. A certain "warmth" in the forms is great (everybody knows I'm not exactly the biggest fan of Bodoni...) but there's a difference between that and just not caring for consistency, which can only harm the unity of the design. Which is not to say that such consistency should preclude good craft - and to me the high point of Caslon is in fact the tricks he pulls in the Italic UC "Q":</p>
      <p><a href="http://www.themicrofoundry.com/other/caslon_q.gif" title="http://www.themicrofoundry.com/other/caslon_q.gif">http://www.themicrofoundry.com/other/caslon_q.gif</a></p>
      <p>Not only is it non-linear, there's even topological variance, all brilliantly done. But of course this type of thing is too sophisticated to teach in a first course!  :-/</p>
      <p>hhp</p>
