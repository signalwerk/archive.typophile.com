      <p>William's post above is an important one -- the midcentury revival of Caslon's types by Pickering (and others) had a profound influence upon book typography, and set the stage for the revivals of the next century. I don't know that we'd have seen William Morris' humanist revivals, let alone the work of Morison or Benton or Griffith, had it not been for the renewed interested in Caslon.</p>
      <p>Caslon was in sufficient use for the next hundred years that the "Caslon" name underwent the usual dilution in the marketplace. Every American foundry that had a Caslon type that bore some resemblence to the types of William Caslon had a greater number of "Caslon" types that didn't -- "Caslon Antique" and "Caslon Open" are two that survive today, real canards that have nothing to do with any of the Caslons. The 1923 ATF book is full of antiques (!) and moderns (!!) named "Caslon."</p>
      <p>It's possible that anyone picking Caslon for a freshman assignment is doing so because thirty years ago, it was one of the designs most readily accessible in a variety of media (from Presstype to Linotronic output.) If the next generation of typography teachers chooses Times Roman, it might be for similar reasons.</p>
