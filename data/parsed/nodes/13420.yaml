      <p>From a typographer's viewpoint, the only student excercise that truly opened my eyes was the tracing of inter-character negative shapes. We would select a large point size headline from an ad then trace and blacken the spaces between each character. It really cultivated a sense of balanced spacing.</p>
      <p>Of course, those old freelancers out there will remember the plight of running out of certain letters when creating a headline using Letraset sheets. This was all "PM" (Pre-Macintosh).</p>
      <p>It was always late at night and inevitably you had to trace any missing characters with a Rapidograph then paste them in so you could complete the job.</p>
      <p>Necessity was the mother of invention.</p>
      <p>-------------------------------------<br>
      Yes, I'm old, but I'm back in style!</p>
