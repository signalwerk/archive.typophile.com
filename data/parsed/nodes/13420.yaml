      <p>It's worth mentioning that Updike was famous for hating the Dutch. At one point in <a href="/wiki/Printing%20Types" class="freelinking" rel="nofollow">Printing Types</a>, he goes so far as to criticize a "stingy little Dutch type," one which later in the book is correctly identified as the work of Frenchman <a href="/wiki/Robert%20Granjon" class="freelinking" rel="nofollow">Robert Granjon</a>, where it is summarily praised. Updike's books are very useful, but I wouldn't look to them for objectivity.</p>
      <p>Tina, what does your Caslon assignment consist of?</p>
