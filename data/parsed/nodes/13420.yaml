      <p>Oz Cooper's comment on Caslon was along the lines of "If Caslon had 'improved' his types as much as others have subsequently, it's doubtful it would still be around to be improved upon." </p>
      <p>Cooper didn't like types that are ruthlessly methodical and clean. Not a big Bodoni fan.</p>
      <p>So, from your point of view, it would probably be more straightforward to render a Didone, but perhaps the idea is that there's more to learn from something that's not so predictable. Also, it has a trace of the angled pen, which is interesting.</p>
      <p>If you're lettering it by hand, it's probably quite forgiving, so not a bad place to start.</p>
