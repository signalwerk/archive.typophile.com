      <p>If the purpose is to understand form, I propose that a copy drawn "by eye" gives a fuller appreciation, because it uses both sides of the brain, whereas tracing is a simpler exercise in hand-eye coordination.</p>
      <p>For instance, if you copy an "o" by eye, you have to be acutely aware of its proportion in order to get it right, and the fullness of its curvature -- but not if you trace it, where the main concerns are smoothness and symmetry.</p>
