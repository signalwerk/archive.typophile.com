      <p>Thanks for your comment. The original idea was actually to follow your second suggestion but sadly I ran out of ideas after 'wrinkle'. Another plan was to focus typographically on 'man' (who is after all the hero of the sentence) and then gradually 'fade out' toward the end of the quote. In the end I abandoned that one because it would look too similar to Chip Kidd's <cite>The Original Of Laura</cite> cover.<br>
      I attach picures of a slightly modified version of the original as it looks printed, and a typographically rather different approach.<br>
