    <p>Inspired by David Pearson's (and Phil Baines' etc.) designs for Penguin's <cite>Great Ideas</cite> series and a recent re-reading of parts of <cite>The Order of Things</cite> I put together a preliminary cover design for Foucault's book. I'll try to make some test prints tomorrow so I thought I'd ask what people around here think about it. The project is intended purely for my fun and the annoyance of friends I keep showing it to.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/fou_v1_mod_resize_4660.jpg"></div><p></p>
