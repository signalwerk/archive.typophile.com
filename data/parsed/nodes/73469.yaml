    html: |-
      <p>Thanks for your comment. You're right about the HP font, I haven't noticed that.<br>
      The idea behind setting (some of) the Latin prefixes in sub/superscript lowercase was mainly just space management. I wanted the text to look uneven partly because of the 'wrinkledness', referred to in the quote, and partly because a large part of the book is about the impossibility of classification, i.e. of subsuming particular instances under a general concept (or in this case, of forcing text or language into a strict grid).</p>
