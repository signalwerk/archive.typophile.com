    <p>Powstało Śląskie Pismo<br>
    <a href="https://web.archive.org/web/20150123212219/http://tinyurl.com/y5wycd" title="http://tinyurl.com/y5wycd">http://tinyurl.com/y5wycd</a></p>
    <p>Dear Friends I would like to inform you that from October the 17th, 2006, The Castle of Enterprise and Art in Cieszyn and The Silesian Library in Katowice hosts, under supervision of local authorities, an exhibition which presents and concludes the project of a new typeface design: Silesiana 2006.</p>
    <p>Silesiana 2006 is the first project of a type rooted in regional tradition, made in Poland after World War II and supported by local government. The authors are: Artur Frankowski (Warsaw)—a young generation typographer working with digital tools, Polish representative on ATypI Forum, and Henryk Sakwerda (Katowice)—classic typographer, working with calligraphy, author of many types awarded before the digital era.</p>
    <p>The organisers are very proud of the result and hope that the project will continue. We would like to encourage Polish authorities to pay attention to typography as a part of the local culture, worth to be developed and supported. Katowice is a town in Silesia—south, industrial region of multicultural influences from Czech, Germany, and Poland. Its athmosphere is recognisable in the characters' shape, colour and light.</p>
    <p>The conference and the opening of the exhibition of Silesiana 2006 typeface will take place on November the 15th, 2006. The main subject of the conference is the regional influence on types. The guests of honour are: Gerry Leonidas, Verena Gerlach, Filip Blazek, Adam Twardoch, Artur Frankowski, Henryk Sakwerda.</p>
    <p>Students from Polish art and design schools, designers and teachers of design are invited for a discussion.</p>
    <p>Participation in the conference is free for Polish and international guests. Those interested in a hotel reservation are kindly requested to contact the organisers at: <a href="https://web.archive.org/web/20150123212219/mailto:info@zamekcieszyn.pl">info@zamekcieszyn.pl</a></p>
    <p>Topics of presentations</p>
    <p>Artur Frankowski<br>
    Regional influences in Polish typography.</p>
    <p>Gerry Leonidas<br>
    European Type Design.</p>
    <p>Filip Blazek<br>
    Overview of History of Czech Typefaces from 1900 to 2006.</p>
    <p>Verena Gerlach<br>
    Karbid And Citystreettypes.</p>
    <p>We hope it will be a very fruitful and interesting meeting focused on how the coexistence of Polish, Czech and German culture on the Silesia territory is reflected in the shapes of types.</p>
    <p>.</p>
    <p>Read more at: <a href="https://web.archive.org/web/20150123212219/http://www.zamekcieszyn.pl/" title="http://www.zamekcieszyn.pl">http://www.zamekcieszyn.pl</a></p>
    <p>My best regards,</p>
    <p>Ewa Satalecka</p>
    <p>.</p>
