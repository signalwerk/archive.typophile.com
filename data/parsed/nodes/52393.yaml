    <p>I have a web design background, and am trying to improve my typography. </p>
    <p>Please give me a critique of my new portfolio design, on the typography especially. This is just a flat comp and will eventually be a working site.</p>
    <p>Version 1 (Large jpg 1.2MB)<br>
    <a href="http://www.jamischarles.com/dev/layout16.jpg" target="_blank" rel="nofollow">http://www.jamischarles.com/dev/layout16.jpg</a></p>
    <p>Version 2 (Earlier version, a few changes, large jpg)<br>
    <a target="_blank" href="http://www.jamischarles.com/dev/layout15.jpg" rel="nofollow">http://www.jamischarles.com/dev/layout15.jpg</a></p>
    <p>Any feedback would be greatly appreciated. </p>
    <p>Thanks.</p>
    <p>Jamis</p>
