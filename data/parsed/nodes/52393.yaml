      <p>I think it's looking better now.</p>
      <p>The small caps in the middle of a sentence like that just doesn't work, at least for a website. Maybe try italics instead, but I really don't think any emphasis is necessary.</p>
      <p>Also, I assume you'll edit your real copy so that every other sentence doesn't begin with "also".</p>
      <p> - Lex</p>
