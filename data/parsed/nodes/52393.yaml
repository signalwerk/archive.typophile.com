      <p>I'd say spell out "small to medium" instead of "small-medium". Also, that swash on 'You' does nothing but break up the sentence. Get rid of it.</p>
      <p>Why is the word "DESIGNED" in small caps under the pictures? It doesn't stand out enough to be a link, and it stands out too much to be just normal text.</p>
      <p>Go with the brown "Website Design" at the top right of each picture instead of the orange.</p>
      <p> - Lex</p>
  - id: 316617
    user: 40361
    date: 2008-12-06T09:25:00
    date_raw: 6 Dec 2008 — 9:25am
    votes: null
    html: |-
      <p>@Lex: Thanks for the feedback. I agree with all of your comments. I've made those changes.<br>
      I removed the swash from then end of "you" but added one at the beginning. Let me know if you like it.</p>
      <p>In response to your question: "Why is the word “DESIGNED” in small caps under the pictures? It doesn’t stand out enough to be a link, and it stands out too much to be just normal text."</p>
      <p>Answer: I wanted highlight what I had done on those projects without having to make bullet points. So I used small caps to make emphasis to those. Do you think this treatment is not accomplishing that effectively?</p>
      <p>I've made the changes and re-uploaded the file.<br>
      <a href="http://www.jamischarles.com/dev/layout16.jpg" target="_blank" rel="nofollow">http://www.jamischarles.com/dev/layout16.jpg</a></p>
      <p>Thanks,</p>
      <p>Jamis</p>
