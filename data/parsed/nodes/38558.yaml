    <p>Hello everybody. I've just been asked a question that I found a bit strange:<br>
    "Do you know any sans typeface with the rt ligature?" I was suprised, because I didn´t think how we could have a reason for doing so, because the genesis of both letters doesn´t justify it. My first reaction was "Not even a serif typeface has that...!" Even the queen of ligatures, Mrs Eaves doesn´t have one, but someone is telling me that it's very common and that has seen it frequently.<br>
    The closest thing I saw was in carolingian script or a calligraphic exercise...<br>
    People, what do you think of that? Was I blind or is that person crazy?</p>
