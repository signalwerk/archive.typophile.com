      <p>I am guessing that a heavilly tracked sans had it's r &amp; t collide producing a faux ligature. Some sans fonts are more prone to this than others. Looking at it a little it seems like the older the sans the more likely this is although I haven't looked in enough detail to make the claim stand.</p>
      <p>Here is an example of what I mean.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/tracking_3611.gif"></div><p></p>
