      <p><cite>Is the computation speed difference between 2000 and 2048 enough better, given todays computers, that it is worth the tweaking of outlines to overcome rounding errors?</cite></p>
      <p>Good question!</p>
      <p>Maybe it's a choice: Either you care less for speed (provided there is still a significant difference). Or you care less for metrical identity of possible .otf and .ttf versions (or make a .ttf version only). In the latter case you could use 2048 instead of 2000 without rescaling outlines, which makes the .ttf version look a bit smaller.</p>
