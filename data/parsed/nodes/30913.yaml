      <p>Writing off the top of my head now: </p>
      <p>The maximum UPM size permitted by the OpenType and TrueType specifications is 16,384 (<a href="http://www.microsoft.com/OpenType/OTSpec/head.htm" title="http://www.microsoft.com/OpenType/OTSpec/head.htm">http://www.microsoft.com/OpenType/OTSpec/head.htm</a>), and this is the value that FontLab Studio also permits as a maximum. </p>
      <p>You need to keep in mind that the UPM size controls how glyphs will be sized at a specific point size (i.e. the point size chosen by the user in an application always corresponds to the UPM size of the font). If your UPM size is 2,000 and the user chooses 10 pt type, any glyph that will be 1,000 units high in your font will be exactly 5 pt high in print. Typically, in text fonts, the height of flat uppercase Latin letters such as E, H or I is 70% of the UPM size. So if you pick a non-1000 UPM size but you want for your font to go well with other fonts available on the user’s system (i.e. so that it’s not untypically small or untypically large in relation to other fonts), you should make your uppercase letters roughly 1,400 units high in a 2,000 UPM font. Of course this is just a rough estimation -- it can range from 1,100 to 1,600 units and will still be within the normal range. If your lowercase is quite large, you may want to make the uppercase appropriately smaller, somewhere around the 1,100 end. (For a 1,000 UPM font, all these values should be cut by half, obviously.) </p>
      <p>The Type 1 specification states that absolute glyph coordinates must not exceed the range of –2,000 to +2,000, in both x and y directions (<a href="http://partners.adobe.com/public/developer/en/font/T1_SPEC.PDF" title="http://partners.adobe.com/public/developer/en/font/T1_SPEC.PDF">http://partners.adobe.com/public/developer/en/font/T1_SPEC.PDF</a> section 3.3). This means that according to this specification, *regardless of the UPM size*, none of your extrema points should have the x or y position larger than ±2,000 units. </p>
      <p>While in the Type 1 specification states that the general limitation is ±2,000, the Type 1 spec supplement states that the most important implementations have higher limites: the Adobe PostScript RIP that is built into printers and imagesetters supports glyph coordinates up to ±4,095 and the Adobe screen font driver (ATM/CoolType) supports coordinates up to ±8,191. So these are the more important limitations to observe. </p>
      <p>All those limitations are also valid for OpenType PS fonts as they are being converted to Type 1 fonts when sent to a PostScript printer. </p>
      <p>Adobe recently released a set of OpenType PS fonts with the UPM size of 2,048 (Adobe Arabic, Adobe Hebrew, Adobe Thai) in which there are a few very wide glyphs in which the x coordinate is about 3,500. This exceeds the original Type 1 limitation of ±2000 but is still within the Adobe PostScript RIP limitation of ±4095. </p>
      <p>It seems that, regardless of the chosen UPM size, the maximum glyph coordinates in an OpenType PS (.otf) and Type 1 font is ±4095. </p>
      <p>In FontLab Studio, you can check the maximum glyph coordinates in Font Info / Metrics and Dimensions / Key Dimensions / Font BBox. The values listed there are in order: (minimum x, minimum y) - (maximum x, maximum y). Make sure that the absolute value of neither of the numbers is larger than 4095. </p>
      <p>FontLab Studio currently has an internal implementation limit for glyph coordinates of –32,767 to +32,767. This means that very high coordinate values (e.g. over 10,000) might cause problems at geometric transformations (scaling, rotating etc.). You can observe the effect easily if you scale something in FontLab by 1000% several times -- you will see that the glyphs "implode".</p>
      <p>Altogether, it is not possible to give one definitive answer of what the maximum UPM size and maximum glyph coordinates should be. For reasons of conciseness (one of the glyph design principles recommended by the Type 1 specification), the designer should not choose a larger UPM size than is needed for the precision he’s looking for. If the precision offered by the UPM of 1000 is not sufficient, the designer should choose 2000, and failing that, higher values such as 3000 or 4000 — while on the other hand keeping in mind that all glyph coordinates should fit within the ±4095. </p>
      <p>Depending on the font format (OpenType PS or TT) the tool choice (Fontographer or FontLab Studio) and backwards-compatibility concerns (does the font really have to print on printers or imagesetters made in 1992?) the limits are different. Also, many of those limits are not "hard" or specified by any vendors, they’re empirical estimates that people found after struggling with some bugs in specific devices. </p>
      <p>Adam</p>
