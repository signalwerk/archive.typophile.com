      <p>I was assuming that fonts with an UPM of 1000 are to be generated in the end and also that you might only temporarily want to increase the UPM value for certain operations or design steps. In that case, when changing the UPM you would check the "Scale all glyphs according to UPM size change" checkbox because otherwise you would not effectively change the "resolution". This implies "scaling", i.e. multiplying the coordinates of every node by a certain number - which can lead to rounding errors and stem weight inconsistencies.</p>
      <p>If you only want a slightly different UPM you may not need to scale the glyphs. However, I do not understand what would be the benefit of that.</p>
      <p>Peter, what do you mean by "the number 864 would allow all points in all weights to fall precisely on the grid."? What grid are you talking about?</p>
