      <p>"So I am myself curious about the actual speed advantages of, say 2048"</p>
      <p>MS says it is "substantial". What makes it not worth investigating further, is that scaling Up is hardly a type-shattering problem in type design. If someone is concerned about scaling from 1000 to 2048, see your local FL Constabulary for Up scaling with hinting in FL. On the other hand to be fair, they are supplying hinting of the output to solve the more generally problematic Down scaling of type.  </p>
      <p>"changing the UPM from 1000 to 2000 with “Scale all glyphs according to UPM size [...then] changing it from 2000 to 2048 without that checkbox checked.<br>
      I think this is quite an elegant solution to the problem."</p>
      <p>This is a solution. It's best employed on 1000 dpi fonts that have no metric history in the outside world as it leaves 1000 and 2048 fonts unmatched vertically. It also says you didn't care for the original relationship twixt design and em by a specific factor. ;)</p>
      <p>There have been a lot of threads here, but fabric fails to form. ;)</p>
      <p>There are two variables in the designer's UPM decision tree: the memory and processing of the composition system, and the characteristics of the type design. </p>
      <p>The OS's big problem with "real Typography" was always that the UPM's size alone is not enough of answer upfront "how big?" how much memory and etc. ... So, to handle Typography, there are now more numbers and tables in the font formats to answer the question in enough detail.  But still,  there's got to be a gross maximum unit system upon which, the UPM exists, and the type occupies, mostly within, but not exclusively within the em. That's the truce — we have 16,384 to build: an em (TT) and all the extent we need. But if you use it all on the em! (8x2048 you fools!), don't go outside of that 16,384, please, it could have consequences for all of us. . .</p>
      <p>Design's big problem with the EM is when the level of detail is under-whelmed by resolution. 1000 rarely needs to change for "normal" design detail. 2048 rarely needs to change for "any" design detail. The Linotype library was built on 8000 something. The Bitstream Library was built on 4320, and the Adobe Library was built on 1,000.  So, a designer's got to have something very special to render in a master (small relative to the upm, or large relative to the user), to make one choose something beyond 2048. </p>
      <p>I hope that's all true, still.</p>
