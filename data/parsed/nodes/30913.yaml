      <p>Back in 1995; I wrote something about UPEM for Microsoft. This was in relation to the 'head' table in a TrueType font and why 2048 was chosen for TrueType by Sampo Kaasila and Apple Computer. Basically it is because division on a computer (especially when TrueType was made) is slow and division can be achieved quickly by shifting bits if the values are powers of 2.</p>
      <p>* unitsPerEm should be a power of 2 (2048 ideally).</p>
      <p>What is a power of 2?<br>
      A value that is the product of 2 to the power of 'n'. For example, the ideal value of unitsPerEm is 2048. This is the product of 2 to the power of 11.</p>
      <p>Why a power of 2?<br>
      Division on computers is a very slow operation. One way programmers get around this problem is to use a technique of shifting bits for division. When a value is a power of 2, division can be performed by simply shifting the bits in the binary of that number. This is extremely fast and efficient.</p>
      <p>This method is similar to dividing by ten in a decimal system. To divide 1000 by 10, you only need to move the decimal place one value to the left. The result is the same as 1000 divided by 10 or 100.0.</p>
      <p>Why 2048?<br>
      2048 units were chosen for a few reasons:</p>
      <p>    * It is a power of 2 (2 to the 11th power).<br>
          * 2048 is a high enough value for good precision in rendering.<br>
          * 2048 is a low enough value to be processed efficiently by microcomputers.</p>
      <p>In the Asian fonts for Windows, MS Mincho and MS Gothic, it was necessary (at the time of their release) to choose a lower value (256 units) because of the file size of these font files.</p>
      <p>The actual units per em value is a balance between the amount of processing power, the complexity and size of the font file, and the amount of precision that can be obtained with this value. A low units per em value would result in less quality in the output, but be faster to process. A high units per em value would produce a higher quality output, but be slower in processing.</p>
      <p>Today, computers are more powerful than ever and the use of large fonts with thousands of glyphs is becoming more common, especially with Unicode and OpenType fonts. With today's computers, we suggest the 2048 units per em value as still the best value for all fonts of any size, including large Latin or non-Latin script fonts.</p>
