      <p>Some clarification from Microsoft's Greg Hitchcock:</p>
      <p><em>I'm fairly sure the reasoning in TrueType was all about performance. Integer math was much quicker than floating point. TrueType fonts preferred having the Units per EM (UPM) as a power of two because in all of the scaling of the outlines, one has to continually divide by the UPM. When that is a power of two it is much quicker and can be implemented with a "shift right" instruction. </em></p>
      <p>Of course higher UPM size give greater accuracy to the outline data, giving the equivalent of fixed fractional precision, but there is a trade-off in data size. For TrueType, outline data is typically stored as relative distances from the previous point. If the relative distance could be stored in a byte, it would be, otherwise it was stored in a 16-bit value. </p>
      <p>The higher the UPM, the less likely relative distances would fit into a byte. For some of our early Japanese fonts, we used 256 UPM in order to reduce the outline data size. 2048 UPEM was common in TrueType because it seemed like a good balance between data size and accuracy. The range for TrueType and OpenType is between 16 and 16,384 inclusive.</p>
      <p>Also see:<br>
      <a href="http://typophile.com/node/30727" title="http://typophile.com/node/30727">http://typophile.com/node/30727</a></p>
      <p>Cheers,<br>
      Adam</p>
