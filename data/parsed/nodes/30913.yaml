      <p><cite>What I especially want to know is what in your wisdom do you choose to work in today?</cite></p>
      <p>Which UPM is ideal to <cite>work in</cite>, meaning the design work regardless of technical issues, that is an interesting question. I typically switch between UPM of 1000 and 3000. As said before, scaling up is lossless as all coordinates are multiplied by three and scaling down to 1000 has relatively small rounding errors. Keep in mind that scaling from an UPM 2000 down to 1000 is the worst case: about every other value has a rounding error of 0.5, which can esily add up to stem inconsistencies. So generally avoid scaling things by exactly 50%.</p>
      <p>On the other hand, it is easy to forget that even a UPM of 1000 is much more than the typical printing resolution: For example, at 1200 dpi and a type size of 60 pt you have a 1:1 relation between dots and font units. This means that in order to change something only by one dot at, say 10 pt you need at least 6 units in Fontlab, even if that looks very much on the screen.</p>
