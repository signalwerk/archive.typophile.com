      <p>Hello Tim, thank you. For this typeface I am working on I had to choose a UPM of 2000, otherwise curves become disharmonic (it’s quite condensed). I started at 1000, then I modified some curves after scaling it to 2000, but scaling down back to 1000 produces some breaks in curves, and the curves end up being not harmonic and unpleasant.<br>
