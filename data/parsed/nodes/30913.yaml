      <p>If you want a UPM value higher than 1000 keep in mind the rounding errors when you scale the font up or down.<br>
      I typically use a UPM of 3000 as this is obivously lossless when scaling up (all values are multiplied by 3), and when scaling down the maximum rounding error is only 1/3, which is the lowest possible maximum rounding error you can get when scaling down.</p>
