      <p>Having said that, using a UPM size that is *lower* than 1000 is absolutely no problem, and using a UPM size that does not end with three zeros, and is not a power of two, is also no problem. So using the UPM size of 864 is just as fine as 1080 or 997 or 115, or even 13. In fact, I have seen pixelfonts designed on a 13 unit UPM size, with each "pixel" square was exactly one font unit high and wide. </p>
      <p>A.</p>
