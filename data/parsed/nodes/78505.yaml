    html: <p>Ascender says  <a class="freelinking external" href="http://www.ascenderfonts.com/font/cantoria-regular.aspx" rel="nofollow">"Cantoria™ Regular is Briton Ron Carpenter's 1986 take on Della Robbia, a typeface developed in 1902 by American book artist and type designer Thomas Maitland Cleland. Della Robbia, inspired by fifteenth-century Florentine stone-cut capitals, featured rounded, open letterforms, small wedge serifs, and some rather quirky design characteristics. With Cantoria Regular, Carpenter brings this Renaissance style into the digital age, regularizing the alphabet while maintaining its historical charm."</a></p>
    html_clean: <p>Ascender says  <a class="freelinking external link-external" href="http://www.ascenderfonts.com/font/cantoria-regular.aspx" rel="nofollow">"Cantoria™ Regular is Briton Ron Carpenter's 1986 take on Della Robbia, a typeface developed in 1902 by American book artist and type designer Thomas Maitland Cleland. Della Robbia, inspired by fifteenth-century Florentine stone-cut capitals, featured rounded, open letterforms, small wedge serifs, and some rather quirky design characteristics. With Cantoria Regular, Carpenter brings this Renaissance style into the digital age, regularizing the alphabet while maintaining its historical charm."</a></p>
