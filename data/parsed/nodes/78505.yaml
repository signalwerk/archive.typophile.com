  html: |-
    <p>Howdy,</p>
    <p>This is from a church letterhead, and I'm guessing the letterhead design is only 3-5 yrs old.  Periods are diamonds, and commas are diamonds with tails (to the left).</p>
    <p>And yes...it's simpler for me to go about ID this way, than asking one of the staff to call the company that made the letterhead.</p>
    <p>Cheers!</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/ltrhd_img_4920.jpg"></div><p></p>
