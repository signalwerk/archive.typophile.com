    <p>The meteg (ga’ya) is one of the most common accents in the Hebrew Bible, and it  serves two functions: phonetical <span class="amp">&amp;</span> musical.<br>
    It indicates a secondary accent. We said ‘accent’,  but it is not really  an&nbsp;accent. </p>
    <p>The meteg is  marked by  a short vertical stroke under the word, and generally before the stress syllable. It  resembles  the siluk, but has different functions (both are&nbsp;uni05BD).</p>
    <p>Grammatically(1)  there are ten different kinds of&nbsp;metegs.</p>
    <p>(1). If the phonetical <span class="amp">&amp;</span> musical  functions   are under one&nbsp;umbrella.</p>
