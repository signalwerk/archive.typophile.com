    <p>I'm designing a book for my advanced typography class, the book consists of a bunch of old (handwritten) letters and poems from my grandfather to my grandmother, along with pictures of them throughout the years. My inspiration behind this design is this album cover: <a href="http://www.fixtstore.com/img/graphics/tyronewells/TyroneWells_MetalandWood.jpg" title="http://www.fixtstore.com/img/graphics/tyronewells/TyroneWells_MetalandWood.jpg">http://www.fixtstore.com/img/graphics/tyronewells/TyroneWells_MetalandWo...</a></p>
    <p>Let me know if you like it or think it could work...</p>
