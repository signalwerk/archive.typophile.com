      <p>The x-height seems to be higher than in e. g. Adobe’s Kabel, bot not as high as in the ITC version.<br>
      The accent, the round i-dot, the letter /u/ and the vertically cut bars of the /F/ are different from any Kabel cut.</p>
      <p>So I’d say yes, custom.</p>
