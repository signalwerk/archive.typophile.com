    html: |-
      <p>Actually, the use of “type font” may make sense here, to distinguish “font”, as physical or digital instance, from “type face”, which is a design capable of being expressed in various media by various hands. The idea being wrestled with, is that a particular font is a dateable iteration of a typeface design.</p>
      <p>The problem is that in popular usage, “font” has come to mean the same as “typeface”, losing the distinction between the two. So while we may think “type” is a redundant prefix to “font”, that’s not so for the writer here, who may be attempting to re-establish the distinction.</p>
