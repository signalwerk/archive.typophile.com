    html: |-
      <p>Perhaps Jhilgert is using FontLab Studio 5. If so, you need to add a kerning class in the Classes panel and define your kerned glyph as a key glyph. The class definition would look like:<br>
      <code>_E: E' Eacute Egrave</code><br>
      (Remember to click on Apply in the Classes panel). Then, you need to define the context in which kerning should be applied using the checkboxes next to the class name in the classes list. </p>
      <p>That's all. (Your Metrics Window needs to be in Class Kerning mode or Class Kerning with Exceptions mode.)</p>
      <p>The kerning values for the dependant glyphs are always linked to those of the key glyph, unless you define an exception. So you don't need to create classes only after your kerning is finished. But the glyphs that you add to the class need to exist.</p>
