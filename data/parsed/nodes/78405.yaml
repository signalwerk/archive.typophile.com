    <p>I have a typeface I've been working on tediously for weeks and I've kerned the lowercase and uppercase very carefully.<br>
    Then, I went ahead and made the accented characters, etc...</p>
    <p>I want to apply my kerning for certain existing (kerned) glyphs into a "class."</p>
    <p>For example, I have kerned the "E" and I'd like to make a new class and apply the kerning I've already done for the "E" to all of the other "Egrave, Eacute..." </p>
    <p>I'm pretty good about being a fast learner, but this has stumped me.<br>
    I really hope there is a way to do this, otherwise, class kerning has to be done after ALL characters/glyphs are complete, which I think would be BS, being a software owner myself.</p>
    <p>Any help would be greatly appreciated.</p>
