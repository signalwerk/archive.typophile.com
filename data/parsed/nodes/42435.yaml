  html: <p>Hey! Does anyone know of a dingbat font that has a glyph of footprints (shoe-shaped). I am designing a leaflet with a guided tour and it would be good to have the trail shown by shoes marching around the page. I found bare feet ones somewhere, but would prefer shoe prints really. any ideas? thanks!</p>
