    <h2><a href="/node/49923" title="Join the Typophile LinkedIn Group">Join the Typophile LinkedIn Group</a></h2>   <p>If you’re using LinkedIn, the professional networking site, you can add Typophile to your professional affiliations by joining the Typophile group. </p>
    <p>To join, hit this link: <a href="http://www.linkedin.com/groups?gid=932947" title="http://www.linkedin.com/groups?gid=932947">http://www.linkedin.com/groups?gid=932947</a></p>
    <p>Over the years people have discussed the value of listing Typophile membership among their professional associations.</p>
    <p>Although membership is an opt-in thing. And although we ask for member contributions, we don’t require a fee to join. However, we view a Typophile affiliation as a signal of where your personal and professional interests lie and we feel a public LinkedIn group is one way for people to get direct value from the Typophile community as a networking vehicle.</p>
