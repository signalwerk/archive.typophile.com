      <p>You could tell us the surname so we could fit them better together (kerning-wise too).<br>
      I'll try going through Bringhurst's glossary of characters (some serious, some joking):</p>
      <p>Cedilla (for a girl, perhaps)?<br>
      If the baby was redhead you could call him/her Dumb Caret (not sure it's “^” or another one I'm missing)!<br>
      Or maybe Dumbquotes! :P<br>
      Dyet (“Đ”)? :P Dyet Coke!<br>
      Ethel (“œ”)!<br>
      Hedera (ivy leaf fleuron)!<br>
      Háček (caron, inverted circumflex like over the lc C) or Kroužek (ring), a nice pan-european feel to it…<br>
      Solidus (fraction bar)?<br>
      Well, not Sputnik…<br>
      Nor Swung Dash!</p>
      <p>(Going through to the glossary of terms)<br>
      Well, not Bastarda!<br>
      Bitmap? :P The other day I was suggesting Pixel for a friend's cat.<br>
      Well, certainly not Lettrine! xD<br>
      Quaint is kind of nice and original…</p>
      <p>Well, then you've got names of designers and their typefaces… if they have any preferences, they could try and go with those. I really like Columbus, for example, designed by Patricia and David Saunders and Robin Nicholas. But I guess calling a kid Columbus would be a little too “cumbersome”.</p>
