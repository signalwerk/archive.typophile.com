      <p>Good work!<br>
      IMVHO, the spacing is not right at all. l are too tight, the spacing of e &amp; i is unbalanced, they are too much to the right.<br>
      In terms of design: the g does not really fit; why did you do all these ink-gaps? what size do you want this printed? are you sure the ink gaps are consistent? there seems to be a u/n issue with the u too wide, no? the sa couple does not work, no?</p>
      <p>Of course, I am self-teaching myself type design so I may be wrong, I am simply trying to contibute to the debate &amp; hopefully be told I am wrong &amp; why so that I can improve.</p>
