  - id: 381120
    user: 16061
    date: 2009-11-29T09:39:00
    date_raw: 29 Nov 2009 — 9:39am
    votes: null
    html: |-
      <p>Thank you to Cerulean and dojr2 its great to have feedback.<br>
      The idea for erato was to see how I could make a roman<br>
      typeface with a cursive structure. </p>
      <p>In the lowercase n, h, m, etc the junction is as low as possible<br>
      less so in the characters with bowls.<br>
      After I did this it seemed to need an ink trap so the join<br>
      wouldn't look so dark.<br>
      The spacing has been done very roughly and there are no<br>
      kerning pairs.<br>
      And dojr2 you are spot on the g doesn't flow enough but i don't want a one story<br>
      g so I will try and get this form to work. </p>
      <p>Thanks again for the comments</p>
