    html: <p>I like it.  I especially like the use of contrast in the lowercase letters.  One thing that strikes me as a little off is the capital R; the bowl stroke begins to thin as it comes down and around but is then eclipsed by the heavier leg stroke; I'd like to see those two strokes harmonized a bit more.  But on the whole it's quite attractive.  Nice work.</p>
