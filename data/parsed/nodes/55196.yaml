    <p></p><div class="imageWrap"><img src="http://typophile.com/files/P2240047_5896.jpg"></div><br>
    This is the float where the theme was "Mario Bros." They all had hats with big "M's" on their hats. They all displays the logo on their shirts<p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/P2240055_3759.JPG"></div><br>
    This is a man! Yes a man! This is a middle aged man dressed like an old woman. At first, I thought it was a woman until he started scratching his hairy legs.<p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/P2240050_6603.JPG"></div><br>
    This is a float with everyone in Saints jerseys. The numbers on my home team's jersey looks like a collegiate typeface. <p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/P2240054_5748.JPG"></div><br>
    This float was a tribute to someone who died. Everyone wore shirts with messages on it. Their shirts and the words on the float was a script typeface.<p></p>
