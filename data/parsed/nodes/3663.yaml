    html: <p>At one job I was very unpleasantly surprised at how insulated my 4-man office was. The two principals never read Print or CA or any other design publication, so had only a vague idea of what current design looked like. <br> <br>I have to disagree with H�ctor. It's true that you set expectations early on, and by doing extra work you're telling them you don't value your free time. But it also shows you're dedicated and hardworking. And also it's professional to get the job done even if it's after closing time or on the weekend.</p>
