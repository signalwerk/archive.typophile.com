    html: <p>They were very much set in their ways. The funny thing was that they subscribed to both Print and CA, but they did so because that's what design companies do, not because they were interested in reading the magazines. I knew that place was the wrong fit for me, but I stayed a year because I wanted to give them a fair try. <br> <br>Another suggestion I'd have is to do things to keep design fun, even if the stuff you're working on isn't fun. I'm always bringing in personal projects and ideas from home to show my coworkers.</p>
