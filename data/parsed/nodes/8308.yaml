    html: "<p>Ive seen previous issues of 'Lodown' and they were quite nicely designed.. Back then they were all about life, surfskatesnow, style, music and what I would like to call 'alternate arts'.. <i>A tad too trendy sometimes, maybe, but nice nonetheless..</i> <br> <br>'Die Gestalten' released two books, '<a href=\"http://www.die-gestalten.de/display.php?template=verlag.php&amp;usetmpl=71&amp;cat=1&amp;sub=3&amp;item=132\" target=\"_blank\">Lodown</a>' + '<a href=\"http://www.die-gestalten.de/display.php?template=verlag.php&amp;usetmpl=71&amp;cat=1&amp;sub=3&amp;item=131\" target=\"_blank\">Schizophrenic</a>', dedicated to the design of 'Lodown'.: <br><i>&gt; <a href=\"http://www.die-gestalten.de/display.php?template=verlag.php&amp;usetmpl=71&amp;cat=1&amp;sub=3&amp;item=132\" target=\"_blank\">www.die-gestalten.de/display.php?template=verlag.php&amp;usetmpl=71&amp;cat=1&amp;sub=3&amp;item=132</a> <br>&gt; <a href=\"http://www.die-gestalten.de/display.php?template=verlag.php&amp;usetmpl=71&amp;cat=1&amp;sub=3&amp;item=131\" target=\"_blank\">www.die-gestalten.de/display.php?template=verlag.php&amp;usetmpl=71&amp;cat=1&amp;sub=3&amp;item=131</a></i></p>"
