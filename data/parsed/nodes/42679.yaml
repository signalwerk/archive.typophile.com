      <p>this idea has been explored several times in history. scriabin and goethe, in addition to stockhausen, are among the better known names to have attempted to codify music and color. there have been several systems devised, and copious information is available thru google searches on iterations of the topic. </p>
      <p>it seems more work has been done on color and visual information linked to audible music as an output process rather than as an input code. it would be interesting to reverse engineer an output model to create a usable input code and/or instrument.</p>
      <p>one of the immediate problems with correlating the visible spectrum to musical pitch is that (while both are vibrational and thus reducable to numerics) in colored light there is no true equivalent to the octave. the closest i've considered is value on a color spiral.</p>
      <p>i'm extremely honored to be cited on fred collopy's timeline of "rhythmic light" at :</p>
      <p><a href="http://rhythmiclight.com/archives/timeline.html" title="http://rhythmiclight.com/archives/timeline.html">http://rhythmiclight.com/archives/timeline.html</a></p>
      <p>you'll find me in 2003.</p>
      <p>but here's the treat : this image was reported to be the oldest known specimen of written music. it fits your description perfectly. its exact code is unknown but thought to represent loudness as size and voice as color. apologies but i can't link to its source. i found it online over a decade ago and haven't been able to find it again. vague memory of posting it before. poke me if i'm repeating myself.</p>
      <p>? coptic egyptian &lt; 2000 yrs ? </p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/copticmusic_4370.png"></div><p></p>
