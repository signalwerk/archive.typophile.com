      <p>This reminds me of Faulkner's original intent to publish The Sound and the Fury in multiple colors, but ultimately discounted for cost reasons.</p>
      <p>Your largest consumers of music (I would think) would be bands and orchestras, who purchase large quantities of sheet music at a time.  I know my high school has accumulated thousands of pieces of music, which when you consider each ships with about 20 different parts or more spanning one to many pages, the addition of color would get pricey (above all in the academic environment).</p>
      <p>Also, I know a lot of musicians who like to highlight and use different colors for different things which can then be done in the color the musician wants.  And speaking as someone who played euphonium, trombone, and tuba, once I learnt music, for concert performances I mainly only looked at the notes themselves.  Once you've practiced a piece enough you know what dynamics and stylings you need and where, and half the time the notes themselves are only reminders. Of course, most marching bands perform with no music at all (I did see one or two bands during my time in the Million Dollar Band using lyres, but they weren't Div IA schools and without the large music programs at larger universities). Remember, dynamics and other such markings are generally suggestions that may be ignored, extended, or otherwise modified depending on the needs of the group or the views of the conductor.</p>
      <p>In other words, I would think it would be more expensive without much benefit, at least for traditional music.</p>
      <p><em>«El futuro es una línea tan fina que apenas nos damos cuenta de pintarla nosotros mismos». (La Luz Oscura, por Javier Guerrero)</em></p>
