    <p>It seems like one could replace many of the markings in sheet music with color. Dynamics could be indicated by changes in hue or saturation; gradual change would represent a crescendo or decrescendo. Accents could be indicated by a sudden change on one note. Staccato could have a special color. Phrases even could be grouped somehow. You get the point.</p>
    <p>Unfortunately, I've never seen any sheet music printed in color except in books for beginners. Does anyone know of any large works of music set in color like this?</p>
