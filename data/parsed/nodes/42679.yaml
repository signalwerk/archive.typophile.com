      <p>If I remember correctly, the coloured lines on the Helicopter Quartet score are added to indicate the passing of the different lines of music between the players. I don’t believe that they are necessary for its realisation, apart from helping unpick the most complex bits of a texture.</p>
      <p>Another composer who I think used colour in his scores was Harry Partch as a method of fitting his 43-tone scale into conventional Western notation.</p>
      <p>Western notation is, undoubtedly, being forced in directions where it is not suited. Some of Brian Ferneyhough’s <a class="freelinking external" href="http://users.unimi.it/~gpiana/dm7/lanza/image102.gif" rel="nofollow">scores</a> particularly come to mind in terms of pure complexity. There are also some philosophical problems are occasionally aired. For instance, Western notation lends itself to notation pitch and rhythm with a high degree of precision, whilst dynamics and articulation are only roughly suggested. However, I think that notational reform suffers from the same problems as suggested reforms to the alphabet; once people have learnt how to read, it is much easier to struggle through complex scores than to start again. Even relatively helpful innovations, such as Schoenberg’s signs for indicating the dominant and secondary lines have not caught on.</p>
      <p>ingemisco, if you have used it, how does SCORE compare to <a class="freelinking external" href="http://lilypond.org/web/index" rel="nofollow">Lilypond</a>? It’s not an application which I have come across before. Playing off Sibelius’ed parts is never a good experience...it’s a bit like reading a novel set by the default settings of Microsoft Word.</p>
