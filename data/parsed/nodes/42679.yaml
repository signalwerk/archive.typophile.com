      <p>Stockhausen indeed used colour in some scores. The (notorious) Helikopter-Streichquartett score is in four colours; you can take a look at the <a class="freelinking external" href="http://www.stockhausen.org/heli_pg_1.html" rel="nofollow">first page</a>. There was another score, one of the scenes of Mittwoch aus Licht (Michaelion I think, but I might be wrong) which used colour for the dynamics, with gradients from one colour to another for crescendo/diminuendo.</p>
      <p>Thomas Ades' piano piece 'Darknesse Visible' (based on a song by John Dowland) is also printed in different colours, with the colours distinguishing different transformations of the original material which overlap. (Then there's a nice touch at the end where a fragment of the original appears verbatim, extremely quitely, which is printed in grey.)</p>
      <p>Those are the only ones which spring to mind just now, but I'm sure there are others. I was lately engraving a rather complex new piece (I'm a typographer of music rather than text, but so many of the same principles apply) for string quartet, each player of the quartet is supposed to switch rapidly between two highly contrasting 'musics', as though there were two quartets going on at once. In the end we settled on a sort of double-tier of staves (so there would be up to eight staves at once), but one of ideas the publisher was originally considering was to print that section in two different colours. (Actually, from my point of view, that would possibly have been simpler to set...)</p>
