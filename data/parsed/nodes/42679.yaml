      <p>Humans distinguish pattern much better than they distinguish colour, and the higher the contrast the better the pattern recognition. So while using colour to notate musical dynamics presents some interesting possibilities it is not very practical, especially in terms of sight-reading.</p>
      <p>A few years ago, I went and found the scores for some string quartets by Sofia Gubaidulina to which I'd been listening. The scores were visually fascinating, but completely baffling to me. There was very little in them that I recognised from a fairly basic knowledge of typical classical musical notation. Lots of squiggles.</p>
    html_clean: |-
