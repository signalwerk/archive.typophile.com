      <p>Well in the olden days it really was engraving (there's at least one publisher which still does almost everything that way); the term has just sort of persisted, at least among some of the `hardcore'. The other problem is that there's not really a better term that is widely understood. `Music typesetting' is clearest I suppose, but for some reason I don't like it. `Music origination' is another one I've encountered. So, anyway, I call myself a music engraver even though it's not literally true, and sounds vaguely pretentious :)</p>
      <p>I use SCORE (a nice old-fashioned DOS program) which is what most of the bigger publishers use for serious work, though Finale has its advocates too. (Sibelius, though now ubiquitous and undeniably feature-laden and user-friendly, is nowhere near good enough.)</p>
