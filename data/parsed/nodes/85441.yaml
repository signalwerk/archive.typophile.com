      <p>Now <strong>this</strong> is how you properly reference something. Below is a reference of a book chapter, English translation, reprinted from another source (according to APA 6):</p>
      <p>————</p>
      <p>Tschichold, J. (1991). Consistent correlation between book page and type area. (H. Hadler, Trans.). In R. Bringhurst (Eds.), <em>The form of the book. Essays on the morality of good design</em> (pp. 36–64). Washington, United States: Hartley &amp; Marks Publishers Inc. (Reprinted from <em>Aufsätze über Fragen der Gestalt des Buches und der Typographie</em>, by J. Tschichold, Ed., 1975, Basil, Switzerland: Birkhäuser Verlag)</p>
      <p>————</p>
      <p>Never mind hyperlinking book titles.</p>
      <p>a) they can suffer from <a>link rot</a></p>
      <p>b) if your reading list is set in a proper reference format and your students publish, they can simply copy and paste from your master list into their references section. </p>
      <p>This is standard practice in (my circle of scientific) academia. In the printed publication the first line would be outdented, but I don’t know how to do that here without forced line breaks.</p>
