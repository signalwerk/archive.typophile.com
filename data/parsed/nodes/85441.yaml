    <p>Every semester my students ask me for a lists of books about typography, lettering, calligraphy, and type design. To make list keeping easier for all involved I set up a new web site, <a href="http://www.type-library.com">Type Library</a>, that includes a wide range of books with links for purchasing them. Please check it out and let me know what you think.</p>
    <p>And I realize that there are a great many books not on the list. I will keep adding to the list as time allows.</p>
