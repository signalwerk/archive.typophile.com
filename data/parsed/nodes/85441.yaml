      <p>@christopher<br>
      &gt;This is standard practice in (my circle of scientific) academia. In the printed &gt;publication the first line would be outdented, but I don’t know how to do that here &gt;without forced line breaks.</p>
      <p>You mean hanging indents, I suppose. (APA) It isn't the top line that's outdented it's everything else that is indented. that is, as far as I'm aware, the left margin stays the same as the body of the paper.</p>
      <p>Here's a shot at doing it in a comment:</p>
      <p>Tschichold, J. (1991). Consistent correlation between book page and type area. (H.<br>
