      <p>Complete academic citations would make a real mess out of the site. Putting that much information in turns it into a massive academic bibliography, which is not an easy thing to browse. To make it work I would really need to use a more powerful CMS system that could store each book as a database entry and offer detailed information when requested. I am already planning to do this just to make adding images, sorting, etc. possible, but only if there is enough interest from users. I am actually surprised at the high level of interest; if it continues I might launch a kickstarter to pay for an overhaul.</p>
      <p>I am also not interested in helping students copy/paste formatted citations; if they really looked something up they can prepare their own. If my experience with undergrads is any indication they need the practice!</p>
