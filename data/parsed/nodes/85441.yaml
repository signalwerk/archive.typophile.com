    html: |-
      <p>“<em>…which is not an easy thing to browse.</em>”</p>
      <p>I agree, the above example is very complex, but that’s probably as hard as it gets. For the most part, if it’s just a book, I think it would be simple for the lay-person to browse:</p>
      <p>Bringhurst, R. (2005). <em>The elements of typographic style</em>. Hartley &amp; Marks Publishers Inc. Washington DC,  United States.</p>
      <p>Authour, year, title, everything you need for a simple search. But I do agree, students need practice. It took me some time to get familiar with APA, and to date, there are many in my lab who do not know it fully. Not even the department chair knew how to do the complex example I showed previously. But then again, I guess they don’t need to. That’s what they pay RAs for.</p>
      <p>A well coded (tagged) database would be a wonderfully useful tool. Once the structure is in place, you simply need to add to it as you go. It takes time, but after 2-3 years, you’d be surprised ah what you can end up with. I can’t imagine what would happen with an open-source approach. I would recommend starting with a spreadsheet. Depending on the context, I use this for article reviews which helps other authours contribute.</p>
      <p>Paying someone to develop a custom fillable form to populate a database may well be worth it.</p>
