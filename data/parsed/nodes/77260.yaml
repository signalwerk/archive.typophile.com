    <p>I noticed in the release notes that Apple has added hyphenation to iBooks:</p>
    <p>* iBooks now fits more words per page by automatically hyphenating text, available only on iOS 4.2 or later.</p>
    <p>Which seems like kind of an odd way to present it, but there it is.</p>
    <p>Now if I could only get H&amp;J on my Kindle v1.</p>
