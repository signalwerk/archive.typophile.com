      <p>I would say the "W" has a strange contrast.<br>
      I would thicken the 3rd stroke of "W".<br>
      W contrast = 1st stroke thick 2nd thin 3 thick 4 thin again. As a rough explanation!<br>
      To have a changing contrast with up- and downgoing strokes -<br>
      as you have at "M" "N" "X" "Y".<br>
      Compare changing contrast of M with W...</p>
