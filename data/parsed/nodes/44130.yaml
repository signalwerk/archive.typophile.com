    <p>Hello typophiles!</p>
    <p>I've been lurking around the website for a while now, and I finally decided to jump into the pool. I think it's still to early to post a font design (especially since I only made the caps so far), but I can't resist the urge to hear some of your oppinions.</p>
    <p>As stated in the title of the thread, this is my first attempt at creating letters and the design was guided mostly by intuition (and a book). The general, yet vague idea behind the design is creating a functional and somewhat corporate sans (I work in the shady area of B2B design).</p>
    <p>So, what do you think?</p>
    <p>All the best,<br>
    Cristian.</p>
