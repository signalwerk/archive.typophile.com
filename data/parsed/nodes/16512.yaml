    <p><strong><em>The Work of Ismar David</em> is a showcase of graphic design, book arts, and architectural design</strong><br>
    A key RIT graphic arts collection is celebrated in a new book.</p>
    <p>Ismar David (1910–1996), an artist of extraordinary range and ability, mastered a variety of media during the course of his long career in Berlin, Jerusalem, and New York. In tribute to his achievements, RIT Cary Graphic Arts Press has now published <em>The Work of Ismar David</em>—the first comprehensive volume on the designer’s oeuvre—that includes vivid reproductions of his book and type design, illustration, calligraphy, and architectural adornment. Content for the book was selected from the extensive Ismar David Archive, held in the <a href="/node/13756" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Melbert B. Cary Jr. Graphic Arts Collection</a> at Rochester Institute of Technology (<a href="/node/add/wiki?edit%5Btitle%5D=RIT" title="Create node &quot;RIT&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">RIT</a>).</p>
    <p>Acclaimed typographer <a href="/node/12150" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Hermann Zapf</a> has written, “The work of Ismar David can always be identified by his characteristic style. . . His expressive drawings, with their undulating linear quality and unusual construction, show his elegant style in every detail.” The book features over 150 examples of his work, often embellished with beautiful lettering and calligraphy, which David executed for private commissions and corporate clients alike. Of special note are showings of his major typeface design, “David Hebrew,” originally issued in the 1950s by the Intertype and Stempel type foundries.</p>
    <p><em>The Work of Ismar David</em> includes an extensive color plate section, as well as an authoritative biographical sketch of the artist, written by Helen Brandshaft. The book concludes with a selected list of American architectural sites containing David’s work, and a meticulous 15-page bibliography of his known book projects. Research for the book was carried out at the Cary Graphic Arts Collection, which holds numerous important Design Archives. To download a finding aid to the contents of the Cary Collection’s Ismar David Archive, visit: <a href="http://library.rit.edu/cary/CCpages/CCAids.html">http://library.rit.edu/cary/CCpages/CCAids.html</a> .</p>
    <p><em>The Work of Ismar David</em><br>
    Selected by Helen Brandshaft, edited by David Pankow<br>
    RIT Cary Graphic Arts Press, 2005<br>
    Paperback, 160 pages; color ill., 8 x 11 in.<br>
    ISBN 0-9759651-2-3, $29.95<br>
    Order from <a href="http://library.rit.edu/cary/carypress.html">http://library.rit.edu/cary/carypress.html</a></p>
    <p>Helen Brandshaft collaborated on several design projects with Ismar David—among them are editions of The Family Haggadah for Passover, and The Book of Jonah. She runs the Shunammite Press in New York City.</p>
    <p>David Pankow is the curator of the Melbert B. Cary, Jr. Graphic Arts Collection, and currently edits the scholarly journal, Printing History, published by the American Printing History Association. He is also a professor in the RIT School of Print Media.</p>
    <p>RIT Cary Graphic Arts Press is the publication arm of the Melbert B. Cary, Jr. Graphic Arts Collection at Rochester Institute of Technology, a renowned resource for those studying printing history, bookbinding, typography, papermaking, calligraphy, and book illustration processes.</p>
    <p><img src="/sites/default/files/old-images/DavidCoverLG.jpg"></p>
