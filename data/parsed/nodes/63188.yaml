    html: |-
      <p>That is exactly the problem I'm having of late.</p>
      <p>Suddenly, ALL of the files I open do this, where the characters are suddenly too big and all the diacritics get cut off.</p>
      <p>If I dump the pref file (Fontlab 5.0.4, OS X 10.5.7 and now 10.5.8) com.fontlab.fontlab5.plist the first time I open a file it'll usually be fine, then I open another and that new one is back to too large, and every other file opened after that is also broken the same way. Even happens to system fonts I've never touched before. The edit screen for each glyph is too large as well, over magnified compared to where it should be regularly.</p>
      <p>Should look like this (and does originally):</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/ex01_5522.jpg"></div><p></p>
      <p>Then all become like this:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/ex02_5355.jpg"></div><p></p>
      <p>Update: </p>
      <p>Turns out, in trying to get a good description of what is happening to compare, it is a specific one of my files - somehow corrupted and causes this problem when I open it. It then cascades to all other files until I dump the prefs again. I copied out my glyphs to an older version of the file and everything works, no problems (so far), and all other files continue to display correctly.</p>
      <p>So if these grabs above look like your problem, try dumping the prefs, and then copying to a new or older version and see if that helps.</p>
      <p>Mcs</p>
