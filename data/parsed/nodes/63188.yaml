    html: <p>Try "Visual ascender" in Preferences &gt; Glyph &gt; Dimensions. Or put a global guideline in GW, right-click it and select Guideline is &gt; Visual ascender.</p>
    html_clean: <p>Try "Visual ascender" in Preferences &gt; Glyph &gt; Dimensions. Or put a global guideline in GW, right-click it and select Guideline is &gt; Visual ascender.</p>
