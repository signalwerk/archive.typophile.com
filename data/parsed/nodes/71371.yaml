    <p></p><div class="imageWrap"><img src="http://typophile.com/files/parisineptfgris_launch_5182.png"></div><p></p>
    <p>During the summer 2009 we’ve been asked by Real Simple to customize Parisine PTF for their own use. We've adjusted few things for Real Simple and created new weights. Today, we've integrated this idea of intermediate weights into <a class="freelinking external" href="http://www.typofonderie.com/alphabets/view/ParisinePTFGris" rel="nofollow">Parisine PTF Gris</a>: A new Regular between the original Parisine PTF Clair Bold and Parisine PTF Regular (as on the image above). Bold follow same mechanism. Finally, it’s also why this new sub-family was called *Gris* (Gray in English).</p>
    <p>-- All details: <a href="http://www.typofonderie.com/alphabets/view/ParisinePTFGris" title="http://www.typofonderie.com/alphabets/view/ParisinePTFGris">http://www.typofonderie.com/alphabets/view/ParisinePTFGris</a><br>
    -- New weights comparison charts in pdf: <a href="http://www.typofonderie.com/html/ParisinePTFWeightsCharts.pdf" title="http://www.typofonderie.com/html/ParisinePTFWeightsCharts.pdf">http://www.typofonderie.com/html/ParisinePTFWeightsCharts.pdf</a><br>
    -- Same via via Issuu: <a href="http://issuu.com/typofonderie/docs/parisine_ptf_weights" title="http://issuu.com/typofonderie/docs/parisine_ptf_weights">http://issuu.com/typofonderie/docs/parisine_ptf_weights</a><br>
    -- Full pdf specimen: <a href="http://www.typofonderie.com/icono/alphabets/pdf/ParisinePTF_pdf.pdf" title="http://www.typofonderie.com/icono/alphabets/pdf/ParisinePTF_pdf.pdf">http://www.typofonderie.com/icono/alphabets/pdf/ParisinePTF_pdf.pdf</a><br>
    -- Test it online: <a href="http://www.typofonderie.com/alphabets/try/ParisinePTFGris" title="http://www.typofonderie.com/alphabets/try/ParisinePTFGris">http://www.typofonderie.com/alphabets/try/ParisinePTFGris</a></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/ParisinePTFGris_comparison_4579.gif"></div><p></p>
    <p><a class="freelinking external" href="http://www.typofonderie.com/alphabets/view/ParisinePTFGris" rel="nofollow">Parisine PTF Gris</a> feature intermediate weights between Parisine PTF Clair and Parisine PTF. Perfect for lighter text settings. Parisine PTF family now include 16 weights.</p>
    <p>4 weights pack from € 210 / $ 256 for 8 users.<br>
    <a class="freelinking external" href="http://www.typofonderie.com/alphabets/order/ParisinePTFGris" rel="nofollow">Buy it!</a></p>
    <p><a class="freelinking external" href="http://www.typofonderie.com/alphabets/view/ParisinePTFx4" rel="nofollow">Parisine PTF x4</a><br>
    Based on the fact now Parisine PTF is now a large family, a new offer was launched: <a class="freelinking external" href="http://www.typofonderie.com/alphabets/view/ParisinePTFx4" rel="nofollow">Parisine PTF x4.</a> An excellent way to buy 16 series for the price of 12 series.</p>
    <p>4 weights pack from € 630 / $ 769 for 8 users (save € 210 / $ 256.)<br>
    <a class="freelinking external" href="http://www.typofonderie.com/alphabets/order/ParisinePTFx4" rel="nofollow">Buy it!</a></p>
