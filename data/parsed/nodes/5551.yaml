    html: '<p>Hello Mr. David Hubner: <br>you could make a second remix of PlayR in the future <br>to make it a text font, I think I would like to check it <br>printed at small bodies, say 9 to 5 pt. <br>I like when someone post something in the "News &amp; Events" <br>even more if who does is not a big and famous foundry <br>(nothing against foundries being big); <br>I am saying this because in my experience the good things <br>come from the cellar so that was also a question about <br>your cellar. <br>Best, <br>AS</p>'
