    html: '<p>Mr. David Hubner: <br>my question is about the idea behind the fittings, <br>the color spots where some strokes meet one another. <br>It looks so uneven that I might think that it works better <br>printed at 5 pt. Or then why you didn`t planned this pimple <br>for all the letters? Now it is aesthetically unpleasant. <br>  &gt; Are you asking what its usable for? What do you think? <br>No, but to answer you I think that it could denote certain <br>new synthetic music styles or cosmetics for pimples :-) <br>(No offence, I am joking). If I like it? <br>I don`t because it is a pity that intending to design a light <br>&amp; delicate typeface you ended up working on the black instead <br>that on the white, or am I wrong?  I mean: "Write the story. <br>Take out all the good lines, and see if it still works." <br>Best, <br>AS</p>'
    html_clean: '<p>Mr. David Hubner: <br>my question is about the idea behind the fittings, <br>the color spots where some strokes meet one another. <br>It looks so uneven that I might think that it works better <br>printed at 5 pt. Or then why you didn`t planned this pimple <br>for all the letters? Now it is aesthetically unpleasant. <br>  &gt; Are you asking what its usable for? What do you think? <br>No, but to answer you I think that it could denote certain <br>new synthetic music styles or cosmetics for pimples :-) <br>(No offence, I am joking). If I like it? <br>I don`t because it is a pity that intending to design a light <br>&amp; delicate typeface you ended up working on the black instead <br>that on the white, or am I wrong?  I mean: "Write the story. <br>Take out all the good lines, and see if it still works." <br>Best, <br>AS</p>'
  - id: 39737
