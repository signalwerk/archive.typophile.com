    html: <p>Alessandro, I am not too sure if I understand your question correctly.. <br> <br>Are you asking what its usable for.? ( Or if its usable at all.? ) <br>What do you think.? Do you like it.? Why / Why not.? <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> <br> <br><i>( Its a 'fun' display type.. Nothing too serious at all.. Its just something I wanted to do for quite some time now.. The original idea and scribbles were created more than two years ago.. Originally for a different font, named 'Play' and this may be the remixed version, then.. 'formlos PlayR'.. )</i></p>
    html_clean: <p>Alessandro, I am not too sure if I understand your question correctly.. <br> <br>Are you asking what its usable for.? ( Or if its usable at all.? ) <br>What do you think.? Do you like it.? Why / Why not.? <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> <br> <br><i>( Its a 'fun' display type.. Nothing too serious at all.. Its just something I wanted to do for quite some time now.. The original idea and scribbles were created more than two years ago.. Originally for a different font, named 'Play' and this may be the remixed version, then.. 'formlos PlayR'.. )</i></p>
