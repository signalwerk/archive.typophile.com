    html: <p>Thank you.. I am also working on a few faces, intended for text use.. <br>And maybe there will really be a ( more usable ) version of 'Play' / 'PlayR' in the near future.. <br><i>( As I am currently in the 'Think, Scribble &amp; Design' process, this may still take some time.. )</i> <br> <br>And, I am pretty happy and excited about being able to release my type experiments and fonts under my own 'Cellar Type Foundry'.. <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> <i>( Even if the 'exposure' and the audience may not be as big as being a 'featured' type designer, at other famous font foundries.. )</i></p>
