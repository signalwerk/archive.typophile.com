    date_raw: null
    votes: null
    html: "<p>Thank you, Mr. Alessandro Segalini.. I think I see ( some of ) your points.. <br>Still, this is an experimental typeface, a 'fun' display face, like I stated before.. <br> <br><i>( Sure.: Some may like it, some may not.. )</i></p>"
    html_clean: "<p>Thank you, Mr. Alessandro Segalini.. I think I see ( some of ) your points.. <br>Still, this is an experimental typeface, a 'fun' display face, like I stated before.. <br> <br><i>( Sure.: Some may like it, some may not.. )</i></p>"
