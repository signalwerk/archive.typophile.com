    html: |-
      <p>Seen in the back of Modern Signs and Show Cards by E. C. Matthews published 1952, a supplement to Sign Slogans and Snap Shots.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/modernsignsbook_4826.jpg"></div><p></p>
      <p>...</p>
      <p>Matthews comments:</p>
      <p>This elaborate piece of work was done 75 years ago and it was published in a big five dollar book "Alphabets, Monograms, Initials, Crests, Etc." back in 1885. I have one of the few copies still in existence. The original drawing measured 7 3/8 x 9 inches.</p>
      <p>Ripley once drew up a simplified version of it for use in his "Believe it or Not." I have heard that the inventor of the linotype machine went crazy because of the very intricate work involved. But I don't know what became of this modest artist who simply signed the monogram with the initial D.</p>
      <p>...</p>
      <p>I picked up that 121 page supplement, which is full of fantastic stuffs,  and a first edition The Book of 100 Type Face Alphabets by J. I. Beigeleisen, for just 5 bucks!</p>
