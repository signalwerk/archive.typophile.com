      <p>Ah, Chris, ye of little faith. I wouldn't have said it was a misquote unless I believed it and had good reason for doing so.</p>
      <p>Here's the whole story:</p>
      <p>When asked about his favorite font, Shantanu said that Warnock was an amazing series of fonts. When the reporter looked confused (didn't recognize the name), Shantanu asked if he was familiar with our founder John Warnock. In the fact-checking stage, we clarified that Shantanu's favorite font is Warnock Pro but did not get into its origins.</p>
      <p>The reporter likely deduced from the name of the fonts, and then Shantanu's reference to John, that John created the fonts. This of course is not the case, and Shantanu didn't say so.</p>
      <p>But given that it was a positive story, and a very logical misunderstanding (not a willful or sloppy mistake), Adobe PR didn't feel it was necessary to follow up with a request for correction.<br>
      However, they'll be sure to be more precise if the question arises again.</p>
      <p>It's actually kind of cool that Shantanu is familiar with Warnock Pro - it's not one of our standard corporate typefaces (which are Myriad and Minion).</p>
      <p>Cheers,</p>
      <p>T</p>
