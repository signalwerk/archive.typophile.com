    html: <p>I guess it goes both ways though. I sat in the same row of offices as Robert Slimbach and Thomas Phinney for at least three years and neither one of them ever knew who I was or what I did.  In fact I'm pretty sure I could rob Robert in broad daylight and if I faced him later in a police lineup he would say, 'I never saw that man before in my life.' They were both pretty much off in their own world, which is okay, since it looks like they haven't been too harsh on others doing the same.</p>
