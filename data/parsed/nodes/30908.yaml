      <p>As the instigator of the post, I should chip in my 2 cents. </p>
      <p>I suspected a partial quote or misquote was to blame. And the fact that the font was referred to as ‘Warnock fonts’ and not ‘Warnock Pro’ suggested that the PR handlers were out of the room, or had less grasp of Adobe fonts than the boss. </p>
      <p>Having said that, in 100 or 150 years, in type history books, Dr Warnock will likely be more closely associated with the Adobe originals library than the individual designers. In much the same way as Stanley Morrison is associated with the Monotype revivals. Sadly many in-house designers, even the best of them, will be at best a footnote.   </p>
      <p>But it’s not all doom-and-gloom. One of the things that makes the font biz special is that the individual designers are credited – every school kid knows who made Comic Sans, Verdana and Myriad, but what name do you associate with Mac OS X, Windows Vista, Photoshop CS3? Probably someone who contributed little if any code to the product.  </p>
      <p>Finally the conspiracy theories that have sprung up around Tom’s reply show why the PR folks often feel it’s better not to correct obvious errors.</p>
      <p>Finally, finally, how about Adobe in Seattle - birthplace of PageMaker and InDesign and home to Tom Phinney - it may not be as huge-mungus, but it's still important.</p>
