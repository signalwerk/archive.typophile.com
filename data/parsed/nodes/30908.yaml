    <p>In response to "What's your favorite font?" Adobe's Chief operating officer Shantanu Narayen told <a href="https://web.archive.org/web/20190403131708/http://www.forbes.com/business/2007/01/25/adobe-photoshop-flash-tech-intel-cx_df_0126adobe.html">Forbes</a>...</p>
    <p>"There are some Warnock fonts that are absolutely spectacular that we use within the company. John Warnock, as a founder of the company, did some amazing fonts."</p>
    <p>Brownie points for picking Warnock Pro, but crediting JW for 'doing' fonts seems to take things a bit far? Or maybe not. Hopefully Tom will set him straight. ;-)</p>
