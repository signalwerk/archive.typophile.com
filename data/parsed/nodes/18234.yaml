      <p>Supertipo Veloz was a "typographic system for the small printer" developed by Catalán designer Joan Trochut Blanchard in 1942. The "system" consisted of  several series (or modules) of building blocks (usually 14) from which one could construct any number of alphabetic variations. Additional complementary forms (swashes, tails, flourishes) were also available. A limited sample, illustrating the basic principle, appears below:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/super_veloz.gif"></div><p></p>
      <p>There's a nice article about the series in <em>Baseline</em> Vol. II, No. 2. A typographic conference in Spain in the last year or so (sorry, details escape me at the moment) had an exhibition of Trochut's work, for which a catalog was published. I'd love to buy a copy, but everywhere I've located the book (all in Europe), the postage costs as much or more than the book itself. And, at one point in time, Typerware had a "Trochut project" in the works, but it seems to have disappeared. I think I have a complete set of the building blocks in at least one of Trochut's modules in my "do something useful with my downtime" file folder at work; if you'd like to see more, I'll see if I can locate and post it.</p>
      <p>In any event, I love Trochut's work: my freeware font <strong>Conga Line</strong>, as well as my commercial works <strong>Novadam Obese</strong> and <strong>Super Bob Triline</strong> are all based on "the system."</p>
    html_clean: |-
