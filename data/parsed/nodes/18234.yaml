      <p>Thanks Nick, well put.<br>
      Now I get it.</p>
      <p>Edmund Fry's "Great Primer Script" used modular components.<br>
      The frontispiece of his 1824 Specimen is a fold-out: "A Scale to Facilitate the Composition of Edmund Fry's Great Primer Script".<br>
      Sorry, I don't have an image. It must have been a virtuoso task for compositors to work with Fry's system.</p>
      <p>"Fregio Mecano" (Italian, 1920s, anon.) is shown in "130 Alphabets and Other Signs" (page 102-103). An iteration of its system is marketed by Monotype as "Section Bold Condensed".</p>
      <p>Rian Hughes (Device) recent "Klaxon" shows an interesting way to construct a face from a limited number of components, along the lines of "LCD" (Alan Birch, 1981)</p>
