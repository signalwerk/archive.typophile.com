      <p>Here's a comparison of modular units for <strong>Albers Stencil</strong>, one of the <strong>Supertipo Veloz</strong> modules, and a typeface I recently released based on the work of Dutch designer <strong>H. Th. Wijdeveld</strong>, another De Stijl pioneer.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/trochut.gif"></div><p></p>
      <p>Although both Albers Stencil and Architectuur have twelve basic building blocks, Wijdeveld's system is by far the simpler: he constructed his letters out of stock brass rules, with only straight-line segments.</p>
