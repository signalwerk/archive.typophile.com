    <p>Im realizing a coordinated project with M.S. for the Typography  assignature,<br>
    the briefing of this project consists on realizing a catalog of "Typography<br>
    and Typographers on the XXth Century" the motor to ingnite the project was<br>
    the "SupertipoVeloz" by Trochut an outreageous  example of modular typography;<br>
    i would be widely interested on recieving any type of information on these<br>
    area, because I had found only  experimental  typographyies of the beginings<br>
    of the century (vanguard). Thank you for your attention.</p>
