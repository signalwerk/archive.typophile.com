    <p>From the filmmakers' blog at <a href="http://signpaintermovie.blogspot.com/:" title="http://signpaintermovie.blogspot.com/:">http://signpaintermovie.blogspot.com/:</a></p>
    <p>The Sign Painter movie is currently in Production as of March 2010. This documentary is about sign painters in America. Those who were and still are walking the streets and using their talent to get a message across. You see their work daily on windows, sandwich-boards, boats, cars, billboards, in businesses, playgrounds, farmers markets and even theme parks to name a handful of spots.</p>
    <p>Who are these people? Where did they learn their trade and is it a dying craft? Directors Faythe Levine &amp; Sam Macon will bring you their story over the next few years and document the process here on this blog.</p>
    <p>We welcome any photos, stories and connections you would like to send us at <a href="mailto:signpaintermovie@gmail.com">signpaintermovie@gmail.com</a></p>
