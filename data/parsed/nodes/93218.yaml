      <p>Other 'Albertus' implementors:</p>
      <p>ScanGraphic<br>
      Elseware<br>
      Miles, Inc.<br>
      The Font Company<br>
      Image Club Graphics (ICG) - had straight, rather than curved, stroke ends<br>
      Hewlett-Packard - had more extensive character set than most<br>
      Agfa Monotype (A different implementation than Adobe/Linotype's Albertus MT)<br>
      Albertus equivalents, copies, and/or clones:</p>
      <p>Flareserif 821 (Bitstream)<br>
      Adelon (Softmaker/B&amp;P Graphics)<br>
      Alert (Opti Castcraft)<br>
      Alhambra (Primafont)<br>
      Alberta (WSI/IMSI)<br>
      Alstrale Romana (WSI/IMSI)</p>
