    html: |-
      <p>It appears to be a quirk that's been there for a long time. At least since a file internally dated 1991 as published by Adobe in 1995. Fontlab shows a 3 unit drop from left to right, from 750 to 747. It is not in versions created by other companies or in other weights or variants.</p>
      <p> - Herb</p>
