      <p>In Adobe InDesign you can set the language of each paragraph of text through selecting it and setting<br>
      it's 'language'. Okay- I remember having to change this after modifying InDesign files for a catalog we were sent from Germany, so that I could spell check it.<br>
      In Illustrator- Show Options in the Character panel, then choose your language from the list at the bottom. (To change the language for just the selected type). </p>
      <p>Now, I've had to do this for spellchecking reasons (most of the ad stuff I do has to be bilingual) but I'm not positive that OT features are picking up on this setting... Just checking the keyboard wouldn't work too well for anybody who works in more than one language.</p>
