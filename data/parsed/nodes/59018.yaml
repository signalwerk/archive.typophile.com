    html: |-
      <p>Starting with CS3 InDesign does look at the language selection in determining whether to apply OT features or not. Through version CS2, however, all it did was choose a dictionary for spell checking and hyphenation.</p>
      <p>Having said that, there is a bug in CS3. I believe it was with the various forms of German not calling features correctly. Adobe documented that, and it was fixed in CS4.<br>
      Christian A. Harder</p>
