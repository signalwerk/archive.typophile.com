    <p>Hi there,</p>
    <p>I am trying to understand better OT features in commercial fonts since the features I write are pretty basic.</p>
    <p>When I check the following piece of code:</p>
    <p>-----------------------------------------</p>
    <p>feature dlig { # Discretionary Ligatures<br>
     # Latin<br>
    lookup dlig14 {<br>
        sub A E by AE;<br>
        sub I J by IJ;<br>
        sub O E by OE;<br>
        sub a e by ae;<br>
        sub i j by ij;<br>
        sub o e by oe;<br>
    } dlig14;</p>
    <p>lookup dlig15 {<br>
        sub period period period by ellipsis;<br>
    } dlig15;<br>
     language AFK ; # Afrikaans<br>
     language DEU ; # German<br>
     language NLD ; # Dutch<br>
     language ROM ; # Romanian<br>
     language TRK ; # Turkish<br>
    } dlig;</p>
    <p>-----------------------------------------</p>
    <p>... If I understand well the substitutions asked by the lookup "dlig15" and "dlig14"  will work only for the languages listed by the statements. Is that right?</p>
    <p>Another question:<br>
    Once the font is installed, what does the OT file in order to identify the language in use? Does it check the selected keyboard?</p>
    <p>Thanks in advance.</p>
    <p>Ramiro.</p>
