  html: |-
    <p>Looking for a serif face that would go well with Vitesse Sans.<br>
    Mostly to be used as a secondary typeface for an identity system.<br>
    The identity will most likely be in Vitesse Sans.<br>
    The serif, should preferably be something that works well for both print and web.<br>
    But only print faces are also welcome.<br>
    I'm thinking something in contrast to the rectangular aspect of Vitesse.<br>
    Any suggestions?</p>
    <p>Thank you</p>
