    <p>Hello, </p>
    <p>I just created a new logo and letterhead design for our company.  I am having a very difficult time finding a font to use in the body of our communications.  I have attached a PDF of the logo and an example of the letterhead.  Any help would be great. Also, if anyone has any suggesions for the logo type and/or changes that would tie it in better with a body font please let me know.     </p>
    <p>Thanks in adavance. </p>
    <p>Jesse</p>
