    <p>I stored a few fonts on my external hard drive a several months ago.</p>
    <p>When I try to install/open one there comes up an error messaging reading, "The requested is not a valid font."</p>
    <p>Is there any way to bring some of these fonts back?</p>
    <p>I think there's only been a small amount of data loss. :/</p>
