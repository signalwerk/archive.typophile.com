    <p>So, I have about 5 years experience as a designer. 3 years in publishing with some promotions experience, and a little over a year and a half at a small agency (5 people) specializing in animal health/medical advertising.</p>
    <p>My goal since getting out of publishing, has been to go work at an agency where my skills fit in- it’s not where I work now.</p>
    <p>So, taking a job at an internal design department for a company NOT involved in something I am really interested in (more medical stuff) is probably a step in the WRONG direction, yeah?</p>
    <p>My goal had been to keep building my portfolio in this job and on my own, for at least another 6 months, and really focus on the places where I live that would be a more diverse set of clients and hopefully it would be somewhere I could stay for awhile.</p>
    <p>I am 28, so I am kind of ready for something closer to a dream job.</p>
