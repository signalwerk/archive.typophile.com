      <p>I think you'll have trouble finding <em>successful</em> such designs because it's a very PoMo approach, and PoMo type has yet to mature. But there is zero reason this sort of thing can't work; historical faithfulness can be a crutch as much as it can be a shortcut to specific shape-solutions (and it's rarely much more than the latter). But of course breaking from precedent is more work, not least in terms of ensuring readability.</p>
      <p>So even if something hasn't been done successfully in the past, it's still true that all you need is a reason to make it now. And lacking any evidence that it's actually functionally harmful, this reason could actually be as simple as: "I like the way it looks." And remember, unlike display fonts, text fonts work "under the radar", so much stranger stuff can make sense.</p>
      <p>--</p>
      <p>The visual discord between the arches and the "r" in your first example could actually work; but I think it's better if the "r" isn't all alone (which BTW is the main reason I prefer the open-bottom binocular "g" - it can accompany the "s"). Your second "n" is very nice, and promising. End of story. :-)  However if you do want a precedent of how "wild" things can get, look at Fleischmann, especially his #65 (which people have yet to develop the cojones to properly revive).</p>
      <p>Related:<br>
      <a href="http://www.typographer.org/2005_06_01_digests.html" title="http://www.typographer.org/2005_06_01_digests.html">http://www.typographer.org/2005_06_01_digests.html</a> (see my comment, about halfway down)<br>
      <a href="http://typophile.com/node/13307" title="http://typophile.com/node/13307">http://typophile.com/node/13307</a> (with repeated apologies, but not for not covering it up)</p>
      <p>hhp</p>
