      <p>Look for example at H&amp;FJ's <a class="freelinking external" href="http://www.typography.com/fonts/font_overview.php?productLineID=100017" rel="nofollow">Mercury</a>, which shows more than two different terminal styles. I certainly think there's nothing wrong with it, it is principally a matter of getting the contrast right and keeping consistency afloat. Getting the contrast right is more difficult when working on semi serifs (a successful example is <a class="freelinking external" href="http://www.myfonts.com/fonts/urw/alcuin/" rel="nofollow">Alcuin</a>). As far as the mixing of styles goes, the task really boils down to mixing them consistently <em>enough</em>. Mixing styles will get in the way of achieving consistency, that's for sure.</p>
      <p>I stumbled upon the same problem when working on my last typeface <a class="freelinking external" href="http://www.myfonts.com/fonts/alexis-luengas/meleo/" rel="nofollow">Meleo</a>. What I learned from it is that if you're going to bring two different terminal styles together, you better make those styles <em>clearly different</em>.</p>
    html_clean: |-
      <p>Look for example at H&amp;FJ's <a class="freelinking external link-external" href="http://www.typography.com/fonts/font_overview.php?productLineID=100017" rel="nofollow">Mercury</a>, which shows more than two different terminal styles. I certainly think there's nothing wrong with it, it is principally a matter of getting the contrast right and keeping consistency afloat. Getting the contrast right is more difficult when working on semi serifs (a successful example is <a class="freelinking external link-external" href="http://www.myfonts.com/fonts/urw/alcuin/" rel="nofollow">Alcuin</a>). As far as the mixing of styles goes, the task really boils down to mixing them consistently <em>enough</em>. Mixing styles will get in the way of achieving consistency, that's for sure.</p>
