      <p>Thanks. I’ve read Yves’ review multiple times before (it mentions Mercury, if I remember correctly). I also have a ragged old 1800-something edition of <em>De Mensch</em> typeset one of  Fleischmann’s types. I’m not sure if I find it very relevant to this experiment though. </p>
      <p><em>What I learned from it is that if you're going to bring two different terminal styles together, you better make those styles clearly different.</em><br>
      It’s not so much about the terminals, but that’s still relevant.</p>
      <p><em>The visual discord between the arches and the "r" in your first example could actually work; but I think it's better if the "r" isn't all alone (which BTW is the main reason I prefer the open-bottom binocular "g" - it can accompany the "s").</em><br>
      Both branch structures are repeated multiple times through-out the alphabet. There’s a little bit of both ‘r’ and ‘n’ in ‘g’, for example, but not the spoon-fed kind. I suspect I might have too many ingredients though, with the Dwiggins-esque flips.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/two_4969.png"></div><p></p>
