    html: <p>I believe this is Times Roman. It appears to be cut or cast letters applied to a wall and some of them (like the e) are a bit crooked. The baseline is also crooked and the spacing is a bit loose and uneven.</p>
    html_clean: <p>I believe this is Times Roman. It appears to be cut or cast letters applied to a wall and some of them (like the e) are a bit crooked. The baseline is also crooked and the spacing is a bit loose and uneven.</p>
  - id: 28269
    user: null
    date: null
    date_raw: null
    votes: null
    html: <p>Also, I think it has been stretched a little horizontally. <br> <br>I should note that I'm having trouble finding a precise match with any of the common digital versions of Times. But I don't think that means it's not Times. There are so many versions of this face--both authorized and unauthorized. It might also be pre-digital. <br> <br>In any case, I am convinced that it is some version of Times.</p>
