    html: <p>As for the ampersand, it's a little like the one in <a href="http://www.myfonts.com/fonts/linotype/cooper-black/cooper-black/testdrive.html?s=%26&amp;p=72" target="_blank">Cooper Black</a>, too. My gut feeling is that it was custom designed.</p>
