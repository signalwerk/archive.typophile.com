  html: <p>I'm not so sure I agree with Baskerville. The 'e' has a slightly slanted bar, and the 'f' has a shallower 'crook' than any Baskerville I am seeing. The ampersand could have come from a collection of ampersands like <a href="http://www.myfonts.com/fonts/castletype/ampersands/" target="_blank">these two fonts</a> from Castle Type.</p>
