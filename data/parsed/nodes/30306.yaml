    <p>Hello everyone. I’ve been lurking around the forum for a while and decided to finally post. I choose the crit section because eventually that’s what this will be.</p>
    <p>I’m trying to decide on the best way to use my name (Chris Butts) as my freelance design identity. The reasons to use it are because it’s different, memorable, and the thing I’m known for. The reasons not to use it are because it can be associated with obvious things like toilets and well... crap.</p>
    <p>Lately I’ve been thinking that spelling the name is enough and that I don’t need some rendering of a rear end next to it. I’ve always been interested in typography and thought this might be a time where a purely typographic logo solution is in order. I’m doing some typographic thumbnails and will post them soon.</p>
    <p>Let me know if you have any thoughts on this. I’d like to hear what others think!</p>
