    html: <p>Contextual GSUB lookups are now very widely supported, so I think it is unlikely that you will encounter problems with support. Of slightly more concern will be software that makes assumptions about what kind of lookups are associated with what kinds of features (despite the OT spec warning against making such assumptions), but this too is a diminishing problem.</p>
