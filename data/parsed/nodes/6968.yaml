    html: "<p>Dear Ralph: <br> <br>Thank you for the explanation. I have downloaded <br>a few samples. They make it very clear that Clau- <br>de Garamond was actually searching for regularity <br>which the Slimbach versionconveys rather well.  <br> <br>I must say I am not very critical on Slimbach's <br>work. If one prints text in 12 points we do get <br>the kind of dignified regularity a good Garamond <br>printed page offers. <br> <br>Now, I agree it is a little too soft and not so  <br>stately as true Garamond. But it is, I believe, by <br>far, the best modern day version we have.  <br> <br>I know about the masters version, and I am eagerly <br>waiting for it. But I fear it will not be much  <br>different in terms of overall blandness. <br> <br>As far as I know, Monotype is working on a similar <br>project involving Bembo. But it was meant to  <br>appear this year and we are close to the end of <br>it. So perhaps they abandoned the project.  <br> <br>Concerning leBe, I never really saw a good photo <br>of it. But, as you say, in those days, there was <br>no shortage of good designs.  <br> <br>As a matter of fact, it strikes me that most  <br>typefaces are variations of the same basic idea. <br>Of course Tory's faces are different from  <br>Garamond's, but Garamond, leBe, COlinnes, all seem <br>to base their work on the same design. <br> <br>I really think the proliferation of quite differ- <br>ent typefaces is something that really began at <br>the 20th century. Before that - say, in the 19th <br>Century - all types were more or less close to <br>the Didones; in the 17th Century most books look <br>more or less the same: printing differences are <br>more a matter of quality of type design and,  <br>perhaps above all, of ink, paper, and pressing  <br>quality than type design.  <br> <br>Concerning the particular type I illustrated, you <br>are quite right: what seems to have happened is  <br>that there was some confusion and many different <br>designs were joined (for instance, consider the <br>variations on the [ o ]. Even the Ascendonica is <br>heterogeneous. There are many examples of foreign <br>gliphs - not in the example I have shown, <br>perhaps, but throughout the book.  <br> <br>If I find something of interest I will post it. <br>Old typography really is a fascinating matter. <br> <br>Thank you for the replies. <br> <br>Rodrigo</p>"
