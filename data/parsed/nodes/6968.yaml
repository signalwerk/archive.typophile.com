    html: "<p><i>From the facsimile in Dreyfus, I presume?  <br>If so, how close is that in texture and color to the original?</i> <br> <br>Yes, from the Dreyfus. Sorry, I should have made that clear. I'm not sure how close it is to the original, not having seen it myself, but from what I can see it looks like an extremely careful an accurate reproduction. It certainly beats the reproduction in \"A View of Early Typography\", which suffers further from being reduced. <br> <br><i>But will it have the terminal Northern California cuteness finally exorcised? We'll see.</i> <br> <br>Hey, I'm in Northern California! But I see what you mean. Let me put it this way: I'm not going to let the Adobe Garamond discorage me from working on my LeBe.</p>"
