    html: "<p>Dear Jos�: <br> <br>Yes, I know about M�rio Feliciano's work, but, as far as I know, he only made a serif font. It is rather good, I think. Pradell seems indeed in the same vein.  <br> <br>But actually I was thinking of quasi-Garamond type faces used as late as the early 18th Century. I don't have here a book I can scan (I do have one, but the paper is very fragile and I fear it would be damaged by scanning it). Nevertheless, next week I can try to get one. Most of them are at our family house and I keep very few of them in our town house.  <br> <br>Many late baroque Iberian books are extremely beautiful.  <br> <br>Thank you for your reply and your link. <br> <br>Rodrigo de S�</p>"
