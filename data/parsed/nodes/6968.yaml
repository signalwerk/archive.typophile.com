    html: "<p>Rodrigo: thanks for posting the Iberian example. Those are some really beautiful letters, although I think it will be more challenging than usual to make a revival due to the rather extreme variations between multiple impressions of the same letter. <br> <br>By the way, I have most of the Berner sheet at 1200 dpi. Follow the links from <a href=\"http://levien.com/type/berner/\">levien.com/type/berner/</a>, then take off the \"_sm\". Be warned that files that large may well bring your computer to a grinding halt. <br> <br>I'm in the process of moving the archive to <a href=\"http://www.tug.org/\">tug.org</a>, on which I won't have to worry so much about bandwidth, so all of the files will have high-res links. <br> <br>Hope you still find it useful. <br> <br>P.S. I understand Robert Slimbach is now working on an optically scaled version, to be called Garamond Masters if memory serves. It will probably be the definitive version when it's released, but fortunately there is lots of other good stuff from back then. I'm partial to the work of Guillaume LeBe, myself.</p>"
