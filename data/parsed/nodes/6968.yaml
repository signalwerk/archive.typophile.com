    html: <p>I know that this thread is out of place, hence the lack of responses. <br> <br>But I would like to tell people about my recent experiments.  <br> <br>I browsed - attentively - through a lot of 16th and 17th century books. I withdraw what I said about the great similarity of ancient fonts. They are subtly different, sometimes rather different from each other. Nevertheless, it is a fact that the Garamond kind of proportion and form was very widespread during the 16th and early 17th century. <br> <br>Moreover, the wearing of the metal and the quality of paper and ink introduce very pronounced modifications in type made from the same matrices. This makes identification difficult. <br> <br>As you know, 16th Century based types survived well into the 18th century in Iberia (that's Portugal and Spain). As I speak I have in front of me what seems to be a big version of Granjon's Galliard, published in Antwerpen in the first half of the 17th Century. But the Iberic type designers favoured what we now call Garalde up to the technical changes that appeared in the late 18th Century.  <br> <br>I know this is not very interesting for the majority of the forum members, but it just may interest someone (although the persistence of the Garalde types in Iberia is a well known fact).  <br> <br>Rodrigo de S�</p>
    html_clean: <p>I know that this thread is out of place, hence the lack of responses. <br> <br>But I would like to tell people about my recent experiments.  <br> <br>I browsed - attentively - through a lot of 16th and 17th century books. I withdraw what I said about the great similarity of ancient fonts. They are subtly different, sometimes rather different from each other. Nevertheless, it is a fact that the Garamond kind of proportion and form was very widespread during the 16th and early 17th century. <br> <br>Moreover, the wearing of the metal and the quality of paper and ink introduce very pronounced modifications in type made from the same matrices. This makes identification difficult. <br> <br>As you know, 16th Century based types survived well into the 18th century in Iberia (that's Portugal and Spain). As I speak I have in front of me what seems to be a big version of Granjon's Galliard, published in Antwerpen in the first half of the 17th Century. But the Iberic type designers favoured what we now call Garalde up to the technical changes that appeared in the late 18th Century.  <br> <br>I know this is not very interesting for the majority of the forum members, but it just may interest someone (although the persistence of the Garalde types in Iberia is a well known fact).  <br> <br>Rodrigo de S�</p>
