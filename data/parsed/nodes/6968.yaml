  html: "<p>Hi, all <br> <br>In a previous post, at 'General discussions', I downloaded two samples of a 16th Century book.  <br> <br>I don't want to take up too much space in this forum, so please check it here (you'll have to scroll down a little):  <br> <br><a href=\"http://www.typophile.com/forums/messages/30/50241.html?1096675025\" target=\"_blank\">http://www.typophile.com/forums/messages/30/50241.html?1096675025</a> <br> <br> <br>As far as I can see, it looks like Garamond; but then, many late 16th Century and early 17th Century books are not very different. <br> <br>Furthermore, is anyone able to provide me with information about the printer? <br> <br>Thank you for your attention, <br> <br>Rodrigo de S�</p>"
