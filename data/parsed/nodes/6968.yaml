    html: "<p>Dear Jos�: <br> <br>Thank you for the information. I will try to get in contact with him. Thank you also for the link. I tend to agree with you: I find nothing particularly Spanish about the fonts... Marketing, perhaps?  <br> <br>Dear Tiffany: <br>If you think so, please do move it. And I agree with you: while it is not very difficult to make a modern version of, say, Le Romain du Roi, it is very difficult to know exactly how an Estienne or a Garamond was meant to be. Except if one copies the very large types, but then, as far as I know, these were generally made by the lesser technically endowed workers - hence their lack of proportion and crudity (I'm thinking of almost every old book I examined, but the often quoted title of Alphabetum Graecum by Garamond is an excellent example: the smaller sizes certainly look much better.  <br> <br>I sometimes wonder if it is possible, at all, to copy a true version of a small sized Garamond... As far as I can tell, there is no good modern version of it. Of course Stempel Garamond was based on research, but the Linotype restraints meant that the very characteristic f was quite altered and the overall hardness doesn't seem Garamond at all to me; 'Granjon' seems to me to lack character and Adobe Garamond is, I think, too soft, althout it is perhaps the version that more convincingly conveys the combination graceful curves and stately proportions of old Garamond. But then, perhaps I am wrong. <br> <br>And, of course, most modern versions have smaller extenders than the old ones.  <br> <br>On the other hand, an old, well printed, book is a marvel to look at; the flow of letters is so graceful and yet so strong - tridimensional printing - that I cannot but be nostalgic about the past... Even if I welcome the technological changes that allowed a book to be acquired by most people. <br> <br>Thank you for your offer. <br> <br>Rodrigo de S�</p>"
