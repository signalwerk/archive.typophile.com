    html: "<p>Hi all: <br> <br>I must confess I am a little downcast by the lack of responses to this thread.  <br> <br>To speak the truth, I have a great difficulty in telling apart 16th-17th century types. They all seem to be based on the same model and I honestly cannot tell the difference between, say, an Collines type from a Garamond one.  <br> <br>To complicate matters further, most of the Iberian 16th Century typography was based on that kind of design because the printing is so irregular - I often think revivals of these kind of types to be totally impossible.  <br> <br>Even if I can tell, at a glance and without looking at individual letters, most modern text types (sometimes even foundry variants of the same design, but that takes a little longer) when looking at a 16th Century book I find that terribly difficult - impossible, really. It is almost as if I had to try to gess the difference between Galliard cc and Galliard based on a page printed in a 150dpi inkjet printer.  <br> <br>Does anyone here have that feeling or did I post this thread in the wrong place? <br> <br>Remember, I'm new here, so have a little patience while I understand the forum rules. <br> <br>Rodrigo de S�</p>"
