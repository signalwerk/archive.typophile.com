    html: <p>Rodrigo, <br> <br>I suppose your informed about the work of your fellow countryman Mario Feliciano, specially his earlier fonts. I think they were based on Updike samples and have the feeling your looking for. <br> <br>Recently Andreu Balius did a digital version of a Pradell font, and perhaps is interesting to have a look at  <br> <br><a href="http://www.andreubalius.com/andreubalius/type01_pradell.html" target="_blank">http://www.andreubalius.com/andreubalius/type01_pradell.html</a> <br> <br>I have designed and produced a font based on some of the letters cut by Ger�nimo Gil for Don Quixote's Academia edition (those used in the front page and as initials all along the book), but it is not realeased as a commercial font yet.</p>
