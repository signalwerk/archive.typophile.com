    <p>After years looking for the name of this typeface, I've diceded to beg help for some people here. I'm looking for the name (only the name) of this typeface: <a href="http://lonestarspice.com/singles/suyluscd.JPG" title="http://lonestarspice.com/singles/suyluscd.JPG">http://lonestarspice.com/singles/suyluscd.JPG</a></p>
    <p>It has a particular and peculiar kind of "S" that we cannot find in many typefaces. I know it is not a custom design because I often find it in some posters or book covers, but none of these sourcers tells the name of this type.</p>
    <p>This typeface was used many times as the Spice Girls logo on their first and second CD's and, if I'm not wrong, it is used in the Panini Comics logo [http://www.paninicomics.co.uk/Home.jsp]<br>
    Lower case sample here: <a href="http://lonestarspice.com/albums/spicemd2.jpg" title="http://lonestarspice.com/albums/spicemd2.jpg">http://lonestarspice.com/albums/spicemd2.jpg</a></p>
    <p>Can anyone help me solve this mistery? I'll be glad to have opinions that leads me to an answer.</p>
    <p>Thanks for the attention.</p>
