      <p>This is my own opinion, not the views of any organizations I may be associated with, and not legal advice :) </p>
      <p>There are no copyrights on typeface designs in the USA, so doing your own digital drawing of a typeface design in the USA is legal. Dan Solo used this fact himself since his stuff is revivals of early type designs :) But countries in the EU have a 25 year copyright on typeface designs. So it rather depends on where you are based.</p>
      <p>However, the educational value of doing outline drawing over the top of an existing typeface design is rather low. If you want to post work for review, you'd be better off making your own typeface design from scratch :)</p>
