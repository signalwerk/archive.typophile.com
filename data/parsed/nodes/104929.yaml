    html: |-
      <p>Hi. Thanks for the advice. I know working the value I can get working over other's design is limited compared with designing a typeface from scratch. However, in this case the sheet included 62 characters (26 lowercase, 26 uppercase and 10 numerals) the challenge was study the basic morphology and create a complete Basic Latin set with diacritics, punctuation, symbols, lining numbers, tabular numbers and old style numbers. My main goals were:<br>
      1.- Learn to use Glyphs<br>
      2.- Learn about how to set digital type (space the font, kern the font, hint the font…)<br>
      3.- Set OpenType options like alternates.<br>
      I would recommend the experiment since I didn't have to worry too much about morphology and focus in the techniques and technology involved.</p>
