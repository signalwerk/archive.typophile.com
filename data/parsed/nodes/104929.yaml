      <p>Best to ask legal questions to Lawyers. That said, from a quick Google, it looks as though the work belongs to someone else so digitizing it would in fact be copyright infringement.</p>
      <p>There <em>may</em> be an exception for educational contexts, but I would have to give the book a look to provide you with any meaningful insight.</p>
      <p>I would recommend contacting the publisher.</p>
