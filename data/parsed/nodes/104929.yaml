    <p>Hi. I'm new in type design. I've developed some custom lettering for logos but now i want to get into serious font design.<br>
    I've used FontForge and finally decided to purchase Glyphsapp. For my first try, instead of design a font from scratch, I decided to digitalize a font from an old Dan X. Solo catalog I found in my house.<br>
    My work is almost complete and I want to show it for some critique but I'm concerned about wether I have the right to publish for educational purpose or don't.</p>
