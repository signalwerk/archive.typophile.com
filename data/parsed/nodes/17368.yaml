    <p>Hi all.<br>
    I have a question as to whether or not it would be worth it to release a face I've had sitting on my hard drive for 8+ years. </p>
    <p>The font is basically a reproduction of the Van Doesburg Cafe Aubette lettering which The Foundry seems to have also duped (and I can't say I agree with some of their design decisions). My version is actually quite different than theirs and has my own little twists on the theme. I would also be making several weights and possibly widths to make mine more versatile.</p>
    <p>What do you think? Do we need another Van Doesburg replica? Should I bother cleaning it up and fleshing out the weights?</p>
