      <p>Is this a motorcycle or tattoo shop? If not, then I’d rethink the logo.</p>
      <p>Some letters are too thick (’N’) and some are too thin (’r’). Why is the ’i’ so ornate and composed of two strokes? The ’g’ is hard to read, but that could be caused by the crazy ’i’.</p>
      <p> - Lex</p>
      <p>EDIT: Also the ’l’ needs at least a bit of an ascender. It looks more like an ’i’ than your ’i’ does.</p>
