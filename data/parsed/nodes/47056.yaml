    <p>New Logo!: </p>
    <p>update: swashes?... </p>
    <p></p><div class="imageWrap"><img src="/web/20081011010948im_/http://www.typophile.com/files/norcal_201_6058.jpg"></div><p></p>
    <p>I am creating a new logo for my company, Norcal designs (<a href="https://web.archive.org/web/20081011010948/http://www.norcaldesigns.com/" title="www.norcaldesigns.com">www.norcaldesigns.com</a>), and decided to post my work from concept to finish up here for helpful advice and critiques. NorCal Designs is a graphic design company and I create any kind of corporate collateral (business cards, letter heads, company logo work, etc.) but I specialize in website design &amp; creation for small businesses.</p>
    <p>This is the first piece of concept work for my new logo based on Emigre’s Sabbath Black. I am not sure on the look and feel that I want to achieve yet so hopefully it will develop along the way.</p>
    <p>Below is my sketched out version of the lettering as well as the traced paths in illustrator (which took forever) and the result. At the very bottom is Emigre’s Sabbath Black to show you my starting point.</p>
    <p></p><div class="imageWrap"><img src="/web/20081011010948im_/http://www.typophile.com/files/norcal_process copy_6534.jpg"></div><p></p>
    <p>I am looking for ideas on where to take this, interesting blackletter variations I can try adding, any ideas on improvement. It is very unfinished both in the concept and lettering. for now...</p>
