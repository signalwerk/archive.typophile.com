  html: |-
    <p>Might anyone have any idea how/where I could get help identifying in what year this ATF brochure was published? The back cover, pictured below, lists their offices, which, I would think, might help identify the year. Where would I find a chronology of what offices ATF had open in what cities for given years?</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/ATF_Brochure2_3474.png"></div><p></p>
