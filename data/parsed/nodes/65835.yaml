    date: 2010-01-03T05:13:00
    date_raw: 3 Jan 2010 — 5:13am
    votes: null
    html: |-
      <p>Yes it is, and the D is less wide, but the version used in the poster is pre-digital, and those came often with alternate character shapes and widths for optimum headline composition. When Blippo originally was digitised only the basic character set was included.</p>
      <p>Which is a shame, because there are a large number of popular display faces from the phototype era that had lots of interesting alternative shapes in their character sets, and those are lost until somebody has the brilliant idea to include them in a digital version. One of the classic examples is ITC Serif Gothic.</p>
