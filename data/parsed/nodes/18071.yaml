      <p><em>PS; Nick, having looked briefly at your site, I wonder if you could suggest some Texas-specific types you have digitised.</em></p>
      <p>As I mentioned earlier, the majority of my woodtype fonts, which have the suffix WBW (for Whiz-Bang Woodtype) are named for Texas towns (Dime Box, Falfurrias, Grand Prairie, Jefferson (Pilot), Mexia, New Boston, Pilot Point, Refugio, San Marcos, Sulphur Springs, Terlingua and Waxahachie); Texas rivers (Brazos and Rio Grande); Texas bays (Laguna Madre); or Texas phenomena (Gullywasher and Spindletop).</p>
