    html: <p>You could also do a search at MyFonts for "Texas", and see that Phil Martin was born in Texas, and Scriptorium is based there. Another Houston-based designer is the Swisswoman Sibylle Hagmann, whose "Cholla" typeface for Emigre is named after a kind of cactus.</p>
