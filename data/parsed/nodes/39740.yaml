  html: '<p>Since it was already debated on Typophile <a href="http://www.typophile.com/node/14163" rel="nofollow">here</a> or <a href="http://www.typophile.com/node/19411" rel="nofollow">here</a>, it may be of interest that finally, 2005 TDC award winning <em>Minuscule</em> by Thomas Huot-Marchand is available through Thomas’ foundry <a href="http://www.256tm.com/en/minuscule.htm" rel="nofollow">http://www.256tm.com/</a>. I have not yet had the time to look at well-printed samples, but as far as I can judge for now: Congratulations to Thomas!</p>'
