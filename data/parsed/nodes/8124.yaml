    html: "<p> Amen, bj. I couldn't have put it better. <br> <br>But I'll try anyway. ;) <br> <br>&gt; Generally type is about flow in a character, ie how you would complete it with a big thick marker  <br>or brush (not detail, just basic form).  <br> <br>I can honestly say Garamond's and Bodoni's types had little if anything to do with how they would complete them with \"a big fat marker or brush.\" Of course, as I have been taught to understand them, Garamond's types were based on (quill) pen forms, but Bodoni's were based more on rendering (drawing) and \"perfecting\" the basic outlines (as opposed to actually writing them with a pen). And no one can honestly argue that Helvetica, Franklin Gothic or Bureau Grotesque are letterforms forms with bases in penwriting (marker or other). They are based more on illustration of the letterform outlines than on handwritten penforms. <br> <br>My point (and I do have one <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":)\"> ) is that different fonts are based on different inspirations and different logical paradigms. To say that all font forms have to be based on the flow of marker or brush lettering is fallacious. <br> <br>&gt;David's comment about cross-overs in the wrong places doesn't really make sense to me, this is an \"experimental\" face, right? <br> <br>Ironically, your argument about the brush answers what I meant by this. In the \"p\", the crossover occurs where two strokes naturally come together anyway, but in the \"e\", the crossover seems arbitrary and out of place, where a single stroke would normally exist. This isn't to say that the glyph can't (or even shouldn't) be rendered with the crossover exactly where it occurs, but I am a believer that a typeface should have at least a level of internal consistency and logic; if an element exists, there should be a reason for it to exist, and it should be echoed (if not exactly repeated) elsewhere in the face. Inconsistencies of course can occur, but they should be defendable where they do occur. If such a crossover occurs in the \"e\", where is that decision echoed in the rest of the face? <br> <br>Of course this isn't a book face, by any stretch of the imagination. Nor would I really call it an \"experimental\" face, although some personal experimentation is obviously occuring from Luce's (and all of us critics') point of view. It is a display face (as correctly categorized by its placement here on the Display forum), and considering the application for which it was designed (taking the criticism about the weight/legibility issue into account), it seems to work well enough for its intended purpose. <br> <br>And Luce: As Joe said, congratulations! You've got an interesting typeface going, and you've sparked a terrific discussion. </p>"
