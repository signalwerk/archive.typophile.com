    html: <p>Perhaps I can add some insight on this. <br> <br>About 10 miles from me in Buena Park, CA is a well-known printer who prints 'rave fliers' for basically the entire country. A lot of these fliers are for So. Cal events. I peruse them just about every week. The designers always seem to be using crazy 3-D modeling software with innovative type treatments. Some really good stuff. Some really bad stuff. <br> <br>As Martin said, Lychee is custom lettering that served its purpose but...don't throw it away. With some of the 'fixes' mentioned above, Lychee could certainly enjoy a second life as a typeface -- a specialized face for people who design rave fliers. (yes, a small small market.) <br> <br>Rave fonts are not for everyone. They're not your father's Oldstyle. But to say that Luce's letterorms 'don't work' is to not be 'in' on this segment of counter culture -- rave letterforms are deliberately off kilter. <br> <br>Also, note the work of Andreas Lindholm, one of the top 'rave font designers'. (I don't know if he makes a living selling type) <br> <br> <br><a href="http://www.mindcandy.com/fonts/brainreactor/index.html" target="_top">http://www.mindcandy.com/fonts/brainreactor/index.html</a> <br> <br> <br>bj</p>
