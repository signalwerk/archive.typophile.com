  html: <p>I have started creating this typeface because of a contract that ended up falling through. I still love the type though, but am unable to decide if I should go through with the process of designing the whole face. If this sneak preview convinces a few, I'll probably go ahead with it. <br> <br>*  *  *  *  * *** *  *  *  *  * <br> <br>"Lychee" was designed as a logotype for a restaurant and was intended to evoke the streamlined, clean aspect of asian fusion food. The design of the letters are grid based and modular, simple with just a tiny glitch here and there to emphasize understanding of a particular letter. I didn't want it to be "too cool" but rather inquiring and understated.  <br> <br>*L* <br> <br><img src="http://www.typophile.com/forums/messages/29/558.gif" alt="lychee_type.gif"></p>
  html_clean: <p>I have started creating this typeface because of a contract that ended up falling through. I still love the type though, but am unable to decide if I should go through with the process of designing the whole face. If this sneak preview convinces a few, I'll probably go ahead with it. <br> <br>*  *  *  *  * *** *  *  *  *  * <br> <br>"Lychee" was designed as a logotype for a restaurant and was intended to evoke the streamlined, clean aspect of asian fusion food. The design of the letters are grid based and modular, simple with just a tiny glitch here and there to emphasize understanding of a particular letter. I didn't want it to be "too cool" but rather inquiring and understated.  <br> <br>*L* <br> <br><img src="http://www.typophile.com/forums/messages/29/558.gif" alt="lychee_type.gif"></p>
