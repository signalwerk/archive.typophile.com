    html: "<p> Clive: <br> <br>I think you're projecting your own expectations of how these letters should be designed onto Luce's design. <br> <br>Luce never said he intended to to model this font after Asian scripts; indeed, in his own words from his first post, \"The design of the letters are grid based and modular....\" and his intention was, again in his own words, to \"evoke the streamlined, clean aspect of asian fusion food\". It seems obvious to me that it was never intended to be a script, but rather a modular letter. <br> <br>As for Bodoni , it sounds like you have misconstrued my argument. Of course Bodoni was still based on the penforms that came before it; but, to quote Robert Bringhurst (\"The Elements of Typographic Style\", 2nd Ed., p. 130) \"Romantic [i.e., \"modern\" or \"didone\"] letters can be extraordinarily beautiful, but they lack the flowing and steady rhythm of Renaissance forms.\" (Brackets added.) <br> <br>It was this development (the Romantic form) in typography that began the move away from the lyrical flow of penwriting and began to move toward a more contructive approach, more concerned with the statuesque outlines of the glyphs than with emulative handwriting. </p>"
