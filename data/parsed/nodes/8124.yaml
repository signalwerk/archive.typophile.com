    html: "<p> The junction of the ascender/descenders into the character just doesn't work for me (ie the y, p, h and b). The curve in may work, but the little counter created just seems very weak. <br> <br>The \"e\" forms are intreresting, and quite strong, but the others aren't up to the same standard. <br> <br>I'd look again at the ascender/descender to character junctions, see if you can work in some of the crossing of the strokes happening with the \"e\", and perhaps work in some little cross elements, ie at the top terminal of the \"c\", as if they were serifs: <br> <br> <br>.........c <br>....cccccccc <br>..c......c <br>c........c <br>c <br>c <br>c <br>..c <br>....cccccc <br> <br> <br>-- Clive </p>"
