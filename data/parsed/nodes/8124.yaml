    html: <p> Hmmm... I have to say I'm with Hrant. It makes considerably more sense to suggest changing a few glyphs to bring them into unison with the rest of the face than to suggest changing the entire font to match one or two glyphs. <br> <br>Of course, we needn't choose between "interesting/strong" and "uninteresting/weak". As an alternative, why not create a second alternates set? One font set with more "conservative" characters, and a companion set with the wilder, more daring (and perhaps more interesting) ones? It makes sense that this would increase the font's utility. <br> <br>I further disagree with Clive's assertion that Hrant was encouraging Luce to go in a "weak direction," just as I disagree that the rest of the character set (apart from the "e") are "weak" and "generic". I suspect that Hrant feels (as I do) that the current "e" doesn't fit the same set of rules that were established by the other characters, e.g., establishing a crossing in the upper right part of the character, where a crossing wouldn't normally exist (the only other example we have of such a crossing is in the upper left part of the "p", where it seems natural for such a crossing or strokes to occur. This is not to say that it can't be done, but I think it would be wise to create an "e" that fits with the rest of the glyphs as designed, and then, if you wish, design another set of characters that fits more with the "e" as designed. <br> <br>My 2 cents. <br> <br>David </p>
