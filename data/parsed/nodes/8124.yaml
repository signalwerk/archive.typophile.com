    html: "<p> David: <br>&gt;I can honestly say Garamond's and Bodoni's types <br>&gt;had little if anything to do with how they would <br>&gt;complete them with \"a big fat marker or brush.\"  <br>&gt;Of course, as I have been taught to understand <br>&gt;them, Garamond's types were based on (quill)  <br>&gt;pen forms, <br> <br>We're really not going to argue about the style of writing implement are we? All type is derived from handwriting (excption is probably the euro symbol), the lineage is clear. <br> <br>&gt;but Bodoni's were based more on rendering <br>&gt;(drawing) and \"perfecting\" the basic <br>&gt;outlines (as opposed to actually writing them  <br>&gt;with a pen). <br> <br>Have you ever hand rendered Bodoni at small sizes? I can assure you  that the thick/thin of a pen makes all the difference. <br> <br>&gt;And no one can honestly argue that <br>&gt;Helvetica, Franklin Gothic or Bureau Grotesque  <br>&gt;are letterforms forms with bases in penwriting <br>&gt;(marker or other). They are based more <br>&gt;on illustration of the letterform outlines than  <br>&gt;on handwritten penforms. <br> <br>I think you are misunderstanding my point, which is to be expected because to get it over properly would require a quick demonstration. <br> <br>Essentially what I'm trying to point out is that *if* you draw the core structure of any of these fonts there is an innate \"flow\". This flow isn't in some of Luce's characters for the reasons I have stated. <br> <br>If we reflect on the model for SE Asian scripts they are generally characterised by reasonably short, linear strokes, that cross but don't usually blend into each other. <br> <br>&gt;To say that all font forms have to be based on  <br>&gt;the flow of marker or brush lettering is <br>&gt;fallacious. <br> <br>I think you're making a point based on your previous misunderstanding. </p>"
