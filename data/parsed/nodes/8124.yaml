    html: <p> I'm with the anony mouse. <br> <br>The "e" stands out because it has some flair, some character. Most of the rest of the characters are very weak and quite generic (sorry, it's true), but there is a basis for a good font there. <br> <br>Hrant I think is wrong in trying to encourage continuing in a weak direction, further weakening the font by dropping the strong "e". <br> <br>Type design is about developing ideas and turning them into good typefaces, along the way you have to discard some ideas for the sake of harmony (that's not to say that you can't bring them back later in another font), and you have to make tough, critical decisions. <br> <br>I'll help Luce out now, go with the "e", it's got a good strong idea behind it, you're following that with the "p". Get rid of those nasty curves blending the ascenders and descenders into the rest of the character - they're weak and as I pointed out before tha counter they produce is week too. <br> <br>I don't want to discourage you, there's the basis of a good idea there, now you have to work on it to get that spark out into a fire. </p>
