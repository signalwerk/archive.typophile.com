    html: "<p> Wow!!! <br>I have been working like a dog since I last posted this, and look what happens when I come back: a deliciously interesting typographical debate! Thank you everyone for the comments, they are what enables one to further one's thoughts and hone one's skills. I definitely appreciate the brief history of handwriting; it unscrewed a lost pod of knowledge from my distant design BA. ;-) <br>I am taking into consideration everything you guys have said. As for the face having a \"rave\" flavour, its probably because I've done a whole truck load of flyers in my time, and was immensely influenced by people like Büro Destrukt and Designers Republic (not that Lychee even approaches the techno whimsicality of faces like Kristallo and Cravt, which also originated as logos). Also, the letters were definitely designed to be alogo and not a face, so there are inconsistencies in the glyphs if it were to become a face. In any case, i think I will spark more discussion in another thread, presenting another display type essay. <br>Oh, and David: I am a she, not a he. <br>;-) </p>"
