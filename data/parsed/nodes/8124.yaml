    html: <p> Ok, I just figured it out what I find disturbing about Luce's y, h, p and b. <br> <br>Generally type is about flow in a character, ie how you would complete it with a big thick marker or brush (not detail, just basic form). SE Asian scripts particularly are about stoke patterns. <br> <br>If you look at my sketch, I'm just completing single strokes, not going over the same lines more than once. <br> <br>With Luce's chars that kind of simplicity is lost, because some forms require you to "back-up" on yourself. <br> <br>make sense, maybe not? </p>
