    html: <p>Not surprisingly I agree with Joe and disagree with David, though I do kind of like the "y" I think the merging of the descender into the rest of the character at the baseline is problematic - as I've already stated. <br> <br>From my perspective the "e" is strong because it has that SE Asian feel to it, whereas most of the rest say "euro techno" - and I really do think the latter has been done to death, this face at least doesn't seem to offer anything new in that direction. <br> <br>I also think that trying to design "two" faces, splitting the characteristics we see, would be a mistake (ie making alternative forms - some of these forms don't go together as it is. <br> <br>David's comment about cross-overs in the wrong places doesn't really make sense to me, this is an "experimental" face, right? <br> <br>You know, at some point a cap A became lowercase!? <br> <br><img src="http://www.typophile.com/forums/messages/29/568.gif" alt="some sketchy ideas"> <br> <br>Here's a quick sketch, got to go, things to do if i don't want to get slaughtered on New year's Day. <br> <br> <br>-- Clive</p>
