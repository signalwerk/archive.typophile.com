      <p>&gt; <em>is that fair play? anyone else can always do the same.</em></p>
      <p>Just because we can do it doesn’t mean we should. I don’t think I need to remind you that Typophile’s biggest assets are its users and their contributions. If those disappear this webcommunity will completely loose its meaning of existence. </p>
      <p>&gt; <em>i didn’t convert all my posts to periods, as has been deemed as fair in other cases.</em></p>
      <p>I don’t know what others think but I actually find that quite annoying. If people are not sure if they want their posts to remain available, they should abstain themselves from contributing to the discussions.</p>
      <p>BTW, this reminds me of a claimed bug where posts that are edited move to the bottom of the thread. To me that’s a feature rather than a bug, and I think it should remain that way. This will held users more accountable of their actions.</p>
