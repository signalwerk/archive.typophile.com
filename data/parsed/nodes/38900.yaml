      <p><cite>BTW, this reminds me of a claimed bug where posts that are edited move to the bottom of the thread. To me that’s a feature rather than a bug, and I think it should remain that way. This will held users more accountable of their actions.</cite></p>
      <p>I beg to differ, Miguel. On the type ID board it was common practice to make the ID and then go back and insert the link. Now we find ourselves adding the link into an additional post, which is extra work for everyone (poster and reader) and falsely moves you up in “Prolific Posters”. I also sometimes reread my posts and feel I could have worded something more elegantly. Or maybe I said something I wish I hadn’t said. I think to then have the edited post slip to the bottom is a bad idea, since it can make the responses confusing. I’d rather see the edits be somehow visible, so that others can see what was edited, rather than messing around with the order.</p>
