  date_raw: 10 Nov 2009 — 5:44am
  votes: null
  html: <p>A week ago I gave a 90-minute lecture to the Japan Society of Northern California about Kazuraki, which is the first genuinely proportional Japanese font. Although a significant portion of the lecture included a live demo of this font in Adobe InDesign, I thought that some of the people on this forum would enjoy going through the presentation, along with seeing its specimen book. You can download both of them from <a class="freelinking external" href="http://japansocietyofnortherncalifornia.myshopify.com/products/kazuraki" rel="nofollow">here</a>.</p>
  html_clean: <p>A week ago I gave a 90-minute lecture to the Japan Society of Northern California about Kazuraki, which is the first genuinely proportional Japanese font. Although a significant portion of the lecture included a live demo of this font in Adobe InDesign, I thought that some of the people on this forum would enjoy going through the presentation, along with seeing its specimen book. You can download both of them from <a class="freelinking external link-external" href="http://japansocietyofnortherncalifornia.myshopify.com/products/kazuraki" rel="nofollow">here</a>.</p>
