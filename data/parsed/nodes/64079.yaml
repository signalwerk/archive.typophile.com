  - id: 378533
    user: 14653
    date: 2009-11-15T06:22:00
    date_raw: 15 Nov 2009 — 6:22am
    votes: null
    html: |-
      <p>Yes, considering that each glyph is effectively a calligraphic work of art, and individually drawn, the regularity that would result from the use of glyph elements would detract from this effect. At least, that's my opinion.</p>
      <p>If a larger Japanese type foundry, with more than one designer, were to take on the design and development of a similar typeface, they could potentially include a larger number of glyphs. Kazuraki has a single designer. Well, "single" in the sense of there being only one. Ryoko Nishizuka is married and has a daughter.</p>
      <p>BTW, I just dug up the <a class="freelinking external" href="http://www20.morisawa.co.jp/museum/contest/e/2002wabun_gin_e.html" rel="nofollow">page</a> on Morisawa's website that shows the original form of Kazuraki when it won the Silver Prize at their 2002 Typeface Design Competition. </p>
      <p>Dr. Ken Lunde<br>
      Senior Computer Scientist, CJKV Type Development<br>
      Adobe Systems Incorporated<br>
      <a href="mailto:lunde@adobe.com">lunde@adobe.com</a></p>
    html_clean: |-
