    html: <p>This question may be answered by a more careful re-reading of the documents linked to above but - It seems like in addition to all the programming and testing involved to get both horizontal and vertical relationships the way you want them, a release of this kind also could not take advantage of a skeleton+stroke basis for building glyphs,especially beyond the most common 3000 or so, and so would be far more labour intensive for that reason as well. Is that correct?</p>
