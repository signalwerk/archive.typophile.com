    date: null
    date_raw: null
    votes: null
    html: <p>Yes, I have just been hunting since you posted that. It turns out that 'Alison', which appears as freeware all over the web, is a modification of Dianna/Ballantines/Balladeer etc. The font files still have the orginal A and G included. Robert &amp; Nancy Wall of Chameleon Graphics apparently re-drew those two letters and effectively created a new font. Those two letters are often the most distinctive, so that was a clever method to apparently create something new. <br> <br>So I feel better that I was not far off with my first ID<img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"></p>
    html_clean: <p>Yes, I have just been hunting since you posted that. It turns out that 'Alison', which appears as freeware all over the web, is a modification of Dianna/Ballantines/Balladeer etc. The font files still have the orginal A and G included. Robert &amp; Nancy Wall of Chameleon Graphics apparently re-drew those two letters and effectively created a new font. Those two letters are often the most distinctive, so that was a clever method to apparently create something new. <br> <br>So I feel better that I was not far off with my first ID<img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"></p>
