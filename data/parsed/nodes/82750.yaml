    <p>I am in the process of developing a logo and website for my company.  The company does branding, web development, and marketing for small businesses.  I hand drew this logo and reworked it in illustrator.  I wanted it to have fresh energy and inspire people to get creative and excited about developing their identity.  How am  doing so far?</p>
