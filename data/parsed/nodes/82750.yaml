      <p>I like it's uniqueness. I like the angle.</p>
      <p>The letters apear to walk and the dots on the i apear to have a nose. I don't know if that is the effect that you intended. Somehow I find that a bit awkward.</p>
      <p>Maybe some of your letters are a bit too consistent in stroke width.</p>
      <p>The a just doesn't seem to fit in. Maybe you should explorer some new curves!</p>
      <p>Good luck!</p>
