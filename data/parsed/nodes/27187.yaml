  html: <p>Running until nearly the end of February is a play about a typographer, geographer and stenographer who sit around obsessing over their professions. I have only read about the play, so I can't confirm if it is actually any good. Go check it out! <br> <br><a href="http://www.encoretheatrecompany.org/" target="_blank">The Typographer's Dream</a></p>
