      <p>My theory is that designology tends towards type, as it provides objectively manageable markers for learned discussion about culture, history, economics, politics and technology.</p>
      <p>The mash-up of post-modernism, for instance, is well demonstrated by architecture, of course, but also by types such as Fudoni and Dead History (now in the MoMA collection).</p>
      <p>And of course, everyone wants to know about Nazi fonts.</p>
      <p>Basing designology on type is an alternative to the Great Man narrative.</p>
      <p>And now, scientists want to get in on the act, with their measurements of readability as a key to brain function. Kevin Larson has written for Eye.</p>
