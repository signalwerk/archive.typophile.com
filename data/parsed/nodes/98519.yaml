  html: |-
    <p>Great special issue on Monotype history.<br>
    Respect, Dan Rhatigan!<br>
    **<br>
    Most of the advertisements supporting the publication are from indie type foundries.<br>
    This is an issue all about type (except for some of the book reviews), but usually most of the ads are for type anyway.<br>
    Is it my imagination and it’s always been that way, or has this skewed the editorial content to type, and history (which is a big part of serious typography).<br>
    **<br>
    Going a step further, are there a greater number of books about typography being published now relative to graphic design books in general, than there were in the past?</p>
