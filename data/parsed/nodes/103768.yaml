    html: |-
      <p>Letterpress on the business card, so it's an old metal type design. I zoomed the image &amp; suspect that it's a Clarendon bold condensed rather than a slab serif Egyptian. Many foundries have made Clarendon's since 1845, when Besley/Fann Street first published it. The version is not clear from the business card.  Other letterpress names for Clarendon include Besley. See digital <a href="http://www.myfonts.com/search/besley+clarendon/fonts/" rel="nofollow">Besley Clarendon</a>. You can also use PublishingMojo's myfont's link for digital Clarendon bold condensed.<br>
      Don</p>
