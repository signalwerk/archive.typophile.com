    <p>Type designer, wood engraver, painter and&nbsp;sculptor</p>
    <p>(1900-1987)</p>
    <p>Reiner was introduced to type design by <a href="/node/add/wiki?edit%5Btitle%5D=Ernst%20Scheidler" title="Create node &quot;Ernst Scheidler&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Ernst Scheidler</a>. He left Germany in 1923 to come to the United States with the goal of selling a series of <a href="/node/12132" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">sans serif</a> faces, which had not yet gained&nbsp;popularity.</p>
    <p><strong>Work History</strong><br><a href="/node/12147" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Klingspor</a><br><a href="/node/add/wiki?edit%5Btitle%5D=Bauer" title="Create node &quot;Bauer&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Bauer</a><br><a href="/node/12124" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Stephenson Blake</a><br><a href="/node/add/wiki?edit%5Btitle%5D=Monotype" title="Create node &quot;Monotype&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Monotype</a></p>
    <p><strong>Fonts Designed:</strong><br><a href="/node/add/wiki?edit%5Btitle%5D=Meridian" title="Create node &quot;Meridian&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Meridian</a> (1927)<br><a href="/node/add/wiki?edit%5Btitle%5D=Corvinus" title="Create node &quot;Corvinus&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Corvinus</a> (1929)<br><a href="/node/13559" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Gotika</a> (1932)<br><a href="/node/add/wiki?edit%5Btitle%5D=Floride" title="Create node &quot;Floride&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Floride</a> (1939)<br><a href="/node/add/wiki?edit%5Btitle%5D=Matura" title="Create node &quot;Matura&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Matura</a> (1939)&nbsp;: Designed for <a href="/node/add/wiki?edit%5Btitle%5D=Monotype" title="Create node &quot;Monotype&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Monotype</a><br><a href="/node/add/wiki?edit%5Btitle%5D=Sinfonia" title="Create node &quot;Sinfonia&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Sinfonia</a>/<a href="/node/add/wiki?edit%5Btitle%5D=Stradivarius" title="Create node &quot;Stradivarius&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Stradivarius</a> (1945)<br><a href="/node/add/wiki?edit%5Btitle%5D=Reiner%20Script" title="Create node &quot;Reiner Script&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Reiner Script</a> (1951)<br><a href="/node/add/wiki?edit%5Btitle%5D=Reiner%20Black" title="Create node &quot;Reiner Black&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Reiner Black</a> (1955)<br><a href="/node/add/wiki?edit%5Btitle%5D=Bazaar" title="Create node &quot;Bazaar&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Bazaar</a> (1956)<br><a href="/node/add/wiki?edit%5Btitle%5D=Mercurius" title="Create node &quot;Mercurius&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Mercurius</a> (1957)&nbsp;: Designed for <a href="/node/add/wiki?edit%5Btitle%5D=Monotype" title="Create node &quot;Monotype&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Monotype</a><br><a href="/node/add/wiki?edit%5Btitle%5D=London%20Script" title="Create node &quot;London Script&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">London Script</a> (1957)&nbsp;: Designed for <a href="/node/12124" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Stephenson Blake</a><br><a href="/node/add/wiki?edit%5Btitle%5D=Pepita" title="Create node &quot;Pepita&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Pepita</a> (1959)&nbsp;: Based on Reiner’s own handwriting. Designed for <a href="/node/add/wiki?edit%5Btitle%5D=Monotype" title="Create node &quot;Monotype&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Monotype</a>.<br><a href="/node/add/wiki?edit%5Btitle%5D=Contact" title="Create node &quot;Contact&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Contact</a> (1968)</p>
