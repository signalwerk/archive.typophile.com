    <p>Type designer, wood engraver, painter and sculptor</p>
    <p>(1900-1987)</p>
    <p>Reiner was introduced to type design by <a href="/wiki/Ernst%20Scheidler" class="freelinking" rel="nofollow">Ernst Scheidler</a>. He left Germany in 1923 to come to the United States with the goal of selling a series of <a href="/wiki/sans%20serif" class="freelinking" rel="nofollow">sans serif</a> faces, which had not yet gained popularity.</p>
    <p><strong>Work History</strong><br>
    <a href="/wiki/Klingspor" class="freelinking" rel="nofollow">Klingspor</a><br>
    <a href="/wiki/Bauer" class="freelinking" rel="nofollow">Bauer</a><br>
    <a href="/wiki/Stephenson%20Blake" class="freelinking" rel="nofollow">Stephenson Blake</a><br>
    <a href="/wiki/Monotype" class="freelinking" rel="nofollow">Monotype</a></p>
    <p><strong>Fonts Designed:</strong><br>
    <a href="/wiki/Meridian" class="freelinking" rel="nofollow">Meridian</a> (1927)<br>
    <a href="/wiki/Corvinus" class="freelinking" rel="nofollow">Corvinus</a> (1929)<br>
    <a href="/wiki/Gotika" class="freelinking" rel="nofollow">Gotika</a> (1932)<br>
    <a href="/wiki/Floride" class="freelinking" rel="nofollow">Floride</a> (1939)<br>
    <a href="/wiki/Matura" class="freelinking" rel="nofollow">Matura</a> (1939) : Designed for <a href="/wiki/Monotype" class="freelinking" rel="nofollow">Monotype</a><br>
    <a href="/wiki/Sinfonia" class="freelinking" rel="nofollow">Sinfonia</a>/<a href="/wiki/Stradivarius" class="freelinking" rel="nofollow">Stradivarius</a> (1945)<br>
    <a href="/wiki/Reiner%20Script" class="freelinking" rel="nofollow">Reiner Script</a> (1951)<br>
    <a href="/wiki/Reiner%20Black" class="freelinking" rel="nofollow">Reiner Black</a> (1955)<br>
    <a href="/wiki/Bazaar" class="freelinking" rel="nofollow">Bazaar</a> (1956)<br>
    <a href="/wiki/Mercurius" class="freelinking" rel="nofollow">Mercurius</a> (1957) : Designed for <a href="/wiki/Monotype" class="freelinking" rel="nofollow">Monotype</a><br>
    <a href="/wiki/London%20Script" class="freelinking" rel="nofollow">London Script</a> (1957) : Designed for <a href="/wiki/Stephenson%20Blake" class="freelinking" rel="nofollow">Stephenson Blake</a><br>
    <a href="/wiki/Pepita" class="freelinking" rel="nofollow">Pepita</a> (1959) : Based on Reiner's own handwriting. Designed for <a href="/wiki/Monotype" class="freelinking" rel="nofollow">Monotype</a>.<br>
    <a href="/wiki/Contact" class="freelinking" rel="nofollow">Contact</a> (1968)</p>
