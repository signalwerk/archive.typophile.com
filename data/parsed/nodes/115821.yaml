      <p>Then it's probable you should compromise on your font choice. Or this might be a good opportunity to teach a young person about the value of hard work (which font design very much involves). Because most font designers are in the same financial boat as you, and you need to understand the essential problem with your request, especially in a place dedicated to type designers. Just because you can get something for free doesn't make it a good idea in the overall.</p>
      <p>And let me ask you: what are some ~$30 items you have bought for her recently?</p>
      <p>hhp</p>
