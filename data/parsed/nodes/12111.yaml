    <p>Hey everyone, I'm doing a project involving Vaudeville and looking to incorporate Victorian Era faces. </p>
    <p>I know a lot of these aren't digitized, but can anyone identify any of the faces in these images which I scanned from an 1898 city directory? </p>
    <p>I've attached these as image links, so sorry for the inconvenice, I can't seem to upload images with the new maximum file size (anyone know what it is by the way? I can't even squeak in tiny little .gif files) and can't link either :(</p>
    <p>Anyways, here are the links for anyone willing to cut and paste them:</p>
    <p><a href="http://studentpages.scad.edu/~jschul23/typography1.jpg" title="http://studentpages.scad.edu/~jschul23/typography1.jpg">http://studentpages.scad.edu/~jschul23/typography1.jpg</a><br>
    <a href="http://studentpages.scad.edu/~jschul23/typography2.jpg" title="http://studentpages.scad.edu/~jschul23/typography2.jpg">http://studentpages.scad.edu/~jschul23/typography2.jpg</a><br>
