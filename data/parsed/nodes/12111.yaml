    html: <p>TRAIN &amp; HARTY and INSURANCE used a typeface called Columbus Bold. Beaumarchais is a digitization of Columbus (not bold). The only digital version of Columbus Bold I know of is Brendel Informatik's <a href="http://www.qbf.de/cart/cart.exe?gif=tc.gif/Stc02155.gif" target="_blank" rel="nofollow">Columbus</a>.</p>
