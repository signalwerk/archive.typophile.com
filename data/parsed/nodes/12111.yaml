    user_id: 3368
    user_name: Mike F
    user_path: null
    user_image: /files/pictures/picture-3368.gif
    date_raw: 6 May 2005 — 5:45pm
    date: 2005-05-06T17:45:00
    votes: null
    html: |-
      <p>'Civil Engineer and Architect' was done, I think, in a typeface called Obelisk. I'm not aware of any digital versions, though.</p>
      <p>Alternatives might be Letterhead Fonts' digitization of Asteroid which they call <a href="http://letterheadfonts.com/downloads/index.shtml" target="_blank" rel="nofollow">LHF Ambrosia</a>. This is squared and upright like Obelisk, but perhaps too heavy. A font with a similar weight, but fancier, would be <a href="http://www.waldenfont.com/content.asp?contentpageID=10" target="_blank" rel="nofollow">Jugend WF</a> from Walden Fonts.</p>
