      <p>Wow. Now here's synchronicity at work; regards the typography.3.jpg - last week a student called Minna Pesonen left samples reproduced from a 1906 newspaper featuring the very same typeface on my desk, with a request to please identify the headline type.</p>
      <p>Although I looked for it myself in various references (including the very Victorian Typographical Volume, Early Advertising Art by Clarence Hornung) to no avail, I also directed her to this site, but without realising this particular face was already under discussion.</p>
      <p>Looks like Columbus Bold/Beaumarchais is about to enjoy a resurgence in popularity...!</p>
