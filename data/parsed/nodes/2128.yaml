    html: <p>Hi Thomas,  <br>thanks for the explanation. <br>I think my observations were right. You confirm that at this moment these tools (generally) don't allow editing.  <br>In your next sentence you mention that users should expect that future tools might do this with an "editable flag font". But these tools are not yet available.  <br>So it will be wise to invest in editable fonts even if these fonts would cost more money compared to "Print &amp; preview" versions if you can give the guarantee that these embedded editable fonts could be used for (what Adobe calls) Full text editing capabilities? <br>Right now (in Acrobat 6.0) one needs installed fonts (editable or print &amp; preview versions) to conduct those full editing tasks in print files, such as PDF/X-1:2001.  <br>If BSA controls the fonts they won't take care of embedded fonts but check only the installed ones. And these can (at this moment) only be the ones the "editor" legally owns. <br>If you can guarantee that (future) availibility of those tools and the allowance to use them in Acrobat 6.0 it would mean that investing in an additional fee for the editable-flag versions of a typeface is not a waste of money. <br>And the proud owner who paid more for the editable version of a font just has to wait a while. <br> <br>Some EULA conditions (this tread by the way!) describe that the rights to edit at the recipients side could be delivered by just a legal document. They would not deliver the editable flag version fonts (or replace them) but just deliver the legal allowance additional to the print &amp; preview font. <br>That would mean that one still has to transport those fonts without the editable flag from the creator the the processor. Because the processor has to use those installed (print &amp; preview) fonts. <br>There is however no "proof of purchase" in such a case to show the legal rights. <br> <br>Could you give some more info on those future tools wich might do what you describe? <br>regards, Henk <br> <br></p>
