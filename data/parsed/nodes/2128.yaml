    html: <p>This is an interesting topic.  We work with some large telecom and financial organisations, and have started offering a Commercial Embedding License to these companies who want to embed the Type1/TTF's in distributed documents e.g. PDF's <br> <br>We decided on this because we realised that our barcode fonts were being embedded into Phone Bills, Financial Statements etc to lierally millions of home users per month, thus adding considerable value to the docuemnt. <br> <br>I'm all for protecting the Type Industry and think the designers should be rewarded accordingly. <br> <br>Cheers <br>Neil</p>
