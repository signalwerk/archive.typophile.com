    html: <p>Well, I'd say that if you think you would want such capabilities if they were available, you should buy fonts that permit it, both in terms of the embedding settings and the EULA. <br> <br>What a user is legally allowed to do is dependent on the EULA. The embedding settings are a separate issue, creating a maximum ceiling on what other software ought to let one do with a font. <br> <br>I can't really comment on the capabilities of future PDF editing tools, whether from Adobe or third parties. I was simply observing that it was reasonable to guess that such tools will become more capable, and will tend to respect the embedding settings of fonts. <br> <br>I'll also note that Adobe for one does not charge more for fonts that are set to "editable embedding." However, pricing is a matter for each type foundry to decide. <br> <br>Regards, <br> <br>T</p>
