    html: "<p>I _try_ to avoid any EULA that doesn't allow embedding, but it gets hard.  <br> <br>Adobe's EULA is good, Nick Shinn's is better. Storm allows modication for internal use, Linotype expessly forbids it. <br> <br>I think I _should_ be allowed to modify a font for my use, and I should be allowed to embed it. <br> <br>Font Bureau, and lots of others, require a separate agreement for embedding. This seems inequitable: I don't see why McDonald's should be able to buy, say...Whitman, and put it on their placemats coast to coast for less than it would cost me to distribute teacher's guides for my children's theatre productions as PDFs.  <br> <br>But I know it's their call, so I use Adobe fonts for my study guides. <br> <br>My $.02 CDN.</p>"
