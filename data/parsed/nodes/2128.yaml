    date_raw: 3 Dec 2003 — 7:28pm
    votes: null
    html: <p>With regards to the final form PDF proposal, it's interesting, but upon further consideration, I don't think it's really useful. There are a fair number of PDFs out there that only contain one font, and the proposal does not help at all for those cases. <br> <br>Additionally, what incentive is there for an end user to create their PDFs specifically in this format? Since that wouldn't work, you'd need to convince PDF creation software developers (at least Adobe and Apple) that they need to always do this, with all the fonts in the document that allow only preview-and-print embedding. <br> <br>Cheers, <br> <br>T</p>
