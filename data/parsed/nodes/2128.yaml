    html: <p>It is important to understand the distinction between what it technically possible with current tools, and what the Editable embedding flag suggests. <br> <br>Current tools don't (generally) allow editing with embedded fonts. However, if the embedding flag is set to Editable, it would be reasonable for such tools to use the embedded fonts for editing. Users should expect that future tools might start doing this. Until recently, there haven't been many fonts set to "Editable," but this has changed. <br> <br>Regards, <br> <br>T <br></p>
