    html: |-
      <p>I just finished an article on the embedding of fonts (web and PDF) for the Dutch magazine Publish. The reason was a dispute between a designer, the customer of the designer, the font distributor and the legal advisor of the Dutch Association of Graphic Arts Designers BNO. <br>It was a technical/legal problem and the designer (and the association of designers) blamed the distributor to provide poor information on the subject of embedding, subsetting and additional client-licenses for service applications. <br>The distributor sold fonts from some twenty sources with mostly different EULA's. <br>The user hates to read one EULA; how about twenty? <br>Designers would like a list of differences on each of the relevant conditions such as embedding allowed, subsetting requested, web embedding allowed, 5-cpu license, multi user license, multi site license, output only license etc. etc. <br>I agreed with the association of designers BNO to do some investigation on the different forms of licenses and conditions (EULA's). I agreed to do the basic research and will send an e-survey (in the English language) to font producers within short. <br>Most typefoundries in the Netherlands (as you know we have a few) agreed to cooperate. <br>Adobe, Agfa-Monotype and Linotype sponsored my earlier publication on that subject in 2001. <br>If interested I will send you the documents on this new survey and publication later this year. <br>Regards, Henk Gianotten <br>Giarte Media Group BV <br></p>
