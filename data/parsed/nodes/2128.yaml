    html: <p>Must... <br>close... <br>can... <br>of... <br>worms.. <br> <br>=) <br> <br> <br><b>You're probably right </b>that it's too simplistic to superimpose standard retail practices on the more complex needs of the embedding you're talking about. But wouldn't it be better for users and sellers to have a standard set of guidelines to start with? (Even if individual foundries' pricing and quality varies?) <br> <br><b>For example,</b> if I need a rights managed stock image, I know that Ibid,  Stone and Photonica all have different pricing and quality, but I know they use a standard set of criteria to determine the pricing. And I can enter a negotiation with any stock firm knowing what areas I can use as bargaining chips. If all the stock agencies were different I'd be entering a negotiation blind and therefore might limit my choices to the firm(s) I've worked with in the past. <br> <br><b>My point is,</b> if a given EULA is so non-standard that it makes a foundry difficult to work with, won't that hurt you more than the added protection it  would provide? <br> <br><b>Finally, I'm not against creating new protections</b> or ways to get a return on your font development for specialized devices, et cetera. I'm just adding my input  that as you forge new territory that everybody will be better served by some common standards.</p>
