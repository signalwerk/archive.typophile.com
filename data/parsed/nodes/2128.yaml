    html: <p>There is quite a lof of debate on the embedding question, partly involving protection against piracy, but also regarding the value added to things like electronic books by inclusion of fonts. There is a recognition that value is being added by font embedding, and that this value is not fixed but depends on the ways in which the embedded font can be utilised. For example, does the embedded font simply display the text, or can the embedded font be copied with text into annotations or comments? If the document includes specialised characters, there is a legitimate need to be able to display these in annotations, but then the reader of the document may also become a <i>user</i> of the font. So distributing a commercial ebook with an embedded font may be seen as distribution of that font, not simply as distribution of something made with that font as in the case of a paper book. So yes, rights management is something that is likely to be applied to fonts in future, in which users will pay different amounts depending on the collection of rights that they want to purchase, i.e. on how they want to use the fonts. The good side of this is that it will offer more flexibility in pricing, and may make fonts less expensive for some uses; however, without a serious rights management system this would lead to a lot of confusion. In other words, simply relying on people to read a EULA to know what they can and cannot do with a font is not sufficient, especially if you are trying to tailor EULA's to individual user rights. <br> <br>I don't have a problem with the idea of standardising a kind of boilerplate EULA for typical retail font distribution by companies with large libraries. I think the situation for small foundries may be more complicated. In the future, my own company will be distributing fonts under a number of different license agreements, some of which are unique to particular fonts and reflect agreements with the original clients. We will have some families in which different fonts will be covered by different licenses, because some fonts will be freely redistributable and others will not. The idea of a standardised EULA is really too simplistic for us.</p>
