  - id: 16834
    user: 909
    date: 2003-11-19T13:09:00
    date_raw: 19 Nov 2003 — 1:09pm
    votes: null
    html: "<p>With regards to standardizing EULAs, there are two things that come to mind: <br> <br>First, standardizing the *language* of a EULA might be done without standardizing the actual *content* of a EULA. It seems to me these are two different things. <br> <br>Second, standardizing the content of EULAs across foundries might run afoul of anti-trust laws. So it's not something I would pursue without consulting a lawyer. (Heck, even standardizing the language might be dangerous, though I can't see why. But I'm not a lawyer.) <br> <br>Cheers, <br> <br>T</p>"
    html_clean: "<p>With regards to standardizing EULAs, there are two things that come to mind: <br> <br>First, standardizing the *language* of a EULA might be done without standardizing the actual *content* of a EULA. It seems to me these are two different things. <br> <br>Second, standardizing the content of EULAs across foundries might run afoul of anti-trust laws. So it's not something I would pursue without consulting a lawyer. (Heck, even standardizing the language might be dangerous, though I can't see why. But I'm not a lawyer.) <br> <br>Cheers, <br> <br>T</p>"
