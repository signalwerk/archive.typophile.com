  - id: 16870
    user: 1262
    date: 2003-12-13T19:12:00
    date_raw: 13 Dec 2003 — 7:12pm
    votes: null
    html: <p><i>What's the difference between not subsetting, and subsetting at 99%?</i> <br> <br>Setting Acrobat to subset if anything up to 99% of the glyphs in the font are used means effectively that subsetting always happens. You probably are not using 99% of the glyphs, but whatever percentage you actually use, subsetting will automatically happen. The default subsetting limit in Acrobat 3.0 was 10%, so if you used more than 10% of the glyphs the whole font would be embedded. Adobe changed this default in later versions in response to requests from the font industry.</p>
    html_clean: <p><i>What's the difference between not subsetting, and subsetting at 99%?</i> <br> <br>Setting Acrobat to subset if anything up to 99% of the glyphs in the font are used means effectively that subsetting always happens. You probably are not using 99% of the glyphs, but whatever percentage you actually use, subsetting will automatically happen. The default subsetting limit in Acrobat 3.0 was 10%, so if you used more than 10% of the glyphs the whole font would be embedded. Adobe changed this default in later versions in response to requests from the font industry.</p>
