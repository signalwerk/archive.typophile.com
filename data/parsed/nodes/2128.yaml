    html: <p>Restrict embedding to cases where the embedded font  <br>can not be extracted?  <br> <br>Are there such cases? <br> <br>Yes. <br>You need to embed fonts into exe files if you are to use them in dynamic text (displaying the value of a variable, for example). The fonts cannot be extracted from the exe file (although you could create an exe file which was a text editor, embed one or more fonts and allow printing or screen capture of the text).</p>
