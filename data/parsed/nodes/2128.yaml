  user: 108
  date: 2003-11-19T10:06:00
  date_raw: 19 Nov 2003 — 10:06am
  votes: null
  html: <p>Have you ever NOT licensed type because the EULA was too restrictive? Have you ever licensed type only to realize that the EULA was too restrictive? Are there certain type foundries from whom you do not or will not license type because their EULA is too restrictive? On the other side of the proverbial coin, are there foundries for whom you are loyal because (besides beautiful and useful type) they have what you deem to be a fair EULA?  <br> <br>If you had a say in the standardization of the EULA, how would you format it? (Within reason, of course, and with what is semi-standard now.) Would you have it side with output devices or with desktops? Would you include a laptop or some sort of 70/30 clause? <br> <br>Thoughts? Ideas? Links to favorite EULAs? <br> <br>(No flaming or insulting or name calling, please.)</p>
  html_clean: <p>Have you ever NOT licensed type because the EULA was too restrictive? Have you ever licensed type only to realize that the EULA was too restrictive? Are there certain type foundries from whom you do not or will not license type because their EULA is too restrictive? On the other side of the proverbial coin, are there foundries for whom you are loyal because (besides beautiful and useful type) they have what you deem to be a fair EULA?  <br> <br>If you had a say in the standardization of the EULA, how would you format it? (Within reason, of course, and with what is semi-standard now.) Would you have it side with output devices or with desktops? Would you include a laptop or some sort of 70/30 clause? <br> <br>Thoughts? Ideas? Links to favorite EULAs? <br> <br>(No flaming or insulting or name calling, please.)</p>
