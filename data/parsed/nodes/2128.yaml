    html: <p>John (and all) &gt;&gt;&gt; From your comments, I have a few of my own. IMHO fonts are a value add at step one. I don't license type if I don't think it will add to the work I'm doing. I'm wondering if the difference between perhaps TV, Print and Film work vs. Internet, PDF, EBook (embeddable formats) is the main difference. Is this what you were saying? Maybe I'm over-simplifying. But, in your opinion, would you say anytime a font is embedded it is more than just a value add? Is it more because the font is being put in a risky environment where it can be extracted?  <br> <br>All &gt;&gt; Maybe I'm thick, but doesn't subsetting protect in anyway. Someone could explain that to me. The PDF format has become a way of life. Proofing, Comping, final versions for newspapers and magazines (who almost always require this format now).  <br> <br>It is one thing to have another license for embedding in files for resale. That makes sense and I understand that. But, we live in a day and age where PDFs are vital. Even sending PDFs to press (or service bureau) saves us (the designer) from having to worry about other elicit behavior. I'm lucky. I happy to have a service bureau to which I am connected by network. Which brings up another question ... <br> <br>Unlimited Output devices? Meaning, unlimited as long as it isn't something for resale. (again, I understand that) I think it is safe to say that we also live in a day and age where most designer's (in studio environs at least) have more than one printer to which they are connected. Which leads to another question ... <br> <br>Derivative work? I'm confused. So if I typeset a line of type on a curvy path in illustrator (whether I turn it to outlines or not) and place this into my InDesign file. Am I suddenly breaking my EULA agreement? Maybe someone can explain this to me. I'm hoping Nick Shinn answers too. <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> <br> <br>And while I've brought up the EPS file format. Let's say I design a poster in illustrator. All type to outlines. Send this to the Service Bureau. Is this violating any agreements. I've read a few EULAs there are actually some that say I cannot do this. Why? I'm not even embedding any fonts into the file. <br> <br></p>
