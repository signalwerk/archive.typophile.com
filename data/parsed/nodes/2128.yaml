    html: <p><i>If I understand Emilie's question, she's asking about making a logotype, not a font for redistribution. Right? Then this is a non-issue. Hack away and more power to you!</i> <br> <br>This actually depends on how you make the logotype. If you use the font in e.g. Illustrator, convert to outlines and then edit those outlines or even import them into a font editing program, you are not contravening any EULA that I know of. But if you open the font itself in a font editing program then you need to be more aware of the EULA terms re. decompilation and modification. 'Courier New', if obtained as part of the Windows OS, is a system component covered by exactly the same EULA as all the other software that makes up the OS. <br> <br>When we talk about whether font EULAs should be standardised, we should be clear that we are referring specifically to retail font licenses. There is a whole world of font development and distribution that has nothing to do with the retail market, and for which the typical terms of retail license agreements do not apply. If a font is developed as a component of an operating system or other software package, I don't think we should assume that we can treat it the same way as a font that is developed and sold as a product in itself.</p>
    html_clean: <p><i>If I understand Emilie's question, she's asking about making a logotype, not a font for redistribution. Right? Then this is a non-issue. Hack away and more power to you!</i> <br> <br>This actually depends on how you make the logotype. If you use the font in e.g. Illustrator, convert to outlines and then edit those outlines or even import them into a font editing program, you are not contravening any EULA that I know of. But if you open the font itself in a font editing program then you need to be more aware of the EULA terms re. decompilation and modification. 'Courier New', if obtained as part of the Windows OS, is a system component covered by exactly the same EULA as all the other software that makes up the OS. <br> <br>When we talk about whether font EULAs should be standardised, we should be clear that we are referring specifically to retail font licenses. There is a whole world of font development and distribution that has nothing to do with the retail market, and for which the typical terms of retail license agreements do not apply. If a font is developed as a component of an operating system or other software package, I don't think we should assume that we can treat it the same way as a font that is developed and sold as a product in itself.</p>
