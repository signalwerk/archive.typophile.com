    html: <p>Earlier in this treat I mentioned the condition in a license (one of the non-FontFont fonts distributed by FontShop International) to subset to 99%. (forced subsetting 99%) <br>This condition was based on Acrobat 3. What these conditions are really saying is that <br>they require that you always subset fonts.  <br>In Acrobat 4 and later, using "subset if less than 100%" causes any and all embedded fonts to be subset even if all glyphs actually in the font are accessed from within the PDF file. <br>Adobe (Dov Isaacs) explained in an earlier discussion on this subject that the subsetted fonts are specially tagged to contrast them with fully-embedded fonts. <br>In reality, the 99% of Acrobat 3 did the same thing although conceivably, if you used all glyphs in the font within the PDF file, the full font would be embedded with the special tagging. <br>The opposite of this  is </p>
