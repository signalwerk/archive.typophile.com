  - id: 16867
    user: 909
    date: 2003-12-06T09:31:00
    date_raw: 6 Dec 2003 — 9:31am
    votes: null
    html: <p>Sure, "Final Form PDF" is possible. But the only people who would actively want to use it are type foundries, and it doesn't fundamentally protect their work except when they're doing it. Sure, they could do a EULA that only allows "Final Form PDF"; but it wouldn't help with docs that only have one font in them. So there would still be *some* PDFs that would be "problematic." <br> <br>The thing is, nobody has ever demonstrated that there is a noticeable real-world piracy problem with fonts embedded in PDF. Sure, it's possible to extract fonts from PDFs. But it's just much easier to just get them off of pirate newsgroups or the like. By and large, nobody's bothering to steal them from PDFs, except for people from the type industry who just want to prove that it's possible and not all that difficult. <br> <br>All that being said, if there were a strong desire from the type industry as a whole to have "final form PDF" per this definition, I would certainly ensure that it got circulated to the decision-makers on the Acrobat team. <br> <br>Regards, <br> <br>T <br></p>
