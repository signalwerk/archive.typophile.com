    html: |-
      <p>Another really nice stressed sans by Michael Harvey is <a href="http://Mentor Sans" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://Mentor Sans</a>.</p>
      <p>And another good one is <a href="http://fontbureau.com/fonts/Amira" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Amira</a>, which has that angular energy of a lot of Cyrus Highsmith's faces. </p>
      <p>I like the heavier weights of both of these better than the light ones. </p>
      <p>Doyald Young's <a href="http://new.myfonts.com/fonts/doyald-young/young-finesse/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Finesse</a> is a super thin variant on Optima which looks good very big.</p>
