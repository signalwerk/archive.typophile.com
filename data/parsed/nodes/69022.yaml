    html: |-
      <p>Well, you said you thought it had echoes of Optima and I agree. To me it seems interesting how few stressed sans seem original. It's hard to fault Optima -- it's been around a long time and it is beautifully elegant -- but you would think more designers would tackle a new take on stressed sans faces. There must be more than I think, but offhand the only other similar style I can think of that I like a lot is Monotype's <a href="http://Strayhorn" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://Strayhorn</a> by Michael Harvey. I know it's a sans version of Ellington, but it's more than that in my opinion. Harvey shows wonderful skill with the letters, and I assume it comes from his stone cutting experience. At larger sizes (or in print), I think it's a beautiful typeface.</p>
      <p>- Mike Yanega</p>
