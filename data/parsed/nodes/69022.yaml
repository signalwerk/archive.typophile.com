      <p>Another really nice stressed sans by Michael Harvey is <a class="freelinking external" href="http://www.fonts.com/FindFonts/Detail.htm?pid=420264&amp;/cgi-bin/MsmGo.exe?grab_id=0&amp;page_id=12215&amp;query=MENTOR%20SANS&amp;SCOPE=Fonts" rel="nofollow">Mentor Sans</a>.</p>
      <p>And another good one is <a class="freelinking external" href="http://fontbureau.com/fonts/Amira" rel="nofollow">Amira</a>, which has that angular energy of a lot of Cyrus Highsmith's faces. </p>
      <p>I like the heavier weights of both of these better than the light ones. </p>
      <p>Doyald Young's <a class="freelinking external" href="http://new.myfonts.com/fonts/doyald-young/young-finesse/" rel="nofollow">Finesse</a> is a super thin variant on Optima which looks good very big.</p>
