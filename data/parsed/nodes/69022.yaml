    <p>Anyone know what the font is for <a href="http://www.thenationaltrustmagazine.co.uk">this magazine</a>?</p>
    <p>There is a display version and a text and bold version for the copy. It looks like it has some echoes of Optima. Or was it a serif face once upon a time and has had the serifs sloughed off?</p>
    <p>NJ</p>
