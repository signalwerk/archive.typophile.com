    html: |-
      <p>Well, you said you thought it had echoes of Optima and I agree. To me it seems interesting how few stressed sans seem original. It's hard to fault Optima -- it's been around a long time and it is beautifully elegant -- but you would think more designers would tackle a new take on stressed sans faces. There must be more than I think, but offhand the only other similar style I can think of that I like a lot is Monotype's <a class="freelinking external" href="http://www.fonts.com/FindFonts/Detail.htm?pid=243318&amp;/cgi-bin/MsmGo.exe?grab_id=0&amp;page_id=37056&amp;query=STRAYHORN&amp;SCOPE=Fonts" rel="nofollow">Strayhorn</a> by Michael Harvey. I know it's a sans version of Ellington, but it's more than that in my opinion. Harvey shows wonderful skill with the letters, and I assume it comes from his stone cutting experience. At larger sizes (or in print), I think it's a beautiful typeface.</p>
      <p>- Mike Yanega</p>
