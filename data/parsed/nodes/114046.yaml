    <p>Hello,<br>
    I just started writing my master thesis in LyX and I am looking for an easy to read font. I am absolutely new to typography and I would like to know what you guys think about Palatino Linotype, Adobe Garamond Pro or Adobe Minion Pro?<br>
    My thesis is not very technical or mathematical. It is mostly plain text (default size 12) with some images and charts. There will be a printed version and a pdf. Which font would you suggest for my use case?<br>
    Thank you very much! :)</p>
