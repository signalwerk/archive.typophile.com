      <p>I agree with Nina. IMHO it's not a good idea to try to find a typeface with a explicit message of itself, like Comic Sans for kids, bodoni for classical music aficionados etc... This is the kind of typographic pigeonholing I think you should avoid, especially for this kind of campaign, which is about stereotyping and pigeonholing. Making a design that looks very 'gay' (like pink, feminine and/or macho) might actually scare of a big part of the people you try to reach. You could play with these cliches, but this is a slippery slope. I would choose a modern, open-minded typeface, with no explicit connotations. Knockout could be good, but I'd rather go for something a bit cleaner, but not quite as clean as Gotham. I can't come up with names right now, but I hope this helps.</p>
      <p>cheerio Queneau</p>
