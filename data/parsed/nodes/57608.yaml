      <p>I think it's akin to 'pick a paint color for my gay friends house'. There really aren't 'gay' colors anymore than there are 'gay fonts'. What matters is context beyond the fact that its a gay issue. Gay people don't live in pink houses, after all. </p>
      <p>Finding a 'gay font' is actually going against the campaign, IMHO. The whole point of combating homophobia is to show that aside from the particular sex they date, there really is no difference between gay people and everyone else. </p>
      <p>As such, I'd suggest working on the overall campaign first. Get the message/verbiage pinned down and then see which way the visuals head. At that point, I think one could start suggesting a typeface based on that criteria.</p>
