      <p>Thank you to all of you for your prompt reply to my question. </p>
      <p>Frode, it would be great if you could send me the name of those typographers to analyse their designs. If you feel more comfortable send me an email to my personal account <a href="mailto:bitesofdesign@hotmail.es">bitesofdesign@hotmail.es</a><br>
      I really want to keep away from stereotypes and experiment with typography, text and content. </p>
      <p>Bendy, the point of my campaign is exactly as you say, 'sexuality itself is a non-issue, and the difficulty lies in growing up in a society with prejudices'. Obviously, a gay designer won't necessarily design just towards this social issue but the chances of them being involved with similar projects may be higher. </p>
      <p>The tone of the campaign is to encourage young people to come out, to be confident, to appreciate life regardless of their sexual orientation. I've recently been looking at wood type block and am considering it as an option. Wood type would represent diversity, nature, origins. Typefaces used for organisations supporting the LGB Community are mostly handwritten. There is one typeface used by one of the organisations that I really like – ‘knockout’ with its tall x-height in the lower characters. </p>
      <p>Aluminum, you are completely right. I have gathered lots of info and done a fair amount of research towards the topic, very little of the information I found is innovative and the topic is a bit of a red herring, as you describe it. I’m finding it really difficult to keep away from stereotypes and to focus on typography.</p>
