      <p>I think the sexual orientation part of this question isn't quite relevant. It's more important to choose a font that communicates 'approachable, understanding, appealing to young people'. Or something else...I don't have the design brief.</p>
      <p>I wouldn't choose a font just because the person who designed it happened to be gay. That would be the same as positive racism, and could contribute to stereotyping. ("Gay people are so creative" kind of nonsense.) Surely the point of the campaign is that sexuality itself is a non-issue, and the difficulty lies in growing up in a society with prejudices. </p>
      <p>Pick a font that fits the purpose. Have a look at what other welfare organisations are doing.</p>
      <p>I've designed promotional stuff for gay organisations but always picked fonts that communicate their tone, as I would for a straight organisation.</p>
