      <p>First of all, you mentioned <strong>Knockout</strong>. Just bought four weights of it from H&amp;FJ. Love it.</p>
      <p>Secondly, and more importantly, I have a comment about your branding and how you word this campaign's agenda. You say it's to "tackle homophobia," then you said it's to promote young closets to come out. I suppose that's under the homophobia umbrella (fear of being recognized as gay), but to many straight folk, the term <em>homophobia</em> has little to do with those who are not out and way more to do with fear/misunderstanding/hate/threat of or by homosexual society on the whole.</p>
      <p>If the goal is to do both, consider coming up with a concise mission statement. For example, the American Lung Association's mission is <em>to save lives by improving lung health and preventing lung disease</em>. It clearly delineates two separate but related ideas. Anyway, you see where I'm going. Best of luck.</p>
      <p><em>@Scott:</em> "If I was afraid to come out of the closet, a poster with rainbows and Raavie would scare me even more." Very well said. Down with taboo, misunderstood design approaches.</p>
