      <p>Wow, that other thread is a real mess!</p>
      <p>It's hard to make an informed font choice without knowing exactly what you are designing. Are you making adverts, info packs, branding the organisation or doing web design? We should be careful to focus on the design.</p>
      <p>For me and lots of gay (and straight) people, sexuality plays no part in professional life. I realise this project needs to talk about sexuality in an open way but by purposely picking a font by a gay designer there is the risk of implying a person's sexuality is relevant at work. </p>
      <p>I can see however there are a lot of different points of view so it's going to come down to you.</p>
      <p>I'd choose some lively sans. Woodtype is an interesting idea too. Will you post your design when you've decided?</p>
