    <p>Hello, </p>
    <p>I'm trying to find different typefaces that will enhance the content for a campaign aimed at tackling homophobia. The target audience for this campaign are young people experiencing a transitional period in defining their sexual orientation. Teenagers who are scared to express who they truly are in a society full of stereotypes and prejudices. Your thoughts and assistance would be very helpful.</p>
