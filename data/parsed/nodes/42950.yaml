    <p>Hi everyone,</p>
    <p>I’ve just started using FontLab Studio and I’m working on a new typeface, but I am having a few problems. I have 3 variations of each character. These variations would be used according to the preceding character. For example, variation 1 of the character a would always be used after the character b, but variation 2 would be the one always used after the character c.</p>
    <p>etc, for the entire alphabet.</p>
    <p>I’ve figured out how to create ligatures, but the problem is .. if I were to maanually create ligatures, I would have to make every combination of characters (which is like millions). </p>
    <p>I can get ligatures of ab, bc, cd etc .. But I would like to find a way to program the font so that I can get “abc” ... without having to make an actual glyph consisting of the letters a, b, and c. </p>
    <p>I hope that makes sense, and that it is possible to achieve this in FontLab Studio.</p>
    <p>Thanks,<br>
    Veronica</p>
