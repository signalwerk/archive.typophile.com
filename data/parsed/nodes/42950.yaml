      <p>Very briefly, you need to add features. For ligatures, add a ’liga’ feature:</p>
      <p>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;feature liga {<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;sub f l by f_l;<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;sub f i by f_i;<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;} liga;</p>
      <p>To replace glyphs by alternate versions in specific contexts, you need to add a ’calt’ feature:</p>
      <p>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;feature calt {<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;sub b a’ by a.calt.1;<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;sub c a’ by a.calt.2;<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;} calt;</p>
      <p>The <em>a</em> marked with a single quote (Typophile may have turned this into an apostrophe ...) will be replaced by <em>a.calt.1</em>, but only if it is preceded by the glyphs(s) not marked that way — non-marked letters are considered as ’context’ which must be present so that marked glyphs will be replaced.<br>
      Rather than defining context glyphs individually, you can also create a class and refer to this:</p>
      <p>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;@CALT_BEFORE_A1 = [b d f]<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;@CALT_BEFORE_A1 = [c e g]<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;feature calt {<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;sub @CALT_BEFORE_A1 a’ by a.calt.1;<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;sub @CALT_BEFORE_A2 a’ by a.calt.2;<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;} calt;</p>
      <p>Or define classes in FLS’s Classes Panel, but omit the <em>@</em> there.</p>
      <p>Also try to google for phrases like “feature site:typophile.com”, “feature syntax site:typophile.com”, “calt site:typophile.com”, etc. Feature issues have been dealt with extensively on Typophile.</p>
