    <p>Please forgive any foolish talking or errors—I'm not a veteran of type like a lot of the folks around here.</p>
    <p>So I've recently been considering taking on the task of designing and setting an internal marketing handbook for Chick-fil-a. It's still in the bidding and discussion process, so I'm not positive I'll get the job, but it got me thinking.</p>
    <p>Chick-fil-a uses Weiss for the majority of their printed materials. It looks all right, but it seems like a little bit of a strange choice. Do you think it's intended to look more upscale than other fast-food restaurants? Give a nod to their history? What would drive the choice of a fast food chain to select such an elegant typeface? Do you feel it works well?</p>
    <p>And further, should I stick to Weiss for their materials design? I'll have flexibility in this, and I don't know that Weiss seems the best choice. I imagine it has the flexibility for both headlines and body text, but as something that will be used in a manual day-in and day-out, is it a little too inaccessible?</p>
    <p>And if so, how far should I allow myself to deviate from their standard typographic choice?</p>
    <p>(This could all be for naught as it could end up that there are guidelines I'll need to stick to that the person who pitched the product is unaware of.)</p>
    <p>Thanks for any help you could give me.</p>
