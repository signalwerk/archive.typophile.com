      <p>I too would stick with Weiss as much as possible. Especially for headlines, titles, etc. A manual can be very text heavy so I would use a sans-serif for any body copy. Something that compliments Weiss but will be easier to read in large chunks at a small size.</p>
      <p>Since this sounds like a freelance or contract type of job, &amp; it's for an internal piece, they're not really asking for a complete re-design of their materials. But making it look a little cleaner while using some of their existing brand standards would be a good goal.</p>
