    html: |-
      <p>Ps. If you want to make sure that something reasonable will happen in applications that do not support it, you can do the following: </p>
      <p><code>feature smcp {<br>
        lookup smcp1 {<br>
          sub germandbls by germandbls.smcp;<br>
          ...all the other smcp substitutions...<br>
        } smcp1;<br>
        lookup smcp2 {<br>
          sub germandbls.smcp by s.smcp s.smcp;<br>
        } smcp2;<br>
      } smcp;</code></p>
      <p>This way, OpenType engines will have two passes at your text. The first step will replace germandbls with a ligature version of small-cap "ss", which you of course do need to include in your font in that situation, and the second pass (i.e. the second lookup) will replace that one with two small-cap "s"es, but this lookup will be ignored if an application doesn't support one-to-many. So in the newer apps, you'll get two small-cap "s"es, and in older ones, you'll get the "ss" small-cap ligature. An acceptable compromise, I think. </p>
      <p>Best,<br>
      Adam</p>
