      <p>Looks alright to me. It's spaced wide, but the spacing seems fairly even. Then again, I've never done any work in Verlag.</p>
      <p>Maybe the D could stand to be closer to the E, but that might be pushing it. </p>
      <p>The spacing between the A and the S is naturally tighter. You might try playing with that a bit. But really, it looks fine as it is.</p>
