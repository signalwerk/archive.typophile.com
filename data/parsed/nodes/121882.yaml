      <p>I don't know your level of expertise when it comes to coding websites, so maybe you've considered the following already.</p>
      <p>The most obvious and basic of several possibilities is that you don't have access to the font that's specified in the code (Proxima Nova). If that's the case, what will display is the next available font that's listed, which seems to be Helvetica Neue, Helvetica and Arial in that order.</p>
