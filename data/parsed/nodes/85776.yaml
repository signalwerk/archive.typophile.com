    <p>I just saw FontBureau's release Prensa and read Cyris Highsmith's technique of </p>
    <blockquote><p>wrapping outside curves around the inside, deliberately creating tension between the two</p></blockquote>
    <p>Apparantly this was “a technique epitomized in Electra, a 1935 bookface by twentieth-century master W.A. Dwiggins”</p>
    <p>Can anyone please explain what this means exactly. I can't really picture this and don't notice it in trying to study Electra.</p>
