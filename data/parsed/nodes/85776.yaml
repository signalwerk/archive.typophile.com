      <p>I think the aspect that Cyrus was responding to, which he characterized as “wrapping outside curves around the inside,” is slightly different than what WAD was expressing with his M-formula memo. (Note: Dwiggins never used this “wrapping” language, not that I recall ever encountering in his letters anyway.)</p>
      <p>It’s all generally related, of course, because Dwiggins was a multi-faceted thinker; but what Cyrus calls “tension” I believe Dwiggins would have referred as “snap” or “action.”</p>
      <p>The thinking that lead to the M-formula memo only crystallized several years after Electra (and never found successful expression in any of his completed typefaces). I would say the M-formula is a subset of Dwiggins’s broader explorations of Action in type.</p>
      <p>I’d have to go back to my files to find his letters discussing Action. I don’t think I have any of them transcribed.</p>
      <p>But I’m preparing to travel tomorrow and in the middle of a big project, so I don’t have time to pursue right now. Sorry.</p>
