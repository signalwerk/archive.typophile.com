    date_raw: 4 January 2009 - 1:38pm
    votes: null
    html: <p>Now that I've got my little Hobo joke out of the way, let me ask a serious question. Why use a font for a tattoo at all? A font is an industrial product, a tool for making an infinite number of letters the same way every time. Tattooing is a hand process, perhaps the last imaging art to defy automation. For those who find tattoos beautiful, the beauty is that each stroke is unique, as organic as the body it's inked on.</p>
