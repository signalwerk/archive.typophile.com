    html: <p>Cross tattoos can have several meanings. While the most obvious one is in a religious context there are many other reasons to choose a cross as an idea for a tattoo. There is certainly no doubt that there is a sense of elegance with a cross tattoo, the simple outlay of the design enables you to personalize and really make it your own through a wide variety of means. Cross tattoos can have signigicant and personal meaning to its owner which is truly a statement of individualism.</p>
