    votes: null
    html: |-
      <p><cite>"aren’t the ’tonal’ characteristics of fonts (such as voice, connotation) reducible to their structural characteristics (such as a similar ductus or stress angle)?"</cite></p>
      <p>I'd think the example in this thread (if it does work) disproves this (maybe depending on your definition of "structural characteristics").<br>
      It seems like a classic approach to pair faces that share a similar historical lineage, stress angle, construction principle, overall proportions, stuff like that. Seen from that angle, I actually don't think that Whitman and Fedra are <em>very</em> much alike; but for some reason (and I can only really hint at some similar "attitude", or <em>posture</em> maybe if you think of them as humans) they still seem to relate to each other here.<br>
      It drives me nuts, but I really can't pinpoint <em>why</em> – I think I've reached the point where the way I can talk about what I'm doing gets all touchy-feely-mystical. :-\</p>
      <p>In any case, I agree with Stephen: There are so many variables that can provide the "link" between two typefaces, as long as the "tone" is right. Of course there are still pairings that don't work well. Many. Actually, this outlook makes it harder to combine fonts, if anything, because it's less about following a given recipe. (And having fewer "hard rules", as safety nets, makes it harder to trust one's eyes – which is probably also why I posted this here.)</p>
      <p>*</p>
      <p>Anyway, yes, I felt I wanted to give Whitman some extra leading, to give its extenders some room to well, extend. :-) It feels like a generous face and I don't want to squeeze it onto the page. And also because the measure might end up being a bit long.<br>
      But all that hasn't really been carefully figured out yet – please see this thing above as a raw sketch of sorts.</p>
