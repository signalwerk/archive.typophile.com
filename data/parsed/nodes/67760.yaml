    <p>Hi, as part of my current Uni. project I am researching the use of Times New Roman, and really need to build up a gallery of pictures of it in use.</p>
    <p>I've been doing some searching but can't find an awful lot, I was wondering if anybody could suggest some campaigns/identities to look at, particularly major ones, but the more the better.</p>
    <p>Thanks<br>
    -Ben</p>
