  html: |-
    <p>I'm starting to get more and more fonts built up in my library. Believe it's time to outgrow Font Book and look for something more professional. </p>
    <p>I'm on Snow Leopard (Mac) and the tools I use are Illustrator CS4, Photoshop CS4 and a lot of Fireworks CS4. </p>
    <p>What I'm looking for specifically is a font management application that allows for auto activation for any program that I use on my system. For example, if I open up a project in Fireworks, or even Microsoft Word or Excel, and have used a font that is no longer activated as of right now that it will automatically activate the font for the time being just for that particular program. </p>
    <p>I've tried several programs, FontExplorer X (free), Suitcase, Fontcase (by far my most favorite that I've tried), etc. But for some reason I can't get the auto activation to work seamlessly without getting in the way of my workflow. </p>
    <p>Maybe I'm doing something wrong or maybe auto activation only works correctly with plugins for Photoshop and Illustrator CS4, but I don't seem to have much problem with Font Book's auto activation. </p>
    <p><strong>What's your suggestions and possible instructions?</strong></p>
    <p>I'd love it if Fontcase worked, but I don't think it has its own auto activation and not sure if it uses Snow Leopard's system auto activation funciton.</p>
