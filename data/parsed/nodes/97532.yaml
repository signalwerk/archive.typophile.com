      <p><em>- how and why have free font websites developed</em><br>
      Because lots of free fonts were available, and people like free stuff.</p>
      <p><em>- opinions on free font websites and how often people use them.</em><br>
      Some are great, some suck. People use them as often as they want free stuff.</p>
      <p><em>- the legality issues with font licenses to see what part this plays in the industry (commercial licenses, piracy and intellectual property)</em><br>
      Which legality issues? People tend to remember what benefits them personally, and ignore what doesn’t.</p>
      <p><em>- the wider debate of amateur vs professional in a number of creative industries.</em><br>
      Many professionals—such as myself—started out making free fonts. OTOH, many gifted amateurs provide the world with some very usable fonts, and a lot of hacks serve up pure-D crap.</p>
      <p><em>- how it is affecting professional foundries</em><br>
      Some people get spoiled, having access to free stuff, and thus tend not to respect the IP rights of professional foundries…IMHO.</p>
