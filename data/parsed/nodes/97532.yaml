      <p>There are free font sites that have only fonts that can legitimately be there, and there are “free” font sites that have a noticeable number of commercial fonts, illegally. The latter tend to really tick off the retail font designers and foundries.</p>
      <p>Other than that, the question should not be so much about the web sites (they are just a distribution mechanism) but the availability of free fonts. Mostly, they suppress the market for casual font purchasing, and reduce the market for inexpensive and semi-pro quality fonts. But they certainly do affect the total market. The degree of impact varies widely for each type designer and foundry. People who do a lot of commission work are relatively unaffected.</p>
      <p>Cheers,</p>
      <p>T</p>
