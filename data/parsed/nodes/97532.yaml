    <p>Hi everyone</p>
    <p>My name is Craig and I'm currently in my third year of BA (Hons) Graphic Design. I am in the process of writing my dissertation, and my chosen question is: In what ways are free font license websites affecting the type design industry and professional type foundries?</p>
    <p>To summarise I am going to investigate:<br>
    - how and why have free font websites developed<br>
    - opinions on free font websites and how often people use them.<br>
    - the legality issues with font licenses to see what part this plays in the industry (commercial licenses, piracy and intellectual property)<br>
    - the wider debate of amateur vs professional in a number of creative industries.<br>
    - how it is affecting professional foundries</p>
    <p>I'm going to leave the subject open without questions, but I would really appreciate if you could briefly explain your views and opinion on the subject. </p>
    <p>Any reading recommendations would also be greatly appreciated</p>
    <p>Thanks in advance<br>
    Craig</p>
