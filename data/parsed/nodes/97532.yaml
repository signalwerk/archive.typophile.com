      <p>Hi everyone<br>
      My apologies for the slow reply, and thank you for all your responses</p>
      <p>Let me try and respond to each reply:</p>
      <p>@oldnick that definitely summarises the research I have done so far. I was also going to try and research the wider debate of amateurism vs professional not only in design but also in photography, music etc.</p>
      <p>@Karl Strange at the moment I am just starting to work on the essay, so I am looking at both the different variations of fonts which are "free for personal use", but also the illegal use of commercial fonts through distribution such as sharing fonts with friends, downloading from torrent sites etc. I understand that this is really quite vague at the moment, but I am hoping through research the wider argument I can work down and focus on the most important section, and rewrite focusing on that.</p>
      <p>@Chris Dean thanks for your help, will make sure I credit properly throughout and in the bibliography</p>
      <p>@Thomas Phinney that's interesting, I didn't realise there were some that were distributing commercial fonts like that illegally. Can anybody point me in the direction of one of these sites (not to use obviously, but to name and shame in the essay. If this is not allowed on the forum then do not worry)</p>
      <p>@Nick Shinn That is a very good point, I am still in the early stages of writing, so am working quite broadly at the moment. Like you say, I feel like focusing on the shape and design of the type would be much more relavent to my studies. </p>
      <p>@hrant very interesting idea. The hunt for further research begins</p>
