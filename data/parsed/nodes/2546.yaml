    html: "<p>Hi Addison, <br> <br>just a couple of spontaneous thoughts as they come to my mind: <br> <br>1) First off, is that a comma after \"catering\"? <br> <br>2) Personally, I'm not too much fond of off the peg letters along curves (it's something different with handmade letters) and the combination with an cursive-all-caps-with-expert-T's setting doesn't tend to have me change my mind. To me, especially the cursives seem too much in combination with the arced text. The T's as such are nice. The curved text does look less serious than the straight one. <br> <br>3) I'm a bit undecided about whether the sharp, high-contrast letters (\"Enviting Events\") go good together with the uniform stroke width and the sketchy freehand feeling of the graphic. They might, I think. I guess I'm just not too happy with the letters - for some reason I don't yet know how to elaborate. <br> <br>jpg</p>"
    html_clean: "<p>Hi Addison, <br> <br>just a couple of spontaneous thoughts as they come to my mind: <br> <br>1) First off, is that a comma after \"catering\"? <br> <br>2) Personally, I'm not too much fond of off the peg letters along curves (it's something different with handmade letters) and the combination with an cursive-all-caps-with-expert-T's setting doesn't tend to have me change my mind. To me, especially the cursives seem too much in combination with the arced text. The T's as such are nice. The curved text does look less serious than the straight one. <br> <br>3) I'm a bit undecided about whether the sharp, high-contrast letters (\"Enviting Events\") go good together with the uniform stroke width and the sketchy freehand feeling of the graphic. They might, I think. I guess I'm just not too happy with the letters - for some reason I don't yet know how to elaborate. <br> <br>jpg</p>"
