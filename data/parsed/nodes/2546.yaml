    html: <p>Hi Addison <br> <br>I think the drawing is perfect and I would keep it. I also like the type choice (the second arrangement, not the type on a curve) and the contrast of styles between the casual graphic and the formal type. I think this works because the people planning these kind of events (your client's customers) are going for this combination of casual elegance in their parties. (Although that's just a guess because I'm definitely not part of that world.) <br> <br>Either element by itself would be either too casual or too formal, but combined they really play off each other nicely.  <br> <br>The graphic also has a soft, "girly" kind of vibe which I think would appeal to the kind of person planning parties like this. <br> <br>The frame around the outside of the whole thing -- I don't see how it adds anything. I thought maybe that was to indicate the edge of a business card (is it?). <br> <br>The brackets around the second statement add an element of whimsy that I think works here. I might think about colors other than black and red. Maybe if the red wasn't so bright but more of a burgandy, which might look good paired with a gray (instead of the black). <br> <br>Overall I think you are very close to a really nice solution for your target audience. <br> <br>Rob <br> <br></p>
