  html: <p>I'm working on a logo for a group of three women starting an event planning/catering business. They've requested something classy and sophisticated but fun. The name, as well as the spelling of "enviting," is their idea. I've been playing with the invitation concept for a while and need a fresh pair of eyes. Let me know what you think. <br> <br>Thanks, <br>Addison <br> <br><img src="http://www.typophile.com/forums/messages/29/23118.gif" alt="Logo sample"></p>
