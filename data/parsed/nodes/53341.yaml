  html: |-
    <p>Hi typemates,</p>
    <p>I am designing my new personal web site that is practically based only on typography (a sort of swiss style inspiration). The site is all set on Helvetica, but I know most of my visitors are Windows users and do not have it installed (and even if they had it, I think the rendering of Helvetica on a Windows browser wouldn't be nice at all).<br>
    So I tried the fabulous <a class="freelinking external" href="http://typeface.neocracy.org/" rel="nofollow">Typeface</a> script to replace my text and still make it accessible and gracefully degradable. My first choice was use Helvetiker, a ready-to-go Helvetica-like (actually Helvetica-clone) type, based on <a class="freelinking external" href="http://www.ellak.gr/fonts/mgopen/index.en.html" rel="nofollow">MgOpen Moderna</a>, but there's a serious problem: the font does not have some special characters I need, like cedilla (ç) and some accents (á, for example). These characters are essential for me, since the site has its main version on Portuguese.<br>
    I cannot use Helvetica itself since it is not embeddable. So anyone knows another free typeface very similar to Helvetica that has special characters?</p>
    <p>Thanks</p>
