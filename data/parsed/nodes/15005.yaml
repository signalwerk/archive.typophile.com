      <p>&gt; <em>what does it need to transform space into typography and typography into (usable/interesting)space.</em></p>
      <p>I generally think of typography in 2-dimensions and architecture in 3-dimentions. But I did study architectonics under <a href="http://www.ArchitectureWeek.com/2003/0108/design_1-1.html" target="new" rel="nofollow"><strong>John Hejduk</strong></a> who was more a poet visionary than a brick-and-mortar architect.</p>
      <p>Also, I've always felt that Antoni Gaudí's <a href="http://www.GreatBuildings.com/buildings/Casa_Batllo.html" target="new" rel="nofollow">Casa Batlló</a> in Barcelona was as textured as Catalan manuscripts, if that's what you mean.</p>
