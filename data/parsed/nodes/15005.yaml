      <p>thanx for the hint on the book!<br>
      the aim of the project so far (i'm just at the start of my research!)is not to analyse each and every city and its typographic applications. my aim is to generate an overview of possible ways of dealing with citys to generate a certain typography. based on this information i want to focus on the relation of space and typography (an the other way around, as in buildings and citys based on letters f.e. the alphabet city by paul noble).<br>
      or in other words: what does it need to transform space into typography and typography into (usable/interesting)space.</p>
