    <p>hello,</p>
    <p>as a part of my architectural studies at the university of darmstadt in germany, i'm currently working on an analysis of the relationship of typography and space and character of a city and the impact they have on each other.<br>
    my main emphasis so far is:<br>
    :: how much a city's type (ci) represents its charcter, and/or space<br>
    :: can one type represent the many different charcters and atmospheres most modern citys include in their metropolitain area?<br>
    :: how much does a type named after a city represent the city, what is the inspiration for the name?<br>
    :: are there other ways of creating a city's typography?<br>
    :: does a city have a certain typographical style? in the signs? in the graffiti?<br>
    ...<br>
    i'd be happy about any comment, link and every other bit of information, that would help me gather information on this subject!</p>
    <p>björn asmussen</p>
