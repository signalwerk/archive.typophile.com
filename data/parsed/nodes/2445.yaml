    html: <p>It takes forever to load, Its boring (too boxey, break out of the boxes please)and I hate having to wait for flash animations. The date is cut off on right hand side (I'm using Safari) There should be a splash screen where you could bypass any animation. On the plus side the navigation is straight forward. I don't go to sites to entertain me if I want entertainment I will go to a movie. I want information, and ease of navigation, if its interesting to look at, good, but not at the cost of reading content. Just some thoughts</p>
