    html: <p>When redesigning stick the mainmenu and submenus together at all times. Keep it on the same place throughout the site. There are few things that are worser than having to look for the navigation. <br>Try to find some grid so it all feels tight and fixed. right now everything seems to float around <br>The current site doesn't have an eyecatcher of some sort, the top animation is to wide and cluttered. <br>The type is way to booring. <br> <br>Be gentle and subtile with them. They have ordered and paid for the current site and it's like their baby. you dont tell other people that their kids are ugly right :-). What I'm trying to say is that you dont want them to become defensive...it happens to me all the time though :-( <br> <br>/fredde <br></p>
