    html: "<p>ok, my few thoughts: <br> <br>the animations are to big, the menu/navigation shouldnt be centered, the colors dont \"match\", the contrast between top and content is to \"hard\" (black/white), the whole site is a bit to hectic (because of \"all\" the animations), the date bug occurs in firebird/win, too, the shadowed boxes on the solution page are ugly, the different menu levels are confusing because the 2nd level menu is placed to deep and doesnt seem to have a relation to the top level menu, this top level flash animation doesnt make any sense it's just disturbing, the right hand menu on the 1st page is confusing to, too much text on the 1st page imho, ... hth: lars</p>"
