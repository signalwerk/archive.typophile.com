    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/12270" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Typefaces</a>&nbsp;:&nbsp;Univers</strong></p>
    <p>Univers was designed by <a href="/node/12118" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Adrian Frutiger</a> in 1956 and released by the Deberny <span class="amp">&amp;</span> Peignot type foundry in 1957. It is a neo-grotesque sans serif; it features optically even stroke weights and a large x-height to improve legibility. It’s become known for the variety of weights and set-widths included in the family. At the time it was designed it included 21 variations, and was the first type family to implement a numbering system as opposed to using names. Today there are over 27 different variations of Univers available. Univers is an extremely diverse typeface that has the ability to work very well at large display sizes for applications such as headlines and mastheads as well as in small sizes for body&nbsp;copy.</p>
    <p>During the 1990s, Adrian Frutiger worked together with <a href="/node/13697" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Linotype</a> to expand his classic Univers family. The result, <a href="/node/15663" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Linotype Univers</a>, includes 63 different weights, each drawn carefully to ensure compatibility with all the&nbsp;others.</p>
    <p><a href="http://www.linotype.com/1560/univers-family.html">The original Univers type family</a> can be found online <a href="http://www.linotype.com/1560/univers-family.html">here</a>. Linotype Univers can be found on this <a href="http://www.linotype.com/6-1813-6/linotypeunivers.html">overview page</a>.</p>
    <p>Additional information regarding history, usage as well as the entire family of typefaces can be found the <a href="http://www.fonts.com/font/linotype/univers">Univers Family Page</a> on&nbsp;Fonts.com.</p>
    <p><strong>Discussion:</strong></p>
    <p><a href="http://typophile.com/node/33301">Helvetica vs.&nbsp;Univers</a></p>
