    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Typefaces" class="freelinking" rel="nofollow">Typefaces</a> : Univers</strong></p>
    <p><img src="http://upload.wikimedia.org/wikipedia/commons/thumb/d/d3/Univers_Specimen.svg/198px-Univers_Specimen.svg.png" img=""></p>
    <p>Univers was designed by <a href="/wiki/Adrian%20Frutiger" class="freelinking" rel="nofollow">Adrian Frutiger</a> in 1956 and released by the Deberny &amp; Peignot type foundry in 1957. It is a neo-grotesque sans serif; it features optically even stroke weights and a large x-height to improve legibility. It’s become known for the variety of weights and set-widths included in the family. At the time it was designed it included 21 variations, and was the first type family to implement a numbering system as opposed to using names. Today there are over 27 different variations of Univers available. Univers is an extremely diverse typeface that has the ability to work very well at large display sizes for applications such as headlines and mastheads as well as in small sizes for body copy.</p>
    <p>During the 1990s, Adrian Frutiger worked together with <a href="/wiki/Linotype" class="freelinking" rel="nofollow">Linotype</a> to expand his classic Univers family. The result, <a href="/wiki/Linotype%20Univers" class="freelinking" rel="nofollow">Linotype Univers</a>, includes 63 different weights, each drawn carefully to ensure compatibility with all the others.</p>
    <p><a href="http://www.linotype.com/1560/univers-family.html" rel="nofollow">The original Univers type family</a> can be found online <a href="http://www.linotype.com/1560/univers-family.html" rel="nofollow">here</a>. Linotype Univers can be found on this <a href="http://www.linotype.com/6-1813-6/linotypeunivers.html" rel="nofollow">overview page</a>.</p>
    <p>Additional information regarding history, usage as well as the entire family of typefaces can be found the <a href="http://www.fonts.com/font/linotype/univers" rel="nofollow">Univers Family Page</a> on Fonts.com.</p>
