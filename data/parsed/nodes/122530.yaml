    date: 2015-01-17T22:22:00
    date_raw: 17 Jan 2015 — 10:22pm
    votes: null
    html: |-
      <div class="comment-spam-body"><blockquote><p>For a beginner, isn't it really saturated? What is really a new good and interesting design nowadays? Could you give some examples?</p></blockquote>
      <p>How do your own skills have any influence on whether or not the market is saturated? It's not a matter of opinions. The market simply isn't saturated. It may seem that way because there are a lot of typefaces in the same style being released, which may give the impression that there is no innovation taking place. But even within certain styles, I constantly see innovation. Not every typeface is original, but at least once a month a typeface is released that fills a small gap, and at least once a year a typeface is released which makes me think "Damn, that's brilliant. If only I had thought of that". The principle of multi-layered typefaces is also a new one, of which we've only just started to explore the possibilities. As technology improves, the possibilities will increase as well.</p>
      <p>One could only speak of a saturated market if there is an end goal or if it's an isolated market which doesn't change over time. However, no one knows how typefaces and language will change over time, so it seems ludicrous to suggest not only that we have all the typefaces we need, but also that innovation isn't necessary. How do you reckon it will work if the world keeps changing but there are no more typefaces being made?</p>
      <p>Also, it seems you suggested there are enough typefaces based on style. I think there aren't enough, and I feel several of my typefaces do fill small gaps in the market, and I have plenty more ideas. But also note that a lot of type innovations are more or less invisible — particularly so for the layman.</p>
      <p>One great example of "invisible" innovation is the introduction of specific formats for use of typefaces on the web. I'm calling this invisible because on blogs you will see a lot of newly released typefaces and as such you will get insight into the styles, but you won't get insights into various other aspects of the market. As such, you may get the crazy idea that because you see the same styles over and over (which might have a lot to do with the selection process of the blogs as well, as not every blog owner will be equally knowledgeable about type) the market is saturated, while in fact behind the scenes there is A LOT going on. A few years ago typefaces became available for use online, and so now everyone is upgrading their fonts for use on the web. So even if there are no new styles coming out, it will take years to upgrade all the typefaces for use on the web. Also realize that a lot of typefaces lack extensive language support. There are so many languages and so few typefaces that support the majority of them. In upcoming years typefaces will likely become more elaborate, with a wider language support and more features. Lots of typefaces lack small-caps as well. Could the market be saturated when there is actually still so much missing from the typefaces currently available?</p>
      <p>And even if there is no truly original work coming out, currently a lot of major companies feel they should get a custom typeface which meets their exact requirements. So in that regard the market isn't saturated either. The world requires a lot of custom typefaces.</p>
      <p>Also, type used to change over a time span of at least 50 years. It seems strange for a layman not to spot anything original in a few years and conclude the market is saturated. I know nowadays things change more rapidly, but it still takes some time for big innovations to occur. Besides, one could say we're consciously changing type slowly, because if you do it too fast it will have a very negative impact. People need time to get used to certain changes. I'm certainly seeing certain trends and changes in book typefaces in the last 20 years, so I suspect in another 20 years we will definitely have more insight into what characterizes our period. If after 20 years you look back and conclude type has stayed the same in 40 years, you might be able to say the market is saturated (or its designers have become stale). I can already see that this won't be the case. Besides, I have the feeling we're on the verge of dramatically changing the way we connect and communicate, the way we use the Internet, and the way typography is handled on the web. In time, typography on the web will be a lot closer to typography in print.</p>
      </div>
