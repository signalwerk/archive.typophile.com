    <p>Hey guys.</p>
    <p>I was a follower of Typophile and typography in general some years ago. Grew tired to be fair and here I am once again.<br>
    Here I was thinking in doing some stuff once again and found myself with a question.<br>
    Aren't there are already too many type faces? Is there any space for new ones? New foundries? Is it still profitable enough to live without eating rice and tuna everyday?<br>
    What is your opinion on these subjects?</p>
