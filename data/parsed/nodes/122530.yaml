      <p>When I was an art director in the 1980s, I knew all the typefaces available, and that situation continued until the turn of the milennium. Now I suspect it is impossible, even for industry specialists such as Stephen Coles, to be aware of every typeface published.</p>
      <p>But I wouldn’t say that this expansion of products is the same thing as saturation. The market is homeostatic, and it is not saturated as long as foundries keep on releasing new designs!</p>
