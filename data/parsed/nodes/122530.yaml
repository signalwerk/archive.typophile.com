    html: |-
      <p>The number of opportunities available in type design is greater than ever before. So is the number of people pursuing it, mind you. I'm not sure the percentage of people who are successful is higher, but the numbers are.<br>
      75 years ago, you pretty much had to work for a type foundry and mostly the only way in was through apprenticeship.</p>
      <p>35 years ago, you mostly had to work for a typesetting machine manufacturer, and again apprenticeship was important. There were no schools teaching type design as a full program.</p>
      <p>15 years ago, it was difficult to break into the field without being at a foundry, but at least there were again a number of them. Starting your own foundry or working with an existing foundry as an independent was an option, at last. There were a couple of schools starting to offer degrees in type design.</p>
      <p>Today, you can be your own foundry or distribute through a reseller, and anybody with a computer can learn type design. There are a variety of degree programs and shorter courses available from schools that have really developed polished curricula. The number of people making a go of it as type designers is almost certainly vastly greater than at any previous point in history.</p>
      <p>There are problems, to be sure. But in many respects it is a golden age of type design. I feel lucky to be part of it.</p>
