    html: <p>I find it most tiresome that this comes up so often, as it would be unusual in any other creative or practical discipline for someone to think it reasonable to stroll in and say "Why don't you just stop having ideas and creating new things. There's enough now." When a field is saturated with competition, all that means is that success requires being particularly good and original.</p>
