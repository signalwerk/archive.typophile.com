      <p>It seems that the letterforms in <a class="freelinking external" href="http://www.fontshop.com/fonts/downloads/garagefonts/district_family_ot/?&amp;sample_text=GROUND%20MAPLES&amp;update=0">District Thin</a> are pretty similar. I guess it could be further thinned by adding negative (white) stroke. The shapes also are close to <a class="freelinking external" href="http://www.fontshop.com/fonts/downloads/font_bureau/interstate_thin_ot/?&amp;sample_text=GROUND%20MAPLES&amp;update=0">Interstate Thin</a>, which is closer to the weight here. </p>
      <p>- Mike Yanega</p>
