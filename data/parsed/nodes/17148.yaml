    <p>THE CHALLENGE...<br>
    1. open the attachment<br>
    2. slap a "speaker banner" of some sort on it<br>
    3. email it back to <a href="mailto:smith.traci@gmail.com">smith.traci@gmail.com</a> (or put it back on here as a word document)</p>
    <p>THE RATIONALE/EXPLANATION...<br>
    so it's the middle of finals week at princeton, and i'm trying to make some speaker name tags for a conference coming up (sounds simple enough, but not for me, because i don't know what i'm doing!) i love good design, and i hate it when things are cheesy. (which makes this EXTRA frustrating...)</p>
    <p>so now it's 4 am and i'm getting NOWHERE. i thought i'd put the challenge out to you all. i've seen your work; it's amazing. (i lurk around these message boards all the time) i am quite certain you can do something in 15 minutes that i've been trying to figure out for 4 hours. (i'm not kidding) here's the template, in microsoft word (i know, i know, seriously!) all it needs is some way to designate that the nametag belongs to a speaker, and not an attendee... a banner across the top? the word "speaker" at an angle? i'm not kidding about how easy this should be, i just don't know how to do it, and so i'm having a nervous breakdown. </p>
    <p>i'll pick my favorite one, and speakers all over princeton will be thankful they don't have to wear a hideous nametag for 3 days...</p>
    <p>it has to be done by 4pm tomorrow. </p>
    <p>PS, if you want to change the fields for names, that's fine, they just can't move around at all (because the princeton theological seminary logo is in the whitespace...)</p>
    <p>i'm hoping this works, or i'm just getting out a sharpie, seriously :) </p>
    <p>traci </p>
    <p>PS the conference is a conference about human rights, and i'm a student who's not getting paid to do this work (lest you worry that this newbie is trying to use you to do my work...)</p>
