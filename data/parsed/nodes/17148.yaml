      <p>Then just write SPEAKER on it! Really big; Like this even:</p>
      <p>SPEAKER<br>
      Johann Wickersdorf<br>
      Super-dooper Conference</p>
      <p>…would be fine. People will notice. The name itself doesn't have to be too big. People won't read it from more than a yard away anyway. And just their wearing nametags, you two target groups, will be almost notice enough. I mean, how many people walk around Princeton all day wearing badges?</p>
      <p>You're almost thinking about this *too hard,* Traci, although—on the other hand—I'm glad that you are thinking about design at all. I wish that everyone would pay this much attention to detail, especially at a place like Princeton.</p>
