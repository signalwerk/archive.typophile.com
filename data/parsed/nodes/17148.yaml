      <p><em>off topic, but…</em></p>
      <p>No, probably not. But I always wanted to try it. Robert Bringhurst spells the "G" and the "H" in the Germany corporate abbreviation "GmbH" (Gesellschaft mit beschränkter Haftung) with Small Caps, which looks really funny to me, since I never see it like that (well, I have some German books from the 50s that do it, too).</p>
      <p>Like I said, I've always wanted to try it. But if it were my print job? No, I doubt it.</p>
