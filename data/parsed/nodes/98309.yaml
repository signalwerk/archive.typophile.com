    html: <p>I think in order to have an ideal writing system you would need to have an ideal as to the information that it carries and how how that information is carried. Hangul seems an ideal writing system <em>if</em> the information you think a writing system should carry is strong representation of the articulation of spoken language. But writing systems exist to be read, so I would say that any ideal needs to be reckoned in terms of readability. That implies comparing writing systems as read by native speakers in terms of quantifiable measures such as speed, comprehension and fatigue. The trouble with such comparisons is that because different writing systems capture different kinds of linguistic information, it is difficult to isolate information type from representation type, i.e. you can't easily tell whether a measurable difference between writing systems is due to what they capture of how they capture it. So, for instance, might Chinese script be either better or worse than a Latin alphabet in reading performance tests because it captures semantics instead of phonetic and etymological information, or because of the shapes of the signs themselves?</p>
