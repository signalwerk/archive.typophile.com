      <p>It is not clear that type designers - unless they're effectively moonlighting by engaging in alphabetic reform - are affected by where a script comes from. Whether it represents the sounds of a language well or poorly does not matter to what the shapes should be.</p>
      <p>But Chinese script is connected to the underlying language. Most characters are built from a radical and a phonetic, so that after memorizing a limited number (about 800-1000) of basic characters, a Chinese person can read any character. (The proper "spelling" of uncommon characters, which of several choices of phonetic to use, still has to be memorized, but English has a similar problem.)</p>
      <p>It's only because individual syllables are more likely to carry meaning in the Chinese languages that they could get away with a character-based script; Japanese had to add a phonetic script for its inflections.</p>
