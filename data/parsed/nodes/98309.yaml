      <p><em>the shapes of characters correspond to the phonological articulation of the sounds they represent</em></p>
      <p>Korean Hangul is usually cited as the best example of this, in which the shapes of the jamo components actually correspond to the shape of the vocal system during articulation. But, of course, such a system is as vulnerable as any other to normal variation and change in pronunciation.</p>
      <p>To my knowledge, the Inuktitut syllabary is not based on such a correlation. Different phonemes are captured by rotation of a smallish set of signs, which seem to have been devised by Evans and Peck based on efficiency of typefounding rather than a relationship to articulation.</p>
