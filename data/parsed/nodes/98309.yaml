      <p><em>So I'd say that all of Unicode's efforts in this area are towards enabling language-specific conventions, not to influencing a trend towards treating diacritics as letters.</em></p>
      <p>You’re right.<br>
      I had it backwards.<br>
      According to my logic, foundry type, in which the accent and letter were cast as a single item, would have been responsible for encouraging people to think of accented letters as distinct alphabetical entities.</p>
      <p>The most persuasive concept is probably that if letter and accent overlap to form a contiguous whole, with no space between, then they constitute a distinct letter; as in Polish. Can you incorporate this principle into your boxes and ovals diagram (if you think it makes sense)?</p>
