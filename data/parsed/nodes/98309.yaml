      <p>On the question of the <em>ideality</em> of writing systems, see what Mark Seidenberg and what David Share have to say on <em>optimality</em> in their commentaries on Ram Frost’s recent discussion paper: ”Towards a universal model of reading,“ available at: <a href="http://gsite.univ-provence.fr/gsite/Local/lpc/dir/user-556/FrostBBS012.pdf" title="http://gsite.univ-provence.fr/gsite/Local/lpc/dir/user-556/FrostBBS012.pdf">http://gsite.univ-provence.fr/gsite/Local/lpc/dir/user-556/FrostBBS012.pdf</a><br>
      Mark Seidenberg’s commentary (“Writing systems: Not optimal, but good<br>
      enough”) starts in page 43, David Share’s (“Frost and fogs, or sunny skies? Orthography, reading, and misplaced optimalism”) starts on page 45.</p>
      <p>I especially like the David Share suggestion that we think of writing sysrems as “dual-purpose devices that must provide <em>decipherability</em> for novice readers and <em>automatizability</em> for the expert.”</p>
