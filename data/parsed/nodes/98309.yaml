    <p>Hello every one , Today I had intense talk about the connection  between writing systems and languages . My view is in most cases it has no connection. My question is  how  important is this connection to type designers ? Is this connection between language and writing systems documented some where ? I know for sure  nations who uses ideographic writing system the symbols  has no connection to the spoken language. Writing systems like  Urdu or Persian are forced in to the Spoken language (which Is Arabic writing system) in short my final question is how much is linguistics important to type designers ?<br>
    Thanks a lot  and Happy Thanks Giving,m<br>
    Aleme</p>
