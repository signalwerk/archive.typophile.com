      <p>I really do encourage you to read Florian Coulmas' book. As he points out in it, the relationship of writing to language is complex, and it is also subject to the fact that spoken language changes more quickly -- not only over time, but also regionally -- than written language, which has a tendency to standardisation. What this means is that an orthography that starts off being largely phonetically based ends up, like English spelling, being etymologically based, i.e. what it captures about the language is information about roots and relationships, rather than about strictly how words are pronounced.</p>
      <p>When I talk about understanding how a script captures a language, I mean understanding what kinds of linguistic information are present in the writing. Generally, there is a mix of information. As you've noted, Chinese script mostly captures semantic content, which means that the same text can be read by people who actually speak quite different languages. Alphabetic scripts mostly capture phonetic content, but because of the ways in which pronunciation changes this is seldom entirely accurate for long, and hence the writing systems end up capturing historical content (this is particularly the case in English due to the great vowel shift).</p>
      <p>Elsewhere in the thread today we were talking about French diacritics. Here's another entertaining example of a writing system capturing something historical: the circumflex accent in French in many situations has no readily discernible effect on pronunciation, but rather marks where the spelling of the word used to contain a letter <em>s.</em> Hence, the circumflex in the French word <em>fenêtre</em> indicates that the word used to be spelled <em>fenestre.</em> The accent is maintained as a marker that captures the root relationship to related words, e.g. the verb <em>défenestrer.</em></p>
      <p>These are the sorts of things I mean by understanding how a writing system captures languages. Fundamentally, I think a basic understanding must be had of the core kinds of linguistic information present in the writing and <em>how</em> it is present. Hence my diagram, above, which shows the kinds of ways consonant (blue square) and vowel (red circle) information is present in Indian writing systems.<br>
      _____</p>
      <p>When I wrote that no particular script is linked <em>in any limiting way</em> to a particular language, I meant that even when a strong association links a particular script with a single language, there is nothing inherent in the script that limits it to this unique use. The strong association is produced by history and culture, not determined by the script, which can always be adopted or adapted to writing another language. And if you look carefully enough, you will almost always find it to be the case that this did, in fact, happen. Even in the case of Armenian, which is now associated solely with the Armenian language and culture, one finds that during the Ottoman period the script was actually used to write -- and indeed print -- both Ottoman Turkish and other Turkic languages. Tom Milo presented an example of Armenian-scripted Turkish orthography during his <a href="http://vimeo.com/51437729" rel="nofollow" class="link-external">presentation at this year's ISType conference</a>, making the case that the structure of this system provided the model for the eventual Latin-script orthography introduced in the 1920s.</p>
      <p>Likewise, the Georgian script has been used to write, at least, Mingrelian and Svan, and probably other languages of the region.</p>
