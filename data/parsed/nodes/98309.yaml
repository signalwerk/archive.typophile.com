      <p>The convention whether to regard a sign as a letter or as a diacritic is practically related to sorting: e.g. does ö sort with o, or by itself. I don't think there is any rule or even general principle by which this develops: it is conventional and language-specific. There may even be debate among the users of a language over the question, as there is over the Dutch IJ digraph.</p>
      <p>Nick, I don't understand your comment. Unicode doesn't have any say on what characters are treated as letters in a given orthography and which are not. Unicode provides a generic sorting algorithm, but expressly notes that this is insufficient for language processing.</p>
