    html: <p>I would suggest hanging the quotes in the headline and dropping Ever to the next line. Perhaps right rag the body copy (personal preference) or make sure the copy is all flush, including the last line if you are going to justify (hanging punctuation here too.) The 2nd to the last line in the body copy looks a bit loose, right rag would fix this.</p>
