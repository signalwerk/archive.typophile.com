    votes: null
    html: |-
      <p>First, correct the path direction:<br>
      Contour &gt; Paths &gt; Set PS Direction</p>
      <p>Then, remove the overlaps:<br>
      Contour &gt; Transform &gt; Merge Contours<br>
      (Default shortcut seems to be Apple-key + F10 in the Mac version. In the same menu part there are Get Intersection and Delete Intersection which you may not need that often.)</p>
