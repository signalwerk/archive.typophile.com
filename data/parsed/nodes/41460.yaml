    html: |-
      <p>I'm with Q on this one - I have seen some real benefits to leaving contour merging (a.k.a. overlap removal) to the end as a near-final step in generating the output font. This is especially true if you're working in MM space, and/or going to be doing italics that will start out with modifying the roman.</p>
      <p>Cheers,</p>
      <p>T</p>
