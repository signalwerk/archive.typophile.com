    <p>Hi there!<br>
    Here i am again...<br>
    Well i started to do my own font, now i'm with a problem. When i save it shows some strange lines on the glyph.<br>
    I'm most certain that is because i have two paths on the same glyph. I've done two or more paths so it could be easier to bezier. Can anyone tell me how to join both paths into one? or do i have to take the paths to mask and bezier on top?</p>
    <p>Thanks,<br>
    Joel Santos</p>
