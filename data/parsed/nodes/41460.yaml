    html: |-
      <p>You might not want to Merge Contours if you want to be able to easily tweak characters along the way. I usually only merge right before I'm generating a otf/ttf (and not save it afterwards).</p>
      <p>Usually setting PS Direction on paths solves the overlap. If not, you can manually choose 'Reverse Contours' from the right click menu on any shape.</p>
