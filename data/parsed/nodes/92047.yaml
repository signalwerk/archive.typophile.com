      <p>Not ﬁrst edition unfortunately (hey, it was $2.95), but at least it’s set in a contemporary typeface—Baskerville. Unlike the Dickens, set in Bembo; I really detest reading books from or about the mid 19th century that are set in Renaissance faces. I look forward to the day when I can change the font (but still prefer paper today).</p>
      <p><em>Otranto</em> is not quite what I expected, the supernatural events are a bit silly, starting with a member of the royal household being crushed to death by an enormous helmet. Anyway, this is my introduction to “real” Gothic literature, apart from <em>Frankenstein</em> of course and the satirical <em>Nightmare Abbey</em>.</p>
