      <p><a href="http://www.amazon.ca/The-Railway-Man-Eric-Lomax/dp/0099582317" rel="nofollow">The RaIlway Man</a></p>
      <p><cite><br>
      Eric Lomax, a British army soldier, was captured by the Japanese during the Singapore campaign of 1942. A railroad buff since a child, he took strange pleasure in his work as a POW on the Burma-Siam Railroad, which was later the subject of the film Bridge Over the River Kwai. When his captors discovered his detailed drawings of the railway, he was suspected as a spy and tortured for years. Fifty years later he discovered that the interpreter during his tortures was still alive. The two arranged a meeting and Lomax forgave him. Here is the exciting, moving and truthful account. </cite></p>
