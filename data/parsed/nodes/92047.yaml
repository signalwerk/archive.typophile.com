    <p>I’ve just reached 1850 in Claire Tomalin’s <a href="http://www.guardian.co.uk/books/2011/oct/02/charles-dickens-life-tomalin-review" rel="nofollow"><em>Charles Dickens: A Life</em></a>.<br>
    I bought it for a long plane ride, primarily for my interest in the beginnings of the modern magazine, and to learn something of the lives of creatives in that era, paying special attention to the relationship between capital, freelancing and technology in emergent media.</p>
    <p>I did interrupt my reading to skip through <a href="http://www.guardian.co.uk/sport/blog/2012/mar/21/squash-james-willstrop-shot-ghost" rel="nofollow"><em>Shot and a Ghost</em></a> by James Willstrop, lent to me by a squash buddy. I left out the personal bits and concentrated on the matches and his diet and training. Quite a different kind of personality than Dickens, but still young, and he may yet follow an unconventional path when he retires from professional competition.</p>
