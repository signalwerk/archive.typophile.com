    html: <p>I read Tressel’s book a while ago, but some of it has stuck with me. Recently I was looking for old doors to replace modern “improvements” made to our Victorian home, and came across a door with faux wood-graining of the kind that would have been done by the protagonist. If I had not read the book, I would probably have dismissed it as crap, and continued to look for a door of better quality wood (or painted over it), but knowing the story behind the effect, I was chuffed to install it as is—even though it doesn’t really match anything else in the room.</p>
