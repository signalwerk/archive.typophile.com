      <p>Extremely ‘light’ stuff — almost floating; in other words: thrillers, eg Michael Connelly, Baldacci, Lee Child, Ridpath, Nesbø, etc. Guys and gals who produce at least one book a year (the dead ones’ books are in storage, to be reread in a while, or passed on to other people).<br>
      On the other hand: biographies (Warburg), history (prof. Israel), inside stories (Michael Lewis) and trade books (Roger Escoffon!).<br>
      I don’t read as much as I did 40 years ago (12 a week), but try to get at least one a week behind my belt. I hardly ever read books in my native language, I prefer English and a few German ones now and then (Kehlmann).</p>
