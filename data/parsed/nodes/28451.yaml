  html: |-
    <p>Dear All,</p>
    <p>I am helping with the design and production of some product brochures and other materials based on print advertisements. The ads have been put together by another graphic design/ad agency and use Monotype Neosans and some version of DIN (possibly the Font Font one). The layouts for the ads have minimal text and the choice of fonts seems to work quite well there (they are not up for changing either).</p>
    <p>The other materials are quite text heavy and neither Neosans or DIN are suitable for the amount of text that needs to be set. Neosans has quite a limited character set which will cause too many problems, whilst I have a personal dislike of DIN and especially for body text.</p>
    <p>I would like to find another font or family for setting the body text which has a full(-er) character set and is more suited to extended reading. I think another sans font would work best as a serif would jar with the other two fonts. A sans is also more in keeping with the nature and the image of the product which is a protective device for active sports.</p>
    <p>Look forward to hearing any thoughts or suggestions.</p>
    <p>Regards,</p>
    <p>Grant</p>
