      <p>Stefan,</p>
      <p>I agree, three sans is a bit much, but thankfully both Neosans and DIN have been used sparingly. I tried setting the text in DIN but it just doesn't work (I readily admit that I am no fan of DIN). </p>
      <p>I have taken a look at both ITC Conduit and Emigre's Solex families. Solex seems to be a reasonable choice (some similarities to Neosans and DIN but much more readable) and might work quite well. Conduit is perhaps a little too quirky too sit in the background.</p>
      <p>Thanks,</p>
      <p>Grant</p>
