      <p>Three differnet sans serifs sound a bit "over kill". I would go for just two. Also please note that DIN is not really meant to be used as a headline typeface. Why not use DIN as the body copy and Neo Sans as the headline option. Still if you're looking for other suggestions, two of my own designs, SOPHISTO or STALEMATE might fit? Have a look yourself;</p>
      <p><a href="http://www.macrhino.com" title="http://www.macrhino.com">http://www.macrhino.com</a></p>
