    <p>Elk Grove Village, IL -- January 26, 2010 -- Ascender Corporation, a leading provider of advanced font products, today announced two font software distribution agreements. ClubType and Nick's Fonts represent the latest type foundries to offer their high quality TrueType and OpenType fonts to Ascender's broad based of customers, ranging from creative professionals to software and hardware developers.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/clubtype-PR-01_3818.jpg"></div><p></p>
    <p>Ascender offers over 10,000 fonts from a select range of premium type foundries to hardware manufacturers and software developers who require fonts to include with a product. Ascender provides multilingual fonts, user interface fonts and custom fonts for the OEM market. The new fonts from these two international type foundries will expand the font selection available to Ascender's OEM and ISV customers.</p>
    <p>The new fonts are all available online for a preview, purchase and download from the <a class="freelinking external" href="http://www.AscenderFonts.com" rel="nofollow">AscenderFonts.com</a> font store. The site features a wide range of type styles from distinctive text fonts and elegant script fonts to fashionable display fonts.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/nicks-fonts-PR-01_3728.jpg"></div><p></p>
    <p><em>About the Type Foundries:</em></p>
    <p><strong><a class="freelinking external" href="http://www.ascenderfonts.com/foundry/club-type/" rel="nofollow">ClubType</a></strong><br>
    Club Type was founded by Adrian Williams in 1986 in the UK to offer a range of exclusive, high quality typefaces for ad agencies, creative professionals, publishers and corporations. Adrian Williams began his career converting hot metal typefaces for phototypesetting and has evolved with technology into the digital era by designing fonts for corporate identity and branding commissions. The Club Type Collection is highly regarded for its attention to typographic detail.</p>
    <p><strong><a class="freelinking external" href="http://www.ascenderfonts.com/foundry/nicks-fonts/" rel="nofollow">Nick's Fonts</a></strong><br>
    Nick's Fonts features the artistic and prolific typographic talents of Nick Curtis. Nick's Fonts is dedicated to the preservation of our rich typographic heritage. Most of the fonts are based on authentic historical sources, gleaned from the massive collections of the Library of Congress. The font collection captures a variety of genres including the Wild West, Roaring 20s, Jazz Age and nostalgia-inspired typefaces.</p>
    <p><strong>About Ascender</strong><br>
    Ascender Corporation is a leading provider of advanced font products. Ascender's founders are font industry experts and have been involved in developing many of the most important and influential fonts used in computers, mobile devices, consumer electronics and software products. Ascender provides multilingual, custom font development for a wide range of customers including creative professionals, enterprises, software developers and hardware manufacturers. Ascender also provides an extensive collection of TrueType &amp; OpenType fonts for download to graphic designers and consumers through its font websites, including <a class="freelinking external" href="http://www.AscenderFonts.com" rel="nofollow">AscenderFonts.com</a>.</p>
    <p>Contact: Bill Davis<br>
    Ascender Corporation<br>
    25 Northwest Point Blvd, Suite 225, Elk Grove Village, IL 60007 USA<br>
    Phone: (847) 357 0730<br>
    Fax: (847) 357 0731<br>
    English: <a href="http://www.ascendercorp.com" title="http://www.ascendercorp.com">http://www.ascendercorp.com</a><br>
    German: <a href="http://www.ascendercorp.de" title="http://www.ascendercorp.de">http://www.ascendercorp.de</a></p>
