    html: <p>Since Dax doesn't have stems that extend upward past the tops of the m or n, I don't think this can be Dax. Giacomo isn't right either, if that smaller text is the same face, because it has a y with a curved tail and Giacomo's is straight. Giacomo's a has a curved tail and this font doesn't. I'm going off to search the <a href="http://bowfinprintworks.com/SansIDPage.html" target="_blank">Sans Serif Font ID Guide</a>.</p>
