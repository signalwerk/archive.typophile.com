    <p>Hi all,</p>
    <p>So recently I seem to have caught the 'typography obsession' bug that a lot of you seem to have (noticing everything about every font everywhere!), and as such have been looking a lot into getting into designing a typeface myself.</p>
    <p>I know there are lots of FAQ sections and How To's, and I've read all those, but there's one point in particular I'd like to hear people's thoughts on... "purpose".</p>
    <p>It seems to clear to me that every new typeface has to have a purpose, a reason to be created, or has to be meeting a need. "It looks nice" isn't really enough of an argument, and also seems to lean too far to the 'art' side of the art/design balance. </p>
    <p>How do you go about choosing a purpose? For experimental projects is it worth choosing a restriction (e.g. geometrical etc.) or a broad purpose (e.g. children's books etc.)? Not even just for a 'beginner' like me, but in general, it would be nice to know what people identify as the 'purpose' for a new typeface at this crucial stage early in a new design.</p>
    <p>Thanks,</p>
    <p>Adam</p>
