    html: |-
      <p>Many of my fonts are commissioned so there's always some kind of purpose involved. When I'm not working on commission, I still have a purpose in mind such as <em>heavy, compact web headliner</em> or <em>narrow, antihistorical typewriter</em>. At the very least, a font is designed with either headlines or text in mind. When testing a headliner, I don't need to worry so much how it performs in paragraphs at small sizes. When testing a text font, I don't need to worry as much about how it will look on a billboard.</p>
      <p>"It seems to clear to me that every new typeface has to have a purpose, a reason to be created, or has to be meeting a need."</p>
      <p>You can make up your own hypothetical needs too. I've done that quite a bit. <a href="http://www.typodermic.com/196.html" rel="nofollow">Silicone</a> is a font I designed to look good embossed in silicone. Nobody commissioned it for that purpose, it was just done on a whim. Having a purpose in mind makes it easier for me to make a unified design.</p>
      <p>Not every typeface is made with purpose. I made <a href="http://www.typodermic.com/225.html" rel="nofollow">Voivode</a> with no purpose in mind. I opened up Fontlab, started drawing glyphs and let myself go. Voivode sold almost zero copies so that might tell you something. Some of my earlier fonts (Larabie Fonts) were experiments with no purpose in mind other than releasing them.</p>
