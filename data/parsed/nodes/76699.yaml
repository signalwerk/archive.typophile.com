    html: |-
      <p>We also have somewhere in our total memory and experience a sense of what the "Essence" of a letterform is. This is not a style or classification issue.  It is more about developing a form which will be reasonably interpreted as a particular glyph.  It has "B-ness" or which ever form we mean. (I dare not say "A-ness ;-)<br>
      This is not necessarily a skeletal form and may require the rest of the glyphs in the set to make its case. If we just take a skeletal form "B" and clothe it in a suit of serifs, we may see it approaching Roman Letter but it may be a poor example. Essence requires enough to elicit the desired response; "Yes, this is a Roman letter B".  I think of it more in Plato's terms of "Seeing Forms" than just a Fontstruct kind of thing.<br>
      If, as type designers, we have acquired the vision to "see forms" in the typographic sense, then we do not need to examine existing fonts (although there still is an education in it). This may only be my preferred way of working but I find it valuable as a way of arriving at the specific by beginning with the general and avoiding using a specific known solution without first banging my head on it a while.</p>
