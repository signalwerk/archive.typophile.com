    html: |-
      <p>I tend to have very different reasons for making a typeface: intersting form I've found, and then trying to incorporate that into a font; an existing typeface that I like, but which has some forms that irk me (I made Kaapeli for this reason); mechanical or technical features, like ink trapping. For this I made two families: Tang with huge, exaggerated ink traps, and Tar with round corners, and so controlling the trapping.</p>
      <p>And also just because it's fun.</p>
