    html: |-
      <p>Adam, if you are new to type design, and have caught the "obsession", may I suggest you start by trying to recreate something you like by not looking at it. Put a type design you admire in your mind. Look at it, study it, contemplate it, and then go about recreating it without going back for reference. You'll create something new and have fun at the same time. And how interesting would it be to compare your "inspired" design with the original.</p>
      <p>You will then be doing what most type designers are doing, using your "sense memory" of a typographic form to direct a new design.</p>
