      <p>&gt;To a lesser extent by far, fonts that have hundreds of weights that are so close together you can’t see a difference but you can’t buy an assortment with a smaller, more sensible set.</p>
      <p>You’d never use adjacent weights on a page, you’d pick weights that are separated by several intermediates. I remember Luc(de) Groot making this point very eloquently at Fuse 94 when talking about Thesis. </p>
      <p>The other use for two closely weighted styles would be when reversing out some text white on black and wanting the visual weight to match the black on white. Example being <a href="http://www.fontshop.com/index.cfm?fuseaction=verity.search&amp;font_categories_search=font_name_search&amp;searchstr=transit&amp;image.x=22&amp;image.y=8" rel="nofollow">FF Transit</a> "Front" and "Back"</p>
      <p>But not being able to pick and choose the fonts you need seems a bit wrong. Got any examples of this all or nothing bundling practice? </p>
      <p>Cheers, Si</p>
