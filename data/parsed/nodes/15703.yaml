  html: |-
    <p>I have done a brief list of the most overused typefaces in extended text (as in books and magazines) and would like to see if I'm not mistaken, I would like to have comments from people in different countries and I am specially interested in latin american people comments as well.</p>
    <p>Arial<br>
    Baskerville<br>
    Caslon<br>
    Century<br>
    Garamond (in it's diverse advocations)<br>
    Helvetica<br>
    Minion<br>
    Optima<br>
    Palatino<br>
    Times New Roman<br>
    Univers</p>
    <p>Thanks!</p>
