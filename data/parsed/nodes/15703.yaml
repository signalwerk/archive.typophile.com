      <p>&gt;In those magazine articles you write, do you rely heavily on empiricism?</p>
      <p>I don't have a research budget, so really all that's objectively available to "prove" that a trend is happening is information on font sales from a few distributors.</p>
      <p>The AIGA "top 50 books" named the typefaces. That's a competition and would tell you more about the judges' taste, perhaps, but interesting.</p>
      <p>I don't see why it wouldn't be possible to do a statistical survey of type use. In Canada one could start with the book Canadian Advertising Rates and Data, which lists audited circulation of publications. Then you'd go to a magazine store and check the top 100 and see what their text types were. Same thing for newspapers.</p>
      <p>Book Sales: pretty straightforward too.<br>
      Harry Potter and DaVinci Code would give you the "most read" fonts.<br>
      Berkeley Old Style in Harry Potter, innit?<br>
      So "most read" is not necessarily "most used font " or "most licenses sold".</p>
      <p>On the internet, it would perhaps be possible to devise a crawler that sought out the most visited sites and checked what fonts they used. </p>
      <p>I suspect that the most read faces, measured in characters multiplied by readers, would be internet "core" fonts. It would be interesting to compare that with newspaper text faces.</p>
