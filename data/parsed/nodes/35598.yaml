      <p>Day 2 is complete!</p>
      <p>What you may have missed:<br>
      A ton of volunteers busting their butts to make sure that things flow as seamlessly as possible. I can't name everyone, but certainly Kent Lew and Michelle Hill deserve a round of applause for the hard work they've been doing in directing the various students and type refugees in making Typecon2007 the best ever!</p>
      <p>Quote(s) of day 1:<br>
      Jeff Barlow of AIGA Seattle:<br>
      <strong>"We're volunteers; we don't have names."</strong></p>
      <p>or </p>
      <p><strong>"Is there anyone at the table as smart as me?"</strong></p>
      <p>Quote of day 2:<br>
      Otmar Hoefer, Director of Font Marketing at Linotype Library:<br>
      Regarding Helvetica set as text copy:<br>
      <strong>"You can read it if you want to."</strong></p>
      <p>I won't be there for most of day 3, so if you get a quote, post it!</p>
