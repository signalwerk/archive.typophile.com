  html: |-
    <p>Just got back from the hotel, where I dropped off six participants from the first TypeCon workshop. The workshop, on Math fonts, took place on the Microsoft campus. In true TypeCon tradition we over-ran by an hour, but on the plus side the adjoining cafe was closing just as we came out, so we all got free BBQ!</p>
    <p>The weather is beautiful and the mountain is out - made the commute over the 520 bridge more than bearable.</p>
