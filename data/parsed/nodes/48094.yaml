    <p>Dear all,<br>
    I want to welcome you warmly from a small amazing country - Moldova, where i currently work and live.</p>
    <p>In the last 2 months i've been working on a concept for a fashion, beauty and lifestyle magazine (size: 230mmx290mm) for women and in the last days i came back to the issue of typeface for logo.<br>
    Check the attached image and tell me what word do you read? Are there some letters that you hardly understand? Some people say the typeface i used (bodoni poster) is too bold for a magazine for women but i tried to stand out and do smth different from magazines like vogue, elle, l'officiel, bazaar, plus you can see that the magazine name is way long and strange :) that pushes me to search for a good readable typeface.<br>
    Any other suggestions of typefaces?<br>
    What typefaces you think about when i say women, fashion, beauty, lifestyle?</p>
    <p>namy thanks,<br>
    Dumitru</p>
