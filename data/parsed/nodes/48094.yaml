      <p>This might be pushing the boat out a bit here but <a class="freelinking external" href="http://subtype.org/wyld/" rel="nofollow">Wyld</a> by Subtype is a stunning contemporary face, clearly designed with fashion magazines in mind. Definitely worth a look I think even if it's legibility isn't great.</p>
      <p>Otherwise you could try a different tack altogether. <a class="freelinking external" href="http://www.sudtipos.com/fonts/2" rel="nofollow">Affair</a> by Alejandro Paul has a very feminine feel and with it's huge set of ligatures I'm sure you could create something very exiting indeed.</p>
