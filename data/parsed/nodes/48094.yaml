    votes: null
    html: |-
      <p>With everything so tight, the counters in the "e"s become too open.<br>
      I would recommend narrowing both the top counter, and also the width of the right stroke, and possibly opening the i_l_u letterspace by a small amount (or, alternatively, increasing the space inside the "u"), for a better overall colour/tone.</p>
      <p>You see, the relative stroke widths and negative space within "u" and "e" are designed for text setting small, with normal tracking. They are designed to be different from one another, so that text matter doesn't become too grey. However, in an ultra-tight display setting, these differences become a liability, nbot an asset.</p>
      <p>By the way, is there some other way to deal with the Abreve accent, for settings with negative leading?</p>
