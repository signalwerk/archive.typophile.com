      <p>Hey Terry. I don't know if this comes too late, but there is an old Letraset face – Vienna Extended ©1989 Antony De Meester – which matches the structure of what you show above, although the B is different. The A is a dead ringer. Possibly there was a regular width Vienna that may come closer, or the job for the BBC was altered by hand as others are suggesting. Linotype have Vienna Extended at<br>
      <a href="http://www.linotype.com/142843/viennaextended-font.html" title="http://www.linotype.com/142843/viennaextended-font.html">http://www.linotype.com/142843/viennaextended-font.html</a></p>
