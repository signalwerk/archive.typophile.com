  - id: 165842
    user: 2088
    date: 2006-10-31T08:27:00
    date_raw: 31 Oct 2006 — 8:27am
    votes: null
    html: |-
      <p>That's the closest yet, but this one is making me nuts!  There is something disturbingly familiar, but I don't know if it's because I've actually seen it somewhere, or it reminds me of other things, like <a href="http://www.myfonts.com/fonts/linotype/itc-rennie-mackintosh/" rel="nofollow">Rennie Mackintosh</a>.</p>
      <p>I started thinking that if this is a commercial font it has to be from somewhere relatively obscure, and so I look at FontHaus -- no joy-- , and then I hunted through the old Precision Type Catalog through the forgotten foundries they used to sell -- nothing there either.</p>
      <p>It's not clear to me whether this high-waisted, draftsman lettering style, is supposed to be Art Nouveau, Craftsman, or Art Deco, but it's definitely old. The Frank Lloyd Wright fonts that P22 sells are sort of this vintage, but no matches.</p>
      <p>I have a feeling that this is an existing font, but maybe from a very old (defunct) digital source.</p>
      <p>- Mike Yanega</p>
