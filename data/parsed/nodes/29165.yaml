      <p>Cheers for that Ben. Pretty close - it seems to be the original font that <a href="http://www.dafont.com/interdimentional.font?nb_ppp=50&amp;text=BABYLON" rel="nofollow">Interdimentional</a> is based on over at Dafont.</p>
      <p>Cheers for all your help on this guys. I was working on a pitch in connection with this project and ended up using Interdimentional - I just modified the letters that didn't match.</p>
      <p>Thankfully you'll all be glad to hear the pitch was successful and on receiving the assets to start the project I can now announce the winner is....</p>
      <p>a custom build (hats off to Patty and Tiffany)</p>
      <p>I'm sure I've seen it somewhere before but all the evidence in the font points to it being put together for this programme.</p>
      <p>Once again, many thanks for your suggestions.<br>
      Terry</p>
