    html: |-
      <p>I have had to solve this sort of thing in the past . . . you have to play off the similarities of the elements to make something greater than the sum of the individual units. </p>
      <p>A Light Bulb for each of the four<br>
      but the bulb is somehow morphed into an object of the trade.</p>
      <p>a paint brush for the designer<br>
      a tv for video<br>
      a camera lens for the photog<br>
      a microphone for audio </p>
      <p>or </p>
      <p>A Bird for all of them<br>
      and each is wearing/interacting with a device of the trade. . . . </p>
      <p>BTW - originality is a thing of the past - just be unique in the implementation of your style...</p>
      <p>Above all let us know how it turns out...</p>
      <p>thanks - versonova</p>
