    <div class="info">Submitted by <a href="/user/909" title="View user profile.">Thomas Phinney</a> : 12.Jan.2006 5.23pm </div>
      <p>Feel free to pass this around or post it as you like. This is the first opening doing actual font development at Adobe in over eight years.</p>
    <p>* * * * *</p>
    <p>We have a mid-level type development position open, and are looking for someone to join a team that continues to define the state of the art in font technology and type design. In this position, you would help us develop new fonts, enhance current fonts, and perhaps create some new designs for our font library.</p>
    <p>This position would involve close collaboration with the rest of the development team to produce fonts. This would include activities like kerning glyphs, creating layout features and extending or completing Adobe designs.</p>
    <p>requirements<br>
    -  understanding of type design principles<br>
    -  several years’ experience with font production software and technology<br>
    -  python scripting experience<br>
    -  work in Silicon Valley area of California (relocation assistance available)</p>
    <p>preferred<br>
    -  good understanding of font technology<br>
    -  experience defining OpenType layout features<br>
    -  read and write multiple languages<br>
    -  experienced with some non-Latin writing systems<br>
    -  able to communicate clearly about typography and font technology</p>
    <p>contact<br>
    David Lemon (Sr Manager of Type Development, Adobe Systems)  <a href="mailto:Lemon@adobe.com">Lemon@adobe.com</a><br>
    Ross Pasquale (Recruiter, Adobe Systems)  <a href="mailto:RPasqual@adobe.com">RPasqual@adobe.com</a></p>
