      <p><em>&gt;Dan, any idea if other sizes of Palatino (besides Michelangelo and Sistina) might be revived?</em></p>
      <p>No, Carl, I don't think so. Michelangelo and Sistina were uniquely-designed members of the overarching Palatino family… they weren't optical revisions for display printing… some of the letters differ radically in ways that don't seem to bear a direct relation to size and legibility… they are meant to harmonize perfectly with Palatino text settings, but not be Palatino text (only larger).</p>
      <p>But even taking this into account, I disgaree that Palatino nova doesn't cover size well. It doesn't have the dizzying array of variants found in Warnock, but it covers the bases that most designers will probably need. Aldus nova is particularly suited to book text (about 8–10 points). Palatino nova Regular is a great all-around Roman, which does quite well in 10–12 points. Palatino nova Medium can also be set small too, depending on printing conditions and needs. Palatino nova Light is good for display purposes, as is Palatino nova Titling (which should be used big), and Palatino nova Imperial, which can be used big as well, but works great in smaller display sizes where Titling might come out too light.</p>
      <p>Hermann Zapf is certainly not a stranger to legibility techniques used in metal composition sizing… I'm sure that he and Akira took optimal size performance into account in this version. The old "flair" of Palatino is certainly present in Palatino nova, it goes back to the original idea of Palatino, which was compromised in conversions to hot-metal and photo-typesetting machines.</p>
