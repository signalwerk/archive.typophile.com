      <p>Palatino Sans and Palatino Sans Informal are two families that complement Palatino nova perfectly, and which I hope will cause quite a stir. But they are not finished yet, and they will be released later.</p>
      <p>I think that this is because Hermann Zapf sees Palatino nova as a family in and of itself… it is his definitive reworking of the entire Palatino family. D. Stempel AG advertised all of the Palatino products (Palatino, Aldus, Michelangelo, Sistina) as a complete, interrelated family, but subsequent conversions were never treated that way (i.e., Palatino Linotype is great, but there is no Aldus whose metrics match Palatino Linotype's exactly, nor a Sistina, Michelangelo, etc.). All of the faces within Palatino nova are interchangeable… that hasn't been easy to get in print since the days of handset type.</p>
      <p>Palatino Sans &amp; Palatino Sans Informal will be just as mixable and interchangeable, but aren't part of the Palatino nova family in the simplest sense. Sorry to disappoint ;-)</p>
