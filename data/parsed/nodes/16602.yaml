    <p>It seems to me that the versions of Palatino™ we see today are slightly... how should I put it... "dumbed down" from the one I remember seeing as a kid. This would be only about 25-30 years ago. The version I liked seemed to resemble Michelangleo a little bit, but of course had a lowercase version.</p>
    <p>Some of its features as I remember...</p>
    <p>• the lowercase e had a much more pronounced diagonal cutoff at its corner<br>
    • the gooseneck on the numeral 1 was much more pronounced<br>
    • the thin parts of the zero were roughly diagonal from each other; the zero in the present Palatino™ has its thin parts almost vertical from each other</p>
    <p>I'm sure there were more differences, but... am I imagining things here? Can anyone shed some light on this?</p>
    <p>By the way... I love this site. I thought I was the only one around that obsessed about this stuff!</p>
    <p>Mike</p>
