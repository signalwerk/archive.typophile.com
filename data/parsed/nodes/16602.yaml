      <p>From what I have seen so far, I think the Palatino Nova is a fine achievement, and I would be very happy to have it in my personal type collection.</p>
      <p>That being said, I agree with the comments that it does not seem to capture the "moxie" or flavorfulness of the original metal type, even the 10-12 point versions. There are a number of specific details that spring to mind, but the shape of the serif on the lowercase "a" is one of the things that bothers me the most, in comparison to the metal version.</p>
      <p>Nonetheless, it is a great typeface, and I'm sure it's a better piece of work than anything I'll ever do.  :/</p>
