      <p>Sergej, a team of inhouse designers at Linotype several years ago developed Frutiger Next. Adrian Frutiger drew a few new characters for them (like the new ß, quite different from the ß in Frutiger), but the true italic glyphs (a,e,g, etc.) came from the other designers' hands/heads. As you must know, almost every typeface Adrian Frutiger has designed makes use of obliques instead of italics, so Frutiger Next is an interesting exercise in that regard. Frutiger Next also includes condensed styles, which had been asked for by designers for about a decade.</p>
      <p>Hermann Zapf is much more hands-on and active. Even at 87, he comes into the office regularly to work with Akira on the whatever projects they happen to be working on at the moment. He seems to be in excellent health.</p>
