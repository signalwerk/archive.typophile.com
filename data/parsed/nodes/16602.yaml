      <p>Mike, </p>
      <p>More to your question: Since Palatino was designed for metal setting in the 40's, it was manufactured in several sizes. Larger cuts, intended for display sizes, would probably have had the features you remember. The digital version available for years was based on drawings for a smaller size, hence the apparent coarseness. Even the original metal type at small sizes differs greatly from the first digital version (I'm looking at one of the first metal settings, Pen and Graver). I don't think Linotype is including any different size variants in the new release. I must disagree with Adam, I think some of the 'flair' of Palatino's display cuts has been lost. Proportions, shapes, details, and color are all different, but some of this may be format conversion issues.</p>
      <p>Dan, any idea if other sizes of Palatino (besides Michelangelo and Sistina) might be revived?</p>
