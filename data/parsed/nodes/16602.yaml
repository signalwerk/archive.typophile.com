      <p>The differences I remember, and see checking the luc site and comparing are the right-leaning A and the S and s that are unique--obviously influenced by black letter S. Also pointed out at the luc site are the lack of serif on p and q. also the jpq are shorter than the g. In the original digital version, and also the Optima Nova, the A and Ss are made more 'normal.' serifs given to the pq and EF; and the g also seems somewhat redrawn. Altogether the original has more 'moxie', though the revised version may well work better in text. It is a pity that the new version doesn't at least have the original characters as alternates, for display purposes. </p>
      <p>Also, I don't know if the original Michaelangelo and Sistina had the right leaning A and the quasi black letter S, but I am curious. </p>
      <p>How much was this Zapf? I ask because I can't believe that he wanted the condensed version of Optima that is part of Optima Nova. It really is disappointing, and I am surprised that he approved it. </p>
      <p>I am interested to see the sans, especially because of my pet theory that the best sans and the best serifs never come from the same hand.  I'd be very happy to be refuted. In any case, coming from Zapf--if it really is from him!--it is bound to be very interesting, however successful.</p>
