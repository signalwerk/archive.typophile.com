    <p>I have been searching high and low for this handwriting font:<br><a href="http://wtfcdn.myfonts.com/uploads/images/8b/8be25b1e4b02fdc9b570ddbf0a94f318.66981.jpeg">http://wtfcdn.myfonts.com/uploads/images/8b/8be25b1e4b02fdc9b570ddbf0a94...</a></p>
    <p>Nobody on WhatTheFont forum can help, and I have trawled through every handwriting font on MyFonts - over a thousand of them. I've seen it used in the Whiskas catfood advert, but in other places as well. Can anyone help?</p>
    <p>thanks</p>
    <p>Phil</p>
