    html: "<p> Thanks for the report - it actually fits in with my own memories exactly. Including the part about packing inappropriately: I had three sweaters! :-/  So I ended up taking *tshirts* to a launderette... <br> <br>Anyway, the conference was superb, and people were really too nice all 'round - it took me aback!  :-) <br> <br>BTW, that picture I used is 17 years old - it was the most recent semi-photogenic picture I had... <br>I haven't had facial hair since '91. Actually, past tense: I decided to shave on the plane back home, but was low on battery, so I left a goatee, and have now decided to keep it for a while. It makes me feel young...  :-/ <br> <br>Anyway, Vancouver it is! <br> <br>hhp </p>"
