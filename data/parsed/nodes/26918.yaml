  html: "<p><b>How do I post a type identification request?</b> <br> <br>At the top of the main page you'll see a link which says <a href=\"http://www.typophile.com/cgibin/board-post.pl?HTTP_REFERER=/83/83.html&amp;action=form\" target=\"_blank\"> Start a new thread &gt;</a>. Click it. You can also use the <a href=\"http://www.typophile.com/cgibin/board-post.pl?HTTP_REFERER=/83/83.html&amp;action=form\" target=\"_blank\"> Start New Thread</a> in the gray block at the bottom of the thread list. <br> <br><b>What do I enter in the \"Subject\" line?</b> <br> <br>Try to define your type ID request as clearly as possible. For example \"1960's newspaper headline face\" or \"Lost in Translation movie logo\" or \"retro script\" will do nicely. Whereas \"Please help me identify this font\" is pretty pointless as that's the only thing we do on the Type Identification Board. Compare it to a newspaper where every single headline would say \"Stuff happened!\" <br> <br><b>How do I post the sample to be identified?</b> <br> <br>There's a whole topic on adding <a href=\"http://www.typophile.com/cgibin/discus.pl?pg=formatting#images\" target=\"_blank\"> Images, Attachments and Clipart</a> in the <a href=\"http://www.typophile.com/cgibin/discus.pl?pg=formatting\" target=\"_blank\"> Formatting</a> section on the <a href=\"http://www.typophile.com/cgibin/discus.pl?pg=help\" target=\"_blank\"> Help</a> page. If your sample is available online, you can also link to it via a <a href=\"http://www.typophile.com/cgibin/discus.pl?pg=formatting#links\" target=\"_blank\"> Hyperlink</a>, though we prefer a sample in the thread itself. <br>Make sure your sample image is compatible with this board (rgb GIF or JPEG only, no TIFF or BMAP) and try not to exceed 556 pixels in width. <br> <br><b>How do I create these nifty red hyperlinks?</b> <br> <br>How to add <a href=\"http://www.typophile.com/cgibin/discus.pl?pg=formatting#links\" target=\"_blank\"> Hyperlinks</a> gets explained in the <a href=\"http://www.typophile.com/cgibin/discus.pl?pg=formatting\" target=\"_blank\"> Formatting</a> section on the <a href=\"http://www.typophile.com/cgibin/discus.pl?pg=help\" target=\"_blank\"> Help</a> page. If you type in a regular URL like <a href=\"http://www.typophile.com/forums/messages/83/83.html?1075593513\" target=\"_blank\">http://www.typophile.com/forums/messages/83/83.html?1075593513</a> it will activate the URL automatically, but it's tidier to \"cleanlink\". <br> <br><b>Can I help with the identification of my sample?</b> <br> <br>As a matter of fact yes. Tell us whatever you know about your sample that might be useful. Information such as the country and age of the sample, and whether it is from a web site, or from a scan of printed material. (For example, if we know something comes from an advertisement published in the 50's it rules out a lot of possibilities.) <br> <br><b>Do I need to register to post a type ID request?</b> <br> <br>Not at all: this is a public posting area. If you are a \"returning customer\" it's nicer if you register of course. What the heck, it's free! <br> <br><b>Is this a free service?</b> <br> <br>Yep, lucky you. Most of the areas on Typophile are free, but if you wish to support Typophile, gain access to the members-only areas and receive cool stuff, you can <a href=\"http://typophile.com/needs/your/support/\" target=\"_blank\"> Become a Member</a>. <br> <br><b>I've posted an ID request just three minutes ago and my sample has already been identified. How is that possible?</b> <br> <br>Almost all of our type IDers have e-mail notification turned on in their user profile, which means we receive an e-mail as soon as a new entry is posted. As we do this for fun and there's a healthy level of competition of this board, we're going to try to ID your sample as fast as possible. Furthermore we have IDers all over the world, so there's bound to be at least one of us online whenever you might post your request, day or night, even during the weekend. <br> <br><b>I've posted an ID request two days ago and still haven't received any reply. How is that possible?</b> <br> <br>Though it's quite rare, that can happen too. Rest assured we will have had a look at your sample but sometimes we simply don't have a clue. The best way to \"revive\" your thread is to post a little reminder in your original thread. <i>Please don't create a duplicate thread with the same request</i> as this annoys the hell out of me. <br> <br><b>The subject line of my thread has been changed.</b> <br> <br>There's two possible reasons for that. <br>One: the name you gave to your thread was very vague so we changed it into something better defined. This makes it easier for our type IDers to keep track of the different threads. <br>Two: your sample has been identified. Your thread gets tagged, (x)ed and we include the name of the typeface(s) you were looking for and the name(s) of the person(s) who IDed it/them for you. That way we don't need to needlessly open threads to check if there's still need for our services. <br> <br><b>My sample has been identified. How do I change the subject line to indicate that?</b> <br> <br>There's no need. We'll do it for you. <br> <br><b>Why is there sometimes more than one person credited for the identification?</b> <br> <br>We call that cross-posting: when two or more people identify a sample simultaneously they won't know somebody else is posting the solution untill their own message appears in the thread. As they clearly didn't know of each other, they both get credited. <br> <br><b>Can I have a go at it myself?</b> <br> <br>Definitely: the more the merrier! The reason this board works so efficiently is because we have gathered a group of people from very different backgrounds with each their area of expertise. So join in with the fun: each new type IDer adds his/her little extra to the mix. <br> <br><b>Where can I do my own research?</b> <br> <br>First of all our very own <a href=\"http://www.typophile.com/cgibin/search.pl\" target=\"_blank\"> Advanced Search</a> allows you to search through previous threads in order to check if your sample has been IDed before. For example if you're looking for the Gucci logo or the typeface used for the Bj</p>"
