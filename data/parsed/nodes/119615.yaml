    html: |-
      <p>Brothers is definitely an excellent alternative (some more after). I'm pretty convinced it's a custom, after having a look to their weibiste, from <a class="freelinking external" href="http://www.dafont.com/freshman.font" rel="nofollow">Freshman</a> (used for th rest of the online identity). Serifs has been edited (or chopped off) and turned into flared latin ones. /R leg has been transformed (/P + oblique leg)<br>
      Some more in the same vein, not matching either: <a href="/wiki/https%3A/%252Fcreativemarket.com/Gumpita/49869-Dealers" class="freelinking" rel="nofollow">Dealers</a>, usual LHF's <a class="freelinking external" href="http://www.letterheadfonts.com/fonts/roebuck.php" rel="nofollow">Roebuck</a>, <a class="freelinking external" href="http://www.letterheadfonts.com/fonts/antiquehalfblock.php" rel="nofollow">Antique Half Block</a> and <a class="freelinking external" href="http://letterheadfonts.com/fonts/oldstock.php" rel="nofollow">Old Stock</a>, <a class="freelinking external" href="http://creativemarket.com/swistblnk/75323-Reidfork" rel="nofollow">Reidfork</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/laura-worthington/charcuterie" rel="nofollow">Charcuterie</a> Block, <a class="freelinking external" href="http://www.myfonts.com/fonts/fort-foundry/gin" rel="nofollow">Gin</a></p>
      <p>Quick'n'dirty job starting from Freshman<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Untitled-1_3846.png"></div><p></p>
