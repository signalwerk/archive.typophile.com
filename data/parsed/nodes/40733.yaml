    <p>Hi there, everyone!</p>
    <p>It's time for a little (self) promotion activity. I would like to introduce the new decorative display font <strong>Pilo</strong>, now available at <a href="http://www.veer.com/products/typedetail.aspx?image=UMT0000314" target="_blank">Veer</a>. It's based on the logotype of the swedish advertising community <a href="http://www.bold.se/">bold.se</a> and I think that the negative kern makes it kind of unique. The Bold logotype is designed by Björn Höglund at <a href="http://www.daddy.se/" target="_blank">Daddy</a>.</p>
    <p><img src="/sites/default/files/old-images/Pilo_4884.gif"></p>
    <p>- - - - -</p>
    <p><strong>About this typeface:</strong><br>
    Kenneth Pilo had never designed a typeface. This type of project was long overdue. In collaboration with Mårten Fischer, Ray Larabie of Typodermic, and Göran Söderström of Pangea Design, the font “Pilo” was born in 2007. Pilo is a bold, single weight OpenType face featuring subtle inline detailing and a solid sporting aesthetic. It feels both hard and soft, decorative and stoic, vintage and modern.</p>
    <p><strong>About the designer:</strong><br>
    Kenneth Pilo is currently art director and creative director of <a href="http://www.pilo.se/" target="_blank">pilo.se</a>, his own virtual agency in Sweden. Since being offered employment at a design agency a week before ending his compulsory schooling, he has worked constantly in the advertising business for over 30 years. During that time, he has done it all ... campaigns, ads, packaging, promotions, commercials, web design, virals, events, television and radio show production, magazines, music ... and the list goes on. All for the love of design. For the past five years he has also been the driving force behind the online community <a href="http://www.bold.se/">bold.se</a> - a meeting point for the Swedish advertising business.</p>
    <p>- - - - -</p>
    <p>I hope you'll like it!</p>
    <p>Cheers!</p>
    <p>/Mårten Fischer</p>
