      <p>Well, James Puckett and everyone else. Now you can get the inline version of this typeface, <a href="http://www.veer.com/products/typedetail.aspx?image=UMT0000356">Pilo Thin</a> via Veer. Kenneth Pilo puts it like this: »The mission of Pilo Thin was to create a typeface that was exactly the opposite of the very bold <a href="http://www.veer.com/products/typedetail.aspx?image=UMT0000314">Pilo Regular</a>. A thinner cousin, which would create the contrast and to be a credible member of the family. The challenge was to make the font build as much as possible on inner lines in Pilo Regular but that it would feel like it just picked them off. Pilo Thin is more feminine and some shapes has been softened up and adjusted so that Pilo Thin can stand on it’s own, but without forgetting its origin.«</p>
      <p><img src="/sites/default/files/old-images/Pilo_Thin_Specimen_2008-09-02_4733.gif"></p>
