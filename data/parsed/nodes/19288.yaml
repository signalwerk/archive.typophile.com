    <p>Hi!</p>
    <p>I'm looking for some feedback on this logo that I am creating for a startup company that makes handmade jewelry. The client is seeking a rustic, organic, friendly feel with a bit of country/western/colorado. My biggest struggle has been finding a font suitable for this identity. I'd like something organic, rustic, scripty yet professional. Any recommendations? Her identity is to be based on the horseshoe. She wants to have three staggered horseshoes like in the bottommost example of the attached file. Today, I gave my first attempt at weathering a logo and will certainly continue with this to get a better result.</p>
    <p>Thanks so much for any input that you can give. Thanks!</p>
    <p>Josh</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/PippinDesigns.gif"></div><p></p>
