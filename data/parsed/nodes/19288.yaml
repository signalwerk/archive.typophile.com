    html: |-
      <p>I have a problem with upside down horseshoes. People intentionally put them in their homes with the open end pointing up to keep the luck in the horseshoe. In your designs the luck is pouring out. </p>
      <p>Your last designs are too dark and heavy and please loose the gradient. The gradient will give you nothing but problems and looks to modern.</p>
      <p>I would use a western looking typeface only in the name and use a clean serif or san serif for the information text like phone number and address</p>
