      <p>Thanks for the recommendation pbdurr. I am taking another approach for this design and may use Rosewood. I am trying to track down something to compliment Rosewood for body text. Rosewood is caps only.. What do you think of using MVB Aunt Mildred to compliment Rosewood? I have included the latest version of this design. Basically, the client is now looking for a folky, dreamy, friendly and westerny look that includes a horse, mountain, river, horseshoe scene. I like the progress I have made but want to improve the dimension of the scene that I have created (it seems a bit flat). I attached the latest file with my design. Any input?</p>
      <p>Thanks so much for the assistance.</p>
      <p>Josh</p>
