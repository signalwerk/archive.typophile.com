      <p>A couple of font suggestions <a href="http://www.myfonts.com/fonts/castletype/latin-wide-ct/" rel="nofollow">Latin Wide</a> a strong face with hints, to my mind, of westerns. Or <a href="http://www.veer.com/products/typedetail.aspx?image=UMT0000054" rel="nofollow">Olduvai</a> which your flourishes brought to mind. Your horseshoe looks a bit condensed to me and weathering it seems like you are trying to get too much into (or out of) the logo.<br>
      Tim</p>
