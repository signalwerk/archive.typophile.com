      <p>[John Hudson] “One of the points that Tom makes is that current scientific understanding of dyslexia is that it is a phonological deficit, i.e. a problem in the cognitive processing of language, and not a visual problem.”</p>
      <p>This isn’t entirely accurate. “Recent advances in understanding of the visual system have revived interest in the role of visual processing in the persisting inability to read fluently that characterises dyslexia.”<br>
      [quoted from the following]:</p>
      <p>“Towards an understanding of the role of the ‘magnocellular advantage’ in fluent reading”<br>
      <em>Neuroscience &amp; Biobehavioral Reviews</em><br>
      Volume 32, Issue 8, October 2008, Pages 1494–1506<br>
      Robin Laycock, Sheila G. Crewther</p>
      <p><strong>Abstract</strong><br>
      Reading disability is a relatively common developmental disorder, the aetiology of which is clouded by conflicting theoretical approaches and the heterogeneity of the subtypes found. Recent advances in understanding of the visual system have revived interest in the role of visual processing in the persisting inability to read fluently that characterises dyslexia. A new integrated model of visual processing based on primate single cell and human electrophysiology may provide such a framework, implicating the magnocellular pathway's role in activating and driving attentional mechanisms in higher order cortical regions. In particular, the recent introduction of transcranial magnetic stimulation (TMS) to create ‘transient lesions’ may provide causal evidence for dorsal stream feedforward/feedback involvement in rapid visual processing tasks. Such organization is argued to be crucial for the development of fluent reading.</p>
      <p>The following distinguishes between ‘high-level’ cognitive or language deficits associated with developmental dyslexia and ‘low-level’ perceptual or neurological deficits.</p>
      <p>“Dyslexia (neuropsychological). ”<br>
      Castles, A., M. T. McLean, G. and McArthur, G. (2010),<br>
      WIREs Cogn Sci, 1: 426–432. doi: 10.1002/wcs.16</p>
      <p><strong>Abstract</strong><br>
      In this article, we review research into the underlying deficits associated with the failure to learn to read normally, or developmental dyslexia. We focus on the heterogeneity within this broad category of disorder and on the relationship between the proposed deficits and the acquisition of specific kinds of reading skill. We also distinguish between ‘high-level’ cognitive or language deficits associated with developmental dyslexia and ‘low-level’ perceptual or neurological deficits. We conclude that the mixed and sometimes contradictory sets of findings associated with most of the proposed deficits reveal something important: that there is no single cause of developmental dyslexia and that it is likely that multiple causes interact in complex ways to impair reading acquisition.</p>
      <p>A central issue in this hypothesis seems to be ‘visio-spatial resolution,’ which appears to be weak or diffuse in dyslexics. I suspect looking into the magnocellular deficit hypothesis (where the ‘low-level’ perceptual or neurological deficits seem to be based) is the way to go for those interested in type-design or typography-based remediation of dyslexia.</p>
      <p>Google the words ‘dyslexia’ and ‘magnocellular deficit,’ for more.</p>
