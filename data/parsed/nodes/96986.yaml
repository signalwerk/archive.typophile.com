      <p>I managed to come across Hillier’s unpublished PhD thesis (2006). Topping out at ~250 pages I have not had time to read it all.</p>
      <p>There are no data presented which speak to the statistical significance of his results. In the figures towards the end of the document there are some tables which report participants subjective responses from a series of Likert scales, as well as data concerning reading time and comprehension.</p>
      <p>I could find no mention of participant demographic data.</p>
      <p>Individual data is not reported.</p>
      <p>I am not confidant that the materials are accurately represented.</p>
      <p>From this document it is not possible to support, refute, or reproduce his results.</p>
      <p>I have been unsuccessful in accessing the published article (through any database I have access to):</p>
      <p>Hillier, R. (2008). Sylexiad. A typeface for the adult dyslexic reader. <em>Journal of Writing in Creative Practice, 1(3)</em>, pp. 275-291.</p>
      <p>It is also worth noting that the document I have appears to be missing its appendices.</p>
