      <p>Tom Phinney has written a good article on some of the recent 'fonts for dyslexics', including Dyslexie, whose basic concept is followed in the font described in the BBC article. He is rightly critical of misdiagnosis of the problem that the font makers claim to be solving, and of the absence, as Chris notes, of any scientific research to back up the claims.<br>
      <a href="http://www.commarts.com/columns/should-dyslexics-unite.html" title="http://www.commarts.com/columns/should-dyslexics-unite.html">http://www.commarts.com/columns/should-dyslexics-unite.html</a></p>
      <p>Tom also has a follow-up blog post:<br>
      <a href="http://www.thomasphinney.com/2012/06/should-dyslexics-unite-on-a-typeface/" title="http://www.thomasphinney.com/2012/06/should-dyslexics-unite-on-a-typeface/">http://www.thomasphinney.com/2012/06/should-dyslexics-unite-on-a-typeface/</a></p>
      <p>One of the points that Tom makes is that current scientific understanding of dyslexia is that it is a <em>phonological</em> deficit, i.e. a problem in the cognitive processing of language, and not a visual problem.</p>
