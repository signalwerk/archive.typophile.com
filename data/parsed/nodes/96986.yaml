    html: <p>Well, the article records one dyslexic saying that he found it easy to read. Nice anecdotal evidence, but note that the same person commends the spacing of the font, so maybe the letter forms themselves are not providing the perceived benefit. It is more widely spaced than typical text fonts, which Kevin Larson would predict to improve reading for non-dyslexics too. That is just one of the factors for which no attempt has been made to control.</p>
