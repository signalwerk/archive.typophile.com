    <p>freenode's <a class="freelinking external" href="http://freenode.net/logo2.png" rel="nofollow">logo</a></p>
    <p>... uses a font I haven't been able to exactly match. Pradell is close, but has a double-footed right leg on its n, the cross on its f isn't beveled, and the proportions on the e are off. Garvis, Georgia, and Gauthier also seem close-but-not-quite. Anyone know what it is?<br>
    [edit: attach copy of image]</p>
