      <p>"..., it still seems like carefully chosen TrueType instructions have every bit as much to say as the raw splines about the visual character of a font at lower resolutions"</p>
      <p>This is a great observation, but it has been so long since the instructions were reliable. The proof is now out that only the rich can make viable solutions for the web, to a great extent, because of this windows rendering. And the bottleneck it has created is not just Google fonts opportunity.</p>
      <p>"Likewise, I feel feel strongly that the choice between whole pixel grids, subpixel grids, and lack of grids ought to be a design decision that belongs in the fonts themselves (at least for fonts new enough to be aware of such things)."</p>
      <p>This goes back to the gasp table's invention which is not so new either. What is new here is that so many more people understand the issue, and that the fonts MS was afraid of rendering because of evil hints, must be dead and gone by now?</p>
      <p>My favorite comment, is that you'd a thought MS would make Some Way forward for excellence in hinting. Can we have x back on windows now? Is the x box done hogging it?;)</p>
