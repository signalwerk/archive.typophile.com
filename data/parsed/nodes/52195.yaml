      <p>Thanks a lot for comments, they are very helpful.</p>
      <p>Randy - your guess is close. The availability of the domain played its role, but it wasn’t <strong>the</strong> deciding factor. As I said before the whole idea was to use quirky spelling as one of the logo attributes to improve its memorability. Even though it’s an unconventional approach, I still think it has a lot of merit if used in moderation.</p>
      <p>Nina, Robert - I am of an opinion that lies somewhere between yours, but closer to Robert’s. When set without any visual accents, the mark reads as “Precisio Networking”, simply because Networking is easy to spot and Precisio looks like a probable proper name. For this reason I tried forcing N into the first word and assumed that borrowing N to complete ’etworking’ is an obvious thing to do.</p>
      <p>Regarding the double overlapping N. I tried few variations of this (before I started this thread) and they all looked quite busy. Re-positioning arrows above the NN would probably not help matters either. Though it’d be certainly nice to have a standalone mark as a byproduct.</p>
