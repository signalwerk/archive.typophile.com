      <p>That’s definitely some good advice, and not just on Typophile - there’s been a few times that I’ve killed an early idea off because friends have given me doubts, only to go back to it later and find that I should have taken it further! That said, I personally see Precision Etworking too - the ’N’ does seem to belong to <em>precision</em> and not <em>networking</em> because of the weight change.</p>
      <p>Regarding using it as a domain name, I’d be careful doing this if <em>precisionnetworking</em> is taken by someone else. Having a clever stylistic touch in a logo is one thing - but if the company’s name is ’Precision Networking’, people are not necessarily going to remember to drop an N in a URL.</p>
      <p>Just a thought - it might well look terrible, but have you tried using two Ns which overlap, one in each weight? Might lose the ambiguity - on the other hand, it’ll probably just look shit!</p>
      <p>Love the crop mark, by the way, and aside from the possible ambiguity I think this is a really tasteful wordmark. Nicely done - I’m sure the right solution is right around the corner!</p>
      <p>Andi</p>
      <p>[<a href="http://www.semibad.com">semibad</a>]</p>
