    html: |-
      <p><em>“Andi, the domain name being misspelled is actually not as big of deal. Majority of those searching for a web site are going to skip the guessing step and head straight to Google.”</em></p>
      <p>I hear you that the majority of people will head straight to Google, which is fine. But what about the minority? Put another way, shouldn’t your wordmark be in service of your client’s brand name, and not the other way around? </p>
      <p>Even assuming top rank on Google (which can <em>never</em> be assured), if 99% of people search and find the site no problem, then 1% of people don’t, and use the URL directly. How many of those people will this affect? Is your design vignette going to improve sales or increase traffic enough to make up for that usability hit (however small)? As designers, our job is to come up with a solution which will benefit our client - (almost) everything else is secondary.</p>
      <p><em>“While it is possible to make the NN look decent and unobtrusive, this turns NN into a second feature of the wordmark (in addition to the “I” ticks) and the result looks a bit too complicated.”</em></p>
      <p>Yeah, I can see how that would happen. But to be honest, isn’t dropping the second ’N’ purely for stylistic reasons a second feature?</p>
      <p><em>“I was just not sure if the accented “I” could pull the wordmark on its own.”</em></p>
      <p>I think it probably can, to be honest. It’s a very likeable mark, simple and effective.</p>
      <p>Hope none of the above came across as hostile in any way, or anything other than constructive. Remember that a domain name is an important part of SEO. Someone with the ’proper’ domain name has an instant advantage - which is something to think about if your strategy is based around ranking first on Google.</p>
      <p>Andi</p>
      <p>[<a href="http://www.semibad.com">semibad</a>]</p>
