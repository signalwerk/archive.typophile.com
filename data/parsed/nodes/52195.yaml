      <p>Thanks for the comments, everyone. This is the sort of a feedback I was looking for. Even though it may not look like it is <em>very</em> helpful, but it actually is.</p>
      <p>James, I hear you regarding showing the sketches to the “ordinary people” :-) I did just that before I posted here and the feedback never focused on Etworking being hard to parse. Frankly I was surprised to see that quite a few people here couldn’t recognize Etworking for what it was. I still am actually.</p>
      <p>Andi, the domain name being misspelled is actually not as big of deal. Majority of those searching for a web site are going to skip the guessing step and head straight to Google. If the company is notable, it will be on top of the list. Regrading using NN in the middle - it doesn’t look fitting in pretty much all variations I tried. In the best case it looks like a moderately interesting mark, but I think the pointy triangles work better.</p>
      <p>PCM, regarding the use of Google when searching for the company being a definite no-no - care to elaborate ? As I just said above it seems counter-intuitive to me. I certainly agree that a straight-forward URL is always better, but I don’t think that not having it is that big of deal <em>if</em> the company name has a top placement in a Google search.</p>
