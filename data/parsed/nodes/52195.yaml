      <p>Alex, I recommend you take this view that the N belongs to ’precision’ and “typographically” isn’t part of ’networking’ with a large grain of salt. Litera has a good point and I happen to agree with him. I can read it one way or the other, with the N belonging to both words.</p>
      <p>The opinions of typophiles can be useful, with some of them even managing to be authoritative. But just because one or two typophilers say a thing is so does not make that phenomenon real, official or even half obvious to the rest of the world. Some typophilers are full of themselves and their own personal dogma, and some just aren’t very flexible. Typophile “expert” opinion is one thing, the real world and its broader perception (perception not informed mostly by looking at fonts) is something else.</p>
      <p>What really counts is what ordinary people think, the people who will encounter your logo on a daily basis. With this in mind, if It were my logo design I would test as few paste-ups (try variants) on people your work and do business with. You will soon find out how your design really works—for the people whose perception of it really matters.</p>
      <p>j a m e s</p>
