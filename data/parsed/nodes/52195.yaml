      <p>Sorry if I was vague. Using Google to find a company is absolutely ok, but IME many people try a direct URL if they are repeat visitors (Company-name+.com) or if they’ve already received marketing materials either through an interactive campaign or print or mailers. If they then have to hit Google after finding your competitors page or a squatter page, you’ve already used up a valuable couple clicks of their time, and their impression is slightly affected. It might not seem like much, but when you are dealing with metrics in the tens of thousands, and trying to minimize bounce rates it can definitely make a difference. And if they Google search and a competitor or squatter is at the top with you, it’s another layer of friction (cognitive decision) for people to deal with. i know it sounds like BS but little things like that IMHO can really affect brand value and impression and ultimately translate into lower conversion rates. </p>
      <p>So to make a short story long, I would assume that most people would not carry over the visual combination you’ve created into the URL. They would likely parse the thought:  “precision+networking”. I would offer to buy precisionnetworking.com, even if it sets you back a bit. It’s a good investment. </p>
      <p>p.s. I like the mark by the way — it’s a nice clean typeface and carries the concept — although I share the concerns about the potential for confusion, especially since “precisio” seems to be a somewhat popular name. I would really like to see some color get worked in.</p>
    html_clean: |-
      <p>Sorry if I was vague. Using Google to find a company is absolutely ok, but IME many people try a direct URL if they are repeat visitors (Company-name+.com) or if they’ve already received marketing materials either through an interactive campaign or print or mailers. If they then have to hit Google after finding your competitors page or a squatter page, you’ve already used up a valuable couple clicks of their time, and their impression is slightly affected. It might not seem like much, but when you are dealing with metrics in the tens of thousands, and trying to minimize bounce rates it can definitely make a difference. And if they Google search and a competitor or squatter is at the top with you, it’s another layer of friction (cognitive decision) for people to deal with. i know it sounds like BS but little things like that IMHO can really affect brand value and impression and ultimately translate into lower conversion rates. </p>
      <p>So to make a short story long, I would assume that most people would not carry over the visual combination you’ve created into the URL. They would likely parse the thought:  “precision+networking”. I would offer to buy precisionnetworking.com, even if it sets you back a bit. It’s a good investment. </p>
      <p>p.s. I like the mark by the way — it’s a nice clean typeface and carries the concept — although I share the concerns about the potential for confusion, especially since “precisio” seems to be a somewhat popular name. I would really like to see some color get worked in.</p>
