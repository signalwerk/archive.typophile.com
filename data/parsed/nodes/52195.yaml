      <p>Let me tell you all something. People tend to read words as patterns and not letter-by-letter, therefore PRECISIONETWORKING in this example reads just fine. I think there would be a really insignificant minority that wouldn’t be able to read it correctly.</p>
      <p>It’s true that our eye also catches the misspelling, but we still read it correctly.</p>
      <p>The other question is whether this idea goes well with “precision”. Which probably doesn’t. But the idea is very nice and very well done. It probably just needs some polishing. Maybe actually using double overlapped letter N would solve the trick and positioning those triangles on them. We also get a mark: double N with triangles.<br>
      ___________<br>
      <em>Robert Koritnik</em></p>
