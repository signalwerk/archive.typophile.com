    html: <p>I’ll leave te mark alone as I don’t have much to add to the others comments, but as an interaction designer, I would agree with others and definitely advise against any confusing URL (i.e. precisionetworking.com). By combining the words in the URL, you are already creating an instance of user friction which will affect direct hits, and for those users who care enough to find the company, they will have to do a Google search — a definite no-no. By the time they’ve arrived at the correct URL (and likely found your competitor who already owns precisionnetworking.com), they have already spent way too much time finding you and you have an uphill battle to keep their attention and prevent bouncing.</p>
