  html: |-
    <p>I've seen some discussion before on here about matching Futura with a complimentary body face that is not itself, but it never really answered the question. I don't like the look of Futura in lowercase for semi longer body copy.</p>
    <p>I tried using some interesting pairings others have like IKEA with New Century Schoolbook, but my client doesn't have that earthy, warm feeling to use that. haha. The client is a commerical properties painter mostly. If that helps get ideas flowing.</p>
    <p>I'm using Futura Medium and Bold(cliche) set in uppercase for titles.</p>
    <p>What should i try for body? Sans serif suggestions are welcome as well. Maybe i shouldn't be so afraid of lowercase Futura, but it just irks me.</p>
    <p>Thanks for the help in advance.</p>
