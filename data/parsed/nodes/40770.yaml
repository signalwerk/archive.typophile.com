    html: |-
      <p>Wow, that looks a bit odd seeing the unicase (small cap size) alternates mixed in with the lower case.</p>
      <p>I had a lot of influences, which I generally took pains to not look at while I was working on the typeface. Kabel, Futura, Optima, Penumbra, and others.</p>
      <p>Note: Stylistic set #1 turns off the vestigial serifs, and stylistic set #2 switches to "more geometric" shapes for agty&amp;.</p>
      <p>More info on the creation of the typeface:</p>
      <p><a href="http://blogs.adobe.com/typblography/2007/04/hypatia_sans.html" title="http://blogs.adobe.com/typblography/2007/04/hypatia_sans.html">http://blogs.adobe.com/typblography/2007/04/hypatia_sans.html</a></p>
      <p><a href="http://www.adobe.com/type/browser/landing/hypatia/hypatia.html" title="http://www.adobe.com/type/browser/landing/hypatia/hypatia.html">http://www.adobe.com/type/browser/landing/hypatia/hypatia.html</a></p>
      <p>Cheers,</p>
      <p>T</p>
