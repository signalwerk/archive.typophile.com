    <p>“Version 6.1 of the Unicode Standard continues the Unicode Consortium's long-term commitment to support the full diversity of languages around the world.”*<br>
    Among others Chakma script have been added (11100..1114F). The standard is not enough—people need the font to write. Some days ago the RibengUni font has been released, see: <a href="http://uni.hilledu.com/download-ribenguni/" title="http://uni.hilledu.com/download-ribenguni/">http://uni.hilledu.com/download-ribenguni/</a> , designed by Bivuti Chakma (Suz Moriz) &amp; Jyoti Chakma [Bangladesh] with assistance of Jan Żurawski [Poland]. The font is released under SIL Open Font License. Latin part is adopted from the other OFLicensed font released recently.<br>
    You can see the font in the wild <a href="http://www.facebook.com/groups/hillbd/" title="http://www.facebook.com/groups/hillbd/">http://www.facebook.com/groups/hillbd/</a><br>
    * <a href="http://www.unicode.org/versions/Unicode6.1.0/" title="http://www.unicode.org/versions/Unicode6.1.0/">http://www.unicode.org/versions/Unicode6.1.0/</a><br>
    hand writing<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/34_3945.jpg"></div><br>
    RibengUni.otf<br>
    <div class="imageWrap"><img src="http://typophile.com/files/gramm1_5597.jpg"></div><p></p>
