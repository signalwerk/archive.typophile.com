      <p>Explain the name. Why light? Like light weight (not powerful)? What does the mark after the name mean? Would anyone know what it meant without an explaination? I think this first version makes lux look weak (almost industrial, boring). I doubt that is the image you want the company to have. </p>
      <p>You have two problems the concept is weak and the execution is weak.</p>
      <p>One last question. Isn’t fashion and modeling about style and substance?</p>
