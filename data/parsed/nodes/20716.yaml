    html: |-
      <p>I think the straight bar of the x needs to have a touch off the top and bottom (especially at the top it appears to be jutting out too much, this is visual rather than mathematical and might also be affected by my screen, printing it out and using that is generally more reliable than screen I find). The junction of the vertical and curve on the u is taking the attention a bit you could try raising the outside curve of the serif a touch, see if you can lighten it. As for the kerning ux could be a little bit tighter but really doesn’t need much in my view.<br>
      Tim</p>
