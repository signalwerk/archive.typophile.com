    <p>Hi</p>
    <p>I've been asked to create a logo for a mate, his company sells in-game advertising and is called 'game creative'.</p>
    <p>The idea is that the logo represents the essential building blocks of all games i.e. pixels. So I'm looking for a face that has a pixel look or is very square and gridlike.</p>
    <p>I tried ff stealth and gridnik but neither seem right for this. Can anyone suggest anything else?</p>
    <p>Thanks</p>
