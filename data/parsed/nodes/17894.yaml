      <p>Yes, that is a weight of Nubian I didn't do. I don't know who did, but I do know that only Brazilian Cosmo use it (thankfully). I can't say I'm entirely happy with the look of it. </p>
      <p>But sometimes one designs a typeface and releases it, then it's in use in some ad campaign or other, and you think 'OH MY GOD! - Did I do THAT?' (I'm talking about Ryanair/Houschka.)</p>
      <p>It might be overused in the UK - Huh? Where? I've hardly seen it anywhere.<br>
      But talking of overuse - Has anyone seen Brazilian Cosmo - it's the only typeface in the whole magazine. Too much!</p>
      <p>Thanks for the praise Yves!</p>
      <p>Nick Cooke</p>
