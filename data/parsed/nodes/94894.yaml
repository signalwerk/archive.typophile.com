    <p>Hello</p>
    <p>I am after a bit of type-sleuthing for this early (1917) example of what I guess is a wood type slab serif for PRAVDA. Kind of similar to this revival family <a href="http://www.myfonts.com/fonts/flat-it/dharma-slab/m-extra-bold/" title="http://www.myfonts.com/fonts/flat-it/dharma-slab/m-extra-bold/">http://www.myfonts.com/fonts/flat-it/dharma-slab/m-extra-bold/</a> but not quite, missing the rounded exit junctions before the slab-serifs...</p>
    <p>Any clues?</p>
    <p>thanks as ever for your time!</p>
