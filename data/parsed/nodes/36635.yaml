    html: |-
      <p>I'll slam the helvetica. Well, I won't SLAM it, but I'd really go for something else. </p>
      <p>It's also crowded. It needs more white space...both in the margins and in the leading.</p>
      <p>The lines...might be a bit much. If you stick with them, consider fading them back to a light grey, but maybe try a version sans the lines.</p>
      <p>Skip the objective because a) you don't actually describe your objective and b) what you did write really should be flushed out as a cover letter.</p>
      <p>If you are going to force-justify your text, hang the punctuation. </p>
      <p>Software proficiency...not sure if you need the years in there. I'd just make that a comma separated sentence. "Skilled with InDesign, Illustrator, Photoshop, etc... Familiar with..."</p>
      <p>Selected projects...I'd pull that out as a separate sheet. Make it a mini-portfolio. That way you can show some visuals.</p>
      <p>Good luck! And I'm jealous that you are in Portland. Love that place.</p>
