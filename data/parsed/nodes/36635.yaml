      <p><em>Your “objective” is not one... it’s a description. Needs to be changed to include the type of job you’re looking for (can be modified depending on job). In other words, “Designer seeks position as low-paid peon” or whatever.</em></p>
      <p>You know, I don't think it's a bad idea to have a profile (it gives the employer valuable info about you, after all) instead of an objective... Just label it "Profile" instead of "Objective".</p>
      <p><em>No slams about it being in Helvetica Neue? I expected someone to groan.</em></p>
      <p>My own resume is set in two weights of Franklin Gothic... If it's clear, and legible, and you feel that a clean sans serif says something about you, then I say use it.</p>
