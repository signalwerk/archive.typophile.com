    html: |-
      <p>I agree with Rob as well... it needs something to break it up more visually, right now it's a lot of uniform text (very intimidating) -- but nicely done.</p>
      <p>As for the resumé itself,</p>
      <p>A) Your "objective" is not one... it's a description. Needs to be changed to include the type of job you're looking for (can be modified depending on job). In other words, "Designer seeks position as low-paid peon" or whatever.</p>
      <p>B) Education - Lose the G.P.A. - if it's not 4.0, it looks bad, and if it IS 4.0, it looks like you're bragging.</p>
      <p>C) Employment - I feel kind of lost here, again because everything's the same weight. As an employer, I want to see 1) where you worked and 2) what you did... i.e., WEB DESIGNER, HORIZON MEDIA GROUP. I don't hink the address and phone are necessary, the city should be enough. And I think you need to make the "descriptive" text into more common english - a (short) paragraph, not bullet points. Include what the COMPANY did/was (i.e., "Developed brand identities for clients of major design firm," or whatever).</p>
      <p>D) Software Proficiency -- this is tricky. Yous is fine, but you may want ot include versions too (Dreamweaver 6-MX, Mac OSX, etc).</p>
      <p>E) Selected Projects is OK, but i usually don't recommend this level of detail in a resume -- that's what a portfolio/interview is for. Since you don't have that much job experience, it may be OK here, but I'd lose it myself.</p>
