    <p>I have released three fonts, Shuneet, Shuneet Oblique and Shuneet Square<br>
    see hebrew-font-shuneet.com.  I am designing seven weights for the font Shuneet and would like to match the weights of the other two(Shuneet Oblique and Shuneet Square) to them. The weights are light, thin, book, medium, demi-bold, bold and heavy.</p>
    <p>I have looked at a number of commercial fonts available in regular and bold and calculated their weights according to the Panose scheme:</p>
    <p>Calabri: Medium and Bold.<br>
    Tahoma: Demi-Bold and Heavy<br>
    Arial: A light Demi-Bold and a dark Bold</p>
    <p>They are all over the place! Calabri is the most recent design so does this represent a current accepted practice? When I press the [Bold] button in a word processor can I expect a Medium font to become a Bold font (by the Panose definition)?</p>
