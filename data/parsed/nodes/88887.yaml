      <p>I'm not sure how relevant/practical Panose is.</p>
      <p>Although there are trends that change over time*, I don't<br>
      think there is (or even can be) "current accepted practice".<br>
      One good guideline though is to think in pairs: a light and<br>
      and a dark with the latter serving as a "bold" for the former.<br>
      This means that a range of weights isn't necessarily spaced<br>
      evenly (I mean not even optically).</p>
      <p>* Like the 70s was the age of light fonts<br>
      while since the late 90s we've thankfully<br>
      been seeing more meat on the bones.</p>
      <p>Tahoma's Bold is very dark because of screen rendering facilitation.</p>
      <p>hhp</p>
