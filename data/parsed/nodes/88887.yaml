      <p>Thanks for your comments. My font is a Hebrew font with matching Latin.<br>
      I have used the Latin upper case E as a basis for the Panose weights.<br>
      I'm just using the Panose scheme to get a suitable range of weights.<br>
      The Hebrew letters will be slightly darker and slightly higher than the<br>
      Latin lower case. </p>
      <p>The Hebrew is a san-serif design intended for presentation and decorative<br>
      purposes. </p>
      <p>However back to Latin...  The fonts I looked at (Calabri, Tahoma and Arial)<br>
      happen to be on my computer.  Could you suggest fonts to examine that are<br>
      for printing?</p>
      <p>Mike</p>
