      <p>I suppose it depends on what you're trying to cover. </p>
      <p>Ink on paper is one case, but the method of putting the ink on paper matters. Laser and inkjet printing take a different weight than offset printing for the running text. Within offset printing, the type of paper used can matter as well. If you get right on the ragged edge of a particular weight, a type weight might work fine with coated or uncoated paper, but not the other. Merlo is an example -- works well with coated stock, not so well with uncoated.</p>
      <p>Then there is pixels on screen. Not my area of expertise, but I think weighting is different than for ink on paper.</p>
      <p>I don't know any way to be sure other than to test. You can make pretty good guesses by finding a few types that work well with the desired medium, then extrapolate to your fonts.</p>
      <p>Once you have a "regular" and/or a "book" -- depending on how you sort such things for general text, "bold" has to serve it's function. Most of use who use type find it helps if there is a semi-bold and a black as well, in order to have just the right emphasis for whatever one's doing.</p>
