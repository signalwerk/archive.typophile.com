    <p>I am beginning the process of developing a three dimensional font based upon the humanist writing hand (more or less the ancestor of Old Style fonts) of Renaissance writing master Ludovico Arrigi. What I troubled by is which 3D Modelling Application to use? I have access to Maya and have downloaded a copy of Blender. Unfortunately I keep hearing about a steep learning curve with both of these applications. In my recent research it seems that Strata 3D may be a better option. At least it seems that Strata 3D is designed to work with the Adobe Creative Suite programs (Illustrator &amp; Photoshop) that I am already very familiar with. </p>
    <p>Any advice on what application to use will be greatly appreciated! </p>
    <p>Todd</p>
