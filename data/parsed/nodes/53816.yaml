      <p>Wait... Are you designing a typeface or are you replicating one that already exsits?... and are you trying to design the type with the 3D software or are you importing the curves into the 3D modeling software? Also are you hoping on animating the type with motion effects?</p>
      <p>Rhinoceros 4.0 is pretty easy to get a handle on. (Don't download the beta version for Mac, it sucks.)</p>
