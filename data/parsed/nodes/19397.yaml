    html: <p>Maybe it has something to do with the perceived technical nature of type design? I double-majored as an undergraduate, getting degrees in both English Lit and Physics simultaneously (though I work as a designer these days). My English classes were 70% female, while my Physics classes were 70% male (at a university that was circa 60% female overall). I had a chance to observe the stereotypes that members of each discipline held for the other. Male physicists often characterized literary criticism as a wishy-washy field, lacking any real rigor or organization. But the lit girls thought physics was all about crunching numbers and complicated math, stuff that was basically meaningless to their lives. They assumed physics was inaccessible, even though they'd never really been exposed to it. When a field seems innately technical, it generally appeals better to men; when it seems organic or humanistic, it generally attracts more women. At least, that's what I've observed.</p>
