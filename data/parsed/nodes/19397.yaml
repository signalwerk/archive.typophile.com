      <p>A “Cootie” is something invented by young children in elementary schools years ago.  It is some sort of an evil ficticious bug creature that can infest you.  Children can be cruel so at times, they would hurl the biggest insult that they could muster at someone they disliked or were jealous of.  That remark was “You have Cooties”!. At which point a chorus of “Ehhuuuuuu!!!” would chime in by the rest of the 3rd graders in earshot.<br>
      Since at that age boys and girls are “enemies” (until puberty strikes), the Cooties insult was often blasted at members of the opposite sex.</p>
      <p>ChrisL</p>
