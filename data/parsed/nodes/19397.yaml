    <p>I’ve got the impression there are hardly any women using typohile. This impresssion is only based on the nicknames and on the few profiles I’ve looked at.</p>
    <p>– Is the gender ratio on this website the same as in the “real life” world of typography?<br>
    – If women are underrepresented, why?<br>
    – If women are underrepresented, what can be done to adjust the ratio? How would the typographic community benefit from this?</p>
    <p>I think more female discussion participants would help calm down the competitiveness sometimes emerging in the forums.</p>
