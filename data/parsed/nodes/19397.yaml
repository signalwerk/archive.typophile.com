      <p>I studied graphic design in both the US and in Germany. In both countries, the male:female student ratio was 1:3. This was very recent, though.</p>
      <p>Frightening was the teaching staff ratio. In the states, there were female professors, but not as many as there were men. Where I was was studying in Germany, there were no female professors in the design department at all, despite the department having recently hired several new professors, and the student body ratio. (I think that this might have improved though in the year that I've been out…).</p>
      <p>I can't speak to the working environments back home in the States anymore. In Germany at the moment, lots of designers are graduationg and not getting jobs for a long time. Many of these graduates start working freelance, or try to found their own studios (out of desperation?). Since there are more female and male gradutes, it seems like there are more women not entering the workforce… but demographics play some role here. The average German design graduate is not 21 but about 28–32, I'd say. Some women opt straight for motherhood once their studies are complete. <em>Some</em> of these women who become mothers will, if the impression from the past decade is to be believed, never enter the design workforce at all, other than in a part-time/freelance capacity.</p>
      <p>Still, since there are so many new female designers in comparison with males, there should still be more women getting new jobs than men, even if you factor in possible career and life choices.</p>
