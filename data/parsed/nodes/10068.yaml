    html: "<p>I quite like this concept, altough there's some issues with the way its working technically. <br> <br>There are a few characters in the lower case that could use tweaking: <br> <br>\"m\" i like, but consider splitting the two strokes that make it up (the \"r\" like shape and the other curve) and spacing them a little. At the moment the two are so close we almost lose the mid-stem all togther - it's losing it's \"m\"iness. <br> <br>\"t\" not working yet. try some other solutions, like the reverse J look -  if you know what i mean. (sorry don't have time to mock-up visual samples). <br> <br>\"q\" seems that the stalk is too short. \"w\" seems too flat and the mid-stem needs to come up higher. <br> <br>In the uppercase the C, E, F, J, P &amp; R are all significantly skinnier than the other glyphs. I guess this was intentional, any reason why these characters? <br> <br>Solid effort overall. Forgive me everyone for getting my type-anatomy wrong. It's too late and I'm too tired to whip out Bringhurst's Elements to cross-reference. Please, give me some feedback in turn on my sans-serif. <br> <br>Cheers.</p>"
