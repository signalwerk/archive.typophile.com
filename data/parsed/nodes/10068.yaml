  html: '<p>Hello! <br> <br>Im a graphical designer that just recently got completely addicted to typeface design. Im very happy i found this forum because obvously i will need some professional help =) <br> <br>This is one of my first attempts at designing a typeface. Im making it mainly for use as a display font in print graphics and websites. <br> <br>Thanks in advance. <br>- Lasse <br> <br><img src="http://www.typophile.com/forums/messages/29/68555.gif" alt="Typeface: SNAP!"></p>'
