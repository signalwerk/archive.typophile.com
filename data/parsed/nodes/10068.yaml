    html: "<p>I agree with Linus.  <br> <br>The font looks great when you spell your name out in it. Those characters looks good together. For now I will assume that that is the flow you want to achive with the rest of the font. <br> <br>I would add some suggestions.  <br> <br>Use more space between the letters so we can see them better. They seem squished together in the sample.  <br> <br>Caps: Maybe pull the ends of the cap C around further fallowing the path of the cap O. The D is overly wide. Why not drop the foot of Cap J down below the baseline? The Cap K seems like an H. A small adjustment could make a big difference. The cap M seems a little wider than it needs to be. Again small change is what I suggest. What about Pulling the foot of the R out from the stem farther? Or a Bigger counter for both the P &amp; R? Not both probably. How about a straight vertical tail on the Q? The W needs work. I can imagine 4-5 ways to change it. The Z is a little regular compared to the other interesting letters. Maybe treat it a bit more like the S? <br> <br>Lowercase: The e needs work. It stands out &amp; doesn't flow. it's an important character so I would do lots of versions until you get one that flows. I like the a. I thing the f most be taller. Otherwise it is a mixed lowercase small cap thing which is too wonky for the cool spacy elegance of the Caps. I really like the ghij. Same for the k as the f. What about a double mid stem for the m? Like two overnapped 'n's? Maybe too wacky also. Just a smooth double hump might be good... I think the q needs a decending tail. The s feels cluncky to me. Whay not adopt the approach of the elegant Cap S? As Linus said the t needs reworking. I would try several ideas &amp; see which ones feel closer to the feeling of the caps. Not that they should use the shapes of the caps - just the feeling. The w also needs reworking. <br> <br>Sweet font!</p>"
