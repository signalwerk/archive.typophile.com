      <p>Ruari McLean's book, <a href="http://www.amazon.co.uk/Jan-Tschichold-Typography-Introductions-20th-century/dp/0853316686/ref=sr_1_2/026-1069330-4820432?ie=UTF8&amp;s=books&amp;qid=1191957779&amp;sr=1-2" rel="nofollow"><em>Jan Tschichold: A Life in Typography</em></a>, is neither out of print nor expensive, since it's available in paperback.</p>
      <p>You could also try a library.</p>
