    html: <p>It's the 'o' and other rounded glyphs that need to drop below the baseline and above the x-height to look optically even with the rest of the text.  Or possibly, because of the major differences between the stems of the el and n, for instance, there may be a need for specific ligatures for different combinations.</p>
