      <p>Thank You for comments!<br>
      I see You`re right about the same design of letters. Also I made changes of the "R" the same way.<br>
      But now there is a dilemma - which shape to use?<br>
      With the sharper one font looks even sharper, than it was before. And letter spacing seems more tight to me.<br>
      I had tried  the rounded style instead, but  the rounded "D" almost looks like "O".<br>
      What do you think, is the difference between the "D" and "O" noticeable enough to choose the rounded version? </p>
      <p>P.S. It would be great if anyone could comment the length of stems (problem described at the start of this topic, in PDF file). This is the main and the most important question for me.<br>
      If anyone can notice some more problems in this typeface, please, let me know!<br>
