    html: |-
      <p>I guess I found out the problem of these strange stems myself. Previously I made all the vertical strokes a little bit longer (out of the baseline) for visual balance. I wanted them to look optically the same length  as "o", "s", "a" etc.rounded letters, but I was wrong.<br>
      Now I see, it`s better to make them all placed on baseline.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Illinois_5869.jpg"></div><p></p>
    html_clean: |-
