    html: |-
      <p>Thanks a lot for the comments.</p>
      <p>@Lex<br>
      Sure, the navigation will work. Each of the square thumbnails will be a button. I don't want a colourful HTML background. The five colourful squares on the welcome page will move to the top and each portfolio piece will be shown on one of the five background colours. So the visitor will know where he/she is by the background colour. Black seems way too heavy though. I'll try grey.</p>
      <p>Thanks for the spelling.</p>
      <p>@jayyy<br>
      As I wrote above, those colours will also be used as the inner background colours of the portfolio pieces. So they need to be muted or flat as you wrote. True, the colour used for "Poster" needs lightening. "by" mark is somewhat oriental and occult, but not the typography. Maybe you don't like that contrast? Please explain.</p>
      <p>About consistency... First one is a classical informative welcome page. The second one is actually the last one. Getting the welcome info to the second page should be quite logical. I'll try.</p>
      <p>@David Sudweeks<br>
      It's just uncomfortable to show off myself. There's actually a grid, it's just lenient. The pages are constructed on a 40px grid, all the margins, spaces etc. I don't feel a dictating and easily seen grid is needed here. I presume the layouts will be awkward, there will be different sized pieces, so space should dictate instead. My intention was to present my work on a quiet and minimalist layout. The visitor shouldn't need to think about the layout itself but only look at the work. Easy and direct access to the rest of the content was my another intention.</p>
