      <p>Agree with Lex about the black border.</p>
      <p>The colors for your navigation fall way flat to me. The text becomes illegible over some of them. I am not crazy about your 'b.y.' mark. I feel the concept is good but just needs to be sharper and more fluid in the execution.</p>
      <p>Finally, with only those 2 pages, there seems to be a lack of consistency between them. They both look totally different. It would be better if you could make your pages fit into a master template so that all of your portfolio can be displayed using the nav on page one.</p>
