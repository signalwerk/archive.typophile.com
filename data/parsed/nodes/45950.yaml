  html: |-
    <p>We need a serious text face for a German translation of <em>Vedanta: A Simple Introduction</em>. Not Palatino. Should probably be by a German (or German-speaking) designer though. Classic is safe. The book introduces the reader to the Vedanta philosophy in clear, straightforward language. It is not heavy reading. Your suggestions appreciated.</p>
    <p>Any tips on composing a German text for someone who has experience only with English would also be helpful.</p>
    <p>Thanks.</p>
    <p>D.</p>
