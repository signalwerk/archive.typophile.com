      <p><cite>That’s irrelevant to what I said. I said if you have two images with the exact same number of pixels, for them to be printed at different DPI resolutions, they have to be printed at different sizes.</cite></p>
      <p>My point exactly. They will print at different sizes. For what you said to make sense you assume that all printers print at the same resolution. You control the print size using a combo of dpi and size in inches. The same image - let’s say 6 x 8” - at 300 dpi and then down-rezzed to 72 dpi (resampled) will print the same size on paper - at different resolutions - but will appear different on screen if viewed at “Actual Pixels”.</p>
      <p><cite>If resampling is off, changing the DPI will affect print size. It will not affect the pixel dimensions.</cite></p>
      <p>That’s right but you will also notice that the size in inches changes too, proportionately. Your print size will still be your dimensions in inches, irrelevant to the dpi or pixel dimensions. </p>
      <p><cite>Print design is about dictating a solution.</cite></p>
      <p>Which is why I’m in print!</p>
