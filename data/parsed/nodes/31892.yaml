      <p>“One of the reasons I don’t like web design is that there are no absolutes. In print, there are. You have much more control over the appearance of your project.”</p>
      <p>Yes, I think that sums it up perfectly. Printing an image is based on two variables: the pixel dimensions and the ppi setting in the file, which combine to create a size in inches. Web display is also based on two variables: the pixel dimensions and the user’s monitor settings, which the designer has no control over. The 72 ppi convention is artificial, and usually incorrect (since most people use monitor settings somewhere around 100 ppi now), but it does provide a way for people who are more accustomed to working in inches to get a rough idea of how big the image will be.</p>
      <p>Problems are most likely to occur where the designer doesn’t really understand that print and screen display work in basically different ways. This could be a print designer saving images with overly high pixel dimensions for use on screen, or it could be a web designer not realizing that the images with low pixel dimensions will look like crap if they’re printed out. It’s probably useful nowadays to speak both “languages” to some degree.</p>
