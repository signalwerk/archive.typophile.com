      <p>even in various contexts, “resolution” is a term that necessarily implies unit size and amount of data, relative to eachother. whether you call them pixels per inch or dots per inch or grains per cm or blocks per mile or bits per second...</p>
      <p>only in relation to data density per unit can you discuss the relative resolution of different documents. a higher data density within the same unit is more information, and (if that information requires storage without compression) its a larger file. more information is just... more information.</p>
      <p>the photoshop convention may be “unreal” but it works well enough across platforms,<br>
      and provides clear enough standards that i can manipulate and anticipate results.</p>
      <p>to say “dpi has no relation to file size” in the abstract sounds more unreal to me than the<br>
      mythical pixels per inch because, as bluestreak wrote, when i scan a 6 inch doc at 300dpi<br>
      i get a larger document than when i scan a 6 inch doc at 72dpi. </p>
      <p>the word resolution refers to different standards of measurement at different stages in the process; input, manipulation, output. at various stages it may entail file size, image quality, or interpolation, but not necessarly all at the same time.</p>
      <p>and because screengrabs and video grabs still come in at 72ppi that remains a functional<br>
      convention for working with screen resolution. is it true ? not really but it works for me in many situations until a better uniform standard is in place.</p>
      <p>the truth is... the electrons are having a big party in there and bumping into eachother<br>
      at unimaginable speeds, playing drinking games, singing kareoke, and making snow angels in the documents. if you listen closely to a really hi-rez document, you can actually hear them singing. i have a lawnmower. can you swim ?</p>
