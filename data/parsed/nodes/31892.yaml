      <p>White flag... It’s the same as always when I have this topic going on again. For me, everything is plain clear, maybe because I do a lot of print design and screen design.</p>
      <p>I have a certain mass of pixels.<br>
      If I distribute them on paper, they need to be small enough (300dpi+) so the result is crispy. I just have to print the picture small enough or have enough of pixels, so that this is guaranteed.<br>
      If I show this mass of pixels on screen, I don’t know how large the pixels of the viewer will be, so I can’t say how big the picture will be displayed. But I know that the image will be displayed 1:1 (everything else isn’t possible with todays operating systems – *if* it was possible today, *then* DPI and inches would matter on screen!).</p>
      <p>“One of the reasons I don’t like web design is that there are no absolutes. In print, there are. You have much more control over the appearance of your project.”</p>
      <p>Web design is almost exactly as absolute as print design, if you do everything with pixels (font sizes, artboard dimensions and – here you have no other choice – pictures). One can produce perfectly static websites that look exactly the same on every desktop computers screen, except for one thing: you can not determine, how big the site as a whole is exactly displayed. And, of course, you don’t know whether your viewer has turned his monitor settings to 100% brightness / 100% contrast...</p>
      <p>Print design has also some variables you can not control: Under which ambient light the product is looked at? Should the reader use glasses? Did the Newspaper get wet and wobbly before he got it inside?<br>
      100% control isn’t possible.</p>
