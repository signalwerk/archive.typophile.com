      <p>To clarify (hopefully!) the reason you see a file size difference, Ch (I assume) is that aftereffects retains a physical size to your image. Film, for instance, doesn’t have a resolution. I assume you can output your afteraffects file to film at any resolution you like. Either way, it has to fit the physical size and aspect ration of a film frame.</p>
      <p>So, if you retain a physical ’printed’ size to an image, and increase or decrease the dpi, yes, it will increase or decrease the file size, as you are adding or removing pixels.</p>
      <p>However, if all you care about are the pixel dimensions (as one is on screen) then increasing or decreasing the dpi won’t change anything on screen. It’s still the same pixels.</p>
