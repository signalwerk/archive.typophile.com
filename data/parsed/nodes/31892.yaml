      <p><cite>Personally, I’ve grown up with the “pixel” outlook on computer images, and hence I often think that the resize dialog in more advanced image editing software, like Photoshop, is overtly complicated. “Inches? DPI? Why would I care about those arbitrary values? I want control over the actual number of pixels, because that is what is relevant for how much information is stored in the picture.</cite></p>
      <p>I agree. I think of the pixels first, and the “real world” image dimension measurements (ppi/inches/cm) as extra info in the file which other applications (or Photoshop’s Print dialog) may or may not look at when I reuse that image in other contexts. Which is how the info is actually stored. I don’t think that GIFs don’t contain any real world size info at all.</p>
      <p>Yes, it’s handy if I know all my images in a print project have been tagged as “300ppi” so when I scale them to 150% in Quark, I know that they will come out at 200ppi (plus you can’t scale smaller than 10% which is a problem if your images are tagged as 72ppi). But it is not a property of the image itself.</p>
