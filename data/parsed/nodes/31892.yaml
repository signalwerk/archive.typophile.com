      <p>The point I think Darrel is trying to drive home to all of us is that the web doesn’t care about resolution, only pixel dimensions. As in my example linked above, two files with different dpi display exactly the same if the pixel dimensions are set the same. It’s funny that all of us are clinging so tightly to the “300dpi means larger dimensions” thing, and I can only guess it’s because that model is true <em>for print</em>.</p>
      <p>Andrew, the crazy thing here is that there’s no need to “control the DPI.” We’re just so used to having to control it <em>exactly</em> for print that we simply don’t want to let go of that control with web graphics, even though, according to Darrel’s comments and the proof in my examples, we don’t need to worry about it at all.</p>
      <p><em>“A 300x300 pixel image at 300ppi is equal to a 1250x1250 pixel image at 72ppi, right?”</em></p>
      <p>It <em>CAN</em> equal 1250x1250, if you resample it to do so, but apparently it doesn’t <em>necessarily</em> equal 1250 x 1250; that is, you can simply “tell it not to” by changing the pixel dimensions.</p>
