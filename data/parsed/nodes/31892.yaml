      <p><cite>Frankly I don’t care if the web “sees” dpi. Photoshop cares. So it seems to me that if I’m creating graphics/pix for the web, in Photoshop, I should use 72 dpi.</cite></p>
      <p>Photoshop cares if you’re going to print it, but not if it’s going on the web. It assumes 72 dpi for web use as a sort of arbitrary convention - that number describes the original 1984 Macintosh screen. Computers now generally have smaller pixels (a 20-inch iMac, for example, at 1680x1050, is around 98 ppi). The main thing, from Photoshop’s point of view, is that a 72-dpi image will either have small enough pixel dimensions to work on the web or it will have large enough spatial dimensions to alert you to the problem.</p>
      <p>The whole thing is easiest if you acknowledge that print and web are different beasts. Print works in units of area, so dpi is absolutely essential, whereas the web works in pixels, so dpi is totally irrelevant - what matters there is the number of pixels.</p>
