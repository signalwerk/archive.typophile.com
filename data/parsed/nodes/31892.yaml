      <p>here’s another way to explain it, for those of you who still care:</p>
      <p>i design a postcard for a client. the working file is relatively hi-rez, specified in photoshop as 6 inches by 4 inches at 600ppi. in pure pixels that’s 3600x2400, with a file size<br>
      of 24.7 M.   “too big for the web”.</p>
      <p>now i want to display it as close to “actual size” as i can on a web site.<br>
      by actual size i mean apparent physical size, the way a postcard looks sitting in front of you.  right there is a chance for misunderstanding: you might say 3600x2400 is the actual size, “but on the web it will be huge.”</p>
      <p>but i say “postcard size” is the actual size, and i want it to appear approximately “life size”, knowing that it will vary somewhat, but within a tolerable range, from one monitor to another. so i reduce the image, in photoshop.</p>
      <p>method 1) maintaining 6 inches by 4 inches but down to 96ppi (or 72ppi if you prefer).  the resulting file is now 576x384 pixels, weighing in at a more manageable 648 K.<br>
      it has also suffered noticable loss in resolution. </p>
      <p>method 2) simply adjust the pixel size to 576x384, while maintaining 600ppi,<br>
      but the “inches” measure in photoshop drops to .96 x .64 - again, detail (information)<br>
      is lost. it’s not the same file size, nor is it the same resolution.</p>
      <p>i’d appreciate some restraint, if not an apology, in the “you just don’t get it” department.<br>
      i get it, i got it, i’m gonna go get some more of it.</p>
