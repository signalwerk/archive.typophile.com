      <p>“AAARRRGGGGHHHHH. why do people keep citing this data in isolation when obviously the relationship between ppi and file size comes into play RELATIVE to size on the screen ???????? call it inches or pixels. it’s data per display size.”</p>
      <p>Chris, I had to read this several times to figure out how you could think there is any relationship between ppi and file size. I think there may be a cultural gap here that’s hindering communication between people who just use images and people who muck about with file formats. A Photoshop user might think of pixels as just the things visible on the screen, and might think the underlying data are something different. This would seem like a sensible assumption, because it corresponds to the reality of preparing image files for printing. But actually file formats such as JPEG and GIF consist of “abstract” pixels that ideally correspond to the pixels on your screen. There’s a file header that contains various information about the file (including, in JPEG/JFIF format, 4 bytes that define the ppi values); everything after that file header is just a compressed or uncompressed array of pixels. When you open up a JPEG in Photoshop and then select “Image Size”, the display tells you the dimensions in pixels at the top and the dimensions in your units of choice (inches, centimeters, etc.) below. The pixels in the upper half of the Image Size dialog are the image data - no matter what dpi the Resolution box shows, the amount of image data is equal to the pixel dimensions.</p>
      <p>When Photoshop (or some other image viewer) displays an image at 100%, that means that one abstract file pixel is equal to one screen pixel.* When a Photoshop file is sent to a printer, though, it doesn’t work in pixels - it works in units of area. So when the file gets printed, it is converted into different information based on the dpi setting in the file. So you are correct that the amount of data depends on ppi in the world of (print) production, but Darrel is also correct in saying that changing the ppi of a file has no effect on the file size unless you also change the pixel dimensions.</p>
      <p>Web browsers will display the image at 100% unless forced to do otherwise, like in the example from Patty’s site that started this thread. So for web use, the size on screen depends solely on the pixel dimensions, and ppi has no effect. This is very different from how images are prepared for print in Photoshop, but it’s the reason why, in the alternate-size image example that Dan posted, it’s necessary to have separate files for each size.</p>
      <p>* Obviously, if the image is being displayed at something other than 100%, either some pixels of the file data are being dropped out or additional pixels are being extrapolated. This doesn’t affect the file size, because the number of pixels actually stored in the file remains the same.</p>
