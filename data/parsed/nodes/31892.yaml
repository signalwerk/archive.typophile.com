      <p><cite>I just don’t use pixel dimensions as my starting point.</cite></p>
      <p>I understand that, and there’s really nothing wrong about that. Different schools of thought.</p>
      <p>However, that doesn’t mean that pixels are unimportant. Far from it. Knowledge about the pixel size is important, in the way that it represents the actual information stored in the picture.</p>
      <p>Let me pose a rethorical problem: suppose you want to print a very small picture — and with “small” I mean few pixels, of course ;-) — for example your avatar, which measures 60 times 60 px. If you want, you can resize this picture to be 10 inches wide at 300 DPI, right? But to achieve this, you will have to change the number of pixels in the process (because 10in times 300 DPI equals 3000 px). This can be achieved through interpolating upsampling. However, the catch is, and I am sure that you realise this, that you can’t really add any information to the original picture in this way. The final picture will have the resolution 300 DPI in one sense of the word, but that number says very little about the image quality. In fact, the picture will be extremely blurry.</p>
      <p>In short, don’t ignore the pixel count, and be vary of resampling.</p>
