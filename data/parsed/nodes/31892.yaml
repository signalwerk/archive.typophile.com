      <p>Bruce said:<br>
      “Taz Tally is saying that pictures for the web ought to be saved in Photoshop at 96 ppi rather than 72 ppi. Have any of you heard this? (He says it during a Silverfast scanning software video at lynda.com.) I don’t understand why he thinks we should save them at 96 ppi when they are still going to display as plain ol’ pixels! The file sizes will be identical, and the pixel dimensions will be identical, but the print size will be smaller. What advantage is there in that if one is making a scan strictly for the web?! (The only thing I can think of is that he wants his 4x6 inch snapshot print to appear on the screen at roughly the same size (thus returning to WYSIWYG) but no two monitors are alike, so what good is that? Am I missing something essential here?”</p>
      <p>You understood that exactly right: if you scan an image of 1*1 inches with 96ppi, *most* of the todays screens will display it at about this size. If you scan at 300ppi, you will get a picture about three times as large on a usual screen, so if you only want to scan for screen use, 96dpi will be the “right” resolution if you don’t want to magnify or show details.<br>
      Today, almost every normal desktop screen has a physical resolution of 90 to 100ppi, rather than about 72ppi in the 80ies. Special devices like laptops, handy displays, etc. may differ, but they are used in different viewing distances. Or they are used for special tasks. You can’t care about the special ones...</p>
      <p>As for choosing a ppi-value for a picture you want to use on screen, and you already have (not scanning yet): You *have* to choose a value in most picture file formats, but its completely irrelevant on screen. There, only pixel dimensions count. You can set the value to 3ppi, 30, 300 odr 30000, the picture  will not display any different, nor will there be more or less information in the picture, thus the filesize will be identical. The ppi-value is ignored in internet browsers (it may not in photoshop in certain display modes, as photoshop is print orientated, but we talk about output media like paper or on-screen internet browser).</p>
      <p>When people say they can’t control how their content is displayed on the internet, that’s just wrong. They can not control the total size of there website in inches, but they can do it very exactly in pixels. Assuming that every user has a display that fits his needs in certain circumstances (desktop, laptop, mobile phone), this means that your website reaches the viewers eye as intended.<br>
      If somebody looks at his 160ppi-iPhone at the same distance he uses his 23” desktop monitor, it is *his* problem. It’s the same thing as if someone does not uses his glasses, and complains that he can’t read this small printed type.</p>
