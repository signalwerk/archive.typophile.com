      <p>these narrow definitions of “relevance” are what’s bothering me. why would i want to supply my web host with gigabytes of huge resolution images just because they’ll “display” the same as small ones ? obviously it makes more sense to reduce them for web display for no other reason than the overall storage size of the site. and yes, large images load slower.</p>
      <p>for me, it’s pointless to define relevance purely in the isolated context of final delivery media. relevance includes all the intermediate media stages, interpolations, translations, conversions, and prepwork.</p>
      <p>i can’t believe all you web builders out there aren’t making choices about picture size<br>
      and clarity every day, possibly converting unwieldy hi-rez originals into more managable sizes and making sure they look as good as possible. you’re dealing with resolution, whether you apply ppi choices or not. i thinks that’s what the real misunderstanding has been - patty and i use ppi as our means of defining resolution, and perhaps that particular mode of measurement isn’t useful to the web, but RESOLUTION itself is a basic aspect of digital image quality and optimization for any digital media, web included.</p>
      <p>i’ve said it before and i’ll say it again: more information is more information,<br>
      and more information is a larger file, so resolution remains relevant. one of the peculiar platform-specific ways to define it during the working process is ppi.</p>
      <p>maybe for webbies the “relevant” issue is bandwidth. i could say bandwidth is irrelevant to print, but i see bandwidth and ppi resolution as related in the larger issue of<br>
      “data density per delivery unit”. </p>
      <p>and if i’m delivering huge print files online, bandwidth becomes temporarily relevant to that process, addressed not by altering the files but by assuring that my tools and connections can handle the job. so it’s all relevant, relatively, depending on your role in the process.</p>
