      <p><cite>Personally, I’ve grown up with the “pixel” outlook on computer images, and hence I often think that the resize dialog in more advanced image editing software, like Photoshop, is overtly complicated. “Inches? DPI? Why would I care about those arbitrary values? I want control over the actual number of pixels, because that is what is relevant for how much information is stored in the picture.</cite></p>
      <p>There’s the difference right there. Maybe you upstart web kids should have a bit more understanding of “old media”, or print. And take a broader view. Photoshop deals with DPI and inches because that information is EXTREMELY relevant for print media. I may use the same image in print (300 dpi) in a pdf or comp (150 or 200 dpi) and for a web graphic or jpeg to email for approval (72 dpi). Images need to be scaleable both in terms of real size (inches) and resolution (DPI or PPI). If I had to make those calculations in pixel dimensions I’d go nuts.</p>
      <p><cite>If you are thinking in terms of inches and DPI, you are making the matter unnecessarily complicated for yourself.</cite></p>
      <p>Only if you are talking about the web. But I DESIGN for the web, do not program for it. I create my files in photoshop. And yes, once I have a grid figured out I resize various elements using their pixel dimensions but it still feels very unnatural to me, coming out of a different design tradition, not to think in terms of inches, at 72 DPI. </p>
      <p>So I second what Chris says - it’s not about the abstract but about practical reality. </p>
      <p>And I will add one more thing - if you take the same file, same file size (in pixel dimensions) and place it in a design program such as Quark or InDesign, the clarity with which it will display will be very different if you place it at 300 dpi and scale it up or at 72 dpi, full size - in inches.</p>
