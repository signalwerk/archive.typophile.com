      on screen, image size = pixel dimensions / display ppi  [nominally 72]<br>
      in print, image size = pixel dimensions / image ppi  [whatever the ppi setting in the file is]</p>
      <p>I think we’ve all been saying this, but in different ways and with different emphases that made it look like disagreement.</p>
