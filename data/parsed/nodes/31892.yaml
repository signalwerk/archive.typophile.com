      <p>Another reason why 72ppi could confuse - when I had an old CRT monitor, that was about 72 ppi, but on my current laptop 100ppi would seem to be closer to the resolution on the screen - so don’t expect your 72 by 72 pixel image to show up as one inch across on every web user’s screen - for many, maybe even most people, it’ll appear smaller.</p>
      <p>The one place where the dpi resolution will be relevant is if you’re putting an image file online and expect people to download it and print it out by itself, i.e. not as part of a HTML page - then their printer will probably respect the dpi number and size it accordingly.</p>
