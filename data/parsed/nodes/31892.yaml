      <p>The operative element for web is wysiwyg - whether it’s 72 dpi or 100 dpi (depends on your monitor) you are working in screen resolution.</p>
      <p>To answer Johan, the image will LOOK better in Quark or InDy if it’s 72 dpi at actual size rather than 300 dpi (same px dims) enlarged to fit. Even tho the file size is the same.</p>
      <p>To confuse you webbies further, in print there’s a distinction btw high res and low res. While the printer gets high res files, it is common to use low-res scans when making a layout to keep the Quark or InDy files from getting unmanageably large. If the scans have the same name, the printer can replace them automatically while preserving sizing, cropping, etc. So yes, to reiterate, DPI is very important.</p>
