      <p>&gt;&gt;“more information is more information”<br>
      &gt;&gt;100px × 100px. That’s the information.</p>
      <p>yeah, EVENTUALLY, but here upstream ppi also represents real information. information seems to be defined differently at different platforms in the process.<br>
      you’ve preferenced your definition of information over mine. why in the name of odin should i ignore the term “resolution” ? my work is all about resolution! usually high data density elements that must be conformed down to lower resolution media.</p>
      <p>&gt;&gt;There is no density to choose.</p>
      <p>??? says who ? on your end, maybe because density (in the plastic sense) is fixed and meaningful only according to the end user’s monitor, but on my end NO, there IS density to choose, and tweak, so i can prepare YOUR end to discard it with optimal results !<br>
      (see above first quote from your post: “of course you convert”). </p>
      <p>i understand there are no inches on the web (!!!!) and if i eventually define my image as 100 x 100 pixels the “original” dpi is thrown away. okay ? got it. </p>
      <p>read this: I UNDERSTAND.</p>
      <p>what i object to is the blanket statement that ppi is irrelevant. if the process includes it<br>
      at any stage, it’s relevant. granted this argument has included (on my part as well as others) some cross-terminology : dpi / ppi / resolution.</p>
