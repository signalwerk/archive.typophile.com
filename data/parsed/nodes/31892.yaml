      <p>I really don’t know why this topic is so difficult to understand, but obviously it is, as I run across people every now and then who confuse things...</p>
      <p>I’ll try to explain:</p>
      <p>Lets start with print: PPI means Pixels per Inch.<br>
      You have a certain amount of Pixels, distributed on the length of one inch. The more Pixels you have, the smaller they get, the sharper the image looks like.<br>
      The PPI-Value set in Photoshop is only a number: It defines the relationship between number of pixels (pixel dimensions) and the physial size of the image (length and width dimensions). There is no additional information in this number.<br>
      If you have a picture with 300*300 pixels, and a dpi value of 300, it will print 1*1 inch in size. If you take the same picture, and change the dpi value to 100 (picture is still 300*300px large!), it will print 3*3 inches. There is the same amount of pixels printed, resulting in a grainier picture with larger pixels.<br>
      I think this quite clear.</p>
      <p>So let’s switch to screen:<br>
      How large is a Screen with 1600*1200 pixels? It differs. There are small 12” notebook displays with this pixel dimensions, and large desktop displays as well. Both have the same pixel dimensions, but the differ in: PPI. A small notebook display has let’s say 200 pixels per inch, a large desktop-display maybe 100. The Pixels of the Desktop Display are larger.<br>
      What happens if you display a picture with 300*300 pixels here? It will display in different sizes. On the notebook, you will have a picture of 1,5*1,5 inches. On the Desktop, the same picture will be 3*3 inches. Each pixel of the display shows one pixel of the picture.<br>
      As the notebook pixels are much smaller, the resulting display of the image is smaller too. There is (yet) no way to determine, how big a picture (in inches) is displayed on a screen. All you can do is give pixel dimensions.</p>
      <p>So what is it about 72ppi (or 96ppi)?<br>
      Well, for some purposes, the operating system has to convert pyhsical lenghts to pixels. This happens for example with type. You say “my window titles should have the size of 10pt”. pt is a physical length. But the operating system has to display pixels, so it needs to know what “10pt” is. Ideally, you would tell the system, how large your screen is in inches (lenght, height). Then, if you say “10pt”, it could display the type exactly 10pt. But until today this is theoretically possible, but practically not, as for programming reasons. So, the system *assumes* your screen has a physical resolution of 72ppi (apple) or 96dpi (windows), even if it is not exactly true. For most desktop displays, the value today is between 90 and 100ppi, so 96 is quite a good number (72 was quite good in the 80ies and even 90ies, but displays became better).</p>
      <p>So: if you have a 96ppi screen, and you take a picture of 96*96 pixels in photoshop, and enter the value 96ppi, it will show exactly as large as it would print (1*1 inch).</p>
      <p>But all of this only matters if you want to print a picture. The PPI value is worthless on a screen, which dimensions are unknown to you (which happens on the internet or on TV).<br>
      As Aluminium tells us with the tower of Babel, if you have the same number of pixels in a picture, it does not matter whether it is saved at 30000ppi or just 30. On screen, each pixel is shown 1:1, size according to the size of the actual display. If you took this picture to photoshop and print it, the printed size would differ dramatically (this does not apply to print from a internet browser, they act like displays when they print).</p>
    html_clean: |-
