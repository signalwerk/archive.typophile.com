      <p>I still know where you’re coming from Chris; when I tested Darrel’s theory and proved his results I was shocked. So here’s what I did.</p>
      <p>I started with a 300dpi image that was 1600x1600 pixels, let’s say the file size was 1MB. Throw that on the web and, sure enough, it fills the screen and is slow to download.</p>
      <p>Change the resolution (without resampling) to 72dpi (thus keeping the image at 1600x1600px). This is where I’ve always been mistaken: I <em>thought</em> this would reduce the file size, but it doesn’t. But...</p>
      <p>Resize/resample that 72dpi graphic down to 300x300px (that is, change the pixel dimensions) and the file size drops, let’s say to 75K, and now it displays at the size I want (300x300px).</p>
      <p>Now, here’s the weird part, go back to the 300dpi/1600x1600px image, make sure “Resample Image” is checked, and simply change the pixel dimensions to 300x300px, leaving the dpi at 300. This is the crazy part: the image is now the right dimensions for the web, and the file size is the same as the twice worked-over version above, only 75K.</p>
    html_clean: |-
