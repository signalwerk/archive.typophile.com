      <p>The actual files for bitmapped graphics, if you look at them (for example by opening one up in a hex editor and comparing against the JPEG spec), simply describe pixels. A JPEG file, for example, is defined in terms of a rectangle that is X pixels wide and Y pixels high, and consists of a compressed summary of X times Y pixels. The information about pixels per inch is purely optional, as a way of telling printers how big to print the thing. It’s not really part of the data at all.</p>
      <p>Video may be somewhat different because the compression algorithms are more complicated and may want to take into account how large it will appear to be.</p>
