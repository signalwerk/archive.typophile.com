    html: <p>I suppose I should add that there has been a longtime wish to have DPI settings online. At one point, the PNG format had a proposed multi-resolution option. The idea that the PNG could serve up the low-res version for on screen viewing, but if you wanted to print it, you could send a higher resolution image (at the same physical dimensions) for printing on paper. It was a great idea, but still hasn’t been adopted.</p>
