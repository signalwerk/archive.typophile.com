      <p>“No! That’s what is perpetuating the confusion. Both are measurements “per inch.” If you want to only measure in pixels only that’s fine. I love measuring that way and do measure that way. But don’t refer to it as PPI.”</p>
      <p>My point was that DPI and PPI are used to measure different things.</p>
      <p>DPI = the number of ’dots’ of data PRINTED per inch of paper.</p>
      <p>(edit: that’s not quite true, either. DPI is really the number of dots of data AVAILABLE for printing. Most printing is done via a line screen [LPI], so the actual dots that are printed are less than the number of pixels in the image)</p>
