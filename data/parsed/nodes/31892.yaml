      <p>This discussion really accentuates the different point of view of this matter. Personally, I’ve grown up with the “pixel” outlook on computer images, and hence I often think that the resize dialog in more advanced image editing software, like Photoshop, is overtly complicated. “Inches? DPI? Why would I care about those arbitrary values? I want control over the actual number of pixels, because that is what is relevant for how much information is stored in the picture.” As others have commented, for web-use (today), the numbers of actual pixels in the picture is what actually matters. If you are thinking in terms of inches and DPI, you are making the matter unnecessarily complicated for yourself. Unfortunately, Photoshop and the like tends to enforce the concept of DPI (as the discussion about 72 DPI shows).</p>
      <p>I don’t know if I can add much to the discussion apart from what has already been said, except to note that the term “resolution” sometimes is used in two very different meanings, which might be a source of great confusion. Sometimes it refers to the number of dots/points per inch, DPI/PPI, and sometimes to the raw number of pixels without any notion about physical length (for example when talking about computer screens, or digital cameras).</p>
    html_clean: |-
