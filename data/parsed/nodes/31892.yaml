      <p>“I think that’s where I’m lost, how can you control the DPI aside from the resolution?”</p>
      <p>You don’t. It’s just a bit of meta information that says ’hey, when you print this image, print it at this size on paper’. It just controls the SIZE of the pixels when printed.</p>
      <p>On screen, it’s irrelevant.</p>
      <p>“The point I think Darrel is trying to drive home to all of us is that the web doesn’t care about resolution, only pixel dimensions.”</p>
      <p>Yes! ;o)</p>
      <p>“in photoshop and aftereffects, there is no question that dpi (ppi) is directly linked to<br>
      file size and relatively linked image quality.”</p>
      <p>Nope. File size is determined by the number of pixels in it. I think that’s where you’re confused.</p>
      <p>These images would be the same file size:</p>
      <p>100x100 @ 100dpi<br>
      100x100 @ 1000dpi</p>
      <p>printed from photoshop, one would be 10 times smaller, but they both have the same number of pixels and take up the same amount of memory on the computer. One would print 1” square, the other .1” square</p>
      <p>Now, these images WOULD be different file sizes:</p>
      <p>1” x 1” @ 100dpi<br>
      1” x 1” 2 1000dpi</p>
      <p>They’d print the same size, but the first would be 100x100 and the second would be 1000x1000. The second would be 100 times larger in file size.</p>
