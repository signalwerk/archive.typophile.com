      <p>My understanding - and I’m not a web designer - is that when preparing graphics for the web you should always be working in 72 dpi (or ppi). That way you are dealing with the images at the size they will display on screen. And, when creating tables and such you thus already know the pixel dimensions of your images without having to do any math. Deviating from that standard can only cause confusion IMHO.</p>
      <p>But... a question pertaining to topics raised in the other thread - does it affect image loading speed if the graphic is at a higher dpi (same pixel dimension)? Not that I’d do that but it was discussed earlier.</p>
