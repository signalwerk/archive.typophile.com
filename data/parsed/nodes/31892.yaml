      <p>It’s late and my brain is empty, but one thing jumps out at me, in the differences between web and print, that I’m surpised no one else has mentioned, especially on a discussion group called “Typophile” . . . when I hear Patty mention that she likes the control in print design compared to the web, I immediately think of type as much as pictures, perhaps even moreso. In web design we cannot know how lines of type are going to break, and we cannot control the color of type, cannot subtly track the word spaces in a line of FL text to make the rag more even, cannot ensure that we won’t have more than two lines in a row that end in a hyphen. This is the part about web that I am still trying to accept — it’s exciting, but it’s a bit like walking into a frontier town in the wild west where only some aspects of life are ordered and predictable. For me, the careful massaging of type on a book page is one of the most challenging, meditative, and satisfying things I could ever do. I love it, and I hate having to give up that subtle degree of control when I do web design. </p>
      <p>At this late hour, I also see something rather amusing. We have all learned to think of vector art as resolution-independent and pixelated (bitmap) art as resolution-dependent. Right? </p>
      <p>Well, having read this whole thread from the beginning, I would summarize by saying that designing for the web — for which the <em>lingua franca</em> is pixels — is resolution-independent! Apart from the density of an end user’s display, we need not care about anything except pixels. (Video is different from computer displays, as Ch has pointed out.) So that is the ultimate in simplicity. For the web, a pixel is a pixel is a pixel. Whereas design for print is <em>dependent</em> on resolution! Does anybody else think this is a bizarre twist, or is it because it’s 1 in the morning and I’m the only one laughing?</p>
      <p>I also want to return to something Patty said a bunch of posts up from here: she said the pictures of those two guys would print at the same size and a lot of people said no! But if I understand this correctly, she was showing us two picture boxes in an app such as QuarkXPress. One picture was blown up to 300%, the other one reduced to 90%. But both pictures would indeed be the same size because they would be printed on paper with identical dimensions. the density of their contents might be different (and the file sizes of the scans different), but the pictures would be the same size on the printed paper.</p>
      <p>Taz Tally is saying that pictures for the web ought to be saved in Photoshop at 96 ppi rather than 72 ppi. Have any of you heard this? (He says it during a Silverfast scanning software video at lynda.com.) I don’t understand why he thinks we should save them at 96 ppi when they are still going to display as plain ol’ pixels! The file sizes will be identical, and the pixel dimensions will be identical, but the <em>print size</em> will be smaller. What advantage is there in that if one is making a scan strictly for the web?! (The only thing I can think of is that he wants his 4x6 inch snapshot print to appear on the screen at roughly the same size (thus returning to WYSIWYG) but no two monitors are alike, so what good is that? Am I missing something essential here?  </p>
      <p>One last thing about resolution. So much of it depends on appropriate understanding of viewing distance, rather than going for whatever is the highest absolute quality. I make very big photomurals (sometimes 50 feet long) and although most of them are doneon photographic paper, I’ve made a few public art projects using traditional paper billboards. These are made by silkscreening CMYK process inks onto the paper. When you see a billboard from your car or from the subway, the image looks normal, and very sharp. If you walk right up to it, you’ll find that the color separation was made with a 15-line screen! The ink spots look like golf balls! For the <em>designed</em> viewing distance, you don’t need a screen ruling any finer than that.</p>
      <p>In 1984 I bought an electronic typesetting system for the book-printing company where I was working. Up to that time we were setting everything in hand type or on the linotype. (Yes, that is correct, all hot-metal in 1984!) I bought a Monotype Lasercomp because it gave us access to Monotype’s distinguished library of types. The Lasercomp’s resolution was 1000 dpi. My friends a couple of states away, who did the same kind of work in book production, had a Linotronic with a resolution of 2540 dpi. One friend from that plant came over and looked at the output from our machine with a high-power loupe and commented gently that he could see the rough edges on the letters from our machine, whereas the Linotronic edges were smooth. He was quietly happy that their machine produced smoother edges. </p>
      <p>He was right, but I would also say that the type from our machine, once burned onto a plate via contact in a vacuum frame, its image inked and then transferred to rubber blanket, and then transferred <em>again</em> to uncoated paper such as Superfine or Dulcet, would read just fine. Our books were meant to be read at a distance of 12 or 15 inches (30 to 38 cm) and in that situation, 1000 dpi vs 2540 dpi didn’t matter. But the difference between a 133-line halftone and a 200-line halftone could be perceived immediately with the naked eye: you could feel grain in the 133 and it was absent in the 200.</p>
      <p>So we agonize about resolution all the time when paper is involved.</p>
      <p>Time to get horizontal.</p>
