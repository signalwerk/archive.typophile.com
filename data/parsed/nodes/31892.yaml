      <p>Maybe what may confuse some, is that they use the pictures intended for screen in mainly print orientated software like Illustrator, Indesign or (in parts) Photoshop. This software simulates print output, don’t trust it for on screen display (specially not Illustrator, Indesign or xPress)! They *do* read and consider the PPI-value of an image, because they also do consider inches and pt.</p>
      <p>What is relevant for internet use just is internet browsers. They are “real world”. They don’t care about inches or pt (that’s why text size in browsers of OSX and Windows can differ in certain circumstances - but that’s the *only* part where internet browsers care about lengths units).</p>
