    html: |-
      <p>^ … would definitely be a better choice than Akzidenz Grotesk ;P</p>
      <p>Edit:<br>
      I had a similar discussion with a (father-to-be) friend of mine and we found out there are some fonts that are definitely NOT suitable for baby names:<br>
      besides Akzidenz Grotesk, we came up with ITC Machine, VAG rounded, Fatface, …</p>
      <p>Seriously though, here are my suggestions:</p>
      <p>M:<br>
      Arno <a href="http://new.myfonts.com/fonts/adobe/arno/" title="http://new.myfonts.com/fonts/adobe/arno/">http://new.myfonts.com/fonts/adobe/arno/</a><br>
      Trajan <a href="http://new.myfonts.com/fonts/adobe/trajan/" title="http://new.myfonts.com/fonts/adobe/trajan/">http://new.myfonts.com/fonts/adobe/trajan/</a></p>
      <p>F:<br>
      Joanna <a href="http://new.myfonts.com/fonts/adobe/joanna/" title="http://new.myfonts.com/fonts/adobe/joanna/">http://new.myfonts.com/fonts/adobe/joanna/</a><br>
      Flora <a href="http://new.myfonts.com/fonts/adobe/joanna/" title="http://new.myfonts.com/fonts/adobe/joanna/">http://new.myfonts.com/fonts/adobe/joanna/</a><br>
      (Gerard Unger named Flora after his daughter, it would be fun to ‘turn the tables’!)</p>
      <p>My best wishes to you and your family!</p>
