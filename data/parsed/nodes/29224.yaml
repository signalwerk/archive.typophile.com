      <p>"all those boring layouts" means?? An idea becomes boring when its over used by the peoles..same thing is happening with these menus also. Everyone is following those same patterns again and again.<br>
      See those layouts and ask yourself y they are boring...study them deeply, figure out their problems and then try to do something new which is functional but not been created before. But dont think its that easy...<br>
      Break the rules but, be careful:)</p>
