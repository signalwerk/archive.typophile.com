      <p>I think too many people these days assume that screen generated design has limits and so everything should follow the same patterns. </p>
      <p>A DVD menu can be what ever you want it to be, as can everthing else. Why cant a DVD menu be similar to that of a menu or contents found in a book or that of a restaurant menu.</p>
      <p>My advice it just follow the elementry rules when designing something. What is it for, who it is aimed at, choose an appropriate typeface etc etc. </p>
      <p>Forget waht existing menus look like. If it were me I would be thinking of creating a piece f design that works for the topic. The only rule you may have it the format, but even that can be broken.</p>
      <p>Matt</p>
