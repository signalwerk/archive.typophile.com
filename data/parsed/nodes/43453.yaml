      <p>Ack!  It says I'm Comic Sans and that I *heart* Papyrus.  Apparently. the world splits into two groups: cold (Helvetica, American Typewriter and Stencil) and pathetic (Comic Sans, Papyrus, Mistral).  I went back and changed one answer and wound up as Helvetica, though.  This was not that entertaining.</p>
