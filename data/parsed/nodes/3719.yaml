  html: <p>Have you seen any other examples of this?  <br> <br>It somewhat resembles Jason Walcott's <a href="http://bowfinprintworks.com/Script07Pg9.html" target="_blank">Luxury Royale</a> (top of page). It also seems to have a custom or swash 'k'. I've looked through Parts 7 &amp; 8 in my Script Font ID Guide and it doesn't seem to be anything I have collected so far, so I'll be wanting to get a sample if someone ID's this one.</p>
