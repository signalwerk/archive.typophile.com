      <div class="comment-spam-body"><p>_SHELL SUPER MOTOR OIL_ Good find Kevin! Much closer than Tablet, where _O_ was too square etc. For a perfect match very minor tinkering with the bowls on _P_ and _R_ to make them less squared and have the leg of _R_ join the bowl closer to the vertical stroke,<br>
      Don</p>
      </div>
