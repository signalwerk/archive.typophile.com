  html: |-
    <p>I have been asked to re-create these three metal serial number plates to be used on a restored classic Ferrari.<br>
    Hopefully the good people of the forum can help me with a few pointers as to the fonts used.</p>
    <p>I'm counting  7 different fonts being used - not including the old style Ferrari logo typography (a vector of which is also proving difficult at the moment)</p>
    <p>Thanks.</p>
