      <p>|motore contiene| is Eurostile:<br>
      <a href="http://www.myfonts.com/fonts/linotype/eurostile/" title="http://www.myfonts.com/fonts/linotype/eurostile/">http://www.myfonts.com/fonts/linotype/eurostile/</a></p>
      <p>|SHELL SUPER MOTOR OIL| could be replicated using Tablet Gothic (substitute a lowercase |l| for the |I|):<br>
      <a href="http://www.myfonts.com/fonts/type-together/tablet-gothic/" title="http://www.myfonts.com/fonts/type-together/tablet-gothic/">http://www.myfonts.com/fonts/type-together/tablet-gothic/</a></p>
      <p>The center panel appears to be a mix of Univers (numbers) and Helvetica (letters):<br>
      <a href="http://www.myfonts.com/fonts/linotype/univers/" title="http://www.myfonts.com/fonts/linotype/univers/">http://www.myfonts.com/fonts/linotype/univers/</a><br>
      <a href="http://www.myfonts.com/fonts/linotype/helvetica/" title="http://www.myfonts.com/fonts/linotype/helvetica/">http://www.myfonts.com/fonts/linotype/helvetica/</a></p>
      <p>|FERRARI 365 GTB/4-A| appears to be News Gothic Bold:<br>
      <a href="http://www.myfonts.com/fonts/linotype/news-gothic/" title="http://www.myfonts.com/fonts/linotype/news-gothic/">http://www.myfonts.com/fonts/linotype/news-gothic/</a></p>
      <p>|MOTORE ENGINE|, |AUTOTELAIO CHASSIS|, and |MADE IN ITALY| appear to be Futura:<br>
      <a href="http://www.myfonts.com/fonts/linotype/futura/" title="http://www.myfonts.com/fonts/linotype/futura/">http://www.myfonts.com/fonts/linotype/futura/</a></p>
      <p>|365 GTB/4-A| appears to be Reforma:<br>
      <a href="http://www.myfonts.com/fonts/paratype/reforma-grotesk-bold-e/" title="http://www.myfonts.com/fonts/paratype/reforma-grotesk-bold-e/">http://www.myfonts.com/fonts/paratype/reforma-grotesk-bold-e/</a></p>
