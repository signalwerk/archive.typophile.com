      <p>Yeah, solve the '.com' treatment and you've got yourself a nice little concept here.</p>
      <p>The letters of the logotype are a bit too modular for my tastes. They don't seem to mesh well with the roughness of the shoe track. Their basic shape works well with the shape of the footprint, but there's something about the simplicity of the 'r' and the 'u's that get to me.</p>
      <p>penn</p>
