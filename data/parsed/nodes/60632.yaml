    html: |-
      <p>It's a really clever treatment, and it interacts well with the other characters. It's in really good shape right now, so my criticisms are a little nit-picky:</p>
      <p>You should work on cleaning up your curves a little; some of the bulginess and awkward curves can be attributed to attempting to force an n and a u into a foot. However, you should make it look either like a very realistic foot outline or abstract and stylized. I'd lean towards the latter — you should have smooth curves but still be able to make the foot recognizable.</p>
      <p>I'm not so sure about the placement of the period — I'm still reading it as "runningguru.com," because my brain is trained to read it that way, but when I look at the ".com" independently I'm confused to see the dot just kind of floating there.</p>
    html_clean: |-
