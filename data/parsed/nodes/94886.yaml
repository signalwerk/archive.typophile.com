      <p>Yes, I understood, but I think it is not a helpful terminology. The scheme needs to be describable in all the ways in which it can occur, one of which is that there are simply two axes -- as in the example I gave of Text, Display 1 and Display 2 -- and in which it makes no sense to try to talk of 'full' and 'half' axes. If you want to be able to distinguish terminologically, I suggest something like 'knitted axes' and 'independent axes'. So, for example, four masters that enable interpolation between any of the four constitute a matrix of six knitted axes, to which might be added, using Jen's approach, any number of independent axes involving additional masters that are not interpolated to other masters in the matrix.</p>
      <p>Now, from this it follows that if one can bold independent axes onto a knitted matrix, one can also bolt knitted matrices onto each other, and that these might even attach to each other at more than one master. That's the point at which you really need to draw diagrams to keep it straight in your head. I recall David Lemon telling me once that Adobe made a 3D model of the interpolation matrix for Kepler.</p>
