  html: |-
    <p>Hi all</p>
    <p>Is it possible to have three masters in a FL MM font.</p>
    <p>At the moment I am using two masters - a light weight and a bold weight.</p>
    <p>This is the process I use to create the MM with FL.</p>
    <p>Tools &gt; Mask &gt; Assign Font Mask - Select the Bold weight<br>
    Tools &gt; Multiple Master &gt; Define New Axis - Select Weight<br>
    Select all glyphs then, Tools &gt; Multiple Master &gt; Mask to Master - select Wt1.</p>
    <p>Is it possible to add another medium master to this process - if so how would I do that?</p>
