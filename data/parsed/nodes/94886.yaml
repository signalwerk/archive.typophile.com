    html: <p>Yes, that is what I understood Hrant to imply, if I am in turn understanding you correctly. So, for example, there would be an axis between Text and Display 1, and another axis between Text and Display 2. Note, that I used the phrase 'designed to be interpolable', which is different from interpolable per se. Since outline compatibility of Text to Display 1 and Text to Display 2 implies outline compatibility between Display 1 and Display 2, technically the two display masters are also interpolable, but in the design scheme they are not interpolated because their axis relationship is each to Text, not to each other.</p>
