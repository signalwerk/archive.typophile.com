      <p>The middle: weights that are good for running text, hence spaced accordingly. To the sides: weights that are too light ("left" side) or too dark ("right" side) for running text, which means they can only be used large, so are spaced tightly. All in one MM space with 1/2 + 1 + 1/2 axes.</p>
      <p>hhp</p>
