      <p>One interesting application of this "cheat" would be to treat the intermediate as the cut-off between text and display weights of a typeface, applying a different spacing (and maybe even a different vertical proportions) strategy based on the MM axis. Using the third axis would even allow two cut-offs (treating the middle area as for text and the two outsides as for display).</p>
