    html: <p>I think your notion of 'half axes' is confusing, Hrant. Any  axis between two masters is a complete axis. It makes more sense to think of an interpolation matrix of axes. What Jen's 'cheat' involves is individual axes pointing off a central structure of interlocking axes. If you're using FontLab, this needs to be handled using separate sources for different parts of the matrix.</p>
