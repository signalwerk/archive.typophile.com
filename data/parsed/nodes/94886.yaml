    html: |-
      <p>It’s not possible in FontLab to have intermediate masters.</p>
      <p>You can cheat though if you ‘abuse’ an additional width axis and reconfigure the masters: Use the Weight axis for Light (wt0, wd0) to Medium (wt1, wd0), put the Bold on the Width axis (wt1, wd1). Then you can use the Weight axis for interpolation between Light and Medium (with Width set to 0), and the Width axis for interpolation between Medium and Bold (with Weight set to 1000).</p>
      <p>You have to add a dummy master to (wt0, wd1) that is never used, because MM always needs two masters on one axis. It’s a bit fiddly but should work.</p>
