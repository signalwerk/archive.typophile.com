    <p>I hunted all over for this beautiful <a href="/wiki/quadrata" class="freelinking" rel="nofollow">quadrata</a>, and I can't find it anywhere. It's from the cover of Joy Division's Closer album, designed by Peter Saville.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/joy_5745.png"></div><p></p>
    <p>I cleaned it up and wrangled it so many times to get something out of Identifont that I'm going crazy.</p>
    <p>I thought I had a good answer when I found a typeface labeled "Joy Division Closer" at Saville's site, but it's a forgery! (Omigod, someone alert Uli!) They dumped a typeface named Helios SSi onto the site. Changed the name, but didn't bother to change the copyright. To make it worse, it's not even the same typeface. Bla.</p>
  html_clean: |-
    <p>I hunted all over for this beautiful <a href="/wiki/quadrata" class="freelinking link-lost" rel="nofollow">quadrata</a>, and I can't find it anywhere. It's from the cover of Joy Division's Closer album, designed by Peter Saville.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/joy_5745.png"></div><p></p>
    <p>I cleaned it up and wrangled it so many times to get something out of Identifont that I'm going crazy.</p>
    <p>I thought I had a good answer when I found a typeface labeled "Joy Division Closer" at Saville's site, but it's a forgery! (Omigod, someone alert Uli!) They dumped a typeface named Helios SSi onto the site. Changed the name, but didn't bother to change the copyright. To make it worse, it's not even the same typeface. Bla.</p>
