    html: <p>I usually determine the side bearings when I draw each glyph, not after all the glyphs are drawn. Some refinement is usually necessary as more glyphs are drawn. Or I may change my mind about the spacing after the glyphs are all drawn and make global changes. The key thing is that I work on the spacing at the same time I'm drawing the glyphs, not as a completely separate step. The design of the glyphs are affected by the spacing and vice versa.</p>
