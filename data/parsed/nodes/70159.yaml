      <p>Determining spacing is a big subject. You might want to look here:</p>
      <p><a href="http://typophile.com/node/27804" title="http://typophile.com/node/27804">http://typophile.com/node/27804</a></p>
      <p>Drawing in Illustrator may seem like an easy way to design a font, especially if you know Illustrator well, but it significantly increases the number of steps towards a finished font. And it's hard to work on spacing in Illustrator. Better and faster in the long run to draw right in the font editor.</p>
