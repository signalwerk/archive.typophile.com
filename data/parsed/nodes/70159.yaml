    <p>Before I start working my designs in FL, I would like to know if the following workflow makes any sense:</p>
    <ul>
    <li>draw all glyphs</li>
    <li>determine left offset</li>
    <li>determine right offset</li>
    <li>make kering pairs</li>
    <li>rinse and repeat</li>
    </ul>
    <p>Does this make any sens or am I forgetting something or...?</p>
    <p>Your thoughts/experiences please!</p>
