      <p>I like <a class="freelinking external" href="http://www.myfonts.com/fonts/marksimonson/goldenbook" rel="nofollow">Goldenbook</a> but I don't think that's the one mainly because of /T and /A crossbar.</p>
      <p>EDIT: closer look <a class="freelinking external" href="http://1.bp.blogspot.com/-NJk2ZOrcZh8/UII9ZmPJkvI/AAAAAAAAEKU/hiKk8ugg5uw/s1600/IMG_2223.jpg" rel="nofollow">here</a> and <a class="freelinking external" href="http://www.marcolini-eboutique.com/publishingImages/catalog/TR00021_large.jpg" rel="nofollow">here</a>. More samples and letters <a class="freelinking external" href="http://www.marcolini-eboutique.com/en-en/tablets-and-treats?category=Tablets(Marcolini-Base)" rel="nofollow">here</a>. Reminds me of <a class="freelinking external" href="http://www.myfonts.com/search/trajan" rel="nofollow">Trajan</a> (/N missing top left serif /N, /M slopping verticals) but that's clearly not it. Some more I like: <a class="freelinking external" href="http://www.myfonts.com/fonts/t26/minerva" rel="nofollow">Minerva Antiqua</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/canadatype/orpheus-pro" rel="nofollow">Orpheus</a>.</p>
