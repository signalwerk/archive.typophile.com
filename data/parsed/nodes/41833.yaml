    html: <p>In the Soviet times <em>Poluzhirnyi</em> was the standard term for the companion boldface. <em>Zhirnyi</em> was used for ‘black’, like in <a href="http://paratype.ru/pstore/default.asp?search=Black%20Grotesk&amp;fcode=PT_BLG&amp;params=1" target="_blank"><em>zhirnyi grotesk</em></a> (‘black grotesque’). That nomenclature was borrowed directly from German (German foundries dominated the Russian market in late 19th–early 20th century). The peculiar and often confusing <a href="http://de.wikipedia.org/wiki/Schriftschnitt" target="_blank">German terminology</a> was <a href="http://www.typophile.com/node/17643" target="_blank">discussed</a> here a number of times. In current practice and usage Russian terminology mirrors the English, so <a href="http://paratype.ru/help/term/terms.asp?code=304" target="_blank"><em>poluzhirnyi</em></a> translates as ‘semi-’ or ‘demibold’.</p>
