    <p>Reading up on the Cyrillic alphabet on Wikipedia, I came across this paragraph:<br>
    <cite>“A boldfaced font is called poluzhirniy shrift (‘semi-bold font’), because there existed fully-boldfaced shapes which are out of use since the beginning of the twentieth century.”</cite></p>
    <p>Does anyone have any other information on this, or clarification? It sounds interesting to me since I once, many many moons ago, started to learn Russian. I made it as far as being able to read sentences and paragraphs, not understanding a darn thing of course, based on their simple pronunciation rules and a basic understanding of Cyrillic.</p>
    <p>As a newly dedicated type designer, I guess it’s my responsibility to understand all I can about scripts other than Latin.</p>
