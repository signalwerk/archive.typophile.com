      <p>I assume by "geometric" you mean constructed, and by "font" you mean writing system.</p>
      <p>1) How many writing systems have you studied?</p>
      <p>2) What are the pros/cons of a writing system being constructed?</p>
      <p>In my view Hebrew is a writing system naturally inclined towards large, bold display setting, but less inclined towards setting for immersive reading. And it's interesting that its sister, Arabic, is the other way around.</p>
      <p>hhp</p>
