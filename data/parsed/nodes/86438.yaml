    html: |-
      <p>When asked what market research was done for the iPad, Steve Jobs said none, consumers don't know what they want.<br>
      Not much difference between leadership and self-indulgence.<br>
      With products, the marketplace decides; if it sells, then people want and need it.<br>
      The market has been kind to my whims, which is why I recommend that others do their own thing, rather than try to calculate or guess what people want and need.<br>
      The market is so large that if one follows one's interests, there are bound to be others of like mind.</p>
      <p>However, the market for Cyrillic fonts is presently not very receptive to western-designed fonts.<br>
      I don't think that has anything to do with any alien "they don't get it" quality that such fonts might have, it's more to do with the difficulties that western foundries have in establishing their brand over there—as well as the issue of piracy in Cyrillic font markets.</p>
