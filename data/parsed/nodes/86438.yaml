    html: |-
      <p>My design philosophy is not so script-specific.</p>
      <p>With the exception of a weekend TDC seminar with Maxim Zhukov, I have generally avoided other people's advice*, whether working in my native Latin script or Cyrillic and Greek.</p>
      <p>The results in Cyrillic mimic precedent (Scotch Modern, which I prefer to think of as authentic revival), are indeed caricatures (Fontesque, which is a caricature in its native Latin), or have some degree of originality (Figgins Sans). It has more to do with being true to the qualities and principles of the typeface than native exposure to the script. </p>
      <p>*For retail fonts, that is—on commissions, the client calls the shots.</p>
