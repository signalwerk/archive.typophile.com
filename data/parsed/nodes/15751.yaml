      <p>The 'old computers' site may be of interest for pointers to the earliest computers that used visual displays and hence bitmap fonts. </p>
      <p><a href="http://www.old-computers.com/museum/default.asp" title="http://www.old-computers.com/museum/default.asp">http://www.old-computers.com/museum/default.asp</a></p>
      <p>Another interesting area would be the bitmap fonts used in early coin-op arcade machines (many used multiple colors - something you don't see very often these days) and the custom mostly monospaced bitmap fonts created for games on 8bit home computers. You'll find plenty of screen grabs from both technologies on the Web.</p>
