    html: |-
      <p>Probably the oldest thing similar to bitmap fonts would be letters woven into fabric, as in a tapestry, or in rows of beads. There were also lighted signs composed of rows and columns of light bulbs before computers. I have also seen different colored bricks used to spell out a company name on old chimneys and buildings.</p>
      <p>Even though we associate this kind of letterform with computers, it was not a recent idea. I'm not sure exactly when bitmap letterforms began to be used with computers; probably the early 1970s. It was more common for early CRT displays to use vector-based letterforms because it used less memory. These would be simple connect-the-dot designs, not like modern outline fonts.</p>
      <p>I don't think it would be possible to say who "invented" pixel fonts. The idea was known for a very long time before computers existed and I'm sure was simply used because of its natural affinity with the kind of displays used with computers.</p>
