      <p>Refer back to Bringhurst and look at the Average Character Count Per Line table. This will give you a good idea of what line length you want. Pick the type size according to your taste and/or audience: designers love tiny type and the typical older reader likes big type.</p>
      <p>In design and type, there are typically no 'right' answers, only appropriate ones.</p>
