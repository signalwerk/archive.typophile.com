      <p>InD should let you do it all in the application, by setting up either two facing pages that are each half-page in size and choosing 'print spreads', or just setting up  a single landscape page with two text boxes. Master pages should allow you to do this pretty easily. Apple's print engine should not affect your layout, as long as you aren't telling it to 'Fit to Page' or to scale.</p>
      <p>Perhaps I'm not understanding your question? I started using InD with InD CS1 (and have used each version since), so I'm not familiar with InD 2.0's particular settings.</p>
