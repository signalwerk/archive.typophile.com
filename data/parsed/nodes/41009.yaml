      <p>For your ID problems, get Adobe Classroom in a Book for ID. It will get you over the basics. I needed it, and I had many years of PageMaker experience.</p>
      <p>As for your design, best solution for looking at design problems is to compare your output with actual books, and compare dimensions. For one thing, if you have been working with Word, you probably are using too large a point size for the work to really look like a book. Few books use 12 point text.</p>
