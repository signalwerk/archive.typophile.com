      <p>/////</p>
    <p>There were few more powerful mediums for influencing pubic opinion in wartime Britain and abroad than posters. They were used, most famously, for recruitment – think Alfred Leete’s famous design of Lord Kitchener and James Montgomery Flagg’s ’Uncle Sam’, but also for all kinds of propaganda in general, promoting an official viewpoint and justifying the need for wartime restrictions.</p>
    <p>The Imperial War Museum has the largest and most comprehensive poster collection of its type in Britain, documenting the social, political, ethnic and cultural aspirations of warring nations from the First World War to more recent conflicts. The collection includes work by leading twentieth-century designers from Britain and abroad, and is an essential resource for looking at the development of mass communication, propaganda, publicity, commercial art and graphic design.</p>
