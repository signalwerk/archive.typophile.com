      <p>Three factors involved in myopia are the shape of the eyeball, of the cornea, and the flexibility of the lens. If the eyeball is too long front to back, then one cannot focus at a distance as well. If the lens becomes too rigid, as in presbyopia, then also the lens cannot be adjusted as much for distance vs close work. And the shape of the cornea can cause myopia. </p>
