      <p>&gt;anything that can't be measured isn't readability but aesthetics.</p>
      <p>Nick, I am getting the feeling that you identify science with positivism—which includes such views as: if you can't measure it, it's meaningless or it's unimportant or it's purely subjective. And you think when I advocate the value of science I'm advocating positivism. But science is not positivism, and I'm not a positivist. And, as John said, I certainly don't believe the above idea that you seem to think I believe.</p>
      <p>For starters, I think there is a lot about readability that we can't yet measure, but will be able to in the not too distant future.  </p>
      <p>I think the problem with most past legibility research is, to be blunt, that it has been poor science. If it had been good science, the results would have been much more compelling, and those working with type would have been more convinced of its value, and would be guided by its results. Most people dealing with type professionally haven't been much impressed by has come from scientific researchers on legibility, and I think their skepticism has been largely justified. </p>
      <p>I wasn't intending to beat my drum again, but at TypeCon I will tell a lost story about readability, and some outstanding work on it. I think the whole story, which I only learned of in the past few months, will make a lot clearer what we have been going round and round about over the years here on Typophile, not very fruitfully. I don't mean that it resolves all the problems, but it does clarify a lot.</p>
