      <p>&gt;So Bill, the selection of a particular cut of a typeface is "merely" aesthetic, and has no effect on readability?</p>
      <p>No. Incidentally, Strizver doesn't use the term readability, but "character recognition". </p>
      <p>&gt;Are you saying that the widened crossbars are aesthetic, not craft, because their effect on text readability cannot be scientifically measured?</p>
      <p>Not at all. </p>
      <p>What can't be measured now, and may well be measured soon are two different things. And there are important things that may never be measured. What of readability can be measured and not is a work in progress in reading science. </p>
      <p>You have insisted here on typophile that a science of readability, which would include measures of readability, is IMPOSSIBLE. </p>
      <p>My TypeCon talk will show the science of readability already exists, and has begun to have interesting results, though a lot of progress is yet to be made.</p>
      <p>Whether widened crossbars in themselves help readability I doubt, but they may in some contexts; it's not a settled issue. </p>
      <p>Just to be clear, I also don't think that readability always trumps aesthetics. Quite often in display type maximum readability should be sacrificed to aesthetic goals. Also there are, of course, practical considerations other than ease of reading of continuous text involved in designing a page and a document—including hierarchy of ideas, ease of navigation for the reader, and more.</p>
