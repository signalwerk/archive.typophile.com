    <p>I really confuse with my question, it made dirty my mind for a days, "Is typography a science?"</p>
    <p>50/50. I think Typography is mixture of art and science. Because, Typography is art and another side is science. The science side is about how to make the text and letters can be more readable, legible, and proper with people who want to use it. </p>
    <p>The characteristics of science is:</p>
    <p>1. Knowledge.<br>
    I think typography have it.</p>
    <p>2. Scientifically Ordered<br>
    I think typography doesn't have it yet.</p>
    <p>3. Using the power of thought<br>
    Have it.</p>
    <p>4. Objective<br>
    Sure. The object is type.</p>
    <p>that's all..</p>
    <p>Gunarta</p>
