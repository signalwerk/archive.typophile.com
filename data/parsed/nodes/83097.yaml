      <p>@Gunarta: A bit of information to help you get started</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/process_6498.gif"></div><p></p>
      <p>Bordens &amp; Abbott’s (2008) diagram of the scientific method</p>
      <p>And if you want a nice start into researching the field of a scientific approach to the practice of typography, Kevin Larson has a nice piece of writing which isn’t that hard of a read:</p>
      <p><a href="http://www.microsoft.com/typography/ctfonts/wordrecognition.aspx" title="http://www.microsoft.com/typography/ctfonts/wordrecognition.aspx">http://www.microsoft.com/typography/ctfonts/wordrecognition.aspx</a></p>
      <p>Many people consider Miles Tinker to be one of the earlier contributors to this field. His work is not that hard to read either. You may need a bit of help with the statistics. I also (try to) keep a growing list of literature for my own records:</p>
      <p><a href="http://readthetype.com/literature/" title="http://readthetype.com/literature/">http://readthetype.com/literature/</a></p>
      <p>You will most likely need access to scientific journal databases for the majority of this content, but it has been my experience that if you contact the authour directly they are more than willing to share their work. And Google Scholar seems to be far more successful than it used to be.</p>
      <p>Additional threads include:</p>
      <p><a href="http://www.typophile.com/node/59093" title="http://www.typophile.com/node/59093">http://www.typophile.com/node/59093</a><br>
      <a href="http://typophile.com/node/61626" title="http://typophile.com/node/61626">http://typophile.com/node/61626</a><br>
      <a href="http://typophile.com/node/58433" title="http://typophile.com/node/58433">http://typophile.com/node/58433</a></p>
      <p>And Craig (eliason) is correct. There is certainly no shortage of debate on this topic at Typophile. Chances are, the conversation you’re looking for had already happened several times. Good luck with your research.</p>
    html_clean: |-
