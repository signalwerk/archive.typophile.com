    html: "<p>Modern notions of science tend to focus on method rather than on 'arrangement of knowledge'. Knowledge can be arranged in any number of ways, many of them arbitrary, whimsical or willful. See, for example, the majority of typeface classification schemes, which certainly involve arrangement of knowledge but are anything but scientific. Science isn't something one has: it is something one <em>does.</em> So the question is not whether typography is or is not a science, but what it means to do science in the context of typography.</p>"
    html_clean: "<p>Modern notions of science tend to focus on method rather than on 'arrangement of knowledge'. Knowledge can be arranged in any number of ways, many of them arbitrary, whimsical or willful. See, for example, the majority of typeface classification schemes, which certainly involve arrangement of knowledge but are anything but scientific. Science isn't something one has: it is something one <em>does.</em> So the question is not whether typography is or is not a science, but what it means to do science in the context of typography.</p>"
