    html: <p>Nick, I don't think Bill defined aesthetics as 'anything that can't be measured', and you had to delete a large amount of intervening text to stick those two statements side-by-side. In his final paragraph, Bill is talking about design decisions and how functional readability may be legitimately and knowingly reduced for aesthetic effect in some circumstances. He doesn't suggest anywhere that aesthetics is 'what's left over when you can't measure any more'; rather, he is quite reasonably pointing out that the visual beauty of a text is independent of its readability. <a href="http://www.freewebs.com/kakayicalligraphy/foto%202.jpg" rel="nofollow">That seems to me uncontroversial</a>. Nor is it the case that the aesthetics of typography cannot be measured, but it must be measured in ways that differ from how we might measure readability, e.g. presenting different settings of the same text to people and recording which one they prefer to read, i.e. finding ways to quantify subjective responses to the visual appearance of text before reading.</p>
