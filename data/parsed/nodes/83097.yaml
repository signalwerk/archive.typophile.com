      <p>i think typography may be a science someday. It has so many rules in its knowledge and making type. Now, typography is a part of design art yet. </p>
      <p>If typography is science, which one it will be classified? Natural Science (the study of natural phenomena) and Social Science (study human behavior). I think it will included in Social Science. Because, the usage Typography is never separated with human's life. (while Wikipedia explain typography is an art and technique to arrange type). Typography may be included into formal science also, or applied science (the object is mainly engineering).</p>
      <p>If typography is NOT a science. Why there is the academy discipline of it? Why there is professor of Typography? Why Typography is studied by people? I expect typography is a science soon. Looks! We only need to find the basic laws that universal. </p>
      <p>Science is a systematic enterprise that builds and organizes knowledge in the form of testable explanations and predictions about the world. (Wikipedia)</p>
      <p>Some characteristic of Science:<br>
      1. Knowledge<br>
      Typography is created by the ideas and curiosity of humankind. It can be as craft and engineering.</p>
      <p>2. Scientifically ordered<br>
      To be a science, something needs a arranged knowledge. That arranged knowledge can be called as science. Typography has knowledge, about its history, legibility and readability, the role to human life. Even more, Typography has scope and experimental things. However, there is none arranging knowledge in typography yet.</p>
      <p>3. Using power of thought<br>
      Knowledge comes from idea and curiosity of human. The idea and curiosity come from fact. Since Aldine has found, Akzidenz-Grotesk is labelled as wierd, Comic sans hated, I think Typography is really interesting. The people could judge and evaluate some type in majority way. It's a clue that it can be concluded into science.</p>
      <p>4. Objective<br>
      The object is type and i said before, Typography has scope. And scope is preventing people to not step into outer boundaries. The Comic Sans case, the masters of type said the same thing. Comic Sans may not used as grave text, traffic text, ect. Some other said that Comic Sans have bad kerning. It's clue that Typography is science.</p>
      <p>@bendy: What is modular scaling system? I can't understand the function.</p>
