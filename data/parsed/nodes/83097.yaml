      <p>Interesting, I was wondering about 'scientifically ordered' yesterday at Ampersand. Tim Brown was explaining his <a href="http://www.flickr.com/photos/ohbendy/5844599533/in/set-72157626864079627/" rel="nofollow">modular scaling system </a> into which you can plug in your 'key' type size, and it returns a set of compatible sizes that click. (Try it out at <a href="http://modularscale.com/" rel="nofollow">modularscale.com</a> (still under development).</p>
      <p>It made me question whether principles of typography can be so easily translated into Maths. Music can also be translated into Maths, but IMO something is lost in translation, and the results are not useful for creating music.</p>
