    html: |-
      <p>Bill, this has nothing to do with positivism or philosophy.</p>
      <p>My posts have never been against science, I have used my knowledge of typography to debunk bad science, under which I include the idea that "readability" can be measured with regard to anything other than a specific document — certainly not to the individual constituent elements such as x-height, weight, leading, line length, and typeface choice, in any manner that will be prescriptive to typographers. A template is the kiss of death*.</p>
      <p>Just because some scientists think they are conducting useful experiments doesn't mean that what they're doing is any better than phrenology or graphology.</p>
      <p>I made a criticism of what you wrote in this post, in particular your definition of aesthetics and readability as two non-overlapping concepts, when you said, "I also don't think that readability always trumps aesthetics."</p>
      <p>In my opinion, aesthetics, courtesy of the skill and good taste that a practising typographer has acquired and embedded in a document, is an important part of readability. When I decide on the width of a sidebearing by dragging it until it looks just right, this is an aesthetic decision which I believe contributes to the readability of text which may be set with the font. </p>
      <p>When I choose a particular combination of typeface, size, line length, and page layout for a particular text, by playing around in InDesign or Quark until it looks just right on the monitor, and printing it out on a laser printer, and trying to imagine the final job offset on a particular paper stock, I am using my aesthetic judgement to set values which may subsequently be measured.</p>
      <p>I don't think this issue is much different than the way people have been trying to create scientific advertising for over 100 years, with only limited success. If creating predictably readable (and actionable) documents has met with such limited success there, why should these efforts by any different? These new experiments don't exist in a vacuum, but have that baggage to deal with.</p>
      <p>To clarify: reading research, good; readability research, bad.</p>
      <p>*The most conventional, template-friendly area of typography is the book. So it's it's no surprise that this is the area (continuous reading of immersive text) where scientific studies are considered to have the most relevance. However, how is that engaged by readability studies that use, for instance, the RSVP method?!</p>
