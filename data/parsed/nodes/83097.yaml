    html: <p>The modular scale is a system of ratios. You pick a key type size and the system generates a set of compatible sizes based on whichever ratio you pick. So in that slide, the key type size is 16pt. The modular scale shows two other sizes, 25.88 and 9.88 point, obtained by multiplying and dividing by the Golden Ratio, 1.618. Setting type at these sizes is said to be harmonious on the page/screen. For me there are so many variables (leading, line length, and of course the style of the font itself) that even with the modular scale you can still easily end up with a mess. A design eye is unavoidably crucial.</p>
