  html: |-
    <p>im looking for:<br>
    - a typeface for the logo<br>
    - a typeface for use in headlines and text (mostly letters, and business cards)</p>
    <p>it should be:<br>
    - classy, but still down to earth<br>
    - professional looking, but still with the freshness of youth<br>
    - a work-horse, but still elegant</p>
    <p>the client organizes events for middle and big businesses, and they are all around 25 years old. because of this, they want a identity that looks reliable, but still has the freshness of their age. that looks classy (because they will organize classy events) but should still look like they get their stuff done.</p>
    <p>any ideas? i thought of caecilia for the logo, i’d rather go with a sans serif or a slab serif than a normal serif for that task.</p>
    <p>THANKS!</p>
