    <p>Hello<br>
    I'm interested in finding more type designs like what I'm attaching, and I don't even know what term to search for. Divided? Stencil? What would you call these -- is it a category, where the letterform is segmented like this?<br>
    Also, do you know of other designs like these?<br>
    (For the record, this is Albers from P22 and a Louise Fili logo, handlettered, I assume.)<br>
    Thanks for any help you can offer.</p><div class="imageWrap"><img src="http://typophile.com/files/ecco_4189.jpg"></div><div class="imageWrap"><img src="http://typophile.com/files/albers_6601.gif"></div><p></p>
