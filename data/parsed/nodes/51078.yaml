      <p>Hey, Rob. I guess it's a bit difficult to come up with one term that encompasses this kind of type or lettering. If you go by historical style names, Alber's alphabet is a product of the Bauhaus, with Constructivist influences, while Fili's logo for the Ecco imprint has an Art Deco feel. But I wouldn't call both of these examples Art Deco, nor Constructivist.</p>
      <p>On MyFonts, P22 Albers is tagged with the following keywords: bauhaus, decorative, geometric, lined, poster, primnitive, and stencil.</p>
      <p>I can't think of anything more helpful, though! :-/</p>
