      <p>The Albers font was, IIRC, originally a plastic stencil, so the stencil category is quite applicable. You should be able to find more information in books on the Bauhaus, I know it’s also in either Meggs of Jubert.</p>
      <p>As for the Fili logo, I agree with Ricardo about it straddling genres, and it’s just one of those special cases without a name.</p>
