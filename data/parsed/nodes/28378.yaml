      <p>Stephan&gt; </p>
      <p>On our lovely pacific coast we use the term farm to mean a place where crops are grown and such.<br>
      In the hot n' muggy east they use the word farm to mean a place where horses are trained and cared for.</p>
      <p>So east coast = farm<br>
      West coast = ranch</p>
      <p>So I'm doing work a for equine ranch. My client has very romantic tastes. So that's why I chose Zapfino. And to be more precise- Zapfino Forte.<br>
      Some of the suggestions are pretty good but more would be nice....</p>
      <p>Mikey</p>
      <p>PS... I'm also doing work for another 'farm'- Saddle Ridge Farm.</p>
