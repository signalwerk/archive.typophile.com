  html: |-
    <p>Hey Folks,</p>
    <p>Maybe this is rudimentary, but it certainly has me stumped!</p>
    <p>I’ve got a much-loved font simply called DIN and it functions perfectly in Illus, but not Quark.  As soon as I upgraded my Q 6.1 to 6.5, documents with DIN Light open with errors in locating that font.</p>
    <p>I’ve tested the font in Illus with no problem.</p>
    <p>I tried reloading the font and that didn’t get me anywhere either.</p>
    <p>What gives?  I’m stumped.</p>
    <p>Thanks for any tips.</p>
    <p>.a</p>
