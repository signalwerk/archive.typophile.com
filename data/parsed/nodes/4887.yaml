  html: <p>So I've got about $500 to start a font collection with. I can't make up my mind between linotype essentials one or two. The main thing that leans me to essentials one is helvetica. Call me soulless but I really love that family. Anyone have thoughts on which set would be better?  <br> <br>are there any font collections that are similar?</p>
