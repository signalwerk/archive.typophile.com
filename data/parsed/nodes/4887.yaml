    html: <p>Get Bitstream's Type Odyessy instead. <br> <br>Their "Swiss" is a very good Helvetica, and you get a lot more stuff than on the Linotype CDs (and in a larger range of weights), plus a nice range of more recent stuff. <br> <br>Off the top of my head, versions of Futura and Franklin Gothic aren't included with Bitstream. If you need these, you may like to consider Linotype. I got both sets (LT and bitstream).</p>
