      <p>here are some information about this project:</p>
      <p>A government, ministries and authorities, an own history, news and events – a corporate design and corresponding websites. – Welt-Staat simulates a fictitious and virtual global state on the internet.<br>
      The story of Welt-Staat is narrated with the help of internet pages. It’s a non-linear story; the visitor can learn about the state in an individual way by clicking through several pages and wiki entries. </p>
      <p>Welt-Staat ist the diploma thesis of Alexander Brauch and Patrick Müller, Muthesius Academy of Fine Arts in Kiel. the two communication designers founded their own state and revived a structure of ministries and companies.</p>
