      <p>Talas (<a href="http://www.talasonline.com" title="http://www.talasonline.com">http://www.talasonline.com</a>) has some interesting kits, and with their impending move to Brooklyn, may well start discounting them -- they have almost everything else.</p>
      <p>I also recommend the first three books by Alisa Golden as good primers for beginning bookbinders: Graham beat me to the punch in suggesting The Bonefolder, although it does tend to be geared more towards "serious" bookbinding and book artists.</p>
      <p>(That being said, Peter actually published a picture of one of my books -- in Vol. 5, No. 1, which is the current issue -- and I don't think it's all that serious a book.)</p>
