      <p>I don't know of any home kits apart from various ring binder sets. What sort of binding are you thinking of? You can make a few simple home made tools and jigs to make binding easier. If you want to know what direction contemporary hand binding is going in check out The Bonefolder newsletters [a contemporary book binders sight with lots of info: <a href="http://www.philobiblon.com/bonefolder/index.html" title="http://www.philobiblon.com/bonefolder/index.html">http://www.philobiblon.com/bonefolder/index.html</a><br>
      Also look here for some ideas on simple and not so simple hand bound books: <a href="http://myhandboundbooks.blogspot.com" title="http://myhandboundbooks.blogspot.com">http://myhandboundbooks.blogspot.com</a><br>
      There are a number of very good, easy to follow books on home made bindings using readily found and made tools. If you can provide some more specific aims then I could recommend some books.</p>
