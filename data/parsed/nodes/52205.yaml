      <p>Jesse, I would recommend that if you are serious about case binding then forget about those 'paper craft' style of books you will find in most bookshops and look for the titles such as "The Thames and Hudson Manual of Bookbinding" by Arthur Johnson. This should still be available and it has been invaluable to me (I am a bookbinder). Another smaller &amp; cheaper book by Johnson is "The Practical Guide to Craft Bookbinding". Craft in this context refers to hand made books using traditional hand tools as opposed to the use of machines as in contemporary mass production. When I was in college we were tutored in hand tools and traditional binding first before commercial binding.<br>
      Both books offer clear easy to follow instructions with excellent illustrations. All tools are easy to get or make yourself. Another good book if you can get it is "Bookbinding as a Handcraft" by Manly Banister (Stirling publishing NY). This book uses B/W photos which are not always clear, however it does have instructions and diagrams for making your own tools including a home made nipping press.<br>
      The bookbinders bible in my day was "Bookbinding its background and technique" by Edith Diehl in two volumes, but also available in a paper back single volume. But for those just starting I would suggest the Johnson books.</p>
