    html: <p>Well, you're right, it is very similar to choosing a character and nursing an obsession with it.  It might be crazy, and the more I think about it, the more I realize that I might like it better if I make several variations on the character completely unrelated to any existing typeface.  Perhaps a simple statement to the EU. <br>Thanks for your input, I'm fond of your work.</p>
