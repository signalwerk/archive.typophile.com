    html: <p>Given that the overwhelming majority of fonts have already been retrofitted with the euro symbol, what's the point of the project? Just trying to understand. It's kind of like deciding to do your own letter "a" for a bunch of different fonts. <br> <br>Legally, if you did it from scratch and didn't use outlines from the original font, there presumably would only be issues for fonts whose abstract design is protected, and maybe not even then. But it's something that I'd consult a lawyer about, or not do at all. <br> <br>Ethically, since the symbols aren't much use without the original font, I don't see a major problem. Though there is also the issue of respect for the original work, kind of like when modifying a font for a client's internal use. <br> <br>As for the EU and the design, they have no interest in maintaining the "general design," but rather maintain the EXACT design. But they treat it like a logo, in that it can only look exactly one way. The people who specified it clearly had no concept of how a currency symbol is used, so type designers just ignore them. <br> <br>Regards, <br> <br>T</p>
