    html: <p>Oh, another thing... <br>Does anyone know how serious the EU is when it comes to maintaining the general design?  If so, any ideas as to how I can obtain those standards?  (Can't find it on the EU site.)  Anyway, I want to stress that my idea is in no way meant to step on the feet or rights of other designers--its really just a collection of Euro variations, not necessarily belonging to any one typeface (just compatible with some others).  Thanks everyone.</p>
