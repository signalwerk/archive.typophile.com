  html: <p>I know that various type designers have now added the Euro sign to their typefaces that existed before the advent of said symbol (Times New Roman, Courier and Arial, to name a few).  But--in your esteemed opinions--what is the legal/moral implication of designing a "typeface" that is a collection of various interpretations of the Euro symbol in 30 or so prominent existing typefaces?  The idea would be to design the symbol in keeping with the general aesthetic rules of each typeface (regardless of whether the original designer has revamped the typeface to include the symbol or not--all's fair in love, war and new symbols, right?)  Of course I'd throw in a few unique designs (that don't fit with any existing typefaces).  Just a little project I'd like to start working on, and I thought I'd turn to you all for some feedback.</p>
