    html: <p>Dear A.  <br> <br>I'm with Tom, I don't think making a symbol font would be a very good idea, getting permission from the various designers and vendors would be time-consuming and some would probably not give you the okay.  <br> <br>Making a coffee-table book, or a Web site that uses images or a Flash movie might be more interesting.  <br> <br>As for the EU we occasionally get communication from EU workers (I wouldn't classify them as EU officials necessarily) asking why we don't include the official euro in our fonts - I usually respond with more questions - are you willing to have your documents reflow if we match the official width, or should we shrink the symbol down and center it? What do we do about bold or italic? What do we do with decorative fonts? etc., So far I've not received a reply to any of these questions. <br> <br>Cheers, Si <br>Microsoft typography   <br></p>
