      <p>Well, now I'm in the same boat. I have been looking for this every way I could think of to categorize it. The closest fonts i found were <a class="freelinking external" href="http://new.myfonts.com/fonts/letraset/quixley/" rel="nofollow">Quixley</a> and <a class="freelinking external" href="http://new.myfonts.com/fonts/fw-alias/jackdaw/" rel="nofollow">Jackdaw</a>, but neither of them is especially close. (In case you cared about 'Santa Fe' that is Ray Larabie's <a class="freelinking external" href="http://new.myfonts.com/fonts/larabie/deftone/" rel="nofollow">Deftone</a>, with some grungifying).</p>
      <p>Because this has the look of a freebie, I spent a lot of time first at Dafont looking for categories I thought would cover the style, but I couldn't find it. Partly, this is maddening because I think it looks familiar. </p>
      <p>Maybe this post will prompt someone else to get aboard? </p>
      <p>- Mike Yanega</p>
