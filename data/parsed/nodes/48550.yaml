      <p>The page graphic is nice - evokes, suitably, both a big book (bible) and a bird (dove) and it's worked in well to the letter design (taking over for the middle stroke of the a, tangenting into the bowl of the first b. But I think there's a danger that the word will look like it's struck-through (even more so at smaller sizes or from farther away).</p>
      <p>If you moved the graphic below the wordmark, you would avoid this reading. And that might fit well with the "building on the word" tagline you mentioned. But, as I said, there's things I like about where it is, too, so I'm not sure...</p>
