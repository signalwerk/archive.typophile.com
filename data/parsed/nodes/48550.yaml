      <p>As William Berkson noted, there are two kinds of Bible typefaces. Recently, I've been looking for information on the type used to achieve legibility for the small printing required to allow so large a Book to be published in an affordable single volume.</p>
      <p>I have now found one deserving of a new post, and not wishing to double-post, I've gone to this old thread...</p>
      <p>It turns out that the face Cushing Old Style, here shown from the ATF specimen for 1900,</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/cos_atf_5698.jpg"></div><p></p>
      <p>also has the descending J which led me to link the Mediaeval-Egyptienne of the Bauer type foundry with the Petit Mediaeval Clarendon used in the Cambridge Cameo Bible and other Bibles from them.</p>
      <p>That face was also 25J from Lanston Monotype</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/25j_cos_lmon_4646.jpg"></div><p></p>
      <p>and it originated at the Central Type Foundry shortly before it joined ATF.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/cos_ctf_6466.jpg"></div><p></p>
