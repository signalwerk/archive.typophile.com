      <p>There are two kinds of Bible faces, at least, one kind is for personal bibles, which tend to be high x-height, wide, low contrast for getting legibility while stuffing a lot of words on a page. </p>
      <p>The famous gorgeous bibles tend to be large, lectern things, which have very different demands, and can have small x-height. </p>
      <p>Since you are going here for 'flavor', probably that is more important than whether the face has actually been used for a bible.</p>
