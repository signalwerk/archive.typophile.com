      <p><cite>ITC Cushing is low contrast. I wonder if the old Cushing Monotone was even lower contrast?</cite></p>
      <p>Well, <em>that</em> question is not difficult to answer, given that the relevant specimen books are available on the Web:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/cush_m_atf1900_6076.jpg"></div><p></p>
      <p>It is also low contrast, but not no contrast. Unlike Lining Cushing No. 2:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/lincush2_atf1912_4275.jpg"></div><p></p>
      <p>What struck me as odd is that ITC Cushing is more condensed than Cushing Old Style, as shown above. However, the version shown in the 1912 ATF specimen book is about the same - but that may not mean the face was changed, just that I'm looking at larger point sizes, which are easier to use as masters:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/co2_atf1912_4170.jpg"></div><p></p>
      <p>This is Cushing Oldstyle No. 2, in the 42 point size.</p>
