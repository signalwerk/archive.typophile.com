    html: |-
      <p>Florian, that is a stupendous example.</p>
      <p>Dan, Jenson is a very good idea, but the only Bibles I know of printed in a related typeface are the famous Oxford Lectern Bible of 1935, which is printed in a special 22 pt cut of Centaur called I think Bible Centaur, and the famous Doves Bible. </p>
      <p>Regarding the Doves Bible, it was said</p>
      <p>'"The noblest book to look at that was ever printed. The openings of the Books are admirably contrived with a woodcut initial in red; but the want of chapters and verses limits the use of the edition and the lines are really too long"</p>
      <p> Comments on The Doves Bible taken from: P.J.W, Kilpatrick, ed. Catalogue of the Edward Clark Library, Edinburgh, Napier College of Commerce and Technology, 1976., p.233'</p>
      <p>There is a most interesting digital reconstruction of the first page here:</p>
      <p><a href="http://home.swipnet.se/~w-10011/Tobbe/large/dove.pdf" title="http://home.swipnet.se/~w-10011/Tobbe/large/dove.pdf">http://home.swipnet.se/~w-10011/Tobbe/large/dove.pdf</a></p>
      <p>I can't imagine why the lettering at the top is so uneven -- it was not so in the original printing.</p>
      <p>The Doves Type reconstruction from Ohlsson seems to be difficult to get ahold of -- I have an unreleased version of my own.</p>
      <p>Of easily available types, you could try Monotype Centaur, which is easy to find as it comes bundled with Microsoft Office. A similar type with considerably more flexibility but with some annoying showy quirks is Adobe Jenson MM, which is no longer sold but which should be findable. Somewhat less flexible but still worth a good look is the current Adobe opentype version.</p>
      <p>To give an impression of age, you may want to look at a somewhat distressed type. A fabulous example of subtle distressing is Matthew Carter's revival of Monticello. That is very typical of American 18 and 19th century printing -- somewhere along the line a Bible must have been set in it. </p>
      <p>Another fabulous type showing deliberate distress quirks is Monotype Bell, which is also included with Microsoft Office. I believe that Bell has been used historically to set both Bibles and Books of Common Prayer. </p>
      <p>That's just a start! </p>
      <p>Oh - - lest I forget - - there is yet another modern Jenson interpretation included with Microsoft Office that is well worth looking at -- the rather heavy Font Bureau font High Tower. This leans more closely to Doves than to Centaur and is just superb. </p>
      <p>The nice thing about so many of these types is that you most likely already have them. </p>
      <p>If you are interested in blackletter, the Scangraphic font by Volker Küster 'Lutherisches Fraktur' is well worth a look, and the famous type historian James Mosley has a version that is astonishingly readable. There are many other fabulous blackletter designs, including some 20th century designs that are relatively easy to read. </p>
      <p>Have a look at some of these suggestions and let us know if they seem at all what you are looking for. There are many, many other possibilities. There have been so many countless settings of the Bible . . . . .</p>
