      <p>Thanks for the further info. I can definitely see the difference.<br>
      As for point sizes, I do know that the ATF of that era was a pioneer in adjusting font contours so that at small point sizes the letters had less contrast and perhaps were wider. ATF did not merely scale the font, unlike much of the first generation of digital fonts, which as a result of optical scaling, are very poor for book size use. I recall reading some articles on this, but I can't recall where.<br>
      Don</p>
