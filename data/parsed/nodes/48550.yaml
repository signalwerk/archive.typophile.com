      <p>Jenson and relatives seem a bit wrong to me, inasmuch as it was originally designed for (and inspired by handwritten) <em>secular</em> texts. As I understand it, those humanist letterforms were closely associated with Classical literature, while bibles and the like retained the blackletter form for quite a long while. </p>
      <p>Of course, as noted above, that eventually changed, so if you're looking for something besides blackletter, you may simply need to alter the date of your historical inspiration to suit your aesthetics! ;-)</p>
