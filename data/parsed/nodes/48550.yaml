      <div class="comment-spam-body"><p>I find it difficult to decide what is what for the old Cushings and the digital ITC Cushing. Here is what Adobe has to say about ITC Cushing:<br>
      ---start quote---<br>
      In 1897, J. Stearns Cushing designed a typeface called Cushing No. 2 for American Type Founders. Frederic W. Goudy added the italic in 1904, and ATF released a variety of other loosely related faces bearing the Cushing name. International Typeface Corporation licensed the typefaces from ATF, and designer Vincent Pacella redrew the typefaces into a consistent family. ITC Cushing, released in 1982, has a fairly large x-height and linear serifs that are a revision of the original sloping serifs. It has four weights plus matching italics.<br>
      ---end quote---<br>
      ITC Cushing is low contrast. I wonder if the old Cushing Monotone was even lower contrast?<br>
      Don</p>
      </div>
