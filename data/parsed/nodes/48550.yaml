    html: |-
      <p>Indeed, saying "the ATF of that era was a pioneer in adjusting font contours" is misleading because before the ATF's pantograph all sizes were cut individually anyway! ATF did implement something called "cutting slips" that "algorithmically" optimized the pantographic cutting from the large masters in order to optimize for size, but eventually largely stopped bothering with size-specific optimization, to cut costs.</p>
      <p>hhp</p>
