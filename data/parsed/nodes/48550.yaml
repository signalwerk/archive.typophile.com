    html: |-
      <p>Interesting.</p>
      <p>I remember reading in various general references on the history of type that ATF did make faces wider and bolder in smaller sizes.</p>
      <p>I have personally deduced, from looking at the ATF specimen book, and from information in the classic book Typographic Printing-Surfaces (Legros) that ATF would have had to make tiny adjustment to the width of letters in each point size in any case, as they made all their types in integral multiples of 1/4 point in width in order to facilitate justification.</p>
      <p>However, this did not lead me to conclude that ATF was a pioneer in making these adjustments. Linn Boyd Benton pioneered in using the pantograph, and made those adjustments from the beginning in his use of the pantograph. But, as another Typophile thread noted in a quotation from a French-language reference, smaller=wider (and, thus, I presume also bolder) was true during the pre-pantograph era of actually cutting punches as well.</p>
