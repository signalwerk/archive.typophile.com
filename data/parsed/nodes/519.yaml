    html: <p>david <br> <br>I had completely forgotten about this, and did not at first understand that yours was the initiating post here. Last year I had published an article on "digital type with an affinity for letterpress" for _Parenthesis_ that included a review of Founder's Caslon and dfTYPE's Rialto. In that I state that the Adobe Caslon was based on Caslon foundry specimens sheets from 1738 and 1786. This information would have come from an earlier review I did on the initial Adobe Originals releases. Carter's Big Caslon was based on titling sizes that appeared in the famous broadsheet specimen of 1734. The metal typeface, Lanston Monotype Caslon Oldstyle 337 is considered the "closed rendition" to the [American] Laurence J Johnson Caslon (1859), which was derived from "borrowed Caslon foundry punches," and which marked the beginning of the American Caslon revival. This was inspired by the British revival of Caslon in 1844 through its use in Chiswick Press books. Caslon had fallen out of popularity by the nineteenth century. The Caslon specimen book of 1805 does not show the Old Style typeface. <br> <br>Gerald Lange</p>
