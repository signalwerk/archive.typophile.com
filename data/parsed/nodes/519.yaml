    html: <p>John, <br> <br>What kind of camera equipment are you using? I am using a 4 x 5 sheet film camera. You may remember Lanston used to have a copy camera and darkroom in the loft. But this 4 x 5 camera seems to do the trick. I am just wondering if you have ever used one with high contrast film? <br> <br>Our Caslon 437 was based on a Caslon model previous to the Caslon Foundry refit in 1924. <br> <br>About Adobe's Caslon however I have new recollections. I recall Sumner Stone mentioning Adobe looked at all pt sizes choosing not to base theirs on any specific size. I may remember wrong. <br> <br>Do you know anything about that?  <br> <br>Gerald Giampa</p>
