    date: 2003-07-06T11:41:00
    date_raw: 6 Jul 2003 — 11:41am
    votes: null
    html: <p>I wonder if it was just in fashion to over-ink "all types" in England and not just Caslon. <br> <br>I hired an Englishman, generally a good pressman but I was never happy at the quantity of ink. It's not that I am cheap, black does not cost much and it goes far. But many pressman overink. Scott Fruetel formerly of Spring Valley Press was a superb Monotype Keyboard operator and pressman.  Friend of Clifford Burke, had another characteristic which was "almost" as bad. <br> <br>He would "underink". His type was sharp but the printing looked like it was through a washer. So there are many opinions. <br> <br>My personal taste is well known. I leaned towards the qualities of Font le Roy. He was John Henry Nash's pressman. <br> <br>But that point I am tired of labouring. One nice thing about the typophiles is their liking for diversity of opinions and the appreciation for humour. Not to mention the ongoing quest for knowledge. <br> <br>In any event, I have earned my opinions. <br> <br>Don't you think. <br> <br>By the way I tried to see you many times when I was in Vancouver in the fall, I was disappointed not to find you. I would like to attend ATPi this year in Vancouver but I am doing a speaking tour in Europe on the "National Hand of Finland" and some on printers fleurons. I would like to run this National Hand of Finland by you but this is not the topics heading so maybe I should just summarize it and e-mail it to you. This is a transitional face I have followed in early stone cuttings. <br> <br>But I do look forward to anything you have on Caslon as reading and resource material in Finland is scarce, especially in English. <br> <br>  <br> <br>Gerald Giampa <br></p>
    html_clean: <p>I wonder if it was just in fashion to over-ink "all types" in England and not just Caslon. <br> <br>I hired an Englishman, generally a good pressman but I was never happy at the quantity of ink. It's not that I am cheap, black does not cost much and it goes far. But many pressman overink. Scott Fruetel formerly of Spring Valley Press was a superb Monotype Keyboard operator and pressman.  Friend of Clifford Burke, had another characteristic which was "almost" as bad. <br> <br>He would "underink". His type was sharp but the printing looked like it was through a washer. So there are many opinions. <br> <br>My personal taste is well known. I leaned towards the qualities of Font le Roy. He was John Henry Nash's pressman. <br> <br>But that point I am tired of labouring. One nice thing about the typophiles is their liking for diversity of opinions and the appreciation for humour. Not to mention the ongoing quest for knowledge. <br> <br>In any event, I have earned my opinions. <br> <br>Don't you think. <br> <br>By the way I tried to see you many times when I was in Vancouver in the fall, I was disappointed not to find you. I would like to attend ATPi this year in Vancouver but I am doing a speaking tour in Europe on the "National Hand of Finland" and some on printers fleurons. I would like to run this National Hand of Finland by you but this is not the topics heading so maybe I should just summarize it and e-mail it to you. This is a transitional face I have followed in early stone cuttings. <br> <br>But I do look forward to anything you have on Caslon as reading and resource material in Finland is scarce, especially in English. <br> <br>  <br> <br>Gerald Giampa <br></p>
