    html: <p>The fashion in 'fine' printing in Britain in the late 19th and early 20th centuries was heavily influenced by Morris and St John Hornby, of course, who both favoured blackletter and what might be called the Italian black roman, derived from the Schweynheym &amp; Pannartz types. Heavy black type driven deeply into heavy rag paper was the style of the day, and probably made a lasting impression (sorry for the pun) on generations of British printers, even when they were using types not intended for this kind of treatment. <br> <br>Sorry I missed you in Vancouver, Gerald. I was in Rome and Britain in the autumn. The National Hand of Finland sounds very interesting.</p>
