    date_raw: 6 Jul 2003 — 10:38am
    votes: null
    html: <p>I'm using a digital camera, a Nikon 930 with a built in macro lense. Using the macro lense, I can pretty much fill the frame with a couple of 14pt punches, which is pretty good for a relatively inexpensive and portable camera. <br> <br>Regarding Adobe Caslon, I believe you are correct in characterising it as a kind of amalgamation of details from many different sizes of the metal type. The was Adobe's approach at that time and is also seen in their Garamond. Later they got into optical sizing, but using interpolation, which is very different from approaching each size as an individual design.</p>
