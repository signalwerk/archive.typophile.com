    html: "<p>&gt;&gt; Thinking that personal preference should be the main guide is anathema to craft. <br> <br>Yes, and I myself prefer letterform fidelity over solid bodies (even if it means lower readability). This is because I design type myself, and appreciate the letterforms for their own sake in a way that the layman doesn't (and shouldn't have to). I also prefer darkish letterforms, but on the type design side, not the printing side: the latter is counter to my fidelity preference. <br> <br>But the point is that what I prefer is moot. When I create/print a piece, it is targeted at a certain demographic (and that's never me). Otherwise it's selfish art. <br> <br>That's not to say one can exclude personal preferences from anything one does - that's not possible. The key thing in <i>craft</i> is to let such preferences manifest naturally, in the context of the communicative requirements of the piece. When you frame and celebrate your preferences, it is less craft. <br> <br>&gt; ink spread enhances <br> <br>I was avoiding explicitly refuting this (and your other distortions), because I didn't (and still don't) think it will stop you from twisting people's words (and \"awards\") in order to feed your psychological coping mechanism with respect to your dying past. But since people reading this don't necessarily have the benefit of reading the source thread (which for some reason you keep avoiding, hijacking this one instead): <br>1) I don't think ink spread enhances type, in the same way that I don't think a fender-bender enhances driving. But their <i>existence</i> means that traps and seatbelts are useful. <br>2) I think optical scaling is an extremely valuable technique, that was undermined by the pantograph, and that most foundries (including Lanston) do not properly address. But I don't think you have the analytical mettle to be useful to me. <br> <br>&gt; Also we have already agreed about the ink spread matter. Remember. <br> <br>I don't remember any such thing, but I'm glad to hear that you've now changed your mind 180 degrees. <br> <br>hhp <br></p>"
