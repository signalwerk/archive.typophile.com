    html: <p>What I should have said in my first posting is that each of these versions of Caslon - my own, Gerald's, Adobe's - can have a place in the designer's toolkit. I've frequently suggested people take a look at 337, or at Big Caslon, all depending on what they want to do. Founder's Caslon's fine for those who have a need for a real eighteenth-century type, but wouldn't be the right choice for office documents. </p>
