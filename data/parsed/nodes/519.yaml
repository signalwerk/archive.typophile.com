    votes: null
    html: "<p>I've never understood why, economic considerations apart, the digital font makers have generally chosen to revive earlier adaptations rather than going back to source. Lanston's so-called authentic Caslon, for instance, is an authentic rendering *not* of the types cut by William Caslon I and his son, but of Lanston Monotype's twentieth-century rendering -- of types probably supplied not by Caslon &amp; Co, but by an American foundry which had, in the mid-nineteenth century, acquired strikes of variable authenticity to the original designs. What's authentic about that? My recollection of the Caslon Challenge, incidentally, is that it involved comparison between (1) Lanston's digital cutting, and (2) Lanston's original cutting. It wasn't a comparison of Lanston's digital, and Caslon's original - perhaps Gerald Giampa could clarify? <br> <br>Why revive a twentieth-century interpretation, influenced by the aesthetic of the 1920s, rather than go back to the original and start over? Going back to the original you can either create an interpretation for our own time (as Twombly has done, using ) or else attempt a facsimile (as in my own Founder's Caslon. I don't, for instance, see that it's really legitimate to use a digital version of Centaur, when there's an opportunity to go back to Bruce Rogers' source material, and improve on his rendering. If we need type revivals (I'm not saying that we do) let's revive types that were true to their own time. <br> <br>Adobe brought out a small publication in 1990, titled _Adobe Caslon_ (California, Adobe Systems Incorporated, 1990), in which it's clear that Adobe Caslon, designed by Carol Twombly for use in sizes ranging from 6 to 14pt, was based on photographic enlargements of the 9, 10, 11, 12 and 14 pt designs shown in Jones 1924. Twombly `found that the proportions of x-height to capital height and ascender and descender length varied only slightly from size to size within this text range. She made careful sketches of every letter at each size, and after this thorough examination of the types, made rough drawings for one master design that incorporated common elements from the five original text sizes. The letterforms were drawn at a weight between the extremes of the sharp metal impressions observed under the microscope, and the overweight, amorphous shapes of the enlarged letters.' The Caslon Ornaments were adapted for Adobe by Wesley Tanner. <br> <br>The st ligature, which someone's asked about, was never offered by the Caslon foundry. In the eighteenth century, until at least the 1780s, use of the long s was all but mandatory in most English printing (there are a few interesting exceptions), which meant that the ligature offered by Caslon was longs-t. I'm not sure who first added one to a version of Caslon, however: I've a vague memory of seeing something in a book printed by Field and Tuer in the 1880s, but a more likely culprit would be ATF, who added some luxuriantly nasty swash characters to their fonts of Caslon - some of which were taken over by Lanston, Adobe, et al. I'm rather ashamed of the fact that I included short st in my Founder's Caslon, though it does come with a health warning in the documentation. <br> <br>I'm writing, I should say, without access to most of the books I'd usually refer to, and realise that I may have confused details of the American Caslons. <br> <br>Justin Howes</p>"
