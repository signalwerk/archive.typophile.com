    date_raw: 5 Jul 2003 — 1:33pm
    votes: null
    html: <p>I think there is more weight in Hudson's posting, but I can't be sure. Hudson's sample is scanned, and is what I believe what they call  aliased - it has half-tone pixels around it. I think he said it was 14 point, but to match it on screen I had to type 60 point Adobe Caslon. So with all this scaling, I don't have the technical know-how to say how the originals would compare. But in my test, yes, John Hudson's sample of the 1924 Caslon in general seemed to have more weight, but it wasn't consistent.  <br> <br>John Hudson's 1924 sample is significantly different from my sample of Linotype Caslon Old Face, and from the printed sample I have of metal Caslon 337, which I am assuming your digital version matches. I am pretty sure it is more regularized than the Linotype or your version - or, I suspect, the work of old William himself.  </p>
