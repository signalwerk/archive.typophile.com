  - id: 3732
    user: 1262
    date: 2003-07-06T10:44:00
    date_raw: 6 Jul 2003 — 10:44am
    votes: null
    html: <p>Looking again at the relatively heavy impression in the 1924 specimen, I'm reminded that the revival of interest and usage of Caslon Old Face in Britain was initiated, in the late 19th century, by the Chiswick Press. I used to have a copy of a Chiswick Press edition of <i>The Golden •••</i>, and the printing was very heavy. They used a large size of Caslon, possibly 18pt but certainly no smaller than 14pt, and a <i>very</i> black ink. This may have contributed to a fashion for over-inking Caslon in Britain to make it look heavier.</p>
    html_clean: <p>Looking again at the relatively heavy impression in the 1924 specimen, I'm reminded that the revival of interest and usage of Caslon Old Face in Britain was initiated, in the late 19th century, by the Chiswick Press. I used to have a copy of a Chiswick Press edition of <i>The Golden •••</i>, and the printing was very heavy. They used a large size of Caslon, possibly 18pt but certainly no smaller than 14pt, and a <i>very</i> black ink. This may have contributed to a fashion for over-inking Caslon in Britain to make it look heavier.</p>
