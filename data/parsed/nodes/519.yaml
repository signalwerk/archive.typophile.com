    html: <p>It's quite OK for a Caslon to lack bold - Caslon didn't have one, but instead printers used 'black letter'. &gt;From what I remember of it, Bitstream Caslon is one of the worst around. The descenders have been absurdly shortened, and the lining figures are another horror. Avoid it! Caslon _needs_ small caps, non-lining figures, ligatures, and sensitive handling. It's not worth spending time, as a typographer, with substandard fonts.</p>
