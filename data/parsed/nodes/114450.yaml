      <p>Nice summary, Jørgen. </p>
      <p>Grant, keep in mind that (like most trends) the organic/handwritten thing is just one of many and your experience will vary depending on region, design format, and field. Also, I feel like the popularity of analog/handmade things in general jumped maybe 4–5 years ago and has plateaued at a high level since then.</p>
