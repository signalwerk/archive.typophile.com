      <p>Chromatic and faceted/3D families of layerable fonts are also popular of late. Examples: <a href="http://typographica.org/typeface-reviews/detroit/?refby=typographica" rel="nofollow">Detroit</a>, <a href="http://typographica.org/typeface-reviews/valuco/?refby=typographica" rel="nofollow">VALUCO</a>, <a href="http://www.myfonts.com/fonts/latinotype/trend/?refby=typographica" rel="nofollow">Trend</a> (name intentional), <a href="http://www.myfonts.com/fonts/jurizaech/frontage/?refby=typographica" rel="nofollow">Frontage</a>, <a href="http://www.myfonts.com/fonts/matchandkerosene/prismatic/?refby=typographica" rel="nofollow">Prismatic</a>, <a href="http://www.myfonts.com/fonts/matchandkerosene/duotone/?refby=typographica" rel="nofollow">Duotone</a>, <a href="http://www.myfonts.com/fonts/ahmet-altun/festivo-letters/?refby=typographica" rel="nofollow">Festivo Letters</a>, and <a href="http://www.myfonts.com/fonts/parkinson/sutro-deluxe/?refby=typographica" rel="nofollow">Sutro Deluxe</a> which is currently the <a href="http://typographica.org" rel="nofollow">Typographica</a> nameplate typeface. </p>
