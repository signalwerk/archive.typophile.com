    html: <p>I’ve seen a clear increase in the use of old calligraphic and semi-calligraphic flare-serif typefaces, especially the late 30’s face <a class="freelinking external" href="http://en.wikipedia.org/wiki/Lydian_(typeface)" rel="nofollow">Lydian</a>, but also the likes of <a class="freelinking external" href="http://en.wikipedia.org/wiki/Albertus_(typeface)" rel="nofollow">Monotype Albertus</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/itc/tiepolo/" rel="nofollow">ITC Tiepolo</a> and 2013’s <a class="freelinking external" href="http://www.fontspring.com/fonts/fontsite/dragon" rel="nofollow">Dragon</a>. I’ve noticed these faces are often contrasted by popular contemporary geometric sans-serifs (amongst these, Lineto’s Circular seems to have become particularly popular). Just this week I’ve seen flare-faces used in <a class="freelinking external" href="http://nbhap.com/wordpress/wp-content/uploads//2014/02/Angel-Olsen-cover-2014.jpg" rel="nofollow">Angel Olsen’s new album cover</a> (Lydian) and a set of good concert posters by <a class="freelinking external" href="http://www.typographicposters.com/kees-bakker/" rel="nofollow">Kees Bakker</a> (Tiepolo).</p>
