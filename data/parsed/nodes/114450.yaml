      <blockquote><p>do you think these trends have a decent shelf life for branding, or do you feel like it's a more fleeting trend?</p></blockquote>
      <p>I think anything with a lot of personality is prone to be associated with its time, so the handwriting styles (in particular the ones you mention) are not likely to be considered “timeless” 20 years from now. But there are always retro revivals of what was once novel and new (the chromatic wood type stuff, for example). The best typefaces from any of these trends will certainly be a valid choice at any time if chosen wisely and used well.</p>
