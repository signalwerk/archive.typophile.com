    <p>With the fairly notable shift towards a more organic/handwritten style in typography of late, I was wondering what the general opinions on the style was. Specifically, what do you think of the success of fonts in the vein of Thirsty Rough or Voyage? </p>
    <p>As a purely digital designer, I'm glad to have elements like these to design with; but as fellow typophiles/designers, do you think these trends have a decent shelf life for branding, or do you feel like it's a more fleeting trend?</p>
