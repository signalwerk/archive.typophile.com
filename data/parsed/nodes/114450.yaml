      <p>&gt; do you think these trends have a decent shelf life for branding,<br>
      &gt; or do you feel like it's a more fleeting trend?</p>
      <p>In most cases you don't want to use a fleeting trend, but most companies update their logos and branding periodically to reflect current trends. For example, Pepsi has updated their logo 10 times.</p>
      <p>On the other hand, a fleeting trend might be totally appropriate for a company that needs to conform to current trends; such as a company that caters to the whims of teenagers. Obviously they don't want to change their logo every year, but other elements of branding can be revised frequently, especially if the branding is mostly online, which is easy to update as trends change.</p>
