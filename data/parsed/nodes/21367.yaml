    <p>I’m keen to persuade a client to license Whitney, but not owning it myself, i have only the pages at hoefler &amp; frere-jones to show her.</p>
    <p>I was wondering if anyone had examples of its use in print and signage that they would be happy to post up. Anything that demonstrates its versatility for both text and display, would be especially useful.</p>
    <p>Huge thanks in advance</p>
    <p>Ed</p>
