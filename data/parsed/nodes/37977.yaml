      <p>This is really excellent.  It's very modern and flowing and at the same time heavy and reminiscent of fonts from the '30s.</p>
      <p>I prefer the f,g,h, and m from the lighter, first version. The descender on the f and g convey a lot of personality, as do the chopped stems on h and m. I also prefer the a &amp; c in the heavier, second version.  I think the heavier weight works much better, so I'd say take the f,g,h, and m from the light version and make heavy variants of them. </p>
      <p>The k is fantastic, but it might be too radical to be readable. I'd like to see some text to see how distinguishable the k is from h, in context.  </p>
      <p>The s doesn't work, it's too curvy and the separated top makes it look like it's been misplaced from a disco typeface from the '70s. </p>
      <p>The x is going to be hard... take a cue from your k. And you should think about the s and the z at the same time.</p>
      <p>You may have two faces here; a more-readable text face and a more-radical headline or alternates face.  And whatever you do, it should be available in both weights. </p>
      <p>Keep working on this. I look forward to seeing a more complete version. :)</p>
