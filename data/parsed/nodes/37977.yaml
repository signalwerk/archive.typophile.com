      <p>I am glad the ideas seem helpful to you for the most part. </p>
      <p>The other thing that occurs to me is that you may want to offer alternative forms. The basic set might be more radical. And the alternatives could be a way of making a word more readable. Or the reverse. </p>
      <p>If you have just two versions you might put one kind in the lowercase &amp; the other in the upper. Or if you can make Opentype you could have 3 or more alternative forms that are selectable by the user. </p>
      <p>The other thing is that if you start to feel beaten on the z for instance don't forget that this is really really well trodden territory design-wise. Many many people have made faces like this! So you may want to go look at Bauhaus stuff, Weiner Werkstatte, and the various forms invented by designers and ravers from the 80's forward.</p>
      <p>see also </p>
      <p><a href="http://www.t26.com/fonts/style/Techno?page=4" title="http://www.t26.com/fonts/style/Techno?page=4">http://www.t26.com/fonts/style/Techno?page=4</a><br>
