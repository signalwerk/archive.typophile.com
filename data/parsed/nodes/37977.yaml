      <p>i like the notion. these chunky monostrokes are a fun reductive process, and this paticualr shape vocabulary has a real "means business" tone to it. reminds me of some early eighties faces.</p>
      <p>watch your horizontal strokes. they look markedly thicker than the verticals at the moment. nature of the beast; you'll have to actually make them thinner when you get a little further from your grid. when i'm doing faces like this, my general process is to do a first version which is strictly on the grid, then a second which "warms up" the forms with some optical correction -- things like narrowed horizontal strokes, narrowing of spaces where corners and diagonals meet.</p>
      <p>so, i think your s as it stands now is out of line with the rest of the face. it's the one piece which has any indication of a calligraphic strike -- i'm talking about the rounded terminals which indicate stroke direction. you should probably either do another version which carries that idea forward, but it'll probably be a challenge to do so without looking like something from the nineties.</p>
    html_clean: |-
