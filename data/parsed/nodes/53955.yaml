      <p>One scenario... You could use the font to create an identity for Halliburton or some other upstanding company, and providing you were not paid to create the identity (you could have them pay a friend, or donate the fee to charity), they could use it. </p>
      <p>Of course you would have to remain anonymous and not have your name associated with the work, otherwise you might "profit" from it indirectly given the positive PR around the logo.</p>
