    <p>This is from a font Web site:</p>
    <p>"Freeware fonts can be used commercially or non-commercially without acquiring copyright permission as long as you will not profit from the use of the font."</p>
    <p>Isn't that a contradictory statement? What would a commercial purpose that I *don't* profit from be?</p>
    <p>I've just started trying to freelance and when I need to get permission to use a font for a project is still a bit of a mystery to me, any help there would be appreciated.</p>
