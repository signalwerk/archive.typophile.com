  html: |-
    <p>From time to time I get complaints of Windows users about particular fonts »not being visible/usable in application«. It is obviously the case with fonts which have something special in their Style name, such as “Scriptive” instead of “Italics”, for instance.<br>
    I guess the problem is well-known. But I wonder what strategies might be chosen to circumvent this conundrum.<br>
    Any hints appreciated.</p>
