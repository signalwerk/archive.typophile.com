    date_raw: 23 Jun 2013 — 10:17pm
    votes: null
    html: <p>Don't put anything in the Style name other than Regular, Italic, Bold or Bold Italic (which should in turn correspond to the OS/2.fsSelection bit style setting). If you want to use some different style naming system, this should be employed in the OpenType preferred family and subfamily name fields.</p>
