    <p>An alternative to the title of <a href="/wiki/Bezier%20Monkey" class="freelinking" rel="nofollow">Bezier Monkey</a>, coined by <a href="/wiki/Paul%20Hunt" class="freelinking" rel="nofollow">Paul Hunt</a> to denote one who is involved in the process of dititizing, cleaning up, editing, extrapolating, or interpreting the typographic works of another <a href="/wiki/type%20designer" class="freelinking" rel="nofollow">type designer</a>.</p>
