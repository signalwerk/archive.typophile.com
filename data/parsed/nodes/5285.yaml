  - id: 38073
    user: 1262
    date: 2004-06-20T09:19:00
    date_raw: 20 Jun 2004 — 9:19am
    votes: null
    html: <p>The Stamperia Valdonega in Verona, now run my Giovanni Mardersteig's son, Martino, has its own digital version of Dante. This is really splendid, has a range of optical sizes, and is much superior to the Monotype version. Also, it is based on the foundry metal original, not Monotype's hot metal version. It is not available for license. <br> <br>The Monotype digital version is not a bad font -- it is better than many digital incarnations of metal types and has a reasonably good weight -- but is pales in comparison to the Stamperia Valdonega version.</p>
    html_clean: <p>The Stamperia Valdonega in Verona, now run my Giovanni Mardersteig's son, Martino, has its own digital version of Dante. This is really splendid, has a range of optical sizes, and is much superior to the Monotype version. Also, it is based on the foundry metal original, not Monotype's hot metal version. It is not available for license. <br> <br>The Monotype digital version is not a bad font -- it is better than many digital incarnations of metal types and has a reasonably good weight -- but is pales in comparison to the Stamperia Valdonega version.</p>
