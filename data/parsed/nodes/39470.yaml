    <p>Up here in <a href="/node/20585" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Sweden</a> at <a href="/node/add/wiki?edit%5Btitle%5D=Pangea%20design" title="Create node &quot;Pangea design&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Pangea design</a>, we are doing a massive ligature font. The goal is not to set the guiness world record in how many ligatures a font can have, but maybe we will automatically :)</p>
    <p>But we need to investigate the market.</p>
    <p>As per today we have 135 ligatures in a standard Latin 1 font.</p>
    <p>Anyone knows of a font that have more with the same encoding?</p>
    <p><img src="/sites/default/files/old-images/ligature_5295.png"></p>
