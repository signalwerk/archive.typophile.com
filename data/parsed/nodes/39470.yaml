      <p>Seeing this makes me wonder if we'll ever be able to do many -&gt; many subs in OpenType. </p>
      <p>eg:<br><code>sub t @u_accents by t.001 @u.002_accents</code></p>
      <p>Being able to do that would make all those accented ligatures redundant with the bonus of smaller font files and faster development.</p>
      <p>- David</p>
