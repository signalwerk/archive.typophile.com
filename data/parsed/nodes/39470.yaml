      <p>For comparison, a Devanagari font for classical Sanskrit could - in theory - comprise 40,358,340 ligatures, i.e. more than fourty million ligatures. However, for any language, there are tremendous phonetic restrictions, and therefore for Sanskrit, during my 2-year research, I could only find 800+ ligatures in attestable, quotable ancient Sanskrit texts.</p>
      <p>A Dutch mathematician made for me combinatorics calculations based on phonetic restrictions I supplied to him concerning Sanskrit, and he arrived at 1,896,777 phonetically possible Sanskrit ligatures, i.e. nearly two million ligatures. His mathematical calculations (in German language) are found here</p>
      <p><a href="http://www.sanskritweb.net/sansdocs/mathe.pdf">http://www.sanskritweb.net/sansdocs/mathe.pdf</a></p>
      <p>So, before answering your question "How many ligatures a font can have?" you will have to find an answer to the question: "How many phonetical combinations are possible for a given language or for the languages to be covered by the font?"</p>
