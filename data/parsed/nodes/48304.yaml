    html: |-
      <p>Yes, I want to obtain sharp fonts. More exactly: starting with fonts rendered using standard grayscale antialiasing methods (as for CTR monitors) I want to apply subpixel rendering to improve font sharpness. </p>
      <p>I understand that "font appearance" and "sharpness" are opposite due to limited screen resolution. It might be a matter of personal preference but I like reading sharp and crisp text rather than text that faithfully reproduces font shapes but is diffuse and has gray shadows instead of sharp stems, as it is produced by some current rendering methods.</p>
      <p>I start with fonts rendered at 2X dimension and then resize them at their final size using subpixel positioning; image 1) is the one that is modified (a 2x version actually).</p>
