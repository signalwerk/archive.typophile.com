      <p>#xf049; etc. are Private Use characters. They are best being avoided, because their meaning is not defined, so when the specific web font doesn’t load, they can’t be displayed in a fallback font.</p>
      <p>You had the correct codes in your first post, you should definitely continue to use these (#x23ee; ...)</p>
      <p>The FontFont UI Icons collection contains all these symbols, designed to work together, but the fonts are not free: <a href="https://www.fontfont.com/news/new-release-ff67" title="https://www.fontfont.com/news/new-release-ff67">https://www.fontfont.com/news/new-release-ff67</a> (scroll down to ‘New Release: FF UI Icons’).</p>
