      <p>I will admit it is not a perfect solution however I need a basis for the long term and it works best for the moment. I'm not sure how to do any of this in SVG and on other sites more relevant to that I received no response. Private characters, I agree, they can change. The article wasn't written by someone coming off as mature, much more opinion based. Seeing as I'm building my own platform and making certain completely-free fonts available one of my goals is (as with all things I work on) to improve performance and standards; <em>fontawesome.woff</em> is 64KB which is simply too much just for <em>just</em> media control characters. I'll try to learn to create a standalone woff file and assign the characters to the appropriate numeric ids; there aren't enough (at least that I see offhand) though it would improve upon the works-already resolution I've come to. Eventually I'd love to create my own fonts though such a goal beyond my immediate goal is quaternary at best.</p>
      <p>The most relevant thing I can ask at this point is how do I create a minimal font with these characters in FontForge? By default it doesn't allow more than 255 characters and excessive poking around hasn't helped me to figure out how to define any characters beyond the numeric id of 255 in FontForge.</p>
      <p>There will always be people who take it upon themselves to say, "No, don't do that." as if they have some sort of official standing that entitles them to dictate beyond having the freedom to share an opinion. If such people have a better idea that they are also willing to teach how to implement then great, otherwise they've just another naysayer and naysayers are just people that people such as myself ignore; there is always an answer even if it's not what you think it is.</p>
