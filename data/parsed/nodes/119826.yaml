    html: |-
      <p>BMP is going to give you access to the 65536 characters in "Plane 0", the Basic Multilingual Plane. Full will give you access to codepoints in all 16 planes, though I believe the total number of characters you can have in your font is still only 65536. The basic UI controls are all in the BMP, but if you ever want to expand upon that, there are some in Plane 1 too. I don't know of any reason not to go Full right away, except maybe that it's a bit easier to navigate the editor window when it has fewer character slots to scroll through.</p>
      <p>I only generate TTF and OTF, so I can't answer the question about WOFF.</p>
      <p>I do have an OFL font I'm working on that includes the UI characters you've mentioned, but it's not ready for release yet.</p>
