    html: |-
      <p>I'm not good enough at Python to script FontForge in that. It's just plain old FFscript. In any case, it gives an idea of what operations are needed to subset fontawesome: Load the font, make sure only the Unicode values in the array are selected, invert the selection (so they are the ones NOT selected), remove everything selected, save whatever remains as a WOFF file.</p>
      <p>OS? Nah, most folk here work on Macs or Windows boxes. Linux is a small minority; Fontlab <em>et al</em> are not Unix-native.</p>
