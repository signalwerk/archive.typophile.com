      <p>This script subsets fontawesome for me and saves the subset as WOFF:</p>
      <pre>#!/usr/local/bin/fontforge -lang=ff

      m = [61512, 61513, 61514, 61515, 61516, 61518, 61520, 61521]

      Open("fontawesome-webfont.ttf",1)
      SelectNone()
      i = 0
      j = SizeOf(m)
      while (i &lt; j)
        d = SelectMoreSingletonsIf(m[i])
        ++i
      endloop
      SelectInvert()
      Clear()
      Generate("fontawesome_subset.woff","woff",0)
      Close()
