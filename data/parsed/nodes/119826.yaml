  html: |-
    <p>Greetings,</p>
    <p>I'm working on updating my site's code from XHTML 1.1 to XHTML 5, part of that includes the music player. For years I've used an image for the media control characters though now since I'm doing the design update I want to make it easy for people who create themes to change the colors of the controls hence fonts and hence why I eventually wandered to these forums.</p>
    <p>Either one of two goals would work fine for me. First I've spent time browsing and searching through Unicode character sheets for existing characters with some success. Then after having little-to-no luck decided to mess around with the idea creating a font specific to media control characters, at least for now. I've downloaded and installed FontForge, created a new font and am having some difficulty determining how to create characters beyond #255 (in red at the top-left). If I go this route I don't want to use an existing font as I want to ensure what I create is purely free to use by others. Alternatively I'd be happy to use an existing purely free font.</p>
    <p>Here is an image of the media control characters I'm trying to find or at least create...</p>
    <p><img alt="Example Media Control Characters" src="http://i.stack.imgur.com/m90qr.png"></p>
    <p>Here are some of the characters I've found though don't seem to be well supported by any of the fonts I've tried...</p>
    <p><a href="http://fileformat.info/info/unicode/char/23ee" rel="nofollow">Previous Track</a></p>
    <p><a href="http://fileformat.info/info/unicode/char/23f5" rel="nofollow">Play Track</a></p>
    <p><a href="http://fileformat.info/info/unicode/char/23f8" rel="nofollow">Pause Track</a></p>
    <p><a href="http://fileformat.info/info/unicode/char/23f9" rel="nofollow">Stop Track</a></p>
    <p><a href="http://fileformat.info/info/unicode/char/23ef" rel="nofollow">Next Track</a></p>
    <p>For those having a look there are some inconsistencies between the characters (specifically previous and next track symbols).</p>
    <p>So what are my options? Are there any truly free TTF/WOFF fonts with support for these universal media control characters? If not how do I create these characters in a new font using FontForge or other open source or freeware software?</p>
