      <p>I've created fonts with thousands of characters in FontForge. I don't know why you're seeing it limited to only 255. Maybe it has to do with the encoding you are using. Try Encoding &gt; Reencode &gt; Unicode.</p>
      <p>Granted, the page I linked to was rantish. There are plenty of other pages that state the case in a better way, but the message is the same. If you are creating a nice "&gt;&gt;" glyph, why not put it in the common codepoint (u+23e9)? Using PUA just recreates the old early-1990s problem of using Symbol to type Greek characters - give the document to someone that doesn't have that font, and it looks like gibberish.</p>
