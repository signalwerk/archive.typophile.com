      <p>Agree with Jens. For a large number of the characters Font Awesome provides (e.g. euro, dollar, bank, chart, credit card, checkboxes, refresh, wheelchair...), there's no reason valid codepoints couldn't have been used! </p>
      <p>Furthermore, the approach that is being advocated by the FA site is that these icons are mere adornments meant to enhance the display. If the concept of "play", "pause", etc <em>is</em> your message, these should be conveyed in the content of your page, not in the stylesheet. Or as it has <a class="freelinking external" href="http://technotes.iangreenleaf.com/posts/font-awesome-not-awesome.html" rel="nofollow">already been said...</a></p>
