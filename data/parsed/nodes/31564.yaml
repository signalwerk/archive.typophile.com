  html: |-
    <p>I'm fairly certain this has been addressed elsewhere, so if some kind samaritan would point me to the post, I'd be perfectly satisfied. But tell me, what are the legalities/ethics of an homage typeface, such as this sample I threw together, affectionately termed <strong>Scratch Garamond</strong>.</p>
    <p></p><div class="imageWrap"><img src="https://web.archive.org/web/20150123084756im_/http://typophile.com/files/Scratch_5779.jpg"></div><p></p>
    <p>Would you consider that to be within the bounds of fair play, as a legitimate deconstruction/homage, or is it a blatant ripping off of a classic (or, worse yet, outright prosecutable theft)?</p>
