      <p>Did you derive this from an exisiting digital font, by loading into a font editor and adding the scratches? Did you trace it from a published specimen? Or did you draw it from, er scratch? Depending on your answer there maybe legal (EULA) and ethical issues, despite the fact that the design of the original "Garamond" metal types are in the public domain</p>
