    html: <p>The vector files should be included. I mean, do you really expect, that the client asks you, whenever he wants to lossless scale the logo? This would be almost extortion. Additionally the vector files may be needed for printing. You only should not add font files, that you have licensed. Alternatively you can transfer the license.</p>
