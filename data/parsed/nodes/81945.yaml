    html: <p>I'll add that it's probably a good idea to not only provide the "working" vector files (Illustrator, Photoshop or whatever) but also EPS (for high-end printing) and EMF (for use in MS Word applications) versions.  Maybe a big TIFF or PNG too.</p>
