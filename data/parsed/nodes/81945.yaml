    <p>Hi everyone,</p>
    <p>I was thinking about a few things and hopefully someone could help me out, i hope the question isn't too dumb :D.</p>
    <p>when someone of you makes a corporate identity for a business, museum, government,Academy...</p>
    <p>When the project is finished, what exactly is property of the client, especially when it comes to the Logo. I mean, do you give all files including vector files of the logo or do you "never" give the illustrator eps or ai file to the client? </p>
    <p>kind of like "if i do give the vector files they might never work with me again since they have all they need.</p>
    <p>Also what kind of formats for the logo need to be included when delivering the final product to the client (TIFF, JPEG...?)</p>
    <p>x</p>
