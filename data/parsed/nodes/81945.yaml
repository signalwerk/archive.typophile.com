    votes: null
    html: <p>Logos are frequently work-for-hire, which is a legal term that means the client buys the copyright from you, so that you literally no longer own your work. In this case, you would give all associated files to the client. If the work is not work-for-hire, I would definitely supply the work in vector format (assuming I wasn't also doing the associated branding and typography work), but not the source files (i.e., eps but not Illustrator).</p>
