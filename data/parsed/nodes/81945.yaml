    html: |-
      <p>Unless your contract with them states otherwise, they're entitled to the vector files along with any other files you made that they might reasonably need. (Working files, like a layered Photoshop file for example, normally wouldn't be given to a client unless they specifically requested it.)</p>
      <p>&gt; if i do give the vector files they might never work with<br>
      &gt; me again since they have all they need</p>
      <p>You get future work from them by 1) doing a great job on the identity project, and 2) making them aware of your capabilities to do other projects they might have (brochures, websites, or whatever).</p>
