    votes: null
    html: <p> Matthew Carter did some investigations into scale-proof lettering around 1970, essentially trying to see if it was possible to shore up a design against horizontal scaling. (I seem to recall that "Video" might have figured into the name of the design, but that doesn't sound quite right.) If I recall, Matthew (and Linotype) decided to scuttle the project, but there were some interesting proofs published in the Journal of Typographic Research. Squarish thing with a bit of contrast, somewhere on the Melior-Eurostile-Folio continent. </p>
    html_clean: <p> Matthew Carter did some investigations into scale-proof lettering around 1970, essentially trying to see if it was possible to shore up a design against horizontal scaling. (I seem to recall that "Video" might have figured into the name of the design, but that doesn't sound quite right.) If I recall, Matthew (and Linotype) decided to scuttle the project, but there were some interesting proofs published in the Journal of Typographic Research. Squarish thing with a bit of contrast, somewhere on the Melior-Eurostile-Folio continent. </p>
  - id: 6363
    user: 1250
    date: 2002-05-30T07:27:00
    date_raw: 30.May.2002 7.27am
    votes: null
    html: "<p> &gt; Squarish thing <br> <br>Interesting. And it implies that the intent was to combat distortions from horizontal compression, which is of course the most common way users torture type: gotta save that space! (Which makes me realize: maybe they should try using vertical compression for a change, at least when it's not a gotta-fit-it-on-this-one-line deal; especially since vertical savings always matters, whereas horizontal savings can come to naught when you hit a paragraph break, which is very common in a newspaper - a consideration Tracy has pointed out). <br> <br>So I guess the features of a font that help preserve its integrity/character when compressed are: <br>1. Good stroke contrast. <br>2. Vertical stress. <br>3. Squareness. <br>4. Slight darkness. <br> <br>hhp </p>"
    html_clean: "<p> &gt; Squarish thing <br> <br>Interesting. And it implies that the intent was to combat distortions from horizontal compression, which is of course the most common way users torture type: gotta save that space! (Which makes me realize: maybe they should try using vertical compression for a change, at least when it's not a gotta-fit-it-on-this-one-line deal; especially since vertical savings always matters, whereas horizontal savings can come to naught when you hit a paragraph break, which is very common in a newspaper - a consideration Tracy has pointed out). <br> <br>So I guess the features of a font that help preserve its integrity/character when compressed are: <br>1. Good stroke contrast. <br>2. Vertical stress. <br>3. Squareness. <br>4. Slight darkness. <br> <br>hhp </p>"
