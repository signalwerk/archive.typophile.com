    html: <p> OK, I guess you guys give up. <br> <br>So, you know how typophiles cringe when they see a monoline sans condensed to fit a measure and as a result acquire a highly uncomfortable horizontal stress (because the vertical stems become too thin)? Well, I was thinking, what about the other way around? With some horizontal expansion you would quickly make a monoline sans acquire contrast, and *that* would actually be usable. <br> <br>So what you're seeing is Futura Condensed, 150% wider! A nice surpise, huh? It seems to work out fine, even in the diagonals. Basically, a completely new style of letter in 2 seconds. The only real problem is characters with (necessarily) unconventional stress, like that clunky "s". But still. <br> <br>hhp </p>
    html_clean: <p> OK, I guess you guys give up. <br> <br>So, you know how typophiles cringe when they see a monoline sans condensed to fit a measure and as a result acquire a highly uncomfortable horizontal stress (because the vertical stems become too thin)? Well, I was thinking, what about the other way around? With some horizontal expansion you would quickly make a monoline sans acquire contrast, and *that* would actually be usable. <br> <br>So what you're seeing is Futura Condensed, 150% wider! A nice surpise, huh? It seems to work out fine, even in the diagonals. Basically, a completely new style of letter in 2 seconds. The only real problem is characters with (necessarily) unconventional stress, like that clunky "s". But still. <br> <br>hhp </p>
