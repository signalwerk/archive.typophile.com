    <p>I'm a student nearing graduation and was curious to where to get good quality paper to print my portfolio on.. price doesn't matter i'm willing to pay since this will be what i show to potential employers int he next 6 months and also in my portfolio review at school... also wondering if anyone knows of any good places to go for cases and cd jewel cases etc to put my work in.. want anything that is brushed aluminum so it goes with my whole brand (me) and my website/business card etc etc.. be nice if it had a window on the outside so i can put my design company logo on the outside..<br>
    thanks!<br>
    ---Sean</p>
