      <p>One thing I have to add is that jewel cases are not the least bit classy when it comes to having your portfolio on it. I believe in Arthur Miller's The Crucible, Reverend Hale proclaims "Design, sir, is a fortress; no crack in a fortress may be accounted small."<br>
      Jewel cases crack easily and very difficult to express yourself artistically. Instead I suggest using InDesign's CD case template and spending the time to make something of your own design. Then just print that out on matte paper and rubber cement it together. CD cover stickers are a bonus.</p>
