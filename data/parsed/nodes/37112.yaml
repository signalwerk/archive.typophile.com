    <p>I am testing a font from Juan Pablo De Gregorio to see if it works on mac (he’s on PC at the moment) and cannot get it to work properly. He has supplied me with three weights Bold, Regular and Light which shows up in Suitcase X1 as three different fontfiles with working preview. The problem arises when I try using them in InDesign and Illustrator CS3. The regular comes doesn’t show but comes in as an another light. So I get 2 lights and one bold but no regular. What can this be caused by? Is the problem in the building or export of the fontfile in FL or in the Adobe software interpretation of the fontfile?</p>
    <p>Anyone know?</p>
    <p>Juan Pablo informed me that he is using fontlab 5.</p>
