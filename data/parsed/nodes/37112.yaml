      <p>You probably have a naming issue.</p>
      <p>In FontLab, (with the font(s) open), choose “Font Info...” — there are a LOT of choices here, but the important ones are on the first screen: Family name, weight, width, style etc. Set these up for the weights you have, and then go thru the SEVERAL following screens (you can use the little arrow at the top to advance. FontLab is very good a “auto-filling” these (the little diamond icons) for you, but you have to set the initial values up right to begin with. If a auto-fill comes up weird, check your initial values and try again... you CAN override the auto fill, but you should consider using it as a “test”.</p>
      <p>For example: Yous set the family name to “Wacky”; then use the pop-up to set the weight to “Bold” (you can type anything here, but if you want to be consistent with the thousands of faces out there, use one of the pop-up values); tehn set the width to medium(normal). Now use the “Build Style Names” auto-fill to finish the other values, then click to the next screen and click “Build Opentype Names” and so on and so on.</p>
      <p>This should solve your menu problem.</p>
      <p>Note that you COULD be having problems with Illustrator/InDesign’s font menu cache as well. Find a copy of Font Finagler and clean out your “old” cache files to fix any lingering menu issues (I have ot run this every month or so to clean out phantom menu items).</p>
    html_clean: |-
