      <p>Norbert, once again your logic is very sound, and, again, it seems to work in practice. I'm glad, now, that I threw this out there as you've raised some important points about connecting the reader with an annonymous voice.</p>
      <p>John, I'd steered clear of bringing the two into conversation, but you're right about there being a dialogue going on here (perhaps that's why these two stuck with me last week). The voice(s) of a contemporary mind cynically seeking "wisdom"? Maybe. My goodness, am I exposing myself through this thread?</p>
      <p>Back to business: the interlacing of the two is a nice idea, and the tight leading adds a sense of tension, but the giant "STUPID" in the background feels a bit domineering and messy, despite it being camouflaged. I think the exchange between the two statements already makes the point presented in your design. And then there's the absent period at the end, and a whole lotta drop-shadowin' goin' on. But there's definitely something interesting going on there.</p>
      <p>Much gratitude to those who have given this a shot so far.</p>
