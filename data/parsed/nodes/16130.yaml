      <p>My idea was that each aphorism seems to require a very different approach (different type, different typography), and this made me curious about if it would be possible to serve both/each using the same type and the same typographic treatment. The obvious rookie approach would likely be to reach to Comic Sans for the first and some tacky script for the second, but attempting to use either of those styles for both aphorisms would clearly fail miserably. I suppose I was curious to see if anyone would take up the challenge, and if so what they might come up with.</p>
      <p>Norbert, your second line is of course relative. How much is "some creative typography"? A little is often a lot. As I mentioned, this is a very indulgent post, so I don't want to limit anything. (We already tend to impose all kinds of restraint on ourselves anyway.)</p>
      <p>The <a href="http://www.greenboathouse.com/" rel="nofollow">small press</a> I run had, for a while, a project on our website that we called "<a href="http://www.greenboathouse.com/variant/index.htm" rel="nofollow">Variant</a>." The idea was that we would find a quotation and post it on our website, then invite poets to write something exploring that quotation. From the submissions we would pick 5 that approached the passage in an interesting way and post those to the site, with a single submission being produced as a broadsheet which we distributed to all of those who submitted, as well as sending copies to our subscription list. What made this interesting was seeing how a wide variety of folks would interpret/interpolate the same quotation into very different poems. I suppose I was thinking along the same lines here in that I was curious to see how a range of typographers would approach two very different statements with the challenge being to use only one typeface to set both.</p>
