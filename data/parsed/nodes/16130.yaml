      <p>I have to admit that once again I agree with Hrant; that is, I don't see how this can really work, which is why I threw it out to see if anyone could prove me wrong. </p>
      <p>Norbert's take on this issue seems quite sound, both in theory and in his example. I'm not a fan of Lassigue Dmato, but it addresses the issues at play in this problem. I'd be curious to see it in Dear Sarah. That said, the more I look at Norbert's graphic the more each seems to work.</p>
      <p>I'd been imagining these aphorisms both as t-shirts, and as broadsheets, further complicating things insofar as the first doesn't "deserve" a broadsheet, nor does the latter "deserve" to be on a t-shirt. My thought was that only a relatively neutral type would allow all of these things at once: 2 very different messages produced on 2 very different mediums. That relatively neutral type, however, still needs a bit of personality to give each statement tone and character. Norbert's does just that.</p>
      <p>Hopefully a few others will take up the call as well.</p>
