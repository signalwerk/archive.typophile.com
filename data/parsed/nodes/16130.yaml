      <p>Absolutely Norbert, not discouraged at all; this has been entertaining and edifying, and humbling as well. There was something serious, or, let's say sincere in my attraction to both of the aphorisms, and in the play between the two which began to reveal itself through this process. Earnest and/or playful, which has been reflected back in the various approaches.</p>
      <p>And then suddenly I felt rather foolish as this exercise revealed a 16-year-old-school-girl. Ack! Wha? Really? Well, yeah, I suppose so. At first eliason's take set me off, but that's just ego. It was an effective rendering, which was, after all, the challenge. That personality had been there all along in the content, of course, and eliason just tapped into it. The grasping of the latter statement next to the arrogance/ignorance of the former. Pure 16-year-old.</p>
      <p>Not to get all dramatic &amp; squishy here, but this thread has been like a community coming together to explore an individual koan. Well, no, it <em>has</em> been a community coming together to explore an individual koan. It's great. Intriguing and suprising and faultering and humbling. And through typography? Go figure. Great stuff.</p>
      <p>ps. Ah, look, at least in my browser the above copy not only ends two lines with "community" but begins two lines with "coming together to explore an individual koan." A typesetter's nightmare!</p>
