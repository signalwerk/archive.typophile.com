    <p>This is pure indulgence, but over the past few days I've come across a couple of aphorisms that have both, for whatever reason, struck home. They couldn't be more different, and this got me thinking. Would it be possible to set both in the same face and still serve the spirit of each? So, a challenge of sorts. I'm curious to see what those with too much time on their hands might come up with to set the following:</p>
    <p>1<br>
    Y'know what your problem is?<br>
    You're stupid.</p>
    <p>2<br>
    How long will we continue to draw in our colouring books<br>
    an image of god that makes us sad.</p>
