      <p>I was getting a bit worried there for a minute as Norbert &amp; Chris started throwing chimps around, but some great developments here as the concept is further explored.</p>
      <p>The angle taken by James &amp; pushed further by André is coming back around to the conflict that drew my attention to these two statements in the first place, a sort of internal battle between the two. However, the proximity of the two aphorisms in André's has removed the "primary" dialogue (that is, two separate statements) and instead focused on the "supplementary" commentary (in white). That supplement is very powerful in the last incarnation, but a bit of lead between the two would retain the first level of distinction.</p>
