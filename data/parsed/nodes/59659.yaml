    <p>I'm making this number for my wife to celebrate our 8 years of being together. I'm trying to find a balance between it having a decorative character and still resemble an 8.</p>
    <p>The problem I'm having is that even though it's a two-story construction, I think I need to balance the lachrymal terminals on the upper and lower story. But I like weight. Also, think it looks like an "S" in that regard (that's a good thing).</p>
    <p>I've added a few simple ornaments to represent the 8 years we've been together; six unmarried, and two married.</p>
    <p>I've attached the progress along with the ornamented, latest version. I'm going with the inline version in the final piece but comments on either version are welcome.</p>
    <p>I'm asking for everyone's opinions and criticisms. This is only my second time making a custom character and I want to make it as "finished" as possible. I appreciate all the help. Thank you.</p>
