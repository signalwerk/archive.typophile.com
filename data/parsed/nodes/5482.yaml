  html: <p>Ok. I need to do this job for my university and i need some help. Skol is the biggest brazilian beer. It has 30% of market share which is 475million litters/year. This is their logo.  <br> <br><img src="http://www.typophile.com/forums/messages/29/39957.jpg" alt=""> <br> <br>Skol is considered, above everything, one of the coolest brazilian brands and its target is 18-24 years old. In my opinion this logo is a bit outdated, as far its positioning is concerned. So if you agree how could this brand get a new face? If you don't, how to make this logo look better? <br></p>
