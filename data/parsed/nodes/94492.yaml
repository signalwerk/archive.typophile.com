      <p>No guesses necessary. The font's name is<br>
      Pump<br>
      Different weights for different vendors; to me it looks like  Linotype Pump or URW's Pump Bold. Monotype has other weights, but their 'Demi Bold' is lighter than the 'plain' Linotype fonts.</p>
      <p> - Herb</p>
