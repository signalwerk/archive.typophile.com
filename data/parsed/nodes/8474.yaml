  html: <p>Hi, I've been browsing my entire font collection as well as many, many magazines looking for a great serif font for longer articles for a magazine. In the end I came across this one in GQ (British edition) and it really pleased me. However, I can't figure out which font it is? I tried Identifont.com, but no luck. Does anyone know which font it is?  <br> <br>I'd also like to hear other ideas for serif fonts, since I find that normally the focus is on the fonts used in headlines, captions, quotes etc and not these tiny fonts that actually holds the most text in any magazine. I've been using Egyptienne and Melior recently, but I'd like something a bit more 'round'.  <br> <br><img src="http://www.typophile.com/forums/messages/83/57154.jpg" alt="Font used in GQ"></p>
