    date: 2005-01-05T10:51:00
    date_raw: 5.Jan.2005 10.51am
    votes: null
    html: "<p>For more on Fenway check <a href=\"http://www.typophile.com/forums/messages/4100/32836.html?1082411942\" target=\"_blank\">here</a> and <a href=\"http://www.typophile.com/forums/messages/30/34062.html?1082669035\" target=\"_blank\">here</a>. I believe it is used by Businessweek, Mens Health, and SI among others. Mercury is used by many newspapers and some magazines, most prominently the US edition of Esquire (which is why I find it strange that GQ would also use it). It is not yet available to the general public, but H&amp;FJ staff tell me you can license it by special arrangement.  <br> <br>Here is a quote from J.Hoefler from an earlier typohile post: <br> <br>The font that Tobias and I did is called Mercury. The display face, which I designed, is used in Esquire; the text version, which Tobias designed, is used throughout the New Times newspaper chain, among other places. (There's also an adaptation of it used in Esquire, for their text.) It's very much a news face: some of its styles look lovely printed intaglio on coated stock, but it's really designed to work under less accomodating circumstances, such as New Times' web presses and highly absorbent stock. (\"Half a sheet will prove it.\") There's nothing online about Mercury right now, but I'll keep you posted. It's one of my favorite projects, largely because it was the first thing that Tobias and I both got into together, arms deep.  <br> <br>Matthew's 'large small caps' for Fenway were I think necessitated by the number of acronyms that appear in Sports Illustrated, many of which appear regularly in plurals where the final lowercase 's' would otherwise be indistinguishable from a small cap 's' of the same height. <br> <br>.</p>"
    html_clean: "<p>For more on Fenway check <a href=\"http://www.typophile.com/forums/messages/4100/32836.html?1082411942\" target=\"_blank\" class=\"link-lost\">here</a> and <a href=\"http://www.typophile.com/forums/messages/30/34062.html?1082669035\" target=\"_blank\" class=\"link-lost\">here</a>. I believe it is used by Businessweek, Mens Health, and SI among others. Mercury is used by many newspapers and some magazines, most prominently the US edition of Esquire (which is why I find it strange that GQ would also use it). It is not yet available to the general public, but H&amp;FJ staff tell me you can license it by special arrangement.  <br> <br>Here is a quote from J.Hoefler from an earlier typohile post: <br> <br>The font that Tobias and I did is called Mercury. The display face, which I designed, is used in Esquire; the text version, which Tobias designed, is used throughout the New Times newspaper chain, among other places. (There's also an adaptation of it used in Esquire, for their text.) It's very much a news face: some of its styles look lovely printed intaglio on coated stock, but it's really designed to work under less accomodating circumstances, such as New Times' web presses and highly absorbent stock. (\"Half a sheet will prove it.\") There's nothing online about Mercury right now, but I'll keep you posted. It's one of my favorite projects, largely because it was the first thing that Tobias and I both got into together, arms deep.  <br> <br>Matthew's 'large small caps' for Fenway were I think necessitated by the number of acronyms that appear in Sports Illustrated, many of which appear regularly in plurals where the final lowercase 's' would otherwise be indistinguishable from a small cap 's' of the same height. <br> <br>.</p>"
