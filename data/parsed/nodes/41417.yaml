    <p></p><div class="imageWrap"><img src="/web/20080705152319im_/http://www.typophile.com/files/open_coffee_3868.jpg"></div><p></p>
    <p>Hey guys,</p>
    <p>Need help with this one. I think im on to something here. The client is a little latte wagon that runs on electricity. Like a little moped/car that has a latte machine in the back... a very kool little thing. The client did not have a proper name for it yet. But i like the name OPEN COFFEE. The client said something like COFFEE 2 GO. But it was a bit too obvious I think. I  dont want any clichés like the coffee mug etc or beans (for the symbol). Need more outside of the box than that i think. Its a very kool little coffe-car. </p>
    <p>But i mostly need help with a SYMBOL. And no i dont want a vector image of the actuall car itself.</p>
    <p>Thanks!   </p>
    <p>daniel</p>
