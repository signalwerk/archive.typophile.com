      <p>I just love the clipped, concise nature of the serifs... That G rocks, and the lack of any serifs at the apex of the A... For someone who has been addicted to Sans for so long (and frankly afraid of Serif typefaces as there seems so much more subtlety in their choosing) this one is drawing me to it like a magnet... </p>
      <p>It's a no sh*t kinda serif, and I love it!</p>
      <p>For now I'll have to experiement with Renault, as I still think it's the closest overall.</p>
