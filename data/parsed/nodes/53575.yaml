    <p>This is used by the UK mobile network operator, 3, in their literature. Anyone know what it is? It's a nice modern compact serif that seems to derive from transitional roots.</p>
    <p>Steve</p><div class="imageWrap"><img src="http://typophile.com/files/Untitled-1_5413.jpg"></div><p></p>
    <p>It seems to have some similarities to  <a class="freelinking external" href="http://new.myfonts.com/fonts/efscangraphic/renault-sh/" rel="nofollow">Renault, by Scangraphic</a></p>
