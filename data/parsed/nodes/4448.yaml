    html: "<p><b>JC: You�re a prolific contributor to the type lists and forums. How do you balance your writing with your type design � and oh yeah � with your day job and family? </b> <br> <br><i>HHP: I think the worst thing I could do to anybody who might actually be interested in this question would be to truncate their stimulating guesswork. An exposition of the reality � in fact merely my perception of such � would certainly be less motivational than what the average imagination can create. </i> <br> <br>Oh, my gosh. That definitely wins the Donald Rumsfeld Award for Creative Obsfucation and Non-Informative Response. [grin]  <br> <br>Nice work, both Jon &amp; Hrant.</p>"
