  html: <p>After spending a few nervous moments cold on the slab, the Typophile Forums roared back to life after responding to jolt of a few thousand volts. <br> <br>We've been on the phone with tech support, and they were able to restart the DB from the server side. Thank you for your emails - We apologize for the inconvenience. (Just think of all the work you were able to get done this morning!) <br> <br>//jared <br></p>
