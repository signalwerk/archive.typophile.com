      <p>Glad to help :-)</p>
      <p>Graphik is not a typeface that invites extended reading, but I haven’t noticed anything about the spacing that put me off. You could use it for shorter accompanying texts without running into trouble, I think. If you are uncertain, have a look at the very extensive specimen on the Commercial Type website.</p>
