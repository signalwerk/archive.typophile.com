      <p>I agree this is probably based on Chesterfield.<br>
      You can find it under many names, but most of the companies bellow are well known for font forgeries, so be extra careful when use it or obtaining a license for a commercial project:</p>
      <p><strong>Duffy</strong> - Copyright Copr. 1992 Silver Graphics<br>
      <strong>Quangnam</strong> - Copyright (c) VNI 1992<br>
      <strong>SMCNewHaven</strong> - [no copyright info available]<br>
      <strong>VNI-Duff</strong> - Copyright (c) VNI 1992<br>
      <strong>Olmitz</strong> - [no copyright info available]<br>
      <strong>Tuscan</strong> - Copyright 1988-1999 IBS -Future Corporation<br>
      <strong>Trifles</strong> - Digital font data from The WSI-FONT Collection.  Copyright (c)1992-1994 Weatherly Systems, Inc.</p>
      <p>I don't know which - if any - of the above is the original font name.</p>
