    <p>Hello all. I have been contacted by a person who wishes to use a font of mine in the registered trademark/logo of her company. While on the one hand that sounds great, on the other I don't know if I need to issue some kind of very specific legal agreement protecting the font itself. There are any number of registered trademarks/logos that incorporate Helvetica, for example, and that doesn't prevent other people from using the font for other purposes. But do I need to  issue her some kind of specific license specifying that? Should I be charging her some kind of extra license fee? I'd be grateful for any input.</p>
    <p>Andrew</p>
