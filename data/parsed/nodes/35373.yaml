      <p>Many foundries' basic license includes the right to make this sort of derivative work, i.e., to make a graphic image that includes the shapes of some glyphs in the font. If the license you issued does not, then yes, I think you are within your rights to offer that customer special dispensation for an additional fee, but this is widely regarded as being within the fair and expected uses of a font.</p>
      <p>Dingbat, symbol, and picture fonts are generally the only ones that specifically disallow this, since the charactters are already basically logos in and of themselves.</p>
      <p>Of course, I do defer to the opinions of those with more experience and expertise in this matter.</p>
      <p>If this company is requesting exclusivity in the use of your font in logotypes, then this is indeed a very special case, which will require special licensing not only for this customer, but also denying this specific use for any other customers. It would be simpler to sell this client full corporate exclusivity (with the huge fee that should entail). But again, I'm not the expert here.</p>
