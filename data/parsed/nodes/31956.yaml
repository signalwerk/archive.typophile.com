    <p>I’m selecting a body text for general business correspondence - a few lines to a few pages. Something about 10pt that looks serious and professional - which of these would be the most comfortable to read at that size - Garamond, Scala, Joanna, Perpetua…</p>
    <p>Thanks!</p>
