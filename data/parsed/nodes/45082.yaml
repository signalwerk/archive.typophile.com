      <p>Sorry <a class="freelinking external" href="http://www.antiquesandfineart.com/articles/article.cfm?request=860" rel="nofollow">here's the corrected link</a>.</p>
      <p>Those slats don't look heavy in three dimensions. They are only a quarter inch thick. Also the arch is because the sides have been cut down. In a usual chair they would be straight across and as thick at the sides as the middle. The middle being wider is probably for comfort. These chairs are incredibly comfortable to sit in, though they don't look it. For a start they slant back and are relatively low to the ground. </p>
      <p>The straight-on look here also looks heavier because of the shrunken scale of the picture.</p>
      <p>Also those legs and rails are maybe half the diameter of usual ones.</p>
      <p>The 'mission' stuff, by contrast is often built of square, heavy oak planks. </p>
      <p>I have a reproduction Shaker 'taped' rocker I always read my morning paper in, and love it. Our dining table is a reproduction of a Shaker trestle table, now in the Fruitlands Museum. The top is only 3/4 inch thick and the legs 1 1/8 inch thick. And the usual heavy cross bar between the two legs is removed, and replaced with two light angle pieces. And the usual heavy bar foot is replaced by a light arch. It is the lightest dining table I have ever seen. The rocker is also much lighter than normal rockers.  </p>
      <p>I just checked on line, but all the reproductions they show of the trestle table are heavier, and often totally wrong. Many furniture makers call anything un-oramented "Shaker", but there is a lot more to it. The authentic light dimensions are harder to make, and still be strong.</p>
      <p>As Chris quoted above from the famous Shaker hymn, their belief was "tis a gift to be simple". For them simplicity was a kind of sacred ideal, and the best of the real stuff just radiates that aura.</p>
