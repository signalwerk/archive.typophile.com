      <p>I live just down the road from the Hancock Shaker village in the Berkshires of western Massachusetts. So I have some familiarity with the Shakers' aesthetic.</p>
      <p>You'll have to decide whether you want to use type that evokes the qualities that we ascribe to Shaker furniture or whether you want type that is authentic to the Shaker community itself and the period in which original Shaker furniture was made. These are two *very* different things.</p>
      <p>The qualities that most people associate with the Shakers -- simplicity, spare elegance, functionalism, etc. -- have been mentioned and there are a lot of contemporary typefaces that evoke those same qualities. I'm sure you'll get plenty of suggestions for these.</p>
      <p>However, the Shakers themselves were products of their Victorian environment when it came to their own printing and advertising. You can see this most readily in the seed boxes, seed labels, and herb labels, such as shown in William's link above. Lots of different faces in quite a cacophony of styles, ironically. </p>
      <p>As far as their bibles and such, these were printed with the text types that were current in the day -- the DeVinne that Patty suggests is an excellent example. (This one: <a href="http://www.myfonts.com/fonts/bitstream/de-vinne/" title="http://www.myfonts.com/fonts/bitstream/de-vinne/">http://www.myfonts.com/fonts/bitstream/de-vinne/</a>, not some of the others that come up in a search.) Nick Shinn's Scotch Modern (serif) and Figgins grotesque (sans serif) are good contemporary versions of designs from this same period.</p>
      <p>HTH</p>
      <p>-- Kent.</p>
