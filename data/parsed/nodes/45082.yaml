    html: <p>I would suggest that the best typeface to talk about Shaker arts would do so obliquely, with a very very spare but delicate nineteenth-century look...like Emigre's Filosofia or ITC Bodoni Twelve...rather than a sans, which goes in the wrong direction, or any fonts they used to promo their products at the time...they used what was available and customary, and a very motley mix it was too!</p>
