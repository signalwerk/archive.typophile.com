      <p>'tis a gift to be free...</p>
      <p>Looks like a typical Shaker chair to me William, well except the cane seat and the caps on the feet of the back leg's ;) Those slats look right to me.</p>
      <p>Shakers mastered the stylish slim tappered vertical while keeping horizontals under check (accent on upward movement of line), and adornments like pommel finials, and my favorite mushroom caps, (etc.) are neat touches to those lines. So I think Patty suggestion of De Vinne is just about right, the caps though seem a little bit too wide(?).</p>
      <p>As fate would have it, I just ordered a copy of 'Seen and Received: The Shakers' Private Art', which is a book about the groovy graphic designs produced by the Shaker's spirit Interpreters as they were known as (a.k.a. graphic designers). Hannah Cohoons kick @ss designs (tree of life, tree of spirit, etc.), would make an interesting theme for a Shaker font. So too would Semantha Fairbanks flouishes, almost blackletterish to me. </p>
      <p>'Tis the gift to be simple,<br>
      'tis the gift to be free,<br>
      'tis the gift to come down<br>
      where we ought to be,<br>
      and when we find ourselves in the place just right,<br>
      'twill be in the valley of love and delight.<br>
      When true simplicity is gained<br>
      to bow and to bend we shan't be ashamed,<br>
      to turn, turn, will be our delight<br>
      till by turning, turning we come round right.</p>
