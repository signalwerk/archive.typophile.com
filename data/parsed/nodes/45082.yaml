      <p>Mark H., the real Shaker furniture is not heavy, but light. <a class="freelinking external" href="http://www.antiquesandfineart.com/articles/article.cfm?request" rel="nofollow">Here you can see some good pictures of the real stuff.</a></p>
      <p>As you can see, it is light where the latter "mission" and arts and crafts stuff is relatively heavy. In fact it generally looks fragile, but in fact is quite strong, as it was so well made. One of the things they consistently did to change existing designs was not only to remove ornament, but to make everything lighter and finer, and have elegant proportions.  </p>
      <p>It is really a unique aesthetic, and one that I don't think has really been created in type. So probably Patty's ideas here are the best. </p>
      <p>The closest anything comes is the early Danish modern furniture in the late forties and early fifties, which was influenced by the Shakers' work. The Danish stuff is more slick and posh--though also very nice.</p>
