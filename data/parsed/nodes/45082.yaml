      <p>I find both Areplos and Matrix look far too contemporary and "digital age" to really capture the spirit of Shaker design. You need something with a more timeless quality. The book I have uses Bauer Text initials as the display font which works beautifully.</p>
      <p>It's a trick to marry the concepts of simplicity, elegance, and craft. If you choose something too simple you run the risk of it looking dull (IMO Tankard's Shaker falls into this category). Too "crafty" and it starts to edge towards kitsch. Personally, I'd use a serif and make sure it's very carefully kerned.</p>
