    html: |-
      <p>Hello,<br>
      sorry Ralf and Grot but battlefield has  a valid question, to layout a 6 page z fold you need to take into account the folds, as a rough guide the cover page(s) should be 2-3 mm bigger than the middle page(s) which should be 2-3 mm bigger than the last page(s).<br>
      It all depends on the weight of your paper stock.<br>
      However depending upon  how well you get on with your printer and depending upon your design you may not have to worry too much about this as they may handle the imposition for you.<br>
       A word of warning, this can lead to changes in your design as the printer will likely just stretch or shrink your page to fit. Its better to set it all up your self as one large image as oppose to 6 separate pages.<br>
      cheers<br>
      martin<br>
      ps one last thing  A4 is 297mm x 210 mm so the question is is each page A4 or is the document size A4 in total?</p>
