      <p>Tucker,</p>
      <p>some of your doubts were mine some time ago.</p>
      <p>Do the contrary: define which languages you want to support and then include the proper characters. Unicode blocks are heterogeneous and the Latin ones brings together glyphs needed to less common European languages besides Asian languages, Medieval characters and even Roman signs.</p>
      <p>For example: Latin Extended Additional includes 1E9E, the German uppercase double S. It seems ok to include that. In the same block you find the Vietnamese accented and double-accented vowels. Of course, you would ignore them if Vietnamese support is out of your target. This Unicode block also adds several precomposed combinations to support Indic, Hebrew and Cyrillic transliterations. Again, you must chose if transliterations would be supported.</p>
      <p>A similar definition must be made about Phonetic alphabets, currency and letterlike symbols. This will take some research, but you will not include unnecessary glyphs.</p>
      <p>Some basic information about the blocks you did mention:</p>
      <p><strong>01. Latin B</strong> has mostly glyphs to African languages, but also mix rarely used European glyphs and Pinyin transliteration.</p>
      <p><strong>02. Latin C</strong> brings glyphs to Cyrillic transliterations and old African orthographies. 2C6D and 2C70 are needed to complete African support, the remaining probably are out of your scope.</p>
      <p><strong>03. Latin D</strong> has many Medieval additions and support for old orthographies. Probably the whole block is unnecessary to you.</p>
      <p><strong>04. Latin Additional</strong> is a mess. Define the languages and look in detail this block.</p>
      <p><strong>05. IPA and Phonetic block</strong>. Just needed to phonetic support.</p>
      <p><strong>06. Super and subscripts</strong>. Add the whole block.</p>
      <p><strong>07. Currencies</strong>. The very basic set is: dollar, cent, pound, yen, currency (generic) and euro. An improved set also includes thai, cólon, naira, won, new sheqel, kruvinia (hryvnia), tenge, new rupee (20B9) and tugrik. Most of others are historical.</p>
      <p><strong>08. Letterlike</strong>. nº, liter, estimated, TM, and Ohm are basic. Others may be included or not according to your scope, but are not essential.</p>
      <p><strong>09. Punctuation</strong>. Basic: 2002, 2003, 2013, 2014, 2018 to 2022, 2026, 2027, 2032, 2033, 2039, 203A, and 2044, </p>
      <p>The thread where I <a class="freelinking external" href="http://typophile.com/node/67787#comment-402703" rel="nofollow">presented</a> my own font project has some good information about this, kindly gave by fellow typophilers. The link above points to where this discussion begun.</p>
      <p>Other threads I also begun may be useful:<br>
      <a class="freelinking external" href="http://typophile.com/node/74164" rel="nofollow">Unicode and diacritics</a><br>
      <a class="freelinking external" href="http://typophile.com/node/78082" rel="nofollow">Eng and hooked N</a><br>
      <a class="freelinking external" href="http://typophile.com/node/73886" rel="nofollow">Currencies and others</a><br>
      <a class="freelinking external" href="http://typophile.com/node/71504" rel="nofollow">Greek and Cyrillic</a><br>
      <a class="freelinking external" href="http://typophile.com/node/78088" rel="nofollow">Slashed letters</a></p>
