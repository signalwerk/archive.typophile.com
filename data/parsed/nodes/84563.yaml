      <p><cite>Freiberger, I'd be interested to know how much of (or more than) Adobe Latin-5 your current project covers.</cite></p>
      <p>The font includes the whole Adobe Latin-5 plus additional glyphs to support less known languages (African, native American). A number of tricky diacritical combinations were also added as precomposed glyphs (for example: letters with line below, 0332, where the line is variable to fit the letter width).</p>
      <p>If you plan to take Latin-5 as a reference, note that one third of that table refers to IPA/APA alphabets. If you cut phonetic support in your first version, it becomes a lot easier.</p>
