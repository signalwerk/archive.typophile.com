      <p>Freiberger: Thanks for your thorough information and useful links. Having read (or at least skimmed through) a dozen or so threads, I am thinking I'll probably cut back on my original plans and stick to a more standard set of characters. Unfortunately, I do not have your skill nor your dedication! (Given how long you've been working on Palimpsest, I'd probably need at least ten years to do a project that size!)</p>
      <p>Fortunately, there seem to be plenty of good examples for "semi-extended" character sets in Latin, Greek, and Cyrillic. And if I ever become ambitious enough to attempt full Latin support, I will certainly look to your Palimpsest and Mr. Stötzner's Andron to get a better idea of the glyphs I would need.</p>
      <p>typodermic: Thanks for the heads-up on those characters.</p>
