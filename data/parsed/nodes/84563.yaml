      <p>For a "semi-extended" character set, the one from Minion Pro seems to be excellent –and already a huge project. Just note the position used in Minion for Vietnamese circumflex+grave (e.g., 1EA6) is not the preferred one.</p>
      <p>Thanks for your kind reference to PProject. Actually, it did born much smaller, but the curiosity did not let me stop at a proper size. It would be more logical to start with a narrow target and slowly make it wider –as you plan to do.</p>
      <p>You already identified a wonderful source of research: Andron is a masterpiece and its support (including a large medieval set still not present in Unicode) is the result of a deep knowledge. Other good source is Gentium, from SIL.</p>
      <p>Hope to hear good news about your font in a near future.</p>
