    <p>Hello, </p>
    <p>This is Suba, a sans family that I'm developing. I want to do a interpolation. But I'm not sure if I should draw the regular weight to do it.<br>
    And the italics, I'm not sure about it. Thanks for you feedback.</p><div class="imageWrap"><img src="http://typophile.com/files/SUBA_TEST_6483.jpg"></div><p></p>
