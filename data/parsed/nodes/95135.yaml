    html: |-
      <p>It's nice!</p>
      <p>It's hard to imagine "blind" interpolation working between such extreme weights, especially in a curvy monoweight.</p>
      <p>Some crits:<br>
      - I would give one of the diagonals of the "x" some curling (especially looking at the "z").<br>
      - The sharp turns when diagonals meet look unhappy. I think it would be much better to have the diagonals (even if they're curved) meet sharply.<br>
      - I think some parts of some letters in the Bold need more contrast.</p>
      <p>hhp</p>
