      <p>Nick, you've hit the Greek upright vs. italic problem pretty squarely. I described it this way to Gerry when I was working on Constantia: in terms of increasing cursivity you get</p>
      <p>Latin upright -&gt; Greek upright -&gt; Greek italic -&gt; Latin italic</p>
      <p>If you follow what you've characterised as a 'gestural' approach to Greek, you end up with a design that is more cursive than the corresponding Latin. As I've stated elsewhere, I think this is appropriate. The problem then is how to distinguish the italic, other than by slant alone. I think there are things that can be done in the italic itself -- as opposed to pushing the upright to be less cursive --, and I'm quite impressed with what Robert Slimbach has done with the Garamond Premier Pro upright and italic Greeks in this regard. That said, I'm all for typeface design as a laboratory, and look forward to seeing the Albany italic.</p>
