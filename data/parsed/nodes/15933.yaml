      <p>&gt;I would be very interested to see what you would come up with if you loosened up your take on the script. To borrow from Dwiggins, have a couple of tumblers, then write with a soft-ish nib without resting your arm on the surface.</p>
      <p>Gerry, I'm not doing a script font.<br>
      And spending the time to take my rusty Greek hand beyond its arrested development, into cursive, is not something I can afford to do.<br>
      Even so, I'm not sure writing, or drawing even, has a necessary involvement with the process of type design these days.</p>
      <p>However, I do have a sense of where you're coming from, and of the importance of the written form to Greek text. </p>
      <p>Look at it this way: imagine a culture takes the best available technology and mechanizes writing. It happened during the incunabula. But forget about that, and all the baggage of the western typographic tradition. Look at Greek writing now (both classical and vernacular), and the OpenType format. Start from scratch. Use contextual alternates at the level of sophistication created by Adam Twardoch in Zapfino Extra Pro, to capture the full cursive quality of the writing. Either work subjectively, and base your typeface on your own hand, or go into the field and research how people write today in Greek (and I mean a proper ethnographic study). I'd be very, very, interested to see what you would come up with.</p>
