    html: <p>The monotonic tonos is identical to the ploytonic oxia, and should have the same form. Essentially, it is an acute accent (indeed, the Unicode combining diacritical mark for the oxia <em>is</em> the combining acute), but in traditional Greek types it tends to be steep and often taller than the Latin acute.</p>
