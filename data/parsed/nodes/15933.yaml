      <p><em>Well yes, but this Unicode standard doesn’t appear to have much of a leg to stand on if it is being ignored by Apple (Lucida), Adobe (Minion, Myriad, etc.) and Microsoft (Tahoma)!</em></p>
      <p>The tonos marks in Minion and Myriad differ from the oxia accents, yes, but they are right-leaning, which is the main thing. What I think is a mistake is the fully vertical form.</p>
      <p>It is worth bearing in mind that Chuck Bigelow, Chris Holmes and Matthew Carter all made their first Greek types back when things like the triangle form in Helvetica Greek were all the rage. A lot has happened in Greek type design since then. I've recently been collecting samples of various demestica versions of Helvetica from Greece, and have noticed that most of these have rejected the old triangle form in favour of something more acute-like.</p>
