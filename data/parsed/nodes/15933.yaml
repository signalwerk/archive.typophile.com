      <p>To conclusively update my explorations and experiments:</p>
      <p>1. The vertical tonos (in monotonic setting) was abandoned, for the primary reason that in an upright font, tightly leaded, such a tonos becomes too easily entangled and confused with the (serifless) descenders of the line above.</p>
      <p>2. There are several logical reasons for a vertical tonos, but they are all trumped by the above consideration. Most obviously, the reform movement sought to replace all accents -- left, right, etc -- with a generic accent, so the vertical form (as expressed in the triangle) made sense, being neither sharp nor flat. However, it's worth considering Hungarian, Polish, etc., which have only one direction of accent, acutely angled. A vestige of the written form? Perhaps, but also typographically functional as per point (1) above. </p>
      <p>3. The steeply angled tonos in Adobe Greek fonts (Minion, Myriad) is not a problem there, because I do not believe they are designed for tight leading (Utopia -- a "news" face -- is much bigger on the body). However, it is a parameter of Albany, the face I'm developing, that it should be able to be set solid with extenders almost touching, and a vertical tonos does not work well in that situation.</p>
      <p>4. I found a good source of polytonic text on the Internet (Smyth's Grammar), but it uses the monotonic versions of the tonos-accented characters, rather than the proper polytonic versions. How do I know? Because in fonts such as Minion Pro, the polytonic tonos is angled more vertically, whereas the monotonic version is more like an acute. So, it makes sense to use the same-angled tonos for monotonic and polytonic, rather than create unnecessary sophistication, which may not work in real-world situations like this.</p>
      <p>5. Some "cheating" of the tonos angle is appropriate in the compound accents.</p>
