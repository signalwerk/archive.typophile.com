      <p>Gerry, perhaps it is presumptuous of me to have my own ideas of what a Greek type may be, not being a Greek, but I have studied a wide range of interpretations, including the Didots', and have, as I said, been unable to find a "modern" precedent fully suited to match the formal qualities of the mid 19th century modern roman, although Bodoni's Greek of c.1790, which does in fact have a pronounced vertical stress, led me to believe that my direction was not completely anachronistic (GB being more of an inspiration than the Times).</p>
      <p>BTW, the italic of Albany will feature the more traditional pen-driven "Baroque" (to use Bringhurst's term for 18th century italics of varied stress angle) ductus. This will establish a considerable contrast between the upright and slanted styles, the lack of which is presently IMO a weakness of Greek serifed typography. One of the riches of serifed western type is the stylistic contrast between roman and italic. In fact, many people (although not I) consider slanted roman to be a second-rate form of oblique emphasis, a failed modernist experiment (note Optima Nova Italic). I should point out that different italic forms do exist in the traditional Monotype Greek 90, they are nicely done, but quite subtle. This is also the case with Minion Pro. The ClearType Greek italics have alternate more-cursive forms of beta and theta (although not the curly rho), but are basically stylistically slanted versions of the roman glyphs. So this stiff-arsed Albany roman serves to set up the loose italic, which I'm working on.   </p>
      <p>I approached the design of this typeface with an eye on history and culture, but also philosophically as a problem in pure design. At its most basic, my design argument is this: if the Roman lower case, derived from pen writing as surely as is the Greek, can exist with or without serifs, why can't the Greek? I'm not taking it to that extreme (yet), but that's the couple-of-tumblers, "why not?" logic at back of it.</p>
      <p>I'm not concerned that modernizing, or borrowing typographic techniques first invented in the West, is somehow the dreaded Latinizing. After all, if Western concepts like a slanted emphasis style, small caps, and bold face are OK, the cat is out of the bag, ennit? And thanks for the sans.</p>
      <p>There seems to be a confusion in Greek typology between alphabetic form and typeface style. The common typeface during the 20th century was known as "Plain", or by its Monotype designation, Greek 90. In the West, a similar situation had existed, prior to the 1890s, after which typefaces began to be known by their designer's name. A sense of historical relativism structured this understanding, and led to an explosion of stylistic diversity, fostered by eclectics such as Morris Benton and Stanley Morison. To categorize those Greek faces which have provided stylistic diversity, such as Times Greek, as "misguided", is restrictive. Sure, the Elzevier types, of which Times is an example, aren't considered as posh fonts, but not every typeface has to be an aristocrat. In some circles, ITC Garamond is considered a travesty, but it has proven a successful and useful face, and while some may consider it misguided, it is not wrong in the sense that you are implying a post-ductus Greek lower case is.</p>
      <p>To me, the "gestural" quality of the Greek alphabet which underlies the ClearType Greeks is a myth. I don't deny that it has great historical authenticity, and provides a marvelous corporate stylistic consistency, but it is not the only legitimate road forward.</p>
      <p>I take it then, that given the "misguided" nature of my typeface, an equally misguided vertical tonos would be quite appropriate?</p>
