    <p>In 1980 the Greek government decreed that the <a href="/wiki/polytonic" class="freelinking" rel="nofollow">polytonic</a> alphabet would be replaced by the simplified <a href="/wiki/monotonic" class="freelinking" rel="nofollow">monotonic</a> system.</p>
    <p>Prior to that, there had been a popular/commercial movement towards this, featuring various forms of the simplified <a href="/wiki/tonos" class="freelinking" rel="nofollow">tonos</a> accent -- dots, vertical dashes, and triangles.</p>
    <p>In 1982 the Greek government (perhaps in a move to combat the tackyness of many of these accents nouveaux) decreed that the tonos would be angled, like an acute accent. This has subsequently become the Unicode standard.</p>
    <p>HOWEVER</p>
    <p>The tonos in Lucida Grande (Apple OS font) is a small vertical dash, quite different from the acute accent.<br>
    The tonos in various Adobe Pro fonts, such as Minion and Myriad, is slightly angled a few degrees off vertical, again quite distinct from the acute.</p>
    <p>SO </p>
    <p>Is this like the Euro symbol situation, where a typographic standard has been set, but found wanting and freely interpreted in practice?</p>
