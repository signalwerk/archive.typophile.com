      <p>Thanks for the props, Chris -- I'm thinking Albany and Leporello Black would team up nicely in Greek. Care to swap?</p>
      <p>I am going to go with the angled tonos, because I've realized that it's an integral part of polytonic (or "Regular Greek" as Yannis Haralambous calls it). Also, without spacious leading the vertical tonos melds into descenders on the above line, so an angled tonos allows tighter leading. Doing a separate version for polytonic and monotonic in the same font, as per Adobe Garamond Pro, is a bit of a stretch for me. But I will make the display version monotonic with vertical tonos, what the heck.</p>
      <p>As for the Mu, this goes back to another thread, concerning whether to have Greek caps that are different from the Latin, for better balance between the cases. The sample text I used here is from an online translation lesson (except I changed the Latin name from Carrefour to Morisons), representing a typical piece of commercial writing, a PR release, mixing languages. The situation here would be strange with different Ms for the different languages, as the sound is the same, so that led me to stick with the common glyphs. I hear you, this is an odd Mu, but it is also a bit of a strange M in the original face this revival is based on, so I'm afraid I can't change it (doing a revival makes those decisions for one).</p>
