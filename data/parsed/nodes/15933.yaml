      <p>Ironically, I recently found myself having to straighten the sides of a Greek uppercase Mu, contrary to the gently sloped left side of my Latin M. The reason for this is that the font is designed for scholarship and I needed a clear distinction between the Mu and the ancient letter Shan, which is very similar to the Mu. After some discussion with Gerry and another font developer who has done a lot of work for classical and Biblical scholarship, I decided that the sloped sides were appropriate to the Shan and that the Mu should be straighter for contrast.</p>
