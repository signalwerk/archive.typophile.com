      <p>Thanks for your input Gerry, and respect for your work (with Mr Hudson et al) on the ClearType fonts -- the language support of the project, to me at least, overshadows the technological aspect. I'm sure it will provide a huge boost to Greek and Cyrillic typography, by opening up the design space available to typographers there (without meaning to be patronizing to local type designers) with new fonts with italics, bold, and small caps. I've also been impressed with Adobe and Typotheque's committment to supporting polytonic.</p>
      <p>While I had originally intended to produce only a monotonic font, I've been persuaded to go the whole hog. </p>
      <p>Would I be correct in assuming that, in creating a polytonic font, I can use Gentium and Minion Pro as models for the unicode values and accents?</p>
      <p>The typeface I'm working on is a revival of a roman didone, from c.1870, featuring a strong vertical stress and absence of pen-written ductus. The Greek characters are new, as I was unable to discover any precedent that I considered to be sufficiently "modern".  It seems to me that the correct tonos for monotonic use here is vertical. That would be no good for polytonic, as the tonos there must be angled, working in conjunction with the grave. Presently, I'm leaning towards the idea of making the text faces polytonic, and the display faces monotonic, with vertical tonos. A bit of a shame, as I liked the look of the vertical tonos in text. Is it really so inappropriate?</p>
      <p><a href="http://www.shinntype.com/Albany.pdf" title="http://www.shinntype.com/Albany.pdf">http://www.shinntype.com/Albany.pdf</a></p>
