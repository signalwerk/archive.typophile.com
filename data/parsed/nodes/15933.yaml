      <p><cite>The typeface I’m working on is a revival of a roman didone, from c.1870, featuring a strong vertical stress and absence of pen-written ductus. The Greek characters are new, as I was unable to discover any precedent that I considered to be sufficiently “modern”.</cite></p>
      <p>Nick, thanks for the peek. I only will apologise in advance for saying what I have to in a few sentences only, and hope it does not come across too dogmatic. </p>
      <p>I think you are taking "Modern" as it applies to the Latin script and imposing it on the Greek script, ignoring typographic interpretations of the script at the time. The Didots' contribution to the development of Greek typeface design is seminal, and very much <em>not</em> in a "strong vertical stress and absence of pen-written ductus". If you are not in a hurry, I could send you some images of the real thing in the next few days. </p>
      <p>As it looks on your PDF, the Greek looks like an update of the misguided genre set out by Times Greek in the late fifties. I would be very interested to see what you would come up with if you loosened up your take on the script. To borrow from Dwiggins, have a couple of tumblers, then write with a soft-ish nib <em>without</em> resting your arm on the surface.</p>
