      <p><em>I haven’t checked out the [Garamond Premier Pro] Italic yet, but I just had a look at the PDF for the upright, and noted that the monotonic characters have a vertical tonos, whereas the polytonic versions of the same character have an acute tonos. I don’t have the font, so I’m wondering how that’s handled. A stylistic alternate?</em></p>
      <p>The tonos isn't totally upright: it leans a little to the right. This follows Robert's approach in Minion and Myriad also (I'm guessing he was largely responsible for the Myriad Greek). As I've said, I don't see any reason for the tonos to differ from the polytonic oxia. If it is going to differ, as it does in these Adobe designs, then it should still resemble the oxia/acute in form -- i.e. not be a triangle, circle, square, etc. -- and should still lean to the right.</p>
      <p>A nice, authentically renaissance touch in Garamond Premier Pro: the Greek accents are not at the same height on all letters so, for example, the tonos on the alpha and eta sits a little lower than one the epsilon and iota. The vertical placement varies relative to the to the height of the letter at the point of horizontal alignment.</p>
