      <p>Nick, I see you are dabbling in Greek ; good! I will add my two bits in relative haste, under great pressure of time. (I've got it also on my to-do list to respond to the thread about caps, but boy do you and Hrant make it difficult to keep up...) So, here goes. </p>
      <p>Firstly, the Greek government would not give a monkey's for the aesthetics of the monotonic accent. The passing of monotonic in 1981 was one chapter in a very long debate going back several decades, but precipitated by politics and concerns by the local publishing industry, in the face of imminent capital investment and associated human resources costs. With hindsight, keeping in mind that this happened only three years before the DTP explosion (read "me and my dog in my living room are a service bureau") which was built on 8-bit fonts, this paved the way to font piracy and localisation of the most abysmal quality. </p>
      <p>All the Greek reference works have stated, from day one, that the monotonic tonos is identical to a polytonic acute. Any dots, triangles, dashes, and such are wrong, ugly, and inappropriate for the formal characteristics of the script. </p>
      <p>In reality, this must be tempered by the context in which it was expressed. Therefore, it is acceptable to design the tonos at a slightly different angle, length, and weight from the acute, since the tonos sits alone over vowels, and does not need to accommodate breathings -- but must always be right-inclined. My personal view is that diacritics should be designed to relate in stroke thickness and modulation to the lower-case glyphs; in other words, make them loud and clear. </p>
      <p>So, Unicode is correct in this. Unfortunately, Lucida Grande is as poor in the Greek as it is good in the Latin, so Mac users do not reference out of the box.</p>
      <p>You're doing well to be looking at what others have done, but you  should be casting your eyes on a wider range of printed material, and -- why not? -- even writing examples.</p>
