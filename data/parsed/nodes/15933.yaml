    html: |-
      <p><em>I found a good source of polytonic text on the Internet (Smyth’s Grammar), but it uses the monotonic versions of the tonos-accented characters, rather than the proper polytonic versions. How do I know? Because in fonts such as Minion Pro, the polytonic tonos is angled more vertically, whereas the monotonic version is more like an acute. So, it makes sense to use the same-angled tonos for monotonic and polytonic, rather than create unnecessary sophistication, which may not work in real-world situations like this.</em></p>
      <p>This is sound analysis.</p>
      <p>Note that this is not necessarily simply a case of a user choosing to use the tonos diacritic characters to encode the oxia diacritics: alpha with oxia (U+1F71, ά) has a canonical decomposition to alpha with tonos (U+03AC, ά); i.e. Unicode considers them to be identical (which they are, of course, grammatically and historically), and normalisation may result in decomposition of oxia diacritics to tonos diacritics. Note also that tonos and oxia share the same combining mark encoding (U+0301, the combining acute accent*), which means that any design distinction between the two will simply disappear if fully decomposed normalisation is applied. Since text may be subject to different kinds of normalisation, you have no way of anticipating how the diacritics will be displayed unless you make the tonos and oxia identical.</p>
      <p>* Note that in a bi-script, Latin and Greek font, it may be necessary to include two forms for U+0301 (and other common combining mark characters), appropriately linked to each script/language using the 'locl' feature. This is one of the reasons why I am shipping a separate SBL Greek font in addition to including Greek support in SBL BibLit, so I can directly encode the combining tonos glyph as U+0301, the combining varia as U+0300, etc., in the former.</p>
