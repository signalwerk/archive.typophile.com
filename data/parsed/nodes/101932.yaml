  html: |-
    <p>30% de descuento en "Tipografía Latinoamericana" 42 diseñadores, tipógrafos, investigadores y docentes, que narran sus experiencias, reflexiones, procesos y resultados. ¡No se lo pierdan! </p>
    <p><a href="http://lamonaca.org/tipografia-latinoamericana/" rel="nofollow"><img src="http://lamonaca.org/wp-content/uploads/2013/02/jpg.jpg" width="232" height="300" alt="Tlatam" title="Tlatam"></a></p>
    <p><a href="http://lamonaca.org/tipografia-latinoamericana/" rel="nofollow"><strong>"http://lamonaca.org/tipografia-latinoamericana/"</strong></a></p>
    <p><strong>For English speakers</strong>: this book is a collection of 42 designers, typographers, researchers, and teachers that narrate their experience, reflections, process and results. Personally I think it's one of the most important book releases in regional typeface design :)</p>
    <p><strong>Authors: Zalma Jalluf, Ewan Clayton, Julio Ferro, Eduardo Rodríguez Tunni, Fernando Díaz, Lautaro Hourcade, Viviana Monsalve, Patricia Benítez, Fabio Ares, María Laura Fernández, Miguel Catopodis, Alejandro Valdez, Juan Heilborn, César Puertas, Ignacio Martínez-Villalba, Felipe Cáceres, Francisco Calles, Cristóbal Henestrosa, María Teresa Bruno, Juan Pablo del Peral, Fábio Lopez, Fábio Haag, Tony de Marco, Francisco Gálvez, Marcela Romero, Aldo de Losa, Henrique Nardi, Gustavo Wojciechowski, Marina Chaccur, Juan Carlos Darias, Víctor García, Marina Garone Gravier, Juan Pablo de Gregorio, Cláudio Rocha, Cecilia Consolo, Pablo Cosgaya, Alejandro Paul, Rubén Fontana, Diego Vainesman, Oscar Yáñez, Dave Crossland.</strong></p>
    <p><strong>Prologue:</strong> José de los Santos</p>
    <p><strong>Compilator: Vicente Lamónaca</strong></p>
    <p><strong>Thanks in advanced for spreading the word</strong></p>
