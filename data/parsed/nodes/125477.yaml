    html: |-
      <p>@cat conrad, one of the best ways to create a professional logo is by research. Lots of it. The industry you're aiming for, the audience, and in some cases demographics. Once you have some direction then you might get a better feel as to the design and type you might want to use to position yourself as a brand, trend, or whatever style you're aiming for and the attention you want to gain for the purpose of the logo. When you get to sketching out ideas, you might find this site helpful <a href="http://www.logobook.com">http://www.logobook.com</a></p>
      <p>I would also suggest reading through this identity guide to get a better understanding of how a mark works together <a href="https://issuu.com/egotype/docs/brand_manual_guide_cm_v1">https://issuu.com/egotype/docs/brand_manual_guide_cm_v1</a><br>
      After you get that all together, look into having your logo tradamarked as outlined here: <a href="http://justcreative.com/2011/01/17/how-to-trademark-a-logo/">http://justcreative.com/2011/01/17/how-to-trademark-a-logo/</a></p>
      <p>This is how you can create a professional logo and keep it protected, because there's no need to create a professional logo without the rights to it. Please keep us updated to your progress. I'd like to see what you come up with and how you launch the logo for your name/brand in the near future. Enjoy the process and make it happen.</p>
