      <p>Hrant is absolutely right. Not meaning to be rude, but your question is a bit like "how do I write a professional computer program?" If you don't know how to do it, you can't do it. Yet.</p>
      <p>I have been a professional type designer for five years, and have studied type on some level for much longer. But I am not very good at logo design, which is a different process. I <em>might</em> be able to make a professional looking logo (whatever that may be), but I would still hire a professional designer to do it, if it were something important. Simply because he or she would do it better than me.</p>
