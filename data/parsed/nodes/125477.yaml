    html: |-
      <p>I assume you want to do it yourself.</p>
      <p>Like Jared mentions, you need some knowledge of the anatomy of type. If you don't have any it's going to be hard to create something that will look good/professional. But if you want to do it as a study project, to learn from it, it will be fun and you will gain some knowledge about type, just don't expect too much.</p>
      <p>If you know Adobe Illustrator and know how to draw / manipulate vector shapes you can to it behind a computer and be able to create a lot of different ideas pretty fast.  There are tons of instructions video's on manipulating existing fonts out there.</p>
      <p>if you don't know how to work with Illustrator you have to print letters cut them by hand and arrange them by hand, draw or photograph the result. This will take a lot of time and effort but it's not a bad way to do it and if you have fun doing it who cares it takes time!</p>
      <p>So if the goal is to own a logo for your company period, follow Hrant's advice. </p>
      <p>If you like to know more about type and want to study it more in the future, go ahead and experiment! And show us what you made, anyone here will be happy to give you feedback!</p>
    html_clean: |-
