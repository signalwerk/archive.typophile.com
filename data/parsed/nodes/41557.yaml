  html: <p>I've used Trajan to create a logo for a client. She wants business cards and she wants them now. I want to wrap this up tonight in an hour or less. Rather than battle with options, I ask you, friends, to suggest a few sure-fire complements to use for the supporting text on her business cards. Sans or roman, I couldn't care less. I just want to be done. Thank you in advance.</p>
