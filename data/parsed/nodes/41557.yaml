    html: |-
      <p>Thanks all. For now, I'm not going to post the finished product because it's too embarrassing. This is a perfect example of a client who knows what she wants and won't heed the advise of her designer/typographer. I did ultimately propose a Helvetica Light complement because it was the "classic" sans to accompany the "classic" roman. High contrast/low conflict. It looked pretty slick (even though the logo is awful). She didn't like it. I quickly showed her a few more "classic" sans, and she liked Gill Sans the best. I said, "Are you sure? The heavy vertical strokes and lighter horizontal strokes of Gill Sans make it sort of an almost-roman typeface, which is starting to create some conflict with the Trajan in your logo." Her response was as if she didn't hear a word I said. "I like the Gill Sans." Okay. Here's the bill...</p>
      <p>(I feel like I've been busted for over-analyzing an entry...I just edited this comment because I had omitted a word in the original post (which changed the meaning of the sentence slightly). In doing so, the comment was moved to the bottom of the list, thus screwing up the flow of the dialogue. This particular comment originally posted just below the Optima suggestion.)</p>
