      <p><cite>“Are you sure? The heavy vertical strokes and lighter horizontal strokes of Gill Sans make it sort of an almost-roman typeface, which is starting to create some conflict with the Trajan in your logo.”</cite></p>
      <p>I'm confused by this. Wouldn't Gill make the perfect match for Trajan? It's obviously influenced by Gill's familiarity with the Roman lapidary forms. Use the light weight light you were talking about for Helvetica, or for contrast, one of the darker weights that doesn't verge into goofiness.</p>
      <p>OR, since the italic doesn't have that much of a slant to it, you could dare to try it. OR, since we're on the subject, it could have been a chance to use the Joanna italic.</p>
      <p>Options abound, so always look on the bright side of life!</p>
