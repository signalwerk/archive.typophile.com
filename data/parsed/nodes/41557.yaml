    html: |-
      <p>&gt; <cite> which foundries do you frequent?</cite></p>
      <p>Let me shed a little light here. None. I got a refurbished G4 about two years ago, my friend <a class="freelinking external" href="http://www.dreamtimevillage.org/" rel="nofollow">mIEKAL</a> gave me a discful of fonts...helpful but far from professional...and I have no resources to shop for more. In the basement I have hundreds of pounds of lead type, mostly from the American Type Founders Co. All useless until I build or acquire a studio space for the press, currently in storage.</p>
      <p>Mimick? I think no. I like Dan's Palatino suggestion, but we'll see what happens when I mix two romans...that's why I was thinking, "Should it be a sans?" Or is pitting "the new typography" against the most classic of the romans a bad idea? And then I got to thinking, "This is a good question for the Typophiles."</p>
      <p>Comic Sans?</p>
