      <p>I'm not even sure what you mean by "empowerment". Usually it means the gaining of social-political influence by a group of people with a certain social-political agenda. But that's probably not what you mean.</p>
      <p>So it might be better for you to describe what you want to achieve with more than just one word. If I don't know what to associate with the term "empowerment" even when it's spelt out in front of me, I certainly won't know it any better when it's "symbolized" somehow in a wordmark.</p>
