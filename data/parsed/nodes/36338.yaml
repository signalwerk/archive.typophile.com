    <p>I'm re-designing this artists brand <a href="http://www.hiddenplacestudio.com" title="www.hiddenplacestudio.com">www.hiddenplacestudio.com</a>  also see <a class="freelinking external" href="http://shaylapn.blogspot.com/" rel="nofollow">http://shaylapn.blogspot.com/</a></p>
    <p>It looks as if she will phasing out the hiddenplacestudio and pushing her uncommon and gorgeous name. There might be graphics involved but the name will have prominence.</p>
    <p>Key words are, empowerement, luxury, contemporary, approachability and possibly subtly suggest her asian influence (specifically japanese). The artist's voice is currently in flux and seems to be coalescing into what you see at the following link </p>
    <p><a class="freelinking external" href="http://shaylapn.blogspot.com/2007/08/painting-of-week.html" rel="nofollow">http://shaylapn.blogspot.com/2007/08/painting-of-week.html</a></p>
    <p>Her clientele is interested in fine dining, culture, and personal growth.</p>
    <p>thank you kindly.</p>
