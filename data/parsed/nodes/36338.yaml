      <p>I'll use an example.</p>
      <p>Woman is stuck in an abusive relationship, never takes the time to get to know herself. One day she's had enough and decides I want to be a (insert career of choice). Having gotten that education and a satisfying career she wants to have the comforts never allowed to her. It's an eff u to the world so to speak, "I'm allowed to be happy". She decides to commission a piece of artwork to celebrate her new found freedom. She hires Shayla because  the brand and artwork express what she is feeling.</p>
      <p>Does that help clarify things?</p>
      <p>I suppose self-empowerment is more accurate.</p>
