      <p>I'm fairly certain that Letter gothic is anything but Asian.</p>
      <p>Anyway, I think you're aiming *way* too high -- five "keywords" which appear to be contradictory with each other to the common sense. I wouldn't even know how to unify "empowerment" with "luxury", or "luxury" with "approachability" -- I'd say "luxury" pretty much negates the other two.</p>
      <p>If anyone actually pulls it off to deliver something that echoes all your five "keywords" to the majority of the audience, I'd call him a grandmaster of design without any hesitance.</p>
