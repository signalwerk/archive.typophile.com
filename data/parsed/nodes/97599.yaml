    <p>Going through Microsoft's diacritic design standards( <a href="http://www.microsoft.com/typography/developers/fdsspec/diacritics.htm" title="http://www.microsoft.com/typography/developers/fdsspec/diacritics.htm">http://www.microsoft.com/typography/developers/fdsspec/diacritics.htm</a> ), one notices Adam T's name quite a few times when Polish accents come into picture. The hyperlink's are supposed to explain the design of Polish accents by Adam T, but when you follow the links nothing happens. The website( <a href="http://www.font.org/" title="http://www.font.org/">http://www.font.org/</a> ) asks you for a username and password.(Whaaat?) So Adam or anyone associated with font.or website can throw some light on this?</p>
    <p>Thanks<br>
    T</p>
  html_clean: |-
