  html: |-
    <p>Anne Bonny is the latest typedesign-project of Berlin based Melle Diete. Anne Bonny is the comrade of Mary Read Type. It has the same proportions and nearly the same OpenType-Features. It is a Bodoni-inspired typeface with a sweet and female touch. You can choose between the swashes-feature, initials, final letters, many ligatures and ornaments.<br>
    <a href="http://new.myfonts.com/fonts/mellediete/anne-bonny/" title="http://new.myfonts.com/fonts/mellediete/anne-bonny/">http://new.myfonts.com/fonts/mellediete/anne-bonny/</a></p>
