    html: "<p>Hello: <br>I am writing from the site that you say is selling 1000 fonts for $30.  Yes it's true that we do sell fonts, but all the font developers have given us permission to include them on to the CD.  I have written emails from all of them filed away. <br> <br>I just spoke with Tom Murphy from Tom's Fonts(Since he was listed on this page) and he is now clear on the issue since he did give me permission, just like all the other font developers did. <br> <br>There is no way I would include any fonts from any developers without getting permission.   <br> <br>If anyone needs to see the \"permission\", I will gladly provide it. <br> <br>thanks <br>macXware <br></p>"
    html_clean: "<p>Hello: <br>I am writing from the site that you say is selling 1000 fonts for $30.  Yes it's true that we do sell fonts, but all the font developers have given us permission to include them on to the CD.  I have written emails from all of them filed away. <br> <br>I just spoke with Tom Murphy from Tom's Fonts(Since he was listed on this page) and he is now clear on the issue since he did give me permission, just like all the other font developers did. <br> <br>There is no way I would include any fonts from any developers without getting permission.   <br> <br>If anyone needs to see the \"permission\", I will gladly provide it. <br> <br>thanks <br>macXware <br></p>"
