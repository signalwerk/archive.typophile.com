    html: |-
      <p>Hello: <br>In Europe we had some 1000-font packages distributed by MediaMarkt, a huge German PC and appliance chain. They however included some fonts pirated from Linotype in Bad Homburg.  <br>Linotype sued them and won in court. <br>Most of these MediaMarkt fonts were lousy. Low quality, very few accents, different encodings etc. etc. <br>I do remember a case in the UK were a PC Software vendor did release those 1000-font compilations too. <br>Enclosed the PDF describing what happened. <br>Henk</p>
