  html: <p>Can anyone please explain what ghost links/hints in Fontlab are used for? Thanks!</p>
  html_clean: <p>Can anyone please explain what ghost links/hints in Fontlab are used for? Thanks!</p>
comments:
  - id: 560558
    user: 1262
    date: 2013-07-18T13:40:00
    date_raw: 18 Jul 2013 — 1:40pm
    votes: null
    html: |-
      <p>These are hints that are used to control vertical alignment of features that do not involve horizontal stems. The obvious example would be the top and bottom of a <em>sans serif</em> letter I. There is no serif to function as a horizontal stem, and hence nothing to which to link a standard stem hint. Ghost hints are used here to attach the top and bottom of the letter to vertical alignment (blue) zones.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/ghosts_6193.png"></div><p></p>
