      <p>Hi Jens -</p>
      <p>It's certainly some kind of slight variation on Century Schoolbook. I think that due to the fact that the printing surface is presenting with some bleeding, the letterforms are distorted somewhat. The closest I can find to your sample (going primarily by the serifs on the W) is Monotype's version.</p>
      <p><a href="http://new.myfonts.com/fonts/agfa/century-schoolbook/" title="http://new.myfonts.com/fonts/agfa/century-schoolbook/">http://new.myfonts.com/fonts/agfa/century-schoolbook/</a></p>
      <p>If this isn't to your liking, type "Century Schoolbook" into the search engine at MyFonts; there's a lot of versions available, with subtle differences.</p>
      <p>-NJ</p>
