    <div class="info">Submitted by <a href="/user/108" title="View user profile.">Miss Tiffany</a> : 3.Dec.2007 2.16pm </div>
      <p>For Immediate Release:<br>
    Buffalo, NY, December 3rd, 2007:</p>
    <p>P22 and the Lanston Type Company introduce LTC Italian Oldstyle and Goudy Extras</p>
    <p>Italian Oldstyle designed by Frederic Goudy in 1924 has now been digitized by Paul Hunt. This new font is not to be confused with the font “Adobe Italian Oldstyle MT”, which is an earlier design from 1911 based on William Morris’s Golden Type based on Nicholas Jenson’s Roman face. Goudy went back to Jenson’s original Roman and other Renaissance Roman faces for his inspiration and the result is what many consider to be the best Renaissance face adapted for modern use.</p>
    <p>With most digitizations of old metal typefaces, one source size is often used as reference (as was Goudy’s method for his own cuttings of his Village foundry types) so that all sizes refer to one set of original artwork. The original hot metal fonts made by Lanston Monotype (from Goudy’s drawings) and other manufacturers used two or three masters for different size ranges to have optimal relative weights (smaller type sizes would need proportionally thicker lines to not appear thin and larger sizes would require thinner lines to not appear to bulky). The variations in size ranges can also be affected by the size of the cutter head in making the master patterns.</p>
    <p>The light weights of LTC Italian Oldstyle were digitized from display sizes (14, 18, 24, 30, 36 pt) and the regular weights were digitized from smaller composition sizes (8,10,12 pt.). The fitting for the regular weights is noticeably looser to allow for better setting at small sizes. Very few font revivals take this approach.<br>
    <a href="http://www.p22.com/lanston/italianoldstyle.html" title="http://www.p22.com/lanston/italianoldstyle.html">http://www.p22.com/lanston/italianoldstyle.html</a></p>
    <p>LTC Goudy Extras is a set of over 50 ornaments, connecting borders, flourishes and decorative motifs originally designed by Frederic Goudy throughout his career. Many of these designs were used by Goudy at his Village Press and offered by his Village Foundry in the 1920s. The styles range from complex title page illustrations to simple linking borders, but all have the unique Goudy style.<br>
    <a href="http://www.p22.com/lanston/goudyextras.html" title="http://www.p22.com/lanston/goudyextras.html">http://www.p22.com/lanston/goudyextras.html</a></p>
    <p>These new releases and all Lanston Type Company fonts can be viewed on our newly redesigned Lanston web pages:<br>
    <a href="http://www.p22.com/lanston/" title="http://www.p22.com/lanston/">http://www.p22.com/lanston/</a></p>
    <p>Additional images of the font for both web and print can be found here:</p>
    <p><a href="http://p22.com/products/press-images.html" title="http://p22.com/products/press-images.html">http://p22.com/products/press-images.html</a></p>
    <p>——————————-<br>
    SUPER DELUXE BOXED SET</p>
    <p>Like a fine meal, an exceptional font collection deserves an exceptional presentation. Lanston Type Co. presents the full collection of over 270 Fonts in a limited edition box with an original Lanston Monotype Matrix case.<br>
    <a href="http://www.p22.com/lanston/ltccollection.html" title="http://www.p22.com/lanston/ltccollection.html">http://www.p22.com/lanston/ltccollection.html</a><br>
