    html: |-
      <p>The kanji is correct. Read as "nami" in Japanese 波。</p>
      <p>The character 浪 can also mean "wave" but usually has the sense of "billows" or "wandering" Eg 浪人 "ronin" a wandering man = samurai with no master. Use in Chinese may be different.</p>
      <p>Your character is more common one for "wave" in Japanese</p>
      <p>You might like 浴 "to bathe, bask in sun, to shower"</p>
