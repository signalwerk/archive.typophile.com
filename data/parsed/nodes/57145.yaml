    html: |-
      <p>波 is also wave in Chinese. I think 浪 is a more white-water, surfer type wave and 波 is more of a rippling undulating wave.</p>
      <p>(波動拳 is also the surge-fist or "hadouken" from SF ... )</p>
      <p>I think the thing that sticks out for me is that the style of the waves and the character don't match. The waves are very crisp, whereas the character looks brush-drawn. Would it be possible to roughen the edges so the waves also look like they're drawn with a brush? Also maybe the wave design should reach to the edge of the paper on both sides to make more of a solid block.</p>
    html_clean: |-
