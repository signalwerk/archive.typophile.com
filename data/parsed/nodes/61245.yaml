    <p>I had hoped somebody else in the know would've posted about this before I did but I was just made aware of this news: <a href="http://www.lohud.com/article/20090821/NEWS02/908210360/-1/newsfront" title="http://www.lohud.com/article/20090821/NEWS02/908210360/-1/newsfront">http://www.lohud.com/article/20090821/NEWS02/908210360/-1/newsfront</a></p>
    <p>I did have the good fortune to meet Ed at Typecon a few years back and celebrate his birthday with him. . . He was a very kind soul and always in great spirits.</p>
    <p>One of my favorite memories of him: <a href="http://www.houseind.com/movie/" title="http://www.houseind.com/movie/">http://www.houseind.com/movie/</a></p>
    <p>Also, if you get a chance pick up a copy of his book Life with Letters as the Turned Photogenic, a wonderful tome that recounts the history of his company and life . . .</p>
    <p>He left and indelible mark on the type industry and will be sorely missed . . .</p>
    <p>Stuart</p>
