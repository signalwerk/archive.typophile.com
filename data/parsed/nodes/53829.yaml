      <p>I'm sure Ken Lunde will have excellent suggestions. As far as Cantonese goes, there is no real typographical difference as far as I am aware apart from some characters specific to Cantonese. </p>
      <p>The standard written Chinese used by Cantonese speakers in formal situations is essentially identical to that used by Mandarin speakers. When Cantonese speakers specifically choose to write in Cantonese, the differences with standard written Chinese based on Mandarin are basically in word choice and usage, but as I said, the only typographically different element is the use of Cantonese-specific characters.</p>
      <p>Another thing to take into consideration is that in Hong Kong and Macao, Cantonese speakers will write with traditional characters, while Cantonese speakers in China will write with simplified characters.</p>
