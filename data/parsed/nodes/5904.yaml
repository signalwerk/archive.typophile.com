    votes: null
    html: "<p>I think it's a good project; there's a certain 'genericity' in certain characters (BPRf, for example) but I guess it's just a matter of tweaking the curves, etc. There's a lot of inconsistencies in color (weight); and overall it seems a bit too light (specially the thins). You're right about the bdpq. The bowls need more weight. <br> <br>Other comments: <br>- O: the inner shape looks 'squarish'; <br>- Q: tail is too odd and thin; <br>- W: that white shape in the middle (where the two strokes cross each other) is too small, enlarge it or remove it; <br>- X: top heavy; <br>- g: extremely odd shape for this typeface; <br>- y: it needs the inner left serif (IMHO).</p>"
    html_clean: "<p>I think it's a good project; there's a certain 'genericity' in certain characters (BPRf, for example) but I guess it's just a matter of tweaking the curves, etc. There's a lot of inconsistencies in color (weight); and overall it seems a bit too light (specially the thins). You're right about the bdpq. The bowls need more weight. <br> <br>Other comments: <br>- O: the inner shape looks 'squarish'; <br>- Q: tail is too odd and thin; <br>- W: that white shape in the middle (where the two strokes cross each other) is too small, enlarge it or remove it; <br>- X: top heavy; <br>- g: extremely odd shape for this typeface; <br>- y: it needs the inner left serif (IMHO).</p>"
