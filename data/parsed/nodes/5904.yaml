    <p>I have been working on Entry Point for a few a while now... I thought it was about time I started to get some feedback on it.  The most obvious issue is with the weight of the 'b,d,p,q' in the lower case. There are other problems with the 'a,c,e,g' that I am working on. Any advice or criticism is welcome. <img src="http://www.typophile.com/forums/messages/29/42000.jpg" alt=""></p>
