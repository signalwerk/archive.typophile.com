  html: |-
    <p>I guess this is what happens when you let someone else 'finish off' your work...<br>
    There were just a few details to be checked before printing the document. However, someone thought they would 'improve' the whole document by putting it into MS Word, adding unhelpful titles and using animated text effects.<br>
    I got too annoyed counting the things that were bad...ouch!</p><div class="imageWrap"><img src="http://typophile.com/files/welcome problem_6385.jpg"></div><p></p>
