      <p>Thanks, Miguel. I read the entire specs before, but seem to have missed this exact definition ...</p>
      <p>As for the reverse-engineering, well yeah, I have seen the Minion Pro feature file. What I'm hoping for is the reverse: given any font, get a (reasonably) correct feature file out of it. The MinionPro-Regular.fea is my target output, and I'd like to produce a comparable file by reading and parsing MinionPro.otf.</p>
      <p>Reading the specs, it sounds it's possible by including all tags which define <em>any</em> single glyph input substitution. That would (correctly) exclude 'frac' in the Minion sample, as this does not contain single input glyphs at all, as well as 'ss02' (that one has an explicitly mentioned workaround).</p>
