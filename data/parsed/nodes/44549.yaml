      <p>&gt; <em>I cannot find a decent definition of the aalt feature.</em></p>
      <p>Here's *the* definition: <a class="freelinking external" href="http://www.adobe.com/devnet/opentype/afdko/topic_feature_file_syntax.html#8.a" rel="nofollow">8.a. The all alternates ('aalt') feature</a></p>
      <p>&gt; <em>Perhaps this was never meant to be re-engineered :-)</em></p>
      <p>You mean reverse engineered? There's no need to do that. Go to <a href="http://www.adobe.com/devnet/opentype/afdko/" title="http://www.adobe.com/devnet/opentype/afdko/">http://www.adobe.com/devnet/opentype/afdko/</a> and download ExampleRomanFonts.zip, or get it at <a href="http://www.adobeforums.com/webx/.3bb58628" title="http://www.adobeforums.com/webx/.3bb58628">http://www.adobeforums.com/webx/.3bb58628</a></p>
