      I agree whole fontedly. Even at 96, these look sharp but smooth, which is the trick!</p>
      <p>"... I find the text type fuzzy...[at 145!] and I think this is in large part due to the font, which I think is too light for the purpose."<br>
      I don't think I can find better example of the problem not being in the font's contour. :-)</p>
      <p>Do you know if any developers are working on either bringing integer spacing to an app that uses OT, or working to bring OT to an integer spacing app, does this already exist somewhere, or are "we" going keep going in a direction of increasing dept, decreasing Oxygen, while proudly showing the world how "good" autohinting can be?</p>
      <p>Cheers!</p>
