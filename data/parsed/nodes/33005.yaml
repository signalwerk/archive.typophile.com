      <p>Hi,<br>
      what is the video card and the amount of RAM on your old 700MHz system? These two factors are usually more important than the CPU speed for WPF rendering engine. For example, WPF engine requires a modern video card for hardware acceleration. This doesn't have to be the very newest card, even a 2 year old card like ATI Radeon 9800 Pro is usually sufficient. In the absence of a modern video card, WPF has to use a slower rendering logic.</p>
      <p>As of Windows Vista, the version of ClearType in GDI does not support the color amount adjustment.</p>
      <p>One thing that can noticeably help with both GDI and WPF is using new fonts that have been hinted for ClearType rendering. For example, "Segoe UI", "Verdana" and "Calibri" look great. On another end of the spectrum, condensed faces at small sizes usually show color fringes.</p>
      <p>I cannot comment on the future changes in Windows and WPF at this point. In particular, I can neither confirm nor deny possible changes in the text rendering engines.</p>
      <p>I can, however, assure you that we do listen to the customer feedback like yours, and it's much appreciated.</p>
      <p>Best regards,<br>
      Mikhail Leonov<br>
      WPF Text Team, Microsoft Corporation</p>
