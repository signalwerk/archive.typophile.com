    html: |-
      <p>Let me add my two bits in hopes that it sheds more light than it adds to the confusion.</p>
      <p>Most of what we do with text is in some way or other integer-based. TrueType fonts start out from advance widths designed in integers, and end up on devices made up of an integer number of pixels. The problem is that, once these advance widths are scaled down to a targeted type size and device resolution, they are non-integer. What to do with this intermediate state?</p>
      <p>Method A: Round the intermediate advance widths to the nearest integer and lay down one rounded character after the other. Since some characters may round down, while others may round up, one would think that, on average, things will work out by the end of the line. In reality, sometimes it does, but sometimes it doesn’t.</p>
      <p>But why does this matter? For short, whenever an exact translation of the length of a piece of text from the designed world to the device world is important.</p>
      <p>Take, for instance, a short caption of an icon or a window title. Translate the designed length of the caption into pixels, separately add up the rounded advance widths, and compare the two numbers. Maybe, by separately adding up the rounded advance widths (i.e. by laying down one rounded character after another) you end up with a few more pixels, or a few less, due to all the intermediate rounding, but hopefully you can still fit the text into the window title or somehow arrange it underneath the icon.</p>
      <p>Dialog boxes and menus are a slightly different story. You’ve probably all seen a dialog box that was jam-packed with items, but that just about fit the smallest acceptable form factor (“designed for 640 x 480” or such-like), because at that particular type size and device resolution, it happened to “add up to a few pixels less.” Now display that same dialog box at 120 dpi, instead of 96 dpi, and be ready for an unusable or at least unaesthetic dialog box, because at 120 dpi it happens to “add up to a few pixels more,” and dialog elements get truncated (assuming the jam-packed control panel was aesthetic, in the first place, but that would be another thread).</p>
      <p>Browsers, word processors, and presentation software are another story. Imagine you’ve just spent the whole day working on your résumé and push the print button to send that résumé to a potential employer. Most likely your printer has a different dpi than your screen, and hence your printed résumé may reflow using Method A—probably not to your liking. Similarly, imagine you have spent days on an important presentation for a potential customer and are about to present using your customer’s projection device. Another candidate for reflow. Browsers seem to more or less “naturally” reflow, yet most web-sites are designed like dialog boxes—in pixels—with results well known to anyone who has ever tried to use the www at a dpi in excess of 96.</p>
      <p>Enter Method B: Round the intermediate advance widths to the nearest integer, but separately add up the designed advance widths, and translate the designed partial text lengths into pixels after each character. As discussed in Method A, these two numbers may or may not be the same, but here is where method B differs. If the difference between the two “adding methods” exceeds a set threshold, then adjust the positioning of the characters to what you got from translating the designed partial text length into pixels. Like so, you can easily take your document, presentation, dialog box, web-site, whatever, from one device to another, from your 96 dpi desktop to your 120 dpi laptop or 1200 dpi printer, and it will always look the same. No reflow, no truncated dialog box elements, it “just” works.</p>
      <p>But it comes at an enormous price, typographically speaking. You have lost control over inter-character spacing. Now, one might think that, in a piece of text that consists of more than one word, it should be possible to “absorb” the difference between the two “adding methods” in the inter-word spacing. In other words, use Method A for the length of the word, switch to Method B for the blank between two consecutive words, and we’re “re-sync’d” to Method A at the start of the next word. In reality, sometimes this works out just fine, but sometimes it doesn’t: one word runs into the next, all but obliterating the blank, or even partially overwriting the next word, hence Method B. Depending on your luck, or absence thereof, text looks like the “Goosefoote Bridge” described by David Berlow (or even worse—by the time I notice it myself it’s usually a typographic disaster).</p>
      <p>Enter Method C: This method assumes that we have a rendering method other than strict bi-level (black or white), such as ClearType. In ClearType, we imagine we can break up a pixel into an integer number of “virtual pixels,” we render characters as if we actually had that many virtual pixels, and we finally translate a set number of virtual pixels into an RGB value. Along with that comes the opportunity to use Method B applied to virtual pixels, instead of physical pixels. We still make “adjustments” every so often, but each time we adjust only by a “virtual pixel.” This method is often referred to as “sub-pixel positioning.” Notice that the word “sub-pixel” may be ambiguous, since on an LCD the physical pixels are (physically) partitioned into three sub-pixels, having the colors red, green, and blue, but we can readily imagine (and implement) a virtual pixel size that is a fraction of the physical sub-pixel.</p>
      <p>Again, this comes at a price. In Method A, we can optimize each vertical stroke to look its best (“sharpest”) in black-or-white, standard font smoothing (a.k.a. grey-scaling), ClearType, etc. We’ll simply forward any rounding errors incurred in the process to the right side-bearing point. Let the advance width adjust to the sum of the positioning errors, since we’re going to place the next character strictly adjacent to where the previous character ended. In Method B, we could do these optimizations, but at the risk of exacerbating the “Goosefoote Bridge” problem. In Method C, we simply cannot do any of these optimizations (and hence cannot use black-or-white) because we don’t know upfront at which “virtual pixel” within a physical pixel a glyph will start, once laid down to the device. In other words, at small type sizes and low resolutions, it may look blurry (or whatever your preferred taxonomy may yield as adjective here).</p>
      <p>It’s a case of can’t-have-your-cake-and-eat-it-too, and a whole palette of cases in-between and beyond. Use Method A in hopes that the application handles reflow and dynamic layout gracefully or intelligently. Use Method B in hopes that the font’s hinting hasn’t made it deviate too much from its designed advance widths. Use Method C in hopes that the device resolution is high enough that it doesn’t look too blurry.</p>
      <p>In hopes that this helps to disambiguate, Methods A and B could be understood as integer spacing methods, while Methods B and C could be understood as linear spacing methods. Consequently, in that sense, Method B could be understood as a linear integer spacing method. Methods A and B position character to full pixel boundaries, while Method C positions characters to fractional pixels. Likewise, while all three methods may be understood as scalable, Method C is the closest approximation to linear scalability.</p>
      <p>I assume David Berlow has developed a method that could be described as a variant of Method A that goes beyond individually optimizing vertical strokes of individual characters. Optimization of a (last) stroke of one character, when placed adjacent to another character with a similarly optimized (first) stroke, may depend on the particular pair of characters involved in the optimization process. If this can be handled by contextual glyph substitutions, if the world at large would stop printing their résumés, if the web-designers at large would stop designing their web-sites to pixels, and if the software designers at large would start designing their software for intelligent layout/reflow, this could be the solution for today. After all, who wants to kill all those trees if they could be saved by software, and what’s a page, anyway, when my screen likely is not the same size as yours?</p>
      <p>Until we’re in “Avalon” (no pun intended) there may be some transitional pains. Notepad and the browsers use Method A, but few web-designers are aware of pixel-independent layout, and probably even fewer software designers are familiar with intelligent document layout and reflow (not that I would call Notepad a document editor to begin with). Word and PowerPoint use Method B (or a variant thereof), but few customers are aware of the limitations of linearly scalable layout and rendering of small text on low resolution devices—they’d merely interpret reflow upon printing as a serious bug. WPF uses method C, but few display devices have a sufficiently high resolution to make the potential blur a moot point for everybody.</p>
      <p>Some people are ok with the blur in Method C, some aren’t. Anecdotal evidence suggests that some people are fine with Method C when reading continuous text at 96 dpi (e.g. Times Reader, etc.) but not in UI scenarios. Many people are fine with the colors of ClearType, even at 96 dpi, but a few aren’t. John Hudson writes how he switches back and forth at 96 dpi, but not at 144 dpi. I’m experimenting with grey-scaling down to 8 pt at 96 dpi, with vertical stroke positions optimized for maximum contrast, and often find it easier on my eyes than unoptimized ClearType at the same size and resolution.</p>
      <p>There’s no silver bullet that I could see (not that I ever liked bullets in the first place). What may be optimal for one person doesn’t work at all for another. What looks nice may not “read nicely” even to one and the same person. In that sense I can easily agree with both David Berlow and John Hudson. To my eyes and at 96 dpi, Method C doesn’t read as well as Method A. It reads “blurrily” to me. Conversely, at 144 dpi, I don’t see a problem with Method C. It looks and reads just fine to me. Comparing Method A and B, as posted by David Berlow in another thread (<a href="http://typophile.com/node/32774" title="http://typophile.com/node/32774">http://typophile.com/node/32774</a>), I have a harder time. It may depend on the font, hinting, and ppem size. In the posted example, Method A (left) looks nice, but doesn’t read like entire words to me. Conversely, Method B (right) reads more like entire words to me, but doesn’t look as nice as A. It’s as if, in an attempt to make stems repeat and serifs space, the words are spaced out a tad too much (left). Mind you, these are the words of a physicist and the eyes of an ophthalmic anomaly.</p>
      <p>About repetition and John Hudson’s example of John Baskerville: Reminds me of Robert Bringhurst, my MIDI drum machine, and Theophrastus Bombast von Hohenheim (a.k.a. Paracelsus). Bringhurst suggested, if I remember correctly, that rigorous or stubborn repetition may make text look lifeless. These are merely my words, mind you, with limited typophile eloquence, and with limited typographic knowledge. But it reminds me of the “music” my drum machine can make. On all but the dullest techno rhythms, I would consider it a glorified metronome, but not a drummer. On the other hand, it is way better at keeping time with the beat than a beginner drummer. Like Paracelsus said: It’s the dose that makes the poison.</p>
      <p>Hope this helps, Beat</p>
      <p>P.S. for J P Knox: the monitors John Hudson and myself are looking at are Dell Inspiron 8500 laptops, 15.4” diagonal, 1920 x 1200 pixels. I got mine in 2003 and love how text and photos look on this screen. Many web-sites are another story (including typophile.com—given the type size I see on screen I strongly suspect their css specifies the font size in pixels. So much for scalability).</p>
