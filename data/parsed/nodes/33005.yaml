      <p>the second example shows cambria in a non-integer-spacing-app on the left, and in a integer-spacing-app on the right. (right sample looks much more pleasant to read to me.)</p>
      <p><cite>So, back to my font: It is serif, it is cleanly drawn and carefully hinted to produce precise spacing only. Thus, I know at every size where every “1/2” pixel is missing or extra.</cite></p>
      <p>"at every size?" so the font is supposed to be scalable? i thought your method was about making masters for each ppem size...</p>
      <p><cite>There are near 100 combinations like this in the specimen, that if treated with contextual subsitution will bring us as close as we’ll get to print, ...</cite></p>
      <p>i don't get it... contextual substitution?! are you saying you want to have different versions of the same glyph, instructed/spaced differently, selected according to the context? this sounds crazy. if the goal is to adjust a pair of characters, why not use kerning pairs? (because the font is scalable and the adjustment is ppem-specific?) i must be missing something... (your sense of humour?) :-)</p>
      <p>i really want to understand this, any clue would be appreciated... thanks.</p>
