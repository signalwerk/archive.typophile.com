      <p>"Ah, Publisher. Which version? "<br>
      Are you saying this might not be the first version?;)</p>
      <p>I don't find WYSIWYG type alarming unless it's being applied to a reader-like application. In such cases (i.e. some idiot has a reader to print his paper from), the application wildly reformats the page for printing anyway, so you couldn't call the situation WYSIWYG anyhow. (the user can e.g. have the window set for anywhere from 2 to four columns, and no one cares where or on what page the text ends, it's all done on the fly, there is no reflow issue because flow is always free. So, why make it WYSIWYG? I'm confuseD. But that's not quite all...the reader is too. It's printer services exhibit something I have never seen in any implementation of printing in nearly 30 years...the user cannot edit the "page range" to be printed, it is an "all-or-nothing" per article choice. Not a huge deal, but the fact is, if the printer can't offer the user a choice of pages to print, it's not likely that the user cares what is on which page, and thus, WYSIWYG does not exist as an intelligent motive for screwing up the type on the screen, even if  only  a  little   bit.</p>
      <p>Cheers!</p>
