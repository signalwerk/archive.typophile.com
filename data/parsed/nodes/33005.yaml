      <p><a href="http://channel9.msdn.com/ShowPost.aspx?PostID=147312" rel="nofollow">This video</a> is probably not going to teach anyone here new things about ClearType, and it is a bit old, but it's still interesting to hear Bill Hill discuss developments and history of ClearType. He mentions at one point that they have ClearType version 7, but alas it is only supported in WPF apps.</p>
      <p>I've come to realize that I'll need a higher dpi display to get the best results from ClearType. I got my <a href="http://www.viewsonic.com/support/desktopdisplays/lcddisplays/xseries/vx500/" rel="nofollow">15" LCD</a> (85ppi) when they were quite new, a top-dollar MVA (30ms!) model which was "state of the art" at the time. The articles I was reading then suggested that "Longhorn", which was expected by 2005 [!], would be resolution independent, encouraging the development of 200dpi+ monitors. But there has been no development in this area since IBM developed that 200dpi display back in '98 or so. (The only one I could find outside of laptops and PDAs is <a href="http://radiforce.com/en/products/col-r31.html" rel="nofollow">Eizo's R31</a>) I'm beginning to wonder how the transition will work from 100dpi to higher—since the OS and most apps still rely on bitmapped interfaces which won't be usable at those ppis—and whether we'll begin to see high ppi screens in five or even ten years!</p>
