      <p>Hi,<br>
      WPF uses a different method of ClearType text rendering compared to older Windows components such as GDI and GDI+. The new method allows more precise control over gamma correction, text contrast and the amount of color used.</p>
      <p>By the way, we recognize that the current situation is confusing, and your feedback is important to us.</p>
      <p>Please let us know if you have any specific concerns, and best regards!</p>
      <p>Mikhail Leonov<br>
      WPF Text team, Microsoft Corporation</p>
