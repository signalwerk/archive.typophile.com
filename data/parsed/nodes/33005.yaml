      <p>It isn't divining by trial and error that alarms me, it is that the kerning units are points, and they're independent of the type size. So if you reduce the space between two letters by 2pts at 24pt, and then decide to change the type size up or down, the kern adjustment becomes larger or smaller relative to the type size.</p>
