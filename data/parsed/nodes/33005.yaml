      <p>David: <em>Despite the fact that you can barely “see” this at actual size, it is there when you read it. All letters should repeat. All stems that were the same color in the type should be the same color(s) pattern in the font.</em></p>
      <p>I'm not convinced that this is universally true, although there is obviously a threshold at which differences in rendering become differences in density (as happens much more obviously in Adobe and Apple subpixel rendering), which I do think is a problem. I've read a lot of books printed using a lot of different type and press technologies from the past 250 years -- and I have lots of earlier ones too, but tend not to read them because my Latin and Greek aren't that good -- and one thing I can say about pretty much all of them is that it is very, very rare for letters to repeat, i.e. for the 'rendering' of the same letter to be identical more than once. The range of factors affecting how letters differ in print -- worn sorts, inking, impression, press speed -- is much greater than anything affecting the variation in sub-pixel positioning.</p>
      <p>The image below shows a sampling of the letter <em>a</em> on one page of John Baskerville's edition of 1760 edition of Milton. The range of variation across multiple pages is much greater, due to differences in inking and impression, even considering just how good a printer Baskerville way.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Baskerville-a_6618.jpg"></div><p></p>
      <p>I think what is important is not repetition of form, per se, but specifically repetition of density. If what you are saying is that at low resolutions the variation in rendering in ClearType is producing unacceptable variation in density, then I'd be inclined to agree with you if I were not using a 145 ppi screen. I find CT rendering problematic at less than about 115 ppi, specifically because of density breakdown: the pixels at those sizes are large enough for the stroke contrast to be degraded. CT still looks better than greyscale antialiasing of small type at such resolutions, but not as good as b/w bitmaps. I find that on my little Panasonic laptop (96ppi) I turn CT on and off quite frequently, depending on what kind of work I am doing.</p>
      <p>So I don't think the problem is non-repetition per se.</p>
      <p>By the way, David, what application did you use for the left-hand specimen of the Cambria rendering in your last illustration but one?</p>
