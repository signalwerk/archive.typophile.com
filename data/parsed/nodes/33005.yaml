  html: <p>I've been bothered lately by the limited control that I'm able to exert on font display in XP with the ClearType Power Toy. It got me thinking about how there used to be a variety of controls for CoolType in Adobe Reader, back in version 5 or 6. So I did some googling to see if there have been any updates in either ClearType and/or the ability to control its behaviour. I came across <a href="http://msdn2.microsoft.com/en-us/library/aa970267.aspx" rel="nofollow">this article</a> about registry settings for displaying ClearType in the Vista environment. But it seems that this is also supposed to be backward compatible with XP, through .NET 3.0. I have .NET but I don't see any such registry settings. Does anyone know more about this and how I can exert more control over how XP displays type? Thanks in advance.</p>
  html_clean: <p>I've been bothered lately by the limited control that I'm able to exert on font display in XP with the ClearType Power Toy. It got me thinking about how there used to be a variety of controls for CoolType in Adobe Reader, back in version 5 or 6. So I did some googling to see if there have been any updates in either ClearType and/or the ability to control its behaviour. I came across <a href="http://msdn2.microsoft.com/en-us/library/aa970267.aspx" rel="nofollow" class="link-external">this article</a> about registry settings for displaying ClearType in the Vista environment. But it seems that this is also supposed to be backward compatible with XP, through .NET 3.0. I have .NET but I don't see any such registry settings. Does anyone know more about this and how I can exert more control over how XP displays type? Thanks in advance.</p>
