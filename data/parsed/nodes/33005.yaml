      <p>"I’ve come to realize that I’ll need a higher dpi display to get the best results from ClearType"<br>
      That is best, if you can afford it, a simple climb up the resolution latter is what I'd do too, if I was not committed to the whole market.</p>
      <p>"what’s the difference between left and right columns?"<br>
      That's what you're supposed to tell me!</p>
      <p>"I’m not aware of any specific examples."<br>
      Bummer. I would be nice if both reader and explorer used OT and integer spacing just about NOW! Oh well. Time to make the browser, ;)</p>
      <p>"May I ask why you would like to know this?"<br>
      It is my pleasure to answer thus:<br>
      Human readers are accustomed old style. Old Style has serifs. Spacing serif fonts (at low res), is easily disturbed by even a 1/3 of a pixel in the "wrong place"</p>
      <p>So integer spacing is best, but not required for type to superficially look readable, I guess.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/E_5439.PNG"></div><br>
      This is one of the CT Collection's serif fonts. The left looks readable, but about two paragraphs down from what you see here, it starts to fray my brain. (See "car traffic" and "Goosefoote" for examples of what does not happen in print but happens all the time in CT.) The right is the same output to Explorer, an integer spacing app. Looks better, but there is no possibility for further spacing refinement because this font was not made in such a way as to accept such refinement —Not a big deal, how was anyone to know?! It was only ever compared to "even worse" — never to what is "best".<p></p>
      <p>So, back to my font: It is serif, it is cleanly drawn and carefully hinted to produce precise spacing only. Thus, I know at every size where every "1/2" pixel is missing or extra. E.G. I know that the single-serif-on-the-left-side of the letter letters j p and u, can be treated when they meet single-serif-on-the-right-side of the letter letters like u. There are near 100 combinations like this in the specimen, that if treated with contextual subsitution will bring us as close as we'll get to print, without the timber or universal resolution upgrades. Then, and only then, there are ligatures to add. ;)</p>
      <p>So if someone says, "Let's make explorer subpixel position CT", please kiss their ass goodbye. But if someone says, let's add OT to Explorer, or make a integer spacing mode for the Reader app, kiss their ass for me. </p>
      <p>Cheers!</p>
