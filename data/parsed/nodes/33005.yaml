      <p>Hi,<br>
      WPF uses different rendering logic for older video cards, but in general the quality should be comparable to the newer video cards.</p>
      <p>How does the PI newsreader application look on your machine?</p>
      <p>You can download it from <a href="http://seattlepi.nwsource.com/newsreader" title="http://seattlepi.nwsource.com/newsreader">http://seattlepi.nwsource.com/newsreader</a>, registration is free.</p>
      <p>In case WPF V1 text looks blurrier than GDI for you, this excerpt from a post I made on the subject in MSDN Forums (<a href="http://forums.microsoft.com/msdn/showpost.aspx?postid=1376773&amp;siteid=1&amp;sb=0&amp;d=1&amp;at=7&amp;ft=11&amp;tf=0&amp;pageid=2" title="http://forums.microsoft.com/msdn/showpost.aspx?postid=1376773&amp;siteid=1&amp;sb=0&amp;d=1&amp;at=7&amp;ft=11&amp;tf=0&amp;pageid=2">http://forums.microsoft.com/msdn/showpost.aspx?postid=1376773&amp;siteid=1&amp;s...</a>) may be helpful:<br>
      "The fundamentally complex problem of linearly scalable layout and rendering of small text on low resolution devices is well known in the industry. Various software products have tried different approaches to solve this. Since hinting and rounding involved in rendering small characters necessarily affects letter spacing, all approaches I'm aware of involve compromising between vertical text stem sharpness and character spacing. The first released version of WPF uses a subpixel positioning algorithm that places characters very close to their lineraly scaled positions at the expense of varying the vertical stroke sharpness.</p>
      <p>Other software products use their own unique techniques - a good exercise is to compare how the same text snippet is rendered in Notepad, Word, Visio, WinForms, Adobe Reader, Apple Mac OS X, Adobe Flash, etc.</p>
      <p>While I cannot elaborate on the future changes in WPF at this point, I can list some simple things that help the appearance of text in WPF today:<br>
      1. Use modern Vista fonts hinted for ClearType rendering.<br>
      2. Use font sizes larger than 8pt for Latin text, and larger than 11pt for East Asian text.<br>
      3. Use higher contrast text foreground/background combinations.<br>
      4. Use displays at their highest native resolution that possibly allows enabling the high DPI Windows setting. This especially helps with latest laptops, where 120dpi is quickly becoming a norm.<br>
      5. Make sure text rendering settings are tuned with the ClearType tuner."</p>
      <p>Please let me know how it goes, and best regards,<br>
      Mikhail</p>
