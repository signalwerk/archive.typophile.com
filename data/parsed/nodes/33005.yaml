      <p>Beat, thanks for joining us, I was feeling outnumbered ;) I will read 'n respond seperately to yours, but wanted to post my responses from above yours first...</p>
      <p>"I’m not convinced that this is universally true"</p>
      <p>..nor did I say it was. But whether you like it, know it, feel it, believe it understand it... or not, what many readers of Latin Script apparently expect is my type, my text, my quality. </p>
      <p>"The image below shows a sampling of the letter on [] one page of John Baskerville’s edition of 1760 edition of Milton. The range of variation across multiple pages is much greater," </p>
      <p>lol. Oh? I'm interested in the relationship between letterpress and Cleartype John, but not now, because the difference 'twixt a book printed when America had a King and what we are seeing here in CT with non-integer spacing are, in Reality is not related.</p>
      <p>None of that is even to the point, that the use of a subpixel positioning application to bring news text to users is unnecessary and inferior. I have a Constantia proof that shows this at 144 dpi 12 pt. if John's acuity rises, then I will show him. </p>
      <p>(I'm wondering by the way, if John has decided whether he likes Cambia or Constantia more these days. A year ago you c o u l d n 't   d e c I d e. Now that I've looked closely at the two in CT, I understand why. . . Cambria is for all intents and purposes the condensed of Constantia at small sizes. Duh.) </p>
      <p>Meanwhile our friend Leonid can help proof, if he is courageous and truly wants to "know" by setting 3 ppg of Cyrillic and showing them side-by-side, integer and subpixel positioned. This will bring to the fore how lucky we are in Latin Cleartype, lol.</p>
      <p>Google advanced search "Hate Cleartype"; </p>
      <p>"Frankly, I hate cleartype in Vista, no matter how you've tuned it. It is blurry - in fact, cleartype is nothing more than a sophisticated application of a ..."</p>
      <p>"Not because we either love or hate cleartype (and there are definitely camps ... Lesse, we hate cleartype because we find the fonts already used to be crisp .."</p>
      <p>"Personally, I hate ClearType since the text looks somewhat blurred IMHO. "</p>
      <p>"I must say even with a good clear LCD monitor I still can't stand that ClearType font. Just way to blurry for my liking. I have downloaded the Windows ..."</p>
      <p>"I don't know caffenero, I hate ClearType with a passion. It looks a bit better on LCDs than CRTs, but in both cases it's inferior to my eyes. ..."</p>
      <p>"I hate cleartype. I've been using computers for 20 years and that one of the worse *forced* regression I ever had. I am hyperopia and I use a 24" vertical ..."</p>
      <p>"I hate cleartype. It gives me a headache. I must be in a small minority. Vista lets me turn off cleartype but all the type still looks awful. ..."</p>
      <p>I didn't ask for any of this. I don't agree with some of it, but I know<br>
      e x a c t l y where it is coming from, I know how to fix it and I intend to try. I think it's only because I'm not a sacred cow herd, but we'll see.</p>
      <p>And, to be fair: "Hate Cleartype" found only 315 while "Love ClearType" found 1,210. But has this EVER had to HAPPEN BEFORE!?</p>
      <p>Cheers!</p>
