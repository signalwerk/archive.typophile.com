      <p>Sure, here is a bit of history.<br>
      Avalon was an internal codename for what is now known as WPF. Originally Avalon was supported only on Longhorn, but after receiving developer feedback about the importance of being able to ship Avalon applications on XP, a decision was made to support Avalon on XP as well.</p>
      <p>Note that Vista includes WPF in the box, so on Vista WPF applications are supported just as well as GDI+/Windows Forms applications. External developers are already starting to take advantage of the platform. Apart from well publicized applications such as NY Times Reader, there are other examples at <a href="http://msdn2.microsoft.com/en-us/netframework/bb330852.aspx" title="http://msdn2.microsoft.com/en-us/netframework/bb330852.aspx">http://msdn2.microsoft.com/en-us/netframework/bb330852.aspx</a>. This situation is somewhat similar to XP being the first OS to include GDI+, which can also run on Windows 2000.</p>
      <p>Now, GDI is somewhat special, in that it's a very mature and widely used technology that's been available on Windows pretty much from the beginning. Because of this, any changes made to it have a risk of introducing compatibility issues with existing Windows applications. This alone makes it quite risky and expensive to modify the way it does things. Having said that, technically it's not impossible to improve ClearType in GDI, it's just that the costs are pretty significant.</p>
      <p>While I cannot commit on any future improvements at this point, my team is very interested in hearing your feedback, please keep it coming.</p>
      <p>I hope this helps, and best regards,<br>
      Mikhail Leonov<br>
      WPF Text Team, Microsoft Corporation</p>
