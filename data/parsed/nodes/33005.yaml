      <p>Beat said"<br>
      "who wants to kill all those trees if they could be saved by software, "</p>
      <p>Exactly — I'm in a place a little further down the road now, thought trees continue to stand behind everything I say here. Microsoft Corporation has created a domestic demand for a kind of product (120dpi and up screens), not made in the US. The place where the products are made, needs the product more than "we" do, typoecologically speaking, imo. So, I'm working on solving the problem of news text with the generous resolution of 96 dpi in readers and I think it important to a couple of things that we don't encourage the US/latin market to run out and buy more resolution to solve a (typotechnically) unrelated problem. :-o Don't you!?</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/144dpi_3717.Con.sim.PNG"></div><br>
      John's request. left is publisher, right is explorer (with only leading tweeked to match).<br>
      I should warn you, there are two issues playing on the left side, spacing and weight of s and g. On issue, te later on the right side, so don't become confused, the right is still far superior for the reader reader. <p></p>
