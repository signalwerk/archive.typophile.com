      <p><em>Can you explain what it means to be “hinted for Cleartype rendering”?</em></p>
      <p>I'd say that 'hinted for ClearType' can mean a number of different things. For example, Mikhail mentioned Verdana earlier, which was obviously not hinted for ClearType in an intentional sense because ClearType did not exist at the time Verdana was made, but it is hinted (and designed) in a way that happens to work very well in ClearType rendering.</p>
      <p>Then there are fonts like those in the CT collection, which were designed around the sub-pixel rendering model used in ClearType, and hinted according to a particular model which involves very little x-direction hinting and instead allows the renderer to largely control things in that direction. [The final shipping versions of these fonts also contain some greyscale-specific hints, largely because Word 2007 turns of CT above a certain size in order to get smoother horizontal curves. WPF, on the other hand, implements the newer CT model with integrated y-direction anti-aliasing.]</p>
      <p>Then there are fonts the like of which I have never actually seen, which have the INSTCTRL selector flag 3 set in order to have the renderer apply the full TT instruction set including x-direction deltas, allowing the hinter to control the x-direction rendering much more precisely than in the default CT setting. This could be very cool. And also a lot of very fiddly work.</p>
      <p>Then there are fonts like the ones David is making, which conceivably wouldn't need any hinting at all, with outlines designed to produce an ideal screen rendering at specific sizes.</p>
