    html: <p>I tried to do what I claimed could be done, and I admit I needed to play with outlines more than I thought I would have to, but here is my clumsy attempt to re-create this using Agfa's TC Europa Bold. You can see my skill with outline manipulation in Illustrator is not very polished, but this only took about 15 minutes.  <br><img src="http://www.typophile.com/forums/messages/83/27204.gif" alt="Mau Europa Simulation"></p>
