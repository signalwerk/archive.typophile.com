      <p>Hi Mark,<br>
      welcome to Typophile!<br>
      <a href="http://www.fontshop.com/fonts/downloads/fontfont/ff_schulbuch/" rel="nofollow">FF Schulbuch Nord</a> is essentially a ‘Helvetica Infant’. So is <a href="http://www.identifont.com/show?HG6" rel="nofollow">AG Schoolbook 2</a>. Monotype offers a bold version (only) that features a number of different letterforms (y, I) under the name of <a href="http://www.fontshop.com/fonts/singles/creative_alliance/special_alphabets_10/" rel="nofollow">Special Alphabets 10</a>.<br>
      F</p>
