  html: |-
    <p>Can anyone help me find which font is close to the following former SEC logos:</p>
    <p>a.) 2001 SEC Championship Game (emphasis on 'SEC' and 'Championship')<br>
    b.) 2002 SEC Championship Game (emphasis on 'SEC' and 'Championship')<br>
    c.) 2003 SEC Championship Game (emphasis on 'SEC' and 'Championship')</p>
    <p>It would be much appreciated.</p>
