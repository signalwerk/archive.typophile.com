      <p>The metal face Berthold published varied hugely from size to size.<br>
      For instance, if you look at the early 1950s specimen book, you'll see that some sizes have angled endings to the terminals on S while others have a flat ending, as the clone Helvetica would. Subsequently, AG has become associated with the angled terminal on that letter and c and e, diverging from Helvetica.</p>
      <p>Transferring to phototype, most notably with the Diatronic (what a great name) system, these size differences were standardized, because one master design was used for all sizes. So the redesigners had to choose which size to use as the model, or which combination of features from different sizes, to work best across a range of sizes. Of course, there were differing interpretations.</p>
      <p>I don't think any particular version is best. It depends on what you use it for, and why you like it. If one version gives you the Brockmann vibe, and that's something you can relate to, that's cool. </p>
      <p>I used to like AG, Helvetica, Univers and Folio etc., 25 years ago, but have "been there done that" and am now more interested in newer ideas of what a sans serif can be, and also older ones!--like how the genre originated way back in the 19th century.</p>
