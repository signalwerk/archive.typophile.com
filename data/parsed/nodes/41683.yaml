      <p>More than a hundred years ago Berthold (a typecaster that had acquired quite a few other firms) consolidated several cuts of typefaces (from multiple sources) in the then extremely hip and desirable style of sans serif under the brand 'Akzidenz Grotesk'.<br>
      These fonts had no other relationship than a common style. But they were all the rage. Smart marketing.<br>
      (In a way it is one of these cases where a common name turns into a brand. Akzidenz Grotesk is a very descriptive name, roughly translates to 'Jobbing sans type'.)</p>
      <p> . . .<br>
      Bert Vanderveen BNO</p>
