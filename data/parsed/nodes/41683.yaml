    <p>Berthold Akzidenz Grotesk BQ Medium<br>
    <a href="http://www.myfonts.com/fonts/berthold/akzidenz-grotesk-bq/medium/" title="http://www.myfonts.com/fonts/berthold/akzidenz-grotesk-bq/medium/">http://www.myfonts.com/fonts/berthold/akzidenz-grotesk-bq/medium/</a></p>
    <p><a href="http://www.myfonts.com/fonts/berthold/ag-old-face-be/" title="http://www.myfonts.com/fonts/berthold/ag-old-face-be/">http://www.myfonts.com/fonts/berthold/ag-old-face-be/</a></p>
    <p>Could someone explain all these differences and why is there so many versions? BQ, BE, Next?<br>
    And what is with AG Old face - is that Akzidenz Grotesk too, in info it says:<br>
    This design emphasizes the 19th Century hand-setting roots of the original Akzidenz-Grotesk.</p>
    <p>In the end what version is the best? I sure like BE because of that lowercase a in medium weight, especially because of how  Muller Brockmann used it. Others?</p>
    <p>Thanks.</p>
