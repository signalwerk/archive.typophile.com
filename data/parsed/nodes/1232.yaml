  html: <p>Hey everyone, it's my first time posting here. I've started working on a logo for a dentist and want to avoid showing a tooth or tooth brush and all of that. From what I know, he is an older dentist and would want something more on the conservative side. He is one of the only dentists in the region who does cosmetic dentistry (teeth whitening, replacing silver fillings with white ones and so on).  <br> <br>Let me know what you think. <br> <br><img src="http://www.typophile.com/forums/messages/29/15915.gif" alt="dentist logo"></p>
