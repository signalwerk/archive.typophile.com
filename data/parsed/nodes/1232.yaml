    html: <p>Hi David! I really like the mc monogram. One thing you could try on that is using a heaver "c". <br> <br>The horizontal rule and type alignment, however, are unbalanced. You might be better off eliminating the line and center-aligning "Michael Contardo" with the monogram. A smaller point size might help the balance, too. <br> <br>Paul</p>
