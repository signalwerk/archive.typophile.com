      <p>It's wonderful and I don't think it's been digitized. <a href="http://www.flickr.com/photos/stewf/tags/taxidriver/">Here are my (non-squooshed) snapshots.</a></p>
      <p>If you're interested in the shadowed variation you might dig <a href="http://www.myfonts.com/fonts/cubanica/cuba/?refby=typographica">Cuba</a>. For the rest, have a look at <a href="http://www.fontshop.com/search/?q=Unovis+OT">Unovis</a>.</p>
