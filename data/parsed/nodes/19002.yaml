      <p>That’d be Nick Curtis’ <a href="http://www.moorstation.org/typoasis/designers/curtis/pages/t.htm" target="_blank">Tucson Two Step</a>.</p>
      <p>The inspiration was a luggage sticker from a Tucson Hotel per Nick’s ReadMe. Thanks to Sander de Voogt’s <a href="http://home.planet.nl/~voogt053/" target="_blank">archive of all things Nick</a>, we can read these references any time and, for some fonts, even see images of the <a href="http://home.planet.nl/~voogt053/Pics/TucsonTwoStep.jpg" target="_blank">original material</a>.</p>
