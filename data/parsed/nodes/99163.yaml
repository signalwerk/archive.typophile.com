      <p><em>for over a thousand years</em></p>
      <p>You're overestimating quite a bit! Even presuming that you are referring to the style of writing and not to a 'typeface' per se, this is a relatively late and specifically Ashkenazi style. It's known as the Vilna style because of its association with the famous edition of the Talmud printed at Vilnius in the 1870s, which in Jewish historical terms is only yesterday.</p>
