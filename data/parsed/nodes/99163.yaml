    <p>The classic Hebrew Typeface in the Jewish world for over a thousand years became known as the Vilna typeface. The most popular Vilna typeface was rhat of the Romm family printing press. Legend has it that Mr. Romm senior traveled to Italy, and commissioned the students of Bodoni to cut ancient drawings of this special letter form into the popular Hebrew typefaces, known as Vilna Romm.</p>
    <p>Below are examples of Vilna typefaces, including Vilna Romm.</p>
