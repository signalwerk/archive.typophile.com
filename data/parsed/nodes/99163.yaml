      <p>My understanding is that what the Talmud refers to as 'square letters' is a generic term for the Aramaic alphabet adopted by the Jews during the Babylonian exile, and is a term used to distinguish this script from the earlier Canaanite style that Solomon Birnbaum called Palaeo-Hebrew.</p>
      <p>The style of the Vilna types are exactly what one would expect the students of Bodoni to produce in the early 19th Century, regardless of what one gave them as a model. They clearly display the characteristic stroke modulation patterns of a steel split nib pen, a writing implement that did not exist 1,000 years ago. These modulation patterns are the hallmark of all Bodoni's types regardless of script; one sees the same thing in his Greek, his Cyrillic, etc.. I have numerous books on mediaeval Hebrew palaeography, and there is nothing in them that resembles the characteristics of the Vilna style in this respect. The basic structure of the Hebrew letter shapes were certainly well established in the Middle Ages, but the particular character of the Vilna style must be seen as a 19th Century innovation based on contemporary European writing tools and practices.</p>
