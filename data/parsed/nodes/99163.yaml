      <p>Israel: <em>for over a thousand years</em> </p>
      <p>John: <em>You're overestimating quite a bit!</em>  </p>
      <p>John,</p>
      <p>The classic style of writing used by Ashkenazic typesetters &amp; printers, and earlier by scribes, is really very old. It may actually have Sephardic origins!</p>
      <p>The Talmud discusses a 'square letter form' used for handwritten texts distributed in scroll form. In Rochester, NY I saw first hand manuscripts that featured the 'square letter form', which was very similar to the classic Vilna typeface. Also, we see in the Dead Sea Scrolls housed in Jerusalem and by the US Army, a very different square letter form was used by the Dead Sea Scroll scribes for the non-Biblical content, albeit not similar to the classic Vilna style.</p>
      <p>This was at the Rochester Institute of Technology (RIT), which houses one of the largest collection of Hebrew books and manuscripts in the world. I believe Hebrew Union College in Cincinnati, and the Jewish Theological Seminary (JTS) in Manhattan, have larger collections. The largest is in Paris.</p>
      <p>Frederick Goudy writes in one of his many books that the father of the Romm family, later the famous publishers of the classic and most popular version of the Talmud in Vilna, took ancient manuscripts (which he purchased at very great expense) to the students of Bodoni in Italy at the beginning of the 19th century. Hence, we see that the classic Vilna type design existed much before metal typefaces.</p>
      <p>If these manuscripts were similar to what the Talmud describes as a 'square letter form', then over 1,000 year is not an exaggeration, but rather an understatement (for the content of the Talmud is over 2,000 years old - see <a href="http://en.wikipedia.org/wiki/Talmud">http://en.wikipedia.org/wiki/Talmud</a> - "The Talmud ... (c. 500 CE), [is] an elucidation of the Mishnah and related Tannaitic writings that often ventures onto other subjects and expounds broadly on the Hebrew Bible".</p>
      <p>There is an excellent index to the Soncino Talmud, published to this day by Judaica Press <a href="http://www.judaicapress.com">www.judaicapress.com</a> and <a href="http://www.soncinopress.com">www.soncinopress.com</a>. You can look it up there.</p>
