    html: <p>What was the reasoning behind going from eight weights to six (i.e. dropping Book and Ultra Black)? I’d be curious about that.</p>
    html_clean: <p>What was the reasoning behind going from eight weights to six (i.e. dropping Book and Ultra Black)? I’d be curious about that.</p>
  - id: 569620
    user: 3834
    date: 2014-01-20T08:18:00
    date_raw: 20 Jan 2014 — 8:18am
    votes: null
    html: |-
      <p>I didn't think it was necessary to have so many.<br>
      Thin is still Thin, and the same weight as before. Ultra Black is now renamed as Black. I renamed it as I didn't think the original Ultra Black warranted that title. Besides, Precious Sans Two is a complete rework of the original Precious Sans and a vast improvement, so I wanted to differentiate the two.</p>
