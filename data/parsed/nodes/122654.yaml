    <p>I'd like to introduce Flat Sans, a humanist grotesque type family from Schizotype Fonts. Available now from  <a class="freelinking external" href="http://www.myfonts.com/fonts/schizotype/flat-sans/" rel="nofollow">MyFonts</a> and  <a class="freelinking external" href="http://www.fontspring.com/fonts/schizotype/flat-sans" rel="nofollow">Fontspring</a>, and currently stupidly discounted (if you can't beat 'em, join 'em!)</p>
