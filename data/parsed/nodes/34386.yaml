  html: |-
    <p>I'm doing a small 2 page report with a lot of text and I wanted to use a Humanist Slab Serif. I've tried PMN Caecilia and ITC Officina Serif, Caecilia has a rather large x-height and loose tracking, where Officina has a smaller x-height and rather condensed feel. Is there a similar font that would fall somewhere in between these two?</p>
    <p>Any suggestions will do.</p>
  html_clean: |-
