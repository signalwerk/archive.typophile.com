      <p>Grammar teachers often give rules they think are right, when it just sounds fussy and over-formal in reality. I used to teach grammar :)</p>
      <p>These days I tend to follow the Penguin style guide and the Campaign for Plain English guidelines: say what you mean and prefer spoken language to wordy constructions.</p>
      <p>I saw a sign on the train the other day: 'Emergency equipment is located on the train in the direction indicated', followed by an arrow. In my head I was correcting it: 'Emergency equipment this way'.</p>
