      <p>I'd go for a colon to introduce what is effectively a list, making it do the work that Fowler said it had made its own special function: 'that of delivering the goods that have been invoiced in the preceding words' (<em>Modern English Usage</em>, 2nd edn, rev. Gowers, p. 589). </p>
      <p>A list should either be separated into individual items either by semi-colons or by commas, never by both. Commas are used for most lists; semi-colons for lists in which one or more of the individual items already contain their own comma. As none of your items/examples contain their own commas, your list can be broken up with commas:</p>
      <p><em>Coaching works for people at all levels: for senior executives and decision makers with complex problems, for operational managers who would like support as they work to balance conflicting priorities, and for individual staff members as they put into practice new learning designed to help them work  more productively with others.</em></p>
      <p>An ellipsis, which conventionally represents omitted material, a trailing off, or a pause intended to produce or recreate a  'dramatic, rhetorical, or ironic effect' (<em>Oxford Guide to Style</em>, p 129), isn't - I think - correct, and creates an arch and confusing effect in such straightforward, technical prose.</p>
