      <p>I think title is good English...the style guides I've read say that 'For whom is coaching?' just sounds unnatural...is that what you meant? Maybe I could do 'Who can benefit from coaching?' and then take out the bit 'coaching works for people at all levels...'? </p>
      <p>I rather like semicolons for lists of long strings of text, they show more of a break than a comma would. I was thinking of bulleting it, but you can see the length of each item would be longer than a line and I don't have more space...always the same old problem with space!</p>
      <p>I think a colon might be the right answer. I don't know about space after an ellipsis and thought it looked unbalanced unless there was one in front too...I need a more comprehensive style guide!</p>
