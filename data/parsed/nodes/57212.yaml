      <p>I have a tendency to do the same thing with wordy lists (i.e. separating them with semi-colons whether or not they contain internal commas), but I'm always more-or-less certain I shouldn't be doing it, so I was grateful for a reason to pull out the various style guides on the shelf to find out why.</p>
      <p>The old <em>Hart's Rules</em> is where I usually run for a pithy rule about where and how to use punctuation, but it isn't very helpful on the matter of lists and the use of colons and semi-colons in and around them.</p>
      <p>I was given pause for thought by the fact that my third example in my list of uses of an ellipsis contained a couple of commas. Whether or not I was right in sticking with commas to divide the overall list because the commas only occurred within a piece of quoted material, remains to be seen.</p>
      <p>I'm sure someone will correct me . . .</p>
