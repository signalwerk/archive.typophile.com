    html: <p>^ you are right that a semicolon breaks clauses within a list where one or more clause contains a list that has commas. A colon is the right choice in the example, but somehow it always feels like having a flashing red and a stop sign at an intersection. Em dashes are great but really make a dramatic pause, and you usually need a set. In ad copy it is common to use non-sentence phrases without a subject and verb and treat them as a sentence. IMHO, parellelism and brevity are most related to comprehension. Sometimes the correct punctuation or usage, if not understood by the reader, causes more confusion. I still can’t give up “more than” instead of over. Oh well.</p>
