      <p>Those broad brush strokes impart a heck of a lot of emotion don't they. Kinda like you ...no? The black Arabic text holds everything down like a keel steadies a boat. So, for your branding why not use these very same design elements ... one element of broad passionate expression steadied by your discipline(s). The broad element could be an interpretation of a meaningful Arabic word and the text could be non-Arabic. </p>
      <p>@hrant ...there can be only one :)  Sorry about confusing the matter. I found that after I raed and viewed the interwebs entire content it was difficult to recall a specific item. Unfortunately I have only a 98% accurate photographic memory. The missing 2% always ... I mean always ... gets me in trouble.</p>
      <p>n.</p>
