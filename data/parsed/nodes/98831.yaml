    html: <p>Your range of expertise and interest reminded me of someone I only read about the other day, <a class="freelinking external" href="http://en.wikipedia.org/wiki/Nader_El-Bizri" rel="nofollow">Nader El-Bizri نادر البزري</a>, whose expertise spans and brings together phenomenology, Arabic sciences and philosophy, and architectural theory . That summation does not really do justice to everything that he does and how it translates into the world but what is clear in both cases is that your unifying point is your name, who you are is the most powerful statement of what you do. I'm afraid that I do not have a good suggestion about where to take that in terms of typefaces, but something bold and clear would probably work best.</p>
