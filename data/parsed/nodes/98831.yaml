      <p>Hello Malik and welcome to Typophile. Indeed, self branding is one of very challenging tasks that a designer/artist/anyone faces. Some create an identity according on how they perceive themselves at a particular time in their life; in this case their identity might change throughout their careers as they develop an individual way and style of doing things — this happens gradually, as you get more and more commissions from clients over the years you will see some patters in your work/life which is particular to you and someday eventually you will be able connect these patters and create a ‘final’ identity which you and people whom you work with will associate with you. Others, bearing in their minds that it's futile to exhibit all of their talents with just a logo settle for something neutral; like picking a font that they like or feel like connected to and base their identity around it. You can see this done by many famous companies and individuals i.e. <a class="freelinking external" href="http://www.researchstudios.com/" rel="nofollow">Research Studios</a>, <a class="freelinking external" href="http://www.apple.com/" rel="nofollow">Apple</a>, <a class="freelinking external" href="http://www.pentagram.com/work/#/all/all/newest//" rel="nofollow">Pentagram</a>, <a class="freelinking external" href="http://wallyolins.com/" rel="nofollow">Wally Olins</a>, etc.</p>
      <p>You mention that you like Futura, but you feel like it's too industrial. I think this has to do with the way you see things. If you asked me about the qualities of Futura then I'd say that Futura is a good choice for an activist because when I see it I associate it with energy and courage which I believe are good words to affiliate with the word activist. Of course the list could go on. However I must also mention that Futura has had it's time, try finding something more contemporary with the qualities that you are looking for.</p>
      <p>On the other hand you mention about your origins and that you also do calligraphy, in this case why don't you combine two types of styles in one. I don't know how you identify your self so I'm just gonna say that you could have part of your name set in Futura and the other part in something which looks handmade.</p>
      <p>All that I've written above is a long, vague hint of what you can do. Before you pick a name, the font and the style; if I was in your shoes I would collect images from magazines, movie shots, images of anything which are close to your heart and correspond to your lifestyle, your work, put them up on a wall and write down words that these images bring to your head. When you have the words you will be able to visualize new forms in your mind and hopefully come up with an image of how you want others to see you/your identity. Lastly, fortunately the market is full of books on self branding, a trip to the library or the bookshop is a good starting point — just be careful on what you pick.  Good luck!</p>
