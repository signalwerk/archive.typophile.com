    html: "<p>I like the overall appeal of the logo (I see that you have used the same font, which appears on the original logo and added some variation on the symbol). <br>   As Michael said, the 3 colored dots are unnecessary decoration. The repetition of the company name below Chasque is a redundancy. Michael's advice to use just \".net\" might be a good solution. <br> <br>If I compare the two logos. The conclusion will be that : You haven't made much alteration (I see that you have changed the right eye with a circle and added something that looks like a brow to the left). <br>The best thing about your re-design is that you got rid of the 4 face and tried to stick with one. <br> <br>Salute</p>"
