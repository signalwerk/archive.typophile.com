    html: <p>I'm a little confused about the 3 colored dots. The face mark looks like an abstract "Phantom of the Opera" mask. I like the logo type. Personally I don't like when websites include the url with the logo, but with the .net I can see why; maybe just add a smaller .net to the right of the "q" descender. Do you have to stick with the simplified face mark? I'd try to avoid the cult, circle motif they current have on their site. <br> <br>-q</p>
