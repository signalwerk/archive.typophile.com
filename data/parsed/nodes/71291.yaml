      <p><cite>… I really wanted to use "Futura" for headings</cite></p>
      <p>Allow me to point at “something like” Futura, but <a class="freelinking external" href="http://typophile.com/node/71254" rel="nofollow">much more smarter</a> – and brandnew.<br>
      For body text you may want to try Andron which is a ‘science typeface’ (quite new).<br>
      <a class="freelinking external" href="http://www.signographie.de/cms/front_content.php?idcat=145" rel="nofollow">There’s a free font</a> available.<br>
      If your text deals more heavily with Math characters, Minion-derivated fonts from typoma.org may also be a very good choice.</p>
