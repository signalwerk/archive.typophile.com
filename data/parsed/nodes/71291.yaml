      <p><cite>"Its a science poster, thinking cooler colors, lots of white as it will have a few hairline diagrams on it."</cite><br>
      I'm thinking a clean, more recent, but maybe not too slick sans for headings should serve you well. But it's hard (and doesn't make very much sense I think) to give concrete advice and suggestions at this point because your brief is so open. There are, at this point, literally hundreds of combinations that could work well.<br>
      Bear in mind that we mostly don't share your background knowledge for instance of what these posters usually look like in your discipline*, and how you would like to pull yours away. We also don't know what your layout will look like, how much text you have, how many titles; should the titles be readable from a distance, or do you expect people to walk up to the poster anyway? Also, are there going to be formulas or Math stuff, or just «plain English» text?<br>
      And especially for the headline face: I'm guessing it should mostly feel clean? – Also, techy / serious / friendly and accessible / unusual / …? Also, would you want your poster to look consciously designed (suggesting a more unusual typeface maybe), or mostly just  nicer-looking than your average science poster?</p>
      <p>So if you could narrow down a bit (1) intended setup/structure/layout, (2) requirements to the typeface (figures, Math coverage, language coverage and such), and (3) the «flavor» of what you're trying to achieve, that should make it easier to recommend specific faces.</p>
      <p>* Actually, pretty much all the science posters that I've seen around my part of the world have been pretty gruesome in terms of design, so you're off to a good start! :-)</p>
