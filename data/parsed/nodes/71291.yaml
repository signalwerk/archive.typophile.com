    <p>Hey everyone, </p>
    <p>New to the forums here, been browsing and using this site for years but never posted. I'm after some advice for what fonts to use for my conference poster. </p>
    <p>OK I'm presenting an A0 poster at an antarctic research conference and am getting tired of my usual Caslon/Helvetica-Neue combo and wanted to change things up a bit. </p>
    <p>Obviously its a little difficult to describe whet I have in mind. Its a science poster, thinking cooler colors, lots of white as it will have a few hairline diagrams on it. </p>
    <p>I've done a few years of design but I'm a science major and there is a prescription for poster making in the science realm so its quit easy to make some thing a little different by simply going outside their prescribed parameters ("everything must be sans-serif", "force justify paragraphs", "do what we tell you" etc...)</p>
    <p>So I'm looking at trying to mix things up. What can everyone/anyone recommended? I don't mind buying a few fonts at the right price. I'm [i]liking[/i] the "Economist" for my body text and I really wanted to use "Futura" for headings and diagram labels but its just not fitting right for the main heading at the moment :S</p>
    <p>Suggestions please :)</p>
    <p>Thanks</p>
