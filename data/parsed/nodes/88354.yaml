    html: |-
      <p>When there's no Light, the intent can't be as a "Bold" for that,<br>
      so it's usually for setting smaller sizes (although you might have<br>
      to track it looser). But I might also try to use a Demi for emphasis<br>
      instead of Italic, depending.</p>
      <p>hhp</p>
