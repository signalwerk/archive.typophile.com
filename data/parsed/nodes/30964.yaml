    <p>Typographe.com is a collaborative type blog in French &amp; the ATypI France online section.<br>
    It focuses on france-, french-speaking- and francophony-related type news, while still reporting global type news.<br>
    Writers are, amongst others, Jean François Porchez, Jean-Baptiste Levée and Jef Tombeur.</p>
    <p>URL: <a href="http://www.typographe.com" title="http://www.typographe.com">http://www.typographe.com</a></p>
