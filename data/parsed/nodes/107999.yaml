    <p>Looking for an ID on the font used on this patch. Looks like a popular font used by bikers (Hells Angels, etc) on jackets and patches. </p>
    <p>Any help would be greatly apprecaited.<br>
    Many thanks in advance,<br>
    Danny<img src="/sites/default/files/old-images/lonewolfpatch_5397.jpg"></p>
