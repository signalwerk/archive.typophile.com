      <p>Subject discussed in previous thread<br><a href="http://typophile.com/node/104210">http://typophile.com/node/104210</a><br>
      AFAIK there is no current design patent on the design.<br>
      In sum the lettering is a pretty generic rendition of some 19th century "Tuscan" designs with "median spurs" -- the pointy bulges on the sides of the vertical strokes. Google Tuscan and you will find plenty from which to choose.<br>
      Discussion of another spurred font for jackets<br><a href="http://typophile.com/node/103278">http://typophile.com/node/103278</a><br>
      Don</p>
