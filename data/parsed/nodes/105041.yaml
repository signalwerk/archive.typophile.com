      <p>I rather like your second example. Unfortunately, you really do need that much letterspacing (just tried it) to maintain the look of a grid and prevent uneven spacing from being distracting.</p>
      <p>If you were using a face with a smaller <em>range</em> of character widths — a serifed face, or a less geometric sans — you could get away with closing up the spacing a little more before it became too awkward.</p>
      <p>If there are really only a few passages of this kind in the book, I would say by all means use the same face as the main text and set it in this way — though I find that tables are easier to work with than tabs, because you can select all the columns at once and change their widths together.</p>
      <p>Another thing to look for would be type families that include a complementary monospaced font — like, for instance, The Sans and The Sans Mono (Thesis family).</p>
      <p>And is that italics in the original? As underscoring, maybe? If so, obviously you'll need a font with an italic.</p>
