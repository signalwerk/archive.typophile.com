      <p>This is not necessarily what I think of when I hear "concrete poetry."</p>
      <p><a href="http://www.google.com/search?hl=en&amp;site=imghp&amp;tbm=isch&amp;source=hp&amp;biw=1406&amp;bih=749&amp;q=concrete+poetry&amp;oq=concrete+poetry&amp;gs_l=img.3..0l8j0i5l2.2381.5235.0.5521.19.17.2.0.0.0.147.1321.13j4.17.0.ernk_timecombined...0...1.1.23.img..1.18.1261.V0gBlVYp7AM" title="http://www.google.com/search?hl=en&amp;site=imghp&amp;tbm=isch&amp;source=hp&amp;biw=1406&amp;bih=749&amp;q=concrete+poetry&amp;oq=concrete+poetry&amp;gs_l=img.3..0l8j0i5l2.2381.5235.0.5521.19.17.2.0.0.0.147.1321.13j4.17.0.ernk_timecombined...0...1.1.23.img..1.18.1261.V0gBlVYp7AM">http://www.google.com/search?hl=en&amp;site=imghp&amp;tbm=isch&amp;source=hp&amp;biw=140...</a></p>
      <p>Given that the point seems to be for each column of characters to line up vertically, I would use the same (not monospaced) font as the main text, and set it as a table, with each character centered in a cell and no visible cell strokes. Or use center-aligned tabs for each column, etc etc. Still don't see why a monospaced font is a requirement.</p>
      <p>Edit: A recent example of this that I did:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/capsingrid_6572.png"></div><p></p>
      <p>Aldus is not a monospaced font. Of course, there's a lot of letterspacing here because of the all-caps setting, but you could use much less space in your case.</p>
