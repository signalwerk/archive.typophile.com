      <p>Start with a monospaced font for the concrete parts, and use the same face with InDesign “Optical” kerning for the rest. (You would have to reduce the size of the space character.) This approach would work quite well with one of the more attractive monospaced fonts, e.g. MVB Fantabular.</p>
      <p>FF Letter Gothic, a proportionally spaced typeface, combined with monospaced Letter Gothic.<br>
      Other faces that have both proportional and monospaced variants: Alix (mentioned above) and Century Schoolbook, etc.</p>
      <p>Panoptica (monospaced unicase) for the concrete part, and Parity (proportional unicase) for the other. Caveat: This face was designed for concrete poetry, so may seem strange for the other, although perhaps “vanguard”.</p>
      <p>Use a face throughout that looks monospaced, even though it is not, such as Ofﬁcina.</p>
