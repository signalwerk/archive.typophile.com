    html: |-
      <p>I like Omnes, but I work for a city magazine with a wide array of subject matter ranging from Top Doctor listings to Fashion to Real Estate to Restaurant listings to in-depth personal stories. I’m not confident in the fonts flexibility and range although I’m still considering it at this point.  </p>
      <p>I do like how Cubanica was used in GQ (THANK YOU MRSHWARTZ). I wanted to test it before deciding if it works for me, but I feel its closer to a classic gothic, but with unique features built to distinguish it. It also has a subltle retro feel. </p>
      <p>I plan to test a few san serifs in my evaluation. I’m testing Foundry Monoline and Titling Gothic FB in addition to Omnes and Cubanica.</p>
      <p>Thanks for the help.</p>
