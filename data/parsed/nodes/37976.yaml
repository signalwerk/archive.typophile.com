    <p>I have started to experiment with code to support special glyph forms based on shapes of neighboring glyphs. For example:</p>
    <p>Round Left, x, Round Right<br>
    Round Left, x, Flat Right<br>
    Flat Left, x, Round Right<br>
    Flat Left, x, Flat Right<br>
    Diagonal Left, x, Round Right<br>
    Diagonal Left, x, Flat Right<br>
    Diagonal Left, x, Diagonal Right<br>
    Round Left, x, Diagonal Right<br>
    Flat Left, x, Diagonal Right</p>
    <p>Note: x= is the glyph to be modified</p>
    <p>Note:<br>
    Round Right = o,b,e etc<br>
    Round left = o,d,q etc<br>
    Flat Right = n,d,u etc<br>
    Flat Left = n,b,u<br>
    Diagonal Right= v,w,y<br>
    Diagonal Left= v,w,y</p>
    <p>I understand how to do the classes now but I am not sure in a calt expression how you would best order things. I suspect that you would pick a standard say for instanace 'Flat' and make that the default. Then it's a matter of making the class' for Round, Diagonal, and for ligatures and special cases. That is fine.</p>
    <p>What I don't seem to be able to do is to effectively figure out is what is the smart way of doing this.</p>
    <p>This is what I did so far was this. I did it for an 'f' whose crossbar I am altering gently. It seems to be working. </p>
    <p>sub @rnd.rt f' @rnd.lft by f.rnd.bth;<br>
    sub @rnd.rt f' @flat.lft by f.rnd.lft;<br>
    sub @flat.rt f' @rnd.lft by f.rnd.rt;</p>
