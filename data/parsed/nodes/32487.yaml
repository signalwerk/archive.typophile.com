    <p>"A new era in creative expression is about to unfold, freeing us to color outside the lines, to think in multiple dimensions, to engage audiences like never before.</p>
    <p>On March 27, 2007, at 3:30 p.m. Eastern time, Adobe Systems will host* a webcast of the official launch of Adobe® Creative Suite® 3, live from New York City. To participate, bookmark this page and join us back here on March 27."</p>
    <p>*by Adobe CEO Bruce Chizen and COO Shantanu Narayen. </p>
    <p><a href="http://www.adobe.com/products/creativesuite/launchevent/">http://www.adobe.com/products/creativesuite/launchevent/</a></p>
