      <p>I watched part of today's webcast. The new apps look very interesting and seem like worthy upgrades. There was almost no mention of new type features (if there are any), but some seem to be implied. </p>
      <p>For example, Flash can now import Photoshop and Illustrator files directly, and one of the options is to keep imported text editable. This seems to imply that Flash will now support OpenType. If not, then I'm not sure how this could work. The question is, if this is true, what is the extent that Flash users will have to OT features, etc.?</p>
