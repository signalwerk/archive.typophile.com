      <p>According to MacWorld.com:</p>
      <p>Adobe Creative Suite 3 Design Premium and Standard and Adobe Creative Suite 3 Web Premium and Standard will begin shipping in April 2007. Adobe Creative Suite 3 Production Premium and Adobe Creative Suite 3 Master Collection will begin shipping worldwide in the third quarter of 2007.</p>
      <p>Creative Suite 3 Design Premium will cost $1799, Adobe Creative Suite 3 Web Premium will be $1599, Creative Suite 3 Production Premium is $1699 and the Adobe Creative Suite 3 Master Collection will cost $2499. There are also numerous upgrade paths available for Adobe customers.</p>
      <p>My question: why the heck does Adobe seperate "Production" from "Design?" I can see (a little) where Web Designers wouldn't want to mess with a lot of pre-press stuff, but C'MON ALREADY -- Most of the world still needs ink on paper, and that means designers who know production!</p>
      <p>Considering that A) the "art" of production (those professionals whose one-and-only job is pre-press) has continually dissolved over the years as more and more of the "production" burden is rolled into the designers' work ("just send me the file..." -- who cares if it's not color-corrected/separated/etc.), and B) Adobe spends so much of their press time hyping the concept of multi-purposing documents ("...your InDesign print job transfers seamlessly into Dreamweaver and displays on a Nokia phone!"), WHY OH WHY does Adobe kepp "crippling" their mainstream (read: affordable) bundles by leaving out real production tools?</p>
