    html: |-
      <p>I can see that you've put lots of work into this so please consider this a positive critique even though I think (know) this font face has lots of work to do:</p>
      <ul>
      <li>Letters are often copied/rotated/flipped which makes their strokes invalid.</li>
      <li>Some of them are round (o) others are not (q)</li>
      <li>Some accents are too thin and stylistically different</li>
      <li>It seems round letters have more overshoot at the bottom than at the top</li>
      <li>/j/ has angled/broken/distracting descender</li>
      <li>/s/ is strongly falling to the right</li>
      <li>/z/ is way too wide</li>
      <li>Overall letter weight differs considerably</li>
      <li>Some letters are unusually narrow (ie. /na/) while others are unusually wide (ie. /coewz/)</li>
      <li>/g/ seems wobbly as not being that way as a feature but more of an error.</li>
      <li>some letters use ball terminals others don't which makes them "strangers" or better said "non-relatives"</li>
      <li>etc.</li>
      </ul>
      <p>I'm not trying to put you off, but at this stage and looks of your letters this seems like a dead end project. You may learn a lot while doing it but you will either redraw it considerably to make it at least usable or start a new one after you gain some more experience.</p>
      <p>For a beginner it's also usually better to go with a sans serif first because it's... well a bit easier (not a rule but usually is that way). Designing serifs with contrast stroke and not thinking of drawing them with a broad nib pen makes it even harder to succeed.</p>
      <p>So. The main thing is <strong>I encourage you to continue</strong>, because you obviously like doing this (since you've devoted so much time to it already). In time and after few/many corrections/redraws you will become better and better and may eventually create something that will be usable in a designer sense of way.</p>
      <p><em>(but who am I to judge since I'm not a formally educated designer at all even though some may've thought I am).</em></p>
