      <p>Patty, Eben, Lore, etc:</p>
      <p>TECH TIP</p>
      <p>To close crop your avatar on the grey Typophile background:</p>
      <p>1. Duplicate layer in Photoshop<br>
      2. In top layer, use magic wand to select unwanted area. Delete this selection (its absence shows as “checkerboard” in the layers panel mini-view.)<br>
      3. Delete Background layer.</p>
      <p>Save as PNG.</p>
    html_clean: |-
