    <p>Apparently we’ve had a silent battle between Satya and Nick Shinn over Avatar supremacy. Can we keep it up?</p>
    <p>I think it deserves a time-wasting yet difficult challange:<br>
    Who can design their own avatar to perfectly mimic that of another person’s? You gotta do it from scratch or if you do swipe parts, do it cleverly. (Which is the motto of design, no?) No cheating!</p>
    <p>Categories are:<br>
    1) Most Difficult – Repeat the impossible<br>
    2) Quantity – How many can you do?</p>
    <p>The winner gets to claim the title of “AVATAR MASTER”.</p>
