    <p>.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/schild_arthur-s_1-4_5300.png"></div><p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/schild_arthur-C_5_5163.png"></div><p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/schild_arthur-C_8_5156.png"></div><p></p>
    <p>I hereby take the pleasure to announce the release of my new <strong>ARTHUR</strong> font series.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/schild_arthur-s_1-1a_5289.png"></div><p></p>
    <p>It was obviously inspired by the elegance and sophistication<br>
    of the Art Deco era …</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/schild_arthur-C_7_5370.png"></div><p></p>
    <p>… the classical age of  travel and of the dawn of modern globalization.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/schild_arthur-C_6a_5723.png"></div><p></p>
    <p>There are two seperate sets of fonts: <a class="freelinking external" href="http://www.myfonts.com/fonts/andreas-stotzner/arthur-sans/" rel="nofollow"><strong>Arthur Sans</strong></a> (in 5 weights) and <a class="freelinking external" href="http://www.myfonts.com/fonts/andreas-stotzner/arthur-cabinet/" rel="nofollow"><strong>Arthur Cabinet.</strong></a></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/schild_arthur-C_3b_4840.png"></div><p></p>
    <p>Additionally, a seperate font, <a class="freelinking external" href="http://www.myfonts.com/fonts/andreas-stotzner/arthur-ornaments/" rel="nofollow"><strong>Arthur Ornaments,</strong></a> is available:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/schild_arthur-s_1-6_6612.png"></div><br>
    … offering about 70 glyphs with florals, borderpieces, travel, sports and lifestyle pics.<p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/schild_arthur-Orn_4_5726.png"></div><p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/schild_arthur-Orn_5_3962.png"></div><p></p>
    <p>Thank you all typophiles who favourably <a class="freelinking external" href="http://typophile.com/node/98908" rel="nofollow">commented on the drafts</a> during the last two months.</p>
    <p>Finally, a glimpse on some preceding sketches.<br>
    I hope you enjoy it.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/arthurentw_sw_m_1_5657.png"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/arthurentw_sw_m_2_3457.png"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/arthurentw_sw_m_8_3462.png"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/schild_arthur-Orn_1A_5778.png"></div><p></p>
