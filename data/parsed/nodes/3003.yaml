    html: "<p>I wrote: \"A group of type designers including Matthew Carter left Linotype and started Bitstream, which was to become the first digital type foundry in the world.\" <br> <br>Gerald Giampa wrote: \"What is your basis for that conclusion?\"  <br> <br>Which conclusion? Where I learned English, a conclusion used to be a necessary consequence of propositions, usually joined by a marking word such as \"so\", \"therefore\", \"then\", \"because\", \"hence\" etc. In a sentence built like \"I bought a hat which is black\", I cannot detect a conclusion despite my best efforts. But I learned English in the communist Poland, so I guess it's all wrong.  <br> <br>Adam <br> <br>Adam</p>"
