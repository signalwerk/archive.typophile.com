    html: "<p>The Bitstream license can be viewed at:  <br><a href=\"http://www.myfonts.com/viewlicense?id=315\" target=\"_blank\">http://www.myfonts.com/viewlicense?id=315</a> <br> <br>Unfortunately, it states \"No Modifications. You may not modify, adapt, translate, reverse engineer, decompile, disassemble, or create derivative works based on the Bitstream Product without Bitstream's prior written consent. \" <br> <br>If the license did not prohibit this, you would normally be allowed to put any trademarked name into the font provided they are for your use only. However, IMO this is impractical and may cause confusion. Note that the original fonts are QA'ed until get-no so I wouldn't want to modify them unless I really need to.   <br> <br>On a related matter, the Linotype EULA is more liberal with regard to modification: \"You may modify the Font-Software to satisfy your design requirements. Such modifications are in every respect subject to this Font-Software License Agreement. \" <br><a href=\"http://www.myfonts.com/viewlicense?id=8\" target=\"_blank\">http://www.myfonts.com/viewlicense?id=8</a> <br> <br>As for the digitizations: for many of the older designs, there is no \"one master design\". These often were work in progress, evolving in the designer's mind and constantly adapted to match various technological requirements. Some typefaces have undergone such major revisions that the current versions barely look similar to the initial ones. Best example: Palatino. Current Palatino Linotype is a heavily simiplified text version, Berthold's version captures the display style of the initial drawings. Bitstream's Zapf Humanist 801 is somewhere in-between I think.  <br> <br>So in some cases, different artwork from different periods was used by different companies to prepare the digitizations. Also, most digitizations involve adaptation, so the person who art-directed the digital version also has an influence on the final look.  <br> <br>Regards, <br>Adam <br> <br></p>"
