    html: <p>Arial? This is a crime, not a decision. As printed text face this is the biggest plague of typography. Just show your bosses Meta or Myriad, both of which come in huge families, and a text setting of either vs Arial. Unless they are blind they will see how unreadable Arial is by comparison.  <br> <br>In my opinion, Bliss will be still better. <br> <br>It seems to me you are in a position to bargain with founderies, so if I were you I would talk to Adobe, Tankard, Montalbano, Fontbureau, and whomever else you fancy. Explain your needs and get them to propose a deal that will help you most. Make them work for your business, and you will probably get some great advice and a result you are confident about and happy with.</p>
    html_clean: <p>Arial? This is a crime, not a decision. As printed text face this is the biggest plague of typography. Just show your bosses Meta or Myriad, both of which come in huge families, and a text setting of either vs Arial. Unless they are blind they will see how unreadable Arial is by comparison.  <br> <br>In my opinion, Bliss will be still better. <br> <br>It seems to me you are in a position to bargain with founderies, so if I were you I would talk to Adobe, Tankard, Montalbano, Fontbureau, and whomever else you fancy. Explain your needs and get them to propose a deal that will help you most. Make them work for your business, and you will probably get some great advice and a result you are confident about and happy with.</p>
