    html: <p>Hrant,  <br>the Linotype Flirt OpenType collection is a combination of the regular OT fonts and a fair number of "traditional" PostScript versions of the Linotype faces.  <br>Useless for an InDesign user but handy for a Quark user without the goodies of the larger charactersets of OT. This means you get a load of SmallCaps fonts, Oldstyle Figure fonts and even Alternate and Expert sets. <br>A clever marketing solution for the ones to learn what OpenType could offer. <br>A single user or small studio could, most probably, better invest in an application upgrade and an OT collection such as Adobe and Linotype offer nowadays. <br>my 2 euro cents, <br>henk  <br></p>
