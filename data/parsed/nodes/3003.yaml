    html: "<p>&gt;&gt;&gt;Just show your bosses Meta or Myriad, both of which come in huge families, and a text setting of either vs Ariel <br> <br>I might just do that! <br> <br>In fact, I've already got their sympathy. However, the requirement to transmit in Word format means that the recipient PC must have whatever face is used. So Arial it is. <br> <br>There's no solution. We can educate users in how to embed, but we can't make them save two versions of every document (ie. one with fonts editable, one with them embedded for sending via email). <br> <br>I suppose we could implement a script on the email server, which would convert to PDF any Word document it saw leaving the building. However, this would also intercept documents which are deliberately sent in an editable form, so it's no good. <br> <br>The only other thing I can think of: a future version of MS Office could let you save/transmit fonts used in a document, and keep them editable on recipient machines, *but only for that document*. If you cut and pasted to a new document, you'd paste in Times New Roman (or whatever default). <br> <br>For this to happen, though, would require (a) Microsoft to write a better version of Acrobat than Adobe, and (b) Foundries to allow editable versions of their faces to ship (albeit in limited form) without royalties. <br> <br>In other words, it's never gonna happen. <br> <br>Here's hoping MS expand their type library sometime soon. In another 15 years, the ubiquity of Arial may pervade my very soul.</p>"
