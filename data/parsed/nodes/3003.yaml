    html: <p>&gt;What I am getting at is this, does type stink when it gets old? <br> <br>So I guess we don't need new songs, books, movies, and architecture either? <br> <br>Gerald, it's terrible what has happened to typographic culture in the last few years, particularly in North America. In effect there is a moratorium on typographers using new typefaces. The general preference is for retro scripts and mid 20th century faces (mainly sans). The other stultifying factor is the preponderance of bland, utilitarian fonts given away by Microsoft, Apple, and Adobe with their software apps. <br> <br>So yes, I would say that public sector organizations owe no fealty to mainstream corporate culture, and the affinity of bureaucracies is a powerful attraction between the two, but it should be resisted by free-thinking individuals.  <br> <br>Why is a public sector organisation prefering to buy from a small, independent foundry considered to be a "charitable donation"? Why is it business as usual to shop Adobe, but largesse to patronize Storm? <br> <br>Death to Helvetica!</p>
    html_clean: <p>&gt;What I am getting at is this, does type stink when it gets old? <br> <br>So I guess we don't need new songs, books, movies, and architecture either? <br> <br>Gerald, it's terrible what has happened to typographic culture in the last few years, particularly in North America. In effect there is a moratorium on typographers using new typefaces. The general preference is for retro scripts and mid 20th century faces (mainly sans). The other stultifying factor is the preponderance of bland, utilitarian fonts given away by Microsoft, Apple, and Adobe with their software apps. <br> <br>So yes, I would say that public sector organizations owe no fealty to mainstream corporate culture, and the affinity of bureaucracies is a powerful attraction between the two, but it should be resisted by free-thinking individuals.  <br> <br>Why is a public sector organisation prefering to buy from a small, independent foundry considered to be a "charitable donation"? Why is it business as usual to shop Adobe, but largesse to patronize Storm? <br> <br>Death to Helvetica!</p>
