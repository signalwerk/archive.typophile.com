    html: <p>&gt;we may still find insult  <br> <br>Sorry, the barb was not aimed at an independent doing work of character, but at those corporations who have produced plain digital transcriptions of older types, and the hold these now have on the marketplace.  <br> <br>This is the "representative range of classic faces (bodoni, helvetica/univers/akzidenz grotesk, frutiger, futura, gill sans, franklin gothic etc); " that m-ga, with conventional wisdom, makes his/her first priority.  <br> <br>Lanston is obviously a foundry, and not a "foundry" (by which I mean publishers who neither originate the concept for the types they market, not produce the fonts).  <br> <br>And I'm tarred with my own brush, as I've been responsible for a few non-original typefaces myself. <br> <br>Nonetheless, the best antidote to the blight of mega-corp culture, and the most valid form of cultural expression, is original, local work. Sure, there is a role for conserving type designs, but that is presently the norm in typography, to the detriment of adequately using a variety of contemporary designs. <br> <br>Death to Franklin, News, and Trade Gothic!</p>
