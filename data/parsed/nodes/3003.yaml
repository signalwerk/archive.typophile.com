m signed an agreement which finally ended their dispute over the designs. Linotype officially \"licensed\" the designs to Bitstream (but not the trademarks). This means, that prior to that, Swiss 721 was an unlicensed clone of Helvetica, and now it's a licensed version of Helvetica, but sold under a different name. The press release is here: <a href=\"http://www.bitstream.com/categories/news/press/2003_bitstream/071803_linotype.html\" target=\"_blank\" class=\"link-external\">http://www.bitstream.com/categories/news/press/2003_bitstream/071803_linotype.html</a>  <br> <br>This is handy to know as this sort of confirms that the Bitstream versions really are derived from the same original sources.  <br> <br>Best,  <br>Adam <br></p>"
