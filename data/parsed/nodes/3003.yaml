    html: "<p>m-ga,  <br> <br>the Bitstream situation goes roughly as follows: in the 1980s, Linotype was still a large print machines manufacturer who was not interested in making digital fonts for the slowly emerging DTP market. A group of type designers including Matthew Carter left Linotype and started Bitstream, which was to become the first digital type foundry in the world. They digitized original Linotype typefaces, but Linotype refused to license the original trademarks to them. So they used names derived from their own classification (Humanist 777 being Frutiger, Swiss 721 being Helvetica, etc.). Bitstream licensed the names from some other foundries, so some of the fonts used original names (e.g. Futura), but those copied from Linotype, Monotype and Berthold designs usually did not. However, these still were very faithful and high-quality digitizations, not cheap knock-offs like many many other companies offered them.  <br> <br>Some time later, the original team left Bitstream. At this time, the company signed the unfortunate deal with Corel so that nearly the entire Bitstream type library (850 fonts or so) shipped with Corel DRAW starting from version 4.0.  <br> <br>Over the time, Bitstream's policy towards other vendors and designers matured, and when Jim Lyles took over the maintainence of the Bitstream type library, they started releasing new designs as Bitstream New Font Collection. They also added the euro character to their old fonts, of course.  <br> <br>So the Bitstream Type Odyssey includes a large portion (~850 fonts I think) of the original library and some 600 fonts that are new designs, released by Bitstream or licensed from other foundries.  <br> <br>You can browse the contnets of Type Odyssey 2 here: <a href=\"http://www.myfonts.com/browse/product/type-odyssey-2-mac/?mode=alpha\" target=\"_blank\">http://www.myfonts.com/browse/product/type-odyssey-2-mac/?mode=alpha</a> <br> <br>Last year, Linotype and Bitstream signed an agreement which finally ended their dispute over the designs. Linotype officially \"licensed\" the designs to Bitstream (but not the trademarks). This means, that prior to that, Swiss 721 was an unlicensed clone of Helvetica, and now it's a licensed version of Helvetica, but sold under a different name. The press release is here: <a href=\"http://www.bitstream.com/categories/news/press/2003_bitstream/071803_linotype.html\" target=\"_blank\">http://www.bitstream.com/categories/news/press/2003_bitstream/071803_linotype.html</a>  <br> <br>This is handy to know as this sort of confirms that the Bitstream versions really are derived from the same original sources.  <br> <br>Best,  <br>Adam <br></p>"
