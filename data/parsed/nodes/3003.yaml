    html: <p>Adam, I think the key to understanding Bitstream's role is that they were the first <i>device independent</i> digital type company. Other companies, including Linotype, had been involved in making digital type for several years before the formation of Bitstream, but for use on their own propriatary machines. Bitstream was, apparently, the first company to make and license digital fonts without also selling you the machine. <br> <br>So Bitstream was instrumental in both the largest single act of font piracy in history, and the collapse of an industry that stopped making the one thing that made it a lot of money. <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"></p>
