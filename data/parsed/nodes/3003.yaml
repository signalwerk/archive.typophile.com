    html: "<p><i>the Bitstream situation goes roughly as follows: in the 1980s, Linotype was still a large print machines manufacturer who was not interested in making digital fonts for the slowly emerging DTP market.</i> <br> <br>Actually, in the 1980s, Linotype was already collaborating with Adobe of the development of digital versions of the Linotype Library. Bitstream came about because Mike Parker struck a deal to provide copies of Linotype fonts to a client who couldn't license from Linotype. This client provided the startup investment for Bitstream, and Mike jumped ship from Linotype, taking Matthew Carter and David Berlow with him. That, at least, is Mike's account.</p>"
