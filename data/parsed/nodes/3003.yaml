    html: "<p>Nice problem to have! <br> <br>Adobe has some great fonts. In a library that size, there's bound to be some... well, some lesser works, but there's tons of quality there, and lots of utility in their OpenType implementation.  <br> <br>The faces with optical variations are very useful. They give those of us mourning the decline of Multiple Masters some comfort.  <br> <br>Whether you get the Folio or individual sets is a matter for you, your taste, and your calculator.  <br> <br>I agree that you should look at the Storm fonts. Great value for unusual faces. <br> <br>Linotype's Optima Nova is well worth a look, and you should  look for some of Matthew Carter's faces. <br> <br>Another thing to consider when looking at different foundries is their licensing conditions: some allow embedding in PDFs, some don't, some allow modifications of the fonts for in-house use, some don't, that sort of thing.  <br> <br>Most foundries that don't include embedding in their standard EULA will allow it under separate licensing, but you should check all that up front.  You don't want to prepare documentation in a PDF only to discover that you can't use your chosen font.</p>"
    html_clean: "<p>Nice problem to have! <br> <br>Adobe has some great fonts. In a library that size, there's bound to be some... well, some lesser works, but there's tons of quality there, and lots of utility in their OpenType implementation.  <br> <br>The faces with optical variations are very useful. They give those of us mourning the decline of Multiple Masters some comfort.  <br> <br>Whether you get the Folio or individual sets is a matter for you, your taste, and your calculator.  <br> <br>I agree that you should look at the Storm fonts. Great value for unusual faces. <br> <br>Linotype's Optima Nova is well worth a look, and you should  look for some of Matthew Carter's faces. <br> <br>Another thing to consider when looking at different foundries is their licensing conditions: some allow embedding in PDFs, some don't, some allow modifications of the fonts for in-house use, some don't, that sort of thing.  <br> <br>Most foundries that don't include embedding in their standard EULA will allow it under separate licensing, but you should check all that up front.  You don't want to prepare documentation in a PDF only to discover that you can't use your chosen font.</p>"
  - id: 23892
    user: 1133
    date: 2004-02-01T20:09:00
    date_raw: 1 Feb 2004 — 8:09pm
    votes: null
    html: "<p>I would also consider Bitstream Type Odyssey 2: <a href=\"http://www.myfonts.com/info/bitstream-type-odyssey-2/\" target=\"_blank\">http://www.myfonts.com/info/bitstream-type-odyssey-2/</a>  <br> <br>It's just $1500 for 1450 fonts. There are no OpenType fonts there, but many quality digitizations of classic faces. The typefaces are renamed but e.g. for Linotype faces, the designes are licensed.  <br> <br>The digital versions of Bitstream fonts are really superb. For example, I think their Futura is better than Adobe's or URW's. In many cases, I consider the Bitstream digital versions better than the ones with the original names. After all, the initial digitization of the Bitstream type library was supervised by Matthew Carter.  <br> <br>You don't like ITC faces so you'll live with the fact that Bitstream no longer has the license to distribute their digitizations of ITC fonts, and they are not included on Type Odyssey.  <br> <br>On the other hand: probably the best way to get a huge load of Bitstream and ITC fonts probably is to buy Corel DRAW 9 on eBay. :D  <br>You can get a copy for $20 and it includes an incredible collection of fonts: over 1000 Western fonts from Bitstream and URW, plus a set of international fonts (Cyrillic, CE, Japanese, Chinese, Arabic).  <br> <br>Of course, Type Odyssey 2 contains quite a few new faces from other foundries, and it may be the reason the get the library.  <br> <br>I'd also pay attention to the ParaType library:  <br><a href=\"http://www.myfonts.com/url?3967302fb3976b83a34d82d8464b7a79\" target=\"_blank\">http://www.myfonts.com/url?3967302fb3976b83a34d82d8464b7a79</a> <br>Some of their fonts are Unicode with great hand hinting, and all of them are available in Western, CE and Cyrillic encodings. They have very fine licensed versions of Bitstream fonts, and quite a few original designs.  <br> <br>Adam <br></p>"
