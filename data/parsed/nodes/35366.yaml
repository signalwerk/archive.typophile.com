    html: |-
      <p>Yes, I was referring to tagin. I think I remember 'stam' fonts being used on invitations, but they may have been Bar or Bat Mitzvah invitations. Because the Bar Mitzvah ceremony involves the first reading from the Torah for the child, it might be more appropriate there. I don't know of any prohibition on using this style, though.</p>
      <p>Overall, a copperplate latin script I think would be particularly hard to match, because Hebrew cursive script is not connected, and the normal square writing shapes are very different. I would think that a calligraphic roman, like Brioso or Diotima, would be easier to match with a calligraphic Hebrew. </p>
      <p>But overall, it is very hard because Hebrew has thin verticals and thick horizontals, and Roman the opposite.  If the invitation is done by a calligrapher he or she can keep the pen at a similar angle for both, and make them work together. </p>
      <p>I put together David and Friz Quadrata on a project, and they worked as the low contrast made the differences in stress stand out less. But they wouldn't work on an invitation...</p>
