      <p><em>It may be that a font with the 'crowns' on the letters will better match a roman script font, because of the high contrast.</em></p>
      <p>You mean <em>tagin?</em> These are specific to STA'M (Sifrei Torah, Tefillin and Mezuzot) lettering, so I'm not sure how appropriate they would be for other use, even if the wedding is taking place in a religious context.</p>
