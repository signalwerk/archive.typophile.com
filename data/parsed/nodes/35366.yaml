    <p>I’m looking for a Hebrew font for use in a wedding invitation; preferably something more decorative than Davka’s Gonen (in the attached image or at <a href="http://www.davka.com/Images/hfg/gon.jpg" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://www.davka.com/Images/hfg/gon.jpg</a>).  Is there anything that would match well with (say) Zapfino?</p>
    <p>++J</p>
