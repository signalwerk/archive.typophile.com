      <p>Typophiler David Hamuel has a lovely calligraphic font, <a href="http://www.myfonts.com/fonts/lighthouse/shirah-25/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Shirah 25</a>.</p>
      <p>Matching Hebrew and Roman fonts is always difficult. It may be that a font with the 'crowns' on the letters will better match a roman script font, because of the high contrast. </p>
      <p>The best thing is probably to get a calligrapher with Hebrew expertise to do the invitation, and he or she will be able to match the Hebrew and English. I am talking about the calligrapher doing a model to photograph and print from, of course, not the addressing the envelopes etc.  </p>
      <p>There are a number of fine calligraphers who do this kind of thing--Hebrew and English--in the New York area, where you are. They also do Ketubbot, etc.</p>
