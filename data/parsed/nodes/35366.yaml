      <p>Thanks all. I’m aware of the hassle involved in matching fonts across alphabets. Fortunately I don’t need to mix them on the same page (much) so the match needn’t be close; all I’m looking for is a similar level of “swash-ness”. OTOH, Zapfino is rather excessive in that regard, so I might be setting the bar too high….</p>
      <p>I’m looking for formal and decorative—the same situation that makes a swash script appropriate in Latin type. No <em>tagim</em>. Shira 25 is pleasant, if simple. Frankruhlya is horrific. (I was about to say “grotesque”, but apparently that’s a term of art in type design.)</p>
      <p>Is it completely crazy that I haven’t found anything that appeals to me as much as the fairly cheap Davka Gonen?</p>
