      <p>Brothers is a great suggestion.</p>
      <p>Also, look through <a class="freelinking external" href="http://www.losttype.com/ " rel="nofollow"> Lost Type Co-op</a> (pay what you want, vintage-inspired typefaces).  So many would be great here.  Ranger, Deming, Liberator, Duke, Tommaso, and Muncie especially.</p>
      <p>Also, I'd consider <a class="freelinking external" href="http://new.myfonts.com/fonts/archivetype/archive-steeler/ " rel="nofollow"> Archive Steeler</a> and <a class="freelinking external" href="http://new.myfonts.com/fonts/archivetype/archive-tinted/ " rel="nofollow"> Archive Tinted</a>.</p>
