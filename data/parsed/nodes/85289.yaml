    <p>Hey everyone! </p>
    <p>I am looking for an awesome typeface for a cigar store that I am branding. I am thinking a san-serif, but I'm open to suggestions that are not. It needs to be masculine, strong and upscale. I love the identity for Cavalier Essentials and want a similar feel. </p>
    <p>Thanks for the help!<br>
    Kathryn</p>
    <p><a href="http://cavalieressentials.com/" title="http://cavalieressentials.com/">http://cavalieressentials.com/</a><br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/cavalier_5097.jpeg"></div><p></p>
