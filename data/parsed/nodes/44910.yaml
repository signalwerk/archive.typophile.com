    <p>Hey I wasn’t sure where to put suggestions so I’ll just put one here.<br>
    I think it would be cool if Typophile handled images a little differently, where if you have a wide image it could be clicked on to expand. Look at the forums at <a href="https://web.archive.org/web/20080907165801/http://www.dpreview.com/" title="http://www.dpreview.com">http://www.dpreview.com</a> (Photo website) Images are previewed at a certain width but can be expanded if you click on it, so you don’t have a scroll bar. I think this would be the cats pajamas. I don’t know what that means but I think it’s good.</p>
