    <p>Early '80 video titling Type ID</p>
    <p>In early '80 in Italy, this font was used for a video titling of a japanese cartoon.<br>
    What type is it?<br>
    What type machine or technics could be used to do such a kind of title?<br>
    This type was used after in '80 and '90 for titling video. Maybe can it be stored in such a digital video titler?<br>
    Thank you.</p>
    <p><a href="http://img594.imageshack.us/img594/6092/4b3s.png" title="http://img594.imageshack.us/img594/6092/4b3s.png">http://img594.imageshack.us/img594/6092/4b3s.png</a></p>
