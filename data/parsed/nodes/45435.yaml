      <p><em>for us to work and rework and rework styles is just a self indulgent exercise that does nothing to create styles for our times.</em></p>
      <p>That may be true in some cases, but in general you can't blame type foundries for meeting the needs of the market.<br>
      A sensible business model for foundries centres on custom work for publications and corporations, and that is how many retail faces are developed. So when those institutions ask for conservative, derivative designs, that's what many foundries will devote their efforts to.</p>
      <p>And if you're developing retail fonts, it's foolish (or high-minded!) not to have some grunge and retro scripts in your catalog.</p>
      <p>Ultimately, history mining and derivative work <em>is</em> representative of our time. One reason perhaps, other than any general conservative trend in society, is that digital culture focuses on the possibilities of the space between media, rather than originating fresh content.</p>
      <p>Nonetheless, there are plenty of novel, experimental, and original typefaces available. Subsequent to decrying the hegemony of Helvetica, I took a more positive tack in a 2004 magazine article bigging up (big upping?) ten new faces. Since then, I'd have to say there are a lot more original faces being published (just ask Stephen Coles), and the market for fonts appears to be thriving.</p>
