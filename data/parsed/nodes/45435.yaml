    html: |-
      <p>Yes. Bitstream. Actually I love Stymie. They added (I think) a Bold with Condensed and Extra Bold to the family, and Piranesi Italic, and Devinne, and Della Robia, &amp;c. That is cool stuff and I already have it. I went thru some old specimens I have and I <a href="https://web.archive.org/web/20150123045147/http://www.photoblog.com/storage001/2008/05/18/" rel="nofollow">picked this</a> to show. It is Pynson Oldstyle Italic and is found on the American Line Type Book, ATF (1907). It happen that I don't remember ever seeing this anywhere, maybe a similar one. The contours of this face actually waves and appears to not have a straight line contour in any character, which makes it suitable to work with.</p>
      <p>Well, the type is not dead per se, it just may be locked somewhere, unused, forgotten in a dark storage, or the printer who has it don't know where it is; or  in the bottom of a lake, or covered by asbestos (as James said) and no one dare to approach it. One thing is certain: some types are really gone, melted to make new or become soldiers or fishing artifacts.<br>
      It is reasonable to think that some is indeed dead. Question is, resuscitating some of them for personal or commercial use can bring trouble to your door? Even if the intention is to brink some back as ludic exercise. As for naming one could call it like... "House Font N.o 2", or simply "N.o 2" (as House is already existent), but not hiding its origin, mentioning where it comes from, who have cut it first time, the designer name (when possible, as it appears to me that some type just had a denomination as being from ATF or BB&amp;S or Central Type Foundry, &amp;c.</p>
      <p>What I have learned so far, most of it here following peoples links and opinions (not to mention English language too...)  is that if the creator is dead before 1925 and there is no 'recut' done between 1985 and 1990, one can just 'recut' it and maybe, maybe, call it by its real name (after extensive research on it making sure of not hurting any sensibilities...) ?</p>
      <p>To make it sort of different, one can use a character set old fashioned <a href="https://web.archive.org/web/20150123045147/http://www.typophile.com/node/1668" rel="nofollow">California Job Case</a>, as to keep it in a letterpress perspective. Only letterpress people would appreciate it, as it is not Eastern European nor Unicode OT, don't have diacritics and can and will be called "useless".</p>
      <p>Does it make more sense now?</p>
