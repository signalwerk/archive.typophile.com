      <p>"[…] in the 1980s, Linotype was […] not interested in making digital fonts for the slowly emerging DTP market. "</p>
      <p>Not surprisingly, this is not true, as is seen in Linotype's 1984 licensing deal with Adobe (a dtp company for sure), for names and designs and  later, data. In the early 80's Linotype became disinterested in type design, cut the funding of that department by a 1/4 of a million dollars per year and opened the exit doors wide. This condition, funding for machines but not new type development, was one they never recovered from. Bitstream had to make nearly the same decision by 1994, and went the same way, i.e. money for technology, not for new type.</p>
      <p>Cheers!</p>
