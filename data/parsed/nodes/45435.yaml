      <p>I am going to place this link again.<br>
      <a href="https://web.archive.org/web/20150123045147/http://www.emigre.com/Editorial.php?sect=2" title="http://www.emigre.com/Editorial.php?sect=2">http://www.emigre.com/Editorial.php?sect=2</a></p>
      <p>One thing I have seen a lot on this regard and one exemple is Times. Let's speculate: Timez, Thimes, Tymes, Timhes, Tines. Tenpos, Thenpos, Thempos, Temphos, Tempum, Tiempos, Thiempos, Thiemps, Tiemps... and so on. It can be interminable the obtainable list.</p>
      <p>I have a question, and it regards to the study of old metal type. What if, that's my case, someone wants to digitize metal type from proofs of the very type, but without optimizing or interpreting it; trying to reproduce it defects, even the kerning problems, like in "We", where the W has it's space, causing the extra white between both letters. There is no minus kern, the only way to kern is to add space between characters.<br>
      This idea comes from a problem: metal type is gone, so, the only way to have it back to letterpress is by 'reviving' it. (After reading the essay now I am not sure if 'revival' make sense).<br>
      Does that make any sense? Would anybody shine some light here, please?</p>
