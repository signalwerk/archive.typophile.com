    <p>Hi Everybody,<br>
    I'm doing a project on pirate typography. I'm looking at type that has been copied or altered slightly by someone then re-distributed under a different name such as:</p>
    <p><a href="https://web.archive.org/web/20150123045147/http://www.urbanfonts.com/fonts/Weezer.htm" title="http://www.urbanfonts.com/fonts/Weezer.htm">http://www.urbanfonts.com/fonts/Weezer.htm</a></p>
    <p>When this is just a rip off.<br>
    I was wondering if anyone else knew of any other pirate typefaces.</p>
    <p>Cheers<br>
    Rob</p>
