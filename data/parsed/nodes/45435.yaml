      <p>Robert Trogman wrote:<br>
      <cite>URW++ is the worst offender.</cite></p>
      <p>Mike Yanega <a href="https://web.archive.org/web/20150123045147/http://www.typophile.com/node/2320#comment-18650" rel="nofollow">wrote in an older thread</a>:</p>
      <p><cite>My understanding of many of the URW fonts was that when they had one of the few (along with Bitstream) places where foundries could get typefaces digitized (with their tool Ikarus), they made a deal that they could sell every font they digitized as long as they changes the name (hence all the Latin-sounding names for familiar-looking fonts).<br>
      So Bitstream and URW truly do not belong in the bucket with other 'cloners'.</cite></p>
      <p>So, is URW(++) really an ‘offender’?</p>
      <p>Robert also wrote:<br>
      <cite>In the old days CorelDraw used to change the name to keep from paying royalties.</cite></p>
      <p>Adam Twardoch has explained the Bitstream/Corel story <a href="https://web.archive.org/web/20150123045147/http://www.typophile.com/node/3003#comment-23904" rel="nofollow">in another old thread</a>:</p>
      <p><cite>[…] in the 1980s, Linotype was […] not interested in making digital fonts for the slowly emerging DTP market. A group of type designers including Matthew Carter left Linotype and started Bitstream, which was to become the first digital type foundry in the world. They digitized original Linotype typefaces, but Linotype refused to license the original trademarks to them. So they used names derived from their own classification (Humanist 777 being Frutiger, Swiss 721 being Helvetica, etc.). Bitstream licensed the names from some other foundries, so some of the fonts used original names (e.g. Futura), but those copied from Linotype, Monotype and Berthold designs usually did not. However, these still were very faithful and high-quality digitizations, not cheap knock-offs like many many other companies offered them. […]</cite></p>
      <p><cite>[In 2003], Linotype and Bitstream signed an agreement which finally ended their dispute over the designs. Linotype officially "licensed" the designs to Bitstream (but not the trademarks). This means, that prior to that, Swiss 721 was an unlicensed clone of Helvetica, and now it's a licensed version of Helvetica, but sold under a different name. […] This is handy to know as this sort of confirms that the Bitstream versions really are derived from the same original sources.</cite></p>
      <p>Later in this thread, others who (I believe) do know the ropes of digital type history, like John Hudson and Gerald Giampa, elaborate on this.</p>
      <p>Thus, Corel neither did change the names (Bitstream did that) nor did they avoid paying royalties. They were just lucky to sign a deal with Bitstream – which was very advantageous for the CorelDraw users and quite disastrous for the font industry.</p>
