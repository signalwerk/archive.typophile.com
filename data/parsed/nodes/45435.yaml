      <p>Yes Simon, I did. Thank you for pointing that up. And this thread is so far off  it makes me laugh. Totally lacking from his speech/diatribe is a celebration or promotion of new/innovative/groundbreaking type. I think this is one of the problems with the current type scene, not enough innovation and a laziness that leads people back to the easy path... revision, revival ad nauseum. I was recently contacted about doing a corporate style for a company. They faxed me the bid from a North East company. It said... "we will adapt any of our faces to accommodate your needs." How creative is that? First time digital work on a previously unexplored style is just great; but for us to work and rework and rework styles is just a self indulgent exercise that does nothing to create styles for our times. </p>
