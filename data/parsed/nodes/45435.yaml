      <p>I work for a greeting card company where we have a lot of proprietary fonts. I've had to pursue issues with our fonts showing up all over. The usual thing is just where a freelancer has walked out with a disk full of fonts and they just get passed around. </p>
      <p>The one case that really bugged me was a very well respected type designer had several of her own versions of our fonts that she had scanned off of cards apparently. The font was identical except for a few odd characters. On her website she had elaborate descriptions of how she got inspired to come up with the idea and even had a link on her site for typeright. After a few unanswered emails, one of my team members ( who's work she had copied) contacted MyFonts who promptly removed the 2 in question. Then they showed up on Fonts.com whom we contacted  and were again removed. Since then I haven't seen them around. She copied a friends work from a book and is profiting well from that. All this and she's still a popular designer.</p>
    html_clean: |-
