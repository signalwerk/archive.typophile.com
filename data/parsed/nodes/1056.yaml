    html: <p> As shapes, I like it. What's the company about? <br> <br>As a logo, it might need to be a bit darker, but the "e" and "a" are already too cramped, so try making the "n" (especially) and the "c" and "o" narrower. The thing at the bottom of the "el" is too subtle, and as a result out of character too - but don't make it curl (it would create more color problems) - just make it straight. The "c" is structurally superb, just make the top-right curve more round and remove the slight flare from the bottom finial. <br> <br>I think it could work as a font. If you go that way, do something original with the caps (maybe uncial forms), since your "a" is already unconventional (and we already have a lot of boring caps). <br> <br>hhp </p>
    html_clean: <p> As shapes, I like it. What's the company about? <br> <br>As a logo, it might need to be a bit darker, but the "e" and "a" are already too cramped, so try making the "n" (especially) and the "c" and "o" narrower. The thing at the bottom of the "el" is too subtle, and as a result out of character too - but don't make it curl (it would create more color problems) - just make it straight. The "c" is structurally superb, just make the top-right curve more round and remove the slight flare from the bottom finial. <br> <br>I think it could work as a font. If you go that way, do something original with the caps (maybe uncial forms), since your "a" is already unconventional (and we already have a lot of boring caps). <br> <br>hhp </p>
