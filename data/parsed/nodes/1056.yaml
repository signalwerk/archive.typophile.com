    html: <p>I like the Metsys lettering. I have done plenty of mods to Metsys myself. I took the liberty of  <br>doing a few tweaks I think may help you in solving your problem. The Metsys “n” is really nice, I think it could really helps deﬁne the “a” as the rounded “a” you did is perhaps a bit illegible without the context of the rest of the surrounding letters. I would also widen the “e” and “a” as shown. Hope I was of some help.  <br><img src="http://www.typophile.com/forums/messages/29/1495.jpg" alt="Elanco mods.jpg"></p>
