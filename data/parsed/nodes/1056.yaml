    html: "<p> apparently, I got the image right, but the text is gone... <br>so, here comes the brief: this is the rough sketch I did for a russian client, ang he liked the logotype enough to drop the suggested symbol. <br>however, there are things bothering me about the overall balance. maybe you could suggest some tunings to make it look better. <br>and the second issue: though there are only a few letters displayed here, do you think these have potential to be extended into a full character set? do you have any recollection of similar fonts? <br> <br>thank you all, <br> <br>george // cellsius creative <br> <br>P.S. this is my first attempt at designing lower cases. please, don't be too harsh :-) </p>"
