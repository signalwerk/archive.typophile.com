      <p>Some similarity to the 1917 condensed version by Lanston Monotype of a 1903 font design by the Keystone Foundry, digitized by Red Rooster as Hancock RR <img src="/sites/default/files/old-images/HancockRRAsBULLEITBOURBON_5402.gif"><a href="http://www.myfonts.com/fonts/redrooster/hancock-rr/">http://www.myfonts.com/fonts/redrooster/hancock-rr/</a> and by Claude Pelletier as John Hancock CP <a href="http://www.dafont.com/john-hancock-cp.font?text=BULLEIT+BOURBON">http://www.dafont.com/john-hancock-cp.font?text=BULLEIT+BOURBON</a><br>
      Don</p>
