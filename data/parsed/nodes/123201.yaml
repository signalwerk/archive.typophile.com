      <div class="comment-spam-body"><p>I found a large scale image of the label at <a href="http://askmissa.com/wp-content/uploads/2011/04/iBulleit-Bourbonmg_2070.jpg" title="http://askmissa.com/wp-content/uploads/2011/04/iBulleit-Bourbonmg_2070.jpg">http://askmissa.com/wp-content/uploads/2011/04/iBulleit-Bourbonmg_2070.jpg</a><br>
      This enables me to provide more precise answers<br>
      _BULLEIT BOURBON_ is ITC Cheltenham Pro Condensed Ultra<br>
      _KENTUCKY STRAIGHT BOURBON_ is also a Cheltenham <a href="http://www.myfonts.com/fonts/itc/cheltenham/" title="http://www.myfonts.com/fonts/itc/cheltenham/">http://www.myfonts.com/fonts/itc/cheltenham/</a><br>
      _FRONTIER WHISKEY_ is Bank Gothic <a href="http://www.myfonts.com/search/bank+gothic/fonts/" title="http://www.myfonts.com/search/bank+gothic/fonts/">http://www.myfonts.com/search/bank+gothic/fonts/</a><br>
      Don</p>
      </div>
