      <p>I like what you've done with the b, a, h &amp; t, but I'm not too sure about the dots &amp; kerning. I'd try to make a version with more square-ish dots &amp; more space inbetween the letters ("higher" kerning?).<br>
      Is the t-tail the same width as the a-tail (it seems thinner)?<br>
      Oh, and I still have a thing for Helvetica (not to mention Rotis Semi Serif) as well ;-)</p>
