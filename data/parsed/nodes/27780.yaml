    <p>Here is a logotype we are working on for an architect. This client does really nice work, very simple and sharp but with some bits of beautiful ornament. I have thought of it like the photos of the opening of Mies' Barcelona Pavilinion: an iconically simple structure inhabited by a bunch of guys in top hats and women with fur collars. Hope that means something to some one out there.<br>
    My design idea therefore is to create a mix font - Helvetica Neue Ultra Light representing style and simplicity, American Typewriter representing a sort of ornament, VAG Rounded representing a smart but friendly attitude, and semi serifs (The Mix or Rotis Semi) representing technological ornament. Sounds like a lot, right?<br>
    The actual aprocess has been to modify Hel to create this mix, taking selective cues from each of the previous.<br>
    So, just looking for general comment and tips to refine this. I am confident in the design and really like it generally.<br>
    Please be aware that I love Helvetica, tight letterspacing, Swiss-style simplicty and all those other things that you might hate! Our client shares my general design disposition.<br>
    This is my first post, so thanks for taking it easy on me!</p>
