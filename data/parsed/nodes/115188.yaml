    html: |-
      <p>This is interesting.</p>
      <p>William Caslon began his typefounding career in 1720 or thereabouts. So his type could not possibly adorn a book published in 1633.</p>
      <p>That being said, there's no reason why a typeface from 1633 couldn't very strongly resemble Caslon to modern eyes. Caslon was noted as being very similar to Dutch typefaces of the period preceding it - and, as I noted, during the 1550-1650 desuetude of English publishing, Dutch type was much used in England (as I learned from Updike).</p>
      <p>Incidentally, some Google searches I made in connection with this thread led me to some books by the Elston Press on Google Books; from thence, I found this very informative page when looking for information on the types it used:</p>
      <p><a href="http://www.elstonpress.com/PrivatePressTypes.html" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://www.elstonpress.com/PrivatePressTypes.html</a></p>
      <p>The Elston Press is shown making do with types from ATF, but they had commissioned their own Jenson revival for an edition of <a href="http://www.elstonpress.com/ElstonHouseOfLife.html" title="Click to visit an external URL." class="freelink freelink-external freelink-external">The House of Life</a> by Dante Gabriel Rossetti.</p>
      <p>In one case, though, Caslon Old Roman was pictured - that was a Lanston Monotype face (I see now that they must have licensed it from ATF, who got it from Barnhart Brothers), and it was a sort of Jenson (a quite lovely one, actually, <a href="http://www.galleyrack.com/images/artifice/letters/press/comptype/monotype/typography/composite-specimen/lanston-monotype-00780-caslon-old-roman-00781-caslon-old-roman-italic-mtf1-0600grey-001-crop-showing-2384x1048-scale-2048x900.jpg" title="Click to visit an external URL." class="freelink freelink-external freelink-external">although I find the capital X idiosyncratic</a>), despite its name.</p>
    html_clean: |-
