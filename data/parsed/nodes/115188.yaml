    html: |-
      <p>The period from 1550 to 1650 was when printers in England operated under license restrictions that led to a serious decline in English printing.</p>
      <p>Day Roman, which is even available free, is based on the work of an English typefounder before 1550. Fell dates from about 1700, and Caslon is even later.</p>
      <p>English printers often used Dutch types during that period, so Plantin is another possibility.</p>
