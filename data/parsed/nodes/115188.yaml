    <p>Hello all,</p>
    <p>I am looking for font similar to what would have been used in England in the 1600s.  Specifically, the words I would like to print are those of the poem "Death Be Not Proud" by John Donne.  This "Holy Sonnet" was written around 1610 and published in 1633 and I would like to find some fonts that are suited to this time period.</p>
    <p>Thanks!<br>
    Cameron</p>
