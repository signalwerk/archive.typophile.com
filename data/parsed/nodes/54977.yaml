    <p>I'm trying to identify the font shown here. It's an all caps font and if you look at the word "Elves" you can see the distinction between the upper and lower case "E" quite clearly. Also, the text "SAGA OF THE STORM" at the top of the image appears to be actually typed with the Caps Lock on. I've never seen the font at a large size and this is about the best I can do in terms of an image. If it's any help, the image is from a 2001 screenshot.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Warlord font_4232.PNG"></div><p></p>
