    <div class="info">Submitted by <a href="/user/108" title="View user profile.">Miss Tiffany</a> : 21.Mar.2006 9.10am </div>
      <p>=====</p>
    <p><strong>Jill Bell, lettering artist</strong> will be treating us to a variation of her presentation Traces of the Brush given at <a href="http://www.typo-berlin.de/">TypoBerlin</a>, Germany this past year about surviving, thriving and staying relevant as a commercial artist rooted in traditional lettering methods. </p>
    <p>With a degree in English from UCLA and Advertising/Design from Otis/Parsons, Bell worked as a production artist for Saul Bass, as a sign painter and a calligrapher. She will discuss how and why she guided her career away from traditional hand lettering work into designing and producing digital type, logos and marks and yet retains the spirit and essence of her training. </p>
    <p>Join Jill after the lecture for a workshop exploring ways to add panache to your handwriting and in turn enhance your design skills. No previous experience required. </p>
    <p><a href="http://kansascity.aiga.org/1pdf/JillBell.pdf">Download</a> event flyer and workshop supply list (pdf) </p>
    <p><strong>LECTURE:<br>
    Saturday, April 22, 2006</strong><br>
    10:00am - 11:30am (includes Q&amp;A)<br>
    Johnson County Community College<br>
    Little Theatre, GEB 233<br>
    College Blvd and Quivara Rd<br>
    Overland Park, KS 66210</p>
    <p><strong>WORKSHOP:<br>
    Saturday, April 22, 2006</strong><br>
    limited to 30 participants<br>
    12:00pm - 3:00pm (includes Q&amp;A)<br>
    Johnson County Community College<br>
    Little Theatre, GEB 233<br>
    College Blvd and Quivara Rd<br>
    Overland Park, KS 66210</p>
    <p>Learn more about this lecture and workshop and register online.</p>
