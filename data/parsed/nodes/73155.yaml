    html: <p>The convention in ye olden days before desktop publishing was that you put a space before and after ellipses and em dashes, on the assumption that — when line breaks occurred deep inside the guts of the phototypesetting machine — the spaces would allow for better line breaks. With the advent of WYSIWYG, the spaces are probably not necessary UNLESS, for some reason, at a later date you need to reflow the text and don't feel like going back and checking every freaking ellipsis or em dash in your copy...</p>
