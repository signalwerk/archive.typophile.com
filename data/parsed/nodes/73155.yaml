      <p>This subject is timely for me as I just finished a large job in which the client didn't like the style of ellipsis I used (I used the font's ellipsis character with a thin space on either side) and she asked me to go back and change them all to a different style.</p>
      <p>To be honest I'd never given a lot of thought to this subject, so I spent a few minutes doing some research and was surprised to find some disagreements over ellipsis style.</p>
      <p>So if there is a generally-agreed-upon "proper" style, I'd like to know it.</p>
      <p>&gt; at a later date you need to reflow the text</p>
      <p>Don't know what program you're using, but if its InDesign you can apply the "no break" attribute to the ellipsis and the word before it, and that will keep them together even if the text reflows. A similar technique can be used to keep phone numbers, URLs, etc. from breaking.</p>
