      <p>Like Frode said: no word-space if it stands for omitted characters or parts of a word like in “f… rules”<br>
      but space before and after if the ellipsis replaces whole words or part of sentences like here … or to leave things open in the end …</p>
      <p>Your examples would be set like this:<br>
      “Up to 50% off …”<br>
      “… this week only”</p>
