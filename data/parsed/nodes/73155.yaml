    <p>Hi all, just wandering if there is a correct way to treat the space around an ellipssis (…) or if it is just a mater of taste. I general follow these two rules (rightly or wrongly):</p>
    <p>1. If the ellipsis falls at the start or end of a sentence then I do not separate the ellipsis with a space.</p>
    <p>e.g. “Up to 50% off…”<br>
    e.g. “…this week only.”</p>
    <p>2. If the ellipsis indicates omitted text within the middle of a sentence then I add a space either side.</p>
    <p>e.g. “I have no idea if this is correct … I wish I knew the answer” </p>
    <p>Any help?</p>
