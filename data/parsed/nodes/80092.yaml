    <p>The <a href="http://www.typesociety.org/" rel="nofollow">Society of Typographic Aficionados</a> is happy to announce the second annual SOTA Catalyst Award for young people who have created original work in type design, type history, or other areas related to typography. The award recognizes a person 30 years of age or younger who shows both achievement and future promise in the field of typography.</p>
    <p>The recipient will be awarded up to $1,500 USD in reimbursement for transportation and lodging expenses to attend the <a href="http://www.typecon.com/" rel="nofollow">TypeCon2011</a> conference in New Orleans, July 5th - 10th. They will also have their registration fee for the main conference paid for and will give a 20-minute presentation to the main conference. The SOTA Board of Directors hopes that this introduction to a large audience of typographic aficionados will be a catalyst in the career of the recipient.</p>
    <p><strong>Submission Deadline</strong></p>
    <p>April 1, 2011</p>
    <p><strong>Notification of Award</strong></p>
    <p>April 25, 2011</p>
    <p><strong>Judging Committee</strong></p>
    <p>Mark Jamra<br>
    John Hudson<br>
    Tiffany Wardle de Sousa</p>
    <p><strong>Requirements</strong></p>
    <p>You must be 30 years of age or younger on July 7th, 2011. You must also attend <a href="http://www.typecon.com/" rel="nofollow">TypeCon2011</a> in New Orleans, July 7th - 10th, 2011 and make a presentation during the conference.</p>
    <p>The following materials must be emailed to <a href="mailto:catalyst@typesociety.org" rel="nofollow">catalyst@typesociety.org</a> by the submission deadline. A single PDF file (may be multiple pages) containing the following information is preferred:</p>
    <ol>
    <li>Examples of a specific project or related group of work to be the topic of the presentation</li>
    <li>A brief description of the presentation (100 words or less)</li>
    <li>A letter explaining your involvement in typography (300 words or less)</li>
    <li><strong>Optional:</strong> Online links to additional work or background information</li>
    </ol>
    <p>Include your name, date of birth, postal address, organization or university affiliation (if applicable), email, and phone number with area code. Applicants from outside the U.S. or Canada should include their country dialing code as well.</p>
