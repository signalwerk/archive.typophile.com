  html: |-
    <p>Look what I just found - <a class="freelinking external" href="http://flippingtypical.com" rel="nofollow">http://flippingtypical.com</a></p>
    <p>It's like a dumbed down version of <a class="freelinking external" href="http://typetester.org" rel="nofollow">http://typetester.org</a>, but with dozens of typefaces rendered at once and without any Flash trickery on the webpage itself.</p>
    <p>Make sure to read the "WTF" (FAQ) page though. Specifically, this thing uses fixed database of fonts, but it can be told about other fonts and FAQ explains how to do that.</p>
