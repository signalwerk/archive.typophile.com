    <p>I have a customer in Poland (a newspaper), with the following setup:</p>
    <p>mac: Quark 6.5, OS X10.4<br>
    pc: Quark 4.1, OS Windows 98</p>
    <p>I’m having difficulty with the appropriate font formats, especially as I don’t have a version of Quark 6 to test fonts on.</p>
    <p>I figured that a TrueType flavored OpenType font would work in both platforms, but apparently Quark 6 in OS X doesn’t recognize the necessary CE characters in my fonts.</p>
    <p>What’s the answer?</p>
