      <p>The first thing I'd do here is take a look at what similar work exists. Here's one example:<br>
      <a href="http://www.linotype.com/240634/itcbauhausbyadobe-family.html" title="http://www.linotype.com/240634/itcbauhausbyadobe-family.html">http://www.linotype.com/240634/itcbauhausbyadobe-family.html</a><br>
      Note how curves extend slightly below the baseline. As you print out your designs and critique them yourself, notice how some glyphs appear to dwarf others when placed next to one another, for example your o and i. Also note how horizontal lines of the same thickness as vertical appear heavier. Above all, make sure it makes sense to you, you can see it on paper, and you understand why you're changing something before you take someone's advice and do it.</p>
