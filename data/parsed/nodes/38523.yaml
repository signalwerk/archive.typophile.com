    html: <p>I agree that this looks too much like Bauhaus.  However, the last image, with just numbers, is great!  I would redesign your lowercase based on what you've done with the numbers.  Keep only the S and the backwards-S/upside-down-E character, and see what new lowercase shapes you can come up with.</p>
