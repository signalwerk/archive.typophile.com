    <p>I am a graphic design student and new in field of typeface design. Please comment on the typeface "Polo" , I am currently working on. As the name suggests, its inspired from Polo mint shape. Please comment, so that I can improve upon and learn from your comments and suggestions.</p>
    <p>Thanks a lot,<br>
    Typomaniac</p>
