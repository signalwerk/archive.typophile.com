    <p>Here’s a question for you Illustrator Pros. Is there an extension/plugin that adds web/screen resize views to the current view sizes. </p>
    <p>In case you’re not following: Down in the bottom left there’s a pop-up menu with resize percentages ...100%, 150%, 200%, 300%, 400%... I’m curious if there’s a resize that works in web layout sizes like 800x600 or 1024x768 where it resizes your image to that percentage so that I don’t have to change my actual screen resolution to those sizes to get the idea. </p>
    <p>I’m not really sure how to search for such a feature or if it even exists (might be worthwhile to submit as a possible new feature for the upcoming releases.) </p>
    <p>Any ideas would be great. </p>
    <p>* Appreciate if you didn’t question my choice of using Illustrator to make web graphics, I prefer to start there then finish up in Photoshop. Thanks*</p>
