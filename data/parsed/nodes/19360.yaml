    html: |-
      <p>Miss Tiffany, I really appreciate your suggestions, actually some of those tools seem really cool, but it’s still not quite what I’m looking for. </p>
      <p>I’m clearly not expressing my needs right. </p>
      <p>Currently when I work in Illustator my monitor is set for 1280x1024 but most of the sites I do use a relative resolution of 800x600. When I work on them I have to switch my monitor resolution because I tend to make thing too large when I leave it at my original resolution. I hate loosing all that real estate in the larger resolution when I switch to the smaller resolution, so I was wondering if there was a quick Zoom/View feature that would allow me to keep my larger 1280X1024 resolution and only “zoom in” when I want to check to make sure I’m not making things too large. The work around I have now is thru my Video Card where I have to manually change the entire screen resolution (which usually takes a few seconds everytime, plus I don’t know how good that is for the video card to constantly switch back and forth between resolutions so frequently. </p>
      <p>I hope that makes sense.  I just want to have a nice little button or drop-down menu in Illustator that just Zooms my image to simulate a different resolution from what I’m working in. </p>
      <p>Think Developer Tools extension for Firefox where you can resize the browser to different resolutions without actually changed the screen resolution.</p>
