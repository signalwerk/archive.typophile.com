    html: <p>The typographic solution to this question is to start the paragraph with two or three words set in caps or small caps, and align the top of the drop cap with the top of those words.</p>
    html_clean: <p>The typographic solution to this question is to start the paragraph with two or three words set in caps or small caps, and align the top of the drop cap with the top of those words.</p>
