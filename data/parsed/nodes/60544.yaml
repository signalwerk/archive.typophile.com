      <p>I believe that <a class="freelinking external" href="http://www.arts.ac.uk/index.htm" rel="nofollow">University of the Arts London</a> (formerly known as London College of Printing) has a good reputation, but the answer to your question depends on how you define and wish to practice "typography." Display, book, information, type design…</p>
      <p>Additionally, now that you have finished your undergrad, do you wish to study this at a graduate level? That significantly narrows your search. If it's at a graduate level, I would recommend considering who your supervisor might be to assist you in your search, unless it's an entirely course based program in which case it's not as important.</p>
