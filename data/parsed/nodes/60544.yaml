    <p>i've just finished my four years of graphic design studies (plus i'm working on an israeli first dergree in the israeli open university).</p>
    <p>i really want to study typography in an insitute (not in israel), but i can't find any programs. offcourse, i'm not talking about one or two seperate courses, i'm talking about respectable full-time typography studies.<br>
    could some of you please give me some names or links to such programs?<br>
    thanks!</p>
