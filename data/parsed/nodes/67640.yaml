    html: |-
      <p>That time period probably means a film type was used. It's a slab/Egyptian style, similar to <a class="freelinking external" href="http://new.myfonts.com/fonts/linotype/glypha/">Glypha</a>, but a bit condensed. It's rather hard to find these with middle serifs on the E, and that's why I picked Glypha as a similar font.</p>
      <p>- Mike Yanega</p>
