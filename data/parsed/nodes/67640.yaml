    <p>This shows up on a ton of paperbacks from Bantam in this era. It is not quite Profil/Decorated 035--it lacks that oblique touch. </p>
    <p><a href="http://img90.imageshack.us/img90/6513/thebarbarouscoastax0.jpg" title="http://img90.imageshack.us/img90/6513/thebarbarouscoastax0.jpg">http://img90.imageshack.us/img90/6513/thebarbarouscoastax0.jpg</a></p>
    <p>Any ideas?</p>
