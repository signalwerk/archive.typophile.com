    html: |-
      <p>Do you mind if I make a visual suggestion? I ask because it can do violence to the integrity of a process if it is uninvited.</p>
      <p>I think your girlfriend makes a good point.</p>
      <p>I wonder too about using broken lines rather than curves. Or breaking the lines more than once. Or breaking them at an angle. What about a lc d? Sort of a : "dL"</p>
      <p>Your pinwheels are fun. What's that about?</p>
      <p>My sense is that confidence can be shown in any of a wide variety of ways. The path chosen is not just confident. It's also a bit macho. The pinwheels work against that. I am not saying either thing is good or bad. I sense* that you are sort of shrugging your shoulders to a certain extent at my questions about intention even as you answer them. But I want to urge you again to think about your intended communication to clients. There are good counter arguments, but think there are far more validating ones. Here are two: the more you are certain of your intent the more you are inspired by it to think of options that fit; but more importantly a sense of intent saves time because it makes it easy to kill the many many ideas that are outside your intent. </p>
      <p>* Maybe I am making a mistake here but that's how it seems.</p>
      <p>Keep going.</p>
