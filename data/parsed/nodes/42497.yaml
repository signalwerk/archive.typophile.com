      <p>@ Eben Sorkin:</p>
      <p>I'd like to think strength and boldness communicates a comforting confident quality.</p>
      <p>Here is some refinements and different enclosures. Now with colour! Admittedly a bit garish colours on the lower half, those will be replaced with less vibrant colours. The idea is still that the mark itself is the letter forms, but that the enclosure can be swapped out to suit a specific need or mood.</p>
