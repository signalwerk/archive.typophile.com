    <p>I hate designing things for myself. I find it impossible as I'm far to close to the project. So while I plan to redesign my site and marketing materials, I've decided to give my logo another shot.</p>
    <p>I went to the book store and flipped through some logo books for about 5 hours yesterday and then came home and sketched out some quick ideas on paper playing with the L and D in my companies name. The enclosures themselves I'll worry about latter, but for now I want to get opinions on the basics of the mark.</p>
    <p>I used a few different typefaces to create these comps, Helvetica, Futura, Interstate, ect.</p>
    <p>I'm not looking for something flashy in itself. But something that can be used in a variety of ways, in obtrusively on client work, distinctive on presentations and marketing material of my own. So something like this I think could be used with a few different background lockups to either emphasize or subdue it as it's so simple.</p>
    <p>But maybe it's too simple and will be easily confused with other things?</p>
