      <p>Well, I'm finally putting this logo to print. But after a year of using it online I'm beginning to wonder about my type paired with the logo. </p>
      <p>Currently I use helvetica, but I was thinking about something less neutral like Gotham, but that isn't as overused as gotham is since the last election.</p>
      <p> </p><div class="imageWrap"><img src="http://typophile.com/files/LD-Final_6517.jpg"></div><p></p>
      <p>Is helvetica a good enough pairing, or should I try another?</p>
  - id: 327435
    user_id: 13127
    user_name: Marco
    user_path: null
    date_raw: 6 Feb 2009 — 6:46am
    date: 2009-02-06T06:46:00
    votes: null
    html: |-
      <p>Although I'm drawn to helvetica, in this case maybe something with a little more personality? Also I think the type and symbol should have some kind of relation, e.g. the symbol is round, Helvetica isn't. for instance the dot on 'i'. Maybe try Avenir?</p>
      <p>I also belief that if you go with the 'neutral sans'-route, the weight of typography and monogram in the circle should match closer. Personally I would look for a bit more  difference and look for a Serif which complements the symbol.</p>
      <p>That said, it's looking good already. Would like to see how you would apply it tyo a businesscard.</p>
