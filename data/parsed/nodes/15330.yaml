    date_raw: 25 Sep 2005 — 7:36am
    date: 2005-09-25T07:36:00
    votes: null
    html: <p>Forget about Next. These are Mac file types that predate OS X. They are always four characters. In older Mac OS's you never saw them unless you used a developer tool. LWFN is the file type of a PostScript outline font. FFIL is the file type for a font suitcase. Too bad they decided to use such generic looking icons. What was wrong with a picture of a suitcase?</p>
