      <p>Although this does not explain what <strong>FFIL</strong> and &lt; strong &gt;LWFN stand for it has some good information about Apple fonts from Apple's developer notes:</p>
      <p><a href="http://developer.apple.com/technotes/te/te_21.html#Section2" title="http://developer.apple.com/technotes/te/te_21.html#Section2">http://developer.apple.com/technotes/te/te_21.html#Section2</a></p>
      <p>Personally, I believe that <strong>LWFN</strong> stands for <strong>L</strong>ine<strong>W</strong>ork <strong>F</strong>o<strong>N</strong>t, since <strong>linework</strong> is a common term in the printing industry for vector graphics.</p>
      <p>Claidheamdanns</p>
