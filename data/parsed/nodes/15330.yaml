    votes: null
    html: |-
      <p>At the time the "creater" LWFN was adopted, the Apple LaserWriter (PS level 23.0) was the only PostScript printer in existence.</p>
      <p>LWFN is an Apple name for LaserWriter [outline] FoNt.</p>
      <p>The screen fonts, which were bitmaps, were in separate font "suitcases".</p>
      <p>The outline fonts were in Type 1 format, with each face appearing separately.</p>
      <p>Times Roman had four outline files. Others had eight or more.</p>
