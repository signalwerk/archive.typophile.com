    <p>Hi,</p>
    <p>when I look into the font folder of, let say <em>Palatino</em>, I find 5 files. One is the “Font Suitcase” and the icon bears the letters FFIL. The 4 other files are “Postscript Type 1” and the icons bear the letters LWFN.<br>
    My questions are:</p>
    <ul>What do FFIL and LWFN stand for?</ul>
    <ul>Is the “Font Suitcase” a bitmap font?</ul>
    <p>To rephrase the previous question:</p>
    <ul>What's the FFIL file for and what does it do?</ul>
    <p>Cheers,</p>
    <p>Seb</p>
