    html: |-
      <p><em>Personally, I believe that LWFN stands for LineWork FoNt, since linework is a common term in the printing industry for vector graphics.</em></p>
      <p>That's an interesting theory. You have to remember, though, that the people who came up with these things were not printing industry people, they were programmers. For nearly a year, the only device commercially available that could output PostScript fonts was Apple's LaserWriter. PostScript fonts were commonly called LaserWriter fonts for a while. When the Linotronic and other devices came out, the usage faded, but even the Linotronic was accessed via the <em>LaserWriter</em> driver for years after, even when the LaserWriter was discontinued. Note also that Apple's icon for a PostScript font was a picture of a LaserWriter printer.</p>
  - id: 259968
    user_id: 25412
