    html: <p>Although Adobe has continued to improve the rendering in Acrobat/Reader, it wouldn't even occur to the people doing the rendering engine to try to improve the rendering only with Adobe's fonts, or disadvantage third party fonts. They're more concerned with trying to make all fonts work as well as possible - even badly made ones, although there may be limits as to what they can achieve in some cases when the font is itself made improperly.</p>
