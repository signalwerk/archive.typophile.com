    html: |-
      <p>&gt; <em>I think that the font I’m using for the information in the form fields (Adobe’s Helvetica Neue LT STD) may be preventing the document from printing on some Postscript laser printers</em></p>
      <p>Helvetica Neue LT Std allows embedding but not editable-embedding. This means that the fonts can be embedded in the PDF but you won't be allowed to edit the fields that use such fonts afterwards (e.g. with Acrobat). Try using a font that allows editable-embedding, like Myriad Pro or Minion Pro, in the form fields, or a font that you're sure everyone will have in their computers, like Arial. You can still use Helvetica Neue LT Std for static text.</p>
