    <p>Hi, I have a general question regarding the best fonts to use in a PDF document.<br>
    My company often sends out pdf documents that are probably mostly viewed on screen yet are also printed (especially for conferences). I like using the sans-serif/serif contrast in design. But what fonts to use? What serif fonts best show up in a PDF document on screen? What san-serif fonts are best to use?</p>
