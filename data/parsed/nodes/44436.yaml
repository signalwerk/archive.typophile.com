    html: <p>If your PDF has form fields, pay close attention to the font you specify for use in the fields. I've been creating some PDFs for intra-office use lately, and I think that the font I'm using for the information in the form fields (Adobe's Helvetica Neue LT STD) may be preventing the document from printing on some Postscript laser printers (HP 5100, I'm looking at you), becuse they don't have this font installed. As I haven't finished troubleshooting this, I can't be mose specific, but I'm like 98% sure that this is the issue. This doesn't seem to be an issue on color laser printers with built-in RIPs, though. . . YMMV. Regardless, this may not be an issue for you, asI've had no problems at all with text that is not part of form-field elements in the PDFs.</p>
    html_clean: <p>If your PDF has form fields, pay close attention to the font you specify for use in the fields. I've been creating some PDFs for intra-office use lately, and I think that the font I'm using for the information in the form fields (Adobe's Helvetica Neue LT STD) may be preventing the document from printing on some Postscript laser printers (HP 5100, I'm looking at you), becuse they don't have this font installed. As I haven't finished troubleshooting this, I can't be mose specific, but I'm like 98% sure that this is the issue. This doesn't seem to be an issue on color laser printers with built-in RIPs, though. . . YMMV. Regardless, this may not be an issue for you, asI've had no problems at all with text that is not part of form-field elements in the PDFs.</p>
