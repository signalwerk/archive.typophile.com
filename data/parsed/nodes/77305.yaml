  html: <p>I read <em>Going Bovine</em>. Despite all the funky space-time travel, it was mostly the font that nibbled at my brain after I read it.  I apologize for asking you to go to <a class="freelinking external" href="http://www.amazon.ca/Going-Bovine-Libba-Bray/dp/0385733976" rel="nofollow">Amazon</a> (click on the book cover to see the font) to look at it, Typophile wouldn't let me upload the screenshot. Can anyone ID this one?</p>
