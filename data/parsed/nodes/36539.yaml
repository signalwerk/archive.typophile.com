      <p>Dan, I agree with Frederik’s sentiment in the sense that talking about a person in a personal way on Typophile rather than about their work or their ideas or their comments can quickly become questionable. This thread does look a bit like an invitation to ’stir the pot’ rather than an opportunity to further anybody’s understanding. Do you disagree?</p>
      <p>On the other hand Fredrik, you could of course not contribute to the thread. I should note that it is not always possible to know who is around &amp; who is not *for sure*. So intensive checking every time somebody has a comment isn’t actually practical or reasonable. </p>
      <p>So what I am saying is ’it’s the content’. And ’please keep it civil dudes’.</p>
      <p>Thanks.</p>
