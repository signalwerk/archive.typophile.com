    html: '<p>Metadox. I can answer your question about the creator of the <br>Marker Felt fonts. That was Pat Snyder (who correctly shows <br>up in the copyright of the font you linked to in your last post). <br>I registered my copies of various of his fonts long ago. <br> <br>Mr. Snyder used to have a Web page, but that disappeared <br>years ago. All efforts of mine to find and contact him again <br>a few months ago failed. <br> <br>The fonts were originally (no surprise) for the Mac and can <br>be found <a href="http://www.erik.co.uk/font/arty.html" target="_blank"> here</a>, complete with documentation. Mac folk: See <br>his nifty SnyderSpeed font as well. Marker Felt Wide and <br>Marker Fine Point for Windows may be found <a href="http://www.filelibrary.com/Contents/Multi-Platform/100/33.html" target="_blank"> here</a> (file <br>names begin with mf) with docs. <br> <br>This <a href="http://www.apple.com/macosx/features/fonts/" target="_blank"> Apple web page</a> gives credit to Pat Snyder. I hope that <br>they gave him some cash too. <br><br></p>'
