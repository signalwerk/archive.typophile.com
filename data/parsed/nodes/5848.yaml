    html: <p>Anyone know the real origin of Marker Felt? It's now supplied with Mac OS X, but the versions digitized by Dieter Steffman and various shareware/freeware designers are different. The "Marker Felt Thin-Plain Regular" face on <a href="http://www.searchfreefonts.com/fonts/m5.htm">this page</a> seems to match the "a" in the sample, but I don't know if this is an approved version of the font as far as Typophile is concerned.</p>
