    html: <p>Thanks for that info, Mike. So it looks like Pat Snyder designed the font circa 1992 and then Dieter Steffman filled out the character set in 2001, at least for the normal weight (don't know if he got permission from Snyder), then Apple licensed the normal weight for OS X.</p>
