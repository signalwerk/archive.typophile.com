    html: |-
      <p>It’s proved a little difficult finding a quality image of pre-1920 Packard Automobile ads, but here is one from 1918.<br>
      </p><div class="imageWrap"><img src="/files/Packard-ad1.jpg"></div><p></p>
      <p>I once read about the great care that Packard Automobiles took in building their advertising image, but I can’t find any sources at the moment. Just thought it was interesting to share. I have seen earlier ads where the face looked closer to what we know as Packard Antique or Packhard. </p>
      <p>In the old Compugraphic specimen book I have, there are two weights of Packard, the lighter is similar to the weight in the auto ad. If someone has a ready reference on the designer and origin of the face, it would be nice to add to this thread.</p>
