    html: <p>The value of virtually anything is that which you assign to it; the price is what you are willing to pay for it. If you choose a typeface based on the fact that a prestigious magazine uses it, you surrender your valuation for someone else's. And, finally, your choice of a typeface isn't going to make your prose any more credible or erudite; it can only render it more—or less—readable.</p>
