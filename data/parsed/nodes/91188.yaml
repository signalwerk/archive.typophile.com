    <p>It has been said several times on other threads on this forum, but good quality fonts seem to be very expensive to the newcomer / rank amateur (a category to which I firmly belong). I am looking to purchase at least three, possibly four decent fonts to use to produce my documents with (technical reports for UK planning matters, ranging from 10 -1,000 pages).</p>
    <p>Thus far I am liking the look of <strong>Brioni text</strong> from <cite>Typotheque</cite> which (after much googling) I learned was one of the primary fonts for the Financial Times Weekend magazine; in keeping with the FT theme I am also considering <strong>Fedra Sans</strong> from the same company. </p>
    <p>From <cite>Hoefler &amp; Frere-Jones</cite> I am torn between the <strong>Hoefler Text</strong> and the seemingly more recent <strong>Mercury Text</strong>. Both appear to offer all sorts of 'weights' - something I first encountered when reading 'Typography Lawyers'. That said, the <strong>Equity</strong> font by Mr Butterick also seems really good, except it doesn't do 'old-style' numbers (yet), but at only $120 you do get a lot of font for your money.</p>
    <p>Rather than trawl the web looking for lots of free fonts I would like something with a lot of characters ('glyphs'?) that has been well designed and I can use for documents that have a technical / professional content. </p>
    <p>Are these choices wide of the mark? How did others get started when it came to selecting their first font-for-cash?</p>
