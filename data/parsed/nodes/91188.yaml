      <p>oldnick is quite right. From your posts it seems like you are looking for a transitional face, or at least something quite neutral and “academic”. I tend to consider Fleischmans (Mercury is a contemporary reintepretation, but perhaps a bit too polished?) a category of it’s own. Although they were made for book printing (I have a beautiful book from 1805 typeset in Fleischman), there’s more “sparkle” on the page then with a typical old style face, so it might work for your use. I’d like to suggest Kent Lew’s <a href="http://fontsinuse.com/norwegian-bible-2011-editions/" rel="nofollow">Whitman</a> as another option.</p>
      <p>If you manage to make a shortlist (consider personal taste, technical requirements &amp;c), I strongly suggest you get hold of printed samples—ideally produced with the same printer as your technical reports—to compare them IRL. </p>
      <p>Another thing: Don’t get sucked in to the gazillion weights hysteria! Consider what you <em>really</em> need.</p>
