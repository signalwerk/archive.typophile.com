      <p>An enviable predicament indeed. Brioni text, Fedra and Fedra sans would all make great choices. </p>
      <p>I'll add a couple more to your list: you might like some of the faces that Hoftype produce, particularly Cala: <a href="http://www.hoftype.com/node/37" title="http://www.hoftype.com/node/37">http://www.hoftype.com/node/37</a> (serif) &amp; Impara: <a href="http://www.hoftype.com/impara" title="http://www.hoftype.com/impara">http://www.hoftype.com/impara</a> (sans-serif), both of which would work well together I think. As a little added bonus, they offer the light weights of both for free at myfonts so you can try them out to see how they look.</p>
