      <p>What an enviable dilemma! You'll get a number of<br>
      good pointers from professional users of fonts I'm<br>
      sure; here are some opinions from a maker:</p>
      <p>Brioni:<br>
      <a href="http://typographica.org/typeface-reviews/brioni/" title="http://typographica.org/typeface-reviews/brioni/">http://typographica.org/typeface-reviews/brioni/</a><br>
      It's nicely contemporary without being mannered.<br>
      Be aware that its generous x-height makes it more<br>
      suitable for small point sizes.</p>
      <p>Fedra is idiosyncratic, but I believe highly readable.<br>
      It also has the wonderful feature of multiple extender<br>
      lengths, which allows the accommodation of various<br>
      point sizes of text.</p>
      <p>Hoefler Text comes with Macs. Because it's very nice.<br>
      But that also means it might be too common to pay<br>
      good money for. Mercury is a Fleischmann revival,<br>
      which means it's naturally highly readable, and a<br>
      solid choice in many other ways.</p>
      <p>Equity is a nice if conservative design, and its low<br>
      price might make it worthwhile, although it can't<br>
      be too versatile; you could still use it to add some<br>
      divergence from the other workhorses you'll buy.</p>
      <p>Whatever you choose, it does sounds like you will<br>
      need a wide choice of numeral styles: proportional<br>
      &amp; fixed-width combined with lining &amp; "old-style" at<br>
      the very least.</p>
      <p>hhp</p>
