      <p>Have a look at <a class="freelinking external" href="http://www.type-together.com" rel="nofollow">Type-Together</a>, esp. at Sirba, Skolar, Capitolium 2, Coranto 2. Have a look <a class="freelinking external" href="http://www.fontfont.com" rel="nofollow">fontfont.com</a>, esp. at Milo Serif, More, Page Serif, Tisa, Scala. Have a look at Greta Text from <a class="freelinking external" href="http://www.typotheque.com/fonts/greta_text" rel="nofollow">Typotheque</a>. </p>
      <p>I do not work with typography or graphic design, so I do not have professional experience in that area.</p>
      <p>Maybe something to think about: As TimesNR is everywhere the “transitional” serif model (the genre of Times) might be seen as the most neutral serif model, therefore it might be a good idea to go with Mercury. Other than that, I did read here that slabs stand for a certain conservative reliability, so Brioni would be a good choice too. In my opinion Hoefler Text as an “old style” serif model is too literary. </p>
      <p>Best.</p>
