      <p>Celeste, a contemporary reinterpretation of the Transitional heritage, by Christopher Burke, seems an appropriate choice for your needs - text settings for reports instead of, say, novels or more "literary" oriented publications. I have read a book set in it (an essay on Tschichold, by Burke himself), set in a large format, in two columns, and it worked nicely.</p>
      <p><a href="http://www.hiberniatype.com/Celeste/celesteregular.html" title="http://www.hiberniatype.com/Celeste/celesteregular.html">http://www.hiberniatype.com/Celeste/celesteregular.html</a></p>
      <p>I also agree with Frode's general considerations and suggestion about Whitman - an excellent typeface:</p>
      <p><a href="http://www.kentlew.com/WhitmanOverview.html" title="http://www.kentlew.com/WhitmanOverview.html">http://www.kentlew.com/WhitmanOverview.html</a></p>
