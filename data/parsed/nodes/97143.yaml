    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Logo_6611.gif"></div><p></p>
    <p><a class="freelinking external" href="http://www.monotypeimaging.com/productsservices/typedesignershowcase/SteveMatteson/" rel="nofollow">Steve Matteson</a>, Monotype Imaging’s creative type director, will present <a class="freelinking external" href="http://printinghistory.org/programs/conference/2012/program.php" rel="nofollow">“Discovering the Goudy Legacy”</a> at the <a class="freelinking external" href="http://printinghistory.org/programs/conference/conference_2012.php" rel="nofollow">2012 APHA Conference</a> – the 37th annual conference presented by The American Printing History Association (APHA), Oct. 12-13, at Columbia College Chicago, Center for Book and Paper Arts.</p>
    <p>Frederic W. Goudy was a prolific American book and type designer. He is famous for his prodigious output, designing more than 100 typefaces between 1896 and 1941, which was considered the golden age of printing. His wife, Bertha M. Goudy, a self-taught book designer and compositor, was one of America’s pre-eminent female graphic designers. On Nov. 6, 1933, Time Magazine published <a class="freelinking external" href="http://www.time.com/time/magazine/article/0,9171,746262,00.html " rel="nofollow">“Art: Type Couple,”</a> on the growing influence of the Goudys in typography and design. In <a class="freelinking external" href="http://www.goudyfonts.com/pdf/bertha-m-goudy-tribute.pdf " rel="nofollow">“A Tribute to Bertha M. Goudy,”</a> written by Frederic Goudy and composed by Matteson, Goudy wrote that his wife “enabled me to attain a measure of success which I could not have achieved without her.” </p>
    <p>Matteson’s presentation will explore the impact this duo had on the state-of-the-art of graphic communications, printing, type design and typography. He’ll discuss how they lived, entertained and worked together. Matteson has an extensive background in the history of typography, design and printing. His work can be found everywhere from Android mobile products to e-readers such as the Barnes &amp; Noble Nook device. He lectures frequently about the Goudy legacy and has created numerous Goudy revivals including the <a class="freelinking external" href="http://www.fonts.com/font/ascender/friar" rel="nofollow">Friar Pro</a>, <a class="freelinking external" href="http://www.fonts.com/font/ascender/bertham" rel="nofollow">Bertham Pro</a>, and <a class="freelinking external" href="http://www.fonts.com/font/monotype-imaging/goudy-ornate-mt?isRatingExpanded=False" rel="nofollow">Goudy Ornate MT</a> typefaces.</p>
    <p>Saturday, Oct. 13 at 11:00 a.m.<br>
    Columbia College Chicago, Center for Book and Paper Arts<br>
    <a class="freelinking external" href="http://printinghistory.org/programs/conference/2012/registration.php" rel="nofollow">Register online or download</a> the registration form.</p>
