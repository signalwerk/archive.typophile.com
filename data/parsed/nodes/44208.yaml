    html: <p>cheers but although I have found I can drag the BCP out with Alt, i have found a better workaround - given it only affects curve-to-straight-line points, not straight-line-to-curve points, i can temporarily reverse the direction of the contour to work on the problem node. NB I have the same problem on both my PCs; have logged a support query with FontLab.</p>
