  - id: 273356
    user: 2462
    date: 2008-04-17T12:26:00
    date_raw: 17 Apr 2008 — 12:26pm
    votes: null
    html: <p>Holding down Alt (or whatever the Mac equivalent is) when clicking and dragging at a node will create a control handle if it doesn't have one, and if it already has both, it will move the node itself while keeping the control points where they are. So you could prevent this behavior by temporarily turning the straight line into a curve, and you can use the latter effect to dig out control points already stuck under the node. As for why it would do this in the first place, I have no guess.</p>
