    <p>I've had TT2 for years but only really started trying to use it. </p>
    <p>Getting a very frustrating problem though -- some of my tangent nodes are misbehaving. On trying to move the single BCP in any way, it retracts into the node entirely and I can't find any way of getting it out, apart from undo or completely deleting the node and drawing another. All forms of snap are off.</p>
    <p>Any ideas?</p>
