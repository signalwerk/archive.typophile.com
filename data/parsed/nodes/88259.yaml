  html: |-
    <p>Hello,<br>
    Please help: I can't generate a OT-font from FontLab, cause this alert: GPOS feature 'kern' causes overflow of offset to a subtable (0x336a0).<br>
    What does that means, and how can I 'clean up'? </p>
    <p>In advance, thanks!<br>
    Best, Morten</p>
