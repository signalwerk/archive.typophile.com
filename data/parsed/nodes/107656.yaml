      <p>With digital fonts, I see no need of a special compound character; what you need  is a ה with the right width and the ability to position strings. With TeX based editors you can write אדני with a smaller font and use \kern to move it where you want.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/longhe_4269.png"></div><p></p>
