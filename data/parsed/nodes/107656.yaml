    <p>Over at the <a href="http://opensiddur.org/2010/07/unicode-compliant-and-open-source-licensed-hebrew-fonts/#comment-16197" rel="nofollow">Open Siddur Project</a>, we've received a handful of requests for Unicode Hebrew fonts with interesting ligatures that I've seen in print but never before in a digital (Unicode) font.</p>
    <p>The first is a bowing lamed. The second is a letter hey wherein the divine name אדוני (adonai, lit. lord/master) is spelled.</p>
    <p>Has anyone seen a Unicode font with such ligatures? I'd also be interested in learning about Hebrew fonts supporting other unusual ligatures (in the private use area, I imagine).</p>
    <p>Thank you.</p>
