    html: |-
      <p>Thank you, Michel. </p>
      <p>However, a TeX based solution is simply not practical while preparing Jewish liturgical texts in word processing applications that already conveniently support BIDI, RTL and Hebrew text with proper diacritic positioning (such as LibreOffice). </p>
      <p>DavkaWriter's proprietary (non-Unicode) fonts provide such a glyph. From what I've seen it's always addressed at U+00E6 (Latin Small Letter Ae).</p>
      <p>What's needed is an open source Unicode Hebrew font with such a ligature in its Private Use Area.</p>
      <p><a class="freelinking external" href="http://opensiddur.org/wp-content/images/yichud-hey.png" rel="nofollow">http://opensiddur.org/wp-content/images/yichud-hey.png</a></p>
      <p>Above is an example from the font KerenG found in its character table at 0x8DFD.</p>
