      <p>I’m probably the last person on Typophile that can give advice on OpenType features…<br>
      But from what I understand, there are features like Historical Ligatures (hlig) and Historical Forms (hist) which can be better suited for giving access to such glyphs, rather than adding them in the PUA (also ensuring the readability of the text in case a different font is used).<br>
      I know of two primers on OpenType features:<br>
      <a href="http://ilovetypography.com/OpenType/opentype-features.html" title="http://ilovetypography.com/OpenType/opentype-features.html">http://ilovetypography.com/OpenType/opentype-features.html</a><br>
      <a href="http://opentypecookbook.com" title="http://opentypecookbook.com">http://opentypecookbook.com</a><br>
      But for any further technical questions, the best place is probably the Build section of this forum: <a href="http://typophile.com/forum/6" title="http://typophile.com/forum/6">http://typophile.com/forum/6</a></p>
