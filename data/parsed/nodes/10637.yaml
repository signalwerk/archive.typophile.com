    date: 2003-03-04T18:37:00
    date_raw: 4 Mar 2003 — 6:37pm
    votes: null
    html: "<p>Saying that the writing of left-handers writing in a particular direction (left-to-right) with a particular writing implement is not readable is very different from saying that left-handers are illiterate. Illiterate typically means unable to read, not unable to write readably. <br> <br>You ignore GN's statement that 'I encourage left-handed students to write with their left hand [as opposed to some teachers who still force lefties to try to write with the right hand], because they too should work under optimal conditions.' This seems to me a very long way from saying that left handers are 'uncivilised'. <br> <br>He goes on to to say that the broad nib is 'essential for <i>discussing</i> left-handed writing' [my italics]; he is not saying that everyone must use broad nibs, as you seem to be suggesting, but that the broad nib reveals the difference between left and right hand writing <i>in the same direction</i>. His point about writing downwards is that this is the only way for left handed people to obtain the same stress pattern that <i>readers</i> expect and are used to recognising in, ahem, boumas. He does not say anywhere that the result of writing downward is unreadable to themselves or to anyone else: he says completely the opposite, that it is only by writing downwards that they can produce something generally readable. Rather than being contra-reader (user) as you seem to be suggesting, he is saying the opposite: that in order to satisfy the reader a lefty with a broad nib needs to write downward rather than left-to-right. <br> <br>Basically, I think you have completely and utterly misread every sentence of this short piece, perhaps because you have convinced yourself that it is 'cryptic'. It is not: it is straightforward. <br> <br> <br>I have not read Bilak's interview with Majoor, but I'm not sure that you are correct to identify the latter as a 'GN-er'.</p>"
