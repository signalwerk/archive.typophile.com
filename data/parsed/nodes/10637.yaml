    html: "<p>It isn't that this kind of design doesn't appeal to me: there are a few Goudy faces in a similar style that I really think are brilliant. I'll admit that I wouldn't be inclined to work in this style myself, but I don't think that's clouding my judgement. Note that I didn't make any comments about the style of the type, only about proportions, weights, etc. As far as I'm concerned, only the users of type really need to fuss about style: for me as a type designer, everything is in the details, and I think it is possible to examine any style of typeface from the inside out.</p>"
