    html: "<p>Hi Graham. <br> <br>I'm going to echo John's thoughts about sticking to upper case to begin with, because of the reduced number issues. <br> <br>Consider comparing your caps with the capitals from Bodoni in a Bold or Black weight. This will give you a great sense of the way the weight should be applied. Two Rules of thumb you will find in well drawn font: <br> <br>1. The weight goes from upper left to lower right. Look at the Bodoni M compared to yours. It has to be: <br>M = l + <b> \\ </b> + / + <b> l </b>  (hope that makes sense, it</p>"
    html_clean: "<p>Hi Graham. <br> <br>I'm going to echo John's thoughts about sticking to upper case to begin with, because of the reduced number issues. <br> <br>Consider comparing your caps with the capitals from Bodoni in a Bold or Black weight. This will give you a great sense of the way the weight should be applied. Two Rules of thumb you will find in well drawn font: <br> <br>1. The weight goes from upper left to lower right. Look at the Bodoni M compared to yours. It has to be: <br>M = l + <b> \\ </b> + / + <b> l </b>  (hope that makes sense, it</p>"
