  - id: 66758
    user: 1250
    date: 2003-03-04T17:42:00
    date_raw: 4 Mar 2003 — 5:42pm
    votes: null
    html: "<p>I'm not sure where I got \"chapter 7\" - a short circuit, sorry. It's in \"The other hand\", from page 79. <br> <br>\"they should write readable writing downwards.\" <br>Never mind that's not readable at all, of course... <br> <br>It's actually somewhat cryptic (maybe for a reason) - the first time I read it I misunderstood him. But then it hit me: they have to write downwards to maintain the angle of the broad-nib pen wrt the Holy letter structures, even if that means they can't read <i>their own</i> writing. So of course <i>forget</i> the user!  :-/ <br> <br>The plain truth is that left-handers don't fit into the GN universe. They are uncivilized. <br> <br>The worse truth is that the GN-ers are in fact not interested in much more than their own self-expression. Artists. And this pops up here and there, like in Peter Bilak's recent interview with Majoor, where the latter says that designing fonts does not depend on the language being set. Ergo: design is an individual exercise; the user doesn't really matter. <br> <br>Saying the user matters isn't enough, your fonts have to mean it. Your italic needs to visibly lean. <br> <br>hhp <br></p>"
    html_clean: "<p>I'm not sure where I got \"chapter 7\" - a short circuit, sorry. It's in \"The other hand\", from page 79. <br> <br>\"they should write readable writing downwards.\" <br>Never mind that's not readable at all, of course... <br> <br>It's actually somewhat cryptic (maybe for a reason) - the first time I read it I misunderstood him. But then it hit me: they have to write downwards to maintain the angle of the broad-nib pen wrt the Holy letter structures, even if that means they can't read <i>their own</i> writing. So of course <i>forget</i> the user!  :-/ <br> <br>The plain truth is that left-handers don't fit into the GN universe. They are uncivilized. <br> <br>The worse truth is that the GN-ers are in fact not interested in much more than their own self-expression. Artists. And this pops up here and there, like in Peter Bilak's recent interview with Majoor, where the latter says that designing fonts does not depend on the language being set. Ergo: design is an individual exercise; the user doesn't really matter. <br> <br>Saying the user matters isn't enough, your fonts have to mean it. Your italic needs to visibly lean. <br> <br>hhp <br></p>"
  - id: 66759
