    html: "<p>I don't think we're going anyone a favour discussing whether a 'g' without an ear works while studiously ignoring the fundamental problems of weight, proportion, stress and consistency. It seems obligatory on the Typophile critique to find something nice to say about every typeface, and to limit criticism to details, but the fact is that this is a typeface with a hell of a lot of very basic problems. <br> <br>Graham, you need to go back and look at a lot more type much more closely. Begin with the uppercase letters* and concentrate on proportion and stress (pattern of thick and thin strokes). Letters in your design with extreme problems are A, J, M, N, P, R, U, and V. When you've figured out better proportions and have the stress falling in logical places (see especilly M and N), than start looking at details. Check the consistency of your serifs (B, P and R all have problems). The uppercase R probably has more problems than any other letter. <br> <br>From looking at some features of your design, especially the E and L, I see that Goudy has been a inspiration. Fred Goudy was occasionally a genius, but he has very little to teach anyone else: his work is idiosyncratic, and when it succeeds its a happy surprise. As a beginner, you would learn more from a more systematic designer like W.A. Dwiggins, Matthew Carter or Walter Tracy, in whose work one can see the logic behind the design decisions. Goudy was a kind of freak of nature. <br> <br>I recommend that you pick up a copy of Gerrit Noordzij's <i>Letterletter</i>. Don't treat it as a text book, and don't accept everything that it has to say as gospel, but it will provide you with the mental tools to understand what is happening structurally in a typeface. <br> <br>*I wouldn't nomally recommend to a designer working on a 'text' face to start with the uppercase, but I think it is a good way for a beginner to cut his teeth because the number of issues to deal with is smaller than in the lowercase. I think everyone's first typeface design should be caps only.</p>"
