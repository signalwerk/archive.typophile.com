    html: "<p>&gt; .... is very different from saying that left-handers are illiterate <br>&gt; This seems to me a very long way from saying that left handers are 'uncivilised'.  <br> <br>You're right - those statements make me sound as polemical as GN himself. It's just so much fun. But at least it doesn't take me long to admit it and revert to rationality. <br> <br>Anyway, GN can butter things up as much as he wants, the fact remains that: <br>1) When you can't read <i>your own</i> writing (because you're writing vertically) that's pretty bad... <br>2) GN sees the invention of printing as a fall. This is not my idea - I got it from Kinross. <br>3) GN never addresses <i>reading</i> to any usable depth. <br>4) GN thinks that civilization depends on writing. Like your Eskimo friends are animals. <br> <br>John, don't be such an Ari Fleischer. <br> <br>&gt; I have not read Bilak's interview with Majoor <br> <br>Please do - it's very revealing. <br><a href=\"http://www.typotheque.com/articles/interview_martin_majoor.html\" target=\"_blank\">http://www.typotheque.com/articles/interview_martin_majoor.html</a> <br>And tell us honestly what you think/feel. <br> <br>-- <br> <br>&gt; The weight goes from upper left to lower right. <br> <br>But what about the \"Z\" for example... <br>The exceptions to chirography even in type from chirography worshipers are so fundamental, that it's best to just make a clean break. Already. <br> <br>hhp <br></p>"
