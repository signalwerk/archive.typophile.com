    html: "<p>Hrant, your basic misconception is that in attempting to <i> understand</i> something, I am evangelising it. My interest is in understanding what Noordzij has to say, which so far has turned out to be different enough from what Papazian thinks Noordzij is saying for me to reject your interpretation. But now the conversation has become silly: you quote Noordzij without context and pronounce an outrageous conclusion that cannot possibly be supported from the text that you quote; I point out that what you quote doesn't support your conclusion, and suggest an interpretation that is better supported by Noordzij's words; you ignore me and begin again by changing the focus to the Perpetua d or the weights of Ruse or some other thing <i> that is completely without reference to the original ideas under discussion.</i> I'm sorry but I can't discuss this any more with you, since you repeatedly refuse to stick to what interests me, which is to understand. You say that I 'consistently side-step' most of your points; this is because I believe most of your points are red-herrings and empty provocations thrown up to distract me from the one thread of the conversation that I'm doggedly trying to follow.   <br>   <br>You wrote earlier that you argue because you enjoy it, not because you're right. I engage in conversations because I'm interested in understanding the subject of discussion, and know that other people, even people I disagree with, can contribute to that understanding. It's a pity that, because of your hobby, almost every conversation with you becomes an argument.</p>"
