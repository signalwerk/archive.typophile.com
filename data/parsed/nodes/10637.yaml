    html: "<p><i>and a text face can be hairline thin or ultra black</i> <br> <br>What? <br> <br>He's saying that the <i>nature</i> of the contrast, i.e. whether it is formed by translation or by expansion, is primary, and the measure of the contrast, i.e. whether there is a lot or a little, is secondary. In this, he's encouraging people to look beyond the superficial appearence of type as dark or light, and look at the structure of the letters: to see <i>how</i> they have been made dark or light. There's no comment at all in there about what kind of *weight* is appropriate for a text face. Where do you get these ideas, Hrant? Seriously, for someone who spends so much time talking about reading, you don't seem to be very good at the part of reading that involves comprehension and understanding.</p>"
