    html: "<p><i>1) When you can't read your own writing (because you're writing vertically) that's pretty bad... </i> <br> <br>Get some comprehension skills Hrant. GN doesn't say that lefties can't read their own writing when they right vertically. He says it is *only* by writing vertically that lefties, if using a broad nib, can produce readable writing. Not just readable to them, but readable to anyone, because if they write from left-to-right the stress in their letters falls in an unfamiliar pattern that makes it difficult to read because readers, including lefties, are used to recognising bouma-shapes based on a particular set of stress patterns that developed from the writing of right-handed people. Writing vertically is not the problem: writing vertically is the solution.</p>"
