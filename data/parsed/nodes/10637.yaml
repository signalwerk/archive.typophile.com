    html: "<p>If this is a display face: <br>It has the potential negative stigma of \"ITC Syndrome\", but I think it escapes that thanks to its roughness, which seems to give it a nice character. The cramped descender can be seen as a character trait, but I would raise the ascenders a little bit. <br> <br>If this is a text face: <br>It needs more color (and tighter spacing), especially since the short descenders make it most suitable for very small sizes. But I'd still raise the ascenders. <br> <br>I think the lc \"g\" works - only certain other type designers will complain. The bar of the \"t\" needs to be rounded on the left. UC needs mucho work. <br> <br>Good luck, and happy bouma design!  :-) <br> <br>hhp <br></p>"
