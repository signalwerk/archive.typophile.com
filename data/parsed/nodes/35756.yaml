      <p>I know of two InDesign (CS2&amp;3) scripts that might be handy for what you're trying to do:<br>
      -- Add Guides - draws guides around the selected object or objects<br>
      -- Make Grid - divides the selected frame (or frames) into grid(s) of frames</p>
      <p>You can get the scripts on this page:<br>
      <a href="http://www.adobe.com/products/indesign/scripting/" title="http://www.adobe.com/products/indesign/scripting/">http://www.adobe.com/products/indesign/scripting/</a> (click on the "Scripting Resources" tab)</p>
