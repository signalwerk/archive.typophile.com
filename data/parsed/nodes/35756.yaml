    <p>Hi all.</p>
    <p>Just a quick question...<br>
    Im looking to create a modular grid within Indesign, instead of just standard vertical columns, however, its not possible from my knowledge of working with the program... Is there a plugin of some sort?</p>
    <p>Thanks in advance...<br>
    Rez</p>
