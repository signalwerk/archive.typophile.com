    html: "<p>To clarify: <br> <br>Dan (dannyboy) did not provide an email address in his profile. Conceivably the only way to contact him and initiate a trade would be to use a private message. We just wanted to be very explicit that if others contacted him via the private message feature the forum software would record it. <br> <br>We posted this at the risk of both scaring people away from the private message feature and sounding like the font police. These are the ugly consequences of people wanting to use our space to steal fonts. <br> <br>It's neither our practice nor our penchant to read private messages. But we can if there's the threat of illegal behavior. (If we chose to look the other way we'd be aiding that behavior.) <br> <br>The private message feature is really just a convenience and it should continue to be just that. If you have sensitive, personal or private matters, use email or a telephone. At least then you know only strangers have the potential to listen in and not Jared and Joe. =) </p>"
