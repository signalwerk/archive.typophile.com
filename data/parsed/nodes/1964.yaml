    html: <p>"That people other than the recipient of the private message can read the message? That seems a little ... un-private" <br> <br>Twilight -- <br> <br>If you want privacy, write a note, drive it to your friends house, have them read it, then burn it. Thats really the closest thing you will have to privacy in this world. <br> <br>Consider the fact that you send email, through an ISP I suppose. There has to be somone to administer that mail server, correct? Somone set it up, and keeps it running. That person has access to all your emails, sent or recieved. Not to say that that person has the right, or even the slightest desire to sift through all of your correspondence, but they do have the ability. <br>In short, things don't run themselves, they have to have some sort of human interaction, even if it is as little as 'turning them on'. <br> <br>I don't think Jared was trying to imply he sifts through private messages, but in the circumstance that something 'shaky' surfaces, he is stating he does have this ability. <br> <br>Make sense?</p>
