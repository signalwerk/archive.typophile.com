    date_raw: 10.Nov.2003 8.12am
    votes: null
    html: <p>For what it is worth ... <br> <br>My involvement here at Typophile has convinced me to get rid of all the illegal fonts that I had aquired. <br> <br>I used to grab 'em up on Usenet. I am sure you all know where ... Anyway, once I started to read and respond to people here that actually design and publish faces, I realized I was stealing. Also, I was able to put a human 'face' to who I was stealing from. <br> <br>Well, I don't steal in any other facet of my life - why would I make an excuse to steal from type designers? So, I trashed the hundreds of faces I had on my HD. <br> <br>So, my point being - exposure to this community did have a *very* positive on my thinking and actions with regard to aquiring and possesing type for private use. <br> <br>Posting Dan's request here may not have been the right way to go about exposing him to the good people here. I am certain he could have been directed to a thread or two in the archives ...etc. <br> <br>I am glad for this community and can say it has helped me see things in a better paradigm with regard to type creation and ownership. <br> <br>Nuff Said.</p>
