    html: <p>Would it be helpful, to talk about the issue of font piracy from the "I" perspective, like it is customary in 12-step-programs? <br> <br>So here it goes, Dan - <br> <br>when I  started out as a young designer, I wanted to get my hands on as many fonts as possible and it did not occur to me, that going against the policies of one of those font companies would actually hurt a human being. Later, when I designed my first font, I realized, how much work went into it and my perspective shifted. Today, I try to be accountable for all my actions in my daily life, so I arrived at a place, where giving something back seems simply the natural thing to do. I hope you're not just stunned by the reactions to your post, but get actually something out of it.</p>
