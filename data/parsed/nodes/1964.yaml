    date: 2003-11-10T01:12:00
    date_raw: 10.Nov.2003 1.12am
    votes: null
    html: <p>Okay, good, Kyle, your message helps me to clarify  my thinking and writing about this, as your response makes me realize my message sounded much more naive and off-the-point than it should have.  I certainly realize that private email isn't truly private, ever, but I don't think the ISP server administrator example is exactly on target here.  I can't really picture an administrator at msn/aol/earthlink routinely checking people's email for objectionable content.   And, as I understand it, it takes a court order for people outside the ISP to see that email (in other words, some amount of privacy is generally regarded as expected).  (However, I do know that employers routinely scan the mail of employees, so there are wide variations in expectations of privacy.)   <br> <br>It seems, though, rather more that Jared is saying that private messages connected to controversial threads and/or to controversial posters is monitored and if the content of those private messages is unacceptable to the administrators, then the author of the private message is permanently kicked off the forum.   (Though, that is really closer to your interpretation of what Jared said than anything Jared said.)  I don't know ... the old lefty in me just finds that troubling, if true.  My problem.  But maybe a clarification is warranted.</p>
