    html: "<p>Okay, here's the scenario running through my head. Dannyboy, or not necessarily him but anyone, posts a message not just on Typophile but say the MyFonts forums or AIGA or wherever. Even though we do our best to educate him (and I do believe in educating them, one at a time, too) say, hypothetically, he's not going to be converted. Then some lurker emails him privately: <br> <br>Font Trading: A Play in One Act <br>by Dyana Weissman <br> <br>Lurker: Hey, Stereotypical Font Pirate, I have Magneto. What do you have to trade? <br> <br>Pirate: Well, I actually have the entire Font Bureau library, N-Z. Relay is peachy keen! <br> <br>Lurker: What a coincidence! I have the entire Font Bureau library, A-M. Let's trade! Amplitude sure is dandy! <br> <br>Pirate: Oh that's great! You know I have 30 friends who have been trying to get copies of Amplitude!  <br> <br>Lurker: I have 30 friends who have been trying to get their hands on Hoefler's entire library.  <br> <br>Pirate: Funny you should mention it, I have their entire library. Plus some fabulous gems by Peter Fahrni. <br> <br>Lurker: Great. Gotham Condensed is so nice. I'll trade you all the P22's I have for 'em. <br> <br>-End Scene- <br> <br>I don't think there's ever a single act of piracy. Of course, my shamelessly plugged little scenario is catastrophizing, but this does happen all the time. I *still* have friends, who went to art school with me and know me personally and SHOULD KNOW BETTER! who *STILL* ask me to find them free fonts. Some people just don't care. My question is, when cases like this do arise, on Typophile or elsewhere, what should we do about them? Should we email the moderators with requests to have them removed (after, of course, patiently trying to educate)? Or is it a lost cause?</p>"
