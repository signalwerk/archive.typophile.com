    html: |-
      <p>Do you really find it nasty? I guess it can look a bit strange due to the slight extended/lopsided feel it has. </p>
      <p>I was at the snow over Christmas and I saw this sign quite a bit. I really despise the FHWA Standard Typeface, but used here it looks awesome, and the C is very circular without giving the modernist or Futura-esque feel.</p>
      <p>I believe it is FHWA Standard Series E.</p>
      <p>(Sorry for the iStockphoto, haha)</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/1_6094.jpg"></div><p></p>
