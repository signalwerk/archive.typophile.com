    <p>I'm looking for a typeface with a round/circular C like that of Century Gothic:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/circlec_4194.gif"></div><p></p>
    <p>However, I find the lowercase for Century Gothic quite nasty. What are my alternatives?</p>
    <p>Thanks!</p>
