      <p>Something a bit more modern than some mentioned above could be Adrian Frutiger's <a href="http://www.myfonts.com/fonts/adobe/avenir/" rel="nofollow">Avenir</a>, or Avenir Next (I know they have differences, but I think most of the 'Next' font improvements are too subtle for me, especially at normal sizes, as a general observation of this recent Linotype genre).</p>
      <p>- Mike Yanega</p>
