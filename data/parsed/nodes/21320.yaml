      <p>If it is for UK use I would consider dumping 1-3 (or at least heavy mods) it is too close to <a href="http://www.alliance-leicester.co.uk/home/index.asp?page=home&amp;exp=30&amp;cm_mmc=slat_goog-_-sch-_-ec04031loanshome7187-_-brand">Alliance and Leicester</a> and number 7 has similarities to <a href="http://www.abbey.com/">Abbey</a> which means to me that the name choice should inspire a complete rethink, the table and chairs indicates poker (or at least card games), exactly the opposite of skill games as you defined it. Sorry this is negative but the name change has torpedoed the (in my opinion) stronger concepts.</p>
      <p>&gt;it’s a popular number in the UK since they’ve won their only football worldcup in 1966<br>
      Actually it is England’s (not UK’s) only World Cup, and it seems a pretty tenuous link to me, even being a football fan for most of my life and reminded every four years that it is the only World Cup we have won I wouldn’t draw that connection. Mind you, 1066 is another significant date in British history.</p>
      <p>Tim</p>
