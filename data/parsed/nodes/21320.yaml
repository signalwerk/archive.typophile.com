      <p>@mikeb7</p>
      <p>I think it would be dangerous to emphasize the pool ’too’ much, but I also feel like not emphasizing one game in a way thats immediately recognizeable might leave you with a logo that doesnt emphasize anything. Granted, it would be best to come up with some sort of symbol that would, to everyone, immediately say ’all skill games’, but im not sure something like that exists. Something subtle like having the 66 on a pool ball (maybe without the cue in there) would at least have people looking at it and thinking pool and things like that. Once they saw the site they would know that there was so much more of course, but with the logo you want to have something that will draw people in. I think pool is a pretty universal skill game, so it would work well. I think darts might work well in that respect too.</p>
      <p>Even if in the end you dont end up emphasizing it so much, looking at particular games will give you a good jumping off point.</p>
