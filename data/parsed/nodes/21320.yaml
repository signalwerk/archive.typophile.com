      <p>Hm, I’m wondering: couldn’t you extend the upper horizontal part of the t to form an arm/elbow? That’s because I think a) looks best of all the options (and also because the b and l form the ’gate’ you lie your queue on when playing pool), just that it creates the problem with the t - it seems to be standing out (towards the viewer) too much to still form a nice connected word. If you’d make the upper stroke of the t extend, it could fix that?!</p>
      <p>Also, i think you should definately put in the extra ’end-stroke’ for the queue like in the previous b) - it creates the nice image of someone really holding the queue.</p>
      <p>take this with a grain of salt though, I’d still consider myself a noob ;)</p>
