    html: |-
      <p>zeno333, are you referring to <a href="http://bompiani.rcslibri.corriere.it/libro/6300_i_figli_di_hurin_tolkien.html" rel="nofollow">this</a>? I haven't seen that, but most likely it looks like an average, market edition - althought is features illustrations and could be well designed.</p>
      <p>But for some true Italian pieces of typography, and if you have some money to spend, Giovanni Mardersteig's books are what you have to look for. The <a href="http://www.stamperiavaldonega.it/Stamperia_Valdonega/eng/HomePage.html" rel="nofollow">Stamperia Valdonega</a> hand-pressed editions are among the top-notch XX century books.</p>
      <p>Another publishing house with an eye for good typography is <a href="http://www.ilpolifilo.it/" rel="nofollow">Il Polifilo</a>, who also published a Mardersteig book.</p>
      <p>Other small, limited-edition Italian quality printers using movable types include <a href="http://www.talloneeditore.it/Inglese/introE.html" rel="nofollow">Enrico Tallone</a> and the delightfuly eccentric Pulcino Elefante by Alberto Casiraghi. </p>
      <p>Outside the limited edition books field, Einaudi's <a href="http://www.einaudi.it/catalogo/%28codSercollana%29/MIL/%28searchSessionKey%29/I%20millenni" rel="nofollow">"I Millenni"</a> series of books still continues today a tradition of highly valuable typography.</p>
