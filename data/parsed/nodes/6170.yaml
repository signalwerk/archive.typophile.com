    html: <p>I'm suddenly painfully aware how fuzzy my knowledge in this area has become, despite having done it in the past. <br> <br>As I understand it, you can trademark the name, but not the design itself. Does that sound right? Methinks that the font pirates out there try to beat this loophole by renaming the font to something new when they bundle their "1001 fonts" CDs. <br> <br>It used to be that if you want to copyright a font, you needed to copyright it as <i>software code</i>, and file it accordingly. I've seen a program that takes a font file and converts it into a large text file, which you would print out and send in with your copyright application. However, I think there have been <a href="http://www.typeright.org/suit_01.html">rulings</a> which have changed the nature of what you would file today. <br> <br>If someone could clarify these points, I think we would all benefit.  <br> <br>Typeright.org has some good <a href="http://www.typeright.org/features.html">articles</a> in this realm. <br></p>
