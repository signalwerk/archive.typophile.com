  html: <p>If anyone would like to share, explain, enlighten or warn any information regarding registering a typeface name I would be most grateful.  <br> <br>After working on my design for months now I found a name I like (that is not used - I hope) and would like to proceed in this area sooner than later. <br> <br>Is it really that hard? How long does it take? Is a lawyer really needed? Where does one start after they think they have found a name that is yet unused? <br> <br>smc <br></p>
