    html: |-
      <p>I know this is an older thread and perhaps past the point of usefulness for Sean, but naming a typeface design or family is less science and more voodoo.</p>
      <p>I have personally named as well as supervised the naming of easily over two-hundred typefaces (excluding weights) while I was managing the Type Design group during the Compugraphic through Agfa Corp. days.</p>
      <p>The only reason why you should take great care in naming is that you truly expect to profit from the sale of the fonts. If you truly have designed a uniquely recognizable face and not just a derivitive then you should seek reliable counsel. In this case both a general and FULL legal trademark searches are necessary.</p>
      <p>It's not enough to search just typeface names. Once you get a copyright lawyer a full search might disclose potential conflicts by a trade name owned by someone else. It also depends on the strength of an existing brand name. Example - "Mustang" might be okay, but "Corvette" has no chance.</p>
      <p>Generally, even if you named a typeface it's apt to get changed if a large foundry decided to license and market it.</p>
      <p>As with fine artists, performers, authors and the like, once a person or thing becomes "popular" it then becomes a branding issue for marketing purposes. </p>
      <p>Many custom typefaces for clients were basically mandated by the companies that used them, such as IBM Didot, Keds Rounded.</p>
      <p>Historically, many times designs were named by or as homage to the designer, typecaster or foundry; Bodoni, Plantin, Benguiat, Stone, Antique Olive, &amp;c. (please, no flaming on my use of ampersand).</p>
      <p>Typefaces were often named from their initial use in publishing (Times New Roman, ITC Avant Garde Gothic, Hiroshige). Instances when foundries developed uniquely derivitive cuts, the foundry name was added (Bauer Bodoni, Stempel Garamond, ITC Garamond, Adobe Garamond).</p>
      <p>Other than that, places, things, girl friends, food and pet names comprise the majority of typeface names.</p>
      <p>Basic rule: The greater the revenue potential, the more critical the branding.</p>
      <p>--------------------------------<br>
      Yes, I'm old, but I'm back in style!</p>
