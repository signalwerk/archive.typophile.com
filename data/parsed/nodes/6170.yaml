    html: <p>This is an excellent question, and it's good that you are concerned about it. <br> <br>There are a couple of things you can do on your own. First, conduct as much research independently as possible. Go to all the major foundry and distributor sites, such as Linotype, Agfa Monotype, Adobe, Font Shop, Bitstream, myfonts, Phil's Fonts, etc., and do a search of their databases to see if the name is in use within their published libraries. Also check the more prominent indie foundry sites, such as Emigre, House, Font Bureau, P22, etc. They are all likely to have trademarks on typeface names. Search the Typophile forums as well, to see if any works-in-progress are using the name you're interested in. This won't cover every type design in the world, but it's a good start. <br> <br>Another method to ensure at least some degree of uniqueness in your font's name is to include the initials of your foundry, or some other identifier. Akin to ITC Conduit, Adobe Garamond, P22 Preissig, FF Blur, etc. It's not a perfect solution, but it is helpful. <br> <br>I'm almost certain that you'll need an attorney if you actually want to do a formal trademark search and registration.</p>
