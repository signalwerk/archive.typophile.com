    html: <p>I relay Stephen Rapp's <a class="freelinking external" href="http://www.myfonts.com/fonts/stephen-rapp/memoir" rel="nofollow">Memoir</a>. His <a class="freelinking external" href="http://www.myfonts.com/foundry/Stephen_Rapp" rel="nofollow">Hiatus or Montague</a> looks interesting as well. Correspondence Ink <a class="freelinking external" href="http://www.myfonts.com/search/belluccia" rel="nofollow">Bellucia</a> and Tart Workshop <a class="freelinking external" href="http://www.myfonts.com/search/Nelly+script" rel="nofollow">Nelly Script</a> are very nice too.</p>
