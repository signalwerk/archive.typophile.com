      <p>OMG TOO MUCH COLOR AND DETAIL THAT WILL NEVER WORK IN BLACK AND WHITE AND SMALL SIZES AND...oh...wait...hey, it looks pretty good small and black and white! Nice.</p>
      <p>At first it seems a bit too trendy, but after considering it, it's fresh and I'd say unique...especially given the context of both the entity that will be using it an the architecture.</p>
      <p>When you're given the benefit of having great architecture, that, itself, really becomes the predominant brand element, so I think your approach makes perfect sense...embrace the architecture.</p>
      <p>I like the type and that it's a mask. Perhaps this colored lines are the primary imagery, but the logo seems well suited for some flexibility by being able to swap out different images to mask as the need arises.</p>
      <p>The type is solid too...you might get away with not having to use the lined background in the small sizes.</p>
