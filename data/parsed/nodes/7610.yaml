    html: |-
      <p>Hrant, <br> <br>Please have a look at the attached pdf.  Is this what you had in mind for the pattern? <br> <br>At smaller sizes vector-based programs render the patterns as pure black.  And at larger sizes you will see the pattern they consist of.  (I can't get a nice smooth grey at all.)  When viewing the PDF at 75% you can see the pixel pattern clearly since one unit of the letter will correspond to one pixel.  The "A" is 1000 units tall. <br> <br>To get a nice even grey color I need to take the vector shape (the "A") to Photoshop and render it at a height of 250 pixels with anti-alias on. <br> <br>Maybe there's a different method that solves this better that I don't know off.  To be honest I haven't done any research on this because I wanted to see how I would solve this first. <br> <br>This is an interesting problem indeed.  <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> <br> <br></p>
