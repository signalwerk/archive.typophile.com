    html: "<p>Hrant: Thanks!  I was just going to reply to your previous comment.  I'm doing some cathing up on the forum.  How would that work to have a big gray area?  Would you have the create some halftone pattern, or some other kind of pattern to make a program render it gray? <br> <br>That 3x3 circle font is brilliant!  It could probably be done with other shapes as well, maybe squares or diamonds, or maybe some sort of pattern.  I haven't tried this pattern idea in practice, so I'm not sure it would work in reality. <br> <br>There's only one use I can really think of for an illegible 2-pixel font, thumbnails or small previews of page layouts, where you might want to see what text looks like instead of having grey boxes.  But since the original document wouldn't use this font, it wouldn't really work...</p>"
    html_clean: "<p>Hrant: Thanks!  I was just going to reply to your previous comment.  I'm doing some cathing up on the forum.  How would that work to have a big gray area?  Would you have the create some halftone pattern, or some other kind of pattern to make a program render it gray? <br> <br>That 3x3 circle font is brilliant!  It could probably be done with other shapes as well, maybe squares or diamonds, or maybe some sort of pattern.  I haven't tried this pattern idea in practice, so I'm not sure it would work in reality. <br> <br>There's only one use I can really think of for an illegible 2-pixel font, thumbnails or small previews of page layouts, where you might want to see what text looks like instead of having grey boxes.  But since the original document wouldn't use this font, it wouldn't really work...</p>"
