    html: <p>To get a great-than-one-pixel gray patch, you simply need to make each component "pixel" contain a pattern that renders out that gray. <br> <br>&gt; an illegible 2-pixel font <br> <br>If you go to 3 it'll cross over to sufficient -if strained- legibility. <br>If you <i>want</i> it to be illegible, you can use as many or as few pixels as you want!  :-) <br> <br>hhp</p>
