    html: "<p>lauri, <br> <br>i'm all about experimentation with pixel letter forms. kudos on the willingness to share yours with the rest of us. i think it's pretty cool. <br> <br>as for readability: it's tough. in situations like this, word recognition is the fall back for a reader, but unfortunately (at least in my case), not enough of the individual characters are recognizable to make assumptions on what each word is supposed to be. <br> <br>in your example, my first guess was \"launi johansen\". <br> <br>you might be able to make something of the 200%  mag version though. the 400 and 800 too for that matter. each character looks like a puzzle piece to me, and could turn out to be a pretty cool stylistic or decorative font for titling if you were to put in the time to work out the kinks.</p>"
