    html: "<p>This is great stuff. <br>Using grays to convey a higher resolution of shape is both useful and entirely possible - although it seems to me you'll have to go to 3 pixels. In fact something like that has already been done: there's a font, an outline font, called \"Alien:Gray3\" by Joshua Distler of Shiftype (featured in the book Face2Face*, I believe) which uses a 3x3 grid, where each \"pixel\" is a circle of one of three different sizes. It works. <br> <br>* A tall-format silvery book which came out around 1999 I think. And it was overpriced. <br> <br>hhp</p>"
