  html: <p>This is not a real typeface, per say, but something I drew in Photoshop.  It's an experiment to see if you can create anything legible in a really small scale.  So if people can read my name, I guess it was somewhat successful.  I'm not sure if I could create a whole uppercase alphabet, many of the letters would be indistinguishable.  Let me know if you're able to read what it says.  Thanks! <br> <br><img src="http://www.typophile.com/forums/messages/29/53211.gif" alt="2 Pixel Type Experiment"></p>
