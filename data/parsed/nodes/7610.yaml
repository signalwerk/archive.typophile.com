    html: <p>Lauri, sorry it took so long for me to get back to this. <br> <br>So I guess you're saying that you can't get any pattern to come out as any gray at any size in PDF? My guess is that it's due to the different way vectors and fonts are rendered; this is basically due to different rendering engines for each task. Like I know that when I put Mana in a PDF, and it's viewed at 100%, I do get what I want. So try making a font (a TT one - PS is probably different, and less predictable) and embed <i>that</i> in a PDF. <br> <br>As for the patterns you're using, I'm actually not an expert on that (Chris at Ultrafonts is), although it seems to me what you have should work. Don't know about those thick borders though. <br> <br>hhp</p>
