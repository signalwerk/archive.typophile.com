      <p>Having separate accents is also handy for putting accents over characters arbitrarily, for example, in the name Spinal Tap, which gets an dieresis over the n. (There is no such character in Unicode.)</p>
      <p>Probably the most common use is by type designers. FontLab will automatically create accented characters for you by combining components taken from upper and lowercase characters and the floating accents. Even better, by adding anchors, you can control exactly how the accents are positioned.</p>
      <p>I take it from your earlier posts that you are using Fontographer, though. In this case, you can do a similar thing, albeit more manually. Select each of the upper or lowercase character and copy it using “Copy Reference” and then paste into the appropriate accented character slots. (It’s possible to do them all at once by selecting them all before pasting.) Do the same for the accents. When you are finished, all your accented characters will be composed of references to the source characters (or components, as FontLab calls them) instead of the actual outlines. The advantage of this is that if you later modify the source characters, the accented characters are also modified automatically.</p>
