    html: |-
      <p>The ’stand-alone accents’ you find in typical 8-bit fonts and those derived from them, e.g. Adobe’s OT fonts, are spacing accents, and the only good reason for them to be included in fonts is because they were included in a pile of standard 8-bit character sets and codepages. Whether there was ever a good reason to include them in those character sets seems lost in the proverbial mists of time.</p>
      <p>They are not combining marks, which are accents with zero widths and which are separately encoded in the 0300-range of Unicode. Combining mark characters are much more useful than these odd spacing accents, and there are also many more of them. Unicode does not encode any more spacing accents, so if you want a spacing version of a combining mark you — ta-da! — combine it with a space character.</p>
      <p>You can’t kern either spacing accents or combining marks to sit over or under base glyphs, because such kerning affects subsequent glyphs in the text string. Combining marks must be handled either by mapping to precomposed base+mark glyphs in an OT ccmp feature, or by using GPOS mark positioning. The latter is my preferred method, since it is so much more flexible and extensible.</p>
