      <p>Sure, you could do that, but where would you stop? In the realm of non-standard accented characters, there are no standards (literally). In other words, Spinal Tap are on their own.</p>
      <p>The normal thing to do is leave the standalone accents unkerned—and don’t use negative sidebearings, either. In cases when people will use them in some non-standard way (e.g., Spinal Tap), your font will behave as expected.</p>
