    <p>I'm having a problem naming my new font, both Regular and Italic styles should belong to the same family but it's not working that way and I can't figure what I'm doing wrong, any tips? I've used the same naming structure in another font and it worked just fine but on this one it isn't working, it displays both styles in different families.</p>
    <p>I've attached the images of the settings of each style.</p>
    <p>Thanks!</p>
