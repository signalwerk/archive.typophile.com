    html: |-
      <p>I believe 2014.44.25.png shows the problem. Did you click on "Build Names" at the bottom, right next to the yin-yang symbol? That should have put "italic" in the rest of the fields.</p>
      <p>Also make sure "Additional OpenType names" has been reset...</p>
