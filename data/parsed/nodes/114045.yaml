    <p>I am in the middle of creating a new website for a client, and in the process I am also looking to update their logo, as it is currently looking very outdated. The current logo is in <a class="freelinking external" href="http://www.myfonts.com/fonts/galapagos/maiandra/gd/" rel="nofollow">Maiandra GD</a>, not the best looking font I've ever seen for a children's website, especially with every letter being in a different colour. However, the client seems to be very keen on it, despite my gently hinting that their current logo looks abhorrent (though not in so many words). I would therefore like to update the logo only subtly, using a similar but more modern font. </p>
    <p>The website sells pushchairs and prams, so it would need to be something child-friendly, and preferably have the same chunky feel as Maiandra. As already mentioned, it should have a more modern feel to it, yet not be too different at the same time. </p>
    <p>All suggestions would be sincerely appreciated!<br>
    Thank you</p>
