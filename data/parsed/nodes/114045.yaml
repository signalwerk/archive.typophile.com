    html: <p><a class="freelinking external" href="http://www.fontbureau.com/fonts/Fritz/" rel="nofollow">Fritz</a> by Christian Schwartz is based on Oz Cooper lettering, as is Maiandra. I like it a lot, especially the chunky weights, and think it would be lovely for children's stuff. Also based on the same bit of lettering, apparently, as Fritz is <a class="freelinking external" href="http://www.myfonts.com/fonts/galapagos/robusto/" rel="nofollow">Robusto</a>. My favorite of the three is Fritz.</p>
