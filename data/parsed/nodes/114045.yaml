      <p>&gt; However, the client seems to be very keen on it [current logo]</p>
      <p>I would be cautious about offering revised logos unless the person in charge of the company agrees in advance. I have seen several clients go ballistic when revised logos are presented after they've said they were happy with the current one. They may think that you aren't paying attention to their wishes, and it may offend a client who likes their current logo (bad as it may be).</p>
      <p>On one memorable occasion when I was working at a large design firm, the CEO of a large company looked at our concepts and literally yelled "Don't [F word] with our logo!" </p>
      <p>Now maybe your client will like your new logo ideas, but size up your client first.</p>
