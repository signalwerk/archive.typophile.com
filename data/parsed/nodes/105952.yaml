    html: |-
      <p>Thanks Bob. According to Identifont Rod McDonald designed this in 2000 based on influences from Compacta and Helvetica Condensed. I did check the digital outlines of Smart against those of Mr. Black and found that the bold weight is fairly close to the unknown pre-digital font used to make Mr. Black.<br>
      Still searching. Perhaps it has not been digitized. Have no information as to the source of the dry transfer sheet used for Mr. Black other than it was used in Poland. Photolettering? Filmotype? European company? The mystery persists.<br>
      Don</p>
