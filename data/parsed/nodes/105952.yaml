    <p></p><div class="imageWrap"><img src="http://typophile.com/files/UnknownSansPredigitalDryTransferlEra_4321.jpg"></div><br>
    This from a pre-digital dry transfer sheet used to make a font -- Mr. Black -- brought to my attention by Ryuk<br>
    It looks a lot like Helvetica Inserat but the J is different.<br>
    I checked other pre-digital suspects but found nothing closer.<br>
    Any suggestions? Did I miss a match?<br>
    Thanks.<br>
    Don<p></p>
