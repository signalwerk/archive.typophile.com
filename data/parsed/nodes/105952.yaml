    html: |-
      <p>At first glance, Folio Bold Condensed looks to have a few similarities but when I did an overlay the J and Q are very different, plus the N, M and W are much wider. Oh hum - just an observation. Variants of Akzindens may be worth looking at, as Helvetica, Univers and Folio are all part of the Swiss "International Typographic Style".<br>
      Good hunting!</p>
