      <p>it looks like a combination of 2 fonts:<br>
      Digits &amp; Capitals comes from <strong><a href="http://LHF Samster Script" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://LHF Samster Script</a></strong></p>
      <p>while lower case "ebel" must be <strong><a href="http://Benguiat" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://Benguiat</a></strong> (slanted)</p>
      <p><strong>EDIT: </strong> I think <strong>LHF Samster Script</strong> is offered now as <strong><a href="http://www.letterheadfonts.com/fonts/signkitscript.php" title="Click to visit an external URL." class="freelink freelink-external freelink-external">LHF Signkit Script</a></strong></p>
      <p>-----------------------------------------------<br>
      I found them using Find my Font - <a href="http://www.findmyfont.com">http://www.findmyfont.com</a></p>
