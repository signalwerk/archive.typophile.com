    html: |-
      <p>@riccard0 I totally agree.<br>
      Just thought I'd put it out there considering it was a serious suggestion.</p>
      <p>@nina<br>
      In hindsight, that 'k' is bothering me. Now that I have tightened the leg, wouldn't the next logical step in terms of consistency be to match that gap on the upper and lower case 'p'?</p>
      <p>Additionally (this is the web designer in me talking), I'm worried that when scaled to its smallest size on screen, the effect will be to merge the stem and leg causing the open counter on the 'p' to look out of place if I left it as it is.<br>
      If I match the gap on the 'p' and reduce to this size, the open counter will simply disappear and undermine the entire typeface choice. Dilemma.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/PandB_test_typophile_update_small2_5142.png"></div><br>
      <cite>original rework (without 'k's leg tightened) and scaled</cite><p></p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/PandB_test_typophile_update_small_5387.png"></div><br>
      <cite>the 'k's leg tightened and scaled</cite><p></p>
