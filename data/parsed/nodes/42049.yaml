      <p>Hi Neill,</p>
      <p>My guess is that QT Old Goudy is Zymmetricals 'adaptation' or 'version' of one of Frederic Goudy’s classic typefaces, for instance the aforementioned Goudy Old Style. But of course it could be any other of his dozens of typefaces.<br>
      If you could provide us with an image, we will be able to point you to a legal, high-quality (in the sense of well behaving on a computer and more similar to the original) version.</p>
      <p>. . .<br>
      Bert Vanderveen BNO</p>
