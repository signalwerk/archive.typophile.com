    <p>Hello Typophiles,</p>
    <p>We have been asked to source a font called QT Old Goudy by one of our customers.</p>
    <p>Google search led us to this site.</p>
    <p><a href="http://www.zymmetrical.com/Art/Fonts/Fonts-Collections/fontpackvol2.htm" title="http://www.zymmetrical.com/Art/Fonts/Fonts-Collections/fontpackvol2.htm">http://www.zymmetrical.com/Art/Fonts/Fonts-Collections/fontpackvol2.htm</a></p>
    <p>We purchased and downloaded the "high quality" font set comprising of 8,000 TTF's for $14.95 expecting to find the QT Goudy Old fonts in there, but they weren't.</p>
    <p>I have emailed their sales email address, but have heard nothing back as of yet.</p>
    <p>Has anyone heard of this font?, or dealt with these people before?</p>
    <p>Any help would be appreciated.</p>
    <p>Kind regards<br>
    Neil</p>
