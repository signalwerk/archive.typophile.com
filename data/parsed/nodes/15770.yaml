      <p>I've bought Requiem 1 year ago and used it almost everywere form logos to text, after a while I just got to put it aside and look for alternatives :) It's a excelent typeface, specialy for titles but as people said, it's not the perfect text font, I always wish there was a bolder weight. </p>
      <p>Excelent choice Palatine :)</p>
