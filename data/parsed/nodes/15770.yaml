    html: |-
      <p>It comes in a Display, Text, and Fine version, with Text being the meatiest of the three. Perhaps the magazine is using the fine version. Although it also depends on the paper. </p>
      <p>It's a delicate face, any way you slice it. There is no bold. But I must say that at sizes of 11-13 pt. it's less ornate and easier to read than, say, Renard or Trinite (which are both awesomely beautiful in their own right.)</p>
