    <p>What's everyone's opinion on Requiem? I'm about to get it. It seems like a gorgeous font that actually performs well in long tracts of text. Folks are raving about it. </p>
    <p>In light of Requiem, I'd be interested to see how a lowercase Trajan Pro would look. Imagine that . . .</p>
