      <p>I have it, and it's well worth the money.</p>
      <p>It works well for body text, but it needn't be used too much for that, although the temptation is there. For titling or display purposes, it is similar to Trajan but much less stolid.</p>
      <p>On paper at 600-1200 dpi, it's gorgeous.</p>
