    html: <p><em>Town &amp; Country</em> magazine used (still uses?) Requiem for display purposes. I am not sure if they ever used the text weight. For my eyes the text weight is still something that sparkles too much for long texts. However, that said, I would use it for brochure or catalog use. I guess I'm contradicting myself. For sub-titles and bylines you could use the text. This is, IMHO, another typeface that is so gorgeous and so rich that too much of it will cause indigestion. However, the right amount of it adds texture and flavor.</p>
