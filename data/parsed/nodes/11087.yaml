    html: <p>I have to say "no fecking way" on the monarcy front, Hrant. But then I'm Irish and I've been trained to froth at the mouth whenever I see photos of the queen.  <br> <br>Democracy works to a certain extent (sorry Steve) if the scale is reduced to a minimum. On the level of a village or a small town, it functions a hell of a lot better than on the scale of a very big country. It's not perfect but it beats the hell out of monarchy.  <br> <br>Did we really need those caps, Steve? Why not apply the "Ok, now what?" shite to yourself. If your not in bed yet and you're up to it, give us the benefit of your own wisdom.  <br> <br>M. <br> <br></p>
