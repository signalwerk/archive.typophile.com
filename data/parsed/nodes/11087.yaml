    html: <p>&gt;&gt;it [democracy] is working just fine for about 1% of the world's population! :-/  <br> <br>No it isn't, because it doesn't exist anywhere in the world at the moment <br> <br>&gt;&gt;Monarchy worked for millenia <br>Now there's a system that works for around 1% of the population  <br> <br>&gt;&gt;Education under Capitalism/Democracy is nothing but brainwashing <br>OK, education under capitalism (not democracy, as we know that it doesn't exist) includes a large chunk of brainwashing, but it isn't 'nothing but brainwashing' <br>Education under capitalism necessarily includes a degree of technical education, so that the workers can be more technically proficient, and therefore more profitable. (Even literacy and numeracy count as technical education - don't take these basic things for granted, its more than any monarchs ever provided  - for the population of Britain at least) <br> <br>Quoting JS Mill on state education is hardly bringing in an unbiased observer <br>(By quoting Mill on this, you put yourself in the company of vile thatcherites like Keith Josephs) <br>State education under capitalism exists for the benefit of the interests of capital, but that doesn't mean that it is entirely without benefit for those who experience it. <br> <br>On the whole, capitalism is a crock of shite, to be opposed at every turn, but it has done some good, partly in that the ownership and control of labour power under capitalism is distributed almost equally among individuals (This is not an unmitigated good, nor has it come without cost, particularly the concentration of ownership of the means of production) but probably the single greatest advance that can be attributed to the emergence of capitalism is the effective end of monarchies in all (properly) capitalist countries. <br> <br>Hrant, give it up man - or you'll be coming over here to live in Bournemouth with all the other daily mail reading, tory voting, news believing blue rinse old ladies... <br></p>
