    html: "<p>Nothing exists in a pure state. Not Democracy, not Capitalism, not Monarchy. What people <i>think</i> is the main thing. Americans are willing to kill Iraqis to force them to adopt democracy. Why? Because it goes along with the package: TV, Capitalism, McDonalds, the works. <br> <br>A benign monarch serves much more of the population than any other system. <br> <br>It's good that you dislike Capitalism, but you also have to realize that it subverts everything to its will. Democracy for example is used to give the illusion of power, hence reducing real power. And public education is used to brainwash. And freedom of speech is the best way to reduce <i>desire for action</i>. etc. etc. etc. The whole Western experiment of society is failing, face it. What do you expect when the whole thing is descended from a people who raped women with bulls in front of thousands of paying spectators? The West teaches respect for the Romans - barbarians. <br> <br>BTW, I don't vote. I'm not qualified, and it validates this murderous system. I will have nothing to do with it, except follow the least amount of laws to avoid personal hardship. <br> <br>hhp <br></p>"
