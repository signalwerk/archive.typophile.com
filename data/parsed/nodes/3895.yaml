  html: <p> Hi all, <br> <br>Can anyone tell me of a site where I can look at the Evans and Epps alphabet? <br>It seems to have fallen by the wayside now, but from memory it would have been an ideal font for 7-segment LED displays as used in electronic equipment. <br> <br>Cheers, <br>Bob Siegel </p>
