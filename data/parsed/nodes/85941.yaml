    html: |-
      <p>I see that there is a large number of fonts matching this logo,<br>
      with little or no variations at all:</p>
      <p><strong>Heather</strong> - (c) 1992 by Mike Allard for De Nada Industries<br>
      <strong>Hellenic</strong> - (no copyright in font or file)<br>
      <strong>Dahrlin</strong> - Digital Data from The WSI-FONT Collection (c)1992-1994 Weatherly Systems, Inc.<br>
      <strong>Schulmeister</strong> - (C) 1994 Brendel Informatik GmbH<br>
      <strong>LA Bold</strong> - ©1995-2001 Arts &amp; Letters Corporation<br>
      <strong>Arabella</strong> - (c) Typographer Mediengestaltung, 2000</p>
      <p>I don't know how is this possible... I suppose that only one brand/person should have the actual copyright at each specific time no?.<br>
      So much ripp-off?</p>
      <p>Anyway, based on the kerning I assume that your logo is created with <strong>Heather</strong><br>
      <a href="http://www.dafont.com/heather.font?text=Paravicini+Italian+Bistro" title="http://www.dafont.com/heather.font?text=Paravicini+Italian+Bistro">http://www.dafont.com/heather.font?text=Paravicini+Italian+Bistro</a></p>
