    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/12369" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">“How To” Section</a>&nbsp;: Drawing&nbsp;Characters</strong></p>
    <p><strong>Some&nbsp;Basics</strong></p>
    <p>Q: <em>any suggestions of appropriate exercises, books, websites would be fantastic.</em><br>
    from <a href="http://typophile.com/node/10082">this thread</a>, a list of sites put together by <a href="/node/13085" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Randy Jones</a>:<br><a href="http://briem.ismennt.is">Notes on Type, Handwriting and Lettering</a> by <a href="/node/add/wiki?edit%5Btitle%5D=Gunnlaugur%20SE%20Briem" title="Create node &quot;Gunnlaugur SE Briem&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Gunnlaugur <span class="caps">SE</span> Briem</a><br><a href="http://www.typeworkshop.com">typeworkshop.com</a> by <a href="/node/13509" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Underware</a><br><a href="http://typophile.com/articles/typefacedesign110/index.html">http://typophile.com/articles/typefacedesign110/index.html</a><br><a href="http://just.letterror.com/ltrwiki/SketchingType">Sketching Type</a> from the <a href="/node/28139" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">LettError Wiki</a><br><a href="http://www.typeculture.com/academic_resource/articles_essays/pdfs/tc_article_6.pdf">Some Elements of Proportion and Optical Image Support in a Typeface [<span class="caps">PDF</span>]</a> by <a href="/node/28142" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Mark Jamra</a>.<br><a href="http://www.typeculture.com/academic_resource/articles_essays/pdfs/tc_article_7.pdf">Form and Proportion in a Text Typeface: A Few Guidelines</a> by Mark&nbsp;Jamra.</p>
    <p>Also, for using FontLab <a href="/node/12940" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Leslie Cabarga’s</a> Learn <a href="http://logofontandlettering.com/">FontLab Fast</a> is indispensable, and <a href="http://logofontandlettering.com/">Logo, Font <span class="amp">&amp;</span> Lettering Bible</a> is very&nbsp;helpful. </p>
    <p>Karen Cheng’s <a href="http://Designing Type" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://Designing Type</a> also has useful comparisons of proportions of letters in different type&nbsp;faces.</p>
    <p>Q: <em>is starting entirely by hand/pen a better choice?</em><br>
    A: <a href="http://www.typophile.com/node/4822">http://www.typophile.com/node/4822</a></p>
    <blockquote><p>The more uninteresting a letter, the more useful it is to the typographer<br>
    - Piet&nbsp;Zwart</p></blockquote>
    <p><strong>From the FontLab group at <span class="caps">MSN</span></strong></p>
    <p><a href="http://groups.msn.com/FontLab/tipsandtricks.msnw?action=get_message&amp;mview=0&amp;ID_Message=2675">Using Illustrator to Draw&nbsp;Typefaces</a></p>
    <p><strong>Discussion:</strong><br><a href="http://typophile.com/node/14539">Advice to Designers Sketching Type</a><br><a href="http://typophile.com/node/21090">How Do You Develop Hand Lettering&nbsp;Aesthetics?</a></p>
