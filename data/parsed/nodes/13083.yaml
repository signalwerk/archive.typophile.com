    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/How-To" class="freelinking" rel="nofollow">"How To" Section</a> : Drawing Characters</strong></p>
    <p><strong>Some Basics</strong></p>
    <p>Q: <em>any suggestions of appropriate exercises, books, websites would be fantastic.</em><br>
    from <a href="http://typophile.com/node/10082" rel="nofollow">this thread</a>, a list of sites put together by <a href="/wiki/Randy%20Jones" class="freelinking" rel="nofollow">Randy Jones</a>:<br>
    <a href="http://briem.ismennt.is" rel="nofollow">Notes on Type, Handwriting and Lettering</a> by <a href="/wiki/Gunnlaugur%20SE%20Briem" class="freelinking" rel="nofollow">Gunnlaugur SE Briem</a><br>
    <a href="http://www.typeworkshop.com" rel="nofollow">typeworkshop.com</a> by <a href="/wiki/Underware" class="freelinking" rel="nofollow">Underware</a><br>
    <a href="http://typophile.com/articles/typefacedesign110/index.html" title="http://typophile.com/articles/typefacedesign110/index.html">http://typophile.com/articles/typefacedesign110/index.html</a><br>
    <a href="http://just.letterror.com/ltrwiki/SketchingType" rel="nofollow">Sketching Type</a> from the <a href="/wiki/LettError%20Wiki" class="freelinking" rel="nofollow">LettError Wiki</a><br>
    <a href="http://www.typeculture.com/academic_resource/articles_essays/pdfs/tc_article_6.pdf" rel="nofollow">Some Elements of Proportion and Optical Image Support in a Typeface [PDF]</a> by <a href="/wiki/Mark%20Jamra" class="freelinking" rel="nofollow">Mark Jamra</a>.<br>
    <a href="http://www.typeculture.com/academic_resource/articles_essays/pdfs/tc_article_7.pdf" rel="nofollow">Form and Proportion in a Text Typeface: A Few Guidelines</a> by Mark Jamra.</p>
    <p>Also, for using FontLab <a href="/wiki/Leslie%20Cabarga" class="freelinking" rel="nofollow">Leslie Cabarga's</a> Learn <a href="http://logofontandlettering.com/" rel="nofollow">FontLab Fast</a> is indispensable, and <a href="http://logofontandlettering.com/" rel="nofollow">Logo, Font &amp; Lettering Bible</a> is very helpful. </p>
    <p>Karen Cheng's <a class="freelinking external" href="http://yalepress.yale.edu/yupbooks/book.asp?isbn=9780300111507" rel="nofollow">Designing Type</a> also has useful comparisons of proportions of letters in different type faces.</p>
    <p>Q: <em>is starting entirely by hand/pen a better choice?</em><br>
    A: <a href="http://www.typophile.com/node/4822" title="http://www.typophile.com/node/4822">http://www.typophile.com/node/4822</a></p>
    <blockquote><p>The more uninteresting a letter, the more useful it is to the typographer<br>
    - Piet Zwart</p></blockquote>
    <p><strong>From the FontLab group at MSN</strong></p>
    <p><a href="http://groups.msn.com/FontLab/tipsandtricks.msnw?action=get_message&amp;mview=0&amp;ID_Message=2675" rel="nofollow">Using Illustrator to Draw Typefaces</a></p>
    <p><strong>Discussion:</strong><br>
    <a href="http://typophile.com/node/14539" rel="nofollow">Advice to Designers Sketching Type</a><br>
    <a href="http://typophile.com/node/21090" rel="nofollow">How Do You Develop Hand Lettering Aesthetics?</a></p>
