      <p>I knew I had already seen this. Previously asked <a class="freelinking external" href="http://typophile.com/node/94337" rel="nofollow">here</a> but still unresolved. I've found meanwhile the sample origin, a poster by Mark Owens (<a class="freelinking external" href="http://www.lifeofthemind.net" rel="nofollow">lifeofthemind.net</a>?) for the <a class="freelinking external" href="http://graphicmag.kr/poster_issue/" rel="nofollow">Poster Issue</a> of Korean <a class="freelinking external" href="http://graphicmag.kr" rel="nofollow">Graphic Magazine</a>. I've found also a better sample <a class="freelinking external" href="http://graphicmag.kr/poster_issue/posters/11.jpg" rel="nofollow">here</a>. Looks definitely like a mix of Futura (/L, /D, /U, /E with middle bar lowered and /S) and Avenir (/M with vertex reworked, /C, /G with horizontal bar lowered, /A and /R).<br>
      You might like <a class="freelinking external" href="http://lineto.com/The+Fonts/Font+Categories/Text+Fonts/Brown/" rel="nofollow">Brown</a>.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/11_3714.jpg"></div><p></p>
