    <p>Hi everyone.</p>
    <p>I have two problems.</p>
    <p>Problem #1 : The Monotype Corsiva font appears in Wordpad, Open Office, etc but never in the fonts menu of Illustrator CS2 and Photoshop 7.0. I’m on Vista. I absolutely need to use this font. How can I get access to it from those Adobe applications?</p>
    <p>Problem #2 : I have several Japanese fonts but they never show up in the font menu of Illustrator CS2. Why? They show up in all the other progs, even Photoshop 7.0.</p>
    <p>Thanks for the help!</p>
