    html: <p>Although it looks like Font Bureau's Interstate, I think this is the face that actually used for interstate highway signs, <a href="http://www.myfonts.com/fonts/pixymbols/highway-gothic-2002/pixymbols-hge2002/testdrive.html?s=REAL+SIMPLE&amp;p=72" target="_blank">Highway Gothic</a>. I think they also added some weight to it by applying a stroke or something.</p>
