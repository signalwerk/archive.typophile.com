    html: <p><i>&gt; Presumably, Highway Gothic matches the official specification more closely than Interstate.</i> <br> <br>Interstate is an interpretation of the highway typeface, not an exact copy. It feels very similar, but Tobias Frere-Jones took many liberties with the design in order to make it a useful and attractive typeface.</p>
