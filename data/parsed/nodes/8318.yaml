    votes: null
    html: <p>According to <a href="http://members.aol.com/rcmoeur/alphabet.html">this website</a>, Highway Gothic is only the name of that particular digital version, not the official name of the standard US highway typeface. Presumably, Highway Gothic matches the official specification more closely than Interstate.</p>
