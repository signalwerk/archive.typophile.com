    html: <p><i>&gt; Highway Gothic is based off of Goudy's design isn't it?</i> <br> <br>I hadn't heard that before, but I confess I don't know the history of Highway Gothic. I bet James Montalbano would know. He has spent the last ten years designing a replacement. <a href="http://www.clearviewhwy.com/" target="_blank">More here.</a></p>
