    html: <p>I'm glad you're pushing some boundaries here. I love to see  <br>the condensed weight. My only criticism of Verdana is that  <br>it's often too wide when you want something to be a tad  <br>quieter. <br> <br>And I've never been a fan of the round-top A in bitmap faces. <br> <br>The small caps are a nice touch. <br> <br>Regarding naming. I couldn't help noticing Bitstream's Vera, <br>named perfectly so that it sits right on top of Verdana in  <br>my menu. It seems to say, "Looking for Verdana? Try Vera."</p>
