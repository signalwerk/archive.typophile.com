    html: |-
      <p>Diego,<br>
      I think that many of the embroidery fonts don't necessarily have a corresponding print face, as they were set up specifically for the sewing industry, and what works with yarns.</p>
      <p>What most of the script fonts don't share is the script lower case with the very pared down/almost print glyphs of the upper case in the sample you posted.</p>
      <p>You can try <a class="freelinking external" href="http://www.fontshop.com/fonts/downloads/itc/commercial_script_virtual/?sample_text=Lilly%20Beach%20House" rel="nofollow">Commercial Script</a> or <a class="freelinking external" href="http://www.fontshop.com/search/?q=monotype+script&amp;x=0&amp;y=0&amp;sample_text=Lilly%20Beach%20House" rel="nofollow">Monotype Script</a> for a similar proportion/weight.</p>
      <p>Or if you are having something actually embroidered you may find an existing similar embroidery font - <a class="freelinking external" href="http://www.llbean.com/shop/guidePages/monogram/index.html" rel="nofollow">Script</a> for example comes very close.</p>
      <p>Good luck!</p>
