      <p><a href="/wiki/OpenType" class="wiki">OpenType</a> is basically the latest and greatest font format.</p>
      <p><a href="/wiki/TrueType" class="wiki">TrueType</a> was touted as such <em>before</em> OpenType, and fonts in TTF format are still well-suited for the vast majority of (American) users.</p>
      <p>I imagine the program making the conversions just created a bad OTF...</p>
