      <p>One possibility:<br>
      <a href="http://www.freetype.org/ttfautohint/doc/ttfautohint.html" title="http://www.freetype.org/ttfautohint/doc/ttfautohint.html">http://www.freetype.org/ttfautohint/doc/ttfautohint.html</a><br>
      "--dehint, -d<br>
          Strip off all hints without generating new hints. Consequently, all other hinting options are ignored. This option is intended for testing purposes. "<br>
      (pro - you can use .bat files)<br>
      Normally I would use FontForge.</p>
