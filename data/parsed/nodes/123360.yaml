    <p>Hello everyone, thanks for reading!</p>
    <p>I have been working on a new batch of fonts &amp; while I though that I was well aware of all the basic ins &amp; outs of hinting I have been encountering some information that casts doubt on this.</p>
    <p>In short…</p>
    <p>1.) What is the simplest &amp; and/or most reliable way to inspect a ttf ot otf file &amp; determine if it contains any hinting data?</p>
    <p>2.) What methods might I use to remove any and all hinting data from an otf or ttf font file?</p>
    <p>At my disposal I have fontlab5, fontforge, fontographer &amp; the latest adobe fdk.</p>
    <p>Thank you all in advance.</p>
