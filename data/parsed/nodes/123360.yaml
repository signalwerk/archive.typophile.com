      <p>Thanks for the ideas everyone.</p>
      <p>Just as an added fact: It's 100% certain that both the old &amp; new otf files came from fontlab but the old ones may have come from 4.6 &amp; new ones from 5.1 in these particular cases. Any known differences between those 2 versions that might be related?</p>
      <p>@ Thomas Phinney<br>
      There is one where the glyphs are significantly bigger in the new version but each font has the same number of glyphs in both old &amp; new. There would be automatic, proportional scaling to the metrics done by fontlab… in any case I'll have a look at data. Good idea. Thank you.  To answer you question: I don't have any real reason to think there is hinting data hiding somewhere. In fact it seems pretty clear there is not. It's a shot in the dark.</p>
      <p>@Frode<br>
      I will definitely have a look at that as well. Thanks for the tip</p>
