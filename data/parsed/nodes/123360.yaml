      <p>Open the font in Type light (freeware):<br>
      <a href="http://cr8software.net/typelight.html" title="http://cr8software.net/typelight.html">http://cr8software.net/typelight.html</a> (Windows)<br>
      <a href="http://cr8software.net/typex.html" title="http://cr8software.net/typex.html">http://cr8software.net/typex.html</a> (Mac /Linux)</p>
      <p>Go to <strong>font options</strong> on the <strong>font menu</strong>. If the hinting box is ticked then it contains some form of hinting.<br>
      To remove all hinting: untick the box and save the font.</p>
