      <p>Thanks for that bojev.</p>
      <p>I am aware of that one. &amp; fontlab seems to indicate that there are no hints to remove. Autohinting is turned off etc. The main clue that I have that hinting data may still be present is the file size of the final otf.</p>
      <p>Can anyone suggest one, sure, absolute way to tell? …or one sure, absolute way to remove all hinting data? say using the adobe fdk for example to delete such data directly from the otf.</p>
      <p>If fontlabs "Remove hints" feature is thought to be 100% reliable then maybe I am just wrong. I've been reading the manual &amp; reading info online. All signs point to absence of hinting data but I have some fonts here that have 20k - 60k of unexplained data so I'm still exploring. There are older copies of these same fonts that have smaller file sizes &amp; I'm having trouble telling exactly why. Hinting data is just my best guess &amp; may be a wild goose chase.</p>
      <p>Thanks.</p>
