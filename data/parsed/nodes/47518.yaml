    <p>Esta noche hemos estado con Cristina modificando algunas letras que encontré en un viejo archivo FH9. La madre de un amigo tiene una pastelería en Isla de Pascua (leyó bien Isla de Pascua). Entonces estas letritas era de MOAI, un intento de alcanzar el estilo TIKI de houseindutries. Claro que falta mucha pega. por ahora modificamos solamente las letras que necesitábamos para componer el logotipo.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/ma-ahu-logo-1_4815.jpg"></div><div class="imageWrap"><img src="http://typophile.com/files/moai_4642.jpg"></div><p></p>
