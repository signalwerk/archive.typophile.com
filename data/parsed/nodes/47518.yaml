      <p>Pienso que avanzarías mejor si trabajaras con palabras. Resultaría más práctico porqué percibirías de cerca el desempeño de formas/contraformas de cada glifo actuando con otros glifos.</p>
      <p>De todos modos aquí va lo que veo:</p>
      <p>El bastón izquierdo de "A" está muy delgado. Yo lo haría más cercano al bastón izquierdo de "K"<br>
      La barra de "A" y "H" se ven débiles. Quizás más gruesa y un poquito salidas por la derecha en ambas quedarían mejor.  </p>
      <p>"o" la veo angosta, quizás obtengas mejor color si se ve igual de ancha a "b" , "p" , "d" y "q"<br>
      El bastón inferior de la barriga de "a" yo lo probaría en "d" y en "q" (sin ser exacto, claro)<br>
      el bastón izquierdo de "h" no lo haría tan curvo ni tan similar al bastón izquierdo de "u"<br>
      el bastón derecho de "m" tampoco lo haría tan curvo y literal con "u". </p>
      <p>En mi opinión el espíritu que expele tu fuente creo que tiene que ver (Depronto ni lo hiciste pensando en ello pero no importa :) con la interpretación tipográfica del imaginario occidental de lo asiático. Trazos irregulares de pincel. Más rectos que curvos sin dejar de ser irregulares.</p>
      <p>En cuanto a la interpretación (Quizás te de ideas): te recomiendo un pequeño e interesante libro llamado: Barthes Y El Imperio De Los Signos - Peter Pericles Trifonas (Ed. Gedisa). A continuación dos parrafos al azar:</p>
      <p>(*) Cuando Roland Barthes se interesó por la escritura nipona, hizo una "interpretación ficticia del Japón" fijándose puramente en la superficie de sus signos. Esto marcó un giro crucial en su trabajo, lo alejó de la obsesión occidental por los significados y le permitió plantear la cuestión de la arbitrariedad social e histórica de los signos. Este acercamiento de la semiología lingüística a la cultura, entendida como "imperio de signos", puso en marcha también una investigación crítica más amplia en los terrenos de los medios de comunicación y de la cultura popular. (*)</p>
      <p>(*) El conocimiento que tiene Barthes de Japón se limita a lo que ha leído sobre su historia y las imágenes que ha visto, tanto por su experiencia directa como en los medios de comunicación. Esta exposición a un archivo occidental de textos e imágenes llamado "Japón" establece el mito de Japón como parte de una cultura oriental que es contraria a una cultura occidental (*)</p>
      <p>Saludos desde Bogotá, Colombia,</p>
      <p>--<br>
      Carlos Fabián Camargo G.</p>
