    html: "<p>I posted it, but I can't stand it (the views of the article, not the discussion below it). My own thoughts are there, and they cover my views on porn, design, etc. It seemed to me that the interesting design-related issues were being set aside so everyone could start moralizing (or de-moralizing) on the subject matter and everyone else's views (I was guilty of a bit of this as well). <br> <br>I know that some people (such as hrant) were part of this discussion elsewhere already. Not that it shouldn't/can't happen here, but there are (as Joe points out) some nicely articulated perspectives there. <br> <br>An excerpt from my post which I think is relevant here: \"The point is that Design is complicit in the expression of sex and sexuality in our world, particularly in the mainstream and in popular culture. So how do we address our own roles? I doubt that most of us will ever lay out a porn spread, but how many of us have worked on or will work on a women's magazine, or a perfume ad, or a movie poster, or a beer commercial... ? How do we address sexuality in our work, which is often the vehicle for expressing/communicating these ideas? Is it appropriate to voice your dissent in the face of a client or employer about sexuality as a marketing device, or should we back off and do the job? Is sexuality a legitimate marketing tool because it is part of everyone on Earth? Or is it something we should avoid because we are sexualizing material objects and manipulating our fellow humans' most basic motivators for profit?\" <br> <br>I don't think anyone here would work on child porn. It's the grey areas that are the most interesting to/challenging for me.</p>"
