    html: "<p>Thomas Phinnery: <i>John, do you honestly know anybody who found wine, beer or scotch to taste good the first time they tried it? It seems to me that these are acquired tastes, and the primary reason they are acquired is because of the effects of the alcohol in them.</i> <br> <br>But lots of the things we eat and drink are acquired tastes, especially to immature or inexperience palates. There are lots of things that people eat that are not immediately delicious to most people, but many of them are ingredients in the world's great cuisines, without the need for any psycho-chemical effect to encourage people to consume them. People try them and develop a taste for them because they've learned -- if they're fortunate to have been raised on something other than junk food -- that a varied and sophisticated diet is a good thing and that many 'difficult' tastes are worth acquiring. I write this with a glass of Ardbeg beside me: the most complex and atypical scotch I've ever drunk. It has taken me the better part of a year to make my way toward the end of the bottle, and I'm just beginning to really appreciate it. Obviously, at that rate, I'm not getting even a little bit drunk. But I'm having a great time! Cheers.</p>"
