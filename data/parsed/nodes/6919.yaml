    html: "<p>&gt;If the pleasure is mutual, and not selfish and objectifying, it is not lust. <br> <br>You are defining lust in a way that is 'politically correct' now, but I challenge you to find in any traditional Christian source, including St. Thomas, your view that if pleasure is mutual it is not lust. Here is the Catholic Encyclopedia definition of Lust: <br> <br>\"The inordinate craving for, or indulgence of, the carnal pleasure which is experienced in the human organs of generation.\" <br> <br>It is the strength of desire that is objected to, not whether it is mutual. The plain reading of my earlier quoted passage of St. Thomas is that he objects to having sex with one's wife for the sake of satisfying powerful sexual desire, rather than procreation or other noble purpose not related to your own pleasure. Pursuit of carnal pleasure is in no way seen as legitimate in itself.    <br> <br>&gt;forms of contraception are permitted in family planning <br> <br>The traditional approach was to permit birth control fairly liberally on behalf of the woman's heath and the welfare of her children, while prohibiting it on the part of the man. This was part because of the biblical passage about Onan, but also because of, as you note, the mitzvah to be fruitful and multiply - and I suspect the belief that men had a limited supply of sperm. I think this belief, which is false for men and instead true for women's eggs, was based on Galen's mistaken theories of procreation. <br> <br>Only the Orthodox (10-15% of Jews) are guided by the traditional analysis, and I don't honestly know what the current application of the tradition is, especially as the Orthodox sometimes differ radically among themselves. The Orthodox are definitely more influenced by the 'pru urvu' (be fruitful and multiply) commandment, and many have large families.</p>"
