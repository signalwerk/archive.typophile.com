    html: <p>Great topic. I like to think that if the activity is legal, I should not turn one client away in favor of another. Business is not an extension of a moral campaign for me. I would hate to live in a world where I couldn't purchase food or basic services because I was at odds with the majority. <br> <br>For example, I noticed this morning that Cat Stevens is on the no fly list and is being refused admission to the US. <br> <br>I've often been approached by religious organizations for work and have not refused them although I believe their basic actions are perverted, fascist, and not good for humanity in general. <br> <br>I was recently approached by a woman that wanted an ad in a major magazine. She was selling pornographic photos of herself. She seemed bright and legitimate. I realized I was much more comfortable working with her than with local religious organizations that have approached me. <br> <br>None of these delima scenarios has turned into real work for me, but I've certainly had to think about my reactions and what it means to be in business.</p>
