    html: <p>I'm not sure what you want from me here, Type. <br>A solution? <br>If I had one, it would be in place. <br>But if this is an issue that you care about, then I'll have the grace not to insult you for caring. <br> <br>Personally I don't put animal welfare right at the top of my list, but as a vegetarian for twenty-something years, its not something I'm unaware of either. With the whale situation there's also the problem of 'over-fishing' (or is it over-mamalling) which upsets the delicate balance of the oceanic eco-system, and could have dramatically undesirable effects. <br> <br>Well, 'what do we do about it?', you ask. <br> <br>Well, you could campaign against it. You stated that many Americans don't know about it (I don't think many people in England do either, but I couldn't speak for the other countries you name). <br>Perhaps if more people knew about it they would join you in the campaign. <br>If you get enough people to be outraged at the situation,then you might only need that number of people to boycott the companies involved in order to have an impact. <br>(Of course, it might be difficult to convince people that eat cows and pigs and lambs that eating horses is worth objecting to. I don't know, you would have to ask them). <br> <br>If people boycott a company, its probably ten times more effective if they write to the company and tell them why they are doing so. It doesn't have to be the 'producer' or slaughterhouse or whatever, it could be any company involved in the trade. <br> <br>You might not have any impact with this approach, although it would be difficult to run a campaign like that and not, at least, make a few people think about things a bit more. <br>You might have some impact. There are many instances of improvements over the years due to consumer pressure.</p>
