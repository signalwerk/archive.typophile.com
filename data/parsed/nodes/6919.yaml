    html: "<p><i>The plain reading of my earlier quoted passage of St. Thomas is that he objects to having sex with one's wife for the sake of satisfying powerful sexual desire, rather than procreation or other noble purpose not related to your own pleasure. Pursuit of carnal pleasure is in no way seen as legitimate in itself.</i> <br> <br>That is the point I have made several times: reducing sex to carnal pleasure is illegitimate. I'm not sure what you think I'm disagreeing with in this traditional teaching. I don't think the fact that you really, really want to get it on is actually a good enough reason for sex. My own view of sex is that one should always be seeking to maximise it; that is, to put as much in and get as much out of the experience as possible. Quite simply, I've found this leads to better sex. This means emotional and spiritual investment, vulnerability, openness and generosity, not just satisfying powerful sexual desire. <br> <br>I have to go pack for Prague now, and I fly tomorrow, so I won't be on Typophile for a few days. Perhaps longer.</p>"
