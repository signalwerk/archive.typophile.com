    <div class="info">Submitted by <a href="/user/7006" title="View user profile.">paul d hunt</a> : 1.Apr.2008 8.25am </div>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/lemondecourrier_4736.gif"></div><br>
    <strong><a class="freelinking external" href="http://www.typofonderie.com/gazette/hot_news/?id=290 " rel="nofollow"> Special offer</a></strong><p></p>
    <p>To celebrate the launch of the Le Monde Courrier PTF, clients benefit a special price of only € 168 (standard price at € 210). Available through 31 May 2008.</p>
    <p>In our age, since the arrival of microcomputing, the majority of professional letters have been composed in quality typefaces. Typewriters &amp; the typestyles they used have become antiques. A letter composed in Times or Helvetica &amp; printed with a laser printer at 300 or 600 dpi are of such quality that one can no longer distinguish it with a document produced by offset printing. But letters composed in this way appear overly institutional. Le Monde Courrier PTF, designed by Jean François Porchez, attempts to re-establish a style halfway between writing and printing. It returns the informal character of 'typewritten' fonts to letters and suit well all bad conditions printings, such faxes and low printer resolutions. Even though it connotes this aspect of communication, it does not have any less of a typographic character, integrating itself with the rest of the family with effective contrast. Le Monde Courrier PTF is available in three weights, each in roman, italic.</p>
    <p>Presented to the public in 1997, <a class="freelinking external" href="http://www.typofonderie.com/alphabets/view/LeMondeCourrierPTF " rel="nofollow"> the 2008 version</a> is the next step in the history of the <a class="freelinking external" href="http://www.typofonderie.com/alphabets/view/LeMondeCourrier " rel="nofollow"> Le Monde Courrier</a>. The glyph set has surpassed the usual 250 to a size of more than 700, which allows for the composition of numerous Latin-script European languages. Along with small caps available in the three weights, 4 sets of figures are provided (lining and oldstyle) in tabular and proportional widths, depending on the version. Minuscule lowercase, figures for automated fractions, are also included, and in addition a set of dingbats for everyday use in newspaper and magazine layout. The full family is composed of more than 4600 glyphs and feature around 300 000 pairs.</p>
    <p><strong><a class="freelinking external" href="http://www.typofonderie.com/icono/alphabets/pdf/LeMondeCourrierPTF_pdf.pdf " rel="nofollow"> Le Monde Courrier PTF extended pdf specimen</a></strong></p>
    <p><strong>Separate packs</strong></p>
    <p><a class="freelinking external" href="http://www.typofonderie.com/alphabets/view/LeMondeCourrierPTF " rel="nofollow"> Le Monde Courrier PTF</a> 3 fonts: Regular, Italic, Bold, from €210 for a licence covering 8 workstations.<br>
    <a class="freelinking external" href="http://www.typofonderie.com/alphabets/view/LeMondeCourrierPTFb " rel="nofollow"> Le Monde Courrier PTF b</a> 3 fonts: Demi, Demi Italic, Bold Italic, from €210 for a license covering 8 workstations.</p>
    <p><strong>Full family to save 25%</strong></p>
    <p><a class="freelinking external" href="http://www.typofonderie.com/alphabets/view/LeMondeCourrierPTFx2 " rel="nofollow"> Le Monde Courrier PTF x2</a> 6 fonts: Regular, Italic, Demi, Demi Italic, Bold, Bold Italic, from €315 for a licence covering 8 worstations. On this later case, you save 25% from the purchase of the two first packs.</p>
