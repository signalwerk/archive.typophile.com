      <p>Chris, what you describe is the interaction of spacing and construction, i.e. the construction gives to the inter-letter space the shape and effect you describe, which I agree is important to the virtues of Legato as a text face. But I still maintain that in terms of diminishing impact on readability of text, the construction comes after the spacing, which is almost always the most significant aspect of readability regardless of what typeface we're talking about. Put it this way: if you were to reduce the spacing of Legato, I think it would become less readable than a less well constructed sans serif with tighter spacing. You can try it: space Legato like Helvetica and then space Helvetica like Legato (I mean in terms of inter-letter spacing relative to letter proportion, not absolute distances), then set continuous text in both at say 11pt. I predict that badly spaced Legato will be less readable than well spaced Helvetica. What this indicates to me is that the construction of Legato is an advantage relative to its spacing model, not independent of it.<br>
      _____</p>
      <p>J., which sans serifs are you looking at? If they are recent designs, then I think you may see looser fitting than has been traditional in sans types. I think type on the web, especially Verdana, and on mobile devices is having an influence. More people are reading continuous text in sans serif type than was the case in print, and designers have figured out that you need to space it more loosely.</p>
      <p>This discussion about Legato relates back to an earlier discussion about readability testing and the long held assumption than sans serif type was inherently less suited to continuous text and immersive reading than serif type. But if you look at testing of sans serif types, it is almost all done with Arial or similar grotesques with tight spacing relative to letter proportions. My point is that one can go a long way to improving the readability of sans serif types by spacing them appropriately for continuous text.</p>
