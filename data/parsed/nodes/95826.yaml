      <p>Good analysis. I love empiricism, and I've long felt that Kevin is the best person to leverage it towards better understanding type, but it all suffers from a chronic hamartia: despite having the best intentions the methods are so flawed at the core that the results can only be destructive. This has become a bugbear for me, and I fear that if I support such empirical testing I'll be contributing to <em>retarding</em> the understanding of type.</p>
      <p>If somebody can convince me that Kevin can test this the right way, here's what I would propose: I'll take the textiest weight of Legato (which probably isn't the one I have) and make a conventionally constructed font that shares its proportions, color, spacing, etc. Then we could see if its construction is indeed as genial as some of us feel/hope (and of course we could test the spacing too). But if I were to make such a font and it were used in some flawed testing that spits out "No Difference" then I would regret it deeply. And regret is one thing I don't handle well.</p>
      <p>hhp</p>
