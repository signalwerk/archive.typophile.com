    <p>I'd like to explore John Hudson's hypothesis* that Legato's very high readability** is due in large part (mostly?) to the way it's spaced. The most direct way I can think of doing that is to compare its readability to that of other sans fonts that are spaced comparably. Suggestions?</p>
    <p>* <a href="http://typophile.com/node/95744#comment-519849" title="http://typophile.com/node/95744#comment-519849">http://typophile.com/node/95744#comment-519849</a></p>
    <p>** For a sans. For the sake of focus let's not argue about that angle here.</p>
    <p>hhp</p>
