      <p>I'm glad that you are exploring this, John. I've long felt and said that there is an ideal for weight and proportion and spacing for readability of text, though this is a range rather than a set of fixed numbers.  <a class="freelinking external" href="http://www.youtube.com/watch?v=z2hhkfUzZtw" rel="nofollow">My presentation on readability for the Cooper-Hewitt  National Design Museum says most of what I have to say</a>, so I won't repeat it here. (My rushed 'pecha kucha' style presentation of 6 minutes and 40 seconds starts around minute 16). I would add a couple of things, though. One is, I suspect that the ideal weight proportion and spacing does not vary linearly with visual size (visual angle spanned by the letters.) </p>
      <p>The other is that things are somewhat different for sans. I have a feeling that the ideals for serifs are too wide spacing for sans, so that sans words tend to 'fall apart' at the same spacing. But pulling the sans tighter in letter spacing also isn't ideal. That's a basic benefit of serifs--you can space wider and keep the word image together. That being said, it may be that you can compensate for sans with somewhat greater boldness, which is what I suspect is going on with Legato.</p>
