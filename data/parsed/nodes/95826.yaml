      <p>John, is spacing more important than "construction"? It depends on degrees, but it doesn't really matter: they're both important. Does something need to "click" between a font's construction and its spacing? That's a more interesting question. I would say that it needs to click only if the construction is a certain way; in conventional fonts not so much, but in Legato... sort of, because the whites are talking to each other so much. However I say "sort of" because I don't see a <em>critical</em> dependence in terms of quantity; what I mean is that even though Legato's construction relies on the spacing more than in fonts with conventional construction, it would still work decently if the spacing is changed a bit. In contrast I can imagine a construction where the spacing is <em>truly</em> integral, such that changing the spacing would really ruin the magic (and what magic it would be!) completely.</p>
      <p>So my purpose with this thread is to try to figure out if Legato's spacing is indeed "special" the way its construction is. I have to doubt it, but I'm open to comparing it to other sans designs that might reveal more truth.</p>
      <p>hhp</p>
