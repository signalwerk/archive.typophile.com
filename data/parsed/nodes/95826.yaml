      <p>John, I agree but my point is that you cannot  separate the spacing from the interaction of construction.  By doing so, you not only ruin the spacing but you also destroy the construction interaction.<br>
      I agree that Helvetica's performance as a text face could be improved by opening it up at text sizes. This does not mean that Legato would improve as a text face by adding the same ratio of space to it as you added to Helvetica.  I think it is an issue of balance.  Helvetica has better balance at large sizes.  It may be possible to slightly improve Legato at large display sizes  by tightening it, though.  Overall, I would say that Legato has a better range of balance at default spacing than Helvetica does.  This is do to the drawing superiority of Legato.</p>
