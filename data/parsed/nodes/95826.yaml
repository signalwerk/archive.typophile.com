      <p>Some comments:</p>
      <p>'Very high readability' in the context in which I made the comment refers to relative readability (we were discussing alternatives to a document style involving Gill Sans Light). What I would expect to find is that if one were to take any reasonably well proportioned sans serif type and respace it in a manner similar to Legato, one would see a rise in readability at text sizes. I don't think this would necessarily eliminate the readability gap between such a type and Legato, but I think it would close it considerably. The relative readability of Legato seems to me very largely made up of the fact that it is spaced for text size, whereas most sans serifs are spaced for display use. My thinking here is simply that the biggest gain in readability is likely due to the biggest typographic differential, which seems to me the spacing. This is not to say that, if spacing were made comparable, there might not be a significant readability advantage to Legato due to its letter construction. There are four aspects of type that affect readability: proportion, spacing, construction and detail, and I reckon the importance to readability is roughly in that, diminishing, order (excepting very extreme forms of construction or detail). The failure of most sans serifs in the text readability category seems to me mainly due to poor relationship of proportion and spacing; simply put, the inter-letter spacing is too tight and out of synch with the horizontal proportions -- and, hence, internal space -- of the letters. Until that relationship is fixed, one has no comparative baseline for judging the readability benefits of particular constructions or details.</p>
