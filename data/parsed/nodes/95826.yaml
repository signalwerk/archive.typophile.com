      <p>I don't know that your question, Hrant, can be definitively answered without some empirical testing. Experiential judgments about readability by seasoned practitioners can only take you so far. </p>
      <p>In the realm of testing there are several options. 1) Fourier Transforms. 2) Blink Rate. 3) Drift-factor Testing. 4) Fixation duration, saccades, number of regressions.</p>
      <p>Fourier Transforms won’t give the answer, but may tell us if Legato has a distinctive profile in the frequency domain. I don't have the font, but could get Chris to do a setting. I have access to Adobe Photoshop Fourier Transform plugins and comparative data.</p>
      <p>Blink Rate was used by Luckiesh and Moss. Kevin’s associate Sheedy has used blink rate in some of his tests, but not with an eye to assessing readability. The relative boldness of Legato would have to be dissociated from the spacing and construction, so as not to provide a confound. This is because Luckiesh and Moss found relative boldness to be a significant factor in modifying blink rate results.</p>
      <p>Drift-Factor testing comes from the realm of lexical-decision testing. Lexical Decision is judging whether the stimulus is a word, yes or no. Identification is not required. Speed (reaction time) and accuracy are the dependent measures. A “Diffusion Model” of how lexical decision works suggests a method of data analysis the distinguishes between several factors. One of these, <em>ter</em>, measures encoding affordance. Another, <em>drift</em>, measures ease or efficiency in the evidence accumulation stage leading to a decision. If legibility has to do with reaching a criterion level of affordance, and readability has to do with with the efficiency of the cortical integrational routines, my sense is that <em>ter</em> tells us about legibility, and <em>drift rate</em> about readability.</p>
      <p>It would be of great interest to see if Blink Rate, ter and Drift interact with fixation durations, saccade length, number of regressions, and the rhythmic structure of these eye-movement patterns.</p>
