    html: "<p>Also, I do have the original printed source of the sample pictures, which by the way is from 1994, so, if there's just any additional answer I can give to any question regarding any detail of the font that may be helpful in any way... <br> <br>And to the font, yes, I had also thought of Franklin Gothic, initially, as the letters do appear to match... (Franklin Gothic Demi? I don't think it must be Franklin Gothic Condensed, as the detail of the dots on the \"�\", \"�\", \"�\" and \"�\", these are circular, (unlike those on the \"i\" and the \"j\" which are square), and not square, as in Franklin Gothic Condensed... Also, looking particularly at the \"g\", it must either not be Franklin Gothic Demi Condensed, as the upper hole in the \"g\" is circular, and not oval, as in Franklin Gothic Demi Condensed...) Only the numbers indeed put me in doubt... I mean, unless, contrary to my first thought, the numbers and the letters aren't of the same font? <br> <br>Yet, that third line, where it reads \"4 tysta mil\", that \"4\" there does bring up doubt again... <br> <br>As does this other line: <br> <br><img src=\"http://www.typophile.com/forums/messages/83/27810.gif\" alt=\"\"> <br> <br>Well, it is at least odd that a font has been chosen for the letters, and an other for the numbers, if that is to be the case, no? <br> <br>Once again, I thank you, for all help. <br> <br>P.S. Sorry that I started a new post for including each of the images but I don't know whether it is possible/allowed to include (upload) more than one image per post? :P <br></p>"
