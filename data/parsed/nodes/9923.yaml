    html: <p>Well, I don't know if I can call myself type designer, but I use from time to time some module of DTL FontMaster. <br> <br>I like to digitize some letter with Ikarus, cause I like in-line points, I think ContourMaster is great (FontLab's FontAudit sucks), and the tests I did with KernMaster were good (in roman fonts). <br> <br>In my URL there is only old stuff not related with FMaster at all.</p>
