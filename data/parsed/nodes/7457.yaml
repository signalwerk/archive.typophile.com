    html: <p>If you know InDesign then Quark won't be hard. I learned on Quark and then switched to InDesign. As long as you know some basics, you'll be fine. <br> <br>I am a fan of the Visual Quickstart Guides. They're normally very concise and to the point, and I have a short attention span, so that helps. It doesn't go as in-depth as say the Bibles, but it's much easier to find answers to specific questions with one of these. <br> <br>I hope it helps. <br> <br><a href="http://www.amazon.com/exec/obidos/ASIN/0321205480/qid=1099373554/sr=2-1/ref=pd_ka_b_2_1/103-2506487-6003817"><i>QuarkXPress 6 Visual QuickStart Guide</i></a></p>
    html_clean: <p>If you know InDesign then Quark won't be hard. I learned on Quark and then switched to InDesign. As long as you know some basics, you'll be fine. <br> <br>I am a fan of the Visual Quickstart Guides. They're normally very concise and to the point, and I have a short attention span, so that helps. It doesn't go as in-depth as say the Bibles, but it's much easier to find answers to specific questions with one of these. <br> <br>I hope it helps. <br> <br><a href="http://www.amazon.com/exec/obidos/ASIN/0321205480/qid=1099373554/sr=2-1/ref=pd_ka_b_2_1/103-2506487-6003817" class="link-external"><i>QuarkXPress 6 Visual QuickStart Guide</i></a></p>
