  html: <p>I figgered this would be place to ask about books on Quark. Anyone know of something well-written and easy to understand to help me get a better grasp on this beast? I know the basics of this one, but am much more comfortable using InD, but I need to brush up on Quark cuz I might hafta start using it for work. Any help is appreciated, thnx!</p>
