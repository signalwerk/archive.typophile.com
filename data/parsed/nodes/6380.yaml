    html: <p>What if you ... and this is more or less a crazy idea ... but what if you typeset it in something from that era, and then laid that onto some wood and then with a hand held wood burner (the kind you can get at a craft store) you burned the letters into the wood and then photographed that? Or get a brand made with your typefaces. There must be something available like that. If you use a bold enough sans and a hard/white enough wood it would be easy to photograph.</p>
