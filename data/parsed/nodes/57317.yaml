      <p>Wow. Great info. Thank you! The menu is still in its very rough stages, but i appreciate all of the detailed info. I'm working on those changes now. I'll compile the whole thing into one PDF and upload it for everyone to see and critique, BUT I would really like to hammer out what fonts i'm going to use first, so that i can avoid having to make all those small alignment changes that come up when using different size fonts. Anyone have any ideas? Adobe Caslon Pro is the winner as of right now. </p>
      <p>One stipulation that I am faced with when choosing the font for the body is that the bottle list portion of this menu will actually be generated through an ASP.NET application using Crytal Reports. It will be a centrally hosted application that is accessed by each different World of Beer location, who will then generate and print the menu at that location. I'm not yet sure how that will affect the flexibility what fonts i can use, or if it's as simple as having each location install whatever fonts we decide to go with. My thought is to lean towards a somewhat "standard" font, but i'm open to all suggestions.</p>
      <p>Thanks again for taking the time to write all of those comments. I replied to each below...</p>
      <p>-------------------------------------------------------------------<br>
      <cite>Generally the type seems quite small and the look is very clean.</cite><br>
      -- Do you like the Adobe Caslon Pro? Would it look better with a sans typeface?<br>
      -------------------------------------------------------------------</p>
      <p>-------------------------------------------------------------------<br>
      <cite>In the intro section, I’d remove the words ’According to Wikipedia’.</cite><br>
      -- Agreed. Client provided that copy, but I think i'll have to veto that decision.<br>
      -------------------------------------------------------------------</p>
      <p>-------------------------------------------------------------------<br>
      <cite>I’d turn off hyphenation.</cite><br>
      - Ok, wasn't sure about this. I personally don't like hyphenations. What if i full-justify the paragraphs under "ALE" and "LAGER"? Should i still turn off hyphenation?<br>
      -------------------------------------------------------------------</p>
      <p>-------------------------------------------------------------------<br>
      <cite>That ellipsis needs to go.</cite><br>
      -- Replace with a colon? Or just put a period? Trying to lead into the ALE/LAGER section.<br>
      -------------------------------------------------------------------</p>
      <p>-------------------------------------------------------------------<br>
      <cite>In the Lager section, you have two spaces between the forst and second sentences.</cite><br>
      -- Oops. Will fix.<br>
      -------------------------------------------------------------------</p>
      <p>-------------------------------------------------------------------<br>
      <cite>The word ’in’ in the first line also looks disconnected. I’d justify the text as it’s in narrow columns.</cite><br>
      -- True. Will justify the text.<br>
      -------------------------------------------------------------------</p>
      <p>-------------------------------------------------------------------<br>
      <cite>The ’Beer Timeline’ needs more leading between the two lines of the title. It’s not centred on the box.</cite><br>
      -- Agreed and agreed.<br>
      -------------------------------------------------------------------</p>
      <p>-------------------------------------------------------------------<br>
      <cite>Typo ’Hops begins...’</cite><br>
      -- oops.<br>
      -------------------------------------------------------------------</p>
      <p>-------------------------------------------------------------------<br>
      <cite>Capitalisation of ’Beer Making’, ’Legions’ and ’Brewers’ pokes me in the eye.</cite><br>
      -- will fix.<br>
      -------------------------------------------------------------------</p>
      <p>-------------------------------------------------------------------<br>
      <cite>’Indians’ is not the correct word for native Americans where I come from.</cite><br>
      -- very true!<br>
      -------------------------------------------------------------------</p>
      <p>-------------------------------------------------------------------<br>
      <cite>Is WooHoo two words and does it need a capital H?</cite><br>
      -- yeah, two words and no caps would be better.<br>
      -------------------------------------------------------------------</p>
      <p>-------------------------------------------------------------------<br>
      <cite>On the second page, the Name column needs the heading aligned with the text, as in the other columns. </cite><br>
      -- Yes. Was planning on aligning "NAME" with the letters of the alphabet below, and having those letters stick out a bit like they are so the reader can find them more easily. Would it be best to align all of it (header, items, and letters) the same?<br>
      -------------------------------------------------------------------</p>
      <p>-------------------------------------------------------------------<br>
      <cite>Wow, what a lot of beers! Would it be a good idea to sort them by brewery rather than alphabetically by name?</cite><br>
      -- We went back and forth with this, but b/c of all of the consolidation of breweries, it's tough. I can't tell you how many product lines inBev now brews, and Groupo Modelo makes Corona, Modelo, Pacifico, Tropical, etc. We believe that it will be easier if we include the product line (e.g. Sam Adams) in front of the name, and order them that way. Sam Adams is made by Boston Brewing Company.<br>
      -------------------------------------------------------------------</p>
      <p>-------------------------------------------------------------------<br>
      <cite>I’d prefer the word ’style’ to be ’type’...maybe that’s just me though.</cite><br>
      -- Client prefers "style".<br>
      -------------------------------------------------------------------</p>
      <p>-------------------------------------------------------------------<br>
      <cite>Like the page numbering but perhaps bold would be a better contrast for the size of text.</cite><br>
      -- Agreed.<br>
      -------------------------------------------------------------------</p>
