    <p>I'm pretty amateur when it comes to typography and design, so looking for some honest feedback here. I'm designing a menu for a client, World of Beer. They have over 500 bottled beers, so the menu is pretty extensive. The table of contents will be as follows...</p>
    <p>Beer Basics - p.1<br>
    Beer Styles - p.2-3<br>
    Bottle List - p.4-13<br>
    Mixed Drafts - p.14<br>
    Wine List - p.15<br>
    Cigars - p.16<br>
    Food - p.17</p>
    <p>Their logo uses a variation of Copperplate Gothic, so I was looking to use that typeface for the headers, but I have no idea what to use for the body.  I started with Arial, but definitely do not want to use that. I looked at Adobe Caslon Pro, and thought that looked better. Any other suggestions? Should i use a sans font b/c the headers are Copperplate, or does that not matter?  One thing to keep in mind is that the reader will be in a somewhat dimly lit bar, so readability is very important. </p>
    <p>All comments welcome. I have thick skin :] Thanks in advance, J.W.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/menu1_5745.jpg"></div><div class="imageWrap"><img src="http://typophile.com/files/menu2_6433.jpg"></div><p></p>
