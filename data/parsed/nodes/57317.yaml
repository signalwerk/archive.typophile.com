      <p>Hi :)<br>
      It would be really great to see a pdf version.</p>
      <p>The things I noticed as I scanned through:<br>
      Generally the type seems quite small and the look is very clean.<br>
      In the intro section, I'd remove the words 'According to Wikipedia'. I'd turn off hyphenation. That ellipsis needs to go.<br>
      In the Lager section, you have two spaces between the forst and second sentences. The word 'in' in the first line also looks disconnected. I'd justify the text as it's in narrow columns.<br>
      The 'Beer Timeline' needs more leading between the two lines of the title. It's not centred on the box.<br>
      Typo 'Hops begins...'<br>
      Capitalisation of 'Beer Making', 'Legions' and 'Brewers' pokes me in the eye.<br>
      'Indians' is not the correct word for native Americans where I come from.<br>
      Is WooHoo two words and does it need a capital H?</p>
      <p>On the second page, the Name column needs the heading aligned with the text, as in the other columns. Wow, what a lot of beers! Would it be a good idea to sort them by brewery rather than alphabetically by name? I'd prefer the word 'style' to be 'type'...maybe that's just me though.</p>
      <p>Like the page numbering but perhaps bold would be a better contrast for the size of text.</p>
      <p>Hope that's helpful :)</p>
