    date_raw: 24 Apr 2009 — 3:33pm
    votes: null
    html: |-
      <p>Ok, I'm going to go out on a limb and suggest Plantin. I think a serif font is good. I find Caslon a bit light on the page and a bit too elegant somehow...I'm certainly not an expert though, so perhaps others can weigh in too.</p>
      <p>&gt;What if i full-justify the paragraphs under “ALE” and “LAGER”? Should i still turn off hyphenation?</p>
      <p>I'd see how it looks with justified non-hyphenated text. You can always play with tracking and word space manually if it looks uneven.</p>
      <p>&gt;Would it be best to align all of it (header, items, and letters) the same?<br>
      Not sure, maybe. I quite like the outdented alphabet letters.</p>
      <p>That ellipsis at the start should grammatically be a colon; but because of the layout I think a full-stop would be better. </p>
      <p>The second sentence is ungrammatical. It reads "The basics of brewing beer ... are commonly categorized into two main categories". You have a missing subject (beer) which needs to go in there. (It's not the basics that are categorised, it's the beer, isn't it?)</p>
      <p>Actually, I'd reword the sentence completely because 'categorized...categories' is strange anyway. Perhaps: There are two main types of beer, and their methods of brewing are shared across cultures and national boundaries. Or: The two most common processes for brewing beer are shared across national and cultural boundaries, and result in two main types of beer.</p>
      <p>It's still not very interesting as a sentence. That's the problem with lifting text from Wikipedia; it's not written as menu copy ;) </p>
      <p>How about listing the 'styles' of beer under the two headings so we can see whether 'Imperial IPA' or 'Dunkelweizen' is an ale or a lager?</p>
      <p>I might put more space between the hops and the text too.</p>
