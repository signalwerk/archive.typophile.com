    html: |-
      <p>I agree with Joe.  There's too many similarities to attribute it simply to inspiration.  This is more than inspiration, since almost every design element on the Macromedia site was copied.  There's the navigation, sub navigation, placement of logo, rounded corners, and gradient background.</p>
      <p>If you only used a couple of these elements in your own design and developed it further, that'd be fine... but when you take all of the design elements including the color scheme, I'd say that's theft even if you don't copy the code.</p>
