    date_raw: 26 Sep 2005 — 1:43pm
    votes: null
    html: |-
      <p>I agree with timid. There is a definite difference betrween being inspired by, and stealing, a design. This example is clearly not theft in any sense. It is VERY common in the design world to look to other's work for inspiration. For good designers, this usually sparks avenues of ideas that lead to a finished product that bears little or no resemblance to the work that gave them their inspiration. For less experienced designers, it may lead to solutions like the example you show above, but it still isn't theft.</p>
      <p>What does equate to theft, for me, is direct copying, with very subtle changes. I once was browsing an HTML template site that sells prepared site templates (don't ask!), and what I saw there appalled me. They had directly copied the site of a well-known Florida-based interactive design firm, changing only the headline copy. What's worse, they were selling it as their own work. Of course I promptly emailed the firm regarding this.</p>
