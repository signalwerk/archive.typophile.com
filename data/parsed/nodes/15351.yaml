      <p>i agree w/jp. thievery.<br>
      STEP, while i was getting it for free, had a nice article about design theft in their july/august issue.</p>
      <p>One quote to get the brain goin:</p>
      <p>"Creations patterned after others' work are clearly not plagiarism if, like in footnoted writing, the original that they are modeled after is declared."</p>
      <p>Also..as the STEP article brings up...<br>
      Is it Quotation? Appropriation? Homage? Parody?<br>
      The bike site doesn't fall under any of those categories.</p>
      <p>What if the client had said, "We want this to look like that Macromedia site." Would you do it?</p>
