      <p>I don't feel the need to either fill up the page or have equal margins.  White space is a welcomed friend, not an evil enemy. X-height and leading have their effect as well as the chosen face.<br>
      There  is no formula.  You can use the classical scheme outlined above. You can also use a grid, dividing the page  into 3 or 4 units wide and omitting  the leftmost unit. Mostly, you need to train your eye by experimenting.  This is always the better teacher than any formula. It takes longer at first but once you train your eyes, they pay dividends forever.<br>
      Also, grids don't have to be even, they can be geometric or arithmetic progressions as well.  See Karl Gerstner's "Designing Programs."</p>
      <p>ChrisL</p>
