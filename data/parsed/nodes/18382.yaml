      <p>Here's a thought-- if you're talking about one fat column with a margin on an 8.5x11 sheet, aren't we talking mainly about ruled note-paper  and double-spaced typed manuscripts, really? Magazines in this size virtually always break up the space into columns, modules, etc., as suggested above. So, I would guess that although you <em>could</em> find a nice set of proportions in the one-column, 8.5x11 environment, that's really kind of forcing things from a typesetting point of view.</p>
      <p>FWIW, I tend to see that kind of page as a magnified version of something smaller-- i.e., you'd be better off setting type in something closer to 14 pt in most cases, then reducing for publication (or just to 75% on your screen). With 1-inch margins, e.g., 12-point TNR often occupies at least 80 characters of linear space-- way too big.</p>
