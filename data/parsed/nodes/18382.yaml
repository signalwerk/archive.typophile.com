      <p>Hello,</p>
      <p>You should try applying Villard's diagram to your page, you can read about it on Tschichold's "The Form of the Book". I used to draw the diagram in Illustrator and then transfer the margin values to InDesign (or Pagemaker, Xpress, etc.) but it was pretty boring to draw all those lines, so I've managed to determine the equations of the lines and come up with an Excel file. All I have to do now is enter the dimenstions of my sheet of paper and the number of times I want to divide it and it gives me the appropriate margins based on Villard's diagram. I can upload the file if you're interested. Another way of determining your margins is to use the method of Paul Renner as described by Jost Hochuli in his "Designing Books", but I've found the proportions to be too arbitrary, and never quite understood their origin, so I prefer Villard's (also Tschichold's) method. :)</p>
