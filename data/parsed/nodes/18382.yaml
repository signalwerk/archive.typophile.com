      <p>I don't think you can answer this independent of the typeface involved. I personally find that Bringhurst's (and Felici's) recommendation of an ideal single column width of 66 lower case characters--2 1/2 lc alphabets is very important to readability. And he is right that more than 75 to 80 characters starts to slow the reader down. </p>
      <p>This being the case, most 'letter' sized pages with Times New Roman have much too long a measure. So to make layout work on letter sized paper is a challenge. You can use a very wide typeface like Century School Book or even Courier--which not accidentally works perfectly as far a line length on a letter sized paper with comfortable but not wide margins. </p>
      <p>Generally, you are better off using a wide left margin and putting titles in it, or going for a magazine style of two or three columns with a narrower typeface. </p>
      <p>If you are going for a wider measure and a narrow typeface, then ample leading between lines and short paragraphs with extra space in between helps.</p>
