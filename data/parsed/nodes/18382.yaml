      <p>I should try to address this, since I'm supposedly a teacher of professional and technical communication. Here's what I think people do to sort of fight against the less-than-ideal environment of 8.5x11:</p>
      <p>1. Use 1.25 in margins on L and R. In fact, MS Word defaults to this, although usually publishers and editors ask for 1 inch all around. Then again, they often ask for double-spacing.</p>
      <p>2. Use massive top and bottom margins for short letters, you know, like we all learned how to "center" a business letter between the top and bottom of the page when using a typewriter. Sticking a letterhead or logo at the top (or even the word "MEMORANDUM" in a huge size for memos) is also used to break up vertical space.</p>
      <p>3. Add space between paragraphs.</p>
      <p>Notice that 2 and 3 above are about breaking things up vertically; I think it's just one way of balancing positive and negative space on the page field. Paragraphs may still be very wide.</p>
      <p>4. Tolerate a too-big sheet and just go on with life. 99% of this kind of communication is meant to be pragmatic, servicable, etc., with no real consideration of artfulness.</p>
      <p>"For pros": Set up, as someone may have suggested above, a left-hand column of about 2 or 2.5 inches width, for logo, masthead, contact info, etc. Effectively this narrows your "body" column dramatically. Then you can set stuff in that second column with healthy top and bottom margins without it looking all skinny. This is often done on commercial and organizational letterhead, where there's a budget to do so, so it's sort of a different animal than the run-of-the-mill correspondance 1-4 refer to.</p>
