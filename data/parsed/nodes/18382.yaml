      <p>Tiffany, the equations are simple, basic analytic geometry (though I had to take a look at a math book to remember them). I'm also uploading two pdf files of a layout I'm working on, I've used Villard's diagram as the starting point of my grid.</p>
      <p>If by any chance you have access to a copy of Müller-Brockmann's Grid Systems in Graphic Design you can apply Villard's diagram to his cover, it fits perfectly recquiring only some minor adjustments (though he never mentions using the diagram inside his book).</p>
      <p>Tschichold dedicated a lot of his time to rediscover Villard's diagram, he was also a <em>persona non grata</em> between swiss designers (specially those responsible for the Neue Grafik magazine), I suppose this was one of the reasons Müller-Brockmann didn't mention Tschichold's research, but this is only a speculation. Here you can read <a href="http://learning.north.londonmet.ac.uk/epoc/tschichd.htm" rel="nofollow">an excerpt of Tschichold's book.</a></p>
      <p>As to dezcom's comment, I think it's really a matter of choice, I'm really addicted to precision, so I'd rather use a calculator and control every single unit of the page than to trust on my eyes only. Both approaches are valid. There's a nice discussion about these different methods of work on Lucienne Robert's The Designer and the Grid published by Rotovision.</p>
      <p><a href="http://pontomidia.com.br/rafael/villard_diagram.xls" title="http://pontomidia.com.br/rafael/villard_diagram.xls">http://pontomidia.com.br/rafael/villard_diagram.xls</a><br>
      <a href="http://pontomidia.com.br/rafael/sessoes_grid.pdf" title="http://pontomidia.com.br/rafael/sessoes_grid.pdf">http://pontomidia.com.br/rafael/sessoes_grid.pdf</a><br>
      <a href="http://pontomidia.com.br/rafael/sessoes_layout.pdf" title="http://pontomidia.com.br/rafael/sessoes_layout.pdf">http://pontomidia.com.br/rafael/sessoes_layout.pdf</a></p>
