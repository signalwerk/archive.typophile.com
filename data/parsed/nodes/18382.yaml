      <p>A pretty good universal solution is to divide the page diagonal into a certain number of equal parts and then use one such part as the top and inner margin (plus some additional binding gutter) and two such parts as the bottom and outer margin. </p>
      <p>The traditional Renaissance book used the division of both the horizontal and the vertical edge into 9 parts, so you'd have a 1 + 6 + 2 division of the page. However, this gives you very generous margins that don't work well in today publications. Therefore, you could try e.g. a division into 12 equal parts (1 + 9 + 2). </p>
      <p>If you reserve 0.2 inch for the binding gutter and divide the page into 12 equal parts, you'll have the inner margin of 0.692", the outer margin of 1.383", the top margin of 0.917" and the bottom margin of 1.833". Perhaps it's better to calculate in points -- in that case, you'd have the inner margin of 50 pt (plus a 14 pt binding gutter), the outer margin of 100 pt, the top margin of 66 pt and the bottom margin of 132 pt. </p>
      <p>Of course, if you'd like to be a more generous, you can try to divide the page edges into 9 equal parts and use the 1 + 6 + 2 principle. </p>
      <p>A.</p>
