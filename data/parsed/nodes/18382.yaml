      <p>The writer of this fairly informative set of web pages suggests 1.55 in on left and right, 1 in on top, 1.25 in on bottom.  It gives a ratio of text height to text width which turns out to be the golden mean. He claims it's the shortest line length he can get away with, without the page looking weird.</p>
      <p><a href="http://www.nbcs.rutgers.edu/~hedrick/typography/" title="http://www.nbcs.rutgers.edu/~hedrick/typography/">http://www.nbcs.rutgers.edu/~hedrick/typography/</a></p>
      <p>I'm an ameteur as well. It's always nice to have some concrete suggestions, since the expert opinion often seems to be "use the most aethetically appealing choice."  I'm a good engineer of documents, but I often appreciate specific recommendations based on someone else's aesthetic judgement.</p>
