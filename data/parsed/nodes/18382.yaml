      <p>Thanks everyone for your help.</p>
      <p>I wonder though, if the paper dimensions - 8.5x11 - are not conducive to nice single column typesetting, what do you actually do, given that that is the paper standard for North America. When you write a business letter, or any kind of correspondence which will be printed on a piece of paper this size, what margins do you actually use?</p>
      <p>Interestingly, Frank Lloyd Wright actually turned the paper horizontally, the bottom half of the left hand side was used for his mark (a black square) and his signature, and the right half of the sheet he used to make a nice size text block, but this seems inappropriate for a business/professional context.</p>
      <p>I've been trying to use smaller type (11 pt), but maybe sticking with 12 pt would be bettr given the unfortunate measure that seems required.</p>
      <p>My intention is to take two or three suggestions and try them out to see which ones appeal most.</p>
      <p>Thanks everyone</p>
