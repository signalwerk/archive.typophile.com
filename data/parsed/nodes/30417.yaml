      <p>James, as a newbie myself I second some of these sources as well. (I use Matthew's suggested title to help my with italics.) Having been in your position recently, there really is NO comprehensive book published on type design. </p>
      <p>You're not really going to find one source that it is gonna be your bible. Get the Bringhurst book as well. I learned from Cabarga's book and Bringhurst. Once you get the basics down, I did what Choz suggested and cracked open some of my favorite fonts in FontLab to look at their digital construction. For me, drawing by hand didn't mean jack until I started digitizing.</p>
