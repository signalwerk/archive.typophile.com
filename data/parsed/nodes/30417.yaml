      <p>Bilak's basic point in his <a href="http://www.typotheque.com/articles/designing_type_/" rel="nofollow">review</a> is that the book doesn't approach type design as a type designer would. Quite right. But it still contains a lot of good comparative information on letters, and I own it and find it helpful. </p>
      <p>For a type designer's approach you can read what is IMHO overall the best book on type design, G. Briem's <a href="http://briem.ismennt.is/2/2.3.1a/2.3.1.01.notes.htm" rel="nofollow">Notes on Type Design</a>. It is not printed, which would be nice, but is on line--free :)</p>
