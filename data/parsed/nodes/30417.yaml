    html: |-
      <p>I just took Rod Cavazos' type design class at CCA, for which I purchased Karen Cheng's book -- as a beginning type designer, but someone who has done graphic design for years, I loved the book -- it's not an encyclopedia, but I think it's a pretty thorough examination of the basics of serif and san serif forms. I found it very useful to get started with.</p>
      <p>The book is also very attractive, and I'm happy to have it as part of my graphic design library. I don't think you have to be a type designer to appreciate it, just someone who is interested in type.</p>
      <p>BTW, we used FontLab Studio 5 in the class.</p>
