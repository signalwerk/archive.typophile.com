    html: |-
      <p>When I want a cold hard synopsis of a glyph, with a nod towards usability and consistency within the face, I find this reference book to be incredibly helpful over and over. And free.</p>
      <p><a href="http://www.microsoft.com/typography/developers/fdsspec/overview.aspx" title="http://www.microsoft.com/typography/developers/fdsspec/overview.aspx">http://www.microsoft.com/typography/developers/fdsspec/overview.aspx</a></p>
      <p>For emulation/inspiration, I'd have to say open up fonts that you are passionate about, and contemplate what was done, try and guess why. Passionate means not just fonts you love, but successful ones you hate, too.</p>
      <p><a href="http://www.chozcunningham.com" rel="nofollow">Choz Cunningham</a><br>
      <a href="http://www.exclamachine.com" rel="nofollow">!Exclamachine Type Foundry</a><br>
      <a href="http://www.exclamachine.com/snark" rel="nofollow">The Snark</a></p>
