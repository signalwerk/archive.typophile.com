  html: <p>I'm starting to teach myself to design typefaces and build letters, and I'm running into problems figuring out the best way to construct some letterforms. Is there a font that's easy for a beginner to emulate when learning to build letters? Also, is there a good book that explains the design of contemporary letterforms as opposed to those based on handwriting? I've got Cabarga's <em>Bible</em>, but I'm looking for something with more technical details in regards to the shapes of the letters themselves.</p>
comments:
  - id: 176561
    user_id: 11702
    user_name: Reed Reibstein
    user_path: null
    date_raw: 7 Jan 2007 — 6:29pm
    date: 2007-01-07T18:29:00
    votes: null
    html: <p>I give both of James' requests a hearty second! I, too, have been having troubles moving from pencil and paper sketches to vectors, even though I consider myself mildly facile with the pen tool. A big issue for me is how to maintain consistency in, for example, the width of horizontal and vertical strokes.</p>
  - id: 176568
    user_id: 553
    user_name: matthew_desmond
    user_path: null
    date_raw: 7 Jan 2007 — 7:10pm
    date: 2007-01-07T19:10:00
    votes: null
    html: |-
      <p>You may want to pick up a calligraphy book. Seeing how the pen strokes create the different thicks and thins is essential in understanding all letterforms IMO. I like "The Art of Calligraphy, A practical guide to the skills and techniques" by David Harris. It goes through many different styles and has a wealth of historical information.</p>
      <p>Are you trying to work on Serifed type or Sans?</p>
      <p>When I was learning what letters were all about, I would just open Times or Helvetica to get a sense of where the thicks and thins should be and why. </p>
      <p>Hope this helps a little.</p>
  - id: 176570
    user_id: 2021
    user_name: Nick Shinn
    user_path: null
    date_raw: 7 Jan 2007 — 7:21pm
    date: 2007-01-07T19:21:00
    votes: null
    html: <p>To understand metrics, sidebearings in particular, I recommend creating a simple geometric face (stroking paths, aka "Paths&gt;Make Parallel Path" in FontLab), and studying how the sidebearings and overshoots are handled in Futura. Then the italic, to compare mechanically skewed shapes with typographic italicization.</p>
