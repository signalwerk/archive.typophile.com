    html: |-
      <p><cite>"...but when I start trying to build sans letters out of strokes in illustrator my proportions get really gross."</cite></p>
      <p>If you can draw your characters on paper, scanning and tracing those isnt a too big step? Get your stroke width and such as right as possible in your drawings, and clean them up later when you've traced them and when you're in FontLab/Illustrator.</p>
      <p>If it's because you're not familiar with bezier-curves, then I suggest you so some general exersizes first to get the feeling of the tool.  Like tracing a linedrawing of something, you know, things like that.<br>
      Letters are a difficult thing to do when you start... I've noticed that, eventhough I do know bezier-curves quite well. But when it comes to drawing glyps with it, they aren't too smooth. (yet! ;))</p>
