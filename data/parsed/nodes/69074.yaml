    html: |-
      <p>I think it's quite nice.</p>
      <p>But you should check the widths, as riccard said. the middle of your lowercase 'p' looks a little too large in comparison with your other letters.</p>
      <p>Also, the tail of your lowercase 'e' might be a little too short.<br>
      The left edge is also too straight, it does't match the overall roundness of your font.</p>
      <p>The uppercase 'R' is in need of a bit more elegance... the shape is neither round, neither straight.</p>
      <p>The uppercase 'O' is too large when looking at the other characters, the inner space is too wide.</p>
      <p>Watch out for the lowercase 'a', the shape gets filled up at the bottom. Try to place the lower tail upwards or something?</p>
      <p>Anyhow, you're well on the way. Keep us informed!</p>
