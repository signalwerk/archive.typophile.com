    html: <p>What you did with the bowls is logical, but just seems 'wrong'. Either the straight strokes need to be longer or you make the whole thing round. This way it seems as if was a circle, but pieces have ben cut off. I like the idea of the font and for a first one it's certainly not bad. You need to put some more time in the spacing. for instance 'th' in 'that' needs more whitespace. For the problem with the a you should higher the part thats right of the bottom nodes in the bowl. Furthermore you should cut of a piece of the vertical stroke so that it's thinner at the bottom. Hope you get what I mean. the same thing should be done with the h.</p>
