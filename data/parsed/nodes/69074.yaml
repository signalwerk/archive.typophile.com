      <p>Thank you very much for your comments and sorry that i did not answer so far - i thought i get an email when some one replied (So for - my shame - i forgot it).</p>
      <p>I did not work on it further so i don't have news on the font but with the stroke widths i have a little problem: I'm quite sure that i worked with the same withs on each letter because i used grid lines to "measure" that but anyway they look different. Could it be that for those letters where the width seems different i simply should not trust the grid but my look? Is that common in typography? I see this problem on the C,S and U - do you see some more?</p>
      <p>With the "p" its funny - it's the very same shape as the a,b,d,q,p and the upper part of the q. So they all should have the same problem as the a has. There i have the problem that i can not take the lower tail up cause then the entire letter seems lower, i can not lengthen the edge and i would not like to miss the round corner between edge and tail :S</p>
      <p>@tourdeforce: This upper image was the best that i could get out of the a-a in photoshop - do you have any suggestions?</p>
      <p>Best regards,<br>
      Christian</p>
