    <p>Hi all,</p>
    <p>i'm a newbie in designing fonts and here's my first one - hope you'll like it.</p>
    <p>By posting here i would like to come up with two questions:</p>
    <p>First is if you have any ideas for another name of this font - i don't really like "daluxe" very much.</p>
    <p>The second is an issue that propably comes from my missing knowledge: When i preview the font in fontLab it the anti-alias is more or less fine. When i export the font as OTF and use it in Photoshop the anti-aliasing is quite ugly:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/test_4580.jpg"></div><p></p>
    <p>Do you have suggestion how i could solve this?</p>
    <p>Thanks in advance,<br>
    Christian</p>
