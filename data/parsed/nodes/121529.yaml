      <div class="comment-spam-body"><p>Numbers would use the key glyph "zero" and their spacing would be dependent upon their character set, either tabular or non-tabular. Symbols in general can be set up using the key glyphs they would normally be used with, and the same principles apply.</p>
      </div>
