    <p>Hi everybody,</p>
    <p>I'm working as a font developer, usually my job is to take a Basic Latin set (alphabet, sometimes also numbers and some punctuation or symbols) and turn it into extended Latin, Cyrillic etc.. - a full set. I usually work with sans serifs, slabs at the most. I use Glyphs 2.</p>
    <p>The problem: I'm not exactly sure what the side bearings (sb) of non-letter symbols should be - the side bearings of @, #, 1, 2, &amp;, . : ; " and so on. I realise every font is different and there are no rules set in stone, but I know that sb of the alphabet symbols are based on H, O and n,o (we're taking standard, not fancy in any way ghotic fonts), Is there a similar system for the non-letter symbols? Based on the period, for example? How do you go about your fonts? Please share experience and thoughts.<br>
     :o)</p>
