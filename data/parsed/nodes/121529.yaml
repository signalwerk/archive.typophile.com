    html: |-
      <p>I look at how these glyphs appear in text strings of what I consider to be the most typical usage.<br>
      For instance, the @ symbol most often occurs in email addresses, with lower case letters either side.<br>
      While I weight /&amp; as a lower-case glyph, I set its sidebearings (and kerning) for cap acronyms such as “V&amp;A”.</p>
      <p>It also helps to study how the sidebearings are handled in solid, well-established typefaces similar in genre to what one is working on.</p>
