    html: |-
      <p>Some additional questions:</p>
      <p>1. is there something like a "Lorem Ipsum for Symbols"? I wrote some mathematical formulas to set integrals, Sums and so on in their native ecology, also some simple phrases that use astrisks, comma, inversed question marks and so on, but I'm wondering if there is a standard Symbol LIpsum.</p>
      <p>2. as far as I gather, there is no standard way to draw the copyright and original symbols - sometimes they are Caps Hight tall, sometimes less, sometimes aligned top and sometimes aligned middle. What determines the position and size? Is it only the designer's decision?</p>
      <p>3. I have some trouble understanding how to align some symbols vertically. Which symbols should be centered vertically to the x-hight, which ones - to the Caps hight, when should there be two versions?</p>
      <p>4. Are there symbols that should not be italicized? I read something about this in another topic here, I'm wondering what are the rules in this respect.</p>
      <p>5. as far as I know, there are symbols that don't respect the overall rules of the font and keep their special stem width and size because they are used very seldom, like a typographic dialect with it's one rules. Does anyone have any information on this?</p>
      <p>6. even if there are no standard rules, are there certain principles of construction, like "if you design the copyright this way, you should design the partial differential that way, and the eth so-and-so" Besides, of course, basic features like stem thickness and overall size.</p>
      <p>I am aware this are very very minute and trifle matters, but I believe they nonetheless have their importance for a well-made font. </p>
      <p>Thank you for your time.</p>
