    html: |-
      <p>2) What's the "original" symbol? Do you mean the registered trademark? The standard for copyright is to be full-size and centered on the cap height. For registered, it is to be a superscript position. Plenty of people get these wrong, but those are the correct choices for almost all fonts.</p>
      <p>3) Which specific symbols do you mean?</p>
      <p>4) Non-italicization is open to debate, for sure. But I certainly have a list of symbols to not italicize, borrowed from work I did at Adobe.</p>
      <p>5) That's a choice by the designer or foundry, but in general I don't see much point in it. Why put in bogus character support? I'd only do that if I had a specific client or customer need for it.</p>
      <p>6) I don't think I have ever seen such guidance thoroughly enunciated. But you might check Microsoft's character design guidelines, or Karen Cheng's book. Maybe the old Monotype type design standards have it, I'd have to look. (That is internal and unpublished Monotype material. Assuming I'm not confusing Mono and Lino here.)</p>
