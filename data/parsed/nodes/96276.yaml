    <p><a class="freelinking external" href="http://www.lawrenceshelter.org/index-3.html" rel="nofollow">http://www.lawrenceshelter.org/index-3.html</a></p>
    <p>I'd like to identify the script/calligraphic font used for "Chocolate" and "tea at three" in the graphic at the top of the page. A different designer created this logo 12 years ago. By the time I took over as committee chair for this event, no one could even remember who designed the event logo, much less the font. </p>
    <p>Thanks for any assistance you can provide,<br>
    Anne</p>
