    <p>I'm designing an identity for a small internet-based writing/blogging business run by four strong, yet fashionable women with great taste and I'm looking for some possible typeface suggestions for a logo.</p>
    <p>They are going to be writing about fashion, fine dining, consumer goods and similar topics in a space  that's …er male-heavy.</p>
    <p>The face should be strong, yet feminine. Somewhat of a classic that feels trustworthy and wise, but also has a touch of sass and knows how to party (or even better… throw a party). This party would have wine, flavoured martinis, expensive cake, tapas, and casual designer clothing. They would talk of art, popular music, twitter, contemporary fashion, and possibly even a little Futurama. The party would start at 10pm in Montreal and the hosts would be female, but anyone's invited… if you're cool enough. Think Mad Men meets Sex in the City. </p>
    <p>The name of the business is quite masculine, but fun in a tongue-in-cheek kind of way. I'd like to contrast it with something non-masculine.</p>
    <p>I'm leaning towards a serif, but am definitely open to a sans, slab, or even (cautiously) a thick, sturdy script of some kind. Preferably something from the 60's (or even influenced by faces of the 60's).</p>
    <p>Any ideas?</p>
