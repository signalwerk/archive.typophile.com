      <p><cite>"In my ideology, those terms are not mutually exclusive"</cite><br>
      Um, not in mine either. But I too have found that stating them like this often helps in communication because to most people, when you request a «feminine» font, they'll name pretty, decorative, swirly, floaty-elegant designs; not «strong» ones. So while I personally wouldn't necessarily put the «but» there either, I understand that it doesn't need to come from a closed mindset but maybe just from trying to prevent a too-common, unintended reply. Now do we seriously need to argue if the original poster would correctly have to ask for a «strong <em>and</em> feminine» font instead?</p>
