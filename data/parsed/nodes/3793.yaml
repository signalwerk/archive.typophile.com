  html: <p> I've recently been approached by somebody who does not want a custom font but custom lettered titles. I have no idea how many titles or how long the titles wil be. <br> <br>The font doesn't exist, and I'm not sure if they have a specific lettering style in mind so it's totally from scratch. <br> <br>They want a quote and I'm not sure how to quote this. Initially I was thinking per letter but duplicates would cost 1/2 as much since I've already created them. <br> <br>So, the word - "Wood" would be 3 letters and 1 1/2 price letter. <br> <br>I'm not sure if $50 per letter is reasonable, $25? I'm just fishing more than anything. Any suggestions? <br> <br>Stuart :D </p>
