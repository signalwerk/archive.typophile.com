    html: <p> 1. You should have a base "minimum overhead" amount, and add per-letter amounts to that. <br>2. In lettering various "glyphs" of a letter don't have to be the same, and often making them different is the point; so keep it simple and charge per letter. <br> <br>But the above is assuming they can't just tell you the total amount of work in advance. Why would this be the case? <br> <br>hhp </p>
