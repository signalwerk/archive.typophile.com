    <p>///// Sudtipos news //////</p>
    <p><strong><a href="https://web.archive.org/web/20150123205256/http://www.sudtipos.com/" rel="nofollow">Sudtipos</a></strong> is proud to announce the release of <strong><a href="https://web.archive.org/web/20150123205256/http://www.veer.com/download/pdf/feelscript.pdf" rel="nofollow">Feel Script (PDF here)</a></strong></p>
    <p></p><div class="imageWrap"><img src="https://web.archive.org/web/20150123205256im_/http://typophile.com/files/feeltypophile_6483.png"></div><p></p>
    <p>Feel Script is based on lettering that calligrapher and logo designer Rand Holub created for Intertype for his face Monterey. Fortunately, I didn’t have the technological limitations today that Intertype had back then. Holub’s lettering is presented in its entirety within Feel Script. Some letterforms were redrawn from vintage American magazine ads (some by Holub himself), along with many new alternates, ligatures, ending forms, and strangely beautiful character combinations. The experience I’ve accumulated from my previous calligraphy typefaces (Ministry Script, Affair, Buffet Script, Burgues Script, et al.) made it easier for me to apply Holub’s lettering in a new context using OpenType technology. The usual extended treatment was given to Feel Script, all the way into the implementation of three-letter ligatures and the dreamiest swashes I could imagine. I changed some of the connections between the lowercase letters in order to fit Holub’s calligraphy as opposed to the limited Intertype metal attempt.<br>
    I hope you like Feel Script. I also hope what I contributed to this particular Holub design is somewhat of a happy ending to a calligraphy story that crosses many technologies. From the pen to computer Bézier. My part of this story stops here ... and yours begins.<br>
    Feel Script has more than 1200 glyphs including: stylistic alternates, contextual alternates, titling alternates, swashes, and ligatures.</p>
    <p>More about <a href="//web.archive.org/web/20150123205256/http://www.veer.com/products/typedetail.aspx?image=UMT0000300#specimen" rel="nofollow">Feel Script</a> here</p>
