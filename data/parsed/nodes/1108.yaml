    html: "<p>I found reference to the same font in a 1988 VGC one-liner and the 1989 Linotype handbook. Modula was designed by one F. Heigemeir in 1972 and the copyright is attributed to VGC. There are actually four weights in this family: Regular, Medium, Bold, Extra Bold. I can probably scan in the examples I have if you like. <br> <br>As for availability, the face probably lies at the bottom of the corporate abyss that is and once was the Visual Graphics Corporation.</p>"
