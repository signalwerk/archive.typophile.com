      <p>The eccentric S looks fine, you don't need the more ordinary alternate.  </p>
      <p>Did the original sample have an 'E' or 'F' in it?  I would try the E with the middle horizontal as low as the bar in the A.  And try the F with the horizontal very high.</p>
      <p>I feel like I've seen this building in SF, but I can't quite place it.  Where is it?</p>
      <p>-matt</p>
