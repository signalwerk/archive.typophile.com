    <p>Hi Typophiles,</p>
    <p>I've been working on my first typeface, and would appreciate your feedback. Please be gentle.</p>
    <p>The typeface is all caps. It's based on some letters cast into the front of an old industrial building in San Francisco. The angular S was one of the original letterforms; I've also drawn a less eccentric alternate. There are also two ampersands because I like them both.</p>
    <p>Many thanks.</p>
    <p>Michael Starkman</p><div class="imageWrap"><img src="https://web.archive.org/web/20150124153621im_/http://typophile.com/files/Galvanize-Specimen-Sheet_3876.gif"></div><p></p>
