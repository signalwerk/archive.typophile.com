    votes: null
    html: <p>That was discussed at this Board in 2003 (<a href="http://www.typophile.com/forums/messages/83/8442.html?1049994456" target="_blank">see thread here</a>) with no solution, and Google found several other failed attempts at getting an ID for this. I think this is either an antique typeface or custom work (or both), and your best chance would be to approximate it or draw it yourself, because even if a typeface was used for the original, it has not apparently been digitized.</p>
    html_clean: <p>That was discussed at this Board in 2003 (<a href="http://www.typophile.com/forums/messages/83/8442.html?1049994456" target="_blank" class="link-lost">see thread here</a>) with no solution, and Google found several other failed attempts at getting an ID for this. I think this is either an antique typeface or custom work (or both), and your best chance would be to approximate it or draw it yourself, because even if a typeface was used for the original, it has not apparently been digitized.</p>
