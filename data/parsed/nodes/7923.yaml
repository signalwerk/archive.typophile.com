    date: 2004-11-30T07:48:00
    date_raw: 30 Nov 2004 — 7:48am
    votes: null
    html: <p>"BRAND" is Helvetica. Other than that, I believe the whole thing was hand-lettered.  <br> <br>FYI, this is an old design and such things were routinely done by hand because of the limitations of metal type. You may find some fonts similar to the letterforms on this label, but it's unlikely you will find any exact matches (unless a Jack Daniel's fan has created fonts based on the label lettering).</p>
