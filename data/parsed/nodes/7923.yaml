    html: <p>“<span class="caps">BRAND</span>” is Helvetica. Other than that, I believe the whole thing was hand-lettered.  <br><br><span class="caps">FYI</span>, this is an old design and such things were routinely done by hand because of the limitations of metal type. You may ﬁnd some fonts similar to the letterforms on this label, but it’s unlikely you will ﬁnd any exact matches (unless a Jack Daniel’s fan has created fonts based on the label&nbsp;lettering).</p>
