    html: <p>That was discussed at this Board in 2003 (<a href="https://web.archive.org/web/20191003060932/http://www.typophile.com/forums/messages/83/8442.html?1049994456" target="_blank">see thread here</a>) with no solution, and Google found several other failed attempts at getting an <span class="caps">ID</span> for this. I think this is either an antique typeface or custom work (or both), and your best chance would be to approximate it or draw it yourself, because even if a typeface was used for the original, it has not apparently been&nbsp;digitized.</p>
    html_clean: <p>That was discussed at this Board in 2003 (<a href="https://web.archive.org/web/20191003060932/http://www.typophile.com/forums/messages/83/8442.html?1049994456" target="_blank" class="link-lost">see thread here</a>) with no solution, and Google found several other failed attempts at getting an <span class="caps">ID</span> for this. I think this is either an antique typeface or custom work (or both), and your best chance would be to approximate it or draw it yourself, because even if a typeface was used for the original, it has not apparently been&nbsp;digitized.</p>
