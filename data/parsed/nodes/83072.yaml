  html: |-
    <p>i have launched version type foundry - <a class="freelinking external" href="http://www.versiontypefoundry.com/" rel="nofollow">http://www.versiontypefoundry.com/</a>. version type foundry is a new york city based type foundry &amp; custom type service based in new york city founded in 2010 by justin thomas kay. justin is a creative director and graphic designer with a strong focus in creating work based on basic explorations of shape, color and typography. he was chosen as one of the 50 young guns for 2008 by the art directors club of new york city. currently justin is creative director of FADER magazine &amp; media group and freelances for various clients out of his studio in new york city.</p>
    <p>right now i have one release thats been in the pipeline for quite a few years, finally got around to wrapping it up and putting it out into the wild. more to come!</p>
