      <p>Novelist,</p>
      <p>I think we may need a bit more info to help you out.</p>
      <p>When you placed the copy into ID, did you link the text blocks so that the copy flows freely between them? And did you set up master pages?</p>
      <p>If you did these things, moving down your master text blocks in the master page will automatically re flow the copy appropriately. If you didn't do these things, I would recommend starting over and doing them to facilitate easier editing in the future.</p>
      <p>Maybe this sounds like gobbledygook if you're an InDesign beginner, but I hope it helps.</p>
      <p>Cheers,<br>
      Rachel</p>
