    <p>Having just discovered this forum, I thought to join to learn and to ask an initial question.  I have recently purchased InDesign CS4, upgrading from Pagemaker 7, which I have not used in several years.  I now need to republish one of my old novels and have used ID 4 to accomplish the typesetting.  However, upon viewing the proof copy, I determined I need to move the entire page text block down about three eights of an inch.  I know how to change margins, but am not certain how I can get the exiting text placement to follow those margins without reflowing the entire text block (about 310 pages) which would also require lots of individual page adjustment.  Is there a quick fix to instruct the text to automatically flow to the new margins?</p>
    <p>Thank you,</p>
