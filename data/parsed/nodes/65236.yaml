      <p>Sounds to me like your text blocks are perfectly linked.</p>
      <p>I'm probably missing something – if you just move the entire text block down on the page without changing its size, there should be no reflow at all, no? Only if you have your text snap to the baseline grid you'll have to fiddle a bit with the exact position of the text block to fit the same number of lines, but other than that, your frame should really fit the same amount of copy no matter if it's 3/8" down or up.<br>
      If I was you I'd make a backup copy of your file, and then try moving the text block down on the master page and observe what happens.</p>
