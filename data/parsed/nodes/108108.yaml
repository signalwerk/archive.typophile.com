    html: |-
      <p>The digital era has democratized type design. Anybody can do it now. That's a fine thing.</p>
      <p>Yes, it means that the percentage of poorly-made junk has skyrocketed. But anybody can design type who wants to. The tools are freely available. The how-to resources are a bit scattered, but all there and affordable.</p>
      <p>I hate crap. But the answer is to educate, inform and encourage good type design, not to keep the tools away from the masses.</p>
