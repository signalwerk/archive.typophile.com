    html: |-
      <p>The tools don't make their product bad. But it is true that in the old days of hot metal, few people would attempt to design type. Those that did were likely to be gainfully employed by typefoundries.</p>
      <p>When just anyone can design a typeface when the fancy takes him, then it would be quite reasonable to suspect that unqualified people would now attempt to design typefaces where they would not have done so before.</p>
      <p>The computer is not at fault for doing anything to the type designs seen as bad, but their existence and proliferation may be a consequence of the new situation that the existence of computer typography has brought about.</p>
