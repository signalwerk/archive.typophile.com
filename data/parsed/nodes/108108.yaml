    html: |-
      <p>The other effect of "digital" type design is that more and more, what I think of as hand lettering is now being offered as fonts. I Don't mean calligraphy, rather signage and the hand lettering you use to see in print ads.</p>
      <p>As the letterforms of signage creep into fonts that are used for other purposes, many people haven't figured out the full effect of those letterforms. So, for example, we're getting fonts whose purported use is for text, but the fonts don't work well with traditional word spacing and leading used for extended text. Some do, most don't.</p>
      <p>A typeface useful for many purposes is a matter of both letterforms and spacing. It's easy to come up with "fresh" letterforms. But getting proper spacing and fit of these characters, suitable for any text that can come along, is a different matter. Often, part of the spacing solution involves modifying the letterforms themselves.</p>
      <p>I'm not saying this well. The point is good hand lettering is not the same as good type, and people who aspire to designing fonts need to understand just why that is so.</p>
