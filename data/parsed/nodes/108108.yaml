      <p>It's not the tool, but it <em>is</em> the ease of publishing. In the past you had to invest a lot more to put a font on the market, and there were people besides the designer standing to lose a job if it sold poorly – all that naturally set higher quality standards.</p>
      <p>The main practical consequence of this is that choosing good type now requires more time.</p>
