    html: <p>Landsdowne is very close but I think <strong><a class="freelinking external" href="http://www.findmyfont.com/index.php/fonts/font-preview?fset=Red-Rooster%20%2F%20%28Commercial%29&amp;ffam=Canterbury%20Old%20Style%20RR%20-%20Regular&amp;fid=16e137d33c0eac8f7ab01fdcaa8fb4bd&amp;fsize=60&amp;text=Doktor%20der%20Rechtswissenschaft&amp;fit=1" rel="nofollow">Canterbury Old Style RR</a></strong> by Red Rooster [1993] is a better match [it's not so round and serifs, kerning and x-height look closer]</p>
