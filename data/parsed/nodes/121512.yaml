      <div class="comment-spam-body"><p>Compare to an undocumented near clone of Canterbury, with the name Landsowne Commercial<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/LandsowneCommercialAsDoktor_4710.gif"></div><br>
      Not quite a 100% match.<br>
      Canterbury Old Style was designed by Morris F. Benton for ATF in 1920, it was not completed for production until 1926.<br>
      You can also use yet another font based on Canterbury, which credits the source, Londonderry Air NF, by Nick Curtis<br>
      <div class="imageWrap"><img src="http://typophile.com/files/LondonderryAirNFAsDoktor_3789.gif"></div><br>
      <a href="https://www.myfonts.com/fonts/nicksfonts/londonderry-air-nf/" title="https://www.myfonts.com/fonts/nicksfonts/londonderry-air-nf/">https://www.myfonts.com/fonts/nicksfonts/londonderry-air-nf/</a><br>
      Don<p></p>
      </div>
