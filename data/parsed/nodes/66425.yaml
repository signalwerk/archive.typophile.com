  html: |-
    <p>It will be good when Chinese operating systems of Windows may have Lucida Sans Unicode font-linked to SimSun and MingLiU.</p>
    <p>For example, when an Chinese operating version of Windows was running, and if you type 地址簿同歩</p>
    <p> and 元 pronounced as もと for Japanese, then the text was displayed as MS UI Gothic. If the font has added font linkings to SimSun and PMingLiU, and then the system was restarted, it may be done.</p>
