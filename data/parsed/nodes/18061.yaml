    <p>When I arrive and leave work, I’m greeted with this new addition across the train tracks from our building:</p>
    <p></p><div class="imageWrap"><img src="/files/typo_FBK_blackletter.jpg"></div><p></p>
    <p>I’ve seen other examples of the Forty Blunts Kore tagged around town, but this one is the most carefully done. </p>
    <p>About once a month, the property owners prepare a clean slate, so I needed to snap this picture before the canvas is empty.</p>
