    <p>hello all,<br>
    i am working on a project and I need to send one of my typefaces to several people<br>
    who are not so familiar with InDesign. I do not have time at the moment to kern the<br>
    typeface. Does anyone know a python script that can import optical kerning<br>
    values from InDesign to Fontlab?<br>
    Thanks.</p>
