    html: <p>If you do a search on Adobe's optical kerning here, you will find that there are a lot of problems with it. If it is spaced well, you are probably better off with no kerning, or lightly kerning a few characters like fVWT, and letting it go at that. Some people have successfully used the <a class="freelinking external" href="http://ikern.com/k1/" rel="nofollow">ikern service</a>.</p>
