    html: |-
      <p>I seem to remember something like this.</p>
      <p>See if this script from Georg Siefert might help with you have in mind:</p>
      <p><a href="http://mac.softpedia.com/get/Graphics/Make-Kern-File.shtml" title="http://mac.softpedia.com/get/Graphics/Make-Kern-File.shtml">http://mac.softpedia.com/get/Graphics/Make-Kern-File.shtml</a></p>
      <p>It’s not Python. It’s Javascript that you have to run in InDesign on a single text frame (can be threaded over many pages) and output an AFM file. But you might be able to press it into service for your needs, if you don’t find anything else more direct.</p>
      <p>I don’t think it’ll read out the Optical Metrics values directly. And, of course, you have to provide the kern-pair strings. What I think you’d have to do is go through your kerning text string and manually override and reset each value in order to have the script pull them out to AFM.</p>
      <p>What I mean by that is that you’d have to advance your cursor between each kern pair and hit option-leftarrow to override the Optical value, then immediately hit option-rightarrow to return to the value determined by Optical metrics, but now as a manual kern that the script will detect and harvest. (Maybe you could script that action locally just to speed things up.)</p>
      <p>I don’t know if that description made sense, or if this will help you.</p>
      <p>(I’m sparing you my considerable rant against the Adobe Optical Kerning routine. ;-)</p>
