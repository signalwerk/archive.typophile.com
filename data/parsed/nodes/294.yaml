    html: <p>The best reference is your own eye. What looks best? Which <br>method conveys meaning without distraction? I usually <br>kern the period so the "TM" is above the period and still <br>close to the "Acme". Crazy dedicated typographers do the <br>same with quotes over periods.</p>
