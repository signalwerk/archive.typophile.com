    html: <p>The logical rule would be to never break the symbol from the item for which it is the trademark. So perhaps my previous statement shows me as a designer and not a communicator. Hmm. So perhaps I'll modify that last statement.  Otherwise, it might look as if the period is part of that which is trademarked. <br></p>
    html_clean: <p>The logical rule would be to never break the symbol from the item for which it is the trademark. So perhaps my previous statement shows me as a designer and not a communicator. Hmm. So perhaps I'll modify that last statement.  Otherwise, it might look as if the period is part of that which is trademarked. <br></p>
  - id: 1658
