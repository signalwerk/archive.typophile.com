  html: '<p>Gang, <br> <br>Way back as a junior lackey, I was taught to typeset trademark symbols (hereafter referred to as TM) at the end of a sentence thusly: <br> <br>"...so make your voice heard: call Acme.TM" (then kern the TM close to the period, rather than: <br> <br>"...so make your voice heard: call AcmeTM." <br> <br>Was I duped? Comments? Is there a reference guide that may discuss this vexing issue? <br> <br>Thanks in advance. <br> <br>CP <br></p>'
  html_clean: '<p>Gang, <br> <br>Way back as a junior lackey, I was taught to typeset trademark symbols (hereafter referred to as TM) at the end of a sentence thusly: <br> <br>"...so make your voice heard: call Acme.TM" (then kern the TM close to the period, rather than: <br> <br>"...so make your voice heard: call AcmeTM." <br> <br>Was I duped? Comments? Is there a reference guide that may discuss this vexing issue? <br> <br>Thanks in advance. <br> <br>CP <br></p>'
