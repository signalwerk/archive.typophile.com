  html: |-
    <p>Britain is heading to the polls on 7 May. The political parties have all presented their electios by now. Funny to see that Labour are using both Open Sans and Roboto Slab for their manifesto. The Tories are using Open Sans and Baskerville.</p>
    <p>Labour: <a href="http://www.labour.org.uk/page/-/BritainCanBeBetter-TheLabourPartyManifesto2015.pdf">http://www.labour.org.uk/page/-/BritainCanBeBetter-TheLabourPartyManifes...</a><br>
    Conservatives: <a href="https://s3-eu-west-1.amazonaws.com/manifesto2015/ConservativeManifesto2015.pdf">https://s3-eu-west-1.amazonaws.com/manifesto2015/ConservativeManifesto20...</a></p>
    <p>Did they make the right decision using Google fonts? Or does it lack professionalism?</p>
