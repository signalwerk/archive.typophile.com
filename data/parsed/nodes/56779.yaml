    <p></p><div class="imageWrap"><img src="http://typophile.com/files/plansa arhaic geo_5184.jpg"></div><p></p>
    <p>Please tell me what you think.</p>
    <p>Thank you.</p>
    <p>I also have other posts here requesting critique so if you like these kind of typefaces please check the others too and tell me your oppinion.</p>
