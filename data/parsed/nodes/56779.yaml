      <p>I think the second row is better, it's certainly an improvement. But I think they still need some work, as they still look a bit 'unsure', especially the 9 and 6. Try to experiment with the size and shape of the bowls. As for the 3, though I like the 3 in the first row better, the second one fits better with the rest. Maybe you can take the bowl of the 1st one, and make the top side more 'edgy', it's just too rounded now. Just keep at it!</p>
      <p>Hope this helps.</p>
      <p>cheerio Queneau</p>
