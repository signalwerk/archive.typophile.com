    date: 2005-03-18T07:49:00
    date_raw: 18 Mar 2005 — 7:49am
    votes: null
    html: <p>If it's on site, they really should be providing the software. <br> <br>Some companies, like MM, grant you a dual-install license (work/home or desktop/laptop). Some companies are smart enough to license the software to YOU rather than your machine, so you could install it on as many machines as you want provided you are the one using the SW. It all depends on the EULA and how much the software company trusts you as a customer ;o)</p>
