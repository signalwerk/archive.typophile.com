  html: "<p>Ok. Here's my issue: I have a contract (freelance job)-- for a long time (I need to go to that place almost everyday). <br> <br>Is it ok to \"take\" with the software - to install it  (I know that I'm the only one that is going to work with that computer &amp; software, of course). <br> <br>any legal issue?</p>"
