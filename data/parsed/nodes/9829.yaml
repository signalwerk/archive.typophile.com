    date: 2005-03-17T17:30:00
    date_raw: 17 Mar 2005 — 5:30pm
    votes: null
    html: <p>If the software is legally installed on your own computer, I don't see any problem taking it to a freelance site. <br> <br>The company's sys-admins might have something to say if you want to hook up the computer to the company's network, but that's not a legal issue.</p>
