    <p>On a recent trip my father made to Vietnam, he picked up an interesting piece of cultural artifact. He went to an institution where people wrote poems. I cannot think of an equivalent in Western culture.</p>
    <p>This is written on a thin handkerchief—the image measuring approximately 6" x 6". </p>
    <p>At first glance you would think the writing is Chinese calligraphy. It is not.<br>
    Rotate the image 90º counter clockwise and upon close examination, the writing is in Vietnamese (roman characters) calligraphy.<br>
    Though very tough to read for someone who is able to read Vietnamese.</p>
    <p>I thought this piece of artifact is interesting because I have never seen a written language written to mimic another.</p>
    <p>Here is the link<br>
    <a href="http://designtn.com/type/chinese_vietnamese.jpg" title="http://designtn.com/type/chinese_vietnamese.jpg">http://designtn.com/type/chinese_vietnamese.jpg</a></p>
    <p>:tony</p>
