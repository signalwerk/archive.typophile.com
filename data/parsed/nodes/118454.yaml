      <p>Might be unique to the game.<br>
      I take it your main interest is in trying to match the lower case.<br>
      There are some fonts with squared lower case letters but most are incompatible with your _g_, _r_, _s_, and _y_, even at this small scale.</p>
      <p>Here are three pay fonts that might work "out of the box."<br>
      DeLuxe Gothic <a href="http://www.myfonts.com/fonts/alphabetsoup/deluxe-gothic/" title="http://www.myfonts.com/fonts/alphabetsoup/deluxe-gothic/">http://www.myfonts.com/fonts/alphabetsoup/deluxe-gothic/</a><br>
      ArchiType <a href="http://www.myfonts.com/fonts/archiness/architype/" title="http://www.myfonts.com/fonts/archiness/architype/">http://www.myfonts.com/fonts/archiness/architype/</a><br>
      FF District <a href="http://www.myfonts.com/fonts/fontfont/district/" title="http://www.myfonts.com/fonts/fontfont/district/">http://www.myfonts.com/fonts/fontfont/district/</a></p>
      <p>And four runners up.<br>
      Foundry Gridnik <a href="http://www.linotype.com/1284323/FoundryGridnikStdMedium-product.html" title="http://www.linotype.com/1284323/FoundryGridnikStdMedium-product.html">http://www.linotype.com/1284323/FoundryGridnikStdMedium-product.html</a><br>
      Kimberley <a href="http://www.myfonts.com/fonts/typodermic/kimberley/" title="http://www.myfonts.com/fonts/typodermic/kimberley/">http://www.myfonts.com/fonts/typodermic/kimberley/</a><br>
      Industry <a href="http://www.myfonts.com/fonts/hold-fast-foundry/industry/" title="http://www.myfonts.com/fonts/hold-fast-foundry/industry/">http://www.myfonts.com/fonts/hold-fast-foundry/industry/</a><br>
      Vox <a href="http://www.myfonts.com/fonts/canadatype/vox/" title="http://www.myfonts.com/fonts/canadatype/vox/">http://www.myfonts.com/fonts/canadatype/vox/</a></p>
      <p>Nothing free that I could find.<br>
      Don</p>
