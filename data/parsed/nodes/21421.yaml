      <p>Wow</p>
      <p>I was just talking to my co-worker Glenda DeGuzman about car lettering; most of the current stuff is techy, wide sans, and compared to the elegant and expressive script logos from the 50’s-70’s, it’s boring. Commuting on 101 gives us an eyeful, and the most interesting logo we saw the whole time was Nubira by Daewoo. Stephen, thanks for sharing that link! I may add some pics soon.</p>
