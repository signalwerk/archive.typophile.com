      <p>I’ve worked in a variety of styles and historical genres, but my only design that could be categorized as being particularly associated with 1930-50 is the basic Eunoia. It seems that the high-contrast, condensed sans serif, most notably Radiant, can be identified with that era. But looking at Eunoia, while the caps are reasonably authentic, the lower case isn’t. I’m not sure this style is automobile-related, as such types tend to be extended, and/or slanted, qualities expressive of speed.<br>
      </p><div class="imageWrap"><img src="/files/Eunoia_5175.png"></div><p></p>
