    html: |-
      <p>For Fournier, check out Joshua Darden's gorgeous <a href="http://vllg.com/JoshuaDarden/CorundumText/mudTyper+Weights/" target="new" rel="nofollow">Corundum Text</a> over at Village. It comes in Book, Semibold and Bold, with Small Caps all around as well as two Pi fonts.</p>
      <p>According to the <a href="http://vllg.com/JoshuaDarden/CorundumText/Example+About/" target="new" rel="nofollow">site</a>:</p>
      <p>"Named for the base substance of rubies and sapphires, Corundum Text celebrates the durable and resplendent types of Pierre-Simon Fournier's 1742 type specimen. </p>
      <p>"The twelve text styles are complemented by two fonts of pictographic symbols in keeping with Corundum's Neoclassic grandeur, including lunar, planetary, zodiac, and indication symbols (fists et al.)"</p>
