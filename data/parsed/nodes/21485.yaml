    html: |-
      <p>In my opinion, you can go two ways with Granjon, both are unconventional:</p>
      <p>1. Poliphilus, along with Blado as its accompanying italic will produce a more 'rustic' look. They don't have the best kerning table or the tidiest outline, though.</p>
      <p>2. Dante, a more contemporary reinterpretation of Bembo. Charles Malin definitely infused his spirit when he cut this type (it hasn't lost with the digital conversion, too, in my opinion), producing a face that, perhaps comparable to how Jan Tschischold reinterpreted Garamond, is contemporary yet classic.</p>
      <p>I imagine that you wouldn't want to use something common like Sabon or Adobe Garamond.</p>
      <p>Oh, and the new Garamond Premier Pro might work too, if your budget permits.</p>
