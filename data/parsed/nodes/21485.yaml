    html: |-
      <p>I selected Fournier MT Std (got it from Adobe) for a magazine/book design, and a corporate identity, and I too have been very pleased with it. It has quite a different look to it than any other roman. It is supposedly two unmatched roman and italic designs. The only real drawbacks are the lack of italic small caps, the lack of Tall Caps (which were in the PS version), and the mismatched italic, though this last part is surpeisingly not so important. The italic is really pretty weird looking.</p>
      <p>If I remember correctly, Plantin has some strangely short extenders.</p>
      <p>Loire appears to be a copy of a late 19th – early 20th century interpretation of Napoleonic typography,</p>
