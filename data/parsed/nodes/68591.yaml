    <p>I started on a new headline sans serif font last week. I made the full Latin 1 character set, and when I first installed it, it lacked uc I, H and K. I uninstalled it, checked the .vfb file with all uc glyphs, and tried again. Now I got a warning: the font was uninstallable.</p>
    <p>I did not copy anything from any other programs, or font files; this font was made solely in FontLab Studio 5.04 Mac.</p>
    <p>Has anybody else had this sort of problem?</p>
    <p>Here's a screenshot of the font (no pdf obviously):<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/T_4019.png"></div><p></p>
