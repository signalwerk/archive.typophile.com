    html: |-
      <p>I tried Mark's method, and got the font to show up, but many characters were missing. </p>
      <p>Happily I go t a quick reply from FontLab, and it appeared that the problem was in the CFF compression (?). This is a AFDKO issue (?). I just needed to turn off the "Use subroutines to compress outlines..." option in FLS, and font works with no problem.</p>
      <p>And wow, do the spammers even reply to posts now?</p>
