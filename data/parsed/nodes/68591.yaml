      <p>FWIW, I avoid using Font Book. Who knows what it's doing. I don't think it was designed with font developers in mind.</p>
      <p>I just keep aliases to my user Fonts folder and Adobe's Fonts folder in my Finder window sidebars. When I want to install a font, I just drag-copy it to one of those folders, and delete the font to uninstall it. I generally install development fonts only into the Adobe Fonts folder until I'm fairly far along. Adobe apps are smart enough to know when a font has been changed, even if the name is the same.</p>
