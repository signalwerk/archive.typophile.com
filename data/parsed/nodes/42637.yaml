    <div class="info">Submitted by <a href="/user/7006" title="View user profile.">paul d hunt</a> : 28.Feb.2008 2.38pm </div>
      <p>Hi!<br>
    Warm greetings from cold New York City.</p>
    <p>/ / / / /</p>
    <p>New release: Newzald by Kris Sowersby of KLIM</p>
    <p>Four months after the release of his National family, Kris Sowersby is back with another gorgeous and eminently useful type family, Newzald.</p>
    <p>The face is a hardworking serif designed for the editorial environment. Influenced by classic Dutch typefaces of Rosart and Fleischmann, Newzald’s large x-height and slightly condensed forms allow many words to the column. Newzald ships in four weights, Book to Black, providing a wide palette for the user. Its extensive character set includes extended language support, seven numeral sets and small caps across all styles.</p>
    <p>The Newzald family of 8 OpenType fonts is available exclusively from Village for US$250.<br>
    <a href="http://vllg.com/KLIM/Newzald/mudTyper+Weights/" title="http://vllg.com/KLIM/Newzald/mudTyper+Weights/">http://vllg.com/KLIM/Newzald/mudTyper+Weights/</a><br>
    <a href="http://www.klim.co.nz/newzald_samples.php/" title="http://www.klim.co.nz/newzald_samples.php/">http://www.klim.co.nz/newzald_samples.php/</a><br>
    <a href="http://www.klim.co.nz/pdf/KLIM-Newzald.pdf">Download PDF Specimen</a></p>
    <p>/ / / / /</p>
    <p>Speaking of Kris Sowersby...</p>
    <p>The results of the Type Directors Club TDC2 competition for type design have been announced, and Kris was recognised as a Judge’s Choice for his National type family.<br>
    <a href="http://tdc.org/news/2008Results/National.html" title="http://tdc.org/news/2008Results/National.html">http://tdc.org/news/2008Results/National.html</a></p>
    <p>Congratulations to Kris, who joins fellow Villagers Mario Feliciano, Karsten Luecke, Christian Schwartz, Underware, and Joshua Darden, who have all been recognised by TDC2 in the past.</p>
    <p>The National family of six weights in roman and italic, with small caps, several numeral sets, and extended language support, is available exclusively from Village for US$250.<br>
    <a href="http://vllg.com/KLIM/National/mudTyper+Weights/" title="http://vllg.com/KLIM/National/mudTyper+Weights/">http://vllg.com/KLIM/National/mudTyper+Weights/</a><br>
    <a href="http://www.klim.co.nz/national_samples.php/" title="http://www.klim.co.nz/national_samples.php/">http://www.klim.co.nz/national_samples.php/</a></p>
    <p>/ / / / /</p>
    <p>Money matters</p>
    <p>The good news: The US$ has hit a record low against the Euro, meaning that licensing type at Village has never been cheaper for our friends overseas. For example, the Newzald or National families, at US$250, convert to Û165. Remember... Our dollar is weak but our types are strong!</p>
    <p>The bad news: To cover the increased costs of silkscreen printing and shipping supplies, we are raising the prices of our posters by US$5, effective March 1. We hate to do this, but feel that the posters are still a pretty great deal.</p>
    <p>/ / / / /</p>
    <p>Thanks for everything.</p>
    <p>Chester &amp; Tracy Jenkins<br>
    Village<br>
    206 Front Street #4A<br>
    Brooklyn, NY 11201</p>
