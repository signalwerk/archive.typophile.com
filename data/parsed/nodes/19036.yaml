    <p>Can anyone recommend, or give me advice on, existing Korean OpenType or TrueType fonts? </p>
    <p>I am looking for typefaces that have Hangul, Hanja and Western characters... Also, I am looking for one family of three weights that could be used as the visual equivalent of a sans serif face, and another family, also of three weights, that could be used as the equivalent of a serif face, if that makes any sense.</p>
    <p>So far I have only had some luck searching on the <a href="http://www.linotype.com/webshop/view.linotype?viewmode=search&amp;searchFields%5B%5D=0&amp;searchFields%5B%5D=2&amp;PHPSESSID=cb342d00773ea7b59a5f6423d5f8c985&amp;ACT=quicksearch&amp;searchLogic=and&amp;searchContent=true&amp;wildcard=1&amp;searchType=as_families&amp;GROUP=&amp;DISPLAYC=full&amp;searchTerm=korean" rel="nofollow">Linotype</a> site (but they only have two weights of each face) and the <a href="http://www.monotypeimaging.com/ProductsServices/wt_fontsample.aspx?type=korean" rel="nofollow">Monotype</a> site (they don't sell their non-Latin fonts online, but they don't reply to the form they ask you to fill out, either!).</p>
    <p>Any tips on other foundries or distributors will be greatly appreciated.</p>
    <p>Thanks in advance!</p>
