      <p>As far as I know, Korean font vendor websites are not easy to use for those who don't speak Korean. So I'll just list a couple of major foundries and a selection of recommended fonts. I'm only listing the more traditional text faces, although if you are looking for a specific style then I could help you with that. All of these include Hangul, Hanja, and Western coverage (although I haven't checked for every single weight), and all are available in TrueType. I'm guessing most are available in OpenType as well.</p>
      <p>Sandoll - <a href="http://www.sandoll.co.kr/" title="http://www.sandoll.co.kr/">http://www.sandoll.co.kr/</a><br>
      Sandollmyeongjo(산돌명조) is the foundry's flagship serif-type face.<br>
      Jebi(제비) is a more modern serif-type face that I admire.<br>
      Sandollgodik(산돌고딕) is a sans-serif-type face.<br>
      Each of these comes in three weights.</p>
      <p>Yoon Design - <a href="http://yoonfont.co.kr/" title="http://yoonfont.co.kr/">http://yoonfont.co.kr/</a><br>
      The Yoonmyeongjo (윤명조; serif) and Yoongodik (윤고딕; sans serif) series come in an impressive array of weights and proportions. Yoonmyeonjo is probably the most used text face family in Korean publishing today because of its versatility.</p>
      <p>Asia Font - <a href="http://www.asiafont.com/" title="http://www.asiafont.com/">http://www.asiafont.com/</a><br>
      The Asia bonmunmyeongjo (Asia본문명조; serif) and Asia bonmungodik (Asia본문고딕; sans serif) families each offer six weights.</p>
      <p>SM Font - <a href="http://www.smfont.com/jikjisoft/html/font_sm.htm" title="http://www.smfont.com/jikjisoft/html/font_sm.htm">http://www.smfont.com/jikjisoft/html/font_sm.htm</a><br>
      The SM3 Font family includes 7 weights of serif faces and 6 weights of sans serif faces. I prefer the SM3 family over the SM2 family due to its better spacing and better Latin components. Both are included as part of the SM font package, and the website doesn't seem to sell each family separately.</p>
      <p><a href="http://www.bitinfor.co.kr/pdf/Adobe%20Bundle%20font.pdf" rel="nofollow">This PDF document</a> showcases the fonts that come bundled with the Korean edition of Adobe InDesign, which include most of the fonts I've mentioned.</p>
      <p>I can do more research if you need on the pricing and ordering.</p>
