    html: <p>Asvetic, I see a few choices based on specifics in the design. If you have one color, consider saving as a high res (600ppi) bitmap TIFF. As a bitmap (black and white) and not grayscale, the file will print razor sharp and, since its only 2 bit, will be very small file size wise (use lzw compression). Any user could specify a spot color for the image if needed. If you have more colors or gradients, consider PNG-24. It’s lossless, supports high resolution, has an 8 bit alpha channel, and most applications these days are loving it. Even PowerPoint and Word.  Be careful using a “Save for Web” option to create it though- tyically the res gets changed to 72-96ppi- which, if placed in Word” would look huge.</p>
