    html: |-
      <p>I do9 a lot of this kind of work and think you are probably already going the best way about it. We have a vast library of logos, and in each case save down large RGB GIFs with transparent backgrounds and JPEGs for MS Office alongside the CMYK EPS for Quark use. Making your GIFs very large minimises the appearance of the rough edge caused by GIF’s on/off transparency.</p>
      <p>Note though that print dimensions in inches are irrelevant in both JPG and GIF. </p>
      <p>You could use quite a few other formats on the MSO side but they all have pitfalls.</p>
      <p>As Nick says, WMF, which is the internal PC metaformat, can hold vector data but I find it unreliable at preserving anything more than simple line art, gradients and dashed lines for example can cause problems. This is the format usually used for vector clip art however.</p>
      <p>You can import and print EPS files into MSO apps, but I don’t think you can see a preview of their content on screen, at least not on PC?</p>
      <p>24 bit PNG has proper transparency support, but not in MSO apps.</p>
