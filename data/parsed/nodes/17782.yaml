    <p>I have a question about saving logos for use by “non-design types” in my office. I create alot of program oriented logos that later are used in paper proposals and power point presentations. I’ve never been quite sure I’m saving my logos in the best possible way to retain the quality no matter what size they end up using it at.  </p>
    <p>In practice I save 2 versions (outside of the AI and EPS versions I use.)<br>
    Under the Save for Web feature I save a JPEG version (usually very large like 8” X 10”) and a GIF (also very large, but with Transparency turned on to eliminate the white box)</p>
    <p>I’m sure there’s a better way, that I can save it to retain the vector quality of size doesn’t matter along with the transparent border and then allowing it to be “non-designer” friendly for programs such as Microsoft Word or Power point. </p>
    <p>I’d be very interested in hearing your thoughts on how wrong/right this process is.</p>
