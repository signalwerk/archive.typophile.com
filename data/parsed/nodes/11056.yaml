    html: <p>Department stores could probably eliminate shoplifting if they kept all their inventory in a vault and only let customers see pictures of merchandise. And yet they don't because they'd lose more business than the losses they'd eliminate. <br> <br>I think PDF specimens are a good idea. The risk of extraction is pretty small, especially since you end up with something less than the real font. Selling a font is <i>much </i>riskier. Once it's out in the world, anything can happen.</p>
