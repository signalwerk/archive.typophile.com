    date_raw: 25 Apr 2003 — 2:15pm
    votes: null
    html: <p>I'm sorry, I thought this thread was about PDF specimens. It appears to be about What Hrant Has To Say About Yanks. My mistake. <br> <br>One way of strengthening PDF security is to use Type-&gt;Create Outlines or similar. A cracker can still blow away time re-importing them into a font editor and adding the metrics on his own, but the amount of time needed to reconstruct such a font adequately will usually be worth more in an adequately skilled person's dollars than the cost of simply buying a license. The downside of Create Outlines is that there is no hinting. Supposedly the newer versions of Acrobat will anti-alias line art. I'll try making some comparisons this weekend or so.</p>
    html_clean: <p>I'm sorry, I thought this thread was about PDF specimens. It appears to be about What Hrant Has To Say About Yanks. My mistake. <br> <br>One way of strengthening PDF security is to use Type-&gt;Create Outlines or similar. A cracker can still blow away time re-importing them into a font editor and adding the metrics on his own, but the amount of time needed to reconstruct such a font adequately will usually be worth more in an adequately skilled person's dollars than the cost of simply buying a license. The downside of Create Outlines is that there is no hinting. Supposedly the newer versions of Acrobat will anti-alias line art. I'll try making some comparisons this weekend or so.</p>
  - id: 69889
    user: 1262
    date: 2003-04-25T13:56:00
    date_raw: 25 Apr 2003 — 1:56pm
    votes: null
    html: <p>PDF specimens are a lovely idea, but the security for embedded fonts is too weak for my liking. Extracted fonts lack hinting and kerning, so are probably too much trouble for people wanting to pirate text faces, but the opportunity to strip a display face from a PDF and, within a few minutes, have a working version with which to create a headline or web graphic is more temptation than I would like to put before a lot of people.</p>
    html_clean: <p>PDF specimens are a lovely idea, but the security for embedded fonts is too weak for my liking. Extracted fonts lack hinting and kerning, so are probably too much trouble for people wanting to pirate text faces, but the opportunity to strip a display face from a PDF and, within a few minutes, have a working version with which to create a headline or web graphic is more temptation than I would like to put before a lot of people.</p>
