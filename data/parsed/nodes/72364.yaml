  html: <p>I have a client that would like to use this font. The images supplied are really low res. I am having trouble discerning what it is. This was created in the 80's when stretching/compressing type wasn't that uncommon. I was hoping someone on hear might be able to help me identify this font. The capital "Y" rest on the baseline but looks like a descender of a lower case "y". Here is a link to view the type <a href="http://j.imagehost.org/0633/FB-TypeSample.jpg" title="http://j.imagehost.org/0633/FB-TypeSample.jpg">http://j.imagehost.org/0633/FB-TypeSample.jpg</a></p>
