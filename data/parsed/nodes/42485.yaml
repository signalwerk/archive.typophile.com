    html: <p>Moveble Type existed before the era of international standardization so specific agreed upon standards did not exist at the outset. Standards eventually came into being once printing became more widespread and foundries started to sell type but still varied amongst regions. Hence arcane names such as Brevier, Nonpareil, etc. did not necessarily translate from one place to the next.</p>
