    <p>Hello,</p>
    <p>I’m trying to find an answer to a question pertaining to movable type. I’ve looked all over the internet but I can’t seem to find a definitive answer, so I’m hoping someone here can help. The question is “What sizes were lead type available in?”. Any help would be greatly appreciated.</p>
    <p>Thanks,<br>
    Justin K.</p>
