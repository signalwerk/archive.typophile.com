      <p>The problem with a quiz of this type is that it focuses on the history of each typeface rather than on its effect with the anticipated audience for the project in hand. The question is whether a typeface evokes thoughts of Nazi Germany in the mind of the expected reader, not whether the typeface was used in Germany for Nazi publications.</p>
      <p>I'll give a slightly different example. I design and set publications for a Jewish organization. I wouldn't use a Fraktur typeface - even if Hitler thought it was a Jewish typeface - nor would I use a New Gothic type. This would apply even to a Fraktur typeface designed after 1945.</p>
      <p>On the other hand, the organization has no problem with Latin typefaces that were actually used for Nazi publications, or with Latin types by German designers who are old enough to have served in the military before 1945.</p>
      <p>There are other types that might evoke the wrong associations for this organization. I would be unlikely to use an Irish uncial type, because it would likely evoke thoughts of Ireland - unless, and this could occur, the organization were presenting a program on Jewish history in Ireland.</p>
