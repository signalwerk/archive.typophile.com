      <p>Yah, where's the Futura? I know for certain that I've seen at least a few Nazi posters using the typeface. Obviously, that one could be just as Nazi as, say, Tannenberg. Though I like Tannenburg, I've never quite found a use for it. Perhaps beer bottles or a German deli advertisements. I have, though, used other Gothics as companion faces to Roman, which works nicely.</p>
      <p>To be clear, I really never associated any Gothic faces with the Nazi regime, or Third Reich. Most of them evoke, for me and most others I know, a feel of the Middle Ages, or archaism. And the simpler, later German faces, such as Tannenburg, tend to remind people of Rock music and such things. Used in certain contexts they look German.</p>
      <p>Or perhaps in Europe there really are bad associations. Here in the States, I don't think that happens much.</p>
      <p>Next to a Swastika, Verdana even will look Nazi. Though a more 'German' (and period) typeface might cement such an idea.</p>
      <p>Briän</p>
      <p><strong>Edit:</strong> For the record, I'm American. Though, ethnically, I'm mostly German, with a bit of Russian and Polish.</p>
    html_clean: |-
      <p>Yah, where's the Futura? I know for certain that I've seen at least a few Nazi posters using the typeface. Obviously, that one could be just as Nazi as, say, Tannenberg. Though I like Tannenburg, I've never quite found a use for it. Perhaps beer bottles or a German deli advertisements. I have, though, used other Gothics as companion faces to Roman, which works nicely.</p>
      <p>To be clear, I really never associated any Gothic faces with the Nazi regime, or Third Reich. Most of them evoke, for me and most others I know, a feel of the Middle Ages, or archaism. And the simpler, later German faces, such as Tannenburg, tend to remind people of Rock music and such things. Used in certain contexts they look German.</p>
      <p>Or perhaps in Europe there really are bad associations. Here in the States, I don't think that happens much.</p>
      <p>Next to a Swastika, Verdana even will look Nazi. Though a more 'German' (and period) typeface might cement such an idea.</p>
      <p>Briän</p>
      <p><strong>Edit:</strong> For the record, I'm American. Though, ethnically, I'm mostly German, with a bit of Russian and Polish.</p>
