    <p>Inspired by another thread, opened by hrant, who asks for Tannenberg examples, I became involved in this still open discussion. I am german. Old fashioned german — konservativ and more ^^. So I wrote some emotional answers.</p>
    <p>What I saw is, what I learned the last years: There are lots of misunderstandings about german so called "New Gothic" fonts, Fraktur fonts and others. I am not Jesus. So I cannot change the world's thinking. But I can offer you a mirror. Look into it and see, that you as pro's or semi-pro's have to be careful to define what is Nazi font and what is not.</p>
    <p>I organized a litte quizz on my website. The text is written in german, so here are the rules. Here you can chose, what is Nazi and what is not.</p>
    <p>1. I scanned 11 famous sentences from The Big Bad Guy himself. Everyone in another famous font. Oh... that's not true... Ehm... I show 11 scans in diferent fonts, that's right. But only 6 of 11 are the original fonts. The other 5 of 11 fonts were edited by me electronically. I changed the font.</p>
    <p>Answer the next two questions.<br>
    The winner gets the original Graphic Magazine, I got the scans from. I'll send it for free wherever in the world you are living.</p>
    <p>So... good luck.<br>
    Click on the posted links 0000001 up to 0000011 - there was not enough space in the blog entry, so I had to upload it outside my blog. Its not so important to know all the 11 fonts. The pro's of course know it, the semi-pro's can concentrate themselves on the design of the fonts.</p>
    <p>1. Which six scans show the original 6 "Nazi fonts" from the magazine?<br>
    2. Which of the 5 other fonts would never ever been used in Nazi Germany for these ads?</p>
    <p>I let it open for one week or so... </p>
    <p>To say it with Jimi H.: Are you realy experienced, hrant? ^^</p>
    <p><a href="https://web.archive.org/web/20140809033235/http://www.bleisetzer.de/tagebuch/typo-raetsel-iv.html" class="link" rel="nofollow">"Nazi font" Quizz</a></p>
    <p>Georg</p>
