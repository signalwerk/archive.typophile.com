      <p>Yes, hrant, that's true, I know.<br>
      Sorry about that. It spent more time to scan and to made the changes to the five fakes, as I had. I am not experienced with Photoshop. I am just a little dealer of used letterpress stuff.</p>
      <p>Its 0:45 a.m. over here, I am just coming back from a meeting with some comrades. A little ceremony for the Day Of Re-Union With Middle Germany. A recitation about the history of Germany since 1945, we sang some songs and our national hymne with all strophes(?) (only the third one is the official hymne of this what is called BRD today. The others are not forbidden, but... well... there is a kind of social pressure not to sing it in public. You know what I mean.). Now I undress my parachutist boots - its very uncomforable to wear it in my age of 54 years, argghh. I don't know, who set up this trend for us national germans. Now I have to brush my teeth and to polish my bald head, before I go to bed.</p>
      <p>I found a picture of you anywhere in the WWW. Was your family coming from south of Europe? That's me: <a href="https://web.archive.org/web/20140809033235/http://www.bleisetzer.de/hintergrund.html" title="http://www.bleisetzer.de/hintergrund.html">http://www.bleisetzer.de/hintergrund.html</a> German since I don't know... father's family lived as a german minority since three generations in Galicia, Poland further on, today Ukraine. From 1936 they lived in Warsaw where my father, his brother and his sister visited a kind of "high school". I don't know the exakt term in english. They left Galicia because this was a very poor part of the country. My grandfather was there since 1916 as a volunteer of Austrian Army. (Austrians and Germans are the same people. They decided to union rest of Austria and Germany after 1918, but the allies did not allow it). In Warsaw after General Pilsudski, who ruled Poland, died in 1935, the situation became very hard for the german minority. Lots of them very set under pressure, hit or killed. So my family saw it to become freedem, when the german Wehrmacht overtook Warsaw end of September 1939. My father and his brother went as volunteers to Wehrmacht and both fought in Charkow and Kursk/Orel. My father was wounded very hard and they flew him out - he was member of special forces, I do not want to say the name of these combats. Under all soldiers of the world, these german troops were seen as an elite. After the war, he could not go back to... well.. to where? He lost his homeland, there was Poland now, but he was german. His sister fought in the war, too. She joined the communist partizans. Funny, mh? She lived in West Poland, what is East Germany. I have a cousin, he's 48 yo or so... We love each others like brothers do. And we communicate in our poor english. I cannot speak polish, he cannot speak german. He is a judge and is very interested in polish history. Sometimes he sends me very old text to translate it into english. This are german texts from the year 1200. So old, I cannot understand it, but I found a guy from University in Hamburg, who helps. My cousin calls it polish history, but its in german.. Funny, too, mh? I hate this f... Hitler. He made dirty everything what someone like me loves... And this, sometimes, makes me very very sad. </p>
      <p>Sry for bothering.</p>
      <p>Georg<br>
      _______________________________________________<br>
      „Ich bin ein Preuße, kennt Ihr meine Farben...“</p>
