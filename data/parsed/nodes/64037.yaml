      <p>Huh? Southern Europe?! I guess you don't know about the "ian" last-name suffix. Dunno, maybe I should say something romantically head-strong, like "Hey, I've been Armenian for over 3000 years!" Or: "My people had a Golden Age when yours were living in trees!" The truth is, I don't consider myself "pure" Armenian, even though I don't know of any ancestors of mine that were "non-Armenian". I've lived in Barcelona for 6 months, so maybe I'm ~1% Catalan? It feels more like 10%. And I've live in LA since 1986 (except for those 6 months - well, plus another 3 in Armenia) so what am I? LA isn't <em>really</em> American... Before that I grew up in Beirut. So what am I, a terrorist? Well, maybe just a little bit. You see, nothing is pure anything. Not type, not people.</p>
      <p>And scientific field-testing of an idea requires a lot more than passion.</p>
      <p>hhp</p>
