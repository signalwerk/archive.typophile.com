    <p>Hello everybody. <br> <br>Maito Recordings is an upcoming <br>on-line based music label, which <br>releases music free, downloadable <br>directly from our main website. <br>The Maito Recordings focuses in <br>experimental sound landscapes and <br>ambient music, electronic and acous- <br>tic. <br> <br>(note: the word "maito" is finnish <br>and means milk) <br> <br>Having some hint on graphic design, <br>I decided to try out and make the <br>logo all by myself. <br> <br>The emblem resembles a milk stain, <br>from a glass of milk, which somehow <br>tries to represent the idea of aeste- <br>thics in chaos and randomness. The <br>way the music is created (ambient, <br>noise, drones etc.) what i've <br>discovered, is quite often based on <br>randomness. Well.. that's the basic <br>idea behind the emblem. <br> <br></p>
