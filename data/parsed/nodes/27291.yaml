      <p>Good question. Easy answer is that it all depends on the type. It is interesting to see some actual text set that mixes ital and book etc. I like to see what the type designers intend as far as usage. Max size, minimum size, but also stretch the possibilities. Maybe a book face can work for headings up to a point, but what is that point where it begins to look to heavy or show too much. If you can show a face used well, and also hint at the limits of its use, that to me is very helpful.</p>
      <p>I also find the descriptive texts on Storm's pages to be very interesting.</p>
      <p>What a fun project.</p>
