      <p>Having read about Bram de Does and the extreme specificity of his design &amp; intent is probably playing a role in my thinking/observation too. </p>
      <p>Here is a link to that thread if you like:</p>
      <p><a href="http://typophile.com/node/32938" title="http://typophile.com/node/32938">http://typophile.com/node/32938</a></p>
      <p><cite> I do like putting a lot of subtle details in the designs that only reveal themselves in larger sizes, but that doesn’t seem to interfere with their functioning in text applications. </cite></p>
      <p>I see that that is quite true - from the print on the inside cover. Although to different degrees of course depending on the face. Clearly I overstated or oversimplified what I meant to say. While it is true that I probably wouldn't set a book in any of these faces - I would be more than pleased to set a magazine or article in one. So again to clarify I think what I was getting at is that there is a lively quality, and an optimism and a can-do feeling to all the faces (even in Rawlinson &amp; Alfon) which in larger sizes is more apparent. These qualities attract my eye and makes me think 'Headline'. </p>
      <p>But re-reading what you wrote makes me wonder. Are you at all interested in expanding these families into optically optimised versions as well or are you content to design for excellent cross-size compatibility? I also imagine that optical specific design might be reserved for custom work.</p>
      <p><cite>... the lesser definition of the screen dilutes both specific letterform features and the character of the design. </cite></p>
      <p>Yes. I had already seen the ways in which screen oriented type was at a disadvantage in print before but recently I have been especially taken with the way that print oriented type can suffer from the screen.</p>
      <p>What it makes me realize is that for a foundry that is oriented to selling to the general public or to designers (rather than to custom type/print clients), it really does behoove them to bend to the screen, in part because the fonts will probably be seen there first before they are bought and in part because use in that context is pretty likely as well. But this also means that print oriented type might benefit from marketing that encourages/educates a prospective buyer to evaluate the font more relevant ways. </p>
      <p><cite>I can never judge type on screen that is meant for print.</cite></p>
      <p>Yes. Clearly! And more &amp; more Clearly. </p>
      <p>Thank you, James. And if there is anything else you want to add. I am all ears!</p>
