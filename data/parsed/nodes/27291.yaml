    html: |-
      <p>Eben,</p>
      <p>I am in the midst of an optically adjusted family of fonts based on some of the work I did for the Mens Vogue modern, which was so fragile that it had to be adjusted for a more normal range of work. </p>
      <p>That said, I have always preferred to try and create something that worked in a cross-size way. Most of the work I do I proof at text sizes for much of the development process, and I'm happy with the way it functions in bothe text and display sizes</p>
      <p>The issue I have with optically-sized font families, is it is an awful lot of work for what looks to be a very small pay-off. Most type users are not as sophisticated as those here on typophile, and I have seen way too many examples of optically-sized type being used in the most outrageous ways. Does it make sense for a small type studio to spend that much development time on a range of products that most likely will not be used, or used incorrectly. I still don't have a good answer for that.</p>
      <p>One of the last magazine jobs I did involved redesigning a title that was using Minion 72 as their text type (9.5/11). WHen I asked the art director why this was the case, she said her and her boss just loved the way Minion look in the samples they saw (display I;m sure) and decided to use it as the text face. It didn't bother them that it looked fragile and sparkled in a way that made it uncomfortable to read. They also had the habit of negatively tracking it as a way of killing widows. (My redesign put a stop to all of that)</p>
      <p>As to bending towards the screen, hopefully the screen will improve before my back breaks.</p>
      <p>James</p>
