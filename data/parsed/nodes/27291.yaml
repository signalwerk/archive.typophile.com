      <p>I just got it the catalog. I really like it! I am finding the type designs are very attrative but also oddly challenging in a way I am working to understand better. Maybe it's because they are display oriented &amp; I have been in a text mindset for the last 3 months... </p>
      <p>I really enjoyed seening the type in use. They eloquently show many things that the sample pages can't. On the sample pages the layouts where the text is presented larger on one line &amp; then smaller underneath seem the most useful and attractive to me. </p>
      <p>The quibble I have re: the smaple pages is that I would like there to be a bit more bounding space around the sample pages. I find that they have a slightly breathless quality because of their tight fit.</p>
      <p>To me the most striking thing about seeing the catalog was that somehow the best qualities of James' fonts seem lend themselves especially to print. Conversely it seems like these same qualities are unfairly not nearly as apparent on screen.  </p>
      <p>I wonder if this is because he is designing with print in mind to begin with, maybe it's the impact of his high rez proofing device, or perhaps it has to do with the fundamental nature of qualities in type that interest him. </p>
      <p>Certainly plenty of type I have seen on screen &amp; then printed for a better look has ended up feeling a bit 'punchier' than I would like in print. Whereas it was that punchiness that made it seem interesting or lively on screen.</p>
      <p>Does anybody else see what I mean or am I the only one? </p>
      <p>James, what do you think?</p>
