      <p>Did anyone above (I only skimmed) mention the need for block setting in different sizes? Choosing text for a book (and other things as well) requires a selection of text set in various sizes so color and feel can be judged effectively. 8/10, 9/10 or 11, 10/12, etc. You don't need to do all combinations but the ones that seem suitable for the style of type.</p>
      <p>(Of course, for display only fonts, this would not be needed.) For that type of thing I really like the display pages that Adobe and other publishers include in their type books.)</p>
