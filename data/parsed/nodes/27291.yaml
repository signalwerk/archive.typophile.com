      <p>This is a very timely question for me. All your replies are appreciated. List of languages = terrific! Now that OpenType is upon us, it's no longer a simple matter to understand what a given charset offers: Pro might mean different things from different foundries. </p>
      <p>OpenType format doesn't guarantee the presence of any particular glyphs. Therefore, discuss/show what glyphs are included in the various formats offered. </p>
      <p>That brings up a question: What formats to offer? If there's a huge glyph set and lots of features in the OT version, do people feel compelled to make all those glyphs available in separate fonts in the PS or TT versions? Or should we be pushing people toward OT by making them available only in OT fonts? </p>
      <p>I'm most informed by real-world uses of the various cuts. Show real text in the text weights, show signs, packaging, layouts in the display weights. House Industries recent United specimen shows packaging, magazine layouts, etc. and it's very useful to see the type integrated in its context. </p>
      <p>I hope Norbert will weigh in.</p>
    html_clean: |-
