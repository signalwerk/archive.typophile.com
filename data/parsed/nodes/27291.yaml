      <p>I am glad you are thinking about this James. In this day and age, there are few printed specimens to be found. </p>
      <p>For text faces, I like to see a column of text in the target text sizes as well as some semi-display usage.  I also like to see some italic and bold mixed in to the text to see how it fits with the roman.<br>
      Display faces  need more "in use" kinds of stuff. For ads show ads, For signage, show signs...<br>
      For the character set, I would like to see at least one glyph showing with each diacritc.  I mean if you show a u umlaut, you don't need to show every other umlaut used.  I would also want to see a list of languages the font can be set in.<br>
      Sometimes, when talking with a clent about type, I like to show them samples.  This is where a good speciman can work as a sales tool. If I am trying to convince a client to purchase a font, it helps to have some really beautiful printed stuff to use as a way to visualize it.</p>
      <p>ChrisL</p>
