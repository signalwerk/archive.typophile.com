    html: <p>Caution needs to be exercised with the full character set showings. Too often type catalogs are full character sets only and the families seem to flatten in the process. There are no details, spikes, memorable moments or... surprises. The sets need to be shown in entirety but it is only a fraction of the final product. I don't want to be blown away, but after shaking hands with a font, I'd like to ask it more than one question.</p>
