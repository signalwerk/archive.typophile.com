      <p>Eben,<br>
      I can never judge type on screen that is meant for print. It just does not show what is there. Since I very rarely do anything for screen only, I tend to think print first. Even my 600dpi laser (fake rezed to 1200) is only an indication. This matters more for small type certainly but even large type never gets the true crisp feeling that real 2400dpi delivers. That is why a good speciman sheet is so valuable. The hard part is that the expense of producing and shipping is so much more than just posting a PDF that most type vendors don't bother any more. I hate to talk about the old days but there was a time when my mailbox got filled with well printed samples of type. The downside was that there were far fewer faces and typesetting was quite costly compared with today's bargain prices.</p>
      <p>ChrisL</p>
