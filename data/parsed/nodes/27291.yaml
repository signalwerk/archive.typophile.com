      <p>Character Sets. Always show full (or nearly full) character sets. Before our FontFont PDFs we'd get complaints that folks didn't know the ampersand would look like <em>that</em>!</p>
      <p><a href="http://www.flickr.com/photos/stewf/199974971/" rel="nofollow">Examples of the font in use</a> on physical objects -- preferably 3D and photographed -- always lend the typeface some credibility. The buyer can imagine it actually doing a real job.</p>
      <p><a href="http://flickr.com/groups/type_specimen/pool/" rel="nofollow">Here are some specimens, old and new, for inspiration.</a></p>
