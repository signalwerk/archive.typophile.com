      <p>An overview of allowed use. Since EULAs differ from foundry to foundry, perhaps even between individual fonts, the confusion is great as to which restrictions of use apply in a particular case. Like one would want an overview of all the languages for which the font can be used, a similar overview (be it brief, using pictograms or so) of the license characteristics would be useful: "printed material only | pdf embedding allowed | modifying allowed" &amp;c.</p>
      <p>Also, an indication of price would be interesting; like paper suppliers do in their specimens, one could rate a font license (e.g. 1–5 users) on a scale from €/$ &lt;25,- (cheap) to €/$ &gt;2.000,- (expensive).</p>
