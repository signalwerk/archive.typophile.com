      <p>I'm glad you liked the catalog Eben,</p>
      <p>I do design with print in mind, specifically publications since I spent most of the first 12 years of my career in magazines. </p>
      <p>As to the types being for display, I guess the catalog does show them in a display setting, but they also work well in text. I do like putting a lot of subtle details in the designs that only reveal themselves in larger sizes, but that doesn't seem to interfere with their functioning in text applications. </p>
      <p>The next catalog, due in September, will be very text oriented. </p>
      <p>As to the tight space on the showings page, perhaps we could have been more generous with the white space in a larger format, but for this one breathless will have to do.</p>
      <p>James</p>
