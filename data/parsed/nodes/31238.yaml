    <p>Looking to find the correct keystroke/image of reference for a trilled "r" commonly seen in Spanish. For example the word for red in spanish is rojo. The "r" is rolled. How would this appear in an American dictionary in pronunciation context.</p>
    <p>I am trying to sound out my name... Rajeswaran Shanmugasundaram</p>
