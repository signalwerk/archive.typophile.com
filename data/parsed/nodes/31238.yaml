      <p>I finally found this again -- I was fascinated to find that some Latin American type designers have taken it upon themselves to create ch, rr, and ll ligatures to reflect the fact that these are considered separate letters in Spanish (although, to my understanding, ch is now two letters according to the RAE). Cristian Gonzalez's Origen uses all of these, plus a ck ligature (image from a "seleccion_typecon" PDF I have on my computer, maybe from the Letras Latinas website). I'd find it difficult to read the rr ligature in text, but maybe this is a mildly common thing in Spanish writing to do. Just thought this was a cool thing to bring up -- I don't have much to say about phonetics.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/OrigenLigs_5660.jpg"></div><p></p>
