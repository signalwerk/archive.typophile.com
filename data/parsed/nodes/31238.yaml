      <p>I came across this thread from Eben's link on another thread.  The LL ligature is something I've seen a little more often, but haven't really seen anything standard for the ll.  Ch and ch seems to be getting a little more usage in Spanish typography.  The rr ligature I've never seen before, and certainly isn't used in handwriting (but then again, neither is the Ch or ll).  </p>
      <p>The symbol commonly used in American dictionaries for a alveolar trill is either r-acute or r-macron, depending on style.  In IPA, an alveolar trill is a standard r, whilst an alveolar flap is an r without a full termination on the loop.</p>
      <p>Also, rojo is pronounced with a full alveolar trill.  All <em>r</em>'s at the beginning or end of a word, or following certain phonemes are realised as trills.  Incidentally, with the exception of Indian or Scottish English, an phonetic transcription of English would never have either types of r (words like, well, <em>word</em> actually have a an alveolar or retroflex approximates, which are represented by an r-turned or an r-turned-hooked.  </p>
      <p>And cuttlefish, in some dialects of Spanish (Rioplatense) it can be realised as a uvular trill (just as in some Caribbean or Mexican dialects it can be realised as in English).  But the so-called "standard Spanish" it's an alveolar trill.</p>
      <p><em>«El futuro es una línea tan fina que apenas nos damos cuenta de pintarla nosotros mismos». (La Luz Oscura, por Javier Guerrero)</em></p>
