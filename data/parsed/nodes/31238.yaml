      <p>It’s just a plain <strong>r</strong>… as far as I’m aware. It’s called an <strong>alveolar trill</strong>.</p>
      <p>The <em>r</em> in “rojo” isn’t rolled, it’s the <em>rr</em> sound in “perro” you’re after.</p>
