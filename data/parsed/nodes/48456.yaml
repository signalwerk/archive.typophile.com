      <p>Uli,</p>
      <p>I'm not sure I understand your logic.  I would imagine that many of the people here who design fonts for Latin, Greek, and Cyrillic are not trilingual, and are doing, as Paul said above, "more work in the forms of research and study" for the alphabets for languages they don't speak.<br>
      How is my case any different?<br>
      I don't consider it a "waste of time" to learn Tamil; I would like nothing more than to be fluent in it, but at the stage of life I'm in right now, that massive of a time commitment doesn't fit in with what else I want to do (mainly, design type).<br>
      As I also said, I will change the name to a non-loan word; you'll notice if you re-read my first post that I never set this name in stone.  I had originally considered naming this face Kallai (is that a loan word?), but decided against it because I read that it can have a negative connotation.</p>
