      <p>Ria<br>
      Please ignore Uli. One can certainly design a typeface for a language that you don't read. It takes the same kinds of skills that it takes for designing a Latin typeface. But because we (that's a general we) aren't familiar with scripts we don't read, we must do more work in the forms of research and study, looking at things like character proportions and examining what the essential characteristics of each glyph are. To really judge any typeface design, you really need to see it set in text and not only as separate glyphs. You might try stealing an article from wikipedia, setting it, and removing any non defined characters. Although this results in something that is utter garbage from a text point of view, the idea is that it at least <em>looks like</em> text enough to start being able to judge how the characters are working together. It would be helpful to see someting in all tamil and something in a mixed script setting. If you can do that, perhaps someone can make some useful suggestions for you.</p>
