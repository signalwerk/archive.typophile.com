      <p><cite>Please be brutally honest! (I don’t speak Tamil, unfortunately)</cite></p>
      <p>In order to examine, whether a text typeset in a new font is readable, it is necessary that the designer is able to read texts typeset in this font. Since you don't speak Tamil, I guess that you are also illiterate as far as written Tamil texts are concerned, e.g. Tamil newspapers, books, etc.</p>
      <p>So, to be brutally honest, as requested by you, I suggest that you refrain from designing fonts for texts which you cannot read.</p>
      <p>As regards "Jatiya", this is a non-Tamil loanword. A name for a Tamil font should use an original Tamil word, not a non-Dravidian loanword.</p>
