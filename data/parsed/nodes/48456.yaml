    <p>Greetings!</p>
    <p>I would love to get some critique on this typeface that I'm working on, tentatively named Jatiya*.  A bit about my intent:<br>
    Jatiya is meant to be a <a href="/wiki/Tamil" class="freelinking" rel="nofollow">Tamil</a> typeface designed as a companion to the Latin/Greek/Cyrillic typeface <a href="/wiki/Gentium" class="freelinking" rel="nofollow">Gentium</a>, by <a href="/wiki/Victor%20Gaultney" class="freelinking" rel="nofollow">Victor Gaultney</a>.  I'd like for it to mesh well with the look of Gentium, so that it looks good typeset side-by-side or in a setting like a dual-language dictionary.  Ideally, I'd like for it to be a strong stand-alone text typeface as well.<br>
    So far I've designed most of the basic consonants and vowels, but I have yet to start on the myriad conjuncts and ligatures, or the numbers and symbols.  However, before I complete the character set I'd like to make sure that the design characteristics I've implimented so far are working.</p>
    <p>I have very little experience designing type, so I'd like critique on anything you notice, but I'm especially interested in a few things:<br>
    - How well the Tamil is working with Gentium;<br>
    - if the terminals (which are the same terminals used in Gentium) work with the Tamil glyphs;<br>
    - and if the curves and shapes are aesthetically pleasing.</p>
    <p>Please be brutally honest!  I'm interested in learning as much as I can.</p>
    <p>Thanks so much!</p>
    <p>-Ria</p>
    <p>* Jatiya, as far as I can tell (I don't speak Tamil, unfortunately), means "national," which is the closest translation I can find to match with Gentium's meaning, "of the nations."</p>
