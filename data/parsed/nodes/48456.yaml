      <p>Ria,</p>
      <p>I liked your typeface overall. </p>
      <p>Some personal thoughts:<br>
      \ The headline of your Tamil typeface at the moment is aligned to the x-height, what if someone set the type with all caps? Wouldnt your Tamil look too small then? Also, your tamil characters look a little dense compared to the Latin. You should set two separate paragraphs along side and check whether the greys of the text blocks are even or not.<br>
      \ Some of your characters are a little narrower I think (e.g. - "ii", "rra", vowel sign "aa", "ra") and some of which are a bit wider( e.g. - "pa", "u").<br>
      \ The descenders are too small.<br>
      \ Vowel "Ai" is too big?<br>
      \ The final stroke of the Letter "ka" should not connect to the body.<br>
      \ The endings of the top horizontal stroke of the letters like "ka", "ta", "na" should be consistent throughout.<br>
      \ In your paragraphs, the dot(pulli) is misplaced all over. It should come exactly in the center(visually) of the character.<br>
      \ Also the vowel sign "i"  and "ii" should connect properly with the consonant. ( You might need to create some separate ligatures for these combinations)<br>
      \ The curves are not smooth and consistent throughout, there are lot of places where they are taking a sudden change.</p>
      <p> Its a great design and I would love to see this along with some ligatures in a proper text set next to the Latin.</p>
      <p>All the best.</p>
