      <p><cite>because designing face without -potential- users (and readers), that doesn’t make really sense. </cite></p>
      <p>Eh yes and no.  It doesn't make economic sense perhaps, but I doubt most of us who work in Latin script would consider our first Cyrillic or Greek attempts very good.  It's a learning experience and one that's a lot longer I would think the farther removed the script is from our native ones.  Besides, in the end you never know who might want to buy your font.</p>
      <p><em>«El futuro es una línea tan fina que apenas nos damos cuenta de pintarla nosotros mismos». (La Luz Oscura, por Javier Guerrero)</em></p>
