    html: |-
      <p>Yikes.</p>
      <p>To start; this font is NOT a ripoff; I drew all the curves by hand, I didn't trace over any other font, and I most certainly did not just tack serifs onto a pre-existing font.  Literally the only parts of the face that I didn't draw are the terminals; I took them from Gentium (which, AFAIK, is permissable under its license), and that was not with intent to steal; it was so that the two faces would share some visual unity.</p>
      <p>Xavier, could you possibly post an image of what the typeface used in the local newspapers looks like?</p>
      <p>I'm not sure how I can prove that this is my original creation, but if it would help, I can list the typefaces that I looked at when familiarizing myself with the script.  I looked at them not to copy them, but to learn some acceptable deviations of the shapes, where the stroke contrast fell, character widths, etc.  At no time did I just copy a shape from one of them; I looked at many, saw how that character related to others in that typeface, then tried to design a character that would fit in with the appearance of mine.  The fonts I looked at are:<br>
      Frida Tamil<br>
      Monotype Tamil 580<br>
      Latha<br>
      Anamika<br>
      Rajraja<br>
      Nandini<br>
      Dharini<br>
      Premnath<br>
      and the numerous fonts shown in this catalog: <a href="http://www.modular-infotech.com/downloads/fonts/tamuniv.pdf" title="http://www.modular-infotech.com/downloads/fonts/tamuniv.pdf">http://www.modular-infotech.com/downloads/fonts/tamuniv.pdf</a></p>
      <p>I also looked through the Indic Scripts pool on Flickr, at the pictures of hand-painted Tamil signs.</p>
      <p>With all that being said... I'm troubled that my face looks so similar to a pre-existing one.  I'd really like to see HOW similar it is so I can determine whether I should still try to finish it or if I should try to design something more unique.</p>
      <p>Xavier; I chose to try to design a Tamil typeface because I think the script is beautiful.</p>
      <p>And with all that being said; I'd still like some critique of my design, if people can trust that it's my design and not a copy.</p>
      <p>Thanks for your time,<br>
      -Ria</p>
