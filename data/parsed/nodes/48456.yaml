      <p>I've put together a PDF with a paragraph of typeset Tamil, one of Tamil mixed with a few lorem ipsums, and one mostly latin with just a few Tamil words: <a href="http://people.cca.edu/randerson2/jatiya_text_samples.pdf" title="http://people.cca.edu/randerson2/jatiya_text_samples.pdf">http://people.cca.edu/randerson2/jatiya_text_samples.pdf</a></p>
      <p>Uli; I quite agree that, assuming I finish this, it shouldn't be named with a loan-word.  I'm open to naming suggestions if you have any; otherwise, I'll keep looking.</p>
      <p>Thanks again,<br>
      Ria</p>
