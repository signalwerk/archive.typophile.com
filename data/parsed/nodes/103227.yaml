    <p>Sansational is a brand new release from Type Innovations.</p>
    <p>If you are one of the first 50 people to login:</p>
    <p><a href="https://www.fontspring.com/fonts/type-innovations/sansational" title="https://www.fontspring.com/fonts/type-innovations/sansational">https://www.fontspring.com/fonts/type-innovations/sansational</a></p>
    <p>click on the "heart" symbol, top upper right hand side... to favorite us, or like us...</p>
    <p>and send us an email to tell us why you like this font...</p>
    <p>mail to: <a href="mailto:akaczun@verizon.net">akaczun@verizon.net</a></p>
    <p>we will send you the entire new font family release (6-font) package absolutely free.</p>
    <p>But, be quick... only 50 complete font family packages will be given away.</p>
    <p>And, if you have a moment... check out all of our other great font offerings.</p>
    <p><a href="https://www.fontspring.com/foundry/type-innovations" title="https://www.fontspring.com/foundry/type-innovations">https://www.fontspring.com/foundry/type-innovations</a></p>
    <p>Thank you and we hope you like our fonts.</p>
    <p>TYPE INNOVATIONS</p>
