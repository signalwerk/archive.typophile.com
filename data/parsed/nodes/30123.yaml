      <p>Mike Y's guide has this listed as Fulton Sign Script (aka Ebor Script aka Sweden aka Sedona Script). <a href="http://www.fonts.com/findfonts/detail.htm?pid=418095" target="_blank">Ebor Script</a> can be found here, although the 'p' looks slightly different.</p>
