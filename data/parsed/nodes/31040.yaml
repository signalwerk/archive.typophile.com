      <p>The "RA" overlap bugs me, but otherwise this is really cool. I'm not sure how I feel about the 'S' - it might need to be looked at, but it fits the general vibe of the logo. Also, the bottom of the 'U' could be a little bit thicker, but I'd have to see it that way.</p>
      <p>As for kerning, "UN" in "UNITED" seems closer than the rest of "UNITED", so I'd tighten up "NITED" a bit. Also in "BRAZILIAN", "IL" could be tightened, as well as "JIU". As I've said before, I'm no kerning expert,  so someone else could probably help you more.</p>
      <p>Good job, and I'm looking forward to seeing this progress.</p>
      <p> - Lex</p>
