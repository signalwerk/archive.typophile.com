    <div class="info">Submitted by <a href="/user/7006" title="View user profile.">paul d hunt</a> : 14.Mar.2006 8.05am </div>
      <p>Lots of exciting things happening at Chank.com this year!<br>
    Thought you might appreciate an update.</p>
    <p>MARCH WILDCAT FUNDRAISER<br>
    For the month of March, I’m donating 10% of all Chank.com font sales to The Wildcat Sanctuary, a no-kill sanctuary, committed to providing permanent homes for captive wildcats. Now is a great time to join our Font of the Month Club with a shopping visit of $99 or more — many fonts are on sale and you’re contributing to a good cause. Help offer sanctuary to another unwanted, mistreated or neglected tiger, cougar, lynx, or bobcat with your purchase of Chank Fonts here:<br>
    <a href="http://www.chank.com/fonts_all.php" title="http://www.chank.com/fonts_all.php">http://www.chank.com/fonts_all.php</a></p>
    <p>NEW COOL FONT RELEASES<br>
    Dinkle, a set of handwriting fonts by a professional artist:<br>
    <a href="http://www.chank.com/font_detail.php?sku=5574" title="http://www.chank.com/font_detail.php?sku=5574">http://www.chank.com/font_detail.php?sku=5574</a></p>
    <p>Chippewa Falls, a swashy old-fashioned retro display font:<br>
    <a href="http://www.chank.com/font_detail.php?sku=5569" title="http://www.chank.com/font_detail.php?sku=5569">http://www.chank.com/font_detail.php?sku=5569</a></p>
    <p>Greatest Hits Fontpak, new OpenType versions of my most popular fonts:<br>
    <a href="http://www.chank.com/font_detail.php?sku=5567" title="http://www.chank.com/font_detail.php?sku=5567">http://www.chank.com/font_detail.php?sku=5567</a></p>
    <p>FREE FONT: WUNDERBACH!<br>
    It’s been a while since I’ve been impressed by a submission to our Free Font archive. So the flow has been a bit slow. But this month I’m happy to introduce a new Free Font from a friend in France. It’s graffiti. It’s stencil. It’s European. Pick it up here:<br>
    <a href="http://www.chank.com/freefont_detail.php?sku=1096" title="http://www.chank.com/freefont_detail.php?sku=1096">http://www.chank.com/freefont_detail.php?sku=1096</a></p>
    <p>HOW NOW?<br>
    I’m so excited to be a guest speaker at the HOW Design Conference this year. My presentations are sponsored by Extensis, who can help with font management solutions. Best of all, the conference is happenin’ in Vegas. Hubba hubba. Sign up for Early Bird rates now...<br>
    <a href="http://www.howconference.com/" title="http://www.howconference.com/">http://www.howconference.com/</a></p>
