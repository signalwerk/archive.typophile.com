    html: |-
      <p>Hi Bob, indeed it is a cool book design. I suspect this might have been a creation made by manipulating Futura during the photolettering era. The basic letter proportions are close to Futura. The letters might not have made it into any of the specimen books. If I understand correctly, a lot of this stuff was churned out as custom work for individual buyers, like book companies.<br>
      Don</p>
