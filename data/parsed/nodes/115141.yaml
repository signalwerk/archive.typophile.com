      <p>Many thanks Renko. These letters seem so distinctive, and given the lack of response from our ace font detectives, seem to not exist as a digital font. I am tempted to make a font based on this limited set of letters and any hints I can get. Your suggestion of Renner's Futura Black of 1929 and Woolley's Braggadocio of 1930 as possible inspirations for this design is very helpful. The G in Braggadocio is really close, but other letters have a very different treatment.<br>
      I wonder what else might exist?<br>
      Don</p>
