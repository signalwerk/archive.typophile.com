    <p>José Ortega y Gasset - Der Aufstand der Massen [The Revolt of the Masses], originally published in 1930 as  La rebelión de las masas. I don't know when this cover was designed, other than it seems to have beeen some time between the 1930s and the 1980s.<br>
    Looks sort of familiar but I can't place it.<br>
    Any suggestions? Thanks.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/Aufstand_5800.jpg"></div><br>
    Don<p></p>
