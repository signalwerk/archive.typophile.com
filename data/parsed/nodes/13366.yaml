      <p><em>Not an actual dingbat font, but a ’trendy’ new collection of heraldic elements</em>.: ’<a href="http://youworkforthem.com/product.php?sku=E0043" target="_blank">Legion 01</a>’, ’<a href="http://youworkforthem.com/product.php?sku=E0044" target="_blank">Legion 02</a>’, ’<a href="http://youworkforthem.com/product.php?sku=E0045" target="_blank">Legion 03</a>’, ’<a href="http://youworkforthem.com/product.php?sku=E0082" target="_blank">Legion 04</a>’, ’<a href="http://youworkforthem.com/product.php?sku=E0083" target="_blank">Legion 05</a>’ + ’<a href="http://youworkforthem.com/product.php?sku=E0088" target="_blank">Legion 06</a>’ <em>( Stock Art )</em>, <em>by Joshua Smith / Hydro74, available from YouWorkForThem</em>..</p>
      <p><em>Or</em> ’<a href="http://www.myfonts.com/fonts/altemus/shields/" target="_blank">Shields</a>’, <em>by Robert Altemus, or</em>, ’<a href="http://www.myfonts.com/fonts/kennmunk/wappenbee/" target="_blank">Wappenbee</a>’, <em>by fellow Typophile Kenn Munk, maybe</em>.? :)<br>
      <em>( And theres even ’<a href="http://www.heraldryclipart.com" target="_blank">Heraldry Clipart</a>’.. :)</em></p>
