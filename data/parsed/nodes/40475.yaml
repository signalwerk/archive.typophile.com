    <p>Hello! After years I have picked up the type-setting skill again. The last years I have mainly concentrated on making Flash-based creations. Only this year I wanted to practice Indesign CS3 (learned working with Quark 4) by typesetting our yearly news-flash (family stories about 2007). Now I only happen to have some questions:</p>
    <ol>
    <li>Now I have set the paragraph first line indent property to 1p5. Only how can I cancel out this setting for the first paragraphs on the pages?</li>
    <li>Are there any rules regarding punctation in (sub)headers? Do these punctuations have to be aligned with the body text somehow?</li>
    </ol>
    <p>p.s. I am not convinced it's in the correct category, if not. Please let me know!</p>
    <p>(The document was set in the Scala family 11/13p in a four-grid system in two columns with 1.5 inch margin)</p>
