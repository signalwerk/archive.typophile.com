      <p>Hello Weyert,</p>
      <p><cite>Only how can I cancel out this setting for the first paragraphs on the pages?</cite><br>
      Create another paragraph style (with properties based on your regular one, except the indent).<br>
      There you can also specify which paragraph style is next.<br>
      Then, you can select all of your text, right-click on your ‘first paragraph style’ and select ‘apply this paragraph style and then the next one(s)’ [sorry, I don’t know how they named it in English or Dutch].</p>
      <p>That’s the CS2 way; I don’t know if there’s something new in 3 …<br>
      F</p>
