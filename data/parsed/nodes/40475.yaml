      <p>I'm talking book work here.</p>
      <p>The beauty of the 'Anglo' way is that it produces a more even colour on the page. An em dash, irregardless of the spacing, leaves a bullet hole through the page, and if there are more than two or three per page, can impact the even colour that we try to achieve with small capitals, old style numerals, and titling fonts for headings.</p>
