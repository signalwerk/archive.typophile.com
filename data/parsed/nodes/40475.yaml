      <p><cite>I have learned that it should be em bash followed by a hair space.</cite></p>
      <p>Yes, or alternatively an ndash with word spaces. I’ve been told former was the traditional Anglo-American way, latter was more common in Europe … In the end, it depends on your taste <strong>and</strong> the typeface in question: some fonts have a ridiculously short ndash that makes it unusable for parentheses, others show a very long mdash that looks odd in running text.<br>
      Trust your eyes, not the old watch list! ;°)</p>
