      <p><cite>Yes, or alternatively an ndash with word spaces. I’ve been told former was the traditional Anglo-American way . . .</cite></p>
      <p>Actually, it was the Anglo way, not Anglo/American. Richard Eckersley (of British origin) use to have "discussions" with the editors at Nebraska Press, where he was senior designer, about quotes &amp; dashes. Initially, he preferred the style common in the UK, where dashes were set as word-spaced en-dashes, and a single quote was used in places where those in the States use a double quote. We finally convinced him (honestly!) that a 3/4-em long dash centered in an em space (i.e., 125 unit l&amp;r sidebearings) looked best of all. Never got him to change his mind about the quotes, though.</p>
      <p>As you say, trust your eye.</p>
