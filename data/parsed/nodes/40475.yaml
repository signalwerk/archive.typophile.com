      <p>If the break is mandatory, there isn't much you can do about it, is there? I have never understood why a dash falling at the end or beginning of a line is considered so bad. There are a lot of "rules" that have come about because someone thought a particular situation would confuse a reader, or just looked bad. The usual argument against dashes at the end/beginning of a line, from an aesthetic point of view, is they weaken the text block. But so do ends of paragraphs, and we put up with that. Moreover, in the ragged setting you have shown, the text block has no clear right edge.</p>
      <p>However, in your screen shot, the emdash appears to be spaced with a word space. If you are going to use such a long dash (em), space it with a hair or thin space. If you are going to use a word space around the dash, use an en-dash. Better still, a few fonts have a dash 3/4 of an em long, and that, thin-spaced, ties the line together rather better.</p>
      <p>FWIW</p>
