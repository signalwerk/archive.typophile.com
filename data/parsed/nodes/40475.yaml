      <p><cite>The usual argument against dashes at the end/beginning of a line, from an aesthetic point of view, is they weaken the text block.</cite></p>
      <p>Additionally, some people claim a dash can be mistaken for a hyphen (when at the end of a line and being too short – not in your case) or a listing dash (when at the beginning of a line; like a bullet point, especially when there are several cases in succession).</p>
      <p>I second what Charles said: your breaks take up <em>lots</em> of space. Emdashs <em>can</em> be quite elegant, but take care that they don’t tear holes in your text. The spaces before &amp; after should be small and, moreover, even! (Look at the 2nd line: ‘Theorine —’ vs ‘Han&nbsp; &nbsp;—’<br>
      F</p>
