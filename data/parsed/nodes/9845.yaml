  date: 2001-09-18T09:00:00
  date_raw: 18 Sep 2001 — 9:00am
  votes: null
  html: "<p>I've made contact with the guy responsible for this font: <a href=\"http://www.id.iit.edu/visiblelanguage/Feature%20Articles/Roxane/Roxane.html\" target=\"_top\">http://www.id.iit.edu/visiblelanguage/Feature%20Articles/Roxane/Roxane.html</a>.  <br> <br>He says he sent it to FontShop but they never replied. I told him I'd look around for someone who might be interested in developing it.  <br> <br>He also said, \"...at the moment Roxane only exists as a research tool not as a real font because there are no other weights, italics and not much punctuation; nevertheless I can send you a copy if you want...\"  <br> <br>It looks like a good project for someone into designing a useful plain sans family.  <br> <br>I told him: \"...If I get anyone interested in taking the job on then I'll insist that you are credited as the original designer and that you should get half of any sales - although don't expect to retire on the proceeds!...\"</p>"
  html_clean: "<p>I've made contact with the guy responsible for this font: <a href=\"http://www.id.iit.edu/visiblelanguage/Feature%20Articles/Roxane/Roxane.html\" target=\"_top\" class=\"link-external\">http://www.id.iit.edu/visiblelanguage/Feature%20Articles/Roxane/Roxane.html</a>.  <br> <br>He says he sent it to FontShop but they never replied. I told him I'd look around for someone who might be interested in developing it.  <br> <br>He also said, \"...at the moment Roxane only exists as a research tool not as a real font because there are no other weights, italics and not much punctuation; nevertheless I can send you a copy if you want...\"  <br> <br>It looks like a good project for someone into designing a useful plain sans family.  <br> <br>I told him: \"...If I get anyone interested in taking the job on then I'll insist that you are credited as the original designer and that you should get half of any sales - although don't expect to retire on the proceeds!...\"</p>"
