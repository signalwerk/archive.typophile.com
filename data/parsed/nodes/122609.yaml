  html: |-
    <p>I'm having difficulty with adding an image to the background layer. I can create the image no problem with g.Rasterize(imagexyz), but I don't see anything about adding it to the glyph again.</p>
    <p>I'm doing some stuff with PIL, but I can't even get that far until I can add the image to the glyph to trace it.</p>
    <p>Trace(imagexyz) does not work. It appears there is a bug with Trace.</p>
    <p>relevant documentation:<br>
    <a href="http://www.e-font.de/flpydoc/html/Image.xml.html" title="http://www.e-font.de/flpydoc/html/Image.xml.html">http://www.e-font.de/flpydoc/html/Image.xml.html</a><br>
    <a href="http://www.e-font.de/flpydoc/xml/Glyph.xml" title="http://www.e-font.de/flpydoc/xml/Glyph.xml">http://www.e-font.de/flpydoc/xml/Glyph.xml</a></p>
    <p>Any help is appreciated.</p>
