      <p>Yeah, so this works, but the traced image gets put at (0,0)</p>
      <p>I thought about adding a pixel to fix the sidebearings, but glyphs with descenders get put in at 0,0 as well. Any ideas on how to fix this?</p>
      <p>Manually tracing a background image works fine and inserts the trace results exactly where they should go.</p>
