  html: |-
    <p>I was pleasantly surprised today when I received a complimentary copy of a book called "Brush 'n' Script Die Schreibschriften sammlung" published by Verlag Hermann Schmidt Mainz. It's a collection of brush scripts by many different type designers, some of which I am sure frequent Typophile.com</p>
    <p>I'm wondering how many others here have received a copy, or have seen the book.</p>
    <p>If not, you can get a peek at it here:</p>
    <p><a class="freelinking external" href="http://www.brushnscript.de/" rel="nofollow">http://www.brushnscript.de/</a></p>
    <p>--Rob</p>
