    html: <p>I have been looking forward to this publication, but am pretty disappointed by the outcome. The presentational form (1 page per typeface; basic character set; A-Z, a-z, figures) is not suited for script fonts with their complex nature. Furthermore, the selection of typefaces is debatable, to say the least. That does not mean that there are no good ones in it, the book contains a number of gems, including some of Rob’s and other typophiles’.</p>
