      <p>Wow – these are very cool screenshots, John.</p>
      <p>So, the outlines were snapped to a strict grid, which means that RGB values of yellow (on the left of the stem) and blue (on the right) are really supposed to be symmetrical, according to ClearType.</p>
      <p>As said before, if we see the HSL values of these two colors, they differ only in Hue. But if we convert it to another color model which has more accurate model of how human eye perceives color, we notice the colors are actually more different then they should be.</p>
      <p>So, what is actually the criticism?</p>
      <p>Colors fringing is not the same. It is darker/more visible on the right of the stems (or less dark on the left). This also explains why I was sometimes more bothered with blue color than red in ClearType, but I always thought it is just practical limitation of some variable on my side, and not theoretical. (I say this for black text on white, for other colors it could be different!)</p>
      <p>But … there are also limitations of such color corrections. They are more computationally intensive, maybe much too much for the small difference they make.  And maybe more important, they could make CT rendering less accurate, more blurry, and with less contrast. Unfortunately, it is hard to test to what extend is this true.</p>
      <p>Actually, the more I think about it more complicated it seems.</p>
