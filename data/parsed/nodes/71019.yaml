      <p><cite>Basic hinting or size specific delta hints?</cite></p>
      <p>I have not used delta hints but I wouldn't call it "basic" either.</p>
      <p>Delta hints are not necessarily a sign of good hinting. I consider them more of a fix if you don't get things to work otherwise, and if you try hard you nearly always find a solution using size-unspecific hints.</p>
      <p>Have a look at the R of Facit Web Semibold:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/FSB_R_4794.png"></div><p></p>
      <p>I think it works quite well across all sizes but it isn't a trivial solution either. Should I interpolate the upper of lower edge of the middle stroke? Which endpoints work best for the interpolation? Rounding distances, destinations, up or down, or not at all?<br>
      It takes quite a bit of trying out things so it's probably not much quicker than working delta hints. It just feel a bit cleaner to me.</p>
