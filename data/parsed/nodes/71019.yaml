      <p>David, I was talking about the process for making optimised screen fonts then and now: using hints vs using outlines. I didn't mean to imply that screenfonts now are going to look the same as screenfonts then. The renderers have changed and we don't have the options we used to have. I don't know of a reasonable way to make an aliased quality outline font series in a forced antialiasing environment such as Windows with CT smoothing enabled. With a carefully chosen UPM value, evenly divisible by pixel height, and a squared up outline one could minimise outline haze on full pixels at a specific size, but I don't think that technique is extendable to a series because the UPM would need to change for each type size and that does my head in.</p>
      <p>Here's an example of pseudo-aliased outline designs rendered in GDI ClearType. As you can see, even without curves and with the outline snapped to a strict grid there is a pale colour fringe due to the way the CT filtering works.</p>
