      <p>In fact, I think it's perfect that you're offering your whole collection as webfonts and that you're even offering to even work with other fonts; that really is what should be done. All fonts should be ready to “withstand the test of web” – I'll go further and say “aliased web” –, even if they were designed with maybe a newspaper or display applications in mind. I also don't think that we should treat typefaces which will be used by “the common user” in Word or whatever, mainly for printing, as needing less hinting, because these people (i.e., my parents) utterly reject the use of better-suited typefaces based precisely on what they see on the screen, which sucks unless you're using Verdana or Georgia – and never corresponds to what is then printed – (and we call them WYSIWYG), which then leads to everyone printing everything in Verdana at large sizes, since these people sometimes also do not realize that there's a zoom control on the program and do not have the sensitivity to imagine the page on screen as the final printed page. They just use Word as if they were using Notepad and whatever comes out the printer's fine – this is of the responsibility of OS makers and typedesigners alike, because we were trying to make things just work and, in a sense, we failed.<br>
      It's actually kind of funny; developers created Verdana so that we'd have a great typeface for the screen and ignored the need for every typeface to look good on screen, which then leads to people assuming that Verdana is the only typeface which you can actually read and then writing and printing everything with it, when it was in fact created mainly (maybe that's a bit of an overstatement, but still) with the screen in mind. They shouldn't have to know that the media are fundamentally different. It shouldn't matter.<br>
      Then we get historians and graphic designers saying that the democratization of text-composing and printing led to a substantial downfall in the quality of the printed work. Ironic! That's in some part due to the fact that the techniques didn't actually evolve (as in “weren't developed”) into being easy to use and intuitive; in many ways we are actually still using metal type, just in a less physically and more mentally/virtually extrapolated cumbersome way.</p>
      <p>Maybe I'm just an idealist… :P<br>
      I should stop writing, now.</p>
