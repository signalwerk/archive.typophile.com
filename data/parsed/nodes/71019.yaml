    html: |-
      <p>David: <em>"Pseudo-aliased outline" screen fonts seem to me a subset of the weight range of subpixel oriented hinted fonts. I.E. where the weights (of Franky e.g.) are whole pixels, pseudo-aliased outlines result.</em></p>
      <p>Something like pseudo-aliased outlines may occur as a natural subset of subpixel oriented hinted (SPOH) fonts, but there are a couple of differences between the approaches. In the SPOH fonts, at least as demonstrated by Franky, you are working with curves and diagonals, so the pseudo-aliasing only applied to vertical and horizontal stem positioning: rounded and diagonal features are fully antialiased. In a P-A font, all outlines are wrapped to full pixel boundaries, with no curves or diaognals, hence no intentional antialiasing. The colour fringing is an unwanted artefact of the particular rendering method's colour filtering, not antialiasing in the typical sense of font smoothing. Finally, while some weights of SPOH fonts may behave in ways very similar to P-A fonts, i.e. when those weights correspond to full pixels, in P-A fonts every size and weight would be fitted to full pixels (made possible by modifying the UPM at each size).</p>
      <p>By the way, I'm not advocating P-A fonts, and think there's a lot more mileage in your SPOH approach, but you challenged me to ‘demonstrate an aliased quality outline font series’. I'm not going to sit down and built such a series, but I think I've demonstrated the method that would get us as close as the colour filtering artefacts permit. The possibly cool aspects of the method are being able to automate outline creation from size strikes of aliased bitmaps from all those fonts we spent so much time hinting for b/w rendering, and modifying the UPM for each size font to avoid rounding of the grid. The latter technique could also be applied to SPOH fonts.</p>
