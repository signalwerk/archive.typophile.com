      <p>Frode, there are different kinds of delta hints. Outline delta hints move either individual points (final deltas) or sections of outline (medial deltas), and are used most in hinting for b/w rendering and some aspects of greyscale. In what I think of as ‘subpixel hinting’ or ‘CT hinting’, far fewer delta hints are necessary (and the CT renderer by default ignores all x-direction deltas anyway), and as Tim notes one should only use deltas to tidy up situations that other kinds of hinting have not resolved as you would like. Since GDI ClearType treats the y-direction as if it were b/w rendering, i.e. without any antialiasing in that direction, there may be some situations in which y-direction outline deltas are needed. [DWrite ClearType applies y-direction greyscaling in combination with x-direction colour antialiasing, so is more forgiving.]</p>
      <p>It is also possible to delta alignment zones, e.g. to pop up or down the x-height at a particular size.</p>
      <p>It is worth pointing out that much depends not only on the style of the typeface but also on the writing system. A great example of this is the MS Meiryo font, which uses y-direction outline deltas to apply traditional stroke reduction techniques to maintain legibility at small sizes.</p>
