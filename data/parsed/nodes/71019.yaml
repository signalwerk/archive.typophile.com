      <p>I said to myself, I shouldn’t participate in every rendering thread, but this is just getting too interesting.</p>
      <p><cite>colour fringing in the pseudo-aliased is more noticeable</cite> (John)<br>
      True – but this <em>also</em> happens because of the wrong colors: either yellow color is too bright or blue too dark.</p>
      <p>I would say these two colors were made in HSL (HSV) color space, because they differ only in Hue (Hue as defined in HSL). Which might lead to conclusion, that they differ only in hue, but in reality they do differ in brightness too – although they shouldn’t. And because I see much more blue color fringing in the last example, I would say it happened because of this: HSV is not as perfect as L*a*b*. As explained on Wikipedia: <a href="http://en.wikipedia.org/wiki/HSV_color_space#Disadvantages" rel="nofollow">Disadvantages</a>.</p>
      <p>Tim: :-D</p>
      <p>edit: Previous reasoning is correct if we assume that stems are exactly in the grid. I also see the same effect in "ab" example, which does have "outline snapped to a strict grid".</p>
