      <p>Frode: <em>Blackness is not the only factor to effect readability. I consider lettershapes and spacing more important...</em></p>
      <p>Why? </p>
      <p>If shapes and spacing are important to readability -- as they surely are --, then that must be for a reason, having to do with how they contribute to word recognition in our perceptual and cognitive systems. Shapes in our perceptual field have spatial frequency, and changes in stroke density affect spatial frequency as much or more than changes in stroke thickness and distanct. This suggests to me that, in reading, there is no shape recognition independent of stroke density.</p>
      <p>Now, I think it is relevant to this discussion that for many hundreds of years textual communication involved media in which sign shape and spacing were inconsistent, not only in the inevitable variation in manuscript writing but also through most of the history of printing due to uneven inking, worn sorts, etc.. The historical period of near-perfect repetition of shapes in printing and the regular repetition of bitmaps on screen is very short. But what has always been much more consistent than sign shape -- until the advent of antialiased text on screen -- is stroke density. So I'm inclined to think that stroke density is at least as important as shape and spacing, and probably more so. This is why I think ClearType is better than Apple's full fuzz rendering, because it does a better job of maintaining perceptual stroke contrast.</p>
