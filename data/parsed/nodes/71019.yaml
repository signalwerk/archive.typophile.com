      <p>I kind of hate webfonts… I just don't think there's enough resolution on computer screens for this to work! No amount of anti-aliasing will change that. Type is supposed to be black on white, not black with multi-coloured or grey halos on white… why are we forcing this…? Anti-aliased type on screen at small sizes, it just doesn't cut it.<br>
      I get it, we want to be able to use any typeface on our websites; and that's fine and logical and even a bit noble, to allow that freedom, but it only works with anti-aliasing turned on and some people (ok, “I”) don't want anti-aliased small text on screen and never use it. With no anti-aliasing, JAF's menu on the left and the text under the samples looks like some free font with uneven stroke widths all around. The same happens, for instance, at FontFeed, and SomeRandomDude, which I discovered just the other day, is a mess… some smaller italic texts can't even be read (that's on Chrome, mind you). I don't want to be forced to use anti-aliasing to be able to read stuff…</p>
      <p>I do really like Herb, though! Gorgeous! And Lapture's nice. And the Facitizer's a pretty good idea, despite what I think about the subject.<br>
      Sorry for the rant. :X</p>
