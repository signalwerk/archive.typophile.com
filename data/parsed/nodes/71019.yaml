      <p>Frode: <em>...you assume forcing delicate shapes into a strict pixel grid is a better solution.</em></p>
      <p>In order to judge the quality of a solution, it's necessary to understand what the problem is that it tries to solve. Forcing ‘delicate shapes’ into a b/w pixel grid is surely a lousy solution to individual typeface fidelity, but it can be an excellent solution to readability on screen. Ironically, the more delicate the shapes, the more likely that they will be unreadable at low resolution unless they have the delicateness hinted out of them and fitted to a grid like a virtual Verdana.</p>
      <p>It used to be the case that hinting was what made screen fonts, and the TT hinting language is powerful enough that the typeface design didn't matter a heck of a lot: you could take a print media typeface like Times New Roman, ill-suited to screen readability, hint the heck out of both outlines and spacing, and get something pretty readable on screen. [Indeed, the hinting language is powerful enough that David could make Augsburger Initials legible at text sizes on screen. Don't try that with FontLab, though.] Non-linear and subpixel antialiasing has killed that approach. It greatly improves WYSIMLTIT -- what you see is more like the individual typeface --, but at the cost that hints won't get you from a non-screen type to a screen font any more. So if you want halfway readable text on screen, you have to start with a design for screen. And if you want optimised readability, then you have to start with a different design for each size.</p>
