      <p>Look, you are not against antialiasing, just poorly hinted antialised fonts. Hints are perfectly capable of delivering screen fonts as good as any bitmap, aliased or antialised and you'd not know the difference.</p>
      <p>JH&gt; ...use a bitmap striker to create a size instance...</p>
      <p>Perhaps, but if you return to your thread on the MS Cleartype white paper, what you'll read from Mr. Hitchcock is that we're only given the option (on windows), to turn our size independent hints, or our size independent hints greatly compressed by function definitions, into incredibly verbose size dependent hints. So normal hints are X, compressed hints are X/2 and Greg's suggestion for the quality-minded (which includes many millions of Windows users besides rDm), is 16-25X. </p>
      <p>Since the appearance of the fonts does not change a bit from one hint scheme to the next, the disservice this offers is focused on Windows web users, where file size is a factor in the quality of experience. I'm told this could get much uglier if I really, really want it to, but I've promised to flip a coin when the time comes.:)</p>
