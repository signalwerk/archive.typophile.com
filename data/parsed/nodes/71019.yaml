      <p>Right. What I mean is more or less what John said: of course it is not a better solution if you're the typeface, but it does make for better reading. That's sad from our point of view, but unless we successfully lobby computer manufacturers and the whole world to up the pixel count and the resolution, that's something which seems inescapable, to me.<br>
      The pixel grid will not allow many variations, of course; at some point, with a relatively small number of typefaces, you will have had all the possible variations on each glyph, since we're talking about fixed shapes and a small area of pixels. But that's how it goes, I don't think there's any way around it. I don't feel great about sacrificing the identity of a typeface either, I don't. I feel you, there. But in the end this isn't about the typeface or its designer, it's about the reader and the reading experience.</p>
      <p>Don't take me the wrong way, Frode, I didn't mean to criticize anyone. I'm well aware that things aren't as simple as I put them. But I've thought about this and don't see any other way around it. We can improve the screens and forget hinting forever, improve hinting and make do with what's possible, or stick with Verdana, Georgia and friends. Right now it's a battle that can't be won. Not at small and medium sizes on a pixel grid, anyway.</p>
      <p>But that's just my silly point of view. I'm not trying to revolutionize anything or to end anti-aliasing (I wouldn't if I tried, I mean, I'm no one); I'm just stating what seems to be obvious but often forgotten or ignored so that it's out there. From what I read I never see this acknowledged and accepted. Sometimes it seems as if anti-aliasing is wonderful, and I really don't see it. I don't think it is. Again, I mean at small and medium sizes. At large sizes, yes, it's great and it works, because then we're talking about smoothing which isn't larger than the stroke of the letter itself.</p>
