      <p>The resolution of smaller, mobile devices is increasing significantly. The trouble for larger, compuer screens is that as resolution goes up the attrition rate also increases. The more pixels you squeeze into a screen, the more screens you end up having to junk because of dead pixels or other manufacturing failures.</p>
      <p><em>But in the end this isn't about the typeface or its designer, it's about the reader and the reading experience.</em></p>
