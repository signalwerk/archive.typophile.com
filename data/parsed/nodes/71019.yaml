      <p>David, I'm not disagreeing with your comments regarding the size impact of subpixel oriented hinting, but I'm not sure how relevant they are to what I've called pseudo-aliased <em>outline</em> screen fonts. I'm talking about using as a source fonts that have been hinted for b/w, aliased, full pixel display, and then wrapping size-specific outlines to those pixel patterns at size-specific UPM values to minimise fringing (the latter method might also apply to antialised size-specific fonts, no?).</p>
      <p>The <em>ab</em> example in my illustration doesn't have any hinting at all. It also has no curves. File size for such a font would be pretty minimal for an outline font.</p>
