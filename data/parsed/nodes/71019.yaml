      &gt;but my knowledge is really limited.</p>
      <p>Zoom is the enemy. If the interface were to allow the reader to choose from among a predetermined set of sizes - which in most instances is perfectly acceptable and adequate for accessibility -  size specific design would be a lot more practical to implement.<br>
      But "page zoom" has become preferred over "text zoom". And with extremely small screen sizes like those on mobile browsers and touch interfaces, it's easy to see why it won out. No need to give up screen real estate to a resizing widget with a menu, and it's the kind of thing that computer algorithms do so well - recalculate. Readers might lose out, designers might go nuts, but this is what we've got. The machines won this round of the readability wars.<br>
      Wait, there might be a second round on this one.</p>
