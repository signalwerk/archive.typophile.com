      <p>This looks very cool Tim!</p>
      <p>&gt;Should I interpolate the upper of lower edge of the middle stroke?</p>
      <p>I'd go with the upper, rounding it slightly up to grid ("sround 73", e.g.) after interpolation.</p>
      <p>&gt;Which endpoints work best for the interpolation?</p>
      <p>Interpolation of what? Or, be sure the reference points you use have been rounded or interpolated into their final places, and then you can use them to locate other points, and then those points can be used as references to interpolate as well, if required. </p>
      <p>&gt;It takes quite a bit of trying out things so it's probably not much quicker than working delta hints.</p>
      <p>Well, delta hinting your way to size independent outline fonts for the web is sad, and not likely to last long as this is not only size, but rendering dependent. </p>
      <p>Cheers!</p>
