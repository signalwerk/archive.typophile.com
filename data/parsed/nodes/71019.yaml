      <p>John,<br>
      <cite>It is also possible to delta alignment zones, e.g. to pop up or down the x-height at a particular size.</cite><br>
      This is something I seriously considered (and tried) but in that particular case, it didn't seem to improve things.<br>
      However, I used this tweak: the tips of the ascenders and descenders are always rounded towards the baseline, so they tend to get proportionally shorter in small sizes. Some kind of primitive optical sizing.</p>
      <p>Thanks, David.<br>
      <cite>I'd go with the upper, rounding it slightly up to grid ("sround 73", e.g.) after interpolation.</cite><br>
      I did try that but it didn't feel right to me. This is a more of stylistic decision: in this particular font, I prefer the middle stroke rather a bit too low than too high.</p>
      <p><cite>Or, be sure the reference points you use have been rounded or interpolated into their final places, and then you can use them to locate other points, and then those points can be used as references to interpolate as well, if required.</cite><br>
      This is more or less how I did it. I found that in some cases, un-rounded points (attached to a rounded point with an unrounded single link) can be useful as an endpoint for interpolation.</p>
