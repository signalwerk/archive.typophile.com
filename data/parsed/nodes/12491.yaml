      <p>I'm not an expert on medical positioning, but I've often admired the clean and crisp look of Stefan Hattenbach's <a href="http://www.fountain.nu/catalogue/stalemate.asp" target="new" rel="nofollow">Stalemate</a>, available from Fountain. According to the website, Stalemate "was originally constructed as a proprietary font for a German IT-company." Moreover, it "was designed to work both in print and on screen and experience shows that it performs well in both environments." It could be just what you're looking for.</p>
      <p>Here's a link to a <a href="http://www.fountain.nu/catalogue/img/pdf/FTN_Stalemate.pdf" target="new" rel="nofollow">PDF sample</a> as well. Good luck!</p>
