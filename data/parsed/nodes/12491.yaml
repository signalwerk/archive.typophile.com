    <p>Hello everyone</p>
    <p>What a great site and forum!  This is my first post on this forum.  MyFonts.com sent me here.</p>
    <p>I am looking for a nice modern font that is formal and professional looking for titles on a medical website.  I feel like I'm resigned to Arial or Verdana for the text on the site, so I can use common fonts, but I'd like the titles to be much more interesting.  I'd like to have some "body" to the font...if that is a good word.  This is a high tech site.</p>
    <p>Thank anyone for a reply</p>
    <p>Diane Sector</p>
