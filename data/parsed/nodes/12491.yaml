      <p>Hi Diane, </p>
      <p>First off, I'm not quite a professional yet, I'm a student, so my suggestions may not be 100%, but here they are anyways :) If you're going to be using a sans for the body copy, I'd recommend a serif font, or a sans with some character for the display type. Here's just a few of my suggestions… </p>
      <p>Democratica if a quirky font that is modern/hi-tech, and I don't know it seems kinda 'medical' to me<br>
      <a href="http://www.myfonts.com/fonts/emigre/democratica/" title="http://www.myfonts.com/fonts/emigre/democratica/">http://www.myfonts.com/fonts/emigre/democratica/</a></p>
      <p>Modern 735 is more conservative, but certainly is professional, and modern.<br>
      <a href="http://www.myfonts.com/fonts/bitstream/modern-735/" title="http://www.myfonts.com/fonts/bitstream/modern-735/">http://www.myfonts.com/fonts/bitstream/modern-735/</a></p>
      <p>Kingsbury Conensed is interesting.<br>
      <a href="http://www.myfonts.com/fonts/spiecegraphics/kingsbury-condensed-sg/" title="http://www.myfonts.com/fonts/spiecegraphics/kingsbury-condensed-sg/">http://www.myfonts.com/fonts/spiecegraphics/kingsbury-condensed-sg/</a></p>
      <p>Ultra Bronzo is a sans, but has a good deal of character, fairly clean and high tech.<br>
      <a href="http://www.myfonts.com/fonts/thirstype/ultra-bronzo/" title="http://www.myfonts.com/fonts/thirstype/ultra-bronzo/">http://www.myfonts.com/fonts/thirstype/ultra-bronzo/</a></p>
      <p>Ditto with Copperplate Modern…<br>
      <a href="http://www.myfonts.com/fonts/wiescherdesign/copperplate-modern/" title="http://www.myfonts.com/fonts/wiescherdesign/copperplate-modern/">http://www.myfonts.com/fonts/wiescherdesign/copperplate-modern/</a></p>
