    html: |-
      <p>Ciao,<br>
      Whether the two words are concatenated or you “keep em separated”, at different times thruout history “old style” has been used to refer to so-called “hanging” figures as well as the typeface designs (styles) of men such as Francesco Griffo and Nicolas Jenson. From the potted history I wrote for Wikipedia:</p>
      <p><em>In Italy the heavy gothic styles were soon displaced by Venetian or “old style” Latin types, also called antiqua.</em></p>
      <p><em>The name “roman” is customarily applied uncapitalized to distinguish early Jenson and Aldine-derived types from classical Roman letters of antiquity. Some parts of Europe call roman “antiqua” from its connection with the humanistic “lettera antica”; “medieval” and “old-style” are also employed to indicate roman types dating from the late 15th century, especially those used by Aldus Manutius (Italian: Manuzio). Roman faces based on those of Speyer and Jenson are also called Venetian.</em></p><em>
      </em><p><em>See also: Incunabulum</em></p>
      <p>I think lettera antica and Venetian are better terms for the type style formerly known as “old style”.</p>
      <p>As for ’old style’ numerals:<br>
      <strong>text</strong> no, that could mean several different things<br>
      <strong>old-style</strong> no, anachronistic &amp; outmoded, the game has moved on<br>
      <strong>lower case</strong> no, I can think of more telling nomenclature than that.</p>
      <p><strong>x-body</strong> because these figures have x-height bodies. Some have extenders, and some, such as 1 and 2, are x-body only.</p>
      <p>Ciao,<br>
      j a m e s</p>
