    html: |-
      <p>The problem with the term “text” is that is is just as opaque as the term “oldstyle.” If you use full caps in text, as some constructions seem to require, you should use lining figures. Whether or not one should ever use full caps in text is a different matter, but some editorial styles require it. And on balance (for instance), I think newspaper sections with page numbers (e.g., C2) do require full caps.</p>
      <p>In any event, the advantage to “lowercase” and “uppercase” as terms is they do somewhat refer to what figures should be used in what contexts.</p>
      <p>Having said that, I’m with Will. In informal conversations, I confess to still using the term “oldstyle.”</p>
