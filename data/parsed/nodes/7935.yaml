  - id: 53495
    user: 1085
    date: 2004-12-01T03:13:00
    date_raw: 1 Dec 2004 — 3:13am
    votes: null
    html: "<p>As far as I can say: <br><i>&gt;Does the ITC sales made by Linotype go in the pocket of the designers directly from Linotype? </i> <br> <br>Yes. <br>  <br><i>&gt;Does the ITC sales made by Linotype go in the pocket of the designers via ITC? </i> <br> <br>No. <br>  <br><i>Does the ITC sales made by Linotype go to ITC pocket only?</i> <br> <br>No. ITC doesn't get any more money from Linotype sales of their typefaces. That was part of their deal with Linotype.  <br>  <br><i>&gt;Does the ITC sales made by Linotype go to Linotype pocket only?</i> <br> <br>No. We pay the designers a royalty, and retain the rest of the sale profits. <br> <br> <br>JFP, Linotype owns an exclusive license to sell all ITC typefaces made before a certain date. We paid one lump sum to Mark Batty/ITC for this right years ago before he sold the company to Monotype. Because of this deal, as far as I know, Linotype does not have to pay ITC any royalties at all for the sales of any of these 1000 or so typefaces. <br> <br>According to ITC's terms, Linotype was not required to pay the typefaces' designers any royalties on future sales either! However, paying royalties, and maintaining good relations with designers is very important to Linotype and its employees. So, even though it was not required, Linotype voluntarially decided to pay the deigners of these ITC designs royalties on the sales of these typefaces. <br> <br>I looked in the forum archives, and it seems (based on his comments) that Erik thinks that he is not receiving royalties from Linotype's selling of his ITC Officina. I find the idea that he wouldn't be receiving any royalties very troubling, as I have it on very good authority that we do pay royalties on the ITC typefaces, so I e-mailed Erik offline and asked him to contact Linotype directly (basically anyone other than me <img src=\"http://www.typophile.com/forums/clipart/sad.gif\" alt=\":-(\" border=\"0\"> ) if he really isn't receiving any royalties, because there might be an error somewhere, or something further that I am not aware of.</p>"
