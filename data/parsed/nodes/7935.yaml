    html: '<p>Jonathan, you are agreeing then that there is nothing exclusive whatsoever about the typefaces themselves, only in the place of purchase (i.e. from ITC). As a result, once an end user purchases or holds a license for these types there is no exclusivity whatsoever. This is what I meant by: "perceived to be severe stretching of the definition of the word "exclusive" in the ITC press release." <br> <br>The press release states: "These exclusive typefaces can be viewed and purchased at <a href="http://www.itcfonts.com/new" target="_blank">www.itcfonts.com/new</a>." To claim that this now only means that they cannot be purchased anywhere else is certainly not the way it reads. It reads that the typefaces themselves have exclusivity, which would by definition extend beyond the point of purchase.</p>'
