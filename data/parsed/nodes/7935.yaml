    </p><blockquote>
    <hr size="0"><!---quote-!--><b>quote:</b>
    <p>These exclusive typefaces can be viewed and  <br>purchased at <a href="http://www.itcfonts.com/new" target="_blank">www.itcfonts.com/new</a>.<!---/quote-!--><br>
    </p><hr size="0"><!--!-/quote-!--><p></p><!--!-quote-!--></blockquote>
    <p></p><p> <br>In the same vein: What is "new" about ITC Legacy and ITC Anna?  <br>This entire release baffles me.</p>
