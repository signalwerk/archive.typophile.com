    html: "<p>Various incidents one has heard about over the years make one thing abundantly clear: there are all sorts of issues for type designers when rights to type libraries are transferred or sold. <br> <br>In the long run, the only thing to be done is to recognize copyright inherent in the design of fonts. This would give the designers legal rights that would help immensely in the kinds of situations at issue. But this is not an easy thing to accomplish, particularly in the USA. <br> <br>In the short run, designers might attempt to structure contracts such that the foundry paying royalties is unable to sell, license or otherwise dispose of the fonts without making provisions in those subsequent contracts that cause the royalties to continue. <br> <br>Another option is for designers to simply sell their fonts outright to foundries at some reasonable rate. Then the foundry is able to do whatever it likes with the fonts, both legally and ethically. This transfers the sales-volume risk to the foundry (usually better able to average these things out across a larger volume of fonts). On the other hand, it requires that the foundry be able to afford to pay for the full value of the fonts up front. And of course although the designer is protected from the danger of poor sales, and gets money up front, they don't get to share in the upside if the font is a bestseller. So there are tradeoffs. <br> <br>Regards, <br> <br>T</p>"
    html_clean: "<p>Various incidents one has heard about over the years make one thing abundantly clear: there are all sorts of issues for type designers when rights to type libraries are transferred or sold. <br> <br>In the long run, the only thing to be done is to recognize copyright inherent in the design of fonts. This would give the designers legal rights that would help immensely in the kinds of situations at issue. But this is not an easy thing to accomplish, particularly in the USA. <br> <br>In the short run, designers might attempt to structure contracts such that the foundry paying royalties is unable to sell, license or otherwise dispose of the fonts without making provisions in those subsequent contracts that cause the royalties to continue. <br> <br>Another option is for designers to simply sell their fonts outright to foundries at some reasonable rate. Then the foundry is able to do whatever it likes with the fonts, both legally and ethically. This transfers the sales-volume risk to the foundry (usually better able to average these things out across a larger volume of fonts). On the other hand, it requires that the foundry be able to afford to pay for the full value of the fonts up front. And of course although the designer is protected from the danger of poor sales, and gets money up front, they don't get to share in the upside if the font is a bestseller. So there are tradeoffs. <br> <br>Regards, <br> <br>T</p>"
