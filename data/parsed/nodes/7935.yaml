    html: <p>Hi everyone, <br>It looks like this press release could use some clarification by someone from ITC/Monotype Imaging... <br> <br>Please take another look at the <a href="http://www.typophile.com/cgibin/show.pl?72/54802">press release</a>. ITC Legacy is never mentioned in the press release or referred to as new or exclusive. The only typefaces mentioned are ITC Astro, ITC Tyke, ITC Resavska and ITC Anna. ITC Anna Extended is a new addition to the ITC Anna family and the release details the history of the face.  <br> <br>Again, the press release never mentions ITC Legacy. It does, however, point the reader to <a href="http://www.itcfonts.com/fonts/whatsnew_fonts.asp?Newrel=2004">this page</a> on the ITC site. I'm guessing this is where the confusion came from. This page displays the featured ITC product of each month. In most cases, the featured product is a new typeface release. In other cases, its a new value pack. ITC Legacy was featured earlier this year when we introduced the <a href="http://www.itcfonts.com/fonts/detail.asp?sid=0&amp;sku=ITC9254">ITC Legacy Complete Family Package</a> - a package containing both sans and serif versions of the design. We also introduced a compilation package of the ITC Founder's Caslon faces this year. <br> <br>Hope that clears things up, <br>Johnathan Zsittnik</p>
