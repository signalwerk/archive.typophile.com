as been falsely given by ITC from the getgo. I quote from their own website:  <br> <br>\"ITC Wisteria was designed by Michael Stacey, a Florida-based artist and graphic designer. <br> <br>ITC Wisteria was not designed by Michael Stacey, a well known fact among many. It is an exacting reproduction of an alphabet design copyrighted in multiple 1938 through 1952 popular publications by Ross F. George, co-inventor of the Speedball pen. Why companies like ITC like to stretch the truth, hide the actual origins, and deceive buyers with ITC Wisteria is perplexing at best. They need to go well beyond correcting misleading press releases such as the one this thread began with and cleanse their entire staff of personnel and material that does not meet the highest standards of forthrightness. <br> <br>Lastly, I applaud Linotype taking the high road on the ITC rights they hold, and would hope that this is a minimum standard that they as well as others apply for similar rights as well. However, in doing so, Linotype as well as others have a responsibility to correct and amend for ITC's overzealous and inaccurate credit claims such as the one above.</p>"
