    html: <p>I use exclusive as in "this font is an exclusive of this particular foundry". In other words, the foundry has the exclusive right to sell and market the font. If I release a design myself, I have exclusive rights to sell and market the font as I wish. Also, custom fonts often include an arrangement were the client gets an exclusive on the font for x-number of years, often renewable. The designer cannot market the font during the length of the agreement. At the end of the agreement, all rights to the font revert to the designer/foundry. Often, after the exclusive expires, the designer/foundry will sell the designs as retail fonts. <br> <br>That's just the way I think of the word "exclusive" as it applies to fonts. Sort of.</p>
    html_clean: <p>I use exclusive as in "this font is an exclusive of this particular foundry". In other words, the foundry has the exclusive right to sell and market the font. If I release a design myself, I have exclusive rights to sell and market the font as I wish. Also, custom fonts often include an arrangement were the client gets an exclusive on the font for x-number of years, often renewable. The designer cannot market the font during the length of the agreement. At the end of the agreement, all rights to the font revert to the designer/foundry. Often, after the exclusive expires, the designer/foundry will sell the designs as retail fonts. <br> <br>That's just the way I think of the word "exclusive" as it applies to fonts. Sort of.</p>
  - id: 53502
    user: 2384
    date: 2004-12-01T19:03:00
    date_raw: 1 Dec 2004 — 7:03pm
    votes: null
    html: "<p>I come from a marketing background, and see words like \"exclusive\" overused in all sort of promotional areas, and understand that ITC's usage here is not necessarily illegal - it's just pushing the envelope to the limit for a typically professional product (and conversely is within typically accepted standards for consumer products). <br> <br>We have to judge this on simple terms. The question needs to be asked: Is this PR statement true? I think that the term \"exclusive\" in this instance hinges on the pretext that it is not available from another supplier. The fraud is in the concept that this is seemingly not ITC's primary usage of the word in this PR piece. <br> <br>Usage of the term \"exclusive\" here seems to be centered around the notion that there is a degree of eliteness to the item, and this is obviously untrue. There is nothing limited, aristocratic, preferential, privileged, or private about these typefaces. ITC's use of this term clings to the idea that one cannot purchase it from any other reseller than those they authorize (Can anyone say BFD?). Yet anyone from any walk of life can purchase and use these until we are far beyond sick of seeing such use. As a result, the hint of a purchase and use of any of these typefaces being a semi-monogamous relationship with the designer is pure fiction. In the truest sense of the word the word, this company would have the greatest results from this product if it were whored! How exclusive is that? <a href=\"http://www.hookerfonts.com\" target=\"_blank\">www.hookerfonts.com</a> should be a redirect for this blurb. <br> <br>Legal? Yes. On the up-and-up? Sorry, no. <br> <br>In my experience, this sort of exaggeration is rarely limited to one PR release or advertisement for a firm. In ITC's case this is equally true as well. One of my favorite examples (besides the obvious Anna roots in Stephenson Blakes Casablanca) is in ITC Wisteria, a design whose sole credit is and has been falsely given by ITC from the getgo. I quote from their own website:  <br> <br>\"ITC Wisteria was designed by Michael Stacey, a Florida-based artist and graphic designer. <br> <br>ITC Wisteria was not designed by Michael Stacey, a well known fact among many. It is an exacting reproduction of an alphabet design copyrighted in multiple 1938 through 1952 popular publications by Ross F. George, co-inventor of the Speedball pen. Why companies like ITC like to stretch the truth, hide the actual origins, and deceive buyers with ITC Wisteria is perplexing at best. They need to go well beyond correcting misleading press releases such as the one this thread began with and cleanse their entire staff of personnel and material that does not meet the highest standards of forthrightness. <br> <br>Lastly, I applaud Linotype taking the high road on the ITC rights they hold, and would hope that this is a minimum standard that they as well as others apply for similar rights as well. However, in doing so, Linotype as well as others have a responsibility to correct and amend for ITC's overzealous and inaccurate credit claims such as the one above.</p>"
