    html: <p>"To claim that this now only means that they cannot be purchased anywhere else is certainly not the way it reads." <br> <br>I have to disagree with you there. "Exclusive" is used very commonly in press releases to describe exclusive distribution. Its a word we've used for years, and I've never had a member of the press (the intended audience) come back with a question. If we wanted to call the typefaces "limited, aristocratic, preferential, privileged," the description would never appear in the headline of the press release. It would have to be attributed as a quote, since it is opinion. It is fact, not opinion, that we are the exclusive distributor of these products.</p>
