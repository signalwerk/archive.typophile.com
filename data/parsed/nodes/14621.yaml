    html: |-
      <p>&gt; I guess some application developers thought that having a document being typeset differently and completely reflow each time the user opens it or goes to a next page and back wouldn’t be such a good idea…</p>
      <p>Interesting that it was completely rejected rather than built in as an option. After all, it is something that requires user input, be that installing a font, or ticking a box for alternates. I hope to see this in the future, as I feel it opens up a world of possibilities.</p>
      <p>I assumed this on-the-fly chaos was how those dutch chaps ran their Beowolf font — now I guess they applied code to an existing font in production, and just output several versions. Or perhaps they built a little bespoke engine? At the end of the day those who build typesetting software are unwittingly restricting creativity, so good on them if this was the case.</p>
      <p>Thanks for that hrant. I found a solitary pdf on said subject, but it doesnt look like something my brain, currently operating on basic motor skills, is capable of digesting without some serious homework. Cheers again.</p>
