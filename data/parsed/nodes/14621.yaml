    html: |-
      <ul>
      <li>Most common two letter combinations - TH, HE, AN, IN, ER, RE, ES, ON, TI, AT</li>
      <li>Most common three letter combinations - THE, AND, HAT, ENT, ION, FOR, TIO, HAS, TIS</li>
      <li>Most common doubled letters - LL, TT, SS, EE, PP, OO, RR, FF, CC, DD, NN</li>
      <li>Most common two letter combinations that show up as reversals of themselves - ER RE, ES SE, AN NA, ON NO, TI IT, EN NE, TO OT, ED DE</li>
      </ul>
      <p>…or so the folks who make cryptograms say.</p>
