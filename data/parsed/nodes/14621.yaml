    <p>Having just discovered that making random characters appear within a range of alternates isn’t supported by typesetting software, I’ve now resigned myself to making a large set of contextual alternates, and faking it.</p>
    <p>Does anyone know if there is any common knowledge of the most common repeating sets of two characters in the english language?</p>
    <p>thanks!</p>
