  html: |-
    <p>The 'face I want should be fresh, cocky and loud- like your typical teenager ;-) The kids  are from an extremely poor, rural area but they love brands like Abercrombie &amp; Fitch and Ecko and they love any kind of urban, North American culture (gringo in Central America here). Need to develop a quickie identity for a show of their photography next week.</p>
    <p>So farming + Ed Hardy, heh heh. Would love to hear your suggestions!</p>
