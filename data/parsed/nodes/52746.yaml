      <p>I think this is one of the more interesting faces to be presented here for a long while. A few things that I would consider adjusting would include making the A a little larger over all in both versions as it appears to me to be a tad small and light, the top of the A needs to cut through the cap height a wee gnat hair more as well. I would make the V a little wider and increase the size [but not the weight] of the O, Q, C &amp; G in both versions. The serifs on the C are little too heavy for my taste and look at odds with the rest of the characters [I am not used to calling characters glyphs]. The tail of the Q is nice but I would also give it a tad more weight just to see how it looks with the other letters, this one is really just a personal thing and not a criticism. </p>
      <p>The Z looks a tad heavy to me as well and the top curve of the upper bowl of the B could tapper further up the curve like the bottom bowl just a wee bit and although I also like narrow B, P &amp; R I think the bowls need a little more air in them as they close up too much and look a little weak in the 'lowercase'- although this again is a personal thing. The bowl of the D also needs to be adjusted to match that of the O as it appears to me to tapper too quickly to the thin unlike the O, G &amp; C which tappers a little more gradually.<br>
      At first look the S seemed to be a little out of whack with the top a tad too small, but I am in too minds on this although I have the urge to make it a little more graceful by increasing the size of top half, again to add a little more air in the curve as it closes just a little too much in the lower case and at a smaller size.</p>
      <p>Very nice work with a lot going for it.</p>
