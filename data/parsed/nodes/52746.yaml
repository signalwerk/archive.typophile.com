      <p>nithrandur:</p>
      <p>I forgot to say that I understand your taste for fonts that blur the distinction between upper-case and lower case. What I like about the Peignot, as opposed to a font which only has small capitals like the Trajan, is that it preserves ascenders and descenders, which means the text still has a shape which is easy to recognise. In that respect it is quite the opposite of the way a font like Filosofia unicase works: in that case shapes are largely different but height is the same and ascenders + descenders have disappeared.<br>
      I also like the way Jean-François Porchez's Anisette STD works. I want to work on a font with very similarly sized upper and lower case, with upper cases being far bolder. Not sure it will work!</p>
