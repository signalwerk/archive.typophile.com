      <p>Interesting about the C serifs: do they shock you as much in both versions? Do they shock you more than the upper G serif?</p>
      <p>Shock is not the word I would use, but they do stand out too much in both versions. No need to try to be different, just be yourself and go with your gut feelings. The upper G serif is lighter than those of the C and looks fine.</p>
      <p>When you say increase the size of O, Q, C and G - do you mean width only or height &amp; width?</p>
      <p>Height is the issue. These curved letters need to the extended above the cap height and below the base line to appear to be the same size as the other letters. The U also needs to 'cut' through the base line rather sit on it as it looks as if its floating above the imaginary base line. At the moment they look a fraction smaller than the other letters.</p>
      <p>Some doubt it is possible to produce a balanced font which is very vertical and has very differing letter widths. Not sure what people think on here.</p>
      <p>I am not sure what people think here either :) But as for different width letters in a font, I say go for it because that is what I do as par for course. I believe its the only way to get a visually interesting design otherwise you end up with something as ugly as Helvetica.</p>
      <p>I am surprised the leg of the R does not look too thick to anyone. Sometimes it seems to me that it works, sometimes it seems too dark... Erm. Not sure why!</p>
      <p>It does look a little heavy depending on which way the wind is blowing. Usually diagonals need to be a little wider than verticals to look optically the same. Its a fine balancing act. If it looks a bit dark to your eyes, then it probably is, so adjust it and see what happens.</p>
      <p>Also - what B &amp; E do you prefer?</p>
      <p>I prefer the B in Nattier and the E in Vouet.</p>
    html_clean: |-
      <p>Interesting about the C serifs: do they shock you as much in both versions? Do they shock you more than the upper G serif?</p>
      <p>Shock is not the word I would use, but they do stand out too much in both versions. No need to try to be different, just be yourself and go with your gut feelings. The upper G serif is lighter than those of the C and looks fine.</p>
      <p>When you say increase the size of O, Q, C and G - do you mean width only or height &amp; width?</p>
      <p>Height is the issue. These curved letters need to the extended above the cap height and below the base line to appear to be the same size as the other letters. The U also needs to 'cut' through the base line rather sit on it as it looks as if its floating above the imaginary base line. At the moment they look a fraction smaller than the other letters.</p>
      <p>Some doubt it is possible to produce a balanced font which is very vertical and has very differing letter widths. Not sure what people think on here.</p>
      <p>I am not sure what people think here either :) But as for different width letters in a font, I say go for it because that is what I do as par for course. I believe its the only way to get a visually interesting design otherwise you end up with something as ugly as Helvetica.</p>
      <p>I am surprised the leg of the R does not look too thick to anyone. Sometimes it seems to me that it works, sometimes it seems too dark... Erm. Not sure why!</p>
      <p>It does look a little heavy depending on which way the wind is blowing. Usually diagonals need to be a little wider than verticals to look optically the same. Its a fine balancing act. If it looks a bit dark to your eyes, then it probably is, so adjust it and see what happens.</p>
      <p>Also - what B &amp; E do you prefer?</p>
      <p>I prefer the B in Nattier and the E in Vouet.</p>
