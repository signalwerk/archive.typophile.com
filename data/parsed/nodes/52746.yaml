      <p>Glad to hear you received the font. It is funny you should say that: I always thought that the S of the Trajan looked like a difficult exercise in balance, the very steep diagonal being corrected by the fact the loops seem to be falling the other way round. I have made two other versions of the S, but I think they don't work very well either: the lower loop seems to fall to the right and the upper loop to the left. I'll send them to you by mail so you have more choices. </p>
      <p>Re the long-tailed Q: it is not really complete, methink (hence the three parts are only next to each other and not linked) &amp; works only with the Upper Case U.</p>
