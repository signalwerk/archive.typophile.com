    <p>Hi,<br>
    I have started designing a Cyrillic character set for my typeface, despite the fact I did not know practically anything about it. However, it was quite a big challenge for me. I have found little resources in books (mostly Russian ones) as well as on the internet and I checked few typefaces which I consider well done. But still, it was quite complicated to find any relevant information.<br>
    So I would like to ask you whether you could give me any feedback, I want to move on.<br>
    Thank you.<br>
    Jan</p>
