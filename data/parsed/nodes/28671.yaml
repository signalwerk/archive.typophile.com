    html: <p>I heard at the Museum of Printing that 70% of printing in the world into the 1960's was done on Linotype machines. As Larry Oppenberg put it to me, they were the 'Microsoft' of its day, dominating the market. Monotype actually had a small portion of the market, mainly a portion of the book market. Hence world wide a different list of Latin faces would be relevant. Also if you just look at sheer volume of print, probably newspaper typefaces from Linotype would dominate.</p>
