      <p>This may also be not exactly what you're looking for but interesting anyway...</p>
      <p>from Appendix C, "Typeface popularity" in <em>Methods of Book Design</em> by Hugh Williamson, second edn., pub. Oxford University Press, 1966. This was two lists of the twelve typefaces most frequently appearing in the National Book League's Annual Exhibition (of just over 800 books per exhibition) in the postwar years in England.</p>
      <p>From 1945-55, in ranking order; Bembo, Baskerville, Times, Fournier, Imprint, Perpetua, Walbaum, Garamond, Bell, Plantin, Poliphilus, Caslon.</p>
      <p>From 1956-63, in ranking order; Bembo, Baskerville, Plantin, Times, Fournier, Poliphilus, Garamond, Bell, Ehrhardt, Imprint, Walbaum, Caslon.</p>
      <p>The author goes on to say that the top two of these accounted for more than one third of the books exhibited, Bembo being used for over 50% more books than Baskerville, and Baskerville in turn, being used for  over 50% more books than Times, it's nearest rival over the whole period. </p>
      <p>For my part, please note that Arial, Comic Sans, Courier, Franklin Gothic, Gill Sans, Helvetica, Univers, Verdana etc. appear nowhere here. But then these lists are really just about pre-digital British book typography.</p>
    html_clean: |-
