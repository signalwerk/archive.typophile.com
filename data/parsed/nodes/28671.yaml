      <p>“in your opinion, what are the 10 most popular fonts of the last century?”</p>
      <p>I guess within the 20. century not the digital fonts dominated but the letterpress fonts. And of course a list of most common fonts depends on a question 'Where, in which country?'.</p>
      <p>To answer it for Germany, I'ld say:</p>
      <p>Helvetica (D.Stempel)<br>
      Folio (Bauersche Giesserei)<br>
      Garamond (D.Stempel)<br>
      Palatino (D.Stempel)<br>
      Bodoni (Bauersche Giesserei)<br>
      Akzidenz-Grotesk (H.Berthold)<br>
      Futura (Bauersche Giesserei)<br>
      Super-Grotesk (after 1945 TypoArt)<br>
      Garamond (TypoArt)<br>
      Lithographia (Bauersche Giesserei)</p>
      <p>90 percent of all typesetting departments of letterpress companies we buy, hold above listed fonts. Not all of them but mostly one Grotesk and one Antiqua.</p>
      <p>Georg</p>
      <p><a class="link" rel="nofollow">Preußisches Bleisatz-Magazin</a></p>
