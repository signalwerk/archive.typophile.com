      <p><cite>If it isn’t critical that the type size and leading be precisely the same in each booklet, you could simply reduce the point size and/or leading slightly for both pages of copy (you don’t want to adjust just part of it in this manner). Not knowing the design, I can’t say whether it would be better to let the first page run a couple of lines short, or whether a couple of lines of the first paragraph on the second page should go to the bottom of the first page.</cite></p>
      <p>Just saw this now.  The problem with adjusting the type size for both pages equally wouldn't resolve in such a nice ending of paragraphs as they are.  Since page one ends right at the end of a paragraph, the size adjusting would need to be more severe, since a fractional change would end up not bringing the next paragraph up from the proceeding page, but just creating the dead space that would naturally be between the paragraphs had it been a larger text box, and I'm already pushing it by moving the type below 7pt.</p>
      <p>One question though:  Do you hold leading or type size to be more sacred?  My opinion is that having the same number of lines, and having the lines line up with one another is most important, as it would be the most noticable adjustment and can potentially throw everything else off-kilter.</p>
