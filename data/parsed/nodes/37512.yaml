    html: <p>I find the measure too wide for comfortable reading on the first page of text. I realize this formatting is probably carved in stone with this series, but it's something to consider if you're designing a new one from scratch. Generally around 60 characters per line should be the maximum, though with very generous leading you can increase that a bit. Your character count is over 100. The eye has to make too many hops to get across, and then has trouble efficiently picking out the beginning of the next line.</p>
