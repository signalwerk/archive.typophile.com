      <p>As a book designer, if this is one of a series of booklets, I’m always going to keep it in the exact style of the series.</p>
      <p>My first choice is to try adjusting the number of lines on earlier pages—first a line long for a few spreads; then a line short. See which gives the best, balanced spreads.</p>
      <p>If there's no way to make that work, I adjust the tracking negatively. See how little I can use to make the copy fit.</p>
      <p>Last thing I'd try, if there is time, is to ask whether the author or editor would consider editing the copy.</p>
