      <p>You wouldn't want to use Mrs. Eaves as a text workhorse (if you like Baskerville, there are other versions that would do better for that), but for purposes that suit it, I think it's great, and it seems to work here. Mrs. Eaves doesn't have high contrast or exceptionally thin strokes, and it has generous letter spacing, so it survives small point sizes better than many typefaces. As long as you give it plenty of leading, the small x-height is not a drawback.</p>
      <p>By the way, the pdf I downloaded shows a slanted roman rather than the true italic on the last page for "The Outskirts of Deep City." Is it supposed to be that way, or is it a pdf problem?</p>
