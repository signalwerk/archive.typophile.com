      <p>If it isn't critical that the type size and leading be precisely the same in each booklet, you could simply reduce the point size and/or leading slightly for both pages of copy (you don't want to adjust just part of it in this manner). Not knowing the design, I can't say whether it would be better to let the first page run a couple of lines short, or whether a couple of lines of the first paragraph on the second page should go to the bottom of the first page.</p>
      <p>Editing to shorten by two lines is hard with brief copy, though if you have a couple of paragraphs where there are only a couple of words on the last line, you can probably edit those paragraphs sufficiently to eliminate the last lines.</p>
