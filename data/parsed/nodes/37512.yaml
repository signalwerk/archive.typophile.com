    <p>So I've just ran into a predicament.<br>
    I'm placing a block of text into a booklet, in a template that was used in previous booklets (where I've seen some fractional inconsistencies in text sizes from booklet to booklet), and everything is working so great.  The paragraphs of text on the first page are magically ending at the bottom of the page using the maximum number of lines allowed, but I run into a problem with the 2nd, final page of this copy.  The last paragraph ends at the bottom line, but there still needs to be author credits below, placed a line-spacing below the last paragraph.  I certainly don't want this one-line credit to be on the following page all alone and crying for company, so I am faced with some decisions.</p>
    <p>What would you do?<br>
    a)edit the copy (and make it 2 lines shorter (which is very difficult since it's such a short body of copy)?<br>
    b)change the point size of the type by fractions (making it a slightly different size than the rest of the type used in the booklet)?<br>
    c)pose this question on typophile.com?<br>
    d)something that I'm not thinking of at the moment?</p>
    <p>In desperate need of advice,<br>
    -David</p>
