      <p>Now a typesetting rule of thumb - is to leave it all alone... and contact the customer and ask if you may work with it to improve upon the original. </p>
      <p>Personally, I'd reset the copy to match what is going on in the booklet. Then let the customer know and ask the customer for suggestions -- after he/she saw the reset. It's happened a lot - and I've found that once reset the customer was not as likely to "go back" and even has a thank you for taking the time to make sure their work looks right.</p>
