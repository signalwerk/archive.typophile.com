    <p>Hi,</p>
    <p>For school I'm inquiring into the font 'Linden Hill'.<br>
    It's a free font (<a href="http://www.fontsquirrel.com/fonts/linden-hill" title="http://www.fontsquirrel.com/fonts/linden-hill">http://www.fontsquirrel.com/fonts/linden-hill</a>) based on Frederic Goudys Deepdene.</p>
    <p>I'm wondering if anyone can help me to find where Linden Hill can be used for. (a poam, some kind of book, ...)<br>
    I'm also searching for a picture or something else of the original Deepdene.</p>
    <p>Thank you for helping me!</p>
    <p>(graphic design student)</p>
