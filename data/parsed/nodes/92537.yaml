      <p><a href="http://typophile.com/node/36266" title="http://typophile.com/node/36266">http://typophile.com/node/36266</a></p>
      <p>You would get some good academic perspective from <em>Goudy’s Type Designs</em>, a specimen book written by the man himself.</p>
      <p>Deepdene was not one of his more popular faces, and I don’t recall ever coming across it used commercially (and I’ve spent a lot of time looking at magazines from the ’20s and ’30s).</p>
      <p>There are several digital interpretations of the face—a comparison of their relative merits would also be a good academic project.</p>
      <p>As for the font in use, why not have a go at doing some typography in the style of the historicist era in which Goudy’s types were front and centre? — making use of small caps, italics, old style ﬁgures, all the good stuff! </p>
      <p><a href="http://pinterest.com/pin/49539664621187883/" title="http://pinterest.com/pin/49539664621187883/">http://pinterest.com/pin/49539664621187883/</a><br>
      <a href="http://pinterest.com/pin/49539664621163576/" title="http://pinterest.com/pin/49539664621163576/">http://pinterest.com/pin/49539664621163576/</a></p>
