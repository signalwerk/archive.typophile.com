      <p>@picArt</p>
      <p>At Kernest Konstellations, we're using Linden Hill in combination with some other fonts, in setting an excerpt from <em>Walden, and On the Duty of Civil Disobedience</em> by Henry David Thoreau.  Titled <em>Spring</em>.<br>
      Linden Hill is being used sparingly to provide contrast to text that's extraneous in some way from the main text - such as the title of the volume from which the excerpt comes: <em>Walden, and On the Duty of Civil Disobedience</em>, for example. </p>
      <p>Drop me note about it on my blog in the comments section. (See below.) From it, I can get your email, and I'll pop over a link to the piece when it publishes in a few days.  It's appearing as a part of the May issue of Konstellations. (The entire package - web fonts, html, and css, all downloadable.)</p>
      <p>Or better yet, subscribe!</p>
      <p>Regards,</p>
