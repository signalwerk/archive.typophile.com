    html: |-
      <p>I have encountered Deepdene only a few times in the wild. And mostly in display.</p>
      <p>I have two examples among my own book collection. Deepdene was used for the title page of <cite>The Beach of Falesá</cite>, by Dylan Thomas [New York: Stein and Day, 1959]. Deepdene Roman and Italic were used for section and chapter titles in <cite>Great American Nature Writing</cite>, edited by Joseph Wood Krutch [New York: William Sloane Associates, 1950].</p>
      <p>(Interestingly, it was paired with Electra for text in both cases. Go figure.)</p>
      <p>But, of course, these were not Linden Hill.</p>
