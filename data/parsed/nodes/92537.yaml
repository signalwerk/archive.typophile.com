    html: <p>I remain impressed with Goudy’s ingenuity in overcoming a general lack of kernability with cast metal letters. In the instance shown just above, I am quite taken with the subtle overshoots on the bottoms of the /c/ and /e/, along with the dip-below diagonal serif on the bottom of the /d/.</p>
