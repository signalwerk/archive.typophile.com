    html: |-
      <p>I'm fascinated by the fact that I haven't read anything about people trying to do analysis on other people's calligraphy, in the same way that they analyze handwriting. This has me very perplexed because in calligraphy, we can often tell who wrote what, even if we are all scribing in the same style of writing.</p>
      <p>I'm still at a state where I'm not completely sold on what I have read, and I haven't applied what I've learned to my work. Still, I find this subject to be really interesting.</p>
      <p>I've noticed reading extensively on it, that I tend to agree with the graphology experts who have extensive psychology backgrounds and apply it to the analysis they do. I feel the more modern approaches to Graphology make a lot more sense because they realize that a lot of people think the subject is perceived as a irrelevant or inaccurate.</p>
      <p>Lila</p>
