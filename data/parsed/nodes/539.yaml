      <p>I agree, that writing in more traditional hands can be less individual because we are striving to write in a certain way. However, when a calligrapher is just writing in their own style using a broad edge or pointed pen, doesn't it have the potential to reveal a lot about them?</p>
      <p>Does it really matter if they are writing with a crayon versus writing with a ballpoint pen?</p>
