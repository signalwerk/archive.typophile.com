    html: <p>Graphology is useless pseudoscientific cack claiming to tell us something about a person's innermost drives based on their handwriting. It is an insult to both science and art. I beg you, please do not waste any of your time on it. <br> <br>There is an organization that offers training in graphology claiming it can be a lucrative expert-witness gig in court. This is also cack. There are true Questioned Document Examiners who can detect (using conventional scientific means) whether two samples of writing were produced by the same hand, but their training is completely different from "graphology" and they regularly distance themselves from graphologists. But those not familiar with this conflict are easily led to confuse the two groups. Questioned Document Examination is a worthwhile career to pursue (although about as livable as type design) whereas graphology is not. Know the difference. <br> <br><a href="http://www.abfde.org/fde.htm" target="_blank">http://www.abfde.org/fde.htm</a> <br> <br>Graphology belongs in the same bucket as New Age religions, UFO and conspiracy theorists, homeopathic medicine and magnetic insoles. <br></p>
