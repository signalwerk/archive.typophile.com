      <p>The thing is calligraphy instruction is much more formal and imitative than the teaching of handwriting (at least these days). For example, our oldest does innovative things with some of his letters and his teachers don't complain (luckily), but when I took a calligraphy class there was essentially only one way to make a letter.</p>
      <p>&gt; Does it really matter if they are writing with<br>
      &gt; a crayon versus writing with a ballpoint pen?</p>
      <p>I would say the more complex a tool the more potential for revelation.</p>
      <p>hhp</p>
