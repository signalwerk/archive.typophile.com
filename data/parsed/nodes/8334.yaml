    votes: null
    html: "<p>Great question. No matter what the universalists might say, to me ethnicity is a huge contextual factor. Which doesn't mean the question of who is Dutch [enough] is a simple one! For me Fleischman is more Dutch then RvL for example - although in the end I would include both. But not Kis - his whole point was to go back home after learning punchcutting in Holland. <br> <br>But I can't come up with ten. Not because there aren't enough good Dutch type designers*, but because beyond the small top tier there are in fact too many to mention - which would make it unfair (and a lot more work!) to cut off at 10. <br> <br>* Although my particular way of seeing Design (as opposed to Art posing as Design) does in fact exclude many people others might put at the top of their list. <br> <br>Anyway, my top tier is something like this: <br> <br>Christoffel van Dijck <br>Johann Michael Fleischman <br>Evert Bloemsma <br>Gerard Unger <br>Wim Crouwel <br>LettError <br>Petr van Blokland <br>Luc[as] de Groot <br>Thomas Milo <br>Bram de Does <br> <br>Well will you look at that - in the end I got exactly 10 after all!  :-) <br> <br>hhp</p>"
    html_clean: "<p>Great question. No matter what the universalists might say, to me ethnicity is a huge contextual factor. Which doesn't mean the question of who is Dutch [enough] is a simple one! For me Fleischman is more Dutch then RvL for example - although in the end I would include both. But not Kis - his whole point was to go back home after learning punchcutting in Holland. <br> <br>But I can't come up with ten. Not because there aren't enough good Dutch type designers*, but because beyond the small top tier there are in fact too many to mention - which would make it unfair (and a lot more work!) to cut off at 10. <br> <br>* Although my particular way of seeing Design (as opposed to Art posing as Design) does in fact exclude many people others might put at the top of their list. <br> <br>Anyway, my top tier is something like this: <br> <br>Christoffel van Dijck <br>Johann Michael Fleischman <br>Evert Bloemsma <br>Gerard Unger <br>Wim Crouwel <br>LettError <br>Petr van Blokland <br>Luc[as] de Groot <br>Thomas Milo <br>Bram de Does <br> <br>Well will you look at that - in the end I got exactly 10 after all!  :-) <br> <br>hhp</p>"
