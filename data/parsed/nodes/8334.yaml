    date: 2004-12-24T10:28:00
    date_raw: 24 Dec 2004 — 10:28am
    votes: null
    html: "<p>In no particular order: <br> <br>The Elzevirs <br>Hendrik van den Keere <br>Christoffel van Dijck <br>Jan van Krimpen <br>Gerard Unger <br>Fred Smeijers <br>Chris Brand <br>Evert Bloemsma <br>Martin Majoor <br>Peter Matthias Noodzij <br> <br>I have excluded non-Dutch designers working in the Netherlands (Fleischmann, Kis, etc.). Remember that I am a book typographer, so my list tends toward more \"conservative\" design (e.g., not LettError stuff, which is good, I just can't use it much for my work). <br> <br>The <i>Dutch Type</i> book is a good resource, as is <a href=\"http://cgm.cs.mcgill.ca/~luc/holland.html\">Luc's page</a> on the Dutch font scene.</p>"
    html_clean: "<p>In no particular order: <br> <br>The Elzevirs <br>Hendrik van den Keere <br>Christoffel van Dijck <br>Jan van Krimpen <br>Gerard Unger <br>Fred Smeijers <br>Chris Brand <br>Evert Bloemsma <br>Martin Majoor <br>Peter Matthias Noodzij <br> <br>I have excluded non-Dutch designers working in the Netherlands (Fleischmann, Kis, etc.). Remember that I am a book typographer, so my list tends toward more \"conservative\" design (e.g., not LettError stuff, which is good, I just can't use it much for my work). <br> <br>The <i>Dutch Type</i> book is a good resource, as is <a href=\"http://cgm.cs.mcgill.ca/~luc/holland.html\">Luc's page</a> on the Dutch font scene.</p>"
