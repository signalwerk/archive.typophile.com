    html: <p>I got <i>Dutch Type</i> for Christmas. It's the best type book I've seen in a long time. I highly recommend it. I won't get to start reading it until I finish Kinross' new edition of <i>Modern Typography</i>, which I also got. As well as some strange new machine from Holland that blows bubbles in my coffee.</p>
