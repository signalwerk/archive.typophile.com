    <p>Hi,</p>
    <p>for developing my first typeface I wanted to create a geometric typeface that posesses the advantages of such fonts but is more ‘robust', especially in the caps, than for example Futura.</p>
    <p> <img src="http://content.screencast.com/users/aTremulant/folders/Jing/media/0f59a587-7655-4166-be69-64a3bba9b425/00000633.png" alt="Glyphs" height="auto" width="auto"> </p>
    <p>Currently I am working on spacing my first complete draft. I don't want to presume full capability for continous text with this font-style, but a test to see if the glyphs relate nicely to each other was more of a pleasant surprise than I thought:</p>
    <p> <img src="http://content.screencast.com/users/aTremulant/folders/Jing/media/d7332b63-df45-4169-ad08-16dfdc6d9f96/00000634.png" alt="Continous Text" height="auto" width="auto"> </p>
    <p> <img src="http://content.screencast.com/users/aTremulant/folders/Jing/media/13f17efc-9287-47e8-84e0-007ae83def88/00000632.png" alt="Example" height="auto" width="auto"> </p>
    <p>I know that especially the upper-case S, K, W and Y and lower-case s and y are still very shaky. I would really appreciate overall and specific critique.</p>
    <p>Thanks,<br>
    Jesse</p>
    <p>P.S.: I will be working on a Book-style too.</p>
