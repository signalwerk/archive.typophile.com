      <p>I agree that I might have gone a bit too far with /O, /o and /Q; I am actually glad to go back to more rounded shapes. If you have seen the previous version of /S, I think you'd agree with me that this is a better approach, but I will alter the upper bow a bit. One can definitely tell that it leans backward when it's at the beginning of a word or standing on its own. </p>
      <p>What does everybody think of /W and /4? Any idea for a more regular version of /Ü? And lastly, what about the conversion to a lighter weight?</p>
