    html: |-
      <p>I think you will have to "push harder" with the /o. Here at <a class="freelinking external" href="http://jancharvat.cz/temp/o.png" rel="nofollow">/O comparision</a> there are three /o - the black one is yours, the red one is Futura, the green one is Avantgarde and the blue circle is prefect circle. So you can see even the most geometrical fonts don't have /o as a perfect circle. The most geometrical one - Avantgarde has slightly more mass to the sides. Your /o is nearly perfect circle - it has 1px difference on 400px scale. So I would push bit more to at least 5-10px each side. But not by moving the side nodes more outside, only by moving the bottom and upper tangents more out.</p>
      <p>/S I find nearly most difficult letter to design. It is so different from others. I think the bottom part is ok, so I would move the upper part more to the right. It's nearly at same vertical line with left bottom stroke , but at right side there is big space. On <a class="freelinking external" href="http://origin.myfonts.net/116/fs/u/7a/c4a9a9f910ac6d7e4110e433fab64f.gif" rel="nofollow">Futura /S</a> you can see the upper part is somehow aligned to middle, while having small space on both sides.</p>
      <p>Jan</p>
