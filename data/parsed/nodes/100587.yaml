      <p>I allways like this kind of fonts. I can write you few of my observations:<br>
      - /e make the upper part tighter and the lower part wider.<br>
      - /s middle part should be the widest from the whole body<br>
      - /k and /K should be realted in line angles<br>
      - /o and /O is not good idea to make it a perfect circle (I can't see if you made them like that or not from this previews). In your case, they can be more wider at top and bottom, to make it opticaly stable.<br>
      - /S is falling to left<br>
      - /2, /3, /5, /? should have same stroke ends as C<br>
      - the angle of /4 is weird, try it like 7</p>
      <p>Looking forward to see the changes. It is a fact, that in this area is really tough to make something new.<br>
      Jan</p>
