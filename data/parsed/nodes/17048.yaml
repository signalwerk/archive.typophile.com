      <p>it somehow doesn't read nicely, it feels more like to seperate entities. the 2 doesn't seem to connect naturally to the GO. it might be because of the capitals in GO - have you tried lower case letters? </p>
      <p>i'm also not sure about whether the individual elements really add up to a logo. maybe putting the entire type onto the cards would help giving it a stronger overall shape / contour.</p>
      <p>overall it's a good starting point, but it's not good enough for the viewer to feel that it "absolutely has to be that way, no alternative." (know what i mean?)</p>
