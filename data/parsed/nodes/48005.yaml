    <p>Hey Everyone,</p>
    <p>I’m looking for a font similar to the type Apple used for “me” in the <a href="http://www.apple.com/mobileme/">Mobile Me</a> logo. Something scripty that looks handwritten, but still very clean and readable. Also, it’s essential that the letters connect, because the text itself will be the word “Connect.” Thanks in advance!</p>
    <p>Matt</p>
    <p>Edit: Nevermind... since I know exactly what I’m going for I think I’m going to roll my own. Let me know if you want to see the end result.</p>
