    html: <p>I think the "full serif" version is wonderful. But the sans is mundane, and the "stubby serif" cut isn't working at all it seems... :-(  I think interpolating serifs <i>can</i> work (look at Penumbra), but it might be easier with flaring (as opposed to stubby) serifs. <br> <br>I love the angled serif cuts in the "full serif" version! It seems that they're helping avoid that dreaded "backslant syndrome" that fully upright half-serif designs have - nothing short of a small breakthrough on your part. And the caps are really singing. It's like a butch Avance. <br> <br>(More soon...) <br> <br>hhp <br></p>
    html_clean: <p>I think the "full serif" version is wonderful. But the sans is mundane, and the "stubby serif" cut isn't working at all it seems... :-(  I think interpolating serifs <i>can</i> work (look at Penumbra), but it might be easier with flaring (as opposed to stubby) serifs. <br> <br>I love the angled serif cuts in the "full serif" version! It seems that they're helping avoid that dreaded "backslant syndrome" that fully upright half-serif designs have - nothing short of a small breakthrough on your part. And the caps are really singing. It's like a butch Avance. <br> <br>(More soon...) <br> <br>hhp <br></p>
