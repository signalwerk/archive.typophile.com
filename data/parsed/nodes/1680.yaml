    html: "<p>OK, some concrete suggestions for the \"full serif\" cut: <br> <br>Overall: <br>Shorten descenders. <br>Caps slightly too dark. <br>Work on spacing. <br>Make a Black weight. <br> <br>lc: <br>a: too wide. <br>b: Make the spur the delicate kind. <br>f: longer foot serif; shift bar right; smoothen ascender. <br>g: narrower head; stronger ear; I don't get that trap. <br>k: not sure about that upkick thing. <br>o: too dark. <br>q: give it a delicate ear. <br>r: longer foot serif. <br>t: shift bar right. <br> <br>UC: <br>A: a bit too wide; left diagonal too dark. <br>D: make wider. <br>G: needs work. <br>J: needs work. <br>L: too wide. <br>Q: I don't get that trap. <br>S: a bit too wide. <br>X: too wide. <br> <br>numerals: the 4 looks wrong. <br> <br>Keep it up! <br> <br>hhp <br></p>"
