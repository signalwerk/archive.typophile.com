    <p>Hello</p>
    <p>I'm looking for a rich feeling, classy looking typeface for a men's online buying guide publication. Perhaps something with a serif, although I'm not partial. I have seen ITC Lubalin Graph Demi used elsewhere, and it looks great. We would like to not copy them, however similar recommendations are welcomed. </p>
    <p>Your recommendations are much appreciated. </p>
    <p>Thank you.</p>
