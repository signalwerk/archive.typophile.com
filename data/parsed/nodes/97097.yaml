  html: |-
    <p>Dear buddies</p>
    <p>Some time ago I had tested trying to build a font using makeotf-afdko<br>
    <code>(Font, Version 1.002;PS 1.001;hotconv 1.0.57;makeotf.lib2.0.21895 DEVELOPMENT)</code><br>
    All of supporting data required has been edited from the source file example Adobe "minionpro". The process of generating fonts was successfully and font can be used at least in windows xp. But after I checked this font microsoft font validator, there are some pretty annoying error messages as follows:</p>
    <p>into file: <strong>feature size </strong><br>
    <em>actually I haven't yet understand about the values of parameter, So I put them with random value, and It is succesfully generating error into Microsoft Font Validator (MFV) reviews :)</em></p>
    <p><code><br>
    </code></p><dt><code>feature size {</code></dt><code>
    <dd>parameters 150 3 65 84;<br>
         sizemenuname "Regular";<br>
         sizemenuname 1 "Italic";</dd>
    <dt>} size;</dt>
    <p></p></code><p></p>
    <p>The MFV review as follow:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/Fea-Size_4913.png"></div><p></p>
    <p>into file: <strong>feature family</strong><br>
    <em>I put these:</em><br>
    <code><br>
    </code></p><dt><code>feature ss01 { # Stylistic Set 1<br>
     # Latin<br>
    featureNames {</code></dt><code>
    <dd>	name 3 "Windows descriptive name for stylistic set 01";<br>
    	name 1 "Mac descriptive name for stylistic set 01";<br>
    	name 3 1 0x40c "Windows descriptive name for stylistic set 01";<br>
    	name 1 0 1 "Mac descriptive name for stylistic set 01";</dd>
    <dt>};<br>
    lookup ss012 {</dt>
    <dd>    sub @salt1' [@allnum @all_lc @liga_lc @QUOTE @acute]  by @salt2;</dd>
    <dt>} ss012;</dt>
    <dd>    language AZE ; # Azeri ................</dd>
    <dt>lookup ss012;<br>
    } ss01;</dt>
    <p></p></code><p></p>
    <p>The MFV review as follow:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/SS01_3459.png"></div><p></p>
    <p>into file <strong>"features"</strong>:<br>
    <em>I put these:</em><br>
    <code><br>
    </code></p><dt><code>table OS/2 {</code></dt><code>
    <dd>	TypoAscender 750;	# Top of Ascenders<br>
    	TypoDescender -250;	# TypoAscender UPM<br>
    	XHeight 500;<br>
    	CapHeight 680;<br>
    	WeightClass 700;	# Bold<br>
    	Vendor "camp";<br>
    	FSType 8;		# Editable embedding<br>
    	Panose 2 0 8 5 2 0 0 9 0 4;</dd>
    <dt>} OS/2;</dt>
    <p></p></code><p></p>
    <p>(note: Previously I put the information "width 3;" below "CapHeight 680;", but failed to read by makeotf-afdko, so I treat with suspicion that afdko will give value automatically)</p>
    <p>and here is the MFV error:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/TableOS2_3921.png"></div><p></p>
    <p>Can someone enlightening me?. Thank you in advance for your help and answers slightest.</p>
    <p>Best Regards<br>
    Andi aw. masry</p>
