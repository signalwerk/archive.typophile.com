    <p>Dears,</p>
    <p>I used all the online tools available to detect this font. The closest match i have found is font named COMB.<br>
    For Uppercase letters it looks like as comb. But for lowercase letters COMB uses sans (dashes in letters: i, l etc)<br>
    So, basically i am having troubles with lowercase letters.</p>
    <p>The image is from betting receipt in Turkey. A government owned lottery for football. I believe this is some kind of special font. Any help would be highly appreciated.</p>
    <p>Thanks in advance,</p>
