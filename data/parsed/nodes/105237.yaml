    html: |-
      <p>Hello urfan.alimov,</p>
      <p>The logotype "iddaa" looks to be <a class="freelinking external" href="http://www.myfonts.com/fonts/linotype/helvetica/" rel="nofollow">Helvetica Bold</a> or a variant of it such <a class="freelinking external" href="http://www.myfonts.com/fonts/linotype/neue-helvetica/" rel="nofollow">Helvetica Neue Bold</a>. It's not perfectly printed, but that's the most probable typeface chosen.</p>
      <p>The body text is a tough one. I ran it through <a class="freelinking external" href="http://www.identifont.com/similar?2LA" rel="nofollow">Identifont</a> and that is the best result from my findings on there. It's a proportional, san-serif typeface typical of a receipt that's all I can see from it something similar to this imitation called <a class="freelinking external" href="http://www.fontspace.com/cumberland-fontworks/merchant-copy" rel="nofollow">Merchant Copy</a>. I have also done some good, old Googling and encounter this <a class="freelinking external" href="http://graphicdesign.stackexchange.com/questions/20027/identify-these-fonts-used-on-receipts" rel="nofollow">thread</a> on the graphics forum of the Stack Exchange. Have a read, it appears to suggest a font called <a class="freelinking external" href="http://www.myfonts.com/fonts/green-type/hypermarket/" rel="nofollow">Hypermarket</a>, which looks close to your receipt.</p>
      <p>-Inferno986return-</p>
