    <p>Hey,</p>
    <p>We're a group of students in a Typography I class at the Savannah College of Art and Design. Our assignment was to create a 27th letter for the English alphabet. This is our letterform. Tell us what you think. :D</p>
    <p>(The sound it makes is "pff")</p>
