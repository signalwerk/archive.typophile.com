      <p>Wow, you are amazing! Thank you all very much, that was very quick and very informative!</p>
      <p>Once more the typophile community proved to be a fantastic help – even though this request was not 100% type related (apologies for that).</p>
      <p>Hypothesis corroborated: It’s pretty much a travel across Manhattan, as Linda said; starting in the South at the Bay, going North via City Hall, Municipal Building and Puck Building, then passing Times Square and St. Patrick’s Cathedral, finally arriving at the Central Park area with Dakota and Sheep Meadow – where the further story of ‘Panic Room’ takes place. Great!</p>
      <p>Also thanks to Mark &amp; David for the additional information. Yes, he knows about this book, but he can’t recall its title either, right now.</p>
