    <p>Hello,<br>
    a friend of mine is writing an article about movie title sequences.<br>
    He has a question concerning the famous typographic one from <a href="http://www.imdb.com/title/tt0258000/" rel="nofollow">‘Panic Room’</a>, that might best be answered by locals, or people being familiar with New York City.</p>
    <p>Where exactly are the places shown in the opening credits? Is their sequence a logical one – like a flight through the city, along a certain line? Or is the camera rather randomly jumping from some location to the other?</p>
    <p>Here are 22 stills from the sequence, in order of appearance.</p>
    <p>Thank you very much for your help!<br>
    [Bonus points if you can correctly identify Copperplate Gothic. :-)]</p>
