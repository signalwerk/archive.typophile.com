      <blockquote><p>What is the difference between the "th" in "thin" and "thomist", assuming the "th" in "this" is the unvoiced one?</p></blockquote>
      <p>You have that backwards.<br>
      <strong>th</strong>in = unvoiced dental fricative /θ/<br>
      <strong>th</strong>is = voiced dental fricative /ð/</p>
      <p>As Craig notes, <strong>th</strong>omist is pronounced as in Thomas, i.e. an aspirated alveolar plosive.</p>
