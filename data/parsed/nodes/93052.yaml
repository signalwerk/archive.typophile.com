    html: |-
      <p>Nice to see that little editorial office so worked up they just <em>had</em> to write a blog on it.</p>
      <p>Thorns are nothing special. Only last week I had to typeset an article on African phonology with no less than <em>three</em> new additions to the ever-expanding set of special characters those authors <em>desperately need</em> to convey the subtleties of the language they are writin' about: curly n, curly d, and curly t. Neither of these were in my current repertoire, so I Just Made Them without batting an eye-lid.</p>
      <p>(It did help this was a fine opportunity to test my own home-grown software. It worked just fine. :) )</p>
