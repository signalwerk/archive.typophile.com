      <blockquote><p>...if people had sense they would re-introduce the Thorn and Eth into English.</p></blockquote>
      <p>And use them how? In Anglo-Saxon, the sounds represented by these letters were allographs, so their use in spelling was never consistent. Either letter might be indiscriminately used to represent either a voiced or unvoiced dental fricative.</p>
