    <p>For what it's worth:<br>
    "A rare excitement ran through The New Yorker's copy department last week when it was discovered that a line of Middle English poetry quoted in a piece by Peter Hessler about standing in police lineups had a thorn in it. Usually a thorn, like a splinter, is something you want to remove, with tweezers, or maybe a sterile needle, but this thorn was something we wanted desperately to insert ...."<br>
    <a href="http://www.newyorker.com/online/blogs/books/2012/05/the-thorn-in-the-new-yorker.html#entry-more" title="www.newyorker.com/online/blogs/books/2012/05/the-thorn-in-the-new-yorker.html#entry-more">www.newyorker.com/online/blogs/books/2012/05/the-thorn-in-the-new-yorker...</a><br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/The Thorn_4568.jpg"></div><p></p>
