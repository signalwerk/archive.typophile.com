    date_raw: 18.Mar.2005 6.42pm
    votes: null
    html: <p>Based on the form of the 'w', I'm going to guess that the particular cut was Fortune Light (later called Fortuna) by Bauer. Unfortunately, I can't find any online source; the medium weight is in the imports Appendix of McGrew. <br> <br>The sans is just a bit rounder than Alternate Gothic (which was the original ATF condensed gothic designed to harmonize with Franklin), but I can't find the cut that nails it. There were an awful lot of these floating around then.</p>
