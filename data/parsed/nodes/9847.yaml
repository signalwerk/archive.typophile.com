    <p>Hey guys, <br> <br>I was wondering what these typefaces are on <a href="http://photos8.flickr.com/6809157_bdbc1a7d08.jpg">this Sleepy Beauty poster</a>. I know the type in the middle is hand-done, but the rest I'm not too sure on. <br> <br>Maybe the sans serif is a condensed version of Franklin Gothic? As for the serif, I want to say Clarendon Light, but I'm not sure if it existed during that time. <br> <br><a href="http://photos8.flickr.com/6809156_51dabcc92a.jpg">Serif typeface</a> <br> <br><a href="http://photos8.flickr.com/6809155_9971441877.jpg">Serif typeface close-up</a> <br> <br><a href="http://photos4.flickr.com/6809154_6860850a86_m.jpg">Sans serif typeface</a></p>
