    <p>Hi I am a keen conlanger, and into fonts in an amatuerish way. I was looking into fonts that look pleasant but also easy on the eye, like a newspaper fonts. </p>
    <p>So far I like Garamond, Georgia, Didot, and STkaiti. Also Times to a degree, and Bondoni Antiqua is pleasing in my opinion. I still haven't found one where the cirmcumflex o (Ôô) looks nice. I need a font that is readable in italics, and regular, but is a bit like the a forementioned and can do Macrons, Breves, Carons, Circumflexes, and umlauts. also a nice ð, and ß.</p>
    <p>Any suggestions? I don't mind priced ones as long as it encodes onto PDF's properly, and the price is reasonable(less than $50).</p>
