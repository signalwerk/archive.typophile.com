    html: |-
      <p>Try Minion.</p>
      <p>and</p>
      <p>Have a look at: </p>
      <p><a href="http://www.textism.com/textfaces/" title="http://www.textism.com/textfaces/">http://www.textism.com/textfaces/</a><br>
      <a href="http://www.typographyforlawyers.com/?p=587" title="http://www.typographyforlawyers.com/?p=587">http://www.typographyforlawyers.com/?p=587</a></p>
      <p>Which version of Garamond do you like? The pre-installed one in the Microsoft Office Package, which is just called "Garamond", or a Garamond that came with an Adobe application, like "Adobe Garamond" or even "Garamond Premiere Pro", or another differently called Garamond?</p>
      <p>If you have only the one from the MS Office installation, then you can buy a different one. The Office Garamond is actually a from a different designer, not Garamond himself, and it is as well too light to use it for text. So buy yourself a decent version. The ones named from Adobe are very good choices. Alternatives are Sabon, Augereau, GaramondFB by FontBureau, Granjon, and many others.</p>
      <p>Or get a free (and still incomplete, and maybe not as neat) one. URW "Garamond No8", based on Stempel Garamond can be found in the URW font package here: <a href="http://www.artifex.com/downloads/" title="http://www.artifex.com/downloads/">http://www.artifex.com/downloads/</a> or the ambitious "EB Garamond" in <a href="/wiki/https%3A/%252Fgithub.com/georgd/EB-Garamond/tree/master/otf" class="freelinking" rel="nofollow">Regular</a>, <a href="/wiki/https%3A/%252Fgithub.com/georgd/EB-Granjon/tree/master/OTF" class="freelinking" rel="nofollow">Italic and Bold</a>.</p>
