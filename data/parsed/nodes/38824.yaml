    html: |-
      <p>I’m not sure if this is what you man by format but on a Mac, when we examine the existing font in the finder, for king it says “Font Suitcase”. When I look at it in Fontbook on a Mac, the type is listed as TrueType.</p>
      <p>In terms of off-the-shelf tools, we tried Bitfonter from Fontlab. It has a feature where you can select characters and invert them which is exactly what we want to do. Unfortunately, when we save out the font and try to use it, none of the characters work - they show up as a solid block of colors or just “.”s.</p>
      <p>From speaking with Fontlab:<br>
      1. They don’t do any presales support<br>
      2. Their forums are broken (we applied, were told we needed approval, but tech support says no approval is needed so forums must be broken)</p>
      <p>If anyone knows of off the shelf solutions or how to get Bitfonter to work, that’d be great too :)</p>
      <p>Thanks,<br>
      MMDev</p>
