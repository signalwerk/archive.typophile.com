    html: |-
      <p>TrueType fonts can include “embedded bitmaps” - but in general for Flash use, most fonts are “outline” fonts made to look like bitmap fonts - so Bitfonter is a dead-end here. Reversing outline fonts is possible in FontLab - but as noted no-one would normally bother as every app would let you define font and background colors and that’s how you’d normally reverse things. </p>
      <p>Cheers, Si</p>
