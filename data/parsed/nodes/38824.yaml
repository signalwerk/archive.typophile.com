    <p>Hello,</p>
    <p>I’m looking for some help in reversing some bitmap fonts (see attached image). I don’t do any font editing myself which is why I’m looking for help :)</p>
    <p>If anyone has bitmap font editing experience and can reverse some bitmap fonts for me for usage in Flash, please reply privately by clicking my user name and sending me an email through the contact tab. Please send your contact info including phone number and an estimate for your services or any questions you may have.</p>
    <p>1. I have the fonts on Mac &amp; PC.<br>
    2. Initially I’d like to do a test of reversing a font (Regular and Bold) for mac.<br>
    3. If it works, I’d like to proceed with about 2-3 font families for both Mac &amp; PC.</p>
    <p>Thanks,<br>
    mmdev23</p>
