    <p>Hello!</p>
    <p>Lots of topics here cover the production on a type Specimen for print.<br>
    I want to know (examples or ideias) of type Specimen for film.<br>
    How you (type designer)want your typeface filmed...<br>
    Show letter by letter?<br>
    Combining words?<br>
    White background with black letters,<br>
    etc<br>
    The general ideia is: How to produce a type Specimen for video.</p>
    <p>Thanks in advance<br>
    António Fonseca</p>
