    html: |-
      <p><em>"The concept of the video is to show/teach (to studantes or type designer aspirants) the development of the typeface. The options taken by the designer, etc…"</em><br>
      Interesting. So more of a documentary/educational type thing than a flashy promo piece.<br>
      I like your idea of combining digital data with actually filming printed pieces. After all that's the abstract-to-material process that all people using a font will go through. </p>
      <p>When filming the printed stuff, make sure the image quality really shows off the pieces. Avoid sacrificing quality before going to DVD. Shallow depth of field tends to look aesthetic to people in macro (which is probably because it makes sense when compared with our own visual apparatus). Do you have a good camera at your disposal, with a macro lens? Even better, do you have a good cinematographer at your disposal? And an editor?<br>
      Also, select the samples very carefully, as even the texture of the paper might be quite visible. Think about focus and blur, and about still or moving camera (and be aware that doing moving camera well – especially if this is going to be macro shots – will require some equipment (besides training and/or lots of luck), at the very least a really good video tripod). Also, be prepared to spend a lot of thought and time on lighting.<br>
      (Sorry if I'm obnoxious, and/or stating the obvious. I've been doing a bit of video work, and I'm not aware of how much experience you have with all of this.)</p>
      <p>Anyway: So are you just going to show the fonts and nothing else? It might be way cool to actually interview the respective designers (or maybe just one or two). Maybe you can get them to talk about one or two individual glyphs in depth, and juxtapose/overlay that footage with the actual glyph "coming together"? Or maybe even show them showing/explaining some sketches!<br>
      This may be way beyond your budget or options. But, consider that connecting / getting captured is easier with human faces than typefaces for most people. And if you can't actually travel and meet the designers, talk to them on the phone or have them record a few musings on tape (assuming they're alive today), and play that while you show off the glyphs.</p>
