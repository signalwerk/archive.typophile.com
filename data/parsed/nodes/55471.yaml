      <p>Well, do you want it to be clean (digital data) or realistic/"haptic" (filming a printed sample); immersive or conceptual; dynamic or meditative; informative or exciting…? I'd say how to "film" a font depends on a multitude of variables. Consider the type of font, the font itself, the concept of the video, the target audience, target resolution/compression/platform, run time, and audio.<br>
      Sorry I don't know of any examples. But it might help to compile a list of adjectives or a description of what the finished video should "feel" like, &amp; then dive into film/video theory if necessary and figure out a way to achieve the desired result from there.</p>
