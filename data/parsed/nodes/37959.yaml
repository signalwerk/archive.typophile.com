      <p>I had the same problem on FL 5.0.4 (Win). It made me sick, because all classes were well prepared. Then I discovered, that Assistance reported a glyph duplicated in two classes, and one of them was removed previous day. So I understood that the bug may come from file "memory".<br>
      I saved my classes, deleted them (and the kern feature), closed the program, launched again and imported the saved classes. Voila! No bad report!</p>
