  html: |-
    <p>I'm new to class kerning, I read the Cabarga book step by step, read the confusing FL5 manual as well, made some classes, made the kern feature as indicated (which I put after the liga feature) updated it, and apparently everything was going fine, but after some more pairs, on compiling and/or generating, I get this annoying (and worrying) message:</p>
    <p>"Start of new pair positioning subtable; some pairs may never be accessed: etc etc"</p>
    <p>I read some threads trying to find out about this and someone suggested inserting a "subtable;" line every 100 lines or so in the kern feature. I did this also but when I export my PS flavoured OT font, once more there's the message! (grrr!)</p>
    <p>Anyone knows why this is? I know this might be quite a basic thing for most of you but I'm really going nuts trying to find out what it was that I did wrong, or else I'll have to stick to my very dated way: manual kerning and simple TT and PS formats and shame for the great ligatures, alternates and so on...</p>
    <p>I'd really appreciate your help here, I hope this is something simple and I'm only drowning in a glass of water... Thanks!</p>
