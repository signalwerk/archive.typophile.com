      <p>&gt; <em>“Start of new pair positioning subtable; some pairs may never be accessed: ...”</em></p>
      <p>This message usually appears when a given glyph is contained in more than one kern class. What triggers the message is when these classes — that have a glyph in common — are used on the same side of two or more class kern pairs (within the same subtable). E.g.:<br>
      <code><br>
      feature kern {<br>
      @_B_LC = [b];<br>
      @_O_LC = [o oacute];<br>
      @_ROUND_LC_LEFT = [o b];</code></p>
      <p>pos @_B_LC @_O_LC -20;<br>
      pos @_ROUND_LC_LEFT @_O_LC -30;<br>
      } kern;<br>
      </p>
      <p>The example above generates the following message:<br>
      <code>[WARNING]  Start of new pair positioning subtable; some pairs may never be accessed: [b o] [o oacute]</code></p>
      <p>The warning means that some pairs downstream (second 'pos') are being masked by pairs defined upstream (first 'pos'). Effectively, these two class kern pairs are equivalent to the following singleton pairs,<br>
      <code><br>
      pos b o -20;<br>
      pos b oacute -20;</code></p>
      <p>pos o o -30;<br>
      pos o oacute -30;<br>
      pos b o -30;<br>
      pos b oacute -30;<br>
      <br>
      where it becomes clear that there are conflicting/repeated 'pos' commands. (BTW, pairs defined upstream take precedence).</p>
      <p>All this to say that, as a rule of thumb, each glyph should only be included in one left kern class, and one right kern class, maximum. (This is by no means a strict rule, but you'll save yourself a few headaches if you follow it)</p>
