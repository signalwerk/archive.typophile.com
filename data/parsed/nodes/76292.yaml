    <p>For those who use AGL (<em>Adobe Glyph List</em>), AGLFN (<em>Adobe Glyph List for New Fonts</em>), and the <em>ITC Zapf Dingbats Glyph List</em>, they are now available via a new open source project, <a class="freelinking external" href="http://sourceforge.net/adobe/aglfn/" rel="nofollow"><strong>AGL &amp; AGLFN</strong></a>, which is hosted at <a class="freelinking external" href="http://sourceforge.net/adobe/" rel="nofollow">Open @ Adobe</a>. For those who are not aware, Open @ Adobe is our open source portal at SourceForge. Also included in this open source project is the <a class="freelinking external" href="http://sourceforge.net/adobe/aglfn/aglspec/" rel="nofollow"><em>AGL Specification</em></a>, which is now an open specification.</p>
    <p><a class="freelinking external" href="mailto:lunde@adobe.com" rel="nofollow">Dr. Ken Lunde</a><br>
    Senior Computer Scientist, CJKV Type Development<br>
    Adobe Systems Incorporated</p>
