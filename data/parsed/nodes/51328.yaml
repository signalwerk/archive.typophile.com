    <p>Hello! This would have been posted sooner but I've been waiting for Myfonts to approve an introductory discount offer and for the news release to show up on Fontlover.com. While we're waiting for all that, here's the release:</p>
    <p>==================begin news release==================</p>
    <p>s e n t i n e l &nbsp;t y p e &nbsp;presents</p>
    <p>a font designed by <a href="http://www.kingdomofawesome.com/" rel="nofollow">Haley Fiege</a> and produced by <a href="http://www.myfonts.com/person/arboghast/james/" rel="nofollow">James Arboghast</a></p>
    <p><a href="http://www.myfonts.com/fonts/sentinel/soft-serve/" rel="nofollow">S O F T &nbsp;S E R V E</a></p>
    <p>Looking like happy frosting on a cupcake at a twiddle bug party, this bouncy food entry from Canadian designer Haley Fiege turns Sentinel's Jellybrush type into organic happiness you can spread on pancakes, ice-cream, sorbets. Use it for sauces and condements, oh peanut butter! Hotdogs, sandwich fillings, rubbery items. Anything really.</p>
    <p><a href="http://www.myfonts.com/fonts/sentinel/soft-serve/" rel="nofollow"></a></p><div class="imageWrap"><a href="http://www.myfonts.com/fonts/sentinel/soft-serve/" rel="nofollow"><img src="http://typophile.com/files/soft_serve_5683.gif"></a></div><br>
    Soft Serve sample designed by Haley<p></p>
    <p><strong>Language Support:</strong> Latin 1 (Western 1252/Mac OS Roman) + Turkish<br>
    <strong>Formats:</strong> OpenType (TrueType coming very soon. Sorry folks, I just plain forgot to make them)<br>
    <strong>Regular Price:</strong> $24.90<br>
    <strong>Snipped Price: $17.43</strong><br>
    <strong>Link: <a href="http://www.myfonts.com/fonts/sentinel/soft-serve/" rel="nofollow">Check it out here</a></strong></p>
    <p>=================end news release====================</p>
    <p>Grab some <a href="http://www.flickr.com/photos/arboghast/sets/72157608667441532/" rel="nofollow">samples from my flickrstream here</a>.</p>
    <p>And here are some stickers for you:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/icecreamstickers_4162.jpg"></div><br>
    Ice-cream stickers designed by Haley.<p></p>
    <p>And here's a picture of Shirley Temple:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/shirley_5439.jpg"></div><p></p>
    <p>Well it was in the IN drive with Haley's ice-cream stickers and I love Shirley Temple, so you're getting her as well, okay? I think that's a pretty fair deal. I love me the Shirley Temple. Youth—it's the one thing worth having.</p>
    <p><strong>About the font:</strong> I suggested to Haley she could make a more commercial and appealing version of my <a href="http://www.myfonts.com/fonts/sentinel/jellybrush/" rel="nofollow">Jellybrush font</a>. Haley loved the idea because that one is right up her street. Nobody does cute better than Miss Fiege can. She did a great job on it, then passed it back to me for refinement and product finishing.</p>
    <p>So for the curious, all glyphs in the lower case of Soft Serve are Haley's designs except the new <strong>x</strong> by yours truly, and most of the cappies are Haley-tweaked versions of Jellybrush capitals.</p>
    <p>It was the kind of beautiful, smooth-running collaboration you dream about.</p>
    <p>When the introductory discount offer comes online I'll post that.</p>
    <p>j a m e s</p>
