      <p>I'm fairly certain that's legal in the US and probably in most countries. For a bit more artist integrity and to help further your own understanding and skill, it would make sense for you to use that as a start, but embellish upon it so the the piece of finished lettering doesn't end up looking like a mediocre drawing of a font. If it's a well known font you should consider going even further in your interpretation as anyone would easily realize its a copy. </p>
      <p>Generally speaking its considered OK for people to mimic another person's work for learning purposes, but not to copy and display as their own. Doing this with a published font falls somewhere slightly out of that parameter, but is probably within legal limits.</p>
