    <p>I'm practicing hand lettering and have come across some fonts I like while browsing font stores on the web.<br>
    If I look at these fonts and draw them free hand with just a pencil and paper, am I infringing on the font's copyright?<br>
    I plan on selling the finished piece I create. </p>
    <p>I am NOT printing the font and tracing over it. I am NOT tracing over an image of the font in Illustrator.<br>
    However, I AM looking at the font and free-hand drawing it. </p>
    <p>Once I'm finished looking at the font and free-hand drawing it (NOT TRACING), it looks very similar but IS NOT an exact copy.<br>
    I feel my hand drawn version of the font is not an exact copy but does closely mimic the original font.<br>
    Again, I AM NOT TRACING, I am free-hand drawing while looking at the font to imperfectly replicate it.</p>
    <p>I'm just starting out hand lettering, can anyone help steer me in the right direction?</p>
