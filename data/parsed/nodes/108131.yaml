      <p>Mark, why not just license the font. As an artist you understand the effort that goes into creating a work like this. The license fee (say $10 to $30) seems reasonable if you plan to profit from the font, even if it's not legally required?  This is more of an ethical question rather than a legal question, no?</p>
      <p>Cheers, Si</p>
