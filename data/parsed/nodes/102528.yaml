      <p>Hi Matthew and welcome to Typophile. Don't be surprised, most of the brilliant design educators who had the greatest impact on me were not the greatest designers as I imagined them to be. </p>
      <p>Regarding online resources; <a class="freelinking external" href="http://ilovetypography.com/" rel="nofollow">I Love Typography</a> is a great starting point. Few other websites which I have in my mind at the moment are: <a class="freelinking external" href="http://typefoundry.blogspot.com/" rel="nofollow">typefoundry.blogspot.com</a>, <a class="freelinking external" href="http://66.147.242.192/~operinan/index.html" rel="nofollow">briem.net</a>, <a class="freelinking external" href="http://www.100types.com/" rel="nofollow">100types.com</a>, <a class="freelinking external" href="http://kupferschrift.de/cms/" rel="nofollow">kupferschrift.de</a>, <a class="freelinking external" href="http://www.paulshawletterdesign.com/" rel="nofollow">paulshawletterdesign.com</a>, <a class="freelinking external" href="http://www.microsoft.com/typography/default.mspx" rel="nofollow">Microsoft.com/typography</a>, <a href="/wiki/https%3A/%252Fwww.typotheque.com/articles" class="freelinking" rel="nofollow">typotheque.com/articles</a>, <a class="freelinking external" href="http://fontfeed.com/" rel="nofollow">fontfeed.com</a>, <a class="freelinking external" href="http://typedia.com/" rel="nofollow">typedia.com</a> and <a class="freelinking external" href="http://typographica.org/" rel="nofollow">typographica.org</a>.</p>
      <p><a class="freelinking external" href="http://typographica.org/typography-books/the-elements-of-typographic-style-4th-edition/" rel="nofollow">The Elements of Typographic Style</a> by Robert Bringhurst appears to be a popular read amongst designers and typographers, some other books which I enjoyed reading were: <a class="freelinking external" href="http://www.goodreads.com/book/show/463387.Counterpunch" rel="nofollow">Counterpunch: Making Type in the 16th Century, Designing Typefaces Now</a> by Fred Smeijers, <a class="freelinking external" href="http://www.amazon.com/Anatomy-Typeface-Alexander-S-Lawson/dp/0879233338/ref=pd_sim_b_1" rel="nofollow">Anatomy of a Typeface</a>  by Alexander S. Lawson, <a class="freelinking external" href="http://www.amazon.com/Alphabet-History-Evolution-Design-Letters/dp/0823001709/ref=sr_1_4?s=books&amp;ie=UTF8&amp;qid=1366871880&amp;sr=1-4&amp;keywords=allan+haley" rel="nofollow">Alphabet: “The History, Evolution, and Design of the Letters We Use Today”</a> by Allan Haley. All of the books by <a class="freelinking external" href="http://www.doyaldyoung.com/" rel="nofollow">Doyald Young</a> are a must in my opinion, if you can afford them. </p>
      <p>Additionally, see also journals and magazines like: <a class="freelinking external" href="http://codexmag.com/" rel="nofollow">Codex,</a> <a class="freelinking external" href="http://www.eyemagazine.com/" rel="nofollow">Eye</a>, <a class="freelinking external" href="http://www.baselinemagazine.com/" rel="nofollow">Baseline</a> and <a href="/wiki/www.creativereview.co.uk" class="freelinking" rel="nofollow">Creative Review</a>.</p>
