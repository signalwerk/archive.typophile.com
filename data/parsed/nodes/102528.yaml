      <p>Welcome, Matthew.<br>
      One great way to learn is to show your work on Typophile. Not all cases lead to fruitful feedback, but sometimes one's cup runneth over!<br>
      <a href="http://typophile.com/node/83333" title="http://typophile.com/node/83333">http://typophile.com/node/83333</a></p>
      <p>Great compilation, Sevag! I would add these three books: "Letters of Credit" by Tracy, "Designing Type" by Cheng, and "Letter Fountain" by Pohlen.</p>
      <blockquote><p>most of the brilliant design educators who had the greatest impact on me were not the greatest designers</p></blockquote>
      <p>Indeed. Because actually designing things versus being able to communicate about designing things are two different talents/skills. Sort of like chefs versus food critics. The important thing is for each side to appreciate the indispensability of the other.</p>
      <p>hhp</p>
