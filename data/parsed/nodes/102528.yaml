  html: <p>Hi all. This will be my first post on Typophile. I am very much interested in learning more about type design and it is my ultimate goal to design a few of my own. I already have some ideas floating around my sketchbook. Can anybody offer me some advice on how/where to begin. Also, what are some good resources (books, websites, etc.)? I am studying GD in school at the moment but none of my professors have ever designed their own typeface. Thanks!</p>
