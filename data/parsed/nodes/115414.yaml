    html: |-
      <p>This might exist as a font, but I don't recall seeing it.<br>
      If you want just the stencil R, its very easy to make from Champ Ultra <a href="http://www.myfonts.com/fonts/bagraphics/champ-ultra/" title="http://www.myfonts.com/fonts/bagraphics/champ-ultra/">http://www.myfonts.com/fonts/bagraphics/champ-ultra/</a><br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/ChampUltraAsStencil_3815.jpg"></div><br>
      The original is the black outline, the red is the edited result. No curves were modified. Some positions were shifted and cove serifs were changed to square slab. Note that after the stencil is cut, the RHS is shifted to the right.<br>
      Don<p></p>
