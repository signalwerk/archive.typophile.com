      <p>david said:<br>
      &gt;   What line of crap?</p>
      <p>well, i said "line o' crap", not "line of crap".  but, it was this one...</p>
      <p>&gt;   As long as nearly all the computer screens in the universe</p>
      <p>"in the universe"?  that's a pretty clear signal you're talking crap.<br>
      hyperbole and sarcasm are great friends; they vacation together.</p>
      <p>and "nearly all" is yet another clear signal.  judging by the numbers<br>
      for internet-exploder-6-and-7, many of our computer screens now<br>
      (even in the first world) are hooked up to aging p.c. machines which<br>
      might not even have (working) printers attached to them any more...<br>
      and inkjet printers (and dot-matrix?) aren't exactly known for quality,<br>
      especially when their users are stretching the cartridges to save cash.</p>
      <p>&gt;   are enabled only or primarily to preview print on computer screens,<br>
      &gt;   print will never die! ;)</p>
      <p>again, the word "only" here is an _obvious_ tipoff that this is sarcasm,<br>
      and "primarily" right behind it just means that it's not purely sarcastic.</p>
      <p>the notion that any significant number of people print out their e-mail<br>
      to read it was buried -- along with those oldsters -- in the last century.</p>
      <p>and i've never heard -- not even once, not even in jest, mind you -- that<br>
      people print out their twitterstream to read it.  (but it'd be a good joke!)</p>
      <p>nor do we hear about blog posts being printed, or facebook pages,<br>
      or myspace pages, or wikipedia articles, or live-journal pages, or...</p>
      <p>and if you're gonna print out stuff from a news-site, you might as well<br>
      have bought the newspaper, and we all know how newspapers are doing.</p>
      <p>so the only way your sentence makes any sense is to turn it on its head:<br>
      the only reason people still use print is to proofread stuff for the screen.</p>
      <p>and given the apparent absence of proofreading out there in the world,<br>
      i'd say there isn't even much of _that_ type of printing going on...</p>
      <p>cory said it years ago, and it only becomes more true as time passes by:<br>
      more and more we are reading less from paper, and more from the screen.</p>
      <p>&gt;   people will need to print from the screen to read it, or buy books</p>
      <p>well, there you go!  bookstores!  tomorrow's growth industry!  for sure!</p>
      <p>-bowerbird</p>
