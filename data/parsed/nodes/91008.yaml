    <p>Hi everyone,</p>
    <p>Quick post looking for suggestions.  I will be going down to London for the day in the next couple of weeks and was wondering if anyone had any suggestions on good typographical things to do while I'm down there?</p>
    <p>By typographical, I mean exhibitions, museums, book stores, any cool type/graphic design things to help fill my day that I wouldn't normally get to see.</p>
    <p>Thanks in advance.</p>
    <p>Simon</p>
