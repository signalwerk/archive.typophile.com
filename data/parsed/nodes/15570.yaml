    html: |-
      <p>Yah, I guess it does look a lot like Futura. The reality is, I began this set from experimenting with the diagonals in the UC M. Then came the rest of the set. The thing is, with grays, it's more difficult keep from infringing on other pixel designers' work, because a lot of character set variations over the years (in the pixel font world) came from the creative ways different designers would represent curvature and diagonals.</p>
      <p>The short of it is, the letters were defined by the pixels you left out, as much as they were by the pixels you put in.</p>
      <p>Now, everything is different in the grayscape. Building small characters actually fills in all of the traditional 'holes' that designers used in the past. Further, the 'nuance' of how a designer might use grays, or the patterns of grays, to build a character's features, are much more subtle at a glance than before.</p>
      <p>So, the reason this font ended up looking like Futura, was that I had several cool-looking characters that I wanted to build a font out of, but wanted to avoid 'aping' other designer's character sets. In this particular case, I was really trying to distance myself from Susan Kare's work. At this pixel size, her work is really definative. There are other designers, like Craig Kroeger, who have some pretty amazing character sets too, and I wanted to stay away from all of them the best I could.</p>
      <p>So, I really focused on character widths and the shaping of the tiny curves with different grays, all while trying to create a set that had some of the more classic proportions found in traditional typography.</p>
      <p>A good example of this kind of classic look in a pixel font, in my opinion, is Quadratis, by Miguel Hernandez.</p>
      <p>As for the purpose of such a small font: why, it may be used anywhere stylish typography is valued. As accent text on websites; see speakup. As navigation buttons and widgets; see slideshow pro. As small titles and subtitles on blog entries; see shaun inman. And of course, as small, sophisticated typefaces in hand-held devices and cell phones.</p>
      <p>Thanks for your comments, Héctor. I really appreciate it.</p>
      <p>Tyler</p>
