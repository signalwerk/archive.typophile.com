  html: |-
    <p>Trying to pack big font nuance into a teenie-tiny footprint—using grays, of course. A lot of these characters wouldn't work for me at this size, using traditional pixel building techniques.</p>
    <p>The grays, however, allow me to put together a character set that looks more sophisticated than usual. Perhaps not 'book' sophisticated, but at least headed in that direction.</p>
    <p>I don't think I used very many grays. Either five, or six, I think.</p>
    <p>Any thoughts? Does the UC Y raise anyone's hackles? I was having trouble with it, so I borrowed from the UC J.</p>
