    <p><strong>n.</strong> Swash: A decorative, (and usually natural) extension of a <a href="/wiki/stroke" class="freelinking" rel="nofollow">stroke</a> that one might perform in calligraphy.</p>
    <p><strong>adj.</strong> Swash: A term used to describe a <a href="/wiki/typeface" class="freelinking" rel="nofollow">typeface</a> that is characterized by swashes.</p>
