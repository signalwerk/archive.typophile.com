    <div class="info">Submitted by <a href="/user/7006" title="View user profile.">paul d hunt</a> : 28.Nov.2005 6.46am </div>
      <p>Dear friends of Gentium,</p>
    <p>We’re thrilled to announce that we have re-released Gentium under a<br>
    free/open-source license - the SIL Open Font License (OFL). This will<br>
    give<br>
    much greater freedom to everyone using the fonts, and allow for easier<br>
    inclusion in free, open-source and commercial software packages.</p>
    <p>The only changes we’ve made in addition to the licensing change were a<br>
    couple of bug fixes releated to PostScript glyph names and to the<br>
    reported<br>
    italic angle. </p>
    <p>All of this can be found at</p>
    <p>    <a href="http://scripts.sil.org/gentium" title="http://scripts.sil.org/gentium">http://scripts.sil.org/gentium</a></p>
    <p>We know that many of you have been waiting for eons for Bold and Bold<br>
    Italic, more ancient Greek letters (like the digamma), etc. We have<br>
    been<br>
    working on these (very sporadically) over the last couple of years, but<br>
    they’re not ready yet. We hope to have a greatly improved set of<br>
    Regular and<br>
    Italic out mid next year, and then work on completing the additional<br>
    weights.</p>
    <p>In the meantime, if the lack of one letter is hindering you, the OFL<br>
    now<br>
    gives you the freedom to change the fonts, and even distribute modified<br>
    versions - with some conditions. We also warmly welcome your<br>
    submissions of<br>
    work to be included in the main Gentium project. See the Status page on<br>
    the<br>
    web site for details.</p>
    <p>Thanks for your continued interest in Gentium.</p>
    <p>Victor Gaultney<br>
    Gentium /at/ sil.org</p>
