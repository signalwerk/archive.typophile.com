      <p>Okay I've uploaded two new files.  One of them is the test file without cyrillic distortion as well as another sample text in modern-day Bulgarian since the old Cyrillic doesn't quite look the same.  </p>
      <p>As should be obvious in the glyphList file there are a number of characters still in the process of being made, I just took the output directly from FontForge's print entire font function.</p>
      <p>I think the tails look a lot nicer now, I realised I had them only about half as thick as they should be (basing the thinnest part of the tail on the thinnest part of the lowercase O).  I also gave it an ever so slight rounding off on the edge and that's made a big difference from my POV.  The eth has also been updated.  </p>
      <p><em>«El futuro es una línea tan fina que apenas nos damos cuenta de pintarla nosotros mismos.» (La Luz Oscura, por Javier Guerrero)</em></p>
