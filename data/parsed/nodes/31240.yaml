      <p></p><div class="imageWrap"><img src="http://typophile.com/files/allpurposetemp_4176.PNG"></div><p></p>
      <p>1. Garamond Premier has classical stress. 2. Minion has modern stress. (Note which stroke is the thick one in each letter.) I don't know if these are the broadly accepted terms for the two kinds of stress, but they work okay for me.</p>
      <p>As for a "source" for your tails, I can't recommend copy-pasting it from anything in particular; much better is designing it freehand. The "a" might be a good place to get inspiration, but definitely don't copy it. Design it to look good; that's all I can really say.</p>
