      <p>Berling is actually a pretty "progressive" design... for Latin. Which is why Bill Hill chose it for the original MS Reader. But its extreme vertical proportions are pretty much guaranteed to cause problems in other scripts, including Armenian.</p>
      <p>BTW, I know I still owe you a proper review of your Armenian.<br>
      Especially since I admire the fact that you're working on it at all!</p>
