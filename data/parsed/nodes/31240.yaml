      <p>What the hell, things are quiet on the home front - I'll just do it now.</p>
      <p>BTW, I'm going just by your TypeSample2; your glyphList isn't coming up<br>
      for me, which means I'm almost certainly not seeing all your characters.</p>
      <p>The main structural problem is where you're missing parts, like the rightward bars at the bottoms of za and liwn. A much less obvious but almost as important structural issue is the severe shortness of the descenders (coming from Berling); besides making the result less readable and less culturally authentic, this also results in some letters looking pretty horrible, like the sha, cha and jheh.</p>
      <p>Also, the following letters are malformed:<br>
      - yiwn is way too wide.<br>
      - ca is just mangled.<br>
      - eh needs to be wider, with a stronger descending curl.<br>
      - ja is a Latin pastiche.<br>
      - What's that flick in the AYB?</p>
      <p>There's issues, like the ho being too Latinized,<br>
      but those are on another level of refinement.</p>
      <p>Sorry this took so long!</p>
      <p>hhp</p>
