      <p>Nice catch on it being based on Berling.  I've fallen in love with the font and been working on it since.</p>
      <p>What is a better source to use for the tails in Greek?  I was working with a slightly smaller O and chopping at the extrema on the right.  It's my first attempt at anything non-Roman so I figured I'd still screw up a lot, although most of the native Greeks (granted, not type face designers, but do programme localisation) that saw it didn't notice anything.  How would the chi and lambda look in a "modern stress"?  A much thinner top left to bottom right stroke?</p>
      <p>Incidentally, the os are unchanged from the original Berling (they are just set as references to the Latin o).</p>
      <p><em>«El futuro es una línea tan fina que apenas nos damos cuenta de pintarla nosotros mismos.» (La Luz Oscura, por Javier Guerrero)</em></p>
