      <p>So these are meant as complements to Berling? Okay. Let's see what I can say about them.</p>
      <p>I'll start with the Greek. The contrast is one thing that's getting you. You have thins that are way too thin (iota, mu, delta, psi, tau, epsilon, eta, finial sigma) and thicks that are too thin (phi). A lot of your letters look warped, like the mu, upsilon, delta, alpha. The kappa has overhang. The nu has a terminal with no relatives in any of your other letters; the gamma and the terminal of the bottom beta bowl are similarly alien. Also, I think you should have just one stress scheme in the font--the lambda and chi have old-style stress, but the rest of the alphabet is modern. One thing that's bugging me throughout the alphabet is the outstroke/instroke, the one with a little bit of thickness on the end (iota, tau, pi, eta, upsilon, and others).</p>
      <p>In all the scripts, I'm seeing more thickness on the right side of the o than on the left. (omicron, o, Russian o).</p>
      <p>I can't really offer any critique on the Russian until I see a sample that isn't garbled.</p>
      <p>The ð should be designed of its own accord, not put together from an inverted 9.</p>
      <p>I can't really say anything about Vietnamese or Armenian, though I imagine Hrant might come by and say something about the latter.</p>
