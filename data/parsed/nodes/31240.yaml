    <p>I've been working to add a number of new characters to my font.  In the file I'm attaching, I've got one page each from Homeric Greek (polytonic), Golden Age Spanish, Old Church Slavonic, Anglo-Saxon, Vietnamese, and Armenian.  How well does the font hold up in each one?  Is there anything that strikes anyone as odd in any of them?  The last page includes some random quotes from Wikipedia to show off how each script "feels" in the presence of the others.  Any suggestions?</p>
