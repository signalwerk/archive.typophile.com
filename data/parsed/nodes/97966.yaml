    <p>I am trying to identify a font I’ve seen in Paris, for the communication of “Les Ateliers de Paris”.<br>
    The same font is used here: <a href="http://www.marieclaireidees.com/data/photo/w308_c17/boutique-ephemere.jpg" title="http://www.marieclaireidees.com/data/photo/w308_c17/boutique-ephemere.jpg">http://www.marieclaireidees.com/data/photo/w308_c17/boutique-ephemere.jpg</a></p>
    <p>Anyone can help me?</p>
