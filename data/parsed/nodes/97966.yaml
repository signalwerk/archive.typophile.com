      <p>Oups, I’ve been searching a lot for it, and finally I’ve found it after publishing this post…<br>
      It should be Gravur Condensed, by Lineto <a href="http://lineto.com/The+Fonts/Font+Categories/Text+Fonts/Gravur+Condensed/" title="http://lineto.com/The+Fonts/Font+Categories/Text+Fonts/Gravur+Condensed/">http://lineto.com/The+Fonts/Font+Categories/Text+Fonts/Gravur+Condensed/</a></p>
