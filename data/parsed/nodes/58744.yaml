    <div class="info">Submitted by <a href="/user/5340" title="View user profile.">letterbeeld</a> : 5.Jun.2009 2.36am </div>
      <p>In Summer 2009 the KORT project ’Eetbaar landschap’ (Edible Landscape) takes place at the Moerenburg terrain in Tilburg, the Netherlands. The project is coordinated by Ester van de Wiel. Talking with her, the idea was born to make a poem built out of apples. The text was written by the Dutch writer Nick Swarth:<br>
    Ik ben door mijn dagelijks maal geroerd, / ik ben geroerd door mijn eten. / Mijn lichaam benut de energie om haar / cellen uit te wonen. Van die parasitaire / toeren, dat moet een mens wel roeren.<br>
    I’ve been stirred by my daily meal, / I’ve been stirred by my food. / My body uses the energy / to ruin its cells. Such parasitic feats / infer they’re bound to make you stir.<br>
    (Translation: Willem Groenewegen)<br>
    Sander Neijnens designed an apple alphabet, based on his typeface Trunk. The poem was realised on May 31, 2009 with 3034 apples.<br>
    For further information: <a href="http://www.plekgedichten.nl/dailymeal.html" title="http://www.plekgedichten.nl/dailymeal.html">http://www.plekgedichten.nl/dailymeal.html</a> </p><div class="imageWrap"><img src="/files/Appelgedicht_foto_Nick_Swarth_5925.jpg"></div><p></p>
