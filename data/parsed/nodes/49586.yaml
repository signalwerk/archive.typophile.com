    html: |-
      <p>Hi James,</p>
      <p><a href="http://www.aqworks.com/2004/10/15/japanese-typography-on-the-web-and-beyond-part-one/" title="http://www.aqworks.com/2004/10/15/japanese-typography-on-the-web-and-beyond-part-one/">http://www.aqworks.com/2004/10/15/japanese-typography-on-the-web-and-bey...</a></p>
      <p><a href="http://www.aqworks.com/2004/10/27/japanese-typography-on-the-web-and-beyond-part-two/" title="http://www.aqworks.com/2004/10/27/japanese-typography-on-the-web-and-beyond-part-two/">http://www.aqworks.com/2004/10/27/japanese-typography-on-the-web-and-bey...</a></p>
      <p>There are out of date and more web focused, but may help you get oriented with the basics.</p>
      <p>Some quick tips:</p>
      <p>Almost all body text is justified.</p>
      <p>You can set up composite fonts in InDesign to use Western and Japanese fonts inline together, with InDesign making automatic sizing/alignment adjustments based on rules you define.</p>
      <p>There are rules for widows, maybe too much to explain here, but if you search around on the web you should be able to find them (maybe search for something about japanese writing rather than design)</p>
