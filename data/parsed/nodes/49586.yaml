      <p>James,<br>
      I have talked with Diane Burns at TechArt before -- they do a lot of Japanese work with InDesign. They also have some templates that provide access to Japanese features from the Roman build of InDesign available for download.  I found this <a class="freelinking external" href="http://www.techart.com/downloads/ID&amp;WL-Part2.pdf" rel="nofollow">article</a> using Google that looks pretty useful and contains information about their templates.</p>
