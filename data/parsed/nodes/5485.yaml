  html: "<p>Hi, I'm new here. I'm studying graphic design in Chile... really far away from most members on this forum. <br>For my typography exam I have to make a book that has different chapters regarding typography, like history, design, construction of the letter, etc... The book has to be based only on one letter of the alphabet.  <br>I chose the letter \"A\". One of the sections is about showing the letter in every day stuff. For example: a ring could be the letter \"o\", or a pair of scissors open could represent the letter \"x\". <br>I'm having trouble finding the letter A, either big or small (A, a) in every day stuff, so any suggestion is greatly appreciated. <br> <br>thank you. <br>Jo.</p>"
  html_clean: "<p>Hi, I'm new here. I'm studying graphic design in Chile... really far away from most members on this forum. <br>For my typography exam I have to make a book that has different chapters regarding typography, like history, design, construction of the letter, etc... The book has to be based only on one letter of the alphabet.  <br>I chose the letter \"A\". One of the sections is about showing the letter in every day stuff. For example: a ring could be the letter \"o\", or a pair of scissors open could represent the letter \"x\". <br>I'm having trouble finding the letter A, either big or small (A, a) in every day stuff, so any suggestion is greatly appreciated. <br> <br>thank you. <br>Jo.</p>"
