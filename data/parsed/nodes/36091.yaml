    <p>Apologies if this has already been posted, but I stumbled upon <a href="http://www.nytimes.com/2007/08/12/magazine/12fonts-t.html?pagewanted=1&amp;ei=5070&amp;en=61082b31529bc061&amp;ex=1187668800&amp;emc=eta1" rel="nofollow">this article</a> recently in The New York Times and I thought you all might find this interesting. Particularly students, or those interested in information design, and environmental graphics/typography.</p>
    <p>James Montalbano, a Typophile frequenter is featured in this article. A great article! On a somewhat personal note, James and Don are to a large degree partially responsible for my interest in typography and information design. Congrats guys! I wish you continued success!</p>
