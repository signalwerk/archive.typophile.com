      <p>«Rundpost» and «Deutsches Gemeinschaftsblatt» are most likely custom lettering.<br>
      The official term for this abstract blackletter style is «Schlichte Gotisch» or «Gebrochene Grotesk».<br>
      The other Schlichte Gotisch looks like Tannenberg («Folge 34 / 26. August 1939»).</p>
