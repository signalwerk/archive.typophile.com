      <p>Can anyone look at Rorschach tests and not see something perverted?</p>
      <p>I know already that Tannenberg et al are, one might say, blackletter sans, like one can call News Gothic an antiqua sans -- a plain, simplified typeface.</p>
      <p>Our brains, I once read, are pattern-matching/-seeking devices. A look at the thick lines of Tannenberg Fett, specifically the T's stem, yields a match with a cavalry boot. Or the bottom end of a gutter drainpipe. Or a broken mallet.</p>
