    html: |-
      <p>Arun</p>
      <p>Thanks very much for your help, I think you will have a lot of influence of my work right now...</p>
      <p>Yes I know I got the Devanagari - Bangladesh connection wrong. Is it correct to say that it is similar?</p>
      <p>I will tell you why I am so interested, I am designing a typeface to be used on the back of a football (or soccer) team here in England, West Ham United - have you heard of them?</p>
      <p>My aim is to include references to the local Asian community:</p>
      <p>57% Asian/British Asian<br>
         -24% Indian<br>
      38% Muslim</p>
      <p>West Ham fans have a varied history, hooliganism and racism in the 80's are still associated with the club.</p>
      <p>I want my type design to just give a slight nod in the direction of the local community, as a way of saying - you are part of this club. I need to do this in a way so that loyal and passionate supporters - some who are ignorant - may not even notice the hints. It is very important to retain the dedicated fan base.</p>
      <p>I tried hard to make the forms not too inspired by Asian calligraphy, I simply adopted the stroke of the pen at an angle which was common in Devanagari typefaces and not very common in humanist latin typefaces I have looked at.</p>
      <p>I look forward to hearing from you again with your thoughts</p>
      <p>Thanks</p>
      <p>Tom</p>
