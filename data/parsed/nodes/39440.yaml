    html: |-
      <p>Tom, for an Indian those are two very different things! </p>
      <p>In fact Bengali, doesn't even use Devanagari.  </p>
      <p>Are you designing something that looks broadly Indian to a western audience, or is it for an Indian audience?</p>
      <p>If it's the first, you might try making your forms slightly more calligraphic. Also the letters should perhaps not be so geometric and angular. A device that you can try is to knock off the vertical sroke of the 'R' which would make it resemble the consonant 'Ra' in Devanagari. I'd probably use a two-storeyed lowercase 'a' which also may add a faux devanagari quality. (And of course finally render it in Pink since they say "Pink is the Navy Blue of India ;) </p>
      <p>On the other hand if it's being designed for Indians, you'll need to have far more focussed references than now.</p>
