      <p>"the Devanagari - Bangladesh connection wrong. Is it correct to say that it is similar?"<br>
      I think so. Both are, I believe, derived from the same source</p>
      <p>.</p>
      <p>"West Ham United - have you heard of them?"</p>
      <p>Not a lot. Just familiar with the name. But I just looked it upto to get the broader context. Sounds like a really interesting project.</p>
      <p>.</p>
      <p>" I need to do this in a way so that loyal and passionate supporters - some who are ignorant - may not even notice the hints"</p>
      <p>The cues have to be subtle enough not make it too Asian, and overt enough to be recognized. In a way you'd be betting on the Asian Brits to be subtler than the others :) Sounds very  challenging. Also I'm not sure what would be Pan Brit-Asian cues. </p>
      <p>Tom, not being a typeface designer, I'm not sure how to go about this. But if you put up something I'd be more than happy to look at it and respond/help in any possible way.  </p>
      <p>.</p>
      <p>"an angle which was common in Devanagari typefaces and not very common in humanist latin typefaces I have looked at"<br>
      Good idea. We once did an identity on just that premise. The symbol for the same client morphed an infinity symbol with the Devanagari character 'ka':</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/logo_kotak_5576.jpg"></div><p></p>
