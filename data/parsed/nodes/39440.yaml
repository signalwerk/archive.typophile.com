    <p>Hello all,</p>
    <p>Please take some time to ponder over the design of some of these letterforms. I have quickly sketched them out - and the words themselves don't mean anything.</p>
    <p>Can you respond to the following questions too?</p>
    <p>Does the design of the letterforms suggest any reference to a particular country of region?</p>
    <p>What personality does it contain? Calm? Angry? Sporty?</p>
    <p>How can I make it look more Indian?</p>
    <p>Thanks</p>
    <p>Tom</p>
