    html: |-
      <p>&gt; the process doesn’t go the next step and revise the letter forms</p>
      <p>Isn’t that something any good type designer always does, even for basic designs? I would expect JvR to have done that (which of course is not to say it’s not possible to disagree with his particular decisions). The interesting thing about Softmachine is that it makes this basic design principle contextual (which does require OT). This is something Eben has been talking about, although it’s always nicer to see it actually hit the ground.</p>
      <p>&gt; it’s OK to be single</p>
      <p>Fonts without italics, I actually admire - but a gradation of weights is quite useful in my mind - although to some extent Softmachine has that “built-in” (even though I worry about the effects of “blind” tracking to compensate for any weight gain via outlining). BTW, a really nice font with weights only is Stone’s Silica:<br>
      <a href="http://www.myfonts.com/fonts/agfa/silica/" title="http://www.myfonts.com/fonts/agfa/silica/">http://www.myfonts.com/fonts/agfa/silica/</a></p>
      <p>hhp</p>
