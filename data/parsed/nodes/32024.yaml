  html: |-
    <p>I have been excited to see the release of Softmachine ever since Nick was kind enough to show it to me a year or so ago. I really like the face’s personality which is much warmer than VAG rounded or Gotham. Plus It has a <cite>ton</cite> of great features including a really great use of one I have advocated for here on Typophile - Contextual Alternatives - made not to connect letters in a way that better simulates writting ( Nick has done that too in Handsome Pro ) but instead to do something even more essential, to get a better fit - or dare I say it? ...A more ideal ’Notan’*! This may be the ultimate logo font for Web 2.0! </p>
    <p>Check it out</p>
    <p><a href="http://www.veer.com/products/typedetail.aspx?image=SHT0000043" title="http://www.veer.com/products/typedetail.aspx?image=SHT0000043">http://www.veer.com/products/typedetail.aspx?image=SHT0000043</a></p>
    <p><a href="http://www.veer.com/download/pdf/softmachine.pdf" title="http://www.veer.com/download/pdf/softmachine.pdf">http://www.veer.com/download/pdf/softmachine.pdf</a> </p>
    <p>( see page 4 on the PDF )</p>
    <p>Congradulations Nick!</p>
    <p>* I don’t know if Notan is what he was thinking of at the time, but I think that’s what i see happening.</p>
