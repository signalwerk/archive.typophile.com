    date: 2007-03-15T12:21:00
    date_raw: 15.Mar.2007 12.21pm
    votes: null
    html: |-
      <p>Your point on the affinity of layering and outlining is well made.</p>
      <p>Advert wasn’t initially designed for layering, the Rough is a “product extension”. It takes the basic letterforms, grunges them, and revises the metrics. But the process doesn’t go the next step and revise the letter forms, which could have been done without OT. In fact, the combination r_t in the word “Advert” is a prime candidate for changing to look more consistgently “outlined” in layering. </p>
      <p>I had thought about a family for Softmachine, but decided that it’s OK to be single, like Impact.</p>
