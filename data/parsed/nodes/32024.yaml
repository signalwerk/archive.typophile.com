      <p>Yes, the old “tight but not touching” typositor setting, but touching (!)<br>
      Here’s a classic example of a tight-setting type design, and the way it relates to layout; from 1969, art director Woody Woodward.</p>
      <p></p><div class="imageWrap"><img src="/files/ventures_fivef_6370.jpg"></div><p></p>
      <p>Faces like this and Advert are spaced tightly, and may be designed for tight setting, but aren’t designed specifically for outlining — note how the angle of A and W are different, and the splayed legs of Advert’s M.<br>
      Round edges definitely help.</p>
