      <p>I don’t think tight/touching per se is what’s interesting here. Advert isn’t meant for algorithmic outlining, but apparently it is meant to be layered, which is closely related, as can be seen in that illustration; and most significantly here, it’s <cite>spaced</cite> to that end. One might even think that if they had OT back then it would have had contextual spacing as well. We <cite>are</cite> talking about Letterror - well, half of it, but that’s still plenty.  :-)</p>
      <p>hhp</p>
