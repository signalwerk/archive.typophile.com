  html: <p>FOR IMMEDIATE RELEASE <br>--------------------- <br>TypeCon2002 Programming Information Now Available Online. <br> <br>BUFFALO, NY, JUNE 7, 2002 - The Society of Typographic Aficionados (SOTA) has published detailed information regarding its program for TypeCon2002. To be held in Toronto, Ontario, Canada, July 12-14, the fourth annual event is presented by SOTA and The Type Club of Toronto. <br> <br>The conference website, located at <a href="http://www.typecon2002.com" target="_top">http://www.typecon2002.com</a>, now features a detailed timeline of programming and social activities. The timeline also lists topics and participants scheduled for each session. Additional speakers have also been added to the lineup. TypeCon2002 includes three full days of workshops, presentations, panel discussions and other activities designed for type and graphic design professionals, students and other aficionados of the communication arts. <br> <br>TypeCon2002 will take place at the Courtyard by Marriott in downtown Toronto. Discounted hotel room rates are available to conference attendees. Please visit the conference website for details. <br> <br>TypeCon2002 is the annual event of the not-for-profit Society of Typographic Aficionados, an international organization dedicated to the promotion, study, and support of typography and related arts. Secure conference registration and further information is available at <a href="http://www.typecon2002.com" target="_top">http://www.typecon2002.com</a>, or by email at mailto:<a href="mailto:info@typecon2002.com">info@typecon2002.com</a>. For more information about SOTA, please visit the website at <a href="http://www.typesociety.org" target="_top">http://www.typesociety.org</a>, or email mailto:<a href="mailto:info@typesociety.org">info@typesociety.org</a>.</p>
