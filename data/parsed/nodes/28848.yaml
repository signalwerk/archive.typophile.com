    <p>I'm hoping someone out there can give me the answer to my quandary. I have selscted Caecilia (see the pic) as the main font for use in materials for my new business. I want a sans serif to complement it (for headings etc) and can't find anything I feel really works. I might just be being very choosy, but if anyone has any ideas I'd be happy to hear them.</p>
    <p>Thanks</p>
    <p>Robert</p>
