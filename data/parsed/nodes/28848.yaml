    html: |-
      <p>i used theserif (text) together with akzidenz grotesk super (headlines) for a festival magazine, but the audience was 14-24, and thats probably not the same for you ;)</p>
      <p>AG super is a great counterpart to fine humanistic slabs imho because it takes them out of the "nice and lovely" corner. but hmm, thats just my opinion. plus its a rather unconventional mix, pairing a humanistic with a grotesque - but lets note too that AG isnt your everyday static grotesque due to its round shapes.<br>
      on the safer side, any humanistic sans could work. whitney, the already named thesans, frutiger next, maybe even vista.</p>
      <p>disclaimer: all content of this post was written because i like to help, not because i think too great of my typographic skills.</p>
