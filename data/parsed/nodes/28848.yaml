      <p>I've been working on a project recently that uses Caecilia as the main typeface (we don't own Thesis). I agree with statements here about choosing a round face. I have paired it recently with Avenir. I think a "geometric" are "draftsman" look would work the best with such a slabby face.</p>
      <p>Try Gotham, Avenir, Proxima Nova, or even Interstate to go along with it. Interstate actually works quite well with it, believe it or not.</p>
