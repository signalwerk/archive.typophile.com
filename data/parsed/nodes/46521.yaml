    html: |-
      <p>Sorry for the break. Nick, there are things that happen in writing, where the foreknowledge and memory of the writer go beyond the line breaks, which is OT's boundary. </p>
      <p>So, in this example, "It affords me" is written with a pen that becomes unloaded, i.e. runs nearly dry by the time"much"is written. It reloads, in time for "pleasure"  and etc. </p>
      <p>Next, there is no way to know not to cross the t, because a long descending f was used in the previous line, as the "fine" above, does to "that" which is below. </p>
