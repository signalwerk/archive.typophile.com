      <p>Thanks for posting the Flickinger specimen, David.<br>
      You’re right, such a controlled piece of calligraphy has no place for randomness.</p>
      <p>It’s interesting that this penman’s methodology could be readily “pseudomized” with Contextual Alternates.</p>
      <p>In particular, the heavying up of certain downstrokes, but never (with the exception of double-f) for adjacent glyphs, is just the sort of thing that the Contextual Alternates feature handles well.</p>
      <p>Also, the use of different forms of “t” for initial, middle and terminal position.</p>
