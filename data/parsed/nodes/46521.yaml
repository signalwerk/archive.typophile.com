    <p>First I should mention that the goal here is not in fact randomness, because we want a "natural" effect, where adjacent glyphs are not identical--which is what would occur occasionally with a truly random disposition of glyphs.</p>
    <p>In these examples, there are four alternates of each character in the font (including punctuation and, importantly, the space). They are sorted in four classes, @one, @two, @three and @four.</p>
    <p>Version 1.0 was provided by Thomas Phinney. This is the first lookup.<br>
    It sets glyphs from a sequence of classes: 1234 1234 1234, which then repeats.</p>
    <p>Version 2.0 is a tweak I provided, to deal with repetitive five-character sequences, as in "they do the things..."<br>
    This is implemented by the second lookup.<br>
    It sets the class sequence to: 1234 1324 3142, which then repeats.</p>
    <p>Version 3.0 deals with the line-break problem. (Because layout applications don't carry contextuality from one line to the next, starting over every line, a word like "the" at the start of a line is set with the same glyphs every time.) This method was suggested by John Hudson. It works backwards from the fifth character in the line (chosen, again, to deal primarily with the problem of "the"). My code splits possible fifth letters into seven groups, arranged to separate those that occur most frequently in English into different groups. The seventh group is the default, and not coded. It includes all accented characters, as I have not bothered to make truly comprehensive classes, as I did with classes one through four, which might include them.<br>
    This adjusts Version 2.0 by changing the first four classes in the sequence, depending on the fifth character in the line, to one of: 3143, 4324, 2413, 3214, 4132, 2314 or 1432.</p>
    <p><code><br>
    feature calt { </code></p>
    <p>lookup calt_one {<br>
    sub @one @one' @one by @two;<br>
    sub @two @one' @one by @three;<br>
    sub @three @one' @one by @four;<br>
    } calt_one;</p>
    <p>lookup calt_two {<br>
    sub @four @one @two' by @three;<br>
    sub @three @three' by @two;<br>
    sub @two @four @one' by @three;<br>
    sub @four @three @two' by @one;<br>
    sub @three @one @three' by @four;<br>
    sub @four @four' by @two;<br>
    } calt_two;</p>
    <p>lookup calt_three {<br>
    sub @one' @two @three @four [E M V e m v one space] by @three;<br>
    sub @two' @three @four [E M V e m v one space] @three by @one;<br>
    sub @three' @four [E M V e m v one space] @three @two by @four;<br>
    sub @four' [E M V e m v one space] @three @two @four by @two;<br>
    } calt_three;</p>
    <p>lookup calt_four {<br>
    sub @one' @two @three @four [T U B t u b two space.alt2] by @four;<br>
    sub @two' @three @four [T U B t u b two space.alt2] @three by @three;<br>
    sub @three' @four [T U B t u b two space.alt2] @three @two by @two;<br>
    sub @four' [T U B t u b two space.alt2] @three @two @four by @four;<br>
    } calt_four;</p>
    <p>lookup calt_five {<br>
    sub @one' @two @three @four [P A C p a c three nine space.alt3] by @two;<br>
    sub @two' @three @four [P A C p a c three nine space.alt3] @three by @four;<br>
    sub @three' @four [P A C p a c three nine space.alt3] @three @two by @one;<br>
    sub @four' [P A C p a c three nine space.alt3] @three @two @four by @three;<br>
    } calt_five;</p>
    <p>lookup calt_six {<br>
    sub @one' @two @three @four [L I Q Y l i q y four eight] by @three;<br>
    sub @two' @three @four [L I Q Y l i q y four eight] @three by @two;<br>
    sub @three' @four [L I Q Y l i q y four eight] @three @two by @one;<br>
    sub @four' [L I Q Y l i q y four eight] @three @two @four by @four;<br>
    } calt_six;</p>
    <p>lookup calt_seven {<br>
    sub @one' @two @three @four [D O G Z d o g z five] by @four;<br>
    sub @two' @three @four [D O G Z d o g z five] @three by @one;<br>
    sub @three' @four [D O G Z d o g z five] @three @two by @three;<br>
    sub @four' [D O G Z d o g z five] @three @two @four by @two;<br>
    } calt_seven;</p>
    <p>lookup calt_eight {<br>
    sub @one' @two @three @four [F R J N f r j n six seven] by @one;<br>
    sub @two' @three @four [F R J N f r j n six seven] @three by @four;<br>
    sub @three' @four [F R J N f r j n six seven] @three @two by @three;<br>
    sub @four' [F R J N f r j n six seven] @three @two @four by @two;<br>
    } calt_eight;</p>
    <p>sub @two @two' by @one;<br>
    sub @one @one' by @two;</p>
    <p>} calt;</p>
    <p>I suspect it may be possible to configure a system that works entirely with backwards-activation, but it is too mind-boggling for me to figure out.</p>
    <p>[Sorry, I meant to post this in the Build forum.]</p>
