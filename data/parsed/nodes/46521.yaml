      <p>Right, OT contextuality is conﬁned to single lines (and stumbles at either end). It also fails when tracking (beyond a small amount) is applied—which is really annoying, as that is an intentional feature of layout applications, not a bug or technical limitation.</p>
      <p>Nonetheless, I do think that your example here, with its huge “negative leading”, is an outlier/special case. If typographers decide to adopt this tricky practice, they are likely aware that it will create extender collisions which will not be ameliorated by the layout app’s H&amp;J’s or OT smart fonts, and are prepared to deal with them manually, or let things fall as they may. </p>
      <p>One might just as well dismiss “smart quotes” software that replaces hash marks with proper quote marks, because it fails when dealing with apostrophes at the beginning of words.</p>
      <p>Pseudo-randomization is intended to mimic certain “natural media” effects but it cannot produce a perfect facsimile of virtuoso calligraphy and layout on the ﬂy. I doubt the author of the example could either, without ﬁrst sketching the layout—note how the “g” in “king” anticipates the line below.</p>
