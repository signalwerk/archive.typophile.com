      <p>Pseudo-random reduces repetition. For instance, consider f_f.<br>
      In a four-alternates font, there would be four different f_f ligatures, but 12 different combinations of individual f and f.<br>
      I've developed this code while working on Duffy Script, which is not connected.<br>
      However, the variations don't have to be subtle.<br>
      But they do have to work with every other glyph except themselves, so it's a more more complex design procedure, "mulling" (as James Montalbano puts it) over the whole as one works on the individual.<br>
      I don't see why this shouldn't be applied to any genre of type, from strictly geometric sans to swashy connected script.</p>
