      <p>Your quite welcome Nick. It’s definitely an interesting specimen. After drawing a font in response over the last few seasons, I took a break to confer with Kent Lew about the OT possibilities of this same specimen, and we’re doing an excercise.  That plan led me to discuss it with Petr van Blokland, who’s always working at least a little on layout features. </p>
      <p>There are always going to be limits on achieving handmade appearance, so I’m not trying to do the impossible. I take something like these Chinese compositions (<a href="http://arts.cultural-china.com/en/62A6116A12015.html" title="http://arts.cultural-china.com/en/62A6116A12015.html">http://arts.cultural-china.com/en/62A6116A12015.html</a>), as an example of something so far inside of a person, I think it’s beyond computers to store.</p>
      <p>But you can see brushes loading up with ink, and spreading it out into writing, (and sure there’s some random in there too!). But there is also care in distributing that ink as evenly as possible, if that’s the compositional need, or not, if that’s what’s needed.</p>
