      <p>Thanks riccard0</p>
      <p>This is an image of a standard altimeter:<br>
      <a href="http://www.recreationalflying.net/tutorials/groundschool/altimeter1.jpg" title="http://www.recreationalflying.net/tutorials/groundschool/altimeter1.jpg">http://www.recreationalflying.net/tutorials/groundschool/altimeter1.jpg</a></p>
      <p>The "1" instead of "I" is to make a connection between the altimeter and the name. The arrow of the altimeter would point the "1" when flying AMILPIES (at 1000 feet)</p>
      <p>The choice of colours helps establish this connection, although for a pilot or anybody involved in flying the connection would work even in b&amp;w, I'd say.</p>
      <p>I'll show you other options.</p>
