  html: |-
    <p>Lately, I have been a bit frustrated with my type design ideas and it's something I believe everyone in this forum faces from time to time  so I don't feel so bad. <br> <br>Recently a fellow Typophile called my latest 'entry' for critique as having a 'me too' kind of feel. I agree 100% with this person's comment so I didn't take it as a 'sign' that I should quit or anything like that (besides, i'm certain he at no point suggested I should do such a thing). <br>I guess I realized I needed to 'open up' and experiment a little more. So i'm trying to do just that . <br> <br>Now I've always thought of this forum as a way of calibrating my technique as a designer and as a typographer. So I submit this letter 'n' I've been working on in hopes of finding out wether my idea is sound or am I going a bit overboard. Sometimes I 'fall in love" with a particular glyph and don't know when to stop. <br> <br>Your input would be greatly appreciated <br>IM <br> <br></p>
