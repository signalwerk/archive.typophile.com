    html: <p>I think this has a lot of character, and potential to be a really interesting face. I think it's general structure is sound, but the details you've carefully drawn make it interesting and unique. I would suggest you dive into it and see what happens, how the face might function, if there are interesting ways to build it to fit a purpose. <br> <br>Rock it <br> <br>Aaron</p>
