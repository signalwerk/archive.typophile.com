  html: |-
    <p>Zara and I were talking recently about how much handier it would be to be able to spontaneously blog to Typophile when we find great content on other sites. </p>
    <p>It's taken some trial and error but I'm happy to say that these work! Drag these links to your browser bar and click them whenever you want to share on Typophile. They've been tested on Firefox (Mac) and Safari (Mac) so let me know if you get unexpected results in another browser.</p>
    <p>(Note: You must be logged in at Typophile for these links to work.)</p>
    <p><a href="javascript:q=''+(window.getSelection?window.getSelection():document.getSelection?document.getSelection():document.selection.createRange().text);location.href='http://www.typophile.com/node/add/blog?edit[body_filter][body]='+encodeURIComponent(location.href)+'&amp;edit[title]='+encodeURIComponent(document.title)+q;">Blog this on Typophile</a></p>
    <p><a href="javascript:q=''+(window.getSelection?window.getSelection():document.getSelection?document.getSelection():document.selection.createRange().text);location.href='http://www.typophile.com/node/add/forum?edit[body_filter][body]='+encodeURIComponent(location.href)+'&amp;edit[title]='+encodeURIComponent(document.title)+q;">Post to Typophile</a></p>
