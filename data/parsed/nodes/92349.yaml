      <p>As I wasn't able to find any Miller (<a class="freelinking external" href="http://www.myfonts.com/fonts/fontbureau/miller-banner/" rel="nofollow">Banner</a> or <a class="freelinking external" href="http://www.myfonts.com/fonts/fontbureau/miller/" rel="nofollow">Display</a>) on these samples, I guess we could considerer it's the custom typeface they're talking about and, as you already suggested, very close to (or even based on) Chronicle...</p>
