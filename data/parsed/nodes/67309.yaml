    <p>Hello all interested readers,</p>
    <p>I've been working on a script, build in Processing Java, that enables me to draw lines on another line. I created a "skeleton" as a typeface in XY-code. These lines will connect other lines that will give some sort of weight to the shapes. </p>
    <p>Visual example of the story I am telling above this line:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/lijnoplijn_6665.jpg"></div><p></p>
    <p>Through a device that I build I can send values (from 0 till 1023 because of the 10k system) to my serial port (USB). I attached 4 potentiometers to my IO-board that I will use to remodel the shapes I show above. I also have a red button to make a tiff file.</p>
    <p>here's a small preview of that device I built:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/post_01_6310.jpg"></div><p></p>
    <p>I programmed the software to give the shorter lines, as you can see at the top of this topic, an variable angle. This angle is based on the input of the potentiometers. I can also make the lines larger so that it creates a bolder version. </p>
    <p>I just drag one end of the line and change the XY-position. This wil result in: changing the angle and the total lenght of the line itself. </p>
    <p>I also wanted to program an italic function for the whole letter. I didn't want to just angle the entire shape, I wanted to make a "good" italic.</p>
    <p>It took me some math skills, and a lot of time to program it. I also connected the value of a potentiometer to the italic function, so you can shape it all by turning the knobs.  </p>
    <p>*No keyboard or mouse involved, except for typing your texts*</p>
    <p>I also managed to let the serifs "shrink" as the italic kicks in.</p>
    <p>Italics:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/post_02_3517.jpg"></div><p></p>
    <p>The results:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/post_typecontroller_3668.jpg"></div><p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/post_typecontroller2_5232.jpg"></div><p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/post_typecontroller3_6317.jpg"></div><p></p>
    <p>I hope that this topic will generate a discussion that will help me to expand the functions.</p>
