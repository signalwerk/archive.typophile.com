      <p>Here's the code that explains why the 'a' changes when it's slanted/italic...</p>
      <p>void draw_a () { </p>
      <p>sensorValue = arduino.analogRead(sensorPin); // reads the knob<br>
      int range = ((sensorValue)/19); // range for the italic function</p>
      <p> if (range &gt; 20) { // if the range is greater then 20, then the shape should be like this</p>
      <p>  int y;<br>
          y = 100 - range; // 100 is x height</p>
      <p>   rLine( 20 , 100 , 70+ range*(100-y)/60 , y  );<br>
         rLine( 20+range , 40 , 20 , 100 ); //range is controlled by knob<br>
         rLine( 20+range , 40 , 70+range , 40 ); //range is controlled by knob<br>
         rLine( 70+range , 40 , 70 , 100 ); //range is controlled by knob<br>
         rLine( 70 , 100 , 80 , 100 ); </p>
      <p>   translate(spacing+11, 0);<br>
          }</p>
      <p> if (range &lt; 20) { // if the range is lower then 20, then the shape should be like this</p>
      <p>// now the xy coordinates to make the letter</p>
      <p>    rLine( 20+range , 40 , 70+range , 40 ); //range is controlled by knob<br>
          rLine( 20+range/2 , 70 , 70+range/2 , 70 ); //range is controlled by knob<br>
          rLine( 20 , 100 , 80 , 100 );<br>
          rLine( 70+range , 40 , 70 , 100 ); //range is controlled by knob<br>
          rLine( 20+range/2 , 70 , 20 , 100 ); //range is controlled by knob</p>
      <p> translate(spacing+11, 0); // spacing system</p>
      <p>    }</p>
      <p>}</p>
