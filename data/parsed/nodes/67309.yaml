      <p>Bruno <cite>- Is the top of the italic a still a combination of two lines overlapping each other, because your skeleton still has three "horizontal" lines? -</cite></p>
      <p>All I do is lower (or rise) one end of the line when I turn the knob. I programmed the lines so that there's always a connection between the lines. So when you make an italic, the lines stick together, thanks to this line of code:</p>
      <p>y = 100 - range; // 100 is x height</p>
      <p>rLine( 20 , 100 , 70+ range*(100-y)/60 , y );<br>
      rLine( 20+range , 40 , 20 , 100 ); //range is controlled by knob<br>
      rLine( 20+range , 40 , 70+range , 40 ); //range is controlled by knob<br>
      rLine( 70+range , 40 , 70 , 100 ); //range is controlled by knob<br>
      rLine( 70 , 100 , 80 , 100 ); </p>
      <p>If you draw it on a, for example, grid paper you will see the appearing of an 'a'. The range part will change the values by adding up. </p>
      <p>Example:</p>
      <p>70+ range*(100-y)/60 , y )</p>
      <p>        =</p>
      <p>70+ 59*(100-y)/60, y // 59 will be the range data.</p>
      <p>I hope I answered your question correctly.</p>
      <p>Thanks for your input.</p>
