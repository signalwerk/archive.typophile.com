    <p></p><div class="imageWrap"><img src="http://typophile.com/files/klav_con_top_4215.gif"></div><br>
    Klavika Condensed began its life in 2006 when global branding firm FutureBrand commissioned the Process Type Foundry to create a custom width of their existing Klavika for the re-brand of Chevrolet. Although Klavika is already relatively narrow, the new width needed to accommodate an industry that transmits large amounts of complex information in tight spaces and relishes the big, bold headline. After two years of exclusive use by Chevrolet, the retail release of Klavika Condensed is finally available. <p></p>
    <p>Purchase the complete family - which includes Light, Regular, Medium and Bold weights each with corresponding italics and an extended Latin character set - or purchase only the single weight you need directly from our website.</p>
    <p>See more of Klavika Condensed:<br>
    <a href="http://www.processtypefoundry.com/typefaces/klavikacon/" title="http://www.processtypefoundry.com/typefaces/klavikacon/">http://www.processtypefoundry.com/typefaces/klavikacon/</a></p>
