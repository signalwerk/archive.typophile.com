    html: <p>Maybe this thread is totally expired, but that book, "Le Romain du Roi – La typographie au service de l'Etat" was published by the Musée de l'Imprimerie in Lyon, France. It may still be available for purchase from them. It's a great book – I have a copy. The book itself has been set in the Romain du Roi – those little spurs on the lower case "l" surprisingly affect the look of the page.</p>
