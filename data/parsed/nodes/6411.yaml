    html: <p>This is good info, thank you. I still haven't gotten my copy of the recent Lyon exhibition catalogue from Vendome, and I've just come back from a brief trip to Vienna, so I haven't had time to scour the libraries in Frankfurt for samples either.* <br> <br>A friend of mine who just came over from the States on Sunday did bring me my copy of Friedl's <i>Typography,</i> and I enjoying perusing those low quality examples. <br> <br>My gut feeling is to go for as close of a revival as is possible first. I can always do something more interpretive later. I like the slanted-Roman Italic alot, and will probably work on that first, instead of any other oblique/italic option. It is becoming more common though to design more than one variety of italic for a single Roman... so there will always be room for more. <br> <br> <br>*This is Germany, so school isn't going to start up again for another five weeks... everyone helpful in my neck of the woods is still on vacation...</p>
