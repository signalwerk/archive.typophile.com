    html: <p>I don't have the book - but I know that Robin Kinross does. <br>I think you should buy it, then send me copies of the juicy bits.  :-&gt; <br> <br>In terms of illustrations, the one plate with all the lc glyphs (except the "g" - tellingly, since it's so hard to fit on a grid) is pretty easy to find in books - it's not "complete" though. There's also a plate of the italic in something Smeijers once published, I think. Then I'm having this vision of all the UC glyphs in the RdR on facing pages, but I can't remember where I saw that. Sorry. <br> <br>Digitizing the RdR would be a great project - it's shocking that there hasn't been one yet. You might contact the Imprimerie Nationale of France for leads, and maybe informal "permission" as well. But if they say "no" do it anyway - tell them it belongs to the "patrimoine humaine", not them.  :-) <br> <br>hhp</p>
