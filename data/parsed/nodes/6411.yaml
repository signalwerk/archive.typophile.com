    votes: null
    html: "<p>Dan, over the weekend I did something I should have done much earlier: check the wonderful Imprimerie Nationale specimen book of 1990, which shows the bulk of their metal collection in great depth and detail. <br> <br>First of all, there's a font called Jaugeon (in 12 sizes from 6 to 20) which is basically a very close rendering of the original engraved plates, done in the beginning of the 20th century. To me it's very attractive, and actually has a nice dark color. The italic is NOT the one shown in the plates* (it doesn't have all those serifs), but it's much more rigid and regular than Grandjean's cut. And the italic has some strange features, like a somewhat blackletter-style \"k\", and get this, it has those short lefthand spikes on the ascenders on the \"h\" and \"k\" as well as the \"el\", not that even the \"el\" needs the spike** in the italic, since it was there to differentiate the lc roman \"el\" from the cap roman \"I\", but in the italic that problem is gone! Very strange. <br> <br>* And I guess this means the RdR had <i>three</i> italics... <br> <br>** BTW, I realize now that the claim that Grandjean incorporated the spike of the \"el\" is bogus, since the source engravings have it. <br> <br>Then there's the Grandjean font, which was made two centuries earlier, so it seems to be considered the \"official\" RdR font, but besides being too light I think, it's not nearly as pure, and some characters (like the \"f\" and especially \"?\") are really malformed. Also, the caps are <i>way</i> too dark, and -as we discussed- the italics are very organic and cursive, really way out of character with the Roman. The Grandjean however was available in much greater a range, with 19 sizes from 7 to 64 (the Jaugeon has no real display cuts) as well as titling initials (16 sizes from 12 to 120). <br> <br>In terms of doing a revival, I guess you might do one of Jaugeon, but you would really need some kind of IN consent there. Or better yet might be doing a revival directly from the plates, including the slanted-roman italics. According to what Patrick has shown me there has been a metal of that in the past, but certainly no digital. <br> <br>hhp</p>"
