    html: |-
      <p>This thread inspired me to search for images of the Romain du Roi design charts on the Web. I could not find a complete set, although there is another drawing of the whole Roman alphabet in squares, but without the construction circles, that is available.</p>
      <p>But I came across this sentence, in "A History of the Old English Letter Foundries":</p>
      <p>"In recent years a French typographer, M. Motteroz, has attempted to combine the exellences of the Elzevir and modern Roman, with a view to arrive at an ideally legible type."</p>
      <p>While the experiment is described as a failure, it is intriguing to me.</p>
      <p>... Theodore Low De Vinne reproduced the Motteroz letter in his Plain Printing Types, and I fear I must concur that the result was unattractive in appearance, and thus a failure for the reason cited.</p>
