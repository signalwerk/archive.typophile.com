    html: "<p>The RdR committee's engravings (I mistakenly wrote \"drawings\" before) were simply too precise. Without a pantograph it would have been impossible to get high fidelity. And then there was the issue of optical scaling you mention: it was something Grandjean implemented of course*, but either the committee didn't understand its need (only one of its members had any idea of type) or they created the \"spirit\" and expected Grandjean to \"distill\" it in the smaller sizes (which is not unreasonable). The way Grandjean totally dumped the engraved italic however was not a matter of accuracy though, but of taste and practicality. <br> <br>* Some people say that -because of the \"physicality of scale\"- the pre-pantographic designers didn't really see optical scaling the way we do, they \"just did it\", making each size look \"correct\". Some however were more sloppy than others - Caslon for example was just wanton in terms of consistency (although the variance in the italic \"Q\" is genial). <br> <br>-- <br> <br>Dan, a question: would you make a literal revival, or a mild adaptation? I think if you want this to be more than of historical interest, if you want people to use it to give their setting the RdR \"air\" but in a versatile manner, you should take some small-to-medium liberties with it. <br> <br>hhp</p>"
    html_clean: "<p>The RdR committee's engravings (I mistakenly wrote \"drawings\" before) were simply too precise. Without a pantograph it would have been impossible to get high fidelity. And then there was the issue of optical scaling you mention: it was something Grandjean implemented of course*, but either the committee didn't understand its need (only one of its members had any idea of type) or they created the \"spirit\" and expected Grandjean to \"distill\" it in the smaller sizes (which is not unreasonable). The way Grandjean totally dumped the engraved italic however was not a matter of accuracy though, but of taste and practicality. <br> <br>* Some people say that -because of the \"physicality of scale\"- the pre-pantographic designers didn't really see optical scaling the way we do, they \"just did it\", making each size look \"correct\". Some however were more sloppy than others - Caslon for example was just wanton in terms of consistency (although the variance in the italic \"Q\" is genial). <br> <br>-- <br> <br>Dan, a question: would you make a literal revival, or a mild adaptation? I think if you want this to be more than of historical interest, if you want people to use it to give their setting the RdR \"air\" but in a versatile manner, you should take some small-to-medium liberties with it. <br> <br>hhp</p>"
