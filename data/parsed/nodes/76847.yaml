      <p>@Penn - Great! I don't mind being compared to The Mill at all; maybe they were a subconscious influence on me. The site is going to be a science/tech "Blogazine" but will differentiate itself by being design-conscious, taking cues from industries like fashion or maybe high-end automotive.</p>
