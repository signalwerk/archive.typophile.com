      <p>I have not been able to find anything that dictates a "correct" placement for the © in a logo. Any references?</p>
      <p>@Arno - Maybe I misunderstood, but what were your suggestions aiming to fix?</p>
      <p>@Brian - It's funny that you mention the T serif, because I had a working version for a long time where that serif was about 30-40% longer; maybe I should revert. It's fun to think I might have been a part of inspiring your future minimalist geometric didone! ;)</p>
      <p>@apankrat - It is ambiguous. I was surprised that others immediately read it correctly, because to me it sits on the fence between legibility and abstraction. I absolutely see where you got the "TILE" from. :) While legibility isn't a huge factor (this mark will usually be accompanied by the full name) I was just happy to see that it wasn't nearly as abstract as I thought. Thanks for the feedback!</p>
