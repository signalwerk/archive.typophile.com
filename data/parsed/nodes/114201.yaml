  html: |-
    <p>Hello!</p>
    <p>Would anyone be able to suggest modern typefaces that would look similar to the one from this old architectural blueprint (minus the clogging of the ink)?</p>
    <p>I thought of Gotham Rounded, but its letters are too wide in comparison. </p>
    <p>For this purpose, I guess they would need to be kind of narrow—but not condensed—so they can be easily read in small sizes (CAPS only).</p>
    <p>Any thoughts are much appreciated.</p>
    <p>C.<br><img src="/sites/default/files/old-images/_Typeface_Blueprint_4621.jpg"></p>
    <img typeof="foaf:Image" class="img-responsive" src="http://www.typophile.com/sites/default/files/old-images/_Typeface_Blueprint.jpg" width="582" height="400" alt="">
