      <p>Character [Herbert F. Van Brink] made an independent digitization of Leroy Lettering as Leroy Lettering Light in 2003. It seems to have been forgotten. At least it's not listed in Luc Devroye's pager on Character <a href="http://luc.devroye.org/fonts-48632.html">http://luc.devroye.org/fonts-48632.html</a><br>
      Here is a download link for Leroy Lettering Light <a href="http://www.fontspace.com/character/leroyletteringlightbeta01">http://www.fontspace.com/character/leroyletteringlightbeta01</a><br>
      If anyone can demonstrate that it is a rip of an earlier digital font, I will edit this post to delete the link.<br>
      Don</p>
