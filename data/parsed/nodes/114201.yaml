    html: |-
      <p>The typestyles favoured on architectural and other technical drawings of this type were based on routered  lettering, often condensed and with rounded terminals. Take a look at <a href="http://www.myfonts.com/fonts/nicksfonts/planscribe-nf/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Planscribe NF</a> from Nick's Fonts - one I've used successfully for this purpose myself.</p>
      <p>Try searching on the tag "routered" for other examples, but I think Planscribe probably comes closest of those I saw doing this search.</p>
    html_clean: |-
