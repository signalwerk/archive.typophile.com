      <p>Pretty overall, and I just love the |J|, but I'm not so font of the implementation of the thin bystroke in some of the letters.</p>
      <p>The open ends of the thin strokes on round letters like |C| and |O| feel rough to me. The variation of open, closed, and serifed terminals seems random, particularly for the |H|; maybe settle on a single style? The |B| is messy, and the top of the |ẞ| looks broken (though its overall shape is cool).</p>
