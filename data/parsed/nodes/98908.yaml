    votes: null
    html: |-
      <p>Thanks again, Craig and Bart.</p>
      <p>&gt; One could argue that the R and the Eszett are other examples …</p>
      <p>I wouldn’t argue that way. I’d rather say, the stroke topography of both the R’s and the Eszett’s right part is essentially different from the Y. I still don’t see a possible other solution for the Y.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/a-typo3-3-yrss_3432.png"></div><p></p>
      <p>&gt; Question mark looks a bit underdressed without a bystroke </p>
      <p>I considered and think, I best leave the exclam and the question marks in that simple fashion. I don’t want them to become too grave.</p>
      <p>&gt; IJ …<br>
      well, see the new take on it. I also changed the Œ and I feel that this solution is better.<br>
      I also did a new approach to the zero figure. Wasn’t quite satisfied with it (previous versions in light grey).</p>
      <p> </p><div class="imageWrap"><img src="http://typophile.com/files/a-typo3-1_5423.png"></div><p></p>
      <p>Thanks for your kind words about those figures; I found them rather cumbersome to make.<br>
      Well, the 1 and the 4 are quite nice …<br>
      – In that sample you also see a 1st view of the Italic.</p>
      <p>And, as to the narrowings of the bystrokes: there is a shortcoming of rendition in rough screen display, of course. Even on one single machine, depending on the application: you get different results. In the sample below (from the Mac): TextEdit – rather thicky (top); PDF view – more crisp (bottom).<br>
      Admittedly, this is going to be a face for sizes rather beyond 36p. And more for the print than the screen.<br>
      I still feel that the stroke scheme ought be as it is now.</p>
      <p> </p><div class="imageWrap"><img src="http://typophile.com/files/a-typo3-2-goth_5786.png"></div><p></p>
      <p>– Further comments welcome.</p>
