      <p>Bart,<br>
      tank you very much for your thoughtful comments. I’ll consider them.<br>
      A few remarks, however:</p>
      <p>&gt; X and Z seem in doubt …<br>
      You’re most certainly right, at least with the Z.</p>
      <p>&gt; Y stands out …<br>
      Yes. But the Y is the only letter having an angular mainstroke, which is unavoidable.</p>
      <p>&gt; IJ to me looks less like an IJ than as an alternative glyph for U …<br>
      I admitt I struggled a bit with this. You see in the sample that I even try another solution for the lc position (all lc positions will bear smaller caps, btw.). We will see …</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/a-typo2-2_3932.png"></div><p></p>
      <p>&gt; Œ looks like an O that comes speeding from the right …<br>
      Oh MY GOODNESS – it does!<br>
      Perhaps something is to be done with the crossing bit in the centre.</p>
      <p>Now some more little previews.<br>
      There will be 5 weights altogether:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/a-typo2-5_6543.png"></div><p></p>
