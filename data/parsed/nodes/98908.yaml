    html: |-
      <p>To me this looks very promising — a font I would be greedy to add to my library even without having any serious use for it, just for its prettiness. However (and as a layman I find it nerve-wrecking to articulate any criticism) there are a few glyphs that don't quite convince me.</p>
      <ul>
      <li> X and Z seem in doubt whether or not to look top-heavy like K and R; to me they look a bit unstable as they are now;
      </li><li> Y stands out as the only glyph to have an angular bystroke, which I find puzzling;
      </li><li> IJ to me looks less like an IJ than as an alternative glyph for U — it would be less confusing with either a shortened I-shape or a J-shape with a real descender (by the way, that curved J-shape would be a lovely alternative glyph for the straight one);
      </li><li> Œ looks like an O that comes speeding from the right; Æ has more or less a similar effect. Of course this font does not aim for a maximum legibility, but still...
      </li><li> I am not sure if the four different heights of the middle bar in E, F, G and H might not be a bit too much of a good thing; especially the middel bar of Æ being lower than E's or Œ's might be reconsidered.
      </li></ul>
      <p> All these reservations are of course to be taken with a healthy dose of salt...<br>
      All best, Bart</p>
