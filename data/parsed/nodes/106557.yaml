  html: |-
    <p>Ever do something so shitty that it ends up being completely awesome? </p>
    <p>I just finished some cd/lp cover art for my all time favorite hip hop client (who BTW has one of my designs tattoo on his arm!!) that allowed me to completely mangle a cut of  Tungsten and slap over it some horrendously cropped handwritten script (of his own hand) and I didn't even have to care about jagged edges or anything. </p>
    <p>But as it turned out this thing spews raw energy so much so that it confronts the viewer.</p>
    <p>I charged him 20k for the work ...but somehow I think that's  going to be knocked  down a zero or maybe even two ...sigh. </p>
    <p>If I get away with this one ...</p>
