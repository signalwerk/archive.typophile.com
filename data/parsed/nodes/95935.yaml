    <p>I am assembling an eBook at the moment, and I have  a problem.</p>
    <p>Text faces have never been my forte, and I am not particularly satisfied with any of Adobe's prepackaged solutions for body copy, available with the InDesign suite. I am particularly fond of Poppl Laudatio, because of its narrow stance, large x-height, and subtle serif treatment, but am—for reasons which many may know—disinclined to do business with Berthold in any way, shape or form.</p>
    <p>Is there a free or reasonably priced alternative available, which would allow embedding in a wide range of electronic formats?</p>
