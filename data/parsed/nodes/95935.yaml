      <p>Frank,</p>
      <p>Thanks for the recommendations: I will check them out.</p>
      <p>As far as my fonts being ePub friendly: they ought to be, but getting competitive pricing information is difficult if not impossible, thanks to the stranglehold that a certain monopoly player has on the market. Not that it really matters anymore: after months of trying to rescue my marriage in the light of my wife's chronic alcoholism and subsequent Benzodiazepine Withdrawal Syndrome, I have finally given up. Since my entire professional library was developed while we were marriage, by law my wife owns half of all of my Intellectual Property, and she would like to liquidate same. Unfortunately, no one will make a reasonable—or, for that matter, an unreasonable—offer for the entire collection of over one thousand workmanlike fonts.</p>
      <p>P.S. Quattrocento is a wonderful family; I will investigate it thoroughly.</p>
