      <p>Goto to dafont<br>
      1) LogIn<br>
      2) Click on "MyAccount" at the top, next to the logo<br>
      3) Click on "Donate Link" in your account options<br>
      4) Enter your paypal email address<br>
      5) Submit<br>
      Done</p>
