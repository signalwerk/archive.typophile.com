    <p>I’m currently working on a new typeface in FontLab, and found two options which, as far as I can tell, produce the same result: Hinting and Links.</p>
    <p>FontLab of course has no help menu and no explanation one way or the other. Hinting, of course, helps the letterforms appear crisp on screen, but what does Linking do that is better or worse?</p>
    <p>Any clarification would be helpful.</p>
