      <p>"Groovin" was a very 60s term that came out of the Haight hippie vernacular. The lettering was best seen in work known as Family Dog<br>
      <a href="http://www.wolfgangsvault.com/se/family-dog-series/FD.html" title="http://www.wolfgangsvault.com/se/family-dog-series/FD.html">http://www.wolfgangsvault.com/se/family-dog-series/FD.html</a></p>
      <p>The early 70s was actually what most people remember as 60s look. The Beatles Rubber Soul album shows a glimpse of that fat bottom look. There was a great Art Nouveau influence as well.</p>
      <p> ChrisL</p>
