    html: |-
      <p>Groovin is noticeably "1960s".<br>
      Seymour Chwast's Artone logo (1964) is iconic for this "fat bottom" style.<br>
      The font is probably named after the Young Rascals song (1967).<br>
      However, although bell-bottom trousers/pants were invented in the 60s, their heyday was the early 70s.</p>
