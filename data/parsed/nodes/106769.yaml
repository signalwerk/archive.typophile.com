      <p>I don't know anything about what sans come free with MS Office, but here are a few thoughts.</p>
      <p>I actually like the current logo. It would be nice if you took the main font (Celestia Antiqua?) and customized the distressed effect so that characters that repeat are different each time.</p>
      <p>You could put the second line in spaced sans serif caps (Gotham? Neutraface? Scala or Seria sans?) so that it matches the width of the name, or is just slightly narrower. The ornament should either be distressed to match the main lettering, or — of the lower line becomes sans — it could stay clean. The positioning is a bit weird because it feels off-center. I would maybe use the type or the ornament, but not together (in different contexts) or do something else with the ornament.</p>
