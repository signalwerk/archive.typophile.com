    <p>I'm looking for suggestions for font pairings to go with our new logo. </p>
    <p><a href="http://callanwolde.org" rel="nofollow">Callanwolde Fine Arts Center</a> is a non profit located in Atlanta, Georgia. Quick summery is that the building is a historic mansion where we have we have 200 art classes and rent for weddings and events. I have a background in commercial photography and am a jr. designer. I am working on branding guidelines and a friend suggested I post here for font suggestions.</p>
    <p>Any thoughts would be appreciated. Looking for a good san serif heading font and serif body font that my staff will have on their newest version of Microsoft Office or we can get for free/minimal cost.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Callanwolde_Logo_Primary_500px_6302.jpg"></div><p></p>
