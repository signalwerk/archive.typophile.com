      <p>Thank you for your feedback, Juhani, seems like I misunderstood your advice, though I think my new punctuation is better than the old one. Yes, I like that tension idea you're talking about, and there will be more of it in the larger cuts of this typeface (I'm planning a 10 point, 12 point, 18 point and 72 point version, this is the 8 point cut). I think too much sharpness and tension at eight points is a little wasted. I agree on your view of soft revivals, though they may look nice on the right paper, they all too often turn into their own parodies. I'm sure Baskerville or Bodoni or Fleischmann would have embraced the crispness of modern technology, and designed their faces in accordance.</p>
