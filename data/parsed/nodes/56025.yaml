      <p>Thank you very much for your feedback, Bendy! You're right, I've fattened up the V, W and X (slightly), and I do think they look better now. I've also made slanted legs for the M, and tweaked its proportions a bit, as you can see. I've done some minor changes to the question mark, following Raph's advice, but I've retained its "toothpastey" quality. </p>
      <p>Raph, thanks again for your invaluable assistance, I've followed most of your suggestions, as you can see. I've made a more conventional ampersand, but I've kept the other one as an alternative glyph. I'm not sure I understood what you meant regarding the at sign, but I've fattened up the SW curve. Does it look better to you? </p>
      <p>About that strange J: I saw that glyph in a dream, and I thought I'd try it. Obviously, the spur is related to that wonderfully weird trademark l in the <a class="freelinking external" href="http://www.opto.fr/resources/romain-du-roi-epreuve-des-caracteres-de-imprimerie-royale-1760" rel="nofollow">Romain du Roi</a>. I'll keep it as an alternative glyph, and make a normal J for use in the waking world. </p>
      <p>I think I'll keep that fat lowercase z, it's probably my favourite glyph. For some reason, I like the z to stand out a little in a typeface. I'm not really satisfied with the upper case Z, though.    </p>
      <p>I've added a pdf showing the altered glyphs to the original post.</p>
      <p>I'll upload some text setting examples later today.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/schola_210309_mod_6067.png"></div><p></p>
