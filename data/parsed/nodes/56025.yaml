      <p>Wow, thank you very much for your very detailed feedback, Raph. Something like this is exactly what I was hoping for. I don't yet have enough typographical routine or theoretical knowledge to see my own mistakes -- and having worked on this for more than three weeks, I'm starting to feel a little type-blind. </p>
      <p>I will use your advice and make some major revisions to my typeface, but I really need to let it rest for a day or so, having spent every waking hour when not at work on this. Drawing type is turning into an obsession, really. I know now I can never live without it, and I curse the years wasted on not drawing glyphs. :-)</p>
      <p>Thanks again!</p>
