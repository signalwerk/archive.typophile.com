    html: |-
      <p>I love it. I wouldn't worry too much about the bumpiness of the outlines - in this case, I think they add to the character of the face. Zeno was similar in this way.</p>
      <p>Some detailed thoughts, which you can take or leave.</p>
      <p>I think the tail of the 'a' comes up too close to the main stem. That tends to look okay up close, but in very small sizes it gets muddy. The 'c' is top-heavy - it's okay for it to lean forward a bit (that's true to the Jenson/Aldus/Garamond model), but I think the tail could come out a little more. I think the center stroke of the 's' could be less vertical (the capital doesn't have this problem). Also take another look at Jenson's original here - he thins it slightly in the center, so it's not a fat blob. The left serif of the 'u' could be heavier (and also, in the traditional model, more horizontal - it doesn't match the 'n'). Your 'z's have inconsistent chirography - in the lowercase, it looks like you've tried to follow the pen, but in the uppercase, the more traditional weight distribution. I would choose one or the other, likely the latter.</p>
      <p>I want to see some text settings to see how the short serifs on vwx work out. When paired with rounds (vo etc) they might create too much openness, but perhaps kerning can help with that.</p>
      <p>Serifs on 'EF' look heavy to me, and don't really fit with the rest of the font (I see you've done something more delicate with 'Z'). Why the spur on the 'J'? Center point of 'M' seems too far to the right. Bottom of 'U' is too round, I'd have just a little more straight (especially noticeable on the right).</p>
      <p>3 leans a bit to the left. I find the open 8 distracting. Ampersand is not quite as delicious as the rest of the font - I don't really like the long straight diagonal. Traditional '@' construction is thin on the right side curve. I'd put a little more weight on the curly brace. Question mark has a nice shape but looks too soft and low-fi - maybe just a bit more stroke contrast.</p>
      <p>I'm seeing lots of good attention to detail here - I think it'll be a great font when it's finished.</p>
