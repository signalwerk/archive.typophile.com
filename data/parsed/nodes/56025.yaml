      <p>Yes, that g has been a headache. I'll make a revision as soon as I'm home from work. </p>
      <p>The serifs are intentionally rather short, I think that's appropriate for a typeface in this style. Van den Velde's English No.28, scanned by John Hudson in <a class="freelinking external" href="http://typophile.com/node/8800" rel="nofollow">this post</a> was my initial inspiration, but I realise I've made my serifs even shorter. Perhaps they need a few more units, I'll make some tests. Do you think I should make the ascender serifs more uniform, by the way?  </p>
      <p>About the darkness: Yes, this is supposed to be the regular weight, I don't think there will be any other weights. I'm going for Dutch style darkness, like the beautiful but ridiculously expensive <a class="freelinking external" href="http://www.teff.nl/fonts/renard/" rel="nofollow">Renard</a> from Enschedé. Also, my typeface is intended for use at eight, nine or ten points, I'm going to make lighter, tighter and more refined versions for larger sizes.</p>
