      <p>Well, I would routinely go through all your characters, and check the curves. They are slightly bumpy here and there, like in the g (counter). The last y does look better than the one you initially made as a toned down version of the first one. </p>
      <p>I also think the serifs might be a bit short? They are sufficiently thick, but they're not really pronounced. It's a question of course whether or not you <em>want</em> them to be pronounced, but it's something to think about. </p>
      <p>And is this a regular weight? If so, I think it's too heavy. It looks a bit like a medium or something like that.</p>
