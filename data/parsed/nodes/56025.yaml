      <p>Satyagraha, I don't have any specific suggestions. I think the contrast of two somewhat opposite qualities should generally be within each glyph rather than between different glyphs. This could mean for example soft counter forms and hard outer forms (or vice versa) throughout the face.</p>
      <p>I think it's good that the whole thing is pretty crisp, considering the weight. An oldstyle face with too much softness can end up looking like typical bold cuts or nostalgic ink-spread imitation. The narrow serifs are also good since they bring some delicacy to compete with the robustness.</p>
      <p>The daggers look fine next to the A-Z &amp; a-z. If you want more contrast or tension of different forms, maybe emphasize both the roundness and the sharpness at the same time (like Garamond &amp; Caslon).</p>
    html_clean: |-
