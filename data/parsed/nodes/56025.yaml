    date_raw: 21 Mar 2009 — 8:49am
    votes: null
    html: <p>Thanks, Quinqunx. I'm a great believer in optical scaling, I think it's a shame that so few typefaces featuring this is available, and most of them have only a text and a display version. For scholarly work, I think it's very important having a seperat cut intended for footnotes, all too often they are hard and uninspiring to read, being to tight and sharp and light of colour, compared to the body copy. There's a huge difference between type intended for eight points and ten points. Also, I think the serif length question you brought up will be solved, they will become more pronounced in the larger optical sizes, as you can see in the 12-point mock-up.</p>
    html_clean: <p>Thanks, Quinqunx. I'm a great believer in optical scaling, I think it's a shame that so few typefaces featuring this is available, and most of them have only a text and a display version. For scholarly work, I think it's very important having a seperat cut intended for footnotes, all too often they are hard and uninspiring to read, being to tight and sharp and light of colour, compared to the body copy. There's a huge difference between type intended for eight points and ten points. Also, I think the serif length question you brought up will be solved, they will become more pronounced in the larger optical sizes, as you can see in the 12-point mock-up.</p>
