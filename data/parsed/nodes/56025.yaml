      <p>I understand your consistency worries, Juhani. Could you briefly sketch how you think creative inconsistency could be successfully applied? You see, I've had similar, but vague ideas about combining austerity with playfulness while drawing this, but everything has been done at breakneck speed, so I really haven't given much systematical thought to it. Do you think I should make jollier asterisks and daggers?</p>
