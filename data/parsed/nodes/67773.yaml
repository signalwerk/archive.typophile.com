      <p>Both ogoneks appear rare (1%) in polish text, while a and e are the most often used letters (8-7%). Pairs ąf, ęf, ąj and ęj don't exist.</p>
      <p>aogonek preceds c,g,p,t,z,zdotaccent<br>
      letters preceding aogonek (most often): c,i,j,k,n,s</p>
      <p>eogonek preceds b,d,g,k,p,s,sacute,t<br>
      letters preceding eogonek (most often): i,j,lslash,n</p>
      <p>As you can see, there are no problems here.</p>
      <p>@ Riccard0: You can make a swashed ogonek, but following John's rules. Then you will get a typical barocco form.</p>
    html_clean: |-
