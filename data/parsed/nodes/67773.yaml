    html: |-
      <p>In addition to the information on Adam’s website (see Ben’s and John’s link), here’s how Polish children are taught to write the <em>kreska ukośna</em> in the letter ew: <a href="http://www.flickr.com/photos/hardwig/4385743802/" title="l and ł – druk i pismo [print and script] by Florian Hardwig, on Flickr" rel="nofollow"></a></p><div class="imageWrap"><a href="http://www.flickr.com/photos/hardwig/4385743802/" title="l and ł – druk i pismo [print and script] by Florian Hardwig, on Flickr" rel="nofollow"><img src="http://typophile.com/files/4385743802_fa94fb8e79_m_5814.jpg"></a></div><br>
      As handwriting is less accurate than typography, and angled slashes and straight bars are hard to distinguish, the slash is shifted from its usual position at the vertical centre to the top – otherwise, confusion of ‘t’ and ‘ł’ is bound to happen.<p></p>
      <p>This approach is well established –&nbsp;see this copperplate example from a 1911 primer: <a href="http://www.flickr.com/photos/hardwig/4385743614/" title="Abecadło małe i duże [Capital and small letters] by Florian Hardwig, on Flickr" rel="nofollow"></a></p><div class="imageWrap"><a href="http://www.flickr.com/photos/hardwig/4385743614/" title="Abecadło małe i duże [Capital and small letters] by Florian Hardwig, on Flickr" rel="nofollow"><img src="http://typophile.com/files/4385743614_d2053ca5ac_5616.jpg"></a></div><p></p>
      <p>It’s not a hard rule though, and exceptions can be found within Polish type design. It depends on the nature of the script. With its long ascender, <a href="http://www.silesia-region.pl/strona_n.php?jezyk=pl&amp;grupa=3&amp;dzi=1249389234&amp;id_menu=196" rel="nofollow">Silesiana</a>’s ‘ł’ doesn’t run the risk of getting confused with the distinctly shorter t. That’s why the slash may remain at the vertical centre here.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Silesiana_4319.png"></div><p></p>
    html_clean: |-
