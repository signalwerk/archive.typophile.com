      <p>I'm thinking that you'll need to find a way to move the ogonek to the left in order to clear a following p (a following g is more problematic in this style of type, and probably only solveable with a contextual variant form of the g). In general, you should design and attach the ogonek in such a way that it extends no further to the right than the tip of the exit stroke when considered against the angle of slant, e.g.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/aogonekp_4419.gif"></div><p></p>
      <p>Obviously this is more difficult to judge in a connecting script face, but this is another reason why I recommend breaking the connection between letters with ogoneks and following letters: it is both better representative of how the ogonek is written, as a stroke reversal, and enables you to coordinate the length of the exit stroke with the width and position of the ogonek relative to a following descender.</p>
    html_clean: |-
      <p>I'm thinking that you'll need to find a way to move the ogonek to the left in order to clear a following p (a following g is more problematic in this style of type, and probably only solveable with a contextual variant form of the g). In general, you should design and attach the ogonek in such a way that it extends no further to the right than the tip of the exit stroke when considered against the angle of slant, e.g.</p>
