      <p>If you want this script face to look like real Polish handwriting, put the slash at the top or even <em>above</em> the l. If you want to keep the loop, then I think the slash would be best above the letter; if you modify the l so that the loop is removed, then the slash can be near the top or above. See Adam's comments on script faces here:<br>
      <a href="http://www.twardoch.com/download/polishhowto/stroke.html" title="http://www.twardoch.com/download/polishhowto/stroke.html">http://www.twardoch.com/download/polishhowto/stroke.html</a></p>
    html_clean: |-
      <p>If you want this script face to look like real Polish handwriting, put the slash at the top or even <em>above</em> the l. If you want to keep the loop, then I think the slash would be best above the letter; if you modify the l so that the loop is removed, then the slash can be near the top or above. See Adam's comments on script faces here:<br>
