    html: |-
      <p>Remember that if you removed the loop, you should also make the spacing tighter on the right side to optically compensate. If the loop is removed, then the stroke should be modelled on that of your b, without a hook at the top. I would follow that approach, but put the slash close to the top of the letter, and make it flatter, like the improved Caflisch example on Adam's web page.</p>
      <p>Consider making the a with ogonek an non-connecting letter on the right side. Not every letter needs to connect to the next, and in a naturally written form the ogonek forms a stroke reversal off the shortened exit stroke of the a, like this (my modified Bickham Pro):</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/bickhampolish_4868.gif"></div><p></p>
      <p>Of course, the same applies to the other ogonek diacritic letters, with the exception of the o with ogonek, in which the ogonek is added as a separate stroke, not a reversal.</p>
