    <p>Hi,</p>
    <p>I’m looking for the ideal typeface to put my name - Benjamin Knight - in. I started by looking at the usual suspects... Helvetica and Univers and Futura etc. Heldustry wasn’t bad. But they just don’t look right. It might be that the particular combination of letters in my name just doesn’t look good. Any help is much appreciated.</p>
    <p>It’ll be on letterheads and business cards etc etc. But also on - interlaced - tv screens... so best not to go thinner than medium weight, lest it disappear between pixels. Sans serif is probably better, but I could be talked round. I want something that looks reasonably slick and masculine; sort of the Michael Mann of typefaces.</p>
    <p>Any ideas?</p>
    <p>Thanks in advance,</p>
    <p>Benjamin.</p>
