    <p>I've been freelancing so long it seems horrible. I've been offered a FT job with full benefits for $14. an hour - that's under 30k. The work is not hard, and not interesting at all. It's production work for a small publication - who still uses Quark 4 and PageMaker.</p>
    <p>Is the pay really bad? opinions?</p>
