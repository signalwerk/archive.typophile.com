      <p>James has an excellent point that I wish I had made: the bennies sure don't make up much, unfortunately.  </p>
      <p>The standard of living is pretty high here in Calgary -- 1 br are going for around $1,000, and car insurance would be probably $3,000 (I'm assuming you're in your twenties) -- yet there are still a few places that are only willing to pay $11-14 for junior designers.</p>
      <p>Needless to say, they're having a hard time filling those jobs.  ;-)</p>
