      <p>You guys have convinced me it's not worth giving up my nights for.  When I really thought about what my lifestyle would be like working until 5am  ......  no more long dinners with great wine and funny friends, no late movies, no frolicking in the midnight sun this summer. </p>
      <p>It's different to work nights and still be able to go out afterwards for a beer with co-workers - but this job will kill the only time of day I look forward to.  </p>
      <p>Oh, and BTW, I love the cold, the snow and ice fog, and yes, even the darkness. Anchorage is all stars, northern lights and five-hour long glowing pink sunsets in the winter.  Gorgeous. </p>
      <p>Thanks for the advice, gang. </p>
      <p>AK</p>
