    html: <p>If a 1br averages to $800 the job market should probably support a little more than $14/hr for junior professional work, but not much. Take the job on the condition that you won't do any unpaid overtime so that you can freelance on the side to make ends meet, and then in a year or two go job hunting with a bigger portfolio and full-time professional experience on your side.</p>
