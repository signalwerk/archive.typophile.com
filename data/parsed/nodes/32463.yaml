      <p><em>L: The standard of living is pretty high here in Calgary</em></p>
      <p>D: And if I hear correctly, you can get nearly $14 an hour sweeping floors.</p>
      <p>Well, not quite. Our local bottle shop pays $11 to start, and the Blockbuster vid kitty-corner from them pays $9.50.</p>
      <p>That being said, I had an errand to run in one of our "with-it" neighbourhoods (Inglewood), and where one of the stylish furn shops was looking to hire part-time.  </p>
      <p>(I'd like something like that these days, to provide a little more steady an income and, more importantly, get me out of the house a bit, as it's one of the few things I do hate about freelancing.)</p>
      <p>So I took a toodle through the shop, attired in a reasonably clean pair of jeans and fairly trendy jacket, discovering that they charge out their designers at $85/hour (with a "free" hour if you buy $500 or more in product), but only paying $15 to staff.  Did I drop off my résumé?  hahahahahahahahaha</p>
      <p>(And they even had a dress code of tailored black pants, high heels, and white blouse!)</p>
      <p>How terribly stylish....</p>
