      <p>I grew up in Anchorage. Besides wanting to get out of there (weather, darkness, ice, etc.) there aren't a whole lot of options for designers, at least when I left in '95. (There were a few agencies, and a few small design firms...) </p>
      <p>The upside of being in a smaller market is if you can get enough clients, freelancing is way more lucrative, and there's not as much competition up there. If you want to do design work, this is not the job to take. If money is tight, get another part time job to supplement your freelance until it picks up. Good luck...</p>
