    <p></p><div class="imageWrap"><img src="http://typophile.com/files/typelogo_5826.gif"></div><p></p>
    <p>Due to several requests and many of you creative types (excuse the pun) not having had time to get round to organising your submissions for our first Type Annual, we've decided to be accommodating and extend the deadline. You now have until November 5 to submit your entries.</p>
    <p>We've also added a new judge to our panel. John Bateson, acting Course Director at the UAL MA Graphic branding and identity course<br>
    and current Chairman of the Typographic Circle Association will be joining Mark, Coralie, Andy and Fiona.<br>
    The Creative Review Type Annual will be published with next February's issue.</p>
    <p>Entry information<br>
    The Type Annual will showcase typeface design itself rather than work that uses type, creating, we hope, a showcase of the best crafted, most innovative and most exciting typefaces produced during entry period – October 2009 to October 2010.<br>
    To be eligible for inclusion, typefaces must have been first released or used within this period. Selected work will be printed in a special February issue of Creative Review.</p>
    <p>The categories are:<br>
    Display<br>
    Text<br>
    Bespoke<br>
    Non-Latin</p>
    <p>The judges will be asked to select work in each category – there are no winners or runners-up and no limit to the number of typefaces to be selected. In addition, the judges will select those of outstanding merit to feature in the Best in Book section.<br>
    Our judges are: Mark Porter, Coralie Bickford-Smith, John Bateson, Andy Dymock and Fiona Ross.</p>
    <p>Deadline: November 5 2010.</p>
    <p>Single entries in one of the four categories cost £50, 2-3 entries cost £100. For more than 3 entries, please contact Sarah Davies.<br>
    Please review our entry guidelines listed on the left-hand side of this page.<br>
    If you have any questions or queries about the CR Type Annual, please contact Sarah Davies or to enter go to <a href="http://www.typeannual.co.uk" title="www.typeannual.co.uk">www.typeannual.co.uk</a></p>
