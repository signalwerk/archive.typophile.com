      <p><cite>The descenders are longer than the ascenders (when you factor in overshoots).</cite></p>
      <p>As far as I can see from the TEFF website, ascenders are 27.2% of the body height, descenders are 28%. Is that enough, in your opinion, to have a detrimental effect on legibility? And what’s the point again of having ascenders that are longer than descenders? I see that you can fit in a lot more lines if you reduce descender height, which makes sense in typefaces like <a href="http://www.teff.nl/fonts/lexicon/index.html" rel="nofollow">Lexicon</a> that are designed for cramped conditions. But is that a relevant factor in every text face (a very broad term)?</p>
