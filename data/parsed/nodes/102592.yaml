      <p>Interesting - I think the case for using Geronimo just got stronger! Although mixing Latin and Arabic is always a pretty complex animal, and I can see pros and cons: on the one hand mirroring Arabic's rich descender space is a great idea; on the other hand -as you say- there are issues of economy, and those might require a Latin with a strong x-height (which comes first at the expense of descenders). Fuller reply soon...</p>
      <p>Thomas, about the spurs: I'm assuming they're coming from the original Gil fonts. Capitals are a place you can get away with mannered stuff like that, although on a common letter like "U" it might be a bit much. BTW the one on the "J" reminds me of the interesting argument Smeijers made in "Counterpunch"; but if that's what Feliciano was thinking he would have done it on the lc as well.</p>
      <p>hhp</p>
