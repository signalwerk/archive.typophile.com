    <p>Greetings all,</p>
    <p>I am evaluating TEFF/Enschedé Geronimo by Mário Feliciano for use in a project:</p>
    <p><a href="http://www.teff.nl/fonts/geronimo/index.html" title="http://www.teff.nl/fonts/geronimo/index.html">http://www.teff.nl/fonts/geronimo/index.html</a></p>
    <p>It is a very expensive, high-end typeface. Yet I have not been able to find any review of it, nor have I been able to find it in use anywhere. Questions:</p>
    <p>What are your impressions of Geronimo?<br>
    Do you know of any books or pdf samples that use it (other than the specimen sheet provided by TEFF)?<br>
    Are there similar fonts out there that are comparable, preferable, or not?</p>
    <p>Your thoughts, wisdom, and recommendations are much appreciated in advance.</p>
    <p>Best wishes<br>
    Idris</p>
