      <p>I was waiting for others to chime in first, but I guess -as you say- it's a rara avis of a font so very few people have any experience with it.</p>
      <p>The first thing I should say is: I can't tell if the high price would be justified for you - it depends a lot on you, and I know almost nothing about you... The second thing I would say is that it looks like a polished design of distinct character.</p>
      <p>The third thing I would say is why I'm bothering to write this post... People might call this a pet peeve of mine, but the vertical proportions make no sense to me. The descenders are <em>longer</em> than the ascenders. I believe that in a text face this is a no-no. Look at that "g": it's having too much fun, at the expense of the ascenders, which are much more common in text. In a "lyrical" text face (which might actually be an oxymoron) with a small x-height I might be able to appreciate allowing the descenders to express themselves; but Geronimo looks like a workhorse design <em>above the baseline</em>. It just doesn't make sense.</p>
      <p>In terms of recommending something similar: I don't usually like to do that sort of thing, but in terms of a comparable overall atmosphere I would suggest looking at Fleischmann revivals. See the second article here: <a href="http://www.typographer.org/2005_06_01_digests.html" title="http://www.typographer.org/2005_06_01_digests.html">http://www.typographer.org/2005_06_01_digests.html</a></p>
      <p>BTW one thing I never get tired of is TEFF's wonderful online character set presentation: that super-wide rendering with horizontal scrolling makes <strong>so</strong> much sense to me. I've done something similar -if not nearly as accomplished- on my own site (in fact since early 2000).</p>
      <p>hhp</p>
