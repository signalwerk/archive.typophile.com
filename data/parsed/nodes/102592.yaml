      <p>Hi hrant,</p>
      <p>Thanks for initiating a response thread!</p>
      <p>The project is going to be Arabic intensive. The "atmosphere", so to speak, that I'm looking for is both scholarly and literary, with lots of footnotes and marginal notes. I'm looking for a unique Latin text font to complement the advanced classical Arabic font that I'm developing. The Latin font should be traditional/historical/classical yet modern/contemporary (not in the technical senses of those adjectives). </p>
      <p>(The feel of, say, Lexicon may be too contemporary for the aesthetic I'm aiming for -- I looked at pdf samples of the ESV Study Bible -- which has many of the kind of layout technicalities I will use. But I'm still thinking about it.)</p>
      <p>One of the things I like about Geronimo is its hybrid Dutch/Spanish feel. Spanish aesthetics, of course, are often a natural complement to Arabic, given the long historical connections between Spain and the Arabic world (the 'c' carries at least a hint of that complementarity). Yet, at least at this stage of my development of typographical sensitivity, I have generally found the technicals of Dutch typefaces (e.g., the DTL collection) most impressive. </p>
      <p>It is interesting that you mention the 'g', because that is the letter that stood out to me the most in terms of the aesthetic I'm looking for. But as you point out: The individual letterforms are not as important as the overall texture produced by the font in action. Hence my desire to see it in action somewhere.</p>
      <p>About the ascenders/descenders: In the context where Arabic and Latin are mixed, a bit more leading for the  Latin is needed, so perhaps that ameliorates at least some of your concern. In side-by-side translation, Classical Arabic is much more economical and efficient, in terms of semantics, than Latin. So it takes up to twice as many lines of translated text to match the original number of lines in the Arabic. I'm curious as to how Geronimo would compare to, say, Caslon in such a situation.</p>
      <p>Thank you for the reference to Yves' article. I took a look at the sample of Eudald: Feliciano's Eudald Text and Eudald Microplus fonts look worthy of a closer look, but it seems that Feliciano has taken them off the market, and only the Gran version (Eudald News) is available for purchase.</p>
      <p>Idris</p>
