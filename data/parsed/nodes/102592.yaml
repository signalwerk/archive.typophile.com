      <p>It's not the length of the descenders per se that's the problem - in fact extenders nominally help readability. It's the fact that different parts of the vertical space are "fighting" for the available real-estate, and the ascenders -thanks to their much higher frequency*- deserve (i.e. can use) more room. And I think it's not just about consecutive lines not touching: there's what I call "apparent leading" and the need to make long lines (that actually aren't very close) easy to read. It's pretty rare that people -or at least people I consider to be good designers- use more leading than they need. Remember that page-turns are disruptive to reading. Sure, it's not the end of the world - it's simply sub-optimal, and you're not getting much benefit in return.</p>
      <p>* Although admittedly they actually need less room to elaborate their shapes - except for the "f" they're all sticks.</p>
      <p>I think it's quite telling that very few text fonts have such long descenders. Interestingly the TEFF library exhibits a high proportion of them, although that's mostly due to the work of Gerrit Noordzij, who seems to have a strong preference for making the ascenders and descenders exactly* the same, which to me seems unduly Modernist, and leads me to state one of my favorite maxims: symmetry is a lost opportunity.</p>
      <p>* Although unlike in Geronimo he <em>does</em> seem to factor in overshoots.</p>
      <p>Now, I certainly agree that different fonts target different uses, but a font also needs to be versatile, and when it comes to text -where the beauty of individual glyphs takes a back seat to their contribution to texture- it just doesn't seem like a good design compromise. Does Geronimo strike you as a very "lyrical" design that would be set unusually loose? To me it doesn't. And really, if it were shooting for that atmosphere the <em>ascenders</em> would be long too! So no matter which way you cut it, the ascenders are ideally longer than the descenders <em>in a text face.</em></p>
      <p>hhp</p>
