    <p>When you're wearing your pine pyjamas, what typeface do you want them to use on your tombstone?</p>
    <p>I'm going with <a class="freelinking external" href="http://www.linotype.com/53304/linotypeunivers530basicmedium-font.html" rel="nofollow">Linotype Univers® 530 Basic Medium</a>.</p>
    <p>And <a class="freelinking external" href="http://en.wikipedia.org/wiki/Adrian_Frutiger" rel="nofollow">Adrian</a>, if you're out there, <em>please</em> design some small caps and old-style figures for Univers.</p>
