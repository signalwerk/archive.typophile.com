      <p>Correction: They’re called monuments or memorials. It’s only a tombstone if it is on a tomb, which is a large vault, which is different from a grave. Also, the correct word is “cemetery,” not “graveyard.”</p>
      <p>I may be an enthusiastic computer nerd amateur in the world of typography and design, but I was a professional in the world of monuments. I spent four summers of my youth working at my family’s funeral home, installing them in cemeteries (along with many other kinds of chores that you probably don’t want to read about here). And my brother is a regional manager for a major Canadian memorials company. And I live half a block from one of the biggest cemeteries in Calgary.</p>
      <p>My brother used to have his own firm, before he (happily) sold it to the company he now works for. He used software called “MonuCAD” for the designs. Letters are (generally) sandblasted into the rock, not carved. Monument production is quite, quite industrial.</p>
      <p>Could you have guessed that I’m a member of the Facebook group “You know you grew up in a Funeral Home if....”?</p>
      <p>Jim Tubman<br>
      Calgary, Alberta, Canada<br>
      "The Stampede City"</p>
      <p>P.S. Has anyone seen a monument done in Comic Sans?</p>
