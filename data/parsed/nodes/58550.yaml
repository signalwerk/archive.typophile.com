      <p>I make my living entirely from commissioned lettering and calligraphic work in Wales, UK and in recent years the request for hand carved headstones has increased enormously. The reason is that more and more people are getting fed up with the cold typographical approach of most monumental masons and they want to have something more personal and unique.<br>
      I can carve any typeface but type faces for 2D rarely work on stone due the influence and direction of light on the v-cut incision and most are not sympathetic to the chisel, wrist movement nor to the stone.<br>
      Letters suitable for carving are usually too heavy for typefaces as the horizontal lines in particular need to be heavier as the shadow reduces their weight. The weight of the letters will depend on which direction the stone faces and how much light falls on them and if there are any trees or buildings around that would prevent enough light to come through.<br>
      Every headstone I design and carve is individually considered for the needs of the family and its location and often I need to  personalize the letters and working with typefaces would restrict creativity and individuality.</p>
      <p>If you are interested to see some of my headstones and other work please visit my web site:</p>
      <p><a href="http://www.ieuanreeslettering.co.uk" title="www.ieuanreeslettering.co.uk">www.ieuanreeslettering.co.uk</a></p>
      <p>Ieuan Rees</p>
