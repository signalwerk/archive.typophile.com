      <p>&gt; I spent four summers of my youth working<br>
      &gt; at my family’s funeral home</p>
      <p>My brother is a minister and has heard some interesting anecdotes from his funeral director friends. Like the time one of the funeral directors was listening to a ball game on the radio while driving the hearse to the cemetery, and was so distracted that he drove 5 miles past the cemetery, with a long procession of mourners following dutifully in their cars. </p>
      <p>When he realized his error he turned the hearse around in a parking lot, with all the mourners following him, and headed back to the cemetery. He expected the family to chew him out later, but they never said a word.</p>
