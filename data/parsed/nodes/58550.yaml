      <p>Andreas: <em>Disillusioned?</em></p>
      <p>Typography is a technology for the reproduction of text. Since a tombstone is a unique production, both in terms of being a singular material object and containing text that is relevant only to the individual there interred, typography strikes me as an inappropriately generic and industrial technology.</p>
      <p>Alaskan: <em>You be surprised at how strict graveyards are about tombstone design.</em></p>
      <p>This is certainly true in large urban and suburban cemeteries. In North America, many places allow only flat, cast memorial plaques on concrete bases, so as to make it easier to cut the grass.</p>
      <p>Thankfully, my local cemetery isn't like that.</p>
      <p><img src="/sites/default/files/old-images/gabcem_4718.jpg"></p>
