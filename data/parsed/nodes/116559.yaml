      <p>I am guessing that maybe the features are not correctly registered to all the writing systems in the font? Perhaps the "old texts" are existing document files that are tagged in the app as being Greek, and thus triggering processing of only the Greek features. The "new texts" may not have any particular language assigned and hence, work fine using default processing.</p>
      <p>Forgive me if this is already well-understood and not what is happening here.</p>
