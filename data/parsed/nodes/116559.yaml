      <p>OK. I had misunderstood. I took your original post to mean the ligatures were not working -- that is, were not forming. Everything I wrote was based on that (incorrect) assumption.</p>
      <p>For what is actually going on with the two files, someone would likely have to sit down with everything to de-bug. All FontLab will do is let you see the code used for forming the ligatures. Why there is extra space may be due to something in the OT features, but without everything available for examination, one just can't tell. And of course, that may not be the source of the problem.</p>
