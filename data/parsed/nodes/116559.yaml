    <p>Dear friends<br>
    Im not enough experienced with FontLab and I need some help. Im facing the following problem while working in InDesign (CS6 - v.8.0.2, MacOSX 10.9.2). OpenType fonts with Greek ligatures do not show old texts correctly when OT features are enabled, in contrast with texts typed from scratch.</p>
    <p>Old/new text<br>
    Language: Greek<br>
    Ligatures: enabled<br>
    Result: no ligatures<br>
    ___________________________<br>
    Old text<br>
    Language: English<br>
    Ligatures: enabled<br>
    Result: corrupted text with ligatures<br>
    ___________________________<br>
    New text<br>
    Language: English<br>
    Ligatures: enabled<br>
    Result: ligatures ok</p>
    <p>Has anyone encountered also this problem? Is this an Adobe or a FontLab issue? Any help or suggestion will be very much welcomed. Thank you very much in advance!</p>
    <p>Konstantinos Siskakis<br>
    Thessaloniki, Greece</p>
