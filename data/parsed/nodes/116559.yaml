      <p><cite>I have to say that all those texts work properly in InDesign CS4</cite></p>
      <p>Same text files, same font files? We're getting beyond my expertise here, but I'd say, then, it might be language tags. Significant changes in how those interact with CS4 and CS6, I believe. But that shouldn't scramble the English. We don't use language tags in our shop, but of course it is a closed system.</p>
      <p>Just to make sure: You have exactly the same text files, and exactly the same font files. Everything is fine using CS4, not fine with CS6. (And you're not using the World Composer with text set as right to left in CS6... No, that'd be noticeable.)</p>
