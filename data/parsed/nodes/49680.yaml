  - id: 302443
    user: 15738
    date: 2008-09-20T11:05:00
    date_raw: 20 Sep 2008 — 11:05am
    votes: null
    html: <p>Thanks for the ID! They still use Klavika. I can't be sure, but I think Klavika is used in promos where they leave a show's logo intact, and Antenna is used when they replace logos with a cohesive font. I think single-show promotions mostly use Klavika, and there may be a distinction made for dramas vs comedies. During the summer, Avant Garde was filling the role of Antenna during their "All-American Summer" campaign.</p>
