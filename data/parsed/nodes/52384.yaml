    <p>"The intellectual and philosophical developments of that age (and their impact in moral and social reform) aspired towards governmental consolidation, centralization and primacy of the nation-state, and greater rights for common people. There was also a strong attempt to supplant the authority of aristocracy and established churches in social and political life: forces that were viewed as reactionary, oppressive and superstitious." </p>
    <p><a href="http://en.wikipedia.org/wiki/Age_of_Enlightenment" rel="nofollow">http://en.wikipedia.org/wiki/Age_of_Enlightenment</a></p>
    <p>Some ideas:</p>
    <p>Baskerville<br>
    Caslon<br>
    Fleischmann<br>
    Fournier<br>
    Bell</p>
