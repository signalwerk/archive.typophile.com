    html: <p>That all sounds very wonderful and radical, but in reality there wasn't a lot happening in Anglosphere typography during that era (and before), due to the repressive state monopoly on publishing exercised by the Company of Stationers in the UK. The enlightenment of typography really occurred in the early 19th century, when new commercial media opened the doors to new forms of type.</p>
