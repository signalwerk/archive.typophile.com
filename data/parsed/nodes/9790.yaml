    html: <p>I think I know what this is. Somebody took Computer Modern (the most ubiquitous font from the METAFONT system), and tweaked the hell out of the parameters. The low x-height is suggestive of CM Dunhill, but compared with that font I can see the right serifs on 'hn' halved, the 't' taller (and with a less upright tail terminal), the 'e' and 's' wider, and the serifs on 'CSs' smaller. <br> <br>That said, there are some characteristics that I feel absolutely give this one away, including the ball on the 'r', and the hairline tail on the C from 6 o'clock to 3 o'clock.</p>
    html_clean: <p>I think I know what this is. Somebody took Computer Modern (the most ubiquitous font from the METAFONT system), and tweaked the hell out of the parameters. The low x-height is suggestive of CM Dunhill, but compared with that font I can see the right serifs on 'hn' halved, the 't' taller (and with a less upright tail terminal), the 'e' and 's' wider, and the serifs on 'CSs' smaller. <br> <br>That said, there are some characteristics that I feel absolutely give this one away, including the ball on the 'r', and the hairline tail on the C from 6 o'clock to 3 o'clock.</p>
