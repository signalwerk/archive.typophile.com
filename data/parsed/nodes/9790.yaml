  html: <p>Hi, all.  Saw this pretty serifed font at an art gallery in New Orleans and wondered if you could ID.  The gallery owner says it's called "Amphoral," but I can't seem to find any references to that.  Thanks! <br><img src="http://www.typophile.com/forums/messages/83/67471.jpg" alt="sorenlogo"></p>
