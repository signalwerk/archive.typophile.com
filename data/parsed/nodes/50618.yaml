    html: |-
      <p>OK, I'm here. I tried to look at this like I'd never seen it before, so here are a bunch of semi-randomly listed comments. (Whoa, this got a bit epic)</p>
      <p>I'm in love with your italics! Where the roman is amiably nonchalant and "human-handed", the italics bring in a level of self-confident, refined elegance that's just lovely, and amazingly enjoyable (without losing the connection to the roman though!). Great work. (I may have said this before :-) )</p>
      <p>It still puzzles me that when I look at some (if not most) of your italic glyphs up close – like the "s" above, or the "j" – there's a hint of reversed stress that seems unusual. But in text, it works/reads beautifully, so that probably means don't change a thing. :-)</p>
      <p>My favorite glyphs are the italic "k" and "q". Regarding what Ben said about the "q", I agree the flick on the tail works better (= would probably be expected more) in the italic than the roman, but I for one like it in the roman too.</p>
      <p>I also really like the alternate "z"s in the roman and the italic. And the alternate italic "y". I hope all of these can stay. (Dunno about over there, but in German it's quite usual for people to cross their "z" in handwriting, so to me the crossed "z" makes a lot of sense here, as a device to make it look more handwritten, whereas the normal "z" would look more typographic.)</p>
      <p>There's some minor lumpiness to your italic "m" I think. Specifically, the top-right of the first counter.</p>
      <p>Your eszett is in danger of being dark in the top-left, but I'm not sure how to fix it.</p>
      <p>The word "the" (of all things) looks strange in your italics :-(. I suspect it's either the relative widths ("t"'s foot being too wide compared to "h") or spacing (in terms of making the "t" tighter on the right side).</p>
      <p>To my eye, there's some spacing weirdness in your examples of contextual "f" substitutions – in "offhand", the "fh" seem much closer than the "ff". Might you be overdoing the "whee, I can space this closer now" effect from the narrower "f"? :-) (I've been guilty of that…)</p>
      <p>Looking at your roman again, I'm not sure about some of the cap proportions (which I admit is uncool to say *now*, but it just struck me). In DUCKLING and QUIZZICAL, the "U" looks rather narrow to me. Maybe the "A" (and "V") are also a bit on the narrow side? Not sure.</p>
      <p>There's some minor curve wobbliness in the oldstyle "3" methinks, in the bottom.</p>
      <p>Your commas and apostrophes are great. I'm envious :-)<br>
      Don't forget to kern your punctuation. ("NEAT -O")</p>
      <p>The small caps seem a bit smallish to me seen next to the lowercase, but that might just be me. (BTW, there's a lc eogonek instead of a smallcap in the Polish sample text, not sure if that's a problem in the font or the setting?)</p>
      <p>And I think something went wrong with the spacing of your italic fractions.</p>
      <p>*</p>
      <p>Diacritics:</p>
      <p>Your tilde is enviably nice. </p>
      <p>Your accents are quite light. Is that intentional?</p>
      <p>Also, you seem to have found the only coherent Hungarian sample text without hungarumlauts ;-). But I see you have some. They're a pretty strange shape in the small caps – I believe they're supposed to relate to the acutes, but I'm not sure.</p>
      <p>Regarding the ogoneks, have you seen Adam Twardoch's how-to?<br>
      <a href="http://www.twardoch.com/download/polishhowto/ogonek.html" title="http://www.twardoch.com/download/polishhowto/ogonek.html">http://www.twardoch.com/download/polishhowto/ogonek.html</a><br>
      I'm not quite sure but it looks like the one on your "a" exceeds the width of the base glyph on the right, which seems to be a no-no.<br>
      (BTW also see what he says about zdotaccent, where the dot should be the same as the tittle apparently.)</p>
      <p>Your italic lslash seems a bit stiff. I think I'd model it after the italic "l" (at least that would seem logical – but I don't read Polish so mind the salt).</p>
      <p>*</p>
      <p>Really unimportant stuff:<br>
      Your "fj" lig and your italic dollar sign aren't merged. :-)</p>
      <p>I'm beginning to eagerly look forward to seeing this out in the wild. It's really quite nice! And holds up impressively well against those other fonts in your sample. Very nice work. :)</p>
      <p>[EDIT: That new italic "Q" rawks!]</p>
    html_clean: |-
      <p>OK, I'm here. I tried to look at this like I'd never seen it before, so here are a bunch of semi-randomly listed comments. (Whoa, this got a bit epic)</p>
      <p>I'm in love with your italics! Where the roman is amiably nonchalant and "human-handed", the italics bring in a level of self-confident, refined elegance that's just lovely, and amazingly enjoyable (without losing the connection to the roman though!). Great work. (I may have said this before :-) )</p>
      <p>It still puzzles me that when I look at some (if not most) of your italic glyphs up close – like the "s" above, or the "j" – there's a hint of reversed stress that seems unusual. But in text, it works/reads beautifully, so that probably means don't change a thing. :-)</p>
      <p>My favorite glyphs are the italic "k" and "q". Regarding what Ben said about the "q", I agree the flick on the tail works better (= would probably be expected more) in the italic than the roman, but I for one like it in the roman too.</p>
      <p>I also really like the alternate "z"s in the roman and the italic. And the alternate italic "y". I hope all of these can stay. (Dunno about over there, but in German it's quite usual for people to cross their "z" in handwriting, so to me the crossed "z" makes a lot of sense here, as a device to make it look more handwritten, whereas the normal "z" would look more typographic.)</p>
      <p>There's some minor lumpiness to your italic "m" I think. Specifically, the top-right of the first counter.</p>
      <p>Your eszett is in danger of being dark in the top-left, but I'm not sure how to fix it.</p>
      <p>The word "the" (of all things) looks strange in your italics :-(. I suspect it's either the relative widths ("t"'s foot being too wide compared to "h") or spacing (in terms of making the "t" tighter on the right side).</p>
      <p>To my eye, there's some spacing weirdness in your examples of contextual "f" substitutions – in "offhand", the "fh" seem much closer than the "ff". Might you be overdoing the "whee, I can space this closer now" effect from the narrower "f"? :-) (I've been guilty of that…)</p>
      <p>Looking at your roman again, I'm not sure about some of the cap proportions (which I admit is uncool to say *now*, but it just struck me). In DUCKLING and QUIZZICAL, the "U" looks rather narrow to me. Maybe the "A" (and "V") are also a bit on the narrow side? Not sure.</p>
      <p>There's some minor curve wobbliness in the oldstyle "3" methinks, in the bottom.</p>
      <p>Your commas and apostrophes are great. I'm envious :-)<br>
      Don't forget to kern your punctuation. ("NEAT -O")</p>
      <p>The small caps seem a bit smallish to me seen next to the lowercase, but that might just be me. (BTW, there's a lc eogonek instead of a smallcap in the Polish sample text, not sure if that's a problem in the font or the setting?)</p>
      <p>And I think something went wrong with the spacing of your italic fractions.</p>
      <p>*</p>
      <p>Diacritics:</p>
      <p>Your tilde is enviably nice. </p>
      <p>Your accents are quite light. Is that intentional?</p>
      <p>Also, you seem to have found the only coherent Hungarian sample text without hungarumlauts ;-). But I see you have some. They're a pretty strange shape in the small caps – I believe they're supposed to relate to the acutes, but I'm not sure.</p>
      <p>Regarding the ogoneks, have you seen Adam Twardoch's how-to?<br>
      <a href="http://www.twardoch.com/download/polishhowto/ogonek.html" title="http://www.twardoch.com/download/polishhowto/ogonek.html" class="link-external">http://www.twardoch.com/download/polishhowto/ogonek.html</a><br>
      I'm not quite sure but it looks like the one on your "a" exceeds the width of the base glyph on the right, which seems to be a no-no.<br>
      (BTW also see what he says about zdotaccent, where the dot should be the same as the tittle apparently.)</p>
      <p>Your italic lslash seems a bit stiff. I think I'd model it after the italic "l" (at least that would seem logical – but I don't read Polish so mind the salt).</p>
      <p>*</p>
      <p>Really unimportant stuff:<br>
      Your "fj" lig and your italic dollar sign aren't merged. :-)</p>
      <p>I'm beginning to eagerly look forward to seeing this out in the wild. It's really quite nice! And holds up impressively well against those other fonts in your sample. Very nice work. :)</p>
      <p>[EDIT: That new italic "Q" rawks!]</p>
