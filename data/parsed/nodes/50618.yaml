      <p>I think that depends if you want all the alternates accessible at once (salt) or to create different stylistic sets to switch on and off different alternates in groups(ss01).</p>
      <p>You should also put in the {} the name of the feature in real words, so for example:</p>
      <p><cite>feature ss01 { # Stylistic Set 1</cite><br>
      as the first line</p>
