      <p>Emi? Cute!<br>
      And, welcome to the "E-named fonts club". :-)</p>
      <p>I printed this out, and tried looking at it as if I'd never seen the font before. And I must say, this is incredibly amiable and seems to be working very well indeed. I'll admit that I'm not usually a big fan of "handwritten" fonts, but I do like yours a lot! The tons of work you've put into this really show, as does the joy of making it.</p>
      <p>Here are some things that struck me:</p>
      <p>There might be some weight issues with certain glyphs, but I can't be quite sure since I'm still battling my printer. Particularly, I'm wondering if the top of the "8" is too light (especially compared to the ampersand, which looks very nice); the small cap "A" in the Latin sample looks a bit dark and the tilde on the "a" in the Portuguese, very light. The percent sign seems rather light too. But like I said, that may or may not actually be in the font.</p>
      <p>I like the "Q" a *lot*.</p>
      <p>Your guillemets (both single and double) seem rather mechanical. I wonder if they could have more of that handwritten feel.</p>
      <p>I agree with Steve that the eszett feels too wide. I think it's especially the bottom part – it sorta looks too much like a truncated "s".</p>
      <p>Ligatures and "f" alternates look great!</p>
      <p>I think the apostrophe is fine. </p>
      <p>The accents look better, but I'm wondering if they're now tapering too much towards the thin end? They look really pointy, which isn't really something you have in the rest of the font. That makes them look a bit aggressive in context.<br>
      Btw I think the circumflex could benefit from not being quite as flat, and it doesn't seem to share the contrast of the "straight" accents?</p>
      <p>The asterisk is lovely.</p>
      <p>I'm quite excited about this. What a nice font.</p>
