      <p>Quickly, before I go to bed, there are two things I noticed when I looked briefly at the new PDF:<br>
      1. Your 'æ' still has the tail of the 'a' included in the glyph. Now, this is fairly unorthodox, and it begs the question: was it intentional? I'm not exactly sure how this character is normally written by hand, but I was under the impression that it is composed of one stroke.<br>
      2. The slashes on 'Ø' and 'ø' are at different angles, which drew my eye.</p>
      <p>Besides that, I love how this font is turning out. Good job!</p>
