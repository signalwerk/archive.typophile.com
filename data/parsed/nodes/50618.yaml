      <p>Not sure about the spur on the "G". I'd possibly try something like what I did<br>
      to the "b" in my font if you remember; just raise the join off the baseline.<br>
      But that may just be me. :-)</p>
      <p>FWIW, if I was you (and if you're not doing this already), I'd print out a ton<br>
      of glyph samples of everything you have (outlines filled in, no nodes showing),<br>
      stick them up on a large empty wall (maybe shuffle them into different combinations from time to time), and just look at them whenever you happen<br>
      to pass by. For me, that seems to help for "spontaneously" spotting things<br>
      that may not be quite cogent yet. &amp; possibly, think some more about the concept<br>
      and how it can "ooze down" into the details (for one thing, if you're trying<br>
      to make the caps more casual, I'd also go with less exact/circular rounds in the<br>
      "O", "G" etc.).<br>
      And of course: add salt to everything I'm saying.</p>
      <p>I like the new "Q", but keep wondering if more can not be tried/done with that tail… Maybe have it grow out of the curve with sort of an overlap like you have in the bottom of the lowercase "n", "a" et al.? Though that might get too cute.</p>
      <p>Play around :-)</p>
