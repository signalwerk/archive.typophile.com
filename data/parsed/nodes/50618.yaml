      <p>I love the font. It really reminds me of handwriting, only more polished. The only things that really jump out at me for now are the masculine and feminine ordinal indicators (ª and º). Also, the 'tt' ligature seems somewhat wide.</p>
      <p>As for the R and AEFH, I think that the leg of the R sticks out a little too far, but I like the crossbars on the A E F and H. The oldstyle '1' also needs work--it looks like it's about to fall over to the left.</p>
      <p><em>What would be the most useful kinds of figures in a font like this?</em> Well, I would think that alternatives would be a nice addition. Because (to me) it feels like a handwritten font, a single-story 'a' would be nice, as would other common variants seen in peoples' handwritings (a crossed 'z', a serifed 'I', etc.)</p>
