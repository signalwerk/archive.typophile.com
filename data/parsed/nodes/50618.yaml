    html: |-
      <p>Thanks, James and Paul, for the helpful comments. I appreciate the time you spent looking at this. I've uploaded a new pdf that includes some of your suggestions heeded.</p>
      <p><em>The majuscules feel much more formal and machine-made than the minuscules; </em></p>
      <p>The more formal caps are intended - I'm trying to pull off something like this (in terms of formal caps and more cursive minuscules):</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/600px-Arrighi_italic_4900.png"></div><p></p>
      <p>I may have to abandon that conceit if I can't get it to work, though.</p>
      <p><em>s, v, w and x have the same stiff feel.</em></p>
      <p>Agreed; I've softened v, w, and x, and will take a look at s. </p>
      <p><em>There are also letters that get a little too informal—a feels a little sloppy with its left lean.</em></p>
      <p>Yes, I'm not terribly happy with that a. I'll try to clean it up. I'm trying to retain a bit of the "loopiness" in the stem on the right, but reconciling that with the top curve is proving difficult. A single-story a is much easier to meld with the style, but if I can get it to work I'd prefer a two-story.</p>
      <p><em>And k is distracting in the same way that the r is in Palatino Sans.</em></p>
      <p>I wondered if I would get away with that! </p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Picture_3614.gif"></div><p></p>
      <p>knock is closest to working, no?</p>
      <p><em>I would also consider doing more with stroke terminals. The tapering round descenders on j and y are gorgeous. Coming up with a system for angled/tapered terminals throughout will really push this face up a notch.</em></p>
      <p>Excellent - that will be my next big project for this.</p>
      <p><em>Last, throw together some ligatures or contextual alternates, at least the f-ligs, just for visual punch. I realize that your letters don’t crash, but this face is just begging for some cool ligatures.</em></p>
      <p>Another good idea. I've added fl, fi, and ti. The latter two connect at the crossbar. Will ponder more.</p>
      <p><em>well without much of a purpose given for this to satisfy, all i can really say is that the g and k bother me,</em></p>
      <p>k discussed above. I've reverted to the original, one-story g in the latest pdf. Not as fun but more fitting to the face, I suppose. Maybe I should pull the descender around a bit further. </p>
      <p>I'm not sure whether to have another go at the two-story g. Was its problem that it was poorly drawn, too busy, or just the wrong flavor for the font?</p>
      <p><em>as do the differing approaches towards triangular corners (A, M, Z).</em></p>
      <p>I've now chopped the points off of A, W, and V to match N, M, and Z. Question: does a pointy vertex in the middle of M and W look weird?</p>
