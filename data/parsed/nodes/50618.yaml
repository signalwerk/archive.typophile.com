      <p>I've made some printouts and will look through them. Already I've seen an idea for the concept "oozing down" to the details - making  suggestions of a loop in the middle of B and R (like the K already had). They are pictured below. </p>
      <p>I've also played with the Q some more. I like the idea of the tail coming out of a loop from the right side. Below is the result - I like it but I wonder if that big black part at the bottom will be too spotty in text. I experimented with disconnecting the left side at the bottom (like a cursive form of Q, "2-like") but couldn't get a solid looking letter out of it.</p>
      <p>I also experimented with a much loopier G but that got cartoonish rather quickly. </p>
