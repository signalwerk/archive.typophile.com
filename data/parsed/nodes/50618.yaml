    html: |-
      <p>Lastest pdf up top (loopysample10.pdf) shows status as of today. I've made a ton of tweaks. Some of the more prominent (or at least the ones I can remember now) are:</p>
      <p>- Slimmed down some "secondary" strokes like bar, slash, the short strokes on currency symbols, diacritic slashes, etc.<br>
      - Added a little more curve to some of the horizontals like top of T and Z, bottom of E and L, etc.<br>
      - Knocked the vertical part of the fives off-vertical<br>
      - Removed W.salt<br>
      - made many of the dots (e.g. period, colon, bullet, tittle, umlaut) more (but not entirely) circular<br>
      - redrew ear of g.salt<br>
      - addressed some of the weight problems and wonky curves</p>
      <p>I also changed the hook of the f, and with that, much of the ligature setup. Instead of the old ligatures that had that f hook stretch to bridge with ensuing ascenders (fl, fb, etc.), I have designed an alternate f with a slightly shorter hook to go before those letters. The ligatures that connect with the crossbar (of f or t) are the only ones that remain, and are all discretionary.</p>
