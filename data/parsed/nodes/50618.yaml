      <p><em> what’s your intended use?</em></p>
      <p>I'm looking for something that will work in smallish sizes (say, 10pt up to subtitle size), and is comfortable enough for middling-length texts, such as sidebars or captions. Maybe places where one might otherwise use running italics? I think the "handwritten" voice of this might work well for pull-quotes. It looks to me like it also might work as an alternative to "architect" fonts (or Comic Sans!), where a somewhat casual, but not condescending, style is desired.</p>
      <p>This started as formal experimentation so the potential uses are more "emergent" than intended from the get-go. If it would be beneficial for the design to define its uses more precisely and if there are good practices for doing that, I'd welcome that feedback too.</p>
  - id: 307869
    user: 14722
    date: 2008-10-23T07:27:00
    date_raw: 23 Oct 2008 — 7:27am
    votes: null
    html: |-
      <p>It looks good, but needs more unity. I like the bumps that come from the cursive styling, they give the letters a very friendly tone. I do think that this could make a great face for running copy in the same way Palatino Sans is. </p>
      <p>The majuscules feel much more formal and machine-made than the minuscules; s, v, w and x have the same stiff feel. There are also letters that get a little too informal—a feels a little sloppy with its left lean. And k is distracting in the same way that the r is in Palatino Sans.</p>
      <p>I would also consider doing more with stroke terminals. The tapering round descenders on j and y are gorgeous. Coming up with a system for angled/tapered terminals throughout will really push this face up a notch. </p>
      <p>Last, throw together some ligatures or contextual alternates, at least the f-ligs, just for visual punch. I realize that your letters don’t crash, but this face is just begging for some cool ligatures.</p>
