      <p>Posted an updated pdf up top showing status as of today. Since the last one I've added lots of OpenType features. There are now four sets of figures (combos of lining/oldstyle and tabular/proportional). I'm thinking about having the f ligatures standard and the t ligatures (tt, ti) discretionary.</p>
