      <p>Your italic is looking really nice there :) In fact so is the regular!<br>
      Here are my thoughts.<br>
      Italic:<br>
      I love the k. I think you could transpose its leg onto the Q, which to me doesn't quite work strongly enough.<br>
      The stem of q looks thin. And to some extent the same goes for g.<br>
      Compare S and O and you'll see O looks quite thin in the SE and NW. S looks a bit heavy all round.<br>
      Comparing U and V makes me think U needs thicker uprights.<br>
      I think æ should have a one-storey a.</p>
      <p>Regular:<br>
      I prefer the t with the tail. I prefer the lower height on it too. Perhaps the original t could be shortened?<br>
      Square and curly brackets look narrow.<br>
      After all that discussion about your q, I think now I prefer the straight descender one.<br>
      The strokes on @ look thinner than the other glyphs.<br>
      I might consider making the arms on k steeper with the leg joining the arm rather than joining the stem. In comparison to n or p, the gentler slope of the arms looks a bit disharmonious.<br>
      Crossbar on £ looks as though it could go down and right a bit. (Especially on the SC and lining versions)<br>
      I know the Euro is supposed to have sheared crossbars but to me I think in this font they need blunter ends.<br>
      ÷ fell down a bit somehow. </p>
      <p>I'm really liking this. I'm really pleased how well it stands up next to Myriad, as I think I mentioned before :)</p>
