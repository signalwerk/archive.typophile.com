    html: |-
      <p>I think this works a lot better than before, Craig. It's still quite soft-feeling and the difference in width between the two bowls is characteristic, but I think it works.</p>
      <p>FWIW (from <a href="http://de.wikipedia.org/w/index.php?title=Datei:%C3%9F_in_various_fonts.svg" rel="nofollow">Wikipedia</a>):<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/eszetts_5436.gif"></div><br>
      Since you draw a lot of your inspiration from handwriting here: Most people I know write the "ß" a bit like a beta, with a sharp connection between two round bowls – most similar, in this picture, to #2 in the second row, or the rightmost one in the second row from the bottom. There may or may not be a descender. (Note that those ones that don't do the sharp join in the middle still have two approximately almost equally wide "bowls". Also note how the stroke starts at the top-left for the handwritten variants, comparable to how one would write a "p". Do not look at the center one in the bottom row – that just looks stupid. :-&gt; )<p></p>
      <p>I don't know how deep you want/need to go into this; it may just take too much time and effort to do a super brilliant unbeatable eszett, as it's not a letter you are usually confronted with – and then it's kind of a "minority glyph" ;-). I think yours is definitely readable and even rather charming, so you might just leave it as is.<br>
      But do make sure the bottom doesn't close up / clog at smaller sizes.</p>
    html_clean: |-
