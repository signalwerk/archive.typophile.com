    html: |-
      <p>&gt;How do I code these into FontLab? I have added glyphs and named them “a.alt” etc., but how do I set it up with OpenType to give applications access to them?</p>
      <p>You'll need to use a Stylistic Set.<br>
      Open the Opentype panel and click on the + at the bottom.<br>
      You'll get a box with the words 'feature xxxx {'</p>
      <p>The next line says 'sub by ;'<br>
      You need to put in the substitutions you want in there. For example to substitute a with a.alt it should read 'sub a by a.alt;'<br>
      If you want to add more substitutions, simply repeat the line below with the next letter you want substituted.</p>
      <p>The last line needs to close the ss01 tag so again replace the xxxx with ss01.</p>
      <p>Then click on the compile button. (looks like pages)</p>
      <p>On the preview panel, you can now try your Opentype out by going to the Opentype features tab and selecting ss01.</p>
      <p>Well, that's the way I've done it and it seems to work. Check the FL manual though, as I'm a beginner too :)</p>
    html_clean: |-
