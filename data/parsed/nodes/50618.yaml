    date_raw: 1 May 2010 — 9:15am
    votes: null
    html: |-
      <p>Well I wasn't doing it with MMs. I started with the medium, thin and the bold in separate .vfbs and then realised that switching between them didn't really allow me to compare them simultaneously. I realised I'd added/taken away the weight to the interior of the forms, and therefore the thin needed condensing and the bold needed expanding to get the counters back to where they should be. Also the relative heights needed compensating (smaller for the thin and larger for the bold).</p>
      <p>What I'm doing now is pasting glyphs from the thin/bold into the medium so I can have /n.thin/n.medium/n.bold in the preview window together. Once I'm happy with the proportions I'm then pasting them back into the right .vfbs for final tweaking. I'm sure there must be a better way.</p>
