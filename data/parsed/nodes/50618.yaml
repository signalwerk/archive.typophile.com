    html: <p>I agree the spurless G is too precise for this font. The new S is really attractive. But I think some of these adjustments are starting to move away from the handwriting premise and making the script more formal and refined, more careful and slower writing rather than quick style which gave rise to the overlapping loops. I think you may need to make a choice. You have to trade off individual letters looking super with the whole harmony between the characters looking super. Hope I'm being helpful and not annoying :)</p>
