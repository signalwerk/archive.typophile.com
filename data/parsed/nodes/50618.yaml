    html: |-
      <p><em> what’s your intended use?</em></p>
      <p>I'm looking for something that will work in smallish sizes (say, 10pt up to subtitle size), and is comfortable enough for middling-length texts, such as sidebars or captions. Maybe places where one might otherwise use running italics? I think the "handwritten" voice of this might work well for pull-quotes. It looks to me like it also might work as an alternative to "architect" fonts (or Comic Sans!), where a somewhat casual, but not condescending, style is desired.</p>
      <p>This started as formal experimentation so the potential uses are more "emergent" than intended from the get-go. If it would be beneficial for the design to define its uses more precisely and if there are good practices for doing that, I'd welcome that feedback too.</p>
    html_clean: |-
