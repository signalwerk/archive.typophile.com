      <p>Craig,</p>
      <p>Just butting in – you know to take my comments with a <em>rock</em> of salt!</p>
      <p>This is much fun to look at, and quite likable (and interesting to see<br>
      how the "handwritten" flavor is oozing into lots of tiny details).</p>
      <p>A few semi-random impressions:</p>
      <p>In the caps, the "T" feels a bit wide.</p>
      <p>Have you tried a "W" with no crossing strokes and a lowered apex?</p>
      <p>I'd consider softening / taking back the—quite acute—angle in the join of the alternate "g". I like the idea; but it may be trying too hard to make a point. </p>
      <p>I know it's intentional (and probably also hard to do otherwise), but I'm somewhat put off by the contrast between the caps and the minuscules. The caps feel classical, almost "stately" in their proportions, whereas the lowercase is a lot more playful.</p>
      <p>On a detail level, how about playing with the tail of the "Q" a bit?<br>
      (And possibly, the leg of the "R"?)<br>
      Also, the bottom-right of the "G" feels stiff in context of the whole alphabet.</p>
      <p>Or it may help to think not from the stroke, but the overall proportion, to make the caps a tad less "classical" and more "casual". (While your minuscules have a strong hand-written feel, I don't know anyone who writes their caps with classical Roman proportions.)</p>
      <p>I'll be curious to see how this goes on.&nbsp;&nbsp;:-)</p>
