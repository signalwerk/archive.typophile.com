      <p>This is really helpful criticism James. </p>
      <p>On nailing down a pen theory: I have developed these letters as a monoline (which I guess corresponds to a felt-tip), and then I began thinning strokes where they merged to reduce black spots. I wasn't thinking of a pen-front, but rather of the kinds of adjustments you see in Futura for example. But now that you point it out, the "cursivity" of this letter construction is probably going to make a "pen theory" unavoidable. Maybe it's just a matter of starting the thinning closer in - perhaps I made what should be an "invisible" optical adjustment at too large a scale.</p>
      <p>Connecting with your previous comment, would a pen theory dictate the terminals? (Which I'd suppose would mean felt-tip = round?)</p>
      <p>From the start I've wanted this font to have a crispness - to read as something more sturdy than a scanned handwriting font.</p>
      <p>Re: caps, would you suggest I'd have to add the cursive bumps and loops to the majuscules if they are to fit in with the minuscules? I didn't find that very satisfactory in my sketching. (In fact, that exercise was a real lesson for me in just how different in character the Roman caps and Roman lowercase are.)</p>
      <p>Here's my newer, restructured 'a' (in "aardvarks"):</p>
