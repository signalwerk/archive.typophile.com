      <p><cite>…’m trying to pull off something like this…</cite></p>
      <p>It could work, but doing so could limit the use of the font to special projects by ballsy designers. Which allows me to segue to my next point. I think that you would be well-served to really nail down a pen theory behind this design. The majuscules have a the mechanical feel of letters constructed mechanically to idealized humanist proportions. Most of the minuscules have the feeling of the same proportions realized with modern felt-tip or ball-point pens. But then there are the occasions where a flexible nib pops out—y, h, and u. I’m not sure that all of these can be reconciled into a single design that doesn’t have the cacophonous feel of Makela’s Dead History. Of course, there’s a place for that kind of feel, but I don’t think that’s where you’re going. </p>
      <p>What you could do here is create the basis for a larger typographic system similar to ITC Stone. Looking at your second specimen I see how this could turn into a fabulous informal text face with a companion sans to use for titling.</p>
      <p><cite>knock is closest to working, no?</cite></p>
      <p>Definitely. </p>
      <p><cite>I’ve added fl, fi, and ti.</cite></p>
      <p>They’re fun and they add a nice touch of class.</p>
      <p>I do prefer your single-story g. I don’t know if a two-story g could fit into these proportions, but it’s still worth exploring.</p>
