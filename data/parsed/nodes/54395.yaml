    html: <p>Please look at fonts from Adobe and Linotype, containing Latin 2, Turkish and Baltic, but not Greek and/or Cyrillic. These fonts all have Greek flagged. As far as I can remember this had something to do with Word not recognizing the extra Latin characters. Couldn't find were the info is, so it might also have to do with another program.</p>
