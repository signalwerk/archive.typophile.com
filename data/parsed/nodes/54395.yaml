    html: |-
      <p>When you have a fonts that contain Latin 2, Turkish and/or Baltic, it is recommended that you set the Greek codepage for MS Word.<br>
      I think it has to do with the PFM default character.<br>
      In Adobe Caslon Pro and Garamond Pro the Greek codepage is set, and the PFM default character is "space". Font names look good in Word. In Tekton Pro the PFM Default character is "bullet",and not "space", and this is what you get<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/tektonWord_5074.jpg"></div><p></p>
    html_clean: |-
