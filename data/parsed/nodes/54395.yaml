  html: |-
    <p>Hello all,</p>
    <p>When I install one of my OpenType typefaces on Windows XP, strange things happen in the Word2007 fontmenu. The .notdef glyph appears a couple of times after the fontname. Why is this? Do I have to change a setting? The fonts are generated using FontLab on a Macintosh computer.<br>
    Thanks in advance!</p>
    <p>Pieter</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/fontmenu_word2007_6188.jpg"></div><p></p>
