    <p>Hey people,</p>
    <p>I'm looking for the typeface, or a similar one, that is used on navy ships. I think most countries use a similar typeface on their vessels. They usually are angular letters (like Gridnik for example). If anyone has any tips, let me know! :)</p>
    <p>Thanks.</p>
