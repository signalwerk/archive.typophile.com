    <p>In the <a class="freelinking external" href="http://typophile.com/node/30047" rel="nofollow">Font Starter Packs</a> thread I read that Corel Draw comes bundled with a collection of quality fonts. It is written as well that "Newer versions are in Open Type TTF", but I could not find any information neither on the net nor in this forum which version this starts with. </p>
    <p>So my question would simply be: Which is the oldest version of Corel Draw that I could buy for the good fonts alone? And just for clarification: How big is the quality difference between the older TTFs and the newer OpenType TTFs? And when and how would I notice it?</p>
