      <p>In Corel Draw 12, it still includes only "1,000 TrueType and Type 1 fonts" (<a href="http://web.archive.org/web/20050502104839/http://www.corel.com/content/pdf/cdgs12/CDGS12_vs_Adobe_Illustrator_matrix.pdf" title="http://web.archive.org/web/20050502104839/http://www.corel.com/content/pdf/cdgs12/CDGS12_vs_Adobe_Illustrator_matrix.pdf">http://web.archive.org/web/20050502104839/http://www.corel.com/content/p...</a>), whereas in X3 it says "1,000 OpenType fonts" (<a href="http://hexus.net/tech/items/software/4423-corel-introduces-coreldraw-graphics-suite-x3/" title="http://hexus.net/tech/items/software/4423-corel-introduces-coreldraw-graphics-suite-x3/">http://hexus.net/tech/items/software/4423-corel-introduces-coreldraw-gra...</a>).</p>
      <p>It's still possible that 12 already comes with OpenType fonts, but it's unlikely that Corel would not have included that in their marketing material.</p>
