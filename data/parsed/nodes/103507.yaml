      <p><a href="http://babelstone.blogspot.ca/2006/06/rules-for-long-s.html" title="http://babelstone.blogspot.ca/2006/06/rules-for-long-s.html">http://babelstone.blogspot.ca/2006/06/rules-for-long-s.html</a></p>
      <p>Accordingly, there may be some italic fonts from the late 18th century that follow the contemporary writing practice of /ß for double-s.</p>
      <p>I’ve put a long-s feature in several typefaces, but in the “hist” feature (for when and if that gets supported by layout apps) and as a Stylistic Set.</p>
      <p>My present thinking is to employ a double long s (with appropriate ligature in the ligature feature) in the code, rather than long s followed by short s (except at the end of words, of course), as I think if people are going to use this feature, they would like to see as many long-s’s as possible!</p>
