      <p>I just recently saw an eszet in an English text. It was written by Sir Isaac Newton, so that narrows down the date range somewhat. I'll see if I can track down the example.</p>
      <p>Ah, here we are. Page 265, starting from here:</p>
      <p><a href="http://rstl.royalsocietypublishing.org/content/1/1-22/263.full.pdf" title="http://rstl.royalsocietypublishing.org/content/1/1-22/263.full.pdf">http://rstl.royalsocietypublishing.org/content/1/1-22/263.full.pdf</a></p>
      <p>Dr. John Wallis is actually the author of the passage.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/eng_eszet_5731.jpg"></div><p></p>
      <p>For that Diſcourſe is to be looked upon onely as an <em>Eßay</em> of the <em>general Hypotheſis</em> ; which as to <em>particulars</em> was to be afterwards adjuſted , from a good <em>General Hiſtery of Tides</em> ; which it's manifeſt enough that he had not ; and which is in a great meaſure yet wanting.</p>
