      <p>True, but there’s nothing wrong with implementing an /ſ feature for a particular language (English) at a particular time (17th and 18th century), which is what I’ve done.</p>
      <p>Ideally, it would be most appropriate for Caslon or Baskerville typefaces, but that kind of precise historical allusion is rare—most typographers prefer to use old style types for 19th century subject matter for instance, rather than didones.</p>
      <p>I’ve made other discretionary language-speciﬁc features, such as ordinals (English), lowered umlauts (German), and Turkish non-ligatures, so why not an /ſ Stylistic Set?</p>
      <p>**</p>
      <p>Further to Kevin’s insight on typographic licence, I recently posted this image in another thread, and noticed that /ſ is not employed where an /s ligature is available (<em>C’est, cascatelle</em>), or to start a word (<em>sa</em>)—presumably because by the time the reader gets to the second syllable of <em>baiſée</em> or the third syllable of <em>embraſée</em> it’s quite clear what the word will be, and there is no likelihood of mistaking ſ for f, which might occur with <em>ſa</em>. Light seasoning, as it were.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Poem4_4132.png"></div><br>
      Verlaine: <em>«À la Princesse Roukine», Parallèlement.</em> Paris, Ambroise Vollard, 1900<p></p>
