    html: <p>On "Munday, Auguſt 6, 1666," English spelling was not particularly standardized, and it would not be until Samuel Johnson and Noah Webster did their thing. Variations on the part of the compositor were not so much error as license, especially subject to how many ligatures they had in the case.</p>
