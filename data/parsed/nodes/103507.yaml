    <p>Hi everyone,</p>
    <p>I'm currently trying to talk somebody (trying to reproduce late 1700s style in an English text) out of using the OpenType ›Contextuals‹ feature as a tool to substitute every (!) non-final <code>s</code> by an <code>ſ</code> -- as ſ usage is a lot more complex than that.</p>
    <p>Now what this issue reminded me of was having seen a <code>longs_s</code> ligature in an English text once -- an <code>ß</code>, effectively. 17th or 18th century, I guess. I just can't find it. Un-ligated <code>longs_s</code> + <code>s</code> <a href="http://i.stack.imgur.com/uSixM.png" rel="nofollow">are</a> <a href="http://upload.wikimedia.org/wikipedia/commons/3/3d/Long-s-US-Bill-of-Rights.jpg" rel="nofollow">everywhere,</a> but that's not what I'm looking for.</p>
    <p>But maybe I'm on the wrong track... has anyone else seen something like this and would be willing to post a specimen?<br>
    thanks in advance!</p>
