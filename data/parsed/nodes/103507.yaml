      <p>Here’s my code:</p>
      <p><code>feature ss01 {<br>
      sub s by longs;<br>
      sub longs' [f fi] by s;<br>
      sub [f f_f] longs' by s;<br>
      sub longs' [hyphen quoteright] by s;<br>
      ignore sub longs' @smcp_source;<br>
      sub longs' by s;<br>
      lookup one {<br>
      sub s' s by longs;<br>
      } one;<br>
      }ss01;</code></p>
      <p></p>
      <p>And (showing only longs ligatures):</p>
      <p><code>feature liga {<br>
      sub longs i by longs_i;<br>
       sub s longs i by longs_longs_i;<br>
       sub s longs l by longs_longs_l;<br>
       sub s longs by longs_longs;<br>
       sub longs b by longs_b;<br>
       sub longs h by longs_h;<br>
       sub longs k by longs_k;<br>
       sub longs l by longs_l;<br>
      } liga;</code></p>
      <p></p>
