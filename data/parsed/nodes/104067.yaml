    <p>Do typographers and type designers have an unfair advantage when reading eye charts? While sitting at my optometrist’s office last week, I wondered if my years spent researching and using letterforms gave me some sort of visual acuity performance edge.</p>
    <p>Optometrist: Can you read Line Three, please?</p>
    <p><em>Long pause. </em></p>
    <p>Me: (Sigh) Well, I know the second letter is a P. But I’m not sure if I’m actually <em>reading</em> the P or if it’s just because I know it’s a P by the heavier typographic color of the bowl in the top right area of the letter.</p>
    <p>Optometrist: Would you say the line is clearer in view 1 or view 2?</p>
    <p>Me: I mean...  I can’t say that the line is actually <em>clearer</em> but I guess the letterforms in #2 are slightly less sparkly than in #1.</p>
    <p><em>Long pause.</em></p>
    <p>Optometrist: You know, it’s very difficult to get an accurate eye reading on you.</p>
    <p>Maybe I'm just more annoying.</p>
    <p>Modern visual acuity tests are based on the <a class="freelinking external" href="http://www.nytimes.com/2013/05/26/magazine/who-made-that-eye-chart.html" rel="nofollow">1862 Snellen Chart</a> by Dutch ophthamologist Herman Snellen. Instead of using existing typefaces, Snellen created optotypes, standard symbols which include letterforms, numbers and symbols designed on a 5x5 grid specifically for measuring vision clarity.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Snellen_chart_6170.svg.png"></div> <cite>By Jeff Dahl [<a href="http://creativecommons.org/licenses/by-sa/3.0" rel="nofollow">CC-BY-SA-3.0</a> or <a href="http://www.gnu.org/copyleft/fdl.html" rel="nofollow">GFDL</a>], <a href="http://commons.wikimedia.org/wiki/File%3ASnellen_chart.svg" rel="nofollow">via Wikimedia Commons</a></cite><p></p>
    <p>Back at my optometrist’s office, I was laboring over the LogMAR chart (Logarithm of the Minimum Angle of Resolution), which, unlike the Snellen model, consists of five characters per line and standardizes the size progression and spacing of each optotype from one line to the next. </p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/LogMAR_chart_3953.jpg"></div> <cite>By Crosstemplejay (Own work) [<a href="http://creativecommons.org/licenses/by-sa/3.0" rel="nofollow">CC-BY-SA-3.0</a>], <a href="http://commons.wikimedia.org/wiki/File%3ALogMAR_chart.jpg" rel="nofollow">via Wikimedia Commons</a></cite><p></p>
    <p>LogMAR charts use Sloan optotypes, designed in 1959 by Louise Sloan, now the standard for vision acuity tests in the United States. In contrast to the drastic slabs in the Snellen chart, Sloan optotypes are blocky but endearing sans with awkward terminals, designed, I’m presuming, to stump you on those pesky lower lines. And in case you possess a burning desire to acquire the Sloan font for your own non-commercial use, fear not: Dr. Denis Pelli of NYU has created <a class="freelinking external" href="http://psych.nyu.edu/pelli/software.html" rel="nofollow">a digital version of the Sloan typeface</a>, adding many characters not previously included in the original drawings. </p>
    <p>Any other type-folk have a similar experience at the eye doctor? Can you remove your “typographic lenses” (pun intended!) while reading an eye chart? Does your eye doctor find you as irritating as mine? </p>
    <p>-------------------------------------------------------<br>
    <em>Hi, I’m <a class="freelinking external" href="http://www.amypapaelias.com" rel="nofollow">Amy</a>. I will be sharing moments of type nerdery in daily life and healthy doses of typo-procrastination. Vive Typophile!</em></p>
