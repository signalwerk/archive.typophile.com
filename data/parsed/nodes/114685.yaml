    <p>Hello,</p>
    <p>Here is a link to Mr. Moustache: <a href="http://www.myfonts.com/fonts/facetype/mr-moustache/" title="http://www.myfonts.com/fonts/facetype/mr-moustache/">http://www.myfonts.com/fonts/facetype/mr-moustache/</a></p>
    <p>I have a logo using this font and am looking for some ideas for combinations that can offset the playfulness without going too far in the other direction that it looks out of place. It's for their website and printed materials. It's a creative company and they are looking for playful but modern.</p>
    <p>I appreciate any fresh ideas!<br>
    Lori</p>
