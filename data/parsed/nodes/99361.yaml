      <p>Definitely. In fact enough purpose to hire a trained/experienced person to help you.</p>
      <p>I'm sure you'll get IDs on those fonts, but -especially since they're so different- it's important to focus on what message the typography (which BTW is only part of the puzzle) should convey (as opposed to simply choosing a font you personally like).</p>
