    <p>Hello, </p>
    <p>I've just begun to work on a music project and some other artistic endeavors. Nothing I expect to make a billion dollars off  of, but, I think it's going well. Some people probe me to consider fonts, colors, visuals, etc. Im not sold on the idea, but it has its purpose I suppose. I started looking into this and came across a few that I like.</p>
    <p>Does anyone have any insight as to what the attached fonts may be?</p>
