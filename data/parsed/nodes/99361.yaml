      <p>Font IDs are not nearly as interesting as font <em>problems</em>, so please do be thorough! And most of all please don't resort to teenspeak.  :-)</p>
      <p>Your first example is just handwriting; there's at least 3 billion fonts like that. The second one I'm not sure how to categorize, but I can tell you that House Industries is crawling with stuff like that. As for your third one, you might try "Art Deco" as a search term on MyFonts.</p>
      <p>hhp</p>
