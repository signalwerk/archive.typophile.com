    <p>Song, H. and Schwarz, N. (2010). <a href="http://www.thepsychologist.org.uk/archive/archive_home.cfm?volumeID=23&amp;editionID=185&amp;ArticleID=1629" rel="nofollow">If it’s easy to read, it’s easy to do, pretty, good, and true</a>. <em>The Psychologist, 23(2).</em> 108–111.</p>
    <p>Hot off the press. A great review article discussing the effects of ease of reading on people's decision making. Very well written, plain language and free. One of the better pieces I have come across lately.</p>
