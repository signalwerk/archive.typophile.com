    <p>hello typophiles</p>
    <p>in a layout im working on, i tried souvenir for the headlines and it works well with the rest - but i'd like to see some similar fonts. it needs round edges/serifs and a bold weight. the art deco look is not essential to the design.</p>
    <p>thank you!</p>
