  - id: 323401
    user: 18888
    date: 2009-01-18T12:37:00
    date_raw: 18 Jan 2009 — 12:37pm
    votes: null
    html: |-
      <p>Did you also condense the "u", just like you did with "n"?<br>
      Otherwise UC looks nice. But to my eye F, Z and M look a bit too narrow compared to others, K looks a bit top heavy, try matching Q's tail with "g"'s, match "S"'s shape with "s", V, X and Y are almost certainly too wide...</p>
      <p>But the font itself looks really nice and it is quite original in shape. I like it a lot. Also its light weight looks very nice so combining it with nice small details makes it more appropriate for display. I like it a lot. Very calming, warm and inviting.<br>
      ___________<br>
      <em>Robert Koritnik</em></p>
