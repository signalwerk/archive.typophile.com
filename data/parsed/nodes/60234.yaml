  html: |-
    <p>I am very fresh new user of FontLab, but have jumped in at the deep end by designing a display font from scratch.</p>
    <p>I am using FontLab 5.0.2 on a Mac running OS X 10.5.7 and I have designed my font in illustrator and have been copy and pasting each Glyph into FontLab individually.</p>
    <p>I have figured out my kerning classes and I am happy with the results in apps. such as Indesign and Illustrator, at the moment i am just using FontLabs auto generated hinting.</p>
    <p>However, my new font displays in my version of the Mac app FontBook with seemingly none of my kerning classes recognised, it seems to recognize some from different classes but leaving most of the typeface looking really unprofessional and unkerned, why could this be?</p>
