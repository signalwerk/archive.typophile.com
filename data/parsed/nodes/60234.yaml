    html: <p>I think a lot of applications do not pull in kerning data. Even font managers often give preview without showing the kerning. In Font Reserve's preview you can use the pull down menu and get font info which will list some kerning general kerning info. I'm surprised that text edit didn't. Were you in rich text format as opposed to plain text?</p>
