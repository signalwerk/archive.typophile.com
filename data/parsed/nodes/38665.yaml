    <p><a href="https://web.archive.org/web/20080906235011/http://www.myfonts.com/browse/person/w/iza/">Iza W</a> &amp; Paulo W have made some of the more interesting art fonts around. Posing as <a href="https://web.archive.org/web/20080906235011/http://www.intellectadesign.com/">Intellecta Design</a>, the Brazillian pair claim to be the <a href="https://web.archive.org/web/20080906235011/http://www.myfonts.com/foundry/intellecta/">creators and owners of the largest typeface library in Latin America.</a></p>
    <p><a href="https://web.archive.org/web/20080906235011/http://www.intellectadesign.com/topten.html">Check out their Top 17</a>, or <a href="https://web.archive.org/web/20080906235011/http://www.myfonts.com/browse/foundry/intellecta/">browse the collection of 117</a>. Gorgeous, amazing stuff. Everything is very reasonably priced. <a href="https://web.archive.org/web/20080906235011/http://www.myfonts.com/specials/2785/">T<!--
