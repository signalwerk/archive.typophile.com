    <div class="info">Submitted by <a href="/user/1085" title="View user profile.">dan_reynolds</a> : 13.Apr.2007 12.37am </div>
      <p><strong>Linotype’s LinoLetter for April 2007 – New Catalogs and Hermann Zapf’s Alphabet Stories</strong></p>
    <p>Check out the full version of this month’s newsletter at the Linotype website: <a href="http://www.linotype.com/38-21664/issue200704.html" title="http://www.linotype.com/38-21664/issue200704.html">http://www.linotype.com/38-21664/issue200704.html</a></p>
    <p><em>Content Preview:</em> Typefaces look best in print, and this month we have four beautiful books to present to LinoLetter readers: three catalogs from Monotype Imaging and a new monograph by Prof. Hermann Zapf about his life and work so far. But what would our monthly newsletter be without the fonts themselves? This April, we are proud to announce the release of a small sans serif family from Adrian Frutiger and Akira Kobayashi that has long been in the works: Nami. Also, we shine a spotlight on a little-known gem from the 1950s, Aldo Novarese’s Fluidum.</p>
    <p><a href="http://www.linotype.com/38-21664/issue200704.html">Read the rest of the Linoletter at Linotype.com!</a> </p>
    <p>Or, <a href="https://www.linotype.com/newsletter.html">subscribe to the Linoletter</a>, and get the information delivered every month directly to your mailbox.</p>
