    <p></p><div class="imageWrap"><img src="http://typophile.com/files/skolar-cyrillic_5_3729.jpg"></div><p></p>
    <p>Skolar Cyrillic</p>
    <p>David Brezina's successful type family Skolar has been expanded with a full Cyrillic character set. It supports 32 languages using Cyrillic script, besides most of the Slavic languages, many Asian and non-Slavic languages are covered too. It also supports Serbian italic alternates and “new” Bulgarian stylistics. Skolar Cyrillic has been designed as a close complement to Latin with the help of the experienced designer and consultant Alexandra Korolkova, and it has already earned its first awards at Modern Cyrillic 2009 and Granshan 2009.</p>
    <p>read more: <a href="http://www.type-together.com/Skolar" title="http://www.type-together.com/Skolar">http://www.type-together.com/Skolar</a></p>
