  html: |-
    <p>Michael Doret and <a class="freelinking external" href="http://www.michaeldoret.com/AlphabetSoup/soup.html" rel="nofollow">Alphabet Soup</a> would like to call your attention to the release of Deliscript Upright and Deliscript Slant.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/Deli_Website_Splash_5605.jpg"></div><br>
    Although Deliscript was initially inspired by the neon sign in front of Canter’s Delicatessen in Los Angeles, the design of these fonts soon took on a life of its own–and its own distinctive look. Like its sibling <a class="freelinking external" href="http://www.michaeldoret.com/AlphabetSoup/metroscript.html" rel="nofollow">Metroscript</a>, Deliscript has many features that expand its usability such as the the variable length tails which can be accessed in 6 different styles, and the unique crossbars which can be extended outward in either direction from the "t" character. Throw in the special "WordLogos", tons of ligatures and foreign accented characters, and you have a recipe for typesetting that approaches the look of hand-lettering. This was only achieved with the very savvy technical assistance of Patrick Griffin of <a class="freelinking external" href="http://www.canadatype.com/" rel="nofollow">Canada Type</a> who did all the OpenType encoding.<p></p>
    <p>Deliscript has just been released at <a class="freelinking external" href="http://www.fontbros.com/cgi-bin/commerce.cgi?preadd=action&amp;key=ALSO-DESC" rel="nofollow">FontBros</a>. The 6 Page (1.7 MB) <a class="freelinking external" href="http://www.michaeldoret.com/AlphabetSoup/Deli_OT_Manual.pdf" rel="nofollow">Deliscript User Manual</a> may also be downloaded.</p>
