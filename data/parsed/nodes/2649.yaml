  html: <p>Here's a site belonging to Bruce Willen, a recent grad of the Maryland Institute College of Art. <br> <br>here's the front door <br> <br><a href="http://www.posttypography.com/" target="_top">http://www.posttypography.com/</a> <br> <br>you have to click on the 'N' to get in. <br> <br>if you are unable to navigate past the typography 'essay' and the dingbats (D.Carson), here's a side entrance. <br> <br><a href="http://www.posttypography.com/bruce/" target="_top">http://www.posttypography.com/bruce/</a> <br> <br>if you click on résumé you will be annoyed by pop-ups, but you will see a House Industries typographer as a reference. <br> <br>There's a typeface in development called Composite. <br> <br>The site is different. And a place to learn that Pink is the new Orange. <br> <br>bj</p>
