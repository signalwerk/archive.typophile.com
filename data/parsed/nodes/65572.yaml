  html: |-
    <p>Hello,</p>
    <p>I am looking for options for binding systems for short printed documents. Ten to 60 page count, and copy and card stock paper will be used with the possibility of screen-printed covers.</p>
    <p>No hard covers and preferably lay flat (I am open to other options). Coil and ring binding are too <em>assembly line</em>; I am looking for something a little more classy.</p>
    <p>I would love to hear your ideas.</p>
    <p>- corey</p>
