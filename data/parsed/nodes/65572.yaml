      <p>It's hard to find a cheap binding method for small quantities that beats the comb, velo, or thermal binding. There are somewhat expensive ($5K+) desktop perfect binding machines that will do a fine job, but the upfront cost may be prohibitive. </p>
      <p>I have a friend that loves these <a href="http://www.levenger.com/PAGETEMPLATES/NAVIGATION/Products.asp?Params=category=326|level=2|pageid=1749" rel="nofollow">Circa</a> things for binding things around his office. </p>
      <p>I've seen <a>Treasury tags</a> used for documents like you describe, but it may or may not be the look you're after.</p>
