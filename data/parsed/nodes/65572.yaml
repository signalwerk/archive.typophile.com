    html: <p>Ah, coptic and pamphlet bindings are probably too involved for something like that. I have seen small desktop systems for poor man's perfect binding. You have to use specific covers that have a channel of glue pre-applied to the spine. Arguably slicker than comb and coil, and probably adequate for small corporate jobs.</p>
