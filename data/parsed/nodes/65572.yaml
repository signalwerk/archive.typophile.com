      <p>Never done this with with cardstock covers (only board and wood). And never with a single signature. But coptic binding might be worth a shot. It'll lay totally flat, and it looks pretty classy.</p>
      <p><a href="http://en.wikipedia.org/wiki/Coptic_binding" title="http://en.wikipedia.org/wiki/Coptic_binding">http://en.wikipedia.org/wiki/Coptic_binding</a></p>
