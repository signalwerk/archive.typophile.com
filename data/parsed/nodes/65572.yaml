      <p>Like matteson says, a cahier/pamphlet stitch would not suit your needs.<br>
      My experiences with termal binding is that it's not very durable, especially if you open it flat.<br>
      Have you thought about staples?<br>
      Also it's possible to have your cover go over your comb/sprial spine, to make it visually more attractive.</p>
