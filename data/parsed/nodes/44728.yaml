      <p>It's very interesting. It looks like it is influenced by old Gaelic / Irish letterforms (forgive me for not knowing if there is a more proper name for that style). How "out there" some of the letterforms are from the rest kind of reminds me of Democratica or Jonathan Barnbrook's work. I could see this on Emigre or something. This looks like a typeface that was just made for ligatures. The ß is beautiful. I've not sure if I've seen one with the left side of the crossbar still on it.</p>
      <p>I do agree about the 2, it looks too much like an inverted 5 for me. Good work though!</p>
