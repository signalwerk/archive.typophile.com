    html: <p>I love it! It's fantastic and unique! It feels very antique but also very contemporary. At first the lower case <em>a</em> bothered me as the odd one out, but it works very well in context with all the other characters. I love the <em>s, g,</em> and <em>y</em>. A couple of concerns, the capital <em>B</em> is very similar to the eszett, and the lc <em>d</em> is very close to the partial difference symbol. I noticed that you tried to distinguish both, but I'm not sure how others feel about the close similarities. Otherwise, excellent work!</p>
