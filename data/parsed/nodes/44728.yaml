    html: |-
      <p>The <strong>2</strong> is strange, but somehow acceptable for me. Still would be better if you remove the lower part of its serif, or at least add a curve at front. The mirrored <strong>6/9</strong> is nice, but this is because it has no serifs to drop under the baseline... If the serif of <strong>5</strong> was not that distinctive, <strong>2</strong> could remain a mirrored design with not that much distraction. </p>
      <p>But the lowercase <strong>b</strong> is really too distracting - too close to cyrillic <strong>б</strong>; and for anyone using cyrillic it would be too misleading. Maybe add a ball terminal?</p>
      <p><strong>Question</strong> and <strong>questiondown</strong> are unfinished - and it is obvious that they derive from lowercase s, some corrections should be done though.</p>
      <p>Lowercase <strong>w</strong> is impressive, but too wide IMHO. </p>
      <p>Uppercase <strong>S</strong> looks upside down, maybe this is deliberate decision. Acceptable for uncial, I suppose.</p>
      <p>The lowercase <strong>j</strong> design catches the eye, but will lead to problems if you are considering designing <strong>iogonek</strong>, for example.</p>
      <p>And the <strong>numbersign</strong> is too tall (add it in front of some figures to check out, maybe it is just my impression).</p>
      <p>It would be curious to see also some accented lowercases, especially <strong>C/ccedilla</strong>, <strong>S/scaron</strong> and <strong>Z/zcaron</strong>. How do you plan to make the accents equally distinctive?</p>
      <p>I love the <strong>fi</strong> and <strong>fl</strong>, designed this way. Brilliant idea!</p>
      <p>Otherwise keep the work in the same direction, the design is really distinctive. Maybe there will be other minor flaws, but you have real jewel, just it needs some polishing.</p>
