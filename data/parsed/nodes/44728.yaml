      <p>It's great!   The 2 bothers me - I like the direction, but I right now I'm just reading it as an upside down 5, which is thoroughly distracting.   Other glyphs that distract from readibility for me (at text sizes): </p>
      <p>g - just doesn't quite flow for me<br>
      D - reads as an o at small sizes<br>
      T - reads as a c at small sizes ("cake heed")<br>
      B - reads as an R at small sizes<br>
      s - I like it, but "ravens" did read as "revenge" for me at a glance.  That might just be indicative of a psychosis on my part.</p>
      <p>As is, I love it for display, and I think with some minor changes it will be impressively legible for text.</p>
      <p>---<br>
      eeblet.com</p>
