      <p>I agree with the others, the 2 is the most distracting character. It's unbalanced, the angularity on the bottom is very un-two in feel. I think you could take the curves of the 5 and use them on the two successfully by being less literal.</p>
      <p>I'm not crazy about the length of the lowercase s. Partly because it looks too much like the section symbol, but also because it seems like it was only made so long because you felt if it went below the baseline that it had to go as low as the other descenders. I think it would be a lot more readable as an s hanging only halfway below the baseline -- as it is, I'm tempted to read it as an oldstyle 5 in the small sizes because the shape gets less defined as it is stretched out.</p>
      <p>The lowercase t feels like it needs more time to develop into something else.</p>
      <p>I really love the lowercase g, j, and z.</p>
      <p>It's always a good sign when you get to the end of a creative project and realize the stuff you did at the beginning that was the seed for the character of the rest needs to be redone because it got so much better as it grew. Deadlines don't always let us actually do that :) I know the feeling of getting to the last page and hating page 1 already, though! One of the best pieces of advice I ever got from a mentor was not to treat my creations as precious -- you can never be afraid to throw something out or you'll stop taking risks.</p>
