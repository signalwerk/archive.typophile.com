      <p>It's not easy to conjure faces with this "collage" logic.<br>
      Many attempted, but few succeeded, it requires a good knowledge of letterforms [or intuition to compensate] in order to succeed.<br>
      Besides Democratica (which is more a collage of "anatomic parts" of traditional typographic forms), I would address you to Angus R. Shamal's Deviata<br>
      <a href="http://www.fontshop.com/fonts/singles/arstype/ars_deviata/" title="http://www.fontshop.com/fonts/singles/arstype/ars_deviata/">http://www.fontshop.com/fonts/singles/arstype/ars_deviata/</a><br>
      or Mortal<br>
