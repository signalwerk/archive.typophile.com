    <p>This is a typeface that I have been working on for the last couple of years. I have been looking at it so long I don't know if I have a very good objective view of it any longer. Please give me some comments, criticism (just don't make me cry), praise and name options.</p>
    <p><a href="http://www.typefetish.com/itw/uncialish.pdf" title="http://www.typefetish.com/itw/uncialish.pdf">http://www.typefetish.com/itw/uncialish.pdf</a></p>
    <p>Thanks<br>
    Michael</p>
