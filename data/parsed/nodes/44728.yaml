      <p>Thanks for posting the PDFs. I have to say, I hate mutant fonts like these. But then some people don't like the splendid Everson Mono lower-case g. ;-)</p>
      <p>I wouldn't venture to classify this typeface as being Roman or Uncial. It's playful and I guess we'll see it on album covers... ;-)</p>
      <p>One thing that really, really makes me nauseous is your capital B. <em>Please</em> don't base on ſ and s like ß is. </p>
      <p>Michael Everson<br>
      evertype.com</p>
