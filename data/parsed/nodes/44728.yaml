      <p>Here is an updated .pdf. I updated some of the letters that seem to be distracting in the typeface. The older version of the letter is set in gray on the top of page 2.<br>
      - s- has been shortened<br>
      - w- is now more narrow<br>
      - T- is an older version of the letter that may work better now.<br>
      - t- is an older version of the letter. I think it may work better, if it was a little wider, as a capital T<br>
      - ?- a version based on s rather than S</p>
      <p>I am still working on the j, I never thought of the iogonek and how that would work with this j. And I don't know how I feel about the b and A, as to them being from foreign alphabets. I am working a new B and D, but I haven't gotten anything I like yet. I will post them as soon as I find a good solution.</p>
