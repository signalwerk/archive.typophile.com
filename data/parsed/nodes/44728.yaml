      <p>I was afraid this is what would be said. The letters that are not working very well are some of the earlier forms I created and really help set the direction of the typeface. I guess I have to start letting go.</p>
      <p>"the capital B is very similar to the eszett"<br>
      I did base the B on the eszett. I really like the influence of foreign alphabets into english, but German does us the same alphabet and I can see this could cause problems if the face was set in German. </p>
      <p>"The uppercase A looks too much like lambda"<br>
      Unlike the B/eszett, this one doesn't bother me, because the lambda is from the Greek alphabet and it wouldn't be confused with the A in English. What does eveyone think about that? Am I wrong?</p>
      <p>I like the 2/5 shape better as a 2 than a 5. I did something like this in another typeface (posted here <a href="http://typophile.com/node/43604" title="http://typophile.com/node/43604">http://typophile.com/node/43604</a>) but the 5 is very different from the 2. Would that help or does the 2 on it's own look too much like a 5?</p>
