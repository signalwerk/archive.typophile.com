      <p>James,</p>
      <p>I can assure you I don't have a "generator" for making my suggestions. They are "hand made" for each post. I just try to keep it short instead of putting loads of "bla bla" about my own typefaces. It's just so much about different taste and t's much quicker and easier for people judging themselves. I agree it's a sort of low budget "guerilla advertising", but as an independent type designer, you to make some noise... I'm just surprised that it haven't been used by many more ;-)</p>
      <p>Gary,</p>
      <p>I wish I could spend more time sharing ideas and input on design topics etc. I've actually been thinking of cloning myself, but my wife tells me one is perfectly enough... and god forbid I might start double-posting!</p>
