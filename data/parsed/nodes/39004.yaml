    <p>Hey all, </p>
    <p>I'm currently in the process of creating a brand and have become quite fond of <a class="freelinking external" href="http://www.identifont.com/show?9XK" rel="nofollow">Sansa</a>. While this takes care of the branding device, I would like to investigate some nice body fonts that can go along with the identity. </p>
    <p>I've been looking at Akkurat, but don't really believe that is available to me at this time, so I would like some recommendations up that same avenue (although I would like to avoid Helvetica/Akzidenz Grotesk as I want to instill a sense of originality - even if I'm the only one who notices it). Any gems out there?</p>
    <p>Thanks in advance,<br>
    Ben</p>
  html_clean: |-
