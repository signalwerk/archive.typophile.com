      <p>Stefan, my objection to your guerilla advertising is two-fold. First, it is embarrassingly desperate. Are your sales so slow that your advertising plan is to reach the few hundred visitors of this website? Second, it is annoying. You are the Jehovah's Witness of the type world, knocking on doors with your sales pitch. (And I like some of your work!)</p>
      <p>It's not just you, either. It has come up that Stephen Coles is employed by FontShop, and they seem to pay him to suggest fonts available from them on this site. If he just posted "I work for FontShop. Here are some fonts we sell which you might be interested in." It would be like the nice shirt and tie which Jehovah's Witnesses wear, which allow you to spot them before you open the door.</p>
