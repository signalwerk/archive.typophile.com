  html: '<p>The Dutch Type Library has released version 1.06 of DTL FontMaster. <br> <br>-DTL BezierMaster and DTL IkarusMaster:  <br>Extensive batch functionality has been added to the Font Administration tool, including metrics editing functions and the option to automatically merge composites for the generation of Central and Eastern European, Turkish, etcetera, character sets based on an editable text file. <br>-DTL DataMaster: <br>Now uses version 1.5 of the Adobe SDK. <br>-DTL TraceMaster:  <br>First version of this auto-tracing program. <br> <br>New demo versions (with exception of DTL TraceMaster) are available at the DTL FontMaster web site (<a href="http://www.fontmaster.nl" target="_blank">http://www.fontmaster.nl</a>) <br> <br> <br></p>'
  html_clean: '<p>The Dutch Type Library has released version 1.06 of DTL FontMaster. <br> <br>-DTL BezierMaster and DTL IkarusMaster:  <br>Extensive batch functionality has been added to the Font Administration tool, including metrics editing functions and the option to automatically merge composites for the generation of Central and Eastern European, Turkish, etcetera, character sets based on an editable text file. <br>-DTL DataMaster: <br>Now uses version 1.5 of the Adobe SDK. <br>-DTL TraceMaster:  <br>First version of this auto-tracing program. <br> <br>New demo versions (with exception of DTL TraceMaster) are available at the DTL FontMaster web site (<a href="http://www.fontmaster.nl" target="_blank" class="link-external">http://www.fontmaster.nl</a>) <br> <br> <br></p>'
