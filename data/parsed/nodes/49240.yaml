      <p>- Flash Player 10 support for quite a few OpenType features. Nothing new in Flash Pro CS4 as far as I know.</p>
      <p>- previewed last year and being shown in depth at MAX next month: a coming ActionScript text library component that supports lots of OpenType and other text goodness in Flash, including major world languages (Arabic, Hebrew, Indic/Dravidian languages, etc.). This builds on the new capabilities of Flash Player 10.</p>
      <p>- Fireworks CS4 ability to paste in Illustrator and Photoshop text with OT features applied and retain them with apporpriate glyphs, as live text.</p>
      <p>I am particularly excited about the Flash stuff, though the Fireworks bit is pretty nice.</p>
      <p>T</p>
