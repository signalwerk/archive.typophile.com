      <p>&gt; <em>Is there any difference in opentype support?</em></p>
      <p>In terms of features and lookuptypes supported there is no difference, AFAIK.</p>
      <p>&gt; <em>Mostly, both one to many and many to one substitution?</em></p>
      <p>Many-to-one (a.k.a GSUB LookupType 4) has been supported since the beginning. That's how you get ligatures, for example.<br>
      One-to-many (a.k.a GSUB LookupType 2) is not yet supported. On the other hand, the upcoming AFDKO will support this looktype for the first time.</p>
