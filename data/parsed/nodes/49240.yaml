      <p>Well I'll be blowed.  If I use Vista's PRC Chinese IME to type Chinese into a new English-language ID5 file, I do not get the Chinese Simplified language attribute.  I assume English ID5 handles typed Chinese Trad., Japanese and Korean similarly.  So where did I get the CJK language attributes I've been putting in character styles for all three languages all these years?  The attributes come in with MS Word files, either via "place" or pasting from the clipboard: so long as I don't have ID strip text attributes, Word's language attributes are among those that survive transfer.  Thus ID5 may not "provide" the Chinese attribute, but I didn't notice.  I can use CJK attributes in English-language ID, and that's what matters to me.</p>
      <p>Come to think of it, perhaps it's just as well Adobe doesn't provide the attributes.  I always warn friends not to install the CJK input methods unless they really want to use them because it is surprisingly easy to think your keyboard has gone into the ozone when all you've done is accidentally hit the key combination turning on Chinese input.</p>
