    html: |-
      <p>Here are some text-related items that are in CS4. I was told this morning that due to the announcement, we are allowed to go public with this kind of information. This list contains some trivial &amp; some larger features. I have definitely forgot some. Also, I will discuss the large feature the Thomas is hinting about in the build forum.</p>
      <p>* Automatically &amp; dynamically format text matching GREP expressions with character styles. (An extension of Nested Styles.)<br>
      * Automatically apply character styles to lines -- like: Apply "smallcap style" to first 2 lines of the paragraph.<br>
      * Text cross-references (cross document &amp; single document)<br>
      * Conditional text<br>
      * Stroke join &amp; miter for outlined text<br>
      * Automatic addition/deletion of pages when frames go overset / empty.</p>
      <p>etc.</p>
