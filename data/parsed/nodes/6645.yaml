    html: <p> First of all thank's to both to made the critics and the appreciation. The Oblique versions I made a skew ( -12º) and I tryed to give the better apperence of the Italic fellings on this oblique version. Like for the exemple the oblique l/c (a), don't have the typical apperence of the oblique normaly used but I desided to use something more expressive to give a new felling for the family and for the visual combination. Thank's for the comments to l/c (g) in real fact the letter must be thinking again. <br>Steve if you don't mind I would like understand better the points that you refered on last message about the plain version that you sayed that are very different of the oblique set. One more time thank's Steve and Stephen. <br>regads for all / Ricardo </p>
