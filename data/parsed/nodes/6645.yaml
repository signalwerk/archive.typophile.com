    html: "<p> Now I understand!! and thank's for the aswer Steve. In fact personaly I didn't wanted to designed the letters with the apperence of the normaly oblique l/c letter (a)=( Plain with skew inclination to simulate italic) fell's me a rigid visual felling. I think that this set is oblique because are not a typical italic (more scrip). I tryed to change the apperence with the other alternative l/c (a) which is more similiar of the italic, like the other letter l/c (e) that I try ed to incorporated a (scrip) apperence in that caracther and the others of course.  <br> <br>But I would like to have more feedbacks about this question to have a clear ideia of the frontier that I'm trying to tread.  <br> <br>PS: Thanks David for your critics-( Venceremos!&gt;;) <br>Regards for all / Ricardo </p>"
