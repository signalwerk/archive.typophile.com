    html: "<p> what i meant by the \"RS &amp; SR\" was that they could be the start of the font names (ie: RS Van Extended &amp;  SR Van Extended) within the family. <br>i really like the symbols. i wasn't refering to them. i was talking about how you plain fonts and italic fonts look different. if you have a plain version of your italic fonts and vise versa, you could have to different fonts in the same family. <br>i like both of them (plain and italic) but think they should have different type style for more versitality. again only my 2¢. keep it up,  its a great face. </p>"
