    html: <p>Nope. There’s <a href="http://www.myfonts.com/fonts/linotype/neue-helvetica/helvetica-53-extended/" target="_blank"> Helvetica Extended</a> or <a href="http://www.philsfonts.com/showing.html?sku=BQ900380X1P1&amp;start=1" target="_blank"> Berthold Akzidenz-</a> <br><a href="http://www.philsfonts.com/showing.html?sku=BQ900380X1P1&amp;start=1" target="_blank"> Grotesk Extended</a>, but no Arial Extended. I once suggested  <br>it to David Saunders way back in 1993 who was then with  <br>the Monotype Drawing Oﬃce (before the merger with Agfa). <br>I literally told him “Why not make an extended version of  <br>Arial? The world can use some more extended faces.” <br>That was shortly after I had found out there were only very  <br>few “wide” faces in the FontBook. <br><br>They didn’t follow the advice of a one-year-in novice at  <br>FontShop Belgium, can you imagine that?! <img src="http://www.typophile.com/forums/clipart/bigsmile.gif" border="0"><br><br>Nonono, I’m not pulling yer leg, this is a true story, I kid you  <br>not. This is <i><span class="caps">SO</span></i> funny you bring this up after all those&nbsp;years.</p>
