  html: |-
    <p>Hi Raph!</p>
    <p>Are you still at typophile?<br>
    How is it going?</p>
    <p>Think I mentioned it elsewhere, yet, this morning my thoughts returned to that subject.<br>
    Lately I met Mardersteig at Leipzig for his exhibtion in the Druckkunst Museum.</p>
    <p>I love the thought that you could get in contact with him or the Museum to offer, for<br>
    a special edition maybe, your beautiful Zeno? I know that you do not recognize it ‘finished’<br>
    Yet I do. I would love to see it just as it is now. Maybe threre are some defects when it comes<br>
    to digitalzing issues (for commercial use) I do not think that there are defects - on the contrary -<br>
    I do think its charme is the thing that counts!</p>
    <p>Have you ever seriously thought about it?<br>
    It is a beautiful version that you made so far as I remember. It struck me.<br>
    Perhaps it may do so with other people, too.</p>
    <p>Salute<br>
    Stefan</p>
