  html: |-
    <p>I'm old enough that when I hear the word "gangster," I immediately think of Al Capone.  However, my young client is thinking in terms of "Hip-Hop Gangsta' Rap." When you all stop lauging, can you recommend an interesting logo font for a small record company specializing in Gangsta' Rap? (Oh yes, I should mention that it's specifically Cholo Gangsta' Rap).... Blackletter fonts that resemble tattoos are the most obvious choice, but is there anything else out there that might be a more interesting alternative? I'm certain this forum is loaded with gang members, so I eagerly await your response!<br>
    Thanks one and all!<br>
    DK~</p>
