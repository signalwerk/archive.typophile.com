    html: "<p>Fun! Here are some suggestions: <br> <br>- Darker drop shadow on the \"Reach...\" headline, so that the white type reads more easily against the lighter colors of the rainbow <br> <br>- Make \"Reach\" and \"Rainbow\" bigger, and tighten the leading of the headline. Consider using a dotless i in \"Rainbow.\" <br> <br>- At the bottom, I'm not crazy about the relationship between the uppercase letters (PRIL, P.M.) and the old-style numbers. <br> <br>- Tie the top and bottom together by putting a yellow background behind the date/time info.</p>"
    html_clean: "<p>Fun! Here are some suggestions: <br> <br>- Darker drop shadow on the \"Reach...\" headline, so that the white type reads more easily against the lighter colors of the rainbow <br> <br>- Make \"Reach\" and \"Rainbow\" bigger, and tighten the leading of the headline. Consider using a dotless i in \"Rainbow.\" <br> <br>- At the bottom, I'm not crazy about the relationship between the uppercase letters (PRIL, P.M.) and the old-style numbers. <br> <br>- Tie the top and bottom together by putting a yellow background behind the date/time info.</p>"
