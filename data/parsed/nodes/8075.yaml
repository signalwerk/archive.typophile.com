  html: <p>Help. <br> <br>Its late, I'm working on an unfamiliar machine, with some software I'm not too experienced with and I'm going round in circles. <br> <br>I need to do a data merge, and Adobe's website tells me I need the PageMaker Plug-In Pack, and that it ships with Adobe CS. I'm sitting here with the CS pack and I must be going blind as well as mad because I can't find the PageMaker Plug-In Pack anywhere. <br> <br>InD is already installed, but there's no Data merge item on the Window menu. <br> <br>Any ideas?</p>
