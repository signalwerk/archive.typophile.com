  - id: 209456
    user: 18017
    date: 2007-06-18T10:00:00
    date_raw: 18 Jun 2007 — 10:00am
    votes: null
    html: <p>John, WPF honors the bit 7 when it calculates line spacing values. Unlike GDI, WPF Text system itself does not clip text, and we discourage our customers from doing this, as it often breaks good typography. Of course, in practice various controls built on top of the WPF text system usually clip all primitives against their own bounds, but in general you should see significantly less, if any, text clipping happening in WPF.</p>
