    html: |-
      <p>By the way, is anyone aware of fonts that have positive sTypoDescender instead of the usual negative value? The dilemma for a font engine or for an application is whether to attempt to "correct" the inverted descent by changing its sign (assuming a font defect), or exposing the positive descent value (assuming intentional font vendor decision) and leaving it up to the application to determine what it means in the context of text layout.</p>
      <p>I was told some time ago that superscript only fonts may decide to do this, but I'm not sure how this plays with usWinAscent accepting only unsigned values.</p>
      <p>Thanks in advance,<br>
      Mikhail</p>
    html_clean: |-
