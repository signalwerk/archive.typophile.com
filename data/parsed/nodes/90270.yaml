    html: |-
      <p>@ fvilanakis<br>
      you're right, there are similarities, but I don't think it's a match either - 'k' and 'p' are quite different, others really close.</p>
      <p>@ Bendy<br>
      that repeated letters don't look identical is probably due to the bad scan. It's the box of a cd, small print - quite difficult to examine.</p>
      <p>In an accompanying pdf-file the title of composer and opera is repeated in the same font as used for the title on the box (see image attached). Pdf-text tool identified it as Bellezza Heavy and Swash, but I can only find Bellezza Regular, which looks quite different. <a href="http://www.fonts.com/findfonts/detail.htm?productid=786746" title="http://www.fonts.com/findfonts/detail.htm?productid=786746">http://www.fonts.com/findfonts/detail.htm?productid=786746</a></p>
      <p>The rest of the text on the box seems to be set in a different font anyway.</p><div class="imageWrap"><img src="http://typophile.com/files/01_4341.jpg"></div><p></p>
