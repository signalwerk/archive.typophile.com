    html: <p>Believe the pdf. Bellezza Heavy, where Condensed is used on the first sample, and Bellezza Swash, used on the second, were created by The Digital Quill Foundry. There are references in Luc Devroye's blog (<a href="http://luc.devroye.org/fonts-32525.html" title="http://luc.devroye.org/fonts-32525.html">http://luc.devroye.org/fonts-32525.html</a>) but could not easily find samples in the wild.</p><div class="imageWrap"><img src="http://typophile.com/files/lamber_5599.jpg"></div><p></p>
