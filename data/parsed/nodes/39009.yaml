      <p>As this hasn’t been adressed, some suggestions for “JESSE GREEN”:<br>
      <a href="http://www.fontshop.com/fonts/downloads/urw/bodoni_black_ot_std/?sample_text=JESSE%20GREEN&amp;sample_size=48">Bodoni Black</a> is a good base, if you want to fill in the fruit yourself.<br>
      <a href="http://www.myfonts.com/fonts/archivetype/archive-garfield/">Archive Garfield</a> has similar proportions.<br>
      Last but not least, <a href="http://moorstation.org/typoasis/designers/steffmann/samples/l/lettres.htm">Lettres ombrées ornées</a> and <a href="http://moorstation.org/typoasis/designers/steffmann/samples/r/romantiques.htm">Romantiques</a> both are nice decorate slab freebies digitized by Dieter Steffmann.</p>
