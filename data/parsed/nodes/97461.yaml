    html: <p>I think a text serif that would harmonize would be something with a hand modeled, humanist feeling, and some softness. Goudy Old Style will work much better than Cochin, I would think. And, may I say, my own <a class="freelinking external" href="http://www.fontbureau.com/fonts/WilliamsCaslonText/" rel="nofollow">Williams Caslon Text</a>.</p>
