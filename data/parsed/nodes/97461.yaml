      <p>Good point Nick.<br>
      The cap A in Goudy Sans is a bit rich for most layout uses, except perhaps the occasional drop cap.<br>
      However, there are several contemporary humanist sans faces which convey something of the slightly rough-hewn, somewhat condensed, tiny-serifed (glyphic) quality of Goudy Sans.<br>
      Ideal Sans, Winco, Grotext, or my own Sensibility, for instance.</p>
