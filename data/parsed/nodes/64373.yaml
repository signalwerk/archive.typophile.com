  html: |-
    <p>I've been working at digitizing Alf's script for a while now. I faithfully digitized each letter and stroke. At some point I realized that as a demonstration of hand lettering, Alf never intended the forms to be copied precisely. Okay, so I'm slow. In any case, I have a working version of the lower case. Still needs work. I just wanted some input. After working on 268, I have a much greater respect for folks that create scripts.</p>
