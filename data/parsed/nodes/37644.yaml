    <p>Hi all,</p>
    <p>I have serious trouble in understanding this thing about the naming of the glyphs (and all the other in my eyes too complicated stuff about all the naming in a font.-).<br>
    In certain situations- please don’t ask me how it came up - I found myself a glyph board like the one below. It has large designs so the letters are not visible in the whole. Tried thousand numbers in thousand menus to make it fit without success. ;-)<br>
    But this is not the problem here. What makes me sick is in this case my ‘R’ It has the strange name _0082 or something like that and if I want to change its name FontLab cancels it from its place and throws me at the end (and its not possible to paste it away from there!) where I absolutely don’t want to have it and where besides it doesn’t work any longer with the R-key for example in the metrics window. How can I achieve that it stays where it is meant to be in between Q and S and is named R and comes out pressing the R-key? Would be a miracle! Why couldn’t the FontLab programmers not do a simple thing as it was for decades in FontStudio? I wonder about the sense of all the complications.</p>
    <p>Thanks<br>
    Stefan</p>
