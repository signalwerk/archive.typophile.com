      <blockquote><p>They use their tools to serve their users better.</p></blockquote>
      <p>I think this is the weak link in your logic. Users of open tools are not inherently more mindful of their users than users of proprietary tools; in fact their general resistance to compensating quality often makes things worse for their users, while making themselves richer. I've said this before: many open-source advocates -like yourself- are altruistic; most of them however -like the ones who don't bother engaging in such discussions- are simply taking advantage. This is the big unspoken sad reality in the open-source scene.</p>
      <p>But let me back up and offer another angle, to better explain what I was previously saying: the current (and long-standing) situation with Armenian fonts is not socially just to Armenian end-users - there are very few typefaces we can be proud of. This is certainly not because there's a lack of respect for the Armenian script or a lack of talent in type design. It's because of a lack of profitability. Apache helps us, as a people. And I posit that the situation is similar with most minority scripts. Apache is in effect the best gift to them; the more restrictive licenses severely limit the development of high-quality fonts because there are very few people who will donate big chunks of their lives like that. I think Westerners -because they don't have to work as hard to survive- generally have trouble relating to this seemingly selfish -but in reality very communal, although not global- approach to spending one's time/resources.</p>
      <blockquote><p>But was it libre?</p></blockquote>
      <p>It has a minimal EULA that prohibits resale... but there's no talk of modification, which is intentional. I don't believe a no-mod clause is usually ethical, so there's no de jure restriction against somebody selling a modified Arasan. In practice however Arasan has not been redistributed/resold in a modified version (AFAIK) because most of its value comes from the embedded bitmaps, which is technically relatively tricky to do (although the tools are free); plus unlike a Latin font there aren't many niceties one can add anyway.</p>
      <blockquote><p>but the font designers wish that the fonts be treated as OFL ought to be respected, don't you think?</p></blockquote>
      <p>Not necessarily. I can feel entirely comfortable classing the needs of my people above the needs of one guy, especially if I feel he's failing to grasp the sociopolitical damage of moving away from Apache. It's not about him.</p>
      <p>hhp</p>
