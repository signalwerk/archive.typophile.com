    html: |-
      <p>No two people see any "movement" the same way, and it's not healthy to try to force/trick people to conform to one's own particular vision. To repeat: if being able to sell a modified libre font is the only way some people can justify making that thing, and thus help society by providing something of value which would otherwise not exist, that is social justice. Nobody is forced to buy the thing; anybody can get a free one if it exists (and if it doesn't exist, there's often a good reason).</p>
      <p>The only people who benefit from preventing money-making from modified libre fonts (and not in all ways, mind you, since they're part of society/culture too) are graphic designers -and their clients- who refuse to pay for fonts. Pardon me while I don't mind.</p>
      <p>hhp</p>
