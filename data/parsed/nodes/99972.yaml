    html: |-
      <p><em>- If they don't use the reserved-name scheme, are they still officially OFL?</em></p>
      <p>Yes</p>
      <p><em>- Why do people usually opt to interact very badly with the realities of web fonts?</em></p>
      <p>They don't think things through. </p>
      <p><em>- Does Apache not have any naming issues?</em></p>
      <p>This depends on your perspective. If you want name control, Apache has naming issues because it doesn't have a RFN-like option. If you do not want name control, Apache has naming issues because it doesn't include trademark usage, so if the font name is trademarked, you'll need a separate agreement to use the trademark.</p>
