      <p>Like anything else, that depends on the perspective. From the perspective of graphic designers (and their clients) who think freedom comes from saving money, sure. But from the perspective of a type designer who thinks freedom comes from <em>making</em> money, a more "opportunistic" license (like Apache) is great. And from the perspective of a <em>reader</em> of a minority script who wants to be free of mediocre fonts, a type designer taking advantage of an opportunistic license is great. Which brings me to a central issue: freedom isn't just about how many fonts you have and how little they cost you, it's also about quality.</p>
