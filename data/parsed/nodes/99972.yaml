      <p><cite>Is this font is suited for print work or it's a font to use in Web only? </cite><br>
      If it doesn't look good in print, it may have been a poor choice for Android devices, which now often have 300+ ppi screens. If it was intended for Android 2.3 ICS only, that may be a forgivable sin, since there are fewer hi-ppi devices--but certainly one that should be reconsidered. We are quickly approaching a point where there is no important difference between 'screen' and 'print', other than that text on a mobile device UI may be at low point sizes and accommodate UI elements.</p>
