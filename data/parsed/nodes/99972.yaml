    html: |-
      <p><em>There is however a strong undercurrent of "social justice" in the libre movement (its main redeeming quality as far as I'm concerned)</em></p>
      <p>Right. If you make a proprietary font for a minority script, that's working against the social justice aims of the libre movement. If a professional decides it's profitable (or at least not a total loss :-) to make a new libre font, that's really great. If they decide to make a new proprietary font, that doesn't diminish the libre font movement, just as new libre fonts don't diminish the proprietary font community. But to extend a libre font but keep the improvements proprietary diminishes the progress of the libre movement, I think. </p>
      <p>The OFL protects libre fonts from this tragedy, which is why almost all type designers prefer it, and why the designers of the small number of Apache fonts asked to move to OFL.</p>
      <p>(I see i tags no longer work, thanks!)</p>
