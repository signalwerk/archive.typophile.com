      <p>Wait, I just realized that Abattis is Dave Crossland. All this time, and I never knew? Hi Dave. </p>
      <p>With regards to re-licensing, you can always go more free, but you cannot go less free. Once you've licensed something as BSD, for instance, you can't revoke that and make it GPL. You can fork it, or dual license it, or stop distributing it, but you cannot prevent someone else from redistributing or modifying their copy under the original license.</p>
      <p>I don't know the specifics of the Apache license, but with MIT/BSD, you're explicitly allowed to re-license it however you want, provided you keep the original copyright stuff intact, but that only covers whatever copy you are distributing, not the originals.</p>
      <p>This licensing stuff sucks.</p>
