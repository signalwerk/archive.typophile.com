      <blockquote><p>If you make a proprietary font for a minority script, that's working against the social justice aims of the libre movement.</p></blockquote>
      <p>I don't think so, because not having any (or very few) good fonts is more socially unjust than having (more) good proprietary ones. Remember, social justice is more about the reader than the designer; social justice says: the designer not wanting to give up money should not harm the reader.</p>
      <p>BTW the situation for minority scripts is inherently different than for Latin (even though it's still true that there can never be enough typestlyes).</p>
