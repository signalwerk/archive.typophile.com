    html: |-
      <p>The reserved name is an optional part of OFL.</p>
      <p>People use it because they don't want wacky derivatives to come out with the same name, and they don't necessarily understand or care that a web font system (including Google's) must modify the font in a variety of ways, including subsetting. Not to mention that plenty of OFL fonts predate widespread use of web fonts. Some web font vendors chose to ignore any apparent issue and just use the OFL-licensed fonts anyway.</p>
      <p>Not being really designed for fonts, Apache license does not have a renaming clause.</p>
      <p>T</p>
