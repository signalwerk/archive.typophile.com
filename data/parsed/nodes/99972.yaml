      <p>No, I'm not familiar with this. Whats the story? :)</p>
      <p><em>most Apache fonts are relatively old, supporting your view that designers no longer like it.</em></p>
      <p>They always preferred OFL.</p>
      <p><em> The big exception Roboto. I wonder why (not a rhetorical question).</em></p>
      <p>Everything in AOSP is Apache, modulo the Linux kernel which is an anomaly. </p>
      <p><em>Are there many more non-Google Apache fonts?</em></p>
      <p><a href="http://code.google.com/p/noto" title="http://code.google.com/p/noto">http://code.google.com/p/noto</a> is coming along.</p>
      <p><em>If the more free license does not allow something, is the original designer nonetheless allowed to over-ride that? That would actually be an incentive to release an OFL font: get people hooked on your design, then make money on commissioned mods.</em></p>
      <p>Yes, the original designer OWNS the rights and so can distribute copies under lots of different licenses. If you receive a copy, you are bound by the terms under which you received it; but those terms don't bind the copyright holder. </p>
      <p>And yes, some designers who release OFL fonts are doing so as 'loss leaders' for proprietary versions of the same fonts which are more complete - Ale Paul, for example - but Sorkin Type Co is running a better model I think; they are making the WEB fonts libre, and PRINT versions proprietary, so that the two are actually separate but intwined projects. That way, there isn't tension between community, libre progress and proprietary development. </p>
      <p><em>If the designer of a free/libre font changes his mind, do you think people should respect that decision and stop using the free/libre version?</em></p>
      <p>I want people to participate in libre culture because they genuinely think its a good idea. It seems a little mean to not respect their wishes.</p>
      <p><em>Can you cite actual cases of an Apache font being re-released under a stricter license?</em></p>
      <p>No. I can cite one case of an experienced type designer that wanted to rework a libre font, who ended up starting from scratch so the original license didn't apply anyway : <a href="http://www.anatoletype.net/fonts/dejarip" title="http://www.anatoletype.net/fonts/dejarip">http://www.anatoletype.net/fonts/dejarip</a></p>
      <p><em>Wait, I just realized that Abattis is Dave Crossland. All this time, and I never knew? Hi Dave.</em></p>
      <p>Haha! Hi Dan :-)</p>
      <p><em>With regards to re-licensing, you can always go more free, but you cannot go less free. Once you've licensed something as BSD, for instance, you can't revoke that and make it GPL.</em></p>
      <p>I'm quite sure you can take a BSD work as a piece of a larger work and make that overall work GPL, or proprietary.</p>
      <p><em>You can fork it, or dual license it, or stop distributing it, but you cannot prevent someone else from redistributing or modifying their copy under the original license.</em></p>
      <p>Not their copy, no, but another copy they get from you.</p>
      <p><em>I don't know the specifics of the Apache license, but with MIT/BSD, you're explicitly allowed to re-license it however you want</em></p>
      <p>Kinda. You can't 'relicense' it. You can distribute it under that license, which allows distributing it with additional restrictions. The GPL is more free because users can't be put under additional restrictions.</p>
      <p><em>This licensing stuff sucks.</em></p>
      <p>:)</p>
      <p><em>Also, let's get a bit down-to-earth here: this<br>
      <a href="http://en.wikipedia.org/wiki/Software_Freedom_Law_Center" title="http://en.wikipedia.org/wiki/Software_Freedom_Law_Center">http://en.wikipedia.org/wiki/Software_Freedom_Law_Center</a><br>
      seems to be the only entity that sues people who violate an "open"-flavor font license,</em></p>
      <p>The FSF have been doing this for decades, and Haralde Welte has been doing his own GPL activism at <a href="http://gpl-violations.org" title="http://gpl-violations.org">http://gpl-violations.org</a> </p>
      <p>You don't hear about this much because the FSF's aim is software freedom through GPL compliance, not profits from lawsuits, so they quietly behind the scenes say, you could be sued for millions of dollars of copyright infringement, but we just want you to comply with the license which costs nothing. So they do that, instead. </p>
      <p><em>their last action was over three years ago. Have people been behaving? That would be a first... Or maybe the SFLC ran out of cash.</em></p>
      <p>By the look of it the last time I dropped by their office on Broadway in Manhatten, SFLC is financially buoyant. Think quiet settlements.</p>
