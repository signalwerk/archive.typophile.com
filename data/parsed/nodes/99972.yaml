      <p>Dave, thanks for the complete reply.</p>
      <blockquote><p>the original designer OWNS the rights and so can distribute copies under lots of different licenses.</p></blockquote>
      <p>Good to know.</p>
      <blockquote><p>It seems a little mean to not respect their wishes.</p></blockquote>
      <p>I agree it can be too opportunistic sometimes. But sometimes the OFL license is "mean" compared to the Apache one, for example when it reduces the quantity of quality fonts for a minority script. Considering the issue immediately above, that might often constitute locking out others with more time and/or ability to help a minority script just so the original designer can make more money. To me the needs of communities are more important than the desires of an individual. And these sorts of sentiments should in fact be integral to the spirit of open software, even though it might seem counter-intuitive sometimes (and sometimes it will in fact backfire).</p>
      <blockquote><p><em>Can you cite actual cases of an Apache font being re-released under a stricter license?</em></p>
      <p>No.</p></blockquote>
      <p>This* does cast some doubt on your view that virtually all designers no longer like Apache. Certainly the near-hopelessness of enforcing a stricter license is a damper, but if people do expect their wishes to be respected (which is the first step to actually getting them respected :-) then the least they can do is revise the official position.</p>
      <p>* Not to mention the still-standing elephant in the room, Roboto.</p>
      <blockquote><p>Think quiet settlements.</p></blockquote>
      <p>Somebody should work on making <em>that</em> more open. :-&gt;  Seriously, there's no greater deterrent than seeing other people punished for something you're considering doing.</p>
      <p>--</p>
      <p>The more I think about it, the more I believe Apache is a more magnanimous license. Remember, you don't <em>have</em> to charge money for a derivative work, and there will always be some people who don't; but if -directly- making money is the only way a given individual would feel <em>free</em> taking part in open software, that ends up helping others too.</p>
      <p>hhp</p>
