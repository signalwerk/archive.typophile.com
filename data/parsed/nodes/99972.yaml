      <p>I guess that depends on the core objective(s) of a given supporter of libre fonts - there's a whole spectrum of agendas crawling around in there. :-)  There is however a strong undercurrent of "social justice" in the libre movement (its main redeeming quality as far as I'm concerned) and if you consider that generally minority scripts enjoy much higher quality fonts when a professional decides it's profitable (or at least not a total loss :-) to make some, the Apache license actually has an advantage. For example not having to make a complete high-quality Latin companion is a huge deal to a designer of Armenian fonts.</p>
      <p>About "moving" from one licensing model to another: considering this is all "open", the previous incarnation can't go away, right? Or do I have to move quickly?  :-)</p>
