      <p>It's not identical, but the <a href="http://www.houseind.com/index.php?page=showfont&amp;id=4&amp;subpage=viewfonts" rel="nofollow">House Chalet 70 London</a> style replicates almost all of these letterforms except the M. This Adidas lettering is probably custom lettering. (I'm surprised it took this long for requests for World Cup soccer shirt lettering fonts -- or else I missed the earlier requests.)</p>
      <p>- Mike Yanega</p>
