      <p>Re: change and testing. The change will be evolutionary, and the testing will be done, as always, in the market place. And let's remember some schools are not even teaching cursive any more.</p>
      <p>The change that I am seeing is increased angularity (less flow) in type. Here I'm thinking of Skolar or Turnip. And my eyes see this as more readable on paper and on screen. Is this angularity happening in non-Latin languages?</p>
      <p>Will the changes in type influence the way we print? I think, over time, yes, this influence will be reversed. And let's remember (part 2) that throughout history the dominant language in an area has always been the language of the powerful nation state. Whatever changes happen, they may not be in the Latin script.</p>
