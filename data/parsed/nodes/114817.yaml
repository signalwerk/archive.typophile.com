      <blockquote><p><em>After all, the world has many different writing systems in current use. Studying the reading performance of Koreans and Chinese and Armenians and Israelis and Inuit and Georgians and Tibetans and Ethiopians with different typefaces for their languages, for example, might yield some insights into the right direction in which to move.</em></p></blockquote>
      <p>In the fall of 2007 Gerry Leonidas held a seminar at the <a href="http://tdc.org/events/education/non-latinweek-ends/2007nonlatleonidasgreek.html" rel="nofollow">Type Directors Club</a>. I was there as Gerry’s guest. His seminar turned very successful: it was most informative, educational, and fun. Like all participants, I had learned a lot. I had a special angle on the seminar’s content, agenda, and methods used: earlier that year, also at TDC, I conducted a similar <a href="http://tdc.org/events/education/non-latinweek-ends/2007nonlatzhukovcyrillic.html" rel="nofollow">seminar on Cyrillic</a> type design.</p>
      <p>The relationship of Cyrillic and Greek scripts, their similarities and differences, were always of great interest to me. What caught my attention at Gerry’s seminar was that in the beginning he asked all present to try their hand at writing Greek letters; he commented on the participants’ worksheets, explaining the finer points of glyph construction. </p>
      <p>I asked myself, why couldn’t I have used the same exercise to kick off the discussion of Cyrillic letterforms? Why didn’t I even think of it? It felt so natural, so obvious. Upon reflection, it dawned on me that the reason could be in the fundamental difference in genetics of the two scripts, and the development of their respective typographic forms.</p>
      <p>Unlike Greek script whose roots go back to North Semitic writing, or even earlier, Cyrillic did not originate as a product of natural evolution. It was <strong>invented</strong>, custom-designed to record Slavic speech, and much more importantly, to spread the word of God. Yes, Cyrillic writing derived from Greek writing, but in the grand scheme of things this circumstance is rather collateral. At the time it just couldn’t have been based on any other contemporary script—even if several Cyrillic letters derived from Hebrew letters.</p>
      <p>For quite a while—actually, for nine hundred years—Cyrillic letterforms evolved naturally, moving farther and farther away from their Greek progenitors. Following the universal pattern (<em>Schrift kommt von Schreiben</em>), the glyphs of the fonts used in early Cyrillic print, with few exceptions, had been fashioned after written letterforms (vyaz, poluustav). The Latinised forms of some West- and South-Slavic scribal hands, printing types (e.g., Bosančica) or monumental lettering had little bearing on the mainstream trends in Cyrillic typography.</p>
      <p>A really big change took place in the beginning of the 18th century when Peter the Great decided to modernise, or to be more accurate, to establish, Russian secular printing. At his initiative a new printing type had been developed, vaguely based on the Western forms. The glyph set of the new, ‘civil’ type was different from the one used before: it was adapted for the typesetting in contemporary Russian, not in Church Slavonic. Since 1708–10 the development of Cyrillic typography has taken a totally new direction; the forms of the post-Petrine printing types, not only Russian, can be traced back to Peter’s Civil Type. </p>
      <p>All things considered, the new, ‘westernised’ forms of Civil Type had little precedent in Russian writing, and leave an impression of an arbitrary, whimsical refurbishment. Peter’s typographic reform was indeed a <em>triumph of the will</em>. It took a while for the new letterforms to get broken in and integrated into a harmonious ensemble, and for the everyday writing to finally catch up with the reformed printing type.</p>
      <p>There are reasons to suggest that in Cyrillic type the chirographic aspects take a back seat to invention and engineering. I find it significant that Peter’s <em>grazhdanskii shrift</em> had been consciously and purposefully designed to imitate the forms of <strong>printing type</strong> (one hundred years later, in a curiously similar way, the shapes of the newly-invented Cherokee letters had been informed by the forms of printing type, Caslon).</p>
      <p>It looks like the familiar adage of <em>Schrift kommt von Schreiben</em> does not quite apply to post-1710 Cyrillic type. If Cyrillic did indeed come from writing, then it’s come a really long way; so long that its connection with writing has become hardly traceable. To a considerable extent contemporary Cyrillic presents a piece of conceptual design where the convention in the shaping of glyphs takes precedence over the aesthetics of writing.</p>
