      <p>Unlimited freedom in design often leads to chaos.</p>
      <p>It happens, fortunately, that the characteristics of the nib of the old-style pen led to subtleties and details in letter shapes that improved legibility and reading. Thus, type design from calligraphic roots provides a beneficial discipline and framework.</p>
      <p>Never the less, you are absolutely right that putting ink on paper can be done arbitrarily, and there is no particularly good reason that type designs should be calligraphically-based. One useful means should not be confused with the end.</p>
      <p>In subtle ways, ever since the pantograph freed type from the technical limitations of punch-cutting, type design has included non-calligraphic elements. Think of the subtle ink traps placed within some newspaper typefaces.</p>
      <p>And what of Bifur, or Peignot (Peignot Bold being its most famous weight) or the typefaces based on MICR to give things a computer look? Display faces such as this show that the non-calligraphic is hardly unthinkable.</p>
      <p>Today, the designer intending to design a typeface for the ordinary reading of body copy generally includes in his consideration how people are creatures of habit, and thus includes familiar calligraphic elements in such designs. And there is still room to do new things in mixing elements from Jenson, Aldus, Garamond and Caslon or reviving the work of other type designers from that period or thereabouts.</p>
      <p>But even though you may be disappointed in the pace of progress, sans-serif faces like Helvetica and Univers do not look to me as though they were written with a pen.</p>
      <p>And then there is Optima.</p>
      <p>If people experimenting with abandoning the tyranny of the pen take their experiments seriously enough to aim at rivalling these successes, I may applaud, but if they just design bizarre-looking letterforms that have no chance of acceptance as anything but attention-getting display faces, I am not going to accord such things any significance.</p>
