      <p>It's true that Peter the Great took his design for the Russian alphabet from type for the Latin alphabet. But I'm not at all comfortable with your conclusion that this means that the Cyrillic script is divorced from its connection with writing.</p>
      <p>The reason I am not is that to all appearances, the Cyrillic script is quite thoroughly copied from the Latin script - and, thus, if its model, the Latin script, is not divorced from writing, then neither would the Cyrillic script be so divorced.</p>
      <p>Russian handwriting and Russian italics also exist. But from Peter the Great's Bodoni-esque Cyrillic, one can directly proceed to Cyrillic Times Roman, Cyrillic Jenson Oldstyle, or Cyrillic hand printing. Nothing got so redefined or reinvented in the copying that there are any Russian letters for which one can't do anything one can do with a Latin letter.</p>
      <p>This may be bad for the Cyrillic alphabet as an independent object of study, but Cyrillic type design and Cyrillic calligraphy should have no problems.</p>
      <p>It's scripts like those for Armenian and Greek, which are under pressure to copy from Latin models, where those models are not perfectly suited to the nature of the script, but resources are lacking to do an equivalent indigenous development, that have problems.</p>
      <p>Russian type designers are contributing new type designs to the pool available for the Latin script, so it is not as if the Cyrillic script area is reduced to copying; in fact, perhaps the best way of looking at this is to view the Cyrillic script area as a part of the Latin script area which just happens to be somewhat differentiated as to character set. Like German, which has the eszet that other Latin-alphabet languages do not, only a bit more different.</p>
