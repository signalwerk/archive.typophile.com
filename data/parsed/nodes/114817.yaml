      <p>After my post, I felt I left one thing out. Since I said that Armenian and Greek have a problem, but they have the option open to them of Latinizing their typefaces, I shouldn't have said that Cyrillic has no problems. To the extent that Peter the Great replaced a valid indigenous model for Cyrillic script with one copied from the Latin script world, there was a loss in the <em>cultural</em> sphere.</p>
      <p>I'm not sure, though, that such a loss did occur at this time, even though you and Hrant are agreed that one did. No doubt that is simply due to ignorance on my part, however. The reason I say this is that the difference between pre-Petrine and post-Petrine letter forms appears to me to be simply one of typeface style; the letter forms were put into Western dress, but they weren't altered.</p>
      <p>Russian display typefaces based on pre-Petrine models exist to this day.</p>
      <p>So the Russian alphabet hasn't been destroyed the way the Greek (lowercase) alphabet would be if someone were to Latinize Greek thoroughly by using Cyrillic as a model <em>and the result were to be adopted in Greece to the exclusion of the previous form of printed Greek</em>.</p>
      <p>Cyrillic may have suffered a cultural blow, but because its present form is so close (not identical, as you point out) to the Latin, the kinds of problems I was saying it didn't have are <em>typographical</em> ones. If it can be done in Latin, it can be done in Cyrillic. (Well, <em>small capitals</em> might be confusing in Cyrillic, admittedly.) Without, as in the case of Greek and Armenian, paying a cultural price - because the price has already been paid.</p>
