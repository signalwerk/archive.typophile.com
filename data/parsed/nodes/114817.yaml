    html: <p>I don't agree, I think optical illusions are very germane. They actually are part of the story—e.g. the desirability of overshoots. I think the ideals have to do with ratio of black to white, contrast, rhythm, relation of spacing counter, etc. The ideals allow for different writing systems, for a start. Some people have a hard time reading—dyslexia, visual impairment—but I think for those who can read fluently the variations aren't as big as in size of people.</p>
