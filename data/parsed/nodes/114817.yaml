      <blockquote><p>So the Russian alphabet hasn't been destroyed the way the Greek (lowercase) alphabet would be if someone were to Latinize Greek thoroughly by using Cyrillic as a model <em>and the result were to be adopted in Greece to the exclusion of the previous form of printed Greek.</em></p></blockquote>
      <p>The <em>Russian</em> alphabet has not been destroyed because it did not happen to exist before 1708–10. For written Russian Old Church Slavonic alphabet was used, which was as clumsy and inefficient as, or even worse than, using Greek alphabet to record Slavic before the invention of Cyrillic.</p>
      <p>It is interesting to compare the typographic activities of two European monarchs, Louis XIV of France and Peter I (also “the Great”). The Commission Jaugeon appointed by Louis was just modifying the shapes of the typographic script whose letterforms were already quite well established—for H.M.’s own <em>imprimerie</em>. Peter was altering the very complement of the alphabet itself, for the whole Russian Empire—not only revising letter shapes but dropping the letters that were of no, or very little, use for printing books in the new secular Russian language of early 18th century.</p>
      <p>In his book <em><a href="http://www.hup.harvard.edu/catalog.php?isbn=9780674013162" rel="nofollow">The Petrine Revolution in Russian Culture</a></em> (p. 276) James Cracraft wrote:<br>
      </p><dl>
      <dd>Not only a newly streamlined, Europeanized Russian alphabet but a newly streamlined, Europeanized Russian language were among the outcomes of Peter’s drive to renovate his realm—here, its architecture—along contemporary European lines.</dd>
      </dl>
      <p></p><p>Just look at how impatiently, obsessively and adamantly did Peter cross out in that <a href="http://www.wdl.org/en/item/561/view/1/5/" rel="nofollow">font proof</a> of 29 January 1710 not only the glyphs that looked old-fashioned but also the characters he thought useless for his <em>neue Typographie</em></p>
