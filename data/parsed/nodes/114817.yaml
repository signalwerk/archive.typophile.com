      <p>This has been a running debate here on Typophile: to what extent is readability a matter of familiarity and to what extent the demands of the eye and brain? In the recently published <a href="/wiki/https%3A/%252Fhyphenpress.co.uk/products/books/978-0-907259-48-0" class="freelinking" rel="nofollow">Typography Papers 9</a> Peter Enneson and I have a new paper called 'Readability: Discovery and Disputation' about the research work of Matthew Luckiesh, done in the later 1930s in collaboration with Linotype. </p>
      <p>Luckiesh found that blink rate increases more over time with difficult reading conditions, when other variables are controlled for. He used the term 'readability' to indicate ease of reading extended text. And he said that he research show that it is inverse to increase in blink rate over time. </p>
      <p>Luckiesh found that in particular boldness of type is a variable that influences readability, with a medium weight being better than very heavy and light. —He tested four weights of the slab serif Memphis. Frutiger has also argued, independently, that there is an ideal black:white ratio. And, indeed, I think you see this across writing systems, even based on different instruments, contrasts, etc.  </p>
      <p>W.A. Dwiggins agreed with Luckiesh about there being an ideal, but added a number of other variables that he thought influenced readability. None of this has to do with the degree of differentiation of letter forms, which has for long been a focus of interest. </p>
      <p>As to the issues of the relationship to the moving front of the pen, and contrast, I think this is complicated because the shapes traditionally drawn by the pen and brush I think are influenced by the demands of the eye. For example, the vertical emphasis of latin type and horizontal emphasis of Hebrew I think relate to the design of the letter shapes in their respective alphabets, and this in turn is a response to the demands of the eye and brain. So it's the letter design + contrast that is at work. </p>
      <p>I'm hoping that Peter and I will have a presentation on this at TypeCon this summer. Meanwhile, you can rush out and buy Typography Papers 9 :)</p>
