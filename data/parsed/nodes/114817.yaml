      <p>Reading is a learned skill, and culture-speciﬁc.<br>
      The shape of alphabets has evolved as part of an inter-related ecosystem of reading, writing, typography and technology.<br>
      The eye and brain are trained to read.<br>
      Reading is also reader-speciﬁc.</p>
      <p>Therefore there are no shapes that are ideal for our physiology, all that can be ascertained are averages of what works best for a particular demographic group of people, educated in a particular manner, at a particular time and place, using a particular technology.</p>
