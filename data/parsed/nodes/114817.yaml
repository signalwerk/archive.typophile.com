      <p>Bill, I don’t think you can compare readability to optical illusions.<br>
      The whole idea of readability is that there are optimal values for physical properties of type letter shapes.<br>
      I would compare it more to chairs or stairs.<br>
      There are best averages for the height of a chair seat, based on the average length of shinn bones, no doubt.<br>
      Similarly, steps are sized and shaped to ﬁt adults, not children or those in wheelchairs.<br>
      Why would readability not follow the same principle?<br>
      i.e. what is ideal for one person is never ideal for another.</p>
      <p>Damn standardization; the average is not ideal.</p>
