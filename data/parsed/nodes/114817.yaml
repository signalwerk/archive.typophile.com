  html: <p>Isn’t it strange that the pinnacle of type boils down to the traces of a tool thousands of years ago? As interesting as it may be, I am not convinced the blooming/recent trend of reversed contrast is much of an improvement. It is, however, a necessary first step. Bla bla bla.</p>
