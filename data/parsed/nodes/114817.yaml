      <p>Dear John, I did mention that after a while the new letterforms introduced by Peter the Great got broken in and integrated into a harmonious ensemble through careful fine-tuning. It is a fact, however, that while the construction pattern of Western italic, which was informed by handwriting, is consistent with the upright forms, post-Petrine Cyrillic italic came out thirty years later than roman, and was actually an afterthought. This can explain many puzzling and confusing inconsistencies in letterform construction of Cyrillic roman and italic:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Cyr_Rm-It_Confusing_3641.gif"></div><br>
      Without doubt, Cyrillic type design is not “reduced to copying”, and designers do their very best to preserve the visual identity and the design integrity of multilingual typefaces across various scripts, with regard to the style category, and/or the aesthetics of the historical period, if/as applicable.<p></p>
      <blockquote><p>Cyrillic script is quite thoroughly copied from the Latin script - and, thus, if its model, the Latin script, is not divorced from writing, then neither would the Cyrillic script be so divorced.</p></blockquote>
      <p>Okay, let’s agree that modern Cyrillic type is not fully divorced from writing, but is related to it through Latin, so that cousinage is, say, once removed.</p>
