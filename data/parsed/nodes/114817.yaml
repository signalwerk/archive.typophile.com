      <p>@Frode Bo Helland:<br>
      <cite>I wouldn’t surprise me one bit if the typeface best suited to our eyes and brain looks unfamiliar – even hideous – by today’s standard.</cite></p>
      <p>Certainly, in theory, that is entirely possible.</p>
      <p>But if it were true, and someone even designed that very typeface in all its optimality, <em>how would we test that typeface in order to discover it was better than what we had now</em>? If it's unfamiliar and hideous, people would find it awkward to learn and read, so a test comparing it to what people are familiar with would be biased against it.</p>
      <p>So in exploring unfamiliar regions to find optimality, one is wandering in the dark, striking blind. Instead, to find what our eyes and brains need, it seems to me we will have to take baby steps to make progress.</p>
      <p>It may also be noted that it doesn't seem that a technical improvement in typefaces is really needed, although the limitations of the dot matrix screen encourage some reaction. Do Garamond and Baskerville really need to be improved on?</p>
      <p>Of course, they <em>were</em> improved, and what we got was Corona (and Aurora and Ionic No. 5)... so we already <em>have</em> typefaces that are highly legible, despite being set at point sizes that constitute cruelty to the human eye. Which, of course, raises the question of the desirability of conniving any further in such unbridled excesses of capitalism.</p>
      <p>On the other hand,  they're trying to come out with smart watches, and if new typefaces could let them display more information, I suppose it would be of some use.</p>
      <p>@Nick Shinn:<br>
      <cite>Reading is a learned skill, and culture-speciﬁc.</cite><br>
      ...<br>
      <cite>Therefore there are no shapes that are ideal for our physiology,</cite></p>
      <p>I think that conclusion is unwarranted, despite the fact that I believe (as noted above) that such shapes would be <strong>very</strong> difficult to find.</p>
      <p>After all, the world has many different writing systems in current use. Studying the reading performance of Koreans and Chinese and Armenians and Israelis and Inuit and Georgians and Tibetans and Ethiopians with different typefaces for their languages, for example, might yield some insights into the right direction in which to move.</p>
      <p>Also, it might be noted that in mathematics, I am a Platonist. I think that a peek-a-boo picture of reality which says that what we cannot see cannot exist is inherently inconsistent.</p>
      <p>However, when it comes to the classic philosophical conundrum</p>
      <p><em>If a tree falls in the forest, with no one to hear it, does it make a sound</em></p>
      <p>I would note that the careful definition of words is of assistance:</p>
      <p>If by sound you mean the qualia associated with auditory experience, they have not been excited or manifested in any human mind by the event;</p>
      <p>if by sound you mean longitudinal pressure waves in the air, clearly they have been created by this tree falling as well as they would have by any other.</p>
      <p>Of course, someone might say that I'm just following the example of Noah Sweat: "If when you say whiskey, you mean", but I think the distinction is valid in my case for determining the domain in which the question is asked.</p>
