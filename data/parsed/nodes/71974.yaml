    html: <p>If there were a vertical line from the edge of the L the A and C of Arts Council should move to the left slightly. Close up after both of the C's in council. Tighten the DY in Ladysmith. Look at all the T's and visually balance the spaces on either side of the cross-bar. it's easy to see this on the T between I &amp; H of Ladysmith. I would look at making the + the same as the cap height and aligning it so the vertical also lines up with the cap L of Ladysmith ( this would help balance the white space that occurs on the top right. You would have to reduce the stroke width to match the other characters. I would also tighten the leading further, possibly by as much as the crossbar of the T. I must admit the R annoys me as does the weight of the Y… apart from that… :D</p>
