    html: |-
      <p>The larger the type, the less space between letters is needed. If this image at 100 percent is the size the image is going to be, the kerning (tracking) is a bit loose. The smaller the type, the more tracking necessary. This only applies to all caps. Lowercase should never have additional tracking.</p>
      <p>I think the the leading could be tighter too. The space between the *+* and *DISTRICT* should be tightened if you tighten the tracking. Erik Spiekerman mentions in his book *Stop Stealing Sheep &amp; Find Out How Type Works*, that the space between words should never be greater than the amount of leading. The reader's eyes will drop down to the next line between the words. The space between the *+* and *DISTRICT* is not more than the leading but I just mentioned that in case you have not heard it before.</p>
      <p>I hope this helps. Take care.</p>
