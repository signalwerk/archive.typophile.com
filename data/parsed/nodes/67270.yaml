    html: <p>What's interesting, at a glance, about this list is the distance between these guys...both in time and space. It would be simple enough to lay out a timeline including each of his accomplishments (type faces designed) to try to draw some connections between them. Obviously there is some overlapping in their lives and careers...makes you wonder how aware they were of each other, how and if they might have influenced each other. It's not like they were googling each other, and with living in different parts of the world (at different times)...it's all kind of fascinating. Being that each of them accomplished so much without having the technology and the global social communities (like this one) we have today does call into question how necessary and useful any of this really is. As stated above, there are books and libraries, like there always have been. It might be interesting to try to pull off this report WITHOUT the using internet...unless you enjoy having your blood pressure raised by assaulting sarcastic comments from the know-it-alls!</p>
