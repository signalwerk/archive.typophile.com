    <p>Hi all, I am currently doing a school project on the five type designers mentioned in the subject line. I was thinking of making some sort of poster with some info and graphs, and was wondering if anyone has any hard data on these guys I can use? Like number of typefaces made, books written etc. Anything you can think of really, I'd be most grateful!</p>
    <p>*edit* Oops, I forgot, that's Morris Fuller Benton by the way.</p>
