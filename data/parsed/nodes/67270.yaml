      - who influenced who (did you know that bodoni as a teenager was planning to go to england to pay a visit to baskerville, but never did because he got ill - and while he was resting, he was proposed with the job of his life by the duke of parma?)<br>
      - and talking about the wives, that is not as stupid as it sounds, for some people here got a real huge help from their spouses, and without these women, some typefaces would very probably never come to this day (check out details about baskerville and bodoni's wives for example)</p>
      <p>this being said i realize i'm having a hard time giving clues about "quantisizable" data... for this is really not what i'm interested in when it comes to typographers. i don't think you can make an interesting job by putting an artist's achievement in an excel table.</p>
      <p>dr</p>
