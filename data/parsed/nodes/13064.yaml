      <p>&gt; a I don't want to say you have to change the 'a'. It is really good. I just have some ideas about what I might do to get a last bit of perfection into it. I could be wrong about each idea. I just haven't seen them &amp; they did occur to me. You have to do what you think is best. It couldn't hurt to try these things ( i think...) - and I think subtle changes at most is what I have in mind. For an overshoot especially. Is there an overshoot already compared to the N?</p>
      <p>&gt; b - fair enough!</p>
      <p>&gt; J and P - cool.</p>
      <p>&gt;S yeah. I think that would make it match the other letters' spirit better. You could also try it the other way I suppose. That aspect of the font is almost Art Nouveau. I guess it has things in common with illuminated letters too. Still there was alot of play in Art Nouveau that you could use to inspire altrenates!</p>
      <p>&gt;6 and 9 Yeah inward curve would work work too. I do like your open shape since it gives you a chance to show offthe nice blade shape you have in some of the other characters. Either or both. Since it is a display face I think alternates would be way cool. And you have a basis for both versions being quite strrong.</p>
      <p>&gt; altrenates - I was thinking about this too and my sugestion is that you build two fonts where some (but not all) charcters are altrenates and then bundle them. CuruleanA &amp; CeruleanB or some such. This would give you up to 2 numerals &amp; up to 4 letters. I can imagine having 4 Rs for instance. That would be really cool. The R you have plus a long foot &amp; maybe a stubby foot and maybe a lc r?</p>
      <p>Anyway, these are just suggestions...</p>
