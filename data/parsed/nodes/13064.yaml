    html: |-
      <p><a href="http://cerulean.st/ceruleansample.pdf" rel="nofollow">Updated.</a> I think this subtle change fixes the a. All a-related glyphs have been revised to match. J,P,6,9 done. Experimentation showed that there are good reasons to keep the balanced proportions of the S as they are; the top half just gets ugly.</p>
      <p>Limiting choices has as much importance to the utility of a font as giving choices. For instance, I tried adding n, and it poisoned the style of the whole face, so I removed it to prevent the possibility of someone using it. The end user is often not a typographer, and it's not always bad to make choices for them. Typodermic's <a href="http://www.myfonts.com/fonts/typodermic/soap/regular/" rel="nofollow">Soap</a>, for comparison, has n but no N, because that's what works best for Soap. The only alternate, t, is tucked elsewhere in the character map so people don't use it by accident.</p>
      <p>Thanks for your help. A final question, assuming nobody else has opinions: Can you tell me what you don't like about the ampersand? I can tell it falls short of ideal somehow, but I can't figure out what's wrong with it.</p>
    html_clean: |-
