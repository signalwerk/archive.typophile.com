      <p>The new 'a' seems much improved to me. Overall things seem pretty dang sweet! Looking at the PDF this is what I am still wondering about:</p>
      <p>a: maybe a slight additional reduction of the height of the bottom counter shape. Not key. It's nice as is too. You could raise the top arm a little as an over-shoot... Altrenate?<br>
      b: there isn't one but it looks like there could be. - no biggie I suppose but it looks like it might be easy to have! I guess it could put pressure on the idea that there should be every other letter in LC though...<br>
      J; What about an altrenate j or even two? You could have a longer one to start but also looking at the K the top arm looks like something you could use to build an exciting altrenate bottom of a J. Sort of like the two Rs. See what I mean?<br>
      P: What about an Open P altrenate like the R?<br>
      S: What about an Altrenate? There are several letters in your font that have a fullness - the B, R, and a are examples - that I think might be brought into an Altrenate S. This comment applies to the Y too.</p>
      <p>The connection of the 6's counter seems like it is too straight. 9 too - what about making these open like the R.</p>
      <p>I think that Ampersand needs some work!</p>
      <p>Okay enouugh pummeling!</p>
      <p>What do you think?</p>
