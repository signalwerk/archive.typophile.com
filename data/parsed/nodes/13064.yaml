      <p>a: If I shorten the counter of the a, would that reduce or exacerbate the old-d appearance? Would eliminating the bend - making it more like 6 and 9 - help? Or open? I'm afraid I'm kind of attached to the a as it is, and the character of the whole face kind of hinges on it.</p>
      <p>b: Ascenders are not in the cards for this face, but I may try creating a complete normal duocase version of the face sometime.</p>
      <p>J, P: Good ideas.</p>
      <p>S: I'm not sure what you mean by an alternate here. If the existing S lacks that quality, it should be changed. Raise the center?</p>
      <p>6, 9: I'll consider open, but might it work to curve inward more, rounding the counters?</p>
      <p>A note on alternates: I don't have the budget for Opentype capability. I have room for one alternate each where the capitals go.</p>
