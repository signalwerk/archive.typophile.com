    html: |-
      <p>This looks great! I really like the new P &amp; J. I noticed this time was that now that all the other letters seem tight &amp; right  - the bottom of the U might be moved down just a smidge - more like the e &amp; the c which overshoot the baseline nicely. I don't know that it needs to go as far as those do - and I also know that it would mean (maybe) altering the R with the long arm so ...</p>
      <p>Also - all the letters have a ton of spirit - but the cap Y seems just a little less exciting. You got so much feeling in the others but it seems like a little more in the Y would be good now. It worked really well in the P! The P looks great.</p>
      <p>The Cap M &amp; N have very similar widths. I wonder if the N wouldn't be better a little more narrow. It calls attention to itself because it is really roman in flavor &amp; doesn't have the curves you have in the other letters. On the otheer hand an orthodox N is less wide than an M anyway. Look at Hoesfler's Ziggurat for instance.  </p>
      <p>Looking at the sample of text at 50% I noticed that the leg on the Cap L seems a little long for even color in text. Maybe it could be shorter. Do you see what I mean? Not a lot but just a little. Take a look at some other faces - Copperplate is more like what you have but I would never set a sentence in copperplate. Emigre's Vendetta shows the effect I have in mind. </p>
      <p>Lastly I think since it seems like you are feeling like you are done with the letterforms it's time to look at spacing &amp; kerning. The word cerulean looks pretty good. The N seems a bit close to the a..but in general it seems good. The word sky looks a bit open to me though. Actually all the letters to the right of the A seem too close. Look at the spacing between the A&amp;G vs O&amp;N in dragon. See the uneveness? The Word 'Nouveau' looks quite good apart from the A&amp;U.</p>
      <p>About the lc N idea. You should do what you think best. I can imagine a LC n working really well - your P &amp; e give mme confidence it is possible. Also look at these maybe</p>
      <p><a href="http://www.typography.net/type/shires.htm" title="http://www.typography.net/type/shires.htm">http://www.typography.net/type/shires.htm</a></p>
      <p>But obviously - it's up to you!</p>
      <p>About the ampersand: I think your P has panache. It has flair. The current ampersand just kind of sits there. It doesn't look like it's ready to go ride a dragon like the rest of the face. It could be the coolest glyph of all! You could have 4 of them! I suggest that you design &amp; redisign them based on a host of additional kinds of shapes. What for instance about and ampersand that looks like an 'et'?</p>
