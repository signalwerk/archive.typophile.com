      <p>The last one is the most convincing to me. But it's serif on the t in the et feels tacked on in this context. Is it a reversed serif from the other T? </p>
      <p>I imagine that there is more to try out. Each of the examples you posted looks like it is based on existing forms - maybe too much so. I wonder if you sketched out some new shapes with a pencil if you could get something even better.</p>
      <p>What if the '&amp;' was taller and or deeper ( descending)  than the other glyphs? It's going to get used in titles like 'goblins &amp; trolls' or 'meat &amp; cheese' ( I am guessing ) so why not let it draw attention to itself with some extra height or depth ?</p>
      <p>Check this out too</p>
      <p><a href="http://store.adobe.com/type/topics/theampersand.html" title="http://store.adobe.com/type/topics/theampersand.html">http://store.adobe.com/type/topics/theampersand.html</a></p>
      <p>I would go through &amp; look for the form you like best out of the many many that exist ( two in the font  would be way cool! ) and then start sketching. </p>
      <p>There is huge potential for interest &amp; character in the ampersand. </p>
      <p>Since this is a titling/display face it might be an important feature for sales puposes.</p>
