      <p>Here a couple of quick impressions. I like it in general and it looks like a fun face to use - there are some things that I would consider tweaking </p>
      <p>the 'a' is so open that it starts to be hard to read. What about a straight line instead like the 'e'. The e is pretty sweet. P R &amp; Z too.</p>
      <p>Why is it spaced so tightly? I think these forms would do better with a bit more air between them.</p>
      <p>In general I think I'd like the see just a little less roman feeling in this. I think it's there to give the face some teeth or sharpness The R with tail especially gives me that feeling. And the 7. I think they work well - although the R's longer tail seems a little weak to me. Maybe give it a bit more weight.</p>
      <p>But some letters seem like they would be better off  a little softer or more whimsical. The W M H &amp; T feel that way to me. The B is an example of a better hybrid I think.</p>
      <p>I could find more to say but that is what initially jumped out at me,</p>
