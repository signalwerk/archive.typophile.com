      <p>I'm all for using keyboard shortcuts for setting paragraphstyles. Did it in QXP and do it in InD. </p>
      <p>My system (for what it's worth) is that I always use the modifier-key Option; row 1,2,3 is for Bodytype (eg with and without indent, slightly different h&amp;j etc); row 4,5,6 for Subtitles in various guises and/or hierarchy; row 7,8,9 for Headings. </p>
      <p>So in most of my layouts I use (Option) 1, 4 and 7, which makes doing the preliminary styling a no-brainer… ; )</p>
