    html: |-
      <p>Hi Robert. Contrary to what Ricardo says above I believe it was an undocumented, unofficial shortcut that came about in v.2 or v.3 of QX, and I remember reading about it in a trade mag (possibly the UK issue of MacWorld) rather than any Quark documentation. I never really had any call to use it because my production background meant that I usually assign keyboard shortcuts to stylesheets anyway... however I'm currently baffled because I can't get this feature to work in QX 6.5 at all. Can anyone confirm that it has been discontinued? And what version of QX are you using? </p>
      <p>As Chuck says, InDesign has the eyedropper tool just like Illustrator; it has preferences (double click to ensure that the Paragraph Settings is checked), and it is contextual upon how (item, content, text) the target paragraph has been selected, although the paragraph styling will transfer if the text cursor is simply positioned within the target paragraph, much like that 'ol QX shortcut.</p>
    html_clean: |-
