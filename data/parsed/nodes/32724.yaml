    <p>I need help, otherwise I'll need a straight jacket.</p>
    <p>I'm sure all you Quark users have come to love the opt-shift and click shortcut to quickly apply a paragraph style from one paragraph to another (if you haven't you can have that one for free). I need to know if an equivalent exists in InDesign or am I destined to spend the rest of my life flicking little arrows up and down, or worse building a list of style sheets longer than the screen?</p>
    <p>Any help very gratefully received – very is such an understatement.</p>
    <p>Thanks</p>
    <p>Robert</p>
