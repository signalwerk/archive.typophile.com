  html: |-
    <p>I wrote a typography game for Android. Try how good you are at recongnizing fonts!<br>
    <a href="/wiki/https%3A/%252Fplay.google.com/store/apps/details%3Fid%3Dcom.filippomariapanelli.typefacesfree" class="freelinking" rel="nofollow">Get it on Google Play.</a></p>
    <p>The first typography game for Android is here!</p>
    <p>Test your ability to identify common fonts with three levels of difficulty.<br>
    You are shown a small piece of text formatted using one of many common fonts and you have to guess the right name of the font within 4 choices.</p>
    <p>At the end of the game you can see your correct and incorrect answers. If you answered one question incorrectly you can compare how the text looks like in the font you chose with the original text and learn the differences.</p>
