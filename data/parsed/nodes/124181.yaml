    html: |-
      <p>Your works on Behance look very good!</p>
      <p>&gt; fairly complex rendering<br>
      what do you mean by that?</p>
      <p>&gt; how do you ask for opinions?</p>
      <p>I try to gather your problem. Well, either you find people able for giving helpful critique – or you don’t. In the latter case: YOU are the designer. YOU make things happen. In the extreme, everything depends on your own insights and judgement. There’s no need to be afraid of that.<br>
      If there is a (pre-digital-era) typographic tradition for a script, this would be the starting point, naturally. If there is not, then the writing and lettering tradition/customs are the basis for your work. That is likely to be more difficult, but yet, more interesting as well. Ideally, you’d become a prolific scribe of that script before you turn to fontograph it. As for the graphic and aesthetic aspect of a typeface, good handwriting or manuscript sources are valuable references.<br>
      This is a very demanding task: you need to comprehend the system of the script and also the (technical) system of font/text processing/input etcª. Then you need to ‘map’ the script’s system onto the technical system, in order to make a proper rendering work. In any event of occuring difficulties just be creative.</p>
      <p>When you work on minority scripts for which you can’t find useful advice, then rely on yourself. Then you’ll be the pioneer who is going to enable the community of that script to use it in a new way, maybe in the way they didn’t even dare to dream of so far. </p>
      <p>If you face encoding-related problems you may contact the people of the <a href="http://www.linguistics.berkeley.edu/sei/index.html" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Script Encoding Initiative</a>, who helped a lot of ‘marginals’ in the recent past already.</p>
