    html: |-
      <p>Thank you, I'm glad you like it:) Out of curiosity, which script did you find the most interesting?</p>
      <p>Yes, I did learn to write the script first before making any of my fonts, and yes I do think it is an interesting challenge to make fonts for a script that anyone barely knows. But... Like, sometimes a native user said "the shape of this letters is not really legible", while I think it's still legible and I have a typographic background for it. I guess it would be better for me to hear a third opinion from a native user that also understand typography. But your words are truly encouraging, thank you. I'm more confident in my designs now.</p>
      <p>About the 'fairly complex rendering'... Compared to latin, where characters are put side by side, indic fonts has conjuncts that are triggered with certain combination of characters, reordering of diacritics, stacking ligatures, etc. This is fairly common in other scripts like Devanagari and Thai, but they are far better supported because they have many users and thus, standard technical/input system in fonts. There are no standards in Javanese or Buginese, I can't release any of my fonts because they can't be used for typing, although I'm currently working with someone to address that issue. Hopefully it will be usable for public soon.</p>
