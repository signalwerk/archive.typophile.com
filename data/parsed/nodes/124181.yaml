      <p>Thank you for the reply, Andreas<br>
      I too find it very worthwhile, I work mainly with traditional Indonesian scripts, namely Javanese, Balinese, Batak, Bugis, Sunda, and a couple ancient ones like Kawi and Pallava. Your welcome to view some of my works in <a href="https://www.behance.net/Alteaven">https://www.behance.net/Alteaven</a>, opinions are greatly appreciated.</p>
      <p>But the difficult thing about them is the technical rendering. These scripts have fairly complex rendering, with regular diacritic stacking and sorts. I guess it's no harder than other Indic scripts, but the number of people using it is so little that of lack technical support is expected and hindered the designing process. A handful of font that are able to do this script is still cumbersome and not supported by all system.</p>
      <p>And I also would like to know, in designing "marginal" scripts, how do you ask for opinions? For example, you know typography but you do not know the whole orthography for the script. Asking for opinion from the native users, they only comment on the incorrect orthographies (which is appreciated) but no constructive opinion for the typographic design. It's frustrating, because this is what happening to me, the market I'm targeting is not typographically conscious to be frank (squishing the fonts in photo editors, using psychedelic colors, gullible in calling every font good, and such).</p>
