    <p>Hello to anyone reading this.</p>
    <p>I primarily work with typographic design of the Javanese script, one of Indonesia's traditional script, here's an image in case you never saw it</p>
    <p> <img src="/sites/default/files/old-images/jawa font wulang sampel1 perbandingan_5582.jpg"></p>
    <p>It is a very marginal script, without official status anywhere and declining number of users despite it's long history. I was wondering if there are any other writing system with similar situations. I'd like to know how users of other marginal, non-latin script handle their typography. Though generally, I would like to know about the typography scene of other scripts other than Latin and Arab (since those two are the most prominent, is it?)</p>
    <p>This is my first post in typophile, so apologies if I made any mistake :)</p>
