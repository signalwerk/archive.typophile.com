      <p>Welcome, Aditya.<br>
      It’s a very worthwhile undertaking to care for “marginal” scripts. I think many people do, actually. It belongs to our collective heritage and so it is all the way worth of being promoted.<br>
      For myself, I have done Irish and Coptic, Runes, Gothic, Greek, Old Albanian and perhaps a few more strange things. Because it interests me.<br>
      I’m not informed about the situation for Javanese. But, since there’s a Unicode page for the script at hand, no one hinders you or anyone to make nice fonts for the script and to distribute it.<br>
      I hope you keep us up-to-date!</p>
