    <p></p><div class="imageWrap"><img src="http://typophile.com/files/view03_5227.jpg"></div><p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/face3_4047.png"></div><p></p>
    <p>This typeface is too condensed, and has too small an x-height, to be Ionic No. 5, at least if Bitstream News 701 is a faithful clone thereof.</p>
    <p>As well, I do not believe it to be Petit Mediaeval Clarendon; that was used by Cambridge University for some rather upscale Bibles.</p>
    <p>These samples are from - and so, if you have the actual book, you may well find a note on the typeface in it - the St. Joseph New Catholic Edition of the Confraternity-Douay translation of the Holy Bible, published by the Catholic Book Publishing Co. of New York.</p>
    <div class="field field-type-text field-field-solved">
          <div class="field-label">Font:&nbsp;</div>
        <div class="field-items">
                <div class="field-item odd">
                        Modern Antique Condensed (Lanston Monotype)        </div>
            </div>
    </div>
