      <p>It somewhat resembles the old Linotype Antique No. 3, the bolder face shown below what they refer to as the "De Vinne Series" in this image:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/8pt_dvs_an3_3551.jpg"></div><p></p>
      <p>Also, as somewhat similar, there is <a class="freelinking external" href="http://www.identifont.com/find?font=clarendon+book+condensed&amp;q=Go" rel="nofollow">Clarendon Book Condensed</a>.</p>
      <p>It's definitely not Petit Medieval Clarendon, as that is wider.</p>
      <p>And there's also Manfred Klein's <a class="freelinking external" href="http://moorstation.org/typoasis/designers/klein04/text02/roundslab.htm" rel="nofollow">RoundSlab Serif</a>.</p>
      <p>But notice that the face I'm trying to identify has <em>very</em> short descenders.</p>
      <p>And, from the old Lanston Monotype specimen, I've found something very close:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/76j_5058.jpg"></div><p></p>
      <p>The style called 76J seems condensed enough, and has short enough descenders, to be a match. But I'm not 100% sure it is the right typeface, as I can't tell for certain it's a Clarendon. Also, the target face has one other unusual characteristic: the stroke width on the capital letters is noticeably thicker than on the small letters.</p>
      <p>On further examination: 76J is a Clarendon, and it does have the other characteristic in 7, 8, and 12 point... but not 9 and 10 point. Since the book in question is in 8 point type, it's a match, I guess.</p>
      <p>By name, it's Modern Antique Condensed.</p>
