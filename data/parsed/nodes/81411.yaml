    date_raw: 21 Apr 2011 — 9:28am
    votes: null
    html: <p>It's a bit of a strange relationship, because the letter shapes are so different (e.g. Futura's splayed "M"), but Agha recognized the geometric qualities of Bodoni, e.g. the idea that its serifs could be considered as slab serifs. Bodoni is also quite reductive, in that it appears to have two stem widths, and no transition between them. Again, this was a fresh interpretation of the face, because Giambattista's fonts were far more nuanced than that, as can be seen in Postmodern revivals such as ITC Bodoni and Filosofia. And in comparison to the style of didone that had predominated throughout the 19th and early 20th century—the Scotch Modern, with its huge serifs (many hooked), ball terminals and furled forms—Bodoni is a very understated design.</p>
