      <p>Traditionally Bodoni was considered a good partner.</p>
      <p>The slab serif look of Beton (a sort of "Futura Slab Serif") is contemporary.<br>
      Memphis, for a larger x-height.<br>
      Candida, for more contrast, and a more traditional look suitable for extended text.</p>
      <p>These are all vintage faces, like Futura, from the early/mid 20th century.</p>
