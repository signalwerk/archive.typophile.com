    <p>For stock images, so far I only know Corbis, Getty images and Veer. These are great sources, but I would like to know which do you rely on when the project budget is really really low? Lets also say that the client would not appreciate any artsy stuff, they are total corporate stooges  and they want to play it safe. Its sad but its a living ... =)</p>
    <p>Thanks!</p>
