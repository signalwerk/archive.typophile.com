    <div class="info">Submitted by <a href="/user/108" title="View user profile.">Miss Tiffany</a> : 22.Nov.2005 11.17am </div>
      <p>For anyone interested and who does not already receive email from Barry McKay Rare books, The British Library have announced a reduced price sale — usually of 50% — sometime more. When you have finished cursing about the one’s you bought at the original price, you may be tempted to some of these listed below. Stocks are limited and therefore we must offer them subject to availability. Please order directly though us. If anyone is interested the should email me — wardle [at] typophile [dot] com — and I will forward the email on to you. It was quite long, so I didn’t want to jam it all in here.</p>
    <p> <a href="http://www.barrymckayrarebooks.com" title="www.barrymckayrarebooks.com">www.barrymckayrarebooks.com</a></p>
