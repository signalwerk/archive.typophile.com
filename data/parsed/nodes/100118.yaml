      <p><em>While some scholars see mercantilism as the earliest stage of capitalism, others argue that capitalism did not emerge until later.</em></p>
      <p>In either case, a useful distinction can still be made between mercantile capitalism (or proto-capitalism) and industrial capitalism. One is centred on a market of manufactured goods; the other is centred on a market of capital goods. The latter is formalised in the modern stock market system, in which it becomes the norm for the people who own shares in the means of manufacture to be completely uninvolved in the process of manufacture, even in a managerial role. When this model is applied to banking, it leads to the third phase: finance capitalism, which is centred on a market of debt.</p>
