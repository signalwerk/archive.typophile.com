      <p>Capitalisation is a convention, one that hopefully captures useful information from language that assists understanding. English capitalisation used to be pretty random, but useful in the sense that it indicated words that the writer thought Very Important. These days, capitalisation is governed by style guides, some of them called grammars because that sounds more impressive, but no less conventional for that.</p>
      <p>In this case, I think the meaning of the description of Le Bé is clarified by the lack of capitalisation. Consider, does the phrase 'Christian Hebrew typographer' refer, as intended, to a typographer of Hebrew text who happened to be a Christian, or to a typographer of something called Christian Hebrew. By not capitalising christian in this context, it is clear that the word is an adjective referring to 'Hebrew typographer', and not part of a proper noun.</p>
      <p>Generally, I like to restrict use of capitalisation to proper nouns, which is why I regularly offend people by writing of the Catholic churches and the protestant churches. Why? Because Catholic is part of the proper name of the institutions in question -- the Roman Catholic Church, the Chaldean Catholic Church, the Maronite Catholic Church, etc. --, whereas with &gt;34,000 independent protestant sects operating under a great diversity of names almost none of which actually include the word Protestant, it seems obvious to me that there is no such thing as Protestant as a proper noun except in very rare cases; protestant is an adjective, as is christian in the context of the comment about Le Bé, and catholic when referring to one of the four marks of the Church (the latter a proper noun in this case, to distinguish it from the church around the corner).</p>
      <p>Some people capitalise adjectives that they think are Important. But that's pretty Random.</p>
