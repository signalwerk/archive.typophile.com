      <p>There seems to be some confusion about this 'trading'… What Plantin bought were sets of matrices, eg the base needed for casting type (it is more complicated than stated here; the process could result in multiple matrices — Smeijers's Counterpunch is an enlightening book on this matter).</p>
      <p>The Enschedé story is similar: they acquired matrices from various sources during an extended period.</p>
