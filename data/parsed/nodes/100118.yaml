      <p>William,</p>
      <p>The production of standardized coinage began in Lydia in the seventh century BCE, by none other than King Croesus—hence the expression, “As rich as Croesus” (him having invented money and all). The actual means of production (hammering a planchet between two dies) didn’t change for two thousand years, give or take. Screw presses emerged around the Renaissance, but the process of minting didn’t become fully mechanized until James Watts’ steam engine was applied to the process in 1801—about the same time that virtually every other means of production amenable to steam power exploded…</p>
