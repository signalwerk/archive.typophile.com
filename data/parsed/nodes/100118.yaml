      <p>Very interesting numbers in the <a class="freelinking external" href="http://en.wikipedia.org/wiki/Printing_press#Mass_production_and_spread_of_printed_books" rel="nofollow">Wikipedia article on the printing press</a>:</p>
      <p>"By 1500, the printing presses in operation throughout Western Europe had already produced more than twenty million copies. In the following century, their output rose tenfold to an estimated 150 to 200 million copies.</p>
      <p>"European printing presses of around 1600 were capable of producing 3,600 impressions per workday. By comparison, movable type printing in the Far East, which did not know presses and was solely done by manually rubbing the back of the paper to the page, did not exceed an output of forty pages per day."</p>
      <p>This confirms my feeling that printing was mass production on a scale never seen in history. It was hand powered until the 19th century, but the specialization and mass production were similar to what energy-powered manufactures were, and must have been a model for it.</p>
