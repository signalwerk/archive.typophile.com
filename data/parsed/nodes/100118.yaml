      <p>William, the Arsenale in Venice was an earlier example of industrial production, an assembly line for boats.</p>
      <p>Kilns were an ancient form of industrial production, with bricks pressed in wooden forms being the uniform mass-produced object—although hand-turned amphorae were consistent in size and shape. </p>
      <p>Pottery perhaps preceded salt making in industrial production, as ceramic bowls were required to reduce the salt. Solnitsata, the oldest town in Europe, was founded on the production of salt 6,000 years ago. I don’t know whether there was a standard form for salt cake distribution, as there was later with the sugar loaf. </p>
      <p>And of course monetary coins were an early form of standardized industrial production.</p>
