      <p>Nick, the industrial capitalism phase of type making -- i.e. the period in which the means of type production are owned by people whose engagement in the enterprise is wholly financial and not enacted in labour -- didn't really come about until the 19th Century. In the 18th Century, one can see the end of the transition from the itinerant craft tradition of the renaissance and early baroque periods to that of foundries. One could say that the distinction is between the punchcutter travelling to the customer and the type travelling to the customer. But unlike, say, the introduction of mechanised weaving, the early foundries tended to be established by punchcutters, sometimes in partnership with publishers who had been their customers, or with other financial investment. So, for example, if you look at the Dutch punchcutters of the 18th Century, such as Fleischmann, you see him first working as a punchcutter for publishers and for other type founders, and then setting up his own type foundry.<br>
      _____</p>
      <p>Bill, how are you defining 'industrial production'? Is 'mass production' in itself a sufficient criterion, or is the method of production to be considered also? Or some ratio of the quantity of production to the quantity of labour?</p>
      <p>Setting type, even by hand, and printing books on a wooden handpress is surely more efficient than having scribes produce individual copies, but in terms of production it seems to me on a level with producing cloth on a handloom: more efficient than knitting, but not really industrial.</p>
