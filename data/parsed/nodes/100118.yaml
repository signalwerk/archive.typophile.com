    <p>I'm currently working on an essays about the christian Hebrew typographer named Guillaume Le Be from the 16th century, and i want to elaborate about the profession of type design and type foundries. As i understood, the first type designers were craftsmen, often jewelers who were commissioned to create the letters by the printers/publishers. Then, in some point in history, type foundries were created and supplied type for the printers.</p>
    <p>What i need is a good online source which i can cite and reference, dealing with this transition from sole craftsmanship to the commercial type foundry.</p>
