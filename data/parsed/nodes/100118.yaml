      <p>John (Q), you're quite right that the convention in most English usage is to preserve the capitalisation in words derived from proper names, with the caveat illustrated by Craig and Nick S that this only persists so long as the words remain commonly associated with the person. The personal association of many words diminishes over time, especially if the original name was foreign and unfamiliar to English speakers. It is akin to what can happen to trademark names if they become common parlance: how Kleenex becomes kleenex.</p>
      <p>T'other Nick pondered whether the failure to capitalise christian was some sort of atheistical gesture. I pointed out that, whatever the reason, in the context of the particular construction the lack of capitalisation avoided the ambiguity so often potential in English when a capitalised adjective is joined with a proper noun.</p>
    html_clean: |-
