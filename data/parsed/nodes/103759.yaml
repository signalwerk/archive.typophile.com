      <p>What Hrant said as well. It is worth bearing in mind that fonts have applications in numerous industries and that pure type design does not need to be the only path. Understanding and working with complimentary technologies and professions (typesetting, editorial design, web design, rendering environments, communication design) will often lead you back to working with fonts.</p>
      <p>If it makes you feel any better (it probably will not) I have a degree in literature and did not start working with fonts until my late twenties. Having this focus now and sticking with it should definitely lead you somewhere interesting!</p>
