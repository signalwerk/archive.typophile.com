      <p>Hi Lucy!</p>
      <p>Glad to see you using FontForge! :) Are you using GNU+Linux, Mac OS X, or Windows?</p>
      <p>The FontForge community has put together <a href="http://www.designwithfontforge.com" title="www.designwithfontforge.com">www.designwithfontforge.com</a> which is intended as a 'beginners guide' to both FontForge's UI and typeface design. There's also <a href="http://www.oert.org" title="www.oert.org">www.oert.org</a>, an open educational resource on type and typography. </p>
      <p>The type review boards on here and TypeDrawers are an amazing resource, and I suggest posting your work in progress there to get feedback. </p>
      <p>I also help put on type design workshops around the world - <a href="http://www.craftingtype.com" title="www.craftingtype.com">www.craftingtype.com</a> - and we're expecting do something in Spain this summer and something in London in September/October. You can follow @craftingtype or join the mailing list to get an update, or just keep an eye on the site. </p>
      <p>Cheers<br>
      Dave</p>
