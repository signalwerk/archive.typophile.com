      <p>If you are really interested in pursuing type design (as opposed to pure typography) I would recommend getting in touch with the <a class="freelinking external" href="http://www.reading.ac.uk/typography/" rel="nofollow">Department of Typography and Graphic Communication at the University of Reading</a>. Even if you are not likely to undertake post-graduate work at the moment they offer a <a class="freelinking external" href="http://www.reading.ac.uk/typography/Shortcourses/typ-shortcoursesTDi.aspx" rel="nofollow">summer programme</a> which might be perfect to give you the kind of focus you are looking for.</p>
      <p>There is a requirement for freelancers in this field but it is already populated by a large number of well established designers (many post here). That is not to say that you shouldn't put yourself out there in that respect but it may take some time to establish yourself. You could also do a lot worse than reaching out to UK based foundries and seeing if they will take you on as an intern. When jobs in the type industry do come up they are often posted here and on <a class="freelinking external" href="http://typedrawers.com/" rel="nofollow">TypeDrawers</a> and it is not uncommon for people to request work on this site (<a href="http://typophile.com/node/103704" title="http://typophile.com/node/103704">http://typophile.com/node/103704</a>).</p>
      <p>I hope that helps...</p>
