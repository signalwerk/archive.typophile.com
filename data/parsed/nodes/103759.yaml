    <p>Hello there ladies and gentlemen. I'm in an odd situation and would like some advice. </p>
    <p>I am about to graduate from Loughborough University with a degree in Graphic Communication. In my final year I developed a love of typography and would like to follow this as a career. I created a font in Fontforge, which you can find on DaFont (search for Tomb if you're interested and it's called Tomb2013). However,  I am not actually sure how to pursue a career in this field! It's the creation of working fonts that interests me most, rather than the kind that is typically more decorative that you might find on banners and posters. I'm more into the legible, workable, downloadable and easy to read fonts that use simplicity to portray emotion and a story etc. I hope you understand what I mean. </p>
    <p>I'm just totally lost as to how to start my career. Do I need to stay freelance? And if so, who on earth needs this kind of work doing? As far as I'm aware, most places just opt for a standard font that already exists. Is this completely wrong?</p>
    <p>Any help would be fabulous. I live in England in Northamptonshire, so if you know of any places around there (or anywhere in the UK, really) that you think would be good to contact then please let me know! I'm also unsure as to how my typography work will be received by a standard design agency (i.e. if they want an artworker). Although I'm capable of doing this, my portfolio is geared towards typography. Any tips? </p>
    <p>Sorry this is such a beastly long post :) Can you tell I'm confused/worried? Cheers!</p>
