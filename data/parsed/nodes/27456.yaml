    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Designers" class="freelinking" rel="nofollow">Designers</a> : Christian Acker</strong></p>
    <p>Christian Acker is a graphic and type designer based in <a href="/wiki/New%20York%20City" class="freelinking" rel="nofollow">New York City</a>.<br>
    Born 1979, Norwalk, CT, USA.</p>
    <p>Mr Acker is the founder of Adnauseum, Inc, a multi-disciplinary design studio found in the spring of 2002, and <a href="/wiki/Handselecta" class="freelinking" rel="nofollow">Handselecta</a>, a graffiti based type foundry, created in May of 2003. </p>
    <p>He is the designer of numerous display faces including 24 Hrs (2002, Cubanica), Sailor Gothic (2003, Cubanica), and numerous faces base upon the handstyles of contemporary graffiti artists released through his type foundry Handselecta. 2006 saw the release of Joker Straight Letter, Mene One Mexicali, Mesh One AOK, Meskyle Laid Back and Sabe Ghetto Gothic.</p>
    <p><a href="http://www.adnauseum.net" title="http://www.adnauseum.net">http://www.adnauseum.net</a><br>
    <a href="http://www.handselecta.com" title="http://www.handselecta.com">http://www.handselecta.com</a></p>
