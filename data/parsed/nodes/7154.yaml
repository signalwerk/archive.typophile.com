    html: <p>If you're targeting 12-17 year olds, aim at the 15-17 year olds and the younger ones will follow. Univers probably isn't the best choice, particularly if it has to carry the weight of the booklet's image. It's not a great font for lengthy running copy, but it's not as though you're setting the thing in an illegible novelty font. <br> <br>If you're set on Univers for the body, I'd definitely add some life with an interesting titling font. By the way, try out Univers 45 (light) for the body copy. With the right handling, I prefer it over 55 (regular). Without specifics on the content, I can't get more specific on the fonts.</p>
    html_clean: <p>If you're targeting 12-17 year olds, aim at the 15-17 year olds and the younger ones will follow. Univers probably isn't the best choice, particularly if it has to carry the weight of the booklet's image. It's not a great font for lengthy running copy, but it's not as though you're setting the thing in an illegible novelty font. <br> <br>If you're set on Univers for the body, I'd definitely add some life with an interesting titling font. By the way, try out Univers 45 (light) for the body copy. With the right handling, I prefer it over 55 (regular). Without specifics on the content, I can't get more specific on the fonts.</p>
