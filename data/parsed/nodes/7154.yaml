    html: <p>The following fonts are from small, independent designers and foundries, yet the quality is first class. Beware of settling for Univers. Save it for the annual report (or not). All of the following collections offer fonts that are at least as hip as Emigre (more in my opinion) and have less exposure.  <br> <br><a href="http://www.myfonts.com/fonts/typeco/trapper/" target="_blank">Trapper</a> - The printed samples look great with all caps in display and text set at 7pt. <br><a href="http://www.myfonts.com/fonts/typeco/chunkfeeder/" target="_blank">Chunkfeeder</a> - Another interesting display text combo. It really comes into it's own in the 5pt text size. <br> <br>Check out <a href="http://www.psyops.com/html/specimens.html" target="_blank">PSY/OPS</a> for interesting options in text. <br><a href="http://www.macrhino.com" target="_blank">Mac Rhino</a> has some fabulous stuff. <br>Peter Bruhn at <a href="http://www.fountain.nu" target="_blank">Fountain</a>. Awesome. Esp. Ketchupa + Mustardo + Mayo = Imbus package! <br>Nick Shinn's <a href="http://www.shinntype.com" target="_blank">Panoptica</a> <br> <br>Finally, check out the relaunched <a href="http://www.pampatype.com/English.html" target="_blank">PampaType</a>. Top drawer fonts from Argentina. Rayuela might just be the ticket, must have the Chocolate! <br> <br>Support the little guys!</p>
