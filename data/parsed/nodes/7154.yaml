    html: <p>There's nothing wrong with Univers per se, it's just that it might be a little too corporate/clean for this audience.  <br> <br>But if the booklet isn't too copy heavy (2-3 paragraphs per page), you could get away with Univers for body copy, pairing it with (as others have suggested) a more expressive headline face. <br> <br>You certainly wouldn't be the first to use Univers as a text face. Take a look at Wired magazine, which uses the regular and condensed versions for most of its body copy.</p>
