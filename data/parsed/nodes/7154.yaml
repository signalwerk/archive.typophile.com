    html: <p>Univers is not suitable for body copy, but your choices are endless. <br> <br>Have a look at CDs, computer games, and magazines targeted at teens. Most would not feature Univers.  <br> <br>Having said that, 12-17 year old males are as varied as any group. Good, attractive design should be your goal. (Although I'd probably steer clear of flowing calligraphy for this group.)</p>
