  html: "<p>Hi there peoples  <br> <br>I am pretty new to this site - but as i understand, you can get some really good feeback. <br> <br>Which is basically my reason for this post... <br> <br>The situation is like this : i am designing a 30 page booklet that is targeting 12 - 17 year old males. The problem that i face is - weather to use Univers for the main body copy and find a font that is quite expressive for the titles  <br>OR  <br>Should i just use univers for the whole booklet ?  <br> <br>I know that its not really good to mix and match typefaces but i feel / fear that the booklets type might look a bit stale - so to speak. <br> <br>When I say stale i mean the type becomes very percise and lacks the visual characteristics that help relate the subject content to the audience. <br> <br>Hopefully that makes sense to everyone. <br> <br>And hopefully you could give me some advice that might help me. <br> <br> <br>thanks heaps  <br>eye_mac</p>"
