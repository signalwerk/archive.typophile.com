    date_raw: 22 Nov 2005 — 5:27am
    votes: null
    html: "<p>You can type a lot of accented characters which are not normally accessible in OS X. Just enable the U.S. Extended keyboard layout using the International control panel in System Preferences. Instead of bullets, math symbols and such, it turns most of the option-key combinations into \"dead\" accent keys so you can enter, for example, opt-m followed by e to get ę (e with an ogonek). It helps to have the Keyboard Viewer open so you can see which keys to type to get different accents. (Note: It doesn't work for every possible accent/character combo--they have to be combinations that exist in Unicode. Also, not all (or even mosts) fonts have all those characters.)</p>"
    html_clean: "<p>You can type a lot of accented characters which are not normally accessible in OS X. Just enable the U.S. Extended keyboard layout using the International control panel in System Preferences. Instead of bullets, math symbols and such, it turns most of the option-key combinations into \"dead\" accent keys so you can enter, for example, opt-m followed by e to get ę (e with an ogonek). It helps to have the Keyboard Viewer open so you can see which keys to type to get different accents. (Note: It doesn't work for every possible accent/character combo--they have to be combinations that exist in Unicode. Also, not all (or even mosts) fonts have all those characters.)</p>"
