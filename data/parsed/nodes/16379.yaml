  html: |-
    <p>So I was bored on my train ride out of NYC the other day so I busted out my PowerBook and opened up Font Explorer. I proceeded to check out the character map for some of my typefaces and stumbled upon tons of extra glyphs (dingbats?) that I had not known about. This was kind of sparked by my current wallpaper created with Underware's Sauna and an included dingbat: <a href="http://veer.com/download/wallpaper/relax1440x900.jpg" title="http://veer.com/download/wallpaper/relax1440x900.jpg">http://veer.com/download/wallpaper/relax1440x900.jpg</a></p>
    <p>I'm curious, because the only alternates I know are holding the option key to access other included glyphs/marks. Essentially is there a way to find out the key commands that trigger these glyphs? if that IS in fact how its done? Thanks!</p>
  html_clean: |-
