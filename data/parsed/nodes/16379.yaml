    html: |-
      <p>You can also use Unicode Hex Input. You just hold down the option key while typing the four Unicode hex digits. Here's the four playing card suits entered using this method: ♣♦♥♠ </p>
      <p>Windows has something similar to this and it's the only way to enter some characters we take for granted being able to type on the Mac (like proper quote marks). The drawback is that you have to know or look up the codes.</p>
      <p>More about all this stuff here:</p>
      <p>&nbsp;&nbsp;&nbsp;<a href="http://tlt.its.psu.edu/suggestions/international/keyboards/mackey.html" rel="nofollow">http://tlt.its.psu.edu/suggestions/international/keyboards/mackey.html</a></p>
    html_clean: |-
