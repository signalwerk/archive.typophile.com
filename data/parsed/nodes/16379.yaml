      <p>If you are stuck with Quark and you need to use the extended glyphs, you can use a font editor to create a copy of the font you need with the glyphs moved to keyboard-accessible positions.</p>
      <p>I've used TypeTool to make greek upper and lower case versions of fonts I use.</p>
      <p>(Perhaps I should add that I do not distribute the resultant fonts; printers get a PDF with subset embedding only.)</p>
