    html: <p>The problem with OpenType fonts whose character sets exceed the 256 positions  that were available with ASCII-encoding, is that there simply are not enough key combinations to access them all. So there is no "easy" way apart from selecting them through the aforementionned methods.</p>
    html_clean: <p>The problem with OpenType fonts whose character sets exceed the 256 positions  that were available with ASCII-encoding, is that there simply are not enough key combinations to access them all. So there is no "easy" way apart from selecting them through the aforementionned methods.</p>
  - id: 96665
