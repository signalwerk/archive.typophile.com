    html: <p>"What the traffic will bear" as opposed to "how hungry are you" is a worldwide measure of what to charge. If you want to first look at a comparison of GNP and average earnings per capita, you can probably figure a sliding scale per country. Some places are tough to figure because of great disparity in wealth from one person to the next.  In the USA, there is a great disparity so what you charge a neighborhood shop keeper is not what you charge a mega-corporation (if they will even talk to you).  Truthfully, your reputation must precede you to get connected to those who can pay the higher rates.  I think James is right when he says expenses vs livable income.  A college professor in design who has a tenured position and freelances can afford to charge less because he knows his bills are paid.  For the same reason, he can charge more for jobs or clients that don't interest him. Either way, when someone is not hungry, they can pick and choose.  I have seen well known design firms do pro bono work because it interests them.</p>
    html_clean: <p>"What the traffic will bear" as opposed to "how hungry are you" is a worldwide measure of what to charge. If you want to first look at a comparison of GNP and average earnings per capita, you can probably figure a sliding scale per country. Some places are tough to figure because of great disparity in wealth from one person to the next.  In the USA, there is a great disparity so what you charge a neighborhood shop keeper is not what you charge a mega-corporation (if they will even talk to you).  Truthfully, your reputation must precede you to get connected to those who can pay the higher rates.  I think James is right when he says expenses vs livable income.  A college professor in design who has a tenured position and freelances can afford to charge less because he knows his bills are paid.  For the same reason, he can charge more for jobs or clients that don't interest him. Either way, when someone is not hungry, they can pick and choose.  I have seen well known design firms do pro bono work because it interests them.</p>
