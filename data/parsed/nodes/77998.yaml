      <p>While a small item on your homepage, I notice you do books. In the States, rates vary according to the kind of book. Design &amp; production supervision for a museum catalog for a prestigious museum can run $20,000. On the other hand, design, with no production supervision, for a scholarly monograph interior runs about $700, with a like amount for the jacket.</p>
      <p>As far as hourly rates go, our shop charges $60/hr for things not done on a unit basis (most are unit prices). We will only work for a press that has an editorial dept, and handles their own production. My wife's shop, which specializes in more hand-holding (i.e., they will arrange for editorial services, and handle all production), charges $75/hr.</p>
      <p>In short, I think your question is too broad. As with anything, one charges what the market will bear, constrained by costs. If your prices are high, some folks will look elsewhere. No argument, or citation of rates others charge will change their mind. But if you have enough work, somebody is obviously willing to pay your prices.</p>
