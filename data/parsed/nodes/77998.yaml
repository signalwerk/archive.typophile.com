      <p>IMO, serious web/graphic... any designer must have a couple "fixed", stable and serious clients, clients that you'll work with for long term relationships and, for example, if you have 5 clients, you can expect that you'll have at least one job per month from then. </p>
      <p>Under this way of working, there are a lot of subquestions that can be asked... but I found that one as the best way I personally work and so far it gets me more jobs and people made a trust in me as a part of their company even I'm freelancing. Even I get a nice bonuses from time to time. Both way trust and catchy communication is the key where I'll put my energy to do my job the best, to be as much as original as it can be, to make a client feel like I'm really (and I am) always there for them, even they don't have a money to pay me in that moment....</p>
      <p>Look on clients as a girls, try to impress them, to take care of them and they'll show you what they can do for you. But you have to build experience to find a good and right people to work with, otherwise you'll end up naive.</p>
      <p>I know this sounds like some guide or religious preaching... but in my case, this gets me, on monthly bases, more and more jobs and I can keep the run with tempo of new projects.</p>
      <p>Frode, when I say "you", I don't mean on you personally. ;)</p>
