      <p>Price is what you can convince someone to pay, not what you think you are worth. The *right* price is the one where both you and your customer are happy with the transaction and want to do it again. </p>
      <p>Most designers sell themselves short by a long shot — they're great at creating value, horrible at capturing that value. The world is full if talented designers who are terrible business people, pricing themselves by what their expenses are (or worse, by what they 'deserve'). Some designers even feel guilty charging for their work. This is the difference between designers and business people. Business people do not feel guilty when they close a great deal, they look for a bigger deal.</p>
