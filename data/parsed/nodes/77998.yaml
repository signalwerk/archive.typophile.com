      <p>&gt; Here in New York the rates seem to run from $10 to $150 per hour</p>
      <p>I think everywhere the rates can vary wildly. In my area (Ohio) I know some freelancers working for $30 or $40 an hour, some more-experienced designers and small design firms charging around $75-100, and some big firms charging considerably more.</p>
      <p>A lot depends on your clients, of course. If your clients are little neighborhood shops they won't be able to afford the rates you could charge big corporate clients.</p>
      <p>I think that in today's economy many designers have been lowering their prices to get work, although they don't like to admit it.</p>
