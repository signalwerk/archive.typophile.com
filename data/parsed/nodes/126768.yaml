    html: '<p>Just a guess regarding the unusable fonts: If you are trying to recover rather old Mac fonts, the actual font data used to be stored in the <a href="https://en.wikipedia.org/wiki/Resource_fork">resource forks</a> of files in Classic Mac OS. You could try accessing this data by using "ditto --rsrc-fork" when recovering from your backups.</p>'
