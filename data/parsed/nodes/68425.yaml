      <p>I just came across another effort to use some of this typeface done by Garrett Boge and Paul Shaw for LetterPerfect/Monotype. See <a class="freelinking external" href="http://www.fontshop.com/fonts/singles/monotype/stockholm_std_regular/?&amp;sample_text=NICOLE%20%26%20RYAN%20SOUP&amp;update=0">Stockholm</a>. It's not identical to the sample, but you can see the influence of the Forsberg designs.</p>
      <p>- Mike Yanega</p>
