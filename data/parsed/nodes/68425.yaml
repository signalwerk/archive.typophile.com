      <p>Stefan, thanks for the background on the typeface. I agree it's a shame that the version available is not a quality commercial version, but I do not know of anything better at this time. Do you? According to Grant Hutchinson, who used to run Image Club before he helped start Veer, they dropped a number of their old Letterpress collection fonts, including Carolus Roman, because their digitizations were too poor quality for then current standards. I think the version on Dafont is a revival of the design, because I don't believe it is even as good as the Image Club version (which I have).</p>
      <p>- Mike Yanega</p>
