      <p>Carolus was originally made in 1953 by the Swedish type designer Karl-Erik Forsberg and released by "Berlingska stilgjuteriet i Lund". He was a gifted calligrapher and over the years he made some hundred hand drawn book covers apart form designing typefaces.</p>
      <p>It's a pain to see that someone just ripped it off and put it up on "Dafont".</p>
      <p>More info here;<br>
      <a href="http://en.wikipedia.org/wiki/Karl-Erik_Forsberg" title="http://en.wikipedia.org/wiki/Karl-Erik_Forsberg">http://en.wikipedia.org/wiki/Karl-Erik_Forsberg</a></p>
      <p>Cheers<br>
      /Stefan H</p>
