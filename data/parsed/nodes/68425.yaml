      <p>Stefan</p>
      <p>There is a full character set in Lindegren's ABC collection should you need a good reproduction. Boge/Shaw's version is very different but still based on Forsberg's work... heavier and different character interpretation.</p>
      <p>When I was in Stockholm I was overjoyed at the residual influence of this mans "monumental" talent.</p>
