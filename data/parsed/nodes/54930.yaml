    <p>I usually use Google to find old Typophile threads, but lately I've been getting really poor results. For example, doing a search with<br>
    <code>site:typophile.com flash player text engine</code><br>
    only returns *one* result -- this one <a href="http://typophile.com/node/29359?page=8" title="http://typophile.com/node/29359?page=8">http://typophile.com/node/29359?page=8</a> -- which is actually quite inaccurate. I was obviously expecting more results, and at least this page (<a href="http://typophile.com/node/45368" title="http://typophile.com/node/45368">http://typophile.com/node/45368</a>) on the list.</p>
    <p>Is anyone been having a similar experience? Is this a Google glitch or a Typophile issue?</p>
