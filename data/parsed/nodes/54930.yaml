      <p>Yes, I’m very annoyed, too.</p>
      <p>The site search (with Grant’s favelet or without) used to work like charm and brought up all relevant entries, no matter if they were added only half an hour ago or dating back to 2003.</p>
      <p>Recently, all I usually get is links to paged listings, like some user’s tracking pages.<br>
      Also, hits are listed with nothing but their non-speaking url, i.e. without title or description.<br>
      In my opinion, feed entries (urls containing ‘crss’) shouldn’t be indexed. I want the real thing, not the feed of it.</p>
      <p>Just 2 examples for queries that have delivered a couple of dozens hits before, and now hardly a single useful one. At least one of them actually has a Wiki entry (which can’t be found):</p>
      <p><a href="http://www.google.com/search?q=site:typophile.com%20unica" rel="nofollow">Unica</a> [<a href="http://florian.hardwig.com/public/typophile/google-unica.png" rel="nofollow">my results</a>]</p>
      <p><a href="http://www.google.com/search?q=site:typophile.com%20featured%20face" rel="nofollow">Featured Face</a> [<a href="http://florian.hardwig.com/public/typophile/google-ff.png" rel="nofollow">my results</a>]</p>
      <p>Furthermore, it seems Typophile has no proper 404 page, at least not for URLs of this scheme: <a href="http://www.typophile.com/node/nonsense" rel="nofollow">http://www.typophile.com/node/<em>nonsense</em></a>. That link would take me to a wild potpourri of random posts and blog entries.</p>
