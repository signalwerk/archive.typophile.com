    html: |-
      <p>As originally developed, didones were size-specific (as indeed were all styles at the time), and that is the key to their sophistication: their delicacy is fine-tuned to each size, with purposefully small leeway for error in printing. If that takes higher quality, more time-consuming press-work, it may indeed be expensive and hence upscale, bourgeois and aristocratic, but ﬁne printing is not per se class-speciﬁc, it is the direction in which technology marches..</p>
      <p>If anything, didones were over-sophisticated, as remarked by Richard Austin in his Imperial Foundry specimen of 1819:</p>
      <blockquote><p>“The modern ... printing type at present in use was introduced by the French, about twenty years ago: the old shaped letters being capable of some improvement, it was judged expedient to re-model the alphabet to render them more agreeable to the improved state of printing…”</p></blockquote>
      <p>He went on to address the issue of fragility:</p>
      <blockquote><p>“…for how can it be expected that types cut nearly as thin as the edge of a razor can retain their form for any reasonable length of time, either to produce good work, or remunerate the Printer for his labour?</p></blockquote>
      <blockquote><p>“The hair lines being now below the surface of the main strokes of the letters, the Printer, in order to get an impression of all parts of the face, is obliged to use a softer backing, and additional pressure. This … militates against all good printing; for in forcing the paper down to meet the depressed part of the face, it at the same time takes off the impression of part of the sides, as is evident from the ragged appearance of printing from such types.”</p></blockquote>
      <p>Surely the difﬁculty in printing such types properly, and the complexity of their construction (with varying height of different glyph parts, according to their degree of delicacy) constitutes a sophisticated, i.e. complex, design?</p>
      <p>The didone style was developed for ﬁne letterpress typography, and subsequently adapted for more general job work and other technologies, in which it does not sit quite so easily. It’s difﬁcult to work with, but not impossible. No risk, no reward.</p>
