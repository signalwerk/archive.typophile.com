  html: <p>I've been looking to try out walbaum in an editorial project for some time but still am unsure of its suitability as body copy? I usually go for the safer options of minion pro, sabon or caslon but have been meaning to try out this beautiful typeface. For arguments sake the type size would range from 8pt to 12pt. I hope someone can give me good advice, thanks.</p>
