      <p>Nick, bourgeois and aristocratic are not the same; the former is all pretense. And just because something is more difficult to work with does not make it more functional. The other thing -which Bert alludes to- is that style is appreciable in proportion to size; a Didone is less of a Didone the smaller you get, and below a certain threshold is not a Didone at all.</p>
      <p>Héctor: Of course. In fact there's no such thing as "highest possible legibility". But a designer needs to know what he's breaking, how and why. For example in Patria I've made the "s" (among other glyphs) too wide in terms of what I think is optimal readability, but I did so to promote a certain style. That's not the same saying "I made it wide coz I like it and that's all that matters."</p>
      <p>hhp</p>
