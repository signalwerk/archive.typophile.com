      <p>Hrant: <em>...a Didone is less of a Didone the smaller you get, and below a certain threshold is not a Didone at all.</em></p>
      <p>I disagree. I have original 18th and 19th Century books in small size Didot types, and they are unmistakably Didone style. I think you are making the mistake of assuming that Didones are characterised by high contrast between hairline and main stems, but that characteristic is itself a function of size derived from a particular construction. The whole point of a Didone is that the hairline weight remains fairly constant independent of size, while the main stem weight varies according to size. So of course smaller sizes have lower contrast, <em>but that is precisely because they are Didones.</em></p>
    html_clean: |-
