      <p>Indeed.<br>
      In the early 1990s, I achieved optical scaling in didone setting by mixing Bauer Bodoni at display and deck size with the sturdier Bauer Bodoni for body text. Later, in 2008, I published Scotch Modern, with several “optical” sizes.</p>
      <p>However, the most impressive digital didone must surely be Hoefler’s Didot of 1991, for Fabien Baron at <em>Harper’s Bazaar</em>. Here it is still going strong 20 years later, leveraging the “constant hairline” property in mixed-size display setting, which is a key element of the magazine’s design:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Lady-Gaga-Harpers-Bazaar-October-2011_4960.jpg"></div><p></p>
