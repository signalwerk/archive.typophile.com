  html: |-
    <p>Does anyone know if there's some version of Uniscribe that turns on locl for Latin scripts?</p>
    <p>I'm aware that InDesign CS3 does this on its own, and that the pango renderer (on Linux) also turns it on since version 1.17. Does anyone know anything else that supports it?</p>
