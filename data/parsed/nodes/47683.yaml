    html: |-
      <p>If you mean just applying 'locl' feature, Uniscribe shipped with Vista and Office2007 do this for every script, not only Latin. But there is a catch, it applies 'locl' to default language system.</p>
      <p>If you are asking about shaping with custom language (other than default), this Uniscribe version also provides new set of APIs allowing to apply client-supplied language tag. </p>
      <p>Thanks,<br>
      Sergey</p>
