  html: |-
    <p>Ticketbook family is insipired by movie poster information, which is usually set in Helvetica or Univers Compressed/Ultra Light.</p>
    <p>I decided to make a family of seven weights for this type of use. With optical weight adjustment, you can set smaller point size text below larger one, and use heavier variant to compensate for the reduction in size.</p>
    <p>Now available from MyFonts.</p>
    <p>Here's a sample:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/Ticketbook1_5849.png"></div><p></p>
