      <p>Aldus and Palatino served two different purposes, but it is an example.</p>
      <p>Optima and Optima Nova is an example of a 50+ year revisit, augmentation, expansion and adjustment for technology. And OH what a revision! He added titling as well as condensed faces. In the calligraphic field we would refer to it as a master stroke of genius.<br>
      Michael</p>
