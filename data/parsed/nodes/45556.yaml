    <p>Hi again everyone,</p>
    <p>i am looking at the way old typefaces have been tweaked to form new, revised versions of themselves, by either varying their x-heights or contrasts etc. I am also interested to find out what typefaces have been influenced by older typefaces in that they look very similiar to the old one but are not part of it. </p>
    <p>Can anyone share some examples of type that has been tweaked?<br>
    many thanx !</p>
