      <p>Stephen, you are too kind. Sentico is so obviously appropriated from Klavika.</p>
      <p>Some of the DTP types are another matter entirely, as they combine shapes and letters from a variety of existing faces, seemingly to mask their derivative basis. At best, these might be called collages. </p>
      <p>Your question opens a <a class="freelinking external" href="http://typophile.com/node/45435" rel="nofollow">familiar can of worms.</a></p>
