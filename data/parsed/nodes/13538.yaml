    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/17745" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Designers</a>&nbsp;: William Addison&nbsp;Dwiggins</strong></p>
    <p>1880–1956<br>
    American</p>
    <p>William Addison Dwiggins was an accomplished type designer, illustrator, and graphic designer (he even invented the term <a href="/node/add/wiki?edit%5Btitle%5D=Graphic%20Design" title="Create node &quot;Graphic Design&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Graphic Design</a>!).</p>
    <p>At the turn of the century, Dwiggins went to Chicago to study at the <a href="/node/add/wiki?edit%5Btitle%5D=Frank%20Holmes%20School%20of%20Illustration" title="Create node &quot;Frank Holmes School of Illustration&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Frank Holmes School of Illustration</a>, where he was one of <a href="/node/add/wiki?edit%5Btitle%5D=Frederic%20Goudy" title="Create node &quot;Frederic Goudy&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Frederic Goudy</a>’s first&nbsp;pupils.</p>
    <p>In 1927, his famous book <a href="/node/add/wiki?edit%5Btitle%5D=Layout%20in%20Advertising" title="Create node &quot;Layout in Advertising&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Layout in Advertising</a> was published. He was one of design’s first critical voices. One of his common critiques was that type foundries were not making type that was appropriate enough. He disliked European moderns, like <a href="/node/12494" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Futura</a>, <a href="/node/13674" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Kabel</a>, and <a href="/node/13675" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Erbar</a>. <a href="/node/13676" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Mergenthaler Linotype</a> charged him to do better, and he did, creating <a href="/node/13654" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Metro</a>, his first&nbsp;typeface.</p>
    <p>He would go on to work with <a href="/node/13377" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Chauncey H. Griffith</a> at Mergenthaler Linotype to create <a href="/node/13652" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Electra</a> and <a href="/node/13650" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Caledonia</a>, as well as several other designs that unfortunately were not&nbsp;published.</p>
    <p>Typefaces designed by William Addison Dwiggins, including his experiments. The dates shown reflect the time period in which <span class="caps">WAD</span> worked on that experimental&nbsp;number:</p>
    <p><a href="/node/13654" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Metro</a> - Drawings and dates needed.<br><a href="/node/13652" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Electra</a>, Exp #55, 12/1/30 – 5/25/39<br><a href="/node/13655" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Caravan</a>/Florets, 7/19/39 – 2/6/41<br><a href="/node/13650" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Caledonia</a>, Exp #78, 2/2/37 – 10/25/48<br>
    Charter, Exp #222, 3/5/37 – 5/11/42<br>
    Newsface, Exp #223, 8/26/38 – 3/20/43<br>
    Falcon, Exp #249, 3/13/39 – 7/18/44<br>
    Falcon, Exp #266, 7/18/42 – 7/18/44<br>
    Winchester, Exp #264, 1/8/42 – 7/28/42<br>
    Winchester, Exp #264A, 1/28/42 – 5/25/42<br>
    Winchester, Exp #287, 2/25/44 – 2/1/48<br>
    Arcadia, Exp #265, 1/26/42 – 8/18/42<br>
    Arcadia, Exp #287, 6/23/43 – 4/7/45<br><a href="/node/13644" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Eldorado</a>, Exp 269, 2/3/42 – 7/2/45<br>
    Tippecanoe, Exp #268, 3/18/42 – 12/3/42<br>
    Tippecanoe, Exp #283, 12/8/42 – 7/18/45<br>
    (Times Roman), Exp #267, 7/29/42 – 4/2/45<br>
    Stuyvesant, Exp #274, 8/4/42 – 4/11/45<br>
    (Cheltenham), Exp #289, 1/15/44 – 9/19/46<br>
    Greek faces/Argo, 7/10/45<br>
    Greek faces/Stentos,	7/13/45<br>
    Greekfaces/Jason, 9/12/45<br>
    Adventure, Exp #288, 11/29/45 – 7/29/46<br>
    Alexandria,&nbsp;7/24/1946</p>
