    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Designers" class="freelinking" rel="nofollow">Designers</a> : William Addison Dwiggins</strong></p>
    <p>1880–1956<br>
    American</p>
    <p>William Addison Dwiggins was an accomplished type designer, illustrator, and graphic designer (he even invented the term <a href="/wiki/Graphic%20Design" class="freelinking" rel="nofollow">Graphic Design</a>!).</p>
    <p>At the turn of the century, Dwiggins went to Chicago to study at the <a href="/wiki/Frank%20Holmes%20School%20of%20Illustration" class="freelinking" rel="nofollow">Frank Holmes School of Illustration</a>, where he was one of <a href="/wiki/Frederic%20Goudy" class="freelinking" rel="nofollow">Frederic Goudy</a>'s first pupils.</p>
    <p>In 1927, his famous book <a href="/wiki/Layout%20in%20Advertising" class="freelinking" rel="nofollow">Layout in Advertising</a> was published. He was one of design's first critical voices. One of his common critiques was that type foundries were not making type that was appropriate enough. He disliked European moderns, like <a href="/wiki/Futura" class="freelinking" rel="nofollow">Futura</a>, <a href="/wiki/Kabel" class="freelinking" rel="nofollow">Kabel</a>, and <a href="/wiki/Erbar" class="freelinking" rel="nofollow">Erbar</a>. <a href="/wiki/Mergenthaler%20Linotype" class="freelinking" rel="nofollow">Mergenthaler Linotype</a> charged him to do better, and he did, creating <a href="/wiki/Metro" class="freelinking" rel="nofollow">Metro</a>, his first typeface.</p>
    <p>He would go on to work with <a href="/wiki/Chauncey%20H.%20Griffith" class="freelinking" rel="nofollow">Chauncey H. Griffith</a> at Mergenthaler Linotype to create <a href="/wiki/Electra" class="freelinking" rel="nofollow">Electra</a> and <a href="/wiki/Caledonia" class="freelinking" rel="nofollow">Caledonia</a>, as well as several other designs that unfortunately were not published.</p>
    <p>Typefaces designed by William Addison Dwiggins, including his experiments. The dates shown reflect the time period in which WAD worked on that experimental number:</p>
    <p><a href="/wiki/Metro" class="freelinking" rel="nofollow">Metro</a> - Drawings and dates needed.<br>
    <a href="/wiki/Electra" class="freelinking" rel="nofollow">Electra</a>, Exp #55, 12/1/30 – 5/25/39<br>
    <a href="/wiki/Caravan" class="freelinking" rel="nofollow">Caravan</a>/Florets, 7/19/39 – 2/6/41<br>
    <a href="/wiki/Caledonia" class="freelinking" rel="nofollow">Caledonia</a>, Exp #78, 2/2/37 – 10/25/48<br>
    Charter, Exp #222, 3/5/37 – 5/11/42<br>
    Newsface, Exp #223, 8/26/38 – 3/20/43<br>
    Falcon, Exp #249, 3/13/39 – 7/18/44<br>
    Falcon, Exp #266, 7/18/42 – 7/18/44<br>
    Winchester, Exp #264, 1/8/42 – 7/28/42<br>
    Winchester, Exp #264A, 1/28/42 – 5/25/42<br>
    Winchester, Exp #287, 2/25/44 – 2/1/48<br>
    Arcadia, Exp #265, 1/26/42 – 8/18/42<br>
    Arcadia, Exp #287, 6/23/43 – 4/7/45<br>
    <a href="/wiki/Eldorado" class="freelinking" rel="nofollow">Eldorado</a>, Exp 269, 2/3/42 – 7/2/45<br>
    Tippecanoe, Exp #268, 3/18/42 – 12/3/42<br>
    Tippecanoe, Exp #283, 12/8/42 – 7/18/45<br>
    (Times Roman), Exp #267, 7/29/42 – 4/2/45<br>
    Stuyvesant, Exp #274, 8/4/42 – 4/11/45<br>
    (Cheltenham), Exp #289, 1/15/44 – 9/19/46<br>
    Greek faces/Argo, 7/10/45<br>
    Greek faces/Stentos,	7/13/45<br>
    Greekfaces/Jason, 9/12/45<br>
    Adventure, Exp #288, 11/29/45 – 7/29/46<br>
    Alexandria, 7/24/1946</p>
