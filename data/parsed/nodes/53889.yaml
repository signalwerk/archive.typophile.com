      <p>We don't really do that here.</p>
      <p>I just found them based on info in your post, and a little creative research on Google, but I don't have the conscience to share the link. Sorry.</p>
      <p>Do you have the rights to use them? Has Tesco given you permission to download them?</p>
      <p>They are nice, but they are unmistakeably proprietary, and should the wrong eyes see them on non-Tesco work, you may regret having ever gotten them... </p>
      <p><strong>From DaltonMaag, on the Tesco font</strong>:<br>
      <em>Created exclusively for the client, this product is not available to buy or license. Dalton Maag can help you with your own custom font or with a customization of an existing typeface.</em></p>
