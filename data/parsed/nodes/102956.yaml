      <p><em>3. I also suspect that the real origins of em could be found not in English sources, but rather in other ones: espesially in old Italian and French, maybe German and even medieval Latin.</em></p>
      <p>On what basis do you suspect that?</p>
      <p>'Em' and 'en' are simply the pronounced names of the letters M and N in English, associatively adapted to describe the dimensions of type. As Frank Blokland's article indicates, earlier sources use 'm' and 'n' or (Moxon) 'm Quadrat' and 'n Quadrat'.</p>
      <p>The first recorded English use of the term 'em' in the context of typesetting and printing, according to the OED (1st edition), is 1864, in a newspaper article about printers' union rate demands 'per thousand ems'. The OED definition notes that 'The em of pica is the standard', i.e. unless otherwise specified an em is presumed to be 12pt.</p>
