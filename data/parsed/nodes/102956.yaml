      <p>There is a glossary in Huib van Krimpen’s ‘Boek’ with the equivalents/translations of graphic arts terms in English, Dutch, German and French. He only mentions ‘em quad’ and ‘en quad’:</p>
      <p>em quad = vierkantje = Geviert = cadratin<br>
      en quad = pasje = Halbgeviert = demi-cadratin</p>
      <p>Van Krimpen being the authority in my country, it is a fair assumption that in the Low Countries ‘em’ and ‘en’ have never been recognized terms up to the moment the dtp-revolution happened.</p>
