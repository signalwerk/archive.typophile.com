      <p>Em is certainly associative rather than strictly descriptive. The actual dimensions of a piece of metal carrying an uppercase M would vary depending on the typeface, but it tended to be roughly square; similarly, the N sort would seldom be exactly half the width of the M, but en became the name for half an em.</p>
      <p>I can't say when it originated, but I do note that neither em nor en are used in William Savage's <em>A dictionary of the art of printing</em>, 1841.</p>
