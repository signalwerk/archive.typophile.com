      <p>Although neither Wikipedia, nor its external web reference on the term, were helpful, a slightly later Google result has the Random House dictionary claiming the term originated in the period 1870-1875. (That could instead have been the date of the origin of the term "mutton-quad" as an equivalent - I found an 1871 reference for that.)</p>
      <p>However, from Google Books, I find that one of the editors at "Notes and Queries" used Em Quad as his <em>nom de plume</em> in 1857.</p>
      <p>And then I found an even earlier occurrence. An almanac for the year 1686 referred to William Penn as "Lord Penn", the Kalendarium Pentsilvaniense, and the governing council commanded him to use "a well-inked three-em quad" to blot out the offending phrase - although it's possible the recent sources for this have changed the story.</p>
