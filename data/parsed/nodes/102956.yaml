      <p>Interesting. Prompted me to reach for my old 1932 edition of <cite>What a Compositor Should Know</cite> by a certain W. H. Slater.</p>
      <p>Mr. Slater goes to some length to detail <em>The Story of the Point System</em> and the Pica Em in particular, from Fournier the younger to the Chicago fire, but fails completely to deal with the origins of the term <em>em</em> or <em>en</em>.</p>
      <p>I'm with the notion of corruptions of <em>nut</em> and <em>mutton</em>. The old guy I was apprenticed to in the 60s (and others I worked with of his generation), would tend to use the terms nut and mutton at least as much, if not more than en and em.</p>
      <p>Of course, that just begs the question why nut and mutton? and so doesn't help a great deal.</p>
