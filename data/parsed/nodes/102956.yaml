      <p>There is some confusion about ems in relation to ‘squares’ (in Dutch: vierkantjes). A square is a blank (space) with a width equal to its physical height. Eg for type size 11 cast on 12 the square would be 12 by 12. For type size 10 cast on 10: 10 by 10, etc.  We are talking about lead, of course (with antimony and other stuff in lesser quantities)</p>
      <p>A square divided by two would be a half (in Dutch: halfje). There were also blanks in the sizes of a third and a fourth plus a thinner measure called a ‘thin one’ (dunnetje, in most cases with a width of a point or so — these tended to be very rare and were often hoarded in secret stashes to be used in spacing caps headers). </p>
      <p>In art school we would use the measures of half and lower for spaces, and square for inset. Don’t know if this was an industrial practice, but the advantage was that one could pilfer other cases of type for these if there were not enough in the one you were using.</p>
      <p>We never spoke of or used ‘ems’ and ‘ens’; that is, to my mind, something of the digital age and mostly associated with web design.</p>
      <p>(As insiders can tell, I used to be — and still am — an advocate of unjustified setting.)</p>
      <p>Nowadays, in digital typesetting, one would use the measure of the line feed for inset.</p>
      <p>Please correct me if I am off — it has been 35 years.</p>
