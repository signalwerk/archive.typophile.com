    <p>First of all, sorry for my bad English; I’m not a native speaker.</p>
    <p>I look for historical information about origins of the term <em>em</em> (typographic unit of measurement).</p>
    <p>Many sources state that it descends from the letter <em>M</em>, since sometime and somewhere it had exactly square dimensions. This sounds credible, but I fail to find any reliable historical evidences.</p>
    <p>For instance, when and where was the term <em>em</em> used for the first time? Who has invented it?</p>
    <p>And more important, was this word introduced as a precise metric description (“I mean exactly the size of the letter M”), or an associative one (“I say <em>em</em> because it <em>associates</em> with a letter M which dimensions roughly resemble a square”)? I incline towards the second choice, but I again lack any evidences.</p>
    <p>Thanks to all who can point me to respective sources of information.</p>
