      <p>Regarding your 3rd question I can try a brief response for the German speaking area: “em space” has clearly only become widely used after the introduction of software based typesetting, although there might already been such terminology connected with typefounding machines and metal faces originating from English speaking countries. The term used for a “square” as detailed by others is „Geviert“ (roughly translates to “square”, literally “[four-by-]four-th”), so there’s no connection to the “em” in terms of etymology.<br>
      I don’t have the literature here at the moment, but I’d suggest looking at old typography primers (a search phrase for books.google would be something like “[be set apart] by one em”, but I didn’t try yet!), and there are specialised multilingual dictionaries for printer’s language, just visit any larger scientific library, or catalogue at first.</p>
