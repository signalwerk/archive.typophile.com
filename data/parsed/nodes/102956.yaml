    html: <p>The usual explanation of nut and mutton is that these were used in composing rooms because it was so easy to confuse em and en. Remember that many composing rooms were close to running presses, so would be noisy. It was easy to mis-hear em for en and vice versa, and hence compositors took to using mutton and nut.</p>
