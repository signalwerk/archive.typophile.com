      <p>Upon searching a bit further: The equivalent of OED, the DWB gives a lot of different meanings for „Geviert“ <a class="freelinking external" href="http://woerterbuchnetz.de/DWB/wbgui_py?sigle=DWB&amp;mode=Vernetzung&amp;hitlist=&amp;patternlist=&amp;lemid=GG13063" rel="nofollow">link</a>, but the relevant part is: </p>
      <blockquote><p>“ausschlieszungen, heissen überhaupt alle die gegossenen metallenen körper im schriftkasten, mit welchen der setzer den raum, der im abdrucke zwischen den wörtern und zeilen leer bleiben soll, bildet oder setzt. diese sind z. b. die spatien .. die halbgevierten, ganzgevierten, ganze und halbe [Bd. 6, Sp. 4693] concordanzquadraten u. s. w.” Täubel wb. [Wörterbuch] der buchdruckerkunst (1805) 1, 113. </p></blockquote>
      <p>Somehow that was to be expected: In the early 19th century, I'd think a bit earlier in the British and French areas, there was a lot of new dictionaries for special trades coming up, so that’s likely to be the period for the first stabilizing of terms that probably had been around earlier.</p>
