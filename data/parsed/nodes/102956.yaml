    html: <p>I spent my formative years setting type by hand from a California Job Case, and I can assure you there were Em-quads (square of the point size) En-quads ( half the size of and Em) as well as 3 Em spaces (1/3 and em quad and suggested for word space) 4 Em spaces, 5 Em space and 6 Em Space. There were also  2- 3- and 4 Em Quads as well for bulking up lines. Besides these there were "Coppers" and "Brasses" which were thinner space material used to sung up your "Lock-up" in the "Chase" once you placed all your "Furniture" in the correct position and secured it using two "Quoins".</p>
