    <div class="info">Submitted by <a href="/user/7006" title="View user profile.">paul d hunt</a> : 15.Oct.2008 1.02am </div>
      <p>Hey Gang!</p>
    <p>Just like candy for your hard drive, check out these sweet new fonts from the Font Bros!</p>
    <p>Tart Workshop - Lettering artist Crystal Kluge did it again with Darling Mongrams, a new elegant and fun typable monogram font you’re sure to love! Check it out at: <a href="http://www.fontbros.com/cgi-bin/commerce.cgi?preadd=action&amp;key=TART-DAMO" title="http://www.fontbros.com/cgi-bin/commerce.cgi?preadd=action&amp;key=TART-DAMO">http://www.fontbros.com/cgi-bin/commerce.cgi?preadd=action&amp;key=TART-DAMO</a></p>
    <p>Pink Broccoli - You’re gonna love two new offbeat font display faces from this exciting new foundry! Hip Hopper featuring some sweet OpenType dancing and Lil Rhino, the quirky sister of Fat Rhino! Check ’em out at: <a href="http://www.fontbros.com/pink_broccoli_new.php" title="http://www.fontbros.com/pink_broccoli_new.php">http://www.fontbros.com/pink_broccoli_new.php</a></p>
    <p>Harold’s Fonts - After so many customer requests, we’re pleased to announce the arrival of three great new Font Packs from Harold’s Fonts! Check out Harold’s Script Pack, Hand Pack, and Stamped Pack! Save big with these amazing deals! Check ’em out at: <a href="http://www.fontbros.com/font_sets.php" title="http://www.fontbros.com/font_sets.php">http://www.fontbros.com/font_sets.php</a></p>
    <p>Fontalicious - Perhaps our biggest Fontalicious Classic re-releases in one chunk, get your hands on over 30 remastered and re-issued Fontalicious fonts in OpenType format! Check ’em out at: <a href="http://www.fontbros.com/fontalicious_new.php" title="http://www.fontbros.com/fontalicious_new.php">http://www.fontbros.com/fontalicious_new.php</a></p>
    <p>NEW FREE FONTS - Speaking of treats, Harold hands out the goods with a limited time free font Republique Shadow! It’s only around a short time so get a copy at: <a href="http://www.fontbros.com/free_fonts.php" title="http://www.fontbros.com/free_fonts.php">http://www.fontbros.com/free_fonts.php</a></p>
    <p>Enjoy these new digital goodies and share ’em with a friend!</p>
    <p>Warmly,<br>
    Mike &amp; Stuart<br>
    The Font Bros</p>
