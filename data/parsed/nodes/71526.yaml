      <p><cite>I couldn't disagree more. Instead of examining the reason why Fontographer 'fell by the wayside', I think we should look at the reasons why it has refused to die, it's still going strong after 24 years.</cite></p>
      <p>That is a valid argument.  I am new to the game and FontStudio Pro is the only fore mentioned application I am actually versed in having never used fontographer before.  I also have used fontforge but it never ran all that well compiled on my mac.    </p>
      <p><cite>And the ability of Fontographer 5 to generate OpenType fonts is the last reason, for which I would buy it, because it is not much more comfortable than generating them with the AFDKO.</cite></p>
      <p>These are the kinds of things I wondered about.  I have just begun learning about substitutions with ligatures etc in open type and up to this point have not created a type face that took advantage of OpenType.<br>
      I suppose it is my faulty assumption that I figured the newer application would handle OpenType creation better.  </p>
      <p>Ultimately my curiosity comes from the fact that I am now in the market to buy software for home instead of relying on the schools applications, in my mind FontStudio would have been the way to go (because it is what I already began learning) but the introduction of Fontographer 5 made me dig deeper.  </p>
      <p>The other part of my first comment was the question if FontStudio 6 was being worked on and that was primarily because I would put off longer on purchasing an application if I knew they were currently developing a new version, I will direct this question to FontLab and post back if they reply with anything.</p>
      <p><cite>For me, its fundamental beauty is in the elegant, intuitive, and friendly drawing tools. Fontographer just makes me want to create glyphs, experiment and play with Bézier curves; it's perfect for making display fonts and instantly accessible in a way that TypeTool and FontLab (and even Illustrator) aren't.</cite></p>
      <p>I just downloaded the trial of Fontographer 5 and couldn't agree more, The tools don't feel archaic as they do in FontStudio (in my opinion)  I would say that the tools in illustrator still seem more comfortable but that is based of what I know and use on a daily basis.  The tools in Fontographer feel much more welcoming and I am now willing to give them a try where as I was not in FontStudio.</p>
      <p>Ultimately I do not know that I will ever be much more than a hobbyist type designer but would love to be able to delve in as deep as possible some day.  It is beginning to look like Fontographer may be my purchase but is there anything that I may sorely miss in the near future coming from FontStudio?</p>
      <p>Thanks for all your feedback This is really helpful to me and I am sure its benefiting others as well.</p>
