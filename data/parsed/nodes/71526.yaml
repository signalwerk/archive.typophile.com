    <p>This topic was discussed in 2005 but I feel is worth re-visiting since the recent release of fontographer 5.  Fontlab has a comparison chart for their entire collection of software which can be located here <a href="http://www.fontlab.com/fontlab-products/compare/">http://www.fontlab.com/fontlab-products/compare/</a><br>
    I suppose my primary interest is with those who have used the new Fontographer.<br>
    One reason the program fell the way side, it would seem, was its lack of support for opentype which is now included in fontographer 5.<br>
    I also feel it is important to hear from two groups of users, those who have historically designed the font in a second application such as illustrator, then imported to fontlab or fontographer, and those who have done the entire process within the application.  Has fontographers tools or workflow gotten any smoother.  Myself I am a fontlab pro user and have always designed in illustrator because I do not like fontlabs lack of keyboard shortcuts for switching between tools.<br>
    Any and all constructive feedback would be greatly appreciated!</p>
    <p>Also I had heard a rumor some time ago that FontLab Studio was coming out with version 6 but that was nearly a year ago and I have heard nothing new.  Anyone else heard anything?</p>
