    html: |-
      <p>Keith, I need FontLab Studio's ability to do things with Unicode tables, and I have a routine that I follow to fix the headers of the font before generating. So I always import into FontLab Studio and post-process.</p>
      <p>The real thorn in my side is the 6,400-glyph limit that FontLab Studio imposes. It prevents my further developing Everson Mono, which annoys me a lot. Now Fontographer can handle 20,000 glyphs—but if I generate a font in that, I can't post-process in FontLab Studio. </p>
      <p>Sigh.</p>
      <p>I've asked Fontlab if they would release a patch to do away with that glyph limit... but I have not heard from them if they are considering it.</p>
