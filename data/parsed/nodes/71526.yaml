    html: "<p>And I feel contricted in a corset, when I use Fontographer. In FontLab Studio you can save workspaces and options. Fontographer does not seem to store the options in the registry. I wonder, where there are stored. I can reduce the skin of FontLab Studio to the things, that I need. I can switch between workspaces (although this actually seems to destabilize the tool). Just an example: I neither can change the background color of the glyph window nor I can display a grid in Fontographer. Even those simple things are not possible with Fontographer. Or are these hidden options? Really, if I am willing to invest months or years in developing a typeface, I don’t need an oversimpled tool. I need a simple tool for tasks, that I have to do every third months, but not in case of a tool, that is daily in use.</p>"
