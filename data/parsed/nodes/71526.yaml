      <p>I don't use it a whole lot, but I can't remember Fontographer 4.7 crashing and it may be too soon to say how stable 5.0 is. So, far, it has been crash-free for me in less than a week of sporadic use.</p>
      <p>FWIW, FontLab Studio is not very crashy for me on my Mac (running 10.6.3 currently). I know that's not true for all, so it may depend on what you do in it.</p>
      <p>Regarding your Fontographer concerns:</p>
      <p>1) You can make any kind of guide you like, including curves. Anything you can draw can be a guide. Guides are paths, just like on the outline layer. Same with the template layer.<br>
      2) By default there are 100 levels of undo, but you can increase or decrease it. (My recollection is that Fontographer was one of the first programs that had this many levels of undo way back when.)</p>
