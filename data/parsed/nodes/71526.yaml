      <p>I couldn't disagree more. Instead of examining the reason why Fontographer 'fell by the wayside', I think we should look at the reasons why it has refused to die, it's still going strong after 24 years.</p>
      <p>For me, its fundamental beauty is in the elegant, intuitive, and friendly drawing tools. Fontographer just makes me want to create glyphs, experiment and play with Bézier curves; it's perfect for making display fonts and instantly accessible in a way that TypeTool and FontLab (and even Illustrator) aren't. Fontographer does almost everything I want in one easy-to-use-straight-out-of-the-box package. Plus it's got depths that you can grow into when you're ready, and now it has greatly improved functionality thanks to FontLab's expertise.</p>
      <p>I believe that Fontographer is a better entry application for the designer than TypeTool, well worth the extra money, though I respect FontLab's strategy that FontLab Studio is for the font engineer (so TypeTool may be a good intro for the prospective type technician) whereas Fontographer is for the graphic designer or typographer who cannot afford, or doesn't wish, to get bogged down in the complexities.</p>
      <p>Historically, Fontographer was nothing short of visionary and did so much to achieve the democratisation of type design. Macromedia left it to die as the Mac design community embraced OS X. But even stuck in Classic, and without OpenType capability, type designers continued to use it, and FontLab in their wisdom, and to their great credit, had the vision to secure it's place in their business plan and to offer the twenty-first century designer a real alternative.</p>
      <p>Keith / K-Type<br>
      Manchester UK</p>
