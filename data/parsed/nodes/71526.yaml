      <p><cite>Myself I am a fontlab pro user and have always designed in illustrator because I do not like fontlabs lack of keyboard shortcuts for switching between tools.</cite></p>
      <p>You can assign shortcuts to almost all commands in FontLab, inclusively the tools.</p>
      <p>And the ability of Fontographer 5 to generate OpenType fonts is the last reason, for which I would buy it, because it is not much more comfortable than generating them with the AFDKO.</p>
      <p>With regard to OT production Fontographer 5 is a half baked thing. The combination of Fontlab Studio and the AFDKO is by far better.</p>
      <p>In my opinion Fontographer 5 even does not much improve the workflow, if you work with FontLab Studio and Fontographer, because if you save a vfb file with Fontographer, that you just have imported, you seem to loose everything, that Fontographer is not able to make use from.</p>
      <p>In my opinion the development of Fontographer 5 was a waste of the resources of the small developer crew. It would have been better to integrate some of its abilities, that are better (like the enbolding function) into FontLab and provide for the owners of Fontographer a more attractive update price. And additionally I would stop the development of Asia Studio. Maybe this would require to make FontLab Studio a bit more expensive, but I would prefer one perfect tool in comparison to three half baked tools.</p>
      <p>If I had a budget of 399 Dollar, I would buy TypeTool and OTMaster.</p>
