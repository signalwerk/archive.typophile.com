    html: |-
      <p>I only <em>seem</em> to be knowledgeable.<br>
      I apologise for not replying yesterday, I didn't have the book with me at work. The illustration you refer to gains its dimensions from the text block and the margins, so for the height you have 5+42+8=55picas, while the width is 5+42+5=52picas, the margins using the modular scale. </p>
      <p>The key to all grids though is later in the chapter – section 8.8 improvisations &amp; adjustments, writers will not comply with your grid all the time and the text is more important than the design. The fact is that grids only serve as guides and the pages will nearly always benefit from a good eye.<br>
      Tim</p>
