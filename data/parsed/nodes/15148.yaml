    <p>Hello,<br>
    first post here. Looks like a nice place.<br>
    I just finished the reading of Robert Bringhurst's "The elements of typographic style". Chapter 8, about shaping the page, was fascinating. I really enjoyed grid systems theories. However, I keep on wondering about modular scales.<br>
    Is anyone knowledgeable enough to give me a little run down on how to create one?<br>
    Why doesn't the Half Pica Modular Scale contains the number 52?</p>
    <p>thanks in advance :)</p>
