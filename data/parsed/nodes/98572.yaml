    html: <p>That's terrible advice. It's high end fashion. They're not going to use Arial or Helvetica. It's anything Gotham is a closer bet. Something with more rounded geometric, uniline letter forms. In any case it's Chanel so it's custom. Existing typefaces will only give you an approximation.</p>
