    html: |-
      <p>Chanel has always used exclusive bespoke typefaces and even for its main woodmark (makes sense for a fashion industry leading company). For instance, on <a href="http://www.chanel.com" title="Click to visit an external URL." class="freelink freelink-external freelink-external">chanel.com</a>, they're using one as webfont which is called "abchanel-couture" and looks not so far from your sample. Whatever it is called, it's some sort of all-caps extended grotesk.<br>
      Some substitutes: <a href="http://www.myfonts.com/fonts/typodermic/presicav/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Presicav</a>, <a href="http://www.myfonts.com/fonts/chank/adrianna/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Adrianna</a>, <a href="http://www.myfonts.com/fonts/mti/sackers-gothic/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Sackers Gothic</a>/<a href="http://www.myfonts.com/fonts/paratype/engravers-gothic/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Engravers Gothic</a>/<a href="http://www.myfonts.com/fonts/itc/blair/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Blair</a> (as previously suggested), <a href="http://www.myfonts.com/fonts/fontdiner/turnpike/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Turnpike</a>, <a href="http://www.myfonts.com/fonts/berthold/akzidenz-grotesk-be/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Akzidenz-Grotesk Extended</a>, <a href="http://www.myfonts.com/fonts/redrooster/ronsard-crystal/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Ronsard Crystal</a>, <a href="http://www.myfonts.com/fonts/sweet/sans-pro/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Sweet Sans</a>, <a href="http://www.myfonts.com/fonts/filmotype/fashion/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Fashion</a>, <a href="http://www.myfonts.com/fonts/storm/zeppelin/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Zeppelin</a>, <a href="http://www.myfonts.com/fonts/betatype/doublewide/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Doublewide</a>, <a href="http://www.myfonts.com/fonts/positype/halogen/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Halogen</a>, <a href="http://Idlewid" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://Idlewid</a>, <a href="http://www.houseind.com/fonts/luxuryfonts" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Luxury Gold</a>, <a href="http://www.myfonts.com/fonts/typodermic/biondi-sans/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Biondi Sans</a>...</p>
