    html: |-
      <p>Chanel has always used exclusive bespoke typefaces and even for its main woodmark (makes sense for a fashion industry leading company). For instance, on <a class="freelinking external" href="http://www.chanel.com" rel="nofollow">chanel.com</a>, they're using one as webfont which is called "abchanel-couture" and looks not so far from your sample. Whatever it is called, it's some sort of all-caps extended grotesk.<br>
      Some substitutes: <a class="freelinking external" href="http://www.myfonts.com/fonts/typodermic/presicav/" rel="nofollow">Presicav</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/chank/adrianna/" rel="nofollow">Adrianna</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/mti/sackers-gothic/" rel="nofollow">Sackers Gothic</a>/<a class="freelinking external" href="http://www.myfonts.com/fonts/paratype/engravers-gothic/" rel="nofollow">Engravers Gothic</a>/<a class="freelinking external" href="http://www.myfonts.com/fonts/itc/blair/" rel="nofollow">Blair</a> (as previously suggested), <a class="freelinking external" href="http://www.myfonts.com/fonts/fontdiner/turnpike/" rel="nofollow">Turnpike</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/berthold/akzidenz-grotesk-be/" rel="nofollow">Akzidenz-Grotesk Extended</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/redrooster/ronsard-crystal/" rel="nofollow">Ronsard Crystal</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/sweet/sans-pro/" rel="nofollow">Sweet Sans</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/filmotype/fashion/" rel="nofollow">Fashion</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/storm/zeppelin/" rel="nofollow">Zeppelin</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/betatype/doublewide/" rel="nofollow">Doublewide</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/positype/halogen/" rel="nofollow">Halogen</a>, <a class="freelinking external" href="http://www.typography.com/fonts/font_styles.php?productLineID=100043" rel="nofollow">Idlewid</a>, <a class="freelinking external" href="http://www.houseind.com/fonts/luxuryfonts" rel="nofollow">Luxury Gold</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/typodermic/biondi-sans/" rel="nofollow">Biondi Sans</a>...</p>
