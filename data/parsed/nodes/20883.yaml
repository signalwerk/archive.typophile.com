  html: |-
    <p>I'm looking for a font similar to Whitney Index Black Round (Bold) that will support double digits through the font. Currently, Whitney only supports the numbers 0-9 and any other numbers must be individually composed. Sans Serif is preferred, but ANY related font suggestions welcomed.</p>
    <p>Here's a link to Whitney Index Black Round (Bold)</p>
    <p>Best,<br>
    Marty</p>
