    html: <p>Hard to say.  I like the first set of word marks but they take the overall brand in a different direction. <br> <br>Their current design is a bit lighter, or elegant I guess.  The direction of the first batch of logos you did is weightier -- making a bolder impression. <br> <br>In other words, their current design speaks of white collar enterprise, your first batch speaks of blue collar industry. <br> <br>Seems like a revolutionary change.  Is this what the client is going for? <br> <br>I'd stay away from the curvy shape -- looks like water.  Makes me think of saving nemo.</p>
