    html: <p>I think you could refine your first couple of wordmarks and they would be fine. As you made more and more of them you made the mark more and more forced. The lettermarks don't work for me. Let me explain. The reason IBM works is they put major money in advertising to the point they no longer had to be International Business Machines. Most companies don't have that luxury, so names and taglines that describe the business are often the safest way to go.</p>
