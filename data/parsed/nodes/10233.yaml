  html: "<p>I am a graphic design student at the University of North Texas. I am working on these marks for my class. They are all for the company I was assigned which is called Power Measurement. This is school work. <br> <br>It is a real company: <a href=\"http://www.pwrm.com/\" target=\"_blank\">http://www.pwrm.com/</a> <br> <br>Power Measurement provides software and hardware for the monitoring of energy consumption across multiple buildings or locations. Their systems are web enabled and help to increase the reliability and efficiency of their clients power usage. Their products also aid in the decision making process of those in management positions. <br> <br>There are a whole bunch of wordmarks and lettermarks so far. So I'm just going to dump them all on you all =) I will be adding more too as time goes on. <br> <br>Please be brutally honest. <br> <br>Wordmarks: <br><a href=\"http://forcedconnections.com/homework/graphic_design/identity_marks/wordmarks/\" target=\"_blank\">http://forcedconnections.com/homework/graphic_design/identity_marks/wordmarks/</a> <br> <br>Lettermarks: <br><a href=\"http://forcedconnections.com/homework/graphic_design/identity_marks/lettermarks/\" target=\"_blank\">http://forcedconnections.com/homework/graphic_design/identity_marks/lettermarks/</a></p>"
