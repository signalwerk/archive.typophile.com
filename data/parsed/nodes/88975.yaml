  html: |-
    <p>I don’t know the rationale that was employed when Unicode included the ldot characters, but it doesn’t make much sense typographically.</p>
    <p>The main problem being that attaching the dot to one of the l’s means that l·l won’t justify with the dot evenly spaced.</p>
    <p>**</p>
    <p>As I understand it, this composite character is not keyed in manuscripts, with the standard procedure being to type “l periodcentered l”, the periodcentered (punta volanta) being at “Shift 3” on the Spanish keyboard (there being no Catalan keyboard).</p>
    <p>Therefore, I propose that the best practice for dealing with this situation in OpenType fonts is:</p>
    <p><code>feature liga {<br>
    sub l periodcentered' l by periodcentered.ldot ;<br>
    } liga;</code></p>
    <p>—where "periodcentered.ldot" is placed vertically and fitted to purpose.</p>
    <p>An alternate periodcentered glyph is required because the standard periodcentered glyph is the width of the period, which is generally much too wide for this purpose, especially in serifed faces.</p>
    <p>This addition to the Ligature feature won’t interfere with documents where the editor/typographer uses the Unicode character for ldot, and has no bearing on documents in other languages, or math, where a periodcentered might conceivably be typed between two l’s.</p>
