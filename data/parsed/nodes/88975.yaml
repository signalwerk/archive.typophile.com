    html: |-
      <p><em>I don’t know the rationale that was employed when Unicode included the ldot characters...</em></p>
      <p>I'm pretty sure the rationale was pre-Unicode inclusion in one or more national standards. This explains a number of oddities in Unicode.</p>
      <p>Your method looks fine, although I would implement this in the ccmp feature, whence it cannot be turned off by the user. The correct position of the dot in Catalan is not discretionary. Note that you can also decompose the Unicode L/l with dot in ccmp, which would enable better justification spacing even if the Unicode character is employed in text.</p>
