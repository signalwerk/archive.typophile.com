      <p>&gt; I’m one of those dreaded “Graphic Designers” who ...</p>
      <p>If you're here, then you're not.  :-)</p>
      <p>I thought your brief, although interesting, was a tough<br>
      call with that "G"/"g" requirement, but Andrade actually<br>
      seems a great match! The thing is, if you think that "G"<br>
      is not distinctive enough, I think I can safely say that<br>
      you won't find exactly what you're looking for, basically<br>
      because it's very hard to find a funky UC "G" in a reserved<br>
      design like you'd like...</p>
      <p>But here's an idea: find a font that's as close a match as<br>
      you can find but without a funky "G", and get a designer<br>
      -preferably the original one- to funketize it for you.<br>
      Or actually, since it's for a logo and not text, you can<br>
      just funketize it yourself! Just show us your work-in-<br>
      progress so we can tear it apart first.  ;-)</p>
      <p>Or what about this (from another current thread actually)?<br>
      <a href="http://www.optimo.ch/pages/departement/index.php?id_categorie=1&amp;id_font=9" title="http://www.optimo.ch/pages/departement/index.php?id_categorie=1&amp;id_font=9">http://www.optimo.ch/pages/departement/index.php?id_categorie=1&amp;id_font=9</a></p>
      <p>hhp</p>
