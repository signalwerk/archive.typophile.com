      <p>Thanks for your replies all. The art director agrees that Andrade is currently our best choice, perhaps borrowing a flourish from the ligatures to embellish the uppercase G. Quite an improvement from some of our original choices. We're going to be running it by the client to see what they think. Since you're all interested, I'll be sure to let you know where it goes.</p>
      <p>P.S. I wish myfonts.com gave you the option of kerning — or at least tracking — previews.</p>
