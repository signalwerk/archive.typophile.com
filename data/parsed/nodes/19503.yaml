    <p>Hello all,</p>
    <p>I'm one of those dreaded "Graphic Designers" who lacks an extensive background in typography. I try to tend to my type as well as I'm able, but I'm sure I've done some things that would shock and awe. That being said, I take my type as seriously as I can, and I like to refer to the experts whenever possible.</p>
    <p>I've got a particularly high profile client, who's looking for a wordmark, and I'm looking for a suitable typeface to accompany it. The budget is quite large, so I'm looking for as close a match as I can get. I'm looking for a serif typeface with a 19th century feel (preferably something designed recently) that pays particular attention to the upper and lower case Gs. I'm looking for something elegant, but that doesn't alienate. A typeface that looks good in a suit, but has been known to lounge in a t-shirt and jeans.</p>
    <p>Thanks,</p>
    <p>-J.</p>
