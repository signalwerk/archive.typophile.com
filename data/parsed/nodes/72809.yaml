    html: |-
      <p>Also, if you host the fonts yourself, you'll need to host multiple formats for different browsers (at least EOT and TTF, possibly WOFF and/or SVG as well), and get the coding straight to do that seamlessly. It can be done, just takes a bit of research and potentially converting formats. You'll also want to be sure that the license terms permit the font formats you need.</p>
      <p>For the "renting typefaces" approach, I might also suggest you look at our service: <a href="http://webink.com" rel="nofollow">WebINK</a> from Extensis.</p>
      <p>Cheers,</p>
      <p>T</p>
