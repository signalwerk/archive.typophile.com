  html: |-
    <p>Any advice/tips would be appreciated. I want to use professional typefaces on websites but would like to know the ins and outs. Copyright issues?  Done some research and there's FLIR and sIFR, but I don't want to go down this route, as its (sIFR) flash dependent and seems Flash is going down the pan</p>
    <p>Also have checked out Squarespace.com. They have the licensing sorted it seems but their library is limited IMO.</p>
    <p>Thanks in advance</p>
