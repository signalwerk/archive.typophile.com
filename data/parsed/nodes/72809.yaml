      <p>Using @font-face is the best method and requires neither Flash nor Javascript. There seems to be two main approaches: Renting typefaces located on a remote server and buying typefaces to have on your own server. </p>
      <p>Some places to start looking: <a class="freelinking external" href="http://www.fontshop.com/fontlist/n/web_fontfonts/" rel="nofollow">Fontshop</a>, <a class="freelinking external" href="http://www.typotheque.com/webfonts" rel="nofollow">Typotheque</a>, <a class="freelinking external" href="http://typekit.com/" rel="nofollow">Typekit</a>, <a class="freelinking external" href="http://www.fontsquirrel.com/fontface/generator" rel="nofollow">Fontsquirrel</a>, <a class="freelinking external" href="http://code.google.com/webfonts" rel="nofollow">Google Fonts</a>, <a class="freelinking external" href="http://www.motaitalic.com/" rel="nofollow">Mota Italic</a>, <a class="freelinking external" href="http://justanotherfoundry.com/webfonts" rel="nofollow">JAF</a>, <a class="freelinking external" href="http://webfonts.info/wiki/index.php?title=Fonts_available_for_%40font-face_embedding" rel="nofollow">Webfonts.info</a> + <a class="freelinking external" href="http://webfonts.info/wiki/index.php?title=Category:Webfont_Services" rel="nofollow">this</a>, <a class="freelinking external" href="http://www.ascendercorp.com/info/web-fonts/" rel="nofollow">Ascender</a>, <a class="freelinking external" href="http://fontdeck.com/" rel="nofollow">Fontdeck</a> and <a class="freelinking external" href="http://kernest.com/" rel="nofollow">Kernest</a>.</p>
      <p>Also a google search for "site:typophile.com @font-face" or "site:typophile.com web fonts" will turn up a lot of information. </p>
      <p>You should pay special attention to rendering on different platforms/browsers, as this can vary. Most of the free fonts and even a lot of the “professional” ones are not up to speed on this.</p>
