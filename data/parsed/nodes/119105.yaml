    html: <p>Very nice, Aziz!  And here is my Japanese-calligraphy-inspired Arabic calligraphy of the Lord's Prayer. The style is not the well-known classical Chinese style (short angular strokes) but one used to write poetry in paintings and letters - so called grass writing because of its flowing lines.<br><img src="/sites/default/files/old-images/Lord's prayer painting detail lettering only 24 Mar 1992_6266.jpg"></p>
