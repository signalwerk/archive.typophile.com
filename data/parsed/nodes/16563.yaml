  html: |-
    <p>Do you have recent experience doing copyright registrations for fonts with the US Copyright Office?</p>
    <p>Some specific questions:</p>
    <p>The Copyright Office wants the source code of the font deposited. That's easy to understand for a C++ program, but what do they expect to see as "source code" for a font created using Fontographer (so glad it's available for OS X finally)? Or FontLab?</p>
    <p>If I create a font in Fontographer, and distribute a TrueType font that I generated using Fontographer, does the Copyright Office want the .fog file? Or the .ttf file? Or something else entirely? The .fog file seems like it's basically the "source code", though it's utterly unreadable if I just open it in a text editor.</p>
    <p>There's a cryptic sentence on a few sites about the Copyright Office being reluctant to accept registrations of fonts created using Fontographer -- has anyone actually run into that?</p>
    <p>Finally, for a dingbat font where I want the copyright registration to also protect the selection and arrangement of non-alphabetic glyphs (the a slot is filled by a diamond, the b slot is filled by a horse), do you have any experience with the Copyright Office accepting or rejecting language to that effect on the registration form?</p>
    <p>I've just spent most of the last day looking for answers to these questions unsuccessfully on the web and in books. Any advice would be very welcome!</p>
