      <p>I don't know about your last question.</p>
      <p>For Type 1 fonts, IIRC, what Adobe used to file with the copyright office was a dump of an unencrypted version of a PFA file.</p>
      <p>For OpenType CFF fonts or CFF fonts, one could dump tables of the compiled font, in order, using a tool such as TTX.</p>
      <p>In all cases, one only needs to submit the first 25 pages and last 25 pages. More details are on the copyright office's site. (or is it 10 and 10 like Microsoft? I could be misremembering.)</p>
      <p>Regards,</p>
      <p>T</p>
