      <p>We use a TTFDUMP to dump the font data to a text file and send the first ten and last ten pages to the (c) office. Don't know how about the forms - our legal people take care of that for us. </p>
      <p>With respect to glyph order - got a feeling that might be a design patent thing not a (c) thing as we've not done that in a while.</p>
