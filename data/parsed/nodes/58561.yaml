  html: |-
    <p>This made me smile.</p>
    <p>"It is to be hoped that before long some means will be created – an independent journal, perhaps – which will be more than just a source of information about new designs derived from suppliers' handouts, but will act as a forum in which critical judgement on typographic matters can be expressed and debated, so that typographers will be moved to examine their own preferences and prejudices, and type designers will know that their latest offerings must undergo the appraisal of people who not only enjoy type but have a critical eye for its aesthetic and functional merits."<br>
    (Walter Tracy, Letters of Credit, p. 214.<br>
    Published 14 years before the inception of Typophile.)</p>
