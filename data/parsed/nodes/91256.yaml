    <p>My post might be better related to the typographic education section but I would like some general feedback.</p>
    <p>I'm teaching a type class, the last of a series of 4 in a graphic design diploma.<br>
    Lucky me I only have 4 students so we get to push things a bit more than usual. The next project is supposed to be 'Typobjets' (type made from objects) but some of them have done something similar in another class so I'm thinking of opening up the project and turn it into making a collective typography. </p>
    <p>Each student would have 13 glyphs (if we only do uppercase and lowercase, not sure how much we can squeeze in, I'll probably have to adjust). It would be more interesting if we could also get some punctuation and the accents done so they can actually use it.</p>
    <p>I'm thinking of letting them pick their letters within the whole but I'm also thinking it might be better if each of them get a more difficult letter, a round letter, etc. </p>
    <p>Also, I'm thinking of asking them to have one handdrawn letter, one letter sculpted (potato maybe), one modular letter, one object letter, one letter found in nature, etc. I'm hoping that by setting some categories that the end product will be less of a visual mess.</p>
    <p>Anyone care to share their thoughts on this?<br>
    Anyone did a similar project and ran into problems?</p>
    <p>Also, I'm thinking it would be cool to turn it into a font but I haven't messed with that kind of software in a while. What would be my best bet? I don't think it would have to be some very complex software since it's probably the kind of font they would have to kern it by hand anyway. Suggestions?</p>
    <p>Thank you for your time!<br>
    Émilie</p>
