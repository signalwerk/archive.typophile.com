      <p>Christopher : I do insist that my students form their own opinion. I don't agree at all that because one reads or gets involved in a forum it means that they cannot think for themselves. I am guessing you are referring to students who explicitly come here asking to get their comps fixed up which is definitely not everyone's case. I've been hanging around Typophile for almost 10 years on and off and I used to read the boards almost everyday when I was doing my BA. I learned a lot from reading the threads and I felt that the boards were bringing me a huge complement of information. Had I not thought it was a great resource back then, I wouldn't be here today. </p>
      <p>On a whole different note, I ran into your tweet about my thread : <cite>On @Typophile, “Do My Homework Syndrome” — <a href="http://bit.ly/iSCQJ6" title="http://bit.ly/iSCQJ6">http://bit.ly/iSCQJ6</a> — has devolved into “Develop My Coursework” syndrome —</cite></p>
      <p>I would obviously prefer if you told me straight up that you have a problem with me posting on the forum for feedback on a type education project instead of tweeting about it behind my back making it look like I'm asking for someone to come up with a project for me. Are you paranoid about people coming here for feedback and answers? I'm sure it happens a lot...otherwise it wouldn't be a forum, would it?</p>
      <p>Washishu : Google Images wasn't so popular when I was in school but I experienced first hand that it has taken over tonight! I had to insist quite a bit for them to get off it. If it wasn't for the fact that they are people who already work full time as well as taking classes in the evenings, I'd probably forbid using a computer for the research steps of the project. I was surprised, I actually thought they would be happy to get away from the machine since they normally spend all day on it. I know for one if someone told me to go out for a walk to find and take photos of letterforms I wouldn't hesitate one bit to get away from the screen. Instead I felt from them that I was taking away their lifeline. I think I managed to correct the direction and that next week will be better. After an hour, the new glyphs were way more original than their first research with Google.</p>
