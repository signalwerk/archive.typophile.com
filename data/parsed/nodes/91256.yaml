      <p>I will be getting my first glyphs from the students tonight. I'm hoping for a lot of variety! I totally agree with washishu about getting away from the computer. I did give some slack on this though because I'm teaching evening classes so my students often work full time and then go to class at night. They don't have a whole bunch of time to go take photos while daylight is out.</p>
      <p>We did the round robin thing as oldnick suggested and I let them exchange some letters afterwards because one of them had a bunch of numbers and almost no lower caps. I gave them a few abstract categories and asked them to cover at least 5 of them.</p>
      <p>My categories are :<br>
      A handdrawn letter<br>
      A molded/sculpted/woven letter<br>
      A letterform found in nature<br>
      A letterform found in the city<br>
      A remixed letterform<br>
      A modular letterform<br>
      A pixel letterform<br>
      A hybrid letterform<br>
      A letterform found at bird's eye view (such as Google Earth)<br>
      A letter found in the past (retro signs, etc.)</p>
      <p>Will keep you posted :-)</p>
