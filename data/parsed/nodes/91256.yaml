      <p>I retired from teaching graphics three years ago. One of the 'issues' I had constantly to tackle was the students' reliance on digital technology. Letterform, to most of them, meant a typeface from a menu list.</p>
      <p>I tried to persuade them to think out of the digital box by running a series of classes which were all about creating letters; letters which were out of any context and were not for anything. The students were allowed to use any materials they had or could acquire, except a computer or a camera, to make letters. It sounds a touch like your typobjects maybe, although I'm not 100% sure what you mean by that. The branch that looks like a Y? Or arranging (for example) bricks into an L?</p>
      <p>Yes we did get some of that kind of thing and, over the years, many letters made from dried pasta but also got some fabulously creative work such as a two-storey g made from strips of coloured thread woven into a piece of chicken wire—and I mean woven, not just threaded through. Another one I loved was a found, dried-out, trodden-on tea bag squashed onto a piece of discarded card which together formed a wonderfully grungie a or d or p, we never did decide.</p>
      <p>The idea behind this was, clearly, to break the reliance on digital type and to get them to look and think hard about letters as shapes.</p>
      <p>We would spend maybe two or three sessions on this and then I would contrast this with two or three very disciplined sessions in which they were given an example letter from a carefully chosen typeface (the example would be an A4 print) and they were required to draw the letter accurately at least three times in different media at A1 size.</p>
      <p>As with all these things, it works well for some and not for others. But more than one student told me in later years that when they went on to a higher-level course, they became the letterform expert amongst their peers.</p>
