      <p>I think the approach might be more aimed at what makes a group of letters become a typeface.  My suggestion would be that each student be assigned to design one letter for a typeface, the lowercase "n" without copying an existing face.  The next step would be for everyone in the class to exchange their letter n with another classmate by un-named lottery.  The second person would be tasked with designing the lowercase letter "q" based on the n they were given.  The point being that they would have to figure out the system the first person intended and attempt to follow it. Next comes another lottery to trade with a 3rd person who would draw the lowercase "a" from the n and q they received. The lottery and trading would continue until 5 different glyphs were made by 5 different students, each trying to make a glyph that fits with the others. I would choose, in order, n q a s v.  You should end up with a set of 5  glyphs for everyone in the class with each of the 5 drawn by a different person.  Their should be some interesting comparisons and a healthy dialogue among the classmates when everything is put up for viewing and critique.<br>
      It is important to not use peoples names, just assign some number code per student.  You want to remove the dynamic of who the personalities of the people are and focus on the personality of the given glyph.</p>
      <p>I would have them draw by hand with pencil or marker (no compass, ruler or french curve tools allowed) but not a flat edged calligraphic tool which can dictate form.  Forget the computer for a while. That will come later. This should not be about either drafting skills or software skills.  It should be about looking and analyzing.</p>
      <p>The only limitation would be that the x-height of all the glyphs in the entire project should be the same. This would be so that scale is not an issue.  After all is done, you can mix glyphs with other sets to bring to light what happens with differing systems of approach.</p>
