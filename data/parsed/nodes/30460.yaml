  html: |-
    <p>I have to design Olive Oil labels (with more products to come). do you have any sources of inspiration? Labels that make you go "Wow!". Books, Web sites?</p>
    <p>I'm looking for inspiration. I'm desperate.</p>
    <p>This will be my first time. After years of mediocre design for undeserving clients and design agencies, I am now crippled with stunted typographic skills.</p>
    <p>PS—I live in Ireland, so I can't visit the local <em>Safeway</em> to look at labels on the shelves if you are directing me to American brands.</p>
    <p>JC</p>
