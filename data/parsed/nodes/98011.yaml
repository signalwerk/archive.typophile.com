  html: |-
    <p>Any suggestions for typefaces for a website? Arial is so much clearer than Helvetica in small sizes. Georgia is so common.</p>
    <p>One typeface should be neutral and be easy to read at small sizes.<br>
    The other typeface should be elegant, but simple and also be easy to read at small sizes.</p>
