    html: "<p>That p is difficult -- it hasn't seemed to match any of the Bodonis I've looked at, nor does it match Storm's Walbaum Text (which I love) or Emigre's Filosofia (which is also very nice). <br> <br>I hope I'm not missing something obvious... <br> <br>To BJ: thanks for the nod. In the words of Fred Durst, I'm in agreeance with the vast majority of views expressed above that some of the individual quizzes were a tad too obscure (though not Grant's last one -- that was just inability on all of our parts). I'm sort of against splitting into two quiz areas, however -- though I am happy to see some new faces responding here, I think a better solution would be to require a quiz poster to put up a sample that can be found digitally. That doesn't mean it can't be obscure, just that everyone has an equal chance of finding it online. I like Daniel's suggestion of a sped-up process of adding new hints or showing more of the glyph. <br> <br>For the folks who have classic old specimens they were culling from to stump the hell out of us, maybe someone can start a thread called \"Typefaces that were never digitized but should be.\" <br> <br>And to Grant: uh... <br> <br>And to Grant and Randy (and anyone else who, like me, is sitting in front of their computer on a Saturday night): something is seriously wrong with us. Let's go get a beer or something.</p>"
