    html: "<p>Alright, this may well prove unpopular amongst you true experts and <br>entirely off base (so just rebut me!), but, without meaning to point <br>fingers at any Quiz offering in particular ... could it be that it had gotten <br>way too <i>arcane and difficult?</i>. <br> <br>I mean, I was waiting for a combination of: <b>A tiny portion of a rarely used <br>ligature from a non-latin font that hadn't actually been released yet</b> to be <br>posted! The number of you on this forum who are able and care to hunt <br>up such an animal can probably be counted on one hand. <br> <br>The number of active, non-lurking participants in this forum are relatively <br>few already. Therefore, in my humble opinion, would it not, perhaps, be <br>better to involve more participants by offering more accessible fonts/glyphs <br>in the quiz? <br> <br>The answer could still be made tricky with choice of letter/number, size of <br>sample image, crafty clues, etc. And if somebody guesses it the same day? <br>Fine. Next offering. Would a quicker turnover be so bad? <br> <br>Just my single cent worth. <br><br></p>"
