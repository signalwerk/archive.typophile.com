    html: "<p>Yeehaw!  (As I used to say when I lived in Texas ... or at least, as I used to hear others say.)  This is a blast!  Thanks for doing it.  I would love it if there were a regular novice-level quiz like this.  Have learned a lot already (like, look more closely at the difference between Serifa and Stymie!).  Anyway, I'm enjoying following all the links and am finding it quite educational. <br> <br>I do have a question:  the \"L\" matches the version of Edwardian Script I have that came with who-knows-what (probably Word), but when I looked up Edwardian Script on MyFonts, it has a <a href=\"http://www.myfonts.com/fonts/linotype/itc-edwardian-script/edwardian-scr-itc/testdrive.html?s=L&amp;p=72\" target=\"_blank\">different L</a>, and your L only matches the  <a href=\"http://www.myfonts.com/fonts/linotype/itc-edwardian-script/edwardian-scr-alt-itc/testdrive.html?s=L&amp;p=72\" target=\"_blank\">Alternate</a>.  So, is this L really Edwardian Script, or Edwardian Script Alternate?  (Probably a very novice question from a real novice!)</p>"
