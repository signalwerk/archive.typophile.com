    html: <p>Hear! Hear!  I completely agree with Mike on this. This is the reason I have not participated in this game. It's one thing to sharpen ID skills, but this kind of obscure character showing off is not worth my time. I like it if I learn about new fonts, or underappreciated or rare ones, but learning about unused characters in fonts  has almost no value to me. <br> <br>I know, that means I shouldn't participate in the Quiz, right? Something for everybody, I guess.  <br> <br></p>
