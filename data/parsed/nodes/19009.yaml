  html: |-
    <p>A web developer that is using a PS OT font I have created is getting a message from PDFLib (<a href="http://www.pdflib.com/" title="http://www.pdflib.com/">http://www.pdflib.com/</a>) stating that the accented glyp feature is not supported.<br>
    PDFLib does not support contextual alternates either, but it does not error with this feature.</p>
    <p>how to procede?</p>
