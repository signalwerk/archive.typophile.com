    html: <p>I don’t work with FontForge, but you shouldn’t need to do anything special. Just make sure you assign the correct unicode and name values for the glyphs.</p>
    html_clean: <p>I don’t work with FontForge, but you shouldn’t need to do anything special. Just make sure you assign the correct unicode and name values for the glyphs.</p>
  - id: 553016
    user: 1043
    date: 2013-05-02T13:43:00
    date_raw: 2 May 2013 — 1:43pm
    votes: null
    html: <p>Also, don’t try to implement “smart” quotes in your font. It’s the responsibility of end user applications to do that. It’s beyond the capabilities of OpenType anyway.</p>
    html_clean: <p>Also, don’t try to implement “smart” quotes in your font. It’s the responsibility of end user applications to do that. It’s beyond the capabilities of OpenType anyway.</p>
  - id: 553017
