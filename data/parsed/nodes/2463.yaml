    date_raw: 18 Dec 2003 — 1:41pm
    votes: null
    html: <p>Andrew I have a problem with the name. Cyber Camp sounds like a porno site. I think you need the word camp with cyber and a slogan that puts it in context. But that is marketing not just design. In terms of what you are working on it looks fresh and very sharp and pointy. No problems with your Cyber's</p>
