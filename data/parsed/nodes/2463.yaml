    date: 2003-12-18T14:48:00
    date_raw: 18 Dec 2003 — 2:48pm
    votes: null
    html: <p>I was thinking it could be humorous to do a bitmap version of the cliche <a href="http://simplythebest.net/fonts/fonts/woodbadge.html">log lettering</a> so often found in campville. Might be a tall order, but it could be sweet if you can pull it off. <br> <br>Randy</p>
