    date_raw: 19 Dec 2003 — 7:43am
    votes: null
    html: <p>Wow! Porno and Kids don't mix. I hadn't made that association. Cybercamp runs  <br>during the summertime from mid June to late July. It has just completed its 4th year,  <br>so if the porno association has been made, no one has complained about it.  <br> <br>While learning computers is certainly the focus, <br>games and crafts are done throughout the day sessions.  <br> <br>Randy, can you explain your idea further.. It sounds interesting. The wood  <br>lettering is cliche, but I'm open to the idea. <br> <br>Signed, <br> <br>Lost but curious</p>
