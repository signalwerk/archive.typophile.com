  html: <p>I need some fresh eyes on this. I am not even sure if it is readable yet, the y especially. <br>This is one of two logo's i am working on for library programming. <br>CyberCamp is a computer camp for kids. <br> <br>Thanks in advance, <br> <br>Andrew <br> <br> <br><img src="http://www.typophile.com/forums/messages/29/22638.gif" alt=""></p>
