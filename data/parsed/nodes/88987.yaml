    html: |-
      <p>something like this:</p>
      <p><code></code></p>
      <pre>for glyph in fl.font.glyphs:
        for anchor in glyph.anchors:
          if anchor.name == '_top':
            anchor.name = '_t'
          elif anchor.name == '_bottom':
            anchor.name = '_b'
      fl.UpdateFont(fl.ifont)
      </pre><p><br>
      Eigi</p>
