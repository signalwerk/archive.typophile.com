      <p>I think you should take advantage of the third dimension, beyond a bevel<br>
      <a href="http://blog.fontshop.com/2012/12/13/type-trends-polychromatic-type/screen-shot-2012-12-13-at-5-01-58-pm/" title="http://blog.fontshop.com/2012/12/13/type-trends-polychromatic-type/screen-shot-2012-12-13-at-5-01-58-pm/">http://blog.fontshop.com/2012/12/13/type-trends-polychromatic-type/scree...</a><br>
      or a simple cutout</p>
      <p>A blackletter like Wilhelm Klinspor Gotisch has a perspective quality that could represent well in three dimensions – imagine that k using depth and taper – so that it only revealed its full k-ness quality from one viewing point while also having an overall sculptural sense.</p>
      <p><a href="http://www.fonts.com/font/linotype/wilhelm-klingspor-gotisch" title="http://www.fonts.com/font/linotype/wilhelm-klingspor-gotisch">http://www.fonts.com/font/linotype/wilhelm-klingspor-gotisch</a></p>
      <p>Some of the Escher or Moebius-based designs on the Shapeways site are gorgeous.</p>
      <p>Tim</p>
