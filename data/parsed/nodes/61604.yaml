    <p></p><div class="imageWrap"><img src="http://typophile.com/files/ScrewPressweb_5658.gif"></div><p></p>
    <p>A silk purse...</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/ScrewPress2web_3453.gif"></div><p></p>
    <p>...from a...</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Presses_6248_4083.8.jpg"></div><p></p>
    <p>sow's ear.  </p>
    <p>Mission complete, the smaller of two, hundred year old engraving proofing presses have just been fully restored and completely operable by my husband and partner, John Mack Collins.  This baby (pictured above) weighs-in at about two hundred pounds and when you hit the ball watch your head and digits 'cause it wields about a force of two tons.</p>
    <p>These presses were originally made for proofing half inch thick commercially engraved dies but they have been used for production work on embossed monograms and family seals.  The big brother, about 50% again the weight, is almost completely restored as well.  This one will reside at Loyola University New Orleans in the graphic design department with Professors Daniela Marx and Nancy Bernardo.  A small but burgeoning cottage industry for print engraving is being nurtured here in New Orleans by Yvette Rutlidge, venerable typographer, sign letter and master engraver, <a href="http://www.angelfire.com/planet/mysticbluesigns/engraving.html" title="http://www.angelfire.com/planet/mysticbluesigns/engraving.html">http://www.angelfire.com/planet/mysticbluesigns/engraving.html</a>.  Yve will be devoting a portion of her shop to the letter arts, and, engraving.</p>
    <p>Follow the entire story, here:</p>
    <p><a href="http://typophile.com/node/59459" title="http://typophile.com/node/59459">http://typophile.com/node/59459</a></p>
