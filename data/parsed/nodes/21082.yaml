    html: |-
      <p>Having looked at your proposed website I wonder if you need to have a logo at all. Having said that you have started one so I'll ask what the x actually means, I prefer the second of the three you posted on your thread about the content of your website although the x seems a bit laboured as though it hasn't come from the same hand. On the first impression of the logo on its own, I think people will read graffiti-style graphics which might/or not be suitable or complementary to your work, which kind of takes me back to my first point. Of those that you have posted here I like middle row lefthand though it does look a bit like a signoff on a note to a girlfriend, I would definitely avoid the swooshes they look like a mark on a test paper.<br>
      I hope I'm not being too negative here, but I would re-consider the need for a logo.<br>
      Tim</p>
