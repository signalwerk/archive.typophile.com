    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Publications" class="freelinking" rel="nofollow">Publications</a> : Letters of Credit</strong><br>
    By <a href="/wiki/Walter%20Tracy" class="freelinking" rel="nofollow">Walter Tracy</a>.<br>
    First published in 1986.<br>
    <a class="freelinking external" href="http://www.amazon.com/dp/1567922406/typophile-20 " rel="nofollow"> Buy it</a></p>
    <p>By no means complete, it is still one of the best books that analyzes typefaces and type design.</p>
    <p>The first half of the book deals with type measurement, legibility &amp; readibility, type making from metal to film to 1980's technology, many aspects of proportion and letterforms. </p>
    <p>The second half looks at Designers of Type: <a href="/wiki/Jan%20van%20Krimpen" class="freelinking" rel="nofollow">Jan van Krimpen</a>, <a href="/wiki/Frederic%20W.%20Goudy" class="freelinking" rel="nofollow">Frederic W. Goudy</a>, <a href="/wiki/Rudolf%20Koch" class="freelinking" rel="nofollow">Rudolf Koch</a>, <a href="/wiki/W.A.%20Dwiggins" class="freelinking" rel="nofollow">W.A. Dwiggins</a> and <a href="/wiki/Stanley%20Morison" class="freelinking" rel="nofollow">Stanley Morison</a>.</p>
