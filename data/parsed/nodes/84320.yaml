      <p>Yes, for some reason in Lion  Apple deleted the View=Glyph function which has been part of Character Viewer for years now, and that is inconvenient for a lot of people.  I have not seen any explanation for it and have recommended everyone file feedback requests to have it put back.</p>
      <p><a href="http://www.apple.com/feedback/macosx.html" title="http://www.apple.com/feedback/macosx.html">http://www.apple.com/feedback/macosx.html</a></p>
      <p>Another previous feature left out is the ability to identify a character selected in a text.</p>
      <p>As an alternative you could try PopChar.  I have not done so myself and am not sure whether it will show everything in a given font or not.</p>
