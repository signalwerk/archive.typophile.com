  html: |-
    <p>Over at <a href="http://www.typografie.info" rel="nofollow">our German type forum</a> people have been complaining about the missing support of unencoded glyphs in the character palette of OS X Lion.<br>
    From what I could gather:</p>
    <p>In Mac OS 10.6 you can select certain typefaces and the character palette would show you all glyphs of that font, even the ones without a Unicode value. From there you could do copy&amp;paste for these unencoded glyphs, at least to most Apple and Adobe apps.<br>
    In Mac OS 10.7 this option seems to be gone. (Couldn't check it myself, since I still wait for the FontLab Studio 5.1 update)</p>
    <p>In Linotype’s old FontExplorer version 1.2.3 unencoded glyphs were also shown …<br>
    <img src="http://www.typografie.info/2/attachment.php?attachmentid=3231&amp;d=1311611613"><br>
    … but they are also missing in the recent version of FEX under the recent version of Mac OS. </p>
    <p>So I am wondering:<br>
    Are there any good reasons for companies like Apple and Linotype to drop the support for unencoded glyphs? Sure, the GlyphIDs are not as reliable as a Unicode value, but if you know what you are doing and the apps you use support it, that’s a very helpful feature.<br>
    Even if it could just be used for inspecting the character set of modern OpenType fonts with all their alternate characters. </p>
    <p>And what I am most interested in: <strong>Are there alternative character palette tools for Mac OS that support unencoded glyphs? </strong><br>
    Of course the Glyph Palettes in InDesign and Illustrator are good at that, but I can't really recommend people to purchase InDesign just to check the glyph support of their fonts)</p>
