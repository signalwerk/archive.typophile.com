    date: 2006-10-31T16:56:00
    date_raw: 31 Oct 2006 — 4:56pm
    votes: null
    html: <p>Leaving politics out of the equation and thinking generally, I'd definitely try to go with something American, if possible. I'd suggest a bold sans-serif, preferably one with pretty subtle quirks so that it won't be too distracting (but some are good). It'd be nice if you could use a somewhat uncommon sans; the current administration is constantly being attacked for their terrible, Photoshop-esque banners, so an interesting typeface might be the first step to improving at least that reputation. A quick suggestion would be <a href="http://www.fonthaus.com/products/fonts/list_fontfamily.cfm/family/Metro_Sans" rel="nofollow">Metro</a>, a typeface that I'm personally looking at, designed by W.A. Dwiggins.</p>
