  html: |-
    <p>Hey all.</p>
    <p>I am a new font designer (though not new to the art of typography) and I have recently finished creating my first completed font. It's a TrueType font. It's a highly original and stylish display type of font. </p>
    <p>Anyway, I was thinking I was gonna try to make some money with it, and was wondering if anyone out there could offer some guidance and advice. Anything I should know about finding and working with a distributor? Do I need to make them sign something to keep from getting ripped off if they prove to be scandalous? (I'm always suspicious I guess)  </p>
    <p>I'd rather not have to market it myself even if I had my own website, setting up a shopping cart system etc..</p>
    <p>Thanks in advance.</p>
