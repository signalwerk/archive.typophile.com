    html: <p>Thank you for your opinion, gentlemen. Brandon or Futura, bottom right, will be one of the versions. The trident is a nice idea, but I'd rather keep the concept more minimal. The crossbarless A is an option, though. I dropped the idea of using the slab serif (Vitesse) also because of a competitor using it extensively. It's uncommon for a premium brand, so you notice it even better. As for that sentence, I guess you're both right!</p>
