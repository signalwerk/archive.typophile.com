    <p>This is one of the logo "sketches" for the yacht project management company (see my previous post). </p>
    <p>The client requested one direction to be particularly clean, modern, no gimmicks. Much like <a class="freelinking external" href="http://www.vertu.com/" rel="nofollow">http://www.vertu.com/</a>, <a href="/wiki/https%3A/%252Fwww.flyvictor.com/" class="freelinking" rel="nofollow">https://www.flyvictor.com/</a> or <a class="freelinking external" href="http://www.bang-olufsen.com" rel="nofollow">http://www.bang-olufsen.com</a>. </p>
    <p>Attached, two superposed versions. How does Frutiger hold up?  Knul in small caps looks a bit too playful to me, however it really works here  <a href="/wiki/https%3A/%252Fwww.blackjet.com/" class="freelinking" rel="nofollow">https://www.blackjet.com/</a></p>
