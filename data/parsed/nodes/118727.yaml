    html: |-
      <p>Personally I don't think I would choose a slab serif font; somehowdoesn't feel luxurious enough. The scriptish font (Mera Yachts) looks like it belongs on an outboard motor or a fishing reel. I don't think all lower caps is best for conveying luxury.</p>
      <p>I like the one in the bottom right corner best, but with only four letters you could also do a custom design. You're not limited to pre-designed fonts. If I were doing this, I would explore the resemblance of the M to a trident. (I would expect "Mera" will make most people think of "mer" sooner than "mehr".) Or I would remove the crossbar from the A and make the M look like two A's stuck together.</p>
      <p>Agree with JamesM. "If you can build yachts, why buy one from us?"</p>
