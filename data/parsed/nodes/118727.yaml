    html: <p>JL, is it possible to drop "yachts" and just work with "Mera"? Notice that Victor isn't "Victor Jets", Vertu isn't "Vertu Phones", Bang &amp; Olufsen isn't "Bang &amp; Olufsen Audio".</p>
