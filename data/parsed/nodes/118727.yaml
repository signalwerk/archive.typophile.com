    html: |-
      <p>You're right, Captain. I've considered dropping "yachts" (still do), then moved in another direction as I felt I was lacking "substance" just with the letters M-E-R-A. But then, it would be more memorable to integrate the idea of "more" or "beyond" into the logo, instead. </p>
      <p>Simplifying to one word, I believe the version using slab serif "Vitesse" would work well. Simple, solid, confident. Like Hermes, <a class="freelinking external" href="http://www.hermes.com/" rel="nofollow">http://www.hermes.com/</a>. Only disadvantage is one competitor using it already (not for their logo, though, but for headlines on their website). FF DIN could work as well, but less unique. </p>
      <p>Exploring a "handwritten" version was suggested by the client, inspired by the Bmw GranLusso logo. But I'll advise them not to proceed in this direction. It's out of context. </p>
      <p>What do you think?</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Mera2_5710.jpg"></div><p></p>
