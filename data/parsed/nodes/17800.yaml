      <p>Both the Danone and Dannon (see <a href="http://www.dannon.com/" rel="nofollow">here</a>) logotypes were originally Hobo or something similar, but it looks like they've been streamlined to look more modern. Not a font, most likely.</p>
      <p>Creamy is <a href="http://www.fontshop.com/index.cfm?fuseaction=catalog.fontdetail&amp;displayfontid=ITC.2563.0.0&amp;attributes.sampleSize=48&amp;sampleText=Creamy&amp;sampleSize=48" rel="nofollow">Bickley Script</a>. Silhouette is most likely hand lettered, not a font. Notice how the two e's and t's are not the same.</p>
