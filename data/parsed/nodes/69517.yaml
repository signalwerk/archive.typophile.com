    html: |-
      <p>I used Utopia in many projects during the past 12 years, usually exporting final version from ID to a PDF. The /fi/ff/fl ligatures were always exported correctly both from Type1 and OpenType fonts.</p>
      <p>Maybe there is a problem with the PDF export settings or the Utopia files are corrupted.</p>
      <p>Anyway, you can disable ligatures in Utopia without visible flaws. The short terminal in /f/ makes /fi/fl/ff/ ligatures very similar to the isolated characters.</p>
