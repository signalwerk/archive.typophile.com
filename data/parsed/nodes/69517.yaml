    <p>Hello</p>
    <p>My coworker was having an issue this morning with a PDF returned from our client. "fl" had gone missing from the beginning of one of the words. When we turned the ligatures off and tried another PDF, it was fine. Any idea why this happened?</p>
    <p>Thanks!<br>
    Natalie</p>
