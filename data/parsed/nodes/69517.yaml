    html: |-
      <p>ID uses ligatures by default, but in the case of an old (presumably Type 1) font, it has to rely on the font's character map to know whether or not there is any glyph in that position. If there is none, or if the font designer used that position to insert something else he thought would be useful (that would not be uncommon, given the limit on the total number of glyphs in a Type 1 font), you'll see nothing -- or a "wrong" glyph -- in InDesign, and in any PDF it generates.</p>
      <p>In other words: is there actually something on screen if you use this font in InDesign?</p>
      <p>(I would suspect there is not; there may be dodgy fonts that <em>look</em> good in ID itself but don't export, but I haven't ever seen it happen.)</p>
      <p>[Ed.] Gah! And Nick's link tells me you cannot rely on your PDF viewer either!</p>
