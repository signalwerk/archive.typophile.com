    html: |-
      <p>I just downloaded Utopia-Regular (<code><strong>putr8a.pfb</strong></code>) from the <a href="http://tug.ctan.org/tex-archive/fonts/utopia/" rel="nofollow"><strong>TeX-Archive Utopia directory</strong></a> which contains Version 001.001 with Copyright (c) 1989, 1991 that Adobe contributed to the X consortium many years ago. I ran the <code><strong>tx</strong> </code><a href="http://www.adobe.com/devnet/opentype/afdko/" rel="nofollow"><strong>AFDKO</strong></a> command on it:</p>
      <p><code>tx -pdf putr8a.pfb &gt; utopia.pdf</code></p>
      <p>Here is the resulting file (<a href="http://www.iro.umontreal.ca/~boyer/typophile/utopia.pdf" rel="nofollow"><strong>pdf 196K</strong></a>). The fl ligature is there, and is named fl. I doubt it would have disappeared in subsequent versions.</p>
