      <p>If your OS doesn't support them directly, you can put Type 1 fonts into the InDesign application folder in a special one called "Fonts". ID should be able to load it from there.</p>
      <p>(Ah -- CS5 ... it's been promised you can use "Document fonts" by copying them alongside the document, in the same folder, but word on the streets has that, of all things, Type 1s don't work. Can't help wondering why--)</p>
