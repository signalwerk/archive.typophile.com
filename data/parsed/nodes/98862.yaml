    <p>No, this post isn't about Gypsy Taub.</p>
    <p>I came across a preview of "The Naked Truth: From the Shadows of the Bible" on Google Books when doing a search for "Can't Take My Eyes Off You".</p>
    <p>I was able to find out that it was "Windy" by The Association that held that song back to the #2 spot, just as Lesley Gore's "You Don't Own Me" never got above #2, being sandwiched between two hits by a new group out of Britain... "I Want to Hold Your Hand" and "She Loves You (Yeah, Yeah, Yeah)" on its highest week.</p>
    <p>In any event, <a class="freelinking external" href="http://books.google.ca/books?id=lXWDZnersAAC" rel="nofollow">this book</a> has its body copy set in... Papyrus.</p>
