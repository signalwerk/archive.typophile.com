  html: <p>if you wanted to give someone five distinguishing characteristics to hgihlight the differences between Adobe Caslon and Adobe Garamond (other than the lower case g and a), what would they be?</p>
  html_clean: <p>if you wanted to give someone five distinguishing characteristics to hgihlight the differences between Adobe Caslon and Adobe Garamond (other than the lower case g and a), what would they be?</p>
