    html: |-
      <p>Uppercase P has a closed counter in Caslon<br>
      Uppercase G doesn’t have a nib in Caslon<br>
      Uppercase Q has a longer more flourished tail in Caslon<br>
      Uppercase S has different angles on the serifs (bottom is inward in Caslon)<br>
      Lowercase j has a ball terminal in Caslon<br>
      Tim</p>
