    <p>Hi all, I had a friend come here for help amazed with your speed and accuracy and I'm hoping I can get something similar!</p>
    <p>It looks like a handwritten type font that resembles what you would get if you were to write it out with a marker.</p>
    <p>This is where I originally got this picture from <a href="http://about.me/GregMcKeown" title="http://about.me/GregMcKeown">http://about.me/GregMcKeown</a> (unfortunately low res with limited character examples) and I'm trying to make some collateral that fits in with other material in that font.</p>
    <p>Appreciate any help in advance!</p>
