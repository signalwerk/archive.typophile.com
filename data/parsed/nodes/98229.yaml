      <p>Actually, the consumer is the last person for whom the symbol is necessary. Essentially, this symbol is used to identify a tolerance of inexactitude in weight or quantity, within which a company may trade. It avoids the possibility of formal complaint on the part of the consumer whose purchase turns out to be less than the specified quantity or weight, so long as it is within the allowed tolerance of the estimated amount specified on the package.</p>
      <p>Anyway, everyone feel free to use the estimated symbol outline that I provide, and use the time you save not making your own to do something truly creative (or rebellious).</p>
