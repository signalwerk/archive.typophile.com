      <p>In order to be useful, the sign has to correspond to the EU specifications, since its use is precisely in the domain of EU packaging regulations.</p>
      <p>Some years ago, I created a FontLab source containing just this glyph, carefully following the EU specifications, which is freely available for <a href="http://www.tiro.com/John/Estimated.zip" rel="nofollow">download</a>.</p>
      <p>It is worth putting this in your fonts because it will enable some European customers to check a box in their procurement requirements, even though they could get the glyph from numerous other sources.</p>
