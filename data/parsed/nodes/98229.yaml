    html: |-
      <p>I don’t see anything wrong with applying a slight veneer of styling to this glyph, as long as it’s in keeping with the spirit of the EU directive. After all, think of the Euro!</p>
      <p>Besides, package designers generally make it relatively large in relation to the accompanying text, so that it looks like the symbol it’s supposed to be, not just a big /e — and also because they have to bump up its size, as it’s a “didone” with hairlines that are in danger of disappearing.</p>
      <p>There may well also be some regulation about its mandatory size. In that case, maybe the didone effect is intentional, because it suggests to designers that they increase its size?!</p>
      <p>It’s a difﬁcult design—a symbol that is supposed to look like a symbol, and yet also suggest “e” for estimated and possibly “e” for European.</p>
      <p>Here’s the symbol in Myriad and my Richler typeface, at same size as the type, and enlarged:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Estimated_4356.png"></div><p></p>
