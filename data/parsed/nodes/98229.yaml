    html: <p>Yes, it is something like a logotype. The only variation I make when including it in fonts is to scale the outline so that it corresponds to the height of the lining numerals, since it will almost always be used in concert with them. I don't think it is something that needs to be in every font, and the reason it has become relatively common is that it was included in the WGL4 set, which was adopted as a basis for a lot of pan-European OT fonts.</p>
