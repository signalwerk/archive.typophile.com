      <p>Ryan, what you propose may or may not be 'just another e'. But one thing it definitely is not is an EU estimated symbol.</p>
      <p>Some people try to draw a parallel between this symbol and the euro sign, which also has an official reference form documented by the EU. But the difference is that the estimated symbol is legally required to have the specified form <em>in use</em>, and if a company were to use your Antique Olive Nord form in their packaging they could run afoul of trade regulations.</p>
    html_clean: |-
