  html: |-
    <p>Hi Typophiles,</p>
    <p><a href="http://typedia.com/" rel="nofollow">Typedia</a> could use your help. As more typefaces, designers, and foundries are cataloged, its missing pieces of reference information grow increasingly obscure and difficult to hunt down—for the average visitor. You, on the other hand, have particular expertise in knowing, for instance, the Release Year or Country of Origin of a particular typeface.</p>
    <p>Help build Typedia as a complete reference by participating in Font Fridays. Doing even just one <a href="http://typedia.com/good-deeds" rel="nofollow">good deed</a>, then <a href="http://typedia.com/blog/post/font-fridays-lettering-and-type/" rel="nofollow">leaving a comment</a>, can net you a new prize each week. This week it's a copy of <a href="http://typedia.com/blog/post/font-fridays-lettering-and-type/" rel="nofollow">Lettering &amp; Type</a>.</p>
    <p>Do a <a href="http://typedia.com/good-deeds" rel="nofollow">good deed</a>!</p>
    <p>Tim</p>
