      <p>Freiberger, </p>
      <p>there can be a /ToUnicode resource in the PDF which stores the true glyph-to-Unicode mapping, and there can be Tagged PDF structures that give a parallel true text contents. Thomas Merz of PDFlib explained this here:<br>
      <a href="http://typophile.com/node/2994#comment-140541" title="http://typophile.com/node/2994#comment-140541">http://typophile.com/node/2994#comment-140541</a><br>
      and more recently, Adobe's Miguel Sousa talked about this:<br>
      <a href="http://typophile.com/node/34108#comment-304550" title="http://typophile.com/node/34108#comment-304550">http://typophile.com/node/34108#comment-304550</a></p>
      <p>But the main point is that both PDF tags and the /ToUnicode resource are optional. There are and will be PDFs around that come without it, just with plain strings of glyphs in the page contents. For those, extracting the text contents from glyphnames is the only option. (For example, if /ToUnicode is missing, Acrobat will analyse the document add it when the document is resaved as PDF/X or when tags are added. That analysis is based on glyphnames).  </p>
      <p>Adam</p>
