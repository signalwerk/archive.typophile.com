      <p>Arno, </p>
      <p>1. I thought I explained it already twice: </p>
      <dd>PDF readers will know that <code>“A.c2sc”</code> stands for a smallcap version of the <em>“A”</em> character, while <code>“a.smcp”</code> stands for a smallcap version of the <em>“a”</em> character. This way, copy-paste and searching will still work properly even if the text is set in smallcaps.</dd>
      <p>In other words: if you want to preserve the case difference of the original text in the typeset PDF even if the text is set is smallcaps, you would duplicate the glyphs. Specifically: the searchability and copy-paste of the PDF will work the same regardless of whether the PDF was created with Unicode codepoints included or without them. </p>
      <p>If you include just one set of smallcap glyphs, let’s say <code>“A.sc”</code>, and use them in both the <code>“smcp”</code> and <code>“c2sc”</code> features, then copy-pasting smallcap text from one PDF may result in the text “Arno Enslin” (if the Unicode codepoints were embedded in the PDF) while doing it from other PDFs (where the Unicode codepoints were not embedded) would produce “ARNO ENSLIN”. </p>
      <p>Duplicating the smallcap glyphs is Adobe’s practice, very sensible in my opinion. Using kerning classes and CFF subroutinization will cause the font be only minimally larger than if you don’t duplicate them, but the functionality of the font will be more consistent. </p>
      <p>Adobe recommends including separate glyphs if the Unicode character information should be maintained separately. This also means that Adobe includes separate glyphs for U+002D (-, HYPHEN OR MINUS SIGN) called <code>“hyphen”</code> and for U+00AD (DISCRETIONARY HYPHEN) called <code>“uni00AD”</code>, and also separate glyphs for U+2126 (Ω, OHM SIGN) called <code>“Omega”</code> and for U+03A9 (Ω, GREEK CAPITAL LETTER OMEGA) called <code>“uni03A9”</code>. </p>
      <p>Some font vendors tend to assign multiple Unicode codepoints to one glyph if the glyph looks the same for several Unicode characters, and they use the same glyph in OpenType Layout features even if the underlying text character is different. This is a matter of policy and practice. At FontLab, we recommend following Adobe’s policy because it has important technical reasons (which I detailed above) and results in fonts that behave more consistently and provide better functionality for the end-user — even if producing such fonts (with duplicated glyphs) is a bit more tedious. </p>
      <p>2. “Meaningful” glyphnames are glyphnames in which the basename (i.e. anything up to the optional suffix which is separate by a dot) can be resolved to a Unicode string. Each component of the basename (i.e. either a single portion or several portions separated by underscores in case of ligatures) should follow the Adobe glyphname conventions, i.e. they should either be in the Adobe Glyph List for New Fonts (AGLFN) or have a <code>“uniXXXX”</code> form for four-digit Unicodes and a <code>“uXXXXX”</code> form for five-digit Unicodes. This means that names such as <code>“aacute”</code>, <code>“aacute.smcp”</code>, <code>“aacute.whatever”</code>, <code>“s_t”</code>, <code>“sacute_t”</code> or <code>“s_t.dlig”</code> are all meaningful, but <code>“aacutesmall”</code>, <code>“st”</code> or <code>“sacutet”</code> are not. </p>
      <p>Please read the FontLab Studio manual chapter for more information as well as the Adobe document that I linked in my earlier post. </p>
      <p>I recommend reading the manual in general, anyway (not just the ”Glyph Naming and Character Encoding” chapter), because it *does* include important information on various topics related to font development. </p>
      <p>The suffix after the dot doesn't matter. <code>“i.TRK”</code> and <code>“i.dotless”</code> are equally meaningful. The advantage of using <code>“i.TRK”</code> is that future FontLab applications such as Fontographer 5.1 will recognize this name and build the <code>“locl”</code> OpenType Layout feature automatically. </p>
      <p>Similarly, using <code>“A.c2sc”</code> and <code>“a.smcp”</code> rather than, say, <code>“A.sc”</code> and <code>“a.sc”</code> will allow Fontographer 5.1, TransType 4 and FontLab Studio 6 to build the <code>“c2sc”</code> and <code>“smcp”</code> features automatically since the suffix will indicate which OpenType Layout feature the glyph “belongs to”. </p>
      <p>BTW, the reason why the OHM SIGN and not GREEK CAPITAL LETTER OMEGA carries the glyphname <code>“Omega”</code> is historical and clearly looks somewhat inconsistent. But it’s just a glyphname, which, as I indicated, is primarily intended to allow the glyph being identified properly in the PostScript and PDF formats. This is why the glyphnames in an OpenType TT font is stored in the <code>“post”</code> table. Since glyphnames are for PostScript and PDF, they should primarily conform with recommendations developed by the creators of PostScript and PDF — which happens to be Adobe. </p>
      <p>FontLab’s glyphname conventions and recommendations are compatible with Adobe’s, but are a bit more specific: they provide additional guidance which will help font developers get additional functionality (i.e. automatic OpenType Layout generation in our upcoming applications). Since our applications will soon ship with an additional set of new encoding files, adhering to FontLab’s conventions will allow developers to use those encodings. </p>
      <p>Of course, font developers can use different glyphname suffixes which are not compatible with FontLab’s recommendations, as long as they follow Adobe’s recommendations for glyph basenames. This will result in PDF-compatible glyphnames but may not leverage the full functionality in our new applications.</p>
