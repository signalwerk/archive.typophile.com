      <p><cite> after copy-and-append a set of glyphs in FLS5, how can I change the suffix of the whole set in an automatic way? Is this posible? </cite></p>
      <p>command click on the glyph.<br>
      From the 'more' submenu choose 'add suffix to name' and check the first checkbox in the resulting dialog box.</p>
      <p>I recommend also checking the second box so you are presented with the dialog box by default when you append glyphs.</p>
      <p>André</p>
