      <p>Claudio -- You asked about where to read more on Dwiggins. Tiffany Wardle's dissertation (which Antonio linked above) is a good primer on a few of his designs. Gerard Unger wrote an article about Dwiggins's Experimental No. 223 newspaper design in <cite>Quarendo</cite> xi, 4 (1981), which also discusses the M-formula at some length. It's been a while since I read both of these, but I seem to recall that there are some background elements to the M-formula that aren't drawn out. </p>
      <p>But, of course, there's much more to Dwiggins than just the M-formula. A good overview of his other type designs can be found in Walter Tracy's <cite>Letters of Credit</cite>. </p>
