      <p>Many thanks to you all!<br>
      It's really a good thing to read yor reflections: far from being uselessly "intellectual", they help me to understand and work more consciously. I'm sorry I missed an Eben Sorkin and a Kent Lew for such a long time… :=)</p>
      <p>Yes, I was tricked by Hrant's use of the world, which as I recall was often deprecatory.<br>
      <cite>[…] Hrant used “chirography” in a different discussion on the same list, and essentially as a slightly broader substitute for “calligraphy,” meaning an approach to letter formation that relies upon the logic of the hand.</cite><br>
      If we use "chirography" to indicate the inherent features of a writing instrument, it's clear that, as we stylize more the alphabet, we get past those.<br>
      But, (as I do not see typography as something "basically" different than "handwriting"), we should recall that letters, stylized as much as they can be in their "flesh", are forms with "skeletons" defined by the hand.</p>
      <p>I have looked into an Italian etimologic dictionary, and I have found the word "chirògrafo", which means:<br>
      "document written by hand (XIV century, volgarized by St. Gregory the Great)".<br>
      The etimology is indicated as coming from the Greek "chéirógraphon" ("manuscript"), composed by "chéir" ("hand") and -graphon.</p>
      <p>Since we are still using mouses with our hand, I find the word as in this "jargon" use, still not so suitable to underline what Hrant deprecated in typefaces. :=)</p>
