    html: |-
      <p>Kent: "The willfully coarse finish of Menhart and Preissig comes from a desire to infuse energy into traditional letterforms while [...] stripping them of any excess typographic baggage."</p>
      <p>I think the infusion of energy fonr the course finish, uploaded so much baggage, they had few places to go.;)</p>
      <p>"The yin/yang of the geometric vs. the organic is an ages-old formal dichotomy that can be found interspersed throughout the history of visual culture"<br>
      I think the real cool thing is not geometric VS.. the organic, but geometric AS organic. That is to say, when something of organic origin, moves to being represented in a geometric construction, without becoming ying/yan-ed, so to speak.</p>
      <p>John H.: "I certainly didn’t invent the word ’chirography’[...] But [...] as an aesthetically neutral term meaning simply hand-writing (as distinct from ’calligraphy’, which he had been using, which implies a specific class of writing as art)."</p>
      <p>I liked this part. Because it asks one to specify language, script and style, or make no sense. </p>
      <p>"Chirography adapts to an adjective, chirographic, that may be considered more abstract than ’handwritten’, so one can apply it more easily to describe qualities of things that are not, in fact, written by hand."</p>
      <p>But I want terms for three kinds of type:<br>
      1. represents a style of writing that could be written, with a single tool from a single position. (Zapf Chancery Italic)<br>
      2. represents a style of type not completely written, but made with a single tool from a few positions. (Times)<br>
      3. represents a style of type that requires multiple tools and positions, and writing is not being represented. (Eurostyle).</p>
      <p>Is that Calligraphy, Chirography, and Construgraphy?</p>
      <p>"(And if I spent less time on these forums, I’d get more work done.)"<br>
      Maybe, maybe not. I'm hardly one to talk, and it's hard to tell. I have a bell that rings every 15 minutes and so i almost have to go.</p>
      <p>"But we would not learn nearly as much."<br>
      Yeah, you'd have to buy the fonts otherwise. ;)</p>
      <p>As Carl points out, a funny thing about this trend is that printing is good. The M-theory's main usefulness now is to add something, sparkle, that previous generations didn't want at large sizes, and couldn't get at small sizes, without writing it. . .</p>
      <p>Cheers!</p>
