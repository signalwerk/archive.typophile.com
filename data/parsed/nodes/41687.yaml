      <p>The c of Yale that I posted in the <a class="freelinking external" href="http://dev.typophile.com/node/41301" rel="nofollow">Why Bembo sucks</a> thread has a bit of that effect, though there you might consider the counter notch to be simply the beginning of a serif.</p>
      <p>To my eyes (when blown up big, anyway), I start to see a three-dimensional fold from that combination of cut and curve. Almost like a subtler version of <a class="freelinking external" href="http://www.myfonts.com/fonts/urw/calypso/" rel="nofollow">Calypso</a>! Can't you imagine, for example, the inside curve on the right side of the o you posted coming down past the notch at the bottom of the counter and sweeping tangentially into the outside curve of the left side of the letter?</p>
