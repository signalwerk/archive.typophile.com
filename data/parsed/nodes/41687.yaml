      <p>Eben,</p>
      <p>I think it's worth considering (maybe for a longer essay than a typophile review) that there are some very different origins here, that are easy to confuse or conflate: The pen artifact in counters which comes about from tight or small letters written with wide pens, and the M-theory of Dwiggins, which, you can see by inspecting his drawings, does not really follow calligraphic logic at all. For example, he carved out space near the ear of a g where no pen would ever leave a notch. His interest was in creating exceptionally clear type at small sizes; avoiding clots and making something small read correctly at its native size. The impulse to include calligraphic artifacts can seem similar, but if you keep looking, I'm sure you'll find examples of calligraphic artifacts like these that actually obscure or mar clarity in small sizes; in other words the 2 origins may not be linked at all. Look at the bolder weights of Trajanus. There's a consistent calligraphic logic here, but not necessarily a high priority on clarity at small sizes. One approach might actually work against the other.</p>
      <p>The funny thing about this trend is that printing conditions are so good, the M-theory has much less usefulness than in hot metal days. Remember, Dwiggins designed for the foundry with the most business in book typesetting. Type wasn't scalable, and display type didn't use these tricks; they were meant to be hidden. Much of the typography now that features these adorable quirks is explicit display layouts, in magazines, meant to show off the cuts and angles.</p>
    html_clean: |-
