    date_raw: 4 Feb 2008 — 5:30pm
    votes: null
    html: "<p>There's a touch of it in <a href=\"http://fontbureau.com/pdf/Prensa.pdf\" rel=\"nofollow\">Prensa</a> and a bit more in <a href=\"http://fontbureau.com/pdf/Quiosco.pdf\" rel=\"nofollow\">Quiosco</a>. The upper stem of the \"a\" and \"c\" are quite obvious, but there's a slight change in direction in some of the Prensa bowls and a stronger but rounded cut in Quiosco's. Font Bureau's site talks about this explicitly as the Dwiggins' influence: <em>Spanish for press, Prensa is a new series from Cyrus Highsmith, who arrived at this family’s character through his process of ‘wrapping outside curves around the inside, deliberately creating tension between the two,’ a technique epitomized in Electra, a 1935 bookface by twentieth-century master W.A. Dwiggins. This tension really appears in the italics, which stray from the traditional forms to balance simplicity with vitality.</em></p>"
    html_clean: "<p>There's a touch of it in <a href=\"http://fontbureau.com/pdf/Prensa.pdf\" rel=\"nofollow\">Prensa</a> and a bit more in <a href=\"http://fontbureau.com/pdf/Quiosco.pdf\" rel=\"nofollow\">Quiosco</a>. The upper stem of the \"a\" and \"c\" are quite obvious, but there's a slight change in direction in some of the Prensa bowls and a stronger but rounded cut in Quiosco's. Font Bureau's site talks about this explicitly as the Dwiggins' influence: <em>Spanish for press, Prensa is a new series from Cyrus Highsmith, who arrived at this family’s character through his process of ‘wrapping outside curves around the inside, deliberately creating tension between the two,’ a technique epitomized in Electra, a 1935 bookface by twentieth-century master W.A. Dwiggins. This tension really appears in the italics, which stray from the traditional forms to balance simplicity with vitality.</em></p>"
