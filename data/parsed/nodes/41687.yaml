    html: <p>I certainly didn't invent the word 'chirography', which has been around for a good while. But I was the first to suggest it to Hrant as an aesthetically neutral term meaning simply hand-writing (as distinct from 'calligraphy', which he had been using, which implies a specific class of writing as art). Why say chirography instead of simply handwriting? Chirography adapts to an adjective, chirographic, that may be considered more abstract than 'handwritten', so one can apply it more easily to describe qualities of things that are not, in fact, written by hand.</p>
