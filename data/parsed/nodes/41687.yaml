      <p>Eben -- Well, since the deadline for those reviews was yesterday, I presume you found what you were looking for. </p>
      <p>Carl draws out a point that I was thinking about (and which was sort of underlying my query as to your interests). When it comes to features like we've been discussing here, there are a variety of motives and precedents. It put me in mind of some things I said in a Typophile thread from many years ago. So, for what it's worth, I'll direct your attention to </p>
      <p><a href="http://www.typophile.com/node/5303" title="http://www.typophile.com/node/5303">http://www.typophile.com/node/5303</a></p>
      <p>Not surprisingly, that thread is wide-ranging and it takes a little work to follow the sub thread that pertains to our current topic. So, I'm taking the liberty of quoting some of my own [extensive] comments here. I hope you all will bear with me.</p>
      <p>----------</p>
      <p>23 June 2004</p>
      <p>I think that what A. Scott was referring to is what I have called a "digital vernacular" -- a quality of simplified and often unexpected geometry being applied in otherwise traditional forms. From my perspective this trend traces back through faces like Downer's Vendetta (1997) and Majoor's Scala (1991) to van Blokland's Proforma (1988) and Carter's Charter (1987) and ultimately to Unger's Swift (1985). Pre-digital influences include Dwiggins's experiments on the one hand and the Czech "school" (Menhart, Preissig foremost, Tyfa also) on the other.</p>
      <p>It strikes me that there are two threads of motivation in these precedents -- one technical and the other aesthetic. The early digital faces I cited were, as Nick pointed out, to a large extent confronting technical constraints, and their simplified geometry comes from efforts to create robustness in the face of coarse resolutions, as well as to conserve memory. The character that comes through is influenced strongly by the problems set before the designers.</p>
      <p>The other thread is an aesthetic one. The Czech designers were essentially operating within the general "expressionist" zeitgeist. The willfully coarse finish of Menhart and Preissig comes from a desire to infuse energy into traditional letterforms while at the same time stripping them of any excess typographic baggage.</p>
      <p>Dwiggins, in his own way, was also motivated primarily by aesthetic concerns. His experiments in what he called the "M-formula" were foremost an attempt to infuse a certain "snap" and "action" to the letterforms. His newsface efforts also professed to combat certain optical/technical constraints as well. But I think primarily he was exploring a type aesthetic that was influenced by his own cultural milieu -- Art Deco and Cubism, among others. This aesthetic is seen more overtly in his stencilled ornament and illustration.</p>
      <p>Nowadays, the technical constraints facing Unger and Carter are largely overcome (at least in print), and yet Swift and Charter still seem fresh and vital. The continued exploration of this formal territory in contemporary designs seems primarily for aesthetic effect.</p>
      <p>Speaking for myself, there is a fascination with taking seemingly inexpressive, reductive elements -- straight lines and simple curve segments -- and carefully combining them to create an unexpected grace or an organic tension. The yin/yang of the geometric vs. the organic is an ages-old formal dichotomy that can be found interspersed throughout the history of visual culture. The trend that we see in some contemporary type designs is just another expression of that exploration.</p>
      <p>I use the term "digital vernacular" because this kind of expression seems to embody an inherently digital aesthetic: there is a sense of "truth to the material" that is appealing. I say <em>"seems to"</em> because strictly speaking, of course, this isn't true at all -- there is nothing about beziers that lends them more to straight lines or simple curves; in fact, the wonderful inventiveness of bezier curves is exactly the opposite, that they can be so complex and supple.</p>
      <p>Similarly, there is nothing inherent in the woodcut medium that demands the rough, coarse cuts of the Expressionist work of Kirchner as opposed to the fine detail of engravings by Bewick, for example. And yet the raw woodcuts seem to evince a greater "truth to the material."</p>
      <p>----------</p>
      <p>26 June 2004</p>
      <p><cite> &gt; @addison: And Kent, I really am interested by your take on the "truth in materials" because it's usually associated with an "unfinished" quality (coarse cuts in a wood print, visible strokes in a painting, loose lines in a drawing...). I use the word "unfinished" for lack of a better word--I would never call a Van Gogh unfinished. But could this same quality be applied to type? </cite></p>
      <p>Well, I think this is part of the current appeal of the "digital vernacular." There is a sense of immediacy in the forms, a sense of seeing the "raw materials" or being closer to the process, in some cases.</p>
      <p>This notion was part of the philosophical underpinnings of many modern movements in visual art, beginning perhaps with the Impressionists and culminating in the Abstract Expressionists (think Pollock and DeKooning) and Color-Field painters (Morris Louis, Helen Frankenthaler, Paul Jenkins).</p>
      <p>The Bauhaus had a strong "materials" ethic, which had a profound influence on architecture and graphic design. I am not surprised to see this theme appear in contemporary type design.</p>
      <p>But, as I alluded to earlier, in many cases this is really a charade. In a digital medium, "truth to material" becomes a nebulous thing. When Bezier curves can easily be made to represent smooth, supple, and complex forms, why should simple geometric forms seem more "true" to the medium?</p>
      <p>I'm not sure why coarseness and unrefined characteristics are viewed as somehow more integral to the nature of a material. But there it is. And the modern era has often explored the dichotomy between the coarse and the refined, between the raw material and the conceptual idea.</p>
      <p>It seems to be a perennial fascination. </p>
      <p>----------</p>
      <p>-- Kent.</p>
