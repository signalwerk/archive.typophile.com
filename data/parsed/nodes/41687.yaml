      <p>I think he was interested in making a distinction between font designs whose shapes were completely (or nearly so ) determined by the logic offered by pen strokes and those shapes were not. This distinction is not his. The term was not invented by him either. Take a look here:</p>
      <p><a href="http://en.wikipedia.org/wiki/Chirography" title="http://en.wikipedia.org/wiki/Chirography">http://en.wikipedia.org/wiki/Chirography</a></p>
      <p>In contrast, if decide what shapes to use based only on what you thought would help the design to work that could be called a-chirographic. This does not imply a specific solution or a specific alternative visual model but an approach to font making. That kind of design might be called Typographic in it's orientation although the term itself doesn't carry that specificity in it's meaning yet.</p>
      <p>Hrant is keen on the work of Blosema, and Fleischman and has held them up as contrasting examples. Look at the Dwiggin examples here on this thread. I think They meet Hrant's criteria too. As does Kent's design. See also the Carl Crossgrove's post above. It is excellent.</p>
      <p>But you associate him with the term and the reason is constant use. My impression is that he has been the most vocal champion of the idea that type designers - especially of text faces - should avoid excessive reliance on Chirographic logic. Hence his repeated use of the word. For him it is a kind of derogatory epithet.</p>
