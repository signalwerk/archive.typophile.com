      <p>Cutting glyphs out of slices of potato with a small sharp knife will lead to a certain type of font.<br>
      Doing the same with hardgrained wood and a chisel to something else.<br>
      Building a font with Lego-like parts id ib.</p>
      <p>My point: the tools define the result. Using basic forms to construct type has been around for a while (see Ungers experiments a la Decoder and his subsequent fonts, also Fred Smeijers’ insightful Counterpunch). </p>
      <p>Fooling around with a selection of interesting shapes is very easy on a computer. But if this leads to better typefaces? I wonder…</p>
      <p>One prediction: real blurry fonts are the next hip thing. Especially ones that morph realtime.</p>
      <p>. . .<br>
      Bert Vanderveen BNO</p>
