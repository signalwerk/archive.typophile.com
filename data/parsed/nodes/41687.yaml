      <p>piccic <em>but referring heavily to devices related to writing instruments does not automatically make a typeface worse, as it seems to be partially implied by the use Hrant made of the word.</em></p>
      <p>Hrant loads the terms with his ideological prejudices*, but that doesn't invalidate the usefulness of the term. For me, the term is simply descriptive of particular qualities that may be present in type design in greater or lesser degree. The argument about whether those qualities are desirable or not is another matter.</p>
      <p>* Since ideology and prejudice are commonly taken as having negative connotations, I should point out that, in respect to Hrant's opinions, I do not intend them as such. Hrant takes ideology seriously.</p>
