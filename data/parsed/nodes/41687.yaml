      <p>Okay, having dragged poor unwitting John into this, I feel compelled to set the record straight. </p>
      <p>On 4 Nov 2002, John Hudson did indeed introduce the term "chirographic" in an e-mail list discussion about the works of Gerrit Noordzij (which grew out of the ATypI list). He was attempting to construct an analytic framework for understanding Noordzij ideas in <cite>Letterletter</cite>. </p>
      <p>"Writing" is a key concept in Noordzij's essays. John was scrutinizing the use of the two terms "writing" and "calligraphy," which he felt were used in an ambiguous relationship. He noted that "calligraphy" had some underlying stylistic connotations which he felt led to misinterpretations of what Noordzij might have been saying. He introduced the broader (and less heavily laden) term "chirography" in the context of trying to map some of Noordzij's interrelated concepts of typography and writing:</p>
      <p><cite>"A less common English word is chirography, literally 'hand writing', which<br>
      has its own adjective, chirographic, although the latter usually refers<br>
      simply to the fact that something has been written by hand, rather than to<br>
      any aesthetic or structural qualities of the writing."</cite></p>
      <p>[I hope John will forgive me for this direct quote without permission.]</p>
      <p>Later, in mid December 2002, Hrant used "chirography" in a different discussion on the same list, and essentially as a slightly broader substitute for "calligraphy," meaning an approach to letter formation that relies upon the logic of the hand. He added a footnote and said: <cite> "* Thanks, John. This is what I've decided to use from now on."</cite></p>
      <p>The typo-argot meaning of the term that we now encounter in Typophile discussions grows directly out of Hrant's constant employment of the term for his purposes (somewhat like "bouma").</p>
      <p>There you go: lexicography happening right here in our very midst.</p>
      <p>-- K.</p>
