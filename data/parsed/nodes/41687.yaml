      <p>There has been an excellent sample of this style on the crit boards, called <a class="freelinking external" href="http://dev.typophile.com/kompilat" rel="nofollow">Kompilat</a>. And  <a class="freelinking external" href="http://www.textaxis.com/img/posters/suse_pos.gif" rel="nofollow">Suite Serif</a> from Textaxis also has it. So does <a class="freelinking external" href="http://www.derfaber.ch/ganzeseiten/Projekte/Schrift/gschrift1.html" rel="nofollow">Nomad</a> from Derfaber (direct <a class="freelinking external" href="http://www.derfaber.ch/BILDER/PROJEKTE/NEU/Nomad.pdf" rel="nofollow">link to pdf</a>). And one of my favorites is probably <a class="freelinking external" href="http://www.jarnolukkarila.com/template.php?yksikko=format_design&amp;sivu=font_library&amp;alasivu=xtra_sans&amp;lang=en&amp;catID=1" rel="nofollow">Xtra  Sans</a> by Jarno Lukkarila, which I think is very well executed.</p>
      <p>I found these a while ago when I did a bit of research for my own experiment with the kinks. I don't think it's appropriate to plug the url here, but it's on the sans serif crit boards. But I definitely have a weakness for this style. I haven't really found any others than the ones I mention above.</p>
