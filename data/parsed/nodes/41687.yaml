      <p>Eben --</p>
      <p>I'm not certain that I understand exactly what you're looking for. But to the extent that I think I do . . .</p>
      <p>Xavier Dupré plays with this sort of construction a lot, so in addition to your Malaga example, you should be sure and look at Absara.</p>
      <p>John Downer has also done some work in this vein. Look at Paperback and Vendetta. Oh, and Sam Sans.</p>
      <p>Jeremy Tankard has some of this sort of thing going on in Enigma and Shaker (especially in the italics).</p>
      <p>Matthew Carter has used some of this kind of construction, but only very subtly. In addition to the little bit from Yale mentioned above, you can see some of this in Alisal, Charter, and Fenway (again, especially in the italics).</p>
      <p>I've been known to play a bit with this sort of thing myself. The arch of Whitman is well-known. I continue to explore it in some of my designs in development. However, I don't usually take this approach to round counters, focusing instead on arches. (But you're probably only interested in finished, published examples.)</p>
      <p>Is this the sort of thing you're looking for?</p>
      <p>I can generate images later, if you don't have access to some of these. But I don't have time right now.</p>
      <p>-- K.</p>
