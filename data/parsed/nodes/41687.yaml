      <p>"For which reason do you say that?"</p>
      <p>Claudio, on Typophile for years it seems to me we have been asking, and re-answering, the question "What is chirography?". Shouldn't this just be a wiki node?  In contrast, I think the origin, application and results of this M-theory of Dwiggins, are very important for type designers to understand, and I think the original explanation of it is best, but somehow this information is not so easy to find. So many type designers now are happily mimicking forms they see without necessarily understanding their origins or purposes. This kind of surface appreciation could allow one to see mechanical pen artifacts as interchangeable with intentional optical tricks. Especially now that so few have familiarity with any hand-written techniques, I feel it's important to keep these ideas illuminated.</p>
