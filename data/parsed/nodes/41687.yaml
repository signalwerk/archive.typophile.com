      <p>Gosh, thanks for the votes of confidence, all. This project hasn't been active since last summer. (And the previous hiatus was three years.) I wasn't necessarily thinking of picking it up again. But you never know.</p>
      <p>Eben -- I'm not sure what you want to know about the g; I don't quite follow your question about ink. This design has some much of its structural roots drawn from an unreleased Dwiggins face (why are you not surprised? ;-) which in turn was inspired by a small Rosart sample that WAD saw in Updike. So, that ear shape traces back to some Dutch oldstyle traits -- Fleischmann and Rosart -- reinterpreted through my personal stylistic filters.</p>
      <p>I don't know if Charter was the first example of "sheared ball" (or "half teardrop" or whatever you want to call it) terminals. I've pretty much absorbed and internalized this style device, so I no longer think of it as emulating anything else. But if I look back for possible influences, this is the earliest example that comes to mind.</p>
      <p>-- K.</p>
