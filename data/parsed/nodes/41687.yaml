      <p>I think we can get in to a dilemma if we apply too much of the philosophical reasoning of past design eras to working today. Modernist "true to material" philosophy perhaps was behind the visual outcome of much of their work historically but, as Kent points out, does not have to apply today. That is to say the reasoning does not ring true but does not mean some of the visual outcome (such as the cut look being discussed) cannot be used for whatever other reason contemporary designers may have for it. It does not even need a philosophy in vogue today as a rationalization.<br>
      In my case, I just used it as a means to solve a visual problem--how do I make a join that does not have much room (as in a bold counter) but not make it look too soft for the rest of the face. There was no philosophical meaning or pen logic or truth to the medium. It was just trial-and-error problem solving.<br>
      Dwiggins may have had his own reasoning and it may have fit his own philosophical thought but I will leave it to the real Dwiggists to comment on that. I do think techniques used in the past are still open to use in the present regardless of past practitioners reasoning. There have always been and are sure to in the future, coincidental rediscoveries of techniques often even without awareness of the older usage. We will never know how many times the wheel was invented or how it came about. Perhaps one time was philosophically mimicking the round Sun as a deity and another, more pragmatic time, a eureka while watching a rolling stone gathering no moss.<br>
      My point is that it is not so much an issue of what was or is in vogue as it is what problem does a given technique solve for the designer. Necessity can always be the mother of invention where philosophy requires buying in to its principles before you act on them.</p>
      <p>ChrisL</p>
