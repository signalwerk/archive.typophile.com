      <p>Stewf, hey yeah! Sorry about the FF all! I don't think I can fix it without reordering/confusing the sense of the thread though.</p>
      <p>Tiff, yes. Solid stuff that. And I agree. And actually, that's a reference that César Puertas’ has acknowledged to me as well.</p>
      <p>David, How would you suggest putting it instead? Would it be better if I said bowls?</p>
      <p>Craig, Actually the Yale italic has more still! Nice. In addition to the c it has an a the upright has an a sor sure and almost an s defending on where you draw the line. Nice! </p>
      <p>I agree with what you are saying about the quasi 3d thing. I think it is partly a pen related effect although in urbana it starts to feel also like tape or ribbon or something thicker like taffy. I say pen because partly because if you look at Sheila Water's calligraphy ( and lots of other folks too ) you can see the same structure and in a more pronounced way than is typical of a font. This is true from her humanist miniscule to her blackletter. So I think it's a kind of chirographic echo. Not that these fonts are (or are not) "chirographic" ( separate issue) but I certainly I think they are they are drawing on that history/structure to some extent.</p>
