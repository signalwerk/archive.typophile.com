      <p><em>@John: OK, but “chiro-” is “the hand”, while the “cut and curved” systematized in the M-theory is not simply a thing “borrowed” from calligraphy but — from what I have read in Tiffany’s PDF about Dwiggins — is beyond that, it’s a reflection upon the variability between different elemets in order to create tension and features that makes things more attractive and more functional as well (I dare saying “more wholesome”?).</em></p>
