    <p>Perhaps this has been addressed but i can't find it.</p>
    <p>Same font, OTF (postscript flavor) or TTF doesn't matter. On a mac baselines sit higher in the text box than PC. The flash devs are telling me this is a "known issue" with flash. But I'm wondering if there is something I'm missing in the Font Info panel in Fontlab.</p>
    <p>Or, if you'd suggest a workaround that wouldn't suck in a multi-platform team environment. (Ditching flash is not a workaround in this case, sadly)</p>
