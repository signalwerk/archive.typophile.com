      <p>Thanks Adam. Unfortunately tried John and Karsten's approaches to no avail. </p>
      <p>Turns out it was not the font metrics or a mac/pc problem, but a dynamic text field bug when using shared runtime fonts in flash. Specifically if someone touches the field who does not have the font locally for preview. Nuke the fla and install the font on the offending machine for preview... fixed in the build.</p>
      <p>Cheers!</p>
