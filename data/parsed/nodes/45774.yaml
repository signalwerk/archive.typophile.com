    <p>Hi everybody,</p>
    <p>This is my first post, though I have followed the learned discussions on Typophile for some time. I would like to submit for criticism this logo that I am developing. The client is a sort of web based "job agency" for companies.</p>
    <p><em>Invenio</em> is Latin for "I find".</p>
    <p>All comments and suggestions are welcome.</p>
    <p>Yours,<br>
    Måns</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/sketch1_invenio_5238.gif"></div><p></p>
