      <p>You've got a good concept going on here, but your solution is backwards I think.</p>
      <p>You're using the letter 'v' to make a compass, I believe you'd have better luck using a compass to make the letter 'v'.</p>
      <p>try focusing on making a solid compass shape and substituting the 'v' for the southern pint of the shape, see if that helps!</p>
