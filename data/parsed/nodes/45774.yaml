      <p>Hi. I think the 2nd example in caps works the best.  Maybe as a suggestion you could make a version with a less bold font, to see how that works out. Also in the 2nd version, is the V point the actual V of the font?  Maybe if it is you could look at making the compass something less like the V and more like a compass point.  I think as long as the point looks something 'like' a V then you would get away with it not matching the font as such.  Did that make sense?  Like the idea though.</p>
      <p>JH</p>
