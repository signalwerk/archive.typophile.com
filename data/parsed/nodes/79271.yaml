  html: |-
    <p>Hello, this is my first time crowdsourcing the Typophile community for help with ID'ing a font, so I hope you can help me. </p>
    <p>The type I'm looking for was used on a lot of instrument panels in the 1950's and 1960's, (please see photo for reference). It has a very antiseptic, technical quality to it, similar to OCR B (although I know that's not the one.) </p>
    <p>If you can hunt this one down or other typefaces that have the same feel, I would be most appreciative. </p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/MilgramMachine_4327.jpg"></div><p></p>
