    html: <p>Fascinating request - I was just about to ask the same thing! I was in a hospital emergency room last night (don't worry, nothing that serious) and I saw the exact same etched typeface, with the distinctive /G/ and the clean style. Doubt it's been digitized or even existed outside whatever signmaking machine produced these, but learning their history would be very interesting.</p>
