      <p>Goodness. I just realized that if this question comes up here, it is likely for a design major.I like TNR more than most folks on the forum, but I think if I got such an uninspired layout from someone, I'd dock points just for using defaults.</p>
      <p>Several years ago, "Someone I know" wrote three essays on an identical subject, with approximately the same length, similar citations, and equal time and effort put into the mildly different outlines, drafts and finals. To complete the appearance of multiple authors, each was set differently. There was no printed style guidelines. One was TNR, one was Garamond, and the last was Verdana.</p>
      <p>The deceit was never noticed by the teacher. The grades and comments were as follows:</p>
      <p>Times New Roman: A "Excellent notes"<br>
      Garamond(?): A "Excellent"<br>
      Verdana: B+ "Hard 2 read - use a regular font."</p>
      <p>When I read that fadtastic.net article last week, it reminded me of those results back in Intro to Ethics.<br>
      :)</p>
