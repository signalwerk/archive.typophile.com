      <p>Lido--and perhaps something like Plantin as well--are similar enough to Times to satisfy both the demand for Times, and your own desire for something different. Taking a little bit of the leading and the margins will only improve it as well without upsetting anyone. However, keep in mind that few teachers actually look at the design of the paper, so your arguments, evidence and use of language are perhaps more worthy of your time in this case.</p>
      <p>From my own teaching and grading experience, the Times &amp; double spacing rule is still a lot better than what most students (not design) come up with on their own. I think few teachers would actually mind typography that's an improvement over the standard rules, but what many students come up with just makes for even worse reading. Arial is not meant for 15 page-essays, and a sufficiently poor printer will make a poorly readable mess out of MT Garamond any day.</p>
