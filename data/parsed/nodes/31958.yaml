      <p>Yes, he was quite the teacher. Hours upon hours of going over whether or not to bold second level headers. I think that rather than try to teach us to think for ourselves about the logical progression across the different levels of headers, he was attempting to give us a fool-proof template, which would have been fine if he'd actually given us something... </p>
      <p>However, what it boiled down to was us taking copious notes on which point size, aligned where, caps or not, bold or not, all hastily sketched on the blackboard... If you deviated, it was *wrong* but then, he graded "holistically", so nothing was ever actually wrong, it was just not the way "people often do it" -- which was code for do it this way or die an ugly, painful death. It was near impossible to figure out how he arrived at a grade, because the answer was invariably "I grade based on the whole of the work", but he could never point to specific examples of error, only cases of "it can be done this way, but I prefer the other".</p>
      <p>Apologies for the rant. Guess I'm still bitter... Folks like him shouldn't be teaching. He could have drawn up a sample document, labelled with all of the pertinent info, and handed that out to us--and I would have gotten *something* useful out of the course. Bah humbug.</p>
      <p>But back on topic, I've also had profs who specify 12 point TNR with 1 inch margins, a certain word length, page length and line spacing, and after I dutifully follow instructions and count my words with the software's feature, I discover that the specified word and page lengths don't jive! Bah humbug again. </p>
      <p>K.</p>
