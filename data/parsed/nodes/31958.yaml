      <p>What do you all think of the following recommendations:<br>
      Set your paper <em>temporarily</em> in TNR@12. Note the page (and place on the page) where the last word of your paper appears. Now, set the paper in your preferred typeface (any reasonable alternative to TNR -- Georgia, Minion, Book Antiqua, etc.) and set the point size of the font such that your paper ends in almost exactly the same place.</p>
