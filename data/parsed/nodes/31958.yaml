      <p>"So I’ve almost always shirked this rule"<br>
      :) good idea. but you really are not a shirker. The teachers are teaching we hope.</p>
      <p>What you couldn't do is use 14 pt, or 6 pt. of anything. The idea is that non-typographically inclined students will use Times@12 and typographically inclined students, like for example, yourself, will choose a "suitable alternative of approximately the same size and length" but more "stylistically to your liking/peronality. Then the teachers know who's who by the font, or they don't. For any teacher who doesn't understand what's being taught there, for example, punishing a good font selection of approximately the same size and length for not being Times@12, please don't.</p>
