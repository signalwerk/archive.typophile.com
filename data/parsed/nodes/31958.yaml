    html: |-
      <p>As a designer, teacher, and publisher from a primarily English Lit background (I teach publication design, Creative Writing and English Lit), my scholarly experience (both as an undergrad and graduate student) and literary experience (as a writer, editor, publisher &amp; teacher) have brought the default 12pt/TNR/double-spaced into play on a variety of fronts. </p>
      <p>As has been discussed here, word-count is a factor primarily because it is asking too much of general Arts students (non-designers) to understand things such as x-height and metrics, and in the end it becomes too much trouble for the instructor to explain for the 1000th time why this font or that isn't appropriate, or how to use the word-count feature in Word, etc., so many instructors simply default to the 12pt/TNR/double-spaced "standard" for the sake of their own sanity.</p>
      <p>Technical font issues are another factor that general Arts students can not be expected to grasp; that is, explaining that setting an essay in Adobe Garamond doesn't mean anything if the paper is being submitted electronically and the recipient doesn't have Adobe Garamond installed on their system. PDF is the obvious solution, but unless the student is on a fairly current Mac, it's unlikely they're going to have Acrobat Pro installed.</p>
      <p>Perhaps more important, from the reader's position (teacher/editor/etc.), is the attempt at visual annonymity and "fair play." We all know, as designers, that what the text looks like will influence how it is received, but this depends on the aesthetics and training of the writer, or lack thereof. As someone who is to judge the success of a text (essay, etc.), attempts by students at visual style simply tend to create an uneven playing field (uneven in the sense that it almost always hurts the student more than it helps).</p>
      <p>Relating to publishing, many editors I know absolutely insist on the 12pt/TNR/double-spaced default not only because it fits into their formula for estimating extent (should they chose to publish a given manuscript), but also because they want and need to focus on the content exclusively. If the text is accepted, the typescript will be handed off to a designer (hopefully), so design (at the evaluation stage) simply distracts.</p>
      <p>As an editor of a small press myself, however, I encourage submitting writers to format their manuscripts how they think fitting, because I'm looking for writers who are aware of the effect typography/design has on the reception of texts. Most of the time this results in horrendous looking submissions, but, frankly, this makes my job easier as an editor when evaluating submissions: if the thing is mired in visual and typographic cliche, then I can be fairly certain that the writer hasn't had enough exposure to well made books to know what makes a well made book. Which means they don't read enough. And if they don't read enough, I seriously doubt their writing is going to appeal to me or stand up to editorial scrutiny.</p>
      <p>On the other hand, as a teacher of English Lit, I need to keep the field as level as possible, because it is not part of the equation to judge first and second year students on their lack of aesthetic sophistication. Attempts at visual style, even the <em>option</em> to make such attempts, at this level, generally puts the student in a position of weakness which they have little chance of overcoming. The technical requirements alone are beyond most undergraduate students, let alone any real awareness of typographic convention or principle. Thus, what results are painful attempts at novelty as a desperate grasp for attention, and in such cases what tends to happen is that the essay not only <em>looks</em> weak, but this influence infects the content as well.</p>
      <p>That said, I always hope for, and from time to time receive, papers from students who are in-tune (and brave) enough to format their papers in a different font that is well-suited both technically (x-height, characters-per-line, etc.) and visually (tone), and, to my mind, such students are to be rewarded, just as students who go beyond expectations in terms of research should be rewarded. Such considerations should not be built into the assignment guidelines, for the reasons above, but students who take the initiative (and risk) to stand out (by actually improving the quality of their essay/paper/submission) deserve, I think, recongition and thus a higher mark.</p>
    html_clean: |-
