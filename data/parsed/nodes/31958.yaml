    html: <p>I teach design and the reason I require 12 pt Times for papers is page length requirements. You are actually writing a longer paper when you set in it Garamond rather than Times because of the x height. If you are going to replace a font for a paper of required length, choose one that has a larger x height than Times that you can still get away with. And I would notice the change :)</p>
