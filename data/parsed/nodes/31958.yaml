      <p>I know I am getting to be a broken record on this, but here goes again:</p>
      <p>The main problem with Times on letter sized paper is that the measure is too long. And if you make it big, Times is too black. So it never looks quite right in a single column on letter sized paper. </p>
      <p>It can work very well in small sizes and shorter measures, which is what it was originally designed for. </p>
      <p>To make a single column setting look good on letter sized paper you need a wider font than Times and bigger than usual margins, so that you bring the measure down to near the recommended 2 1/2 lc alphabet lengths.</p>
