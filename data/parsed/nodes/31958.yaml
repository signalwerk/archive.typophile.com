      <p>Although I think that rules are usually best obeyed, it also seems obvious to me that a rule requiring people to set their theses in Times Roman probably got written in order to tell people the old rule about using Courier or another typewriter face is now repealed, and proportional spacing, as is easily done on a laser printer, is now sought.</p>
      <p>Thus, I think it's unfortunate that the rule is so specific. If someone finds the needs of his thesis are better served by Modern Series 7, or Caslon, or even Helvetica, it should be possible.</p>
