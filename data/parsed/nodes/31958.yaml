      <p>I remember a metal Times that was quite beautiful. Maybe 12-point Monotype? 14-point Monotype? It did require substantial leading. Long descenders were used.</p>
      <p>Moral. Get FontLab, or something simliar, &amp; see what you can do. Lengthen the descenders, and maybe the ascenders a bit. Look at the contrast in the letterforms themselves, &amp; adjust as needed. Maybe expand it just a touch. There use to be a Times Wide, but it was a bit too wide.</p>
      <p>Be sure you start with a font where the EULA permits this, of course.</p>
