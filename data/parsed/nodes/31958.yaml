      <p>As to how old -- a number of our Monotype fonts were issued as PostScript Type 3 fonts. I don't really remember how long ago that was, but I don't think MGaramond  was one of those. Still, we got it about that time. We also have a bunch of fonts issued on 5-inch floppys . . .</p>
      <p>As to hinting . . . Well, FontLab auto hint seems to work pretty well. Back when the only decent program font editing program was Fontographer, we found it messed up the hinting, so I always generated fonts without any hinting at all. Worked fine for bookwork, where the output was 1,000dpi or higher on repro paper. We did notice that if anybody put a snippet of the book on the web, it looked pretty bad. When I started working in FontLab, the snippets that wound up on the web looked a lot better.</p>
      <p>FontLab is an expensive program for a student, but if you're a <cite>design</cite> student, I don't see how you can get along without it. I don't mean just font designers, but anyone having to design using type.</p>
