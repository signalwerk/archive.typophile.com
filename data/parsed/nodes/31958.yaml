      <p>Speaking as someone who sets paper assignments himself, I'm pretty sure that--as Thomas (above) may have been thinking--most instructors who specify fonts in the directions are trying to avoid students using Comic Sans or Copperplate Gothic to write a 10-page paper, and that most of those instructors in turn don't care if they ask for TNR and get Garamond, or Palatino/Bookman Antiqua, or Georgia. (This may be a holdover from the early days of desktop publishing, when too many people were stoked that they didn't have to settle for typewriter fonts, and instructors felt they needed to say something to prevent 10 pages of Monotype Corsiva.)</p>
