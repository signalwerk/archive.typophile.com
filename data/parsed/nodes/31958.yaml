    <p>Practically all of the paper assignments I get in school say that the font the paper is done in must be "12 point Times". Personally, I'm not a huge fan of Times; I respect it because of its widespread use but that's precisely the reason I'm not a huge fan of it. So I've almost always shirked this rule, without being reprimanded (well, not yet). I replace Times with Adobe Garamond; I find this font well-suited for papers. </p>
    <p>So, does anyone else get this same requirement at all? Do you ignore it like I do? If so, what do you replace Times with?</p>
