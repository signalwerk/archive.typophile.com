      <p>Just a reminder...<br>
      normal style standards for opening quotations of text the same point size is not being debated.</p>
      <p>Once a large lead-in cap was decided on, it's became the typographer's (back in the days when it was an actual profession) or designer's obligation to make it work right, whether it was simply the first letter of the sentence or a quote.</p>
      <p>My first inclination was and is always to seek one or more reliable references, then decide whether I break the rules or not.</p>
      <p>You can't use the same guidelines for every situation. If you are designing a broadside or poster with short text, or if you are laying out a five-hundred page book... different situations call for different solutions.</p>
      <p>I follow conventions until they make no sense.</p>
