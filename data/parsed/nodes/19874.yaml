    html: |-
      <p>Hey boys and girls, ladies and gentlemen...<br>
      I just recently reviewed sample specimens of lead caps <em>without opening quotation marks</em> shown in Walter Tracy's Letters of Credit (hardbound first edition).*</p>
      <p>I have used cap lead-ins both with and without open quotation marks. I personally believe it depends on the publication you are working on the and the level of typographic style. As long as there are <em>closed quotation marks</em> it is correct.</p>
      <p>Haven't you seen long series of sequential quotes as typeset in plays? It was not uncommon at the beginning of paragraphs <em>not</em> to use open quotation marks at the beginning but use closed quotations only. (Can't get to show samples until tomorrow, not near my scanner today)</p>
      <p>* <em>EDIT: Apologies, my poor recollection. It was NOT 'Letters of Credit' but was another book I was looking at at the same sitting... "Buddha: Life &amp; Teachings" published by Peter Pauper Press, illustrations by Jeanyee Wong.</em></p>
      <p>Also, more apologies... I mistook the chapter opening to be the beginning of the quotation by Prince Siddhattha, but there IS an open quotation mark within the context of the first paragraph. Guess I should't be quick to recall matters of typographic details!</p>
