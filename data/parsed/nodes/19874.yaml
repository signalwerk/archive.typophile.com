    html: |-
      <p>Bringhurst says put it in, the examples he shows has the mark at a larger size than the body text (definitely not the equivalent size of the drop cap), and overhanging the lefthand margin if necessary, an "A for example offers plenty of space to include it in the measure.<br>
      He also says that the convention of dropping it is a result of the difficulty in setting it in metal and for the reader's sake and with the ease of digital setting to keep it in.<br>
      So I think the convention (insofar as one exists) is<br>
      c) Include the mark, adjusted to suit the cap but not necessarily of the same size.<br>
      Tim</p>
