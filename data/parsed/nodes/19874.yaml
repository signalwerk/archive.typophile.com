  html: |-
    <p>I've been looking around and can't seem to find any clear information on this anywhere; If I use a drop capital in a sentence beginning with a quotation mark, what is the convention as far as the mark is concerned?  Do I:</p>
    <p>a) Include the mark, adjusted to the same size as the cap, or</p>
    <p>b) leave it out?</p>
    <p>Thanks in advance for any advice!</p>
