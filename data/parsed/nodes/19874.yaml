      <p>I've seen it the other way, Norbert. You often see a quote of many paragraphs. There will be starting quotes at each paragraph, but only one ending quote. The idea is that the start quotes remind the reader that we are still in a quotation, and the only closing quote is needed to completely end it.</p>
      <p>(But I know some editors that will make you throw in the additional close quotes.)</p>
      <p>I've never seen open quotes omitted, but closed kept. To me that is like closing the barn door after the horse gets out.</p>
