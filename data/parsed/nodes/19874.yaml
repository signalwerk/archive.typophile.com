    html: <p>I think Don is right - the convention is that each paragraph of a long quote should have opening quotes but there shouldn't be end quotes until the very end of the quotation. It is probably ok to omit opening quotes on every paragraph as long as they are clearly at the start of the quote. But to put end quotes on every para would be confusing.</p>
