    html: <p>You have to include it so people know it's a quote, but it can/should be smaller than the drop cap, but bigger than the text size. You'll probably have to play with kerning and baseline shift to make it look OK, it should align at top with the drop cap. Of course this also necessitates (in Quark) making your drop cap 2 characters.</p>
