    html: |-
      <p>There is no letter "latin small letter p with a ring above" in unicode. You can however get a p with a ring above when you type p followed by U+030A, "combining ring above" in Times New Roman, Calibri, Cambria etc. </p>
      <p>Modifying an Austrian keyboard layout so that ° becomes a dead key and so that when you type °p side by side you get p followed by the combining ring above is quite easy. That means that with such a layout, you can type  °p side by side and get p with a ring above in Times New Roman, Calibri etc. without ever modifying those fonts (which you are not allowed to do, anyway). That will work with any font that correctly handles combining diacritical marks.  Switching from one keyboard layout to another can be done quite fast (just typing command space for instance). I regularly switch between the US Extended and the Canadian French CSA keyboard layouts that way.</p>
