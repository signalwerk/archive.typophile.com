    html: |-
      <p>Yes, what you want to do is certainly possible with OTL. I still think it's a bad idea, but the implementation is pretty easy. Most of what you'd do is simple ligature lookups e.g.</p>
      <p><code>asciitilde n -&gt; ntilde</code></p>
      <p>For any sequence not covered in the ligature lookup, you'd get ~ followed by whatever came next.</p>
      <p>In the special case where you want to display '~n' instead of 'ñ', you could easily mimic the deadkey keyboard behaviour, using a contextual ligation lookup that removes the space glyph when '~ ' is followed by any of the letters in the first ligature lookup coverage, e.g.</p>
      <p><code>asciitilde space -&gt; asciitilde<br>
      | n etc.</code></p>
      <p>[Note that I've used VOLT lookup syntax here. If you're using an AFDKO-based tool for OTL programming, you'll need to translate this into the appropriate syntax.]</p>
