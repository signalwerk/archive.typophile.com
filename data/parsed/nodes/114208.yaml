    <p>Hey guys,</p>
    <p>I wondered if someone could explain to me how the input of the tilde acutally works and if I can emulate/imitate the same key-behaviour in OTF substitution?</p>
    <p>I'm talking about the following fact:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/Screen Shot 2014-02-15 at 12_6568.33.55.png"></div><p></p>
    <p>I'm able to type <em>ALT-N</em> and create a "selected" Tilde. If I keep typing for instance an <em>a</em> I get an a-tilde character.<br>
    However if I press the space-bar the Tilde is going to stay in place and I can go on with my typing.</p>
    <p>Is it possible to mimic this behaviour in OTF programming?</p>
    <p>Thank you in advance,<br>
    Sepp</p>
