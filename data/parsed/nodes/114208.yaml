      <p>Dear John,</p>
      <p>thank's for your answer: I know that the text-string behind it would be ~a and ~n and I'm fine with this.<br>
      I'm working with this for a university project where this is totally ok.</p>
      <p>Is it technically possible to do this with OTF programming?</p>
      <p>E.g. sub degree p by pring;<br>
      So when I type the <em>degree</em> and a <em>p</em> I get a new character p with a ring above.<br>
      I know that the underlying string would still be degree and p however it displays the thing I'm after.</p>
      <p>Now imagine i just want to type °p side by side. I would need to be able to have the same mechanism like the tilde is having right now.</p>
      <p>Is that possible somehow?</p>
      <p>Kind regards,<br>
      Sepp88</p>
