    html: |-
      <p>You wouldn't want to. The keyboard behaviour you observe is an Apple deadkey input mechanism, so what ends up stored in the text strings are the appropriate precomposed Unicode diacritic characters, such as ã ñ etc..</p>
      <p>OpenType Layout is glyph level processing that doesn't affect character strings, so you would end up displaying ã or ñ but the text string behind them would be ~a and ~n.</p>
