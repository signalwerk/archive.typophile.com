    <p>This logo is for a boat called Aquaholic (the name should go over well with water patrol). She likes margaritas, so I used a margarita surrounded by tropical flowers, behind old parchment.</p>
    <p>I would like criticism on the illustration, but I would also like to know if there is a font that looks similar to what I have drawn in the thumbnail below. I have already tried the wedge serif Latin MT and I hate it. I don't know if what I have drawn is the best solution, but I want something more unused.</p>
    <p>Thanks.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/aqua_5218.gif"></div><p></p>
