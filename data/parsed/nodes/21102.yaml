    html: |-
      <p>Below are two new versions. I thought I would try an uppercase and lowercase mix as well as the all uppercase. </p>
      <p>As far as shading the flowers, I have tried that and it is too much. It overtakes everything else.</p>
      <p>I think what Dan is saying is that associating water with alcohol is bad (surely he doesn't mean that being addicted to water is bad). It is an ironic title intended for humor. They like margaritas. They like water. They like drinking margaritas on the water. </p>
      <p>Either way, the client loves the concept and they pay the bills. It isn't a title I would choose for my boat, but it works for them. To each his own.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/aqua2_6215.gif"></div><br>
