    html: <p>This is getting better &amp; better. I really like the wave. I echo what Tiff said. Also, Rather than dink around with the letters one by one, as a technique I would print the thing minus the lettters &amp; draw them in by hand a few more times until you get it to gel. It will be less frustrating, faster, more fluid &amp; you have a better shot at getting it just right as a result. Digitizing the letters will be a snap after that. What about shading the leaves? I think the left side diamond still needs to be a bit bigger. Congradulations. It's gonna be sweet!</p>
