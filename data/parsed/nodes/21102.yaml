  - id: 133923
    user: 2942
    date: 2006-07-12T09:29:00
    date_raw: 12 Jul 2006 — 9:29am
    votes: null
    html: |-
      <p>Overall I think you need more saturation to the color. These colors are too dull for the fun feeling held in the illustration. Are you going for an old fashioned color scheme somehow? If so -  why? </p>
      <p>Got a pantone book? I could suggest some numbers to you. </p>
      <p>In the meantime why not try this: take your darkest brown on the banner &amp; apply it to the shaded parts of the banner, take the lightest brown &amp; make it the base banner color &amp; then use a pure white for highlights? The lime is almost in the army there. It neeeds saturation. Maybe make it a lemon? I would look at making the leaves a darker green, the flowers a brighter purple &amp; the drink/wave a bright magenta pink. The glass could have two colors, a pale ( but saturated) blue for the glass &amp; a mix of the two for the contents of that cup seen through the glass.</p>
      <p>Actually, what is the reason for the color restriction? Do you want to use flat solid color rather than 4 color process?</p>
