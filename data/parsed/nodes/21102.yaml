    html: |-
      <p>Thanks for all your comments. The drawing was my first thumbnail and the vector art was many drafts later.</p>
      <p>I did what you all suggested. I traced my hand-drawn font, thickened the outer lines, reformed parts of the parchment to look more like the original thumbnail, and changed the inside of the flowers to look like the drawing. </p>
      <p>I still have to work out the lime. It is just floating behind the glass. I also have to possibly redraw the margarita inside the glass to look better.</p>
      <p>Please keep the criticism coming. I have a feeling I will need it on my amateur attempt at type.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/aqua4_5142.gif"></div><p></p>
  - id: 132758
