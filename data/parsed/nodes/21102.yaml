    date: 2006-07-03T23:55:00
    date_raw: 3 Jul 2006 — 11:55pm
    votes: null
    html: "<p>My suggestions: Move the cross bar of the H up. On the A too. But just a bit. Not as high as the H. The middle A in the drawing seems like a better shape. The verticals on it in particular. In your drawing the Serifs on the U are smaller &amp; have a better shape. Id like to see the Q a bit bigger &amp; maybe with a different tail. This one seems too restrained for a party ship. What about bending the lettershapes to match the ribbon more? The lines on the top &amp; bottom of the ribbon could be thicker. I think it would create a stronger text focus which will make the mark stronger overall I think.</p>"
