  html: |-
    <p>Who said moiré was bad? Nope—it’s fun fun fun!</p>
    <p>This font, 79, by—I have no clue—is <em> just okay</em>. Not TDC material, I know, but it does have a purpose. </p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/79_6285.png"></div><p></p>
    <p>But look at what OS X Exposé can do to it.</p>
    <p>Groovy gradient patterns within the letters.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Picture32_3799.png"></div><p></p>
    <p>Mikey :-)</p>
