      <p>It seems to me this isn't quite the contradiction you're implying. </p>
      <p>In 9.4 Bringhurst discusses and shows examples of various h+j settings, and outlines those used in <em>EOTS</em>. What he's outlining here are very specific rules set up in the h+j engine. </p>
      <p>In 2.4, as you've quoted, he cautions that "no typesetting software should be permitted to compress, expand or letterspace the text <em>automatically and arbitrarily</em> as a means of fitting the copy." </p>
      <p>Carefully testing and setting specific engine rules is not the same as permitting the software to "automatically and arbitrarily" fit the copy; on the contrary, fine-tuning the engine is the opposite of leaving the software to do whatever it thinks is best.</p>
