      <p>Thomas,</p>
      <p>The URW hz program (a suite of algorithms that URW developed; I assume hz is the program that Bringhurst is referring to in Elements pg 190, 192) was indeed heavily influenced by the Knuth-Plass algorithm. In fact, according to the  Seybold Report, Volume 22, Number 11, it directly used TeX for its paragraph-based line-breaking decisions [I assume that they mean it used the Knuth-Plass algorithm?]. </p>
      <p>As you correctly point out though, this is only part of what makes the hz program [and by extension InDesign] so powerful. The other microtypographic extensions incorporated into hz are important too.  The full text of the relevant Seybold report is available online [slightly mangled by my browser?] at: <a href="https://web.archive.org/web/20140911190703/http://www.seyboldreports.com/SRPS/free/0ps22/ps22-11a.htm" title="http://www.seyboldreports.com/SRPS/free/0ps22/ps22-11a.htm">http://www.seyboldreports.com/SRPS/free/0ps22/ps22-11a.htm</a></p>
      <p>Some of the features of the hz algorithm are now available to the TeX world through pdfTeX. There is a nice discussion of these microtypographic extensions to TeX in Han The Thanh's Ph.D dissertation:<br>
      <a href="https://web.archive.org/web/20140911190703/http://www.pragma-ade.com/pdftex/thesis.pdf" title="http://www.pragma-ade.com/pdftex/thesis.pdf">http://www.pragma-ade.com/pdftex/thesis.pdf</a></p>
      <p>Is there any freely available discussion of Adobe's extensions to the URW algorithms? Or is it all a secret now? :)</p>
      <p>One thing: the font expansion aspects of the hz algorithm really do beg for Multiple Master fonts. I do wish that you guys hadn't killed them off....</p>
      <p>Grant</p>
