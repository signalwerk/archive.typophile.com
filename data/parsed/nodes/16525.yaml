      <p>InDesign's paragraph composer uses primarily a combination of (1) a patented idea, the patent for which was bought from URW, (2) its own tweaks and modifications to that idea. There could be some influence from TeX either directly or indirectly, but I know it was not the primary source.</p>
      <p>I think what Bringhurst was opposed to was applications like Microsoft Word that don't let you specify much in terms of what they should do to achieve their justification.</p>
