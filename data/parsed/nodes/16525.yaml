      <p>Personally, I don't mind a fair bit of hyphenation, and prefer more even spacing. So I slide the slider all the way over to that extreme.</p>
      <p>In pkazmier's example, I would not consider that rang of spacing options "moderate." If the standard space in the font is M/4 (which is about average), then that corresponds to spacing settings of 80%/??%/200% in InDesign (I'd assume you'd put 100% in the middle, but maybe that's just me. Whereas I and most typographers tend to suggest settings like 80/100/133. Of course, a lot depends on context: maybe pkazmier is mostly setting newspaper text in narrow columns or something, requiring more extreme justification settings.</p>
