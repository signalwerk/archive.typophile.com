      <p>Pete, typographers have always cheated to squeeze copy to fit.<br>
      The trick is to do it cleverly enough to be unnoticeable to the reader, and also the professional eye.</p>
      <p>H&amp;J software allows the typographer to cheat in several ways:<br>
      - reduce letterspace (tracking)<br>
      - reduce wordspace<br>
      - reduce horizontal scale by a percentage</p>
      <p>There is nothing wrong with inconsistent wordspacing from line to line -- it allows an even fit between letters (tracking), which is most desirable.</p>
