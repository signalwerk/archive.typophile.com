      <p>Just dropping by on a [very] rare spare moment.</p>
      <p>Regarding pkazmier's numbers above: </p>
      <p>I agree with Thomas, wordspacing = 80 / 100 / 133 (assuming a native word space of 250). The figures for letterspacing are too extreme in my book. I prefer -1 /  0 /  +1. These are starting points -- works fine maybe 85% of the time; altered if necessary based on font, size, leading, margins, nature of text being set, etc., in order to satisfy my eye.</p>
      <p>I don't generally allow glyph scaling at all, by default. I will exercise it as the last resort on an ad hoc basis for particularly ornery paragraphs.</p>
      <p>In terms of prioritization of the various parameters:<br>
      Hyphenation first, followed closely by Wordspacing -- actually the two in conjunction, the relative proportion depending upon the material being set; thankfully Indy allows movement between the two.<br>
      Letterspacing only in small amounts, as noted above.<br>
      Glyph scaling almost never, only as a last resort.</p>
