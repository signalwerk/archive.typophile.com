    html: <p> Depending on what kind of job it's for, I'd pick either Mrs Eaves, Storm's John Baskerville, or Monotype Bulmer. All three are available in OT versions. Bulmer (whose OT version you can now get through Adobe) is a different font but a good alternative if you want to set your choice apart. </p>
