  html: <p>hi, <br> <br>i'm looking to purchase, sooner or later, a font from John Baskerville.  I started looking around on the net and to my astonishement there are a lot of choices out there! I knew about the ITC and the Berthold versions (book &amp; regular), but now I discovered that there are quite some big families (with osf &amp; sc) from new foundries like Stormtype (<a href="http://www.stormtype.com" target="_top">http://www.stormtype.com</a>) &amp; Fountain (<a href="http://www.fountain.nu" target="_top">http://www.fountain.nu</a>).  <br> <br>So, type-experts out there; which one seams to be the superior design? Or the most versatile? <br> <br>mac+</p>
