    html: "<p> According to Graphis's \"TYPE: The Best in Digital Classic Text Fonts\"*, the best Baskerville (in the classical sense, I guess) is the one by Monotype. But I'm not sure what name that goes by now. <br> <br>And \"Revival of the Fittest\"** hand-picks four Baskervilles to analyze: ITC New Baskerville (low readability), Monotype Baskerville (high contrast), Berthold Baskerville (heavier, and lower contrast - maybe your best bet for setting small text in offset), and Mrs Eaves (which is not very literal at all). <br> <br>* Don't buy it - it's just a glorified specimen book. <br> <br>** By Print Magazine. Some nice insights, but glaring faults as well. <br> <br>hhp </p>"
