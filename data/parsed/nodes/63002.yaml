      <p>I think it is custom lettering, even though those two 's' shapes look very close. The lettering style could be Sudtipos (Koziupa/Paul) or TypeSetit (Rob Leuschke), to name sources that also produce fonts, but of course, many artists could have done the lettering.</p>
      <p>- Mike Yanega</p>
