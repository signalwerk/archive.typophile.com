    html: "<p>Folio has many similarities, although without the trimmed tails and descenders, and the lc \"y\" and pip (dot) on the lc \"i\" are all wrong: <br><a href=\"http://www.myfonts.com/FontFamily296.html\" target=\"_top\">http://www.myfonts.com/FontFamily296.html</a> <br> <br>Look especially at Folio Bold: <br><a href=\"http://www.myfonts.com/FontStyle940.html\" target=\"_top\">http://www.myfonts.com/FontStyle940.html</a> <br> <br>and Extra Bold: <br><a href=\"http://www.myfonts.com/FontStyle941.html\" target=\"_top\">http://www.myfonts.com/FontStyle941.html</a> <br> <br>Elzner &amp; Flake's Radiant family might be even closer: <br><a href=\"http://www.myfonts.com/FontFamily19391.html\" target=\"_top\">http://www.myfonts.com/FontFamily19391.html</a> <br> <br>Good luck! <br> <br>David</p>"
