      <p>Thanks for the feedback! I´ll definitely need to change some of the letters, I´d like to add some in the Amsterdam School style (thanks for the link Micha, some nice stuff in it), just need to go for a walk and take some photos. The XXX can be used both horizontal and vertical, in the Amsterdam flag for example it´s used horizontally, but you see it a lot on the vertical version on the coat of arms, on street signage or on the decoration of buildings.<br>
      I think I´ll try a new version without the black square background on the ornaments, just make the ornaments black on white and maybe scale up the letters a bit, it might look a bit lighter. I´ll post it here when I have a new version. Thanks again!</p>
