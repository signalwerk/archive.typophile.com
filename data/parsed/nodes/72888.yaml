    <p>Hi guys, I'm working on this poster showcasing some of the characteristic typefaces of Amsterdam and would really appreciate some feedback on the design so far. It's not finished yet, I'm considering changing some of the letters but it would be nice to have some opinions regarding the overall look of it so far. Thanks!</p>
    <p>Bigger image - <a href="http://diogotovar.com/portfolio/images/XXX-type-BIG.jpg" title="http://diogotovar.com/portfolio/images/XXX-type-BIG.jpg">http://diogotovar.com/portfolio/images/XXX-type-BIG.jpg</a></p>
