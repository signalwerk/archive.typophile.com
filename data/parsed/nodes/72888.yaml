    html: "<p>I think the S and D in Amsterdam are not typical for Amsterdam. Richard Keizer has a page with fonts he made from signage in Amsterdam. It's all freeware, done by an amateur, but you might find some nice things at his site: <a class=\"freelinking external\" href=\"http://home.tiscali.nl/r_keijzer/fontenwerkplaats.htm\" rel=\"nofollow\">http://home.tiscali.nl/r_keijzer/fontenwerkplaats.htm</a></p>"
