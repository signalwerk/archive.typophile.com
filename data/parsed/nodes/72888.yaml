      <p>I like it! A real puzzle!</p>
      <p>A few things: </p>
      <p>The M's in AMSTERDAM could be a little lighter, they stand out because they're so fat. To even the colour I'd suggest using lighter versions.</p>
      <p>Isn't the Amsterdam logo (XXX) normally used vertically in stead of horizontally?</p>
      <p>X<br>
      X<br>
      X</p>
      <p>in stead of</p>
      <p>XXX</p>
      <p>I get the tile-like layout, however it's somewhat black, too present to my liking. Maybe tone it down or make them smaller?</p>
