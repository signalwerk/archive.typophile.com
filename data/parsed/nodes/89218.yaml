    html: |-
      <p>I built and ran the tool, it's slightly more complicated than the wiki page implies.  The tools are java tools so you'll need to run a Java build step first.</p>
      <ol>
      <li>Check out the source</li>
      <pre>svn checkout <a href="http://sfntly.googlecode.com/svn/trunk/" title="http://sfntly.googlecode.com/svn/trunk/">http://sfntly.googlecode.com/svn/trunk/</a> sfntly</pre><li>Build the tools</li>
      <pre>cd sfntly/java
      ant</pre><p>  ... lots of stuff builds ...</p>
      <li>Test the build</li>
      <pre>cd dist/tools/sfnttool
      java -jar sfnttool.jar --help</pre><li>Build EOT font</li>
      <pre>java -jar sfnttool.jar -e -x MyFont.ttf MyFont.eot</pre><li>Build WOFF font</li>
      <pre>java -jar sfnttool.jar -w MyFont.ttf MyFont.woff</pre></ol>
      <p>Under OSX 10.6 this was pretty simple, I think all the tools (ant, java) should be available with the default OS install.  On Windows, well, good luck and godspeed.</p>
    html_clean: |-
