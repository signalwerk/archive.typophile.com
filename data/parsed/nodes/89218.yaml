      <p>As John D said.</p>
      <p>David, the input for a WOFF file is pretty strictly defined in the WOFF spec. It must be a well-formed sfnt that can be losslessly, table-by-table compressed and expanded into and from the WOFF package. And EOT is another packaging format. Yes, it also contains an sfnt, but its own packaging means that it is not a valid input for a WOFF file.</p>
      <p><em>Are there even such browsers/unupgraded IE users on the Mac?</em></p>
      <p>I sure as heck hope not. Microsoft ceased development of IE for Mac in 2003, when Apple launched Safari and didn't renew their bundling agreement with MS. Did IE for Mac support EOT? I don't remember.</p>
