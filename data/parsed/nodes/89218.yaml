    html: |-
      <p><cite>Doesn't wrapping an EOT as a WOFF make it even smaller?</cite></p>
      <p>Compressing an already compressed file is unlikely to make it any smaller.</p>
      <p>Also wrapping an already wrapped SFNT font does not make much sense, but since MTX compression is now available under a “friendlier” license, it would make sense for WOFF to (optionally?) use it as it gives better font compression over plain gzip that is currently in use.</p>
