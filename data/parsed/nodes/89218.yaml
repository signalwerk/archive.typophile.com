      <p><em>Wrap EOT in WOFF...</em></p>
      <p>Not possible, I think. The WOFF spec requires the content of a WOFF to be an SFNT. I also can't think of a reason why one would want to put an EOT in a WOFF wrapper, since EOT is primarily of relevance to versions of IE that don't support WOFF.</p>
