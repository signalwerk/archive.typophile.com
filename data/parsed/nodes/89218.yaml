      <p>The screw? I want developers to be able to simply nail web fonts and you want to complexly screw web fonts?</p>
      <p>lol, from <a href="http://www.w3.org/Fonts/WOFF-FAQ.html#What_are_the_benefits_of_using_WOFF" rel="nofollow">here</a>, "WOFF is not expected to replace other formats such as TrueType/OpenType/Open Font Format or SVG fonts, but provides an alternative."</p>
