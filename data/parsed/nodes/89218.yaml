    html: |-
      <p>The patent for MTX expires in 2017, five years, anyway. After which licensing is a moot issue.<br>
      The need to make and use EOT formatted fonts, if the past is any guide, will not be moot.</p>
      <p>(BTW - if created within a licensed installation of Windows, there are not and never were any licensing issues with using MTX - patent exhaustion would certainly apply. To explain: the components in an average automobile involve dozens of patents yet when you buy a car you, the consumer, don't need to license these independently. That's "patent exhaustion" at work. The only license you need is a license to drive.)</p>
      <p>For any Mac users who are running Windows in a virtual machine there's <a href="http://eotfast.com" rel="nofollow">EOTFAST</a> for making compressed EOT files.</p>
      <p>Happy that Monotype is being clear and up-front on the subject. I wasn't aware a new policy had been posted.</p>
