      <p>&gt;Richard, that app sometimes makes eot:s that doesn't work. I tried several times.<br>
      &gt;It doesn't say why either. The fonts just doesn't load in browsers.</p>
      <p>Unfortunately this CAN happen because the app doesn't check for compliance with the rules for making a valid EOT.<br>
      If sfntly is making a working font and EOTFAST is not, then sfntly is changing the font to conform.<br>
      Read the documentation for EOTFAST for the rules. tThere's only a couple of things that can go wrong - usually the construction of the names in the naming table.<br>
      If you have any problems, feel free to contact me - it will only take a second to show you where the problem is.</p>
