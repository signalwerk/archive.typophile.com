    html: |-
      <p>@dberlow</p>
      <p>Right, you can build either an EOT or a WOFF font with sfnttool but the input is always a ttf.</p>
      <p>Packaging an EOT font in a WOFF container doesn't work, the formats are different.  EOT uses Monotype's MTX compression which does things like pull the hints out from the glyph data and reinserts them in the decompression phase.  Keeping the hints together before applying entropy compression helps to reduce their size a bit compared to just gzip'ing a font, but how much will obviously depend on the structure of the hinting data.</p>
