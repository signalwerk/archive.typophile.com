    html: |-
      <p>@jdaggett<br>
      Thank you John for posting a detailed explanation on the use of sfntly tools and for clarifying the EOT / WOFF differences</p>
      <p>@dberlow<br>
      You're right, OT does follow the SFNT structure, EOT is not. It has its own header followed by either raw TTF/OT data (as in EOT-Lite), or by MTX-compressed font data. Either one would not be considered a compliant input for WOFF converter, and it doesn't make sense to wrap one webfont format into another.</p>
      <p>WOFF is the standard format that pretty much all new browsers support. EOT is only relevant for older IE versions (up to and including IE8) that can only read EOT files. I don't think there is much concern about "unupgraded IE users on Mac", but there are still plenty of users using IE8 on WinXP - you need EOT if you don't want to ignore them (and sfntly tools from Google now allow everyone to do it easily).</p>
      <p>@Khaled<br>
      MTX is now available under <a href="http://www.monotypeimaging.com/aboutus/mtx-license.aspx" rel="nofollow">free for all</a> license - I don't think it can get any "friendlier" than that :)<br>
      And I agree, it does make perfect sense for web fonts to use better compression technology whenever available, especially if the benefits of doing so outweight the implementation costs.</p>
