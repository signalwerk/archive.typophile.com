    <p>Hello,<br>
    I'm looking for professional help with a kerning in this logotype:<br>
    <a href="http://www.photo-b7.com/up/misc/edwards/logo3.jpg" rel="nofollow">EDWARD'S</a><br>
    It's pretty hard to set that properly in such font.<br>
    Have I done that right?<br>
    Thank you!</p>
