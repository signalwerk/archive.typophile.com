    html: |-
      <p>You've done pretty well. Tough to space a clarendon in general!<br>
      Here are a few ideas:</p>
      <p>1. Use a real apostrophe (not the ' )<br>
      2A. There are two ways of approaching this spacing, one is to make things as evenly tight as you can and not worry about stuctural space troubles (like the AR combo). This is pretty much what you're doing now. One way you might help this is to modify the letterforms for better spacing. Reduce the serifs between the A and R. Or, eliminate the left R serif completely (might be too weird).</p>
      <p>2B. The other approach is to space everything based on your loosest pair (AR). Space ARD, figuring where the D should go. Then add the W and so on. The overall spacing will be looser. You may decide the logo looses impact with looser spacing. The only way to get more even spacing without modifying letters is to loosen.</p>
      <p>Hope that helps.<br>
      Randy</p>
