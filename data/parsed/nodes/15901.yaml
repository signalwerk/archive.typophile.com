    votes: null
    html: |-
      <p>I just took a closer look at your word and I think you'll need to do a combination or A and B (above):</p>
      <p>Try the following:<br>
      1. Begin by tightening every combination up so that it is tight but not touching.<br>
      2. Reduce the two serifs between the A and R. (then make tight but not touching)<br>
      3. Add a serif to the right side of the middle stem of the W (it is emphasizing the bad spacing on the WAR combo)<br>
      4. Add a little space between the W and A<br>
      5. Extend the serifs slightly on each D (but keep the tight but not touching). Add more to the ED, and only a very tiny bit to the RD. This will improve the spacing but keep the logo lockup nice and tight.<br>
      6. Narrow the point of the apostophe and wedge it down flush betweet the D and S, you may need to shave off the top.</p>
      <p>Should give you a nice tight lockup.</p>
      <p>R</p>
