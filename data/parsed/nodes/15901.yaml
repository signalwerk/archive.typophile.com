      <p>The "DWA" (especially the "WA") is still relatively loose.<br>
      Also: I would make the left edge of the apostrophe totally vertical.</p>
      <p>&gt; each designer has his own preferences</p>
      <p>I think that can be entirely true when it comes to overall tightness/looseness of Latin caps (compare Tshichold with Zapf), but the leeway for personal preference in <cite>variance</cite> of spacing is essentially very tight (being largely confined to perceptual mechanics, where all humans are virtually the same) . Unless you're going for a "messy" look, which is rarely a good idea (in Display work).</p>
      <p>hhp</p>
