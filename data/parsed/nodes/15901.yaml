      <p>I wonder about the apostrophe - Do you need it? After all Saks is Saks not Sak's. Maybe there is a trademartk reason for going with it. Is there? If you do keep it I think the placement of the mark will signal the preceived expensiveness/class of the logo. Having it up there is jarring &amp; looks like a cheaper/less classy mark. If this is a 'family restaunrant' as they euphemistically call themselves ( or some other business trading in value over prestige) and cheapness is the point. Maybe keeping it there makes sense in that case. If on the other hand this is a logo for a business where presitge &amp; class matter then I would move that puppy a little lower.</p>
