      <p>Mark</p>
      <p>When I saw the Albertus on the windows I figured they brought in someone to do some additional work and they probably said "can you emulate this?" But as I said if you look at the stem to serif transitions you can definitely see the relation. When I first looked at your attachment the Albertus alarm went off because some of the critical characters are direct draws with perhaps a little bit of inexperience with thick and thin thrown in. The upper left join of the N is different and the terminals of the E, C and S don't match but that is why I said he/she was inexperienced. If you look at the playroom piece you can see the same small O that is monoline and the "serif" structure I am talking about.</p>
      <p>But then it could just be an ugly free font : )</p>
      <p>Michael</p>
