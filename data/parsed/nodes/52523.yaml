      <p>Although it is not Albertus it is an eerily similar light version of Wolpe's work from the 30's with a bit more thick/thin variation. I believe the O is implanted and this could be a bad redrawing of his work. Note the structure of the W and the leg of the R. The weights are all over the place so it could have possibly been drawn/painted by a drunk signpainter : )</p>
      <p>.Michael</p>
