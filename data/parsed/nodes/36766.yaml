  html: <p>I started doing this a while back. Wulf Barsch showed up to a class and noticed a case of Staedtler Lumograph pencils. <cite>"Did you know that these were created for the purpose of drawing on foil?"</cite> No I didn't know that. It was worth a try. It was only after writing in foil though that I began to take seriously the idea of making type from my handwriting—an idea I had kept for a long time. There comes with writing on foil a remarkable feeling of the medium pushing back; have you ever noticed that?</p><div class="imageWrap"><img src="http://typophile.com/files/IMG_0139_5615.JPG"></div><div class="imageWrap"><img src="http://typophile.com/files/IMG_0138_3558.JPG"></div><p></p>
