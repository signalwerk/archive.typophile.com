    html: <p>It's a different medium, that's all. What I like best about it is the foil's reaction to  a soft pencil. It's slick, so it's similar to writing or drawing on photo paper with a wet permanent marker; but because it gives just a little, it lends some control to the curves. That helps a lot—both to achieve the look you want first—and later if you're doing something like overlaying bezier curves.</p><div class="imageWrap"><img src="http://typophile.com/files/IMG_0164a_5157.jpg"></div><p></p>
