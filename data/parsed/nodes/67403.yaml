      <p>What I meant by «what kind of setting» was primarily: text or display?<br>
      When you set some large titles, or maybe a logo, you can take all sorts of liberties, also with tracking, to make the type look good. When you set longer/smaller text to be read however, readability has to take precedence over looks. Simply stated, track a font too tight and you risk making it harder / less comfortable to read (as the white space between the letters matters for reading). Lastly, it also depends on point size: The smaller your setting, the looser the tracking has to be in order to be comfortable.</p>
      <p>Now, obviously Helvetica (like any font) comes with a «built-in» «recommended» tracking. (That's why I asked – recommended by whom?) I assume the thought that it «has to» be tracked in comes from the trend (which has been around since the 1970s) that states it looks better when it's tighter; but it's really not very functional. Especially because Helvetica already is rather on the tight side for text settings.</p>
      <p>Do look at the pattern of whites. Maybe even more importantly, if you're setting text, print out variants, and read them, and see what doesn't only look good, but also <em>feels</em> good. :-)</p>
