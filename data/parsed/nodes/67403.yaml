    <p>Hi guys,</p>
    <p>I know this is a bizarre question, but is there any chart for suggested trackings in Helvetica? </p>
    <p>I do notice that Heavy Heavy does like a least of -10 to -25 tracking but Helvetica Light does not work that well on the same profile.</p>
    <p>Here is a sample.<br>
    <a href="http://www.pixentral.com/show.php?picture=1SDTojoQxz1oPXdTSbMJt6QUPIIRu1" title="http://www.pixentral.com/show.php?picture=1SDTojoQxz1oPXdTSbMJt6QUPIIRu1">http://www.pixentral.com/show.php?picture=1SDTojoQxz1oPXdTSbMJt6QUPIIRu1</a></p>
    <p>by the way, here helvetica light has 0 tracking.</p>
    <p>Maybe is my InDesign screen but Helvetica Light with -10 track look too cramped.</p>
    <p>Cheers,<br>
    S</p>
