      <p>Hi Altaira, thanks for the good insight on the Helvetica. I will be using the Helvetica Light as text and Helvetica Heavy as tittle. It is interesting to know about the trend in the 70s to use Helvetica with very tight kerning. I have checked some very nice Annual Reports by BMW using Helvetica, and they use a kerning that goes somehow -25 for the Helveticas Heavy.</p>
      <p>I also watched a tight kerning in the movie poster for the film “Helvetica”</p>
