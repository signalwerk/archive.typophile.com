      <p>There is a built in DNA to every typeface that suggests the optimum spacing. By looking at the counter space (negative) in the letters and the thickness of the strokes (positive) you create a rhythm of positive and negative patterns. Space between words &amp; lines should help balance that rhythm. Bold faces generally should be set tighter to retain their density and lighter faces should be set further apart to ensure their lightness.<br>
      Helvetica has an almost perfect figure/ground relationship (balance of positive/negative space) so it's hard to screw it up.<br>
      The Telus ads tight track the Helvetica ultra light which is counter intuitive.<br>
      It should be very loose to enhance that lightness.<br>
      But, now that it is a familiar part of our vernacular, we accept it - like "all justified" newspaper columns. This doesn't mean it is right, just that, like bad grammar, it's acceptable.<br>
      We too readily accept the familiar as good or appropriate.<br>
      Typography is like music and as Massimo Vignelli said, "it's the space between the letters that count"<br>
      Musical notes are only defined if there is a pause so that you can absorb the note or notes of a sequence.<br>
      In typogragraphy the space between the strokes of the letterforms, between the words, between the lines and paragraphs define that rhythm.<br>
      That's what we aim for.<br>
      The average reader has about 3 seconds to determine if they are going to pay any attention to what you have set. Our goal as designers is to bring them in, hook them and keep them involved from start to finish.<br>
      We are in the information distribution business.<br>
      Comfort is the key.<br>
      When you jar a reader from their reverie by changing rhythms, forms, or structures you can move them away from the intended focus - or worse lose them entirely.<br>
      Most designers don't understand this and design for the purpose of display rather than for imparting the information to the reader - which is our ultimate goal.<br>
      This is all subjective.<br>
      Read a slew of books and you'll find theories as to why you should set everything tight or loose regardless of the letterforms.<br>
      Adrian Frutiger, when building towards his Univers (and with many typefaces under his belt) remarked that, in terms of type design, he had come to the realization that every stroke he put on the page in forming the characters had less to do with designing the typeface and letterforms than it had to do with removing the negative (white) space of the page and that that ws his revelation in balance.<br>
      Tracking, as a whole is an ill used tool. Kerning is much more important in terms of getting the letter shapes to relate to each other. AFTER you have kerned your text appropriately, then the tracking adds an openness or tightness to your text.<br>
      Ultimately, it's all about rhythm.<br>
      Positive/Negative &amp; balance between them.<br>
      I hope this helps.</p>
