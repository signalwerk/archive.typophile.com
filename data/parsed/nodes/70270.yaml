      <p>The mark and the type don't feel like they belong together.</p>
      <p>The mark also evokes "tattoo." Overly complicated and not memorable. If someone saw this for 5 seconds, would they remember how to draw it later? I know that's not the litmus test of a good design, but I'd consider simplifying it. Your approach is appropriate. Let that swooshy thing crystallize into something simpler.</p>
      <p>Perhaps "AS" can become a swirling monogram? You've almost got a lowercase "a" there...</p>
