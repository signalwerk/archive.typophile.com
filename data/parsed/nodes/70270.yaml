      <p>I didn't see the letters in the mark at all. That said, I don't think it matters. The mark is cool. I don't think it's feminine, I think it's edgy organic/tattoo/Celtic/wrought-iron-ish.</p>
      <p>Oh, and no, it doesn't say "animation studio" immediately -- Thank God! If I see one more logo with stylized mouses or funky pixels I'm gonna open a vein. I much prefer an evocative design that suits the tastes of the studio's customers instead of the tools a studio uses to create animation. It's not like they're selling animation work to software developers.</p>
