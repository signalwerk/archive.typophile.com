    html: |-
      <p>An 'arc' suggests energy leaping upwards from one point to another, like a rainbow. Your logo hangs down like a lazy decoration. Why not have it 'leap' upward from one point to another? Every arc I've ever seen arcs upwards, not downwards.</p>
      <p>.-^-.</p>
      <p>And I don't think you need to try to spell 'arc' with the lines. It isn't obvious enough. Focus on emotion and energy, not cleverness.</p>
