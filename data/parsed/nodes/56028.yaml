      <p>Nick</p>
      <p>You do need RoboFab installed it's really simple - I'm not the sharpest knife in the box.</p>
      <p>1. Select all the code and save it in a text file (I use TextMate on a mac).<br>
      2. Name the file something with .py at the end, I use NamingMacro.py<br>
      3. Put this file into your macros folder, on a mac thats - /Users/Username/Library/Application Support/FontLab/Studio 5/Macros<br>
      4. In FontLab open the macros toolbar    View - Toolbars - Macro.<br>
      5. The file you put in the macros folder should be there, select it and press run.<br>
      6. A window will open asking you for the family name then one for the weight.<br>
      7. Done.</p>
