    html: <p>Since my last post I ran into the same problem. There was a space after the last character in one of the font names, and that space was causing the font to be counted as a second family with what looked like the same name. Fixing the fonts did not fix the problem; I found that the only way to fix it was to stop using the fonts via a font manager and instead put them in /Library/Application Support/Adobe/Fonts.</p>
