    <p>hi all. i was curious as to where i would be able to find a "scroll" dingbat or typeface that has the scroll within it. to be more specific on what i'm referring to:</p>
    <p>·they are seen a lot with cheribs and angels in neo-classical art<br>
    ·they always accompany "I (heart)" tattoos<br>
    ·the are on the back of the US dollar<br>
    ·they <strong>rock!!!</strong></p>
    <p>if anyone knows where i would be able to find them, i'd greatly appreciate it. thanx.</p>
    <p>LS</p>
