    <p>I'm using Adobe Utopia (well, Heuristica, which is just Utopia with an extended character set) for lining text in an academic thesis.</p>
    <p>I'm looking for a very heavy and blocky header font to pair with it.</p>
    <p>I was using Georgia+Verdana for my drafts, before actually choosing fonts. I really like the way Verdana Pro Black looks for my headings (example: [IMG]http://i.imgur.com/MqUNFb1.png[/IMG]), and I'm looking for something which is: preferably open-source; slightly less clichéd than Verdana; and very heavy.</p>
    <p>I'd love to hear any suggestions, thanks.</p>
