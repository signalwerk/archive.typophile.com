    html: <p>According to Martin Kotulla, SoftMaker is creating their version of Engravers Roman, but under license from URW++, features 2 uppercase character sets - bigger for "uppercase" and smaller for "lowercase" - and comes in the styles of regular and bold.      The typeface name will be called "Gravure" and'll appear on two of SoftMaker's premium-quality typeface collections - "MegaFont XXL 3.0" (for home users) and "infiniType 4" (for designers) - both being released in May 27, 2014.</p>
