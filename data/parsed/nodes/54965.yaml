      <p>What is this for -- a logo? The colors are very bright which doesn't help with legibility. Okay some letters are easier to decipher then others ("c" "o" "d" "l"). The "e" "r" "s" are hard for me to read. </p>
      <p>the letter "l" overlapping the "d" and making another shade adds an extra layer of confusion. </p>
      <p>maybe use the letter "c" by itself as a mark? </p>
      <p>you tried something different kudos for that. But don't stop here.</p>
