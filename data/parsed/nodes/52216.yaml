    <p>Hi, i'm new to the site, and to graphic design &amp; typoghraphy.</p>
    <p>I'm currently designing a four page brochure in indesign. The client has informed me that the printer used will be a 'xerox hard ink phaser'. </p>
    <p>I am presuming that the colour set-up should be rgb for this printer? Can anyone confirm this?</p>
    <p>Also, this piece doesn't use any photos, but does use artwork that i have created in illustrator and brought over to indesign. Does this mean that dpi is not an issue? If it is then what dpi should my illustrator images be set to?</p>
    <p>Thanks for any help and please excuse my newbie-ignorance.<br>
    Jonny</p>
