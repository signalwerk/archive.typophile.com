      <p>Do work in CMYK, that's for inking (is for light beams to use RGB).<br>
      If a vector graphic stays vector – as opposite to raster graphics image or 'bitmap' ("brought over" teachnically shouldn't be used) – you do not have a dpi issue, that will be resolved by the Xerox machine as its maximum.</p>
