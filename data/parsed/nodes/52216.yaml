    html: |-
      <p><cite>rgb was for computer printers and cmyk for ’professional’ printers ...</cite></p>
      <p>To make it a bit more complicated ... Virtually every desktop printer also works internally with CMYK. However, because the printer mnf know most people cannot be bothered to learn color conversion (and use Word, which only <em>has</em> an RGB mode), the internal RIP is actually optimized for its own RGB-to-CMYK conversion. That depends on a lot of things, such as ink color (inks are never a pure color) and ink density. I have seen in practice that printing an image directly from Photoshop in CMYK mode gave a poorer result than the same image in RGB mode. That's just because the printer internal conversion is better than Photoshop's.</p>
      <p>Perhaps you should just try, and bet on RGB first, as that probably comes out better than CMYK.</p>
