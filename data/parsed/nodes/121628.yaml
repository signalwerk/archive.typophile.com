  html: |-
    <p>The font <strong>Kaukasia-Albanisch</strong> is now available for general licencing.</p>
    <p><img src="/sites/default/files/old-images/Albanisch_2014_UC_T_4210.png"></p>
    <p>The Albanian alphabet is one of the ancient writing systems of the Caucasus region. It is said that is was created by Mesrop who is known to have also invented the Armenian alphabet. It was almost forgotten for centuries but rediscovered in the 20th century, namely on palimpsest manuscripts kept in the St. Catherine’s monastery on Mount Sinai.<br>
    In 2007 I had the honour and the pleasure to make the inauguration font for the edition of that source. This font was also used for the recently launched new Albanian block (10530) of Unicode. The new font now released is based on that encoding.</p>
    <p>Go to <a href="http://en.wikipedia.org/wiki/Caucasian_Albanian_alphabet#Rediscovery" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Wikipedia</a> for further reading.</p>
