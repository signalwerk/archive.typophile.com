    html: "<p>Is the [original] Malayalam writing system in Unicode? If no, you have to make your own \"standard\" encoding. Are the 900 glyphs actually variants of the 90 (either contextual or aesthetic)? If so, you should consider OpenType technology. In which case, I don't know about PageMaker or Linux, but it should be implementable through InDesign. <br> <br>BTW, try these: <br>1. The OpenType list: <a href=\"http://www.microsoft.com/typography/otspec/otlist.htm\" target=\"_top\">http://www.microsoft.com/typography/otspec/otlist.htm</a> <br>2. Qalam: <a href=\"http://groups.yahoo.com/group/qalam/\" target=\"_top\">http://groups.yahoo.com/group/qalam/</a> <br> <br>Anyway, great project - best wishes on preserving/reviving your culture. <br> <br>hhp</p>"
