  html: "<p><i>I received this email recently. Can we help this person find some answers to his questions? -jb</i> <br> <br>Respected Sir <br>  <br>Our language Malayalam has got more than 900 unique characters. (It is one of the national languages of India, spoken by 30 million people of Kerala, the southern most state in India). <br>  <br>25 years ago we had cut short our mother chrs to 90 to accommodate in typewriters. Since then we followed these chrs in printing and computers. <br>  <br>Two years back we started a linguistic movement (non-profitable) to resurrect our lost chrs in typesetting, because our  original chrs were functionally superior and aesthetically more beautiful. The movement is called RACHANA which means 'graceful, Divine  Writing'. <br>  <br>We designed two typefaces using Fontographer. Each typeface consists of 6 ttf files to accommodate all the 900 chrs. We programmed an editor called Rachana. With Rachana all the conjuncts can be made by combining basic keys. <br>  <br>Rachana is slowly spreading. So far 6 books have been published by different publishers. <br>  <br>Now, we would like to have your expert opinion on the following: <br>  <br>1) Can we accommodate all the 900 chrs in a SINGLE ttf file? I have noticed that some of the windows fonts (New times Roman, Arial, Tahoma) have more than 1500 slots. How these fonts with extended chrs are made? <br>  <br>2) If we are successful in making fonts with the above structure, can we use it in Adobe PageMaker? (Because 90% of the DTP centers are using this package for final layout) <br>  <br>3) Is the font structure of Linux based on 16 bit chr? <br>  <br>We would be indebted for your reply. <br>  <br>Thanking in anticipation, <br>  <br>Hussain <br>Documentation Officer <br>Kerala Forest Research Institute <br>Kerala, India <br>  <br>hussain@kfri.org</p>"
  html_clean: "<p><i>I received this email recently. Can we help this person find some answers to his questions? -jb</i> <br> <br>Respected Sir <br>  <br>Our language Malayalam has got more than 900 unique characters. (It is one of the national languages of India, spoken by 30 million people of Kerala, the southern most state in India). <br>  <br>25 years ago we had cut short our mother chrs to 90 to accommodate in typewriters. Since then we followed these chrs in printing and computers. <br>  <br>Two years back we started a linguistic movement (non-profitable) to resurrect our lost chrs in typesetting, because our  original chrs were functionally superior and aesthetically more beautiful. The movement is called RACHANA which means 'graceful, Divine  Writing'. <br>  <br>We designed two typefaces using Fontographer. Each typeface consists of 6 ttf files to accommodate all the 900 chrs. We programmed an editor called Rachana. With Rachana all the conjuncts can be made by combining basic keys. <br>  <br>Rachana is slowly spreading. So far 6 books have been published by different publishers. <br>  <br>Now, we would like to have your expert opinion on the following: <br>  <br>1) Can we accommodate all the 900 chrs in a SINGLE ttf file? I have noticed that some of the windows fonts (New times Roman, Arial, Tahoma) have more than 1500 slots. How these fonts with extended chrs are made? <br>  <br>2) If we are successful in making fonts with the above structure, can we use it in Adobe PageMaker? (Because 90% of the DTP centers are using this package for final layout) <br>  <br>3) Is the font structure of Linux based on 16 bit chr? <br>  <br>We would be indebted for your reply. <br>  <br>Thanking in anticipation, <br>  <br>Hussain <br>Documentation Officer <br>Kerala Forest Research Institute <br>Kerala, India <br>  <br>hussain@kfri.org</p>"
