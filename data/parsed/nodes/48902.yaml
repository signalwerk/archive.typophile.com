      <p>Can I use these character sets (AL-1 through -5) in the fonts I publish, and mention in my documentation/publicity that my fonts support these "code pages"? </p>
      <p>If so, isn't this all getting rather non-standard, with foundries such as H&amp;FJ and their "Latin-X" encoding, and Microsoft with WGL-4?</p>
      <p>What is the difference between a code page, a glyph list, and a Unicode chart?</p>
      <p>AL-3 doesn't support ISO 8859-14 Latin 8 (Celtic), which seems to be part of the established ISO set of 1 through 10 encodings.</p>
      <p>Where is the capital Eszett?</p>
      <p>"almost equal to" is not really "approximately equal to", it sounds more like "slightly less than".</p>
      <p>I note that you worked with Paratype on the Adobe Extended Cyrillic character set, which is very similar in coverage to the Paratype "Asian Cyrillic" code page. I followed the Paratype Asian Cyrillic code page in my Modern Suite fonts. I like the utilitarian rationale.</p>
