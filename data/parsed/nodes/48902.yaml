      <p>I haven't really talked about implementation yet, but in short: we'll be making use of combining diacritics using OpenType mark positioning, and in fact many, many combinations should "just work" which are not listed (and won't be explicitly tested, either). More on this in a future blog post.</p>
      <p>I agree with Charles Ellertson that "macron below" is probably the right description for those IAST Indic transliteration characters (although the source I was using used the "line below" description).</p>
      <p>Cheers,</p>
      <p>T</p>
