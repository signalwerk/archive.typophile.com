      <p>&gt; Can I use these character sets (AL-1 through -5) in the fonts I publish,</p>
      <p>Yes.</p>
      <p>&gt; and mention in my documentation/publicity that my fonts support these “code pages”? </p>
      <p>You are welcome to mention support for these character sets (or more properly glyph complements) in your documentation. (They aren't code pages... see below for some handy definitions.)</p>
      <p>&gt; If so, isn’t this all getting rather non-standard, with foundries such as H&amp;FJ and their “Latin-X” encoding, and Microsoft with WGL-4?</p>
      <p>"Latin-X" is either a character set or a glyph complement, but it's not an encoding. But to your point, sure this is all "non-standard" because there were no standards in this area which we found useful. If there were standards, it would be an open question as to whether they would be keeping up with changes and developments in Unicode....</p>
      <p>Why did we not just adopt these other companies' standards? Basically they didn't meet the needs we were trying to meet, in terms of global language support. I'm not saying they aren't useful and of course they support lots of languages and that's great. They just didn't do some things we thought were important.</p>
      <p>WGL-4 is completely euro-centric: it includes support for languages spoken by only tens of thousands of people (e.g. Sami) but doesn't include support for langauges spoken by tens of millions of people (e.g. Pilipino/Tagalog in the Pacific and Yoruba in Africa).</p>
      <p>I haven't studied H&amp;FJ's Latin-X character set closely (Latin-X is a registered trademark of H&amp;FJ, so not sure we could use the name even if we used the character set), but I see that it doesn't support Pinyin transliteration of Chinese, something that I put in AL-4 (and hence in AL-5 as well). Neither does WGL-4, of course.</p>
      <p>&gt; AL-3 doesn’t support ISO 8859-14 Latin 8 (Celtic), which seems to be part of the established ISO set of 1 through 10 encodings.</p>
      <p>Okay. Is this a problem? Why?</p>
      <p>&gt; Where is the capital Eszett?</p>
      <p>U+1E9E. It's in AL-4 and Al-5. It was subject to some debate internally. One of us favored to relegating it to AL-5 only, under the theory that it isn't going to see much use at all. But we are putting it in AL-4, and we may very well add it to most of our AL-3 fonts as well in some retrofit some day.</p>
      <p>&gt; “almost equal to” is not really “approximately equal to”, it sounds more like “slightly less than”.</p>
      <p>I have no idea what you're referring to here. Can you clarify?</p>
      <p>&gt; I note that you worked with Paratype on the Adobe Extended Cyrillic character set, which is very similar in coverage to the Paratype “Asian Cyrillic” code page. I followed the Paratype Asian Cyrillic code page in my Modern Suite fonts. I like the utilitarian rationale.</p>
      <p>Yes, I asked Emil Yakupov from Paratype to review the work. Similarly, I got feedback from several folks on aspects of the new extended Latin charset, most notably Robert Bringhurst on pan-Athapaskan coverage.</p>
      <p>I wrote up a set of definitions for you as well, but they got eaten by the Web. I'll rewrite those and post them on my blog....</p>
      <p>Cheers,</p>
      <p>T</p>
