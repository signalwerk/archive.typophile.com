      <p>&gt; <em>Shouldn’t the “line below” characters really be “macron below” characters?</em></p>
      <p>The Unicode names say "WITH LINE BELOW", but yes, what should be used is a macron. If you look at the second page of the <a class="freelinking external" href="http://www.unicode.org/charts/PDF/U1E00.pdf" rel="nofollow">Latin Extended Additional</a> chart, it actually says that,</p>
      <p><cite>In this block the names "WITH LINE BELOW" refer to a macron below the letter.</cite></p>
