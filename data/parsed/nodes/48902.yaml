    html: |-
      <p>I've spent some time with the spreadsheet(s) &amp; have a question on the IAST Indic transliteration -- perhaps this is more for the Unicode consortium than Adobe, but here goes:</p>
      <p>Shouldn't the "line below" characters really be "macron below" characters? That is how I've always constructed them. Compare, for example, 1E5D with 1E5F. As  understand it, the combining low line (0332) connects on the left &amp; right; the combining macron below (0331) would have the same width as a macron, 0304 (macron above).</p>
      <p>This question comes up fairly often for us. Kiowa too uses either a "line below" or "macron below." We usually try to steer people to the macron below, which will have the same width regardless of the setwidth of the character. And while is isn't suppose to come up in Kiowa (I'm told only one macron below per word), if you have two adjacent characters with a combining line below, you get, in effect, an single line under two characters.</p>
      <p>* * *</p>
      <p>In general, I think I'm in a bad position to comment on the new character sets. All my experience is with reacting to texts sent to us for typesetting. In that position, I have to draw up only the glyphs needed for a particular job. Moreover, we can, and sometimes have to, accommodate authors/publishers with differing orthographies for the same language. On the other hand, someone who is primarily a font designer and who isn't going to revisit the fonts very often has to plan ahead. From my perspective, Thomas' &amp; Miguel's job is far harder than mine.</p>
      <p>The only thing I'd question is if the combining diacritical marks shouldn't be included at a rather basic level. These, not the legacy diacriticals, are where things should be headed.</p>
