      <p>Paul,</p>
      <p>The Live Trace feature doesn't use a single line of Streamline code. Adobe did not develop Streamline and did not have rights to the code, they just distributed it.</p>
      <p>David,</p>
      <p>When you refer to "Auto Trace" (which you've done in multiple posts), do you mean the Live Trace feature in CS2, or do you mean the Auto Trace tool in earlier versions?</p>
      <p>The two have very different capabilities, so it would be good to know which you mean, especially when making comparisons to Streamline.</p>
      <p>I agree that hand-tracing will always give the cleanest results. Personally I would not use any automatic tracing function of any program for letterforms or simple logos or other designs that should have precise geometric contours. Live Trace is at its strongest for posterizing photos or very complex but not precise images, where hand-tracing would be prohibitively time consuming, and some degree of impressionistic distortion is a desired design goal. Which probably is not the most relevant application to a typophile discussion.</p>
