      <p>The main thing to bear in mind is that the higher resolution the scan the better autotrace will cope with it (albeit slowly and with too many points). There's a lot to be said for high resolution greyscale tiffs of pencil drawings rather than vector graphics, you will never achieve the same texture by tracing manually or by machine. That said, it is worth looking at the options for live trace in the drop down menu you can get very different results. If the drawings are intended to be smooth and untextured you are better off beziering by hand over a placed scan as trace creates compound paths which to my mind hamper revisions. Magnus' example looks good on screen at that size but zooming in tight there will be all sorts of marks that aren't pencil-like.</p>
      <p>I miss Dimensions (and to a lesser extent Streamline), I use it at home in classic mode.<br>
      Tim</p>
