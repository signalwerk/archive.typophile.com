    html: |-
      <p>Live Trace and Live Paint can both be really powerful tools, if you throw the right kind of artwork at those filters.</p>
      <p>I never liked Adobe Streamline and have played around with it through several versions, starting with the one that shipped with Illustrator 4.0 back in the early 1990s. The problem is vector trash in the resulting conversions.</p>
      <p>Vector trash isn't really all that bad if all you intend to do it send the artwork to print or post it on a web page. I work in a large custom sign manufacturing company. For my purposes, the artwork needs to be really clean or at least consist of all closed paths. Streamline would generate lots and lots of little, stroked 2 point line segments and lots of other open path segments which were absolutely useless.</p>
      <p>I agree about the comments on manually digitizing artwork. IMHO, Photoshop has the best pen tool and combination of keyboard shortcuts found in any program capable of making vector objects. Once you get used to the keyboard shortcuts it's fairly easy to accurately digitize sketches and other line art. However, if the artwork is technical in nature and not so "organic" it will be easier to do the work in Illustrator (or Freehand or CorelDRAW).</p>
      <p>Photoshop's "Make Work Path" command can do wonders on quickly creating vector artwork from high contrast scanned images -and do so by creating paths which are usually always full closed loops. Naturally, you'll need to tweak the brightness/contrast settings and perhaps even use a few blur and sharpen passes. If the artwork is clean enough, fire up the Color Range dialog, play with the fuzziness slider and then create a selection. Then execute the Make Work Path command and export the resulting path to Illustrator format.</p>
    html_clean: |-
