      <p>I've yet to really solve the i diacritic issue but what I do is establish a class for the left side of say, the letter /o/ and use it for the c,e, and whatever else has the same left side shape. I then make a class for the left &amp; width of where the original letter is used to define the diacritic characters. For ligatures, I have a class for the right side. </p>
      <p>I hope that made sense.</p>
