    <p>Hi there<br>
    I have stayed away from Metrics Classes in Fontlab up until now because of the 'disappearing Metrics Classes' bug. Is that bug gone now with the 5.0.3 release?</p>
    <p>The case is that I would love to use Metrics Classes in my MM font. I have a set of working Kerning Classes that I use for the two endpoints in my MM design. Can I use the same set of Kerning Classes as Metrics Classes somehow? And if I can, then how do I set it up without breaking anything?</p>
