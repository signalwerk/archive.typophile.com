      <p>An alternative to using Metric Classes,<br>
      will be to write a script to set the metrics for you.</p>
      <p>In the first lines you can define the left and right side bearings for the typical letters.<br>
      Then you define the groups, and finally you apply the changes.</p>
      <p>This way you can update everything quick and easy.</p>
      <p>But it's just an idea, still have to learn python.<br>
      Maybe you can write it Claus :)</p>
