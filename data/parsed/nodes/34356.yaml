      <p>A bit late ... <a href="http://www.kltf.de/downloads/KLTF-KerningToMetricsClasses.zip" rel="nofollow">this script</a> creates an equivalent metrics class for every kerning class. Also sorts into OT, kerning and metrics classes. (Note: It will remove all existing metrics classes. Also, you need to turn on kerning/metrics classes by hand.)</p>
      <p>Hm, I don't use metrics classes.</p>
