      <p>I'm currently working on FontLab 504 in Mac OS 10.6.8. I'm newby to font metric classes and looking for someone to guide me in this tedious work. I have defined a new metric class by hand, my key glyph has their LSB and RSB set, composites have different values, How do i transfer the key values to the composites by class? I'm avoiding the obvious copy paste special process.</p>
      <p>Thanks in advance. PD. I'm figuring out how metric class works.</p>
