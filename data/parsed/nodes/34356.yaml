    html: |-
      <p>Ok, I figured out. First you have to create the metric class –either by hand or in auto mode (this last one isn't that precise)–; open the Metrics Assistance under Tools menu and check the classes you want to apply. That's it! click Apply and Save button.</p>
      <p>For the I and their accented composites, you will have to use the measurement tool and meke sure to check it, so, the LRS and RSB will be copied from the stem, and not from the very edge of the bounding box.</p>
      <p>Hope this works. =)</p>
    html_clean: |-
