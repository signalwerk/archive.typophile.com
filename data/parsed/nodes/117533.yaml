    html: |-
      <p>As you can see from the differences between repeating letters, this is probably handmade.<br>
      I don't know if it's based on some old font of the era and if this font is actually digitized, so I suppose your best chance is to find something similar in style &amp; contrast.</p>
      <p>If nobody else finds something closer, take a look on the following similars:<br>
      <strong><a class="freelinking external" href="http://www.myfonts.com/fonts/flat-it/cotoris/" rel="nofollow">Cotoris (Bold)</a></strong> by Ryoichi Tsunekawa [Flat-it type, 2006]<br>
      <strong><a class="freelinking external" href="http://www.myfonts.com/fonts/anewmachine/holt-sans/" rel="nofollow">Holt Sans</a></strong> by  Kent Swecker [A New Machine, 2012]</p>
