      <p>The sign maker would have been familiar with Dutch lettering artists. Some of their work has been fonted. For a comprehensive review of Dutch fonts see Luc Devroye's page on Dutch type design <a href="http://luc.devroye.org/holland-index.html" title="http://luc.devroye.org/holland-index.html">http://luc.devroye.org/holland-index.html</a> I know I have seen something like that _R_ in a Dutch font, but I can't recall the name.<br>
      Don</p>
