    <p>Horrible news for metal type aficionados everywhere:</p>
    <p>Jim Heagy, proprietor of an enormous warehouse stuffed to the rafters with industrial surplus junk (including many hundreds - thousands? - of drawers of well-organized metal and wood type, and lots of wrapped foundry type and a whole room full of ornaments and cuts) is being PERSECUTED by the MAN and forced out of his Hunters’ Point Naval Shipyard space.</p>
    <p>The Navy in its infinite wisdom is selling the property off to private developers with the blessing of the City of San Francisco and as part of the environmental review process must dig up many sewer lines and perform other underground work which requires, supposedly, the premises of all rented units  to be empty as of February.</p>
    <p>So - shall we plan an enormous type-buying trip / exploration to HPNS in the coming months? Who knows what Jim will do with all of that stuff. He’s got matrices, books, specimens, lots of supplies and some presses, too.</p>
