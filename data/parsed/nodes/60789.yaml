      <p>Because of its construction, pointed nib pen, Bodoni's sans counterpart is something in circle of Helvetica and other "swiss" typefaces.<br>
      Massimo Vignelli had some good combinations of Bodoni and Helvetica - especially in period of 60's and modernism.</p>
      <p>Avenir and Avantgarde, that is a bit tough, because they are geometric fonts, and first answer would be Bodoni or anything in didone area. Avantgarde has its serif compatriot in Lubalin Graph, slab serif version of avantgarde.</p>
