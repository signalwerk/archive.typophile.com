    html: |-
      <p>Bringhurst suggests several traditional combinations. Off the top of my head:</p>
      <p>Gill/Perpetua<br>
      Futura/Bodoni<br>
      Frutiger/Meridienne<br>
      Helvetica/Craw Clarendon<br>
      Syntax/Minion</p>
      <p>I have had success with Helvetica Neue and ITC Century, especially due to the fact that they are both large families. The trick when combining serif's and sans' is to counterbalance the x-height, stroke width, character width, ascenders, descenders, cap height, axis &amp;c. That's a lot of different variables. Look at <a class="freelinking external" href="http://typophile.com/node/55767" rel="nofollow">this thread on Utopia and Univers</a> for a good Illustration. The traditional school of thought says go for similarity or contrast, but not in between (shit or get off the pot). Utopia/Univers is a good example of similarity while Futura/Bodoni is a good example of contrast. If you can afford to, I highly recommend investigating Berthold's Futura Serie as it has small caps and old-style figures.</p>
      <p>Some typefaces, such as Rotis, have both which can be convenient. And recently, I noticed that Font Bureau has a similar/compatible list of typefaces on the right hand side of their specimens. Also very convenient.</p>
      <p>At the end of the day however, it's not the font, it's how you use it that counts.</p>
      <p><em>(but that's just something people with small fonts say)</em></p>
