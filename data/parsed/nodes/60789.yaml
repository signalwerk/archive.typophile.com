    <p>Hi everyone</p>
    <p>I'm creating a prototype magazine for a class assignment, and am looking for two particular fonts to use within it. </p>
    <p>It's a sixties-inspired magazine, but still contemporary. I want it to look clean and professional - nothing that reminds me of Austin Powers!</p>
    <p>I'm keen on Bodoni for headings, but what is a sans serif that goes with it? A typeface I can use for the body copy? Any good ideas?</p>
    <p>On a side note - what are good serif fonts that go with avenir or avant garde (or serif for courier new - that isn't helvetica)?</p>
    <p>Hope you can help!</p>
    <p>Thanks</p>
