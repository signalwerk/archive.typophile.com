      <p>Funny you see it as <cite>Czech influenced</cite>, Chris.<br>
      In this German <a href="http://www.fontblog.de/helvetica-der-kulturen-der-welt" rel="nofollow">Fontblog thread</a> (about the recently replaced logo of <a href="http://en.wikipedia.org/wiki/Haus_der_Kulturen_der_Welt" rel="nofollow">Haus der Kulturen der Welt</a>, designed by <a href="/wiki/Cornel%20Windlin" class="freelinking" rel="nofollow">Cornel Windlin</a>/<a href="/wiki/Neville%20Brody" class="freelinking" rel="nofollow">Neville Brody</a>), <a href="http://www.fontblog.de/helvetica-der-kulturen-der-welt#comment-28235" rel="nofollow">HD Schellnack</a> characterizes a similar ‘K’ with ‘bent leg’ as having a ‘Russian touch’.</p>
  - id: 225073
    user: 3135
    date: 2007-09-06T10:28:00
    date_raw: 6 Sep 2007 — 10:28am
    votes: null
    html: |-
      <p>I would grant that the Czechs had a very strong Russian influence, particulary during the era of the Soviet Union. I think the Czechs were far more likely to be open to experimentation in letterforms and gutsy about implementing them. Veronika Burian gave an inspiring presentation at TypeCon '07 showing some very innovative examples of Czech work.</p>
      <p><a href="http://flickr.com/photos/ebensorkin/1225352194/in/photostream/" title="http://flickr.com/photos/ebensorkin/1225352194/in/photostream/">http://flickr.com/photos/ebensorkin/1225352194/in/photostream/</a></p>
      <p>ChrisL</p>
