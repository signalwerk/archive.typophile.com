  - id: 89680
    user: 2942
    date: 2005-10-07T10:51:00
    date_raw: 7 Oct 2005 — 10:51am
    votes: null
    html: |-
      <p>Hmmm</p>
      <p>There are a lot of posts on Typophile about this. And I am less expert than most of the folks here. By all means read up on what they say about this topic &amp; process. </p>
      <p>But if pressed I suppose I would have to say these kinds of things:</p>
      <p>1. Type shapes need to be bourne out of not just an idea of how they could be shaped but how they combine with other letters/numbers/punctuation (glyphs). The whole relationship is important &amp; all the elements feedback on each other. This makes for a design process not unlike a hall of mirrors. This is true in general for all type - but it is *especially true* in a face that may be meant for text - which yours seems to be. Getting to the point where the shapes are designed in this way will probably take lots of time and maybe even several typeface designs. </p>
      <p>2. Before worrying about Kerning try to get as good a set of basic Spacing as you can. Learn which combinations are likely to give you trouble anyway and discount them for the purposes of initial spacing. An example is 'Av'. The spacing on this combination will need to be kerned later, but the spacing on Ao should not have to be kerned. Get that one right with basic Spacing. But search here on Typophile &amp; on google. Remember, your forms will also dictate. Whatever rules you find, your own eye has to be the final judge. </p>
      <p>3. When you get the basic spacing right apply kerning to the special cases. </p>
      <p>Test the face &amp; you may decide to alter your shapes, basic spacing or kerning - or all three.</p>
      <p>And then you go around &amp; around again with this process until you think it's good.</p>
      <p>I like your shapes BTW.</p>
