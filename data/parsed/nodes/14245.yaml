    html: |-
      <p>The process I use at the moment is described in 'Letters of Credit, by Walter Tracy'. This involves spacing characters like oonnoo and oohhoo, then using the side bearing values for other characters with the same shapes, so the spacing for the left side of the lowercase 'c' would be the same as that for the lowercase 'o'. I had actually spent time spacing Depot, but I obviously need more practise.<br>
      I feel more confident with Kerning, but the spacing needs to be more complete, Depot does have Kerning at the moment, its proably not apparent as the spacing is incorrect.</p>
