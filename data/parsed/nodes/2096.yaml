    html: <p>Oops! I DID have Modena, but it was in the <a href="http://bowfinprintworks.com/Script06Pg15.html" target="_blank">Sans ID Guide</a> (at the bottom of the page). The sample he gave me of this must have used a different version of the 'y', because what I show doesn't match that letter in the other post of Modena that Yves linked.</p>
