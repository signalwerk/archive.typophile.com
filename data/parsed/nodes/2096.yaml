    html: <p>I looked at Yves link there (I must have missed that thread originally) and the post says I had "Modena" on my site, but that font was actually <a href="http://bowfinprintworks.com/Script06Pg15.html" target="_blank">"ModenA"</a> by  Zhivko Stankulov of Fonteam International. Miles Newlyn personally had supplied about 4 or 5 samples for the Script Guide  (Ferox, Bugini &amp; Luvbug with variations), but Modena wasn't one of them.</p>
