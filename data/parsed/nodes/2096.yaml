    html: <p>Just a follow-up. Coincidentally, I heard from Miles Newlyn with an ID question yesterday and mentioned to him about this thread. He wrote this morning and said the font is Modena Condensed (no 'r' in the font name) and that it was 'a custom redraw with some very odd characteristics (ie the huge x height, and the unique y)'. <br> <br>He also said that Modena (pure) will be available next year.</p>
