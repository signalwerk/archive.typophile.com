    html: <p>In my experience, this has a lot to do with the specific printing process you're using, as well as the particular image in question. For example, running a web press on newsprint you want to crank the GCR to the max. You can't get good shadow density anyway on newsprint. Sheetfed offset on glossy coated paper, you want pretty light GCR. But the particular image is also relevant. <br> <br>The UCA will help keep the shadows dense while the GCR cleans up the midtones and allows for brighter colors. <br> <br>Cheers, <br> <br>T</p>
