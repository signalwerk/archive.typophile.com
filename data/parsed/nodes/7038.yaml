  html: <p>So-- <br>Curious if anyone here hs any higher end experience with color seperations, specifically different levels of GCR, and what may be more appropriate for an image I am working with?? <br> <br>Hildebrant.</p>
  html_clean: <p>So-- <br>Curious if anyone here hs any higher end experience with color seperations, specifically different levels of GCR, and what may be more appropriate for an image I am working with?? <br> <br>Hildebrant.</p>
