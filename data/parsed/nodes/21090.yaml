      <p>Hey Jesse</p>
      <p>Some good points are made here; logo lettering skills are not necessarily the same as having worthwhile day-to-day handwriting.</p>
      <p>However, all of them are based in drawing and borne out of practice.</p>
      <p>In addition to Stephens good advice at post#2 (which you say you need to re-read; heck! I re-read it <strong>all the time !</strong>) you could look at the writing manuals produced by <a href="http://briem.ismennt.is/d/dd/dda/ddad.htm" rel="nofollow">Alfred Fairbank</a>. These should be available secondhand at many of the sources listed above.</p>
      <p>I think I'm right in saying that Fairbanks work in the UK left a legacy of instruction for all English primary schoolers – cursive hand was still taught by rote when I was there, but like Bert says, that's going back a while.</p>
      <p>Of course, you could also pick up a copy of <a href="http://www.typophile.com/node/15712" rel="nofollow">The Stroke</a> by Gerrit Noordzij if you want to take it further.</p>
