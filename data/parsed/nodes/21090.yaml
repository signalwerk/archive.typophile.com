      <p>One might follow the other, handwriting can be improved by calligraphy too. The difference in disciplines I was referring to is calligraphy on one hand and lettering a logo on the other, for the latter you need more of a skill in hand rendering typefaces and developing them, they aren't totally separate but there is room for more imprecision with calligraphy. For that kind of skill I would look at drawing up a few characters by hand until you can identify the typeface by the sketch.<br>
      Tim</p>
