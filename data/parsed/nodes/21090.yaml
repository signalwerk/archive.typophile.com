      <p>"Sketching, erasing, testing several ideas, all operate as part of a pre-digitization stage that is very useful in weeding out stupid ideas, helping make decisions and saving time. "</p>
      <p>I know Carl, but how do you know what's useful, and what's stupid until it's a letter among letters, which it isn't until it is. I'm not saying no one should draw letters with pencils or crayons, but I'm fairly certain from being born early enough, that I know I could have skipped the pencil stage for type design entirely and not missed a beat, (with the exception of 1 or 2 napkin sessions). I could not have skipped calligraphy. But if you look at development: metal types are made in metal, film types in film, sign painting is painted, and digital fonts are digitized, because it's where the idea hits the medium that type design happens. Before that happens, anything else is a substitute for a well trained imagination and experience. And, you don't get the experience to train your imagination until you know how to make fonts in their native from from the start.</p>
