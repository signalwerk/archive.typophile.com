      <p>&gt; <em>Why does on-screen drawing have to be an imitation, or refinement of paper drawing?<br>
      Why can’t it be its own beast?</em></p>
      <p>It IS its own beast!</p>
      <p>I tried to "hint" at what I meant by each tool having its own unique and intrinsic aspects, but I guess I should elaborate (duh... too many words to express what's beautifully simple in nature).</p>
      <p>It's not about getting from Point A (nothing) to Point B (something).<br>
      It's about the pathway which makes for unique learning and discovery.</p>
      <p>Each <em>tool</em>, each <em>method</em>, each <em>technique</em>, each <em>medium</em>, each <em>problem</em>, each and <em>every time</em> you engage yourself is an <em>opportunity</em> to explore and discover something.</p>
      <p>If you could "will" a house into existence, that would be terrific!<br>
      (And I'm certain that at one point in technological/biological developments, one will be able to "draw" imagery on the screen by mental commands.)</p>
      <p>Though building a house using only hand tools, or only power tools may get the same or similar results as the "mentally" constructed one, the <em>experience</em> (pathway) and <em>understanding</em> (discovery) would EACH be uniquely different.</p>
      <p>In other words, it's not about the <em>end result</em>, but it's about YOU, how you got there, what you've learned, and what you've experienced... all of which will make your <em>next project</em> "slightly different" with something more of YOU in it.</p>
      <p>In summary -- each tool offers unique pathways, and each pathway is an opportunity. In the end, it's really YOU who count and not "how you did it".</p>
