      <p>We've had some discussion about computer vs. handwork in the past.</p>
      <p>My take at the moment is this --<br>
      Each "tool" has intrinsic apects that are unique in approach, hand-eye-brain processing, execution and result.</p>
      <p>The more versed you are in using several "tools", the better you are able to make judgemental transferences between process and outcome. (Like using Illustrator to create chisled letterforms.)</p>
      <p>But the unique experience of using a particular "tool" or medium can lead you down particular "higher function" paths... all viable, by the way, but all unique nonetheless. Like the difference between an artist using brush and oils vs. collage, or a composer writing a score while humming vs. using a synthesizer, or mathematicians/physicists solving equations on chalkboard vs. calculators.</p>
      <p>I can't tell you which approach is "better", I can only tell you that each is different based on tool and individual.</p>
