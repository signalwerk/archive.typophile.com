    html: |-
      <p>The calligraphy basic exercises (forming oooooo and mmmmmm shapes) are just as applicable for the lefthanded, just a little more complicated, you could try cutting a pencil to a chisel point and amending that (by using it and wearing down the edges you need to use) until you achieve an angle that you can make successful marks with, rather than using a pen which will reduce the pushing problem or you could try working upsidedown (I know someone who does this and it's not for everyone). It's a different discipline to lettering though.<br>
      Tim</p>
