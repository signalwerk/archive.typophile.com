      I'm defining drawing as the process of physically making a line, non device-specific, quite literally drawing it out. I'm not investing "drawing" with any cultural values -- such as I've acquired at art school and as a pre-digital art director.</p>
      <p>My philosophy here is not to overvalue my own pre-digital drawing skills against those of (younger) digitally-centred designers. It's because I'm trying to "imagine starting a career in graphic arts with nothing but a computer and software," that I'm wondering why it's necessary to master an obsolete medium.</p>
      <p>Using drawing on paper as part of the process to design and render lettering or fonts is still legitimate, and I have a great appreciation for it -- but it's not necessary. There are other ways of working, which may be more in tune with present day reality, more true-to-materials than legacy media.</p>
      <p><em>However, if the only skill one has is moving a mouse around and tapping keys, that does NOT offer the “designer” anything like the control, visual acuity, or coordination to convey their ideas visually, that one develops while learning to draw.</em></p>
      <p>I agree with you about the mouse being a poor tool, a stylus is much better. But I disagree with the notion that learning to draw can only be done on paper. If designers don't have hand skills it's because they haven't spent enough time developing them. Whether they do it with ink on paper or stylus on tablet is irrelevant.</p>
      <p>Ideas which are to be conveyed visually don't just materialize out of the purity of the designer's mind, they also concern the potential of the tools used, and the way the designer works with them. In that sense, it is false to bring the baggage of paper-drawing skills into digital work. </p>
      <p>There is a relationship between old-school drawing, a certain kind of visual acuity, and classic lettering styles, obviously, and if some type designers want to create classic work from scratch, pen and ink provides insight. That's part of what I do. But it's not the only way to repurpose the past with digital media.</p>
      <p>I recall another Typophile thread, where it was revealed that several accomplished type designers can't draw worth squat.</p>
