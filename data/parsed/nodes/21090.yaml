      <p>&gt;So what are some good practices I can do to learn how to hand letter beatutiful type?<br>
      Hand lettering and Calligraphiy were two things. If you want to learn the former, a good practice is to tracing letters.</p>
      <p>&gt;Any suggestions for left-handers? “<br>
      My caligraphy teacher in the early 70s would walk by the lefthanded people, go back into his office, get a lugar automatic pistol, and bring it to you. No lie. And this, was a required course. I changed hands until I got migranes, then I went into the litholab, learned backwards left-handed, printed, and got credit for two classes by the time I was through with them four years later.</p>
