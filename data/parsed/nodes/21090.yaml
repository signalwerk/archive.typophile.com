      <p>"Carl, everybody starts out drawing on paper, usually with Crayola"</p>
      <p>And some of them stop immediately after they put the crayon down.</p>
      <p>"If designers don’t have hand skills it’s because they haven’t spent enough time developing them."</p>
      <p>How about ZERO time? Am I being clear enough?</p>
      <p>I notice that people who only draw onscreen or with beziers tend to be seduced into believing their work is finished long before they have explored all the possibilities. Sketching, erasing, testing several ideas, all operate as part of a pre-digitization stage that is very useful in weeding out stupid ideas, helping make decisions and saving time. That's really valuable to me, and judging from all the bad new typefaces out there, it would benefit a lot of others. </p>
      <p>You can certainly digitize a typeface and then play with it, change it, transform it. I do that myself.  I just don't think everyone is making use of a development period, and it shows.</p>
