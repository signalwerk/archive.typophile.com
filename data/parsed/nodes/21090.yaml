      <p>I view the difference between computer drawing and paper drawing much the same way as I did the difference between the several types of paper drawing. In the before computer era, we did freehand drawing, constructed drawing (using drafting tools) and even cutting with knife and straight edge (Rubylith, etc.). Knowing good constructing/drafting technique was not-that much aid in freehand pencil technique, true, but in training the eye and mind to see and understand, it all helped. There is no "best Way" to work or learn. Each person has to find their own best way.  It does help to drink of many waters though to know about other possibilities.</p>
