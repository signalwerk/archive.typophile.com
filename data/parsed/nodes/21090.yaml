    html: <p>Nick your points are good ones - however I think that they are most applicable post-training.  For lots of folks ( maybe not everybody ) there is no better way to train the mind to think in visual tems than with drawing &amp; hand skills of all kinds. I don't think it's a question of old &amp; busted media vs. the new hotness of digital so much as a question of having a full set of mental tools and approaches to draw on.  After you have some experience with the full set of tools and ways of thinking &amp; experiencing you can better afford to pick the ones that work best for you. Being without the options is a kind of mental impovrishment. I think that Carl is sort of saying 'don't put these kids in a digital ghetto'. And if so I think he is right. I also think that the 'baggage of paper-drawing skills' is a rich cultural hertiage that is worth having a nodding aquatance with at least - again from a training point of view.</p>
