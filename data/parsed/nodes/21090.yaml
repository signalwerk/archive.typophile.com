      <p>I don't buy the digital/analog split.<br>
      One can draw on screen.<br>
      Grabbing a curve between two BCPs and manipulating the shape until it looks right is drawing.<br>
      So too is selecting a number of points, or even an entire glyph, and manipulating that with, say, the skew tool.</p>
      <p>The distinction between the media is that analog drawing is about making marks, whereas digital drawing is more about adjusting shapes. For instance, constructing a path shape with the pen tool is very difficult as straight drawing, even with a stylus; however, the best practice working method is to draw the rough shape and then refine it with other pen tools.<br>
      The subtle real-time adjustment of a digital shape till it looks right to the eye constitutes drawing, just as much as making a mark with pen on paper. Drawing is the interplay of hand, eye, and image, with real-time feedback.</p>
      <p>While it's true that some curves can best be drawn on paper, using the kind of control facilitated by the drag of friction between pen/pencil and paper (or the suppleness of a fine brush) -- and scale may be a factor too -- it's also true that other kinds of curves, most notably those of simple mathematical form, are best drawn with a ruler, compass or template, and these are best done with a computer. Actions like playing with skew can only be done on a computer.</p>
