      <p>Any suggestions for left-handers? I know there are angled nibs, but they always seemed kinda awkward to me. Southpaws have not only the problem of smearing the ink we've just written, but also pushing the nib ahead of our hand instead of letting it trail behind it.<br>
      This does tend to leave us constructing the letterforms for everyday handwriting differently from right-handers (eg tending to start a capital E at the top-right hand corner and then drawing the central crossbar right-to-left).<br>
      Or am I just making excuses for myself because I know my handwriting is crap? I'd love to have an elegant script like my dad (and his generation?) did...</p>
      <p>________________________________________<br>
      Ever since I chose to block pop-ups, my toaster's stopped working.</p>
