    html: |-
      <p>What kind of fonts are you actually making? OpenType fonts or old-school Unix PostScript Type 1 (.pfa) fonts or something else?</p>
      <p>For OpenType fonts it should not matter when you use periods in glyphnames (as long as your OpenType features reference them). But PostScript Type 1 fonts don't support OpenType features *and* need to comply with certain encodings. Some time ago I had to generate Unix pfa fonts in Adobe Standard Encoding for use in Framemaker for instance.</p>
