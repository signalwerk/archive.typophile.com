    html: "<p>Hi Rodrigo, I really like where Digna is going, it is open and friendy. Clean and legible in the Light and Regular weights. <br>Favorite glyphs : 6, 9, e, g, p, m.  <br>I think the Heavy weight needs larger counters, and S is  <br>a bit  too loose for my taste. <br>good luck. <br></p>"
