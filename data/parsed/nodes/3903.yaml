    html: "<p>Hi all, <br> <br>Here there are some improvements and items to correct, look at the pdf. <br> <br>Thanks a lot for your comments, but I have to say this in not a DIN font, it's a readable (maybe friendly) sans. <br>I mean, readable is a function, and Digna works on it. Friendship is a virtue, an adjective. <br> <br>Please, could you help me with the optical topics that you mention? If you want, write privately to my email. <br> <br>Thanks again.  <br> <br><!---Attachment: presenta_digna_2811.pdf-!--></p><center><table border=\"1\"><tbody><tr><td><img src=\"http://www.typophile.com/forums/icons/mime_pdf.gif\" align=\"LEFT\" alt=\"application/pdf\">presenta digna 2811.pdf<br><a href=\"http://www.typophile.com/forums/messages/29/presenta_digna_2811.pdf\"><b>presenta_digna_2811.pdf</b></a> (109 k)</td></tr></tbody></table></center><!---/Attachment-!--><!--!-/attachment-!--><!--!-attachment:--><p></p>"
