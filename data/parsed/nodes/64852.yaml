    html: |-
      <p>These are sometimes called Fleurons, or Ornaments. I checked Zapfino and this wasn't in the font. Didn't see it in Bickham Script either. Several of the newer OpenType fancy script fonts have ornaments, but I can't seem to find a good candidate offhand.</p>
      <p>- Mike Yanega</p>
