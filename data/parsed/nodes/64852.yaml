  html: |-
    <p>Can anyone recognize if this scrolly character comes from an actual typeface? I was given it by a publisher to use on the chapter openers of a book, and now, close to publication date, they're wondering what it's origin is and no one seems to know. We're hoping it might belong to a font...</p>
