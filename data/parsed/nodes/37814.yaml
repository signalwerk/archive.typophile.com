    html: |-
      <p>It seems like a beer named HAVOK, should not be contained in nice little square labels with aligned type. One thought was to look at a bandana and carve out an irregular shape from the paisly and really give the type treatment the energy it deserves. Kindof a grunge paisley explosion.</p>
      <p>If you didn’t want the western look, maybe go urban havok with it and make a stencil (or stencils) and spray the bottles.</p>
      <p>Anyhow, some fine looking homebrew. Hopefully it will taste better than some of the homebrew I’ve tried :-)</p>
      <p>R</p>
