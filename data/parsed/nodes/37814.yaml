    html: |-
      <p>Nice overall. The lugers are cool, but I’m not sure how they relate? Is this a retro German thing? Somehow the scale of all the elements doesn’t mesh all that well... you’ve got jumbo accoutrements above the type, small lugers flanking it, and then off to the sides you’ve got dainty foliage.</p>
      <p>I’m all for keeping those fine details as it adds to the overall complexity to provide character. I just think right now it’s going in a couple too many directions.</p>
      <p>Also, your condensed gothic sans (Trade? News?) is not my favorite. It feels like you left a default font there (but had the sense to not to use Helvetica). Consider something wide and heavy at a very small scale, and still in caps. I think that would blend well with the red slab serif and yet not leave it so generic.</p>
    html_clean: |-
