  html: |-
    <p>Hello all,</p>
    <p>I work with fonts in my spare time.<br>
    The most work I do is editing original fonts, but sometimes I make ones.<br>
    This my latest release, MF Dots Pro:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/mfdotspro_5158.png"></div><p></p>
    <p>&nbsp;<br>
    This is the second font I've made completely by my self.<br>
    MF Dots was done in 2007, containing only Latin. Now I've extended it with much more glyphs. Maybe I post my other self-made fonts also.</p>
    <p>You can download a free-for-personal-use beta version from <a class="freelinking external" href="http://flitskikker.fl.funpic.org/downloads/server/files/15102008/225016/MF%20Dots%20Pro.zip" rel="nofollow">here</a>.</p>
    <p>Specifications:<br>
    - TrueType format<br>
    - 3 weights (Light, Regular, Bold) + Italics<br>
    - 653 glyhps per file<br>
    - Contains Latin, CE, Greek, Baltic, Turkish, Romanian, Cyrillic and special symbols.</p>
    <p>Please rate. :)</p>
    <p>&nbsp;<br>
    ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~<br>
    Please note, that I'm a beginner in making fonts.<br>
    I used Font Creator Program 5.6 for this typeface, so don't expect high detail, OT features, etc. I have some really cool ideas for fonts, but I just don't know how to convert them to real fonts. This simple (dot-based) font I almost the only font you could make with FCP. I have FontLab installed, but don't know how to use it.<br>
    May I post some drawings of these fonts so you can give tips how to make real fonts of it?<br>
    ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~</p>
    <p>&nbsp;<br>
    Thanks in advance, and enjoy MF Dots Pro!</p>
    <p>Kind regards,<br>
    Martijn van Berkel</p>
    <p><em>Off-topic: How do I insert images in my post?</em></p>
