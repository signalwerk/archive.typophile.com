      I think I'll compress those Greek chars a bit, so that they reach the x-height.<br>
      I won't fix the "i", as this is a monospaced font.</p>
      <p>About MF: In this design it's impossible. All chars needs to be max 5x7 dots, as based on the original LED displays.</p>
      <p>I'll look for some FLS tutorials, so I can add OpenType features, small caps, etc.</p>
      <p>I discovered some more mistakes that must be fixed. ;)</p>
