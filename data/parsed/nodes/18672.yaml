    <a href="http://www.bullring.co.uk/website/" title="http://www.bullring.co.uk/website/">http://www.bullring.co.uk/website/</a></p>
    <p>It looks a bit like Din, which is the font they use elsewhere, but it’s more geometric and angled.</p>
    <p>Any ideas?</p>
    <p>Thanks.</p>
