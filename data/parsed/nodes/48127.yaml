    <p>It's unusual to post something involving music I guess ... or maybe not so much, because everybody knows the role typography have had in the music industry, specially in the vinyl age (for me at least). Fortunately I will not ask for some Britney Spears typo style, but for a Paul McCartney's one: I was just searching for some good song to makes me happy in youtube, and I found it.</p>
    <p><a href="http://fr.youtube.com/watch?v=cm2YyVZBL8U&amp;feature=related" title="http://fr.youtube.com/watch?v=cm2YyVZBL8U&amp;feature=related">http://fr.youtube.com/watch?v=cm2YyVZBL8U&amp;feature=related</a></p>
    <p>Somebody knows which is the typography just at the begining? I find it gorgeous, and, yes it's true : it's a classyc type from the 70's in all kind of folk-songwritter's  LP, but I don't know its name.</p>
    <p>I'm working actually in a library logo ... and I think I got it. :)</p>
    <p>In any case, I hope you enjoy the music. I'm sure you'll do :)</p>
