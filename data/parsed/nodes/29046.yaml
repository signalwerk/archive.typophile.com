    html: <p>You might want to look for books and articles which include anthropology as used in design and advertising. As society becomes more global, the need to understand what colors, words and symbols mean in different cultures becomes more important. One famous example is the Chevy Nova. to English speakers, a nova has to do with stars, but to a Spanish speaker, it means "doesn't go," which is a terrible name for a car. Large corporations have been taking this very seriously for several years now.</p>
