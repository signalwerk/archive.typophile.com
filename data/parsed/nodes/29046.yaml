      <p>I guess one should investigate Marshall McLuhan. He did coin the term 'global village'. Understanding Media and The Medium is the Massage are two of his books.</p>
      <p>Aside from Adbusters, which I always find too extreme and whiny, you can revisit old Tibor Kalman issues of Colors Magazine.</p>
      <p>As for companies: Coca-Cola.</p>
