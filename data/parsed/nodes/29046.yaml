    <p>Hi all,</p>
    <p>I'm doing a dissertation about 'branding and advertising in the era of globalisation.'</p>
    <p>At the moment I'm looking for different books and digital texts about the subject which is a bit hard to find. For the next meeting with my teacher I need to bring gather some visual source material that portray the growing interest for businesses to look further then the country boundries for their branding and advertising.</p>
    <p>I have been reading a lot on adbusters and some parts of books from google books, but I don't really know how to start looking for images, what keywords to use or what companies would be good examples.</p>
    <p>I kinda hoped that there would be some people around here that could help me out to get a start.</p>
    <p>Your help would be very much appreciated!!!</p>
    <p>dav2</p>
