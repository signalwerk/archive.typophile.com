      <p>I'm currently on a mission up here in Canada to de-geek chess (which I hope to advance world wide). And to accomplish this most noble task I studied the concepts and techniques of branding.</p>
      <p>Although I'm not yet 100% convinced - I think branding is old school. New school is to develope a <em>culture</em>, into which many different products can be presented.</p>
      <p>Here are two on-line articles which I hope will help your paper...</p>
      <p>This first one is from Emigre 59: <a href="http://www.emigre.com/Editorial.php?sect=1&amp;id=26" title="http://www.emigre.com/Editorial.php?sect=1&amp;id=26">http://www.emigre.com/Editorial.php?sect=1&amp;id=26</a></p>
      <p>And this one is from a NY Times article that ran a while ago now. It's a great article on <em>culture</em> and <em>subculture</em>: <a href="http://www.murketing.com/journal/?p=119" title="http://www.murketing.com/journal/?p=119">http://www.murketing.com/journal/?p=119</a></p>
      <p>Hiro</p>
