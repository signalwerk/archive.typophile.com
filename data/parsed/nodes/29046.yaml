      <p>At the risk of heading off on a tangent, seems Nova was an urban myth, in terms of actually being read as "no va" -- but I'm not a Spanish speaker.</p>
      <p><a href="http://en.wikipedia.org/wiki/Chevrolet_Nova#The_urban_legend" title="http://en.wikipedia.org/wiki/Chevrolet_Nova#The_urban_legend">http://en.wikipedia.org/wiki/Chevrolet_Nova#The_urban_legend</a></p>
      <p>The Toyota MR2 was renamed for France however, according to my brother who's owned two, and now works for them.</p>
      <p>The usual explanation is that it sounds like "merde". Wikipedia has "When said in French, the name MR2 ... sounds like est merdeux ... (fr: is filthy). Thus, the car was sold there only as the MR."</p>
      <p><a href="http://en.wikipedia.org/wiki/MR2" title="http://en.wikipedia.org/wiki/MR2">http://en.wikipedia.org/wiki/MR2</a></p>
