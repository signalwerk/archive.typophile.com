    <p>Hello All,</p>
    <p>I'm working on a logo and for the digital 'sketch' I used Futura Extra Bold Oblique.<br>
    Cliënt wants to keep that but I'm uncertain about the traps when using the logo larger.<br>
    Should I manually alter it so there are no traps or should I leave it as is.</p>
    <p>Thanks.</p>
