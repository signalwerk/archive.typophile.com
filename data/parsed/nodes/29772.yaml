      <p>The "extra" curve on 2 the harmonizes with the "serif" on the seven, and the foot serif on the 1.<br>
      They would be termed "folded" curves, using Stanley Hess' terminology -- which he really conceived for "unfolded" curves, of which Futura has a few and Frutiger a lot.<br>
      So if you are going to "unfold" the two a bit, perhaps you should also snip a bit off the 7's serif as well?</p>
