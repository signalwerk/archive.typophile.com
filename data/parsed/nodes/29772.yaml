      <p>Sorry, I forgot the irony mark.<br>
      To continue the thought, at the risk of repeating myself: if you are going to tinker with the odd letter shape, and you look a bit harder, and gradually come to see the waves that little change will make throughout the face, it becomes a very tricky process to manage. Which is why I subscribe to theory that it's better to do a radical reworking or mash-up of an old face, rather than just "fix" a few characters you think the original designer got wrong.</p>
