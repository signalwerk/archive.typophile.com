      <p>As Tiffany says, check the EULA to see whether it's OK.<br>
      The EULA is a contract, and if you purchase the licence, you agree to the terms of the contract. if you don't like the licence, find one more to your liking -- there are plenty of foundries who allow mods to their fonts, such as mine; I don't know what the AG EULA stipulates.</p>
      <p>However, I think it's a shame to tinker with old faces. Drastic systematic fontwide action is cool, but you gotta figure that the original designer was totally in the zone, or else the typeface would be in the trash can of history by now, not a classic. So everything is in perfect balance, and if you move one jot or tittle, Jenga down.</p>
