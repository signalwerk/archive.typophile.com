      <p>Depends what the mod is for: a custom logo or headline? If so, no worries. New version of font you can use at home without wincing? Fine, just don't share it. New version of typeface marketed as yours? Not cool. The licensing issues come up when you modify type and then go to sell or distribute it. If it's just an application of the type or a private use, it's generally ok. I'm sure the caveat here is "Check your EULA for specific restrictions" (in solemn bureaucrat voice.) </p>
