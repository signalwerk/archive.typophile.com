      <p><em>Other people (like Carl) harp about it too but you don’t seem to mind.</em></p>
      <p>I haven't been keeping count, but I have the impression you've mentioned it a lot more than he has, and in a more combative tone. Also, I don't believe he's working on a Baskerville revival. While there's nothing wrong with making a good theoretical argument, at some point we'd like to see the rubber hit the road.</p>
      <p><em>So for example claiming that Mrs Eaves’s poor spacing makes it popular is much less likely than saying it’s popular in spite of its poor spacing.</em></p>
      <p>I don't really mean that people like it just because of its spacing, but that the spacing contributes to its general effect, which is what's popular. So something which may be dysfunctional in one aspect of a type's functionality can be positive in some other respect. The principal is that the designer brings the work to a state of completion, a balanced wholeness. That's not to say that the work is perfect, merely that it's in a state of balance.</p>
