      <p>If you're having thoughts like this, it sounds like you're on<br>
      the brink of a type design addiction - consider yourself warned!  :-)</p>
      <p>It's OK to modify a glyph whenever you think it's a good idea. Some people would say that you need to check the EULA (the licensing agreement) to make sure that's allowed, but in my book as long as the results don't leave your own hard drive you're always OK. Sometimes you're even OK if it leaves your drive, but then you really should check the EULA and probably contact the font house in question.</p>
      <p>Some others like to see fonts as works of art, and not open to tinkering. I think this attitude is very anti-design - but it does have proponents (like see some of the posts in the thread linked below).</p>
      <p>The real problem is that it's quite hard to modify a good font and end up with something better. You need to be -almost- as good as the original designer. Almost, because everybody makes mistakes, and often it's easier for an outsider to see a problem and fix it (although the latter is qualitatively harder). In this case it seems like a very gentle change, and as a rule that's the most a novice can get away with.</p>
      <p>Here's an old thread that might be quite educational:<br>
      <a href="http://typophile.com/node/14378" title="http://typophile.com/node/14378">http://typophile.com/node/14378</a></p>
      <p>hhp</p>
