      <p><em>Please let me know if this is an acceptable practice</em></p>
      <p>Apart from the EULA and other issues, just looking at your 2 makes me realize how good the original is. The problem with a 2 is always to get that middle curve to turn all the way back into the head, which points the other way. Your re-designed head is too short, lacks that sharp incision at the end and make the number lean to the right. Your design is timid, the original is daring.</p>
      <p>I redesigned only one AG number once, when i did the Old Style numbers for the Light weight, back in 1988 or so for Berthold’s stationery. That set of O/S figures was never supposed to be published, altough eventually it did. Having to fit those two curves into the small x-height was very difficult and made me appreciate the original even more. All the normal 2s are so safe and boring, with their reversed S-shape. That swan neck swoop is both daring and unique! I tried it with Meta, but i chickened out of it with Officina.</p>
