    <p>Hello,<br>
    I am a graphic design student, and I have a question for professionals in the field of typography. When, if ever, is it appropriate to change letterforms in an existing typeface? I love Berthold Akzidenz Grotesk, but the "2" drives me crazy. It just looks different than the rest of the face. I am attaching a picture of it (left) and my change to it (right). Please let me know if this is an acceptable practice whether in school, or in the professional world.</p>
    <p>-Thomas</p>
