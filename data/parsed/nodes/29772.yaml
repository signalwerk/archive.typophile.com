      <p><em>it’s a worldly tool</em></p>
      <p>Exactly. Any succesful type is successful in its world, tuned to the needs of that world. Its success proves its usability and its merit, but that does not make it faultless, as Henry Petroski argues in <em>The Evolution of Useful Things</em>. Failure is the mother of invention, he says, prompting inventors to try to better what they perceive as the defects of existing products, but, "What constitutes failure and what improvement is not totally objective, for in the final analysis a considerable list of criteria, ranging from the functional to the aesthetic, from the economic to the moral, come into play."</p>
      <p>So one might point to a type such as AG or Mrs Eaves and say, "but look at its flaws" -- but how can one be so sure that it is successful despite those features, rather than because of them? The only thing to do is to try and make a better tool, and see if it works. So enough already with the Eaves critique, let's see your Baskerville.</p>
      <p>I must admit, I've tinkered with faces, my own and others (where licencing permitted), producing custom versions for clients. But I would still argue that the originals of classic faces have acquired a state of grace through the passage of time, which puts a barrier between today's redesigner and the ability to perceive all the subtle interplay of design themes which created the balance of the face, enabling it to come into being and function smoothly within the ecology of its own time -- which is why I caution against tinkering with the old ones. (But a radical makeover is another matter.) At the very least, you can be sure that quite a few people have become accustomed to, and fond of what you may consider its annoying quirks, as Muzzer opines.</p>
      <p>So I'm pretty much in agreement with the comments in your first post, Hrant.</p>
      <p>From my own experience, I think designers get in a zone when they're working. I've picked up a face I've put on hold for a while, and come across two files named A and B, and then I try and remember whether I was happy with the final round of changes I made or not. So I look at the fonts and I can't immediately see any difference, but obviously at the time I thought there was some very important fine tuning going on. Most disturbing of all was when I tried to do a condensed version of something I did 20 years earlier, and just couldn't get in the zone at all.</p>
