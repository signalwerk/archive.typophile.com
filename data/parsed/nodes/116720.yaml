    <p>I am curious to identify this font which I've found in a book on upholstery. </p>
    <p>The book is called 'Upholstery A Step-by-Step Guide' by Jeanne Argent (Hamlyn Publishing Group, 1974 - ISBN 0600381196). The font is used for chapter titles throughout the book - the attached image is an example of its use.</p>
