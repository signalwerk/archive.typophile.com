  html: |-
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/clip_5519.png"></div><p></p>
    <p>Clip is a display typeface inspired by the shape of a paperclip, but it’s not designed with the usual minimalistic modular approach. Instead, Clip mimics the construction, proportions and contrast of classic bold text typefaces and has one unique characteristic: each of its characters is drawn with only one single line.</p>
    <p>Clip family consists of 3 fonts, Hair, Light and Regular, each with 745 glyphs (supporting more than 70 latin based languages), 4 stylistic sets and advanced OpenType features. When Stylistic set 1 is activated, the overlapping loops contract, giving the text a whole new character. Moreover, every uppercase character is also available in an ornamental swash variant, which means most of the capitals have four different versions.</p>
    <p>Get some extra details <a class="freelinking external" href="http://www.urtd.net/clip" rel="nofollow">here</a>.</p>
