      <p>Hi! It might be you have to adjust your expectations :)</p>
      <ol>
      <li>Be aware that an apostrophe being typographically correct resembles the shape of a tiny “9”. Using an US keyboard on a Mac, you’d enter an apostrophe using alt-shift-]. The “other” apostrophe (next to the return key) is actually a different symbol (as used in measurements, such as 5' 11" for instance) .</li>
      <li>Of the examples you are showing, only the first one uses a “correct” apostrophe for the context. Some applications, such as MS Word (and maybe also Photoshop) try to intelligently replace ' by ’ while typing.</li>
      <li>Myriad does not have a very “9-resembling” apostrophe, but you can clearly see the direction, as opposed to examples 2 and 3.</li>
      </ol>
      <p>So I suppose you’re all set, and everything’s fine! :)</p>
      <p>Here are some more apostrophe-related things to read:<br>
      <a href="http://en.wikipedia.org/wiki/Apostrophe#Typographic_form" title="http://en.wikipedia.org/wiki/Apostrophe#Typographic_form">http://en.wikipedia.org/wiki/Apostrophe#Typographic_form</a><br>
      <a href="http://ilovetypography.com/2007/10/31/the-apostrophe-contrary-to-popular-belief-it-doesnt-swing-both-ways/" title="http://ilovetypography.com/2007/10/31/the-apostrophe-contrary-to-popular-belief-it-doesnt-swing-both-ways/">http://ilovetypography.com/2007/10/31/the-apostrophe-contrary-to-popular...</a><br>
      <a href="http://typefacts.com/artikel/grundlagen/anfuehrungszeichen" title="http://typefacts.com/artikel/grundlagen/anfuehrungszeichen">http://typefacts.com/artikel/grundlagen/anfuehrungszeichen</a><br>
      <a href="http://www.creativepro.com/article/typographic-tips-apostrophes-quotation-marks" title="http://www.creativepro.com/article/typographic-tips-apostrophes-quotation-marks">http://www.creativepro.com/article/typographic-tips-apostrophes-quotatio...</a></p>
