    <p>This is really, really odd. I was looking around for a particular typeface and found that what I need was Myriad. I have The Design Premium CS5 Set, and it came with the Content disk. So fire up the ol' Photoshop and start typing. I come across this problem: Everything looks fine...but the apostrophe looks different than what it's 'suppose' to be. And I can't even check if I could use another as substitute, 'cause most of the others come up as boxes.</p>
    <p>And to show you, here's some screengrabs. The first is my type in CS5, the second is from MyFonts.com, and the final is a screengrab from Adobe's own store. I'm at a complete loss.</p>
