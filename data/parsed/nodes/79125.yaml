      <p>Cool!<br>
      For getting the apostrophe right on the PC keyboard: hold down “alt” and type 0146 with the numpad.</p>
      <p>More reference here:<br>
      <a href="http://alt-codes.org/list/" title="http://alt-codes.org/list/">http://alt-codes.org/list/</a></p>
