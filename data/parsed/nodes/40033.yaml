    html: |-
      <p>I didn't even notice the "brothers" in the logo at first. It's much too understated in comparison to "marosi". I'd either remove it or make it more prominent.</p>
      <p>The use of "image" as a verb is very unusual. Did you do this on purpose?</p>
      <p>The typeface choice doesn't say simple, stable, and powerful to me. It says hair salon from the 1980s. Don't take my advice as gospel, but I'd change the typeface to something a little tamer like Avenir.</p>
      <p>The burgundy and grey colour scheme is nice (although those were my high school's colours, so I'm a bit biased). I'd keep it.</p>
      <p>You might want to think a little more abstractly in the case of an icon. Maybe instead of representing "two brothers", you should simply think about representing "two".</p>
      <p> - Lex</p>
