    <p>This is a logo i have created for an advertising company but the main objective of the company is web design &amp; graphic design. The company has only two members and they are the 2 brothers. They`r goal is to attract large and important clients so i thought that something simple, stable and powerful would do the trick. Do you agree? If not, any better ideas? :D</p>
    <p>P.S. i had real trouble coming up with an icon illustrating two brothers. Can anyone help with this, too?   Thanks a lot &lt;):)</p><div class="imageWrap"><img src="http://typophile.com/files/Marosi bros_3708. logo 6.jpg"></div><p></p>
  html_clean: |-
    <p>This is a logo i have created for an advertising company but the main objective of the company is web design &amp; graphic design. The company has only two members and they are the 2 brothers. They`r goal is to attract large and important clients so i thought that something simple, stable and powerful would do the trick. Do you agree? If not, any better ideas? :D</p>
    <p>P.S. i had real trouble coming up with an icon illustrating two brothers. Can anyone help with this, too?   Thanks a lot &lt;):)</p><div class="imageWrap"><img src="http://typophile.com/files/Marosi bros_3708. logo 6.jpg"></div><p></p>
