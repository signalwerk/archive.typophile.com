      <p>The Bauhaus font you're using looks retro, and the burgundy color reinforeces that effect. I recommend a contemporary rendition of Bauhaus with present-day chic---<a href="http://www.myfonts.com/fonts/sentinel/amity/" target="_new" rel="nofollow">Amity</a>.</p>
      <p>This logo will be effective without the tagline, but if the client really wants a tagline try to steer them away from "we image you". That's a bit lame and self-conscious. I've come up with an alternative, "image by design", but I bet somebody else is already using it.</p>
      <p>Also recommend using a more contemporary color. Some designerly suggestions:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/marosi_amity_1_5448.gif"></div><p></p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/marosi_amity_4_3879.gif"></div><p></p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/marosi_amity_2_4447.gif"></div><p></p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/marosi_amity_3_4098.gif"></div><p></p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/marosi_amity_3b_5086.gif"></div><p></p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/marosi_amity_5_4831.gif"></div><p></p>
      <p>The spacing used here is maybe a bit too tight.</p>
      <p>j a m e s</p>
