      <p>&gt;&gt; It's not working yet<br>
      &gt; Care to elaborate, James?</p>
      <p>I like the general direction you're going, but in your first layout I don't care for the outline letter (for a number of reasons including that it probably won't reproduce well when small) and the Z is too hidden.</p>
      <p>In your 2nd set of sketches, the solid 7 is an improvement, but in the left one the 7 looks stubby and the Z is still too hidden, and in the right-side one I don't see a Z at all. </p>
      <p>But I think your concept has possibilities. Perhaps the translucent idea I mentioned is worth a try; you also might try offsetting the letters slightly so the top of the 7 doesn't totally hide the top of the Z.</p>
