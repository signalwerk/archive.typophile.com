  html: |-
    <p>7-Zip program is a free, open source file compressor for Windows. Very capable and well-written proggy, saved me on more than on occasion, highly recommended, etc.</p>
    <p>Their <a class="freelinking external" href="http://www.7-zip.org/7ziplogo.png" rel="nofollow">existing logo</a> is bold and distinctive, but they don't appear to be paying much attention to the branding and pretty much "crowd-source" it. They have accumulated quite a bit of logos in <a class="freelinking external" href="http://www.7-zip.org/logos.html" rel="nofollow">their gallery</a>, though not many are actually notable.</p>
    <p>Now .. there is a <strong>7</strong> and there is a <strong>Z</strong> in the name. If that's not a match made in a logotype heaven, I don't know what it :) </p>
    <p>Here's one of the ideas. It looked very nice and balanced on the paper, but now that it's vectorized, it seems to be missing something and I just can't put a finger on it.</p>
    <p>Any thoughts, comments ? </p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/7zip-small_3917.png"></div><p></p>
