    html: |-
      <p>If you think the designer/developer duality is a distinguishing and marketable thing about you, apply it to the font too!</p>
      <p>Free fonts save money, but since they're so easy to acquire they're not good for standing out. Also they generally don't render too well on all kinds of displays.</p>
      <p>So try to find a recent commercial typeface that evokes your two aspects. Possibly something from this compilation:<br>
      <a href="http://typographica.org/features/our-favorite-typefaces-of-2013/" title="http://typographica.org/features/our-favorite-typefaces-of-2013/">http://typographica.org/features/our-favorite-typefaces-of-2013/</a><br>
      What about Program?<br>
      <a href="http://typographica.org/typeface-reviews/program/" title="http://typographica.org/typeface-reviews/program/">http://typographica.org/typeface-reviews/program/</a><br>
      What's interesting about Program here BTW is that it actually contains a duality itself! The Regular and Narrow styles have a different character.</p>
      <p>hhp</p>
