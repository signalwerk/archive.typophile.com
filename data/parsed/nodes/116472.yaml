    html: |-
      <p>&gt; I might just go back to my sketchbook.</p>
      <p>Designing a logo for yourself is difficult. I've known good designers who have been revising their own logos for years and still aren't satisfied. That's one reason many design firms end up just setting their name in type and leave it at that (Pentagram.com in an example).</p>
      <p>We can offer advice, but ultimately you need to pick one that reflects your own style and personality.</p>
