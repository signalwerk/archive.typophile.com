      <p>I think a pairing of letters actually offers great opportunities for expressing the dualism you mention. Think about how each side could be visually expressed (and which letter would be better at representing which aspect). Consider both uppercase and lowercase forms – and not necessarily the same for both*. Somehow fusing the two letters is generally nice, but not indispensable.</p>
      <p>* In fact a lc-UC sequence of itself sort of subtly conveys "developer".</p>
      <p>BTW what's that font you're using to set your name. And are you married to it?</p>
      <p>hhp</p>
