  html: |-
    <p>Hi folks,</p>
    <p>I submitted my poster to a Typoday competition, India. But seemingly not to be announced as finalist. Here i would like to share the type design (not the whole poster), to all of you. So i would like to get the commentary.</p>
    <p>I inspired by a very old poster to celebrate Wilhelmina Queen in Dutch Colonial era in Java. One best thing Dutch people do that time is they conserved our indigenous writing system. Fuse it with European style, ie Blackletter. So i do that again in the modern days. I hope you like it, and comment it.</p>
    <p>P.S:<br>
    The phrase "měmayu båwånå" is taken from famous Javanese proverb "měmayu hayuning båwånå" which means "to make the beauty of universe more beautiful"</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/javanesescript_3721.jpg"></div><p></p>
