    html: <p>I see its historic value, but when someone says we <cite>need</cite> (as opposed to want) to recover old writing systems no one uses anymore I question that. I must clarify though that I make a distinction between understanding a writing system and using it. I can see the relevance of understanding a writing system and mining the information within it, but I don't see how we <cite>need</cite> to revive such systems. Culture thrives on diversity, but there are also reasons why certain writing systems are abandoned. In that regard its relevance is predominantly dictated by its prevalence.</p>
