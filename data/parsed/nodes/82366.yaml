      <p>Thanks for your comments.</p>
      <p>Calibre and Metric I did not know - good to see them.</p>
      <p>And Sabon, funnily enough, was the other font I was considering. I agree it does work well with AG. I know that garalde fonts are often recommended as companions to AG, and that Sabon is considered a modern version of a garalde. But I was ideally looking for something that feels a bit more contemporary than Sabon - much as I like it.</p>
      <p>Any thoughts for a serif with a subtly contemporary flavour?</p>
