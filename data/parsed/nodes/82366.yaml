  votes: null
  html: <p>I am designing a range of items for a contemporary art gallery. Akzidenz Grotesk has been the main house font in the past, and I want to retain this and make it more consistent. I would like to use AG as the display face throughout, and as the text face in promotional print. However, I do not want to use AG for extended reading, and in the gallery's catalogues I would like to employ a serif as the text face, while retaining AG for display. Arnhem Blond is one font I am considering, and I like it's subtly contemporary feel. Would anyone have any comments, or other suggestions?</p>
  html_clean: <p>I am designing a range of items for a contemporary art gallery. Akzidenz Grotesk has been the main house font in the past, and I want to retain this and make it more consistent. I would like to use AG as the display face throughout, and as the text face in promotional print. However, I do not want to use AG for extended reading, and in the gallery's catalogues I would like to employ a serif as the text face, while retaining AG for display. Arnhem Blond is one font I am considering, and I like it's subtly contemporary feel. Would anyone have any comments, or other suggestions?</p>
