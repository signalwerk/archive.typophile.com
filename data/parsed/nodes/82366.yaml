    html: |-
      <p>AG is bland, old-fashioned and institutional. For 99% of your client's customers, it might just as well be Arial.</p>
      <p>For a complementary text face, good old Times Roman would be perfect.</p>
      <p>This is a golden age of new type. Step out of the past, roll up your sleeves, get rid of the AG and try to evolve this identity into something more truly contemporary, not just the usual art house cliché.</p>
