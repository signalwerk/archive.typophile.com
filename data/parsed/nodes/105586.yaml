    <p>Apologies in advance for the low quality photo, but I'm looking for a font similar to that in the attached photo. I specifically am searching for something with the notches cut out of the letters. Would be great if the original could be identified, but if not, something close will be just as helpful.</p>
    <p>Thanks in advance!</p>
