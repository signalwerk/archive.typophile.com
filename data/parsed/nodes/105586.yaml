    html: <p>Sorry, don't know any font that could fit your needs as it. I'm pretty convinced (almost positive when it comes of Nike) it is a custom job. You best chance is probably to create your own, starting with a <a class="freelinking external" href="http://new.myfonts.com/search/tag%3Acollege" rel="nofollow">College</a>/<a class="freelinking external" href="http://new.myfonts.com/search/tag%3Aathletic" rel="nofollow">Athletic</a>/<a class="freelinking external" href="http://new.myfonts.com/search/tag%3Avarsity/" rel="nofollow">Varsity</a>/<a class="freelinking external" href="http://new.myfonts.com/search/tag%3Aoctagonal/fonts/" rel="nofollow">Octagonal</a> Sans of your choice and customize it. Nike was also well-know for using <a class="freelinking external" href="http://www.houseind.com/fonts/unitedcollection" rel="nofollow">United HI</a> which I think could be a nice to start your customization on. <a class="freelinking external" href="http://typophile.com/node/105488#comment-562631" rel="nofollow">Some more</a> in the same vein of United HI.</p>
