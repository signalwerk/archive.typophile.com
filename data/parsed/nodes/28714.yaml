      <p>My favorite is the Pilot P-500. It's replaced the V5 for me because it writes as well (sometimes better) for me, and its ink doesn't bleed, unlike the V5. The only downside is that the tip is not as sturdy, so dropping the pen is not recommended.</p>
      <p>I haven't found the P-500 in stores recently (the P-700 is much more common, but I prefer the .5mm tip over the .7mm), but you can order them from office supply store websites.</p>
