    html: |-
      <p>I won a four-colour balpen in a drawing contest when I was ten (fifth place, but the contest was rigged, of course) and used that as a weapon to survive the bullying I was subject to for a while (being the smallest and youngest in my class then), until I used it to bribe the biggest bully to be my bodyguard.<br>
      That pen probably saved my life…</p>
      <p>OT: For I while I was really into a kind of Pentel that they stopped producing some time ago — lately I have used Muji’s no brand gel pens (black, red and repro blue) and Staedtler Pigment Liners (0.5 is my fave) — tehse dry out far too fast.</p>
      <p>For special occasions I use my Shaeffer Connaisseur fountain pen, but that not disposable (at least I try not to dispose of it).</p>
      <p> . . .<br>
      Bert Vanderveen BNO</p>
