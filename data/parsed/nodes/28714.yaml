    <p>(OK, perhaps a little off-topic on these forums, but still of interest to many, I hope...)</p>
    <p>Of course, as far as fountain pens go, I'm loyal to my old <a href="http://www.hochwertige-schreibgeraete.de/en/product.php?nav=3&amp;catid=150&amp;proid=157&amp;catprodid=157" target="_blank"><strong>Pelikan M300 F</strong></a>. It's a true workhorse, but, like most fountain pens, it isn't disposable, and its ink can be messy and slow to dry.</p>
    <p>As far as disposables go, I'm rather fond of the <a href="http://www.amazon.com/Uni-Ball-Signo-Black-Gel-12/dp/B0002LCVV8/" target="_blank"><strong>Uniball Signo Micro 207</strong></a>. Smooth as silk and resists smudging.</p>
    <p>That said, we all love letters, and we've discussed handwriting before, so...</p>
    <p>What disposable pen do you prefer? (And I mean for its quality, not for its convenience or low cost.)</p>
    <p>I've yet to find a disposable with a flat nib like a fountain pen (for those great thick-thin stroke variations we all crave). Any recommendations?</p>
