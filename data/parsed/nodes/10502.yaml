    votes: null
    html: "<p>The dividing line between Windows TrueType fonts and OpenType is remarkably thin. <br> <br>Personally, I use about 80-90% OpenType fonts, and the remainder almost all TrueType. I keep a few Type 1 fonts around for specific compatibility needs. <br> <br>But then again, that's predictable: I work for Adobe (inventors of Type 1, and co-developers of OpenType), and we stopped making new Type 1 fonts in 1999, to switch to OpenType. <br> <br>We will likely stop selling Type 1 fonts this year, but that's another story, which I will cover in more depth at various type conferences later this year. <br> <br>Regards, <br> <br>T</p>"
    html_clean: "<p>The dividing line between Windows TrueType fonts and OpenType is remarkably thin. <br> <br>Personally, I use about 80-90% OpenType fonts, and the remainder almost all TrueType. I keep a few Type 1 fonts around for specific compatibility needs. <br> <br>But then again, that's predictable: I work for Adobe (inventors of Type 1, and co-developers of OpenType), and we stopped making new Type 1 fonts in 1999, to switch to OpenType. <br> <br>We will likely stop selling Type 1 fonts this year, but that's another story, which I will cover in more depth at various type conferences later this year. <br> <br>Regards, <br> <br>T</p>"
