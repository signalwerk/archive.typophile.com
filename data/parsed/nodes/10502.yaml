    html: <p>Yves, <br>Being a recent graduate faced with purchasing several fonts this year, this issue is one that I have been wondering about. I'm on a Mac, use Quark, and have read about the problems with Open Type, so have opted to purchase either True Type or PS fonts -- never really knowing why I'm choosing one over the other -- but I think I've read PS fonts will go the way of the dinosaurs, so True Type is the better choice - correct? <br> <br>However, I hate the idea of investing so much money in either format if Open Type is going to take over. Does that mean I'll eventually have to repurchase the fonts I've spent so much on this year?  Just yesterday I purchase Sparrowhawk on Veer for $39 (!) and it only offered one format (it didn't say which one it is) - BUT it doesn't work in the Microsoft Office  Entourage program (trying to create a logo for an email signature), so I'm either feeling a bit cheated -- OR I just need to tweak something somewhere to get it to work (probably the later but the constant detective work of what needs tweaking is soooo time consuming!)  <br> <br>How should I think about font formats in order to make the best long term investment? Thanks!</p>
