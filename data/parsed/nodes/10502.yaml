    votes: null
    html: "<p>Before OpenType fonts became available, for print work I preferred working with Type 1 PostScript fonts rather than TrueType... They were more reliable than most of the TT fonts I was familiar with. <br> <br>Briefly, the differences are that PostScript fonts have two components: a suitcase containing the screen fonts and separate files for the printer fonts, while TT fonts combine these into one scalable font file... Also, PostScript fonts use the same page-description technology as laser printers. <br> <br>As for OpenType, it is a cross-platform format, meaning you can use the same font file on a Macintosh or Windows machine. OpenType fonts have room for many more characters than the older font formats.</p>"
    html_clean: "<p>Before OpenType fonts became available, for print work I preferred working with Type 1 PostScript fonts rather than TrueType... They were more reliable than most of the TT fonts I was familiar with. <br> <br>Briefly, the differences are that PostScript fonts have two components: a suitcase containing the screen fonts and separate files for the printer fonts, while TT fonts combine these into one scalable font file... Also, PostScript fonts use the same page-description technology as laser printers. <br> <br>As for OpenType, it is a cross-platform format, meaning you can use the same font file on a Macintosh or Windows machine. OpenType fonts have room for many more characters than the older font formats.</p>"
