    html: <p>Service bureau would be the people who take your files and output film - may be the print shop in your case. If as part of your production process you need to give them fonts (license permitting) as well as Photoshop and Illustrator files then you should ask them what they prefer.  <br> <br>With respect to Donna's question - the OpenType fonts will likely contain goodies and extras accessible in Adobe apps and eventually Quark. If you don't need or want the extras there's no need to upgrade. <br> <br>Cheers, Si</p>
