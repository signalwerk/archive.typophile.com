    html: <p>Apparently, Quark 7 will come out later this year, and support the full range of OpenType features. So you can continue to work in the page layout program you're comfortable with, and not miss out on special OpenType features.  <br> <br>The legacy font formats of PostScript Type 1 and TrueType will continue to work for many, many years to come. <br> <br>So you can feel comfortable buying any format you like. <br> <br>Of course, like any software, fonts can have bugs; and in that, no format or foundry is immune.</p>
    html_clean: <p>Apparently, Quark 7 will come out later this year, and support the full range of OpenType features. So you can continue to work in the page layout program you're comfortable with, and not miss out on special OpenType features.  <br> <br>The legacy font formats of PostScript Type 1 and TrueType will continue to work for many, many years to come. <br> <br>So you can feel comfortable buying any format you like. <br> <br>Of course, like any software, fonts can have bugs; and in that, no format or foundry is immune.</p>
