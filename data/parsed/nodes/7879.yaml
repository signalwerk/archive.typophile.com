  votes: null
  html: "<p>Is there a cure?  <br>Signs of typophilia (based on personal experience): <br>When you read a book and can't enjoy it until you know what face(s) it is set in. When you can spend and hour weighing the merits of various interpretations of Caslon. When you wish you could use each of your thousands of fonts because, well, they are pretty. When you won't eat at a resturaunt because the menu is printed in Times and doesn't compliment the food. When you spend more time deciding what font to use for a paper than you spend deciding what to wear. When your occupation has nothing to do with typography but all the above is true, you have typophilia. <br>What do you do to cope with this problem? If you'd rather look at glyphs than go to a movie, something is wrong... if this illness can't be cured can it at least be managed?</p>"
