    html: <p>Christos, you have made an excellent mark. Of those that you show here I like A2. No border on the oval and the double rule below the type looks both fresh and modern to my eye but also provides a nice foundation for the type. <br> <br>In general the oval is very active and is eyecatching. I wonder if the buildings could be simplified, removing the window details and providing a calmer centre like the pupil in the iris of an eye. <br> <br>No matter what, your revision of this mark is a huge step forward for the chateau. <br> <br>Jon</p>
