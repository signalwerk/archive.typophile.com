  html: <p>Hello everybody <br> <br>i have just started to redesign a logo  <br>for a "chateau". The company is very famous  <br>in Greece for their hotel in an amazing landscape <br>in Chalkidiki (northern Greece). Wine production  <br>is a secondary activity of the company  <br>and the "chateau" is placed in the same  <br>landscape to the hotel. There is no need  <br>to be a connection between the two -i just  <br>mention the whole thing for the story. <br> <br>I tried to make the design as clearer i can,  <br>though i kept all the basic shapes in the buildings  <br>since i don't know how much i can omit. <br> <br>For the moment i prefer A though i am not sure  <br>about the sizes (that's why A1 and A2). <br> <br>I am looking forward for comments about  <br>the typography and the clarity of the design.  <br>I was trying to find a good combination to make  <br>a ligature but i couldn't see such a case.  <br>If anybody have a suggestion on it i will be  <br>very pleased to know. <br> <br>Thanks in advance and have you all a nice day. <br> <br>christos <br> <br><img src="http://www.typophile.com/forums/messages/29/39630.gif" alt="sign"> <br> <br><img src="http://www.typophile.com/forums/messages/29/39631.gif" alt="proposals"></p>
