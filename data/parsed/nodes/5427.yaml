    html: <p>Wow, these look great! <br> <br>It occurs to me that by removing the "sky" the image has opened up, which really lets the  <br>type into the image. It think that a version with a rounded bottom might embrace more the type  <br>on top, but I like these versions too. <br> <br>It's funny, I wasn't partial to the swash caps in the previous versions, but I like them in this  <br>latest post. I think that the angles of the swashes are working well with the lines in bottom right of  <br>the image. But I find the middle version the most elegant typographicaly. <br> <br>This is really a beautiful project. I'd stay at the chateau if I were in town... <br> <br>Robert</p>
