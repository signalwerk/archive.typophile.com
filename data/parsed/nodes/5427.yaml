    html: <p>I like very much the way that you have used the thinning lines to convey the landscape, but I wonder if the oval shape retained from the original isn't keeping the whole design somewhat rigid. Is that oval shape a requirement from the client? <br> <br>Otherwise, I don't like the versions with the borders around the image as I find that they make the design heavy. If pressed, however, I would prefer the borders in B, C, D and F because they mirror the lines in the image.  <br> <br>Generally I prefer the versions without the thin-thick line at the bottom as they are more open and welcoming, although the F and H are fun. My favourite example is G. <br> <br>I hope that these comments are helpful; I look forward to seeing the final decisions for this project.</p>
