    html: |-
      <p>More than language, to me it's a matter of visual "nativity".<br>
      Some designers don't agree, but I believe that although without<br>
      nativity you can produce acceptable imitative typefaces, you<br>
      cannot really innovate. Which is not to say that nativity cannot<br>
      be acquired later in life; few however can manage that luxury.</p>
      <p>BTW when I made Akhalkalak I consulted with an expert native in<br>
      Georgian at UCLA (where I used work) to make sure none of the<br>
      letters were too far out. And the expert did actually find fault with<br>
      one letter, which I duly tamed (but I could not innovate).</p>
      <p>hhp</p>
