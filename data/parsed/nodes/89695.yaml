    html: |-
      <p>I'm also self-taught. I studied graphic design at the art academy for one year and my basic typographic knowledge was acquired there. I then went on to study multi media design. I started being active in type design during my first internship in 2009. I have my diploma now and I plan to go back to school upcoming year to get a bachelor in graphic design and then a master in typography &amp; communication. I have been pondering though whether I'm really doing this for the experience or that I will genuinely learn more than I would on my own. I'm sure I will be learning through the experience though. I've never really had the pleasure to surround myself with type geeks but I really want to enter that environment.</p>
      <p>In any case, when it comes to type design I'm self-taught. I very much romanticize the idea of being mentored by a type designer and I find the idea of techniques, styles and concepts being passed on from the master to the pupil very charming. I guess it's also about the pleasure of working on a single design together as opposed to having to find out a solution for every problem yourself. I mean, as a solo designer it can be both exhilarating and frustrating/tiring.</p>
