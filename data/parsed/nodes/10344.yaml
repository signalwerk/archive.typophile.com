  html: <p>Hey all <br> <br>I was wondering what you guys and gals use for general metrics/kerning checking. <br> <br>Several years ago, I used to have several text files that I used as "contact" sheets that I'd open and change the font to check out the spacing, metrics, kerning, etc. <br> <br>What do you guys (and gals) use for this -- or what "tricks" do you utilize for checking your metrics? <br> <br>TIA, <br>Maury</p>
