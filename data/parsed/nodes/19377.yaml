    <p>Hi :)<br>
    i’ve stumbled upon this site that contains several <a href="/wiki/blackletter" class="wiki">blackletter</a> faces by <a href="/wiki/manfred%252Bklein" class="wiki-create">manfred klein</a> and apparently more designers.<br>
    usually I’m very cautious of downloading free fonts because they are not always designed well. I’m not so familiar with klein’s work or reputation, and i just wanted to ask out of curiosity, what do you think about the faces in this site:<br>
    <a href="http://moorstation.org/typoasis/blackletter/index.htm" title="http://moorstation.org/typoasis/blackletter/index.htm">http://moorstation.org/typoasis/blackletter/index.htm</a><br>
    are they well designed, what do you think about the designer etc.<br>
    thanks<br>
    Yaron.</p>
