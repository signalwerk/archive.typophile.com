      <p>Manfred has some of the most wonderful free fonts on the internet. He also has, by far, the most free fonts on the internet. Wading through it and finding what works for you could take a very long, long, time. And his commercial use terms are very reasonable:</p>
      <p>They are even free for commercial use – but if there’s any profit, please make a donation to organizations like“Doctors Without Borders”. </p>
      <p><a href="http://moorstation.org/typoasis/designers/klein/index.htm" title="http://moorstation.org/typoasis/designers/klein/index.htm">http://moorstation.org/typoasis/designers/klein/index.htm</a></p>
      <p>Admittedly he has just quickly finished some fonts off that were sitting around half-finished for years, kind of dusting out the cobwebs of his lifework. But some got his full attention, and when you come upon those, it is a joy.</p>
