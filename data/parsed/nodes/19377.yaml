    html: |-
      <p><em> is there a blackletter face suitable and readable for long texts?</em></p>
      <p>No, there is not, at least not in digital format. There are lots in metal, if you want to hand-set the long texts yourself ;-)</p>
      <p>On a more serious note, the reason that there really aren’t any suitable digital faces is because the historical designs that were digitized were mostly based off of their display cuts, and not their text cuts, because at the time of the digitization, the days of blackletter text were over. Sort of an unending eycle, I guess. I’ve spent some time off and on over the last two years trying to make a readable textura—one optimized for text! But at the moment that is still sort of a pipe dream, because I am not a good type designer.</p>
