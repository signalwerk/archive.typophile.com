    html: |-
      <p>Well you've awakened an old thread, but it doesn't look like the original problem was ever fully sussed out. The "name" in question is the glyph name, which must conform to some rules established by Adobe quite a long time ago. Some font tools are more lenient than others with respect to glyph names, and sometimes a tool can assign an illegal name. This can cause trouble when another tool expects or requires strictly legal names and that is what's going on here.</p>
      <p>From <a href="http://www.adobe.com/devnet/opentype/archives/glyphnamelimits.html" title="http://www.adobe.com/devnet/opentype/archives/glyphnamelimits.html">http://www.adobe.com/devnet/opentype/archives/glyphnamelimits.html</a> section 4 (emphasis mine):</p>
      <p><code>A glyph name may be up to 31 characters in length, must be entirely comprised of characters from the following set:</code></p>
      <p>A-Z<br>
      a-z<br>
      0-9<br>
      . (period)<br>
      _ (underscore)<br>
      and <strong>must not start with a digit or period</strong>. The only exception is the special character ".notdef".</p>
      <p>"twocents", "a1", and "_" are valid glyph names. "2cents" and ".twocents" are not.</p>
      <p>Both of the glyph names here violate the emphasized part above; ".null" begins with a period and "01e9" begins with a digit.</p>
      <p>To fix the "invalid first character in name" issue, you need to change the glyph name(s), not delete the glyph. There may be other glyphs with illegal names, too. You might try FontLab Studio's function to assign glyph names based on Unicode if you have a lot to rename.</p>
    html_clean: |-
