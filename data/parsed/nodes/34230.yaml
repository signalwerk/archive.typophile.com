    date: 2007-06-05T05:15:00
    date_raw: 5 Jun 2007 — 5:15am
    votes: null
    html: |-
      <p>If you generate OTF fonts (with PostScript outlines):<br>
      Only '.notdef' must be present, but not '.null' and 'CR'.</p>
      <p>If you generate TTF fonts (or OTF with TT outlines):<br>
      '.notdef', '.null' (unicode '0000'), 'CR' ('000D') and 'space' ('0020') should be the first four glyphs in your font, in this order. To reorder them, set the Font Window to Index Mode, then pull the glyphs the the correct place.</p>
      <p>What I meant was, make sure '.null' is not mentioned in any feature.</p>
    html_clean: |-
