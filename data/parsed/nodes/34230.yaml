    <p>After generating the font, this error message appears:</p>
    <p>invalid first character in name (text was ".null")[1_tiger_0306:Applications:FontLab 4.6:fontlab.fea 208]</p>
    <p>does anybody know anything about this error? what does it mean? which "name" and which "text" is meant?</p>
    <p>thank you!</p>
