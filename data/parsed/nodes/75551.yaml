      <p>Kevin, useful analysis - thank you.</p>
      <p>&gt; If I’m interested in the muscles used for walking and running, and<br>
      &gt; ask you to walk or run while I measure your muscles, could you use<br>
      &gt; different muscles because you know you are being watched?</p>
      <p>Not necessarily different muscles, but I do believe the muscles would be used a bit differently. And the more subconscious the act is, the more the deviation. If a doctor asks you to "breathe normally", it's anything but. That's why whenever they can doctors engage you in idle banter while they're checking your vitals.</p>
      <p>&gt; the brain doesn’t have multiple different mechanisms<br>
      &gt; for reading that you can choose between.</p>
      <p>I guess it depends on how you define mechanism. I believe that any given act of reading is a hybrid between two very different <em>strategies</em> if not mechanisms; and one of the strategies (the slower, deliberative one) is heavily favored when the reader knows he's being measured. This difference is simply much harder to observe than muscle movements - but I believe it exists. Why? Not least because that makes sense; and the brain <em>not</em> taking advantage of information that's right in front of its eyes (well, to the side :-) makes no sense.</p>
      <p>hhp</p>
