      <p>One might deduce from this experiment that setting text in Arial makes it *harder* to read, if reading is defined as the entire process of extracting, processing, and storing meaning from visual text.</p>
      <p>The way that this research defines reading is rather like the hand compositor in the movie <em>Park Row</em> (1952), who couldn't read, but was the fastest and most accurate at setting type. BTW, that movie has Ottmar Mergenthaler as one of the protagonists!</p>
