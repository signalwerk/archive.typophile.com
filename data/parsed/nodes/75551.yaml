      <p>&gt;The problem is not even Kevin has managed to break through to the Eldorado of readability testing: people not knowing they're being tested. Without that it's 99% water.</p>
      <p>I don’t think people being aware of being tested changes the process of reading in any interesting way. If I’m interested in the muscles used for walking and running, and ask you to walk or run while I measure your muscles, could you use different muscles because you know you are being watched? </p>
      <p>Similarly, if I’m interested in the brain activity that you use to control your body as you walk and run, I would expect to see a lot of activity in the part of the motor cortex that controls your legs. Even though you are aware of the test, there isn’t any other part of your brain that could suddenly take over controlling your legs just because you are being watched. </p>
      <p>I would argue that the same is true for reading. You can know that you are being watched, but the brain doesn’t have multiple different mechanisms for reading that you can choose between.</p>
