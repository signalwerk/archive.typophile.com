      <p>I have also read the Diemand-Yauman, Oppenheimer and Vaughan paper. (Just email them and they’ll send you a copy, armchair pundits!)</p>
      <p>I had the same reaction as Kevin did to the disfluency assumptions. It's particularly problematic in relation to Comic Sans. At least in the UK, Comic Sans has been used extremely widely in education for at least 10 years. Teachers I've nagged about the phenomenon (which, I have on good authority, is prescribed in teaching schools) attest to its ability to distinguish between, on the one hand, ‘personal’ material, prepared by that teacher for that class (just as handwritten &amp; photocopied sheets were used in my day), and, on the other hand, material simply photocopied from books, generated from ‘official’ teaching materials, or cut &amp; pasted from the web.</p>
      <p>I therefore find it easy to hypothesize, undermining the assumptions of the article’s authors, that:</p>
      <p>* today's students find Comic Sans very legible and ‘fluent’<br>
      * students engage better (since it pays off better) with material in which the teacher demonstrates a personal interest</p>
      <p>I followed up with a request for samples of the actual test materials, but this was ignored.</p>
