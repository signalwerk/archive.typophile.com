      <p></p><div class="imageWrap"><img src="http://typophile.com/files/stps_5263.png"></div><p></p>
      <p>Perhaps the subjects are more bored with "Helvetica" than CS or Bodoni.<br>
      Or don't like being bullied by large type.<br>
      Or simply don't find text set in black, or in plain Arial, quite so memorable (that would be Occam's explanation).</p>
      <p>So what is being measured here?<br>
      Nothing to do with difficulty or disfluency theory.<br>
      But when your measuring stick has only one calibration...</p>
      <p>BTW, that isn't Arial in the sample on the BBC page, it's Myriad/Frutiger.</p>
