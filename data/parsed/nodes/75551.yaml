    html: |-
      <p>It is well known that Jewish children and children from CJK-influenced Asian backgrounds do well in school. I have felt that this is clearly a cultural matter - the <em>bar mitzvah</em> and the Imperial civil service examination have made book learning an expression of these groups' <em>own</em> culture, so, unlike the case of members of some other minorities that suffer discrimination, they aren't tempted to see book learning in terms of knuckling under to the dominant culture.</p>
      <p>Since Hebrew - and even more so, Chinese - are "difficult" to read, I wonder if this was a misguided inspiration for this research.</p>
      <p>But maybe we can "slow the mind down" by giving the children fun puzzles to solve, inside of which their lessons are hidden... to avoid the hating school problem. Or, better yet, video games!</p>
