      <p>I have read the Yauman, Oppenheimer, and Vaughn paper. The newspaper reports got the finding slightly wrong. It’s not actually possible to say that the font caused disfluency because they confounded font, size, and luminance contrast. In the first study they compared 16 point, 100% luminance contrast, Arial to 75% luminance contrast, 12 point, Comic Sans Italic and Bodoni. It’s not possible to say that the font was the source of the difference as it equally could have been the size or luminance contrast. That is only a problem with the newspaper account, and not with the Yauman et.al. paper itself.</p>
      <p>I do think Yauman et.al. made a methodological mistake. They showed that there were higher memory recall rates for the 12 point, 75% contrast fonts, but didn’t do anything to show that those fonts were actually more disfluent. Had they performed some other sort of performance test, or even asked the participants to rate the fluency, there point would be more convincing. I would accept that reduced contrast lowers fluency, but am less confident about the size or font differences.</p>
      <p>The big question here is that this is the exact opposite finding from the Song &amp; Schwarz (2008) paper that we’ve discussed elsewhere. In that study people rated 12 point Arial as being more legible than 12 point Mistral and Brush Script, and it was shown that people judged that the tasks described in the text would be easier to complete when written in Arial. That study suggested that fluency is beneficial, but of course is a different task from a memory task. Song &amp; Schwarz also had a memory task in their study, but didn’t find a difference on that measure.</p>
      <p>I think the effect of fluency/disfluency is an interesting mystery.</p>
