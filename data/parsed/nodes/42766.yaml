    html: |-
      <p>Re. Thomas's post, how should I define the font-family in the css file in order to get the condensed Vera, DejaVu or Nimbus fonts to display? E.g. does one write:</p>
      <p>{font-family: “Vera Condensed”, "DejaVu Condensed", "Nimbus Condensed"}?</p>
      <p>Re. dii's post, it depends what you mean by "work properly" - I have defined the font family of my heading and header styles to display Arial or Helvetica if Arial Narrow and Helvetica Narrow are both not present, so it will work properly to an extent on any machine with any of those four fonts installed. But having said that, if you can think of a narrow sans serif headline font that comes as standard on Windows machines which *don't* have Arial Narrow installed, and if you can think of a narrow sans serif headline font that comes as standard on Mac OS machines which don't have Helvetica Narrow installed, then I would be very grateful for this information.</p>
      <p>Dave</p>
