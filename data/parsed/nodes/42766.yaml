  html: |-
    <p>Hi</p>
    <p>I define my html headings and headers using:<br>
    font-family: "Arial Narrow", "Helvetica Narrow", Arial, Helvetica,<br>
    sans-serif</p>
    <p>However, according to the screen captures I've done at<br>
    browsershots.org Linux machines display this using very wide metrics<br>
    indeed, to the extent that the number of characters per line on a<br>
    Linux machine is roughly half the number of characters per line<br>
    displayed on Windows and Mac machines when viewing the same web page.</p>
    <p>Is there a reasonably narrow headline (sans serif) font that comes as<br>
    standard with Linux which I could use as a substitute for Arial Narrow/<br>
    Helvetica Narrow?</p>
    <p>Dave</p>
    <p>PS - I've noticed that Wikipedia uses a reasonably narrow font for<br>
    their main article headings, but (a) I can't work out what font-family<br>
    they are using (their css files are a labyrinth and I can't make sense<br>
    of them); and (b) I can't test how their headings look under Linux (I<br>
    use Windows), because Wikipedia has blocked browsershots.org using a<br>
    robots.txt file.</p>
    <p>Dave</p>
