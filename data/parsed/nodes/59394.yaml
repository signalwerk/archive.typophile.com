    html: |-
      <p>Similar to the UnicodeRange fields, the <a class="freelinking external" href="http://www.microsoft.com/typography/otspec/os2.htm#cpr">OpenType spec</a> is pretty vague on this:<br>
      <cite>If the bit is set (1) then the code page is considered functional. If the bit is clear (0) then the code page is not considered functional. Each of the bits is treated as an independent flag and the bits can be set in any combination. The determination of “functional” is left up to the font designer, although character set selection should attempt to be functional by code pages if at all possible. </cite></p>
      <p>Our practice has been to only set a given bit if *all* characters from the code page are present, except in the case when no code pages have all characters: then the Latin-1 bit is set. I am not sure whether it is still the case but I think this practice goes back to a recommendation by Microsoft for correct functionality under Windows...must have at least one CP bit set.</p>
