    html: <p>Ok, so if I’m not completely supporting a codepage—I leave out some of the math characters in the “standards” do I not set the supported codepages, or do I set them for the codepages that I provide language support for and let applications throw in .notdef on the off chance someone tries to typeset equations with my fonts?</p>
