    html: <p>There is a bug or "feature" in some of the older versions of InDesign for Windows. If you don't set Central European Latin 2 codepage for fonts containing CE characters, you won't be available to type CE characters using your keyboard, although you will be able to apply the font on a text containing CE glyphs. I didn't test this issue with CS4 yet.</p>
