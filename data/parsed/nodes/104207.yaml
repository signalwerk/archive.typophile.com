    <p>Monokrom is a small Norwegian type foundry run by <a href="/wiki/Frode%20Bo%20Helland" class="freelinking" rel="nofollow">Frode Bo Helland</a>, <a href="/wiki/Sindre%20Bremnes" class="freelinking" rel="nofollow">Sindre Bremnes</a> and <a href="/wiki/Hans%20Ivar%20Stordal" class="freelinking" rel="nofollow">Hans Ivar Stordal</a>. </p>
