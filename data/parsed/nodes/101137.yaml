  html: |-
    <p>I have begun designing a new typeface of mine. It is my first font ever made and my first experience with FontCreator, so keep that in mind when critiquing. </p>
    <p>I have a ton of concept work for many of the other glyphs, so I could scan them in and post them if anyone wants. I'd appreciate it if the time was taken to evaluate some of the other glyphs that didnt make it or are being saved for alternates and flourishes and whatnot. I plan on making this a full font. Including diacritics, dipthongs, currency symbols, etc etc. No cutting corners. </p>
    <p><a href="/node/add/wiki?edit%5Btitle%5D=www.behance.net/gallery/Leteske/7016789" title="Create node &quot;www.behance.net/gallery/Leteske/7016789&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Here is the link to the project on behance.</a></p>
