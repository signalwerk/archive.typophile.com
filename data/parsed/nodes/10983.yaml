    date_raw: 17 Apr 2003 — 1:03pm
    votes: null
    html: <p>I don't know the official rules either. However I can officially say that as the words that are shortened are capitalized, I would say they should be caps and not smallcaps. And visually you'll tip the name over, I think, if you don't use caps. </p>
