    html: <p>I'm just shooting off of the top of my head here, so  <br>hopefully someone can confirm with a style guide, but... <br>I don't believe small caps are used at all in these  <br>situations, simply because of the uncertainty. often  <br>times, small caps are avoided in two letter combos -- I  <br>don't really like the way it looks, but that's what I've  <br>understood the <i>official</i> rules to be.</p>
