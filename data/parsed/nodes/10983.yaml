    html: <p>Although I am unaware of any particular style guide rules about such formatting, this sample illustrates a format that seems satisfactory (in terms of legibility and clear communication). My degree (from San Jose State) is rather unusual, so my goal is to provide a bit of explanation in my format choice. The person's name is size "x", the degree (in U&amp;lc) is approx. 80% of x, the explanation (in this case GRAPHIC DESIGN) is at approx.size 60% of x. <br><img src="http://www.typophile.com/forums/messages/30/8871.gif" alt="sample designation format"></p>
