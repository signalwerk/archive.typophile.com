  html: <p>I'm working on an alumni directory. Haven't really had to address the formatting of degree notations before, but now it's an issue. <br> <br>Anyone have any advice for treating small caps in this situation? Things like BS Ed, BS Ag, M Ed. Right now, we're treating the first section (BS) as two small caps, and the 2nd section (Ed) as initial cap small cap.  <br> <br>Suggestions?</p>
