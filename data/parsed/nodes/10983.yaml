    html: <p>Thanks for the input all,  <br> <br>Some people seem to have this huge alphabet soup after their name from multiple degrees, and that was the impetus.  <br> <br>I try to use true small caps whenever appropriate, but in this case, I guess it may not fly. If they look distracting, it sort of misses the point.</p>
