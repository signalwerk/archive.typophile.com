    html: <p>Dana said... <br><i>The person's name is size "x", the degree (in U&amp;lc)  <br>is approx. 80% of x, the explanation (in this case  <br>GRAPHIC DESIGN) is at approx.size 60% of x.</i> <br> <br>no offense, Dana, but that doesn't make much sense.  <br>that's kind of like letting the application do small caps,  <br>but then you change the rules and end up with two  <br>different types of faux small caps. I would suggest  <br>either using real small caps or sticking with standard  <br>U&amp;lc. <br></p>
