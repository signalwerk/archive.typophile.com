    html: <p>Thanks, Göran, but I haven't used the ID fonts folder. It currently has only one font in it, KozMinStd-Regular.otf. And I have no font managers. I have just installed the fonts by double-clicking them and then using FontBook (also to deactivate older versions – but it doesn't help if I completely remove these). All other edits that I have made to the font so far have worked in ID.</p>
