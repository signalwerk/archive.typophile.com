    html: |-
      <p>Thank you so much! I did do a search for articles before posting but missed this one. It is just amazing to have such a resource here at typophile. I went to all the links, and was fascinated to learn more of the history of the face and the obsessive connection people have to it on the Speak Up Archive. The conversation about what makes a font used or "tired" is pretty eternal. I have always loved Copperplate and considered it one of the eternal greats. But I'm hugely outnumbered.</p>
      <p>As I looked more closely the font the designer is considering is bafflingly like CP but without serifs. I had thought there was a sans serif version out there but can't find it, so I have no idea now what it actually is. Which opens up the box of vernacular in another way: what does it do to the idea of family or logical historical relationship/context when something is old but stripped of some essential identifying feature? Years ago a young designer came to me to show her book, and I couldn't fathom the font choices. When I asked why she had mixed the particular stew together she told me it was "on trend." The conversation sort of stopped there.</p>
      <p>I'd like to learn a lot more about the design philosophy that guides other Typophile members in their choices of what to companion with what. I'll do some browsing, but if someone can send me to specific previous threads that would be great.</p>
