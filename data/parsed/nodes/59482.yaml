  html: |-
    <p>I have a challenging book cover project for which I did a contemporary calligraphic brush title. I am co-designing or consulting on the overall layout of the cover and font choices. The title is now final. Early layouts tested Lithos and Optima for the subhead directly below the title, and now people are leaning towards a version of Copperplate Gothic (no serifs). </p>
    <p>It's not bad, but what to put WITH it is challenging. What is the vernacular with this font? Serif fonts like Bodoni or Times have been tried but seem to have no relationship at all and are jarring. I'd love thoughts on this.</p>
