    html: <p>Good idea! Unfortunately right now it is in development, and I probably shouldn't. But it is a brush calligraphic script. Soft subtle italic, not too fancy. Sets off well with sans serif snuggling up, but then they wanted a serif contrast below the sans serif Copperplate mystery font, and it seems to me maybe a serif font that is soft and influenced by brushwork would be good. That would relate back to the title style. I could use some suggestions for fonts that have some calligraphic relationship to contemporary scripts styles. My font base is old--Trajan and Hiroshige are not going to cut it for this century!</p>
