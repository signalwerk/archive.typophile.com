      <p>&gt;I had thought there was a sans serif version out there but can’t find it, so I have no idea now what it actually is.</p>
      <p><a class="freelinking external" href="http://new.myfonts.com/fonts/bitstream/engravers-gothic/" rel="nofollow">Engravers Gothic</a> is like Copperplate Gothic, but without the tiny serifs. Also <a class="freelinking external" href="http://new.myfonts.com/fonts/agfa/sackers-gothic/" rel="nofollow">Sackers Gothic.</a></p>
      <p>I agree with you that Copperplate Gothic can look great--or tired--it just depends on how it's used...</p>
      <p>Kris Sowersby's <a class="freelinking external" href="http://vllg.com/KLIM/Feijoa/mudTyper+Weights/" rel="nofollow">Feijoa</a> has nice soft serifs, but I really don't know if it will work with what you have. Also there are outright calligraphic romans like <a class="freelinking external" href="http://new.myfonts.com/fonts/adobe/brioso/" rel="nofollow">Brioso</a> and <a class="freelinking external" href="http://new.myfonts.com/fonts/linotype/alcuin-lt/" rel="nofollow">Alcuin</a>.</p>
