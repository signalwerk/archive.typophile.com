      <p><cite> &gt; Engravers Gothic is like Copperplate Gothic, but without the tiny serifs. Also Sackers Gothic.</cite></p>
      <p>As is Blair. Originally advertised by Inland Type Foundry in 1900, predating Goudy's Copperplate Gothic by three years. Later part of the ATF library when Inland joined ATF. </p>
      <p>Jim Spiece did a digital version for ITC back in the 1990s.</p>
