      <p>A excerpt from our concept presentation:</p>
      <p><em>... This concept is an intriguing play on the acronym WCC. This is the boldest statement of the four (concepts), immediately evoking the Bauhaus aesthetic quite often associated with large corporations. Primary messaging is sophisticated and strong, establishing sound business practice above all else. The rounded corners on the bounding box help soften the impact slightly, and provide an ergonomic, humanistic quality that eases user interaction. The emphasis on the ‘W’ evokes/reinforces ‘winning.’ ...</em></p>
      <p>WCC is a sports forecasting/handicapping company. The two founding officers are sports experts. They appear regularly on ESPN, as commentators and sports (mailing western coast college conference) forecasters.</p>
      <p>One of the major brand touch points will actually be athletic wear, and mid range apparel -- think nice trendy polos, not t-shirts. There is going to be a big guerilla marketing push with the apparel. We are taking some rather un-conventional approaches to marketing within a market that is quite staunch and sterile. The majority of the competitors are quite 'old fashioned' and extremely unimaginative.</p>
      <p>A major criterion for success was the ability to become a quazi-fashion label. Something people would enjoy wearing. A mark that would be able to facilitate a trend, yet remain timeless.</p>
      <p>The applications will be fairly broad. One of the most interesting touch points is the apparel. One of the more difficult touch points is the radio.</p>
