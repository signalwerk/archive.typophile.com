  - id: 86209
    user: 3135
    date: 2005-09-04T15:28:00
    date_raw: 4 Sep 2005 — 3:28pm
    votes: null
    html: |-
      <p>"...gain the positive effects immediately?"</p>
      <p>You can not gain a delayed reaction effect immediately by definition. This is what I meant by the dimension of time. The point of it is that you have one reaction at your first viewing and yet another reaction at some later viewing. This one, two punch acts synergistically to aid retention.  It also can prompt discussion between viewers who otherwise would just have gone by after the first viewing. There is a lot of work involved in getting it right.  It has nothing to do with art--it is by design.</p>
      <p>ChrisL</p>
