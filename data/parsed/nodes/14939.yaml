      <p><strong>The question should be: Is it important to be obvious?</strong></p>
      <p>Was it important that the arrow is visible in the FedEx design? NO.</p>
      <p>Does it add value? YES. Granted it is more subliminal, but to do you deny the value of subliminal communication in design?</p>
      <p>In the case of WCC, the CC were not important in the symbol. In fact, we wanted to emphasize the W, and communicate the subliminal concept of winning.</p>
      <p>If we were attempting to create a monogram based upon the acronym, then you would be right, this would be <strong>too</strong> subtle.</p>
