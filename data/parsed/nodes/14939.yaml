      <p>Kyle: I think "jaded" in this case might describe somebody more concerned with reveling in his profession than serving the user.</p>
      <p>Chris: Agreed. But I don't think laymen ever get that second reaction in the case of the FedEx logo - unless maybe if they a graphic designer as a close friend. I'm not saying the arrow should have a neon sign delineating it; but it should have been made to become visible to the layman eventually. Art vs Craft: if a graphic designer is more concerned with expressing his self/talents/skills, he becomes closer to Art than Craft.</p>
