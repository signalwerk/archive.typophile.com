      <p>Good point.<br>
      On the other hand, ID systems are changed all the time,<br>
      and the arrow might be gone before enough people see it!</p>
      <p>My main point is, if you have a good idea like that, why not make it (gently) more explicit, and gain the positive effects immediately? I think there's only one reason on the ground: it goes against the current graphic design culture of appearing sophisticated to other graphic designers (which sucks). In contrast, below is a logo that I saw last weekend; it put a smile on my face, and made a strong impression in my mind, even though I'm "aware" of graphic design (but I'm not jaded by it).</p>
      <p><a href="http://themicrofoundry.com/other/ufish.jpg" title="http://themicrofoundry.com/other/ufish.jpg">http://themicrofoundry.com/other/ufish.jpg</a></p>
      <p>Sure, I'd definitely get rid of the waves, and possibly the splash drops too, but essentially I believe it's the type of thing that <strong>works</strong>, no matter how much most graphic designers in black turtlenecks would snort at it.</p>
      <p>hhp</p>
