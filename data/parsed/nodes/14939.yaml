  - id: 86247
    user: 2462
    date: 2005-09-05T06:06:00
    date_raw: 5 Sep 2005 — 6:06am
    votes: null
    html: <p>Well, I can't say it's the solution I would have chosen, but when I look at a FedEx truck, even knowing the arrow is there, the near-invisibility of it divorces it from the wider context. I see "letters and arrow" on one level of focus, and "truck and letters" on another, but I don't see "truck and arrow" as a relationship the way I might otherwise. It's like the difference between a big map painted on the floor and a paper map opened in front of me on the table. In the first case, it would bother me if north were not truly pointed north; in the other case, it would not, because there is no strongly implied relationship to its surroundings as context.</p>
