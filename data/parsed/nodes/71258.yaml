    <p>Every Friday we give away a free tee at TypographyShop. <a href="http://bit.ly/aWP8Ga" title="http://bit.ly/aWP8Ga">http://bit.ly/aWP8Ga</a></p>
    <p>Sign up to win a free shirt. Each Typography Friday we'll randomly select a winner to be awarded the shirt of his or her choice. </p>
    <p>There's no catch. If you're not on our mailing list we'd love it if you'd pop over <a class="freelinking external" href="http://bit.ly/bLz6Mt" rel="nofollow">here</a>  and sign up, but it's not necessary.</p>
    <p>Have a great weekend.</p>
