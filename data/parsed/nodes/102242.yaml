  - id: 550740
    user: 11578
    date: 2013-04-12T15:49:00
    date_raw: 12 Apr 2013 — 3:49pm
    votes: null
    html: |-
      <p>Re: OptiFonts. No, they are not ALL  pirated or badly digitized. Iambic is at least not badly digitized. But most of them are, and it's often hard to tell which is which. As for the others (Thank you Fivos for finding and identifying them!) Neither FontBank nor Brendel are known for original designs.  In this case, Speedway and OptiIambic both predate Brendel's Concorde.</p>
      <p>DeVroye seems to have a handle on the "original" as being FontCompany's Inverserif, now available from Infinitype (not sure whether Infinitype is a creator or distributor). However, Inverserif was/is not available in the oblique form.</p>
      <p>The Optifonts link is peculiar - depending on your ISP, you may need to use a proxy. Oddly, it can be accessed via the wayback machine.</p>
      <p> - Herb</p>
