      <p>Here is a reference from Luc Devroy's pages:<br>
      <a href="http://luc.devroye.org/fonts-50321.html" title="http://luc.devroye.org/fonts-50321.html">http://luc.devroye.org/fonts-50321.html</a></p>
      <blockquote><p>Magenta (2009, italic display type inspired by Inverserif from Infinitype, which in turn has roots in Speedway from FontBank, Concorde from Brendel Informatik, OptiIambic from Castcraft, and so forth)</p></blockquote>
      <p>"Concorde" is in fact very close -if not an exact match- to your sample, but I doubt this is the original design as Brendel Informatik is also known for their clones and font forgeries.<br>
      I just mention it to help you with your investigation.</p>
