    html: |-
      <p>The star replaced a circular dot in the 60s, the star was the mark of Scottish and Newcastle Brewery, in 1960 Scottish Breweries (including McEwan’s) and Newcastle Breweries merged. The star represented the 5 breweries of the Newcastle Breweries.</p>
      <p>Tim</p>
