      <p>Flange is similar.<br>
      Putting a mark underneath a superior capital in an all cap setting may be considered a form of “lining”, i.e. maintaining the visual effect of each character extending from baseline to cap line. It may perhaps also be considered a form of apostrophe—indicating an elided character—as in “Major” here:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Monoline_1860_3539.jpg"></div><p></p>
