    html: |-
      <p>Thanks Nick, learn something new everyday. Lining seems like the clean tech term.</p>
      <p>But... </p>
      <p>I heard a story of the origin of this mark. It had to do with Irish and Scottish families that wanted to leave their homeland and come to North America ...primarily through New York. As the story goes families could not all come over at once and knew that what little money they could gather up for the passage would be spent on the most likely family member to establish a foothold in America. </p>
      <p>Family members within the same clan began to distinguish their own family's name by placing a mark under and sometimes above the c in Mc or ac in Mac.</p>
      <p>When families were reunited having all traveled to the new world the names could be recorded all together. And they could find each other via a registry.</p>
      <p>I forget where I heard that story.</p>
