    html: |-
      <p>Nick mentioned Flange as a similar font. </p>
      <p>If McEwan is an old label it probably was hand lettering not a font. </p>
      <p>To create letters from scratch that match, find a sans serif font with the right proportions and add mini-serifs to the letters. You may need to take letters from several different fonts. For a model of  mini-serifs that are close to the label check the serif contours in Flange, or ITC Serif Gothic Extra Bold, which you are likely to already have.</p>
      <p>Don</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/ITCSerifGothicExtraBold_3975.jpg"></div><p></p>
