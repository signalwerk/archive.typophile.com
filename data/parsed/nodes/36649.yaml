      <p>Thanks Miss Tiffany,</p>
      <p>for me it sounds like a great idea!</p>
      <p>Years ago (more than 10 ;-) I played with the idea to have some kind of typeface that workes digitally but would use in fact analogic designed letters like in old photographic reproduction. So we could keep a hand designed form and not using Bezier curves that changed our world and the way we see forms totally. And I am still not quite sure wether this change was a good thing for I am convinced Bezier curves influence on form. It is no longer natural like a tree, a human hand or what ever. Curved forms had become different from what we see in nature. Thats my opinion.<br>
      Ok I see this is another theme, but...<br>
      thanks anyhow for this interesting news!</p>
      <p>Stefan</p>
