    html: |-
      <p>I ran into an interesting usage in the German magazine Value. The middle pages were printed digitally. The Photofont is made to look like the old mirror-image lead letters used prior to phototypesetting. I include an image of it. </p><div class="imageWrap"><img src="http://typophile.com/files/Photofont example_5351.png"></div><br>
      The nifty aspect of it was the ability to use it for personalization within digital print, each copy was different, regardless of the number of copies. The personalization was realized using the Adobe Scripting interface of Indesign and Photoshop.<br>
      With marketing become ever more personalized, this new tool is sure to be used often, especially in targeted personalized marketing. Presently it presses the border of realizability within the printing industry. It can only be done in digital printing. The author wrote the script for the automation himself, but customers will be interested in such personalizations. The main body of the magazine was still printed in offset, the cover was printed separately and the middle pages with the personalization were printed digitally.<p></p>
      <p>Best regards,<br>
      Steven Calkins</p>
