    html: |-
      <p>&gt; so, it’s a bitmap file stored in a font file?<br>
      &gt; is it machine readable?</p>
      <p>I’m not sure I understand the question. What do you mean by "machine readable"? </p>
      <p>A <a href="http://www.photofont.com/" rel="nofollow"><strong>photofont</strong></a> is one or more PNG images stored as separate files or packaged together, along with an XML file that defines the glyph coordinates (i.e. bounding boxes), metrics, kerning, encoding and other font-relevant data. </p>
      <p>Currently, <a href="http://www.fontlab.com/font-editor/bitfonter/" rel="nofollow"><strong>BitFonter 3</strong></a> by Fontlab Ltd. is the only commercial application that allows people to create photofonts. However, the format of a photofont is simple (since it relies on public standards like XML and PNG) and <a href="http://www.photofont.com/" rel="nofollow">documented</a> and some people have successfully created photofonts using PHP or Python scripts. </p>
      <p>At this time, one application that allows people to use photofonts is the <a href="http://www.fontlab.com/photofont/start/" rel="nofollow"><strong>Photofont Start</strong></a> plugin for Adobe Photoshop and other applications. It is free and within the next few days, we will release version 2 of the plugin that will support Photoshop CS3 on Intel Macs, and which will be about <em>10x faster</em>. </p>
      <p>Also, em2 Solution’s <a href="http://xcgfk.em2-solutions.com/info/demos.htm" rel="nofollow">XcgfK</a> font rendering engine supports photofonts natively, making them usable on mobile devices. </p>
      <p>At TypoTechnica 2007, we have previewed our next product, which will be a converter that turns photofonts into Flash files, allowing users to embed dynamic text headlines on their websites using <a href="http://www.mikeindustries.com/sifr/" rel="nofollow">sIFR</a> and similar techniques — something that Typophile uses to render its custom headings as well. The converter is under development and should be available fairly soon. </p>
      <p>Fontlab Ltd. is also working on plugins for InDesign and QuarkXPress, allowing users to use photofonts directly in those applications. </p>
      <p>Further links: </p>
      <ul>
      <li>some <a href="http://community.livejournal.com/ru_typography/331017.html" rel="nofollow">photofont examples</a> developed by two Russian designers</li>
      <li>the previous <a href="http://www.typophile.com/node/18963" rel="nofollow">Typophile thread</a> on photofonts</li>
      </ul>
      <p>Regards,<br>
      Adam Twardoch<br>
      Fontlab Ltd.</p>
