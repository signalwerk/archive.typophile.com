    html: '<p>One word of caution to anyone using this font in print: Because of its very small relative size the dots are rendered by FontStruct as diagonal lumpy cardioids, instead of circles. Because the problems associated with relative size are a "<a href="http://fontstruct.fontshop.com/faq/fonts/why_do_i_have_to_use_such_a_huge_point_size" rel="nofollow">known issue</a>" we may be able to assume that the rendering will get better over time.</p><div class="imageWrap"><img src="http://typophile.com/files/Picture6_4377.png"></div><p></p>'
    html_clean: '<p>One word of caution to anyone using this font in print: Because of its very small relative size the dots are rendered by FontStruct as diagonal lumpy cardioids, instead of circles. Because the problems associated with relative size are a "<a href="http://fontstruct.fontshop.com/faq/fonts/why_do_i_have_to_use_such_a_huge_point_size" rel="nofollow" class="link-external">known issue</a>" we may be able to assume that the rendering will get better over time.</p><div class="imageWrap"><img src="http://typophile.com/files/Picture6_4377.png"></div><p></p>'
