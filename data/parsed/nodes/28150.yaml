    <p><em>Bastarda</em>, or <em>Hybrida</em> is an amalgam of <a href="/wiki/textualis" class="freelinking" rel="nofollow">textualis</a> and <a href="/wiki/cursiva" class="freelinking" rel="nofollow">cursiva</a> scripts, used in France and Germany in the 14th and 15th century. It's development (1475-77) is attributed to Parisian printer <a href="/wiki/Pasquier%20Bonhomme" class="freelinking" rel="nofollow">Pasquier Bonhomme</a>.</p>
