    <p><em>Bastarda</em>, or <em>Hybrida</em> is an amalgam of <a href="/node/add/wiki?edit%5Btitle%5D=textualis" title="Create node &quot;textualis&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">textualis</a> and <a href="/node/add/wiki?edit%5Btitle%5D=cursiva" title="Create node &quot;cursiva&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">cursiva</a> scripts, used in France and Germany in the 14th and 15th century. It’s development (1475-77) is attributed to Parisian printer <a href="/node/28153" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Pasquier Bonhomme</a>.</p>
    <p>Sources:<br><cite><br><a href="http://www.typolexicon.de">www.typolexicon.de</a><br><a href="http://en.wikipedia.org/wiki/Blackletter">http://en.wikipedia.org/wiki/Blackletter</a><br></cite></p>
