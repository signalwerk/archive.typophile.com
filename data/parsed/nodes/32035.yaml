    html: |-
      <p><cite>If you make a class for “O_right” and include O’, C, G and Q, as well as the accented versions of those letters, you only need to manually kern O (providing the other characters are similar enough in shape). And so on for all the other character kinds that require kerning.</cite></p>
      <p>Yeeaaahh, maybe. It always seems to scew up, or maybe I don’t understand the program well enough. If so, I’m not alone: take a look a Monotype Bulmer OpenType, purchased through Adobe (though I doubt it is Adobe’s fault). There is a class _f which has as its members all the f_ligatures. It is specified to kern only on the LEFT. But somehow, when the pair “f” and “quote” (also a class) got kerned, that value was applied to all the members of _f, even though that is a kern on the RIGHT. So, “Jeffi” (a nickname in a novel I’ve read) would have what amounts to a word space between the “ffi” and the apostrophe with the possessive “Jeffi’s”.</p>
      <p>I prefer to take control &amp; only work with the features files.</p>
