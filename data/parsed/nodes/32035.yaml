    html: <p>If it is an OT font and you are working in FontLab, go to the features panel and “build kerns.” Compile, and then write off the feature file, which you can open with a text editor. In that file, the “kern” feature will show both your plain pairs kerning and your class kerning. The classes as defined will be at the top of the file.</p>
