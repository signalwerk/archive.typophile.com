    html: <p>It reads “MMG AMER” to me. The AMER makes me think it’s short for America, and MMG is a common abbreviation for “MultiMedia/Graphic Design” or “Microbiology and Molecular Genetics” at colleges. So instead of MMO Gamer, I read “Microbiology and Molecular Genetics America. That’s not what you want, obviously. I agree with Lex - start on paper.</p>
