      <p>The ’O’ gets lost for me (I read it as “MMGamer” until I realized “MMO” made more sense.) Make sure you design in one colour black and white before adding any colour or gradients to make sure it will read properly. Also, I’d suggest sketching on paper first (which it doesn’t look like you did).</p>
      <p> - Lex</p>
