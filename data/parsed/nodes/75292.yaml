    html: |-
      <p>Oh I hope he means true modernism. Googie is oogie.</p>
      <p>As you mentioned, a clean grotesque like Helvetica, Akzidenz or <a href="http://www.fontshop.com/fonts/downloads/castletype/standard_package_ot/?affid=99346" rel="nofollow">Standard</a> are safe bets. Standard is the American version of AG which was used for Vignelli’s modernist <a href="http://www.flickr.com/photos/triborough/334746135/" rel="nofollow">NY Subway</a> signage system.</p>
      <p><a href="http://www.fontshop.com/fontlist/alternatives/trade_gothic/?affid=99346" rel="nofollow">Trade, News, and Franklin Gothics</a> were also quite popular in America at the time. (See NxNW, above.)</p>
      <p>Alternatively, Chris has a good idea with Futura caps, <a href="http://typographica.org/2004/on-typography/stanley-kubrick-fan-of-futura/" rel="nofollow">a favorite of Kubrick</a>.</p>
      <p>I think it's difficult to invoke mid-century modernism with a serif or script unless it's the <a href="http://www.houseind.com/fonts/eames" rel="nofollow">warmer</a>, more <a href="http://www.houseind.com/fonts/girardfonts" rel="nofollow">whimsical</a> or handmade side of the movement you're going for, which doesn't seem to fit your description.</p>
      <p>A slab like <a href="http://www.fontshop.com/fonts/downloads/monotype/rockwell_std_complete_pack/?affid=99346" rel="nofollow">Rockwell</a>, <a href="http://www.fontshop.com/fonts/downloads/linotype/memphis_std_complete_pack/" rel="nofollow">Memphis</a>, or <a href="http://midcenturymodernist.com/2010/about/refurnished-remodeled-rebuilt/" rel="nofollow">Neutraface Slab</a> might do. They tend to reference the earlier end of the era.</p>
