      <p>The difficulty with the mid 20th century as an American angle pointing towards the European style in architecture is that the most accurate face for that time would have been AG, a European font.  The architects who you might look at were as expected, Mies, et al. You could look on their American buildings and see what the original signage was done in?  Wright and Conn were "The Americans" of note. Looking at their signage as public buildings would be more accurate than looking at hollywood film titles.  I assume your story is much more about architecture than film titles? Wright has a typeface available from P22 but that might be too distinctly him and not the genre.</p>
      <p>I might also suggest letterspaced Futura caps as having the correct feeling of the time. Clarendon caps were another oft seen architectural face.</p>
      <p>Also, here is an image from a MoMA show of the period called "Signs in the Streets":</p>
      <p><a href="http://www.alvinlustig.com/ai_si/ai_si.php" title="http://www.alvinlustig.com/ai_si/ai_si.php">http://www.alvinlustig.com/ai_si/ai_si.php</a></p>
