      <p>The problem with Helvetica is that to most people it now just says, "That default font I always get."<br>
       Univers or AG are better bets if that is the look you want.<br>
      I grew up during that era and studied design in the early 1960's. The Architecture department was one floor below and most of their professors were true modernists. They all studied at Ulm or IIT. They would never accept any type other than AG, or Futura.  Helvetica and Univers were a bit past their time but would have been OK..</p>
