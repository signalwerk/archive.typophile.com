      <p>I think it's worth pointing out that typeface selection alone is not the only issue. Line spacing and letter spacing should be considered. You may wish to look at typography from letterheads and brochures of that period. Particularly for the modernist furniture manufacturers and architecture firms you are covering.  </p>
      <p>If you have access to those resources, you should hire a designer who is expert in typography to set the type and assist you in composing the frames for your titles. This kind of collaboration will make a world of difference in your end result.</p>
      <p>Here's my XK9 Title Recipe™ (Patent Pending) for making titles look sophisticated and more integrated into your moving images. </p>
      <p>1. DO NOT USE OPAQUE TYPE. A slight transparency (80-90% opacity) will make the titles seem a part of the image. It will make it feel more like a title from films where a photographic process was used to composite titles. </p>
      <p>2. NEVER USE A DROP SHADOW. If the image beneath the type is too bright- darken it. If that's not possible, consider cropping your shots and give your type its own area as a black, white or solid color field that bleeds off at least three of the four edges. If that's not possible, consider another shot or doubling up titles on a previous or subsequent shot. </p>
      <p>3. DO NOT USE 100% WHITE. In addition to making your type transparent use a value below 100% white and tint it to match your shots. If your images are predominantly cool, try a tinge of blue. Warm, tinge of gold. If you are able try selecting a white value from your clip. You'll be surprised how dark and tinted "whites" can be.</p>
      <p>4 . DO NOT ANIMATE THE TITLES. Unless you're an experienced motion graphic designer, do not even attempt to make your titles move. Nothing says "cheesy amateur video" like moving type. Fade up and fade out. Even better if appropriate, have it on your edited shot, cut to cut. If you're going to have one title immediately follow another do not put it in the same place on screen as the previous title.</p>
      <p>5. TYPE SIZE &amp; SPACING, USAGE SHOULD BE CONSISTENT. Use a few different sizes of type as possible; and NEVER MORE THAN 2 TYPEFACES. On size, use one for credits (DIRECTED BY) and one for names (Your Name Here). Unless the title of the film is a designed logo or title treatment, use a slightly larger version (perhaps bolder weight, too) of the same typeface. Letter spacing should generally be slightly wider than you would do for text; the light of the screen of a TV or theater can make titles appear bolder than they looked on your screen.</p>
