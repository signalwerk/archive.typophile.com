      <p>After some research I think you are all right. </p>
      <p>Firstly the holiday season special design is supposed to represent <a href="http://en.wikipedia.org/wiki/Snegurochka" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Снегурочка/Snegurochka - the Snow Maiden</a>. So this is just traditional folklore. The shape of the ornament is most likely supposed to be a traditional russian headwear called кокошник/Kokoshnik, as one can see it here on the <a href="http://ru.wikipedia.org/wiki/%D0%9A%D0%BE%D0%BA%D0%BE%D1%88%D0%BD%D0%B8%D0%BA_(%D0%B3%D0%BE%D0%BB%D0%BE%D0%B2%D0%BD%D0%BE%D0%B9_%D1%83%D0%B1%D0%BE%D1%80)" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Russian</a> or <a href="http://en.wikipedia.org/wiki/Kokoshnik" title="Click to visit an external URL." class="freelink freelink-external freelink-external">English</a> Wikipedia page</p>
      <p>There are plenty of interpretations of Snegurochka wearing such a hat:<br><a href="http://Снегурочка кокошник on Google.ru." title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://Снегурочка кокошник on Google.ru.</a></p>
      <p>So mainly it is just folklore and most likely does not really have an distinct ideological flavor to Russians! </p>
      <p>As the Snow Maiden is one of the main New Year/Christmas/Winter figures in folklore the design elements are probably supposed to evoke mainly the association with snow crystals. However the ambiguity might or may not be intentional, one can not say. There is an Orthodox Christian element in the design as well. This is due to the Kokoshnik. As the headpiece is inspired by an architectural element of Russian churches from the 16th and 17th century, which even has the same name: <a href="http://en.wikipedia.org/wiki/Kokoshnik_(architecture)" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://en.wikipedia.org/wiki/Kokoshnik_(architecture)</a>.</p>
      <p>Talking about propaganda is probably way too strong, as it is just culturally embedded knowledge which of course has impact on belief-systems, but to somebody in a mainstream culture it is perceived as neutral! Therefore the designer might have just made use of folklore for the sake of nostalgia, as for the mainstream there probably is no ideological flavor to it. One can only speculate, if the choice to draw on folklore with Christian roots was a conscious choice or not. </p>
      <p>Btw, this is how the back looks like:</p>
      <p>It reads on the back that it is available in NY - Brooklyn at Desly.com 242 47th Street, 11220 NY. Tastes a bit like a mix between general European backing chocolate and milk chocolate. I posted the NY address just if somebody were interested in a very out of the ordinary way. ;)</p>
    html_clean: |-
