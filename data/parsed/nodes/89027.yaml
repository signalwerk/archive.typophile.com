      <p>This is a quite heavy load of symbolism placed on one bar of chocolate.</p>
      <p>The typical snowflake is six-fold. The ornaments may have more to do with traditional Russian embroidery and lace patterns. Of course, the colouring evokes a winter feeling.<br>
      The particular type style has nothing to do with “antiquities of biblical manuscripts” of the region.</p>
      <p>Eastern European countries are very fond of their traditional ornamentics. I find the <a href="http://j-finch0912-dc.blogspot.com/2010/06/uefa-euro-2012-brand-story.html" title="Click to visit an external URL." class="freelink freelink-external freelink-external">design of the upcoming Euro 2012</a> remarkable too.</p>
