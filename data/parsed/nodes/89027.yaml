      <p>Awesome! This packaging just gets more interesting as I dig deeper. </p>
      <p>Firstly, that head dress is definitely traditional - known as a<a href="http://traditionalrussiancostume.com/costumeinfo/xru_en.php?nametxt=14"> Diadem</a> - I doubt very much snowflake patterns would be used, simply because it diminish tradition.</p>
      <p>Secondly, the pagan religious pattern that that would most likely be is indeed a <a href="http://traditionalrussiancostume.com/embroidinfo/xru_en.php?nametxt=1"> rosette </a>.</p>
      <p>Religious to the max - pagan religion at that - bonus!</p>
      <p>If I'm not mistaken there is a rosette in Notre Dame that celebrates the zodiac. I fact there are lots of religious 'unity' themes used in <a href="http://dragon_azure.tripod.com/UoA/Med-Arch-Rose-Window.html">traditional ancient rosettes</a>. </p>
      <p>None more pure as shown on that packaging :) </p>
      <p>And if I'm not mistaken there's a deep connection between ancient Russia and Byzantium art which was adopted by the ruling class of churches alike.</p>
      <p>Interesting link: <a href="http://archaeology.kiev.ua/pub/obolensky.htm">http://archaeology.kiev.ua/pub/obolensky.htm</a> - The Relations between Byzantium and Russia (11th-15th Century)</p>
      <p>And there's something even more intriguing going on in that graphic with its traditional religious associations, but I'm first going to check my facts...</p>
      <p>Chocolate, yummy yum yum!!</p>
