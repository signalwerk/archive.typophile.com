      <p>Fascinating stuff! I'm diggin' the first and last images, especially the first one. The rhythmic pattern of the 'scarf' strongly resembles <a href="http://en.wikipedia.org/wiki/Rose_window">rose windows</a>, which is in its simplest form a Roman oculus or in early Christian and Byzantine architecture a circular oculi. In other definition the oculus pattern is a pattern of all seeing eyes. Hence the strong relationship with the child's own eyes!</p>
      <p>The packaging is obviously Christian propaganda ...no?</p>
      <p>Awesome lettering too.</p>
