      <p>This is a knock-off of a famous chocolate bar from Soviet times called simply Алёнка (which is a girl's name, diminutive form derived from Elena -&gt; Lena -&gt; Alena -&gt; Alenka).</p>
      <p><img src="/sites/default/files/old-images/shokolad_alenka_500556_3524.jpeg"></p>
      <p>The red seal says "Red October", which is the name of the chocolate factory. It is still operational and back in gold communist days it was easily identifiable by a very strong vanilla smell that drifted in the air around it. You would drive toward the airport outside of Moscow and would literally smell the factory several blocks away.</p>
      <p>The smallcaps say "Milk Chocolate".</p>
