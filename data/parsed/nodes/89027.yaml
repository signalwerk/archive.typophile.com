    <p>I just wanted to share this with you. I am not sure how much this resembles a Blackletter influence, but I found the overall minimalistic and nostalgic design great. Often a contradiction – I find – and here these ideas work in harmony. </p>
    <p>I personally loved the package, hope this is interesting to some.</p>
    <p>It is called “Любимая Аленка” produced by Kommunarka. It is a holiday special design, the girl resembles one of the helpers of Father Frost, the Russian Santa Claus.</p>
