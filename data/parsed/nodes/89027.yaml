      <p>Nostalgia makes people think something is better than it really is.<br>
      And most people are nostalgic for their childhood, no matter what it<br>
      was like.* I myself have trouble being nostalgic about my own life;<br>
      so, unlike certain Japanese people who organize nostalgia festivals<br>
      for the American 50s**, I can't for the life of me derive any pleasure<br>
      from Russian chocolate***. More on-topic: this packaging would work<br>
      well for the domestic market; however if they want to break into the<br>
      Western market they would do better to pretend to be Modernists.</p>
      <p>* I theorize that this is essentially why<br>
      people who have a messed-up childhood<br>
      so often have a messed-up adulthood.</p>
      <p>** Probably because they have a mental block<br>
      concerning their own post-WWII period, when<br>
      they disowned their vaunted, historic honor in<br>
      exchange for a few hundred thousand lives.</p>
      <p>*** Even though I usually adore Russian things,<br>
      including things most Russians no longer adore.</p>
      <p>&gt; Armenian history</p>
      <p>Actually, if I had grown up in Armenia proper (which however<br>
      is the case with less than 40% of our global population, due to<br>
      the Armenian Genocide) at my age I would probably have the<br>
      requisite nostalgia, since during my childhood Armenia was<br>
      a Soviet Republic.</p>
      <p>hhp</p>
