    html: |-
      <p>Regarding the <em>blog.idmllib.com/.../indesign-cs5-and-the-missing-inx-export/</em> link and the steps it describes for CS5 users to exchange data with CS3 users, this is what James Puckett complained about: You need at least two versions of CS. First, from CS5 to CS4 via IDML. Then, from CS4 to CS3 via INX (and to CS2 with an additional hack). At least one user needs both CS5 and CS4, or both CS4 and CS3.</p>
      <p>Related, I cannot say that I am particularly amused when reading an announcement like <a href="http://blogs.adobe.com/conversations/2011/11/adobe-creative-cloud-and-adobe-creative-suite-new-choices-for-customers.html" target="_blank" rel="nofollow">this</a>, in particular:</p>
      <p><cite>For customers who prefer to remain on the current licensing model, [...] In order to qualify for upgrade pricing when CS6 releases, customers will need to be on the latest version of our software (either CS5 or CS5.5 editions). If our customers are not yet on those versions, we’re offering a 20% discount through December 31, 2011 which will qualify them for upgrade pricing when we release CS6.</cite></p>
      <p>This is not an 'offer' except maybe in a mafia sense of the term – an offer you better don't reject: Either you upgrade to the current version. Or you are excluded from future ones. Please correct me if I got this wrong.</p>
      <p>Such bits and pieces, technical obstacles on the one hand, licensing obstacles on the other hand, make it difficult for me to remain a loyal Adobe customer even though I like the applications. (Same for Apple, by the way, just to indicate that this is not about anti-Adobe sentiments.)</p>
