      <p>&gt; unnecessary version incompatibility with older versions</p>
      <p>On many occasions I've wished that InDesign had better backwards compatibility, but I'm not sure that "unnecessary" is the appropriate word. I used to know the lead programmer for a major software application and he said that backwards compatibility was a problem with many applications and that insisting on backwards compatibility would often force compromises in other areas (like new features) which users wouldn't like.</p>
      <p>In any event, if you know your files are also also going to be worked on by someone else, it's always best to both use the same version. That's why I keep the last 3 versions of InDesign on my Mac.</p>
