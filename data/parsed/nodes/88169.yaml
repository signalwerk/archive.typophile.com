      <p>&gt; carpenters don't buy a new hammer every<br>
      &gt; year when the new models come out. </p>
      <p>I'm sympathetic to your viewpoint, but the analogy has some flaws.</p>
      <p>I put off upgrading to CS 5.5, but recently a corporate client sent me an InDesign 5.5 file and asked me to make some changes to it. My options were 1) upgrade to 5.5, or 2) tell my client I didn't have 5.5, look like a cheapskate who couldn't afford to keep his software current, and probably lose the job.</p>
      <p>So I upgraded.</p>
      <p>If you work in a collaborative environment in which you share native files with co-workers, clients and vendors, it's difficult to avoid upgrading periodically. I look at it as part of the cost of doing business.</p>
