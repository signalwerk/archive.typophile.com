      <p>I haven't "upgraded" my original CS, since developing (in the early 1990s) a philosophy of resisting "upgrades" by the digital oligarchs, which I consider to be an unwarranted and onerous form of professional taxation.</p>
      <p>As a teacher, this can be embarrassing, as I occasionally have to ask students how to do simple things in their "computer labs", which have the latest versions of apps, that work differently than the version I have in my studio.</p>
      <p>Being a part-time teacher, I haven't bothered to pursue the idea of asking my employer to pay for my software "upgrades", or arrange a refresher course, neither of which would be feasible.</p>
