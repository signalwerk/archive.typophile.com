      <p>Don: if you have stuck to the even numbered versions, you are about to receive a nasty surprise. Apparently lots of people skipped single versions, so Adobe's marketing team found a way around that. Starting with CS6, you can no longer upgrade from two or more version old; only <em>one</em> version will get you a discount.</p>
