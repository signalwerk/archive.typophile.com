    <p>I don't have any particular reason or question in this post, I'm only writing it because I find it interesting that here in the Algarve, Portugal, there exist so many signs and ads from the 70s and 80s which use the 'fancy' font Jackson MN. </p><div class="imageWrap"><img src="http://typophile.com/files/jackson8_4877.png"></div> In the following pictures I captured some of the places where I've seen it, but I remember at least four more, in the north of Portugal, suggesting this 'mania' was not only in one or two design shops. Personally, I have to say that I find it quite unique, although I wouldn't really use it in any of the things I do.<br>
    1. Here the font displays 'móveis' at a furniture shop: <div class="imageWrap"><img src="http://typophile.com/files/jackson1_4362.jpg"></div><br>
    2. Here the sign reads 'snack-bar "the caterpillar"'. If I'm not mistaking, the tréma was used instead of the quotation-marks: <div class="imageWrap"><img src="http://typophile.com/files/Jackson3_4718.jpg"></div><br>
    3. Here is the logo of the Australian tissue company ABC: <div class="imageWrap"><img src="http://typophile.com/files/jackson2_6582.png"></div><br>
    4. Here we see a printers shop advertising: <div class="imageWrap"><img src="http://typophile.com/files/jackson4_4042.jpg"></div><br>
    5. A map of my hometown, which my father designed together whit a friend (the map, not the town): <div class="imageWrap"><img src="http://typophile.com/files/jackson6_4096.jpg"></div><br>
    6. A mistake in the above-mentioned map: <div class="imageWrap"><img src="http://typophile.com/files/jackson7_6621.jpg"></div>  here the V was accidentally swapped with a Y, so the near-by village of Alvor is 'Alyor'. The Y and V are very similar: <div class="imageWrap"><img src="http://typophile.com/files/jackson9_4474.png"></div><br>
    7. Jackson MN was so popular, that somebody even made a crude imitation of it on the wall of the municipal market of Ferragudo: <div class="imageWrap"><img src="http://typophile.com/files/jackson5_4217.jpg"></div>. Sorry for putting in such large-sized images, you'll have to open them in another window.<p></p>
