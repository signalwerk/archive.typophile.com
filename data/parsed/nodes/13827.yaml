    <p>Like this:</p>
    <p><a href="http://www.hyperreal.org/raves/database/gallery/images_temp/hacienda_memb_grey_yellow.jpg">http://www.hyperreal.org/raves/database/gallery/images_temp/hacienda_memb_grey_yellow.jpg</a></p>
    <p>But who released this version?</p>
