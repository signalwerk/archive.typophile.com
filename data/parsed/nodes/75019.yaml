      <p>hi hola, thanks for your input. it's always very helpful to know, that we see things so differently. the truth is that my client likes the idea of the hands, so i wish to stick with it, even if i have to work on them more. also i did some research and found that noone is using this gesture among the competitors, and i like to do something new if possible. in fact my first choice is the last version. i wonder what others think about that.<br>
