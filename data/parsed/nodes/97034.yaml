  html: |-
    <p>Hey guys,</p>
    <p>Here is the first look of the typeface i am creating. Only caps done. No character spacing done and you can forget about kerning. Just wanted some feedback.<br>
    Issues:<br>
     The thickness of strokes of V, W, X, Y is to be increased.<br>
     S can do better with some more tweaking.<br>
     And the inner curves of characters like B, C, O, Q are not perfectly circular(for the lack of better term) and look jagged.( I have no idea how to change it).</p>
    <p>Please inform me if you have any other issues...</p>
    <p>Update: The problem of jagged text is more pronounced when using at pt size of 36. The other point sizes also give text which is not very smooth. Why?</p>
    <p>Thanks<br>
    T</p>
