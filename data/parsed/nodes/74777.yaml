  html: |-
    <p>Hi. Is there anyone you knows if there is a name for this kind of alternated font?</p>
    <p>Most of the time its all uppercase, but kind of combining pairs of characters as if they where a monogram or some. I remembered this kind of atls in condensed san-serifs painted in vintage stores. This is not the best example, its kind of fancy, but it may help.</p>
    <p>Avantgarde has something like this, but sometimes crossing letters. Not what I'm looking for. Just this game in between letters, but not touching each other. Thanks and sorry for my english.</p>
    <p>Guima.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/24021_4177.jpg"></div><div class="imageWrap"><img src="http://typophile.com/files/13903_6688.png"></div><p></p>
