      <p>It's lettering so there is no exact match.<br>
      The wave extending from the bar of the A is called a tilde. Popular circa 1900.<br>
      For a recent list of fonts with tilde bars see <a href="http://typophile.com/node/103398" title="http://typophile.com/node/103398">http://typophile.com/node/103398</a><br>
      Don</p>
