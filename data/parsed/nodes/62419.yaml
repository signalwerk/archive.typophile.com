      <p>I agree with James (Terminaldesign), that you’re heading down the wrong path in trying to force a connection between u and a. I’d look at a different solution.</p>
      <p>Alternatively, go for a script, or romanesque script, in which <em>all</em> the letters connect. Examples: <a href="http://www.fontshop.com/fonts/singles/elsner_flake/roman_script_ot/?&amp;sample_text=Luan&amp;sample_size=48" rel="nofollow">Roman Script</a>, <a href="http://www.fontshop.com/fonts/singles/sudtipos/mousse_script_ot/?&amp;sample_text=Luan&amp;sample_size=48" rel="nofollow">Mousse Script</a>, <a href="http://www.fontshop.com/fonts/singles/linotype/kursivschrift_stehend/?&amp;sample_text=Luan&amp;sample_size=48" rel="nofollow">Kursivschrift</a>.</p>
