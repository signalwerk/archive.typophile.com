    html: "<p>A ligature (noun) is a characteristic of typesetting systems: a single glyph representing more than one character. To ligate (verb) is a characteristic of writing: the act of joining two or more letters together in some way. It follows that a ligature may or may not represent ligation, and ligation may be represented by means other than a ligature. From this flows much confusion. I'd say that Boris is looking for examples of ligated <em>ua.</em></p>"
