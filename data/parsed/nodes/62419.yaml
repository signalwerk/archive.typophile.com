      <p><em>When used in text typography those ct and st things draw attention to themselves and just look distracting. Not a good thing in text typography.</em></p>
      <p>That rather depends on the text. I would agree that these forms are no longer appropriate to book length texts, simply because readers are not used to them; there was a time when they regularly appeared in book typography, so they can't be considered inherently inappropriate: they're just inappropriate now. But there remain settings in which they can be used sensitively and benefit typography precisely because they are out of the ordinary: they can signify out of the ordinary texts. And of course they can be used to deliberately evoke period typography.</p>
