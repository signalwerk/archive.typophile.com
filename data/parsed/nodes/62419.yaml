    html: |-
      <p>I always understood ligature to be a  typesetting term. More that one glyph on a single type body. </p>
      <p>I never heard it used in relation to handwriting.</p>
      <p>I understand that an fi ligature solves the problem of the hood of the f crashing into the dot of the i (except in turkish). I also understand the fl and other f to ascender ligatures solve a spacing and color problem. </p>
      <p>I understand the dutch ij ligature because of how those letters are treated as a unit in the language. </p>
      <p>I see no reason why a u and an a have to be designed as a single glyph/ligature. There is no color or spacing problem to solve. What other use would there be? If you want to use it to design a logo than by all means go ahead. But I don't think you are going to find it in any character set in an existing font </p>
      <p>And just so you know where I'm coming from I always thought those ct and st ligatures to be an archaic affectation with no modern typographic relevance.</p>
