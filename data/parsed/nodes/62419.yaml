      <p>Of course, a ligature like st/ct won't help in copy text, but if they are used in a logo or in short sentences, they could be the winning touch for a minimal site. Take a look for example at this one: <a href="http://www.pisto-magazin.de" title="www.pisto-magazin.de" class="link-external">www.pisto-magazin.de</a></p>
      <p>labyrinthos: My client is a cardiologist with a deep interest in photography. He wants to build a minimal site to showcase his pictures, with a brief comment right below them. A blog. So we are designing a minimal, type oriented site that focuses on content and pictures. I'm attaching a preview of what we have now, everything is set in Helvetica (no more than two sizes), pixels are measured perfectly within a 930px grid, and so we need an interesting, yet not so disturbing, logo for the header. We thought that "Luan", in red (like in Pisto Magazine), will work. And thought that a ligature/swash for the "ua" could help even more.</p>
      <p>Here's the site we are working on: <a href="http://img143.imageshack.us/img143/5520/luancom20090928grid.jpg" title="http://img143.imageshack.us/img143/5520/luancom20090928grid.jpg" class="link-external">http://img143.imageshack.us/img143/5520/luancom20090928grid.jpg</a></p>
      <p>Thanks!</p>
