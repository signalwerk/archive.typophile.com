  html: |-
    <p>Our company owns licenses for the Frutiger family through Monotype.  We would like to convert our Frutiger font files to the .fnt file format.  The .fnt file format can be used by an engraving machine we've purchased to produce facility signage.</p>
    <p>We've come to an agreement with Monotype for a custom license that allows the conversion.  </p>
    <p>However, Monotype no longer has the capability to complete the conversion to .fnt.  We need a separate font company to assist in the file conversions and any necessary font adjustments.  </p>
    <p>Any suggestions for groups that we might approach for this effort?  </p>
    <p>I've reached out to some of the more well-known foundries.  So far the responses are not good.  No one is equipped for .fnt creation.</p>
    <p>I understand that the .fnt format is archaic, but it's the only format the engraver will support.</p>
    <p>I would appreciate any insight on this topic!</p>
