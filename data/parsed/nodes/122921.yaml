      <p>Have you guys tried with FontForge? First select<br>
      <code>&nbsp;&nbsp;Element -&gt; Bitmap Strikes_Available</code><br>
      and choose Win and the point size ; then go to<br>
      <code>&nbsp;&nbsp;File -&gt; Generate Fonts...</code><br>
      with <code>No Outline Font</code> and <code>Win FNT</code>. Even if I read a .fon extension before saving, the file saved is <code>.fnt</code> and looks ok.</p>
