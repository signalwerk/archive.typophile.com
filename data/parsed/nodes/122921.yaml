    html: <p>".fnt" is kind of a generic file extension. Do you have more details? Could it be the Windows 3.0 "bitmapped" type, as used as a rendering cache to quickly display monochrome fonts? (I know -- the latter doesn't really rhyme with 'engraving', but perhaps the machine's manufacturor chose this file format because it's a fairly simple one.)</p>
