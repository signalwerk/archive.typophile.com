    <p>Greetings Friends!</p>
    <p>As crusty snow starts to thaw and grass starts a peekin' through, it can only mean one thing . . . NEW FONTS from the Font Bros!</p>
    <p>Filmotype -  Filmotype Alice marks the beginnings of the casual handwritten script aesthetic. Introduced by Filmotype in the late 1950s, it perfectly captures the mid-century playfulness of hand lettering while providing comfortable readability. Check it out at: <a href="http://www.fontbros.com/cgi-bin/commerce.cgi?preadd=action&amp;key=FILM-ALIC" title="http://www.fontbros.com/cgi-bin/commerce.cgi?preadd=action&amp;key=FILM-ALIC">http://www.fontbros.com/cgi-bin/commerce.cgi?preadd=action&amp;key=FILM-ALIC</a></p>
    <p>Strikingly poised and almost as exotic as it sounds, Filmotype Zanzibar is among Filmotype's most amazing and beautiful formal scripts released. This hidden gem was released originally in the early 1950s has been meticulously redrawn from the original font filmstrips. Check it out at: <a href="http://www.fontbros.com/cgi-bin/commerce.cgi?preadd=action&amp;key=FILM-ZANZ" title="http://www.fontbros.com/cgi-bin/commerce.cgi?preadd=action&amp;key=FILM-ZANZ">http://www.fontbros.com/cgi-bin/commerce.cgi?preadd=action&amp;key=FILM-ZANZ</a></p>
    <p>Fontalicious - We've just updated and re-released a nice handful of original Fontalicious fonts! These fonts have been updated, expanded, and generated in OpenType format for your pleasure. The new re-releases include: Baby Kruffy, Cheeseburger, Juice, Lounge Bait, Mandingo, and Superfly! Check 'em out at: <a href="http://www.fontbros.com/fontalicious.php" title="http://www.fontbros.com/fontalicious.php">http://www.fontbros.com/fontalicious.php</a></p>
    <p>Harold's Fonts - Diversion is a little amusement, all swirls and spirals. It was inspired by the handlettered logo of an Italian restaurant in Mexico. Could add a lot of whimsy if used carefully, might cause dizziness if overused. Check it out at: <a href="http://www.fontbros.com/cgi-bin/commerce.cgi?preadd=action&amp;key=HAFO-DIVE" title="http://www.fontbros.com/cgi-bin/commerce.cgi?preadd=action&amp;key=HAFO-DIVE">http://www.fontbros.com/cgi-bin/commerce.cgi?preadd=action&amp;key=HAFO-DIVE</a></p>
    <p>Havana Street - Ooze was inspired by original 1940s style Hollywood hand-lettered, movie poster-type and is sure to bring the ghosts and ghouls out of your computer for some spooky fun! Perfect for Halloween, haunted houses, or when you need that classic creepy look! Check it out at: <a href="http://www.fontbros.com/cgi-bin/commerce.cgi?preadd=action&amp;key=HAVA-OOZE" title="http://www.fontbros.com/cgi-bin/commerce.cgi?preadd=action&amp;key=HAVA-OOZE">http://www.fontbros.com/cgi-bin/commerce.cgi?preadd=action&amp;key=HAVA-OOZE</a></p>
    <p>Sideshow - Toylab was originally created by talented illustrator and lettering artist Molly Z for ToyLab, an actual wacky workshop where kids invent new toys using old toy parts. The letterforms were designed to evoke play and fun and to be used in the most imaginative of ways! Check out this super fun and futuristic font at: <a href="http://www.fontbros.com/cgi-bin/commerce.cgi?preadd=action&amp;key=SIDE-TOYL" title="http://www.fontbros.com/cgi-bin/commerce.cgi?preadd=action&amp;key=SIDE-TOYL">http://www.fontbros.com/cgi-bin/commerce.cgi?preadd=action&amp;key=SIDE-TOYL</a></p>
    <p>As always, we strive to bring the best display typefaces to your desktop so enjoy browsing our HUGE and expanding selection of display typfaces and let a friend know where you shop for the best fonts online! Font Bros or course!</p>
    <p>Warmly,<br>
    Mike &amp; Stuart<br>
    The Font Bros</p>
