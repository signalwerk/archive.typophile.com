    html: |-
      <p>Actually, I may be confusing folks with too many mailers :D</p>
      <p>Tiffany posted the mailing I sent to everbody who's opted in to receive updates from the Filmotype mailing list which you can too sign up for at the Filmotype.com website . . .</p>
      <p>The release I posted today was from the Font Bros mass mailing that went out on Friday which features all the releases Font Bros just added including the Filmotype fonts - To clear up any confusion, I am a co-owner of Font Bros and post these releases from time to time unless Paul Hunt beats me to it :D</p>
      <p>And finally, after a significant lag, I just sent off another mass mailing to all the folks who are subscribed to the Font Diner e-mail list which covers some of this news as well as other Font Diner news . . . I may post that later on as well but I don't want to wear out my welcome since I expect to send a Mr. Retro mass mailing later today as well announcing some new serigraphs :D</p>
      <p>Otherwise for clarification, Mark digitized Filmotype Zanzibar for Font Diner even though we release that library exclusively via Font Bros at this time . . . Keep your eye's sharply peeled for the news of Zanzibar on Mark's site as well as another font creator who digitized the Filmotype Allison font (I won't OUT him here)</p>
      <p>And Chris, your sentiment hasn't gone unnoticed . . . Font Diner is the reason I am able to do what I do these days so I'm paying much love to the Diner but the fruits of my labor won't be revealed till the Summer with a new Font Set although the website update was a significant undertaking and I'm currently in EULA land getting that upgraded for the masses . . .</p>
      <p>I'm also working on releasing some old classics that were among my earliest releases . . .</p>
      <p>Stuart :D</p>
