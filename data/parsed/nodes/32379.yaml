  html: |-
    <p>I’m currently working on a photo journal publication and wanted to seek opinions from other designers regarding whitespace around photographs. The publication itself is landscape format so as most of the photographs.</p>
    <p>Is there a generic rule whether should more white space be added if for instance the photo contains a main subject. And less white space (margins) if it is just a photo of a landscape for instance?</p>
