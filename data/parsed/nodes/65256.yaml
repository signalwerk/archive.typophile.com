    <p>BAD HOMBURG, Germany, Dec. 10, 2009 – Linotype GmbH, a Monotype Imaging (Nasdaq: TYPE) company, has expanded its portfolio of Arabic typefaces to include a new design: the Neue Helvetica® Arabic typeface family.</p>
    <p>Designed by Nadine Chahine, Linotype’s Arabic specialist typeface designer, Neue Helvetica Arabic combines the traditional Helvetica style, with the distinctive scripts of Arabic. The new typeface now allows Helvetica to be used in Arabic headlines, titles, signage, logos and corporate communication.</p>
    <p>Frank Wildenberg, managing director of Linotype, said: “The release of Neue Helvetica Arabic is part of Linotype’s response to the growing market for Arabic typefaces. We have released a series of successful Arabic typefaces in the last few years and we pride ourselves in providing original and innovative designs that can be used in many different mediums, internationally.”</p>
    <p>The popularity of Helvetica meant Chahine had an ambitious task when it came to designing the Arabic version of the typeface. According to Chahine, not only are Latin and Arabic languages intrinsically different in design, but it is a challenge to create an Arabic typeface that works in both headlines and text. This is due to Arabic scripts having many different calligraphic styles, for either text or headlines. Neue Helvetica Arabic has been designed to be used at the same point size, weight and optical size as the Latin version and translates the Helvetican concept into Arabic.  Despite being translated into another script system, Chahine’s approach was to ensure that the neutrality and formality of the original typeface be maintained.</p>
    <p>Chahine said: “Helvetica is an iconic design and I was delighted to be involved in this project.  The finished typeface is original and innovative and inspired by a rich blend of local aesthetics while ensuring international levels of quality and performance.”</p>
    <p>Neue Helvetica Arabic fonts may be viewed, purchased and downloaded from <a href="http://www.linotype.com" title="www.linotype.com">www.linotype.com</a>. Customers may also contact Linotype at +49 (0) 6172 484-418. Customers in the U.S. may contact Monotype Imaging toll-free at 800-424-8973, or in Europe at (+44 0)1737 765959, or 001781 970-6020, option 2. Customers from other parts of the world may dial 001 781 970-6020 (U.S.). </p>
    <p>About Nadine Chahine</p>
    <p>Nadine Chahine is an award winning Lebanese type designer with a special interest in Arabic typography. She studied Graphic Design at the American University of Beirut and Typeface Design at the University of Reading, UK. During her studies at Reading, Chahine focused on the relationship of the Arabic and Latin scripts. In 2005 she joined Linotype, a Monotype Imaging company, as its Arabic specialist.</p>
    <p>Chahine has won the Dean’s Award for Creative Achievement from the American University of Beirut and an Award for Excellence in Type Design from the Type Directors Club in New York. Her typefaces include the Frutiger® Arabic, Palatino® Arabic, Koufiya™, Janna™, Badiya™, and BigVesta™ Arabic typeface families. </p>
    <p>About Linotype</p>
    <p>Linotype GmbH, based in Bad Homburg, Germany and a wholly owned subsidiary of Monotype Imaging Holdings Inc., looks back onto a history of more than 120 years. Building on its strong heritage, Linotype develops state-of-the-art font technology and offers more than 10,000 typefaces, covering the whole typographic spectrum from antique to modern, from east to west, and from classical to experimental. All typefaces (in PostScript® and TrueType® format as well as more than 7,000 fonts in the OpenType® format) are now also available for instant download at <a href="http://www.linotype.com" title="www.linotype.com">www.linotype.com</a>. In addition to supplying digital fonts, Linotype also offers comprehensive and individual consultation and support services for font applications in worldwide (corporate) communication.</p>
    <p>About Monotype Imaging</p>
    <p>Monotype Imaging is a global provider of text imaging solutions for manufacturers and developers of consumer electronics devices including laser printers, copiers, mobile phones, digital televisions, set-top boxes, navigation devices, digital cameras and software applications and operating systems. The company also provides printer drivers and color imaging technologies to OEMs (original equipment manufacturers). Monotype Imaging technologies are combined with access to more than 10,000 typefaces from the Monotype®, Linotype® and ITC® typeface libraries – home to some of the world's most widely used designs, including the Times New Roman®, Helvetica® and ITC Franklin Gothic™ typefaces. Fonts are licensed to creative and business professionals through custom font design services, direct sales or e-commerce portals. Monotype Imaging offers fonts and industry-standard solutions that support all of the world's major languages. The company is based in Woburn, Mass., with regional offices in the U.K., Germany (Linotype), Japan, China and Korea, in addition to U.S. regional offices in Mt. Prospect, Ill., Redwood City, Calif. and Boulder, Colo. Information about Monotype Imaging and its products can be found at <a href="http://www.monotypeimaging.com" title="www.monotypeimaging.com">www.monotypeimaging.com</a>.</p>
    <p>Linotype is a registered trademark of Linotype GmbH in the U. S. Patent and Trademark Office and may be registered in certain jurisdictions. Koufiya, Janna, Badiya and BigVesta are trademarks of Linotype GmbH and may be registered in certain jurisdictions. Helvetica, Frutiger and Palatino are trademarks of Linotype Corp. registered in the U.S. Patent and Trademark Office and may be registered in certain jurisdictions in the name of Linotype Corp. or its licensee Linotype GmbH. Monotype is a trademark of Monotype Imaging Inc. registered in the U.S. Patent and Trademark Office and may be registered in certain jurisdictions. Times New Roman is a trademark of The Monotype Corp. registered in the U.S. Patent and Trademark Office and may be registered in certain other jurisdictions. ITC is a trademark of International Typeface Corp. registered in the U.S. Patent and Trademark Office and may be registered in certain jurisdictions. ITC Franklin Gothic is a trademark of International Typeface Corp. which may be registered in certain jurisdictions. PostScript is either a registered trademark or trademark of Adobe Systems Inc. in the U.S. and/or other countries. TrueType is a trademark of Apple Inc. registered in the U.S. Patent and Trademark Office and other countries. OpenType is either a trademark or registered trademark of Microsoft Corp. in the U.S. and/or other countries. © 2009 Linotype GmbH. All rights reserved.</p>
