      <p>Hey Rocky,</p>
      <p>I also think it’s a font, with opentype there are a lot of possibilities——alternates, ligatures, connection strokes——check “house industries” and the movies of the “Robothon” conference. But back to the font, it doesn’t really matter if it’s written or a font because it’s not that good. It’s really inconsistent in spacing, kerning, connection-strokes and countershapes. But I do think it’s a font, a writer that spends time learning this should know the basics that would not result in this.</p>
