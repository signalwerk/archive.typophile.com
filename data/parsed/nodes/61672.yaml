      <p>Thanks for commenting! </p>
      <p>Hrant, I knew of John Downer's Paperback, but thanks to you, I now have his <a class="freelinking external" href="http://new.myfonts.com/fonts/emigre/vendetta/medium" rel="nofollow">Vendetta</a> very high on my purchase list. That's a Venetian to my liking! I'd very much like to know more of the rationale of his lineal approach, not having found much on the net, though.  </p>
      <p>Nick, yes, those zeds were horrible, I admit that. I can only blame them on sleep deprivation. I've made new and better ones, and I've also taken some weight off and done some fiddling on the exes, the "f", the kays and the "t". </p>
      <p><cite>Don’t you owe it to yourself to have 15 and 75 degrees also?</cite></p>
      <p>I think they're both to close to the horizontal and the vertical to be of much use, really. And then I'd be tempted to make the "curves" much smoother, with four lines where I now have two. Too much work.</p>
      <p><em>[...] a crazy 67.5 degree anomaly</em></p>
      <p>That's three sixteenths of a circle, isn't it? I now use circle sections of 1/16 (22.5°), 2/16 (45°) and 3/16 (67,5°), and 1/12 (30°) and  2/12 (60°). I'd say that is pretty uncrazy geometry.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/monomania2_5328.png"></div><p></p>
