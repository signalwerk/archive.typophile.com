      <p>Interesting. Reminds me of doodles I often make on graph paper, and of plotter lettering.</p>
      <p>I'd be interested to know if the idea would hold together if you introduced some contrast into the face. I also wonder if some of the counters could "skip" an angle on their way around - could you get a kind of <a class="freelinking external" href="http://www.typophile.com/node/41687" rel="nofollow">"cut and then curved"</a> effect? (speaking of Vendetta...) These are different directions than where you're going so far, of course.</p>
      <p>Some interesting subtle touches here, like having the chamfering on the terminals of s much smaller than, say, the top of t, so that those terminals have more solidity.</p>
      <p>Your 'f' has problems. it starts to curve over too low, but I imagine it's because you're trying to fill the monowidth slot with that hood. Even still, the letter sits too far left in its slot ("handcraf ted"). Could you somehow give more responsibility for its width to the crossbar instead of the hood? (Or does anybody ever give 'f' a baseline serif in a monowidth font, as you've done with the 'l'?)</p>
      <p>Did you try a more (pseudo-)curved-top A?</p>
