      <p>Thank you very much for mailing me your review of Vendetta, Hrant. I've read it twice, and I just want to say that this is one of the most qualified type reviews I've seen -- it's a pity that this isn't available to the general public anymore. Your focus on readability, based on (what seems to me as) factual knowledge on the matter, is very valuable to a wannabe type designer as myself -- and indeed to potential users of typefaces. I'm not sure that I entirely share your viewpoint that "geometry is anathema to readability", but as a starting point for a review of Vendetta, which on first eyesight can be conceived as some kind of "geometric Venetian", it is very fruitful. Thanks again for a good read.</p>
      <p>Er, this thread is getting highly off topic. I guess that's okay, since I started it -- but I just want to say that criticism of my attempt at a Downer-style monospace is welcome.</p>
