    html: |-
      <p>I couldn't agree more, breakneck fonting is good fun. Straight lines are great for roughing out letters and swashes. I often draw this way and then use the line-&gt;curve tool in fontlab to clean up afterward. Though I like the charm of rough letters at text size. A particular favorite of mine: Journal. Part of what made my quick project doable was that it was an italic, so copy and paste worked well. It'd be fun to try again and see if 2.5 years has sped me up or slowed me down. Hmmm... I'm envisioning a fast-forward screencast with clock.</p>
      <p>Regarding your project, looks nice! I've never wrestled with the particulars of a monospace so take the following with a grain of salt:<br>
      • t: crossbar too far left? Shift it all to the right?<br>
      • r: maybe deploy a small head serif, shift the stem right, and shorten the arm.<br>
      • I wonder if a gif would similarly blur?<br>
      • why do the angles matter? Seems like the shapes are what matter... am I missing something?</p>
      <p>BTW Mondegreen is also very nice. Century needed to be brought into this century. After geometric sans and slab serifs play out, Century will be king again. Haha probably not, but oh well. Cheers!</p>
