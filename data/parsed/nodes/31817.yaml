    <p>Hi</p>
    <p>new to the forums, so forgive me if there have already been a million similar posts.. I'm trying to track down a couple of old fonts, Yagi Link Double and Dektiv. Yagi Link Double was in an old Letraset Catalogue, Dektiv was in the book Homage To The Alphabet.</p>
    <p>I assume these fonts were never digitised as I can't find references to them with any of the major type foundries or re-sellers.. </p>
    <p>so a couple of questions..</p>
    <p>does anyone know whether the 'Homage To The Alphabet' that was published in 1990 is another edition of the one that was published in 1984? it has a slightly different title so may not be.. </p>
    <p>anyone got a copy of the 1984 one they want to sell me? or an old Letraset book with Yagi in it?</p>
    <p>does anyone have any decent size reference for either font? </p>
    <p>cheers</p>
