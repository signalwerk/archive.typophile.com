      <p>I don't understand the design problem enough. Is your menu on the top, left or right? And you have a typo: Hebrew is right to left. European languages are left to right. </p>
      <p>As far as menus, many sites just have a link for 'English' and 'Ivrit' (in Hebrew script), and people click whichever menu system they want to work in. </p>
      <p>Also you could have drop down or roll over menus, one in Hebrew and one in English. </p>
      <p>On the alignment I would think it would depend on how long the items are, and where they are oriented. I'm not a native speaker (and not a very good speaker at that), so I can't tell you what they'd prefer.</p>
