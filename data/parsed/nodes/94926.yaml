      <p>Oh, yes, that was most definitely an error. I did mention that I find this confusing, didn't I? 0_O</p>
      <p>The website is named Wikia which is a wiki hoster. Most wikis on Wikia are monolingual of course and the majority is (still) in English, but I've seen quite a few Hebrew wikis in my research.</p>
      <p>The menu resides at the top and comes standard with every new wiki. My gadget adds a user-configurable section to the menu. It does not replace the entire menu or modify the rest of it. That means a lot of things are given. The menu's color scheme is up to the wiki's creators and as such out of my hands. The menu's typeface and general design is up to Wikia and as such out of my hands as well.</p>
      <p>Here's a screenshot of my menu in an English wiki:<br>
      <a class="freelinking external" href="http://images2.wikia.nocookie.net/__cb20120613194318/central/images/4/42/Wikimarks-demo.png" rel="nofollow">http://images2.wikia.nocookie.net/__cb20120613194318/central/images/4/42/Wikimarks-demo.png</a></p>
      <p>And here's an example of a Hebrew wiki:<br>
      <a class="freelinking external" href="http://keremproject.wikia.com/" rel="nofollow">http://keremproject.wikia.com/</a><br>
      (I cannot read Hebrew and I only arrived at this particular one by repeatedly clicking the "Random Wiki" button.  Please don't hold it against me or Wikia, if this wiki is about something stupid ;)</p>
      <p>Centering is a nice suggestion, but not really an option, I'm afraid. The added menu shouldn't look different from the rest of it, nor should adding the menu modify the rest.</p>
      <p>While I whould hope that users do not put rtl and ltr items on the same menu or submenu, they probably will. If you give users the option to ruin it for themselves, they will. So let's say, hypothetically, I did find a way to programmatically distinguish between English and Hebrew: Would it be good or bad, if there were items on the same menu that have different alignment? Or would aligning everything to the right and placing the submenus to the left be less messy?</p>
