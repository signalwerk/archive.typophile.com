      <p>I recommend the following: Set all Latin flush left and all Hebrew flush right. Then determine a center line between the groups that ensures that neither language will extend beyond the other's line of departure, and that each will have a clearly identifiable position. That will be your measure.</p>
      <p>You might try using the new Myriad Hebrew with Myriad Pro, both from Adobe. This will give you a wide range of compatible weights that will enable you to go smoothly from script to script without changing sizes. It was designed with just this sort of purpose in mind. It has been optimized for web use, including the vocalization diacritics.</p>
      <p>Much has been written on this board about Latin-Hebrew compatibility. It's a subject about which I find it impossible to generalize, as so much depends on the use. In much of my work, which concerns Hebrew liturgy in a multi-lingual context, the Hebrew needs to have pride of place rather than be smoothly integrated with the Latin. But there are other contexts, too, even within the same book. In your case, Xigam, you need very smooth integration, so the Myriad will be a perfect solution. I was, by the way, the principal consultant on its design and development.</p>
      <p>Good luck!</p>
