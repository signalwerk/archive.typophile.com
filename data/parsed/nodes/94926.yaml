    html: <p>Not sure if I made that clear, but I'm working on a multi-tiered multi-level drop-down menu on a website. The site itself is multilingual. The overwhelming majority of pages is monolingual however (except for the odd bit that still awaits translation). The menu will be shown on all pages - rtl pages and ltr pages alike. The menu is fully editable so I expect ltr users - like Hebrew speakers - to end up with a mix of ltr and rtl items on their menus. My guess would be the safe choice is to align everything right and add the submenus on the left. But I'd much rather leave the final word to a native speaker of Hebrew or another language that's written ltr. There's no way I can make this annoyance-free for Hebrew speakers I suppose. I was merely wondering what the least annoying version would be.</p>
