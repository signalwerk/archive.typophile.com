    <p>This is not exactly a typographical question, but I honestly don't know where to ask such things, so please forgive me! </p>
    <p>How do I properly mix Hebrew and English? More specifically: Suppose you have a program menu: Should the English menu items be left-aligned? And what about the submenus? Should they be on the right? And what if there's a mix of Hebrew and English? Worse: What if I cannot predict if the items people will put on these menus are Hebrew or English? Should I try to distinguish the languages programmatically? And then do what? Or should I right-align everything, put the submenus on the left and be done with it?</p>
    <p>I'm confused.</p>
