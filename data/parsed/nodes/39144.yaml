    html: |-
      <p>My neighbors, who are not graphic designers, much less type nerds, but interested in the arts, saw it when it was shown at the Walker Art Center in Minneapolis. I happen to bump into them when I was out for a walk the next day. Knowing I'm a type designer, they stopped me to ask if I had seen it. They said they really enjoyed it and we stood there on the sidewalk talking about it for a good half an hour.</p>
      <p>It's very entertaining and accessible. If you're expecting some kind of dry historical survey you might struggle to stay awake through in an art history class, it's nothing like that.</p>
    html_clean: |-
