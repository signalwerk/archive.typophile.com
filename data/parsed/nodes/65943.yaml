  html: |-
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Nudgewink_5566.gif"></div><p></p>
    <p>I started goofing around with these letterforms after looking at a collection of early 60's rock 'n' roll album covers.</p>
    <p>Nudgewink's baseline bounces around randomly but if a cap glyph sets high, it's lower case will set low and vice versa. Each glyph has an alternate on the same baseline but with a different weight stress or attitude.</p>
    <p>With so many possible combinations, I couldn't figure out how to set up the code for a contextual alternate OT feature. So you have to go in and hand tune the thing. </p>
    <p>It's a bit of work but I have found that process fun to play around with.</p>
    <p><a class="freelinking external" href="http://www.p22.com/ihof/nudgewink.html" rel="nofollow">Check it out at P22.com</a><br>
    Here is the <a class="freelinking external" href="http://www.woodardworks.com/Nudgewink_Guide.pdf" rel="nofollow">PDF User Guide</a>.</p>
