      <p>Sorry, can't help it: the style of "DAUNTE" is right on, but the spacing is too uneven, and some of thin strokes (especially in the "T") are too thin.</p>
      <p>As for the script text: the names are idiosyncratic enough that you need extra legibility, and the style on the left is too out there. If you go with the style on the right, you just need more space on the left of the ampersand.</p>
      <p>hhp</p>
