      <p>I think options 3 and 4 are working better than 1 and 2. The problem I have with the overlap is that there isn't much overlap between the two lines of text, making the current arrangement a little unsure of itself. I'd suggest trying to accentuate the overlap so it becomes a real feature of the logo, or perhaps ditching it altogether.</p>
      <p>And agree with JamesM, you might have problems with reading the script letters as the logo gets smaller.</p>
