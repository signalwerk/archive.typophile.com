      <p>Thanks for your comments. So appreciated! </p>
      <p>Overall, what is your thought of using a script? We want a big contrast with the San Serif. I initially used a Goudy serif for contrast, but it didn't seem to have enough pizazz. </p>
      <p>I like the right side font better - it's Prosperity - however, I don't think the w is a good starting point to the names. It doesn't capture my attention and lead me along.</p>
      <p>What are your thoughts with the script and watermark? </p>
      <p>Attached below is Alana script. I like it's legibility, however feel it's too feminine. Thoughts? (Don't worry, I know spacings are off - these are just images copied from the font previews. Kerning is yet to come.)</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/typophile_6016.png"></div><p></p>
