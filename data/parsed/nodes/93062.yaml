    html: <p>Overall it's not bad. It seems that the top of your DAUNTE type has been cut off, that’s why the horizontal bar at the top seems too small, the bottom is better. I would redraw the DAUNTE typeface to give a more rounded look without the oblique cut on the /T/E. I don't think Alana script is too feminine but I would try an ampersand smaller as the one we find in the Minion italic. Keep going.</p>
