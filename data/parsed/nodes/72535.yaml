    html: |-
      <p>The project is going to be a little more involved than you expect, but is certainly worth doing. I've done a fair bit of this kind of thing.</p>
      <p>How I would work is to open your existing Type 1 fonts in FontLab, and first change all the character names to the correct names. For example, your "alpha" character is not currently named "alpha", because that won't work in Type 1 (unless you were working in something like TeX and wrote custom encoding vectors). Same for the ligatures, etc. etc. Happily, FL will change the names in your metrics file (.afm) automatically. If you don't want to lose all your kerning data, you'll need this as well.</p>
      <p>Now start a new file in FL, and cut &amp; paste the characters, bringing up all the appropriate "ranges" as Adam suggested. Once all the characters are in, generate the Unicode numbers -- FL has a pulldown menu that will do this. Then write off an AFM file of this new font. Next, in a text editor, open up the old Type 1 AFMs (the intermediate ones where the characters have the correct name), and move all the KPX data to your new AFM. Be aware that if any of the character names differ, you'll lose that kern pair when read into FL, and there will be no warning of that.</p>
      <p>Now read the new ("combined") AFM file with all the KPX data into your new "combined" .vfb. You still have some OT features to write, but when that is done, you can use the "generate kern data" in the OT panel to move your kerns into GPOS type of kerning.</p>
      <p>Depending on how many glyphs you have, this would take me 2-3 days for a roman and italic. I do everything by hand except renaming the characters in the old Type 1 files. (I use an old TeX program, AFAIK, no longer available. No doubt there are others.) You could probably program more of the needed work, but then you have to learn how to write and use the programs, which takes time too. It is probably easier to do it by hand for one set of fonts, or contract out the work.</p>
      <p>Do a couple smaller test files to learn how thing work.</p>
      <p>Once done, you will love it.</p>
