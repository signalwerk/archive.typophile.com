    html: <p>I think what you need is some sort of custom encoding. A good one to start with that has most of the character coverage you're looking for is the "FreeFont" encoding that comes with FontLab. Switch to the "Names" mode, then select FontLab &gt; FreeFont from the encodings popup. Once you've filled in the characters you need, you can create your own encoding based on that if you want.</p>
