    html: |-
      <p>Ken, </p>
      <p>if you install the demo version of *Fontographer 5*, then in your FontLab Studio encodings list, a set of seven new OpenType encodings will appear in Names mode. (The encodings are shared between the products and can be used in any of them). </p>
      <p>The new FontLab OpenType encoding files cover:<br>
      * OpenType Standard<br>
      * OpenType Latin Pro<br>
      * OpenType Latin Pro + small caps, oldstyle figures and other glyphs<br>
      * OpenType Latin, Cyrillic &amp; Greek Pro<br>
      * OpenType Latin, Cyrillic &amp; Greek Pro + small caps, oldstyle figures and other glyphs<br>
      * OpenType Latin, Cyrillic &amp; Greek WGL4<br>
      * OpenType Latin &amp; Cyrillic Asian</p>
      <p>Those encodings will also be integrated directly into FontLab Studio 6 which is under development. </p>
      <p>These encodings are very up-to-date (much more recent than FreeFont Pro), and you can use them as basis for developing/extending your own encodings. </p>
      <p>Best,<br>
      Adam</p>
