    <p>Hey Guys,</p>
    <p>The FL5 PDF manual states: "FontLab Studio 5 ships with a very extensive set of pre-installed default glyph template images" and that they "cover the entire Unicode 3.2 character set" but I'm unable to find them on my system on which FL5 is loaded.</p>
    <p>This sounds like exactly what I need to get started creating a Unicode font from multiple Latin and Greek fonts that we maintain for a client (created in Fontographer 4, used currently as Type1 fonts).</p>
    <p>Any ideas where I can get such a thing?</p>
    <p>Many thanks,<br>
    Ken</p>
