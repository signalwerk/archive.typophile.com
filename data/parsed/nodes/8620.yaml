  html: <p>i'm interested in professional opinions from the field, if the old dogma - a graphics designer has to have a mac - is still reasonable. i don't think so and strongly doubt that it's still worth spending almost twice as much money on your hardware, only to get a fancy design.  <br> <br>your opinions please!</p>
