    html: "<p>Hey no one used the \"mac are more beautifully designed\" argument yet ;-)  <br> <br>Anyways... <br>I'm (still) working on a Mac; and for 15 years I try to find enough rational reasons why I do so, but I think it's emotional ;-)   <br>On a pure rational basis I think PC's win: cheaper, widespread, better support, more goodies &amp; more compatible software... <br>I also work with PC/Windows, but it just doesn't appeal to me. Maybe just because so many people work with it?  <br> <br>My Mac (&amp; Apple for that matter): sometimes I hate them profoundly, but most of the time I find myself charmed by the way they work &amp; look. And perhaps it's (still) a kind of snobbism, but it gets my work done, and I love working with it. <br> <br>Mac versus PC or windows: it's a question of love! <br> <br>(now, where that shrink? ;-) )</p>"
