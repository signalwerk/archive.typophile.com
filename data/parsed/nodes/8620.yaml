    html: "<p>I've worked on a PC in the design field for over five years. The reason I switched was because the company I worked for was more web/programming focused, so we the designers needed switch to PC to work more efficiently. They wouldn't touch a MAC and I couldn't stand working on OS9. <br> <br>I guess I don't understand all the talk of PCs being unstable. Since I've had XP I have never had an all out crash and rarely do individual programs crash. I've learned to be safer surfing the web, using Firefox instead of IE and keeping my anti-virus up to date. <br> <br>The printers in my area take PC files at no extra charge and there have been no major issues with the turnout of the print runs. <br> <br>At my new job I am using a G5 running OSX 10.3 and loving it. (although I don't like that saving to the trash is an option...) I'm still not used to the font management on a MAC. I prefer the PC in that aspect. There really isn't a need for activating or deactivating fonts. They're just all there, all the time, with no slow-down on the machine. <br> <br>So now I'm split 50/50, work to home, on both PC and MAC. But I'd still buy a PC over a MAC simply because of cost and available programs (read: games)</p>"
