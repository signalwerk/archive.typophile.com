    html: "<p>\"On a pure rational basis I think PC's win: cheaper, widespread, better support, more goodies &amp; more compatible software... \" <br> <br>A lot of those are myths. <br> <br>Cheaper? Not so much. Even *I* was surprised about that. My wife needed a new Windows laptop, and I though \"hey, those have to be cheap\" and went out hunting. It turns out, feature-for-feature, the iBook is probably the best deals in laptops out there.  <br> <br>Widespread? I never use that as an argument. Wal-mart is widespread. ;o) <br> <br>Better support? No idea what that even means. <br> <br>More goodies + software? While that's true, I don't know if I'd call that a good thing. Whenever I need a utility for my PC, I need to dig through 10 crappy programs for every one good one I find. On the Mac side, it doesn't seem nearly that bad of a ratio.</p>"
