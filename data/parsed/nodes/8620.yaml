    html: <p>I have both and have used both since 1988. And they both have individual uses <br> <br>I have an Alienware Area51M notebrick with a kick butt 3.41Ghz processor, 1680x1055 res screen, that I use for Truetype development and web development. Use FlashMX and Photoshop for design, As a laptop it's faster than any desktop machine i've every used but weights about the same at about 9lbs without the battery. <br> <br>I just upgraded my Mac to a new Powerbook to replace the old Wallstreet powerbook mainly for photographic purposes. ILife, RAW NEFF format etc. and Mac font development, i.e. AAT, and website testing. <br> <br>I've used Flash, Fontographer,email, Photoshop, FontLab and just about everything on both platforms.   <br> <br>Unix on the Mac is an nice improvement but gee isn't it just going back to mainframe terminal commmand line developemnt again. And font developers use to complain about using MS-DOS tools on Windows now you have to use UNIX to do AAT.. I love it now!  <br> <br>My PCs the main font develpement machine and email machine.  <br> <br>My Mac is my Photographic machine, light small and nimble.  <br> <br>The new MacMini, isn't that just a barebones PC? So they are all just boxes in the end.</p>
