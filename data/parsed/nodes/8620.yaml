    html: "<p>I find Windows unstable, overly complex, and less friendly towards getting my job done. I use both platforms on a day-to-day basis, though not for the same purposes. I can run OS X 10.3 flawlessly for weeks, even if individual apps bomb occasionally. Apple also seems to be more integrated with PS/PDF. <br> <br>One could argue that I'm biased, but there's a reason I'm biased. Plus, if the majority of designers are on Macs, then it's easier to get help/advice from fellow designers. It's not a 'you must' situation, but the extra money is well worth it, in my opinion (and not because they're pretty). <br> <br>PS: Longhorn is vaporware that's about 1-2 years out (from what I've heard) at this point. Don't make any purchasing decisions based on MS's claims about Longhorn. This has been their strategy for over a decade: out-promise the competition, then under-deliver.</p>"
