    html: <p>I was once taught that "choose the best software to do the job right and then see what platform it happens to run on". Today much of the graphics software is available on both platforms and if you look at Adobe software with no feature difference (unlike the old version of Quark which didn't have ligature support on the PC). So if you just going to be running eg InDesign then it's probably a case of deciding which platform you happen to prefer – be in the OS or the shiny silver box. <br> <br>However, I think is an equally important consideration is what else is you computer being used for. For example, I am a typesetter based in Israel and although 95% of my work is actually English, I do get occassional Hebrew words thrown in or even work to be done in Hebrew. Since these files come in Microsoft Word (which is only available with Hebrew support on the PC platform) then I need a Windows operating system. True I could use an emulator on the Mac, but this is a consideration to be thought out. <br> <br>Or as another example, as a freelancer, my main computer also does everything else too including receiving and sending faxes to clients. I use a nice little program called Moony (<a href="http://www.emtec.com" target="_blank">www.emtec.com</a>) which handles all my faxes and also tells me which of my clients are calling me with a nice little pop up on my computer screen. Again I use another program extension in Outlook called Taskline (<a href="http://www.taskline.info" target="_blank">www.taskline.info</a>) which organises my todo list into my calendar telling me which jobs I need to do when and if a client asks me when a job should be completed by, then I can give them a real estimate. I have quite a few of these little extra programs that in my case happen to run on a PC making it a better choice for me, but could equally make the Mac a better choice for somebody else. <br> <br>Another very important consideration is technical support. If my PC should develop a fault, then I have my phone support immediately, and if necessary a technician over within an hour or two. In Israel the only Mac support is in Tel Aviv (I live in Jerusalem) and if a fault develops with a Mac then it can be a couple of weeks before getting it back. This is kind of a disaster unless you happen to have a spare Mac lying around. Again, this is a location-specific problem and I'm sure this doesn't apply to the majority of users out there. <br> <br>However, as a person who has used Mac and PC over the years, and a person that has migrated from Quark on the Mac to InDesign on the PC, I think it's about looking at the whole picture of your work environment to see what suits you. I highly specified PC is not cheap (probably a bit cheaper than a Mac), but long-gone are the days where graphics were only done a Mac.</p>
