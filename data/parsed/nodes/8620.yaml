    html: <p>Considering the charges that can pile up at a printer, I tend to want to deliver files that printers are most comfortable with and less likely to add charges for. That usually means Mac, although it seems that Adobe is championing the windows platform. <br> <br>I rarely look at my box. It is a tool. The difference in hardware cost is mininal part of the overall picture. <br> <br>Productivity and solid multi-tasking are higher with my dual G5 than ever before. That means printing and burning discs while large uploads are moving, and having apps open and working. No crashes. This is good.</p>
