    html: <p>I started on a Mac back in '92 when agencies were first starting to transition to using a computer...remember paste-up and mechanicals? From then until now, Macs have been a way of life for most designers. They ruled and rightly so. <br> <br>But now, it's truly emotional folks. I had to transition (kicking and screaming) into the PC world about 6 years ago. And guess what? The applications are what truly matter. <br> <br>I use a G4 with OS9, a G5 with OSX and a P4 with XP Pro -- all three have Photoshop, etc. -- and when I'm working inside an app, I could honestly *care less* which individual box I'm on at the moment. If a given machine has the horsepower, just load the app and start to work. <br> <br>As for print, Mac vs. PC used to be a huge issue, mainly with fonts and time spent on the RIP with PC files. It's all changed now. All the service bureaus we work with take PC files as well as Mac. And more importantly, we're sending new jobs via PDF -- which is eliminating any hassle completely. PDF is great for print jobs these days. <br> <br>I say, just try working on both, if you can, and make a decision. The cost of your working applications is really the biggest price factor. If your machine of choice can handle the apps that you want to use, and create the final files you need to work with others, just buy what ever you want and be happy with your decision.</p>
