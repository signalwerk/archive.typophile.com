    html: <p>For the most part, there isn't much of a difference between the two platforms with regard to the applications that are used. Most designers I know swear by Macs for their print jobs and PCs for their web/multimedia jobs. (Although that opinion varies depending on the end result and the application being used).  <br> <br>Having worked on both platforms, myself, I have less problems at the print house when I work on my Mac (as Chris pointed out). I have had problems with fonts and postcript files in the past. Printers seem happier/more comfortable to have mac files, too. In as far as support and upgrades go, and not being a techy of any kind, I can do everything myself. I can download and update and don't have to call any support people. I don't have to worry about system crashes. I don't worry about viruses or worms. Basically, buy a mac and hit the ground running. <br> <br>I teach at a college where all the graphic designers work on Macs. I teach 150 of them and those shiny silver boxes sure are pretty in the classrooms!  And Macintosh still seems to be the norm for this industry. If you think it's expensive, well, consider it an investment!</p>
