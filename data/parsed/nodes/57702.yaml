      <p>I agree with Michael. 'Typography' and 'Lettering' are separate entities. I think that portfolios call 'lettering' 'typography' because 'typography' has a sense of prestige imbued in it and 'lettering' sounds kind of kindergartner-ish. </p>
      <p>Using type as a model for lettering does not make 'lettering' 'typography', that would be a misnomer. I think the easiness/popularity of outlining type and manipulating causes one to forget that the process of manipulating individual letterforms is lettering.</p>
      <p>-Eric MacLeod</p>
