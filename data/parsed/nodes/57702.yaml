      <p>Lettering and typography can share some usage in that they both attempt to present letterforms constructed as language and are meant to help convey content. One is a one-time use, the other is a repurposing of a modular system of movable elements. To create lettering, it takes a different kind of skill than it does to compose type. Part of this is technical in nature and part of this is a combination of skill, talent, and craft. The lettering artist can apply his skills to also be a typeface designer. A typographer can do the same but has more to learn about form creation to be successful(given he has the talent). I purposely omit the mention of tools since they have varied throughout the history of both disciplines (lettering being much older as well). Anyone has to learn the tools of his trade but learning the tools does not mean they will be applied to good end. </p>
      <p>ChrisL</p>
    html_clean: |-
