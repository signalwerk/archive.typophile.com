      <p>@ Michael:</p>
      <p><cite>"Maybe it is like reading... we do not read individual letters, rather we read words. I guess what I am saying is look at the whole."</cite></p>
      <p>Actually, this has been put to rest within the scientific community. We do not read word shapes. We do indeed read individual letters to recognize words. The "parallel processing model," or some variant thereof, is by far the theory best supported by experimental evidence.</p>
      <p>Kevin Larson of the Advanced Reading group at Microsoft posted <a class="freelinking external" href="http://www.microsoft.com/typography/ctfonts/WordRecognition.aspx" rel="nofollow">a very concise summary of the theories of reading</a>, their experimental support, and references to all the studies on the Microsoft website. It is very illuminating on the subject....</p>
