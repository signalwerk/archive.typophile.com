      <p>I agree with Tiff. Lettering isn't typography, but that wasn't what was said originally; more that typography can include lettering, when you treat that lettering like type. Unless you're going to exclude everything that doesn't involve actual wood or metal type and bits of paper from the definition of typography, you're going to end up with a bit of uncertainty here and there. If I'm setting type on a computer, that's typography, right? What if I draw my own ampersand to go with it? I've lettered the ampersand, but now it's done I can treat it like type. Is the whole thing now lettering, or typography?</p>
      <p>Is this the <em>free will debate</em> of the alphabetic arts, or should we just decide when to refer to things as typo<em>graphy</em> or as being typo<em>graphic</em>?</p>
      <p>--<br>
      Aegir</p>
