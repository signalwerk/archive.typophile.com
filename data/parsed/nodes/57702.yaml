      <p>(I'll just carry on by myself here...)</p>
      <p>So, I'm looking up the etymology of "typography" and "type". It's definitely is related to "printing" and "striking". I'm definitely leaning toward the opinion that lettering is not the same as or part of typography. Unfortunately, I don't think we have a word for the category that includes both, but I think that's what a lot of people take "typography" to mean.</p>
