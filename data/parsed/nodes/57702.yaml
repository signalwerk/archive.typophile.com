    html: |-
      <p>Tiffany, you're right, the letters are sculptures themselves. The key thing is whether you are building with 'prefab' letters--type--or sculpting the whole thing from scratch. </p>
      <p>As usual, from scratch you have more flexibility and can do some amazing things, but it is hugely time consuming. Didn't Stanley Morrison say something about the whole thing about type being in 'multiplication'? And I think Matthew Carter always emphasizes that his core challenge is to make his type work beautifully when people have to throw a lot of it into a magazine or newspaper quickly, on deadline. </p>
      <p>I think the only book that is hand written anymore is the Torah, but then the scribes think God demands it :)</p>
      <p>Van Krimpen wrote somewhere that he didn't see the point of setting advertisements in type, because they could always be lettered better. He just left out the part about being better lettered by *him*. </p>
      <p>Type is the first "modern convenience".</p>
