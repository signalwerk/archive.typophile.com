      <p>Very late to the party, but I've been following this intermittently during a hectic week...</p>
      <p>Along the lines of William's analogy:</p>
      <p>Lettering is to typography what clay is to Lego™.</p>
      <p>Also:</p>
      <p>Lettering is to typography what illustration is to clip art.</p>
      <p>These two analogies capture a lot of the differences in my mind. Also, I would include calligraphy in the same category with lettering. They are different, but in relation to typography I would group them together.</p>
