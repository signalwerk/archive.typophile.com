      <p>I'm all for permissive rather than prescriptive use of language. Most of us here know what we would call typical, unambiguous examples of typography or lettering. Then there are all sorts of borderline cases as beautifully illustrated above. The disciplines have influenced each other plenty since the invention of type. With technological advances type is more and more able to imitate lettering, and in turn lettering may be used as elements in a typographical treatment.</p>
      <p>As Miss Tiffany has pointed out, typography is itself a broad term, so there's more room for confusion. I think rather than try to rigorously define the terms for all situations, we should clarify what we mean by the different terms only when the need arises, and even then concede there are nebulous areas.</p>
    html_clean: |-
