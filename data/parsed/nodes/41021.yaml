    html: |-
      <p>This is a nice piece of sign painting, done by hand, not from a typeface, and I have admired it many times on my way back to the East Bay on I-80. You can find similar forms in <a href="http://letterheadfonts.com/fonts/bostontruckstyle.shtml" rel="nofollow">Boston Truckstyle</a>.</p>
      <p>For the "the" script, have a look at <a href="http://www.fontshop.com/fonts/downloads/elsner_flake/ballantines_script_1_ot/" rel="nofollow">Ballantines</a> and <a href="http://www.fontshop.com/fonts/singles/itc/itc_edwardian_script_bold_alternate/" rel="nofollow">ITC Edwardian Script</a>.</p>
