    <p>I apologize before hand if this isn't the right place for this question. I was asked by a friend to design a logo for his girlfriend's handmade jewelry company. The logo needs to reflect femininity, luxury and taste. But I also want it to have a slight whimsy to it as these are handmade pieces. I'm looking for a delicate, airy typeface (possibly a hand drawn style). I have a sample below.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/miette_logo_3833.gif"></div><p></p>
    <p>If anyone can suggest any typefaces or move this topic to the correct board, I would be most grateful.</p>
