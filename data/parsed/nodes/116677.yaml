      <p>Good research Dick.<br>
      The original name could be Oriente -- at least this is the name for the font as shown in Jaspert's _Type Encyclopedia_ -- for this Victorian flourished script.<br>
      As for who did the original digitization of it, that's a good question.<br>
      Don</p>
