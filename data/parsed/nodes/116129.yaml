    date: 2014-04-28T18:20:00
    date_raw: 28 Apr 2014 — 6:20pm
    votes: null
    html: <p>I like the swashbuckle effect, as if Errol Flynn traced a light photo with the tip of his sword. The reflection is troublesome because it invites Rorschach-type search for meaning. It depends on what sort of designs you are selling whether to try to improve the reflect, for example by squeezing everything into a dense filigree..but problems could multiply if not handled properly.  How about keeping just the two circular shapes in thick lines and delete the rest . Then somehow box it in with the company name in clear Roman capitals? That would look sporty and elegant, and suggest wind-blown scarves.</p>
