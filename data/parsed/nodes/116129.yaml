    html: <p>I'm afraid it has fallen into that awkward gap between "This is purely an ornament" and "Are these words? To read?" Without knowing the font, as far as I could tell, you'd devised an elaborate ambigram of something like "Ganlers SkymnaxQ". After looking up San Remo, I identified the letter T, but the general intent is not much clearer.</p>
