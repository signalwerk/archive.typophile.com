      <p>Agree with cerulean, it's not readable as a company name.</p>
      <p>It could work as an abstract symbol representing your company, maybe even as a pattern on scarves, but you'd need to spell out your company name nearby if you want people to know the name. In the symbol be sure to use line weights that don't disappear when the logo is reproduced is a tiny size.</p>
