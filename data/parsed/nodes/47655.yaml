      <p>Even though it was supposed to just be a joke on "Narrow", depicting Arial as ignorant trash was a nice coincidence.</p>
      <p>The real Futura would be a slim German in a black turtleneck and little round glasses. Comic Sans would be a drunken middle-aged woman with an annoying laugh trying to sell homemade crafts. Since he was mentioned, I picture Zapf Dingbats as a cheerful portly man with a handlebar moustache wearing a monocle and bright purple tuxedo with white gloves, communicating entirely in mime.</p>
