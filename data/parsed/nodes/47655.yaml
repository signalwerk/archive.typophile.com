    html: |-
      <p>A former student of mine sent me this when it first came out.  My first curiosity was wondering what typefaces they chose.  When I saw the selection I knew that the director or writer's only knowledge of "fonts" came from Microsoft Word.  All the chosen faces are readily available and constantly mangled by the PC users of the world.  Obviously the target for the piece was those very users, not designers.</p>
      <p>I'm curious what it would have looked like and how inside the jokes would have been had it been written and produced by true typophiles.  Not to mention the palette of faces.</p>
      <p>Not type related, but if you've never seen the first couple of installments of "Truth in Advertising" you'll appreciate the industry inside humor: <a href="http://www.youtube.com/watch?v=j50Xd40EfJg" title="http://www.youtube.com/watch?v=j50Xd40EfJg">http://www.youtube.com/watch?v=j50Xd40EfJg</a>  Beyond episode two the joke wears thin.</p>
      <p><a href="http://typographyshop.com" title="http://typographyshop.com">http://typographyshop.com</a><br>
      <a href="http://kinggroupmedia.com" title="http://kinggroupmedia.com">http://kinggroupmedia.com</a></p>
