  html: "<p>When I try to generate a new opentype font, the menu window \"font format\" doesn't work: it shows me, instead of \"PC TTF\", \"Opentype\", \"Fontlab file\", sometime a list of \"-Bold, -Regular, -Italic\", sometime a wrong list, some other time the right list, but I can't choose any option.  <br>The problem is that not only the name are wrong, but I can't choose the file format to generate a font (and so I can't generate a font!!!!!).  <br>I tried to erase the preferences and to reinstall the program, but nothing changed. I created a new user and everything works, but, after a short period, the problem starts again.  <br>I changed computer, everything worked, but after two weeks the problem started again.  <br>I can't create a new user or change computer every 2 weeks.  <br>What happens? What I have to change to recover my fontlab? There is any preference outside the prefences files in the \"preferences\" folder (\"FontLab 4 Toolbars\" and \"com.fontlab.fontlab4.plist\")?  <br>Do someone know what to do?</p>"
  html_clean: "<p>When I try to generate a new opentype font, the menu window \"font format\" doesn't work: it shows me, instead of \"PC TTF\", \"Opentype\", \"Fontlab file\", sometime a list of \"-Bold, -Regular, -Italic\", sometime a wrong list, some other time the right list, but I can't choose any option.  <br>The problem is that not only the name are wrong, but I can't choose the file format to generate a font (and so I can't generate a font!!!!!).  <br>I tried to erase the preferences and to reinstall the program, but nothing changed. I created a new user and everything works, but, after a short period, the problem starts again.  <br>I changed computer, everything worked, but after two weeks the problem started again.  <br>I can't create a new user or change computer every 2 weeks.  <br>What happens? What I have to change to recover my fontlab? There is any preference outside the prefences files in the \"preferences\" folder (\"FontLab 4 Toolbars\" and \"com.fontlab.fontlab4.plist\")?  <br>Do someone know what to do?</p>"
