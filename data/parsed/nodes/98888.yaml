      <p>Wow.</p>
      <p>I wonder if all ambidextrous people have such a latent ability.</p>
      <p>And notice something else: she's constantly looking at both texts - reinforcing the view that writing rotated text (like when lefties are forced to emulate the right-hand broad-nib model) is bad for you.</p>
