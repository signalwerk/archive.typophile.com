    <p>Hello,</p>
    <p>I am designing a font with stylistic features but when I use it in the glyphs window in Illustrator, my alternate glyphs appears one after an other. But when I use some other fonts, a menu appears when alternative glyphs are available.<br>
    I don't really understand what I am doing wrong. Is it some kind of opentype feature that I am not doing right in Fontlab ? Any help would be much appreciate :)<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/menu_5693.jpg"></div><p></p>
