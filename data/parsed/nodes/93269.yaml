    votes: null
    html: |-
      <p>Where in the glyph window an alternate will appear depends on the order of glyphs within the font file.</p>
      <p>The menus you see rely on the 'aalt' feature. This should be present if you want alternates to be presented in the glyph palette.</p>
      <p>André</p>
