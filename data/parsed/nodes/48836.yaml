    html: |-
      <p>Eric,</p>
      <p>No need for an apology. I had no problem with anything you said. I agree with you. I was just trying to explain the difficulties of huge corporate institutions and how they are more a collection of disconnected parts rather than a dynamic whole acting with united reasoning. In the cases of both Microsoft and Adobe, the type groups are perhaps the least powerful forces of their respective corporations. They do battle internally with both bean counters and application groups who get much more attention from the CEO and board of directors then the few type geeks trying to explain their case.<br>
      I really admire guys like Thomas, Eric, Miguel, and Si for their dedication and continued effort on behalf of typography in the face of internal pressures from other sectors of their companies.</p>
      <p>ChrisL</p>
