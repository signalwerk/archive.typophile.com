    html: |-
      <p>Microsoft was and is a major partner in opentype development and has been at the forefront of creating opentype standards. Microsoft, for business reasons, has avoided full support for opentype features in its applications. Perhaps the assumption is that anyone interested in true typographic sophistication, would not be using a word processor for publishing. It may even be assumed the the greatest percentage of Office users don't even know what the finer points of opentype typography are or even care to know, for that matter. The bottom line is, would they sell any significant amount more copies of MS Office after full opentype support than they do now without it? If there is no perception of increased profit, then there is no need to pursue development time and costs to that end. MS Office is almost the only show in town now. Why would Microsoft spend more on development than they can recoup in profit? Johns question even proves the point that the few customers who want opentype sophistication in typography for Office already own Office and don't even blame Microsoft for being lax in support of OT features.<br>
      Adobe has the other share of the market--those professional publishers and designers who need typographic sophistication to do their work. A better question is to ask Adobe why their support for OT is inconsistent among their applications (at least the interface) and why one-for-many substitutions are yet to be supported? This is another case of internal struggle. You can be sure Thomas and Miguel would love to see it but they are in the Type group, not the CS Development group so they have no say in the matter (I'll bet they have tried like crazy though to have a say!)</p>
      <p>ChrisL</p>
