      <p>Chris,</p>
      <p>I apologize; I didn't mean to imply that I think Microsoft has an obligation to include OpenType support in MS Office. I do realize that Microsoft played a huge role in the development of OpenType. I was more suggesting that John's beef with OpenType is unmerited, because if we want OpenType support in word processors, then it is up to the developers of those programs, not to the creators of OpenType fonts.</p>
