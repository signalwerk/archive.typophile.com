    html: "<p>In my case, I am a book designer. I work for a dozen or so publishers in NY, Boston and SF. Very often an editor or art director will send a jpeg of some book saying, \"we like this font\" but often they don't know what it is. In other cases I see something I think will come in useful and this is just a great way to find out. So that's what happens at my end. PS: I wanted to post an image by my name but I don't know how.</p>"
