      <p><em>Just how big is Typophile?!</em></p>
      <p><strong>“Thanks isn’t a big enough word”</strong>—-<a href="https://web.archive.org/web/20080907045021/http://typophile.com/user/3775">Sharon Van Lieu</a></p>
      <p>What about our readers? How many read Typophile?</p>
      <p>To measure Typophile by its other axes:</p>
      <p>1) How “inconcievably cool” is Typophile?<br>
      2) How credible is Typophile?<br>
      3) How remarkably civilized is Typophile?<br>
      4) How far has Typophile come?<br>
      5) How “immensely clever” is Typophile?<br>
      6) How much thwacking good fun is Typophile?<br>
      7) What feature do you “most like” about Typophile?<br>
      8) How many Typophiles own a cat?</p>
      <p>“m e w” &nbsp;j a m e s</p>
