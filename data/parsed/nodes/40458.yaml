    <p>Until recently I hadn’t really thought much about how large our “little” community was. </p>
    <p>I recently joined both the <a href="https://web.archive.org/web/20080907045021/http://www.facebook.com/group.php?gid=2391073772">Facebook</a> group and the <a href="https://web.archive.org/web/20080907045021/http://www.flickr.com/groups/typophile/">Flickr</a> group. The first of which has about <em>240</em> members (at the time of this post) and the other <em>516</em> (also at posting time.) </p>
    <p>It raised a small question in my mind... <strong>Just how big is Typophile?!</strong></p>
    <p>Anyone know or want to give your guesstimate? Should Typophile have a resolution to expand (or contract?) By the way, I don’t have any control over anything Typophile does, I just thought it would be an interesting question.</p>
    <p><em>This is shameless, but feel free to add me as a Facebook friend</em></p>
