    <p>I'm trying to figure out what font was used in the marking of Velvia (RVP) film. It was made by Fugifilm and the specific type is RVP 100. </p>
    <p>I've found a couple fonts similar but nothing exact. </p>
    <p>I'm also interested in how they actually printed the letters and numbers on the film if that is discoverable. </p>
    <p><a class="freelinking external" href="http://www.crispyhundos.com/wp-content/uploads/2011/04/Mott-Street.jpg" rel="nofollow">Link</a></p>
