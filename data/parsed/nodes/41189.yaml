      <p>Ha, right. And sometimes my multi-tasking skills result in not quite finishing a task. It’s an approx. 200 page book of short(er) stories (same author) which will have black and white illustrations through out. It sounds like there will be approx. 30 illustrations in total, however they will be contained to a separate page from any of the text so manuscript will be a solid block of text. The dimensions are a little bit more squat then what I’m use to working with (at lest for this company). I’ve never thought to ask this forum for examples or suggestions before, would love some hints on how people come to their margins. </p>
      <p>Thanks for asking Miss Tiffany.</p>
