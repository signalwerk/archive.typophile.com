    <p>Hi!<br>
    I’m kind of new to the book design business, I’ve done three books up to date, and I am still flirting with the process of creating an attractive and logical margin. I am now working on a new book with the slightly odd dimensions of 5 7/8 x 7 1/2. I was wondering if anyone had any suggestions of well done books in this size, or margin sizes they would recommend!!!<br>
    Thanks Guys!!<br>
    M.</p>
