  html: |-
    <p>This may be old news, but since I’m rather fresh in this business I can’t stop getting upset everytime I see free copies of quality fonts. I mean it’s just to browse some of the free fonts sites, and it wont take any more than a minute until you find a lot of well known fonts with a new name!</p>
    <p>Shouldn’t it be a good idea if there was an easy way to report these crimes to the right person who can take action immedietly?</p>
    <p>Maybe a list of names and e-mail adresses to the right person at the Foundry that have released the original font, or their legal department. Or some kind of organisation protecting "our rights". Well, I dont have the recipy for that but the whole thing bugs the hell out of me.</p>
    <p>I hate to see ony of my future fonts as a free download at one of these stupid website. And there a lot of them out there.</p>
    <p>Cos, if actions are taken harder, maybe some of these free sites will shut down for good or at least keep a better control of what kind of fonts are submitted there by pirates.</p>
    <p>Or is it just a dream? Is it impossible to stop?</p>
