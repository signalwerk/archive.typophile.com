      <p>"Is it impossible to stop?"</p>
      <p>Yes.</p>
      <p>Also, I don't know if I'd call this piracy. That typically involves an entity specifically profitting from your work. This is more akin to patent/copyright infringment.</p>
      <p>The easiest way to stop that is to just whip off an email to the offending sites web hosting company.</p>
