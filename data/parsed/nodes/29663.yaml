    html: |-
      <p>Although it's not worth getting too angry and not possible to do much legally, one thing that can work is bypassing the formal/legal system and leveraging human decency instead: alerting the people distributing the illegal font, and suggesting they please pull it. Often they have no idea, and sometimes they do but just need a little nudge (but not threats - that backfires pretty much every time). This is preferably done by the "owner" of the font (as long as they don't get too emotional) so I think the idea of having a list of specific people to contact at the various foundries/houses has merit.</p>
      <p>hhp</p>
