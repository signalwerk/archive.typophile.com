    html: <p>There are plenty of easy ways to report copyright crimes. But unless the person being reported is selling large volumes of discs full of thousands of fonts, and unless the companies that made the fonts want to cooperate with law enforcement and criminal prosecutors, nothing is going to come of it. Of the criminal acts that occur in the world on a daily basis, font piracy is one of the least heinous, and law-enforcement types have bigger fish to fry.</p>
