    <p><a href="http://typophile.com/node/90115#comment-495970" title="http://typophile.com/node/90115#comment-495970">http://typophile.com/node/90115#comment-495970</a></p>
    <p>Replying to a post by a dead person benefits<br>
    from knowing that the person cannot reply.</p>
    <p>Finding out after the fact that the person<br>
    you replied to is dead is disconcerting.</p>
    <p>So I think we need a way of marking usernames<br>
    of dead people; and their profile should show<br>
    the date of death.</p>
    <p>hhp</p>
