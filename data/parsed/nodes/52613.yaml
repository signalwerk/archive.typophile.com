      <p>Yes, perhaps. However I'm always concerned with readability when it comes to ambigrams. Actually I'm concerned with the letterforms working as they are now...maybe after they are fully completed I can try the ambigram.<br>
      It came out this way because I started with the 'a' and designed the other letterforms based on the 'a'. Is this the appropriate way to design letters?</p>
      <p>JonE.</p>
