    <p>Hey everyone! I thank you in advance.</p>
    <p>I'm  designing a logotype for a local jeweler. His previous identity was old english/blackletter typography of his name 'Mathew'. After a brief with him, we decided to keep some of the style of the logo, in particular, the authoritative/established look and feel that blackletter typography represents to him. (trust me I tried to stray away, however without any success). Another thing he wanted, since he loves old school art &amp; design, is a mixture of what he had with a modern AND retro touch. Quite a hard task.</p>
    <p>So what I'm doing is designing custom letters with a hint of blackletter and retro inspiration. Please feel free to rip this up as its the first draft and the first time I try to design letters from scratch with such a broad design range.</p>
    <p>Thank you,<br>
    JonE.</p>
