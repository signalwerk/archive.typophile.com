  html: |-
    <p>For a few years now, type designer extraordinare Christian Schwartz has been allowing Pinball Publishing to use his fonts, often pre-commercial release, for their literary journal eye~rhyme. Any of the volumes are a nice addition to your typographic library, as well as being well-written compendiums of short fiction and poetry. The latest one utilizes Schwartz's Luxury for the headlines. Take a gander here:<br>
    <a href="http://pinballpublishing.com/" title="http://pinballpublishing.com/">http://pinballpublishing.com/</a><br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/32_large_6275.jpg"></div><p></p>
