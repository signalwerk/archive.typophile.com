  html: |-
    <p>I need to render a tagline for a healthcare client in an informal font but don’t want it to look (a) childish; or (b) handwriting; or (c) cartoon (eg Comic Sans!)</p>
    <p>I want it to be soft, personable, approachable, warm, serious not flippant but not too formal.</p>
    <p>Appreciate your help!</p>
