      <p>Typefaces in the US can not be copyrighted, not since the 19th century. You can digitize whatever US metal typefaces you like. Haven't all the major and minor digital type foundries? Only thing you have to worry about is registration or trademark licenses that may still be valid. And most of those protect stolen property. Nice industry.</p>
      <p>Gerald</p>
