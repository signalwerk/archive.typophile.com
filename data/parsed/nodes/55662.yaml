    html: |-
      <p>@piccic The term is a bit of a misnomer, as all the typesetting (what really makes letterpress) is done in the program of choice, using whatever digital typefaces are on hand. Graphics can be added, the whole thing is exported to .eps or .pdf and made into photopolymer plates which are then mounted on a type high base and printed using old presses that would otherwise go unused.</p>
      <p>My thinking was: since I own these typefaces, for example News Gothic in 10pts, in their original castings, which all pre-date microcircuitry, I should have some right to digitize it myself provided I don't try to rebrand or sell it. Otherwise I'm just stuck with 15lbs of News Gothic in 10pts.</p>
