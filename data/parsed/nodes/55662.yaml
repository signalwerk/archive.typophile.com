    html: |-
      <p>Besides, you could end up with a more interesting digital version than the ones around, like what Metallophile by Mark Simonson does to (digital versions of) Spartan.</p>
      <p>I'm not saying that irregularity should be the norm, but often digital versions totally lack the warm appearance and consistency of metal ones, especially at small sizes, but this largely depends on the design itself.</p>
      <p>Personally I am not at all satisifed by all current Gill Sans versions on the market: too little spaced, mostly without any optical size versions, disregarding its original conception.<br>
      Even the Monotype "Pro" version of which I licensed a weight is so tightly spaced you should manually space it to set small point sizes.</p>
