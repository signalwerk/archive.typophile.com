    <p>I have a couple cases of old metal type, usually only in one size, that I rarely use having moved to digital letterpress for its flexibility.</p>
    <p>I was wondering if there was any problem with digitizing what type I have for personal use (that is to say I wouldn't be selling it).<br>
    My gut tells me there isn't a problem, but in these sort of cases I'm almost always wrong.</p>
    <p>Thanks,</p>
    <p>jr</p>
