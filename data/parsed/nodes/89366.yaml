    html: |-
      <p>Thanks for that marcox. I think I had pretty much come to a similar conclusion myself. Now that I look again, there unmodified DIN elsewhere on the page, but the 'Q' in the unicase had thrown me before.</p>
      <p>I came across Designal. A nice face, altogether. I'm ideally looking for something similar but it's crucial that it has regular, italic, bold, and bold italic fonts so itself that's a no-go. Any other suggestions along the same lines would be welcome, otherwise I'll keep scouring or just lump it and find a different angle to work from!</p>
      <p>Cheers</p>
      <p>Cyrus</p>
