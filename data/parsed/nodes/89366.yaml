    <p>Hello folks,</p>
    <p>Attached is an image taken from some publicity material belonging to the Cité de l'architecture et du patrimoine in Paris. I believe they use the same for their signage. I'd be grateful for an ID -- I suspect this may be a custom face, but here's trying anyway.</p>
    <p>Cheers</p>
    <p>Cyrus</p>
