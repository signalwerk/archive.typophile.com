      <p>I don't read the Georgian language, but I have made a Georgian typeface so am familiar with the sounds of the letters and the difference between the various styles. Most of all I'm familiar with what vertical proportions work, which is a typical stumbling-block (see the faulty Georgian in Sylfaen for a textbook example of this).</p>
