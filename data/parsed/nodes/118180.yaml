    <p>I recently picked up a small booklet of "Intertype Gothics" that shows two sizes (36 pt. and 42 pt.) of a face called "Spike Gothic."</p>
    <p>Can anyone give me more information about it? I've never seen it before and would like to know more about it. Any digital versions? A quick Google search didn't turn up anything.</p>
    <p>Thanks!</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/SpikeGothic_4601.JPG"></div><p></p>
