      <p><em>Nick, 'defensive of the past' doesn't imply reactionary to me.</em></p>
      <p>As I am sure it would not, given that you insist that the Taliban are postmodernists. <em>Au contaire, mon frère</em>: the Taliban are most assuredly pre-modernist, pre-industrial, pre-Enlightenment, pre-Renaissance—in other words, staunch seventh-centuryists.</p>
      <p>And, really: while Bodoni is classified as a modern style, historically it’s simply a misnomer (although, stylistically it is not). As T. S. Eliot pointed out:</p>
      <blockquote><p>These fragments I have shored against my ruins<br>
      Why then Ile fit you. Hieronymo’s mad againe.<br>
      Datta. Dayadhvam. Damyata.</p></blockquote>
      <p>Modernism, essentially, deals with a world in which God is dead (so said Fred) . The Great War, the War to End All Wars (along with the Bolshevik Revolution) killed off the last of the significant Divine-Right monarchies (we still allow them to exist, of course, in places like Saudi Arabia, where it’s convenient for us). Eliot examined the world with words in the same way that Picasso and Braque examined it in cubist planes—fragmented, isolated, incoherent without a center…</p>
