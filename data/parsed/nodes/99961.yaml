      <p>Nick: <em>...the Taliban are most assuredly pre-modernist, pre-industrial, pre-Enlightenment, pre-Renaissance—in other words, staunch seventh-centuryists.</em></p>
      <p>These are the things that the Taliban want to believe that they are: restorers of a pure past. But the past was never pure, and in pursuit of their goals the  Taliban use surface-to-air missiles, automatic assault rifles, and mobile phones. The other thing they use that never existed in the past they think they are trying to restore is totalitarian politics. Pre-modern and pre-industrial life does exist in Afghanistan, but it has nothing to do with the Taliban: it subsists at the local level, in complex social relationships of tribe, clan and family. The organisation of the Taliban, by contrast, is that of a modern militant revolutionary movement. I call the Taliban postmodern because they construct a filtered fantasy of the past in reaction against an inescapable modernity, one that they must embrace in order to be effective. I call some of my ultra traditionalist Catholic friends postmodern for the same reason; they don't like it either.</p>
      <p>On the origins of modernism, you and I seem to be mostly in agreement.</p>
