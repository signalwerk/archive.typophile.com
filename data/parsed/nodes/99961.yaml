      <p><em>something Modernism is too superficial to grasp</em></p>
      <p>I think your grasp of modernism is too superficial. Modernism is a large and complex matrix of cultural phenomena, some of them apparently at odds with each other in every respect except a sense of being responses to modernity. Modernism manages to encompass both critical engagement and ideological prejudice, and everything from the most formally gridded layout of high international style to the almost painfully disfocused paintings of my beloved David Jones (<a href="http://www.allartnews.com/wp-content/uploads/2011/11/David-Jones-1895-1974-Mehefin-1949.jpg">now <em>there's</em> uncertainty</a>).</p>
      <p>Postmodernism can also also, of course, be read as a response to modernity, although characterised by a contrary stance, be it irony, decadence or reaction, and in that most perfect of postmodern phenomenon, the Taliban.</p>
    html_clean: |-
