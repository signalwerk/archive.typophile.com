      <p>The Bringhurst system links type design styles to broad cultural movements in the arts, organized in historical sequence. More phyllogenetic than taxonomic.</p>
      <p>According to that precept, it misses out the large Historicist movement from 1900 to 1930, during which type revivals and designs in historical genres predominated, especially in the Anglosphere. Examples:</p>
      <p>Cloister: Morris Benton’s facsimilic revival of Jenson’s 15th century design.<br>
      Kennerley; Frederic Goudy’s pastiche of the Garalde.</p>
