      <p>Nick: <em>If you try to identify Postmodern typefaces independently of such movements, purely on physical characteristics, you run into trouble...</em></p>
      <p>Indeed. That's why I find the postmodern classification mostly unhelpful except for a handful of works, such as Makela's Dead History, whose association with postmodernism is explicit in the intent of the designers. Intentionality plays a bigger role in postmodernism than in most previous cultural movements, which can be identified by stylistic characteristics; this is why there tended to be a strong conceptual component to postmodern art.</p>
