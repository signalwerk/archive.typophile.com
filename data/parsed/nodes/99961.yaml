      <p>I don't disallow nuance. Nuance permeates everything. But progress is based on clarity, and there is clarity to be had by trying to figure out the essence of something (and that's as Modernist as I want to get :-). And I would immediately counter that with a Postmodern expression: I know I'm Wrong; or at least, I know I can't be Right. I'm an Agnostic through and through.</p>
      <p>If I can manage, I'll try to relate all this to the practice of designing type. What I'll put forth somewhat casually though is this: it's hard to know how and how much to "let go"; that's why virtually all Postmodern type is so junky (unusable for text). But there are exceptions, such as Fedra.</p>
      <p>hhp</p>
