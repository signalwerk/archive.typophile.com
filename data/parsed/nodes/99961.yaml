      <p><em>figure out Justin's framework for including Archer in there</em></p>
      <p>I try to avoid postmodernism as a category, in part because it is by its own nature fragmented and without clear edges, but I can imagine classing Archer in this way because of its interpretative stance to 19th Century slab serifs. But then one would have to put virtually all recent fonts with any historical reference into the same grabbag.</p>
      <p>I think Evert Bloemsma was very much a modernist, of a particular kind (my favourite, nonconformist kind), in his interest in functional methodology and lack of satisfaction with any merely stylistic innovation. While some modernists rejected serifs because they didn't correspond to a 'modern style', Evert worried about serifs and wanted to know why they might be there and how they might function (leading ultimately to FF Avance).</p>
