      <p>Nick, 'defensive of the past' doesn't imply reactionary to me. Reactionary politics generally focus on maintaining existing power structures or providing (pseudo)historical justifications for new power structures, which actually involves disengagement from the past insofar as such politics discourage questioning of how the existing power structures came about, what alternatives existed in the past, what kind of opposition existed, etc.. Hence the etymology of the word 'radical', in questioning the roots of existing structures.</p>
      <p>Reactionaries are perfectly capable of being postmodernist, as the Taliban demonstrate, although they generally don't recognise and certainly don't acknowledge their postmodernism. To construct a fantasy of a past that you intend to 'restore' is not to be defensive of the past.<br>
      _____</p>
      <p>Hrant: <em>Maybe they're too defensive?</em></p>
      <p>Maybe they've been brainwashed by shape-shifting lizards. But, really, what is more likely?</p>
      <p>You pick up a term that has common usages and refers to a complex set of phenomena, and you redefine it for yourself to mean something incredibly blunt and simplistic, in a way that really only permits agreement or disagreement, and then you accuse other people of being defensive when rather than agreeing or disagreeing they question your appropriation of the term in this way. The irony, of course, is that your use of the term modernism in this way is itself over-certain and controlling, disallowing nuance and the uncertainty that must allow the possibility that you are wrong.</p>
    html_clean: |-
      <p>Nick, 'defensive of the past' doesn't imply reactionary to me. Reactionary politics generally focus on maintaining existing power structures or providing (pseudo)historical justifications for new power structures, which actually involves disengagement from the past insofar as such politics discourage questioning of how the existing power structures came about, what alternatives existed in the past, what kind of opposition existed, etc.. Hence the etymology of the word 'radical', in questioning the roots of existing structures.</p>
      <p>Reactionaries are perfectly capable of being postmodernist, as the Taliban demonstrate, although they generally don't recognise and certainly don't acknowledge their postmodernism. To construct a fantasy of a past that you intend to 'restore' is not to be defensive of the past.<br>
      _____</p>
