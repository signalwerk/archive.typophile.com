      <p>The archetypal Postmodern typeface is P. Scott Makela’s <a href="http://www.moma.org/collection/browse_results.php?object_id=139317">Dead History</a>, 1990.<br>
      He used a strategy already common in postmodern architecture, mashing up two or more established styles—in this case speciﬁc typefaces, Linotype Centennial and VAG Rounded. </p>
      <p>At the time, Postmodernism and Deconstruction were part of a new movemement in the graphic arts.<br>
      If you try to identify Postmodern typefaces independently of such movements, purely on physical characteristics, you run into trouble, because so many types would ﬁt the description, for instance display types of the 19th century such as the Caslon Italian of 1821, clearly a deconstruction of the Didone/Modern style:<br><img src="/sites/default/files/old-images/Italian_5965.png"></p>
