      <p>Hrant, post-modernism is mostly associated with a kind of filtered engagement with history, and is most often applied to a kind of fractured movement in art, architecture and criticism that is essentially over. I wouldn't classify any recent type designs as post-modernist, and certainly not Legato or Fenland.</p>
      <p>Good suggestion of Kis for the Baroque category, though.</p>
      <p>Jannon's types are tricky: they're transitional between the French renaissance style and the Baroque that flowers in the Netherlands. Mannerist?</p>
      <p>BTW, a case can be made for considering some Fleischmann and Rosart types are representative of the Rococo sub-category of Baroque.</p>
