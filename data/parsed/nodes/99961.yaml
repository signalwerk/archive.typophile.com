      <p><em>I define Modernism as believing in and seeking Control.</em></p>
      <p>Which describes pretty well said Taliban, whom I classify as postmodernist because they pursue a filtered engagement with the past to produce a new reality that never existed in that past.</p>
      <p>Your definition of modernism simply doesn't hold with the range of phenomena to which that term is normally applied. So in what way does this enable talking practically about anything? Have you not noticed that in all these years you've never managed to have a successful conversation with anyone on the subject of modernism? All you've ever achieved is exactly this kind of wrangle over terminology. The actual phenomena of modernism always escape your discussions. </p>
      <p>It's not as if we're a million miles apart in terms of criticism of particular modes of modernism, of particular phenomenon within modernism. If you want to say 'There are kinds of modernism that evidence an obsession with control and with uncritical certainty', I'll agree wholeheartedly. But there are also kinds of modernism that are cautious, nonconformist, analytical and even defensive of the past.</p>
      <p>I am far from being a modernist, but further still from being a postmodernist. As I said, the stances of postmodernism to the past are all in varying ways contrary. At its best, postmodernism proceeds from an honest appraisal of the difficulty of having any kind of sympathetic relationship to history, but all to often it sinks into ironical poses, and mere stylistic cherrypicking.</p>
