    <p>Hi, I'm need of some help in identifying 5 specific typefaces per each of the following categories (listed in CAPS). I've also listed typefaces I believe to fall under these categories. Could you help me round out my list? -- Or correct me if I have them mislabeled?</p>
    <p>(See attached for the specific guidelines of these classifications I'm using)</p>
    <p>RENAISSANCE:<br>
    bembo<br>
    hoefler text<br>
    arno<br>
    cardo<br>
    volkorn</p>
    <p>BAROQUE:<br>
    garamond<br>
    georgia</p>
    <p>NEOCLASSICAL:<br>
    caslon<br>
    baskerville</p>
    <p>ROMANTIC:<br>
    didot<br>
    century<br>
    clarendon</p>
    <p>REALIST:<br>
    gill sans<br>
    frutiger<br>
    univers<br>
    helvetica<br>
    trade gothic</p>
    <p>GEOMETRIC MODERNIST:<br>
    futura<br>
    avant garde itc<br>
    avenir<br>
    century gothic<br>
    memphis</p>
    <p>LYRICAL MODERNIST:<br>
    palatino<br>
    times roman</p>
    <p>POSTMODERNIST:<br>
    archer</p>
    <p>Thank you for your help!</p>
