      <p>Garamond is Renaissance (a category usefully divided into Italian and French), not Baroque, and Georgia is basically Neoclassical.</p>
      <p>Caslon is Baroque. For more Baroque types, look at the Dutch 18th Century types of Fleischmann and Rosart.</p>
      <p>In addition to Baskerville, Neoclassical types include Bulmer and Bell, and I'd be inclined to put Georgia in this category too. Walbaum is on the line between Neoclassical and Romantic, although most people class it with the latter.</p>
      <p>Bodoni's types are Romantic. Century and Clarendon are better described as Victorian, I think, along with the varieties of Scotch Roman, but of course these come out of the Romantic tradition. Since you're including modern types in the various styles as well as originals of the period, e.g. Arno as renaissance, you could include Kepler among the Romantic types.</p>
      <p>This has the look of a school project.</p>
