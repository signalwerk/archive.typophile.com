      <p>Oh, but the OS's dpi is what determines if the pixels in a pixelfont map correctly or not. It's just that on a higher-dpi display the pixels are smaller; so we're not (or rather, we shouldn't be) talking about actual height in inches. That's why it's less confusing to use "PPEM" instead of "point size".</p>
      <p>hhp</p>
