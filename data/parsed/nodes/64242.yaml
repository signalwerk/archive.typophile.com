    html: <p>Hrant, the problem is, not every screen has the same dpi. I'm not sure the OP knows what he means by <em>"just on screen at 11pts"</em> Many web designers are not really aware of how different their stuff will look on other computer screens. I for one have 97 dpi on my desktop and 133 dpi on my netbook.</p>
