    html: |-
      <p>Andreas, as long as the dpi is fixed a<br>
      given point size maps to a specific PPEM.</p>
      <p>Windows can change the dpi (although it's very<br>
      rarely actually done). Can MacOS do that now?</p>
      <p>&gt; set grid step to 256/11</p>
      <p>1)What about systems that assume an EM of 1000?<br>
      Are those safe to ignore these days?</p>
      <p>2) Since that's not a whole number, doesn't it all<br>
      end up looking blurry?</p>
      <p>--</p>
      <p>BTW, my view of good vertical proportions for an 11 PPEM font are:</p>
      <p>x: 7<br>
      ascenders: 9<br>
      descenders: -2<br>
      caps: 8<br>
      lining nums: 8<br>
      OS* nums: 7</p>
      <p>If you want a smaller x-height you can go to 6, but then I'd leave the<br>
      rest the same (in fact that makes the ascenders nicely longer than<br>
      the descenders - a good thing).</p>
      <p>* No room for hybrids.  :-(</p>
      <p>hhp</p>
