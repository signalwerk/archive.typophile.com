  html: |-
    <p>I just started working on a typeface for personal use and I want to design it work at a specific point size (11 pts to be exact). For this specific type project, it doesn't matter to me if it works at any other point or if it works in print, just on screen at 11pts.</p>
    <p>With that in mind, how should I get started? I've been playing with UPM and different cap, x, ascender and descender heights in Fontlab but I haven't been able to settle on the right starting point. I guess my big question is, how would you get started on a project like this and what should I keep in mind to optimize a font for one really specific situation like this?</p>
