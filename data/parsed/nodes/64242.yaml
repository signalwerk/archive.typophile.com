    html: |-
      <p>If you're shooting for a single PPEM size, you make a pixelfont.<br>
      You use a 125 x 125 unit grid, and set the font at 8 pt (72 dpi)<br>
      no matter how big it actually is.</p>
      <p>hhp</p>
