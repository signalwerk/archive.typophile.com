    html: |-
      <p>I think yo want to make a new font </p>
      <p>set units per em to 256, so as not to waste precious units per em.</p>
      <p>set grid step to 256/11, or 23 units per em, per pixel x and y.</p>
      <p>set metrics window to 11 pt.</p>
      <p>draw... look... draw... look... until generation time. </p>
      <p>It is true that the optimization may not always appear when any user selects "11", but this is just for you, and you are not just "any user."</p>
      <p>Cheers!</p>
