    html: |-
      <p>Looks too consistent for hand engraving.<br>
      Bracelets, rings etc are usually engraved with a milling machine that uses fonts in a special format.<br>
      Some of these have the same names as regular fonts.<br>
      Others do not.<br>
      I believe this one is in the latter category and is usually sold as "Roman."<br>
      Here is a link to a typical list of engraving fonts:<br>
      <a href="http://www.jewelryimpressions.com/fonts.html" title="http://www.jewelryimpressions.com/fonts.html">http://www.jewelryimpressions.com/fonts.html</a><br>
      There are a few variations in "Roman" among engravers, but they usually are pretty close to your bracelet.<br>
      Don</p>
