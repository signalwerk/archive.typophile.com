      <p>It makes a difference if two different features affect the same glyphs. For example, let's say you have a normal and and alternate "f" and there is also a corresponding normal and alternate "fi" ligature. Let's say the alternate "f" is part of stylistic set 1. If <code>liga</code> comes before <code>ss01</code>, you would do it like this:</p>
      <p><code>feature liga {<br>
      &nbsp;&nbsp;sub f i by fi ;<br>
      } liga;</code></p>
      <p>feature ss01 {<br>
      &nbsp;&nbsp;sub f by f.alt ;<br>
      &nbsp;&nbsp;sub fi by fi.alt ;<br>
      } ss01;</p>
      <p>If <code>ss01</code> comes first, and you don't change the code, <code>ss01</code> would never encounter an "fi" ligature to transform. You would need to do it like this to get the same effect:</p>
      <p><code>feature ss01 {<br>
      &nbsp;&nbsp;sub f by f.alt ;<br>
      } ss01;</code></p>
      <p>feature liga {<br>
      &nbsp;&nbsp;sub f i by fi ;<br>
      &nbsp;&nbsp;sub f.alt i by fi.alt ;<br>
      } liga;</p>
      <p>Make sense?</p>
