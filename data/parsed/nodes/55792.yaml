    date_raw: 13 Mar 2009 — 9:58am
    votes: null
    html: <p>By the way, in the example above, I would put <code>liga</code> first because there are other ways to generate an "fi" ligature than via the OT feature. For instance, if someone types opt-5 on a Mac to get an "fi" ligature, the <code>ss01</code> code in the second example would have no effect on it.</p>
