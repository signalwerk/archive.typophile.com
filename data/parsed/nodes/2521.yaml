  html: <p>Here are two members of my Dorothy family. The are actually a companion family to my Toto family, the very small text below the logo. Nevermind the cheesy tagline. Just playing around there! <br> <br>There are some tweaks that can be made to these two, for sure. What do you think of the lc y and g, the way they lift above the baseline to keep their compactness? <br> <br>These are not "gray" pixel fonts, although they could easily be adapted. However, I think they look pretty smooth as is, if not on the thin side. <br> <br><img src="http://www.typophile.com/forums/messages/29/22945.gif" alt=""></p>
  html_clean: <p>Here are two members of my Dorothy family. The are actually a companion family to my Toto family, the very small text below the logo. Nevermind the cheesy tagline. Just playing around there! <br> <br>There are some tweaks that can be made to these two, for sure. What do you think of the lc y and g, the way they lift above the baseline to keep their compactness? <br> <br>These are not "gray" pixel fonts, although they could easily be adapted. However, I think they look pretty smooth as is, if not on the thin side. <br> <br><img src="http://www.typophile.com/forums/messages/29/22945.gif" alt=""></p>
