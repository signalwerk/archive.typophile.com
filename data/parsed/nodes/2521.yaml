    html: "<p>tyler, <br>nice fonts... <br> <br>i notice you used different heights for your ascenders and descenders, and this gives your text a special rithm. <br> <br>in my oppinion the spacing is not right: it's too tight, and the text is too black... try using 2px between the letters and a bigger space - you'll see how legibility will increase. <br> <br>keep goin'... <br> <br>-g.</p>"
