    html: <p>Gustavo, <br> <br>Thanks for your feedback. Here are some samples with more open kerning. Which do you think looks better? The space glyph has been altered 1px in the top version, and 2px in the bottom. At first I was sure I liked the 1px version better. Now I'm not so sure... <br> <br><img src="http://www.typophile.com/forums/messages/29/22966.gif" alt=""></p>
