    <p>I thought this might have come up here before, but I can't find any discussions about it...</p>
    <p>Is it possible to include an accented character in a font name? FontLab allows it in some name fields, but not others. This leads me to wonder if such a discrepancy (some name fields with the accented character, some without) would lead to technical problems for users. </p>
    <p>I've found at least one font with an accent in the name: ITC Odyssée. It appears that the accent is used only in the "trade name" as it appears in specimen books and such, not in the actual font name. I'm not sure if anything usefull can be deduced from this.</p>
