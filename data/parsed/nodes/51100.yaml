      <p>I think that there's a NON-technical usability reason for avoiding accents in font names and file names.<br>
      Many people (particularly in the US ) have no idea how to enter an accented character (even if they know what they are), and if they're trying to search for anything with such characters, they're dependent upon whatever search tool they're using.  Google's Search does a good job of equating e and é and è, but many tools only look for exactly what's entered; they won't find Egalité if the user looks for Egalite</p>
