    html: |-
      <p>The problem we (Adobe) found with accents in menu names was in very early 2003. From my records, it affected two classes of apps:</p>
      <p>- The then-current version of Microsoft Word for Mac (2001?). Because of differences in the menu name handling between Mac and Windows, Word files using these fonts failed to be cross-platform, ever.</p>
      <p>- Adobe's *Japanese* applications using our core font library. AFAICT, this was fixed in the CS2 generation of our Japanese applications, shipped in late 2004. The "problem" fonts did not appear in the font menu of these applications.</p>
      <p>Special thanks to Google Desktop for digging up this info.  :)</p>
      <p>Regards,</p>
      <p>T</p>
