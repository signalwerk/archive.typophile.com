    html: |-
      <p>Adobe tried using them in Künstler Script but they reverted to Kuenstler Script due to compatibility problems with older apps. </p>
      <p>I strongly recommend for family and style names (both regular and OpenType variants) as well as in the full name to stick to uppercase and lowercase plain English letters, spaces, and possibly numbers — but nothing else. No dashes, underscores, slashes, ampersands or accented letters. </p>
      <p>In PS Font Name, only plain English letters, no spaces or even numbers, and exactly one dash between the family name part and the style name part. </p>
      <p>Adam</p>
