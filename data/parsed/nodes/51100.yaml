    html: |-
      <p>Mark,</p>
      <p>every OT name record contains information about platform and encoding.<br>
      E.g. 16,3,1,1033 stands for</p>
      <p>16 = name ID Preferred Family<br>
      3 = platform ID Microsoft<br>
      1 = encoding ID Unicode<br>
      1033 = language ID English</p>
      <p>So theoretically it is possible to add separate name records for each possible combination of platform, encoding and language. But if it works like you suppose ... You'll have to test!</p>
      <p>Best,</p>
      <p>Christoph</p>
