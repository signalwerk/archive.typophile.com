    html: |-
      <p>The Font Bureau folks are experts at the kind of whimsical narrative text that has been used in type specimens for decades. It definitely requires some imagination. I don't think any of that kind of specimen text is copied from headlines; at most some of it could be inspired by current events or personal stories.</p>
      <p>Depending on the style of type you are showing, you might prepare some headlines that seem appropriate to the design. House Industries also devise elaborate logos and headlines to show their display types. I think it is very useful for designers who might like to spec the type but need to see how it performs. Again, if the tone or content of the text is sympathetic to the typeface, all the better. If you have a text typeface to show, it might be better (easier) to get permission to reprint part of an existing story or book. See Adobe's specimen books for more examples.</p>
