    <p>I’m designing some specimen sheets for my fonts. I’d like to do something similar to Font Bureau’s Headline Showings (In their Type Specimens Third Edition book and on their website). I was wondering where one would get the source material (for the copy). Is there a random phrase or headline generator or do you just browse newspapers/magazines? The design is going well its just the search for the text to use that is the most time-consuming.</p>
    <p><a href="http://www.fontbureau.com/images/specimen/splash/farnham.gif" title="http://www.fontbureau.com/images/specimen/splash/farnham.gif">http://www.fontbureau.com/images/specimen/splash/farnham.gif</a></p>
    <p>Thanks!</p>
