    html: |-
      <p>Writing type specimen copy is one of the greatest joys in creating type. It's typographic poetry. Like Carl said, use words that feel like the typeface and show off the face's most distinctive glyphs.</p>
      <p>As for more models (of what to do or avoid), I've done some specimen posters for <a href="http://macrhino.com/" rel="nofollow">MAC Rhino</a> and mini specimens for the QBN Typecase at <a href="http://www.newstoday.com" rel="nofollow">Newstoday</a>.</p>
      <p>And Christian Schwartz, who is responsible for many of those posters at Font Bureau has more at <a href="http://orangeitalic.com/type.shtml" rel="nofollow">Orange Italic</a>.</p>
