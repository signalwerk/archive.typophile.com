    html: |-
      <p>David, I would welcome your consideration to publish your typeface through our <a href="wiki/Umbrella" class="wiki">Umbrella</a> [1] collection at <a href="wiki/Veer" class="wiki">Veer</a>. However, I agree with Stephen that <a href="wiki/Fountain" class="wiki">Fountain</a> is probably the <em>“most appropriate home”</em> for your design. As an added bonus, if you do end up being published through Fountain, you will be represented through Veer [2] as well.</p>
      <p>[1] <a href="http://www.veer.com/umbrella/">http://www.veer.com/umbrella/</a><br>
      [2] <a href="http://www.veer.com/fountain/">http://www.veer.com/fountain/</a></p>
