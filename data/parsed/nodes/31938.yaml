      <p>Chuck - you are right - my thoughts exactly. Many don’t know or realize the beauty of Frutiger…</p>
      <p>This question really does depend on the era you are in. In the 1980s it was Benguiat. In the 1990s we called Copperplate - the Helvetica for the 90s (see how quickly we forgot how overused it was…)</p>
      <p>As the 21st Century approached we were inundated with Papyrus and Bodega. Hollywood reallly did take advantage of Trajan - and Trajan-type titling fonts.</p>
      <p>And Charles - I couldn’t have said it better about type shops sick of Times Roman. And the cost of a family for Alphatype/Berthold was $30 per font PLUS if it was an ITC, TS, BE add an additional $30 per font - so the complete set of ITC Lubalin - 4 weights, 4 italic counterparts was 8 x $60 or $480. Not quite the price of a Ford or Chevy — unless, you are talking about hot type — now how much was a family in metal?</p>
      <p>BTW - as typesetters we were also sick of using Radiant Bold for headlines….</p>
      <p>P.S. For 2006 in the freebie world - many of us that ID fonts are tired of ID’ing Scriptina and Black Chancery. Doesn’t anyone pick anything original anymore? Especially since the average Joe at home can obtain more fonts than the largest typeshop in all of Manhattan during their most viable times…</p>
