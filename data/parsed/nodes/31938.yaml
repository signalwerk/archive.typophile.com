      <p>There’s nothing wrong with Myriad. It might eventually be overused to the point that Helvetica was once overused, but just like Helvetica, it will still be a beautifully designed typeface.</p>
      <p>As already mentioned, my choice of an undeservingly overused font is Papyrus, followed by Zapfino. My nomination for the most widely misused font is probably Verdana — great font at text sizes on a monitor, but far from ideal for print or display use.</p>
      <p>Good, bad, ugly or beautiful, any font that comes with a popular operating system or ubiquitous software suite will be overused and misused.</p>
      <p>Oh yeah, I almost forgot — newspapers (since most newspaper designs are mostly hacks of other newspaper designs), worship Interstate. Seems there’s scarcely a newspaper left in the U.S. that hasn’t used Interstate.</p>
