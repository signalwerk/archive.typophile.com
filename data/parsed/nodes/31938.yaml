      <p>There are so many that I come to think of as ‘played out’, but do take this as humorous provocation:<br>
      Meta, Bliss, Dax and Thesis The Sans. Everything ‘funny’ from Emigre. Times Roman and Helvetica, especially when Helvetica is used in a Swiss-style design. Bodoni is too easy. Palatino is too easy as well. Verdana. Adobe Garamond and Rotis Sans. Any kind of DIN, come free or at € 100. All Gill Sans cuts except the ultra bold. Ariel of course. Interstate. Kabel and Lithos are rarely seen, but never the less always inappropriate.</p>
      <p>That’s all for now I guess. It felt good to just get it out.</p>
