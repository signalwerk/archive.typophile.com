      <p>(And then there’s an Italian restaurant near us that has their sign in Park Avenue — green lettering on a white background — and I swear the Uc letters are two feet tall.  In wedding invites is bad enough, but this sign is enough to drive any Typophile nuts.)</p>
      <p>(P.S. And their food’s awful too!)</p>
