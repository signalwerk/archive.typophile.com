      <p><cite>I think it’s more a factor of where one lives….</cite></p>
      <p>I guess most of you people don’t remember the time when designers looked at what fonts a printer had before selecting the typefaces. Back in the late ’50s/early ’60s, a <cite>full</cite> font family cost about half as much as a new Ford or Chevy. I can remember one designer asking if using bold meant a magazine change (in which case, he’d do something different). And a lot of designers were real tired of Times long before it was a “system font” — which didn’t make it overused. I think it not right to equate “designer boredom” with “overuse.”</p>
