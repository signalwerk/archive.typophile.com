      <p>My “favorite” use of Papyrus is in the US edition of the board game <a href="http://www.boardgamegeek.com/game/42"><cite>Tigris &amp; Euphrates</cite></a>, published by <a href="http://www.mayfairgames.com/">Mayfair Games</a>.</p>
      <p>Papyrus is used, in ALL CAPS and in varying degrees of squooshedness, on both the <a href="http://s3.amazonaws.com/boardgamegeek/images/pic116608.jpg">box</a> and the <a href="http://s3.amazonaws.com/boardgamegeek/images/pic149759.jpg">game board</a> itself.</p>
      <p><cite>Tigris &amp; Euphrates</cite> is an absolutely wonderful game; it’s currently ranked #2 out of the thousands of games listed on <a href="http://www.boardgamegeek.com/">BoardGameGeek</a> (which is like the <a href="http://www.imdb.com/">IMDb</a> of board games). But man, is it painful to look at. (The <a href="http://s3.amazonaws.com/boardgamegeek/images/pic1164.jpg">box art</a> and <a href="http://s3.amazonaws.com/boardgamegeek/images/pic15.jpg">game board</a> in the original German edition were both far superior.)</p>
      <p>The Mayfair edition is so painful to look at that a guy named <a href="http://mdoyle2.blogspot.com/">Mike Doyle</a> decided to create his own <a href="http://mdoyle2.blogspot.com/2006/07/euphrat-tigris.html">replacement design</a> of the game as a personal project.</p>
      <p>He chose not to use Papyrus.</p>
