    html: |-
      <p>I think the idea of this and similar threads is somewhat misconceived. True, we simply get tired of some typefaces from seeing them constantly. </p>
      <p>However, in the case of good typefaces like Times New Roman, I think the distaste comes more from seeing them widely used badly. For example Helvetica, which I really have a distaste for, is constantly used for text, where it never works well, IMHO. But it does work for display, and can still succeed in a design if used well. I personally won’t like it, but then I spend way more than normal time looking at type. </p>
      <p>Even the much-reviled Comic Sans can work beautifully in the right setting. Here is an example of Comic Sans used beautifully:</p>
      <p></p><div class="imageWrap"><img src="files/goodcomicsans_4230.gif"></div><br>
      . <p></p>
      <p>The use, a school for children, is suitable for the faux childishness of Comic Sans, and its ‘ductus’ perfectly matches the ‘seal script’ style of Chinese writing used on the sides of the sign. The Seal Script style comes from routing out lines in material. Then the bright colors reinforce the ‘happy school’ image. This is from Manhattan’s China Town. </p>
      <p>By the way, I am not of the school that “there are no bad typefaces, only bad use of typefaces”. The first time University Roman was used it was too much already. :)</p>
      <p>My point here is rather there is an important difference between extensive inappropriate use of a good typeface, such as Times New Roman, and the use of a bad one, like University Roman.</p>
