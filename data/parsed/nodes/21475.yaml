      <p>I think Künstler-Gotisch is a closer Art Nouveau typeface to this lettering (in 'Treasury of Authentic Art Nouveau Alphabets' by Petzendorfer (Dover Books)). This was once digitized as 'Library' in the Expresiv fonts Photo Lettering Font collection. You can contact me if you want to see a sample, as I have the font collection.</p>
      <p>- Mike Yanega</p>
    html_clean: |-
