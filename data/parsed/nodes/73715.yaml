    .<p></p>
    <p>Hutsulyandiya 2D family fonts comprise folk ornaments found on Hutsul ceramics of the mid 19th to early 20th centuries.</p>
    <p>Hutsulshchyna is an ethnic region in the Ukrainian Carpathian Mountains where folk art and indigenous culture preserve up to nowadays. All images are to the maximum approximated folk prototypes. The graphics are characterized with grotesque, stylization simplicity, surprising plot moves. The font cheers up and evokes positive emotions.</p>
    <p>Designers: Iryna Korchuk</p>
    <p>More info on <a class="freelinking external" href="http://new.myfonts.com/fonts/2d-typo/hutsulyandiya-2-d-beast/" rel="nofollow">MyFonts</a></p>
