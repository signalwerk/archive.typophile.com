    html: <p>The stitching and the slight unevenness of the shapes (e.g. the bottom of the <strong>C</strong>) are meant to convey the feeling of a hand-crafted item as opposed to an industrial product. Fonts are industrial products, and the designer of this logo wisely didn't use one.</p>
