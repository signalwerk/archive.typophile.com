  html: |-
    <p>I'm trying to track down and license a font called Chelmsford. It's influenced by/derived/ripped-off from Optima, but comes in a very light weight and has a few added touches -- an Optima Titling Light, if you will. Check out the A, for example.</p>
    <p>My guess is that this dates back to the early days of DTP, and is a digitization of someone's film/CRT version of Optima. MyFonts, Fontshop and Fonts.com (along with a general Google search) didn't turn up anything.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/chelmsford_3728.jpg"></div><p></p>
