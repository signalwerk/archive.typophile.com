      <p>In addition to Michael’s comment, a few links: <a href="/wiki/Optima%20Nova" class="freelinking" rel="nofollow">Optima Nova</a> offers a <a href="http://www.linotype.com/54144/optimanovalight-font.html" rel="nofollow">Light weight</a> aswell as a <a href="http://www.linotype.com/54345/optimanovatitling-font.html" rel="nofollow">Titling version</a> (an all-caps font with a couple of ligatures and alternates).</p>
      <p>If you’re looking for a lighter titling version of Optima, check out <a href="http://doyaldyoung.com/113_YF_Roman/1131_Spec_YF_Roman/1131_Spec_YF_Roman.html" rel="nofollow">Young Finesse</a> by <a href="/wiki/Doyald%20Young" class="freelinking" rel="nofollow">Doyald Young</a>. That typeface started out as Fino Titling Light and is described by its author as “an ultra-thin, elegant drawing of Zapf’s Optima”.</p>
      <p>Beorcana by <a href="/wiki/Carl%20Crossgrove" class="freelinking" rel="nofollow">Carl Crossgrove</a> has a wide range of <a href="http://www.beorcana.com/specs2.html" rel="nofollow">Display weights</a>.</p>
      <p>If it may be less calligraphic, have a look at <a href="http://www.typecuts.com/fonts.php?kid=8" rel="nofollow">Viceroy</a> by <a href="/wiki/Andrea%20Tinnes" class="freelinking" rel="nofollow">Andrea Tinnes</a> and <a href="/wiki/Verena%20Gerlach" class="freelinking" rel="nofollow">Verena Gerlach</a> which should be available soon: “ReVerb holds an exclusive license till June 2009” [!]<br>
      Furthermore: <a href="http://www.veer.com/products/typedetail.aspx?image=GTT0000001#characters" rel="nofollow">Accent Graphic</a> by <a href="/wiki/Nick%20Cooke" class="freelinking" rel="nofollow">Nick Cooke</a> has a Light, <a href="http://www.treacyfaces.com/050806_TFArrow_2c5a.html" rel="nofollow">TF Arrow</a> by <a href="/wiki/Joseph%20Treacy" class="freelinking" rel="nofollow">Joseph Treacy</a> even comes with an Extralight.<br>
      F</p>
