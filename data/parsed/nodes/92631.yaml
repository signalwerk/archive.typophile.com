      <p>The move to electronic books is simply another step in the overall movement of burden-shifting.</p>
      <p>Virtual products relieve their makers of the costs of manufacturing and/or distributing a physical product. Even non-physical goods—like television programming—are migrating from free-to-all to free-if-you-pay-for-internet-access. Telephone companies are currently trying trying to absolve themselves of the responsibility for maintaining landlines. And so on…</p>
      <p>While virtual reality may appear to be simply a quest to find more and more inconsequential ways to fiddle while Rome burns, its real purpose is to shake you down in new and improved ways.</p>
