      <p>It's clear that digital publishing — iPad, Kindle, etc — is the trend of the future and that sales of printed books, magazines and newspapers will decline seriously. </p>
      <p>My guess is that two types of printed books will hang on the longest -- inexpensive paperbacks (for readers in lower economic groups who can't afford an iPad/Kindle and who look for budget-priced books) and coffee table or collectable books (large-format photos, fancy bindings, etc).</p>
      <p>As for myself, I've always loved books and have a pretty good sized library, but since getting my iPad I've bought all my books digitally. It's just so darn convenient.</p>
