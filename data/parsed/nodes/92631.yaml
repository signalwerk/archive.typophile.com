      <p>The cost of printing and shipping a book is only a small percentage of its price.</p>
      <p>The New York Times says that for a book that retails for $26, the publisher pays only $3.25 (12% of the book's price)&nbsp;to print, store and ship the book, including unsold copies that are returned. </p>
      <p>The retail book store would keep $13 (50% of the retail price), the author gets around $3.90 (can vary), and the rest goes to overhead, proofing, design, typesetting, marketing, and the publisher's profit.</p>
