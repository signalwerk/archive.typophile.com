      <p>You can draw a parallel to letterpress: what was once looked down upon as the over-the-hill poor cousin of offset printing has become a high-end niche product. The problem is that causes most people to see it as a fetish (think of the gaudy over-impression in most contemporary letterpress) so I guess most books will become over-designed, over-decorated too. Another parallel is calligraphy: it's basically art now.</p>
      <p>For myself, I'm skeptical of light-emissive screens for reading, but I love my Kindle, not least because it's so passive - it's not screaming at your for attention, and gasping for a recharge. I've long loved reading physical books, but I abhor nostalgia, so I have no problem seeing printed books disappear, not least because it would save trees.</p>
      <p>One thing that pisses me off though is that it's become nearly impossible to get very high quality typeface specimens made. There used to be Velox (AKA "RC paper") but not any more, and digital printing is still not good enough for super-crisp b&amp;w, and in this zeitgeist can never become good enough.</p>
      <p>hhp</p>
