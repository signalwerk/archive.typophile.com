      <p>According to the Wikipedia article that Hrant linked, the real price of the Aakash, as the UbiSlate 7+, is $60 rather than $35 for someone who wants to buy one.</p>
      <p>$35 is what the government will pay to give one to a student for free.</p>
      <p>I certainly agree that paper books are ahead at present. Think of buying a second-hand copy of a paperback book, possibly at a thrift shop or a library book sale: no contest.</p>
      <p>But with concern over the size of our forests, the price of brand new paper books is going up, and eventually paper availability will be an issue. On top of that, pushing people to E-books apparently will mean publishers can charge the same price for a book without having to pay for the paper and binding any more.</p>
      <p>So I do see this future as inevitable. There is the "Retina display" that is coming into vogue, so it may be that by the time E-books take over, displays will have a higher resolution,  thus better presenting type.</p>
      <p>But the real issue is that it's unlikely the DRM will allow a way to transfer possession of used books, and so type looking fuzzy will be a small matter compared to:</p>
      <p>- the death of the public library,<br>
      - the death of the second-hand bookstore,<br>
      - books becoming much more expensive, as, in effect, there will only be new hardcovers, no pocket books, no second-hand books</p>
      <p>This is what will have a destructive social impact.</p>
