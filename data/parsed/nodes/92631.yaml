      <p>Not true. In extensive parts of the world the price of a Kindle or iPad is equivalent to the purchase price of hundreds, or even thousands of articles of printed matter. Eg, the price per copy of an Indian newspaper is around 10 dollarcents (5 Rupees — The Indian Times). The ASP for a iPad in India is around 760 USD (40,000 Rupees), although there are locally produced tablets that cost a fraction of that, eg the Akaash, which costs around 39 USD.</p>
