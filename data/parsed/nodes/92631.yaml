    <p>Dear Readers,</p>
    <p>I'm currently in the process of gathering research for a final project.</p>
    <p>My thesis is on the effects of the new digital media, on print. e.g.; iPad, Kindle, pdfs, wiki, and any other digital based media that has recently taken over the print market. Print is not dying, but it's recessing back into it's Medieval ways. It's strictly for the prestige. The wealthy. Those who can afford to buy books. The throw away, paper back is going out of style and there is a stronger emphasis on printing books that are of value. Holding to it's craft...etc</p>
    <p>So, internet users...whats your take on it? Do you own an iPad? Do you even buy books anymore? When was the last time you bought a printed material?<br>
    If your a working professional, designer, printmaker, digital media; how has the digital divide effected you? Positive or Negative? Or do you not feel infringed at all?</p>
    <p>Your thoughts are appreciated.<br>
    -rado</p>
