      <p>I have heard of and been involved in a lot of casual discussions around this concept but always in terms of what the future holds, rather than as a perspective on current trends in publishing. On a smaller scale than your overview implies this kind of publishing is already in evidence; custom publishing, vanity editions, self-published titles, but these have been around for some time and are nothing new. Perhaps a revision or expansion (with more references and examples) of what you are trying to achieve would be helpful?</p>
      <p>On a personal level, I enjoy reading on an iPad and even the iPhone. That said, in the past two weeks have I have purchased three hard copy books. I think I will always split my reading between the two mediums (partly due to the availability of what I want to read), but I have no idea how representative of a wider trend this might be. I would say that for the majority of texts that I read, content is more important than format or context, but good typography is also incredibly important as part of the reading experience on the page or the screen, for what it is worth...</p>
