      <p>Type design is the same as it ever was. Only, the tools have gotten better.</p>
      <p>We are making fonts today that we hope to look good when reduced in size or web-font-ized. We are going about solving these problems as type designers had to for badly inked hand press work hundreds of years ago.  </p>
      <p>Movable type is one of the oldest technologies around, and for as long as it has been moving through generations and the creation and adaption of new tools, it is surprising how little it has truly changed.</p>
      <p>I think the idea that technology has changed anything is rather weak, insofar as the actual design of type itself, new limitations spring up, and get overcome.  Surely technology, mainly the modern computer, has allowed pretty much anyone on earth to dive into developing type, and for the professionals, the time it takes them to create something has shrunken dramatically, but I don't see how this changes the shapes and curves and lines one sees in their head when they are trying to create type.</p>
