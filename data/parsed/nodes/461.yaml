    html: <p>True. Unless you were for an ad agency or design studio, then the above still applies. But, I would think the design studio wouldn't have a problem with you including the work you did in your own portfolio.</p>
    html_clean: <p>True. Unless you were for an ad agency or design studio, then the above still applies. But, I would think the design studio wouldn't have a problem with you including the work you did in your own portfolio.</p>
  - id: 136476
