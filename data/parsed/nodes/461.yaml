    html: <p><i>"Under copyright law, any exclusive use of a design or artwork licensed by a client must be transferred in writing."</i> Get yourself a copy of the Graphic Artists Guild Handbook and read Chapter 13, Standard Contracts &amp; Business Tools.  <br> <br>What Sean states is true, but only because that is what has become the assumed method of business. For myself, I've made it a necessary evil to discuss usage and ownership with a client from the very beginning. I've only had a few horrible instances where I've handed over the actual artwork (digital files) to my clients, or rather long-since-fired to-live-a-much-happier-life clients. Yes, I fire my clients from time to time. Not a practice, nor habit. Just used to save my sanity.</p>
