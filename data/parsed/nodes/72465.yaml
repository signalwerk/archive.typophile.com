      <p>Second that, especially the passion part. I'm (aspiring to be) one of those self-taught guys. We may not have the time to accumulate the immense printing history knowledge that some around here definitely have, but it should be enough for "making a font functional."</p>
      <p>Don't forget to mention <a href="fontforge.sourceforge.net" rel="nofollow">FontForge</a> as a free FontLab substitute. And yes, there are many websites out there like <a href="http://www.typeworkshop.com/index.php?id1=type-basics" rel="nofollow">Typeworkshop</a> and <a href="http://briem.net/2/2.3.1a/2.3.1.01.notes.htm" rel="nofollow">Briem's Notes on type design</a>. The best resource and link collection though remains this forum.</p>
      <p>Most importantly though, look at both the typefaces you like and the ones you dislike <em>very closely</em>.</p>
