    html: <p>Sukekha since you are from Bombay, I suggest you go to an educational institution. IDC and JJ are the best in Mumbai with many experts in typography and type design. The professors might not have time, but they conduct workshops. Better still is get in touch with senior students of typography — PhD students are the best, they have sound theoretical knowledge and have lots of time to share and teach, you'll find their contact info online. I think it'll be difficult to learn Type design online. It needs face to face critiques.</p>
