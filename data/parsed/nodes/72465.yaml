      <p>Not much luck with online 'type design' learning.</p>
      <p>Step 1:<br>
      Google 'type design books' and see what's available.</p>
      <p>Here is one possible link:<br>
      <a href="http://www.design-bookshelf.com/Type/index.html" title="http://www.design-bookshelf.com/Type/index.html">http://www.design-bookshelf.com/Type/index.html</a></p>
      <p>Step 2: buy yourself a copy of FontLab:<br>
      <a href="http://www.fontlab.com/" title="http://www.fontlab.com/">http://www.fontlab.com/</a></p>
      <p>You can probably get a student discount.</p>
      <p>Step 3: Jump right in and give it a try.</p>
      <p>There are plenty of individuals that did just that.</p>
      <p>Good typography, or I should say, making good fonts that you can sell, comes from a lot of practice and experience.</p>
      <p>But, if you truly have a passion, you'll find a way to overcome the setbacks. Good luck.</p>
      <p>Other online resources:<br>
      <a href="http://www.magmabooks.com/content/bookshop/cats.asp?sc=0&amp;p=1&amp;c=TYP" title="http://www.magmabooks.com/content/bookshop/cats.asp?sc=0&amp;p=1&amp;c=TYP">http://www.magmabooks.com/content/bookshop/cats.asp?sc=0&amp;p=1&amp;c=TYP</a><br>
      <a href="http://particletree.com/notebook/typography-crash-course-roundup/" title="http://particletree.com/notebook/typography-crash-course-roundup/">http://particletree.com/notebook/typography-crash-course-roundup/</a><br>
      <a href="http://www.sessions.edu/courses/Course-Advanced-Typography.asp" title="http://www.sessions.edu/courses/Course-Advanced-Typography.asp">http://www.sessions.edu/courses/Course-Advanced-Typography.asp</a><br>
      <a href="http://www.angelynngrant.com/mas.html" title="http://www.angelynngrant.com/mas.html">http://www.angelynngrant.com/mas.html</a></p>
