  html: |-
    <p>Hi,</p>
    <p>I am in the process of developing a logotype. I started off with an uppercase B set in Foundry Wilson and combined it with part of a serif of an uppercase ‘B’ set in French script. I then chopped off the serif from the top left corner of the Foundry Wilson ‘B’ and rounded it off. I quite like the quirky shape that comes out of it. </p>
    <p>My Logotype will have three words. I thought it might be easier to use a san serif font instead of the Foundry Wilson, as it is easier to add to a character than subtract. </p>
    <p>For this project I am looking for a sans serif with varying stroke thicknesses, similar to that of Foundry Wilson. Any ideas?</p>
    <p>Client restrictions mean that I cannot post the B on the Internet. Sorry!</p>
