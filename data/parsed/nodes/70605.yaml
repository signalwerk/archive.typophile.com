  html: |-
    <p>I remember reading somewhere on the web that its possible to edit a webfont (@font-face) and take out glyphs you dont need to make the font files smaller.</p>
    <p>The font I am going to do this with has a @font-face kit on<br>
    <a href="http://www.fontsquirrel.com/fonts/DejaVu-Serif" title="http://www.fontsquirrel.com/fonts/DejaVu-Serif">http://www.fontsquirrel.com/fonts/DejaVu-Serif</a><br>
    so its an open source font</p>
    <p>I've searched google on this, but cant find the post I remember reading on it. Once I edit the font I need to regenerate all the version of the file again which means the .ttf, .woff, .eot, .svg, .js (cufon)</p>
    <p>Anyone know what program to do this with or what website would help regenerate all those files?</p>
    <p>Thanks</p>
