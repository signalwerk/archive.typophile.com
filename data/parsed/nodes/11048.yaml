    html: <p>a typeface is a generic term encompassing all type. font is a family of one specific typeface. there are countless ways of classifying type. i prefer the vox method, but on a very broad level you can make the distinction between display face or text face. in the post i made earlier i suggested that a trademark should be created with the ideal of display in mind. this is not just a preference but a rule. i don't find this extreme in any way. creating original display type can be very easy. it's not  at all a horrible task, for god sakes we are designers, we should enjoy this stuff. over all it's the distinction between text and display that is important. a text face is used for setting copy this is what they were built to do. in the days of metal type one face had many different cuts. it was different at 10pt then at 32pt. this is because as a type face gets larger and becomes a display it needs to become more robust in it's joins and horizontals. making it more of a display face then text face. the fact that the computer makes no compensation for this in a typeface as it gets larger is apparent in the fact that large computer type looks so bad. no one would dream of setting a book in a display face so why should one be as ridiculous to make a trademark out of a text face. yet this is done all the time because most designers are lazy or naive.</p>
