    votes: null
    html: "<p>&gt; this could not be further from the truth. a display face recuires less &gt; detailing in it's joins and such. it becomes more robust in this &gt; manner because there is no need to read it in the traditional sense. &gt; the eye and mind deal with it as one word not a collection of words &gt; skimmed over and formed together into concepts. for this reason it &gt; needs more substance and less detail. this subject is covered &gt; extensively in doyald youngs book font's and logo's. <br> <br>Try setting Berthold Baskerville to 200 pt and you get a Clarendon-like slab serif! I think what you saying is, text type need to accommodate things like ink spread, so details like ink traps at 'joins and such' have to be considered, am I right? Reading in the traditional sense is precisely as you put it - 'skimming over and formed together into concepts'. We don't read letter by letter but 'word-images'. We take jumps and periodically stop at points of fixation, picking up the meaning as we go along. <br> <br>So, in terms of features, text typefaces are less refined, because they are prone to unpredictable reproduction qualities. Besides, we don't really see the details very clearly unless we use a magnifying glass. Display type, on the other hand, have to be delicate and a lot more refined, because everything is exposed right in front of our eyes to see - there's nothing to hide. So display types are usually have higher contrast, thinner serifs, more refined features so we don't get this chunky slab serif when we blow it up. Think this way for a moment: reading text type is like looking at objects at a distance: they are less sharp and less defined. Display type, on the other hand, is like looking at objects right in front of us, so everything is sharper and more detailed.</p>"
