    html: "<p>Jay, you know what? I think Hrant and I are talking about a different thing: display as in display type for books (serif, 48 to 72 point), not advertising. Yes, in trademarks and billboard kind of display work, the type does need to be robust, bold and sturdy. When we're looking at type that big then we're talking about the same issues as tiny type essentially! Lower contrast, thicker strokes, looser spacing... and the like.</p>"
