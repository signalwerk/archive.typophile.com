    html: <p>Hmm... how about 200pt or above? Wide spacing is essential for type that are meant to be read from a distance, as in directional signage. A student was using my Arrival for her signage project. She decreased my default spacing and said the spacing was so wide that the words don't read as words. Well, apparently she was judging from the computer screen! Yes, spacing has to decrease for 'small' display type, but for extreme sizes the contrary is true.</p>
