    html: <p>you should almost never use an existing typeface for a trademark. a trademark is created for use as a display and there for needs different attention then does a typeface. typefaces or "fonts" are meant to be read at small sizes in running copy and they are built for this need. when crafting a display face you should never use a typeface. not only for the reason above but also because you should be making a piece of ownable type for a client, something that is theirs and no one else's. if you use helvetica then the voice of the company is diminished by all five million other companies that use helvetica too. if i were a client i'd feel ripped off if some amateur designer sold me a typeface i could buy myself and use with out their help. i think we as graphic designers and typographers need to step up to the plate and start producing real work instead of ripping clients off.</p>
