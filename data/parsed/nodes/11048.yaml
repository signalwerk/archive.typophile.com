    html: "<p>&gt; it's the distinction between text and display that is important <br> <br>Indeed. And it's shocking how many highly-regarded designers don't get this duality. <br> <br>&gt; as a type face gets larger and becomes a display it needs to become more robust in it's joins and horizontals <br> <br>Robust? In the meaning I associate with that term, I'd say the opposite. Display type [generally] requires finer detailing, higher contrast, even delicacy and elegance on occasion. <br> <br>Basically, the difference between the two modes of type is parallel to the duality in the reader*: conscious versus subconscious. Display type needs to appeal more to aesthetic preferences (which change all the time), while text face needs to appeal more to our reading \"firmware\" (which changes extremely slowly - in fact never over the [adult] life of an individual). Of course nothing exists in a pure state, so even text type needs to worry about looks, and display type about basic legibility. <br> <br>* And many other things, like the duality in the structure of the retina. <br> <br>hhp <br></p>"
