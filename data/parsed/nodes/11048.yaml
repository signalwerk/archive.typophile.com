    html: <p>&gt;In the meaning I associate with that term, I'd say the opposite. Display type [generally] requires finer detailing, higher contrast, even delicacy and elegance on occasion. <br> <br>this could not be further from the truth. a display face recuires less detailing in it's joins and such. it becomes more robust in this manner because there is no need to read it in the traditional sense. the eye and mind deal with it as one word not a collection of words skimmed over and formed together into concepts. for this reason it needs more substance and less detail. this subject is covered extensively in doyald youngs book font's and logo's. <br> <br>as far as your point about the duality of the reader i agree. but i think you have it mixed up the text face needs legibility as a key element [yes] while the display face which relies less on this can change all it wants. the more drastic the better because it creates interest on the part of the reader. a display situation deals with less type [maybe just one word] and so generally less cognition is needed then reading a paragraph of text. because of this it can be much more dramatic and illustrative then a text face. this is apparent in the fact that most trademarks are heavy and robust examples of display typography.</p>
