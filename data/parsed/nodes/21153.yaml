      <p>What was the reason for making the new fonts smaller?<br>
      Was it to appear more “posh” — like book faces, rather than news text faces — or was it to accomodate the accents in wider encodings? Or are the fonts on a standardized x-height, pegged at the typeface with the smallest x-height? Or something else?</p>
