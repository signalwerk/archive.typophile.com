    html: |-
      <p>&gt;Or something else?<br>
      It’s not making the fonts smaller, it is lying the points-per-inch higher, which shrinks ‘em. This is why they are 8-7 pt. optical masters, not the 10-12 pt. they should be. </p>
      <p>CT is the first technology ever released where non-bozo users are recommending the use of the monospaced font as the best of the bunch.</p>
