  html: "<p>Hello all. I kind of disappeared from Typophile for a stretch, and this logo is one of the reasons. Right now, the client and I are making the final decisions. This is great, because that means we can roll this sucker out soon. This is tough, because I think we have slightly different preferences. So, I'm interested in your opinions. However, I'm not so much interested in logo tweaking advice, and more interested in your general preference between the three options: <br> <br>We call this the \"quarter mark\". <br><img src=\"http://www.typophile.com/forums/messages/29/39566.gif\" alt=\"TA logos 1A\"> <br> <br>We call this the \"radiating mark\". <br><img src=\"http://www.typophile.com/forums/messages/29/39567.gif\" alt=\"TA logos 1B\"> <br> <br>This is essentially a combination of attributes of both 1A and 1B. <br><img src=\"http://www.typophile.com/forums/messages/29/39568.gif\" alt=\"TA logos 1C\"> <br> <br>There are some little bits that I'll be adjusting (particularly in 1c), but these are essentially the 3 final options. If someone asked you to choose, which would you? (Rationales for choices are welcomed.) <br> <br>FYI: The logo is for a theatre advocacy/promotional group that produces no theatre, but coordinates theatres in the Greater Philly area. Their <a href=\"http://www.theatrealliance.org/\"> website</a> shows their current logo. I'm helping them rebrand as a more substantial and professional cultural institution (celebrating its 10th anniversary this year) to match changes being made in the organization. The mark accompanying the type is actually a capital T rotated at a regular interval. 'The Alliance' is the shortened version that they're considering for common usage, with the extended name being reserved for more formal use. <br> <br>Some of you may recognize the type from an <a href=\"http://www.typophile.com/forums/read.php?file=/4105/33192.html\">Uppercase critique thread</a> from a few months ago. As you can see, it took a slightly different direction. </p>"
