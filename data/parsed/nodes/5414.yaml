  - id: 38957
    user: 2172
    date: 2004-06-30T11:33:00
    date_raw: 30 Jun 2004 — 11:33am
    votes: null
    html: "<p>David, the mark is partially the result of a project requirement for no representational designs (their current <a href=\"http://www.theatrealliance.org/images/logos/tagp_main.gif\">logo</a> is representational, which they want to change). <br> <br>My specific rationale is as follows: the Theatre Alliance is/ wants to be a centerpoint for the Greater Philly Theatre community and theatre-goers visiting or living in the area. The mark itself uses a radial form built with capital Ts (which stands for 'theatre', of course). While not necessarily overt, the idea is that theatres working with the Theatre Alliance, which represents <i>many</i> theatres, extend their abilities and effects compared to those of an individual theatre. Finally, and perhaps most importantly, it's a striking mark that, as it did for Kirsten and others, evokes theatrical images without literal theatrical imagery (at least not intentionally). I also chose the central circular form to make an oblique visual reference to the wax seals used on official proclamations, supported by the rich red color. <br> <br>Although, I admit, the flags reading of the mark is unexpected. No one noticed the flags until now... I wonder if others in the organization will see them.</p>"
    html_clean: "<p>David, the mark is partially the result of a project requirement for no representational designs (their current <a href=\"http://www.theatrealliance.org/images/logos/tagp_main.gif\" class=\"link-external\">logo</a> is representational, which they want to change). <br> <br>My specific rationale is as follows: the Theatre Alliance is/ wants to be a centerpoint for the Greater Philly Theatre community and theatre-goers visiting or living in the area. The mark itself uses a radial form built with capital Ts (which stands for 'theatre', of course). While not necessarily overt, the idea is that theatres working with the Theatre Alliance, which represents <i>many</i> theatres, extend their abilities and effects compared to those of an individual theatre. Finally, and perhaps most importantly, it's a striking mark that, as it did for Kirsten and others, evokes theatrical images without literal theatrical imagery (at least not intentionally). I also chose the central circular form to make an oblique visual reference to the wax seals used on official proclamations, supported by the rich red color. <br> <br>Although, I admit, the flags reading of the mark is unexpected. No one noticed the flags until now... I wonder if others in the organization will see them.</p>"
