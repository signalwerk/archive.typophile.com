    html: "<p>Considering usage for theatre related applications, I favor concept C. The \"TA\" is emphasized in the more subtle burst as opposed to the intense red burst in concept A, which I think is appropriate. I like the thought of using the quarter mark on the lower left corner of pieces for a couple of reason: (1) It provides a lot of important real estate for visuals, and (2) if I have the correct perception of this organization's function, the lower left corner of the page is an appropriate hierarchical location for the mark also. <br> <br>On another note</p>"
