    html: <p>Chris,  <br>very nice designs, they have a Shakespearian feel to them which definitely says theater even in the abbreviated "The Alliance" version. Yet, it also looks modern so the design will work no matter what kind of performance. My favorite is 1A. I like the dimensionality of the mark better than the straight forward gradation used in the other two. Something you should consider though, is their overall budget for printing, if they will always use a quality printer who can hold the subtle tone changes again I say 1A. If frequently they'll end up using a quick-e printer and the quality may be so-so then I vote for 3A - it's a little easier/safer to reproduce. I'd hate to see that beautiful logo turn into a splotchy blob.</p>
