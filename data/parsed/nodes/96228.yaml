    <p>Hello.</p>
    <p>I am looking for the font used for this writing:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/keshorn-walcott_4957.jpg"></div><p></p>
    <p>I have figured out the Zaof Chancery is  pretty close but not 100% exact. The ends of the letter should have a rounder shape, as shown in the example. Italian Script looks close too but there are a few discrepencies (atleast in the version I have got).</p>
    <p>Thanks!</p>
    <p>Christian</p>
