    <p>Hi, I have just about finalised a logo for my personal identity (see below) and am looking for a complimentary typeface to work alongside the custom type.</p>
    <p>Ideally I would like it to have perfectly circular 'o' 'a' characters etc with this being a prominent in the logo</p>
    <p>I have looked at the common ITC avant garde, Gotham etc but am looking for something less common.</p>
    <p>I'd appreciate your thoughts on both the logo and typeface suggestions. This is my first venture in the design industry, after finishing university 12 months ago and gaining a years experience I have decided to fly solo, scary times :\</p>
    <p>Look forward to your suggestions</p>
    <p>Cheers guys</p><div class="imageWrap"><img src="http://typophile.com/files/logo_hm_5289.jpg"></div><p></p>
