      <p>Indra, sorry for putting your name as being involved. I didn't know it was an issue.</p>
      <p>Verena, while I think that it is somewhat rude to downplay the work that the, as you put it, "excuse-dingbats-calligraphy-kitty designeresses" are contributing I don't see what the problem is. This isn't a list of only the cool kids.</p>
      <p>So if I'm following you why didn't you title your article, "Where are all the Women in Type Design who only design the highest quality fonts?"</p>
      <p>Some type designers might need the help of others to do the technical side, some might start out that way and graduate into doing most/all of it on there own, some start out right in Fontlab, some can find there way around the FDK, and on and on. So yes, making a list means you can't limit it to just the so-called "serious" type designers. I'm a definitely one to promote strong typefaces. And I've even said that some typefaces aren't really typefaces but more just digital rub-down lettering—although I was just being a bit of a jerk when I said that. But to NOT make a list just so you can avoid having to share that list with the gamut of female type designers is not right. There are no bad typefaces. Just typefaces appropriate for the job at hand. Sometimes all you need is a cute script for a headline and sometimes you need an full-featured OT workhorse font. </p>
      <p>But I think there are too many people trying to keep up appearances. Everyone is here to learn. Everyone can grow and become better. Growth doesn't happen without output and hardwork. Output doesn't happen unless you release something. Sometimes what gets released is simple. But you know what? Sometimes simple is all you need. </p>
      <p>And further, why does someone need to be recognized, awarded, public, etc. to prove they are good at what they do?</p>
      <p>If I've misunderstood you. Then I do apologize.</p>
