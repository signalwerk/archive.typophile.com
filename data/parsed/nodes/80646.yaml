  html: |-
    <p>An article on <a href="/wiki/Typographica" class="freelinking" rel="nofollow">Typographica</a> written by Verena Gerlach posed the question <a href="http://typographica.org/2011/on-typography/where-are-the-women-in-typedesign/" rel="nofollow">"Where are the Women in Type Design?"</a> In response Indra Kupferschmid and I started creating a Listgeeks list of <a href="http://listgeeks.com/#!/view/female-typedesigner/by/kupfers" rel="nofollow">Female typedesigners</a>. (You can also view mine <a href="http://listgeeks.com/#!/view/female-typedesigner/by/Typegirl" rel="nofollow">here</a>.) After some back and forth it was decided that the list really deserved to be on a wiki and I suggested the <a href="http://typophile.com/wiki" rel="nofollow">Typowiki</a>. Thus allowing others to add those whom they believe belong on the list. </p>
    <p>At first it was a list for those <em>currently</em> practicing as a type designer whether full-time, part-time, or only sometime. But after a large group of people kept suggesting Carol Twombly the list will now include any women who have practiced as a type designer. This list, I think, should not include students or those who simply work at a foundry. They must be—or have been—involved in the type design process (which includes production) </p>
    <p>A few questions:<br>
    1. I've always written <em>type designer</em>, but Indra created the list with <em>typedesigner</em>. I wonder which is preferred?<br>
    2. I don't think the list should include student type designers. But what do you think?</p>
    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Designers" class="freelinking" rel="nofollow">Designers</a> : <a href="/wiki/Female%20Type%20Designers" class="freelinking" rel="nofollow">Female Type Designers</a></strong></p>
