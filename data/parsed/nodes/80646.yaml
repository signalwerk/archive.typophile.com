    html: <p>I see that Anna Simons is included on the list of women type designers. I'm a fan of her work, especially the initials and titling lettering she created for the Bremer Presse, of which I own a lovely folio set, but I'm not aware that she created any typeface designs. She was a calligrapher and lettering artist, and although she created some letters for use in print editions, she didn't design any full typefaces, to my knowledge. I'm not saying that she should not be included on the list, but I am wondering how the criteria apply in a case such as hers? [Her inclusion also makes me wonder about the influential role of women in type design education, and how this might be recorded or acknowledged in the list; among Simons' students was Jakob Erbar.]</p>
