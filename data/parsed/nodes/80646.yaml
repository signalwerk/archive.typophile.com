      <p>Not proof, evidence. And it's not (or shouldn't be) an ego thing* - it's just a matter of getting more exposure** so you get more business. For example I submitted my work to the CR Type Annual, and was lucky to be included; it's a nice feeling seeing it out there, but mostly I'm concerned with the question of how much more work it will cause me to get. BTW, there's a very good reason to speak at a conference besides exposure: pushing something you believe in, like respect for blackletter type or awareness of Latinization. I think Verena might be focusing too much on the fame aspect.</p>
