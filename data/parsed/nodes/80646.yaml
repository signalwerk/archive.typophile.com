      <p>Verena, I have to say that your essay is highly unconvincing to me - ironically, as if it were written by a man! I expected more rigor, sensitivity, insight and balance. You do make an interesting point about the "unfinishability" of fonts and how that counters the female psyche (although I don't attribute that entirely to social conditioning). Furthermore, although my direct exposure to German culture is limited, I have had great indirect exposure, and in fact have been regularly impressed with how much respect women get in your country. Here in the US the passing of a *vice*-presidential *candidate* from *thirty* years ago is a big deal because she was a woman!  :-/</p>
