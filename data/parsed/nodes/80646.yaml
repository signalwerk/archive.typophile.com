      <p>Instead of setting some limit on whom to include and where to make the cut-off, maybe the best approach is to do the most comprehensive list possible, then have a simple key of asterisks or lettercodes indicating for each person:</p>
      <ul>
      <li>whether they are living</li>
      <li>whether they have worked professionally as type designers
      <ul>
      <li>if yes, when they last did so ("currently" being a potential answer)</li>
      </ul>
      </li>
      <li>whether they have published typefaces credited to their name
      <ul>
      <li>if yes, how many</li>
      </ul>
      </li>
      <li>any other variable that is relevant</li>
      </ul>
      <p>Doing this will not only yield the most comprehensive documentation, but will also provide some clear distinctions without relying on judgements as to what level of accomplishment is more worthy of inclusion or not.</p>
      <p>Of course it'd be best to do this with a truly dynamic system that could be easily expanded on the fly (e.g. if you wanted to change the key coding system or sort order, automatically generate individual person pages, include font name credits, birth/death years, etc, etc), but this wiki entry is a good start.</p>
