      <p>But there are so many people named John and William... but Baskerville and Caslon are much less common names. This is a major reason why lists are usually by last name; there is a much greater variety in surnames than in given names, and so the surname lets you proceed more directly to a specific individual.</p>
      <p>Also, a given name is sometimes variable. Thus, Ivan Ivanov might also be known as Jean Ivanov in France or John Ivanov in Britain. For a real example, there's Zsuzsa Polgar... also known as Susan Polgar. Chinese people living in English-speaking countries often use an English given name as well as a Chinese one.</p>
      <p>While formality and dignity is no doubt <em>part</em> of the reason people are typically alphabetized by surname, there are good practical cataloguing reasons for doing it that way. Would you <em>really</em> want to have the local public library's catalogue order books by author under the author's first name first?</p>
