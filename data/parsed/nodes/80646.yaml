      <p>Here are some Soviet women type designers or lettering artists included in the 'big grey book of Soviet typography' (<em>The lettering art: work by Moscow book designers, 1959–1974</em>) and not yet included in the wiki list. The situation of 'type designers' in the Soviet Union was complicated by the difficulty of manufacture. Relatively few type designers ever had their designs produced as type, so most worked at drawing 'type' for reproduction in book titling etc. A notable female exception was Galina Andreyevna Bannikova (1901–1972), designer of the Bannikova and Baikonur families. I have little doubt that these designers, if working today, would have been happily producing their own fonts -- in the great Russian font software, of course --, so I'm content to think of them as type designers. The book was published in 1977, so it seems certain that at least one of these women has since died.</p>
      <p>Sophia Evgenyeva GANNUSHKINA<br>
      Born 1947, Moscow.</p>
      <p>Irina Alexandrovna GUSEVA<br>
      Born 1936, Moscow.</p>
      <p>Elizaveta Yakovlevna KRIVINSKAYA<br>
      Born 1907, Kharkov.</p>
      <p>Elena Alexandrovna TROFIMOVA<br>
      Born 1943, Moscow.</p>
