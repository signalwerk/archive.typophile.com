      <p>Actually, my article was the response to Indra’s earlier request for some names for her list.<br>
      Since I’m not sure about the point of these unmodrated lists, I decided to not search for actual (sometimes ancient) names, but more for the reason for what obviously is going wrong in our profession/society.<br>
      I’m quite afraid, that these lists might be mistaken by some people for »proving« the existence of females in the szene, even, they are sometimes already dead or just to be found on these lists. But not in features, articles, juries, on stage (see Typo London 2011, Raabs...), etc.<br>
      Although, it is great to see, that the names on the lists are much more than just the excuse-dingbats-calligraphy-kitty designeresses, people mostly think of, when they say: »but there are women...«</p>
