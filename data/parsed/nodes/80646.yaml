      <p>As someone with a technical background, I fully support respecting the work of type designers who design dingbats... or, even more to the point, <em>sorts</em>. Without them, we would have to write all our equations by hand.</p>
      <p>And music scores need to be typeset as well... and chess diagrams.</p>
      <p>At one point, needing a chess diagram for my web page, and desiring something legible and immediately recognizable, in drawing the symbols for chess pieces, I gave "sincere flattery" to some unknown (well, unknown to me, and at least <em>unsung</em>) type designer at Linotype:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/opening_4920.gif"></div><p></p>
      <p>rather than trying to undertake the daunting task of coming up with a clear and legible original interpretation of the chess pieces.</p>
      <p>EDIT: I considered this matter important enough to confess to my sin against some hard-working type designer, but I'm feeling less bad now. After doing some web search, I find that Linotype only has a more modernized and stylized form of chess symbols available, PIXymbols chess regular - and the classic styles of chess fonts have instead been digitized and made available by a company called Alpine Electronics - the classic one that also inspired me as Linares.</p>
