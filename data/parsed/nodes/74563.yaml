      <p>In the article linked above, the complaint is about three letters in Arial Hebrew: the samech (not in Israel's sample) is a circle, symmetrical, and also the yod and nun sofit, which are rectangles. You can see here: <a href="http://www.ascenderfonts.com/font/arial-bold-hebrew.aspx" title="http://www.ascenderfonts.com/font/arial-bold-hebrew.aspx">http://www.ascenderfonts.com/font/arial-bold-hebrew.aspx</a></p>
      <p>There have been similar complaints about the "j" in Futura, and it is not much imitated. Also the original m and n in Futura, which were symmetrical, were abandoned.</p>
      <p>See here Narkis Tam, which has a corner on the samech: <a href="http://new.myfonts.com/fonts/masterfont/narkis-tam/regular/characters.html" title="http://new.myfonts.com/fonts/masterfont/narkis-tam/regular/characters.html">http://new.myfonts.com/fonts/masterfont/narkis-tam/regular/characters.html</a></p>
