      <p>Israel,</p>
      <p>I was speaking perhaps in ignorance of what was meant, because I only skimmed over the original article. I think it looks a bit sterile aside from that, but that isn't always a bad thing.</p>
      <p>In my own design work, I have mostly chosen sans-serifs with small quirks and imperfections - or perhaps something more relaxed to them - especially for use with Serif fonts. Usually the stark sterility of many Sans looks jarring to my eyes against serif type. On the other hand, by itself sterile sans fonts have merit in my opinion. But they usually don't mix well with serif fonts, even stiff ones.</p>
