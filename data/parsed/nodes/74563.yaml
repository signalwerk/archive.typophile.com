      <p>Brian,</p>
      <p>What are you saying?</p>
      <p>Do you refer to the obvious Narkis-like design of the Hebrew, or the crude knock-off of the graceful Hevetica design for the Latin letters.</p>
      <p>Gorkin brilliantly added more curves to the Hebrew letters, and adjusted the stroke widths to match the stroke widths of Arial.</p>
      <p>But it's still heavily influenced by Tzvi Narkis zal (<a href="http://www.FontWorld.com" title="www.FontWorld.com">www.FontWorld.com</a> calls my version Neshika, or kiss, a play on words with Narkis' surname.</p>
      <p>Interestingly, I saw in posters created by a Jewish concentration camp inmate in the Holocaust Hebrew lettering which closely resembled the popular Narkis design, suggesting that the Narkis design originated by an unknown designer in Nazi Germany. If we study Narkis' other designs, clearly this design does not match.</p>
