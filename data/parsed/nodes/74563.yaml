    html: |-
      <p>Imo,</p>
      <p>Contrast is the difference between thick and thin strokes.<br>
      Natural is imperfect, natural cans be ugly, but often is pretty. Sterile is streamlined and refined until every curve has perfect tension, every kink is removed, and everything has lost personality. It can be bland.</p>
      <p>Neither is really good, bad, or perfect, but has it's own uses and limitations.</p>
