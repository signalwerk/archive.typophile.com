      <p>Thanks for the info and believe me, I'm not looking at this font because I love it. Someone wanted something similar in feel for this same company.  Its a matter of compromising between the jagged iciness and compressed negative spaces-- and a superior font.  </p>
      <p>I do know about Russel Square-- but thanks-- it is better but not quite right for this project.  I've looked through tons of display fonts and couldn't find anything else close.  May be just a matter of modifying an existing font for this purpose.</p>
      <p>Thanks for the tips!</p>
