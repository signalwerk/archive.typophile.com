      <p>I haven't seen an italic version before, but this is the same as the freeware font <a href="http://www.dafont.com/font.php?file=batman_forever&amp;page=1&amp;nb_ppp_old=10&amp;text=CHILL+CHAMBER&amp;nb_ppp=10&amp;psize=m&amp;classt=pop" rel="nofollow">Batman Forever</a>. Maybe the shear was done manually?</p>
      <p>There is an oblique version available of the, imho, superior typeface, <a href="http://www.linotype.com/12998/russellsquareromanoblique-font.html?PHPSESSID=34b93dae0d6ad41803fadb6bbab93932" rel="nofollow">Russell Square</a> that you might like to look at as well.</p>
