    html: "<p>I would give yourself more freedom with the letter forms to allow them to relate in a more plastic way. Think of the patterns squished together in ground beef. To me this would help with some other problem areas: the small shapes on either side of the S, the awkwardness of some of the overlaps, the too rigid relationship between ON. Maybe a ligature for ST? Is it inspired by writing the name in ketchup? Could that be a way to develop further in a tactile way? I see the reason, but I am not entirely convinced that the outer stroke is necessary.</p>"
    html_clean: "<p>I would give yourself more freedom with the letter forms to allow them to relate in a more plastic way. Think of the patterns squished together in ground beef. To me this would help with some other problem areas: the small shapes on either side of the S, the awkwardness of some of the overlaps, the too rigid relationship between ON. Maybe a ligature for ST? Is it inspired by writing the name in ketchup? Could that be a way to develop further in a tactile way? I see the reason, but I am not entirely convinced that the outer stroke is necessary.</p>"
