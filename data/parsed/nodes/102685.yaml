    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Unitgothic_news_5330.gif"></div><p></p>
    <p>The Unit Gothic series was released by Hamilton Manufacturing Co. in 1907. This sans serif family features one of the first multi width/weight type 'systems', anticipating the Univers font system by 50 years. This set of 7 fonts was designed to aid in press room efficiency and its incremental variation in widths gave poster printers unprecedented flexibility in fitting copy while using consistently harmonious fonts.</p>
    <p>This HWT release is the first ever digital version of these fonts. Each font contains 600 glyphs including Greek and Cyrillic character sets as well as alternate characters which are based on the actual special character production patterns from the Hamilton Wood Type Museum collection.</p>
    <p>The system features:<br>
    •HWT Unit Gothic 716 - 50% wider<br>
    •HWT Unit Gothic 717 - 25% wider<br>
    •HWT Unit Gothic 718 - (Standard width which others are based on)<br>
    •HWT Unit Gothic 719 - 25% narrower<br>
    •HWT Unit Gothic 720 - 50% narrower<br>
    •HWT Unit Gothic 721 - 62.5% narrower<br>
    •HWT Unit Gothic 722 - 75% narrower</p>
    <p>HWT Unit Gothic digitized by James Todd</p>
    <p>David Shields has written an essay for Slanted Magazine that gives a closer look at this font system and its place in history. Follow this <a href="http://issuu.com/slanted/docs/slanted19?mode=window&amp;pageNumber=59" rel="nofollow">link</a> to read the article online.</p>
    <p>View more details about this release on the <a href="http://www.hamiltonwoodtype.com/unit.html" rel="nofollow">Hamilton Wood Type Foundry</a> site.</p>
    <p>Special introductory pricing through May 31, 2013.</p>
