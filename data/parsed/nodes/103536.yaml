    html: <p>Hinting is design-specific, not only resolution-specific. So while it may make sense to say that for many type designs, particularly those for a particular set of writing systems, hinting may fairly soon become irrelevant for many significant uses, it isn't possible to make that claim about all designs, all writing systems and all uses.</p>
