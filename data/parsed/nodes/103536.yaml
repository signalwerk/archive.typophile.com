      <p>This has been discussed before (but putting it in General Discussion might help). I think hinting won't become irrelevant that soon, because modest-resolution screens will remain around for a while.</p>
      <p>Also consider that some scripts (like Chinese - not exactly irrelevant in the future :-) rely on a lot of internal detail.</p>
      <p>hhp</p>
