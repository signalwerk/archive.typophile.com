    <p>Hey Typophiles,</p>
    <p>Sorry if this is a silly question, but its something that's been on my mind for some time.</p>
    <p>Does the increase and access to high-resolution screens mean that hinted web-fonts will become irrelevant in the future? I might be missing something, but since the standard print resolution is 300 dpi and products available today like the Retina screen for Mac Computers (boasting around 220 dpi), will there be any reason to hint type in, say 5 years time?</p>
    <p>From what I understand, hinting seems to be the most laborious &amp; code-heavy part of type design, and many type designers outsource the work to 3rd-parties, so I imagine this would be great for small foundries with tight budgets?</p>
    <p>Seb</p>
