      <blockquote><p>Grzegorz isn’t looking for an archive or even a source format but what might be termed a transformation format.</p></blockquote>
      <p>You have one, you have the others. The purpose is the same: a textual translation that is fully reversible and lossless. Something that Eric S. Raymond in The Art of Unix Programming calls a <em>textualization</em>:</p>
      <blockquote><p>[Textualizers] degrade the [binary] representation as little as possible — in fact, they translate it reversibly and losslessly. This property is very important, and worth implementing even if there is no obvious application demand for that kind of 100% fidelity. It gives potential users confidence that they can experiment without degrading their data.</p></blockquote>
      <p>It also gives enough flexibility and precision to make fonts that push the technology to its extremes, something that just can’t be done with regular font editors, which make many assumptions behind your back, which make cross-format generalizations, et cetera.</p>
      <p>I once read on FontForge’s mailing list George Williams himself saying that TrueType binary is indeed a good, if not best, format for storing the TrueType font, exactly because all the data is in there. But still, you can’t edit the binary without an editor while staying completely sane, and by using the editor you lose the flexibility, you lose the precision and the confidence.</p>
