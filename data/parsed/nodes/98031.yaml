      <p>Now, TrueType outlines have no representation like that. Few people have mentioned TTX, but it’s still an XML that’s bulky by itself and that’s hard to parse or edit, either by hand or any standard Unix utility. What’s more, it doesn’t represent TrueType’s binary data close enough to make it a one-to-one conversion format.</p>
