      <p>I’m, of course, not denying the great engineering effort behind the Font Tools and TTX, and what Adam says about its specifics is indeed true. But the very choice of XML at its core is arguable not only in terms of a particular hype, or aesthetics, or even the difference in readability, but also in terms of some syntactic problems.</p>
      <p>XML is a tree-like structure, whereas font binaries are not: they are flat arrays with offsets and such. For example, there’s a common optimization method within <code>'cmap'</code> or <code>'name'</code> table, where two different entires make an offset to the same exact data (or even part of it) deeper in the table. Try representing that in XML without bending around the syntax at the level of a misuse. It’s just not adequate for the job and we end up with details that are lost in translation. That these are details doesn’t make it an issue that can easily be ignored, because you recompile a font, run a <code>diff</code>, see something has changed, and wonder what else could go wrong.</p>
      <p>Now if we move away from an XML representation, Python doesn’t seem like an obvious choice any longer, either. Therefore my opinion is that putting effort to improve TTX is not so promising as it seems. This of course doesn’t mean it’s not good or usable, because it certainly is. It’s just not <em>good enough</em> in hard-core font production.</p>
      <p>Regarding the feature file syntax, I must admit that I haven’t dug through OpenType Layout tables thoroughly enough, so I might be wrong about it after all. I’ve thought that using the syntax in its most explicit form (that is, defining rules in lookups of one kind, referring them in features, setting language systems to each feature, etc.) will translate pretty losslessly to the structures inside the tables, won’t it?</p>
      <p>Restrictive syntax that’s close to the way binary itself is structured, and accompanying stupid compiler are worthy in general. More stupid compiler means more optimizations have to be made at the syntax level, resulting in better source files for you and others to employ. It would also mean that you would have to learn and understand the technology rather well, and that’s a good thing in the end. Making the compiler stupid would also make it more deterministic and thus more reliable. (Still, an ideal compiler would be just smart enough to give you some hints how to optimize your code, but sufficiently stupid not to do it on its own discretion.)</p>
