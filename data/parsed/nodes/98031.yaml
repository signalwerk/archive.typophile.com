      <p>Most of the discussion above seems to dodge the issue. The issue is having an assembly language representation of the table contents. I would suggest writing one if none exists and one wants it.</p>
      <p>I would suggest it would be easiest to write such a thing as an s-expression language, the way Knuth did for tools like TFTOPL and PLTOTF, and to use Scheme or Common Lisp as the programming language, although s-expressions are easily handled in other languages. In Lisps there is no need to write a parser for s-expressions; you just read them in. (Expect to see Guile, a GNU Scheme implementation, gaining popularity as a programming language over coming years.)</p>
