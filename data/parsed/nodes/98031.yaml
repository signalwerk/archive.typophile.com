      <p>Both TTX and UFO would be same easy or same hard to parse if you like. I just wouldn’t consider UFO a mature format, particularly not a format that would be closely tied to any of the target technologies in the industry, i.e., either PostScript or TrueType. It’s the lowest common denominator between the two and while this can be useful in an early work environment, it makes it bad for fine-tuning and storage.</p>
      <p>In fact, TTX would be more adequate for the job, but it’s still a bulky XML/Python combo and the tool itself appears not to be maintained any more. I haven’t had any access to Microsoft’s software lately, so I can’t tell nothing about TTFDump.</p>
