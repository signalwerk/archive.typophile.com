  html: <p>Does anyone know of a way of storing TrueType outlines as human-readable ASCII text that could be easily translated to and from a <code>'glyf'</code> table bytecode? Similar to how PostScript Type 1 code can be assembled/disassembled with Type 1 Utilities or Adobe's FDK. There's of course TTX or GLIF, but I myself wouldn't count that, as they don’t read nor play well in standard Unix toolchain and versioning systems.</p>
  html_clean: <p>Does anyone know of a way of storing TrueType outlines as human-readable ASCII text that could be easily translated to and from a <code>'glyf'</code> table bytecode? Similar to how PostScript Type 1 code can be assembled/disassembled with Type 1 Utilities or Adobe's FDK. There's of course TTX or GLIF, but I myself wouldn't count that, as they don’t read nor play well in standard Unix toolchain and versioning systems.</p>
