      <p>Ps. When comparing .ufo with .ttx, one could say that .ufo requires "smart" tools while .ttx works with "dumb" tools. I.e. the transformation from .ufo to a final font requires a complex toolchain and there is no straightforward path which would guarantee that one .ufo would give you a particular .otf or .ttf. In other words, .ufo operates on an abstract level, and lots of information that has to go into .otf or .ttf is not included in .ufo, and therefore needs to be "invented" by the tool. On the other hand, .ttx operates on a lower level, and really is a very straightforward representation of .otf or .ttf. In other words, one could have a very different tool for compiling .ttx into .otf/.ttf, written in a different language -- but the results of the conversion would be the same. So the .ttx-to-.ttf process really is a straightforward combination, and it's a *stable* process. The .ufo-to-.ttf conversion is, well, something like going from HTML to PDF —&nbsp;lots of decisions need to happen in the software and those decisions are not "stable" in the sense of "not predetermined". </p>
      <p>For example, the same .ufo will yield you very different .ttf files depending on what software you use to convert (FontForge, Glyphs, RoboFont, TransType 4). But that's the nature of .ufo, as it's intended to be high-level, and deliberately leaves various decisions to tools.</p>
