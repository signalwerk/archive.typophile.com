    date_raw: 24 Jun 2013 — 10:34am
    votes: null
    html: |-
      <p>It really depends what you are planning to do. If you intend to catalog fonts in a readable form, or want to adjust a single value while leaving everything else intact, then a close-to-binary non-binary representation might be a good thing. But when making fonts, this is hardly relevant and may even turn out to be an obstacle, because a designer does not want to change a individual piece of information and rather do some design adjustment which causes a couple of pieces of information to change.</p>
      <p>For example, is it really necessary that a non-binary representation of <em>glyf</em> precisely reflects how x, y and point type are packaged? I don't think so because, while using flags to save some space, the information relevant for rendering shapes remains the same. Similarly, whether you use PPF1 or PPF2 subtables to store metrics adjustments in <em>GPOS</em> is irrelevant as to the information they hold, though one my save some space compared to the other.</p>
