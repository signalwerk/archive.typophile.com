      <p>Here are two illustrations why TrueType outline’s binary data would make a distinct textual representation, and how it could be useful.</p>
      <p>First. In the binary, each coordinate have corresponding bit flags telling about its properties. Particular combination of those flags indicate, for example, that a coordinate is stored as a single byte (a short version), or as two bytes (long). In an ideal situation all coordinates that could be stored as single bytes would be stored as so, and the rest would be stored as two bytes. In that case, a textual disassembler could make those default assumptions and represent the point (an off-curve one) simply as:</p>
      <p><strong>point off</strong> x y</p>
      <p>But some font editors or converters could make a lousy job of this optimization (as few system fonts on my machine I’ve tested happen to have it wrong with offsets in the compound glyphs). In that case the point would have a hint (or a cast if you prefer) and therefore look like this:</p>
      <p><strong>point off (x-long)</strong> x y</p>
      <p>You could just leave it as such, and the assembler would force the coordinate to be stored as a long value in the output bytecode, thus making a lossless round-trip conversion back into the original binary as nothing ever happened. But you could also delete the "long" cast and allow the assembler to build it with the default behavior, thus giving you a properly optimized version of the font.</p>
      <p>Second. Flags that are exactly the same for a given series of points are not repeated, but are indicated to be repeated a number of times to save space in the binary. This could be presented as:</p>
      <p><strong>point off</strong> x y, x′ y′, x″ y″</p>
      <p>Now because in the binary, contour breaks are independent of both point and flag listings, this optimization can continue even with a contour boundary, giving a representation like so:</p>
      <p><strong>point off</strong> x y, <strong>end</strong> x′ y′, x″ y″</p>
      <p>This would be different than points with flags that are same but made explicit for each point in the binary:</p>
      <p><code><strong>point off</strong> x y<br>
      <strong>point off end</strong> x′ y′<br>
      <strong>point off</strong> x″ y″</code></p>
      <p>Formats like TTX or UFO store contours as separated lists of points, thus make the two scenarios indistinguishable and some of the binary data simply gets lost.</p>
