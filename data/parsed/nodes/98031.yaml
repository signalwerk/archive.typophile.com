      <p>"I'm still haunted by the memory of standing in the non-Latin archive room at Linotype [...] looking at the shelves of archive tape media of early digital type, realising that there were no machines that could read the tapes"</p>
      <p>:) But we still go to the archives of the drawings those tapes came from, which made it pretty obvious to me that the ideal archive format for a typeface style is not a TrueType or Type1 font, or the "lowest common denominator" or even the highest, but the richest and most attractive format to type developers of typeface families. </p>
      <p>A fully hinted TT glyph can have all the information of a Linotype drawing. The representation of that, and the charts that accompanied the folios of drawings, can be held in private sfnt tables, but you don't want your source data the way sfnt's are: good for picking which tables to deal with this century, and which to deal with next century. Founders have complete and immediate needs, as we know. </p>
      <p>This includes storing everything from the ideals of a <em>typeface</em> to the size instances of each glyph,  <em>and</em> how they all (styles and glyphs) work together <em>size dependently</em>. Not any TrueType or Type1 fonts I know of can do that, so how to store all this sfntishly? (especially when one don't need to...)</p>
