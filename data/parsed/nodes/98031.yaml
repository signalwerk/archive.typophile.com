      <p>I'll give my word of support for TTX. It's not free of flaws, and is XML (which Grzegorz seems to particularly dislike), but in my opinion is currently the by far closest to Grzegorz's aims. </p>
      <p>I've been working with TTX for a long time now. You need to consider two aspects: there is the .ttx format, and there is the fontTools/TTX suite of tools, written in Python. </p>
      <p>The .ttx format is, perhaps unfortunately, not documented by means other than the source code in Python. But this by itself may not be a big problem, because fontTools/TTX essentially defines a *transformation path* from the binary SFNT structure to human-readable XML, and back. And, after all, it is the binary SFNT structure that remains *canonical* in terms of the specification. The .ttx format is, and will remain, dependent on the binary structure — not the other way around. </p>
      <p>Contrary to what Grzegorz suggests, fontTools/TTX is being maintained. The SFNT structure doesn't change much, because the OpenType font format doesn't change hugely. But whenever a new version of the OpenType format was published, fontTools/TTX was typically patched quite quickly. Adobe have been using fontTools/TTX extensively in AFDKO, and contributed a lot of code to fontTools/TTX. So in fact, if you use Adobe FDK for OpenType, you're using fontTools/TTX already anyway. </p>
      <p>One great missing thing of relevance today is fontTools/TTX modules (and therefore the .ttx format) for the AAT tables. Apart from that, all is well supported. </p>
      <p>There are a few SFNT tables where I use .ttx as my source format when I build fonts, "name" table being one of the most prominent. </p>
      <p>Grzegorz, if you manage, perhaps, to overcome your dislike of Python and XML —&nbsp;I think you'd do the community a great service, should you decide to contribute some code to fontTools/TTX, or build something around it :) </p>
      <p>Best,<br>
      Adam</p>
