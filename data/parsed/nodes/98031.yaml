      <blockquote><p>It’s not free of flaws, and is XML (which Grzegorz seems to particularly dislike)…</p></blockquote>
      <p>I dislike XML only insofar as it’s a <em>markup</em>, whereas fonts are <em>data</em>. Markup languages indeed are yet unbeaten technology if we consider, well, markup — description of documents of mixed content and loose structure. But using a markup-like language for describing plain data is an overkill both syntactically and processing-wise. I suppose XML is being used almost instinctively because of its familiarity and the parsers available in most programming languages out there, but this doesn’t mean it’s always a best choice for a given problem domain. Think the XML vs. JSON debate from a few years back.</p>
      <p>Given the open architecture of the <code>sfnt</code>, I can imagine a development format that would involve all the basic, or native, languages for each type of technology being used in a font. That would be:</p>
      <ul>
      <li>Type 2 Charstring for PostScript outlines</li>
      <li>the feature file language for OpenType Layout</li>
      <li>respective input files of AAT and Graphite technologies.</li>
      </ul>
      <p>They are all great for hand editing, machine parsing, versioning and storage, and they all compile directly and losslessly into the font binary. These files and their compilers could give a basic, very reliable and flexible workflow. Different kind of programs, either filter-like or more abstract editors, could be built on top of that and used interchangeably. In fact, that’s exactly what UFO got right originally: a set of separate, domain-specific files. But it fell short with GLIF and Property Lists: a weak outline format, and a can of worms in <em>ad hoc</em> plist data, respectively. Swap all this for a native “language” for the core TrueType tables, including the <code>glyf</code> data and the hinting bytecode, and the image above is complete.</p>
