      <p>It seems pretty obvious to me that the ideal archive format -- and probably the ideal source format* -- for a TrueType font is ... a TrueType font. Now, obviously, this is the answer to a different question than 'What is the ideal archive format for a digital typeface design?', so we should be clear what we're asking about, and why.</p>
      <p>I'm still haunted by the memory of standing in the non-Latin archive room at Linotype when it was being prepared for transfer to the University of Reading, and looking at the shelves of archive tape media of early digital type, realising that there were no machines that could read the tapes. [At Reading, Gerry Leonidas was able to track down a company that still makes the special filing cabinets to hold the large hanging files used for Linotype's paper drawings; I think the tapes were junked.]</p>
      <p>* The sfnt table structure seems to me such an obviously good source format. It enables you to store most data natively in the target font format, and if you want to store independent source data, e.g. visual hints, you can always include private tables that can be read by font tools. This is how VTT and VOLT already work: the .ttf is the source file, and the tool data is stored in private tables until the font is 'shipped'. The Microsoft math font tool goes one better, and simply writes and reads the MATH table directly, which seems a good option for any tool that doesn't need to present the user with data that isn't written to the final font tables.</p>
