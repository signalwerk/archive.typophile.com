    html: |-
      <p>Grzegorz, </p>
      <p>OK, I now get where you're heading. You really want the "ultimate low-level" description, assembly-level. I think you're right that it would have value after all, and I agree that TTX is perhaps not the ideal approach for that. </p>
      <p>Microsoft has produced some commandline tools: ttoasm.exe and ttodasm.exe, which work in a way that they're "stupid" compilers and decompilers. There is a set of .fmt format files (one per each SFNT tables supported by the tool, which is GSUB, GPOS, GDEF, JSTF and BASE). A format file for a given table defines the plain-text representation of that table, and at the same time provide information for the how the plain-text representation is to be transformed into binary, and vice versa. You can download it as a "Windows self-extracting EXE" archive from <a href="http://www.microsoft.com/typography/tools/tools.aspx" title="http://www.microsoft.com/typography/tools/tools.aspx">http://www.microsoft.com/typography/tools/tools.aspx</a></p>
      <p>I recommend that you take a look at it. Inside, you'll find TTOAsm.zip and TTODasm.zip, which include the tools, some documentation, and the .fmt files for all five OTL tables. You can run the tools through Wine (cxstart) on any OS. </p>
      <p>For example, the GSUB format file looks like this (it's an excerpt): </p>
      <p><code>DEFINE ZERO=0<br>
      DEFINE MAXCOUNT=0xFFFF<br>
      ; **** GSUB Table ****<br>
      GSUBHeader, HEAD {<br>
      fixed32, 0x00010000                     ; GSUBHeader version<br>
      Offset, ScriptList, NOTNULL<br>
      Offset, FeatureList, NOTNULL<br>
      Offset, LookupList, NOTNULL<br>
      }<br>
      ; **** Scripts ****<br>
      ScriptList, TABLE {<br>
      Count, 1, MAXCOUNT						; ScriptCount<br>
      Array, $T1, ScriptRecord<br>
      }<br>
      ScriptRecord, RECORD {<br>
      Tag                                     ; Tag<br>
      Offset, Script, NOTNULL                 ; An offset to a Script table to be generated<br>
      }<br>
      [...]<br>
      LookupList, TABLE {<br>
      Count, 1, MAXLOOKUPCOUNT               ; LookupCount<br>
      Array, $T1, Offset, Lookup, NOTNULL : $IGSUBLookupIndex<br>
      }<br>
      Lookup, TABLE {<br>
      uint16, 1, 8             	            ; LookupType<br>
      uint16                                  ; LookupFlag<br>
      Count, 1, MAXCOUNT                     ; SubTableCount<br>
      Array, $T3, Offset, SubstTable, NOTNULL, $T1<br>
      }<br>
      CoverageFormat1, TABLE {<br>
      uint16, 1                               ; Format 1<br>
      Count, 1, MAXCOUNT                     ; GlyphCount<br>
      Array, $T2, GlyphID, 0, MAXGLYPHID<br>
      }<br>
      CoverageFormat2, TABLE {<br>
      uint16, 2                               ; Format 2<br>
      Count, 1, MAXCOUNT                   	; CoverageRangeCount<br>
      Array, $T2, RangeRecord<br>
      }<br>
      [...]</code></p>
      <p>So it essentially is a "schema" for the GSUB table in a plain-text form. And then, an actual example GSUB table definition would be (also an excerpt): </p>
      <p><code>GSUBHeader theHeader<br>
      0x00010000	;Version<br>
      theScriptList	;Offset to ScriptList table<br>
      theFeatureList	;Offset to FeatureList table<br>
      theLookupList	;Offset to LookupList table<br>
      ;****************************************<br>
      DEFINE MAXLOOKUPCOUNT = 10<br>
      DEFINE MAXFEATURECOUNT = 5<br>
      ScriptList theScriptList<br>
      1	;ScriptCount<br>
      'arab'	;ScriptTag = "arab"<br>
      Script1	;ffset to Script table<br>
      Script Script1<br>
      DefaultLangSys	;Offset to default LangSys<br>
      0	;Number of LangSysRecords<br>
      LangSys DefaultLangSys<br>
      NULL 	;Lookup order = null<br>
      0xFFFF	;No req'd Feature Index<br>
      5	;Number of Feature Indices<br>
      0	;Feature Indices<br>
      1<br>
      2<br>
      3<br>
      4<br>
      ;****************************************<br>
      FeatureList theFeatureList<br>
      5	;FeatureCount<br>
      'init'	;FeatureTag = 'init'<br>
      FeatureInit  	;Offset to Feature table<br>
      'medi'	;FeatureTag = 'medi'<br>
      FeatureMedi	;Offset to Feature table<br>
      'fina'	;FeatureTag = 'fina'<br>
      FeatureFina	;Offset to Feature table<br>
      'liga'	;FeatureTag = 'liga'<br>
      FeatureLiga	;FeatureTag = 'mset'<br>
      FeatureMset	;Offset to Feature table<br>
      [...]<br>
      ;*****  Arabic Ligature Sub Table  *****<br>
      LigatureSubstFormat1 SubstTableLigaBase<br>
      1	;Format<br>
      CoverageLigaBase	;Offset to Coverage<br>
      5	;Ligature Set Count<br>
      LigatureSet1<br>
      LigatureSet2<br>
      LigatureSet3<br>
      LigatureSet4<br>
      LigatureSet5<br>
      ;*****  0165	;'shaddamedial'<br>
      LigatureSet LigatureSet1<br>
      0x0003<br>
      LigatureSet1Ligature1<br>
      LigatureSet1Ligature2<br>
      LigatureSet1Ligature3<br>
      Ligature LigatureSet1Ligature1<br>
      0x0154	;'shaddawithfathamedial'<br>
      2<br>
      0x015F	;'fathamedial'<br>
      Ligature LigatureSet1Ligature2<br>
      0x0155	;'shaddawithdammamedial'<br>
      2<br>
      0x0161	;'dammamedial'<br>
      [...]</code><br>
      and so on. </p>
      <p>This is very low-level, in fact the assembly level. I don't know how many .fmt schemas Microsoft created and for how many tables, but this "language" that Microsoft created could be used and extended in an opensource tool. </p>
      <p>An alternative might be an approach similar to Pomax's, who authored a generic "binary parser generator", and then defined a language for binary parsers, where, as one example, he created a parser spec for the OpenType font format:<br>
      <a href="https://github.com/Pomax/A-binary-parser-generator" title="https://github.com/Pomax/A-binary-parser-generator">https://github.com/Pomax/A-binary-parser-generator</a><br>
      <a href="https://github.com/Pomax/A-binary-parser-generator/blob/master/OpenType.spec" title="https://github.com/Pomax/A-binary-parser-generator/blob/master/OpenType.spec">https://github.com/Pomax/A-binary-parser-generator/blob/master/OpenType....</a></p>
      <p>This approach could be refined and turned into a "converter", with text-to-binary and binary-to-text conversion. In a way, Pomax's OpenType.spec format description is rather similar to Microsoft's .fmt description for tools. </p>
      <p>Of course the "big question" when inventing such a format is the typical one: what delimiters should be used, what to do with whitespace, etc. etc. I guess one reason why people choose XML these days is because there, these questions are simply ANSWERED (and very well specified). So even though XML may not be the best format for a particular usage scenario, it's a well-defined one and they don't need to start a debate about what the "ideal" format should be. :) With your project, a debate will surely start if you propose some kind of notation (e.g. similarly "looking" to Microsoft's TTOAsm, or to Pomax's parser format, or to the Adobe FEA structure or to the Adobe AFM structure or to the plain-text Type 1 form, or to Ikarus or to whatever else, or you come up with your own). Some people will "like it", others will "hate it", others will "like it but propose improvements", others will "like it as it was before the improvements but not now". :)</p>
      <p>So, as it's often the case, the probably biggest value of XML is that it exists at all :D There is a big community of tools, schemas, workflows, "best practices" etc. around it, which people can cherry-pick rather than invent their own. The same can be said, I guess, about things like PHP. PHP is not a really good language, but it's easy to deploy because you don't have to invent a lot of things :)</p>
      <p>Best,<br>
      Adam</p>
