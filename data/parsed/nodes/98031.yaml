    votes: null
    html: |-
      <p>Thank you, Adam. That’s a lot of cool software I wasn’t aware of (Pomax simply never stops to amaze me). This indeed is low as it can be, lower and more verbose than anything I thought of, but it’s good to have it as an option, plus already mentioned VOLT sources, which I must look into.</p>
      <p>Karsten, yes, such tools would be of questionable utility to many designers indeed. Still, they are intended primarily for post-production and engineering side of things, where all this could matter. It’s not only about space savings (though that’s important these days), but also about performance, and about doing tricks that push the technology to its extremes, either for testing purposes or for producing non-standard or special-purpose fonts. And, as Adam mentioned briefly, it’s often the best way to learn to think in terms of font internals, what I believe makes you build better fonts in general.</p>
      <p>If I recall correctly, Dave Crossland once said that he would like to see a standard build environment for font development, a kind of <code>./configure; make; make install</code> for fonts. That would be another perspective why it would be really good to have some concise and effective, not too low-level, but still deterministic languages for font production.</p>
