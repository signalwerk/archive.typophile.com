      <p>I haven't dug into sfntly before, but as I'm reading briefly through the source, it looks like its dumps are only informative and don't print the actual glyph data.</p>
      <p>Karl, it basically would be as simple as that; a plaintext description of data contained in the <code>'glyf'</code> table that could be compiled and fused into a font binary directly. This would allow for storing and versioning TrueType outlines in a manner similar to PostScript or MetaFont sources. But as Khaled said, there may be no such thing available today, not publicly anyway.</p>
