      <p>Ps. Contrary to what you may believe, the Adobe FEA syntax is not at all a very good representation of the OpenType Layout tables. There are many things that aren't supported by the FEA syntax. There are aspects of FEA where it makes generalizations and unifications which obscure the underlying complexities of the binary font data. And there are many many cases where the same binary situation can be expressed in a huge number of ways using FEA. </p>
      <p>Adobe's makeotf compiler adds additional limits, since it does not "understand" many aspects of FEA. FontForge's implementation is marginally better is some aspects, but worse in others. But that's a different point of discussion. </p>
      <p>I use FEA all the time, and I love it, most of the time. But it's not an exhaustive format. It makes it easy to develop OTL in 95% of cases, but really hard in the remaining 5%. </p>
      <p>.ttx is actually much better in that regard. It follows the OTL structure closely, and you can express more with it than with FEA. At the same time, of course, .ttx is more awkward to work with, well, because OTL is a bit awkward. :)</p>
      <p>FEA has of course its merits. It gives simplicity to what is actually inside a rather complex structure (OTL binary tables, that is). But by allowing, or applying the simplification, it sometimes obscures or even malforms some of the complexities. </p>
      <p>Admittedly, FEA got a bit better over the years. Initially, it was almost just a "prototyping" language for OTL. These days, it's allows for more control, but still leaves a large undefined area, which a tool needs to fill. In other words, it's not a fully explicit format. Different tools that compile FEA to OTL will yield different results. In that sense, it's more akin to UFO. </p>
      <p>FEA is good for how it's being used today — but, truing to understand your rationale, I'd say it's not a good format for your purposes. Certainly it's not round-trip-safe.</p>
