      <blockquote><p>UFO and RoboFont ended this kind of discussion, I thought?</p></blockquote>
      <p>Entirely possible that I am looking at this the wrong way but below are the text results of the same glyph data as taken from a TrueType file decomposed in TTX and then the same taken from the UFO file [EDIT] (generated with FontForge as I do not currently have access to RoboFont):</p>
      <dl><strong>TTX:</strong>
      <dl>&lt;TTGlyph name="A" xMin="50" yMin="0" xMax="1698" yMax="1648"&gt;<br>
      &lt;contour&gt;<br>
      &lt;pt x="50" y="1648" on="1"/&gt;<br>
      &lt;pt x="1698" y="1648" on="1"/&gt;<br>
      &lt;pt x="1698" y="0" on="1"/&gt;<br>
      &lt;pt x="50" y="0" on="1"/&gt;<br>
      &lt;/contour&gt;<br>
      &lt;instructions&gt;&lt;assembly&gt;<br>
      &lt;/assembly&gt;&lt;/instructions&gt;<br>
      &lt;/TTGlyph&gt;<br>
      </dl>
      <p><strong>UFO:</strong></p>
      <dl>&lt;glyph name="A" format="1"&gt;<br>
      &lt;advance width="1748"/&gt;<br>
        &lt;unicode hex="0041"/&gt;<br>
        &lt;outline&gt;<br>
          &lt;contour&gt;<br>
            &lt;point x="50" y="1648" type="line" smooth="no"/&gt;<br>
            &lt;point x="1698" y="1648" type="line" smooth="no"/&gt;<br>
            &lt;point x="1698" y="0" type="line" smooth="no"/&gt;<br>
            &lt;point x="50" y="0" type="line" smooth="no"/&gt;<br>
          &lt;/contour&gt;<br>
        &lt;/outline&gt;<br>
      &lt;/glyph&gt;<br>
      </dl>
      </dl>
      <p>Grzegorz, is the second set of data any easier to parse?</p>
