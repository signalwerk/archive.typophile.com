    html: "<p>@Dave: As regards the private tables, at least, VOLT data and afaik VTT data too are not binary but text. And reading/writing tables from sfnt structure fonts is trivial. As regards all others, the question is whether a) design/production data is meant to be condensed, with final/binary data to be extracted from it with help of additional mechanisms, or whether b) design/production data and final/binary data are essentially the same in terms of content and structure, demanding only light conversion when generating the latter out of the former. In case of a), a TTF is not a good design/production/archive format, containing too much and redundant data. In case of b), it is. And the way fonts are produced today basically reflects b), if alone because font editors work that way.</p>"
