      <p>Grzegorz, </p>
      <p>I hear what you're saying. However, I feel that you may be focusing too much on the color of the summer jacket. I mean, we're looking for a suitable piece of clothing for the right climate. Let's say SFNT is chilly summer weather. The .ttx format may have a somewhat out-of-fashion color or stylization, but at least it is a summer jacket. It's not a winter jacket nor a bathing suit. It is a good summer jacket, actually, it fits well and does the job. OK, it may be a bit out of fashion now — but is fashion a good criterion for making such choices?</p>
      <p>.ttx was created in the time when XML was "the new thing" and was thought to be "a great method to express everything in human-readable text form". Sure, we do know now that it may not be a perfect fit for everything, and perhaps a different notation could be *marginally* better for a human-readable source form of SFNT. </p>
      <p>But it really *is* good. When developing fontTools/TTX, Just van Rossum put *a lot* of thought into the best possible representation of various SFNT fields, and I agree with like 99.5% of his choices. I like .ttx much more than .ufo. I feel that .ufo overuses the .plist concept, which may be simpler to process but is not very readable. All those "key"/"array" alternations — they don't read well, and are just meaningless overhead. "Key key key key", "array array array array". That could be expressed much more elegantly in something simpler, like JSON. </p>
      <p>But with .ttx, it's different. I do like the fact that the element names are meaningful, that in most cases data is expressed using elements rather than attributes, because it allows to visualize the ordering of various SFNT data structures very closely. </p>
      <p>Let me put it this way: for years, I could not make sense of what SFNT looks like. I did not understand the format, I could not visualize it in my head. The moment I decompiled a .ttf into .ttx using fontTools/TTX, I had a revelation. I finally got it. Within an instance. I only had such a moment once before, when I understood how computers work after learning some simple 6502 assembler in Atari 130XE :) </p>
      <p>.ttx has been used in many many projects by a large number of font developers. It's been tested with thousands of fonts (actually, tens of thousands). fontTools/TTX is practically bug-free and very, very stable. The data structure for each table is very well designed, it follows the SFNT structure quite natively, with just a few exceptions, where they actually make sense. </p>
      <p>It even makes sense that it uses ISO 8859-1 rather than UTF-8 (really, it does). </p>
      <p>It's certainly not a "self-compiling" format, i.e. it does not provide all the inherent structure within the data (so that the compiler could be completely "stupid" and the same routine could work for all tables). Perhaps you're looking for something like that? I don't know. </p>
      <p>As I said, apart from some missing tables, for which support would be hugely welcome, and better documentation — both the fontTools/TTX and .ttx are actually close to perfection. Just van Rossum is a very modest man, but I think his development of fontTools/TTX and the .ttx format stand among the greatest achievements within font technology. Thanks to Python, it works everywhere, is easy and elegant to work with. In fact, the seemingly low maintenance of the code these days can really be attributed to its stability. Most "biggies" are done, all small things are also done, and it just works. </p>
      <p>There are a few things that aren't done, they're all "biggies" — like AAT support. Since Apple is currently the largest computer company, the worldwide deployment of AAT "consuming" platforms is quite huge (especially due to iOS). When fontTools/TTX was started, the importance of AAT was marginal, and OpenType Layout was seemingly the only thing of interest. Today, it's much less so. So I'd be very grateful if anyone stepped up and contributed AAT support to fontTools/TTX. </p>
      <p>But other than that — I personally think that developing "something completely different" from scratch to rival with .ttx is a waste of energy. Again, this is just my personal view. </p>
      <p>.ttx does the job, is a very good low-level source format that compiles into SFNT natively, works well with versioning systems, is well designed, elegant, easily readable (among the easiest XML formats I know), solid, stable, and — in my personal opinion — rather beautiful. </p>
      <p>If Just van Rossum is reading this — Just, I can say to you again what I've said several times: thank you, thank you, and once again, thank you. This piece of software you've written has allowed me to do things with fonts that I would have otherwise not been able to achieve. On countless occasions. </p>
      <p>Roger,<br>
      A.</p>
