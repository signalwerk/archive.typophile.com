    html: |-
      <blockquote><p>The UFO format […] is ideal for storing font data in a readable form, and converting back to binary.</p></blockquote>
      <p>Malcolm, I have to disagree. It’s not an ideal archive nor conversion format. It’s pretty primitive in what it can represent and how, thus it’s bulky, and it loses much of the production details of both PostScript/CFF and TrueType binaries. For now, lack of any kind of hinting representation is probably the most notorious example.</p>
      <p>I think the unbeatable format for developing or archiving fonts with PostScript outlines is a raw PostScript Type 1 code. Type 1 is an acknowledged and stable technology in the industry, with lots of freely available utilities such as the good old Type 1 Utilities. It’s also a format that has code-like qualities: it’s plain text that is concise and can be edited by hand, versioned and manipulated with standard Unix tools and filters. Furthermore, it translates practically losslessly into the CFF in an OpenType binary.</p>
      <p>Real-life example: I have a bunch of PFAs I want to merge with Adobe's <code>mergeFonts</code> utility and bake a final OTF with <code>makeotf</code>. Before that, I have to wipe out any encodings in the PFAs to avoid conflicts on merge. So I disassemble them into raw Type 1 code with <code>t1disasm</code>, pipe it through <code>sed</code> with a simple regex, and assemble back into PFAs with <code>t1asm</code>, all in a single command:</p>
      <p><code>t1disasm enc.pfa | sed '/^dup [0-9][0-9]* \/..* put$/d' | t1asm --pfa &gt; notdef.pfa</code></p>
      <p>This is the simplest case I could think of now; please see, for example, the build script of my Kontrapunkt Pro project at <a href="https://github.com/grzegorzrolek/kontrapunkt-pro/" title="https://github.com/grzegorzrolek/kontrapunkt-pro/">https://github.com/grzegorzrolek/kontrapunkt-pro/</a> for a much broader illustration.</p>
      <p>Now, TrueType outlines have no representation like that. Few people have mentioned TTX, but it’s still an XML that’s bulky by itself and that’s hard to parse or edit, either by hand or any standard Unix utility. What’s more, it doesn’t represent TrueType’s binary data close enough to make it a one-to-one conversion format.</p>
