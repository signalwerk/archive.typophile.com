    html: |-
      <p>Thomas, </p>
      <p>of course FontLab Studio “knows” which accents are for uppercase. </p>
      <p>For example, if you’re generating the glyph “Aacute”, FontLab Studio takes the glyph “A” as the first composite. </p>
      <p>For the second composite, it tries to use a glyph named “acutecomb.case” (if it is found, it will not be shifted up). If the glyph is not present, FontLab Studio checks for “acute.case” (and if found, it will not be shifted). </p>
      <p>If that is not present, FontLab Studio checks for “acutecomb” and if found, it shift the component up by the difference of caps height and x-heights (as specified in Font Info). In absence of that glyph it does the same for “acute”. </p>
      <p>If you wish to use a different suffix for your uppercase component glyphs, make a copy of “alias.dat” in your user folder and in there, replace all “.case” by “.c” or “.uppercase” or whatever your preferred suffix is.  </p>
      <p>Adam</p>
