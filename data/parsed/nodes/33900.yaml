      <p>Yes, you can have complete control over the position of automatically placed accents. See the “Anchor Layer” chapter in the FontLab manual.</p>
      <p>If you do not want to go the anchor route, the default position of accents for caps is determined by the difference between the x-height and cap height. The position of the accent is offset vertically by the difference. For instance, if your cap height is 700 and your x-height is 500, the accents will be shifted up by 200 when automatically generating accents for caps. So, by altering the cap height, you can control where the cap accents are automatically positioned. (Note: You don’t have to alter it permanently when doing this. You can change it back after generating the accented glyphs.)</p>
