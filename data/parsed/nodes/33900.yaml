  html: |-
    <p>Is there a way to determine or control the height the accent is placed above Upper case glyphs using Create Glyphs. I have placed all my upper and lower case glyphs into FL and all the accents such as the circumflex, tilde and grave. If I then select an empty lowercase accent glyph such as aacute or agrave the glyph is created using a composite letter and correct accent, the height of the accent above the glyph is determined by the height of that accent in it’s own window.<br>
    If I use the same process for the uppercase accent glyphs such as Adiereesis the accent seem to appear very high up above the glyph. Is a there a way to control the height of the accent when used with uppercase glyphs.</p>
    <p>Rr</p>
    <div class="forum-topic-navigation clear-block"><a href="/node/34355" class="topic-previous" title="Go to previous forum topic">‹ Pixel fonts in Fontographer</a> <a href="/node/34005" class="topic-next" title="Go to next forum topic">Printing problems with a PDF ›</a></div>
