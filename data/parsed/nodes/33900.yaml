    html: |-
      <p>&gt; For example, for a macron to ride over a capital letter,<br>
      &gt; make up a glyph named “uni0304.case”? Or, since it won’t<br>
      &gt; have a unicode number &amp; will never make it into a PDF<br>
      &gt; file anyway, use “macron.case” for the name?</p>
      <p>It may make it into a PDF if you map it to the basic (lowercase) variants through the “case” feature (hence the glyphname suffix). </p>
      <p>You’d most likely include OpenType Layout code in your font such as: </p>
      <p><code>feature case {<br>
        sub macron by macron.case;<br>
        sub uni0304 by uni0304.case;<br>
      } case; </code></p>
      <p>If your font includes only the spacing macron (named “macron”), I’d call the glyph “macron.case”. If your font also includes the combining macron (“uni0304”), then perhaps it would make sense to include a combining uppercase variant as well (“uni0304.case”). </p>
      <p>Regards,<br>
      Adam</p>
