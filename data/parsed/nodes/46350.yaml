    <p>I've been trying to find the 'ct' ligature, so that i can copy and paste it on writing documents, but so far i have had no success. Nor, do I know what the shortcut, if any will pull it up in OS X. </p>
    <p>Since those on here are far more knowledgeable than I; I'm hoping that someone has a solution for me =). </p>
    <p>Thanks!</p>
    <p>Jon.</p>
