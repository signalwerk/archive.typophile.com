    html: |-
      <p>This might turn into an interesting challenge for you. First of all, there's no standard "shortcut" for the c_t ligature. Second, *if* a font has the c_t ligature, that glyph will be either <strong>un</strong>encoded or encoded in the PUA block because that ligature is not part of the Unicode repertoire (unlike the s_t ligature at U+FB06 and other ligatures that were encoded for compatibility reasons).</p>
      <p>Then, assuming the font has the c_t ligature, there are two scenarios:<br>
      1. If the glyph was encoded in the PUA block, you'll be able to insert it in most applications (e.g. Word, InDesign) and you're likely to find it at codepoint U+E077. <a class="freelinking external" href="http://www.myfonts.com/fonts/adobe/garamond/adobe-garamond/opentype-ps/386710/character/E076/UNI78/1/" rel="nofollow">An example of a font with encoded c_t ligature is Adobe Garamond Pro</a></p>
      <p>2. If the glyph was not encoded, you will need an OpenType-savvy application (e.g. Illustrator, InDesign) to access it. <a class="freelinking external" href="http://www.myfonts.com/fonts/adobe/arno/" rel="nofollow">An example of a font with <strong>un</strong>encoded c_t ligature is Arno Pro</a><br>
      Note: unencoded glyphs are not accessible via Windows Character Map, nor via Mac OS X Character Palette.</p>
