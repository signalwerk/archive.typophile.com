    <p>A self-introduction: I am just someone with a little interest in fonts and typography and happened to find something called FontForge to play with.</p>
    <p>This is my first font. Today I want to learn basics about spacing, so I typed a line of "noonnoon"s. Here comes a problem. My font begins with this strange-shaped /o/, so I don't want to change it. Does this /o/ look fit with my /n/? Is there any suggestions to make this /n/ better fit? Finally, how is the current spacing looking?</p>
    <p>Critiques welcomed and wanted! Thank you all!</p>
