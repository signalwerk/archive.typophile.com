  - id: 493069
    user: 1551
    date: 2012-01-28T20:56:00
    date_raw: 28 Jan 2012 — 8:56pm
    votes: null
    html: <p>Because the other shapes are unconventional, the more conventional n looks like he's come to the wrong party with the wrong clothes. I think the n needs to be more wild and crazy, but I suspect that you'll have to take it a different direction than the o to make it work. Eg make it wider but bring the right foot in--which it was once in manuscript form. This is nicely inventive, but needs more discipline, once you figure out how to make the forms play together. You might have a look at both <a class="freelinking external" href="http://www.fontshop.com/fontlist/super_families/ff_fontesque/" rel="nofollow">Fontesque</a> and <a class="freelinking external" href="http://www.fontshop.com/search/?q=hobo" rel="nofollow">Hobo</a>.</p>
