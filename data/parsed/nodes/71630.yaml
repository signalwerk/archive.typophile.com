    html: |-
      <p>Welcome to Typophile, and have fun developing your first typeface.<br>
      Personally, I don't think the two go well together, but that is always hard to tell with only two letters. You will get more useful feedback when you come up with, say, ten glyphs (or letter shapes).</p>
      <p>My recommendation, when starting a font around the idea of a single letter form, continue with similar forms first (round shapes like e, c, b, s etc.) before starting with the more remote shapes. Good luck and let uns see how it develops.</p>
      <p>Andreas</p>
