    html: |-
      <p>Yang, is this for text or display?</p>
      <p>For text the most important thing is subtlety. It's not that<br>
      you can't have unorthodox shapes, it's that they have to<br>
      be applied with the gentlest hand.</p>
      <p>In contrast, for a display face any unorthodoxy has to be<br>
      obvious, and it has to be applied consistently.</p>
      <p>So for example your "egg" motif could be applied to certain<br>
      important characters if this is a text face; things like the "n"<br>
      don't absolutely need to have it. But if this is a display face<br>
      making the "n" wider at the bottom might be a good idea.</p>
      <p>hhp</p>
