      <p>The Type Directors Club is proud to present:</p>
    <p>The Night of the Italians</p>
    <p>Thursday, October 15 at 6:00pm — 9:oopm</p>
    <p>Panel discussion moderated by Paola Antonelli<br>
    Louise Fili, Louise Fili Inc. (louisefili.com)<br>
    Francesco Cavalli, LeftLoft (leftloft.com)<br>
    Massimo Vignelli, Vignelli Associates (vignelli.com)<br>
    Matteo Bologna, Mucca Design (mucca.com)</p>
    <p>SVA Theatre 333 West 23 Street (between 8th and 9th Avenues)</p>
    <p>TDC Member: $15<br>
    Non Member Students: $20 (with proper id)<br>
    Non Members: $25</p>
    <p>To register please email <a href="mailto:director@tdc.org">director@tdc.org</a> or call 1-212-633-8943</p>
