  html: |-
    <p>I’m looking for a non-Clarendon (read the “I saw Clarendon on 9 magazines post”) slab serif to use for display type. Something that is not too “western” —I’m not looking to brand anything with it. Something that maybe has a historic edge to it—nothing too modern (along the lines of Dispatch or Apex). It needs to be a square serif as it is being paired in the design with a traditional serif and I want there to be distinction between the two. Has to have an extra bold and/or heavy weight.</p>
    <p>thanks for any suggestions!</p>
    <div class="forum-topic-navigation clear-block"><a href="/node/33410" class="topic-previous" title="Go to previous forum topic">‹ Design Based on Sports Team Logo</a> <a href="/node/33301" class="topic-next" title="Go to next forum topic">Hevetica vs. Univers ›</a></div>
