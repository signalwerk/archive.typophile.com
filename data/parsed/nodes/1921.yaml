    votes: null
    html: <p>Keith, maybe I am thinking the wrong way about this, but it seems to me only fashion advertisers will want to use 'Luxury', and they will have the money and want the exclusivity. <br> <br>But with Trinite, an amazing text face, the whole world might want it, like Times New Roman. By the way, Lexicon, which TEFF compares to Times New Roman as far as versatility, and which Tiffany wants, is also priced similarly in the stratosphere.  <br> <br>If TEFF could sell thousands more of Lexicon or Trinite by lowering the price, it would make sense to do so. (Of course I don't actually know the 'price elasticity,' as the economists put it, for these typefaces.) For 'Luxury,' as a display face with a wonderful but very limited appeal, you're not going to sell thousands anyway. <br> <br>The rational basis for pricing is not the work that goes into it, but what will gross the most for the product given the market. Of course that might influence your willingness to do the work in the first place... </p>
    html_clean: <p>Keith, maybe I am thinking the wrong way about this, but it seems to me only fashion advertisers will want to use 'Luxury', and they will have the money and want the exclusivity. <br> <br>But with Trinite, an amazing text face, the whole world might want it, like Times New Roman. By the way, Lexicon, which TEFF compares to Times New Roman as far as versatility, and which Tiffany wants, is also priced similarly in the stratosphere.  <br> <br>If TEFF could sell thousands more of Lexicon or Trinite by lowering the price, it would make sense to do so. (Of course I don't actually know the 'price elasticity,' as the economists put it, for these typefaces.) For 'Luxury,' as a display face with a wonderful but very limited appeal, you're not going to sell thousands anyway. <br> <br>The rational basis for pricing is not the work that goes into it, but what will gross the most for the product given the market. Of course that might influence your willingness to do the work in the first place... </p>
