    html: <p>Luxury is a funny concept, and it is aptly priced for what it stands for. But for me, generally speaking, I would be more inclined to pay more money for a well-made text typeface that I know I'm going to use a lot than an expensive display type. Text faces take more skill and time to make and refine.</p>
