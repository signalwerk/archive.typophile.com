    html: "<p>I would love to have Trinit� from TEFF, and wanted to try it for my recent book,but it is way too expensive, as it would have had to come out of my own pocket.  <br> <br>I am understanding better now that some high prices may make economic sense for the producer, though I do wonder. <br> <br>In the case of 'Luxury', I must admit it seems logical for what is essentially an advertising face. I see the logic less for Trinit�, a text face.  <br> <br>Incidentally, I think this logo for Aldo shoes: <a href=\"http://www.aldoshoes.com/aldosite/home.aspx\" target=\"_blank\">http://www.aldoshoes.com/aldosite/home.aspx</a>  <br>is in 'Luxury'. Compare: <br><a href=\"http://www.orangeitalic.com/fonts/luxury.shtml\" target=\"_blank\">http://www.orangeitalic.com/fonts/luxury.shtml</a> <br> <br>Of course it could be that Christian Schwartz designed the logo for them and they don't own the font. (I suspect the info at orangeitalic on luxury is outdated.) <br> <br>I saw this in enormous size on a billboard at Houston &amp; Lafayette in New York City. A girl in background holding in the foreground an enormous black ladies fashion boot with the logo in black next to it. Extremely cool - just what was intended by the face, I think.   </p>"
