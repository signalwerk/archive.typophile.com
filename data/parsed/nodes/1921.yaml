    html: "<p>William, if you can sell one font family license for $3000 rather than seven font family licenses for $400 each, why would you consider this bad marketing, especially if the service overhead for each license is the same? Given the extent of font piracy in the larger market, there is something to be said for high prices and a limited market: among other things, you can be pretty certain that TEFF has a very different relationship with its customers than Adobe has. Likewise Gerard Unger, and also some American type designers such as Sumner Stone. Interesting to note that Sumner used to work for Adobe, so he knows both sides of the font pricing question. If you buy a font from the Stone Foundry, you not only pay a lot more than you would for an Adobe font, you also have to <i>sign</i> a license contract. Such things reinforce the value of what is being purchased. <br> <br>I don't think either approach is <i>bad</i> marketing. They are different approaches to different markets. There are people who are willing to pay a premium for quality fonts and who understand that one of the things they are paying for is relative exclusivity: they want fonts that not every Tom, Dick and Harriet graphic designer has on his or her hard drive. <br> <br>Are you saying that it is bad marketing for Emiglio Zegna to price their clothes so that the Walmart shoppers can't afford them? <br> <br>And how do you measure the success of a small foundry like TEFF? Peter Matthias and his colleagues feed, clothe and house themselves and their families. Is it also necessary for a small foundry to become a big foundry? Or to enslave itself to shareholders and the constant drive for higher and higher profits?</p>"
