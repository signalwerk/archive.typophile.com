    html: "<p>Eduardo, I don't see the difference in the 'A's. What is the difference? (I am talking about the ALDO logo not the flash animation, which I guess has some light Helvetica.)  <br> <br>John, I agree that both approaches can make sense, or not. It just depends on the market - or, to use economists language, on the price elasticity for the good in question.   <br> <br>I also can easily believe an alternative theory: that the TEFF and DTL people make their livelihood mainly from teaching and commissioned work, and that the foundries are sidelines. And that they are too busy with other stuff to market properly.  <br> <br>(Evidence: DTL has been promising that van Krimpen's Romulus, which I adore, would be out in three months, for about three years. The current 'deadline' is August 2003; it has been changed four times, I think. They are also selling FontMaster, which seems to be a higher priority.) <br> <br>Being an abominable marketer myself, I would be the last to say this weakness puts the good folks at these places in a bad light.  <br> <br>You may be right that they are following an optimal path for marketing. But I tend to believe my eyes. I don't see their faces here, and the work is great stuff, according to many on these boards, as well as amateur me. To me that raises a real question mark.  <br> <br>As to Hrant's reasonable question why they should succeed there and not here: it is different selling to their countrymen, who will buy out of friendship and national loyalty in a small country.  <br> <br>I'm definitely not saying I know better. And I learned from a similar discussion on Typographica that eg. different car models price for different niches. But I am saying that the evidence makes me question whether charging ten times more really is an economic benefit to them.  <br> <br>In this thread people are questioning Christian Schwartz's decision on 'Luxury', and defending DTL and TEFF. My intuition is that it is the other way around. I've been wrong before, lots, but I notice that sometimes when that little bell goes off sometimes I'm right too.</p>"
