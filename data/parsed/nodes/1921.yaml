    html: "<p>I assume that TEFF and DTL are wonderful people. I just think they don't have their act together on marketing. I claim zero expertise on this, but I just don't see the sense of pricing yourself out of one of the biggest markets on earth. <br> <br>If I thought the pricing made sense, it wouldn't irritate me (a childish reaction on my part, I admit). If you price me, a hobbyist, out of the market, it is no problem. But if you have professional graphic designers like Keith Tam and Tiffany Wardle wanting your stuff and feeling they can't buy it, and you don't see it anywhere in print in spite of many admirerers, I say you are messing up.  <br> <br>I mean the fact that I see Christian Schwartz's 'Luxury' on a huge billboard in New York City seems to me to say he wasn't an idiot in the way he priced it. The fact that I don't see Trinite anywhere makes me think their pricing is a mistake. <br> <br>Just, anyone, explain to me if you can how not selling in the largest market is good marketing.  <br> <br>*** <br>Adobe and Linotype per weight: $21 <br>DTL, per weight:           $100 <br>TEFF, per weight:          $300 <br> <br>To get all of Trinite is about $3,000 <br>To get all of Minion Pro (regular and condensed), <br>is $400. <br>*** <br>  <br></p>"
