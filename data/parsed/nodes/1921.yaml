    html: "<p>It's not guranteed but implied, isn't it?, given normal <br>prices, market conditions, etc. Okay maybe not, but any <br>logical person about to fork over $1500 is going to ask the <br>typographer where the face has been distributed *before* <br>they buy...wouldn't they? <br> <br>--- <br> <br>the cost of a custom face depends on lots of different factors,  <br>most notably the time it takes to complete and <br>how much value that typographer places on time. <br>$2,000 to $10,000 might be a ballpark range. <br> <br>There are a handful of typophiles here who could give you <br>more precise numbers. <br> <br>-- <br> <br>i guess the words 'ripoff' and 'sucker' bothered me.  <br>If someone or some company spends $1500 for a typeface <br>then: <br>1) type is important to them in the whole scheme of things. <br>2) they would have a pretty defined sense of how they were <br>going to use the typeface and how the typeface <br>was going to help them. <br>3) they would only feel ripped off, imo, if the type performed <br>like a loose bicycle or if it was being used *everywhere*. <br>4) Christian explained at typographi.ca the care  <br>he takes with his retail releases and clearly the $1500 <br>font market is tiny.  <br> <br>thus, I can't see any justification for 'sucker' and 'ripoff'... <br> <br>bj</p>"
