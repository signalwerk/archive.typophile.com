    html: "<p>Regarding use of Trinit�: it is used a lot in The Netherlands, both in books and, particularly, on their covers. When I was there in 1996, Trinit� seemed to be the national standard for book covers; this trend might have changed by now, but I believe it is still highly favoured by Dutch publishers. This year, a television documentary and a new book have been issued about Bram de Does's life and work, which attest to the high esteem in which his types are held in The Netherlands. <br> <br>By the way, I have a copy of the television documentary on VHS if anyone in Vancouver wants to see it. It is in Dutch with no subtitles. We were hoping that a subtitled version would be available in time for the Vancouver ATypI conference, but it didn't work out. Maybe Prague.</p>"
