    html: <p>The site does need to be in English, yes. <br> <br>But they're not selling "nothing", don't worry! <br>The low end of the font market is so crowded that simply raising prices for the same product puts you in a less competitive segment, with the perception of greater value/prestige. Plus when a customer pays a lot for something he guards it better. I think they're making more money this way, even though it's still not much. Same with Peter Bilak for example. <br> <br>Just because you can't afford their products doesn't mean they're bad people. Just the fact that a good thing exists should make you happy, no matter that you will never possess it. When I look at a Bugatti EB110SS, I don't become envious, I become happy. <br> <br>hhp <br></p>
