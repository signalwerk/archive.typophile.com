    html: <p>&gt;ask for printed specimens <br> <br>I did, and they sent samples. And the note in PMN's elegant hand was great! The Lexicon example was a newspaper in Dutch, which makes it hard for me to judge. The Lexicon seemed to me too black, but I might have a different opinion if I could read it.  <br> <br>Trinite has so many versions (three different extender heights, two widths, et al.), that it would really take more settings of the different sizes to get a concept. The text setting I was sent - a setting in the tallest and widest version - was beautiful, but this is probably not the most practical size for book text. A lengthy PDF with different settings of the variations in a language I could read would be of great help in judging. But honestly, the price is prohibitive in any case.    <br> <br>Given what you and Hrant say about the scarcity of their stuff here, I wonder if they have they (and DTL) have priced themselves out of the US market. They may be geniuses in marketing as they are in type design, but it doesn't look that way from where I sit.   <br> <br>Oh, I read on Typographica that a book on Bram de Does has just come out, so maybe I can get that or access to it eventually. </p>
