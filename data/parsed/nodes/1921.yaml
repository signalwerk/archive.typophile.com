    html: |-
      <p>this is Christian Schwartz, posting an explanation of Luxury. <br> <br>from the blogspot days of Typographi.ca <br> <br><br>
      </p><blockquote><hr size="0"><!---quote-!--><b>quote:</b><p>er... that's the joke. The Luxury Collection is our attempt to comment on the fact that the multitude of high-fashion logos can be boiled down into three fonts. "fashionable" things look a very specific way, and consumers allow them to be priced accordingly. we were hoping the ridiculous price would clue people in on the fact that the set is a joke. (the thought of someone paying $1500 for these three fonts, now that's funny!)  <br> <br>is there a place for social commentary and satire in type design? is the idea of a type family as conceptual art too much of a stretch? or is the problem that we were too straight-faced with our execution? because in this case, i think the attitude IS the function. <br> <br>in any case, we were planning for this set to be more of a publicity stunt than a product that sold a whole lot of copies. and it looks like that part, at least, is working out pretty well.<!---/quote-!--></p><hr size="0"></blockquote>
       <br> <br><p></p>
