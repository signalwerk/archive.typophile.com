    html: <p>But BJ, the point is that Luxury is <i>not</i> a custom typeface and the price tag doesn't guarantee exclusivity. <br> <br>I think the pricing puts Luxury in a kind of no man's land. You can't afford to buy it for a one-time use. But it's not the kind of face you'd use over and over again. You should'nt want to anyway. <br> <br>And clients who can afford it will think twice about spending so much on a retail face. They might even be willing to pay slightly more to get a customised face.  <br> <br>Btw, does anyone have any idea how much a customised face would cost? The LTA one by <a href="http://www.hubertjocham.de/" target="_blank">Hubert Jocham</a> for instance. Really curious.  <br> <br>Also, What are the factors that affect the pricing of a custom face?</p>
