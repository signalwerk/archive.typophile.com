      <p>Didone fonts like Bodoni would be useful for text. <a class="freelinking external" href="http://new.myfonts.com/fonts/fontbureau/miller/" rel="nofollow">Miller</a> might also work well; <a class="freelinking external" href="http://new.myfonts.com/fonts/linotype/monticello-lt/" rel="nofollow">Monticello</a> might be still better.<br>
      Another display option would be an "antique" slab-serif. Something like <a class="freelinking external" href="http://new.myfonts.com/fonts/storm/farao/black/" rel="nofollow">Farao Black</a>, maybe set in all caps, could work well.</p>
