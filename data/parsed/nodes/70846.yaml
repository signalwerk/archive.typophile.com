    <p>Maybe I'm just using the wrong keywords, but I'm finding this surprisingly hard to find on Google. I'm hoping the Typophile think-tank can help point me in the right direction. :-)</p>
    <p>We're rebranding a company that was founded in the early 19th century (yes, they're *that* old) in the United States, and we're trying to find authentic typefaces from the era, or modern reinterpretations that offer a comparable effect.  </p>
    <p>I don't know what the early 19th-century designers used, whether they were American typefaces or imported, but whatever was relatively common at the time for promotional materials, we're hoping to emulate as closely as reasonably possible.</p>
    <p>We're looking for display, body, the whole shebang. Any info you have off the top of our head, or can point us to, would be *much* appreciated.</p>
    <p>Thanks!</p>
