      <p>Shinntype's <a href="http://www.shinntype.com/Figgins_Scotch.pdf" rel="nofollow">Modern Suite</a> is designed to produce a facsimile mid-19th century look. The bold caps of Figgins Sans are the only reasonably authentic style of sans, as sans lower case and other weights were not introduced until much later in the century, nonetheless the other Figgins Sans styles are based on the serif style of the era. Scotch Modern is a revival of what is probably a George Bruce (American typefounder) face in an 1870 Albany publication; however, the Scotch Modern style was widely used from early in the century.</p>
      <p><a href="http://digital.library.cornell.edu/cgi/t/text/pageviewer-idx?c=nora;cc=nora;rgn=full%20text;idno=nora0001-1;didno=nora0001-1;view=image;seq=7;node=nora0001-1%3A2;page=root;size=s;frm=frameset;" rel="nofollow">Here</a> is a sample of Scotch from 1815.</p>
      <p>Miller does not correspond with this style of Scotch, in particular the capitals, shorter than the ascenders, and almost the same stem width as the lower case. </p>
      <p>It depends on whether you wish to go with a Transitional style, such as Monticello or Miller, or the cool European modern (Bodoni), or a Scotch Modern. I would recommend the Scotch Modern, of course, the reason I revived it is because it does represent the 19th century in a way that Bodoni and the Scotch Romans (transitionals) don't, as it was the "default" American style for most of the 19th century, and those other faces were much used throughout the 20th century.</p>
