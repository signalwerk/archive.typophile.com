  html: |-
    <p>Hacking a typeface converted in a javascript file... is it possible? I mean, quite easily possible? (I am well aware that if you reaaally want something, you can get it)<br>
    To protect my fonts, I use the cufon technology (<a href="http://cufon.shoqolate.com/generate/" title="http://cufon.shoqolate.com/generate/">http://cufon.shoqolate.com/generate/</a>), and there is a limit usage to a specific domain, but I wonder if is really efficient against hacking?</p>
    <p>Thank you!</p>
