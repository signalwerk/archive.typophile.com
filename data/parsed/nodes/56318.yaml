    html: |-
      <p>I wouldn't mess type. The main image is already odd (one too many fingers), you don't have to do the same with type. Make all three letters from the same typeface, as long as it's not the geometric one that's used for the second D.</p>
      <p>Maybe play with negative space if you want to make it more stable and professional. Put a negative hand in a square and also include type inside the square under the hand. Having this hand alone makes it a bit scary and... well odd.<br>
      ___________<br>
      <em>Robert Koritnik</em></p>
