    <p>Hey all!</p>
    <p>I need some help getting the typography right for a logo I'm developing for our fictional studio, called (Buro) ODD. With our choice of name we basically wanted to give ourselves some freedom, which works because we've got a lot of odd stuff planned for our audiovisual and webdesign productions... like using cornstarch and recycled paper for letterheads.</p>
    <p>Being the typographic newbie that I am, I'm struggling with the typography. On the one hand I want to create something that is ODD, fresh and a tad artistic. On the other, I don't want to communicate that we're a messy bunch.</p>
    <p>So far, here's what I've been focusing on. Any comments and tips are appreciated. While the basic form won't change drastically anymore (we're really comfortable with this), crits are always welcome. The logo might get a color, but I've uploaded it B&amp;W for now.</p>
    <p>edit: also uploaded more version from teammembers.</p>
    <p>edit2: seems like the old uploads were moved, thus their url not working. uploaded the same plus extra.</p>
