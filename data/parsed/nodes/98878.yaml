    <p>Barkentina is a new font with full set of correct Bulgarian Cyrillic letters. It contains also Ligatures and Small Caps. It's a display typeface, focused on elegant, stylish and art-deco looking print and web materials. </p>
    <p><strong><a class="freelinking external" href="http://fontm.com/barkentina-font" rel="nofollow">Download Now</a></strong></p>
