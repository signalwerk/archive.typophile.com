  html: "<p>I just read this tread: <br> <br><a href=\"http://www.typophile.com/forums/messages/4101/64337.html?1108141322\" target=\"_blank\">www.typophile.com/forums/messages/4101/64337.html?1108141322</a> <br> <br>and this one by Adam: <br> <br>\"Mac OS 9 and Adobe applications use Adobe software (ATM/CoolType) to render the Type 1 fonts. Mac OS X uses Apple's own ATSUI renderer. The most obvious differences are visible with hinting. Mac OS X displays some extreme deterioration of screen display of Type 1 font, which is \"ironed over\" a bit when the type is antialiased. But it's thoroughly possible that other aspects of the fonts, e.g. metrics, kerning, or special treatment of particular characters, is realized differently in the ATSUI model by Apple than in the ATM/CoolType model by Adobe.\" <br> <br> * can I have more info about this issue (i.e an article)? <br> <br> * Mac OS 9 and Adobe applications use Adobe software (ATM/CoolType) to render the Type 1 fonts....  - what about TT fonts? and Open Type? <br> <br> * Mac OS X uses Apple's own ATSUI renderer. The most obvious differences are visible with hinting. Mac OS X displays some extreme deterioration of screen display of Type 1 font......  - what about TT fonts? and Open Type? <br> <br>Thank you!</p>"
  html_clean: "<p>I just read this tread: <br> <br><a href=\"http://www.typophile.com/forums/messages/4101/64337.html?1108141322\" target=\"_blank\" class=\"link-lost\">www.typophile.com/forums/messages/4101/64337.html?1108141322</a> <br> <br>and this one by Adam: <br> <br>\"Mac OS 9 and Adobe applications use Adobe software (ATM/CoolType) to render the Type 1 fonts. Mac OS X uses Apple's own ATSUI renderer. The most obvious differences are visible with hinting. Mac OS X displays some extreme deterioration of screen display of Type 1 font, which is \"ironed over\" a bit when the type is antialiased. But it's thoroughly possible that other aspects of the fonts, e.g. metrics, kerning, or special treatment of particular characters, is realized differently in the ATSUI model by Apple than in the ATM/CoolType model by Adobe.\" <br> <br> * can I have more info about this issue (i.e an article)? <br> <br> * Mac OS 9 and Adobe applications use Adobe software (ATM/CoolType) to render the Type 1 fonts....  - what about TT fonts? and Open Type? <br> <br> * Mac OS X uses Apple's own ATSUI renderer. The most obvious differences are visible with hinting. Mac OS X displays some extreme deterioration of screen display of Type 1 font......  - what about TT fonts? and Open Type? <br> <br>Thank you!</p>"
