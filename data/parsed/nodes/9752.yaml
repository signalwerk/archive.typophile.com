    html: <p>&gt; that is why I can run classic with OS X? (I mean to use the "old", classic fonts with OS X) <br> <br>I don't actually understand the question here. Other than dfonts, which are just a repackaging of Mac TrueType fonts, there is no difference between "old" fonts and "new" fonts. The font *formats* haven't changed, but how they are supported has, and additionally Apple has changed how they are rendered (which is a separate question). OS X adds support for Windows-style TTF and TrueType flavored OpenType. It integrates Type 1 and OpenType CFF support that used to require ATM as an add-on. <br> <br>I hope that somewhere in there I answered your question. <br> <br>T</p>
