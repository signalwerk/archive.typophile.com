    html: <p>OS X does its own new rendering thing with fonts of all formats. Whether or not this is a good thing depends on who you talk to. <br> <br>However, below that, it still has rasterizer code inherited from previous OSes, including Adobe's rasterizer for Type 1 / OpenType CFF that Adobe licensed to Apple. Either Apple has deleted/changed pre-existing code, or they are mostly doing additional processing to get to their end results. The distinction is a bit of a moot point, I suppose. <br> <br>T</p>
