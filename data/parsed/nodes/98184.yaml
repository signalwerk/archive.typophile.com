    <p>Greetings!</p>
    <p>I apologize in advance if this post is in any way inappropriate.</p>
    <p>A professional organization to which I belong -- the American Philosophical Association -- is looking for a new logo (and associated branding items). There is an announcement on their website, and they asked members to pass it on to any "good designers" we might know. There are plenty of good designers here, and I thought at least a few of them might be interested. </p>
    <p>The announcement and the request for the proposals can be found <a class="freelinking external" href="http://www.apaonline.org/APAOnline/Announcements/Announcement_Content/The_APA_is_looking_for_a_new_logo_.aspx" rel="nofollow">here</a>.</p>
    <p>Thanks!</p>
    <p>Matty Silverstein</p>
