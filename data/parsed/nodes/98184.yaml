      <p>I've got mixed feelings about having a class do it. </p>
      <p>On the plus side, it can save a lot of money, and it's good to give students the opportunity to work on a real-world project. </p>
      <p>On the negative side, your design will be done by people still learning their craft, the job is likely to take longer, and long-term follow-up may be non-existant once the class project ends (unlike having a relationship with a professional designer who knows your organization well and is on call for future tweaks and projects).</p>
