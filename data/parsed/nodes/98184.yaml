    html: |-
      <p>With a budget of $2,500 USD, I recommend you approach a group of students under the supervision of a professor and make a class project out of this. Profit or no, $2,500 USD is very low for the following:</p>
      <p>Logos<br>
      Usage guidelines<br>
      Web design guidelines<br>
      Email templates<br>
      Banners<br>
      Favicon<br>
      Letterhead<br>
      Business cards<br>
      Thank-you card<br>
      Publications designs<br>
      Typographic guidelines<br>
      Facebook &amp; Twitter design guidelines<br>
      Brand strategy document</p>
      <p>A practicing professional would probably ballpark that closer to $10–25,000.00 USD depending on the size of their operation and how much of their labour they would be willing to donate in kind.</p>
      <p>To give you a sense of the cost of a quality font, let’s say I suggested you use <a href="http://www.fontbureau.com/fonts/starling/" rel="nofollow">Starling</a> as your text face for all your printed materials. The font alone would cost you  $1,080 USD for a 6–10 computer license. Almost half your budget. </p>
      <p>If you made a class project out of this, you could put your budget towards purchasing a high quality font(s) for your materials, and have enough left over to play for the class’ printing budget (students making colour laser prints for their presentations) and provide the selected student with a small honorarium.</p>
