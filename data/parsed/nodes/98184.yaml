      <p>&gt; Why is [design] not taken for serious?</p>
      <p>That's a very broad statement. Average consumers and small businesses have little contact with designers so it's natural that they have no idea how business is conducted or what it costs. But many corporations deal routinely with designers and know how things are done and what they cost. </p>
      <p>Last week one of my corporate clients asked me to estimate a design job. I said $15,000 (which was reasonable for the job), they said fine, and I had a p.o. the next day. Simple. They deal with designers every day and know what the going rates are. But when I deal with mom-and-pop shops who aren't used to buying design services, it's a different story and I have to justify and fight for every dollar.</p>
      <p>As to the question of why clients sometimes ask for spec work, I think there are a number of reasons, but one might be that they have seen or read about advertising agencies competing for work. Several agencies will each come up with ideas and make presentations in hopes of getting the account. But that's really an apples to oranges situation, as an ad agency might get years of work and millions of billing dollars if they win a big account. That's very different from a graphic designer being asked to do free work in hopes of "winning" a one-time, routine job.</p>
    html_clean: |-
