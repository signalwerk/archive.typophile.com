      <p>In a comment on a recent blog post by the new director of the American Philosophical Association, I mentioned the reaction here to the APA's request for proposals (and in particular to the suggested fee of $2,5000). Here is what the APA director said in reply: "We know our project budget is small, but as stated in the RFP, we're more than willing to consider proposals over that amount—we just need the budget to be explained in the proposal so we understand what we are getting for the additional cost. The APA's finances are tight, but we do want to pay a fair wage for the project, and if we receive a proposal that convinces us we should increase the budget, we will find the money to do so."</p>
      <p>I don't know if that will encourage anyone here to take a stab, but it seems reasonable.</p>
