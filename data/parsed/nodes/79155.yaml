    <p>Hi, all.</p>
    <p>I'm seeking a nice/good/usable, reasonably condensed handwritten font which includes Cyrillic characters.<br>
    Having a good level of readability at smaller sizes would also be a bonus (allowing for longer strings within limited title space —&nbsp;hence condensed).</p>
    <p>Examples of what I mean by 'nice/good/usable'…<br>
    Nothing too scrawly. No classic/classical scripts.</p>
    <p><a href="http://www.fontshop.com/fonts/singles/dalton_maag/verveine_corporate_regular_ot/" title="http://www.fontshop.com/fonts/singles/dalton_maag/verveine_corporate_regular_ot/">http://www.fontshop.com/fonts/singles/dalton_maag/verveine_corporate_reg...</a><br>
    <a href="http://www.fonts.com/findfonts/detail.htm?productid=151003" title="http://www.fonts.com/findfonts/detail.htm?productid=151003">http://www.fonts.com/findfonts/detail.htm?productid=151003</a><br>
    <a href="http://typekit.com/fonts/ff-market-web" title="http://typekit.com/fonts/ff-market-web">http://typekit.com/fonts/ff-market-web</a><br>
    <a href="http://www.fontshop.com/fonts/singles/suomi_type_foundry/suomi_hand_script_ot/" title="http://www.fontshop.com/fonts/singles/suomi_type_foundry/suomi_hand_script_ot/">http://www.fontshop.com/fonts/singles/suomi_type_foundry/suomi_hand_scri...</a></p>
    <p>^^ Suomi Hand Script would be a great choice if it had Cyrillics chars.</p>
    <p>Many thanks for any recommendations y'all can share.</p>
