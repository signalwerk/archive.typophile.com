      <p>Thanks, folks.</p>
      <p>There were a number of options in the Paratype and Tipomet selections that would fit the bill.</p>
      <p>The Da Vinci and AndrijScript were both a bit too historical looking to suit.</p>
      <p>I've got client sign-off on Verveine —&nbsp;which suits the 'looseness' of the brand —&nbsp;but might hold off until I've had a proper look through the Paratype and Tipomet selections first.</p>
      <p>Thanks, again.</p>
