  html: |-
    <p>I have been kerning type equally now for a couple of years, however I want to take things further with Helvetica. Can anyone tell me if any guides are available on perfect kerning for the typeface Helvetica. </p>
    <p>For example manual kerning with equal space just doesn't feel enough for me, if you have a sentence with the letter 'e' in twice next to each other, the equal spaced kerning throughs the balance off and the word starts to look different in comparison to letters that kern nicely with equal spacing.</p>
    <p>So with that all in mind, does anyone have any advice on taking kerning further in order to balance words perfectly, and finding what spaces work with what letters etc,</p>
    <p>Many Thanks,<br>
    Alex.</p>
