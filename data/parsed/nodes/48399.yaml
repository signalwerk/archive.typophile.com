    html: |-
      <p>As you have observed, letterfit is contextual -- kerning is usually taken to be the letterfit between a pair of letters without regard to context.</p>
      <p>"Perfect" seems to ask for a mathematical solution. You might find one when the letters too have a mathematical construction, say, all vertical strokes at 90 degrees, as often found in LED displays. But we tend to reject that, and like the letters themselves, letterfit becomes an aesthetic matter, allowing for varying opinions. One obvious example is the varyious kerning approaches taken with the apostrophe. Some like it so tight it becomes almost a diacritical, others feel it deserves it's own space, like a letter.</p>
      <p>Once varying opinion enters the equation, common agreement is usually achieved only by the time-honored practice of the threat.</p>
      <p><cite>If you don't give me the deed to your ranch,</cite><br>
      <cite>I'll throw you on the railroad tracks.</cite></p>
