  html: |-
    <p>Hi all,<br>
    I am wondering if there is such a site that features a wide selection quality non-western fonts complete with documentation that is catered toward western designers that need to reference and use them.  I am looking to learn more about the subject (is it called easternization?), and I am also looking for a Japanese equivalent to DIN, if there is such a thing.</p>
    <p>Any help, or a point in the right direction would be greatly appreciated.</p>
