    html: |-
      <blockquote><p>But isn't the data in MeMa UFO just similar OT kern feature code?</p></blockquote>
      <p>I think they are similar, but FontLab will not work well with kern feature code that is copied into its OpenType panel. It is likely to get removed or replaced with kerning data from its Metrics window (which may contain no kerning data, resulting in an empty kern feature) when generating fonts or exporting to UFO.</p>
    html_clean: |-
