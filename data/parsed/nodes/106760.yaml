    html: |-
      <p>No trick question intended ;)</p>
      <p>Perhaps try to save the kerning from MetricsMachine directly into the UFO (as a kern feature) which you then open in Superpolator. It’s really hard to get the kerning from MetricsMachine into FontLab accurately and completely. So try to avoid going through FontLab a second time.</p>
      <p>FontLab → UFO → MetricsMachine → UFO → Superpolator</p>
