    date_raw: 15 Oct 2013 — 7:59am
    votes: null
    html: |-
      <p>It is possible to work with OT kern feature data from Metrics Machine in FontLab if you have pasted it into the OT window in FontLab if you say "no" to any attempt by FontLab to "update" the kern feature (it always asks first).</p>
      <p>A better way is to use an "include" statement in the lower right pane of FontLab's OT window linked to an external text file containing the kern feature from Metrics Machine. That way, even if FontLab "updates" the kern feature, it won't do any harm. You can just delete it.</p>
    html_clean: |-
