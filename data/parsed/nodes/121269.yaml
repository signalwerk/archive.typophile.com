      <p>The Zapfino leaves me a bit cold (it’s curvy, but a bit wimpy).</p>
      <p>I’d go for a balance of legibility and elegance. Some script typefaces that might work for you:<br><a href="http://www.myfonts.com/fonts/typadelic/pointedbrush/">http://www.myfonts.com/fonts/typadelic/pointedbrush/</a><br><a href="http://www.myfonts.com/fonts/sudtipos/aguafina-script/">http://www.myfonts.com/fonts/sudtipos/aguafina-script/</a><br><a href="http://www.myfonts.com/fonts/sudtipos/sinfonieta/">http://www.myfonts.com/fonts/sudtipos/sinfonieta/</a><br><a href="http://www.myfonts.com/fonts/aerotype/arbordale/">http://www.myfonts.com/fonts/aerotype/arbordale/</a><br><a href="http://www.myfonts.com/fonts/sudtipos/amorinda-ot/">http://www.myfonts.com/fonts/sudtipos/amorinda-ot/</a><br><a href="http://www.myfonts.com/fonts/sudtipos/koziupack/">http://www.myfonts.com/fonts/sudtipos/koziupack/</a><br><a href="http://www.myfonts.com/fonts/scholtz/miss-donna/">http://www.myfonts.com/fonts/scholtz/miss-donna/</a><br><a href="http://www.myfonts.com/fonts/re-type/dulcinea/">http://www.myfonts.com/fonts/re-type/dulcinea/</a></p>
