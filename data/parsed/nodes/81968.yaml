    <p>Hi, I'm working on the identity system of my academy and I'm facing the fact that we cannot design a typeface on our own by the deadline (which is near as hell, by the way).</p>
    <p>What are the legal aspects of using a shareware font?</p>
    <p>Up to now I've choosen Dante and I'm trying to find a respectable sans-serif companion for it.</p>
    <p>But I don't know what should we do, if the identity system is accepted, to legally use Dante and the sans-serif companion (think of renowned names like Univers, Frutiger etc.).</p>
    <p>We'll have to buy the license and goodbye? Or there's something more complex behind?</p>
    <p>thanks in advance for all the replies!<br>
    a.</p>
