    html: |-
      <p>The Build section isn’t the most appropriate place where to ask such a question. You should move the thread.<br>
      As for the question itself: it depends by the use of the typeface.<br>
      If the identity involves just the logo and tagline, the designer must own a license for the font(s) appropriate for the use (some foundries ask more if the font is used in logos, for example).<br>
      If the font will be used to set all the text for any given product by the client, the client itself will need to purchase an appropriate license (presumably a site license) for the use of the font.</p>
