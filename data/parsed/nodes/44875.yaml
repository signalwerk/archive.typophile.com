    <p>The May edition of the Metal Type newsletter is now out.</p>
    <p>I’m pleased to say that this month’s video is an “outside broadcast” - I filmed it in York city centre, in Dean’s Park in the grounds of the historical Gothic cathedral known as the “Minster.”</p>
    <p>Fans of bird-song may also be interested - they seemed to be in good voice throughout the filming!</p>
    <p>There’s been plenty of new and interesting material added to the site during April.</p>
    <p>Click the link below to take a look:<br>
