    html: |-
      <p>i think <em>Thinking with Type</em> would be a good preface to <em>The Elements of Typographic Style</em>. while Bringhurst's book is the "typographer's Bible", it can be a lot to chew on… but still a definite must-read.</p>
      <p>as for actually drawing and creating letters and fonts, the <em>Logo,Font &amp; Lettering Bible</em> will help you to learn more about some of the technical stuff.</p>
      <p>----------<br>
      nc</p>
