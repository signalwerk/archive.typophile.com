    <p>Hi all,<br>
    After getting a book on Paul Renner (thanks for the suggestions) I came across some font design books that I thought I would get for myself.</p>
    <p>Does anyone have any recommendations on good books?  The ones I'm thinking of getting are The Elements of Typographic Style - Robert Bringhurst and Thinking with Type : A Critical Guide for Designers, Writers, Editors, and Students (Design Briefs) - Ellen Lupton.</p>
    <p>Thanks for your input.</p>
    <p>-Will</p>
