    html: |-
      <p>both books are very good. thinking with type isnt as in-depth as bringhurst ("the typographers bible"), which im still reading. i see it as a lexicon you can always go back to if you're unsure about anything.</p>
      <p>it also has a good list of different typefaces suited for text, with short descriptions on their history and which cuts are the best.</p>
