      <p>Thanks for the link Mark.</p>
      <p>I've gone through my classes listed in calt and clig and added them back in manually. Recompiled and all is good again. I will remember not to mess with that again. In my case it was hitting generate kern feature while only kern was showing that caused the drop of OT features.</p>
      <p>Lesson learned.</p>
