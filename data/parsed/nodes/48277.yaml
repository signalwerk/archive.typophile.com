  html: |-
    <p>I've been working on a script font with tons of contextual code including calt and clig features as well as several SS features. It has CE language support so I finally decided to do the class based kerning for all of that. I had the classes widows only showing kern classes while I was working to make it easier to handle. In order to preview my kerning in the OT preview I selected generate kern feature. When I compiled it said "fatal error" and listed the first instance of a OT class. I went back to the classes panel to find out FL had deleted all my OT classes.<br>
    Is there a way to recover my OT classes? Did this happen from selecting the kern classes at the bottom of the panel (on Mac version) or is this some particular bug in the system?</p>
    <p>Any help greatly appreciated.<br>
    Stephen</p>
