      <p><em>I had the classes widows only showing kern classes while I was working to make it easier to handle.</em></p>
      <p>This is a known bug.<br>
      It was metioned in a previous Build thread.<br>
      Always have "all classes" selected.<br>
      Can you rebuild from a font?</p>
