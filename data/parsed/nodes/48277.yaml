      <p>Thanks Nick,<br>
      I've added so many glyphs its probably just as well to redo the classes. I went through the feature code and made a list of my OT classes by name. Since I didn't have fractions and such, I only needed 6 OT classes, so I think if I have a bit of patience I can reconstruct them reasonably quick. I will make note of that bug.</p>
