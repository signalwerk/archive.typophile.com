    <p>Hello all,<br>
    I'm new to this site and wondering if someone would be able to help me out with a fontographer question?<br>
    (I'm also new to fontographer). I'm experiencing difficulty with the metrics window.<br>
    I've created vector letterforms in illustrator and pasted them into their little corresponding boxes in the main font area.<br>
    I now want to fix up the kerning, so i've opened the metrics window and typed in a and b, this is fine and both letters can be seen side by side in the metrics window. However, if I type in any other combination, I can only view the letter 'a' which makes it tricky to know where to slide the measurement bars to for the corresponding letter. The example shows a and c typed into the metrics field.<br>
    thanks,<br>
    Sally</p>
