      <p>Maybe it's because I'm working with an older version of Fontographer, but the thing that really bugs me about it is that the tools don't have any shortcuts (eg. "v" for the selection tool). I spend most of my time in Illustrator &amp; when switching to Fontographer (or Quark for that matter) I really feel like I'm only working at half the speed if not less.<br>
      Then again, Crossgrove is right about the little problems Fontographer has importing .EPS-files. I switched the box in the preferences to "keep original size", but it keeps fitting them in the window, so I had to add a lot of small "guidelines" in Illustrator to the smaller letters (that I later had to delete again in Fontographer) to make sure the whole thing wouldn't be scaled to fit the window... &amp; it cost me a lot of aggitation, patience &amp; all my mathematical skills to get the result I wanted.</p>
