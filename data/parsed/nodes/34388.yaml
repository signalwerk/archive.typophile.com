      <p>"But I’m sure you agree that you can’t please everybody."</p>
      <p>True, though the web allows you to accomodate most everyone if you're willing. Granted, accomodate and please aren't necessarily the same thing. </p>
      <p>For instance, you could easily (try to) please a majority by assuming that a majority of users with the most common screen resolution maximize their browser and optimize your layout for that specific situation, but then let your site shrink or expand to fit those browsers outside the norm.</p>
