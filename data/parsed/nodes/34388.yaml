      <p>&gt; the only person he listens to is Mr. Jacob Nielsen.</p>
      <p>Groan. But be gentle with him, and you might just awaken a sensitivity to what Nielsen is blind to. Maybe send him to us. You might encourage him by pointing out that some of us (including yours truly) are actually programmers [too].</p>
      <p>&gt; The programmer wants to keep the text line very<br>
      &gt; wide because he assumes people will want to print.</p>
      <p>One should also assume that people will <cite>read</cite> the printout... Long line lengths are in fact more damaging in print than onscreen, because reading in print has a much better chance of getting more immersive. Try explaining that the gap between lines has to be larger the longer the lines, to ensure good "line returns", and that ends up wasting just as much space. And if you're not going to use CSS to increase leading you're sort of naturally channeled into a maximum line-length value.</p>
      <p>Font: Georgia.<br>
      If you're ambitious, try two columns.</p>
      <p>hhp</p>
