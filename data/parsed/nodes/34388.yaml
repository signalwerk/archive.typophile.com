      <p>"Screen vs. Print: 100 characters per line seems to be the optimal length for on-screen reading speed; however, there's a mismatch between subjective measures and objective performance. Although longer line lengths are read faster, people prefer a more moderate length. Also, a single, wide column is read faster, but users prefer multiple narrow columns. (Dyson, 2004)"<br>
