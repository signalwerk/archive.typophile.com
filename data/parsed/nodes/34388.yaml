      <p>First of all, the great thing about the web is you can design the page to look different on paper than it does on screen. Use a print style sheet for that.</p>
      <p>If the text is inevitably long, just assume folks will print it. The screen is great for scanning long texts, not so great for reading long texts.</p>
      <p>Yes, line length is important. About the only way to control that on screen is to layout your columns of text using ems as measurements. That way, if the type increases/decreases in size, so will the column, thereby preserving the line lenght. Of course, if a person happens to need large time, but still wants a narrow browser, then things get hard for them.</p>
      <p>So...I'd set a width for your column using ems, and then set a max-width in pixels (to something like 700 pixels or so) to accomodate those that need big type but don't want to deal with horizontal scrolling.</p>
