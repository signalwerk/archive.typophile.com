      <p>lore...yes, stats are important, and something that is very much what design is about. That said, keep in mind that a lot of web stats are very much red herrings. Again, screen resolution is not the key issue. The size of the browser viewport is the key stat, and one that is very often not tracked at all. Yes, a lot of people will have their browser maximized, but there are a number of exceptions: those with side panels open, those with huge monitors that browser with multiple windows side-by-side, mac users, and power users who actually take advantage of modern multi-windowed OSes by having multiple windows open.</p>
      <p>As for CMS, it depends entirely on the template engine they decide to implement. Most are really crappy. Few support true CSS layout and few support basic concepts like valid HTML. The best bet is to find a CMS that does not even try to implement a template engine allowing you and your developers to make your own templates from scratch.</p>
