      <p>I'd like to quickly weigh-in on this topic.</p>
      <p>Though I have both a strong background in print and on-screen design, I am becoming more and more in favor of letting the individual user determine their preference of reading mode.</p>
      <p>We should no longer think of web design as static, and we should make every attempt at allowing the user to have more control on how and when the information is to be assimilated.</p>
      <p><a href="/wiki/Roger%20Black" class="freelinking" rel="nofollow">Roger Black</a> discusses user selectable column layout in a recent <a href="http://www.technologyreview.com/Infotech/18650/" target="new" rel="nofollow">Technology Review</a> article. For purely onscreen reading, I, for one, would love to see user selectable screen font styles with adjustable spacing and column widths.<br>
      Food for thought...</p>
