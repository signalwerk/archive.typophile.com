    <p>I have been recently hired to create the layout for a couple of websites for a high profile university research group (don’t ask why, I really don’t have much experience in webdesign). The programmer is giving me a hard time because the only person he listens to is Mr. Jacob Nielsen. My main concern is to make the reading experience as comfortable as possible ON SCREEN so that the user doesn’t even dream about printing the page and wasting paper. </p>
    <p>A part from considerations about the right typeface etc. do you have any information about column width? For big chunks of text, how long should the text column be? I don’t like the idea of wide chunks of text as I don’t find particularly comfortable moving my eyes (and neck) from left to right all the time when I read. The programmer wants to keep the text line very wide because he assumes people will want to print. I’m sorry if I’m not explaining it very well but I would be grateful if you could point me to interesting links on this issue, or websites that encourage people to read on screen rather than print and how to make things more comfortable for the reader. </p>
    <p>We are designing one site with EZ Publish and another one with Moodle, anyone has an opinion on these?<br>
    I know there are tons of stuff on the web but I’m not sure which one is the most reliable and I dislike that J. Nielsen. In fact I know there’s been a discussion on him back in 2002 on Typophile but it was mainly about Flash. Thank you so much as usual.</p>
