    <p>I have decided to release a font I designed into the public realm. Preview, usage notes and download available on my <a href="http://notes.jos.net.au/current/6px/" rel="nofollow">website</a>. A brief introduction:</p>
    <blockquote><p>“This font was created for a digital flyer design in 2008. I was interested in how far common symbols, numbers and letterforms could be reduced on screen before becoming illegible (this was before the advent of retina displays). The resulting font has a ‘natural resolution’ of six pixels in height, including ascenders and descenders, hence its name.”</p></blockquote>
