    html: |-
      <p>My issue is that I’m working on a job for a client, who is clueless about font licensing and such. I am not sure how the original font was procured.</p>
      <p>I’d like to confidently be able to tell the client to purchase the real deal, (if they do not have it already), in order to be able to rip a PDF for them.</p>
      <p>I do not want to advise the client to purchase the font, if Linotype’s original Zapfino produces similar PostScript errors. If I were a betting man, I would guess it wouldn’t - legitimately purchased fonts would/should not have such licensing restrictions.</p>
      <p>But these 2 fonts are apparently the same, as per original opinion?</p>
      <p>Yes, the simple solution is to purchase the font. However, I must justify such actions for the beancounters, and ensure my course of action will actually be succesful.</p>
      <p>(Question: Not being a font author, does the Macromedia Fontographer? footprint suggest someone has modified the original Linotype Zapfino, and in the process caused this error.)</p>
      <p>Thanks again for the help</p>
