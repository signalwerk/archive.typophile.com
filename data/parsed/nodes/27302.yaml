      <p>I cannot tell you what the history of the file you downloaded was. But I can tell you that it is not the same file as the PC TT version of Zapfino One that is downloadable (i.e., licensable) from the Linotype website.</p>
      <p>It would be best if you or your client license the font. Linotype offers customer service to its customers if problems ever arise. Free font sites who offer poor-functioning files from their URLs do not.</p>
