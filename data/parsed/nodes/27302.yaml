      <p>&gt; Question: Not being a font author, does the Macromedia Fontographer? footprint suggest someone has modified the original Linotype Zapfino, and in the process caused this error.</p>
      <p>Linotype has always been very consistent in applying their vendor ID - “lino” to the fonts they produce - the fact that the font is being attributed to Macromedia would suggest someone has been monkeying with the font, or used FOG to convert a Type 1 version to TTF.</p>
    html_clean: |-
