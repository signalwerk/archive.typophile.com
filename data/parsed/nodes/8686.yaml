    html: <p>Victor de Castro's <a href="http://www.unifonts.com/m_pages/manutiusbold.htm" target="_blank">Manutius Bold</a> is also similar, but not identical. He also has a very calligraphic style, in addition to those others I mentioned. <br> <br>Some of Bouwsma's fonts, such as <a href="http://www.identifont.com/show?8UB" target="_blank">Juliana</a>, <a href="http://www.identifont.com/show?5J5" target="_blank">Thalia Italic</a> and <a href="http://www.identifont.com/show?5GN" target="_blank">Mantegna Italic</a> also are rather similar, if a bit more obviously pen-drawn. <br> <br>Are you looking for the exact match or something with a similar look?</p>
