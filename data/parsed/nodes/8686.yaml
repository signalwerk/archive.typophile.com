    html: <p>Richard Yeend's <a href="http://www.fonts.com/findfonts/detail.asp?pid=350080" target="_blank">'Maidenhead</a>' also has an Italic form that they don't show fully  on the Fonts.com site. It has a very similar R to the sample posted by 'myuser'. <br> <br>If you are wondering why my inputs are fragmented, it's because I am working my way through the Calligraphic fonts in <a href="http://bowfinprintworks.com/Script04Pg8.html" target="_blank">Part 4 of the Script Font ID Guide</a>, and posting when I see something I think is at least similar. You might want to look through these pages too and see if you can find whatever it is you like about this ROSES sample. You'll need to find your own links to the vendors, though.</p>
