  html: |-
    <p>Hi Everyone,</p>
    <p>I'm researching to find a nice modern ultra-condensed sans-serif to buy. Can you make any recommendations?</p>
    <p>I liked very much the face that was used in the old National Post magazine, Saturday Night. I have Univers, Helvetica, and Franklin Gothic, but they look quite old to me. I prefer something that is modern, elegant and has a consistent voice across the family.</p>
    <p>Thank-you for your help!</p>
    <p>---</p>
