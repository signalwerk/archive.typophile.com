    html: <p>According to <a href="http://www.stonetypefoundry.com/html_pages/ITCStoneOverview.html" rel="nofollow">Stone</a> himself there is no Stone Serif Condensed. There is certainly an <a href="http://www.fontshop.com/showfont.cfm?fid=ITC.110808.3.6" rel="nofollow">ITC Stone Serif Semibold</a>.</p>
