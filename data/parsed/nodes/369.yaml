    html: <p>Kent, and Gerald, <br> <br>Sorry, I am having problems with my server. Apparantly the electric fence is interfering. I don't know if I believe that or not. <br> <br>I see my posting have been repeated, disregard the first, the last is most up to date. I may not have the hang of this system of posting, as I am new to it. So it may even be my fault. Ludites.  <br> <br>Sorry in any event. The last is most accurate. <br> <br>But Kent has asked a question. <br> <br>The hot metal type was set, inked and printed on White Curtis Tweedweave Text. <br> <br>The digital was set and "output positive", "not negative". The original lines were pasted in, the layout was shot on a camera. Plates were then burned. The press was run. <br> <br>Sorry for the confusion. <br></p>
