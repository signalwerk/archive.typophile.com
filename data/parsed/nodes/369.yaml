    html: <p>&gt;"softer" border  <br>I read your theory in other threads. 'Soft focus' in photography definitely has a pronounced effect, so there may be something in it. But I don't think this is the main thing about Caslon in particular. <br> <br>&gt;a woven pattern ...a more "valid" look in text setting than in display ...more as "work horses" than pretty letterforms. <br> <br>Very interesting. I think you definitely have something. What I love about the example of Caslon in the Einstein book is precisely the pattern or texture of the type. <br> <br>My next question would be what did the Dutch and then Caslon - Caslon perhaps has it more - do to sacrifice elegance of letter form to get greater readiblity or friendliness of the text setting? Bringhust mentions that the "Baroque" types have an irregular stress. For example the o is vertical, but the b angled old style. And of course there is greater thick thin contrast than in the older Garamond.  <br> <br>I am wondering whether part of this might be because it is more forgiving to irregular inking, pressure, wear and tear, etc. - following up on your 'workhorse' idea.  <br>  </p>
