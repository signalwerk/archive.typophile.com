    html: <p>&gt;It's not so simple. <br> <br>Hrant's summary seems to be similar to what emerged in the earlier thread discussing metal vs digital Electra. <br> <br>However, there has been a century of reworking Caslon, and, I believe, been only one digital shot at Electra. [Incidentally, I am just finishing reading a book in digital Electra - a pale and pathetic look compared to the book I have printed from metal Electra, which is beautiful.]  <br> <br>Something besides letterpress vs digital is going on. I looked in my old type books and found that the Einstein book in metal Caslon that I like [above] is Mergenthaler Linotype Caslon Old Face. "Types of Typefaces" by my late Uncle J. Ben Lieberman has Mononotype's metal Caslon 337 in a text block set 10/11. It is lighter than the Linotype Caslon, and to me a little too light (as John Hudson said of the Langston digital, to Giampa's protestation). 337 does have a lot of the Caslon magic, though. Ludlow True-Cut Caslon, which "Types of Typefaces" shows a larger size partial alphabet of, has even more.  <br> <br>I am convinced that a lot of the magic has to do with deliberate 'irregularity' that the remakes iron out. I guess nobody has yet figured it out, as Giampa says. Adobe Caslon is a good typeface, but doesn't have 'it'.  <br> <br>I'd be interested in people's speculation on the source of the Caslon magic.   </p>
