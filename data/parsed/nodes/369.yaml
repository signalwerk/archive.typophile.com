    html: <p>"I am convinced that a lot of the magic has to do with deliberate 'irregularity' that the remakes iron out. I guess nobody has yet figured it out, as Giampa says. Adobe Caslon is a good typeface, but doesn't have 'it'. <br> <br>I'd be interested in people's speculation on the source of the Caslon magic." <br> <br>I believe that the concern may have been less a focus on the integrity of individual letterforms than they way the letterforms would function in text setting. I recall reading about an attempt to create a woven pattern to the text. Caslon certainly does have a more "valid" look in text setting than in display where it more singularly reveals its "old style" design characteristics.</p>
