    html: <p>Gerald, <br> <br>Founier is right on many things. <br> <br>I am sure if you read my murmerings, sorry for the length and tedium, you would suspect that I would not have worked from drawings, or if I did I would "not" have made them particularly accurate. <br> <br>In other words I would not have paid them much mind. I am speaking of cutting by hand directly on metal. With a pantograph drawings and patterns are part of the system. <br> <br>Exceptions. Louis reported that he was trained by a pantograph operator, I believe a woman, at English Monotype who demonstrated her particular skills at working with neither a drawing or a pattern. <br> <br>I distinguish remarkable from desirable. <br> <br>But when I design I never work with layouts, so that is just my own method. Jim Rimmer on the other hand does exact layouts. I always wondered why the did not just shoot his layouts and run with them. <br> <br>In both cases I still distinguish remarkable from desirable. <br> <br>You would not want to do that with mine. <br> <br>In the trade I was called, "a designer in the stick". <br> <br>Your comments on Morison lying is of interest, I have read an essay by my friend John Dreyfus about Polyphilus so you have me confused. Could you tell me more more about what Beatrice Warde's corrections. <br> <br>I would like to correct my writings. <br> <br></p>
