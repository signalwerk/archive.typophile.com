    html: "<p>Some people say the \"magic\" is the actual physical impression: the so-called \"tactile\" feeling missing in offset. Others say it's the irregularity - which makes me note that there are two kinds of that: true instance randomness, versus the \"rough\" look that digital fonts like Founder's Caslon use. <br> <br>I think that -just maybe- the truth is somewhat of a combination of such things: that the magic is due to a \"softer\" border between foreground and background - contemporary offset might very well be simply too sharp for human preference. Which is why I've proposed a few times before that somebody unfocus the laser in an imagesetter (by a subvisible amount), and see what happens... <br> <br>hhp <br></p>"
    html_clean: "<p>Some people say the \"magic\" is the actual physical impression: the so-called \"tactile\" feeling missing in offset. Others say it's the irregularity - which makes me note that there are two kinds of that: true instance randomness, versus the \"rough\" look that digital fonts like Founder's Caslon use. <br> <br>I think that -just maybe- the truth is somewhat of a combination of such things: that the magic is due to a \"softer\" border between foreground and background - contemporary offset might very well be simply too sharp for human preference. Which is why I've proposed a few times before that somebody unfocus the laser in an imagesetter (by a subvisible amount), and see what happens... <br> <br>hhp <br></p>"
