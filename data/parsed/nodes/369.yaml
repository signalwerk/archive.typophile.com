  - id: 2261
    user: 1871
    date: 2003-05-27T11:18:00
    date_raw: 27 May 2003 — 11:18am
    votes: null
    html: <p>I agree with what Gerald Lange is saying but I do not recommend that direction. <br> <br>At least not without reading this page first. <br> <br><a href="http://www.lanstontype.com/CaslonATF.html" target="_blank">http://www.lanstontype.com/CaslonATF.html</a> <br> <br>That page is my view on the much to often spoken of merits of ink smear. <br> <br>I worked in the letterpress industry for forty years. My work was fine book work and advertising productions. Few have actually worked with Caslon Oldstyle more than myself.  <br> <br>I have never met Justin and believe me I am very impressed at the amount of work he must have put into Foundry Caslon.  <br> <br>Also I am aware that he commands great respect in this industry and I believe that it is deserved. And I wish I had a copy of Foundry Caslon myself. <br> <br>But I do not believe type should be designed by an can of ink. <br> <br>I printed 33,000 copies of The Fount. This issue was dedicated to the production of Lanston's digital Caslon 337. <br> <br>The text was set in the digital Caslon. Mixed in at random were seven lines set in the original hot metal Caslon Oldstyle. <br> <br>The Caslon challenge was to identify which lines were genuine. I even wrote clues as to how to find them. No one did. And remember the lines of original Caslon should have had the mysterious"ink smear". <br> <br>Which is merely bad presswork. <br> <br>A technique I did not use. <br></p>
