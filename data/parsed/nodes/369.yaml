    html: <p>William <br> <br>Caslon has historically baffled typefounders.  <br> <br>There were lively "letterpress discussions" on this very type face in the "turn of the last century". Founders were trying to figure out why their customers did not take to their cuttings. The customers wanted the "real thing". <br> <br>Lanston made several other attempts to cut Caslon, 37, 127, (447 display cutting for Caslon 337). And we cut others. One of them we offer in our catalogue. Listen to this. In the hot metal days we were trying to put the ink on! <br> <br>Want to buy it? We sell it as Caslon Bold! <br> <br>I can assure you if you like Caslon it is not because of bumps. <br> <br>You won't like our bold either. <br> <br>Have you guys ever thought about Letterpress? It does look mighty good. But not because of the bumps. <br> <br>Speaking of Einstein, have you heard of wavicles? It goes something like this. If you look for a wave you find particles, if you look for a particle you find waves. <br> <br>Have you ever wondered why you like letterpress Caslon best? Then you try to find out why and all of a sudden it looks faulty, all bumpy, ink spreading all over the place. Then, someone thinks they have found the mystery and imitates all the bad things and wonders why it looks terrible. <br> <br>If you look for the good you find the bad. <br> <br>OK, had to get the dig in. Letterpress rocks. <br> <br>I am moving so I will not be on line for a day or two. I will try to be more helpful.  <br> <br> <br> <br>  <br> <br></p>
