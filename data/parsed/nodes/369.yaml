    html: <p>Gerald <br> <br>Perhaps I will leave the text as it is now and add the possible reference. <br> <br>The master pattern was the father of the cutting. All decisions were fossilized in the metal. That and the punch cutting cards. <br> <br>American Type Founders sold the drawings, not all but most of them to Marder for $1000. ATF considered the drawings to be a storage problem. Not important to the maintenance of the library. <br> <br>This is true. That is why we were satisfied digitizing using master patterns as source. Had we had the drawings we still would have used the master patterns. <br> <br>With the master pattern and the punchcutting card nothing was missing in specifications to reproduce a new punch. Punches came and went at Lanston. Even more so at Linotype. <br> <br>There is many interesting things to be found in those punchcutting cards. Dating typefaces for instance is a question, reminding me of ships. When is the boat built, when the keel is laid or when the vessel is launched? Sometimes there is decades of difference, in both boats and typefaces. <br> <br>Some very substantial questions about the history of type is in that single question. Which reminds me, did you look at? <br> <br><a href="http://www.lanstontype.com/BurgessSetting.html" target="_blank">http://www.lanstontype.com/BurgessSetting.html</a> <br> <br> <br></p>
