    html: <p>John, <br> <br>Well, yes, division of labour is certainly a factor. <br> <br>In addition to the other aspects. Each mechanical typesetting machine required matrices, Linotype and Ludlow multiple matrices for each character. Monotypes only one. <br> <br>More strikes, more breakage. Believe me, broken punches does not make for a happy schedule. <br> <br>Great preparation and care was taken, precise drawings, solid patterns, punch cutting cards, skilled workers is what was required. <br> <br>Producing new matrices indistinguishable from the old required a method of reproducing exact punches. <br> <br>Quality drawings with fit and unit row considerations were included. Often the artwork was redrawn by the punchcutting department with close consultation of the originator. <br></p>
