    html: "<p>I am puzzled by the lack of agreement on the significance of ink spread or gain in properly inked letter press vs offset printing. And I am particularly interested in Caslon.  <br> <br>Long a go when as a kid I did printing as a hobby on a letter press with foundry type, I was warned that overinking was more of a danger than underinking. But I have read that in any case the offset process inherently has less ink spread.  <br> <br>I have an example of Caslon that I assume is originally letter press: a copy of Albert Einstein: Philosopher-Scientist. I love the 'color' and look of it. It is a '59 reprint of a '51 book. None of the digital Caslons that I have seen in print have the same look as this. It is as if the digital Caslons aren't the same typeface.  <br> <br>I have looked at the Founders Caslon on line, and it looks a bit more crude in the small sizes than in the Einstein book. I haven't seen Founders Caslon in print or PDFs of it. Adobe Caslon, which I have, definitely looks very different. I don't know about Langston's Caslon 337; I didn't see an alphabet on your site. Can you display more, and are there books that you could refer us to? <br> <br>And what is fair to say about ink gain? That it exists but won't cause bumps with proper inking? <br>  </p>"
    html_clean: "<p>I am puzzled by the lack of agreement on the significance of ink spread or gain in properly inked letter press vs offset printing. And I am particularly interested in Caslon.  <br> <br>Long a go when as a kid I did printing as a hobby on a letter press with foundry type, I was warned that overinking was more of a danger than underinking. But I have read that in any case the offset process inherently has less ink spread.  <br> <br>I have an example of Caslon that I assume is originally letter press: a copy of Albert Einstein: Philosopher-Scientist. I love the 'color' and look of it. It is a '59 reprint of a '51 book. None of the digital Caslons that I have seen in print have the same look as this. It is as if the digital Caslons aren't the same typeface.  <br> <br>I have looked at the Founders Caslon on line, and it looks a bit more crude in the small sizes than in the Einstein book. I haven't seen Founders Caslon in print or PDFs of it. Adobe Caslon, which I have, definitely looks very different. I don't know about Langston's Caslon 337; I didn't see an alphabet on your site. Can you display more, and are there books that you could refer us to? <br> <br>And what is fair to say about ink gain? That it exists but won't cause bumps with proper inking? <br>  </p>"
