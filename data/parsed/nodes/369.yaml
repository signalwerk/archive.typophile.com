    votes: null
    html: "<p>Gerald <br> <br>I've read the discussion at your site with interest. One point of confusion about ink spread is that it is largely a twentieth century phenomenon. By this I mean it was rarely a concern before the revival period. Good printing was just good printing and poor printing was just poor printing. Moxon called heavy inking, \"fat.\" To reinforce your point about the aims of the punchcutter a blast from the past: Fournier suggested \"it is not right to blame the letter for the fault of the ink.\" <br> <br>One of the problems in the ongoing current discussion is the thinking that early punchcutters must have worked with master drawings. There is no evidence of this to my knowledge. As foundries began to copy the work of other foundries, perhaps, but prior to the mid-eighteenth century I'd agree with your accessment about the intuitive organic quality of the work. <br> <br>Another problem is that folks ignore the technology associated with the early revivals, that of the photograph. Prior to Wm Morris replications were direct from specimens, cut by hand. Morris was the first to use the photograph, and what he saw was ink-spread (unfortunately, he kind of liked it). All subsequent revivals using the photograph had to deal with the same problem. <br> <br>But you mention Poliphilus. Later information on this is that it is not an exact replication with bumps and all but a \"flavored\" interpretation. Morison, once again, was lying. Beatrice Warde corrects this misconception in an article in the 1950s. <br> <br></p>"
    html_clean: "<p>Gerald <br> <br>I've read the discussion at your site with interest. One point of confusion about ink spread is that it is largely a twentieth century phenomenon. By this I mean it was rarely a concern before the revival period. Good printing was just good printing and poor printing was just poor printing. Moxon called heavy inking, \"fat.\" To reinforce your point about the aims of the punchcutter a blast from the past: Fournier suggested \"it is not right to blame the letter for the fault of the ink.\" <br> <br>One of the problems in the ongoing current discussion is the thinking that early punchcutters must have worked with master drawings. There is no evidence of this to my knowledge. As foundries began to copy the work of other foundries, perhaps, but prior to the mid-eighteenth century I'd agree with your accessment about the intuitive organic quality of the work. <br> <br>Another problem is that folks ignore the technology associated with the early revivals, that of the photograph. Prior to Wm Morris replications were direct from specimens, cut by hand. Morris was the first to use the photograph, and what he saw was ink-spread (unfortunately, he kind of liked it). All subsequent revivals using the photograph had to deal with the same problem. <br> <br>But you mention Poliphilus. Later information on this is that it is not an exact replication with bumps and all but a \"flavored\" interpretation. Morison, once again, was lying. Beatrice Warde corrects this misconception in an article in the 1950s. <br> <br></p>"
