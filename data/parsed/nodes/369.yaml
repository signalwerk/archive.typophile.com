    html: "<p>Hermann Zapf recalls that the drawings he prepared for designs cut by hand August Rosenberger were generally much rougher than needed for machine cutting. He could rely on Rosenberger to accurately interpret his designs in metal. Industrial production required discreet design and manufacturing stages: division of labour. I believe the process of cutting type by hand was more holistic as is, in a very different way, the designing of digital type directly on the computer rather than on paper first.</p>"
