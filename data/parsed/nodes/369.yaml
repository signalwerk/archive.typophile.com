  html: <p>Is there a true (or closer) version of Caslon available that is closer to the original Letterpress version? I am looking for something closer than Adobe's revival. <br> <br>I am still learning of the history behind these fonts I have been using for years. I am hoping that if there is a truer version of Letterpress Caslon that it may have more of an aged look to it. <br> <br>If there is anyone who could shed some light on this it would be greatly appreciated.</p>
