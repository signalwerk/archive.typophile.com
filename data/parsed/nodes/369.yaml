    html: <p>I'd second this. Lanston's Caslon Oldstyle No. 337 is an exceptional face for use in letterpress printing. Very near an exact replication of the original Lanston Monotype at small text size.  <br> <br>However, if one is looking for that faux "letterpress look," ink-spread and all, this will prove a bit too refined. In this regard, Justin Howe's Founders Caslon would work better as it is based on specimen sheets and/or direct proofs, ink aberration and all. <br> </p>
