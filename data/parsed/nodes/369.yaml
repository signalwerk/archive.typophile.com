    html: "<p>&gt; \"ink smear\" ... is merely bad presswork. <br> <br>It's not so simple. <br> <br>Since letterform fidelity is only one factor in printing (along with paper stock, output technology, and a bunch of other things) gain is above all else a <i>reality</i>. Although it's easy to make it minimal in offset work, it requires exceptional circumstances to avoid it in letterpress - generally only type designers will care enough to preseve the letter shapes. And <i>that's</i> only if they haven't already included gain compensation into the design! <br> <br>Furthermore, at smaller sizes gain isn't just mechanical, it's also optical: the lc \"r\" for example benefits notably from an unusally deep cut between the arch and the stem, in smaller sizes. <br> <br>So designing for gain is generally smart, and sometimes indispensable. <br> <br>hhp <br></p>"
    html_clean: "<p>&gt; \"ink smear\" ... is merely bad presswork. <br> <br>It's not so simple. <br> <br>Since letterform fidelity is only one factor in printing (along with paper stock, output technology, and a bunch of other things) gain is above all else a <i>reality</i>. Although it's easy to make it minimal in offset work, it requires exceptional circumstances to avoid it in letterpress - generally only type designers will care enough to preseve the letter shapes. And <i>that's</i> only if they haven't already included gain compensation into the design! <br> <br>Furthermore, at smaller sizes gain isn't just mechanical, it's also optical: the lc \"r\" for example benefits notably from an unusally deep cut between the arch and the stem, in smaller sizes. <br> <br>So designing for gain is generally smart, and sometimes indispensable. <br> <br>hhp <br></p>"
