    <p>Hello,</p>
    <p>Looking to get some feedback on a logo I've been working on. The company is called Edible Adventures - Mobile cooking classes for kids. It's pretty self explanatory. Client is looking for a simple execution of her logo. It has to communicate food in a fun way and easy to read. Could be used as signage on vans/store front/stationary/marketing materials. </p>
    <p>Please take a few minutes to look it over. Let me know your thoughts/suggestions. </p>
    <p>Thanks in advance. </p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/EdibleAdventures_6299.jpg"></div><p></p>
