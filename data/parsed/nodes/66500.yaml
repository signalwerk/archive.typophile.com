    html: |-
      <p>If the angles are slightly off it will just look wrong; and if the subline font isn't going to be the same, chances are very small the angles will match. Fortunately you can find something close and then skew it slightly to match. Or you could use a really "loose" font with no discernible inclination angle, like a handwriting font* or maybe a flamboyant cursive.</p>
      <p>* Maybe this: <a href="http://www.flickr.com/photos/stewf/4305557811" title="http://www.flickr.com/photos/stewf/4305557811">http://www.flickr.com/photos/stewf/4305557811</a></p>
      <p>More:<br>
      - If you could -nicely- chop the head of the "t" in "adventures", you would end up with a nice tight fit between the two lines.<br>
      - You need to work on the spacing, especially in "adventures". I might even make a custom "v" (a roundish form) to fill its space better.<br>
      - The crumbs are spaced a bit too regularly.</p>
      <p>hhp</p>
