    html: |-
      <p>I think you should look at how the S is affected by the bite. The lower left of the S now only connects to the main part of the character with a very tiny slice. Perhaps you could try keeping this connecting strip a bit thicker, or try what happens if you completely let the lower left terminal 'snip off', so to speak. Perhaps rotate the bite by a few degrees counter-clockwise so the lower left bit of the S doesn't become to small, either.</p>
      <p>I'd probably also slightly nudge 'edible' to the right, so the space between the ascender of the d in 'adventures' and the e of 'edible' isn't so tight.</p>
      <p>And I was also going to suggest chopping off the top of the t, as hrant already mentioned.</p>
