    html: |-
      <p>As the site says, the LaTeX typeface is based on New Century Schoolbook, and this is definitely Times-New-Roman-based. However, the 'v' is closer to Century than Times (although still not exact).</p>
      <p>Re the 'fi' lig, some versions of Times New Roman do contain it.</p>
      <p> - Lex</p>
