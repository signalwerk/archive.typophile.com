    <p>This font is very similar with Times New Roman, Times, Times Ten, Timeless, Nimbus, Newton.</p>
    <p>But I believe none of them is match with above-mentioned fonts.</p>
    <p>For a hint, look at small “v” letter in Italic and compare them.</p>
    <p>Also, there is available "fi" ligature on the font.</p>
    <p>I anyone can ID this font, I am very happy because I really like it.</p>
    <p>Thanks in advance<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/Font Sample_5501.jpg"></div><p></p>
