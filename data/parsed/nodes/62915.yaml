      <p>this is pretty rough, but what do you think of this? When I saw the book icon you designed I immediately though of the top of a carousel. </p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/book_5001.png"></div><p></p>
      <p>I think you need to adjust the letter spacing.. a lot. Also, I don't really like the O's. I think it would look better if the O's were more round. That way it would create a repetition with the O in the icon.</p>
      <p>Just a thought.</p>
