  html: |-
    <p>I was trying to find out some information about the design origins of a URW font called “Blacklight.” It is a quite sprightly script face, and I have used it frequently for various lettering, buttons, signage, etc., including in my avatar ID for this site.</p>
    <p>Most of the usual online font sites sell it, but nowhere could I find any information about who the designer is or when it was designed. Although it is available as a paid download at a number of sites, I also found during my search that it is offered as a “free” download at at least one site. </p>
    <p>WLB</p>
    <p>Here’s what it looks like:</p>
    <p></p><div class="imageWrap"><img src="/files/blacklight_5101.png"></div><p></p>
