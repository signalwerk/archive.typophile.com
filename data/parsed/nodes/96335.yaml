    html: |-
      <p>Don’t be afraid to thin stems in letters such as N and W.<br>
      Consistency of glyph weight vis-a-vis one another is the goal, not consistency of stem width.<br>
      Look at Frutiger’s fonts to see how forthright he is in implementing this principle.</p>
