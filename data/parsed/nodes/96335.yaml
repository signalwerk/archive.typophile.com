  html: |-
    <p>I'm working on an identity that is already well balanced. It's a long collection of capital sans-serif letters that are already condensed (think of Berthold Akzidenz Grotesk Bold Condensed or Knockout 49). I just need to create a new version, a little more compressed.</p>
    <p>(Unfortunately, I can't show anything since it's a commercial project that isn't announced yet).</p>
    <p>Do you have any advice on how to condense a typeface ? It's pretty straightforward, but I'm sure there are little expert details that I can't think of right now. Optical adjustments, straight vs. curvy letters, negative space, etc.</p>
    <p>Thanks in advance !</p>
