    votes: null
    html: "<p>Independent of context, it's often smart to end emphasis at a word space. The reason is to avoid potential collisions and big holes in the spacing (ex: collision when italic ascending letter is followed by a roman question mark; gap when italics are followed by a roman period.) Also, punctuation usually doesn't carry as much meaning as words do. Try reading the text and see for yourself what the different solutions communicate.</p>"
