    date: 2011-06-03T10:46:00
    date_raw: 3 Jun 2011 — 10:46am
    votes: null
    html: |-
      <p>If the rest of the sentence is not italic, the parentheses should not be italic.</p>
      <p>(Some typographers never use italic parentheses and brackets, even if the entire context is italic. But if you do italicize them, their style is dictated by the surrounding sentence, just like quote marks. Also roman parentheses just look nicer.)</p>
