  html: |-
    <p>Working on a job for a corporate client. In one sentence there are two words inside parentheses, and both words must be italic. Should the parentheses also be italic? </p>
    <p>The copywriter isn't sure. My guess is that they shouldn't be italic, but I'm not sure if there's a rule that applies.</p>
