    html: |-
      <p>I guess it depends on whether you want a complement or a contrast ;)</p>
      <p>If you want a complement, to me it has a distinct Arts &amp; Crafts feeling (a bit less severe than the most traditional old-style fonts, a bit more rounded), a bit like something Goudy might have done. So would <a href="http://www.myfonts.com/fonts/adobe/itc-goudy-sans/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Goudy Sans</a> work? That's calligraphic and humanist, but in an eccentric way. The italic would show it off at its best.</p>
      <p>I guess the alternative would be if you want a contrast a typeface that looks good in bold so it really stands out against the serif font. Perhaps an old grotesque font with a bit of irregularity might be nice - maybe something out of <a href="http://fontfeed.com/archives/helvetica-and-alternatives-to-helvetica/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Stephen Coles' list</a>. <a href="http://www.myfonts.com/fonts/mti/grotesque-mt/std-bold-extended" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Monotype Gothic Bold Extended, say</a> (caution: spacing is a bit off). Or <a href="http://www.huertatipografica.com/fonts/alegreya-sans-ht" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Alegreya Sans</a>, though that's more calligraphic again.</p>
