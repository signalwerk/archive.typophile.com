    html: <p>Yeah, OurType isn't cheap, but it's useful to look deeper to see what you get with even their basic OpenType fonts. <a href="http://www.fontshop.com/fonts/downloads/ourtype/fresco_2_ot/" rel="nofollow">Fresco 2 OT</a> ($210) includes roman and italic with small caps, and both lining and oldstyle figure sets for each. Add <a href="http://www.fontshop.com/fonts/downloads/ourtype/fresco_4_ot/" rel="nofollow">Bold and Bold Italic</a> for another $210 or get <a href="http://www.fontshop.com/fonts/downloads/ourtype/fresco_family_ot/" rel="nofollow">all five weights</a> for $737.</p>
