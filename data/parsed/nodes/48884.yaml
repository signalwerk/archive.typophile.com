      <p>Yes, Ourtype is expensive, especially for our american neighbours :)<br>
      But with <em>Fresco</em> you get a typeface which is so versatile, a good investment for a lot of projects, not for one or two only.<br>
      There are a very few serif faces working gently in such a broadness (Dolly from Underware is another, but that is another topic).</p>
      <p>Greetings t.</p>
