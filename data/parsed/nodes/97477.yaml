      <p>I like seeing people making these sorts of efforts* but since a font needs so many parts -and so much extended concentration- to really end up as a usable thing I wonder if this could ever be useful for more than just sketching ideas - which means worrying only about letterforms, not a complete font.</p>
      <p>* And we had one like this earlier this year - can anybody find it?</p>
      <p>That said, I do hope my hunch is wrong - best of luck with it!</p>
      <p>hhp</p>
