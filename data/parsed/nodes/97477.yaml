      <p>I actually agree - there are some huge omissions.  I think some of the things i'm going to work on next are kerning and hinting... but from a growth standpoint I do plan on continually adding features.  From a bottoms-up perspective, there are only so many aspects or features of a font, and those could translate 1:1 to features in Glyphr.  But i'm also really interested in creating features that are useful to designers during the design process.  One example of this that made it into the current release is the concept of Seed Shapes... but the thing I like best about this project is that I can do whatever I want - there is potential to add any crazy feature I dream up :-)</p>
      <p>So if you have any specific ideas about the current shortfalls - or font design tools in general - I'd love to hear them.</p>
      <p>Thanks!</p>
