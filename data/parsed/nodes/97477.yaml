  - id: 527646
    user: 1250
    date: 2012-10-24T10:56:00
    date_raw: 24 Oct 2012 — 10:56am
    votes: null
    html: |-
      <p>You know, the one thing that's missing from any font editor (in fact any kind of vector drawing tool I know of) is what paper-and-pencil(-and-eraser :-) is great at: fuzziness, ambiguity. To me that's a natural part of making anything - which is why few people can make fonts entirely on the computer. It would be great to have an app[lication] that was naturally attuned to fleshing out ideas of shapes, not making final letterforms. For example instead of a curve being this totally crisp border between black and white what if it could be something with [controlled] ambiguity at any point?</p>
      <p>If you concentrated on that instead of making actual complete fonts you might just see designers (and not just type designers) picking it up like hotcakes.</p>
      <p>hhp</p>
