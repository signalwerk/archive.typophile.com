    <p>Hey All</p>
    <p>I'd like to pass along a little long-term project I'm working on - it's a browser-based font editor.  Sound interesting?</p>
    <p>I'm labeling it "Beta 2" because it still has a long way to go... but if you are into designing fonts, I'd love to hear any feedback you may have:</p>
    <p>Glyphr Studio<br>
    <a href="http://www.glyphrstudio.com" rel="nofollow">www.glyphrstudio.com</a></p>
    <p>Thank you!</p>
    <p>::mattlag</p>
