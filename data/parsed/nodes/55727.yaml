      <p><em>... more detail would be nice...</em></p>
      <p>In that case, you could perhaps be more specific about what kind of problems, because it is the nature of design to solve problems.</p>
      <p>In saying that all my faces solve problems, I should admit that mostly they are problems I've created, such as "What would a slab serif  designed by Bodoni look like?" Most type designs could be described like that, e.g. "What would my version of a squarish sans serif look like?"</p>
      <p>As I understand it, Erik Spiekermann's take on this is that types developed for use in specific projects have an inherent virtue.<br>
      So those would concern problems a client has created, such as, "What kind of face would work best in this particular corporate branding, for its particular media uses?" </p>
      <p>Different from both these are types which address problems of reproduction in specific media (e.g. Verdana) or problems of legibility in specific media (e.g. Clearview), or problems of readability with specific categories of reader (e.g. Century Schoolbook).</p>
