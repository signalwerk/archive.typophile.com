    html: <p>I suppose it might be useful to note that the alternative to this would be to design somewhat randomly and let time and users sort out which faces are the fittest for whatever purposes fonts are used. This may well happen at the character or glyph level, even as languages evolve. However, for something as complex as a finished typeface I would think that most of what is regularly used for setting type was designed by someone for some specific purpose.</p>
