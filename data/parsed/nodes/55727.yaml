      <p>Ditto what Nick says. :)</p>
      <p>I have to mention the types designed for The Century Magazine, designed by father, then son Bentons, as being an incredible fall back collection for me. They were developed to work well with the magazine, tall x-height (appears larger on page), designed to fit space well, and as a result using up less paper in printing. </p>
      <p>Century Old Style (and derivatives) are my 'copyfitting' standby whenever space is limited and copy is rich! </p>
      <p>Very usable problem solver.</p>
