    html: |-
      <p>Fantômas, </p>
      <p>I share your fascination with "purpose-driven" typefaces, designs like Bell Centennial, Georgia, Clearview etc. While Nick is right about all typefaces (and indeed all design work) solving some problem, I think you mean something a bit more specific, mainly dealing with physical/real-world constraints. I think his breakdown of these types of problems (reproduction in specific media, legibility in specific media etc) is a useful way to look at this stuff. </p>
      <p>For a while I was working on a typeface meant for E-Ink screens, similar to how Georgia and Verdana were designed for monitors. Turns out there are E-Ink screens with good enough resolution that there wasn't really a need for the typeface, so I abandoned the project pretty early on. </p>
      <p>Something I've done which addresses reproduction in specific media was a <a class="freelinking external" href="http://exfishgeekgraf.wordpress.com/2008/04/23/first-test/" rel="nofollow">stencil typeface for easy cutting by hand</a>. Most common stencil faces were designed to be produced by machines, and are very hard to cut by hand with a hobby knife. Gerard Unger gets close to a solution with <a class="freelinking external" href="http://www.gerardunger.com/allmytypedesigns/allmytypedesigns13.html" rel="nofollow">Decoder</a>. Lots of folks in the street art community use computers for designing their stencils, thouhg most don't have access to laser cutters. I've recently resumed work on this project, which was started at a time when I knew very little about letterforms and type design, and the results are naïve in many ways.</p>
      <p>Generally speaking, what's been said here about "all of the above" seems to make sense, that there are many reasons that typefaces get made. I've been doing thesis research on type revivals and there are many different motivations that go into reviving a face. Could be a client wants it, could be your own fascination with a historical form, could be for academic purposes...the list goes on.</p>
      <p>—Noam</p>
