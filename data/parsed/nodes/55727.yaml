      <p>There was a series of typefaces designed by Mergenthaler Linotype, ca. 1926–41, to address specific constraints and issues with newspaper printing -- paper issues, ink issues, press speed issues, dry stereotype matrix issues, etc. These were collectively called the "Legibility Group." They were Ionic No. 5, Excelsior, Opticon, Paragon, and Corona.</p>
      <p>-- Kent.</p>
