      <p>I think the names of Grasset, Auriol, Eckmann and Behrens are all right. But it was the founders who did the naming. And I think it is no coincidence that they all happen at once. These designs are examples of what Tschichold, in his austere modernist mode, called ‘artists’ typefaces’. They already had a high profile in the graphic arts, so it was a good move on the part of the founders to exploit their distinctive lettering as type, and call it by their names. I think it’s best to see these ‘designer’ faces in the new and very competitive context of type-making of the early 20th century, when the founders, threatened by the Linotype, felt a need to market their large bodied faces more aggressively. And in both France and Germany the marketing included a pretty powerful charge of national feeling.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Grasset 500_6195.jpg"></div><br>
      <div class="imageWrap"><img src="http://typophile.com/files/Eckmann 500_6193.jpg"></div><p></p>
      <p>It seems to me that the first instincts of Morris Fuller Benton took him in a different direction. He developed an impersonal design with the bland name of ‘Cheltenham’ (the type that resulted is a long way from the lively original sketches by Goodhue) and then marketed all the variations that were made in house as members of a must-have ‘family’ of designs, like Cheltenham Condensed, Cheltenham Bold, Cheltenham Bold Expanded, and so on. But since ATF’s  ‘classic’ names like ‘Bodoni’ and ‘Garamond’ sold pretty well too, they marketed the designs they bought from Goudy (and to which they gave a slick, professional ATF treatment, rather to his irritation) as ‘The Goudy Family’. And of course Barnhart Brothers and Spindler, who stayed independent from ATF, exploited the name of their one star in-house designer Oz Cooper, as in Cooper Black. ‘Star’ as in Hollywood, of course, which led the way.</p>
      <p>Apart from Gill (a special case) English Monotype mostly stayed with high-profile classics, like Garamond, Baskerville and Fournier. Being dead they did not ask for royalties.</p>
    html_clean: |-
