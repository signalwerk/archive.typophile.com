      <p>Goudy's is the only name that makes sense if you want to answer the original question. But then he is the first type designer to operate independently, being one of the new ‘lettering artists’ who drew letters for photographic reproduction rather than cutting every letter in metal by hand in the original size. And they drew them very well. Goudy's pupils in Chicago, Oz Cooper and W. A. Dwiggins, didn't do badly. The results were simpler type designs that could be made with Benton's new pantographic technology. </p>
      <p>And since – as we know because he took good care to tell us – Goudy not only sold designs to the type makers but made several of them himself, cutting his own pattern letters in cardboard, he wanted, understandably, to promote his own name. Unlike Grasset and Eckmann, fine artists whose names promoted their types. Making your own types at home and selling them. What an unheard of thing to do.</p>
