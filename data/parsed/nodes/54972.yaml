      <p>I nominate Edmund Fry, for <em>Edmund Fry's Great Primer Script</em>.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Frys_6192.jpg"></div><p></p>
      <p>This is from <em>Specimen of Modern Printing Types</em>, by Edmund Fry. Letter Founder to The King, Type Street, London, 1828. Although the family foundry was named the Polygot Foundry, also know at the time as Edmund Fry &amp; Son, Mr Fry, a great scholar and something of a self-promoter, positioned himself as the author of the book, and this typeface.</p>
      <p>None of the other faces in the book are prefixed by his name, and indeed his Great Primer Script is quite different, because it is a bizarre system of typography by letter parts--so he may well have felt inspired to claim credit for what was more of an invention than a style. However, the name "Edmund Fry" does appear prominently at the foot of many other specimen pages, so it could be said he named more than one of his types after himself!</p>
      <p>In this, and both the Caractère Grasset and Eckman-Type, the face is not identified solely by the designer's name, because that is used as a possessive noun.</p>
