    <p>I know it's common now for type designers to name typefaces after themselves, but who was the first to do this?</p>
    <p>I know Claude Garamond is an early type designer known for influencing the many forms the typeface Garamond has taken on today, but as far as I know, he never actually named his faces after themselves, the name Garamond was used retroactively.</p>
    <p>Anyone know who started the trend?</p>
