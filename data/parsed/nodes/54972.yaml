      <p>The name of Baskerville must be one of the earliest examples of self-promotion in type history. He was a designer, rather than a type maker, getting a professional punchcutter to realize his own ideas of what a type should be. He was selling what in France would called a ‘look’: an overall concept that covered type, paper, layout – everything. At the same date (1750s) Jean-Pierre Fournier (the elder Fournier) used the legendary name of Garamond to sell the original 16th-century types, for which he had matrices.</p>
      <p>I've been trying argue recently that the name of Caslon did not become a typographical ‘brand’ until the last of the Caslons had died, and the owner of the foundry (called Smith) was promoting the so-called ‘Caslon Old Face’ as a unique and genuine relic – a claim that led to all kinds of problems. <a href="http://typefoundry.blogspot.com/" title="http://typefoundry.blogspot.com/">http://typefoundry.blogspot.com/</a></p>
