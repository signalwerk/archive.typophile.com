      <p><cite>Re. China and Korea. I was wondering the same thing - but at best the type would have been named for the ruler or official that commissioned it, not the designers who did the work.</cite></p>
      <p>Here's what I can find about names of Korean typefaces.</p>
      <p>Typefaces that were commissioned by the Korean court were typically named after the name of the year in the <a href="http://en.wikipedia.org/wiki/Sexagenary_cycle" rel="nofollow">sexagenary cycle</a>. For instance, Gabinja was made in 1434, which was a <em>gabin</em> (甲寅) or a 'yang wood tiger' year, and Gyemija was made in 1404, which was a <em>gyemi</em> (癸未) or a 'yin water sheep' year.</p>
      <p>Byeongjinja, made in 1436, a <em>byeongjin</em> (丙辰) year, is also known as Gangmok Daeja because it was used for the big (<em>dae</em>) letters in the <em>gangmok</em> (綱目) style texts, which mixes two sizes of letters. It is also known as Jinyangdaegunja, because it was based on letters written by Grand Prince Jinyang (Jinyang Daegun).</p>
      <p>There are a number of other cases where typefaces are known by those whose lettering they are based on; Gabinja was also known as Wibuinja based on a false attribution of the letters to Madam Wei (衛夫人, <em>Wi Buin</em> in Korean), a Chinese calligrapher. Gabinja was actually based on the letters found in a number of books deemed to have beautiful lettering in the style of Zhao Mengfu another Chinese calligrapher, with Grand Prince Jinyang supplying the missing letters.</p>
      <p>Hanguja was a typeface made in 1677 based on the letters written by Han Gu, a noted calligrapher of the time.</p>
      <p>There are also typefaces known by the names of the publications they were used to print, or by the name of the person in charge of making them, especially if they were not commissioned by the court but by private individuals. Yulgokjeonseoja was made by a group of private individuals to print the <em>Yulgok Seonsaeng Jeonseo</em> (The Complete Works of Yi I, also known as Yulgok), and it is sometimes known as Honggyehuija after Hong Gyehui, one of its principal commissioners. I'm not sure if these names were given at the time they were made or later by type historians.</p>
      <p>All the typefaces I mentioned are those used for Chinese characters. Typefaces for the Korean alphabet don't seem to have been given separate names at the time.</p>
