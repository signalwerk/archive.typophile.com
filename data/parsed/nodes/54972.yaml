      <p><em>Goudy’s is the only name that makes sense if you want to answer the original question.</em></p>
      <p>As mentioned earlier in the thread, Goudy Old Style was named by the president of ATF, not by Goudy himself, who wrote that he "released" the name to ATF. Fry, however, was the foundry boss, so almost certain to have done the naming of Edmund Fry's Great Primer Script. Was Edmund Fry actually a type designer? Did he concoct that strange joining system? Who knows.</p>
      <p>Goudy nomenclature was no different than Fry's--possessive noun followed by genre, so: Goudy Old Style, Goudy Text, Goudy Medieval, Goudy Ornate, &amp;c. </p>
      <p>Bradley: 1895 (based on his lettering, rendered by Joseph Phinney.)<br>
      As an artist and designer who did his own lettering, and also freelanced type design to foundries, Will Bradley preceded Goudy.<br>
      But again, naming the face after him was probably the foundry's decision, to leverage his "brand recognition".</p>
