    html: |-
      <p>As for books, I'll hazard my sense of what's common now. Yes, I'm American and living in a suburb of the State of New York—I was even born and raised in NYC.</p>
      <p>I see one from column A and one from column B, if you will: what's popular and,  therefore, utilitarian; and what's (I don't mean this derogatorily, tho' there was certainly a time and place when it would have been) artsy.</p>
      <p>I don't think there's any new trend with the popular. It's pretty much for the usual suspects in the way of page size and font choices. For instance, 6" x 9" pages of, say, 10/12 New Baskerville or Adobe Garamond is not an unlikely combo.</p>
      <p>But I take it that what I lump in as "artsy" is what's of more interest. And there I'd say that I see more sans serif than ever in books' body text. Especially in books where the body text is blocky: in short paragraphs with display heads occurring often and lots of surrounding white space.</p>
      <p>I guess it's a modernist trend that started some time ago and hasn't really abated—perhaps it's a reaction to what's <em>au courant</em> in the first column and so won't change much till the popular/utilitarian stuff starts to change.</p>
      <p>Or else some of the folks here could jump-start a brand new direction and others could be engaged to make it a trend. Then, who knows, we might forestall the predicted demise of the printed book as we know it.</p>
