    <p>Hello All,</p>
    <p>I am currently working on a project targeting Americans, in particular New Yorkers. Now, I know its hard to generalise, but working in England, its hard to gain a thorough understanding of design in the US.</p>
    <p>I would appreciate if you guys could help me out with some stuff. I am focusing on publication design (books/magazines/catalogues). Obviously you could advise me on typography but also size, format, colour trends, overall style (like minimalist for example), image usage and anything else you can think off.</p>
    <p>I look forward to hearing what you have to say.</p>
    <p>Thank you</p>
