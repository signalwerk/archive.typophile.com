    <p>Hi!<br>
    has anyone done any research on <strong>The Flag of Our Union</strong> publications from the 1800s?? <a href="http://en.wikipedia.org/wiki/The_Flag_of_Our_Union" title="http://en.wikipedia.org/wiki/The_Flag_of_Our_Union">http://en.wikipedia.org/wiki/The_Flag_of_Our_Union</a></p>
    <p>there is not much to see online and the archives are really far away from my current town: Buenos Aires, Argentina.<br>
    if anyone has any useful links, photos or information i would highly appreciate the share. im particularly interested in production details like what press was used, if its still available at any particular museum and what type they featured for body copy...</p>
