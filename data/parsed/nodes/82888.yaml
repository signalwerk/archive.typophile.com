      <p><em>…as an artist he did not have the necessary technical knowledge of type production and so craftsmen and engineers also played a role in manufacturing Gill's typefaces.</em></p>
      <p>That's a bit of a non sequitur.</p>
      <p>The industrial structure employed by the large foundries was predicated on division of labor, so no one involved, artist or otherwise, could play all the roles themselves—except perhaps Morris Benton, who was a qualified engineer and owned the company! But even he delegated extensively, given the large number of typefaces he was responsible for designing.</p>
      <p>Goudy and Koch (an artist if ever there was one) balked at being shut out, and through force of personality were able to go deeper into the manufacturing process, eventually doing their own punch cutting—a retro rebuttal of the high-tech manufacturing process that Benton did not pursue. One would have expected the uncompromising Gill, handy man with a chisel that he was, to be a punch-cutter too.</p>
      <p>It will be fascinating for this research to address the creative tension between Gill and the type industry of the day.</p>
      <p>The same issues of authorship and division of labour exist now, as no doubt they always have and will.</p>
