      <p>"The same issues of authorship and division of labour exist now, as no doubt they always have and will."</p>
      <p>Yes, they still do, but today, it is far, far easier to "go it alone" than ever before.  A typeface is no-longer tied to either a typesetting machine or company or country or even continent.  The number of egos to get bruised is much smaller (fewer suits in the mix), the knowledge needed is achievable for the willing, and the effects of market failure are quite minimal compared to either metal or photo composition. </p>
      <p>To me the greater comparison, is to any industry which leaped past the manufacturing and distribution hurdles of 20th century and before to an era where "the product" is some sort of unseen encoded mathematical description of what will eventually be seen by the user.</p>
      <p>Great topic, Gerry! Can't wait for the book and movie!</p>
