    <p>This Collaborative Doctoral Award Studentship is between the University of Reading and St Bride Library, London.</p>
    <p>The Typeface Designs of Eric Gill</p>
    <p>STARTING OCTOBER 2011</p>
    <p>An AHRC Collaborative Doctoral Award studentship (fully funded fees and maintenance) between the University of Reading and St Bride Library, London is available to a suitably qualified UK or EU student.</p>
    <p>The period in which Eric Gill's typefaces were first manufactured was the golden age of hot metal typesetting and Gill himself is arguably the most important British typeface designer of the twentieth century. However, as an artist he did not have the necessary technical knowledge of type production and so craftsmen and engineers also played a role in manufacturing Gill's typefaces. This research will document the complete body of Gill's work as a typeface designer for the first time; explain the role he played in the conception and manufacture of each of his designs; evaluate the impact of hot-metal typesetting technology on Gill's typefaces and investigate the extent to which this was carried forward into subsequent versions which were produced for photocomposition and digital typesetting.</p>
    <p>In addition to extensive archival research at St Bride Library this doctoral research will draw on the archives of the Monotype Corporation Type Drawing Office held by Monotype Imaging, and of Ditchling Museum.</p>
    <p>Supervision will be by Dr Rob Banham and Professor Paul Luna in Reading, and Mr Nigel Roche at St Bride Library. The successful candidate will be expected to spend extended periods of research time at St Bride Library, for which travel expenses from Reading will be provided.</p>
    <p>Apart from the normal criteria for the selection of research students, specific criteria for selection for this studentship are</p>
    <p>- suitability for archival research</p>
    <p>- first degree/MA ideally in an aspect of design practice or design history, or a related field such as history of art or history of technology</p>
    <p>Informal enquiries should be addressed to Dr Rob Banham: <a href="mailto:r.e.banham@reading.ac.uk">r.e.banham@reading.ac.uk</a></p>
    <p>Application forms can be obtained from <a href="mailto:c.davidson@reading.ac.uk">c.davidson@reading.ac.uk</a>, and should be accompanied by a CV and a relevant example of writing.</p>
    <p>Closing date for applications: 24 June 2011</p>
    <p>Interviews are likely to be held at St Bride Library on 14 July 2011</p>
    <p>***</p>
    <p>Link here: <a href="http://www.jobs.ac.uk/job/ACS963/ahrc-collaborative-doctoral-award-studentship" title="http://www.jobs.ac.uk/job/ACS963/ahrc-collaborative-doctoral-award-studentship">http://www.jobs.ac.uk/job/ACS963/ahrc-collaborative-doctoral-award-stude...</a></p>
