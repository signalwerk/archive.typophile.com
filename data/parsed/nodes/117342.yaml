    html: |-
      <blockquote><p>It’ll take you between eight and ten hours on average—not for the whole font, mind you, for one glyph (≈ letter).</p></blockquote>
      <p>I <cite>think</cite> I know what you mean, but as a whole, this could be misleading. Better, probably, to just give a time for, say, populating both *Controls and Basic Latin* plus *Controls and Basic Latin-1 Supplement* (basically, and older PostScript font, having about 190 glyphs out of the 256 available spots). That should not take 1,710 hours (about a full year, using a conventional 8 hour day minus vacations &amp; holidays), even for four weights -- though it could be close, I suppose (though all four weights is not "a single glyph"). Finally, getting paid the full amount for each glyph's cost may be appropriate for commissioned work where there will be only one sale, harder to argue when a font is released as available for multiple users and multiple purchasers.</p>
      <p>If your general point is that the price of $30-$40 each is rather too low even for retail fonts, I'd go alone with that. One technology back from PostScript (say, Linotron 202), the list price for a single font (e.g., just the roman) was about $150. Less for smaller players like Compugraphic, but that would be the price of a Linotype font for one of their digital machines like the 202 or 505. While it did take a little longer, production of those fonts didn't involve *substantially* more work than today's digital fonts.</p>
      <p>But that number too can be illusory -- another marketing trick. If you bought a 20-font pack from Linotype &amp; drew on it as you needed new fonts, you wound up paying about $50 a single font -- in 1980 dollars, of course, when a brand-new Chevy Malibu was about $6,000. So, closer to $200 a single font in 2015 dollars.</p>
      <p>It's good to let people know the amount of work &amp; attendant costs that go into font production, no need to use a number that could lead to confusion.</p>
