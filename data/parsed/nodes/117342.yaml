      <p>Instead of basically calling us (at a minimum that's me, R and that forgotten punchcutter) liars, consider what we probably really mean. We're not talking about things like "n" and "ñ" each taking eight hours – certainly not just their black bodies. I for one don't produce fonts with very large character sets, so I'm not factoring in those armies of near-trivial composites. So, for example, when you divide the ~800 hours I spent making Maral with the number of character it has (~100), guess what you get. And there are characters in Mana that did take me way over 8 hours each.</p>
      <blockquote><p>you may need another line of work</p></blockquote>
      <p><em>NOW</em> is my "labor of cultural love" finally sinking in?  :-)<br>
      Or maybe you think I spend too much time on details you consider unimportant. You certainly wouldn't be alone. Well, I can totally live with that, and have been for over three decades.</p>
      <p>hhp</p>
