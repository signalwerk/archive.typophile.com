      <p>Last time I looked, this was a users forum. "Typhophile &gt; Typography/Composition." In such a forum, you might consider the needs of people who use type, rather than simply ignoring them.</p>
      <p>The impression you give to those of us who use type is that ideally, type is created by artists. Like painting or sculpture, there are people out there who commission the artist to make fonts (for reasons unknown). For the masses to see type, I suppose the sale of fonts has to be to museums, like other works of art. The costs of all this are to recovered by the museum charging admission, where interested people pay to look at the fonts.</p>
      <p>I don't know much about people who create type this way. Whatever. But if that is your model, there is little point in "instructing" all of us about all the time and skill involved, since we aren't the audience you're aiming at anyway. </p>
      <p>There is a marketplace out there. If you can get $1,000 a font (I own Trinité, remember? A customer wanted it, and paid for it. But just one, no one else uses it.) do it. If, on the other hand, the marketplace refuses to pay the amounts you want to charge, you might want to reexamine your assumptions. If it takes you 1,750 hours to create 190 characters, but no one will pay $87,500 ($50/hr) for the font, what now? Most people who sell fonts would say, well, that time spent factor has to come down. By all means,  make your own choices. But stop whining about it and asserting it is the norm. Pointless, in any case. You won't get much sympathy from the people who use type to create products. </p>
      <p>I use type. I get $3.75 a page for the composition of scholarly monographs (not straight text), and have to compete with Asia, where for $3.00 a page, from a reputable company doing acceptable work, you can get (1) the printer-ready pdf, (2) an archival pdf, (3) a "Universal" pdf (contents page &amp; maybe hooked up for on-line viewing), (4) a usable ePUB file to send to Amazon &amp; Apple, and and (5) a TEI-encoded XML file.  It would be silly for me to compete by claiming that all Asians are stupid and do shoddy work. Stupid, and racist. </p>
      <p>And yes, occasionally someone on Typophile makes the claim that typesetting books yields $20 a page. Your statements seem about parallel to that situation. So we have to ask, "On exactly what data do you base your claims?"</p>
      <p>And yes,  it is a kind of a lie to imply that the way you would like to work, which is not supported by a marketplace, is how everyone should work.</p>
    html_clean: |-
      <p>Last time I looked, this was a users forum. "Typhophile &gt; Typography/Composition." In such a forum, you might consider the needs of people who use type, rather than simply ignoring them.</p>
      <p>The impression you give to those of us who use type is that ideally, type is created by artists. Like painting or sculpture, there are people out there who commission the artist to make fonts (for reasons unknown). For the masses to see type, I suppose the sale of fonts has to be to museums, like other works of art. The costs of all this are to recovered by the museum charging admission, where interested people pay to look at the fonts.</p>
      <p>I don't know much about people who create type this way. Whatever. But if that is your model, there is little point in "instructing" all of us about all the time and skill involved, since we aren't the audience you're aiming at anyway. </p>
      <p>There is a marketplace out there. If you can get $1,000 a font (I own Trinité, remember? A customer wanted it, and paid for it. But just one, no one else uses it.) do it. If, on the other hand, the marketplace refuses to pay the amounts you want to charge, you might want to reexamine your assumptions. If it takes you 1,750 hours to create 190 characters, but no one will pay $87,500 ($50/hr) for the font, what now? Most people who sell fonts would say, well, that time spent factor has to come down. By all means,  make your own choices. But stop whining about it and asserting it is the norm. Pointless, in any case. You won't get much sympathy from the people who use type to create products. </p>
      <p>I use type. I get $3.75 a page for the composition of scholarly monographs (not straight text), and have to compete with Asia, where for $3.00 a page, from a reputable company doing acceptable work, you can get (1) the printer-ready pdf, (2) an archival pdf, (3) a "Universal" pdf (contents page &amp; maybe hooked up for on-line viewing), (4) a usable ePUB file to send to Amazon &amp; Apple, and and (5) a TEI-encoded XML file.  It would be silly for me to compete by claiming that all Asians are stupid and do shoddy work. Stupid, and racist. </p>
      <p>And yes, occasionally someone on Typophile makes the claim that typesetting books yields $20 a page. Your statements seem about parallel to that situation. So we have to ask, "On exactly what data do you base your claims?"</p>
      <p>And yes,  it is a kind of a lie to imply that the way you would like to work, which is not supported by a marketplace, is how everyone should work.</p>
