    html: '<p>For an academic thesis, Essay Text feels too lyrical and playful to me with its rather modest x-height and its narrow, calligraphic italics. Athelas is probably a little better. But if you want something from Type Together, I’d rather try a more robust typeface, such as <a href="http://www.type-together.com/Adelle" rel="nofollow">Adelle</a>, <a href="http://www.type-together.com/Karmina" rel="nofollow">Karmina</a> or <a href="http://rosettatype.com/Skolar" rel="nofollow">Skolar</a> (now distributed via Rosetta). And speaking of Rosetta: <a href="http://www.rosettatype.com/Huronia" rel="nofollow">Huronia</a> is very nice. What’s also nice is that both <a href="http://type-together.com/index.php?action=carro/edit_sale" rel="nofollow">Type Together</a> and <a href="http://www.rosettatype.com/faq" rel="nofollow">Rosetta</a> offer educational discounts that you might profit from.</p>'
