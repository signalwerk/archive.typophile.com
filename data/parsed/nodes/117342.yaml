      <p>Actually the figure of eight hours per letter might seem misleading, but to my surprised I fully realized its relevance a few years ago. The first outline font I made where time was no object resulted in that figure; so did my Mana grayscale bitmap fonts many years later! And at one point I read an account from a punchcutter of yesteryear (sadly I forget who) citing the same figure! So I think there's something there...</p>
      <p>That said, it's also become pretty clear to me that few type designers are actually that meticulous; many of them whip out a complete font in days.</p>
      <p>And of course, the amount a font house charges is very weakly correlated with the effort required...</p>
      <p>hhp</p>
