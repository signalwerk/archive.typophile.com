    <p>Since I have very limited knowledge about typography, I'm reaching out to you guys for some help. I'm currently finishing my Master's thesis and looking for a nice typeface to go with it. I'm looking for a serif, but I don't want it to be too classical. What would you recommend for the body text? And for the headers?</p>
    <p>Hope you guys can help me out. Thanks in advance!</p>
