      <blockquote><p>The impression you give to those of us who use type is that ideally, type is created by artists.</p></blockquote>
      <p>No, in fact I have little respect for Art, and typefaces do <em>not</em> belong in museums! When I made my Type Table, even though it was meant to celebrate type, I made sure the font remained usable:<br>
      <a href="http://www.typophile.com/node/28118" title="http://www.typophile.com/node/28118">http://www.typophile.com/node/28118</a></p>
      <blockquote><p>And yes, it is a kind of a lie to imply that the way you would like to work, which is not supported by a marketplace, is how everyone should work.</p></blockquote>
      <p>But when did I say that?<br>
      In fact it would be spineless and stupid of me to want others to be like me.</p>
      <p>My only point is that some people do average eight or more hours per (non-trivial) glyph, and I suspect most of those do so because they feel it's the right way to do it; I know that's what I do it. You don't go to that level, because you're clearly a more astute businessman. I for one have never done any of the math you've been doing concerning $/hr etc. Only hr/letter, and only out of curiosity.</p>
      <p>Just because I've want to make <em>some</em> money from type design (nevermind that spending time on Typophile isn't exactly good business sense...) you want to cast me as some sort of parasite, while in fact it increasingly seems like I'm much more idealistic than you...</p>
