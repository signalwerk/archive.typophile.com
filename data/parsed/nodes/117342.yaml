      <p>See<br>
      <a href="http://typophile.com/node/68060" title="http://typophile.com/node/68060">http://typophile.com/node/68060</a></p>
      <p>On John Hudsons's pricing, character design averages $40/glyph, hinting $30/glyph, and $480/day for writing the features code. I've written a lot of feature code -- It would be an odd font for it to take me more than a few hours, except for kerning. It takes me around  12 to 18 hours to kern a roman font, and 6 to 12 hours for an italic, but that's for a working roman for academic publishing, which for me includes a lot more than 192 characters -- arbitrary fractions, true-cut superiors, small caps. etc.. For Latin Basic plus Latin 1 only, 8 hours for both positioning (includes kerning) and substitution features.</p>
      <p>So, on John's pricing, $70 per glyph for design and hinting, on simple features (one day) add  another $2.50/glyph, but realistically, I'd add $7.50/glyph. For very complicated fonts, the features code will take longer, but then, there will be more characters...</p>
      <p>That yields between $72.50 and $77.50 per glyph. If each one takes you 8 hours, you may need another line of work -- your return would around $9.00/hr. The truth is, it doesn't take anyone 8 hours for each glyph. An "aacute," for example, doesn't take 8 hours over and above an "a" plus a "combining acute." Nor an "agrave," "acircumflex," etc. a comma and a period give the pieces for a colon &amp; semicolon, though spacing may be a it different. But not 16 hours worth.</p>
      <p>That was my whole point, someone saying "it takes 8 hours a glyph" is misleading, and in the end will lead to people not trusting what's generally calimed.</p>
      <p>BTW, if you read the referenced post, those charges are for a commissioned work -- one sale only. Two things: (1) it does not take 8 hours per glyph, and (2) most fonts, like Huronia, are <strong>not<strong> commissioned work, but will be purchased by multiple buyers.</strong></strong></p>
      <p>192 x $77.50 = $61,380. Seems a it high. If you have to sell the font for $35, you'll need to sell 1,753 copies to make the same amount of money. And while there are added costs for a full family, there are also econ0mies.</p>
      <p>(By the way, for the Original Poster, John Hudson is Ross Mills business partner at Tiro Typeworks. Ross Mills did much of the work on Huronia, with Rosetta handling some further details. Ross will never get rich off Huronia, if you look at the pro version, you'll see it is a labor of love.)</p>
      <p>In the end, while the publisher can always set the price as they choose, there is another party in all this, the user. If they feel a font overpriced, as long as there are alternatives, they won't buy. How hard the designer did or did not have to work isn't particularly relevant to them.</p>
