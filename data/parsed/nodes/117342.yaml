      <p>Let's suppose it takes eight hours for a lowecase n. Your choices are now limited with the m, h, r, etc.. No, an h is not <strong>exactly</strong> an n with a stem, but there is a best answer, and it's close. You are not starting over. And those choices inform the b, etc. You pretty quickly get to a point where, while not falling off a log, subsequent letters in a series don't take anywhere near as long -- or you've got a wonky font, unsuitable for text, masters thesis or not.</p>
      <p>Alternative for a M.A. -- take (&amp; pass) your Ph.D. exams &amp; just don't write a dissertation. They give you a M.A. for a consolation prize. Don't have to write anything...</p>
