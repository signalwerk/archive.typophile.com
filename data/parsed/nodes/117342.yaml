    html: <p>Nice to hear that you’ve found something to your liking! Don’t be shocked by the prices. Creating digital letters is a sophisticated and complex venture. It’ll take you between eight and ten hours on average—not for the whole font, mind you, for <cite>one glyph</cite> (≈&nbsp;letter). The Rosetta fonts are very reasonably priced. I think you won’t regret licensing Huronia. It’ll make your thesis stand out for sure.</p>
