  html: |-
    <p>I made a quick search and didn't find any topic like this, only the existing <a class="freelinking external" href="http://typophile.com/node/33915" rel="nofollow">Advice please: on useful old books to add to Typophile’s library</a>, which is not the case, I think. So I'd like to suggest some books about typography to be added to Typophile's library, all of them available in Portuguese:</p>
    <p>Pensar Com Tipos. -Lupton, Ellen. Cosac Naify, 2006. (translated from Thinking With Type)</p>
    <p>O que é a tipografia. -Jury, David. Gustavo Gili, 2007.</p>
    <p>História da Tipografia no Brasil. -Semeraro, Claudia M. &amp; Ayrosa, Christiane. Museu de Arte de São Paulo (MASP), 1979.</p>
    <p>Thanks!</p>
    <p>Henrique</p>
