  html: |-
    <p>As the topic subject suggests, the closest matches I could find for this font were Bradley Pro by Profonts and Fyne Fish by Nick Curtis. Now, I would be inclined to say that the latter would be the best match, but the typeface used in this logo (which belongs to the gothic industrial band Lestat) was used by them since the early 90s, and both Bradley Pro and Fyne Fish NF were designed and released in the noughties.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Lestat-band-logo_5532.jpg"></div><p></p>
    <p>Here is the cover of their album Grave Desires which was released in the early 90s.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/lestat - Cópia_4388.jpg"></div><p></p>
    <p>Does ANYBODY have ANY idea what this font's name is?</p>
