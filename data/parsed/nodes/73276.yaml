    html: "<p>Bradley is an old typeface, the aforementioned are just newer digitizations of it (there are others too). Quote: »BRADLEY is an 1895 typeface credited to Joseph Warren Phinney (1848-1934). It was based on lettering by Henry William Bradley (1869-1962) for a Christmas cover of Harper's Bazaar magazine. Bradley was the basis for logotypes such as Firestone and Ketel One, and has also been widely used by Disney on theme park signage.«</p>"
