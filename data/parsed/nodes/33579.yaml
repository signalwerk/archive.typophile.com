    html: |-
      <p>Just to clear up any confusion about our license:</p>
      <p>If you look at our <a href="http://www.houseind.com/index.php?page=licensing&amp;section=pricing" rel="nofollow">licensing pricing page</a>, you'll see that "our base license does, however, allow you to embed fonts in a .pdf to be sent to a service bureau or printer." Where we do charge extra is for cases when one is using the fonts in a PDF document that is sent out for distribution (as in the case of a PDF newsletter). If the text is non-editable, then it is either 10 cents per PDF sent, or a flat fee of $150 dollars for the year.  John is correct that this is per font. However it is just for the fonts used in the PDF document, so I doubt that one would run into the case of having to embed every font in the Neutraface family into a PDF. Also note, that the yearly fee is the one that is re-occurring, and only if you are still distributing PDFs with the font in it.</p>
      <p>For PDFs that are editable, we treat the PDF file like a raster device, meaning that one does need to have a license for each PDF. This is licensed at our multiple device site license pricing schedule (which gives a very healthy discount to multiple licenses).</p>
      <p>For Flash, we judge the fee on a case by case basis, though in general this is free for static text (meaning text that isn't being edited by a user, not text that is moving around the screen) and with a fee for a font being embedded as 'dynamic' text. Call us and we'll be more than happy to help you out.</p>
