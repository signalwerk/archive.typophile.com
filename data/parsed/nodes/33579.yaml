      <p>"most foundries will allow embedding, but with a different license"...</p>
      <p>Yes, but an embedding license for House fonts which allows for general use adds a fee of $150 PER YEAR for each font, so an embedding license for the full range of Neutraface fonts means you would be paying an additional $2,250 PER YEAR, over the original one time cost of $249. </p>
      <p>That's a <em>very</em> different license,  "to be fair" !</p>
      <p>I'm not saying that they shouldn't charge that fee, I'm just saying I wouldn't pay it, I'd buy something else. They're clearly not trying to sell to small time operators like me.</p>
