  html: |-
    <p>Who reads font promotional material? I've released a few fonts at MyFonts and Fonts.com and, I always hit a snag writing the promo material. Are such articles actually necessary? Who reads them anyway. I read them to get some idea what people are wrinting about their fonts. Some type fanatics might read them. The search engines sift through them, I guess. However, I don't think that sales are going to be improved by great copy. I never was very good at copywriting. So is there a point to spending a lot of time on a description? Maybe I'm missing something.</p>
    <p>James</p>
  html_clean: |-
