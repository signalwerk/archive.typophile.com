      <p>Well, you're in a bind. Honestly, the road that I would suggest here is, well, honesty. Don't ever sign a contract that might ever get you into trouble, ever. Contracts are made for lawyers and judges. If your client gets mad, there is a good chance you'll meet them both. And lawyers and judges will only look at the letter of the law, so to speak. If your client spends real money putting this logo into the media, and then thinks that you violated the contract, then you could be liable for severe damage fees.</p>
      <p>On the other hand, playing the Devil's advocate, I doubt that anyone in the legal system cares much about the way three letters look. Do your letters look different from any others? What happens when you overlay them with the original? Is it an exact match? If not, you must have done <em>something</em> to them…</p>
      <p>Alas, this is a matter which could be litigated back and forth. I wouldn't want uncertainty for that long. If I were you, I would hire a real lawyer (at least briefly), who is an expert on copyright and intellectual property law. That lawyer could do a real search for you, and give you a more definitive answer. If you got the go ahead from them, then—by all means—make sure that your client copyrights and registers their logo as a trademark. Copyright Registration and Trademarking are very important elements of the law, and sometimes all that can save an image.</p>
      <p>As one of the moderators here, I really need to stress that this kind of question is sort of inappropriate for Typophile. I don't mean that it is a bad question—in fact, it is a very good question—but this is not a legal forum. Lawyers do not post and read here. Here you will get the advice and opinions of other designers. These may console or distress you, but they won't really help you solve the legal questions raised… sorry.</p>
