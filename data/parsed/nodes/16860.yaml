    <p>Hello all,</p>
    <p>I hope this is in the right section. I have a legal issue. I designed three letters in the creation of a logo for a video production company. Yesterday I received by email a contract to sign were I state that the work is mine and I used nobody else’s font. Fine until here. Then I reread the contract and note it’s mostly about the typeface, so I asked a colleague of mine who is a polygraph to research the letters and see if it’s no other logo already and we found one :(<br>
    It’s a free font that can’t be used commercially. The problem is not really there, it’s that the creator could say I ripped his work and send me to court. The logo will be very mediatised. (If we could refrain from saying the mark in this thread it would be cool, not really wanting a Google search to turn up this thread)<br>
    Perhaps it’s the contract that worries me here, lines like: I certify that this logo is my original design and not a copy of an existing logo or font or typeface.<br>
    I’m not sure to sign, as in a way I do feel it is a copy or variant of Levi Halmos' work.</p>
    <p>I will put his three characters next to mine to show you the comparison. Edit: This isn’t a good example as I think there is a lighter version.<br>
    I also added the construction which is mathematically very simple, anyone could do it and that is also worrying.</p>
    <p>I have no idea what to do now. Perhaps refuse the contract.<br>
    Your help would really be appreciated.</p>
    <p>Thanks.</p>
    <p>Regards,<br>
    David Pache</p>
