      <p><em>You’ve used the letters of a font in someone’s logo and that is just plain legal.</em></p>
      <p>I don't think that it is legal if the client and their contract expect the designer to have drawn the letters himself.</p>
      <p>David (Berlow), my concern is exactly the contract. If the designer signs a contract that says, in effect, "I swear that all of this work is entirely mine, not influenced by any other," he <em>will</em> be in a bind if the client decides to think otherwise down the line. What is to prevent the client from him them if they feel like it? Even if he has the "legal" high ground here, the designer might not be able to match wits with the client's legal fees, and could thereby lose the case and be liable for whatever damages the client might seek.</p>
      <p>David (Pache) seems to be working in Switzerland. I'm not a lawyer, I don't live in Switzerland, and I don't know a thing about Swiss law. But this seems to me to be a question of contract law first, and maybe only second about copyright law.</p>
      <p>It isn't my liability at stake, David (Berlow), it's the poster's. What would you do, David (Below)? </p>
      <p>Sorry about the whole last-name-in-parentheses thing… it seems to be the easiest way to differentiate between David Pache and David Berlow :(</p>
