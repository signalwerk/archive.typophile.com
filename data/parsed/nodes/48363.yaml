    <p>Hi mates..!!!</p>
    <p>This is my first entry on 'Typophile' I'm here for just show and share an opinion of fontdesign and all kind like this about.</p>
    <p><strong>"THORTL - a new heavy blackletter"</strong><br>
    born and was inpired of my love to "Medieval concepts". When I designed this font I'm not complicated so much to myself about its shapes cuz I concentrated on a simple construction and keep two constant ideas on mind: one, that must be the readable and two, must keep the main concept. this is all.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/thortl-webshow_typophile_4334.png"></div><p></p>
    <p>Now on 2nd place you find a "farola" update, new sheet where show "farola simple"<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/Farola-simple_SHOW_3616.png"></div><p></p>
    <p>Now I done a new font for write technical things, over machines, mechas or so.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/SP-font_SHOW_UP_3783.jpg"></div><p></p>
    <p>and other work in progress, a font designed for very smallest prints  done according a optical test.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/minesmall-SHOW_UP_4836.jpg"></div><p></p>
    <p>New Update from "LEGAN" fontface</p>
    <p>May 17, 2009: New Update for: "Política" Uppercases.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Politica_2nd-WIP-show_6165.jpg"></div><p></p>
    <p>please check the attachment files for watch details.</p>
    <p>C&amp;C are very welcomed.<br>
    =)<br>
    Regards</p>
    <p>Pedro [PeGGO]</p><div class="imageWrap"><img src="http://typophile.com/files/LEGAN_update_05-03-2009_4507.png"></div><p></p>
