      <p>I like it, but only for large sizes. Based on the <strong>a</strong>, the counters will be too small to use below about 16 pt.<br>
      But back to your question about the <strong>w</strong>: The letters in this sample have details that are slightly off-balance, asymmetrical, but they all square up at the baseline. The <strong>w</strong> in example #3 is most simpatico with that style.</p>
