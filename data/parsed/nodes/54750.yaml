    <p>Good day all, </p>
    <p>I've been knocking up a custom type thingy for my mag while I'm on downtime at work. I was wondering if I could get people's opinions. I'm in many minds about the 'w' and I'm not entirely sure about the 'm' either. </p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/warm_6677.gif"></div><p></p>
