    <p>I'm trying to get a better idea of the characteristics of some of the less-commonly-seen letter-types. Could you direct me to some fonts that exemplify the difference between:</p>
    <p>* a "Textura"<br>
    * a "Gotisch"<br>
    * a "Fraktur"<br>
    * a "Bastarda"<br>
    * a "Schwabacher"<br>
    * a "Rotunda"<br>
    * (bonus) an "Uncial"</p>
    <p>I'm becoming mildly fascinated with faces that use non-Latin letterforms, particularly if they have some historical usage precedence. I know there must be lots of research and documentation out there about this. Can you give me half-a-dozen things to look at so I can start to see the distinctions?</p>
    <p>(Some things that tempted me down this rabbit-hole: <a class="freelinking external" href="http://www.myfonts.com/fonts/delve/rieven-uncial" rel="nofollow">Rieven Uncial</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/alphabetsoup/dark-angel" rel="nofollow">Dark Angel</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/emigre/mason-ot" rel="nofollow">Mason</a>. What the hell is Mason?!?)</p>
