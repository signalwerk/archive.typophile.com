      <p>Well, it only took nearly two years.</p>
      <p>I still wonder, though, whether there's an on-line resource where I can at least see a "family tree" of names of styles within the "Latin script writing system genres". Other than Wikipedia, which I didn't find helpful.</p>
      <p>I just came across something called "Lombardic" for example, and a search on Identifont and MyFonts turns up a variety of Lombardic-y caps married with fraktur lowercase, uncial lowercase, what-have-you. I take it that that's an artifact of the whole upper/lower case thing being a relatively recent development.</p>
      <p>A search on "bastarda" turns up enough of a variety of results that I can't tell which aspects are hallmarks of the genre and which are artifacts of trying to cram these historical styles into modern-day conceptions of alphabets.</p>
      <p>If books it is, books it is. They look like excellent books.</p>
