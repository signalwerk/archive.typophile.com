      <p>Since Googling "bastarda" turns up, for you, a bunch of modern typefaces without context, a book on the history of typography would definitely help you to achieve an organized understanding, since one of the first things you would find in one is historical examples of the various categories of typeface.</p>
      <p>Updike's Printing Types is available for free download, and it's not a bad place to start.</p>
      <p>Anatomy of a Typeface by Alexander Lawson, and An Atlas of Typefaces, by James Sutton and Alan Bertram (which was recently reprinted, and the reprint was remaindered, so copies should be inexpensively available) are additional helpful references.</p>
