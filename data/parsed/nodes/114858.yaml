      <p>Wow, okay, Updike's book is amazing. I can't claim that my understanding is better and more neatly categorized. But it's certainly <em>deeper</em>. Categorization may (or may not) happen as I view more and more of the typefaces I see with this new (and as yet incomplete) understanding.</p>
      <p>Fraktur Mon Amor is on my wish-list now.</p>
      <p>I still want to know where the hell we got Mason (<a href="http://www.myfonts.com/fonts/emigre/mason-ot/" title="http://www.myfonts.com/fonts/emigre/mason-ot/">http://www.myfonts.com/fonts/emigre/mason-ot/</a>) from. I think I can start to see the history of Andron 2 (<a href="http://www.myfonts.com/fonts/andreas-stotzner/andron-2/" title="http://www.myfonts.com/fonts/andreas-stotzner/andron-2/">http://www.myfonts.com/fonts/andreas-stotzner/andron-2/</a> ,  which I find increasingly charming), though.</p>
      <p>Y'all are awesome.</p>
