    html: |-
      <p>I think futuristic posters can be done with any typeface, it's just the usage that matters. It's probably more down to 'unknown'  or 'different'  since examples like the new alphabet and OCR-A are horribly outdated, and the tech that required the letterforms the way they are doesn't even exist any more.</p>
      <p>It's not really as a comment, (and I don't want to hijack your thread !) but I find it quite interesting since, well how new are those forms ? One of my lecturers for type design had once shown examples of old foundry type with almost the same abstraction, as what the OCR and New Alphabet had (although they were of course, designed that way for different reasons) So such shapes have always been around in minds, although less in use.</p>
      <p>This all aside, it's always a safe bet to go for futuristic type, cliches are there to use and play around with. And with at least one solid 'this is the future' primer in your design, you can play around more with the other aspects of the poster, making them less strict future-like.</p>
