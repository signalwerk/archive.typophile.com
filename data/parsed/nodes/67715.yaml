      <p>&gt;I think futuristic posters can be done with any typeface</p>
      <p>This seems to be an interesting topic. I believe two opposing forces might exist if you want to make something to convey two kinds of future. The opposition should stand between humanist and non-humanist types. Why is that? It has to do with the two generally conveyed futures of utopia and dystopia. Or, to explain better, of anarchy and autocracy.<br>
      What do I mean by this? Well, essencially, in autocratic governments it's more regular to see rigid and geometrically conceived typefaces, as well as architecture. Or at least it is that way conceived.<br>
      More calligraphic or humanist types are related to decadent periods (symbolic decadence), when a more broader knowledge has been acquired about a subject, period which is bound to cease it's existence.<br>
      I don't know if I'm fully explaining myself, but a historical overview might turn some light on this subject.</p>
      <p>Ancient Rome was definitely an autocratic government. And although typographical records for this period lacked rules, it's renaissance counterpart did, and renaissance was a period used by the catholic church to dignify itself.<br>
      More callygraphic records from the mannerist and pre-mannerist periods, derived from carolingian type, are more closely related to utopias, and to 'Utopia', by Thomas Moore.</p>
      <p>Once again, the Neoclassical/Romantic period were widely used to promote politics and governents, and didones are due to this time. But realist and expressionist types are very much more calligraphic, or perhaps less refined.</p>
      <p>Hitlerian domination were recurrent with their very structural blackletter opposed for a time humanist (more concretely roman) typefaces, when art deco thrived.</p>
      <p>And struturalism, gestalt and bauhaus promoted a neutral, or geometric type, for international use, without personality, much to the likings of '1974'.</p>
      <p>In the days we live, affected by today's general crisis, we once again prefer humanist types and faces, full of their own inconsistencies that themselves make type beautiful.</p>
      <p>It therefore seems natural when imperial future calls for it, to use types related in closeness to those of the sixties, due to the prevalence of sans in light-bound systems (computers and monitors) against serifs in print, and geometrical sorts that we all relate to 'future'.<br>
      A big problem with typography, as well as with every other arts, is that we usually apply our own time set ideals to different times and eras, which might easily find them obsolete or erroneous. Citing Robert Bringhurst in my own words (and I don't particularly fully agree with this specific point of view, but it seems to apply for this), type doesn't evolve, it changes throughout time.</p>
