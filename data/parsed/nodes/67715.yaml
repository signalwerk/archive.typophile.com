  html: <p>Hello everyone. I need a good recommendation for a SCIFI ish typeface. So far I am thinking of Futura. We were given a picture in class and had to write a short story about it. Then translate it into a typographic poster. No restrictions in regards to that. The picture had to do with robots and felt very futuristic.</p>
