    html: <p>Be very careful about kerning lowercase letters against the space. I’ve seen books where the pair was too tight and the space just disappeared any time a line was tight.</p>
    html_clean: <p>Be very careful about kerning lowercase letters against the space. I’ve seen books where the pair was too tight and the space just disappeared any time a line was tight.</p>
  - id: 363270
    user: 5094
    date: 2009-08-22T10:17:00
    date_raw: 22 Aug 2009 — 10:17am
    votes: null
    html: |-
      <p>You also need to think not just in terms of pairs, but triplets. Consider kerning "space" "W". Now consider what happens if a lower-case "f" precedes the space, as in "If Westmoreland had only . . ."</p>
      <p>I just rekerned a font where, amongst other things, the comma-quoteright kerning was so tight that the string f+comma+quoteright had the quote overprinting the terminal of the "f". Or another font where A+quoteright+comma was kerned so much that the comma overprinted the right arm of the "A". I know, none of these involve spaces; the point is to think in terms of the effect of pairs kerning in three+ letter situations.</p>
