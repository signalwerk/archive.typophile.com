    html: |-
      <p>You have to watch out for settings such as "A Tale of Two Cities".<br>
      If you are going to do it for capitals, it's a good idea to substitute "space.caps" that is wider than the default space, in "calt", to improve the look of all-cap setting.</p>
      <p>I don't think it really improves colour, and can be really nasty if a typographer uses H&amp;Js that reduce wordspace.</p>
      <p>Myriad has this feature, which is part of its really tight set. In general, it is very very slick, but it does fail occasionally, and it looks like the space hasn't been set, a typo.</p>
