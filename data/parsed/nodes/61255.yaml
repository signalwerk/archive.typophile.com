  html: |-
    <p>What are your methods of <a href="/wiki/kerning" class="freelinking" rel="nofollow">kerning</a> glyphs in a pair with the <a href="/wiki/space" class="freelinking" rel="nofollow">space</a> glyph?<br>
    I would like to kern at least letters like A,T,V,Y,Z,v,y,z,?,1,2,5.<br>
    Do you use wider range of pairs (eg. including other spacemen like f,t,w,x,4,7 etc.)?<br>
    I suppose it isn't just mechanical removing the sidebearing's value.<br>
    Do you use any control set, eg. "n_n" to compare the amount of light?</p>
