  html: |-
    <p>Lokal is a slab serif family with three weights, with italics and small caps, made for Lähivakuutus (that's Local Insurance, a Finnish insurance company). Before the make-over they used Gill Sans, and they wanted a more friendly typeface to get their "local point" across. Heh.</p>
