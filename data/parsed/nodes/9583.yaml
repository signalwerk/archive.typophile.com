    html: <p>I sure couldn't find it. It looks so real, though. But, given that it doesn't appear anywhere else on the site or, it appears, anywhere else on the magazine cover, I'm inclined to agree. Similar fonts include <a href="http://www.myfonts.com/fonts/agfa/jeunesse/">Jeunesse</a> and <a href="http://www.myfonts.com/fonts/linotype/itc-stone-informal/">Stone Informal</a>.</p>
