    html: <p>I'm pretty certain this is a custom logotype. I'm sure the local font-hounds will let us know if I'm wrong. <br> <br>I'd be willing to bet that it was strongly influenced by, if not derived directly from, Eric Gill's Joanna -- very popular with lifestyle magazines, especially after Martha picked it up (although now MSL is no longer using Joanna). <br> <br>-- K. <br></p>
