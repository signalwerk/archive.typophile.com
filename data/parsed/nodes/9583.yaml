    html: <p>Custom job, and Kent is spot on about the Joanna influence. Rookledge's was no help, except in pointing out the similarities with Joanna in most of the characters. uc S is quite different, all lc characters except f and r can be customized quite easily starting from Joanna by chopping off serifs and flipping/mirroring parts. <br> <br>If you want a similar <i>feel</i> without having to go through the customizing, try <a href="http://www.myfonts.com/fonts/agfa/rotis-semi-serif/" target="_blank"> Rotis Semiserif</a>.</p>
