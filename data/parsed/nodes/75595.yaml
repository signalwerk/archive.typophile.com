    html: |-
      <p>I haven't been able to find a match for the top line.</p>
      <p>It seems to me that the matter in the middle is more likely to be a Clarendon than a Modern; for example, it might be Antique No. 6.</p>
      <p>On the bottom, we do have a fat and bold version of a Modern; it could be Title No. 2.</p>
      <p>That is, if one is using the Fifteenth Book of Specimens from the Cincinatti Type Foundry.</p>
      <p>The type is all much too old-fashioned for, say, the 1923 ATF specimen book; one does, apparently, have to go back to the 19th Century.</p>
      <p>I was suitably astonished, though, in coming across Gothic No. 8 on page 217 of the specimen book of the MacKellar, Smiths, and Jordan company of Philadelphia for June of 1892.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/future_6563.jpg"></div><p></p>
