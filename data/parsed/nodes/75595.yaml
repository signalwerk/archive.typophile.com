    html: |-
      <p>It's definitely not Cheltenham Bold Extra Condensed, because there's no big serif on the crossbar of the E. Globe Gothic Condensed has thick and thin strokes, but no serifs at all, so it's out as well.</p>
      <p>Miehle Bold Headline is very close, but the crossbar in the R is only in the middle of the character, while in the example it's significantly below the middle.</p>
