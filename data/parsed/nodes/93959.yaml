  html: |-
    <p>often have i read that the color of red has been the only available color in "the old days" to distinct an element from the rest of the black typography. so red is often called the "color of typography".</p>
    <p>but why is that? does somebody know any source that explains the reason behind this? i assume that color was something rare then, and probably red was easier (?) to produce, but why? does anybody know how red color was produced during the times of gutenberg or why it was often chosen as the only color next to black?</p>
    <p>thanks a lot in advance.</p>
