      <p>Black and red inks were the standard for manuscripts since at least the 5th century (yes, easier to make than other colors). Printing simply followed suit.</p>
      <p>See "Rubrication" <a href="http://en.wikipedia.org/wiki/Rubrication" title="http://en.wikipedia.org/wiki/Rubrication">http://en.wikipedia.org/wiki/Rubrication</a></p>
