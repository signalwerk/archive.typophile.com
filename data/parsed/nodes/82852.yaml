    html: |-
      <p>Hi Tanya</p>
      <p>If you have been testing and making amends using the same font name you may need to delete the Windows font cache file. You can find it in:<br>
      C:\WINDOWS\system32\FNTCACHE.DAT (for XP)</p>
      <p>Do a restart straight after and a clean font cache will be created.</p>
      <p>M</p>
