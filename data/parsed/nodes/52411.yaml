      <p>Bart, I don’t think the fact that the catalog was printed means a typeface had to be used. There are any number of ways that hand-drawn lettering could be reproduced as part of a printed page. For example, a metal plate could be made and used for the printing. Do they ever use the same lettering for anything except the logo?</p>
      <p>- Mike Yanega</p>
