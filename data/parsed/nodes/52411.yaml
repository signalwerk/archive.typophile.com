      <p>You also said this was from an “old .. catalogue poster”. If ’old’ is before the 1980’s, the 200,000+ font statement doesn’t apply. Digital fonts were only starting to be widely used by the mid-to-late ’80’s, and the number of fonts was not so large until relatively recently.</p>
      <p>I have looked at books I have on type, and so far I have not been able to match this blackletter style.</p>
      <p> - Mike Yanega</p>
