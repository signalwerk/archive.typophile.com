  html: <p>Can anyone help me identify the type face being used throughout Martha Stewart's new publication, "Everyday Foods"? The same sans serif font is used in light, medium and bold weights, as well as in small caps. Very understated, very classic, with a few quirks. It's  similar to (but not) Advert and Praxis. Got any ideas? For more examples, go to <a href="http://www.marthastewart.com/everydayfoods" target="_blank">http://www.marthastewart.com/everydayfoods</a><img src="http://www.typophile.com/forums/messages/83/7732.jpg" alt="martha sample 1"><img src="http://www.typophile.com/forums/messages/83/7733.jpg" alt="martha sample 2"></p>
