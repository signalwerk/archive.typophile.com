      <p>Hi again,</p>
      <p>Since I'm still looking for info on this Westminster, I thought I'd bump this thread with a more specific question. The paragraph of information from Microsoft fails to mention the designer by name, or even the bank the font is supposedly named after, but it does mention "Photoscript" as its producer. Google searches on "photoscript" turn up many hits which are clearly unrelated, so can someone please tell me (if you know) which Photoscript is being referred to in this context?</p>
      <p>Incidentally, I've got samples of Westminster in use as early as 1971, but still no mentions of it by name until the 90s.</p>
      <p>Thanks in advance for any and all suggestions.</p>
