    <p>Hi,</p>
    <p>I'm trying to learn more about the font called "Westminster," which has been distributed with Windows since Windows 98. Essentially, it's one of many typefaces like Data 70, Orbit-B, and Moore Computer which create letters that mimic the numeric forms from the MICR font E-13B.</p>
    <p>All of the information I can find on the web about Westminster appears to be based on the information Microsoft <a href="http://www.microsoft.com/typography/fonts/font.aspx?FID=208&amp;FNAME=Westminster&amp;FVER=1.01" rel="nofollow">provides</a>, but I have reason to be suspicious of the accuracy of what it claims.</p>
    <p>Mainly, that paragraph seems to suggest that Westminster came first and the others followed. I doubt this because the arabic numerals in Westminster are quite different from E-13B. The article (facetiously) suggests that one might use Westminster's numbers if one owned a bank, but obviously this would not work. Moore Computer, on the other hand, <em>does</em> include numerals more or less identical to E-13B and is generally more faithful to the form, so it seems logical in at least an aesthetic sense that Moore Computer is the first full alphabet based in MICR. (Incidentally, I'm <a href="http://typophile.com/node/35550" rel="nofollow">still looking</a> to confirm some basic info about Moore Computer, so if you know anything, please post).</p>
    <p>So basically, I'm just wondering if anyone knows anything about Westminster beyond what is in the Microsoft page. The fact that it doesn't actually name the designer also makes me suspicious, as does the fact that I haven't found any mentions of it that pre-date its release with Windows 98. Admittedly, I haven't performed an exhaustive search, but none of the dozen-or-so type encyclopedias, histories and specimen books I've consulted that should cover that period mention it at all. </p>
    <p>Thanks,<br>
    Zach</p>
