      <p>I don't think there really is a typical futurist (body) typeface. From what I've seen (so far) they used typefaces that were at hand (like Bauhaus or Art Deco or plain) and played with composition.</p>
      <p>But I'm not an expert on the matter. I didn't mean to state things you already know, I was just intriged by your question. It's an interesting movement.</p>
