    <p>I'm struggling to find a font from the Futurism movement. Does anyone know any common typefaces from the 20th century that were used in futuristic works? (1909-1920s).</p>
    <p>Also, I read somewhere that Studley is a font that was used. Does anyone know where I can download this, or if it is even available digitally?</p>
    <p>I greatly appreciate any help you can give me.</p>
