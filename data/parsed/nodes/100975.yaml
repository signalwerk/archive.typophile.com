      <p>I'd agree that the type seems cramped (both the letter spacing and the space between lines). To me the lower case versions are more interesting visually.</p>
      <p>As for the mark, frankly I'm not sure you even need one; a nice type treatment might be enough. But to comment on the ones you're showing, for 1-2 if you're going to show a bar graph, show it going up, not down (because you're improving their business).  3-4 seem too abstract. 5-6 an icon of people could definitely be a direction to explore, but it's also a symbol that's overused and neither of the treatments you show seem very interesting to me. 7-10 a stylized "e" is certainly a possibility, but none of those seem very interesting to me. Like I said, try some typographic solutions and you may find that's all you need.</p>
      <p>Your tag line (the business renovators) is tiny; it'll be hard to read when the logo is small.</p>
