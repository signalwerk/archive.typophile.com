      <p>It is really important to put a lot of thought into what exactly you want to communicate. This makes me think of secret agents of the government like the movie 'Men in Black'. The tippy toes almost says ballet or floating. It feels like a 1940's idea of what business is, and I wouldn't be surprised at all if your clients are more interested in a more cutting edge approach. The name says entourage, but there is only one guy - this is a little confusing. The name almost suggests that you will get a bunch of people working on your business. </p>
      <p>As for the look, the leading could use a lot of work. Too tight for me. Also consider how this reproduces at 1cm x 1cm. I think you will find that many of the small details are lost.</p>
