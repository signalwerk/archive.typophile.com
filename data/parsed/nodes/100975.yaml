      <p>I agree with what Chris said. Talk to a number of designers, look carefully at their portfolios (especially logos), ask for references (the names of some clients you can phone to discuss how the jobs went), and get a written estimate.</p>
      <p>If there are any local companies that have nice logos, ask them who designed it.</p>
      <p>Keep in mind that "designing a logo" can mean different things to different designers. For a low-bid designer it might just means spending an hour cranking out some top-of-his-head concepts. For a higher-priced designer it might mean spending a ton of time — having in-depth conversations with you about your business, spending many hours coming up with concepts, several meetings with you and lots of logo fine-tuning, design of your stationary (including getting printing bids for you and inspecting the proofs) and maybe designing your website, etc. The old saying "you get what you pay for" is often true.</p>
