      <p>I completely agree about having a professional do the design, it's just I've hit boiling point with frustration trying to get designers to get this logo right. In the past I've been able to have high-end designers or creative agencies work on logo concepts but I'm in a different position this time. Against my better judgement I thought I would get a cheaper designer to come up with concepts but as you've seen, they are less than acceptable.</p>
      <p>This seems a great forum with some real experts on type and logo design so I was hoping I could get some advice on a good type I could use for a short term logo so I can at least get my website live. Then when I have a bigger budget I can get a professional to do the logo and other design work I require.</p>
