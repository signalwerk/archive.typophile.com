      <p>I’m totally with hrant on this one. Give a designer money in exchange for their knowledge, training, skills, and experience. The same way you intend clients to approach you. This sort of “self surgery” is an inefficient consumption of your resources. Hire a professional who can produce greater quality in less time, and redirect the energy you would spend trying to do it yourself back into your business. In the collective time we have spent talking, your business cards would be in your wallet.</p>
      <p>That said, I think you’re moving farther away from a solution and over complicating things. Ignore all marks entirely. Ignore colour. Only focus on the type in black and white. You might not even need a mark after the type is sorted.</p>
      <p>I strongly recommend you take the “pay a professional” route though. People here are capable of doing in seconds what you would not ever be able to accomplish alone. Such as my father prescribing medication. Trust me. There are <em>highly</em> specialized professionals here. Some of the best in the world. You can contact anyone of them directly by clicking on their name.</p>
