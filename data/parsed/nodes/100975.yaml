      <p>Hi Shane, to a potential client or even to a first glace viewer of your logo what do you want to impart?</p>
      <p>Start there. That's the key. From there your brand will unfold.</p>
      <p>Is it open friendly strong no nonsense? How about deep determined thoughtful? Stylish conservative modern and tech savvy? Or is it simply all about trust? </p>
      <p>Write it down, make a list, develop a hierarchy of characteristics. Those characteristics that you understand your business/client relationship to be are those that you can comfortably promote.  It's not something you can buy off the rack ...what makes E.C. unique to you?</p>
      <p>It seems to me you were lost from the beginning ...but not anymore :)</p>
      <p>5star's version of amazing grace ...lol.</p>
      <p>n.</p>
