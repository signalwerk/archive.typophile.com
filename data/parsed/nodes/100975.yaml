      <p>“…<em>what ballpark price do you guys charge for logo design?</em>”</p>
      <p>That will vary depending on the designer and deliverable. I would not expect to see people posting their hourly rates however. Typophile isn’t really a job-board.</p>
      <p>I would recommend contacting some local design firms and speaking with them in person so you can provide them with an accurate description of your context, from which they can prepare you a proposal.</p>
      <p><a href="http://www.yellowpages.com.au/find/graphic-designers/broadbeach-qld" title="http://www.yellowpages.com.au/find/graphic-designers/broadbeach-qld">http://www.yellowpages.com.au/find/graphic-designers/broadbeach-qld</a></p>
      <p>“<em>I've hit boiling point with frustration trying to get designers to get this logo right</em>.” and “<em>Against my better judgement I thought I would get a cheaper designer to come up with concepts but as you've seen, they are less than acceptable</em>.”</p>
      <p>If I am reading this correctly, you paid less money for a sub-par solution which isn’t working for you. The cause of your frustration most likely stems from an incomplete project brief. Don’t shoot the messenger, but it sounds to me like you need to go back to the drawing board and start over with a thorough brief for sign-off before you proceed any further. </p>
      <p>Without this <strong>signed off and legally binding document</strong> in place, you and your designer will simply end up going in circles debating who’s favourite colour is best. The end result will be an unhappy you with less money and a mark you don’t like, as well as a frustrated designer. Everybody loses. We have all seen this happen more times than we would like, but that’s what you get when you take an aesthetic shot from the hip, hoping to get lucky, compared to following a clearly documented process and making informed decisions <em>by design</em> as opposed to by chance.</p>
      <p>I don’t know of any professional design organizations in Broadbeach, but you might have some luck asking other Typophiles on the <strong><a href="http://typophile.com/forum/4" rel="nofollow">General Discussions board</a></strong>. I bet we’ve got a few Ausies in here somewhere…</p>
