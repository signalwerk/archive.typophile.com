    html: |-
      <p>As micro says, every method has drawbacks. One of my favorites, typeface.js, has licensing issues and is not selectable, sIFR uses flash and isn't appropriate for body text, fILR just does image replacement dynamically and cufon uses the "canvas" tag, but doesn't result in a searchable text. Of course, there is the classic span replacement (which is what I still use) since it is reliable and works pretty well, but you can't select the text either.</p>
      <p>If you're looking for SEO type of thing, most every solution will work since they all leave the text in a form such that, without CSS, they are visible.</p>
      <p>So those are the primary methods for getting everyone to see the same font all the time. Now, if you are willing to accept that some people will be able to see the font and others won't, you can use methods like <a href="http://unitinteractive.com/blog/2008/06/26/better-css-font-stacks/" title="font stacking" rel="nofollow">font stacking</a> to provide a better experience to those who have the particular font and a slightly lessened experience for those who don't. Of course, this can be partially overcome by the delicious <a href="http://github.com/philoye/FontUnstack/tree/master" title="fontUnstack" rel="nofollow">fontUnstack</a> that came out last week. What fontUnstack does is check to see which font is installed on the computer and then assigns special CSS classes to elements you want to have that font. In this way, you can set up specific CSS style rules for people who have each particular font in the font stack and can maintain an orderly grid despite the inherent differences in the fonts' leading, kerning and scale.</p>
      <p>We're at a bit of an interesting time where print design is merging into web design, but issues like web licensing for fonts has not been resolved in any meaningful way (font-face? EOL? subscriptions?). So, if you want to use a non-standard font, your options aren't that great, but they do exist and it really depends on how you want to use the font.</p>
