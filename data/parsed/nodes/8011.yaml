    date_raw: 24 Dec 2004 — 9:35am
    votes: null
    html: "<p>Andre, I have been studying the original drawings from your 5 and 8 December posts. First allow me to echo what the others have: 1986? Wow. I was learning pen technique in an architectural studio then... <br> <br>Hrant's point about rules being the means not the master is probably critical in developing Graphice. To begin though, I would lean very heavily on these rules to outline all the glyphs. <br> <br>To my eye the essential character is the bowls and arms of these glyphs describe the sides of an uneven polygon or hexagon. It can look really nice in letter combinations like the g-r-a-p-h in number four on 5 Dec. It feels dynamic in a way many formal unmodulated faces don't. (I would start building the glyphs around this weight). <br> <br>I think there will be a real challenge for you in obtaining a consistent form that doesn't appear to wobble or zig-zag up and down across the top of the letters. I also suspect that you might not want to make your glyphs too wide (like the 'c'). When that happens the top arms or top of the bowls  really looks like its crumbling to the baseline. <br> <br>I'd also not pursue the directions indicated in you 'freitchbalgor' drawings as part of Graphice but keep them around for future development because the double storey g of 17 Dec is really nice. <br> <br>A small departure on technique: For what it's worth , you may find that relying heavily on the rules (of which Hrant spoke : the form of your module and the width of characters say) is critical in  creating a first draft of all the major glyphs. Then set the rules aside and think only about why you made the rules in the first place and set about adjusting modifying and unifying the letters to suit that objective only. <br> <br>I hope you have a really nice Christmas/Whatever, I'll check in soon. <br> <br>Jon</p>"
