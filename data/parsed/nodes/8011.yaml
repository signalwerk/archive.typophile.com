    html: <p>In any construced (or I guess more broadly, Modernist) font there's a very strong urge for modularity, for applying "rules". The problem is that a font needs to be more organic than that (at least strucurally, if not necessarily in finish) in order to be harmonious for text, as opposed to just a bunch of discrete shapes. So basically the "rules" have to be a means, not a master - you have to know when to bend them, or even break them outright. <br> <br>hhp</p>
