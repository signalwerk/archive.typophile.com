    html: <p>Andre, <br>I think you are now getting somewhere in your most recent post that can be used as text.  Your earliest drawings seem more aimed at display.  The ones in the middle (Dec. 16) were more textlike but less dynamic and totally different than your first concept.  I think you now have to make some small text sized printouts to see if (as I think) there will be dark spots at some of the joins.  You can try thinning the horizontals a bit or tapering to the joins more.  Another way is to cut a notch at the joins.  This will keep the geometric qualty more than tapering.  It won't be so visible at text sizes but it will help even the color.  I am uploading a crude sample of what I mean by notching.  It is not well drawn so don't take it too literally.  It may look silly when reduced so don't feel bad about abandoning it. <br><img src="http://www.typophile.com/forums/messages/29/62806.gif" alt="notch example"> <br>I like the inslant of the "h" working with the "c".  I think you need to now work a bit on spacing and sidebearings.  This will help you see if your proportions and relative glyph widths are working.  You may then see that the "c" may need to be narroed to appear like the optical width of the "e".  Personally, I am a strong believer in doing things by eye instead of by ruler.  If it looks right, it is right no matter what the ruler says. <br> <br>Keep up the good work. <br> <br>ChrisL</p>
