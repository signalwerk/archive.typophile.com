    html: <p>I agree with Hrant and Randy. The stuff in your first post has the most potential. Your most recent attempt is good too (for text), although it looks quite 'generic'. <br> <br>In your first sketch, the shapes are too rigid and geometric; follow Hrant's advice and make them more organic, but do it subtly. See <a href="http://www.typeworkshop.com/index.php?id1=type-basics&amp;id2=&amp;id3=&amp;id4=&amp;id5=&amp;idpic=03#pictloader"> this link</a>. <br> <br>Interestingly, I think the rigid forms work best in the oblique version than in the roman.</p>
