    html: "<p>First of all, the new stuff (starting in mid-December) is very different, and seems to have a terminally confused character... In contrast, I think the original (1986? Wow) has promise - it just needs a lighter touch: refinement, and a less \"literal\" approach (like don't be afraid of going against the flat-base \"module\" if needed). It might be useful to point out that the \"g\" is right on, but the \"a\" is unhappy. <br> <br>And I agree with the other guys about the dark weight having the most potential, but I also think a very light weight might click nicely. <br> <br>I guess work out all of the lc and let's see what you get! <br> <br>hhp</p>"
