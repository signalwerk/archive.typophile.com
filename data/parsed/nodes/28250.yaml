    html: |-
      <p>While Typophile was down, I have released the font @ exclamachine.com, though I wasn't going to publicize it til tomorrow. I had done <em>exactly</em> as you described to the 'x'!</p>
      <p>Originally I had the 'U' and the 'V' mapped to the same glyph; that was even closer. ;) I hadn't noticed the 'N' problem until you mentioned it, thats why others' eyes are so good. It doesn't look particularly like the 'A', but quite like what someone might expect the 'A' to look like.</p>
      <p>As far as screen readability, I struggle with that with all fonts, but the smooth flow of the lowercase helps with that a great deal. And I took more time than usual, to try and get it to scale better.</p>
      <p>Thanks for the feedback, very much. I plan to go back and add text figures soon; I think I will also redraw the 'N' if I can get a good image in my mind, before publicizing the font.</p>
      <p>Choz Cunningham<br>
      !Exclamachine Type Foundry</p>
