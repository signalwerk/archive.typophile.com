    <p>Here's a preview of a nearly completed font, !The Black Bloc. My attempt is to fuse the distinct look of a gothic script with a more contemporary style. I think this font looks far better in flowing text than as individual letters, which is nice!<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/tbb critique sampler_5733.jpg"></div><p></p>
    <p>Any thoughts on line spacing, kerning (looser?) or anything else of note? Any tricks to getting it to look better on screen under 13 points?</p>
    <p>My favorite letters are the e, W, x and M, my least favorite are the V, I and the T. Yours?</p>
