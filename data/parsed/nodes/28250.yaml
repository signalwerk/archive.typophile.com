      <p>Hi Choz,</p>
      <p>In my opinion, the 'x' is difficult to read, it looks like a mirror image of a 'z'. Maybe if you move the connection point of the 'side branches' a bit more the center it becomes more of an obvious x.</p>
      <p>Also, the 'N' is confusing with the 'A' and the 'U' and 'V' are close as well. </p>
      <p>I think for a decorative fonts like this, it will be a challenge to go for on-screen readability at low point size. Did you try to see what happens?</p>
