      <dl><dt><a href="http://typophile.com/user/23486" title="Click to visit an external URL." class="freelink freelink-external freelink-external">acnapyx</a> wrote:</dt>
      <dd><cite>LuzSans... is an exclusive HP corporate font, created by Hoefler &amp; Frere-Jones. It is also known as HP New Futura.</cite></dd>
      </dl><dl><dt>The copyright information for LuzSans reads:</dt>
      <dd><cite><strong>08/03 Luz, HP New Futura   The Hoefler Type Foundry, 1998-2003.</strong></cite></dd>
      </dl><p>LuzSans is used on the keyboard of HP Mini netbooks, and also on said computers as the default Window title font in HP's Mobile Internet Experience (MIE), a Linux distro based on Ubuntu 8.04.</p>
      <dl><dt><a href="http://typophile.com/user/2451" title="Click to visit an external URL." class="freelink freelink-external freelink-external">amiart</a> wrote:</dt>
      <dd><cite>does anyone know where you can buy this font from?</cite></dd>
      </dl><p>The LuzSans family (Light, Book, Medium, Bold and Heavy) can be downloaded from Canonical's software repositories (the company that maintains Ubuntu):</p>
      <p><a href="http://hpmini.archive.canonical.com/mie/dists/hardy-hpmini/universe/source/luzsans-ttf_1.tar.gz" title="Click to visit an external URL." class="freelink freelink-external freelink-external">luzsans-ttf_1.tar.gz</a></p>
