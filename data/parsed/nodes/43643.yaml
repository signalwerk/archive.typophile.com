      <p>Maybe it's referring to some special, modified version of some font like Lux Sans that the person who gave you the file created. "luzsans" only has one result on Google. If it was derived from Lux Sans, you'd think that the person would have chosen "LuySans" though. Maybe the person chose "LuzSans" because it sounds the same as "LuxSans" if you pronounce the X the right way.</p>
      <p>Or maybe it's not at all related to Lux Sans</p>
