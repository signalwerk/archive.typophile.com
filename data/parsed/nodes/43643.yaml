      <p>AFAIK, <strong>LuzSans</strong> or <strong>Luz Sans</strong> (I've seen written it both ways) is an exclusive HP corporate font, created by <strong><a href="http://typography.com/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Hoefler &amp; Frere-Jones</a></strong>. It is also known as <strong>HP New Futura</strong>.</p>
      <p>Obviously, the closest possible match is <strong>Futura</strong>.</p>
