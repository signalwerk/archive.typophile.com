    html: <p>Even though I like neither Bodoni nor ITC, I have to admit that ITC Bodoni is a notable font, mostly because of its optical sizes... which is exactly the sort of refinement ITC is <i>not</i> known for doing, especially not back when they were considered trendsetters. (Shudder.) <br> <br>ITC bashing is done by people of all age groups, as long as they have an eye for good type. On the other hand, some people who <i>do</i> have an eye for good type are unable to see the ITC fonts of the previous generation as the abominations that they are, presumably because they were influentiable youths when that crap was coming out. ITC Garamond for example isn't just dated, it's a date from hell. <br> <br>-- <br> <br>BTW, another very interesting Bodoni is Linotype Gianotten - a very scholarly work. <br> <br>hhp <br></p>
