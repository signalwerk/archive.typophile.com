    html: <p>As Bodoni-inspired faces go, I'm quite partial to Zuzana Licko's <a href="http://www.emigre.com/EF.php?fid=97">Filosofia</a>. I rather enjoy the softness of the serifs in contrast to the razor-edged versions found in many digital Bodonis (although I've heard this aspect of Filosofia described by others as 'mushiness'). Truthfully, the <a href="http://www.emigre.com/dp/getfontpage.php?PFilI.html">italic OS figures</a> give my the tinglies, and the <a href="http://www.emigre.com/dp/getfontpage.php?PFilU.html">Unicase</a> is one of my favourite stand-alone display faces. Of course, your mileage may vary.</p>
