    html: <p>Had some trouble with ITC Bodoni. Found that the "12" was a bit clunky at the 14-18 size (in a corporate brochure, plenty of leading, coated stock), and the "72" was too small-featured. But that's what I ended up using. Had to track it out a bit. Could have done with something in between. <br> <br>Prior to ITC Bodoni, c. 1990, I had combined Bauer Bodoni for display with Berthold Bodoni for text -- a pseudo-optical pairing. (Did the same thing with Old Style 7 and Monotype Old Style.) <br> <br>Those are the only Bodonis I've used, except of course for Bodoni Egyptian...</p>
