.bertholdtypes.com/adobe_lib/080310000.html</a> <br> <br>While not as historically accurate or as versatile in optical sizing, the Berthold Bodonis are nonetheless also very textworthy. The Old Face designs offer a nice alternative to the common Bodonis, and the Old Face Italics are particularly beautiful. Bringhurst recommends Berthold Bodoni in The Elements of Typographic Style (p. 207) as well as the Bauer Bodoni designs, but this, admittedly, was probably before ITC released their cut. <br> <br>I haven't yet used ITC Bodoni, but I've had good results with Berthold Bodoni. ITC Bodoni is on my wish list, though. <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\"> <br> <br>David <br></p>"
