    html: <p><i>BTW, anyone know how much a copy of the real Manuale Tipografico costs? I have the Octavo edition, but someday, needs be I must own the real thing.</i> <br> <br>There are two good, two-volume facsimile editions available. One from the Holland Press, 1960 (edition of 500), usually sells for $300 - $400 US. The more desirable facsimile is the one printed by Mardersteig at the Officina Bodoni in Verona, 1968 (edition of 206), which sells for anywhere from $2,000 - $4,000. There is also a third facsimile edition published by Ricci in Italy in 1965, but I have never seen it; Ricci is a serious publisher, so it could be good. I wouldn't be surprised if there are other facsimile editions. <br> <br>To find the price of an original, you would need to check the book auction records.</p>
