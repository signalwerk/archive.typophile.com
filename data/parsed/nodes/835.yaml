  html: <p>Greetings <br> <br>Can I get some advice about which Bodoni to buy ? Do you have a preference and why? <br> <br>And in general, I am baffled about this question whenever I go to buy a font where there's more than one version from different foundries / vendors.  Are there certain companies that are considered better than others? I read a lot of ITC bashing -- should I steer clear of their products? (I have managed to figure out that ITC Garamond looks pretty dated.)  Is Elsner &amp; Flake Bodoni considered superior to (say) Bitstream and Linotype, and that's why it's more expensive? <br> <br>Any help you can offer me is greatly appreciated.</p>
  html_clean: <p>Greetings <br> <br>Can I get some advice about which Bodoni to buy ? Do you have a preference and why? <br> <br>And in general, I am baffled about this question whenever I go to buy a font where there's more than one version from different foundries / vendors.  Are there certain companies that are considered better than others? I read a lot of ITC bashing -- should I steer clear of their products? (I have managed to figure out that ITC Garamond looks pretty dated.)  Is Elsner &amp; Flake Bodoni considered superior to (say) Bitstream and Linotype, and that's why it's more expensive? <br> <br>Any help you can offer me is greatly appreciated.</p>
