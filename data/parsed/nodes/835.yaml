    html: <p>&gt;My problem with unicase fonts (in particular such variants in families) is simply that the time is generally better spent on almost anything else.  <br> <br>I agree with you that Unicase fonts in families generally tend to be uninspired. Just made by combining character forms from the upper and lower case. But that was not the case (sorry) with Perla. <br> <br>However, the questioning of glyph shapes that we are seeing these days is part of the tenor of the times. The pendulum swings from eras where type design is considered the making of stylistic variations on archetypal forms, to other eras when those forms are questioned. <br> <br>You have done this kind of experiment yourself - I recall a presentation you made at ATypI Boston. I don't think that it was a Unicase, but it was a typeface you had designed with some interesting non-standard glyphs. BTW, was/will that be available as a font?</p>
