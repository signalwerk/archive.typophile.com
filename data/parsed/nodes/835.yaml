  - id: 6083
    user: 531
    date: 2003-08-05T16:31:00
    date_raw: 5 Aug 2003 — 4:31pm
    votes: null
    html: <p>There's nothing wrong with ITC type, per se -- it's just a product of its time. Unfortunately for ITC Garamond (and others), that time happened to be the '70s. <br> <br>Bodoni on the other hand is one that ITC got right. (Or at least, got most recently.) It represents an entirely different mindset from the ITC type that most folks bash.  <br> <br>Most digital Bodonis are nearly illegible at text sizes --  the thicks are too thick and the thins vanish. But the 6-point and 12-point versions of ITC Bodoni are both beautiful and usable. <br> <br>Of course, just like bellbottoms came back into fashion, perhaps exaggerated x-heights will become the new black. Only time will tell. <br></p>
    html_clean: <p>There's nothing wrong with ITC type, per se -- it's just a product of its time. Unfortunately for ITC Garamond (and others), that time happened to be the '70s. <br> <br>Bodoni on the other hand is one that ITC got right. (Or at least, got most recently.) It represents an entirely different mindset from the ITC type that most folks bash.  <br> <br>Most digital Bodonis are nearly illegible at text sizes --  the thicks are too thick and the thins vanish. But the 6-point and 12-point versions of ITC Bodoni are both beautiful and usable. <br> <br>Of course, just like bellbottoms came back into fashion, perhaps exaggerated x-heights will become the new black. Only time will tell. <br></p>
