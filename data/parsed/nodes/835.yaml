    html: "<p>ITC Bodoni Six: <br><a href=\"http://www.myfonts.com/fonts/linotype/itc-bodoni-six/\" target=\"_blank\">http://www.myfonts.com/fonts/linotype/itc-bodoni-six/</a> <br> <br>ITC Bodoni Twelve: <br><a href=\"http://www.myfonts.com/fonts/linotype/itc-bodoni-twelve/\" target=\"_blank\">http://www.myfonts.com/fonts/linotype/itc-bodoni-twelve/</a> <br> <br>ITC Bodoni Seventytwo: <br><a href=\"http://www.myfonts.com/fonts/linotype/itc-bodoni-seventytwo/\" target=\"_blank\">http://www.myfonts.com/fonts/linotype/itc-bodoni-seventytwo/</a> <br> <br>ITC Bodoni Seventytwo Swash: <br><a href=\"http://www.myfonts.com/fonts/agfa/bodoni-sev-swash-itc/\" target=\"_blank\">http://www.myfonts.com/fonts/agfa/bodoni-sev-swash-itc/</a> <br> <br>ITC Bodoni Ornaments: <br><a href=\"http://www.myfonts.com/fonts/linotype/bodoni-ornaments-itc/\" target=\"_blank\">http://www.myfonts.com/fonts/linotype/bodoni-ornaments-itc/</a> <br> <br>While I agree that ITC Bodoni is the strongest and most historically accurate Bodoni (and probably the best), I'd also urge you to at least consider Berthold Bodoni Antiqua and Berthold Bodoni Old Face. <br> <br>Berthold Bodoni Antiqua &amp; Expert: <br><a href=\"http://www.bertholdtypes.com/adobe_lib/080224000.html\" target=\"_blank\">http://www.bertholdtypes.com/adobe_lib/080224000.html</a> <br> <br><a href=\"http://www.bertholdtypes.com/adobe_lib/080268000.html\" target=\"_blank\">http://www.bertholdtypes.com/adobe_lib/080268000.html</a> <br> <br>Berthold Bodoni Old Face &amp; Expert: <br><a href=\"http://www.bertholdtypes.com/adobe_lib/080304000.html\" target=\"_blank\">http://www.bertholdtypes.com/adobe_lib/080304000.html</a> <br> <br><a href=\"http://www.bertholdtypes.com/adobe_lib/080310000.html\" target=\"_blank\">http://www.bertholdtypes.com/adobe_lib/080310000.html</a> <br> <br>While not as historically accurate or as versatile in optical sizing, the Berthold Bodonis are nonetheless also very textworthy. The Old Face designs offer a nice alternative to the common Bodonis, and the Old Face Italics are particularly beautiful. Bringhurst recommends Berthold Bodoni in The Elements of Typographic Style (p. 207) as well as the Bauer Bodoni designs, but this, admittedly, was probably before ITC released their cut. <br> <br>I haven't yet used ITC Bodoni, but I've had good results with Berthold Bodoni. ITC Bodoni is on my wish list, though. <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\"> <br> <br>David <br></p>"
