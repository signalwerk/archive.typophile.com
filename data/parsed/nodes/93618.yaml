      <p>It's easy to rename font <em>files</em>, but renaming the font itself is (a) more work, and (b) usually forbidden. Do web font loaders refer to file names or to font names? What about CSS font-family?</p>
      <p>(After using Safari's Web Inspector) ... Aaah. The example you gave does <em>not</em> use one of the "regular" web font formats (WOFF, EOT, WHYG). Instead the entire font is loaded in JSON vector format and gets drawn by some Javascript called "Cufon":</p>
      <blockquote><p>Rather than Flash, it uses a mixture of canvas and VML to render the fonts.<br>
      (<a href="http://net.tutsplus.com/articles/news/the-easiest-way-to-use-any-font-you-wish/" rel="nofollow">The Easiest Way to Use Any Font You Wish</a></p></blockquote>
      <p>In that case it's merely a change in the JSON to "hide" the original font name. Well, per its EULA it should still be carrying the original copyright declaration...</p>
