      <p>Yeah the cufon is a bit curious. A LOT of Web Designers/Developers use it regularly.<br>
      Many seem to claim it as being the most superior method of embedding fonts, even the most experienced of designers, but really I disagree with them.. Its just like Image embedding.. You cant really select the font... It selects as an image basically. Many like it because it will render in any and all browsers, but what I think they dont take into account is not everyone has JS enabled in their browser, as it is a security risk at times. </p>
      <p>BUT you can see what they embedded on their webpage by looking in the  section of their HTML. They embed the Javascript in the head in a format like this: </p>
      <p>So the first Cufon script is Cufon.js itself, and the second is the font. once that is embedded in the head, it can be used throughout the page using another cufon  tag. </p>
      <p>But the thing is, when you upload a font to cufon, you get to choose the name of that .js file, that renders the font. So really you could name it anything.<br>
      You are even allowed to name commercially paid fonts anything you want, because you are not altering the font file, but the way you are allowed to do so, is when you are on the website converting your licensed font file, you must check the box allowing the font to only be used on a specified website domain.  Leaving you in your legal bounds of the licensing. (As long as its a license that allows embedding other than PDF's of coarse) </p>
      <p>So if someone was to name a font some completely random name, (Which they do) It would make it nearly impossible to identify it, it would seem. Other than looking back at resources, or uploading to WhatTheFont, or WhatFontIs, etc. Making things quite complicated.. </p>
      <p>Which is why I made this thread, in hopes of some tool, or method of finding out from the cufon script source or something.  Idk I guess ill keep looking into it! ;)</p>
      <p>By the way, Theunis de Jong, What is this "WHYG" Format that you speak of?</p>
