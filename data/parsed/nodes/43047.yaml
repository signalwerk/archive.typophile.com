    html: <p>Taste-makers in typography are often freelancers who buy their own type. For their sake, $10-$12.50 per font should be the price. The best model is Storm Foundry, whose pricing has always been that moderate and who owe much of their success to such a policy. Or Emigre, where complete families cost $99. Every day I admire new typefaces from boutique European foundries and then gag at their prices. They think big corporations are the cutting-edge purchasers, and they're not! Dolly--only three fonts, no bold italic, for $205? Meet my middle finger, Underware!</p>
