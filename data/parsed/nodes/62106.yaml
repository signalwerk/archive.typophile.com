  html: |-
    <p>******************************************************************</p>
    <p>RELEASE</p>
    <p>A proud Fountain production: </p>
    <p>Heroine Pro - a blast from the past</p>
    <p>Amazingly designed by Göran Söderström.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/heroine_4048.png"></div><p></p>
    <p>Last week we released a movie trailer for the Heroine.<br>
    We are very happy that to this day there's been over 12000 unique views at YouTube.</p>
    <p><a href="http://www.youtube.com/watch?v=E7Ml2n_jfSk" title="http://www.youtube.com/watch?v=E7Ml2n_jfSk">http://www.youtube.com/watch?v=E7Ml2n_jfSk</a></p>
    <p>Heroine is inspired by the typeface Windsor, designed by Eleisha Pechey in 1905. Windsor is the typeface used in the titles of many Woody Allen films. A modern interpretation of this rusty pearl is something that is something that has always been missing in the major type libraries. But Heroine is not only an interpretation, it goes beyond that. With the addition of swashes and alternate letters in several styles it becomes very addictive.</p>
    <p>It’s like a breeze of Art Noveau with modern bezier skills, old and new celebrated in a typeface family with 9 styles. The weights are handpicked with small steps between them to bring out the best of Heroine. True to history, condensed versions are also included in the family.</p>
    <p>Swashes, small caps*, extended language support, ligatures and OpenType features are included.<br>
    [* Small Caps not incl. in Heroine Pro - Black]</p>
    <p>******************************************************************</p>
    <p>Heroine Pro can be found at:<br>
    <a href="http://www.fountaintype.com/typefaces/heroine" title="http://www.fountaintype.com/typefaces/heroine">http://www.fountaintype.com/typefaces/heroine</a></p>
    <p>Download PDF:<br>
    <a href="http://www.fountaintype.com/specimens/66/original/FTN_Heroine.pdf" title="http://www.fountaintype.com/specimens/66/original/FTN_Heroine.pdf">http://www.fountaintype.com/specimens/66/original/FTN_Heroine.pdf</a></p>
    <p>Video for Heroine can be found at:<br>
    <a href="http://www.fountaintype.com/typefaces/heroine/about" title="http://www.fountaintype.com/typefaces/heroine/about">http://www.fountaintype.com/typefaces/heroine/about</a><br>
    or<br>
    <a href="http://www.youtube.com/watch?v=E7Ml2n_jfSk" title="http://www.youtube.com/watch?v=E7Ml2n_jfSk">http://www.youtube.com/watch?v=E7Ml2n_jfSk</a></p>
    <p>******************************************************************<br>
    Thank you for your time<br>
    and have a wonderful day</p>
    <p>Peter Bruhn<br>
    [Fountain]</p>
