      <p>I only just discovered Bulmer myself, as I've lately bought and have been reading Lawson's "Anatomy of a Typeface", which has a chapter on it.  I do believe it's the first "modern roman" that doesn't make me want to claw my eyes out when used in running text.   When you said Bodoni would be too "thin" it occured to me that Bulmer's more gentle contrast might be just the thing.  </p>
      <p>(Goudy Modern might also work, but I've got no samples of that to look at.)</p>
