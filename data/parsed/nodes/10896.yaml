  html: <p>It is a script I wrote to create and size object within an illustrator document in the ratio of the golden section. <br>It will work under os X on a Mac with illustrator and applescript active. <br>prior to running the script you need to install the ScriptingAdditions from Satimage, in their readme file they tell you where to place the additions. <br>Inside the script there is different value that will let you modify the polygone shape. <br>Every time you hit run there is one new polygone created in the sequence. <br> <br><a href="http://www3.telus.net/~martinga/goldensection.sit" target="_blank">http://www3.telus.net/~martinga/goldensection.sit</a> <br> <br>Hope it will be usefull. <br> <br>Martin</p>
