    html: <p>It looks like an idenity for a Japanese Cartoon Network. I would do a focus group of Australian skiers to find out how they preceive themselves. Accidents happen in any sport (mine bicycle racing), everyone who participates in the sport knows the dangers. So you can't candy coat the idenity and expect it to be Disneyland. You have alot more work to do, and research.</p>
