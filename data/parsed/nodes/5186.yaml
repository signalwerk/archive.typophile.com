    html: <p>It's very cool and fun, but I think it is more appropriate for a snow sports T-shirt design than a ski resort. It seems a little too trendy for something as permenant as a resort. I could see you working the type alone successfully, then using the other elements (snowflakes, skiers, boardriders) as part of a new identity launch campaign.</p>
