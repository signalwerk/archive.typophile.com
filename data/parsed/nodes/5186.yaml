    html: <p>Scott - I shall be working the type-logo alone. The characters I added as an extra to launch the identity like you said. <br> <br>Daniel - The accident was due to a building collapsing due to poor structure... where 80 people died, all but one survivor. Since then the resort has been associated with tragedy. Hence why people know what it is just by name alone. <br> <br>I was planning on using the charcters on things such as stickers, merely to helppush the new type-logo. Maybemock up some snowboard designs that the resort hires out to seasonal skiiers and snowboarders. So I did not mean to include them as part of the logo itself. Just to push the identity. <br> <br>Thanks for all your feedback. I was going for cute and have asked many people for their feedback - including Australians who snow-surf.  <br> <br>take care <br>k <br> <br></p>
    html_clean: <p>Scott - I shall be working the type-logo alone. The characters I added as an extra to launch the identity like you said. <br> <br>Daniel - The accident was due to a building collapsing due to poor structure... where 80 people died, all but one survivor. Since then the resort has been associated with tragedy. Hence why people know what it is just by name alone. <br> <br>I was planning on using the charcters on things such as stickers, merely to helppush the new type-logo. Maybemock up some snowboard designs that the resort hires out to seasonal skiiers and snowboarders. So I did not mean to include them as part of the logo itself. Just to push the identity. <br> <br>Thanks for all your feedback. I was going for cute and have asked many people for their feedback - including Australians who snow-surf.  <br> <br>take care <br>k <br> <br></p>
