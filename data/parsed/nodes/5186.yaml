  html: <p>This is my first design post for this forum. <br> <br><img src="http://www.typophile.com/forums/messages/29/38110.jpg" alt="Thredbo"> <br> <br>This is for THREDBO, a Ski Resort in Australia. A few years ago they had a tragic accident at Thredbo so I decided to use a friendly - organic feel to the identity, to communicate it as a friendly place, while still providing that FUNKY, SAVVY edge - <br> <br>What do we think? I still have a few weeks until I hand it in. <br> <br>Take care <br></p>
