      <p>Re: ben_archer's tip about putting the vertical rule(s) on the Master page and masking it out with Paragraph Rules</p>
      <p>Excellent workaround, but I found that using the Underscore Option in Paragraph Styles worked even better because - once the weight and offset were set effectively - it applied to paragraphs of any number of lines.</p>
