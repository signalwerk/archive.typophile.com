      <p>Hey Ben (&amp; Yves),</p>
      <p>Your solution makes sense and won't be too hard to implement. Of course, I have a bunch of headings, subheads, etc., to deal with, all of which I'll want to mask the rules you suggested, but that's a small matter. I suppose, as Yves mentioned, the trick will be to make sure that my "mask" rules are exactly the height of the styles they're added to, so that I don't have tiny bits of vertical rule showing through. I'll also likely move the vertical rules slightly inside the text frame, as I've had vector objects shift ever so slightly during RIP at the printer.</p>
      <p>Thanks for the suggestion, and hopefully a simpler method will be introduced in future InDesign releases...</p>
