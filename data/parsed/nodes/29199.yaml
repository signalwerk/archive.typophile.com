    html: |-
      <p>It actually is <em>a lot</em> more complicated than horizontal rules.</p>
      <p>I'm an avid user of paragraph rules, and though I've managed to come up with some pretty unorthodox stuff before (see my <em>Paragraph Rules</em> tutorials soon on <a href="http://www.fontshop.be/" rel="nofollow">Unzipped</a> and <a href="http://www.fontshop.com/fontfeed/" rel="nofollow">The FontFeed</a>) there is to my knowledge <em>no way</em> to achieve  vertical rules that match the height of paragraphs.</p>
      <p>The easiest way to make a vertical rule is to define a very short, very heavy rule: a 1pt wide 24pt thick horizontal rule is -- indeed -- a vertical 1pt rule that is 24pt long. To make the rule only 1pt wide, specify an indent from right that is 1pt less than the column width. Elementary my dear Watson.</p>
      <p>Now the main problem is that <em>Paragraph Rules</em> are attached to the <em>paragraphs</em> -- you can position one in relation to the first line of the paragraph and one in relation to the last line. How many lines the paragraph counts has no effect at all. So even so it's possible to specify vertical rules next to both the first and the last line in the paragraph, it's impossible to specify a vertical rule next to all the other lines. The only way to do so would be to convert every line of text to a single paragraph by using hard returns, but this completely negates what you want to achieve, as you explained text flow isn't finalised.</p>
      <p>So I'm really sorry, but to my knowledge what you want to do is impossible. :^/</p>
