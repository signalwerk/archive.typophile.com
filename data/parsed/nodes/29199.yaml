      <p>Thankyou Yves!</p>
      <p>Ah yes I didn't allow for headings and subheads. </p>
      <p>It occurs to me that these could be dealt with on a separate layer, perhaps with white text box backgrounds for the masking or as a massively baseline-shifted part of the first line of the paragraph style if you want to keep everything on one layer.. ie. if your leading is 15pt and the white para rule is masking 45pts of inter-para spacing (three lines), then a subhead can be baseline shifted another lines' worth, 15pt upwards from the first line of para to appear in front of that masked 45pts of space.</p>
      <p>You'll need to experiment with this...</p>
