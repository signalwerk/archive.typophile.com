      <p>I have another thought. I haven't played with it extensively, so it might not be practical over long texts, but it will certainly stick with the paragraph.</p>
      <p>Try using the anchored object. Create a line with the line tool (draw it vertically obviously) and then create an anchored object box and attach it to the first letter of your paragraph. Paste the line into the anchored box. If you align the top of the abchored frame to the Cap height, the line should start at the right spot, and then you can adjust the length of it.</p>
      <p>I'll try and post my screen shot.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/anchorobject copy_5491.jpg"></div><p></p>
      <p>I believe it's possible to simply copy and paste that basic anchored object at the beginning of every paragraph where you want a vertical side rule so that the box width and the settings remain the same each time. You will most likely have to adjust the length of the rule, though.</p>
      <p>K.</p>
