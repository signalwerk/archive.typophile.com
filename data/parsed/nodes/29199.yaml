    html: |-
      <p>Hi Jason</p>
      <p>Your question puzzled me so I had a look. I think it might help to reverse the relationship of the para attributes and do this in two parts; </p>
      <p>1. Make your 'side' rules on the master page as continuous vertical lines top to bottom at either side of your text column area. This would mean they are behind your text and para attributes.</p>
      <p>2. Use paragraph rules in the text flow – but heavy white ones to <em> mask </em> the background vertical rules. The white para rules can occupy as much vertical space as your inter-para spacing, and be made to extend beyond the column width by being set with negative integers on the indent.</p>
      <p>Of course this method assumes a white paper colour and/or absence of background tint/colour/imagery. Here's a screen grab to explain better.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/white-rules-mask_5235.jpg"></div><p></p>
