    html: |-
      <p>Creative Review is probably the best known (which shouldn’t imply it is the best, although there is a dearth, so it is popular) magazine on design in Britain. Over the last five years or so it has been trying to reposition itself and never quite achieving the right blend for my tastes. In appearance it is a square(ish) format, the layout is gridtastic. The demographic is designers in all media, mainly graphic. Recently it has published a 2 part interview with Matthew Carter which although interesting, was fairly superficial, and Bruno Maag has just started a column on typography, which I have seen as a pdf from the <a href="http://www.daltonmaag.com/news/19.html">Dalton Maag website</a>.<br>
      My (jaded) opinion is that it makes a good magazine to leave in reception for clients to glance through but not a very satisfactory read.<br>
      I visited the site and downloaded the entry form out of curiosity but there is no mention of what the prize(s) are, I suspect that Hrant might be right. Bruno Maag often contributes here so maybe he can expand on that.<br>
      Tim</p>
