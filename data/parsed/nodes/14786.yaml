    <p>—<br>
    <strong><em>Honouring excellence in typeface design</em></strong><br>
    (in association with the Typographic Circle)<br>
    —</p>
    <p>Creative Review invites members of the Friends of St Bride to submit entries for its first ever type design award. Any typeface designed, first sold or first used between June 2004 and October 2005 may be submitted to the competition. Entries will be judged with reference to aesthetics, craftsmanship, technical excellence, originality and suitability for use. The winning entries will be those which, in the opinion of the judges, best combine all these qualities. The judges will select a winner and runners-up for each category.</p>
    <p>DEADLINE<br>
    5 October 2005</p>
    <p>JUDGES<br>
    Bruno Maag, <em>Dalton Maag</em><br>
    Nick Hayes, <em>Identikal</em><br>
    Dave Wakefeld<br>
    Fiona Ross<br>
    Jason Smith, <em>Fontsmith</em><br>
    Domenic Lippa, <em>Lippa Pearce</em></p>
    <p>—<br>
    For further information and an application form please visit<br>
    <a href="http://www.typevents.com">www.typevents.com</a> or www.creativereview.co.uk<br>
    —</p>
