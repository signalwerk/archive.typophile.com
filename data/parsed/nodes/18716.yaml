    <p>Pardon this newcomer if this is a question that has been asked all too many times, but what do you all think will be the next big thing in typography?</p>
    <p>..and maybe more interestingly, what would you WANT to be the next big thing in typography?</p>
    <p>Oh, and it doesn’t have to be related to any one specific aspect of typography either. It can be about technology, tools, specific design styles, printing techniques, etc. etc. Anything you can think of relating to the world of typography, really.</p>
    <p>Looking forward to some interesting answers!</p>
