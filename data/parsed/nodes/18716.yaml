      <p><em>i’d like to see typefaces, particularly ones for text, becoming more random...there aren’t any typefaces (or programs) that have this.</em></p>
      <p><a href="https://web.archive.org/web/20081007160632/http://typophile.com/node/17177">Random Feature</a></p>
      <p>true, this kind of thing is more desireable in script fonts moreso than text fonts. However, when I was putting together <a href="https://web.archive.org/web/20081007160632/http://p22.com/products/Franklin.html">Franklin Caslon</a>, I put together a quick font that although not really random simulated this kind of effect. (althought i’m sure i could make it more random with a bit more work). Here’s a screen grab just for fun with some text set out of the box with my beta font. You can see that the supersmudged letters happen too regularly to make this really convincing.</p>
