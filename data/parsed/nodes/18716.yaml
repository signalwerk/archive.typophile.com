    html: |-
      <p>i can’t imagine photofonts being anything but a novelty at best. if they’re based on pixels, i assume they’ll be relegated to a certain size and well, that’s pretty pointless.</p>
      <p>personally, to answer my own question, i’d like to see typefaces, particularly ones for text, becoming more random in that each letter might have a handful of small variations, and when you use it it’ll randomize it and make the text feel more alive, like it did with the older manual printing techniques. it used to be more imperfect, but that’s also what made it much more alive. i know the technology is getting there with randomization of letters, but as far as i know there aren’t any typefaces (or programs) that have this.. it may not be the perfect solution to making the printed letter feel more living, but at least it’d be a step towards the right direction.</p>
