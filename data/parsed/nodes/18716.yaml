      <p>Dunno about what will be the next big thing...</p>
      <p>However, I have some strong feelings about what should be the last big thing. And principal amongst these is the total disregard / lack of acknowledgement for the skills of the typographer. </p>
      <p>This comes from two desperate experiences:</p>
      <p>i) When asked what I do for a living and answering ’I’m a Typographer’, being confronted with the reply ’What does that mean’ or worse, ’so you do DTP’... jeez...</p>
      <p>ii) Overhearing two 16 year-old chav secretaries debating whether Times New Roman or Verdana was the ’better looking’ font.</p>
      <p>If I’d had a length of rope, I’d have hanged them. Or, if they were too quick for me, I’d have hanged myself... :-)</p>
