      <p>You beat me to it... if you’re not careful people will think I put you up to it. =)</p>
      <p>The concept is if you have sympathy, send Typophile $15. If you love Typophile, send $45. And, if it’s a true obsession, you can show it with a larger donation of $100.</p>
      <p>You’ll receive a badge to add to your user icon. Let other users know of your undying sympathy (shield), love (heart) obsession (drop of blood) for Typophile.</p>
      <p><strong><a href="https://web.archive.org/web/20080905212818/http://typophile.com/ad/redirect/39853/">You can contribute here</a> —&gt;</strong></p>
      <p>Also, if you purchased a tee, or buttons, or came to our SF Film Fest in the last 12 months check your inbox for your badge to match your contribution. (Some of you made other significant contributions this year and you haven’t been forgotten.)</p>
