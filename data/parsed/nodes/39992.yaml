    <p>Say Joe and Company,<br>
    I was just poking around the link at right with the big red rectangle and, wouldn’t you know, I ended up in a place where I can help donate to the cause here at Typophile. I don’t remember seeing an announcement for it or a plug to kick it off so I thought, hey! let’s take this puppy for a spin! So I did! so hey! Tell us about it, Joe? Let’s not keep it a secret! Inquiring minds and those who wish to contribute would like to know :-)</p>
    <p>ChrisL</p>
