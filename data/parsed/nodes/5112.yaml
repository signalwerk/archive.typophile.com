    <p></p></center><p></p>
    <!--/attachment--><!--/attachment--><p> <br> <br>The most controversial aspect so far has been the spacing. This PDF shows a ±15 tracking variation. <br> <br></p>
    <!--attachment: archura-spacing-37681.pdf*mime_pdf.gif*application/pdf*638.4**archura%2dspacing%2epdf --><!--attachment: archura-spacing-37681.pdf*mime_pdf.gif*application/pdf*638.4**archura%2dspacing%2epdf --><p></p><center><br>
