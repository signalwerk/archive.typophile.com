    <p>Hi, <br> <br>Archura: arched textura. <br> <br>I started off the design of my first typeface with a post to Typophile (<a href="http://www.typophile.com/forums/messages/4100/29010.html" target="_blank">http://www.typophile.com/forums/messages/4100/29010.html</a>), and so I thought I would submit the final design as well. Archura is the result of my typeface design class with Cyrus Highsmith at the Rhode Island School of Design. <br> <br></p>
    <!--attachment: archura-specimen-37680.pdf*mime_pdf.gif*application/pdf*675.5**archura%2dspecimen%2epdf --><!--attachment: archura-specimen-37680.pdf*mime_pdf.gif*application/pdf*675.5**archura%2dspecimen%2epdf --><p></p><center><br>
    <table border="1">
    <tbody><tr>
    <td><img src="http://www.typophile.com/forums/icons/mime_pdf.gif" align="left" alt="application/pdf"><br><a href="http://www.typophile.com/forums/messages/29/archura-specimen-37680.pdf" target="_blank"><b>archura-specimen.pdf</b></a> (675.5 k)</td>
    </tr>
    </tbody></table>
    <p></p></center><p></p>
    <!--/attachment--><!--/attachment--><p> <br> <br>The most controversial aspect so far has been the spacing. This PDF shows a ±15 tracking variation. <br> <br></p>
    <!--attachment: archura-spacing-37681.pdf*mime_pdf.gif*application/pdf*638.4**archura%2dspacing%2epdf --><!--attachment: archura-spacing-37681.pdf*mime_pdf.gif*application/pdf*638.4**archura%2dspacing%2epdf --><p></p><center><br>
    <table border="1">
    <tbody><tr>
    <td><img src="http://www.typophile.com/forums/icons/mime_pdf.gif" align="left" alt="application/pdf"><br><a href="http://www.typophile.com/forums/messages/29/archura-spacing-37681.pdf" target="_blank"><b>archura-spacing.pdf</b></a> (638.4 k)</td>
    </tr>
    </tbody></table>
    <p></p></center><p></p>
    <!--/attachment--><!--/attachment--><p> <br> <br>Thanks in advance for any feedback, and for being part of my project. Typophile has been a terrific resource.</p>
