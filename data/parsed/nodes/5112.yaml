  html: |-
    <p>Hi, <br> <br>Archura: arched textura. <br> <br>I started off the design of my first typeface with a post to Typophile (<a href="http://www.typophile.com/forums/messages/4100/29010.html" target="_blank">http://www.typophile.com/forums/messages/4100/29010.html</a>), and so I thought I would submit the final design as well. Archura is the result of my typeface design class with Cyrus Highsmith at the Rhode Island School of Design. <br> <br></p>
    <!--attachment: archura-specimen-37680.pdf*mime_pdf.gif*application/pdf*675.5**archura%2dspecimen%2epdf --><!--attachment: archura-specimen-37680.pdf*mime_pdf.gif*application/pdf*675.5**archura%2dspecimen%2epdf --><p></p><center><br>
