    html: <p>First of all, this is a display face. The one readability advantage that blackletter has (structural divergence) you've done away with - "romanized" it most certainly is*, and that pushes it (even more) towards display usage. And then the super-tight spacing** reinforces that even more. But as a display face I think it's worthwhile, with a definite "brush" character. Perfect for a German deli! <br> <br>* BTW, when you say that in text it looks like a "cold romanized textura", while in display its rationalization brings warmth, it seems to me that it would be the opposite, since it's in smaller sizes that things get fuzzy and more open to organic interpretation, especially when it comes to texture. <br> <br>** It's so tight that it's causing some intractable problems, like in "ft". BTW, even the +15 setting is too tight I think. <br> <br>hhp <br></p>
