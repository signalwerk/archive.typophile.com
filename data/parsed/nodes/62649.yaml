    <p>I’ve been looking for this font for a while now and have noticed it popping up here and there.<br>
    It sort of looks like Rockwell but it most definitely is not. </p>
    <p>It is used by both Loyola University in Maryland and Connecticut College.<br>
    Can also be found <a class="freelinking-external" href="http://www.loyola.edu">here</a></p>
