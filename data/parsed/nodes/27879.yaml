      <p>I agree with the 2 previous posts: the typography part looks really great (nice colours too), but the brain could use a make-over. More curvy lines &amp; perhaps a few more “bumps” at the top might do the trick.<br>
      Like Chris said: they do work better next to eachother or perhaps maybe even separately (like Mercedes has a logo &amp; a type-logo that are hardly used together).</p>
