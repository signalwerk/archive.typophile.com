    <p>First time ever doing something of the sort, thought I’d get some views. I wanted to communicate simple, and nothing too distracting in the look.</p>
    <p>The type, I couldn’t find a more simple serif font with ligatures. Want something clean and simple. Suggestions welcome.</p>
    <p>Personally, I think the masthead works better without the icon and background ... on it’s own in a way. Let me know your thoughts anyway.</p>
