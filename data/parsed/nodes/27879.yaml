    html: <p>This looks very nice. I would lean towards the top treatment - an icon that can be used above or to the side of the type. The way you have used sharper angular lines, and smoother curved lines in the brain does bother me. I would smooth out and curve all those lines on the inside, the contrast of forms draws attention to the lines too much. Would probably look at some other type options as well, not that this is bad though. Nice work.</p>
