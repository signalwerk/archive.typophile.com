      <p>One book I designed, <a href="http://www.graphis.com/store/?p=77" rel="nofollow"><em>Language Culture Type</em></a> (John Berry, ed. New York: ATypI/Graphis, 2002), had two distinct parts—the essays (top), and the showings of the <em><a href="http://www.tdc.org/news/2001bukvaresults.html" rel="nofollow">bukva:raz!</a></em> winners (bottom). Both parts were laid out using one and the same 12-unit grid; however, the typography of both parts was <a href="http://www.graphis.com/media/viewer/?view=6dfc4f6b067a5a5179789ef6267d9ced" rel="nofollow">very different</a>.</p><div class="imageWrap"><img src="http://typophile.com/files/LCT_Grid_A_4965.gif"></div><br>
