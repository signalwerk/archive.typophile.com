    html: |-
      <p>I don't see any problem with having a two-column symmetric section, a two-column asymmetric section and a single column section in the same publication, either a single book or a journal or magazine. </p>
      <p>If that presents the text the best way, then that's what you should do. Can't tell you how many books we've done with two grids, and three or even four are occasionally used  when images get thrown in. Or boxed, sidebar text. Etc.</p>
      <p>I'd say that multiple grids are fine when they're used to resolve an author's affectations, the (knowledgeable) design police only get involved when it's a design affectation.</p>
