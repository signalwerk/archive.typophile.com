    <p>When designing a publication, would you use two different grids for the written part? </p>
    <p>Section 1-5<br>
    • a two-column asymmetrical grid is perfect here. These sections are text and image heavy, but I have between 10-12 pages for each section.</p>
    <p>Section 6 through 20<br>
    • a two-column symmetrical grid is perfect here. These sections are more text heavy with fewer images, but I only have 4 pages max for each of these sections. </p>
    <p>And due to conflicts in various content, small book format, and needs for some space in the layout, I can't just use a two column layout for the whole book. Would look great in some sections but really dense in others. Already working with 9 for body copy and 11 for leading, and I was asked not to go lower than either number.</p>
    <p>The best solution so far is to use a different grid for each section. Thankfully, Section 1-5 is in one overall 'chapter' of the book, and sections 6-20 are in another 'chapter.' OR I could use a 6 column grid and do a 3/3 or  4/2 split as needed. </p>
    <p>Any thoughts?</p>
