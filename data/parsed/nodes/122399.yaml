      <p>A few thoughts:<br>
      1. the price of these fonts is a bargain any way you look at it.<br>
      2. prices too low risk to send the wrong message about the value of quality fonts, thus worsening the problem.<br>
      3. there always will be people who feel entitled to free stuff, in principle.</p>
      <p>All that said, all costs should be made clear before the start: if I want to attend, I need to know beforehand what (if anything) is provided by the school in exchange of tuition, and how much more I will need to spend in addition (be it for books, pencils or fonts).</p>
