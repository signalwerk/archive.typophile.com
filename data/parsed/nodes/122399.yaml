      <p>Obviously, tuition has to cost something, because professors have to eat. Actually, this <em>isn't</em> obvious, since schoolteachers also have to eat, and professors could be paid the same way (of course, they partly are; tuition or the post-secondary institutions themselves are subsidized by the government in most places).</p>
      <p>But a society in which everyone who isn't labelled as mentally retarded is expected to stay in school until he or she gets a Ph.D. (or an M.D. or an LL.D.) is not likely to come about - one where all those with the ability to go to university can do so is already a radical and Utopian dream; assuming that nearly everyone has that ability is probably wrong, although given economic demand in different labor categories, our society has really not made the effort to develop everyone's potential so as to find out.</p>
      <p>Still, this is an unanticipated extra expenditure. It's bad enough that students have to pay high prices for textbooks, which are in some cases revised periodically when changes in the subject matter do not warrant doing so, in order to limit access to books on the used market. Who has heard of a university using books from Dover for suitable subjects like first-year physics or first-year calculus?</p>
      <p>After they finish paying their tuition and for their textbooks, after all, students usually aren't rich. Unless they're among the few fortunate enough to have wealthy parents.</p>
