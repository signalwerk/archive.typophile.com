    <p>This is really a sad story.</p>
    <p>So I just started my design school’s “fundamentals for typography” class with other 59 students who have no idea what a typeface is other than Times New Roman or Helvetica. Professor demanded we all buy Adobe Font Folio for $149, and students are immediately grunting over the price.</p>
    <p>And then somebody found out that we can install endless copies of the same font files on different computers...! And everyone in the Facebook discussion group starts feeling the ecstasy of avoiding yet another hefty fee. (Wait that wasn’t hefty – you get 50 families for $149 from Adobe, while purchasing one family already costs normally $100-200!)</p>
    <p>There are two sad points. For one, my classmates take font pirating as something to be celebrated, and openly discusses about it (“I’ll buy you meals if you send me that font folio!”); and second, I feel like typefaces are luxuries – the amount of sweat and blood they require are no less than other kinds of luxury products like crafting wooden furniture. That’s why they are so expensive (aside from the corporates’ licensing barriers or some Monopoly bad-ass behavior). Students can’t afford good typefaces, and there are no good way around other than “educational discounts.”</p>
