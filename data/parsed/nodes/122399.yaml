      <p>Yes, I’m in Seattle. Students here can spend hundreds of bucks on new iPhones or new computers, but do not want to spend that $149 on a font bundle. They can definitely afford it; it’s just they haven’t realized the value of good type in comparison to the apparent utility of iPhones and computers. To start things off, typography education (at my program at least) shouldn’t teach “ascenders” or “x-height” before telling the students why these things matter and why we should pay for it.</p>
      <p>But when I say students can’t afford good typefaces, my point still stands. Yes, spending $149 on Font Folio is totally affordable, but there’s only one Adobe, only one AIGA decision, and only one font bundle; you can’t simply demand every foundry to do the same. What if you want a family of, say, FF Kievit, to set your final project in a class? And you seriously go give $1000 to Fontfont, just to buy a family that you’ll probably not use again? (And your instructor may also say, “Kievit is so well designed, let’s make the purchase of Kievit mandatory”...)</p>
      <p>P.S. Tuition is not free of course (even much higher for int’l students like me), but people do pirate (or try to pirate) Adobe CC for sure.</p>
