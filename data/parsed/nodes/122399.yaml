      <p>At $149 for 500 fonts, the Adobe Font Folio Education Essentials is incredibly inexpensive compared to most font bundles, even compared to most educational pricing. I assembled that collection in consultation with AIGA when I was at Adobe, and we literally made it as cheap as we could possibly manage, given the royalty obligations on some of the fonts. I can't comment in detail, but I will say that I am pretty sure Adobe has a lower profit margin on that product than on anything else they sell.</p>
      <p>Most quality fonts sell individually for $25-35. Some of the families included in full in that package sell for several times the cost of the bundle!</p>
      <p>Assuming your profile is still up to date... it's not like you are in some third world country, where both incomes and cultural norms are different. Y'all are in Seattle, for crying out loud. Is their tuition free? Do they pirate all their software when possible?</p>
