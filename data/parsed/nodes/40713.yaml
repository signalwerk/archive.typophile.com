      <p>I’m looking for a good basic BW letter size laser printer with true Postscript also, and can’t seem to get straight answer anywhere.  They all seem to say postscript emulsion, which I don’t believe is true.  I have an old HP 6MP that’s been a workhorse, but is show as molasiss, and strung together with all kinds of adapters so it can connect to my network.  I also have a huge color Minolta Magaicolor that prints nice tabloid sheets, but chokes on almost everything I send to it because it isn’t true Postscript (despite what they told be when I bought it).</p>
      <p>Anybody know of one for under $500? Like I said, just nee letter size and black only, but it must be true Postscript.</p>
