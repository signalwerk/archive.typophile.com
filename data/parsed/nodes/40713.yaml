      <p>Update: the printer arrived today. Setup was relatively easy, and print quality seems pretty good. Not the most vibrant thing ever, but color seems accurate enough.</p>
      <p>One truly stupid thing: the manual feed doesn’t have a tray like my LaserWriter 16/600 does — it’s just a slot. I don’t care that much that it only does one page at a time (the LaserWriter ended up being only able to do that too, though it didn’t start out that way), but I’d like to be able to lay the page in the feeder and walk away.</p>
      <p>It’s a bit loud when it’s printing, but otherwise it’s very quiet.</p>
