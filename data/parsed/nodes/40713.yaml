    <p>I just can’t seem to read a review that is right for my needs.<br>
    I really just want a printer that will print solid beautiful color and crisp clean text.<br>
    Photos are not a top priority.<br>
    I was looking at xerox just because it is True Adobe Postscript but Adobe Postscript has been around forever, hasn’t that technology changed too? Is it something I still need to look for?</p>
    <p>Thoughts, Ideas insights and experience all welcome.</p>
    <p>Thanks for you time.</p>
