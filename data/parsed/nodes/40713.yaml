    html: |-
      <p>cthyaka,</p>
      <p>I loved HP products and use to own an HP Color Laser 11x17 printer with duplex — the dots weren’t that sharp, but the machine really doe have artificial intelligence and if the paper is not in the tray - it knows to go to the next tray, which may not be the size - but that was alright with me. To replace all the toner at one shot — I found a place on the internet in Brooklyn and it would be under $700 - and it was good for 20,000 to 30,000 reproductions. A new drum (only one) was a few hundred each year.</p>
      <p>Today I own an Okidata C9500 - also 11x17 color laser. It prints extremely sharp (even my professional printer has been overwhelmed by the printers I post - it is as good as the work they do.) It really does an excellent job - but it is not as smart as an HP. For example, should I have 5 sheets of cover stock in it, and I want to print 10 — it will print the first 5 and then start to print 6 and get rattled that it doesn’t have the same paper weight. I have to shut it down and restart. The quality is great and I do get about 30,000 sheets before changing toner. However, every color not only has a toner - but a separate drum for each color... and the belt needs replacement every 12-18 mos. — let’s just say it is expensive to keep it going, and my customers like the idea of the local stationery store charging 49 cents a color copy. So I’ve advised the customers that remind me about this - they are welcome to use the other guy. </p>
      <p>I also have a small HP color printer now (I thought I’d save money on toner... not true) it gives me pretty pictures - it doesn’t have to worry about drums - but the toners cost under $600 - and it doesn’t last very long as it loves to print in a default of 2400 dpi, which of course uses up all the toner. I’ve asked how to change the default, and you can’t — you can with every job you are printing request in the software to lower it to 300 or 600 dpi - but the darn printer keeps printing in 2400 dpi. Also, I spent an additional 300 to put it on wireless - only to find out that it was a separate wireless system from the network’s wireless... it is now hardwired into the network - saved a lot of headaches. </p>
      <p>If you have any other questions - feel free... hope my first hand experiences are helpful to you. Even though you already have bought one as I just finished reading... lol</p>
    html_clean: |-
