      <p>Right now you can get an amazing deal at costco.com on the Xerox Phaser 6130/N. We have a higher-end Xerox at work, and I really like it — the color is vibrant, though I have seen some color-shifting. The smaller printer may not have the same issue, and even if it does, it may be able to be fixed with calibration, but I’m not sure. At $280 for a color laser with true PostScript 3, that price can’t be beat. I ordered one the other day, and it should be at my door today. (It would have delivered yesterday had I been home.) I can report further after I set it up at home.</p>
      <p>One cost caveat: the printer takes four toner cartridges that cost $70-80 each. On the plus side, they’re probably good for about 5,000 prints, and you can make it so the printer only prints black when you want it to.</p>
      <p><a href="http://www.costco.com/Browse/Product.aspx?Prodid=11242519">Here’s the info.</a></p>
