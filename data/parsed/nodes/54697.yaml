      <p>Arial was just a joke,’cause I thought Highway Gothic was a funny guess for an obviously german book from probably pre-digital times.</p>
      <p>In those days custom type wasn’t an easy thing to do like it is nowadays.<br>
      So I think it’s a font.</p>
