    html: |-
      <p>I scanned the book cover. I bought this book at the Spui book market in Amsterdam, and it's written by Herbert Ihering. Here's from the colophon;</p>
      <p><em>© Rembrandt Verlag Berlin 1959<br>
      Zweite Auflage 1962<br>
      Klischees: Lemke, Graphische Kunstanstalt<br>
      Druck: Franz Spiller<br>
      Printed in Germany (West-Berlin)</em></p>
      <p>So I guess that makes it older than Arial! This edition's insides is set in Futura, don't know about the first edition.</p>
      <p>Thanks for replies, though! Personally, I think it's a custom type inspired by the likes of Akzidenz Grotesk and Breite Grotesk (thanks Dag Henning).</p>
