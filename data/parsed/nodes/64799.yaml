      <p>Hi Nina,</p>
      <p>Thank you very much for your thoughtful comments. After putting down the printout many times to let my eye capture another fresh impression, it seems to me that the sweet spot is Folio at 10.95pt or 11pt vs. Chronicle at 10pt. Example below with 11pt, as 10.95pt looks identical at this screen resolution. With the size issue cleared up, I'm liking the combination better and better.</p>
      <p>I still need to figure out what to do with the figures on the invoice template. Previously I had the last line of figures (end total) in bold, but now I think it would be visually too confusing to mix figures in Folio SB Bold Condensed with figures in Chronicle Deck Condensed Roman on the one hand, or introduce a bolder weight of Chronicle on the other, while the headings are set in Folio. Perhaps one style of figures (Chronicle Roman) is excitement enough. :-)</p>
      <p>Best,<br>
      Chris</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/sample-10-11_3649.gif"></div><p></p>
