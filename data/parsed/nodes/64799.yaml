      <p>Hi William,</p>
      <p>I want to keep the page counts of my invoices far below industry norms as a subtle display of respect to my clients. Concise wording and omitting oodles of useless technical specifications go a long way, but using a condensed font lets me finish the job with style. :-)</p>
      <p>Chronicle Text is not available in condensed, but my tests of Chronicle Deck Condensed at 10pt on a hi-res laser printer look just fine. Chronicle Display would be a different matter, I'm sure.</p>
      <p>Considering the four "grades" of Chronicle Text, my understanding is that it's targeted squarely at newspapers.</p>
