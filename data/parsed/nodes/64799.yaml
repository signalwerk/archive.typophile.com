      <p>Something else about Benton is quite stunning. I don't want to redesign my logo and logotype at this point, but hadn't been able to find a typeface that could take over from Folio SB Bold Condensed in that context without losing its step.</p>
      <p>Benton Sans Compressed Black carries the load with ease, watch. Logo on the left is based on Folio, logotype on the upper right is the current version using Folio SB Bold Condensed, and below that is a new rendering using Benton Sans Compressed Black.</p>
      <p>I'm amazed how well it works. Previous attempts with candidates like Gotham, Tungsten, or for that matter Compacta were not nearly as successful.</p>
