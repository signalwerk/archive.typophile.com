    <p>Hi typophiles,</p>
    <p>As a professional Mac tech person and amateur design enthusiast, I've been using <em>Folio SB Light Condensed</em> and <em>Bold Condensed</em> (samples at <a href="http://fere.be/folio" target="_blank" rel="nofollow">FontShop</a>) for several years in all my communications. The Bold Condensed is dear to my heart, not the least because I use it in my logotype as you can see on my <a href="http://www.ferebee.net/" target="_blank" rel="nofollow">website</a>, but as I find myself writing increasingly long text documents for my clients, I've grown a bit tired of the Light Condensed.</p>
    <p>I want to replace it with something that is at once easier to read while also carrying greater authority.</p>
    <p>In the end, I've decided on H&amp;FJ's beautiful Chronicle Deck Condensed. Condensed because I want to economize on space particularly for invoices, which  some of my fellow IT suppliers like to balloon over seemingly endless reams of paper.</p>
    <p>So where does this leave my beloved Folio SB Bold Condensed?</p>
    <p>I have persuaded myself that it could combine fruitfully with Chronicle Deck Condensed Roman, as seen below, but I'm afraid that maybe I'm just getting carried away. What do you think?</p>
    <p>Thanks for your comments.</p>
    <p>Best,<br>
    Chris Ferebee</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/sample-chronicle-folio_5297.gif"></div><p></p>
