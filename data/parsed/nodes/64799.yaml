      <p>One thing is that Folio has much narrower proportions, *and* it's a lot bolder; both these things make its counters / interior spaces much smaller. And the amount of interior white makes a big difference as to how we perceive "size" of type. You can see this by comparing a very light and a very bold weight of the same typeface at the same point size; the bold will most often appear to be smaller.<br>
      (But of course, the solution is not to make the interior white spaces numerically the same.)</p>
      <p>Your "MMiixxeedd" example shows exactly why I said it'll be fine at least as long as you don't mix them on one line. ;-)  Do you agree that on the left side, the "Item description" looks smaller than the "Detailed explanation"? And on the right you see that's not "true"; but typography is much less about what actually *is*, than about how the eye perceives it. This is a prime example of that. :-)</p>
      <p>So don't be afraid of going even a bit larger than 10.5. Maybe it's going to be 10.75, maybe 11, maybe even a bit more. It needs to look balanced. FWIW, I just combined a Roman serif text font (Whitman) with a bold sans (Fedra), and the "apparent" same sizes worked out as 9.5 : 7.6!</p>
