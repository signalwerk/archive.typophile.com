    <p>Hi Guys,</p>
    <p>I am new to the forum, usually use whatthefont to find anything I need but am struggling with the following font?</p>
    <p><a href="http://www.gallopers.co.uk/summer/HoofItLogosmaller.jpg" title="http://www.gallopers.co.uk/summer/HoofItLogosmaller.jpg">http://www.gallopers.co.uk/summer/HoofItLogosmaller.jpg</a></p>
    <p>The Majority of letters appear to be "Present Bold", but the H and the T are different and quite frankly beyond me, if any experts out there could give me any guidance it would be much appreciated.</p>
    <p>Thanks in advance</p>
    <p>Craig</p>
