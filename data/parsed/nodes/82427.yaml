    html: <p>I don't think this is Present Bold or any other weights of <a class="freelinking external" href="http://new.myfonts.com/fonts/adobe/present/" rel="nofollow">Present</a>. It has more of a '50s cocktail lounge look and the o's are open at the top. However the f and i do look pretty-much identical to Present, and the more I look at it I feel the o's could be from a different font to them. There's possibly three fonts here, and maybe some custom work to H and T as Nick suggested.</p>
