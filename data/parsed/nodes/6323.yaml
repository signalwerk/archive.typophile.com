  html: <p>Hello! I am a student studying type in a few of my classes.  <br> <br>I am an InDesign user. I find that it is way more user-friendly than Quark is, and it is more efficent to use all Adobe programs. <br> <br>However, my school only uses Quark. In the past, I've been using InDesign in the developing stages, before doing the final work on Quark. Yes, that's how much I can't stand Quark! <br> <br>As the workload is increasing (this is my junior year), it's getting to be too cumbersome to hop between the two programs. <br> <br>Is there a way to export documents out of InDesign so Quark can open them? Or vice versa? I've tried to figure out a way, but unsuccessfully. I was wondering if anyone could shed light on this.  <br> <br>Thanks!</p>
  html_clean: <p>Hello! I am a student studying type in a few of my classes.  <br> <br>I am an InDesign user. I find that it is way more user-friendly than Quark is, and it is more efficent to use all Adobe programs. <br> <br>However, my school only uses Quark. In the past, I've been using InDesign in the developing stages, before doing the final work on Quark. Yes, that's how much I can't stand Quark! <br> <br>As the workload is increasing (this is my junior year), it's getting to be too cumbersome to hop between the two programs. <br> <br>Is there a way to export documents out of InDesign so Quark can open them? Or vice versa? I've tried to figure out a way, but unsuccessfully. I was wondering if anyone could shed light on this.  <br> <br>Thanks!</p>
