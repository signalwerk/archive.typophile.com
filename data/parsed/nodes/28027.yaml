    <p>b. April 25th, 1970 in Kingsport, Tennessee.</p>
    <p>Currently residing in Chicago, IL.</p>
    <p>Partnered to designer/developer Su, who is co-principal at Pretty.</p>
    <p>BFA, University of TN at Knoxville, class of 1993.</p>
    <p>Member of Thirst from 1995-1999.</p>
    <p>Member of Thirstype from 1995-current.</p>
    <p>Designer with Leapnet, now defunct, from 1999-2001.</p>
    <p>Opened Pretty with partner Su in 2002.</p>
