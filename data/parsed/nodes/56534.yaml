    html: |-
      <p><em>is there a reason to not order accented glyphs in exact alphabetic order as opposed to some of the other schemes?</em></p>
      <p>I'm sure someone can think of <em>some</em> reason :-)</p>
      <p>Seriously though: with a few technology-based exceptions, glyph order should be mostly transparent to any users. Some things I've seen and used over the years that have forced a particular ordering are:<br>
      - need to keep the font size as small as possible: ordering in Unicode order helps keep the 'cmap' subtables small<br>
      - complex OpenType Layout functionality: ordering by similarity of base forms helps to find things when looking through the glyphs (I think Calibri is or at least was arranged this way, for the most part)<br>
      - avoiding backwards-compatibility issues: adding new glyphs to the end of the existing order helps when comparing old &lt;&gt; new<br>
      - many glyphs (50000+) with very extensive GSUB lookups, needed to place certain glyphs at a certain place within the order to avoid overflows of certain variables.</p>
      <p>Others have suggested other reasons, though I'm a bit puzzled by the MyFonts thing...I suspect something else had gone awry there.</p>
