      <p>alphabetic order according to PostScript names? I think that's a bit silly as these may seem canonical to a typeface designer they're really only arbitrary and this sorting would not necessarily be logical to anyone else.</p>
      <p>If you're going to do your own sorting scheme, you may as well group accented glyphs by visual similarity or by most frequently used or some combination of the two.</p>
