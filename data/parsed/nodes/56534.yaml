      <p>There is really no single right way to order glyphs. There are lots of different strategies that have arisen over the years (Unicode order, grouped by base shape similarity, etc.) to solve specific problems or work around technological roadblocks, but not one single way that works for every situation. </p>
      <p>In the absence of any such force, you should devise something that makes sense to you and is easy to extend and maintain (i.e. if/when you add new glyphs or whatever)...maybe something that is easy to explain to others, should you need to have other people work on your data at some point in the future.</p>
