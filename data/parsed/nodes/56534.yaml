  html: <p>Is there any particular standard for glyph order that should be adhered to when producing fonts or is it up to the designer? In particular I’m interested in glyph order for accented characters in Latin fonts; it seems that some designers follow Latin-1 and then let anything additional come in alphabetical order after the Latin-1 glyphs, but I have also seen some fonts that put all accented characters in alphabetical order.</p>
