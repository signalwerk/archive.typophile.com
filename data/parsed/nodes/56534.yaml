    html: |-
      <p>I vastly prefer "unicode order." If you sort by alphabetical order, when you spool through the characters in the metrics window for kerning, you get, for example, all the a's, then all the b's, etc. I've too many years with a workflow where the sequence goes a-b-c-d etc. Kerning the accented &amp; other letters comes later. For the unencoded characters, I set the index (order) by hand; I like the numbers to run from 0 through 9, and the proportionals not be scattered with the tabular. Etc.</p>
      <p>Anyway, bear in mind that the sort order will affect what the next character will be in the metrics window.</p>
      <p>FWIW</p>
