    html: "<p>James, a warning also regarding fiddling with the glyphs order: I ended up with two or three different glyph orders inside the same family, by stumbling through the learning process. The fonts worked OK in all the software, only the MyFonts character renderer just would not show them right. Re-encoding, generating Unicode and Names did not fix the problem. In the end, the solution was to sort them all in <em>Index</em> view by Unicode, then re-encode on FreeFont.</p>"
