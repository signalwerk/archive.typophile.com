    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Designers" class="freelinking" rel="nofollow">Designers</a> : David Lemon</strong> (1955?-)</p>
    <p>After working at the San Francisco Examiner newspaper, David Lemon began working in the type group at <a href="/wiki/Adobe%20Systems" class="freelinking" rel="nofollow">Adobe Systems</a> in 1989, reporting to <a href="/wiki/Sumner%20Stone" class="freelinking" rel="nofollow">Sumner Stone</a> and working alongside <a href="/wiki/Robert%20Slimbach" class="freelinking" rel="nofollow">Robert Slimbach</a> and <a href="/wiki/Carol%20Twombly" class="freelinking" rel="nofollow">Carol Twombly</a>. He soon became a manager, responsible for all new font production. In 2003 he became the manager for the entire type group.</p>
    <p>David Lemon has one published typeface to his credit, Copal, an ornate display face which was inspired by Mayan carvings.</p>
