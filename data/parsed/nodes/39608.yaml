    <p>I stumbled across a couple of pics of posters for the typeface Honmun by Seonil Yun on <a href="https://web.archive.org/web/20081008042643/http://typeandgouda.wordpress.com/">Sébastien Sanfilippo’s blog</a>. There are lots of impressive projects by students of the Type]Media Department at KABK on display over on the blog. Honmun especially intrigued me because of its concept.</p>
    <p>The text on the poster says: “Honmun is a Latin typeface for Chinese, Japanese and Korean (CJK). It functions as an independent Roman font with CJK specific typographic features.”</p>
    <p>Does anyone know more about the project or know where to find some more information? One of my central interests in typography is multilingual typesetting involving Korean and Latin typefaces, so I’d love to learn more about this. I know Seonil Yun has posted on Typophile in the past; if I asked politely, could she be coaxed into coming out here again to enlighten us?</p>
