    html: |-
      <p>Hi everyone,</p>
      <p>Thanks for your comments. While doing this one very slowly lately I've come across so many weak points, that still exist in this pdf. K, S, s, g need a lot of work. Anyway, I put a new pdf (power3.pdf) to let you know what's going on. Any critic, etc. is welcome and hope it looks better than previously. For example UC letters have been tamed down a bit, those round letters just got annoying very quickly. Also kerning is undone...</p>
      <p>I will add lots of alternate letters, reason being possible future use where I or customer may have some preference for the project and we may find some matching things in alternates. I prefer to make fonts custom for each project.</p>
