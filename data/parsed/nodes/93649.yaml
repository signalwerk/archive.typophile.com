    html: |-
      <p>Hey, I can't stand Italics! It's quite refreshing to read what you wrote. BTW you might enjoy Typo magazine, which uses (used to use?) demi weights for emphasis instead of Italics. It worked superbly.</p>
      <p>The things is, a designer necessarily accommodates things beyond his own desires, so making Italics is in a way an act of pragmatism for people like us. But if one does have to make Italics, at least one can do something interesting, culturally progressive. And here's an upside-down idea I had very recently: instead of making it softer, it should in fact be harder. We are after all talking about <em>emphasis</em>!</p>
      <p>hhp</p>
