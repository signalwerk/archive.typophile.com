    html: |-
      <p>Thanks!</p>
      <p>I think the other section is a bit too playful also. I've always been playing with some characters due to the nature of the jobs (or my "customization" towards the job/layout), which later I felt to be a bit unnecessary at times. Sometimes custom fonts I've made include already graphic elements/characters in the font file rather than made separately in indesign layout file. I think I will keep them for awhile and tomorrow change them into more consistent one's as I did with capitals:) </p>
      <p>I've thought about few different italics. One more slanted and one more organic/human. Before I start giving form to italics I will make this medium/semibold cut ready. I've been thinking about this kind of combo: Thin Light / Medium / Semibold/ Bold / Black and more condensed cuts better for long bodytext + maybe italics. On the other hand I really like working at the company I'm in (we have custom fonts made by Tomi / Suomitype) because there are no italics. Contrasts become more interesting and layouts look stronger / bold. Anyway, due to not knowing yet the destiny of this font It's maybe even good to make italics so I have that option also.</p>
