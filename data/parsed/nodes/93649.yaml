    html: |-
      <p>Alphabetics:<br>
      The only glyph that really isn't working is the "Q". And in the "g" I would raise the horizontal bar a bit. In the "y" you can "cheat" by raising the part that sits on the baseline (to make more air for the descender).</p>
      <p>Numerals:<br>
      The "4" is too small - lower the bar. The "7" is too big.</p>
      <p>Other:<br>
      The acute/grave accents aren't working. I'm not sure about the comma/quotes. The period (and the others) would probably be much nicer larger. The bars of the Euro are too close. The percent doesn't need that curly join thing.</p>
      <p>BTW, have you thought about the Italic?</p>
      <p>I do hope to see this released!</p>
      <p>hhp</p>
