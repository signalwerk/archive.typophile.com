    html: |-
      <p>You know what? I don't know why but just looking at these letter shapes one can say that you must be from a Nordic country. I really like how /s/ and /a/ complement each other. /y/ is really waaaaay too narrow. I must agree on that.</p>
      <p>You will also have to do something about stroke weight, because vertical strokes seem thinner than horizontal ones. That's actually quite common. And most mono-contract sans serif have verticals a bit thicker than horizontals to make them look the same.</p>
      <p>UC letters seem to have a lot of character but maybe bit too different one than lc ones.</p>
