    html: |-
      <p>To recreate this sign I would consider the extensive Core Sans series<br>
      Core Sans A 75 Extra Bold pretty well has the letters<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/CoreSansA75ExtraBoldAsChicago_5850.gif"></div><br>
      <a href="http://www.myfonts.com/fonts/s-core/core-sans-a/" title="http://www.myfonts.com/fonts/s-core/core-sans-a/">http://www.myfonts.com/fonts/s-core/core-sans-a/</a><br>
      Crossbar on _G_ is a little long.<br>
      Core Sans G Neon<br>
      <div class="imageWrap"><img src="http://typophile.com/files/CoreSansGNeonAsChicago_5328.gif"></div><br>
      <a href="http://www.myfonts.com/fonts/s-core/core-sans-g/" title="http://www.myfonts.com/fonts/s-core/core-sans-g/">http://www.myfonts.com/fonts/s-core/core-sans-g/</a><br>
      Has the effect but wrong G and weight is a little light<br>
      Edit this data  to make a pretty good match.<br>
      Don<p></p>
