      <p>I'd probably try to start with <a href="http://www.myfonts.com/fonts/marksimonson/proxima-nova" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Proxima Nova</a> (soft rounded version <a href="http://www.myfonts.com/fonts/marksimonson/proxima-nova-soft" title="Click to visit an external URL." class="freelink freelink-external freelink-external">here</a>) or <a href="http://www.typography.com/fonts/gotham/overview" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Gotham</a> (<a href="http://www.typography.com/fonts/gotham-rounded/overview" title="Click to visit an external URL." class="freelink freelink-external freelink-external">rounded version</a>), manually outlining to artificially embolden and round it. Some techniques could even blunt corners like on this signage.<br>
      Ready-to-go option but probably with an overall look less close than Proxima/Gotham: <a href="http://www.myfonts.com/fonts/aviation/polaris" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Polaris</a>, <a href="http://www.myfonts.com/fonts/aviation/alleyn" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Alleyn</a></p>
