    html: <p>Sounds like you realize this is not type, but custom lettering, so I'll spare you that lecture. The closest font might be <a href="http://www.myfonts.com/fonts/exljbris/museo-sans-rounded/?refby=typographica">Museo Sans Rounded</a>. Shave the ‘G’ beard, widen the ‘A’, and narrow the ‘O’.</p>
