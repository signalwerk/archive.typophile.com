    html: |-
      <p>I'd probably try to start with <a class="freelinking external" href="http://www.myfonts.com/fonts/marksimonson/proxima-nova" rel="nofollow">Proxima Nova</a> (soft rounded version <a class="freelinking external" href="http://www.myfonts.com/fonts/marksimonson/proxima-nova-soft" rel="nofollow">here</a>) or <a class="freelinking external" href="http://www.typography.com/fonts/gotham/overview" rel="nofollow">Gotham</a> (<a class="freelinking external" href="http://www.typography.com/fonts/gotham-rounded/overview" rel="nofollow">rounded version</a>), manually outlining to artificially embolden and round it. Some techniques could even blunt corners like on this signage.<br>
      Ready-to-go option but probably with an overall look less close than Proxima/Gotham: <a class="freelinking external" href="http://www.myfonts.com/fonts/aviation/polaris" rel="nofollow">Polaris</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/aviation/alleyn" rel="nofollow">Alleyn</a></p>
