      <p>I think it's a good idea to keep their identity going - see if you can work the Eurostile into the materials. Altho I don't think of Eurostile as particularly "friendly and inviting". I think your instinct to mix it with a serif font is a good one, both because they're less likely to fight and because serifs are a little more friendly.</p>
      <p>Something else by Novarese (you mentioned Fenice) is a good way to start. Maybe look at the font Novarese? Altho both it and Fenice lack italics. Belizio?</p>
