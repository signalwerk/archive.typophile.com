    <p>Hi,<br>
    I'm in a bit of a quandary, and could do with some advice.<br>
    I'm doing various leaflet / flyer marketing pieces.<br>
    The company's logo uses Eurostile, and have used Eurostile in various things like signage in the past.</p>
    <p>So I was thinking to keep continuity, of using Eurostile for headings etc, and mixing it with another font for the body text.<br>
    I'm In a number of minds over what font to contrast with Eurostile,  sans, or serif. maybe a 'super family' with both?<br>
    I've looked at fonts like Melior, and ITC Fenice, which have similarities with Eurostile, but them seem a bit sharp and mean.<br>
    I suppose the feel should represent quality and sincerity, friendly and inviting. </p>
    <p>Or should I scrap the idea of using the font in their identity,<br>
    and just choose one font with a good range of weights, and use that throughout, for titles and body text etc. ?  </p>
    <p>Any ones suggestions of what direction they think would be good to go would be very much appreciated.<br>
    Toby</p>
