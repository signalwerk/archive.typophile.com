      <p>I think you should keep the identity, and try to do not mix typographies. However if you "have to" use any other typography I would suggest a serif, at leas to look for an excuse/change... But still thinking that 1 typography in a artwork is more than enough. Keep it simple... as Bruno Munary would say: "design is simplifying no complicating". But is just a personal agreement.</p>
