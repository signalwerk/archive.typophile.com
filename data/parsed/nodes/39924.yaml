      <p>I like Melior and I think it's a great text companion for Eurostile; I probably would have thought to suggest it even if you hadn't mentioned it. I definitely find it a friendly and inviting face myself... but as mentioned I like it so I'm probably not being impartial.</p>
      <p>Not so fond of Fenice as a text face, but a lot has to do with the letterspacing, leading and size. I bet a good designer could set with it and I'd go, “Hmmm, that's nice!” when I looked at the page (probably by using wider spacing than I'm generally fond of). I have the same reservations about Bodoni but I've seen it and liked it for text without consciously paying attention to how it was set.</p>
      <p>I would prefer not to pair Eurostile headings with a sans text face given the choice, but I've seen it used with Helvetica in the past and it didn't suck - the very blandness of Helvetica means it doesn't fight with Eurostile's characteristics. So how about Neue Helvetica 45? Might be worth giving Optima a shot too, you might like them together.</p>
