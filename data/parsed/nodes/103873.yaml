      <p>I also spot a few discrepancies which I fixed over the years. Most obvious: the ugly long s "∫", which was created by mirroring the curve of the Minion "j". I dare not stretch out a regular "s" -- certainly it would not survive such a treatment with grace! --, so I repurposed the huge bowl of the "f":</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/esses_3579.png"></div><p></p>
      <p>It feels I'm always fixing this font ... At least it's an advantage, then, it's solely for in-house productions. Only <em>very</em> occasionally I mucked up existing documents by printing them with an 'updated' version :-/</p>
