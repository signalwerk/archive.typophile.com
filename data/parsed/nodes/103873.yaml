    html: |-
      <blockquote><p>Michel Boyer wrote:<br>
      As for the font, I find it unfortunate that even Acrobat Professional does not allow us to see the font copyright, all we can see is the font names.</p></blockquote>
      <p>Michel, with Acrobat Pro you can:<br>
      1. Open the Preflight panel. (Exact location in the menus depends on version and sub-version of your Acrobat.)<br>
      2. Wait for Preflight panel to load.<br>
      3. Wait for Preflight panel to initialize.<br>
      4. Wait for Preflight panel to display.<br>
      5. Click "Options" in the right hand corner.<br>
      6. Select "Create Inventory" from the menu.<br>
      7. Switch off any items you are not immediately interested in.<br>
      8. Click OK, then wait some more while a detailed PDF is created.</p>
      <p>The plus point is that this PDF is <em>extremely</em> detailed ... except, after all this waiting, I see it displays lots of font information except the Notice. Hmmm ... Second attempt:</p>
      <p>1. Open the Preflight panel (then wait, etc.)<br>
      2. Click "Options" in the right hand corner.<br>
      3. Select "Browse Internal Structure of all Document Fonts" -- a treeview dialog opens<br>
      4. Open the sub-tree "MinionPhoneticPro"<br>
      5. Open the sub-tree "Internal Structure"<br>
      6. Open the sub-tree "Font" (!) -- and there is the Notice.</p>
    html_clean: |-
