      <p>Oh, I love what you did to U + 0283! It is probably my favourite glyph in that typeface! Though, probably, some purist who knows a lot about creating phonetic fonts might say that it is all wrong.</p>
      <p>I was just hoping, Theunis, that this is available for purchase, I kept thinking that Minion <em>must</em> have a fuller IPA character set somewhere, so it is a bit disappointing to learn that it is purposely built for that linguistics journal.</p>
      <p>I guess that what you all say about Adobe licences is why the firm that designed Duden Aussprachewörterbuch could change Kepler and creatic the phonetic set. I am forgetting the name, but I know they have a website. The name is on the first pages of the dictionary.</p>
