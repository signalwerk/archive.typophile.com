      <p>The link is <a href="http://idiom.ucsd.edu/~arvaniti/08arv.pdf" rel="nofollow">http://idiom.ucsd.edu/~arvaniti/08arv.pdf</a>, the pdf is an article published in the <em>Journal of Greek Linguistics</em>, John Benjamins Publishing Company. The <a href="http://benjamins.com/#catalog/journals/jgl/main" rel="nofollow">link on the John Benjamins' site</a> says "no longer our product"; the journal is now published by Brill.</p>
      <p>As for the font, I find it unfortunate that even Acrobat Professional does not allow us to see the font copyright, all we can see is the font names. If I generate a Postscript from the pdf, I get the following copyright notice: </p>
      <pre>     Notice (Pieter Lamers / Theunis de Jong)
      </pre>
