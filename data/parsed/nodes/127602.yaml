      <p>Sorry, not finding a match.</p>
      <p>Typefaces carved or sandblasted onto gravestones don't always correspond to typefaces used for print, and that appears to be the case here.</p>
      <p>Resembles some of the Modified Roman faces found here:<br><a href="https://www.monumentletteringcenter.com/shop/">https://www.monumentletteringcenter.com/shop/</a></p>
