    html: <p>Nimrod is a great old stalwart. Paul Luna of the Oxford dictionaries loves it. <br>And as far as I'm concerned it looks weird at large sizes <i>because</i> it's a "real" text face! <br> <br>Would you be interested in commissioning a display cut of Nimrod? That would really be ideal. <br>Otherwise try looking into Scotch faces that are narrow and have high stroke contrast. <br> <br>hhp <br></p>
