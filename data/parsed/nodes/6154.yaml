  html: <p>We use Nimrod for body copy in a newsmag. It is a reliable face, given our printing conditions, but body copy is the only use it is worth for, as when set bigger than 16 pt it looks, well, weird. However I would like to set some pull quotes/leads in a serif face so I'm looking for a font which would be close in its characterics to Nimrod yet a little more sophisticated, so that it could be used for body copy, and also for nicelooking pull quotes in 25 pt. Or should I introduce a second face? Or perhaps a family with book/display sets? PS. Other faces used in the mag are Interstate (headlines/pullquotes/leads) and Syntax (small sansserif body text)</p>
  html_clean: <p>We use Nimrod for body copy in a newsmag. It is a reliable face, given our printing conditions, but body copy is the only use it is worth for, as when set bigger than 16 pt it looks, well, weird. However I would like to set some pull quotes/leads in a serif face so I'm looking for a font which would be close in its characterics to Nimrod yet a little more sophisticated, so that it could be used for body copy, and also for nicelooking pull quotes in 25 pt. Or should I introduce a second face? Or perhaps a family with book/display sets? PS. Other faces used in the mag are Interstate (headlines/pullquotes/leads) and Syntax (small sansserif body text)</p>
