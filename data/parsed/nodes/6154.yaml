    html: "<p>Would you be interested in commissioning a display cut of Nimrod? That would really be ideal.  <br>--------- <br>Hehe, I wonder how much that would cost.... not that I could afford that anyway - our boss still thinks that serious investing in quality design is a futile thing to do - just curious. <br> <br>Anyway, both Utopia and Hercules seem alluring, but I can afford only one of them. And with that comes another question: how do you determine if a textface is appropriate for a particular task, if you don't have a chance to see it set in a large text block together with other faces you intend to use? In my experience a test line of a font may seem rather good, but when I set it in the particular page, columns and all, for one reason or another it simply doesn't work. Is there a way to know it beforehand? Does this kind of knowing come with education or experience (I don't have much of either), with intricate knowledge about the letterforms? Or do we all just kind of make a 'blind shot' and see what we get?</p>"
