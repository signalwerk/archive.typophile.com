    html: <p>PDF specimens (and a good laser printer) are absolutely necessary to judge a good text font. <br> <br>I'm not sure where you can find a specimen of Utopia, but Storm's expert pages are great. Here's the <a href="http://www.stormtype.com/expert/hert.html"> text cuts</a> of Hercules. Use the "Download this PDF" link in the upper right-hand corner. <br> <br>Mr. Phinney may be able to point you to a Utopia PDF. <br> <br>-Addison</p>
