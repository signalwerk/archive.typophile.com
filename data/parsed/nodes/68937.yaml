  html: |-
    <p>I am trying to identify the font I used to create a logo for my website (<a href="http://kickert.info/" title="http://kickert.info/">http://kickert.info/</a>) several years ago.  I know I used two different fonts and have already identified the first one.  Here is what I know:</p>
    <p>I first used it 3-5 years ago.<br>
    I distinctly remember using a font categorized as "handwriting"</p>
    <p>I would love an exact match, but if that is not possible, I am looking for a font that:<br>
    -has a larger upper bowl<br>
    -crosses over the stem at all three junctures<br>
    -has rough edges instead of smooth<br>
    -has a comparable slope</p>
    <p>Thanks!<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/binquestion_5116.gif"></div><p></p>
