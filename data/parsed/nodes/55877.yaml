    <p>Hi there,</p>
    <p>Usually when I expand my class kerning previous to PS1 generation I am in doubt of using or not the options present in the check box "Create only pair with glyphs in these codepages/encodings" because I do not fully understand how it works.</p>
    <p>Does it filter the resulting kerning by checking if the resulting pairs are present or not in the languages covered by the chosen codepage or encoding?<br>
     For a Mac OS Roman font, what options should I check? "Current codepage in the Font Window"?</p>
    <p>Thanks in advance. </p>
    <p>Ramiro.</p>
