      <p><em>Does it filter the resulting kerning by checking if the resulting pairs are present or not in the languages covered by the chosen codepage or encoding?</em></p>
      <p>No.<br>
      And it does not check to see whether the characters are used in the same language.<br>
      Consider Latin 1, which contains, for instance, ccedilla and lslash, which are used exclusively in French and Polish, respectively.<br>
      If you put a kern between c and l, and include ccedilla in your c kerning class, and lslash in your l kerning class, then your expanded kerning will include an entry for the ccedilla-lslash combination, although this never occurs in any language.</p>
      <p>At least, that's my understanding of the situation.</p>
      <p>Some people have gone to the trouble of investigating real-language occurrence of character pairs, and using it to limit the number of kern pairs in their fonts. House Industries and Lucas de Groot, IIRC.</p>
