    html: <p>Yup. And those guys from Deutsche Bundespost didn't take it, stayed with Helvetica for a while and now are using Frutiger, which is almost as un-inspired a choice as Helvetica.  <br>Congrats, Rodolfo... I should have known that was WAY to easy for cracks as you folks are ;-D.  <br> <br>Actually its brilliant timing, I'm off to a party, so I'm happy to not have anybody waiting for my response.  <br> <br>Go ahead... see ya later...</p>
  - id: 68104
