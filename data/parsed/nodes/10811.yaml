    html: "<p>Right, new rules: <br> <br>15. The winner of a round must provide a new question within 12 hours. If he or she fails to provide a question during this time, the privilege reverts to the winner of the previous round who must either provide a new question or ask the quizmaster (that's me, if you recall) to pose a new question or nominate someone else to do so. <br> <br>16. There are no bonus points awarded for correctly answering two or more questions in a row, providing additional information relating to the answer (although this is certainly encouraged), or otherwise exceeding the minimum requirement of correctly answering the question: the honour is reward enough.</p>"
