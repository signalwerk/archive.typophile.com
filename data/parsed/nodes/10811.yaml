    html: <p>OK I've got something. <br> <br>I recently came across a book set in <b>Times New Roman Gaelic</b>. Not really one of the gems of Gaelic typography but it was once a new and exciting thing and some people even thought it was a good idea. It makes a good question anyway. <br> <br>1. Who is credited with its design? (bonus for the name of the man who actually did the drawing) <br> <br>2. When was it designed? <br> <br>3. It was only ever used in one book. Which one? <br> <br>If you come up with the answer in 2 minutes, I'm not going to be your friend anymore! <br> <br>Good luck, <br> <br>Matha. <br> <br></p>
