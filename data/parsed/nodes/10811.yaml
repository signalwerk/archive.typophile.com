    html: '<p>Okay, new rules: <br> <br>13. If no one successfully answers the question within 24 hours, the person who posed the questions must a) reveal the correct answer, including sources, and b) pose a new question on a different theme. <br> <br>14. The person who posed the unanswered question may be challenged at any time after revelation of what he or she considers to be the correct answer, and if found to be in error shall be barred barred from winning any of the next three questions regardless of whether he or she correctly answers them. <br> <br> <br>You know, inventing rules is way more fun than trying to answer questions. <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> <br> <br>Hrant, participants have until 7:00am tomorrow morning to come up with the correct answer.</p>'
