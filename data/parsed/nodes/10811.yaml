    date: 2003-03-22T10:09:00
    votes: null
    html: <p>Yup. And those guys from Deutsche Bundespost didn't take it, stayed with Helvetica for a while and now are using Frutiger, which is almost as un-inspired a choice as Helvetica.  <br>Congrats, Rodolfo... I should have known that was WAY to easy for cracks as you folks are ;-D.  <br> <br>Actually its brilliant timing, I'm off to a party, so I'm happy to not have anybody waiting for my response.  <br> <br>Go ahead... see ya later...</p>
  - id: 68104
    user_id: 916
    user_name: rcapeto
    user_path: null
    user_image: null
    date_raw: 22 Mar 2003 — 10:54am
    date: 2003-03-22T10:54:00
    votes: null
    html: <p>Frankly, I'm not <i>so</i> sure if Meta would be a much <br>more inspired choice than Frutiger or Helvetica. Well, <br>at least it was brand new then... <br> <br>John, your rules don't say anything about the extra <br>bonus points I get for being the first to answer two <br>quizzes correctly. <br> <br>I'll think of something and come back with a question <br>in a while.</p>
  - id: 68105
    user_id: 916
    user_name: rcapeto
    user_path: null
    user_image: null
    date_raw: 22 Mar 2003 — 12:32pm
    date: 2003-03-22T12:32:00
    votes: null
    html: "<p>Sorry, I was a bit busy here and couldn't come earlier. <br>Well, supposing no one will challenge my Bundespost answer, <br>here's a question [easy?]: <br> <br>In the 19th century an English researcher, intending to <br>print tables of logarithms, conducted tests to determine <br>whether lining or lowercase figures (what's generally called <br>\"old-style\" figures) were more legible. He came to the <br>conclusion that lining figures were the most legible. <br> <br>This result has been contradicted by later experiments, <br>and I'm really not sure if there's any recent conclusion to <br>the debate - I assume not. <br> <br>In a certain way, this guy was, indirectly, responsible for <br>your ability to read now what I've been writing here. Who was <br>he and how is he important, at least emblematically, for our <br>mutual communication on this forum? </p>"
