  html: <p>would love to see your ideas about aesthetics in typography. <br>is harmony beautyful, and disharmony ugly? is beauty dependent on shape, or can any typeface be beautiful if set into the right surroundings? has beauty become the same as style nowadays?  <br> <br>please share your ideas and interpretations.</p>
