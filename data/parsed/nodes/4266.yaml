    html: '<p>Harmony is indeed an interesting thing. Two aspects of it that I think are most notabe: <br>1) There are levels of complexity of harmony, and discord is merely the point at which the complexity exceeds our ability to appreciate it. Furthermore, this point varies for each individual. <br>2) I think that you can have harmony in consiousness, and also harmony in the subconscious. For example in a display face harmony can be promoted through high formal modularity and alignment; but the way a text face is used might make these harmonic tactics actually backfire. You could say text faces need a deeper harmony to really work, but when set at a large point size it looks like discord. <br> <br>I would recommend a wonderful little booklet called "The Harmonograph" by Anthony Ashton (Wooden Books Ltd, 1999). Although the book is essentially about a peculiar undulating device (popular in the Victorian period) which draws spirals and such of varying complexity, it does contain some great nuggets of harmonic wisdom - such as this: "Music with only simple harmonies can seem naive and uninteresting. The more complex harmonies are intriguing, challenging." <br> <br>hhp <br></p>'
