    html: <p>Too much harmony/unity/symmetry ... Too much discord/incongruity/assymetry ... Both can be beautiful and ugly. The wonderful thing about all things creative manifested in objects of all varieties is that it is all subjective. Of course there are things that some will agree upon, but those same things can become a rift between two designers that were friends. Some typefaces are beautiful in an of themselves. But those same typefaces don't guarantee a well thought out typographic scheme. For everything there is an opposite, and that is what makes some beautiful, I think so anyway.</p>
