      <p>I've used Kindles for awhile now, and I eventually grew tired of Caecilia. Overexposure, I guess. </p>
      <p>Now I'm happy to see a few more typeface choices on the latest Kindle, plus the embedded fonts that some publishers are putting in their e-books. So, yes, when I see Caecilia IRL, I might recoil a bit. Maybe that's just me, though.</p>
