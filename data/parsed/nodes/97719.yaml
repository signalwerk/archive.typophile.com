    <p>I've always been fond of Caecilia.</p>
    <p>I don't have a Kindle, but if I did, I wonder if I'd become so accustomed to seeing Caecilia on that little monochrome screen every day that it might start to look odd to me when I see it IRL. So ever since the first Kindle came out, I have an extra little hesitation to work through before using Caecilia in a project.</p>
    <p>Am I being too sensitive?</p>
