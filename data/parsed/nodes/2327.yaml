    html: <p>Troy, I think you have two separate ideas that you are trying to force together. A 30's retro theme and illustrating tasty design. If its the 30's feel you are after maybe the word you are looking for isn't tasty, but Elegant might fit better. In either case follow PJ's advice, I once had a mortgage refi project and I presented 15 concepts, marker on paper, 75 concepts later I got the 3 that left the agency and i can tell you I'd still be working on them if I did it on a computer.</p>
