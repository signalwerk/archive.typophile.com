  html: <p>Hello <br>I'm trying to put together an identity for my freelance work that emphasizes a non-corporate, entertainment-oriented focus. I want to use a 1930s or 40s-era diner as a metaphor for the promotional materials. <br>What do you think of this logo? (I don't have a color palette in mind yet.) <br> <br>Thanks, <br> <br>Troy<img src="http://www.typophile.com/forums/messages/29/21940.jpg" alt="logo"></p>
