    votes: null
    html: <p>Troy, it is probably legal to use a "prefabricated" ilustration. The problem is that you do not have exclusive rights to use it., so your neighbour may use the very same ilustration in his logo some day. In such a case you could have a tough time telling your clients that you "serve" original design done exclusively for them... </p>
