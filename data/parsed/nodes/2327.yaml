    html: <p>I like the idea of cooking/serving good (tasty) design, Troy. But I am not sure if those quite rigid letters correspond to the very dinamic figure of a cook/waiter. <br> <br>Maybe you should try to keep this 30s-like composition, but combine it with a more contemporary font. It could communicate meaning like "contemporary design served in a 30s manner".</p>
