    html: <p>Thanks for the comments and suggestions. I will post another few possibilities soon. <br> <br>My illustration was based on a piece of clip art I found in one of Dover's books -- which apparently was also the basis for the dingbat. I am curious about the issue of incorporating illustration work done by someone else -- do you think there's something wrong with that? Obviously it's in the public domain so I'm not stealing anything from anyone. Is there any difference between that and using another person's typeface design (which this is)? <br>Is it just because it's a logo? I see designs (including logos) all the time that obviously incorporate old artwork. (Art Chantry's work comes to mind.) <br> <br>I don't mean to argue with you, I sincerely am interested in what you think. <br> <br>Maybe it's better for me to explore type-only solutions (especially if the chef looks like a pig --ha!) <br> <br>Thanks, <br> <br>Troy</p>
    html_clean: <p>Thanks for the comments and suggestions. I will post another few possibilities soon. <br> <br>My illustration was based on a piece of clip art I found in one of Dover's books -- which apparently was also the basis for the dingbat. I am curious about the issue of incorporating illustration work done by someone else -- do you think there's something wrong with that? Obviously it's in the public domain so I'm not stealing anything from anyone. Is there any difference between that and using another person's typeface design (which this is)? <br>Is it just because it's a logo? I see designs (including logos) all the time that obviously incorporate old artwork. (Art Chantry's work comes to mind.) <br> <br>I don't mean to argue with you, I sincerely am interested in what you think. <br> <br>Maybe it's better for me to explore type-only solutions (especially if the chef looks like a pig --ha!) <br> <br>Thanks, <br> <br>Troy</p>
