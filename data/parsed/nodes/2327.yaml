    html: <p>pig?  haha...it's a chef, right?  and that's his apron tied in the back, right?  (not a curly pig tail)  i think his raised leg needs to be a little longer and maybe not curving up so much. <br> <br>i agree with tiffany wardle though, that the big circle takes away focus on the wonderful little guy.  maybe avoid the circle and have 'design' going horizontal. <br> <br>also, i think TASTY looks mis-scaled.  try evening out the curve over the tops of the letters.  make the second T smaller i think, and maybe move the Y left a bit....or do completely different tries with other fonts.  you gotta do 20 to get 1.</p>
