    html: "<p>I think there was a miscommunication ... but Matjaz makes <br>the point that Tiffany meant to make, I think, about the <br>distinctiveness factor. <br> <br>Just taking that a step further. It isn't *probably* legal, <br>it's legal legal legal. <br> <br>I think the word \"discovered\" made it sound like you had <br>done something wrong, which clearly, you didn't and <br>clearly that wasn't Tiffany's intention. <br> <br>All that said ... <br> <br>I looked at your original intentions (non-corporate, entertainment focus) <br>and the Retro 30s look, imo, is not your strongest direction. <br> <br>The Tasty type treatment is problematic because the <br>T and Y are rendered so small in comparison to the  <br>other letters. I do enjoy the letterforms themselves. <br> <br>And the logo could just as well be for a caterer or cake designer. <br> <br>The word \"Tasty\" is not the easiest thing to illustrate ... <br> <br>Sometimes the solution just comes from sketching or <br>fiddling in Illustrator. When it doesn't come right away, <br>one thing that I've found works is to try to pour out <br>26 solutions or 26 ideas in 26 minutes.  <br>The 26 can be thought of as arbitrary guide, but if you <br>get stuck, the specific letter can be an ideation catalyst. <br> <br>These can be quick sketches or just words: waiter with serving tray. <br> <br>From those ideas, take a handful of your best and render <br>them in pencil and go from there in illustrator. <br> <br>Just one approach, and of course, my opinions are just that. <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\"> <br> <br>PS, as far as use of images by Chantry, etc., Daniel previously <br>linked this article from CreativePro. <br> <br><a href=\"http://www.creativepro.com/story/feature/20305.html\" target=\"_blank\">http://www.creativepro.com/story/feature/20305.html</a> <br> <br> <br> <br>bj <br> <br></p>"
    html_clean: "<p>I think there was a miscommunication ... but Matjaz makes <br>the point that Tiffany meant to make, I think, about the <br>distinctiveness factor. <br> <br>Just taking that a step further. It isn't *probably* legal, <br>it's legal legal legal. <br> <br>I think the word \"discovered\" made it sound like you had <br>done something wrong, which clearly, you didn't and <br>clearly that wasn't Tiffany's intention. <br> <br>All that said ... <br> <br>I looked at your original intentions (non-corporate, entertainment focus) <br>and the Retro 30s look, imo, is not your strongest direction. <br> <br>The Tasty type treatment is problematic because the <br>T and Y are rendered so small in comparison to the  <br>other letters. I do enjoy the letterforms themselves. <br> <br>And the logo could just as well be for a caterer or cake designer. <br> <br>The word \"Tasty\" is not the easiest thing to illustrate ... <br> <br>Sometimes the solution just comes from sketching or <br>fiddling in Illustrator. When it doesn't come right away, <br>one thing that I've found works is to try to pour out <br>26 solutions or 26 ideas in 26 minutes.  <br>The 26 can be thought of as arbitrary guide, but if you <br>get stuck, the specific letter can be an ideation catalyst. <br> <br>These can be quick sketches or just words: waiter with serving tray. <br> <br>From those ideas, take a handful of your best and render <br>them in pencil and go from there in illustrator. <br> <br>Just one approach, and of course, my opinions are just that. <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\"> <br> <br>PS, as far as use of images by Chantry, etc., Daniel previously <br>linked this article from CreativePro. <br> <br><a href=\"http://www.creativepro.com/story/feature/20305.html\" target=\"_blank\" class=\"link-external\">http://www.creativepro.com/story/feature/20305.html</a> <br> <br> <br> <br>bj <br> <br></p>"
