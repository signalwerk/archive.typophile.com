    <p>Hi Typophiles,</p>
    <p>I'm looking for a French script similar to Batarde Couleé and Chanson d'Amour made after Fourniers handwriting I believe. </p>
    <p>I have already contacted Lineto today if they still license Batarde Couleé. I can't find it from their website anyways. Chanson d'Amour I have licensed before. It's nice but a little too thin for my needs.</p>
    <p>Are there any alternatives? A clean outlined one would be nice.</p>
