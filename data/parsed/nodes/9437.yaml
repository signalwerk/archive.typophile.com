    html: <p>I pulled out the new AGA Pricing and Ethical Guidelines book to check this out. Their pricing guide is kind of all over the place, but it helps a little.  <br> <br>It looks like they price something like this around $2,000 - $6,000 for the design and $60 - $150 per hour for production/preflight set up, if you have to do that.  <br> <br>The wide range of their prices is supposed to reflect things like the scale and intent of the project (things like print run and how much money the the client is going to make out of it) and the skill of the designer.  <br> <br>On a project like this I would get a feel for how many different types of content you have to manage. If it's just the address listings or do you have to deal with a bunch of ads or make maps or something more tedious.</p>
