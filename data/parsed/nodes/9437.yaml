  html: "<p>Hey all I need some advice.  Hopefully somebody can help. <br> <br>I may be offered a job to do a local yellow pages for seniors in the area.  The person that is heading up the project really wants me to do the layout for it.  Now all I got to do is get back to this person with a quote of how much is going to cost.  The problem is of course, I'm a newb... <br> <br>Well I aint that bad, but I have'nt had much expierience when it comes to hunting down and finding the right price for a print job.  I started to look for online sites and found a few that over instant quotes.  But some of the options still confuse me. <br> <br>I am basically looking for a book along the lines of: <br> <br>60+ pager B/W (newsprint) <br>Glossy color outside B/W inside <br>Binded <br>5/12 by 7/12 (???) <br>8k to 10k copies <br> <br>i.e. Your basic yellow pages look. <br> <br>One site insta-quoted me around $10,500 for 10k in copies at $1.041 a piece.  Is this good?  Around a dollar piece sounds about right. <br> <br>I went to a few places and 5 1/2 by 8 1/2 seemed to be the a standard size of some sort.  <br> <br>So basically I am asking for a little guidance.  Maybe somebody has done a similar job and can give me a few pointers as well.  But right now I am looking to jump the hurdles of this beginning process. <br> <br>Thanks for reading. <br> <br>-Fav <br> <br>/puts thumb back into mouth and curls up into the fetile position.</p>"
