    html: <p>Comic Sans. Wow. You're not kidding. <br> <br>Phone book type is normally set very small (to save paper) and narrow (to reduce line-breaks) - so you'd need a font with a tall x-height, and no clutter. But in your case it's for seniors (poor insight, but good reading experience), so although the economy issue is still there, the point size will be larger, so there's less demand on the x-height. If you have the Multiple-Master version of Myriad, you could probably generate a custom instance of weight and width that suits you just right. But the x-height is on the small side (for this task)... In which case you might try is a condensed cut of Poppl-Laudatio, a face that has a  large x-height but also distinctive flares at the ends of strokes - you could even use it for both small text and large. I love Laudatio. <br> <br>hhp</p>
