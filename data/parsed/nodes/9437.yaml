    html: <p>you could try LeMonde livre or sans by Jean Francois Porchez... <br> <br>it is very readable in small, so for seniors in a few points over it will be perfect. Le Monde Journal was designed for being used under 10 pts, and LeMonde Sans or Livre is best used over 10.  It doesn't have  a condensed version though it has a narrow width. you can buy it at <a href="http://www.typofonderie.com" target="_blank">http://www.typofonderie.com</a>.</p>
