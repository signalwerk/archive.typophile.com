  html: "<p>For those who haven't seen it yet: <a href=\"http://www.new-series.org/?lange\">Gerald Lange's interview</a> in <br>Andy Crewdson's new series, posted today, is quite nice. <br> <br>It's interesting to see Crewdson's evolution, from eager beginner <br>at Typo-L, to successful typoblogger who in a fit of rage destroys <br>all existing archives of his files, to a sort of typo-recluse who <br>periodically puts out some fine, long texts. But he's doing a good <br>job in this. <br> <br>Maybe Joe Clark was, unwillingly, the Pygmalion here.</p>"
  html_clean: "<p>For those who haven't seen it yet: <a href=\"http://www.new-series.org/?lange\" class=\"link-external\">Gerald Lange's interview</a> in <br>Andy Crewdson's new series, posted today, is quite nice. <br> <br>It's interesting to see Crewdson's evolution, from eager beginner <br>at Typo-L, to successful typoblogger who in a fit of rage destroys <br>all existing archives of his files, to a sort of typo-recluse who <br>periodically puts out some fine, long texts. But he's doing a good <br>job in this. <br> <br>Maybe Joe Clark was, unwillingly, the Pygmalion here.</p>"
