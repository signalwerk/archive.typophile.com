      <p>I think Jan has probably answered the font question. As for other pairings, I think the goal would be to (probably) find similar weights, but dissimilar styles. So this means, for example, don't use a mix from a superfamily that has both serif and sans versions of the same font. </p>
      <p>Maybe experiment with varying the weights too, now that I think of it. Might be more interesting than keeping the same weights. Anyway, I think it's been done many times, but it can be fun mixing unexpected combinations.</p>
      <p>- Mike Yanega</p>
