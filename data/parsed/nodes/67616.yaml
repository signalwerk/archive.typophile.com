      <p>modernfamily feels much like an homage to Vignelli's Bodoni/Helvetica juxtapositions for IDCNY (down to the warm red).<br>
      Of more recent vintage, the "holdeverything" logo attempted a Helvetica/Bodoni combo, but the x heights were not as well matched.</p>
      <p>Happy hunting!</p>
