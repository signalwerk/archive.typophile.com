    html: <p>Also, look for similar skeleton structures! Are the round shapes oval, or circular? How open are the counters? How high does the n curve start on the left stem? Is the x height vs cap height similar enough? Similarities in width proportions. All of these does not have to match, but they must harmonize somehow.</p>
