    <p>Hi,</p>
    <p>I'm wondering if someone can help me identify the two fonts in the Modern Family logo. Really I just love the way the sans and serif fonts seem to go together so well, so if anyone has any other suggestions for unpretentious, readable, sleek pairings like this, I'd take those as well. I just like this effect very much!</p>
    <p>Thank you all in advance, this forum has been a lifesaver for a type-illiterate person like myself.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/brand_6083.gif"></div><p></p>
