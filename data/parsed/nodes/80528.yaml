      <p>You shouldn't need that many values... for an all-caps display font like this you can probably get away with defining alignment zones for just the baseline and cap height, and standard stem values for the width/height of the main stroke and the inline. Add those to the hinting area in Font Info, then import the zones in the TT Hinting Options (the "..." button on the panel in hinting mode).</p>
      <p>One way of hinting a glyph like the zero (a relatively simple example): Start in vertical mode and add anchors to points at the top and bottom of the glyph (which should automatically attach to the alignment zones), then drag a single link from each of those anchored points up/down to the inside of the first contour (these should automatically link to the stem value for the stroke), from there add another single link across the inline (which should automatically link to the stem value for the inline), and finally to the inside of the interior stroke.</p>
      <p>In horizontal mode, add an anchor to the left sidebearing, from there drag a single link to the left side of the glyph (holding Shift to keep from automatically setting a stem value), then an auto-value single link across the main stroke, the inline and the inner stroke. Shift-drag a no-value single link across the inside counter, then continue with automatic single links to the right side of the glyph, finishing with a no-value link to the right sidebearing.</p>
      <p>It's these zones, stem values, anchors, links, etc. that are stored inside of the font as "hinting." The interpolated post-hinting outlines that you see in FontLab are created on-the-fly based on that info, which is why there's no way to adjust the outline; it's generated from the current hinting program and displayed as a visual aid to help you understand how the points and outlines are being affected to create the bitmap.</p>
      <p>Using the freeware Yagi-like font <a href="http://www.dafont.com/retro-stereo-wide.font" rel="nofollow">Retro Stereo Wide</a> as an example, here's how the hinted zero appears alongside the other un-hinted numerals (Windows XP Grayscale rendering with smoothing to all sizes):</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/zero-hint_5324.png"></div>&nbsp;<br>
      The increased sharpness and definition seems fairly evident, up to a point; whether the difference is drastic enough to warrant manually hinting such a font is... perhaps less so. The double stroke will give you a headache on glyphs like B, E, S, etc. Maybe fill the inline and practice on that first.<br>
      &nbsp;<br>
