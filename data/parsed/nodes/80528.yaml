    <p>So a couple of years ago, I made my first font, Yagi Double. Then I wanted to hint it, got scared when I saw the amount of work involved. Now I'm ready to try again but it STILL seems too tedious, like I'm missing something. What I've read so far on the subject:<br>
    <a href="http://www.rastertragedy.com/" title="http://www.rastertragedy.com/">http://www.rastertragedy.com/</a><br>
    <a href="http://scripts.sil.org/cms/scripts/page.php?site_id=nrsi&amp;item_id=NotesOnHintingWithFL" title="http://scripts.sil.org/cms/scripts/page.php?site_id=nrsi&amp;item_id=NotesOnHintingWithFL">http://scripts.sil.org/cms/scripts/page.php?site_id=nrsi&amp;item_id=NotesOn...</a></p>
    <p>As I understand it, you come up with an array of numbers representing the location of stuff like the baseline, cap height, x-height, etc. You feed these into two different areas in Fontlab. With an inline font like this, there are twice as many of these numbers. It's a lot of hassle.</p>
    <p>1. Does this really produce good hinting results at the end, if I could force myself to do it properly?</p>
    <p>2. Is there no way I can just manually edit the post-hinting outline for each letter? Like drag the vector points around until they neatly box in the pixels? I can <a class="freelinking external" href="http://creedo.gbgl-hq.com/hinting.jpg" rel="nofollow">SEE this outline on the screen</a>, but I can't seem to manipulate it. Is it unrealistic to think I could just manually tweak 52ish characters for every font size between, say, 8 and 18 points?</p>
    <p>3. If I can't do it this way in fontlab, can I somehow do it in illustrator and import the result into fontlab, like "use this vector outline as my 8pt version of zero"?</p>
    <p>Any advice is appreciated.</p>
