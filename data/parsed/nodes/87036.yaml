  html: |-
    <p>Folks, I am trying to identify the font used for the main titles in the Beach Boys 1967 album, 'SMiLE'.  Although the full album has only JUST been released (yes!) the design was complete in 1967.  I really am curious to know what the font is.  Can any of you kind souls help?</p>
    <p>Whilst I am on the subject, Brian Wilson, the main creative force behind the Beach Boys, did completely remake/re-record the 'SMiLE' material in 2004 for his 'Brian Wilson Presents SMiLE' album.  A similar-ish, although by no means identical, font was used for that title.  Does anyone know that font?</p>
    <p>Looking forward to any and all help you may be able to provide.  Thanks!</p>
    <p><a class="freelinking external" href="http://brianwilson.com/" rel="nofollow">http://brianwilson.com/</a></p>
