      <p><em>Given that a ligature is simply defined as being a combination of two or more characters contracted (or of course, legated) into a single character...</em></p>
      <p>No, a ligature is a combination of two or more characters represented by a single <em>glyph.</em></p>
      <p>An ellipsis mark consists of three dots, either by themselves... or followed by a fourth dot or other punctuation if they occur at the end of a sentence.... What you refer to as a 'stylistic choice' looks to me like a grammatical error.</p>
