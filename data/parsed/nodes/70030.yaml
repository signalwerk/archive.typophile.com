      <p>Strunk and White weigh in...</p>
      <p><em>The ellipsis itself is three periods (<strong>always</strong>); it can appear next to other punctuation, including an end-of-sentence period (resulting in four periods). Use four only when the words on either side of the ellipsis make full sentences. You should <strong>never use fewer than three nor more than four periods</strong>, with only a single exception: when entire lines of poetry are omitted in a block quotation, it's a common practice to replace them with a full line of spaced periods</em> [emphasis added].</p>
