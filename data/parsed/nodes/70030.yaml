    html: |-
      <p>The interrobang is a ligature replacement for ?!, and probably equally unused, but people don't seem to have much trouble calling that a ligature or accepting its existence in unicode at least. Just because it's not in use now, doesn't mean it hasn't been in use in the past, and I am interested in finding out to what degree it was used. Making a judgement call on whether there is 'a point' to some ligature is a bit silly. There's no point to the ffi ligature other than the aesthetic "it looks good" and the practical "it saves lead and ink". The same would go for an ellipsis paired with interpunction that has a dot at its base. It might look better, or it might save ink, and the moment either one of those is considered valid, there's your point.</p>
      <p>Just to demonstrate that a point is trivially attributed: let's say someone is doing a poster design for a play with the title "Did you hear what she... ?" and decides that for stylistic purposes it would be quite nice to make use of the vertical space above the ellipsis by contracting the ellipsis and questionmark and reshaping the questionmark curve so that it overlaps most of the space above the ellipsis. That is now a ligature. This is how they come about.</p>
      <p>None of the historical ligatures come from committees deciding to combine letters, they were invented by typesetters and writers (and in some cases, those writers influenced other writers, who in turn ended up influencing the entire written language). If one can think of a ligature that looks good, voila, one may be born. Just because you could approximate it doesn't mean there will never be a point to a "real" one; that's up to the minds of the people who actually use them.</p>
      <p>But, we all digress, as that wasn't the point of this thread - it was primarily about getting pointers on where to look in order to find some kind of history of ellipsis ligatures, or at least a discussion of the use of "..?" and "..!" (or as texnic points out for Russian, "?.." and "!..")</p>
      <p>So please, no more replies in the form of "it's a silly ligature" or "why would you use it", that is irrelevant. Does anyone know of a documented history of this stylistic choice?</p>
