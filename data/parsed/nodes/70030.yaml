    date_raw: 7 May 2010 — 6:31pm
    votes: null
    html: <p>Most of the time, I make the ellipsis dots the same size as the full stop (period). In display types, I might make them slightly smaller, and also more tightly spaced. In text type, I prefer quite loose spacing of ellipsis dots, since if they are too tight they look like a grey line. I set the left sidebearing to be the same as that of the period, and I set the right sidebearing so that a period after the ellipsis is the same distance from the third dot as the ellipsis dots are from each other.</p>
