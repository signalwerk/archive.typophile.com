    html: <p>The interesting question is how to design the ellipsis glyph. Should the dots be the same size as the period? No less an authority than Matthew Carter sometimes makes them the same, sometimes different. What's the ideal? How should they be spaced, and conceivably kerned, in relation to the period? If you are doing a four-dot ellipse (i.e. an end-of-sentence ellipse) then is it desirable that the dots of the ellipse be different from the dots of the period?</p>
