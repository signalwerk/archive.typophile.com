    <p>I realised a few days ago I know nothing about ligatures involving ellipses - things such as "What did she ..?" or "I said, get your filthy ..!". I couldn't find any useful information from the general internets, and it's certainly not a kind of ligature ever considered for inclusion into the unicode standard. I also couldn't find a thread in the forums here concerning this type of ligature, so my question really is: who has thought about these?</p>
    <p>Has anyone ever seen a discussion of this ligature in a book or on the internet? I'd love to know what history it has.</p>
    <p>- Mike "Pomax" Kamermans<br>
    nihongoresources.com</p>
