      <p>Given that a ligature is simply defined as being a combination of two or more characters contracted (or of course, legated) into a single character, it's not that odd a question. However, more importantly, note that the CMoS is concerned with proper North American practices, which has very little to do with the historical use of a character throughout the ages.</p>
      <p>Several British people I've asked about this noted that they would use "..?" rather than a full ellipsis and then a question mark, so a natural conclusion is that that practice has to have come from somewhere, and this makes it an interesting topic.</p>
      <p>Given that the ellipsis has been around for many centuries, printers and authors throughout the ages must have at some point or another decided -even if merely as experiment to save ink- to legate the ellipsis with the dot in the question and exclamation mark.</p>
      <p>I would like to know how (not) widespread that became and have no idea where to start looking, so hopefully people on this forum have some ideas on where to start.</p>
