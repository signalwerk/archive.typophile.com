      <p>for some reason, I haven't been able to get on all day today (was typophile down or was it just me?)</p>
      <p>Anyway... WOW! I had no idea there were so many options out there. Here's the rundown (my opinion only)</p>
      <ul>
      <li>Escrow - Not quite curly enough (old looking)</li>
      <li>Precosia - Very nice, might be a bit hard to read at smaller<br>
      	sizes, lightbox material</li>
      <li>American West - Close, but a bit too cliche western looking</li>
      <li>Maverick's Luck - Close, add that one to the lightbox</li>
      <li>Kilkenny - might be a bit too light</li>
      <li>Missionary - I couldn't have asked for a more exact font for what<br>
      	I asked, but it's too thin, too</li>
      <li>Calliope - getting really close here, add this one to the<br>
      	lightbox too</li>
      <li>Eccentric - I didn't even think of something like that, could<br>
      	work</li>
      <li>Berolina - Again, a direction I didn't even think of, I love this<br>
      	board!</li>
      <li>Cafe Corina - VERY CLOSE! In fact, I plugged away in that site a<br>
      	bit, Billhead and Tyler are almost perfect. Added all three to the lightbox</li>
      </ul>
      <p>Okay, I just got some further direction. The logo type will read "Neverthelesser" and it is to be a short animated film set in 1906 San Francisco on the day of the big quake. I think we have the typefaces here to work with, does anyone have any suggestions as to how to maybe mix &amp; match them to make an interesting logotype for a short animated film?</p>
      <p>I would love you thoughts and thank you so very much for these suggestions. Huh, education can be fun! I guess my teachers were right all along. Who'd a thought?</p>
