      <p>Some loosely similars for the numbers: <a class="freelinking external" href="http://www.myfonts.com/fonts/hollandfonts/pacific-sans/" rel="nofollow">Pacific Sans</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/lanston/ltc-obelysk-grotesk/" rel="nofollow">Obelysk</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/fontbureau/empire/" rel="nofollow">Empire</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/castletype/radiant-extra-condensed-ct/" rel="nofollow">Radiant Extra Condensed</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/jnlevine/bayview/" rel="nofollow">Bayview</a> and <a class="freelinking external" href="http://www.losttype.com/font/?name=vevey" rel="nofollow">Vevey</a> (free)<br>
      And some in the same vein for "AM FM" (slanting and/or emboldening needed): <a class="freelinking external" href="http://www.myfonts.com/fonts/chank/liquorstore/" rel="nofollow">Liquorstore</a>, <a class="freelinking external" href="http://www.losttype.com/font/?name=outage" rel="nofollow">Outage</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/jnlevine/entitled/" rel="nofollow">Entitled</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/jnlevine/flatbush-beanery/" rel="nofollow">Flatbush Beanery</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/jnlevine/handmade-gothic/" rel="nofollow">Handmade Gothic</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/jnlevine/meal-ticket/" rel="nofollow">Meal Ticket</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/fw-identikal/kanal/" rel="nofollow">Kanal</a></p>
