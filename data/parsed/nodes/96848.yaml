    <p>Hi, I'm looking for an ID of both fonts used on this image of an old radio dial. Both the font that the numbers are in, and also the 'am' 'fm' font. Or just something very close would be great.</p>
    <p>Thanks!</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/stock-photo-vintage-radio-dial-74805742_6521.jpg"></div><p></p>
