      <p>For "AM/FM" you can try <strong><a class="freelinking external" href="http://www.findmyfont.com/index.php/fonts/font-preview?fset=T-26&amp;ffam=CorpusGothicAlternative%20-%20Italic&amp;fid=4411bfd0747b1ca4cef2477e0d96a7cf&amp;fsize=72&amp;text=AM%20FM&amp;wrap=2" rel="nofollow">Corpus Gothic Alternative (Italic)</a></strong> by T-26</p>
      <p>for the numbers, the best I can find is <strong><a class="freelinking external" href="http://www.p22.com/lanston/obelysk.html" rel="nofollow">Obelysk Grotesk</a></strong> by P22, but I don't know if this is close enough for you</p>
      <p>-----------------------------------------------<br>
      I found them using Find my Font - <a href="http://www.findmyfont.com" title="http://www.findmyfont.com">http://www.findmyfont.com</a></p>
