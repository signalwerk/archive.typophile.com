    <p>I've been working off and on on the next installment of my Aviano Series. This is Aviano Flare. It is an extended semi sans. The intent is eyecatching elegance with a bit more swash and brush influence than most semi-sans faces. I welcome all constructive comments on the design. Any thoughts on the name? Thanks!</p>
