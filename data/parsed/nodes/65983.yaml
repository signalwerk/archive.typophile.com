      <p>I'm enjoying watching this family grow! You have some interesting ideas with this family. I love stressed sanses, especially really thin ones like you've developed here, and even more so with the modulated arms like on E.</p>
      <p>Ok, remember the salt...</p>
      <p>My first reaction is quite strongly against the head serif on the A. Being thinner than the hairline strokes it looks very weak and almost accidental. I can see your plan but I think my inclination would be to cut it completely, though it may work if you make it more chunky, or shorten it.</p>
      <p>In the same way, the taper on the R looks too tight and IMO would look better ending at about the same weight as the other hairlines. I think the current terminal would work well at really huge sizes, but then the other strokes could do with being finer.</p>
      <p>The right side of B looks a little heavy or bumpy on the thin weight.</p>
