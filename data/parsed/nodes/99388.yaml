      <p>I'm sure you've found that there was a Joel Kaden, born Feb 12, 1914, SSN issued in New York State, who died in Orlando, FL on July 12, 2003.  </p>
      <p>Some of the genealogy sites (most with 3 days to two weeks free one-time trial access) indicate that they have more information. At least one site indicated that there was an obituary in the Orlando Sentinel, but at the newspaper's site I did a search for the name with a date range of all of 2003 and it found nothing.</p>
