    html: <p>there are some great articles on typography on microsoft's website. one that i thought would be applicable to your question is titled "Character Design Standards" (<a href="http://www.microsoft.com/typography/developers/fdsspec/default.htm" target="_blank">http://www.microsoft.com/typography/developers/fdsspec/default.htm</a>) and gives some good information on the design of latin characters. hope you find this helpful</p>
