    html: <p>When you look at Microsoft and Adobe fonts, please look at recent ones. That is, *not* Adobe Garamond Pro, Arial or Verdana. You can look at Frutiger Linotype (that is free and comes with Microsoft Reader) or Brioso Pro (best as reference for glyph naming and encoding).  <br>Adam</p>
