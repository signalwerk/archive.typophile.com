  html: |-
    <p>I'm working on a website for a client that wants to offer various media options with articles in the way newspaper websites often do.</p>
    <p>Is there a single font that offers these options as a coherent set:<br>
    - smaller and larger text size options<br>
    - email option (typically an envelope icon)<br>
    - print option (typically a wee printer icon)<br>
    - video camera icon<br>
    - audio (typically a little speaker with waves)</p>
    <p>(If not, somebody should. I suspect people are nicking these from each other all over the web.)</p>
