    html: <p>Sorry, Steve - broken link fixed!  <br> <br>I'm not very good at the name game. As K-Type's Anna was designed for my daughter I didn't have much alternative, I just assumed ITC Anna was trademarked 'ITC Anna' - I'll await the lawsuit! <br> <br>My overly scant research was also picked up on by Vincent Connare when I made Lexia Readable, based on the legible shapes and spacing of Comic Sans but removing the kids comic book style. Vincent noted that Dalton Maag already had a Lexia and suggested 'Our Kid'. I proposed 'Comic Sons'. I'm expecting the summons any day now. <br> <br>I'm hoping that major players such as ITC and Dalton Maag are busy enough and won't feel threatened by a little foundry accidentally treading on big toes. Anyway, isn't the duplicate naming of fonts something of a typographic tradition? Probably not, eh?</p>
