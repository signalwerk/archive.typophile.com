 because Solus is conceived as essentially a mechanistic type -- a 'light Egyptian'." <br> <br>Even so, I have decided to allow myself to be guided by my observations. Some Egyptians do possess curved brackets, moreover Solus has a warmth compared to Joanna that is augmented by the subtle bracketing visible on the printed copy. <br> <br>In September, I contacted Robin Nicholas, Head of Typography at Agfa Monotype, and although he didn't invite me round for a coffee and a detailed look at Gill's original drawings, he did recommend Gill's 1926 sketchbook,  'A Book of Alphabets for Douglas Cleverdon', as showing the origin of Solus, and I immediately ordered a copy from Amazon. <br> <br>He also noted, " I understand that there may be a legal problem using the name </p>
