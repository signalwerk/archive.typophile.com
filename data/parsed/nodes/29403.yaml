    <p>As part of my professional practice module I have to get in touch with freelance designers (especially typographers) and ask them a series of simple questions in the aim of it benifiting from their knowledge and enhancing my studies.  If anyone could help me on this I would really appreciate it.  I hopefully won't take up too much of your time and the questions won't be too hard lol</p>
    <p>My e-mail is <a href="mailto:hayleybranston@yahoo.co.uk">hayleybranston@yahoo.co.uk</a> I would be grateful for any help. If you get in touch I have a word document with a few questions etc.</p>
    <p>If you don’t want to get in touch but fancy helping a few of the questions are:</p>
    <p>Question 1: Apart from being a good designer what other skills do you think a good freelancers needs to have?</p>
    <p>Question 2: What is the one piece of advice you would give to a graduate wanting to become a freelancer?</p>
    <p>Question 3: Would you advise working for free when starting out?</p>
    <p>Question 4: After graduating how long did it take you to get regular work?</p>
    <p>Question 5: What do you think is the best way to network?</p>
    <p>Thanks</p>
