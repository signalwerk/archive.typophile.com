      <ol>
      <li>The more, the better. Marketing, especially branding, can be very useful if you're working with corporate identities and such. Programming, or at least the basics of it, will help you if you need to do any kind of web design (or even typeface design, these days). But the most important is certainly communication skills: being able to listen to your client, find out what they really need or want (which is not always what they <em>say</em> they want), and explain to them why this might work better than that etc.</li>
      <li>Concentrate on finding yourself <em>one</em> client, no matter how small. Do the job well done and you'll have another, then another...</li>
      <li>Well, you don't need to worry about working for free: when you first start you'll probably be working for almost nothing anyway... ;-)</li>
      <li>Graphic Design is my third career, so I'll pass on this one.</li>
      <li>Become involved in some sort of organization, offer to help (for instance, I suppose you could offer to be a moderator on this board).</li>
      </ol>
