      <p>Question 1: a) good interpersonal skills as you will need to deal directly with clients that change their mind all the time (I don't think there's any way to prevent this, if there is please someone let me know...). Basically: a lot of patience!<br>
      b) Good organisational skills: a methodical approach that allows you to respect deadlines and deal with administration and financial stuff yourself.<br>
      c) obviously good marketing skills (but I think this is included in "being a good designer"!</p>
      <p>Question 2: Freelance straight after graduation is not a great idea. This is something you do when you are a little bit more experienced and "streetwise". If you do it, make sure you have some kind of support and that you're not completely on your own. </p>
      <p>Question 3: Unless it's for charity or for a cause you support I don't see any reason for doing it. I guess it's ok if the job you do for free gives you exposure or any other benefit (awards, etc.) </p>
      <p>Question 4: Usually it also depends on <cite>how</cite> you graduate. Degree show, D&amp;AD New Blood etc. can do great things for you. Difficult to say because I was working as designer before I decided to get a degree (shame on me...) but I guess I could do little jobs immediately after graduating and I was never short of things to do (but that included copywriting,etc.) I'm still waiting for the big jobs though!</p>
      <p>Question 5: I guess it depends on where you are (also for the points above) and what kind of person you are (which are your interests, etc.). Always keep a  business card in your pocket, attend conferences etc. just in case...</p>
