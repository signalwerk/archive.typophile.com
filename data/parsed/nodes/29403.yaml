    html: |-
      <p>1. The ability to help clients from the ground up by clarifying their message before design starts. I freelance in nonprofit precisely because my clients are open to basic communications planning with me.<br>
      2. You never start as a freelancer; start with a studio that gives you access to a nice mix of clients who will follow you later. Or, like me, work in-house for a good nonprofit and then use that background to spin off. Staff first, freelance later.<br>
      3. You only intern for free while in school, never after. Avoid the plentiful free-for-exposure come-ons; they're all BS.<br>
      4. You canvas the market while training, so you're ready to pounce and get the job right after. Sometimes your design teachers will hire or refer you to those hiring.<br>
      5. Any way you can meet potential clients face to face will serve the networking goal. How depends on your location and the market.</p>
