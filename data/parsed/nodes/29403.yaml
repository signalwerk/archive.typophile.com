      <p>My answers to these questions:</p>
      <p>1. Marketing, the ability to sell and brand yourself.</p>
      <p>2. Check the market first. I know a lot more experienced designers who are able to freelance, than ones fresh out of design school. Freelancing  for a living seems to be harder to do these days.</p>
      <p>3. Yes and No. Yes if you (or your parents) can afford it, no if you can't. Personally, I think unpaid internships are a travesty and should be extinct. What they say is "we only want people who come from a certain tax bracket" or "your work is so valued that you deserve to NOT be paid." In competitive cities like New York and San Francisco, unpaid internships are not feasible for independently funded individuals considering the high cost of living. Only while you're in college.</p>
      <p>4. 10 months</p>
      <p>5. Being yourself. I've been to enough AIGA events to see the numerous smarmy, sleazy design hipsters who don't give a flying **** about anything the person they're talking to is saying...just their name and clout. While I believe it is "who you know," who you know should not be relegated to a select list of buzzworthy names you can drop in conversation. Who you know could be the guy you used to sit next to in Color Theory class who just started his own company. Take NO ONE for granted, there's something special or interesting about EVERYONE.</p>
