      <p>Hello Hayley,<br>
      It is nice to meet a fellow deviant here. :-) I will do my best to answere your questions. </p>
      <p>Question 1: Apart from being a good designer what other skills do you<br>
      think a good freelancers needs to have?</p>
      <p>answer: Your client will not pay you because how skilled you are, He will pay you only because you can do the job. Based on that fact I would say you have to be able to know what your client need exactly. </p>
      <p>Question 2: What is the one piece of advice you would give to a graduate wanting to become a freelancer?</p>
      <p>answer: Make a long term plan, like what will you be within 5 years. Know what kind of client you can work for, and what type of design are you going to provide ( web/ print/ illustrations ) - because one of my problems at my start that I first went to wrong clients. Have also your own website and learn how to show your portoflio over there.</p>
      <p>Question 3: Would you advise working for free when starting out?</p>
      <p>answer: It can be happen; to build a portoflio. </p>
      <p>Question 4: After graduating how long did it take you to get regular work?<br>
      answer: few months. It was very hard perioud of my life.</p>
      <p>Question 5: What do you think is the best way to network?</p>
      <p>answer: If you know the kind of client you prefer to work with, you ofcours know how to find them. It is important to put your self in their place: How do you want your designer to deal with you. </p>
      <p>And above all I have to say the end of freelancing story will be when you make your own office, so start to design your logotype now :-)</p>
      <p>Ahmad Shawkash</p>
