      <p><em>Question 1: Apart from being a good designer what other skills do you think a good freelancers needs to have?</em> Solid knowledge of media production (whether print or web), you can't rely on clients all the time.<br>
      <em>Question 2: What is the one piece of advice you would give to a graduate wanting to become a freelancer?</em> Get an accountant, maybe join a collective, having somebody to bounce ideas off is sometimes helpful.<br>
      <em>Question 3: Would you advise working for free when starting out?</em> Never when starting out, pro-bono later in your career can be worthwhile, you should also think hard before doing free pitch work.<br>
      <em>Question 4: After graduating how long did it take you to get regular work?</em> 2 months holiday then to the grindstone.<br>
      <em>Question 5: What do you think is the best way to network?</em> Network with fellow designers or with potential clients/employers? Fellow designers can have information about vacancies and opportunities.</p>
      <p>Tim</p>
