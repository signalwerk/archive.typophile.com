      <p>I was going to answer point by point but I think Terry covered it pretty well.</p>
      <p>Freelancing is tough even if you have a solid portfolio and lots of contacts. I'm not sure it's a great idea for someone fresh out of school. My advice is to get a job that isn't going to bust your balls and try to build up a freelance clientele on the side so that in a few years when you are ready to strike out on your own you already have the connections to hit the ground running.</p>
