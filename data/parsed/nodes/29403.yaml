      <p>Hi Hayley. </p>
      <p>There are some very good answers here already. I think you can gather a consensus of opinion about the value of working for free, and/or doing internships. As someone who recently organised a graduate internship, I think it's fair to say that payment issues need to be addressed at the outset.</p>
      <p>What are your other (remaining) questions? For the five you posted, here's my tuppence worth;</p>
      <p><em>Question 1: Apart from being a good designer what other skills do you think a good freelancers needs to have?</em> Sense of humour. Communication skills*.</p>
      <p><em>Question 2: What is the one piece of advice you would give to a graduate wanting to become a freelancer?</em> Don't do it. Work for someone else first.</p>
      <p><em>Question 3: Would you advise working for free when starting out?</em> Freebies are for family and friends only. </p>
      <p><em>Question 4: After graduating how long did it take you to get regular work?</em> 2 months holiday then straight to work. It wasn't a graphic design job – it was the first job I could find.</p>
      <p><em>Question 5: What do you think is the best way to network?</em>By doing this assignment on a face-to-face basis rather than online. </p>
      <p>*In fact, I'd go so far as to say that the assignment question is designed to force you to network and practise some peer-to-peer communication; typophile and deviantart are great, but they're not appropriate for what the question requires... so pick up your phone directory and start speaking to local designers.</p>
