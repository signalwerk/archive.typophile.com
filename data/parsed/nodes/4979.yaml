  html: "<p>============================================================ <br>LinoLetter 05/04 - Avenir Next, the redesigned font classic                  <br>============================================================ <br> <br>! Welcome to the fifth issue of the LinoLetter in 2004 ! <br> <br>INTRODUCTION: <br>Although Adrian Frutiger has created many famous typefaces, <br>such as Univers or Frutiger, another matter has remained <br>very close to his heart - the perfection of his linear <br>sans serif, Avenir. Together with Akira Kobayashi, Linotype <br>Library's Type Director, Adrian Frutiger has completely  <br>reworked the Avenir type family. The result is Avenir Next, <br>which contains six harmonious weight increments - from  <br>light to heavy - along with matching italic and condensed <br>styles. <br> <br>The second topic in this edition of the LinoLetter is an <br>explanation of our so-called CE-Fonts. These fonts are  <br>necessary for the setting of Eastern European languages, <br>which are more important than ever due to the EU's recent <br>expansion. <br> <br>We all know that it can be difficult to create design that <br>appeals to the younger generations. In order to narrow the <br>generation gap, we have created a pre-summer package with <br>five comic-style fonts. Like all of our packages, we are <br>offering this one for an unbeatable price.  <br> <br>Last but not least, we would like to re-introduce a gem of <br>a typeface that was designed by Alan A. Blackman, Galahad. <br>Galahad is the perfect type choice for any project that <br>requires a medieval feel. <br> <br>Have fonts of fun! <br> <br> <br> <br>------------------------------------------------------------ <br> <br>IN THIS ISSUE:  <br> <br>1.  AVENIR NEXT: Adrian Frutiger's famous Avenir type <br>    family, completely reworked. <br> <br>2.  Linotype CE FONTS: Fonts for today's European Union. <br> <br>3.  Five whimsical COMIC FONTS for only EUR 6 each. <br> <br>4.  GALAHAD by Alan A. Blackman: Unusual font design <br>    with a medieval feel. <br> <br> <br>____________________________________________________________ <br> <br>1.  AVENIR NEXT: Adrian Frutiger's famous Avenir type <br>    family, completely reworked. <br>____________________________________________________________  <br> <br>Adrian Frutiger has completely reworked the Avenir type  <br>family in close cooperation with Akira Kobayashi, Type  <br>Director at Linotype Library. The result is Avenir Next,  <br>which contains six harmonious weight increments - from  <br>light to heavy - along with matching italic and condensed <br>styles. <br> <br>Improving on the 1988 Avenir, Avenir Next offers the optimal <br>balance of harmony and contrast necessary in a type family. <br>With the addition of the condensed styles, Avenir Next joins <br>the ranks of full-fledged contemporary sans serifs, <br>providing professional graphic designers with the greatest <br>degree of typographic flexibility and optimal legibility. <br> <br>Avenir Next is part of the Linotype Platinum Collection and <br>comes in four typeface sets, Regular, Italic, Condensed and <br>Condensed Italic, each equipped with 6 different stem <br>weights - light, regular, medium, demi, bold, and heavy. <br>All 24 styles include true small caps and old style figures. <br> <br>Download the entire Avenir Next Family as single fonts, or <br>have them shipped to you on CD: <br><a href=\"http://www.linotype.com/6-2090-6/avenirnext.html\" target=\"_blank\">http://www.linotype.com/6-2090-6/avenirnext.html</a> <br> <br> <br>____________________________________________________________ <br> <br>2.  Linotype CE FONTS: Fonts for today's European Union. <br>____________________________________________________________ <br> <br>Fonts which have the 'CE' extension in their names provide <br>support for the many different Central &amp; Eastern European <br>languages. These fonts contain a special Central European <br>Character set, complete with all necessary accents and <br>diacritic marks. <br> <br>For more information, please view our detailed CE font <br>documentation: <br><a href=\"http://www.linotype.com/9-42-9-16808/centraleuropeanmacandpc.html\" target=\"_blank\">http://www.linotype.com/9-42-9-16808/centraleuropeanmacandpc.html</a> <br> <br>Check out our Keyword search to locate Linotype's Central <br>European fonts (available CE font styles are buried within <br>larger font families - please click on a family name in <br>order to reach the CE styles): <br><a href=\"http://www.linotype.com/keyword-central_european.html\" target=\"_blank\">http://www.linotype.com/keyword-central_european.html</a> <br> <br> <br>____________________________________________________________ <br> <br>3.  Five whimsical COMIC FONTS for only EUR 6 each. <br>____________________________________________________________ <br> <br>Fonts for Kids, which display a special playfulness and <br>extraordinary character, are becoming more and more adored. <br>Linotype is swallowing the difference to offer a special <br>collection for the beginning of the summer. This collection <br>features five comic-style fonts - a Comic Value Pack, if you <br>will. Four of these fonts are handwriting style offerings; <br>the last is a special Pi font - Linotype Maenneken. <br>Together, these faces can explain any story. A fabulous deal <br>for only EUR 29,50 (EUR 6 per font)! <br> <br>Add new life to your font collection by grabbing our Comic <br>Value Pack: <br><a href=\"http://www.linotype.com/6-2108-6/comicvaluepack.html\" target=\"_blank\">http://www.linotype.com/6-2108-6/comicvaluepack.html</a> <br> <br>Take a look at our list of more great comic fonts: <br><a href=\"http://www.linotype.com/52794/usage-comics.html\" target=\"_blank\">http://www.linotype.com/52794/usage-comics.html</a> <br> <br> <br>____________________________________________________________ <br> <br>4.  GALAHAD by Alan A. Blackman: Unusual font design <br>    with a medieval feel. <br>____________________________________________________________ <br> <br>Galahad, designed by well-known San Franciscan calligrapher <br>Alan A. Blackman, represents one of his signature styles. <br>The name comes from Sir Galahad, son of Sir Lancelot and  <br>knight of the Round Table at King Arthur's court. As a sans <br>serif font with a calligraphic flair, it is mainly for <br>display use. However, because of its geometrically open  <br>forms, shorter texts at smaller point sizes may be set with <br>it as well. <br> <br>Check it out here: <br><a href=\"http://www.linotype.com/13202/galahad-doc.html\" target=\"_blank\">http://www.linotype.com/13202/galahad-doc.html</a> <br> <br> <br> <br>************************************************************ <br> <br>We hope you found this issue of the LinoLetter informative <br>and useful. We highly appreciate your feedback at <br><a href=\"mailto:info@linotype.com\">info@linotype.com</a>, <br>your Linotype Library Online Team <br> <br>------------------------------------------------------------ <br>Publisher: <br>Linotype Library GmbH <br>A division of the Heidelberg-Group <br>Du-Pont-Stra</p>"
