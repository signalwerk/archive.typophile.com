    html: "<p>Niiice. <br> <br>In the lc the only things I might change are the beaks of \"f\" and \"r\": make the former's stronger, and try shearing both of them vertically. <br> <br>In the UC, the \"E\" and \"F\" should be narrower, and the \"L\" seems too dark. <br> <br>And in the numerals, the \"8\" isn't working. <br> <br>I like the \"&amp;\"! <br> <br>Spacing: maybe a little tighter overall, and a hair more blank space. <br> <br>hhp <br></p>"
