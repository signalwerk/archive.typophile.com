    date: 2004-07-02T15:55:00
    votes: null
    html: <p>Hi, Tobias. <br> <br>I like your typeface, but I'm not too sure about the lowercase <b>f</b>; I thought it was a <b>t</b>, at first... I notice now that you've done something similar with the descenders of <b>g</b> and <b>y</b> (is that the confusion you mention?)... Although the <b>y</b> looks like a <b>y</b>, the <b>g</b> *could* be confused with an <b>a</b>, I think... <br> <br>You may want to try extending the <b>f</b>'s ascender and the descenders of <b>g</b> and <b>y</b>... it doesn't have to be a lot -- try making a few different versions of the <b>f</b>, for example, with varying lengths of ascender, and let your eye decide which works best. (This is a method I learned from <a href="http://briem.ismennt.is/">Briem's website</a>, and it has been of great help to me.) <br> <br>Best wishes!</p>
