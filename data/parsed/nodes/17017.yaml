    <p>Blessings of the Masses<br>
    +<br>
    Blessings of the State<br>
    _______________________<br>
    _______________________</p>
    <p>with humility in heart and typography in mind.<br>
    time and time again i return to typophile seeking<br>
    the collective wisdom and knowledge which i’ve<br>
    come know and depend upon.</p>
    <p>_____________________________</p>
    <p>i have for your consideration two typographic compositions .<br>
    both from japanese publications . i’ve just returned from work in tokyo<br>
    and it never ceases to amaze me how much good Roman/Latin Character<br>
    typography i see in a land built from kanji.</p>
    <p>the first image is from a japanese magazine . DUNE . </p>
    <p>the titling typeface is familiar . bringing to mind thoughts of NOFRET . FIRENZE . CALIFORNIAN .</p>
    <p>it is however distinct . CAN ANYONE NAME THIS . POSITIVELY ? ? ? ?</p>
    <p>_______________________________</p>
    <p>the second image is from a new NTT DOCOMO campaign .<br>
    i believe the type is an illustration. but i wanted to show everyone<br>
    here . and ask if anyone could recommend a similar style san-serif,<br>
    with angular finishes + details . </p>
    <p>+<br>
    +<br>
    +</p>
    <p>my sincerest sentiments  &amp; well wishes for a powerful 2006 .</p>
    <p>+<br>
    +<br>
    +</p>
    <p>hold me down . holy .</p>
    <p>Aerosyn-Lex Mestrovic .</p>
