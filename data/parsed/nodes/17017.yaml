      <p>The sample of Andrich Minerva came from a photo display type catalog from around 1980. The font was published by VGC. It was one of the winners of a type design contest they held in 1965. I suspect your sample is pre-digital.</p>
      <p>As for similar fonts, it reminds me of <a href="http://www.fontshop.com/?fuseaction=catalog.fontpackage&amp;searchby=manufacturer&amp;displayfontid=ITC.119123.0.0">ITC Century Light</a> and <a href="http://www.fontshop.com/?fuseaction=catalog.fontpackage&amp;searchby=manufacturer&amp;displayfontid=EF.929.0.0">ITC Modern 216 Light</a>.</p>
