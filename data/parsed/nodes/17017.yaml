    html: |-
      <p>A digital version of Andrich Minerva was released by <a href="/wiki/Image%252BClub" class="wiki">Image Club</a> in 1989 and subsequently revised several times during the early 90s. The face was discontinued for quality and consistency reasons in 1998 when Image Club was still part of <a href="/wiki/Adobe" class="wiki">Adobe</a>.</p>
      <p>Since it was discontinued and Agfa not longer distributes the family as part of <a href="http://www.fonts.com/findfonts/searchresults.htm?st=5&amp;cid=Image+Club">the current Image Club library</a>, the only place that Andrich Minerva is still available is on an old copy of the Image Club LetterPress disc. I believe I still have a couple of lightly-used copies of this disc, if you are interested in obtaining one.</p>
      <p>Here are a couple of samples set in Image Club’s Andrich Minerva using the text from your image. As you can see, the cap ’R’ is different and the kerning is fairly ugly.</p>
      <p></p><div class="imageWrap"><img src="/files/andrich1.gif"></div><br>
      <div class="imageWrap"><img src="/files/andrich2.gif"></div><p></p>
