  html: <p>The crossbar is a horizontal <a href="/node/add/wiki?edit%5Btitle%5D=stroke" title="Create node &quot;stroke&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">stroke</a> which connects the two sides of a <a href="/node/40396" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">letterform</a> as seen in the <a href="/node/14188" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Majuscule</a> “A”, “H”, and the <a href="/node/add/wiki?edit%5Btitle%5D=miniscule" title="Create node &quot;miniscule&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">miniscule</a> “e”, or a bisecting stroke as seen in the “F” and&nbsp;“t”.</p>
