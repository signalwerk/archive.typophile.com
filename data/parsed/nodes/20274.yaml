  html: <p>The crossbar is a horizontal <a href="/wiki/stroke" class="freelinking" rel="nofollow">stroke</a> which connects the two sides of a <a href="/wiki/letterform" class="freelinking" rel="nofollow">letterform</a> as seen in the <a href="/wiki/majuscule" class="freelinking" rel="nofollow">majuscule</a> "A", "H", and the <a href="/wiki/miniscule" class="freelinking" rel="nofollow">miniscule</a> "e", or a bisecting stroke as seen in the "F" and "t".</p>
  html_clean: <p>The crossbar is a horizontal <a href="/wiki/stroke" class="freelinking" rel="nofollow">stroke</a> which connects the two sides of a <a href="/wiki/letterform" class="freelinking" rel="nofollow">letterform</a> as seen in the <a href="/wiki/majuscule" class="freelinking" rel="nofollow">majuscule</a> "A", "H", and the <a href="/wiki/miniscule" class="freelinking" rel="nofollow">miniscule</a> "e", or a bisecting stroke as seen in the "F" and "t".</p>
