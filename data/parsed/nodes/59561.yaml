      <p>///////////////////////////////////////////////////////////</p>
    <p>SUDTIPOS. JULY 09. NEW RELEASE.</p>
    <p>///////////////////////////////////////////////////////////</p>
    <p>Hello everybody from a really cold Argentina. We are happy to announce the release of <strong><a href="http://www.veer.com/products/typedetail.aspx?image=UMT0000439#specimen">Theorem</a></strong>. Its a small breath from the scripts! </p>
    <p></p><div class="imageWrap"><img src="/files/typophiletheorem_6001.jpg"></div><p></p>
    <p>Theorem is an interesting change from the usual calligraphic work of Koziupa and Paul. An art deco font with a twist in its capitals, Theorem’s lowercase characters were designed to automatically achieve the best optical spacing in typesetting. To accomplish that goal, a variety of alternates were drawn for most letters, and plenty of vowel-focused ligatures were designed. The auto-magic of OpenType ties it all together to a make a very versatile typeface that is quite useful for packaging and many different applications of display typography.</p>
    <p>Have a nice month!</p>
    <p>///////////////////////////////////////////////////////////</p>
    <p><a href="http://www.sudtipos.com" title="www.sudtipos.com">www.sudtipos.com</a></p>
