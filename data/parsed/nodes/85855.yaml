      <p>The only thing I don't really like about it is the face that the letters aren't symmetrical. There is a pointier side. You can see it very clearly on the o, but that stylistically is there on all the letters. I have tried copy and pasting the softer edges onto the letters using paint, and I like it better. However, me doing that on paint is not very professional-looking. </p>
      <p>Additionally, I just wonder if there are other styles I would like if I were exposed to them. Maybe letters that were wider, or with flat edges, or something.</p>
      <p>Regardless, I like this font. But it isn't perfect. </p>
      <p>In terms of adjusting it myself... what would be a good program to use?</p>
