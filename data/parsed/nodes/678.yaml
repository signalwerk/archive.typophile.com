    html: "<p>Simon -- Thanks for the offer, really; but actually I have no desire to have PowerPoint on my system. No offense, I hope. <br> <br>Keith -- In restrospect, I agree, the quiz may have been a little obscure. What can I say? I'm an old fogey deep down inside -- (just ask Tiffany ;-) <br> <br>In my defense, I think only three of mine were truly obscure. Well, and that #16 was pretty challenging; I think we should have scored partial points on that one. <br> <br>We'll just have to see what Will and Allan come up with for next year. But you might want to start keeping copies of Lawson and Bringhurst on your nightstand for bedtime reading. ;-) <br> <br>-- K. <br></p>"
