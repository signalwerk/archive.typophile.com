    date: 2003-07-22T04:42:00
    date_raw: 22.Jul.2003 4.42am
    votes: null
    html: "<p>That's Will Powers, Stewf! He's our local typographic encyclopedia -- and much appreciated for it. <br> <br>I suck at these games, but they are quite fun to watch. Lots of groans and fun hints. My cropdusting of gray hairs was no help whatsoever. It's not an age thing: it's a matter of keeping lots of unrelated information available for output at the proper moment. It should also be obvious that a bit of knowledge of the local typo scene is needed. It's time to start studying up on the Bay Area! <br> <br>I managed to get only one right: <br> <br><i>18. Who is the man in this picture? </i> <br> <br>My answer: the one on the left! <br> <br></p>"
