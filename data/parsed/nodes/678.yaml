    <p>TypeCon 2003 Typographic Quiz  <br> <br><i>Questions presumably drafted by Kent Lew, last year's reigning champion. If any attendees have the missing images, please upload them!</i> <br> <br>Name: ____________________ (2 points) <br> <br>1. Name two of the typefaces used in the logo and/or the program for TypeCon 2003. <br> <br>2. Name four typefaces designed by Eric Gill. <br> <br>3. What was the first book face designed specifically for mechanical composition? <br>A. Imperial <br>B. Impressum <br>C. Imprint <br>D. Ionic <br> <br>4. Which typeface is used for the corporate identity of <a href="http://www.cingular.com/">Cingular</a>? <br> <br>5. Put these typefaces in order: <br>__ Avant Garde Gothic <br>__ Baskerville <br>__ Bodoni <br>__ Caslon <br>__ Century Schoolbook <br>__ Frutiger <br>__ Gill Sans <br> <br>6. What famous typeface designer also briefly publshed a cat fancier magazine? <br>A. Bill Dwiggins <br>B. Oz Cooper <br>C. Fred Goudy <br> <br>7. What typeface was used for the credits for <a href="http://www.fawny.org/autonominal/peignot-takethat.gif">The Mary Tyler Moore Show</a>? <br> <br>8. What typeface is this bison made from? <img src="http://www.typophile.com/forums/messages/30/13152.gif" alt="bison"> <br> <br>9. What was the title of the first book set in phototype? <br>A. Hiroshima <br>B. Station Wagon in Spain <br>C. The Wonderful World of Insects <br>D. The Incredible Journey <br> <br>10. What typeface is used for this famous typographic brand? (cue pic of Absolut Vodka) <br> <br>11. Which of the following foundries/type designers are based in Minnesota? <br>A. Altered Ego/Brian Sooy <br>B. Astigmatic One Eye/Brian Bonislawski <br>C. Atomic Media/Matthew Bardram <br>D. Chank Diesel <br>E. Font Diner/Stuart Sandler <br>F. Mark Simonson Studio <br>G. Process Type Foundry/Eric Olson <br>H. Type Quarry/Brian Willson <br> <br>12. Who is this typographer &amp; typeface designer? (pic not available, guess you had to be there) <br> <br>13. What are these tools used for? (pic not available) <br> <br>14. Name two typefaces by this important mid-western typeface designer. (pic not available) <br> <br>15. What is this piece of equipment called? (pic not available) <br> <br>16. Match the typeface with its designer: <br>A. Benton              1. Alisal <br>B. Blumenthal        2. Chaparral <br>C. Carter               3. Copperplate Gothic <br>D. Dwiggins          4. Emerson <br>E. Frutiger             5. Franklin Gothic <br>F. Goudy               6. Glypha <br>G. Hoefler             7. Melior <br>H. Ruzicka            8. Metro <br>I. Twombly           9. Primer <br>J. Zapf                 10. Requiem <br> <br>17. What was the first typeface designed by Hermann Zapf? <br>A. Gilgengart <br>B. Novalis <br>C. Optima <br>D. Palatino <br> <br>18. Who is the man in <a href="http://www.graphos.org/budss.jpg">this picture</a>? (or..hint..  Who designed Courier?) <br> <br>19. What is generally regarded as America's first great typeface? <br> <br>20. Where is the Hamilton Wood Type Foundry? <br> <br>21. What was the last original typeface designed specifically for casting in metal for the American Merganthaler Linotype Co.? <br>A. Olympian <br>B. Opticon <br>C. Orator <br>D. Oxford <br> <br>22. Who designed the typeface used on this Prince CD? <br><img src="http://www.typophile.com/forums/messages/30/13153.gif" alt="prince"> <br>A. Joshua Darden <br>B. Chank Diesel <br>C. Sibylle Hagmann <br>D. Eric Olson <br> <br>23. With what typeface designer is a p</p>
