    html: "<p>For the record: Allan and I accumulated questions over a period of a couple months, sending them to each other every now and then. In the end, they all wound up in Allan's lap and he was responsible for the final cut. (I just counted: twelve of the finals were mine.) He put together the PowerPoint presentation, which I reviewed and offered a few corrections and suggestions. Then I created the printed questionnaire form. We met for about ten minutes Friday night to coordinate the presentation. It was fun. <br> <br>I'd have to do screenshots from the PowerPoint presentation, which I still have a copy of. But I don't have PowerPoint (I reviewed the presentation on a client's system.) I'll see if I can come up with the images for you. <br> <br>-- K. <br></p>"
