    html: <p>Yes, the questions were easier last year (eg "Who designed Fontesque?). <br> <br>Funny thing is, the quiz was really quite balanced, but there is just so much UNDEAD in typography. I really noticed that driving thru Northern Minnesota, visiting OLD NAVY, retail America with retro scripts from House and Font Diner, and the conservative press with fonts from HTF and the Bureau. And the Book Center exhibit on Bruce Rogers, I mean, imagine going to a software conference and there's a party in the Turing museum. <br> <br>Stephen, is your hair starting to thin...? Perhaps you will do better next year. <br> <br></p>
