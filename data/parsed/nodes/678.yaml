    html: <p>I got 15. The top 5 takers scored 17-19. <br> <br>I feel this year's quiz was designed for the elderly grayhairs  <br>like Bill Powers and Dave Farey who won. Don't let Kent fool  <br>you, he's younger than his typographic knowledge indicates. <br> <br>BTW, question 35 was much more difficult as they presented <br>some of the designer's older, more obscure faces. <br> <br>Can we get Kent to upload the original pics?</p>
