      <p>I’d love to read a thesis that comes up with answers to the question ‘What do type design and typography do to a text?’<br>
      Probably that would have to cover a whole lot of semiotic and signologic stuff, combined with linguistic thoughts about the complex correlation of <em>signifiant</em> and <em>signifie</em>.<br>
      That’s a hard one, though.</p>
      <p>Regarding alphabet reform: it came to my mind that in addition to hrants examples, alphabet systems have been exchanged, e.g. in Turkey from arab to an extended latin alphabet, also in parts of Croatia and Bosnia from cyrillic to latin and vice versa. Another interesting point would be interrelationship between coexisting alphabet systems (in correlation to language) as in the Balkans.</p>
