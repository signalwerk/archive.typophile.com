    <p>I’ve just started my last year in school, and I’m about to embark on my thesis project. But I’m feeling a little lost. </p>
    <p>I am definitely interested in doing something typographic. Ultimately, I want to design a typeface and use it in a book. But I’m open to other things like posters and even a boardgame (I actually love designing boardgames).</p>
    <p>I’ve been looking into topics like attempts to reforming the English language through new alphabets (such as the <a href="http://www.omniglot.com/writing/ita.htm">initial teaching alphabet</a>, Benjamin Franklin’s <a href="http://www.omniglot.com/writing/franklin.htm">phonetic alphabet</a>, etc.). It’s interesting that all these reforms either failed or were scapped by their inventors.</p>
    <p>In any case, I still feel like I have no direction. The thesis program at school unfortunately doesn’t give students a lot of time to research before we propose a topic. </p>
    <p>Since I only discovered the wonderful world of type a couple of years ago and most of you are pros (a business-major friend of mine uses the term “type psychics”),  I wanted to start a discussion about interesting topics in typography that are worthy of exploration. </p>
    <p>Also, when you were in school, what did you do for your thesis? Was it an enjoyable experience? Or did you want to tear out your hair? Perhaps both?</p>
