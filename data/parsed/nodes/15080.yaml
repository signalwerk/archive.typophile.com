      <p>hrant,</p>
      <p>Sadly, I no longer have the ability to read Chinese. But I did explore the relationship between English typography and Chinese typography in a project last year. I only scratched at the surface of that topic, but I agree with you that there is more there that is worthy of further exploration. </p>
      <p>What did you have in mind? In my project, I covered about how the two languages vary in their construction of words, the existence of a “center line” as opposed to a baseline in Chinese (especially for vertical type), etc. Looking back at it now, it’s almost a “Stop Stealing Sheep” for Chinese typography.</p>
