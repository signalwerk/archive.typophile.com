      <p>You say “no longer”? If you had the ability when you were really young (like less than 8, preferably less than 4) then all it should take to wake it up is something on the level of a college Chinese course.</p>
      <p>Since so little has been done in the field of Latin-CJK “symbiosis” there should be a treasure-trove of angles to explore. One obvious project would be the creation of a Latin face subordinate to a classic Chinese font style - although the risk of kitsch is huge there. Or you could explore the role of notan in both scripts. In fact I have an idea concerning notan that I call “Yang-style” :-) which I’d however like to keep non-public for now…</p>
      <p>hhp</p>
