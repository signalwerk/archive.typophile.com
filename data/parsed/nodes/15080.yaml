      <p>You seem to have good interests, although it’s hard to<br>
      make a living off of such things <cite>after</cite> you graduate…  :-/</p>
      <p>&gt; all these reforms either failed or were scapped by their inventors.</p>
      <p>Mostly because of two factors:<br>
      1) Lack of central authority.<br>
      2) Expecting too much conscious learning effort.</p>
      <p>But actually there have been two notable successes in alphabet reform: the best one was the invention of Korean Hangul in the 15th century; and the other was the Carolingian standardization of the Latin script (a much milder case than Hangul though). And it’s very encouraging that Hangul -the only major “designed” script- is arguably the best writing on the planet. Sadly though, we don’t have a king…</p>
      <p>BTW, you could get a copy (maybe your college library can buy it) of Gunnar Swanson’s “Graphic Design and Reading” if you’d like to read my full Alphabet Reform essay.</p>
      <p>hhp</p>
