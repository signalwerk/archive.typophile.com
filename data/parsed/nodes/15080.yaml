      <p>Another under-explored topic I find highly interesting is the design and use of a “network” of visually compatible font styles to change “moods” in running text. I’m talking about taking the one-dimensional Roman/Italic system to much higher levels. I’ve tried to do that in the display realm with my Daam Entity*, but the real gold is in text.</p>
      <p>* <a href="http://themicrofoundry.com/s_latin.html">http://themicrofoundry.com/s_latin.html</a> (See the second column.)</p>
      <p>A third is ligatures, and how they can be elevated above a mere device for make things pretty/less_ugly.</p>
      <p>—</p>
      <p>Dana, do you read Chinese? Because the topic of Latin-Chinese<br>
      typographic relationships has yet to be properly addressed.</p>
      <p>hhp</p>
