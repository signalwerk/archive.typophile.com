      <p>I've been looking through some fonts in the previous FontBook, and Joe Treacy's <a href="http://www.treacyfaces.com/050806_TFHabitat_2c5a.html" rel="nofollow">'Habitat'</a> seems like a pretty good match for the letters in 'LIVERPOOL'. That font was designed in 1985, but who knows if it was based on anything older. [Note: you need to use the site's 'TRY' feature to see the range of weights for the font.]</p>
      <p>- Mike Yanega</p>
