    <p>The cast concrete plaque in the attached image is from an old overpass bridge over Highway 401 East of Toronto.<br>
    I'm curious to know if the name and numerals are from an actual typeface or is it lettering by the sculptor?</p>
    <p>There Used to be a 4 plaques like this, showing the street name, the year and the motto (VT INCEPIT FIDELIS SIC PERMANET) on every bridge over a 400 series highway in Ontario, so it would seem to make sense for it to be from a typeface.</p>
    <p>thanks,</p>
    <p>russ</p>
