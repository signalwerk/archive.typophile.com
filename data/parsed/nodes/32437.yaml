      <p>I think Lex's idea makes a lot of sense, although it also seems possible that the dies he suggested were based on an existing typeface. I notice the '7' is quite odd -- more like an upside-down 'L'.  I can't think of a typeface with that feature. This date was 1947. Are all the bridges of a similar age, and were the plaques made when the bridges were built, or added on later?</p>
      <p>Would you have any more samples of the lettering? For my purposes only the R and E in this sample are useful as key letters. I'd like to know what the C, G, J, K, M, U or W look like to have more to base an ID on.</p>
      <p>- Mike Yanega</p>
