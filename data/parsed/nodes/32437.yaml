      <p>I'd guess it's custom by the sculptor. If it's molded in concrete, there could have been a standard set of dies made up for the letters and numerals, but my guess is that each one would have been hand-carved from what appears to be sandstone.</p>
      <p> - Lex</p>
      <p>EDIT: Didn't read that it was concrete. I stand by my die hypothesis.</p>
