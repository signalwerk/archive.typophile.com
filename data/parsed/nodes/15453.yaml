      <p>The problem seems to be global. I have traded a couple of message with T Phinney on another thread in this section and he seems to recall the same thing happening with a type designer he knows using an HP; Thomas is pretty certain it’s the emulator. I gave things a go with the printer at work, using a PC, and found the same problems. Thomas would be better at explaining the problem he suspects than I.</p>
      <p>So, here’s a question (that perhaps requires another thread of its own?): Is there out there a $500 (or sub-) laser printer of reasonable quality, with 1200x resolution, that has native Adobe PS capability? That might allow reasonable quality for type testing (and some home-grown final production) without breaking the type designer’s bank.</p>
      <p>Barring that, has anyone tried to write their own (better) drivers for printers without native PS?</p>
