      <p>Everybody seems to agree that if you can go Xante - it's best. Most laser printers these days are inexpensive or expensive 600x600 1200x600 or 2400x600. There are some 1200x1200 too but usually there is a missing feature - real postscript instead of emulation of some kind. HP seems useless for our purposes unless ( is it true? ) you can just use a PDF format to get around the issue. Maybe even then.</p>
      <p>Assuming you want real Postscript not emulation &amp; 1200x1200dpi, don't care about color or duplexing &amp; cannot affort a Xante - here is what I have found as altrenates. Prices are suggested retail from the company sites not retailers actual prices. </p>
      <p>--------<br>
      Xerox Phaser 4500 ( PS3 &amp; true 1200x1200dpi )<br>
      25ppm</p>
      <p>4500 - $899.00 - usb only<br>
      4500n - $999.00 - with ethernet</p>
      <p>cost per page: 1.3 cents based 5% coverage<br>
      works with mac &amp; pc: yes</p>
      <p>--------<br>
      Oki: B6200 ( PS3 &amp; true 1200x1200dpi )<br>
      25ppm</p>
      <p>B6200 $524.99<br>
      B6200n $681.99 - with ethernet<br>
      cost per page: 2 cents<br>
      works with mac &amp; pc: yes</p>
      <p>--------<br>
      Minolta:  PagePro 9100 N ( PS3* &amp; true 1200x1200dpi )<br>
       35ppm</p>
      <p>PagePro 9100 N</p>
      <p>* I am still working on finding out if this or other minolta printers have real postcript. So no prices on this one yet</p>
