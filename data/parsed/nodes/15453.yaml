      <p>That’s funny. The problem other folks were having with the 1300 was that the overshoot was being suppressed to much too high a ppem size, resulting in the appearance of rounded characters “floating” up above the baseline.</p>
      <p>Of course, with any device there is going to be a range of sizes (possibly a couple) at which overshoot is having a slightly larger than expected effect, where it is first kicking in. This will be more apparent with lower res devices. However, intelligent usage of setting the blue zones (or their equivalent in TT hinting) should suppress overshoot at sizes where it would be particularly troublesome.</p>
      <p>It’s also possible that HP’s solution for the “overshoot is being suppressed to too large a size” was to turn off overshoot suppression altogether, or that their attempt to fix it went too far in the opposite direction. (I don’t know why either of these things would occur, seeing as this stuff is pretty clear in the Type 1 spec, but what do I know.)</p>
      <p>I’d be curious to hear from all the people having these various problems exactly how old their HP devices are. I expect things are better with more recent versions of their PS emulation.</p>
      <p>Regards,</p>
      <p>T</p>
      <p>T</p>
