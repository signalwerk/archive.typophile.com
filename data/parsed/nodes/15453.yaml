      <p>We bought the Xanté AW 1200 a few years ago, and have been very happy with it.</p>
      <p>However, 1200 dpi is not an accurate representation of type (especially if it is being used for looking at finer details)! Even at 1200 dpi, fonts look fatter than they should. We did a comparison of the results from an imagesetter at 2400 dpi and our printouts, and the difference was huge (we had posted scans of the two samples on the old typophile, but I can't find it).</p>
      <p>Just to say, if you are working on type, and if you don't want surprises (like seeing the final printed 500 page book and finding everything too LIGHT for easy reading!), you should in my opinion look only for 2400x2400.</p>
      <p>Or make a velox, as Hrant suggest, before finalising your first pages (any excellent idea, in fact).</p>
      <p>- Robert</p>
    html_clean: |-
