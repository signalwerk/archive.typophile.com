      <p>Imagesetters will get cheaper as they are replaced by Computer-to-Plate technology. However, be aware that, for film or velox output, you need not only the imagesetter but a processor as well. Then you have the problem of chemical recycling (silver can be recovered from the fixer) and disposal (used litho developer is really nasty stuff, and most municipalities frown on your pouring it doen the drain).</p>
      <p>Hrant, inkjets are as reliable as the RIP that drives them. In the shop I work in, we employ a Delta ROOM (RIP Once, Output Many) system to drive CPT for plates and generate proofs with a high-end Epson inkjet. The same file that prints the plates prints the proofs (although proofs are printed composite, while plates are separated) and, with the slight exception of some PMS colors which simply CANNOT be accurately rendered in CMYK (nor, for that matter, in CMYK + Light Cyan + Light Magenta), the proofs match the finished printed product extremely well. And the inkjet has the added advantage of not having to deal with toxic byproducts.</p>
    html_clean: |-
