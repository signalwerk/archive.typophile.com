      <p>I hardly use my 1200 dpi scanner since I got a digital camera.</p>
      <p>I adapted my 35mm copy stand with lights to take my digital camera.<br>
      The detail and sharpness is better than I got with the scanner. Also I am also no longer limited to the size of the scanner glass.</p>
