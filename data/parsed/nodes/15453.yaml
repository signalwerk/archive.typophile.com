      <p>Again, sorry for coming to this thread late.</p>
      <p>After some careful printing, I believe I <em>can</em> recommend a good inkjet printer and glossy paper for type proofing.</p>
      <p>I found a delicate type specimen in the latest New Yorker, matched it on my trusty Epson 2200, and scanned the results. Of course I used Ghostscript for the RIPping, because I have total control over resolution, ink drop size, and color management (I carefully tuned all these parameters to avoid any dither patterns). Here are the <a href="http://levien.com/type/scancompare.html">results</a>.</p>
      <p>I think the Epson compares favorably with other tests posted upthread, including the <a href="http://www.klim.co.nz/images/misc/Laser-vs-Offset.jpg">Minolta QMS PagePro 1250E</a>,  the <a href="http://www.aquatoad.com/typophile/print_sample.jpg">Minolta 9100</a>, and the <a href="http://72.14.207.104/search?q=cache:w7vtwhUFY-AJ:www.typophile.com/forums/messages/4101/13289.html%3F1075071667+AW1200+Typophile&amp;hl=en">Xante AW1200</a>.</p>
      <p>The 2200 is not the current model. I’m sure the R2400 is just as good or better, and likely the R1800 as well. Indeed, I wouldn’t be surprised if the R800 (at $400 list) would give excellent results at the A4 size. It certainly has the specs for it.</p>
      <p>If people are serious about using Epson inkjets for proofing type, I can make a GS software kit available. I can’t vouch for the quality using the standard Windows driver.</p>
