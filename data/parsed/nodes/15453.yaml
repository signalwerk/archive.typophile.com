      <p>A couple of comments:</p>
      <p>1. I am moderately happy with my Minolta 9100. The biggest issue has been the reliablility of the toner cartridge. I have yet to have toner cartridge that does not fail and do something strange like print ghost images etc well before the cartridge is empty. Fortunately, Minolta has been awesome with their support. They fedex me new cartridges overnight when I call them. Free. I am now on cartridge number 4. The current one has worked flawlessly for the last 4 months. Print quality works for me at this stage of my business.</p>
      <p>2. There is looking at type, and then there is LOOKING at type. Don't discount the amount of training your eyes require to need the difference between 600/1200/2400. Yes, you can obviously see there is darkening. But I think 1200 is good enough to see proportion issues, modulation irregularities etc. Or at the very least to see that something is not quite right with a letter. From there you can go in and play detective at larger sizes.</p>
      <p>I supect that 1200 is sufficient for the vast majority of *designers* on this site. Myself included. To make the jump to 2400 I think you either need to have extra cash laying around, or derive a large part of your income from designing text typefaces so you can justify the business expense, and know what you're looking at.</p>
      <p>R</p>
