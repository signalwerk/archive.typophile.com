      <p>Hrant, my scanner is 600dpi optical. I use it for low-res scanning to use for proofing. I have access to a Linotype-Hell drum scanner, but that would cost. I can also send it to someone here to scan. But I wouldn’t want to scan the text for the final test. If someone wants to test their font I prefer sending them the film/paper output, so they have the real thing in their hands.</p>
      <p>Randy, offset ink tends to spread on uncoated paper more than on coated paper because it is oil based and paper absorbs it and spreads. On a laser printer, the ink is powder and not oil based. The spread is due to the way it is applied to the paper, which should be the same on both coated and uncoated paper. Imagesetter output is exact, there is no spread. There could be some weight change when burning to plate from the film, so CTP gives the best result (exact until applied to paper).</p>
      <p>My point in all this is: what is it that you really want to test? If the font is to be used on offset, then offset is the best test. It is possible but pretty expensive. I can do that at a reasonably cheap price if you are not in a hurry in getting your tests. I can add some text around jobs. But you have to wait unti I get a job that uses a paper and ink within an acceptable range of your inteded use. I can also do the imagesetter output for you, no wait necessary.</p>
