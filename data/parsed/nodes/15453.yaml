      Yes for sure. Looking at the bottom of the e. Also the counters of the s. The laser at this size sometime lookes squarish in places that are really round. Remember that this is 9 point. I wouldn’t trust 9 point prints for much other than getting the general feel of the type. It just happened to be the sample in front of me (a veer print)</p>
      <p><cite>Don’t you think this might have introduced some gain? (like convert to outlines)</cite><br>
      I don’t think so. I typed it directly into the photoshop (7) 1200dpi bitmap from the font file, so I think it uses the hinting in the font — or at least adobe’s rasterizer. Conversely, sending outlines to a printer, there is no hinting at all. At any rate, the tests show that p-shop’s rasterizer is a heck of a lot better than Minoltas.</p>
