      <p>This is a bit OT, but the answers might bring up things relevant to nicolaj’s and others’ questions and thoughts on printers:</p>
      <p>I’ve recently asked in the Build section if someone might be able to account for a phenomenon I’ve recently noticed: using an HP LaserJet 1300 in Mac OS 10.4, characters in documents printed from InD CS and Word seem all to be aligned exactly on the baseline (hence giving the rounded characters like a and o, and vs, the subtle but noticeable appearance of floating higher than the other characters).</p>
