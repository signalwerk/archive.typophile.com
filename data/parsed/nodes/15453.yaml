      <p>A velox is like a heavy and glossy printout - almost like your typical photo paper, but not that thick, and not grainy. The way my place does it is they make regular imagesetter film, then they burn (?) velox copies from that, and each velox costs like $7. Another way is to run an imagesetter with "paper" instead of film, but a lot of bureaus don't like that because it involves swapping cartridges in their imagesetter; and if you want multiple copies of something without running an imagesetter repeatedly it's better to go from film instead of "paper". What I don't know though is exactly how they make veloxes from the film...</p>
      <p>--</p>
      <p>Robert, I'd like to see your comparisons - could you possibly find them?</p>
      <p>hhp</p>
