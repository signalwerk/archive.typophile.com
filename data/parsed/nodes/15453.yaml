      <p>I’m back with another PagePro 9100 vs. Offset.</p>
      <p>A couple things to note:<br>
      1. In my first sample I printed from the type itself. In this sample I printed from a 1200 dpi photoshop bitmap. The results are much better. I think this may have to do with Postscript emulation. No crappy dithering anymore. This is an anoying extra step, but it is nice to be able to get more out of a cheaper printer.</p>
      <p>2. I realized I was comparing Minion Pro with Minion. This is a useful thing because there are slight design differences between the two. See the italic r. This is clearly visible in the printout. This is what I was getting at with being able to see pretty fine structural differences at 1200.</p>
      <p>3. The two problems are the traps and the overall darkening. You might be tempted to overdo the traps if you only looked at the laser, or didn’t look for this phenomenon. The darkening is definitely greater than offset (which what totally minimal). This is partly the fidelity of the laser print, and partly the nature of toner vs ink. Toner is like laying black paper over white paper, while offset is like black paint on white. Toner is a blacker black.</p>
      <p>Anyhow, I hope this helps people make decisions. I think this shows you can get rather far in the design and testing process with 1200dpi, but again it depends on you and your comfort/skill level. All things considered this seems pretty good for an $800 printer at 9pt.</p>
      <p></p><div class="imageWrap"><img src="/files/print_sample2.jpg"></div><p></p>
