      <p>If you want to use an Inkjet, you will have to get a RIP in order to get printouts that are half-way acceptable.</p>
      <p>Also, it is about 3 dollars a page IF the printer doesn't splotch or streak, or do any of the number of other things Inkjets tend to do. Then, the cost for a single page goes way up!</p>
      <p>Our inkjet was 2400x2400, and we had a rip, but we pretty much stopped using it once we got the AW 1200. Even though the AW1200 is only 1200 dpi and monochromatic, it wasted less of our time and was generally less stressful.</p>
