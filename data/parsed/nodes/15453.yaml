      <p>"One could argue that Linotronic, or any ot that image setter stuff is not accurate, and maybe a high-resolution laser print (2400dpi) is a better indication of how a type will image in an offest litho environment. Perfectly imaged photo repro is hardly the same as plate-blanket-paper image transfer."</p>
      <p>No, offset printing is not the same as Lino output but neither is Laser printing. Most laser printers add more weight to horizontals than to verticals and toner blotting is not the same as inkspread on press. Offset printing does not add as much weight overall as toner either. Inkspread varies with many factors, human and mechanical.  I only argue that Lino shows you what is in your postscript file and eliminates the other variables. There is no substitute for offset printing but who can afford it as a test method.<br>
      I don't have a 2400 dpi printer so I don't know how much better it is. I sure would like to get an Asanté though, it has got to be better than my HP. Big bucks problem again :-)</p>
      <p>ChrisL</p>
