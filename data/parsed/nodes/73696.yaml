    html: |-
      <p>The two (the OFL and the GPL+font exception) are quite different, although both are valid free/libre and open source software licensing models for fonts. Although the GPL+font exception model is legally valid, we feel that it does not fit fonts well, and actually discourages the release of free/libre fonts, so we created the OFL. The philosophical differences are that the OFL does a better job of protecting designers in an understandable way and places less restrictions on the use of derivative works. That's a gross oversimplification, but gives you the general idea.</p>
      <p>For a lot more detail, read the <a class="freelinking external" href="http://scripts.sil.org/OFL_web" rel="nofollow">OFL itself</a> carefully (it's a lot less wordy than the GPL), and consult the newly-updated <a class="freelinking external" href="http://scripts.sil.org/OFL-FAQ_web" rel="nofollow">OFL-FAQ</a>.</p>
