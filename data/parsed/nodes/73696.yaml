    html: |-
      <p>The OFL has other clauses having to do specifically with typefaces. There is a clause that allows redistribution freely, sale of the typeface bundled with other products, but not sale of the typeface by itself. There is also a clause that requires changing the name of any modified versions of the typeface, meant to protect the good name of the original typeface if someone makes poor modifications, I would guess.  That's my memory of the differences, aided by a quick scan of the license.</p>
      <p>st</p>
