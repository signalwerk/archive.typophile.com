  html: "<p>Hi guys, <br>in the discussion on the iris type, some of you were speaking about snap on serifs. I, like probably all of us, made a bitmap face, just for fun (bj !!!).  Then I tried to make an italic to it. Which, theoreticly, is not a bitmap anymore... After that I wanted to find out what happens with the font, when I  glue serifs on it. Looks funny. I don't remember in what state of mind I was the, because I made Swash capitals as well...... <br> <br>Jacques <br> <br><!---Attachment: mekka.swf-!--></p><center><table border=\"1\"><tbody><tr><td><img src=\"http://www.typophile.com/forums/icons/mime_gif.gif\" align=\"LEFT\" alt=\"application/x-shockwave-flash\">Mekka.swf<br><a href=\"http://www.typophile.com/forums/messages/29/mekka.swf\"><b>mekka.swf</b></a> (23 k)</td></tr></tbody></table></center><!---/Attachment-!--><!--!-/attachment-!--><!--!-attachment:--><p></p>"
