    html: <p> v. nice --- Who this Mari might be is not for me to know, but I think you should spend more time with this. I like the serifs the most because they go off the beaten path and that (IMO) is a good thing with bitmap design. Design  (again IMO) is one place where you can go to the edge and still safely rein yourself in for safety. <br> <br>The only letter that I notice as odd is the lc italic 'p' it looks more like an UC italic 'R'. Perhaps the serif needs to go the other direction? </p>
