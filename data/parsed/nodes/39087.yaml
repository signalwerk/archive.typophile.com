      <p>Times Ten and Times are different fonts from Times New Roman. For a business magazine I would want to use one that has at least the CE character set so that names of international businesses and people can be set correctly.</p>
      <p>But have you considered leaving the Times area completely? Times is initially, (and to me, primarily) a newspaper face, and a magazine can develop a much more polished and professional look by choosing a less common face (I would stay in the serif faces).</p>
      <p>Ask about new faces here and you will get dozens of great suggestions.</p>
