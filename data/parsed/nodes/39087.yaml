      <p><cite>is there a way that i can tell indesign to change every fi it finds into a ligature?</cite><br>
      Just enable ligatures by ticking the corresponding check box in your paragraph style options (‘basic character formats’). Should work (for the standard ligatures like ‘fi’ and ‘fl’) with non-OT fonts aswell.</p>
      <p>Take care: in some languages, ligatures are not always allowed. In German for example, there can be a ‘fl’ ligature in ‘fliegen’ (to fly) but not in ‘aufliegen’ (to [over]lie).</p>
      <p>For other cases, you could use the find and replace function.</p>
