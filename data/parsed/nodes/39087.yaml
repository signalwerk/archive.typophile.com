      <p>I'm no fan of Times Roman--both because of its overuse, and its default status in the modern desktop computer world. The sheer quantity of documents I see that use Helvetica Bold headers/titling and Times Roman body copy is truly mind-numbing.</p>
      <p>Having said that, you can make Times a LITTLE more interesting...the Roman Small Caps face is nicely done, I use it often in lieu of italic Times, a cut which I despise. I mean, I REALLY dislike Times Italic.</p>
      <p>Also, I see few people use it, but Times Extra Bold is actually a nice display face.</p>
