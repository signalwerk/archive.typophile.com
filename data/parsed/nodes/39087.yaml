    <p>hello fello typophils,<br>
    im kiinda new here, and i was looking through past topics for anything about <a href="/wiki/times%20new%20roman" class="freelinking" rel="nofollow">times new roman</a>, im kinda new as a typographer too so i got some questions, specifically about times new roman, the font that the magazine i work for use. (along with universe and rotis:!)</p>
    <p>i noticed so many times new roman fonts out there, the europe version, SF, PS, CE, times(mac), and times ten!<br>
    so im confused which is the best for the magazine to stick to, i see the differences in shape, but what does all the initials stand for, and whats the easiest for people to read in the mag? (its a business mag, with a 3C. grid)</p>
    <p>and which one should i stick to, im using mac, and it has times and the times new roman, and im getting them to buy old style figures and small caps in.</p>
    <p>any advice or recommendation?</p>
    <p>thanks alot!!</p>
