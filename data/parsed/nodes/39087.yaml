      <p>I often use Aldine 721 (Bitstream's version of Plantin) instead of Times New Roman, especially when printing stuff in the office environment or on laser printers. The vast majority of people do not notice that it is a different typeface, but Aldine 721 has a slightly darker, more pleasant color. </p>
      <p>Also note that Windows Vista ships with a greatly expanded version of Times New Roman. The design of some diacritic character has been improved, many new characters have been added. The font has 3300 glyphs and covers all of European and Vietnamese Latin letters, European and Asian Cyrillic letters, monotonic and polytonic Greek, Hebrew, Arabic, an abundance of phonetic symbols as well as combining diacritics. For multilingual typesetting, this offers a reasonable candidate. I've heard that Microsoft Office 2008 for Mac will also include those fonts so they will be available on the Mac sooner or later. </p>
      <p>Regards,<br>
      Adam</p>
