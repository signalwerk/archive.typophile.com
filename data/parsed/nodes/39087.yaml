      <p><cite>but a question for now, about ligatures</cite></p>
      <p>They usually have ‘fi’ and ‘f<strong>l</strong>’, not ‘ft’. These two were included in extended ASCII codepages, <a href="http://en.wikipedia.org/wiki/Mac_OS_Roman" rel="nofollow">at least on the Mac</a>.<br>
      And they are the most essential ones. If you stick with Times, you won’t need a lot of fancy ligatures. Take a look at its letterforms: ‘ft’ is not a problem, and ‘ff’ doesn’t clash either.</p>
      <p>The Times alternative <a href="http://www.stormtype.com/typefaces-fonts-shop/families-73-lido-stf-commercial-licence" rel="nofollow">Lido by František Štorm</a> hasn’t more than ‘fi’ and ‘fl’ either.</p>
      <p>Minion Pro has some more: fi, fl, ft, ff, ffi, fb, ffb, ffh, ffk, fft, fh, fj, ffj, fk, to mention only those with ‘f’.<br>
      But that’s due to the fact that its f drop reaches out quite far to the right. You don’t have that problem with Times. Only use ligatures (i.e., in body text) when they solve problems – a lot of people really dislike scrolled ‘st’ and ‘ct’ ligatures!</p>
