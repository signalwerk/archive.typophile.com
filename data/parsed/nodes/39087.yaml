      <p>I agree with Don McCahill. Personally, I HATE Times New Roman (any variation, thereof). It is boring, overused, and should be trashed immediately. I never ever ever use it, nor would consider using it. There are so many new beautiful fonts out there to suit whatever style you want, so why use something as bland as Times New Roman?</p>
      <p>Just my opinion, of course, but Optima or Palatino are elegant beautiful, yet sophisticated fonts that could be suitable for a business-focused magazinen. Otherwise, Baskerville or Verdana or even Helvetica would be preferable. You didn't mention whether the magazine was an online zine or hard copy print, but even still, anything beats Times. Of course, you're limited to web-safe fonts if the magazine is only online. </p>
      <p>Also, is your magazine a business magazine in the subject of science/medicine? Or is it classical business magazine? Or is it geared to IT and Technology? Or to marketing for children? These are some things to consider.</p>
      <p>I'd check out linotype's homepage and see what they have to offer.</p>
