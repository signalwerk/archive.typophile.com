    <p>In 1938 Frederic W. Goudy designed a text family for the University of California called University Old Style. It was redrawn and digitized in 1994 by Richard Beatty and is now the exclusive typeface for the University of California, Berkeley. Monotype released this font in 1956 under the name Californian and later Tony Stan designed the ITC version, Berkeley Oldstyle. The UC makes it available for free download (subject to their standard EULA) at</p>
    <p>LINK REMOVED</p>
    <p>Oldstyle figures are default-loaded in some fonts, and many variables are available, including weights specific to signage.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/UniversityOldstyle_5093.png"></div><p></p>
