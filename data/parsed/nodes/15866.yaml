    <p>Hello,</p>
    <p>I’m looking for a Latin type family like Bitstream’s Latin 725, but I need<br>
    Greek, cyrillic, eastern european and turkish charachter sets. Can anyone<br>
    recommend something? It’s for a corp. ID program which is in transition.<br>
    We use Matrix Book for body copy but there are no non-Western characters<br>
    in it to use in international materials.</p>
    <p>thanks in advance,</p>
    <p>Enrico</p>
