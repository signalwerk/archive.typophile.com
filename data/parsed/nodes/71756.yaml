    <p>Just wanted to share this, I don't recall it being posted here before.</p>
    <p><a href="http://bibliodyssey.blogspot.com/2010/06/printers-handbook.html" title="http://bibliodyssey.blogspot.com/2010/06/printers-handbook.html">http://bibliodyssey.blogspot.com/2010/06/printers-handbook.html</a></p>
    <p>from the post:<br>
    &lt;&lt;'Schrift- und Polytypen-Proben' (1848) {Fonts and examples of different type} --- appears to be a fairly comprehensive model-book or copy-book aimed at printers. It contains a wide variety of fonts and typographic elements, decorative borders, printer's ornaments, page cornices, emblems, shields, trophies and pendants, as well as what look like Victorian clip-art motifs.&gt;&gt;</p>
