      <p>I believe what David means by "overlaps" is what I'm used to calling "overshoot" (and "undershoot"). [DB, correct me if I'm misinterpreting.]</p>
      <p>That's how I make sense of what he's saying. In larger scales, the amount of overshoot required for rounds to appear the same height as squares/flats is proportionally less than at small text sizes. This also affects the relative alignments and perceived heights of italic l.c. (where there are relatively few flats at x-ht, for most traditional styles, with f and t being the main determinors).</p>
      <p>Also, I would say that the degree of slant makes a difference. The greater the angle from the vertical, the more the optical illusion that John describes will come into play (since the strokes become proportionately longer as the diagonal becomes greater).</p>
      <p>-- Kent.</p>
