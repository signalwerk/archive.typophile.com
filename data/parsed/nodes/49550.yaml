      <p>It's not the the differences or commonalities between an italic and a roman, per se, it's the ratio of one to the other. This is particularly true if one is jettisoning the cursive model for an "oblique and tweak" approach as the reader has just lost a lifetime of learning that cursive equals italic. </p>
      <p>A related and interesting historical study might be how italics were married to romans in the centuries before families (font families, not mom, dad, and that short aunt who smoked too much). Upon what did they base their choices? I fear much of it was simple availability, but even then the printers were probably going down the same criteria checklist. </p>
      <p>"Oblique and tweak" is more fun to say than to read, by the way.</p>
