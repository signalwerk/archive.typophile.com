      <p>&gt; how popular is that work from Deberny or the German foundries?</p>
      <p>Not very. I had long wondered why those fell totally off the map, and<br>
      I never believed it was because of unusability. I think I figured it out<br>
      when I started preparing my TypeCon-LA talk: what happened to the<br>
      German foundries was WWI; what happened to Deberny was Charles<br>
      Peignot, who killed off what he saw as the "stagnant" elements of the<br>
      D&amp;P library, except he replaced them with superficial (if marketable)<br>
      display fonts; and what happened to Monotype and Linotype is that<br>
      -as they were replacing the "cold" foundries- they needed to mimic<br>
      the establishment (read: traditional Italics), just like Gutenberg at<br>
      the very beginning.</p>
      <p>But history, shmistory - I'm happy to report that the<br>
      slanted-Roman is back, winning hearts, minds and money.</p>
      <p>hhp</p>
