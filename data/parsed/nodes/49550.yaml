      <p><em>To a companion roman, an italic should have consistent heights of upper and lowercase...</em></p>
      <p>I'm sure David meant to say <em>visually</em> consistent heights. There is an optical effect that can make a slanted letter look taller than an upright letter when they are mathematically the same height. This is because the actual stroke length of a slanted form is longer than that of a vertical form. In particular, one may want to make the actual height of the italic lowercase slightly shorter than that of the roman, to compensate for this effect. This must be judged visually.</p>
      <p><em>Whatever kind of stress, or pen angle, that is apparent in the roman should follow in the italic, despite the angle of the italic stems.</em></p>
      <p>That's a solid approach, but I think a more basic observation would be to say that the stroke construction model should be the same -- even if the actual 'pen angle' were allowed to vary. Note that this observation doesn't imply a strictly chirographic approach: whatever 'idea' is used to regulate the construction of the roman letters should be applied to the italic letters in order to make the two work together.</p>
