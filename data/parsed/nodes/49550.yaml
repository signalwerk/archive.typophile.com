    <p>hi typophiles.<br>
    i am designing a family of display fonts that preserves the hand-rendered look and an illustrative style. </p>
    <p>I am trying to design an italic to complement the regular style i have sketched.<br>
    This question has bothered me for awhile, and in my type readings I am yet to find an answer. What aspects/features of an italic relate it to the regular or even make it belong to its family. Is it supposed to relate to the roman.<br>
    I understand that italic derived from scribes needing to reproduce books etc. at a faster pace, but surely there must be a reason why garamond italic belongs to garamond family and not caslon.</p>
    <p>I apologize if this is confusing, i'm tired, and having trouble forming coherent sentences.</p>
