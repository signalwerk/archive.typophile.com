      <p>Good question. To a companion roman, an italic should have consistent heights of upper and lowercase, as well as figure height and other character alignment. The spacing and weight of the two should be optically equivalent, which means they appear to be about the same, (the trickiest part). The italic should be offset so an italic word set amongst roman will balance between roman words. The design of the uppercase forms should be within the same class, i.e. you would use the same serif structure for uppercases in both. the lowercase structure can have more variety between roman and italic, by tradition, but you wouldn't e.g. make the lowercase tails, terminals or serifs much wider, heavier or contrasting than the roman. Whatever kind of stress, or pen angle, that is apparent in the roman should follow in the italic, despite the angle of the italic stems. </p>
      <p>You could think of this as if you were writing the fonts, and didn't want anything but emphasis to change, or not. ;)</p>
      <p>Cheers!</p>
