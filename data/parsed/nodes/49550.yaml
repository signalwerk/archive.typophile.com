      <p><em>"but surely there must be a reason why garamond italic belongs to garamond family and not caslon."</em></p>
      <p>Does it? If i'm not mistaken, Claude Garamond never did italics at all. Robert Granjon's italics are used as a reference in most contemporary designs, i think.</p>
      <p>This roman-italic pairing thing is just dogma. Of course, if you are designing a text typeface, most people will expect you to follow the rules, one of them is to provide the basic four styles: roman, bold, italic, bold-italic. Anyway, you said it is a display face, so maybe the rules don't even apply. Anyhow it's always good to review dogma from time to time, least we became obsolete.</p>
      <p>Talking about obsolete, i like the fraktur-roman pairing:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/kunstrichtigesch00fran_orig_0013_6477.jpg"></div><p></p>
      <p>Looks groovy and makes sense, you know, German script for German text, Roman type for Roman text.</p>
