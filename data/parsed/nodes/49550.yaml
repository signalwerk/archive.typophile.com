      <p>My position is a pain to defend in public, but I stand by it like some crazed Japanese soldier in a tree: in terms of "belonging" to its roman (which is what an italic in a text face needs to primarily do) the best an italic can do is a be a slanted version of the roman, albeit with two important twists:<br>
      1) Aesthetics: some features (like double-sided serifs) don't look good slanted, and some glyphs (like your average bicameral "a") look lousy too. Those need to be fixed.<br>
      2) Differentiation: some slanted glyphs (especially if you like your slants slight like I do) need extra help not to be confused for a roman glyph.</p>
      <p>So the slanted-roman I'm proposing is nothing like what ATF did and Morison proselytized; it's much more like what the Deberny foundry was doing in France towards the end of the 19th century and some German foundries were doing in the first quarter of the 20th century.</p>
      <p>I've done something in this vein as well:<br>
      <a href="http://www.themicrofoundry.com/other/nour&amp;patria/dev/nour-latin.gif" title="http://www.themicrofoundry.com/other/nour&amp;patria/dev/nour-latin.gif">http://www.themicrofoundry.com/other/nour&amp;patria/dev/nour-latin.gif</a></p>
      <p>Essentially, I would caution against the mainstream parroting of "an italic must be cursive"*, because cursiveness is almost guaranteed to lend an atmosphere to the italic that the roman does not share. We need to find something more sensical, and really slant capably does all the heavy lifting.</p>
      <p>* Which leads to dysfunctional banalities like "upright italics". Gag.</p>
      <p>hhp</p>
