  html: |-
    <p><strong><a href="http://www.fontbureau.com/fonts/Condor/" rel="nofollow">Condor</a></strong><br>
    Prompted initially by commercial lettering and landmarks of the ’20s and ’30s, <a href="http://www.fontbureau.com/people/DavidJonathanRoss/" rel="nofollow">David Jonathan Ross</a> fused a high-contrast style with a rationalized structure of flattened curves and wide-open apertures to devise this glimmering sans-serif family with slight Deco undertones. Condor has an unusually broad wingspan: from taut, compact weights that flaunt their athletic energy to bright, airy styles that radiate luxuriously; FB 2010</p>
    <p><em>60 Styles:</em> Extra Light, Light, Regular, Medium, Bold, and Black, all with italics in Compressed, Condensed, Normal, Wide, and Extended widths</p>
