    html: <p><a href="http://typophile.com/courses.html">Jonathan Hoefler's Intro to Typeface Design 110</a> may  <br>help you understand the color and the unity required  <br>for a successful set of glyphs.  <br>  <br>Also, before you start, figure out why you're doing it. Are   <br>you doing it to say you've done it or because you see a   <br>'marketing' opportunity for a design you have in mind?   <br>Or simply because you want to learn the craft? Is there  <br>a client (real or fictitious) that will drive the aesthetics  <br>or functionality of your face?   <br>  <br>Maybe there's no right or wrong answer, but your  <br>answers to these questions will help you gauge   <br>your progress as your face develops. It's your sort of   <br>personal 'creative brief' that will help you figure out if   <br>you're on the right track.</p>
