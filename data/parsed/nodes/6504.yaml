  - id: 45627
    user: 1290
    date: 2003-01-29T18:23:00
    date_raw: 29 Jan 2003 — 6:23pm
    votes: null
    html: <p>Using FontLab to draw glyphs is worth it if only for all the time you save joining points. Rather than dragging two points on top of each other, hitting cmd-j, selecting the type of join, and hitting ok, in FontLab you just drag one point on to the other and they automatically join. <br> <br>As for the pathfinder like tools, with FontLab I don't find myself ever carving out spaces, since I can just draw my counters and when I preview the glyph, it draws the counter carved out. In illustrator I used to draw the counters filled with white to see how it would look, but it's nice to not have to worry about setting the right color for these paths anymore. Sometimes I build my glyphs in pieces; joining these into the final shape is simple (cmd-F10). <br> <br>The comment about helping you think about your spacing is dead on. I work most of the time with the preview window up. If I'm trying to adjust the weight and metrics of, for instance, the 'g' glyph, I set a sample word in the preview window, say... 'glowing', and I watch the word as I make adjustments. Once I'm satisfied with the word 'glowing', I try a few more words and make the changes that seem necessary. <br> <br>I also used to be really happy with Illustrator for drawing glyphs, but since trying FontLab, it's painful to go back. It comes down to the fact that FontLabs drawing tools are designed only for drawing glyphs, while Illustrators tools are much more broad, not as focused, so the extra power just gets in the way.</p>
