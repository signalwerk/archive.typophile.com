    html: "<p>&gt; semi-sans <br> <br>Good, good - we need more of those - it's a huge untapped well. <br> <br>But there's a core issue with semi-serifs: they will lean \"backwards\" if you just leave them as-is. <br>I know of two solutions: <br> <br>1. Put some counterweight on the other side. The best example is Avance: <br><a href=\"http://www.typophile.com/forums/messages/29/3226.html\" target=\"_blank\">http://www.typophile.com/forums/messages/29/3226.html</a> <br> <br>2. Gently lean the whole thing forward. Like in Harrier: <br><a href=\"http://www.themicrofoundry.com/other/nour&amp;patria/dev/harrier-beta.gif\" target=\"_blank\">http://www.themicrofoundry.com/other/nour&amp;patria/dev/harrier-beta.gif</a> <br> <br>hhp <br></p>"
