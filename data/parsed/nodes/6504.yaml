  - id: 45626
    user: 1087
    date: 2003-01-29T18:16:00
    date_raw: 29 Jan 2003 — 6:16pm
    votes: null
    html: <p>Kyle -  <br> <br>The bad habit I was referring to was the tendency in Illustrator to design letters as individual pieces rather than related groups. You can shuffle the glyphs around so they sit side by side but nothing beats seeing them in strings or up against numerous other glyphs. Unlike Illustrator, you can do this easily in FL or FOG by having the metrics window open in the background.  <br> <br>As far as templates, you can import a PICT or TIFF into the background layer. I've never done this as I've only once designed a face from a scan. I however use the template layer often when designing a new weight of the face. <br> <br>Bj - <br>I'll give you that one. The pathfinder in Illustrator is amazing. You can do anything. Especially bang out geometric and display style fonts. FL has a tool similar to this that requires you to reverse the contours in order to perform similar operations. In short, it adds an extra step. So basically it's just a different way of doing things. I only prefer it because you can work with the exact coordinates and measurements that will appear in the final postscript version. Remember that when you paste into FOG or FL everything (stems and handles) will have to fit the 1000 unit grid somehow. That means either rounding up to the nearest or down to the nearest. This can be trouble with an ultra light version of a typeface (something with a stem weight of 20 units or less). <br> <br>I'm however not totally gung ho yet for FL. It's very buggy and has TERRIBLE kerning assistance for diacritics and alike characters. I've been importing back into FOG for this lately. I would love to use OSX but it will be a few years before I can afford a machine that will run it. Maybe it will run better there. My  G3 isn't up to the task. <br> <br>Hope this helps.</p>
