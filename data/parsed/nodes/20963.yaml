  html: |-
    <p>Hi. I’m looking for a condensed sans serif that comes in a decent set of weights including a light. I want something that has the formal structure of, say, Akzidenz or Univers but with slightly rounded edges. I don’t mean something explicitly rounded, just a softer more ‘modern’ edge.</p>
    <p>Village’s <a href="http://www.vllg.com/Lux/Section/mudTyper+Weights/">Section</a> is quite good but more condensed would be nice…</p>
    <p>Any tips greatly appreciated.</p>
