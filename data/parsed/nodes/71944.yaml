    <p>I'm working on a chinese packaging and I'm having problems. I've tried to install various chinese fonts, they look ok in linotype font explorer, but when I try to type with them or paste a text some squares appear instead of the actual glyph.</p>
    <p>I've never worked with this language before so feel free to lecture me.</p>
    <p>Thanks a lot!</p>
