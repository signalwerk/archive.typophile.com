    html: |-
      <p>I think the problem is the font family does not match the character encoding.<br>
      Please make sure you use the same encoding, traditional Chinese characters as traditional chinese font family, or simplified characters as simplified font family.</p>
      <p>For ex, DFP Hei™ Simplified Chinese Font Family or DF Hei Traditional Chinese Font Family.<br>
      And also use Google to translate texts between Traditional and Simplified.</p>
      <p>ps, traditional characters is used in Taiwan and Hong Kong, simplified characters used in China.</p>
