      <p>Graig: <em>[…] it's striking to me just how far the dots of these i's "lag" to the right.</em></p>
      <p>If you look at the other accented characters, you will see the same for the ones that can be combined with the f and the ‘long’ s. This positioning simply prevents collisions with the terminals of the forenamed two letters.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Jenson_accents_5587.jpg"></div><p></p>
      <p>You also will have noticed that in Jenson’s type the ‘long’ s shares the width with the f, which creates a gap to the next letter. The f and ‘long’ s in the type for the <em>Aetna</em>, which Griffo clearly based on Jenson’s model, show shorter terminals and a ı (dotless i) is used after these letters. I have seen a ı erroneously used upside down in the <em>Aetna</em>, but unfortunately at the moment I don’t recall where.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Griffo_kerning_3803.jpg"></div><p></p>
      <p>The two following examples (of which one is taken from this topic) show that Jenson for instance also applied alternatively kerned T-capitals.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Jenson_kerning_5469.jpg"></div><p></p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Jenson_kerning_2_4404.jpg"></div><p></p>
      <p>FEB</p>
