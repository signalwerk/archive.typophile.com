    html: |-
      <p><cite>What if printing was so immensely profitable that they didn’t need to re-use type?</cite></p>
      <p>If my understanding is correct, early printing was done on such tight budgets that old type had to be melted down to reduce to cost of type-metal for new fonts. But Venice was among the wealthiest places in Europe, and the printers were setting up shop with subsides from the uber-wealthy, so they may have had a lot of options. </p>
      <p><cite>At any rate, the metal was relatively soft and malleable, so it would have been possible to fit the letter r to following letters in an on-demand, ad hoc basis.</cite></p>
      <p>It begs the question: were some of the variant sorts of that era letters that were customized for one job and then got mixed back in with the rest? </p>
      <p><cite>…shaved and fitted letter by letter, to produce an effect that we would liken to negative tracking.</cite></p>
      <p>I always wondered how common these practices were. My design history professor has been working in design for fifty-plus years, and talked about it a lot. It seems like something that would have been especially likely in Monotype shops.</p>
