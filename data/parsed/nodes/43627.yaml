    html: |-
      <p>One of the finest printers of the 20th century, he was allowed to recast Bodoni’s types from the original punches/matrices which he used to set the text of the first books from his own letterpress studio/publishing house, the Officina Bodoni. He then designed his own typefaces, cut by the great Charles Malin. Try to find specimens of Mardersteig’s Griffo, Dante, Zeno, Fontana, Pacioli, etc. they’re incredibly beautiful. There’s <a href="http://www.google.com/search?client=safari&amp;rls=en&amp;q=mardersteig+site:typophile.com&amp;ie=UTF-8&amp;oe=UTF-8" rel="nofollow">quite a bit of information here on Typophile</a>, too.</p>
      <p>He was a friend of Stanley Morison and produced extensive, scholarly research on Francesco Griffo da Bologna, Felice Feliciano, Aldo Manuzio, Leon Battista Alberti, calligraphers from the Renaissance and roman inscription in Italy and abroad, among other subjects. </p>
      <p>In a word, he’s a legend.</p>
      <p>Re-reading my earlier post now, maybe it might have sounded as if I was talking about Jenson’s type being mixed in the case, but I was still referring to the De Aetna type, which I think might share some of the traits of Jenson’s Eusebius type concerning the presence/use of alternates.</p>
  - id: 270862
    user_id: 16094
    user_name: James Mosley
    user_path: null
    date_raw: 6 Apr 2008 — 10:58am
    date: 2008-04-06T10:58:00
    votes: null
    html: |-
      <p><em>Mardersteig</em></p>
      <p>Giovanni Mardersteig discussed variant sorts in the roman types of the <em>De Aetna</em> in the introductory note to his reprint of the <em>De Aetna</em> text published in 1969. This is his redrawing of them, taken from Nicolas Barker’s reproduction in his essay of 1974 on the Aldine types in Paris.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/De Aetna type - variant sorts - Barker after Mardersteig 500_3600.jpg"></div><p></p>
      <p>The <em>De Aetna</em> is printed from newly cast type and it has been called a kind of type specimen. But it is an odd piece of setting. There are several examples of u used upside down for n, and the other way round too I think, so maybe the caster was still at work and had not produced enough sorts to be used for the page in hand. It seems an odd thing to say about a book and a type that have been so endlessly discussed, but someone should really look at both of them more carefully.</p>
      <p>I am not sure I fully accept all Mardersteig’s variants as being derived from different punches rather than variations caused by the casting and handling of the type. He redrew them to emphasise the variations he undoubtedly believed that he saw. But an actual example, like the image below, is more ambiguous. </p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Aldus - De Aetna - det 3 500_6405.jpg"></div><p></p>
      <p>There is not much doubt, I suppose, about the variant m and n (not shown here), and c too, but are the examples of different-looking a and e and u all really from different punches and intended as alternative forms? Still, the example shows some alternative sorts that are not in Mardersteig’s examples: a swash form of e that seems to be intended for the end of a word (there was a swash m too). But what is the long-tailed a doing in the middle of a word? And what was the function of the two p’s? Was the ‘majuscule’ style an experimental new form that might have replaced the other? More investigation needed.</p>
      <p>One needs to remember that the e with its horizontal crossbar was equally experimental. We accept it as the normal form because of the prestige of the French imitations of the <em>De Aetna</em> type of over thirty years later.</p>
      <p>There are plenty of ligatured sorts in Griffo’s italic for Aldus. But are there variant forms of single letters? I remain to be convinced.</p>
