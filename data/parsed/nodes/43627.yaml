    html: |-
      <p>I just left the Library of Congress. Unfortunately I was not allowed to take a camera into the rare books reading room! That makes this much harder, when I have some time after graduation I’ll get the library to do some macro shots.</p>
      <p>The books I looked at were the <em>Biblia Latina</em>, <em>Naturalis Historia</em>, and <em>De Evangelica Praeparatione</em>. The bible turned out to be set in blackletter, and is very butch with studded leather covers and straps, but not especially applicable as the heavy impression and chunky letters make spotting alternates a nightmare. But there did appear to be at least two versions of <strong>a</strong>, distinguished by their upper counters, one appearing narrower and more geometric, the other slightly wider and rounded. The narrower version often appears at the beginnings of, and after t and r. Again, the type design, heavy imprint and thick paper make it hard to discern if these differences are intentional. </p>
      <p>In the other two books I focused on the letter <strong>a</strong> after <strong>t</strong>, <strong>r</strong>, and <strong>g</strong>. I noticed the same patterns as Eben—<strong>a</strong> is often a narrower sort after t and r, as well as at the beginning of words. There is a very narrow, effete <strong>a</strong> that sometimes appears after <strong>g</strong>, the difference is so strong it is obvious without magnification. What stood out to me was that the use of the alternates appeared inconsistent—it does not occur everywhere, but not random. I don’t know latin, so I cannot tell if this is somehow related to the grammar.</p>
      <p>And now for a tangent: the next time you feel bad about shipping a book with a nasty error, remember that Nicholas Jenson shipped at least one without checking to be sure that the rubricators filled in all of the drop caps!</p>
