      <p>Eben --</p>
      <p>It's a little tricky to discern which differences may be due to design intention and which to printing exigencies. The differences here are subtle.</p>
      <p>What strikes me is the relative consistency of the majority of the glyph between the two versions, as shown by your overlay. A couple of thoughts occur to me -- pure speculation and probably completely fanciful: </p>
      <p>1) Perhaps the wide punch was cut and the matrix struck; and then the punch was reworked, trimming the upper terminal, and a new matrix struck.</p>
      <p>2) At the very least, I can imagine that the same counterpunch would have been utilized.</p>
      <p>3) Perhaps it is all in our imagination and the one that seems narrower has simply worn down at the top. </p>
      <p>I suppose you've examined this closely enough to clearly identify a pattern of narrow variants and can rule out number three.</p>
      <p>-- K.</p>
