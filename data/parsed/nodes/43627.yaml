    html: |-
      <p>What if printing was so immensely profitable that they didn't need to re-use type?<br>
      At the very least, if they were reusing type, they had the time to sort through the huge character-sets they used.<br>
      In that case, perhaps they "locked up" frequently-used two-letter combinations (strung together via the holes in the type body, or soldered) and put these back in the case.</p>
      <p>At any rate, the metal was relatively soft and malleable, so it would have been possible to fit the letter r to following letters in an on-demand, ad hoc basis. That r-a combination seems to have been a motif in Jenson's design process, a focus of how left median-height serifs fitted. Was Jenson compositor and printer? When did specialization evolve?</p>
      <p>Comparing the economics and job functions of the changeover from phototype to digital should produce insights into the incunabula.</p>
      <p>If they were attuned to the necessity of ligatures, but in a process of reducing the number of ligatures from the vast number mandated by following the scribal model, then they would perhaps have felt that treating certain non-ligating letter combinations with the same care and attention that they applied to truly ligated forms, was not an onerous burden, but a necessity.</p>
      <p>The lengths compositors will sometimes go to with metal type was brought home to me by <em>The Book of Oz,</em>(mid 20th century) which was set in 14 pt Cooper Oldstyle (a similar size to Jenson's text), shaved and fitted letter by letter, to produce an effect that we would liken to negative tracking.</p>
  - id: 272052
