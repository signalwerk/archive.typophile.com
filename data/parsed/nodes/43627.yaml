      <p>Having been to see the original in the SF Public Library today with a loupe and a camera I am growing much more convinced in the case of the Jenson and I am surprised by this - the Aldus. In the case of Aldus I think there is less intention involved in the use of varients except in the ra, although I am not utterly settled about this. In the case of the Jenson it is looking more &amp; more deliberate to me. The Aldine seems to have far more varients than the Jenson. In both cases it was the lightest inkings that seemed most useful. they look less good but as evidence they seem great. I will post the photos I took through a loupe soon. I am going to try to visit again on Sat if I can. But if not, maybe I can convince some SF type types to be surrogates! If I can go you are welcome to join me if you can make it.</p>
