    html: |-
      <p><em>early printing was done on such tight budgets that old type had to be melted down to reduce to cost of type-metal for new fonts.</em></p>
      <p>Recycling was a well-established practice in the technologies involved in printing, so was not a cost-cutting measure. </p>
      <p><em>But Venice was among the wealthiest places in Europe, and the printers were setting up shop with subsides from the uber-wealthy, so they may have had a lot of options.</em></p>
      <p>Subsidies? Unlikely to be the driving force in a new media boom.</p>
      <p>Again, compare the incunabula with recent events. DTP was a revolution because it drastically reduced the cost of publishing. The same was true of printing. So forget about tight budgets and subsidies--there was a shit-load of money to be made in printing.</p>
