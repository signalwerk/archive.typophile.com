      <p>I got a new sample today from Vassar. They say it's 1470. And... It seems to lack the features I had seen elsewhere. There do seem to be two "a" shapes but their differences are subtle and their use does not seem to follow a pattern. One  "a" has a spring tail and the other is lightLook at the word "natura" on the 3rd line. I would have expected a variant "a" after the r there. I don't see one. It may be that at this size casting differences obliterate any possibility of detective work. </p>
      <p>The font is is quite small I think. I have included some paper texture and some brushwork next to the sample to give you some idea. The sample didn't have a ruler but I think I can draw some inferences. </p>
      <p>I am still looking at the r. In general the r used is the one with the flat (vertical) end. But there is the word "inferre" at the bottom of this sample. The second r seems like a variant to me. </p>
