    html: <p>I’m watching the BBC Gutenberg documentary (fabulous!) and about 31 minutes in Fry states that the old printers had alternate characters of different widths to keep lines of type justified. If he is correct, could that be part of what’s going on here? It would certainly explain the inconsistent use of the variants. If Fry has a source to back that notion up it would make a lot of sense, as Jenson is believed to have learned printing in Mainz.</p>
