    <p>1475 Nicholas Jenson</p>
    <p>I need a better sample to begin to take this seriously but it has piqued my interest.</p>
    <p>Part of why I think it's possible is that he is thought to have trained in Mainz, and knew the type of  Johann and Wendelin of Speyer (de Spira), and Sweynheym &amp; Pannartz's  Subaico.</p>
    <p>( RE: Subaico <a href="http://typophile.com/node/43615" title="http://typophile.com/node/43615">http://typophile.com/node/43615</a> )</p>
    <p>It would be great to be sure about this. Does anybody have any high-rez images? Or suggestions?</p>
