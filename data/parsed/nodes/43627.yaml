    date: 2008-04-19T22:07:00
    votes: null
    html: |-
      <p>Gutenburg did have a ton of extra sorts. This is well researched &amp; checked on. Partly this was for the reason Fry gives but partly it was because in order to look like a book and to make a text that people would recognize as a legitimate text you simply had to have them. Think about how fancy pants typophiles feel about f ligatures and bump it up 12+ notches or so! </p>
      <p>The thing is, when you read about the Bremer Presse the reason for their sorts ( as given) is the same - to make a more even page. But if you actually look at how they are used it doesn't 100% totally wash. What is true though is that if you have a tight line of text where you wish you had more space it is easy to swap those narrow r shapes &amp; narrow s shapes in - and they do work reasonably well. </p>
      <p>What is certain is that the letter culture of the day in which Jenson made his letters was one where having more than one r would be seen as traditional/natural/obvious etc. The other thing is that what Jenson as was doing was high craft - like - well it's hard to say now because we don't have places to go buy custom made stuff much anymore. But they definitely did. 99% of everything you could buy would have been. Standardization would have been the novel notion - not custom design. Standardizing on 5 or 6 r shapes might have seemed like a big leap!</p>
      <p>I think Alan May is a good source for Fry.  ;-)</p>
