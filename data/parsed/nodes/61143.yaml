    html: |-
      <p>I have been away since June or so, but expect to return actively in 2 weeks.</p>
      <p>I was shown a source in the famous commentary on the Code of Jewish Law, regarding the Magen Avrahom's views on contextual placement of the shva-na.</p>
      <p>There appears to be a grammatical view, based upon the Radak, with three levels of interpretation:<br>
      1. Minchas Shai - Shai L'Morah<br>
      2. Eliyahu achur - Gra - ArtScroll<br>
      3. R' Zalman Henna or Hanau - Chabad USA</p>
      <p>There appears to be a contextual view, based upon the Magen Avrahom (based upon the Radak, R' David Kimchi).</p>
      <p>Apparently, the view of the Magen Avraham is most accurate, with the other 3 views simply modifying or adding to the rules of the MA.</p>
      <p>Hence, automatic shva-na placement will be based upon the MA, with 3 alternative versions.</p>
