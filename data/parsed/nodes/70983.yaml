  html: |-
    <p>So I'm well versed in the Adobe/Quark paid apps that can render OpenType features but I'm not 100% certain of the available ones either bundled as part of the OS or freely available under GNU licenses . . .</p>
    <p>I believe TextEdit on the Mac 10.4 and higher will render liga among other OT versions . . .</p>
    <p>Above all, I want some way for folks who don't own Adobe or Quark apps to be able to enjoy OT features or at least experience them without having to purchase the apps . . .</p>
    <p>I'm happy if there are other posts that list these but I wasn't able to find 'em and I wanted a specific listing I could always point folks to . . .</p>
    <p>Thanks in advance for your help gang!<br>
    Stuart :D</p>
