    <p>Has anyone ever had a problem using Indesign to set up a nested paragraph style and applying it to a question / answer format?<br>
    The question would be in bold and have a hard return after the question mark, the answer would be in a regular face. My long document is however riddled full of hard returns.<br>
    below are my results.  Any help would be amazing. Thank you.</p>
