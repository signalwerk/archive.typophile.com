      <p>You may try to do this with find/replace method - since your questions end with question mark or colon, and your answers with full stop. You can find them and automatically change to different paragraph style. If you insist on using nested styles, you find them and automatically ad a mark that nested styles can recognize, eg. non-breaking space, em- or en-space, etc. and configure nested styles as img. below shows:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/nested_4740.gif"></div><p></p>
      <p>Antoni</p>
