    html: |-
      <p>Hi Dustin,</p>
      <p>Sebastian is right; this is a typical case for ‘Next Style’.</p>
      <p>Two minor problems:</p>
      <p>1. You have an empty paragraph, separating an answer from the next question.<br>
      You could introduce a third paragraph style (‘Separator’), and specify this sequence:</p>
      <p>‘Question’ followed by ‘Answer’ followed by ‘Separator’ (followed by ‘Question’ again).</p>
      <p>But actually, that wouldn’t be very elegant. You should get rid off this extra paragraph (search for <code>^p^p</code> and replace by a single <code>^p</code>), and rather give the ‘Answer’ style a bottom margin (via paragraph style options). </p>
      <p>2. You must not have hard breaks within your paragraph (because they would trigger a new one). Thus, your ‘three things list’ should have soft breaks. And you don’t need soft breaks in your second-last answer (though they won’t hurt either).</p>
      <p>When you have set up your styles, select all your text and simply ctrl-click on on your first style (‘Question’) and choose ‘Apply this style and then the next style’ – or whatever it is called in the English menu.</p>
      <p>F</p>
