      <p>I doubt this is possible with nested styles (but I'm not very experienced with them yet, so maybe a crack may can help you).</p>
      <p>What you could do: use the "next style" feature.</p>
      <p>Define in your question style that the next style should be the answer style.<br>
      If you assign the question style to a paragraph, the following paragraph will automatically be set in answer-style.<br>
      It is not quite as fast, but at least it's semi-automatic.</p>
      <p>As your document is not uniformly structured, I doubt full automation will be possible.</p>
