    html: "<p> Joe and Hrant, thanks for the feeback. <br> <br>Yes, packages are the old standby I suppose, used by Fonthead and FontDiner, among others. It seems evident that Ethan and Stu have been successful with that method. <br> <br>I am a customer at both places, and I was enticed by 1 or 2 fonts in a package and I bought a set. <br> <br>I would guess that that method would be the safest, and maybe we'll go that way. <br> <br>Still, we are curious about enticing the middle of the bell curve -- the users who have never paid a penny for a font yet have thousands on their hard drive. <br> <br>It's like honorware: You'd hope people could chip in a little bit, at least enough to make themselves feel good. <br> <br>But maybe I'm expecting too much from people who get their fonts handed to them on a silver platter. <br> <br>bj <br> <br><img src=\"https://web.archive.org/web/20150414200134im_/http://www.typophile.com/forums/clipart/happy.gif\" alt=\":)\"> </p>"
