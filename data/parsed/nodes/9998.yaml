    html: <p>BJ, <br> <br>I can't see any good reasons for selling all  <br>your fonts for a flat fee of $2. <br> <br>However, in general terms, what you're talking  <br>about sounds similar to the yearly 'pass' that <br>Miniml offers, <a href="https://web.archive.org/web/20150414200134/http://www.miniml.com/" target="_top">http://www.miniml.com</a>. Except it <br>sounds like they will offer at least 12 fonts  <br>during the one year 'membership.' <br> <br>Because your faces are one-offs of the display  <br>sort, perhaps you should consider bundling  <br>them. If a buyer can't justify $10 or $12 for a  <br>one-off, display face, perhaps they'd be more  <br>eager to buy a pack of fonts for $25 or $30.  <br>(Those prices are just for illustration.) It's the  <br>old 'bang for your buck' equation. <br> <br>I'd be curious to hear about other successful  <br>methods. <br> <br>//joe</p>
