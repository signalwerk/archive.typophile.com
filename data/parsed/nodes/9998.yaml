    html: "<p> (I think you're on the same mental train as I am with honorware.) <br> <br>&gt; We charge a nominal fee $2.00 or $3.00 for users to obtain a password .... <br> <br>Sounds like an interesting basic idea, but does that mean you're charging $2-3 dollars for a cartload of fonts? I don't get it. <br> <br>&gt; The trick is to get the tens of thousands of people who expect everything for free to pay something. <br> <br>Yes! <br>And don't forget poor-but-honest people who would pay good money for fonts, but simply can't afford/justify it: they should be able to pay *something* and get it. Not just to be nice, but because if you say \"gimme $100 or get lost\", you've just created a pirate, and an enemy. <br> <br>&gt; You'd have to entice them with original fonts made available on a regular basis. <br> <br>Note Chank's \"Font-of-the-month Club\": $100/year, right? And who was saying that he has ~200 members? Not bad. <br> <br>&gt; we'd like others to have the opportunity to use it <br> <br>Yes, not least because exposure is a huge marketing advantage. <br> <br>&gt; Sharing of passwords. Maybe dynamic passwords are possible?  <br> <br>Maybe. But don't fret over that too much anyway. <br> <br>&gt; Charging so little conveys a lack of worth to 'regular font buyers'. <br> <br>Yes. <br> <br>&gt; Amazon's Honor System <br> <br>What's that? <br> <br>&gt; How hardcore is this backlash against type being overpriced. <br> <br>Not really \"backlash\", but if you try to sell people something for too much money, they'll just sacrifice another little grain of ethics (that's all font piracy really takes away from a person, a grain of ethics) to get the font. So the price of a font should be a grain or a boulder, depending on many things that are usually accounted for (like the quality of the font), but also many things that are not, like the wealth of individual customers. <br> <br>Example: <br>Traffic fines in Finland are based partly on income, and the record fine (which was recently levied on an Internet millionaire) was over $100,000... for going [the equivalent of] 45 mph in a 30 mph zone... on a motorcycle!! <br> <br>&gt; What SHOULD a font be priced at? <br> <br>A combination of three things: <br>1. What the designer wants to charge for it. <br>2. What the market wants the price to be. <br>3. What the customer can justify to himself. <br> <br>In the current commercialware world, it's too much of #1, not enough of #3, and -most significantly- *nothing* from #3, the most important one (considering piracy is so easy and widespread/accepted). <br> <br>hhp </p>"
