ich was recently levied on an Internet millionaire) was over $100,000... for going [the equivalent of] 45 mph in a 30 mph zone... on a motorcycle!! <br> <br>&gt; What SHOULD a font be priced at? <br> <br>A combination of three things: <br>1. What the designer wants to charge for it. <br>2. What the market wants the price to be. <br>3. What the customer can justify to himself. <br> <br>In the current commercialware world, it's too much of #1, not enough of #3, and -most significantly- *nothing* from #3, the most important one (considering piracy is so easy and widespread/accepted). <br> <br>hhp </p>"
