    html: '<p> I just had an idea (and I think other "industries" do this type of thing all the time): <br> <br>You make a really good font, and then you make an inferior version of it (like with intentionally worse spacing). You charge more for the first one than for the second, explaining/citing the quality difference to [potential] customers. Crazy? <br> <br>hhp </p>'
