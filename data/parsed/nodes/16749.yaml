      <p>&gt; <em>what innovations and events occur in printing/type during the 18th century</em></p>
      <p>One very big innovation was the reform of Russian typography by Peter the Great, and the introduction of <a href="http://www.atypi.org/news_tool/news_html?newsid=340&amp;from=/" target="_blank" rel="nofollow">Civil Type</a> — a new, westernized Cyrillic style. That event laid the foundation of modern Cyrillic typography.</p>
      <p>Here are some on-line resources in English (unfortunately, they are not many):
      </p><ul>
      <li><a href="http://www.creativepro.com/story/feature/15255.html" target="_blank" rel="nofollow">John D. Berry's</a> article of 2002;</li>
      <li>Résumé of my talk at <a href="http://www.seyboldreports.com/SRDP/0dp9/D0902000.HTM" target="_blank" rel="nofollow">ATypI'94</a> in <em>Seybold Report</em>; </li>
      <li>References to Iván Káldor's essay of 1969–70 in <em>The Journal of Typographic Research</em>: <a href="http://tinyurl.com/9778m" target="_blank" rel="nofollow">Part I</a> and <a href="http://tinyurl.com/ayzvp" target="_blank" rel="nofollow">Part II</a>.</li>
      </ul>
      <p></p><p>A Web site providing more information on Civil Type and the tercentenary of Peter the Great's reform is being worked on.</p>
