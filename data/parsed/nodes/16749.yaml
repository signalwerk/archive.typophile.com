      <p>In the article that I have by Caflisch (reprinted in <em>Fine Print On Type, the Best of Fine Print Magazine</em>, 1989), he places historic developments in papermaking in conjunction with specific type designers, more scholarly than technical, but with investigative research.</p>
      <p>Not to cite too many lines from the five page article, here are a few choice paragraphs:</p>
      <ul>
      <em>"Originally papers were smoothed manually by means of an agate stone, but by the mid-sixteenth century smoother paper surfaces were achieved in German through the process of 'schlagstampfen' (strike-stamping)."
      <p>"In Holland, a method was developed by which sheets of paper were pressed between wooden rollers made from logs, the forerunners of modern satinizing calenders."</p>
      <p>"The English typefounder and printer John Baskerville, creator of the charming baroque types named after him, possessed a secret method for smoothing and evening paper. His books distinguished themselves by both the silky sheen of their paper surface and the excellent reproduction quality of his types. The German philosopher and physicist Georg Christoph Lichtenberg visited his house and shop shortly before Baskerville's death. He was shown punches and matrices but was unable to discover the secret behind the smoothing of the  papers. Certain experts believe that the paper was pressed between hot plates made of copper.</p></em>" </ul>
      <p>More theories on Baskerville's method follow, plus the article continues with developments during the times of Bodoni, Jenson, Granjon.</p>
