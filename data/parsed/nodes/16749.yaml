      <p>I believe in England and the American Colonies for the middle part of the century, and till nearly the end (when the colonies became the US), Caslon's types dominated. So the Lit. Professor could look into Caslon's history as well. See the articles by James Mosley in <a href="http://www.printinghistoricalsociety.org.uk/" rel="nofollow">Journal of the Printing Historical Society</a>. For earlier history and background Harry Carter's <a href="http://www.amazon.com/gp/product/0907259219/qid=1134398070/sr=8-1/ref=pd_bbs_1/104-3857683-9401545?n=507846&amp;s=books&amp;v=glance" rel="nofollow">'A View of Early Typography'</a> is invaluable. Caslon's types were modelled after Dutch types, and these are another important story for the Continent. And older types continued to be used on the Continent, I believe. </p>
      <p>If your friend really wants to study this in depth, he should contact the <a href="http://www.virginia.edu/oldbooks/" rel="nofollow">Rare Book School</a> at the University of Virginia. They have programs, with teachers from around the world, specifically for people with his type of interest.</p>
    html_clean: |-
