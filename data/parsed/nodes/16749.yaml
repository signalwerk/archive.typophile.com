  html: <p>I have a pal who is an 18th century compartive lit Prof. He is interested in learning more about what innovations and events occur in printing/type during the 18th century. What sources do you think are most helpful and accurate? I should mention that while he is interested to some extent in design shifts, his interest is more literary, social &amp; economic than it is design centered. So information about trade in metals needed and or paper or ink making, or the politics of printing might are fair game too. Thanks!</p>
