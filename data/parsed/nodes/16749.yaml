      <p>John Baskerville developed a number of innovations that I only know about tangentially. In addition to controversial typeface designs (and they did seem to be quite controversial in Britain and her colonies), he also developed new kinds of glossy paper, and ink. This allowed him to print with his new types, which on "normal" paper would have broken up (too many thins, etc.)</p>
      <p>The French Romain du Roi comes in at the tail end of the 1600s, with the first real type being cut around 1702, I think. That might be too early. The Fournier family must have developed some technology stuff. Didot and Bodoni come along later at the century, although I think that Bodoni's "innovations" might happen too late to be purely 18th century (???).</p>
      <p>Weren't there attempt to standardize type sizes during this century?</p>
