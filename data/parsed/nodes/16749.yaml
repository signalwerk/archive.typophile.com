      <p>&gt; <em>do you know what books or other sources there might be that describe Baskerville’s ‘new’ inks &amp; paper?</em></p>
      <p><a href="http://www.linotype.com/7-345-7/maxcaflisch.html" target="new" rel="nofollow">Max Caflisch</a> presented a paper at a symposium of book publishers in Switzerland, 1973. The paper is titled <em>An Investigation of the Interdependency of Paper Surface, Printing Process, and Printing Types</em>, and in it there are references to paper refinements of the 18th century (including efforts of John Baskerville).</p>
      <p>This paper was translated into English (by Inga Wennik, a friend of mine) and published with permission in <em>Fine Print</em> magazine, October, 1983.</p>
      <p>At the end of his paper, Caflisch cites his reference material, but you might find this and more in <em>Fakten zur Schriftgeschichte</em>, by Max Caflisch, privately printed, Zurich 1972, or his <em>Schrift und Papier</em>, Grellingen 1973.</p>
    html_clean: |-
