  html: "<p>Dear Typophiles, <br> <br>I'm doing an identity for a company who's main interest is building loghouses. They import the wood from Russia and intend to erect the houses in Denmark mainly. Quality is excellent and the prices are low. (In short: a very good deal) <br> <br>Well, I could really use some creative inputs regarding the logoshape and the typography. I've been through quite a bunch of ideas which I've included here. I want to make a simple shape that's unique and remarkable which illustrates: quality and affordable loghouses - and good for the environment. <br> <br>Quite a hard task <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\"> <br> <br>Thank you in advance guys! <br> <br>/Henriko <br> <br> <br><img src=\"http://www.typophile.com/forums/messages/4100/20919.jpg\" alt=\"Carpenta logolayout 2003\"></p>"
