    html: <p>Henrik, what you are hoping for (with the logo) is more than can be expected. Make a nice simple unique mark, and let the marketing department worry about creating the positioning of the product. Do you see your mark existing without a tagline or a photo of the luxury log houses, probably not. You might think of process to imply luxury (gold stamping, blind embossing). Ask the marketing department for a profile of the average buyer, demographics. That might help you skew your mark towards that group. Just some thoughts </p>
