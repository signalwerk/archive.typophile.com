    html: <p>Out of the four ideas here I think the second is the most engaging. Luxury Loghouses? My grandfather lives in a machine made log house that was built on-site in Oregon USA which is very nice and that house in my mind goes best with number 2 option. <br> <br>To my eye number 1 looks too obvious/American. Number 3 looks like an Interior design store or high end hardware store and number 4 looks like a lumber or paper company. <br> <br>Also the type in number one and 2 I prefer over 3 and 4. It looks modern but not <b>expected</b> so it is nicer. <br> <br>I don't have alternatives to suggest right now (type or design) I have to run for a train!  I'll look in again soon. Keep it up! <br> <br>Jon</p>
