    html: "<p>Jon, I think the typography in the first 2 say \"luxury\" more than the last 2. The illustration in #2 does not say \"luxury\" to me: it looks more like a mobile home. Assuming, as Hrant said, that the target audience wants some of that \"I live in nature\" experience, I think the logo in #4 might be on the right track. Maybe the two sides of the logo could be staggered a bit, so that they still suggest a tree but also suggest the interleaving of logs. (The current form looks similar to both Boise-Cascade's and Weyerhauser's logos -- not good associations for your target market, I'd guess.) <br> <br>To my eye, the blue/green colors don't say \"luxury\" or \"nature\" -- they're a bit too saturated for that, I think. Something more earthy and dark might better communicate both \"nature/environment\" and \"high-quality.\"</p>"
