    html: <p>Luciano, <br> <br>Don Paul is an attractive face, especially the lowercase. <br> <br>Admittedly, I don't have much typographic education, so many typefaces referenced on these boards are matters of research for me. <br> <br>That said, while I really like your v and w, and the way you've given them points at the baseline, they suprise me in that they don't follow the geometries established by the a, b, d, m, n, p, q, and y. <br> <br>Is this a direct result of one of Paul Renner's designs? <br> <br>I also really like the i and j and the way they seem to enhance the set while departing significantly from the motiffs of the majority of the other characters. <br> <br>Also, can you describe to me the significance, or tradition perhaps, of designing a very conservative uc, and then a lc that is so playful?</p>
    html_clean: <p>Luciano, <br> <br>Don Paul is an attractive face, especially the lowercase. <br> <br>Admittedly, I don't have much typographic education, so many typefaces referenced on these boards are matters of research for me. <br> <br>That said, while I really like your v and w, and the way you've given them points at the baseline, they suprise me in that they don't follow the geometries established by the a, b, d, m, n, p, q, and y. <br> <br>Is this a direct result of one of Paul Renner's designs? <br> <br>I also really like the i and j and the way they seem to enhance the set while departing significantly from the motiffs of the majority of the other characters. <br> <br>Also, can you describe to me the significance, or tradition perhaps, of designing a very conservative uc, and then a lc that is so playful?</p>
