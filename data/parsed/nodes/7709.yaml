    html: <p>Hey, Don Paul* looks pretty good! Good use of gray to bend the bodies. The only problem (which makes me suspect you're working on MacOS) is that in some places the blur is too strong, like your diagonals, the bar of the "A", etc. This problem is more severe in the light weight of Renex, especially where you're filling counters with adjacent light grays (like in the "o").** The bolder Renex is much better - which is normal - the compromises vary depending on weight, and furthermore are easier to swallow above 1-pixel stems. <br> <br>* BTW, not "Don Paulo"? <br> <br>** Avoid abutting two pixels lighter than ~160. <br> <br>hhp</p>
    html_clean: <p>Hey, Don Paul* looks pretty good! Good use of gray to bend the bodies. The only problem (which makes me suspect you're working on MacOS) is that in some places the blur is too strong, like your diagonals, the bar of the "A", etc. This problem is more severe in the light weight of Renex, especially where you're filling counters with adjacent light grays (like in the "o").** The bolder Renex is much better - which is normal - the compromises vary depending on weight, and furthermore are easier to swallow above 1-pixel stems. <br> <br>* BTW, not "Don Paulo"? <br> <br>** Avoid abutting two pixels lighter than ~160. <br> <br>hhp</p>
