    <p>Hello Typohilers,</p>
    <p>I'm hoping someone can help.  I have been looking for info on how to change the font menu display in Word 2007.  The default setting is for the actual style of the font as well as the font name to be displayed.  This is quite advantageous for most users, but we want to turn that feature off and revert back to the old display where the font menu just displays the font name in a standard font for all fonts listed.</p>
    <p>Having searched high and low, we can't seem to find an answer. </p>
    <p>We work a lot with barcode fonts, and it is proving problematic just seeing the barcode characters in the font menu rather than the font name.</p>
    <p>Any help is appreciated?</p>
    <p>Many thanks<br>
    Neil</p>
