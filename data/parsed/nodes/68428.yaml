    html: |-
      <p>On most versions of Word you can find the menu item to shut it off in Tools:Customize then you should see a checkbox for 'WYSIWYG Font Menus' uncheck this. You maybe have to restart the application. </p>
      <p>I only checked this in Word:Mac I have Office2010beta running on Windows.</p>
