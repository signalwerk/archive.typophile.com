      <p>Si:<br>
      MS Office Mac (including Word) seems to place font names on its list in some non-standard way. Many fonts appear way down where the foreign scripts appear. I don't know who is at fault here. I am just saying that the Microsoft Apps are the only ones that have this anomaly. All the Adobe and Apple apps (and all others I have seen) look correct.<br>
      I am using Mac Office version 2008.</p>
      <p>Chris</p>
