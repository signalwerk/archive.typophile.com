      <p>&gt;However now to find tools:customise option on Word 2007 for Windows...</p>
      <p>I'm not sure if what you want is here, but you find Tools by going to the Windows thingy in the top left (where you go for Print or Save As). At the bottom of that is a button for Word Options (next to Exit Word). There is a customize option in there, which may have what you want.</p>
      <p>No, I'm not a Word expert. (I hate Word 2007). But I had to use help this afternoon to find the options on Excel, and just looked and see it is the same in Word.</p>
      <p>Hope this helps.</p>
