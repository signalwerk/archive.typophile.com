    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;:&nbsp;Uncial</strong></p>
    <p>Uncial letters, as well as <a href="/node/add/wiki?edit%5Btitle%5D=Half%20Uncial" title="Create node &quot;Half Uncial&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Half Uncial</a>, evolved from Greco-Roman handwriting. during the mid to late Antique&nbsp;period.</p>
    <p>Uncial letters are often classified as being thoroughly Irish, but this is misleading at best, and inaccurate at&nbsp;worst.</p>
    <p>Like almost all Roman things, there were western (<a href="/node/14508" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Latin</a>) and eastern (<a href="/node/14789" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Greek</a>) styles and variants. These would continuously influence each&nbsp;other.</p>
    <p>St. Patrick and other Catholic Missionaries most likely brought Uncials to Ireland in the fifth century. Over the next four hundred years, Irish monks would copy (and re copy) virtually all of classical literature, bringing it back to an (ungrateful) continent during the&nbsp;700s–800s.</p>
    <p>While the Irish monks were busy writing out old Greek and Latin books, they also wrote their own national legends down as well—in the same handwriting style, of course, and in Gaelic (or whatever exactly the were speaking at the time). Unlike the religious texts, these stayed at home when the missionaries went to Europe to go&nbsp;a-preaching.</p>
    <p>Around this time, Charlemange commissioned his <a href="/node/13704" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Carolingian Minuscule</a>, which are decidedly less decorative than uncial letterforms, yet still influenced by them. Charlemagne’s court would have had a slew of Irish manuscripts at hand, but also books written in the (by now very different) Iberian uncials, Byzantine uncials, as well as any number of current Italian&nbsp;hands.</p>
    <p>The Viking raids may have ended the glory days of Irish monasteries and book <a href="/node/20454" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">illumination</a>, but they did not pull uncials (or Gaelic) away from Ireland. Gaelic text remain written in uncial styles in Ireland to this very day, including street&nbsp;signs.</p>
