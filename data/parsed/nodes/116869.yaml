    <p>Hi,<br>
    First, I’m kind of new to this.<br>
    I’m about to create a Script font and I have some problems with the lower “r” and the other lower glyphs connected to it.</p>
    <p>Am I supposed to do a ligature for every lower letter connected to the lower “r”? That sounds weird.<br>
    When I look at my script fonts installed on my computer there are no big amount of ligatures.</p>
    <p>There must be some other solution to it.<br>
    When I look at fonts on MyFonts, like Ciao Bella, there are no ligatures for the lower r but when I write it in the “Sample text” field there is a more accurate connection between the lower “o” and the lower “r” and the “e” and the “r” and so on.</p>
    <p>Any smart and simple solution to this?<br>
    Please help me.</p>
    <p>Thank you.<br>
    Andreas</p>
