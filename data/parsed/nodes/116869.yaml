    <p>There must be some other solution to it.<br>
    When I look at fonts on MyFonts, like Ciao Bella, there are no ligatures for the lower r but when I write it in the “Sample text” field there is a more accurate connection between the lower “o” and the lower “r” and the “e” and the “r” and so on.</p>
    <p>Any smart and simple solution to this?<br>
    Please help me.</p>
    <p>Thank you.<br>
    Andreas</p>
