      <p><em>How did you achieve the paint effects?</em></p>
      <p>Traditionally these techniques involve underpainting in a base colour and then applying successive washes or glazes of broken colour over the top. Different tools (rags, sponges, feathers, specialist brushes) are used to break or figure the colour according to what kind of texture is to be achieved. Further layers of coloured glazes and varnishes add tinted but translucent depth to the finish. It was a pretty labour intensive traditional craft, that had a revival during the 80s and early 90s, but these days it can be successfully mimicked in PhotoShop if one has the time and patience.</p>
      <p>To my lasting regret I once left behind a quantity of embossed and coloured 'antelope hide' paper in a house move. I think it came from a bookbinders suppliers.</p>
