    <p>Hey I am looking for some cool ideas for business cards and letterhead stock and some cool printing techniques to make some fancy cards. I know there was a thread lying around that was talking about new techniques (anyone got the link?)</p>
    <p>Personally I like really smooth matte cards that feel like nice book covers, thick gsm stock (though maybe not for this particular card) UV Printing, Die cuts for rounded corners...</p>
    <p>For this project (oh its for Dolce Vita Day Spa :P) I am thinking a card like Nordstroms or something, It will need some metalic for the logo, but the rest is up in the air. Hopefully I can get the clients to spend and get some really nice cards. So let me know any techniques you think may be cool for this one. </p>
    <p>Also the clients were wondering about stock that looks sort of like a cracked marble surface or something for the letterheads and maybe business cards. Any ideas?</p>
    <p>Thanks!<br>
    -Jesse</p>
