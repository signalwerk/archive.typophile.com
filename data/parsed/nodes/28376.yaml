      <p>The thread you mention is at</p>
      <p><a href="http://typophile.com/node/21154" title="http://typophile.com/node/21154">http://typophile.com/node/21154</a></p>
      <p>As for <em> stock that looks sort of like a cracked marble surface or something</em> you may get better results by photographing and printing such a surface rather than relying on a paper or card stock to imitate it. I used to do paint effects like marbling and wood graining, and you can get a lot more control over the end result that way.</p>
