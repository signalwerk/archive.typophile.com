      <p>A nice blind emboss or well placed foil can be great. </p>
      <p>To me, the customer screams more when they really want less. Your job is to really sell a good solid design that will be cost effective for them over time. The more elaborate ideas you described that they want will get pretty expensive and they would be tied to the printer/paper manufacturer. Good design will make you more money, while allowing the customer flexibility in producing good design. I am not saying to skimp on quality printing or paper.</p>
      <p>Oh heck, make the typophiles happy and have the customer spend money on fonts that will really differentiate them from the competition.</p>
      <p>The Truth shall set you free</p>
