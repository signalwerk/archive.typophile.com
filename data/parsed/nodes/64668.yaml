      <p>I’ve skimmed it; I wish it had been around when I was in design school futzing my way through similar ideas and exercises on my own. It would be a good course book for a course in lettering or as supplementary material to a typography program. For someone who already knows lettering and type design it’s just going to collect dust. It’s certainly not the grail of type design theory some people want, but it’s also not titled <em>Designing Type</em>…</p>
      <p>I think Jackson was referring to the contributors list being absurd. Some of those people are dead, so it’s rather a stretch to list them alongside those living designers who contributed directly to the book.</p>
