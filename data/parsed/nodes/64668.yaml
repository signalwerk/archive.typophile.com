    html: |-
      <p>Just read it. As a primer, I think it’s a pretty good book. What I especially like about it is that it has a pleasantly tool/purpose agnostic approach. Not that it does not introduce the underlying pen based structure of latin type through text and an exercise. But instead of just introducing the broad nipped pen and text type as the holy grail, it provides a lot of other (good) examples of how to approach the design and use of letters (not only type, but letters in general); lettering, display, script, etc.<br>
      If the intent of the book is to open up the field of type design to newcomers and to invite to creativity, I think it is doing it quite well.</p>
