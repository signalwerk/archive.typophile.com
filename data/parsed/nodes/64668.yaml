    date_raw: 27.Dec.2009 5.34pm
    votes: null
    html: |-
      <p>I recently received a copy of the book, and have been looking through it. First of all, my “one page per contributor” assumption was way off; the contributions are not integral/sequential, they’re intertwined in the content of the book - which is not surprising, and actually a relief.</p>
      <p>The book is quite nice. Small in size, but not at all skimpy. It leans a bit towards the display end of the type spectrum, but nonetheless contains decent technical discussions. I can see how it would be a great eye-opener for people wanting to get into type design, and I think it can work very well in supporting a type design course. It really has a little bit of [almost] everything, so it nicely reveals how large this iceberg is.</p>
      <p>But since no review is complete without at least a gripe: the text size is a bit small; maybe 1/2 or 1 point larger (with less leading) would’ve been nicer.</p>
      <p>hhp</p>
