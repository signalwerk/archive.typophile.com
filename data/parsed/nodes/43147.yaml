    html: |-
      <p>As for reflow, it can be hard to say with certainty, but I'd agree with Eben Sorkin. That does leave kerning; if you were using Quark for example, and had any kerning beyond what was imported from the foundry font metrics, it will not be included in the new OT font unless you add it.</p>
      <p>If there was no external kerning, all you need do is to make a kern feature for the OT version (and have at least one GSUB feature in case the font winds up being used with an older Adobe program).</p>
      <p>Conceivably, if you combine two fonts into one, there could be some differences. For example, if you had a regular font and a separate "expert" font in Type 1 format, and now put those glyphs into a single OT font, there might be some differences with any kerning involving spaces. For example, if there was a "space"-"a" kern in the Type 1 expert set, but in using it, you put in a font change just after the space &amp; before the "a", the kern probably wouldn't take effect. But if they are now in one font, and the "a" is small-capped by an attribute change, the kern would take effect. </p>
      <p>Think of it like this: essentially, a .otf opentype font is a just a wrapper around a PostScript font. You control the wrapper, and except for any GPOS features you might add, or fail to add, all the metrial data should stay the same.</p>
      <p>But layout programs can have bugs too, so some small reflow changes just might occur. But if you change fonts there will certainly be reflow, so how big an issue can this be?</p>
      <p>FWIW</p>
