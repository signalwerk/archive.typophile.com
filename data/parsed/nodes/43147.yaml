    html: |-
      <p>I think your first scenario (<em>Leave the font as is, keep using the Type 1 and hope it lasts with no compatibility issues</em>) is reasonable for the time being.</p>
      <p>I know of only one current Type 1 compatibility issue: Type 1 fonts will not show up in the font menus of applications written to take advantage of the Windows Presentation Foundation, the graphical subsystem that ships with Windows Vista and can be installed on Windows XP SP2 and Windows Server 2003. The earlier graphical subsystem, GDI, is still available under Vista, and applications using GDI still work. </p>
      <p>As far as I know, if you are not using Windows, compatibility issues are not yet a concern. If you are using Windows, compatibility issues will not be a concern until you acquire or upgrade to applications written for the Windows Presentation Foundation. Even then, if your publishing applications are from Adobe, there is a chance that Type 1 fonts will still be supported (see Thomas Phinney's blog: <a href="http://blogs.adobe.com/typblography/2005/10/phasing_out_typ.html" title="http://blogs.adobe.com/typblography/2005/10/phasing_out_typ.html">http://blogs.adobe.com/typblography/2005/10/phasing_out_typ.html</a>).</p>
      <p>I understand why you want to drop your old Type 1 font library, but I think you have plenty of time to decide whether scenario 2 or 3 is the better replacement option for the Casady and Greene San Serif. </p>
      <p>By the way, you may have one more option, depending on your platform. Fluent Laser Fonts for Windows were issued in TrueType as well as Type 1. Instead of converting your Type 1 fonts, you could try to locate the existing TrueType versions, which will continue to work under Windows Presentation Foundation,</p>
