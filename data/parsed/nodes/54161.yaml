    html: |-
      <p>Using the list from “The Elements of Typographic Style” by Robert Bringhurst I choose:</p>
      <p>Serifed<br>
      Bembo 1929<br>
      Palatino 1948<br>
      Minion 1989<br>
      Scala 1991 (date of publicly issued)<br>
      Caecilia 1991</p>
      <p>Unserifed<br>
      Futura 1927<br>
      Gill Sans 1927<br>
      Frutiger 1975<br>
      Avenir (1988)- this one dont show on book list<br>
      Scala Sans 1994</p>
      <p>This is a simple list. I dont give it special credit. I choose some font I like, not special criteria...</p>
      <p>António</p>
