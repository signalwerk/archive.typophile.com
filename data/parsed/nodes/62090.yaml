    <p>Hair Peace  Download this code to create colourful hairy creations from .svg files. You’ll need to download Nodebox to open the file. I’ve included a few sliders to alter a couple of variables but feel free to play with them all. You can change the .svg image as well, so get growing. Who did this? CPD-WORK did and is the work of Designer Chris Davenport.</p>
    <p>Go Mr. Davenport! His Portfolio here&gt; <a href="http://cpd-work.com/" title="http://cpd-work.com/">http://cpd-work.com/</a><br>
    You will also need NodeBox For this!get that here&gt; <a href="http://nodebox.net/code/index.php/Home" title="http://nodebox.net/code/index.php/Home">http://nodebox.net/code/index.php/Home</a></p>
    <p>Click here 2 download project file! <a href="http://beingmadeby.cpd-work.com/Misc/hairy.zip" title="http://beingmadeby.cpd-work.com/Misc/hairy.zip">http://beingmadeby.cpd-work.com/Misc/hairy.zip</a> </p>
