    html: <p>BEST SHIP LOADING is probably a Hellenic Wide or Antique Extended. Best version I know is <a href="http://www.veer.com/partner/link.aspx?i=1048&amp;c=4&amp;p=products/typedetail.aspx?image=JBT0000096" rel="nofollow">Jason Walcott's</a> but there are also variations by Nathan Williams (<a href="http://www.fontshop.com/fonts/singles/baseline/58_rodeo/" rel="nofollow">58 Rodeo</a>) and Erik van Blokland (<a href="http://www.fontshop.com/fonts/downloads/fontfont/ff_zapata/" rel="nofollow">FF Zapata</a>.</p>
