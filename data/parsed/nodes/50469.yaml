    <p>Hey, I'd be grateful if anyone could identify the font for the text "Emerald Isle"<br>
    Found Here:<br>
    <a href="http://farm1.static.flickr.com/124/366438290_900397336e_o.jpg" title="http://farm1.static.flickr.com/124/366438290_900397336e_o.jpg">http://farm1.static.flickr.com/124/366438290_900397336e_o.jpg</a></p>
    <p>Also if anyone can identify "The Best Ship Loading!" font as well. In fact if anyone knows who made these fonts back in the 19th Century, I'd be very interested.</p>
    <p>Cheers</p>
