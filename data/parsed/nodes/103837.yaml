      <p>Look to the seminal metal band, Black Sabbath, for origin clues.<br>
      Apparently Geezer Butler was the guy interested in black magic, a fan of Dennis Wheatley.<br>
      As a young teen in the 1960s I too had read Wheatley, for the frisson of the occult.<br>
      But the associated graphic imagery never used blackletter, not on book covers, not on movie posters.<br>
      And the same was true for Dracula, Frankenstein, etc. Even Nosferatu.<br><img src="/sites/default/files/old-images/Wheatley_4248.jpg"></p>
      <p><em>Sabbath Bloody Sabbath</em> connects the dots, with the runic, occult, Nazi “SS” (later part of the Kiss wordmark).<br><img src="/sites/default/files/old-images/220px-Black_Sabbath_SbS_5427.jpg"><br>
      Nazi symbolism was taken up by rock musicians of various stripes in the 1970s, for its shock and transgression value. I would argue that blackletter came to metal for its Nazi connotations, although its mediæval quality is not out of keeping with other aspects of the genre.</p>
