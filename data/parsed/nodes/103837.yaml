      <p>You should study the discographies of metal bands in the 1970s, in particular the album covers, to see when and where the trope emerged.<br>
      The seminal bands did not use blackletter until the early ’70s.<br>
      The style was generally more glam than goth at ﬁrst.<br>
      A lot of the gothic subsequently came from the punk ethos, eg the Damned (Dave Vanian).<br>
      Mötorhead’s look came more out of the British rocker tradition.<br>
      Hawkwind (psychedelic rock?)—from which Lemmy was ﬁred—was an early adopter of blackletter.</p>
      <p>This from 1972 has a strong Art Deco influence (popular retro at the time), but there’s a bit of darkness and the lettering leaning towards blackletter:<br><img src="/sites/default/files/old-images/220px-Doremi_Fasol_Latido_-_Hawkwind_6028.jpg"></p>
      <p>CSNY had blackletter on their 1970 <em>Déjà vu</em> album, but the connotation was quite different from gothic.<br><img src="/sites/default/files/old-images/CSNY_5243.png"></p>
      <p>here’s an early one, Rainbow’s Rising, 1976</p>
      <p> <img src="/sites/default/files/old-images/Unknown_4747.jpeg"></p>
      <p>Earliest? (1973):<br><img src="/sites/default/files/old-images/220px-Black_Sabbath_SbS_5427.jpg"><br>
      You could maybe contact Drew Struzan, the artist.</p>
