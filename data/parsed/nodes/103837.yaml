      <p>This subject has come up before, though I can't locate the thread. Heavy-metal music burst on the scene in the US and UK in the 1960s and 70s, and the musicians and their fans were mostly children of the generation that fought in WWII.<br>
      Blackletter resembles Fraktur, which is commonly associated with the Third Reich (even though they officially banned its use in 1941). As Nick points out, it was the perfect branding for music that was meant to piss off your dad--the letterforms of the enemy he fought against in the War.<br>
      That's not why they used blackletter on "Aqualung." Side 2 of "Aqualung" is subtitled "My God" and consists of five songs that mock the hypocrisy of the institutional church, and I suspect that they used blackletter to evoke the look of Bibles and other church documents.</p>
