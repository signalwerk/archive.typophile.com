      I don’t know who did the lettering.<br>
      It ﬁrst appeared on this (note the art deco): <img src="/sites/default/files/old-images/Enlightened_Rogues_4492.jpg"><br>
      At the time, there was an emerging interest in popular culture, and a nostalgia for its roots.<br>
      Technically, in its intricacy and skill, the style of old commercial art lettering represented a direction for free-form psychedelic lettering to take.<br>
      But that’s a very different aesthetic to the undead goth thing, which was more about hard drugs and headbanging than spacing out on psychedelics.</p>
