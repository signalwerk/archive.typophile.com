      <p>One of the first rock albums showing classic blackletters on its front and back covers was probably Jethro Tull's "Aqualung" (1971):<br><img src="/sites/default/files/old-images/Aqualung_6011.jpg"><br>
      [The Fette Gotisch typeface (with a misplaced x instead on an r in Jethro) on the original vinyl release was replaced by Notre Dame in subsequent re-editions.]</p>
      <p>For some reason, Ian Anderson decided to pack his "bunch of songs" inside an antique/medieval visual framework, an it was there that the blackletters played a role. Nothing to do with Jethro Tull being a "Hard Rock" or "Heavy Metal" band.</p>
      <p>In 1976, Ritchie Blackmore's Rainbow (as noted in a previous post) and Judas Priest released "Rising" and "Sad Wings of Destiny":<br><img src="/sites/default/files/old-images/Raising-Sad_4297.png"><br>
      These were true "Hard Rock" albums, but it is my impression that the choice of blackletters for the visual framework had to do with the epic/magical/medieval aspects of the music and the lyrics, rather than with the kind of music itself. In fact, Rainbow changed their logo a few years later for the release of "Down to Earth" (1979), and Judas Priest sticked to classic blackletters for just one more release ("Sin After Sin", 1977). In both cases, although the music remained great Hard Rock, the epic/magical/medieval themes were, for the most part, gone.</p>
      <p>However, after departing from Rainbow, shortly after their last "blackletter logo" release ("Long Live Rock 'n' Roll", 1978), Ronnie James Dio's solo career was accompanied from the beginning to the end with classic blackletters:<br><img src="/sites/default/files/old-images/Dio_4504.png"><br>
      Dio always sticked to epic/magical/medieval/fantastic themes for his masterful Hard Rock,  an this is why, in my opinion, classic blackletters were always present in his releases as well as in his live shows.</p>
      <p>These are just a few examples (many others could be found outside the Hard Rock realm) showing that classic blackletters in music, as well as in many other arts, have to do mainly with the subject being contained in it, and not so much with how this subject is expressed.</p>
      <p>The modern trends concerning Black/Doom/Death/Gothic/... Metal, are just another story ...</p>
