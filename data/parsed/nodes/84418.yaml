      <p>That's a very interesting question!<br>
      The logo of AlJazeera is a calligraphic interpretation of the word 'Aljazeera' in Arabic. The logo can be read by native eyes fairly easily. But this is only a sign of a 'good'  and functional design. The same word could be rendered completely unreadable by another designer. Case in point, your second picture. That picture is, of-course, a horse. It is formed by Arabic letter forms. I'm pretty sure it is also contain coherent words. But if the intention was to be readable, it has failed the intention. Otherwise it is generally a common practice to use alphabetic forms to produce a visual form which is not meant to be read. I should add I do not understand Arabic and for a native Arab it may be somewhat easier to decipher the words hidden in the horse. But generally when you go that far, you really are not writing something to be read! It's meant to be seen.<br>
      Oh by the way, the first lines disappearing in the first animation are mostly ornamental but not randomly placed. Those lines are the extension of the extremity of several letters. They are used to create a visual balance in the calligraphy. But since they have a 'legitimate' presence, they do not diminish the ability of a native eye to read the word in the logo.</p>
