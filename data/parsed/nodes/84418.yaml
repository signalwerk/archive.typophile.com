    <p>Hello,</p>
    <p>First I would apologize if I write something wrong, I'm not English and I'm learning the language.</p>
    <p>My question is: What rules exist for Arabic typography logos? I put this example:<br>
    <a href="http://en.wikipedia.org/wiki/File:Al_jazeera_Calligraphy_Animation.gif" title="http://en.wikipedia.org/wiki/File:Al_jazeera_Calligraphy_Animation.gif">http://en.wikipedia.org/wiki/File:Al_jazeera_Calligraphy_Animation.gif</a></p>
    <p>I don't understand the Arabic language and I don't know if the logo can be clearly read the meaning. I would like to know the function of the first lines disappear (see the beginning of the animation).</p>
    <p>I would appreciate a little analysis of the logo and the following link:<br>
    <a href="http://www.limeshot.com/images/blog/logos/horse.png" title="http://www.limeshot.com/images/blog/logos/horse.png">http://www.limeshot.com/images/blog/logos/horse.png</a></p>
    <p>thank you very much</p>
