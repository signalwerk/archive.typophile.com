    html: <p>Note that the wikipedia animation is misleading, the logo is based on <a class="freelinking external" href="http://www.google.com/search?q=Diwani+calligraphy&amp;tbm=isch" rel="nofollow">Diwani calligraphy</a> and thus the shapes are pretty normal relative to that specific style of Arabic calligraphy which is quite different from the simplified Arabic at the binging of that animation (seriously, who in his right mind would compare a Diwani based logo to Arial!).</p>
