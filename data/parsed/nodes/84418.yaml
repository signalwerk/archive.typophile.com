      <p>Too bad you can't read Arabic. I have written an article with some analysis and useful links on the <a class="freelinking external" href="http://arabictype.wordpress.com/2011/05/31/tugra" rel="nofollow">Tugra</a>, which is a calligraphic device that is the basis of this logo. The article is in Arabic, but do check it out. You can also google the word 'tugra'. You will find a lot of material that will help.</p>
      <p>Khalid</p>
      <p>PS: It's nice to know that we have Behnam and Bahman here. I used to work with an official in the Iraqi government called Behnam. International Consultants called him Benham. Probably, yet another good example of 'unity and variety'. And, Alch, please update your profile and tell us more about who you are. Finally, the calligraphic style in the Al-Jazeera logo is Diwani.</p>
