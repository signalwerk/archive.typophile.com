      <p>If you want to design an arabic calligraphic logo I think you need somebody who is able to read arabic and one calligrapher. there are no rules, It's just about understanding of rhythm, design and deep knowledge of the writing system, either it's Nasta'liq or Diwani. second picture is an ornamental calligraphy (similar to tughra) and not a subtle one in my opinion and I agree with khaled, this animation is very bad way of interpreting the logo.</p>
      <p>some good examples in Persian/arabic:<br>
      <a href="http://www.qoqnoos.com/body/graphic/JABARI/p02.jpg" title="http://www.qoqnoos.com/body/graphic/JABARI/p02.jpg">http://www.qoqnoos.com/body/graphic/JABARI/p02.jpg</a><br>
