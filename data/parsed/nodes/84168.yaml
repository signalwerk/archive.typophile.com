      <p>One could conceivably have a Romanian text that includes a Turkish name that uses the S cedilla, like Şahin. In this case, the S cedilla would be the correct character and it would be wrong to replace it with the S comma. Indeed, it would be wrong even to change only its appearance to look like the S comma. Unfortunately, there's no way of dealing with this kind of thing automatically at the font level. Someone will just have to deal with the encoding of the text manually.</p>
      <p>It is indeed highly unfortunate that so much Romanian text is incorrectly encoded.</p>
      <p><cite>As far as I know, Tcedilla does not actually occur in any language.</cite></p>
      <p>That may be true, but it does occur in specialist contexts. The phonetician Luciano Canepari uses the small t cedilla in his own extension of the International Phonetic Alphabet (IPA) to represent the sound that would be written tʲ in the usual IPA. He similarly uses b, d, h, m, n, p, z, and some other phonetic symbols with cedilla.</p>
