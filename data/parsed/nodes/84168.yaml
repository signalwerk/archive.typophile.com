      <p>Feedback from Microsoft's Romanian users indicated that they preferred consistency, so that if software is unable to correctly display S/s with comma-like accent it is judged best if the T/t is also not displayed with comma-like accent. So now I design</p>
      <p>U+015E S with cedilla<br>
      U+015F s with cedilla</p>
      <p>U+0162 T with cedilla<br>
      U+0163 T with cedilla</p>
      <p>U+0218 S with comma-like accent<br>
      U+0219 s with comma-like accent</p>
      <p>U+021A T with comma-like accent<br>
      U+021B t with comma-like accent</p>
      <p>and then I perform a ROM+MOL 'locl' substitution of the cedilla forms of both S/s and T/t to the comma-like forms.</p>
