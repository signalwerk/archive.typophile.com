    <p>Greetings</p>
    <p>Adobe has released in the AGL changes such as <strong>Tcommaaccent</strong> and <strong>Tcedilla</strong>, but I do not understand when and where its use. </p>
    <p>I saw the unicode codepoint of the Tcommaacent uppercase (uni0162/uni021A) and uni0163/uni021B for lowercase</p>
    <p>I'm not native speaking of these glyphs, So can anyone explain the substitution of them?</p>
    <p>Thank you so much.</p>
    <p>Best regards</p>
