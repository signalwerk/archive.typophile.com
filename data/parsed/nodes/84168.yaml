      <p>If you're going to do those sorts of substitutions, better for text-preservation purposes to build a glyph named "Scedilla.alt" (or something like that) to get the comma accent form, rather than literally substituting the default glyph for one codepoint by the default glyph for another codepoint. The latter kind of substitution is considered bad form; that's why features such as 'crcy' and 'dpng' have been deprecated.</p>
      <p>Cheers,</p>
      <p>T</p>
