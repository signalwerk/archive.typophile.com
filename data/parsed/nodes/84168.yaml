      <p>That's my point.</p>
      <p>Please forgive me if there is a language barriers here. I have written inaccurate without the express reason that I have researched some fonts that did not substitute them for the script TRK and  Azeri on locl features. The example:</p>
      <ul>feature locl {<br>
       # Latin<br>
       language AZE  exclude_dflt; # Azeri
      <ul>sub i by i.dot;</ul>
      <p> language TRK  exclude_dflt; # Turkish</p>
      <ul>sub i by i.dot;</ul>
      <p> language MOL  exclude_dflt; # Moldavian</p>
      <ul>sub [Scedilla scedilla] by [Scommaaccent scommaaccent];</ul>
      <p> language ROM  exclude_dflt; # Romanian</p>
      <ul>sub [Scedilla scedilla] by [Scommaaccent scommaaccent];</ul>
      <p> language CRT  exclude_dflt; # Crimean Tatar</p>
      <ul>sub i by i.dot;</ul>
      <p>} locl;
      </p></ul>
      <p>But your explanations meet my question.</p>
      <p>Thank you for your time and your willingness to share knowledge</p>
      <p>Best regards<br>
      Andi</p>
