      <p>The example you give looks almost correct to me. There's no reason for TRK, CRT, or AZE to include any substitutions involving Tcedilla or Scedilla in the locl feature. ROM and MOL, though, should include Tcedilla as well as Scedilla to deal with cases where the text includes uni0162/uni0163 rather than the preferred uni021A/uni021B.</p>
      <p>André</p>
