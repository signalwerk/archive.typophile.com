    html: "<p>Thomas, in this case though, since the purpose of the substitution for ROM and MOL is to visually correct an encoding issue, one could make the argument that having the parseable glyph name point to the desired character rather than the originally encoded one makes some sense. This depends very much, however, on the desired behaviour of parsed PDF text and how it is likely to be used by native users: even if the newer disunified Unicode characters are technically preferred, they won't help anyone used to working with the older unified encoding.</p>"
