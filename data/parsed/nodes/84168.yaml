    html: |-
      <p>I would buy that argument more if all PDF creation would give the same results and if indeed the font could affect the underlying text in general. But that isn't the case here. When creating a PDF from a document using this font, you'll get a transform of the text encoding in some cases, but not others, depending on the workflow used to create the PDF. That seems undesirable.</p>
      <p>It seems to me that you don't want changes in what characters work in (for instance) a search when going from source document to PDF, and especially not if the occurrence of those changes is unreliable and inconsistent. (From a typical end user POV, at least; I know that you and I know how to trigger them.) So I'm suggesting is that "always give the desired visual appearance, but never change the text encoding" is a good rule of thumb. Let a sophisticated user do such transformations by search and replace if they need them, but don't sneak transformations in corner cases of PDF creation.</p>
      <p>Regards,</p>
      <p>T</p>
