      <p>Beat, it's amazing the difference Fractional advance widths make. Now, if Chrome uses "compatible" widths then the spacing problems I see on some web fonts (and my fonts, sadly) are within this kind of advance width, as this is my usual browser. I have IE9 and FF5 (with DirectWrite rendering activated) and I think fonts look amazing there, but prefer, at least for now, to use Chrome (and GDI) because it's what other people use and see (and Chrome just works better;).</p>
