      <p><strong>ClearType rendering does <em>not</em> generally ignore TrueType instructions in x-direction. It merely rounds them differently, and it bypasses distorting deltas.</strong></p>
      <p>Greg has included some of my internal notes at the time in his post  <a class="freelinking external link-external" href="http://www.microsoft.com/typography/cleartype/truetypecleartype.aspx" rel="nofollow">Backwards Compatibility of TrueType Instructions with Microsoft ClearType</a>. Some of these are gory details from a tight-rope walk between broken “hinting” code and making the result “look nice” anyway. But most of these “jury rigs” can be switched off as described in Greg’s post and in <a class="freelinking external link-external" href="http://www.beatstamm.com/typography/RTRCh4.htm#Sec12" rel="nofollow">§4.1.2 Deltas “Galore;”</a> the latter should be safe to use on any version number of the TT rasterizer.</p>
      <p>The exception to said switch is rounding to sample grid, and in tandem the CVT cut-in to samples. This is needed to implement <a class="freelinking external link-external" href="http://www.beatstamm.com/typography/RasterTragedy/RTRCh3.htm#Sec10" rel="nofollow">Fractional Stroke Weights</a> and <a class="freelinking external link-external" href="http://www.beatstamm.com/typography/RasterTragedy/RTRCh3.htm#Sec11" rel="nofollow">Fractional Stroke Positions</a>, which none of the existing fonts did, and at the time this was the preferred implementation. It also was my understanding that subsequently core fonts would undergo extensive “delta tweaks” to ensure sufficient <a class="freelinking external link-external" href="http://www.beatstamm.com/typography/RasterTragedy/RTRCh3.htm#Sec12" rel="nofollow">Stroke Rendering Contrast</a>. Some core fonts did get these “tweaks”(e.g. Arial, Verdana), at least at some sizes and for RGB <a class="freelinking external link-external" href="http://www.beatstamm.com/typography/RTRCh5.htm#Sec6" rel="nofollow">LCD Sub-Pixel Structures</a>, while more recent fonts didn’t (e.g. Calibri, Corbel)—font-makers’ artistic preferences vs end-users’ preferences (cf. <a class="freelinking external link-external" href="http://www.beatstamm.com/typography/RTRCh6.htm#Sec37" rel="nofollow">§6.3.7 “Hinting” Respects End-Users</a>).</p>
