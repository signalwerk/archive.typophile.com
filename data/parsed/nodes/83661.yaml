      <p>In this second post, I’ll address the anti-aliasing filters. A disclaimer upfront: I’m not an expert in the field of signal processing (that’s the name for the part of computing that deals with anti-aliasing and its filtering methods), but so far I managed to understand it well enough to get my job done. Accordingly, I’ll limit the discussion to describing the phenomena.</p>
      <p>There are two main aspects: “bleeding” vs “non-bleeding” filters, and muting the color fringes.</p>
      <p>Conceptually, for plain gray-scaling in Windows, characters are rasterized as if for black &amp; white rendering, but at 4 times the DPI in both x and y direction. Subsequently, these large characters are “tiled” into 4×4 squares. The anti-aliasing filter operates on these squares. For each square, it counts the number of pixels that are “on.” This yields a number in range 0 through 16. Finally, these numbers are associated with gray values: 0 gets white, 16 gets black, and 1 through 15 get intermediate shades of gray, with 1 a very light gray (almost white) and progressively darker through 15, a very dark gray (almost black). See the Raster Tragedy, <a class="freelinking external" href="http://www.beatstamm.com/typography/RTRCh2.htm#Sec1" rel="nofollow">§2.1 Full-Pixel Anti-Aliasing</a> for illustrations.</p>
      <p>This simple anti-aliasing filter is called a <em>box filter</em>. For the purpose of this discussion, what’s important about the box filter is that it does not appear to “leak” or “bleed” ink or color outside the boundaries of each “tile.” A 1 px wide stem or a crossbar that has its outlines aligned with the pixel boundaries will be black:</p>
      <p><img src="http://www.beatstamm.com/temp/CrossbarBoxFilter.png"></p>
      <p>That same crossbar, anti-aliased with a <em>sinc filter</em>, instead of a box filter, appears to “leak” ink outside its boundaries, and its core is a dark gray, but not quite a solid black:</p>
      <p><img src="http://www.beatstamm.com/temp/CrossbarSincFilter.png"></p>
      <p>I’m not expert enough to explain the theory behind this in simple terms, but this is the kind of filter that the <a class="freelinking external" href="http://en.wikipedia.org/wiki/Nyquist-Shannon_sampling_theorem" rel="nofollow">Sampling Theorem</a> (which is the foundation behind all things digital) requires. What I see is that the sinc filter appears to “leak” while the box filter doesn’t. Compared to a box filter, the overall appearance of text rasterized and filtered with a sinc filter may be smoother, but slightly blurrier and with less rendering contrast: The core of the crossbar is less than black. I won’t argue for one filter over the other, because to me this comes down to personal preference.</p>
      <p>Enter the colors of ClearType and related sub-pixel anti-aliasing methods. The claimed benefit of sub-pixel rendering is that one can position e.g. a 1 px wide stem at fractional positions relative to the actual pixel boundaries. I’ll start with 3 such stems, positioned at offsets −1/3, 0, and +1/3 of a pixel, relative to the pixel boundary (left to right). In other words, they are positioned on the sub-pixel boundaries. The following illustration shows these 3 stems completely unfiltered and without gamma correction (see the Raster Tragedy, <a class="freelinking external" href="http://www.beatstamm.com/typography/RTRCh2.htm#Sec2" rel="nofollow">§2.2 Asymmetric Sub-Pixel Anti-Aliasing</a> for more illustrations):</p>
      <p><img src="http://www.beatstamm.com/temp/3StemsUnfiltered.png"></p>
      <p>The complete absence of filtering causes strong color fringing for the 2 stems offset by ±1/3 of a pixel, yet all 3 of them are made up of 3 adjacent black sub-pixels!</p>
      <p>To make this into a workable solution, it is necessary to mute these color fringes down to a level that makes them hard to notice. To do so, informally put, the filter needs to “smudge the line” between adjacent unlit (black) sub-pixels and lit (colored) sub-pixels. In the process, the colors get muted, but so does the black. For the erstwhile black stem this means that it will become off-black, with the difference seemingly “leaking” out to adjacent pixels. Following is how ClearType does the filtering:</p>
      <p><img src="http://www.beatstamm.com/temp/3StemsCTFilter.png"></p>
      <p>This is blurrier than the unfiltered stems but with color fringing that is muted. Notice that all 3 stems are now made up of only 1 black sub-pixel; the remaining two are dark but in colors. That’s one part of “smudging the line”—the other part is the “leaking” or “bleeding.”</p>
      <p>Is this enough muting? According to the theory elaborated by MS Research, it should be, at least for most people at typical viewing distances. But I’ve come across individuals who noticed color fringes at 144 DPI and a viewing distance of what I remember as about 2 feet (0.6 m). Accordingly, for these individuals the color fringing has to be muted down even further. Following is another filter that tends in the direction of more muting:</p>
      <p><img src="http://www.beatstamm.com/temp/3Stems3rdFilter.png"></p>
      <p>This may be perceived as even blurrier than ClearType but with color fringing muted to an even lower level. Notice that all of the 3 stems now contain no black sub-pixels whatsoever, and more color appears to have “leaked” on the left and right stems.</p>
      <p>I’ll repeat the above 3 illustrations at their original size, in hopes that this illustrates a trend (to be viewed on an RGB screen in native resolution, “landscape” orientation, and at 100% zoom):</p>
      <p><img src="http://www.beatstamm.com/temp/3Stems3FiltersRGB.png"></p>
      <p>Top to bottom decreases color fringing but increases blurring. Also, the middle stems appear sharper to me, relative to the left ones, and trailed by the right ones. If all of the above looks more or less blurry, try the BGR version below:</p>
      <p><img src="http://www.beatstamm.com/temp/3Stems3FiltersBGR.png"></p>
      <p>I don’t know the exact filters that were implemented in DirectWrite or Quartz. There are a few “tricks” that experts at signal processing can use to improve rendering contrast (the “black core”) or “sharpness” of stems. As far as I understand, all these “tricks” affect intermediate shades of gray or color, in a way not entirely unlike gamma correction (hence I’d encourage anybody reading this post to try the various gamma buttons at the end of <a class="freelinking external" href="http://www.beatstamm.com/typography/RTRCh5.htm#Sec3" rel="nofollow">§5.3 Gamma Correction</a> to develop some intuition of where this might go). But from my experience I wouldn’t be surprised to learn that optimizing in one direction usually comes at the expense of another direction.</p>
      <p>To recap, I’m not trying to claim that ClearType is the “one size fits all” solution. It would require no “rocket science” to offer end-users a choice of filters—in addition to the choices I have proposed in <a class="freelinking external" href="http://www.beatstamm.com/typography/RTRCh6.htm#Sec37" rel="nofollow">§6.3.7</a>. If I’m not mistaken, even Apple does this—offer a choice of filters—nota bene the same company that advocates the 1-button mouse just so that you can’t click the wrong button. But I have no control over these decisions. The best I can do is to work with the existing filters and instruction set, and point into the direction of what could be if …</p>
