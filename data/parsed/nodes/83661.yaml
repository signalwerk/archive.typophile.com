    html: <p>Seconded. For fonts with a substantially uniform italic angle, you can make the overall appearance of text more consistent by replicating the same stepping pattern, conceptually speaking, across the entire font. Once you have found a set of criteria that yields the “best” (least offensive) stepping pattern (phase control, number theory problem, etc), you’ll find that not every italic stroke extends from the baseline to the x-height or capheight—not to mention ascenders, descrenders, and serifs. Mathematically, this can be extrapolated as appropriate, while numerically this faces the “multiple rounding jeopardy” (cf. <a class="freelinking external" href="http://www.beatstamm.com/typography/RTRCh4.htm#Sec02" rel="nofollow">§4.0.2</a>) of the TT rasterizer, and to be consistent, this <em>must be exact</em> (cf. <a class="freelinking external" href="http://www.beatstamm.com/typography/RTRCh1.htm#Sec33" rel="nofollow">§1.3.3 Precise vs Exact</a>).</p>
