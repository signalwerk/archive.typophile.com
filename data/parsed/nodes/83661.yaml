      <p>Point taken. This may be understood differently from what this non-native writer had in mind. I seem to have an unfortunate bias with the word “craft”—it conjures up connotations of “bricolage” (“handicraft afternoon” in elementary school) before any connotations of the skills learned for a trade like punchcutting or typesetting, let alone any aspects of art involved therein. Hence I tried to rise it above that (perceived) level and used the word “art.”</p>
      <p>Art of printing is my oversimplification in an attempt to come up with a <code>&lt;META&gt;</code> tag for the Raster Tragedy home page, from where I borrowed the line without sufficient thought at the end of the post and day. What I really meant was the skilled métier of cutting the punches and casting the type to best adapt the type design to the available combination of metal, ink, paper, and type size. Today, hinting does (at least part of) this adaptation, and the screen replaces ink and paper.</p>
      <p>Hence, depending on the screen technology and/or customer preference, a font may be hinted for B&amp;W, gray-scaling, ClearType, DirectWrite, or a combination thereof (or none of the above). One of the differences to the days of hot metal is that, strictly speaking, hinting is programming, it’s <em>software</em>, hence it can cut different punches “on-the-fly” depending on the targeted ink and paper—and, of course, depending on the flexibility of the hinting.</p>
      <p>Interesting point about the “look of <code>HTML</code> text.” For reading text online, I certainly prefer “live” text over images or Flash. Flash seems stuck at 72 dpi, which makes it an accessibility issue for me, and images are a similar handicap. As to DirectWrite, I like the y-anti-aliasing (I prototyped it during an exhausting weekend late 2000, after having been told that this has been tried already and it didn’t work—hence the weekend), but depending on the combination of type size and resolution I have a hard time with the blur (a statement to that effect from <a class="freelinking external" href="http://www.typophile.com/node/33005#comment-197660" rel="nofollow">this post</a> has been taken out of context, quoted in <a class="freelinking external" href="http://en.wikipedia.org/wiki/ClearType#ClearType_and_human_vision" rel="nofollow">Wikipedia</a>, and used as some kind of “proof” in many forums on why ClearType is always blurry).</p>
      <p>The long and the short of it, no, I don’t advocate simulating print on screen, certainly not as the “one size fits all gold standard.” But repeating what I wrote above, hinting is software, hence it harbors the opportunity to cater to a plurality of applications (print preview, web reading, …), screen devices (desktop, laptop, media tablet, smart phone, …), and end-user preferences (or accessibility requirements).</p>
