      <p><em>Spread the message: Font hinting is an opportunity to get on-screen text rendering as close to the art of printing as the available screen technologies allow.</em></p>
      <p>Interestingly put.<br>
      I happen to like hinted TT fonts in DirectWrite a lot. Much more than what I see on my Mac desktop.<br>
      However, on smaller screens - iPad, iPhone Retina display - if it's closer to the art of printing (didn't know printing was an art, thought it was a craft) then it's certainly less pronounced.</p>
      <p>Personally, I couldn't care less about hinting as a way of reconciling a font designed with print in mind to the demands of the screen by adding hinting data for that purpose.</p>
      <p>The two kinds of fonts have forked - fonts for print are one thing, fonts for the web, another.</p>
      <p>But what I do like is that hinted TT fonts in DirectWrite have a look that says "this is HTML text". It's renders text in a way that's as visually appealing, but yet different from, the "look" of non-HTML text - text done with images or Flash replacement, or whatever. On the Mac, fonts look more like text as images.</p>
      <p>No text on screen looks like printing to me. And emulating print doesn't seem to me like the right goal, either. (The Kindle, maybe, looks like print.)</p>
      <p>Why look to simulate print onscreen?</p>
