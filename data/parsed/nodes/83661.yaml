      <p>Actually, looking at my samples I realized I forgot to do my little interpolation fix to align the right edges of the first stem in this particular glyph.</p>
      <p>There's a HUGE gap between basic x direction hinting in Fontlab and the kind of stuff Beat is talking about. The former tend to cause more trouble rather than order, at least for (smoothed) Standard GDI and Cleartype. </p>
      <p>Another thing to take into consideration is the difference in appearance between platforms. Snapping to the pixel is not neccesarily the best option.</p>
