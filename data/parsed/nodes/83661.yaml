    html: |-
      <p>&gt; 1: What is the difference between single and double links?</p>
      <p>With a single link, the origin point of the link needs to be "touched" by a different instruction (align, another single link, interpolation instruction). So a single link cannot exist "by itself", it needs to exist within a chain of instructions. If you add a new single link to an untouched point, FLS will automatically first add an alignment instruction. But if the point from which you start a single link already is touched by a different instruction, then FLS won't add the attachment. </p>
      <p>With a double link, you can specify a distance between two points but none of those points needs to be previously "touched". </p>
      <p>Example of double link (in the middle stem):<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/tth-doublelink_3506.png"></div><p></p>
      <p>Example of interpolation + single link (in the middle stem):<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/tth-interpolsinglelink_5326.png"></div><p></p>
      <p>As far as hinting strategies for diagonals, intersections or "s", there are many. I hope that some more experienced hinters tune in here. </p>
      <p>Best,<br>
      Adam</p>
