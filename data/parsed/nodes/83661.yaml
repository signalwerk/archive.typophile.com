    html: <p>Until now I've only been doing Y-direction hints. That can be done fast if your font is fairly regular in stem widths. The problems I've been struggling with concern spacing and are probably caused by not paying much attention to character widths, and thus, not fixing them. I also assumed they were rounding problems and that they were too difficult to solve (I imagined mountains of TT coding and stuff like that). At least now I understand a bit better what my final environment is and now I have other possibilities to test. I'll try some stuff on my font and then post images.</p>
