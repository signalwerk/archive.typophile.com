      <p>Seconded. In plain gray-scaling, there are no color fringes to deal with, no issues with rendering color-on-color, no issues with rotating your screen into portrait orientation, and last but not least, downsampling with a box filter can get you the sharpest strokes with maximum contrast due to absence of “bleeding.” All of the above with a mere 4 bits/pixel (Windows implementation).</p>
      <p>It’s a lateral shift of compromises: I think ClearType and related sub-pixel anti-aliasing methods get you smoother italics, but at the expense of the color issues and 32 bits/pixel when including y-anti-aliasing (hybrid sub-pixel anti-aliasing).</p>
      <p>What works for one end-user may not work equally well for another one.</p>
      <p>Personally, during my last two years or so at Microsoft, I used “Standard Font-Smoothing” and an auto-hinted version of Corbel as my UI font. Such a nice and clean font, but on my 96 dpi desktop I couldn’t handle the blur incurred by the unoptimized stems even in full-pixel positioning (cf <a class="freelinking external" href="http://www.beatstamm.com/Typography/RTRCh3.htm#Sec1" rel="nofollow">§3.1 Anti-Aliasing “Exclusion Principle”</a>). It was pronounced enough that I was questioned if I hadn’t inadvertently left my CT tuner in BGR mode! On my 144 dpi laptop, plain gray-scaling got me smooth characters in both x- and y-direction, notably before DirectWrite. Looked sooo nice…</p>
      <p>But like I said, what works for one end-user may not work for another one.</p>
