      <p>Difficult (if not impossible) to say without looking at the font in VTT (or a similar tool).</p>
      <p>In <a class="freelinking external" href="http://www.beatstamm.com/typography/RTRCh4.htm#Sec21" rel="nofollow">“natural” widths</a>, VTT will show you a right side-bearing point on a fractional x-position and hence you’ll have a fractional advance width, but subsequent layout will be to full pixels (if the RSB point happens to be integer, it's plain luck with the numbers). If the fractional part is less than 32/64 (= less than 0.5), it will be rounded down—you’ll get that part of the right side-bearing “truncated.” If it is 32/64 or more, the fractional part will be rounded up—you’ll get the right side-bearing “padded” by the round-off. Neither will help the spacing.</p>
      <p>Chances are that text laid out to full pixels will use <a class="freelinking external" href="http://www.beatstamm.com/typography/RTRCh4.htm#Sec20" rel="nofollow">“compatible” widths</a>, which may fix some of the spacing issues, at the expense of messing with the glyph proportions (this may seem odd but that’s what this “lesser evil band-aid” called “compatible” widths is supposed to do).</p>
      <p>To double-check what the correct advance width should be, in pixels, evaluate</p>
      <p><code>px = (pt × dpi × aw)/(72 × emHeight)</code></p>
      <p>and round the result. If you allow integer ppem sizes only (VTT forces this flag—I was told to do so) then first determine your ppem size</p>
      <p><code>ppem = (pt × dpi)/72</code></p>
      <p>round the result, and then evaluate</p>
      <p><code>px = (ppem × aw)/emHeight</code></p>
      <p>and round the result—again (<a class="freelinking external" href="http://www.beatstamm.com/typography/RTRCh4.htm#Sec02" rel="nofollow">“Double Rounding Jeopardy”</a>). This may yield a different advance width in (rounded) pixels, but that’s because e.g. 11 pt at 96 dpi gets rounded to 15 ppem while the actual ppem size would be 14 2/3.</p>
