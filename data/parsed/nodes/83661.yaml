      <p>Something? Yes! Couple of things come to mind:</p>
      <ul>
      <li>Even if the MS TT rasterizer makes it hard to implement CT stroke “sharpening” in a size independent way, it can be done, as I’ve shown. </li>
      <li>
      Even if a font maker decides that this is too hard, CT can take advantage of knowledgeable x instructions. Leaving them out altogether can lead to spacing accidents, as illustrated in <a class="freelinking external" href="http://www.beatstamm.com/typography/RTRCh3.htm#Sec30" rel="nofollow">§3.3.0 Constraint Priorities</a> (the CT cap ‘O’ towards the end of that section). Insufficient x instructions can also lead to spacing accidents, even with CT’s “Natural Widths,” as illustrated in <a class="freelinking external" href="http://www.beatstamm.com/typography/RTRCh4.htm#Sec21" rel="nofollow">§4.2.1 “Natural” Advance Widths in Practice</a> (the string “lellellel” towards the end of that section).
      </li>
      <li>
      Even if the application decides to layout text by fractional advance widths/sub-pixel positioning (not my favorite at the 8 to 18 ppem range—more like an accessibility issue), x instructions can be used to assert a minimum stem width of 1 px. As discussed in <a class="freelinking external" href="http://typophile.com/node/80015#comment-457508" rel="nofollow">another thread</a>, this requires to double the amount used for <code>SMD[]</code> but it can be done to help what little bit can be helped and not succumb to the verisimilitude-at any-price dogma.
      </li>
      <li>
      Media tablets encourage changing orientation from landscape to portrait—a candidate for plain gray-scaling, with room to develop strategies on how much gray to allocate, and where to put it.
      </li>
      </ul>
      <p>Not every word is read on a device controlled by hard- and software made by Apple and Microsoft. There are 3rd party browsers and there is at least one 3rd party TT rasterizer.</p>
      <p>Spread the message: <em>Font hinting is an opportunity to get on-screen text rendering as close to the art of printing as the available screen technologies allow.</em></p>
