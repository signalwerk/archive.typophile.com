      <p>@Frode, about gray-scaling: This sounds like a reasonable start. I’d suggest to have a look at the seminal paper by  <a class="freelinking external" href="http://infoscience.epfl.ch/record/99793/files/ptggf.pdf" rel="nofollow">Roger D. Hersch, Claude Bétrisey, Justin Bur, and André Gürtler, <em>Perceptually Tuned Generation of Grayscale Fonts</em>, IEEE Computer Graphics and Applications (Nov 1995)</a> for inspiration. Roger was the co-referee of my PhD dissertation and Claude (another of Roger’s PhDs) the colleague who brought me on board with Microsoft Typography at the time. Guided by André Gürtler from the School of Design in Basel (my hometown), they devised a set of guidelines on, informally and very loosely put, where to “put the gray.” In summary, they recommend</p>
      <ol>
      <li>to sufficiently reinforce thin strokes (cf <a class="freelinking external" href="http://www.beatstamm.com/typography/RTRCh1.htm#Sec1" rel="nofollow">§1.1</a>),</li>
      <li>to allocate the gray on the trailing edge of vertical strokes, leaving the leading edge as sharp as possible,</li>
      <li>to allow for sufficient black pixels on diagonal strokes (cf. “black core” in <a class="freelinking external" href="http://www.beatstamm.com/typography/RTRCh3.htm#Sec20" rel="nofollow">§3.2.0</a>),</li>
      <li>to allocate the gray on the outside of round strokes,</li>
      <li>not to overemphasize serifs (cf <a class="freelinking external" href="http://www.beatstamm.com/typography/RTRCh3.htm#Sec22" rel="nofollow">§3.2.2</a>), and last but not least,</li>
      <li>to use a consistent pattern of contrast profile across the entire font (cf <a class="freelinking external" href="http://www.beatstamm.com/typography/RTRCh3.htm#Sec3" rel="nofollow">§3.3</a>).</li>
      </ol>
      <p>In other words, you don’t necessarily have to put both the left and right edges of a stem on the grid (cf <a class="freelinking external" href="http://www.beatstamm.com/typography/RTRCh3.htm#Sec10" rel="nofollow">Fractional Stroke Weights</a>), but if you decide not to do so, their recommendations are e.g. to “put the gray” on the right of vertical straight stems (in a left-to-right script, #2 above) and on the outside of (vertical) round strokes (#4 above).</p>
