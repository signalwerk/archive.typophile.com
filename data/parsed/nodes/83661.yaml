    html: |-
      <p>Here's an idea how an extra "stem" can be used to do some basic control of the diagonals. </p>
      <p>I've started hinting this glyph from the center outwards (in the x-direction). First, I've created a double link on the bottom "terminal", and interpolated the cusp point on it. </p>
      <p>I've created a new stem and made single links to the outside glyph boundaries and to the sidebearing points, plus single links inwards on the top terminals. </p>
      <p>Now, in the TrueType hinting options dialog, I can control the ppm3 value to decide how steep the diagonal should be at a given ppm. (Scroll the images to the right to see the TT hinting option dialogs. Observe the ppm3 value for the "X: v 393" stem, which is the "stem" that controls the width of the diagonals.)</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/tth-diagonalstem1a_5730.png"></div><br>
      <div class="imageWrap"><img src="http://typophile.com/files/tth-diagonalstem2a_6142.png"></div><p></p>
      <p>In a "v" shaped like this, starting from the middle with a double link and going outwards seems the most effective way to ensure the symmetry of the glyph while also maintaining control over the width of the flat terminals.</p>
