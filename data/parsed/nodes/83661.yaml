      <p>&gt;&gt;Take for example italics: binary rendering is a disaster even with great hinting. Any opinions on that?&lt;&lt;</p>
      <p>Hinting for binary rendering of italics can only be described as making the best of a bad situation. And if that was your target, you'd have to concern yourself with phase control to get the best stepping patterns, which is just really complex. </p>
