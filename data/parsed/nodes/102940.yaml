  - id: 553950
    user: 1551
    date: 2013-05-11T18:06:00
    date_raw: 11 May 2013 — 6:06pm
    votes: null
    html: <p>I think I remember Erik Spiekermann, who I think likes Goudy, saying that Goudy Sans is 'over designed'. By that I think he means that it is so assertive and has so much personality and individual quirks that its use is restricted. Personally, I think it can look great in some settings by itself, but I'm skeptical about it 'playing well with others.' Because of the slanted crossbar on the e, you might try some of Goudy's many faces with slanted crossbars on the e, such as Deepdene.</p>
