      <p>Here is a full list of Goudy's eponymous types, as listed in the index of <em>Goudy's Type Designs</em> (2nd Edition, New Rochelle, 1978), which is a facsimile edition of the original two Typophiles chap books (XIII and XIV, 1946).</p>
      <p>Goudy Antique<br>
      Goudy Bold Face<br>
      Goudy Book<br>
      Goudy Cursive<br>
      Goudy Dutch<br>
      Goudy Heavy Face<br>
      Goudy Heavy Face Italic<br>
      Goudy Italic<br>
      Goudy Lanston<br>
      Goudy Modern<br>
      Goudy Modern Italic<br>
      Goudy Newstyle<br>
      Goudy Old Style<br>
      Goudy Old Style Italic<br>
      Goudy Open<br>
      Goudy Roman<br>
      Goudy Stout<br>
      Goudy Text<br>
      Goudy "Thirty"<br>
      Goudy Uncials<br>
      Goudytype</p>
      <p>Only some of these were designed in coordinated styles, intended to form part of a family.</p>
