    date_raw: 11 May 2013 — 4:22pm
    votes: null
    html: <p>I've worked with very few Goudy types. I'm not a fan. I admire Scripps College Old Style, and to a lesser extent Californian, but that's about it. This isn't to say that I don't recognise his importance or understand why some of my colleagues are such big fans. And I do appreciate Goudy's insistence on controlling the production process, of not only designing but cutting and casting his own type. In this respect he is the fore-runner of all of us who make our own digital fonts. But most of Goudy's types are not to my taste.</p>
