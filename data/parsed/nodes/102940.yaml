    <p>I am looking into purchasing the most “complete” Goudy family (SC, OSF, Blackletter, &amp;c.) that is closest to the original which pairs well with Goudy Sans. I’d opt for a larger family that meets the afore mentioned criteria over an “authentic” version with a single style. </p>
    <p>I have found many options, but it’s the authenticity/complete family/pairs with sans tradeoff that I am struggling with.</p>
    <p>Versions with a Web option would be ideal.</p>
    <p>My short list at this point is:</p>
    <p><a href="http://www.linotype.com/497/Goudy-family.html" rel="nofollow">Goudy font family</a><br>
    <a href="http://www.fonts.com/font/itc/itc-goudy-sans#product_top" rel="nofollow">ITC Goudy Sans</a></p>
    <p>Suggestions?</p>
