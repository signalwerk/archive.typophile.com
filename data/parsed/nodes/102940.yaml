    html: |-
      <p>Two sources for Goudy stuff are <a class="freelinking external" href="http://www.p22.com/lanston/" rel="nofollow">Lanston Type Company</a>, part of P22, and I see that at <a class="freelinking external" href="http://www.goudyfonts.com/" rel="nofollow">Goudyfonts</a> there are links to many fonts—though some of their links are broken. Steve Matteson has revived some Goudy fonts; you can see the links <a class="freelinking external" href="http://www.monotypeimaging.com/ProductsServices/TypeDesignerShowcase/SteveMatteson/" rel="nofollow">here</a>. And Font Bureau's <a class="freelinking external" href="http://www.fontbureau.com/fonts/CalifornianFB/" rel="nofollow">Californian</a> has had various hands reviving its weights, including Carol Twombly and David Berlow. And Berlow did Goudy's <a class="freelinking external" href="http://www.fontbureau.com/fonts/Village/" rel="nofollow">Village</a>. Tony Stan's <a class="freelinking external" href="http://www.linotype.com/580/ITCBerkeleyOldStyle-family.html" rel="nofollow">ITC Berkeley</a> us another, softer take on Goudy's California Old Style. </p>
      <p>Lanston's Goudy Old Style has the option of the original full descenders, which is nice. I think Typophiler Paul Hunt had a hand in the Lanston Goudy revivals, but I'm not sure. The Font Bureau's versions have tons of weights and styles.    </p>
      <p>The quality varies at lot—including among Goudy's originals!— so sorting through these will take a while. I haven't done it.</p>
