      <p>The overall sociocultural milieu of Greece in the 70s was surely as you describe, but I guess that's a testament to the fact that type has been (and still is, although to a lesser degree) a hidden subculture, and this made it possible to produce highly Latinized designs at that time. This "covertness" I guess allowed the Greek newspaper people of the 70s to tell Linotype to make those fonts as Western as possible without getting in trouble. At least that's the version we always hear, including from people like M Carter! I guess it's possible that Linotype and its designers would like to deflect "credit" for the highly Latinized Greek typestyles of the 70s, and in reality it was mostly their idea (probably because such a style would have been easier to make for them) but I have to doubt it.</p>
