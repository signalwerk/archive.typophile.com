      <p><em>I guess it’s possible that Linotype and its designers would like to deflect “credit” for the highly Latinized Greek typestyles of the 70s, and in reality it was mostly their idea (probably because such a style would have been easier to make for them) but I have to doubt it.</em></p>
      <p>The design programme was very much driven by demand. Mike Parker relates that Linotype were approached by a Greek businessman who wanted to be their sales rep in Greece. He claimed that he could get Linotype composing machinery into every newspaper and typesetting house in Greece if Linotype would undertake to produce any Greek typeface requested by the customers. Linotype had no significant Greek type development prior to this, and the faces produced were as requested by the Greek customers, communicated to Linotype via their sales rep, who apparently succeeded in gaining for Linotype virtually the entire Greek type composing market.</p>
      <p>Why did the Greeks want Helvetica, Baskerville, etc.? That is indeed an interesting question given the social and political situation of the day. Helvetica is particularly interesting because it's associations were not merely western but internationalist and linked to a modernist movement with strong socialist links.</p>
