      <p>Paul,<br>
      I didn't mean it that way. I was trying to indicate that Greece is an unusual case. Latin was initially Greconized so it is really a soup mix. Greece was also influenced by the Ottomans, the British, and now, Americans. What is authentic and pure Greek is a very fuzzy thing. Look at Hyphen 2006 and see what typeface it is set in? We live in a World more international in nature than ever. Purist nationalistic notions just don't have the sway that they used to. Unlike the pre digital era, Greeks can buy type anywhere in the world online. They have choices, they make choices just like the rest of the world. They are not stuck with what used to be on a Monotype hotmetal typesetter any more. This is a very interesting topic, Paul, and I had no intension of putting you in an uncomfortable place by trying to pin down Westernism. Personally, whatever Westernism used to be, is certainly something else now, thanks, in part, to the internet.</p>
      <p>ChrisL</p>
