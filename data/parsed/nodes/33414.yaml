      <p>It's not only a matter of homework. Formalism only covers half the ground, the rest is incommunicable, non-transferrable subconsiousness, nativity. It is known that the formative years of a person's childhood bestow certain affinities that cannot be gained later. It is known for example that children who learn two languages early on end up being fluent in both to a degree an adult can never attain.* Never. This is our biology, and you are no less human than any of us.</p>
      <p>* In fact early-bilingual people attain a different <cite>type</cite> of intelligence. In effect, their brains develop slightly differently. This is not shocking - in fact teenagers go through pronounced structural changes to their brains during puberty.</p>
      <p>So you simply cannot "get" it any more. It's too late.<br>
