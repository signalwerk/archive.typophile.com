      <p>David, I wouldn't have thought that developing a Greek face for V-I-P would have taken that long, but I don't know exactly what the design-to-manufacturing process was.</p>
      <p>I have to say, I really like the idea of a customer coming along saying 'We need this typeface!' and being able to respond 'Okay, come back in two years and it will be ready'. :)</p>
      <p>Paul, thanks for digging up my previous comments on Cadmus. I'm always nervous when someone makes reference to something I said e.g. four years ago. Am I going to have to explain why I said it, or why I might have changed my mind in the interim? In this case, I think the comments pretty much stand. In reference to your comment about the final sigma, I actually don't find this a problematic letter in Cadmus: the transition from the top part of the final sigma to the descender should be more fluid than the transition in zeta and ksi.</p>
