      <p>My opinion on the subject is based more on intuition and less on thorough research so I am going to be careful on what I say (it's the heart talking rather than the mind on this one).</p>
      <p>I totally agree with Chris Lozos's position on the way modernist values have changed into something universal for almost all "western societies". In fact some of the best works (imho) in greek poster design have been made during the 60s/70s by graphic designers like Michalis and Agni Katzouraki, and Freddy Karabott and were very much influenced by modernism.</p>
      <p>So, yes Greece is most of the times a "user" and not an "initiator" (and when it comes to typography, that is the case), and, yes, Greece has for many years tried to decide whether it considers itself east or west. The thing is though that our (my) dilemma has now changed - and it's based on Chris's conclusion: we are able to purchase typefaces and get inspired by designs from all over the world. So, do we really need to think in terms of "nationalistic" or "latinized" or "exoticized" or whatever designs, rather than thinking in more universal terms.</p>
      <p>Gerry Leonidas's analysis is truly detailed and correct. But in my opinion what is rather interesting to see is that Helvetica (and Helvetica-looking typefaces) has been the default in several applications in graphic design for a lot of years from the 60s up to the 90s, and then Meta and Din came and replaced it, and then (a few years ago) Myriad came and replaced them, and then (fewer years ago) Fedra came and conquered the contemporary greek typographic world. As you can see they are all contemporary and mainly geometric (instead of calligraphy based) typefaces. And then, in the book industry, Didot (like GFS's Didot), and Times were the default. And they never left the scene, only to find themselves occasionally replaced by Minion or Warnock (in the past few years).</p>
      <p>So, what I am trying to pinpoint is that foreign (that is non-greek) typographic designers have now (and I guess always had) a "power" to lead the trends in greek typography without too much critique or even competition. And of course it's not them to blame (if there is anyone to blame). The think is that you can count the greeks that actually try to understand and thoroughly research the phenomenon called "greek typography" in your two hands. Their work is undoubtedly remarkable. But the educational and research gap is something that literally prevents upcoming greek designers to be critical when faced with an "imported" interpretation of the greek alphabet, let alone innovative when it comes to designing their own interpretations.</p>
      <p>So, to conclude, for me there is no such thing as a preference towards traditional or geometric typographic forms in comtemporary Greece. There are just people trying to cope with constant change or mimicing imported norms. And there are fewer people trying to fathom how did we get here and (if they should/could) change it.</p>
      <p>George Triantafyllakos - backpacker.gr</p>
