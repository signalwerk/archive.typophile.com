    html: <p>The claim that newspapers used more Western fonts to protest the regime of the generals strikes me as odd. After all, the generals pressed for the use of Katharevousa instead of Dimotiki, thus they wanted Greece to purge Turkish words from its language - to abandon Eastern influences, and get back to its Western roots.</p>
