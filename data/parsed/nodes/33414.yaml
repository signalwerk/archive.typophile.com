      <p>I wouldn't say that there is a dominant typographic trend but I would understand the curiosity as sometimes perception could be slightly different than reality.</p>
      <p>Of course, there are a lot of highly geometric type families in Greek that are widely used as well as many others that are based on chirography that are equally used. The difference is on where and how they are used. As G.Trianta remarked, Gill Sans Hellenic, DIN Greek, Meta Greek or Myriad could be a trend for a corporate or magazine design use, while Warnock, Fedra B, Omonia or our Apollonia (which like many GFS type families are designed by T. Katsoulidis) could be a trend for a book design.</p>
      <p>And again, I totally agree with G.Trianta' quote<br>
      "So, do we really need to think in terms of “nationalistic” or “latinized” or “exoticized” or whatever designs, rather than thinking in more universal terms."</p>
      <p>What I would question though, is some information about a brief history of Greek script in modern times. Especially, I don't see any relation between the social or political status in Greece of the early seventies and Linotype's typeface development to a so called "western" texture.<br>
      This texture existed decades before and had there been an influence on type, this would surely be towards a "non western" or a more "exoticized" direction.<br>
      All Greeks who lived that period (1967-74) remember that during the military junta, everything "western" was considered as a bad influence or even a sub-cultural product.<br>
      (Not to mention that all english speaking songs were banned from the radio, or that famous records such as the Beetles  "Sgt Pepper's..." was first released in Greece 8 years after its original release and a year after the fall of the dictatorship).<br>
      Also anyone would remember these tacky revival parades at the Stadium dressed in ancient clothes or like byzantine emperors.<br>
      And of course, the motto "We belong to the west" was not repeated then, simply because the first time it was pronounced was 4 years after the fall of the dictatorship by the late Karamanlis (uncle of today's PM) on his effort to track the country into the European Community and back to NATO alliance. Instead, the sound bite used by the colonels was the triangle "state, religion and family".</p>
      <p>So, as written above, the Thessaloniki conference in June, or even finding some Greek newspapers, books and printed material would be a good resource to have a more spherical of what Greeks prefer.</p>
    html_clean: |-
