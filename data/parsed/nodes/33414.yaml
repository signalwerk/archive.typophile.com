      <p>"Greek Letters: from Tablets to Pixels" is wonderful, but when it comes to current trends it's too old.</p>
      <p>From my modest experience (basically talking to Greek type people in 2002 and 2004) they generally don't like the Latinized forms. The Western habit of relying heavily on chirography on the other hand is very old-fashioned, and any native who uses a computer is likely to like that even less (even though I personally think it's less bad). But they haven't been given many real alternatives to the two "schools", so... The one recent Greek font I admire is Apollonia.</p>
      <p>So Paul, if you could help, they'd love you for decades.</p>
      <p>hhp</p>
