  html: "<p>i'm curious. after reading over Gerry's <a href=\"/wiki/Greek\" class=\"freelinking\" rel=\"nofollow\">short history of the Greek script</a>, i want to know what the current trends are in Greece regarding the handling of their own script. i was doing some digging to reference the Gill Sans Hellenic, which was used for the 2004 Olympics in Athens and found <a href=\"http://www.fonts.gr/tryfonts/sample.asp?familyID=226\" rel=\"nofollow\">a sample on the Cannibal Fonts website</a>. i was a bit surprised, because as i quickly browsed through several of the type families on this site, most seemed very westernized to me, being highly geometric. however, if you look at faces produced here in the west, they seem to follow traditional models more closely, with the new ClearType fonts and Thomas' new <a href=\"http://blogs.adobe.com/typblography/Hypatia%20text%20settings.pdf\" rel=\"nofollow\">Hypatia Sans</a> showing a lot more calligraphic flavor. which brings me to an actual question: do native Greeks prefer more westernized (geometric) or more traditional (calligraphic) for Greek extensions of western faces?</p>"
  html_clean: "<p>i'm curious. after reading over Gerry's <a href=\"/wiki/Greek\" class=\"freelinking link-lost\" rel=\"nofollow\">short history of the Greek script</a>, i want to know what the current trends are in Greece regarding the handling of their own script. i was doing some digging to reference the Gill Sans Hellenic, which was used for the 2004 Olympics in Athens and found <a href=\"http://www.fonts.gr/tryfonts/sample.asp?familyID=226\" rel=\"nofollow\" class=\"link-external\">a sample on the Cannibal Fonts website</a>. i was a bit surprised, because as i quickly browsed through several of the type families on this site, most seemed very westernized to me, being highly geometric. however, if you look at faces produced here in the west, they seem to follow traditional models more closely, with the new ClearType fonts and Thomas' new <a href=\"http://blogs.adobe.com/typblography/Hypatia%20text%20settings.pdf\" rel=\"nofollow\" class=\"link-external\">Hypatia Sans</a> showing a lot more calligraphic flavor. which brings me to an actual question: do native Greeks prefer more westernized (geometric) or more traditional (calligraphic) for Greek extensions of western faces?</p>"
