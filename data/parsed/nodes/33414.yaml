      <p>A quick check on dates indicates that only Helvetica Greek was released during the dictatorship, in 1971. Century Schoolbook was released in 1976, Baskerville in 1979, and ITC Souvenir in 1981. All for Mergethaler Linotype's V-I-P system.</p>
      <p>So in large respect the social and cultural situation of the junta years is less relevant, except in the case of Helvetica, than the period immediately after.</p>
      <p>Regarding Helvetica Greek, what would be interesting to know is when the project was initiated, which Greek customer(s) for Linotype systems expressed a desire for this typeface, and how it was first used.</p>
      <p>By 1973, opposition to the military regime had become increasingly open both domestically and internationally, and the opposition was not limited to left or liberal groups, but included businessmen worried about the regime's impact on international investment in Greece and also monarchists calling for the return of King Constantine and the establishment of a constitutionally legitimate government. It would be interesting to see examples of how Helvetica was used during this period, the first couple of years of its introduction in the Greek market.</p>
