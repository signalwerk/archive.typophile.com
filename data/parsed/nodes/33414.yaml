      <p>"I don’t know exactly what the design-to-manufacturing process was."<br>
      Ahhhh. It was slow. As slow and meticulous as the letterrdrawing was, the making of plaques and then fonts and then proofs took 30-60 days from the time manufacturing got the drawings until the office got proofs. Take this and put it in a tube and send it to Greece, London or Frankfurt for comments and you'd add another month. Make changes, two more months. etc...in 4-6 months you migh have one style...each style after that took more time not less, as it most often doesn't today.</p>
      <p>"I really like the idea of a customer coming along saying ‘We need this typeface!’ and being able to respond ‘Okay, come back in two years..."<br>
      Lol. yeah I never got to say it but it was normal then and customers would say "AWLRIGHT, can't wait!" Time passed differently too, I think.</p>
