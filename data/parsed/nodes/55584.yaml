      <p>In my opinion, as long as it takes to separate yourself sentimentally or emotionally from your work in order for you to critique it in an objective fashion is the optimal duration of time to spend away from a piece of work. Sometimes, due to deadlines or whatever else, you don't have the liberty to take that time off in which case it is helpful to involve other people's fresh eyes in the project. </p>
      <p>I work in Graphic Design and have learned to detach myself fairly quickly from any concept or design I create for a client. However, a piece of artwork or a typeface for instance takes significantly more time to step back from.</p>
