    html: "<p>I don't know whether a lengthy hibernation, e.g. putting the design away for a period of many months or even for years, is a good idea or not. What I have had some experience with is an extended development cycle involving periods of some weeks or months of working on a design followed by some weeks or months of not working on it, followed by some weeks or months working, followed... and so forth. This is roughly how the Gabriola type was made, taking about four years in total, and in the case of that design, I don't think I could have done it any other way: I needed frequent time away from the outlines, during which I was still thinking about the design a lot but not working on it directly.</p>"
