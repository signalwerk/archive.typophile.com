    <p>Not sure how many of you are familiar with <a href="https://web.archive.org/web/20081007180201/http://www.lifeclever.com/">LifeClever</a>, recently Chanpory Rith posted a nice parable that I thought some of you might enjoy.</p>
    <p><em> </em></p><em>
    <p>    The ceramics teacher announced on opening day that he was dividing the class into two groups. All those on the left side of the studio, he said, would be graded solely on the quantity of work they produced, all those on the right solely on its quality.</p>
    <p>    His procedure was simple: on the final day of class he would bring in his bathroom scales and weigh the work of the “quantity” group: fifty pound of pots rated an “A”, forty pounds a “B”, and so on. Those being graded on “quality”, however, needed to produce only one pot—albeit a perfect one—to get an “A”.</p>
    <p>    Well, came grading time and a curious fact emerged: the works of highest quality were all produced by the group being graded for quantity. It seems that while the “quantity” group was busily churning out piles of work—and learning from their mistakes—the “quality” group had sat theorizing about perfection, and in the end had little more to show for their efforts than grandiose theories and a pile of dead clay.</p>
    </em><p><em></em></p>
    <p>The original post: <a href="https://web.archive.org/web/20081007180201/http://www.lifeclever.com/2007/01/23/what-50-pounds-of-clay-can-teach-you-about-design/" title="http://www.lifeclever.com/2007/01/23/what-50-pounds-of-clay-can-teach-you-about-design/">http://www.lifeclever.com/2007/01/23/what-50-pounds-of-clay-can-teach-yo...</a> </p>
    <p>Anyone have any thoughts to add, or maybe other parables?</p>
