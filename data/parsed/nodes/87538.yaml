      <p>Frank,</p>
      <p>The voodoo in the punctuation—especially the colon—appears resistant to remedy. It occurred to me that I might try adding extra space in front of the colon before export in order to avoid the problem. Unfortunately, my cunning plan didn't change things: even with 60 extra units of space to the left of the colon, KM still returned positive values. Bummer.</p>
      <p>I have noticed that KM appears to have problems dealing with somewhat quirky designs and very condensed characters. With one design—with crossbars extended to the left of the letters—even at 200% kerning strength, KM returns over 1200 positive values, even after sidebearings were increased in order to minimize such an occurrence. On the other hand, KM handles fonts with traditional letterforms reliably and quite acceptably—except, of course, with some punctuation.</p>
      <p>In any event, with the exceptions of the exceptional designs, KM is working well for me. Inspecting and cleaning up the results has reduced my time spent re-kerning by two-thirds or better. So, I only have two questions at this point: 1) how do I buy a license; and 2) how much will it cost to upgrade to the new version when it becomes available?</p>
