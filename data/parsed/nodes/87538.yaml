      <p>@charles_e</p>
      <p>The vast majority of my fonts are for display purposes, so I limit most fonts to the 1250, 1252 and 1254 character sets, which trims the time required down a bit. Plus, I prefer to keyboard kerning values—rounded to the nearest five, which works satisfactorily in a vast majority of instances—rather than manually dragging characters. The manual input method may seem counterintuitive, but it only takes guessing at values for a few dozen pairs to get a fairly reliable feel for the amount of space needed for a good-looking pair. My text file displays ten characters at a time in the kerning window, so it's "type-tab-type-tab, etc."; if I see any mis-estimations along the way, I simply type and tab to the end of the string, then continue tabbing to the trouble spot.</p>
      <p>In my experience, using this method makes the work go a lot faster, plus seeing that all of the values end in five or zero fairly conclusively confirms that the font was hand-kerned.</p>
