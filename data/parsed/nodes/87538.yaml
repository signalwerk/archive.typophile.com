      <p><strong>Initial Report:</strong></p>
      <ol>
      <li>Kerning results appear to be far more predictable with the .cha file exported by the KLTF plug-in, rather than any of the .cha files which ship with KernMaster.</li>
      <li>KM also appears to work better with a specially-tailored .krn file, rather than the default file.</li>
      <li>The lack of a GUI makes selecting the right settings for Design Size, Setting Size and Kern strength a hit-or-miss proposition; that is, the only way to undo an incorrect guess is to re-run KM, then re-import the kerning. It's not a big deal, because both processes take very little time, but it's not ideal.</li>
      <li>On the basis of only two processed fonts so far, KM doesn't appear to function particularly well with punctuation, especially periods and commas.</li>
      <li>On the same basis as above, on both occasions, KM has ignored obvious kerning pairs like FJ and TJ.</li>
      </ol>
      <p>Nonetheless, overall the program looks promising: a larger sampling is definitely called for, but I have to admit that a modest amount of clean-up is a lot faster than slogging through all of the kern pairs manually. Updates as they happen…</p>
