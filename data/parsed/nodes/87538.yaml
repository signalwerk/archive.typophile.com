      <p>Nick: ‘<em>[…] my past experience with Contourmaster […] was not very reassuring […]</em><br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/CoMa_1_3891.jpg"></div><br>
      ContourMaster should be able to trace and repair basically everything that can go wrong in contours. Over time some functionality changed and some improvements were made, so it might be possible that you tested an older version (?).<br>
      &nbsp;<br>
      <div class="imageWrap"><img src="http://typophile.com/files/CoMa_2_3943.jpg"></div><br>
      To test it on a Mac, you could try the <a href="http://www.fontmaster.nl/english/downloads.html" rel="nofollow">‘Wine’-wrapped version of FM Light 2.7.0</a> I made for Mac OS X. I have built an installer for Intel Macs running Mac OS 10.5, 10.6, and 10.7, which installs <em>FM Light 2.7.0</em> for Windows directly in the applications folder. As mentioned, the stuff is ‘Wine’-wrapped, which means that one does not have to install any additional software, or to start up the X Windows System ﬁrst. Besides a few minor issues, which I described in the <em>Read Me</em> ﬁle, the wrapped version seems to run pretty stable and fast. The only downside of the wrapping is the hefty 330 MB, which is used by the application on the hard disk.<br>
      As a bonus, the included DTL TraceMaster version is <strong>fully</strong> functional.<br>
      &nbsp;<br>
      <div class="imageWrap"><img src="http://typophile.com/files/KeMa_1_6021.jpg"></div><br>
      John: <em>‘If your fonts have relatively small glyph sets, e.g. just Latin 1, then it may be viable.’</em><br>
      &nbsp;<br>
      Actually I think that KernMaster also works ﬁne for Cyrillic and Greek, but the new <em>KM 2012</em> version allows right to left and vertical kerning too. To get the preferred outcomes, probably some tweaking is inevitable; there seems to be always room for discussion about kerning values. The new version will allow different ‘kern strengths’ for different (groups of) pairs in one ﬁle.<br>
      KM has always worked pretty good for the DTL fonts and, like almost everything else in the font production, I think that the kerning generation should be controlled via parametrization and that the outcomes should be completely reproducible.<br>
      &nbsp;<br>
      <div class="imageWrap"><img src="http://typophile.com/files/KM_2012_1_6237.jpg"></div><br>
      The ‘old’ KernMaster was tailored for a FM-based font production, hence it only works with BE and IK ﬁles. The new version works directly with OpenType fonts also, and it is very much features-ﬁle oriented. The resulting kerning can be merged with the original OpenType font data directly. Besides kerning also spacing can be generated, like in Kernus 3.0. Although high on my priority list, the current beta version of KM 2012 is not capable of batch-handling font ﬁles (yet).<br>
      &nbsp;<br>
      <div class="imageWrap"><img src="http://typophile.com/files/KM_2012_2_3497.jpg"></div><br>
      FEB<p></p>
