      <p>Maybe a few additional notes:*</p>
      <p>1. &amp; 2. &amp; 5. are indeed related. KM does exactly what you ask it for: check whether predefined pairs need kerning or not. If a pair is not covered in .krn, with glyphs identified by glyph names as defined in .cha, then the pair will not be considered for a check.<br>
      You could use previous designs to determine which pair are to be checked and possibly kerned. Plug In KernMaster has a script "Extract KRN From Font" which helps collecting kerning pairs from existing fonts which is described in the manual. (This is based on the assumption that designers reuse kerning test strings and as a consequence kern about the same pairs again and again.)<br>
      You could generate a .krn file once, analysing a couple of your fonts, or at least similar ones, and use it for future fonts. This implies, of course, that you have a certain standard glyph set.</p>
      <p>3. When using KM, I generated three or four sets of kerning, right one after another, each time with slightly different strength settings. (Export KM input files once and then duplicate them.) Then you can compare results side by side and choose one.</p>
      <p>4. KM does special tricks with punctuation marks which one may or may not like. I didn't, and in an updated version of Plug In KernMaster did another trick to prevent KM from recognizing punctuation marks as punctuation marks. I will upload the new version next week (need to update the manual a bit too).<br>
      Another thing is that you may need to apply different strengths to letter-letter vs letter-punctuation pairs. If you do, you need to make sure that one .krn file only covers inter-letter kerning pairs, and another .krn file only letter-punctuation kerning pairs. It's a bit of work to set these up, but once prepared, these .krn files are reusable for all your fonts.</p>
      <p>* Additional refers to yesterday's post. I am a bit slow these days ...</p>
    html_clean: |-
      <p>Maybe a few additional notes:*</p>
      <p>1. &amp; 2. &amp; 5. are indeed related. KM does exactly what you ask it for: check whether predefined pairs need kerning or not. If a pair is not covered in .krn, with glyphs identified by glyph names as defined in .cha, then the pair will not be considered for a check.<br>
      You could use previous designs to determine which pair are to be checked and possibly kerned. Plug In KernMaster has a script "Extract KRN From Font" which helps collecting kerning pairs from existing fonts which is described in the manual. (This is based on the assumption that designers reuse kerning test strings and as a consequence kern about the same pairs again and again.)<br>
      You could generate a .krn file once, analysing a couple of your fonts, or at least similar ones, and use it for future fonts. This implies, of course, that you have a certain standard glyph set.</p>
      <p>3. When using KM, I generated three or four sets of kerning, right one after another, each time with slightly different strength settings. (Export KM input files once and then duplicate them.) Then you can compare results side by side and choose one.</p>
      <p>4. KM does special tricks with punctuation marks which one may or may not like. I didn't, and in an updated version of Plug In KernMaster did another trick to prevent KM from recognizing punctuation marks as punctuation marks. I will upload the new version next week (need to update the manual a bit too).<br>
      Another thing is that you may need to apply different strengths to letter-letter vs letter-punctuation pairs. If you do, you need to make sure that one .krn file only covers inter-letter kerning pairs, and another .krn file only letter-punctuation kerning pairs. It's a bit of work to set these up, but once prepared, these .krn files are reusable for all your fonts.</p>
      <p>* Additional refers to yesterday's post. I am a bit slow these days ...</p>
