      <p>Francesco: ‘<em>[...] any news about the release date and the price of this program?</em>’</p>
      <p>The release of <em>KM 2012</em> is somewhat delayed, because the focus at DTL/URW++ is at the moment especially on the release of version 3.0 of <em>DTL OTMaster</em> coming September. This release will include a new <em>Light</em> version for just € 99, from which the OpenType layout features export/import and the (in the meantime enhanced) glyph editor will be stripped.</p>
      <p>The price for <em>KM 2012</em> will be € 255.</p>
      <p>If you are interested in testing, I can supply you with the latest beta version of <em>KM&nbsp;2012</em> for Snow Leopard and Lion. It would for instance be interesting to compare the output with that of the just announced <em>TypeFacet Autokern</em> (or any other application for kerning), and to show some results on this forum.</p>
      <p>FEB</p>
