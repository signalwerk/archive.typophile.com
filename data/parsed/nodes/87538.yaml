      <p>Karsten,</p>
      <p>First off, hats off for providing a simple and very useful tool: the value of the .cha file your plug-in has is easily illustrated by a snapshot of my first attempt at KM at 200% kerning strength, using the .cha and .krn files available with the program…</p>
      <p><img src="http://www.nicksfonts.com/depot/popcafe_kerno.png"></p>
      <p>After I substituted your plug-in .cha file and my own .kern file, the results were more in line with expectations.</p>
      <p>One other anomaly I noted was inconsistent kerning values for straight-side glyphs in the above font: the kern-left values for H I K L M N were different by as much as 10%. I'm also using KM's default .cla files; it occurred to me that these discrepancies might be overcome by exporting shape classes, but it appears that the structure of FontLab's native .flc files and the KM .cla files are different. If beggars can be choosers, the option to export shape classes might be a welcome addition to your plug-in.</p>
      <p>As far as the punctuation problem goes, it has been evident even at 200% kern strength, so the separate-file workaround wouldn't necessarily produce different results.</p>
      <p>Frank,</p>
      <p>One thing conspicuously missing from the current version of KM is the option to discard kerning value below a certain threshold, such as -10. In most of the cases I have encountered, there is little appreciable difference between -6 and no kerning at all. It would be handy to reject these minor quibbles automatically.</p>
