      <p>Nick: ‘<em>I purchased a license for the older version of ContourMaster […]</em>’<br>
      &nbsp;<br>
      We checked our customer database and the version you purchased is from late 2006. At that moment CoMa was basically in its ﬁnal stage of development, so if you recall what did not work properly or as expected still, I would very much appreciate it if you could let me know, either on this forum or directly.<br>
      &nbsp;<br>
      ‘<em> […] 32.5 non-stop eight-hour days of nothing but kerning.</em>’<br>
      &nbsp;<br>
      That sounds like real fun to me! I reckon you work (mostly) with FLS. For the ‘old’ KM you would need a Character Layout ﬁle (.cha) then, which connects glyph names to positions in a (temporary) BE glyph database. I reckon that the simplest way to ensure that one’s naming convention is correctly used, is to convert the FontLab .nam ﬁle that one is normally using. The .cha ﬁle is needed then for the conversion from a font to BE format and, of course, for generating the kerning data. Secondly, a kerning ﬁle is needed, either with or without a kern class ﬁle. Then the kerning can be generated in batch and the output options are .afm or kern feature ﬁles. The resulting kerning can subsequently be merged with the original FLS font data.<br>
      Because the import of fonts can be done in batch (for instance using the FM <em>Light</em> modules) and the generation of the kerning ﬁles can be done in batch too, the conversion and kerning generation can be done quite fast. Another option would be the use of Karsten’s plugin for KM. If you want to test KM, I can send you a full version for this purpose.<br>
      &nbsp;<br>
      John: ‘<em>[…] an issue I found recently with KM (2.6.0) is that it was applying different kerning […]</em>’<br>
      &nbsp;<br>
      The examples you give have actually always been a small issue with the algorithm. The fact that something is sticking out can result in a deviation, which is normally (always) <strong>very</strong> small. Also minor rounding errors can show up, because of the fact that the actual calculation is done in the IK format on a ﬁner grid. For relatively small ‘plain’ kerning ﬁles the deviations are not really a problem and basically they can be ignored, but for larger ones the use of kern classes should be the solution in my opinion (we are looking for a way to convert these back to ‘plain’ ﬁles, if necessary). If one uses kerning classes in KM, the ﬁrst character in the class is used to calculate the kern value. But from your post I understand that this did not work for you?<br>
      &nbsp;<br>
      FEB</p>
