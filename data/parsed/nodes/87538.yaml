    html: |-
      <p>I didn't try kern classes within KM. What I did was to generate a .krn based on broad groups in FontLab, using Karsten's scripts, and ran this with the deliberate intention of getting a very large set of kern pairs that I could then compress to class kerning back in FontLab. My reason for doing it this way is that my glyph set is very large with lots of oddly shaped glyphs, and I wanted to hit as many legitimate exceptions to class kerning as possible. But because of the algorithm issue you describe, I ended up with almost all exception kerning, and relatively few pairs that compressed to class kerning. Karsten's import script has an option to compress within tolerances, but I found that I couldn't rely on that since some legitimate exceptions were within the same tolerances as those resulting from the algorithm problem.</p>
      <p>I think the way to fix this must be some way to define exclusion heights, even if this is the relatively crude method of ignoring anything above the capheight.</p>
