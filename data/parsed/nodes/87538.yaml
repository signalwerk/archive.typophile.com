      <p>Karsten, is this new plug in release different from the one you sent me recently?</p>
      <p>By the way, I came up with a quick and dirty way of producing .krn files for possible exception sets, e.g. T followed by accented letters. I create a temporary .vfb and make crude kerning classes for _1ST and _2ND glyphs that I want to be included in the .krn. Then I apply dummy kerning in FontLab between key glyphs in these classes, expand the kerning, and run your 'Generate krn from font' script. This spits out a .krn containing all the potential exception pairs. I add a few 'control pairs' to this .krn, which I will use to judge whether the Kernmaster settings need adjustment to produce tighter or looser kerning. I then run Kernmaster on the font, producing a set of exception pairs that can be imported into my already manually class-kerned font. This is particularly useful in the case of something like polytonic Greek in which the number of exception pairs can be high.</p>
