      <p>Nick: ‘<em>[…] pairs like O. and O, […] have been so far ignored. […] FJ an TJ are definitely in the .krn file […]</em>’<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/KM_1_5742.jpg"></div><br>
      I know that the kern values for O period and O comma are not perfectly, i.e. a bit too loosely, kerned by the ‘old’ KM (one of the things that will be improved in KM 2012), but they are deﬁnitely not ignored. The FJ and TJ combinations are not overlooked by the program either. As I wrote before, <strong>everything</strong> that is available in a glyph database and that is covered by the supporting ﬁles will be kerned by KM.<br>
      &nbsp;<br>
      <div class="imageWrap"><img src="http://typophile.com/files/KM_2_4462.jpg"></div><br>
      To prove this, I have just made a small kerning ﬁle:<br>
      -------------------------------------------<br>
      Comment Typophile test 25-11-2011<br>
      StartFontMetrics<br>
      StartKernData<br>
      StartKernPairs 4<p></p>
      <p>KPX O period<br>
      KPX O comma<br>
      KPX F J<br>
      KPX T J</p>
      <p>EndKernPairs<br>
      EndKernData<br>
      -------------------------------------------<br>
      and the previous image shows the resulting kerning pairs (applied kern strength = 100). Perhaps you should enlarge the <em>Max Num of Pairs</em> to 100000 (or something like this) to be sure that everything in your .krn ﬁle is calculated.<br>
      &nbsp;<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/KM_4_4271.jpg"></div><br>
      To test the generated kerning quickly, a glyph database can be selected in BezierMaster (Light) and the AFM ﬁle can be selected (and edited in the full BM version, if necessary) in the metrics window. There was no editing in the example below (applied kern strength = 100).<br>
      &nbsp;<br>
      <div class="imageWrap"><img src="http://typophile.com/files/KM_3_4517.jpg"></div><br>
      ‘<em>[…] plus seeing that all of the values end in five or zero […]</em>’<br>
      &nbsp;<br>
      I am using some simple scripts to remove small kerning values from the stuff KM calculates. In KM 2012 this is one of the settings one can apply. When it comes to rounding, one can write a script for this too, of course.<br>
      &nbsp;<br>
      James: ‘<em>[…] it might be a good idea if it accepted the Metrics Machine pair lists […]</em>’<br>
      &nbsp;<br>
      That should not be too difﬁcult to implement, I reckon.<br>
      &nbsp;<br>
      FEB<p></p>
