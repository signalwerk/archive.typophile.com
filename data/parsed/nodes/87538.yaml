    html: |-
      <p>The Dutch Type Library is an independent (in all meanings of the word) company that focuses purely on the internal development of fonts and font tools. Basically we don’t work for third parties, except when we <strong>really</strong> like the proposed projects. We are actually never in a hurry and we take our time for our projects (for instance the development of <em>DTL Fell</em> and <em>DTL Romulus</em> takes more than ﬁfteen years now). In a time in which everything seems to go faster and faster and things seem to loose value rapidly, we deliberately slow down. </p>
      <p>This summer we will release our ﬁrst new typeface (<em>DTL Valiance</em>) since six years (<em>DTL Antares</em> was the last one). In the meantime we have been working on WGL4 support for all DTL typefaces. <strong>Slowly</strong> but steadily we will release these fonts, like we just recently did with <a href="http://www.dutchtypelibrary.nl/Argo_Cyr_Regular.html" rel="nofollow">DTL Argo</a>. </p>
      <p>The DTL looseleaf type specimen is one of our favorite <em>non-proﬁtable</em> projects (the applied material alone costs more than the price we ask for it). The specimen is produced in small quantities, which makes it easy to update. Also the bookbinder, who makes the binders by hand, is actually not capable of producing large quantities. So normally new editions are used to supply long-waiting customers. </p>
      <p>Concerning the development of the new edition of <em>DTL KernMaster</em>, we are currently looking at which level we will support the UFO format. I will keep you all posted, of course.</p>
      <p>FEB</p>
