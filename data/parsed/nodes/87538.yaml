      <p>Related to the current version of KM:</p>
      <p>New <a href="http://www.kltf.de/kltf_otproduction.htm#pluginkernmaster" target="_blank" rel="nofollow">Plug In KM</a> is uploaded now. (Please follow installation instructions described in 'KLTF Plug In KernMaster QUICK INSTALL.txt'. If you get any error messages when running any script then most likely the module file is still existing somewhere on your harddrive. Please send me an email when encountering any problem.)</p>
      <p>[NC] <cite>The voodoo in the punctuation—especially the colon—appears resistant to remedy.</cite></p>
      <p>I would be curious if the new script version helps with this.</p>
      <p>[NC] <cite>One thing conspicuously missing from the current version of KM is the option to discard kerning value below a certain threshold, such as -10.</cite></p>
      <p>[FB] <cite>Rounding is not (yet) part of the application, but it should not be too difﬁcult to write a script for this.</cite></p>
      <p>Both should be part of the 'Import' script. It would be great to have both right in KM, though.</p>
      <p>[NC] <cite>One other anomaly I noted was inconsistent kerning values for straight-side glyphs in the above font: the kern-left values for H I K L M N were different by as much as 10%. I'm also using KM's default .cla files; it occurred to me that these discrepancies might be overcome by exporting shape classes [...]</cite></p>
      <p>If you have set up classes properly, with a second-of-pair class covering H I K L M N, and, say, H being the key glyph of this class, then you could make sure that your .krn file only covers pairs with H being second-of-pair glyph, but no such pairs for I K L M N. Because your source font contains the respective kerning class, I K L M N would be kerned 'automatically' (and identical to H) because they are included in the H class so H's kerning is applied to them too.</p>
      <p>In general, FLS as well as other tools need two pieces of information to generate an AFDKO-syntax kern feature: a) pair kerning and b) class definitions. KM – speaking of the current version – only needs to deal with a). It does not even need to know about b) which is present in your source font anyway.</p>
