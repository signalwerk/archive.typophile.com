      <p>Frank,</p>
      <p>My usual routine is to export outlines from CorelDraw 9 into Fontographer 5 (it simply does some things better than FLS), do some basic spacing, then generate an OTF. I open that font in FontLab Studio 5.04, tweak the glyphs and the spacing, kern, generate Latin 1252, Central European 1250 and Turkish 1254 character sets, apply class kerning, add appropriate features, then generate the Kern feature and compile. I test generated fonts in Illustrator, InDesign, Photoshop and Word. And, FWIW, I'm working on a Dell 6-core 3gHz machine, running Windows 7 Professional with virtualization, so I can run 16-, 32- and 64-bit programs seamlessly.</p>
      <p>Test-driving a full-featured current version (or a beta of KM 2012) would be greatly appreciated. If I find the program eased my burden significantly, I would be more than happy to purchase a license—the program would pay for itself from the money I'd save on Preparation H alone… ;)</p>
