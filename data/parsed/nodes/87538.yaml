      <p>Frank, an issue I found recently with KM (2.6.0) is that it was applying different kerning between e.g.</p>
      <p>T C<br>
      T Cacute<br>
      Tcaron C<br>
      Tcaron Cacute</p>
      <p>This made it impossible for me to us KM, as I needed to be able to compress the kerning with classes in FontLab (prior to conversion to VOLT groups/lookups), which I couldn't do because the differences created hundreds of thousands of exceptions.</p>
      <p>[Note that I'm using Karsten's plugins to produce .krn files, which prefix most glyph names to avoid some apparent cleverness on the part of KM that he reckons we need to avoid.]</p>
      <p>The new KM with native OTF support sounds like it is worth trying.</p>
