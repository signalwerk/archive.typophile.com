      <p>Frank,</p>
      <p>I purchased a license for the older version of ContourMaster: I'm not sure which one, because that was three computers ago (at least six years) and I didn't bother to migrate it to my newer machines because of the unsatisfactory results.</p>
      <p>Batch processing really isn't a concern, since I have to modify each of the 130 or so font files in small ways—adding accents and a few other characters, all of which need to conform to the font's specific style. What I am more concerned about is reducing the time I have to spend manually kerning each font. Because uncommon letter combinations in English may be common in other languages, I kern all possible letter combinations, along with punctuation, numbers and a few common symbols. Under the best of circumstances—dogged determination and no breaks—I can accomplish this task in around two hours per font—or 32.5 non-stop eight-hour days of nothing but kerning. Unfortunately, at that pace, I often experience optical migraines, and numbness in both my mind and my rear end.</p>
      <p>Al I'm really looking for is some reassurance that money spent will reliably mean time saved. If the end product of auto-kerning requires too much tweaking—or, as in the case of Fontographer, too many silly or spurious pairs—I simply need to resign myself to a frazzled mind and a sore butt.</p>
