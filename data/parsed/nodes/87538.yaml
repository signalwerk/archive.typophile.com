      <p>Hello Nick, thank you for posting your ﬁndings.<br>
      &nbsp;<br>
      ‘<em>1. Kerning results appear to be far more predictable with the .cha file exported by the KLTF plug-in […]</em>’<br>
      This indicates that the naming convention in Karsten’s .cha ﬁles is more like the ones used in your fonts and your kerning ﬁles. Assuming that the KLTF plug-in .cha ﬁle is based on the naming convention used by FLS and you used the same (or is KLTF plug-in .cha generated on the ﬂy?), this would make sense.<br>
      &nbsp;<br>
      ‘<em>2. KM also appears to work better with a specially-tailored .krn file […]</em>’<br>
      This could have same reason as I mentioned above, but it could also be possible that the kerning ﬁle that comes with KM does not cover the combinations you want to kern, of course.<br>
      &nbsp;<br>
      ‘<em>3. The lack of a GUI makes selecting the right settings for Design Size, Setting Size and Kern strength a hit-or-miss proposition […]</em>’<br>
      Basically I would ignore the <em>Design Size</em> and <em>Setting Size</em> settings and only focus on the <em>Kern Strength</em>. The ﬁrst two options basically control the same thing as the <em>Kern Strenght</em>. KM 2012 has a GUI for controlling all these entries, by the way.<br>
      &nbsp;<br>
      ‘<em>4. KM doesn't appear to function particularly well with punctuation</em>’<br>
      In that case I would advise to use a separate ﬁle for everything that requires a different kern strength than the rest of the glyphs that you consider to be properly kerned.<br>
      &nbsp;<br>
      ‘<em>5. […] KM has ignored obvious kerning pairs like FJ and TJ.</em>’<br>
      KM will kern everything that is in the kerning ﬁle (and class ﬁle, if applicable) and that is covered by the .cha ﬁle too. If kerning pairs are ignored, then I would check these ﬁles ﬁrst.<br>
      &nbsp;<br>
      FEB</p>
