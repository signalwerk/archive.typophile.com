    html: |-
      <p>I've used Kernmaster a few times, including once for a shipping font. If your fonts have relatively small glyph sets, e.g. just Latin 1, then it may be viable. You do need to adjust the settings on a per-design basis, but if working with a large collection what I would probably do is try to group them based on similarity of proportions and basic spacing, then do tests to establish settings for each group, run the groups through KernMaster, then test individual fonts.</p>
      <p>I have noticed that if a font is 'cast small', i.e. the outlines are short relative to the em square, KernMaster doesn't do a good job. In those cases, you can scale up the outlines, run through Kernmaster, then scale down the kerning and apply to the original outlines.</p>
