    html: |-
      <p>Nick: ‘<em>After I substituted your [Karsten] plug-in .cha ﬁle and my own .kern ﬁle, the results were more in line with expectations.</em>’<br>
      &nbsp;<br>
      Assuming that it is syntaxly correct, technically a Character Layout ﬁle can only inﬂuence the process by either or not corresponding with the positioning of the glyphs in the database and with the kern ﬁle. If the .cha and kern ﬁles that come with KM not fully comply with the naming convention you use, by deﬁnition any other ﬁles that are directly based on your font data will work better. For that reason the new KM 2012 offers the option to export both .cha and kern ﬁles from the selected OpenType font.<br>
      &nbsp;<br>
      Although not implemented yet, for a long time it is on my wish list to indicate the kern strenght in the kern ﬁle itself in case this has to differ from the default, i.e. overall value. This will be implemented in KM 2012. In the old KM the maximum kern strength is limited to 200%, but in the new version this is basically unlimited.<br>
      &nbsp;<br>
      ‘<em>I'm also using KM's default .cla ﬁles […] it appears that the structure of FontLab's native .ﬂc ﬁles and the KM .cla ﬁles are different.</em>’<br>
      &nbsp;<br>
      The kern.cla ﬁle which comes with KM is very limited and its content is actually only meant as an example. It is especially included because for generating kerning pairs it is mandatory to have a kern.cla ﬁle selected in KM, whether it is used or not. For the production of .afm ﬁles it is actually ignored, but it is used for the generation of kern.fea ﬁles if glyph class pairs are used. The .cla ﬁles use the AFDKO syntax. If you use glyph class pairs in your kern ﬁle(s) always be sure that these are all deﬁned in your .cla ﬁle.<br>
      &nbsp;<br>
      ‘<em>[…] as the punctuation problem goes, it has been evident even at 200% kern strength […]</em>’<br>
      &nbsp;<br>
      If the outcome does not match one’s expectations, it is possible to use a script to correct the generated kerning in a certain direction. As soon as a deviating pattern is recognized, corrections can be made directly (in batch) in the generated .afm or .fea ﬁle (which, by the way, can also be optically/manually edited in BM), of course. After all, a kern strength of 200% means twice the amount of kerning generated with a 100% setting.<br>
      &nbsp;<br>
      I use quite some scripts to control the stuff, if only because the generated kerning for a complete BE (or IK) database (West, East, Turkish, Cyrillic, Greek, Vietnamese, etc.) has to be renamed (and distributed) for single byte fonts (for instance oldstyle ﬁgures to ﬁgures and small caps to lower case). Nowadays I use AppleScript in combination with BBEdit, but I used VBA with Word in the past. The nice thing of the combination KM with BM is that the generated kerning ﬁles can be directly connected to the glyph databases for the actual font generation (batch). No additional action is needed.<br>
      &nbsp;<br>
      ‘<em>the option to discard kerning value below a certain threshold […]</em>’<br>
      &nbsp;<br>
      This is implemented in KM 2012 already. Rounding is not (yet) part of the application, but it should not be too difﬁcult to write a script for this.<br>
      &nbsp;<br>
      FEB</p>
