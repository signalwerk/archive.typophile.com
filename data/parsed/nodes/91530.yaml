  - id: 502498
    user_id: 188392
    user_name: stlandau
    user_path: null
    user_image: null
    date_raw: 29 Mar 2012 — 5:17pm
    date: 2012-03-29T17:17:00
    votes: null
    html: |-
      <p>The Scrappers font was used originally by having to piece together a handwritten set of characters, so it was pretty time consuming to write out long messages. And of course for web use, we also needed a full character set we could dynamically use and display. Prior to having Scrappers converted to a font format we could use, we chose Blockhead for dynamic text because it looked kind of similar. So Scrappers wasn't derived from Blockhead; we chose Blockhead because it was close to what we were doing with the handwritten Scrappers font.</p>
      <p>And thanks for the link to FF Ernestine. Looks like a good option instead of Archer, especially if H&amp;FJ aren't going to come out with a @font-face solution anytime soon.</p>
