      <p>Hello all. I'm the Creative Director at Substance (<a href="http://findsubstance.com" title="http://findsubstance.com">http://findsubstance.com</a>), the agency responsible for the design of the Travel Oregon site.</p>
      <p>Regarding the fonts, we used a variety of them... the top navigation is a font called Scrappers, which was custom-made for the client. There are some variants in the font so that's why you're seeing two different S's. Because of the control we wanted over the layout and active states for the top navigation, we ended up making those graphical, but everywhere else across the site where you see Scrappers it is displayed using @font-face. Regarding Emigre's Blockhead - we had used Blockhead prior to having the custom Scrappers font in the Flash file on the Cities &amp; Regions page, so that reference might be a legacy item in the Flash file.</p>
      <p>For the slab serif font, we wanted to use Hoefler &amp; Frere-Jones font Archer (<a href="http://www.typography.com/fonts/font_overview.php?productLineID=100033" title="http://www.typography.com/fonts/font_overview.php?productLineID=100033">http://www.typography.com/fonts/font_overview.php?productLineID=100033</a>), but unfortunately they haven't created a web font solution yet. Instead, we're using the Google font Rokkitt (<a href="http://www.google.com/webfonts/specimen/Rokkitt" title="http://www.google.com/webfonts/specimen/Rokkitt">http://www.google.com/webfonts/specimen/Rokkitt</a>) for headlines, and Sanchez (<a href="http://www.myfonts.com/fonts/latinotype/sanchez/" title="http://www.myfonts.com/fonts/latinotype/sanchez/">http://www.myfonts.com/fonts/latinotype/sanchez/</a>) for italic slab serif uses. Unfortunately Rokkitt doesn't have an italic version of their font and the psuedo-italic the browser was rendering didn't look very good. Hopefully once H&amp;FJ has a @font-face solution, we can implement that.</p>
