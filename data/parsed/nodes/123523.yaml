    <p>I found this one on the <a href="http://www.impawards.com/2015/focus.html" rel="nofollow">teaser poster</a> for <em>Focus</em>. Besides the very high waist of the B, G, P &amp; R the awkward W and narrow M throw me off. Looks like either a vintage geometric sans or a freeware/Google font.</p>
