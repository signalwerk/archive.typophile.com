      <p>When I say rare, I mean that this type I'm looking for isn't used very offten in commercials and advertising in my country (Serbia). Now, I see that a few companies use STAG for adverts, so that's why I search for similar type, but not seen in our country...</p>
      <p>I am designing a poster for wall, some kind of history diagram, with pictogramms as basic of communication, and this type to go along... Their logo is build from GIRL type (<a href="http://www.limundo.com/" title="http://www.limundo.com/">http://www.limundo.com/</a>), so I need type that would match GIRLS spike endings (I can't describe different what I mean)... I saw a post here, and someone mentioned GRUEBER from Dalton mag, and there I found FOCO and PLUME ADVERTISING that would go nice with GIRL from logo... So, I know that my post was boring so far, if you think anything that would go nicely with this, I would appreciate that...</p>
      <p>Thanks anyway<br>
      Mirko</p>
