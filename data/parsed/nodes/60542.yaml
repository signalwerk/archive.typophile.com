      <p>Can you be more specific about what you are looking for? What is it about Stag that you like? Certain letters? Very heavy weight? Wide range of weights? When you say "rare", how obscure do you want? (Search small foundries for these)</p>
      <p>Ole Schäfer has done a number of slab families, such as <a class="freelinking external" href="http://new.myfonts.com/fonts/primetype/qugard-slab/" rel="nofollow">Qugard Slab</a>, but until I have some idea what you are looking for, it's hard to make recommendations.</p>
      <p>- Mike Yanega</p>
