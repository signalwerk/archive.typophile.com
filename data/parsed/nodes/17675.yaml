    <p>It's been a while that I wanted to try and create a <a href="http://mycroft.mozdev.org/contribute.html" rel="nofollow">search plugin</a> for Firefox/Mozilla. The linked site mentions it has to be a "GET" method page, but since Typophile's search function doesn't show anything in the URL, I'm not even sure it's possible.</p>
    <p>So, Punchcut people, is it possible? Or is Typophile's super-search too much for poor Mozilla to handle? :)</p>
    <p>EDIT: I wrote the code for the search and tried <a href="http://www.mindzilla.com/auditform.php" rel="nofollow">testing</a> it but as expected it didn't work. If anyone thinks this is an interesting idea, I'll gladly post the code here (it's simple and short).</p>
