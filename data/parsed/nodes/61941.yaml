    html: <p>Looks to me like there might be something very slightly off in your math, things are off at the top of the document but get closer to being aligned at the bottom. I'd double check that position of your guidelines and leading, set them using the same units (if you're defining linespace with points, define your guideline positions in points too.)</p>
