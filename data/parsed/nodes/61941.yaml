    votes: null
    html: |-
      <p>You can work it out if you feel compelled to. Just set your baseline grid and at grid intervals, make a guide at either cap height or x-height above it as you see fit.  This sort of thing was more important in lead type because you had to make the lead slugs even out but digitally, the value is limited. Try it as an exercise but as a working pattern, it is almost pointless since you can make subheads stap to baseline grid.</p>
      <p>ChrisL</p>
