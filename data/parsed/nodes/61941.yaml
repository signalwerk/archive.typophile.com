    votes: null
    html: <p>There have been threads about this in the past, it’s usually something to do with differences in the size of points or someone forgetting to turn off baseline grids. I believe that there are some great resources at <a href="http://www.thegridsystem.org/" title="http://www.thegridsystem.org/">http://www.thegridsystem.org/</a> for working this stuff out. But generally I find it easier to use hierarchical grids with six columns and a couple of hanglines instead of trying to work out modular systems.</p>
