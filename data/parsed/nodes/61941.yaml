    html: |-
      <p>Perhaps it is a case of the digital point vs the original point from lead type. The book was written using Mueller-Brockmann's career long metal type experience but the size of the point/pica has been adjusted a very small amount to make 6 picas equal exactly one inch (which it does not using the original point/pica).</p>
      <p>ChrisL</p>
