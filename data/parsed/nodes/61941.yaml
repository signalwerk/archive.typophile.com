    <p>Hi there, I've encountered a lil problem with rebuilding a grid from the book "Grid systems in graphic design" by Josef Mueller-Brockmann. As show in the crop from the book "Grid systems in graphic design" (mueller_brockmann_1.gif), Brockmann took a 10pt font with 3pt lead and managed to align every fifth line descender heigth and every first line cap height with the "emptyline" (the sixth line between the thicker black strokes). I tried that myself in ID and I'm now facing the problem that the empty line (16pt in total) just fits at a rate of 95%. If you have a look at the mueller-brokmann_2.pdf, everything looks fine at 100% zoom but at 300% things starting to get messy. </p>
    <p>Any idea if that is normal?</p>
    <p>Best,<br>
    Tim</p>
