      <p>Could you tell us more about what kind of customers they have, and what kind they would like?</p>
      <blockquote><p>Ralf Hoffmeister's superficial</p></blockquote>
      <p>Try to avoid free fonts - you usually end up paying in other ways...</p>
      <p>Case in point: among other problems, Superficial is very poorly spaced, which means you either have to spend a lot of time fixing it, or it will look like your client's customers are very clumsy people.  :-)</p>
      <p>Also, I'm getting a nagging feeling that it's a swipe-n-hack job, meaning it was based on somebody else's -possibly commercial- font. Looking at Hoffmeister's only other font* my suspicions are doubled. Please don't support theft.</p>
      <p>* <a href="http://26plus-zeichen.de/fonts/winheim/" title="http://26plus-zeichen.de/fonts/winheim/">http://26plus-zeichen.de/fonts/winheim/</a></p>
      <p>hhp</p>
