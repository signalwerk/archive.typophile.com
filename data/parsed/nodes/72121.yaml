      <p>As far as I know, it's just a matter of licensing. Yes, they are harder to design, but there isn't any technical barrier. (To be fair, we haven't tested any Arabic fonts in our WebINK font service, yet, but there's no obvious reason they shouldn't work.)</p>
      <p>Cheers,</p>
      <p>T</p>
