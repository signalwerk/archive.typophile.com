    html: |-
      <p>Thanks for the suggestion, Nabil. In fact, we have a few Arabic fonts in the pipeline, in fact. And, for designers here who have Arabic fonts, please get in touch, we're looking for more!</p>
      <p>I haven't started extensive testing in browsers yet, but as far as I know what John and Thomas say is right - if native fonts work, so should web fonts. I wouldn't be surprised if there were some corner cases that don't work properly, though. With Indic and Southeast Asian fonts, we're finding that (surprisingly to me) Mac doesn't support OpenType very well, so to work really well fonts need both OpenType and AAT tables.</p>
      <p>We'll also soon be looking for beta testers to try Arabic web fonts on their pages, so, if you've got interest and technical skill to evaluate them properly, again, get in touch.</p>
