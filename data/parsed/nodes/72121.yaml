  html: |-
    <p>Web fonts  is great idea and a very useful for web designer who feels that standards fonts are not enough .<br>
    Arabic web fonts simply doesn't exist as far as I know . that is because of the right to left complexity and for the multiple states for Arabic letter ( the letter in start of word different than it is in the middle or the last of  the word).<br>
    Is there an solution to use Arabic fonts. I have suggest an idea to Google font directory to add support for Arabic fonts please take a seconds to <a href="http://goo.gl/mod/A3vn" rel="nofollow">support this idea</a>..</p>
