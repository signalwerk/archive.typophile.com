    <p>Hello all,</p>
    <p>My name is Svetoslav Simov and I am 24 yrs old and Bulgarian.<br>
    I want to present you my new type foundry called Fontfabric.<br>
    Our goal is to create high-quality fonts which stand in a unique class of their own, and which will serve as a good base for any designer project whether it be web, print, t-shirt design, logo etc. Enjoy!</p>
    <p><a href="http://fontfabric.com/" title="http://fontfabric.com/">http://fontfabric.com/</a></p>
