      <p>A short and [over-]simple history: In the first half of the 20th century French type was dominated by Deberny &amp; Peignot (with Charles Peignot shifting the foundry from text type to display type). After WWII the Olive foundry became big, thanks in large part to Roger Excoffon's graphic bravado.* After that there was a dark ages of sorts, although there were some French individuals designing great type (like Ladislas Mandel and José Mendoza y Almeida - perhaps telling not native Frenchmen however). In the digital age the champion of French type design has been Jean François Porchez, although we have a number of great rising talents now, such as Christophe Badani.</p>
      <p>* Two highly recommended recent books on Excoffon:<br>
      <a href="http://ypsilonediteur.com/fiche.php?id=95" title="http://ypsilonediteur.com/fiche.php?id=95">http://ypsilonediteur.com/fiche.php?id=95</a><br>
      <a href="http://www.adverbum.fr/roger-excoffon-rault-david-atelier-perrousseaux_ouvrage-perrousseaux_4itkob6k386b.html" title="http://www.adverbum.fr/roger-excoffon-rault-david-atelier-perrousseaux_ouvrage-perrousseaux_4itkob6k386b.html">http://www.adverbum.fr/roger-excoffon-rault-david-atelier-perrousseaux_o...</a> (translated by yours truly :-)</p>
      <p>hhp</p>
