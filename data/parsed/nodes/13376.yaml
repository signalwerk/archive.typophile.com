    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/17745" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Designers</a>&nbsp;: Jakob&nbsp;Erbar</strong></p>
    <p>Type Designer,&nbsp;1878-1935.</p>
    <p>Jakob Erbar was trained as a type compositor in Düsseldorf and took courses in type and lettering with Fritz Helmut Ehmcke and Anna Simons. He worked as a job typesetter for the Dumont-Schauberg printing works in&nbsp;Cologne. </p>
    <p>In 1908 he began teaching at the Städtische Berufsschule, and from 1919–35 taught at the <a href="/node/add/wiki?edit%5Btitle%5D=K%C3%B6lner%20Werkschule" title="Create node &quot;Kölner Werkschule&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Kölner Werkschule</a>.</p>
    <p>He is best known for the Erbar typeface, but designed severeal others. Erbar began working on a sans serif design in 1914, but was interrupted by the war. In 1919 Feder Schrift or Feder Grotesk, a stressed style sans serif,&nbsp;appeared.  </p>
    <p>In 1922 Erbar had made drawings for another sans serif design and in 1926 the Erbar typeface appeared. It appears in supplement to “Handbuch der Schriftarten”. Erbar did have an alternate lowercase with a lower x-height, but this was not in the export version which reached America. An inline and bold version of the type called Phosper or Grotesk Lichte appeared in 1923. The Lumina and Lux faces were also variants based on&nbsp;Erbar.</p>
    <p>Created a number of typefaces for Frankfurt typefounders <a href="/node/13489" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Ludwig and Mayer</a>.</p>
    <p><em>Fonts Designed:</em><br><a href="/node/add/wiki?edit%5Btitle%5D=Feder%20Grotesk" title="Create node &quot;Feder Grotesk&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Feder Grotesk</a> (1910)<br><a href="/node/13675" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Erbar</a><br><a href="/node/add/wiki?edit%5Btitle%5D=Lucina" title="Create node &quot;Lucina&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Lucina</a>, <a href="/node/add/wiki?edit%5Btitle%5D=Lumina" title="Create node &quot;Lumina&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Lumina</a>, <a href="/node/add/wiki?edit%5Btitle%5D=Lux" title="Create node &quot;Lux&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Lux</a>, <a href="/node/add/wiki?edit%5Btitle%5D=Phosphor" title="Create node &quot;Phosphor&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Phosphor</a> (1922-1930)<br><a href="/node/add/wiki?edit%5Btitle%5D=Koloss" title="Create node &quot;Koloss&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Koloss</a> (1923)<br><a href="/node/add/wiki?edit%5Btitle%5D=Candida" title="Create node &quot;Candida&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Candida</a> (1936)</p>
