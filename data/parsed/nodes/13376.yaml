    <p><strong><a href="/node/12010" title="" class="freelink freelink-nodetitle freelink-internal" rel="nofollow">Indices</a> : <a href="/node/17745" title="" class="freelink freelink-nodetitle freelink-internal" rel="nofollow">Designers</a> : Jakob Erbar</strong></p>
    <p>Type Designer, 1878-1935.</p>
    <p>Jakob Erbar was trained as a type compositor in Düsseldorf and took courses in type and lettering with Fritz Helmut Ehmcke and Anna Simons. He worked as a job typesetter for the Dumont-Schauberg printing works in Cologne. </p>
    <p>In 1908 he began teaching at the Städtische Berufsschule, and from 1919–35 taught at the <a href="/search/node/K%C3%B6lner%2BWerkschule" title="Search this site for content like &quot;Kölner+Werkschule&quot;" class="freelink freelink-search notfound freelink-internal" rel="nofollow">Kölner+Werkschule</a>.</p>
    <p>He is best known for the Erbar typeface, but designed severeal others. Erbar began working on a sans serif design in 1914, but was interrupted by the war. In 1919 Feder Schrift or Feder Grotesk, a stressed style sans serif, appeared.  </p>
    <p>In 1922 Erbar had made drawings for another sans serif design and in 1926 the Erbar typeface appeared. It appears in supplement to “Handbuch der Schriftarten”. Erbar did have an alternate lowercase with a lower x-height, but this was not in the export version which reached America. An inline and bold version of the type called Phosper or Grotesk Lichte appeared in 1923. The Lumina and Lux faces were also variants based on Erbar.</p>
    <p>Created a number of typefaces for Frankfurt typefounders <a href="/node/13489" title="" class="freelink freelink-nodetitle freelink-internal" rel="nofollow">Ludwig and Mayer</a>.</p>
    <p><em>Fonts Designed:</em><br>
    <a href="/search/node/Feder%2BGrotesk" title="Search this site for content like &quot;Feder+Grotesk&quot;" class="freelink freelink-search notfound freelink-internal" rel="nofollow">Feder+Grotesk</a> (1910)<br>
    <a href="/node/18034" title="" class="freelink freelink-nodetitle freelink-internal" rel="nofollow">Erbar</a><br>
    <a href="/search/node/Lucina" title="Search this site for content like &quot;Lucina&quot;" class="freelink freelink-search notfound freelink-internal" rel="nofollow">Lucina</a>, <a href="/search/node/Lumina" title="Search this site for content like &quot;Lumina&quot;" class="freelink freelink-search notfound freelink-internal" rel="nofollow">Lumina</a>, <a href="/search/node/Lux" title="Search this site for content like &quot;Lux&quot;" class="freelink freelink-search notfound freelink-internal" rel="nofollow">Lux</a>, <a href="/search/node/Phosphor" title="Search this site for content like &quot;Phosphor&quot;" class="freelink freelink-search notfound freelink-internal" rel="nofollow">Phosphor</a> (1922-1930)<br>
    <a href="/search/node/Koloss" title="Search this site for content like &quot;Koloss&quot;" class="freelink freelink-search notfound freelink-internal" rel="nofollow">Koloss</a> (1923)<br>
    <a href="/search/node/Candida" title="Search this site for content like &quot;Candida&quot;" class="freelink freelink-search notfound freelink-internal" rel="nofollow">Candida</a> (1936)</p>
