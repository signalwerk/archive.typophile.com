      <p>None of those main logos are awesome, but the first one is OK. Except the widths are off. If you really do want them different, make the "E" even wider*; otherwise make the "N" wider (which would allow you to make the diagonal symmetrically placed) and the "E" narrower.</p>
      <p>* Although that would exacerbate the density imbalance between the two.</p>
      <p>As for the smaller text, I would avoid all three of those fonts (although the middle one could be cleaned up to be usable).</p>
