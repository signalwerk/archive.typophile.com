    <p>Hello all,</p>
    <p>I have a Web/Graphic Design startup I am working on and I have 3 logos I have come down to choosing. The name of the company is NE Elements, which is a play on the word any, so its really "Any Elements." The point being we use the elements of man to design things. Please look at the 3 logos posted in black and white and pick the one you like. I haven't designed any with color yet, and will move on with that once I choose a logo. Thanks all for your help. Feedback is very welcome. </p><div class="imageWrap"><img src="http://typophile.com/files/3logos_6515.jpg"></div><p></p>
