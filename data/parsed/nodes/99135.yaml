      <p>My first impression is that all three logos look a bit old-fashioned, like something that might have been designed in the 1960s. They suggest engineering or construction more than design. The three presentations of <em>NE</em> remind me of interchangeable building blocks or modules. Possibly for this reason, I'm not getting the hint that it's a play on "any."<br>
      Maybe you could do a visual play on "elements," using the layout of an element on the periodic table. (If your target market isn't related to science, technology, or education, this solution might be a little too geeky.)<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Neon_3871.jpg"></div><br>
      What do you mean by "use the elements of man to design things"? Does your business have something to do with ergonomics? If so, you might do better to use some organic forms rather than geometric ones.<br>
      <div class="imageWrap"><img src="http://typophile.com/files/modulor_800_4568.jpg"></div><br>
      (Le Corbusier's Modulor, the classic visual symbol for using the elements of man to design things.)<p></p>
