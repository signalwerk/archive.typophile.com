      <p>After searching through all "gothic" fonts. And after searching through all fonts in general I think I found it. Today felt like look at all the fonts day! I think it is Scout Condensed Light. </p>
      <p><a href="https://www.fontshop.com/fonts/downloads/font_bureau/scout_condensed_light_ot" title="https://www.fontshop.com/fonts/downloads/font_bureau/scout_condensed_light_ot">https://www.fontshop.com/fonts/downloads/font_bureau/scout_condensed_lig...</a></p>
      <p>I feel like the glow and focus blur of the interface is making it bolder than it actually is. Its not quite Scout Condensed Regular.</p>
      <p>I also feel the rest of the text is written in combination of regular and condensed Scout.</p>
      <p>Thank you Don for your help!</p>
