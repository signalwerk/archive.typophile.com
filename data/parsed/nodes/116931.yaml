    <p>Please have a look at this futuristic high res of a SpaceX Dragon 2 space ships interface - a real space craft:<br>
    <a href="https://s3.amazonaws.com/pushbullet-uploads/udqSJ-OWbNFBu4rtmGdpEf7d2kFbKshBHcdpww/DSC_2168.jpg" rel="nofollow">https://s3.amazonaws.com/pushbullet-uploads/udqSJ-OWbNFBu4rtmGdpEf7d2kFbKshBHcdpww/DSC_2168.jpg</a></p>
    <p>I am looking for the font in the LCDs. There maybe more than one font in use any help on any of the fonts would be great as I am trying to recreate the interface as a personal project.</p>
    <p>I am specifically looking for the number font that says "13:46:12".  No font I looked at has the elongated 6 or the : in the right place. Closests I found was Alternate Gothic No 2 ... but its not that. I feel like all of the numbers are in this font.</p>
    <p>Thank you for any help!</p>
