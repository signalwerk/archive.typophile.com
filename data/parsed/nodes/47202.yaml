      <p>First off, I'm not quite sure if it says "rounded" or "pounded".</p>
      <p>The big graffiti you're trying to emulate here usually has an area-filling sort of uncial quality that would seldom even start to resemble a proper lowercase. Ascenders and descenders, when they exist, would bend into an arrow or something that fills the space created over and under the other letters.</p>
      <p>Most importantly, graffiti style is extremely gestural. It is born of waving a spray can around unguided. The "by 3sixty" part looks authentic, but the main mark is simply too rigid. Even the angular styles are a lot looser; wherever you have a perfectly vertical line, try to think of ways it could deliberately slouch one way or another.</p>
