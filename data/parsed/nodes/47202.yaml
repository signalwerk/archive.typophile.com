      <p>Lex is right. </p>
      <p>Make  your target audience wish they got the commission, or wonder who the artist is, instead of calling you out as a faker.</p>
      <p>Consider creating a reference to grafitti that is not a logo. Consider painting the entire facade of the building in graffiti, but having a logotype that contrasts it, and is readable.</p>
      <p>The best example is Ape Do Good, a printer in SF. No I'm not saying this is graffiti, but it has the same street-cred without the cliché.</p>
      <p><a href="http://www.flickr.com/photos/joepemberton/910148363/" title="Ape Do Good by Joe Pemberton, on Flickr"><img src="http://farm2.static.flickr.com/1292/910148363_107cb6bf2b.jpg" width="500" height="330" alt="Ape Do Good"></a></p>
