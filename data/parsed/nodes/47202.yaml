      <p>This post is super late but just in case you still haven't sorted this out...</p>
      <p>You could also throw an ad up on craigslist for just the sketch. You'd be surprised how many writers are trying to start getting paid for it even if it's next to nothing. This could get you half or more of the way there.</p>
      <p>As far as doing it yourself, i agree with gfs and lee. My only suggestion would be to simplify it first. The foundation is the hand style which is simply writing the word. If you don't have any hand style then it doesn't matter how many bells and whistles (arrows, 3D etc.) you lace on top to try and make it "graffiti", it still wont hold up. </p>
      <p>Forget color, arrows, 3d and just practise tagging the word, this is where the flow and overall composition will come. Once your happy with that, then start adding some weight to the letters and turn it into a throw up and then a burner if need be.  If your dealing with a logo that has to be easily read, i would definitely keep it on the simple side.<br>
      Try image googling "Graffiti hand style, Graffiti throw ups and Graffiti burners"</p>
      <p>Hope this helps.</p>
