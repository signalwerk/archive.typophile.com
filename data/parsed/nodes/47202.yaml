  html: <p>I don't have any experience with graffiti. I googled some photos, and used some elements from a few to create a logo for my brother in-law. He lives in Phoenix, so there are quite a few graffiti artists in the area. He sells car audio equipment and accessories(rims, graphics, etc.) so his clients will know graffiti. Is there anything wrong with this logo, are there rules to graffiti?</p><div class="imageWrap"><img src="http://typophile.com/files/Pounded_4079.gif"></div><p></p>
