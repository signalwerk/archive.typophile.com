      <p>I also agree with Lee, Lex &amp; Joe about hiring a real graf artist to do the logo. You either can or you can't. There's no faking it. </p>
      <p>However - if you are going to do the logo yourself, I absolutely agree with Joe, that you have to reference graffiti in a way that doesn't try to simply copy it. If you look beyond graffiti style, it can be looked at as a certain approach to typography. A more honest approach. Have your brother-in-law just write his company name in his own handwriting. </p>
      <p>If you simply must have the graffiti style look, the one thing your logo is missing is connectivity. There's no continuation or flow between letters or any of it, really. None of the letters relate to each other, visually. Until you get that part of it right - it'll never look real.</p>
