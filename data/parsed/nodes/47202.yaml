      <p>Let me start by saying: There <cite>ARE</cite> rules to write by. For more on this watch "INFAMY" a good graff doc.</p>
      <p>Lex is right, I myself am a graff artist turned designer and there is nothing we [writers] hate more than someone trying to hi-jack our culture. Furthermore, most of the writers you find out there will say "it belongs in the streets not in a magazine." But it's inevitable, plus graphic design will save us all after we get arrested too many times.</p>
      <p>So with that being said, Your letters look ok but you're kind of straddling two tradional handstyles which is why it probly doesn't <cite>FEEL</cite> authentic . Contrary to what <cite>Cerulean</cite> has to say it doesn't have to be super flowy and smooth, some of the illest styles are just simple block letters; rigid as hell!</p>
      <p>Right now your caught between fat block and butter letters. It either needs to be more squared-off or be more fluid; your choice. I'd also say that you need to add some 3d perspective (see above photo), nothing too complex but it will go a long way toward making it look authentic and more polished. If you use indesign put on a drop shadow (color of your choice) make the shadow size pretty large and then crank the spread and opacity all the way up then mess with the angle. Without a 3d drop its just a burner! Thats how it gets down. Even if your demo is not strictly Graff writers you should try and do our culture justice, otherwise you're client will get no respect from the people they are trying to emulate. Keep it right not wrong.  </p>
      <p>P.S. excuse the essay but this is my wheelhouse baby! -ONE</p>
