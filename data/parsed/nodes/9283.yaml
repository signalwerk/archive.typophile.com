    html: <p>Yes in a TTF the kern table stores the kerning information. If it's 'green' then it should be properly formed.  <br> <br>I don't know about Flash or Corel Draw but in Word kerning is not applied by default you have to turn it on under font / character spacing. Even then on screen in the wysiwyg mode it might not be apparent as Word messes with the spacing to simulate the printed layout. <br> <br>Cheers, Si</p>
