      <p>I have a feeling that "good spacing" is like "good music": largely a matter of personal taste, not to mention highly dependent on the situation.</p>
      <p>I truly do not understand why the Western world insists on proportional fonts and kerning tables, when East Asia seems to get along quite happily with its characters fitting neatly into uniform cells. (Korea's variation on this is kind of cool, I think: each <em>syllable</em> fits into a cell, and the letters within that syllable are squished to fit.) But then, I seem to expect different things of characters than other people do. When I see a number like 21500 appear proportionally spaced, I want to say to the left-hand digits, "Get in your cells and stay there! Only the thousands' digit should be in the space for the thousands' digit! The ten-thousands' digit has its own space!" Similarly with words: sometimes I see the letters all mashed together. Hey folks, you're not exactly writing on goatskin: you can <em>afford</em> not to smoosh the letters together!</p>
      <p>I leave you with a sin: monospaced text figures (from eulerarchive.com).</p><div class="imageWrap"><img src="http://typophile.com/files/euler_3874.png"></div><p></p>
