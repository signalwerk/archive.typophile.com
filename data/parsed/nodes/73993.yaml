    html: |-
      <p>I'm gonna be an immovable douchebag and stick by my Times.</p>
      <p>I've laid Times LT, stretched, over the original image and, bar a tiny discrepancy on the V, it matches pretty nearly perfectly. It may be even closer with Times New Roman.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/alivetimes_3776.jpg"></div><p></p>
      <p>Another indicator that it may be Times is that they've used a freebie for the rendering of the band name on the artwork - A fanmade extrapolation of the Kingdom Hearts logo.</p>
      <p><a href="http://www.dafont.com/kingdom-hearts.font?nb_ppp=50&amp;text=Blaze+Bayley" title="http://www.dafont.com/kingdom-hearts.font?nb_ppp=50&amp;text=Blaze+Bayley">http://www.dafont.com/kingdom-hearts.font?nb_ppp=50&amp;text=Blaze+Bayley</a></p>
      <p><a href="http://en.wikipedia.org/wiki/File:AliveInPoland.jpg" title="http://en.wikipedia.org/wiki/File:AliveInPoland.jpg">http://en.wikipedia.org/wiki/File:AliveInPoland.jpg</a></p>
      <p>Having said that, Aviano is lovely. And a much better choice.</p>
