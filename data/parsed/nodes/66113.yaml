    html: <p>I think you did a great job in updating the website so that you will be able to serve the people more. Have you heard the latest buzz over the James Cameron film Avatar, but the latest rumor and talk about the science fiction epic is that it is racist. Obviously, there are contingents of people out there with too much free time and not enough intelligence, but the story goes that James Cameron and Avatar are racist because the hero is white and male and saves a non-Caucasian alien race, which is less militaristic, industrial with a more egalitarian culture. By that logic, so is Dances with Wolves, and Lawrence of Arabia, yet those films aren't pilloried as such. Honestly, serious people would give payday loans at least to make such ill-conceived arguments go away.</p>
