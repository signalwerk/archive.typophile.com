      <p><cite>5star - your profile says you've only been a member for just over a week... is that correct?</cite></p>
      <p>Hi Si, yeppers, I'm back after getting pushed down some roads of intense creativity. Man 'o' man, what a trip! Couldn't socialize, couldn't move away from the creative process, I could barely eat - sleep when exhausted. At the end of it all I managed to open doors into many different worlds.<br>
      Including getting a shot to have my type based sculpture (which I created and built over the last two years!) shown in our National Gallery up here in Canada! Presentation coming up in early May. </p>
      <p>Intense crazy run. I'm still a little wobbly. But feel well and chatty. I was formally known as Hiroshige / Hiro. Great to see some familiar faces still kickin' 'round these hallowed halls.</p>
