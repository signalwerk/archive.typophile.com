      <p>Hello Owen. Thank you for asking this question. I have a few answers which are mostly personal. I don't think I can speak much for other type designers.</p>
      <p>One thing type designers all have in common may be a desire to express ourselves in a universal way. This we effect by "drawing lines around letters" (was it Benguiat who said that?), or redfining the alphabet. It doesn't even have to be the Latin alphabet. But alphabets are universal and affect whole cultures, entire civilizations. That's a pretty universal and widespread thing to make an impact on. Letters, and typefaces, are tools of language and culture, and we are attracted to the potential of shaping language and culture thru typeface design. To a large extent our influence is subliminal, going largely unnoticed, yet the influence of type may be more persuasive than is generally realized.</p>
      <p>I have tried to make the influence I exert on the Latin alphabet philosophical, taking into account much art history and history of type design. For other type designers the quest is more a matter of pure aesthetic influence by way of fashion and visual prominence.</p>
      <p><em>. . . how important is everything else?</em></p>
      <p>Everything else is very important. Type is not my obsession (interest in the one thing to the exclusion of all other things), but the rest of the world weighs heavily on my mind and has a huge influence on the kind of typefaces I design and the way I design them. The "tyranny of the mainstream" in the sense of mainstream culture for example, is directly responsible for my fonts based on the very idea of non-conformity and bucking conventions. That philosophy in itself runs counter to the basic premise of type design, the integration of disparate letterforms into a homogenous unified regiment. Even so, I've found it is possible to design fonts that defy certain rules of integration yet are stylistically unified at the same time. The effort to make such consistently inconsistent types is also driven by my strong support of tolerance within society. Tolerating people and things that fall outside the mainstream, even those I dislike, is very important to me as a person, so it makes sense to extend this moral philosophy into typeface design too.</p>
      <p>Everything else is important. I love architecture and industrial design, and try to put those things into my type designs. The nature of cats, spiders, cephalopods and dogs all influence the appearance of a couple of my fonts. The nature of spirituality and emotions bordering on religious conviction too, relativism, my near-death experience and second lease on life, the suffering of disenfranchised and "gifted" people I converse with on the street (we used to call them handicapped), the innocence of a child, the loss of a friend. Everything else is important and affects the fonts I design. Every bit of it.</p>
      <p>j a m e s</p>
