      <p>So far much of what I've said on this topic has been negative. I'm determined to balance that with the positive side, because telling both sides of the story and giving a balanced view counts for a lot. Typophile's members and readers must be tired or at least bored by my harsh criticism, so I am making this one count for as much as possible.</p>
      <p>I owe my whole type design career to Americans and Canadians, whose established type industry sells my fonts to the world. My hat is off. <strong>And hey, I mean it</strong>. I owe you people an incalculable debt of gratitude and respect. I may be critical of the retail font business but I'm no fool. It's a business. Like any other business, it has its share of problems. It has many strengths too, having expanded the range of fonts available to graphic designers at absurdly low prices. Its health is reflected by the extent of open competition between players and a notable lack of monopoly. "Anti-trust" is not known to us.</p>
      <p>I owe much gratitude and thanks to the Typophile community for providing me and every other type designer in the world with a remarkably diverse, tolerant and informative environment of learning and typo debate. No other industry I know of has anything like the equivalent of Typophile. We are unique, our level of talent is awesome (in the true sense of the word), and Typophile's ability to foster new talent makes it a beautiful thing. Coaching up-and-coming type designers in the Critique forums here has been a blast and a distinct pleasure for me. I've met some great young people and managed to pass on some of the skills and philosophy I acquired by a combination of working out for myself and learning from established living luminaries. There are too many of them to list.</p>
      <p>". . . an indusrtry populated by no-talents . . . " is a very biased and unfair picture. It isn't all that bad, but it can sometimes look that way. In reality there are hundreds of very gifted artists and designers now working in type design. I prefer to dwell on that than on the bad eggs who specialize in making knock-off fonts. We all know who they are so there's no point, no need to list them here.</p>
      <p>If you're in it for the money, there's nothing wrong with making trendy commercial fonts, but be aware of the limitations or that career track.</p>
      <p>If you make fonts purely for the love of type and letterforms and a love of language, history and culture, there is plenty still left to do, so go for it.</p>
      <p>If you make fonts for a combination of the reasons outlined above that's fantastic too and you should do it as much as you can, as best you can, without regrets. Life is too short for regrets.</p>
      <p>Last but not least, a message to the Typophile community: <strong>be tolerant</strong>. The world is full of things that pisss us off, and so is typography. But we have to live with it. We have to coexist with things and typefaces that grate on us. We don't have the luxury of choosing, or the luxury of getting depressed and upset about it. So just—tolerate it, and things will go a lot smoother. Try to get inside the head of each and every typeface, each and every type designer and type enthusiast, and see yourself and the rest of the typosphere <em>from their point of view</em>. We are all engaged in the same basic struggle. Just trying to survive.</p>
      <p>Typophile and making your own fonts does not make the struggle go away. It only makes it more interesting.</p>
      <p><em>Flies in the vasoline we are<br>
      Sometimes it blows my mind<br>
      Keep gettin' stuck here all the time</em><br>
      —words by <a href="http://en.wikipedia.org/wiki/Scott_Weiland">Scott Wieland</a>.</p>
      <p>j a m e s</p>
