      <p><em>it takes bloody ages to do, and a lot of it is repetitive and boring</em></p>
      <p>One of the nice things about type design is that the work is never boring, because every decision as to where to place, say, an accent, or exactly how to shape the bowl of a g, is really important, so there is no fall-off of diminishing returns. The more work you put in, the better the typeface gets. If a task is repetitive, it can be automated.</p>
      <p>But of course, there's more to life, as with any line of work--who wants to live a mono-dimensional life?</p>
