      <p>I just came here to add something about commissioned type versus retail font sales to another thread.</p>
      <p>There isn't a lot of money in retail fonts unless you are a large vendor like Fonts.com, Myfonts, Ascender Corp or Veer, with sizable collections from numerous sources. There isn't much in the way of retail font sales to be had by font makers thru those outlets unless the font maker is prepared to make trendy, commercial retail faces. I prefer to call those ones "shitty trendy", because so many of the very successful ones are quite shitty from the standpoint of type design. So far I have refused to make trendy commercial fonts for retail sale, as that would be way to close to prostitution or fobbing my soul to the devil (not that I believe Satan even exists). Instead I have made only the fonts I want to make for retail, and enjoyed mild sales success. Thank you Myfonts.</p>
      <p>I've earned much more money from commissioned font design and production. The problem with commission jobs is that they are, as you say, client-driven, and that usually means very boring specs for the designs you make for them. Making clones of Impact, Arial and other popular fonts whose owners charge exorbitant license fees for bulk-o # of seat installation --- is not much fun or creative challenge, but it pays well and is slightly more fun than making trendy commercial fonts for retail. Trendy commercial retail fonts don't offer much creative challenge since their specs are already well established before they hit the market; nothing to figure out, nothing to design, a foregone conclusion, boring, boring, too boring even for pretend consideration unless you enjoy doing that sort of thing. </p>
      <p>j a m e s</p>
