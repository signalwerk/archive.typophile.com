      <p>I think font creation is far more satisfying than type design.</p>
      <p>Type design is creative. A language has many letters, and oten many additional marks. So, the creativity is multiplied and also multi-faceted. It is multi-faceted, because of a few factors.</p>
      <p>1. The general type design must be transfered to take on different but common expression in the various shapes of the letters and additional marks. If the type design is inconsistant, then it fails, because certain shapes are out of place.</p>
      <p>2. The general type design is challenged, because each letter shape or additional mark poses its own limitations due to appropriate black/white "color" balance.</p>
      <p>But font creation is much greater, because there are many more factors that go into a good font than mere type design.</p>
      <p>For example, font creation also includes other creative and technical factors.</p>
      <p>Kerning is an example of something both creative and technical that is addressed in good font creation.</p>
      <p>Hinting is another example of something both creative and technical that is addressed in some very good font creation.</p>
      <p>Both of these examples require the font creator to have a very sensitive eye for detail. Many good artists of attractive type design lack a very sensitive eye for detail.</p>
      <p>Encoding is an example of something technical that is necessary for correct font creation.</p>
      <p>Nowadays, font formats are becoming increasingly more complicated. For example, OpenType offers many more possibilities to the diligent font maker. An impotant programming aspect is added to the font maker's "bag of goods".</p>
      <p>If we tally it up, font creation is much more exciting and rewarding than type design.</p>
