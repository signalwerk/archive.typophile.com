      <p>But to answer thread title question: <em>Can type design make you happy, or do you need something else?</em></p>
      <p>Type design and making fonts has not made me happy, mainly because I'm not prepared to make the kind of fonts people will pay money for, whether retail or commission, makes no difference to me. It's the everything else that makes me happy. I don't even try to earn a livelihood from type design. Kept my day job, wouldn't even consider throwing in that towel. The prospect of working full time in what is a corrupt business populated by a lot of no-talents who rip off each other's work and demonstrate the most unprofessional conduct you'll see this side of the fashion industry -- does not appeal to me much.</p>
      <p>* Typeface design itself is great fun.<br>
      * There isn't much money in doing it as a profession.<br>
      * The people in this business make me not want to be in it because they're so childish and unprofessional.</p>
      <p>j a m e s</p>
