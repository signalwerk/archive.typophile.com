      <p>Wow James. Thanks for giving the time to make such interesting comments. I see from your MyFonts biog that you're a bit of a polymath; I'm also into video, music, writing etc, and I find type design balances pleasantly with more moi moi kissy type aesthetic activities. I think you're right about universality: typography's literally the full A–Z, twice, and then all those other characters you never thought you'd have to deal with. I know what you mean about wankers in the industry. I got my graphics degree last year, and one of the six people that got a first basically copied everything from someone the year before. I honestly can't put myself in a position to understand how you could live with yourself doing that. It seems to be the opposite of everything that would persuade you to go to art school in the first place. I suppose it is a lot to do with tolerance; but can we tolerate intolerance?</p>
      <p>O</p>
