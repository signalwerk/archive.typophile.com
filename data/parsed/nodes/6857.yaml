    html: <p>joseph, i agree overall. helvetica is not really meant to perform as a text face though i've seen it done well in lighter book weights. over all it's a great workhorse though because it walks the line between text face and display face. this makes it great for setting headers as well as moderate amounts of copy.  <br> <br>my point here though is that there is a classicism in the realm of design that is so often over looked or missed. this happens when people so easily drop something because it's not cool anymore. the beauty of helvetica is that it's already been not cool for such a long time. so much so that it's become an ambiguous part of the world and it's communication. there's a lot to be said for a typeface that has worked itself so deep into the fabric of communication that it goes unnoticed. saying helvetica is overrated is like saying bread is overrated.</p>
