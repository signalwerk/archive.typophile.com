    html: <p>I'd say the most overused font is probably Helvetica/Arial/Swiss. I had a meeting with a potential client yesterday, and kind of hinted at my dislike of Helvetica. He immedialy said he never uses Helvetica, but he likes Arial and Swiss! OMG! His current business card is clearly set in Helvetica... Not sure whether I should work with him. <br> <br>Meta is still used a lot. Helvetica of the 90s [chuckle]. <br> <br>Mrs. Eaves and Minion are probably the most overused serifed types in North America. <br> <br>Not to mention Interstate. It's everywhere here. <br> <br>And 90% of film titles use Trajan (actually works quite well on the movie screen). <br> <br>How about typefaces that are <i>underused</i>? <br> <br>ITC Charter is very underused. An extremely elegant workhorse type by Matthew Carter. I use it on my business card and all my general office things.</p>
