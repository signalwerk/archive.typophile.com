    html: <p>I don't think I agree with you there, Jay. To the best of my knowledge, Helvetica has never really been so uncool. Yes, people stopped using it for a bit in the 90s, but now it is as cool as ever! It is back as the most trendy typeface. IMO, Helvetica is loaded with meaning, as the de facto Swiss modernist typeface. If you need something classic and somewhat invisible and neutral, Univers is a better choice, I think, not Helvetica. Semantically, I think, Helvetica conveys a yuppie lifestyle. We see it a lot in Vancouver, because it's a yuppie city! It's trendy! <br> <br>Helvetica is not really suitable for setting continuous text at all. The letters were designed so that they wouldn't cohere well together - they are so individual and self-contained. The forms are terribly homogenous, making word recognition rather tough. Helvetica is simply not a good everyday workhorse. There are too many jobs that it won't do well in. <br> <br>I think serif types are more invisible to the average reader. They don't notice it as much. If you use a sans, then they immediate associate it with 'modern'.</p>
