  - id: 47704
    user: 1551
    date: 2003-03-18T14:02:00
    date_raw: 18 Mar 2003 — 2:02pm
    votes: null
    html: <p>OK, here's an amateur disagreeing.  <br> <br>Times New Roman is a great text face. Like Caslon, Baskerville or Garamond it will not wear out its welcome. It is just often wrongly used. For example on American letter size paper it, as a very condensed face, produces lines that are way longer than ideal. According to Bringhurst, the ideal is around 66 characters per line, and Times at 12 pt on letter paper with one inch margins is way longer than this. Courier is actually better on such a long line.  <br> <br>Minion is a Garamond with large x-height and also quite condensed, which is perhaps why it is so useful and used. Is it too condensed? Does it pull this off less well than Times?  <br> <br>I guess time will tell. <br> <br>I think the issue of freshness applies much more to display type and overall design than to text types.  </p>
    html_clean: <p>OK, here's an amateur disagreeing.  <br> <br>Times New Roman is a great text face. Like Caslon, Baskerville or Garamond it will not wear out its welcome. It is just often wrongly used. For example on American letter size paper it, as a very condensed face, produces lines that are way longer than ideal. According to Bringhurst, the ideal is around 66 characters per line, and Times at 12 pt on letter paper with one inch margins is way longer than this. Courier is actually better on such a long line.  <br> <br>Minion is a Garamond with large x-height and also quite condensed, which is perhaps why it is so useful and used. Is it too condensed? Does it pull this off less well than Times?  <br> <br>I guess time will tell. <br> <br>I think the issue of freshness applies much more to display type and overall design than to text types.  </p>
