    date_raw: 18 Mar 2003 — 4:53pm
    votes: null
    html: <p>JFP, you beautifully describe Minion. Thanks! Your observation that Slimbach's ambition was to be usable where Times is usable is insightful.  <br> <br>I didn't mean to say that Minion was a copy of Garamond, only that Garamond seems to be its point of departure; it has calligraphic touches and opens up the a and e, etc. But there is still a noticable resemblence to Slimbach's Adobe Garamond - a more beautiful face, but not as adaptable. 'Myfonts' classifies Minion as 'Garald', which I guess is the term I should have used.  <br> <br>As you are the designer of very impressive Sabon Next, I would love to hear what you think are the strengths and weaknesses of Minion! <br> <br>Hrant, of course Courier is not a text face. It is a typewriter face, but I find it telling that it is still widely used on letter sized paper. I much prefer the European A4 paper, which is narrower; but even it is wide. I would be interested whether Courier is still used in Europe for legal work, etc. <br> <br>I think there is a gap for some enterprising designer to do a better very wide face for correspondence on letter or A4 paper.  </p>
