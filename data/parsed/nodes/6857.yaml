    html: <p>keith, helvetica was designed in the mid 1950's it is the predecessor to typefaces like adrian frutiger's univers. it was an attempt to create something to compete in europe with akzidenz grotesk. it was the typeface to end all typefaces in the 1960's and 70's then it fell out of use in the 80's because it was so popular. only to come back into use in the late 1990's because of the post modern aesthetic. now with the revival of modernism it has maintained a foothold with young designers because it is such a call back to institutional design of the past. <br> <br>as far as it's robust use there are many older and wiser typographers then you or i that would disagree with you. the fact is that it has been used to set copy countless times. i agree with you that it's not the best text face out there but it's got a pretty damn good track record for a san serif. and that's not really open for debate.</p>
