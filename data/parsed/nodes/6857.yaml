    html: <p>helvetica is much more popular then universe because it is a better typeface. i love adrian frutiger and he's a great type designer but univers falls short. it just looks awkward. it ,as well as helvetica, were reaching for the same thing and helvetica just did a better job of achieving it. like i said before i think this is apparent in it's track record and wide usage. granted i can jive with the whole "80% of the world likes brittney spears but that doesn't mean she's good, thing" but i just don't think that pertains here and i'm amazed that anyone would even go there. i mean for god sakes we are talking about helvetica here aren't we. it's kind of like saying the beatles suck because the never played heavy metal. but yet heavy metal owes everything to the beatles. <br> <br>is helvetica robust? yes. the counters are as open as i've seen in a long time. i'm not sure what cut or weight you're looking at, but damn it's pretty open in there. <br> <br>like i said before comparing a lineal humanist to a lineal geometric is drastic and you'd have to be stupid in the head to think that a geometric face sets better for running copy then a humanist face but that's not my point. my point is and has been that helvetica is a great all around face it sets better then any other face we've talked about for display and does a pretty bang up job at setting moderate amounts of text in book weight.</p>
