    html: <p>If Helvetica is popular, then it hasn't disappeared into the subconscious of the populous. --- Helvetica is decent enough for annual reports and brochures, but not for books. --- Let us all dust off our copies of Stanley Morison's "First Principles of Typography" (I know you have a copy, admit it!) --- People were (are) often confused about what Mr. Morison was talking about. He himself had to clarify, years later, that he was indeed talking about typography for books. --- I think that it is important to qualify and clarify "what kinds of typography".  --- I have to agree with Keith (and Hrant). Helvetica isn't good for long setting of type. Now. I also think that Jay would agree with that. I'm trying to read between the lines here. Helvetica is not a good read. I'd go bonkers. Doing research on the use of space in typography yielded some very painful reads when I started to cover the swiss time period. M</p>
    html_clean: <p>If Helvetica is popular, then it hasn't disappeared into the subconscious of the populous. --- Helvetica is decent enough for annual reports and brochures, but not for books. --- Let us all dust off our copies of Stanley Morison's "First Principles of Typography" (I know you have a copy, admit it!) --- People were (are) often confused about what Mr. Morison was talking about. He himself had to clarify, years later, that he was indeed talking about typography for books. --- I think that it is important to qualify and clarify "what kinds of typography".  --- I have to agree with Keith (and Hrant). Helvetica isn't good for long setting of type. Now. I also think that Jay would agree with that. I'm trying to read between the lines here. Helvetica is not a good read. I'd go bonkers. Doing research on the use of space in typography yielded some very painful reads when I started to cover the swiss time period. M</p>
