    html: <p>&gt;A font wide enough to fill a letter-size page with one column of ~66 chars would be totally unreadable. <br> <br>Ok Hrant. The Courier l.c. alphabet at 12 pt. is 186 points wide. According to Bringhurst's table an alphabet of this width set 36 picas (6 inches) takes up 68 characters. So Courier will set a letter sized paper with 1 1/4 inch margins to almost the ideal.  <br> <br>Currently, movie scripts still have to be done in Courier, and many law firms still use it on all their stuff.  <br> <br>Not to mention that for forty years a huge amount of correspondence and manuscripts were done in Courier.  <br> <br>Were all these and are they still all unreadable?</p>
