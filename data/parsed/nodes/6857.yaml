    html: <p>I think the very reason why Helvetica was so popular was because it had a hell lot more attitude than the humble Univers, which was a contemporary essentially (they're just a few years off). It wasn't something to compete with Akzidens Grotesk as such, but a 'new and improved' version of it (with all the nice bits stripped out). In a way, Univers could have been as popular as Helvetica if it was only a functional universal typeface that designers were after. But IMO, it wasn't like that. <br> <br>Is Helvetica robust? Of course not. There are a lot more robust typefaces than it. The counters are not very open, therefore it's prone to confusion. Sadly, they are used a lot for directional signage (e.g. Vancouver street signs) and it's not the best choice, functionally speaking. <br> <br>A typeface with a good track record doesn't mean that it's necessarily an inherently good typeface. It just sold well and it was just one of the few that was available on most typesetting machines. Letraset also made a lot of Helveticas (I have a whole drawerful under my desk right now). It was a default font on the Mac. So it's never the sheer goodness of a typeface that makes it popular. <br> <br>&gt; to compare kievit to helvetica is a bad comparison it's like comparing &gt; optima to futura. one is ultra humanist while the other is ultra &gt; geometric. it's like apples and oranges. you may like oranges better &gt; but they don't compare well out side of your bias. <br> <br>Really? I don't think so somehow. Kievit is a much 'better' typeface for reading of any long continuous text than Helvetica, because of its humanist forms - the letters flow into each other effortlessly. So, when you have a criteria established (say, compare Kievit and Helvetica for the setting of the contiouous text for an entire book) then of course the result is obvious.</p>
