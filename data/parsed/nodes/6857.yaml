    date_raw: 18 Mar 2003 — 2:13pm
    votes: null
    html: "<p>A font wide enough to fill a letter-size page with one column of ~66 chars would be totally unreadable.  <br>  <br>Times:  <br>It's really a display face. It's too light, too contrasty and too \"architectural\" for optimal reading. Its vertical proportions are good, as is its condensation, but that's not enough to put it up there with the really good stuff. It <i>used</i> to be a text face when it was introduced as a metal (composition) face, \"thanks\" to ink gain (which increases weight and reduces contrast).  <br>  <br>hhp  <br></p>"
