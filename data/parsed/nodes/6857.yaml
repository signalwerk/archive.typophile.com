    html: <p>55 to 65 characters per line is the result of readability studies from the 60s and 70s, but also of the work from Jan Tschichold before that and even before the old Italian typesetters did it right intuitively. It has been proven that, because we read not single letters but by jumping in saccades over the printed page, that too short lines and too long lines are obstacles for the reader. Although this depends strongly on the content (a lexicon could have shorter lines as you're not reading a longer line but scan for information, a letter could have longer lines because it is shorter than a book text and -- sometimes -- more personally involving) and proportion of the medium itself, the basic rule applies to letter-sized and A4-publications as well, which is why on a standard letter page I almost never use the full width but try to proportionally find a good place for 55 to 75 cpl :-).  <br> <br>And yes, Courier is, if the margins are chosen correctly, pretty much exactly 55 to 65 characters per line on A4 in 12 pt. It's not a highly accurate prophecy of the printed page, though, as Courier and such are monospaced and a proportional typeface will behave a bit differently -- but I think all in all it's a solid enough guess to work practically. But of course you can achieve the very same effect these days with any other proportional font by just modifying the size margins accordingly -- it's nicer to read and you can actually use a proportional font (the text will, of course STILL flow differntly in Quark and InDesign, but at a Word-Document using the same typeface and the same characters per line should be just as accurate, if not even moreso than the Courirer-technique.  <br> <br>Courier, these days, is best use ironically and, of course, it's perfect if you want to make a letter look as if written by some kind of bureaucracy -- people actually read a letter printed in such a shabby Courier-Font more intensely asthey suspect/expect that it's official :-). </p>
