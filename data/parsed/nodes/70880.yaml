      <p>The complete list of FWG typefaces can be found at Goudyfonts.com but he did, indeed design each in your list.<br>
      OldStyle and oldstyle italic were created for ATF and ATF further expanded it to include additional weights. Not sure what Goudy STD is. Text is a blackletter design - one of the best IMHO. Heavyface is a very bold display face. Modern is one of his best text faces - not really 'modern' in the sense of what most modern types are considered (like Bodoni or Didot).</p>
      <p>I hope that helps<br>
      Steve</p>
