      <p>Frederic W. Goudy designed a large number of typefaces during his career.</p>
      <p>Some of them have been redrawn by others when they were made available in digital form.</p>
      <p>There is, however, one group of typefaces bearing his name about which there is reason for confusion. Goudy Old Style was designed by him, but then he left American Type Founders, and they created a number of variations of this very popular typeface without his involvement. That is the only situation I am aware of where there is serious confusion about the design of a typeface with which his name is associated.</p>
