    Goudy OldStyle Std<br>
    Goudy Std<br>
    Goudy Text MT Std<br>
    Goudy Heavyface Std<br>
    Goudy Modern MT Std</p>
    <p>I am somewhat confused with the different explanations given on the net. thanks.</p>
