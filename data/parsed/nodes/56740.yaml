  html: |-
    <p>I am building a family and have six weights. Somehow the unicode is not consistent for all glyphs for all fonts. </p>
    <p>I'm thinking of something like 'Paste Special' where you can select all glyphs, copy the unicode from one font and paste special to all other weights thus ensuring consistency.</p>
    <p>Is there any way of making it the same for all fonts?</p>
