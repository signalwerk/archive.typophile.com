    html: <p><a href="http://www.fontqa.com/">FontQA</a> can help you making sure that all weights have the same character set by comparing glyph names. When your glyph names are the same, use "Glyph → Glyph Names → Generate unicode" in FL Studio to regenerate the unicodes, and they will also be the same in every weight.</p>
