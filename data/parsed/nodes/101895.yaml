    html: |-
      <blockquote><p>Can I use any of the fonts installed on my Mac</p></blockquote>
      <p>Adobe applications generally install a number of fonts in the Library/Fonts folder depending on how you have configured the installation. For example, <a class="freelinking external" href="http://www.adobe.com/type/browser/fontinstall/cs6installedfonts.html" rel="nofollow">Adobe CS6 installs a variety of fonts depending on which applications and combination of applications are installed</a>. The license typically permits you to use the bundled fonts with the application to produce documents in line with the capabilities of that application.</p>
      <p>Other fonts installed as standard with your operating system are licensed in line with the operating system and its standard application software, which does not cover third party applications, such as Adobe's CS6 suite. As such I would assume (though I am not asserting) that you would require a separate commercial license in order to use those fonts as part of an Adobe CS workflow. Annoyingly no real distinction is made in Adobe's (or any other applications) font menus and so it is left to the user to understand licensing restrictions and make that judgement.</p>
