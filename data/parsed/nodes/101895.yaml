    <p>Hi,<br>
    First post. New designer.</p>
    <p>I have a question regarding the legality of using typefaces.</p>
    <p>Let's say I use Adobe CS to design a poster/brochure/logo for a company, for which I will be paid. Can I use any of the fonts installed on my Mac (such as Futura, Helvetica, Hoefler ...) without any issues or should either the client or the designer (me) purchase a licence for the specific usage of the chosen font?</p>
    <p>Essentially, can all the fonts that come with the OS or the design software be used for any reason?</p>
    <p>Thanks,</p>
  html_clean: |-
