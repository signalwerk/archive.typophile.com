      <p>“to design a poster/brochure/logo for a company, for which I will be paid”? Generally, yes: they’re working tools for working professionals.</p>
      <p>“can all the fonts that come with the OS or the design software be used for any reason?”<br>
      Generally, no: they can“t be resold, “sublet” (made available to others on a publicly-accessible server), used on the web or embedded in anything other than a PDF.</p>
