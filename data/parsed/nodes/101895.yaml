    html: |-
      <p>Generally speaking, font licenses permit the things that fonts are normally used for (documents, brochures, posters, etc). I believe that fonts that come with the operating system or with Adobe CS tend to have few restrictions, other than the obvious one that you can't give copies of the fonts to other people.</p>
      <p>Some fonts can't be embedded in PDFs and you'll get an error message when you try to make it. I believe it's because they were concerned that someone might extract the font from the PDF. I think most designers would avoid buying fonts that have that restriction since PDFs are a common way to email layouts and proofs to clients, but if that happens on a job and you can't switch fonts, just save it in another format. </p>
      <p>Some fonts may also carry specific restrictions, such as you can't use them in logos. Just read the font license to be sure.</p>
