      <p>The Mac OS licence agreement is very clear about fonts:</p>
      <blockquote><p>E. Fonts. Subject to the terms and conditions of this License, you may use the fonts included with the Apple Software to display and print content while running the Apple Software; however, you may only embed fonts in content if that is permitted by the embedding restrictions accompanying the font in question. These embedding restrictions can be found in the Font Book/Preview/Show Font Info panel.</p></blockquote>
      <p><a href="http://images.apple.com/legal/sla/docs/OSX1082.pdf" title="http://images.apple.com/legal/sla/docs/OSX1082.pdf">http://images.apple.com/legal/sla/docs/OSX1082.pdf</a></p>
