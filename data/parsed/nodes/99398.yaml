      <p>Hi Steve,<br>
      you can do a perspective correction in Photoshop, but it's a bit complex as it usually involves more than one steps - depending on the image:<br>
      I usually perform an Arbitrary Rotate (to horizontalize the baseline) and then select the text area and do one or more Edit-&gt;Tranform-&gt;Perspective or Edit-&gt;Tranform-&gt;Skew operations.</p>
      <p>The complexity -and the inaccuracy- of the above operations led me to design a new tool for our font identification software (Find my Font v3.1) which allow you to select an image area and perform any or all of the following operations as a single task:<br>
      =&gt; Deformation/Perspective correction<br>
      =&gt; Image enlargement<br>
      =&gt; Image mirroring<br>
      =&gt; Contrast correction<br>
      =&gt; Expand/Shrink Text width</p>
      <p>You can find more details and an image example of how it works in the following Typophile thread:<br>
      <a href="http://www.typophile.com/node/92904" title="http://www.typophile.com/node/92904">http://www.typophile.com/node/92904</a></p>
