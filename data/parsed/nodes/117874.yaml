    html: |-
      <p>If we can't find a match, you might try to reverse engineer the font.<br>
      You could use Code Pro Bold, perhaps with minor adjustments, for capital letters like _C_,  _G_ [raise bar and top terminal], _M_, _W_. and something like Platform Bold for letters like _R_ [widen bowl slightly] and _P_ [ditto]. The remaining capital letters, with the exception of _S_ [which differs from the title] could be taken from either font and width adjusted to match. As for _S_, Nobel Bold and Benton Sans Bold seem to have a match.<br>
      As for the lower case, the letters are too small to make a specific suggestion, other than to note that it has a two story _g_ with an upper bowl that seems slightly larger than the lower bowl that descends only slightly below the base and is not separated from the upper bowl, which may have an ear at 2 p.m. Could use _s_ from Nobel or Benton Sans<br>
      Glyph capital height of the component fonts would need to be standardized and, if the stroke width of the Bold is not identical, the stroke width of one or the other should be adjusted.<br>
      Minor point, based on the umlaut, all punctuation should be in square format. See for example Benton Sans.<br>
      Don</p>
