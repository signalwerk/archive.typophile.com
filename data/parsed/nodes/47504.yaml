      <p>I finally gave up on Suitcase completely. It WAS the best/only thing out there (pre-OSX), but corporate changes and OS changes have taken their toll. Reasons:</p>
      <p>1) Major releases/versions are buggy as hell;</p>
      <p>2) LOTs of updates to fix (1) </p>
      <p>3) Updates are a PAIN to get at (I feel like I have to give blood to get to their download area)</p>
      <p>4) For all their hype, the "features" they keep adding do nothing but distract</p>
      <p>5) NOT cheap (I'm tired of the "We're gonna upgrade the version to infuse some cash" philosophy)</p>
      <p>Extensis is a perfect example of a company that's goal seems to be to make things more difficult and obtuse voer time so you have no alternative but to submit to their superior corporate will. Portfolio is another example -- the ONE THING it should do well (let you quickly look up archived files by keyword) it does HORRIBLY, while Extensis spends time adding new Views to the windows or new icons. Argh.</p>
      <p>You may want to wait and see what Apple is up to with Snow Leopard (OS 10.6)... It's very server-oriented, and one of the changes may be font management. Otherwise, I'd recommend FontAgentPro.</p>
