    <p>Hi All,</p>
    <p>I understand Extensis has recently released something called "universal type server". Has anyone been using this? We have about 12 machines in our office that are running Fusion. Fusion, in and of itself works fine, however, not following "best practices" seem to be what pull users into a pit of font problems (that and Microsoft Office). </p>
    <p>There is some good info on organizing and managing fonts in the literature Extensis provides, but I was wondering if any of you have any sage advice for managing office fonts, client fonts, deploying newly purchased fonts, etc. Is Universal Type Server the answer?</p>
    <p>Thanks in advance.</p>
    <p>chris</p>
