  html: |-
    <p>For about a week new I’ve had what appears to be a few corrupt fonts that I just can’t get rid of in my Indesign CS2 font menus. The name of the fonts are corrupt, and when I try to use them I get an error message stating that the fonts cannot be printed because the outline files are missing. I’ve checked and cleaned up my user, system, and indesign fonts directories as well as clearing all application and system font caches. I have also nuked all the old adobefnt.lst files. Nothing has removed the screwy font. Here’s a screenshot of it in the menu:</p>
    <p></p><div class="imageWrap"><img src="files/wtf_6422.gif"></div><p></p>
    <p>Any ideas?</p>
