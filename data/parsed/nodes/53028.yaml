    <p>Greater Albion Typefounders’ biography on MyFonts.com&nbsp;says:</p>
    <p><cite>“Whither elegance in this modern world?”</cite></p>
    <p>Greater Albion Typefounders has been established to do a little bit to overcome one of the many crises facing the world today. We (The Typefounders) can’t make a dent in global warming; we don’t know where to start with the Global Financial Crisis, but we thought we’d ‘have a bash at our own little bit of the crisis in design. To us, modern design all seems so bland. Sure, it works, sometimes it even works well. But there’s seldom a sense of style, seldom a hint of elegance unless you call severe blandness ’[elegant simplicity’, which isn’t a line of thinking that ever impressed us. So we decided to do something about it- we decided to bring you new Typefaces that honor the spirit and style of the past. Want to be right up to date with a brand new typeface, but right in tune with the spirit of designers trained in classical ascetic values? Then why not try us and see what we have to&nbsp;offer.</p>
    <p>What we will offer is new designs, replete with Edwardian Fun, Victorian distinction, or any other piece of elegance we can manage. Come along for the ride!”<br><br>
    Hopefully this captures the spirit of this foundry, newly established in 2008, by Paul J Lloyd, previously known as a prolific designer of freely released fonts.  As at December 2008 they are offering the following families of&nbsp;faces:</p>
    <p>- Absinette<br>
    - Adantine<br>
