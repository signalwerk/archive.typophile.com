    html: <p>Actually, this was reported as a bug to the FontLab folks a while back. I just tested it in FontLab 4.6.1 and it seems to work fine! <br> <br>I took Myriad Pro Italic, set the em square to 2200, didn't scale the glyphs, and exported as a (renamed) Type 1. The resulting font behaves as I would expect. <br> <br>Cheers, <br> <br>T</p>
