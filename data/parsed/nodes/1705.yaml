    html: <p>FWIU no matter what UPM you use in the design space, once you make a Type1 font it is converted to a 1000 UPM so by working at 5000, you will introduce rounding errors. <br> <br>If the logo is that detailed that 1000 UPM wokspace make it distorted, it may be best to keep in in an importable eps format. <br> <br>Or make a TrueType version of the logo, working at 2048 and with FontLab you can hint the Bejeezes out of it to control its small size rendering. <br> <br>James</p>
