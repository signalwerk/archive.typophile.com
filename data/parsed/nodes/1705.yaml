    html: "<p>I have a logo font here, that I created a while back when I was on Mac OS 9.2 or 8.5. Never had troubles with it until I moved to OS X. I was using it principaly for my invoices in FileMaker. I would then output the FileMaker invoice to a PDF file, where my Logo Font was embedded. This, gave a more interesting finish than importing an eps in FileMaker. It was a question of antialiasing. I did many tests and never succeeded to import a vector graphic in FileMaker that would output as vectors. It seems it always convert the file to a pict. <br> <br>Since I moved to OS X, that font is not working anymore and I don't understand why. Wish someone could explain me why. <br> <br>To make a test, I just opened in FontLab 4.6 this working Type 1 LogoFont (the PS file) I created a while back, and in the Info, the UPM shows to be 5882.  <br> <br>I have the feeling that something has changed in OS X and I don't know what and why...? <br> <br>What I liked, and that was sort of usefull, is the negative kerning, where the combination of different keys was giving me the possibility to use a mask underneath the logo, and to color differently each parts, depending on the visual application. <br> <br>If anyone interested... give me a ring and I'll send you the LogoFont to check. <br> <br>I feel I have been struggling with this issue since too long now. I discovered this forum yesterday and said to myself: \"If no one has the answer here... you will never have any\". <br>  <br>This forum seems to be the good place to ask for help. <br> <br>Kind Regards, <br> <br>Yves</p>"
