  html: <p>Greetings, <br> <br>I am trying to make a Type1 Logo Font, with FontLab 4.6 on Mac OS X. <br> <br>To get the best possible result (details), I am using a UPM value of 5000. If I could, I would go even higher. Does this makes sense or am I off track. Is there a limit on UPM value one can use? At a value of 1000, the shapes gets distorted while at 5000, this is almost perfect. <br> <br>In Suitcase (OS X) I just can't see the glyph I assigned to the letter "B". Is there an easy way to generate this Type1 font for Mac?  <br> <br>What would be the most important parameters to use (in FontLab -- Font Info), to make sure it works OK? <br> <br>Kind Regards, <br> <br>Yves</p>
  html_clean: <p>Greetings, <br> <br>I am trying to make a Type1 Logo Font, with FontLab 4.6 on Mac OS X. <br> <br>To get the best possible result (details), I am using a UPM value of 5000. If I could, I would go even higher. Does this makes sense or am I off track. Is there a limit on UPM value one can use? At a value of 1000, the shapes gets distorted while at 5000, this is almost perfect. <br> <br>In Suitcase (OS X) I just can't see the glyph I assigned to the letter "B". Is there an easy way to generate this Type1 font for Mac?  <br> <br>What would be the most important parameters to use (in FontLab -- Font Info), to make sure it works OK? <br> <br>Kind Regards, <br> <br>Yves</p>
