    html: <p>One of the most moving performances I have ever experienced was in the late 1980s, when Shakespearian actor Brian Bedford appeared in a small lecture hall in Portland, Maine (US). Perhaps 200 seats, set on a steeply sloped floor, small and simple stage, quite an intimate setting. The entire set consisted of one stoll, set in the center of the stage. Mr. Bedford came out, sat on the stool, and gave two extended groups of soliloquies with a break in between. Sometimes he cried out in room-filling dramatic passion, sometimes in barely a whisper, but even then audible to all in the room. Completely, utterly magical. It is certainly true that Shakespeare was meant to be heard if at all possible, and not simply read.</p>
