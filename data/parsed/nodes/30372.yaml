      <p><strong>The Left Margin Highlights Paragraph Structure</strong></p>
      <p>I agree with what seems the majority opinion on Wordsfailme's original question: If the dash can't be avoided, it should be placed at the end of the upper line. </p>
      <p>I do the same in any standard paragraph of Roman text because the left margin structures the contents. A gap at the beginning of a line is most often created by an indent and thus signals the beginning of a new paragraph; and a dash at the beginning of a line is often used to highlight the topics of a list. Because of these conventions, the smooth line of the left margin should be broken only where this gap coincides with some kind of paragraph break. A dash gap at the right margin, on the other hand, doesn't matter that much, because punctuation and hyphenation often make even a justified right margin look slightly ragged anyway.</p>
      <p><strong>Arguments against American Convention – Dashes and Spacing</strong></p>
      <p>As was already pointed out in another thread (which I'm unable to find right now), there is much to commend the German (or more generally European) use of the en dash – including the disuse of the em dash – to the typographer: To indicate a break in the flow of thought or speech, use an en dash with word spaces before and after; when abbreviating 'from A to B' (Hamburg–München, 12–16 hrs), use an en dash with no spaces (or very thin spaces to compensate for deficient automatic kerning).</p>
      <p>From a graphic point of view (turn the page upside down), the American unspaced em dash is a long line that <em>connects</em> two objects, i.e. the words on either side of it. That is, it produces a large hole in the texture of the page – while failing to divide the sentence. Where this discrepancy between content and design becomes most painful is a justified line in which all words are divided by plenty of white space, except those at a logical break in the sentence marked by a dash, which are tied together in one black cluster. </p>
      <p>To rephrase and conclude: The American convention uses <em>connecting</em> lines (dashes) between both logically divided and logically connected words or numbers. The European convention, in contrast, uses <em>connecting</em> lines (dahes) where words or numbers are logically <em>connected</em>, and <em>dividing</em> white spaces, enlarged and classified as such by a freestanding dash, where words and phrases are logically <em>divided</em>. And since the two uses are differentiated by the presence or absence of spaces, the lanky em dash can be dispensed with.</p>
      <p>I suggest American typographers change their habits.</p>
