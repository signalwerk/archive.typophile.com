      <p>I once had to design a newspaper page with 4 different story headlines that all had colons and subheads. Awful. Should have killed the editor.</p>
      <p>Anyway, I resorted to all of these options:</p>
      <ul>Headline: Subhead</ul>
      <ul><strong>Headline</strong><br>
      SUBHEAD</ul>
      <ul>HEADLINE <cite>Subhead</cite></ul>
      <ul>Headline –<br>
      <cite>Subhead</cite></ul>
      <p>I think a dash to represent a pause makes much more sense at the end of the first section than at the beginning of the second. Like was said before, it more accurately depicts human speech and phrasing.</p>
