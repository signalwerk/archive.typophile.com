      <p>Fortunately this isn't Hollywood Squares, for it seems that my blue-collar approach is not popular. In the variety of treatment given to hyphens, endashes and emdashes from various faces, eras, locales, and publishers of varying competency, my eyes have developed a habit of assuming that any line ending in a dash is supposed to be a hyphen. This simplistic approach is not high typography, but the functional opposite. From an aesthetic standpoint, I think this also works well as a convention, leaving the "weak" ending of a line created by the lightness of a dash as a marker to quickly jump to the next line and continue, as if there were really on line, and self-editing the hiccup as my brain proccesses the text.</p>
      <p>Much more pause is created by putting it on the second line, and there is less ambiguity to the untrained (in local customs of the 'setter) eye. Unfortunately, an endash at the start of a line is not pretty, and an emdash seems like it would give a better rhythm, but  better not pretty than ambiguous and not pretty.</p>
