      <p><em>Oh, and by the way, I think we sometimes put the full stop outside the quotation marks, but only when the quotation makes up the whole sentence. i.e “To be, or not to be: that is the question.” If the quotation is part of a longer sentnce then we do put the full stop last.</em></p>
      <p>Wordsfailme - if you had a copyeditor next to right now - they'd take the colon out of the "To be or not be, that is the question."  Colons are are used to separate the sentence from the list. A more appropriate punctuation for that may be the semi-colon "To be or not to be; that is the question." —also the comma after the first to be is unnecessary. If you were writing this for cue cards, you might consider writing it "To be, (to show actor to pause) or not—(to show actor longer exaggerated pause) that is the question.</p>
      <p>I did remember on exception to a space for the 1-M dash. That would be in a quote. If you were "giving credit to someone for saying this." —Anon there were always be a space between the end quote and the m-dash.</p>
      <p>And I'm with you. I miss the old days when we had professionals doing the work. Your type was delivered at 9am to your drawing board...and the new day over the rubber cement odors began.</p>
      <p>***</p>
      <p>Don McCahill<br>
      Could you please let Alex Trebek know they changed this. One thing I've never cared for on Jeopardy was the fact that the punction remained outside the quote—and their response over the years was "it's the Canadian way."'</p>
      <p>Curious - when did it change? I've been out of a type shop since 1991, and they were still following the Queen's English when I left.</p>
      <p>****</p>
      <p>Truthfully, I prefer some "air" around the m-dash and n-dash -- but as a typesetter, I had to go by the book. It just didn't exist and wasn't to be set.</p>
      <p>An interesting type misadventure I once had was with St. Martin Books. I was re-setting the interior of one of their books and M-dashes were called for. The font they were setting it in had a very narrow M, therefore the M-dashes appeared to be about the size of anothr fonts hyphen or N-dash. To give them the visual effect they needed, we went to 3-M dash. Sorry, just had to share.</p>
    html_clean: |-
      <p><em>Oh, and by the way, I think we sometimes put the full stop outside the quotation marks, but only when the quotation makes up the whole sentence. i.e “To be, or not to be: that is the question.” If the quotation is part of a longer sentnce then we do put the full stop last.</em></p>
      <p>Wordsfailme - if you had a copyeditor next to right now - they'd take the colon out of the "To be or not be, that is the question."  Colons are are used to separate the sentence from the list. A more appropriate punctuation for that may be the semi-colon "To be or not to be; that is the question." —also the comma after the first to be is unnecessary. If you were writing this for cue cards, you might consider writing it "To be, (to show actor to pause) or not—(to show actor longer exaggerated pause) that is the question.</p>
      <p>I did remember on exception to a space for the 1-M dash. That would be in a quote. If you were "giving credit to someone for saying this." —Anon there were always be a space between the end quote and the m-dash.</p>
      <p>And I'm with you. I miss the old days when we had professionals doing the work. Your type was delivered at 9am to your drawing board...and the new day over the rubber cement odors began.</p>
      <p>***</p>
      <p>Don McCahill<br>
      Could you please let Alex Trebek know they changed this. One thing I've never cared for on Jeopardy was the fact that the punction remained outside the quote—and their response over the years was "it's the Canadian way."'</p>
      <p>Curious - when did it change? I've been out of a type shop since 1991, and they were still following the Queen's English when I left.</p>
      <p>****</p>
      <p>Truthfully, I prefer some "air" around the m-dash and n-dash -- but as a typesetter, I had to go by the book. It just didn't exist and wasn't to be set.</p>
      <p>An interesting type misadventure I once had was with St. Martin Books. I was re-setting the interior of one of their books and M-dashes were called for. The font they were setting it in had a very narrow M, therefore the M-dashes appeared to be about the size of anothr fonts hyphen or N-dash. To give them the visual effect they needed, we went to 3-M dash. Sorry, just had to share.</p>
