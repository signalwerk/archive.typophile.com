      <p>Given that you are stuck with the basic forms you posted I would say the en dash should go after performance. For two reasons, first aesthetic, since you are going to have a jagged right rag, pursuing a smooth left rag is more attractive; and second, I read it that there are various sub-sectors in which Cladding Performance has to meet demands and the en signals the subordination of the following copy.</p>
      <p>CLADDING<br>
      PERFORMANCE –<br>
      MEETING<br>
      SUSTAINABILITY<br>
      DEMANDS</p>
      <p>Tim</p>
