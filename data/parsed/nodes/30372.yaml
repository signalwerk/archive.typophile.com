      <p>I have always gone by the notion that written words are a way of capturing speech and making it live again in the brain of the reader. If the dash is supposed to convey a sense of pause, then it seems to me to be more effective at the end of the first line. This way the reader encounters the pause indicator, then takes a brief moment to move back over to the next line, and the elapsed time is slightly longer. Encountering it at the beginning of the next line comes as more of a surprise. Therefore, in my style book the dash is always best located at the end of the first line, but if spacing conditions make that ungraceful or impratical, then it goes at the beginning of the next line. The tiniest of subtleties, this, but fun to think about!</p>
      <p>In your example, it's too bad that "performance" is such a long word, since it will make the "meeting" line even shorter when it loses the dash. Could you use a colon after "performance" instead of a dash?</p>
    html_clean: |-
