      <p>Does it replace the word “to” or is it marking a pause?</p>
      <p>If it’s “4 – 6” I’d put the whole thing one the same line.</p>
      <p>If it’s a pause, it doesn’t matter that much. I’d probably put it on the next line, especially if it would “drop down” (like the “a” in your post) otherwise. The main thing is that the dash conveys the pause, which it will do in both cases, I think.</p>
      <p>I understand you asking this, since I don’t think the dash looks particularly good either way.</p>
