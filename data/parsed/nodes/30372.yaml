      <p>Firstly, I always space around my en dashes, but never when hyphenating words. I also prefer to keep them on the top line, as opposed to starting a line with a dash, it bothers me that the first character is not a letter. </p>
      <p><em>Could you please let Alex Trebek know they changed this. One thing I’ve never cared for on Jeopardy was the fact that the punction remained outside the quote—and their response over the years was “it’s the Canadian way.”’</em></p>
      <p>When I went through school, and granted it was part US and part Canadian education, I was taught that punctuation goes on the inside the quotes if it's the proper end to the sentence; otherwise it falls on the outside.</p>
      <p>Ex. In the case of Jeopardy it's probably "correct". Where, were we to quote Alex saying, "It's how punctuation is taught in Canada."</p>
      <p>Maybe that's a bad example, and most likely lacking proper grammar, but I'm no copywriter.</p>
