      <p>Interesting topic once again...</p>
      <p>American Typesetting.<br>
      In typesetting there is never a spaceband before or after a N-dash, M-dash or hyphen.<br>
      An N-dash is used for "through" or as one above said "to." Such as in dates, numbers. The Chicago Manual had one exception to this, and to this day, I still don't know why. It's "award–winning." For some reason, that gets an N-dash.</p>
      <p>When you are pausing, it is a 1 M-dash. It was not widely used among the great writers of the 20th century. It was used by advertising copywriters abundently. Many New York City Art Directors in the late 1980s-early 1990s would tell the typeshops that if there must be a break near the M-dash, please leave it on the top line. </p>
      <p>Please note: I did say this was American typesetting. Over the years, I've realized many differences in how the English typeset. Example: When in America you have a quote and end it, the period is tucked inside of the quote, "Like this." However, in English-speaking Canada and the UK it is outside the quote, "Like this". </p>
      <p>Go figure!</p>
      <p>And in today's "anyone can set type" is anyone except those of us in the know, paying any attention? I don't think so. Not with the <em>New York Times</em> prints full page ads with inch marks and not quote marks!</p>
      <p>Thank you for letting me have my 2 cents this morning.</p>
    html_clean: |-
