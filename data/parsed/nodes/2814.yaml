    html: <p>&gt; my university mandates 12 pt text <br> <br>If that's too big (and it usually is) you can "cheat" by using a font that's small on the body - although that will exacerbate the extreme leading. BTW, do they [explicitly] forbid multiple columns? <br> <br>Anyway, your solution (big lateral margins*) works great. The only two things that bother me are that Charter (a superb choice) doesn't seem to jive with the Palatino headings; and your footnotes are very cramped - the fact that you're needing a rule is telling - I think you can make the point size slightly smaller, but do track it looser as well, and if there's a semi weight use that. <br> <br>* I'd make the left bigger than the right though. <br> <br>BTW, that OpenType doc looks interesting. <br> <br>hhp <br></p>
