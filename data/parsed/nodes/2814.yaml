    html: <p>I agree with Tiffany. I'm not a big fan of Garamond's bold weight. However, I have more experience with Adobe Garamond than Classical. <br> <br>Tiffany, since I don't know, do you think that Classical Garamond and Adobe Garamond SC can mesh? <br> <br>Rahul, I applaud your desire to seek out something better. Back in college I used to use Centaur with non-default margins and line-spacing because TNR in Word settings was so painful. Professors would ask me how I made my papers so nice to read. The typography was sketchy, but even those adjustments made a big difference. <br> <br>My experience with Garamond is that it can get tricky at smaller sizes because of its proportions and relatively fragile forms (as compared to TNR, which was designed to take abuse). This may not matter for what you're using it for, but be conscious of that, particularly if you're outputting on an inkjet or lower-res printer (which I was often forced to do). <br> <br>Because I'm not a mathematician or a LaTeX user, I'd like to know what you're using for setting the equations. Are you going with Garamond, or a more specialized mathematics face?</p>
