    html: "<p>Having been through the PhD process myself, permit me to state the obvious: the design doesn't matter that much to you, because you are going to get your PhD based on content judged by people who are very knowledgable about that content. The visual 'sell' isn't that important to you. It is a good way to learn about typography, but not that important to this particular product.  <br> <br>I don't think the current version works well. You have a number of elements that by themselves could work, but don't work together to make a coherent, balanced set of pages. The running head with the rule frames the page as having equal margins left and right. Then you have the text with outside margins over twice the inside margins, and with little use of them. The effect is unbalanced. <br> <br>It might work with somewhat less of an outside margin and more of an inside margin, and the running head the same width as the text. But you have to try to see.  <br> <br>If you are going to put the numbers of the headings in the margins (as I had recommended as an option), I think will look better if they are right aligned on the left page and left aligned on the right page. Also I would try puting the equation numbers in the margins as well, if you are going to go that route.  <br> <br>The large bold numbers in the margins are distracting. They need to me more discrete (non bold or smaller size or both), or don't hang them in the margins. They need to be clearly subordinate if they are in the margins. Also I would check whether in labelling the heads lining (full height) numbers are better, especially if they hang in the margin.    <br> <br>The titles don't need to be both bold and big. The current large size and the way they are vertically spaced breaks the rhythm of the grid. Bringhurst recommends keeping everything in multiples of unit lines. That way lines on opposite pages line up with each other. Felici says you can also add half line gaps between paragraphs, and that way after two such they come back to the grid.  <br> <br>You have the luxury of so much space that I would stick to the grid. You can put heads in bold caps and sub heads lc bold in your normal size. Or, more classically, you can avoid bold altogether and use caps, small caps and italic as your options. <br> <br>Have fun playing with this, and don't worry about it! <br> <br></p>"
