    html: <p>I agree with the comments about the width of the line. I would recommend looking at Bringhurst's Elements of Typographic Style, the section "Choose a comfortable measure" and the accompanying table (in my edition, p. 26-7, 29). After reading Bringhurst, I found in experimenting that the measure is indeed very important to comfort level in reading continuous text. If you are close in width to a 66 character line (Bringhurst explains how to measure this using his table), it really is a big benefit.  <br> <br>On A4 paper, a usual full width line is way too wide for comfort. With the narrower measure, you can use the margins for titles and notes, if your type setting software permits. <br> <br>The other thing that is critical is the leading. Adjust it till you find it comfortable to the eye. Because Adobe Garamond has a relatively small x height, you will need less leading.  <br> <br>If you get the measure and leading right, it will right away look way better, and the rest you can do is gravy. <br> <br>Handling equations is a whole different can of worms, but I assume you have some materials on this.   <br> <br>Good luck! </p>
