    html: <p>Hi, <br> <br>Thank you very much for your suggestions and sorry for late reply. I was going to use Adobe Garamond but then I found out that my Softmaker MegaFont CD had Classical Garamond with Old Style Figures and Small Caps, so I used that one. William, I used following texts <br><a href="http://www.ctan.org/tex-archive/macros/latex/contrib/memoir/memman.pdf" target="_blank">http://www.ctan.org/tex-archive/macros/latex/contrib/memoir/memman.pdf</a> <br><a href="http://www.ctan.org/tex-archive/macros/latex/contrib/memoir/memmanadd.pdf" target="_blank">http://www.ctan.org/tex-archive/macros/latex/contrib/memoir/memmanadd.pdf</a> <br>to compute the desirable text width. The first link is the manual for memoir class for LaTeX and second one is addendum to the manual. The first part of the manual talks about typesetting basics.   <br> <br>I have uploaded the test file with few pages of text in pdf format to my web site.  <br><a href="http://www.geocities.com/rahul_athale/thesistest.pdf" target="_blank">http://www.geocities.com/rahul_athale/thesistest.pdf</a> <br>The text is typeset in Classical Garamond and Mathematics is typeset in Euler and Computer Modern font, although the numbers are typeset using old style figures from text font. I have set the text at 11/13.6pt. The text width is 312pt and height is approx. 514pt. Spine and edge margins are 98pt and 158pt, respectively. Upper and lower margins are 130pt and 200pt, respectively. I use the ratio 1:1.618 to divide the margins after fixing the text width and text height, they also share the same ratio. Please have a look at the file and give your opinion. I have a question, do old style figures look good in chapter title and heading?  <br> <br>Thank you very much for all your encouragement, without which I would not have invested so much time in typesetting.  <br></p>
