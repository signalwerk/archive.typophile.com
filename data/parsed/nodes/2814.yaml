    html: <p>Your eye needs to make the decision. 75 characters is the outer limit for a comfortable read, according to Bringhurst, and as your text is broken up by equations, it may be fine at that length. As your line length increases, so should the leading, so you should also test out that variable with samples before making a decision. Another option is to increase the size of the text. I don't know what your version of Garamond looks like, but if it has a small x-height like Adobe Garamond, setting it at 13 to 14 point may be fine.  <br> <br>Typotheque is selling a paperback edition, according to the site.</p>
