    html: <p>Do have a look at Bringhurst's 'Elements' - there must be a copy in your University's library.  <br> <br>The outside margin is too big in comparison to the other margins. Bringhurst has a whole chapter on all the mathematical ratios that have been historically tried for page and text blocks, and their positioning on the page. Not rules, but fascinating, especially for a mathematian, I would think. For example, he shows you how to put a golden rectangle text block on an A4 page, with a lot of white space around it, which will work great for you. <br> <br>Your running head with the rule defines the text block as wider. The outside margin is naked without something in it.  <br> <br>You can put something in it or make the rule shorter, and reposition the whole thing. I don't know the current size of your type, but you can certainly make it bigger (not much bigger though) if you like, as you will use the space better.  <br> <br>Bringhurst's book is an example of how to use margins. His way is traditional. It has been revived in many computer instruction books, which have wide pages with stuff in the wide margins. Basically you want an additional column outside the text block, with enough space between it and the text block to distinguish it, but not so much that it's not related. Then do the numbers or notes right aligned on the left page and left aligned on the right page, if you have a wide outside margin. You can just align the numbers with the head, sub head or first line of the equation.   </p>
    html_clean: <p>Do have a look at Bringhurst's 'Elements' - there must be a copy in your University's library.  <br> <br>The outside margin is too big in comparison to the other margins. Bringhurst has a whole chapter on all the mathematical ratios that have been historically tried for page and text blocks, and their positioning on the page. Not rules, but fascinating, especially for a mathematian, I would think. For example, he shows you how to put a golden rectangle text block on an A4 page, with a lot of white space around it, which will work great for you. <br> <br>Your running head with the rule defines the text block as wider. The outside margin is naked without something in it.  <br> <br>You can put something in it or make the rule shorter, and reposition the whole thing. I don't know the current size of your type, but you can certainly make it bigger (not much bigger though) if you like, as you will use the space better.  <br> <br>Bringhurst's book is an example of how to use margins. His way is traditional. It has been revived in many computer instruction books, which have wide pages with stuff in the wide margins. Basically you want an additional column outside the text block, with enough space between it and the text block to distinguish it, but not so much that it's not related. Then do the numbers or notes right aligned on the left page and left aligned on the right page, if you have a wide outside margin. You can just align the numbers with the head, sub head or first line of the equation.   </p>
