  html: <p>Hi All, <br> <br>This is my first post. I am writing my Mathematics Ph.D. thesis. I am planning to use Classical Garamond to typeset the thesis. Usually people use Computer Modern (that comes with LaTeX typesetting program) or Times New Roman. Garamond is artistic and that is my choice as I want a relaxed look for my thesis. Also, I own it so would not have to spend extra money. If it is the right choice, what font you would choose for headers, a sans serif font or bold weight of Garamond? Thank you very much in advance for your time and help.  <br> <br>Rahul.</p>
