    html: <p>Hi, <br> <br>William, thank you very much for writing down the Bringhurst's principle and other comments. Actually it was written in the memoir manual, the link I posted in the second post. But I had made a terrible mistake in typesetting the last sample. I have a different problem though. Now if I follow the advice of spine margin being equal to width/9 then the type block becomes around 33pica, that means around 75 characters per line at 12pt Garamond. So I certainly need wider margins. Now the question is should I divide the edge to spine margin in the ratio two to one, or make spine margin equal to the page width/9 and keep the remaining space as the edge margin? Thank you very much for your time. <br> <br>Thanks for the typotheque link, but I am looking for a paperback edition of Bringhurst's book. <br> <br>Rahul.</p>
