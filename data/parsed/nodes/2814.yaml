    votes: null
    html: <p>I'm also writing a mathematical PhD thesis so this is a very interesting topic for me, although I'm in my first year now so I'm not actually writing up yet! Apart from the thorny issue of mathematical typesetting, one has to contend with restrictive and largely arbitrary layout regulations. <br> <br>For example, my university mandates 12 pt text, with "double or 1.5 spacing" (which I suppoose means 12/18 at least). It must be printed recto only on A4 paper with all margins at least 15mm, and the left-hand (binding) margin 40mm or more. <br> <br>For my <a href="http://www.ma.man.ac.uk/~rhouston/msc.pdf">master's thesis</a>, I used 12 pt Charter and Euler with a measure of 29 picas (to make a "double square" text block, as Bringhurst would have it). I'm sure there must be a better solution than this. I've been planning to try and put something together using one of the Adobe OpenType fonts, which have most of the glyphs you need for equations (e.g. swash caps and Greek letters). The only missing glyphs (apart from "blackboard bold" and blackletter) are the geometric symbols representing mathematical operators, which can easily be taken (perhaps slightly modified) from elsewhere, since they need only match the base font in weight and size. (The proportions and style are pretty fixed!) Adam Lindsay has done <a href="http://homepage.mac.com/atl/tex/OpenType.pdf">some work</a> in this direction. <br> <br>For blackboard bold, one could just eviscerate the ordinary bold uppercase. You're unlikely to need more than two or three such letters anyway. <br> <br>I'd be very interested in hearing anyone else's thoughts or experiences.</p>
