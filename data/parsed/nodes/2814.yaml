    html: "<p>Rahul, in Europe if you don't have another ready source, you can buy Bringhurst at <a href=\"http://www.typotheque.com/products/elements1.html\" target=\"_blank\">Typotheque</a>.  <br> <br>'Elements' is almost universally praised as the best single book on typography, so I think you will be happy to have it.  <br> <br>Currently, I don't think the relation of your text block, margins and page look so good. It is too close to the page shape, which makes it dull. I think your old version, putting the heading numbers in the margins would look better, or following Bringhurst's design for a golden rectangle on A4 paper (which is the ratio 1 to sq. root 2).  <br> <br>The formula is this: the top and spine margin is 1/9th of the width of the page, and the bottom and outside margins are twice this. This will give you a golden rectangle in the text block, nicely positioned on the page. You can then adjust the size of your text to make this work. <br> <br>In general, Bringhurst's principle is \"Shape the textblock so that it balances and contrasts with the overall shape of the page\". Usually, as with the above formula, the inner and top margins are less than what you have in relation to the bottom and outside margins. This assymetry 'locks' together the facing, bound pages. <br> <br>Some other comments: I think your rule at the top of the page is too thick. And your title page is too shy compared to your chapter titles. The classic thing would be to use letter spaced caps or caps &amp; small caps, but that is only one idea. <br> <br>Overall, Bringhurst will give you guidance on many, many issues.  </p>"
