  html: "<p>Hi, i'm brand new here on typophile and also brand new to making fonts and fontlab and before anything let me apologize for my bad english, i'm art director and illustrator from Brazil. My question is simple: how can i add more characters on the FontLab window so i can see other characters for other languages? Right now i have the A-Z, a-z and 0-9 and a few others, but i want to make the font available for more languages. I see in fontforge a lot of characters that doesnt show on the fontlab window. Sorry if my question is silly. Anyway thanks in advance.</p>"
comments:
  - id: 444805
    user: 1043
    date: 2010-12-23T08:23:00
    date_raw: 23 Dec 2010 — 8:23am
    votes: null
    html: |-
      <p>At the bottom of the Font window you should see some pop-up menus. Choose "Codepages" from the mode pop-up, and then choose the code page you want from the next menu to the right.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/popup1_4889.jpg"></div><p></p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/popup2_6166.jpg"></div><p></p>
      <p>Alternatively, you can choose "Unicode Ranges" from the first pop-up and then choose a range from the other menu.</p>
      <p>After choosing one of these display mode/glyph range combinations, the Font window will display the appropriate templates for various ranges of glyphs.</p>
  - id: 444814
    user: 4926
    date: 2010-12-23T08:54:00
