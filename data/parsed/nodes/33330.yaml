    html: |-
      <p>Only the fi and fl need to be encoded, because they exist in the Mac Roman 8-bit codepage. For the most part, ligatures don't need to be encoded at all, and should be accessed via OpenType Layout features.</p>
      <p>Digraphs are an interesting issue, because in some cases they are distinctly encoded in Unicode, usually because they existed in a legacy encoding with which Unicode provides one-to-one roundtrip mapping, but in general terms digraphs (and trigraphs and tetragraphs) are not distinctly encoded in Unicode because their handling is something that is expected to be handled at a higher level (e.g. in a tailored collation algorithm for a particular language). So the Æ/æ, Œ/œ and Ĳ/ĳ are encoded in Unicode, along with some Serbocroatian digraphs that were needed for roundtrip mapping to the Cyrillic orthography, but the German ch and many others are not.</p>
