      <p>I haven't thought this through entirely, but the underscore is a convention, not a requirement. If you are making an OpenType font, you can NAME the glyphs anything you want, and leave them unencoded. For example, the glyph "fb" could be named "fb" (or, for wimsy, "halfback", my personal test for the f-b fit). When you write the liga feature, add</p>
      <p>sub f b by fb</p>
      <p>and so on. I would leave them unencoded, but if for some reason you feel they must have a Unicode encoding, use the private use area -- E001 &amp; so forth.</p>
      <p>If you are making a Type 1 font, you can still name it "fb" etc., but be aware that unless someone is using an application program that permits custom encoding vectors, they won't be available. If it is a Type 1 font for Quark, for example, you'd have to give it (them) the name(s) for a Mac or PC encoded character -- do like other foundries do, &amp; lie about the name. "Integral" is one favorite, if it isn't a math font.</p>
      <p>Not an ideal situation for a commercial font.</p>
