      <p>Eben, I would probably associated the language-specific digraph forms with the 'liga' feature under the appropriate language system tags. Most digraphs forms are probably in the category of things that one wants on by default but wants to allow the user the ability to turn off, so the 'liga' feature is more appropriate than 'dlig' (off by default) or 'rlig' (cannot be turned off).</p>
      <p>Aside from possible ligated forms (which are actually the exception rather than the norm for digraphs in most languages and type styles), there are other aspects of such phonemically unique letter sequences that need to be considered in quality typography and which cannot be controlled by the font. One of these is behaviour during letterspacing:</p>
      <p>S C H R I J V E N   or   S C H R IJ V E N</p>
      <p>Another is behaviour in vertical setting:</p>
      <p>S<br>
      C<br>
      H<br>
      R<br>
      I<br>
      J<br>
      V<br>
      E<br>
      N</p>
      <p>or</p>
      <p>S<br>
      C<br>
      H<br>
      R<br>
      IJ<br>
      V<br>
      E<br>
      N</p>
      <p>These kinds of practices vary according to the language, and probably vary over time as different conventions are adopted or dropped.</p>
