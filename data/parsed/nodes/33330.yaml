      <p>In addition to what John wrote, you'll need to have two additional glyphs, named <strong>fi</strong> and <strong>fl</strong>, that are duplicates of 'f_i' and 'f_l'. These two additional glyphs should be encoded as FB01 and FB02, respectively. The reason for having to include these glyphs (named and encoded this way) is because they are part of the MacRoman character set.</p>
      <p>&gt; <em>In the Glyph properties window I’ve substituted the name with the underscore convention. Is this correct?</em></p>
      <p>Yes, that's the way you rename a glyph.</p>
