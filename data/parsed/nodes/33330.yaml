      <p>Seems pretty on topic to me . . . and the other situation occurs, too, where the fi liagture is too loose, as in Monotype Garamond.</p>
      <p>Another note: while it can be nice to have the f + ascender-on-the-left ligatures (fb, fh, fk), more important are the accented vowels. Try setting an f + igrave sometime. or f + iumlaut, or f + imacron. And it doesn't have to be just the "i", any vowel with a grave accent is problematic if the terminal on the "f" has a tendency to swoop. I've been known to add these when really needed; it is a fair bit of work, and I've never really found a good solution for some fonts.</p>
