    date: 2007-04-29T15:13:00
    date_raw: 29 Apr 2007 — 3:13pm
    votes: null
    html: |-
      <p>The layout feature code to be entered in the OpenType panel of FontLab Studio would be like:</p>
      <p><code>feature liga {<br>
        sub f f b by f_f_b;<br>
        sub f f h by f_f_h;<br>
        </code><em>... (rest of three-letter substitutions)</em><code><br>
        sub f b by f_b;<br>
        sub f f by f_f;<br>
        sub f i by f_i;<br>
        sub f l by f_l;<br>
        </code><em>... (rest of two-letter substitutions)</em><code><br>
      } liga;</code></p>
      <p>feature dlig {<br>
        sub s p by s_p;<br>
        sub s p by s_t;<br>
      } dlig;</p>
      <p>Remember to put the substitution rules for your three-letter ligatures before the rules for the two-letter ligatures. </p>
      <p>If your font includes character for Turkish and similar languages, remember to include a glyph named "i.TRK" which would be an identical copy of "i", and at the beginning of your feature list include a layout feature as follows: </p>
      <p><code>feature locl {<br>
        language TRK exclude_dflt; # Turkish<br>
        lookup locl_TRK {<br>
        sub i by i.TRK;<br>
        } locl_TRK;<br>
        language AZE exclude_dflt; # Azeri<br>
        lookup locl_TRK;<br>
        language CRT exclude_dflt; # Crimean Tatar<br>
        lookup locl_TRK;<br>
      } locl;</code></p>
      <p>If your font has small caps, you'll need to add more things to your locl feature. </p>
      <p>Regards,<br>
      Adam</p>
