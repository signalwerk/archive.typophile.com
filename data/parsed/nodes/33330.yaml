      <p>Mr. Lawless,</p>
      <p>Much of what one <cite>needs</cite> for a proper OpenType font depends on what you plan to do with it. If a font is for general sale, I suppose following Adobe is prudent; at least, to the extent that the general consumer knows what to expect from Adobe fonts, even though Adobe from time to time rethinks their naming/encoding conventions.</p>
      <p>If, however, you are making a font only for your company's use, you can tailor naming &amp; encoding for that use. For example, our company converts all incoming documents to MS Word (for Windows XP), to be finally typeset in InDesign. There will likely also be an XML file of the final text, but that is the entire universe I have to pay attention to.</p>
      <p>For that reason, I do not have multiple fi ligatures (e.g., "fi" and "f_i") in a font -- simply f_i as a glyph name; no Unicode number. The ligature is used in the typeset file via the liga feature. This also prevents the ligature from somehow getting into a later XML file; our house rule is separate characters coming in, separate characters going out, the ligature is used only in the typeset file.</p>
      <p>One reason (I think) ligatures got Unicode encoding is that some applications programs can only perform searches on characters, not glyphs. If you don't know how your font is to be used (i.e., it is for sale), you have to covers such bases. If you do know, you need cover only what you need for your application, with any eye towards the most useful XML file, intended for later use, often with unknown fonts.</p>
      <p>I mention this because when I started looking at OpenType naming I too looked at Adobe fonts, and it took me a while to figure out why they did certain things that made no sense from a Unicode point of view, or why some things -- like small caps -- were so complicated.</p>
