      <p>Eben: <em>Are you are first making the point that digraphs ( trigraphs and tetragraphs ) exist in spoken language first and that their existence as linguistic phonemes is precedes and informs glyphs?</em></p>
      <p>Digraphs etc. are written conventions to use more than one letter to represent a single phoneme. They don't 'exist in spoken language': they're an extension of the alphabetic system to represent more sounds without adding more letters. Sometimes, these digraphs evolve into ligated forms as æ and œ have in some orthographies, and the ligation then becomes a standard semantic distinction that may differentiate the pronunciation of e.g. æ from ae.</p>
      <p>Modern Greek provides a really nice example of the development of a digraph. In ancient Greek the letter β was pronounced as a voiced bilabial plosive and so English tranliteration of classical texts always use the Latin b. But as the pronunciation of Greek changes, β came to be pronounced as a voiced labiodental fricative (like English v). This left a phonemic gap in the Greek orthography for foreign words containing a voiced bilabial plosive, so a digraph convention was introduced and the sequence μπ is now used to transliterate the Latin b. This frequently confuses people trying to learn to read modern Greek, especially if they have some classical Greek education. I remember Beat Stamm at Microsoft being very surprised when he saw that the transliterated Greek name for Jeremy Tankard's Corbel typeface was Κορμπέλ.</p>
