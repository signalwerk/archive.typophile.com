      <p>As I understand it for the unofficial ligatures you have two choices: </p>
      <p>- Include a seprate font with the ligatures in the spaces of official glyphs. This might be a good choice if you want broad compatibility and your font is for display use and it is reasonable to assume that the designer will have time to tweak 1-3 lines of letters and manually select their choices.</p>
      <p>- script your ligatures to substitute in automatically, and create your own name for the glyph. This is a good idea ( perhaps ) if your face is for text and you want to make it easy for the ligatures to be used everytime. Of course they won't be in all applications. Different features have different levels of support too. </p>
      <p>There are other options &amp; situations that are possible too but these are the two extremes.</p>
      <p>Here is a thread about this subject which links to others and a reference:</p>
      <p><a href="http://typophile.com/node/14590" title="http://typophile.com/node/14590">http://typophile.com/node/14590</a></p>
      <p>Also you might search from the forums page for 'Calt' and or 'Liga' or go to google</p>
      <p>Also, you could go here<br>
      <a href="http://groups.msn.com/FontLab" title="http://groups.msn.com/FontLab">http://groups.msn.com/FontLab</a><br>
      or here<br>
      <a href="http://www.twardoch.com/adam/project.php?pid=0049" title="http://www.twardoch.com/adam/project.php?pid=0049">http://www.twardoch.com/adam/project.php?pid=0049</a></p>
      <p>I hope that other folk who are more versed in this than I am will comment as well and that you will describe your face and the way you would preffer to see your ligatures used: eg automatically or as discretionary.</p>
