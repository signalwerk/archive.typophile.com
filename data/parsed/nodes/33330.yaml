      <p>Dave,</p>
      <p>Follow the Adobe glyph naming rules for ligatures, which specify that component names separated by an underscore, hence:</p>
      <p>f_f_b<br>
      f_f_h<br>
      f_f_i<br>
      f_f_k<br>
      f_f_l<br>
      f_f_t<br>
      f_h<br>
      f_j<br>
      f_k<br>
      f_l<br>
      f_t<br>
      s_p<br>
      f_b<br>
      f_h<br>
      f_k</p>
      <p>Although the glyph names for the ligatures with Unicode presentation form codepoints are recognised by apps that parse glyph names, Adobe's latest practice, which I also recommend, is to use the underscore convention for these too:</p>
      <p>f_f<br>
      f_i<br>
      f_l<br>
      f_f_i<br>
      f_f_l<br>
      f_t<br>
      s_t</p>
