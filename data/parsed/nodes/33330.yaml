      <p>Eben, it might help to think about the treatment of digraphs in English. For example, most English speakers would not appreciate a "th" or "aw" digraph that formed a single unit in a monospaced font, even though they represent single phonemes, because English orthography doesn't acknowledge digraphs. Thus, "ae" and "oe" ligatures used to be used for loanword digraphs in English, but they've been obsolete for several decades and most people now would think they were weird. Croatian might be an opposite case, where the digraphs - because they correspond to single letters in Cyrillic - are accepted as single letters, and were incorporated as such into official character encodings (and thus into Unicode).</p>
      <p>Each language has its own rules for these things, and they aren't necessarily consistent even within a language. Spanish collation rules used to sort "ch" and "ll" separately from "c" and "l", but they don't anymore; Dutch treats "ij" as a single unit for capitalization, but not "oe". And Croatian digraphs like "lj" are units for most purposes (including crossword puzzles) but not for capitalization. There's no easy rule for all this; you need to learn it for each language. Or not worry too much about it and just provide general-purpose tools.</p>
      <p>There's a simpler presentation of the Unicode position on digraphs at <a href="http://unicode.org/faq/ligature_digraph.html" rel="nofollow">http://unicode.org/faq/ligature_digraph.html</a>.</p>
