      <p>Matthew, </p>
      <p>I agree that that rr would be especially hard to make into a 'visual digraph'. Are you sure it's not a phonemic digraph? What about for sorting? Also, I have read that there are some South American designers who though ligation to acknowlege the spoken or phonemeic difference was a good idea:</p>
      <p><a href="http://typophile.com/node/31238" title="http://typophile.com/node/31238">http://typophile.com/node/31238</a><br>
      <a href="http://www.typophile.com/forums/messages/29/ORIGEN_PDF-42729.pdf" title="http://www.typophile.com/forums/messages/29/ORIGEN_PDF-42729.pdf">http://www.typophile.com/forums/messages/29/ORIGEN_PDF-42729.pdf</a></p>
      <p>Of course that doesn't make it a good idea.</p>
      <p>It is also worth noting that :</p>
      <p>a) A digraph doesn't have to connect/ligate or even squish together like an ae to be a visual digraph. It would just have to look different enough that it's staus as a distinct sorting and phonemic digraph was acknowledged.<br>
      b) This kind of distinction may or may not be a good idea depending on how it's done &amp; if there is a cultural basis from which to think about doing it. </p>
      <p>For instance in the case of Catalan "An old ligature for Ll is known as the "broken L", which takes the form of a lowercase l with the top half shifted to the left, connected to the lower half with a thin horizontal stroke. This ligature is not encoded by any standard character encoding and therefore cannot be used in digitized documents."</p>
      <p><a href="http://en.wikipedia.org/wiki/Ll" title="http://en.wikipedia.org/wiki/Ll">http://en.wikipedia.org/wiki/Ll</a></p>
      <p>Which makes me wonder is the old way worth reviving? Does it have currency in Barcelona?  How do people write their LL (or ll) now? Probably it's a grey kind of question with no clear answer. Or maybe somebody here can say. Was your ll ligature in the style described above? </p>
      <p>Also sometimes you could have a case like LL where the sorting function has been abandoned. The Wikipedia also says "This digraph was traditionally considered a single letter in Spanish orthography, called elle, and was collated after L as a separate entry, but this is no longer done." </p>
      <p>But it sounds like you are saying that in general most digraphs don't require special treatment. Partly because Unicode doesn't ask for it &amp; partly because there is no historical basis for a distincntive visual treatment - involving ligation or otherwise. Is that right?</p>
