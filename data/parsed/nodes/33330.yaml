      <p>Eben: Spanish rr isn't technically considered a digraph, althoug it is often taught (erroneously) that way.  <em>rr</em> represents a an alveolar trill in the vast majority of dialects which in reality is just a series of alveolar flaps, which incidentally is represented by <em>r</em>.  Since r-initial and r-final and r-post-nasal is realised as a trill, there's no reason to (and indeed I've never seen an rr lig .. wouldn't it just look like an m with its leg chopped off for lowercase?) I took a look at Fedra Mono, and I know Spanish speakers would find it a bit weird to read the letters squashed into a space like that.  I've experimented with some other ways for Spanish digraphs <em>ch</em> and <em>ll</em> with moderate success: the <em>ch</em> digraph using the same style as the German blackletter, and the <em>ll</em> by extending the second <em>l</em>'s serif until it joins the ascender of the first.  I found this wasn't as distracting to readers but also clearly delineated the special function of those digraphs.  The main reason was that the spacing was still the same, just with an ever so slight amount of extra lines.</p>
      <p>Anyways, as to encoding the digraphs in Unicode, the vast majority of them were encoded for backwards compatibility's sake.  As no encodings previously used <em>ch</em> or <em>sch</em> from German, neither of these were included and so for Unicode to include it as a separate character (Remember Unicode is based on the character, not the glyph) one would have to demonstrate where the digraph/ligatured version was used or is used as a contrasting element to its non-ligatured/digraphed compoments.  Spanish at best kerned the <em>c</em> and <em>h</em> a little bit closer but I've not seen any typeset books that combine them as a character ligatured in the same manner as <em>fi</em> or <em>ae</em>, and certainly not contrasted with a c-h combination.  Hence, the only digraphs you find are really legacy, although those like eszett or <em>ae</em> are included because they are contrastive within languages that use them.</p>
      <p><em>«El futuro es una línea tan fina que apenas nos damos cuenta de pintarla nosotros mismos». (La Luz Oscura, por Javier Guerrero)</em></p>
