    <p>Hi There,</p>
    <p>I want to add additional <a href="/wiki/ligature" class="freelinking" rel="nofollow">ligatures</a> to an <a href="/wiki/OpenType" class="freelinking" rel="nofollow">OpenType</a> typeface i'm developing. I've included ff fi fl ffi ffl ft st and want to add ffb ffh ffi ffk ffl fft fh fj fk fl ft sp fb fh fk. Can anyone advise on what <a href="/wiki/Unicode" class="freelinking" rel="nofollow">Unicode</a> Names I need to use. I was looking at the <a href="/wiki/Private%20Use%20Area" class="freelinking" rel="nofollow">PUA</a> values which <a href="/wiki/Warnock%20Pro" class="freelinking" rel="nofollow">Warnock Pro</a> uses (E032, E033) but <a href="/wiki/Adobe" class="freelinking" rel="nofollow">Adobe</a> recommends against this as it can lead to incorrect funtionality. Any help would be really appreciated.</p>
    <p>Many thanks,</p>
    <p>Dave Lawless</p>
