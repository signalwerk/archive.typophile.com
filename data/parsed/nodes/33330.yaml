      <p>John, let me see if I have understood what you are saying. Are you are first making the point that digraphs ( trigraphs and tetragraphs ) exist in spoken language first and that their existence as linguistic phonemes is precedes and informs glyphs? I think you are also saying that there is often no neat correspondence or matching between a glyph/sign and the phoneme. I know you said more than this but I am hoping this was the distiction you were making vis a vis glyphs &amp; sorting. If so, this makes sense to me and is a good point that would be easy to loose sight of in the mad rush for glyphs. </p>
      <p>Okay. But back to the glyphs again. There is a further distinction between the the sorting  of the digraph and visual form the glyphic counterpart to the digraph takes. Which means that you can have:</p>
      <p>•  a phonemic digraph which can look like two letters and be sorted in the manner of two - the common state. In which case the digraph is a digraph in only the phonemeic sense. Correct?</p>
      <p>•  a phonemic digraph where it can can look like two letters and be sorted in the manner of one - the next most common</p>
      <p>•  and a phonemic digraph where it is presented as a single glyph and sorted in the manner of one - the rarity</p>
      <p>• and a phonemic digraph where it is treated as a single ligatured glyph and sorted in the manner of one - still more rare (and maybe non-existent?)</p>
      <p>Is this breakdown of states corect &amp; complete?  </p>
      <p>Which brings me to my question: When Peter Bil’ak made Fedra Mono, and made the digraphs he made as single glyphs was he embracing the various cultures prefered model for these digraphs ( the single sort &amp; single glyph ) or was he inventing something? The sense I have is that he was inventing. That is why places for a single glyph sz do not appear in the Open type spec. Is that right?</p>
      <p>Still, if you don't mind I would like to list the single glyph digraphs he made and if you would comment on if you think there is there is a reason or prescedent for making them into single glyphs ( or not ) in monospace or variable spaced fonts - that would be great! And if you think there is a good reason to consider ligatures in any of them ( I don't think there is but...) that would be great too.</p>
      <p>Czech - ch<br>
      Croat - dž ch lj nj<br>
      Dutch - ij<br>
      Hungarian - cs gy ly ny sz ty zs<br>
      Latvian - ch dz dž<br>
      Lithuanian - ch<br>
      Maltese - gh ie<br>
      Slovak - ch dz dž<br>
      Spanish &amp; Catalan - ch ll rr</p>
      <p>Then there is also the Ŀ (U+013F) and ŀ (U+0140) which breaks a digraph which I think would be considered seprate for sorting purposes. I think that the punt volat double l (el) is distinct from the ll listed above. Is it?</p>
      <p>This examples leads me to ask: do you think that the punt volat model is the best one to follow? It seems like it to me given the problems associated with letterspacing you illustrated before.</p>
      <p>Or maybe each case has to be considered on it's own merits history etc...</p>
