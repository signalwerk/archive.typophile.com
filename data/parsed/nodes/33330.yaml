      <p>I tried the so-called broken L, however, it was quite distracting and didn't "fit".  The Wikipedia article is slightly incorrect though, because of course any OpenType font can define an <em>ll</em> ligature (and a lot of script fonts do).  I've not seen any printed examples of the broken L, but that's not to say that it doesn't exist, but I certainly never saw it when I was in Catalonia or the Belearic Islands.  When I get back on my home computer I can post examples of my solution and the Catalan one.</p>
      <p>But you are correct in my saying there's no real special treatment that one needs to give digraphs.  Unicode has helped create a multilingual sorting algorithm that you can find at <a href="http://www.unicode.org/reports/tr10/" title="http://www.unicode.org/reports/tr10/">http://www.unicode.org/reports/tr10/</a> .  It's not universal in that it takes some priorities given user preferences, and whilst the document is rather technically oriented, if you're oriented to reading these kinds of documents it might make how Unicode does things make a little (but only marginally so, obviously optimally they would have removed all legacy encodings, but then no one would have adopted it).  But the general idea you can get from it is that Unicode itself doesn't encode the language intricacies, and leaves that to the program that displays it.  This is why we as designers have to separately encode different display forms for the same letter -- functionally (semantically) they are the same in two different languages, but written (graphically) they are different.  Unicode in theory only encodes semantic differences.</p>
      <p><em>«El futuro es una línea tan fina que apenas nos damos cuenta de pintarla nosotros mismos». (La Luz Oscura, por Javier Guerrero)</em></p>
