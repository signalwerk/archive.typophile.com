      <p>Eben: <em>I was wondering if you felt that the visual density of a digraph was to some extent a part of it’s essential nature</em></p>
      <p>On the contrary, in the majority of alphabets that do not include a single sign for every phonemic unit of language -- which is probably the majority of alphabets -- digraphs, trigraphs and tetragraphs generally do not take a form in which the letters in any way differ from their normal forms. We read them as individual phonemic signs because we learn to. In some orthographies, a particular sequence of letters might always form a digraph (I believe this is the case with the Dutch ij) but there are very many languages in which letter sequences can be pronounced in multiple ways and in different words may represent a single sound or a sequence of sounds. English and other languages with etymological and root-based spelling tend to develop these situations over time as pronounciation changes.</p>
      <p>In some orthographies, digraphs etc. are considered separate units within the alphabet, which means that they are sorted independently of their constituent letters. This generally indicates a consistency in their pronunciation. In other orthographies letter sequences that function as digraphs some of the time will be sorted in order of the individual letters.</p>
    html_clean: |-
      <p>Eben: <em>I was wondering if you felt that the visual density of a digraph was to some extent a part of it’s essential nature</em></p>
