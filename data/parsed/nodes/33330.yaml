      <p>Less swoop helps, but of course, you can do that as a part of the ligature. And if it is an f + i(accented), the dot over the "i" isn't used, so less swoop needed.</p>
      <p>But with an igrave, work also has to be done on the accent. I have an "f_igrave" in Bembo that works, but looks passing strange; still better than anything else I've thought of. All suggestions welcome. And apparently f_imacron isn't all that uncommon in transliterated Asian languages -- when I have to make one, sometimes the the macron rides a touch lower than established by the foundry. Shorter, too.</p>
      <p>But you have a good idea -- Matthew Carter made a Swedish version of Galliard with a change to the "f" to better fit with umlauts. You can get that version in the States, by the way, and the difference in the "f" is not noticeable. This is the Galliard I use whenever it is specified. Doesn't help with igrave, though.</p>
