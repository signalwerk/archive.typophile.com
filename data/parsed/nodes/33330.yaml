      <p>While using the underscore in ligature names is not a requirement of OpenType, it is a requirement for Acrobat to be able to reconstruct text from raw glyph strings such as might occur in PDFs generated from print streams. The preferred ways to create PDFs embed the original character codes in the document, but there are some mechanisms for creating PDFs that do not do this and in which the glyph name becomes the only indicator of what the underlying text was. In the case of ligatures it then becomes important that the names are of a format parseable by Acrobat. This means using either the underscore convetion or the extended uniXXXX convetion. For example an ffj ligature could be named either</p>
      <p>f_f_j</p>
      <p>or </p>
      <p>uni00660066006A</p>
