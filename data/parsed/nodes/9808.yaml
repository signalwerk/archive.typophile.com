  html: '<p>With true international grace, ATypI now offers reduced membership rates to those from non-affluent countries. From Mark Batty: <br> <br>" <br>ATypI Policy on Associate Membership <br>February 18, 2003  <br> <br>ATypI is an international association dedicated to type and typography  <br>worldwide. In recognition of the difficult economic circumstances of many  <br>countries in the world, the Board of Directors of the Association  <br>Typographique Internationale has voted to offer Associate Membership to  <br>individuals at a reduced fee to residents of countries with a Gross Domestic  <br>Product (GDP) per capita (adjusted for Purchasing Power Parity (PPP)) of less  <br>than $14,500. A list of countries whose residents are eligible for this  <br>reduced fee will be made available on the ATypI website and is listed below.  <br>The list will be reviewed periodically based on publicly available figures.  <br>We trust that individuals in the countries that are below the $14,500 index  <br>who are able to afford full membership fees will support ATypI in measure to  <br>their personal economic standing. <br> <br>Associate members will obtain selected privileges of full ATypI membership,  <br>with am emphasis on those that foster international dialogue, co-operation  <br>and information exchange (e.g. access to the member section of the website  <br>and subscription to the members-only e-mail discussion list). A complete list  <br>of Associate Membership privileges will be available on the website.  <br>Associate members will receive small discounts on conference registration but  <br>they will not receive selected mailings from the Association. In most other  <br>respects, they will be afforded the same benefits as full members.  <br> <br>The Associate Membership fee will be </p>'
