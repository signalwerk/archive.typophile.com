  html: <p>Using TypeTool 2 on a Mac to edit a Type 1 font. Replacing circumflexes with macrons and that's all. But when I regenerate the font, I get reflow problems in the original InDesign CS doc.  <br> <br>I am not touching metrics, and the reflow affects even portions of text that do not use any edited characters. The numerical metrics settings on the original and edited fonts are the same as far as I can tell. Does anyone have an idea as to what causes this and how I can make it not happen?  <br> <br>I used to do this all the time in Fontographer (much more complicated to use) and had other problems but not reflow. Thanks for any suggestions -- hope they come in soon!</p>
  html_clean: <p>Using TypeTool 2 on a Mac to edit a Type 1 font. Replacing circumflexes with macrons and that's all. But when I regenerate the font, I get reflow problems in the original InDesign CS doc.  <br> <br>I am not touching metrics, and the reflow affects even portions of text that do not use any edited characters. The numerical metrics settings on the original and edited fonts are the same as far as I can tell. Does anyone have an idea as to what causes this and how I can make it not happen?  <br> <br>I used to do this all the time in Fontographer (much more complicated to use) and had other problems but not reflow. Thanks for any suggestions -- hope they come in soon!</p>
