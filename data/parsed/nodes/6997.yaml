    html: <p>The people at Fontlab helped answer this question. The problem was with the original font. It was built without a space character, so TypeTool inserted a new one, but at the standard width for the font instead of the narrower width for the space (same as period and comma). The problem was noticed because the original font had one less glyph than the new TypeTool font. Just one solution to look for should you ever have a similar problem.</p>
