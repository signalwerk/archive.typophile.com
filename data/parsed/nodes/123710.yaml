      <p><cite>It says coming soon on Klim Type's website and I have been crossing my fingers, but the deadline is closing in and I will have to find an alternative. </cite></p>
      <p>Have you asked the foundry about it? Just because the webfont licensing is not yet available as online store functionality doesn’t necessarily mean that the foundry isn’t willing or able to provide webfonts on request.</p>
