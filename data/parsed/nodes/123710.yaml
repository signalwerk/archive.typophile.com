      <p>Thank you for some really nice suggestions. Frode, I've actually already looked at vinter. It's a beautiful typeface. (I'll send you an e-mail) And Ralf, your suggestion is good but I've already been in contact with the foundry and they couldn't give me any estimated time of arrival. </p>
      <p>I'm currently testing out <a class="freelinking external" href="http://fatype.com" rel="nofollow">Beausite Grand</a> which has some of the characteristics of Domaine Sans although less of that crazy flair. But please, if anyone has any suggestions to add, do let me know.</p>
