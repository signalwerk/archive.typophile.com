      <p>How about <a href="https://monokrom.no/fonts/vinter">Vinter</a>? Manually hinted, but it is so thin you should really only use it for big sizes.</p>
      <p>(Edit: My memory of the lightest Domaine weight didn’t match reality. Vinter is too thin. I might have something up my sleeve though, if you contact me directly)</p>
