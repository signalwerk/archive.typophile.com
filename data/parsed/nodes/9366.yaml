  html: <p>i have just realised the message didn't go through the last time. <img src="http://www.typophile.com/forums/clipart/sad.gif" alt=":-(" border="0"> <br>ok, once again . . . <br>hey people! :P <br>i have been asked to redesign the logo of a karate club owned and operated by my girlfriend's father sensei dusan dacic. <br>here is their old logo <br> <br><img src="http://www.typophile.com/forums/messages/29/65826.gif" alt="old logo"> <br> <br>and here is what i was thinking (only one idea, in different versions, since this is the one i think i'll go with) <br> <br><img src="http://www.typophile.com/forums/messages/29/65827.gif" alt="new logo"> <br> <br>as you can see, i have tried to immitate japanese letters with latin ones. can you read "YKD"? <br> <br>suggestions please... <br> <br>PS <br>this is really a hard one for me! :D</p>
  html_clean: <p>i have just realised the message didn't go through the last time. <img src="http://www.typophile.com/forums/clipart/sad.gif" alt=":-(" border="0"> <br>ok, once again . . . <br>hey people! :P <br>i have been asked to redesign the logo of a karate club owned and operated by my girlfriend's father sensei dusan dacic. <br>here is their old logo <br> <br><img src="http://www.typophile.com/forums/messages/29/65826.gif" alt="old logo"> <br> <br>and here is what i was thinking (only one idea, in different versions, since this is the one i think i'll go with) <br> <br><img src="http://www.typophile.com/forums/messages/29/65827.gif" alt="new logo"> <br> <br>as you can see, i have tried to immitate japanese letters with latin ones. can you read "YKD"? <br> <br>suggestions please... <br> <br>PS <br>this is really a hard one for me! :D</p>
