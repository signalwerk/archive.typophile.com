  html: |-
    <p>Hi everyone,</p>
    <p>Most typefaces were designed for a specific medium. For example one will do better in long texts or work better on a computer screen than anothers. Now my question is do you know typefaces thet were designed for a specific purpose that have been taken over for others… (frequently) by this i mean that they are used frequently in an other context than they were designed for… So they actually work in that context altough it was not the intention of the designer…</p>
    <p>Maybe a weird question, i know, but i’m looking for examples and i think there are a lot. Please correct me if i’m wrong :)</p>
    <p>Greetings,</p>
    <p>Olivier</p>
