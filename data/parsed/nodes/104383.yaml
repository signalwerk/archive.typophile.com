      <p>Nice project!</p>
      <p>Of note: Uniform is a typeface already, although it is custom and proprietary to UniformWares (the watch company). You can see it in use here: <a href="http://www.septemberindustry.co.uk/madebysix/" title="http://www.septemberindustry.co.uk/madebysix/">http://www.septemberindustry.co.uk/madebysix/</a></p>
      <p>Unfortunately, they seem reluctant to credit the type designer in the above mentioned portfolio showcase -- Micheal Hernan. </p>
      <p>In this case I'm not sure if the name over-lap matters, but I thought you would like to know. I'm not sure if Mr Hernan will release this font one day due to licensing and other extenuating circumstances.</p>
      <p>Thanks,<br>
      Todd</p>
