    <p>Hello all! I recently launched a new font design project on Kickstarter: <a href="http://www.kickstarter.com/projects/59648831/uniform-a-revolutionary-new-geometric-type-family" title="http://www.kickstarter.com/projects/59648831/uniform-a-revolutionary-new-geometric-type-family">http://www.kickstarter.com/projects/59648831/uniform-a-revolutionary-new...</a></p>
    <p>The font is a geometric sans serif type family, but what makes it unique is that the condensed weights are straight-sided, not squished ovals like all other geometric type families out there.</p>
    <p>Please pass the word along to your designer/type loving friends! I really want to be able to create this cool new typeface but without the funding there is no way I will have the free time to work on it.</p>
    <p>Thanks!</p>
    <p>Richard Miller<br>
    Miller Type Foundry</p>
