  html: <p><a href="http://www.fountain.nu">Fountain</a> releases <a href="http://www.fountain.nu/catalogue/paracelsus.asp">Paracelsus</a> in three weights with both Roman and Fraktur uppercase forms, a-la Rudolf Koch's Offenbach. Unlike Offenbach, the lowercase forms are more of a Schwabacher. There is also a <a href="http://www.fountain.nu/catalogue/img/pdf/FTN_Paracelsus.pdf">PDF specimen</a> available. The Roman capitals facilitate all-caps setting. Sadly there's no Opentype version just yet. <br> <br>Thanks to <a href="http://www.microsoft.com/typography/">MS Typography</a> for the link!</p>
  html_clean: <p><a href="http://www.fountain.nu" class="link-external">Fountain</a> releases <a href="http://www.fountain.nu/catalogue/paracelsus.asp" class="link-external">Paracelsus</a> in three weights with both Roman and Fraktur uppercase forms, a-la Rudolf Koch's Offenbach. Unlike Offenbach, the lowercase forms are more of a Schwabacher. There is also a <a href="http://www.fountain.nu/catalogue/img/pdf/FTN_Paracelsus.pdf" class="link-external">PDF specimen</a> available. The Roman capitals facilitate all-caps setting. Sadly there's no Opentype version just yet. <br> <br>Thanks to <a href="http://www.microsoft.com/typography/" class="link-external">MS Typography</a> for the link!</p>
