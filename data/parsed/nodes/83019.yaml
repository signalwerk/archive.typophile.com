    html: |-
      <p>&gt; could this [logo] work with other, wholly<br>
      &gt; unrelated organizations?</p>
      <p>I agree that it's a fairly abstract symbol. But of course your current logo — a tree —&nbsp;isn't all that specific to your mission either; I'm sure there are thousands of unrelated companies that have trees in their logos, ranging from arborists to paper companies to doctors offices. :)</p>
      <p>&gt; adaptability across print &amp; screen media</p>
      <p>It wouldn't reproduce well in a Xerox or fax, but that's probably not a big consideration. In print it should reproduce ok if you've using a good print shop. But these days screen media is the main consideration for many companies, as most companies are using conventional printing less and less.</p>
      <p>&gt; Will this be able to endure?</p>
      <p>It's certainly a contemporary look; perhaps even a tad trendy. But if you're hoping for a timeless logo, keep in mind that most logos eventually start looking dated, and most larger companies change (or at least tweak) their logos periodically.</p>
      <p>As hola said, these are really things you should be discussing with your designer. A discussion forum like this might be a good way to get a quick opinion, but designing a logo requires a lot in in-depth thought and discussion and your designer has hopefully given these issues a lot of thought.</p>
