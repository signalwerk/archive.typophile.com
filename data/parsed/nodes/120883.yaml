    html: '<p>Really sorry to be such a poor help on this one. The more I look at it the more I think it could be 2 different fonts. Have a look to /G, its outline shape is completely different from /C. Top one looks "<a href="http://www.myfonts.com/search/eurostile" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Eurostile</a>-ish" and bottom one rather (aforementioned) "Ethnocentric-ish". Try having a look to <a href="http://Techno &amp;gt; Sci-fi" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://Techno &gt; Sci-fi</a>, <a href="http://Techno &amp;gt; Various" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://Techno &gt; Various</a> and <a href="http://Basic &amp;gt; Sans serif" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://Basic &gt; Sans serif</a> DaFont sections too, it could help. Some I came across with: <a href="http://www.dafont.com/orion-pax.font" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Orion Pax</a>, <a href="http://www.dafont.com/jefferies.font" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Jefferies</a>, <a href="http://www.dafont.com/4kstncl.font" title="Click to visit an external URL." class="freelink freelink-external freelink-external">4KSTNCL</a></p>'
