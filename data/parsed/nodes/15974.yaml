      <p>Even if you don't have a conscience, why would you want to "nearly" duplicate someone else's font?<br>
      The troubling line is "How much of a change in form ...".  This gives the impression that you are trying to see how much you can get away with.  If you truly are a designer, you would want to create YOUR OWN design. Come up with your own concept for a typeface and do it from scratch.  Is it a lot of work? Yes.  Will you make a lot of money from it? No. One of the reasons is that there are thieves out in the world who would steal someone else's design, do minimal work, and call it their own.</p>
      <p>ChrisL</p>
