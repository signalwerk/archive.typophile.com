      <p>I'm not disagreeing with any of the other comments in the slightest. I would point out however, that there are free-as-in-beer as well as free-as-in-GPL fonts that you can use as a base font. For example, the license for the Vera family specifically allows modification. Keep in mind, that you would need to look at the license carefully to see if it will accomodate what you want to do. Really this discussion is relating to the possibility that you might want to distribute your work to other people.<br>
      I think that it's fairly obvious that it is sometimes easier to work off of an existing font, even if everything will be changed by the time the font is released. For example, it might be usefull to use a font like Vera Sans when making a font that looks much different. The type designer could print and test functional specimens while only parts of the typeface were complete.<br>
      The best way to do this is to have a base font that is completely your own, then you can be 100% sure that everything is legal. Personally,I would never work off of a font that wasn't kosher because you could never be sure that there wasn't some sort of hidden identifier somewhere.</p>
