      <p>Standing on the shoulders and giants ant all that... Indeed, we are all beholden to our forebears, and by mining the past we can make contemporary design statements which lead us into the future.</p>
      <p>But... You can't reuse someone else's font software code as a base for your own code. The data in font files is copyright protected. Drawing a new Bodoni or Baskerville is very different from opening an existing Bodoni or Baskerville font file, tweaking a couple of points here or there, and saving the file with a different name.</p>
