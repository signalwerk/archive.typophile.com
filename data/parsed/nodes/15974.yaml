    <p>Hey all,</p>
    <p>I could use a program like FontLab and edit an already existing font.<br>
    Does that then become mine? Do i have worry about licencing?<br>
    What are the norms on this?<br>
    How much of a change in form will constitute to becoming a entirely new font?</p>
    <p>Appreciate your comments.<br>
    Thanks!<br>
    - V</p>
