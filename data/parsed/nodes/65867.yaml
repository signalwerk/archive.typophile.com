    html: |-
      <p>Speaking of an “unknown digitization” …</p>
      <p>Thanks to <a href="http://typophile.com/node/65224" rel="nofollow">Paul Stonier</a>, I’m now aware of <a href="http://www.veer.com/products/typedetail.aspx?image=JBT0000118#specimen" rel="nofollow">Eloquent</a> (again, because I somehow forgot about <a href="http://typophile.com/node/58083" rel="nofollow">Rainer’s pointer</a>) – “a much-requested digital revival of an old Didone style photo-typepositing face. This new digital version evokes late 1960s magazine advertising, and includes the rarely seen swash variant, and features several newly created alternate swash caps (A, J, Q, Z, M, K,R) and one new alternate lowercase swash (s) and several lowercase ligatures.” — <a href="http://www.veer.com/products/typedetail.aspx?image=JBT0000118#about" rel="nofollow">Jason Walcott@Veer</a><br>
      Seems to be a hit.</p>
