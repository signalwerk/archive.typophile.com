    html: |-
      <p>Mark Simonson wrote in <a href="http://www.typophile.com/node/18307" rel="nofollow">this older thread</a> (about Pistilli Roman):<br>
      <cite>Phil Martin’s Didoni is a close copy, but the digital version’s hairlines are not nearly as thin. Phil’s version was not a straight knock-off. He added a bunch of swash and alternate characters. Ironically, Phil’s contributions are missing from the URW digitization, so what you get is essentially just a knock-off of Pistilli Roman.</cite></p>
      <p>Hence, this might be the 'original’ swashy Didoni, or an unknown digitization of it.</p>
