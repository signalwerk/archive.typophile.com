      <p>While nearly all mainstream faux-handlettering for comics inhabits the range between dull and ugly, I’m not sure that most cases would be well served by trying to transfer over a typographic æsthetic from other media.</p>
      <p>Modernist type served Crockett Johnson’s <a href="http://www.k-state.edu/english/nelp/purple/characters/cartoons.html">Barnaby</a> well because Johnson’s drawing style was starkly modernist. But think what a disappointment it would be to find Walt Kelly’s Pogo appearing in Futura.</p>
      <p>There’s a similar issue in children’s picture books. Often the type chosen looks harsh next to the artwork, and both suffer.</p>
      <p>In comics and picture books artists need to be involved in the type, which means they need to learn about it.</p>
