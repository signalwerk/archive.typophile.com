      <p>Jason C, those Pogo samples are brilliant! Thanks for posting them. It’s been ages since I’ve even glanced at Pogo.</p>
      <p>I think there’s something very valuable and unique about the hand lettering in comics that has developed with the form, and type seems too rigid in most cases. I find that most uses of type in comics separate the voice from the character, which can be an effective visual characterization technique, but is usually just jarring. Narrative voice is usually my preferred use of type in comics.</p>
      <p>Though I’m sure much of this is reading best what you’re most accustomed to.</p>
