      <p>I must admit, I find many attempts to incorporate Swiss typography into comics to be ham-handed and a bit disposable. It reflects an better understanding of art than of type. The type they use is often too small or too dense to be appropriate. I like the aesthetic of <em>Punks</em>, but it’s hardly Swiss modernist except that it uses sans serif typefaces. Other times, the type and art is so gorgeous on one spread and then just terrible on the next, as in Ashley Wood’s <em>Lore</em>; beautiful painting and interesting type interspersed with pages and pages of poorly set Times New Roman. Ugh.</p>
      <p>I admit that I love hand-lettering in comics, so I do have a bias. <em>Jimmy Corrigan</em> by Chris Ware and <em>Hellboy</em> by Mike Mignola are two of my favorites, though there are others that do just as well that I can’t think of at the moment. <a href="http://www.zompist.com/bob43.html">Here’s a nice Hellboy moment</a>.</p>
      <p>Generally, I find set type to be overly rigid for the format, and often too detailed and dense, unless it’s got some other element counter-balancing it. It feels out of place for me unless it’s incorporated in a more ’graphic design-y’ manner, rather than for dialogue. Brian Wood’s <em>Channel Zero</em> is an example of this.</p>
