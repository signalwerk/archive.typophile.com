      <p>Chris, </p>
      <p>It is indeed a fascinating topic and I think its worthy of some experimentation and research. I mean is it really about the readability? Or even the usability, I know we don’t often think in those terms regarding comics and words with pictures is nothing new, but sequential art is another matter all together. You have different characters speaking all with different emotions and inflections. How do you translate that with typography or lettering?</p>
      <p>This may sound a bit arrogant but I really don’t think a lot of letterers come from a strong typographic background (neither did I) however, I do feel that a lot could be gained from comics if they started exploring some of the modernist or post-modernist style of typography. I mean could you imagine if David Carson lettered the Dark Knight or The Watchmen done in Frutiger?</p>
      <p>You are also correct about the separation of disciplines having a lot to do with the disparaging differences in the final outcome of a comic. If you have one guy penciling, someone else inking, another person coloring and yet another person lettering you will definitely have a book that is not consistent in style regardless how harmonious the working relationship is.</p>
      <p>Lore,</p>
      <p>Dave McKean is super cool!</p>
      <p>Si,</p>
      <p>I missed your comment earlier about if banks and corporations started using Comcicraft fonts—Would that be considered innovative? I guess innovation is the wrong word for what I’m suggesting for comic lettering. I just think there is an overall lack of traditional design in comics and a lot of the reason they fall behind artistically. They are hardly reflective of the contemporary art styles around them and that isn’t always a bad thing, but it also seems to hardly gain any influences from the outside. Again not all books suffer from this stagnation but a majority of them do.</p>
