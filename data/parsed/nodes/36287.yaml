      <p>“The ultimate goal is to achieve an aesthetically pleasing design” —</p>
      <p>Well, in comics you have to achieve something a little more than just a visually appealing design.  The goal really is to intertwine the text and art such that the reader can read the text in the story while simultaneously paying just as much attention to the action and feeling in the artwork. If this balance is off, you end up either just reading the dialogue and not really paying attention to the art, or you have trouble reading it at all and just end up looking at the art (I have that problem especially reading bill sienkewicz  comics)</p>
      <p>i think the words should appear as if they are existing in the world of the art - within the frame of the panel, not on top of it.  Digital bubbles floating on top of ink and watercolor always looks funny to me, and from a design standpoint, it is distracting.  But like you said, there are many different techniques - When it is all start-to-finish digital you don’t have the same seperation, so its ok.</p>
