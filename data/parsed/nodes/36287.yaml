    <p>I recently blogged about <a href="http://rondomingue.com/2007/08/18/designcomics/">typography in comics</a> on my site. It was however brief and I like to go a bit more in depth with the concept on this forum. I worked in production/design at two comic book companies and the insistence of doing the word balloons and hand-lettered look always annoyed me. However, little has changed in typography for comics over the years, save perhaps the use of Adobe Illustrator to recreate the same dated look. Comics seem to suffer a  permanent retrograde cycle when it comes to lettering when other aspects of it has evolved such as the art, coloring and paper quality.</p>
    <p>I cite two examples of books that break the boundary for comic book lettering. Both <a href="http://www.punksthecomic.com/">Punks</a> and <a href="http://www.comicbookresources.com/news/preview.php?image=previews/imagecomics/nightlynews/01/cbrpage4-5_FINAL.jpg">The Nightly News</a> do a terrific job at achieving some level of professionalism with the typography. I was curious if anybody else interested in comics can provide other examples. I know this has been under discussion here before I think its worth revisiting.</p>
    <p><a href="http://www.comicraft.com/">Comiccraft</a> is regarded as comics premiere font foundry although I’m concerned that they perpetuate the current style and rarely step outside of the established type styles. No slight to Comiccraft but its more of what the major publishers are looking for, than what they are willing to innovate with their typefaces. I would very much like to see other foundry’s be involved and help innovate an industry thats badly in need of a typographic overhaul.</p>
