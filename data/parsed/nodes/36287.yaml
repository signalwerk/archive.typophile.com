      <p>Yeah some of the captioning is well lettered, very Art Deco. No I haven’t seen the Justice League book but I was thinking the same thing in regards to avoiding the word balloons with the long  indication tails. I mean how cool would it be to see Superman talk with a caption indicated by his red, blue and yellow color scheme or Batman with his black and gray? </p>
      <p>I’m also very familiar with the balloons blocking parts of the art depending on how wordy a scene might be. Even the most skilled comic artist have been challenged with illustrating a scene and then some character reading the Preamble. I think it requires a well thought out idea of layout combined with copy that fits the story. That’s why the most successful artist have also been writers, i.e. Frank Miller, Mike Mignola, Will Eisner, etc.</p>
