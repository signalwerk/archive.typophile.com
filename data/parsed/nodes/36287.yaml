      <p>I don’t think it should be the “gold standard” either, however there should be some cohesion between the lettering and the art. A few comics are slowly departing from the “assembly line” tradition. Inking was born out of the inability to photostat pencils. Now we are seeing “digital inking”, where the pencils are sharpened and darkened in Photoshop. Some artist are coloring their own work and a few are lettering as well. Some of these practices will lead to some amateurish processes but I thinks its all part of a larger growing pain for American comics. Hand lettering will always be around as well as the word balloon, I’m not denying that. There is a lot of room for better typography is all I’m suggesting. </p>
      <p>A lot of the “norms” for comics was born out of the old press methods and has changed very little. Comics have been stuck in a lot of traditional processes for quite some time. The fact that we have a blue uniform Batman is simply because inkers didn’t want to fill in the blacks, so tradition stuck and solid blue was used often to translate as black. New artist didn’t know Batman’s uniform was black and just assumed it was intended to be blue. </p>
      <p>The Japanese have indeed leap-frogged the Americans in terms of publication quality and format. Their hardcover books must be some of the finest design I’ve seen, even outside the comic genre. The Europeans have also took the lead in terms of story quality but that’s another discussion altogether.</p>
