      <p>Ron, I absolutely agree that there’s a dirth of typographic experimentation. I think part of it has to do with the separation of tasks within the industry. Most comics have writers and artists. It’s rare when they do both, and most production schedules don’t accommodate it.</p>
      <p>However, we’re discussing non-mainstream books as well, where more collaborative work or single-artist works are more common. I think part of it is that comics are artist-centric, so their use of type tends towards that understanding. Often the subtle art of typography is too...different from the typical forms of visual expression, such as painting and drawing. Letters, words, and paragraphs carry an odd payload with them that can frighten away some from touching them at all. Others treat them as separate from the art, and their noodling just ends up widening that divide. Worst is when it makes the words harder to read. Word balloons are just safer, even with some typeface futzing/coloration.</p>
      <p>This is a fasinating topic and I think there’s a great deal of unexplored territory. I wish I had more time now to get into it. Perhaps I can dig around for some better examples later this evening.</p>
