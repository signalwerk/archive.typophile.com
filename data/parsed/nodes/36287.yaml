      <p>&gt;the “gold standard” should be that the type should be as close to matching the artist’s hand or the artist(s) process as possible.&lt;</p>
      <p>I’m curious why this should be the gold standard. I don’t necessarily disagree, but I’d like to hear some people’s thoughts on why this should be the ultimate goal all the time. I was brought up on mainstream US comic books and strips, so my initial reaction is that the lettering should look like it was hand lettered, as this is what I’m used to. But I’m not sure that obeying tradition is enough reason to continue on as was always done before.</p>
      <p>Try to take a step back and look at the situation. Sequential art is (usually) a combination of illustration and lettering, and the tradition certainly has been to have an artist hand draw the lettering. However, lots of other media use combinations of illustration and lettering; book jackets, magazine illustration, album covers, just to name a few. Yet the lettering in these cases is sometimes typeset, and sometimes hand lettered. The ultimate goal is to achieve an aesthetically pleasing design, so the lettering needs to work hand in hand with the illustration. I’m not sure if sequential art is any different (may Eisner’s spirit forgive me!) In many cases hand lettering would be appropriate, but in other cases it may not. Certainly in the field of sequential art there is an expansive range of illustration styles, so I expect that differing illustration (and layout) will call for different lettering solutions.  Shouldn’t each case be evaluated independently on the merits of the overall aesthetics?</p>
      <p>Jason C</p>
