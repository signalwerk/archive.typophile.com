    html: |-
      <p>Verlag is yet another design derivative of an older Typeface called Erbar (1927 Jacob Erbar-Germany). So is the dutch Nobel and other designs. </p>
      <p>Maybe google for typefaces from around that time period, or maybe from the Bauer Type Company, which published many of those typefaces back then. Like Bauer Bodony, Weiss, Beton (slab), Candida (slab) etc. </p>
      <p>Depending on your taste, I would say Weiss is a closer Serif to the sans cut and proportions you're looking for. It's also rather beautiful.</p>
      <p>good luck,<br>
      A</p>
