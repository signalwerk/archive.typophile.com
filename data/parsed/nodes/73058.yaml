    html: |-
      <p>Hah, I see what you're saying about Archer. I really liked the pointy M of Verlag, and thought it went well with the symbol I was using. I actually ended up using Verlag in a heavier weight for the most emphasized word, and used a slab serif for the other two words. I asked a couple of people what they thought and they thought the logos looked very different from one another other, so I think it was a good choice.</p>
      <p>Thanks a lot for the help.</p>
