  html: <p>Hi, I'm a graphic design student doing a freelance assignment designing a logo for a community orchestra. I used Verlag at first, but it is too similar to what another music group in town uses, so now I'm looking for a serif font with a similar feel. I'd like something cool, contemporary, and clean. Any suggestions? Thanks in advance!</p>
