    html: <p>If you’re in need of an entry-level job you’re barking up the wrong tree by going to New York. There are a lot of unemployed designers with years of experience who are taking work that pays less than a living wage. So unless your parents can pay your bills I suggest you look at cities with a better job market. If you really do want to work in New York it would be a good idea to update your portfolio to emphasize your web work and you need to get some Flash sites with actionscript gimmickry in there ASAP. There is very little paying print work in NYC these days-the last time I went to a studio that depends on print for revenue half the office was empty desks.</p>
