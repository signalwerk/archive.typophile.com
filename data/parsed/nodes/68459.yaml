    <p>I am a design student with a love for type and print as well as the challenges of type and web. I am looking for some good places to look for a job.</p>
    <p>I'd love to work in book design/layout, but I enjoy all kinds of design. I'll be in NYC and Boston next month and would like to visit some places (I'll send out a little self promo piece prior to arriving). Anyone have any tips of some typographically fantastic design agency places?</p>
    <p>If you know of some great places to work, and they aren't in NYC/Boston, please tell as well!</p>
    <p>Thanks!</p>
    <p>Evan</p>
    <p><a href="http://www.evanmade.com" title="http://www.evanmade.com">http://www.evanmade.com</a></p>
