    <p>Long time lurker, first time poster.</p>
    <p>I was wondering if you could share the titles of books or documents on Paul Renner. I am struggling to find information on him. My professor would like me to get a broad knowledge of what Renner did and the socio-economic conditions of his time, and I am keen to find out more about him too.</p>
    <p>I have only found a dissertation mainly on Futura (obviously) so far. I can't seem to find any informative books or journals on Renner.</p>
