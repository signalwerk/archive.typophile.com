    html: <p>Psychedelica! <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> <br> <br>Quite a few inconsitencies, primarily T (awkward weight  <br>distribution) and V (can't have straight lines in this design). <br>It's too freeform IMHO, you should stick closer to the rules  <br>you set out for yourself. This might sound contradictory, but  <br>you need very rigid rules* to pull off this kind of design if  <br>you don't want it to end up looking amateuristic. More later. <br> <br>(*) Check out some Rian Hughes designs for comparison.</p>
