      <p>"L'EXPRESS",  similar - but not an exact match: <strong><a class="freelinking external" href="http://www.findmyfont.com/index.php/fonts/font-preview?fset=Berthold&amp;ffam=Poppl-Laudatio%20-%20Regular&amp;fstyle=&amp;fsize=60&amp;fid=d5f6613b61d48ef49c7078f7aeb0197a&amp;wrap=2&amp;text=L%27EXPRESS" rel="nofollow">(Popl) Laudatio</a></strong> by Friedrich Poppl (1982, Berthold)</p>
      <p>"DINNER" looks  very close to <strong><a class="freelinking external" href="http://www.findmyfont.com/index.php/fonts/font-preview?fset=Bitstream&amp;ffam=Zurich%20XCn%20BT%20-%20Extra&amp;fstyle=&amp;fsize=60&amp;fid=ce822bc22e83204947dc59c4ee8c10e8&amp;wrap=2&amp;text=DINNER" rel="nofollow">Zurich Extra Condensed</a></strong> by  Adrian Frutiger (Bitstream)</p>
      <p>"LA PUBELLE" looks like <strong><a class="freelinking external" href="http://www.myfonts.com/fonts/itc/benguiat/" rel="nofollow">ITC Benguiat Book Condensed</a></strong> (see also the restored image bellow).</p>
