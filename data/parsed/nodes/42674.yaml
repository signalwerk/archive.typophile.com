      <p><cite>As far as the four problems you mentioned, two of them were just that FontCreator doesn’t run on a Mac. But those aren’t deficiencies per se, just marketing decisions.</cite></p>
      <p>The decision to support only one operating environment can have fairly significant consequences from a software engineering perspective. Once product development goes down the dark and narrow path of relying heavily on platform-specific components, its really hard to go back. I would be just as skeptical of a Mac only product, perhaps more so, because I want to maintain the ability to chose. </p>
      <p>The problem is that FontCreator doesn't compete against FontLab, it competes against TypeTool for the low end market. Font creation is a sufficiently small niche that there aren't enough customers to support lots of competing products. If there were such a thing as FontCreator Pro, might feel differently. FC is taking market share without providing any of the functionality that pro users need.</p>
