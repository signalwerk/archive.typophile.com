      <p>"As far as the four problems you mentioned, two of them were just that FontCreator doesn’t run on a Mac."</p>
      <p>No, *one* of them was not running on a Mac. Another was not generating a bunch of formats, which included some Mac formats but also Windows Type 1.</p>
      <p>I believe I remember some tool which actually solved the problem of generating Mac format fonts on the Windows platform - it spit out the fonts in an archived file which could then be uncompressed on Mac OS! It was a very clever solution for a tool that wanted to run only on Windows, but allow the Windows user to support Mac clients.</p>
      <p>Dave B: I agree that FontLab has overwhelming market share with their products. But that doesn't stop them from needing/wanting to innovate: they want upgrade revenue. If the value isn't there, their existing customers won't buy new versions, and if they already have major market share, how do they make money? The same applies to lots of companies who have major market share in some particular areas, whether it's Adobe or Microsoft.</p>
      <p>Some companies do fail to pursue this path, but it costs them both in upgrade revenue and the eventual emergence of competitors. Think what happened to Brand X after they dropped the ball for a few years too many in a software competition we're all familiar with....</p>
      <p>Cheers,</p>
      <p>T</p>
