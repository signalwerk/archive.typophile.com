      <p>‘[…] As far as our competition goes, we are thrilled to see something going on. We view FontForge, FontCreator and DTL FontMaster as interesting alternatives, or sometimes as complements to our own products […]’</p>
      <p>September last year Miguel Sousa of Adobe and I gave a duo presentation at the FM Track during the ATypI TypeTech Forum in Brighton. Using two beamers we compared some parts of the font production for which at Adobe the FDK is combined with FontLab and for which FM is used at DTL. The comparison was informative and enjoyable and overall well received.</p>
      <p>Perhaps we could repeat such a comparison on a larger scale and with multiple beamers starring FontLab, FontForge, FontCreator and DTL FontMaster, for instance in the main program of the coming ATypI conference at St. Petersburg. The submission deadline has been extended till the 14th of April, so there is time to come up with a joined proposal.</p>
