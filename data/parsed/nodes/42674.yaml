      <p>I personally think Font Creator is great, and I use it at my workplace. The features that I use are the global glyph transformations and the creation of outlines from bitmap images (something that FontLab can't do - you need ScanFont). But as a font designer's tool it is useless, because it doesnt have proper bezier drawing tools (see <a class="freelinking external" href="http://www.cr8software.net/article004.html" rel="nofollow">http://www.cr8software.net/article004.html</a>). </p>
      <p><cite>Time, is on FC’s side though, as I don’t think it’s likely that FL’ll improve, without competition</cite><br>
      FontCreator is aimed at a different market (there ARE non-designers out there that need to use font editors, and for whom font lab is WAY too complex). There is no hope of competing with FontLabs products within their market niche. They purchased Fontographer, and also DTP's Type Designer (now no longer on the market). This is sad, because, as you imply, competition leeds to better products and better prices.</p>
      <p>Also, regarding Jongseong's comment - does anyone know why FontLab Studio is limited to 6400 glyhs? Lesser font editors (including TypeTool) can handle over 65,000. Seems like a deliberate limit to encourage the purchase of AsiaFont Studio to me.</p>
