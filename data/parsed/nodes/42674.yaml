      <p>Just some remarks explaining my previous endorsement of FontCreator.  Its obviously a very complex product and also seems to be comprehensive in its functionality.  But it also seems very well designed to me. I as a novice have been able to perform some fairly obscure tasks using it.  Example one:  I wanted to change the line spacing for an existing font, and was able to accomplish this within an hour of downloading FontCreator for the first time, having never used it or FontLab or any other font creation software previously.  The second example is even more obscure.  For a project I'm working on, I wanted to create a font that consisted of nothing more than varying advance widths - a different advance width for each character and no glyphs at all.  FontCreator was the only product I figured out how to do it on, and I downloaded FontLab and several other products.  Furthermore, FontLab seems to have all these different products with overlapping functionality, as if they've been operating as a partial monopoly and are really trying to maximize they're revenue through marketing. </p>
      <p>Finally, (and this is the primary reason I am adding to this thread now)  I registered at the High-Logic Font Creator forum for the first time less than two hours ago, and my original question I posted in this forum has already been answered over there.</p>
      <p>So, it just surprised me that no one here really seemed to be familiar with them at all.</p>
