      <p>T:</p>
      <p>As far as the line spacing problem, there was this font I found that had a mottled antiquated times new roman appearance ("Titus Cyberbit Basic"), at least when rendered as bold I think, which I wanted to embed in an application I was developing.  However, the line spacing was ridiculously large.  So I downloaded FontCreator, could have been the first thing I found,  and you're right, there's a profusion of terminology pertaining to this and just about everything else related to fonts.  And yet I  accomplished my task pretty quickly, and the fact the font was embedded in my own application made other platform-related issues a nonconcern.   It looks like I tweaked typo line gap, win ascent, win descent, ascender, descender, line gap and probably some other things until I got the results I wanted. </p>
      <p>That second problem I mentioned, developing a font consisting of varying advance widths, actually involved other things as well.  For example I wanted the size of the font to be calculated only above the baseline.  This as well I could only figure out how to do with FontCreator.  (Development of this "font" had to do with embedding images in text.)</p>
      <p>However, when a complete novice can in short order be productive with a big complex piece of software, I think its an indication its very well designed.</p>
      <p>As far as the four problems you mentioned, two of them were just that FontCreator doesn't run on a Mac.  But those aren't deficiencies per se, just marketing decisions.  </p>
      <p>Just think about it -  FontLab has the fiecely loyal following and FontCreator is the new kid on the block.  What do they have to bring to the table other than superior design and functionality.  (Sort of how Mac survives against the PC.)</p>
