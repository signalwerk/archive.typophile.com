      <p>I used the trial edition of FontCreator for my first attempt at type design three years ago. I have a very vague recollection of it, though I don't remember being that impressed with its bezier handling. As I didn't advance beyond the stage of drawing glyphs, I didn't get a chance to try out its full functionality.</p>
      <p>From Thomas's list, I see that it's got a number of major strikes against it. However, if it does support up to 64K glyphs and the professional edition is only $149, then that's a critical point of consideration for someone looking to generate CJK fonts. FontLab Studio only generates fonts of up to 6400 glyphs, which is simply not enough for this purpose, and AsiaFont Studio, which can handle 65536 glyphs, costs $1999.</p>
      <p>Even if one is limited to .ttf fonts without Opentype features, the mere possibility of generating a full CJK font for an affordable price range is an important argument in FontCreator's favour. I could imagine that a CJK font designer would pay for FontCreator just to generate a large font whose individual glyphs were designed using other font creation software.</p>
