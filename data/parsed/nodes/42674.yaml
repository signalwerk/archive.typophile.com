    <p>Recently, in a completely off-topic post in another thread, "Fanatic Font Addict" wrote:</p>
    <p><cite>I’ve been on Typophile less than twenty-four hours and am not a professional font designer. However I felt obliged to point out the following. I notice there are repeated references in this forum to FontLab. However, no one seems to be familiar at all with a product called FontCreator. FontCreator is vastly superior to anything put out by Fontlab. I advise you to go to cnet.com and download a 30 day trial copy and see for yourself. (And I most certainly do not work for the company.)</cite></p>
    <p>I have never used FontCreator from HighLogic. Looking at its feature list, it seems to be appropriately priced for what it does, and it may be quite capable in some areas. It supports up to 64K glyphs, and the "professional edition" is only $149.</p>
    <p>However, just going by the comparison chart on the HighLogic web site (<a href="http://www.high-logic.com/comparisonchart.html" title="http://www.high-logic.com/comparisonchart.html">http://www.high-logic.com/comparisonchart.html</a>), it has several *huge* shortcomings for many, probably most, professional users:</p>
    <p>1) FontCreator only runs on Windows (<a href="http://www.high-logic.com/fontcreator.html" title="http://www.high-logic.com/fontcreator.html">http://www.high-logic.com/fontcreator.html</a>). Most professional font developers use a Mac as their primary machine. (I'm not one of them, but I think it's important.)</p>
    <p>2) It can generate final fonts only with TrueType outlines, as .ttf (OpenType TrueType / Windows TrueType). It can't generate fonts as Mac TrueType, Mac Type 1, or Windows Type 1.</p>
    <p>3) It can only open .ttf and .otf fonts - it cannot open Type 1 ("PostScript") fonts.</p>
    <p>4) FontCreator has no built-in support for OpenType layout features - they expect you to use VOLT instead.</p>
    <p>I'm not saying these things to slam FontCreator. It may very well be a really wonderful tool for what it does. But I think the combination of those factors would utterly rule it out for the huge majority of professional type designers, which hardly makes it "vastly superior."</p>
    <p>Cheers,</p>
    <p>T</p>
