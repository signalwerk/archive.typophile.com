      <p>I must admit that Fontlab Ltd. currently has a somewhat confusing list of products for font editing. So, let's take a look: </p>
      <p>TypeTool 3 (US$99) is a font editor that support Type 1, OpenType PS (.otf) and OpenType TT (.ttf), note that it supports up to 65,535 glyphs and generally serves as a rather effective font editor for non-professionals. The "core" of TypeTool is based on FontLab Studio 5, so the generated fonts have the same quality (with autohinting etc.). No support for adding OpenType Layout features, so you may need to use Microsoft VOLT or Adobe FDK for OpenType for that. Obviously, as I work for Fontlab Ltd., it would be unfair for me to draw any comparisons with FontCreator, but I'd be thrilled to see a comparative review between TypeTool and FontCreator some time. </p>
      <p>Fontographer ($349) is really in a 'transitional' state. Two years ago we acquired the product to salvage it from complete extinction (something that happened to FontStudio and many other font editing products). We have upgraded it to Mac OS X but nothing much less happened, the last feature upgrade was done by Macromedia back in 1996. We have great plans for Fontographer in the future, but it's too early to announce something. </p>
      <p>FontLab Studio ($649) is our high-end font editor, the one that most of Typophile readers are probably familiar with. We are working on the next version of the product right now. The 6,400 glyph limit has been introduced back in the days when we launched a separate product, AsiaFont Studio, specifically for the Asian market. The limit was not much of a problem then because hardly any non-Asian font reached that limit, and for simple font work there was always TypeTool that did not have this limitation. These days, even European OpenType fonts can reach the 6,400 limit if they come with lots of alterates, so we are considering the possibility to lift that limitation in the next version. </p>
      <p>AsiaFont Studio ($1999) is "FontLab 4.6 on steroids", an editor based on the previous version of our high-end editor, extended with some features for Asian type design and supporting some Asian font formats. We are currently working on the next version of a font editor for that segment, details to be announced. </p>
      <p>There is a comparison chart showing the main differences between the four font editors at:<br>
      <a href="http://www.fontlab.com/fontlab-products/compare/" title="http://www.fontlab.com/fontlab-products/compare/">http://www.fontlab.com/fontlab-products/compare/</a></p>
      <p>As far as our competition goes, we are thrilled to see something going on. We view FontForge, FontCreator and DTL FontMaster as interesting alternatives, or sometimes as complements to our own products. For example, I know some users who use FontLab Studio combined with FontForge or with some DTL FontMaster modules. We think that competition on the market, be it as small and specialized as font editing software, is essential and good. I have been in regular (though occasional) e-mail contact with Erwin Denissen (FontCreator), Frank Blokland (DTL FontMaster) and George Williams (FontForge), the tone of those exchanges was always friendly, and I doubt there is any 'negative competition' going on. </p>
      <p>We think that Fontlab Ltd. can compete successfully in questions of both product quality and support. I realize very well that we need to improve in both aspects, and I can assure you all that we're not letting us rest on this. </p>
      <p>Best,<br>
      Adam Twardoch<br>
      Fontlab Ltd.</p>
