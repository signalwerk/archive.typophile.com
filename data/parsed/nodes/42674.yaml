    html: <p>I use FC, and it has its issues. As far as the not supporting OT features natively, some of the more avid users have now compiled tutorials on their forum on how to add those features, and it is something the developer is considering adding. It's a fairly lively, if small, community of users, and it is being actively developed and reworked to get better. What it does, it does pretty well. It's no world beater, but it is easier to use than FontForge, if not nearly as powerful. I agree with the comparison to TypeTool rather than FontLab.</p>
