      <p>"seems to be comprehensive in its functionality"? Hmmm. That's kind of funny, I thought all four of those things I cited in my first post were really fundamental omissions.</p>
      <p>I think it's great that you find FontCreator easy to use. I would not for a moment defend the ease of use or approachability of FontLab, and I'm quite willing to believe that FontCreator could be vastly easier to use. </p>
      <p>But of course all of the functionality you mentioned is present in FontLab (and presumably DTL FontMaster and FontForge as well, among others). None of those functions are particularly advanced or obscure, IMO.</p>
      <p>I'm curious about one thing, though: when you changed the line spacing, WHICH kinds of line spacing in the final font did you change? You see, there are several different values relating to vertical spacing in a TrueType font, and they are used in different ways on different platforms, and sometimes even by different applications on the same platform.</p>
      <p>Cheers,</p>
      <p>T</p>
