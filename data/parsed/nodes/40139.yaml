    <p>Hey, can you help me out here..?</p>
    <p>I'm looking for a font that looks like the one in the picture. It is from the  "Terminal" in Mac OS X, and I know that it's Monaco. BUT. When you use Monaco in a normal program it is flattene  and doesn't look digitalized as in the picture, if you know what I mean. I would like to find a font that looks like this one, also in print, for use as body text, so it has to be thin but still looking like made out of squares.</p>
    <p>Regards, Rasmus</p>
