      <p><cite>it is flattene and doesn’t look digitalized</cite><br>
      Rasmus: What you describe is called <a href="http://www.google.com/search?q=site:typophile.com%20anti-aliasing" rel="nofollow">‘(anti-)aliasing’ </a>. In some applications (like Adobe Photoshop), you can toggle through different modes of smoothing. </p>
      <p>David: The link doesn’t work (for me); seems it needs one more slash: <a href="http://www.myfonts.com/fonts/marksimonson/raster-gothic/" rel="nofollow">Raster Gothic</a>.</p>
