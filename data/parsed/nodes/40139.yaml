      <p><em>it is flattene and doesn’t look digitalized</em><br>
      What you describe furthermore is the difference between pixel or bitmap fonts and vector fonts (Truetype, Postscript)</p>
      <p>Emigre used to have those pixelfont-looking fonts (as PS1s of course).<br>
      I know Fountain also offers a vector-PS1 version of their Sevenet-font (and that’s even for free but also very small).</p>
