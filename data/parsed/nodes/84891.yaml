    html: |-
      <p>I think it depends on the feel you are going for. Combining a contemporary and traditional typeface can work nicely to create juxaposition. Then chose a glyph that supports the mood. If you are going for modern try a modern looking glyph.</p>
      <p>I really like Bodoni with Futura. In The Elements of Typographic Style, Robert Brighurst says that Bodoni breathes much of the same spirit as Futura since they both aspire to geometric purity. img:Bodoni-Futura_4580.jpg]</p>
