      <p>Looks good to me. I <em>love</em> Paperback! Why didn’t you use it for the text and Futura for headlines – the obvious but admittedly more boring way? (Even more boring though: Futura and Bodoni.) The ornaments contribute to the unusual, fresh feel. Works well I think. </p>
      <p>But don’t indent the first line of a column.</p>
