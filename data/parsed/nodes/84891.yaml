  html: |-
    <p>Hi,</p>
    <p>I'm creating a document that is using HI Paperback typeface + Futura. I'm not 100% committed to Paperback, but it looks nice with Futura. Anyway, I'm interested in using some ornaments on the document but am unsure if they fit with the modern look of Futura. Is there a good resource or rule of thumb regarding the use of ornaments? I get a little confused when I'm combining something contemporary - like what House Industry offers with old standards like Futura. I'm wondering if there is a resource out there that explains more about how and when to use ornaments with sans serif fonts?</p>
    <p>Is this making sense?</p>
    <p>Thanks for any help!<br>
    a</p>
