    html: <p>I have to admit that I have a strange, immediate attraction to this family. Obviously this was considered in the process (at least to an extent, with the reference of Eurostyle), but the high-tech vibe I pick up on is really that of a technology of the past — an industrial, tactile tech more than a digital, bleep-bleep tech. But nonetheless it seems to work in this age too, and because of that fusion I love it. Can’t wait to see it in action!</p>
