    <p><a class="freelinking external" href="http://allumi.typofonderie.com " rel="nofollow"> Allumi PTF Extended</a> is an exclusive design only availble at <a class="freelinking external" href="http://www.typofonderie.com " rel="nofollow"> typofonderie.com</a></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/allumiptfextended_01_6015.gif"></div><p></p>
    <p><a class="freelinking external" href="http://allumi.typofonderie.com " rel="nofollow"> Allumi PTF</a> is a different font. Different from anything I have has designed in the past. Allumi PTF is a sleek typeface designed with technology in mind.<br>
     It’s a perfect font family for any communication concerning design, robotics, or functionality. Pushed to its extreme limits, the Allumi PTF shapes are neither perfectly round or geometrically square. It’s a human design with a high tech touch. Allumi PTF can be described as the Eurostyle (designed by Aldo Novarese in 1962) of the new century, mixed with Frutiger. Allumi is a serious typeface because of the unique design and sturdy form. The pure shapes can create a global presence today with an eye on the world of tomorrow.<br>
     Each series features a full glyph set which covers most latin languages and includes all aspects of typographic needs such small caps, various set of figures &amp; so on. In addition, with the use of some alternate glyphs, the overall aspect of text setting can change. Last but not least, more than 70 dingbats are included and adapted for the 9 series.</p>
    <p><em>Jean François Porchez</em></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Allumi_brand_4103.gif"></div><p></p>
