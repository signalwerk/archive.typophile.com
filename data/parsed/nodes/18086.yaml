    date: 2006-03-12T14:17:00
    votes: null
    html: <p>I think that what Si means is that a constructed typeface as you have shown is the kind of exercise which all young type designers create as technical trials; one can build something on a grid quite quickly, and play out some technical ideas. But more typographic designs - such as "Gotham" or "Farnham", to pick two recent typefaces at random - really demonstrate the skills their designers have, as well as their æsthetic sense.</p>
