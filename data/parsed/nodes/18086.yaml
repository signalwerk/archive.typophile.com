    date_raw: 23 Feb 2006 — 10:44am
    date: 2006-02-23T10:44:00
    votes: null
    html: <p>Hi. I held off replying, because it's tough to know what to say. Most publishers - myself included - like to work with designers to get their types ready for the world, and then do the marketing and whatnot, and hope that the marketplace wll respond. Type publishing is a huge gamble and the rewards range from zero to pretty good. Publishers share the risk and the reward with designers. Buyouts of type designs do happen, but usually it's designers/publishers selling to a client. You might find a publisher who will be interested in a buyout of your designs, but most will want to maintain a publisher/author relationship. That being said, you should definitely contact those foundries whose work you admire, and who you feel would admire your work. Then you can discuss the nitty-gritty business details.</p>
  - id: 109712
    user_id: 1049
    user_name: Si_Daniels
    user_path: null
    user_image: /files/pictures/picture-1049.png
    date_raw: 23 Feb 2006 — 10:59am
    date: 2006-02-23T10:59:00
    votes: null
    html: <p>I don't think there will be too many vendors out there who will pay upfront cash to someone that doesn't have a track-record of producing a string of top-sellers, even then I'd guess it would only be a small advance on royalties. Maybe having your own site or a myfonts store would be a good first step. If your plan is to maximize revenue then building a reputation (making good stuff, attending &amp; speaking at the conferences, getting high-profile clients, entering a few compos, doing more techy work - such as clever OTL or hinting) and then doing custom work might be your best plan.</p>
