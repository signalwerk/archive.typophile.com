      <p>I agree with Chester, the choice was poor because...</p>
      <p>a. A constructed font doesn't really demonstrate any of the typical type design skills. It does look like a typical beginner's effort. Nothing wrong with that, but if this is typical of what you're currently producing then you have a ways to go before you can expect any kind of commercial success.  </p>
      <p>b. It shows a lack of understanding of what outfits like Adobe (the subject of your initial inquiry) are interested in - compare with Bickham Script Pro, or Garamond Premier Pro. </p>
      <p>Cheers, Si</p>
