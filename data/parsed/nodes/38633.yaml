    <p>Hi everyone, </p>
    <p>I’m new here so be gentle! </p>
    <p>Anyway, as I’ve been out of the design loop for awhile (having a baby and being a mum!) means I’m rusty on most things. (Though its coming back, the old ’its like riding a bike analogy!) I was wondering whether any of you have mini projects that you do to keep your creative juices flowing and whether you cared to share what you did? </p>
    <p>I keep a journal of creative thought, so if something inspires me I document it, I tend to write a fair amount and then typeset that but I was just interested in something a bit quicker and would help me find my footing again! </p>
    <p>Red.</p>
