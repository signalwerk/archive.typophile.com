    <p></p><div class="imageWrap"><img src="http://typophile.com/files/WFA-Logo small_6462.JPG"></div><p></p>
    <p><strong>Monotype Imaging Announces Call for Entries for its 2nd Annual Web Font Awards<br>
    </strong><br>
    <strong>Website Submissions that Showcase Best Use of Web Fonts Now Being Accepted through Oct. 28, 2011</strong> </p>
    <p>Monotype Imaging Holdings Inc. (Nasdaq: TYPE), a leading global provider of text imaging solutions, is now accepting entries through Oct. 28, 2011, for its 2nd annual <a class="freelinking external" href="http://www.webfontawards.com/" rel="nofollow">Web Font Awards</a> , the international competition that recognizes websites that incorporate exceptional use of Web fonts. Winners will be announced following a live judging event during the <a class="freelinking external" href="http://futureofwebdesign.com/new-york-2011/" rel="nofollow">Future of Web Design</a> conference, Nov. 7-9, in New York City. </p>
    <p>This year's grand prize for both the Judges' Choice and Community Choice winners is a trip to London with a VIP pass to the Future of Web Design London Conference in the spring of 2012. Other prizes include Apple® iPad® 2 devices, subscriptions to Monotype Imaging's <a class="freelinking external" href="http://www.fonts.com/" rel="nofollow">Fonts.com</a> Web Fonts service and copies of the Monotype®, Linotype® and ITC® font library products. </p>
    <p>"Here Comes the 2011 Web Font Awards," a video that sets the stage for the competition while showcasing last year's winners and various entrants, is available by selecting "the Web Font Awards" at youtube.com/user/MonotypeImaging. Several leading brands that have adopted Web fonts are also highlighted, including Honda, Hershey's, Neutrogena, tcby and Coca-Cola, to illustrate that Web fonts are not considered experimental technology. </p>
    <p>"Since our inaugural competition, the breadth of Web fonts has escalated, extending typographic possibilities for website design," said Allan Haley director of words and letters at Monotype Imaging. "The 2011 Web Font Awards recognizes the importance of Web fonts and pays homage to the typographic excellence of those who are taking website design to a whole new level." </p>
    <p>The Web Font Awards is sponsored by Monotype Imaging with support from Carsonified, a UK-based company that produces events for Web professionals, including the Future of Web Design conferences. Monotype Imaging is also working with the WebINK® Web font service from Extensis, and media partners including HOW, Creative Review, Slanted and Novum to select the three entrants that will be judged, in addition to announcing the Web Font Awards winners following the Future of Web Design conference. </p>
    <p>Contest entries can be built with Web font technology from any provider, including self-hosted solutions, as long as the site or Web page uses actual fonts that are served to Internet-connected machines through the @font-face declaration. There is no limit to the number of entries that an individual can submit. </p>
    <p>All accepted designs will be displayed in the gallery at <a href="http://www.webfontawards.com" title="www.webfontawards.com">www.webfontawards.com</a>, where site visitors can rate each entry one time based on the quality of typography, creativity and usability. The entry with the highest score at the end of the viewing period will receive the Community Choice award. New this year is rating a system designed to improve participant engagement in the Web Font Awards voting process. Those who frequently post constructive comments, for example, will be rewarded through a voting influence score, which will be recalculated daily. "This combined with other factors will impact the score of submitted sites. The new system also allows participants to share expert opinion and demonstrate their influence as an impartial judge of world class Web design using Web fonts," Haley said. </p>
    <p>Three designs, selected by Monotype Imaging in addition to the contest's media partners, will be singled out to vie for first, second and third place Judges' Choice awards at a live ceremony at the upcoming Future of Web Design conference in New York City. Judging will be based equally on the quality of typography, creativity and usability of the three selected designs. Award winners will be informed by e-mail and are not required to attend the judging event or the Future of Web Design conference. Winning entries will also be posted after Nov. 9, 2011 at <a href="http://www.webfontawards.com" title="www.webfontawards.com">www.webfontawards.com</a>. </p>
    <p>Complete rules on the Web Font Awards, including submission guidelines, eligibility requirements, judging criteria and procedures, award ceremony and prize details including the breakdown for Community Choice, first, second and third place Judges' Choice awards are available at <a href="http://www.webfontawards.com" title="www.webfontawards.com">www.webfontawards.com</a>. The retail value of all prizes combined totals more than $111,000. </p>
    <p><strong>About Monotype Imaging</strong> </p>
    <p>Monotype Imaging combines technology with design to help the world communicate. Based in Woburn, Mass. with offices in the U.S., Europe and Asia, Monotype Imaging brings text imaging and graphical user interface capabilities to consumer electronics devices such as laser printers, copiers, mobile phones, navigation devices, digital cameras, e-book readers, digital televisions, set-top boxes and consumer appliances. The company also provides printer drivers, page description language interpreters, printer user interface technology and color imaging solutions to printer manufacturers and OEMs (original equipment manufacturers). Monotype Imaging technologies are combined with access to more than 14,000 typefaces from the Monotype, Linotype and ITC typeface libraries — home to some of the world's most widely used designs, including the Times New Roman®, Helvetica® and ITC Franklin Gothic™ typefaces. Fonts are licensed to creative, business and Web professionals through e-commerce portals, direct and indirect sales and custom design services. Monotype Imaging offers industry-standard font solutions that support all of the world's major languages. Information about Monotype Imaging can be found at <a href="http://www.monotypeimaging.com" title="www.monotypeimaging.com">www.monotypeimaging.com</a>. </p>
    <p>Monotype is a trademark of Monotype Imaging Inc. registered in the U.S. Patent and Trademark Office and may be registered in certain jurisdictions. Times New Roman is a trademark of The Monotype Corp. registered in the U.S. Patent and Trademark Office and may be registered in certain jurisdictions. Linotype is a trademark of Linotype GmbH registered in the U.S. Patent and Trademark Office and may be registered in certain jurisdictions. Helvetica is a trademark of Linotype Corp. registered in the U.S. Patent and Trademark Office and may be registered in certain jurisdictions in the name of Linotype Corp. or its licensee Linotype GmbH. ITC is a trademark of International Typeface Corp. registered in the U.S. Patent and Trademark Office and may be registered in certain jurisdictions. ITC Franklin Gothic is a trademark of International Typeface Corp. and may be registered in certain jurisdictions. Apple and iPad are registered trademarks of Apple Inc. WebINK is a trademark of Extensis, a division of Celartem, Inc. All other trademarks are the property of their respective owners. © 2011 Monotype Imaging Inc. All rights reserved.</p>
