  html: <p>I was recently looking at Goudy Old Style MT (as distributed by Adobe) and <a href="/wiki/Sorts%20Mill%20Goudy%20" class="freelinking" rel="nofollow"> http://www.theleagueofmoveabletype.com/sorts-mill-goudy</a> and they seem identical to me no matter how hard I look. Is there some way to compare faces beyond simply eyeballing?</p>
