    <p>Around 1965 while wandering in Paris around the Left Bank I came across a shopfront with a sign declaring in English or French (I forgot) The Four Duncans Museum. They were four sibling the most famous being Isadora Duncan the dancer. I just found out about Raymond Duncan 1874-1966, who immersed himself in ancient Greek culture, and the interest here is that he created his own typeface to print his own books.<br>
    Orson Welles interviewed him here:<br><a href="http://www.dailymotion.com/video/x3gdwi3">http://www.dailymotion.com/video/x3gdwi3</a><br>
    More about Raymond Duncan's amazing life and work:<br><a href="https://en.m.wikipedia.org/wiki/Raymond_Duncan">https://en.m.wikipedia.org/wiki/Raymond_Duncan</a><br>
    Anything about this eccentric polymath's typeface, quality examples of printed pages and critical discussion would be interesting.<br>
    Vladimir</p>
