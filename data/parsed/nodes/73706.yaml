      <p>I continue to use Helvetica a lot because several of my corporate clients require it as part of their graphic standards. One reason that many companies use Helvetica is because they know that every employee and every vendor they use probably has either Helvetica or Arial on their computer already.</p>
      <p>Overuse is not a big issue to me as long as it's appropriate for the situation; after all, many of the classic fonts continue to be used a lot. But I worry sometimes that Helvetica can look a little dated, since it's strongly associated with the look of corporate pieces done a decade or two ago.</p>
