    <p>Hi guys I'm working on my studio project that is based on helvetica.</p>
    <p>I'm looking in the issue of Helvetica being overused in design. I had read about the post regarding the issues whether or not helvetica is great or not. </p>
    <p>I read about some of the reasons that popularize helvetica and why helvetica should not be use on just about everything. </p>
    <p>My studio project aims to convince people (designers) that helvetica is way overused.</p>
    <p>I was wondering if it is viable doing so? </p>
    <p>Is it just me or are there many that agrees that helvetica is overuse?</p>
