    <p>Hello!</p>
    <p>I found myself visit this forum very often lately and found your advices really helpful. So I decided to sign in and ask for your help on such a matter:</p>
    <p>I'm working on a book that will be sent free to subscribers of a biz mag. Size 240x260mm  (56p8x61p5) means that no one would take the book to his/hers business trip and likely it would spend its time on the shelf of some young executive after a brief flick through.</p>
    <p>The Book consists of several articles from the mag. Each article starts with a title spread with two color illustration (Black + Pantone). Typefaces used in the book are LeMondeJurnal for the body (set 9/12) and PrivaPro used for titles, subtitles, subheads, quotes, pagination and sidebar text.</p>
    <p>The main reason of this post are my concerns about the ligatures at titles and quotes. I can't make up my mind if they harmonize with illustrations well or are signs of over abundance?</p>
    <p>Any opinions on that matter, or any, concerning typography or composition in attached pdf file would be much appreciated.</p>
    <p>PS. Is it me or the "w" and "y" in PrivaPro are tad darker than other glyphs?</p>
