      <p>Thank you for your comment, dux.<br>
      I tend to like the ligatures in this book as well, but my co-workers opinions are mixed.</p>
      <p>I forgot to mention the book is typeset in Polish - we got plenty diacritical marks most of English based typographical world would call bizarre - a ogonek, e ogonek, l slashed, z dot and many others. They're just normal common letters for Polish readers, so they don't compete for attention with ligatures.</p>
