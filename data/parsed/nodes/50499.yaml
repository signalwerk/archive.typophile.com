    html: <p>This is hand drawn. The E in Head and E in Hunters are quite different. So are the two Cs in Hancock. Also the A in Head and A in Hancock. I can’t think of anything similar. Searching for a word like “tribal” on myfonts might get you something. I don’t know if dafont does a similar keyword search.</p>
