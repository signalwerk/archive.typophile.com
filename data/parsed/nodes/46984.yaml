    html: |-
      <p>Sallu,</p>
      <p>It seems this is more an error by Microsoft than one caused by your installation / machine / configuration. The font for this dialog might be hardcoded to one that does not contain Arabic characters. I'm guessing, but it's still displayed RTL -- so it's recognized as Arabic --, and the same text displays fine in other dialogs -- so it's not a text storage thingy.</p>
      <p>You could contact Microsoft to report it as a bug, or perhaps they already have a fix.</p>
