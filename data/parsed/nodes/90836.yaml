    <p>I hope this hasn't been done before. I'm trying to be original. The premise of the thread is simple. Post your font o' the day. Whether it be something new you discovered and like, a classic you admire, or just an excuse to post a pretty specimen. Whatever you wish. </p>
    <p>For me it will be Brandon Grotesque Bold, by HVD fonts.</p>
    <p><img src="http://cdn.myfonts.net/s/aw/720x360/114/0/58494.png" height="200"></p>
    <p>I love that retro look, and especially those wonderfully soft corners.</p>
