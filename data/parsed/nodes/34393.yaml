      <p>I'm not sure that the Bootcamp/Safari comparison is a good one. When people look at a web browser the first question is "How does it render stuff?" When people fire up Bootcamp, the type rendering is not necessarily the first question. (It's more like, "What's that little red shield? What, I don't have virus protection? How do I get it? I have to get a subscription?" - sorry, I couldn't resist). What's more, I think that most everybody who installed Bootcamp or parallels had a good idea of what Windows looked like before they installed.</p>
      <p>That being said, I don't think it was a great idea to replace the default renderer, even though I like Apple's type much better. A good port should be a good citizen in its new environment and try to fit in. I don't think that Apple really intended to be a good windows citizen here, though, which might be the real root of the argument.</p>
