      <p>Thanks for the waterfalls Randy. Those are eye-opening. One other thing to try: If you set the anti-aliasing to "Light" in System Preferences in OS X, it makes for slightly sharper text. </p>
      <p>Another factor: as pixel densities get higher, anti-aliaised fuzziness becomes less noticeable, while the wonky spacing and counter sizes (texture) of delta hinted renderers becomes more apparent. This is especially true for mobile devices, which are now commonly approaching 150ppi. Unhinted antialiasing looks amazing at these sizes. I'm really interested to see what the type looks like on the iPhone. When people start freaking out about how slick it looks, they of course won't know that they are reacting to the type, but we type nerds are used to that :)</p>
      <p>For those that think that the crisp CT type with bad spacing is more useful... I simply disagree. Ugly spacing is less 'purdy' and less user friendly. As for designers making "good" fonts: at this point I would be happy with *different* fonts. I'm so sick of the web 5. Ack. Of course with CT there is no such thing as different type: it takes every font and crunches them all into the same shapes. Seriously, look at the examples above. The Verdana renders under CT look like Arial stretched out a little. Even the pixel versions have more flavor. [edit: this is a little bit of hyperbole, there are still obvious differences - but the individual flavors of the type are much more apparent in Quartz].</p>
