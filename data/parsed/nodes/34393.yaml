      <p>I HATE Cleartype. I think it's crap, and the legibility tests Microsoft do are bordering on ridiculous. More on the topic here: <a href="http://www.joelonsoftware.com/items/2007/06/12.html?hi=joel" title="http://www.joelonsoftware.com/items/2007/06/12.html?hi=joel">http://www.joelonsoftware.com/items/2007/06/12.html?hi=joel</a></p>
