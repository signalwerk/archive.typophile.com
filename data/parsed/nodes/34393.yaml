      <p>Ha! A spread in that book really is about the same size as most mobile displays. It's true that 150 ppi is not enough (even my 1200 dpi laser isn't enough as far as I'm concerned), but ppi isn't everything. 150 ppi with 16 bit color can carry more data than 150 dpi at 1 bit. This is true of pictures, but it's also true of type. There really isn't a correlation to this principle in the print world, since the ink is always there or not, with a maximum of maybe six colors (3bits ;). That being said, I'd rather have a 300dpi screen to read on, for sure.</p>
