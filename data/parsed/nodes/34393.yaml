      <p>Spotty spacing? First of all Randy's examples suffer from two major flaws: they're using legacy screen fonts; and they're not using Vista. That said, I've never been highly satisfied with CT. But, again: at least it's trying the right thing. To me intent is the foundation.</p>
      <p>And what's "a fair amount of time"? I certainly don't believe that I, or anybody else, can scientifically self-field-test extended readability. I've done two things: gone to Apple stores a dozen times and spent maybe a total of two hours looking; and I've taken very close looks at the bitmaps generated by the Apple renderer. Since I've been looking at -and making- screen fonts since 1982, this is enough to feel safe in arriving at a very simple conclusion: Apple does not care about improving onscreen <cite>reading</cite>; they care, in that ol' Modernist way, about the pretty gray blocks. And by extension: Apple no longer cares about type. And there's other evidence of this in other things that Apple has [not] done. The thing is, I wouldn't mind that too much if it was out in the open - but instead we get the opposite: the persistence of the belief -especially among graphic designers- that Apple cares about type, in particular cares about type more than MS. This type of denialism chaps my hide.</p>
      <p>Now, I don't believe MS, as a corporation, cares about type because it cares about us. In fact no public company can care about anything besides money. But I do believe that most people in the MS type department genuinely care; a corporation is typically made up of good people from whom it tries to milk profits; they resist to a certain extent, and this resistence allows for the persistence of true benefit to people. We know who the MS type people are - we've met them - they come and talk to us, ask us things. Where are the people at Apple's type department? We don't even know them. Peter? Haven't heard a peep from him since 2002. Who else? Nothing, nada. Are they benevolent hermits? I think a much better explanation is that the type of people who are willing/able to make onscreen reading better simply haven't been hired.</p>
      <p>hhp</p>
