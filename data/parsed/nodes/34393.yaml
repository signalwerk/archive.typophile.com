      <p>Hmm...</p>
      <p>I was just fiddling with <a href="http://typetester.maratz.com/" title="http://typetester.maratz.com/">http://typetester.maratz.com/</a> on my PC and my Mac side by side. I'm comming at this as a designer of websites. PC running XP IE6 FF2, Mac Safari 2 .. both sides at default settings since most leave it like it comes out of the box.</p>
      <p>My biggest gripe with pc screen typography is that certain sizes of certain fonts look fantastic. But heaven forbid that you specify bold at that size. Or increase the size 1px. Case in point, Arial Bold 14px (nastified). Verdana 16px Bold (bold? bold?). Up to 17px, ok now it's bold, but the spacing is all wack. In fact, i would say px sizes 14+ look ghastly on my pc.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/compare_4242.gif"></div><p></p>
      <p>No fair you say? Clear Type not turned on in the PC example. How many users open Control Panel &gt; Display &gt; Effects &gt; Screen Font &gt; Clear Type to click that box? My issue is what joe pc sees when he fires up his Dell box, but Ok. Now clear type is active:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/cleartype_6577.gif"></div><p></p>
      <p>Hey that 17px is looking much better on the pc. Beter than the mac? Debatable. How is the 16px? Craptastic spacing and contrast. Mac? Still pretty decent.</p>
      <p>In conclusion: on a PC without cleartype, 10% of type options get an A, 90% get a C-. With cleartype on, the percentages improve somewhat. Out of the box on a mac, 100% get an A-. I'll take freedom and an A-. Call me artsy.</p>
      <p>R</p>
