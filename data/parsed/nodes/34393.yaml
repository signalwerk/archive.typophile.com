      <p>Carl, I'm curious which four rasterizers you had in mind. Maybe this should be a new thread. It would be interesting to see a bunch of them head to head. These are the ones that I know of: Microsoft ClearType, Apple Quartz, Adobe (ATM?), Freetype, iType (Monotype), D-type (don't know if this is used anywere, but their samples look nice), Bitstream Font Fusion (never really seen this in action either, that I know of).</p>
      <p>As for some other renderers: I really like the rasterizer Macromedia built into Fireworks with adjustable super-sampling, weight and sharpness. The new rasterizer for Flash is kind of a mess (see the insert image link at the bottom of the page). I really dislike the rasterizer that Adobe puts into its DTP apps. Photoshop anti-aliasing is mega-blurry, which is fine when you are going to print at 300dpi, but lousy for screen graphics. InDesign and Illustrator rely too much on hinting, distorting the type for on screen reading — bad for wysiwyg apps targeted at high res printers. It would be better for the type to show up a little blurrier, while giving a better sense of how the spacing and color are working out. I've been tricked more than once into kerning a hinted line of type in InDesign, only to discover upon zooming in/printing that I had been deceived by the hinting.</p>
    html_clean: |-
