      <p>It's interesting the three apps you noted.  Word, Pages, and TextEdit all use different engines.  Pages and TextEdit's are related, but I've found subtle difference in mark-positioning for instance between the two when I needed to have a tilde over a lower-case q (a common Spanish abbreviation back in the day).  TextEdit can do it perfectly.  Pages is unable to, and places the tilde to the right of the q (although if I place an a in between the q and ~, it combines the a with the tilde.  You can also select the tilde and a independently, kind of cool).</p>
      <p>I'm not sure that that's so much of an error as a warning.  To my knowledge, there is no standard way to encode glyph variants in documents in any of the go-between formats, eg, if I have a UTF-8 encoded plain text document, I can't actually define a glyph variant.  Some programs don't support them, so even if there were a way, they of course wouldn't be able to display it. </p>
      <p><em>«El futuro es una línea tan fina que apenas nos damos cuenta de pintarla nosotros mismos». (La Luz Oscura, por Javier Guerrero)</em></p>
