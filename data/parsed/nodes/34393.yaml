      <p>That's a great article on the difference between Apple and Microsoft rendering technologies. I have to admit that it's a little weird to see Apple's type renderer in a Windows context. It reminded me of the first time I installed linux on an old beige mac and was presented with a black screen full of ugly type on my Apple display. Weird.</p>
      <p>I will say, though, that as a long time Apple user, screen designer, and type designer, I can't stand looking at type on Windows. I can see how the green monospaced type crowd might like Windows type rendering better, though.</p>
      <p>I would argue about the "better for on screen reading" thing as well, but then this would devolve into an infamous typophile "readability" debate, where everyone cites the best evidence they have: what they personally like better. At any rate, crispness does not readability make.</p>
