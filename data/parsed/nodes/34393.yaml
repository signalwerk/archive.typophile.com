    html: |-
      <p>k.l., "As to the advice to better test the ClearType rasterizer with ClearType fonts … that would make a strange ‘comparison’, wouldn’t it?   ;-)"<br>
      I know it sounds like a strange idea, but that's because the CT fonts have less restrictive TT instructions in them. The point is that to evaluate optimal results, use fonts designed to give optimal results for each rasterizer. But because of the way tha Mac OS works, it doesn't much matter which font you use, there's no such thing as optimal tuning for the Mac.<br>
      It's true that if you instead wanted to test pure results, not optimized results, you should use fonts with no TT instructions.</p>
      <p>From a technical perspective, the Mac solution is really the problem. We've got different TrueType font engines here, but the Win rasterizer scales and renders type as one would expect from reading the TT (OT) specs, while the Mac rasterizer follows most of the TT (OT) specs, but virtually ignores a fairly critical section of the spec (Hint Instructions.)<br>
      I don't want to dredge up the old fight about whether the TT hint instruction set was a good idea (for the 12 or so of us who care ;), but technically, the Win engine follows the specs more closely, and is truer to a font developer's intentions, than the Mac engine.</p>
      <p>However that whole idea doesn't affect the real quality of display type. Shifts in hardware technology, and sociological changes in the way we read and process text over the last 10 years have really changed what the "optimal" way to render text is. </p>
      <p>I've gotten off topic here, but my real comment on the Verdana problems is that the TT instructions in the font were designed to specifically work in a 2-bit, black and white rendering mode. They suffer more than many other faces in some greyscale rendering situations.</p>
      <p>Jason C</p>
