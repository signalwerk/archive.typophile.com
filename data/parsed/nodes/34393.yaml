      <p>(Pardon me if I'm re-stating the obvious here) but I'd like to point out that Randy's problem with the PC screenshots he's provided are due to the TrueType Instructions in the Verdana font, not with ClearType as a rendering system.<br>
      The TrueType instructions are effectively not used by the Mac, so the result is closer to what you'd get by simply scaling the actual outlines, therefore it appears pretty bold. On the PC without ClearType, you see the effect of the TrueType instructions in the font, which for smaller sizes (below 20ppm) affect the weight greatly, in an attempt to make the font more legible. Cleartype makes use of some of the TrueType instructions, but overrides others, which is why Randy sees the effect as "slightly improved."</p>
      <p>This all boils down to the advice that Simon and hrant gave; for a better comparison, use the Cleartype fonts. What you really don't like about Verdana on the PC doesn't have much to do with the rendering system - you just don't like the TrueType instructions in the font. (I'll make no comment on whether I like them - for obvious reasons.)</p>
      <p>Jason C</p>
    html_clean: |-
