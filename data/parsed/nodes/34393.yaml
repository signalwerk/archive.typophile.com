      <p>And I'd rather bacon not be unhealthy. But it can't happen.</p>
      <p>WYSIWYG is a lie, any way you cut it. When it comes to display setting, it's a livable, generally convenient lie. When it comes to reading onscreen, it's a deadly -but sadly still convenient to some- lie. You don't have to rely on hinting to combat WYSIWYG (bitmaps anyone?) but you do have to rely on something besides a tarted up donkey with blinders.</p>
      <p>Yes, most type is not made for the screen. But: we should encourage more of it to be; and most of all let's not punish the ones that are. So the best rendering scheme would not enforce a one-size-fits-all fascism.</p>
      <p>hhp</p>
