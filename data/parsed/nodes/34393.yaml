      <p>I should add this no brainer, clear type is optimized for PC gamma and Quartz for Mac gamma. Effectively, this mean Mac type looks less fuzzy on a Mac, and PC type looks smoother on PC than it does on mac.</p>
      <p>Thus, none of the above comparisons are fair when viewed on one platform only.</p>
      <p>EDIT:<br>
