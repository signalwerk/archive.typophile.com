      <p>I suppose one of the things that I'll express as a potential caveat to your analysis - is in that I sense you're assuming the future of computing is on the desktop.</p>
      <p>With a continued penetration of 50% of all households in the US alone having a desktop in the home, I don't find those demographics encouraging toward development. But the mobile and wireless market poses an interesting occurrence -- having potential to break penetration once the paradigm shift occurs -- allowing the possibilities for concentration of type technologies being placed toward the newer paradigm. That's where we could see the most development impact moving forward, as the smaller realestate foot-print poses critical challenges in type rendering for both functionality and the aesthetic.</p>
      <p>(No one really wants a mobile device that makes their eyes bleed.)</p>
