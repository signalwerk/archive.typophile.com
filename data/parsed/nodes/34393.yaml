    html: |-
      <p>Sii, I would like to be able to spec 16 pt verdana bold. Eg headlines on a news site. It is not a problem that Arial 12px and 13px are 50% identical? I recognize your :-) And WRT showcase fonts, I would rather a rendering system not require any showcase magic to look good (though I applaud Microsoft's commitment to commisioning type).</p>
      <p>Hrant, how can you say Mac rendering is mediocre and leave no comment about CT when my example above shows PC results can be worse than mediocre?  If I ignore the horrid BOLDNESS of the M, the uber tight spacing of the ll and li combos as problems, then yes I am in denial. Also, I understand that cleartype is on by default in vista. It's too bad that won't matter for web designers until vista reaches a critical mass in a few years.</p>
      <p>That aside, I spent a little bit of time creating waterfalls. They are 10px-17px reg, bold and italic for arial, verdana, and georgia.</p>
      <p>Mac:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/waterfall_mac_4436.gif"></div><p></p>
      <p>PC - no clear type:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/waterfall_pc_noct_4439.gif"></div><p></p>
      <p>PC - clear type:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/waterfall_pc_ct_6182.gif"></div><p></p>
      <p>The good:<br>
      Both Mac and PC with clear Type look pretty darn good. PC's stregnth is 10-12px size. Mac's strength is larger sizes and consistency across the waterfall.</p>
      <p>The bad:<br>
      With PC-ct there are bad combinations you'd want to avoid 15px arial bold, 16px verdana bold, and there is more variation from the outlines even at large sizes. Mac is not as crisp as small sizes.</p>
      <p>The really bad:<br>
      While Mr. Mac and Mr. Clear Type are nice passengers, the person still driving teh bus is Mr. Shagnasty (PC without clear type).</p>
      <p>In my opinion:<br>
      Considering the pluses and minuses of both, my preference is still for Mac rendering. It shines even more when rendering fonts are not designed as "showcase" fonts (see the times comparison earlier). Fortunately, displays are increasing in resolution and today's headline sizes are tomorrows text sizes. Hardware to the rescue!</p>
      <p>R</p>
