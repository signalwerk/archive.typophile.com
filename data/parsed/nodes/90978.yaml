  html: |-
    <p>Can anybody tell me how to combine the 'Caron' with an 'E' in a font that does contain the accent but hasn't a glyph that combines the two? My keyboard is set to UK English and I am on a Mac.</p>
    <p>I have the same question for activating other glyphs and diacritics in the same font that contains them, but I don't know how to use them when typing.</p>
    <p>Cheers</p>
