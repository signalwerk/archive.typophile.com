      <p>Wow - a very cool font. I like it a lot. Beautiful, poetic and original. I am in the believe that typography has two purposes - one is everything about reading, and the other is about identity and/or personality – to help the designer express something. You little beauty is really personal, and I like to use it sometime.</p>
      <p>One thing however:<br>
      Have you tried making the "a" a little smaller? It could be mistaken for "o" as it is now.</p>
