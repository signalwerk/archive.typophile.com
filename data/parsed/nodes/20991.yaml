      <p>This is a fun concept, I'm curious to see how it evolves. My first thought was that the base letterforms are too geometric. The swashes stemming off look to be drawn with a different hand, more elegant than the heavy part of the glyph. Right now they seem like two separate parts rather than one organic face. Maybe that's what you are going for.</p>
      <p>I like how the letters interact with tighter kerning. If I used this type it would be in display settings, one or two words.</p>
