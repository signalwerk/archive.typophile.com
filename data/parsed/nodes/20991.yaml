      <p>My impression is that things are geting better. The base letter forms &amp; the curls seem to belong together more now.  There are still some problems in two areas that I want to suggest you look at. </p>
      <p>One is in the base forms themselves. For instance- the t is so tall it almost reads as an f. The a is still a bit more abstracted than I would like. Perhaps if the lower bubble was smaller that would help. Look after your letterforms a bit more &amp; consider some ways to make their legibility greater. You can always go back afterwards &amp; add the the curls. Also, it might be fun to have a face that the curls add to rather than just one face.</p>
      <p>The second issue is the way the letters interact next to each other. As things stand the interaction is a little too random. If you alter your base forms &amp; carefully consider your curl placement the parts can be made to fit together ( or overlap ) in a way that feels less random &amp; more organic. All the randomness is creating a level of background noise that hurts the fonts ability to be read.</p>
