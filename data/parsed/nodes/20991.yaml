    <p>So here is a new font that I’m working on, decided to show it off a little. So far I’m liking it, looking for suggestions and critique. Thanks. </p>
    <p>i know that i have to move "r" up, make "o" a little larger, maybe "i" and "l" longer and extend them a little below the baseline, looks like "y" is falling forward.. i would chop the tail off "s" but it looks way to good in "is"... well all of that will get done  tomorrow...</p>
    <p> <strong>UPDATE </strong></p>
    <p>Ok, so Im trying to finish my last year of college while working so I can't get to finish this font, for those of you who liked it, you can download lower case character set at:<br>
    <a href="http://www.akaboom.com/water/waterworldtop.ttf" title="www.akaboom.com/water/waterworldtop.ttf">www.akaboom.com/water/waterworldtop.ttf</a><br>
    and<br>
    <a href="http://www.akaboom.com/water/waterworldbottom.ttf" title="www.akaboom.com/water/waterworldbottom.ttf">www.akaboom.com/water/waterworldbottom.ttf</a><br>
    just copy paste in place the text and change one of the layers to one of the font variations and colors for best results.</p>
    <p>enjoy!</p>
