      <p>Coming along. I like how you've resolved the curls on some of these characters (the "a" is working better, and especially prefer this simpler "o"). Some characters still need work IMO: c, e, s, y, z stand out.</p>
      <p>I still wish the base forms were more "caligraphic" (don't know if this is correct term). Strokes need more thick-and-thin variation - you're doing it in some places, I think it needs more to avoid looking so tube-like. Hopefully, someone with more tyographic knowledge can advise you.</p>
      <p>The layering is a nice effect - adds some energy and movement. In fact if you really wanted to broaden the scope of this project, maybe you could make an alternate set with different curls to be used specifically for the purpose of ovelapping.</p>
