    date_raw: 14.Mar.2006 11.54am
    votes: null
    html: |-
      <p>Include them under the latn script and dflt language tags.</p>
      <p>Adobe’s practice in this regard is to duplicate all lookups across all script and language tags except for those that are intended to differ (e.g. locl feature lookups).</p>
