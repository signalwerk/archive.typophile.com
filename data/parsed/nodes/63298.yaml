    <p>Handcrafted Typophile Photo Albums on eBay</p>
    <p>For the past several months, my wife (of Tami Jo Studios, <a href="http://tamijo.com" title="http://tamijo.com">http://tamijo.com</a>) has been transforming the Typophile Film Fest 4 posters into some amazing lotus-fold photo albums. She’s just put them on to eBay, and is donating 10% of proceeds toward Typophile. </p>
    <p>Original poster design can be seen here: <a href="http://typophile.com/node/37243" title="http://typophile.com/node/37243">http://typophile.com/node/37243</a></p>
    <p>The albums open out from a 4.5” square to allow photos, drawings, or other images to be tipped-in inside. </p>
    <p></p><div class="imageWrap"><img src="/files/!BdIMNlg!2k~$(KGrHqEH-D0EquEbDjSjBK3gtWWhUg~~_12_5454.JPG"></div><p></p>
    <p>There’s only 7 of them. Get ’em while you can! </p>
    <p><a href="http://cgi.ebay.com/Typophile-Film-Festival-4-Handcrafted-Photo-Album_W0QQitemZ170397057004QQcmdZViewItemQQptZLH_DefaultDomain_0?hash=item27ac74bfec">Album One</a> | <a href="http://cgi.ebay.com/Typophile-Film-Festival-4-Handcrafted-Photo-Album_W0QQitemZ170397055975QQcmdZViewItemQQptZLH_DefaultDomain_0?hash=item27ac74bbe7">Album Two</a> | <a href="http://cgi.ebay.com/Typophile-Film-Festival-4-Handcrafted-Photo-Album_W0QQitemZ170397054535QQcmdZViewItemQQptZLH_DefaultDomain_0?hash=item27ac74b647">Album Three</a> | <a href="http://cgi.ebay.com/Typophile-Film-Festival-4-Handcrafted-Photo-Album_W0QQitemZ170397052995QQcmdZViewItemQQptZLH_DefaultDomain_0?hash=item27ac74b043">Album Four</a> | <a href="http://cgi.ebay.com/Typophile-Film-Festival-4-Handcrafted-Photo-Album_W0QQitemZ170397049673QQcmdZViewItemQQptZLH_DefaultDomain_0?hash=item27ac74a349">Album Five</a> | <a href="http://cgi.ebay.com/Typophile-Film-Festival-4-Handcrafted-Photo-Album_W0QQitemZ170397047944QQcmdZViewItemQQptZLH_DefaultDomain_0?hash=item27ac749c88">Album Six</a> | <a href="http://cgi.ebay.com/Typophile-Film-Festival-4-Handcrafted-Photo-Album_W0QQitemZ170397050674QQcmdZViewItemQQptZLH_DefaultDomain_0?hash=item27ac74a732">Album Seven</a></p>
    <p>It’s never too early for gift shopping, right? Post your best typographic gift finds for the season in this thread.</p>
