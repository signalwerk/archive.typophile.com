      <p>I agree with what the others have said, and I would also make the vertical rule the same height as the logo on the left. If you reduce the tracking on the right side, you can make those words bigger too, making them line up with the top and bottom of the left side and the rule. This will unify everything a little nicer.</p>
      <p> - Lex</p>
