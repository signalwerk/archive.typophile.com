      <p>Try ampersands instead of that small caps treatment for the 'AND's. </p>
      <p>The spacing between the '|' and the words on the right seems inconsistent between each iteration. I would also increase the amount of space between the '|' and the stuff on either side. </p>
      <p>The letter spacing in combination with the condensed face makes it look like a monospaced font. I might reduce the tracking a bit.</p>
      <p>--<br>
      <em>penn</em></p>
