      <p>I'd go for a lighter weight of type for the departmental names, whose stroke weight is near as possible to the heavy strokes of "TEXAS".</p>
      <p>I'd also thicken up the dividing rule a little.</p>
      <p>At the moment there's not a strong relationship between the left and right sides.</p>
