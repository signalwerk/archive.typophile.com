      <p>You're right about the logo on the left being beyond our control. I secretly find it hilarious that you find it "dated" since they just came out with it a few months ago as a "freshing" of the "old" logo which was only a couple of years old. You can see the old logo at the top of the library's current page: <a href="http://library.uta.edu/" title="http://library.uta.edu/">http://library.uta.edu/</a>. </p>
      <p>Thanks to all for the comments. Others are still welcome.</p>
