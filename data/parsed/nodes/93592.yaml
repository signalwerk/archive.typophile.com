    html: |-
      <p>That’s the cover of a book which reproduces ads from the 1960s at 100%, so it would be around 8½" x 11".<br>
      The kerning is in proportion to the size of type.<br>
      It was published in 1984, just about the end of the Tight-But-Not-Touching era.</p>
      <p>During the 1960s, American ad copy was written in a (feigned) friendly, second person singular, conversational style.<br>
      Headlines were set as if they were blow-ups of body text, to continue that casual, informal theme.<br>
      So: paragraph indent, ﬂush left, upper and lower case, like this from 1965:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/images65marlboro_4779.jpg"></div><br>
      The asymmetric shapes made by the text blocks are positioned dynamically in the layout, balanced against negative space, in the high modernist manner, creating a ﬂat “abstract” graphic on the surface of the page.<br>
      In comparison, all cap headlines are bossy and authoritative.<br>
      Easier to create a superﬁcially neat effect, but lacking the sophistication of the ’60s.<p></p>
