    html: <p>About the queerest bit of u/c typo I ever saw is in my old Borland (TP5, TC2, TDB1) manuals. The word 'chapter' ('appendix', 'part') is set all upper in ca. 10pt Avant Garde and letterspaced to fill the line. There is a full-width bar a line height or two below and right underneath that comes the identifier flush right in ca. 24pt Palatino. Reckon you can see it for yourselves if you snag one from Bitsavers or one of their mirror.</p>
