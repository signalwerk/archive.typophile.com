    html: |-
      <p>@Nick: Of course, those fast-food-marqee style signs are all caps because there's no place to put any descenders.</p>
      <p>@Etah: Research shows that when people read, they don't decode the text one letter at a time; they decode words, which they recognize by the distinctive contours formed by the ascenders and descenders. If I have copy that I really want my readers to decode (<em>Here's why my client's solution is the best!</em>), I'll use caps and lowercase. </p>
      <p>If the words serve less to convey information, and more as a badge or banner, I'm more apt to use all caps. </p>
      <p>Capitals are also very handy for large blocks of text that you want to <em>prevent</em> people from reading, such as software license agreements.</p>
