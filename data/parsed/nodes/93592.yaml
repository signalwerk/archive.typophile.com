      <p><em>I think the mad man who set that doesn't have too much on the typesetter for the library letter board. </em></p>
      <p>I think you’re missing the point.<br>
      There was a culture of this style, with subtleties that this ad plays to.<br>
      The orphans are intentional, creating dramatically asymmetric paragraph shapes which may be manipulated as part of the overall ﬂat graphic, in a way that ﬁlled-out paragraphs don’t.<br>
      In particular in this ad, which is all about vertical ﬂow (rifﬁng off the condensed type style of the brand name), “is” reads straight down to the adjacent “Come”, requiring no disruptive eye backtrack (regressive saccade?)<br>
      Continuing the ﬂow, the absence of a ﬁnal period references newspaper style, easing the reader’s passage into the body copy.</p>
      <p>Speaking of vertical ﬂow and Mad Men, the real deal:<br>
      <a href="http://www.georgelois.com/pages/milestones/mile.coldene.html" title="http://www.georgelois.com/pages/milestones/mile.coldene.html">http://www.georgelois.com/pages/milestones/mile.coldene.html</a></p>
      <p>Lois would have pissed on anything as lame as “At last. Something beautiful you can truly own.”<br>
      And still would.</p>
