      <p>Good graphic design isn't about making a layout beautiful. It's about finding an effective way to visually communicate a message on behalf of a client. </p>
      <p>Setting paragraphs of type in all caps is not a good idea in most cases since it's difficult to read, but none of the examples shown do that; they just show a few words in caps, which certainly is nothing new. You can find ads from the 1800s (and probably earlier too) that do the same thing. Is it good design? Depends on the ad.</p>
