      <p>Are you looking for a serif typeface or a sans serif typeface?</p>
      <p>Amiri uses Sebastian Kosch’s Crimson Text (a serif typeface) for its English glyphs:<br><a href="https://fonts.google.com/specimen/Crimson+Text">https://fonts.google.com/specimen/Crimson+Text</a></p>
      <p>Open Sans, Roboto, Lato, Raleway, and Source Sans Pro are some of the sans serif faces most commonly paired with Amiri:<br><a href="https://fonts.google.com/specimen/Amiri">https://fonts.google.com/specimen/Amiri</a></p>
