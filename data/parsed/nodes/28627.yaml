    html: |-
      <p>Hi<br>
      I have the following recommendations - to have a thoroughly rounded introduction to typography (first three form the Typographic Triumvirate):</p>
      <p>Elements of Typographic Style, Robert Bringhurst (3rd Ed.)<br>
      Letters of Credit, Walter Tracy.<br>
      Anatomy of a Typeface, Alexander Lawson</p>
      <p>+</p>
      <p>Short History of the Printed Word, Chappell &amp; BRINGHURST (Rev ed.) - brilliant intro' to the history of type<br>
      The Complete Manual of Typography, James Felici (2003) - good accompaniment to 'Elements'.<br>
      Making &amp; Breaking The Grid: A Layout Design Workshop, Timothy Samara (2003) – good intro' to grids<br>
      Type &amp; Typography, Andrew Haslam &amp; Phil Baines - well rounded book with invaluable glossaries. </p>
      <p>I have more suggestions – just shout if you'd like them.<br>
      But, if I had to recommend just one it would be the very first text - Elements of Typographic Style.</p>
    html_clean: |-
