    date_raw: 8 Sep 2006 — 10:22am
    votes: null
    html: |-
      <p>About the small caps: I did apply auto bold at one point, but also did a lot of hand editing, esp. of the serifs. This is because I didn't like the original small caps at all: the serifs seemed to me way too weak compared to the stems. (The contrast was larger then in the full caps, and I didn't like that.)</p>
      <p>I admit that my small caps look a bit mechanical, lacking grace and refinement. For example, the vertical stems have more or less even widths, whereas they should be a bit thinner at the middle, like in the caps. But as they were only going to be used at text sizes, I left them like that. In fact, given the poor resolution and hinting, it might have better this way.</p>
      <p>And yes, the small caps may also be a bit too heavy. I wanted them to have loose spacing, and figured that even color therefore required them to relatively bold.</p>
      <p>The italic small caps are a fairly quick addition. I did not spend much time editing them (after the autoslant) because their frequency in the text was very small.</p>
      <p><cite>BTW, I like the nut fractions!</cite></p>
      <p>I didn't know this kind of fractions were called "nut" fractions! Yeah, for some reason, I wanted to make them like this.</p>
      <p>Olli</p>
