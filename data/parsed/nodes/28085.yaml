      <p>RE: Smallcaps<br>
      Hard to tell without a text setting, but they look too dark for the regular weight. It looks like you applied an auto *bold* to them to compensate for the scaling (the right idea, just a little heavy). I say this because it has lost stroke contrast, or sparkle, leaving them a little dull compared to the originals (look at the P for example). Auto bold always does this. It is very very minor in this case. </p>
      <p>RE: 3<br>
      Yours is very credible. Definitely fits with the set. This is a matter of taste.</p>
      <p>BTW, I like the nut fractions!</p>
