    <p>OK, Dear Typophiles, I decided I can’t delay this any longer. Here is a PDF specimen of the changes I made to ITC Mendoza a couple of years ago, as my first exercise in the use of Fontographer. (I’m now learning FontLab.)</p>
    <p>I used the font to set my thesis in phonetics—hence the added <a href="https://web.archive.org/web/20150124081556/http://www.arts.gla.ac.uk/IPA/ipachart.html" rel="nofollow">IPA</a> and mathematical glyphs.</p>
    <p>What do you think? Please be honest; I know I have a lot to learn (had even more when doing this). I think it’s best for me not to comment on the details in advance.</p>
    <p>The hinting is bad Fog autohinting, so the glyphs may look bad at small sizes on the screen, and even when printed on a laser printer. The thesis was actually output on a Xerox DocuTech (at 600 dpi); it was far from offset quality, but the distortions weren’t as bad as on my Brother laser printer (600 dpi, with resolution enhancement).</p>
    <p>Thanks in advance (though it may take a while before I return to work on this font).</p>
    <p>Olli</p>
