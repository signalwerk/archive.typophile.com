    html: |-
      <p>Thank you so much, Randy!</p>
      <p><cite>Note: there may be EULA issues with the modification</cite></p>
      <p>I am aware this. ITC said it's OK for me to use the modified version in keeping with the original license. I hope this EULA issue hasn't scared people away.</p>
      <p><cite>You might talk to ITC about selling it to them as an extension.</cite></p>
      <p>Oh, it (the IPA) is not good enough for that--and it's very far from complete, in terms of glyph coverage.</p>
      <p><cite>I do prefer the original 3. It is very odd I’ll admit, but I think it’s odd in keeping with the rest of the font.</cite></p>
      <p>Yes, my 3 isn't very good, I knew that right away. And later I've sort of started to like the original, though it still looks too big to me. Perhaps the face is a bit too quirky for a scientific (thought not so math-heavy) text in the first place; but I wanted to give the text a "humanist" touch.</p>
      <p><cite>Also, it is customary for the small caps to be slightly larger than the x height.</cite></p>
      <p>I guess it was my preference at the time for the small caps to be the same height as the old-style numerals, i.e. very slightly (about 10/1000 em) taller than the lowercase x height (though part of it was just keeping the SC height as it was). For one thing, taller small caps would've looked odd in combination with the numerals, as in JH11 (with small caps for JH). I have to admit, though, that the small caps now look a bit small to me in ordinary acronyms.</p>
      <p>Any other comments on the small caps?</p>
      <p>Olli</p>
