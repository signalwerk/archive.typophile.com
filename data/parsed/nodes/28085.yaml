      <p>Your modifications look nice. Sometimes great fonts like Mendoza (one of my favorites) lack some attention to detail and flair beyond glyphs that get used 90% of the time (such as your %). I can't speak to the IPA as I'm not versed in it, but everything else seems good.</p>
      <p>Note: there may be EULA issues with the modification, but I don't know about ITC specifically. Let's not sidetrack the discussion to EULA's, but I did want to mention it.</p>
      <p>You might talk to ITC about selling it to them as an extension.</p>
      <p>EDIT: I do prefer the original 3. It is very odd I'll admit, but I think it's odd in keeping with the rest of the font. There is unusual tension and weighting throughout. This is, to me, a signature of Mendoza. But maybe too quirky for heavy math. Also, it is customary for the small caps to be slightly larger than the x height. Was this just preference?</p>
      <p>R</p>
