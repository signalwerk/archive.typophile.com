    html: |-
      <p>Design ’certificates’...especially web design, are more temp-agency centric than design-agency centric.</p>
      <p>That said, RISD carries a lot of cache, so maybe that’s not all that bad.</p>
      <p>The key though is getting the graphic design background. The technology part will come either on it’s own (your own ambition) or later if you decide to focus solely on that.</p>
      <p>One advantage of the web industry, in general, is that they haven’t bee as hung up on degrees as the more traditional print/ad agency world.</p>
