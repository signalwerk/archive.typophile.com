    html: |-
      <p>I originally got into design through an interest in playing with Photoshop and building webpages for fun. After a year or so at a couple entry level jobs I decided that if I wanted to continue this as a serious career (which I did) I should consider getting some formal schooling (which I did).</p>
      <p>I found 2 things as a second-degree student, First, already having a degree (and being 6 or 7 years older than “true” freshmen) I had a much greater sense of what I wanted to get out of my time at school and felt like I approached my classes with much more intensity than I had with my original (English) degree. Second, 3 years into a 4 year degree program I decided that I had learned enough (and spent enough :D ) to start working.</p>
      <p>I certainly don’t think degrees are useless, but if you already have a degree, work experience, and a strong idea of what you want to do (strong enough to leave your current career to start something new) I think you have some flexibility in how to approach a design education - that is, what you think might work best for you.</p>
      <p>Connal</p>
