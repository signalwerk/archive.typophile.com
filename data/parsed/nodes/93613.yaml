    <p>I used this font for the logo for my website, (I am an artist). And I seem to have lost all information in a hard drive crash about what font I used and my backup files and everything. Any help would be great!</p>
    <p>I know that when choosing the font I was looking for something that resembled a late 1890's/early 1900's French style font. And I MAY have gotten the font from dafont.com, although I cannot seem to find it browsing around on their website. </p>
    <p>Here is a link to my website where my logo is clearly visible in the upper left of the page:</p>
    <p><a class="freelinking external" href="http://www.thelumierebrothers.com" rel="nofollow">http://www.thelumierebrothers.com</a></p>
