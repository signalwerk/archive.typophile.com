      <p>Adobe apps need/use different naming then Word for example, it's quite tricky.<br>
      There have been a couple of good threads on naming opentype families on the forums, if you search for 'Font Family Naming in Fontlab', you should find what you need. For example <a href="http://typophile.com/node/31118" rel="nofollow">this thread</a>, with replies from Adam Twardoch, who works at Fontlab Ltd. :) Those are mostly about OTF-naming. I'm not sure if it's different for OT-TT's. But maybe it's of any use.</p>
