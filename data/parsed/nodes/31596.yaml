      <p>Well, I make OTF fonts in Fontlab all the time, and can use them in Adobe apps on PC without any problems. So it should work.<br>
      But the Windows font-directory is quite.. odd. Sometimes it helps to delete the font, and install it again. And also make sure the Adobe apps are not running while installing the fonts. Normally that shouldn't matter, but unfortunately it does. For me, anyway. :)</p>
