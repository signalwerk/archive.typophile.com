    <p>Hi all,</p>
    <p>I have a TT opentype family that I've generated, which works fine on the mac but when trying it on the PC in Indesign CS 2 it doesn't. I can see the name in the font list but when I select it the font doesn't change and that font style is removed from the font list. I know this could be any number of things, but are there thing I should be checking when I generate the fonts. I've generated the PS font family which works fine on both platforms.</p>
    <p>c.</p>
