      <p>@twardoch How about the transferring of data from a spreadsheet to FontLab?</p>
      <p>I am taking a long and convoluted approach at the moment - is there a better way?</p>
      <p>My process now is:<br>
      I can copy data from multiple columns and in a text editor I inset underscores and = to delimitate Tabs. (This prevents the creation of multiple glyph boxes for the same character).</p>
      <p><code>LATIN_CAPITAL_LETTER_D_WITH_SMALL_LETTER_Z_WITH_CARON=Dzcaron=01C5</code></p>
      <p>I create glyphs by 'Generate Glyphs' and inserting my list of strings (as above).</p>
      <p>This gives me a chance to then sort out glyph by glyph in the &gt;'Rename Glyph' window/panel, by cutting and pasting the various bits of info from the name field into the other fields.</p>
      <p>It would be great if speadsheet data could automatically <code>pass</code> to separate glyphs with the codes and names going to the correct field without user intervention...</p>
      <p>Another question would also be that do prefixes and postfixes allow for this in any way?</p>
