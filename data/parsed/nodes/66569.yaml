    html: |-
      <p>The U+ convention is used in discussing Unicode characters in order to identify that these are Unicode characters and not e.g. GB 18030 or some other encoding. Since the Unicode encoding field in the FontLab glyph properties dialogue is, by definition, Unicode, there is no need for the U+ prefix in this context, although I agree that it would be nice if a codepoint entered as U+0179 were recognised.</p>
      <p>In spreadsheets, you can use the 0x prefix, which is recognised by FontLab, e.g. 0x0179.</p>
