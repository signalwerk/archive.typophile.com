  html: |-
    <p>I am looking for some clarity on best practice for the naming and use of UNICODE codes.</p>
    <p>When reading Typophile's informative posts, "those who know" prifix any quotation of a unicode to be assigned to a glyph with the prefix U+ giving a value like 'U+0000' (also as used in Adobe Glyph List) however when looking at font file from Apple and Adobe and accessing their UNICODE via &gt;Rename Glyph in FontLab there is no U+ prefix there just the (4 alphanumerics). Also when clicking the magic Jewel in FontLab - no U+ appears.</p>
    <p>Note:<br>
    U+ certainly assists when compiling a spreadsheet so that the program doesn't automatically read as a number and delete preceeding zero in a code.</p>
    <p>Also by prefixing a Unicode by U+ makes the communication of data in a forum clear and easy.</p>
    <p>Q. Does coding assignation break if the U+ is assigned in any or all cases in FonLab?</p>
    <p>Q. Is there a best practice. Is anyone suggesting to include the U+ when assigning Unicodes within font editing software?</p>
    <p>Thanks,</p>
    <p>Michael Hernan</p>
