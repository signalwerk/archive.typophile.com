      <p>I have tried a couple of variations using prefixes.</p>
      <p>@Johns suggestion of the 0x prefix didn't seem to do anything?</p>
      <p>Using uni prifix does populate the fields but kills the name of the glyph preceding the unicode. i.e the name of the glyph is replaced by <code>uni0179</code></p>
      <p>This puts me half way to an acceptable method but also defeats the whole point of being able to inset a name to a glyph.</p>
      <p>I have just noticed that where I have 3 bits of information: Written_Name Lettercode Unicode... the Generate Glyph proceedure noted above cuts off the first part (Written Name).</p>
      <p>This is good as there are only 2 boxes, but surprising nonetheless.</p>
      <p>I will wait for wisdom...</p>
