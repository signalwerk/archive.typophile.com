      <p>I have a Swedish edition of <em>De architectura</em> by roman architect Vitruvius from 1989, set in Monotype Van Dijck 12/13 by Geuze &amp; Co's Drukkerij in Dordrercht, the Netherlands.<br>
      I tried to google it but couldn't find a web page for the company. So either it's gone or some dutch friend here at Typophile could perhaps tell us if it's still around.</p>
      <p>The book is/looks awesome.</p>
