      <pre> Fury said to a mouse,
                       That he met in the
                              house, 'Let us
                                 both go to law:
                                  I will prosecute
                                you.-- Come, I'll
                               take no denial;
                             We must have
                           a trial: For
                         really this
                       morning I've
                     nothing to do.'
                         Said the mouse
                               to the cur,
                                 'Such a trial,
                                    dear Sir, With
                                        no jury or
                                      judge, would
                                     be wasting
                                 our breath.'
                              'I'll be
                         judge, I'll
                       be jury,'
                     Said cunning
                   old Fury:
                      'I'll try
                        the whole
                          cause, and
                              condemn
                                  you
                                    to
                                     death.'
      </pre><p>
       Lewis Carroll -- The Mouse's Tale</p>
