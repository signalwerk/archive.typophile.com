      <p>As a type designer who does make a living at this I agree with Joe in many ways. The primary thing I am interested in is being paid for the work I  do and the fonts I license. Creating custom fonts for branding that allows web embedding seems like a no brainer to me. Custom font solutions have always been sold on two levels, both equal. 1. Unique type for the brand 2. Unfettered licensing restrictions.</p>
      <p>I have no trouble with fonts being embedded I only ask for a modicum of protection. 99% of the consumers of web sites have no idea how web sites are delivered, even a @fontface font would be safe with these users. There are those nasty few who do go to great lengths to pirate, but  wonder how much their impact really is.</p>
      <p>I talked to my attorney about allowing some sort of web embedding (coming soon in our new EULA and website) and his response was to strongly suggest that I formally copyright the font software with the USPTO. Doing so allows one to sue for both damages and costs, and makes it a little easier to go after blatant commercial infringement</p>
