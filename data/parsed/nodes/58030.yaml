      <p>"Every major brand understands this."</p>
      <p>To play devil's advocate (for the sake of discussion):</p>
      <p>In the 10+ years of web publishing we've had thus far, rarely has the lack of custom font selection been seen as the major hindrance to the success or lack thereof of a particular web site by those of us that build them or use them. </p>
      <p>I think we web designers would be happy for an easy solution, but we'll keep on building web sites even if one doesn't materialize. At this point, it's a nice bonus rather than any sort of necessity.</p>
      <p>Of course, that doesn't change the intent of your message...to encourage more progressive font licensing to accommodate the web...which I agree with.  </p>
      <p>As for the NYTimes reader, it's definitely neat and looks great. However, PDF embedding, Flash Paper, now Air...rarely have the 'it's like print on your screen' concept Adobe has always pushed really ever stuck enough to make any dent in HTML. However, potentially the advent of new devices (iPhone, Kindle) will finally provide a surface for it to stick to more permanently.</p>
