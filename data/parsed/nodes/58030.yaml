    html: |-
      <p>Picking a "web-safe" font is the modern analogue of the decades ago typewriter and early desktop printing dilemma: "You can have any font you want, as long as it's Courier." Now there are are a dozen choices, which isn't all that much better since it basically reduces to Times New Roman or Arial.</p>
      <p>There's no technological reason why viewing a website in a browser shouldn't be like viewing a printed page or PDF, custom fonts included. The embedding a font in an image workaround should be a thing of the past.</p>
