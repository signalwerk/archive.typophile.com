    html: |-
      <p>The Times Reader does have very nice on-screen type.</p>
      <p>As an application, though, I'm still kind of scratching my head a bit. OK, it reads like the paper version. But it's more cumbersome than paper and a lot slower and smaller. </p>
      <p>I'm not yet sold on print-newspaper column layouts making a whole lot of sense on my laptop screen. </p>
      <p>I like it, it's neat, I hope it sticks around, but I don't think the Times Reader will be replacing HTML anymore than PDFs or Flash did.</p>
      <p>Which, I suppose, is more of an argument for everyone to figure out how to best tackle @font-face.</p>
