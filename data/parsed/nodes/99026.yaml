      <p>Many architects and designers associated to the "Amsterdamse School" movement had a keen interest in lettering and typography. The facades, bridges and objects designed by them were covered by interesting 'architect letters'. In "Dutch Type" by Jan Middendorp a couple of chapters explore this tradition.<br>
      There is also a book called "Wendingen" over the magazine this avant-garde published were you will find interesting examples of their letterings.</p>
