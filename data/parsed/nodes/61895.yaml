    <p>Hello,<br>
    After downloading hundreds of fonts, I keep coming across two issues:<br>
    #1.  The list gets long, and programs take longer to load that access the font library.  What can you do about this?  I seen someone refer to suitcase fusion 2, briefly I seen make font temporarily available, so do these types of programs keep the list small until you need them?</p>
    <p>#2.  There are certain fonts that halt the scrolling of the CS# suite(ps/ai/fw), I resorted to removing those fonts from the system.  Mangal, Latha, etc all would not render for the programs and stop the scrolling with wheel mouse with highlighted text.  Though, that probably is not the best way to pick fonts.  Is removing those fonts the best option, and what is the best way to pick fonts to see how they work for logos besides scrolling the list of hundreds?</p>
    <p>Thanks!</p>
