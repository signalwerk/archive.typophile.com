      <p>Most reasonably good font managers offer two basic options: browsing through fonts on disk, rather than just installed ones, and customizing sample text.</p>
      <p>I wrote a FreeType based proggy myself, just to do this (viewing sample text in any font, not managing them); but then again, that’s not for everyone to do.</p>
      <p>It’s funny you say that “Mangal, Latha, etc” will not ’render’ for CS programs. Do you even know what those fonts are meant for?</p>
