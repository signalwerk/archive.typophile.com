      <p>Thanks for the additional info. Your layout "A" showing all 4 phrases on one poster is different than I expected; I thought it would be a series of posters and each would contain 1 phrase.</p>
      <p>It might be stronger to have one phrase per poster, so one is focused on love, one on service, etc.</p>
      <p>Regarding VistaPrint, I've used them for some low-budget projects. They are focused on doing things quickly and cheaply; you aren't going to get top quality. But the things they've printed for me came out okay considering the price. When you're ready I'd suggest having them print just one first so  you make make sure the quality is good enough before they print all of them.</p>
