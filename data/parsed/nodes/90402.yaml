      <p>Ah, what about this:</p>
      <p>- You make crosses with each pair of words.<br>
      - For the first two you use the "e" as a pivot; for the<br>
      third and fourth you use the "o". And you can make<br>
      the last one special by flipping its directionality.<br>
      - You can make free-form crosses by using normally-<br>
      proportioned letterforms; or you might actually be<br>
      able to pull off traditionally-proportioned crosses<br>
      by -very judiciously- distorting the letters.</p>
      <p>Would that be awesome, or would that be awesome?</p>
      <p>hhp</p>
