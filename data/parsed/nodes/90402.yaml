      <p>These are some really great ideas. I am so grateful for your input. Here are my notes:</p>
      <p>tmac: About the typeface The Colour Grey…I love the idea of the combined fonts to create an overprint.  I will investigate some thing like that, but as Nick Shinn said, it might be too conceptual. Thanks for your input.</p>
      <p>grant: Crosses would seem to work for each pair of words since the same word "together" is used.  I am not sure if I want to use crosses though.  I would like to avoid stereotypical symbols.  The idea of the posters is to inspire, I think through clever letter treatment and arrangements this could be achieved…but you are on the right track.  I love the idea of tilting some of the vowels, though. Thanks for your input.</p>
      <p>JamesM: Good question about the poster sizes…I did neglect to mention that. I am still researching who will print these, because the church is on a limited budget I was thinking banner sizes maybe from Vistaprint: <a href="http://www.vistaprint.com/custom-banners.aspx?txi=154&amp;xnid=LeftNav154_153_131&amp;xnav=LeftItem" title="http://www.vistaprint.com/custom-banners.aspx?txi=154&amp;xnid=LeftNav154_153_131&amp;xnav=LeftItem">http://www.vistaprint.com/custom-banners.aspx?txi=154&amp;xnid=LeftNav154_15...</a>. The sizes are: 3' x 1.6', 4' x 2.5', 6' x 2.5', 8' x 2.5'.  Poster sizes are too small: <a href="http://www.vistaprint.com/posters/product-page.aspx?txi=157&amp;xnid=LeftNav157_153_131&amp;xnav=LeftItem" title="http://www.vistaprint.com/posters/product-page.aspx?txi=157&amp;xnid=LeftNav157_153_131&amp;xnav=LeftItem">http://www.vistaprint.com/posters/product-page.aspx?txi=157&amp;xnid=LeftNav...</a>. About the graphic, picture or scene…I agree something would add interest and support the message.  I am not sure yet what to do with regards to non-type options. Stained glass "nod" might be a clever way to tie the poster series together. Thanks for your input.</p>
      <p>Nick Shinn: Great suggestions of monogram type stuff…which might work well for this series of posters…but some other ones might not work because there are more words to fit into the design. Now you have given me some great material for researching further, Thanks for your input.</p>
      <p>5star: I love that you used together once…and the subtle smile in one circle is clever.  I am not sure the splatter paint works, but I can see where you are going. Thanks for your input.</p>
