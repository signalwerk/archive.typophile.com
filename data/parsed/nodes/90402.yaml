      <p>@dightondesign: I would begin by complementing you on your use of visual rhetoric in your first attempt (grey &amp; sans) ie: many different things coming together to make a whole, unity &amp;c. I would then ask you you explain your reasoning behind:</p>
      <p>a) the choice of colour<br>
      b) the choice of font<br>
      c) the choice of dimensions</p>
      <p>Lastly, I say “OK, that’s one idea, now put it aside and do a 180°.” Too often I see students get stuck on a single concept and push it around for days. You’re done with this one. Stop, and come up with another. Do this 100 times. In one day. On paper.</p>
