    html: |-
      <p>Frode, thanks a lot for the link to that very interesting article. It strongly supports group interaction, and gives very interesting conditions under which they work. </p>
      <p>I think the article's criticism of the original 'Brainstorming' idea is somewhat off the mark, though. That is because, contrary to what he says, it doesn't prevent criticism. It just separates the brainstorming and criticism phases. So the tests he cites don't really critique the original idea, at least as he reports them. </p>
      <p>The specific test he reports in which separated individuals did better is what I would call a 'puzzle' rather than a problem. It has very limited, well defined boundaries and solution. To me brainstorming is most important when the situation is more unclear and fluid and needs conceptual definition. </p>
      <p>I think it is also possible that in art, having an individual's vision guiding the process, with others' critical input in many cases is better than a strictly group process. The whole question what group process is best for what kind of problem is really interesting, to me at any rate. </p>
      <p>On Fran's brief, the main thing I would urge is to look for a custom lettering solution rather than a type solution. The Rudolph Koch work has a totally different feel from the Sister Corita work, but what they have in common is that they are custom lettering—and wonderful.</p>
    html_clean: |-
