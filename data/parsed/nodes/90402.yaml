    html: |-
      <p>frode frank: Great article. Thanks for sharing. </p>
      <p>My aim is that by us brainstorming yet knowing that debating or criticizing the concepts presented is a part of this process. I promise, by asking for input does not mean that I shut my brain off and cease to think creatively. </p>
      <p>I am a freelance designer that often is paid to do business collateral material… however with this project I embraced the opportunity (for no charge to the church for the design) with the hopes that other fellow designers could help me.  I found once I graduated, the open criticism of work went away... unless they were signing the check...Ha! I really missed that. I had the benefit of local, fellow collaborators. </p>
      <p>I see this forum as the first layer of predictability, ie. green for grass and blue for ocean. Errant answers are okay with me if they get me to think outside the box…to be "fresh, lively, work with no boundaries!"  I am willing to offer criticism and we, here, should accept it. </p>
      <p>A great example of how criticism improves art is Stephen Sondheim's criticism of this student: <a href="http://youtu.be/8-VXXZLh2a0" title="http://youtu.be/8-VXXZLh2a0">http://youtu.be/8-VXXZLh2a0</a> or these students: <a href="http://youtu.be/DBCVaFqGJwg" title="http://youtu.be/DBCVaFqGJwg">http://youtu.be/DBCVaFqGJwg</a>. I love his subtle suggestions and the difference it makes in the end result. </p>
      <p>Let's make this forum "Seeking creative ideas for a typographic poster series" a creative space string; the Building 20 of Typophile where we mix and mingle ideas. I am hoping that here you all can extract the best from me for this project. You have already been helpful.</p>
    html_clean: |-
