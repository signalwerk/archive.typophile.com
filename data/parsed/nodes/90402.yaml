    <p>Seeking creative ideas for a typographic poster series. A local church wants to display positive messages in poster format around it's large auditorium.</p>
    <p>They desire a strong typographic approach, not a graphic, picture or scene.</p>
    <p>This would be one of the poster series/themes:<br>
    Learn Together<br>
    Serve Together<br>
    Love Together<br>
    Worship Together<br>
    _______________</p>
    <p>Any ideas?</p>
