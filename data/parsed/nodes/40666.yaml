  html: |-
    <p>Hello all,</p>
    <p>I am looking for some good alternatives to <strong>Tarzana Wide Bold Italic</strong>, which I like for its overall round feel and softness. Having said that, I'd like to stay away from anything that has too much of a tech-y feel to it (ie. Neo Sans, Apex New etc).<br>
    Some quirks in the design are nice but not a must.</p>
    <p>Thanks in advance,</p>
    <p>Seb</p>
