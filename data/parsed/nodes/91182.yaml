    html: |-
      <p>Panose doesn’t appear to differentiate between figurative and non figurative fill.</p>
      <p>Although many patterns are representational, no pattern can be truly figurative, because nature does not repeat itself with such regularity.</p>
      <p>Now, with OpenType, the trick is to make the fill in repeated glyphs non-identical. Dunwich and CanadaType have produced such fonts, in the distressed mode, IIRC.</p>
