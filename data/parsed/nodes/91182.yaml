    <p>These fonts that have "graphics," for lack of a better term, inside the forms.  There's probably thousands of "distressed" fonts by now, which I would think would fit in this catagory.  And they get fanicer than that too, like this one that has electricity inside it:</p>
    <p><a href="http://www.dafont.com/electrical.font" title="http://www.dafont.com/electrical.font">http://www.dafont.com/electrical.font</a></p>
    <p> or this one which has picures of skyscapers at night:</p>
    <p><a href="http://www.dafont.com/urban-jungle.font" title="http://www.dafont.com/urban-jungle.font">http://www.dafont.com/urban-jungle.font</a></p>
    <p> what to call these things?</p>
