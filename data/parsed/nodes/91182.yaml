      <p>Not figurative.<br>
      The Electrical font clearly belongs to the sans category, at first hand.<br>
      At second hand: the additional feature in this case I would adress as *a graphic modification*. As is e.g. shadowing or outline display.<br>
      In the established categorization schemes there is, unfortunately, no means to accomodate such aspects of fonts.</p>
