    <p>Hi not sure if its ok to post two at same time. Any ideas on either would be great. Looking for an alternative to compacta or helvetica compressed.</p>
    <p>1) BasimPastillen.png</p>
    <p>First reads "Basim Pastillen" from a book called "Sans Serif: The Ultimate Sourcebook of Classic and Contemporary Sans Serif Typography" </p>
    <p>It is credited as being from a Berthold Foundry catalogue. Does not specify which face it is though.</p>
    <p>2) KunstHalle.png</p>
    <p>From book about Swiss Graphic Design. The origins and growth of an international style. Page 214. Poster for Sculpture Exhibition by Armin Hoffman 1958.</p>
    <p>Might be Helvetica compressed or something but not quite sure.</p>
    <p>many thanks<br>
    smallprint</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/BasimPastillen_4193.png"></div><p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Kunsthalle_4639.png"></div><p></p>
