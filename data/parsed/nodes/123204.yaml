      <p>Your pictures mostly show conventional kerned type, except in the case of the capital TA, were we see mortised type.</p>
      <p>I'm saying that conventional kerned type was recognized historically as being awfully fragile.</p>
      <p>One way to deal with it would be simply to make the "letter" part of the type deeper, and the "block" part of the type shallower - that wouldn't change the nature of the kern, only the proportions of the type body, but it would make the kern tougher.</p>
      <p>Yes, though, the "letter" still does have a bit of a base on it that's above shoulder height. But I'm suggesting drastically thickening that base and lowering that shoulder.</p>
