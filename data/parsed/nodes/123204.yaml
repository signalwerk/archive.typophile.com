      <p>I see what you mean. I should have read more carefully.</p>
      <p>Just speculation, but could these mortised bodies be a bit awkward in the sense that they might need to be cast to fit specific letter combinations? The size and shape of the notch needed for, say, a <em>TA</em> might be different from  a <em>T—</em>. In other words, it might be just as efficient and less troublesome to cast these particular pairings into a single body (a ligature, of sorts, I suppose).</p>
      <p>Also since kerns were mostly reserved for display sizes where even spacing throughout the line of type would be most noticeable, slug bodies that fit together a bit like jigsaw puzzle pieces might not work with the usual quad spacers.</p>
      <p>Again, though, just speculation. I really have no idea.</p>
