      <p>I am full of obsolete inventions.</p>
      <p>Back before laser printers, mainframe computers used big line printers to produce lots of output on paper quickly. Some used a rotating drum, with all the characters provided repeated at each character position, with a hammer at each character position forcing the paper and a ribbon against the raised character.</p>
      <p>Others used a means of moving the characters across the page, so that only one (or a few, since the width of the page would be 132 characters, while usually 64 different characters or less could be printed - but in this case, unlike the drum printer, the characters were often spaced apart by more than the size of a column on the page) copy of each character would be needed.</p>
      <p>Of these printers, some used a flexible band, some used a chain of linked slugs with characters, and others used a print train where the hammer pushed a slug that could move forwards to the paper.</p>
      <p>If the hammer hit at a slightly wrong time, for a drum paper the line was wavy, with letters displaced up and down; for one of these printers, the character would be moved to the right or left.</p>
      <p>Well, the thought struck me that this could be exploited, and a line printer could be made (with extra-wide hammers that would have to be able to be displaced horizontally into more than one position) that could do proportional spacing. Perhaps only crudely, like an IBM Executive typewriter.</p>
      <p>And as it happened, IBM made a line printer that moved the characters horizontally, but which used a solid bar with the characters rather than a band or belt or train.</p>
      <p>That gave me the idea of using a print drum that moved horizontally to present each character to each print position for printing, and which rotated to make a different character set available.</p>
      <p>An impact line printer that could print in Chinese? Along with doing, say, four-line mathematics?</p>
