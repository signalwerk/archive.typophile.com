      <p>I guess before letterpress became a more revered form of art, foundries were just too lazy or didn’t want to spend more time and energy producing kerned type. I’ve seen wood type being kerned by saws, but rarely with metal text faces. I’ve seen metal initials being kerned though.</p>
      <p>Or you could cast the letterform out of the face. ATF Garamont I worked with has its italic /f letterform protrude out of the rectangular face. That’s extra annoyance in the composing stick because you have to carefully sneak other letters under, but the /f is definitely kerned more in.</p>
