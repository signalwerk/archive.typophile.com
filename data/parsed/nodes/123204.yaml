    <p>A thought struck me today; during the era of hot metal type, why is it that no one ever invented the following -</p>
    <p>Since the kerns for letters like j and Q in some typefaces are very fragile, why couldn't they have been made more durable by a strategem like the following:</p>
    <p>In the area of a type slug below the baseline, for characters without descenders, cut a groove into the shoulder of the type, or lower the shoulder, so that there is room to put a reinforcing base below kerns.</p>
    <p>Or simply make the shoulder lower everywhere, so that the part of the type that is in the shape of the particular letter is deeper and hence stronger.</p>
    <p>In the case of letters with descenders that are on only one side of the letter, like p and q, the groove or lowering of the shoulder should still be present on the side the descender does not occupy.</p>
