    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Sildetas-Poster-Main_3487.png"></div><div class="imageWrap"><img src="http://typophile.com/files/Sildetas-Poster-OTF_6095.png"></div><div class="imageWrap"><img src="http://typophile.com/files/sildetas-Poster-Text_5702.png"></div><p></p>
    <p>Sildetas was conceived as non-connected, high-contrast and ultra heavy script, as best exemplified by the Black weight. However, it was too much of a temptation to design a hairline variant, and this exploration gave the family’s lighter weights an elegant, graceful feel. The script was modified further to use connected letterforms as the primary glyphs. With its unique swirled ball terminals, this versatile script draws immediate attention. The face glides and flows across the page and the swirling ball terminals provide an interesting diversion to the flow. The lighter weights have an almost spencerian look.<br>
    Sildetas includes six weights and is a very unique script face. Lighter weights can be used for elegant invitiations. Sildetas can get the job done for many unique design tasks.</p>
    <p>Sildetas includes many useful OpenType features, including a set of non-connecting and titling alternates, ligatures, and two types of end swashes. Opentype features include simplified swashed stylistic alternates without ball terminals, swash endings, ending contextual alternates, discretionary ligatures, ligatures and five different stylistic sets filled with alternates. In total, there are over 60 alternate letterforms.</p>
    <p>OpenType-capable applications such as Quark or the Adobe suite can take full advantage of the automatically replacing ligatures and alternates. This family also includes the glyphs to support a wide range of languages.</p>
    <p><a class="freelinking external" href="http://new.myfonts.com/fonts/insigne/sildetas/" rel="nofollow">Sildetas is 33% off for a limited time! </a></p>
