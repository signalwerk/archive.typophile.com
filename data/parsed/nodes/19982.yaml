      <p><strong>I feel like, if a company was interested enough in Bauer House, they would say, “This is a great design! We’ll take care of the tweaking to make it set for public consumption.”</strong></p>
      <p>Either that, or send you a list of recommended changes and corrections for you to make yourself, which is the way it's generally done with published fiction. I wouldn't let a publisher print my story if they wrote and informed me they'd be making a bunch of changes, themselves (every contract I've signed thus far, in fact, prohibits this), and if they decided they needed to make changes and wanted to charge me for proofreading and copy editing, I'd do exactly what you did, go post about it on a board where other writers hang out.</p>
