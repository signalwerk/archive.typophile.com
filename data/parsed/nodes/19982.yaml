      <p>Your statement "Any publisher/distributor/whatever that doesn’t assume all financial risk in return for your allowing them to make the lion’s share of income from marketing your work is not worth working with," isn't quite the way it works in non-fiction publishing. The cost of obtaining permissions for illustrations, as a for instance, is often up to the author. Since this can be prohibitive (I have a friend who would have had to fork out $23,000 for rights to use photographs), it often becomes a situation where a writer has to pursue the grant track in order to provide a viable manuscript that a publisher is willing to undertake.</p>
