      <p>It's not a rip-off, in terms of the cost for the work done.<br>
      And didn't you agree to the price before they did the work?</p>
      <p>You probably shouldn't be airing this aspect of a business relationship in public.<br>
      There may be a non-disclosure clause in your contract.</p>
      <p>Yes, there are all kinds of trade secrets. Business is competitive, hard to explain, and many small businesses don't even formally rationalize how or why they do things the way they do; it just seems obvious, once you've tried a few different approaches. So it takes a while not just to become a better designer and manufacturer, but also to acquire an understanding of the business side of things. Everybody has gaps in who and what they know, it's just the way one evolves in one's niche.</p>
