      <p>"Your statement “Any publisher/distributor/whatever that doesn’t assume all financial risk in return for your allowing them to make the lion’s share of income from marketing your work is not worth working with,” isn’t quite the way it works in non-fiction publishing. The cost of obtaining permissions for illustrations, as a for instance, is often up to the author."</p>
      <p>In some specific cases. In major magazine nonfiction writing, which pays better than anything else, the writer is absolutely not on the hook for out of pocket costs like this. In many cases involving non-fiction book publishing, authors are given limited budgets for image clearance and anything beyond that is out of pocket.</p>
      <p>At any rate, this is not an issue of the publisher not assuming financial responsibility, simply one of controlling expenditure. Non-fiction authors *still* don't have to pay their publishers to edit and proof their books. </p>
      <p>The only way the illustration question could be equivalent to the subject under discussion is if non-fiction authors were given lists of illustrations owned by the publisher who required them to use those illustrations and charged them per-image. Publishers and distributors shouldn't be holding editing costs over creator's heads as a ticket to entry for *anything.* It's unethical and a clear conflict of interest, given that the publisher stands to make more money the more edits they require of more creators.</p>
