    <p>Hey folks...</p>
    <p>I recently released a typeface, Bauer House, through t26. The long story short is, I had thought it was in pretty good shape overall, but I was told that there were $300 worth of fixes to be made in advance of release, so I shelled out the money up front. Now I feel like I should have come here first and asked for help. A Typophile on another thread said I should just post the list of fixes I was told they would need to make, and see if anybody has some input on those so that I'll know what to do next time. I think the list might be vague, but any input you have would be great. I'd post the whole typeface, but since it's already a commercial font being sold through t26, I don't know if that would be the best idea.</p>
    <p>But let me know what y'all think.</p>
    <p>— Josh</p>
    <p>-------------</p>
    <p>Bauer House [1 OTF with Standard, Titling/Inline, Smallcaps, Central European sets]</p>
    <p>     Name Structures — Need to be corrected for cross-platform / OTF use — 5 min</p>
    <p>     Header Info — Missing a few info panels, invalid FOND ID, etc — 15 min</p>
    <p>     Encoding — OK</p>
    <p>     Vector Check — Numerous stacked points, intersecting contours, semi-perpendiculars — 30 min<br>
                            Numerous construction errors, bulges, non-matching glyphs<br>
                                (e.g., H I w/ no rounding or flair) — 60 min</p>
    <p>     Metrics — Spacing inconsistencies and errors (J h u v etc):<br>
                            10 min to correct most serious; or<br>
                            30 min to respace full font</p>
    <p>                Kerning: several overtight kern pairs (At Hu et):<br>
                             5 min to correct / remove collisions;<br>
                            90 min to rekern font after respacing</p>
    <p>     Hinting — No hints, alignment zones need to be set:<br>
                            30 min to hint (optional); or<br>
                              0 min and font can be remain unhinted (will look fuzzier overall)</p>
    <p>     Euro — OK</p>
    <p>     Non-Breaking Space — Needs to be set — 0 min</p>
    <p>     Vertical Metrics Tables — Need to be updated — 0 min</p>
    <p>     Live Testing of OTF font — OTF tables appear to be working properly</p>
    <p>     - - - - - - - - - - - - - - - </p>
    <p>     Final Font Mastering and Live Proofing — 15 min</p>
    <p>     Combined Correction &amp; Mastering Times:<br>
                            A: 140 min with most basic corrections<br>
                            B: 245 min with new spacing &amp; kerning<br>
                            C: 275 min with new spacing, kerning &amp; hinting</p>
