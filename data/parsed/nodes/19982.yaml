      <p>I'm new to type design (not to design/illustration in general--been doing that for twenty years), but I have a few years' experience writing and publishing short fiction, and this brings to mind raging arguments in that community, especially with the advent of Internet-based, print on demand vanity publishers. </p>
      <p>There's a simple solution to the question when somebody asks "X published me, but they charged me Y for Z. Was that right?" The solution is "Money flows to the writer." </p>
      <p>It's the same deal with any kind of publishing of individual work, like this one--as the creator, you give up a significant financial interest in the commericial exploitation of your work in return for the publisher's assuming all financial risk and marketing the work. </p>
      <p>Any publisher/distributor/whatever that doesn't assume all financial risk in return for your allowing them to make the lion's share of income from marketing your work is not worth working with. I don't know if you got scammed, but...money's supposed to flow to you from the publisher, and it should never work the other way around.</p>
