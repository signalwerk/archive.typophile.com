      <p><cite>Joshua should certainly be careful (and it seems he is), but I wouldn’t discourage him from pursuing this - he’s actually doing others a favor.</cite></p>
      <p>Thanks hrant, I appreciate it. That is really my goal here. I have absolutely no intention to trash-talk anyone; frankly it's my first retailed typeface and I'm both proud of that point and also pretty happy that at least t26 was interested enough to sign a contract with me. Regardless of the repair fees, they are still under contract to market my font, and that's something they're doing at their own risk. That's the plus side of things.</p>
      <p>On the other hand:</p>
      <p><cite>money’s supposed to flow to you from the publisher, and it should never work the other way around.</cite></p>
      <p>This is how I had felt all along, and that's what made this feel somewhat fishy. I feel like, if a company was interested <em>enough</em> in Bauer House, they would say, "This is a great design! We'll take care of the tweaking to make it set for public consumption." If a publisher was to believe enough in the work that they are putting out, they are the ones responsible for the editing. As RN Lee said, it seems a matter of confidence, liability, and responsibility. </p>
      <p>More than anything, though, I was really just hoping that I would get a much higher-quality typeface back after the few weeks that were spent on their side fixing it. I had put a lot of work into it, but since it's my first actual font, I could be sure that it worked, but not that it would work in every application and with every system. It wasn't that the font was not in good shape, it was just a matter of being sure all the settings were correct. I originally made it clear that I would pay the fee to them once but that I would really like to receive the typeface after it is complete, and that it would be great to have a log-sheet or something to say exactly what was changed about it, so that in the future I could provide a better typeface from the get-go. When I received the .otf file afterwards, I was just a bit disappointed, because I could find small changes (such as the actual font name; I had used something else after "Bauer House" but they changed it to "Bauer House - Regular"), but the overall typeface seemed the same. My kerning had not been terrible to begin with, and that may have been minorly tweaked, but again, I saw no huge difference for the most part. I'll give them some possible credit though: sometimes subtle changes are the most important. Perhaps I could not find the major fixes because they seem transparent. But the one thing I'm very, very uncomfortable with is the fact that the font seems to have some sort of error (and I believe the error was introduced <em>after</em> the repairs were made. I'll have to test my old version to be sure).</p>
      <p>But here's what I'm referring to. It's some sort of hinting issue, I think, because it shows up only when the type is displayed below a certain size. </p>
      <p><strong>Small size:</strong><br>
      <a href="http://www.threestepsahead.com/temp/error_01.png" title="http://www.threestepsahead.com/temp/error_01.png">http://www.threestepsahead.com/temp/error_01.png</a></p>
      <p><strong>Enlarged:</strong><br>
      <a href="http://www.threestepsahead.com/temp/error_02.png" title="http://www.threestepsahead.com/temp/error_02.png">http://www.threestepsahead.com/temp/error_02.png</a></p>
      <p>In the larger type, it disappears. Bear in mind this is only on an alternate question mark that I designed, not the main one. The error may occur on a few other characters as well; I have to check in more detail.</p>
      <p>Anyway, this brings to mind one other last issue that I have in regards to the retailing of Bauer House. My typeface is FULL of alternate characters and OpenType features. It took some convincing to tell T26 that I insisted on having the font distributed in OpenType only. At first they had a problem with that, but I explained that so much of it is inseparable from the OpenType features that I would not want to see it distributed without them. They agreed, but said that they would have to update their entire system online to allow for an OpenType font to be used. In the end, when it was finally given back to me after the repairs, they said that they were forced to distribute it also in TTF and T1 formats for Mac and PC because their system would not allow just an OpenType font to stand alone. I've yet to receive copies of the TTF and T1 versions, but they could not possibly contain the features that I included in the OpenType version. Firstly I'm sad that they gave anybody a choice on that, as I can't really see much reason <em>not</em> to use OpenType at this point. Secondly, maybe as a result of that, or maybe just because this isn't high on their priority list, Bauer House's alternate characters and OpenType features are in no way being explicitly displayed on the site. So, I doubt I will see much in the way of royalties, if only for that reason.</p>
      <p>Lastly, I don't mean in any way to offend or upset anyone by starting the conversations that I've started. I mean to do all of this out of fairness, as I think that we can all benefit from at least knowing how things <em>should</em> be done. By sharing our experiences, we have a little bit more confidence-ammunition to be able to negotiate for ourselves in the future. Before I even got started with designing type at all, I had run into so many problems with those I dealt with as a freelance graphic designer. Only recently have I started to get the hang of making sure I'm not taken advantage of as an independent contractor, and that's after years and years of problems. What I found, though, is that the biggest step I took was reading <a target="_blank" href="http://www.amazon.com/gp/product/0932102123/sr=8-1/qid=1147962757/ref=pd_bbs_1/104-7735859-3663122?%5Fencoding=UTF8" rel="nofollow"><em>The Graphic Artists Guild Handbook: Pricing and Ethical Guidelines</em></a>. Overnight, I had much better method of running my business, because I finally had some advice and information specific to the industry. It was like having a veteran sitting on my desk and telling me "No, no. <em>This</em> is how it's done." In our case, here, I think we can all benefit from the discussion and collective advice of those that have "been there."</p>
      <p>- Josh</p>
      <p>—æ——æ——æ——æ——æ——æ——æ——æ——æ——æ——æ——æ——æ——æ——æ—<br>
      <strong>"Wishers and woulders be small householders."</strong><br>
      <em>—Wynkyn de Worde</em></p>
    html_clean: |-
      <p><cite>Joshua should certainly be careful (and it seems he is), but I wouldn’t discourage him from pursuing this - he’s actually doing others a favor.</cite></p>
      <p>Thanks hrant, I appreciate it. That is really my goal here. I have absolutely no intention to trash-talk anyone; frankly it's my first retailed typeface and I'm both proud of that point and also pretty happy that at least t26 was interested enough to sign a contract with me. Regardless of the repair fees, they are still under contract to market my font, and that's something they're doing at their own risk. That's the plus side of things.</p>
      <p>On the other hand:</p>
      <p><cite>money’s supposed to flow to you from the publisher, and it should never work the other way around.</cite></p>
      <p>This is how I had felt all along, and that's what made this feel somewhat fishy. I feel like, if a company was interested <em>enough</em> in Bauer House, they would say, "This is a great design! We'll take care of the tweaking to make it set for public consumption." If a publisher was to believe enough in the work that they are putting out, they are the ones responsible for the editing. As RN Lee said, it seems a matter of confidence, liability, and responsibility. </p>
      <p>More than anything, though, I was really just hoping that I would get a much higher-quality typeface back after the few weeks that were spent on their side fixing it. I had put a lot of work into it, but since it's my first actual font, I could be sure that it worked, but not that it would work in every application and with every system. It wasn't that the font was not in good shape, it was just a matter of being sure all the settings were correct. I originally made it clear that I would pay the fee to them once but that I would really like to receive the typeface after it is complete, and that it would be great to have a log-sheet or something to say exactly what was changed about it, so that in the future I could provide a better typeface from the get-go. When I received the .otf file afterwards, I was just a bit disappointed, because I could find small changes (such as the actual font name; I had used something else after "Bauer House" but they changed it to "Bauer House - Regular"), but the overall typeface seemed the same. My kerning had not been terrible to begin with, and that may have been minorly tweaked, but again, I saw no huge difference for the most part. I'll give them some possible credit though: sometimes subtle changes are the most important. Perhaps I could not find the major fixes because they seem transparent. But the one thing I'm very, very uncomfortable with is the fact that the font seems to have some sort of error (and I believe the error was introduced <em>after</em> the repairs were made. I'll have to test my old version to be sure).</p>
