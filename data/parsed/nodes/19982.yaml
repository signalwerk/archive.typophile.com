      <p>Nick,</p>
      <p><cite>It’s not a rip-off, in terms of the cost for the work done.<br>
      And didn’t you agree to the price before they did the work?</cite></p>
      <p>I did. I actually would not have started asking any questions on here, though, if I was satisfied with the quality of what I received for that payment. Had I received a much-improved font, with noticable changes, I wouldn't question it. I just feel like the job may have not been done properly, due to the strange "artifacting" that I'm getting using the revised edition.</p>
      <p><cite>You probably shouldn’t be airing this aspect of a business relationship in public.<br>
      There may be a non-disclosure clause in your contract.</cite></p>
      <p>I checked in advance. No such clause exists in my contract. Furthermore, when I paid them to make the revisions to the font, we were not yet under contract. The contract was only signed after I had received the revised edition of the typeface. (Whether I made a mistake in signing at that point is a different issue.)</p>
      <p>After re-reading the contract, I'm more satisfied with the contract itself than I am with both the up-front cost and the seemingly-mediocre results that it paid for. The contract itself is pretty darn fair. I just feel like I probably could have released the font as-is instead and saved a few bucks.</p>
