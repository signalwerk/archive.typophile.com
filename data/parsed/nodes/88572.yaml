    <p>I've tried using some font ID tools out there and the closest I can seem to come up with is Twentieth Century Classified MT Regular but I'm pretty sure that's not it, although perhaps it might be a decent replacement?</p>
    <p>Can anyone lend a hand? :)</p>
    <p>Happy Holidays!</p>
