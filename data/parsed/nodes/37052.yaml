    <p>I’m an American working in an ad firm in Birmingham, AL.</p>
    <p>Basically, i’m looking for an established British typographer to work with and learn from. I worked with Rick Valicenti of Thirst (Chicago) for a semester, and he cultivated a love of typography in me. I learned more in one semester with Rick then i did in five years at university. I’d like to get a similar experience with type design.</p>
    <p>Grad school is a little out-of-reach, and i feel like a working internship would be more practical anyway. </p>
    <p>I’m enthusiastic about drawing type and creating faces, but without formal instruction i feel like i’m missing something.</p>
    <p>Any suggestions<!--
