      <p>The original printing of Otl Aicher's <a href="http://www.baselinemagazine.com/mainframe/Products/associated%20books/typographie.html" target="new" rel="nofollow"><strong>typographie</strong></a> ran German and English text as separate paragraphs on the same page.</p>
      <p>I am not sure of the more recent editions though.</p>
      <p>I worked with Otl Aicher for nearly two years, on the development, marketing and commercial release of Rotis type family. This was back in 1987-89 when I was a manager at Afga Typographic (previously Compugraphic, now Monotype Imaging).</p>
      <p>I spent time in his studio at Rotis in Leutkirch im Allgäu.</p>
