      <p>thanks to both of you for your comments. after reading "Is Rotis a typeface?" i can definitely see echoes of the same problem within the field of architecture - people espouse a theory, but what they produce using that theory is not what they say it is.</p>
      <p>that said, i agree that Rotis is great for titles, headlines, and logos, but have never felt ok about using it to set large blocks of text. taken individually, i think that the letterforms are quite beautiful.</p>
