      <p>&gt; 1. Do you think it has got enought character to live a life next to Rotis?</p>
      <p>Yes. There are still very few modern sans families with contrast. There is room for more.</p>
      <p>&gt; 2. Would you do extra fonts, or Open Type styles for the alternate versions?</p>
      <p>I would definitely do OT for those who are using Adobe CS. But <a href="/wiki/Mark%20Simonson" class="freelinking" rel="nofollow">Mark Simonson</a> has a nice solution for those customers who might not be using OT-savvy apps: bundle both options: a full featured OT with the alts, and separated OT fonts.</p>
