      <p>I don't have much insight into your 2 questions, but I will admit that I love the work you've done so far.</p>
      <p>It feels like a more robust Rotis. The ampersand is back to normal; even sophisticated looking. I especially enjoy the @, registered and copyright symbols. </p>
      <p>I don't know if your tracking is quite right yet, especially the spacing between words, which feels too wide. </p>
      <p>the lowercase a is very elegant. The lowercase f however doesn't seem dense enough, and I'd like to see the lowercase t with an angled top like in Rotis.</p>
      <p>The uppercase Q and R are nice, but they don't share the same unique feel of Rotis's Q and R.</p>
      <p>The one thing that sets your characters apart from Rotis, is that some of your strokes end outward, were Rotis's would end downward. Such as in a, c, y, 2, 3, 6, and 9. I don't know if this a true argument as much as it is an observation.</p>
      <p>Very nice work Hubert.</p>
