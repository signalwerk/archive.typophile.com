      <p>I found this, old info:<br><a href="https://web.archive.org/web/20191009020313/http://typographi.com/000134.php">http://typographi.com/000134.php</a><br>
      June 03, 2002</p>
      <p>Shiny New Foundry: Process Type</p>
      <p>Witness the (alternately organic and digital) beauty of Eric Olson’s Process Type. Featured are the first four families: an old-school grot with exagerrated quirks, a surprisingly usable product of ASCII art, an exploration of the same industrial roundness found in Frere-Jones’ Garage Gothic, and a thoughtful take on Courier. The site itself is notable, glowing of attention to usability.</p>
      <p>Update, April 15<br>
       Process Grotesque and Elderkin have vanished from the Process Type website but the fonts are still available for sale at MyFonts.</p>
    html_clean: |-
