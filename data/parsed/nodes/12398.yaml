      <p>Just disappeared from their site. There was a thread about this somewhere. Finding it is another story. </p>
      <p>edit: Found the ID thread I was talking about: <strong><a href="http://www.typophile.com/node/9841" rel="nofollow"> here </a></strong></p>
      <p>Eric Mentions the removal in this <strong><a href="http://www.typophile.com/node/8695" rel="nofollow">thread</a></strong></p>
      <p><cite>A few of my typefaces were made for very specific projects (Process Grotesque + Elderkin) and really have no contribution to make beyond that. Sure they look fine, but who cares? I'm not thrilled with them and plan on removing them this spring.</cite></p>
      <p>I always feel a bit sad when a designer removes fonts from a body of his work regardless of how they feel about them now.</p>
