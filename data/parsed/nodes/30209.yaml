      <p>Hiroshige,</p>
      <p>I lived through and protested with the best of them to help shape this country. So please, get off your soapbox.</p>
      <p>I spent most of my adulthood helping people on a one-to-one. In the art world in NYC, I watched many talented designers lose their jobs because of Mac computers. I was the only typeshop that would take them in -- give them a 6 mos course (and buy them lunches almost everyday, etc.) and teach them the Mac. It became a joke around publishing, come to me and six months later -- you became an art director. I also watched many of these people spit on the rest of the world when they got there - so I didn't exactly feel like my job was complete.</p>
      <p>Oh, yes, I owned a typeshop in New York and was the second one in NYC to put in MACs and proudly the first one that was actually producing work on it... (And again, helping another typeshop's workers try to keep their jobs - when MKP sold out to Harris -- MKP's workers were given 6 months to learn the Mac -- several of their day workers would come over to my shop to try and learn - but their hearts weren't in it. I remember one guy saw my old typositor and just wanted to come and set typositor words for me...)</p>
      <p>I have taken in strays (and I'm not talking animals) and made them feel human again and got them on their way into the world. And yes, some of them I am so very proud of. I'd love to give you one of the people I helped. He was a New Yorker who came back to NY as a homeless person. I took him in and well, made him feel like a human being. (BTW - a wonderful artist who have had many shows on the West coast.) He was able to get his act back together and well, I am really proud of him. He does his artwork at night, took a regular day job -- owns his own home.</p>
      <p>I did not grow up to be a "tushy-washer" but it is what I seem to have become. I now take care of a 90 year old woman and do my best to make her want to get out of bed and live everyday. Last week was extremely rough for me - it was the 26th anniversary of my own mother's death -- and here was Helen (the 90-year old) about to die that day. I couldn't let her. If you are interested she is doing much better this week -- but seems to have lost her short-term memory -- and wants to keep putting the stove on.</p>
      <p>I have no trumpets to blow and couldn't care less about most people's attitudes. (That tend to happen when you get older and no longer seek parental approval.) I just try to make the world a little bit better and believe in treating humans nicely. I've never faltered from my original learnings - and I've passed them on to others.</p>
      <p>I've been lucky in my life. There has always been a connection to people in the world for me. I've always had my own "network" even before the age of computers. That network extended to many cities throughout the world. Amazing, you have reminded me that when I had my own apartment in NY and was by myself -- I was never alone.</p>
      <p>********</p>
      <p>Patty,</p>
      <p>Life in Manhattan was always wonderful. I was born there, grew up there -- studied there. The 70s were great.  Hiroshiga writes about the radical blacks of the '60s. I have to laugh - hey, I was in NY. We even protested against the New York Times in 1969 begging them to stop typesetting "Negros" and use the word Black. It was quite an achievement when they finally did. And NYC those years -- let's face it -- the hippy way of life was winning out and everyone was spreading the joys of love.</p>
      <p>I haven't lived in NY since February 14, 1999. I was happy I wasn't there for 9-11. I have watched many good friends of mine pass away -- and the city isn't the same for me. I returned two October's ago for my dearest friend's Irish Wake -- I was amazed at what I saw. Manhattan is a youngster's paradise. No senior citizens out there... I don't know how everyone affords to live there -the apartments are way over priced. (My friend's apartment cost him $37,000 in 1986 and today is worth $550,000.) I gave up a large (850 sq ft) one bedroom apartment that cost me - now don't cry -- $1000 per month in 1999. Located in what use to be the heart of the typesetting industry - 46th &amp; 2nd.</p>
      <p>Well, thank you for letting me write this out during my peace time - before Helen arises...</p>
      <p>Jackie </p>
      <p>P.S. So Hiroshige -- in the strands of life - who are you?</p>
