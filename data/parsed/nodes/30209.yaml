      <p>James Brown was a great innovator, and one of the greatest performers. I love him as a balladeer particularly. </p>
      <p>As an innovator, he was particulary important in rhythm. Be-bop had changed jazz from a traditional blues rhythm, which breaks the 4 beats down further into doublets or triplets, to a 16th note feel. As I see it, James Brown did this in a different way in rock, and introduced a new rhythmic feel, which was hugely influential. </p>
      <p>Just as Charlie Parker kept a blues feel even while playing much faster, James Brown kept a blues feel even in his faster rhythms. But unfortunately the followers IMHO have not been able to do it so well. And as a result the sense of 'swing' in both Jazz and Rock have declined. </p>
      <p>At least that's how one 'old school' guy feels.</p>
