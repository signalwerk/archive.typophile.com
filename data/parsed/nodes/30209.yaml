      <p>&gt;stayed civilized so far - amazing considering how flame-y some other threads have gotten.</p>
      <p>I suspect this is because Aziz is actually open minded, and I would like to think I am too. </p>
      <p>The problem with addressing all your questions, Aziz, is that they would take a book--actually many books--to answer them in depth. Because so much history is involved, rather than trying to cite it all, let me just give you my own general view, and if you like I can  cite references later. </p>
      <p>&gt;1. The Jews were travellers from the Nile to the Euphrates rivers.<br>
      Why Jerusalem was chosen for their settlements? Why not Jordan for example? </p>
      <p>If you start with Abraham, in maybe 1700 BCE,his family came from Ur, which is maybe not so far from your house. The story goes from the Euphrates to the Nile, and then back to the land of present day Israel &amp; Palestine, which is where it was for the longest period. </p>
      <p>With Abraham you are talking about a family or small clan. The history of the Jews as a whole people with their own religion really starts in a way that is trackable after the Exodus from Egypt in about 1300 BCE. There they come into the hill country west of the Jordan river, largely in the current West Bank territories. </p>
      <p>King David united the 12 tribes under him as King, and made his capital Jerusalem (which was central within the various tribal areas) in around 1000 BCE. Though a city did exist before that, for the next thousand years (with the exception of 70 years exile in Bablyonia) it was a Jewish city. David's son Solomon built the ancient Jewish Temple there, and that was the center of Jewish worship for the next thousand years also, until the Roman destruction in 70 CE. After 70, there was a Jewish presence in Jerusalem basically whenever it wasn't prevented under pain of death. </p>
      <p>In the Jewish psalms, there are praises of Jerusalem while the Jews were in exile in Babylonia. (These pre-date Islam by 1000 years). And after the Roman destruction of the Temple in 70 CE, the daily prayers contained longing to return to Jerusalem ever since. And of course Jews traditional pray in the direction of Jerusalem, and within Israel toward the Temple mount--all of which predates Islam by hundreds of years. </p>
      <p>I should add that the Hebrew language is in the view of most derived from the language of the Caananites, and so the language of the Jews is pretty much native to Jerusalem. Arabic, which is the language of conquerers from Arabia, is also a Semitic language, but not so local in origin.</p>
      <p>As far as genetic background, the Jews were a "mixed multitude" even when they came out of Egypt, and today Jews and Israelis come from practically every racial type. Still, a majority (including me) look to me like cousins to Lebanese and Syrians.  </p>
      <p>The basic point I am making is that the Jews have a very long and strong claim to being people from the land which is currently Israel, and specifically Jerusalem. </p>
      <p>I know that one can argue about this, but so too one can argue about the claim of Islam on Jerusalem as a holy site, as you can read in the <a href="http://en.wikipedia.org/wiki/Al-Aqsa_Mosque" rel="nofollow">wikipedia article</a> on this issue.      </p>
      <p>Now I don't think that either the historic or religious Jewish or Islamic claims to Jerusalem are the most important things in the current situation. But I just mention some of the Jewish ties--and a lot more can be said--as by your question you don't seem to be aware of them.</p>
      <p>To me more important than the historical, religious and emotional ties of either Jews or Muslims to Jerusalem is a settlement of the current state of war that will lead to peace and a good future for both Israeli and Palestinian communities. </p>
      <p>I'll turn to other of your questions in a later posting.</p>
