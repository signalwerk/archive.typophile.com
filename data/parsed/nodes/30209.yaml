      <p>&gt;in the writings of all 12 tribes - a mesiah would appear and lead them back to Jerusalem.</p>
      <p>This is not historically accurate. The twelve tribes ceased after the fall of the Northern kingdom, in 722 BCE. However, the idea of a messiah only appears in Judaism after 164 BCE, during the second Jewish state. It is mainly post-biblical and appears in the Bible only in the latest passages, such as in the Book of Daniel, and even there it is not clear.</p>
      <p>Also the establishment of the Jewish state was done primarily not by religious Jews, but by secular socialists who wanted a homeland for the Jews as an ethnic group, and not to fulfill religious hopes.</p>
      <p>&gt;1. The same Mesiah recognized by Christians. Or a different One?<br>
      &gt;2. Are they preparing for his noble (re)appearance in Jerusalem?</p>
      <p>1. The Jewish concept of the messiah is not entirely clear, but it is clear at least that the messiah will not be a God, but a person who will re-establish the Jewish state and usher in a reign of peace in the world. This is decisively different from the Christian concept. </p>
      <p>2. Traditionally, the only preparation for the coming of the messiah is the doing of good deeds. Prayers for the coming of the messiah, soon, is part of the traditional Jewish daily prayers (which were formulated in the the second century CE).</p>
