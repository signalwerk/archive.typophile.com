      <p>&gt;1. Aside from the shot-to-death, how many Jews were gassed?</p>
      <p>The number of those killed by being shot, or by other means than gas chambers in concentration camps, should not be minimized. The German army, as it advanced through Eastern Europe into the Soviet Union, was followed by the SS. The Germans organized militias in many of the occupied countries to assit their killing as well. All of this is well documented by the German government (even by the old East German government) and I suspect by the present-day governments of the respective countries involved, too. Certainly in Poland and in Russia, there are records. </p>
      <p>Aziz, the line of questioning you put forth feels to me to be undermined by a misunderstanding of European history. For at least a thousand years, Europe was not the tolerant, open environment it is today. Wars and killings were common throughout its history, even its modern history. In seventy years, for instance, between 1870 and 1940, Germany invaded France three times.</p>
      <p>Visit virtually any city center in Central Europe. Signs commenorate mass killings and burings throughout the past several centuries — not just of Jews but of too many minority groups. The first victims of the Crusades, just to mention one example, were not Muslims or Arabs or Turks or even Greeks (all of whom would eventually be terribly attacked over the centuries-long campaigns), but Jews living in Christian cities along the Rheinland. As the first crusading armies moved out of France along their way to Jerusalem, they decided to kill all enemies they could find, even the ones on their doorsteps, and their neighbors in their own cities!</p>
      <p>The history of Europe is tragic and violent. Fortunately for us in the present and in the future, it was at least well documented. Trying to discredit the whole of history by nitpicking at details is distastefull, and it makes my heart sad to witness it.</p>
