      <p>Paul -- The Vietnam War ended under Richard Nixon's watch. He was the president that called our troops home. I can remember the day clearly - I was a college student -- and was working in a restaurant at nights. The group of us at the restaurant and told the ceiling to let Johnson know the war he escalated was now over.</p>
      <p>Gerald Ford was not a great leader - he was a good follower. At the time he was appointed President, I know personally, I was very upset. He was the first president we ever had that was not elected by the people. I felt this country should of had a special election -- but you know, it never really matters the political machine continues to churn.</p>
      <p>As for James Brown. thank you Chris and Paul. He may have been loved by many for his music and his innovations in the music world - but not an example to show our children -- unless of course you want to show his time served in South Carolina to them - and let them know there is still hope after jail.</p>
      <p>Sorry to sound so cynical this morning -- just we tend to honor many of the wrong people. Our children are in need of heroes and good-doers. We give them glitz and show them a way of life they will probably never have. I think I prefer living with people who have their dreams, but keep their feet on the ground.</p>
