      <p>&gt;”As for James Brown. thank you Chris ...<br>
      Our children are in need of heroes and good-doers. “</p>
      <p>Sometimes someone can be a “good-doer” without even knowing it. I owe a special gratitude to James Brown, Little Richard, Aretha Franklin, Wilson Pickett and Tina Turner. My son is autistic and did not speak or understand language or even respond to his name until he was 4 years old. Part of the reason for his breakthrough to communication was his response to R&amp;B music, mostly James Brown. While I was playing some of my old R&amp;B recordings, I noticed that Michael was responding with body movement in sync with the music. His first attempts at speech were mouthing sounds in response to James Brown’s music. We found videos of JBs performances and showed Michael.  This even made the effect stronger. A rare smile came to his face.  In time, he was imitating both sound and movement. Eventually, he learned the complete “I feel Good” cut and it became part of the launch-pad for speech.  Today he has full speech and understanding (to the point where he never stops talking).<br>
      I am sure James Brown did nothing on purpose to help Michael but, never-the-less, he has. Call me a Pollyanna/revisionist if you like but I can’t ever forget that moment when Michael first said “I feel good”.</p>
      <p>ChrisL</p>
