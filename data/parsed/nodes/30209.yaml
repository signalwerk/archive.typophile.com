      <p>&gt;nor Spain was ruled by Muslims.</p>
      <p>Aziz, you are sending me back to the history books--which are very interesting to me. </p>
      <p>Parts of present day Spain were ruled by Muslims from 711 to 1492, nearly 800 years. When Spain was first conquered by Islamic armies, it had been Christian for some time. </p>
      <p>When present day Israel was conquered by Muslim armies from Arabia, it had also been Christian for hundreds of years. It had been briefly conquered by the Persians, and then the Arab conquest came in 640, establishing Islam. The Arabs were not invited, but conquered by the sword and give people the choice of conversion, death or--in the special case of Christians and Jews--dhimmi (second class) status. The Muslim rulers were in turn re-conquered 450 years later by Christian Crusaders, who ruled for two hundred years, from 1099 to 1291--with the exception of a period when Saladin briefly returned the land to Muslim control (and invited Jews back to Jerusalem). </p>
      <p>After that Muslims from Egypt (Mamluks) regained control, until they were conquered by the Turks, also Muslim, in 1517. The Turks were conquered by European allies in WWI, and the land of Israel was taken over by the British, who were Christian. Like Saladin, they invited the Jews back. (Jews did not re-settle by an aggressive war.) </p>
      <p>My point in recounting this history is that to figure out the rights and wrongs of every conquest and ruler you would take a lifetime of studying history. </p>
      <p>And the bottom line is that if you are a Muslim fanatic, like Osama bin Ladin, you will want to reconquer Spain by force of arms as soon as possible. If you are a Christian fanatic, like the Crusaders, you will want right away to return all once-Christian lands to Christian rule. If you are a Jewish fanatic, you will want to expand the Jewish state to the size of the state of King Solomon. </p>
      <p>By the way I shouldn't have said that religious fanaticism is the enemy of peace and prosperity, I should have said that fanaticism, period, is the enemy of peace and prosperity. Communist fanaticism in the 20th century was responsible for great slaughter of people, and it was anti-religious. </p>
      <p>So if you want to kill people over their beliefs I think this is the enemy of peace and prosperity. If you want to be tolerant and let people raise their families in peace, worship as they choose, grow food, heal the sick, write poetry and music--and do type and calligraphy!--then I think you are on the right path.</p>
