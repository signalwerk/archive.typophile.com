      <p>Also Aziz, the answers to all of your questions from your last post can be found in the testimonies given at the Nuremburg trials, and other trials conducted by the Allies after the conclusion of the war. The German governments, and the governments of their neighboring countries (West and East) also held trials for decades after the war's end. (In France, Klaus Barbie did not even come to trial until 1984; more info here – <a href="http://en.wikipedia.org/wiki/Klaus_Barbie" title="http://en.wikipedia.org/wiki/Klaus_Barbie">http://en.wikipedia.org/wiki/Klaus_Barbie</a>)</p>
      <p>Many of the defendants in these trials did not contest their actions in the war, the government, or the holocaust. Rather, they contested whether wat they had done was actually wrong (and occasionally whether or not the courts were valid). Examine the proceeds of these cases, and you will find your answers.</p>
