      <p>I wonder what James Brown would think of the way this thread has been hijacked!</p>
      <p>If any of you have ever been to Jerusalem you'd know that in a matter of a few square blocks lie the site of the ancient Jewish temple (the walls are still there, the Jews still pray at them), the Dome of the Rock from which Mohammed ascended (you can touch this spot with your hand), the Via Dolorosa (stages of the cross) and the Church of the Holy Sepulchre which was built on the site of Jesus's crucifixion. It is impossible to grasp the proximity of these holy sites without actually being there. The Dome of the Rock - which is heartbreakingly beautiful - is actually built on the former site of the Jewish temple. Yes, the Jews were there first. This spot will always be a site of contention. Nothing short of tearing it all down and perhaps turning it into some sort of multi-denominational site of worship with no national or religious jurisdiction will solve this conflict. And yet this solution would anger everyone. It's like Solomon tearing the child in half.</p>
      <p>It is frustrating beyond belief that nobody seems to be able to rise above self interest, take the high road and come up with a peaceful solution, which is (I believe) what the vast majority of Jews and Palestinians want. Everybody is acting like the child who only wants the toy because his brother wants it too.</p>
      <p>I second the suggestion that the moderators close this thread. We have indeed stayed civilized so far - amazing considering how flame-y some other threads have gotten.</p>
