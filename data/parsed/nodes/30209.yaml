      <p>I am Music, the most ancient of the arts. I am more than ancient: I am eternal. Before the earth began, I was already there, in the winds and in the waves. When the first trees, flowers and fields appeared, I was among them. And when man appeared I became immediately the most delicate, the lightest and the strongest way of expression of Man's emotions.</p>
      <p>When men were little more than beasts I had an influence for their good. In all the ages I inspired men with hope, set alight their love, gave voice to their joys, I made them happy for the courageous acts and comforted them in the desperate moments. I played an important part in the life drama that has for aim and goal the complete perfection of Man's nature. Through my influence, the human nature has been raised, mitigated and sharpened. With men's help I became an Art. I have a multiplicity of voices and instruments.</p>
      <p>I stand in the heart of all men and on their tongues in all the lands, among all the people; the ignorant and the illiterate know me as the rich and the scholar do because I speak to all men in a language they all understand. Even the deaf can hear me if he only listens the voice of his soul. I am the food of love. I taught men mildness and peace and I guided them towards heroic acts. I give comfort to the lonely and I harmonize the discord of the crowds. I am a necessary luxury for all men. I am Music.</p>
      <p><em>Anonymous</em></p>
