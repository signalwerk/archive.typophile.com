      <p>The draft ended in 1973.</p>
      <p>Nixon resigned August 8, 1974. - That was also a summer I spent in London and realized that their newspapers and televisions were censored... they never heard the entire speech Nixon made live to the American public. Favorite comment that day was from an Englishman who looked me in the face and said, "American has just hit puberty."</p>
      <p>And DaKine - I'm with you - I'm scared how these folks would rewrite it all - especially since we were there to experience it. (Is this like Iran not believing the holocaust took place?)</p>
      <p>And Patty - I'll hate Mayor Beame way before I'd take it out on Ford. Beame had been controller for the city and knew where all the money was. When he took office he decided we need a tax upping - I think we went from the 6 or 7 right to 8% (the .25 was added a year or so later) no vote on the matter - no going over the books to see if the city needed to do this -- and when it was done, he very nicely announced to the papers he found several "city bank accounts" and we didn't need the sales tax hike, but (and with a broad smile) said he was keeping it in place anyway...  Our whole Federal government at that point told us to bug off...</p>
