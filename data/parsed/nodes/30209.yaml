      <p>1. This is correct. But it gives a fuller picture if you add that it was Nazis leading the murdering, and that they targeted specific groups: Jews, Gypsies, homosexuals, and anyone who criticized their regime, amongst others. </p>
      <p>2. Not quite right. There was a Jewish state in ancient times, which was at its largest under King Solomon, around the year 1000 BCE. It was ended in 576 BCE by Bablyonian conquest, and exile. Jews returned to the land of Israel 70 years later, and eventually there was a second Jewish state from 164 BCE until about the first century C.E. After that, for 1900 years Jews in dispersion preserved their unique culture and Hebrew language, and every day prayed for return to the land of Israel. There was also, with with some exceptions, a continuous small Jewish presence in the land of Israel and in Jerusalem. Present day Israel, from 1948, is the third Jewish commonwealth. </p>
