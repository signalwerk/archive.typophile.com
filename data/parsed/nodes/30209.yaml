      <p>The holocaust created a huge problem of Jewish refugees. This fueled further Jewish immigration to the land of Israel, and made the world, including the UN and the USA, sympathetic to the cause of a Jewish  homeland and place of refuge in the site of the ancient Jewish states. And the holocaust is mentioned in the Declaration of Independence of Israel.  </p>
