    html: |-
      <p>This came out earlier in the thread, in a few exchanges between Tiffany and myself.<br>
      As I understand it, some Emigre fonts used to have heavy-side-up left quotes, but the foundry has since switched over to the more usual variety, to accomodate European languages, which is something that today's OpenType fonts are expected to do.</p>
      <p>So that's an historic AIGA document that you have.</p>
