    html: |-
      <p>Hi Billy</p>
      <p>Nothing quite so mind-boggling as students using 'prestigious' but <strong> anonymous </strong> sources to introduce confusion and doubt into the classroom? It happens all the time. </p>
      <p>When I asked a student last year if she'd had any design tutor feedback on her (truly execrable and off-brief) work, she told me in all seriousness '...but my mum thinks it's great!'</p>
      <p>Miss Tiffany is right; the default version above is the correct way of setting true quotes.</p>
      <p>If your students reckon they know more about setting type correctly than you do, then you could try running <a href="http://www.thinkingwithtype.com/">Marian Bantjes type test</a> on 'em. </p>
      <p>It includes the following question</p>
      <p><cite>19. True quotes<br>
      a. always look like little sixes and nines<br>
      b. have different looking opening and closing quotes<br>
      c. are always curly<br>
      d. are straight up and down</cite></p>
      <p>Which, although it doesn't provide a straight answer to your question, should reveal enough of your students ignorance to allow some clarification and correction to occur.</p>
