      <p>Hi there, </p>
      <p>There is a book called The elements of typorgraphic Style, which I am sure some of the regulars are aware of. On pages 86/87, Robert Bringhurst goes into detail about what quotation marks should be used when and where. I take it you are after the British/American version in which case you already have your answer. But it is interesting to know that other countries use them quite differently, SWeden for instance has them set “ “, so the same mark used twice, in Germany the first quote mark is set on the Baseline. And so on.. </p>
      <p>If you want to impress your students then digest this book. Its a good source of details to keep them quiet,</p>
