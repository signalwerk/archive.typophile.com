      <p>I hope this isn’t considered to be too much of a hijack but this thread seemed like a good place to pose this question which has bothered me for a while.</p>
      <p>Ok, so I know a lot of programs will change a prime into ‘ or ’ and an  inch symbol into “ or ”. But I do get tired of typing Alt+0145 (etc) into progs which don’t recognise that I’m trying to write an inverted comma or apostrophe... ...or an ellipsis for that matter...</p>
      <p>...so, do any of you typophiles know how I can change the keys 1, 2, 3, 4, 5, 6 etc. to output ‘, ’, “, ”, –, — etc?</p>
      <p>Also, am I right in thinking that 1234567890 are “spare” keys since I have two of each of them (my keyboard has a number pad on the right)?</p>
      <p>How do you guys deal with this problem daily? Have configured your keyboards differently to the default or do you only use software that  “knows” what you are trying to type? Or am I just missing something? Thanks for any input!</p>
