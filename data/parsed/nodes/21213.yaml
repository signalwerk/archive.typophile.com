      <p>There is another aspect of non standard quotation marks. If a common text with quotes is displayed in Verdana, it looks good in English, but inadequately in German. It looks better when the German end quote is replaced by the English end quote. But that means one must manualy replace all the quotes in a document. When the font is changed, the qoutation marks would be wrong.<br>
      I think designers should design standard quotes in every multilingual typefaces to allow the majority of users to use particular way of quoting. If one wants to create alternative forms of quotes, why not to create "quotedblleft.alt" glyph? There is even a Unicode position for "DOUBLE HIGH-REVERSED-9 QUOTATION MARK" at 201F.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/quot-marks_3888.gif"></div><p></p>
