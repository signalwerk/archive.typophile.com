      <p>Typographers' quotes are "tradition". At least for the English, Canadians and, even those that say "zee" rather than "zed".</p>
      <p>Hand set type was merely the comma(s) set "nick down" rather than "nick up". Hopefully I do not have to give a type anatomy lesson. This saved on matrices, spared room in the case for other needed characters. And frankly gives the written language a bit of extra zest. </p>
      <p>Naturally Monotype was not so lucky. They had to cut punches for both as did Linotype.</p>
      <p>Tradition is a "good thing".</p>
      <p>Giampa</p>
