      <p>I understand the original question came from a students confusion over conflicting advice; Billy doesn't mention what the subject is in his class, but I would guess that he is not teaching typographers, typophiles or prestige designers (who maybe learnt the rules before setting out to systematically break them).</p>
      <p>Anyway, he is teaching students. Misinformation and lack of practice are what most students bring to class; it's their function and they needn't be blamed for it, just corrected wherever possible.</p>
      <p>The original question was also not about 'merit' or variable practice – the student said they had been told to <strong>always</strong> flip the quote marks. This is not accepted practice; to suggest otherwise is simply to indulge wrongheadedness.</p>
