    html: |-
      <p><em>If a common text with quotes is displayed in Verdana, it looks good in English, but inadequately in German.</em></p>
      <p>As I pointed out, Europeans are less tolerant of variety in their quotes than Americans -- but there is actually an aesthetic reason, because the "high reversed 9 quote" provides symmetry in the English quote position (see hot sauce package), but not in German "low" position.</p>
      <p><em>There is even a Unicode position for “DOUBLE HIGH-REVERSED-9 QUOTATION MARK” at 201F.</em></p>
      <p>That doesn't make sense, because it is not a different character, just an alternate glyph, AFAIK.</p>
    html_clean: |-
