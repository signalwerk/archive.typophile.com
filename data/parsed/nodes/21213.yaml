      <p>Heavy-side up is the American way, from Benton (ATF Garamond) to Licko (Mrs Eaves, Filosofia, etc). No lies.</p>
      <p>However, it will become obselete as multi-encoded OTF fonts become the norm, which have to satisfy Europeans who are not so ambivalent about their quote-mark style.</p>
      <p>On a related note, the standard for the 'postrophe has changed thanks to "smart" layout software, which substitutes the "wrong" version.</p>
