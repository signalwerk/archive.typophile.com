    <p>I am a young adjunct professor at a community college, and today I was telling my class about the importance of using curly quotes or typographer's quotes. Well, one of my students said that she was told by a 'prestige designer' to always flip the quotes so the heavy sides are on top. Then another student said she was told to flip the quotes so the heavy sides are on the bottom. I have looked through my books and searched the internet for an answer because I have never heard this before. Is there any truth in what they are saying? I would appreciate any input on this because it is mind boggling. I've attached a GIF to demonstrate what they are referring to.</p>
    <img typeof="foaf:Image" class="img-responsive" src="http://www.typophile.com/sites/default/files/old-images/typographersQuotes.gif" width="548" height="442" alt="">
