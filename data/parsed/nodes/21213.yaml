      <p>The original question was "Is there any truth" [in the merit of heavy-side-up quote marks].</p>
      <p>Obviously, standard practice won't answer that. But it should be pointed out that typography is about standards, not rules.</p>
      <p>So, you can look at what's out there in the media and the specimen books, and 99.999% of English setting will be "default", or "standard" quotes. But this was a question to typophiles. Most of whom are conservative (it comes with the territory); but some typographers -- prestige or otherwise -- may want to try something different and daring (not quite Raygun, but nevermind). And it will be considered, rather than a mistake. That goes for the hot sauce package as well as this, from Emigre's <em>Mrs Eaves.</em> specimen booklet of 1996.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/MrsE_4398.jpg"></div><p></p>
