      <p>BTW, I gave the name of Jason Walcott's fonts incorrectly. They are the <a class="freelinking external" href="http://www.veer.com/search/results.aspx?keyword=Kon%20Tiki&amp;producttype=TYP&amp;pricemodel=RM%2CRF" rel="nofollow">Kon Tiki</a> family, and notice there is a <a class="freelinking external" href="http://www.veer.com/products/typedetail.aspx?image=JBT0000032" rel="nofollow">'Trader'</a>, which is similar, but not too much like the TJ's logotype. Apparently TJ's thought the House font was a closer match to their Hawaiian style.</p>
      <p>- Mike Yanega</p>
