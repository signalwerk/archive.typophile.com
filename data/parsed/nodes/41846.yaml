      <p>I think Patty is right about it being custom, like most logos. TJ's is interesting because most of their product labeling uses very recognizable fonts, and not their logo type, except to represent their brand name.</p>
      <p>I was surprised to see that apparently no one has asked this question here before, according to a Google search of this site.</p>
      <p>BTW, I also looked at Jason Walcott's Jukebox fonts at Veer. His Tiki family might have had some close ones, but actually they were less similar than Patty's suggestion.</p>
      <p>- Mike Yanega</p>
