      <p>I'm more convinced than ever that their logo is custom. See <a href="http://www.traderjoes.com/about_tjs.html" title="Click to visit an external URL." class="freelink freelink-external freelink-external">this page</a> from their own web site. The lettering of YOUR NEIGHBORHOOD GROCERY STORE is House <a href="http://www.traderjoes.com/about_tjs.html" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Tiki Magic</a>. If they had a 'Trader Joe's font' I doubt they would mix it with something so close on the same page. </p>
      <p>- Mike Yanega</p>
