      <p>BTW, I gave the name of Jason Walcott's fonts incorrectly. They are the <a href="http://Kon Tiki" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://Kon Tiki</a> family, and notice there is a <a href="http://&amp;#039;Trader&amp;#039;" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://'Trader'</a>, which is similar, but not too much like the TJ's logotype. Apparently TJ's thought the House font was a closer match to their Hawaiian style.</p>
      <p>- Mike Yanega</p>
