    date_raw: 4.Jun.2010 11.09pm
    votes: null
    html: |-
      <p>You could do it with a trigger glyph. So rather than having the context run backwards from the end of the selection you would insert the trigger glyph at the end of the selection and use that as the first context glyph. You would use a series of contextual lookups, something like this (using VOLT syntax; sorry, I don't do AFKDO):</p>
      <p>letter -&gt; letter.smallest<br>
      | trigger</p>
      <p>letter -&gt; letter.smallerstill<br>
      | letter.smallest</p>
      <p>letter -&gt; letter.smaller<br>
      | letter.smallerstill</p>
      <p>letter -&gt; letter.small<br>
      | letter.smaller</p>
      <p>and finally you would remove the trigger glyph from the string like this:</p>
      <p>letter.smallest trigger -&gt; letter.smallest</p>
