    html: |-
      <p>You could hack a trigger for context length like this:</p>
      <p>letter -&gt; letter.small<br>
      |   J 4</p>
      <p>followed by</p>
      <p>letter -&gt; letter.smaller<br>
      letter.small |</p>
      <p>letter -&gt; letter.smallerstill<br>
      letter.smaller |</p>
      <p>letter -&gt; letter.smallest<br>
      letter.smallerstill |</p>
      <p>and then</p>
      <p>letter.smallest J 4 -&gt; letter.smallest</p>
      <p>to remove the trigger glyphs.</p>
      <p>But just because it might be possible doesn't mean it's a good idea.</p>
