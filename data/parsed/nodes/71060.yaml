    html: |-
      <p>OT doesn't work on characters; it works on glyphs. There is no concept in OTL of 'end of selection'.</p>
      <p>Are you actually trying to reduce the size of the glyphs, as shown in your example, or is this just an illustration? In order to achieve this appearance using OTL, you font would need to contain sized alternates: you can't actually change the font size via OTL, and in any case a change of text size normally terminates a glyph run for OTL processing.</p>
