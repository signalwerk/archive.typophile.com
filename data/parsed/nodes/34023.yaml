    <p>Hi,</p>
    <p>I'm doing an advertorial for a magazine and I'm trying to pin the fonts, so I can layout the spread like the original magazine. </p>
    <p>- One font definetly looks like Apex New<br>
    - One – the large heading – looks like Helvetica black/heavy condensed – but has a different 'E'<br>
    – The serif I'm not sure about at all, other than it looks very familiar. The lowercase 't' puts me off trail (it's kinda like Bodoni, but not really)</p>
    <p>What are we looking at?</p>
    <p>Thanks a lot.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/scanorama_sans_6382.jpg"></div><p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/scanorama_serif_3799.jpg"></div><p></p>
