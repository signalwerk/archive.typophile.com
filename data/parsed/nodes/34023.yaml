      <p>Thanks for that link to the e-magin site, loremipsum. I had not seen this magazine before, and it's always instructive to see one's types in use.</p>
      <p>Peter was correct in his original post, the text sans is Apex New, and not Apex Sans. The numerals being used are the default hybrid/Scotch style, which are working well in running text.</p>
      <p>I wish that I could help with the text serif ID, beyond saying that it's not Miller or Mercury. In the sample inline above, there is a little bit of italic, which is very helpful. I'm not as good at IDing as I used to be, but I would say that one should look to older faces, perhaps something in the 5-15 year-old range.</p>
