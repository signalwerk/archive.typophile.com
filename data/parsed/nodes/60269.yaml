      <p>Rather than stressing the "enjoy and experience" aspect, I think you should aim towards utility. I suspect the blind would prefer something that is quick and easy to use.</p>
      <p>Also, define calendar. Today it can be a list of days, weeks, and months, or something that one puts appoints into (Outlook Calendar).</p>
      <p>Might as well define blind as well, since there are the totally blind, and those who have limited vision, yet are legally blind.</p>
