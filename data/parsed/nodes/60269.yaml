    html: |-
      <p>I watched my mother-in-law sign for many decades and ultimately had to teach our third child sign language as he did not speak until almost 4... nothing mind you except mama and dada and about 5 other words. </p>
      <p>Met a fellow (who was blind) when I was an art director, back in the early '90's, and we hit it off. My father was basically blind in one eye as a result of an eye injury in the war so I had a teeny bit of sensibilty about this dilemma. To this day my eyes are so empathetic that if some ones tears up I am a goner. After a couple of weeks of talk I asked my friend what he felt he missed in the seeing world. To my surprise he said "NOTHING." He loved textures, things he could feel, touch and smell. Well that was all I needed. I started bring him things that I found interesting to touch and smell. He said the nastiest thing was a wet spent Hibiscus blossom, the best smell was a Gardenia bloom and his girlfriends body was the best sensation in the world. </p>
      <p>Thanks for dredging up that friendship, he has since passed away.</p>
      <p>Texture and odor might be the way to go. </p>
      <p>It's odd now that I have typed this I remember I did a cover and inside lettering for a book by Random House called "The Stinky Book." Loaded with scratch and sniff....... what fun : )</p>
      <p>Michael</p>
