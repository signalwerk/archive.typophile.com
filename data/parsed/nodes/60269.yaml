      <p>For an invitation, in a context involving the <em>visually impaired</em> (you may wish want to consider that nomenclature if you already haven't), I would start playing with giant embossed type, with black ink printed and registered on top of the embossment. I'd want to see it from 100 feet away and feel it with my eyes closed.</p>
      <p>Old fashioned eye charts might be a reference, and there's  <a class="freelinking external" href="http://psych.nyu.edu/pelli/software.html" rel="nofollow">the Sloan font</a> (scroll down about three screens and there’s a little blue link to download. It’s free).</p><div class="imageWrap"><img src="http://typophile.com/files/eyechart_5678.jpg"></div><p></p>
