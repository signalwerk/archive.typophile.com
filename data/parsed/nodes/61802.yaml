  html: |-
    <p>So I really want to use neutraface for a corporate identity—from logo through to brochure copy.</p>
    <p>However, the uppercase E really bothers me. It’s too modern. I think the face would be perfect if it weren’t for that one character, which is used in typesetting the company’s name. </p>
    <p>On the House Industries website they show the large N from neutraface—but the text below it—that E is different, and I can’t seem to find an alternate version in the Try Font feature..</p>
    <p>Is that neutraface or not? A different cut of Futura than what I have? (the R in that looks much better than mine).</p>
    <p>What is that?</p>
    <p><a href="http://www.houseind.com/include/getimage.php?id=8002" title="http://www.houseind.com/include/getimage.php?id=8002">http://www.houseind.com/include/getimage.php?id=8002</a></p>
