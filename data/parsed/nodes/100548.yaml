    <p>Dear typophiles,</p>
    <p>We recently released U8, a new typeface designed by Anton Koovit that has taken him through the Berlin subway system to research the signs used on the line 8 (U-Bahn 8 = U8 as it is called in Berlin). </p>
    <p>Below is the slightly more formal presentation text, as well as some images.<br>
    Also note that all our typefaces can now be downloaded in trial versions.<br>
    Don't hesitate to give them a try.</p>
    <p><img src="http://www.fatype.com/fatype/U8_650/U8_1.jpg"><br>
    <img src="http://www.fatype.com/fatype/U8_650/U8_2.jpg"><br>
    <img src="http://www.fatype.com/fatype/U8_650/U8_4.jpg"><br>
    <img src="http://www.fatype.com/fatype/U8_650/U8_6.jpg"><br>
    <img src="http://www.fatype.com/fatype/U8_650/U8_8.jpg"><br>
    <img src="http://www.fatype.com/fatype/U8_650/U8_9.jpg"></p>
    <p>We are very pleased to present the latest addition to our growing collection of retail typefaces: U8, a new geometric sans serif, with seven weights, designed by Anton Koovit.</p>
    <p>Anton started U8 as a research project about the Berlin subway system signage and particularly the U8 line that connects the northern borough of Reinickendorf with Neukölln in the south of the city, through the Alexanderplatz junction. His goals were to restore a piece of history, research a link between the DIN and Bauhaus, and translate the lettering of individual handcrafted station signage into a formal typeface. Apart from the regular weight’s upper and lower case, glyphs such as numbers, and other weights, had to be created by the designer, allowing for his contemporary interpretation. The result is an early modernist typeface, with wider proportions than most common geometric sans, a strong character, and a clean design. Initially intended for display purposes, U8 has proven to work well in text sizes. The typeface comes with a full character set for western and eastern european languages, and a number of OpenType features such as ligatures, smaller figures for text, tabular figures and fractions. Italic styles will also be released in a few months.</p>
    <p><a href="http://www.fatype.com" title="http://www.fatype.com">http://www.fatype.com</a></p>
