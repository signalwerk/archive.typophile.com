      <p>The bumps on the letters are called center spurs.<br>
      This type of font could be called Spurred Roman. Very popular in the mid 19th century and often classified as Western or Wild West.<br>
      I did not find an exact match.<br>
      I found one in a heavier weight, called Cowboy Western, from Font Mesa:<br>
      <a href="http://www.myfonts.com/fonts/fontmesa/cowboy-western/" title="http://www.myfonts.com/fonts/fontmesa/cowboy-western/">http://www.myfonts.com/fonts/fontmesa/cowboy-western/</a><br>
      There are also some fonts in the Western category at dafont.com:<br>
      Saddlebag by Dieter Steffmann,  K22 Ambelyn by Toto, &amp; Let Me Ride by  Måns Grebäck.<br>
      Don</p>
