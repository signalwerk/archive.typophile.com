    html: |-
      <p>If you are happy with Stahl's Tiffany -- a Tuscan with split stems rather than the flat ends used on the Nike jacket -- this simplifies your font search. However, if some of the comments I encountered in a web search are accurate, Stahl's Tiffany is popular with makers of T-shirts and other casual items but they find it difficult to purchase separately.<br>
      This is not a major problem as the general design of spurred Tuscan fonts has been generic since the mid 19th century. It should not be too difficult to find a spurred Tuscan with low contrast and weight similar to the Nike font and Stahl's Tiffany for purchase, or even a free version with sufficient quality. A search of Myfonts using "Wild West" produced several spurred Tuscans that you might review: Hessian, Miss. Scarlett, URW Wood Type, Saloon Girl, Buckhorn, H74 Warriors [mentioned already by Ryuk], and Saloon. Dafont has similar free versions.<br>
      Don</p>
