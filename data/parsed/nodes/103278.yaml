      <p>Don't have a match (yet!). The closest I have is <a class="freelinking external" href="http://www.myfonts.com/fonts/hydro74/h74-warriors" rel="nofollow">H74 Warriors</a>. I'm pretty convinced it is a font and not a hand-lanterring. You can see <a class="freelinking external" href="http://m.hypebeast.com/2011/1/edison-chen-x-nike-sportswear-destroyer-jacket" rel="nofollow">here</a> some photos of the making process, one showing the typeset under Illustrator. You could also have a look to the video and around 1'09, there's a black flag with the type. That could be useful to printscreen and upload it here to make identification process easier.</p>
