    html: |-
      <p>Reworked sample looks good!<br>
      Easy for someone to font.  As for additional letters of the uppercase alphabet we already have info on C, L, P &amp; K. The remainder are generally obvious -- S &amp; Z on the diagonal; J probably wide &amp; not below baseline;  M &amp; W a couple of versions. Only the tail on Q is a complete unknown.<br>
      As far as I understand copyright law [American &amp; related] there is no restriction on creating a font, or an eps file, based on an image. But use of the digital outlines in a font is a violation. [See the Stone case and the "distinctive" r.]<br>
      Don</p>
