      <p>The Nike sample is useful. It reveals the spur placement for more letters. Fortunately no surprises here. After all the design is about 170 years old. Spur placement and inclusion or not on various strokes varied from font to font.<br>
      I note that the weight shown in this image is a little heavier than the original image, perhaps due to blurring.<br>
      Presumably the actual Nike font is a match.<br>
      By the way, the letters shown in my previous post would need to be heavier to match the original image and the serifs adjusted to match.<br>
      Don</p>
