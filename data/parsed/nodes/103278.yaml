      <p>H74 Warriors is a nice font for showing placement of spurs. But the base letterform shown in the sample image is a Roman with a unified base and top for the stems, rather than the split or bifurcated stems used in H74 Warriors. This type of letterform is in the group labelled Tuscan. There was a good discussion of the Tuscan Letterform four years ago at <a href="http://typophile.com/node/41566" title="http://typophile.com/node/41566">http://typophile.com/node/41566</a> And for people who read books there is a substantial chapter on the Tuscan letterform in Nicollete Grey's Nineteenth Century Ornamented Type.<br>
      Don</p>
