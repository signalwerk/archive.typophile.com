      <p>Perhaps the base font for Bowery Rat Pack is Goudy's Copperplate Gothic Condensed Bold:<br>
      <a href="http://www.myfonts.com/fonts/urw/copperplate/" title="http://www.myfonts.com/fonts/urw/copperplate/">http://www.myfonts.com/fonts/urw/copperplate/</a><br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/CopperplateCondbold_5208.jpg"></div><br>
      For a more emphatic treatment of the serifs see M. D. Adkins and James L Stirling's Copper Penny from The Fontry, "a tribute" to Goudy's font:<br>
      <a href="http://www.myfonts.com/fonts/fontry/copper-penny/" title="http://www.myfonts.com/fonts/fontry/copper-penny/">http://www.myfonts.com/fonts/fontry/copper-penny/</a><br>
      Do some letterform adjustments to match the samples, add spurs, &amp; voila you have Bowery Rat Pack.<br>
      Don<p></p>
