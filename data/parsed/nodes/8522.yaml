    html: <p>Jill you might also look into is using your standard Helvetica and get a copy of Machine Wash by Mr. Retro. What it does is creates a layer mask in photoshop with its distressed look options. That the beauty of it because it doesn't actually destroy the type. So when your client changes a word, no problem.</p>
