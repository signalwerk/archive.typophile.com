  html: <p>I use fontlab 4.5.1 on osx. I have a problem with the  <br>preview window and the '@' glyph. Whenever I have <br>the @ glyph previewing, it shows whatever is in the <br>glyph window instead of what is actually in the cell. <br>Does anybody have a solution or have the same  <br>problem?</p>
  html_clean: <p>I use fontlab 4.5.1 on osx. I have a problem with the  <br>preview window and the '@' glyph. Whenever I have <br>the @ glyph previewing, it shows whatever is in the <br>glyph window instead of what is actually in the cell. <br>Does anybody have a solution or have the same  <br>problem?</p>
