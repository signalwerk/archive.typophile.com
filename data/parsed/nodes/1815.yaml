    html: <p>This is a feature. The @ sign is a wildcard, which shows the currently selected glyph. This is very useful because you can build a small set of preview strings to check any glyph in particular contexts, e.g. <a href="mailto:nn@nn">nn@nn</a> and <a href="mailto:oo@oo">oo@oo</a> for basic spacing tests. <br> <br>If you need to display the @ sign in the preview window, use the convention /at . The slash is an escape character in preview strings after which you can identify a glyph by its name. <br> <br>You can also use the convention \XXXX in which the variable is a Unicode character hex value.</p>
    html_clean: <p>This is a feature. The @ sign is a wildcard, which shows the currently selected glyph. This is very useful because you can build a small set of preview strings to check any glyph in particular contexts, e.g. <a href="mailto:nn@nn">nn@nn</a> and <a href="mailto:oo@oo">oo@oo</a> for basic spacing tests. <br> <br>If you need to display the @ sign in the preview window, use the convention /at . The slash is an escape character in preview strings after which you can identify a glyph by its name. <br> <br>You can also use the convention \XXXX in which the variable is a Unicode character hex value.</p>
