    html: <p>That's not a problem, that's a feature. That's what the @  <br>character does in the preview panel. If you want to see the  <br>@ character, and not what's in the glyph window, type "/at".  <br>You can do this for any character that can't easily be typed  <br>or can't be typed at all. Just type a slash followed by the  <br>name of the character. You may need to type a space after  <br>depending on what follows.</p>
