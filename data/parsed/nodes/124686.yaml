    html: |-
      <p>It would not work without some corrections, for instance for oacute because your rule is</p>
      <p>sub oacute s' by oacute_s.fina;</p>
      <p>which asks to substitute the final s by oacute_s.fina when preceded by a oacute. You probably meant</p>
      <p>sub oacute_s' by oacute_s.fina;</p>
      <p>The rule for o_s does not have that problem and does not work either. Here is what I would try. I would simply put the rules for o_s in a third lookup, that would take o_s and replace it with o_s.fina,  otilde_s by otilde_s.fina etc. That would give three passes for each line of input text, a first lookup that fixes the initials, a second lookup that fixes the final o, b_s w_s etc and a third lookup that fixes the o_s etc.</p>
      <p>Be careful. The lookups are the actual code that is executed. If you want the three lookups to be executed in some order,  you need to put them in that order in your feature file. The order they are listed in calt is irrelevant.</p>
