    html: |-
      <p>I completed a connecting script a few months ago. My first attempts at making it more automatic worked but since there are some inherent weaknesses in OpenType feature code it would have led to frustration on the part of the end user so I abandoned that.</p>
      <p>To simplify it, I set it up to make using the beginning alternate glyphs and the ending alternate glyphs easier for the end user. I used the code in a Stylistic Set, as follows:</p>
      <p>For ending strokes: sub zcaron' space by zcaron.fina;<br>
      For beginning strokes: sub space a' by a.init;</p>
      <p>You will have to have a similar line for each alternate glyph you wish to substitute. You don't need the /ignore line you currently have. </p>
      <p>Your client must have software that supports Stylistic Sets too.</p>
    html_clean: |-
