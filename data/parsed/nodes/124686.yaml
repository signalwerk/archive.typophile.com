    html: |-
      <p>The way to go (which works with FontForge, there should be a way with Fontlab) is to give yourself two lookups, one to substitute the first letter, which is just</p>
      <p>lookup subfirst {<br>
        ignore sub  @LETTER s';<br>
        sub s' by s.init;<br>
      } subfirst ;</p>
      <p>The second lookup, for the last letter can simply take the form</p>
      <p>lookup sublast {<br>
        ignore sub @LETTER' @LETTER  ;<br>
        sub s' by s.fina;<br>
        [...]<br>
        sub otilde' by otilde.fina;<br>
        sub odieresis' by odieresis.fina;<br>
      } sublast;</p>
      <p>The first line says not to substitute a letter when followed by a letter. Then you list the substitutions for the last letters. Then you simply use the feature calt as follows</p>
      <p>feature calt {<br>
          lookup subfirst ;<br>
          lookup sublast  ;<br>
      } calt;</p>
      <p>where the first lookup takes care of the first letter, and the second lookup takes care of the last letter (they are applied one after the other line by line). Of course you need to include in LETTER  s.init if ss may occur at the beginning of a word, and maybe other characters. Be careful, there is just one apostrophe per line which corresponds to the glyph (or class of glyphs) that is to be substituted.</p>
