    html: |-
      <p>The fact that it’s show only on a plaque led me to believe it’s not a “font” as we mean the term.<br>
      The G would prove especially difficult to match.<br>
      In a similar vein, you could look at something like Biondi (<a href="http://www.myfonts.com/fonts/typodermic/biondi/" title="http://www.myfonts.com/fonts/typodermic/biondi/">http://www.myfonts.com/fonts/typodermic/biondi/</a>) or something from Letterhead Fonts (<a href="http://www.letterheadfonts.com/" title="http://www.letterheadfonts.com/">http://www.letterheadfonts.com/</a>) more on the “octagonal” side there’s this (<a href="http://www.myfonts.com/fonts/letterheadfonts/lhf-antique-half-bock/" title="http://www.myfonts.com/fonts/letterheadfonts/lhf-antique-half-bock/">http://www.myfonts.com/fonts/letterheadfonts/lhf-antique-half-bock/</a>), for example.</p>
