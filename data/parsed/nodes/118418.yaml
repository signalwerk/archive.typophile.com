    html: |-
      <p>For digital equivalents, looks like a mash-up of Kobalt (most of the letters) and Eagle Bold (C, S):</p>
      <p><a href="http://www.myfonts.com/fonts/itc/kobalt/std-bold/" title="http://www.myfonts.com/fonts/itc/kobalt/std-bold/">http://www.myfonts.com/fonts/itc/kobalt/std-bold/</a><br>
      <a href="http://www.myfonts.com/fonts/fontbureau/eagle/" title="http://www.myfonts.com/fonts/fontbureau/eagle/">http://www.myfonts.com/fonts/fontbureau/eagle/</a></p>
      <p>It's entirely possible that the original signmaker took his inspiration from older type samples (the original Eagle Bold was designed in 1933 by Morris Fuller Benton; Kobalt was created by Leslie Cabarga in 2007, but based on Art Deco typefaces from the same period as Eagle Bold).</p>
