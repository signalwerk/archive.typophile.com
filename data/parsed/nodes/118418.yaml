    html: |-
      <p>EDITED:<br>
      I note that the Dom Polski Centre is located in Australia <a href="http://dompolski.com.au/our-centre-3" title="http://dompolski.com.au/our-centre-3">http://dompolski.com.au/our-centre-3</a><br>
      What would a 1970s Australian designer use as inspiration for the _DOM POLSKI CENTRE_ sign?<br>
      Something from Poland?<br>
      Something from Australia?<br>
      One, as already mentioned, would be Eagle Bold drawn in 1933 for the National Recovery Association.<br>
      Others could include  the 1930s designs of Alessandro Butti for Nebiolo. Few are digitized. Some letterforms that are echoed in _DOM POLSKI CENTRE_  are found in Semplicità. See Simplo <a href="http://www.myfonts.com/fonts/durotype/simplo/" title="http://www.myfonts.com/fonts/durotype/simplo/">http://www.myfonts.com/fonts/durotype/simplo/</a>  and Semplicita <a href="http://www.myfonts.com/fonts/canadatype/semplicita-pro/" title="http://www.myfonts.com/fonts/canadatype/semplicita-pro/">http://www.myfonts.com/fonts/canadatype/semplicita-pro/</a><br>
      Don</p>
