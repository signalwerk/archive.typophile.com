    html: <p>Jonathan <br> <br>NA Graphics bought out Vandercook some years ago but still has replacement parts and various materials and supplies. <br> <br>NA Graphics  Fritz Klinke  P O Box 467, 1314 Greene Street, Silverton, CO 81433  970-387-0212  <a href="mailto:nagraph@frontier.net">nagraph@frontier.net</a>  <br> <br>Gerald's items, in Vandercook-speak, would be top blankets (drawsheets), under blankets, undersheets (.006 manila). NAG has a catalog. Basically a mylar top blanket and Kimlon under blanket (about $50) will do you, along with the undersheets. These are all cut to fit your press, which had a long production life, so there are still lots of parts, etc. On a Vandercook, various thicknesses of professional grade tracing paper will work nicely for minor makeready (actually taped directly to the tympan - Vandercooks aren't exactly production presses and aren't all that fussy). NAG also has a lithographer's sheet, called generically, non-slip paper, in various thicknesses. Works well as makeready and/or as an undersheet. <br> <br>No real outlet for any of this stuff in LA anymore.</p>
