    html: <p><i>American Printing Supplies, New York.</i> My memory for names is  terrible! <br> <br>If not, take the best samples of your packing, or exact measurements with <i>crease and angle measurements</i> to a die cutter. You will need, if you don't have them, <i>tympan, make ready</i> and <i>under sheets.</i> Complexity is in the same order. <br> <br>You can make them up on your own. The paper is generally sold in rolls. The rolls are expensive. <i>Close to the core</i> makes inferior packing. The results, unless you are professional, will predictably cause difficulty in giving equal <i>Drum Tone.</i> <br> <br>Gerald Lange, or Jim Rimmer may have other suggestions. <br></p>
