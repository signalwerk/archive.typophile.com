  html: <p>Does anyone know if it is possible to find replacement jacket and packing for the impression cylinder of a Vandercook 4 press? <br> <br>Any sources in the Los Angeles, California area?</p>
  html_clean: <p>Does anyone know if it is possible to find replacement jacket and packing for the impression cylinder of a Vandercook 4 press? <br> <br>Any sources in the Los Angeles, California area?</p>
