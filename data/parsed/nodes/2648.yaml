    html: <p>Johnathan <br> <br>On top of the other advice you have received from G and G, I use old litho plates as bottom packing. This is cheaper than using up you oiled packing paper, and makes for clean impression, and is easy on your type. <br> <br>I have made a cardstock template of the tympan for my press, and cut pieces to this size and shape from a fat roll of oiled packing paper. <br> <br>Jim</p>
