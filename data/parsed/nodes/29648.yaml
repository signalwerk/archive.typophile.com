      <p>I'm wrestling with this myself as I fumble to build my first OpenType font: I have a variety of replacement glyphs (liga, dlig, calt, salt, etc.) and, as you say, there are already "switches" for liga, dlig, calt, but when it comes to salt glyphs things get more complicated.</p>
      <p>For instance, I have K &amp; R with long tails, an extra tall T, an o_f, an I_O_U &amp; O_U, a C_E, etc. Yet each of these would be complete overkill if they were "turned on," thus setting any/each/all of them into a sset doesn't make a lot of sense. I'm not quite up on the coding to randomly insert these things, but if such randomization is possible (say, every 3rd IOU would get I_O_U), that's what I'd like to build into a sset.</p>
      <p>Not sure at all if this counts as a response to your query, but these are the things I'm considering as I continue to fumble along.</p>
