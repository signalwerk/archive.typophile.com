      <p>Choz &gt; On another note, where are &lt;21&gt; through &lt;99&gt;? :)</p>
      <p>OpenType Layout feature tags "ss21" to "ss99" are not registered by Microsoft. However, font developers are free to include unregistered OpenType Layout feature tags in their fonts. Most applications will not support these but those applications that give the user direct access to all OpenType Layout feature tags included in the font will (e.g. XeTeX, GlyphGate, the Glyph Palette in InDesign CS2 or Illustrator CS2).  </p>
      <p>Karsten &gt; add English names, but no further localization</p>
      <p>Why only English and not only Japanese or only Arabic? </p>
      <p>A.</p>
