      <p>Choz, </p>
      <p>if the user wants small-cap-sized lining numerals, the most likely way he'd want to access them would be through the smcp feature, I think. Consider that you have six sets of figures in your font:<br>
      one -- uppercase lining proportional<br>
      one.lnum_tnum -- uppercase lining tabular<br>
      one.onum_pnum -- text oldstyle proportional<br>
      one.onum_tnum -- text oldstyle tabular<br>
      one.pnum_smcp -- small-caps lining proportional<br>
      one.smcp_tnum -- small-caps lining tabular</p>
      <p>In this case, a thorough approach for implementing the OpenType Layout features could be as follows (of course, instead of "one", the real implementation would take care of entire classes): </p>
      <p>feature smcp {<br>
        sub one by one.pnum_smcp;<br>
        sub one.onum_pnum by one.pnum_smcp;<br>
        sub one.onum_tnum by one.smcp_tnum;<br>
        sub one.lnum_tnum by one.smcp_tnum;<br>
      } smcp;<br>
      feature lnum {<br>
        sub one.onum_pnum by one;<br>
        sub one.onum_tnum by one.lnum_tnum;<br>
      } lnum;<br>
      feature onum {<br>
        sub one by one.onum_pnum;<br>
        sub one.lnum_tnum by one.onum_tnum;<br>
        sub one.pnum_smcp by one.onum_pnum;<br>
        sub one.smcp_tnum by one.onum_tnum;<br>
      } onum;<br>
      feature pnum {<br>
        sub one.lnum_tnum by one;<br>
        sub one.onum_tnum by one.onum_pnum;<br>
        sub one.smcp_tnum by one.pnum_smcp;<br>
      } pnum;<br>
      feature tnum {<br>
        sub one by one.lnum_tnum;<br>
        sub one.onum_pnum by one.onum_tnum;<br>
        sub one.pnum_smcp by one.smcp_tnum;<br>
      } tnum; </p>
      <p>Using this approach, in InDesign, the user would get the small cap lining proportional figures by selecting "Small Caps" combined with "Default Figure Style" or with "Proportional Lining", while he'd get the small cap lining tabular figures by selecting "Small Caps" combined with "Tabular Lining". Selecting "Small Caps" in combination with "Proportional Oldstyle" or with "Tabular Oldstyle" would give the user small cap letters mixed with the text oldstyle figures (proportional or tabular, respectively). </p>
      <p>I don't quite see the reason why anyone would need a new feature for small-cap figures only. </p>
      <p>(Edit: This post is really more appropriate for this thread: <a href="http://typophile.com/node/29580" title="http://typophile.com/node/29580">http://typophile.com/node/29580</a> so I apologize for cross-posting.)</p>
      <p>A.</p>
