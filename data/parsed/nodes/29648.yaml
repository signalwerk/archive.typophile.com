      <p>Also, Christopher, please note that the Adobe InDesign UI for selecting stylistic sets is additive, not mutually exclusive (checkboxes rather than radio buttons). This suggests that each ssXX feature may very well operate on a very small set of glyphs (even single ones) rather than always referring to an entire alphabet. </p>
      <p>In Zapfino Extra Pro, ss01-ss04 indeed exchange entire alphabets, switching between the four basic sets of Zapfino, but ss05-ss10 give access to alternates for those glyphs that have more than four alternate forms, which are, of course, less and less for the latter sets. For example "ss09" only gives access to three glyph alternates ("d", "e" and "t") as these are the glyphs with the highest number of variants in the font. </p>
      <p>I don't see anything inherently wrong with that approach especially that there is no really plausible way for the OpenType spec to specify what the minimal size of a "set" should be for ssXX. </p>
      <p>Adam</p>
