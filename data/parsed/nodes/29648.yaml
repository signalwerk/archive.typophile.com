      <p>You have a choice of two: Microsoft VOLT (which is WYSIWYG and pretty friendly for the simple stuff, although it has some rough edges for the more complicated tasks) and AFDKO/FontLab Studio which uses the text-based notation developed by Adobe. It is not entirely WYSIWYG but allows pretty rapid development and easy re-use of the code. </p>
