      <p>As I understand it, it's not really appropriate to put a single alternate in 'ss**'. A stylistic set should be a set of stylistically-related alternates to be activated all at once (as the name implies).</p>
      <p>The problem, I think, is that if one wants to apply a single alternate to appear throughout all their text, one cannot just select everything and apply 'salt' (without getting alternates of a bunch of other letters at the same time). There've been some abstract hallway discussions about how applications should offer a user a way to make such a setting – saying essentially, "Apply 'salt' to just the letter 'a' everywhere." This is part of the difficult problem of deciding what is rightly handled inside the font, and what's rightly handled by the application UI. (And then maybe we have to wait around for an app which does it!)</p>
