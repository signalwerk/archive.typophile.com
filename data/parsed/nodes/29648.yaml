      <p>My own practice of codifying "salt" vs. "ssXX" is that I completely duplicate those two. However, I put one-to-one-from-many substitutions into "salt" and "one-to-one" substitutions into "ss01"-"ss20". For example, if a font has two variant "a"s, one variant "b" and three variant "c"s, I'd define the features as follows: </p>
      <p>feature salt {<br>
        sub a from [a.1 a.2];<br>
        sub b from [b.1];<br>
        sub c from [c.1 c.2 c.3];<br>
      } salt; </p>
      <p>feature ss01 {<br>
        sub a by a.1;<br>
        sub b by b.1;<br>
        sub c by c.1;<br>
      } ss01; </p>
      <p>feature ss02 {<br>
        sub a by a.2;<br>
        sub c by c.2;<br>
      } ss02; </p>
      <p>feature ss03 {<br>
        sub c by c.3;<br>
      } ss03; </p>
      <p>I also don't think there is nothing conceptually wrong in associating the same substitutions with different features -- if a substitution can serve both a semantic and a stylistic purpose, or if a certain feature is not really widely supported. </p>
      <p>For example, if I have a swash "R" glyph with a really long tail that is mostly suitable to be put at the end of words, I'd associate it with both the "fina" and the "swsh" feature. Similarly, if I have two set of small caps in my font, I'd associate the first one with "smcp", while I'd put the second one into "pcap" but also as "ss01" of the normal small caps: </p>
      <p>feature smcp {<br>
        sub a by A.smcp;<br>
        ...<br>
      } smcp; </p>
      <p>feature pcap {<br>
        sub a by A.pcap;<br>
        ...<br>
      } pcap; </p>
      <p>feature ss01 {<br>
        sub A.smcp by A.pcap;<br>
        ...<br>
      } ss01; </p>
      <p>(And of course if there is a "ss01" feature, I'd also place this into "salt" because ssXX and salt are to me really just different ways of organizing the same information.) </p>
      <p>A.</p>
