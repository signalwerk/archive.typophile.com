      <p><em>Is there a better solution to handle optical sizes?</em></p>
      <p>It should be handled by the application, in a similar manner to Quark's "Tracking Utility", which enables the user to set different tracking values for a font, according to the size it is used.</p>
      <p>The Optical Scale utility would say:</p>
      <p>Font Family: Harmony<br>
      72+ pt: Harmony Poster<br>
      36-72pt; Harmony Display<br>
      18-36pt: Harmony Subhead<br>
      12-18pt: Harmony Caption<br>
      9-12pt; Harmony Text<br>
      less than 9pt: Harmony Small</p>
      <p>This is an example for a family with six optical sizes, if such a thing exists.<br>
      The user would determine which sizes are appropriate for the different optical sizes.</p>
