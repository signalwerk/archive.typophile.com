      <p>"Track": All the things that you mentioned explicitly already have OpenType layout features defined and supported - no need for stylistic sets for them.</p>
      <p>Choz: Although the OpenType layout features may continue to expand, I expect that the remaining expansion of typographic (as opposed to linguistic) features will be minimal. For a lot of things that are relatively uncommon, stylistic sets take away the impetus to cover them with their own separate features.</p>
      <p>The OpenType feature tag registry can be expanded by Microsoft and Adobe. All you need to do is write up a formal proposal in the same format as the other feature tags, and maybe some backing explanation for why you think this feature is important. Post it to the OpenType list.</p>
      <p>Alternatively, you can go through the Open Font Format, which is under ISO. It's under the MPEG spec, and you'd go through your national body, either working with somebody who's a member of the MPEG working group, or joining the group yourself. This all gets a bit more complicated, and I must admit that I don't know all the ins and outs.</p>
      <p>Chris: You may indeed have misunderstood what I was suggesting. I was suggesting that you put together a proposal for *how* in any given font the stylistic sets would relate to user-friendly UI name strings. I wasn't particularly suggesting that there be a central registry of UI strings. Heck, the spec doesn't even do that for the *existing* layout features!</p>
      <p>Cheers,</p>
      <p>T</p>
