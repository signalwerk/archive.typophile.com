      <p>It depends on the project but you can find people who'll charge $200-$300 for a fairly straightforward font family up to $2000-$3000 if the font involves complex contextual substitutions. If you want additional consulting on things like character sets, glyph naming, font naming etc., the amount will likely double. If extra work needs to be done on the font (merging of character sets, copying of kerning information, hinting etc.), this of course adds up, too. </p>
      <p>These amounts are usually per a unique set of fonts. If your regular, your light and your bold have the same character set, you'll be able to split the price between them, arriving at a price of $50-$100 (for as simple font), and that's a price that is compensated after 2-3 sales of the font. If your italics have the same character set, that's also included -- if they're different (e.g. extra ligatures), some 50% more would apply. </p>
      <p>There may be some colleagues out there who are slightly cheaper. </p>
      <p>Adam</p>
