      <p>Would it be appropriate to put Optical Sizes into the Stylistic Sets, like</p>
      <p><code>ss01: Body Text<br>
      ss02: Caption<br>
      ss03: Subhead<br>
      ss04: Display<br>
      ss05: Poster</code></p>
      <p>and so on? Adobe uses different fonts for those, properly style-linked so that they appear in the font panel's dropdown menu. Apart from a cluttered menu, the big issue with this approach is that switching between optical sizes (styles), disorders the weight, width and style (!) formatting within the text. When, for example, a certain string was marked as italic and the overall formatting of the text bloc that holds the string has Caption applied, one is forced to do the italic formatting over at every single instance, if suddenly the text bloc needed to be set in Subhead. (That is, if no character and/or paragraph styles are used.)</p>
      <p>Stylistic Sets might offer a solution to this problem, although it would imply that the actual font would hold twice, thrice or too many more glyph sets. Is there a better solution to handle optical sizes? (Suppose, in addition, that one might want to create a family with optical sizes for every single point size…)</p>
      <p>Stylistic Sets could perhaps more effectively be used for width and style (!) styles proper, e.g.</p>
      <p><code>ss01: Book<br>
      ss02: Bold<br>
      ss03: Light<br>
      ss04: SemiBold<br>
      ss05: Black<br>
      ss06: ExtraBlack</code></p>
      <p>or similarly:</p>
      <p><code>ss07: RegularWidth<br>
      ss08: Condensed<br>
      ss09: Extended</code></p>
      <p>and, taking advance of the fact that Stylist Sets are additive:</p>
      <p><code>[×] ss04: SemiBold<br>
      [×] ss08: Condensed</code></p>
