      <p>I really like a font to have a set of pre-made superiors and inferiors, or nut/em fractions. Maybe I am just lazy, but every font is different, and there is no real formula for making fractions if you need to. Projects that involve lots of fractions are a nightmare sometimes, simply for this reason. I hate having to sit and optically adjust the size of each number, the kerning between it and the solidus, and typically, the size of the solidus itself.</p>
      <p>Feminine and Masculine ordinals are nice to have, even though I have myself never had to make use of any. These seem to be becoming more popular today.</p>
      <p>Off the top of my head, I like to think of Whitney by H&amp;FJ as one of the most complete fonts, in terms of it's plethora of typographic elements. Certainly, it was designed with specific parameters in mind, and absolute necessities for the Whitney Museum, but can none of these more obscure features become more standard in OT fonts?</p>
