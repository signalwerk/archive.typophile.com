      <p>I have submitted the following message to the OpenType list. All interested parties who are not subscribed to the OpenType list are invited to join at: <a href="mailto:opentype-migration-sub@indx.co.uk">opentype-migration-sub@indx.co.uk</a></p>
      <p>==</p>
      <p>A set of twenty new name IDs is reserved in the "name" table to represent user-friendly labels for OpenType stylistic sets. </p>
      <p>The new name IDs range from 31 to 50, corresponding to the OpenType Layout feature tags ss01-ss20 (name ID 31 represents a label for the "ss01" feature, name ID 45 represents a label for the "ss15" feature etc.) </p>
      <p>When an OpenType-savvy application examines an OpenType font and finds a user-friendly label for a stylistic set included in a font, that label should be displayed instead of a generic label such as "Stylistic Set 4". </p>
      <p>The new name IDs need only to be specified for platform "3" and encoding "1". Typically, a font developer specifies the user-friendly label in the 1033 (U.S. English) language, but any valid Microsoft Language ID can be used. If the font does not contain a label in the language of the application user interface but contains a U.S. English label, the application may choose to display that name; alternatively, it may choose to display a localized generic label (e.g. "Zestaw stylistyczny 4" for Polish). </p>
      <p>For a given Microsoft Language ID, a particular name ID represents the user-friendly label for the corresponding ssXX feature across all writing systems and language systems defined in the font. If a stylistic set feature is implemented differently across scripts and language systems (e.g. one substitution is done in the ss01 feature for the Arabic script, and another, visually unrelated substitution is done in the ss01 feature for the Latin script), the font developer should pick a user-friendly label that adequately describes all these behaviors collectively, or should not specify user-friendly labels for such font. </p>
      <p>==</p>
      <p>Adam</p>
