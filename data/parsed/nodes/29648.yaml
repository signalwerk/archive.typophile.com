      <p>I’m currently designing a font where the Stylistic Set 01 has capitals with a discrete little “swash” on the upper left side (Like in the letters B D E F R P etc). This makes the whole font look a little bit different, it’s like another cut of the typeface, so therefor it feels just like a Stylistic set.</p>
      <p>On stylistic set 02 I have put Unicase letters.</p>
      <p>On another font I decided to make some of the stems thinner in the Stylistic Set 01.</p>
      <p>So for me, the Stylistic Sets are a very nice place to include something that effects the whole font in a way or another.</p>
      <p>Another thing that could be included is bold and italic. I mean, why not? Of course it gives a hell of big document, but maybe it would be nice for the user? Just an idea.</p>
