      <p>If I understand correctly, you would detail a glyph substitution set for each character you wanted to randomize, using the &lt;rand&gt; feature. If you are using VOLT, and you have the alternates in the same sequence as the primaries, you can do this more easily with glyph groups. However, last I heard, there are no OpenType applications that support this yet. That was from some website, some time ago, so it may not be the case now. If it is still the case, perhaps you might use any other OpenType feature that defaults to 'on', and just make explicit substitutions that compliment your general design. Like, make  K+N always use K#3 and N#1, and K+n always use K#2 and n#2?</p>
