      <p>Descriptive names for ssXX features:</p>
      <p>A (whose?) suggestion in an earlier post was good -- the applications' menu should show Set number followed by the descriptive name:</p>
      <p>"Stylistic Sets" --&gt; "Set 1: Swash R and K"</p>
      <p>where "Swash R and K" is the name defined in the font.<br>
      It is important that Set 1 is shown too, because it makes it clear to the typographer that if he applies "Set 1: Swash R and K" in one font, he may get "Set 1: Swash Z" in another font which covers swash R and K in "Set 3: Swash R and K".</p>
      <p>Localization of descriptive names:</p>
      <p>I know that you are not fond of English-only descriptive names. It is true that to a German or Polish user, the English term may not be of much use for he doesn't know what it means.<br>
      But it <cite>does</cite> have advantages: Though of no descriptive use for some, it identifies a feature uniquely. A Spanish typographer can tell his German collegue to use <cite>this particular feature</cite>. With localized versions (of which they see only their own), they would have some trouble translating the term such that both will refer to <cite>the same</cite> thing!<br>
      Example: I wanted to make a little manual showing graphically which buttons to press to access a certain style. Thanks to localization of applications I ended up with a column of button pairs for 'B' and 'I' (English), 'G' and 'I' (French), 'F' and 'K' (German), &amp;c.<br>
      Another example, more OpenType related: I tend to speak of InDesign's "Stylistic Set" features. But some German typographer collegues didn't understand what I was talking about. Finally I recognized that in the localized German InDesign "Stylistic Sets" are translated as "Formatsätze". Without access to a German ID version, I would have been lost in finding a translation letting me point to them.</p>
      <p>So, for me, identification is much more important than meaning. The average user doesn't know what a (German) typograpic term "Kursiv" means either, but knows what happens if he clicks the 'K' button ('I' for Americans).&nbsp;&nbsp;:)<br>
      In applications that support them to date, Stylistic Set features are offered in their own submenu. So users might understand a language switch, and that it's due to the font, not the application.</p>
      <p>Karsten</p>
