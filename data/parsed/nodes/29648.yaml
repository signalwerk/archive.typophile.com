      <p>In an effort to try and get this thread back on topic, I think I should try to clarify my reason for starting it a bit more.</p>
      <p>(1) I am trying to establish a set of "user" wishes for what "they" might want in a stylistic set so that type designers might respond with some things that fit "users" needs.<br>
      (2) I would take these established "wishes" or "needs" and create a common table of repeated words which could then be translated into many languages. Here is a sample:</p>
      <p>"Substitute" "glyphs" [a, g] with "alternates" "single story".</p>
      <p>All the words in quotes would be words that need translation into other languages. Items in brackets would be common to the languages that might use them like glyph names.<br>
      With this system, a language translation table could be constructed that would change the Stylistic set named in English, "Substitute glyphs a and g with single story alternates" into French, German, or whatever language is needed on the users system.</p>
      <p>I would then propose to the "Proper Authorities" of the Opentype consortium and developers like FontLab and Adobe, that the stylistic set numbers be replaced with names that fit what they do and are easily constructable from a given set of translation variable terms.</p>
      <p>ChrisL</p>
