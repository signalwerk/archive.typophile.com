      <p><em>Is there a reason why you would not simply associate the small-caps-lining figures with “smcp”?</em></p>
      <p>Because this thread spawned from a thread about how the Small Caps commonly come with SC-sized Text Figures, and the other Lining Figures don't match. While it might make sense to turn on Small Caps and Lining Numerals, that doesn't always mean that you will get small-caps-lining-numerals; in fact you will probably get something very different.</p>
      <p>---</p>
      <p>Stylistic Sets are highly discretionary things. While I think best practice would to be to place a single alt in &lt;salt&gt;, and matching alts :gt;1 in a s. set, I would hardly begrudge anyone for doing otherwise, that's their free-space to play a bit. (And OpenType is young.)</p>
      <p>Perhaps we should choose to think of the whole issue differently. The <em>name</em> of stylistic set no. 1 is <strong>&lt;ss01&gt; </strong>. The personal appellation describing it is something else; a label, subtitle, whatever you please. So if one is compelled to wonder what an application developer will do with the <em>name</em>, that's about their implementation of OpenType, not the type designer's choice of label. Let's use label. </p>
      <p>On another note, where are &lt;21&gt; through &lt;99&gt;? :)</p>
