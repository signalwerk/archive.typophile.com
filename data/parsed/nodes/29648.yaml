      <p>Chris, if you are looking for codification of the major stylistic sets sought/in use, I don't think that is what the stylistic sets are intended for. Or, to be precise, I don't think those things should be considered stylistic sets at that point.</p>
      <p>The OpenType feature tags themselves are not a finite set. According to MS Typography, "Microsoft expects the list of registered tags and features to expand over time. The most recent version of the registry will be available on Microsoft's ftp and World Wide Web sites." <em>(I can't find a record of version changes, proposed features, a system for proposal submission, or the like, but then MS has never been the world leader in open-collaboration tech. I think they mostly consider open to be the companies they are in established relationships with.)</em></p>
      <p>From this perspective, the question arises, "What do users/designers keep putting in the stylistic sets so repeatedly that that might be better promoted to static, official OpenType feature tags?"</p>
      <p>Doing that would keep the stylistic sets open as a testbed for new ideas and one-offs, which I think there should be. Of course, I'm still not sure how the feature tag registry is supposed to be expanded, but somewhere, someone knows. And I bet they read Typophile. :)</p>
