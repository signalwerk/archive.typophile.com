      <p>Ok, I'll be clear about it. The stylistic sets' names will always vary from foundry to foundry, and often from font to font. If things were regularized, it would hinder the use of the Sets. Since what they look like, what they do, and all that is up to the designer, it makes sense that the names are, too. I specifically included oddball set names as an example to show why it might be good not to translate them, but use them only as mnemonic devices. Perhaps funkier names would have been a better example; "Baldwin Bros." "Supadupa" and "Sqoooshed™".</p>
      <p>If a designer wants them to have a valid meaning in one language, or encode translations of them for several, fine. To be clear, the few applications that support sets show them now as numbers. <strong>This should remain, regardless of name</strong>. The names should be mere additions, not replacements. Since Thomas is reading this, and (I think) has a profound impact on those developing the only cutting-edge applicans using OT, I suspect that it is a non-issue, anyway.</p>
      <p>Of course, if the creator doesn't see a benefit to the us of the names, they could always leave them blank. So this is a win-win situation.</p>
      <p>If a stylistic set simply alters a few specific characters, it might be a best practice to comma delineate them in the set's name field, since that is inherently international. But that would be a designer's choice, or custom, like using the set-names in the first place.</p>
      <p><a href="http://www.chozcunningham.com" rel="nofollow">Choz Cunningham</a><br>
