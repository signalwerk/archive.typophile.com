      <p>Adam Twardoch wrote: <cite>But using this argument, the only logical consequence would be to use English-only names for ALL OpenType features, including Swash, Old-Style Figures etc. My point is that you should localize all or none [...]<br>
      But here all my doubts creep in — will these localizations really do any good?</cite></p>
      <p>Fully agreed.</p>
      <p><cite>The question that you need to ask yourself is: what is the purpose for these human-readable names to be included in OpenType fonts. [...] The sets can be then called “Blue”, “Green”, “Orange” or “Chicago”, “New York” and “Paris”. It’s fancy, but I don’t think it’s significantly better than “Set 1”, “Set 2”, “Set 3” — though some mnemotechnic can help users differentiate them.</cite></p>
      <p>I did ask myself the question.<br>
      The last point you make is not to be underestimated. For those who can read English names, great; those who cannot may still guess at the meaning because of similarity of terms in both languages; and the rest may remember the sound or look of the words.<br>
      In a syntax like "Set 1: Human-readable name", the colon should make clear that what follows is an attempt at describing the content, nothing more.<br>
      So I'd say, add English names, but no further localization. I'd be happy to do this. With 1-2-3 I am lost even in my own fonts.</p>
      <p>Karsten</p>
