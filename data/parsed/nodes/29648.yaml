    html: |-
      <p>&gt; A Spanish typographer can tell his German collegue<br>
      &gt; to use this particular feature</p>
      <p>But using this argument, the only logical consequence would be to use English-only names for ALL OpenType features, including Swash, Old-Style Figures etc. My point is that you should localize all or none -- having half-translated and half-foreign menus is something from the 20th century. </p>
      <p>But bad translations should be fixed there where they are broken: by fixing the translations, not by introducing some additional complication to the system. </p>
      <p>I know that some translations for the OpenType Layout features in Adobe applications are nonsense. I've consulted with Winsoft (who did the localization of Adobe Creative Suite applications into Polish) on the translation of the typographic terminology in these apps. They used some, though not all, of my suggestions. </p>
      <p>The question that you need to ask yourself is: what is the purpose for these human-readable names to be included in OpenType fonts. If this is to just provide "some labels" for the features, fine, but let's be clear about it. Then they can be completely arbitrary, not necessarily localized. The sets can be then called "Blue", "Green", "Orange" or "Chicago", "New York" and "Paris". It's fancy, but I don't think it's significantly better than "Set 1", "Set 2", "Set 3" -- though some mnemotechnic can help users differentiate them. </p>
      <p>However, if the names are, indeed, to tell to the user what the set actually contains, then, logically speaking, they should be localized. But here all my doubts creep in -- will these localizations really do any good? </p>
      <p>A.</p>
