      <p><em>For a lot of things that are relatively uncommon, stylistic sets take away the impetus to cover them with their own separate features.</em></p>
      <p>Then they are doing what I think they were intended to do very well. If some feature, particularly typographic, becomes so common that users/creators expect it in the font, it seems that would be the time to "graduate" that feature to its own tag. The first thing I've heard of is this small-caps-lining-figures, and while that may be worthy, I leave it to someone else to care more for now.</p>
      <p>It is suggested at wikipedia that AAT, and here that Metafont offer more typographic flexibility than OpenType does. Since OT can be expanded, are there a few specific simple things that could be added as permanent features that would change this perception? I don't think  it could or should develop to the complexity of metafont, but perhaps a standardized space should be made for a few more "goodies"?</p>
