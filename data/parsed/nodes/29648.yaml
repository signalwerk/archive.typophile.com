      <p>Based on what I've dug up on Typophile &amp; what this thread has discussed I've just used a simple calt replacement that Thomas suggested in another thread (which of course I can't find now). This is giving me some control over the replacements without getting into a bunch of code that, at the moment, makes me nervous.</p>
      <p>For instance, I've set up my "o_f" glyph as a calt that is only triggered if preceded and followed by "space", so that the combined glyph only kicks in for the word "of". Same sort of thing for long "R" and "K"; I've selected specific letters to follow, and if those letters are entered the long alternates are trigged. Of course, the user can always go into the glyph palette and insert any of the glyphs anywhere they want, but this is providing a certain amount of functionality without having to go into the glyph palette constantly.</p>
      <p>As for stylistic sets (which is, of course, the topic of this thread), I'm still not quite sure if/how I'll implement them. As above, the problem is that turning them on and off for key strings of text (rather than to a huge selection and thus "over-doing" the alternates) doesn't seem much better than simply adding alternates manually.</p>
      <p>My next task is to find out if there's a simple way to work with GPOS in FontLab so that I can move some of my alternates around in the replacement process.</p>
