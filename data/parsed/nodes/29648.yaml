      <p>Christopher, </p>
      <p>of course, the practical problem is that InDesign gives the user access to "ssXX" but not "salt", while Illustrator gives the user access to "salt" but not "ssXX". </p>
      <p>In Zapfino Extra Pro, I chose a following method (given that a a.2 a.3 a.4 are the four basic styles): </p>
      <p># For Illustrator<br>
      feature salt {<br>
        sub a from [a.2 a.3 a.4];<br>
      } salt;<br>
      feature swsh {<br>
        sub a from [a.3 a.4];<br>
        sub a.2 from [a.4];<br>
      } swsh;<br>
      # For InDesign<br>
      feature ss01 {<br>
        sub [a.2 a.3 a.4] by [a a a];<br>
      } ss01;<br>
      feature ss02 {<br>
        sub [a a.3 a.4] by [a.2 a.2 a.2];<br>
      } ss02;<br>
      feature ss03 {<br>
        sub [a a.2 a.4] by [a.3 a.3 a.3];<br>
      } ss03;<br>
      feature ss04 {<br>
        sub [a a.2 a.3] by [a.4 a.4 a.4];<br>
      } ss04; </p>
      <p>In InDesign, the access to the basic four sets is through ss01-ss04 (while the first set is also visible when no Stylistic Set is chosen). In Illustrator, the access to the first basic set is with no formatting applied and to the three further sets is through salt, swsh and salt+swsh (which can be conveniently toggled in the OpenType palette). </p>
      <p>A.</p>
