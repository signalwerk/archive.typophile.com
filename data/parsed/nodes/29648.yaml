      <p>Tom Phinney writes: "I was suggesting that you put together a proposal for *how* in any given font the stylistic sets would relate to user-friendly UI name strings."</p>
      <p>I myself don't really think that this is a particularly good idea, especially for the reasons I have written here before: the localization of those names will only be incidental. One font vendor may supply set names for English only, some other vendor may supply set names for English, German and French, and yet another for 12 different languages. Obviously, the larger for vendors will be in favor here, but still, what should a user of, say, the Polish language version of InDesign see in the menu if the name of the "Feminine" set in a given font was not localized into Polish? Should he see "Feminine" or "zestaw stylistyczny 3"? I don't think the English set name (or Greek, or Chinese, or whatever the default set name will be in the font) will say much to a non-English speaker, so sticking with the localized stub names ("zestaw stylistyczny 3" etc.) will probably be a better idea. But this again introduces complications for documentation writers (they cannot rely that "Feminine" or a translation thereof will always be available to users in the UI). </p>
      <p>However, *if* people feel having human-readable names for stylistic sets in OpenType fonts would be a good idea, I'd recommend using a simple scheme: the human-readable names for the ss01-ss20 features should be stored in the "name" table, using name ids 101-120. For example, name ids 102.3.1.1033 and 102.1.0.0 would hold the U.S. English names for ss02, and the name ids 102.3.1.1045 and 102.1.29.25 (or 102.1.0.25?) would hold the Polish names for that feature. </p>
      <p>Adam</p>
