      <p>Ludwig, </p>
      <p>1. Optical sizes, different weights or different widths usually imply different ascender, descender or x-height lines in fonts. However, you can only have one such information per font so that for the additional "stylistic sets", the font would contain false information. </p>
      <p>2. Fonts have classification information in them, e.g. the PANOSE classification numbers, information about width, weight etc. This information, combined with the information about ascenders, descenders or the x-height, allows font matching systems to substitute a close matching font when the original is unavailable. If you stuff all the glyphs into one font, this systems will no longer work. </p>
      <p>4. Many applications that are not intended for professional page layout (e.g. Excel) do not and never will support OpenType Layout features such as stylistic sets. </p>
      <p>5. OpenType fonts have a physical glyph limit of 65,536 glyphs per font. Having 5x as many glyphs as you currently do for European fonts is typically not a problem (currently, you have around 1000-2000 glyphs, so you'd have 5000-10,000) but for large multilingual fonts, especially Asian fonts, it would be a problem. </p>
      <p>6. There is no cross-platform or even cross-application standard for OpenType Layout feature tagging when exchanging formatted text (through the clipboard or through text files e.g. RTF files). If you apply a combination of stylistic sets in InDesign and copy-paste the text into Word, it will come in as plain text -- all the formatting will be lost. If you use different fonts to denote different weights or styles, the information is typically preserved. </p>
      <p>7. It is easier to charge users per font. You can sell single fonts for $20 each and entire families for $200 or $400. Users will be less likely to pay $200 for just one font even if it contained an unlimited number of styles -- this is the experience that Adobe made with Multiple Master fonts. Also, with such monster all-in-one fonts, it's less possible to differentiate the offerings: currently, you can sell a complete family for $400 to more professional users while you only sell one or two styles, $20 each, for less demanding users who are on a smaller budget. The monster fonts would only allow you to do "all or nothing", or you'd have to produce different subsets of fonts, but then you run into family naming conflicts etc. </p>
      <p>Therefore, I don't think your idea will ever work. The only situation where I think it might make sense would be with italic glyphs. Italics are often mixed with roman styles and currently, there is no way to devise spacing/kerning in character pairs when the font is switched. If upright and italic glyphs were placed in one font, this would be easier to implement. Actually, there is an "ital" feature but it is only used in Asian fonts. </p>
      <p>The problem however is again that there is only one set of metric information per font. Italic fonts usually contain information about the slope angle, which is used by text editing applications to draw a sloped text cursor on the screen. If the italic glyphs were stored as variants in an upright font, this information would not be available. </p>
      <p>In short: I think the system does make sense the way it is now. I don't think you can expect revolutionary changes anytime soon.</p>
