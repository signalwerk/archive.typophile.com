    <p>If as a user, you could have whatever <a href="/wiki/stylistic%20set" class="freelinking" rel="nofollow">stylistic sets</a> to choose from in an <a href="/wiki/opentype" class="freelinking" rel="nofollow">opentype</a> font, what would they be? <a href="/wiki/Oldstyle%20figures" class="freelinking" rel="nofollow">Oldstyle figures</a>, <a href="/wiki/ligature" class="freelinking" rel="nofollow">ligatures</a>, all caps and <a href="/wiki/small%20capitals" class="freelinking" rel="nofollow">small caps</a> are already available so what else would you dream of having?<br>
    I am hoping to gather information to first send as a request for inclusion in the spec (if I understand Thomas correctly) or at least give type designers an idea what the market wants in the way of features.</p>
    <p>I am posting this as a direct result of some of the dialogue in a thread on "Smallcap lining figures".</p>
    <p><a href="http://typophile.com/node/29580" title="http://typophile.com/node/29580">http://typophile.com/node/29580</a></p>
    <p>ChrisL</p>
