      <p>I don't think the rand feature actually works. From what I know, most fonts made with "randomization" actually use the trick discussed in this <a href="http://typophile.com/node/19625" rel="nofollow">typophile thread</a>, which, as I understand, was first posted by Thomas Phinney. See also <a href="http://typophile.com/node/17177" rel="nofollow">here</a>.</p>
      <p>I've always thought of stylistic sets as a way to select variant glyphs, such as alternative designs for the @-sign. One other thing I can imagine using it for is to select between a dotted zero and one without dot. The numbers in Inconsolata are quite narrow to distinguish 0 from O, but perhaps if I had a stylistic set for dotted zero, I could widen them up with no risk of confusion.</p>
