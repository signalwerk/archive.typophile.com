    html: "<p>“Bending the black”: I’ve concluded that -unlike in a “dumb” automatic algorithm- shades of gray don’t ideally work as in a continuum — diﬀerent shades have qualitatively diﬀerent functions. A medium gray (like your 153) works in an expected way perhaps (creating the illusion of part of a pixel), but a dark gray is much more “subvisible” — it creates a hint of the black softening up, usually in “preparation” of an adjacent medium gray. As for light grays, try to avoid them (since they create the most blur), but sometimes they still become the whole point of the exercise, oddly enough. Hard to explain… <br><br>hhp <br></p>"
    html_clean: "<p>“Bending the black”: I’ve concluded that -unlike in a “dumb” automatic algorithm- shades of gray don’t ideally work as in a continuum — diﬀerent shades have qualitatively diﬀerent functions. A medium gray (like your 153) works in an expected way perhaps (creating the illusion of part of a pixel), but a dark gray is much more “subvisible” — it creates a hint of the black softening up, usually in “preparation” of an adjacent medium gray. As for light grays, try to avoid them (since they create the most blur), but sometimes they still become the whole point of the exercise, oddly enough. Hard to explain… <br><br>hhp <br></p>"
