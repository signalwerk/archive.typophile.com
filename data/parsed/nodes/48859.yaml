    <p>I received a letter from a friend today who was staying at the Sutton Place Hotel in Chicago:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/suttonplace_6638.jpg"></div><br>
    It's a semi-swanky hotel from what I understand (never stayed there). The paper is a pretty nice laid finish cotton, but the typsetting wasn't impressive to me. Reminds me of when I played with Formatt rub-on letters as a child.<p></p>
