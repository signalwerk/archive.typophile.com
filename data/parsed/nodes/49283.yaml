    <p>I’m still not particularly good at identifying typography, and have been trying to identify the typeface used in a book of essays by Jung published in 1974. It seems like a relatively common serif, which is partly why I feel sort of silly not being able to identify it! </p>
    <p><a class="freelinking-external" href="http://www.flickr.com/photos/misterghostie/2844314240/sizes/l/">Chapter Title Page</a><br>
    <a class="freelinking-external" href="http://www.flickr.com/photos/misterghostie/2844314246/sizes/l/">Recto + Verso</a></p>
    <p>EDIT: Some more Photos (though a Baskerville looks accurate).</p>
    <p><a class="freelinking-external" href="http://www.flickr.com/photos/misterghostie/2844447958/sizes/m/">Book Text, Closeup</a><br>
    <a class="freelinking-external" href="http://www.flickr.com/photos/misterghostie/2844447948/sizes/o/">Section Titling</a></p>
    <p>Thanks for the help!</p>
