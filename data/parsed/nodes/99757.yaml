    <p>Bitblox has just been released at Glyfyx. </p>
    <p><a class="freelinking external" href="http://www.glyfyx.com/digital-2/bitblox-fonts/" rel="nofollow">http://www.glyfyx.com/digital-2/bitblox-fonts/</a></p>
    <p>Featuring 8 super pixelated fonts: Regular, Embiggened, Stackable, Outline, Dimensional, Monospaced, Blocked and Dingbats.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/BitBlox-Fonts-Banner-Low_6096.png"></div><p></p>
    <p>Bitblox is an offshoot from the Bitblox Alphabet Blocks. The whole typeface comes as a free bonus when the Alphabet Blocks are purchased.</p>
    <p><a class="freelinking external" href="http://www.glyfyx.com/analog-2/bitblox/" rel="nofollow">http://www.glyfyx.com/analog-2/bitblox/</a></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Bitblox_Alphabet_Blocks_low_5341.png"></div><p></p>
    <p>Bitblox was created for <a class="freelinking external" href="http://www.glyfyx.com" rel="nofollow">Glyfyx, Inc.</a> by James Beall and <a class="freelinking external" href="http://www.psyops.com" rel="nofollow">PSY/OPS Type Foundry.</a></p>
