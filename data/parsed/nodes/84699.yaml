    html: |-
      <p>It'd be a good idea to set some paragraphs (black on white) at text sizes and perhaps the glyph set at a large size so we can zoom on all the details and see how it performs in running copy.</p>
      <p>Take all advice with plenty of salt...</p>
      <p>Since this has a humanist architecture, consider the speed of writing...I really like the dynamism/forward motion of the e, and I think I'd try to match that in some other letters. The t for example is more restrained in its foot, which turns up more. Look also at how swoopy your ampersand (or the g) is compared to the f, which is much firmer. The base of the t is malformed in the middling light weights.</p>
      <p>Your a sticks out a bit much for me: remember the game is to get even rhythm and counterspaces among all the letters. Especially in the boldest weight, it's hard to see whether the problem is the small counter of the a or the much larger counter of the o. I think o generally needs a little contrast, and probably some narrowing. (Also the c) </p>
      <p>I think the n and r have different joins by necessity. I'd probably tweak the m however. There's something funny going on at the x-height in the m, n and r for me: the arch looks lower than the spurs, or the spurs look too long, I'm not sure.</p>
      <p>Crossbars of I could be more definite, if you're going to go with this style.</p>
      <p>It's normal for curves to be heavier than stems, at their thickest point, to compensate for the parts where they are thinner. I can't see any spots where you've made them too thick, other than perhaps the top of the e.</p>
      <p>Spacing looks tight in the boldest weight.</p>
