      <p>Looks very promising, like it a lot!</p>
      <p>First things that I noticed is the somehwat small crossbar on the /e/ (in the "synth mixtape &amp; coffee" line it really stands out). The /a/ on that same line also looks a bit off. Looks like you are trying to create contrastb there but it's not working exactly right (not sure how to fix it though, im not a pro myself)</p>
      <p>as noted above, the /y/ seems a bit out of form since it's leaning a bit &amp; has odd angles?</p>
      <p>I like the /a/ and /c/ a lot. love how that c drops at the top</p>
      <p>I see that the /M O C/ are wide as Minerva noted, but not sure if you should fix them. They need some companions maybe? You could decide to widen the /P/ and /R/ and similar others as well? Just an idea though, not sure how that will turn out!</p>
