      <p>Are the alphabets updated version?<br>
      And instead of pictures and body text, give alphabet (and some pangrams) .pdf's. Can't zoom in now.</p>
      <p>/e/ crossbar still falls out. Try making it like /a/ pointed variant.<br>
      While you want flowing feel with some slanted letters, /a/ is pointing in the opposite direction.<br>
      When you change (thicken) /e/ bar, /g/ ear has to be changed too.<br>
      /b/ is narrower than /d/, /p/ is WAY narrower than /q/.<br>
      /y/ is still too slanted. It has to be made from /v/.<br>
      /z/ diagonal needs to be thinner.<br>
      /x/ is slanted (not sure if intended).<br>
      Add a bar to /G/ terminal.<br>
      /S/ too wide.<br>
      /Z/ and /z/ are slanted to the left.<br>
      Make /1/ flag shorter and more angular.<br>
      /2/ diagonal is too thick.<br>
      /6/ and /9/ are way too slanted.<br>
      Plus, there's lots of optical correction to be done.</p>
