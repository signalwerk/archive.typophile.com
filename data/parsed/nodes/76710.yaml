    html: |-
      <p>Hi Ramiro<br>
      As far as I know, in your code you for localized forms you only need<br>
      lookup locl_TRK {<br>
      sub i by i.TRK;<br>
      } locl_TRK;</p>
      <p>In your small caps feature you should substitute both i and i.TRK<br>
      smcp {<br>
      sub i by i.smcp;<br>
      sub i.TRK by i.TRK.smcp;<br>
      } smcp;</p>
      <p>Be sure to put the locl feature above smcp, so when you activate locl for TRK, i will be substituted by i.TRK and then when you activate smcp the i.TRK will be subsituted by i.TRK.smcp, on the other hand if locl for TRK is deactivated and you activate smcp, i will be substituted by i.smcp</p>
      <p>There are other ways of doing this. I hope this works.<br>
      You also can read this comment by Twardoch <a href="http://typophile.com/node/17787" title="http://typophile.com/node/17787">http://typophile.com/node/17787</a></p>
      <p>Regards</p>
