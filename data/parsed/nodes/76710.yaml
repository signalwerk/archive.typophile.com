    <p>Hi there,</p>
    <p>When you make localisation features (locl) for substitutions such:</p>
    <p>language TRK;<br>
      # Turkish<br>
      sub i by i.latn_TRK;</p>
    <p>is it necessary also to address its small caps counterpart? ( sub i.sc by i.latn_TRK.sc; )<br>
    or this is not really needed since i.latn_TRK will be made i.latn_TRK.sc by the 'smcp' feature?</p>
    <p>Thanks in advance.</p>
    <p>Ramiro.</p>
