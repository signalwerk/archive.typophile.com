    html: |-
      <p>Unless your localization feature applies after your small caps feature (which would defeat the whole purpose) then there should be no need.</p>
      <p>The normal substitutions needed would be:</p>
      <p><code>feature locl {<br>
      &nbsp;&nbsp;script latn;<br>
      &nbsp;&nbsp;language TRK exclude_dflt;<br>
      &nbsp;&nbsp;&nbsp;&nbsp;sub i by i.trk;<br>
      } locl;</code></p>
      <p><code>feature smcp {</code></p>
      <p><code>&nbsp;&nbsp;sub i by i.sc;</code><br>
      <code>&nbsp;&nbsp;# if using separate glyphs for smcp/c2sc</code><br>
      <code>&nbsp;  &nbsp;&nbsp;sub dotlessi by dotlessi.sc;</code><br>
      <code>&nbsp;&nbsp;&nbsp;&nbsp;sub i.trk by i.trk.sc;</code><br>
      <code>&nbsp;&nbsp;# if using the same glyphs for smcp/c2sc</code><br>
      <code>&nbsp;&nbsp;&nbsp;&nbsp;sub dotlessi by I.sc</code><br>
      <code>&nbsp;&nbsp;&nbsp;&nbsp;sub i.trk by Idotaccent.sc</code><br>
      <code>} smcp;</code></p>
      <p>André</p>
