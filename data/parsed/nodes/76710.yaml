    html: |-
      <p>"locl" should indeed be included before other features in the font. Then, you can just make plain substitutions of the localized glyphs (since they've been swapped in the locl feature) using the regular "latn/dflt" context (which is available if you don't use the explicit language statement). Of course you do need to make sure that in smcp, you're replacing i.latn_TRK with a *dotted* small-cap i, while the regular i should be replaced with an undotted smallcap i. That is, actually, the very purpose of employing the locl feature: i and i.latn_TRK look identical as they are, but the "locl" swap allows you to use two different input glyphs when performing OpenType replacements that are functionally case substitutions (smcp, pcap, titl, case etc.). </p>
      <p>A.</p>
