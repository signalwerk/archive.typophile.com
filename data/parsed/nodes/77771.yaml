    html: <p>It is hard to find upright brush-script fonts quite as condensed as this. <a class="freelinking external" href="http://new.myfonts.com/fonts/fontdiner/singlesville-script/" rel="nofollow">Singlesville Script</a> is fairly close although it doesn't have the loop on o. <a class="freelinking external" href="http://new.myfonts.com/fonts/suitcase/bistro-script/" rel="nofollow">Bistro Script</a> and <a class="freelinking external" href="http://new.myfonts.com/fonts/charlesborges/bounce-script/" rel="nofollow">Bounce Script</a> have a similar feel in the brush strokes but are a lot more open.</p>
