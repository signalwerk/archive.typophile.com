    <p>This is one of my unicode (Greek) pixel fonts...</p>
    <p><a href="http://www.grixel.gr"><strong>Grixel™ Acme 9 Regular</strong></a> </p>
    <p>What i want from you is to just test it for feedback purposes... I'm mostly interested in knowing how it works in international operating systems (English, French, Italian, German, ect.) Win and Mac. Central European and Turkish characters are also included.</p>
    <p>The characters that are included are here (4 Turkish characters [Ğğİı] are not present below):</p>
    <p><img src="/sites/default/files/old-images/charTable2.gif"></p>
    <p>I have English and Greek languages installed in my system (Win XP pro) but i don't know how i can access the above letters that are wanted in </p>
    <p><strong>Western European languages</strong><br>
    (<em>Danish, Dutch, English, Finnish, French, German, Iceland, Irish, Italian, Norwegian, Portuguese, Spanish, Swedish</em>)</p>
    <p>and in <strong>Central European languages</strong><br>
    (<em>Albanian, Croatian, Czech, Hungarian, Polish, Romanian, Serbian, Latin, Slovak, Slovenian</em>)</p>
    <p>Are the characters of your (above) language available at your system? </p>
    <p>If you find that something isn't working please post here the versions of you OS and software that you're typing. You can also email me your feedback at the email that can be found in the txt.</p>
    <p>It is a pixel font and use it at size 8px with "none" anti-alias. You can use it for free at your own risk!</p>
    <p>Thanx in advance.</p>
