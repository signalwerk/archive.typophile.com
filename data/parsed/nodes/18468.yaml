      <p>Jay, it's 6 point in Word because the nominal resolution<br>
      of Windows (at least be default) is 96 dpi (instead of 72).</p>
      <p>One nice trick I learned from Laurence Penney is to set<br>
      the magnification in Word to 75%, which opens up "direct"<br>
      access to the various discrete PPEM sizes in a font, including<br>
      the pseudo-standard 8 in pixelfonts.</p>
      <p>hhp</p>
