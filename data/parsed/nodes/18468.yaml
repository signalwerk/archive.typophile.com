      <p>Thanx jlg4104 for your instant feedback...</p>
      <p>|<em> ...I tried out a paragraph in a few different sizes...</em></p>
      <p>Ok i guess i have to paste some guidelines on using this pixel font in order to work ok. It is designed to work with software like Macromedia Flash and Adobe Photoshop:</p>
      <p><code><br>
      ############ Macromedia Flash 8 ############ </code></p>
      <p><img src="/sites/default/files/old-images/FL8.gif"></p>
      <p><strong>1)</strong> Use the font only at 8px or multiples of 8 (16,24,etc) with "anti alias for animation" selected.<br>
      -----------------------------------------------------------------------------------------------------------------------------------------------------<br><strong>2)</strong> Position your text blocks where _x and _y values are whole numbers, </p>
      <p>i.e. position them at the point _x=250 and _y=150, NOT at _x=250.8 and _y=150.4.</p>
      <p>If you don't place your text's _x and _y position on a whole number, the pixel font will look blurred.<br>
      -----------------------------------------------------------------------------------------------------------------------------------------------------<br><strong>3)</strong> When you place your text inside a movie clip,  the clip must also be positioned on whole pixel _x and _y values.<br>
      Do not scale the movieclip. Make sure it is at 100% size (Modify / Transform / Remove Transform)<br>
      -----------------------------------------------------------------------------------------------------------------------------------------------------<br><strong>4)</strong> Align your text only left, NOT right, center or justified.<br>
      -----------------------------------------------------------------------------------------------------------------------------------------------------<br><strong>5)</strong> Try to avoid animating (tween animation) pixel fonts. When your fonts move, they get blurry<br>
      because they are not located on a whole pixel value. On the other hand you can try and animate them<br>
      via actionscript using the Math.round(); function in order to animate the text clip in whole pixel values.<br>
      -----------------------------------------------------------------------------------------------------------------------------------------------------<br><strong>6)</strong> Avoid scaling pixel fonts using Flash's Scale feature. If you need to increase the size of your pixel font,<br>
      increment the text's font size by 8 (16,24,etc).<br>
      -----------------------------------------------------------------------------------------------------------------------------------------------------<br><strong>7)</strong> Make sure that you view your stage / movie / swf file at 100% view size. (View / Magnification / 100% - Ctrl+1)<br>
      -----------------------------------------------------------------------------------------------------------------------------------------------------<br><strong>8)</strong> To enable the kerning pairs that are included with the font (Ta, Te, Tn, To, Tr, Ts, Tu, Tv, Tw, Ty, Tz, gj, yj, Γά, Γέ, Γή, Γα, Γε, Γη, Γι, Γο, ect ), with "Static" texts turn on the "Auto Kern" feature while "anti alias for animation" is selected. In "Dynamic" and "Input" texts with "Auto Kern" feature on, you must also<br>
      Embed the letters that are included in the pairs.<br>
      If you turn off "Auto Kern", the font will still work fine but without the Kerning Pairs available.<br>
      -----------------------------------------------------------------------------------------------------------------------------------------------------</p>
      <p>############  Adobe Photoshop CS / CS2  ############ </p>
      <p><img src="/sites/default/files/old-images/PSCS2.gif"></p>
      <p><strong>1)</strong> Use the font only at 8px or multiples of 8 (16,24,etc) with the Anti-aliasing set to "None", the "Kerning" feature set to "Metrics",<br>
      Horizontal and Vertical Scale set to 100%, the tracking set to 0 and the text field must be "Point Text" (click and type - DON'T click, drag and then type).<br>
      -----------------------------------------------------------------------------------------------------------------------------------------------------<br><strong>2)</strong> The resolution of you picture must be at 72 dpi.<br>
      -----------------------------------------------------------------------------------------------------------------------------------------------------<br><strong>3)</strong> Always align your text Left. Sometimes it also works when aligned Center and Right, but use it at your own responsibility.<br>
      -----------------------------------------------------------------------------------------------------------------------------------------------------<br><strong>4)</strong> To enable the kerning pairs that are included with the font, set the "Kerning" feature to "Metrics". To disable Kerning Pairs, set the "Kerning" feature to "0".<br>
      -----------------------------------------------------------------------------------------------------------------------------------------------------</p>
      <p>Hope i helped...</p>
