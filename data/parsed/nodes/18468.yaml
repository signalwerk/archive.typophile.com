    html: |-
      <p>I'm new to pixel fonts, too. I tried out a paragraph in a few different sizes. I also tried all caps. I find that in MS Word (quickest way for me to test a full paragraph), on a 72-dpi screen, LCD laptop, it actually looks best at 6 point. All caps looks just about as readable as standard "sentence case." There are a couple spacing issues that bug me:</p>
      <p>1- LC "a" often needs more space on left, but not always. check various pairs</p>
      <p>2- LC "i" often rides too close to others on the right</p>
      <p>3- "z" isn't right as a mirror of "s" -- it looks like numeral "2"</p>
      <p>4- the most conspicuous irritation is that the standard intra-word space is too small. I replaced all lone spaces with two spaces, and it instantly became FAR more readable.</p>
      <p>otherwise, i like it.</p>
