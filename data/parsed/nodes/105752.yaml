    <p>Hi,</p>
    <p>I've been working on my first typeface for the past 2 and a half weeks.</p>
    <p>The idea was to create a type inspired by the Bauhaus letterforms but adapted to modern times.</p>
    <p>With styles good for <strong>Display</strong> ("regular" and "bold") and others good for <strong>Text</strong> ("book" and "book bold").</p>
    <p>I haven't set the kerning yet and there's still plenty of work to do, but I wanted your opinion about what I've got so far.</p>
    <p>THANKS!</p>
