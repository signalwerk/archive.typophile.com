    html: |-
      <p>i like it. there is something that catches my eye, and that’s the pointy corner inside the bold /s. I suppose you could make that a bit more round. Also the lowercase /a has some kind of weird buckle, where the upper curve joins the stem. And you might put the tittle of the /i just a hint higher, so it has either the exact same distance to the stem before, or fits the cap height.</p>
      <p>The phrase about sleep is really catchy. May be you should adjust the kerning a bit though. Combinations like /p to /t and /t to /o look a bit big.</p>
      <p>best regards</p>
