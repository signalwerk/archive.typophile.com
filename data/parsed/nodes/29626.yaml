      <p>It definitely has a Gill flavor to it (I had originally looked at <a href="http://www.myfonts.com/fonts/itc/golden-cockerel/" target="_blank">Golden Cockerel</a>). Up until now, Perpetua / Lapidary are the closest things I've seen, but none of the digital versions quite cut it, even with the changes from erosion considered.</p>
      <p>Maybe it's just a pre-digital version that was forsaken at the cross of analog and digital technologies.  Anyone have a pre-1969 type specimen book with a matching version of Perpetua?</p>
