      <p>Indeed. The particular printing of the book that I scanned this from has a pretty low production quality in general. Regardless, some of these characters are pretty distinct and should be easily recognizable if you are familiar with the typeface (which, unfortunately, I am not).</p>
      <p>I am thoroughly convinced that it is indeed a typeface though, and not handlettering (I've even gone to the length of doing overlay comparisons of the duplicate letters to check for consistency).</p>
