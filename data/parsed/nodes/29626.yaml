      <p>Lapidary Bitstream's version of Perpetua, but I can see some differences. Specifally the lowercase-b has more of a curve in the base which matches more closely the cover. Could be a better match.</p>
      <p>The "erosion" happens when they duplicate the artwork multiples times. It is similar to what happens when you scan a transparency, output that to paper, scan the print and then output that to film. You 4 generations away from the original.</p>
