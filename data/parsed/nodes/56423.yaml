      <p>Yes, the two versions are just different stocks. Actually most of the cards were printed on a nice thick white blotter-type paper, the others were just playing around. We liked the brown ones best (kraft-utility paper duplexed to my very favorite discontinued purple Wausau Royal Complements 100lb cover stock, which has nothing to do conceptually with the design of the card but I happened to have laying around, having recently been experimenting with the mysterious art of bulk paper lamination).</p>
