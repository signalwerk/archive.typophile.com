      <p>{An edit brought this post ahead one spot.}</p>
      <p>Actually the back of the card in that photo is the solid burgundy you can see in there, between the three face-up cards. The face is a paper that was too thin for a business card - but I just liked it and wanted to use it. So then I found a thick paper of a matching color and stuck it to the back! I think the result was better than what I thought I was getting myself into... I also did this design on a thick ecru stock that didn't need a backing. On that one you can see a faint show-through of the impression. Which to me is embarrassing. So I also did it on a thin version of the ecru paper, and added the backing. I also did one on peach paper. The first generation card (see the other Flickr photo) I did on half a dozen different papers, but no backing.</p>
      <p>This BTW is my favorite thing about letterpress: the process is very custom and iterative. On the fly you can try different papers, impression pressures, number of inkings*, etc.; and it's all under your hands - no mystery print shop decisions between you and the object that represents you. What most people laud about letterpress - that it's "organic", "irregular", "warm" and whatnot - doesn't do much for me. On the other hand, I do have this crazy theory that letterpress text does in fact enjoy greater readability than offset, due to the gentler edges of the letterforms (assuming nothing greater than a kiss impression).</p>
      <p>* Changing your mind about the ink color is a pain though!</p>
      <p>hhp</p>
    html_clean: |-
      <p>{An edit brought this post ahead one spot.}</p>
      <p>Actually the back of the card in that photo is the solid burgundy you can see in there, between the three face-up cards. The face is a paper that was too thin for a business card - but I just liked it and wanted to use it. So then I found a thick paper of a matching color and stuck it to the back! I think the result was better than what I thought I was getting myself into... I also did this design on a thick ecru stock that didn't need a backing. On that one you can see a faint show-through of the impression. Which to me is embarrassing. So I also did it on a thin version of the ecru paper, and added the backing. I also did one on peach paper. The first generation card (see the other Flickr photo) I did on half a dozen different papers, but no backing.</p>
      <p>This BTW is my favorite thing about letterpress: the process is very custom and iterative. On the fly you can try different papers, impression pressures, number of inkings*, etc.; and it's all under your hands - no mystery print shop decisions between you and the object that represents you. What most people laud about letterpress - that it's "organic", "irregular", "warm" and whatnot - doesn't do much for me. On the other hand, I do have this crazy theory that letterpress text does in fact enjoy greater readability than offset, due to the gentler edges of the letterforms (assuming nothing greater than a kiss impression).</p>
      <p>* Changing your mind about the ink color is a pain though!</p>
      <p>hhp</p>
