    html: |-
      <p>Hello James</p>
      <p>Yes I was referring to all cmyk cards printed by the online print sellers - they print by the "share-a-sheet" process - normally 20 different cards at a time - which is why they're so cheap.</p>
      <p>I'm afraid no litho or digital cards are collectable for me - imo they don't have any character, just flat and boring - no matter how good the design. Also the fact that they are all normally printed on the same standard 300/350/400gsm white coated card (plus matt lam) doesn't add any interest - although if spot gloss varnish is added it can give them a lift.</p>
      <p>I find it odd that a designer spends a lot of time fine-tuning his artwork and then has it printed by the quickest/cheapest process so it ends up "just another business card".</p>
      <p>Whereas all letterpress and foiled business cards printed on extra thick (540/700gsm) natural grained board are a piece of art that most people appreciate and will want to keep.</p>
      <p>deeplyimpressed.co.uk/</p>
      <p>Best wishes - David</p>
