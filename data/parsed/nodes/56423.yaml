    html: <p>One of my favorites from my collection. Probably the best example of vernacular design I have ever seen. I was at the farmer's market one morning speaking with a cabinet maker. I asked him if he had a business card so he grabs a scrap of wooden veneer that he uses for inlays, pulls the carpenters pencil out from behind his ear and writes down his name and number. Efficient, environmentally conscious, appropriate and cost effective. And he didn't even need to hire a brand strategist.</p><div class="imageWrap"><img src="http://typophile.com/files/woodcard_3904.jpg"></div><p></p>
