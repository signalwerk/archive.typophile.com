      <p>"Is the traditional business card dead?"</p>
      <p>I don't think so. There is still a big demand for business cards, especially that it's easier to order from <a class="freelinking external" href="http://www.printrunner.com " rel="nofollow"> online printing</a> companies. I believe that business cards still represent "official business" between and among professionals. Many changes on business cards, I can say, are found on the added contact information (email address, others have Twitter or Facebook profile names) and on the evolving designs, stocks and coatings.</p>
