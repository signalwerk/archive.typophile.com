    html: "<p>I get tons of business cards, and whether they are drab and uninspired or brilliamntly designed, almost all share one quaslity: they are almost impossible to read because they are set in type so tiny it makes the fine print of an insurance policy compare favorably with the NYTimes Large Type Edition. There is, I imagine, nothing to be done about the people who design such cards but the people who print them ought to speak up to their customers--and maybe even suggest that the backs of the cards be printed in a very plain design using a typeface that scans readily.</p>"
