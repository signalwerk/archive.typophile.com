    date_raw: 5 Jan 2012 — 5:04pm
    votes: null
    html: |-
      <p>The way information can transferred just changes the way we handle business cards, and since their shape/size/etcetera was dictated by limitations, which are slowly changing, we'll just have a different way of handling them. The physical aspect plays an important role, so it's not as if they will disappear. In this current-day pool of twitter-puke and facebook-ism you might even say the value of a business card has increased.</p>
      <p>But you can play a lot more with the definition of what a business card is, since the contact information which is placed on it isn't that important any more. On my last exposition my business cards were A2 posters folded to a tiny size (using thin stock), which with digital printing was quite cheap. This way I could give someone a lower quality, but usable, piece of my work, which I must say, worked really well in gathering interest.</p>
    html_clean: |-
