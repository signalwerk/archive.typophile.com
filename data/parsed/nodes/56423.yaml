    html: |-
      <p>They aren't obsolete now, but their use is declining, especially among younger people. Eventually we'll reach the point where using them will seem unusual or quaint. </p>
      <p>That doesn't mean they'll disappear entirely. But I think that someday it'll be unusual to be handed one. Unless maybe they're replaced with a new technology, such as physical cards that are perhaps the same size as current business cards but can transfer their info electronically, or display a video presentation, or whatever, but still be cheap enough to be considered a throwaway product.</p>
    html_clean: |-
