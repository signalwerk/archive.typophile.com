      <p>Yes, you can use it. Search for the phrase "<a class="freelinking external" href="http://images.google.ch/images?hl=de&amp;um=1&amp;q=DEWAG+-GmbH+-KG+-AG&amp;sa=N&amp;start=20&amp;ndsp=20" rel="nofollow">DEWAG</a>" on google &amp; co., this was the name of the "creative" department/organisation in the GDR. I think were was nothing that we should call "corporate design" in the GDR. This thin folder for the 750 Berlin anniversary is a very late sample of a major national advertising project and can't be used as representative for design in the GDR at all.</p>
      <p>BTW. I don't know of many samples for the usage of Maxima in ordinary live. </p>
      <p>--<a href="http://www.astype.de" target="_blank" rel="nofollow">astype.de</a>--</p>
