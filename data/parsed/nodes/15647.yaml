      <p>The best way to further an understanding of type is to, um, to teach-study-practice typography.</p>
      <p>It means dialogue and debate on necessary teaching among design faculty. It means client and professional education and outreach. It means anything that pushes the bar up, and makes a older designer have to admit they never understood exactly why the Univers and Helvetica people couldn’t just agree. It means not discriminating against handlettering and calligraphy, when taught and practiced at a sophisticated level, because they can imprint history, form and sensitivity without having to make typefaces. It means worshipping the masters with a few choice words behind their back and pointing out the foibles when you find them. </p>
      <p>I can’t think of one fresh, concrete, reasonable proposal that hasn’t been made before. Rather, the job is to actually pursue one.</p>
