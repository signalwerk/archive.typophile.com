      <p><cite>What is a current hourly rate for flipping burgers?<br>
      What is a current hourly rate for typeface design</cite></p>
      <p>Sorry, friends, you are missing the point. Do you ever consider how long it took a musician to write a song? Or Picasso to paint a picture? If it was all based on hourly rates, all books, songs, photographs and certainly fonts would be free once the originator had his investment in time and materials back (plus marketing &amp; distribution expenses). Those items would thus only cost the price of production like printing and CD-copying etc. </p>
      <p>Of course this is rubbish. Things are worth what they contribute. A song or a painting only<br>
      contribute happiness, culture, esthetic pleasure, but we’re willing to pay for them. (Leaving aside speculation like the art business here) If a designer uses paper, he needs to buy it. Same for inks, pens and other materials. A font costs between 29 and 49 dollars, but you can use it over and over (thanks, Mark, for the Letraset comparison), and it generates wealth for the client and the designer. It makes a piece more desirable, more legible, more functional. If we didn’t need more type, there wouldn’t be any. And if clients don’t want to have 49 dollars added to the bill, they’re not clients, but leeches.</p>
      <p>The only problem I see is the risk of buying a family for, say, 100 dollars and not getting to use it. For a small studio, that can quickly add a few hundred a months in speculative font expenses. So, if you’re a bona fide designer and have a record of paying proper licenses and also getting you clients to pay for theirs (that’s where the money is for type designers), talk to you favourite font supplier. They may give you an open CD with a lot of fonts on it plus a contract. That’ll state that you agree to buy a license once any of these fonts ever get used in earnest, i.e. in a publication in whatever medium. If you honour the trust invested in you, you’ll get to use thousands of fonts for you presentations, for your own experiments and research, but you only get to pay for them once you get paid. We all know that we only use the fonts we have on our hard drives, at least until we know what we want, typographically speaking. That’s why some of us would even consider looking at freebies.</p>
      <p>And finally: my rule of thumb is 100 hours per weight. So an average family these days with 12 weights (some of which, like small caps, may be less work) would take you at least 800 hours, i.e. 20 business weeks or 12 normal designer weeks. It takes a lot of 100 dollar sales (of which designer normally get around 20% if they don’t do their own distribution) to pay for that time, even at modest rates. And out of the 30,000 or so fonts I am just editing for the new FontBook, not even 5% ever pay their designers that investment back.</p>
