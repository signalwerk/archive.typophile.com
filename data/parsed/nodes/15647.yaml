    <p>Typophile community -- please help me defend your craft! </p>
    <p>Recently, in a local group of designers, a hot debate arose. (It should be noted that many of these are freelancers with small business clients.) </p>
    <p>To make a long story short, there was much complaining about the high price of font licenses. Praise of using freebie fonts over expensive foundry fonts and under the table file sharing seemed to be the norm in this group. There was speculation as to "how hard is it really to make a font" (which was more-so in respect to digitizing one of the 'classics' rather than designing an entirely new typeface.) </p>
    <p>As a graphic designer, this discussion really bothered me. However, I found I had no concrete ammo to back my side of the argument -- which is, you pay for <em>quality</em> and a lot more goes into type design than one would think. But not being a type designer, I couldn't say for sure how many hours it might take to "redraw Caslon" or why Adobe and ITC charge hundreds of dollars for font family licenses.</p>
    <p>Next time this topic comes up, I want to be prepared. Any info is greatly appreciated.</p>
