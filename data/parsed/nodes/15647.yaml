      <p><cite>If fonts were more affordable (in this case, it was implied that would mean just a few dollars per typeface/weight), they would sell to more people</cite></p>
      <p>People who use this argument cannot possible make a living as designers themselves. Do they only charge whatever they need by dividing your living expenses into the hours you can work? And forget about new equipment, software, rent, the times you do not work? Designers who sell through publishers get 20% from the retail price, the rest is spent on marketing (who do you think pays for websites, booklets, support, OT conversions etc?), production, retail discounts (that’s usually 50%),  and – mainly – those fonts that never sell or hardly. Like everywhere else, 80% of revenue comes from 20% of the products, but everybody wants to be able to choose from thousands of them.</p>
      <p>And why should revival fonts be any cheaper than new ones? Are books by Shakespeare any cheaper than those by contemporary authors? Book publishers also make their money with a few bestsellers which support all the unknown names. Would we want to do without these? And only have Helvetica, Garamond, Bodoni and a few others? Those could be cheap, because there is no license to pay and no advertising to make them known. The same designers who complain about 29 dollars for a font would be the first ones to complain about lack of choice. I knew a system like that once: it was across the Wall here in Berlin and called East Germany. As a designer, you were told what to design and when, what typefaces to use, what paper to print on and how much you could charge. And if the state didn’t think you fitted in as a designer, they would send you into a factory. For those who liked a non-risk life, this was great. The others ran away into the West or took to the streets until the Wall came down.</p>
