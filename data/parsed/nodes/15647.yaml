      <p>As I told my mother-in-law (non-designer): a bulk of the work that goes into a good text face is not the letters, but the spaces between them. If you never think about the spacing of the type, then the designer did a good job. Ask them how hard it is, really, to draw and design a logo. I mean, the client gives them most of the answers and the logo's so simple.</p>
      <p>Right?</p>
      <p>Of course not. As for the hours involved: people I've spoken two can spend 8 hours on a few characters. Seriously, I surprised that working professional designers are even debating this. Do they not know what it's like to have people completely undervalue and hard-to-explain process? Any font's cost can be built into a job, or over the course of multiple jobs if they dont' want to charge outright.</p>
      <p>Seriously, those people need to grow up. Do they steal their photography too?</p>
