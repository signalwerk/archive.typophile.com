      <p>“Make it a nation/worldwide campaign”</p>
      <p>Got some connections at Time/Warner who want to blow the lid off this puppy?  </p>
      <p>I think it’s very useful for design schools to offer this kind of class. James is on the front lines of keeping this awareness from becoming completely insular, invisible and irrelevant to the general public. Please don’t belittle that work. If every design school required a type design class, it would have several effects including: All those design grads would come away with a personal experience of how valuable type is, and each of them would have had the opportunity to be exposed to something very obscure, which they might go on to explore more deeply. All those people are then equipped to negotiate fair compensation for type products, and are more likely to license them legally. Their experience can influence others in their studios. If that happens each year from 2005 on, we’ll be on our way to some more general awareness. </p>
      <p>I don’t say we shouldn’t have mass media paying attention to type; see my previous post. But everyone is in a different position to have an influence. I also think there’s a limit to the completeness of any message delivered to the average reader through general media. How can we be sure the complete message will make it through the editorial mill? Would an editor at a major magazine be willing to devote pages and pages to digital typefounding if Paris Hilton had just thrown a candy wrapper away? Cut that boring type story and put Paris on Page 1! Get me photos! </p>
      <p>I think we’ve all joked about reality type shows, but joking aside, is there a channel or network that might be interested in a 43-minute doc about the process of making a typeface? Is there a documentary filmmaker who thinks it’s worth pursuing? Imagine a camera crew following Christian Schwartz around to press checks and design meetings, and watching laser proofs come out. Exciting stuff! Matthew Carter has compared it to watching a refrigerator make ice. Could it be made watchable?</p>
    html_clean: |-
