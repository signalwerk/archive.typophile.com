      <p>First of all -- <strong>thank you</strong> everyone for your insight! This has become a great discussion.</p>
      <p>Secondly -- I feel somewhat compelled to defend my fellow St Louis designers who sparked this conversation. I'd hate you to think we're all a bunch of uneducated, font-pirating, middle-American back-woods hacks. There are a lot of talented people in this group, which is all the more reason why this debate got under my skin.</p>
      <p>That said... someone on the "other side" of the argument brought up this  point:</p>
      <p><cite>If fonts were more affordable (in this case, it was implied that would mean just a few dollars per typeface/weight), they would sell to more people. Therefore, type designers would make more money by selling at a higher volume. This theory suggests that they are the ones taking money away from themselves by making their product too exclusive.</cite></p>
