      <p>Mark,<br>
      I went to design school in the 60’s.  We developed “alphabets” using paint and brush. I can’t say it was a complete typeface.  In those days, that would have been well over the 20-hour mark :-) We also did caligraphy and carved Roman capitals into hardened clay.  We even had a hot metal type shop put together by Jack Staufagher so typography was covered at least in the old-school way.</p>
      <p>ChrisL</p>
