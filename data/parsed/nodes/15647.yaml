      <p>I am not sure if this point has already been raised, but maybe the issue isn't the cost of fonts, but that so many are available free packaged with software.</p>
      <p>It seems to me that people complain about the cost of fonts because they assume they are free, like Comic Sans, Times and Arial.</p>
      <p>Comic Sans, Times and Arial are NOT free, but because they are bundeled in with the cost of the software, that is the impression designers (and lay man) have.</p>
      <p>But this attitude of not wanting to pay for fonts is typical of designers (especially the small, freelance types, of which I am one). They also don't like to pay for photo and illustration rights, nor software. If computers were clonable, you can bet freelance designers would be copying them too!</p>
      <p>Why? Becasue it is terribly hard to make money as a small, freelance designer.</p>
      <p>But what these individuals don't think about, is what this attitude is doing to the design industry! By not supporting the rest of the industry, these desigers will some day find themselves all alone, trying to defend the cost of design in front of their client, when the client is asking why his secretary can't do the same job with Office and some free MS Fonts...</p>
      <p>In a way, the cost of fonts helps give a designer a reason to charge a real price for his work. And the designers appreciation of the finer points of a well-designed font is what makes him worth the money.</p>
