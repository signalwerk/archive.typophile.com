      <p><cite>How do we prove or demonstrate the VALUE of type? Until this question is answered the debate will never end. Getting the consumer to understand the VALUE of type is where I think the answer is.</cite></p>
      <p>And I thought we graphic designers had it tough educating clients and the public about the worth of <cite>our</cite> services!</p>
      <p>A common underlying theme thoughout all of this discussion is the new(ish), digital nature of type design and font construction. The digital age has done similar things to music and graphic design.</p>
      <p>It is not just pirating, but the fact that our raw materials are not so raw anymore. Programmers use code snippets, musicians use samples and sound bites, graphic designers use clipart (and free fonts). Yes the work is completed quicker, but that has become the expectation as well, and the perceived value is also lower. “You just push some buttons and it’s done - right?” </p>
      <p>The craft of these things is being slowly (actually, quickly) eroded in favour of speed of deployment and just-in-time delivery.</p>
      <p>—pd—</p>
