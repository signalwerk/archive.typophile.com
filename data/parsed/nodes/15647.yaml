      <p>True story:</p>
      <p>I was asked to typeset a job for a major organization; not design it, just set it. I finish the 175 pages of text, using the freeware grunge typewriter font they've provided for heads and subs. The body is set in Times. </p>
      <p>And now, they say, we need it set in French. Ok, I say, but wait: there's no extended characters in this font. "What can we do? The English is already set."</p>
      <p>A day is lost, then I edit the font, adding the accents needed to set French, and I bill them for the work.  </p>
      <p>If they had begun with say, FF Trixie Plain, it would have cost them $40, and they would have something better than my hacked together accents.</p>
