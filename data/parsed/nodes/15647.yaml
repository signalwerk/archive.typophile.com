      <p>If free fonts are so great, why are they complaining at all?</p>
      <p>I look at it this way. A sheet of Letraset dry transfer lettering cost about $6.00 in 1980. That's about $15.25 in 2005 dollars. A digital font typically costs about twice that. Let's compare value:</p>
      <p>Useful life<br>
      &nbsp;&nbsp;&nbsp;Sheet of Letraset: Useless as soon as you run out of a character you need.<br>
      &nbsp;&nbsp;&nbsp;Digital font: Indefinite as long there is operating system support; never run out</p>
      <p>Flexibility<br>
      &nbsp;&nbsp;&nbsp;Sheet of Letraset: Limited to one size; can be enlarged or reduced with generational loss<br>
      &nbsp;&nbsp;&nbsp;Digital font: Infinitely scalable with no loss of quality</p>
      <p>Character set<br>
      &nbsp;&nbsp;&nbsp;Sheet of Letraset: 100 or so characters, depending on font; larger number means you run out of individual characters sooner<br>
      &nbsp;&nbsp;&nbsp;Digital font: Over 200</p>
      <p>Availability<br>
      &nbsp;&nbsp;&nbsp;Sheet of Letraset: About 400 fonts in 1980; popular fonts were often on back order at dealers<br>
      &nbsp;&nbsp;&nbsp;Digital font: Over 30,000 commercial fonts in 2005; fonts can be downloaded and used minutes after purchase and are never out of stock</p>
      <p>Ease of use<br>
      &nbsp;&nbsp;&nbsp;Sheet of Letraset: Spacing and alignment depend on skill of user; slow process<br>
      &nbsp;&nbsp;&nbsp;Digital font: Spacing and alignment are automatic; as fast as typing</p>
      <p>Special effects<br>
      &nbsp;&nbsp;&nbsp;Sheet of Letraset: Dependent on mechanical manipulation or special photographic equipment<br>
      &nbsp;&nbsp;&nbsp;Digital font: Unlimited digital effects and manipulation possible</p>
      <p>Back in 1980, designers happily paid for sheets of Letraset, even with its numerous practical limitations. We're talking cheap designers for the most part. If you had a budget, you sent out for type at a much higher price.</p>
      <p>For about twice that price (taking into account inflation), digital type is many times more than twice the value. </p>
      <p>Perhaps it's not fair to compare digital fonts to Letraset sheets. What about fonts for typesetting machines in 1980? First, you need a typesetting machine, which was $5,000-$10,000 for a low-end model ($12,500-$25,000 in 2005 dollars). A font for a low-end typesetting machine was roughly $75 (and you usually had to buy them four at a time because of the way the machines worked) which is about $190 in 2005 dollars.</p>
      <p>No matter how you look at it, digital fonts are a better value than any previous format, even at twice the typical price. True, the development costs are lower, too, but it still takes considerable time and effort to create a good quality font. In any case, it's not the development costs that determine the price people are willing to pay.</p>
      <p>The availability of free fonts is the only reason people are complaining about the price. If they can't tell the difference, what's the problem? They should just use the free ones. If they can tell the difference, then it should be obvioius why good fonts are not free.</p>
    html_clean: |-
