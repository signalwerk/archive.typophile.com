      <p>&gt; Also, the question came up of why “classic,” “public domain” typefaces (like Garamond, Caslon, etc) are still charged at a premium price when the original designers are now long-dead. </p>
      <p>Stating the obvious. In a way doing a high-quality revival of a typeface where a lot of competition already exists is harder than doing an original design. You have to bring something new to the table. That might include going back to original source material and doing a truer version, or it might mean adding weights, styles that didn't exist originally, or it might mean adding bells and whistles that the competition doesn't have. Compare old Adobe Garamond v Adobe Garamond Premier Pro and on glyph count along I bet the new version is better value for money - and the OpenType features makes it much more powerful.</p>
