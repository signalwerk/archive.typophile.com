      <p>I think a valid point is the fact that sometimes you buy a font and don't get to use it. During two projects I recently bought Bryant and Delicato and it turned out both didn't work for the respective jobs. Notbecause the clients disliked them but because once used in the real document, I didn't like the final look. It just didn't fit, it wasn't what I thought it’d look like. So... While I figure that maybe I'll get to use them some day, it still was pretty frustrating, and again I found that you can't judge a font by looking at it online, be it PDF or even a typesetter-tool. The only way to judge it is to work with it on a job, print some stuff and SEE first-hand if it works in context. </p>
      <p>Apart from that, I don't think fonts are too expensive. While the collector in me wants to have them all, to have maximum choice, and while as a small bureau it's indeed a factor that you cannot just buy a new typeface for some low-budget-jobs, no maztter how much you'd like to, I still almost never feel ripped off by most foundries. There are exceptions, such as TEFF, but all in all, I think there is a large collection of fonts that are available and at 200-400 € for a family don't feel overpriced at all. Especially if they're OTF. </p>
      <p>HD Schellnack</p>
