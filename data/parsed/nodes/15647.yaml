      <p>&gt;In a way doing a high-quality revival of a typeface where a lot of competition already exists is harder than doing an original design.</p>
      <p>Full reply: </p>
      <p>I have to disagree with the philosophy you're expressing, which measures the value of design in quantitative terms, thereby supporting the price-carpers: If a font is going to be valued for the number of features it contains, and the user get similar high-quality features free with bundled InDesign/Mac/MS fonts, than any price is going to seem too expensive. </p>
      <p>It is a mistake to value a restyling of a classic as much as an original design.<br>
      Certainly, it can take as much work to do a revival as an original, but that begs the question of the value of the kind of work involved -- it suggests that original design is undervalued in relation to production work and revivals.  </p>
      <p>How to overcome the perception that computer designed work is not worth much because it's mere technical grunt labor? Or stuff any kid could do with the right software? Not by apologetically rationalizing prices, explaining all the skilled technical effort involved, because you can always get that kind of labor cheaper, or diluted to nothing in a multi-national's commodity.  </p>
      <p>If you must, charge a premium price for giving an old whore a facelift, with all the OpenType deelybobs, but also demand top dollar for a staggering new work of genius even if it's only available in good old Type 1.</p>
