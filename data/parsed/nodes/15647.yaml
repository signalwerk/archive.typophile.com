      <p>This comes up with me *all the time* when I'm teaching typography. After suffering the same inarticulate frustrations as you, I end up getting into some rather arcane details re the time spent with kerning pairs, hinting (which I am practically making up as i go along), bezier curves and all sorts of shit that they're too young to know, but with which they are quite impressed. </p>
      <p>One of the things i do is show them some screen captures from FontLab of the character sets and outlines of free fonts vs. a good commercial font. I tell them how many free fonts contain incomplete character sets, and how many of them are quickly and roughly autotraced, and i zoom in on the horrors of hundreds of twisted bezier points. Then I show them some breathtaking outlines from e.g. Ross Mills' Plantagenet and go on and on about how much time it takes to make that perfect, and how when you print these at large sizes you can see the beauty of the curves blah blah blah.</p>
      <p>I also warn them that poorly constructed fonts can cause Postscript errors (which may not even be true), acne and heart disease.</p>
      <p>I also encourage them, if they must use free fonts (and poor wee students always do), to go to good font designers' sites (of which i provide them a list), and try some of the free fonts they have on offereing which are either "teasers" or sometimes abandoned projects, but bound to be better constructed than what they might find at zang-o-fonts or whereverthehell they're picking up this shit.</p>
      <p>How truthful any of this is undoubtedly debatable, but I too would appreciate a little more weaponry in this crusade of explanation.</p>
      <p>Incredibly, a student recently noted the poor spacing in the free font they used for a headline, and the time they spent to fix it. </p>
      <p>-marian</p>
