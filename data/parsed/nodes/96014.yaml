  html: |-
    <p>Well, today I registered the domain name iLUVfonts.com, and decided to celebrate by opening up my entire catalog to anyone who thinks that they can improve any of my fonts, for an equal share in the revenue. I am going to be less active in font development, and a lot more active in marketing and promotion.</p>
    <p>I am especially interested in non-Latin scripts. Rather than taking the one-big-ball-of-wax approach (many bytes and much moola), I think that the buying public would be well served with Latin+Greek or Latin+Cyrillic, at a very nice price (ten bucks a pop, or so). Some of my fonts are probably a little too wacky for Arabic, but maybe there are a lot of wacky Arabs out there I don't know about.</p>
    <p>Also open for consideration: contextual alternates and ligatures to jazz things up. Also available: over 160 works in progress, all in various stages of completion.</p>
    <p>And, if there are any Illustrator gurus out there, I would be happy to pay for a license for LivePresets, if you think that you can fix my "no-stroke" spacer problem in my AI Border Brush sets.</p>
    <p>Revenue splits will happen with each sale as it is posted and cleared: PayPal account required. See my complete commercial collection at myfonts.com, then let's talk: kipnick [at] msn [dot] com.</p>
  html_clean: |-
    <p>Well, today I registered the domain name iLUVfonts.com, and decided to celebrate by opening up my entire catalog to anyone who thinks that they can improve any of my fonts, for an equal share in the revenue. I am going to be less active in font development, and a lot more active in marketing and promotion.</p>
    <p>I am especially interested in non-Latin scripts. Rather than taking the one-big-ball-of-wax approach (many bytes and much moola), I think that the buying public would be well served with Latin+Greek or Latin+Cyrillic, at a very nice price (ten bucks a pop, or so). Some of my fonts are probably a little too wacky for Arabic, but maybe there are a lot of wacky Arabs out there I don't know about.</p>
    <p>Also open for consideration: contextual alternates and ligatures to jazz things up. Also available: over 160 works in progress, all in various stages of completion.</p>
    <p>And, if there are any Illustrator gurus out there, I would be happy to pay for a license for LivePresets, if you think that you can fix my "no-stroke" spacer problem in my AI Border Brush sets.</p>
    <p>Revenue splits will happen with each sale as it is posted and cleared: PayPal account required. See my complete commercial collection at myfonts.com, then let's talk: kipnick [at] msn [dot] com.</p>
