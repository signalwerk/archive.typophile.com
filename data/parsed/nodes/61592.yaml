  html: |-
    <p>I'm working on a logo for a brand. It's about home-made deli food (delicatessen)produced in smaller quantities. It's a food with a twist which means it contains interesting mix of ingredients in otherwise ordinary products.</p>
    <p>I'm looking for suggestions for typeface that would communicate HOME-MADE, WARM, and in the same time EXCLUSIVE (high quality) .<br>
    I already have a solution for expressing "food with a twist" part so the type doesn't have to express that. Maybe a slight touch of "a twist" in type would be OK. I am particulary interested to see SERIF typeface suggestions.</p>
    <p>I'm only looking for a professional typeface since we're talking about high quality product.</p>
