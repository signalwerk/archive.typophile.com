    html: <p>Hmmm...thanks for the suggestions.However, I want to keep the type simple with just a touch of "difference". Also these fonts like Clarendon and Avance seem to be a little too rough in this case. I imagine the needed type would be a bit more softer (a bit rounder or finer letters than in suggested types). It's a small food production company so I want it more warm.</p>
