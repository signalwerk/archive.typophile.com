    <p>hi all!</p>
    <p>this font obviously has seen a '70s baisse foreclosure! half its serifs got chopped!</p>
    <p>the handling of serifs in this font is …special - YOUR expert eye might recognize the font immediately where<br>
    wtf couldn't do the job; i tried identifonts "tools" as well (specialty capital_y has a lead) but it is not in its listing.</p>
    <p>sorry:  but haydn is just a 5 letter word! ;)</p>
    <p>(as a one off: has anyone ever seen a non-italic bodoni with such an open small_g? accent aigu perhaps interesting too)</p>
    <p>thanks !!</p><div class="imageWrap"><img src="http://typophile.com/files/2222_5872.jpg"></div><div class="imageWrap"><img src="http://typophile.com/files/3333_5085.JPG"></div><p></p>
