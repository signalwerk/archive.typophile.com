    html: <p>Looking through Typophile’s archives, I learnt that the original designer of Carolus is Karl-Erik Forsberg (<a href="http://www.linotype.com/710/karlerikforsberg.html" title="http://www.linotype.com/710/karlerikforsberg.html">http://www.linotype.com/710/karlerikforsberg.html</a>) and that there was a digital version of the same name by Image Club, also published by Corel as Carleton.</p>
