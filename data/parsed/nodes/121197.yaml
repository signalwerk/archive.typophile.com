      <p>excellent! that's of great help!</p>
      <p>since dpape pointed to a digitised font which essentially has the same name as the original i guess its ok to award him the title :)<br>
      special thanks to riccard0 (again) for very valuable info - dafonts version is a little oddly digitised?! - with your help i found a better suiting digitisation!</p>
      <p>i'll keep it open for a bit longer though because i'd like to see if there's some more coming up in regards of the 2nd font;<br>
      i have read a thread on differences between bodoni and didot; dpape very cleverly came up with a didot - but although small_a has a didot-belly, small_t (both not pictured) has a bodoni-antenna and serifs are tapered bodoni-style…</p>
