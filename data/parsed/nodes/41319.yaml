    <p>Bryant 2 &amp; Pro<br>
    Designed by <a href="/wiki/Eric%20Olson" class="freelinking" rel="nofollow">Eric Olson</a> 2002–2005</p>
    <p>Bryant 2 and Bryant 2 Pro are the completely re-drawn and updated versions of our original <a href="/wiki/Bryant" class="freelinking" rel="nofollow">Bryant</a> series released in 2002. Initially a simple family of four fonts modeled around the popular Wrico lettering kits used by draftsmen and amateur sign makers in the 1960s and ’70s, Bryant 2 &amp; Pro is now an expansive family of fonts for anything from worldwide branding projects to simple one-off posters.</p>
