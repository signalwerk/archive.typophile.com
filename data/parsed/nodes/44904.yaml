      <p>As an old fart myself, I find it odd that we are suddenly dumped into a catagory that erases all former appreciation for typography. I don't think there is such a thing as a geezer font. Make a decent layout with good type. Perhaps avoid the grunge stuff or anything stressed out but any reputable text face should work.</p>
      <p>ChrisL</p>
