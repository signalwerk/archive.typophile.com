      <p>I agree with Darrell that you probably are relying on the typography too much and neglecting the other aspects of design - we all know that the feel is determined by the sum of all elements combined.</p>
      <p>That beeing said I agree with the points on typesize and legibility. I would probably suggest a Scotch for its large x heights which in my view results in an easier read (ps: I'm dyslexic). One example of a nice Scotch is H&amp;FJ Chronicle.</p>
