    <p>Imagine yourself in a mediocre retirement community surrounded by peeling pastel wallpaper enjoying a game of bridge with a tall, cold "pink lady" (a mixture of orange and cranberry juice). Picture painted? </p>
    <p>I am trying to find a typeface to communicate that you're not throwing in the towel or losing your self-worth when entering a retirement community but simplifying your lifestyle and joining a support system. Currently, most retirement home identities resemble a combination between a funeral home and a suburban subdivision. It should be comforting and inviting and maybe even a bit exciting. these are human beings with life in them, not beige cookie-cutter ranch houses with 2 door garages. </p>
    <p>One thing that I am hung up on is generational differences. In this tough decision making process, what speaks to baby-boomers opposed to generation x? is there a timeless answer?</p>
    <p>Just keep in mind that old people can't read. Kidding, I love you granny.</p>
    <p>Any ideas?</p>
