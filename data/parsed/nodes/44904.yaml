      <p>First, lose the condescending attempts at wit, whippersnapper.</p>
      <p>Make sure you don't fall in the pithole of using type in too small a size. Older people will want bigger text, online and in print. This doesn't mean 24 point like in large-type books, but keep away from the very small type. </p>
      <p>Don't design for end of life ... design for ease of life ... retirement is payback for the hard work of 40 years. Keep it clean and open, show some quality, but not wanton wasteful luxury.</p>
