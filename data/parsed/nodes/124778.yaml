    <p>Hello everyone,</p>
    <p>I'm currently looking for information regarding the font 'dosis' by Edgar Tolentino and Pablo Impallari.</p>
    <p>I'm working on a university project, creating a typographic specimen and I'm looking for as much information about the font as possible, in particular, what it was originally designed for and where the name came from. If anyone could help that would be extremely helpful. </p>
    <p>Kind regards and thanks in advance for your help!</p>
    <p>Hayley</p>
