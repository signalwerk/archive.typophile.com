      <p>Hello Nick, your list example: If period and comma were half of the tabular-width, then it would be ok to apply such a 'tnum' to list numbers. (A character style with 'tnum' applied to the number only would work best, rather than applying 'tnum' to the entire paragraph.)<br>
      Another question (raised above already) is, is it sufficient if period and comma are of equal width, whatever it is, or does it need to be the width of tabular numerals?</p>
      <p>These suggestions introduce an interesting use of 'tnum'! In my current understanding, the effect of applying 'tnum' is the reverse of applying 'pnum', and default would reflect one  of them -- which makes two options. The suggestions however imply that 'tnum', 'pnum' and default (none of both applied) are three options. (While by default, punctuation marks or currency symbols may differ in width while numerals may be tabular, applying 'tnum' will turn them into tabular-width ones.) Good idea.</p>
