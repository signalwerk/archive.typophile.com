      <p>We don't set many scientific tables, except for a few dismal ones (economics).</p>
      <p>With that caveat, I don't think the period &amp; comma have to be figure width, but they do need to be a comfortable width -- so, for a font like Minion, we made up tabular commas and periods. I just took a look, and the period &amp; tab have a setwidth of 455 units, while the numbers have a 500 unit setwidth. The regular period has a 242 unit setwidth, and is just too tight with numbers, esp. in a table. (This isn't Minion Pro, but a multiple master "instance.")</p>
      <p>I've also always liked an asterisk at tabular number width, for statistical tables.</p>
      <p>We also usually make up separate arithmetic operators, one set for old style figures, one set for lining. Not so much a width problem as a hight issue. I suppose it would be nice to have them on the figure body -- usually they're close anyway -- although unless they have generous or TeX-like (mathematical) sidebearings, you usually set the arithmetic opeators with a space.</p>
