      <p>"What characters do you need to have on consistent tabular widths?"<br>
      This depends somewhat on the application, (not program, but rather use, including the size of use, but normally, it was:<br>
      figures, figure space, and monetary signs on the figure width. Yen and Pound often needed special drawing for this, with $, ¢ and what was called florin, being fine with but a single drawing. The Euro is and Ruble will be, I think, closer to the Yen and Pound in requirements.<br>
      : . , ' and " on 1/2 of the figure width, ; usually followed : just for consistency, on a 1/4 em.<br>
      vulgar fractions were 1.5 figure width.<br>
      Normally the figures were on 1/2 em, so the 1/4 em space was used to tab both punctuation and fractions, along with the Em to finish lines, or pile on to the next tab..<br>
      Assuming then, that your tabularity was based on mulitiples of a full em, there was no problem composing anything.</p>
      <p>I'm wondering if OT can be trained to automatically sub . and quarter em for .  ... or fractions and quarter em for fractions, when in tabular use, but not too hard...;)</p>
      <p>Cheers!</p>
