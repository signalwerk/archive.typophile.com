    <p>A question for those of you who use tabular figures: What characters do you need to have on consistent tabular widths?</p>
    <p>Numbers, of course. </p>
    <p>What about period and comma -- are these important to have on the same width? Generally, I would expect them to line up on themselves, so if period and comma were the same width as each other, would they need to be the same width as the numbers?</p>
    <p>What about colon (for times)? Semicolon?</p>
    <p>Is it important to have a space specially fitted to the tabular width?</p>
    <p>Is it important (or useful) to have tabular fractions? On the same width as the numbers, or is it enough that they all be on the same width across fractions? </p>
    <p>Arithmetic operators: + – × ÷ = &lt; &gt; ±, etc. ?</p>
    <p>Monetary symbols? Percent? Section symbol? Parentheses, braces, and brackets?</p>
    <p>There seems to be a wide variety of implementations among OpenType fonts with the {tnum} feature, so I'd be curious to hear from users -- designers who actually make annual reports and financials and timetables . . . what else? -- what they expect/need from their tabular figures.</p>
    <p>-- Kent.</p>
