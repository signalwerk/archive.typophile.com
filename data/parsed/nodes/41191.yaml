      <p>I think the multiple definitions of 'tabular', and 'you' lurking in the question: "What characters do you need to have on consistent tabular widths?" have been explored, and though I hardly ever pine for the days when 'simple typists' solved these problems simply by using typewriters, I pine now. But now the pining, it's over. </p>
      <p>"The tab has cured most of the evils."<br>
      This too may be true, but take 2 tabs, and you'll never know evil ever existed...</p>
      <p>Cheers.</p>
