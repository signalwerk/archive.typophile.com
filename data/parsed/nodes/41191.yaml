      <p>But surely that is the "Tabular Oldstyle" and "Tabular Lining" features, which basically substitute one set of figures with another.<br>
      Now Kent is wondering if these features should also substitute monowidth, figure-width:</p>
      <p>- period and comma<br>
      -fractions<br>
      -space<br>
      -etc., etc.</p>
      <p>Sounds like a good idea, but are there situations where tabular figures would be required with regular punctuation, etc?<br>
      Yes, with a numbered list, for instance.<br>
      So a stylistic set would probably be better--but I'm not sure these are user friendly, and are also in danger of becoming bloated.<br>
      Wouldn't typographers rather have easy access to setting specific glyphs, rather than diificult-to-navigate-to OpenType features that have global effects which are not always apparent exactly what they do?</p>
