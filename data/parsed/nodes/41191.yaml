      <p>Typewriters had tabs, which one could zing the carriage along to, at which point it came to a crashing halt.<br>
      The digital equivalent would be to have the tab marker "snap to" increments of the tab figure width.<br>
      But there's be no point, other than for pining nostalgia buffs.</p>
      <p>The tabs in Quark and InDesign are brilliant. Aligning to the decimal point is indispensible, and the ability to make a sequence of characters into a leader is a lovely bit of fluff.</p>
