      <p></p><div class="imageWrap"><img src="http://typophile.com/files/figspace_3418.jpg"></div><p></p>
      <p>Is this the kind of thing that gets set in mechanical equipment catalogs in the USA?</p>
      <p>If so, there are a number of questions:</p>
      <p>1. In the second measurement, where there is no fraction, is is good practice to leave a space before the inch mark? If so, it makes sense to have the fraction width correspond to the tab figure width, so that the typographer can use "Type &gt; Insert White Space &gt; Figure Space" (InDesign) to easily access the hard space.</p>
      <p>2. Wouldn't it make sense for fonts to have their basic quote marks (hash marks) on an angle? -- identical glyphs, in fact, to the proper minute (foot) and second (inch) characters. That way, they wouldn't be so hard to find and set.</p>
      <p>3. Are there similar issues in recipe books?</p>
