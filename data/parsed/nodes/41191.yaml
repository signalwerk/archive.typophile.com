      <p>Chris -- Yes indeed, building {tnum} is exactly why I'm posing the question. I know it would be simple to include tabular punctuation, for instance, but is that necessary or desirable? </p>
      <p>In a table of financials, for instance, presumably the period and/or comma would always be aligned with itself, so it's not necessarily important to have them on the same width as figures. Probably not a bad idea to have the two on the same width, perhaps. </p>
      <p>What about scientific tables? Again, I would presume that the majority would align on the decimal point, or have a consistent number of digits after the decimal. But, maybe not?</p>
      <p>Monetary symbols: Don't they always lead the figures? So do they really all need to be on the same (tabular) width? (Minion Pro includes tabular monetaries in {tnum}, but Arno Pro does not, for example.)</p>
      <p>I, too, fit the arithmetic operators on the same width -- but this width doesn't necessarily relate to the figure widths. Should they be adjusted to tabular figure width for {tnum}? Again, if they align with themselves, then consistent cross-operator width is sufficient. If they align against numbers, then they would need a consistent tabular width. But is there any kind of practical situation that would require operators aligned against numbers?</p>
      <p>Linda -- You make a good point about the declining use of fractions in stock financials. Tabular fractions are probably only truly valuable in an agate font specialized for stock reporting.</p>
      <p>-- K.</p>
