      <p>Thanks for your thoughts, Linda. </p>
      <p>Yeah, I was really thinking about Financials when I mentioned fractions. I was imagining columns of stock prices in tabular columns and thinking that if they use fractions and they're right-aligned, then the fractions need to be at least on a consistent cross-fraction width, so the column doesn't waver. Whether they need to be on the same figure width (i.e., probably a nut fraction) would depend on whether you could expect to find figures and fractions in the same column.</p>
      <p>-- K.</p>
