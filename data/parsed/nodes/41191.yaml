      <p>One reason to do it outside of some practical reason* is to fulfill an aesthetic imperative. </p>
      <p>If you have tabular numbers they take on a certain look and a certain evenness. Having the Currency symbols "fit" that look or visual scheme might be better. I think this is like that oft repeated and I think accurate idea that oldstyle figures look better if the number is set into text. </p>
      <p>Another reason would be to continue a modernist urge to regularity in general. I suspicious of that urge these days because I think it was taken too far but it is an idea I understand and can see the practical appeal of. </p>
      <p>*If you start a line of numbers with a dollar sign &amp; it has one width &amp; then another with a Yen sign and the Currency symbols have different widths the two lines of tabular numbers will be out of synch. There are more ways to look at this than using a set width and an optically equal glyph; one that appears to be the "same" size which is what MS seems to like best. You could instead use the same width and position the currency glyph so it's right side relationship to numerals is similar but allow the left side is visually vary in width. You could even let it slip past the bounding box on the left. There might be legit reasons having to do with hinting or something that would preclude that sort of thing.</p>
      <p>But my main point is that I think practicality &amp; aesthetics may have erroneously become conflated here.</p>
      <p>Am I off track here?</p>
