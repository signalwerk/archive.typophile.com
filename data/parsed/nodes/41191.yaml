      <p>The true brilliance of the modern digital tab is that a very precise point can be set and repeated and become part of a style sheet that can provide consistent repetion as desired. We can have left aligning, right aligning, center aligning and decimal alining tabs thereby opening the world of tables to sensible production means.</p>
