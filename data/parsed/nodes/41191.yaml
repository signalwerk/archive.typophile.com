      <p><cite>. . . but are there situations where tabular figures would be required with regular punctuation, etc? Yes, with a numbered list, for instance.</cite></p>
      <p>I'm trying to think this through, so don't jump on me for a bonehead mistake, but if you want to use tabular figures in a list, there is no reason you have to use the tabular period with them -- i.e., if formatting direct entry, don't highlight the periods. If coding files, don't include the period in the character code. You wouldn't want any other numbers in the list to be tabular, so not everything in the list could use tabular numbers anyhow. In point of fact, I *think* I've used the tabular periods with list numbers anyway, and just used less of a ditch to the list body.</p>
      <p>I've been making up fonts with a tabular period &amp; comma in "tnum" (for some fonts) for a year or so now, &amp; none of the comps has complained. Which isn't to say they shouldn't have. </p>
      <p>Also, BTW, different arithmetic operators, dollar signs, and occasionally pound sterling as a part of "onum" &amp; "lnum"</p>
