      <p><em>figures, figure space, and monetary signs on the figure width.</em></p>
      <p>Yes, this is the general belief, although rarely implemented in practice.</p>
      <p>Microsoft standards help propogate the myth, and offer the usual "reasonable" explanation:<br>
      <em>Fonts with tabular figures should have monetary symbols that are tabular so when they are used for monetary amounts in columns or spreadsheets the data will align</em></p>
      <p>However, I have never come across such columns or spreadsheets where this width equivalence is necessary.<br>
      It may have been useful in the days of hard metal space, but surely tabs, set digitally, have made it unnecessary.<br>
      Even if there were the occasional instance of tab-figure -width currency being useful, is that really enough of a reason to either distort the default currency figures into a narrow width, or go to the trouble of providing an alternate set of figures?</p>
