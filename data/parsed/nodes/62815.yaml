    <div class="info">Submitted by <a href="/user/48972" title="View user profile.">D and AD Awards</a> : 7.Oct.2009 9.57am </div>
      <p>D&amp;AD has celebrated and nurtured outstanding work in design and advertising since 1962. The Yellow Pencil is recognised the world over as a symbol of true creative achievement. </p>
    <p>Typophile readers and subscribers are invited to enter their finest type and typography of 2009.</p>
    <p>The dedicated jury of type experts look to give awards to original and inspiring ideas that have been exceptionally well executed and are contextually relevant. </p>
    <p>Winners are announced at the D&amp;AD Awards Ceremony, published in the D&amp;AD Annual and celebrated online.</p>
    <p>To view 2009 winners, the 2010 Awards judges and to enter, visit <strong>http://dandad.org/awards/</strong></p>
    <p>Final deadline Wednesday 27 January 2010</p>
    <p></p><div class="imageWrap"><img src="/files/n5551464821_6770_4767.jpg"></div><p></p>
