    html: |-
      <p>A good certificate needs…</p>
      <p> - lots of white space<br>
       - a pattern somewhere<br>
       - black ink + red emphasis<br>
       - to be letterpress printed</p>
      <p>A typical certificate has…</p>
      <p> - a bunch of blackface type<br>
       - a bunch of calligraphic type<br>
       - printed on a lazer printer<br>
       - been stuck in a $2 frame</p>
      <p>So, my advice would be to design a certificate that you’d fine aesthetically pleasing enough to hang up on a wall as an actual piece of art.</p>
