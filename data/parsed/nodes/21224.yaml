    html: |-
      <p>I think the problem with most certificates is they do rely on what has been done. The intent of a certificate is to give the recipient tangible proof of there achievement. With that it needs to “feel” and “look” worthy of this. </p>
      <p>For the cursive script I might recommend <a href="http://www.p22.com/ihof/zanerproset.html">Zaner Pro</a>. The upside of this is two-fold. It is based upon the writing style of a lettering teacher who might have done something which needs decoration. The second being it was digitized by our own Paul Hunt. Take a peek at it. I’d say the way the name appears will set the tone for the rest of it. </p>
      <p>Is the border set, or are you designing that as well?</p>
