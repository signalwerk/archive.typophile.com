      <p>I detect a serif on the underlying shield. Is that Scala Serif? If not, have you considered using it?</p>
      <p>One point … Can you get the name of the Dean in sans, as well as the signature? Most university officials signatures cannot be read by humans :) and in the future the grad might want to know the name that is scribbled on the form.</p>
      <p>Also, be aware that the college might want more than one signature. When I was involved with the University of Toronto, there were up to four signatures on the degrees.</p>
