    <p>Hi everyone,</p>
    <p>I am assigned with the job of designing a few certificates for participation, excellence in individual fields and a few other general categories.</p>
    <p>Please help me with choosing the right fonts for the job under 3 categories. I already have a few on my mind mentioned below. Please don’t hesitate to comment on them too</p>
    <p>1.Serif : I have Scala, Nexus &amp; Berkeley<br>
    2.Sans: Univers, Flama, The Sans<br>
    3.Cursive/Script : Bickham Script Pro, Palace Script, Flemish Script</p>
    <p>If it’s not too much can someone suggest what colors will look good for certificates. These certificates are for a Medical University.</p>
    <p>Any help will be greatly appreciated. Thanks in advance</p>
    <p>LordKV</p>
