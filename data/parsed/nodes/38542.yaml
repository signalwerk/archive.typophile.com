    html: |-
      <p>It may be appropriate to add to the part <em>24. Always spell check!</em> "Even<br>
      if text is given to you by a client, check it.", that it is not advisable to correct text that is given to you, unless you are asked to do so. You can point out errors to the writer, but do not correct it yourself. Some 'errors' in the text might be on purpose, so if you correct it you could ruin the text. Only correct with permission. At least, that is what I have (learned) as a rule.</p>
      <p>Also the bit called <em>28. Indents</em>, I think this is to be decided by the typographer/typesetter, only if he/she thinks indents are appropriate for the particular text he/she is working on. It's not a rule, because it is not always necessary.</p>
