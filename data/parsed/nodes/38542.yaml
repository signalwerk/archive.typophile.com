      <p>2. Why put quotes (single) around em and en? The terms are not quoted in the explanation, and quotes seem to be out of place in the rule text.</p>
      <p>3. I would loose "true" in "true quotation marks". While there are fake small caps and true small caps, I don't think there are any fake quotes. There are simply quote marks and feet and inch (prime) marks.</p>
      <p>9., 10., 28. I think uppercase "not" is over the top. Rule 24 works effectively with a bold word, perhaps these three would too. Perhaps emphasis with italics would be even better?</p>
      <p>13. I am not sure how other people feel about this but Airal, Helvetica, Meta are all huge at 9pt. I'd say 7pt is a more appropriate lower figure. And I'm not talking about special cases (like faces not likely to be used for extended text, or special cases like children's books). I am talking about mainstream type.</p>
      <p>17. I believe the period after "caps" should be a comma.</p>
      <p>19. I don't feel this rule is necessary at all. You can never get it right with absolute measures like inches anyway. To me this falls under 16 where you do talk in character count unit (some people express it in ems too). </p>
      <p>24. "spell=check"?</p>
      <p>26. "Whine"?</p>
      <p>28. Quoting em again seems unnecessary. I don't think an em can be equated with 3 spaces. I would simply loose spaces reference altogether. I would also advise students against using tabs. Indents option in the software is the only way to go, imho.</p>
      <p>29. Just omit...</p>
      <p>Hope that's constructive.</p>
