      <p>A few you missed... ;-)</p>
      <p>1. Always use capitalization consistently (unlike rule 4 and 10)<br>
      2. Never have three hyphens in a row (as in rule 1)<br>
      3. Never use a period in place of a comma (unlike rule 17)<br>
      4. Don’t use = in place of a hyphen (as in rule 24)<br>
      5. No whiners (as in rule 26)<br>
      6. Always have an even number of rules (that should be rule 30)<br>
      7. Don’t patronize Mac users – they know that the Mac didn’t invent proportional type.<br>
      8. Avoid the use of emoticons :-(</p>
