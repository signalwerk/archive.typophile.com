    html: |-
      <p>Firstly, I 've got your back on No. 29! I worked at a newspaper for several years, where AP style says omit that last comma. Even then, though, I recognized that clarity may call for you to use it (no style rules should be absolute; they should be used as guidelines to enhance clarity).</p>
      <p>This may reflect my time with the newspaper, but regarding rule No. 3: I understand that only periods and commas go within quotation marks. Other punctuation, such as semi-colons, still sit outside the marks. I'd be interested to hear of another style guide that says differently (I always found that rule awkward).</p>
      <p>Finally: I'm not sure how you mean that an en dash is used to denote a duration of time. That may very well be true, but I'd need an example to know just what you mean.</p>
      <p>Lindsay</p>
