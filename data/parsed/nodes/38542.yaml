    html: |-
      <p>I think a short list of 'blunders to avoid' can be useful, but not a 3 page guide to good typography. That takes a book, like Bringhurst, Felici, etc. </p>
      <p>Cases in point: </p>
      <p>"Rule 12. Increase line spacing to improve readability in text." </p>
      <p>Too much leading is also a problem. </p>
      <p>"Rule 19. Ideal Column width." </p>
      <p>Your recommendation on ideal single column width of 4 1/2 inches is just wrong. Both Bringhurst and Felici both recommend about 2 1/2 lower case alphabets for ideal measure in a single column. The physical length will be affected by the typeface chosen. Also it will vary with leading, etc. </p>
      <p>A good relationship between font, measure, leading, number of lines, and margins is a complex subject, and central to good typography. The books devote a lot of pages to it, with illustrations. </p>
      <p>Also the writing here is too loose and informal for a guide.</p>
