    html: |-
      <p>Why indeed! A valid question. But not one much different from "Why isn't all education free?*". </p>
      <p>But on a more practical level the reason is that we have basic costs that we have to cover. Students get a discount because we believe in that and because of the donation of space and resources the University gives us. AIGA and ATypI members get a discount too albeit not so deep. We want to support them too. </p>
      <p>I suspect that there is also the question of self-selection. The students we have had have been amazing. They have been very motivated. If Crafting Type was free they may have been less focused. The idealist in me is not excited by the way that this works as a psychological factor. However like it or not, it clearly a very real factor. Oddly enough it was a student that told me this was true for them which is how I started to think about it.</p>
      <p>If someone would like to give Crafting Type an endowment to allow travel etc and we could easily be a not for profit. Our status is a default rather than a necessary state. But as things stand now we have to come out slightly ahead to be able to keep doing this. In this way we are a bit like TypeCon or ATypI despite the difference in status and stature. We all have to keep slightly ahead or stop holding events. </p>
      <p>Crafting Type helps students gain insight into how hard it is to make a nice typeface and how wonderful a nice typeface can really be and why. We also do the type industry in general favors because we put names and faces to the makers of type so that student realize that real people make type and if they license a type it is a meaningful thing. We explain what EULAs are and why the license status of a typeface matters. Dave myself and Vern will also sometimes vary and disagree with each other in class about these issues and design issues to encourage students to make up their own minds. </p>
      <p>There is one very big difference: we don't plan for this to happen once a year or even three times but rather much more often. Expect to see Crafting Type anywhere people want it to arrive.</p>
      <p>*I think it should ideally be free but as a society you have to rearrange your priorities and accept the loss of privilege for some for that to happen. I am all for that. A level playing field is the best way for merit to rise.</p>
