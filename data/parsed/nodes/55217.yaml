      <p>&gt; Russia caved on pirate sites </p>
      <p>I can assure you that this is simply not true. Even the closure of the infamous allofmp3.com was a staged farce. It was closed alright, but it reopened under a different name in A DAY and it is still in operation.</p>
      <p>Also keep in mind that bulling Sweden or shutting down TPB won't help the cause. The technology is out of the bottle and it effectively invalidated established licensing methods. There is simply no going back to the old ways. That's pretty much like giving people a taste of driving a car and then forcing them back on a donkey. It ain't going to work, scaremongering or not.</p>
