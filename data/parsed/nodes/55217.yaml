      <p>Day 10 - <a href="http://torrentfreak.com/the-pirate-bay-trial-day-10-calls-for-jail-time-090302" title="http://torrentfreak.com/the-pirate-bay-trial-day-10-calls-for-jail-time-090302">http://torrentfreak.com/the-pirate-bay-trial-day-10-calls-for-jail-time-...</a></p>
      <p>Preceding days are covered there too, should be easy to find.</p>
      <p>All in all, the prosecutors don't have a chance. If TPB is found guilty, then any other search engine is at fault for the exact same reasons. RIAA/MPAA's only argument is that TPB doesn't cooperate with them in removing "unwanted material" (while Google allegedly does), but until there's a law that tells TPB to do that, they are in the clear.</p>
      <p>It's really interesting how all this plays out.</p>
