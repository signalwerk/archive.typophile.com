  html: |-
    <p>Recently a blog - <a class="freelinking external" href="http://www.rockthatfont.com" rel="nofollow">Rock That Font</a> - has come along that covers two things that I'm a fan of, typography and great music. The blog consists of essays by resident and guest contributors covering the typography and other design elements of various beloved albums. </p>
    <p>Participants in (and readers of) <a class="freelinking external" href="http://typophile.com/node/41650" rel="nofollow">the 2008 Typophile thread</a> concerning Joy Division's <em>Closer</em> font should be interested to see how it informed <a class="freelinking external" href="http://rockthatfont.com/2010/06/12/closer/" rel="nofollow">this post by guest contributor David Shaw</a>, originally published in <a class="freelinking external" href="http://blog.belm.com/" rel="nofollow">his own blog.</a></p>
    <p>- B</p>
