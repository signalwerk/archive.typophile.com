    html: |-
      <p>A line or two parallel lines through something is the common element that says "this is a currency symbol." A new global currency would be best represented by something simple and easy to write quickly. (So, not a totem pole made of most other symbols, sorry.) I'd say a circle (for the globe) with two vertical lines through it. Allow for as much variance as the dollar sign has (just one line sometimes, break the lines to leave the inside uncrossed, make it a tiny superscript on a stick, whatever) or more (horizontal lines, why not). A closed phi ϕ could be used wherever encoding hasn't caught up — or indeed the generic ¤ since it's not far from the idea and isn't being used for much else. It would always be placed at the start of the number, like the dollar and pound, because then, if it happens to look too much like a stroked zero, it won't change the number.</p>
      <p>Edit: I left the computer and Hrant got in before I hit Post — agreeing independent conclusions make it clear how self-evident this answer is.</p>
      <p>Edit 2: Goodness, no, not the power symbol! In whatever future this is supposed to take place, you'd want a clear distinction between "on/off" (touching this starts the thingy) and "pay now" (touching this will cost you money).</p>
