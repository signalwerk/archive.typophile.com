    <p>When the European currencies were amalgamated into the euro, someone had to design a new currency symbol for it. When I first saw the euro symbol before that currency was introduced, I thought it looked quite impressive for being well-chosen. Imagine if there were to be a universal or global currency. What would its symbol look like? It would have to be different from the "sputnik" or generic currency symbol that already exists, and should resemble other currency symbols such as the euro, yen, dollar, pound sterling etc. Although I know that this should look terrifying (not terrific) to those who understand it, but why not have a look at one idea that I have had, and see whether you can think of a better concept. I could not fit the symbol for the pound into the design, as it is too asymmetrical.</p>
    <p>Some previous nodes that contain some relevant discussion on the Euro currency symbol requirements:<br>
    <a class="freelinking external" href="http://typophile.com/node/18616" rel="nofollow">http://typophile.com/node/18616</a><br>
    <a class="freelinking external" href="http://typophile.com/node/4148" rel="nofollow">http://typophile.com/node/4148</a></p>
