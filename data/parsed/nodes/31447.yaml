    <p>Sorry for the intrusion, and hope you don’t mind such message here.</p>
    <p>For the cover of a new Typotheque catalogue we are looking for a girl / woman named Greta. Not Margaret, not Greet, but really Greta. We would like to photograph her in our studio, for which we offer a modest fee: cover the costs of transportation to The Hague, NL*; offer 2 books of choice, and 2 t-shirts of choice from our collection. Additionally you’ll get a free license of our upcoming font Greta.</p>
    <p>Please let Greta know.</p>
    <p>How to proceed: please contact peter at typotheque dot com, and send your ID with the full name. We’ll then plan the details.</p>
    <p>* only available for European travel</p>
    <p>See also:<br>
    <a href="http://www.typotheque.com/site/font_in_development.php?id=54/">http://www.typotheque.com/site/font_in_development.php?id=54/</a><br>
    <a href="http://www.typotheque.com/news/newspaper_typeface_greta/">http://www.typotheque.com/news/newspaper_typeface_greta/</a></p>
