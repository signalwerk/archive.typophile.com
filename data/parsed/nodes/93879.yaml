  html: |-
    <p>I'm looking for a web-licensable headline font. Along the lines of FB Titling Gothic or Klim Founders Grotesk in their more condensed widths. Something punchy and clean that looks like a fresh take on a classic. Many older grotesks look very similar, but they somehow seem stale compared to the new-ish releases.</p>
    <p>Any ideas? Thanks!</p>
    <p>Cameron</p>
