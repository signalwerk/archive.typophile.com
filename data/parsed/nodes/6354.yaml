    html: <p> Actually, I have seen things like this, but not in font form. <br><br>I know of <span class="caps">CD</span> collections with company logos in <span class="caps">EPS</span> and/or <span class="caps">TIFF</span> format. You’d probably have more luck looking for these through stock photography/clip art outlets than through typefoundries. You also may ﬁnd that it’s more cost-eﬀective to license only the logos you need rather than the entire <span class="caps">CD</span>, where oﬀered, but this of course would depend on your speciﬁc needs. <br><br>Good luck. I hope this helps. <br><br>David </p>
