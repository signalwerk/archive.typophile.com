    html: <p> Actually, I have seen things like this, but not in font form. <br> <br>I know of CD collections with company logos in EPS and/or TIFF format. You'd probably have more luck looking for these through stock photography/clip art outlets than through typefoundries. You also may find that it's more cost-effective to license only the logos you need rather than the entire CD, where offered, but this of course would depend on your specific needs. <br> <br>Good luck. I hope this helps. <br> <br>David </p>
