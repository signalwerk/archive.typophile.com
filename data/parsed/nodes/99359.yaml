    html: |-
      <p>Hrant: You're right that Garamond is too common, and maybe that's why I chose it. Anyways I really like Pradell. Maybe I'll use it, maybe not (I find it someway expensive) or maybe I'll take note for some future publication. But anyways, thanks!</p>
      <p>Renaissance Man: Haha, no way (I hope). I have no interest in demostrate how mexican my thesis is (though I really like all that national/cultural identity discussion). I'm picking the font we've been discussing because what I'm certainly doing is borrowing some visual elements from <em>El Libro Semanal</em>. Wich are: the size of the publication (pocket-like), some aspects of the paper (recycled from many different other kinds of paper but with a better quality, like handcrafted) and the font.</p>
      <p>What I'm trying to do with this is to make some visual connection between the <em>Libro Semanal</em> and my (publicated) thesis. I'd like to think in both publications like visual relatives, but also it's a way to pay homage to a comic book that I really like because, as you well said, it's very, very "mexican".</p>
      <p>Anyways, although hrant has a point in his last reply, I don't think there is (a variety of) something like "mexican fonts" since Mexico has been always copying fonts from Spain, France and, more recently, United States.</p>
      <p>So, the point is, (1) the <em>Libro Semanal</em> is mexican, that's something I have no doubt. (2) I don't think my thesis <em>has</em> to be mexican. (3) And I'm not thinking that the fonts used in el <em>Libro Semanal</em> are mexican. (4) Anyways, I think Neuzit is a nice font for headlines, chapter names and titles.</p>
      <p>That's it</p>
      <p>(Again, please don't take notice on my bad english)</p>
