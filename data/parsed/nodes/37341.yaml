      <p>As who showed? Where is this demonstration? As I recall, the whole thing went like this:</p>
      <p><em>"Look, it's in Times Roman, which didn't exist at the time! Clearly it was faked on a computer!"</em><br>
      "Times Roman was created in 1931."<br>
      <em>"But there couldn't have been any typewriters that could print it!"</em><br>
      "Actually there were."<br>
      <em>"Well... look, what's this? A superscript! There weren't any typewriters that could do that!"</em><br>
      "Sure, here's one."<br>
      <em>"But... I bet the government never used that model of typewriter!"</em><br>
      "Yeah, they did. See, here are some official documents on record."<br>
      <em>"But...uh...it's extremely unlikely that this one particular kind of typewriter was used in that particular department!"</em><br>
      "That's not how probability works."<br>
      <em>"Hah, nothing to show me now, eh? The burden of proof is on you!"</em></p>
