      <p>I don't think that Rather contests the fraudulence of the document in question. The issue is instead that he claims he was wrongly portrayed as deeply involved in the story, when he was largely just the narrator. And then he was made the fall guy. And the story itself, if not the document, was true: Bush was AWOL and a draft dodger. </p>
      <p>It's probably foolish of Rather to sue, but I wouldn't be surprised if his claims turn out to be largely true.</p>
