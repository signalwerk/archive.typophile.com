      <p>I guess I compare this in part to the Don Imus thing from a contractual level . . .</p>
      <p>The question remains was he fired or did he resign? If it is the latter, I wouldn't think he has much wiggle room to negotiate a settlement but if it was the former, chances are he would've had some clauses in in contract that requires some sort of financial buyout. . .</p>
      <p>Personally I have no opinion on the reasons for dismissal, I'm only throwing in an opinion from the perspective of his contractual employment and make no mistake even network evening news anchors have contracts much closer to actors and singers than employees . . .</p>
      <p>Stuart :D</p>
