    html: |-
      <p>I'm having a hard time finding a category with anything like this style. I have checked MyFonts, Identifont, and Dafont, looking for any close styles. There have not been many, which surprised me. One font called <a class="freelinking external" href="http://new.myfonts.com/fonts/t26/imperfect/" rel="nofollow">Imperfect</a> from T-26 was promising as a potential source of key words or similar fonts, but the results were not close. I also checked the Distressed/Strange Script fonts in my Guide, but not much was similar besides <a class="freelinking external" href="http://new.myfonts.com/fonts/linotype/itc-farmhaus/" rel="nofollow">Farmhaus</a>.</p>
      <p>If I were trying to describe it I would say "irregular sans", but searches along these lines were not helpful.</p>
      <p>It seems likely to be a freebie, but I don't know where to look.</p>
      <p>- Mike Yanega</p>
