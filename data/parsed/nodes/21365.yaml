      <p>Hi Chuck</p>
      <p>Litho Antique doesn't ring any bells directly – maybe someone else will know.</p>
      <p><a href="http://www.ftbauer.com/bswebs.G3?log%3Apkid=2&amp;log%3Acompany=22&amp;log%3Acontract=1&amp;log%3Aserviceid=1&amp;xtd%3Alanguage=es&amp;pkid=2&amp;idcompany=22&amp;idcontract=1&amp;idservice=1&amp;language=es&amp;behaviour=PRODUCT&amp;menukeys=TYPES_BUSCADOR&amp;buscador=venus" rel="nofollow">Venus</a> is an older grotesk from Bauer, I think, maybe contemporary to Akzidenz Grotesk, Standard and Basic Commercial. It is in Jaspert's Encyclopedia of Typefaces and also Rookledge's TypeFinder, so there is a known date of release for it. Not too sure about the designer though.</p>
