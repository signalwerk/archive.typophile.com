    <p>Does anyone know if Litho Antique is available. I've read about it in reference to Rockwell and Stymie, that it was the precursor to them, but have not seen it anywhere.</p>
    <p>Also, does anyone have any info on Venus, such as designer, date of release, ect.</p>
    <p>Thanks, Chuck</p>
