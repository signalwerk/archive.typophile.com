    html: <p>Opti created nothing whatsoever original fontwise. Your desired font was originally Filmotype's (predigital) Lariat Script. The only other digitization I'm aware of is David Rakowski's <a href="http://www.faces.co.uk/fonts/Intecsas/Anderson-Script-IN20151/" target="_blank" rel="nofollow">Anderson Script</a>.</p>
