    <p>I've used OPTI Lariat Script in a layout, and apparently, the font is corrupt. I cannot find it anywhere to purchase it. Does anyone know if this font has been created under a different name, or know a source from which to purchase it? (I have written Castcraft, the foundry but have heard nothing yet.)</p>
