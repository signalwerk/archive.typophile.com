      <p>Found Typophile, looking online for the Lariat font too, for a client--definitely another oldie but goodie, looking forward to Stuart &amp; FontDiner coming out with a digital version!<br>
      In the meantime, signed on to Typophile too.</p>
      <p>Susie</p>
