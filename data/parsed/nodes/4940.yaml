    html: <p>I'm so happy that Franklin Gothic was suggested. I have a fondness for it that goes beyond any natural state. Grew accustomed to  Franklin as a reliable plowhorse and have never outgrown the love of it. <br> <br>I would also like to see it paired with other versions of "Californian". Lanston has the face in the works from his patterns as you all now know from another thread. <br> <br>Good on ya, Tiffany! <br> <br>jim Rimmer</p>
