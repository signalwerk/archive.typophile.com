    html: <p><i> The most important thing to think about is that this represents you and your own style</i> <br>very true. i think i'm overanalyzing now and so it's all starting to feel irrelevant.  <br>Personaly I think Legacy is a good match for Californaian, but i'd agree a bit too friendly and maybe more humanistic feeling than i want for a resume.  <br>Originally I was thinking Gill caps, and tho i love Gill, i think it's a bit too quirky again for a resume. <br>Now i'm thinking Scala Sans Bold SC. I'll agree that for my purposes i want something with a very small amount of modulation. So before i commit... any other ideas to consider? <br>;^) <br></p>
