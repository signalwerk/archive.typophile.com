    date: 2004-05-27T13:56:00
    votes: null
    html: <p>Nearly any plain-spoken and sober, bold-sans  would pair well with ITC Berkley or Californian. <br>I thought Franklin Gothic was a good, compatable suggestion. Try Spartan or Futura bold, too. <br>I also like Penumbra MM for the job. You can go with a plain sans (725 BD 0 SA) or with a subtle spur serif (725 BD 150 FS).</p>
