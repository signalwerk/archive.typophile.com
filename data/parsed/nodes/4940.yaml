    date: 2004-05-26T17:14:00
    votes: null
    html: <p>ok. my first gut would have been franklin gothic. i used to have a client that i paired berkeley with franklin and i liked how it worked. but i played with it for you. if you really want flavor you might look at anisette (see sample below). <br> <br><img src="http://www.typophile.com/forums/messages/30/36830.gif" alt=""> <br> <br>i don't have anything against legacy as a typeface. it is very nice. i simply think it is too casual (a) for a resume, and (b) to pair with californian. </p>
  - id: 143108
    user_id: 108
    user_name: Miss Tiffany
    user_path: null
    user_image: /files/pictures/picture-108.png
    date_raw: 27 May 2004 — 11:47am
    date: 2004-05-27T11:47:00
    votes: null
    html: "<p>Maybe using the word elegant was too easy. Elegant is Bickham script. For a serif (so-called) bookface, Californian is pretty elegant. But it is also not un-friendly. I simply think that it needs something with no (or hardly any) contrast. Sorry. I took this thought home with me last night. The most important thing to think about is that this represents you and your own style, not mine. Tell us what you think about these pairings. It doesn't do you (or me) any good to simply accept what I show you. (and besides it could be a good conversation). <br> <br>I don't have the black weight of scala so I don't know. A few other ideas below:  <br> <br><img src=\"http://www.typophile.com/forums/messages/30/36903.gif\" alt=\"\"> <br> <br>last minute thought: <br> <br><img src=\"http://www.typophile.com/forums/messages/30/36904.gif\" alt=\"\"></p>"
  - id: 143109
    user_id: 103
    user_name: Stephen Coles
    user_path: null
    user_image: /files/pictures/picture-103.gif
    date_raw: 27 May 2004 — 12:20pm
    date: 2004-05-27T12:20:00
    votes: null
    html: <p>I think what these samples show is that most of these sans work <br>well with Californian. What changes with your selection is the  <br>overall feeling of the document. So really, it comes down to what  <br>attitude Paul wants to portray. If it's "classy yet comfy" I still  <br>think Legacy fills the bill. But so does Scala and Meta.</p>
