      <p>Thank you, Andreas, J, and nina! I guess what I'm really looking for is something akin to a digitized <a href="http://userhappiness.com/blog/all-the-fun-of-helvetica-flair/">Helvetica Flair</a>. </p>
      <p>I don't love working in Helvetica except for certain kinds of projects (and as far as I know, Helvetica Flair is both undigitized and somewhat unholy), so I just wondered if anyone had seen fit to make a good solid constructed sans-serif with confident, over-the-top swashes like those.</p>
