  html: |-
    <p>This may be a common question, but I was wondering if anyone knew of a structural sans-serif (like <a href="http://typography.com/fonts/font_overview.php?productLineID=100008">Gotham</a> or <a href="http://www.ms-studio.com/FontSales/proximanova.html">Proxima Nova</a>) that had an alternate character set with colorful swashes, like Caslon or Garamond do. </p>
    <p>I frequently find myself wanting to set headlines in a strong, simple face and then dress up one or two letters; if I had such a font in my back pocket, I think it could happen. I'd appreciate any leads!</p>
