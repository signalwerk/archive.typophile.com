  - id: 361129
    user: 31798
    date: 2009-08-11T10:42:00
    date_raw: 11 Aug 2009 — 10:42am
    votes: null
    html: |-
      <p>Most likely. Adobe CS installs fonts in that location.</p>
      <p>With respect to jsmi's comment, there's nothing in the license of which I'm aware that reserves those fonts for use only in Adobe applications. You can move or copy them to another font folder if you want to access them elsewhere.</p>
      <p>Anyone wanting to make fonts available only to their own applications would probably store them inside the application bundle rather than in /library/application support.</p>
      <p>André</p>
