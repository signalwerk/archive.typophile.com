    <p>Hello everyone,</p>
    <p>Please could someone shed some light onto this problem I'm having with fonts on my Mac.</p>
    <p>I have just done a fresh system install (OS X Version 10.5.6) and now activating my fonts once again in Fontbook (Version 2.1) I currently have only 30 fonts active in Fontbook, and struggling to active certain fonts. I have just noticed that InDesign, Illustrator and Photoshop have atleast 100 active fonts, including certain ones I have been unable to open in Fontbook.</p>
    <p>Please can someone help?</p>
    <p>Thanks v much<br>
    Siaronx</p>
