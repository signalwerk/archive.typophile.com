      <p><cite>Whats your kerning workflow?</cite></p>
      <p>• Finish drawing and spacing the outlines.<br>
      • Print a complete set of kerning proofs (every character juxtaposed against every <em>relevant</em> character) and identify any spacing problems that can be fixed without kerning.<br>
      • Fix spacing problems<br>
      •&nbsp;Export fonts to UFO files<br>
      • Build OpenType kerning groups in Metrics Machine<br>
      •&nbsp;Build kern pair lists in Metrics Machine (every character juxtaposed against every <em>relevant</em> character)<br>
      • Kern every pair in the light weight in Metrics Machine.<br>
      • Print a complete set of kerning proofs and identify all pairs that need to be fixed.<br>
      • Make fixes (I may do a few rounds of this, tweaking spacing and outlines of problem letters along the way)<br>
      • Create necessary kerning class exceptions for accents that crash into other letters.<br>
      • Repeat for the black weight<br>
      •&nbsp;Interpolate kerning for the semibold weight, proof, tweak<br>
      • Interpolate kerning for other weights<br>
      • Import one set of kerning classes to all fonts (to ensure that they match)</p>
      <p><cite>Do you guys use auto kerning?</cite></p>
      <p>No. I hate kerning, but I learn too much and fix to many problems during the process to not do it. I will try DTL Kernmaster once DTL releases a version that supports UFO.</p>
      <p><cite>Do you guys use python scripts?</cite></p>
      <p>I’m pretty sure Metrics Machine was written entirely in Python, so kind of ;)</p>
      <p><cite>How good is fontlabs auto kern feature?</cite></p>
      <p>Fontlab does not have automatic kerning, it has automatic spacing. Fontographer has automatic kerning. Both are abysmal.</p>
