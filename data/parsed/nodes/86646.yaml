    html: |-
      <p><cite>…and can i get a standard list of Characters that have to be kerned?</cite></p>
      <p>This is pretty simplified, but:<br>
      • A-Z and a-z must kern against A-Z, a-z, and all punctuation. Don’t try to avoid oddball pairs like XJ, because any pair you can imagine exists between Dutch, Eastern European place names, and Chinese transliteration.<br>
      •&nbsp;0-9 (Proportional figures only) must be kerned against 0-9, currency symbols, and all punctuation.<br>
      • All punctuation should be kerned against quotation marks. Do not forget about Czech quotes!<br>
      • Some people even kern shit like ® and ™ against letters and punctuation. I don’t bother because the weird marks like that look pretty bad no matter how they’re used.</p>
      <p>Think about usage when you build your pair lists. For example, ampersand never kerns because it always has a space on either side, and backslash is only used in monospaced fonts. Brackets don’t get kerned because they make crazy shapes and spaces anyway. Æ and Þ also have a limited number of real-world kerns.</p>
      <p><cite>…is there any other tool like Metrics Machine for Windows?</cite></p>
      <p>Nope. Kerning in Fontlab is possible, you just need to build lists of strings of transpose characters (AAABACADA…). Some designers prefer that method to Metrics Machine.</p>
