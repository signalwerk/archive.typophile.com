      <p>I think you'll find that if you design and then space/kern, you will end up designing again. I usually work on design for a little while, then go to spacing then take what I've learned from that and apply it to the design, then back to spacing.</p>
      <p>Also, I've found it helpful to use test words instead of just looking at kerning pairs (or trios). I have a lot more familiarity worth words than I do with random series of letters and this really helps me work on rhythm in my design.</p>
