    html: <p>On a related note, are all the short-term unpaid internships I see in NYC design job listings normal? Or are they just misers exploiting the unemployed young designers out there? I’ve seen hundreds of internships that require print and web experience, sometimes even expecting the intern to provide a computer and software, and they run as short as two weeks and no more than six. I’ve even seen some very specific production internships that are only for a night, just to get a project out. Please tell me that this isn’t normal and that the local design schools teach the kids not to work for people who are too stingy to hire freelancers or production staff. In DC even the really crooked “nonprofit” lobbying organizations didn’t try to pull the stuff I see going on with New York internships.</p>
