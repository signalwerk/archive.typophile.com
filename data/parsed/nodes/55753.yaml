      <p>Hi Nikita</p>
      <p>I sympathise with moving out of the teaching job (I gave mine up midway through last year), but you'll need a considerable budget to start up in a new town as a freelancer – whether you go direct or via agencies. </p>
      <p>I'm nowhere near NYC, but even in these backwaters people are taking advantage of the situation to post job specs that are quite unrealistic in their expectation (i.e. all rounder intermediate designer with print &amp; web experience for US$20k p/a ??!!). The advice to post resumes/make connections/market yourself in advance is all good, but the reality is that the gravy days of freelancing are long gone. The saner option might be to lessen your expenditure, stay put and carefully restock your burnt-out creative cupboard.</p>
