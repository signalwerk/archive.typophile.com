      <p>"Any idiot who applied a little critical thinking could see that the real estate market and the stock market were grossly overvalued"</p>
      <p>I disagree.</p>
      <p>In hindsight, yes, it's very easy to say that, but at the time, I don't think many people did. </p>
      <p>When the American Dream is home ownership, separated nuclear family units, and both banks and government doing what they can to both market and accommodate that, there is a societal pressure to aim for that. It's not a greed as much as a "that's what we're supposed to do as Americans." And when folks do that in a time of increasingly upward home values, the trend is to 'get in while we can before we can't afford a place' rather than a careful study of long term trends and analysis of the mortgage models that were being sold.</p>
      <p>As a culture, we've grown accustomed to economic short sightedness. That's partly due to how our system works (consumer driven) and partly due to lack of personal education on the matter. </p>
      <p>"Economics education can’t prevent that sort of mass delusion any more than religious instruction can enable the devout to see the absurdities in their faith."</p>
      <p>I disagree. I think education goes along way. Along with economics 101, I've always been a proponent of theological history taught in the schools as well. :o)</p>
      <p>For instance, there's a giant lack of art and design education in our system. It wasn't until college that I found it and had it instilled in me via education. </p>
      <p>As for the current situation, there's plenty of blame to go around to all parties involved.</p>
