      <p>I moved here three weeks ago. Temping is just dead. The print/identity job market is terrible; there are still a fair number of interactive and fashion design jobs turning up on a daily basis, mostly mid-level positions. But the competition is tough—one AD told me he got over 300 applications for a job, and it wasn’t the most desirable job. And some jobs are evaporating with the money supply before anybody gets hired—it happened to me just yesterday. The only real upside is that rents are in free-fall; even super-hot Brooklyn rents started crashing in the last few weeks.</p>
      <p>Spend a few days watching Craigslist (where most NYC job postings go), Krop, and Coroflot. If you really want to come here, make sure you have a big pile of cash to live on. Don’t sign a lease unless they’ll let you out with no penalty if you get laid off and can’t find work (this is already common in Manhattan). It might even be a good idea to submit a resume/portfolio to temp/headhunting firms for feedback before you come.</p>
