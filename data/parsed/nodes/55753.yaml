      <p>Most of the Ph.D economists out there didn’t seem to have anything especially smart to say about America’s insane economy in the last decade; neither did all of the MBAs who studied macro- and micro-economics from those economists. People didn’t need education to prevent this, they needed common sense and some grip on reality. Any idiot who applied a little critical thinking could see that the real estate market and the stock market were grossly overvalued and that the entire nation was overleveraged. But people chose to ignore what made sense, to ignore the few economists and pundits who were pointing out that the system was a joke, and followed the herd. Economics education can’t prevent that sort of mass delusion any more than religious instruction can enable the devout to see the absurdities in their faith. It just gives people a better vocabulary to discuss their fantasies.</p>
