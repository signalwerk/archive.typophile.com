      <p>Credit is a great engine of economic progress, but it has to be regulated. In the past, it worked very well to make the US the richest country. But it leads to booms and terrible busts, fueled by speculation and crooks, without regulation. </p>
      <p>I blame the Reaganite philosophy--all taxes and regulation is bad--which infected also Clinton to some extent, for the current financial collapse. Right now, China is attempting to expand credit, agreeing that you need a system of both savings and credit to work well and be stable. I've heard economists saying that part of the problem is that we had too little savings, and China too much. </p>
      <p>You need to realize that in China the savings rate is so high because they haven't been able to trust the banks or government to help them with anything. For example, the government will just quit paying employees for months on end. This kind of thing is also very dysfunctional.</p>
      <p>There are no simple solutions, though there do seem to be solutions, and the Obama administration is working at them.</p>
