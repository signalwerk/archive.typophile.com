    <p>I feel really burnt out at my teaching job &amp; have felt that way for approximately the last year. So, I handed in my resignation, which will become effective at the end of this spring semester. </p>
    <p>My #1 destination is NYC. Since last summer, I've wanted to work there, but it never happened. Despite the economy woes, I feel that it's a good time for me to relocate from CT to NYC. I've heard different opinions from different people; some say that it's a horrible time to move, others say that freelance opportunities are readily available.</p>
    <p>Any NYC designers here that care to chime in with their feedback? Would be appreciate!</p>
  html_clean: |-
