      <p>paragraph said:<br>
      &gt;   Mountains of debt are not ’crooks’ doing. </p>
      <p>you're wrong.  totally.  completely.  dead-wrong.</p>
      <p>that 700-billion-dollar "mountain of debt"<br>
      that we find directly in our path today was<br>
      most certainly produced by _criminals_,<br>
      although they might never be _charged_...</p>
      <p>but they knew full well what they were doing,<br>
      and they knew full well that it was _wrong_,<br>
      as in _immoral_, as in _destructive_to_society_.</p>
      <p>those "financial institutions" that gave out loans for<br>
      $200,000 homes to people making $2000 a month?</p>
      <p>if they'd done it once or twice, it'd be "a mistake".<br>
      but they did it thousands and thousands of times...<br>
      do you think it was "an accident"?  it was a _crime_.</p>
      <p>they knew from the get-go that those were bad loans.</p>
      <p>they knew -- with full certainty -- that there would be<br>
      foreclosures eventually.  but they didn't care, because<br>
      it just meant they'd be the owners of an empty home,<br>
      so they could loan money to new people to "buy" it...</p>
      <p>besides, it helped pay off the loans they'd made to the<br>
      developer companies, and the builders and contractors.<br>
      the "financial institutions" made money at every level!</p>
      <p>moreover, it fed the misleading notion that that house<br>
      was _worth_ $200,000, because look, somebody had<br>
      "bought" it for that price, even though -- as the banks<br>
      and the builders knew full well -- it only cost $80,000<br>
      to _build_ the darn thing.  they rolled in "surplus" profit.<br>
      it's obscene, and everyone on the inside was aware of it.</p>
      <p>they _knew_ what they were doing, they knew _exactly_.</p>
      <p>nor did it stop there...</p>
      <p>because when they bundled a bag of the bad loans to<br>
      sell to other "financial institutions", at inflated prices,<br>
      they knew exactly what they were doing, yes they did.</p>
      <p>and the "financial institutions" which _bought_ them,<br>
      and then turned around and sold them to someone else,<br>
      at higher prices, knew exactly what they were doing too!</p>
      <p>this little trick was straight out of the savings-and-loan<br>
      "scandal" from a couple decades ago, and it worked again.</p>
      <p>everyone knew, and as long as everyone just kept passing<br>
      the bags along, always at a higher price than they'd paid,<br>
      so they could extract their commission, they were happy.</p>
      <p>and that's criminal.  certainly immoral.  and despicable.</p>
      <p>but it got even worse...</p>
      <p>they knew that if they grew the cost of the bags enough,<br>
      they'd become "too big to fail" -- they even coined a cute<br>
      slogan to drive the point home! -- and the _government_<br>
      would come in with a "rescue" plan -- i.e., more money! --<br>
      and then they would slurp off some of _that_ big fund...</p>
      <p>yep, they knew who'd end up "holding the bag" in the end!</p>
      <p>you see, they remembered that too from the s&amp;l "scandal".</p>
      <p>and their gall is astounding!  $700 billion!  unbelievable!<br>
      who could even conceive of such a huge amount of money!<br>
      heck, g.m. had to work up nerve to ask for just $25 billion.<br>
      (and g.m. got slapped!  but the money guys?  kid gloves.)</p>
      <p>and they didn't care if their stock market crashed, because<br>
      they knew the big loser would be _our_retirement_plans_...</p>
      <p>do you really think the whole retirement-money system was<br>
      something that these "financial institutions" didn't understand<br>
      they could game, at our expense?  talk about a ponzi scheme.</p>
      <p>but heck, they learned this trick from the government itself,<br>
      with the "social security" system, which is explicitly ponzi...</p>
      <p>it's totally silly to say that "dionysian living" caused this mess.<br>
      this was _greed_, pure greed, to the point of being _criminal_.<br>
      and they knew what they were doing, they knew it _exactly_...<br>
      and if you can't see that, you are blind.</p>
      <p>-bowerbird</p>
