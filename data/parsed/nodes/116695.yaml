    html: |-
      <p>Looks quite original!</p>
      <p>The rhythm strikes me as quite uneven. Try out some narrower versions of /A and /V, and fix the overly large space between /ID. Maybe reduce the spacing in general? </p>
      <p>Don't worry about kerning until you've got good base spacing. Use a font editor that makes spacing and kerning easy, such as Glyphs.</p>
      <p>Try punching a hole into the /V to make it less black, like you did for /A.</p>
