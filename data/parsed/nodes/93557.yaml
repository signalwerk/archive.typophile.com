      <p>&gt; A font manager, if used to group fonts by project,<br>
      &gt; could completely eliminate that problem [of forgotten fonts]</p>
      <p>In the short term that works fine, but I wouldn't want to depend on that long-term to keep track of font sets for hundreds of jobs over many years. People change computers, change font managers, etc. I think a better method is just to archive each project properly, which a designer should do routinely anyway.</p>
