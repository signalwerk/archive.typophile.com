      <p>Font Explorer X Pro includes a tool (Detect Fonts in Documents)  that can generate font reports from a wide variety of file types including: InDesign (CS2 and later), Ilustrator (CS3 and later), pdf, eps, rtf, rtfd, svg, svgz, pages, key, idml, icml and icmt. Reports can be generated in text or XML (plist) format.</p>
      <p>This is a very useful way of tracking what fonts have been used in a project and gives you the option to create sets based on those fonts.</p>
