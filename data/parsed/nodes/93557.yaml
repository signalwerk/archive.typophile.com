    html: |-
      <p>If you have, say a couple of hundred fonts maximum, and you often use the same fonts over and over, it is probably unnessesary to use font management. But I have a bit more, and use many different fonts for many projects, so it is indispensible for me. I would not be able to keep a proper overview of the fonts I have, and it is much more difficult to compare them. I have used Fontexplorer (FEX) by Linotype, first the free version, now the Pro version, and it has always worked well for me. It is intuitive, the auto-activation works fine with CS, and it is easy to keep an overview of the fonts. I used the option of the 30 day trial, which I recommend.</p>
      <p>I haven't used Suitcase in like 10 years (when I hated it), so I can't say how it is in comparison. I also tested FontAgent Pro on a trial, but it was not on the same level as FEX in my opinion. Plus FEX is the cheaper option, so that helps...</p>
