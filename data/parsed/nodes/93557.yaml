    <p>I hesitate to ask, but do I really need font management software on my computer? I'm running the latest update of OS X Lion. I'm "new" to Macs, having switched in 2008. At that time, I bought Extensis Suitcase Fusion 2 and upgraded to 3 when they released it.</p>
    <p>My memory is nothing but a confusion of fearfully trying to move the fonts they said I should by following the suggestions they made. Then, they were never ready after Adobe upgrades. Also, I was constantly finding my files missing or turned off somehow and I spent hours researching and troubleshooting issues and managing the app instead of the transparent effortless font management I expected it to provide.</p>
    <p>Now, they've released v4. I've already upgraded to Adobe CS6 and I heard that the Suitcase Fusion is not able to work with that version.</p>
    <p>Is font management a necessary evil, or can OS X Lion handle my fonts for me. I own most of Hoefler and Frère Jones typefaces and some others besides. I don't know if that qualifies as too many or as not even close to taxing OS X. I don't want to put up with the hassles I had with Suitcase Fusion 3 (and earlier). It made me want to reinstall the OS and start from scratch with only fonts Apple includes (and maybe a few others). What a horror that was.</p>
    <p>And if I must install something, is there something better than Suitcase Fusion? If not, is 4 better than 3? I assume there is no work around if I do install 4 and it doesn't work with Adobe? That was also intensely annoying. Perhaps I should use 4 and not use the Adobe plug-ins?</p>
    <p>I have a vague recollection that somewhere Hoefler made a comment about font management software in general (or Suitcase Fusion in specific?) perhaps in the sense that they were no longer needed and more problematic than helpful?</p>
    <p>My apologies for the length of this post, but I'd really love to resolve this issue if possible.</p>
    <p>Thank you so much for any advice!</p>
