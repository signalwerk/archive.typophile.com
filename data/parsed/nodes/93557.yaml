      <p>For most needs the current version of Font Book is probably sophisticated enough. It might be worth removing any other management software, experimenting by adding a few families at a time and seeing how that works for you.</p>
      <p>If taking this approach you should probably keep the file and folder structure as clearly organised as possible and before adding fonts to Font Book make sure that you have not placed them in one of the live font folder structures:</p>
      <p>/Library/Fonts<br>
      /System/Library/Fonts<br>
      /Users/username/Library/Fonts</p>
      <p>Some Adobe products also have an application specific font folder that overrides fonts at the system level. I am familiar with this in CS4 but not later versions.</p>
