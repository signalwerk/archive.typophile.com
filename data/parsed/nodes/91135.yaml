    html: <p>Matthew, this is not strictly medical-related, but between 1955 and 1968 the great Jan Tschichold was hired as graphic consultant for the pharmaceutical company Hoffmann-La Roche where he designed, among other things, their house organ. I have seen some samples in Christopher Burke's excellent book about Tschichold, and they look lika a very interesting example of corporate pharm design.</p>
