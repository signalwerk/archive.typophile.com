    html: |-
      <p><cite>Not if it’s for sale.</cite></p>
      <p>Being commercial doesn't necessarily kill fair use, at least not in the US. There are other factors at work. (Otherwise, you'd never read book reviews that actually cite the book under review in a for-profit newspaper.) </p>
      <p>However, my advise is this: get copyright clearance on everything and/or consult a good IP attorney.</p>
