      <p>@Florian:</p>
      <p>Copyright law &gt; FontShop/MyFonts notice.</p>
      <p>How about a book sold under a condition that the buyer can't quote from it on the web without express permission?</p>
      <p>If the law gives the public certain user rights such as fair use (e.g., for private study or critique), then the notice is ineffective, and just wrong. Copyright holders are only protected to the extent the law permits. They cannot run to the law for protection when it suits them, but try and circumvent it when it doesn't.</p>
