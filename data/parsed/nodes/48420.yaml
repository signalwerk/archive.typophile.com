  html: |-
    <p>I am in the throws of modifying a bunch of old fonts to better work with InDesign within our production environment.</p>
    <p>Somewhere, somehow InDesign is associating a certain font with a font filename. I discovered this by having renamed a font family and reloading the font. InDesign was still showing the OLD font family name in its menu. All I had to do was to rename the font FILE and InDesign saw the new font family name.</p>
    <p>Does anyone know where InDesign is storing such information?</p>
    <p>Many thanks,<br>
    Ken</p>
