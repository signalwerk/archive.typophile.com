    <p></p><div class="imageWrap"><img src="http://typophile.com/files/helfa_std_gingko_580x290_6581.png"></div><p></p>
    <p>Helfa is a typeface that has been thoughtfully planned, lovingly drawn, and carefully crafted by Delve Withrington. Although a new, original type design Helfa will at once seem like an old friend. With a range of five useful weights and five corresponding true italics all in OpenType format, Helfa is a typeface that has what is needed to do the job right.</p>
    <p>Helfa Regular and Italic are available for free. A complimentary copy can be downloaded from: <a href="http://www.delvefonts.com/helfa.html" title="http://www.delvefonts.com/helfa.html">http://www.delvefonts.com/helfa.html</a></p>
    <p>Readability is baked in with a generous x-height, fine proportions that have a medium height to width ratio, and reasonable contrast in stroke weight variation. The letter shapes are individually drawn to be distinctive, not simply mirrored or rotated. The sturdy, bracketed serifs hold up confidently below twelve points. Helfa can be relied upon for setting lengthy texts at smaller sizes but is still readily applicable to a number of other tasks.</p>
    <p>There is enough subtle detail in Helfa to hold interest at larger point sizes too. The stems are not straight lines but curve inward very slightly towards the middle. The serifs are subtley cupped and taper to a finish at shallow angles. The curved strokes have stress strategically located along the circumference and the wedge brush shaped terminal is a recurring feature throughout the typeface, especially in the italics.</p>
    <p>Helfa is available now at: <a href="http://www.delvefonts.com/helfa.html" title="http://www.delvefonts.com/helfa.html">http://www.delvefonts.com/helfa.html</a></p>
    <p>Sign up to receive the Delve Fonts newsletter: <a href="http://eepurl.com/ikNr" title="http://eepurl.com/ikNr">http://eepurl.com/ikNr</a></p>
    <p>Follow Delve Fonts on Twitter: <a href="http://www.twitter.com/delvew" title="http://www.twitter.com/delvew">http://www.twitter.com/delvew</a></p>
    <p>Be a friend with Delve Fonts on Facebook: <a href="http://www.facebook.com/delvefonts" title="http://www.facebook.com/delvefonts">http://www.facebook.com/delvefonts</a></p>
    <p>Helfa is a trademark of Delve Fonts. All rights reserved.</p>
    <p>Delve Fonts is a full-service type foundry in Alameda, CA offering designers and clients exclusive new typefaces and type design services including: Custom Type Design, Fonts for Mobile Devices, and Foreign Language Fonts.</p>
