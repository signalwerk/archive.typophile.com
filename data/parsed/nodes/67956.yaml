      <p>Being somewhat wide it's characteristic of monospaced typefaces.<br>
      The most known proportional typeface with a typewriter look is American Typewriter, which comes with a condensed style as well (<a href="http://new.myfonts.com/fonts/adobe/itc-american-typewriter/cond/" title="http://new.myfonts.com/fonts/adobe/itc-american-typewriter/cond/">http://new.myfonts.com/fonts/adobe/itc-american-typewriter/cond/</a>).<br>
      But there are plenty that share a similar look:<br>
      <a href="http://new.myfonts.com/search/typewriter/" title="http://new.myfonts.com/search/typewriter/">http://new.myfonts.com/search/typewriter/</a></p>
