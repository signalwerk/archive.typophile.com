  html: |-
    <p>I'm working on an annual report for school and have been using Sabon Next and Courier so far. I like the feel of Courier but it's set width is pretty wide. I was wondering if there was a typeface with a similar feel that doesn't set as wide. It doesn't have to be a monoface.</p>
    <p>Also I'm curious if you guys have any suggestions for a third typeface (a sans-serif) that may complement the two.</p>
