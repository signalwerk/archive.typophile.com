    html: <p>Andale Mono is my favorite monospaced font. It's not so much a complement to what you're already using, but it could be used in place of Courier. It's one of the MS core web fonts so you should have it. It's a sans-serif, and a bit narrower than Courier, so it has more of a coding than typewritery feel to it, and I don't see it used all that often compared to other such system fonts.</p>
