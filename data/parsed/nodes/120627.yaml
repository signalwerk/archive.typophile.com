      <p>&gt; I am not a graphic designer...<br>
      &gt; I can see myself two years from now having spent<br>
      &gt; thousands of dollars on hundreds of fonts...</p>
      <p>Michael you don't need to spend thousands on fonts. Since you're not a trained designer most of your work will be resumes, flyers, and other simple projects, and all you need for those are a few basic fonts. The fonts you already have are probably sufficient.  </p>
      <p>If you occasionally need an unusual font (for a Halloween flyer, for example) there are plenty of free fonts out there. They aren't the best quality but they'll be fine for something like that.</p>
      <p>Your focus should be on developing your skills. Building a font collection can come later.</p>
