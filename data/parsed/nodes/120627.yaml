      <p>Cyberflor, I don't think you're trolling.  Ray Larabie  and James Arboghast did recommend the Ultimate Font Download site in the <a class="freelinking external" href="http://www.typophile.com/node/52360" rel="nofollow">Is this legit?</a> thread. I don't know a lot about free fonts, but I doubt you'll find knock-offs, or at least legal knockoffs of approximately the same completeness and quality as the original, of the typefaces you want. Making a good knockoff legally would require too much work and offer too little glory for people to do it for free, and doing it commercially probably wouldn't pay now either since knockoffs have a bad reputation with designers and good type can be had relatively cheaply. </p>
      <p>Until you can evaluate type confidently for things like spacing issues, you might want to avoid free fonts and knockoffs at least for use in extended text. A copy of <em>The Elements of Typographic Style</em> could be a good investment, if you've not yet read it, since it'll help you use more effectively what you already have - including Constantia, which was designed from scratch by John Hudson, who is on this forum.</p>
