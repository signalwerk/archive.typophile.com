      <p>There is a difference between being motivated in making the biggest amount of money and in making a decent living for yourself. I don't think typedesign is a business where people become millionaires (unless they focus solely on the business side of things, instead on the creative side.)</p>
      <p>You wish to have designers to make decent looking versions of classic fonts, well then you just need to have a look at MyFonts. All popular fonts, like Helvetica, Proxima, Gotham, Meta etc. inspire a lot of type designers in creating their version of this particular style. Some are better than others, some stay close to the original, some are more adventurous. These are not ripoffs most of the time, but often they do cost considerably less than the classics. Just check out the MyFonts special offers: many newly offered font families are offered at steep discounts ranging from 50 to 90 %, so you might snap up a family for 20 dollars or something.</p>
