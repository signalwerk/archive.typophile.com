      <p>&gt; I am a proficient technical writer...<br>
      &gt; I think I could earn money working in desktop publishing.</p>
      <p>These are very different professions. If you are already a good writer, I'd suggest concentrating on that rather than learning desktop publishing, which is a complex skill to learn.  (Unless you mean just creating simple documents like resumes. And you don't need InDesign for those, Word will work just fine.)</p>
      <p>Many (but certainly not all) copywriter jobs are "clean up" jobs, where you're given rough copy written by a client and you must polish it. It requires a good knowledge of grammar, good organizational skills to keep track of revisions and deadlines, good proofreading skills, and good people skills so your clients enjoy working with you and send you more jobs. </p>
      <p>&gt; I would like to learn Adobe In-Design. </p>
      <p>Be aware that InDesign is a very complex program and many of the settings require a good knowledge of typography. It's a difficult program to learn.</p>
      <p>&gt; purchasing an old version of Adobe In-design.</p>
      <p>Used copies aren't always easy to find because when a new version comes up, folks buy the "upgrade" version which requires that you still have the old version, and they may keep the old version in case they need to reinstall the new version again. And a "used" copy might be a pirated version that won't operate properly as you must go through a registration process with Adobe.</p>
