      might be able produce respectable knock-offs with quality<br>
      approaching or exceeding the commercial font. </p>
      <p>We often see free software programs that are quite good. Not<br>
      everyone is motivated by money and glory. But if there are no<br>
      decent knock-offs, then there aren't.</p>
      <p>Fonts should be sold for non-commercial use at a lower price<br>
      than when they are sold for commercial use. </p>
      <p>I don't know why there is not a font package of basic fonts for<br>
      non-commercial use. I would pay $500-$1000 for such a package.</p>
      <p>In the meantime, anyone can get any commercial font for free<br>
      by going downloading it from file-sharing pirate sites. This is<br>
      not something I know how to do because I am not into that. I<br>
      am close to paying a computer expert to do this for me. </p>
      <p>I read many places that Constantia was a Microsoft commissioned<br>
      knock-off of Palantino. Which do people like more Palantino Linotype,<br>
      Book Antiqua, or Constantia? </p>
      <p>Which of these fonts looks most impressive for a business letter:<br>
      Palantino Linotype, Book Antiqua, Constantia, Baskerville, Goudy<br>
      Old Style. I use Baskerville, but the difference between these fonts<br>
      is very hard to discern on my monitor. I am not sure that my printer<br>
      even prints them differently. Which would you prefer for legal<br>
      work? </p>
      <p>At one point I thought of purchasing an old Adobe software product<br>
      just to get their fonts. </p>
      <p>Thank you for your recommendation. I will purchase  The Elements<br>
      of Typographic Style when I can afford it. At this point in time, I can't<br>
      spare one dollar. I don't have working refrigerator. </p>
      <p>You say a good type can be had relatively cheaply now, but the last time<br>
      I checked a family of single font cost several thousand dollars. I would<br>
      really like to get Avenir Next, Mrs. Eaves by Licko, Myriad Pro,<br>
      Garamond, Futura and a few others. </p>
      <p>I can't see how using these fonts in my personal letters would cost the<br>
      creators of these fonts, or their foundries one penny. I created<br>
      business presentations to try to get investors interested in partnering<br>
      with me.  </p>
      <p>If I owned a print shop, an advertising company, or a desktop publishing<br>
      company, and I had real income, I have no problem paying the going rate<br>
      for these fonts. If I created a font, I would have no problem with anyone<br>
      in my situation using it for free. I spent my life helping people in need or<br>
      distress for free. I made huge personal sacrifices to help humans and<br>
      animals in distress. </p>
      <p>When I think how many people there are in the world, who would object<br>
      to the poor benefiting from something that would not cause them any loss,<br>
      I think to myself that I have been a fool, that sociopaths have a better<br>
      grasp of reality than I have. I always thought mankind would advance<br>
      when humans helped each other reach their full potential. But successful<br>
      people overwhelming seem to believe the world is a zero-sum game,<br>
      that they lose anytime anyone else gets ahead. </p>
      <p>Every time I read news about some "senseless" killing, and I recall how<br>
      successful humans are by and in large so petty, selfish, self-centered,<br>
      narcissistic, and greedy,  I think to myself there is no such thing as<br>
      senseless murders. Senseless murderers are no different than most<br>
      successful human beings. Both sets are comprised of humans who<br>
      just care about their own welfare, and their own selfish needs. </p>
      <p>Why should impoverished humans give a whit about others, when<br>
      others do not give a whit about them. The social contract is built<br>
      on the principle of "reciprocity." I care about you, society cares<br>
      about you, therefore you should respect our laws. </p>
      <p>When a society does not give a whit about its poor, its needy, and<br>
      its hungry. When people who are successful can't stand anyone else<br>
      gaining, even when it costs them nothing, there is no social contract.</p>
      <p>What does this have to do with fonts and typography? Apparently,<br>
      much more than meets the eye. The "haves," people with land, oil,<br>
      money, power, fonts want to keep their club exclusive. They want<br>
      to preserve their privilege, they do not wish to share with others,<br>
      even if it would cost them nothing to do so. </p>
      <p>On the other hand, I have always believed in sharing everything<br>
      with everyone. I have always been willing to share my knowledge,<br>
      share my talents, share my possessions with anyone and everyone.</p>
      <p>Not everyone in the world is motivated by money and glory. Some<br>
      people actually live their life to benefit the world and help others.<br>
      I don't think most people can imagine what kind of world we would<br>
      live in today if there had been fewer self-sacrificing humans in our<br>
      past, and more humans who just care about their own bottom line.</p>
      <p>All the good we have in our world today is here because of people<br>
      like Tesla and Westinghouse, not people like Edison and JP Morgan.</p>
