    <p>Someone here recommended a font site where readers could<br>
    download 10,000 or 20,000 fonts for $20. They said the creator<br>
    of each font had approved their fonts for download on this site,<br>
    that each font creator received compensation for each download. </p>
    <p>I foolishly gave this site my credit card information. I was not<br>
    able to download anything. I contacted the site for a refund, but<br>
    I received no response. What a ripoff!</p>
    <p>I am looking for a list of the best knockoffs of famous commercial fonts,<br>
    especially for the fonts I list below. The US Supreme Court ruled that<br>
    font design cannot be copyrighted. Those who create a font, can<br>
    trademark the name of their font name, but they can't copyright<br>
    the actual design. Hence, there are many legal knockoffs of standard<br>
    commercial fonts. I will pay good money for a list of these knockoffs,<br>
    and where to legally download them.</p>
    <p>Microsoft did not license the fonts they used in MS Office.  Ariel is a<br>
    knockoff of Helvetica; Segue is a knockoff of Frutiger; Book Antiqua<br>
    is a knockoff of Palantino. Microsoft did not license any of the fonts<br>
    they include in MS Word. </p>
    <p>I think they did pay Hermann Zapf to create Constantia which is a<br>
    knock-off of his Palantino. </p>
    <p>US courts ruled font names could be trademarked, but their design could<br>
    not legally be copyrighted. European courts acknowledge the right of font<br>
    creators to copyright their font. </p>
    <p>In the meantime, I still need 100 commercial fonts for<br>
                               NON-COMMERCIAL USE.<br>
    If I use any font for commercial use I will pay the creator<br>
    of the font for its use. </p>
    <p>I am willing to pay anyone here up to $1,000 for their help.<br>
    My email address is <a href="mailto:cyberflor@aol.com">cyberflor@aol.com</a>. For example, I<br>
    would pay $30/month for a font family/month.</p>
    <p>I am looking for complete font families of: Mrs. Eaves (by Zuzana Licko),<br>
    Baskerville, Helvetica Neue, Avenir Next Pro (Neue), Adobe Garamond,<br>
    Myriad Pro, Caslon, Univers, Futura, Hoelfer Text, Fruitiger Next, Gotham,<br>
    Minion Pro, Akzidenz Grotesk, Didot, Shelley Allegro, Thesis Sans,<br>
    Gill Sans, Din, Lucida, Trade Gothic, Cacon, Zapfino, Trajan, Interstate,<br>
    Bell Gothic, Agency, Optima, Perpetua, Proxima Nova, Avenir, Meta,<br>
    Palatino Nova, Palatino Sans, and Michaelangelo Titling. I am open<br>
    to suggestions for additional fonts.</p>
    <p>I am not in business. I am not a graphic designer. I am not a desktop<br>
    publisher. I am disabled. I receive disability. I have no savings.<br>
    I have no income aside from $700/month disability income.  I own<br>
    MS Word 2013 student edition. I am expert in the use of MS Word.</p>
    <p>I would like to learn Adobe In-Design. I would be interested in<br>
    purchasing an old version of Adobe In-design. I can teach myself<br>
    anything. </p>
    <p>If anyone would like to help me start I business, or partner with me<br>
    in some business, that would be great. I have created a few resume<br>
    designs that job seekers might purchase.</p>
    <p>I am a proficient technical writer. I could also possibly work as a<br>
    paralegal. I think I could earn money working in desktop publishing. </p>
    <p>Find me work, and earn a percentage of my income.</p>
