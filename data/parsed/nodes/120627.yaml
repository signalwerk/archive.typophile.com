    html: |-
      <p>I am not a typographer, and do not have the ability to judge subtle differences between fonts. Obviously, I can tell the difference between "Comic" and "Times Roman." But I really have a hard time telling the difference between Palantino, Book Antiqua, and Constantia.</p>
      <p>I have zero training in this field. I am not a graphic designer or a typographer. I have zero ability to judge fonts that are similar to each other. I can't judge spacing, character width, or any of the variations that differentiate one serif font from another serif font. </p>
      <p>I might plunk down $20 on a font, then after much use discover something about it I don't like. Then buy another font for $20 with the same  result. I can see myself two years from now having spent thousands of dollars on hundreds of fonts, and not having one I am happy with. I fear buying any font that is not a famous commercial font because it might have some fatal flaw. Moreover, there are several hundred thousand cheap fonts and free fonts, I would not know where to start. The prospect of my having to select ten fonts from all those fonts is daunting and overwhelming. </p>
      <p>If I had more experience with fonts. If fonts were a more central part of my life, I might feel more comfortable picking a cheap font or a free font. In areas where I have expertise, I can spot things that others would not notice after days of examination. Typography is your field of expertise not mine. Simply put, I am not qualified, nor do I have the competency or expertise to determine the suitability of cheap fonts or free fonts. The whole point here is I am trying to produce material with a professional look. I can't rely on my expertise to make decent selections.</p>
      <p>With successful commercial fonts, I know I can't go wrong with any of them.  And there are a few of them I have seen so often, I know I like them. I am open to recommendations. </p>
      <p>Why don't the typographers here come up with a list of 50 low cost fonts they would recommend to budding graphic designers. Of course, I am not even a budding graphic designer. But it would certainly be a huge help to the public if all the participants here rated a hundred affordable fonts, then pared the list down to 50, 25, or even 10. </p>
      <p>I would appreciate all the time and effort you put into such an endeavor. You could even profit from it. People would pay you to come up with a list of 100, 50, 25, and 10 top affordable/free fonts.</p>
      <p>michael</p>
