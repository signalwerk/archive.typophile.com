  html: <p>I have a logo to design and it's just begging me to use quote marks as the eyes of a smiling face. But I think I may have seen this before, or something too similar at least. <br> <br>Has anyone seen this or something like it? Post an image if possible. <br> <br>And while we're on the subject, it'd be cool to see any creative use of quote marks anyone knows of. <br> <br>Thanks</p>
