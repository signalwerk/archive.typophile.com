  html: |-
    <p>Hello,</p>
    <p>I have an image credit with the copyright symbol.<br>
    I'm not sure if a normal space either side of the copyright symbol is correct, or if the the space should be; hair, sixth, thin, quarter etc.</p>
    <p>The credit is as below:</p>
    <p> [Artist name], [Title of Work], [Year].<br>
    Arts Council Collection, Southbank Centre, London © the artist. </p>
    <p>I assume the correct thing to do is to have a normal space either side of the symbol.</p>
    <p>Any help would be appreciated.</p>
    <p>Thanks,<br>
    Joe</p>
