      <p>Resist the urge to blindly impose formal attributes from one script to another,<br>
      especially when they're as different as Latin and Arabic. It's what we're taught,<br>
      and it feels "normal", but it doesn't work. For a full elaboration please see my<br>
      article in Spatium issue #4, or the hot-off-the-presses issue of Hyphen.</p>
      <p>An Arabic font that looks like Helvetica has <cite>no chance</cite> of conveying the<br>
      same atmosphere as Helvetica; at least not to people outside the insular<br>
      world of graphic design, not to laymen, not to the <cite>user</cite>. Furthermore, it's<br>
      almost guaranteed to impede readability (even more than Helvetica :-).</p>
      <p>For a good instance of this... disease, look at this:<br>
      <a href="http://www.themicrofoundry.com/other/Abbar.gif" title="http://www.themicrofoundry.com/other/Abbar.gif">http://www.themicrofoundry.com/other/Abbar.gif</a> _<br>
      (A slide from my Beirut presentation of last April.)<br>
      Sadly, and tellingly, it took pride of place in an issue of<br>
      Eye. To their credit though, Eye did react in an open-<br>
      minded way to my -public- criticism back then.</p>
      <p>hhp</p>
