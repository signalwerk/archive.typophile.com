      <p>I'm not an expert in Arabic or Chinese but there are other complications. </p>
      <p>One issue to keep in mind is that different regions/countries have different preferences and sometimes different rendering rules. For example Persian readers prefer a different style from Saudi readers, who prefer a different style from Urdu readers, who have slightly different rendering rules to Uighur readers etc., </p>
      <p>Same is basically true for Chinese, where a particular character may take a different shape in simplified Chinese (CHS), traditional Chinese (CHT) and Japanese. An over simplification, but at the very least you should ask the customer if they need to support CHS, CHT or both.</p>
    html_clean: |-
      <p>I'm not an expert in Arabic or Chinese but there are other complications. </p>
