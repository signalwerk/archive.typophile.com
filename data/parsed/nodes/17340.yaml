    <p>Hello,</p>
    <p>As I am neither an arabic speaker nor reader I wonder what would be the most accurate typeface that will look like the latin family Helvetica. </p>
    <p>Most of the arabic fonts I see have a calligraphic gesture… I wonder if the forms of the arab glyphs are drawn with the same rules than the one for the latin glyphs.</p>
    <p>To summarize  is an arabic font with calligraphic gesture more a serif font ? and is a linear arabic font more a sans serif font ?</p>
    <p>and what about chinese glyphs ?</p>
    <p>(My project has to include arab, chinese and latin languages, that is why I have all these questions :)</p>
