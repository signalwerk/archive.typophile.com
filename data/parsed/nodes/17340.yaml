    html: |-
      <p>I am living in an Arab country right now, and when an arabic font is used in relation to a corporate identity, the logo type tries to duplicate the feel of the latin in every way. Arabic letters are even stretched to match the length of the latin letters.</p>
      <p>The university I work for has a sans serif logo, and the Arabic type has been custom drawn to match the latin type. It is the same for most companies like Nokia, Toyota and Subway even has the little arrows at the end of the characters.</p>
      <p>My university uses a more traditional, calligraphic type for correspondence and printed collateral. When done this way, it makes it easier to adjust for the regional preferences that were mentioned by Simon in the longer texts, and allows for easy recognition of the logo. Because the logo will never be seen in just it's Arabic form, it is always seen with the english/latin type, at least in the UAE.</p>
