    <p>Marat is now available at <a class="freelinking external" href="http://www.myfonts.com/fonts/ludwiguebele/marat/" rel="nofollow">MyFonts</a> (50% off until end of April).<br>
    You can find more information about the type family on <a class="freelinking external" href="http://www.ludwiguebele.de/item.php/Type%20Design/Text/Marat/" rel="nofollow">my webpage.</a> Here you can also find a <a class="freelinking external" href="http://www.ludwiguebele.de/elements/fontPDF/55/fontPDF.pdf" rel="nofollow">specimen.</a><br>
    Marat has been selected by this years <a class="freelinking external" href="http://www.tdc.org/news/2008Results/Marat.html" rel="nofollow">TDC2.</a></p>
    <p>Hope you like it<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/Marat_5432.gif"></div><p></p>
