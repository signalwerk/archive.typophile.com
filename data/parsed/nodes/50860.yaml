      <p>Thanks for posting this, Joe (and for posting the link to my article on MetaFilter, which triggered an avalanche of traffic to my site). I sort of expected/hoped that someone (!) working on the show might see what I wrote.</p>
      <p>I've been doing this "typecasting" thing for a while now. I totally understand that it's trivial and that 99.99% of the audience will never notice such things. If they did, then people like Weiner would naturally give it more attention than they do. To me it's more about the fact that when you're deep in a specialized area like I am, you get a skewed view of the world. It's an occupational hazard. On the face of it, it looks like I'm criticizing the show (or movie or whatever), but I'm also making fun of my obsessions for the amusement of my own audience. I don't take it nearly as it might appear.</p>
