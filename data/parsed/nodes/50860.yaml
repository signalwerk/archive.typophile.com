      <p>And now we know who to blame for the show’s occasionally-ahistorical  newspapers and magazines: <a href="http://www.collectorsweekly.com/articles/an-interview-with-scott-buckwald-prop-master-for-the-hit-tv-show-mad-men/" title="Interview at ‘Collectors Weekly’" rel="nofollow">Propmaster  Scott Buckwald</a>. “Usually if it was paper, like a magazine or a newspaper, I would reproduce it. I do a lot of my own graphics. I’ve remade Volkswagen ads on my computer, and I remade <cite>Advertising Age</cite> magazine. I’ve redone <cite>TV Guide</cite>s, even if they don’t exist anymore or they’re very hard to find....  I’m constantly redoing book covers. In one scene, a couple is reading in bed, and I couldn’t find a copy of the book that looked brand new – the pages were yellowed or it was faded – so I found a new book and remade the cover based on the original.”</p>
      <p>—<br>
      Joe Clark<br>
      <a href="http://joeclark.org/" title="http://joeclark.org/">http://joeclark.org/</a></p>
