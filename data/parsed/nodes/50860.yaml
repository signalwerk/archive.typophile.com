    <p>Our own Mark Simonson wrote <a href="http://www.marksimonson.com/article/236/mad-men-mad-props" title="‘Mad Men,’&nbsp;Mad Props" rel="nofollow">the definitive treatment of typography on <cite>Mad Men</cite></a>. (I have <a href="http://www.flickr.com/photos/joeclark/tags/madmen/" title=" madmen" rel="nofollow">a couple of pictures</a>.) It turns out that series creator Matthew Weiner <a href="http://weblogs.variety.com/season_pass/2008/10/mad-men-qa.html" title=" ‘I’m fascinated that people get so much out of it’ " rel="nofollow">knows we’re watching</a>. </p>
    <p> (Someday, when Typophile learns about the <code>blockquote</code> element, quotations like the following will be more semantically and visually distinct.)</p>
    <blockquote cite="http://weblogs.variety.com/season_pass/2008/10/mad-men-qa.html"><p>You know this whole concept about anachronisms… I know it’s a game people like to play. And they know I’m working my ass off to keep it from happening. Someone sent me something about how the font at the end of the show was Ari[a]l and was not period. I was like, “The show’s over. Go home. I’m allowed to do whatever I want.”  [...] </p>
    <p>But if you’re person who loves fonts, fantastic. I’m sure there are some mistakes in there about when these fonts came out.... I can tell you that almost everything you see in that show, especially the artwork, is cut and pasted out of old ads. Those fonts may not have existed on a computer or couldn’t be typeset yet, but they were cut and pasted from old ads, so maybe they were hand-drawn or something.</p>
    <p>The American Airlines ad that they were most critical of had this very famous lettering and it was used by DDB about six months after the crash, and we put it in our pitch and I was thinking “I’m sorry, I don’t have the freedom to do that with my fictitious ad agency? To have them get there before DDB did?”  Maybe American Airlines saw it and told DDB they wanted it. Who knows?</p>
    <p>I love that people are invested enough that they’re fighting about it getting into it and doing that. I put so much ambiguity into the show if you say something about it that I didn’t think of I don’t say “You’re wrong.” I’m just saying that’s not what I meant or whatever. But I’m fascinated that people get so much out of it. </p>
    </blockquote>
