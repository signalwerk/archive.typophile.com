  html: |-
    <p>Hi,</p>
    <p>I am working on a book set in Garamond 3 and I have to set a list with check marks symbols.<br>
    I found check marks symbols in Zapf, Commercial 1 and Altemus Dingbats, but they are all way to thick to look good next to the text, even if I set the symbol 2pt smaller than the text.</p>
    <p>Does anyone know a font that has a relatively thin check mark symbol?</p>
    <p>Thank you,</p>
    <p>Véronique</p>
