    html: |-
      <p>Yes, the letters are by Frank Blokland – it says so in the back of the book.<br>
      (The overall design isn't mentioned but may well be by Gerrit Noordzij who assembled the book &amp; wrote the introduction.)</p>
      <p>He drew the letters while he was a student at the KABK. There's an alphabet of similar letters on p.30 of the book and a few lines (roman + italic) on p.29.<br>
      I don't think it was ever released as a typeface. The book is from 1983. His first typeface Bernadette (which looks a bit like this one but is bolder and has heavier serifs) is from 1985 &amp; was never released digitally.</p>
