    html: |-
      <div class="comment-spam-body"><p>Calligraphy. </p>
      <p>The capital has some of the flavor of 15th century Textura, such as Altdeutsch <a href="https://www.myfonts.com/fonts/intellecta/alt-deutsch/" title="https://www.myfonts.com/fonts/intellecta/alt-deutsch/">https://www.myfonts.com/fonts/intellecta/alt-deutsch/</a> Psalterium <a href="https://www.myfonts.com/fonts/alterlittera/psalterium/" title="https://www.myfonts.com/fonts/alterlittera/psalterium/">https://www.myfonts.com/fonts/alterlittera/psalterium/</a> and Octoberfest  <a href="https://www.myfonts.com/fonts/aerotype/octoberfest/" title="https://www.myfonts.com/fonts/aerotype/octoberfest/">https://www.myfonts.com/fonts/aerotype/octoberfest/</a></p>
      <p>The lower case has some similarity to several rationalist frakturs: Luthersche Fraktur <a href="https://www.myfonts.com/fonts/linotype/luthersche-fraktur/" title="https://www.myfonts.com/fonts/linotype/luthersche-fraktur/">https://www.myfonts.com/fonts/linotype/luthersche-fraktur/</a> Walbaum Fraktur <a href="https://www.myfonts.com/fonts/linotype/walbaum-fraktur/" title="https://www.myfonts.com/fonts/linotype/walbaum-fraktur/">https://www.myfonts.com/fonts/linotype/walbaum-fraktur/</a> and Breitkopf Fraktur <a href="https://www.myfonts.com/fonts/profonts/breitkopf-fraktur/" title="https://www.myfonts.com/fonts/profonts/breitkopf-fraktur/">https://www.myfonts.com/fonts/profonts/breitkopf-fraktur/</a></p>
      <p>Don</p>
      </div>
