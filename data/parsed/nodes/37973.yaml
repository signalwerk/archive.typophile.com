    <p>I have been reading the Logo, Font and Lettering Bible and was wondering how do font designers make stem widths appear consistent.  For example a vertical stem that is 4px wide 20px high may look okay but if you rotate it so that it is horizontal the stem appears optically thicker, but in reality it is not.  How do some of you correct for this?</p>
    <div class="forum-topic-navigation clear-block"><a href="/node/38101" class="topic-previous" title="Go to previous forum topic">‹ Garamond typeface</a> <a href="/node/37994" class="topic-next" title="Go to next forum topic">urls and line breaks ›</a></div>
