    html: |-
      <p>I think type designers can sometimes exaggerate the amount of difference needed to counteract the optical illusion.<br>
      This is because we spend so much time looking at perpendicular strokes that are unequal, and imagining them as equal, that when we look at perpendicualr strokes that ARE equal, we imagine them as being unequal in the opposite manner to our habit.</p>
