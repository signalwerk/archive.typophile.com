      <p>I think it’s always going to be a bit subjective, depending on the sharpness of your own (bi-focal) vision and how near or far it is to be viewed from and so on and so forth. </p>
      <p>That said, I’ve had (what looked to me like :) ) success with between 1% and 2% difference.</p>
