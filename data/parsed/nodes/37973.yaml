    html: |-
      <p>It varies with the typeface: Here’s how much wider the vertical in the plus sign is than the horizontal,in a sample of typefaces: Gill 1.1%, Georgia 1.6 %, Californian FB 1.6%, ACaslon 6%, Franklin Gothic Book 8.6%, AGaramond Semi-Bold 19%.   </p>
      <p>As you can see there is no hard and fast rule. Because roman faces generally have heavy verticals and lighter horizontals, this also affects what looks ’right’, as well as the optical illusion. And then the style of the typeface also affects it. And different glyphs will be different. So as James says it’s your design and your eye in the end. </p>
      <p>A way to get a feel for it is to look at other designs in a font editor, and compare them, as well as drawing your own.</p>
