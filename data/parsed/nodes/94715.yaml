    <p>I had a pleasure to visit Munich after several years' break. What caught my eye was the way umlaut was used in shop signs and in the Bayern München shirts. The shirt one seemed very odd to me, hardly an umlaut!</p>
    <p>Are there fonts with umlauts inside the u, or is it just a clever way to keep signs neat and in uniform hight? Is this very common in German speaking countries?</p>
