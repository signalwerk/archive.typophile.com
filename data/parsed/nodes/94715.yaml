    html: |-
      <p>Hi Mili, thank you for posting these! Any chance you could upload the pictures to Flickr, and add them to our group that Frode and riccard0 linked to?</p>
      <blockquote><p>Is this very common in German speaking countries?</p></blockquote>
      <p>Counter question: Isn’t this done in Finland? Finding creative solutions for diacritics that otherwise stick out of a blocky all-caps word image is not limited to German, or umlauts. It is also done with <a href="http://www.flickr.com/photos/fontblog/2477282211/in/pool-fancy-diacritics" rel="nofollow">tildes</a>, <a href="http://www.flickr.com/photos/patlejch/3878225502/in/pool-fancy-diacritics/" rel="nofollow">háčeks and acutes</a>, for example.</p>
      <blockquote><p>Are there fonts with umlauts inside the u?</p></blockquote>
      <p>Yes, there are a few*, but as far as I am concerned, there should be a lot more. Graphic designers obviously feel the need to fiddle around with fonts (convert to outlines, move the dots), in order to have vertically compact umlauts for tight and blocky all-caps settings. They shouldn’t have to: type designers could provide display alternates, accessible via stylistic sets or the like.</p>
      <p>*) Some simply manage to keep the dots within cap height (<a href="http://myfonts.us/td-63NRR3" rel="nofollow">FB Nobel</a>), some are more fancy, with a <a href="http://www.flickr.com/photos/tags/verticalumlaut/" rel="nofollow">vertical arrangement</a> and/or with the dots inside the counter (<a href="http://myfonts.us/td-lGFe5K" rel="nofollow">Mahlau</a>). Others have display alternates that look cramped, and, in older pre-OT fonts, are encoded poorly (<a href="http://www.fontshop.com/fonts/singles/scangraphic/bernhard_antique_sh_bold_condensed_ot/?&amp;sample_text=H%C3%84H%C3%96H%C3%9CH%5EH%7BH%7D&amp;sample_size=48" rel="nofollow">Bernhard Antique</a>). Thomas Phinney’s <a href="http://myfonts.us/td-LhKZRA" rel="nofollow">Hypatia Sans</a> is a modern typeface family that provides space-saving alternates via OpenType. You can get them by activating Stylistic Set 12. For the Black weight, the two dots have been arranged vertically.</p>
      <blockquote><p>People write this way quite often there.</p></blockquote>
      <p>True. But there’s a huge difference between handwriting, and lettering and typography. Here are some of the macron-like <a href="http://www.flickr.com/photos/tags/swissumlaut/" rel="nofollow">‘Swiss umlauts’</a> that we have collected.</p>
