      <p>Thank you everyone! I've added the pictures I took to the pool, the shirt isn't mine, so I couldn't add that.</p>
      <p>Is the use of vertical umlauts relatively new phenomenon? I lived in Munich for an year in the 90's and don't remember seeing those. Mind you, I wasn't quite as interested in them as I am now, but I'm sure I would've noticed them.</p>
      <p>As for diacritics in Finland, we have Ä, Ö and Å, and their diacritics are often dropped down or otherwise embedded, especially in newspaper headlines. Sometimes with Ä and Ö people replace the dots with a macron like line (esp. in handwriting), which in theory changes the letter, but as macron is not used in Swedish or Finnish, it doesn't cause confusion.</p>
      <p>Then there's this one font that was never id'd, an unusual approach (scroll to the end for a close-up):<br>
      <a href="http://typophile.com/node/29532" title="http://typophile.com/node/29532">http://typophile.com/node/29532</a></p>
