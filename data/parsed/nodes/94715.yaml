      <p>Mili, thanks for adding them, much appreciated! The more you look for them, the more you find.</p>
      <p>Hrant, you are pretty quick. Bear in mind that A) there are many fonts with a non-descending J to choose from, and B) the letters J and, especially, Q are among the rarest in German spelling. It is a lot more likely to run in one of the three umlauted vowels than in one of these two letters.</p>
      <p>Ralf (and Georg), Nick, thanks for making these typefaces, and bringing them to my mind. Excellent!</p>
