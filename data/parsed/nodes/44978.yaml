    <p>Hello once again.</p>
    <p>Simple ones for you folk, I'm sure. I'm not good enough at this though. So, I humbly ask for your help on this one. The Ace Ventura poster, more specifically the business card seen prominently on the poster. Here's the image:</p>
    <p><img src="/sites/default/files/old-images/ace_3509.jpg"></p>
    <p>I'd like to know the font used for "Ace Ventura" or, if not an exact match, something that has similar styles for: C, V, N, U, R and A. Most specifically C and R.</p>
    <p>Secondly, what is the handwriting style font used for the "To serve and protect..." text?</p>
    <p>Thanks in advance :D</p>
