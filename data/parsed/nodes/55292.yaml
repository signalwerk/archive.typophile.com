    <p>Hi.<br>
    I love type, but my education in the field is still poor. </p>
    <p>I've been wondering, what features of fonts i should be looking at, when i want to find a good serif/sans-serif pair? Color? x-height? Basic shapes of the letters, or shapes of the details?</p>
    <p>I was thinking about pairing ITC Caslon with Cisalpin (Caslon for display, Cisalpin for body text) for a project. I based my choices on the following criteria:<br>
    1) The color is rather even between the two.<br>
    2) The x-heights are close to each other.<br>
    3) The basic shapes of the letters are in the vicinity of each other - though not outright identical. Caslon, for example, has somewhat smaller aperture. If I'm not mistaken, Caslon is a transitional typeface while Cisalpin is humanist.</p>
