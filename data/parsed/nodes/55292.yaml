      <p>Thanks for the pointers. </p>
      <p>My project is creating a visual ID for myself, i.e. portfolio, business cards, eventual website etc... So there won't be great amounts of text anyway. And no, I'm not planning on mixing the two on the same line. At this point I do not have any sketches I wish to share.</p>
      <p>I fell in love with Cisalpin when I realized how well it works both on paper and on screen. It's a neutral font, and I'm quite used to having sans as body text (I'm European, see). Whereas I see ITC Caslon most definitely as a display font (or at least I don't own such fonts from the Caslon family that would work well in body text sizes). So, I will definitely be using Cisalpin, the Caslon (/other serif/any display font) issue is still open. </p>
      <p>My idea was to create a clean grid-driven design riding a sans workhorse, then add a bit of eye candy with the use of a delicious serif font.</p>
