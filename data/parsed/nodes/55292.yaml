      <p>What exactly is your project? Using a serif for display and a sans for body text is non common. Frequently, it's the other way around. Even color and x-height are going to be issues mainly if you were to mix the two on a line, which you probably wouldn't be doing here. </p>
      <p>Different projects might have different goals for each member of the pair. Sometimes, you <em>want</em> maximal contrast, so mixing a humanist serif with a geometric sans is a good idea, whereas sometimes you don't want that contrast, and using a pairing specifically designed to work together (like Scala and Scala Sans) might be better.</p>
      <p>However, the basic criterion that it all comes down to is: do they look good together? The eye is always the final arbiter when making pairings like this.</p>
