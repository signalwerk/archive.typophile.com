    <p><img src="http://behance.vo.llnwd.net/profiles17/1222313/projects/4393665/2a56b67b06edfb6df3816278c72681db.png"></p>
    <p>Graublau Slab is the latest addition to the popular Graublau type family designed by the Berlin-based type designer Georg Seifert. Since its release in 2008, the Graublau Sans Pro typeface has been a popular choice for corporate designs, books, websites and much more.<br>
    With Graublau Slab Pro, the type family becomes even more versatile. Since Graublau Slab comes in the same 7 weights as Graublau Sans Pro, both typefaces work together perfectly. </p>
    <p>Check out the PDF Type Specimen:<br>
    <a href="http://fonts.info/pub/pdf/graublau-slab-pro.pdf" title="http://fonts.info/pub/pdf/graublau-slab-pro.pdf">http://fonts.info/pub/pdf/graublau-slab-pro.pdf</a></p>
    <p>Available at:<br>
    <a href="http://www.fonts.info" title="http://www.fonts.info">http://www.fonts.info</a><br>
    <a href="http://www.myfonts.com/fonts/fdi/graublau-slab-pro/" title="http://www.myfonts.com/fonts/fdi/graublau-slab-pro/">http://www.myfonts.com/fonts/fdi/graublau-slab-pro/</a></p>
