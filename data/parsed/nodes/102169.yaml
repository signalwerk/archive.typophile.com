    html: |-
      <p>[Impossibility Alert]</p>
      <p>"- narrow/condensed (width similar to Myriad Pro Bold Condensed one):"<br>
      No problem...</p>
      <p>" I have to put long texts in small areas"<br>
      Not great for the older and younger reader...</p>
      <p>"so I need a font with strong angles, 0, 45, 90, "<br>
       I'm not sure this is entirely possible. 90 and 0 are gained by not using italic, but 45 degrees so as not to have uneven steps,  bold and narrow and long reading... </p>
      <p>Even if you are just a programmer, designer or milk man familiar with Myriad Pro Bold Condensed, and you know that a 45 degree line of any thickness will occupy as much horizontal space as it does vertical space, (making an "N" with a 45 degree angle similar in width to a square), you can see that a narrow or condensed AKMNQRVWXYZ and many more, are not going to have 45 degree features without becoming highly unfamiliar to readers of all ages and time zones over long text. </p>
      <p>Hope that helps, try not to hurt your boss, and Good luck!</p>
