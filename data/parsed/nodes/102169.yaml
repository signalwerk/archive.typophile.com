    html: |-
      <p>At the end I explained the problems to my boss, and he incredibly understood: the winner font is Codename Coder Free 4F, that I already suggested the day before (and was dumped).<br>
      I found a few nice commercial fonts too, but they all had a problem in my environment. CCF4 is perfect at 95%, if we consider that I had to abandon the bold and condensed style (for readability problem, as suggested here by someone of you).<br>
      To put long text I have to change spacing and horizontal scaling a bit, but the texts look nice anyway.</p>
      <p>Anyway I rebuilt the layout engine, and now is very fast to switch between fonts by XML, so if want to try another font or use different fonts on different apps it while be a matter of minutes!</p>
      <p>Thank you all :)</p>
