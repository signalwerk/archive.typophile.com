      <p>Not to pester, but: you put "free" in parentheses... If he didn't actually say it, why assume it? Ask him what the budget is - that's a big determinant in terms of narrowing a search.</p>
      <p>BTW for somebody who wants to fight the perception that fonts should be free it's worth "training" a boss by avoiding a free font even if it does the job. You're not the one with the budget - it doesn't hurt to try your luck! One day you might discover a non-free font you really want to use only to find that your boss is committed to never paying for a font... He might even ask you to pirate it, and if you refuse he might -perversely- think less of you.</p>
