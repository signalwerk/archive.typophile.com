      <p>Yes, don't assume it's a bad idea to spend money on fonts.</p>
      <p>BTW:</p>
      <blockquote><p>condensed (width similar to Myriad Pro Bold Condensed one): I have to put long texts in small areas</p></blockquote>
      <p>Actually narrowness doesn't always lead to economy. If the text has a lot of linebreaks a wide font can be set smaller, saving <em>vertical</em> space without wasting horizontal economy -an average of half a line- every time a linebreak happens.</p>
      <p>Also, it depends on the point size.</p>
      <p>hhp</p>
