      <p><cite>Charles, this is going slightly offtopic but I'm very much interested in your argument. Could you specify it? In which way - I mean with which printing technique - typefaces like Minion, Arno, Freight, Cycles, Clifford and Andron wouldn't look good when printed? Perhaps you mean they were designed to be printed offset, and not digital?</cite></p>
      <p>First of all, I haven't used all the typefaces you mention. And I feel OK publicly criticizing, if that's what it is, a large publisher like Adobe, but not the smaller ones.</p>
      <p>You should know that pretty much all through the 1990s, the offset plate was burned by using negatives. And for a good part of it, the negatives were made from a positive, the typset "repro" -- the negatives were only directly imaged in the late 1990s. </p>
      <p>At each photographic stage, the type usually picked up weight. There were reasons why the repro was "overexposed" and the negative "underexposed."</p>
      <p>Well, good type designers adjust the weight and contrast of their letterforms based on what they see when the type is "printed"; is used as intended. So, going back to metal, the punch was inked &amp; pressed into paper to see how the ink flowed, and the punch adjusted accordingly. Same with photocomp -- adjust the letterforms so the weigh and contrast are what you want when eventually printed.</p>
      <p>Now take away the slightly everexposed repro and underexposed negative; you can make the plate directly from the computer file. But the type gained weight and the contrast was affected by those now-gone portions of the workflow. Nor could the printer compensate when making the plate, because the ever-present images were now in the same file. If you "darkened" the type when making the plate, the dotgain on the images would go through the roof.</p>
      <p>All this within the life of Type-1 postscript fonts, which were not changed as printing changed. The printed type was clearer, but thinner. About half the distance between a regular and a medium. And by the way, those old Type-1 fonts became the new OpenType fonts, usually with no adjustment to the weight and contrast. Look at a book set in Minion about 1994, and compare it to a book set in the same Minion today. And printed offset, not "digitally."</p>
      <p>So I spent a week going back to the old Type-1 Minion multiple masters fonts to make new OpenType versions, with new weights for our work. BTW, I did talk to some type people at Adobe about this. They said the created the medium weight for bookwork. And I know people who agree -- problem is, they're people who do art books, always printed on coated papers, where the inkspread is less. To my eye, Minion medium is right on the edge, OK for coated sheets, but too heavy for uncoated. I think what we came up with will work for either. This from looking at printed books.</p>
      <p>None of this touches on "digital printing," it is all within the offset world. I'm no expert on digital printing, but the little I've seen has the letterforms heavier than even the old offset printing, with repro-negative-plate. Closer to 1200 dpi laser printing. And no wonder. That will probably change fairy soon, who's to say?</p>
      <p>I do think two, or maybe three weights can cover text for most forms of printing used today -- 2012. It's just that the type we have hasn't been tailored for them. YMMV.</p>
