      <p>Charles, on the grey of offset printing, I've compared old letter press printed print and modern offset under a 50X magnification. The letter press looked black with white lines (the print was on rag paper) running through it. The offset looked like a uniform granite, a mottled mixed gray and white dots. So it seems that the dots originating in the rasterizing process are still there in offset printing. The grey, if I've got it right, is not just from the ink but the rasterizing-offset combination. It might be an improvement if someone invented a better process for digital and offset print, with either greater dot density, or a second hit over the first, which would exactly fill in the holes. That would increase apparent blackness, without changing the ink.   </p>
      <p>I should also mention my own <a class="freelinking external" href="http://www.fontbureau.com/fonts/WilliamsCaslonText/" rel="nofollow">Williams Caslon Text</a>, which was designed to remedy the excessive lightness of many digital fonts, and hit the right balance between apparent darkness against the page, and enough white shining out within and around the characters. I've seen it work both on coated paper (Boston Magazine) and uncoated (the recent Foliomania!, published by the Folger Shakespeare Library, with their exhibition on first folios.)</p>
