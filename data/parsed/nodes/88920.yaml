      <p>It may be a generational thing. To me Bembo book looks about right for a 10-11 point text setting. But as an old man, I grew up reading books set in hot metal, printed either letterpress or from stereo plates.</p>
      <p>Many Postscript fonts, now printed direct-to-plate offset, look too thin and spindly to me. I can make my argument -- the best font designers of any period look at the letterforms as they print, and adjust the "original" letterforms weight and contrast according to the printed sample -- but we are still talking about a fashion. One man's thin and spindly is, I guess, another's perfection.</p>
      <p>Take a look at Penguin books of the 1950s and '60s set in Bembo. How do they look to you? </p>
      <p>I will have to admit that I made up a version of Bembo for us to use for text setting, reweighting "regular" Bembo, back in the mid-1990s. Also changed ascenders &amp; descenders, and the contrast of thick/thin strokes, etc. All this two or three ownerships of Monotype ago, when you could still get permission to modify a font from Monotype. So I've never felt the need to use the newer book weight, but it looks pretty close to what we came up with, when trying to match Bembo as printed letterpress by the Stinehour press, from the cast type.</p>
      <p>As for other ideas. Just now, I'm high on Espinosa Nova. It is not perfect, and I've reworked it some &amp; will do more for our peculiar taste (with Henestrosa's permission), but as a modern Venetian, I think it one of the best.</p>
      <p><a href="http://new.myfonts.com/fonts/estudio-ch/espinosa-nova/" title="http://new.myfonts.com/fonts/estudio-ch/espinosa-nova/">http://new.myfonts.com/fonts/estudio-ch/espinosa-nova/</a></p>
