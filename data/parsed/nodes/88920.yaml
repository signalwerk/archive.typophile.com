      <p>Nicola,</p>
      <p>Yes, the ink matters too. We have a small-run book printer in the States who esp. uses grayish inks, and did so even back in the days before ecological concerns affected ink and solvent choices.</p>
      <p>The saving grace with this is the eye adjusts to what is "black" fairly quickly, so the reader is probably less affected than us as examiners. Too thin is an entirely different matter. There are typefaces I just can't read after 5:00pm, when my eyes are tired. The type simply floats off the page.</p>
      <p>Edit:</p>
      <p>Yes, with letterpress, the ink is pushed outward, and if you use a strong loupe, you can see almost a black ring around the outside of the printed letterform. Offset printing gives more even black; if there is a concentration of the black, it is in the middle of the strokes.</p>
