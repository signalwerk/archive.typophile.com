      <p>Thanks for the very informative explanation Charles. I agree that most of the earlier digitizations of types born in the metal / photocomp era lack in "presence". I usually set books printed in offset (and sometimes digitally) and I have experienced that, besides the kind of paper, the results also depend on the printer's settings. Sometimes, unfortunately, the black is too grayish. As for the difference between offset and digital print, here are a couple of shots where one can see how, in offset print (second image), a typeface tends to be "heavier". That said, it's hard to get, even in a nicely printed offset page, the same look of a letterpress printed page.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/digital_type_3452_4557.jpg"></div><p></p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/offset_type_5160_5845.jpg"></div><p></p>
