      <p>Florian, there are both issues. I commented on both, and failed to note the difference. There is both an issue of the physical blackness of the letters on the printed page, and the visual "color" of the text, which has to do with the design of the letters—width of the strokes, and how they vary, the size of the counters and spacing, etc.  </p>
      <p>As Charles notes, there can be an interaction between the two. One font may work well on rough paper, and fail on coated paper and visa versa.</p>
      <p>Charles, has printing direct to plate also made any significant difference as to how typefaces work on paper?</p>
