    <p>Hi</p>
    <p>I'm looking for an elegant serif that works well at around 10pt and also has a display/titling cut for use at about 22pt. I've been looking at monotype's pro version of Bembo however the regular text weight looks a bit fat and clumsy at 10pt (it will be litho printed – no letterpress). The Titling cut is beautiful though.</p>
    <p>Anyone got any ideas?</p>
    <p>Cheers</p>
    <p>S</p>
