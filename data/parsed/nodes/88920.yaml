      <p>Question: Do you guys ever look at type printed high-resolution, using an offset press?</p>
      <p>IMSLTHO, some of these fonts would (probably) look great printed with a polymer plate, or offset, using repro-negative-plate technology, the printing method they were drawn for. DTP, no.</p>
      <p>Not all of them, of course. Miller is an exception, though I wouldn't call it an elegant face. And some I've never tried. The point is, look at how they print with the specific technology you will use. Your somewhat less than humble opinion might be different from mine, that's OK too. Just be sure to take a good, long look at the type as it will be used.</p>
