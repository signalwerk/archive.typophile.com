      <p>There are really two things going on here. </p>
      <p>The first is an aesthetic one, "What does a good typeface look like?" Part of this is fashion. The original poster asked for good looking "classic" serif fonts for text and 22-point display. And he found Bembo (I'd guess the book weight) a bit fat and clumsy at a 10-point setting. Now that's not how I see Bembo book. In one way, that's no big deal, we just disagree.</p>
      <p>The second is a typeface that doesn't work as its designer intended. That is a big deal; it's a disappointment. We've all had that kind of disappointment, and probably will again, but it's nice to avoid when possible. That's why I say "test the type all the way through to its intended use."</p>
      <p>More subtle is in between, where the designer gets exactly what they intended, but a significant number of users say "I wish it were a little XXXXXer".</p>
      <p>There is another kind of in between; as I read what I've written, someone could take the words to mean you need a different weight for each use, for each type of printing technology. I don't think this is universally true. But there are a number of fonts that lie on the edge, like, say, Merlo. </p>
      <p>Take Merlo. There are a couple designers I respect who feel it is very nice. And I, and some other designers I respect equally, find it a bit too heavy; we just can't get it to work set over 10 points. </p>
      <p>Now is this just fashion? Just personal taste? We say we want the same things out of a typeface, and yet in the event, wind up disagreeing. OK, that does happen. But in my small world of offset printed books, a bit of poking showed a difference: the people who liked Merlo were by in large also people who design mainly art books, books that will be printed on coated stocks. The people who though it a bit too heavy designed mainly texts that would be printed on uncoated stock. </p>
      <p>I found this out by accident; I finally saw Merlo used with a book printed on coated paper. My reaction was "Wow -- I like this."</p>
      <p>So sometimes there is an explanation, and those are good to find; because we learn from them. With the above perspective, I can *usually* weight a font so it lies in the middle, and will work on either kind of sheet.</p>
      <p>That's one big point, I think. There are a number of fonts that lie on an edge; they're so close to not working well that the size set, or the ink used, or the paper, or, or, or can create a problem. Often enough, some subtle adjustments can remove many issues.</p>
      <p>(Of course, I'm long past the Pollyanna stage -- there is also disagreement where sometimes somebody's clearly wrong ...) ;-)</p>
