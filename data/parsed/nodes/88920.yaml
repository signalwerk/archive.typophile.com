      <p><cite>Andron […] Mid-Caps as well planned for the future?</cite>.</p>
      <p>I cannot say honestly ‘planned’. But there is a range of (older) medior PS fonts and some newer incomplete test fonts as well. It’s not just about mid-caps but also about mid-uncials or mid-lowercase sorts. For Andron, medior letters apply at least for Latin, Greek, Coptic and Irish, for Gothic of course. I can’t say when they will see a release.</p>
      <p><cite>Do you guys ever look at type printed […] ?</cite></p>
      <p>This question seems a little funny to me.<br>
      I think a good 600dpi laserprinter is the ever best what can happen to a didital typeface. Yes better than super-high-res offset printing.<br>
      Once a book was set in Andron. As the publisher rejected any pre-press concerns the typesetter hat to print out every page (Hundreds) and she did so on a rather poor laser device. Then all those prints were scanned – y e s !! – and the book finally printed from the scanns. – In the end it looked like a re-print of a letterpress-book from the 60ies. ;-) not bad.</p>
