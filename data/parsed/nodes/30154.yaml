      <p>The copyrightholders (Hergé's estate) are quite vigorous in prosecuting offenders, and they include the fonts used in the comics in their realm of ©-material.<br>
      Last century a sSpanish outfit published a faithful rendition of the bold cap lettering used on the covers of Tintin and they had to withdraw the fonts from their site, even though they said that is was an hommage.</p>
      <p>(But all that being said — there are copies floating around the web…)</p>
