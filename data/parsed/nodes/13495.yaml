    <p>The Typographic Society of Munich, often refered to simply at the TGM. They sponsor exhibitions, lecture series, and other typography-related events, often in conjuction with the German Liason Committee of the <a href="/wiki/Type%20Directors%20Club" class="freelinking" rel="nofollow">Type Directors Club</a>.</p>
