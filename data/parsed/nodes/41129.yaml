      <p>Thanks for that SpurSerif, I'll give her an email and see what she thinks.</p>
      <p>And as for literaturnaya, even though one would have to know the history behind it (which most would not), it is important that we aren't associated with communism - as with almost the rest of the world, in NZ communism is used as a negative buzzword by media and politicians alike. By mentioning socialism, I was more trying to suggest that the font is highly accessible and readable which doesn't seem too fancy or classy, as this could be perceived as being pitched at upper classes or the more wealthy portions of society. A font of the people if you will.</p>
      <p>-Rafe</p>
