    date_raw: 13.Jan.2009 6.14am
    votes: null
    html: <p>There’s some wonderful stuff in there, and it’s interesting to see that the pre-Revolutionary Russian commercial artists were connected to what was going on in Paris. Maybe we’ll get lucky and someone will do a book about pre-Revolutionary Russian design!</p>
