    html: <p>What a wealth of work -- thanks for posting this! It's interesting to see, in some of the ads, decorative and artistic styles from the late 19th and early 20th centuries applied to Cyrillic lettering. And it's not often that one gets to see graphic design or advertising from pre-Soviet Russia.</p>
