      <p>I found another term — spur serif. And this is used in the Phil’s Photo book “Homage to the Alphabet” which shows a typeface called Solon Antiqua which happens to have the same A and R, as well as the flat N. This book was published in 1985, and I do not know of a digital version of Solon Antiqua. I think it’s the answer to your font ID. </p>
      <p>- Mike Yanega</p>
