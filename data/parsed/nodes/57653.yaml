    <p>Trying to ID this serifed font from a video advertisement. Likely produced in the mid 1980s. Some (all?) of the angled serifs could very well have been done by hand (my apologies if there is a technical terms for such angled serifs).</p>
    <p></p><div class="imageWrap"><img src="/files/undra_sample_text_6219.jpg"></div><p></p>
    <p>TIA</p>
