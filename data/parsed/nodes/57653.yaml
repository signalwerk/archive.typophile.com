    html: |-
      <p>The only font I can think of with an R and A like this is <a class="freelinking-external" href="http://new.myfonts.com/fonts/castletype/xavier/">Xavier</a>, but Xavier is either sans or serif, and neither matches very well with your sample. In particular the N in your sample has a flat vertex at the basline, not a pointed one.</p>
      <p>Penumbra and Columna are flareserif faces, but they also have the pointed N.</p>
      <p>- Mike Yanega</p>
