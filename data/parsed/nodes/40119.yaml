  html: <p><a href="http://www.aftenposten.no/kul_und/litteratur/article2155020.ece" rel="nofollow">Aftenposten</a> ran a story today on a school in Horten, Norway exchanging regular books for e-books in a test project. Apparently it's quite economical too, since production and sales costs are cut. The students are complaining it's still a bit slow, and that the books the use aren't designed for screen.</p>
