  html: |-
    <p>Hello,</p>
    <p>I’m working on a type specimen and the chosen theme is Corporate BS, that hollow language used by corporations worldwide.<br>
    I’ve found generators <a href="https://web.archive.org/web/20080907001226/http://members.aol.com/matt999h/bullshit.htm">here</a> and <a href="https://web.archive.org/web/20080907001226/http://www.atrixnet.com/bs-generator.html">here</a>. But as specimens go, some of the sentences are too long, and maybe not as annoying as I want them to be.</p>
    <p>Some examples:<br>
    redefine integrated users<br>
    reinvent seamless content<br>
    orchestrate compelling channels<br>
    expedite holistic platforms<br>
    enable impactful relationships<br>
    redefine world-class content<br>
    incentivise holistic synergies<br>
    competently extend cutting-edge interfaces<br>
    energistically maximize 24/7 interfaces</p>
    <p>It could be just two words, somehow infected, like <em>synergy effect</em>. </p>
    <p>What expressions trigger your contempt? Would you be so kind to share? It’ll be fun, it’ll be a <strong>win-win situation!</strong></p>
    <p>Cheers,</p>
    <p>Fredrik</p>
