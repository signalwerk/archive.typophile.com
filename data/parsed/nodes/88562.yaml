  html: |-
    <p>Frio is a geometric monoline sans-serif typeface consisting of 15 styles: 5 weights and 3 widths plus italics. Clean, neutral and technical, Frio was inspired by the form of super ellipse and Eurostile by Aldo Novarese. The font contains stylistic and contextual alternates, ligatures, discretional ligatures for use in German, ornaments and other OpenType features. It supports all the European languages using Latin alphabets.</p>
    <p>The main thing that sets it apart from the other typefaces is a possibility of using simple typing combined with stylistic sets to add coloured backgrounds to numerals.</p>
    <p><a href="http://new.myfonts.com/fonts/lamatas/frio/" title="http://new.myfonts.com/fonts/lamatas/frio/">http://new.myfonts.com/fonts/lamatas/frio/</a><br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/Frio_720x360-1_5593.png"></div><p></p>
