    <p>Hi,</p>
    <p>I have these 3 friends that have a DJ Crew, they started making parties in the college dorms, when they were the dorms staff. So thats why their company is name THE STAFF. They play latin, hip hop, techno, everything music. They have had this logo for about 2 or 3 years but they think its too boring and complicated to use. So i'm in charge of refreshing it.</p>
    <p>This is my first proposal, i think it can work but at the same time i think something is missing.</p>
    <p>Comments, suggestions and hard critique is always welcome :)</p>
