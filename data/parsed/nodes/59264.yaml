    html: |-
      <p>This is a total design reversal, but if I recall my youth, Victorian pictures were often presented in oval frames that contained ornate bric-a-brac designs in the corner. So moving the decoration outside of the oval, and putting the information inside, where the photo (we called them tin-types back then) went might create an impression that is more photographic.</p>
      <p>Just an idea.</p>
