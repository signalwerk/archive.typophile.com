    html: |-
      <p>Hi there,</p>
      <p>The first one that you had took on this playful, victorian meets cute style, and I liked it.  I think that the brown is a much darker value - I'm sure if you desaturate this thing, you'll see that the brown is a lot darker, and for some reason, it feels like too much contrast - like it's competing with the rest of the layout.  </p>
      <p>I liked the victorian elements to the first mock up, and think you should push it further in that direction. A lot of cool stuff came out of that time period.</p>
      <p>ALSO, this all depends on what kind of photographer this person is - let their style determine your concept!  If they shoot kids a lot, then I think you're headed in a good direction.  </p>
      <p>Good luck!<br>
      daniel</p>
