    html: |-
      <p>Perhaps you can explore the artistic style currently being used, with an illustrated camera.  OR perhaps more emphasis on your Name and Title.  The latter should read "Pictorialist" for an added layer of fun.  A pictorialist references the photography folks of the late 1800's and earily 1900's exploring various methodology to produce a "painterly" effect, and more over, to show the public that Photography IS an art.  Your business card has a 1800's Victorian flare to it and I would advise that further exploration of that period will give you a unique look and feel your looking for.<br>
      best regards,<br>
      daniel</p>
