    html: |-
      <p>As Florian says, the CSS-defined font that most everyone will see here on Typophile is Georgia.</p>
      <p>But if you try to bypass that CSS with various browser preferences — like telling Firefox not to “allow pages to choose their own fonts, instead of my selections” or directing Safari to use your own external CSS stylesheets instead — Typophile doesn’t behave as expected, because of the issues discussed above.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Firefox-content_3648.png"></div><p></p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Safari-advanced_6438.png"></div><p></p>
      <p>&nbsp;<br>
      As David complained, instead of seeing your selections, you get a system default. Times in most cases, it seems. What I suggested above about Other Languages gets Firefox around the glitch. I don’t know if there’s code that can be written into a CSS to get Safari around it.</p>
