      <p>David —</p>
      <p>I don’t know about feeding external stylesheets, but when I wanted to have Firefox ignore the Typophile CSS-defined fonts and display everything in my Firefox preference (when I was testing those WhitmanScreen attempts) I had to set the Preferences &gt; Content &gt; Fonts&amp; Colors &gt; Advanced ... for “Other Languages” (instead of Western) in order to have it not display the Times and Courier.</p>
      <p>As Florian point out, there’s something funky about the Language designations for this site.</p>
