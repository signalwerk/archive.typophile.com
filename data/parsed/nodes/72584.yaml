  html: |-
    <p>How come on all other web sites, if I change my default fonts in Firefox, or feed Safari a style sheet, I get the fonts I choose in the web sites I'm looking at... But in Typophile I get nothing but stinkly little Times to read, and crappy old Courier to write?</p>
    <p>Cheers!</p>
