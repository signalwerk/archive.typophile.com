    html: |-
      <p>David,</p>
      <p>this behaviour seems to be triggered by the erroneous value of the language attribute in the HTML element; <code>lang="Object id #6"</code>. At least, I was able to see my user-defined fonts after I deleted that bit. There is more invalid code in there, but that is the crucial bit, in my opinion.</p>
      <p><a href="http://validator.w3.org/" rel="nofollow">W3C’s Markup Validation Service</a> states that the <cite>value of attribute "lang"</cite> [and "xml:lang"] <cite>must be a single token</cite>, i.e. <cite>[t]his attribute can not take a space-separated list of words as a value, but only one word ("token"). This may also be caused by the use of a space for the value of an attribute which does not permit it.</cite> Furthermore, the <cite>character "#" is not allowed in the value of attribute "lang"</cite>.</p>
      <p>Florian</p>
