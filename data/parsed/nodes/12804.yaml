  html: <p>Rodrigo X Cavazos is the founder of <a href="/wiki/PSY/OPS" class="freelinking" rel="nofollow">PSY/OPS</a>. His fixation with type and lettering began in the mid-80's with the discovery of a bitmap font editor for the Apple IIc/e. Since leaving his textile design niche 1993, he's had the privilege of collaborating with many other type designers and foundries around the world. Rodrigo and his wife Pam live in a quiet creekside bungalow seven train stops from downtown SF.</p>
