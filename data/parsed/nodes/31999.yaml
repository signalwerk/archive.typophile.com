    <p>I was wondering if one of you could recommend a professional calligrapher for an illustration I hope to commission. This will be for silkscreened apparel. I would like to have the same Spencerian style one sees applied to birds, fruit, feathers, etc. applied to a more modern subject such as a tank, bomber, grenade, etc. The effect is intended to be ironic…a beautifully human and fragile depiction of an instrument of death.</p>
    <p>I am attaching an image to give you some idea of what I hope to emulate. It is a meager example of the craft, but all I have currently available.</p>
