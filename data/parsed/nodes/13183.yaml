      <p>I don't know what the market is, but the first option, with its sigmas in place of the e's says "oh, oh, fake-Greek is cool! and we can think of anything else to say…"</p>
      <p>I don't think that legibility of readability would be the issue here. It will be read just fine (even though it isn't written in either English or Greek).</p>
      <p>Are you looking for something that is all style and no substance? Maybee there is another visual pun that you can use that would be more deep.<br>
