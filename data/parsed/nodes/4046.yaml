    html: "<p>Thanks, but this doesn't seem to work.  I have saved the files on the MAC and transferred them to the PC.  They have the .indd extension and indesign lists them on the \"OPEN FILE\" dialog box.  However when I click on any to open it gives me an error message: \"Cannot open the file &lt;name&gt;.indd.  Adobe Indesign may not support the file format, a plug-in that that supports the format may be missing, or the file may be open in another application\"    <br> <br>To me this makes no sense because obviously Adobe .indd files are supported.  So is there another difference in the MAC and PC formats?? <br> <br>Thanks!</p>"
