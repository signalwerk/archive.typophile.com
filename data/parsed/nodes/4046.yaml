  html: <p>I was just wondering if anyone knew of a method or plugin or such that would allow me to take my MAC inDesign CS files and open them on my PC version of inDesign CS.  I would think there would be a way, but I haven't been able to find one.  Any info would be great!  Thanks!</p>
  html_clean: <p>I was just wondering if anyone knew of a method or plugin or such that would allow me to take my MAC inDesign CS files and open them on my PC version of inDesign CS.  I would think there would be a way, but I haven't been able to find one.  Any info would be great!  Thanks!</p>
