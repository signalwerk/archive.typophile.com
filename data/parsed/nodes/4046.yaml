    html: <p>Hmm. Perhaps it's a plug-in issue. Are you using a plug-in on the Mac side that you might not have on the Windows side? For example, do you have an auto-activation plug-in for a font manager that adds extra data to the InDesign file? <br> <br>Failing that, you might want to post in the Adobe User-to-User forums. Just go to http://www.adobeforums.com and pick one of the two InDesign forums. Maybe the Windows one. <br> <br>Regards, <br> <br>T</p>
