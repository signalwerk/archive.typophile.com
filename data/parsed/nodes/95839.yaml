    <p>I'm looking for the font used for the credits and posters of the movie ZARDOZ. Not the title card one, as that's clearly custom. The one used for the rest of the credits and taglines.</p>
    <p>Teaser poster: <a class="freelinking external" href="http://204.244.128.121/assets/product_images/1020/259940.1020.A.jpg" rel="nofollow">http://204.244.128.121/assets/product_images/1020/259940.1020.A.jpg</a></p>
    <p>Theatrical poster: <a class="freelinking external" href="http://1.bp.blogspot.com/-1eHqxUnjGuQ/TdXD5VGk7vI/AAAAAAAAAWo/JOKgal0YIZg/s1600/Zardoz_Poster.jpg" rel="nofollow">http://1.bp.blogspot.com/-1eHqxUnjGuQ/TdXD5VGk7vI/AAAAAAAAAWo/JOKgal0YIZg/s1600/Zardoz_Poster.jpg</a></p>
    <p>Trailer: <a class="freelinking external" href="http://www.youtube.com/watch?v=kbGVIdA3dx0" rel="nofollow">http://www.youtube.com/watch?v=kbGVIdA3dx0</a></p>
    <p>Credits sequence (mirrored due to copyright issues, but just in case it's helpful): <a class="freelinking external" href="http://www.youtube.com/watch?v=Zk5TNiv8lRI" rel="nofollow">http://www.youtube.com/watch?v=Zk5TNiv8lRI</a></p>
    <p>Thanks in advance!</p>
