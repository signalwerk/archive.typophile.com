    html: |-
      <p>I don’t generally like figures in the top style although these are rather attractive, however, the foreground figure does seem to be waving a thong at a broad-chested man wearing a bra (maybe an adult form of morris dancing that I’m unaware of). The positioning and colour of the cyrillic seems to subjugate it while partially obscuring the latin, perhaps this is the english language version though. I suspect with the second you will have trouble in print with the gradations, especially where the magenta gets thin towards the bottom.</p>
      <p>Tim</p>
