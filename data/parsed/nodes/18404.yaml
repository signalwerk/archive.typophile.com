      <p>As mentioned above I think you should look at the bottom strokes and alignment of the ELL, you could also look at making the letters slightly wider to match better the R &amp; A; you could also look at modulating the stroke on the bottom counter of B, like the top counter, a slightly more protruding serif on the Bs and R might look good; the terminals of the Ss is a bit too decorative compared with the simpler strokes used for the other letters you could look at reducing the spiral shape. Overall though it is a friendly image that goes well with the handbuilt quality of wooden boats.<br>
      Tim</p>
