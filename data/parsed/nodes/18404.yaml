    html: <p>i think the key is to find balance as you have seen. The right stroke on the A could fall down behind the normal stroke of the S (from the first jpg) and then the second S could interact with the first S. You could have a entrance swash on the first B and maybe an extra swash on the bottom loop of the second B, or maybe the E could interact a little with the first L or something like that. I guess it depends on how swashy you want it to become. Perhaps to see what is possible you could check out the <a href="http://www.letterheadfonts.com/gallery/" rel="nofollow">gallery</a> at <a href="http://www.letterheadfonts.com/" rel="nofollow">Letterhead Fonts</a>, there are some really great examples there.</p>
