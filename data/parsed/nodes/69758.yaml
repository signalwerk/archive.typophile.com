      <p><strong>@ Riccard0:</strong></p>
      <p>Great response. You are a wise man :)</p>
      <p>I agree that design in E-mail can often times make an E-mail look unprofessional. "Good design is as little design as possible" — Dieter Rams via Objectified: A Documentary Film by Gary Huswit</p>
      <p>Maybe I will just make all of my E-mails plain text. I don't I mind a professional designer showing some personality in an E-mail signature though.</p>
      <p><strong>@ Russ:</strong></p>
      <p>• Thank you for the feedback. The font that I used is Georgia which is a Web safe font. I use Verdana for body text so I wanted a different font for the signature. I might consider just making the signature Verdana.</p>
      <p>• Good call on the dash. I suppose I intended it more as a stylized bullet rather than a dash. Fail on my part, LOL. I think I will most likely change the dash to an actual bullet or a vertical bar.</p>
      <p>• As far as the numbers go I think I have both a local and toll free number so I should probably include both numbers. I am trying to provide the least amount of information necessary so I need to think more about whether or not I need to include both numbers. I am leaning towards yes.</p>
      <p>• I think the formatting of the phone numbers is subjective. I do not like parenthesis for the area code and I am indifferent as far as periods versus dashes.</p>
      <p>• I like your suggestion for the Web site formatting. I will get rid of "www" and I will camel case the Web site. <strong>@ JamesM:</strong> Good catch on capitalizing the "L". I do not like the standard blue link but I can chose a different color.</p>
      <p>• I do not mind the lack of color for the link since the underline shows the Web site is a link. I will consider adding color. Color can improve the emphasis that the Web site is a link.</p>
