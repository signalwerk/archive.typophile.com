      <p>Eric,</p>
      <p>I'm not certain what type face your using? But, you should consider using a type face designed for on-screen or digital use, maybe even an HTML font? Verdana or Trebuchet are both HTML fonts.</p>
      <p>I'm not a proof-read but I work with some and from my experience(s) with their comments, the dash you have here might be incorrect; and em dash is actually more appropriate(I think). Like I said, I'm not a proofer my self but your not using a dash here to alter the first word with the second. </p>
      <p>This may not apply to your signature but I normally include more than one phone number and when I list phone numbers I either use periods in place of dashes or I use parenthesis for the area-code and a dash for the 7 digits.</p>
      <p>Lastly, the second hyphen should probably be an em dash and the web address for Findlaw.com would probably be cleaner if you removed the www and cap'd the F. I personally add links to web addresses in my email client. Some email apps color the text #0000ff automatically, but that color isn't easy on the eyes. So decide for yourself if you want to add color? I find that color signals that the link is active and the most expected color is the default #0000ff but you can choose a link color of your own and just stick to it as well. What ever you wish?</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Signature_6160.jpg"></div><p></p>
      <p>Hope this all helps.</p>
      <p>Russ</p>
