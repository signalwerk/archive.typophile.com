    <p>Hi everyone,</p>
    <p>Does anyone know what font is being used here? It looks like Helvetica Black but then there's no vertical lines on the lowercase "U" for example. Also, that apostrophe is pretty unique. </p>
    <p>Any ideas?</p>
    <p><img src="/sites/default/files/old-images/uncle-sams-logo_4642.jpg"></p>
