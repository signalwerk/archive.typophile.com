      <p>The /u/ and the /s/ look pretty much like Futura Bold.<br>
      I’m quite sure it was based on it, with a custom /c/ (made out of an /e/?), altered joints in /n/ and /m/ and obviously a different /a/. Oh, and the apostrophe, too.</p>
