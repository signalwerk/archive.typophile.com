      <p>Glad you posted this.</p>
      <p>In addition to the above comments, I would suggest not altering the size of the “@” symbol. Here, it looks disproportionate to the rest of the text. However, if you plan on adjusting for stroke thickness then by all means give it a try—print samples to test reader cognition. </p>
      <p>Also, if you intend to have the telephone number larger than the web and email addresses, I would enlarge it more so that it looks like you intended to be larger, as opposed to have enlarging it with point sizes too subtly to each other and the reader (or casual glancer) may not get the impression the the telephone is being emphasized over the web addresses. </p>
      <p>Let us know what you come up with.</p>
      <p>Mike :-)</p>
