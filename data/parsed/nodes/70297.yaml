      <p>'In a business card setting, is it ok/preferrable to hang the plus? I've never seen it done before'</p>
      <p>You won't, because the plus sign imparts important information: it means 'substitute your national code for dialling foreign telephone numbers here'. It's not a punctuation mark, and it mustn't be overlooked.</p>
