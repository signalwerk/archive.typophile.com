    html: |-
      <p>Michael Rowley expressed my idea about 'why the plus sign here is more significant than punctuation' more seriously.<br>
      But also said "I've never seen it done before" well that's not a bad thing necessarily.<br>
      I still think it's editorially wrong to hang it but who cares.</p>
      <p>3/4 numerals make more sense than cap height ones. Like fabulous said don't hesitate to add a tiny bit of stroke to compensate the change of weight. If your working in InDesign you can set a Character Style that scales type 75% and then adds a 0.05pt stroke. And then add a GREP in your Paragraph Style that applies you Character Style to "Digits".</p>
      <p>Regarding the @ symbol it is totally replaceable, as long as you find one from another font that matches your typeface.</p>
