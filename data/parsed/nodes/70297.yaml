    html: |-
      <p>If the phone number is the crucial information and if you pushed the plus sign even a little further and gave it a colour maybe.<br>
      But I think a plus sign has a soul and should be treated like a letter. I say that because unlike an apostrophe or a hyphen it actually consumes almost as much ink as a lowercase o. If you want to optically adjust it you may want to align the vertical to the beginning of the line, but even that may look odd. </p>
      <p>E is too far from the O, HS is too close together compared to the surrounding P and O.</p>
