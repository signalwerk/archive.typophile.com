    <p>Hi,</p>
    <p>In our company we use Trebuchet to create every document. I find the long texts written in it unreadable. What are your comments? The boss has asked me to give 1-2 printed pages using different fonts. Which fonts should I choose? I am thinking aout Garamond and Palatino. What leading I should keep for these fonts at 11pt and 12pt? I am planning to write the text on typography. Do you have any suggestions for the text? Thank you very much in advance.</p>
    <p>Best Regards,<br>
    Rahul.</p>
