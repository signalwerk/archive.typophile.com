      <p><em>Does anyone offer the Palatino Display in digital version?</em></p>
      <p>Very soon, Linotype will release Hermann Zapf's Palatino nova, the most extensive digital Palatino ever. It will have two display weights, both based on more old metal Stempel Palatino alternates, Michelangelo and Sistina. An Aldus nova is also part of the overall release (although I think that Palatino nova works well in text sizes, too).</p>
      <p>Many here may remember Akira Kobayshi's presentation of Palatino nova at TypeCon last year. There, he also announced that a Sans family has been designed by Hermann Zapf as well.</p>
      <p>__<br>
      <a href="http://www.typeoff.de" title="www.typeoff.de">www.typeoff.de</a></p>
