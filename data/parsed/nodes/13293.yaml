      <p>I have to agree with Hrant on Aldus. It probably depends also on size<br>
      and paper, but I have seen Palatino looking great and awful as text.<br>
      I suspect that the 'great' was actually Aldus. </p>
      <p>Here is Linotype on Aldus:</p>
      <p> "Designed by Hermann Zapf for D. Stempel AG, this typeface was<br>
      originally intended to be the book or text weight for his  Palatino™<br>
      font family. It was instead released as a separate font with the name<br>
      Aldus™ in 1954. Aldus has the distinction of being lighter and<br>
      narrower than Palatino, which makes it a good choice for book<br>
      typography, though Palatino has also gained popularity as a text<br>
      face."</p>
      <p>&gt;Depending on the font I’d look at 9 or 10 pt type. I think 12 pt<br>
      type is way to large. Think of your local newspaper or common<br>
      magazine.</p>
      <p>I think the 'depending on the font' needs clarification. It may be<br>
      that Palatino will work much better at small sizes, because it is<br>
      dark and wide - but others will be worse at small sizes. In general<br>
      you need to consider your page dimensions, number of columns, the<br>
      measure (width) of the columns, the possible leading, and the<br>
      x-height of the face. Some 12 point type will look fine and others<br>
      (maybe Palatino) bad.</p>
      <p>It is the combination of size, measure and leading and face that are<br>
      critical for readability, not one by itself. The width, x-height and<br>
      darkness of the type, as well as the measure, affect the leading.<br>
      Bringhurst says that 45-75 lower case characters is the generally<br>
      agreed-upon acceptable range, with 66 lower case characters, or about<br>
      two and a half lower case alphabets ideal for single columns. I think<br>
      this is one of the most important and too often neglected variables. </p>
      <p>In my opinion don't even think about a sans serif for extended text.<br>
      But you can get away with it to some degree if you have narrow<br>
      columns and enough leading.</p>
