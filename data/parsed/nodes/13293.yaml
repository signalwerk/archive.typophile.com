      <p>Trebuchet: Ick!</p>
      <p>Rahul, can you purchase fonts, or do you have to pick a system font? Are you restricted to certain sizes? Different fonts look bigger or smaller at the same sizes. Digital Palatino works better than Trebuchet for text, but it's so expansive, it looks best at about 8.5 - 9 point, and frankly clumsy at 12 point. I suspect the Palatino on everyone's system was made from 9-point drawings. </p>
      <p>If you are picking a single type family for use in all documents, make it something very quiet and serviceable, like Minion, Sabon, or the robust <a href="http://www.fontshop.com/?fuseaction=catalog.fontdetail&amp;searchby=manufacturer&amp;displayfontid=FF.11069.7.27" rel="nofollow">Clifford Nine</a> or <a href="http://www.mvbfonts.com/html/fonts/verdigris/pk_verdigris.htm" rel="nofollow">Verdigris</a>. Those last 2 would allow you to use a smaller size, like 9 point, without anyone complaining, and you might save a tree.  Then there's the elegant and economical <a href="http://www.fonts.com/FindFonts/detail.htm?pid=414154" rel="nofollow">Laurentian</a>. There are many useful text faces that are better than Trebuchet out there. It depends on how hard the typeface has to work and what kind of budget you have.</p>
