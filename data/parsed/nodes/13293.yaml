      <p>Palatino was foundry type, and was adjusted for different sizes. Unfortunately the one everyone sees is from a small master. If you look at signage, often you will see the more refined, slender display version. For some reason every parking garage in SF uses it. Hrant's point is good; Aldus performs quite well in text, and is more economical as well. It's likely, though, that few people in the typical office will be able to tell Aldus and Palatino apart.... </p>
