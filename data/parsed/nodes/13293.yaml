      <p>Rahul, my suggestion for the text is to use something that will have your boss looking at the legibility of the text not the content. I suggest something like a chapter of Alice in Wonderland or Through the Looking Glass. </p>
      <p>Depending on the font I'd look at 9 or 10 pt type. I think 12 pt type is way to large. Think of your local newspaper or common magazine. </p>
