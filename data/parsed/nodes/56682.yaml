  - id: 340553
    user: 42797
    date: 2009-04-08T02:18:00
    date_raw: 8 Apr 2009 — 2:18am
    votes: null
    html: |-
      <p>i said:<br>
      &gt;   portland is just seattle in another state.</p>
      <p>i was trying to be positive, thomas, and<br>
      i have no doubt portland will be great...</p>
      <p>but...</p>
      <p>but the truth is, i'm not a very good liar,<br>
      not even when i'm being a cheerful liar.</p>
      <p>and the truth is, portland might be fine,<br>
      but it's _no_ seattle, because there can be<br>
      no other seattle, because seattle is unique.</p>
      <p>you see, i lived in seattle when i went to u.w.</p>
      <p>grew up in eastern washington, and then<br>
      went to u.w. 4 years as an undergraduate.</p>
      <p>i lived above the ship canal, west nickerson,<br>
      and rode my bike over to campus every day,<br>
      so i got stopped often by the fremont bridge.</p>
      <p>(it's the lowest drawbridge on the ship canal,<br>
      meaning it has to open more than any other.)</p>
      <p>i used to love getting stopped.  because it gave<br>
      me a chance to stop and watch the ships go by,<br>
      which is actually better than smelling the roses,<br>
      because the smell of the roses will fade away,<br>
      but each ship was on a journey, and journey<br>
      spurs the imagination to wonder itself away.</p>
      <p>where are they going?  what are they doing?<br>
      when are they returning?  are they returning?<br>
      i used to love getting stopped; i would watch.</p>
      <p>ahh, my college years...</p>
      <p>this was a long time ago, long before adobe<br>
      bought that land north of the fremont bridge<br>
      and built their stuff there -- a long time ago,<br>
      way long before there even _was_ an adobe...</p>
      <p>since then, i'm sure the place has been gentrified,<br>
      what with the fancy adobe buildings and the fancy<br>
      adobe people and their fancy adobe power lunches.</p>
      <p>i'd like to think fremont will always hold on to its funk<br>
      -- and please don't bother to tell me if it's not true --<br>
      but i'm sure all that fancy has rubbed off onto some...</p>
      <p>but gosh darn what a beautiful city.</p>
      <p>so...  after the bridge, i'd bike alongside the water,<br>
      past gasworks park, over by ivars, up onto campus.</p>
      <p>some days after class, then i'd bike over to greenlake<br>
      -- which is officially my favorite place in the world --<br>
      and take a couple 3-mile spins doing the girlwatching.</p>
      <p>i loved seattle.</p>
      <p>i loved the locks, golden gardens, the greenest green.</p>
      <p>i loved the ferries.  the washington state ferries.</p>
      <p>i loved the emerald city.</p>
      <p>i was sad when i had to leave seattle.</p>
      <p>and i'd guess that you're sad too, thomas.</p>
      <p>i'm sure portland will be fine.</p>
      <p>but i knew seattle.</p>
      <p>and portland is no seattle...</p>
      <p>-bowerbird</p>
