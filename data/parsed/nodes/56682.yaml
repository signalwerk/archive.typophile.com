    <p>I officially became an Extensis employee last week. <a href="http://www.thomasphinney.com/2009/04/phinney-joins-extensis/" title="http://www.thomasphinney.com/2009/04/phinney-joins-extensis/">http://www.thomasphinney.com/2009/04/phinney-joins-extensis/</a></p>
    <p>I'm pretty excited about this new position. It's already turning out to be lots of fun, and gives me plenty of opportunities to learn new things, while working with a great crew of people and not leaving the type industry (albeit not involved in making fonts).</p>
    <p>Cheers,</p>
    <p>T</p>
