    <p>Hi,</p>
    <p>The piece i am working on uses a font that was sent to me by the designer who created the logo and stuff. I want to install the font (carpediem) onto my computer. The files came from a mac. Going thru my basic install routine seems to not be working. Any knowledge out there on this?<br>
    Thanks,<br>
    sara</p>
