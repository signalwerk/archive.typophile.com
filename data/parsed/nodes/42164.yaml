    html: <p>The only font formats that work on both Macs and PCs are OpenType (.otf) or Windows TrueType (.ttf). If it’s coming from a Mac, and it’s not one of those, it’s not going to work on your PC. You’ll need to get hold of a version of the font in Windows TrueType (.ttf), OpenType (.otf), or Windows PostScript Type 1 (.pfb).</p>
