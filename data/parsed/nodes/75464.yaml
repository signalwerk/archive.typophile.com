      <p>Thanks John, I hadn't considered the kerning implications, in that respect GSUB is the more logical choice.</p>
      <p>@eli  This feature is not unique to VOLT built fonts and there are many fonts out there that have used GPOS for this feature. In FontLab GPOS  can be created easily in a single line of feature code, but as John pointed out, this may well throw up some additional issues.</p>
