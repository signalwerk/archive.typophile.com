    html: <p>The published <a href="http://www.microsoft.com/typography/otspec/features_ae.htm#case" rel="nofollow">feature description</a> suggests that this could be done with either GSUB or GPOS. I don't recommend doing it with GPOS, though, because that will create issues where glyphs are kerned; these issues could be resolved with further, contextual GPOS adjustments, but that's a lot of tricky work, whereas GSUB makes everything much simpler.</p>
