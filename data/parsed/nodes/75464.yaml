    <p>Hi All</p>
    <p>I vaguely remember reading that the  Case-Sensitive Forms feature should not use GPOS but instead use GSUB, with fonts including additional glyphs to support the feature.</p>
    <p>Can anyone confirm if this is true and if so point to a source reference?</p>
    <p>thanks.</p>
