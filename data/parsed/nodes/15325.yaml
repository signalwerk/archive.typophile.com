      <p>My own experience tells me such books are hard to find.</p>
      <p>The book John mentioned is a great resource of the Armenian manuscript hands. Here's a preview:<br>
      <a href="http://armenianstudies.csufresno.edu/books_for_sale/album_of_armenian_paleography.htm" title="http://armenianstudies.csufresno.edu/books_for_sale/album_of_armenian_paleography.htm">http://armenianstudies.csufresno.edu/books_for_sale/album_of_armenian_pa...</a></p>
      <p>I found one in the British Library<br>
      Gortsakalyan, Hayk. "Haykakan taratesakner". Yerevan: Academy of Sciences of Soviet Armenia, 1973</p>
      <p>and another two in the Armenian Institute in London<br>
      Mnatsakanyan, Henrik. "Armenian typefaces". Yerevan: Ayastan, 1979<br>
      Afrikyan (or Africkian), Fred. "The art of letter-type; 120 tables of Armenian decorative types". Yerevan: Sovetakan Grogh Publishers, 1984</p>
      <p>The last one is more about calligraphy and display types than typography.</p>
      <p>Hope this helps.<br>
      Contact me directly if you need more details: miguelsousa (at) go (dot) online (dot) pt</p>
