      <p>I'm not aware of any books in English on Armenian typography per se, and have not seen any books that treat the script in terms of typesetting rules or as a style manual. There is a quite good book in French, <em>Le livre arménien à travers les âges,</em> which shows good examples of traditional Armenian typography, and I have a volume in Italian on Armenian printing at the monastery of San Lazzaro in Venice.</p>
      <p>The best book by far on the Armenian script is <em><a href="http://www.amazon.co.uk/exec/obidos/ASIN/8772885564" rel="nofollow">Album of Armenian paleography</a>,</em> but this deals with handwriting and formal manuscripts, not typography.</p>
      <p>Carolyn Puzzovio presented an overview of the history of the Armenian script, including some recent type designs, at the ATypI conference in Helsinki last week. She may know of books dealing with Armenian typographic practice, if they exist, and will be in Yerevan next month. I can put you in touch if you send me an e-mail: tiro[at]tiro.com</p>
