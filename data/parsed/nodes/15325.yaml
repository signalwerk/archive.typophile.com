      <p>Levon, I haven't yet found a book specifically dealing with Armenian typographic guidelines - although I suspect there is one, maybe done either a long time ago (think the Mekhitarians) or maybe quite recently (Soviet times). What can be useful though are books about grammar, or language in general. I do have one book (actually in photocopy form) which has been more useful than most, since it deals with how each letter/character is used: "Oughagrakan Bararan Hayeren Lezvi" (Orthographic Dictionary of Armenian Language) by Artashes Abeghian, 1947. It also contains a list of 15,000 Armenian root words (useful for building a spelling checker, I mean a good one, not like the ones we currently have, something my brother was attempting a while back).</p>
      <p>Some other useful books (like one detailing the differences between Eastern and Western Armenian, a critical thing to be aware of) I acquired from the famed "Vernissage" flea market in Yerevan in 2000; there I found many specimen books (like the ones Miguel mentions) for like $3 each, as well as linguistic books (like letter frequencies, etc.). If you've never been there, go as soon as you can. And the rest of the country is even more amazing! I've been dying to go back, and I probably will next Summer.</p>
      <p>"Album of Armenian paleography" is staggeringly good. I found out about it thanks to John, and will undoubtedly buy it one day. For now I've made one long trip to the UCLA library with a digital camera, and a tripod. :-) And although it's true that it deals with manuscripts, it's extremely useful in terms of: rediscovering old ideas of how to make letters, especially tricky ones like the "ho"; and when you make a funny shape and some people complain, these are exactly the type of people you can shut up by showing that it's been done before.  :-)</p>
      <p>&gt; maybe has writen a book or an article about it?</p>
      <p>Book? No way. :-/ Article? Well, I've given talks about "Latinization", including an emphasis on Armenian, in Rome and Thessaloniki; and through this topic I've delved into how a non-Latin script <cite>should</cite> use the Cartesian area (e.g. NOT like Latin), ending up with an article that's been published in Spatium magazine (#4) and will shortly appear in the Greek "Hyphen" publication as well. It's called "Latinization: prevention and cure" and one thing it shows it the ergonomy?, topology?, of the Armenian script and how to make it most... comfortable. So it's not exactly what you're looking for, but sort of a wider/deeper look at the entire structure of what I feel the Armenian scripts <cite>needs</cite> to be.</p>
      <p>BTW:<br>
      1) John, please do put me in touch with Puzzovio!<br>
      2) A big welcome to Tigran.</p>
      <p>hhp</p>
