      <p>Hey Dav,</p>
      <p>Thanks for the response. The original concept was using the overlap of the letters to represent the networking of companies. The lines/flourish off the V is a refreshed device that has been used over the past 3 years. The typeface is a custom version of Wyld. Obviously going for the cutting edge technology look. The mix of colour’s is to show the diversity of business present at the event. The fact you could read it is the most important thing!! Thanks again for the comments.</p>
      <p>Ben</p>
