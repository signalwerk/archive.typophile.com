      <p>This sure seems more of an illustration than a ’simple’ logo. And if it should spell out ’VentureFest’ I guess it still is legible. ;) <em>(Not too keen on the typeface, but that may be some personal preference.)</em> It’s also ’quite’ colorful and ’playful’ for what it’s for, but maybe that was/is intended.</p>
