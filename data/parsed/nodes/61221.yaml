      <p>A very informative and useful historical insight, as always - thank you James.</p>
      <p>"Maybe there is now room for a ‘Bell’ that follows the variations in design and proportion of some of the different sizes of the original type." </p>
      <p>And a better digital rendition for what Stanley Morison described as "the greatest development in 'finish' since Aldus" would be much appreciated. Bell's current digital version - nor Monotype's, neither Urw's - doesn't look satisfying; it's too weak on screen and paper. I believe that someone should give Bell the same re-design treatment that Matthew Carter did on "Miller" - with an eye to its rounded and delicate terminations and serifs, which, at least to me, makes it a bit different from the "heavy" shapes of the so called Modern - Scotch types; a type more in the tradition of the French Eighteen founders à la Fournier/Vafflard.</p>
      <p>An effort based on the display size was recently made by Paul Barnes/Christian Schwartz; but it doesn't seem to be available:</p>
      <p><a href="http://www.christianschwartz.com/austin.shtml">http://www.christianschwartz.com/austin.shtml</a></p>
      <p>(By the way, James, I'll be in Parma in October in your seminar about type).</p>
