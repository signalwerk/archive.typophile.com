      <p>Thanks James, that's what I suspected.<br>
      It seems to me that there are three ways in which a metal type can change from size to size.<br>
      This is an illustration of Akzidenz Grotesk, from a 1954 specimen, with 20 pt (left) and 24 pt (right) scaled to the same cap height.</p>
      <p><img src="/sites/default/files/old-images/Mers_4626.jpg"></p>
      <p>1. Letter structure: the angle of the "e" terminal is markedly different.<br>
      2. Global proportion: the x-height is different.<br>
      3. Vagary (unintentional inconsistency): the 24 pt "s" is too bold (not just an odd heavy impression, this occurs throughout the specimen). </p>
      <p>It may well be impossible to decide whether certain inconsistencies between sizes are unintentional/mistakes, or not--perhaps things just turn out differently.</p>
      <p>(Apologies for deviating from Bell, but this is from a scan I happened to have at hand.)</p>
