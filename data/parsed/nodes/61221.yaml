    <p>Hi there, comparing the two digital versions of Bell - the first taken from Monotype revival and currently available via Adobe/Linoptype/Monotype etc., the latter from the URW library - it stroke me how many differences there are. URW version seems much more gentler and delicate than Monotype's. And the lowercase A seems a completely different letter - I love URW's version, by the way. It would be interesting to know on which historical sources those versions were based.</p>
    <p><img src="/sites/default/files/old-images/bell_a_4152.jpg"></p>
    <img typeof="foaf:Image" class="img-responsive" src="http://www.typophile.com/sites/default/files/old-images/bell.jpg" width="1736" height="440" alt="">
