    <p>I'm looking at two different fonts:</p>
    <p><a href="http://www.myfonts.com/fonts/itc/bauhaus/" title="http://www.myfonts.com/fonts/itc/bauhaus/">http://www.myfonts.com/fonts/itc/bauhaus/</a><br>
    <a href="http://www.myfonts.com/fonts/itc/ronda/" title="http://www.myfonts.com/fonts/itc/ronda/">http://www.myfonts.com/fonts/itc/ronda/</a></p>
    <p>Both seem to have different versions: for example, ITC Bauhaus vs. ITC Bauhaus Std, or ITC Ronda Std, ITC Ronda Pro, or ITC Ronda Com. Even within ITC Bauhaus, there is one published by Adobe and another by Linotype. I'm not particularly sure what all of these mean, and I'd appreciate it one would address such differences!</p>
  html_clean: |-
    <p>I'm looking at two different fonts:</p>
    <p><a href="http://www.myfonts.com/fonts/itc/bauhaus/" title="http://www.myfonts.com/fonts/itc/bauhaus/" class="link-external">http://www.myfonts.com/fonts/itc/bauhaus/</a><br>
    <a href="http://www.myfonts.com/fonts/itc/ronda/" title="http://www.myfonts.com/fonts/itc/ronda/" class="link-external">http://www.myfonts.com/fonts/itc/ronda/</a></p>
    <p>Both seem to have different versions: for example, ITC Bauhaus vs. ITC Bauhaus Std, or ITC Ronda Std, ITC Ronda Pro, or ITC Ronda Com. Even within ITC Bauhaus, there is one published by Adobe and another by Linotype. I'm not particularly sure what all of these mean, and I'd appreciate it one would address such differences!</p>
