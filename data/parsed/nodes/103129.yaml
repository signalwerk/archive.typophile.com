    html: |-
      <p>When ITC was a separate company, they licensed their trademarked font names and provided analog artwork to many different companies. Each one remaining into the modern era produced a slightly different digital version and new companies, like Adobe, added their own digital versions of these as well. </p>
      <p>Addressing the individual differences would take a few whiles, but in general, the core set of glyphs should match from vendor to vendor except perhaps for the scaling to the font to the em. And, glyphs like Euro, which were added after the original artwork was distributed, may not be consistent.</p>
