    html: "<p>The differences between Std, Pro and Com are usually in language support. Sometimes Pro fonts also incluse advances typographic features like smallcaps, alternates, swashes, etc. Check the glyphs tab in MyFonts to see the amount of glyphs. You also can see what features and character set each font as when you check tech specs, which can be found by clicking on one font: you then get a waterfall preview, with for tabs above it.</p>"
