      <blockquote><p>Is it possible the Adobe version has a more lenient EULA (like concerning embedding, modification, etc.)?</p></blockquote>
      <p>Looking through <a class="freelinking external" href="http://www.adobe.com/products/type/font-licensing/additional-license-rights.html" rel="nofollow">the list of additional license rights for Adobe fonts</a>, the ITC fonts are all listed as, "1 : Licensed for print and preview embedding" in a list of criteria that also includes:</p>
      <p>2 : Licensed for editable embedding<br>
      3 : Licensed for modification<br>
      4 : Licensed for users who directly license DPS<br>
      5 : Licensed open-source fonts</p>
