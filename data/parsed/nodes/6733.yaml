    html: <p><i>Argh that is too bad, I can't find it either? Does this mean I'd have to find somewhere where I can use letterpress for this?</i> <br> <br>Well, It was originally a metal face, but I always remember seeing Orplid in rubdown/cutout lettering catalogs in the seventies. It was also available in phototype for headlines. It was pretty common in type catalogs so I gotta think somebody's digitized it by now but possibly given it a different name.</p>
