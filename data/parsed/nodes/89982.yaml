      <p>I'm less upset at missing out on admission*<br>
      than I'm disappointed at AIGA's missing out<br>
      on promotion. Hmmm, or maybe they only had<br>
      room for their own people and didn't want non-<br>
      members showing up... On the other hand if<br>
      admission isn't free then they could've found<br>
      a bigger place and made more money. Maybe<br>
      they have a running deal with Custom Hotel;<br>
      Otis <em>did</em> once facilitate a brainstorming session<br>
      for TypeCon-LA there. Many factors, certainly;<br>
      but the net result is still sad.</p>
      <p>* I have no shortage of things<br>
      to do... plus this sort of event is<br>
      rarely hard to crash anyway.  :-)</p>
      <p>hhp</p>
