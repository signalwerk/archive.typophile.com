      <p>Thank you all for your replies.</p>
      <p>You have brought up in discussion some intresting arguments .</p>
      <p>@ James: The client is an italian commis chef wants to communicate a stylish feeling to his image, as his cooking target is of high-class. He prepares stylish dishes and as a consequence w both agreed on a signature style logo, but didn't want to create a real signature. We wanted to convey only the essence of a signature style logo, that's the reason why some of the elements that you pointed out are the way they are. He said that the end work really reflects what he wanted to convey. </p>
      <p>@hrant: I think I haven't expressed myself well enough. You are right, I wouldn't make a logo only for a CV, but at the moment the client don't want to invest in the creation of other branding/advertising services (website,business cards etc ... ), but the logo IS intended to work perfectly across ANY other communication project , both on print and on the web, and this is something I take in consideration with EVERY logo I design. This is the first step to build a more vast brand in a future occasion .</p>
      <p>@Ratbaggy: Thank for your opinion, but exactly what do you mean by that ? What are the elements that in your opinion are generic and how would you improve it ? </p>
      <p>Again, every feed is welcomed !</p>
