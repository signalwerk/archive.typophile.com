    <p>Hi,</p>
    <p>I am creating a logo for an italian chef. The logo will be used in his CV and eventually in other brand identity projects.</p>
    <p>The logo was developed on the basic foundation of a Bickham script, but adjusted and customized to meet the objectives of the client. It had been scaled down to a lighter overall solution, and particular focus had been given to make the edges and letter terminals more sharp than the original version in order to make it more modern looking. What do you think of it and how do you think it could be improved ?</p>
    <p><a href="http://postimage.org/image/dq7rpo2ox/" title="http://postimage.org/image/dq7rpo2ox/">http://postimage.org/image/dq7rpo2ox/</a></p>
    <p>Thank you for your attention</p>
