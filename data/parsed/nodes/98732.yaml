      <p>Can't evaluate it as a logo without knowing more about the chef, his personality and style, and what qualities  you're trying to communicate with it.</p>
      <p>But one general thought is that it looks like a signature, but yet is clearly just typeset since it's so perfect and the letters that repeat (a, t) are identical each time. Perhaps more of a signature look would make it more personal and unique.</p>
