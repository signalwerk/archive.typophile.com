    <p>I'm trying to find out what a couple of fonts are... I've got some close, but not dead-on.</p>
    <p>First, looks alot like Adobe Birch, but isn't... so many "western" display faces I can't keep track:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/wick3_6231.jpg"></div><p></p>
    <p>Second, the main font from the "Wicked" poster - I think it's hand done, but looks a lot like a simpler Ravenscroft.</p>
    <p>I'm pretty sure the smaller font is Oxford, thought it's a little klunky here.</p>
    <p>Thanks.</p>
