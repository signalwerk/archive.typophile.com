      <p>Good for you, Tom.</p>
      <p>My questions are not about the type itself (which appears to be a pretty reasonable response to the brief, the other respondent's comments notwithstanding), but</p>
      <p>1. What does the lettering look like in positive (black on white background) – is it strong enough to stand on it's own as a device?<br>
      Because<br>
      2. Why is the proportion of that enclosing leaf shape so large? If you take that backgound shape away, or make it radically smaller, what happens then?</p>
      <p>Good luck with it.</p>
