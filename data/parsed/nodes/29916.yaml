    html: |-
      <p>The font Verve (<a href="http://www.myfonts.com/fonts/sooy/verve/" title="http://www.myfonts.com/fonts/sooy/verve/">http://www.myfonts.com/fonts/sooy/verve/</a>) looks similar to what you have chosen, except it is more consistently thick. You could use Verve and change the dot in the "i" to be like the dot in the other.</p>
      <p>Your logo will not work at small sizes because The type is sized so small in the shape that when the shape is made small the type will be MUCH smaller. The large shape doesn't do anything for me. If you use it make it smaller and strategically placed.</p>
