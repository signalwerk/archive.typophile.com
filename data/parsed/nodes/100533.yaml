      <p>I consider the Modern (Didone, e.g. Bodoni, Didot), the Scotch (Roman), and the Scotch Modern to be quite distinct categories. </p>
      <p>However, although I have presented the idea of the Scotch Modern as a separate category, it hasn’t caught on. Perhaps it’s not a good idea, or perhaps I haven’t promoted it well enough. Or perhaps people think it’s just a marketing gimmick.</p>
      <p>Therefore I am reluctant to edit the wiki on Scotch Roman, or even to start a fresh wiki page for Scotch Modern.</p><div class="imageWrap"><img src="http://typophile.com/files/Scotches_5400.png"></div><p></p>
