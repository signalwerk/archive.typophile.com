      <p>Here's what I'm thinking of replacing the second and third sentences of the first paragraph on Wikipedia with:</p>
      <blockquote><p>
      These typefaces were modeled on a nineteenth-century design from the Edinburgh foundry of William Miller: his "Pica Roman No. 2".  Some accounts suggest that Miller's type, the oldest surviving specimen of which dates to 1813, was cut by Richard Austin.  </p>
      <p>The name "Scotch Roman", which entered use in the United States late in the same century, was applied to a slightly modified recasting of Miller's type by the A.D. Farmer foundry of New York.  It is believed to derive from "Scotch-face", a term which was originally used by a different type designed in 1839 by typefounder Samuel Nelson Dickinson of Boston, and cast for him by Alexander Wilson and Son in Glasgow.
      </p></blockquote>
      <p>All under the citation to Mosley's essay.  I'll leave the remainder unchanged, at least for now.</p>
