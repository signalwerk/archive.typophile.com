      <p>So I see the Scotch Roman as transitional, leading from the Didone to the Scotch Modern, even though transitionals are considered, chronologically, to be Baskervillian, leading from Garalde to Didone.</p>
      <p>Two meanings for Transitional, whether Phylogentic (evolutionary/historical) or Taxonomic (physical features).</p>
      <p>Accordingly, a 20th century transitional such as Dwiggins’ Caledonia (with its clever “Scottish” name), not being a revival or pointedly weighted to either the Baskervillian or ScoMo historical era, might be considered post-modern.</p>
