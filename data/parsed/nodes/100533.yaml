    <p>I was looking at the Wikipedia entry on <a href="http://en.wikipedia.org/wiki/Bell_%28typeface%29" rel="nofollow">Bell</a> and some of what it says seems a bit weird.  First of all, it describes it as "the first Scotch Roman face".  Does that seem right?  I thought Scotch Roman specifically referred to descendents of Miller's mid-nineteenth-century Pica Roman No. 2 and close facsimiles.  Bell is a late-eighteenth-century transitional with many features in common with Scotch, but I wouldn't personally classify it as one. </p>
    <p>I know Richard Austin is often credited with designing the Miller face (although as far as I can tell this is entirely based on T.C Hansard, who made the claim with little or no substantiation).  I wonder if whoever wrote this part of the Wikipedia article was confusing this latter type with Austin's much earlier Bell type.</p>
    <p>(It also lists one of Bell's characteristics as "square dot over the letter i"... ???)</p>
    <p>That brings me to the article on <a href="http://en.wikipedia.org/wiki/Scotch_Roman" rel="nofollow">Scotch Roman</a> itself.  Um.  It actually barely says anything (a travesty on its own), and what it does say seems quite inaccurate:</p>
    <blockquote><p>These typefaces were modeled on an original 1839 design by Samuel Nelson Dickinson, founder of the Dickinson Type Foundry in Boston, who had the design cut by Richard Austin, and cast by Alexander Wilson and Son in Glasgow, Scotland.</p></blockquote>
    <p>The quoted sentence cites <a href="http://typefoundry.blogspot.ca/2007/02/scotch-roman.html" rel="nofollow">this Typefoundry article</a> as a source.  Yet a careful reading of the latter actually contradicts it almost entirely:</p>
    <ul>
    <li>The 1939 Dickinson design, which is nowhere said to have been cut by Austin, is only the origin of the "Scotch face" name, but is <em>not</em> the model for the Scotch Roman typefaces themselves.
    </li><li>The actual model, Miller Pica Roman No.2, is the one claimed by Hansard to have been cut by Austin, but the article specifically casts doubt on that claim.
    </li></ul>
    <p>I get the distinct impression that the Wikipedia article author just hastily skimmed the source article without properly understanding what it said.</p>
    <p>I'm hardly an expert on these matters, so I'm reluctant to simply start editing the Wikipedia articles myself... not at least without getting some informed opinions.  Can anyone comment?</p>
