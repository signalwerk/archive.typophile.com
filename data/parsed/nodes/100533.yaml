      <p>@altsan... great that you are taking this one on... I am curious, though, about the following:</p>
      <p>1. Even though the term "Scotch Roman" generally refers back to Farmer/Wilson's "Scotch-face", we novices tend, and perhaps the evolution(s) of Scotch Roman seems to flow more from the Miller designs than the Farmer/Wilson designs. Is this a fair observation?</p>
      <p>2. Even the Miller designs are fluid. His earlier designs maintains the chiseled lowercase "t"... where his later designs (and most Scotch Romans since) adopted the flattop "t" (using just one example).</p>
      <p>3. Simply from a historical sense, I get the feeling that Scotch Romans were truly a "transitional" typeface... attempting to blend the artistry and readability of the Baskervilles/Bells, etc., with leanings toward the "business-mercantilism" feel that America was experiencing in the late 18th and early 19th centuries. "Scotch-face" seems a bit more business-like than Pica No. 2 ?</p>
      <p>4. The revivals of the Scotch Romans seem to take a multitude of paths emanating from both Wilson and Miller's visions... besides Carter's Miller, Escrow, Whittingham, FF Clifford (?), Georgia, Nick's Scotch Modern (which leans a bit toward the didones ?... sorry Nick if I misstate this)... what others fit into this genre, and from what are their designs derived. I've always been confused how to "mentally" interpret a specific typeface design when the inspirations are multiple and diverse. </p>
      <p>Wasn't sure whether any of this was relevant to your possible editing of the wiki entry...</p>
