      <p>Seems very Carl Ally, Madison Avenue c.1970.<br>
      But he would have driven the association home a lot harder.<br>
      Flip the Rs, sub A by De (à la Borat).<br>
      By now, parodies of bureaucracy have been well worked, consider Font Bureau, for instance.<br>
      LOST looks like LOLCATS vs TV serial.</p>
      <p>As with type styles, how does one differentiate capitalist bureacracy from socialist?</p>
      <p>Pull out all stops, implement constructivist layout technique, comrade: use reversals, solids, knockouts, emphasize surface plane of layout.<br>
      At very least, no-curves Rodchenko-Stepanova lettering would be better.<br>
      Or use Industria Inline, that would be a cool irony.</p>
