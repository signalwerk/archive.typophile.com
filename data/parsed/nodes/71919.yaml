      <p>The no-curves interpretation of Rodchenko's lettering is OK, as it's a style that he certainly employed.</p>
      <p>However, I find another style of Constructivist lettering, employed by him, Stepanova, &amp;c., more interesting.<br>
      It's where some of the letters are all sharp angles, and others have slightly curved corners.<br>
      In the bottom line of this poster, for instance, "O" is a rectangle, but "C" has the arris smoothed. Why is that?<br><img src="/sites/default/files/old-images/rodchenko_6049.jpg"></p>
      <p>***</p>
      <p>I don't understand how a good capitalist face like Agency Gothic, designed by American Morris Benton in the 1930s, can represent the Soviet era. </p>
      <p>What is the distinguishing feature that separates capitalist block poster lettering from that of the communists?</p>
