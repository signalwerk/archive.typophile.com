      <p>I realized later that you asked for a text typeface. </p>
      <p>There was a very limited amount of typefaces in Soviet Era.<br>
      Mostly Replicas of Univers where used in catalogues, magazines, soviet brochures.<br>
      Book were set in Academy(Cheltenham).</p>
      <p>This will give you a feel a soviet era text typeface:<br><a href="http://issuu.com/pokesh/docs/modul_s_setka">http://issuu.com/pokesh/docs/modul_s_setka</a></p>
      <p>Dobra is too humanistic, I would prefer Aaux.</p>
