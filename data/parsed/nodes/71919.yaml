      <p>Ah, thanks again for the thoughtful and thorough responses.</p>
      <p>@avanyashin: Yes, I am definitely still looking for the perfect BODY TEXT match. And ya, I think you are right. For now I'm going with Aaux. In general, I have found that readability rules out a lot of faces, so I'm not gonna force it. Aaux should work for now.</p>
      <p>@Nick: Nice example. I agree that there is not necessarily a literal connection between Agency and Communism. I guess I am trying to create a new association by virtue or my compositions (posters and spreads). This project is a satire of Communism, using a very loose stereotype of it (after all, communism is more of a theory than a practice). While I am looking to Soviet styles for inspiration, I wanted to create a look/feel that is not tied to a specific culture or time period. Agency is very square, geometric, with low contrast. To me, Agency can be presented as commanding and austere, which is the general vibe I am going for with the project. </p>
      <p>But, yes, I agree that cultural associations with fonts can be tricky. I am definitely trying to create the context for Agency within the pieces themselves, rather than relying on prior associations. We'll see if it works.</p>
      <p><img src="/sites/default/files/old-images/bike_01_bw_sm_5208.jpg"></p>
      <p>.</p>
