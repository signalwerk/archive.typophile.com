      <p>Thank you for the suggestions. While stylistically, the squarish and "soviet" style fonts would seem to be a good match, unfortunately, I feel they make terrible text fonts. I am leaning toward Dobra and Aaux, which fall somewhere in the middle between the overly round geometrics and the text-unfriendly squarish fonts.</p>
      <p>That said, at larger sizes, maybe for subheaders, some of these more square and soviet-style fonts might work.</p>
