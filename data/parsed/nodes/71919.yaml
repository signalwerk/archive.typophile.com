      <p>Very nice stuff. I don't know if I get the communist connection though, that's a little lost one me. I don't know how important it is for you to get this a across. If it is I would try to give it al a slightly more worn look, as these are meant for the 'masses'. They just might be too well composed. I think Agency is OK, whough another typeface might help to get the idea across. I was thinking of Quanta, which has the stencil look as well. Also have a look at Prop-A-Ganda fonts, especially Revolucion.</p>
      <p>As for text, how about FB Nobel, or perhaps Endurance Pro? (Endurance Pro family now dead cheap at fontmarketplace.com: only 35 bucks for the whole family!) There also is a condensed version.</p>
