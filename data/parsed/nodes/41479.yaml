    <p>Hi,</p>
    <p>It seems like a lot of designers are now using sans that aren't exactly 'geometrical' like Gotham, Helvetica etc. I recently purchased <a class="freelinking external" href="http://www.joshuadarden.com/shop/freightsans.php" rel="nofollow">Freight Sans</a>, but are curious to what else it out there. <a class="freelinking external" href="http://typography.com/fonts/font_overview.php?productLineID=100026" rel="nofollow">Whitney</a> is in the same style I guess and Stag Sans is great too. What is the official name of this style of sans font?</p>
    <p>The font I'm looking for would be similar to Freight sans (with or without two story g), but I would like something a bit cleaner if you know what I mean.</p>
    <p>I've included some images of various fonts. The new sans font from Wired magazine has already been discussed in here somewhere, but I'd still like to know more about it.</p>
    <p>Font from Wired Magazine</p>
    <p>Font from The Independent Magazine</p>
    <p>Font from Outside Magazine</p>
    <p>I know that the fonts in Wired and Outside are most likely custom fonts, so suggestions for similar fonts are very welcome.</p>
