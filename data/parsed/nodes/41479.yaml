      <p>I would describe Freight, Stag, and Whitney as somewhere between <a href="/wiki/humanist" class="freelinking" rel="nofollow">humanist</a> and <a href="/wiki/gothic" class="freelinking" rel="nofollow">gothic</a> or <a href="/wiki/grotesque" class="freelinking" rel="nofollow">grotesque</a>. Whitney, for example, is based on the structure of a gothic (Trade Gothic) but its finish gives it a more humanist air.</p>
      <p>Helvetica is commonly categorized as a "neo-grotesque".</p>
      <p>The "Outside" font is not Gotham, though the caps are very similar. It's most likely something custom from <a href="/wiki/Font%20Bureau" class="freelinking" rel="nofollow">Font Bureau</a>, who often works with publishers like these. As for their retail fonts, you might dig their Antenna or Amplitude.</p>
      <p>In the vein of Whitney are <a href="/wiki/Lucas%20de%20Groot" class="freelinking" rel="nofollow">Lucas de Groot</a>'s <a href="http://www.fontshop.com/fonts/downloads/lucasfonts/taz_iii/" rel="nofollow">Taz</a>, <a href="http://www.fontshop.com/fonts/downloads/lucasfonts/spiegel/" rel="nofollow">Spiegel</a> and <a href="http://www.fontshop.com/search/?q=Corpid" rel="nofollow">Corpid</a>.</p>
      <p>New faces in the neo-grotesque realm include <a href="http://www.fontshop.com/fonts/downloads/arstype/maquette/" rel="nofollow">Maquette</a>, <a href="http://www.fontshop.com/fonts/downloads/mark_simonson/proxima_nova_complete_ot/" rel="nofollow">Proxima Nova</a>, <a href="http://lineto.com/The+Fonts/Font+Categories/Text+Fonts/Akkurat/" rel="nofollow">Akkurat</a>, and <a href="http://www.fontshop.com/search/?q=Paralucent" rel="nofollow">Paralucent</a> (though this last one could be called a "neo-neo-grotesque" or "pseudo-neo-grot".</p>
      <p>If you're interested in typeface classifications I highly recommend getting a copy of <a href="/wiki/Robert%20Bringhurst" class="freelinking" rel="nofollow">Bringhurst</a>'s "Elements of Typographic Style".</p>
