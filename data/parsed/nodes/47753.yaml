    <p>I’ve been asked to essentially work backwards. </p>
    <p>One of our clients for whom we are doing some licensing jobs has a few OT fonts that they own. My company is putting together jobs (greeting cards) that use these fonts with their artwork. Since we are still using Freehand as our layout software we need to create a PS version of these.</p>
    <p>On my first attempt, I simply generated a PS suitcase from the OT font that I opened up in FontLab. That worked ok except my quotations would not come in. So this morning I opened the OT version again and started a brand new font file with a name variation as well. I copy and pasted the main characters, and used extra slots for some alternates and ligatures. I generated a PS version and started typing in Freehand. The quotes work, however, my cursor position is way far to the right of the character making it extremely difficult to edit text. In both Text Edit and Photoshop the cursor is in the correct position. </p>
    <p>BTW, this is on an Intel based Mac OSX 10.4.9.</p>
    <p>Any ideas?</p>
    <p>Stephen</p>
