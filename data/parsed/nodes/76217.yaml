    html: |-
      <p>I did a quick test (using InDesign CS4) and found that if the bullets were made with a style sheet or using the bullet button on the control panel, then the bullets do indeed disappear when the type is outlined. Weird.</p>
      <p>However if the bullets were made manually by typing option-8, they convert to outlines just fine. </p>
      <p>So if you can't find another workaround, you might just make each bullet as the option-8 character, then tab over for the indent and insert the "indent to here" invisible character (command-backslash, or use Type &gt;  Insert Special Characters &gt; Other &gt; Indent To Here) so the text aligns at the tab.</p>
      <p>You also might want to assign a character style sheet to the bullets so you can more easily modify their appearance.</p>
      <p>To save time you can just type that series of characters once and then copy it to clipboard, and then just paste the 3 characters (bullet, tab, and indent-to-here character) as a unit in front of paragraphs that need bullets, and that will make it go faster.</p>
