      <p>Hallo Gerhard,</p>
      <p>Yes, this is a strange behaviour of InDesign. Illustrator does convert the underlining into a path. You can also just copy the InDesign textbox into Illustrator and convert it into paths there and reimport the whole thing into InDesign.<br>
      And the bullet as inherent in the font itself is being converted into paths by InDesign either way.</p>
