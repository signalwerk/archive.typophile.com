      <p>Hi Gerhard,</p>
      <p>do not use InDesign’s ‘Convert to outlines’ command. As reported, you will lose text properties like bullets, paragraph lines etc.<br>
      A much better method is to use a ‘Transparency Flattener Preset’, and convert to outlines on exporting the PDF.</p>
      <p>You will find the details in <a href="http://www.hilfdirselbst.ch/foren/Text_in_Pfade_umwandeln_P315348.html" rel="nofollow">this thread</a> at the Hilf Dir Selbst forum (or in this <a href="http://www.sachaheck.net/mediengestalter/downloads/ID_Text2Outline.pdf" rel="nofollow">PDF by Sascha Heck</a> (both German language). See also <a href="http://www.hilfdirselbst.ch/foren/gforum.cgi?do=post_view_flat;post=442934;page=2;sb=post_latest_reply;so=ASC;mh=15;" rel="nofollow">these comments</a> for potential bugs in CS5. A step-by-step tutorial in English can be found at <a href="http://indesignsecrets.com/converting-text-to-outlines-the-right-way.php" rel="nofollow">indesignsecrets.com</a>.</p>
      <p>Florian</p>
