    <p>hi,</p>
    <p>i sent a pdf created from an indesign file with embedded fonts to a printer and he sent back a screenshot that shows that text in some fonts were completely altered and illegible (see image before/after). as we could not find the cause of the problem (thankful for hints), the printer asked me to change the texts to vektors. this way we could avoid the letterscramble but some other problems occured:</p>
    <p>1. i texts formated with bulletpoints the bulletpoints vanished<br>
    2. i had created paragraph formats and letter formats using the underline function to create a coloured background for emphasised text. the coloured background (i.e. the underlining) vanished and left white text on white background...</p>
    <p>as more and more printers (especially online printshops) ask to change texts to vectors in order to garantee quality - has anybody suggestions on how to change my formats in indesign so i won't loose bullets and texts when changing to vectors?</p>
    <p>thanks<br>
    gerhard donauer<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/fontproblem_comparison_6605.jpg"></div><p></p>
