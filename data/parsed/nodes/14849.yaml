      <p>I’m still not sure what the actual question is.</p>
      <p><em>you have the actual dpi</em></p>
      <p>PPI. DPI is a print measurement, PPI is the density of pixels in a display…what you are actually measuring.</p>
      <p><em>THEN, you need to know the dpi being used by the OS</em></p>
      <p>The OS doesn’t use a DPI. It just cares about the number of pixels. A browser will use an arbitrary DPI conversion, though, for renderin type spec’d in a print measurement. These days, that’s typically 96PPI on both Macs and PCs.</p>
