    html: "<p>I guess the question is: How to reconstruct the styles and sizes used from a page of bits? First, you can answer the question, how tall is the EM either by typing an H and a return and an H with 0 leading, or count pixels from baseline to baseline any way you can. If you are working on the Mac, (72 dpi), your pixel count is the same as your point size, (or close enough). If not, your formula is: Pixels per Em = resolution/72 X points and you can rearrange it several ways depending on the variable you’re seeking…but because Nearly all fonts on all Windows driven screens are fractional point sizes, type is only approximately a point size there.</p>"
