    html: |-
      <p>” (72dpi is a bit of a myth by the way)”<br>
      Yes. All screen resolution, and point size(s) there put, is/are a bit of a myth, but there are always ways of turning the mythical sizes into a number of actual pixels, and, unless there is a .5000000 remainder no longer in evidence, actual pixels can be turned into mythical points, through the mythical resolution, be it Mac or WinTel.</p>
      <p>If you want to blow away the myths, you *just* need to measure, with a ruler, the actual area occupied by a screen’s full capacity, then use the “Displays” control panel or its kin, to get the pixels displayed across and down, e.g. 1600 x 1024, dividing that into the measure you just made and you have the actual dpi. THEN, you need to know the dpi being used by the OS, and the number of points the OS thinks there is in an inch, and then you can figure out, depending on whether you’re looking for pixels or points, what’s what, including, if you can, specifying a fractional point size that wil get you an ACTUAL, e.g. 12 pt.</p>
      <p>The part(s) that cause(s) the mythic shroud is that the OS does not know the actual size of the screen(s)’s writable area(s), and the device manufacturers lie about resolution. This issue was almost solvable at Apple until another choice was made, and MS, (where the myth of point size is additionally murked by a resolution guaranteed to leave remainders, and as unruly a herd of device makers as is possible), was lobbied to improve this in Longhorn coming, but they only got to 1/2 of it. </p>
      <p>The results of this are a sad lack of truth to the terms “actual size” and “100%”, not to mention, 10 point, but ‘eh’, you can’t have it all…</p>
