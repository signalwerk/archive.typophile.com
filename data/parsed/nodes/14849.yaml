    html: |-
      <p>If it is a web page, view the page as code (source).  If you are lucky and they have inline formatting, you might see a size but it will not relate to points very well.  If they use a style sheet as they should, it may not even be available to you.<br>
      The big wiz is that browsers, monitors, video cards,  and system configurations vary all over the place.  Typographic point size is meaningless on the web. The best you can do is count pixels and that only works for one set-up.  Set your monitor to a higher rez and it is out the window.  This is why controlling typography on web sites is such a royal pain to attempt.</p>
      <p>ChrisL</p>
