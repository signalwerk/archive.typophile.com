      <p>Quark is the only graphics application I know in which you can tell the app what your actual screen resolution is to get real 100% views (any others?). Should be more common - Acrobat particularly should have this. I know a few browsers, like Firefox, allow you to switch between the 72dpi Mac and 96dpi Windows standards. (I guess strictly rather than dpi the measure is pixels per nominal text inch)</p>
      <p>It will be much more of an issue when display resolution increases significantly.</p>
      <p>When I said 72dpi was a myth I had in mind 2 issues:</p>
      <p>(1) it’s too often used when it really isn’t relevant, for example the old chestnut of scanning an image at 72dpi because it’s for on screen use</p>
      <p>(2) all the displays I’ve used in the last few years have been closer to 90dpi anyway.</p>
