    html: |-
      <p>The question, and answers so far, seem to ignore the fact that web text generally isn’t, and shouldn’t be, specified in points, which are a “real world” physical measure.</p>
      <p>The actual size of text you see is affected by your own display resolution (72dpi is a bit of a myth by the way) and your browser view settings.</p>
      <p>If you need to specify web text size absolutely, rather than relative to the user’s base size (em), you’re better off doing it in pixels (px).</p>
    html_clean: |-
