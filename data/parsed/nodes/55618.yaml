  html: |-
    <p>Something pretty cool, FontShaker (3d font discovery tool) now feed design news directly into their UI and the twist is they allow the stories to be viewed using any font installed on your machine, or any of the fonts in their commercial database. </p>
    <p>Simply click a font card, zoom in, then click “live view” you will see what I mean (link located on the right corner of the card). The only downside is they don’t have Typophile's feed in there (yet) ;)</p>
    <p><a href="http://www.typedna.com/fontshaker" title="http://www.typedna.com/fontshaker">http://www.typedna.com/fontshaker</a></p>
