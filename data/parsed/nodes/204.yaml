    html: '<p>Not quite. It was a collective of designers that used to inhabit http://www.swanky.org. Twisted Type (another one you may have heard of) was a member found at <a href="http://tt.swankarmy.net" target="_blank">http://tt.swankarmy.net</a> and <a href="http://www.swankarmy.net/twisted" target="_blank">www.swankarmy.net/twisted</a>. <br> <br>The last known address I have for Squirt Gun is: <br><a href="http://start.at/squirtgun" target="_blank">http://start.at/squirtgun</a> <br> <br>The site seems to all be there but none of the font files are available.</p>'
