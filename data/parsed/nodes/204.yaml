  html: <p>Somwhere back in the late 90's while I was typesetting at a small print shop I happened across Squirt Gun Fonts. They produced Crass (a stencil looking font) and Rez. These ring any bells? They were part of the Swank Army? <br> <br>Anyone know what happened and/or where I might find the Squirt Gun font library now?</p>
