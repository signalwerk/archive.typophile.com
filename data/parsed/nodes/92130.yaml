    html: |-
      <p>The sequence you show involves two dependent vowel signs being applied to a single letter. In normal Bangla text, surely this is considered invalid, as only one dependent vowel sign can be applied per letter. So what you probably see, at least in Windows applications, is a dotted ring between the two vowel signs. This is inserted by the script shaping engine in Uniscribe, and is independent of the font lookup tables.</p>
      <p>It is possible to trick the shaping engine into hiding the dotted circle, but this generally isn't advised unless you really, really need to do something contrary to normal Bangla layout. If you have evidence of more than one vowel sign being applied to a single letter, then you should contact Microsoft and present it to them so that they can change the shaping engine.</p>
