      <p>I am entirely in agreement with you that the shaping engine should not prevent unorthodox character sequences. I have argued with folk at Microsoft for years that this is, in effect, spellchecking, and belongs at the language level in applications not at the script level in shaping engines. I think most of them are now in agreement, but getting longstanding behaviour of a core .dll changed seems difficult for them.</p>
      <p>This is how you can trick the shaping engine. Note that the dotted circle (Unicode 25CC) is inserted in a buffered character state, before OTL glyph processing. So what you can do is use GSUB ligation to remove the dotted circle <em>glyph</em> from the string. You can either do this globally for the font, or you can do it contextually, targeting only the specific sequences in which you wish it to disappear. So, for example, you could specifically target the double-aa situation you illustrate with a VOLT lookup like this (I've used the naming I employ in my own Bengali fonts):</p>
      <p><code>uni25CC bSignAa -&gt; bSignAa</code><br>
      in context<br>
      <code>bSignAa |</code></p>
      <p>i.e. changed dotted circle + aa to just aa when preceded by aa.</p>
      <p>____</p>
      <p>By the way, the Bangla font you show looks a lot like the classic Linotype Bengali. I know there are a lot of versions of this design now in use in India and Bangladesh, as well as in immigrant communities elsewhere. Which version is this?</p>
