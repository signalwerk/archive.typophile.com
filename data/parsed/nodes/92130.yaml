    user_name: John Hudson
    user_path: null
    user_image: /files/pictures/picture-1262.gif
    date_raw: 2 Jan 2013 — 4:32pm
    date: 2013-01-02T16:32:00
    votes: null
    html: |-
      <p>There are a couple of ways in which this can be done. First, it is important to note that normal character input order for this should be Consonant + Vowel + Candrabindu, i.e. the candrabindu should be typed after the vowel, not before it.</p>
      <p>One method is simply to use an 'abvm' feature GPOS mark positioning anchor attachment to position the candrabindu mark where you want it on the vowel sign. If you want to adjust the size or weight of the candrabindi in this situation, you can do this GPOS operation after first applying a contextual GSUB substitution to replace the normal candrabindu glyph with a variant form.</p>
      <p>The other method is to build a precomposed ligature of the vowel sign + candrabindu, and use an 'abvs' feature GSUB ligature subsitution to form this from the vowel sign + mark sequence.</p>
