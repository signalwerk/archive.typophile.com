      <p>Thanks so much for your detailed critique; I really appreciate the time you spent to construct such a detailed, insightful comment. I'll keep working!<br>
      I'm trying to follow a system, maybe too rigidly, whereby all the letters are the same height and width–with a couple of exceptions, namely W, M, and X. It makes it tough to build some of the lowercase letters, especially v (I hate V). O's and 0 are tough too.</p>
