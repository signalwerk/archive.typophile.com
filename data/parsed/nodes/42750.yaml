      <p>I like the overall feel of this, but it seems very scattered.  It needs more consistency, in stroke weight and pattern. </p>
      <p>Lowercase c, x and y look more uppercase than uppercase C, X and Y.  Lowercase r looks like uppercase Gamma. I think the descenders g, p, q, j and y, should actually descend.  Uppercase O is boring; lowercase o is too stylized compared to the other letters. Lowercase t looks more like it's an uppercase T, and more like 7 than the actual 7 does. I think 0 (zero) should use the O shape, with the same center ring and dot as the zero.  I like the numbers, except 7 and 0. Uppercase N looks too plain. </p>
      <p>I like the f, q, P, R. </p>
      <p>Try writing natural, mixed-case text with this and see how it looks. That should lead you to fix the consistency.</p>
      <p>-matt</p>
