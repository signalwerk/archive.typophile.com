  html: <p>Think ahead - This may sound very simple, but one of the biggest mistakes made ??during your goal to lose weight is to not think about the consequences of your decisions and actions. In this case, I mean decisions in the area of ??food. For example, we often make hasty choices and we do not consider our health and weight. Thus, the step to a quick and greasy bite often made quickly, instead of opting for a healthy meal. <a href="http://weightlossjourney.com" title="http://weightlossjourney.com">http://weightlossjourney.com</a></p>
