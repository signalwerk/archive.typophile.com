      <p>That’s a very polite way of telling me I’m talking rubbish. :-)</p>
      <p>Maybe I should change the question.</p>
      <p>I wonder if one could create (=bring together) a set of characters (types) which, by means of rotation and reflection, cover the whole alfabet.</p>
      <p>Let’s say: e and a act as two representatives of one type: e and e-rotated. So do, for example, w and m, or u and n.</p>
      <p>Is there a minimal set of characters which are prerequisite for the completion of a whole alfabet? And if so, which set?</p>
      <p>Does anyone know about similar typographic experiments?</p>
