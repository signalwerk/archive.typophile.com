    <p>Regarding typography and the use of uncommon letter images, I personally do like the (moderate) use of type reflection. Sometimes evidently but also ’undercover’, as they can function as regular types.</p>
    <p>Like a mirrored ’z’ (=s) or a mirrored ’w’ (=m). Well, there are several options.</p>
    <p>Is this a well-mannered way of creating a nice text image or just a cheap trick from an Illustrator-freak?</p>
