    date: 2009-05-28T15:25:00
    date_raw: 28.May.2009 3.25pm
    votes: null
    html: <p>I’m going to guess this is entirely custom lettering rather than a customized font. In particular, look at the two cursive ’s’ glyphs. The one at the end of “Bros” is bigger and has a totally different shape than the one in “Lansky.” It also seems a bit too perfect that the ’B’ and ’y’ form such a straight line.</p>
