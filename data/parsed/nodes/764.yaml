  html: "<p>The first official TypeCon2004 planning meeting will take place: <br> <br>Tuesday, August 12, 2003 <br>7pm <br><a href=\"http://www.sfcb.org/\">San Francisco Center for the Book</a> <br>300 DeHaro Street <br>San Francisco, CA 94103 <br>Tel 415-565-0545 <br> <br><a href=\"mailto:tamye@typesociety.org\">Drop me a line</a> and let me know if you're planning to attend. Bring your brains and your imagination, and we'll put together another amazing event.</p>"
