    date_raw: 18 Feb 2004 — 5:45am
    votes: null
    html: '<p>Attention, Bay Area Typophiles: we have set up a <a href="http://www.typecon2004.com" target="_blank"> TypeCon2004</a> planning meeting for next Tuesday, February 24. Be prepared for brainstorming and fun. <br> <br>Meeting details: <br> <br>Tuesday, February 24, 2004 / 7pm <br><a href="http://www.sfcb.org" target="_blank"> San Francisco Center for the Book</a> <br>300 DeHaro Street <br>San Francisco, CA 94103 <br>Tel 415-565-0545 <br> <br>Feel free to pass this on to other folks in the Bay Area who might be interested. Everyone is welcome! <a href="mailto:tamye@typesociety.org"> Email me</a> if you need more info about TypeCon2004.</p>'
  - id: 136857
    user: 107
    date: 2004-05-31T11:07:00
    date_raw: 31 May 2004 — 11:07am
    votes: null
    html: "<p>Attention, Bay Area Typophiles: there's one more major planning meeting for TypeCon2004 before the big event arrives! I'll be in town for this one, and I'm looking forward to seeing you all. <br> <br>Meeting details:  <br> <br>Friday, June 18, 2004 / 7pm  <br>San Francisco Center for the Book  <br>300 DeHaro Street  <br>San Francisco, CA 94103  <br>Tel 415-565-0545  <br><a href=\"http://www.sfcb.org\" target=\"_blank\">www.sfcb.org</a> <br> <br>Feel free to pass this on to other folks in the Bay Area who might be interested. Everyone is welcome! Message me if you need more info, and to RSVP that you'll attend.</p>"
