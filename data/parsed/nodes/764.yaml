    html: <p>I'd like to propose and official TC04 vehicle that keeps us fit and fun during the crowd movings from one site to another. <br> <br>Stylish and trendy, we'd trigger a media coverage for sure! <br> <br><a href="http://www.neimanmarcus.com/store/catalog/prod.jhtml?itemId=prod9250187&amp;parentId=cat000549&amp;masterId=cat000546&amp;grandMasterId=cat000526&amp;index=15&amp;cmCat=">The Human Transporter</a> <br> <br>I think it's better than an expensive Segway. <br> <br>Yours, <br>Frank</p>
