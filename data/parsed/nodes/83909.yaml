      <p>I wonder if the median horizontal bar of /K/ and /X/ crossing should more closely match /B/E/F/ (I assume you chose the upper variant, excepted /Z/).<br>
      I don't know if it's too tall, but certainly I see /f/ and /t/ suffering.<br>
      /i/ and /j/ shouldn't have same x-height?<br>
      an finally, I'm not into /x/ form.<br>
      But in general I truly like the font face :) let's see figures!</p>
