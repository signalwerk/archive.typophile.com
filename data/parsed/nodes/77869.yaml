  html: <p>I have been trying to identify this glyphic display typeface for years. I believe it is a venerable and well-used type - I might have seen it used in a decades-old National Geographic. Nonetheless I haven't been able to pin it down. It may be a condensed type. Note the 'bowtie' crossbar on the capital 'T'.  It's not Albertus, not Baker Signet, not Fritz Quadrata. The example here is taken from current sponsor credits for a PBS program. Help, Help.</p><div class="imageWrap"><img src="http://typophile.com/files/mysteryglyphic_6347.png"></div><p></p>
  html_clean: <p>I have been trying to identify this glyphic display typeface for years. I believe it is a venerable and well-used type - I might have seen it used in a decades-old National Geographic. Nonetheless I haven't been able to pin it down. It may be a condensed type. Note the 'bowtie' crossbar on the capital 'T'.  It's not Albertus, not Baker Signet, not Fritz Quadrata. The example here is taken from current sponsor credits for a PBS program. Help, Help.</p><div class="imageWrap"><img src="http://typophile.com/files/mysteryglyphic_6347.png"></div><p></p>
