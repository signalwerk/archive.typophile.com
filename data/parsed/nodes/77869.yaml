    html: <p>Yes, you're absolutely right. Thank you. I see that this is, indeed, Strayhorn. It turns out that I have mis-conflated Strayhorn with the vintage typeface I was originally searching for (and at that time ruled out Strayhorn). The one I saw in National Geographic resembled Carol Twombly's Lithos a little, the caps in Pompeia a little, except more regular (not Pericles and had nothing like the irregularities of Heraculeum), and the bow-tie crossbar on the capital 'T' had vertical rather than canted ends. Looks like it's back to the drawing board.</p>
