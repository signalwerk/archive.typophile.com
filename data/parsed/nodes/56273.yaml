    html: |-
      <p>To make an inner shadow, convert the text to outlines, then:</p>
      <p>1. Copy the letters (shapes)<br>
      2. Paste in place (command-F) to make a copy of the letters directly on top<br>
      3. Offset the copy in the direction and distance you want the shadow to go<br>
      4. Make the color of the original letters darker (the color you want the shadow to be)<br>
      5. Select both the copy and the original and apply the Pathfinder "Minus Front" operation -- this is your shadow<br>
      6. Do a paste behind (command-B) to paste the original letters behind the shadow (the original letters should still be on the clipboard)</p>
      <p>Here is what it looks like:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/innershadow_5964.gif"></div><p></p>
      <p>Left to right: the original; the offset copy, with the darkened original beneath; the result of the "minus front" pathfinder operation; the original letter pasted behind the shadow.</p>
