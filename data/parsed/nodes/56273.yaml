      <p>The way I would do that is in Illustrator.</p>
      <p>1: Type your word/line of text.</p>
      <p>2: Create Outlines.</p>
      <p>3: Do an "Offset Path" under objects. Play around with this until you get the right weight around your text.</p>
      <p>4: Take the background shadow element you just created, copy it, and paste it in back, moving it down and to the right, or whichever way you want. This is going to define how far out your shows will go.</p>
      <p>5: Go to "Blend&gt;Blend Options," choose "Number of Steps," and put in something pretty high, like 100. Select the shadow piece in back of your text, and the one you moved down and to the right, and go to "Blend&gt;Make Blend." If it's too stepped, undo it and go back to blend options, setting the value higher.</p>
      <p>6: Use the Pathfinder tool to combine the shadow into one simple piece.</p>
      <p>That's at least how I would do it. There are several other ways you could go about it, but that one is the quickest. Sorry if all the functions are not exactly the right name -- I'm not looking at Illustrator right now -- but it should give you a general idea of what to play with.</p>
