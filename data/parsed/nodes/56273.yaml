      <p>This isn't so much a drop shadow as it is an extrusion with an outline. I'd guess from the look and feel of the reference material, that this is predating contemporary design tools. 1.) You could draw it, so you could have a better understanding of what is going on. 2.) You can do a standard drop, and "connect your diagonal endpoints"... 3.) There's a 3D tool within illustrator that will support this kitsch niche... I've been using it quite a lot lately to both devalue and inflate the importance of some personal maxims... </p>
      <p>(i.e. see my colourlovers link in my profile.)</p>
