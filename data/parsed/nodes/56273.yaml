    html: <p>Glad that worked out for you! One thing that can make it a lot smoother is once you've flattened the background shadow pieces into one shape, select all the points except for the far left and far right (or highest and lowest, depending on what kind of shadow you created), hit backspace, and then do an Apple+J "Join" command. Do this step for both sides with a lot of extra points. This gets rid of any of the stepping from the blending process, but if you used enough steps, it won't be visible. It will create a very large file, though, if you leave the steps.</p>
