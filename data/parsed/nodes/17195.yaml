  html: |-
    <p>Hello everyone</p>
    <p>I am new to Typophile and this is my first post. I am glad to be here. I have an OpenType features related problem. I want to make the following substitutions:</p>
    <p>1 + 0 with a glyph called 1_0<br>
    1 + 0 + 0 with a glyph called 1_0_0 and<br>
    1 + 0 + 0 + 0 with a glyph called 1_0_0_0</p>
    <p>(1 and 0 can be replaced by any digit - see code below)</p>
    <p>I work in Fontlab Studio 5 and I at first I wrote the following code:</p>
    <p># glyph classes<br>
    @digitsnozero=[one two three four five six seven eight nine];<br>
    @digits=[zero one two three four five six seven eight nine];<br>
    @twodigits=[X X_X X_X_X X_L L L_X L_X_X L_X_X_X X_C];<br>
    @threedigits=[C C_C C_C_C C_C_C_C D D_C D_C_C D_C_C_C D_C_C_C_C];<br>
    @fourdigits=[M M_M M_M_M M_M_M_M];</p>
    <p>feature liga {<br>
    # substitutions for two digits<br>
    sub @digitsnozero’ @digits by @twodigits;<br>
    # substitutions for three digits<br>
    sub @digitsnozero’ [@digits @twodigits @threedigits] @digits by @threedigits;<br>
    # substitutions for four digits<br>
    sub [one two three four]’ [@digits @twodigits @threedigits]<br>
    @digits @digits by @fourdigits;<br>
    } liga;</p>
    <p>The problem is that when the first rule is activated the other two are ignored. As a result I only get the first substitution (1 + 0 -&gt; 1_0)</p>
    <p>I solved the problem by putting each rule in a different feature (the first in onum, the second in smcp and the third in liga - it works).</p>
    <p>So now I have the following:</p>
    <p>feature onum {<br>
    # substitutions for two digits<br>
    sub @digitsnozero’ @digits by @twodigits;<br>
    } onum;</p>
    <p>feature smcp {<br>
    # substitutions for three digits<br>
    sub @digitsnozero’ [@digits @twodigits @threedigits] @digits by @threedigits;<br>
    } smcp;</p>
    <p>feature liga {<br>
    # substitutions for four digits<br>
    sub [one two three four]’ [@digits @twodigits @threedigits] @digits @digits by @fourdigits;<br>
    } liga;</p>
    <p>I read in the OpenType specification about the Chaining Context Substitution but I did not understand how am I supposed to do it.</p>
    <p>Can anyone tell me if I can put all the three rules in one feature (e.g. in a liga feature)? Can I do anything with ‘lookup’?</p>
    <p>George Triantafyllakos - backpacker.gr</p>
