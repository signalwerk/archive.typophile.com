    html: "<p>Big hint: With any many-to-one substitutions, the longest string should go first, which is why “ffi” and “ffl” are before “ff”, “fi”, and “fl”. (Which is pretty much the opposite of what happens when you’re typing. Which is why you should always write OT code while drunk.)</p>"
