    date_raw: 27 May 2004 — 5:54am
    votes: null
    html: "<p>Hi Ashton, <br> <br>Your M is displaying a common problem: The Flat Point. <br>In an effort to get the dark spots out of the tight angles it is tempting to make the joint very wide. In the end it is a balancing act. The goal is to make it look like the points are the same width as the stem or smaller, while keeping the joins free of clogging. You have four weapons to fight with: <br> <br>1. The widening the join (as you've done) <br>2. The widening the whole glyph (opens the angles) <br>3. Subtle tapering of stems (opens the angles) <br>4. Trapping <br> <br>In the following example I've used less of 1 and more of 4. The darker the weight, the more gymnastics will be required for even color. This glyph is pretty light and maybe could survive with no trapping and a bit more #2. How you mix the weapons is part or your thumbprint on the font. </p>"
