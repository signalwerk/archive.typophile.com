    <p></p><div class="imageWrap"><img src="/web/20080907011205im_/http://www.typophile.com/files/sviato_logo_transparent_5845.gif"></div><p></p>
    <p>„Свято Кирилиці” („Cyrillic Fest”) is a typography and calligraphy festival, which traditionally takes place in 24-25 May in  Kharkiv (Ukraine). This year it included type seminars and presentation by <a class="freelinking-external" href="https://web.archive.org/web/20080907011205/http://typophile.com/node/44376 "> Vitalij Mitchenko’s book</a>, type games and exhibition of typefaces and calligraphy from Ukraine, Russia, Belarus and Bulgaria. </p>
    <p></p><div class="imageWrap"><img src="/web/20080907011205im_/http://www.typophile.com/files/IMG_1629_cut_4472.jpg"></div><p></p>
    <p>here is online exhibition (sorry, no English version):<br>
    <a class="freelinking-external" href="https://web.archive.org/web/20080907011205/http://www.cyrillic.org.ua/ua/exhibition">http://www.cyrillic.org.ua/ua/exhibition</a></p>
    <p>and some photos from participants:<br>
    <a class="freelinking-external" href="https://web.archive.org/web/20080907011205/http://community.livejournal.com/ua_typography/207861.html">http://community.livejournal.com/ua_typography/207861.html</a><br>
    <a class="freelinking-external" href="https://web.archive.org/web/20080907011205/http://community.livejournal.com/ua_typography/208693.html">http://community.livejournal.com/ua_typography/208693.html</a><br>
    <a class="freelinking-external" href="https://web.archive.org/web/20080907011205/http://community.livejournal.com/ua_typography/209218.html">http://community.livejournal.com/ua_typography/209218.html</a><br>
    <a class="freelinking-external" href="https://web.archive.org/web/20080907011205/http://community.livejournal.com/ua_typography/209925.html">http://community.livejournal.com/ua_typography/209925.html</a></p>
    <p>and publication about Fest in Novynar, Ukrainian newspaper:<br>
    <a class="freelinking-external" href="https://web.archive.org/web/20080907011205/http://igordudnik.livejournal.com/194177.html">http://igordudnik.livejournal.com/194177.html</a></p>
