  html: |-
    <p>Hi,<br>
    I have problem to set font height. I have font which looks too big and there is lot of space under glyph. I use Fontographer (20090923) to change descent without rescale outlines.<br>
    But in Microsoft Word font looks even bigger so I have to use smaller size.<br>
    Only way I found to change appearance was setting paragraph parameter "Line spacing" to "Exactly" 8 (beceause I use font size 8 to fit text on page).<br>
    But unfortunately behaviour of Microsoft Word is strange in this case. Lines are thiner because Line spacing is set exactly 8 and on page rise space to accept more lines but Word cannot accept next lines to free space and keep them on next page.<br>
    Please How can I change font height to make font smaller and force Microsoft Word to use thiner lines?</p>
    <p>Thanks for advance</p>
