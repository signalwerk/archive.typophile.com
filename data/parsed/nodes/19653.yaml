      <p>David: “‘cause you’re spendin’ millions in tests to limit the possible solutions drastically.”</p>
      <p>Sorry, I’m still learning the cultural differences of working with typographers. I think the choices made in that study were all reasonable ones. We thought the grayscale solution we tested was the best one available. Reasonable people can certainly disagree with any of our choices in the study. Perhaps a different font, size, or type of grayscale would change these results. When a psychologist disagrees with how another psychologist’s study was carried out, it is perfectly acceptable to rerun another's study with different parameters.</p>
      <p>I recommend getting a psychology student at one of your local universities excited about studying typography. Students frequently need good project ideas and can run studies at low costs. I’m not interested in limiting possibilities, but can’t investigate every possibility myself. I’d be happy to have more people running studies on typographic possibilities.</p>
      <p>Cheers, Kevin</p>
