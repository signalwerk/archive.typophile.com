      <p>&gt;“I’ve no idea what they were thinking with Monaco, that typeface is just terrible.”</p>
      <p>Ah well, that was a bit flippant and I should have been more precise.</p>
      <p>&gt;As Sii’s link points out, Monaco is the monospaced “city” font from the original Mac. I’m &gt;sure they were thinking that they needed a legible monospaced font for a 512 x 342 pixel &gt;black and white CRT.</p>
      <p>Most certainly. The city fonts were definitely a big step forward in screen typography back then, and I'm aware that the monospaced font was a particular challenge as they must have wanted to fit an entire text console in a window considerably smaller than the screen, which leaves you even fewer pixels to work with than on a text-only terminal. And they arrived at a solition which worked remarkably well given the constraints.  The outlines were then needed so that you could get a decent printout in true WYSIWYG spirit.</p>
      <p>The real question is, what where they thinking when making this the default in OS X, when 512 x 342 had become somewhat uncommon? Probably that Mac developers are used to it...</p>
