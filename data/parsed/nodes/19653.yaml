      <p>&gt;I’ve often noticed, and never fully understood, that a large number of programmers prefer pixel fonts. Is this a kind of, possibly subconscious, nostalgia?</p>
      <p>When ClearType was invented and tested on people at Microsoft the biggest initial critics were some of the programmers (AKA developers) - initially the phenomenon of people not liking ClearType was dubbed the "developer effect" - however over time attitudes have changed. The ClearType team conducted research that demonstrated that more bugs could be identified in code samples displayed in Consolas under CT than could with a sample displayed in Courier New under bi-level aliased rendering.</p>
