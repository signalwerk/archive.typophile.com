      <p>Carl: <em>Aren’t subpixels being manipulated any time something other than black and white is being displayed? Isn’t displaying a picture of ClearType the same as displaying ClearType if it’s being displayed pixel-for-pixel?</em></p>
      <p>Si: <em>I have to disagree with this too - there’s nothing preventing someone from rasterizing an exisitng font using the CT rasterizer and making a color bitmap font from the output - you’d loose any sub pixel positioning, you’d have to do it for both BGR and RGB, and adjusting the gamma would be tricky, but apart from that the results could replicate what you see in Windows XP exactly.</em></p>
      <p>Sorry for the brain-fade moment and resulting confusion. I wasn't thinking in terms of rasterising a ClearType font and creating a colour bitmap font from the result. I took the original suggestion -- 'phone makers could create fonts that had a cleartype look without the rasterizer' -- to imply creating colour bitmap fonts from scratch using some form of bitmap editing tool. Yes, of course, one can address the subpixels by adjusting the RGB levels -- doh! --, but it would still be darned tricky to emulate CT rendering manually, which is what I was thinking about.</p>
