      <p>"I’ve no idea what they were thinking with Monaco, that typeface is just terrible."</p>
      <p>As Sii's link points out, Monaco is the monospaced "city" font from the original Mac. I'm sure they were thinking that they needed a legible monospaced font for a 512 x 342 pixel black and white CRT. The limitations of monospaced typography put the squeeze on wide letters and try to artifically stretch narrow letters. The "a" and "i" in Consolas are probably taking a safer route to legibility.</p>
