      <p><em>Not to contradict John as I’m sure he knows much more about this particular study than I do, but it wasn’t a readability study, it was a bug spotting study.</em></p>
      <p>Yes, I wasn't referring to the code bug spotting test, but to general reading accuracy test results comparing b/w, greyscale and ClearType rendering, as presented by Kevin Larson at the ATypI conference in Vancouver (2003). Greyscale performed most poorly, while ClearType came in a close second behind the b/w rendering. I'm not sure what text sizes and resolutions were involved in the test, though, and I suspect as resolutions increase the gap between ClearType and b/w will narrow and eventually invert. I believe the key is in the consistency of stroke colour, which obviously is completely consistent in a well-formed b/w pixel pattern, less consistent in ClearType at today's typical resolution, and very much less consistent in greyscale antialiasing.</p>
