      <p>"Grayscale used the hinting done for black &amp; white [such as grid-fitting.?]"</p>
      <p>I don't understand why this was done. Do you know? I mean, it seems like: the CT was made as good as possible...the B&amp;W was too...then, the GS used the B&amp;W's hints, the CT's subpixel positioning? adjusted the gasp table, and...(Failure assurance in 1/3 of the presentation to the user seems like a high percentage for a good test.)</p>
      <p>It seems, not only narrow to test this on; a, or a few sizes, a font or two, a few users — but narrow <em>and</em> slanted if you mismatch 1/3 of the solutions. I feel that we can only truely solve this if we can grasp and harness the gasp, hints (and outlines only as a last resort), to satisfy the increadibly wide range of screens, renderizers, fonts (incl. other scripts), users and sizes!</p>
      <p>This is a huge area for "the user to be in control" and I just don't get it, I guess, 'cause you're spendin' millions in tests to limit the possible solutions drastically.</p>
