      <p><em>What res.? what size? What grey scale fonts? (that’s the real puzzler…)</em></p>
      <p>Word identification test (comparing CT, antialiased and aliased text):<br>
      TFT-LCD display (1024 × 768; XGA; 106 dpi) using its native resolution.<br>
      Nominal 10 pt Verdana (custom gasp table setting to permit antialiasing for test).<br>
      I had misremembered the results: in this test, CT and aliased actually scored almost identically (c. 64% accuracy for both roman and italics), with antialiased text scoring very badly in comparison (43% for roman, 28% for italic).</p>
      <p>Gugerty, Tyrrell, Aten, &amp; Edmonds, 'The Effects of Subpixel Addressing on Users’ Performance and Preferences During Reading-Related Tasks', in <em>ACM Transactions on Applied Perceptions,</em> Vol. 1, No. 2, October 2004.</p>
