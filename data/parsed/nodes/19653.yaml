      <p>The study John referenced is in this paper:</p>
      <p>Gugerty, L., Tyrrell, R.A., Aten, T.R., &amp; Edmonds, K.A. (2004). The effects of sub-pixel addressing on users’ performance. ACM Transactions on Applied Perception, 1, 81-101.</p>
      <p>Res: 106 dpi (OS set to 96 dpi)<br>
      Size: 10 point<br>
      Font: Verdana Roman and Verdana Italic</p>
      <p>ClearType: compatible widths ClearType<br>
      Black &amp; White: Hinted black &amp; white as appears by default in WinXP<br>
      Grayscale: Hinted grayscale as used by the WinXP OS (the font GASP table needs to be modified to display at that size)</p>
      <p>This was a tachtistoscopic word naming study. They found no reliable differences between ClearType and black &amp; white, but that users named grayscale words at a reliably less accurately.</p>
      <p>Cheers, Kevin</p>
