      <p>Well, I may be atypical because the main reason I got a Mac is that I needed a UNIX that could reliably do power management and suspend on a laptop... but I tend to use the same font as under Linux and occasionally Windows, Bitstream Vera Sans Mono. Before that it was Andale Mono. I'm giving Consolas a try now, it looks very promising - thanks for the pointer!</p>
      <p>I've no idea what they were thinking with Monaco, that typeface is just terrible.  Its almost unreadable at small sizes, and looks Comic-Sansish silly in large sizes. But at least they do allow you to turn on antialiasing in Terminal, it's a check box in the display settings tab.</p>
      <p>On the readability of pixel fonts, my personal observation is that fonts that normally use lines only one pixel wide (as is often seen in old GUIs and windowing IDEs) are very difficult to read, while bolder fonts that have two pixel strokes (as used to be the norm on text-only CRT terminals, and the VGA DOS console) are much better.  It might be worthwhile to check whether that can be generalized, and if so, it should be taken into account in studies.</p>
