      <p>10 point is the most commonly used size in the studies I've worked on. 12 point is the next most common. Verdana is believed to look particularily good at 10 point.</p>
      <p>Grayscale used the hinting done for black &amp; white such as grid-fitting. This has the effect of sharpening horizontal and verticle stems. Diagonals appear blurred and appear more three dimentional than than. This does not give the even appearance of traditional grayscale, but we think the extra sharpness benefits readers.</p>
      <p>Cheers, Kevin</p>
