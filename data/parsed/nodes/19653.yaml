      <p>By default XCode uses Monaco for code, and LucidaGrande for everything else. At defaults, it looks like Monaco isn't subject to text smoothing, even though its size is above my 8 pt threshold. </p>
      <p>In Terminal.app, font smoothing is actually disabled. You can change the font and size, but most proportionally spaced fonts look very strange if you try it. The terminal coerces them to become monospaced. </p>
      <p>I would love to see a good comparison of Monaco to Luc de Groot's new Consolas, which is sort of the state-of-the art for monospaced fonts. We could decide which font squishes its "m" better. I suspect Consolas will be much smoother.</p>
