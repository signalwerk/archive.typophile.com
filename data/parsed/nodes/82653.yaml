    <p>Hi, I have created a logo for the brand-name AQUAHOLIQUE and logo is meant to be as the first "A" in (A)QUAHOLIQUE.<br>
    The trademark is for boat equipment, drink holders etc...<br>
    I would like the trademark to have an exclusive feel yet a little bit sporty.</p>
    <p>The endings of the "A" can be designed to suit the chosen font.</p>
    <p>Any suggestions are very appreciated, please see attached image for the "A"</p>
    <p>Thanks!<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/A-logo_5583.jpg"></div><p></p>
