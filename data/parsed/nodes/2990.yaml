    html: <p>Thanks Mark &amp; Yves, the Cochin suggestion is good, although the Berthold Le Cochin (in FontBook) looks closer than the Nicholas Cochin, although I can't find it on the web, even at Berthold. The A &amp; N are less 'eccentric' looking, for lack of a better term. The F is a good match. <br> <br>Yves, you said it had ' a typical M', but for some reason it looked really deformed and exaggerated by the serif 'wings' at the apexes (apices?) and the stroke contrasts. Perhaps the shadows made it look more distorted to me than it was. <br> <br>The fonts mentioned in the other thread were 'classic' looks, but not very close to this.  <br> <br>I'll call of the hunt with that idea from Mark. <br> <br>Thanks</p>
