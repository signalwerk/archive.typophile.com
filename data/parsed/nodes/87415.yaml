  html: |-
    <p><a href="http://cl.ly/0K0m172G0A1N2s3o3s2C" target="_blank" rel="nofollow"><img src="http://f.cl.ly/items/2Q0g201h3G1b0M1C0d2a/keynote-lubalin-graph-fight.png" width="500"></a></p>
    <p>Even though ITC's typeface Lubalin Graph (demi and regular) is (visibly) installed, Apple Keynote <strong>constantly</strong> complains with an error that it can’t be found (since it’s listed under “ITC Lubalin Graph”). This error happens whenever one of us at work sends a document to another, even though we are all using the same (licensed) copy of Lubalin Graph.</p>
    <p>Has anyone encountered this before? Would it help if I renamed the font internally with eg. Fontographer or a similar tool?</p>
    <p><a class="freelinking external" href="http://cl.ly/0K0m172G0A1N2s3o3s2C" rel="nofollow">full-size visible example of missing font error in Keynote</a></p>
    <p>- <a class="freelinking external" href="http://twitter.com/jm3" rel="nofollow">jm3</a></p>
