      <p>Cheers guys, I'm guessing this might've been hand drawn by the great Mr Bass, but I'm sure a very similar font has been used recently for some movie (and therefore probably replicated for some free font website somewhere)</p>
      <p>Buzzin Fly records also use a similar font. <a href="http://www.buzzinfly.com/buzzed.html" title="http://www.buzzinfly.com/buzzed.html">http://www.buzzinfly.com/buzzed.html</a></p>
      <p>It's pretty much all about the roughened look (which rules out Interstate unfortunately)</p>
      <p>Thanks for your help so far.</p>
