    <p>Hi Everyone, hope you can help me. I'm looking for a font similar to the one Saul Bass uses for the Movie credits on the Vertigo poster.<br>
    It's a rough, kind of hand drawn, ultra light, condensed font. A movie has used something similar lately, but I can't remember which one (and it's driving me crazy!!!)</p>
    <p>Any help would be much appreciated. Thanks </p><div class="imageWrap"><img src="http://typophile.com/files/fontid_4786.jpg"></div><p></p>
