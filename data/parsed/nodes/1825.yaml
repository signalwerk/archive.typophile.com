    html: <p>Thanks for the replies. <br>While I'd like to take Hrant's route (with 'any means available' involving pointed sticks, a wire brush and Dettol), I think Meredith's caution is probably the way to go. <br>(Although the narky message I suggested earlier was what I considered to be the cautious route). <br>There was a contract, including a late payment charge, but the amount involved isn't one that I really want to fight for in court - though I will if I have to. I don't think they will let it go that far, I'm sure they'll cough up before then. I'm just pissed off that doing someone a favour ends up like this. (I even avoided telling them exactly what I normally charge because I didn't want them to feel bad about getting such a discount!) <br> <br>Have you seen <a href="http://www.introducingmonday.co.uk/" target="_blank">www.introducingmonday.co.uk/</a>, apparently created by disgruntled ex-employees? (Its best with sound)</p>
