    html: <p>Eight weeks is 60 days. Receivables have gone from 30 to 45 to 60 and onwards to 90 and 120 days. These days in NYC 60 days is not considered an unreasonable amount of time to wait for the bill to be paid. <br> <br>Not great but it is becoming the custom. <br> <br>Ive heard a few stories that the traditional wait for receivables in the department store business is excess of 360 days. <br> <br>I remember not too long ago when most invoices were paid in 10 to 30 days.</p>
