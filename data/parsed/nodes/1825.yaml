    html: "<p>Receivables are supposed to be paid according to the terms set by the vendor -- not by some standard or average out there. F'rinstance, my invoice clearly states when a late fee will begin to be assessed and what the fee is. If I have to send a statement or follow up personally, I can refer to this.  I don't always use a contract at the beginning of a job (I should, but I don't), but when I do, the terms are in the contract and signed by the client before work begins. <br> <br>Bottom line: the vendor sets the terms, and the client agrees to them. (Negotation is always an option, of course, but it's still in the vendor's hands whether to take the job or walk away.)</p>"
    html_clean: "<p>Receivables are supposed to be paid according to the terms set by the vendor -- not by some standard or average out there. F'rinstance, my invoice clearly states when a late fee will begin to be assessed and what the fee is. If I have to send a statement or follow up personally, I can refer to this.  I don't always use a contract at the beginning of a job (I should, but I don't), but when I do, the terms are in the contract and signed by the client before work begins. <br> <br>Bottom line: the vendor sets the terms, and the client agrees to them. (Negotation is always an option, of course, but it's still in the vendor's hands whether to take the job or walk away.)</p>"
