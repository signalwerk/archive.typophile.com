    html: "<p>I disagree with the absolute of having a contract or else.  Certainly having a contract with terms and conditions will be helpful if there are disputes over particulars.  But in this case, it's fairly blatant. <br> <br>Services have been rendered for which payment was not received.  In the US (I take it you live in the UK) we use a threshold of preponderance of the evidence in civil court.  Meaning, your only requirement to prove that things happened as you claim they did is to show enough evidence to make a case (not prove it beyond a reasonable doubt). <br> <br>In your situation that would be two things: <br> <br>1. The web site (with any additional evidence to show source code, proof of maintenance, etc.) <br> <br>2. Your typical hourly / project rate. <br> <br>By simply bringing it to court shows (beyond the preponderance of the evidence) that you are in grievance -- so they can't use some concocted excuse that you agreed to do it for no charge. <br> <br>Beyond that, some clients are just not worth keeping around.  Send them a letter outlining your intention, put it to a timeline, and see what happens. <br> <br>Cheers.</p>"
    html_clean: "<p>I disagree with the absolute of having a contract or else.  Certainly having a contract with terms and conditions will be helpful if there are disputes over particulars.  But in this case, it's fairly blatant. <br> <br>Services have been rendered for which payment was not received.  In the US (I take it you live in the UK) we use a threshold of preponderance of the evidence in civil court.  Meaning, your only requirement to prove that things happened as you claim they did is to show enough evidence to make a case (not prove it beyond a reasonable doubt). <br> <br>In your situation that would be two things: <br> <br>1. The web site (with any additional evidence to show source code, proof of maintenance, etc.) <br> <br>2. Your typical hourly / project rate. <br> <br>By simply bringing it to court shows (beyond the preponderance of the evidence) that you are in grievance -- so they can't use some concocted excuse that you agreed to do it for no charge. <br> <br>Beyond that, some clients are just not worth keeping around.  Send them a letter outlining your intention, put it to a timeline, and see what happens. <br> <br>Cheers.</p>"
