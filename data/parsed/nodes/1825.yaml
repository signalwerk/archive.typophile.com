    html: <p>I collect on my late fees when the client is markedly late. It doesn't jeopardize my business relationship -- I keep it friendly, and I'll generally waive the fee the first time or if the client asks me to because of a special circumstance. <br> <br>I only have one client who regularly pays late; since I do ongoing work for them, I invoice them every month and just add the late fee to the next month's invoice. They always pay eventually, with no complaints. I don't see any problem with this practice. I'm not so rigid that I would let it interfere with the relationship -- but as I mentioned to Steve, the late fee lets me continue working for them without resentment.</p>
