    html: "<p>A few things to consider: <br> <br>First of all, was there a contract? Doesn't sound like it. Does the invoice state a late-fee policy? I hope so. Late fees are important for two reasons: 1) It motivates the client to pay on time, and 2) it helps you keep the matter professional and allays some of the resentment you naturally feel (since the later they are, the more money you ultimately get). <br> <br>I would <i>not</i> post a snarky message on their website; that reflects poorly on you as a professional. As pissed off as you (understandably) are, you won't regret behaving professionally -- and you might well regret throwing the tantrum you'd like to throw.  <br> <br>If you don't have a contract or a late fee to enforce, you might start by sending them a letter (does the UK post have some option for confirming receipt of the letter?) stating how many days overdue the payment is, and perhaps telling them that if they don't pony up within <i>x</i> more days, <i>y</i> action will take place. <br> <br>Action could be: bringing in the lawyers, stopping their email, etc. Whatever it is, make sure it's practical and professionally appropriate. And then, as with an unruly child, whatever consequence you promise, you <i>must</i> follow through with it. <br> <br>A final note: try, if you can, to separate their annoying-ness as a client with the nonpayment issue. The work is done, and it probably won't help get you your money if you actively hold that part against them. It does sound like a nightmare job -- but in the future, some firm customer education up front as to your role can go a long way. <br> <br>Good luck! This kind of thing happens to most designers at some point, and it is a royal pain in the •••. Be persistent and professional, and bring in the big dogs if you have to.</p>"
