    html: "<p>It's helpful to make it clear on the invoice that there's interest levied on overdue invoices (1.5% to 2% per month is typical). That way, the money owed you by late payers is growing at a rate of 15-20% annually. Not a bad investment, assuming you get the money eventually. <br> <br>Various books on running your own design business suggest strategies for collecting late invoices. These include sending monthly invoices with updated figures (due to interest) and stages in which polite, hand-written reminders are followed by \"Urgent: overdue!\" envelopes and so forth. <br> <br>You want to avoid court and pissing off your client, if possible. Many clients buy services they can't afford to pay for - at least not immediately, and often a payment plan (with interest) can be worked out if you contact them directly. <br> <br>Lastly, make sure you have the documentation (a contract helps) available if you need to visit small claims court. <br> <br>[Disclaimer: This is mostly theoretical for me, since I have yet to have any significant clients be late on their bills.] <br> <br>Paul</p>"
    html_clean: "<p>It's helpful to make it clear on the invoice that there's interest levied on overdue invoices (1.5% to 2% per month is typical). That way, the money owed you by late payers is growing at a rate of 15-20% annually. Not a bad investment, assuming you get the money eventually. <br> <br>Various books on running your own design business suggest strategies for collecting late invoices. These include sending monthly invoices with updated figures (due to interest) and stages in which polite, hand-written reminders are followed by \"Urgent: overdue!\" envelopes and so forth. <br> <br>You want to avoid court and pissing off your client, if possible. Many clients buy services they can't afford to pay for - at least not immediately, and often a payment plan (with interest) can be worked out if you contact them directly. <br> <br>Lastly, make sure you have the documentation (a contract helps) available if you need to visit small claims court. <br> <br>[Disclaimer: This is mostly theoretical for me, since I have yet to have any significant clients be late on their bills.] <br> <br>Paul</p>"
