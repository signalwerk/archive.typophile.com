    html: <p>Steve, <br> <br>Without a contract (I use a modified version of the <a href="http://aiga.org/content.cfm?CategoryID=111">AIGA's Standard Form of Agreement for Graphic Design Services</a>) you have nothing in the way of legal recourse. I cannot overemphasize the importance of  this. A contract protects you and your client and lets them know your a professional. <br> <br>Also, I use a Project Planner/Client Survey/RFP type document upfront. After initial contact has been made and a potential client has expressed an interest in your services, have them fill out such a survey which forces them to really think about their goals, customers and competition. If they are unable to do this, that's a red flag. It indicates that they really don't know why they're doing what they're doing. Without a proof of concept, it's nearly impossible to create anything of value. At this point, you may want to meet with them in person to "go through" the survey. Some clients are better at talking about what they need than writing it down. Either way, the information (or lack thereof) provided in such a document/meeting goes a long way torward indicating weather the project is feasible. <br> <br>Lastly, if there charging 70quid for haircuts, they can afford your full rate. Don't EVER undersell yourself. <br> <br>At least you have control over the domain, so you can always just switch it off. <br> <br>If all else fails, send 'round Tony and Fat Polly to collect and "forgetta about it."  <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> <br> <br> -t</p>
