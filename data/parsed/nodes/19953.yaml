    date_raw: 16 May 2006 — 12:52pm
    votes: null
    html: "<p>Please consider: digitize (also trace and autotrace) your work in FontLab or TypeTool. Avoid developing the habit of drawing outlines in Illustrator. The tools in FontLab/TypeTool are built for drawing glyphs. Switching between Illustrator and FontLab is unneccesary and can be frustrating, and a waste of time.</p>"
