  - id: 123646
    user: 9913
    date: 2006-05-17T10:37:00
    date_raw: 17 May 2006 — 10:37am
    votes: null
    html: |-
      <p>Illustrator is valuble if you're making certain types of "far out" display fonts, with crazy effects and filters... distressed, "grunge" fonts and their ilk. The resulting garbage would still need to be cleaned up in TypeTool or FontLab. Crossgrove is right. </p>
      <p>If you're short on cash TypeTool is a nice option. You can still open your projects in FontLab later to add OTF features, so there's really no downside that I can think of.</p>
