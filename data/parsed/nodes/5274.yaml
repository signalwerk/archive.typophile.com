  html: <p>I'm designing a postcard for a benefit play for a sexual assault support center and I'm looking for some typographical advice. <br> <br>The postcard has a large watercolor flower (a lily, I think) and is going to have either a black or PMS 689 (kinda purple) background. <br> <br>I'm looking for a font that's (obviously) strong and feminine at the same time.  The text is going to be knocked out of the background, so it can't be ultra-thin. <br> <br>I was thinking that Curlz is really nice. <br> <br>Just kidding. <br> <br>Centaur Swash looks pretty good, but I'm not really excited about the serif coming off the top of the "P", and Jennifer isn't bad, but it might be a little too curly and Jennifer Light is too light. Lorrenne? Help?</p>
