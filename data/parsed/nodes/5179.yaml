    votes: null
    html: <p>well, the best to my experience is to use a registrar who is in the same country as you + one who provide online managing of your dns and such things related. Avoid to use the domain registration offered by a host, because it doesn't help to leave the host if trouble with it, because of the domain+dns. <br> <br><a href="http://www.icann.org/registrars/accredited-list.html" target="_blank">http://www.icann.org/registrars/accredited-list.html</a></p>
