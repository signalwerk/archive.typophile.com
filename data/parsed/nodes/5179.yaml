    date: 2004-07-09T01:39:00
    date_raw: 9 Jul 2004 — 1:39am
    votes: null
    html: <p>Dan, just know that registering a domain is different from  <br>getting your domain hosted. You can have one company register  <br>it and another host it, but it's less hassle if you know who  <br>your host is and just have them register it. <br> <br>If you just want to register a domain and not host anything there  <br>for a while, then Dotster is a great choice because it's dirt cheap.</p>
