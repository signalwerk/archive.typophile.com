    html: <p>I really like <a href="http://www.dotster.com/">Dotster</a>. They manage to take the pain out of .ca registrations, as well as handling all of the other popular top level domains. And if you're stuck for finding that perfect domain name, their alternate available domain suggestion feature is very handy.</p>
