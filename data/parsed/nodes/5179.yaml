    html: <p>I ended up with NetBeat, a common hoster in Germany (which, I found out after the fact, is headquartered in Vienna). They should be all right for what we needed. Thanks for all of the advice! <br> <br><a href="http://www.typeoff.de" target="_blank">http://www.typeoff.de</a></p>
