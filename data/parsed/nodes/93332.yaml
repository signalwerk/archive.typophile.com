    html: |-
      <p>The Sarcmark!</p>
      <blockquote><p>... important enough to show up in standard Latin fonts ...</p></blockquote>
      <p>Oh wait ...</p>
      <p>I don't think that there have been major additions in Latin/CE fonts lately. The last really major one, influencing <em>every</em> font, was indeed the Euro sign. Anything else has been quite font specific -- i.e., up to the designer's whims.</p>
      <p>If your own font set goes back more than a decade or so, you could put a modern one and an old one side by side and compare them. A modern version of an old font might typically contain more ligatures, small caps, and different digit styles; perhaps some (or lots) of extra accented characters (because Opentype allows more code points to be defined in the font than, say, Type 1 fonts, it makes sense to include lots of them rather than relying on non-spacing accents and having the user combine them themselves).<br>
      However, I can predict with some confidence the "basic" characters section will be unchanged.</p>
