    <p>I'm trying to get a handle on new characters that have emerged in recent years, which are important enough to show up in standard Latin fonts (western + CE accented). Also secondarily curious about anything relevant to Greek and Cyrillic.</p>
    <p>The ones I know about are currency symbols, such as the new symbols for the Turkish lira (U+20BA, <a href="http://typophile.com/node/90604" title="http://typophile.com/node/90604">http://typophile.com/node/90604</a>), and the Indian rupee (U+20B9). Older ones include the Ukrainian hryvna (U+20B4) and Ghanaian cedi. Are there others I should be concerned with?</p>
