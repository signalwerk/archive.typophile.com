      <p>Only a very rough record:</p>
      <p>LATIN<br>
      Considerable additions were made, especially for scientific usage. E.g:<br>
      • five new, 1E9B to 1E9F (among: ẞ)<br>
      • Latin Ext. C<br>
      • Latin Ext. D<br>
      • u10190 block, Roman numerals<br>
      • Monetaria: 4 new, 20B6 to 20B9<br>
      • 1DC0 block</p>
      <p>CYRILLIC<br>
      • several new ch.s in the 0500 block<br>
      • new Ext. block A640<br>
      • new comb. diacritics block 2DE0</p>
      <p>GREEK<br>
      nothing new (as far as I’m aware of)</p>
