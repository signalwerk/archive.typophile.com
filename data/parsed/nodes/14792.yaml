    html: |-
      <p>I would work on your information heirarchy and get that happening. I found it hard to work out what was going on. It might be worth considering a layout more like an old style newspaper, using more old school fonts. I would avoid using Helvetica/arial, I don't think it quite suits the material.<br>
      The headings need to stand out more - perhaps darken them, and use a similar font tho that used on hte heading. It may or may not be ledgible if it's too small though.<br>
      The information in the scroll bar might be better suited to a drop dpwn menu. That way, the heirarchy of information can be presented in a clearer way.<br>
      The diagram of the card making process is a very strong element that perhaps deserves its own page.<br>
      I would consider breaking the information on this page down into sub pages. Although it's nice to have everything presented here, it means that all the items are competing with one another. To that end, consider having the headings you have, but reduce the text under them to a minmum and have a "more" link to a new page that has all the details.<br>
      Consolidate your fonts and paragrpah styles and keep them consistent. Increase contrast. Make tighter boxes of information with more space around them.<br>
      I'll try to dig out some examples of what I mean when I get home.<br>
      Hope that helps.</p>
