      <p>Generally, I agree with previous comments that it's too busy, and there's a lack of hierarchy - or reading sequence.</p>
      <p>The ANTHROPOLOGIE section is impossible to read/scan.<br>
      Its viewport is too short, resulting in scrolling becoming too 'fast'. Context disappears as you read.</p>
      <p>On this monitor, I get both vertical and horizontal scrollbars. That's a problem I think if you want to really bring home the horizontal concept(and it needs to be brought home since it is not 'standard praxis'). Make sure the site's height at least fits on a 768px screen (somewhere around 520-560px I'd guess).</p>
