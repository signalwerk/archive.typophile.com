      <p>I agree with ubergrafik about breaking it out over a few pages. Treat each area as a singular creation with great focus and care in the details. Kind of like the stationary. I also agree with Eben about the header, it needs focus. It looks jumbled and less refined next to the subheaders (such as 'News + Updates', etc.).</p>
      <p>Get rid of that Helvetica and replace it with the type used for the states, or something more appropriate.</p>
      <p>I'm not a fan of horizontal scrolling, but it's not a deadlly choice or anything. Humans may have a horizontal "experience" but my mouse has a vertical one. But, again, it's really a matter of small degrees of annoyance.</p>
      <p>I also find the tight cropping on the pattern examples annoying. They're great, let me see more!</p>
      <p>Make that copyright mark smaller. It ruins the feel of the site by sitting there like a Coke can in historical Williamsburg. </p>
      <p>Overall, good stuff. It needs refining, but you've got a lot of intriguing material and a good start.</p>
