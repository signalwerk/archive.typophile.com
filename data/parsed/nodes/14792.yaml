      <p>I like the horizontal format, it lays out the basic information in an attractive, clear way and rather than having separate pages and open tabs or windows to refer to, allows the reader to scroll across, although I think you could standardise your heading style (type size) and have a separate column for each section (the columns need not be of equal measure but should have equal gutters). I have questions about the title, why is the rabbit there? Is it blowing a musical instrument or holding a rake? Why is it falling off the O? I think that the stationers part of the title should be the same size as Old School or on a new line with an uppercase S and the whole title should fit the measure of either 1 or 2 columns.<br>
      Tim</p>
