  html: <p>Hello friends, <br> <br>I came across this handwritten type and wondered if anyone could help identify it please. <br> <br><img src="http://www.typophile.com/forums/messages/83/20261.gif" alt="the handwritten type"> <br> <br>The closest I came was <a href="http://www.myfonts.com/fonts/linotype/bradley-hand-itc/" target="_blank">Bradley Hand</a>, but that's not it. Notice the number 1 used as a capital i. <br> <br>Thanks for your help!</p>
  html_clean: <p>Hello friends, <br> <br>I came across this handwritten type and wondered if anyone could help identify it please. <br> <br><img src="http://www.typophile.com/forums/messages/83/20261.gif" alt="the handwritten type"> <br> <br>The closest I came was <a href="http://www.myfonts.com/fonts/linotype/bradley-hand-itc/" target="_blank" class="link-external">Bradley Hand</a>, but that's not it. Notice the number 1 used as a capital i. <br> <br>Thanks for your help!</p>
