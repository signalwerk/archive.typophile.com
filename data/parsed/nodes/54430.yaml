    html: |-
      <p>Some observations, which may or may not be worth addressing:</p>
      <p>I agree with Thomas on the A, think it needs narrowing quite a bit.</p>
      <p>B looks a bit dark, the top bowl could be bigger to give more counterspace and lighten the glyph?</p>
      <p>E and F are really interesting shapes.</p>
      <p>C, G, O, Q and S definitely need some overshoot. C and D and G look a bit light.</p>
      <p>The vertical stem on G looks a bit tall.</p>
      <p>The flared serifs on I and L are not the same as other characters. </p>
      <p>There's something odd happening on the join of K and the lower leg could start a tiny bit nearer the join?</p>
      <p>M is interesting too. You might need some overshoot at the top. The flared feet should be curved to match other letters.</p>
      <p>That's a really nice tail on the Q.</p>
      <p>Make the spine of S a bit heavier?</p>
      <p>Tighten the inner counter of the U, the curve looks a little loose.</p>
      <p>VWXYZ need curves I think.</p>
      <p>Lowercase:</p>
      <p>Generally, you need overshoot on the bowl characters, and some of the curves will need smoothing. The joins also.</p>
      <p>The ear of g needs to be more sure of itself and more flowing from the bowl, perhaps with a curve somewhere.</p>
      <p>I just noticed your tittles! I think on the exclamation mark the dot should be inverted. </p>
      <p>t looks out of character and I think the top needs reviewing.</p>
      <p>v looks like the point is too far left. </p>
      <p>Are you working on the numerals?</p>
      <p>It'll be very interesting to see how this develops. I think your strongest glyphs are EFMNQS and acfgsy. You could use them to preview other letters against, in order to harmonise the curves more.</p>
      <p>Hope that's helpful! :)</p>
