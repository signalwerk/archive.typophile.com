      <p>I liked the general feel of it at first glance, but there are a lot of stuff that need attention here.</p>
      <p>I would advice against breaking the connection (crossbar) in lowercase æ. A better solution would be a diagonal connection. Also, your å/Å is sloppy. The ring should not touch the letter — it should be centered above it. The ring would also benefit from a shape more like your o in terms of contrast and axis. I also don’t think the slash in Ø/ø is working: It’s to long, not centered and in need of some optical correction. </p>
      <p>In general I think most of your diacritics and a lot of the glyphs listed under “other” need more work. I especially noticed your ogoneks. We had a thread on that topic a short while ago. Do a search for more information.</p>
      <p>Thorn (uc) and eth (lc) should sit on the baseline with the other glyphs.<br>
      I’m uncertain about your p descender.<br>
      O and o don’t have the same contrast or axis.<br>
      C, G, c and e are leaning left.<br>
      r needs work.<br>
      The eye of g is optically lighter than the tail.<br>
      I think u might be too wide.<br>
      y does not look balanced to me.<br>
      Some of the numbers look sqoushed.<br>
      s too narrow?<br>
      Hairlines in x/X need optical adjustments.</p>
      <p>There are optical problems all over the place: the x-height isn’t consistent, a lot of the connections between curves and stems get very heavy and what’s with the lowered Ñ? And why is the tilde so different from the lc version?</p>
      <p>That’s my two cents. Forgive me for the lack of proper terminology — I’m not a professional type designer quite yet, so please take my advice with a grain of salt.</p>
