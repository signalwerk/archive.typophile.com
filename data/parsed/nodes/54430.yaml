      <p>Impressive!</p>
      <p>A thick base for Delta would probably be a good idea.</p>
      <p>You probably know this already, but the problem of stress in tau could take some more thought. Taper the vertical thinner to the join?</p>
      <p>I'm not an expert, but Cyrillic stone inscriptions in this sort of style seem to favor the form of Л that looks like Λ and Д that looks like Δ with spurs. It's more "historical". It would be good to have them as alternates at least. See Castle's <a href="http://castletype.posterous.com/work-in-progress-goudy-trajan-pro">Goudy Trajan</a> for example.</p>
