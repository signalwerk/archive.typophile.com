      <p>Definitely (as a Swede) would advice against the new umlaut form, /Ä/ and /Ö/ need to be recognisable in running text and I'm not sure they are with the tittles spaced that far apart - they just look like decorated /A/ and /O/.</p>
      <p>Oh, and as a Hungarian I think your double acutes could be a fair bit further right, looks wonky this way. ;) In any case you'd need to harmonize the umlauts and the double acutes, as the latter is the long form of the latter - if you do end up with the broad umlauts on the /Ö/, You really need to do the same arrangement for /Ő/.</p>
    html_clean: |-
