  html: |-
    <p>Classical. This book is simply and clearly laid out, beginning with a primer on lettering and typography. This is followed by detailed description of Airport, a typeface Colin Forbes and Matthew Carter adapted from Akzidenz Standard for London’s Heathrow Airport in the early 1960s. Is any one know the typeface is custom-made and never existing? Or, I can find it in today’s type foundry? Please advise. Many thanks!</p>
