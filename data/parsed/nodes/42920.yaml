  html: |-
    <p>Hi</p>
    <p>Does anyone knows how to auto numbering pages with 3 digits in indesign cs3? So insted of 1, 2, 3 and so on, it would be 001, 002, 003, 004? I just can´t see how it can be done?</p>
    <p>Thanks in advance </p>
    <p>Regards</p>
