    html: |-
      <p>Hi Kiko,</p>
      <p>I don’t know if padding (always having three digits) is an option. Don’t think so.</p>
      <p>But there’s a quite simple workaround: create 3 master pages (can be cascading).<br>
      The first has ‘00+<em>A</em>’ as page number and gets applied to pages 1–9. The second has  ‘0+<em>A</em>’ and is for pages 10–99. And the third has the plain ‘<em>A</em>’, for pages 100–999.</p>
      <p>The leading zeros are ‘hard-coded’, <em>A</em> stands for the automatically inserted page number.<br>
      F</p>
