      <p>In a slightly complicated way you could make a master page with 00 (two zeros)+current page number for pages 1-9, then 0+current page number for pages 10-99. Can't think of a cleverer way around it, even though there might be one.</p>
      <p>Edit: Florian was the faster typist!!</p>
