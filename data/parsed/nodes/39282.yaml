    <p>Here are my preliminary designs for a logo for a salon called Panache.  They just did a complete remodel and would like a new logo to reflect their new look. The following is a brief description I was given of the salon:</p>
    <p>Main Colors…Copper/Shimmer Bronze</p>
    <p>                     Contemporary &amp; Classy/Modern</p>
    <p>                     Brushed Steel Benches with Black Leather</p>
    <p>                     Straight Lines</p>
    <p>                     Silver w/Black accents</p>
    <p>                     Taupe w/Green in it</p>
    <p>                     Soft Blue shimmer in massage area</p>
    <p>This is a link to the styling chairs for the salon…they are black  <a href="http://www.takarabelmont.com/custom_express_plus/color_config.wu?categid=0049&amp;photoid=0695" title="http://www.takarabelmont.com/custom_express_plus/color_config.wu?categid=0049&amp;photoid=0695">http://www.takarabelmont.com/custom_express_plus/color_config.wu?categid...</a></p>
    <p>Let me know what you think.... the last one was just for fun. :) </p>
    <p>| UPDATE 11-30-07 |</p>
    <p>I have posted some new ideas based on feedback from the client. What you think?</p>
