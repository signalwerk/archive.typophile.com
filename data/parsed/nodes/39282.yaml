    html: <p>I don’t really feel like any of these really work. A &amp; B look dated, like something I saw on a shampoo bottle a few years ago. C &amp; D are just gratuitous and don’t reflect high-style. E looks like you were starting something and walked away from it in the middle of merging some letters, F looks like it goes on an environmentally-friendly kids product.</p>
