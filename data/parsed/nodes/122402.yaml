    html: |-
      <div class="comment-spam-body"><p>I presume that your reference to 1981 refers to the date of the photograph. The building is obviously much older, perhaps pre-WWI.<br>
      As for the sign I note the difference in the two _E_ letters.<br>
      Seems that part of the letter has broken off.<br>
      Not a new sign. But I wonder when it was installed.<br>
      Until recent decades large sign letters were designed by various makers who did not necessarily base them on a specific font.<br>
      But I trust someone will suggest some sources for matching individual letters.<br>
      The low waist _R_ with a straight leg from where the bowl meets the vertical stroke, and the top heavy _S_ are a fair match to Erbar Grotesk Extra Garnitur introduced by Ludwig &amp; Mayer Frankfurt in 1927.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/ErbarGroteskGarnitur1927SM_6491.jpg"></div><br>
      This version of Erbar is not digitized.<br>
      Don<p></p>
      </div>
