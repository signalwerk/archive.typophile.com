    <p>Hello Typophiles,</p>
    <p>I've been working on a new typeface for quite a while now and have decided to use it as an excercise to learn a bit about OpenType fonts. I've added an alternative 'a' to the font as well as a set of ligatures. When I view the font in Illustrator or Indesign the font appears at the bottom of the menu instead of at the top. Is there something i'm doing wrong when exporting?</p>
    <p>Many thanks!</p>
    <p>Dave Lawless</p>
