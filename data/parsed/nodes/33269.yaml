  - id: 198881
    user: 8474
    date: 2007-04-24T08:39:00
    date_raw: 24 Apr 2007 — 8:39am
    votes: null
    html: |-
      <p>I'm not sure this is really a bug. Some programs choose to separate some fonts on the basis of their encoding. You may notice other strange things, like Mac OS guessing at the encoding of your font and getting it wrong and so giving you an unexpected preview. When I preview mine, I often find that it chooses to show me the Cyrillic instead of the Latin.</p>
      <p>If that's the case as well, then it's an encoding issue. If you include a proper codepage, it should recognize it correctly and maybe also put it back in the right place in the menu.</p>
      <p>However, I've also noticed other problems when I include extra codepages, such as the encoding getting completely mangled and most of the characters missing. I'm not sure where the problem is there, but I think it might be with Fontlab (or my settings).</p>
