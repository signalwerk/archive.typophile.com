    html: "<p>Default linespacing of TT fonts in MS apps is based on a combination of two values in the OS/2 table: <br>   WinAscent <br>   WinDescent <br> <br>Simplistically, if you reduce these values, the linespacing will be tighter. <br> <br>Ideally, there is also a relationship between these two values and the combination of the other vertical metrics values in the OS/2 table <br> <br>   typoAscender <br>   typoDescender <br>   typoLineGap <br> <br>which should, expressed as positive integers, equal the sum of the WinAscent and WinDescent values. However, for your purposes you can probably get away with just adjusting the WinAscent and WinDescent. Rather than adjusting them by equal amounts, you should take a look at the relationship of the actual ascender and descender heights of the <i>d</i> and <i>p</i> glyphs to these values, and determine which of the values needs most adjustment. <br> <br>This thread probably belongs in the 'Build' category.</p>"
