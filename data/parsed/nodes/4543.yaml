  html: <p>Hi <br> <br>Being a total noob, please bare with me :-) <br>I have a problem with the font called Akbar. Its "height" is too high when used on a Microsoft SmartPhone. I'm using High-Logic Font Creator Program and am looking for the Typographic term for the font "height" or how it is defined in a TTF. <br> <br>What can I do? <br> <br>Help, please <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> <br> <br>Thank You<img src="http://www.typophile.com/forums/messages/4100/34734.jpg" alt="screenshot"></p>
