    html: |-
      <p><cite>Also has there been any change to the family-of-four-fonts thing? My guess is that Vista is the same as XP in this respect?</cite></p>
      <p>For existing and future GDI applications, there is no change.</p>
      <p>Microsoft’s new Windows Presentation Foundation (WPF) handles font names in a completely new way, based on trying to shoehorn them into families that fit within the CSS spec’s ideas of how family members can differ. WPF is an optional install with Vista, and will also be made available for XP. Applications that use WPF will get the new font menus.</p>
      <p>Here are the slides from my presentation on the topic, which was aimed at font developers rather than application developers: <a href="http://blogs.adobe.com/typblography/atypi2006/CSS%20&amp;%20OT%2015.pdf" title="http://blogs.adobe.com/typblography/atypi2006/CSS%20&amp;%20OT%2015.pdf">http://blogs.adobe.com/typblography/atypi2006/CSS%20&amp;%20OT%2015.pdf</a></p>
      <p>If it's not already up, I'm sure MS will have info on this posted soon.</p>
      <p>Regards,</p>
      <p>T</p>
