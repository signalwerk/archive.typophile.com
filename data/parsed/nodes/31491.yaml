    votes: null
    html: |-
      <p>Actually, the W3C are not directly involved - this is just Microsoft trying to shoehorn existing fonts into the CSS spec.</p>
      <p>The problem is that the CSS spec's handling of fonts is badly broken, or at best it is suitable for font <em>substitution</em> to find a reasonable replacement from a different family when the actual font is not available. However, using it for font <em>specification</em> seems goofy to me.</p>
      <p>Plus, as you say, it is "yet another set of names" that is not cleanly related to any of the existing names. But on the plus side, it is a huge advance over where Windows is today, so I am tempted to stifle my complaints.</p>
      <p>Cheers,</p>
      <p>T</p>
