      <p>Faces such as Broadway and Hobo were mined from popular styles developed by lettering artists.</p>
      <p>No doubt one person came up with the prototype, but after the style had gained some traction in the media, having been swiped/reinterpreted by other letterers, than it would have attracted the attention of the new font committee at ATF.</p>
      <p>One can imagine a meeting where a number of different examples of a particular style were compared, and a consensus reached as to the direction a type based on the style should take. </p>
      <p>A very similar process to how many custom types are commissioned today. Back then at ATF, the draftsperson  was not credited, but now, if the work is supplied by an “independent” foundry, that person may well be credited as the designer.</p>
      <p>If the expectation is that authorship in type design belongs to the draftsperson, then we can say that that person is the designer.</p>
      <p>But if the situation is more like modern art in the present, conceptual era, where the idea is the main thing not the making, which may often be done by anonymous artisans, then the author may be considered the artist or art director, whether or not he/she does the drawing.</p>
