      <p><em> …would they not have to be a type designer and then a super type designer first, before director of hundreds of type designers, second?</em></p>
      <p>Why do you think the two can be separated, in the case of Benton?<br>
      His way of designing type was very much caught up with, and developed within, the context of the large industrial establishment in which has father played so prominent a role as an inventor.<br>
      Bear in mind that his degree was in engineering, so he did not develop as a type designer in the manner of the commercial artist — the path followed by his more famous contemporaries. One important part of that was that they were of necessity self-promoters, which he, as a corporate man not a freelancer in trade, didn’t have to be.</p>
      <p>If he had an antipathy, for whatever reason, towards presenting himself as a professionally creative individual, well, he has certainly been able to fool most of the people most of the time, including Rick von Holdt.</p>
