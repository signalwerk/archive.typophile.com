      <p>David, I’m on topic.<br>
      The issue is, how much work—both conceptual and production—does someone have to do to be considered the designer of a typeface?</p>
      <p>Benton’s reputation has suffered because he was the “art director” at ATF.<br>
      Compare with Goudy, Cooper and Dwiggins, whose lettering work demonstrated their hand skills, and whose type designs were their own original concepts (mostly).</p>
      <p>Benton’s work was conceptually subtler and more adaptive than Goudy, Cooper and Dwiggins; there is no record of his handwork (AFAIK); and at ATF there was a production line where unaccredited draftspersons produced the glyph drawings, under his art direction.</p>
      <p>We have letters between Dwiggins and Griffiths discussing the implementation of WAD’s drawings, but are there production notes from ATF concerning any of Benton’s faces? Where are his sketches?</p>
      <p>Consider also the relationship between Hermann Zapf and August Rosenberger. Had Zapf not been involved in the production of Palatino, but Rosenberger had adapted it from his lettering (as Slimbach adapted Caﬂisch), would Rosenberger have been considered the designer of the typeface?</p>
      <p>Zapf and Frutiger both did very little work on the “Nova” versions of their faces executed by Kobayashi, they art directed, I would say. For instance, in the old style ﬁgures for Frutiger Nova, Frutiger had sketched the ﬁgures extremely roughly, with “4” standing on the baseline, no descender. Kobayashi corrected that.</p>
      <p>The assignation of authorship is not as simple as “who does what”.</p>
      <p>**</p>
      <p>One can have it both ways.<br>
      If one draws a revival, one is called the designer of the new typeface, even if one is careful to credit the original and not call oneself the designer.<br>
      And yet if one does sketches for an original design, and art directs someone else doing the drawing, one may still be considered the designer of the new typeface.<br>
      Follow the money.</p>
      <p>Stanley Morison admitted to having “excogitated” Times New Roman, but was for many years credited as the designer. Now wiki says he commissioned it, and Victor Lardent drew it. So nobody designed it!</p>
      <p>**</p>
      <p>Over the years, the action in the arts has shifted from making, through direction, to curation.<br>
      Janet Cardiff’s <em>Forty Part Motet</em> is a piece of installation art, in which she neither composed nor performed the music, or made the loudspeakers. It was her idea.<br>
      If that is how things are now in the art world, I would say this article has it wrong, and that Morris Benton will be getting more recognition in the font world, as a type designer, on those terms.</p>
