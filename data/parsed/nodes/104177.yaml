      <p>Outstanding discussion.<br>
      I see M.F. Benton as akin to Edison, "inventor" of the light blub.<br>
      What Edison did was not the actual bench work testing filaments &amp; pumps, but setting up one of the first modern research labs with planning, management etc. that brought it all together and produced results -- and credit for Edison.<br>
      So why should we fault M.F. Benton for doing the same thing in his transformation of ATF from a vendor of  a hodgepodge of types by the foundries brought into the combine to a focused design enterprise with outstanding technical capabilities.? </p>
      <p>Don</p>
