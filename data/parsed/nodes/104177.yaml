      <p>David, ATF was a factory with division of labour commensurate with its size.</p>
      <p>That is why the design of type was split into different segments along the production process, and why it was possible for Morris Benton to art direct so many typeface designs, just as Cedric Gibbons art directed all those movies for MGM.</p>
      <p>It’s a different notion of design than the hands-on craftsmanship practised by Fred Goudy (in the latter part of his career), and by those with Fontographer in the 1990s.</p>
      <p>If one expects a proper type designer to be drawing the prototype of each letter, then Benton was riding on the coat-tails of others who did the hand work—and that is why he has not been raised in the pantheon along side Cooper, Goudy and Dwiggins. We like to see some artistry in type design, and associate it with individual authorship, not the impersonality of industrial production and the assembly line. However, if one approaches design as a more conceptual kind of work, then someone like Benton deserves more recognition.<br><img src="/sites/default/files/old-images/graphic-arts-and-crafts-year-book-1910-376-atf-factory-0600rgb-rot0p3cw-crop-factory-2852x2692-scale-512x483_3708.jpg"></p>
