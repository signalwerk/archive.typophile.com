    html: <p>The masthead is probably custom, the bold headlines handwritten (cf. the different ‘A’ and ‘N’ glyphs in ‘HALINA REIJN’). The condensed headline seems to be a font, but it’s likely to be exclusive. Better sample <a href="http://blog.123tijdschrift.nl/wp-content/uploads/2012/10/Nieuw-bij-123tijdschrift.nl-De-Liefde.jpg" rel="nofollow">here</a>.</p>
