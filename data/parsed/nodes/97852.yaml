    html: <p>Your second image is actually <a href="/wiki/https%3A/%252Fwww.google.com/search%3Fq%3Dherb%2Blubalin%2Bmonogram%2526hl%3Dfr%2526safe%3Doff%2526client%3Dsafari%2526tbo%3Dd%2526source%3Dlnms%2526tbm%3Disch%2526sa%3DX%2526ei%3DKyukULjVFOml0QWcz4GQCg%2526ved%3D0CAkQ_AUoAQ%2526biw%3D1024%2526bih%3D672" class="freelinking" rel="nofollow">Herb Lubalin monogram</a>, one of his numbering letterings. And I guess you're right for Bookman Swash, probably a good alternative to work on. I strongly encourage you to have a look to Mark Simonson's fantastic revival of Bookman called <a class="freelinking external" href="http://www.myfonts.com/fonts/marksimonson/bookmania/" rel="nofollow">Bookmania</a>, full of swashes (680!) and alternate characters.</p>
    html_clean: <p>Your second image is actually <a href="https://www.google.com/search?q=herb+lubalin+monogram&amp;hl=fr&amp;safe=off&amp;client=safari&amp;tbo=d&amp;source=lnms&amp;tbm=isch&amp;sa=X&amp;ei=KyukULjVFOml0QWcz4GQCg&amp;ved=0CAkQ_AUoAQ&amp;biw=1024&amp;bih=672" class="freelinking link-external" rel="nofollow">Herb Lubalin monogram</a>, one of his numbering letterings. And I guess you're right for Bookman Swash, probably a good alternative to work on. I strongly encourage you to have a look to Mark Simonson's fantastic revival of Bookman called <a class="freelinking external link-external" href="http://www.myfonts.com/fonts/marksimonson/bookmania/" rel="nofollow">Bookmania</a>, full of swashes (680!) and alternate characters.</p>
