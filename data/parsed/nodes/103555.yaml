      <p>Again, don't know much about the nature of the client, but:<br>
      If you're chopping off a half-serif from the "el" (which I like BTW) you might pull that off with the "y" too. I would also consider making everything (or maybe almost everything) flat - I'm thinking top/bottom of the "C", bottom of the "e", and/or bottom of the "y" (which might convey an air of stability befitting a government contractor).</p>
      <p>hhp</p>
