      <p>This is too cute, it has some sort of baby giraffe feel to it. I'd revert to the previous version of 'y'. </p>
      <p>There's absolutely no need to get all serifs consistent across the words. It is not a wall of text, it's just a set of specific glyphs and while it's nice to have some consistency between them it is certainly not a requirement, nor even a priority. I think the version from 2:38 pm is really good, it matches your brief well, so I wouldn't over-think things and simply go with it. It is indeed very good.</p>
