    <p>I'm working on a wordmark for a consulting firm that mostly does business with the government. Currently it's just ff Olsen with some minor alterations (rounded Corners, shortened ascender and took in the serifs a bit).</p>
    <p>Let me know what you think. Is it too plain? awkward looking etc... I think I'm losing the forest for the trees on this one and need some feedback.</p>
    <p>Thanks</p>
