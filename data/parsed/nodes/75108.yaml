    html: |-
      <p>There are a number of different factors that can increase the byte size of a font significantly, independent of something obvious like the number of glyphs in a font. One is the UPM size: the higher the UPM value, the greater the number of coordinates that will involve 3 or 4 digit values instead of 2 or 3 digit values, ergo a more bytes. Another is outline complexity, i.e. the number of points used to define the outlines: more points equals more bytes. Another is the number and complexity of OpenType Layout lookups.</p>
      <p>What matters in all these cases, in terms of functionality, is not the byte size of the font but the processing that have to be applied, e.g. rasterising a complex outline or performing iterative contextual GPOS positioning lookups, and how these fast these processes can be performed.</p>
      <p>Generally speaking, the kind of processing memory limitations that would once have made some of this issues critical have been resolved through increased computing power and optimisation of processes. As an example, when Adobe first digitised Jovica Veljovic's Ex Ponto typeface in Type 1 format, they had to spend a lot of time figuring out how to be true to the complexity of the design while not overloading the capabilities of the raster imaging machines of the time. This would not be an issue today because so much more processing memory is available. As another example, when I made the first version of the SBL Hebrew font it was incredibly slow in e.g. Word because of the number of contextual GPOS lookups for Biblical Hebrew, but Microsoft were able to optimise the Uniscribe layout engine code in the next release of Windows and Office, and the font worked 20 times faster.</p>
      <p>I doubt if you are hitting anything that I would consider a dangerous threshold.</p>
      <p>As for CorelDraw...</p>
