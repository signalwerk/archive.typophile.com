  html: |-
    <p>Dear Customers, Fans, Visitors:</p>
    <p>Fontpartners.com are now going to present the update of our typefamily FP Head:<br>
    A Pro Extended Latin version: 5 weights + Italics, 530 characters in each, all in Opentype format, of course.</p>
    <p>FP Head Pro is a broad headline font, with a blur-style architecture.<br>
    The typeface has a touch of FF Max, hard and soft at the same time. </p>
    <p>1 weight: 50 Euro<br>
    1 package: 185 Euro (Contains: Light, Book, Medium, Bold, Black)</p>
    <p>Please have a look at our PR-movie on Facebook:</p>
    <p><a href="http://www.facebook.com/pages/Fontpartnerscom/33187212502" title="http://www.facebook.com/pages/Fontpartnerscom/33187212502">http://www.facebook.com/pages/Fontpartnerscom/33187212502</a></p>
    <p>Hope you like the family!</p>
    <p>Sincerely,<br>
    Morten Rostgaard Olsen<br>
    Ole Søndergaard</p>
    <p><a href="http://www.fontpartners.com" title="www.fontpartners.com">www.fontpartners.com</a></p>
