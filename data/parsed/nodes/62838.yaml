    html: |-
      <p>Matt, you said you understand the concept so I'll write how I started: When I made my first subpixel design last year (only one word), I took some screenshots of OS rendering of black text. I chose and saved five colors of red and five of blue, each ranging from the lightest to the darkest. I think I first made some diagonals for exercise :-) Designing with subpixels is similar to pixel art, consequently you use its strategies: for example, working with 32× magnification and looking on 1× scale opened in the other window at the same time.</p>
      <p>"<cite>What file types support it?</cite>"<br>
      I just add a maybe obvious information that the format has to be lossless (PGN or GIF) and "saved for web".</p>
      <p>"<cite>How do you render type or graphics accurately using subpixels?</cite>"<br>
      You (or the viewer) has to have a LCD monitor, set in native resolution, with image displayed with 1× magnification. Monitor must not be used rotated and must have a RGB ordering of subpixels. According to Microsoft, a "very small number" of LCD screens use BRG ordering.</p>
      <p>Subpixel art is appropriate in the smallest sizes, because there you can be better than rasterisers!</p>
      <p>William, a "potentially huge deluge of information" is certainly a possible danger in this thread. :-)</p>
