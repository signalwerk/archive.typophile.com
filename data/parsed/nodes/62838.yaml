      <p>@mike_duggan<br>
      <em>"the only browser I see Frankly in is Safari. Why is that?"</em><br>
      The Franky demo uses the @font-face CSS rule to call TTF fonts into the page.<br>
      Safari is probably the only browser you currently have installed that supports it.<br>
      You can also use: Firefox &gt; 3.5.x, Opera 10, or Chrome with web fonts <a href="http://paulirish.com/2009/chrome-and-font-face-a-summary/" rel="nofollow">enabled</a>. (Note: haven't tested the Franky page in any of these yet.)</p>
      <p>Cheers, Rich</p>
