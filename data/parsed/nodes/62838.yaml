      <p>Hey Matt, would you hone your questions a bit with specifics about your intent? Unless you want another potentially huge deluge of information around the subject of subpixels, antialiasing, graphics libraries, and gameboy advance homebrewing etc. (which is already abundantly available courtesy of <a class="freelinking external" href="http://www.typophile.com/user/48230" rel="nofollow">John Haugeland</a> over at <a class="freelinking external" href="http://www.typophile.com/node/61920" rel="nofollow">miha’s flea’s knees thread</a>) I would suggest narrowing your focus. This sounds like a general request on the subject – which is totally valid – but please tell us more about the contexts in which you are interested.</p>
      <p><cite>What file types support it?</cite></p>
      <p>For bitmap images, I can answer this unequivocally: any file type that supports color allows you to address subpixels. Also, the sharpest and most effective subpixel antialiasing/rendering is achieved at the border between pure white and pure black.</p>
      <p>Sincerely,<br>
      William Leverette</p>
