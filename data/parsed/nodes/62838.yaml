    <p>Maybe this should just be a question for miha, but I'll put it out to everyone:</p>
    <p><strong>How does one create a subpixel rendering?</strong></p>
    <p>I understand the concept of it but I don't really know where to start with it. </p>
    <p>What tools should you use? Is Photoshop the way to go?<br>
    What file types support it?<br>
    How do you render type or graphics accurately using subpixels?</p>
    <p>Thanks in advance.</p>
