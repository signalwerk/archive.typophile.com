      <p>&gt;You (or the viewer) has to have a LCD monitor, set in native resolution, with image displayed with 1× magnification.</p>
      <p>And, you don't need to make bitmaps to do this, you can use outlines. Just set the grid in your font design program to the number of pixels in the target font size, set the sample window of text to that size, and you are drawing outlines to a particular grid size, seeing the results live. And, you can reuse the outline for other sizes, other grids. <a href="http://fontbureau.com/test/franky/" title="http://fontbureau.com/test/franky/">http://fontbureau.com/test/franky/</a> is an example on a design far less tiny and interesting than Miha's. . . but you have to follow Miha's above instructions to see it correctly. </p>
      <p>Cheers!</p>
