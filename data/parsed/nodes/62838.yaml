      <p>William Leverette:<br>
      <cite><br>
      Also, the sharpest and most effective subpixel antialiasing/rendering is achieved at the border between pure white and pure black.<br>
      </cite></p>
      <p>From my understanding of your comment, you're saying that the division between the blue and red pixels (on an RGB LCD screen) is stronger than at other subpixel boundaries.  This also seems to be the case to me, but why is that?</p>
      <p>ClearType and other similar subpixel rendering schemes seem to use the same low-pass filter that is applied to each color (and this is corroborated by everything I've read, including Platt's paper).  Here they seem to be ignoring any differences between divisions.  Could sharper rendering be achieved by somehow taking into account this division?</p>
      <p>Best wishes,<br>
      Stephen</p>
