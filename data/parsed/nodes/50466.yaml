      <p>In <cite>Counterpunch</cite>, Fred Smeijers states that it was Van den Keere’s 2-line Double Pica Roman (or Gros Canon) that inspired Renard, not the Paragon Roman. But yes, Renard was inspired by Van den Keere, not Arnhem. (Arnhem traces its roots to Romain du Roi and neo-classical styles, not Dutch oldstyle.)</p>
      <p>— K.</p>
