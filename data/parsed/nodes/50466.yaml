      <p>Frank says that it is DTL Van de Keere. Hrant says the Fred font design is Renard. And Marina Garone Gravier suggested these books:</p>
      <p>- Harry Carter, “Plantin’s Types and Their Maker’s, Gedenkboek der Plantin Dagen, Antwerp, 1955.<br>
      - Typographcia Plantiniana. II Early Inventories of Punches, Matrices, and Moulds, in the Plantin-Moretus Archives, De Gulden Passer, 37e. Jaargeng 1959.<br>
      - Harry Carter, “The Types of Christopher Plantin” The Library, vol. II, 1956</p>
