      <p>Eben - Is the eyebytes address still the one? 1200 dpi grayscale tiff okay for you? </p>
      <p>Hrant — I don’t know if this is the 2nd volume. Sounds like it. It’s a large folio format, about 10.5 x 16 inches, 68 pages, hard bound, red cloth over boards with gold stamping, gray paper wrapper, edition limited to 760 copies of which this is 292. It includes notes on and facsimile reproductions of the <cite>Index Sive Specimen Characterum Christophori Plantini 1567, Plantin’s Folio Specimen c. 1585,</cite> and <cite>The Le Bé-Moretus Collection of Fragments c. 1599.</cite></p>
