      <p>I have a copy of Vervliet &amp; Carter’s <cite>Type Specimen Facsimiles 16–18</cite>, which includes the Plantin Folio Specimen c. 1585. (Got this at an ATypI auction almost a decade ago.)</p>
      <p>There is a showing of a Reale Romaine, and the annotation explains: “One of the best Romans cut by Hendrik van den Keere. He cut it for Plantin in 1575. [citation] ... No use outside the Plantinian office is known to us.”</p>
      <p>Reale seems to be between Ascendonica and Parangonne in size, approx. 21 pts.</p>
      <p>Shall I presume that you’re looking for a hi-res image? I could porbably make time later this week. Contact me offline.</p>
      <p>— Kent.</p>
