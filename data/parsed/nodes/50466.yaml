    <p>Let’s talk about about Plantin’s Reale Romaine ( Also known as Van den Keere’s Paragon Roman )</p>
    <p>I found it today on page 253 of “16th century printing types” by H. D. L. Vervliet, 1968.</p>
    <p>According to Jan Middendorp in Dutch Type it has inspired Fred Smeijers ( Arnhem?), And Tobias Frere Jones’ Poyntner Oldstyle, and Frank van Blokland. </p>
    <p>I would love to see the face in use somewhere. I have one book listed: Rariorum aliquot stirpium historia, by C Clusius in 1576. Do you know of others? What techniques or resources would you use to find others?</p>
    <p>Thanks!</p>
