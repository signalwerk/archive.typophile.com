    html: <p>&gt; Anyone know any good font resources, retaliers  <br>&gt; where I can browse a good range and get an idea  <br>&gt; of what's available?  <br> <br>There's the <a href="http://www.typeproject.com/"> Axis Project</a>. It is very nice, and there's <br>even a Latin companion designed by Akira Kobayashi. <br> <br>Morisawa <a href="http://www.morisawa.co.jp/shop/index.html"> sells</a> some <a href="http://www.morisawa.co.jp/english/font_e.html">Japanese faces</a> too.</p>
