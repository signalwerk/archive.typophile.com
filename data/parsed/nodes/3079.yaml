    html: <p>There are Japanese fonts of about 1400 in Japan. We choose from them. <br>I also recommend you AXIS Font. The AXIS font is suitable for the web. <br> <br>1400 fonts are introduced. <br>WABUN(NIHONGO) FONTS LIBRARY (Not Retailers. Only Specimens.) <br><a href="http://ohkadesign.cool.ne.jp/wabunfont/library.html" target="_blank">http://ohkadesign.cool.ne.jp/wabunfont/library.html</a> <br> <br>The font which can be bought except Japan is the "Kozuka family" of Adobe. <br> <br>KOZUKA MINCHO &amp; GOTHIC <br><a href="http://www.adobe.com/type/browser/P/P_1801.jhtml" target="_blank">http://www.adobe.com/type/browser/P/P_1801.jhtml</a> <br><a href="http://www.adobe.com/type/browser/P/P_1800.jhtml" target="_blank">http://www.adobe.com/type/browser/P/P_1800.jhtml</a></p>
