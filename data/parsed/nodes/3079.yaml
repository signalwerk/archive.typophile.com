    html: <p>There are Japanese fonts of about 1400 in Japan. We choose from them. <br>I also recommend you <span class="caps">AXIS</span> Font. The <span class="caps">AXIS</span> font is suitable for the web. <br><br>1400 fonts are introduced. <br><span class="caps">WABUN</span>(<span class="caps">NIHONGO</span>) <span class="caps">FONTS</span> <span class="caps">LIBRARY</span> (Not Retailers. Only Specimens.) <br><a href="http://ohkadesign.cool.ne.jp/wabunfont/library.html" target="_blank">http://ohkadesign.cool.ne.jp/wabunfont/library.html</a> <br><br>The font which can be bought except Japan is the “Kozuka family” of Adobe. <br><br><span class="caps">KOZUKA</span> <span class="caps">MINCHO</span> <span class="amp">&amp;</span> <span class="caps">GOTHIC</span> <br><a href="http://www.adobe.com/type/browser/P/P_1801.jhtml" target="_blank">http://www.adobe.com/type/browser/P/P_1801.jhtml</a> <br><a href="http://www.adobe.com/type/browser/P/P_1800.jhtml" target="_blank">http://www.adobe.com/type/browser/P/P_1800.jhtml</a></p>
