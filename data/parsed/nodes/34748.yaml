      <p>“BTW I can’t quite support the idea of faux Chinese fonts being Chinoiserie.”</p>
      <p>I mentioned Chinoiserie as a probably historical starting point for the emergence of faux Chinese roman letterforms. Sorry for not clarifying. Chinoiserie’s importance goes beyond its role as an artistic movement; in Enlightenment Europe, especially England and France, the Chinese imperial system was taken to be highly advanced politically. Rousseau thought that China’s system of government most closely represented rule by a philosopher king. This valuation of China then had its influence on artistic and then popular spheres. I wouldn’t completely equate Chinoiserie with orientalism, as the latter has a stronger ideological edge. </p>
      <p>Fusaka, according to its own description, follows Chinese not with imitated brushstrokes, but by making each letter fit into a square. The extra lines and dots are based on portions of characters, as are many of the letters. The aesthetic of Chinese characters requires each character to be balanced in the context of a square. (Chinese fonts are of course monospaced.) And then in calligraphy, demands for overall page color will influence interaction between characters, especially in the highly cursive ’grassy’ styles. In Fusaka the extra dots for example in the J and L make more sense in the context of a square.</p>
    html_clean: |-
