      <p>Just an observation/question... When you see the examples posted so far, do you think they look at least vaguely Chinese/Japanese?</p>
      <p>Being Korean, I am quite familiar with the Chinese and Japanese scripts, and can’t force myself to look at them that way at all. From my cultural background, I honestly couldn’t have guessed from appearances alone that the ’faux-Chinese/Japanese’ lettering was meant to evoke the appearance of Chinese or Japanese scripts.</p>
      <p>The only reason I even knew that this sort of lettering style was meant to be used in contexts that had to do with East Asia was by association; I saw it often used in conjunction with kungfu and samurai themes, Chinese/Japanese restaurants, etc. It took some reflection to even come up with the notion that the lettering was mimicking the East Asian scripts; ’Hmm, the strange modulated curves <em>could</em> resemble the strokes of East Asian calligraphy to those who are not familiar with the scripts,’ I thought, not entirely convinced of my own conclusion.</p>
      <p>The thing is, there is some quite convincing faux-Japanese lettering out there, some of which at first glance might even fool me into thinking that I’m looking at some genuine Japanese kana. But none of the examples posted so far look really Chinese/Japanese to me. To my mind, this type of lettering really belongs to its own genre besides the more overtly faux-Japanese lettering style, which seems to have come in vogue more recently, possibly owing to anime culture.</p>
    html_clean: |-
