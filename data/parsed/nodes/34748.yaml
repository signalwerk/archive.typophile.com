      <p>Ooh, the thread (along with Typophile) is back.</p>
      <p>Timd : <cite>it looks more to me like taking a stroke of a chinese painting of a section of bamboo and using that stroke to create letterforms</cite></p>
      <p>This explanation makes the most sense to me. Reminds me, too, of a Chinese bamboo painting (attributed to Guan Yu, I think) which is in fact a poem/message in disguise: the characters are formed by bamboo leaves. I saw a stele in the ’Stele Forest’ in Xian, China that replicated this painting, and I took a photo of the rubbing (apologies for the blurry shot):</p>
      <p></p><div class="imageWrap"><img src="/files/bamboopoem_6092.jpg"></div><p></p>
      <p>Clever piece of art, but not what Chinese writing usually looks like.</p>
      <p>So I guess this is a case of taking a design element unrelated to script from a culture. A comparable hypothetical example would be if one took the Greek maeander and based a Latin typeface design on it to evoke Greekness.</p>
      <p>When I say faux-Japanese, <a href="http://991.com/newGallery/Linkin-Park-In-The-End---Live-203058.jpg">this</a> is closer to what I’m talking about—lettering that actually imitates Japanese scripts.</p>
      <p>The canonical model for basic strokes in Chinese calligraphy is based on the character 永. Depending on how you separate the strokes, you can get either eight or six, I think.</p>
      <p>Eben: <cite>Jongseong, how do you feel about the faux stuff? Does it offend you? I was going to relate how my Pal Jeff, who is a Chinese American feels but I am curious to hear from you.</cite></p>
      <p>I take it you mean culturally offended and not, you know, because of bad kerning or whatever. When I see the bamboo-stroke-type faux-Chinese lettering, I just think it’s a bit kitsch, but not really offensive. I simply don’t know enough about it to find anything offensive. As I said, I’m barely familiar enough with it to know that it’s supposed to evoke East Asian culture in the first place.</p>
      <p>From my Korean/international background, my take on Chinese/Japanese culture will be very different both from those approaching from a Western cultural background and from Chinese/Japanese backgrounds. I am also curious what a Chinese-American take on faux-Chinese lettering would be like. Do Chinese-Americans embrace this style, or reject it because of whatever reason?</p>
