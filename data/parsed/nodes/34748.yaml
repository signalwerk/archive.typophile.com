      <p>&gt;is there a distinction?</p>
      <p>The Chinese characters used for print have no circular strokes, and differ in this way from the Japanese Hiragana that Eben shows. They are straight, cornered, and curved with various terminals, but never circular. Chinese cursive writing or ’grass script’ does have circular strokes but it is not normally printed as text. Incidentally, Kanji is the Japanese translation of Hanzi, the Chinese word for their characters.</p>
