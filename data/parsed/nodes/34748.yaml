      <p>Here is a comparison of the characters drawn by the missionary with a modern font with brush-style appearance. You can get a good idea of how weak and floppy his drawings are. (Properly speaking, characters are written, not drawn.)</p>
      <p></p><div class="imageWrap"><img src="/files/comparebamboo2_6535.png"></div><p></p>
      <p>Hrant, 8 is a number I see more often. This is only relevant to brush method; components of the character are talked about in radicals, of which there are more than 300.</p>
      <p>One of the biggest differences is that in Chinese calligraphy the brushes are very soft, so there is zero resistance as you are writing. But you do have to pay attention to how the brush tip flicks around. That’s very different from using a calligraphic pen. This contributes to (but isn’t the determining factor in) a very different esthetic.</p>
