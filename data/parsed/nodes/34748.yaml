      <p>The 1925 BB&amp;S catalog shows three faces called Japanet, Pekin, and Bamboo. None of them is truly oriental, but seem to evoke an Eastern exoticism. MacGrew reports that each was originally designed in the late 1800s — 1893, 1888, &amp; 1889, respectively. Each was also originally marketed under a different name, having nothing to do with the Orient — Wedge Gothic, Dormer, &amp; Freak, respectively.</p>
      <p>Clearly, BB&amp;S was trying to tap a trend. ATF later recast some of these in 1954.</p>
      <p>— K.</p>
