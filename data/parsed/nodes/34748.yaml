      <p>From Sojin Kim &amp; Somi Kim, “Typecast: Meaning, Culture, and Identity in the Alphabet  Omelet,” <em>Lift and Separate</em> (New York: 1993), 32. (Found mentioned in a comment attached to the <em>Design Observer</em> article linked above.):</p>
      <p>“In 1867 one of the earliest pseudo-Japanese fonts was patented in America. This alphabet, known as <em>Mikita</em>, consists of three-dimensional letterforms suggestive of wood or lacquer work. Rather than actual mimicry of other alphabets, the first fonts that drew on the Far East in their letter structure were more reflective of concurrent art/design movements (artistic printing, the aesthetic, arts and crafts, international symbolist, art nouveau). [fn: N. Gray, <em>History of Lettering</em>, 175] Informal writing styles and brush scripts, particularly Chinese and Japanese, also began to affect character shapes. Around 1885, a font called <em>Japanese</em> appeared in England, perhaps the first font to allude directly to Japanese or other East Asian culture through the design of letters that evoke the calligraphic brushstrokes of Asian writing. [fn: N. Gray, <em>19c Ornamented Typefaces</em>, 101, 220] Despite the visual integrity and ingenuity of many of these alphabets, Western letterers’ mimicry of calligraphic strokes used by other writing traditions inevitably fails to refer correctly to the *ductus*, or order and direction of strokes, of the different traditions.”</p>
      <p>(And in the second footnote: “<em>Mikita</em> was produced by the type foundry D. &amp; G. Bruce, New York, 1867, and offered as <em>Novel</em> by the English type foundries Austin Wood, c. 1868, and Figgins, c. 1883. A face called <em>Chinese</em> was offered in a supplement to the Bruce specimen book in 1879. <em>Japanese</em> was produced by the English type founder Sir Charles Reed, c. 1885.”)</p>
