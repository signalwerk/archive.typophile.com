  html: |-
    <p>I'm very new to typography and this is my 1st attempt at creating a font so far i have only designed lowercase, feedback is greatly appreciated as I need constructive criticism, as I'm sure a lot is wrong with it, also i was wondering what are the best ways and programs to use I just used illustrator using guides and the grid i was wondering if theres a better way go about creating a font and getting things like contrast accurate other than using guides and grids.</p>
    <p>thanks</p>
    <p>John.</p>
