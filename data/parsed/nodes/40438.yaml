      <p>Hi</p>
      <p>totally agreee with tomas here, as you know typography comes from the pen, ductus is very important. An exercise that might help you to understand a little more about typography is to try and trace the letterforms of your type with a pen. Is very hard too! hehe</p>
      <p>Anyways i'll give my humble opinnion:</p>
      <p>- For the regular version it seems too bold<br>
      - The eye of the "g" is a little small and the beggining of the tail is too bold<br>
      - The "i" and "j" accents are small. They should be a little more wide than the stem<br>
      - The "s" needs more work (is a tough one)<br>
      - Intresting "t"<br>
      - x needs optical adjusment, it seems to "fall" to the right<br>
      - You managed to make a sistem with constants and variables, thats tough for first timers! :)</p>
      <p>Hope to have helped a little!</p>
      <p>Ferch</p>
      <p>PS: Is coming relly good, my first proyects where horrible compared to yours :)</p>
