    html: <p>Well, that inconsistency in particular is present in a large number--maybe the majority--of serif fonts. However, this font does have some other issues. My first-slash advice is to make all the hairlines the same width, and all the broad strokes the same width. That will make it look more professional, and make it easier to address the smaller issues.</p>
