      <p>Nick: Not the lack of popularity, but the lack of designers being inspired is admittedly worrisome. This is something I pointed out during my talk in Mexico City; I'm trying hard to encourage people to break the cycle of ideological lethargy. It's not easy - it's notable that I haven't done much with it myself! :-/ So it's not due to a lack of desire - it's due to the great intellectual difficulty it entails. The way we've been taught to make letters since we start <em>crawling</em> -namely, with skeletons- is very hard to overcome.</p>
      <p>Looking at educational institutions is not a good benchmark however; the <em>teachers</em> would have to come from a new generation for us to see any real shift there.</p>
      <p>--</p>
      <p>BTW, when analyzing Legato and its potential relevance, instead of merely focusing on phenomena, one should consider <em>why</em> people think Legato is special, and discuss <em>that</em> (although probably not here). And this is where I frankly don't get how anybody can minimize the relevance of making a clean break from type's misguided "painterly" past (and really, present).</p>
      <p>hhp</p>
