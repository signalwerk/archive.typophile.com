      <p>[Semi-existential theorization ahead. I'm only gonna do this once.]</p>
      <p>I believe that media, tools, and processes shape results. And I think the story of digital type (in the sense both of type being <em>produced</em> and <em>used</em> digitally), in the broader context of digitalization in toto, can be compared to "paradigm shifts" in other medial contexts, following the advent of new media – like for instance the oft-cited invention of photography (and how it developed vis-à-vis painting); film and how it found its own language apart from the theater; or more recently, the advent of the WWW, as opposed to print media.<br>
      We are, I think, presently caught in the middle of this shift.</p>
      <p>I am basing the following on my reading of German media theorist, Michael Giesecke. He observes – which I think is a very plausible working model – that such "paradigm shifts" in media typically develop over three phases (which however aren't clearly delimited, especially not chronologically):</p>
      <p>The <em>first phase</em> sees the new medium imitating the old medium, both in terms of æsthetics and functionality. See for example the first web pages that inherently consisted of long scrolling text, "as if it was printed"; or the first films that were essentially theater scenes with a camera where the audience would sit.<br>
      In type, this is where I'd place not only revivals, but also type produced today that emulates old models without adding much of a new perspective, citing familiarity as a basic virtue. What's quite baffling BTW is that chirographic type isn't only stuck in imitating the <em>previous</em> medial model (which would be phototype, or metal) – but it's even stuck in imitating the ancient medial model that came before that!<br>
      [Note: Since type is a tool rather than simply an art form, work that appears stuck in this phase might have more value/importance than in other fields, or maybe just take longer to lose its relevance.]</p>
      <p>The <em>second phase</em>, which typically sets in rather quickly, is about experimentation, and radical emancipation of the New from the Old. That's where your deconstruction comes in, the articles set in Wingdings, fonts that experiment on the formal front (You Can Read Me, etc) as well in terms of new technological possiblities (like Beowulf). The results of this kind of work/search aren't always useful (or even usable), and not always pretty; and that's also not what they're about – but they're vital for opening up new perspectives on what the new medium can do that the old one couldn't; for getting rid of old sludge; for gathering the courage to think afresh.</p>
      <p>Out of this courage grows the <em>third phase</em>, which I think we have slowly been sliding into in very recent times. This is about the new medium finding its <em>own</em> language, an æsthetics and functionality that is inherently its own, that has grown from its own capabilities, its advantages and hindrances, its means of production, in dialogue and friction with the tools that shape it. The fruits of this phase aren't just New, they're also Usable, and define themselves somewhat independently from the Old.<br>
      On the technological front, this means new possibilities for example per the OT format; tellingly, the use of OpenType Features has recently become more widespread, but also in a way more subtle, more "undercover", subscribing more to usability and usefulness than to extravagance, flashiness and Newness.<br>
      Finally, formally, this beginning third phase is <em>exactly</em> where I, too, would place Legato as a landmark design. It's not the only one, but quite possibly the most significant one. And that is because Legato deconstructs the Old Ways, but not in a destructive way. It deconstructs the Old Ways to find something inherently New that is also ultimately Usable, and that's why it's, also in my book, quite possibly the most important typeface so far of the digital era; a digital era that is coming of age, and has largely passed the PoMo tempers of its youth to find its own identity and value.</p>
