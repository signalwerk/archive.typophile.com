      <p>Nick: it's both natural and commendable for people to see greatness in something way before it might become popularly accepted as great. And a person sees this greatness based -hopefully- on what he/she believes the world really needs, or will need.</p>
      <p>&gt; First, one would have to recognize and accept that the<br>
      &gt; past was painterly and misguided, which most do not.</p>
      <p>Agreed.</p>
      <p>&gt; Evert didn’t help his cause by not demonstrating<br>
      &gt; his theory in a more didactic manner.</p>
      <p>Also agreed. He was a timid soul; I've only heard one story about him getting worked up. But maybe that's what allowed him to focus on the problem and find a solution, instead of preaching it too much.</p>
      <p>&gt; the manner in which the axis of the negative space (counter) outline<br>
      &gt; is rotated, in relation to the solid outline, is rather fuzzy</p>
      <p>This must me some sort of cosmic moment: agreed yet again! As I've said before -although rarely- Evert was too Modernist in his approach. He didn't learn to "let go". Few do. I think the realization that a designer simply cannot control everything is the secret ingredient he had yet to acquire. That said, he had genius in him (and I never use that word lightly). In many ways he reminds me of Dwiggins - who had his own limits.</p>
      <p>&gt; why don’t you design a face which more clearly demonstrates the<br>
      &gt; principle of independent axes of stress for postive and negative shapes?</p>
      <p>This is exactly the sort of thing that takes years to gestate. I've had almost a decade so far, so I guess I'm a sloth. However, when I got back from Mexico City, I was going to sleep every night thinking about what the lc "n" should really look like. After 4 nights I got something. All I will say here and now is: almost no type designer will accept it.* But I have to find strength in the truth that we don't design type for type designers. If it takes decades for people to "get it", so be it.</p>
      <p>* Unlike Legato, which virtually nobody hates. Which is of itself very impressive - changing the rules completely without turning off users.</p>
      <p>hhp</p>
