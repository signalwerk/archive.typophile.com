      <p>To my eyes, latin type design has been a remarkably conservative art. </p>
      <p>The great breakthrough of Jenson and Griffo in the 16th century was only subtly, though decisively different from the scribal hands of the day. The 19th century was perhaps the most innovative period in creating fat faces, clarendon and the sans, and various decorative types. The 20th century seems to me to be a return to conservatism, with the main innovation being the use of sans for text. But otherwise a refinement of Victorian and earlier styles. </p>
      <p>There have been stylistic changes right along, in harmony with other movements in the decorative arts, such as architecture and painting. But I don't see anything as innovative as the 19th century.</p>
      <p>The main innovation of the film and computer type eras seems to be the production of huge families of closely related sans in multiple widths and weights, such as Univers and many others that have followed. The film and particularly computer era has also allowed the proliferation of script types, used where before hand lettering would have been used.   </p>
      <p>I don't know if we are going to have more big innovation, as in the 19th century, but if so I suspect it will come from new technology, such as designing for the screen, and use of open type, as well as the greater cross-cultural currents. </p>
      <p>I'm not particularly a fan of this conservatism, but neither do I have a big problem with it in the field of type. It does seem to me a reality. The changes in science and society have been much more dramatic over the same period, compared to changes in type.</p>
