      <p>No offense Nick, but you <em>do</em> seem defensive. </p>
      <p>Let me try to reiterate. When Hrant made that statement about Legato, surely he didn't mean "significance" in terms of immediate impact, or sales; but <em>conceptual</em> significance (that in this case goes unnoticed quite easily), because it does something New where almost everybody else follows the Old. That's defining significance on a conceptual, on a theoretical level, and possibly on a practical level too (although I can't claim to quite grasp that part).<br>
      You, on the other hand, list criteria of popularity, usage, and impact on other designs. And I think that this definition, this list of criteria to determine what is significant and what isn't, places too much trust in what people-at-large (ie the mainstream, ie the market) think is significant. I believe something can be conceptually/culturally significant without the general public (which can also mean graphic designers at large) "getting" it. Maybe because it's too early, maybe because (as Hrant said) people err. And large crowds of people can err, too.<br>
      Like I said: We have different definitions of what "significant" means.</p>
      <p><cite>"- it’s too soon to say."</cite><br>
      Wait – you say it's too soon to say that it's significant,<br>
      but it's not too soon to say that it isn't? :-\</p>
