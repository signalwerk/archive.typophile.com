      <p>"Significant" isn't always positive either.  Helvetica is significant partly because it is hated by many people. Others like it (for whatever reason) but a significant number of people are familiar with it but could care less.<br>
      If we define "Significant" as having had an impact on typography we get a different set of fonts than those we might say "had a positive impact on the effectiveness of type design".<br>
      I would count Univers as having a significant impact because it brought about a much more systematic way of approaching type families that  has been emulated frequently. I don't mean the numbering system, I mean the design approach and being a sans is not the issue. </p>
      <p>ChrisL</p>
