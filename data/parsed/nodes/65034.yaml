      <p><em>How many artists that we think of as significant today weren’t recognized in their own time, </em></p>
      <p>But how, in their own time, do you propose to differentiate those that will have chapters written about them in history books, from those that will at best be footnotes, if not forgotten?</p>
      <p>Surely you have to wait for something to be widely used, copied and acclaimed before it can be deemed "most" important?<br>
      It's not enough to take the word of a passionate advocate, no matter how well informed.</p>
      <p><em>I frankly don’t get how anybody can minimize the relevance of making a clean break from type’s misguided “painterly” past (and really, present).</em></p>
      <p>First, one would have to recognize and accept that the past was painterly and misguided, which most do not.<br>
      Evert didn't help his cause by not demonstrating his theory in a more didactic manner. As I commented when the technical details of Legato were discussed here, the manner in which the axis of the negative space (counter) outline is rotated, in relation to the solid outline, is rather fuzzy, and could be miscontrued as rough or intuitive chirography or lettering.</p>
      <p>Evert's idea doesn't interest me enough to incorporate it into a type design (yet), but Hrant, why don't you design a face which more clearly demonstrates the principle of independent axes of stress for postive and negative shapes?</p>
