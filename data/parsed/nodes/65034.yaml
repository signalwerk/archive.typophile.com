      <p>Of course there have. But of the ones that <em>have</em> resulted in all that, have they done it in 5 years? Anyway what would be the point of answering that question for you, when all you'd say is something like: "Well, I guess you're wrong about it having been significant since it didn't become popular!" There's no point really.</p>
      <p>&gt; People (readers and typographers) should decide for themselves</p>
      <p>But that's not what readers* are good at. They're good at cooking, counting, driving, whatever. Some of them know how to design a car engine, and the rest of us who don't know much about engines appreciate them for it without having any idea how they might do their job better. You might notice or not that your car engine has lower mpg than you suspect it should, but beyond that you're pretty clueless, and largely powerless. But the engine might in fact suffer from poor design, and <em>still</em> end up in cars, and get great reviews in stupid car magazines!</p>
      <p>* And too many graphic designers (a <em>typographer</em> is quite a rara avis) aren't good at that either!  :-/</p>
      <p>You might cajole people by telling them they're in total control of themselves and they have within their minds everything they need, but to me that's deluded, and potentially unethical.</p>
