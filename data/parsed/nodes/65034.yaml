      <p>I wrote <a href="http://www.shinntype.com/Writing/NewPlast.pdf" rel="nofollow">an article</a> on 21st century fonts about six years ago, showcasing new designs.<br>
      I had recently been slagging the same old stuff (Helvetica etc.) so thought it was time to wax positive.<br>
      What strikes me now is the huge proliferation of new designs since then. Many of these are not just interesting deconstructions (which was prevalent in the previous decade), but thorough and sophisticated type systems.<br>
      IMO the two things driving this are both represented in the OpenType format: broader language support and expert typography (small caps, alternate figures, contextual alternates, etc.) via OT features.</p>
      <p><em>...it’s the most significant...</em></p>
      <p>In the world according to Hrant, which doesn't always correspond with reality.</p>
