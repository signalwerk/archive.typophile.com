    html: "<p>Schwab is known to digitize his own lettering, so it's likely that this is not available to the public. Alternatives: <a href=\"http://www.fontshop.com/fonts/downloads/betatype/grant_avenue_complete_ot/?affid=99346\" rel=\"nofollow\">Grant Avenue</a>, <a href=\"http://www.fontshop.com/fonts/downloads/shinntype/paradigm_pro/?affid=99346\" rel=\"nofollow\">Paradigm</a>, <a href=\"http://typographica.org/2007/typeface-reviews/fabiol/\" rel=\"nofollow\">Fabiol</a>, <a href=\"http://new.myfonts.com/fonts/fontbureau/hightower/?refby=typographica\" rel=\"nofollow\">Hightower</a>.</p>"
