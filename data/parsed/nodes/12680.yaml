    html: |-
      <p>Many of Fred Smeijers’ (Arnhem, Quadraat, Renard) and Martin Majoor’s (Scala, Nexus, Seria; Majoor is a favorite designer of Abbott Miller) typefaces work well for magazine design. Their design philosophy of purposely designing idiosyncracies in individual letters makes them particularly suitable to display settings; it goes without saying that they work well in text settings.</p>
      <p>Also recommended are Jonathan Hoefler’s Hoefler Text (used quite a bit by Robert Valentine) and Hoefler and Tobias Frere-Jones’ Mercury (designed for Esquire Magazine; with hints of New Century Schoolbook and Fleischman). </p>
      <p>Rather than “Delicato,” I would suggest Jeremy Tankard’s Enigma, which Delicato strongly references. (Details Magazine currently uses Enigma.)<br>
      _<br>
      David Cabianca</p>
