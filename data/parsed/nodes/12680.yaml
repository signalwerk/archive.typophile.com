    html: <p>I’m partial to Miller.  I’ve never had occasion to use it, but I’ve kept it in mind ever since taking note of its use in both New York and GQ  magazines (if I remember correctly) because of its legibility and pleasant, rounded character.  There are 14 styles both for text and display. I tend towards san serifs for most of my work, and I’ve never really had to contend with many pages with lots of text, but I remember Miller specifically because I read the two aforementioned magazines and liked the way the body copy read, so I called the design departments to inquire what the font was.</p>
