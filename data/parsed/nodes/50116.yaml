    html: |-
      <p>Hi Andyboot, Fredrik and Seb,</p>
      <p>thanks for your comments. I really appreciate the feedback.</p>
      <p>The site is a representation of how I work really – paired back, subtle design, using the minimum of means to get maximum effect. My intention was for it to have stand out from other designers'sites, and to be memorable. As a freelancer, in relatively tough times, I need the bulk of my clientele (Creative Directors) to think that I have a slightly different approach to solving graphic problems.</p>
      <p>I understand that the navigation can appear to be a tad confusing, but the site is a simple gallery: if you click on the left hand side of an image you go to the previous slide, and right hand side the next, all continuously looped. I know this isn't apparent when you first visit the site, but I'd like to use this forum as a sounding board for designers to let me know if what I have done is interesting enough to make you scroll through the work… or just plain silly.</p>
      <p>The colour change is just a bit of fun. A spectacle really. It's the core idea of the site so removing it would mean starting again! Also, it's an interesting way to display the variety of my one colour marks and B+W imagery.</p>
      <p>More thoughts encouraged.</p>
      <p>Many thanks,</p>
      <p>Alex</p>
