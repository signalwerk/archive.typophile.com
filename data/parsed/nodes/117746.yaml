    html: |-
      <p>Odd logo for a bank. I have no idea whether the letters are circa 1900 or 1970s Disco Gothic with mini-serifs. It seems to say put your money with our awkward letters and our swirly girly _g_ will give it a spin.  The bulging bowl _B_ and open loop _k_ are blackletter ideas that became popular with Morris Troy <a href="http://www.myfonts.com/fonts/p22/morris/" title="http://www.myfonts.com/fonts/p22/morris/">http://www.myfonts.com/fonts/p22/morris/</a> and <a href="http://www.myfonts.com/fonts/hihretrofonts/morris/" title="http://www.myfonts.com/fonts/hihretrofonts/morris/">http://www.myfonts.com/fonts/hihretrofonts/morris/</a> The _B_ and _k_, as well as the _g_ have some resemblance to ITC Victorian -- already suggested by Kevin. A similarly curly _g_  is also found in David Quay's Lambada <a href="http://www.myfonts.com/fonts/letraset/lambada/" title="http://www.myfonts.com/fonts/letraset/lambada/">http://www.myfonts.com/fonts/letraset/lambada/</a> and Azelea Rodgers' Azelea <a href="http://www.myfonts.com/fonts/arc/azelea/" title="http://www.myfonts.com/fonts/arc/azelea/">http://www.myfonts.com/fonts/arc/azelea/</a>. The stroke terminations on _a_ and _b_ are very blackletter. See for example Weiss Rundgotisch <a href="http://www.myfonts.com/fonts/ef/weiss-rundgotisch/" title="http://www.myfonts.com/fonts/ef/weiss-rundgotisch/">http://www.myfonts.com/fonts/ef/weiss-rundgotisch/</a> or <a href="http://www.myfonts.com/fonts/linotype/weiss-rundgotisch/" title="http://www.myfonts.com/fonts/linotype/weiss-rundgotisch/">http://www.myfonts.com/fonts/linotype/weiss-rundgotisch/</a><br>
      Add a few more touches like the spur on the vertical stroke of _f_  and the tendril with hanging ball in the middle of _B_ and you have a classic Frankenfont design. I would bank elsewhere.<br>
      Don</p>
