      <p>It's manufactured lettering, so it may not actually come from a font, as such. Neutraface is one example of architectural lettering which could have inspired this manufactured lettering design. Neutraface No.2 has an R that is closer to this example, if that was your problem with the original Neutraface font.</p>
      <p>- Mike Yanega</p>
