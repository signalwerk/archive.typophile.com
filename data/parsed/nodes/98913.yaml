    html: <p>The font used in the first picture is Rudolf Koch's "Wilhelm Klingspor Schrift" (or "Wilhelm Klingspor Gotisch", as it is usually referred to nowadays), possibly one of the finest blackletters ever designed. I have no idea of the fonts used in the video and the second picture, although IMHO they do not deserve much attention.</p>
