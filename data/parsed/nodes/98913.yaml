    <p>I would like to know the fonts used for these pictures and the font used in the video if anyone can identify any of them. thank you!</p>
    <p>It's got a pretty aggressive beginning, so if you're not a metalhead, I suggest you simply mute your computer . . .<br>
    <a href="http://www.youtube.com/watch?v=ybKifd3J0NI" title="http://www.youtube.com/watch?v=ybKifd3J0NI">http://www.youtube.com/watch?v=ybKifd3J0NI</a></p>
    <p>these pictures, as well<br>
    <a href="http://propagandist101.files.wordpress.com/2010/06/gorgoroth-017.jpg" title="http://propagandist101.files.wordpress.com/2010/06/gorgoroth-017.jpg">http://propagandist101.files.wordpress.com/2010/06/gorgoroth-017.jpg</a></p>
    <p><a href="http://www.metalblade.com/us/mainpics/goatwhore.jpg" title="http://www.metalblade.com/us/mainpics/goatwhore.jpg">http://www.metalblade.com/us/mainpics/goatwhore.jpg</a></p>
    <p>I have reason to believe that the fonts were not custom-made for the bands. These guys are not too popular, so I doubt they would hire someone to give them their own unique font.</p>
