      <p>"or it’s just a rubbish idea…"</p>
      <p>You answered your own question. All of these fonts based on artists writing are a rubbish idea. Leave Mr Rand's handwriting alone. He was America's greatest designer ever, maybe even the world's greatest designer ever. Its completely disrespectful to take what was his written voice and use it for your benefit.</p>
