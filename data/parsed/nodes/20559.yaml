  html: |-
    <p>Hi,</p>
    <p>This occured to me while flipping through some old Graphis Annuals this morning, has anyone created a font based on <a href="/wiki/Paul%20Rand" class="freelinking" rel="nofollow">Paul Rand</a>'s script lettering? It would make a pretty striking typeface (Rand Hand?). Don't know what it could be used for particularly but just thought in this day and age somebody must have had a go. Any thoughts? Is it too idiomatic? What are the ethics of adapting another designer's lettering style? Is this a job for P22? Or perhaps it could be the new Caflisch Script?</p>
    <p>Or maybe it's been done, or it's just a rubbish idea...</p>
    <p>Cheers,<br>
    Simon</p>
    <p><a href="http://www.illustrated-history.net" rel="nofollow">Illustrated History</a> | <a href="http://www.doodleblog.co.uk" rel="nofollow">Doodleblog</a></p>
