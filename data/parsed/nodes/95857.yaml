    html: |-
      <p>Can't find an exact match. Can be wrong but looks like a custom job based on some kind of Helvetica-like font. I would probably start with <a class="freelinking external" href="http://www.myfonts.com/fonts/adobe/helvetica/bold/" rel="nofollow">Helvetica Bold</a>, recreating /w (ascenderless mirrored /m), /h (mix of mirrored /n and /f), /a (/d with a reduced ascender - note its ascender is not horizontally aligned with the next /n, what probably could accredit the customization) and /t (mirrored f with pulled up middle bar)<br>
      Same vein, probably effortless but not matching: <a class="freelinking external" href="http://www.houseind.com/fonts/collections/chalet" rel="nofollow">Chalet</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/paratype/parangon/" rel="nofollow">Parangon</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/berthold/ag-schoolbook-bq/" rel="nofollow">AG Schoolbook</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/fontfont/ff-schulbuch/" rel="nofollow">FF Schulbuch</a></p>
