    <div class="info">Submitted by <a href="/user/108" title="View user profile.">Miss Tiffany</a> : 27.Dec.2007 9.57am </div>
      <p>The Western NY Book Arts Collaborative presents its Winter 2008 book arts Saturday workshop series in the Buffalo NY area.</p>
    <p>January 12<br>
    Intro to hand set type &amp; letterpress printing — Instructor: Hal Leader - Paradise Press</p>
    <p>January 19<br>
    Intro to Fontlab - Making digital fonts — Instructor: Richard Kegler - P22 type foundry</p>
    <p>January 26<br>
    Gocco Printing &amp; Japanese binding — Instructors: Diane Bond &amp; Linda Meyer</p>
    <p>February 2<br>
    Budgeting for Independent publishing — Instructor: David McNamara - Sunnyoutside press</p>
    <p>February 23<br>
    Foil Embossing workshop — Instructor: Don Dehoff - Keepsake Bindery</p>
    <p>March 1<br>
    Zine Publishing &amp; Distribution — Instructors: Amy Greenan &amp; Joel Brenden</p>
    <p>March 8<br>
    Silk Screening Printing on Wood — Instructor: Jeff Sherven - UB Print dept.</p>
    <p>For more details, registration information &amp; additional events:<br>
    <a href="http://www.wnybookarts.org/events.php" title="http://www.wnybookarts.org/events.php">http://www.wnybookarts.org/events.php</a></p>
    <p>Additional workshops in Rochester NY presented by The Printing &amp; Book Arts Center at the Genesee Center for the Arts and Education<br>
    <a href="http://www.geneseearts.org/classes.phtml" title="http://www.geneseearts.org/classes.phtml">http://www.geneseearts.org/classes.phtml</a></p>
    <p>——————————————-<br>
    Western NY Book Arts Collaborative<br>
    <a href="http://www.wnybookarts.org" title="http://www.wnybookarts.org">http://www.wnybookarts.org</a><br>
    ——————————————-<br>
    TypeCon2008: Punkt<br>
    July 15-20 Buffalo, NY<br>
    <a href="http://typecon.com/" title="http://typecon.com/">http://typecon.com/</a></p>
