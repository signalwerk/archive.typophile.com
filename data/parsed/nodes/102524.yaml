    html: <p>Hard to say, very generic and neutral, not too much distinctive letters and even adding /W and /R to the glyph set (from <a href="http://landingpage.maxon.net" title="Click to visit an external URL." class="freelink freelink-external freelink-external">this page</a>)... Gotham Rounded is actually a good alternative. I've also found <a href="http://www.myfonts.com/fonts/synthview/novecento" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Novecento</a> (very close but not rounded), <a href="http://www.myfonts.com/fonts/g-type/houschka-alt-pro" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Houschka Alternate</a> (/W and /R off), <a href="http://www.myfonts.com/fonts/font-fabric/solomon-sans" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Solomon Sans</a>, <a href="http://www.myfonts.com/fonts/font-fabric/gabriel-sans" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Gabriel Sans</a> (as many <a href="http://fontfabric.com/category/all-fonts" title="Click to visit an external URL." class="freelink freelink-external freelink-external">FontFabric</a> fonts actually).</p>
