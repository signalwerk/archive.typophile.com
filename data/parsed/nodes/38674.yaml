    date_raw: 31.Oct.2007 9.23pm
    votes: null
    html: <p>I think Today Sans is a better choice than National or Meta which are much more condensed in feeling than Mrs. Eaves. I paired her once with Geometric 415 which worked well too. I kind of think you want a font with a round o.</p>
