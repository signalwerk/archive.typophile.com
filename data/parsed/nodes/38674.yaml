    html: <p>Your link to “National” is a new one to me, I’ll put it on my list. Having given it a look-over, maybe I’ll try pairing with FF Meta and see how that looks. Or RR Glasgow is another one I really like. I think both have a feminine feel that might work well with Mrs Eaves? (latter btw is client choice, I can’t change it)</p>
