    html: |-
      <p>I have no idea about NY-specific printers, but for the white ink on colored paper you have effectively four options - </p>
      <p>1. reverse offset print, i.e. start with white paper and print the background on it</p>
      <p>2. intaglio engraving - by far the best option, but typically most expensive one</p>
      <p>3. thermography - a cheaper imitation of engraving, not bad if the type is thin</p>
      <p>4. silk screening - pretty exotic, but if done well it looks very very nice</p>
      <p>See <a class="freelinking external" href="http://typophile.com/node/55318" rel="nofollow">my older post</a> for some pretty pictures and the replies for some more information on the subject.</p>
      <p>Alex</p>
