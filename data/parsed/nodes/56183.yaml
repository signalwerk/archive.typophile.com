    html: <p>For option 1 (offset print) I recently had cards printed by vistaprint.com. Very pleased with the result. I went with uncoated stock, their heaviest paper, printed on both sides, uploaded my own graphics - in short their most expensive options - and I still paid only $45 for 500 of them. Got them in just a few days.</p>
