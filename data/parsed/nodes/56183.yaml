    html: |-
      <p>White ink on uncoated colored paper using offset printing is probably not going to give you the opacity you desire. I tried this several years ago and it was acceptable, but not great. The printer even gave me a double bump at no extra charge and it was still only at about 40% of full opacity — a double bump means they printed two coats of white ink. The problem is that uncoated paper soaks in the offset printing ink. You could maybe lay down a clear coat using the white plate before running the white ink on top of that, but still don't think that would work very well.</p>
      <p>Best of luck to you, and let us know how it turns out.</p>
