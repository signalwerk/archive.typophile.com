    <p>Mario Feliciano<br>
    Portuguese designer and typographer.<br>
    Designer of SurfPortugal and editora Fenda's periodicals, which use almost exclusively typefaces designed by him.<br>
    Distributes his typefaces through Feliciano Type Foundry.Feliciano represented Portugal at the Association Typographique International in England and started publishing his fonts at Adobe. In 1999 he became Iberia's representative for Enschedé Font Foundry, 2 years after launching his first typefaces at Chicago Foundry T26.</p>
    <p>Fonts distributed by Feliciano Type Foundry:<br>
    Strumpf<br>
    Escrita<br>
    Morgan<br>
    Geronimo<br>
    Douro (project for Expo 98)<br>
    Lanscape<br>
    Rongel/Stella<br>
    GAZ (project for Rollingstone magazine)</p>
