    <p>After viewing the thread about Lubalin Graph's Ligatures and alternates. <a href="http://typophile.com/node/39158">http://typophile.com/node/39158</a><br>
    I started wondering if there are any other typefaces out there that have built a "Co" ligature.</p>
    <p>My 5 year old son Connor has been writing his name with the "o" inside the "C" ever since he learned to write his name. We never showed him to do this, but he does it every time. I think it's cool that he has chosen to do this and am very thankful that his teacher hasn't decided to "correct" it.</p>
    <p><img src="/sites/default/files/old-images/connor_6171.jpg"></p>
