      <p>@ Guerella</p>
      <p>I am sure, its a typical (typocal) kind of merchandizing gene. From 1900 up to 1930 we find lots of ligatures like "Co." and "Cie." (both: Compagnie) in Germany.</p>
      <p>May be, Connor has german roots? </p>
      <p>This example is from<br>
      Prägefest<br>
      Ludwig &amp; Mayer, Frankfurt am Main<br>
      Erstguß 1926<br>
      Eduard Lautenbach</p>
      <p>Georg</p>
      <p><img src="/sites/default/files/old-images/1_5664.jpg"></p>
