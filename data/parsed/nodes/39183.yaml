      <p>Hello, this is such an old thread but I would like to revive it.  I'm a beginning design student "in over my head".  I need a typeface with a "Co" ligature for a "Construction Co" logo I foolishly promised to make.  Both "co"s would be ligatured for a nice balance - you get the idea.<br>
      Need something free or low-cost ... student budget.  Kartago recommended above is ok ... but $35 for one typeface ... exceeds my budget.<br>
      His name will probably be in one of the script typefaces that's popular now and "Construction Co" (with both co combinations as ligature) below the name in a plainer font.<br>
      Aiming for that trendy "vintage feel" but not trying to "overdo" it, either.  Thank you for any advice about a free or cheap "roman" font with Co ligature.</p>
