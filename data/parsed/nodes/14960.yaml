      <p>Eben</p>
      <p>Please accept my apologies as well. I reading through this all you seem quite sincere and I certainly misjudged you.</p>
      <p>Actually I am fairly computer literate. I was doing informational retrieval of online databases back in 1976. Worked with proprietary analog typesetting systems in the early 1980s. Was involved with the Mac platform since about 1989. So when I hear the question, “what is your browser,” I reach for my Taurus 9mm.</p>
      <p>At any rate, I looked through the thread on problems with the beta and I now realize I am hardly the only one with problems and that this is somewhat of a misguided and unique hell hole—and in saying that, I do like Typophile or I would not even waste my time being critical. Hrant’s thing about “free” is a bit of nonsense though, most of the web is free, that’s why most of us are here, um, especially Hrant. :—)</p>
      <p>There are some serious problems here and they actually need to be addressed by the owners and not solved by the members. I would suggest that the list “loyalists” start to come to terms with that. This might be a voluntary altruistic effort on the part of the owners (whoever they actually may be) but I do believe money is accepted at certain categories and when you do that you do have to deliver.</p>
      <p>If I can’t get into the site half the time and it causes me problems the other half, looks like I will have to accept that, until, of course, it just becomes a pointless exercise.</p>
      <p>If it’s a problem with my browser by the way, that’s Typophile’s problem, not mine.</p>
      <p>Gerald</p>
