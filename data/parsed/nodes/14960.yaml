      <p>And as regards the new typophile - it is better in some ways &amp; worse in others. But tracking Your Threads is *easy now*. You just have to look for the link when you first come in. I would like the links I use the most to be at the top &amp; bottom of every page. I need to load 2 pages to get where I want to go as it is. With links to recent posts &amp; my posts on everypage I would not need to do that. I would like the option to have a thread be a long page instead on breaking it into 2+ pages too. Still, I am happy Typophile is here. It blows the pants off lists.</p>
