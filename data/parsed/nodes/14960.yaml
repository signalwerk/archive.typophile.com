    <p>Because we had a recent hiccup in Forum accessibility, I browsed the topic areas (I generally link to ’<a href="http://typophile.com/tracker">tracker</a>’) to note any topics that requested response and had “0” (zero, naught, nada) replies.</p>
    <p>I was thinking back to a former member who became indignant and “<a href="http://typophile.com/node/14249">terminated his membership</a>” from Typophile because no one replied to his request for critique. (Please, I don’t want to open old wounds, I’m just looking forward.)</p>
    <p>I think members who frequent the Forum should try and be aware of any direct requests for assistance or critique older than two to three days. I know we can’t have the answers to everyone’s questions, but at least one member should make an attempt or at least acknowledge the post.</p>
    <p>I think it’s a courtesy to those who are willing to become members and post topics or questions. Besides, it’s good for Karma.</p>
    <p>—————————————————————<br>
    Yes, I’m old, but I’m a softy too!</p>
