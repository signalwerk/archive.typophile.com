    <p>Hi guys, sorry if I’m posting in the wrong section; I wasn’t sure where was best.</p>
    <p>I’m trying to update our company logo. This is how it looks at present.<br>
    </p><div class="imageWrap"><img src="/web/20081007190125im_/http://www.typophile.com/files/IMA BlueSymbol Small_5052.jpg"></div><br>
    There are two problems with it. One is the lettering and the other is the composition.<p></p>
    <p>The custom lettering falls apart at large sizes and doesn’t look modern, especially with that underlining. The lines of the globe seem to interfere with the shapes of the letters. I am wondering if simply updating the font would be successful. I have been looking at possible alternatives and found <a class="freelinking-external" href="https://web.archive.org/web/20081007190125/http://www.myfonts.com/search?search%5Btext%5D=presence+bold+italic">Present Bold Italic</a> or <a class="freelinking-external" href="https://web.archive.org/web/20081007190125/http://www.myfonts.com/fonts/cepuertas/urbana/UniqueName-7256-1188935622-1-73207/">Urbana Bold Italic</a> very pleasant. I need advice which other fonts to look at. We want to convey cutting-edge, modern, personable, friendly, professional and perhaps not too corporate (more informal). We are a training company working with NGOs in International Development around the world. I think the font should be fairly heavy so it sets itself apart from the globe, perhaps. We use Helvetica Neue for our communications.</p>
    <p>Colleagues here feel we should keep the globe (perhaps somehow being updated)<!--
