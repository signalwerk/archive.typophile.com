    html: |-
      <p>I think the lower case looks most like a Fraktur, because of the 'a', and <a href="http://www.myfonts.com/fonts/linotype/fette-fraktur/" rel="nofollow">Fette Fraktur</a> seems pretty close. A simplified version of the caps of <a href="http://www.myfonts.com/fonts/bitstream/engravers-old-english/" rel="nofollow">Engraver's Old English</a> might do for the initial letters.</p>
      <p>- Mike Yanega</p>
