  html: |-
    <p>I am working on a project that is using the Corona Extra labels as the theme.  </p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/CoronaExtraLogo_4941.jpg"></div><p></p>
    <p>I came up with something close to the C with plainblack wide font, but I really have a hard time looking through all my fonts without crashing my computer....I need a new one.  It looks like 2 seperate fonts...one for the capital C in Corona and for the lowercase.  Anyone know a font that is close to these?  </p>
    <p>I need to identify the lowercase, the C in Corona, and the E in extra.  </p>
    <p>Thanks in advance for your help!</p>
