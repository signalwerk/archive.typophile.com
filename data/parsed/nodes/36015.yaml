    html: <p>The whole thing is almost certainly custom drawn, but it's a textura blackletter. You could try <a href="http://www.myfonts.com/fonts/lanston/ltc-goudy-text" rel="nofollow">LTC Goudy Text</a> or <a href="http://www.myfonts.com/fonts/agfa/old-english-text" rel="nofollow">Old English Text</a> to get decently close.</p>
