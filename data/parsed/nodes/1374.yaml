    html: "<p>There are a lot of good things about Heller and his writing. There's also this certain nagging unease, something that smells like an \"unholy\" agenda - it's hard to put into words, and quite possibly in part in my/our imagination. <br> <br>For example: <br>Why write a book that purports to wonder if the Swastika is beyond salvation as a symbol, while in fact Heller's foregone -and suspiciously convenient- conclusion is that <i>no it must never even be allowed to heal</i> as a symbol. <br> <br>hhp <br></p>"
