  html: <p>Hello Everybody! <br>One of my friend recomended your site, he said it is a great site. I think it is great to have a cite dedicated to typogaraphy.  <br>I am a student, doing a deegre in graphic design/illustration. At this moment i am working on my dissitation. I am writing about the changes in typography after 1950/60(postmodernism) <br>Also try to answer the question whether these changes in typography had any effect the relationship between graphic design(designers) and illustration(illustrators).  <br>I would appritiate any sugestion related to the subject. Books, critics, websites and i am really interested on your oppinions or ideas which could help me with my essay. <br>Any information would be really helpfull. <br>Thank you. Looking forward to your replys <br> <br></p>
