    html: <p>Modern typography kinda sucks. What is groovy about funny mirrors and sparkler types. Thankfully torquois, mouve and purple went out of fashion in India about three hundred years back. Unfortunately modern typographers have not learned from the mistakes of the past. Typographers these days seem to think they have entered the pre talki days of the movie industry with the addition of "colour". <br> <br>I hate to be a stick in the mud but what about something really "radical" such as "letterpress typography rocks". <br> <br>Long haired typography. Now that's groovy! <br> <br><a href="http://www.lanstontype.com/GiampaLunenbergBoat.html" target="_blank">http://www.lanstontype.com/GiampaLunenbergBoat.html</a> <br> <br>Gerald Giampa <br> <br>Next time Heller wants to elucidated his theroy about the evils that intrinsically lurk behind the skirt of in the innocent Swastika form he might try to convince me at a town hall meeting here. <br> <br><a href="http://www.lanstontype.com/ShyloGiampa.html" target="_blank">http://www.lanstontype.com/ShyloGiampa.html</a></p>
