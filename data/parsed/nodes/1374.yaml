    html: "<p><b>David said:</b> <br> <br><i>first and foremost: i don't like to use labels. tags. e.g \"large chunks of Heller's writing\".</i> <br> <br>Well you don't have to worry, then, because it's me who's saying \"large chunks...\" not you. How is that a label or a tag?  <br> <br>Look at it this way: <br> <br>Q: What can I not stand?  <br>A: A sizeable amount of Mr Heller's output.  <br> <br><i>what is \"an irrational prejudice\"?</i> <br> <br>His ravings on the Swatika have turned me off a lot of his more lucid studies on graphic design. An enormous pity, I'm sure, and not very rational, but true as the day is long, all the same.  <br> <br><i>you're a historian - what field? where?</i> <br> <br>You'd make a fiendish inquisitor, David. What? Where? Why? How? Prove it! Prove it!... <br> <br>My fields are 19th and 20th century nationalist  propaganda and Irish book history/typography and I'm attached to the universities of Reims and Paris 7.  <br>Have I satisfied your curiosity? Will I post my CV along with any future criticism of Steven Heller?  <br> <br><i>most important: if this thread is going to be like \"raed the txet\", \"killing\" each other.....forget it</i> <br> <br>I'm glad I'm not the only one with irrational prejudices. I can see why you like Heller. He's all for 'forgetting' things he doesn't want to see or hear too. <br> <br><b>Hrant said:</b> <br> <br>...<i> this certain nagging unease, something that smells like an \"unholy\" agenda - it's hard to put into words, and quite possibly in part in my/our imagination.</i> <br> <br>That pretty much sums it up for me. Nagging unease rather than rational justification. <br> <br>Matha</p>"
