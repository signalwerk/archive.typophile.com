    html: '<p>post-modern: <br> <br>1. Wolfgang Weingart (Basel, the new style) - he mixed type weights within the same word, arranged type into images; he rejected the order and cleanliness of the Swiss design and typography.  ===&gt; <br> <br>2. Dan Friedman (New York, the new style) -  in 1973 Friedman wrote: <br> <br>"legibility (a quality of efficient, clear, and simple reading) is often in conflict with readability (a quality which promotes interest, pleasure, and challenge in reading). To what degree can a typographic statement be both functional and at the same time aesthetically unconventional?" <br> <br>3. the Memphis Style <br> <br>4. the American Punk - and check artwork/design/comics  by Gary Panter, Art Spiegelman.  <br> <br> <br> <br>David Hamuel</p>'
    html_clean: '<p>post-modern: <br> <br>1. Wolfgang Weingart (Basel, the new style) - he mixed type weights within the same word, arranged type into images; he rejected the order and cleanliness of the Swiss design and typography.  ===&gt; <br> <br>2. Dan Friedman (New York, the new style) -  in 1973 Friedman wrote: <br> <br>"legibility (a quality of efficient, clear, and simple reading) is often in conflict with readability (a quality which promotes interest, pleasure, and challenge in reading). To what degree can a typographic statement be both functional and at the same time aesthetically unconventional?" <br> <br>3. the Memphis Style <br> <br>4. the American Punk - and check artwork/design/comics  by Gary Panter, Art Spiegelman.  <br> <br> <br> <br>David Hamuel</p>'
