    html: '<p>Maria <br> <br>"can we use type as an image rather than information?" <br> <br>This instance does not cover post modernism, but certainly answers the question of type as image. <br> <br>One man who has made a very in-depth study of the question without ever asking it of himself, is Chris Stern of Grey Spider Press. Over the past few years he has designed and printed a collection of typographical broadsheets, so rich in concept as to be almost paintings rather than merely a collection of wood-and-metal-type posters. <br> <br>If you contact him, you may be able to get him to send you a photocopy or some other representation of his work.  <br> <br>He can be contacted by e mail at: <br> <br><a href="mailto:flywheel@premier1.net">flywheel@premier1.net</a> <br> <br>You can blame the intrusion on me. <br> <br>Jim Rimmer</p>'
