    date: 2004-11-29T09:40:00
    date_raw: 29 Nov 2004 — 9:40am
    votes: null
    html: "<p>Grayscale pixelfonts allow a designer to define the pixels as being a shade of gray, not just black or white. They do this by filling the \"virtual pixels\" with partial outlines. Please see the \"A\" that I just posted in this thread: <br><a href=\"http://www.typophile.com/forums/messages/4101/52636.html\" target=\"_blank\">http://www.typophile.com/forums/messages/4101/52636.html</a> <br>That glyph has a height of 12 pixels. <br> <br>Some of us think there's no better form of onscreen text, not even ClearType. <br> <br>It would be wonderful if BItFonter could output grayscale pixelfonts too. <br>You might want to talk to the UltraFonts people about it: <br><a href=\"http://www.ultrafonts.com\" target=\"_blank\">http://www.ultrafonts.com</a> <br> <br>hhp</p>"
    html_clean: "<p>Grayscale pixelfonts allow a designer to define the pixels as being a shade of gray, not just black or white. They do this by filling the \"virtual pixels\" with partial outlines. Please see the \"A\" that I just posted in this thread: <br><a href=\"http://www.typophile.com/forums/messages/4101/52636.html\" target=\"_blank\" class=\"link-lost\">http://www.typophile.com/forums/messages/4101/52636.html</a> <br>That glyph has a height of 12 pixels. <br> <br>Some of us think there's no better form of onscreen text, not even ClearType. <br> <br>It would be wonderful if BItFonter could output grayscale pixelfonts too. <br>You might want to talk to the UltraFonts people about it: <br><a href=\"http://www.ultrafonts.com\" target=\"_blank\" class=\"link-external\">http://www.ultrafonts.com</a> <br> <br>hhp</p>"
