    html: "<p>&gt;Bitmap pixel fonts: for Flash (outline) <br>Do you mean the function \"File&gt;Export As Pixel Outline Font\" is not enough? Sorry, I don't know Flash well. <br> <br>&gt;Greyscale pixel fonts: for Flash (outline) and as a Photofont <br>? What's this? ^^^^^ Special font format? <br> <br>&gt;Color fonts: for Flash and as a Photofont <br>I think the question should read: \"When Macromedia will support the usage of color fonts and Photofont technology?\". Right? <br> <br>Q: Are Photophonts Flash compatible?  <br>A: No. <br> <br>Johnych</p>"
