    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Organizations" class="freelinking" rel="nofollow">Organizations</a> : Typostammtisch</strong></p>
    <p>The word "Typostammtisch" is German, and has no good English translation. Basically, it means "a regular meeting at a bar, during which typography will be discussed." Currently, there are several Typostammtische in Germany.</p>
    <p>Although various chapters of German Forum Typografie may have informally used in the term for some of their meetings, it is held that the first regular Typostammtisch was established in Offenbach, a Hessian city near Frankfurt. The Offenbach Typostammtisch was founded by <a href="/wiki/TypeOff" class="freelinking" rel="nofollow">TypeOff</a> in the aftermath of TYPO Berlin 2004, and has been meeting regularly since June 2004. Since 2007, the Offenbach Typostammtisch has been organized by the Offenbach design studio TYPOSITION. Dates and locations are published on the <em>spatium Magazin</em> blog, <a href="http://www.spatium-magazin.de" title="http://www.spatium-magazin.de">http://www.spatium-magazin.de</a></p>
    <p>The Offenbach Typostammtisch has inspired additional Typostammtische in Germany. For several years, a Berlin Typostammtisch, organized by Fontwerk (<a href="http://www.fontwerk.com" title="http://www.fontwerk.com">http://www.fontwerk.com</a>), has met every other month. The Berlin Typostammtisch has the highest attendance of any Typostammtisch in the country.</p>
    <p>In 2008, a Typostammtisch was founded in Saarbrücken. This Typostammtisch meets irregularly. In 2010, a monthly Typostammtisch was founded in Hamburg. There are additional Typostammtische in Cologne and Hannover, the later of which is run by a chapter of the Forum Typografie.</p>
    <p>Typostammtische on Flickr:<br>
    <a href="http://www.flickr.com/groups/typostammtisch/" rel="nofollow">Typostammtisch ‘The Original’ Offenbach</a><br>
    <a href="http://www.flickr.com/groups/typostammtisch-berlin/" rel="nofollow">Typostammtisch ‘The Capital One’ Berlin</a><br>
    <a href="http://www.flickr.com/groups/typostammtisch-saar/" rel="nofollow">Typostammtisch ‘Close to little else’ Saarbrücken</a></p>
