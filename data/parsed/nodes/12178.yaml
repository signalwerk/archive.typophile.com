    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/12154" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Organizations</a>&nbsp;:&nbsp;Typostammtisch</strong></p>
    <p>The word “Typostammtisch” is German, and has no good English translation. Basically, it means “a regular meeting at a bar, during which typography will be discussed.” Currently, there are several Typostammtische in&nbsp;Germany.</p>
    <p>Although various chapters of German Forum Typografie may have informally used in the term for some of their meetings, it is held that the first regular Typostammtisch was established in Offenbach, a Hessian city near Frankfurt. The Offenbach Typostammtisch was founded by <a href="/node/12176" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">TypeOff</a> in the aftermath of <span class="caps">TYPO</span> Berlin 2004, and has been meeting regularly since June 2004. Since 2007, the Offenbach Typostammtisch has been organized by the Offenbach design studio <span class="caps">TYPOSITION</span>. Dates and locations are published on the <em>spatium Magazin</em> blog, <a href="http://www.spatium-magazin.de">http://www.spatium-magazin.de</a></p>
    <p>The Offenbach Typostammtisch has inspired additional Typostammtische in Germany. For several years, a Berlin Typostammtisch, organized by Fontwerk (<a href="http://www.fontwerk.com">http://www.fontwerk.com</a>), has met every other month. The Berlin Typostammtisch has the highest attendance of any Typostammtisch in the&nbsp;country.</p>
    <p>In 2008, a Typostammtisch was founded in Saarbrücken. This Typostammtisch meets irregularly. In 2010, a monthly Typostammtisch was founded in Hamburg. There are additional Typostammtische in Cologne and Hannover, the later of which is run by a chapter of the Forum&nbsp;Typografie.</p>
    <p>Typostammtische on Flickr:<br><a href="http://www.flickr.com/groups/typostammtisch/">Typostammtisch ‘The Original’ Offenbach</a><br><a href="http://www.flickr.com/groups/typostammtisch-berlin/">Typostammtisch ‘The Capital One’ Berlin</a><br><a href="http://www.flickr.com/groups/typostammtisch-saar/">Typostammtisch ‘Close to little else’&nbsp;Saarbrücken</a></p>
