      <p>Mark, the Compugraphic system is what I call unitised banded spacing. It was also discussed on the comp.fonts newsgroup when Laurence raised the idea of bubble spacing, and I made a test case to demonstrate its limitations. Essentially, it involves setting different sidebearings at different heights. Because it is unitised, though, it is not flexible enough for ideal spacing. Unitisation is another limitation of mechanical systems that need not apply to digital type. The MS math cut-in kerning is similar to the banded spacing idea, except the number and height of the bands is defined relative to the UPM by the font maker, so it is a lot more flexible. But a true bubble model, in which spacing is directly related to glyph shape seems to me greatly preferable.<br>
      ____</p>
      <p>James, yes I have set metal type. There was no kerning, and I wasn't allowed to take a file to the precious bits of metal.</p>
