      <p>I will probably post a new topic when I get around to formulating my thoughts on this one of these days, but I think there are a lot of things we can rethink about font formats that are relics of pre-digital Latin typography, from the "glyph" as the most basic unit of design onwards. I don't know how long it will be in the future, but I hope the font format that will eventually replace OpenType will dispense with these restrictions, including the notion of fixed side-bearings.</p>
      <p>Ideally, I would like to see a font format powerful enough to handle something like Tom Milo's Arabic layout model internally. We can take a look at the demands of so-called complex scripts like Arabic, which are tricky to handle in the current formats because we are stuck in the paradigm of pieces of metal, and create the next-generation format to handle them in simpler, more logical ways. Working with a generalized notion of spacing, perhaps something like the bubble method described by others, could be a feature of this dream format.</p>
