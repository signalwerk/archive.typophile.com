      <p>Bert, can you explain what you mean by ‘balance of mass protruding and inherent’?</p>
      <p>David Kindersley's spacing model was based on a notion similar to balance of mass, as I understand it. One would locate the vertical optical centre of a letter -- which Kindersley tried to automate based on analysis of mass and form --, and then make this the mathematical centre for spacing purposes. The idea of spacing outwards from an optical centre is an alluring one. My analysis says that this system works best for all-caps display settings, though.</p>
      <p>Further to my point above, though, one would need to be able to apply such a method to <em>typeforms,</em> not just to glyphs. Otherwise one will run into exactly the same spacing and mark interaction problems that we're hitting with OpenType. This is why I keep coming back to the bubble model, because in theory glyph order needn't be an issue: the bubbles of multiple glyphs forming a single typeform -- e.g. a letter plus one or more combining marks -- form a composite bubble that has the same spacing behaviour relative to adjacent bubbles as a single glyph bubble would.</p>
