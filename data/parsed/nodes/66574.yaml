      <p>Brian: <em>[...] this is a solution that simplifies stacking of glyphs [...]<br>
      [...] does distance need to be specified between every pair of glyphs? [...]</em></p>
      <p>I think of it as one way to circumvent a couple of limitations inherited from movable type, such as spacing which is at the moment defined by ‘rectangle to rectangle’ still plus corrections (kerning). The <em>distance</em> value is spacing plus kerning, so no kerning pairs are needed anymore. The <em>center line</em> approach also helps to overcome problems like John sketched above. Surely this system will have its own limitations too, but it solves a couple and I reckon that conversion from and to the current description should not be too complex.</p>
      <p>The <em>distance</em> has to be indeed specified between every pair of glyphs, but as I mentioned this can be calculated from the current (side bearings based) system plus the kerning pairs. No additional work has to be done basically, although any other possible method to calculate the space/<em>distance</em> and the <em>center line</em> would be fine (and interesting) too (see my notes on the <em>Rhythmic System</em>).</p>
