      <p>John: <cite>Dynamically composeable Hangul is possible within the OpenType glyph processing model, I reckon.</cite></p>
      <p>Yes, the composition itself is possible, and I've seen some attempts to exploit that possibility, I believe.</p>
      <p>But for even a remotely acceptable text design, the components have to vary in shape, size, and position according to context. I'll reuse the image from a <a class="freelinking external" href="http://typophile.com/node/56487" rel="nofollow">previous thread</a> to illustrate:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/gi_4604.gif"></div><p></p>
      <p>And this is just showing the possible variations on the initial consonant when the vowel is fixed and the final consonant is the only variable.</p>
      <p>In the current model, the best we can do is individually design the 2,350 or so most-used syllables for modern Korean, and extract the hundreds to thousands of individual components from them to be used for composing less common syllables. But this still isn't adequate for all theoretical hangul syllables. What I had in mind is a way of generating the appropriately shaped and sized component from the contextual information, and I don't see how that is possible within the OpenType paradigm of ready-made glyphs.</p>
