    html: |-
      <p>Frank: <em>Even if spacing is script-representation specific, then one needs at the end a common way to describe the spacing of different script-representations in a font format still, I reckon. The translation of the spacing into distances between the optical (center/heart) lines of the letters, is at the moment the best method I can think of....</em></p>
      <p>I agree that a common font format description of spacing is desirable, but I don't think a distance measure suffices any more than flat sidebearings suffice.</p>
      <p>How is the centre line defined? As an average height in a font? Or on a glyph-by-glyph basis? If the former, how do you handle punctuation and other glyphs that sit below or above an average centre line?</p>
      <p>How does this spacing model relate to and account for combining diacritical marks, which is the problem prompting me to question the OpenType glyph positioning model? What's the point of spacing according to centre line distance if the result is collision of parts of adjacent typeforms that impair legibility?</p>
      <p><em>So, I would treat any script-representation as a result of its own rules and I would encourage a subsequent description of the harmonic and related rhythmic dynamics for this. Thomas Milo is doing this for Arabic and the different approach in DecoType is the result of this thoroughly based insight.</em></p>
      <p>There are strong arguments to be made for optimised, writing system specific layout technologies. On the other hand, it may be possible to come up with a general description of ‘adjacency’ -- bearing in mind that what we generally think of as spacing, i.e. separation, is only one kind of adjacency --, and hence a potential foundation for building a spacing model that can be easily adapted to various writing systems, i.e. one that is capable to taking into account different kinds of adjacency relationships. In my e-mail to Frank, I wrote, among other things:</p>
      <p>One approach to developing new techniques is to start with a limited application, solve that, and then extrapolate to other applications. But the danger -- almost the certainty -- of such an approach is that you will eventually hit an application to which you cannot extrapolate the original solution, and you find that the limited scope of the initial application resulted in a poor foundation. In some respects, we could say that this is exactly the problem with OpenType: it has tried to extrapolate too far the spacing paradigm of metal type. My preferred approach is to try to build as big a picture as possible, taking into account all the problems that need to be solved, and then determine if it is possible to develop a technique that will satisfy. In the case of spacing type, I think such a picture needs to include all the world's writing systems in all their styles and all the variations of ways that adjacent 'typeforms' relate to each other.</p>
      <p>Typeform is a term in use at Reading, and I think it is a very useful one. A typeform is the rendered representation of a unit of written language; the nature of the unit depends on the writing system and other factors, but in the case of the Latin writing system a common typeform might consist of a single letter or of a letter plus diacritic mark(s). The nice thing about the term typeform, because it refers to the rendered representation, is that it is technologically agnostic, in particular it doesn't presume anything about either the encoding of the typeform or its glyph composition: the same individual typeform may represent one or more characters and be built from one or more glyphs. So, for example, this typeform:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/amacronacute_5831.gif"></div><p></p>
      <p>might represent 1-3 encoded characters rendered with 1-3 glyphs. The same typeform could represent different numbers of encoded characters, even in different parts of the same document, and different combinations of glyphs depending on the font used.</p>
      <p>As I spoke about during the DTL conference, I consider the interaction of spacing adjustments and mark positioning to be the weakest aspect of OpenType. And in trying to think through the reasons for this I've come to the conclusion that spacing has to take into account typeforms, not glyphs. I don't think you can solve the spacing problem at the glyph level, which is why I think something like centreline distance is a non-starter. Spacing has to take into account the profiles of the whole typeform (leaving aside for now spacing for vertical scripts), not just the base letter.</p>
      <p>Many of the world's writing systems employ what I call static typeforms with regard to spacing. This is the case with Latin. What I mean by this is that once a diacritic mark is applied to a letter in the Latin script, it forms a static unit that must be spaced relative to adjacent typeforms as a unit, i.e. the mark remains in a fixed relationship to the base letter regardless of adjacent shapes. There are other writing systems, of which Arabic is an obvious examples, in which typeforms remain dynamic relative to adjacent shapes and their spacing, i.e. the marks will move relative to the base letter in order to accommodate adjacent shapes. So this difference, too, needs to be taken into account in the full picture.</p>
      <p>Because the formal typographic styles of the Latin writing system use mostly disconnected letters, we tend to think about spacing in terms of distance or separation. I think this is a poor basis for a full picture, because most of the world's writing system admit of connection as well as separation; indeed, the Latin writing system itself has some of the most fully articulated traditions of connected writing. And in some writing systems, of course, connected styles are the norm of virtually all writing; again, Arabic is an obvious example. So I would say that both separation and connection need to be taken into account in considering the relationships of adjacent typeforms.</p>
      <p>So far, we have two kinds of typeforms:</p>
      <p>    static<br>
          dynamic</p>
      <p>and two kinds of adjacency:</p>
      <p>    separation<br>
          connection</p>
      <p>I doubt this constitutes a full picture, but it's a start.</p>
      <p>Connections, of course, may be elongated or extended in some circumstances. The elongations of Arabic letters are traditionally not directly related to adjacency, i.e. one doesn't normally elongate in order to resolve a relationship of adjacent letters and their marks. In Devanagari, Bengali or Gurmukhi, though, one may extend the headline connection between letters/conjuncts in order to avoid collision of superscript vowel signs and other marks.<br>
      ___</p>
      <p>This kind of analysis suggests to me a properties-based approach to adjacency, whereby one would specify at the glyph level the kind of relationship(s) a glyph can have to adjacent glyphs. For some writing systems, Unicode attempts this at the character level, which is the basis of e.g. Unicode Arabic layout, but as font developers we know that adjacency really needs to be resolved at the glyph level, not least because there are styles of lettering that contravene character property models, e.g. Arabic styles in which a nominally ‘isolated’ alif may connect, at the top, to a following lam. This is connectivity as a typeform adjacency property.</p>
