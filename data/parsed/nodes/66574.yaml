      <p>Chris: <em>...perhaps a grid system of space units based on UPM which build the space according to shape?</em></p>
      <p>I think this concept of building the space according to shape is something worth hanging onto.</p>
      <p>A grid system would be similar to the Compugraphic unitised banded spacing. It's certainly possible, but why unitise? The UPM represents the glyph shape grid, so why not use the same grid for spacing shape, i.e. allow the spacing shape to be as flexible as the glyph shape?</p>
      <p>[Some aspects of Microsoft's math layout actually measures ‘ink’ during layout, i.e. records the position of outline edges and calculates optimal (or tolerance based variation) of position of other elements of layout. Effectively, this is defining bubbles during layout.]</p>
