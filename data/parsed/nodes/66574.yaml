      <p>John: <em>It seems to me that what you are describing is something very close to what we already have, with the addition of a centre line between the two sidebearings</em></p>
      <p>The <em>center line</em> approach is in my opinion quite different from and more versatile than the side bearings based one, as I tried to explain above (but obviously without convincing you). The side bearings can be used to calculate the <em>center line</em>, <em>distance</em> and the <em>glyph boundary</em>, but I can imagine other ways to come to this data also. At least the option to convert the side bearings (and kerning) should make the system backwards compatible, which is a requirement for possible implementation, I reckon –especially when one takes the historical development of type and typesetting systems into account.</p>
      <p><em>Are you implying that the centre lines of the different stacked glyphs are aligned [...]</em></p>
      <p>Yes, that is actually the basic idea. Any offset of marks in reference to the <em>center line</em> should be possible too, of course.</p>
      <p>I have asked the FM programmers at URW++ to have a look at the practical side, i.e., the technical (implementation) consequences and also the possible limitations of my ideas, to prevent things from becoming purely theoretical.</p>
