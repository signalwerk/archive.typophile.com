      The thesis on which my research is based, is that one can only judge the different representations of characters within scripts on the rules defined by the (historical) bases of these representations themselves. A description of the underlying structures is essential to describe variants of the specific characteristics of style periods and for instance to map what type designers actually add and/or alter to the basic structures (idiom). A consequence of this approach is, that a certain script-representation related mechanism, like spacing –which is the subject of this topic– is not by definition automatically applicable to a representation of another script. In most cases it won’t, because the underlying structure is incomparable.<br>
      &nbsp;<br>
      The LetterModeller is only focused on Latin and the current version is restricted to the <em>Harmonic System</em> which is traditionally named ‘Roman’ in the typographic field and ‘Textletter’ in the calligraphic world. The spacing mechanism I am working on is based on what I call the <em>Rhythmic System</em>. Basically this places ([variants of] a repetition of) a <em>Harmonic System</em> underneath the related characters to come to a spacing based on the rhythm within the letters (as for instance shows up in the <em>stem interval</em>). Although merely a simplification, one could state that in essence the round parts are treated as overshoots of the straights. However, to measure the distance between the letters mostly based on the straight strokes is only possible when the proportions are ‘ideal’, i.e., when (the widths of) all characters are based on the same underlying <em>Proportional System</em>. As soon as this is not the case, i.e., when multiple underlying <em>Proportional Systems</em> are used, the matter becomes more complex. This shows up for instance in the spacing of typefaces with relatively large deviations in counter sizes, which normally results in a ‘tight’ spacing to cover up the rhythmic irregularities (to glue the letters actually).<br>
      The <em>Rhythmic System</em> approach as basis for spacing works for ‘open’ letters also. In one of the PDF’s which are part of the LeMo download (<a href="http://www.fontmaster.nl/english/download.html" title="http://www.fontmaster.nl/english/download.html" class="link-external">http://www.fontmaster.nl/english/download.html</a>), there are examples which contain an ‘a’ and an ‘e’. The idea of ‘open’ letters is in my opinion directly related to typography, i.e., to the side bearings which are the result of transition of a calligraphic system into movable type. A calligrapher will write for instance an ‘a’ or an ‘e’ in the rhythm of the other letters, without bothering where exactly the space within the letter stops or starts. To be able to split up the space in equal parts, one has to know the latter.<br>
      &nbsp;<br>
      At the moment I am measuring the <em>Proportional Systems</em> of letters from the Renaissance (especially Jenson and Griffo) and of later periods, to map the different characteristics in proportions in the letters of the different style periods in general and of punch cutters specifically. If everything goes well, next month the development of the ‘LetterMeasurer’ application will start. The purpose of this app is to map the <em>Proportional Systems</em> automatically of (firstly digitized/auto traced) type designs and to generate a database of (style period and punch cutter related) values. It is especially interesting to see that Griffo makes the counters of the ‘round’ letters ‘b’, ‘d’, ‘p’ and ‘q’ somewhat smaller than Jenson, which could be interpreted as a starting point for the rotating counter axis, as can be found in typefaces from the Baroque (Griffo’s model being the most dominant over time). Of course, this affects also the ‘c’, ‘e’ and ‘o’.<br>
      Condensing the ‘round’ letters provides a way to make a typeface more economic. Jan van Krimpen applied this idea clearly to Spectrum, which was originally developed as a bible face. Transferring this to the current technology, one could imagine that for instance adding an alternative (stylistic) set for the ‘round’ letters to a typeface, would give the typographer some more options to control the space. A (more futuristic) step further would be the application of a model which could be tailored to a typeform on the fly and which the typographer could use to change the parameters of certain letters within a typeface. I am not referring to multiple masters here, but thinking of a typeface independent mechanism.<br>
      At the moment I am making attempts to automatically ‘tailor’ and ‘anchor’ the primary <em>Harmonic Model</em> in the current version of LeMo to existing regular weights of broad nib based typefaces to generate bold and condensed versions from there. Perhaps this turns out to be too abstract at the end, but wouldn’t it be nice to provide the typographer with the flexibility of the calligrapher?<br>
      &nbsp;<br>
      The basic principle of an equally devided space between all letters is the result of the transition of a from origin calligraphic system to a typographic mechanism. Over the last 23 years as a lecturer at the Royal Academy I have been in the position to experiment with different approaches in educating rhythm and spacing. One of the things I noticed, is that explaining the fact, that the space between the letters should be equal to the space within the letters does not help students very much when they start writing with a broad nib. One needs to provide a mechanism which forces the students in this rhythm, and in case of the ‘Textletters’ the rhythm/spacing can be largely controlled by the length of the stroke-endings. i.e., feed. This convinced me also of the fact that the length of serifs is not an arbitrary thing, but a letter-width related factor (besides being a representation/indicator of the contrast, contrast sort and contrast flow). In other words, by defining the stem interval within the letters the lengths of the serifs are a natural result of this, because the stem interval between the letters is normally supposed to be (almost) equal. Short serifs will cover less space and will result in a tighter spacing, which is basically an obstruction of the rhythm –something which in my opinion makes for instance sans serifs by definition more irregular.<br>
      &nbsp;<br>
      The spacing of the ‘diagonal’ letters is another thing. These letters have clearly another origin (capitals) than the round letters and are therefore part of a different <em>Harmonic Model</em>. We like to see the script-representations as consistent things (‘construction sorts’ [Noordzij]), but in many cases they are not. A calligrapher will tweak and bend these letters to make them fit in a ‘Textletter’ variant such as the Humanistic minuscule. In practice the type designer will make the width and weight/contrast/contrast flow characteristics of the ‘diagonal’ letters as equal as possible to the ‘round’ letters. The spacing in these cases is normally as tight as possible, even sometimes by reducing the length of the serifs. By definition kerning has to be applied to makes things as optimal as possible, something calligraphers will do automatically.<br>
      The fact that the ‘diagonal’ letters are relatively poorly represented in the current version of LeMo, does not automatically imply that spacing mechanisms coming from the dominant (primary) <em>Harmonic Model</em> can not be applied on the secondary <em>Harmonic Model</em>.<br>
      &nbsp;<br>
      Even if spacing is script-representation specific, then one needs at the end a common way to describe the spacing of different script-representations in a font format still, I reckon. The translation of the spacing into distances between the optical (center/heart) lines of the letters, is at the moment the best method I can think of, if only because it can be used to translate the current side bearings system easily (the optical center line being the center between the side bearings). The problem of the legacy system of ‘hard’ side bearings is, that optimal spacing has to be accomplished by adding exceptions in the form of kerning. The lengthy kerning pairs and subsequent technical problems in OpenType fonts are a good example of this limited approach. If the user does not use the kerning, for instance because it is turned off by default in a word processor, the system does not make sense at all. In short: kerning is part of the spacing, not an exception.<br>
      In my research the translation of the spacing into distances results in line pieces (the length is identical, the angle not) which can be read as a graphical representation of the spacing. My theory is, that the more uneven the graph is, the more proportional variants the typeface in question contains. It also could be an indication that the spacing is awkward, of course, and therefore this has to be checked first against the <em>Rhythmic System</em>. One of my ideas behind the graphical representation is, that this could turn out to be useful for legibility research.<br>
      I don’t know if the translation into centerlines will work as a practical solution for Latin, let alone for any other script. I can imagine that such an approach leads to a sort of ‘class spacing’. The start point of the space (left side bearing) of a character would be half of the distance-line (center to center) to itself, I reckon.<br>
      &nbsp;<br>
      In his lengthy e-mail John stated <em>‘[...] I do think the notion of rhythm is useful and important, but it neither refers to a universal phenomenon -- different writing systems and different styles display different kinds of rhythm [...]’</em><br>
      &nbsp;<br>
      I would like to add to this statement ‘different kinds of harmony’. For my talk at Leiden University in May last year, I invited a Korean musician with a master degree from the Royal Conservatory to make a comparison of (the rules for) harmony as we know/use in the Western world and the equivalents in traditional Korean music. Basically the outcome of her highly interesting presentation (she sung beautifully) was, that there is no such thing as ‘our’ harmony in traditional Korean music. I also invited a Korean student of mine to try to compare Latin script-representations and Hangul to seek for similarities in harmony.<br>
      &nbsp;<br>
      So, I would treat any script-representation as a result of its own rules and I would encourage a subsequent description of the harmonic and related rhythmic dynamics for this. Thomas Milo is doing this for Arabic and the different approach in DecoType is the result of this thoroughly based insight.</p>
