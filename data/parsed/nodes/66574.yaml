      <p>An illustration of the problem of kerning and mark positioning interaction might be helpful at this stage. This is a relatively simple example, involving a single combining mark.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/CambriaKernMark_4867.gif"></div><p></p>
      <p>What happens during glyph substitution is that the regular i glyph is replaced by a dotless i when followed by a combining mark above (in this case a combining candrabindu). So the character sequence</p>
      <p>0054 0069 0310</p>
      <p>is displayed using the glyph sequence</p>
      <p>/T/dotlessi/candrabinducomb/</p>
      <p>The problem is that there is a pair kern between /T/ and /dotlessi/ of -70 units, and this kerning will be applied because these two glyphs are next to each other. This causes the following combining mark to collide with the crossbar of the T.</p>
      <p>In a font using old-fashioned kern table pair kerning, this is a shіt-out-of-options situation: other than disabling kerning completely there's no way to prevent this from happening.</p>
      <p>In a font using GPOS kerning, one has the option to contextually adjust or replace the kerning between the /T/ and /dotlessi/ to account for combining marks on the latter. I can speak from experience in saying that this is no fun: even if you try to group marks by similar widths, you end up requiring loads of separate lookups, one for each width of mark as context.</p>
      <p>What's missing is a way to define the adjacency relationships of multiple glyphs combined in typeforms such as /dotlessi/candrabinducomb/ <em>as units.</em></p>
      <p>Now, if we imagine a bubble around each of the glyphs, defining a minimum distance at each point around the outline to which another bubble may intrude, we can see how combination of the bubbles of glyphs forming typeforms into a single bubble for spacing purposes has the potential to enable correct spacing in all situations.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/CambriaBubbles_4331.gif"></div><p></p>
      <p>This isn't an easy shift to make in any respect. I've tried making bubble outlines manually, and trying to wrap my mind around where the bubble outline should go in order to get the desired relationship to a variety of different adjacent glyphs does my head in. [The bubbles in the image above are very crude, and designed only to demonstrate the potential for solving this particular illustration.] What I can imagine from a tool perspective is an interface that allows one to drag or cursor glyph outlines into ideal spacing relationships with a variety of other glyph outlines and then to automatically calculate bubble shapes based on these relationships.</p>
    html_clean: |-
