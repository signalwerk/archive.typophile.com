      <p>John, would you kern the bottom of an /A/ under that /T/ further than what it looks like your bubble allows?</p>
      <p>Did you think of other alternatives to having the bubbles be "hard" limits defining a minimum distance? (In a sense this is not a different paradigm from metal type bodies, just a version that allows for unprecedented amounts of filing down the sorts!) </p>
      <p>Another option would be larger bubbles that define a maximum distance (that is, that would overlap and wouldn't allow the gap between the /T/ and /i/ in your example). Or maybe the answer lies in in-between-size bubbles that are allowed to overlap and to have gaps, and which are positioned so that their total deviation from each other along their common height is mathematically minimized. </p>
      <p>I'm just throwing ideas out; I haven't thought through the feasibility nor preferability of them...</p>
