    html: <p>Ironically, I read Cyrus' post on glyph space almost immediately after sending a lengthy email to Frank Blokland on the subject of new approaches to spacing. While I think Cyrus is right that the attachment of spacing to glyphs was one of the characteristic distinctions between typography and writing, I don't think there is any reason at all why it needs to remain such. Glyph space was a necessary by-product of putting letters on little piece of metal. It seems increasingly bizarre to me that digital font spacing still follows a metal type paradigm and, hence, a two-stage spacing mechanism (advanced width default spacing followed by kerning adjustment).</p>
