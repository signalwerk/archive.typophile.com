      <p>Compugraphic had an interesting spacing system that I remember seeing back in the mid-eighties on some of their advanced typesetting systems. Instead of normal spacing + kerning pairs, they divided the glyph into several zones--upper, middle, lower--I don't remember exactly. Each zone was basically like having different sidebearings going from top to bottom. So, the A would have a narrow zone at the top and a wider one at the bottom. The T would have a wide zone at the top and a narrow one at the bottom. Spacing would be determined by matching up the zones for adjacent characters. It's not unlike the way they used to cut notches into metal and wood type to facilitate tighter spacing for the AT combination, for example.</p>
      <p>Anyway, I've played around with this idea and I don't think it would be hard to implement.</p>
