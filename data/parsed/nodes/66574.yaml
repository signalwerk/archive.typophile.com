      <p>One way to describe what I'm thinking about would be as a redefinition of glyph space. In some respects, one could say that the traditional typographic glyph space, whose paradigm is a piece of metal, isn't really glyph space at all, because it is independent of and ignorant of the shape of the glyph. It's a rectangle that butts up against other rectangles, and that may or may not result in an ideal spacing relationship between the glyph shapes that are carried on the rectangles. What if, instead of putting glyphs on rectangles, we put them on shapes that reflected the glyph shapes in such a way that when those shapes butted up against each other they resulted in ideal spacing for those glyphs?</p>
      <p>This ‘bubble’ idea is something that Laurence Penney and I discussed way back in the mists of time on the comp.fonts newsgroup (c. 1995). It is also, as I understand it, one aspect of the spacing in Tom Milo's Arabic layout model, which really does dispense with metal type paradigms. Microsoft's math layout uses a related concept with its ‘cut-in’ kerning, which is necessary because adjacent glyphs in math layout may have different scaling and vertical alignment, making traditional kerning impossible.</p>
      <p>Having looked at lots of different spacing models over the past fifteen years, this is the one I keep coming back to. The practical difficulty in terms of font development is the creation of the bubbles. If done manually, this is like a secondary kind of outline editing: you define the visible glyph and then the invisible bubble. But it should be automatable, i.e. it should be possible, by defining tolerances, to extrapolate the bubble from the glyph shape. The tricky aspect is that the bubble outline can't just sit at a fixed distance from the glyph outline because, obviously, in the case of a letter like T the bubble needs to be further from the vertical stem than it is from the ends of the crossbar.</p>
