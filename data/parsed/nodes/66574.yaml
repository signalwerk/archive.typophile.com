      <p>John: <em>[...] I don't see the relationship of centre line to distance. Distance seems to be arbitrary [...]</em></p>
      <p>John, there is <strong>nothing</strong> arbitrary in the shown model and also there is no kerning, as you implied. I will give a summary of the elements involved below. The model makes simply use of the traditional ‘side bearings’ structure and converts this into a more flexible and in my opinion as calligrapher, also in a more organic one. The conversion of the current system into mine should not be to complex and also it should be possible to reverse it. This is important for those who don’t want to change their font production workflow –I am one of them. It is also important that existing fonts can be converted to the new system without problems.</p>
      <p>—&nbsp;<strong>center line</strong>: The center in between the side bearings; normally (preferably) the optical center of the glyph. This is the point of reference for the positioning and stacking of glyphs, the <em>distance</em>, and the <em>glyph boundary</em>.</p>
      <p>—&nbsp;<strong>distance</strong>: The distance from the <em>center line</em> to the <em>center line</em> including the kerning (which, of course can be positive or negative). This value is the result of the spacing of characters (which traditionally is translated into side bearings plus kerning).</p>
      <p>—&nbsp;<strong>glyph boundary</strong>: Theoretically an arbitrary distance measured from the <em>center line</em>, which can be an extreme of the glyph on the x-axis or this extreme plus some extra space (to prevent collisions) or the ‘classical’ width (side bearing to side bearing). The glyph itself has no width, i.e., this is zero, which makes the stacking of glyphs possible.<br>
      The <em>glyph boundary</em> is used to prevent collisions of glyph parts. In defined areas (<em>collisions zones</em>) the boundaries are compared. A unit of stacked glyphs has multiple boundaries, but always a common base: the <em>center line</em>. If one of the boundaries collides with one of the boundaries of the previous (stack of) glyph(s), the complete unit, i.e., the <em>center line</em> will be shifted. If multiple boundaries collide, the largest <em>glyph boundary</em> will be used for calculating shifting.</p>
      <p>—&nbsp;<strong>collision zone</strong>: Area which is scanned for collisions of <em>glyph boundaries</em>.<br>
      &nbsp;<br>
      &nbsp;<br>
      Nicolaus Jenson clearly had a more simple solution to prevent collisions with accents; actually a constant mark shift to the right did the trick:<br>
      &nbsp;<br>
      </p><div class="imageWrap"><img src="/files/jenson_2_5356.jpg"></div><br>
      &nbsp;<br>
      <div class="imageWrap"><img src="/files/jenson_1_5582.jpg"></div><br>
      &nbsp;<p></p>
