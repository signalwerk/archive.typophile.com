    <p>Does anyone know if there is a version of Gill Sans Small Caps in Opentype format?<br>
    Monotype has Gill Sans Small Caps in a Family pack on fonts.com however under the technical details they are only listed as Macintosh PostScript, Windows PostScript, and Windows TrueType. The client this is for uses PC and I am doing the design on a mac. Would the TrueType translate to both platforms? </p>
    <p><a class="freelinking external" href="http://www.fonts.com/FindFonts/Detail.htm?productid=666585&amp;/cgi-bin/MsmGo.exe?grab_id=0&amp;page_id=27403&amp;query=GILL%20SANS%20PRO&amp;SCOPE=Fonts" rel="nofollow">http://www.fonts.com/FindFonts/Detail.htm?productid=666585&amp;/cgi-bin/MsmGo.exe?grab_id=0&amp;page_id=27403&amp;query=GILL%20SANS%20PRO&amp;SCOPE=Fonts</a></p>
    <p>Thanks in advance for your help!</p>
