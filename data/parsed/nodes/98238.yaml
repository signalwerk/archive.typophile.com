    html: <p>Cg is for Compugraphics. <a class="freelinking external" href="http://www.sanskritweb.net/forgers/monotype.pdf" rel="nofollow">Basilica</a> was on Compugraphics catalog before being acquired by Agfa, then merged with Monotype Typography Ltd. and finally sold to become Monotype Imaging Inc. That's why you can find now <a class="freelinking external" href="http://www.fonts.com/font/monotype-imaging/basilica/regular" rel="nofollow">Basilica</a> in the Monotype Imaging catalog.</p>
    html_clean: <p>Cg is for Compugraphics. <a class="freelinking external link-external" href="http://www.sanskritweb.net/forgers/monotype.pdf" rel="nofollow">Basilica</a> was on Compugraphics catalog before being acquired by Agfa, then merged with Monotype Typography Ltd. and finally sold to become Monotype Imaging Inc. That's why you can find now <a class="freelinking external link-external" href="http://www.fonts.com/font/monotype-imaging/basilica/regular" rel="nofollow">Basilica</a> in the Monotype Imaging catalog.</p>
