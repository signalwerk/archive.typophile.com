    <p>Has anybody ever seen a modern font version of this old postery art deco alphabet?</p>
    <p>It's in a couple type specimen books from the 40s, and I'm wondering if anybody's made a font out of it yet?</p>
    <p><img src="/sites/default/files/old-images/hunt_bros_alphabet_5660.jpg"></p>
    <p>-chank</p>
