      <p>Yeah, there's a good idea here, but it doesn't look like the execution was so great. So I'm thinking about making a font that looks like this, but is better. But wanted to make sure nobody else had already done it. It's a neat type style.</p>
      <p>The book is the Hunt Bros "Lettering of Today" from the 40s. But I know this alphabet was in at least one other lettering book, too.</p>
