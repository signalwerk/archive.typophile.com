      <p>Strictly speaking, if you’re being true to the inherent calligraphic ductus of this style, the d should join the h at the top, e.g:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Cadburys_logo_6205.gif"></div><br>
      However, I don’t mind the gap you had originally, which echoes the space between G and r, and also follows the syllabic word break.<p></p>
