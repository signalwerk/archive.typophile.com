    html: |-
      <p>There's an alternate 'G' in Bello Script (at Unicode 0122, gcommaaccent) that would fit better.  The short leading stroke on the subsequent 'r' is awkward to deal with, but can be moved closer to the alternate G. I tried connecting the G to the r, unaesthetically!</p>
      <p>The gcommaaccent alternate would have to be modfied to remove the accent; for some reason that's the ONLY glyph with that alternate 'G'</p>
      <p> - Herb</p>
