      <p>For me, working on my font project, I ran into these things all the time... I would find a letter that looked too dark or light, even though it was the same as others mathematically, and then go into other fonts and realize they have accounted for what's apparently a common optical problem.</p>
      <p>Also, DTF, when you say, "Type design is the art of tricking eyes and brains into seeing what you want it to see as opposed to what it has evolved to see." Wouldn't "Type design is the art of tricking eyes and brains into seeing what's really there as opposed to what it has learned to see." make more sense?</p>
    html_clean: |-
