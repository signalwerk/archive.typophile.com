    html: <p>It looks heavier because the curves going into the top of the stem are slightly heavier than anything similar happening elsewhere in the font. If you slightly lighten the left side of the notch in the top of r it should appear to have the same weight as the top of p. But this is a very minor detail, you’re probably the only person who will see it, and compensating for it might just create a light spot, so be careful if you try to change it. This kind of thing is pops up here in there in most type, and it isn’t necessarily wrong or undesirable, so don’t overthink it.</p>
