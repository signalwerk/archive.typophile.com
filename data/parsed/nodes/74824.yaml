  - id: 432218
    user: 14722
    date: 2010-10-02T12:15:00
    date_raw: 2 Oct 2010 — 12:15pm
    votes: null
    html: <p>Because of the intersections strokes/stems in a, e, f, t, f, œ and æ normally need to be a little thinner, and significantly thinner in heavy type. I don’t see it as being much of a problem here because your horizontal crossbars are rather light and don’t connect, which eliminates the extra heaviness that normally occurs. If you open up a well-constructed font and start measuring stems you’ll find this stuff all over the place.</p>
