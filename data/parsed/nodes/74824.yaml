      <p>It's looking very good.</p>
      <p>I should note that the reason that's recommended on typeworkshop is to make the letter more even, and help account for the large gap to the right. It's not to add legibility. Most fonts don't join much lower (slightly lower is usually necessary optically, and much lower helps the whitespace) and are very legible. But joining lower definitely helps with whitespace, and it was my decision for Neuton to do it the way recommended on TWS. But in some cases a high join is much better, it all depends on the font.</p>
      <p>Scala, Fago, IM Fell, and some of Fred Smeijers' fonts, have an r which actually joins <em>higher</em> than the n (unfortunately I don't have any of Smeijers' fonts at the moment). Most fonts actually don't change the join at all, and many join lower, some very exaggerated like Chaparral.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/rnjoin_4045.png"></div><p></p>
