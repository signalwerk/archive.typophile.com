    html: |-
      <p>Optically, the dot of the j usually needs to be slightly larger to account for  the descender. When looking at a j with an i directly next to it, where the dots are the same size, the j appears to have a smaller dot, even though they are exactly the same. It's mentioned in Karen Cheng's <em>Designing Type</em>, I believe.</p>
      <p>Unfortunately, finding fonts that I have which do this seems to have been a bit difficult. Some fonts that do: IM Fell French Canon, High Tower Text, Monotype Garamond, Adobe Caslon Pro. Surprisingly, some fonts actually do the opposite, this is especially true of italics. Example: Monotype Garamond Italic.</p>
      <p>In my example below, I also have included fonts that I had thought would have accounted for this, but didn't: Century Old Style, Minion Pro, Myriad Pro, FF Scala, Hoefler Text, Futura.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/ijdots_5137.png"></div><p></p>
      <p>This is a very interesting study, I think. Although you may not need to change the size....</p>
      <p>Regarding the d, b, and p being too open, I meant that, in comparison to the <strong>o</strong>, they look a bit too wide, or the counters look too large.</p>
