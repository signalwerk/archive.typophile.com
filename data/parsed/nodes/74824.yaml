      <p>Brian, I think the reason for the larger dot on the j in Adobe Caslon is that the head serif on the "j" is larger than the head serif on the "i". The larger dot is to match the larger head serif. </p>
      <p>The larger head serif I think is, in turn, to deal with the different shape of the "j"—the white space opened up by absence of foot serifs, and the bulb to the left. This is partly an "old style" thing, I think--and can be a good one. </p>
      <p>In my Williams Caslon Text, I made the j dot also larger, for the same reasons, but only slightly, as my j has only a slightly larger head serif, though quite a different shape. Also my feeling was that when the difference is too marked it looks a little irregular and antique, which I didn't want.</p>
      <p>In a sans, there is no reason for a larger dot, as there is no head serif.</p>
