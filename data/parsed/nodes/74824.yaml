      <p>1996type, how are you following the example on typeworkshop.com by making a cut off p?? The version of the r Tomi from Soumi presented follows that much better. Typeworkshop didn't recommend <em>not</em> making your r from an n, they recommended rotating the whitespace above the join of the n, and following that for the whitespace above the join of the r. The idea, of course, wasn't to follow this extremely strictly, but was to demonstrate a way to make a more balanced r.</p>
      <p>Like this:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/r_4938.png"></div><p></p>
      <p>- Start with an an<br>
      - Chop it off<br>
      - Fix the end of the r<br>
      - rotate the shape of the whitespace<br>
      And you now have a balanced lowercase r!</p>
      <p>The final example show that isn't the only way to make a fairly balanced r (this form is used in many classical serifs, and in some sans serifs), although the fourth example is slightly more balanced in this case. What you use, in my opinion, should depend on the design of the typeface. While you do sometimes need to sacrifice the logic of a design to make a more readable letter, sometimes you also need to sacrifice certain things about a letter to make a cohesive design. In this case, the letter r will not lose any readability, and in your design, this new r is more balanced than your previous design.</p>
