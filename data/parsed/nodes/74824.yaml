    <p>Hey everybody,</p>
    <p>I'm currently developping a typeface called expletus sans, which is also (an older version) in the critique section. Spme how the stem of the r seems to thick. It's not a rendering issue, because it occurs at all sizes and prints. It really is the right width. I've opended severla typefaces in Typetool and none of them had a thinner stem in the r. Is my eye acting weird, or am I making a mistake here?<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/expletuspict_4139.jpg"></div><p></p>
  html_clean: |-
