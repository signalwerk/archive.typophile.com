    html: |-
      <p>Lex, I think you're right. I tried it with a normal serif font at 300% the normal height, and got something very similar in shape. I wanted to try it with Perpetua, but it wasn't handy. (I think you need a typeface with a P whose bowl droops a bit after leaving the stem.)</p>
      <p>If you don't want to play such games, <a href="http://www.myfonts.com/fonts/agfa/peplum/peplum/testdrive.html?s=D+E+P+T&amp;p=72" target="new" rel="nofollow">Peplum</a> is similar 'off the shelf'.</p>
      <p>- Mike Yanega</p>
