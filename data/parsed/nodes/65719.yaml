      <p>I agree with DesignGuy as far as looking like a Sudtipos/Ale Paul font, although I would have picked some of the following as being more similar: <a class="freelinking external" href="http://www.veer.com/products/typedetail.aspx?image=UMT0000181">Affair</a>, <a class="freelinking external" href="http://www.veer.com/products/typedetail.aspx?image=UMT0000213">Buffet Script</a>, <a class="freelinking external" href="http://www.veer.com/products/typedetail.aspx?image=UMT0000149">Ministry Script</a> and <a class="freelinking external" href="http://www.veer.com/products/typedetail.aspx?image=UMT0000105">La Portenia</a>. All of these had a very similar feeling, but details weren't the same. I wonder if this used alternates from one of the fonts I mentioned. At least the test drives chose different letterforms.</p>
      <p>- Mike Yanega</p>
