    <p></p><div class="imageWrap"><img src="/files/SatowThankYou_4531.jpg"></div><p></p>
    <p>This monogram was engraved from a lettering style used in the Masterplate pantograph system.</p>
    <p>The letters are engraved in reverse on 1/2” thick steel then it (the die) is die stamped on this vintage, onion skin paper (about 9#) then hand folded in our bindery, here.</p>
    <p>Yesterday evening I realized how much the strokes remind me of Magnolia tree branches, we have several such trees in our yard.</p>
