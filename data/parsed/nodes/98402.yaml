    <p>Hello All,</p>
    <p>Looking for a web font that is similar to Gill Sans/Johnston but designed for screens and specifically without the lower-case l that looks like I and 1.  I have looked at Agenda and pretty much like it,  but am curious if their are other faces in this style that should be considered.</p>
    <p>Thanks<br>
    -Moe</p>
