  html: <p>This is almost certainly a custom designed logo. My <a href="http://bowfinprintworks.com/SansIDPage05.html" target="_blank">Sans Serif Font ID Guide (page5)</a> has the sans families I have collected with these kinds of letterforms, and the closest match was Linotype's Freytag (12-57), but there were numerous differences.  <br> <br>You should know that probably about 90% of logos and trademarks are custom work -- to make imitation more difficult, as well as to have an exclusive 'look'.</p>
  html_clean: <p>This is almost certainly a custom designed logo. My <a href="http://bowfinprintworks.com/SansIDPage05.html" target="_blank" class="link-external">Sans Serif Font ID Guide (page5)</a> has the sans families I have collected with these kinds of letterforms, and the closest match was Linotype's Freytag (12-57), but there were numerous differences.  <br> <br>You should know that probably about 90% of logos and trademarks are custom work -- to make imitation more difficult, as well as to have an exclusive 'look'.</p>
