    html: <p>&gt;Prime. my friend. prime. primer  <br> <br><a href="http://minwax.com/products/woodprep/" target="_blank">Minwax</a> who I think are the biggest producers of this kind of stuff, call the product pre-stain conditioner. I don't think there is one standard name for it. Primer usually refers to stuff that seals the surface, which this stuff doesn't. The main thing is, as I said, to read the directions and to do a test treatment on a scrap piece of the same species of wood to see how you like the result, and so don't mess up your project.</p>
