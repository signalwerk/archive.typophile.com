    html: <p>You can always paint over it, as long as you use the compatible paint - oil or water based, as the case may be. I don't remember about oil vs. water based stains. The main thing is that the varnish will have to be compatible with the undercoat. The conditioner thing (if I remember the name right) is specifically for pine. As it is a soft wood, pine really sponges up the stain, which is why it is tricky to stain. The conditioner pre-soaks it somewhat, so you don't get such a stark contrast.  <br> <br>If you do decide to go the stain route, try the process first on a raw wood pine board, so you will have an idea about the result, and whether you like it. Once you stain if you don't like it you can only paint it over or resand. The staining and varnishing is really simple - the headache is preparation   <br> <br>I took the trouble to look into this stuff when I stained some window frames and a door, as I knew I'd have to live with it for a long time. Doing it right really did make a huge difference. Now when I see pine stained wrong -blotchy, streaked - it screams out at me.</p>
