  - id: 45012
    user: 1026
    date: 2004-09-13T11:02:00
    date_raw: 13.Sep.2004 11.02am
    votes: null
    html: "<p><i>Do I use some kind of watery glue?</i> <br> <br>Never having done decoupage, I'm no expert. But for gluing paper, I always recommend YES! glue. Good stuff that doesn't wrinkle paper like Elmer's typically does. <br> <br><i>If I want to apply a translucent color on top, do I just use watered-down [water-based] paint?</i> <br> <br>I wouldn't water it down. In my art school hay-days, I used to make my own acrylic paint with Rhoplex AC33 acrylic emulsion. You could add a small amount of store-bought acrylic paint into a base of AC33 for a translucent color. Or you can add raw pigment into AC33. <br> <br>This sort of thing can be done with matte medium or whatever, but I found AC33 to be a much better solution. <br> <br><i>So I tried the stain on part of it, and it came out as complete mierda ... I don't want to bother with a conditioner</i> <br> <br>Have you ever used sanding sealer? With some [softer] woods, it can help to give you a more even finish. This may be akin to what William refers to as a conditioner.  <br> <br>A side note: there are 2 additives that improve the brushability of paint. Floetrol for water-based (latex) and Penetrol for oil-based. I've never used them in anything other than house-painting, but they may improve your surface somewhat. In house-painting they make a rolled surface looked professionally sprayed, and a brushed surfaced look rolled. They may well make a finger-painted surface looked brushed, but I've never tried.</p>"
    html_clean: "<p><i>Do I use some kind of watery glue?</i> <br> <br>Never having done decoupage, I'm no expert. But for gluing paper, I always recommend YES! glue. Good stuff that doesn't wrinkle paper like Elmer's typically does. <br> <br><i>If I want to apply a translucent color on top, do I just use watered-down [water-based] paint?</i> <br> <br>I wouldn't water it down. In my art school hay-days, I used to make my own acrylic paint with Rhoplex AC33 acrylic emulsion. You could add a small amount of store-bought acrylic paint into a base of AC33 for a translucent color. Or you can add raw pigment into AC33. <br> <br>This sort of thing can be done with matte medium or whatever, but I found AC33 to be a much better solution. <br> <br><i>So I tried the stain on part of it, and it came out as complete mierda ... I don't want to bother with a conditioner</i> <br> <br>Have you ever used sanding sealer? With some [softer] woods, it can help to give you a more even finish. This may be akin to what William refers to as a conditioner.  <br> <br>A side note: there are 2 additives that improve the brushability of paint. Floetrol for water-based (latex) and Penetrol for oil-based. I've never used them in anything other than house-painting, but they may improve your surface somewhat. In house-painting they make a rolled surface looked professionally sprayed, and a brushed surfaced look rolled. They may well make a finger-painted surface looked brushed, but I've never tried.</p>"
