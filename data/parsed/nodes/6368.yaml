    html: "<p>Despite the fact that I used to get messy with a bunch of emulsions &amp; dispersions in school, I'm no master of the chemistry behind these things. That said however, I'm not sure I'd try this: <br> <br><i>If I take like a reddish-brown paint, dilute it down and just paint that on</i> <br> <br>I'm pretty sure that the pigments in stain are different than the pigments in paint -- perhaps more importantly, I believe the suspension of the pigments in solution is of a different nature. And it collects in the grain of the wood quite differently. Stain brings out the wood grain,while paint obscures it. <br> <br>That said, if you want to use paint, make sure you use <i>transparent</i> red. E.g., Alizarin Crimson is transparent, while Cadmium Red is opaque. I think that Alizarin will let the grain show through, while Cadmium may not.</p>"
    html_clean: "<p>Despite the fact that I used to get messy with a bunch of emulsions &amp; dispersions in school, I'm no master of the chemistry behind these things. That said however, I'm not sure I'd try this: <br> <br><i>If I take like a reddish-brown paint, dilute it down and just paint that on</i> <br> <br>I'm pretty sure that the pigments in stain are different than the pigments in paint -- perhaps more importantly, I believe the suspension of the pigments in solution is of a different nature. And it collects in the grain of the wood quite differently. Stain brings out the wood grain,while paint obscures it. <br> <br>That said, if you want to use paint, make sure you use <i>transparent</i> red. E.g., Alizarin Crimson is transparent, while Cadmium Red is opaque. I think that Alizarin will let the grain show through, while Cadmium may not.</p>"
