    html: <p>Hrant, straining pine nicely actually has pretty demanding preparation.  <br> <br>If you just slap the stain on it will be splotchy and have an unnatural looking 'zebra' effect as well. Really quite ugly and very disappointing. To get a nice result you need to hand sand down with progressively finer sand paper, to avoid the splotchiness. Then you need to first put on a pre-treatment - do they call it 'conditioner' - that soaks in an prevents the stain from being too different on the summer and winter wood and getting the zebra effect. Then when you stain it will get a lovely natural look with the glow of the deeper color. <br> <br>Get a book on it for the details. <br> <br>This is enough bother and the result lovely enough that you may not want to do more.</p>
