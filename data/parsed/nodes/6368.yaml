  date_raw: 25.Aug.2004 4.48pm
  votes: null
  html: <p>So the other day I bought this monolithic pine chest with a 3x3 arrangement of hefty drawers for $10, sanded off the [disgustingly thick] varnish and stain (man, was that a chore, even with a belt sander), and now I have a blank canvas so to speak. I've bought a nice reddish wood stain (and a matte varnish) for it, but I'd like to do something more than just restain it all one color. But I don't want to make it a freaky piece that can only be appreciated by a... freak. Any ideas? FYI, the dimensions in feet are about 3H x 6W x 2D, and it has a nice paneled top (like old wooden floors had). It was built on June 16, 1978, which is two days before I turned 10. <br> <br>hhp</p>
