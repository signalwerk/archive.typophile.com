    html: <p>Hey Hrant, I remember I used to take a cinder block and roll it all arount the piece of furniture to it give scratches and dents for character. Then after staining and applying the finish I would rub black bee's wax with a cloth all-over, this would fill in all the "inperfections" with the wax and make it look aged. Than after a while just buff the surface so it will get an nice sheen. I was also told shoe polish is a good substitute. <br> <br>Sometimes I like to use crackling medium on furniture. Once dry, you can apply black wax to fill in the gaps then wipe the excess off with a clean rag. <br> <br>IM</p>
