    <p>Hello all</p>
    <p>The other day i walked into a store and saw a tee shirt that was printed using one of my fonts in the designs.<br>
    What can I do?<br>
    I cannot afford a lawyer and the country i live and work in doesn't have contingency based lawsuits.</p>
    <p>I bought the item and made plenty of photos and an evidence file in which i overlapped the two letterings.</p>
    <p>I will be glad to have any form of advice on this :)</p>
