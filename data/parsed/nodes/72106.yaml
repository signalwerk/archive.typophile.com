    html: <p>I have a friend that happened the exact same thing to. It was a large chain of clothing stores known for their lax relationship to intellectual property. The typeface designer contacted the company by email with the proof and was then contacted to negotiate a compensation. He got some thousand dollars for the one-time use. It was a US company, and they are so afraid of litigation (because of the cost) that they will move to have the issue settled quickly. Good luck!</p>
