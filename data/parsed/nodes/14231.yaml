    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Designers" class="freelinking" rel="nofollow">Designers</a> : Edward Benguiat</strong></p>
    <p>Edward Benguiat, early employee of <a href="/wiki/ITC" class="freelinking" rel="nofollow">ITC</a>, designer of many popular typefaces including the eponymous ITC Benguiat and ITC Benguiat Gothic, and Benguiat Interlock, recently revived in full OpenType glory by <a href="/wiki/House%20Industries" class="freelinking" rel="nofollow">House Industries</a>. He also worked on many revivals for ITC, including ITC <a href="/wiki/Souvenir" class="freelinking" rel="nofollow">Souvenir</a>, ITC Bookman, and ITC Cheltenham.</p>
    <p><a href="http://www.macworld.com/2001/04/bc/25benguiat/" rel="nofollow">MacWorld profile</a>, 2001.</p>
    <p><a href="http://www.linotype.com/7-1515-7/edwardbenguiat.html" rel="nofollow">Linotype biography</a></p>
