    html: <p>Marc, do you think this kind of layout looks bad?  <br>  <br>I am not trying to copy someone's work, it just inspired me to try something very different to what I would usually do (that is, very neat and minimal).  <br>  <br>Sean, I have a project at uni for double page spreads, this is the 1st time I'm using grids (eek!). I chose to redesign an article from Glamour mag about breaking up a friendship, but we don't have to adhere to the style of Glamour at all. That's why I considered doing something like the above example because I want it to have edge and attitude. It's advice about how to dump a bad friend!  <br>  <br>Thanks for replying I was about to ask if anyone was there!</p>
