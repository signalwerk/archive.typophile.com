    html: "<p>Cheryl, is that example one of David Carson's? As a student at art school (very recently!), I was quite excited and inspired by the work of David Carson. He managed to make typographic layouts into beautiful paintings. My views about typographic design might have changed since then, but I still appreciate his work from that period very much; it was a refreshing experiment that broke away from the minimal and grided layouts. He once said \"don't mistake legibility for communication\". But I think legibility is a requirement for the basic function of typography: type is a carrier of textual information. Type ceases to be type as soon as that linguistic function is lost. David Carson's deconstructive typography was painting. It communicates at a different level from what we think of as traditional typography.   <br>   <br>Now, do layouts have to be 'deconstructive' in order to be 'emotional'? Not at all, I think. Emotion could be communicated in many different ways, through the use of space, sizes, colours, typefaces, weights.   <br>   <br>It's interesting to see that deconstructive type is not actually that easy to make on the computer! Modern computer software were made to be grid-friendly! And we are conditioned to design accordingly. It's interesting...    <br>   <br>Simply set to print with tiling in Quark on your A4 printer.</p>"
    html_clean: "<p>Cheryl, is that example one of David Carson's? As a student at art school (very recently!), I was quite excited and inspired by the work of David Carson. He managed to make typographic layouts into beautiful paintings. My views about typographic design might have changed since then, but I still appreciate his work from that period very much; it was a refreshing experiment that broke away from the minimal and grided layouts. He once said \"don't mistake legibility for communication\". But I think legibility is a requirement for the basic function of typography: type is a carrier of textual information. Type ceases to be type as soon as that linguistic function is lost. David Carson's deconstructive typography was painting. It communicates at a different level from what we think of as traditional typography.   <br>   <br>Now, do layouts have to be 'deconstructive' in order to be 'emotional'? Not at all, I think. Emotion could be communicated in many different ways, through the use of space, sizes, colours, typefaces, weights.   <br>   <br>It's interesting to see that deconstructive type is not actually that easy to make on the computer! Modern computer software were made to be grid-friendly! And we are conditioned to design accordingly. It's interesting...    <br>   <br>Simply set to print with tiling in Quark on your A4 printer.</p>"
