    html: <p>Hi all, <br>I agree, very well put, Keith! :o)  <br>The example was from an online magazine called BEAST.  <a href="http://www.ths.nu/beast" target="_blank">http://www.ths.nu/beast</a>   <br>I found it inspiring even though some of it looks quite crude at times..the content is random and bizarre, but interesting nonetheless. Tell us what you think of the site.  Although it seems this kind of typography; a la David Carson etc, is dead in some of your eyes? *cries* ! 'Cause some of my friends are still trying this stuff out.  <br> <br>Where do you think magazine design is heading in terms of style, grids n all? Does anyone know any good examples online of grids and/or double page spreads?  <br> <br>Keith, the tiling worked! Cheeeers! And yes it is rather hard to create "deconstructive" type on computer. <br> <br> <br> <br></p>
