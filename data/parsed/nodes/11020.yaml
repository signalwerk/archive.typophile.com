    html: <p>Marc,    <br>    <br>What do you mean <i>Just say no</i>? Do you     <br>hate this?    <br>    <br>Cheryl,    <br>    <br>I would advise that if this your first time using    <br>grids to choose a different style to emulate -    <br>like one that actually uses grids. Try, even if    <br>you think it is boring, a more traditional, structured     <br>and formal layout. The pay back will be ten fold for     <br>building upon a foundation of solid structure. After     <br>you have studied strict layout you will find that you     <br>will be able to create an ad like the one above with     <br>more understanding of what it is you are doing.     <br>Perhaps you can even insert visual jokes at that point.    <br>    <br>I am sure you have heard it before, but the rules have     <br>to learned before they can be broken.  (This is a     <br>generalization really. Instinct is also very important.)    <br>    <br>But again, challenge yourself a bit more and     <br>perhaps even try a design style that you hate.    <br>I think what you learn will be worth your suffering.    <br>    <br>This link  would be worth checking out.  <br>http://www.imon.org/mueller-brockmann/ <br>  <br>-sean michael    <br>    <br>Oh yea, whatever you choose to do, just use square    <br>textboxes. Funky shaped ones will just be a whole    <br>bunch of trouble with no real reason for having them.    <br></p>
