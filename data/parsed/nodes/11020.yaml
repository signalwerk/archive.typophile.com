    html: <p>Cheryl, I'm a magazine junkie (and design  <br>them for a living), so I saw way too much of  <br>this stuff back in the heyday of David Carson  <br>and Raygun.  <br> <br>Not that I have anything against asymmetry  <br>per se. In fact, a "neat and minimal" spin on  <br>this style could be pretty interesting. <br> <br>Oddly shaped text boxes are handy if you have  <br>a specific shape in mind for a block of text.  <br>That way you can change the size/leading of  <br>the text without having to re-break lines or set  <br>new tabs.</p>
