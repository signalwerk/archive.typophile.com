  html: |-
    <p>I am trying to figure out a way to render typography into a 3D plane. I am able to do it in photoshop by rasterizing the text and then transforming its perspective. I have also tried it in Illustrator using the 3D effect. I am not completely happy with my results yet. I would prefer to take a text frame and put it into perspective and then have the ability to edit the copy.</p>
    <p>Has anyone had any great luck at this? Should I try 3D software.... if so which one?</p>
    <p>best,<br>
    josh</p>
