    html: <p>If you are interested in more complicated effects, 3d apps will get you there, but there is a pretty big learning curve, and an even steeper price curve. A good place to start for price/features is the open source 3d app Blender [ <a href="http://blender.org" title="http://blender.org">http://blender.org</a> ], but it will take a while to figure out the interface.</p>
