    html: <p>Where you are setting the type on a flat plane, 3d software won't give you much advantage over Photoshop or Illustrator. You can really achieve any perspective you want with a non-affine transformation (where you can drag the corners of the transform box independently).</p>
    html_clean: <p>Where you are setting the type on a flat plane, 3d software won't give you much advantage over Photoshop or Illustrator. You can really achieve any perspective you want with a non-affine transformation (where you can drag the corners of the transform box independently).</p>
