  html: |-
    <p>Im not sure how good this despcription is. Its the font used on Satyricons Intermezzo II Ep in 1999, on the booklet side, song list and credits. Its pretty gothic, but with this nice sharp scandinavian finishing. I didnt find any font quite like it. So far Ness from Fountain <a href="http://www.fountain.nu/catalogue/ness_reg.asp" title="http://www.fountain.nu/catalogue/ness_reg.asp">http://www.fountain.nu/catalogue/ness_reg.asp</a> goes closest. But i wonder if this Bodin's font is available for purchase anywhere? </p>
    <p>Cheers</p>
