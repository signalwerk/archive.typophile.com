  html: |-
    <p>Phidias Greek is a metal typeface designed by <a href="/node/12150" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Hermann Zapf</a> for <a href="/node/12158" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">D. Stempel <span class="caps">AG</span></a>. It is designed to be used together with <a href="/node/16868" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Michelangelo</a>. A digital version of the glyphs is included in the <a href="/node/13697" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Linotype</a> typeface <a href="http://www.linotype.com/109974/palatinonovatitling-font.html">Palatino nova Titling</a>.</p>
    <p>Please see the <a href="/node/16864" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Palatino</a> entry for more&nbsp;information.</p>
