  html: |-
    <p>Phidias Greek is a metal typeface designed by <a href="/wiki/Hermann%20Zapf" class="freelinking" rel="nofollow">Hermann Zapf</a> for <a href="/wiki/D.%20Stempel%20AG" class="freelinking" rel="nofollow">D. Stempel AG</a>. It is designed to be used together with <a href="/wiki/Michelangelo" class="freelinking" rel="nofollow">Michelangelo</a>. A digital version of the glyphs is included in the <a href="/wiki/Linotype" class="freelinking" rel="nofollow">Linotype</a> typeface <a href="http://www.linotype.com/109974/palatinonovatitling-font.html" rel="nofollow">Palatino nova Titling</a>.</p>
    <p>Please see the <a href="/wiki/Palatino" class="freelinking" rel="nofollow">Palatino</a> entry for more information.</p>
