      <p>Hrant: this reads "msr" in Arabic, which I presume is the 3-letter abbrev. for "Miṣr" -- the native name for Egypt. So this top level domain still complies to the old system ".uk", ".de", ".nl" and so on.</p>
      <p>The new system allows any top level domain (any one if you pay for it, that is).</p>
