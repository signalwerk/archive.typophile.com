    <p>“<a class="freelinking external" href="http://www.icann.org" rel="nofollow">ICANN</a> has opened the Internet's naming system to unleash the global human imagination. Today's decision respects the rights of groups to create new Top Level Domains <strong>in any language or script</strong>.”</p>
    <p>Good news, I hope. Well, here’s my imagination:<br>
    .<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/Typo_6421.jpg"></div><p></p>
