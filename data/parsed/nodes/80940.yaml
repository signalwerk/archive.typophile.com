      <p>@earthache - I looked a little more into Smart Guides and unfortunately, the edge of the circle doesn't snap to the the guide that's on a diagonal.</p>
      <p>@Luma - Thanks for this bit of geometry. It's great in theory, but Illustrator's limitations appears to not be able to accurately put it into practice. Here's the problems I ran into:</p>
      <p>1. In order to do step one, I'd need to know exactly where the circle should hit. If I have to create a point on the line, I'm still not sure exactly where that point should be. </p>
      <p>2. Even with a point there, the center of the circles are not snapping to it.</p>
      <p>3. The "snap to" function ignores any object or guide that's on an angle. Even with a smart guide, I think I have to just visually guess if it's perfectly aligned.</p>
