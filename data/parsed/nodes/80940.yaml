      <p>I was assuming that you could use the estimation that you already had to locate the point accurately enough.  Maybe that is not close enough for you...</p>
      <p>So the harder-but-more-accurate way:<br>
      Draw lines paralell to the straight lines that are exactly as far away from the original lines as the radius of the curve you want to make.  The intersection of these lines will be exactly where your circle should be centered.  You probably have to know the actual angle of your lines, but that can be calculated easily enough.  </p>
      <p>Snapping to center is easy with smart guides turned on.  I don't really understand the snapping trouble you are describing, it sounds totally unlike my experience using Illustrator CS.</p>
