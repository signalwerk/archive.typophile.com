      <p>First, I would say that those grid diagrams are more for dispaly than actually how the work was constructed.  In other words, they are often added after the fact. </p>
      <p>However, it is possible to do this in illustrator with a bit of geometry (don't be scared!)</p>
      <p>1) Add anchor points to the straight lines where you would like the circle to intersect</p>
      <p>2) Draw 3 circles the same radius as you want your final curve to be.  Center 2 of these circles on the points from step 1</p>
      <p>3) Center the third circle on the intersection of the 2 previous circles.</p>
      <p>4) Celebrate!</p>
