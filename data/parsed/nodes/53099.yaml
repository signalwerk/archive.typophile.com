      <p>First, let me dissociate myself from gohebrew's comments. Where in the Bible does it recommend smashing babies? That is just revolting, and I would certainly repudiate it if it says so with approval, which I very much doubt. Your interpretation of the 'rodef' law is dangerously close to that of the assassin of Yitzchak Rabin, and is false and dangerous. I hope you think better of it.</p>
      <p>Fortunately, the prophets and Jewish post-biblical sages make clear that the chief Jewish values are kindness, justice and humility. Not joy in killing the "enemy". Even though self-defense is legitimate, it is against Jewish values to rejoice in your enemy's suffering.</p>
      <p>Aziz, let me address your comments, first generally. We all have a choice about whether to see the solution of the world's problems either in effective cooperation with others different from us, on one hand, and, on the other hand, in destroying our "enemies". The dividing the world into "us" and "them", the enemy, is the first step to dehumanizing others, and giving an excuse for brutality and suffering. </p>
      <p>The "us and them", black and white thinking is also destructive of peace, prosperity, and love. </p>
      <p>I see the same kind of "us and them" thinking in your comments, and in gohebrew's comments. In your case, you seem to think that stopping Jewish immigration into Palestine was sufficient justification for al-Husayni's leading anti-Jewish riots, and seeking Hitler's help. (For the latter, see the Telegram from Himmler to Husayni in the Wikipedia article.)</p>
      <p>I, on the contrary, think that is exactly the kind of backward, tribal, us-and-them thinking that keeps the middle east in war and the Arab peoples in poverty. It is leaders who exploit nationalism to keep in power and control the populace, against its own true interests. </p>
      <p>As I said, the US has been at times far more enlightened as concerns immigration. Currently, about 10% of US residents are foreign-born. And during one earlier period great immigration, 1890-1910, millions of Jews came to the US, including my grandparents. While we have our scoundrels also--such as the infamous Madoff--the US as benefited greatly from this immigration, as well as from immigrants from other groups all over the world. </p>
      <p>For example, one of those immigrants was the Jewish (but irreligious) John von Neumann, the math genius who invented the architecture of the computer you are using to design your Arabic fonts. Cooperation = productivity. </p>
      <p>The key issue to me is the ability to see the faults and sins of your own group, and the humanity and merits of the other. That is the foundation of peace and cooperation, and I am saddened that I haven't read in any of your comments acknowledgment of the evil done by anti-Jewish Arab terrorists, or of the good done by Jews in Israel and around the world. </p>
      <p>I am sickened by the current war, and do fault Israel for its settlement policies under Begin and Sharon. I don't know enough about the situation to know whether the current war could have been avoided by wiser Israeli policy. But I certainly do see the Hamas policy of attacking Israel with the declared intent to destroy it, even after Israeli withdrawal from Gaza, as very wrong. </p>
      <p>I pray that both sides will be able to think beyond "us and them", and make peace.</p>
