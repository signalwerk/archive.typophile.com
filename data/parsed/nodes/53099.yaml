      <p>Typedog, I found the passage that Gohebrew refers to. </p>
      <p>It is at the end of Psalm 137. This poem is a bitter lamentation and cry for vengeance by those who were themselves subject to mass murder and exile from Jerusalem into Babylon. It begins with the famous lines about weeping by the waters of Babylon, and concludes by crying out for vengeance against those who urged the Babylonian armies to killing and destruction. Here are the concluding lines in the recent translation of Alter: "Recall, O Lord, the Edomites, on the day of [the destruction of] Jerusalem, saying "Raze it, raze it, to its foundation!" Daughter of Babylon the despoiler, happy who pays you back in kind, for what you did to us. Happy who seizes and smashes your infants against the rock."</p>
      <p>It is a total perversion of Judaism to read this as anything but a cry of despair. It is never interpreted as a divine commandment. On the contrary, the Torah is generally against vengeance, having many passages against it. The exception is a defensive war, but even there, strict limits exist, including doing everything to avoid the death of non-combatants. The written Torah was interpreted extensively in later Jewish tradition, generally pushing everything in the direction of being as humane and peaceful as possible, while preserving the right of self-defense. </p>
      <p>Indeed, in the current war the Israeli phone calls to civilians to vacate anything to be bombed is a reflection of Jewish law on protecting non-combatants. </p>
      <p>Unfortunately today's weaponry is so powerful and hard to control that it often kills non-combatants, against traditional Jewish law. This leads to difficult moral dilemmas even for the most conscientious leaders of a war. (Of course Hamas has no problems about targeting non-combatants, including any Jew around the world they feel like targeting.)    </p>
      <p>Here is a very thoughtful discussion of Jewish and other views on war, in the current context of the Israel-Palestine wars:</p>
      <p><a href="http://www.gmu.edu/departments/crdc/docs/j_limitsofwar_and_cr.html" title="http://www.gmu.edu/departments/crdc/docs/j_limitsofwar_and_cr.html">http://www.gmu.edu/departments/crdc/docs/j_limitsofwar_and_cr.html</a></p>
      <p>In crediting the Israelis for their efforts to limit civilian casualities, I am not saying that this war was necessary. It may well have been, but I just don't know enough to judge the situation from this distance. </p>
      <p>I do know that it is horrible and sickening. I fear that nothing good will come of it, though I would be very happy if it turns out to be the last battle of a 60 year war. </p>
      <p>In any case I pray for the safety of non-combatants, and for a quick and lasting peace.</p>
