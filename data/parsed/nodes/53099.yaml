      <p>Aziz, the Wikipedia biography includes a detailed discussion of al-Husayni's Fascist and Nazi sympathies and collaboration, and his role as leader of radical anti-Jewish efforts in Palestine. </p>
      <p><a href="http://en.wikipedia.org/wiki/Amin_al-Husayni" title="http://en.wikipedia.org/wiki/Amin_al-Husayni">http://en.wikipedia.org/wiki/Amin_al-Husayni</a></p>
      <p>Had Arab leaders had a policy of tolerance and taking full advantage of the talents of the new Jewish immigrants from Europe--as we in America have had for immigrants into the US--there would have been peace and prosperity, and by the way in all likelihood no majority Jewish state. Al-Husayni and other Jew-haters seem to have had a key role in creating Israel, though that of course was not their intention. </p>
      <p>As to the Israeli war of independence, there is no doubt whatsoever that Arab countries attacked the Jews in an effort to eliminate the newly declared Jewish state. That was their declared policy, while the Jews accepted the partition. </p>
      <p>If you accept the UN partition, there is no doubt that this was Arab aggression. Of course, you might interpret the partition as Western agression that the Arabs were fighting against. But the Jews themselves were not the ones starting the war. They were pawns in the game, though pawns who wanted to live and were willing to fight for it. </p>
