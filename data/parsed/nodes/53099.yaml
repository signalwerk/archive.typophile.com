      <p>In order to logicaly debate, the issues upon which we disagree must be delineated and understood, and the issues upon which we agree must also be delineated and understood.</p>
      <p>What do we agree upon?</p>
      <p>The currently ruling government in Gaza of Hamas rejects Israel's right to exist, and has acted violently to murder Israelis for many years through missiles and suicide bombers.</p>
      <p>If Hamas ceased to exist or be of no influence upon the Gazan people, then there would be no more war in Gaza, and the Israelis would harm no one anymore in Gaza.</p>
      <p>Do we agree upon this?</p>
      <p>Does Israel have the right to defend its people?</p>
      <p>If Hamas hides behind the Gazan people, does Israel have a right to defend its people, even if Gazans will be harmed or killed in the process of innocent Israeli people?</p>
      <p>Upon what do we disagree?</p>
      <p>I agree that no human being can decide that a baby will ultimately become a murderer or a suicide bomber, and be killed still as a baby.</p>
      <p>No ordinary human being is so endowered in determining the future.</p>
      <p>My point is with regard to clear obviously factors. What are those? They are nothing that we are familiar with.</p>
      <p>In Torah laws, there is a distinction between chayav mitah b'yadei shamaya'im, and ...b'yadei adam.</p>
      <p>In the example of Abraham, this is a case of chayav mitah b'yadei shamaya'im, where a person is liable to be killed through the agency of heaven. Certainly, a nation which seeks the destruction of Israel is in the category of being liable to be killed through the agency of heaven.</p>
      <p>In the case brought in Shulchan Orech and quoted repeatedly by the late seventh Lubavitcher Rebbe of thieves who steal wheat on a border town, this is a case of people who are liable to be killed through the agency of people. Certainly, a nation which seeks to harm Israel is in the category of being liable to be killed through the agency of people.</p>
      <p>No Chabadnik, like no yirat shamayim, would dispute these words.</p>
      <p>I also hope that Israel's enemies are completely eradicated. I hope the Palestinians too have a government interested in making people, and having a people grow to their true potential.</p>
