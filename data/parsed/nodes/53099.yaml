      <p><em>But we live in a cruel world. Therefore, the Jewish Bible teaches us to be realistic. There are Bin Ladens and Hamas hypocrites. It teaches to destroy the enemy before they destroy us.</em></p>
      <p>It's pretty sad when <em>both</em> sides are taught that by their religions.<br>
      It's even sadder when the people who are taught such things believe them to<br>
      the letter and don't see through the venom and misguided pride they breathe.</p>
      <p>Can you see there are <em>humans</em> on the other side? Humans, who live, breathe, work, talk, pray, meet friends, buy food (if they can get some), eat, sleep, crap, laugh and cry? Humans who design type, for God's sake? Humans who are scared, and humans who then suddenly live no more? –<br>
      I'm not trying to make you "feel sorry for them," and please note that I'm not aiming to play down their crimes, their violence, their killings. I'm trying to make you see what this is, on a very basic level.</p>
      <p>Palestinians are not abstract personifications of violence, hate, and evil, "so-called civilians" whose <em>raison d'être</em> is to be worthless moving covers for the Bad Guys. They are humans, and they have hope, and dreams, they have pride, and they have a sense of home. And they have a right to live. Just like you do – and rightfully so. But their feelings aren't any less rightful than yours, and that's the painful and difficult part that is sometimes blotted out by gunfire and war rhetoric.</p>
      <p>So, which path are you going to choose? One would be for Israelis <em>and</em> Palestinians to stop viewing each other as "enemies to be destroyed", but as <em>partners</em> calling the same land their home*; and trying to find a way to live together in something resembling peace. That's going to be hard, and painful, and you're not going to get your way all the way.<br>
      The other option of course is to attempt to kill them all, completely subjugate them, or drive them out of their homeland. Although you might consider that's been tried before; it doesn't work particularly well, and it doesn't look good either.</p>
      <p>* And please don't suppose I don't think <em>both</em> sides would need to do serious homework for this.</p>
      <p>Not that I'd really still believe people would learn from history. And I realize much of this post is a hopelessly romantic appeal. But hey, it's worth a try to remind people not to realize the horror of humanitarian catastrophes only after the fact. Like what happened to the Jews themselves (and part of my own family with them, by the way). To the Armenians. Want a list?</p>
      <p>Can you see that a Palestinian's life is not any less valuable than an Israeli's?</p>
