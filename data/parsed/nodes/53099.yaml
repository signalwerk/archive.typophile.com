      <p>Typedog, from a Jewish point of view it looks like the "crime of Israel" in the eyes of many of its opponents, including Hamas, is simply wanting to exist. The United Nations declared a two-state solution, and the united Arab countries did not accept it, and in 1948 tried to drive the Jews into the sea, as they put it. </p>
      <p>There followed a series of wars and terror campaigns against Israel up until today. Israel was able to defend itself, which is not a crime to me. There was the high cost that almost everyone in Israel has a relative or friend who died in these defensive wars. </p>
      <p>Israel also, led by Ariel Sharon, engaged in a long and brutal occupation of Gaza and the West Bank, which compromised it morally and, in my view, undermined its security.</p>
      <p>After this long history of war and folly there is finally acceptance of the existence of Israel by it seems most Arab governments, and agreement on a two-state solution--which was the original decision of the UN. </p>
      <p>Hamas and Iranian leaders and other radicals still don't accept the right of Israel to exist. So when ironically Sharon himself, chief author and leader of the Israeli brutality that has taken place, stopped the occupation and pulled out of Gaza, Hamas's reaction was to make a coup d'etat against the Palestinian Authority and wage war on Israel.  </p>
      <p>You need to understand that peace has been possible for 60 years if Israel's neighbors were willing to accept its right to exist. That is shown by the fact that when Jordan and Egypt were willing to make peace, it happened quickly, and the peace has been kept. It is those who believe like Hamas who have been the destroyers of the possibility of peace. </p>
      <p>I pray that the guns and bombs on both sides will stop, the killing will stop, today, and peace will at last come this year to all in this long suffering region.</p>
