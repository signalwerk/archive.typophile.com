      <p>&gt;British army occupied Palestine in 1917 and opened its doors *illegally and criminally* to European settlers </p>
      <p>That's not what I read. What I read is that with very rare exceptions, the Jews who moved into Palestine bought land properly and legally. They also brought European knowledge and skills that enabled them to develop the economy, so that there was large Arab immigration into and near where the Jews have settled. </p>
      <p>Sitting here in America, and knowing my family's history for the last century, I just don't see why the Arab population couldn't have been tolerant and cooperative if they wanted to be. For the past 25 years, I have lived in a cluster of about 50 townhouses, and my next door neighbor, with whom I share a common wall, is Egyptian and Muslim. We've never had any problems and it would be unthinkable and criminal if anyone were to harm his property or family, although he's the only Muslim in a majority Christian neighborhood. And I think others would have the same view if some in the majority culture would come and try to expel me, a Jew, from my house.</p>
      <p>Now I don't deny that there are intolerant people in the US. In the early 20th century there was a lot of anti-semitism. And now, with the huge Hispanic immigration, there are some who are equally intolerant. But I glad to say that the voices of tolerance have generally prevailed. </p>
      <p>What I read went on is that people like Amin Al-Husseini whipped up fear and hatred of the Jews for their own interests. And, as I said they against their wishes help create a separate Jewish state because Jews felt that otherwise they would be attacked--as they had been in riots led by Al-Husseini. </p>
      <p>I am very familiar with this tactic of demagoguery. I have seen it done by US Southern demagogues like George Wallace, who whipped up anti-black feeling for their own gain. And recently to my sorrow George W. Bush got re-elected by whipping up fear of radical Islam. </p>
      <p>If you don't want to participate, I understand, but know that there is certainly not agreement in the West on your version of the history. If you have references in English I can read, from actual scholars, I'd be interested in the other side of the history. </p>
      <p>As to keeping the keys to your houses, like it or not, the Jews have in effect been keeping the keys for 2000 years, reciting every year at Passover 'next year in Jerusalem'. And they kept alive the Hebrew language, which is the native Caananite language, and not Arabic, which was not spoken in those lands until the Arab conquest. The Jewish claim of connection to the land of Israel is very real and historical. </p>
      <p>Aziz, your holocaust denial is grotesque, ugly, and absurd. I know from personal family stories, and a survivor of Auschwitz who is a friend today, as well as from libraries of histories, that it was all too real.</p>
