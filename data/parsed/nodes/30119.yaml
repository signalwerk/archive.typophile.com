    <p>Hello Typophiles,</p>
    <p>Right now we all are having our "Package Design Course" at the university. Its a total 4 weeks course including the research, surveys, problem finding and the final product. As a final product we have to redesign the complete package according to the problems we figured out in the existing packaging.</p>
    <p>I've taken the cigarette packaging for my research. Ive tried few concepts for the boxes but am planning to give a typographic treatment to the cigarette boxes and to the cigarettes. Generally they have very rich classic look but i wanted to try a bit different.</p>
    <p>Now the question is - Will it be a good idea to explore typography on cigarette packaging? Will it affect the buyer? Please tell me what you all think about this idea.</p>
    <p>Smoking typophiles can tell me what they would like to have on their cig-box, may be i can try that as well :)</p>
    <p>Thanks for the time,<br>
    Satya_</p>
