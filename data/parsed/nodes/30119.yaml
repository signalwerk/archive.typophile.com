      <p>In the late 60s, I went to a small "great books" liberal arts school west of Chicago, called Shimer College. A wonderful place. One of the English professors there had worked in advertising and then subsequently was living out his dream of being a college professor, wearing a tweed jacket with suede elbow patches, smoking a pipe, and driving an antique Jaguar SS100. As he told the story, Marlboro had originally been positioned as a "ladies' cigarette." Not a big seller. They then did a complete about face and turned it into the cowboy thing, and Andy was one of the first models to pose in the photographs. He was very glad of this, since the income from all his connections with the creative enabled him to leave the agency and go into teaching. He also was quick to point out how manipulative the whole thing was, and that it had everything to do with image and association, and almost nothing to do with the cigarette itself. Might the agency have been Burnett? Too long ago, can't remember. (And maybe this is covered in Patty's book.)</p>
      <p>My two puffs worth,</p>
      <p>Bruce</p>
