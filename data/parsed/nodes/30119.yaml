      <p>"NIL" from Germany and Danish "King's" or "King's favourites" are both quite stylish, I think. King's were originally designed by Claus Achton Friis, one of the great Danish designers/ typographers.<br>
      (see image below, from Steen Ejler: Claus Achton Friis — Skrift og brugsgrafik, Arkitektens forlag , Copenhagen 1996)<br>
      The picture shows the design from the 50's but they pretty much look the same nowadays, despite a redesign which added some new background colors for the different versions.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/P1020176_6361.png"></div><p></p>
      <p>I also remember reading an article arguing that "the smoking problem" (no quote) could be helped by designing ugly packaging i.e. with clashing colors, misprints, overprints and hard-to read type that would make it difficult to differentiate the brands and to make cigarettes look less like a lifestyle product.</p>
