      <p>Kris-</p>
      <p>Guess what.</p>
      <p>If a dollar symbol has only one strike, it means the backing behind the currency is void, like the symbols Ф, which only has one strike.</p>
      <p>If a dollar symbol has two strikes, it means the currency is backed by substance, such as silver.</p>
      <p>Statutory government, which operates in pure fiction, only recognizes the single strike version of the currency.</p>
      <p>If you provide a double-strike symbol in a statutory government document, they won't know how to recognize the symbol.  In fact, if it is a court case, they might throw it out, because courtrooms only operate in fiction, unless they are in the common law.</p>
