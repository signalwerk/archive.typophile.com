      <p>Kris, kia ora. The single versus double is really an aesthetic thing. There is also the option of having the strokes only off the top and bottom of the "s", and not filling in the counters, which is useful in heavy weights. </p>
      <p>The same issue occurs with the Euro and Sterling glyphs, which at heavier weights and in Oldstyle variants, tend to get pretty thick around the middle with two strokes. There are several currency signs which call for double strokes: Yen (U+00A5), Colon (U+20A1), French Franc (U+20A3), Lira (U+20A4, as noted in the Unicode document, this is like the Sterling symbol but with two horizontal strokes; most people chose to use the Sterling glyph instead.), Naira (U+20A6), Won (U+20A9), Tugrik (U+20AE; the double strokes are angled), and Peso (U+20B1). And probably some more. </p>
      <p>In my life I have been called on to revise a double-stroke Sterling glyph to better differentiate it from the Euro.</p>
