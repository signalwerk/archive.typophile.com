      <p>I use the double bar whenever I write the dollar sign by hand (in Canada). The reason may have to do with the fact that I played a lot of Monopoly when I was young and there was a double bar dollar sign on the game cover from the 1970's.</p>
      <p>I thought that the current, pervasive use of the single bar dollar sign had to do with the advent of the personal computer and the decision to use the single stroke $ symbol to denote a 'string' in the early computer programming languages. Since the first users of the personal computer were mostly programmers, I imagine that it would have made sense to put the string key $ on the keyboard rather than the dollar sign (with double bar). Or rather, if my history is wrong and a single bar dollar sign was in fact an acceptable or current form at that time (but I was too young to know it), then the single bar dollar sign was likely chosen since it would show up better on small, lower-res computer screens and with the low-res dot-matrix computer printers. As everybody uses computers now to write rather than by hand, with the printed word following the type found on the computer (e.g. newspapers, price stickers, etc.), we seem to be stuck with the single bar dollar sign.<br><img src="/sites/default/files/old-images/monopoly$_3521.jpg"></p>
