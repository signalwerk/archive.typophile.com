      <blockquote><p> a single strike rather than a double </p></blockquote>
      <p>Today, Bolivia is one of the poorest countries in South America.<br>
      Ironically it was the largest producer of Silver ever known to mankind.</p>
      <p>41,000 metric tons of pure silver were mined from Cerro Rico from 1556 to 1783 by Spanish invaders, killing thousands of natives in the process. And, as the local indians where to few, they also imported African slaves to keep mining Potosí silver.</p>
      <p>As a result of this exploitation, the spanish silver coins experienced an enormous global boom, and became the most widespread currency in the world in the 18th century.  The spanish Potosí silver coins where accepted by traders all around the world. It became the first 'World Currency'.</p>
      <p>“Vale un Potosi” (It is worth a Potosi) became a commonly used expression to describe vast wealth, after Quixote blurted it out in Cervantes’s Don Quixote.</p>
      <p>These coins where also know as the "Spanish dollar".<br>
      The Spanish dollar was the coin upon which the original United States dollar was based, and the Potosí silver coins remained legal tender in the United States until the Coinage Act of 1857.</p>
      <p>The coins looked like this:<br><img src="/sites/default/files/old-images/potosi-coins_4878.png"></p>
      <p>Some theories suggests that the Dollar sign we know today, is the result of removing the spanish coat of arms from the middle of the coin,  and merging the 2 remaining columns together under one unified ribbon.</p>
