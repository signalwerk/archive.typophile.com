      <p>There are typical regional preferences in currency symbols, but not really standard distinctions. At the character encoding level, there is simply a dollar character, and whether the glyph in a font has one stroke or two is a design decision. So what your client is expressing is a New Zealand preference for fonts in which the dollar sign has a single stroke.</p>
      <p>This is very similar to the supposed distinction between the British sterling symbol and the Italian lira symbol (although this did result in partial disunification at the character encoding level; I say partial, because the lira character U+20A4 ended up not being used very much, and most Italians continued to use the sterling character U+00A3). The argument there was that the British sterling symbol most often had a single bar (but could have two) but the Italian lira sign must always -- yes, always, absolutely everywhere -- have two bars. I had great fun in Italy wandering around the markets, pre-euro, photographing all the price signs in which the lira had only one bar :)</p>
    html_clean: |-
