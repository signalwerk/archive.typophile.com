      <p>I've just had another look at this forum, and although a little off the topic, but still relevant, is this little tidbit:<br>
      The dollar sign  actually evolved from a mark that is a representation of p8, the contraction of 'pieces of 8' (Spanish currency used in the Americas). It evolved into the 'S' with the two bars. Mechanical reproduction of type caused the removal of the second bar as the two thin lines so close to each other would cause ink to run, or blend into one line anyway. Hence one bar. Type designers are now even doing away with the part of the bar inside the character.<br>
      N.</p>
