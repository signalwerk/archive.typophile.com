      <p>To add more fuel to this fire...</p>
      <p>As an Australian graphic designer and typographer I have been faced with the one slash versus two a couple of times in my career. The request to use the single stroke dollar sign usually comes from editors and seems to stem from an ingrained cultural bias against the double stoke, in that it is associated with the US dollar. There is some colloquial evidence to suggest that Australians adopted the single stroke dollar sign after WW2 to differentiate the Australian Dollar from the US dollar, essentially an attempt to distance  us from the 'Seppos' (charming rhyming slang, Americans &gt; Yanks &gt; Septic tanks &gt; Seppos). I imagine the Kiwis acted on equal sentiments...</p>
    html_clean: |-
