      <p><cite>There are several currency signs which call for double strokes: Yen (U+00A5), Colon (U+20A1), French Franc (U+20A3), Lira (U+20A4, as noted in the Unicode document, this is like the Sterling symbol but with two horizontal strokes; most people chose to use the Sterling glyph instead.), Naira (U+20A6), Won (U+20A9), Tugrik (U+20AE; the double strokes are angled), and Peso (U+20B1). And probably some more.</cite> </p>
      <p>For what it's worth, the won symbol (₩) can have one or two horizontal strokes. I'm not even sure which version I'd use in my own handwriting though. Maybe a slight preference for two strokes... The thing is, Koreans don't use the symbol that often in ordinary writing, and instead write out 'won' in Hangul (the Korean alphabet; it's not that long). We see it on price tags, printed out. Many fonts use the one-stroke variant.</p>
      <p>If I remember correctly, the symbol for yen or yuan (¥) can also have one or two strokes; the Japanese prefer two for the yen symbol, while the Chinese seem to use the one-stroke version a lot more for the yuan symbol.</p>
      <p>By the way, I cannot for the life of me remember for certain if the written shorthand for Kenyan shillings (or colloquially, 'bobs') is '/-' or '/='. I remembered it as '/=', but <a href="http://en.wikipedia.org/wiki/Shilling">the Wikipedia article on 'shilling'</a> has it as '/-', and now I'm dreadfully confused. It's as though the fact that one-stroke and two-stroke versions are interchangeable in many currency symbols is messing with my memory. Well, it <em>has</em> been more than six years since I left Kenya...</p>
      <p>I suspect both '/-' and '/=' are used, with a preference for '/=' in Kenya, but does anyone know for sure?</p>
