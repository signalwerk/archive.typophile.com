      <p>The font used for  official United States diplomatic documents (except for telegraphs and a few other exceptions), as well as its predecessor, has a single-stroked dollar sign.  (14pt Times New Roman, 12pt Courier New before).  Actually Courier New has the half-lines, only above and below the S.</p>
      <p>On the Mac I'm posting from right now, there are 336 typefaces available, this is based on a standard Mac OS X Tiger install with MS Office, Matlab, MAPLE, and TeX installed as well.  Of those 336, just over a dozen have the double stroke.  More have the broken stroke than a double stroke, although the single unbroken stroke is by far the most common.</p>
      <p>OT: Niels, I've always thought it odd when I hear Aussies referring to us insulting as Seppos, since calling us, or at least those in my region, a Yank would be far more offensive/insulting (but then again, I'm from the Deep South).</p>
      <p><em>«El futuro es una línea tan fina que apenas nos damos cuenta de pintarla nosotros mismos». (La Luz Oscura, por Javier Guerrero)</em></p>
