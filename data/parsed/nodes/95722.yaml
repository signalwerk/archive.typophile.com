    html: |-
      <p>The signs were hand designed by Hector Guimard in the early 20th century, and are not all identical (depending on when they were redone or replaced). Many fonts have been created based on them, but you're unlikely to find a precise match. Linotype lists it as an Art Deco face, some others describe it as an Art Nouveau style</p>
      <p>There are a number of different fonts and equivalents, mostly  named "Metropolitain". Many are copies or clones of each other.<br>
          Dieter Steffmann's was based on Rakowski's Paris Metro<br>
          Elsner and Flake has one<br>
          Michael Bujardet</p>
      <p>Metropolitain VerDover (Dan Solo)<br>
      Metropolitaines (URW)<br>
      Metropolitaine (Linotype)<br>
      French Bean (SWFTE)</p>
      <p> - Herb</p>
