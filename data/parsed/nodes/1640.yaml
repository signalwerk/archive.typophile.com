    html: "<p>Words have usefulness beyond their formal meanings. The Jews are lucky (or maybe it's not luck at all) to have exclusivity to \"Holocaust\". The word \"genocide\" on the other hand is indeed usually used for the Armenian Genocide, but it's not exclusive - and of course the Holocaust was also a genocide. <br> <br>As for the Turkish ambitions (which have in many ways remained the same), there was Pan-Turkism, which was the desire to create a large empire that spanned all the Turkic peoples all the way to Mongolia (where they came from less than 1000 years ago), so the racial basis was in fact there. But it was an excuse. The real reason is the usual reason: money*. The <i>visible</i> Armenians (in Constantinople) were wealthier than the average Turk (although our rural majority was in fact getting increasingly poorer, due to harsh governmental repression) and that caused resentment. The resentment was amplified with religious differences, and exploited. The poor Kurds were even recruited to massacre us - little did they know about choosing sides... We had been living peacefully under the Turks for 600 years at that point, and the resistance efforts in the far East of the country were only a result of repression (just like in Gharapagh). Just look at the names of the towns in the eastern third of Turkey: they're Armenian - and they're where my grandparents were born. <br> <br>* In fact the same could be said of the Holocaust: all the \"racial purity\" business wouldn't have appealed to the average German - they were in an economic frenzy, never having recovered from the brutality of the victorious Allies from WWI. <br> <br>Not to engage in one-upmanship of tragedy, but we lost much more than the Jews: not only didn't we end up gaining a new country, but we lost much more than a big chunk of our population - we lost our <i>land</i>, which we had kept for almost 3000 years. <br> <br>What's the real twister though is that Hitler used the example of the \"eradicated\" Armenians (they didn't know they couldn't get rid of us that easily) to justify the Holocaust! You don't hear that very often... <br> <br>hhp <br></p>"
