    html: <p><i>As for the Turkish ambitions (which have in many ways remained the same), there was Pan-Turkism, which was the desire to create a large empire that spanned all the Turkic peoples all the way to Mongolia (where they came from less than 1000 years ago), so the racial basis was in fact there.</i> <br> <br>This is a good example of the problem with the term 'racial'. I would refer to what you describe as ethno-linguistic, not racial (although prior to the 19th century race was simply a synonym for ethnicity). There is a significant difference between ethno-linguistic genocide and genetic genicide. Intermarriage, assimilation and religious conversion -- all of which are recognised ways to destroy an ethnic group -- are insufficient 'solutions' for Nazi genetic ideology, because of their belief that race is genetic and survives intermarriage, assimilation and conversion. Hence the logic of the 'final solution', which was really the only solution that would satisfy.</p>
