    html: "<p><i>The Palestinians are subjected to accusations of participating in terrorist activities.</i> <br> <br>Last I checked, blowing up buses and restaurants full of civilians <i>are</i> terrorist activities. <br> <br>There has long been an incredibly silly attempt to define terrorism and terrorists by the justifiableness of their cause. This has led to endless debates about whether such-and-such a group of murderers are terrorists or freedom fighters. Terrorism is a strategy. It should be defined by the action, not by the perceived status of the person commiting the act. Militant Palestinian organisations pursue a terrorist strategy in their war against Israel. Ironically, their greatest hope that this strategy might result in winning them a country must be the historical example of the creation of the state of Israel after a highly successful campaign of terrorism by Jewish militants against the British mandate. <br> <br>Just because one is sympathetic to the plight of a particular group of people who employ a terrorist strategy, doesn't magically make them not terrorists. I have a huge amount of sympathy for Catholics in Northern Ireland; this doesn't mean that I don't consider the IRA to be a terrorist organisation. Terrorists are all people who perform acts of terrorism -- the deliberate targeting of civilian life --, not just people who do so for reasons we don't approve of. And yes, there is such a thing a state terrorism: the deliberate targeting of civilians during war is a terrorist tactic.</p>"
