    html: <p>Hrant, William's point was that among some black students excelling in studies is seen as 'acting white'. This observation does not require an analysis of ways and means of resisting assimilation, it is enough to understand that, for these people, academic success = acting white, acting white = bad, ergo academic success = bad. The reasons why acting white = bad are irrelevant in this observation, because the issue is <i>why academic success = acting white</i>.</p>
