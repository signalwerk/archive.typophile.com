    html: "<p>&gt; the hostility to learning doesn't affect top students that profoundly. <br> <br>Except when they're driven to shoot up their school. <br> <br>The point isn't what grades the bright kids end up with, it's what American society does to them if they get good grades. And it's not restricted to high-school. The fear of appearing intelligent in the US is present through college, and all the way into working life. It's more important to have big breasts and run fast. <br> <br>&gt; some black students are ostracised by their peers for 'acting white' <br> <br>There's a very good reason (not related to doing good in school) that many black people (or really most any minority member) mind when a fellow black person acts white (it's called being an Oreo: black on the outside but white on the inside*) - it's called assimilation in case you haven't heard. We Armenians call it White Genocide. Frankling for example was guilty of it. <br> <br>* There's also \"banana\" for Asians (but I prefer using \"twinkie\"), and \"coconut\" for Armenians: white on the inside, hairy on the outside.  :-) Derogatory terms? You betcha - assimilation is the worst thing in the world after massacre and deportation. <br> <br>hhp <br></p>"
