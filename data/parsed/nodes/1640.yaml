    html: <p>&gt;&gt;I remembered a study (it is in the book by Chubb and Moe on Politics &amp; Education) of how American high school students progress <br> <br>But would that be a worthless social science study, lacking in academic rigour and scientific method? <br>======================= <br> <br>&gt;&gt;I think Capitalism wouldn't have allowed public schools to come about if it was bad for business. The conspiracy theorist in me might even say it was all Capitalism's idea in the first place, although that's admittedly iffy. <br> <br>Hrant, its not iffy at all, at least in England. <br>The 1870 Education Act, which made schooling compulsory (but not free for a few years after that) was openly introduced for the benefit of the national economy. <br> <br> <br>W.E Forster, Head of the Dept. of Education in Gladston's first administration suggested (in his speeach introducing the bill that became the 1870 Act) that "upon the speedy provision of elementary education depends our industrial prosperity". <br> <br> <br>The 1870 act was largely shaped by the report of the Newcastle Commission, which concurred with the evidence of James Fraser (later the Bishop of Manchester) that "it is quite possible to teach a child all that it is necessary for him to possess in the shape of intellectual attainment by the time that he is ten years old". <br>(By this Fraser means that the child should be able to "spell common words, read and write, add up a bill, and know his duty to god and to man"). The Newcastle report recommended this type of education on the grounds that the labour market required a supply of "persons thus minimally qualified". <br>Meanwhile, the Public Schools Act and the Endowed Schools Act (both concerned with fee-paying schools*) were shaped by the Clarendon report, which suggested that "classical literature is the staple of English education". <br> <br>*In England, both public schools and private schools are fee-paying. The equivalent what Americans call 'public schools' are known here as 'state schools'. (The fee-paying schools have recently started referring to themselves as 'independent schools'. This is of course ludicrous, and heavily wighted against a real understanding of their true status). <br></p>
