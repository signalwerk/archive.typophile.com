    html: "<p><i>In France that word is officially used in relation to the Armenian Genocide. In other countries, including the US, it isn't.</i> <br> <br>Lots of people in the USA, including professional historians, refer to the Armenian genocide. Many also point out some differences between the Armenian genocide and the Jewish genocide, e.g. that the Armenian genocide was not racially based in the sense that race was understood by the Nazis (i.e. as genetic rather than ethno-linguistic), and that the Armenian genocide was territorial: the Turks massacred Armenians in a particular locale and did not express an interest in killing every single Armenian anywhere in the world. These distinctions are important -- good historians should always identify distinctions and nuances, since the particular is by nature more precise than the general and so more likely to be accurate and supported by specific evidence. People who claim that these distinctions are sufficient to deny the term genocide in relation to the Turkish massacre of Armenians are indeed pursuing an agenda. Then one must ask what their intent is. If they are concerned that using the term genocide for territorial, non-genetically* inspired mass murder might diminish the full horror of the term when applied to universal, genetically inspired mass murder, then we should seriously consider that concern. One way to address that concern is to remain clear about the distinctions, and to acknowledge that there are different types of genocide. In fact, the nature of genocide -- literally, people killing -- depends on how the perpetrators define the uniqueness of the people that is their victim (genetically, ethnically, linguistically, culturally, or a specific combination of these), including the definition that those whom they kill are not people at all. <br> <br>* I dislike using the term 'racially', because this accepts a distortion of the traditional meaning of race, which is ethnicity, applied by the very 19th century proto-geneticists whose ideas informed Nazi 'race science'. Since I can't use the term race to mean ethnicity without risking confusion with genetic concepts of race, I try to avoid it altogether.</p>"
