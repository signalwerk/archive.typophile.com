    html: <p><i>Certainly, the greatest source of terrorism now is the US (and its satelite states, like the UK and Israel).</i> <br> <br>To accept that I'd have to see the extent of evidence of <i>deliberate</i> targeting of civilian, non-combatants by each of these states and/or specific support of such actions by their proxies. I'm not not questioning that such things have been done and continue to be done by these states -- particularly Israel --, but to label them <i>certainly</i> the <i>greatest</i> source of terrorism only seems possible if one has evidence that pretty much every civilian casualty is a deliberate target. Killing or injuring civilians as a byproduct of a campaign against militant groups, even if the perpetrators consider -- as I suspect Sharon does -- that such 'collateral damage' is no bad thing, does not constitute terrorism. Terrorism is an intentional strategy to produce terror among a civilian population by targeting them directly. [According to this definition, it should be pretty clear that there has probably never been a war in history that did not involve acts of terrorism as well as unintentional civilian casualties.]</p>
