    html: "<p><i>It's well argued but the mention of nazis and negationists at the end bugs me. Traditional history has always been extremely well-equipped when it comes to hiding genocide. Who, after all, controls access to 'official' archives? Historians certainly don't need any help from radical philosophy in this respect.</i> <br> <br>On what basis do you say that? ...on the basis of historiographical judgement: i.e. you can make a statement about the practice of history based on presumptions about the relationship of history to <i>what actually happened</i>. To be able to say that historians can hide genocide is to acknowledge a relationship between history and actual events, and to accept that this history can be more or less accurate. If a genocide occured, and is hidden by some historians, we can say that historians who do not hide the genocide are more accurate. All this is possible only if you accept that it is <i>true</i> that the genocide happened. <br> <br>Yes, techniques of history can be used to falsify the record of what has happened -- although outright lying works just as well --, but Ophelia Benson's point is that such bad history can only be challenged if you accept basic standards of truth. If you abandon these standards, then you have no grounds from which to resist the people who say that the genocide never happened.</p>"
