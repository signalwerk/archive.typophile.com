    html: <p>I think Capitalism wouldn't have <i>allowed</i> public schools to come about if it was bad for business. The conspiracy theorist in me might even say it was all Capitalism's idea in the first place, although that's admittedly iffy. But certainly, once something is in place, no matter where it came from, Capitalism usually ends up squashing it if it's bad for business. So the survival of forced public education (and its further evolution into a babysitting and brainwashing mechanism) is fraught with negative implications. <br> <br>And why do you think college isn't mandatory? Because by then we're old enough to <i>work</i> at full efficiency. <br> <br>The US is great for being a college kid (assuming you can afford it), and that's why I came here back when. Before college you'll be lucky to come out a balanced world citizen, and after college it's mindless slavery time. <br> <br>hhp <br></p>
