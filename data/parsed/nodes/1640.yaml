    html: <p>Some more thoughts on anti-intellectualism in American youth culture.  <br> <br>I remembered a study (it is in the book by Chubb and Moe on Politics &amp; Education) of how American high school students progress. They tracked how much students 2nd year students progressed over then new two years, by class academic quarter. The top quarter advanced more than two years. The lower quarters progressively less, with the bottom quarter knowing less than they did two years before! <br> <br>This confirms my feeling that the hostility to learning doesn't affect top students that profoundly.  <br> <br>I have read that some black students are ostracised by their peers for 'acting white' if they excel in their studies, but this is a special (serious) problem for one group.   <br> <br>The hostility may well affect the middling and poor students, but in a way that is hard to tease out. Two of my children have been top students, and but one couldn't have cared less about her studies. Her view was that in high school most kids were just turned off by school in general, and found it boring and pointless. She feels that the youth mass media does have a big impact, but that a bias against academic excellence is hard to differentiate from the general malaise.  <br> <br>Another problem in understanding the impact and what to do to counteract it is that different schools are very different. For example, poor urban and rural areas have much more severe problems than suburban schools.</p>
