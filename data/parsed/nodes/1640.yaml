    html: <p>&gt; William's point was that .... <br> <br>Yes, I know, but I think he's largely misreading it. <br> <br>&gt; the issue is why academic success = acting white. <br> <br>I think that's tangential. The real issue is why "academic success = social outcast" in the US as a whole, and how that creates a nation of sheep that can be manipulated into blindly supporting imperialism. Forced public education is in fact nothing less than a means to amplify the economy of scale and cast people in molds conducive to making the rich richer. Deep down, US public schools are nothing more than a way to brainwash kids and "free" <i>both</i> their parents for the workforce. <br> <br>hhp <br></p>
