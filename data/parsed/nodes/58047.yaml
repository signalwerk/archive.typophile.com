    <div class="info">Submitted by <a href="/user/108" title="View user profile.">Miss Tiffany</a> : 15.May.2009 11.40am </div>
      <p>he Western New York Book Arts Collaborative (WNYBAC) a new not-for-profit Cultural Organization, existing to promote the art of the book in all of its manifestations is having its Grand Opening May 21, 2009, from 6-9pm.</p>
    <p>The Western NY Book Arts Center is conveniently located at 468 Washington Street, on the corner of Washington St and Mohawk in downtown Buffalo. The newly remodeled space features a gallery, bookshop, event space, print studio, reading library, printing museum &amp; more. On May 22, the center will be open regular hours 12-6 pm, Wed-Sat. In addition, the bookshop will offer book making supplies, art papers, books, stationery, and fine art.</p>
    <p>The Grand Opening of WNYBAC coincides with the first members' exhibition. The members' exhibit features established and emerging artists, craftspeople and self-published authors, such as Jozef Bajus, Julian Montague and Diane Bond.  All current, new, and renewing members are encouraged to submit artwork prior to May 16th.  </p>
    <p>Through workshops and community studio access, individuals can learn old and new techniques to create their own printed ephemera, bookworks, prints and editions, and everything in-between. The summer workshop series will be announced at the opening as well as a special surprise announcement!</p>
    <p>For more information on resources and membership details visit <a href="http://www.wnybookarts.org" title="www.wnybookarts.org">www.wnybookarts.org</a>, email info -at- wnybookarts.org or contact Richard Kegler, 716 903 6875</p>
    <p>The Western NY Book Arts Center<br>
    468 Washington St (at Mohawk)<br>
    Buffalo NY 14203</p>
