    html: <p> I think it's "bengat". <br>Now try Tschichold... <br> <br>hhp </p>
    html_clean: <p> I think it's "bengat". <br>Now try Tschichold... <br> <br>hhp </p>
  - id: 62500
    user: 518
    date: 2001-07-02T10:09:00
    date_raw: 2 Jul 2001 — 10:09am
    votes: null
    html: "<p>Thanks Hrant, <br> <br>Tschichold is no problem: /chees-ald/ stress the first syllable. <br> <br>About Benguiat: In art school I was taught \"bengit\" ... but you say bengat. So does <a href=\"http://faqs.jmas.co.jp/FAQs/fonts-faq/part5\" target=\"_top\">http://faqs.jmas.co.jp/FAQs/fonts-faq/part5</a> <br> <br>Other sites (I am told) advocates for ben-gay! <br> <br>A group of people in Denmark has decided to find out, even if it means emailing the old man himself. We'll keep you informed. <br> <br>In the meantime: <br>- how do you pronounce Goudy? <br>- how do you pronounce Hrant? <br>- are you planning to show up i Copenhagen in September?</p>"
    html_clean: "<p>Thanks Hrant, <br> <br>Tschichold is no problem: /chees-ald/ stress the first syllable. <br> <br>About Benguiat: In art school I was taught \"bengit\" ... but you say bengat. So does <a href=\"http://faqs.jmas.co.jp/FAQs/fonts-faq/part5\" target=\"_top\" class=\"link-external\">http://faqs.jmas.co.jp/FAQs/fonts-faq/part5</a> <br> <br>Other sites (I am told) advocates for ben-gay! <br> <br>A group of people in Denmark has decided to find out, even if it means emailing the old man himself. We'll keep you informed. <br> <br>In the meantime: <br>- how do you pronounce Goudy? <br>- how do you pronounce Hrant? <br>- are you planning to show up i Copenhagen in September?</p>"
  - id: 62501
    user: 1250
    date: 2001-07-02T14:54:00
    date_raw: 2 Jul 2001 — 2:54pm
    votes: null
    html: <p> "Chees-ald"?! I thought it was something like "tchikold"... <br> <br>I think Goudy is "gawdi", but stess the first syllable, not the second, otherwise you'd be talking about my all-time favorite architect. "Hrant" is just like it's spelled, stressing the "a" (not the invisible "uh" between "h" and "r"). The "a" is flat, like in "ah". <br> <br>Copenhagen isn't looking good for me right now... :-(  But I'm going to try very hard for Rome 2002. (No, it's not the Olympics, but that's not stopping me from training for the typolevault. ;-) <br> <br>I guess you're going to the Copenhagen one? Grrr... <br> <br>hhp </p>
