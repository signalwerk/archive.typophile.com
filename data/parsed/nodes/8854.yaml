    date_raw: 20 Aug 2003 — 11:30am
    votes: null
    html: "<p>Dear <a href=\"http://www.netflix.com\" target=\"_blank\">Netflix</a>, <br> <br>An unsolicited reaction to your recent redesign. <br>My rating: 3.5 Stars <br> <br>What's good: <br>_ You added MPAA ratings to the queue. Yay. (Now, please  <br>add them to the other movie listings, and not just the  <br>'detail' page.) <br> <br>_ The help section is much more clear. <br> <br>What's bad: <br>_ The search function is not on every page? Is this omission  <br>an accident?! <br> <br>_ You still haven't made an easy way for me to see my own  <br>ratings. This is an excellent feature that is still buried in the  <br>site (difficult to find). <br> <br> <br>ABOUT THE VISUAL DESIGN <br> <br>_ The poorly compressed photos at the top of every page  <br>are both bad stock photos and are compressed poorly.  <br>Either get a phototography budget or lose them (please). <br> <br>_ The chrome tabs are a nice touch, and I can live with the  <br>soft buttons, but the curvy shapes should go--you're back  <br>to 1999 here. <br> <br>_ Futura? I know the logo is Futura-influenced, but the  <br>pages use Futura and Arial (HTML) headers interchangably.  <br>Ick. (Just stick to HTML.) <br> <br>_ You didn't change the logo! Yay. The red and the logo are  <br>the pillars of your corporate identity. Don't lose them as  <br>you stray from MarchFirst's original design. <br> <br> <br>Love the service, looking forward to the next phase. <br> <br>Regards, <br> <br> <br>Joseph Pemberton <br>A designer who cares</p>"
    html_clean: "<p>Dear <a href=\"http://www.netflix.com\" target=\"_blank\" class=\"link-external\">Netflix</a>, <br> <br>An unsolicited reaction to your recent redesign. <br>My rating: 3.5 Stars <br> <br>What's good: <br>_ You added MPAA ratings to the queue. Yay. (Now, please  <br>add them to the other movie listings, and not just the  <br>'detail' page.) <br> <br>_ The help section is much more clear. <br> <br>What's bad: <br>_ The search function is not on every page? Is this omission  <br>an accident?! <br> <br>_ You still haven't made an easy way for me to see my own  <br>ratings. This is an excellent feature that is still buried in the  <br>site (difficult to find). <br> <br> <br>ABOUT THE VISUAL DESIGN <br> <br>_ The poorly compressed photos at the top of every page  <br>are both bad stock photos and are compressed poorly.  <br>Either get a phototography budget or lose them (please). <br> <br>_ The chrome tabs are a nice touch, and I can live with the  <br>soft buttons, but the curvy shapes should go--you're back  <br>to 1999 here. <br> <br>_ Futura? I know the logo is Futura-influenced, but the  <br>pages use Futura and Arial (HTML) headers interchangably.  <br>Ick. (Just stick to HTML.) <br> <br>_ You didn't change the logo! Yay. The red and the logo are  <br>the pillars of your corporate identity. Don't lose them as  <br>you stray from MarchFirst's original design. <br> <br> <br>Love the service, looking forward to the next phase. <br> <br>Regards, <br> <br> <br>Joseph Pemberton <br>A designer who cares</p>"
