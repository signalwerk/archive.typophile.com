    html: |-
      <p>“Pantone are a commercial interest selling a comprehensive 4-colour book is probably against their best interests.”</p>
      <p>Their business is selling color swatches. I think they’re happy selling you whatever swatch book you want/need. ;o)</p>
      <p>I’ve never found Pantone’s process books to necessarily be ‘conservative’ anymore than any other process swatch book. </p>
      <p>One thing to do is if you have a favorite printer: the next time you do four-color work with them, print a bunch of swatches on the signature outside of the trim area. Make your own swatch book. The bonus is that it’ll be tailored to your specific printer for you (plus, it’d be ‘free’)</p>
