    html: |-
      <p>Pantone are a commercial interest selling a comprehensive 4-colour book is probably against their best interests.<br>
      Printers used to produce 4-colour sample books that they gave away to good customers, obviously not cheap to produce and not exhaustive (normally gradated on 10% changes). Ask your friendly neighbourhood printer they might produce one, some digital printers do as well, I have one on my desk. However, like Pantone books, the colours fade so a really old one will only have the cyan left. Double hitting can also improve your coverage – a spot colour might prove cheaper in the end. I think Hexachrome was mainly introduced to correct the purple and orange problems of cmyk.</p>
      <p>Tim</p>
