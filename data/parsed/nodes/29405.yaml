  html: <p>Is there a good alternate color swatch vendor for process swatches? I’m constantly running into problems with Pantone’s swatches just not covering a lot of the Orange, Pink, Red, etc. colors that are possible in modern four-color printing but not represented in my Pantone swatches. Anyone have a recommendation?</p>
