    html: <p>Orange is a very difficult color to match in process. Even if you did find a book which had full-chroma Orange I would make a guess that it is because of the separate CMY inks which were used. This is part of the reason why the hexachrome process was developed, AFAIR, to enable richer process colors with the additional hits of color. Reds and Pinks suffer the same, just as blue does. They are only using 2 of the colors (mostly) to make the color and so aren’t as rich on the page. The best thing you can do is to continue to use Pantone but design around the shortcomings of the process. Get into bed, so to speak, with your printer and explain your concerns and see if they aren’t willing to help you find a solution. Perhaps, once you’ve asked, they will tell you of the process they recommend.</p>
