  html: "<p>I am making a research for an article i am writing for a Dutch design magazine about *Experimental Typography*.  <br> <br>I am aware that this is an overused term; I am looking for examples of experimentation in typography, which would be closer to the notion of experiment in the scientific context: experiment as a research method where an hypothesis is tested to either falsify or verify it. Experimental typography in this sense would be less concerned with the final result, but focused on the process of creation, upon which other projects can feed. <br> <br>I have to stress again the hypothesis, or an intention of the designer is an important aspect prior the process. Which means that I am less interested in formal exercises where the purpose is not defined. <br> <br>Can you guide me to interesting examples of experimentation in typography? Thank you for your advice. Peter</p>"
  html_clean: "<p>I am making a research for an article i am writing for a Dutch design magazine about *Experimental Typography*.  <br> <br>I am aware that this is an overused term; I am looking for examples of experimentation in typography, which would be closer to the notion of experiment in the scientific context: experiment as a research method where an hypothesis is tested to either falsify or verify it. Experimental typography in this sense would be less concerned with the final result, but focused on the process of creation, upon which other projects can feed. <br> <br>I have to stress again the hypothesis, or an intention of the designer is an important aspect prior the process. Which means that I am less interested in formal exercises where the purpose is not defined. <br> <br>Can you guide me to interesting examples of experimentation in typography? Thank you for your advice. Peter</p>"
