    html: "<p>Peter, your angle on the reform-centric nature of experimentation (at least in the layman understanding of the term) is interesting - I hadn't thought of it. It seems to make sense that you have to be going against something, something expected or assumed. On the other hand, I'm not sure being on an island precludes it: as long as there's <i>some</i> context (and there always is), there's something to \"reform\". Even an individual is not one static thing, so experimentation is <i>always</i> a natural facet of learning. <br> <br>Javal/Huot-Marchand: <br>I'll email you a PDF of an article about it - assuming you read French... You could also ask Lukas Hartmann (the editor of TM) for a copy of the actual article (in issue #2/2004) which I presume details everything - if you do get a copy please let me know. And if you want more/better scans from the Javal book just holler. <br> <br>My stuff: <br>The best single place to read it is my 10K-word essay in the book \"Graphic Design &amp; Reading\". Gunnar says he doesn't mind if I republish it elsewhere, but as long as the book (which just happens to contain some great other material besides! :-) is still selling, in fact as low as $2 used on bookfinder.com, I feel bad just throwing it out. There's also a quarter-length version of that essay in issue #54 of tipoGrafica magazine (in the English original and a superb Spanish translation) and that can be bought for around $10. But if you're really <i>that</i> strapped for cash here are the PDFs: <br>(136Kb) <a href=\"http://www.themicrofoundry.com/other/tG54_s.pdf\" target=\"_blank\">http://www.themicrofoundry.com/other/tG54_s.pdf</a> : Spanish + Illustrations <br>(110Kb) <a href=\"http://www.themicrofoundry.com/other/tG54_e.pdf\" target=\"_blank\">http://www.themicrofoundry.com/other/tG54_e.pdf</a> : English text <br>But for the full-length treatment you gotta go to GD&amp;R. <br>OK, Stephen?  :-&gt; <br> <br>* Which also contains an interesting and revealing article by Smeijers. <br> <br>hhp</p>"
