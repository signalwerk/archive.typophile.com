    html: "<p>Thanks for the examples. Yes, i'd love to see more. As a matter of fact i wasn't familiar with Javal and Thomas Huot-Marchand. Can you direct me to more information please? <br> <br>A lot that you mention is based on an idea of reformation, which basically works only in opposiiton to somethign else. Do you think that experimental design operates in this field? In other words: do you think that if you were the only typographer/type designer on an isolated island that than it would be impossible to make experimental typography? <br> <br>if you read my initial entry than you see that this is not what was i interested in, but since this is how experimentaion is widely understood, it is interesting to think about it.</p>"
