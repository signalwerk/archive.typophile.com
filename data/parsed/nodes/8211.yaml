    html: "<p>\"Experimentation\" is indeed a problematic term. Some people use it to justify play while some others use it to dismiss any attempt at improving Latin. Anyway. <br> <br>Depending on where you draw the line, you might end up with a fair amount, or virtually nothing. I know you're not interested in things like NotCaslon (hooliganism), but I assume you're also not interested in things like Tiresias (leveraging empiricism to cement the satus quo). I guess asking this is a good litmus test: would you include Thompson's \"Alphabet 26\"? It's based on a scietific intent, but an imaginary one. It might seem unwise to include it, but then you might be stuck with highly \"scientific\" efforts which -due to the historic inadequacy in typographic empiricism- will give you nothing. <br> <br>Another issue is whether you're focusing on a certain intent: improving readability, heightening a certain emotion, or what? Or are you interested in <i>any</i> intent. That would be ideal I think, but it would also make the article quite broad and long. <br> <br>Trying to guess at what you really need, I can think of these three instances: <br> <br> <br>1) A pretty old one, but from the catalyst of the understanding of readability himself: Javal. In his book of 1905 he shows two alphabets intended for reading small sizes: <br><a href=\"http://www.themicrofoundry.com/other/Javal_a.gif\" target=\"_blank\">http://www.themicrofoundry.com/other/Javal_a.gif</a> <br><a href=\"http://www.themicrofoundry.com/other/Javal_b.gif\" target=\"_blank\">http://www.themicrofoundry.com/other/Javal_b.gif</a> <br>This effort seems to have been picked up by Thomas Huot-Marchand (see his article in Typografische Monatsbl</p>"
