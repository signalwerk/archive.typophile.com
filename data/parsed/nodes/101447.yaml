    html: |-
      <p><em>In any case, it seems to me there's little reason to make the slants symmetrical.</em></p>
      <p>Somewhat to my surprise, the slash and backslash are not treated by Unicode as mirroring characters for bidirectional layout purposes. If they were, then that would be a strongish reason to make them symmetrical. But even though they're not, my inclination would be to make them symmetrical because in my experience any character with a flipped version is likely to be used as /mirrored punctuation\ by someone out there.</p>
