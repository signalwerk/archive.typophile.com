    html: <p>Maybe because it's a technical character that's only really used in computer programming? So it doesn't need to fit in with running text as much? There are different versions of the forward slash, as well — the virgule is probably what you mean by a "regular" slash; there's also the solidus, which is used as a fraction bar.</p>
