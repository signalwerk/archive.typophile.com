      <p>Six hours &amp; no pronouncement from the true font cognescenti!<br>
      Despite the fuzzy image, I can see a regularity in the lower case that suggests that this is could well be a font -- although some of the old time letterers were pretty consistent. The lowercase scripting is open and conventional with high legibility. But the uppercase of slanted plain letters, at least for the WNOT shown is unusual.<br>
      It would help if you could provide some information as to the source of the image, particularly the approximate year, or decade, in which it was originally created, and the country where it appeared. Wild guess, based on the text of the image, your explanation,  &amp; profile info, WWII RCAF in England? But then again, I could be completely off base &amp; this is a brand new font created by one of the up and coming foundaries.<br>
      Don</p>
