      <p>For lowercase you might be happy with Billy Argel's <a href="http://billyargelfonts.blogspot.ca/2011/05/billy-argel-blessed-day-font.html" rel="nofollow">Blessed Day</a>. Far from a perfect match, but the ascenders &amp; descenders generally fit the sample's form and length, the weight and slope are about right, and most of the letters are not too far off the sample's cursive.<br>
      Don</p>
