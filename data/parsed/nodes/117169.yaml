      <p>A Tuscan with mustache terminals and medial spurs. Now which one? Hessian and Yuma are similar from the waist down. 1.Hessian <a href="http://www.myfonts.com/fonts/madtype/hessian/" title="http://www.myfonts.com/fonts/madtype/hessian/">http://www.myfonts.com/fonts/madtype/hessian/</a> 2. Yuma Regular <a href="http://www.myfonts.com/fonts/otto-maurer/yuma/" title="http://www.myfonts.com/fonts/otto-maurer/yuma/">http://www.myfonts.com/fonts/otto-maurer/yuma/</a> Not quite as close -- the terminals are heavier than a mustache -- Saloon Girl <a href="http://www.myfonts.com/fonts/fontmesa/saloon-girl/" title="http://www.myfonts.com/fonts/fontmesa/saloon-girl/">http://www.myfonts.com/fonts/fontmesa/saloon-girl/</a><br>
      Don</p>
