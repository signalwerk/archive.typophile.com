      <p>I would recommend using ScanFont to import Illustrator outlines into FontLab.</p>
      <p>Short of that, follow Mr Puckett’s advice and scale them up in Illustrator first.</p>
      <p>In Illustrator, one point equals one FontLab unit, so scale your illustator outlines to something approaching 700 points on the Cap height and you will be on your way.</p>
