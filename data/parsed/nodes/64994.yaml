    <p>HI,</p>
    <p>I read a few threads on scaling a whole font but there were no definite conclusions or majority view.</p>
    <p>I have a hand drawn and scanned typeface that I have traced in Illustrator. The alphabet was drawn out many times with the artist circling the characters he favoured for the font with some alternates.</p>
    <p>So I traced them and then measured and scaled using this method:</p>
    <p>In Illustrator:</p>
    <p>Ascender= 14.565mm<br>
    Cap Height= 12.22mm<br>
    X-Height= 3.9mm<br>
    Base= 0<br>
    Descender= 7.864mm<br>
    Which makes my em square 22.429mm or 63.578pts</p>
    <p>So I convert to 1000 UPM by:<br>
    Ascender= 14.565 / 22.429 x 1000 = 649.38<br>
    Cap Height= 12.22 / 22.429 x 1000 = 554.83<br>
    X-Height= 3.9 / 22.429 x 1000 = 178.34<br>
    Base= 0<br>
    Descender= 7.864 / 22.429 x 1000 = 350.62</p>
    <p>So to scale my illustrator drawings to pop into FontLab (presuming I have UPM set to 1000) I need to scale each glyph up by (1000 / 63.578 x 100) = 1572.871118%</p>
    <p>When I scale this way, set my FontLab file up with the values for Ascender etc, the glyphs come in bang on where they are supposed to.......</p>
    <p>But when outputting the font, it is tiny. I mean, really, really small.  So I read up on scaling it up. There are two viewpoints, it seems, on doing this. Either altering the UPM or Tools-Actions-Contour-Scale (with apply to whole font with both hints and metrics ticked. Altering the UPM means I only alter one number. Scaling requires me to recalculate and reposition the guides, which admittedly, doesn’t take long.</p>
    <p>Both methods seem to work but when I go to Exort the .otf FontLab warns me that the UPM is not 1000 and this could lead to problems. What is the safest way to do this and why is it safer or better?</p>
    <p>Many thanks.</p>
    <p>Paul</p>
