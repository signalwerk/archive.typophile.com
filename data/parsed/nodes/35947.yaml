    html: <p>Text with a lot of long words can be a problem to justify in any setting, but generally if you have lines more than about two alphabets (i.e. 56 characters) wide, they will justify nicely in InDesign with paragraph composer turned on, hyphenation set to maximum two in a row (three in a pinch), minimum three letters before and after hyphen, hyphenate capitalized words, and word spacing set to 85% min., 100% normal, and 130% max. (no letter spacing allowed). You still have to do some manual tweaking, but this gives decent results. As your column of text narrows, you have to allow more leeway on the parameters and accept that it won’t be quite as attractive. Below about one and a half alphabets (42 characters per line), I set it ragged right unless it’s very short and I have carte blanche to rewrite the text.</p>
