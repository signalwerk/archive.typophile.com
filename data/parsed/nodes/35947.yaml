      <p>Hyphenate carefully, if you can, but for small print like a description, and this sounds like a very narrow column, I’d be leery of doing so.  </p>
      <p>And tracking small print can get very ugly as well.</p>
      <p>If I were you, I’d do up two — one justified, and one ragged, and let the client decide which one looks “better”: my guess is that they’d pick the ragged one....</p>
