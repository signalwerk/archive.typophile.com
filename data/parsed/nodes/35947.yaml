      <p>&gt; But I still don’t want to give up on learning to create nice fully justified columns</p>
      <p>Hyphenation is the first trick. Then rewriting the copy to avoid rivers. Normally this is an editors’ perogative but some will allow you to make a suggestion. Just make sure they explicitly approve it.</p>
      <p>(And thinking about it ... for drug information copy, I probably wouldn’t dare making text changes. More likely than not, it was written by lawyers.)</p>
