    html: |-
      <p><em>It’s much more comfortable to read.</em></p>
      <p>Especially at small sizes (both font and column width), it makes a huge difference, doesn’t it?</p>
      <p><em>But I still don’t want to give up on learning to create nice fully justified columns.</em></p>
      <p>Depending on the text, hyphenation is usually the first resort, particularly if you’re able to keep it to a minimum, but there’s a really fine line to draw between too many hyphens (particularly in a row) and the academic level of the text you’re working on.  You don’t want to end up hyphenating long words all the time, because that’s hard on your reader, and if it’s a more accessible text, hyphenating short words is distracting as well.</p>
      <p>That being said, and depending on the font/size/column you’re using, you don’t want to mess around extensively with word and letter spacing that much either.  I am reminded of the comment quoted in <em>The Joy of Cooking</em> that is attributed to Lao Tsu: <em>Ruling a large kingdom is like cooking a small fish. Both need to be treated gently and not overdone.” </em>  ;-)</p>
