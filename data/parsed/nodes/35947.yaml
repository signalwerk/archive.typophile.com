    <p>I thought I would just throw this basic question out to see what kind of feedback I get. I’m currently working on a vitamin label and the client requests that the small product description copy be justified. When the column is justified there are a lot of rivers and funny spacing issues. What I typically will do with a line or lines with large gaps is just highlight that specific line in play with the tracking. I’ve always wondered if this is the correct thing to do. What would you suggest? I need to be enlightened. </p>
    <p>Thanks.</p>
