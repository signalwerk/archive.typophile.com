      <p>Well, make a typeface from card suits is a big type challenge. The structures that you take as a reference restrict some shapes and make some characters difficult to recognize. </p>
      <p>One first hint is trying to use the card suits only as a real reference and keep the basic forms of the letters instead of force the shapes to fit in spades or hearts structure. It’s will help you to solve some legibility’s problems like in the "U", "f", "g", "r" and "t". The second hint is finding a way to improve the similarities between the characters. The "E","F", "N" and "X" doesn't look familiar with the "A", "B", "C", "D", "M", "V", "Q", "R", "V" and "W".</p>
      <p>Keep working, you will find the way. ;-)</p>
      <p>good lucky</p>
      <p>e.</p>
