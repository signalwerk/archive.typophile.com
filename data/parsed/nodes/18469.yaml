      <p>Thanks, Graham.</p>
      <p>Well, there's not much of any way to differentiate spades from hearts, as some letters require the stem, and other letters require its absence. And most letters just really blow when made from clubs. So I'd say it's unlikely. But I realize it wouldn't hurt to supply as many alternates as I can.</p>
