    <p>This is rather high-concept, some might even say high camp, but I think the potential demand for it is easy to see. Pokeresque is a typeface constructed from card suits.</p>
    <p>I'm not sure how I'm going to do the numerals: make them in a similar style, or emulate the numerals on standard playing cards? Currency symbols are a related dilemma.</p>
