    date: 2003-02-20T05:30:00
    date_raw: 20.Feb.2003 5.30am
    votes: null
    html: <p>Actually, my very old (1994?) water-stained specimen shows a set of oldstyle figures for Arepo. For some reason the Agfa Alliance fonts do not include these.  <br> <br>But I'm going to disagree that there is such a strong need for these, or for all the trappings. I believe Arepo was designed as strictly a display face, a companion to Sumner's Cycles or Stone Print. As such, there is less call for figures in general, and I've always felt that the lining numerals were sufficient (perhaps even superior) for titling use.  <br> <br>If you want to set serious, extended text, with all due finesse, then you'll want the Cycles family. This, I believe, is Stone's real magnum opus. And in a way, Cycles, Stone Print, and Arepo are all members of one extended family. <br> <br><img src="http://www.typophile.com/forums/messages/83/6774.gif" alt="Arepo, Stone Print, Cycles"></p>
