    date_raw: 19.Feb.2003 7.24pm
    votes: null
    html: "<p>Thanks and congrats, Yves. <i>Echt!</i> <br> <br>&gt; <i>Funny this subject, as I just posted the url</i> <br>&gt; <i>of the future Sumner Stone website today on</i>  <br>&gt; <i>the <a href=\"http://www.typographe.com\" target=\"_blank\">www.typographe.com</a> blog!</i> <br> <br>Yes, I got it from there! (It's read! ;) <br><a href=\"http://www.stonetypefoundry.com\" target=\"_blank\">Stone Type Foundry</a>. Merci bien, JFP!  <br> <br>(BTW, the spacing is somewhat off, huh? That <br>RY needed at least 2 pixels more. But the whole <br>thing asks for slight adjustments here and there.) <br> <br>So this unsung beauty doesn't have lowercase <br>figures et al? It seems a prime candidate for <br>a nice OT version with all the trappings. <br> <br>&gt; <i>More interesting, do you know that Arepo</i> <br>&gt; <i>mean in fact: Opera in reverse :-)</i> <br> <br>I can't be sure, of course, but I'd guess  <br>Mr Stone was probably refering to this classic  <br>Latin \"2D palindrome\" (here set in Arepo!): <br> <br><img src=\"http://www.typophile.com/forums/messages/83/6771.gif\" alt=\"SATOR...\"> <br> <br>In this case \"opera\" doesn't have any musical  <br>connotation, but means, simply, \"work\". It has  <br>been translated as \"Arepo, the sower, holds  <br>the wheels at work\". But there are many different  <br>interpretations for \"arepo\". In fact, there's a <br>whole literature debating this simple pun. <br> <br>But the typeface is musical, anyway.</p>"
    html_clean: "<p>Thanks and congrats, Yves. <i>Echt!</i> <br> <br>&gt; <i>Funny this subject, as I just posted the url</i> <br>&gt; <i>of the future Sumner Stone website today on</i>  <br>&gt; <i>the <a href=\"http://www.typographe.com\" target=\"_blank\" class=\"link-external\">www.typographe.com</a> blog!</i> <br> <br>Yes, I got it from there! (It's read! ;) <br><a href=\"http://www.stonetypefoundry.com\" target=\"_blank\" class=\"link-external\">Stone Type Foundry</a>. Merci bien, JFP!  <br> <br>(BTW, the spacing is somewhat off, huh? That <br>RY needed at least 2 pixels more. But the whole <br>thing asks for slight adjustments here and there.) <br> <br>So this unsung beauty doesn't have lowercase <br>figures et al? It seems a prime candidate for <br>a nice OT version with all the trappings. <br> <br>&gt; <i>More interesting, do you know that Arepo</i> <br>&gt; <i>mean in fact: Opera in reverse :-)</i> <br> <br>I can't be sure, of course, but I'd guess  <br>Mr Stone was probably refering to this classic  <br>Latin \"2D palindrome\" (here set in Arepo!): <br> <br><img src=\"http://www.typophile.com/forums/messages/83/6771.gif\" alt=\"SATOR...\"> <br> <br>In this case \"opera\" doesn't have any musical  <br>connotation, but means, simply, \"work\". It has  <br>been translated as \"Arepo, the sower, holds  <br>the wheels at work\". But there are many different  <br>interpretations for \"arepo\". In fact, there's a <br>whole literature debating this simple pun. <br> <br>But the typeface is musical, anyway.</p>"
