    html: <p>Hrant -- I think Stone Print is borderline. I wouldn't use it for book text, but I would consider it for magazine work (which is, of course, what it was designed for). I do agree that it lives at the very narrow end for text work. I actually like to use it for modest heads and secondary, mid-range material. <br> <br>Colin -- you can license Cycles directly from Sumner Stone. His contact information is on the temporary web page at the site that Rodolfo cited above. <br> <br>Rodolfo -- even in U&amp;lc display I often prefer lining figures for heads &amp; titling. But that's a personal preference. If you license Arepo directly from Sumner, I believe you can get the OsF thrown in. If you already have a license through Agfa (I suppose you must), perhaps he might consider giving you an "upgrade" for a small additional fee -- you'd have to ask him. <br> <br>-- K. <br></p>
