      <p>"type 1 fonts with custom tables"</p>
      <p>I just wanted to note that Type 1 fonts don't have any tables, custom or otherwise.</p>
      <p>I'm thinking maybe you mean custom encodings? But the expert set is a standardized encoding rather than custom. So perhaps "uncommon encodings" would be the phrase one wants to use.</p>
      <p>Cheers,</p>
      <p>T</p>
