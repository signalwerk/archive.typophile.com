    html: |-
      <p>With something like this, as you connect more lines, just like when blackletter joined stems (is it mun, num, mnu, mum, mmu, umn, etc), it can be hard to recognise letters are they should be.  </p>
      <p>On first glance I couldn’t immediately process the letters, and after thinking about it for a while (without reading your post) I figured it was either carikou, or carijoou (I’m sure those mean something in some language —wait, nevermind, actually there is a musical artist Len Carikou, though according to Google, Yahoo!, and MSN, I’m the first person on the internet to type in carijoou, wahoo)</p>
      <p>Anyways, some alternate interpretations would be caruoou, carykou, couribou, courikou, etc. If you have to go for the connected letters look, make sure it’s unambiguous as to which letter it is.  If you have to go for the long connected descenders, maybe try a slight break (like you have between the top of the <em>c</em> and the bulb of the <em>a</em>) so that we know to see two descenders, and not a connected <em>u</em>.  I agree with some of the others who’ve already posted, the <em>o</em> on top of the <em>b</em> and <em>u</em> is really distracting, and hampers reading (it makes the <em>b</em> look like <em>k</em>).</p>
      <p><em>«El futuro es una línea tan fina que apenas nos damos cuenta de pintarla nosotros mismos». (La Luz Oscura, por Javier Guerrero)</em></p>
