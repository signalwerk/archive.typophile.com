      <p>Theres some good stuff in there. And I think you might be right on the mark, depending on the band’s sound/image overall.</p>
      <p>Possible ideas:<br>
      playing with using a radius on the r more similar to the other letters</p>
      <p>now that te o and u fit the rest of the word, get freaky with them. try bending each end of the u. Maybe around the o, maybe into it move the o up to the b’s ascender area. See if any of that looks good, or spawns other more interesting ideas.</p>
      <p>Ignore the haters. The logotype only needs to be art letters at first, and eventually become pleasantly readable (after digestion) The first image wasn’t pleasant, but you are closer now. If someone really needs the letters to be data containers, they can flip it and read the band name in Arial on the spine of the box.</p>
