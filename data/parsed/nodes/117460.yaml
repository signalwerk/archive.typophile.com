  html: |-
    <p>Greetings,</p>
    <p>I have developed a font that works in every Uniscribe application (and even some non-Uniscribe applications) that I've tried *except* for Microsoft Word. Even WordPad works. The font shows up in the font list (even with a correct preview) but Word does not let me switch to or type in that font. So, e.g., selecting all (ctrl-a) and choosing the new font does nothing.</p>
    <p>Have any of you run into this sort of thing before? What could the cause possibly be? </p>
    <p>Thanks in advance!</p>
