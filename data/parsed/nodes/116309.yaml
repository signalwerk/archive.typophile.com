    <p>Hello all! I'm pretty new to the world of type, and I want to get into hand-drawn lettering. It's been suggested that I study the history and evolution of scripts, from how they descended from italics and the flexible reed pen, to how swashes change over the centuries. I'm currently reading "The History and Technique of Lettering" by Alexander Nesbitt, which I'm really enjoying. However, the book covers a ton of information in a fairly short amount of pages, and there are some ares which I'd like to explore in depth. One being the history of Dutch writing master Jan van den Velde.</p>
    <p>I've been searching the web, but so far I haven't found any books that go in depth on scripts, so I come to you. Does anyone know of any good resources to look into? Also, does anyone know where I can find a copy of "Spieghel der schrijfkonste, in den welcken ghesien worden veelderhande gheschrifften met hare fondementen ende onderrichtinghe"?</p>
    <p>Thanks!</p>
