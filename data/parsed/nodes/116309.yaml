    html: |-
      <p>Well, typography can indeed be defined as writing with characters that have been made in advance. But then, so can typing.</p>
      <p>I think that while it is limiting to insist that all typography should look like calligraphy, it's still a fruitful source of inspiration. I believe that ductus <em>is</em> an aid to legibility and readability, and that unlimited creative freedom without constraint can often leave people not knowing where to start, or creating things so extravagant that they are not found useful.</p>
      <p>However, new ideas have to start somewhere, and so a first try that is not a success can inspire someone in the future to something that does work.</p>
      <p>Rather than being wishy-washy, I think I'm trying to make a definite point here: there is a definite place for both the traditionalist and the experimental schools of type design; both are needed.</p>
