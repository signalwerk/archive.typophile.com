    html: |-
      <p>Some version of Didot compressed? Note the extreme thick &amp; thin contrast and hairline squared serifs. But I don't recognize this version offhand. Perhaps proprietary.</p>
      <p>Fairly close is Typofonderie's AmbroiseStdFirminLight:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/AmbroiseStdFirminLight_5040.jpg"></div><p></p>
      <p>Some Didots, like this Ambroise and one from Canada Type have ball terminals similar to your image, while other Didots have a gradual flow into the hairline stroke.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/DidotDisplayDemiCT_5659.jpg"></div><p></p>
      <p>Don</p>
