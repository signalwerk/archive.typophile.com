    html: |-
      <p>@bdyer23: Welcome to Typophile. </p>
      <p>In just one post, you’ve probably already noticed there are some… interesting… folks here. It only gets better. A few tips: I recommend using your real name as your screen name. It used to be somewhat of a convention, and it has been my experience that you get a little more street cred for doing so. Also, in the practice of typography (no, we’re not getting into an endless circular debate about what typography is) , ID’ing fonts is something typographers tend to pride themselves on. </p>
      <p>And there’s a bit of a trick: Many alphabets have particularly unique characters. Spot that character, and you know the typeface. For example, in Gill Sans, the tail on the lowercase [a] is a dead give away (check out the top of the bold [t] while you’re at it). In Trajan Roman, the way in which the capital [J] descends below the baseline is also a tell. In addition, these are two <em>incredibly</em> popular fonts, and have been for around for decades. I can say with complete confidence Gill Sans is in 90% of typographers “if I only had 10” list. Trajan used to be popular, but somehow <a href="http://www.youtube.com/watch?v=t87QKdOJNv8" rel="nofollow">it got co-opted by movie-land</a>. A shame.</p>
      <p>If you are interested in looking at the details of typefaces to help you play “name that font” I recommend getting a big paper book with the entire alphabet printed out so you can look at the aspects of individual characters. It has been my experience that many type designers put extra work into the [a] and [g] glyphs (characters) so I usually make an effort to inspect them more closely.</p>
      <p>There’s also a ton of digital ID services out there, but I’m a grump old man that likes paper. However, as time goes on, and more and more typefaces are churned out every year (unnecessarily IMO) playing “name that font” is getting harder and harder to win. However, it still feels good to do it from memory.</p>
      <p>@aluminum: “Hammer based”. Good one <strong><a href="http://www.youtube.com/watch?v=otCpCn0l4Wo" rel="nofollow">;)</a></strong></p>
