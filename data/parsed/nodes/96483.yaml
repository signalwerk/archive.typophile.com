    html: |-
      <p>@aluminum (and all others):</p>
      <p>Ok, I didn't post my question so I could get ridiculed for asking a simple question.  I understand, some people take extreme pride in their trade, and feel better about themselves by making another person feel like they are "less" than they are for not knowing something as simple as Trajan, or Gill Sans font.  Please, allow me to recap on exactly what I do, cause maybe "Graphic Designer" might be the wrong name:</p>
      <p>Basically, I take other peoples logos, when they do NOT have a vector file (.eps, .ai, .cdr) and I re-create their logos for them.  In turn, my "re-created" vector artwork get's sent to a Sign Company so they can fabricate electrical signs for their business, which in turn get's mounted on the outside of their building (Channel Letters, Reverse Channel, Light Boxes).  You'd be surprised at how many people have a logo for their business, but can only seem to get a copy of a 72dpi JPEG of it.  Personally, when I design a logo for someone, I send them a copy of it in every format possible.  (.ai, .eps, .pdf, .tif, .jpeg)  Basically, I do ALL of my work in Illustrator.  Depending on the quality of the bitmap image I receive, I can usually just trace it then clean it up in Illustrator.  Most of the time, I DO know the name of the font, or I can find it very quickly, but for whatever reason, on this one.......I had trouble.  With the work I do, and the Sign Companies I work with, ALL artwork needs to be vector art.  Whether it's cutting 3-D lettering with acrylic, or vinyl lettering on your vehicle, or electrical signs, ALL art needs to be vector.  That's what I do for the most part!</p>
      <p>In addition to that, yes, I also do logo designs, flyers, brochures, restaurant menus, etc.  Obviously, when I'm creating my own artwork from scratch, then finding the right type face to use is never a problem, since IM the designer.</p>
      <p>Do I sometimes have problems with "identifying" certain fonts when I need to re-create something?  Sure I do!!  But I'm always open to LEARNING, hence the reason for joining this forum!!</p>
      <p>Brian</p>
