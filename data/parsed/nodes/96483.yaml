  html: <p>I'm a Graphic Designer, and I absolutely HATE being stuck with having to create Vector artwork from a scanned copy of a logo on letterhead paper.  To make it worse, it was a scanned copy of a copy.  My customer has no idea what the name of the fonts used in this logo are.  I know I've seen these fonts before, but I just can't seem to locate it!  I've already re-designed the "logo" part, now I just need to re-type the wording and be done with it!  Any ideas??  Any help is greatly appreciated!!!!</p><div class="imageWrap"><img src="http://typophile.com/files/Majestic_4710.jpg"></div><p></p>
