  html: |-
    <p>Our graphics people have ads that are created from scratch in InDesign, with no character styles or paragraph styles applied (at least not intentionally). When placed on a template that we created for our daily newspaper pages (that have object styles, character styles and paragraph styles associated with it) the text in some (not all) of the ads that are placed loses attributes and defaults to 10 pt leading. Some times even the font is replaced to helvetica. When we check character styles, paragraph styles and object styles, it doesn’t show that it has picked up one of the styles on the page. Has anyone run into this before? Can it be avoided? Thanks for the help.</p>
