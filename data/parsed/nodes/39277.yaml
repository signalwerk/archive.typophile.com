      <p>I don’t get it. What do you place in the templates? Do you Copy&amp;Paste text only, or multiple objects or even InDesign documents?</p>
      <p>Keep in mind there is no “no paragraph style”. If you copy something from one machine to another, you may get different text settings because the preferences for “basic paragraph style” are different. Same is true for standard typeface, sizes and so on.</p>
