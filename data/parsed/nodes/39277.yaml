    html: |-
      <p>Just a guess: Did you check if “basic character/paragraph/object style” has been chosen on your machines?<br>
      It is safer to base character styles, paragraph styles and object styles on “no character/paragraph/object style” (visible via double click on the single style) than on “basic character/paragraph/object style”, because the latter can be chosen different on each machine and nevertheless it’s always named “basic”.</p>
