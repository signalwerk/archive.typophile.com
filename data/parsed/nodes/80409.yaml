    html: <p>With a slab, it might be easier to optically center the L because you can counteract it's asymmetry with a heavy serif. Also a monospaced font might be worth trying, and also a grotesque of some kind because they usually have rather uniform widths in the capitals. All suggestions for stacking. Rotating is another story. I highly suggest you consider employing some of thetalent lurking around here. Most of the long timers are type designers that would be able to produce a tailor-made product for your needs.</p>
