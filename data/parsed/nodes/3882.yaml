  html: <p> I'm working on a student newspaper and I'm having difficulty using the Euro. Articles come in, in MS word format, are proof read, edited and then transferred over to me. In the process the file goes from windows to OS9. From word to quark. I lose all my euro symbols. At the momment I have to manually replace every symbol, and as a result some get missed and the paper obviously suffers. Are there any simple ways to stop this. I suspect it maybe that the version of Frutiger I'm running does not contain a symbol. I could manually add one in fontographer, but a little unsure. </p>
