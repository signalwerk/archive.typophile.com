    html: <p> hey wait a second...I came here to get the info about the Euro symbol....and I had to read through that? <br>geez louis. <br> <br>First I don't understand all this Euro Symbol problem stuff I keep seeing around board. Its option+shift+2 on key caps is it not? ...yes yes provided the font has it. ok anyway, so here's your quick fix, find/replace all your euro symbols in the word docs to something both spell checks will pick up..like "()" then make yourself a little .eps graphic, go inline and do a find/replace change all in quark. <br> <br>its a roundabout way ya - I have to do it all the time with french language accents, and my love/hate relationship with Mrs. Eaves </p>
