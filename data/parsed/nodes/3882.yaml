    html: <p> Ok, What I did was probably illegal but I had no other option. I created a euro symbol in illustrator and opened up my version of frutiger. I replaced the Ä (thats the character I was getting) with my own euro symbol. Its seems to have worked and since we dont print any German we shouldn't run into many problems.  <br>The legal issue does annoy me a little but I apologise. I don't see the point in buying a new font for one character, thats not commercialy sensible. Also in this case even if the font did contain the euro symbol it wouldn't have solved my problem because the keyboard equilivents don't match. <br>Apple Euro= shift Alt 2 <br>but when you convert the Windows command you get the Apple equivilent of Alt u shift a. <br>Thats on older european  keyboards anyway. <br> <br>As for my stance on the anonymous issue. Firstly I wasn't offering any opinions. I would have put my real name if I was voicing my thoughts on something, thats only fair. My question was purley technical, no need for a real name. </p>
