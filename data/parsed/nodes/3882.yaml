    votes: null
    html: "<p>Doesn't anyone want to help the kid? <br> <br>It's a Windows to Mac conversion problem. A quick Google search finds (from <a href=\"http://www1.tip.nl/~t876506/charsets.html\" target=\"_blank\">this page</a>): <br> <br>\"Another problem is the Euro currency symbol. In most of the new Macintosh fonts the general currency symbol has been replaced by the Euro symbol and in most of the new Windows fonts a formerly unused position got the Euro symbol. There is even a Unicode position defined for the Euro symbol: 20AC hexadecimal, which is the same as 8364 decimal.\" <br> <br>The Word import filter on the Observer's Quark is probably too old to catch this. <br> <br>----- <br> <br>Regarding the anonymity: In most online communities using real names is not the norm. I expect that someone young enough to grow up with the Internet (most college students) is used to using a nickname online. <br> <br>For someone young who will probably be using the net for the rest of their work and personal life, it makes sense to separate identites online. Could you imagine a future employer, spouse, social (or professional) enemy, etc. being able to find every little scrap of writing you'd done over the last twenty years by searching for your name? People have been using net in volume for long enough for this already to be a problem. I've read about a corporate employee that was fired because of a posting he made five years previous regarding his personal life. (Sorry, I don't remember enough to find the news story.) <br> <br>I've been lurking here for about six months and haven't signed up because I rarely feel the need to post. (Hi, all.) I'll never use my last name here because I don't want to leave a paper-trail because of this general principle. I've known people who have had problems with Internet stalkers. The \"Observer\" likely has nothing to hide, but feels uncomfortable giving out real-life info to a bunch of strangers.</p>"
    html_clean: "<p>Doesn't anyone want to help the kid? <br> <br>It's a Windows to Mac conversion problem. A quick Google search finds (from <a href=\"http://www1.tip.nl/~t876506/charsets.html\" target=\"_blank\" class=\"link-external\">this page</a>): <br> <br>\"Another problem is the Euro currency symbol. In most of the new Macintosh fonts the general currency symbol has been replaced by the Euro symbol and in most of the new Windows fonts a formerly unused position got the Euro symbol. There is even a Unicode position defined for the Euro symbol: 20AC hexadecimal, which is the same as 8364 decimal.\" <br> <br>The Word import filter on the Observer's Quark is probably too old to catch this. <br> <br>----- <br> <br>Regarding the anonymity: In most online communities using real names is not the norm. I expect that someone young enough to grow up with the Internet (most college students) is used to using a nickname online. <br> <br>For someone young who will probably be using the net for the rest of their work and personal life, it makes sense to separate identites online. Could you imagine a future employer, spouse, social (or professional) enemy, etc. being able to find every little scrap of writing you'd done over the last twenty years by searching for your name? People have been using net in volume for long enough for this already to be a problem. I've read about a corporate employee that was fired because of a posting he made five years previous regarding his personal life. (Sorry, I don't remember enough to find the news story.) <br> <br>I've been lurking here for about six months and haven't signed up because I rarely feel the need to post. (Hi, all.) I'll never use my last name here because I don't want to leave a paper-trail because of this general principle. I've known people who have had problems with Internet stalkers. The \"Observer\" likely has nothing to hide, but feels uncomfortable giving out real-life info to a bunch of strangers.</p>"
