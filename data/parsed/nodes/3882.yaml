    html: <p>Anonymity can sometimes be useful (like in my submissions to the t-shirt contest...), but very often it can be a barrier to the establishment of a real, contextual community. I'm not exactly sure why I care, in this case. In terms of gut feeling, it's just not honest. When you use a forum so clearly for your own benefit, it's only right to present yourself as who you are. A community benefits from mutual trust and humility, otherwise it's a dark alley where shady deals are made. <br> <br>The impression I get here is that the person doesn't want to appear not to know how to fix the problem. If this is true, it's the type of insecure manipulation I myself wouldn't want to encourage. On the other hand, this could very well be a mistaken impression - but it couldn't have happened without the anonymous presentation. <br> <br>Let's make Typophile -or anything else we care about- a reflection of our personal ideals. That is community. <br> <br>hhp</p>
