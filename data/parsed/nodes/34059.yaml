      <p>You could try FontForge. With the macports version of FontForge (fontforge 20120731 libfontforge 20120731-ML), I could open ArnoPro-Regular.otf, save, and then look at the kerning of the font that has been saved (the new version fontforge 04:17 EST 11-Apr-2014 libfontforge 20140411 crashes when I try to type the letter T for the first class)</p>
      <p><img src="/files/arno_3995.png" width="100%"><br>
      (open image in new window to see actual size)</p>
      <p>You can also select "Element &gt; Font info &gt; Lookups &gt; GPOS" and then right click kern and select "save lookup"; you will get a Adobe feature file containing the kerning information.</p>
