      <p>BTW, if anyone is interested to see the kerning data that went into each font, including kern classes, class kern pairs and subtable breaks, just dump the GPOS table with <a href="/wiki/spot" class="freelinking" rel="nofollow">spot</a> (tool included in the AFDKO). The output will show all the lookups in feature file syntax. The command to use is:</p>
      <p><code>spot -t GPOS=7 ArnoPro-Regular.otf &gt; gpos.txt</code></p>
