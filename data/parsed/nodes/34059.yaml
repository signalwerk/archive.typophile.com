    votes: null
    html: |-
      <p>The kerning lookup(s) in Arno Pro are so complex that the decompiler in FontLab Studio fails to interpret the code for it. But of course kerning is in there. </p>
      <p>FontLab Studio can decompile some binary OpenType Layout tables into the source Adobe FDK for OpenType notation, but this is by no means obvious and does not work for all kinds of lookup types and feature configurations. </p>
      <p>Once Adobe releases FDK for OpenType version 3 (or 2.5, or whatever they choose to call it) that supports all lookup types, we will rewrite the FontLab Studio part so that it is able to "dump" the binary OTL code into the AFDKO notation more fully. </p>
      <p>Regards,<br>
      Adam Twardoch<br>
      Fontlab Ltd.</p>
