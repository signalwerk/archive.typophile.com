    date_raw: 11 Aug 2014 — 6:52am
    date: 2014-08-11T06:52:00
    votes: null
    html: |-
      <p>I did a quick test and was able to extract a feature file from Arno Pro with DTL OTMaster, open the original font in FontLab, make an FDK build structure in a folder (I have a script that does this for the current font in FontLab), then try to build the font on the command line with makeotf.</p>
      <p>On the first try it failed with the same message as Glyphs (GPOS feature 'kern' causes overflow of offset to a subtable), but after adding "UseExtension" to the kerning lookup in the feature file, the font can be built with makeotf. I haven't done any checks if the font is identical to the original, though.</p>
      <p>BTW. In Glyphs, you can find a FDK build structure in your home folder in <code>Library/Application Support/Glyphs/Temp/‹font name›</code>. Perhaps you can add the "UseExtension" lookup flag in the 'features' file there and compile with makeotf from there.</p>
