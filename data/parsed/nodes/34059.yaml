    html: <p>FontForge does not preserve the naming table. So you need at least to extract the naming table from the Adobe font and then merge it into the resulting file; I do that with TTX. Aside from that I think FontForge does not scrap Adobe fonts (I have bundled i.e. old version, either CS3 or Adobe Type Classics). Anyway, if FontForge has a problem with a table, it emits a warning message. I have always found a way out with TTX; I have never tried  the FontForge feature "Fontfile &gt; Preferences &gt; Open Font &gt; Preserve tables" that might also help for tables FontForge does not know. But, frankly, if I only modified the GPOS table, I take it from the resulting .otf font produced by FontForge and merge it into the original with TTX. That way, everything else is preserved.</p>
