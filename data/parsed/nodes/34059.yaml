      <p>&gt; <em>I wonder if this is a protection mechanism...</em></p>
      <p>Protection against what? Are you trying to start some sort of conspiracy theory?</p>
      <p>There's nothing mysterious, custom or secret about Arno Pro's 'kern' feature other than its complexity is proportional to the size of the font's glyph set. FWIW, the AFDKO version we used for building the fonts is the exact same one that is made publicly available, and AFAIK all the fonts that come out of MakeOTF follow the OpenType specification closely.</p>
      <p>If there's anything extraordinary to say about Arno Pro's 'kern' feature is that it's big — read huge —, and uses a GPOS Extension lookup type.</p>
      <p>But that's not the point. David started this thread saying that he bought Arno Pro Regular, and the font has no kerning when using it with CS2 apps (InDesign, Illustrator, Photoshop). Needless to say I'm still waiting to see some evidence of that.</p>
