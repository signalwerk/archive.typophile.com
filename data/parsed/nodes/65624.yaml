    <p><a href="http://www.tvo.org/TVOsites/WebObjects/TvoMicrosite.woa?reading_empire_of_the_word" title="http://www.tvo.org/TVOsites/WebObjects/TvoMicrosite.woa?reading_empire_of_the_word">http://www.tvo.org/TVOsites/WebObjects/TvoMicrosite.woa?reading_empire_o...</a></p>
    <p>Eight years in the making, Empire of the Word is a compelling look inside the act of reading and traces its impact on more than five thousand years of human history. Introduced and narrated by one of the world's great readers, Canadian writer Alberto Manguel, the series traces reading's origins; examines how we learn to read; exposes censors' attempts to prevent our reading; and finally, proposes what the future might hold for this most human of creative acts.</p>
