    html: <p>There’s an good chapter in the Fontlab manual about getting fonts ready for release and generating them. If you’re having trouble with a particularly complicated font you might want to pay one of a technically inclined type designers to handle the final production.</p>
    html_clean: <p>There’s an good chapter in the Fontlab manual about getting fonts ready for release and generating them. If you’re having trouble with a particularly complicated font you might want to pay one of a technically inclined type designers to handle the final production.</p>
