    <p>"I'm a editorial designer and would really appreciate the opinion of the bright minds in the forum (everyone invited). I'm seeking for ideas and opinions on allusive typography. I'm creating a book on the history of ballet and thought about using a Typeface from the Romantic period. So I chose Bodoni, an Italian Type with Romantic characteritics. This would be for the body of the text. Then I was really thinking in using titles in Baskerville, even though it's a Baroque and English Typeface. You see, to my eyes they would match but I'm thinking if my boss would find it too bold.</p>
    <p>Thanks for your time and priceless thoughts."<br>
    ---</p>
    <p>This problem isn't in fact mine, hence the quotes. I'm just a begginer in the art of the Typefaces helping a colleague who isn't confortable with Forums in English... not that I'm any better.</p>
    <p>Thanks!</p>
    <p>L.R. :&gt;</p>
