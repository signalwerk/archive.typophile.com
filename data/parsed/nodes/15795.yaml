    html: |-
      <p>My view, Lucien, is that the Bringhurst/Noordzij view of Bodoni as a typographic Romantic, his forms whimsically calligraphic, is not only unhelpful but willfully paradoxical. Firstly, Bodoni's mature letterforms are duller than all contemporary forms excepting the Didots'. One need only examine any competent writing or engraving of the period to confirm this. Secondly, the larval Bodoni followed first the slaphead clumsiness of the rationalist, deist (not Baroque) Baskerville, who, unable to make type himself, could not learn even to judge it: his lc a is too fat, and his patronising disparagement of Caslon absurd. Thirdly, Bodoni cut punches for specific uses, making his work more like lettering than our ideal of infinitely combinable type. That his text sizes were not so specifically varied is irrelevant, because Bodoni famously sought only magnificence and knew nothing of sweetness in the mass. His texts were faulty and his whitespace unfunctional; he was not a typographer so much as a graphic designer. This matters because Romanticism is, when successful, the mode of the mobile consciousness, and the progessing sentence: the paragraph, or book, rather than the title page. Bodoni cared more for titles than for text. The most genuinely Romantic type designs are those like Deepdene, the letters of which are perhaps too dramatic taken individually, but which combine to very subtle effect.</p>
      <p>George</p>
