      <p>As David says, proper text and display versions, but it would also be good to have some idea that connects the two. </p>
      <p>For instance, Holiday magazine in the 1950s used to have heads in Bauer Bodoni, and text in Times, both of which had a similar quality of contrast and sharpness. </p>
      <p>So a way of making the combo work might be to match up different versions of the text Bodoni and display Baskerville, and see if any interesting relationships appear. Of course that does depend on having printed specimens -- the FontBook is useful. And I don't know if you have any particular cuts of the two faces you're committed to working with, Lucien.</p>
