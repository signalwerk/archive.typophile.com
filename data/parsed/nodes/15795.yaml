    html: <p>Just my personal thoughts, but I wouldn't suggest placing two serifed faces together on a design for the simple fact that they are too close (design-wise) to one another. There wouldn't be enough constrast between the two faces to look intentional. Both faces, in my opinion, are gorgeous and you could achieve that traditional, romantic, classical look that it seems you are going for, but placing them together would look like a mistake. Perhaps using different weights of the same font, i.e. regular with an italic, or just using a serif with a clean, sophisticated sans serif. One that comes to mind is Helvetica Nueue.</p>
