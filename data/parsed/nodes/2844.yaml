  html: <p>I’ve been seeing diﬀerent versions of Futura Medium; some with very tall ascenders, and some with not so tall ascenders. This goes back to metal versions and continues into the digital realm. Which is what Renner intended? Does the Renner book address this? <br><br>Here’s tall one <br><a href="http://www.adobe.com/type/browser/F/P_046/F_FUTU-10005000.html" target="_top">http://www.adobe.com/type/browser/F/P_046/F_FUTU-10005000.html</a> <br><br>And a sample of <span class="caps">CAPS</span> vs lc ascenders which are not so tall <br><a href="http://store.bitstream.com/testdrive.php?handle=573&amp;text=CAPSbdfhklt&amp;size=36&amp;View%2BText%21.x=48&amp;View%2BText%21.y=12" target="_top">http://store.bitstream.com/testdrive.php?handle=573&amp;text<span class="caps">=CAPS</span>bdfhklt&amp;size=36&amp;View+Text%21.x=48&amp;View+Text%21.y=12</a></p>
