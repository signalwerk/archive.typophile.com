    html: <p> Hah. This thread is pretty funny. It’s like ﬁghting the resurgence of bellbottoms for men—which are much uglier than any cut of Futura. <br><br>I recently saw a current annual report designed by Cahan <span class="amp">&amp;</span> Associates that used Futura *gasp* for body copy. I was very surprised and disappointed. But with an objective consideration, it’s actually quite well done. (I am going to have to ﬁnd out if it’s the tall or short variety. Heh.) <br><br>So, by talking about it so much, are we predicting a new popularization of Futura? I hope not. As anyone who’s ever worked with a design system based around Futura may agree, it’s a very boring font after a considerable length of time. <br><br>//joe </p>
