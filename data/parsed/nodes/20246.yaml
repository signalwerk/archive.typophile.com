      <p>What do you mean by "move"? (I'm guessing you mean more than minor shifts based on creep settings?)</p>
      <p>And, are you creating a new, imposed version of the file, or just outputting an imposed copy (to printer or PDF)? I've found that the former sometimes tosses things around, but the latter seems to keep them in their place.</p>
