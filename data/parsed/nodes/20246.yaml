    <p>I have a slight problem with InBooklet SE on Indesign CS. I'm doing a small magazine of 32 pages, and when I try to use the plugin for compagination on a 2up saddle stitch booklet some text boxes move, apparently not all move the same distance.</p>
    <p>Could anyone help me with this?</p>
