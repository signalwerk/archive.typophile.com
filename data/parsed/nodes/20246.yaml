    html: |-
      <p>As I mentioned above, if, by "move," you mean that objects (text boxes) shift slightly towards/away from the spine you might have the creep settings set oddly. If that's the case you'll notice the same shift in the PDF.</p>
      <p>I'm assuming, however, that you're familiar with creep settings and that this is not the issue.</p>
      <p>If, when creating a new (imposed) file, your objects are jumping around significantly and text flow is getting screwed up, printing to PDF should fix that (at least that's been my experience.)</p>
