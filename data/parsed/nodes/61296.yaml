      <p>In an <a href="http://typophile.com/node/60432#comment-358702" target="_blank">earlier thread</a>, John Hudson wrote:<br>
      <cite>Also, in order to build ’size’ feature data into a font, one needs to use an Adobe FDK-based tool for OpenType Layout tables. A tool such as VOLT, used by pretty much everyone making fonts for complex scripts, which is based around the normal structures of GPOS lookups, has no way to build a ’size’ feature.</cite></p>
