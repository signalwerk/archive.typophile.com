    <p>Hi everyone,<br>
    I’m looking for a typographic magazine to subscribe to,<br>
    since typographic magazines are none existing at the kiosks in Norway.<br>
    I have previously subscribed to Baseline, which I’m satisfied with,<br>
    but does anyone have any other magazines to suggest?</p>
    <p>I has to be in english, and I’m looking to learn more about,<br>
    technical and historical aspects of typography.</p>
    <p>Oystein</p>
