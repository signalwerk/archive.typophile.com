    votes: null
    html: |-
      <p>Ahh I didn't get the copyright or registered theme. Interesting idea. </p>
      <p>The overall feel though is more like Coach to me than hip hop-skater. I think you could use the copyright and r symbol with a bit more interesting type. Or mess around with different ways of displaying the c and r.</p>
      <p>What about a ligiature with capital RC with R before C? Or ligiature C above the R... I'll try to think of some interesting things.</p>
