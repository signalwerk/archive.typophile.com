    <p>Please critique and comment on this logo and typeface. This is a brand new clothing company. A high-fashion targeting 20-30years old company. Also a clothing brand identity for a trendy Hip-hop and Skate styles.</p>
    <p>The name of the company is CHARACTER.<br>
    Typeface: Akizedenz Grotesk (black)</p>
    <p>Thanks!!</p>
