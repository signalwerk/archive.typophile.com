    date_raw: 13 Jun 2006 — 12:56am
    votes: null
    html: <p>Yea i don't get it. Why is the logo mark a combined CR? Why are the A's upside down? How does this relate to your target market? What is the theme behind it? What other concepts did you come up with? Personally I would scratch it and go back to the sketch pad.</p>
  - id: 128750
    user: 1115
    date: 2006-06-13T07:59:00
    date_raw: 13 Jun 2006 — 7:59am
    votes: null
    html: <p>Johnzai, I wouldn't scratch this idea. It looks hip to me, like a figure stepping forward, like a little "character" so I get it. I definitely see a figure in there, the legs of the "r" have the baggy pants look to it. Again, I'm not sure I'm making the high fashion connection. Keep working on it. Logos are like ink blot tests, everyone will see something different.</p>
  - id: 128897
    user: 13359
    date: 2006-06-13T15:43:00
    date_raw: 13 Jun 2006 — 3:43pm
    votes: null
    html: <p>my concept was to create a series of clothing with indivdual character. reminisce of the copyright logo "C" and "R". By combining the two to create a logo that suites the character branding. As for the letter A in the character I'm not quite sure about that myself either. It just seems a little more appealing and attractive to look at. I'll keep working on it though. Thanks for the comments guys. Really helps. I'll keep posting. Thanks again.</p>
  - id: 128902
