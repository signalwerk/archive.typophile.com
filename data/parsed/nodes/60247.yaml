    date_raw: 10 Aug 2009 — 8:43am
    votes: null
    html: |-
      <p>"The style seems to be created with two kind of tools, one wide – one very thin."</p>
      <p>This genre is done with one pen. A pointed nib. The thicks and thins are achieved with pressure and release.</p>
      <p>If, however, you are going to draw it with a monoline thin pen and add the thicks later you must look at it as a chessboard with accompanying thoughts of what "Copperplate letters" should look like. This will mean you will have to use models of Copperplate to define the thicks/thins on chosen letters and then wing it to "fatten up" dead spots (very thin areas like the left side of the I). Does this make sense?</p>
      <p>Just like the "Roman" the left side of the A should be thin... and to fill you could add weight to the A crossbar or the right hand flourish of the E. That should fill in the "hole."</p>
      <p>Yes the A is too distant from the other letters and I have indicated where you might think about adding taper to equal it all out.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Picture2_3817.png"></div><br>
      Michael<p></p>
