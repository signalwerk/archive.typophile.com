      <p>The letter “I” it’s always a tricky one. The risk I see here is that it may end up visually as an ornament of the “E” instead of a separate letter.<br>
      I would also check the first stroke of the “A”, which don’t get along with the others...<br>
      That said, I wouldn’t be able to come up with something so good! :-)</p>
