    html: <p>I apologize if this come across as too heavy but these pattens of heavy &amp; light don't make sense to me even in a mannerist model. The left side of the a in particular seems like a compromise not a definite act. Also if you are going to be mannerist think about what you want to emphasize and why. Being mannerist is a license - use it. The second smaller heavy part of the E for instance - why is it compteting with the identity of the E? I would think about it &amp; do it again.</p>
