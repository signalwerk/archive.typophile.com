    html: '<p>By no means am I experienced in anything, but I was recently in a similar situation for my senior thesis. I did a lot of research and reading and eventually ended up with an interesting, though very ridiculous (and somewhat embarrassing) idea for my project.  <br> <br>A good starting point would be to decide what type of project you would enjoy doing. Elliott Earls has a good essay in Emigre #65 that helped me with this. He categorizes modern type design as falling into 3 categories, "historical revival, vernacular interpretation, or exclusively formal extrapolation." From that point it was pretty easy to come up with a clear brief and strategy.  <br> <br>I hope that helped. Good luck.</p>'
