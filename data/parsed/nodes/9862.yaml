  html: <p>I've just started research, I have about 7 months. I'd like to design a face, but am lacking in direction. Have no preconcieved notions on to what, sans, roman, script, modular etc... i would do. Need advice on how to go about establishing a NEED and FUNCTION. The design will be stronger, and I will feel better about it, as it was purposeful. Want to avoid post-rationalization.  To any experienced type designer, I implore your assistance... <br> <br>Thank you</p>
