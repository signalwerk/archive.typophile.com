    html: <p>I recommend defining a brief of some kind, which will constrain your thinking about a project and present a direction. Typically, type design briefs are along the lines of 'a signage typeface' or 'a text type for newspapers' etc., and require both stylistic and technical response. <br> <br>Since this is a school project, I think you could set yourself something a little bit more interesting than these typical commercial briefs. Why not consider designing a typeface for a particular text, e.g. some book that interests you? This would force you to consider the material requirements of an edition (at what size should it be set, do you need variants e.g. for subheads or footnotes, how do you envision it being printed) and the stylistic suggestions of the text. Ideally in such a project, the stylistic considerations should avoid the obvious (it's a Jane Austen novel so the typeface is a revival of an early 19th century face) and reflect your response to the text, which might be affectionate if it is a book that you really like, but could also be ironic or subversive.</p>
