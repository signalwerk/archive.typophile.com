    html: "<p>Define \"experienced\"...  :-) <br> <br>Starting in a vacuum is indeed hard. But that doesn't mean your goal has to be very niche. You could simply decide to make the best general-purpose sans you can for example - something that many people could use to set many kinds of (not-too-long) text. On the other hand, the narrower the goal the easier it is to be original (while always maintaining a functional framework). Or you could start from a shape you like (like a certain kind of arch or something) and develop a whole font from it; although for me personally that's a superficial approach (I know because I've done it too), it's still possible to: arrive at a usable display face, if you can learn to be not too literal, and break your \"rules\" as needed; and gain a lot of practice in the mechanics. <br> <br>hhp</p>"
