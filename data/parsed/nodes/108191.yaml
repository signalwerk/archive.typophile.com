    <p>I am interested if anyone knows a font that is in any way similar to the One used on the words Liberty Bonds on the poster enclosed.<br>
    I am designing a book cover for a book of First World War Nursery Rhymes. So I am looking for a font that is Chunky but also that has a bit of Child-like Character.<br>
    Approach<br>
    Another approach is to choose typography that was designed around the period of the first world war.<br>
    Garamond and P22JohnstonUnderground come to mind, but they may be just a little too serious straight looking.<br>
    Impact also comes to mind just because a lot of the hand-drawn posters were drawn in quite a blocky font.<br>
    If anyone has any views/suggestions please share.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/a-1038-100_6489.jpg"></div><p></p>
