    </p><div class="imageWrap"><img src="http://typophile.com/files/mode_6217.png"></div><p></p>
    <p>I found this lettering in " La lettre dans la peinture et la publicité" of J. Joveneaux, edited in 1957 by Charles Massin (Paris).<br>
    I'm looking for a similar digital typeface.<br>
    Thank's for any help.</p>
