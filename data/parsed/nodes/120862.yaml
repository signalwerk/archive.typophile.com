    html: |-
      <p>A general specific french cinema style? Hardly to grasp. Let Google sort out images to “cinema français affiche” and you’ll see – everything. But looking for “cinema français affiche 1930” reveals a different scenery: type like <a class="freelinking external" href="http://www.myfonts.com/fonts/facetype/marlowe/" rel="nofollow">Marlowe</a> or the stunning <a class="freelinking external" href="http://www.myfonts.com/fonts/marksimonson/mostra-nuova/" rel="nofollow">Mostra Nuova</a> by – Mark Simonson. To him I’m especially grateful for his intricate review of type in the film The Artist. For a very long time I feel that lettering and type is awkwardly neglected by film makers, mostly. Mark’s article opened my eyes upon how crucial (!) script and lettering is for a silent movie in particular.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/brain_4880.png"></div><br>
      <div class="imageWrap"><img src="http://typophile.com/files/rauchen_6502.png"></div><p></p>
