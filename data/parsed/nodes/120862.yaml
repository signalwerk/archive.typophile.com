      <p>Hi Nick,</p>
      <p>Thanks for sending me Excoffons way. I know some of his fonts but had no idea they were by a French Foundry/designer. Mistral looks a bit American to me for some reason.<br>
      They are the sort of fonts I would dismiss often as they are so unique/different.<br>
      That is very often a reason for using them of course as design is often about making a statement/making something unique. Banco is a really interesting one.</p>
      <p>Hi Kthomps5,<br>
      Thanks I will have a look at your link. I have done a layout already using the Jean-Luc Godard face.<br>
      It's certainly got power on the page and looks really modern somehow. Seems a little similar to Knockout.<br>
      Don't know if I can do the kind of Justification Jean-Luc uses in his title sequences though.<br>
      It just doesn't sit well to my eye, though many designers would disagree.</p>
