      <p>A general specific french cinema style? Hardly to grasp. Let Google sort out images to “cinema français affiche” and you’ll see – everything. But looking for “cinema français affiche 1930” reveals a different scenery: type like <a href="http://www.myfonts.com/fonts/facetype/marlowe/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Marlowe</a> or the stunning <a href="http://www.myfonts.com/fonts/marksimonson/mostra-nuova/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Mostra Nuova</a> by – Mark Simonson. To him I’m especially grateful for his intricate review of type in the film The Artist. For a very long time I feel that lettering and type is awkwardly neglected by film makers, mostly. Mark’s article opened my eyes upon how crucial (!) script and lettering is for a silent movie in particular.</p>
      <p><img src="/sites/default/files/old-images/brain_4880.png"><br><img src="/sites/default/files/old-images/rauchen_6502.png"></p>
