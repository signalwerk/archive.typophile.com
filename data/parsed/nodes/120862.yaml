      <p>When I think of the history of French cinema, I think of <em>auteurs</em> who were formally innovative—e.g. Melies, Gance, Cocteau, Godard, and now Hazanavicius.</p>
      <p>While it’s true that Cassandre’s Peignot was also formally innovative in its day, it has rather a traditional art deco look, even in the true unicase setting.</p>
      <p>Why not go with something post-modern that suggests innovation today?<br>
      Pierre di Sciullo: <a href="http://www.quiresiste.com/realisations.php?lang=en" title="http://www.quiresiste.com/realisations.php?lang=en">http://www.quiresiste.com/realisations.php?lang=en</a></p>
      <p>Excoffon, 20th century master: <a href="https://www.myfonts.com/person/Roger_Excoffon/" title="https://www.myfonts.com/person/Roger_Excoffon/">https://www.myfonts.com/person/Roger_Excoffon/</a></p>
