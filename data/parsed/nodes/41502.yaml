    <p>I’m working on a logo for a federal consulting company, who is moving into more software development and need a modern, solid logo. The more I tried creating a symbol the more I realized they only need a wordmark.</p>
    <p>I’ve played with some ideas and have found two faces that I think I can work from. Looking over the attached image do you feel that either of these faces will work. Which ones do you prefer. Can you think of similar typefaces I may want to checkout, or any other comments are all welcome</p>
    <p>I am at square one.</p>
    <p>Things I’m thinking right now:<br>
    1,2,4,5 need to be thinned out slightly<br>
    I need to work on kerning.<br>
    I think most of the cuts in the L look a bit silly.</p>
