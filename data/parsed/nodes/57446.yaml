    <p>Ok, so obviously I haven't posted in a while but I just found this amazing piece called "You Blow Me Away" by Jason Tozer. He printed the words "you blow me away" on 20 7mm sheets of glass &amp; photographed how the glass broke when hitting it with objects like a pool ball. The lettering on the broken glass while it's flying through the air are just breathtaking!</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/blow_01_5654.jpg"></div><p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/blow_02_6733.jpg"></div><p></p>
