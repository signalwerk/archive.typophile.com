    <p>Hi Typophile,</p>
    <p>There is a logotype designed by <a class="freelinking external" href="http://www.fabioongaratodesign.com.au/cms-the-capitol/index.phps" rel="nofollow">Fabio Ongarato Design</a> for the The Capitol which feels like it has been inspired a bit too much by another custom typeface—Twin by Mark El-Khatib.</p>
    <p>The logotype<br>
    <img src="http://typophile.com/files/Untitled-1_84.jpg"></p>
    <p>Twin<br>
    <img src="http://typophile.com/files/ARC_PRESSRELEASE_0.jpg"><br>
    <img src="http://typophile.com/files/4760275401_66d5e59abf.jpg"></p>
    <p>I guess conceptually this kind of double-line typeface isn't new, it's been popular probably since the letraset types of the '70s but visually Mark El-Khatib's typeface is quite distinct, the way the lines loop and cross over is something pretty unique in the canon of contemporary type design isn't it?  The designer has tried to change it, however, in the text South Yarra it's quite clear there is a big relationship between the logotype and Twin.</p>
    <p>What are you opinions fellow typophiles? Is this plagiarism? Or inspiration?</p>
