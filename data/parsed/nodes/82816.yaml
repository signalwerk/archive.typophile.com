    html: |-
      <p>Of course, maybe the difference between plagiarism and inspiration is fairness? (which is relative...)</p>
      <p>That would be very welcomed—to have the designers provide their own side of the story.</p>
      <p>I think what makes me lean towards seeing it as a direct inspiration (and maybe too much) is the fact that the Twin typeface has been in use and appearing on many design blogs as early as <a class="freelinking external" href="http://www.mottodistribution.com/site/?p=7420" rel="nofollow">July 2010</a>, whilst The Capitol identity appeared locally only early this year...</p>
      <p>It also seems too convenient that only the C, O and I (although you couldn't really do that character differently) are exactly the same in their construction (the word, The Capitol is in a different style obviously but uses the same construction) as if the they were trying to avoid being <strong>exactly</strong> the same. I'm speculating here of course...</p>
