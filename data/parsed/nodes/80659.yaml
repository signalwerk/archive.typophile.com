  html: |-
    <p>Hi Guys,<br>
    My eyes are bleeding from looking at typefaces all day.</p>
    <p>I am developing a brand that is focused on the purity of a product, and the approach is to use a stripped-back typeface as a core word mark.</p>
    <p>To support the stripped back sans I was hoping to use Austin as it's emotive qualities will work well to create dynamic packaging and create a visual language for the brand.</p>
    <p>I love the depth of the Foundry Grotesk family. I also have a picture in my mind of the word mark being similar to Trade gothic Bold Cond No.20 (all CAPS).</p>
    <p>Any ideas?</p>
