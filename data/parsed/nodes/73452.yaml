  html: |-
    <p>Just found this site that claims to be the Wikipedia of typography. You can look up fonts, learn about typography, get involved in forums, Add your own fonts and knowledge. Looks like it’s pretty early days and there are plenty of holes in the content but you can get an idea of what it is going to be about.</p>
    <p><a href="http://typedia.com" title="http://typedia.com">http://typedia.com</a></p>
    <p>All seems to be stuff that Typophile does in some way other.  To me it seems a little ill-conceived what does everyone else think? The search tools are not as good as something like myfonts.com, the forum will need to work hard to beat Typophile and the type info doesn’t seem that great to me.</p>
    <p>What does everyone else think?</p>
