      <p>I believe Typedia is/was a pet project of designer Jason Santa Maria. A labor of love that percolated for a few years before it finally went live.<br>
      I'm guessing, but he probably had the domain name and the concept for those years, hence, 2006-2010. (I'll ask along the way.)</p>
      <p>Typedia has yet to find its niche - but as type and typography and awareness of both on the web grows, I think it will ultimately find one.</p>
