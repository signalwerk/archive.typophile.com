    html: |-
      <p>Usually, for things like this, lately people have tended to use typefaces like Ondine or even (shudder) Papyrus.</p>
      <p>So, when it comes to the dull boring choices that have been overused, some other choices are</p>
      <p>Slogan<br>
      Neuland<br>
      Legend<br>
      Mistral</p>
      <p>For an <em>authentic</em> choice, though, some Googling located <a class="freelinking external" href="http://luc.devroye.org/fonts-55992.html" rel="nofollow">Padma</a>, by Masuraj Sudana.</p>
      <p><a class="freelinking external" href="http://www.behance.net/gallery/Padma-Typeface/798617" rel="nofollow">http://www.behance.net/gallery/Padma-Typeface/798617</a></p>
      <p>is another link.</p>
      <p>For Indonesia, there's FTF Indonesiana Serif Sketch by <a class="freelinking external" href="http://fizzeticatypefoundry.storenvy.com/" rel="nofollow">Fizzetica Type Foundry</a>, and Tanah Air Beta.</p>
