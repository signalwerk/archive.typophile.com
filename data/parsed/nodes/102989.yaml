    html: <p>If you really want to go the route of using a Latin script typeface to evoke a non-Latin culture, then my vote would certainly be for Padma. Note, however, that none of the types suggested in this thread are appropriate for continuous text, so you's want to limit something like Padma to headlines and other display use, and select a Latin text face that harmonises well with it.</p>
