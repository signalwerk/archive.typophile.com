      <p>Anything that gives a display face a certain mood can be applied in a text face too, just much more subtly. Looking at Padma (which I also like) I was immediately reminded of Papassissa's "Dr Jekyll &amp; Miss Hyde":<br>
      <a href="http://www.typefacedesign.org/resources/A5specimen/2012/ElenaPapassissa_Dr%20Jekyll%20and%20Miss%20Hyde_Specimen.pdf" title="http://www.typefacedesign.org/resources/A5specimen/2012/ElenaPapassissa_Dr%20Jekyll%20and%20Miss%20Hyde_Specimen.pdf">http://www.typefacedesign.org/resources/A5specimen/2012/ElenaPapassissa_...</a><br>
      <a href="http://www.typefacedesign.org/2012/" title="http://www.typefacedesign.org/2012/">http://www.typefacedesign.org/2012/</a></p>
      <p>hhp</p>
