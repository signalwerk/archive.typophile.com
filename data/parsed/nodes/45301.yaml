    html: |-
      <p>Quoting Christian Schwartz:</p>
      <p>This is indeed a custom face from FB, drawn by Cyrus Highsmith. It’s a slab version of their sans, which was called <a href="http://www.fontshop.com/fonts/downloads/font_bureau/antenna_normal/" rel="nofollow">Antenna</a> last time I checked (which is a great name - i hope it sticks). The sans is also used by Poz, Popular Mechanics, and another publication or two, and has the extensive range of weights and widths one would expect from Font Bureau, but as far as I know the slab is exclusive to AARP, at least for the time being.</p>
