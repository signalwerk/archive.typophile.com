    votes: null
    html: |-
      <p>I appreciate your feedback. Antenna has a lot of differences (Antenna lowercase "l" is curved at the bottom, not in Boomer for instance. Also the Os (Q,C, G. etc.) in Antenna are not round, they are a square-round (hard to describe, but they are weird and i really don't like them!). Antenna feels extended, although it may just be that O shape. </p>
      <p>Any other suggestions?</p>
