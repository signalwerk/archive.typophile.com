    html: |-
      <p>Braces, (ORIGIN from Old French bracier ‘embrace’, from brace ‘two arms’, from Latin bracchium ‘arm’) – {curly}<br>
      Brackets – [square]<br>
      Parentheses – (rounded)<br>
      However, as with so many terms in type setting, there is crossover and confusion, these are just definitions that I have learned.<br>
      Tim</p>
    html_clean: |-
      <p>Braces, (ORIGIN from Old French bracier ‘embrace’, from brace ‘two arms’, from Latin bracchium ‘arm’) – {curly}<br>
