    html: |-
      <p>It's silly to include Braces as a standard-encoding digital font character, because they are not used on the same line as other characters, and would be put in a separate text box if used at all. So an all-braces font makes a lot of sense. </p>
      <p>Braces are all too heavy in digital fonts, and I include my own, but I'm just following precedent to match their weight to that of the square brackets and parentheses, as sort of an ornate alternative to the square bracket, in fact.</p>
      <p>Whenever I have had to set braced material, I have always used the component-system that's part of the Symbol font.</p>
