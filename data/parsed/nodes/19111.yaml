    html: |-
      <p>&gt;It’s silly to include Braces as a standard-encoding digital font character</p>
      <p>I see what you're saying, but lots of scripting and programming languages use them as standard glyphs. Ok, maybe that doesn't seem to matter much from the perspective of artful typography, except there are often times when you want to include a snippet in some document you're writing. Like if I want to define a style in CSS and explain how, I'd be writing...</p>
      <p>.style {<br>
      color=blue<br>
      }</p>
      <p>That's just the standard syntax. For large braces, such as those use in mathematics, I agree that you need a different kind of tool. To some extent, LaTex provides that as part of its raison d'etre.</p>
      <p>- J</p>
