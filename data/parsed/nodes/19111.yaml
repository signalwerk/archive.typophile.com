      <p><em>lots of scripting and programming languages use them as standard glyphs.</em></p>
      <p>Point taken. It's a question of priorities and power -- although 99% of typefaces would never be used for programming, the character had to be there (along with a bunch of higher math characters), because programmers called the shots for the basic character set. Glyphs that are typographically useful in a great many more fonts -- the f ligatures -- were excluded.</p>
