    html: <p>Tim-- I think your definitions make sense. If you look at the Ramus illustration, which is part of an academic text that was written in Latin and certainly heavily influenced by the Latin conventions, the curly guys do look (a) fairly consistent and formalized, and (b) like arms "embracing" a cluster of terms, which is exactly what Ramus' taxonomical stuff was meant to do-- traditional Aristotelian analysis of phenomena into types, such that a particular category X "embraces" a set of sub-categories. I really need to look into this more!</p>
