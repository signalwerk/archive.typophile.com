    html: |-
      <p>&gt;Glyphs that are typographically useful in a great many more fonts — the f ligatures — were excluded.</p>
      <p>And point taken here, in return. In fact, once I discovered the whole world of typography (not that long ago actually) and got my hands on InDesign, I became frustrated that so few ligatures and alternates are to be found. I suspect that as time goes on, though, there may be some equalization-- more and more fonts will come with the serious type options as standard components. And someday brackets, arrows, lines, etc.-- all the sort of 'metatypographical' stuff that is so important-- may become built in such that "inline" type arrangement in programs like InDesign will be useful enough to make workarounds like separate drawings and text-boxes less necessary. Pipe dream, mayb.</p>
