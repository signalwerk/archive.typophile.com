  html: <p>As far as I know type 3 fonts have till now been supported by unix based operating systems only. Since Mac OS X is one, does anyone know if type 3 has been implemented in Mac OS X <br> <br>As you all know type 3 supports shades and graduated fills. Basically, it uses the whole language of Postscript</p>
