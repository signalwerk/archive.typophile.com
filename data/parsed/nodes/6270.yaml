    html: <p>I don't see any problem with the N. It shares the same uncial/semiuncial heritage of other letters. Besides, where's written that an R should morphologically follow the logic of the B or vice-versa? Maybe the intention of John Spencer was to give each letter a different treatment. That's why I think these postings are often tricky for a beginner. They may be confusing more than helping...</p>
