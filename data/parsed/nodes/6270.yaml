    html: <p>John, <br> <br>This is really fascinating work. <br> <br>Entering the "B/R" debate late as I am, <br>I was going to disagree with Cristian <br>(specific to this face only) on the grounds <br>that the forms seemed to reflect enough <br>of each other to my eyes, but I quite like <br>the solution you presented afterward. <br> <br>I like the direction you've established in the lc, <br>but I'd love to see more uncial forms, <br>especially in lc "a", "b", "d" and "r", and <br>perhaps "e". Check the forms in Omnia <br>(<a href="http://www.myfonts.com/Search?searchtext=omnia" target="_blank">http://www.myfonts.com/Search?searchtext=omnia</a>) <br>to see more precisely what I mean. <br> <br>David</p>
