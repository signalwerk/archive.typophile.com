    html: <p>i intentionally posted this face without any introduction or basis, because i was  <br>curious as to what kinds of classifications pseudo sachsen would receive from  <br>my peers.  <br> <br>perhaps i did initially post sachsen in the wrong category, yet my intentions with  <br>the lower case are to maintain a legible, modern sans-face while the caps possess  <br>a bit of the display majuscule as some of the historical specimens from which i  <br>collected reference (namely the 5th to 9th century adoption of roman characters  <br>and written literacy into anglo-saxon, irish, visigothic and other northern european  <br>cultures)</p>
