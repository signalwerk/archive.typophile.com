    html: <p>John <br> <br>i really like your imrovements <br> <br>only a few comments <br> <br>1.-in your lc "r" i think that the "nose" should be shorter, is to ackward the spacing with these one. <br>2.-i do like the second stem to be shorter but you should be carefull or even forget it in some characters like the "n" or "m", besides this is completely the opposite in the UC "M" and "N" <br>3.- Why not givin' some curvy stuff in the descender of the "x", that would tie it up with the other letterforms. <br>4.- in your UC "S" i think that it should be so rough in the right bottom, you should go up a little bit with that corner, the same as lc "b" <br>5.- in the lc "o" those corners should be more clear, like in your lc "c" <br>6.- lc "z" for me is too wide <br>7.- you should shorten a little bit the acender of lc "t", it's too disturbing <br> <br>anyway, you are progressing with big steps, good work :-) <br> <br>CG</p>
    html_clean: <p>John <br> <br>i really like your imrovements <br> <br>only a few comments <br> <br>1.-in your lc "r" i think that the "nose" should be shorter, is to ackward the spacing with these one. <br>2.-i do like the second stem to be shorter but you should be carefull or even forget it in some characters like the "n" or "m", besides this is completely the opposite in the UC "M" and "N" <br>3.- Why not givin' some curvy stuff in the descender of the "x", that would tie it up with the other letterforms. <br>4.- in your UC "S" i think that it should be so rough in the right bottom, you should go up a little bit with that corner, the same as lc "b" <br>5.- in the lc "o" those corners should be more clear, like in your lc "c" <br>6.- lc "z" for me is too wide <br>7.- you should shorten a little bit the acender of lc "t", it's too disturbing <br> <br>anyway, you are progressing with big steps, good work :-) <br> <br>CG</p>
