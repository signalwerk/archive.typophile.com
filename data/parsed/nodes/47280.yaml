      <p>Tamara, "Fabulous50's" appears to be a rip-off of ITC Coolman, without its kerning. That explains the awkward spacing of letters. That also explains why the Font Author was shown as 'unknown'. Please don't use fonts like that. When you can't find the name of the designer, you should be wary of a rip-off font.</p>
      <p>- Mike Yanega</p>
