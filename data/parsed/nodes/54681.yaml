      <p>They are also used to indicate someone's voice trailing off... or an unfinished thought. And, of course, between parentheses they indicate that some text has been omitted.</p>
      <p>Check out the <a href="http://en.wikipedia.org/wiki/Ellipsis" rel="nofollow">Wikipedia entry</a>. I like the part where it states, "The use of ellipses can either mislead or clarify, and the reader must rely on the good intentions of the writer who uses it."</p>
