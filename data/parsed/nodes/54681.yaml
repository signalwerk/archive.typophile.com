    html: |-
      <p>I think it's mostly used in electronic communication to indicate gaps in reasoning and tangential thoughts without suffering the hassle of exploring each strand to it's logical conclusion.</p>
      <p>It saves lots of space, as you relegate the work of finishing your sentences to your unfortunate readers, leaving clues of varying vagueness in your slothful path.</p>
      <p>So the above can translate to:</p>
      <p>Ha! Like... its EZ 2 do... + more fun n all.</p>
      <p>Bellyfeel doubleplusgood.<br>
      _____________________________________________<br>
      Personal Art and Design Portal of Ivan Gulkov<br>
      <a href="http://www.ivangdesign.com" title="www.ivangdesign.com">www.ivangdesign.com</a></p>
