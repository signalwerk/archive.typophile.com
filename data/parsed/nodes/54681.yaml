    html: |-
      <p>I think you bring up a good point about use of ellipses, although to me, they're underused, not overused.</p>
      <p>Too often I see people using periods when they should be using ellipses. </p>
      <p>I'm worried that ellipses are going the way of the semicolon, being misunderstood and underused.</p>
