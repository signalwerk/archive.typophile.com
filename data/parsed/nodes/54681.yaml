    <p>Does anyone else find that ellipses are too often used for malicious intent. I understand that part of their function is to indicate a dramatic pause, but I find them hard to decifer especially with text messenging and emails. They always seem to imply a sense of irritation or impatience. Maybe my point is that they are digitally overused.</p>
    <p>Dracula gives an example of the malicious ellipses: "I never drink ... wine"</p>
    <p>Anyway I wrote a post on my take of ellipses if you are interested.</p>
    <p><a href="http://www.typeandglyph.com/2009/02/dot-dot-dot/" title="http://www.typeandglyph.com/2009/02/dot-dot-dot/">http://www.typeandglyph.com/2009/02/dot-dot-dot/</a></p>
