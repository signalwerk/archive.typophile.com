    html: |-
      <p>This image from the book is misleading:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/tree_5413.png"></div><br>
      _<p></p>
      <p>It suggests that the North Indian, Tibetan and Korean scripts are in a line of descent from modern Arabic. There is a hypothesis that Korean Hangul script was based in part on the Mongol 'Phags-pa script, which was in turn based on Tibetan, but the hypothesis is not widely accepted. More problematic, though, is the line through Arabic. To my knowledge there is no theory or evidence linking the Northern Indian scripts with Arabic: they're not even in the same class of writing systems. Perhaps the authors were confusing two the different Mongolian scripts  -- 'Phags-pa and Uyghur -- and their lines of descent, and extrapolating an incorrect line from Arabic to Korean. It should be something like</p>
      <p>Aramaic ~&gt; Brahmic -&gt; North Indian -&gt; Tibetan -&gt; 'Phags-pa ~&gt; Korean</p>
      <p>and</p>
      <p>Aramaic -&gt; Syriac -&gt; Sogdian -&gt; Uyghur -&gt; Mongolian</p>
