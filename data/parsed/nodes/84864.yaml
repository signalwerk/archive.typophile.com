      <p>Hello John,</p>
      <p>Shame on us. Of course you are right with your correction. I just mailed Geert and he looked again in his sources (the dutch translation of The Joy of Knowledge, Editor James Mitchell, Published by Beazley Encyclopedias Ltd 1976, London and <a href="http://www.ancientscripts.com" title="www.ancientscripts.com">www.ancientscripts.com</a>).<br>
      There is indeed a design flaw in the diagram. The link between Nothern Indian and Modern Arabic is false. The line from Northern Indian had to go to Brahmin.<br>
      Of course the diagram can be enhanced with the suggestions you do and we will consider that of course in a reprint. At the time Geert was making the diagram the chart in the enclosed picture (in dutch) was his main source. With your correction and the info on <a href="http://www.ancientscripts.com" title="www.ancientscripts.com">www.ancientscripts.com</a> we can make it better the next time. Thanks for your input! </p><div class="imageWrap"><img src="http://typophile.com/files/Schema_5574.jpg"></div><div class="imageWrap"><img src="http://typophile.com/files/alfabetScanBook_4096.jpg"></div><p></p>
