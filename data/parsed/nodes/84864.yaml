    <p>An online version of a typographic reference book by Joep Pohlen and recently-published by Taschen is now at</p>
    <p><a href="http://www.letterfountain.com/" rel="nofollow">www.letterfountain.com</a></p>
    <p>The site is based on the text of the first 240 pages of the book is available there in four languages; English, Spanish, French and German. </p>
    <p>The 'Extras' section includes downloadable .pdf versions of the extensive timeline diagrams that feature in the book. These are pretty good for anyone having to learn or teach 'type history 101' and who has maybe not seen <a href="http://typophile.com/courses/type101" rel="nofollow">Hoefler's examples</a> here in the resources section on Typophile.</p>
    <p>Enjoy.</p>
