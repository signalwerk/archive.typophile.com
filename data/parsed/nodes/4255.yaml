    html: "<p>I went and pulled out my copy of Printing History #26/27. I just thought I’d note that there are *two* reviews of Adobe Garamond in that issue. The one by Mark Argetsinger is quite critical, as Hrant notes. The one by Jerry Kelly is quite complimentary. After some minor criticisms, Kelly says that “nonetheless, Adobe Garamond is the most accurate derivation of Claude Garamond’s types done to date, and a signiﬁcant addition to the world’s typographical resources. In fact, some of the face’s less immediately obvious features contribute substantially to its beauty, and bear discussion.” The summation at the end of his review is in a similar vein. <br><br>As for the Argetsinger review, it is quite interesting as well. His main criticisms of Adobe Garamond are that it: <br><br>- diverges more than needed from the original, particularly in areas of regularization <br><br>- is based on Garamond’s punches without regard for their impression on paper (the latter being the way the types appeared in actual use) <br><br>- lacks optical size variants <br><br>Some time next week I’ll comment more on the origins of Slimbach’s new Garamond. <br><br>Regards, <br><br>T</p>"
