    html: <p>Regarding the <span class="caps">APHA</span> review of Adobe Garamond, this needs to be read not merely as an exhaustive critique of this typeface but also of the whole method of digital revivals at that time. Adobe Garamond was one of the ﬁrst of such revivals, so the <span class="caps">APHA</span> article is especially interesting as a critical response not only to Robert’s design but also to digital type in general. <br><br><i>The best design in your entire library? Kinesis <span class="caps">MM</span>.</i> <br><br>Yikes, something else that Hrant and I agree&nbsp;on.</p>
