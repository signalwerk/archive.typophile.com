    html: <p>I quite like Stempel Garamond, but it is not particularly accurate in the sense of being closely based on Claude Garamond’s types. It is more accurate than the large number of ‘Garamonds’ that are based on Granjon’s types, but that really isn’t saying much. The angularity is, as Thomas indicates, the feature of Stempel Garamond that is actually least like Garamond’s types. <br><br>Having spent several months with photographic enlargements of Garamond’s printed types stuck up around the studio while Ross was working on his 1530 Garamond, I know some things about them. Angular they&nbsp;ain’t.</p>
