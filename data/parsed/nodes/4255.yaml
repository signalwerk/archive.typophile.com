    html: '<p>I think “ﬂavor” isn’t about how angular or dynamic the letterforms might be, it’s maybe about how the letterforms -and their groupings- have <i>unexpected</i> features (even though I do agree with you when you imply that this reduces readability — but there’s much more to type design than readability). To be fair, Warnock does have a bit of this (it’s very clearly Slimbach’s best work), but all the other fonts Slimbach has ever made (with the possible exception of <span class="caps">ITC</span> Slimbach — a design that I think he should consider taking another look at, to see what he might have lost since making it), including Brioso*, are simply too polished** — not enough humanity in them, heck, not enough Robert Slimbach in them! Also, to me optical size extensions are a technical thing, not “ﬂavor”. <br><br>* Which furthermore suﬀers from being too much like Rialto. <br><br>** Something you must have noticed numerous people have against many Adobe fonts. <span class="caps">BTW</span>: The best design in your entire library? Kinesis <span class="caps">MM</span>. <br><br>Chris, look at the page range, dude.&nbsp;:-) <br>But basically the reviewer says the font doesn’t do the original justice. <br><br>hhp <br></p>'
