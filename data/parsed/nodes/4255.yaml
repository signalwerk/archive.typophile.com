    html: <p>Well, I’ll admit to knowing a fair bit about it, though I can’t comment on much of it. <br><br>The new Garamond is more closely modeled on historical masters, including having optical sizes. I don’t know whether Rob was inﬂuenced by or even aware of the critique in the <span class="caps">APHA</span> Journal (knowing him, I’d be inclined to guess not on both counts!), but I believe that every typeface he has done since 1991 has had optical size variants. <br><br>In the new Garamond, each optical size is a completely distinct. Combining that with the extensive multilingual support (<span class="caps">CE</span>, Greek and Cyrillic), and an extensive set of added typographic functionality, it is one of the most ambitious typefaces Rob has ever done. Personally, I also think it’s one of the best, from what I’ve seen so far. <br><br>Partly because it hews closer to the Garamond originals, and partly because Rob had diﬀerent objectives on this one, I think the new Garamond is also more “ﬂavorful” than Adobe Garamond (or Minion, for that matter). <br><br>On the side, I ﬁnd it interesting that some of the Typophiles on this board criticize Adobe Garamond and Minion for having insuﬃcient “ﬂavor” or distinctiveness. I subscribe to the “crystal goblet” theory of typography, which suggests that the goal of typography ought to be to show oﬀ and subtly enhance the message, without drawing attention to itself. I think workhorse typefaces like Minion and Adobe Garamond do that extremely well, while some of the typefaces that are put forward as superior alternatives have more ﬂavor, but as a result are simply not as versatile. <br><br>In my personal point of view, what will be really interesting to see in the new Garamond is how well Rob is able to make it more ﬂavorful without much reduction in versatility. <br><br>Rob’s recent work seems to me to explore the boundaries of the possibilities in ﬂavor versus versatility (kind of like a production possibilities frontier curve in economics). Good examples of pretty masterful stabs at this in his recent work are Warnock and Brioso. They take diﬀerent spots on the ﬂavor/versatility curve, but they both seem to me to be pretty much at the maximum bounds for combining the two. That is, neither could have more of one without a reduction in the other. <br><br>Regards, <br><br>T</p>
