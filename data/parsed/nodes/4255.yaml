    html: <p>Chris, <br>First, anyone who says they haven’t read Harry Potter is either lying or an over-the-top religious fanatic. Secondly, Adobe Garamond is a very readable, workhorse of a font family and I have great respect for it. My downfall in typography is that, currently, I prefer types with some quirkiness which, I’ll admit, is not preferable in book typography. Adobe Garamond is kind of vanilla to me, but that is probably one of its greates attributes according to the “crystal goblet” theory (you’re right Mr. Phinney). <br><br>Mr. Phinney, thanks for the teaser. I have great respect for Mr. Slimbach and his work — I wouldn’t expect my opinion to mean a hill of beans to him. Jenson and Warnock are two of my favorites along with Cronos, which I think is a beautiful humanist sans. Much of the feeling about Garamond and Minion may be due to their frequent appearance in books, magazines, annual reports, ads, and so on and so forth, but that probably only reinforces how usable they are. I certainly look forward to the new Garamond — that’s why I started this thread. <br><br>Thanks, <br>Addison</p>
