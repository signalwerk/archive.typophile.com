    html: '<p>Hrant wrote: <br><br>“From what I know, Slimbach was not only aware of the <span class="caps">APHA</span> review, but it actually aﬀected him deeply, and directly motivated him to start working on an improved interpretation.” <br><br>I ﬁnally got around to talking to Rob about this today. He says it only “aﬀected him deeply” to the extent that it irked him. He mostly paid attention to the criticism of the lack of optical size, and that was something that he was already aware of and had been continuing to do more with in his newer designs. <br><br>If one looks at the chronology, in 1989 Adobe Garamond was released. It included a set of titling caps. In 1991, Minion was released, including a full “display” font. At the same time, Minion <span class="caps">MM</span> was under development, which further extended the optical sizes to cover everything in the typeface from 6 pt to 72 pt. <br><br>I’m not sure if Minion <span class="caps">MM</span> had shipped yet, but this was the context in which Robert read Argetsinger’s review, which appears to have come out in early 1992. So from Rob’s point of view, it was just jumping on the bandwagon of what was already happening in Rob’s design in the intervening several years since Adobe Garamond had come out. There were no new insights for him. <br><br>Robert does acknowledge a major outside inﬂuence on his new Garamond, but it’s not that article. Instead, it’s an optical size experiment Stephen Harvard put together in 1989. Harvard was on the Adobe type review board at the time, and was a big Garamond fan. He did an experiment with a lower-case Garamond “a” interpolating from a small size to a display size. Rob thought this was very interesting. But the temporal and technical constraints Rob was working with made it impractical to do anything with this idea at the time. <br><br>Regards, <br><br>T</p>'
    html_clean: '<p>Hrant wrote: <br><br>“From what I know, Slimbach was not only aware of the <span class="caps">APHA</span> review, but it actually aﬀected him deeply, and directly motivated him to start working on an improved interpretation.” <br><br>I ﬁnally got around to talking to Rob about this today. He says it only “aﬀected him deeply” to the extent that it irked him. He mostly paid attention to the criticism of the lack of optical size, and that was something that he was already aware of and had been continuing to do more with in his newer designs. <br><br>If one looks at the chronology, in 1989 Adobe Garamond was released. It included a set of titling caps. In 1991, Minion was released, including a full “display” font. At the same time, Minion <span class="caps">MM</span> was under development, which further extended the optical sizes to cover everything in the typeface from 6 pt to 72 pt. <br><br>I’m not sure if Minion <span class="caps">MM</span> had shipped yet, but this was the context in which Robert read Argetsinger’s review, which appears to have come out in early 1992. So from Rob’s point of view, it was just jumping on the bandwagon of what was already happening in Rob’s design in the intervening several years since Adobe Garamond had come out. There were no new insights for him. <br><br>Robert does acknowledge a major outside inﬂuence on his new Garamond, but it’s not that article. Instead, it’s an optical size experiment Stephen Harvard put together in 1989. Harvard was on the Adobe type review board at the time, and was a big Garamond fan. He did an experiment with a lower-case Garamond “a” interpolating from a small size to a display size. Rob thought this was very interesting. But the temporal and technical constraints Rob was working with made it impractical to do anything with this idea at the time. <br><br>Regards, <br><br>T</p>'
