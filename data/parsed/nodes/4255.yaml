    html: <p>Victor, <br>If you want more on Slimbach’s new Garamond, here’s this <a href="http://typographi.ca/000486.php#000486" target="_blank">link</a> from Typographi.ca, but I don’t know anything else. I was hoping someone else would… <br><br>Hrant, <br>I’ll admit that Adobe Garamond is a well-made font family, but I’ve always thought it was kind of, well, plain (I don’t know what problems <span class="caps">APHA</span> found). Stempel Garamond has more character in my opinion, which I know can be a bad thing in some cases. George Abram’s Augereau—which I like—was missed by many, but when the digital version came out, I never heard a peep. I also thought Tiro’s Garamond was nice, but I never heard much about it either. I wonder how this one will be&nbsp;received…</p>
