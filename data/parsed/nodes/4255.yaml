    html: <p>You’re honestly comparing the breadth and depth of Argetsinger’s piece with Kelly’s? <br><br>&gt; Adobe Garamond is the most accurate derivation of Claude Garamond’s types done to date <br><br>1) One could say that’s not saying much… <br>2) What does “accurate” really mean? I have to wonder if Kelly really knew the ﬁeld, either in terms of what Garamonds have been made and what “accuracy” in type design really can be. Like what about Stempel Garamond? Wouldn’t you say that the “roughness” in the Stempel makes it more authentic = accurate? <br><br>I think Slimbach’s eﬀorts towards making a “real” digital Garamond are highly commendable. I just hope he can tame the Northern California disease of “cuteness” in the process, otherwise we’ll just end up with a fancier version of the current Adobe Garamond. <br><br>hhp <br></p>
