    html: '<p>From what I know, Slimbach was not only aware of the <span class="caps">APHA</span> review, but it actually aﬀected him deeply, and directly motivated him to start working on an improved interpretation. As for casting him as some sort of hermit who doesn’t pay attention to what’s going on outside: yes, he virtually never shares any of his insight, but many (maybe most) of his designs are clearly based -even motivated- by what <i>other people</i> have thought and felt. “Dzour nsdink, shidag khosink” — let’s sit crooked but talk straight. <br><br>The Crystal Goblet business: I think it should be pretty obvious by now that -at least in this dimension- Warde was being a cheerleader for Morison’s blind ideology. There can be no crystal goblet as long as a human being is involved in the making of something. And there <i>should</i> be no crystal goblet as long as the point of making something is other humans. <br><br>That said, I do agree that versatility and individuality are largely opposed, and Slimbach has often struck the balance well. But not any more. At the moment, and for the forseeable future, we simply don’t need any more blandness, please. <br><br>hhp <br></p>'
