    html: <p>Thanks for asking him directly. <br><br>&gt; [Harvard] did an experiment with a lower-case Garamond <br>&gt; “a” interpolating from a small size to a display size.  <br><br>Bridget Lynn Johnson did that two years prior. In fact she analyzed a number of characters and even came up with an interpolation formula! The formula is linear, however, which tells me ol’ Garamont was good at optical scaling, but not exceptionally so. Look to the <span class="caps">ATF</span> boys (they were engineers) for the pinnacle in optical scaling. <br><br><span class="caps">BTW</span>, I’d still love to see Harvard’s work too — if you can dig that up that would be super. <br><br>hhp <br></p>
