    html: |-
      <blockquote><p>IPA Extensions [...] What is it, and how do you insert one into a font?</p></blockquote>
      <p>On a mac, you can see them with the character viewer; they start at U+0250.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/ipa_6738.png"></div><br>
      If you have just a few to put  in some short text, you can just click on them in the viewer, like here on the script g, and it gets inserted at the cursor position. If you already have a text file, you can apply a global substitution. <p></p>
      <p>That is sufficient to get a text to print, but not good to search with the Acrobat reader; if you search for "narrow", it won't find it because the a was replaced with some other character. To get a searchable text, you need a properly designed font.</p>
      <p>I have never drawn a single glyph to my satisfaction, that's why I look only at fonts that already contain the shapes I want. Once they are drawn, all you have to do is to use some font editor to add properly named copies of the glyphs you want to use, and opentype substitution tables, to get a working font that gives you the desired shape when you type and that produces searchable texts. Such a font will work with so called "Opentype savvy" applications, like Adobe InDesign.</p>
      <p>I should mention that there is a way to proceed without touching at the font (if the EULA does not allow modification). You need only  design a keyboard layout that will give you the character U+0251 when you type "a" and U+0261 when you type "g" (there are tools for that). To search the pdf, you then need to use that very same keyboard layout.</p>
