    <p>Hi all,<br>
    I noticed this unusual font used in the body text of a book published in the UK. It's a serif font with a single-story lowercase "a." The closest thing I can find is Stone Informal, but that's still not quite it; the lower-case "t" is different, the capital "T" is very different, and the descenders aren't as hooked.<br>
    Here's a link:<br><a href="http://lalenafisher.com/hidden_design_page.html">http://lalenafisher.com/hidden_design_page.html</a><br>
    It's just for fun, not an urgent need for a job or anything.<br>
    Thanks!</p>
