    html: |-
      <p>"What's an "album"?</p>
      <p>For those young enough to be in Aluminum's generation:<br>
      An album is the original name for a collection of 78 rpm records by a given artist released at the same time.  At first,  This was an album book with each page turn yielding a different disk.  A few years later when 33 1/3 became a normal speed, an album containing 4 disks would now fit on one 33 1/3 disk.  Even though the larger disk was a single piece of vinyl, it kept the name "Album".  A typical album had about 16 songs.  There were also "Double albums" like the Beatles "White Album" which contained 2 disks.  After the CD came out and single release songs were not sold anymore, the name album gave way to the name "CD".  Album cover became CD cover.  Now that it is all digital online sales they will most likely fade into a new name.</p>
    html_clean: |-
