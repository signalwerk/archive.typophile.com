      <p>Hrant: <em>…the only explanation for this is that they weren't paying attention to what users might prefer.</em></p>
      <p>In a way, yes, but through inexperience rather than willful ignorance or self-indulgence.<br>
      As Chris noted, this is a general problem with professionalism, with the emphasis on “general”.<br>
      One is taught general principles and standard procedures, with the focus on certain major and prestigious areas of design. But in the workaday world these standards have to be fine-tuned to particular markets and user groups, and if these are niches such as book jacket design, no matter how good a designer you are, you will be out of your depth at first. </p>
      <p>The publisher shares some responsibility for the cock-up, Frode, because the design process is a synergistic relationship involving client and supplier.</p>
      <p>When I was designing covers for a small indie publisher, he would always mock up a dummy book with the cover design, place it on a typical store bookshelf, and view it in a walk-by. For this client, I would usually prepare two or three options.</p>
      <p>I never attended the executive meetings at Harlequin in which covers were vetted, but my CD told me that the panel would look at each cover for a split second before giving it the yay or nay -- brutal, no time for creatives' rationalizations. For that client, I would prepare sometimes dozens of options.</p>
