      <p>I looked for 'funny serif' with a straight 'y' and found a couple that were not exact, but might be close enough: <a href="http://new.myfonts.com/fonts/typadelic/tweedledee/" rel="nofollow">Tweedledee</a> from Typadelic; and <a href="http://new.myfonts.com/fonts/hvdfonts/grandma/" rel="nofollow">Grandma</a> from HVD Fonts.</p>
