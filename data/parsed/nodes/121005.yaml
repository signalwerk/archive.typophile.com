    html: |-
      <p>You have to use glyph names, not literal characters. In the case of some glyphs, these happen to be the same (A, B, C, a, b, c, etc.), but most glyphs names are not the same as the literal character that you type (e.g., numbers). The other thing is that glyph names may not start with a number (e.g., A1 is allowed, 1A is not).</p>
      <p>There are also conventions and recommendations for naming glyphs. You don't have to follow them, but it's usually best unless you have a good reason not to. It can make a difference when, for example, making a PDF that uses your font.</p>
      <p>Guidelines here (see section 6): <a href="http://sourceforge.net/adobe/aglfn/wiki/AGL%20Specification/" title="http://sourceforge.net/adobe/aglfn/wiki/AGL%20Specification/">http://sourceforge.net/adobe/aglfn/wiki/AGL%20Specification/</a></p>
