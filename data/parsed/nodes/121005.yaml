  html: |-
    <p>I figured this one out by messing around and realizing my stupid mistake. </p>
    <p>When working with automatic ligatures I tried doing:</p>
    <p>sub 4 5 by 45 ;</p>
    <p>This caused error. When my dumb self realized the numbers went as: one, two, three, etc. I tried to do:</p>
    <p>sub four five by 45 ;</p>
    <p>Still error. So I did:</p>
    <p>sub four five by E45;</p>
    <p>And it worked. So my basic question is: Why does Font Lab ligature code not like numbers?</p>
  html_clean: |-
    <p>I figured this one out by messing around and realizing my stupid mistake. </p>
    <p>When working with automatic ligatures I tried doing:</p>
    <p>sub 4 5 by 45 ;</p>
    <p>This caused error. When my dumb self realized the numbers went as: one, two, three, etc. I tried to do:</p>
    <p>sub four five by 45 ;</p>
    <p>Still error. So I did:</p>
    <p>sub four five by E45;</p>
    <p>And it worked. So my basic question is: Why does Font Lab ligature code not like numbers?</p>
