      <p>Jonathan, thanks for your comments - really just confirming niggles that I already had. I have completely redrawn the bowl and counter of the d, as this was actually traced from my initial sketches, and somehow I just hadn't captured the curves the way I wanted. The trailing diagonal of the v has been beefed up, the s smoothed out, slimmed down, and reduced contrast, and the curves on the h bought into line with those on the n... Hopefully this is more pleasing overall - I wanted to get these characters more or less right before I compounded my problems by drawing the rest of the alphabet!</p>
