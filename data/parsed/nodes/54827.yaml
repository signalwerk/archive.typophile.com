    html: |-
      <p>I have to smile... it's like quicksand. The further you go into it, the more of a predicament you can find yourself in! I hope the 70's connotations aren't along the lines of Boogie Nights! I've been looking at this too long today, and have lost the plot a bit... I can see the s is too expanded, and the v trailing diagonal is too light, but thought I would just put it here for a while and see what I think about it in a day or so when my eyes have relaxed.</p>
      <p>This is really a book cut I guess, but perhaps the shapes add more (too much?) personality at larger sizes.</p>
      <p>At smaller sizes, the hump of the n, h etc should mellow out optically making it appear more square at text sizes, which is why I haven't added any traps in the arch/ascender joints.</p>
      <p>Steve</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/dawn_6701.png"></div><p></p>
