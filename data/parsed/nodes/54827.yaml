      <p>This is looking good. My comments are all on how the letters work with each other (i.e. some elements in some of the letters make them feel like they're not necessarily part of the same typeface).</p>
      <p>• The "s" -- maybe the top and bottom should be rounded a little more. I think the s might be a little wide.</p>
      <p>• the curves in the d where the bowl meets the stem seem out of place with the curves in the other letters</p>
      <p>•&nbsp;the curve in the n is nicer than the curve in the h</p>
