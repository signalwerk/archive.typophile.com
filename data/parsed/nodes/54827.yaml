      <p>Thanks peeps... Believe me, I'm having a real confidence crisis (must be turning 40 that does it)... Waiting with baited breath for the brickbats to come, so I was encouraged by your comments. I've been working on my handgloves today, but really want to get the e and s finished before I post it up again, as it looks a bit odd with the v on the end. The g was really fun!</p>
      <p>Thanks for the comments on the widths. I was really trying to maintain colour, but the a was a bit wide, you're right. This has now been sorted, along with several other changes. When I mentioned to a friend today that I was really excited about designing a typeface, you can imagine the reaction. Hopefully this means I'm now a typophile :)</p>
