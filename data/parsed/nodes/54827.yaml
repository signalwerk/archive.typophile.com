    html: |-
      <p>Hi Steve, this could turn out quite interesting I think, definitely worth keeping going with it. The g is fun.</p>
      <p>I think there are elements slightly fighting each other. You have a soft round terminal on the tail of the g, but square ones on e and s. Your h and n are quite round on the arch, but the a seems a bit flattened off. Once you decide which parts to harmonise, drawing the other letters should be a bit easier. I wonder if you might make the horizontal serifs a little shallower? I think the thin stroke on v is still too thin, next to that o. s might be better with the northwestern curve taken in a bit. g might be a bit light?</p>
      <p>Hope that's a bit helpful :)</p>
