      <p>Steve, thanks for the bump, I was meaning to comment but forgot.<br>
      (Please remember the salt; you know I'm just a beginner at this.)</p>
      <p>The serif shape on this reminds me a lot of an initial design one girl in my type design class proposed. The advice she was given by our teachers – which may also apply here – is that with small and thick serifs like that,* you can't go very small before they stop looking like serifs, and start looking like strangely clogging terminals (did you notice any of that when checking it at different sizes?). That shouldn't really be an issue for display though I guess.<br>
      * In fact, hers were even shorter and thicker IIRC, so there may not be too much of that danger here.</p>
      <p>Also, I'm wondering if the "a" is wide compared to the "h" and "n"; it may help to do an "o" first to get a sound concept of the width proportions of the straighter and rounder forms. (And/or to look at manymany other fonts &amp; compare how they handle the proportions.)</p>
      <p>Please do not give up! I think it looks really interesting, and I'll be curious to see how this progresses.</p>
