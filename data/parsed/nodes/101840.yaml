    html: '<p>Aviva: most probably a custom job (and a bad one if you want my opinion), a generic sans with serifs manually added. <a class="freelinking external" href="http://www.myfonts.com/fonts/itf-alanmeeks/astoria" rel="nofollow">Astoria</a> is in the same vein.</p>'
    html_clean: '<p>Aviva: most probably a custom job (and a bad one if you want my opinion), a generic sans with serifs manually added. <a class="freelinking external link-external" href="http://www.myfonts.com/fonts/itf-alanmeeks/astoria" rel="nofollow">Astoria</a> is in the same vein.</p>'
  - id: 549082
    user: 22675
    date: 2013-03-31T02:33:00
    date_raw: 31 Mar 2013 — 2:33am
    votes: null
    html: "<p>NOVA: can't find a perfect match. <a class=\"freelinking external\" href=\"http://www.myfonts.com/fonts/typodermic/neuropolitical\" rel=\"nofollow\">Neuropolitical</a> matches almost everything but /N and /O are less extended (easy to fix for /O, less for /N). Some more similars (need customization rounding some corners, cutting some finials, extending some crossbars or redrawing some glyphs from others): <a class=\"freelinking external\" href=\"http://www.myfonts.com/fonts/marksimonson/changeling-neo\" rel=\"nofollow\">Changelling Neo</a> (bowlers off), <a class=\"freelinking external\" href=\"http://www.myfonts.com/fonts/cheapprofonts/bitsumishi-pro-v2\" rel=\"nofollow\">Bitsumishi</a> (best /O but rest is way off), <a class=\"freelinking external\" href=\"http://www.myfonts.com/fonts/typodermic/neuropol-x\" rel=\"nofollow\">Neuropol X</a> (/O off, cutting some finials), <a class=\"freelinking external\" href=\"http://www.myfonts.com/fonts/typodermic/pirulen\" rel=\"nofollow\">Pirulen</a> (nice base but needs many tweakings), <a class=\"freelinking external\" href=\"http://www.myfonts.com/fonts/typodermic/good-times\" rel=\"nofollow\">Good Times</a> (very close but /O off), <a class=\"freelinking external\" href=\"http://www.myfonts.com/fonts/flat-it/stereo-gothic\" rel=\"nofollow\">Stereo Gothic</a>, <a class=\"freelinking external\" href=\"http://www.myfonts.com/fonts/typodermic/sui-generis\" rel=\"nofollow\">Sui Generis</a></p>"
    html_clean: "<p>NOVA: can't find a perfect match. <a class=\"freelinking external link-external\" href=\"http://www.myfonts.com/fonts/typodermic/neuropolitical\" rel=\"nofollow\">Neuropolitical</a> matches almost everything but /N and /O are less extended (easy to fix for /O, less for /N). Some more similars (need customization rounding some corners, cutting some finials, extending some crossbars or redrawing some glyphs from others): <a class=\"freelinking external link-external\" href=\"http://www.myfonts.com/fonts/marksimonson/changeling-neo\" rel=\"nofollow\">Changelling Neo</a> (bowlers off), <a class=\"freelinking external link-external\" href=\"http://www.myfonts.com/fonts/cheapprofonts/bitsumishi-pro-v2\" rel=\"nofollow\">Bitsumishi</a> (best /O but rest is way off), <a class=\"freelinking external link-external\" href=\"http://www.myfonts.com/fonts/typodermic/neuropol-x\" rel=\"nofollow\">Neuropol X</a> (/O off, cutting some finials), <a class=\"freelinking external link-external\" href=\"http://www.myfonts.com/fonts/typodermic/pirulen\" rel=\"nofollow\">Pirulen</a> (nice base but needs many tweakings), <a class=\"freelinking external link-external\" href=\"http://www.myfonts.com/fonts/typodermic/good-times\" rel=\"nofollow\">Good Times</a> (very close but /O off), <a class=\"freelinking external link-external\" href=\"http://www.myfonts.com/fonts/flat-it/stereo-gothic\" rel=\"nofollow\">Stereo Gothic</a>, <a class=\"freelinking external link-external\" href=\"http://www.myfonts.com/fonts/typodermic/sui-generis\" rel=\"nofollow\">Sui Generis</a></p>"
