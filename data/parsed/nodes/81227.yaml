      <p>Your survey is full of suggestive questions, limited answer-sets, and radical ideology.</p>
      <p>I am sure that you will gain no insight what so ever. Even if you do not aim on that, and just want to use it for ideology purposes, the questionary is so obviously flawed, that it will only backfire.</p>
      <p>I don't think, I really could make you understand, but... forget for a moment everything what you thought to be true. Look at some facts.</p>
      <p>This is <a class="freelinking external" href="http://en.wikipedia.org/wiki/File:Map-world-teenage-biological-mothers2002.svg" rel="nofollow">a world map for teenage pregnancy</a>. It clearly shows the US has a significant higher percentage than other developed countries. </p>
      <p>What could the reason for that be?<br>
      Teenage pregnancy is a problem of information and education that sex is ok, if one has respect for oneself and for the other. Teenagers are way more capable of making responsible decisions, than one might think. This kind of eduction would not be primarily focused on STDs and abstinence, just to scare teens off, like it happens in places in the US.</p>
      <p>The norms of a society majorly influence teenage pregnancy. </p>
      <p>Compare the high values of teen pregnancy with high age of consent by law in the US and in <a class="freelinking external" href="http://commons.wikimedia.org/wiki/File:Age_of_Consent.png" rel="nofollow">northern and western European countries</a>. There is a negative correlation. Why? because law is just the normative formulation of the moral values of a society. Compare as well for example with this <a class="freelinking external" href="http://commons.wikimedia.org/wiki/File:Atheists_Agnostics_Zuckerman_en.svg" rel="nofollow">map about atheists</a>.</p>
      <p>Another part of the story is of course economically as well. To highlight this one could take a look at this map of <a class="freelinking external" href="http://en.wikipedia.org/wiki/File:Gini_Coefficient_World_CIA_Report_2009.png" rel="nofollow">global inequality of wealth per country. low value is a more equal society.</a></p>
