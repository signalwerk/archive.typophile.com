      <p>I don't know what the actual hypothesis you are trying to investigate is, so some of my comments might be off base, but here are a few things for you to consider.</p>
      <p>With respect to questions 2 and 3, I don't really see how people's responses here could possibly be interesting or informative. I can't figure out what type of investigation would actually care whether people know or don't know the specific numeric values which you give; I <em> can </em> see one trying to establish whether people's assessment of the prevalence of teen pregnancy is accurate, and whether their views on this matter correlate with attitudes towards teen pregnancy, but asking a question about raw numbers won't achieve this. Unless you have some way of establishing whether your respondents have a reasonably accurate view of the *size* of the relevant demographic, I don't see how you could possibly interpret their responses. Also, it's somewhat odd that in Q3 the entire range of 100 000–200 000 is omitted from your set of answers.</p>
      <p>Also, bear in mind that when you start posting your survey on forums such as this one, you are appealing to an international audience. Most non-Americans have no real reason to know stats on teen pregnancy in the USA (you might perhaps want to reconsider some of Té Rowan's comments in this light -- he's posting from Iceland).</p>
      <p>Question 4 and 5, though, are where the real problems lie. In question (4) you ask for reasons why teens have sex, but some of your answers seem to be more appropriate for a question regarding why teens get pregnant. 'Rape' and 'Taught abstinence Only' do not make sense to me as reasons why people have sex, though they might be reasons why they get pregnant. 'Lack of Education' only makes sense as an answer to this question if you are making the implicit assumption that teen sex is somehow bad and that only those who don't know better would do it. I can't help wondering whether you haven't inadvertently conflated two different questions here.</p>
      <p>Putting that aside and assuming you really are asking about sex rather than pregnancy, your answer set is simply strange in terms of what it omits. Adults have sex for a wide variety of reasons including, among others, the fact that it is enjoyable, the fact that it can strengthen social bonds, and the simple fact that human beings have biological urges. Yet you omit all of these as possible answers suggesting that teens have sex for entirely different reasons than adults.</p>
      <p>Now it's possible that this is the case, and perhaps you do believe this, but if you want to make some claim regarding why teens have sex, you cannot build this assumption into your answer set. The majority of your answers seem to presuppose that teens don't have an inherent desire for sex, but rather have this imposed on them by outside factors. Once again, it is possible that this is the case (or is the case in some instances), but if you limit your answer set to possibilities which make this assumption you are not going to get meaningful results (and of course, even if you did include a wider range of possibilities, establishing why people *think* teens have sex cannot be used to argue for why teens *actually* have sex which is, most likely, fairly heterogeneous anyways).</p>
      <p>Question 5 is poorly constructed since it isn't clear whether you are talking about preventing teen pregnancy or preventing *unwanted* teen pregnance -- two entirely different issues. Also, given the weird blend of responses in question 4 which appear to conflate sex and pregnancy, I also find myself with a lingering worry that you are doing the same thing here and contemplating ways of preventing *sex* rather than pregnancy (at least for the answers 2, 3 and 5).</p>
      <p>Also, use of contraceptives and abstinence fall into an entirely different category than education through parents, schools, or after-school programs. It's not clear that they really belong in the same answer set.</p>
      <p>Moreover, your educational options are overly vague. You give, for example, the possible answer 'parents talking to their kids'. Talking about what? Contraception? Eternal Damnation? These answers really should be made more precise or you will not have any way of determining exactly how your respondents were interpreting these.</p>
      <p>Finally, I think you'd get considerably better data if you asked about a more narrowly defined demographic than 'teen' -- after all, this would include middle schoolers, high schoolers, as well as many college freshmen and sophomores. I think you'll find that people's attitudes towards sex are *very* different for these three demographics.</p>
      <p>André</p>
