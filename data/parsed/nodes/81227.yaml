      <p>I assume your attempt is sincere and I actually don't mind a completely different opinion, as long as the research that forms that opinion follows some rules of deduction. My problem is, that your attempt to research fails any criteria that would be somehow scientific. </p>
      <p>I send you some articles of scientific journals on the topic, you can do your own research if you want to. If previous research would answer the current research question, then the current research question would not be necessary. Previews findings are important to understand a topic and to know which questions one need to ask in the first place to get new information. </p>
      <p>These four papers are highly relevant, as they will show important factors of teenage pregnancy in western industrialized societies. They help you to establish which factors that can influence an outcome are constant throughout the research and which do variable. With this information you can ask yourself why is your case different? What is the same and what is different in your case, than in other cases? There lies the key to the question about what ever you want to find out. As you can not experiment with society at large, you can only compare and try eliminate factors that do not have an influence. </p>
      <p>These papers as I said will help you to design the questionnaire in a better way. </p>
      <p>To your questionnaire, if you want to discuss it here, we can, but the content should rather be discussed in a social science related environment, rather than a graphic design. </p>
      <p>if you want me to really help me, then you can write what you actually want to find out with each question, which information do you want to get from your sample of interviewees?</p>
