      <p>John&gt;What thread is that, David?<br>
      lol. . . I'm sorry, were you trying to make a font family from a single master? </p>
      <p>If you were looking for graphic images of text for design work, as you show, you perfectly well can feed a single master into the web's 'font software' and get a family of weights, (and a grunge style of two), somewhere in the output. My pardons if that was the intent. </p>
      <p>Furthermore, I'd support convincing someone to make something — a browser, OS subsystem, or page descriptor, that could... uncontrollably auto-oblique all the web type for some users. Then the web could 'give us' a full family of weights with italic and grunge from a single style.</p>
      <p>But seriously, with formatting, font identification, selection of style, sizing, scaling, and rendering relatively consistent in print, I think we're seeing the effects of making all this 'different', and each different in its own unique way, on the web.</p>
      <p>Granted, the web and print are "two completely different things", but the 2d web needs to be a lot like 2d print, so often. I don't think 2d web design can be 10x the complexity of 2d print design as a result of this kind of 'different'. </p>
      <p>Nor do I think quality web typography can be 10x the complexity of quality print typography. </p>
      <p>Place Chinese proverb here.</p>
      <p>Cheers!</p>
