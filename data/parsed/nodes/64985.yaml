      <p>You should make a clear distinction between typefaces and fonts.<br>
      And address the issue of the relationship between web fonts and screen fonts.</p>
      <p>A typeface is a general, fairly abstract design that may exist in different physical manifestations (fonts), for use in different output situations.</p>
      <p>Thus, a typeface may be nuanced as more than one font, for use at different sizes in the same document ("text" and "display"), or for different media (e.g. smooth or glossy paper) in the same printing process. See H&amp;JF's "grading".</p>
      <p>Garamond, for instance, has been adapted from letterpress fonts, to phototype (ITC Garamond), to low-res LaserWriter output (Adobe Garamond). Which of those will the best web Garamond font be like?</p>
      <p>Typefaces may be adapted for radically different media: hinting is one thing that accomplishes this in the digital realm.</p>
      <p>One thing about typeface design is that the old styles have persisted across media changes, why should that change with the Web?</p>
      <p>Large x-heights and open counters are not a necessary characterisitic of screen typefaces.<br>
      Why would a good screen typeface not vary x-height and counter size with pixel resolution, exactly in the manner of an optically-scaled print typeface?!</p>
      <p>Look at how clumsy Verdana and Georgia become on screen at larger sizes.</p>
      <p>Having said that, there <em>are</em> type design issues which are screen-specific. But that's getting into the relationship between sub-pixel hinting and curve shape. You can see this happening in the ClearType faces.</p>
