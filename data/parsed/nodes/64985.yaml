      <p>With all due respect I reject the biological analogy because there is a common biological entity at the end of both print and web processes. The different expectations of text and display, by that common biological entity, are congruent across media. E.G. (as Nick says sorta), differences you site like openness, are in a spectrum, i.e. the font desired by the person at 9 point for print, is "the same as" what the person wants for 13 point on the screen. </p>
      <p>The biological entity is "only human" though so you can't trust it. E.G. there is a thread here where a type designer outputs a font in 7 different renderings and then picks the lightest and blackest as his 1st and 2nd choices, leaving others to wonder what the heck he's thinking about criteria-wise. ;)</p>
      <p>Cheers!</p>
