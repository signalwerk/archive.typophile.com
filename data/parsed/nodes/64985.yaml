      <p>If you are only interested in @font-face-based options, you might specify that at the top of your page. Other models are going to be equally prevalent for various licensing and display purposes. @font-face is a part of the picture, so it seems inaccurate to describe this subset of web font technologies as "Web Fonts" or even "web-native" fonts. Many commercial and proprietary fonts will be engineered for native web use as well. </p>
      <p>Our previous model for web-readiness of fonts was the system fonts that come with PCs. Those, rather than the primitive early designs from Emigre, set a benchmark, and satisfy the most important criteria for robust web display.</p>
      <p>Openness and speed in the context of fonts should also refer to fonts' technical abilities to download and display quickly and well on any device. Fonts won't perform, and therefore can't be considered web-native, if they aren't also built intentionally for the low-res media of web/mobile devices. So consider adding a third trait: web-native engineering. Unhinted TTFs, however free, open, or distributable, aren't likely to gain wide acceptance on the web if they look like hell. There have already been missteps in this area. A permissive license doesn't preclude a font from failing in this new medium.</p>
      <p>I wonder if you can tighten up some of your language. "the thin and thick parts of the letterforms ... should be close." This implies they are close in proximity. You might say about letterforms that web fonts should be low-contrast or that their hairlines should be thicker than those of ordinary print fonts. I would also suggest calling the enhanced visual quality "readability" rather than "scannability", since the reality is that web fonts are going to be part of increased screen reading.</p>
      <p>Consider other possible licensing models for web-native fonts. Plenty of marketing occurs, and will increasingly occur online, that depends on specific, exclusive fonts as part of brands and campaigns. The Guardian, New York Times, GE, and other entities want to communicate broadly and well, without freely sharing design assets that can be re-used by others. Facility in delivering web pages or other digital content in design-specific fonts isn't necessarily linked to free distribution, reproduction or remixing.</p>
      <p>I might be misinterpreting some of what you have said, but I think you could be more specific about just what sorts of fonts you are discussing.</p>
