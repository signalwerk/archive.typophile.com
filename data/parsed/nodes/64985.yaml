    <p>As I mentioned at TypeCon this summer, I think web fonts are different creatures than desktop fonts (just as desktop fonts are different creatures from woodcut fonts). The Web is a different medium than print - as such some fonts work better with the medium than others.</p>
    <p>I wrote up a first pass at the broad characteristics of a font that make it work well on the Web, what I'm calling: 'web native' -<br>
    <a class="freelinking external" href="http://garrickvanburen.com/archive/web-fonts-identifying-a-new-species">Web Fonts – Identifying a New Species</a>. </p>
    <p>I've boiled it down to openness and speed-of-communication in both letterforms (large x-heights, open counters, etc) and licensing (OFL, MIT, etc).</p>
    <p>What have I missed?</p>
