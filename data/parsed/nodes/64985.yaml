      <p>@garrick</p>
      <p>Having had a few days to ponder:</p>
      <p>1) Not crazy about comingling the criteria of licenses PLUS the onscreen look of a font to pronounce it "Web Native".<br>
      Licenses are categorizable, so are fonts based on certain visual features. I think you *should* point out these distinctions on Kernest but independently of each other.</p>
      <p>2) Personally, I don't like the phrase "Web Native". Too ethereal for my taste. If you have to explain it - as you have done - then I would argue it doesn't mean anything because you have to explain it. But that's me.</p>
      <p>Plus, as you and I have discussed elsewhere, what happens when print stylesheets (and other @media categories) start getting used for serious publishing purposes (like Prince's HTML to PDF conversion stuff does now)?<br>
      Are the fonts we'll be looking to use in that context any less "web native" or are we going to label them as something else?</p>
      <p>It seems to me you're allowing the limitations of LCD displays to define that which is "web" and that which is not, now and forevermore.</p>
      <p>rich</p>
