  html: <p> Marwan, the "problem" with Arabic type is that it requires special software (because the scipt is r-to-l, and features all those wonderful contextual forms), and when you get the sw it comes with fonts... <br> <br>If you already have the software and you want more fonts, one good place to look is Linotype Library. <br> <br>hhp </p>
