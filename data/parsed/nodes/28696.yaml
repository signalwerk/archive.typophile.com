      <p>Well miss Giggles, at least all languages written with the latin, cirylic and greek alphabets are written from left to right. (This actually covers american and european continents as well as a significative amount of the african continent and oceania, also some places in asia).</p>
      <p>I can’t tell the reason for this but it makes sense if you write using your right hand because this way you don’t cover the las written words with your hand and you are not touching fresh ink.</p>
      <p>Héctor</p>
