    <p>how come all the earlier eras in typography from the Mesapotanians including hebrew script and egyptian heiroglyphs and arabic all wrote from right to left? was there a particular reason? there must be. who changed this habit and why and when (which century)?why do we write english left to right? how did all this change come about? chinese write from right to left too. where do they come into all this? i’d like to know if anyone has any answers. thanks.<br>
    PS how is French, Spanish, German etc written? what other languages still write right to left? i know Urdu (Pakistan) is still written right to left.</p>
