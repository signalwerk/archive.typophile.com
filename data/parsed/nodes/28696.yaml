      <p>boustrophedon |ˌboōstrəˈfēdn| adjective &amp; adverb (of written words) from right to left and from left to right in alternate lines. ORIGIN early 17th cent.: from Greek, literally ‘as an ox turns in plowing,’ from bous ‘ox’ + -strophos ‘turning.</p>
      <p>As far as I remember ‘ox(plow)turning’ used to be the norm for Greek for a fairly long time. Me thinks that the advent of more democratic writing materials (like ink and pen) made going left to right handier (most of mankind being righthanded) AND of course a lot easier to read (if I’m not mistaken the ‘returnline’ was being written with mirrored characters).</p>
    html_clean: |-
