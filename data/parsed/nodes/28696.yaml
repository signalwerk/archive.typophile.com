      <p>Virtually All are spoon-fed that the first Man on earth was not able to speak any language, but he was able to draw.<br>
      Is this logical? If so, then what was the tongue created for?</p>
      <p>Biologically, there is no difference between your tongue and my tongue.<br>
      All human tongue is the same?!<br>
      If you were born where I was born, your tongue would have been twisted to Arabic.<br>
      And if I was born where you were born, mine would have been twisted to English.</p>
      <p>So I can say, the First Man was able to communicate orally and in writing.<br>
      However there were 2 alternatives: left-to-right and right-to-left. (No more, no less). The proof is that who knows which leg goes first: Left or right?</p>
