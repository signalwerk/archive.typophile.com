      <p>I don’t know if anyone really answered the question posed regarding text direction, so here is what I learned:</p>
      <p>A long time ago, before pen and paper, people “wrote” using a hammer and a chisel (or spike). Just as now, most people then were right handed, they had to hammer using their dominant hand, holding the chisel or spike with the left hand. In this way, it is easier to etch or carve words, symbols, and hierogplyphs from the right to the left. </p>
      <p>This right to left approach was almost universal; even the Latins and Greeks started at the right (this was a VERY long time ago). When pens and papyrus/vellum came along, the Greeks innovated by going in both directions within the same text; that is, they started from the right, got to the end of a line and then started going back toward the right, and then back again in a zig-zag. The Latins felt this was just too much and they settled on the left to right method. </p>
      <p>In Asia, paper has been around for a very long time, as has ink; what came first, however, were turtle shells and bones upon which the ancient Chinese carved their earliest pictographs/ideograms. The nature of these materials (being thin) caused the writer to start carving at the top of the bone or shell and go to the bottom (this is a natural progression because of the height/width of Chinese characters). </p>
      <p>When the Chinese invented paper, they continued the practice of top to bottom writing; but why they started at the right of the page is beyond me. I suspect it was easier for them when using a bamboo brush and an inkstone. Other Asian nations, such as Japan and Korea, adopted Chinese characters long before they created their syllabaries, which is why they, too, wrote from top to bottom, right to left (though these practices are dying).</p>
      <p>I hope this explanation helps...</p>
