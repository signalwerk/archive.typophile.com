    <p>Ok, so, brilliant Typophiles, you’ve convinced me to invest in personal business cards. I believe my design is strong enough to warrant somehow finding the money for the custom die cut.  Plus, I figure if I have a card I truly love, it alone can boost my confidence enough to get it out there more often. </p>
    <p>So now I’m looking for the right vendor to produce the card.  I’ve never sourced a custom die cut with low price as a priority before.  Any advice?  Google hasn’t been very helpful thus far. </p>
    <p>AK</p>
    <p>PS In the spirit of sharing, here’s my favorite printer - they have this AMAZING new machine that can print on any substrate with extraordinary beyond-photographic quality (plastic, glass, cork, a door ...!) It uses UV curable inks, which makes it the most environmental printer in the country. Link: <a href="http://www.lightworksvt.com/green" title="http://www.lightworksvt.com/green">http://www.lightworksvt.com/green</a></p>
