    html: |-
      <p>&gt; Contemporary, but anything alluding to tracks or speed / movement without being cheesy!</p>
      <p>When you put ’4468’ on a locomotive that subsequently breaks the steam record the font has the value of speed attached to it regardless of whether it says speed or not.<br>
      </p><div class="imageWrap"><img src="/files/4468_4169.png"></div><p></p>
      <p>I think the same of Antique Olive Nord simply because of Air France’s livery applied to Concorde.<br>
      </p><div class="imageWrap"><img src="/files/AirFrance_5835.png"></div><p></p>
      <p>In both cases, speed is not inherently present in the design until the association has been forged.</p>
      <p>Looking for a speed or movement connotation might not be right?</p>
      <p>It all depends...</p>
