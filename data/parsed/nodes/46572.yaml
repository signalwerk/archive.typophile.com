    html: |-
      <p>Japenese marks remind me of logos rather than letters. I agree that they are beautiful, organic and very expressive. Have you thought about studying Japanese? Learning how to write this way will influence they way you look at your own writing and how you dot each “i” and cross each “t”. Japanese culture is quite amazing and the design coming from this part of the world is exploding. Have you seen the magazine IDEA or looked at the work of Tadanori Yokoo, <a href="https://web.archive.org/web/20080828053020/http://www.tadanoriyokoo.com/" title="http://www.tadanoriyokoo.com/">http://www.tadanoriyokoo.com/</a> You can see some of his stop animation (where he uses still imagery) to make videos, <a href="https://web.archive.org/web/20080828053020/http://www.youtube.com/watch?v=_wYALOq22QE" title="http://www.youtube.com/watch?v=_wYALOq22QE">http://www.youtube.com/watch?v=_wYALOq22QE</a>. </p>
      <p>I have this japanese poster hanging outside of my office (see below.) I was told it was a Japanese announcement for a Sumo Wrestling Tournament. The bigger the name means the bigger the Sumo wrestler. </p>
      <p>As you can see, I love Japanese design and think it is beautiful as well.</p>
      <p></p><div class="imageWrap"><img src="/web/20080828053020im_/http://www.typophile.com/files/sumotype_6364.jpg"></div><p></p>
