    html: <p>I agree. I love Japanese writing so much. I studied Japanese in high school for 2 years and it was so amazing to see how the formation of the characters are created. The only problem with Japanese writing is doing it correctly. There is a specific stroke order that the character is supposed to be written. That to me is the most difficult part of learning Japanese as well as learning all the characters. Learning Japanese does make you realize the beauty in creating fluid movement in whatever you create.</p>
