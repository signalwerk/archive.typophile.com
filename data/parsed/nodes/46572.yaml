  html: <p>I’ve always been intrigued by the way Kanji looks. I think that it is the utmost intelligent style of typography. Again, just like everything else, the Japanese out do the rest of the world in almost everything....Even in the culture’s most simplest form of communication, they make it beautiful... </p><div class="imageWrap"><img src="/web/20080828053020im_/http://www.typophile.com/files/images_3781.jpg"></div><p></p>
