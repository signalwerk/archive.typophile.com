  html: |-
    <p>Hi all, I’m working on a logo and looking for a font with a really small x-height. I started off with Bliss, but – concerns just one Dutch word in SC – it’s too dominant. Which is a pity, I like Bliss.<br>
    So it has to be a sans, otherwise I would have chosen Mrs Eaves Petit Caps, or something similar.</p>
    <p>Anybody got any suggestions?</p>
    <p>Thanks in advance, Brieck.</p>
