      580	YES	DejaVu LGC Sans Oblique
      637	YES	DejaVu LGC Sans Condensed Oblique
      703	YES	DejaVu LGC Sans Condensed Bold Oblique
      </pre><p>Those are all the fonts I have on 10.6 containing the winking face. If I set the default font in Firefox to Dejavu LGC Sans and override the font chosen by Typophile (Georgia), I see the winking face in Firefox on 10.6.8</p>
