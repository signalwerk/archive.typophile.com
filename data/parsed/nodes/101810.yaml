    html: |-
      <p>I say "hijack" because I think it's all hush-hush. Has Apple published the font spec for color bitmaps? And how could it be made to work on Windows? Without being sued?</p>
      <p>Performance: Back in the mid-90s I made the prototype of Mana-16, a bunch of tiny GIFs of grayscale letterforms coupled to a script that took a raw text file and generated an HTML file of hundreds of image declarations, thus rendering running text using grayscale bitmaps... The main performance problem was the size of the resultant HTML file! So an actual font was -and I suspect still must be- the only way to make this sing.</p>
      <p>But this is all probably pointless anyway. Text size is too variable these days. Hmmm, unless a hand-made grayscale (or even better, subpixel) bitmap font can be rendered by collaging small hand-made elements that can be slid around, scaled, layered, to produce a range of sizes from a single master set... Man, I really have to stop thinking like a hacker.</p>
      <p>hhp</p>
    html_clean: |-
