    votes: null
    html: <p>Because the emoji are part of Unicode anyone is free to make a distribute a Unicode encoded emoji font. Apple does have the only color Unicode encoded font as far as I'm aware, but Windows 8 (and Windows 7 via an update) have traditional monochrome support, as does Windows Phone, and there are probably others. Some apps, like the mail and messenger apps in Windows 8 will in some cases switch out the glyph for a color bitmap when they hit an emoji in a mail or message.</p>
    html_clean: <p>Because the emoji are part of Unicode anyone is free to make a distribute a Unicode encoded emoji font. Apple does have the only color Unicode encoded font as far as I'm aware, but Windows 8 (and Windows 7 via an update) have traditional monochrome support, as does Windows Phone, and there are probably others. Some apps, like the mail and messenger apps in Windows 8 will in some cases switch out the glyph for a color bitmap when they hit an emoji in a mail or message.</p>
