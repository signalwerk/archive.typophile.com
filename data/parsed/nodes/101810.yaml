      <p>How did I do that? I modified the system file <code>DefaultFontFallbacks.plist</code> and added <code> DejaVuLGCSans</code> (postscript name) in the fallback fonts for serif.</p>
      <p>The file is in this folder<br>
      /System/Library/Frameworks/ApplicationServices.framework/Versions/Current/Frameworks/Coretext.framework/versions/current/resources</p>
      <p>I had to reboot to get it working.</p>
      <p>Michel</p>
      <p>PS On 10.6.8 with the modified file <code>DefaultFontFallbacks.plist</code> the winking face also shows up in Firefox, without overriding Georgia, and in Google Chrome.<br>
       On 10.8.3, Google Chrome displays no winking face at all (colored or not).</p>
