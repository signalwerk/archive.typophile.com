      <p>On 10.6.8, the only font I have that contains emoticons is DejaVu Sans. You can easily see using the character viewer or Apple's ftxinstalledfonts</p>
      <pre>% ftxinstalledfonts -f -U 0x1F609 | grep YES
      56	YES	DejaVu LGC Sans Bold
      135	YES	DejaVu LGC Sans Condensed
      543	YES	DejaVu LGC Sans Condensed Bold
      572	YES	DejaVu LGC Sans Bold Oblique
