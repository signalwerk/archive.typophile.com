    <p>Ladies and Gentlemen, </p>
    <p>Recently I discovered a typeface preferred by my great grandfather circa 1924-1925. My great grandfather utilized this typeface throughout his life as the identity for his business. Can anyone assist with it's identification or nearest modern day typeface that comes closest? </p>
    <p>Thanks in advance...</p><div class="imageWrap"><img src="http://typophile.com/files/1_5561.png"></div><div class="imageWrap"><img src="http://typophile.com/files/2_5237.png"></div><p></p>
