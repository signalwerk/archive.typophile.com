      <p>the logo feels old/dated. if that's what you're going for...nailed it.</p>
      <p>any particular reason you feel the need to make a logo out of your initials? While it's not such a bad idea - as a design exercise - my thoughts are you'll communicate more clearly...with letters as they are, and more memorably...with something unique.</p>
