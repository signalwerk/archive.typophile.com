      <p>As someone else said once about one of my logos - "it's nice, but it lacks the AHA moment", i.e. it is forgettable. Yours is a nice geometrical approach to combining 3 letters, but that is all there is to it. </p>
      <p>Have a look, for example, to <a href="http://typophile.com/files/pictures/picture-2664.jpg" rel="nofollow">Ty Wilkins</a> logo. Or better yet, skim through <a href="http://www.helveticbrands.ch/blog/100_Brands_of_Interest" rel="nofollow">this</a>, <a ii="" rel="nofollow">this</a> and <a href="http://www.helveticbrands.ch/blog/100brands3" rel="nofollow">this</a>. There is plenty of letters only logos on these lists.</p>
