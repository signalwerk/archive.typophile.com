    html: <p>You want the top left of the A smooth without extra points. U, V, are the same. The horizontal strokes in A, E, F, H, Z, 3, 5, are too light for me.</p>
    html_clean: <p>You want the top left of the A smooth without extra points. U, V, are the same. The horizontal strokes in A, E, F, H, Z, 3, 5, are too light for me.</p>
  - id: 108341
    user: 4763
    date: 2006-02-13T06:16:00
    date_raw: 13 Feb 2006 — 6:16am
    votes: null
    html: |-
      <p>The A seems OK to me except the thin horizontal bar.</p>
      <p>The distinction between U and V should be sufficient since it is a display face. I would put the round corner of the V to the right and the angular one to the left, however.</p>
      <p>The lower right bulb/serif at the E could become a lot shorter as it is a situation different to the C. Ever thought of making the E based on the G with the bulb on top? The middle stroke should be longer. It is too short and your font is already witty enough so I wuold not try to add even more original details.</p>
      <p>I would remove the rounding where the two strokes of the T meet. Same for the central stem of the M, it does not match the principles of the typeface.</p>
      <p>The middle stroke of the 3 should not be so additive, you should consider a solution like in the W.</p>
      <p>Maybe M and W are a bit too narrow.</p>
      <p>Anyway, well done so far!</p>
