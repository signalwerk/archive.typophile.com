      <p>Hello,<br>
      I have gone back and made more changes to my typeface.<br>
      I smoothed out alot of the curves and I also thickened up a lot of<br>
      the horizontal bars. That definetly made it feel better on paper.<br>
      I also added an alt version with no desending serifs. Also please<br>
      excuse the spacing on some of the letters. I forgot to<br>
      do that last night.<br>
      Let me know what you think.<br>
      Thanks!<br>
