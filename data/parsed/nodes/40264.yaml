    <p>Hello Typophiles,</p>
    <p>Absans was initially started as a classroom project while I was still in my 2nd year. It was a simple sans designed to understand the basic proportions and how the letters work together. But now I have made some changes to give the design a new look. </p>
    <p>I would really appreciate if you guys can spare some time and mark me some feedback on the design. I want this face to work in the text as well as in display settings.</p>
    <p>Thanks a bunch,<br>
    Satya</p>
