      <p>Hi Sayta, I like the 'square curve' thing as for example in 'g' or 'y' and I think that it works remarkably well in text sizes. Just a few remarks/things I noticed:</p>
      <p>• Make vertex in 'M' the same as in 'V' or apex in 'A'</p>
      <p>• 'S' and 's' still leaning back</p>
      <p>• Lower the connection on stem 'r'</p>
      <p>• Liked first spur solution of 'G' better</p>
      <p>• 'Y' a bit wider</p>
      <p>• Make top 'J' as 'f'</p>
      <p>• Inkttrap solution for tail 'Q' ?</p>
      <p>• Bottom stem of 'd' and 'u' like 'a' or 'l' ?</p>
      <p>• Slash (/) too bold (backslash seems better)</p>
      <p>• '!' narower at bottom</p>
      <p>• Not sure about 'K' and 'k'</p>
      <p>These (short) bullets read a bit harsh but they are just what I would do ... absolutely not binding :)</p>
