  html: <p>I am trying to find out what font was used for Tony Hawks' name on this skateboard that was made in the mid-80's by the Powell and Peralta Corp. The name of similar typeface's would also be appreciated. Thank you.</p><div class="imageWrap"><img src="http://typophile.com/files/thawkfont_6216.jpg"></div><p></p>
