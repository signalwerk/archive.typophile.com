    html: |-
      <p>Really doubt it could be a font, more probably a custom lettering for Powell &amp; Peralta Tony Hawk deck. You could find <a class="freelinking external" href="http://weandthecolor.com/custom-typeface-design-by-macfadden-thorpe/17218" rel="nofollow">here</a> a complete alphabet by <a class="freelinking external" href="http://www.macfaddenandthorpe.com" rel="nofollow">McFadden &amp; Thorpe</a> and based on the classic 80's Tony Hawk deck.<br>
      For the rest, if you still need it as vector, that could be pretty easy to trace it from any <a class="freelinking external" href="http://i1.ytimg.com/vi/TxfgqHnoyJo/maxresdefault.jpg" rel="nofollow">big sample</a> or even redraw it as it is blocky/squarish and only made with straight lines (no curves). You don't even need to be strict with lines and alignments as the original drawing looks a bit clumsy.<br>
      Some candidates for customization (more or less work): <a class="freelinking external" href="http://www.dafont.com/bionic-type.font" rel="nofollow">Bionic</a>, <a class="freelinking external" href="http://www.dafont.com/squarefont.font" rel="nofollow">Squarefont</a></p>
