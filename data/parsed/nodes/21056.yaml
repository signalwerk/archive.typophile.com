      <p>The deconstructed version is too difficult to read. The formal version doesn't do anything for me--it looks like the letters are all from similar, but different typefaces. The lowercase a looks awkward to me.</p>
      <p>Neither conveys tragic hero to me, but I don't think any typeface could do that. I think that is more of the graphic design side.</p>
      <p>At least you didn't rely on a cheesy Star Wars/Sci-Fi font.</p>
      <p>Keep trying.</p>
