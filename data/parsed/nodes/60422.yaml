    html: <p>The top two are the closest to expressing the vision. I like the <strong>top right</strong> idea, with the graduation cap on the 3rd kid. The flow symbolizes the natural progression of the education process. I'm not to crazy about the sharp edged font, though. Consider a typeface with rounder edges, but not <strong>too</strong> round that it makes the typeface look child-ish. These are great ideas. Good work.</p>
