  html: |-
    <p>I have to make a logo for an organisation who will help to give education at all the children. Cunina believes that every child, wherever in the world, is unique, has its own capacities and talents and is capable of learning.<br>
    Cunina is of opinion that every child has the right to have access to primary education. A child that is able to develop itself today, will later be better able to support itself ánd will be able to support others in their social development.<br>
    Cunina has a heart for children.</p>
