    html: '<p>&gt; give some extra horizontal space <br><br>That’s a great idea.  <br>I guess the reason for it is that Cyrillic has more straight stems than rounds compared to Latin. <br><br>When I was designing Nour&amp;Patria it became clear that even cognate forms (like vo/”n”) have to be spaced diﬀerently (looser for the Armenian) because of the exact same issue (although probably not as pronounced). <br><br>Where this becomes even more interesting is this: if you accept that a glyph’s black shape depends on the white (both inside and outside), then you realize that looser spacing means the black shape has to change too! <br><br>— <br><br>Adam, did you see the ghost of Khrimian Hayrig?&nbsp;;-) <br>He was a famous Armenian priest from that peninsula. After seeing Armenian issues get demoted from 16th to 61st priority during two subsequent post-<span class="caps">WWI</span> conferences, he gave us this cherished proverb: “To drink from the soup of the world, you must have an iron ladle.” <br><br>hhp <br></p>'
    html_clean: '<p>&gt; give some extra horizontal space <br><br>That’s a great idea.  <br>I guess the reason for it is that Cyrillic has more straight stems than rounds compared to Latin. <br><br>When I was designing Nour&amp;Patria it became clear that even cognate forms (like vo/”n”) have to be spaced diﬀerently (looser for the Armenian) because of the exact same issue (although probably not as pronounced). <br><br>Where this becomes even more interesting is this: if you accept that a glyph’s black shape depends on the white (both inside and outside), then you realize that looser spacing means the black shape has to change too! <br><br>— <br><br>Adam, did you see the ghost of Khrimian Hayrig?&nbsp;;-) <br>He was a famous Armenian priest from that peninsula. After seeing Armenian issues get demoted from 16th to 61st priority during two subsequent post-<span class="caps">WWI</span> conferences, he gave us this cherished proverb: “To drink from the soup of the world, you must have an iron ladle.” <br><br>hhp <br></p>'
