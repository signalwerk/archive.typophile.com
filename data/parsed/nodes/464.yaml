    html: '<p>Alan,  <br><br>I think you’re right with your attempt to design Cyrillic lowercase slightly larger than Latin.  <br><br>I was advised to do so by Maxim Zhukov who also told me that, when mixing Cyrillic and Latin using a typeface that has all lowercase of nominally the same height, he often uses a fractionally larger type size for the Cyrillic.   <br><br>Regarding Quadraat Cyrillic, it isn’t well readable for a non-native Russian speaker such as myself. Native Russian speakers told me that Quadraat possibly looks sort of “Bulgarian”, if like anything at all.  <br><br>I deﬁnitely recommend you to read the essays by Vladimir Yeﬁmov and Maxim Zhukov published in “Language Culture Type” (<span class="caps">AT</span>ypI/Graphis 2001): <a href="http://www.atypi.org/10_Visitors/70_publications/50_LCT" target="_blank">http://www.atypi.org/10_Visitors/70_publications/50_LCT</a>  <br><br>Regards,  <br>  Adam&nbsp;Twardoch</p>'
