    html: '<p>First of all, in addition to the articles in “Language Culture Type”, by all means, I recommend reading Vladimir Yeﬁmov’s primer on designing Cyrillic letters (in Russian only, unfortunately): <br><br>Part 1: <br><a href="http://www.paratype.ru/ru/e-zine/issue01/knowhow.htm" target="_blank">http://www.paratype.ru/ru/e-zine/issue01/knowhow.htm</a> <br>Part 2: <br><a href="http://www.paratype.ru/ru/e-zine/issue02/knowhow.htm" target="_blank">http://www.paratype.ru/ru/e-zine/issue02/knowhow.htm</a> <br>Part 3: <br><a href="http://www.paratype.ru/ru/e-zine/issue03/knowhow/typemak3.htm" target="_blank">http://www.paratype.ru/ru/e-zine/issue03/knowhow/typemak3.htm</a> <br><br>Examining various approaches to cyrillization of popular designs such Helvetica can be very insightful.  <br><br>Russian-style Cyrillic:  <br><br>Helvetica Linotype (Linotype: Cyrillic 2001 by John Hudson and the Linotype staﬀ) — my favourite <br><a href="http://www.fontexplorer.com/FontStore/661573179/Product/View/16841171" target="_blank">http://www.fontexplorer.com/FontStore/661573179/Product/View/16841171</a> <br><br>Pragmatica (ParaType: Cyrillic 1987 by Vladimir Yeﬁmov and Isai Slutsker) — my second-favourite <br><a href="http://www.paratype.com/pstore/charset.asp?scode=PT_PRG55&amp;refcode=123495" target="_blank">http://www.paratype.com/pstore/charset.asp?scode<span class="caps">=PT</span>_PRG55&amp;refcode=123495</a>  <br><br>Helvetica Cyrillic (Linotype: Cyrillic 1992 by Jovica Veljovic and the Linotype staﬀ) — not so favourite <br><a href="http://www.fontexplorer.com/FontStore/661573179/Product/View/16111680" target="_blank">http://www.fontexplorer.com/FontStore/661573179/Product/View/16111680</a> <br><br>Helios (TypeMarket: Cyrillic 1993 by Alexey Kustov and Sergey Shanovich) — not so favourite  <br><a href="http://www.paratype.com/pstore/charset.asp?scode=TM_HLS55&amp;refcode=123495" target="_blank">http://www.paratype.com/pstore/charset.asp?scode<span class="caps">=TM</span>_HLS55&amp;refcode=123495</a>  <br><br>Swiss 721 Cyrillic <span class="caps">TL</span> (Tilde: Cyrillic by Andrejs Grinbergs) — not so favourite  <br><a href="http://www.tilde.lv/Fonts/fontsamples/pqrs/swiss721cyr.htm" target="_blank">http://www.tilde.lv/Fonts/fontsamples/pqrs/swiss721cyr.htm</a> <br><br>Nimbus Sans (<span class="caps">URW</span>++: Cyrillic by <span class="caps">URW</span> team) — rather poor <br><a href="http://www.myfonts.com/fonts/urw/nimbus-sans/l-regular/win-t1/97112/charmap.html" target="_blank">http://www.myfonts.com/fonts/urw/nimbus-sans/l-regular/win-t1/97112/charmap.html</a> <br><br>Bulgarian-style Cyrillic:  <br><br>Helen (Hermen Software) <br><a href="http://www.hermessoft.com/newproject/packages/helen.html" target="_blank">http://www.hermessoft.com/newproject/packages/helen.html</a> <br><br>In general, you can notice that the “Bulgarian style” of Cyrillic letters usually involves more ascenders and descenders than the “Russian style”, e.g. in “ve”, “zhe”, “ka” or “yu”.  <br><br>Also, the upright letterforms “ge”, “de”, “te” or “sha” often have the same styllistic features as the corresponding italic forms.  <br><br>Some experts disagree that these “Bulgarian variants” really are representative. My suspicion is that Russian-style Cyrillic is perfectly acceptable to Bulgarian readers just as the Bulgarian-style forms, while the opposite isn’t true: the Russian-style forms are the only ones acceptable for Russian readers.  <br><br>Serbian-style Cyrillic:  <br><br>Similarly, there are some particular letterforms that are distinct in Serbian-style Cyrillic — especially in italic style. These include “ge”, “de”, “pe” and “te” that tend to be more inﬂuenced by calligraphy than in the Russian-style Cyrillic. Helvetica Linotype implements this in the OpenType “locl” feature.  <br><br>Please note that, for example, Jovica Veljovic’s Cyrillic designs tend to be slightly more of Serbian style than of Russian style.  <br><br>There are good samples of Cyrillic and Western character sets of fonts designed or adapted by ParaType designers and other Russian designers (especially the work by Vladimir Yeﬁmov and Tagir Safayev is worth checking).  <br><br>For example, check out Vladimir Yeﬁmov’s Octava. Pay special attention to the Latin and Cyrillic K, and then to the Zhe. <br><a href="http://www.paratype.ru/pstore/charset.asp?scode=PT_OCT55&amp;refcode=123495" target="_blank">http://www.paratype.ru/pstore/charset.asp?scode<span class="caps">=PT</span>_OCT55&amp;refcode=123495</a> <br><a href="http://www.paratype.ru/pstore/charset.asp?scode=PT_OCT55&amp;codingList=11&amp;refcode=123495" target="_blank">http://www.paratype.ru/pstore/charset.asp?scode<span class="caps">=PT</span>_OCT55&amp;codingList=11&amp;refcode=123495</a>  <br>Also, check <span class="caps">ITC</span> Charter Cyrillic <br><a href="http://www.paratype.ru/pstore/charset.asp?scode=PT_CHR55&amp;refcode=123495" target="_blank">http://www.paratype.ru/pstore/charset.asp?scode<span class="caps">=PT</span>_CHR55&amp;refcode=123495</a>  <br><a href="http://www.paratype.ru/pstore/charset.asp?scode=PT_CHR55&amp;codingList=11&amp;refcode=123495" target="_blank">http://www.paratype.ru/pstore/charset.asp?scode<span class="caps">=PT</span>_CHR55&amp;codingList=11&amp;refcode=123495</a>  <br><span class="caps">ITC</span> New Baskerville <br><a href="http://www.paratype.ru/pstore/charset.asp?scode=PT_NWB55&amp;refcode=123495" target="_blank">http://www.paratype.ru/pstore/charset.asp?scode<span class="caps">=PT</span>_NWB55&amp;refcode=123495</a>  <br>and other serif designs <br><a href="http://www.paratype.ru/asearch/sresult.asp?ftype=SE&amp;enclang=enc&amp;fenc=1&amp;ffoundry=PT&amp;refcode=123495" target="_blank">http://www.paratype.ru/asearch/sresult.asp?ftype<span class="caps">=SE</span>&amp;enclang=enc&amp;fenc=1&amp;ﬀoundry<span class="caps">=PT</span>&amp;refcode=123495</a>  <br><br>I consider Matthew Carter, John Hudson and Gary Munch as the designers who are most successful among non-natives in designing Cyrillic letterforms. Carter’s Georgia and Verdana, Hudson’s Sylfaen and Helvetica Linotype, and Munch’s Really are exceptionally well-designed Cyrillics. I also think Robert Slimbach’s (and Carol Twombly’s) designs for Minion and Myriad are well done.  <br><br>Finally, I’d recommend contacting experienced and highly valued experts who could express some critique on your letterforms. I think contacting Maxim Zhukov, Vladimir Yeﬁmov and Jovica Veljovic would be best choice.  <br><br>Best regards,  <br>Adam <br></p>'
