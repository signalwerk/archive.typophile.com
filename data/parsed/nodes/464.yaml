    html: '<p>&gt; Russian text looks diﬀerent from English when set in the same …. <br><br>Yes, it looks smaller, no? Doesn’t that convey “less important”? <br><br>&gt; What I shared with you was a typesetting, not a type design, tip. <br><br>But why not translate that to the type itself, instead of assuming the typographer is an expert? Aren’t “smart” fonts good? The recent Whitman comes to mind: in the elaboration in Kent’s <span class="caps">PDF</span> there are descriptions of many “tricks” he’s incorporated that work <i>in spite</i> of the typographer. <br><br>In fact, I see a good reason to move that feature (diﬀering x-heights) “deeper”, to the type design itself: if you take a font with Latin and Cyrillic components (where the color has been matched for the same point size, as it will always be if it’s any good) and scale one slightly larger, it will look darker too. <br><br>I’m not disputing what the standards are, I’m just pointing out functional problems with them. <br><br>hhp <br></p>'
