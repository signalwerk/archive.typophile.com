    html: '<p><span class="caps">BTW</span>, another reason to vary the rendering of [superﬁcially] identical characters is notan (the balance of black and white): if one script likes its letterspacing looser than the other (for example as a result of a greater proportion of vertical stems versus rounds, like in Armenian), that would act to increase the internal white as well — and vice versa. <br><br>The tricky thing, however, is how to make the diﬀerentiation non-hoaky. I think it was John who said/claimed that Quadraat-Cyrillic* isn’t just “divergent”, it’s inauthentic. I might have to take his word for that, but I can’t help but remember a standard disclaimer of mine: what most type designers consider inauthentic might be just ﬁne in the eyes of the reader. In any case, it clearly takes a greater-than-otherwise cultural sensitivity — when you opt not to copy the establishment, you’re deeper in the forest. <br><br>* <br>Here’s an image I used during my presentation in Thessaloniki: <br><a href="http://www.themicrofoundry.com/other/quadraat_cyr.gif" target="_blank">http://www.themicrofoundry.com/other/quadraat_cyr.gif</a> <br><br>hhp <br></p>'
