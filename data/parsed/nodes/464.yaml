  html: "<p>Hi everyone, <br><br>I’m currently working on some Cyrillic fonts, my ﬁrst. I’m just getting a feel for the forms right now. <br><br>I have a font that has regular Latin upper/lower case and small caps, and I’m now ﬁlling out the character set with Cyrillic letters. Should I be using the small cap height for the Cyrillic x-height? Since there are many lower case Cyrillic letters that look basically the same as a Latin small cap, this would simplify things. Then again, some Cyrillic lower case look like Latin lower case as well. <br><br>But beyond that, it’s an issue of color: should the Cyrillic lower case have the same weight as a Latin set of small caps? Or should they go more with the Latin lower case (very slightly lighter), and also use its smaller x-height? But some of the Cyrillic lower case letters seem to demand more space, due to their being based directly oﬀ of the upper case (such as Yah, which looks like a backwards small cap R). <br><br>Since it would be a rare situation in which Cyrillic lower case are standing next to Latin characters (small caps or lower case), I imagine that maintaining a level of consistency with regard to x-height is probably not a big deal. <br><br>Lastly, is there such a thing as Cyrillic small caps? It seems almost redundant, but I could see the possibility of them existing (I’ve just never seen any before). <br><br>Thanks, <br>Alan</p>"
  html_clean: "<p>Hi everyone, <br><br>I’m currently working on some Cyrillic fonts, my ﬁrst. I’m just getting a feel for the forms right now. <br><br>I have a font that has regular Latin upper/lower case and small caps, and I’m now ﬁlling out the character set with Cyrillic letters. Should I be using the small cap height for the Cyrillic x-height? Since there are many lower case Cyrillic letters that look basically the same as a Latin small cap, this would simplify things. Then again, some Cyrillic lower case look like Latin lower case as well. <br><br>But beyond that, it’s an issue of color: should the Cyrillic lower case have the same weight as a Latin set of small caps? Or should they go more with the Latin lower case (very slightly lighter), and also use its smaller x-height? But some of the Cyrillic lower case letters seem to demand more space, due to their being based directly oﬀ of the upper case (such as Yah, which looks like a backwards small cap R). <br><br>Since it would be a rare situation in which Cyrillic lower case are standing next to Latin characters (small caps or lower case), I imagine that maintaining a level of consistency with regard to x-height is probably not a big deal. <br><br>Lastly, is there such a thing as Cyrillic small caps? It seems almost redundant, but I could see the possibility of them existing (I’ve just never seen any before). <br><br>Thanks, <br>Alan</p>"
