    html: <p>The Cyrillic may look so much smaller, partly due to the lack of ascenders. And to my non-Russian eyes, some of those letters look awfully snug. <br><br>But then how about the same writing system for a diﬀerent language, like Ukranian or Serbian? They use Cyrillic characters, but add a few letters that have ascenders (or dots) that ﬁll some of the space above the lower case. <br><br>The Quadraat Cyrillic Italic does look a bit aﬀected in places. I think the gaps in letters like the zhe and kah are distracting for a lower case, and the descending zeh?! Is that what that is? Looks like it was just borrowed from the old-style three? <br><br>If John Hudson is around to chime in, that would be great. <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"><br><br>Alan</p>
    html_clean: <p>The Cyrillic may look so much smaller, partly due to the lack of ascenders. And to my non-Russian eyes, some of those letters look awfully snug. <br><br>But then how about the same writing system for a diﬀerent language, like Ukranian or Serbian? They use Cyrillic characters, but add a few letters that have ascenders (or dots) that ﬁll some of the space above the lower case. <br><br>The Quadraat Cyrillic Italic does look a bit aﬀected in places. I think the gaps in letters like the zhe and kah are distracting for a lower case, and the descending zeh?! Is that what that is? Looks like it was just borrowed from the old-style three? <br><br>If John Hudson is around to chime in, that would be great. <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"><br><br>Alan</p>
  - id: 3005
    user: 1250
    date: 2003-06-26T23:24:00
    date_raw: 26 June 2003 - 11:24pm
    votes: 0
    html: '<p>I can’t comment on the individual letter issues you mention (I’m simply not familiar with them), but in terms of relative apparent size, it is in fact the proportion of extenders (mostly ascenders, yes) that causes the diﬀerence, assuming the color is equivalent. Interestingly, any diﬀerence in width (noting that the Cyrillic letters have much greater average width) seems not to matter — and I think I know why: lines are set horizonally, and line breaks “absorb” the width diﬀerence. But the Cyrillic text will generally run longer (especially since English is a very terse language), and you could say that’s where the greater width makes itself felt. <br><br>It’s also interesting to note that the Ukranian/Serbian factor aﬀects Latin as well, in fact more so! I once did a study of the relative vertical span of 6 Latinate languages, and the two extremes (English and Polish) were pretty far apart. Ergo: Polish needs to be a set a little bit smaller than any parallel English! But to do this sort of thing you need to look closely at letter frequencies, not just the alphabet. The Greek alphabet for example has a greater proportion of extending characters than English, but in real text it’s even more conﬁned to the x-height! <br><br><span class="caps">BTW</span>, Maxim Zhukov <span class="amp">&amp;</span> George Sadek’s “Typographia polyglotta” is a great resource for developing some linguistic sensitivity towards mixed typesetting. Just try not to squirm when you read the last paragraph on page xvi… to me it almost ruins the whole point of the book! But that slip of “fundamentalism” notwithstanding, it’s really a great little gem. <br><br>hhp <br></p>'
