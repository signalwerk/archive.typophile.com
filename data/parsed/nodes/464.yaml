    html: '<p>Caveat: I know little about the particulars of Cyrillic type design. However, I have been spending a lot of time looking at and evaluating how scripts [should] behave when mixed. <br><br>&gt; Should I be using the small cap height for the Cyrillic x-height? <br><br>Which smallcaps? Aren’t you the guy who makes 7 sizes of smallcaps? &nbsp;;-) <br><br>Seriously, my view (which stems from some informal linguistic analysis) is that a smallcaps height which is notably taller than the x-height is indeed the best guide for the Cyrillic “x-height”. You can see the necessity for this as soon as you look at some text using the same guide for the x-heights of both Cyrillic and Latin: the former looks secondary, in apparent size. <br><br>On the other hand, you should know that this stance is somewhat anti-establishment. People like John Hudson (who I admit design aesthetically very solid Cyrillic fonts) are in the majority when they say that the x-heights should be the same. But they’re wrong.&nbsp;:-) <br><br>&gt; maintaining a level of consistency with regard to x-height is probably not a big deal. <br><br>In fact that’s a clue as to the boundary between immersive versus deliberative reading: in the former (like setting a book) you need overall balance of texture/size more, while in the latter (like setting a poster) you need (or at least might prefer) visual alignment. <br><br>A reference: <br><a href="http://www.themicrofoundry.com/ss_rome3.html" target="_blank">http://www.themicrofoundry.com/ss_rome3.html</a> <br><br>— <br><br>I personally go even further and state that characters that seem to have identical structures in both scripts should actually have <i>diﬀerent</i> renderings! The reason is two-fold: emphasizing (even exagerating) cultural authenticity; and improving diﬀerentiation. For example look at the “Getty” sample on my link above: if it weren’t for those parentheses, the reader would be seriously thrown oﬀ. <br><br>As an example of what I’m talking about in real life, check out the Cyrillic of Quadraat. John doesn’t like it — I love it. <br><br>hhp <br></p>'
