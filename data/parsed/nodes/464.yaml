    html: "<p>Hrant, I could not agree more with your last point: stressing inherent cultural diﬀerences by drawing (visually) common letters separately. This is exactly what I plan to do. <br><br>About the small caps: yeah, I’m all about quantity. It’s actually not that family that I’m working on, but another. I think I will plod along with a Cyrillic x-height matching the Latin small caps, slightly higher than the Latin lower case. <br><br>It’s been a while since I looked at Quadraat Cyrillic, I will have to check that out. What I would die for is a Cyrillic expansion to Cliﬀord! <br><br>I love this stuﬀ. <br><br>Thanks, <br>Alan</p>"
