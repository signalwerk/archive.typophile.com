    html: '<p>Dear Maxim,  <br><br>thank you so much for your insightful comments.  <br><br>I am very sorry that I incorrectly remembered your advice you gave me some years ago. What you advised was not to design Cyrillic glyphs with a slightly enlarged x-height, but rather to give some extra horizontal space by slightly increasing the sidebearings of the Cyrillic glyphs as compared to Latin. I’ve mixed these things up, for what I’m sorry.  <br><br><span class="caps">BTW</span>: I just returned from a lovely two-week vacation in Yalta, Crimea (Krim, the Ukrainian peninsula at the Black Sea). I had a lot of opportunity to speed up my Cyrillic reading, and to observe many good and bad examples of Cyrillic applied typography. Plus great wheather and great sightseeings. And amazing food <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"><br><br>Adam <br></p>'
