    html: <p>Yes, I have the book you mention, I’m searching frantically for it. In its absence, I’ve been referring to omniglot.com, among other resources. <br><br>The sample Polish text on Omniglot doesn’t look too riddled with extenders, but I’ll take your word for it. Then there’s a disaster like Vietnamese written in the Latin alphabet! For some reason I had always thought that Vietnamese had no written language until it was forced upon them in a Latin form, but clearly I was wrong. But given the complicated accents, you could see how one could assume that the written form was an afterthought. But that’s an entirely diﬀerent topic. <br><br>Thanks for your insights! <br><br>Alan</p>
