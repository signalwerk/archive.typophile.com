    html: '<p>Hi! I’ve run into this discussion by chance, and obviously, too late. A few things got mixed up here.  <br><br>1. That the small caps <i>exist</i> in Cyrillic, is an indisputable fact, impossible to deny. Good typography is hardly possible without small caps, either in Western languages, or in Russian, or other languages using Cyrillic. Just have a look at the digital fonts oﬀered by ParaType that feature ‘<span class="caps">SCOSF</span>’ character sets. <br><br>2. That in multilingual typefaces that cover both Latin and Cyrillic scripts <i>the same x-height</i> is used, is another fact. One can theorise ad inﬁnitum whether this is the best solution but that’s the way it is (challenging this practice has nothing to do with being ‘anti-establishment’: this is pure <i>coquetterie</i>). <br><br>3. In designing multilingual typefaces that cover both Latin and Cyrillic scripts it is standard to use <i>identical shapes</i> for diﬀerent characters in both sets: for example, the capital A, B, C, E, H, I, J, [K], M, O, P, S, T, X, and the lower-case a, c, e, i, j, o, p, s, x, and y (in roman, and more in italic).  <br><br>4. Yes, Russian text <i>looks diﬀerent</i> from English when set in the same point size, on the same leading, track, with the same horizontal scale, etc. Of course, in the same typographic format English text looks diﬀerent from Italian, Spanish text looks diﬀerent from Danish, etc., despite they all use Latin script.  <br><br>5. Adam, I never told you that Cyrillic lowercase should be <i>designed</i> with slightly larger x-height than Latin. What I shared with you was a <i>typesetting</i>, not a type design, tip. Manipulating the point size and the tracking is sometimes necessary for better visual balance of the Russian text with the text in English, or in any other language using Latin script. <br><br>6. The design of <b>Quadraat</b> Cyrillic I ﬁnd pretty amateurish, and the typeface unusable. As to <b>Minion</b>, that was the very ﬁrst digital Cyrillic with a good pedigree, and one of the ﬁrst typefaces the young Robert Slimbach did for Adobe; however, I am certain that to-day he could come up with a much better&nbsp;design.</p>'
