    html: <p>Alan,  <br><br>the Ukrainians (and Russians, I think) like to put mayonnaise in their salads, so one needs to be sparse with them. The strongest side of the local cuisine are ﬁsh and sea fruits. You can get salmon in numerous incarnations. Also, since the Tatars and Armenians were and are present on Crimea, you get tasteful shasliks and other meat dishes mainly involving lamb. You also get various ravioli-like specialties such as pelmeni or vareniki. Crimea has ﬁne wines and Champagne-like sparling wines. And, of course, you get caviar that is incredibly aﬀordable (less than $50 per 100g).  <br><br>Of course, I couldn’t resist making some photos of the lettering, but I tried to restrain myself. <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"><br><br>Adam</p>
