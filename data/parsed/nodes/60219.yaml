    date_raw: 24 Jul 2009 — 9:46am
    votes: null
    html: <p>Note that a narrow typeface doesn't necessarily get you more words for the same legibility. You may be able to shrink more in size a wider face and still be legible. And if you have more than one line, you may be able to stack the lines with less leading. IIRC, Stephen Coles here has pointed to Amplitude as one that works very well small.</p>
