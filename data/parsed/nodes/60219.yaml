    <p>Hi</p>
    <p>I am looking for relatively narrow sans faces that work particularly well as text faces at a small point size whilst squeezing as many words into a line as possible.</p>
    <p>I am currently setting Univers condensed (8pt type / 10pt leading) but was looking for any suggestions for typefaces that meet the requirements above whilst being a little easier on the eye?</p>
    <p>Many thanks.</p>
