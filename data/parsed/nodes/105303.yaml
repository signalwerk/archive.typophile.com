    <p>Hello typographer and typo aficionados;</p>
    <p>It been a while that I noticed that this urge of logotype epiphany is recurring in the global news and on other news. "A new logotype was made for the X company".<br>
    Well, last month I went to a presentation of some startup companies:  a place where a logotype need a place to live. There, some designers shown their logotypes, presenting them as their beautiful children. Back, I am wondering: <em>That logotype is just a 'chosen by someone typeface' with a color and the name of the company</em>. </p>
    <p>Why they call theirselves "the creators of the logotype?".<br>
    You, that make the typefaces that they use, are not that creator of it (on that kind of cases)? Or, because they buy the typeface, they are the owners of your creativity? I said that, because they neither bother to refer the name nor the creator of that typeface. </p>
    <p>What do you guys think of that?</p>
    <p>-------------<br>
    Thanks Fábio Santos</p>
