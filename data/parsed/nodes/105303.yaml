      <p>It would be helpful if you posted specific examples. </p>
      <p>A logo consisting of just the name in a commercial font may seem like a lazy solution (and in some cases it might be), but keep in mind that startups often have very tight budgets and the logo designer may just be someone on their staff or a low-budget freelancer. </p>
      <p>Also it's likely that the designer presented a variety of logos, and the client chose the simple one.</p>
      <p>As for mentioning the font name, designers are under no obligation to do so. When you buy a font you're free to use it as you wish (within the terms of the license).</p>
