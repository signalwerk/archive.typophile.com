      <p>I’ve never been very impressed with wordmarks that are straight off-the-shelf font gylphs, no matter how nicely kerned.</p>
      <p>However, if the company name plays second ﬁddle to an original symbol, then plain type is just ﬁne.</p>
      <p>When the logo is banal—the recent GAP makeover with Helvetica and a square comes to mind—again, I wonder.</p>
      <p>As James says, despite the underwhelming design of a logo, it may nonetheless have been through a relevant design process and, as part of a corporate identity, be a good design solution and provide an effective identity for the company.</p>
      <p>Concerning creative authorship, as a type designer I’m flattered whenever anybody uses one of my types—providing they have paid for it—so see no need to be acknowledged.</p>
      <p>There are some foundries which stipulate in their EULAs that using one of their types as the creative whole of something such as a logo requires special licensing.</p>
