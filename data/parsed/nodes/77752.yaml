  html: |-
    <p>My client is selling merchandise to outdoorsy/extreme-sports-playing girls (4-wheelers, jeeps, kayaks, snowboards, skateboards, etc). Her values are strength &amp; femininity; her message is that girls can be strong without sacrificing being girls. She's not looking for sexy or "girl power," but a feminine, powerful willingness to roll up the sleeves and do what needs to be done.</p>
    <p>I love the sort of typography this suggests... my mind instantly goes to some kind of strong sans (probably set in italic?) with great attention to detail and subtle flourishes; but I don't have any specific font in mind. </p>
    <p>Typeface ideas? Either matches for the above or different typographical approaches would be very much appreciated.</p>
