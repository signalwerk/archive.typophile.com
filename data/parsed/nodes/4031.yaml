    html: <p>Look for an accountant who is experienced with people in your kind of business. <br> <br>And be aware that some are more aggressive than others in what they will claim as an expense on your behalf. If you are audited, it will be a costly haggle (your accountant vs the establishment's) over the interpretation of what are legitimate expenses. It's a big complex grey area that the bean counters in government, the bureaucracy, and the private sector have created for the purpose of sucking money from your line of work into theirs. <br> <br>So, if possible, get a favorable recommendation from a peer.</p>
