  html: "<p>It's almost April, and what does <i>that</i> mean? For US residents, it's Tax-Paying Time! And this, being a typography forum, is probably the best place to ask for advice!  &lt;|:^) <br> <br>Serioiusly, though, this forum is chock full of people who are in the same situation as me: Freelance Designer. I'm new to this freelance thing, fresh out of school, and I have no clue how to do this stuff. So, my questions to any of you takers is, <br> <br>How do I pay my taxes? Do you know any good online resources (better yet, any free online things for freelancers who didn't make too much)? Any tips on writeoffs? How not to get audited?</p>"
  html_clean: "<p>It's almost April, and what does <i>that</i> mean? For US residents, it's Tax-Paying Time! And this, being a typography forum, is probably the best place to ask for advice!  &lt;|:^) <br> <br>Serioiusly, though, this forum is chock full of people who are in the same situation as me: Freelance Designer. I'm new to this freelance thing, fresh out of school, and I have no clue how to do this stuff. So, my questions to any of you takers is, <br> <br>How do I pay my taxes? Do you know any good online resources (better yet, any free online things for freelancers who didn't make too much)? Any tips on writeoffs? How not to get audited?</p>"
