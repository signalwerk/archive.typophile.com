    votes: null
    html: "<p>Two suggestions: <br> <br>1. Pay quarterly estimated taxes. This saves you from having to write a fatty check in april (same idea as having taxes witheld from you paycheck) <br> <br>2. I use TurboTax. Seems to work out ok. It's a straight forward walkthrough that anticipates your questions and doesn't require a green eyeshade to operate. As a freelancer my larger clients send me 1099's (not the W2's you're used to). I think a 1099 is not needed for values under $600. Even if you don't get one and value is over 600, you should still report those earnings (your client will probably report it, just not with a 1099 -- and you want your numbers and their numbers to jive). Turbo Tax also walks you through various ways to write of business expences (equipment, travel etc). Then you print a copy for yourself and E-file the thing off to the IRS. Done. All in all, no complaints. <br> <br>Good luck! <br>Randy</p>"
    html_clean: "<p>Two suggestions: <br> <br>1. Pay quarterly estimated taxes. This saves you from having to write a fatty check in april (same idea as having taxes witheld from you paycheck) <br> <br>2. I use TurboTax. Seems to work out ok. It's a straight forward walkthrough that anticipates your questions and doesn't require a green eyeshade to operate. As a freelancer my larger clients send me 1099's (not the W2's you're used to). I think a 1099 is not needed for values under $600. Even if you don't get one and value is over 600, you should still report those earnings (your client will probably report it, just not with a 1099 -- and you want your numbers and their numbers to jive). Turbo Tax also walks you through various ways to write of business expences (equipment, travel etc). Then you print a copy for yourself and E-file the thing off to the IRS. Done. All in all, no complaints. <br> <br>Good luck! <br>Randy</p>"
