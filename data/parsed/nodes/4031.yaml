    html: "<p>This is great feedback. I posted because I thought it would help me out, but I had a hunch that it would grow and cover a lot of ground that could help other, more advanced freelancers. <br> <br>I am actually just beginning my career as a designer and I've been working freelance for a few months. I only worked a little bit last year, so Randy's advice works better for me. That said, the rest of the information is awesome because I may be headed in that direction sometime this year (things have been picking up. It's amazing). About TurboTax: I saw that you can buy it online, but there's different versions. I assume I'd have to buy the $70 one for the self-employed? Is there anything else online that's similar? I don't think I can afford an accountant, btw...</p>"
