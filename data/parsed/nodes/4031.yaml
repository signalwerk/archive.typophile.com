    html: <p>If you are concerned about being audited and where to find writeoffs then the only proper advice anyone should offer is for you to hire an accountant. <br> <br>After you hire one and discuss your current tax problems, may I suggest you look into creating a more formal business entity. Either a LLC or a Corporation subchaper S or C. The Schedule C tax form for Sole Proprietor that most freelancers file is the most heavily scutinized form the IRS receives, simply because most tax fraud occurs there. <br> <br>The prevailing climate in the U.S, favors business over individuals. By creating for yourself a formal business entity, you will avail yourself of more rights than you currently have as an individual. Sad but true. <br> <br>And after you hire your accountant. Find a good lawyer!</p>
    html_clean: <p>If you are concerned about being audited and where to find writeoffs then the only proper advice anyone should offer is for you to hire an accountant. <br> <br>After you hire one and discuss your current tax problems, may I suggest you look into creating a more formal business entity. Either a LLC or a Corporation subchaper S or C. The Schedule C tax form for Sole Proprietor that most freelancers file is the most heavily scutinized form the IRS receives, simply because most tax fraud occurs there. <br> <br>The prevailing climate in the U.S, favors business over individuals. By creating for yourself a formal business entity, you will avail yourself of more rights than you currently have as an individual. Sad but true. <br> <br>And after you hire your accountant. Find a good lawyer!</p>
