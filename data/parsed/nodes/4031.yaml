    html: <p>I second James! In simpler lingo, by incorporating, you're taxed at a lower rate on your income and your accontant can define a paperless system so you don't have to write timecards to your self of hold board meetings. <br> <br>In addition, you will need to issue yourself a W-2 and define a salary for your position. Also people should pay the corporation with an EIN number instead of your personal social security number. <br> <br>Another benefit is that if somebody comes after you with a liability claim, they cannot sue you personally. <br> <br>Keep in mind you can stay a sole proprietor for up to 3 years and show a loss but at year 4 you must show a profit or it's considered a hobby. <br> <br>While it's better to have an accountant do your incorporation, a friend of mine just used this service and was very pleased with the results. <a href="http://www.mycorporation.com/" target="_blank">http://www.mycorporation.com/</a> <br> <br>By the way, if your company name is different than your corporation name, you may need to file an assumed name form with the state you live in. Also if you decide to start accepting credit cards online, they'll use the corporation name instead of the DBA name. <br> <br>The thing about taxes is that you can't lump them into one category, you must manage state taxes and federal taxes seperately because each has their own rules and to some degree benefits that you can find additional deductions with. <br> <br>Good luck whichever way you decide! <br> <br>Stuart :D</p>
