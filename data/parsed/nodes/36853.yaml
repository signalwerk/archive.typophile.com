    html: <p>These letters were probably drawn specifically for the flag. You can get close with <a href="http://www.fontshop.com/fonts/downloads/mark_simonson/refrigerator/?sample_text=CALIFORNIA%20REPUBLIC&amp;sample_size=36" rel="nofollow">Refrigerator</a>, but you'll need to do that 'R' by hand.</p>
