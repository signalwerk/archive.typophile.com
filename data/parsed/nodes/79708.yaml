    <p>Hello,</p>
    <p>This is my first post on the forum. My name is Aaron and I'm a Graphic Design student @ Roger Williams University. I just recently tried to clean up and organize all my typefaces on my MAC. I have quite a hefty collection. After not finding out what I'm looking for in various searches here, I would like to ask a couple questions about type management.</p>
    <p>The first is, Am I better off applying imported type to Suitcase Fusion or allowing Fusion to read from the directory? Every time I attempt to activate a large selection of typefaces, the system gets bogged down and takes forever to activate them.</p>
    <p>Secondly, does leaving all the different typefaces within sub folders from the main family slow it down? For instance, if I open up a set like Font Bureau as an overall foundry set and it contains sub-folders for every type family is that OK to do, or am I better off establishing just a single folder for the foundry and drop all the families in that single directory without making sub-directories?</p>
    <p>Thanks for your help,<br>
    Aaron</p>
