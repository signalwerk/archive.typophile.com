      <p>Hi Aaron,</p>
      <p>What version of Suitcase Fusion are you running? Whatever version, make sure you have all the latest patches. Suitcase Fusion 3 has better performance than SF2, and some of the updates to SF3 improved performance further, IIRC.</p>
      <p>I'm not sure why you would even have folders for every family... that's what the "Family View" is for.  :)  Similarly, you can filter and/or sort by foundry, so I have difficulty imagining a need for a set for each foundry. That being said, with the latest version of the app, you can have many hundreds of sets without any significant performance penalty.</p>
      <p>In a couple of places you are using terminology in ways I'm not used to, so I don't quite understand the question. I don't understand what "applying imported type" is... do you mean importing fonts into Suitcase Fusion versus activating in place? There is no performance advantage from leaving them in place.</p>
      <p>You say that activating a "large selection" of typefaces takes forever. Can you be a bit more specific? How many fonts is "a large selection"? How long is forever? Otherwise it's hard to know if what you are seeing is unusual, or if the answer is "you usually shouldn't try to activate a thousand fonts at once, and if you must, yes it will take quite a while."</p>
      <p>Cheers,</p>
      <p>T</p>
