      <p>&gt;  if I open an annual report I've been working<br>
      &gt; on and likewise must go hunt down and activate type.</p>
      <p>Suitcase is not auto-activating the type? What application is used to make the annual report? </p>
      <p>If I remember correctly, your version of Suitcase should auto-activate for InDesign, Quark, and Illustrator, as long as you've installed the free plug-ins and so forth. The support section of their site has the details and requirements.</p>
      <p>Incidentally, they have a downloadable document called something like "best practices for managing fonts" at their site. You can probably find using the search box at their site. It's a long document but a good source of info.</p>
