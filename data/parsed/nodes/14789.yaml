    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/12260" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Writing Systems</a>&nbsp;:&nbsp;Greek</strong></p>
    <p><strong>Greek Alphabet:</strong><br>
    <span class="caps">ΑΒΓΔΕΖΗΘΙΚΛΜΝΞΟΠΡΣΤΥΦΧΨΩ</span><br>
    αβγδεζηθικλμνξοπρσ(ς)τυφχψω</p>
    <p><strong>Greek Script: A History <em>by Gerry&nbsp;Leonidas</em></strong></p>
    <p>Ok, here goes: the development of the Greek script (like the <a href="/node/14508" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Latin</a>, but with different sources) is divergent in the two cases. But although the script precedes the Latin it does not have direct links in any of its cases to <a href="/node/add/wiki?edit%5Btitle%5D=inscription" title="Create node &quot;inscription&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">inscriptional</a> forms. Instead, the roots of both Greek cases are in manuscripts of the Alexandrine and early Byzantine era, when people were writing on softer materials. The <a href="/node/13762" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">capitals</a> maintained — and, indeed amplified — the presentational and theatrical elements, being used mostly for <a href="/node/add/wiki?edit%5Btitle%5D=titling" title="Create node &quot;titling&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">titling</a> and ecclesiastical documents (read: a conservative context) and their echoes survive to this day in specific pockets of scribal and typographical documents, as well as hagiography. The <a href="/node/17241" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Lower Case</a> has its root in secular documents: records, tranactions, literary works, and the like: written fast, on cheaper&nbsp;materials.</p>
    <p>The sack of Constantinople by the crusaders in 1204 helped a flowering of Cretan letters; and the impressively timed second sack by the Ottomans in 1453 (geddit?) sent a small army of Greek scribes to the Italian peninsula. They hit the ground in the middle of the Renaissance interest in all things Classical Greek (and especially Aristotle; see below). They took with them the fast, joined secular script they used in volume into their new jobs as editors, proofreaders, typesetters, printers, and teachers (importantly of the offspring of the well-to-do literati, who would grow with this script for their Greek notes). Note that there was, as you would expect, a range of styles within the genre of this secular Byzantine script. The first printers tried out the different styles, but it was <a href="/node/14192" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Aldus Manutius</a>’ choice that edged out its competitors — not on stylistic grounds, since other styles were equally well accepted, but primarily due to his typographic choices (cheaper, small format books) and editorial policy (good progress towards the works of Aristotle, whose were deemed the ultimate texts for scholars to&nbsp;contemplate.</p>
    <p>So far, so good. But throw in professionals that are simultaneously very conservative and mindful of what the competition does, and you get exceptional continuity in the typographic style. By the end of the eighteenth century we have seen a simplification of the forms and the development of a more typographical script, but nothing like the top-to-bottom re-jigging of the Latin script. At the end of the nineteenth century there are essentially two “old” styles, one upright (French) and one inclined (German) plus an inclined style less than a century&nbsp;old.</p>
    <p>Then mechanical typesetting hits the horizon, and in the early years of the twentieth century <a href="/node/add/wiki?edit%5Btitle%5D=Monotype" title="Create node &quot;Monotype&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Monotype</a> single-handedly flips things on their head by fixing for Greek the upright=primary, inclined=secondary model, albeit not without exceptions (single-variant typefaces continue for many decades). Although there are now local <a href="/node/12033" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">foundries</a>, their innovation tends to focus on display styles, and the parameters for text-setting are firmly set on the Monotype mold. This situation continues until after <span class="caps">WW2</span> and the Greek Civil War&nbsp;(1944–49).</p>
    <p>First signs of new ideas come in 1956–57 with <a href="/node/14705" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Times New Roman</a> Greek: this is a very strange beast, whose design echoes on one hand the rationalizing tendencies of the International Style and on the other the primary/secondary style discussions <a href="/node/12136" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Stanley Morison</a> and <a href="/node/30004" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">van Krimpen</a> were having. This distorted template set the tone for text typefaces for quite some time, breaking ranks with a 500-year history. Fast forward to the early seventies, when <a href="/node/13697" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Linotype</a> introduced a whole new raft of typefaces (most importantly <a href="/node/13514" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Helvetica</a> and <a href="/node/12622" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Baskerville</a>, but also <a href="/node/14230" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Souvenir</a>, <a href="/node/add/wiki?edit%5Btitle%5D=Century%20Schoolbook" title="Create node &quot;Century Schoolbook&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Century Schoolbook</a>, later <a href="/node/15685" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Optima</a>) for <a href="/node/add/wiki?edit%5Btitle%5D=phototypesetting" title="Create node &quot;phototypesetting&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">phototypesetting</a>. <a href="/node/57619" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Mike Parker</a> recounted eloquently one aspect of this chapter during <a href="/node/12014" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">TypeCon</a>, at the celebration for <a href="/node/13520" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Matthew Carter</a>. What he did not comment on was that at the time Greece was smack in the middle of a military dictatorship bent on distancing the country from the “Soviet menace”. The sound bite “we belong to the West” was often repeated then, and it is within this context that the Linotype typefaces were developed: explicitly eschewing “traditional” elements, and going for a more “western” texture. This was a radical stylistic re-appraisal of the Greek typographic script, perhaps equivalent to the adoption of the sans serifs for running text in the Latin script. Even within this very particular agenda, Linotype did a pretty good job of producing these typefaces: they “just worked” especially for the documents the emerging middle classes would be producing: magazines, advertising, ephemera, and so on. Combined with a very long gap in any significant typeface development by any manufacturer these Linotype typefaces set the tone for the whole of the seventies and eighties. (I recall when I started working in 1986 that major service bureaus would get by simply with the basic Linotype set, relying for variety on the considerable range of compression/expansion of the forms their typesetting equipment would&nbsp;afford).</p>
    <p>***</p>
    <p>All this gives you a decent context for the eighties, which is much more complicated as a narrative by the switch to monotonic, the gradual change in equipment in small printers (small Heidelberg platens giving their place to <span class="caps">A4</span> / <span class="caps">A3</span> offset presses), the <span class="caps">DTP</span> thing which was essentially driven by new box-shifter companies with no design personnel, the implications of the <span class="caps">ISO8857</span>-9 encoding (and the related Win1253, and the really crappy MacGreek) for font piracy, the early nineties explosion in small bureaus, the complicated tertiary educational environment in design, and a few other things it normally takes me quite some time to go over. Fast forward to the mid/late nineties, when <a href="/node/13428" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Adobe</a> was working on <a href="/node/79470" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Minion Pro</a>, which — correctly, for its time — was pitched as a workhorse text family — what Times should have been, in a sense. Shortly after followed <a href="/node/add/wiki?edit%5Btitle%5D=Myriad%20Pro" title="Create node &quot;Myriad Pro&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Myriad Pro</a> and <a href="/node/add/wiki?edit%5Btitle%5D=Warnock%20Pro" title="Create node &quot;Warnock Pro&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Warnock Pro</a> (the latter a bit more adventurous than Minion in the Greek). These typefaces updated the Greek canon and provided some useful tools: a good <a href="/node/add/wiki?edit%5Btitle%5D=polytonic" title="Create node &quot;polytonic&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">polytonic</a>, substantial <a href="/node/add/wiki?edit%5Btitle%5D=character%20set" title="Create node &quot;character set&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">character sets</a>, wide <a href="/node/16845" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">families</a>, and <a href="/node/12237" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Unicode</a> <a href="/node/add/wiki?edit%5Btitle%5D=encoding" title="Create node &quot;encoding&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">encoding</a>.</p>
    <p>Since the mid nineties Greece is becoming increasingly more confident of its position and culture, with the zenith marked by the entry into the Eurozone and the Olympics. Less observed, but equally important, was the proud welcoming of the Byzantine heritage, signified by the major “Glory of Byzantium” exhibition in the Metropolitan a few years earlier. In short, the not-so-clearly defined Byzantine character, which mixed influences, religions, languages, and traditions, was recognized as a full (and in my view the main) progenitor of the modern Greek&nbsp;society.</p>
    <p>So, as Minion was reflective of the less confident nineties, needing to re-state the fairly old paradigms, <a href="/node/add/wiki?edit%5Btitle%5D=Garamond%20Premier%20Pro" title="Create node &quot;Garamond Premier Pro&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Garamond Premier Pro</a> Super-Long Name Extra revisits the sixteenth century models for the Greek, and updates them for the current context, in a very twenty-first century interpretation. In many ways it would have been impossible for a major publisher to put out a typeface like this much earlier; but the time is ripe now, and similar approaches in less visible quarters echo this approach to re-interpreting Greek. So, if you want a text typeface with all the bells and whistles, give it a&nbsp;go.</p>
    <p>To read the full discussion, see the thread on <a href="http://typophile.com/node/12216">Adobe’s Garamond Premier&nbsp;Pro</a></p>
