    html: |-
      <p>I absolutely adore Fresco Sans, but there are some issues with it that you might want to keep in mind. Its loose spacing works great at text sizes, but when set large (in an editorial context) I almost always have to tighten things up, something that Fresco’s shapes doesn’t handle very well (e.g. needs a lot of manual kerning). For more “silent” work, you could get away with the default spacing, but it doesn’t hold up well when you want some punch. The small caps are almost at x-height, and pretty unusable for editorial work. Bits and pieces of the extended character set (particulary those necessary for typesetting Norwegian) also stray too far from convention for my taste. So much so, that I had to ask permission to make a few modifications.</p>
      <p>But I love it. It is such a beauty! Nobody is perfect, I guess.</p>
