      <p><cite>I often wonder how many designers just run the Adobe auto-hinter and forget it because trying produce and test well-hinted cross-platform fonts seems to involve a tremendous amount of trial-and-error.</cite></p>
      <p>Actually, if you prepare your fonts well for hinting such as setting good values in the standard stems, the alignment zones and the blue scale, the Adobe hinter does a fantastic job! It is a professional tool. Afterwards you can test the fonts and if you see some strange things you can manually tweak the hints to make the rendering better.</p>
