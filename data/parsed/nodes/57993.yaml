      <p><em>Have you noticed that Times New Roman looks crappy in IE9?</em></p>
      <p>Times New Roman was never a good choice as a screen font. It ended up being a core font on computers because it was a core font on laser printers. The Windows version was brilliantly hinted for black and white full pixel rendering, but in antialiased and particularly subpixel environments you get greater fidelity to the outline forms, which in this case means greater fidelity to something that isn't well suited to being a screen type.</p>
    html_clean: |-
