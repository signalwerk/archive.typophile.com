      <p>Like I said, AFAIK the patented TT instructions are not useful. In the context of teaching someone what TT instructions can do for AA type, the patented TT instructions have no effect on the quality of anti-aliased type. FreeType is not waiting to 'flurry' AFAIK.</p>
      <p>The patented diagonal instruction should not be interpreted by feeble rendering, which is what sii's displaying, undoubtably on a windows machine. My guess is that the graphics state is not being properly managed in relation to the use of reference point settings during the positioning of certain diagonal stroke boundaries. </p>
      <p>Sii, inform us of the age of this illustration, the source of the font and hints, please. :)</p>
      <p>&gt;Basically: to what rendering concoctions are our web type specs subject?<br>
      Basically, unless you 'demand' the web user alight on a standard CSS size, like 'medium', (so you can take over the sizing from there, if you can), you have no control over size.</p>
      <p>Cheers!</p>
