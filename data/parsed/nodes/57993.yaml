      <p>R.Fink&gt; That's exactly what you must do - test them ... and find a middle ground.</p>
      <p>Middle ground huh? </p>
      <p>You have to write complete y hints for many glyphs in all fonts that are going to appear well on Windows up to 67 pixels per em until the screen resolution horizon is 300 as far as you can see ahead and 120 as far as you can see behind.  You can only do a good job, no better or worse. If you do a good job, nobody notices or cares. And if you don't do a good job you get racked in the court of quality. Nobody wants to hear puny excuses about time and money, ya slackers. You can't steal hints and you can't autohint everything, so you've got to know something about hinting or cry. Oh yeah! and most fonts designed for print text don't work for web body text or smaller, so before you even start hinting, if you're planning on body type, start drawing like they were hinted already you lilly-livered sap-suckers. Go eat yer worms and like 'em, or go stand on the ruined wall and cry for mercy at the Gates who set loose the hounds of ClearType Hell.</p>
      <p>T.Brown&gt; Basically: to what rendering concoctions are our web type specs subject?</p>
      <p>What indeed. The W3C's documentation for the "text-rendering" property is a good place to start. :)</p>
