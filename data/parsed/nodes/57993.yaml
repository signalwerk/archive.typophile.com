      <p>If the reason hinting might "become obsolete" is that device resolution will increase so much that the human eye won't notice a pixel here, a pixel there, I would argue that there will always be room for low-resolution technology. Will we allow this segment of typographic practice to suffer? Or will the selection of typefaces for this segment always be limited due to the overhead of hinting?</p>
      <p>If the process of hinting is unnecessarily complex, we should criticize it. On the other hand, if it is what I think it is –&nbsp;many talented but autonomous professionals, working on their piece of the type rasterization assembly line –&nbsp;we should try to clarify it, or at least talk with these professionals (and listen when they talk with one another).</p>
