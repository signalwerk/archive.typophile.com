    html: |-
      <p>If you're talking about PS fonts, then running the Adobe auto-hinter is going to produce pretty much the same results as manually putting in hints: there may be occasionally different decisions for certain features, but major stems will get the same hints. The ‘big’ differences in PS rendering will be affected by font-level hints: standard stem values, blue zones and blue scale.</p>
      <p>However, despite significant improvements in PS rendering (and the smaller size of CFF fonts), screen typography remains dominated by TrueType fonts. And the diversity of TT rendering models is much greater than that of PS: everything from Apple Quartz rendering completely ignoring all hints to b/w bitmap displays that rely on deep hinting down to the individual pixel level.</p>
