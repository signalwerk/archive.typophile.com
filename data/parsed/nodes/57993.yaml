      <p>I've always thought the <a class="freelinking external" href="http://www.adobe.com/devnet/font/pdfs/T1_SPEC.PDF" rel="nofollow">Adobe Type 1 Font Format</a> spec did a good job of explaining at least some of what's going on with Type 1 hinting.</p>
      <p>I am biased, but I've always liked the Type 1 approach to hints. The key is in the word "hints"... they offer some advice about the dimensions of the font and its glyphs, which the renderer can use to make better decisions. TrueType instructions are cool (and there was a brief time many years ago when I did it "professionally"), but as many have observed, it's starting to look like a lot of hard labor for diminishing returns.</p>
      <p>Even if one imagines displays becoming more common in higher resolutions, Type 1 (PostScript, CFF, whatever) hints still look useful. Remember, Adobe's initial concern was making type look good on early 300 dpi printers, not screens. Of course, those printers didn't have the benefit of grayscale antialiasing as screens usually do, but still...</p>
