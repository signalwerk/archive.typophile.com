    <p>The August edition of the Metal Type Newsletter is now out.</p>
    <p>There's a bit of bonus video footage this month. As well as telling you about what's been happening on the site over the past onth I've posted some video and photographs that I took at the Great Yorkshire Show.</p>
    <p>The Great Yorkshire Show is now the UK's biggest agricultural show and a great day out. As well as showing you some film of the horse shoe-making competition, there's a montage of photographs including one of The Duchess of Cornwall, aka Camilla Parker Bowles, Prince Charles's second wife.</p>
    <p>Click here to take a look at this month's video:<br>
    <a href="http://j.mp/k5KA95" title="http://j.mp/k5KA95">http://j.mp/k5KA95</a></p>
    <p>Also don't miss out on a superb run-through of British Print Trade Union cards, dating from 1946-1993.</p>
    <p>This is a unique collection of typesetting union cards that reflect the different typographical styles of five decades.</p>
    <p>Click here to take a look:<br>
    <a href="http://j.mp/mP6yna" title="http://j.mp/mP6yna">http://j.mp/mP6yna</a></p>
    <p>All the Best<br>
    Dave Hughes<br>
    York, UK</p>
