      <p>Have you ever heard about Purup Prepress AS, Denmark?<br>
      They were market leader for technical design of labels and packaging in the 1990ies.</p>
      <p>Before I hooked up there as a region sales manager (I am a newspaper specialist, coming from Atex) I had no idea how difficult and experienced packaging printing is. Purup gave me a chance to learn a lot. Purup did a good job for education and documentation of their technology. I know e.g. there is a movie for free download on Lars Kähler's Global Type:<br>
      <a href="http://www.global-type.org/Film-Purup.543.0.html" title="http://www.global-type.org/Film-Purup.543.0.html">http://www.global-type.org/Film-Purup.543.0.html</a><br>
      (157 MB - 50 minutes) - so a lot of download-time.<br>
      But the film is great.</p>
      <p>Georg<br>
      PS: And because life has a lot of humor, today the landlord of my Preußisches Bleisatz-Magazin is Bagel-Druck. The produced (and still produce) their designs for labels and packaging with Barco, Purup's hangman...<br>
      <a href="http://www.bagel-druck.de/english/index.htm" title="http://www.bagel-druck.de/english/index.htm">http://www.bagel-druck.de/english/index.htm</a> </p>
      <p>Georg</p>
