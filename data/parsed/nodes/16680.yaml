    html: |-
      <p>FYI:<br>
      Antikva Margaret was a winner in the 1966 International Type Face Design Competition sponsored by Visual Graphics Corporation (VGC), maker of the Typositor filmsetting machine. It was designed by Zoltan Nagy of Hungary. I believe there is an effort to revive it by current Hungarian designers, not sure of who to contact.</p>
