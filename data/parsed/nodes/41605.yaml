      <p>I can’t speak for UK laws, but a lot of US laws pertaining to disability issues have some rather large loopholes in them.</p>
      <p>I’m guessing some of the issues related to graphic design, such as public signage and government produced documents adhere to some more specific regulations. However, things like web sites really haven’t been regulated to that great of an extent yet. Again, I’m just talking about US laws at the moment. I know the UK has been a bit more specific regarding some of this (and, of course, any legislation in ’95 likely doesn’t have a whole lot of relevance to specific things like the Web)</p>
