      <p>You’re not concerned about SENDA and DDA 2005? Well, anyway, here are some research <em>hints</em>:</p>
      <p>1. Adaptive Environments.<br>
      2. EIDD.<br>
      3. The Power of Information (Mayo and Steinberg).<br>
      4. Go to the European Disability Forum and search on media disability.<br>
      5. W3C WAI and WCAG.<br>
      6. IBM Able.<br>
      7. Photosymbols.<br>
      8. And for a proper student enragée, something has happened with Watchfire and Bobby Online.</p>
