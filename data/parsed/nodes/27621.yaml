      <p>Hi Kristian</p>
      <p>The last time I did this - adapting two 'bespoke' typefaces for a London studio in the early 1990s - the entire job was charged out at my hourly rate. The completion of the job was the sign-off point at which the studio director was satisfied that the resulting fonts were adequate for the studio's purposes. I recall that the whole project took about three weeks.</p>
      <p>I'm really not sure that this scenario would apply to today's practice for font production; for a couple of things, the software is smarter and chargeable man-hours are cheaper. Many other people on typophile may have better or more up-to-the-minute advice on this. </p>
      <p>If you believe that there will be a significant difference between the time/price you estimate and what you will eventually bill for payment, it would be wise to sit down with the client and agree a 'ballpark' figure, i.e. the maximum possible invoice amount. This needs to be itemised against the deliverables on the project - in this case, three weights of (the roman only?) the new typeface.</p>
      <p>As you don't yet know the full complexity of the project, extras like italics, small caps, screen-optimised fonts, condensed styles, extra weights, custom characters, ligatures, alternate numerals etc. etc. may get added onto the project, for which you should be able to charge 'pro rata' in other words, at your going rate.</p>
      <p>Most designers I know now insist on scheduled installments on a project - both for supply of the deliverables and payments. Setting all this out in advance should help you and your client come to a detailed understanding of what will be involved.</p>
