      <p>If you are designing the three fonts from scratch figure out how much time it will take and what your hourly rate is. A discussion here a year or so ago covered some of this. </p>
      <p>If you figure the average typeface can take 3 or 4 weeks working full time, what does that come out to, based on your hourly rate. (and please figure on a real hourly rate, one that it would take to run your business, not some figure you would be happy to get pushing pixels on someone else's workstation, in someone else's studio) </p>
      <p>That's for the first font, now you have two more. If you haven't done this sort of work before I think it will take you longer than these time estimates.</p>
      <p>What are the licensing issues? Will the client own exclusive rights to the work, or will you be able to offer it to others?</p>
      <p>Don't sell this work cheap. It takes a lot of time to create a quality font.</p>
