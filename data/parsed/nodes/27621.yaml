      <p>James is right; better not to underprice this project. Of course he points out that working from scratch, and possibly for the first time, on this will be very time-consuming and labour-intensive. </p>
      <p>Kristian, your initial post makes it sound like the character shapes for this new typeface are already decided, and you will be responsible for generating three weights of the roman. </p>
      <p>I should add that this is more-or-less what happened in that 90s project I mentioned – and I've edited my earlier post to explain this better. I generated just the regular weight of the romans (no italics! no extra characters!) from two designs that already existed as rubylith masters; both of them were bastardised forms of typefaces better known by other names. There is no way I could have generated the characters from scratch within that timeframe. </p>
      <p>At a rough guess, the three weeks work at that rate was about £6 – 7k. This means that the commissioning studio had budgeted more than £3k per font; although that might sound expensive, I recall that they planned to leverage much more value of work out of these particular typefaces after the project was completed, so for them it appeared as a reasonable investment.</p>
