    <p>I’ve just received a job – developing three different weights for a new typeface. Usually debit about 30–50 €, but since I don’t yet know the full complexity of the project the summation can easily blow out of proportions. What kind of arrangements would you suggest?</p>
    <p>/Kristian</p>
