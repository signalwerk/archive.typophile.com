  html: "<p>{I need the forum as a channel for resolving a certain issue - sorry.} <br> <br>Dear Mr Hosek, <br>Normal channels of communication have failed. The last time this <br>happened, a post to Typo-L succeeded in getting through to you,  <br>but this time that hasn't worked either, so I am now trying this <br>forum, hoping to get a refund on Serif, which has not shipped an <br>issue in about three years. <br> <br>This past September you wrote on Typo-L: \"I'll give refunds to <br>the impatient\"*. I declared myself as impatient and asked for a <br>refund. I was advised on September 26 that the refund has been <br>issued but it would take upto two billing cycles. It's now been <br>about four cycles, and still nothing. Could you please let me <br>know what to expect? Is there perhaps some information <br>I could throw at my bank? <br> <br>* <a href=\"http://listserv.heanet.ie/cgi-bin/wa?A2=ind0209&amp;L=typo-l&amp;D=0&amp;T=0&amp;P=12097\" target=\"_blank\">http://listserv.heanet.ie/cgi-bin/wa?A2=ind0209&amp;L=typo-l&amp;D=0&amp;T=0&amp;P=12097</a> <br> <br>Sincerely, <br>Hrant Papazian <br> <br> <br>Ref: <a href=\"http://www.typophile.com/forums/messages/4100/2509.html\" target=\"_blank\">http://www.typophile.com/forums/messages/4100/2509.html</a> <br></p>"
