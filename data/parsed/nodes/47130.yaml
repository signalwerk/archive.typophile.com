      <p>It sounds like your client maybe isn’t providing very much context or direction for you. Wanting ’a logo students will like’ is way too vague for it to be much help for you.</p>
      <p>What are your clients goals with the redesign? What didn’t work with the original logo?</p>
      <p>We could comment on these, but it really wouldn’t be much help in terms of what your client wants.</p>
