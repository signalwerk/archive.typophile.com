      <p>I’m using Quark. Have been using 4.1 on a Mac G4 for years. It’s brilliant *in as much that* it’s very fast and although it doesn’t have all the bells and whistles, I can create just about every visual effect that v7 can by way of close integration with Photoshop and Illustrator without spending TOO much extra time on things. Now I’m using v7 on an iMac 2.8GHz (2Gb RAM). Oh dear...</p>
      <p>I’m sick to the back teeth of it. It garbles bitmap TIF files and the only way I can get the images to reproduce properly is by replacing them with .psd files, which adds a lot of extra weight to the documents. THEN there’s the issue of PDF creation - it’s cr@p, cr@p, cr@p!!!</p>
      <p>Quark 4 - make your document. Utilities -&gt; create PDF; wait while Quark creates a reasonably sized EPS file, opens Distiller automatically, produces PDF file incredibly efficiently.</p>
      <p>Quark 7 - make document while having to work around its flaws, including the problem just mentioned. File -&gt; Export to PDF. Wait while Quark creates an impossibly huge EPS file (a looooooooong time...) and then be amazed when after a similarly lengthy amount of time, a PDF of totally unusable file size has been produced. Doing it through Distiller doesn’t make the file much smaller, but does reduce the time the PDF stage takes considerably. But it’s the EPS file creation that is the real killer - I’m getting Gb sized files.</p>
      <p>I’ve pulled my hair out trying to get to the bottom of all of this via various forum discussion - it scares me just how many people come up against this. Does anyone here have any ideas? I’m finding all this pathetic. I have InDesign now. I’m not using it in anger yet, but the beauty of it being able to seemingly easily convert my Quark 4 files is looking all too appealing...</p>
      <p>help!</p>
