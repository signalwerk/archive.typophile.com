      <p>I find Adobe Bridge (using CS2 on a pre-Intel mac) sluggish and cumbersome. Every time I have tried to use it I have been frustrated. I actually use iView which is free and less intrusive than iPhoto and lets you organize and view your photos really easily. That is essential for the kind of work I do, which often involves sequencing photos. I set up the sequence in iView and then lay it out in Quark or InD. You can actually drag photos into those programs from iView.</p>
      <p>I’m sure Bridge is a fine software and probably just need to sit down with someone who can show me how it is supposed to work.</p>
      <p>@Chris - yes, that was what I had heard about intel/non-intel and the various CS versions, which is the main reason I’ve hung onto my CS3 without installing it. Also I really dislike the InDesign Interchange system; wish they had a better way to downsave. In Quark you just downsave and it gives you an alert that you are doing that (which of course you already know) but the file isn’t altered.</p>
