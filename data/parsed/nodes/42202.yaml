      <p>I dunno, maybe I’m just more of a production type. Yes, I’m more familiar with Quark. Then again, I came to Quark at version 3. I’d been using an old version of PageMaker that limited me to one-page docs, and I was going to be laying out my very first book. This was not a design job. Quark 3 was what the book packager I was subbing the layout work from had their template in.</p>
      <p>After awhile PageMaker came out with a version that allowed multi-page docs and books became possible. A non-profit I did book design and layout for over the course of a few years had PageMaker and was not about to spend money and time on the upstart, Quark.</p>
      <p>At the time, no one had been dealing with PDFs. This changed for me around 1999. Once I discovered PDFs and printers began accepting them, I tried to send only PDFs to my clients, retaining control over the native files in case of reprints and new editions. I always described them as “cross-platform, printer-ready PDFs,” hoping it wouldn’t occur to the client that most of the value was in the native files.</p>
      <p>When InDesign came along, it seemed to be PageMaker on steroids. I learned InDy on version 2, recreating the look of a previously published book’s new edition. It had originally been done in Quark, but whoever had done the first book held on to the native files, so I was hired to create a book that looked like the old one. InDy was easy to learn and use, tho’ through the first CS version I wasn’t much impressed with InDy’s much vaunted type-handling powers. Perhaps it was my growing experience with InDy, but I find that in CS2, I like how it handles type a lot more.</p>
      <p>As I said, most of the places for which I work use Quark. If it’s not a design job, but straight book layout, I’m provided a template. 95% of the time the template is still a Quark template.</p>
