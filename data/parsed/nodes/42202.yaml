      <p>Patty —</p>
      <p>The leading thing can be turned off: Preferences &gt; Type — check “Apply Leading to Entire Paragraphs” under Type Options. This will give you behavior more like Quark’s. I don’t know why this is off by default. I always tell my designers to change their default preferences to have this option turned on.</p>
      <p>BTW, I was an avid Quark user for many years, and even though I’ve been using primarily InDesign for the past few years, it’s still not as fast and efficient as I was in Quark. At first I chalked it up to learning curve. But after a couple years, it seems to me that there are just several basic day-in-day-out actions that require more mousing and menu-hunting in InDesign than in Quark, no way around it.</p>
      <p>Now that Q7 supports OT, I should get back into it.</p>
      <p>— K.</p>
