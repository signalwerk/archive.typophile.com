      <p>Perhaps some useful script can be found in the scripts list provided by the swiss user forum “hilfdirselbst”:</p>
      <p>KerningOrNoBreak.js<br>
      Weist definierten Zeichenfolgen (extern) entweder automatischen Kerning oder das Zeichenattribut “Kein Umbruch” zu.<br>
      (applies automatic kerning or the character style “no break” to externally pre-defined strings of characters)</p>
      <p>KerningSuchen.js<br>
      Ermöglicht das Suchen nach definierten Kerningwerten.<br>
      (enables seeking for pre-defined kerning values)</p>
      <p>see here: <a href="http://hilfdirselbst.org/index1.php?read_article=16" title="http://hilfdirselbst.org/index1.php?read_article=16">http://hilfdirselbst.org/index1.php?read_article=16</a></p>
