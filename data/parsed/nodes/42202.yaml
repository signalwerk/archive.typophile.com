      <p>Patty, possibly this helps, too: </p>
      <p>Character styles in InDesign are a different cup of tea compared to Quark and some other programs: In Indesign they report <strong>only the differences</strong> between them and the paragraph style. So a paragraph style can contain e.g. simply a different color or size, nothing else. </p>
      <p>Just try e.g. creating a character style based on a word which is marked bold. When looking into the new character style dialog box, all of the definition fields are empty, there is only one field with “bold” in it. </p>
      <p>This means, if you don’t specify the leading in the character style dialog box, the leading of the paragraph style will be applied unchanged.</p>
