      <p>OK I just figured out something I find VERY problematic about InDesign (and which is requiring a lot of extra work on my part). </p>
      <p>When you create a Character Style, InD assigns it leading. If you then go back and change the leading of the Paragraph Style, the leading of the Character Style will override it. What the hell is up with that? In Quark, the Paragraph Style contains the leading, the point of Character Style is to apply it only to certain characters or words within the paragraph, not to affect the attributes of the paragraph itself.</p>
      <p>I also find it odd that you can change the leading of only one line of a paragraph in InD. In Quark you simply have to place your curser anywhere in the paragraph (or line if it’s one line long) and you can change the leading. In InD you have to select the entire bloody thing.</p>
      <p>Plus - why isn’t there a key command action in InD to call up the “Text Frame Options” pane? That is a very useful pane, and it drives me nuts to have to go to the menu each time.</p>
      <p>OK griping over for now.</p>
