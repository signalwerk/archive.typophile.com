      <p>Eric, thank you for the first valid explanation I have yet to receive as to why InDesign doesn’t have kerning pairs. But I will say that since Illustrator and P-shop are not really designed for typesetting it seems to me this feature is less significant there. Not a good reason to hold up implementing it in InD.</p>
      <p><cite>This means, if you don’t specify the leading in the character style dialog box, the leading of the paragraph style will be applied unchanged.</cite></p>
      <p>The way I create style sheets is to mock up a design I like and then select the various elements one by one and make style sheets directly from them. I don’t know if everyone works this way, but it was a feature of Quark too and it is infinitely easier than creating style sheets from scratch. </p>
      <p>What happened was that I created a paragraph style sheet for recipe directions and then a character style sheet for the step numbers. I didn’t do anything to the leading when I did that. I later changed the leading in the paragraph style sheet, and it didn’t occur to me that I then had to change it in the character style sheet as well. And then I didn’t notice for a long time that the char. style sheet was overriding the paragraph style sheet and inserting an additional point of lead. Lots of work to go back and fix alignments and such.</p>
