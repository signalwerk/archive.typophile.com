      <p>I’m a fully-committed InDesign user that only rarely launches Quark, usually only to re-save old documents into versions that can be converted to InDesign documents. </p>
      <p>And it’s a shame, really. Using Quark on a day-to-day basis was a blast. I remember it as one of the most responsive and enjoyable programs I’ve ever used. As gamers would say, it had great “playability.” Working in  Quark was like improvising on the piano. It had it’s flaws for certain, but for practiced users it all but disappeared under your hands. </p>
      <p>At its height I think Quark enjoyed 85% market share. Unfortunately the company decided to celebrate with intensely predatory pricing, openly hostile customer service and a manic obsession with security. Many of us were openly begging Adobe to hurry up with getting InDesign to market. And I’m sure Quark saw in Adobe the end of their monopolistic spree and tried to squeeze as much out of the market as possible before getting kicked back.<br>
      I may be wrong, but it seems that these days most Quark users are holdovers from this earlier era. A majority of working designers have switched to InDesign and, unless I’m mistaken, a majority of formal design education in InDesign as well, so it’s what all the kids are using. But surely somebody becoming acclimated to InDesign and <em>then</em> switching to Quark is rather rare?</p>
    html_clean: |-
