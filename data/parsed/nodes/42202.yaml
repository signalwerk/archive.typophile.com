      <p>In response to William -<br>
      I totally agree and we have heard about built-in kern pair editing from multiple sources; I remember the childrens’ books publishers being especially persuasive. I could deliver the normal “resource constraints” and “feature trade-off” excuses but the biggest reason why this feature is difficult for us is that we feel it would be a mistake to have a kern pair editor that could not share the updated kerning with at least Illustrator &amp; Photoshop. That makes InDesign’s ranking of the feature less of a determining factor. We are still working on the global solution and we’re trying to assist plugin developers who are working on InDesign-only solutions.</p>
