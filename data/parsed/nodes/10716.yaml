  - id: 67408
    user: 1250
    date: 2003-03-13T12:59:00
    date_raw: 13 Mar 2003 — 12:59pm
    votes: null
    html: <p>Well, in any case it's best to give credit to the source. But if you're going to release it (especially for money), then it gets trickier. Technically you might be OK (like in the US it would be legal for you to work from a scan of the source), but it's not ethical unless the "owner" gives an OK. The owner might be the designer, or a client who's already paid for the original, or a bunch of other things. Some people even call for getting permission for anything at all (even just opening up a digital font in Fontographer, believe it or not), but those people are fundamentalists - best simply ignored. <br> <br>hhp <br></p>
    html_clean: <p>Well, in any case it's best to give credit to the source. But if you're going to release it (especially for money), then it gets trickier. Technically you might be OK (like in the US it would be legal for you to work from a scan of the source), but it's not ethical unless the "owner" gives an OK. The owner might be the designer, or a client who's already paid for the original, or a bunch of other things. Some people even call for getting permission for anything at all (even just opening up a digital font in Fontographer, believe it or not), but those people are fundamentalists - best simply ignored. <br> <br>hhp <br></p>
