    html: <p>Thank you. This type is a result of a project for class. My intent was to juxtapose classic letterforms with the effects of weathering. I find it interesting how rust works and that it is generally eating forms that were magestic and beautiful. Rust was the texture I was shooting for but I found it difficult to emulate.  <br> <br>I appreciate the warnings. I'm fairly sure this won't be released for public use, it is merely my first attempt at type design. Is there anyway to work with what I have to make it more acceptable, or would I have to start from scratch? <br> <br>Jen <br> <br></p>
