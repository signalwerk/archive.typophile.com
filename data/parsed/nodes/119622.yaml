    html: <p>The weight of the digits and -mainly- the shape of /8 makes this specific sample closer to the <strong><a class="freelinking external" href="http://www.findmyfont.com/index.php/fonts/font-preview?fset=DanXSolo%20%2F%20%28Commercial%29&amp;ffam=BoulMich%20-%20Regular&amp;fid=39a094fe253f276923127da1af98d3ea&amp;fsize=60&amp;text=38&amp;fit=1" rel="nofollow">Boul Mich</a></strong> digitization of Dan X. Solo than the <a class="freelinking external" href="http://www.findmyfont.com/index.php/fonts/font-preview?fset=Wordshape%20%2F%20%28Commercial%29&amp;ffam=Boul%20Mich%20-%20Black&amp;fid=a17f8c413d176f35e5ff6e03cf5d78d3&amp;fsize=60&amp;text=38&amp;wrap=2" rel="nofollow">Wordshape's</a> digital version (though the later is much easier to acquire).</p>
    html_clean: <p>The weight of the digits and -mainly- the shape of /8 makes this specific sample closer to the <strong><a class="freelinking external link-external" href="http://www.findmyfont.com/index.php/fonts/font-preview?fset=DanXSolo%20%2F%20%28Commercial%29&amp;ffam=BoulMich%20-%20Regular&amp;fid=39a094fe253f276923127da1af98d3ea&amp;fsize=60&amp;text=38&amp;fit=1" rel="nofollow">Boul Mich</a></strong> digitization of Dan X. Solo than the <a class="freelinking external link-external" href="http://www.findmyfont.com/index.php/fonts/font-preview?fset=Wordshape%20%2F%20%28Commercial%29&amp;ffam=Boul%20Mich%20-%20Black&amp;fid=a17f8c413d176f35e5ff6e03cf5d78d3&amp;fsize=60&amp;text=38&amp;wrap=2" rel="nofollow">Wordshape's</a> digital version (though the later is much easier to acquire).</p>
