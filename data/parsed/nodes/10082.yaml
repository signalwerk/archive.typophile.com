    html: "<p>This question is a bit of a sticky wicket. How much text do you need to set? If it isn't more than a paragraph, you could always use pen, paper and photocopier. Just teasing. I believe that FontLab has 30 day trial versions that might get you started. You might look at their comparison page and perhaps find that you don't need FontLab and can make due with one of their other software packs. You could also scour ebay for a copy of something used, Fontographer for instance. Unfortunately, to make quality typefaces isn't something that can be done for free. <br> <br>Downloads: <a href=\"http://www.fontlab.com/Font-utilities/Try-out-FontLab-Products/\" target=\"_blank\">http://www.fontlab.com/Font-utilities/Try-out-FontLab-Products/</a> <br>Compare: <a href=\"http://www.fontlab.com/Font-tools/Product-Comparison-Chart/\" target=\"_blank\">http://www.fontlab.com/Font-tools/Product-Comparison-Chart/</a></p>"
