    html: "<p>Interesting to me that we want to begin by recommending a piece of software. That was my first reaction too. <br> <br>If you want to make quality fonts, I'd suggest investing time and alas, money in a class from somebody who knows what they're doing. I see you are not too far from new york city. Type Director's Club offers a masterclass on type design over 4 saturdays (intro to drawing glyphs), see <a href=\"http://www.tdc.org\" target=\"_blank\">www.tdc.org</a>. SVA offers several type related options (but coming down for a semester on weekdays might be an issue) <a href=\"http://www.sva.edu\" target=\"_blank\">www.sva.edu</a>. <br> <br>Without spending money, you can get some type education by visiting: <br><a href=\"http://briem.ismennt.is/\" target=\"_blank\">http://briem.ismennt.is/</a> <br><a href=\"http://www.typeworkshop.com\" target=\"_blank\">http://www.typeworkshop.com</a> <br><a href=\"http://typophile.com/articles/typefacedesign110/index.html\" target=\"_blank\">http://typophile.com/articles/typefacedesign110/index.html</a> <br><a href=\"http://just.letterror.com/ltrwiki/SketchingType\" target=\"_blank\">http://just.letterror.com/ltrwiki/SketchingType</a> <br>Browsing around here at typophile (take all comments with a grain of salt). We speak hyperbole. <br> <br>There is no substitute for flesh and blood instruction. <br> <br>Happy drawing. <br>Randy</p>"
    html_clean: "<p>Interesting to me that we want to begin by recommending a piece of software. That was my first reaction too. <br> <br>If you want to make quality fonts, I'd suggest investing time and alas, money in a class from somebody who knows what they're doing. I see you are not too far from new york city. Type Director's Club offers a masterclass on type design over 4 saturdays (intro to drawing glyphs), see <a href=\"http://www.tdc.org\" target=\"_blank\" class=\"link-external\">www.tdc.org</a>. SVA offers several type related options (but coming down for a semester on weekdays might be an issue) <a href=\"http://www.sva.edu\" target=\"_blank\" class=\"link-external\">www.sva.edu</a>. <br> <br>Without spending money, you can get some type education by visiting: <br><a href=\"http://briem.ismennt.is/\" target=\"_blank\" class=\"link-external\">http://briem.ismennt.is/</a> <br><a href=\"http://www.typeworkshop.com\" target=\"_blank\" class=\"link-external\">http://www.typeworkshop.com</a> <br><a href=\"http://typophile.com/articles/typefacedesign110/index.html\" target=\"_blank\" class=\"link-lost\">http://typophile.com/articles/typefacedesign110/index.html</a> <br><a href=\"http://just.letterror.com/ltrwiki/SketchingType\" target=\"_blank\" class=\"link-external\">http://just.letterror.com/ltrwiki/SketchingType</a> <br>Browsing around here at typophile (take all comments with a grain of salt). We speak hyperbole. <br> <br>There is no substitute for flesh and blood instruction. <br> <br>Happy drawing. <br>Randy</p>"
