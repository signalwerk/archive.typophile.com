    date: 2005-04-22T08:46:00
    date_raw: 22 Apr 2005 — 8:46am
    votes: null
    html: <p>There is one free program that handles TrueType/OpenType (including Kerning, etc.) <br> <br>FontForge, a simple google search will find it.  It is very difficult to get set up and working on a Windows system (it was designed for Linux), and is not the most intuitive design program I'm sure.  I have not yet started to work on hinting/instructing the font's I've made in it, but it does seem to be capable of hinting.  It can export both OpenType and Apple specific Kerning data in TrueType Fonts, and it can handle glyph substitutions as well (though I have yet to use this).  It can also export to other font formats besides TrueTypes.  I can't say how good a quality font you can make with it (I am not a professional font designer), but I have already created my own handwriting font with it, and I'm working on a Times New Roman style Serif font.</p>
