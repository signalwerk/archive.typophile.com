      <p>Caspar, stay tuned for Fontographer for OS X. It is presently in Beta, and works pretty much exactly as it always has. (Using it is like stepping back in time. Very odd sensation.)</p>
      <p>I heartily recommend FontLab, which is the Concorde to Fontographer's Sopwith Camel. Which is purely my opinion; some people swear by RoboFog, which is a Python-fueled version of an even older generation of Fontographer.</p>
      <p>There is a "diet" version of FontLab called TypeTool, which might be the right tool for someone wanting to try on the FontLab editing environment. And it only costs $99.</p>
      <p>FontLab makes all of the above-mentioned sotware, and they do a great job.<br>
      <a href="http://www.fontlab.com/" title="http://www.fontlab.com/">http://www.fontlab.com/</a></p>
      <p>Oh, and I forgot to say: You can download trial versions of their software, so you can get the applications for free, but there will be limits when you generate the fonts.</p>
