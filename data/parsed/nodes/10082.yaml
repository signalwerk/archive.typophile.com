    html: |-
      <p>Installing and using Fontforge is <strong>not extremely difficult!</strong></p>
      <p>Although it's still not ready, check out the <strong>Document Section on How to Install Fontforge on Windows, OSX or Fedora Linux.</strong></p>
      <p><a href="http://www.typeforge.net/cms/index.php?option=com_content&amp;task=category&amp;sectionid=4&amp;id=24&amp;Itemid=31" rel="nofollow"> Typeforge Documents Section </a></p>
      <p>This website will be concentrating on how to (start to) Type Design featuring the whole sketch-to-digital typeface . For now, Akzidenz revival - we are currently sketching...</p>
      <p>Actually, I think using Open Source software is the best way to learn  some subjects (like Typography and Webdesign) and to motivate people to push forward. Otherwise people tend to stick to the available commercial solutions... and sometimes fail to see the true principles of the art/craft behind the software mask. Even if sometimes Open Source software is quirky, technicaly challenging and hard to master...</p>
      <p>On the other hand, if you do want to take it to the professional level you should use professional level editor like Fontlab. You shouldn't go for the $50 solutions.</p>
      <p>Cheers,<br>
      Pedro</p>
      <p>——<br>
      <a href="http://www.typeforge.net" rel="nofollow">www.typeforge.net</a></p>
