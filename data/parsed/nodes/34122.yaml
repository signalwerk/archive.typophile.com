      <p>is there some colour based reasoning behind the choice of each letter or is it just arbitrary? cos that makes me wonder what the point is.</p>
      <p>It reminds me of when I was younger and my friend and I translated extracts of a book into music by assigning a note to each letter of the alphabet. But there was no reasoning to it, we just started with a, and started with a. it sounded odd, but was kinda fun - my point is however it was completely impractical and imparted no feeling or meaning from the book at all, except you could see patterns from common letters like 'e's and'a's.</p>
