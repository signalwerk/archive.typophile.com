    html: |-
      <p><cite>«Sanscript is said to have been created by monks meditating for months on the sounds of their language.</cite></p>
      <p><em>Have you seen Sanscript, No connection at all.»</em></p>
      <p>I wasn’t aware that meditating monks were prone to the creation of <a href="http://www.nwoods.com/sanscript/" rel="nofollow">programming environments</a>.</p>
      <p>&nbsp;</p>
      <p><cite>«Are you suggesting that there is a relationship NOW between the shapes of the letters and the sounds that they represent ?»</cite></p>
      <p>Why does that even matter? And how does Kromofons do anything to change it? The fact that you enhance (as you claim, though this is highly doubtful to begin with) the connection between the shape/colour of an individual letter and the sound it represents on its own doesn’t change the fact that individual letters frequently lose or change their inherent sound when used in conjunction with other sounds. You’d have to apply Kromofons to pure IPA for it to make any kind of sense, and even then, it would present no actual improvement, since two people will usually pronounce the same word differently.</p>
      <p>And yes, <em>o</em> is a fairly good graphic depiction of the sound the letter represents.</p>
      <p>&nbsp;</p>
      <p>A bit silly, perhaps, to be responding to (and even asking questions to) someone who most likely just signed up and disappeared again those 11 months ago. Best consider this a rant, I guess.</p>
