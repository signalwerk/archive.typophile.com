    html: '<p>It would be cool if it happened automatically--less confusing to the user. Maybe it could be an additional choice in the OT menu--"Case Sensitive Forms". Very likely, though, it would be too tricky to implement that way. I can imagine some ambiguous situations. For example: (Apple Computer UK) Do you use the parentheses designed for caps or lowercase? I would use the lowercase version in this case. The algorithm would have to look at more than adjacent characters.</p>'
