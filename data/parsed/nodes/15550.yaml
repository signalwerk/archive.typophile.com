    html: <p>I've noticed, too, that in Illustrator it is not obvious how to get case-sensitive forms to appear (brackets, dashes, etc.). The trick is to use the "All Caps" choice from the pop-up on the character palette. Just typing or converting to all caps doesn't do it. InDesign does it when you click on the all caps button on the character palette.</p>
