  html: |-
    <p>I have searched and searched, but to no avail. Can someone verify that Adobe InDesignCS, the newest, brightest star leading the way toward the opentype revolution, does not have a dedicated, always-open, opentype palette? The only two ways I've found to access and enable/disable OT features is by clicking one of two small (perhaps 10x10 pixel) interface do-dads on the measurement or character palettes, which then opens a self-closing 2-level-deep hierarchical menu of features.</p>
    <p>Has anyone tried using this on a project with a requiring a lot of manual feature adjustments?<strong> IT IS A NIGHTMARE!!!!!!!!!</strong></p>
    <p>OK I just needed to rant or hopefully, find someone to tell me to shut up, calm down as they point out where the missing OT pallette is to be found.</p>
