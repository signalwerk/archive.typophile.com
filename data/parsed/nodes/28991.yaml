      <p>Just a note on creep:<br>
      While knowing how to account for creep may be essential for hand-made books, these days imposition software adjsuts for creep automatically. I’m not suggesting that folks shouldn’t know about this issue, just that it’s likely important to be clear that someone designing a book with ten 32-page signatures does not have to adjust each and every page margin (either manually or with Master pages) to account for creep, as it is generally handled by the printer.</p>
