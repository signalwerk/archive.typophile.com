      <p><cite>What is the defining character for a Venetian Serif?<br>
      &gt;&gt;</cite></p>
      <p>Characteristic for Venetian typefaces are:<br>
      &gt; Inclined axis of the letter to the left (see o and b)<br>
      &gt; Upper wedge-shaped serifs of the minuscules (see b)<br>
      &gt; Rounded transitions between main strokes and (bracketed) serifs<br>
      .<br>
      </p><div class="imageWrap"><img src="/files/venetian_3658.gif"></div><p></p>
      <p>.<br>
      .</p>
      <p><cite>What is the difference between an em and a pica em?<br>
      &gt;&gt;</cite></p>
      <p>em: a unit of measure equal to the width of the capital letter M in a particular font<br>
      Pica em: a linear unit (1/6 inch)</p>
