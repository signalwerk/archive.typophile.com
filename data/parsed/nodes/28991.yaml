      <p><cite>What is the Golden Ratio ?</cite><br>
      .<br>
      .<br>
      &gt; <strong>Golden Ratio</strong><br>
      .<br>
      = Divine Proportion<br>
      = Golden Mean<br>
      = Golden Section<br>
      = a number often encountered when taking the ratios of distances in<br>
      simple geometric figures such as the pentagon, pentagram, decagon  and dodecahedron. It is denoted phi(φ), or sometimes “tau”. The value of golden ratio is 1.6180339887498948482...<br>
      .<br>
      .<br>
      &gt;<strong>Golden Proportions:</strong><br>
      .<br>
      The ratio of 3:5 (or 5:3) is known as Golden Proportion. Photographers and artists have long noted that viewers seem to prefer pictures which are proportioned using this ratio.</p>
      <p>Another special ratio is 2:3.5 for smaller shapes. This is the ratio of most business cards. This size, and multiples of it, seem very comfortable and familiar.</p>
      <p>Golden rectangle is most pleasing to the eyes. And its the most widely used proportion in design whether its be print or the architecture.<br>
      .<br>
      .<br>
      &gt;<strong>Construction Method: Golden Rectangle</strong><br>
      .<br>
      • Construct a unit square.<br>
      .<br>
      • Draw a line from the midpoint of one side to an opposite corner.<br>
      .<br>
      • Use that line as the radius to draw an arc that defines the long dimension of the rectangle.<br>
      .<br>
      </p><div class="imageWrap"><img src="/files/Golden_Rectangle_Construction2_3600.jpg"></div><br>
      .<p></p>
