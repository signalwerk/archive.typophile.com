      <p>A ladder is when the same word (or in some cases the same pair of letters*) appear at the beginning or end of consecutive lines (especially justified text in the case of the end of a line) forming a repeating shape, often occurs with shorter words like the, to etc. the solution is to use a soft return to turn over a word to break up the pattern.</p>
      <p>Tim<br>
      *the pair of letters is more of a concern with display text</p>
