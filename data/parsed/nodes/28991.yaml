      <p>&gt;What is the defining character for a Venetian Serif?<br>
      sloping bar on the lowercase e<br>
      The other characteristics are generally correct especially the stress but any sloping bar on a seriffed e is a Venetian.</p>
      <p>&gt;Pica em: a linear unit (1/6 inch)<br>
      or 12 points</p>
      <p>&gt;em: a unit of measure equal to the width of the capital letter M in a particular font<br>
      an em is equal to the height of the typeface, so, for 6pt type the em is a square 6pts by 6pts, it is only approximately the width of M.</p>
      <p>So the difference is that ems are a sliding scale wheras pica ems are a set unit of measure.</p>
      <p>Don’t be discouraged, my advice is to try to take in a little each day rather than stay up all night, but each to his own:)</p>
      <p>In what kind of type alignment might one expect to find rivers?</p>
      <p>What might you call a block of type that has a vertical margin on the right and not on the left?</p>
      <p>If you were asked to set type 12pt solid how much leading would you need?</p>
      <p>Tim</p>
