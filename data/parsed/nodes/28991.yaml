      <p><cite>What advantages over previous specifications has OpenType brought to type design and usage?</cite></p>
      <p>&gt;&gt;<br>
      OpenType offers several compelling advantages:<br>
      • A single, cross-platform font file that can be used on both Macintosh and Windows platforms<br>
      • An expanded character set based on the international Unicode encoding standard for rich linguistic support<br>
      • Advanced typographic capabilities related to glyph positioning and glyph substitution that allow for the inclusion of numerous alternate glyphs — such as old-style figures, small capitals and swashes — in one font file<br>
      • A compact font outline data structure for smaller font file sizes<br>
      • OpenType is natively supported in Windows 2000 </p>
      <p><cite>What is the origin of the term “leading”?</cite></p>
      <p>&gt;&gt;<br>
      Leading (pronounced ledding) is the measurement of space between lines of type. The origin of the word “leading” dates to early days of typography when lead type was used. Blank pieces of lead were used between rows as spacers.</p>
      <p><cite>In what kind of type alignment might one expect to find rivers?<br>
      In full/forceful justified text..</cite></p>
      <p>&gt;&gt;<br>
      In full/forceful justified text..</p>
      <p><cite>If you were asked to set type 12pt solid how much leading would you need?</cite></p>
      <p>&gt;&gt;<br>
      Generally it should be +2, means it should be 12+2 pt = 14pt lead..but it also depends on what typeface and where are you using.</p>
      <p><cite>In typesetting what is a ladder? How can you avoid it?</cite></p>
      <p>&gt;&gt;<br>
      ladder like structure in a paragraph..like this<br>
      XXXXXXXXXXXXXXXX<br>
      XXXXXXXXXXXXXXXXXX<br>
      XXXXXXXXXXXXXXXXXXXXX<br>
      XXXXXXXXXXXXXXXXXXXXXXXXX<br>
      XXXXXXXXXXXXXXXXXXXXXXXXXXXXX<br>
      XXXXXXXXXXXXXXXXXXXXXXXXXxXX<br>
      XXXXXXXXXXXXXXXXXXXXXXXXXXXXXX</p>
      <p>..proper returns can avoid this.</p>
      <p><cite>What is the definition of “Justification” as it applies to typography, and can a column of type be called “Left Justified”?</cite></p>
      <p>&gt;&gt;<br>
      In typesetting, alignment is the horizontal positioning and alignment of text or images within a line, typically relative to a column.<br>
      No a column can have more than one kind of justification in itself.<br>
      (not sure of this answer)</p>
      <p><cite>What is a Bleed ?</cite></p>
      <p>&gt;&gt;<br>
      Bleed is a printing term that refers to printing that goes to the edge of the sheet after trimming. Bleeds generally are 1/8 of an inch from where the cut is to be made. </p>
      <p><cite>What is ASCII ?</cite></p>
      <p>&gt;&gt;<br>
      ASCII is an acronym for American Standard Code for Information Interchange. It is a widely used standard for encoding text documents on computers. Usually when the term “ASCII” is used, it is describing a text document. If a file is described as ASCII text, this means you can view the contents of the file, change it with an editor, or print it with a printer. It does not contain any special embedded control characters.</p>
      <p><cite>What is a Masthead ?</cite></p>
      <p>&gt;&gt;<br>
      On the Internet, a masthead is a graphic image or text title at the top of a Web page that identifies the Web site and, sometimes, the particular section of the site. In addition to the name of the Web site, a masthead could include other elements such as images, text, or navigational links. The Web site masthead was named after a similar feature of newspapers and magazines, which in turn got its name from the top of a mast on a ship.</p>
      <p><cite>What is a Font ?</cite></p>
      <p>&gt;&gt;<br>
      A collection of all the characters of a typeface in one size and one style is called a font. This includes caps and lowercase, numerals, punctuation marks, and any special characters contained in the typeface, such as symbols or ligatures.</p>
      <p><cite>What does the acronym u&amp;lc mean?</cite></p>
      <p>&gt;&gt;<br>
      U&amp;LC  stands for Upper and Lower Case (International Journal of Typographics)</p>
      <p><cite>Which case would you expect find in a Titling Font?</cite></p>
      <p>&gt;&gt;<br>
      Titling fonts are type designs that have been specifically created for use in larger point sizes or display settings. They are usually all–caps.</p>
      <p><cite>What is meant by ‘casting off’? </cite></p>
      <p>&gt;&gt;<br>
      A calculation to determine how much space typeset copy will take up.</p>
      <p><cite>Name the style of numerals best suited to tabular setting.</cite></p>
      <p>&gt;&gt;<br>
      Arabic numeral</p>
      <p><cite>As a rule of thumb, how is optimal line length calculated?</cite></p>
      <p>&gt;&gt;<br>
      Ideally it should be 35—70 characters including spaces</p>
      <p><cite>Define the terms widow and orphan as they relate to typesetting. Why are they said to be undesirable? How could you avoid them?</cite></p>
      <p>&gt;&gt;<br>
      A “widow” is the last line of a paragraph that appears alone at the top of the next page, and an “orphan” is the first line of a paragraph that appears alone at the bottom of a page. Widow and orphan settings are usually set for a minimum of two lines.</p>
      <p>...............<br>
      Still there are lots of questions left...will post their answers..soon</p>
