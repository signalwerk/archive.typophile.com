      <p>“Are the US designers familiar with the metric system in the meanwhile?”</p>
      <p>Americans and american designers are “somewhat” familiar with it.  There have been a number of attempts to teach it here and to switch over to it.  The switching over part has failed quite miserably as you might expect. Even though the metric system is far more logical in every way, change is difficult at best. I think a great impediment is in the inability of people not used to the metric system to visualize a measure. Those brought up in the Enlish system have a feel for what an inch or a foot or a mile might be but can’t get a visual grasp on centemeters and kilometers.  They have to make the conversion calculation before they can “see” it.  We all know how much we love having to do a calculation thrills us so the resistance continues.<br>
      ChrisL</p>
