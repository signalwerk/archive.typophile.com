      <p>&gt;&gt;<cite>What is the most common number of pages in a signature?</cite></p>
      <p>signature are generally printed in 8, 16 or 32 page groupings.</p>
      <p>&gt;&gt;<cite>What are the advantages or disadvantages of using multiple columns in a publication?</cite></p>
      <p>Advantages: its easier and faster to read.(specially left justified)<br>
      disadvantages: can’t use in the web based publications.<br>
      **am searching for disadvantages &gt;&gt;</p>
      <p>&gt;&gt;<cite>What is creep and how should a designer allow for it in publication design?</cite></p>
      <p>In a saddle stitched booklet the bulk of the paper causes the inner pages to extend or creep further out than the outer pages when folded. When trimmed the inner pages are narrower than the outer pages, counteracting the creep.</p>
      <p>Total pages in book, divided by 4 (for each 4 pager), times paper thickness. Take that number, and divide it by the number of flat sheets in your book. This number will be quite small, but will represent the amount that you should adjust each page’s outside margin, as you get closer to the center of the booklet. This works in most cases but using a folded, drilled, dummy of the actual job stock is best.</p>
