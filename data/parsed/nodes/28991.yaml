    ______________________________________________________________________________</p>
    <p>Hello Typophiles,</p>
    <p>Its a bit different kind of thread but the only way can learn something new.</p>
    <p>My final jury(exams) of this semester is on next Monday and they(jury members) can ask me anything related to the publication and typography. Not much of theory but technical and the general terms used in publication and the random questions related to typography.</p>
    <p>I found lots of rare terms people don’t know and I would like to know them too. Yesterday someone had asked me what does “pangram” means? and I had no idea what he was talking about. I think being a design student i must know all these basic terminology.</p>
    <p>Please ask me questions as much as you can. Anything related to typography/publication or basic graphic design. Ask something which you feel I would not be able to answer. Cause that way i will try myself to find them out and will learn more in the process. Kind of a revision of the course.</p>
    <p>Thanks in advanced</p>
    <p>satya<br>
    student, graphic design<br>
    NID, India</p>
    <p>PS: Please don’t answer my questions until unless i request for them.</p>
