    <p>Hi.<br>
    I have a problem when generating OpenType font in FontLab 4.6 for Windows. After creating outlines and preparing OT features when I generate font it shows me TTF font file icon. As a test I take standard Windows OT font, import in FontLab, make no chages, generate as OT TTF font and the same result - TTF icon insted of “O” OpenType font icon.<br>
    But when I generate OTF (PS flavored) file everithing OK with icon.</p>
    <p>Thanks<br>
    Akhra</p>
