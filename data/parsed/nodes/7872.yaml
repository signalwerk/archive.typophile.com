  html: <p>hi all! <br>i have some doubts about a concert poster for a school exercise, ive made so many and i dont know witch one to choose. Im only concerned with the typography because i think i have the right image or a good one! <br>here the best ones (i think) <br>the poster anouces some "concerts of the mist" (Concertos das Brumas),the place (Teatro Acad</p>
comments:
  - id: 53224
    user: 2663
    date: 2004-11-26T19:07:00
    date_raw: 26 Nov 2004 — 7:07pm
    votes: null
    html: <p>Well, the bottom left-hand one is the only one where you can read the information without something getting in the way, although the type could be a bit bigger. Maybe at high resolution and actual size, the top right-hand one might work, too. Make it easy for the reader to get the information, and maybe there will be people at the concert!</p>
  - id: 53225
    user: 2915
    date: 2004-11-27T04:15:00
    date_raw: 27 Nov 2004 — 4:15am
    votes: null
    html: <p>I'm not in love with the type being forced to flush left and right. Did you try stacking the title and taking the second line and placing it somewhere else on the poster? This way you could make the type work more with the image and not become separated from it. Last, I think the headline is set too tight. It looks very 70s, just too much crashing. Did you try Initial cap and lower case?</p>
  - id: 53226
    user: 5217
    date: 2004-11-27T07:42:00
    date_raw: 27 Nov 2004 — 7:42am
    votes: null
    html: <p>thank you for both for your comments,in one hand i also think the top right one and the bottom left one are the better ones, but in the other hand i think that in the top right poster our vision gets distracted with those two horizontal lines, and in the bottom right poster maybe the type is a bit small (this way the type finishes were the diagonal line starts), a good thing in this or at least better than the first is that the type is in the line of streangth between the black an the green/white area and as Steve said "you can read the information without something getting in the way". <br>stacking the title is a very good idea i never thought in doing it, as also the ideia of placing the second line in another place,(i was trying to "make" a rectangle with the type thats why the type is "forced"), inicialy i did try initial cap and lower case but i give up on that because of the rectangle idea... <br>both gave me lots of stuff to think about, i think im going with the second poster after some changes.. <br>txs again!</p>
