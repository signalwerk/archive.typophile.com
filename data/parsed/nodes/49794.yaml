      <p>Hello --</p>
      <p>Sorry to barge in on your thread, Sarah, but Michael Clark's first response hit very close to to answering a question I have and since it's not completely off topic, I'd like to ask it here. My son just started kindergarten and we've been working on writing letters, of course. He's been diligently working on printing his name with the first letter capitalized and rest lower case and it has been a challenge since he got pretty comfortable printing his name in ALL CAPS. He has an 'a' in his name and was working on printing the 'one-story' (thank you, Michael!) form, as found in Avant Garde, for example, as he was taught. I was very surprised then, when he came home with a worksheet on which he'd been asked to copy the word 'bat' and the font used to layout the worksheet used the 'two-story' form. Not surprisingly, his 'a' was about three times bigger than his 'b' and 't' and very elaborate and probably took him twenty minutes of labor and caused him to miss free-play time (not the worst thing in the world, but still). When I asked his teacher about the confusion this might cause a new learner, she agreed and said it is an active debate in early childhood curricula. She considers the issue just one of many confusing things they have to deal with and says it's just part of the process. She calls the one-story form the 'writing A' and the two- the 'reading A' since all grade school story books are printed with a font that uses the two-story form. </p>
      <p>Whew. So, here's my question. Can anyone tell me why we have two forms (and is it just 'A' and 'G'), and what they are called so I don't sound like such a eejit when I try to describe the problem? </p>
      <p>Many thanks in advance,<br>
      Jessica</p>
