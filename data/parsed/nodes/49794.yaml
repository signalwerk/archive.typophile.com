      <p>Just a simple explanation. The 2 story was the first to appear, the half Uncial, bookhand, Carolingian, blackletter etc. The single story is an evolution of the more cursive versions of the Latin in the Chancery "scripts" and proliferated through the pointed pen forms that succeeded them. Simply a result of time conservation and pen efficiency.</p>
      <p>Oh, this is going to come back and bite me on the butt. But that is my story and I am stickin' to it!</p>
      <p> Michael</p>
