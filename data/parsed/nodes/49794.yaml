      <p>I'm not sure at what stage and in what order things should be taught. </p>
      <p>What I do think is that have three different shapes for the A is not a particular problem, even in first grade. They can be draw over a sans outline for all of them, if they want to get the feel. After all they will see them constantly when they read.</p>
      <p>And what is so bad about copying serifs? They can to both serifs and sans and recognize the difference.  </p>
      <p>Since I believe millions of Chinese kids are taught a couple of new characters a day, I just don't see this as a serious problem. I would like to see actual tests before I would be convinced that you have to wait a very long time--say over a year--to introduce variant forms.</p>
