      <p>Mostly I was sleep-deprived and ran out of steam to explain. My last night in Europe, and I have a nasty cold.... But now I’m home and have had a nap.</p>
      <p>I am curious as to other’s opinions, but I think I would try to pick just a couple of typographic concepts to teach them and use as examples, and also to let them know that there are many more such things. Maybe curly quotes vs dumb quotes for one? Serif, sans, script and symbol categories for the other?</p>
      <p>I thought of hyphens, en dashes and em dashes, but I think I’d save that for later on.</p>
      <p>Cheers,</p>
      <p>T</p>
