      <p>"My problem probably stems more from the fact that my younger son is uncommonly lazy. No joke."</p>
      <p>There is 'lazy' and then there is 'smart enough to realize the silly repetitive handwriting exercises in grade school really have little to do with the success or lack thereof in his future'. ;o)</p>
      <p>I suck at handwriting, always have, except for those intermediary stints as a draftsman. I'm OK a lettering, but not writing.</p>
      <p>Our second grader despised handwriting, but can probably type faster than I ever will be able to already at 7 years old.</p>
      <p>Handwriting is a necessary skill, of course, but things like cursive and the like, IMHO, are a colossal waste of time when taught at the gradeschool level. These kids are growing up with keyboards, cell phones, touch screens, etc.</p>
      <p>To these kids, having to plow through handwriting class probably seems as pointless as if we having to take blackletter calligraphy classes when we were kids in the 70s/80s. </p>
      <p>Not that any of this has anything to do with you teaching type and typography and even lettering. That's important.</p>
