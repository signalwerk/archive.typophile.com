      <p>This deviates a bit from the original topic, but I was musing about handwriting education last week, and this seems a bit relevant. Why do we teach kids handwriting from geometric sans-serifs? The letterforms are unnatural to create by hand, which is why they are geometric and not humanist. Creating a single-story a by drawing a circle and then a line is unnatural and awkward. I suppose the idea is to first teach them to create uniform letter shapes, and then to develop them in to something more natural for them.</p>
      <p>But for the first year or two of their handwriting education, kids are forced into creating awkward shapes that aren't the only way to draw a letter. If they don't conform to these letterforms, they get bad grades. I think that handwriting education needs to be reevaluated. It's okay to have an x-height that is not exactly half of the cap height. I think we also need to create a humanist, rather than geometric, handwriting education system. Kids may not learn to write as quickly, but the ones who have terrible handwriting from the start because they can't form perfect circles will probably benefit.</p>
