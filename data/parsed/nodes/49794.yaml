      <p><cite>When I asked his teacher about the confusion this might cause a new learner, she agreed and said it is an active debate in early childhood curricula...</cite></p>
      <p>Actually there is a fairly clear, pedagogical explanation for all this. In America, there is a trend among educational institutions toward teaching chilren handwriting based on the Zaner-Bloser alphabets, which, in printing, have one-story As and Gs, open 4s, tailed Qs, etc. These forms obviously differ considerably from those used in most text faces, so when possible, specially modified versions of existing typefaces reflecting these forms are used when setting books for early readers. These are often proprietary to the publishers, but <a class="freelinking external" href="http://www.identifont.com/show?3O7" rel="nofollow">Gills Sans Schoolbook</a> and <a class="freelinking external" href="http://www.identifont.com/show?3NE" rel="nofollow">Bembo Schoolbook</a> are similar-enough, publicly available examples.</p>
      <p>The shift toward "standard" letterforms usually occurs sometime around the middle of second grade – which isn't to say that no materials intended for children younger than second grade use two-story letters. A lot of publishers either aren't as aware of this issue or aren't as strictly influenced by state adoption practices as others.</p>
