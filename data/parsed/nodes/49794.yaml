    <p>I've been assigned to teach a one-hour art class to my son's 2nd grade class and I thought it would be fun to introduce them to typography in a very basic way. I'm not a type designer (I design books), but I love type and I'd like for the kids to understand letter forms as art and also as a means to communicate--how different fonts have different functions, etc. Anyway, my plan was to just introduce these ideas to the kids (open their eyes to what is all around them), and then give each of them a letter to design, which I can then take home and turn into a font with SigMaker. Has anyone ever done anything like this with kids? I want to keep it simple so I don't know if I should give them a ton of info--but it seems like I should introduce some basics (such as ascenders &amp; descenders). Any ideas?<br>
    Thanks, Sarah</p>
