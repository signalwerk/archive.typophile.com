      <p>This trend is a fundamental shame on us. As I understand it, and correct me if I'm wrong, the singular purpose of the two-storey a is to make the letter automatically and easily discernable from all other characters in the alphabet...as in, the one-storey a looks, at a glance, a LOT like an o. It is for this reason that I avoid all type faces that employ the one-storey a...because it's dumb. (Same is true for the one-storey g versus q.)</p>
      <p>Only reasonable explanation I can figure is that the one-storey a transitions easier into the cursive a. I'll give it that. But as stated by Mr Puckett, the two-storey a is certainly not a difficult thing to learn to draw, and is easier to draw than an s.</p>
