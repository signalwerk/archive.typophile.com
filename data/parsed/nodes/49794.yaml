      <p>Regarding any defense of the one-storey as acceptable teaching:</p>
      <p>All I'm saying is the two-storey a is not only better (simply because it does not resemble any other letter) than the one-storey a, but it is in fact EASIER to draw than the one-storey a. Therefore, it's stupid that we don't teach it.</p>
      <p>Really...how many kids can line up that vertical stroke so that it comes right down perfectly tangent to the bowl of the one-storey a without intersecting it? Whereas with the two-storey a, the counter comes AFTER the vertical stroke, which makes perfect sense. And please pardon my possible misuse of the bowl/counter terminology (I like type a lot, but I don't design it, and my vocabulary is close but not perfect!).</p>
      <p>And as far as cursive being a colossal waste of time...I disagree completely. Suck at it or not suck at it, it's good to encourage kids to express themselves with their hands and their handwriting. We are humans, and as much as we're all on the same team, our individuality is an essential part of what makes each one of us beautiful in his or her own way. We are not all Times New Roman or Arial, and not all children have Typophiles for parents.</p>
