      <p>Because someone decided it was a good idea and the idea took root. America’s schools are rarely designed to teach children to think critically, only to memorize without challenging, so now the idea is being protected by generations of mindless pedants. If we change handwriting then who knows what else would come flying out of Pandora’s box? How exactly did Columbus discover America if people were already living here? Does anyone really think that Jefferson’s sex with Sally Hemmings was entirely consensual? Why is Andrew Jackson, an architect of our nation’s greatest genocide, still on the twenty? Opening a door to questions like these is not why American has indoctrination centers, I mean schools, so our absurd handwriting system will have to stay.</p>
