      <p>Jan, I was trying to think of ways to keep it on their level. I don’t expect them to design anything professional—just to think about letters in a different way. My son has atrocious handwriting, but when I told him to think about his letters as works of art that say something about the writer, he improved vastly. That’s what gave me the idea. Also, I’m sure none of the kids in my son’s class have ever even thought of type design (much less, typography) as something that anyone actually does—so it seems like it would be fun to open their minds to that.</p>
