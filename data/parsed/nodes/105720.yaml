    <p>Hello,<br>
    The image was provided to me by one of my clients. Someone else did this work and now they need the logo re-created in vector format. The font I am looking for is the "Jokers Corner" title. This looks like a western or perhaps carnival type. Does anyone know what font this could be?</p>
    <p>Thank you for any input that will get me closer to finding this font.</p>
    <img typeof="foaf:Image" class="img-responsive" src="http://www.typophile.com/sites/default/files/old-images/JOKERS%20CORNER%20JUNE14th.jpg" width="400" height="600" alt="">
