    html: <p>We added a feature to InDesign (CS3?) that will shift the first line of text down in the frame in order to keep the rule inside the text frame.  It's a checkbox in the paragraph rule above dialog labeled "keep in frame".  It isn't available for rules that may stick out below the bottom of a frame (but it would be nice).</p>
