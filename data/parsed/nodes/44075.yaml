    html: <p>Did you know that you can make a dotted-stroke line, cut it, and then paste it in to your actual text block? It will then treat the line as if it is a character in the text. With the white arrow, you can adjust it within the paragraph (you could also adjust the baseline shift in the style sheet or text palate. This may come in handy...</p>
