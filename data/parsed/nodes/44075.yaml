    <p>Hello.</p>
    <p>I have two questions..</p>
    <p>I'm wondering if anyone has tips on how to control paragraph rules? I've applied paragraph rules to headers on a book but whenever these headers end up on top of the column, the rule either sits above or below the column margin, depending on the text's baseline and/or space applied by the paragraph style.</p>
    <p>The other question is about keep options settings. I've fudged with both the keep options and H&amp;J settings on my paragraph styles to no success. The awkward paragraph breaks are brutal. :(</p>
    <p>Below is a PDF.. Be gentle, pls note I haven't finessed the layout/typesetting yet. I'm still figuring out how to control the paragraph rules and paragraph breaks.</p>
    <p>Anything helps, thank you!</p>
    <p><a href="http://www.thisissoft.com/breastfeeding2_full_12pt.pdf" title="http://www.thisissoft.com/breastfeeding2_full_12pt.pdf">http://www.thisissoft.com/breastfeeding2_full_12pt.pdf</a></p>
