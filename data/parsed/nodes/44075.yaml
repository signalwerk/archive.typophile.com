      <p>Thanks so much.. The baselines are now lining up quite nicely, much improved.</p>
      <p>My question is regarding the main headers – or rather the rules of the main headers – not lining up properly with the column margins. The leading/spacing style applied to the main headers are affecting the way its rules sit in relation to the top of the column. You can see this happening on the left side of spreads 2-4 on the PDF below. Specifically these headers: "All You Need Is A Baby, A Breast And A Brain" "Milk Release" "Maintaining Milk Supply"</p>
      <p>If anyone has any valuable tips, much appreciated. Thanks again.</p>
