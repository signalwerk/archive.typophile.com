    html: |-
      <p><cite>...that page is too busy. How about some sub-pages to clear away all the stuff I don’t need to read? Specifically the entire rightmost column.</cite></p>
      <p>That's a good idea, James. Although in the two days since <a class="freelinking external" href="http://webfontspecimen.com" rel="nofollow">Web Font Specimen</a> launched, many visitors have followed links in that rightmost column. I think it has been successful. What the page design lacks in brevity it makes up for in honesty—everything's out in the open.</p>
      <p><cite>Specimens like yours will be common</cite></p>
      <p>When they are, that will be a great day! Agreed, WFS is nothing special—except that, <a class="freelinking external" href="http://www.alistapart.com/articles/real-web-type-in-real-web-context" rel="nofollow">as I note in the ALA piece</a>, it belongs to us all. It's a beginning. Maybe the challenge for type sellers, if not making the specimen itself, will be making room on their websites to showcase type in real web context ... and striking a balance with folks who intend to use the type in other ways.</p>
      <p><cite>This is not something that should be free</cite></p>
      <p>I disagree here. Seeing type specimens in actual web context, as well as being hands-on with typefaces and actually putting them in test projects, will be free.</p>
      <p><a class="freelinking external" href="http://people.mozilla.com/~jkew/woff/woff-spec-latest.html" rel="nofollow">WOFF</a> should enable web designers to try type out, and should relieve type seller anxieties about license violation ... if my understanding is correct.</p>
      <p>The legal idea behind WOFF, as I understand it, is that typeface license violation would not be forcibly prevented (like DRM) but would instead be something continually monitored by type sellers (or services they employ to do license-related sniffing). All WOFF does, legally, is take ordinary font files and add XML data that type sellers can use to match specific font files to detailed data elsewhere.</p>
      <p>By this reasoning, discovering license violations would be equally easy (or difficult) regardless of whether a web designer has paid for the type they are previewing in their latest projects. If the type is being used publicly and is not licensed for such use, this violation would be caught.</p>
      <p>Put another way, if a type seller were to license WOFF files but attempt to charge for the ability to try them out, what's to stop web designers from finding a website that uses the type they seek, acquiring the WOFF file, and experimenting in a private space? Though perhaps type sellers could charge web designers for the convenience of not having to hunt around.</p>
