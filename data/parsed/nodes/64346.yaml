    <p>Hi Typophiles,</p>
    <p>Today I launched Web Font Specimen:<br>
    <a href="http://webfontspecimen.com" title="http://webfontspecimen.com">http://webfontspecimen.com</a></p>
    <p>... and announced it via this article at A List Apart:<br>
    <a href="http://www.alistapart.com/articles/real-web-type-in-real-web-context" title="http://www.alistapart.com/articles/real-web-type-in-real-web-context">http://www.alistapart.com/articles/real-web-type-in-real-web-context</a></p>
    <p>As type designers and type sellers, I'd like your thoughts on what I've said in the ALA article. How do you feel about your growing market of web designers? What will it take to implement actual-context previews of your typefaces? How do you feel about type rendering in web browsers?</p>
    <p>Also: web design folks with an interest in typography who may not know about Typophile will be looking to ALA's discussion forum for conversation. Please consider contributing your thoughts there as well. Web designers need your advice and expertise:<br>
    <a href="http://www.alistapart.com/comments/real-web-type-in-real-web-context/" title="http://www.alistapart.com/comments/real-web-type-in-real-web-context/">http://www.alistapart.com/comments/real-web-type-in-real-web-context/</a></p>
    <p>Tim</p>
