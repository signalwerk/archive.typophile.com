      <p>Oh, and I would suggest editing your generic text sample to include things like quotation marks (maybe both dumb and curly quotes) and question mark. </p>
      <p>Especially the question mark, since this is a common punctuation mark and usually a complex glyph that may or may not render well in a coarse environment.</p>
      <p>With that same reasoning, you might want to include the @ symbol either in text or in your waterfall.</p>
      <p>And you've got a typo in the label on the black-on-red block -- it should be #000 on <em>#F00</em> not #0FF.</p>
