      <p>Tim -- The one shortcoming I found in the specimen is that so much of the text setting centers on only 13px size. </p>
      <p>That may look fine in Georgia, but I think you'll find that when folks start testing other text fonts, 13px looks pretty small.</p>
      <p>I believe most text faces originally designed for print will sit smaller on the body (or at least on the x-height) than Georgia. So until we start seeing more faces designed specifically for screen, a lot of @font-face text may run small or need to be bumped. </p>
      <p>Your specimen would be more useful if it allowed for a range of paragraph settings from 13px to 16px (which I believe is the default in most browsers these days) for basal text samples.</p>
      <p>Also, I find the color samples with red and cyan pretty useless, personally. Who does that? (Except Roger Black maybe ;-) If you want to run text on color and knockout examples, you might use more common colors.</p>
      <p>Those are my personal responses. Obviously, I can just go in and rewrite parts of this to suit myself.</p>
