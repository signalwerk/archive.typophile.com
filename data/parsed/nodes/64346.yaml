      <p><cite>…your website looks awful.</cite></p>
      <p>It isn’t just the bad color choices; that page is too busy. How about some sub-pages to clear away all the stuff I don’t need to read? Specifically the entire rightmost column.</p>
      <p><cite>How do you feel about your growing market of web designers?</cite></p>
      <p>MoneymoneymoneyMONEY. And I’m quite excited about the prospect of not seeing Helvetica or Verdana in all headlines on 99% of the web.</p>
      <p><cite>What will it take to implement actual-context previews of your typefaces?</cite></p>
      <p>Specimens like yours will be common because they’re so easy to create. But if you want to text it on your sites, you’ll have to pay. Nothing is stopping web designers from licensing a font to use on a test server. Most sites start as mockups in Photoshop or Fireworks, designers should have the fonts licensed for use in development at that stage. This is not something that should be free, and if you think it should, you need to correct your entitlement mentality. If actual-context previews are important to you making money as a web designer you need to pay for them, just as you paid for your computer.</p>
      <p><cite>How do you feel about type rendering in web browsers?</cite></p>
      <p>It’s all been said a million times already. That said, hopefully someone will develop a TT autohinter optimized for small sizes. Maybe we’ll even see a user-friendly TT hinting app hit the market.</p>
