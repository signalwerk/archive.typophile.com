      <p>Aw, thanks James. :)</p>
      <p>Your comment was what got me thinking about trying WOFF fonts freely, and your point here about everyone messing with bootleg fonts before paying to use them in projects is an apt model (although in WOFF's case, again if my understanding is correct, piracy could be detected). So I think we're discussing two issues now:</p>
      <ol>
      <li>HTML+CSS type specimens for browsing, and</li>
      <li>using WOFF fonts freely for testing purposes, before they're licensed</li>
      </ol>
      <p>So many foundries have expressed support for WOFF. I wonder, are these folks already planning methods of license enforcement? Is anyone thinking about such loose handling of WOFF files as we've discussed here?</p>
