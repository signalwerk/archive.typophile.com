    <p>I just downloaded the latest build of the Adobe Font Developer Toolkit to install on my newly reformatted machine and I'm having a problem...</p>
    <p>One of the most useful Fontlab Macros that it came with was the CheckOutlines macro, but not I guess the FDK doesn't come with it, only as an osx tool.</p>
