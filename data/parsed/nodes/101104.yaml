      <p>I finally realized what kind of problem you may be having.</p>
      <p>The FDK folder needs to be placed into your FontLab folder just as it is; don't move anything out of the FDK folder. Then run the file "finishinstall".</p>
      <p>Restart your FontLab app and it should work.</p>
