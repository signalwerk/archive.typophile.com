    html: |-
      <p>FontLab Studio 5.1.3 here.</p>
      <p>I have a FontLab Folder in my Applications folder which I think is a remnant from version 4, but that's where the FDK is. In both my application support folders there is FontLab stuff too, put there I presume during an install of something since I have four or five of their apps -- plus this machine has been through four or five upgrades of differing versions of OS X over time. Even with all the other stuff, the FDK is still in Applications&gt;FontLab Studio. The latest version of 5.x.x installs the app outside of that folder which is why I say it is a remnant.</p>
      <p>If you run the finishinstallOSX program that is contained in the FDK folder it sets the environment path to the FDK so very likely you can put it wherever you want it just as long as you run that little program after you move it. Also, in the FontLab folder in the FDK Tools folder is another program to run to install the macros into FontLab -- which it appears you have already done.</p>
      <p>As for the CheckOutlines.py script, it is accessible from within Python with all the other third-party scripts. Select "Outlines" in the first scripts dropdown, then choose "Outline Check" in the second; it is the one to run. It runs then writes a log file and shows the path to the log file.</p>
      <p>These things get kind of frustrating sometimes, don't they?   :-)</p>
