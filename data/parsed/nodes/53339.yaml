  html: |-
    <p>Hi,<br>
    I have generated my first Opentype(.otf) font and I am currently testing/tweaking the font on various Apps.</p>
    <p>My Font runs like a dream on Word 2007, but strangely enough the Font won't appear in 'Preview' mode in Illustrator. In 'Outline' mode it is there in black as if it's in 'Preview' mode, but in 'Preview' mode it appears white(invisible). And I can't recolor the font in 'Preview' mode. The Font appears as WYSIWYG in the Font List Menus.</p>
    <p>Also, the Glyph Palette shows the individual Glyphs as being invisible. (I couldn't even be bothered trying to insert a Glyph from the Glyph Palette as it is wrong to be invisible to start with!)</p>
    <p>The same is happening in InDesign. (Both CS2)</p>
    <p>Any ideas?</p>
    <p>Cheers<br>
    drj</p>
