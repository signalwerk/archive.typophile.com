    html: <p>I had that happen to me when I was replacing the tweaked font in the font folder with Illustrator open- and somehow corrupted some cached version of the font. In the end I had to make a backup of the font, erase everything, and then reboot- before regenerating a new version of the font. Then it worked fine.</p>
