  html: |-
    <p>Hi! I'm searching for a beautiful web font alternative to Berthold Akzidenz-Grotesk Extended and Medium Extended. If possible, I'd like to avoid using Neue Helvetica Extended. In a previous response to this question from 2010, someone suggested: Armitage (Fontspring). Has anyone come across any other substitutes since then? </p>
    <p>Thanks!</p>
