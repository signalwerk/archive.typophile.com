    html: <p><a class="freelinking external" href="http://www.myfonts.com/fonts/castletype/standard/" rel="nofollow">Standard CT</a> has eight extended weights and is quite similar to Akzidenz-Grotesk. No italics though. You could also try the two extended weights of <a class="freelinking external" href="http://www.myfonts.com/fonts/linotype/trade-gothic/" rel="nofollow">Trade Gothic</a> (regular and bold).</p>
