    html: <p>Your description of the colour scheme and modern "fresh" approach reminded me of <a class="freelinking external" href="http://www.behance.net/gallery/Talby-by-Marc-Newson-mobile-phone-Interface-design/459087" rel="nofollow">Marc Newson's Talby design for KDDI</a>, the only phones that I have ever viewed as desirable (fun) objects. Another aspect of those designs that I like are the simple icons. Perhaps the shark could be subtly updated to clean up and simplify the design and perhaps change the colours to bring it in line with everything else, it seems to me more jaunty than edgy at the moment.</p>
