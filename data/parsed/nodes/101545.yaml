      <p>I don't know a lot about sushi, but to me the style of the shark drawing seems off. You might want to experiment with versions that retain the attitude but have more of an oriental (if that's the right word) style.</p>
      <p>&gt; Should I consider not using the fish symbol?</p>
      <p>Since they've used it for years, if you decide to eliminate it you might want to phase it out gradually. Maybe use it small for awhile before eliminating it, or take it out of the logo but use it as a graphic element in the menus, etc. Maybe I'm being overcautious but restaurants often operate with very small profit margins and I'd be cautious about totally eliminating a symbol they're associated with.</p>
