    <p>I'm a student making a website for a sushi restaurant, and I'd like some help choosing fonts for the logo and for text.</p>
    <p>To give some background: The restaurant owner said he wanted to use white, green, and orange, "fresh" colors that emphasize the freshness of his sushi, and the light atmosphere of his small, hole-in-the-wall restaurant where sunlight pours into a mostly white room with a green/orange/white tiled ceiling.</p>
    <p>Compared to other sushi restaurants, his sushi is very creative, and very flavorful; their tagline is "Rockin' Sushi".  At the same time, he is a very masterful chef who has many years of experience as a head chef in California.</p>
    <p><strong>I want to choose a font to pair with their logo, but I'm having a hard time finding one that will look good on a light color scheme, fit well with his fish symbol, and also give the impression of quality fitting of an experienced chef.</strong></p>
    <p>Most sushi restaurants go for "brushstroke" fonts and put them on very dark backgrounds, since they want to convey a traditional and high-class atmosphere, but I don't think that will work too well.  At the same time many other fonts look too commercial to be appetizing; Singo Sushi is known around here as a hidden jewel that nobody knows about, yet is of the best quality.</p>
    <p>Any suggestions for a font to use on their logo?  Should I consider not using the fish symbol?</p>
    <p>Attached is their old logo, my rerender of it, and an attempt at combining the symbol with Clarendon/Open Sans.</p>
