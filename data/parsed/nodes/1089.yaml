    <p>A certain question has been plaguing me for months now, and it with the hope of receiving a definitive answer that I write this post. <br> <br>How, exactly, do you pronounce Adrian Frutiger's surname? Is it /froo'-tijh-er/? Or /frut'-igh-er/? Or some combination thereof? <br> <br>Or not? <br> <br><i>Jake</i></p>
