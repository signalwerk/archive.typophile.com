    html: |-
      <p>Jake, </p>
      <p>please read the Illustrator-related section of the FontLab Studio manual. It explains how to optimize the process of moving your outlines from Illustrator to FontLab Studio. The basic principle is that in outline fonts (as supported by FontLab Studio) all points must be on an integer coordinate grid, and that 1 pt in Illustrator corresponds to 1 font unit in FontLab Studio. In other words, make sure that you have a grid in Illustrator every 1 pt, and that all your points are placed on that grid. Then you should be able to transfer your artwork to FontLab Studio without problems. </p>
      <p>Regards,<br>
      Adam Twardoch<br>
      Fontlab Ltd.</p>
