      <p>I suppose it depends on how much is being charged for "all those obscure accents".</p>
      <p>Obviously, if the type designer is constrained to expend effort on covering a wide range of languages using the Latin script with his font, that labor needs to be paid for. If this is done by making an extensive range of accents the dividing line between the regular and "Pro" versions of a font - the way that a Xeon or Opteron processor has features that a consumer processor does not, and comes at a considerable price premium - then those who don't need them won't buy them.</p>
