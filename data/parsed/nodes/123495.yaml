    html: |-
      <p>??<br>
      This almost sounds like pricing fonts by the glyph. Does anyone do that?</p>
      <p>For what it is worth, language support is the same in all my fonts, "pro", free or otherwise. It's the OT features and general complexity that increase prices. Why would I charge someone who needs some of those “obscure foreign accents” more than I’d charge anyone else? Or put another way, how can I expect to sell any fonts in Turkey or Esperantia if I ignore language support?</p>
      <p>From the client's perspective, it also depends on the application. In two recent projects, I commissioned signage versions of two typefaces for my employer. I didn't specifically say to the designers, "Don't include all those obscure foreign accents." but I did suggest that for at least one of the typefaces that the designer could limit language support to Latin 1 - But not because I thought I'd save anyone any money. Since our signs will only ever be set in English and French, by the time the projects passed all the hurdles of getting approved, the time to actually do the work was getting really tight and it seemed like a logical place to save a little bit of time – Although how much time, is a good question. They'e components. They update automatically.</p>
