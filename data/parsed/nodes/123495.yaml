    <p>Saw this Spiekermann piece on Medium: <a href="https://medium.com/@espiekermann/cultural-imperialism-stems-from-ignorance-7bb32f1de196" title="https://medium.com/@espiekermann/cultural-imperialism-stems-from-ignorance-7bb32f1de196">https://medium.com/@espiekermann/cultural-imperialism-stems-from-ignoran...</a></p>
    <p>Apparently Spiekermann is writing to resonate with the medium team’s piece that self-praises how great and inclusive their typography is. He writes</p>
    <blockquote><p>US clients often wonder why they need to pay for all those obscure accents. A bit of cultural imperialism in play, or plain ignorance, which is not the same, but has the same outcome.</p></blockquote>
    <p>Not wrong at all. But it got me thinking: do you really need to buy a Pro version of a typeface that supports extended Latin, when your client has a super limited budget and they’re sure they will only deal with English-speaking regions? Big companies like Google will definitely need as much language coverage as possible, but “all US clients” seems to be overstating.</p>
