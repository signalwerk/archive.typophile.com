    html: |-
      <div class="comment-spam-body"><p>I would modify the comment "It's the OT features and general complexity that increase prices" to read "It's the OT features and general complexity that increase costs."<br>
      It takes relatively little time to churn out a full set of accents using a modern fontmaking program. It is time consuming to design ligatures and do correct OT coding. Time is cost.</p>
      <p>However, if I retained anything from my economics degree of many years ago, it's the concept that the price of a font -- like everything else in a free market -- is determined by the intersection of supply and demand. What this ends up meaning in the real world is that the price at which a font will actually sell bears no direct relationship to cost. Some fonts make a profit and others end up being "a labor of love" which will never pay for the cost of developing them.</p>
      <p>This applies both to bespoke fonts and retail ones.<br>
      For a bespoke font any pricing scheme -- no matter how peculiar it may seem to the fontmaker -- works if it is what the client wants.</p>
      <p>Lawyers can get rich from "billable hours." Any fontmakers who could get this deal would be in the lap of luxury.</p>
      <p>Don</p>
      </div>
