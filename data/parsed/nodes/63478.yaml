      <p>Hi Again ~</p>
      <p>I must admit, branding oneself takes a lot of thought and such a higher level of commitment than doing similar work for another. Since this card is not the be-all end-all of your personal branding (rather just a teaser), I think you can problem solve “inside the box” of the card and leave the fully fledged identity for your online portfolio.</p>
      <p>Quite simply, you want people to register your name...but that’s one of the problems of this card (or, rather, promoting this identity). You have achieved a certain restraint in the letterforms and layout, but the name – taken by itself – abandons minimalism! As such, the card reads to me somewhat whimsically (as if the voice of Wall-E were speaking it :). If I had seen the card before reading your initial post I would have had an easier time counting the letters, I suppose. However, the problem of best, clearest first impression persists. I challenge you to find a more elegant solution to this than Google hand-holding.</p>
      <p>I understand your desire to keep it super clean, so a tasteful illustration (hairline line-art, perhaps, of a gorgeous five-petaled flower? something more stunning than my quickly done attempt? ok, you’re going to hate this idea...) is out of the picture, but I still feel like the design leaves me a bit hanging rather than intrigued. How about this, then?</p>
      <p>Regards,<br>
      William Leverette</p><div class="imageWrap"><img src="http://typophile.com/files/rose2_4428.png"></div><p></p>
