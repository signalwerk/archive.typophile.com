    html: |-
      <p>Ease-of-use need not be the ultimate priority – and I do like me a good puzzle – but this notion about filtering clients based on those who will or will not endure the minor tedium of counting <em>o</em>s seems to totally miss the point. Lack of clarity in self promotion simply makes a negative impression.</p>
      <p>To my eyes, the design is flawless from a purely graphic/technical perspective. Contemporary, precise, minimal, confident, clever. But the function of the original design conflicts (albeit to a small degree) with a lot of these same qualities that lend the design its strength. (The legibility issue doesn’t reduce the cutting-edgeness of the idea itself; this thread is a great proof of concept.)</p>
      <p>If we were style machines with eidetic memory, none of this of course would matter.</p>
      <p>And, sure, there are many potential clients who want something without a willingness to do their part. This scenario should be remediated or the collaboration avoided as soon as it comes up! Yet again this awareness falls into the realm of human relationship/business skills, not graphic design savvy.</p>
      <p>Now, the use of thermal ink is an excellent idea! I see this as precisely the kind of one-shot, designerly solution that could add that small but missing layer of warmth (har har), and audience/self awareness to your coldly calculated card. Perhaps in your modesty you understated the effect of it. In my mind, this card would be delightfully interactive (gotta keep those cards out of your pocket, though :), tactile, memorable, and thus surprisingly fun. A good puzzle!</p>
      <p>Keep developing ideas of how to apply it. I don’t think the <em>5</em> in that sequence would get confused in context though there is some tension created with the similar <em>S</em> that follows. I was tickled by aluminum’s character count wrangling and inspired by his observations. So I’ve include some breezy mock ups as more food for thought. The first plays around with the thermal ink idea. The second veers into complication and 5-S confusion territory, but I hadn’t really noticed that your S/5 is already hidden in plain sight and couldn’t resist. The third suggests a more symbolic approach to numbering. You could still go thermal with it, it vibes with the grid, and offers a salient play on diacritics not entirely unrelated to the phonetic pronunciation of your handle.</p>
      <p>I hope, in the end, even if you stick with your original, quality work that you have a clearer sense of it and enjoyed the development process. Hey, I see it as love and attention you are giving yourself to empower your purpose as a professional. Nothing diminishing it that!</p><div class="imageWrap"><img src="http://typophile.com/files/rose3_5203.jpg"></div><p></p>
    html_clean: |-
