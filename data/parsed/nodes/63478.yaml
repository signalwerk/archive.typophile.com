    html: |-
      <p>1. On the name, I agree with ricard0. How many O's are there? Or are those zeroes?</p>
      <p>2. "<em>…gold foil for the type…</em>" ≠ "<em>…my style is very geometric, precise, maybe mathematical? functional, to the point, etc…</em>" — unless you're going for funny/ironic.</p>
      <p>3. If you're going functional, minimal, geometric &amp;c, why not just use a sans like Futura? While the graph paper is a nice bit of visual rhetoric, it ultimately makes the type harder to read and the purpose of a card, in my opinion, is most importantly to facilitate communication between yourself and others. Graph paper is likely to make people think math or architect. The monospaced font and structure arriving from the use of a graph paper does speak in somewhat of a structuralist tone of voice, but may be a bit heavy handed. It's obvious that a grid is in place  without the lines.</p>
      <p>4. Printing on both sides makes getting at the information harder and more expensive. I would only recommend people use both sides when they really need the space, like a bilingual Canadian government card.</p>
      <p>However, design decisions should be based upon fitness for purpose; Who are your current/potential clients? How do you want to be perceived? What type (pun intended) of service do you offer? Are you expensive? Environmentally conscious? Political? With answers to these sort of directed questions, you'll find that most of your design decisions make themselves and we're not left taking random shots across the bow until our clients say "I like that one." This is significantly easier than guesswork, and results in a far more efficient consumption of both yours and your client's resources.</p>
      <p>(I also have a few graph-paper Moleskins. See if you can find the one with double thick stock. It's beautiful).</p>
