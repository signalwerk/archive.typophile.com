      <p>well I own mikerooose (3), mikeroooose (4), mikeroooooose (6), mikerooooooose (7), which will remind and redirect, just incase — but I don't think counting up O's will be that confusing — maybe though. I guess I'm putting a lot of faith in browser history's, delicioius, etc... if all else fails they have my phone number :)</p>
      <p>I was thinking about putting small numbers in each O to number them, so you can easily see that there is five, but I don't want to put much emphasis on the 5, as there is no real meaning to it other to be unique.</p>
      <p>the problem I have with the mikero5e is now the 5 has lost all meaning — plus it's not that unique. I guess I like the "randomness" to the name, as it's like creating a username for google. if someone were to search for mikerooooose on google, all search results would probably be for me — including this posts. I like the idea of client being able to get the full scoop on me, either through my website, twitter, facebook, google, etc... and how it's all easily connected through one username (mikerooooose).</p>
