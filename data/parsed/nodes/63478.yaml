    <p>Hey,</p>
    <p>I'm looking to get some feedback on a personal "business card" I'm working on. Basically I'm rebranding myself online from rosem to mikerooooose which matches my facebook, twitter, flickr, etc... I also own mikerooooose.com which will host my portfolio. Also, since this is such a unique name, I'm sure I'll be the only one coming up in a google search.</p>
    <p>So with all of this in mind, I was thinking they only really need to remember the mikerooooose part, and they should be able to find me in some fashion, either online, facebook, twitter, etc... I also have my phone number on the back for a quick phone call or text.</p>
    <p>As for the style, I'm trying to keep it as simple as possible. I would say my style is very geometric, precise, maybe mathematical? functional, to the point, etc... so I drew up these monospace letters in my moleskin grid. I was thinking of showing the grid on the business card, but that might be too much. Anyway, have a look:</p>
    <p><a href="http://www.rosem.com/work/mikerooooose_bcard/" title="http://www.rosem.com/work/mikerooooose_bcard/">http://www.rosem.com/work/mikerooooose_bcard/</a></p>
    <p>Let me know what you think. Not a good idea? good idea?</p>
    <p>I'm not sure on paper, inks, etc... yet — just trying to figure this out in b&amp;w first. Although I'm thinking gold foil for the type. :)</p>
    <p>Thanks,<br>
    Mike</p>
