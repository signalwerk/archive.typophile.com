    html: |-
      <p>Hey Mike,</p>
      <p>Thanks for posting the development of your card/online identity. You address a very interesting question: How does an emerging online identity achieve novelty for SEO, link seamlessly to social networking sites, and maintain a common given name? <em>Mike Rose</em>. Cool name – just not entirely <a class="freelinking external" href="http://en.wikipedia.org/wiki/Michael_Rose_(disambiguation)" rel="nofollow">unique</a>. ;^)</p>
      <p>Two thoughts on my initial impression:</p>
      <ol>
      <li>While I did get that there are five <em>o</em>s in <em>Rooooose</em> on my first try, my thought process was over-involved:
      <ul>
      <li>Hmm, interesting.
      </li><li>How many <em>o</em>s is that?
      </li><li>Five. Six. Five point five. Huh?
      </li><li>Weird, for some reason I’m not totally sure; guess I’ll count ’em.
      </li><li>Oh, I see the <em>s</em> kinda pops in and out of <em>o</em> territory in my peripheral vision – that’s why my first impression was ambiguous.
      </li><li>Hmm, that’s not very clear :( Clever, but annoyingly “unique for uniqueness’ sake”.</li></ul>
      </li><li>It took me even more mental space (granted we’re talking a matter of seconds, but energy nonetheless) to decode the name as “Rose”. That combination of <em>o</em>s is phonetically reads as a long vowel, as in <em>mooooo!</em>, not <em>row</em>, or <em>ro-o-o-o-ow!</em> So my first impression of your last name was closer to “Ruse”. But again, not merely incorrect, my impression was ambiguous.</li></ol>
      <p>I suggest you think more about the username-dropping situation where you can’t interact immediately or beforehand with a potential client. If the actual conversation doesn’t register at, “Hi, my name is Mike Rose,” you could potentially turn away customers who leave with mild frustration and an impression of wasted time trying to figure out, “What do I call this guy?”. If you feel that you can control this 100% and always introduce yourself verbally and charismatically before passing on the card (as seems to be your intention) then I think it <em>should</em> stick. It’s a memorable name.</p>
      <p>But what can you do as a visual communicator to address the inherent ambiguity of language and memory designers constantly dance with in the best of cases?</p>
      <p>I think a more explicit solution in a case where you are actively <em>injecting</em> novelty/ambiguity is needed. You clearly have technical skills and a strong aesthetic, this card says to me. How can it also impart a more positive impression of your people and design skills?</p>
      <p>Color, illustration –&nbsp;<em>something.</em> Tasteful, of course, according to the minimalist approach. Play off the name and bring some contrast and masculine/feminine balance to the equation. Five is such a wonderful number with boundless geometric potential. May I suggest something like this?</p>
      <p>Just my thoughts. Great work so far pushing the edge between <em>clever</em> and <em>obtuse</em>.</p>
      <p>~William Leverette</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/rose_5285.png"></div><p></p>
