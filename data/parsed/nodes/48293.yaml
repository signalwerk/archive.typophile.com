    html: |-
      <p>I think your best bet for this type of treatment (no pun intended) is to typeset what you want in Illustrator or InDesign and then take it into Photoshop and grunge it up. I use the Machine Wash filter set put out by Mister Retro. Not sure where you could get them to try them out but they do a beautiful job.</p>
      <p>Hope this helps.</p>
      <p>Best,<br>
      Matthew</p>
