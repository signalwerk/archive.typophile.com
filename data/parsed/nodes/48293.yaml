      <p>Allright.</p>
      <p>I think the decayed wooden letterpress effect is something you might have to do yourself in – for example – Photoshop.<br>
      Brings a personal touch.</p>
      <p>In case of ready fonts: Try Dafont.com for fonts. Perhaps you will find something over there.<br>
      But in you example there are different colors used in one letter.<br>
      That is not possible with a font. You have to tweak it.</p>
      <p>I would go for a normal letter and alter it yourself.</p>
      <p>Good luck.</p>
