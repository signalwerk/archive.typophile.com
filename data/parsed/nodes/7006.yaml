  html: <p>The Technology Committee of ATypI (Association Typographique   <br>Internationale) is holding a meeting in Heidelberg, Germany, on Thursday,   <br>20 February 2003. The meeting is open to all interested parties, regardless   <br>of whether they are members of ATypI.  <br>  <br>The meeting will begin with a review of committee initiatives and plans,   <br>and consider the organisational and resource issues that have delayed these   <br>initiatives. The aim of the meeting is to develop a model for co-operation   <br>in font technology and an organisational structure to facilitate   <br>co-operation between software companies and font developers. The meeting   <br>will also address necessary legal issues relating to intellectual property   <br>policies and anti-trust legislation as they affect the constitution and   <br>actions of organisations involved in defining standards or industry   <br>recommendations.  <br>  <br>The meeting will begin at 2:00 pm, and will be held at  <br>  <br>         Zum Güldenen Schaf  <br>         Haupstra</p>
