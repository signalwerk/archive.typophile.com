      <p><cite>Is this correct?</cite></p>
      <p>Make sure that your briefs, estimates, and contracts are written so that they can be easily reused. This way it might take you a few hours to write them all up the first time for the next time a job comes along you can just find/replace the client name, change the numbers, and send it out. Get the <em>Graphic Artists Guild Pricing and Ethical Guidelines</em> and use the boilerplate it provides. As for billing, charge a set fee for the entire job, this way you don’t end up having to note the time you spent thinking about a logo while you were in a cab, at the movies, etc. And when clients absolutely demand that you bill hourly, charge them extra for being turds.</p>
