    html: <p>Another good tip is to use Change Orders, when the customer changes his mind about something beyond the scope of the original quote. Getting them to sign/initial this gives you ammunition to charge for the change. It can really cut the crap where they change something five times, and then make you go back to what you had initially.</p>
