    <p>Hi guys,</p>
    <p>I recently started working as a freelancer and have started taking on a few jobs. I was wondering what the protocol you all had for dealing with clients. I usually start with an insanely detailed design brief that highlights the project, the deliverables, timeline, schedule, deadlines, the prerequisite materials being handed over, examples of what to do, examples of what NOT to do etc. I've been trying to leave as little ambiguity in the air before starting a project. Is this correct? can you think of any books or resources i ought to reference?</p>
    <p>And, </p>
    <p>How do you usually bill clients? Hourly? Standard rate dependent on product etc?</p>
    <p>Utterly confused,<br>
    Arjun</p>
