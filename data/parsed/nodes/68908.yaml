      <p>I think it's very important to define a clear roadmap, and explain the process to clients before starting work – not only to be on the safe side (because once the standard procedure has been defined, you can explain that additional work will be billed extra), but also to make things transparent for the client, because you want to work with them, not against them.<br>
      FWIW, my process is usually divided into 3 distinct steps. In a first round, I develop multiple approaches on the basis of the briefing, which span a range as wide as possible in terms of style/concept. I present ~three to five rough designs to the client, and we'll then discuss what direction to take it in. This can be any one of the sketches (with some adjustments), often it will also be a combination of two concepts. Have this decision confirmed in writing if you're unsure.<br>
      In a second step this direction is then explored, refined, and presented again (for detail solutions and last minor corrections), before the design is (as a third step) cleaned up and finalized.<br>
      I have had some clients who start questioning everything again once the design is already in the finalizing stage, in which case explaining that that would mean they also have to pay for the extra iteration often helps. I would advise against coming across too belligerent though. Work with your client, not against them. The process can't be set in stone, it has to adapt to the individual client; the important thing is to fix some boundaries, early on.<br>
      Also: of course a key to this process working out is to show enough quality work in the first round that is close to the briefing but also divergent enough. This requires being very attentive to the briefing and to how the client talks about what they want, and asking the right questions if necessary.</p>
