      <p><cite>Make sure that your briefs, estimates, and contracts are written so that they can be easily reused.</cite></p>
      <p>And get them signed by your client. </p>
      <p>When sending estimates etc by e-mail, make sure you'll get an automatic answer when the e-mail is opened by your client.<br>
      I always include that once a design has been approved by the client, alterations will be charged by the hour or by new quotation.</p>
