  html: |-
    <p>Fountain happily presents a new typeface release:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Meadow_typophile_6222.png"></div><p></p>
    <p><strong>Meadow Pro - a warm analog sans</strong></p>
    <p>Designed by Göran Söderström.</p>
    <p>Meadow is a warm analog sans typeface for everyday use. With a contemporary fresh expression it's well suited for everything- from strong headlines all the way down to small size settings.</p>
    <p>The family contains romans and italics in 5 weights (10 styles). Small caps, extended language support and OpenType features for the most demanding situations are included.</p>
    <p>Meadow Pro can be found at:<br>
    <a href="http://www.fountaintype.com/typefaces/meadow" title="http://www.fountaintype.com/typefaces/meadow">http://www.fountaintype.com/typefaces/meadow</a></p>
    <p>Download PDF:<br>
    <a href="http://www.fountaintype.com/specimens/65/original/FTN_Meadow.pdf" title="http://www.fountaintype.com/specimens/65/original/FTN_Meadow.pdf">http://www.fountaintype.com/specimens/65/original/FTN_Meadow.pdf</a></p>
    <p>Thank you for your time<br>
    and have a nice day</p>
    <p>Peter W. Bruhn<br>
    [Fountain]</p>
