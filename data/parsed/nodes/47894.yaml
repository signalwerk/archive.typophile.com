      <p>Looking at “Sanford Book” on a free download site I have to say Florian is right. Whatever the designer, Jennifer Dickert, chose to call it, it sure looks like she customized Americana in Fontographer and gave it a new name. The resemblances are for more convincing than the minor changes that make it no longer identical to its model. What the heck, Phil Martin did it (probably with permission) with <a class="freelinking-external" href="http://www.myfonts.com/fonts/urw/scenario/">Scenario</a> for URW, so why should I complain? [It’s my understanding that URW,  like Bitstream, was allowed to keep renamed digitizations of fonts that they converted from pre-digital formats for the original foundries.]</p>
      <p>- Mike Yanega</p>
