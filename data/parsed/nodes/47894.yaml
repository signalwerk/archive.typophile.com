    html: |-
      <p><cite>Asvetic, do you have any kerning suggestions?</cite></p>
      <p>It’s not huge, very minor tweaking.</p>
      <p>Bei - tighter</p>
      <p>wi - loosen</p>
      <p>icked - tighter</p>
      <p>you can even tighten the space between Being and Wicked slightly. I say this because Being is floating out there alone and Wicked is anchored down by the Fire and the tag line. In fact, I might use the distance between the bottom of Wicked and the top of the tag and use it to a basis for the space between Being Wicked and the Fire. Balance and consistency. </p>
      <p>I really like that fire!</p>
