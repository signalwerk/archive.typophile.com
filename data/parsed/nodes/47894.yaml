    html: |-
      <p>Sanford Book, huh? It’s Americana, adulterated.</p>
      <p>This is what the causer says:<br>
      <cite> It started out as a blend of 2 fonts which I further manipulated and refined.</cite> —&nbsp;<a href="http://www.jenniferdickert.com/fonts/sanford.shtml">Jennifer Dickert</a></p>
      <p>This is a good example for what is typical of a lot of (not all) free fonts:<br>
      Their creators too often take the easy way and start with someone else’s outlines. That’s not only lazy, it’s uninspired. If you don’t have an idea of your own, don’t start designing type. Running <a href="/wiki/Richard%252BIsbell" class="wiki-create">Richard Isbell</a>’s Americana and some other poor typeface through a blend filter is not ‘an idea’.</p>
      <p>Additionally, the fonts technically are inferior. With amateur fonts, there’s no quality control, as you would have with commercial foundry fonts.<br>
      Just have a look at these characters (these are only the most obvious glitches):<br>
      </p><div class="imageWrap"><img src="/files/sanford_5719.png"></div><p></p>
      <p>Manipulated? — Yes. Refined?— No. Type design and font production is a time-consuming and ambitious task. One needs a lot of knowledge – not only in terms of software. And did I say <em>free font?</em>. Heck, she even asks $10 for it.</p>
      <p>End of rant.<br>
      Gordon, I have to admit that it looks quite nice on your website. If it works for you&nbsp;… For what JD did: it doesn’t necessarily have to be against the law (I don’t know), I just find it quite unethical.<br>
      Bottom line: There’s a reason why type costs money.<br>
      F</p>
