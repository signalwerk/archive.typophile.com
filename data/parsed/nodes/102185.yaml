    <p>This is a cruddy font I admit. But people are picky about them nonetheless.</p>
    <p>I assume someone livetraced/vectorized they're own handwriting and then put this out into the world without much thought. And if in fact it cannot be found because it was done more in-house by some desktop publisher--any idea of a font with a similar theme?</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Flower Child Font_6618.jpg"></div><p></p>
