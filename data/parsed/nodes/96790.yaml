      <p>Well, thank you, Hrant and, of course, screw you, Ryan. I just wonder what the hell I’m going to do with the domain name, by Microsoft Registered Vendor status, and eleven hundred lame-ass fonts. Maybe this guy would be interested in buying the concept…</p>
      <p><a href="http://www.gobignetwork.com/users/Eric-Inlaw2?utm_source=smartmatch&amp;utm_medium=email&amp;utm_campaign=smartmatch" title="http://www.gobignetwork.com/users/Eric-Inlaw2?utm_source=smartmatch&amp;utm_medium=email&amp;utm_campaign=smartmatch">http://www.gobignetwork.com/users/Eric-Inlaw2?utm_source=smartmatch&amp;utm_...</a></p>
      <p>For that matter, he might also like to invest in a Global Digital Rights Management Point-of-Sale plugin that would assign a unique serial number to MP3, fonts and other stuff, pay the rights holder instantly, then use the Cloud to track pirates. Or not: that’s probably a little too “Big Brother” to suit freebooting American tastes. After all, Hrant: YOU think that it’s a pretty good idea, and I don’t mind sharing.</p>
      <p>On a third hand, there’s also this screwy idea I have to use cheap plastic parts, flexible tubing, an air compressor and a Stirling engine to cut heating and cooling costs for every new residential or commercial facility in the entire world by at least 67%, and maybe even more…</p>
      <p>BTW, what dipwad came up with the “rent it for five minutes” provision to Monotype’s SkyFonts proposal. Wouldn’t it be better to sell EPS comps for, say, a buck apiece, with no minimum purchase—other than the FIRST buck, that is—required? Who knows? Some people’s monthly font expenditures COULD exceed their smartphone bills…especially if there are hot coeds involved.</p>
