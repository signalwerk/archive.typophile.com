      <p>Be careful with Font Doctor and all those fonts. An Extensis rep came to my former workplace and did a font migration of our Font Reserve server to a new one dedicated to UTS using Font Doctor. It was a complete disaster.</p>
      <p>As a preface I should mention a big problem Font Reserve had. Font Reserve would allow users to manage fonts on their own computers as it well should. Only problem was it was also copying these fonts onto the server. I was not managing fonts when that was all set up, but started about the time we got UTS. So when I went to go through the new migrated collection instead of a couple thousand fonts there were close to 10.000. More than half were unlicensed fonts pulled from users computers that were either corrupt or PS orphans. Font Doctor also merged versions of fonts with the same family name even if they were from different sources. I spent way too much time fixing that mess. The only good out of all of that was I got a large studio to finally pay attention to licensing.</p>
    html_clean: |-
