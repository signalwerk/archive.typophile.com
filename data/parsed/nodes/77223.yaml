    html: |-
      <p>re FontCase: Although the program has been a one-person endeavor it has the backing of FontShop International nowadays (they assisted with the plug-ins if I recall correctly).</p>
      <p>My program of choice is FontAgentPro, which is simple yet powerful and well maintained by the developer (example in case: they are quite forward with putting out new versions of plug-ins for new CS-versions, which counts in my view as a major plus). For a single person shop it is just the thing, imo.</p>
      <p>My tip for your friend/client: Backup all the font files onto a external drive. Erase from the main computer. Install just the necessary ones and the ones that come with Adobe apps. Search and install fonts as and when needed, preferably OS-format. And always test before giving newly installed fonts the right to live on.</p>
      <p>I did the same a couple of years ago and it's been plain sailing ever since… : )</p>
      <p>(I also have tried FontDoctor to sort out things, but it is — or was — quite finicky about certain characteristics which I never could place in context; maybe a misplaced byte by a font designer or such… The result: loads of font files classified as Reject/Repair and such, blah!)</p>
