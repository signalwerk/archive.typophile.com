    html: |-
      <p>You could look into a server based/browser based manager. That would allow users to still have system and some application fonts on their computers, but the main collection is all on one server. You can create specific user groups, manage licenses, etc.</p>
      <p>When I worked for a large studio we used Font Reserve (that had problems) and then switched to Universal Type Server (UTS) by Extensis. UTS seemed to perform well once you got used to it. Fonts with limited seat licenses can be restricted to specific groups. Font Reserve, also by Extensis,  I had problems with and wouldn't personally recommend.</p>
      <p>For myself at home I use Font Explorer also.</p>
