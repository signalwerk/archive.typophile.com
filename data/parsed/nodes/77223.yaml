    <p>I am coming to this forum of what I consider font experts in hopes of reviving an old discussion. Years back I posted this ...<br>
    <a href="http://typophile.com/node/5563" title="http://typophile.com/node/5563">http://typophile.com/node/5563</a><br>
    to the forum and frankly I have not had to deal with font issues for a while but recently an old client asked me to come in and install a new 27"iMac. </p>
    <p>Problem is their old workstation and files have been touched by numerous users who all have different ideas of how to manage fonts and there are multiple copies of numerous fonts and at least three different font managers, Apples Fontbook, Fontexplorer, Suitcase, you name it. </p>
    <p>They want auto activation, the current user has no leaning toward any one tool and does not seem inclined to tackle the issue of wading through multiple copies and organization, so it is up to me. I am re reading the Extensis "best practices" doc and this one I found googling.<br>
    <a href="http://www.jklstudios.com/misc/osxfonts.html" title="http://www.jklstudios.com/misc/osxfonts.html">http://www.jklstudios.com/misc/osxfonts.html</a></p>
    <p>I am seeking info on what you all think is the best way to cleanup and organize for starters then what management tool to use. My gut feel is to gather the fonts (minus system) use Font Doctor to clean and then use a management tool. What are yours?</p>
