      <p>Thanks all, the more I read the more I think many of the issues are because they went to a new Mac that has to use 10.6., there are some font conflicts with OS 10.6. Mainly Helvetica, Helvetica Neue and some others.</p>
      <p>has anyone read the two docs I mentioned? I am impressed with both but Kurt Lang's writeup is fairly new and complete, I am going to read it a second time today.</p>
      <p>Stephen, This is a one graphic person shop so a font server is not needed, you FontDoctor story is scary but plan is to clone the users Mac with either Carbon Copy Cloner or Super Duper, clone their OS to another Mac and figure out the issues there first so I am not too worried. </p>
      <p>JamesM and Fontrasin, if you made me choose today I would go with Fontexplorerx, in fact they own that as well as Suitcase which I made them them stop using and move to Fontexplorerx a few years ago because of issues but I hear it has improved.</p>
      <p>Tell thanks for the tip on FontCase, I love the company name! I googled it, reviews are good and a lot of people like it but auto activation was a big issue for him until recently. Also perhaps the biggest drawback is it appears they are a one man shop. The comments on the reviews keep pointing me back to Fontexplorerx.</p>
      <p>"About Bohemian Coding<br>
      Although I use the plural everywhere when I talk about Bohemian Coding, there's only one person in this company. Bohemian Coding was founded early 2008 in the Netherlands and is being run by Pieter Omvlee. We develop a number of great (at least in our opinion) shareware applications for Mac OS X and have many things planned for the future."</p>
      <p>Babs, stay tuned.....</p>
