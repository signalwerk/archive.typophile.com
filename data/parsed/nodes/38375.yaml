    <p>I am designing a war history book in two columnns 90 mm, 10,5 on 12,75 Sabon. As a complementary sans i have FF Nexus, for captions and extra text in 3 colum setting, 10 on 12,75 pt.</p>
    <p>I would be thankful for spontaneous reactions to the combination, is it ok, good or terrible? :)</p>
    <p>Suggestions on changing the text font? ( I'm rather not changing Nexus!)</p>
