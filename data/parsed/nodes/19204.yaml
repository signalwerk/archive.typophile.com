      <p>Hi, Gerald,</p>
      <p>Have you checked out the book list in the typowiki? Plenty of resources right there:</p>
      <p><a href="http://typophile.com/wiki/Books" title="http://typophile.com/wiki/Books">http://typophile.com/wiki/Books</a></p>
      <p>One book I don't see there is John Lewis' <em>Typography: Basic Principles</em>, which is out of print (1966, Studio Vista) but available used... It was also expanded and reissued as <em>Typography: Design and Practice</em> (1978, Taplinger), which you can also still find in used bookstores. It is like <em>The Thames and Hudson Manual of Typography</em> (1980, reprinted 1992) in that it was written BC, Before Computers. :-) But don't let that stop you from checking it out.</p>
      <p>As for online resources on how to use type as a designer, I can recommend:</p>
      <p><a href="http://www.thinkingwithtype.com" title="http://www.thinkingwithtype.com">http://www.thinkingwithtype.com</a></p>
      <p>Hope this proves useful.</p>
