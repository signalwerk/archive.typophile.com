    <p>as i've progressed as a designer, i've become increasingly aware about how i use type. i've been paying much more attention to the subtleties of kerning and tracking and leading and gutters and all that good stuff. i've begun to notice the tiny differences between my favorite serifs and sans-serifs, and i've become very interested in reading up the history of this stuff.</p>
    <p>so... give me your favorite bookmarks, resources, whatever! i'd like to really understand how i use type as a designer. and these things only help more and more. the typowiki on this site is great, but sadly does not contain as much info as i was hoping :(</p>
    <p>&lt;3!!</p>
