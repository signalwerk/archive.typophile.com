      <p>I recently bought the <a href="/wiki/Triumvirate" class="freelinking" rel="nofollow">Triumvirate</a> and haven't finished reading it but from what I've read so far (the first two) these books are absolutely indispensable to the typographically conscious graphic designer. If you want to take your typography to the next level, read these. </p>
      <p>Even though you’re not interested in designing type(?), I think it is necessary for the graphic designer to learn the basics of type design and hand lettering. Underware has a nice page on type design basics <a href="http://www.typeworkshop.com/index.php?id1=type-basics" rel="nofollow"><strong>here</strong></a> and G Briem has a useful site on type and handwriting <a href="http://briem.ismennt.is/" rel="nofollow"><strong>here</strong></a>.</p>
