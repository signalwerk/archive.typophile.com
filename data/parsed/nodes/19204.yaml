    html: <p>From what I gather, if you really want to get into it, you need to go to a convention centered around type &amp; type geeks. I sense that this may affect your perception of reality, and from which there is no turning back. Whatever *other* advice you receive here will probably be from someone with a progressive case of the disease. In any case, it doesn't appear to be terminal in any sense other than the usual.</p>
