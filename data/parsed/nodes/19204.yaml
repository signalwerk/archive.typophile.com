      <p>Good call, Geoff. I wanted to post links to Briem's and Underware's sites, but hesitated because Gerald expressed an interest in typesetting rather than typeface designing... But those sites offer very useful information it won't hurt a graphic designer to know... Briem's section on optical illusions is a good example of this.</p>
      <p>And Gerald, may I also recommend a couple of other books? </p>
      <p>One is <em>Printing Types: An Introduction</em>, another book by Alexander Lawson (it is listed in the typowiki book page). The other is <em>A Short History of the Printed Word</em>, by Warren Chappell. There is a <a href="http://www.amazon.com/gp/product/0881791547/qid=1144890960/sr=2-1/ref=pd_bbs_b_2_1/103-5164141-9033464?s=books&amp;v=glance&amp;n=283155" rel="nofollow">second edition</a> that was expanded by Robert Bringhurst, too, although I am only familiar with the earlier version.</p>
