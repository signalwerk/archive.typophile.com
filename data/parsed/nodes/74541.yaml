    <p>Hello everyone,<br>
    my name is Kasia and this is my first post in here. I'm designing a logo for an organic restaurant, the food is going to be a fusion of healthy cooking, the target... everyone. My brief said "flow", I got some pictures of flow forms, and did some further research on vortices created naturally by water and other substances. Here is the result at the current stage, in two versions, simplified and detailed. I'd appreciate any comments. Thanks! </p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/vantra_4127.jpg"></div><p></p>
