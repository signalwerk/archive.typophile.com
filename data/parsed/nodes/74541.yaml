    html: <p>The organic flow it's nice, but for me it looks a little bit too decorative...Why the spiral? Why the strange (they look too long and no needed for me) swashes on "t" and "a"? You should try to clarify the logo, linking the "V" to the rest and simplifying the n, the t and the a.</p>
  - id: 431013
    user_id: 74950
    user_name: Kasia Bielawska
    user_path: null
