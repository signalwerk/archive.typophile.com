      <p>I see what you mean with the "t", I think the reason is that it's been a bit overworked and lost some of the original hand drawn flow. The current vortex in "V" is a result of copying the curves of original vortices, I kind of like that it's not a perfect spiral, but maybe the break on the top is just too much. I would ideally like "V" to work on its own as well.<br>
