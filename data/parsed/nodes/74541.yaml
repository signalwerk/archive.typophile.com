    html: |-
      <p>Will, I didn't know how to write it otherwise, food is a fusion of many different origins, from Asian to Western, the common ground being that it's healthy, organic, either gently steamed or completely raw. My client's requirement was that the "V" stands out from the rest a bit, as it is a vegan place, but it shouldn't be anything too obvious. </p>
      <p>You are also right about the flow, vortices usually continue into another one. This is where the initial idea for the "V" came from, the third vortex from the bottom is more or less what I had initially, that little bit on the right could have been used as a connector, but I had to remove it:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/vortices_6389.gif"></div><p></p>
      <p>Luca, thanks, I'll try to do something with the swashes. The problem with connecting "V" is also that the little thing in the middle is supposed to suggest yin and yang, on client's request. I'm trying to think of a way to connect it and keep the symbol...</p>
