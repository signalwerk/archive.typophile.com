    html: |-
      <p>Hi,</p>
      <p>Thanks for the feedback!<br>
      I didn't care that much about the meaning of the name, to be honest.<br>
      I just felt the need of a font name started by the letter H :-)<br>
      Regarding the name itself, it reminded me some poetry (Poe, Byron, Baudelaire) that I used to read, like the "Don Juan in Hades", and that's it! I never wanted the font to be connected to some sort of evil stuff.<br>
      I think it's a pleasant font, inspired by the lettering in a beer house that I saw in Malmo in 2007.<br>
      It was made just for fun, no profit in the horizon!</p>
      <p>All the best to my fellow typophiles. Have a wonderful 2013!</p>
      <p>Dino</p>
