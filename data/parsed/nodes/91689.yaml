      <p>Hades was the guardian of the afterlife, which included the Greek concepts equivalent to both heaven <em>and</em> hell.  He was no more evil than, say, Zeus (and in fact was one of the more sober and respectable Greek gods).  The guy always seems to <a href="http://tvtropes.org/pmwiki/pmwiki.php/Main/EverybodyHatesHades" rel="nofollow">get a bad rap nowadays</a>, though.</p>
      <p>Nice font, BTW, thanks.  I will point out that your online catalogue isn't terribly useful for people on platforms/browsers which lack webfont support.  At least you do provide PDF samples, which is nice.</p>
