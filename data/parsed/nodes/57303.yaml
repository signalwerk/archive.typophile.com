    html: |-
      <p>A fuller crit...</p>
      <p>This looks really nice in text. I like the wide tracking and leading and think the serifs work very nicely...I'd add them to lots more letters, especially caps. The contrast is really nice and the glyphs seem to flow well and make nice word shapes. It's also really nicely drawn.</p>
      <p>The glyphs I'd look at are:<br>
      A: looks narrowish.<br>
      D: maybe a hair too narrow?<br>
      G: maybe a bit wide and/or the bottom corner could be lower?<br>
      H,I: nice serif treatment.<br>
      M,N: Nice joins.<br>
      P: deeper bowl?<br>
      V,W: Nice like the M and N.<br>
      Y: a bit narrow?<br>
      Z: corners a bit too pointy; try bevelling more?</p>
      <p>a: seems to need narrower sidebearing on the right.<br>
      e: bevel the nose? or curve the crossbar?<br>
      f: wider crossbar?<br>
      g: ear looks stumpy and sad. Needs more energy I think.<br>
      k: what about a looped arm? It's got a very pointy terminal.<br>
      o: pull out the bcps from the nodes more, it looks too oval.<br>
      r: terminal needs more oomph at the end. Try cutting it more vertically?<br>
      t: see f. Foot may need to be wider too.<br>
      u: looks ever so slightly too wide.<br>
      w: pull the feet apart more? Looks light.<br>
      z: see Z. </p>
      <p>Numerals: lovely. The join on 9 needs thinning. </p>
      <p>The punctuation is really neat. Comma and quotes look a little too fiddly/detailed. The tail is very thin.</p>
      <p>Good work, keep going :)</p>
    html_clean: |-
