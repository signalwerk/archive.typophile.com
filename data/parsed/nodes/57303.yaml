      <p>I'd keep it on the C, to add interest to the simple shape. I think there should be some underlying method, like 'put serifs on all the heavy oblique strokes' (such as AKMNRVWXY) but governing where vertical serifs appear on horizontals and curves, and how often. You might want to apply the same rules to the numerals?</p>
      <p>BTW on the seriffed C the bottom pokes out more than the top.</p>
      <p>I think the arms of K need more contrast. The bottom leg is usually heavier thant the top. Just a tiddly bit.</p>
      <p>The bowl of b seems to bulge more at the bottom than at the top.</p>
      <p>J needs I think a much healthier tail.</p>
