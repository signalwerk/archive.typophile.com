      <p>The 'S''s are an improvement as far as the spine goes. It's hard for me to judge the differences between the new alternatives - does the spine just keep getting thicker? One thing to watch is that a too-thick spine will start to make the terminals look weak. But this kind of contrast adjustment is best done looking at the other letters alongside.</p>
      <p>The first new 'v' terminal - where it just turns vertical at the top - best fits your other letters' character, I think. And yes, I think that treatment is promising for helping out 'V' and 'W'.</p>
