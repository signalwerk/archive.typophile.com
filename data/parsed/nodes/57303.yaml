    votes: null
    html: |-
      <p>This is turning into an interesting puzzle isn't it?</p>
      <p>I like the curved diagonals and the angled terminals. The difficulty is that the curved upstrokes make the counters a bit too narrow, I think. And I think the angled terminals need to have a little overshoot. I think it might be too much to have both the curves and the entry serifs. I marginally prefer the ones with the entry serifs and angled terminals.</p>
      <p>I don't think the serif on T works, but I like it on S and E. I'm not sure about L. I quite like the occasional-ness.</p>
      <p>I'd go with @ number four too. </p>
      <p>I like the way you just have a flat (ish) terminal on d and j but think it sticks out a bit as all the other stems have terminal features. </p>
      <p>I think the arm of r should be wider?</p>
      <p>What about a small entry stroke for the z?</p>
      <p>Bottom corner of G doesn't quite look right somehow. I'm not sure what I'd do to it. </p>
      <p>I'd make the tail of Q deeper and M a bit wider.</p>
      <p>The e is super! I'd bring the left join of the crossbar down slightly (keeping the nice curve) but I think that's just my personal taste.</p>
      <p>Great work, keep going :)</p>
