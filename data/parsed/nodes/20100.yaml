      <p>Wait, I forgot that I'm wielding not a spear but a trident. The other two tips:<br>
      2) Chirography wants to throw off optimal vertical proportions by making the descenders too long, mainly because chiro-structurally they need more room to properly elaborate, and secondarily because we write downward and tend to "flourish" descenders more.<br>
      3) Sensitive type designers -rightly- complain that overly geometric fonts have low readability, because they impose a grid, which is highly out of tune with our humanism. But chirography in turn imposes its own grid, it's just not a Cartesian one: it promotes a certain overt modularity among many letter structures (think of the b/d/p/q) that goes against the divergence our reading mechanism needs.</p>
      <p>Shame - it's such a pretty fish.</p>
      <p>hhp</p>
