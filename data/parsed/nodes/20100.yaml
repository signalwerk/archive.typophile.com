      <p>I agree that calligraphy is limited in its applicability to type, but it also has value in getting designers comfortable with making letters at all. I've seen plenty of novice designs that reveal not only a vague grasp on letterforms, but a nearly crippling inability to draw, to produce marks of any kind. </p>
      <p>For those who hope to design typefaces, I think anyone who has done some calligraphy, drawing, life drawing, cartooning, graffiti, drafting, or other hand work has a distinct advantage. If nothing else, hand skills get people used to representing ideas visually. Without the hand skills, it's apparently quite a struggle. </p>
      <p>Calligraphy deals not only with making marks and shapes but also letter proportion, overshoot, consistency of stroke, and spacing. Of all those hand skills, calligraphy offers the most advantages to a hopeful type designer.</p>
