      <p>In my view, Hrant you have hold of a partial truth which you generalize to the point where is at the very least misleading. </p>
      <p>Type, especially the roman lower case, was originally based on pen-formed letters. The very formation of these letters is influenced by the broad-nibbed pen. And in a number of ways the broad pen helped produce some aspects of readability, by automatically making 'optical corrections' to shapes and joins. For example, a vertical bar appears thinner than a horizontal bar of the same width. The broad pen, held at eg 30% produces broader verticals. Also joins, such as in the 'a' are naturally narrowed by the broad pen, making them look less 'clotted'. Also it may be that serifs, that are to a certain extent natural to the hand-moved pen, help produce more balanced letters. </p>
      <p>Now it is also true that features of hand writing oppose readability.   At TypeTech in New York last month, I was sitting next to the charming Cara Di Edwardo, a calligrapher who teaches at Cooper Union. She pointed out to me that writing slanted is convenient to the hand, but not to the eye. For the eye, upright is easier to read. </p>
      <p>The Carolingian Miniscule, the basis of lower case, is a formal hand that is slower to write, more unnatural to the hand, and more readable. It also has serifs on both sides of the bottoms of the strokes (and the tops of uvwxy), which are also slower to write, and perhaps more readable.</p>
      <p>Overall, hand writing cannot achieve the same evenness of color that type does. This was a key advance of Jenson and Griffo, who realized that making type more evenly colored than hand writing would make it more readable. And this is why typographic letters are almost always different from pen-written letters. (I am not speaking of built up letters. of course, which can be typographic.)    </p>
      <p>The roman lower case, then, is essentially a pen-written script modified for more even color. So the truth here, I think, is as Van Krimpen put it, that type is not 'chirographic', but it always retains an underlying influence, an "underlying force" of the pen.   This is why, contrary to Hrant, I think it is valuable to be aware what the pen might do and as you are designing letters when you are violating 'pen rules', which is very often.</p>
    html_clean: |-
