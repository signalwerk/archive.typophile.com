      <p>No type ever designed for text has glyphs that are just the product of a moving front, so chirography in type is a matter of degree. Furthermore, as Nick's admirable c shows, divergence between exterior and interior axes is not just possible but natural in type pretty faithful to the broad nib. As long as the designer understands which is the means and which the end, there's not a problem. If he doesn't, the danger is that he restricts himself unnecessarily to just a subset of the possibilities for black-white tension, and uncritically accepts other properties given glyphs by the broad nib, like line weight at certain angles, as a package. I also agree with Hrant that the idea of a skeleton inside the glyph isn't useful.</p>
      <p>Redge, I think you'll come to find that you appreciate different qualities in text and display. It's normal to acquire an interest and independent taste in display type first, which may or may not drift towards or expand to include text type. This isn't just an intellectual thing either, one's immediate aesthetic responses change. Neither is it a matter of a binary switch: I now find good type most attractive when set a good deal smaller than I did eight months ago. And I don't want to sound patronising: I'm also new to all this, and am horrified at earlier versions of my typo-critical self that are still fresh in the memory. Presumably this iterating self-disgust will continue for some time yet :-). PS: my opinion of W&amp;P is pretty much Tolstoy's own: he was a hard-nosed moralist as well as a great artist, and he freely (and by the end almost wholly) gave up aesthetic virtues for ethical ones, even denying that W&amp;P was a novel at all. AK was the book that was meant to be (and was, limitlessly) beautiful.</p>
