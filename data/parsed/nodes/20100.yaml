      <p>Hrant mentioned his dislike of Noordzij's theory in another thread. To avoid a discussion in a thread not suitable for the subject I was sent here.</p>
      <p>I must say I find this discussion rather strange. I think it's good to discuss both advantages and limitations of calligraphy but I don't think it even should be relied on completely. As such, I don't understand people's discontent with chirography.</p>
      <p>I have to admit I sometimes do some calligraphy to find interesting letter shapes but I haven't used any of them yet. My process — so far, anyway — is completely digital. I think I don't even need to rely on chirography because we have hundreds of years of typefaces based on chirography, and typefaces based on chirography-based typefaces and so forth. It's really strange to me to disregard its value.</p>
      <p>I thought Noordzij's theory was very enlightening and in a way it made my world of type design richer. However that doesn't mean people should rely on it, but it has given me great insight in how letters are constructed and how they behave, and furthermore gives me the liberty to consciously break type design rules.</p>
      <p>You would also think that calligraphy couldn't possibly bring new shapes anymore, but I completely disagree with that as well. My high contrast sans grotesque 'Dagon Sans' was inspired by calligraphic principles, and I also have a several calligraphic letter forms on paper which could potentially be the basis for new typefaces. For example, I made an 'a' with an unconventional serif and weight build-up but it looks very nice. I wouldn't know if it works at all throughout a complete typeface, but I think that's the fun of chirography.</p>
      <p>I also wonder if a typeface like Legato could've been developed at all without a chirographic approach.</p>
      <p>&gt; Basically, it favors the black bodies of letters (by tying the two edges of the<br>
      &gt; black, via a marking tool/metaphor) and this impedes the optimal formation of notan<br>
      That's assuming you're using your calligraphic pen in a fixed position instead of subtly  rotate. Also, why would you assume a type designer wouldn't fix these parallel lines digitally?</p>
