      <p><em>“We don’t read the black, but the relationship between black and white.”</em></p>
      <p>Hrant, I like this idea, but I would qualify it by saying that we see in many ways, so it's quite possible that we are aware of a figure, and a figure-ground relationship, simultaneously, as two different phenomena.</p>
      <p>Something may be going on at the level of ocular micro tremor. OMT occurs at around 86 Hz, and is presumed to function to prevent image fade by constantly stiumulating the retina. However, as has been noted by Paul Kainen, it also registers patterns, by creating an interference field.<br>
      <a href="http://www.georgetown.edu/faculty/kainen/topoliss.pdf" title="http://www.georgetown.edu/faculty/kainen/topoliss.pdf">http://www.georgetown.edu/faculty/kainen/topoliss.pdf</a><br>
      Page 8-9.</p>
      <p>Raph's Fourier analyses (shown on Typophile last year) demonstrate that repetitive texture is a quality of typography.</p>
      <p>Therefore, it seems reasonable that OMT would play a role in the global perception of type in mass layout, rather than through sequential reading with normal saccades.</p>
      <p>There needs to be some explanation of why a skilled proofreader can look at a page of text and spot a typo immediately. So I hypothesize that learning to read fluently exploits OMT to perceive certain qualities of text globally, and that the rhythm or text color that typographers speak of is part of this awareness.</p>
