      <p><em>we don’t read the black, but the relationship between black and white</em></p>
      <p>Well of course, one can't exist without the other.<br>
      But we DO read the black (unless the type is reversed), in the sense that we read a figure against a ground. This is why Bodoni can be problematic, because the vertical black strokes are similar in weight to the vertical white spaces between them, and a 50/50 figure-ground relationship makes for nasty notan, ambiguous gestalt. </p>
      <p>The serifs that a broad nibbed pen create serve to disambiguate the relationship between figure and ground by giving the figure more "masculinity".</p>
      <p>And the angled stress of the broad pen also serves to disambiguate positive and negative, by accentuating the differences between the "figurality" of each. Consider the potential figures in this chirographic "c":<br>
      1. The positive figure, schematized as a line running along the spine of the glyph (far right).<br>
      2. The negative outside figure -- not very apparent, and not schematized.<br>
      3. The negative counter figure, schematized as the boundary between positive and negative (centre).<br>
      It can be seen that the negative figure is more angular than the positive and differently skewed, and these qualities -- presumed to be instrumental in a notan/gestalt theory of readability -- are a direct result of chirographic structure. Functional, not romantic.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Ccc_3800.jpg"></div><p></p>
