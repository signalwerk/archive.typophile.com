      <p>Personally, I think that the design space between Times Roman, Corona, Baskerville, Caslon, Century Expanded, Cloister Lightface, and Caledonia needs to be more fully explored, as I think that some typefaces closer to "optimal" or at least "invisible" - wide Scotch Romans, like Number Eleven - have gotten lost or remain to be designed.</p>
      <p>The novel and startling need to be explored <em>too</em>, because with a larger range of possibilities, we can find more things, but I think that even in the world of typefaces that people read without a second thought, there is room for a bit more fine-tuning to make the process of reading go even more smoothly. And that means typefaces that impose no noticeable surprises.</p>
      <p>Even if the serifs might look very novel when placed under a powerful magnifying glass.</p>
      <p>So putting chirography aside is low on my list of priorities.</p>
