      <p>I just realized that I replied to Josh's post but have ignored interesting contributions that came before; I hope to rectify that soon. But for now let me keep this particular train rolling.</p>
      <p>John, there indeed remain some unexplored corners of the Chirographic Continent, and it's entirely possible that some of those corners might contain gold; but when it seems much more promising -if also risky- to cross over to other continents, it just seems wasteful not to; our time on this earth is not unlimited. Also, to me most chirographic designers don't seem sufficiently preoccupied with discovery - they generally seem principally interested in elaboration/refinement. To me that's good for business more than it's good for culture.</p>
      <p>BTW: <a href="http://typophile.com/node/31095" title="http://typophile.com/node/31095">http://typophile.com/node/31095</a></p>
      <p>Chris, first of all, philosophically I do agree with you. The thing is, when you say "there is no need to overemphasize anything at the expense of closing doors", looking at the output of  KABK students there does seem to be a single door that's left much more open to the students than any other door; Reading isn't like that.</p>
      <p>But beyond that, practically speaking one tries to balance exploration and production, and the latter requires you to adopt a stance, so you can actually make something. This doesn't mean the stance is Perfect, and it doesn't mean changing you mind is evil. But being a 100% relativist is guaranteed to leave you with zero usable output.</p>
      <p>hhp</p>
