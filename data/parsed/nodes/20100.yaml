      <p>I'm a big fan of the unexpected! But there's really not much unexpected left in chirography. Instead of your hand you should use your foot, your mouth; instead of a broad-nib pen you should use a rock. And if you <cite>really</cite> want to "screw around", you extract the unexpected directly from your mind into outlines, instead of through an arbitrary body-marking medium, which is inherently anti-optimal-notan.</p>
      <p>hhp</p>
