      <p>Very interesting, Nick. Is it true? I don't know. But my point about awareness is that we don't really yet understand fully what are the advantages and disadvantages of the pen-written moving front. </p>
      <p>My basic problem with Hrant's view is that it pretends to more knowledge than any of us, including Hrant, have. So when we mess around with, eg. the pen-influenced traditional stress on the Cap A or M, we'd better be aware of it, and see whether we are making things better or worse. </p>
      <p>It isn't a matter of romanticism, but just appropriate modesty, and appreciation of the strength of the hundreds of years' tradition of people making typographic letters, and the thousands of years before that of pen-written letters.</p>
