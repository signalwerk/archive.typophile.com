      <p>There is nothing wrong with chirography as a means of achieving good notan, in fact the flexible broad nibbed pen is a brilliant instrument for this.</p>
      <p>Calligraphic techniques -- such as rotating the nib angle during a stroke, or varying pressure, or easing off a terminal stroke by dragging one side of the nib -- have been used from before type, to imitate the effects of other media (notably stone carving) and pen or brush lettering, as well as to create complexity and sophistication beyond the basic, consistently angled written form.</p>
      <p>Using chirography as the organizing principle of type design has much merit. Of course, if you do it in a banal and simplistic way, you will get the kind of results that Hrant decries. But the tool (and methodologies derived from it) cannot be dismissed just because a few, or even many, practitioners use it in a naive manner.</p>
      <p>In this example of the textus quadratus, a 14th century scribe is certainly not droning throught the alphabet with "overt modularity", but giving the reader plenty of divergence.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/bdqp_4418.jpg"></div><p></p>
