      <p>Basically, it favors the black bodies of letters (by tying the two edges of the black, via a marking tool/metaphor) and this impedes the optimal formation of <a href="/wiki/notan" class="freelinking" rel="nofollow">notan</a>, which is the unity and relation of black and white. Notan being what we read. Chirography isn't going to destroy the world or anything, but it's still bad craft.</p>
      <p>hhp</p>
