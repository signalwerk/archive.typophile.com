      <p>Do note that Crafting Type is skewed heavily towards Reading, considering its instructors - and instructors do influence their students (even if they don't want to). That said, I personally think that -if you're not careful- the Noordzij approach can become a "foundation" the way cement shoes are a foundation...  :-/</p>
      <p>KABK seems to be incredibly good at getting student to quickly produce highly polished, salable fonts in a certain style. Reading doesn't do that as well, as quickly; but to me education isn't about production. When I was invited to speak to the Reading students this past June, and got to talk more deeply with their instructors concerning how they like to teach, I was very happy to see how they try so hard to let the student develop their own views, in fact at the expense of passing along theirs; the students attest to this as well. Most people simply can't produce high-quality fonts in one year without the instructors exerting an undue influence. And I personally always want to see new people in type design, not proxies of existing people.</p>
      <p>Related - see my comment here:<br>
      <a href="http://typographica.org/typeface-reviews/quintet/" title="http://typographica.org/typeface-reviews/quintet/">http://typographica.org/typeface-reviews/quintet/</a></p>
      <p>You will undoubtedly learn much from Type@Cooper. But if you take a pinch (more like a bag :-) of salt with you you'll be able to apply what you learn in much more culturally valuable ways, at least the way I see things.</p>
      <p>BTW if all goes well I'll be teaching at the LA edition of Type@Cooper. And I'll bring the salt.  :-)</p>
      <p>hhp</p>
