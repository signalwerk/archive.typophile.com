      <p>I recently did Dave Crossland's Crafting Type workshop in Portland, and he presented this quote from Gerry Leonidas (dept. head of the Type Design MA at Reading): "Type design is layering forms derived from personal expression onto an underlying structure of patterns derived from convention and typographic technology." </p>
      <p>I wouldn't want to suggest there's a rivalry where there really isn't one, but it does seem like the KABK and Reading, the two dominant typeface design programs in the world, have approaches that differ in fundamental ways, the KABK's firmly rooted in Noordzij's theory of the stroke, versus Reading's approach -- from what I've heard from past students, and from the quote above -- being more connected to the ideas of layering forms and patterns, although Noordzij's ideas certainly are taken into account. I'm doing the Type@Cooper program this summer, the condensed one with Hannes Famira and Just van Rossum, so I'm guessing this will be more like the KABK's approach since they both studied with Noordzij.</p>
      <p>My personal take (and this is liable/likely to change, or at least evolve, in the future): the Noordzij approach seems really useful for a singular, focused approach towards gaining an ingrained hand-eye understanding of letterforms. As someone with fairly decent bezier drawing skills and computer skills in general, the sketching/calligraphy bit is the part I would really like to gain an understanding of. But I also would never want to become a fervent disciple of The Stroke and The Stroke alone -- it just seems like a good foundation. I think of it sort of like drawing classes in most design programs. You will probably never be asked to illustrate a bowl of fruit or a draped sheet in charcoal during your career, but gaining that fundamental understanding of form and graphic interpretation is key to being able to move on to more common forms of illustration.</p>
