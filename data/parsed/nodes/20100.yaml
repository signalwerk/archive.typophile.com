    <p>Please forgive my ignorance here, but I was reading a current thread in which Hrant was bemoaning Gerrit Noordzij's <a href="/wiki/chirography" class="freelinking" rel="nofollow">chirographic</a> approach.</p>
    <p>I can't say I get it.  For this discussion, I'd like to set aside issues of pedagogy or influence, deserved or undeserved.  Strictly from a design perspective, what's so wrong with chirography as a foundation for typeface development?</p>
    <p>--Jim K.</p>
