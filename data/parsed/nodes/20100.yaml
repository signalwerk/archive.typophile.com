      <p>&gt; has a limit in terms of the functionality</p>
      <p>That's another way of putting it.<br>
      And a functionality that's at the heart of text face design: readability.</p>
      <p>More: When you focus on marking the black (whether with a broad-pen or a seashell dipped in avocado juice) the white can only be subservient. And we don't read the black, but the relationship between black and white** (which is defined by the outlines) so that's bad.</p>
      <p>** Especially in the parafovea, which I believe accounts<br>
      for about 2/3-rds of fully immersive reading.</p>
      <p>An entertaining way of looking at this (leading off from Nick's "unexpected") is a certain maritime analogy that I'm fond of: chirography limits any seafaring exploration to your own continent, because you have to hug the coast*. In contrast, armed with an astrolabe (an understanding of readability) you can cross the vast oceans by using the mysterious night sky, and hopefully (although not certainly) discover a new continent. It's just that adventurers are a rare breed - although sometimes they get lost at sea...</p>
      <p>* Adding that this continent is really 99% mapped already.</p>
      <p>&gt; we haven’t really heard any specific discussion of techniques<br>
      &gt; in type design that reveal just what those limitations are.</p>
      <p>It's hard enough just to overcome the knee-jerk defense mechanisms.  :-)</p>
      <p>In fact in my experience discussing specific letterform features (like trapping, or non-ductal stroke weight distribution) generally results in a pro-chirography designer stating "hey, I can make that shape with a pen!" And you certainly can, if you manage the necessary contortions very carefully. You can also get around by crawling on your back, naked. The question is, what's the point? I think most often the point is sadly just an artistic indulgence, at the expense of the user.</p>
      <p>hhp</p>
