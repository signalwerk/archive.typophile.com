    html: <p>I cannot see the issue as being chirography vs. non-chirography. As humans, we have thousands of years of being to fill our visual literacy pools.  There is no need to exclude anything just as their is no need to overemphasize anything at the expense of closing doors to other potentials.  Where ever you study, or with whomever you study, understand that there is always more than that to see.  Open doors, do not close doors.  Always question your teachers--most will welcome your inquiry (those who don't may be guarded in their answers).  We are all enquiring systems.  We only feed our curiosity when we question.  No one source is totally correct. Being totally correct may not be a virtue at any rate. Think of yourself as a growing organism that is fead by exposure to many things. You are not on a straight path to righteousness, you are on a meandering array of streams of stimuli that have no clear resting point.  Keep sailing.</p>
