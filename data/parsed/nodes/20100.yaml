      <p>But I really don't think we have a shortage of innovative and experimental type designs. The "high art" tradition, where the focus is on doing something that's never been done before, instead of on craftsmanship building in a small way on what one's predecessors have accomplished, is very much alive and well - and present in type design, despite the presence of craftsmanlike thinking there as well.</p>
      <p>There's a place for both types of endeavors, and it doesn't make sense to ask those in one camp to move to another. On the other hand, if you are deploring the lack of designs aimed at mainstream purposes that make use of innovative ideas - that show that a typeface can be an effective tool to convey information without being solely steeped in tradition - then I don't disagree with the sentiment. I would just point out Optima as something I consider to be one of the few exceptions to that, to show there is some cross-fertilization between the avant-garde and the mainstream, even if it is limited and slow.</p>
      <p>EDIT: Further thought on this issue is bringing me around to acknowledging the importance of the issue, rather than just feeling you are being impatient.</p>
      <p>It's natural for designers who are aiming at the utility of their product to stick with what is tried and true, and it's also natural for those whose purpose is "Hey! Look at me!" not to try and design typefaces that avoid being distracting (a near-prerequisite to usefulness), but these tendencies, natural though they are, <em>are</em> potentially sufficiently limiting that it does make sense to urge a conscious effort to resist them on both sides of that divide.</p>
