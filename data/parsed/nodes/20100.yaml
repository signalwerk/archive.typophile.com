      <p>Business and Culture are certainly not diametrically opposed, they're more like at 120 degrees. Any creative act is a vector in that span. And in a Democracy the larger the vector the faster it will shift towards Business.</p>
      <p>It goes without saying that liminographic (better than "anti-chirographic") fonts are nothing new, in fact considering the medium in a way they're the rule; even when you scan &amp; trace a font out of actual calligraphy, something shifts. My contention is that overall we remain firmly under the strong illusion of chirography. Evidence? Formal education in type design. Even at Reading it's a bit too strong.</p>
      <blockquote><p>it doesn't make sense to ask those in one camp to move to another.</p></blockquote>
      <p>I don't see it as camps - any individual is an admixture of opposing beliefs, constantly reconciling them so he can continue breathing. When I preach liminography, I'm not targeting anybody in particular; mostly it just feels like a duty to counterbalance the pervading illusion.</p>
      <blockquote><p>I really don't think we have a shortage of innovative and experimental type designs.</p></blockquote>
      <p>Actually, there is a growing undercurrent of discontent there. Ruxandra Duru's paper* is a great read in this respect, with Thomas Huot-Marchand decrying a new conservatism, and Jefferey Keedy going much further in calling this era "the new dark ages". You don't have to be a fan of every product of the 90s to miss its presence in some ways. We need many more Legatos and Fenlands.</p>
      <p>* <a href="http://ruxandra-duru.com/web/pdf/Ruxandra_Duru_type_foundries_today.pdf" title="http://ruxandra-duru.com/web/pdf/Ruxandra_Duru_type_foundries_today.pdf">http://ruxandra-duru.com/web/pdf/Ruxandra_Duru_type_foundries_today.pdf</a></p>
      <p>Wei, that was bad, sorry.  :-)<br>
      What I meant was that our consciousness enjoys the grid, but it goes against the needs of our "deeper" human self.</p>
      <p>hhp</p>
