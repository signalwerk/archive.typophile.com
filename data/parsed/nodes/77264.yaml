    html: |-
      <p>I would also suggest bringing the type size up and if embossed maybe bolder? </p>
      <p>The 'Est. 1995' typeface to me doesn't work comfortably with the sans serif of the rest of the design, maybe this is due to its size? Could be worth trying this spaced out a lot (loads of tracking?) in the same typeface as the rest? </p>
      <p>If you want to give it a hint of classicism maybe try a decorative line?</p>
