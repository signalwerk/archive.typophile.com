    html: |-
      <p>To me the type looks a little small in that big rectangle; I'd suggest making all the type proportionally larger. And the "est. 1995" looks especially too small to me. </p>
      <p>Have you tried reducing the logo down to the small size it'll be on a business card or small web ad? Not sure all that reversed-out type, especially "restaurant",  will hold up in tiny sizes.</p>
