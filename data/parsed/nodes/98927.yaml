    html: |-
      <p>Web browsers normally won’t use the kerning information in fonts. This might be the source of the spacing issue. To force modern browsers to use pair kerning, add the following line to your CSS text declarations that are using the custom font:</p>
      <p><code>text-rendering: optimizeLegibility;</code></p>
    html_clean: |-
