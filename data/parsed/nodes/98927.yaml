    html: |-
      <p>That's a good article. A bit behind on some details, though. Notably Firefox switched suddenly to using the "new" syntax recently. So you need two lines for Firefox, one "old" and one "new" if you want to catch all browsers....</p>
      <p>Turning on the common features that ought to be on by default currently looks like this:<br>
        -moz-font-feature-settings:"calt=1, liga=1, clig=1, kern=1";<br>
        -moz-font-feature-settings:"calt" 1, "liga" 1, "clig" 1, "kern" 1;<br>
        -ms-font-feature-settings:"calt", "liga", "clig", "kern";<br>
        -o-font-feature-settings:"calt", "liga", "clig", "kern";<br>
        -webkit-font-feature-settings:"calt", "liga", "clig", "kern";<br>
        font-feature-settings:"calt", "liga", "clig", "kern";<br>
        text-rendering:optimizeLegibility;</p>
    html_clean: |-
