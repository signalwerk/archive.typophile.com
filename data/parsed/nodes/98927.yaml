    <p>Hello,<br>
    For my very first time, I have created a webfont in two formats via FontSquirrel (hurraa!), but how do I check them? When I open the .ttf web-version in e.g. InDesign, everything is OK, but how do I install .woff/.eof, so I can watch it/write with it in my browser (Safari)?<br>
    I have no web-applications at all, and no experiance with webdesign.</p>
