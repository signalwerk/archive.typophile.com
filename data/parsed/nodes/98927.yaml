    html: |-
      <p>Instead of:<br>
      text-rendering: optimizeLegibility;</p>
      <p>I will recommend:<br>
      font-feature-settings: "kern" on, "liga" on<br>
      -moz-font-feature-settings: "kern" on, "liga" on<br>
      -webkit-font-feature-settings: "kern" on, "liga" on<br>
      -ms-font-feature-settings: "kern" on, "liga" on<br>
      -o-font-feature-settings: "kern" on, "liga" on</p>
      <p>In the future, hopefully, only:<br>
      font-feature-settings: "kern" on, "liga" on</p>
