    html: <p>It's the whole point of WOFF/EOT that they can't be installed in a regular operating system.  You just link them in your HTML/CSS files and the browser will use them. So to test it, you need to prepare a HTML page. The FontSquirrel Generator download package should have such test documents already in it.</p>
