      <p>Yeah, text-rendering: optimizeLegibility is a tricky one. I still recommend it's use, but it's not because it's ideal, and I look forward to when I won't need to anymore. It was always a kludge. You can get some more info here:<br>
      <a class="freelinking external" href="http://www.typotheque.com/articles/opentype_features_in_web_browsers" rel="nofollow">http://www.typotheque.com/articles/opentype_features_in_web_browsers</a></p>
      <p>You've really just got to keep an eye on the browser updates at this point, unfortunately.</p>
