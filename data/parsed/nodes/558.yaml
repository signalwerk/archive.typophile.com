    html: <p>What I meant though was that there seem to be different dimensions to the physicality. I have a tentative handle on the relevance of some of them (like type height, and impression pressure), but I'm still in the dark concerning others (like ink behavior - especially in the shoulders, the direction of the cylinder, the dynamics of the paper, and others). And of course these all relate, which makes the whole largely mysterious (to me). <br> <br>&gt; a course in calligraphy is heading your way. <br> <br>Totally. Know your enemy. <br>And after that, a course in cave painting. <br> <br>The most useful thing about studying "history" is to learn form the mistakes. <br>Otherwise it's just cloying nostalgia. <br> <br>hhp <br></p>
