    html: "<p>&gt; is the outcome a good scale or not? <br> <br>Yes, I agree that's the real question. But I don't have the font! I'd need to look closely at all the PDFs to be sure. <br> <br>Like I said before, optical scaling comes in varying qualities - Garajannon certainly has optical scaling, and it seems much better than average too. Maybe \"optimal\" is confusing. <br> <br>Spartacus is indeed interesting. And I think its vertical proportions are actually right on*: the x-height <i>has</i> to start getting \"obese\" at about 8 point. Look at the ATF Garamond stuff, and consider how little room is left for the ascenders in the smaller sizes. <br> <br>Your \"bias\" there is probably an issue of deliberation versus immersion: you can't judge the merits of a text face by reading it large. You can only really do it to the extent that you understand readability. I don't mean to say that you don't understand readability, just that it's challenging to always work with this paradox all the time. <br> <br>* Although the descenders seem slightly too long to be text-centric. <br> <br>hhp <br></p>"
