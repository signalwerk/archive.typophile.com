    html: <p>Hrant, <br> <br>"What are some instances of superb optical compensation, and why?" I am not sure I have arrived at any conclusions as what is superb. What is not superb is what we have now, nothing. I suppose we could build something that is worse than nothing but let's not do that. <br> <br>But when I said that the designer may wish for input you have found the right illustrations, which are very good. ATF seems to have moved strongly in favour of legibility. (Also from an analytical angle) But I am not to sure if they have gone too far? My own leanings favour Imprimerie Nationale's. However, I admit Lanston went the way of ATF. Both enhance legibility, the Imprimerie Nationale's preserves more characteristics of the face. <br> <br>My prediction is that there will always be a designer who favours preserving characteristics of the design but seeking "legibility gain". And there will be the strongly "functional personalities" which will lean towards "maximizing legibility" at any cost. <br> <br>Maybe an on and off function? Oooh, that sounds like three stations on the dial, an "off", an "artistic", and "maximizing legibility" station. What do you think of calling it "radio scaling"? After all optical scaling is somewhat misleading. <br> <br>Also I am in agreement that tackling this with an analytical angle is imperative. <br> <br>Speaking of on and off functions. I am also in agreement with you that by default the best solution should be activated. But you can appreciate sometimes it nice to be able to turn things off such as kerning. That Birds &amp; Tree <br><a href="http://www.lanstontype.com/SvartSkepp.html" target="_blank">http://www.lanstontype.com/SvartSkepp.html</a> <br>colour ornament would not work as it does if that were not the case. <br> <br>With the "Birds &amp; Tree" you turn the kerning off, colour the elements in the unit, turn it on and they register. How much do you want for your dot. com? Write me. <br> <br>But by default, yes keep the kerning on. Make the default the most useful function. That would also apply to "radio scaling". Actually when I think about "radio scaling" it is not a bad word for it. It conjures up "other solutions". "Optical scaling" as a name can indicated the opposite of what we are trying to achieve. After all, optical scaling is what we have now, type as though shrunk down by a lens. <br> <br>What we want is type "scaled for human optics". So it is receptive optics that we seek, not projective optics. <br> <br>Optical scaling was illustrated by inherent mechanical weakness. <br> <br>What I am saying is that Garamond did not use the word "optical scaling". ATF did? <br> <br>I am thinking out loud. Sorry. Anyway I know names can be silly. I think "radio scaling" is dynamic, may lead to several solutions. Certainly it is better than calling it "optical scaling" which is misleading or, a variation such as "receptive optical scaling" which is not elegant naming. <br> <br> <br> <br> <br>Gerald Giampa <br>Lanston Type Company <br> <br> <br> <br> </p>
