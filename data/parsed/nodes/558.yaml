    html: <p>Hrant <br> <br>Just a note on the procedure. It will lessen the difficulty of "fighting gain," if you were to repro these in relative size groups. The reproduction press is going to ink smaller sizes heavier if it is "set" (impression, inking) to print the larger sizes correctly. If it is "set" to print the smaller sizes, it will underink the larger. Separate printings are really the only way around this on a reproduction press where makeready won't help much (and which could actually give you a false reading). Seriously. <br> <br>Gerald</p>
