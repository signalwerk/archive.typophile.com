  - id: 4124
    user: 1250
    date: 2003-07-18T13:37:00
    date_raw: 18.Jul.2003 1.37pm
    votes: null
    html: "<p>&gt; I am sure there will be lots of opinions as to what should be done in the way of optical scaling. <br> <br>So what's your opinion? <br>What are some instances of superb optical compensation, and why? <br> <br>&gt; I suspect each designer would like to have some control over his or her font product! <br> <br>Designer control is great. It doesn't preclude designers from approaching the problem from an analytical angle, not just one of preconceptions and personal preference. There are different ideologies out there, and each can have validity in certain contexts, but there are also the realities of human perception and cognition. <br> <br>One central tricky question is this: <br>What's a good balance of character versus legibility at the smallest sizes? <br> <br>For example, does the ATF Garamond go too far? Is the Imprimerie Nationale's version* better because it preserves more of the Garamond character (albeit at the cost of reducing legibility)? How much character can be conveyed at 6 point? And what about the greater proportion of all-caps setting at the smallest sizes (I think the reason for the sudden shrinking in the descenders of the ATF)? <br> <br>* Thanks to Kent for helping me make these: <br><a href=\"http://www.themicrofoundry.com/other/garas_12.gif\" target=\"_blank\">http://www.themicrofoundry.com/other/garas_12.gif</a> <br><a href=\"http://www.themicrofoundry.com/other/garas_10.gif\" target=\"_blank\">http://www.themicrofoundry.com/other/garas_10.gif</a> <br><a href=\"http://www.themicrofoundry.com/other/garas_06.gif\" target=\"_blank\">http://www.themicrofoundry.com/other/garas_06.gif</a> <br> <br>-- <br> <br>As for the mechanics of using optically scaled type, I think generally a continuous axis -like in MM- is just fine, although MM is no longer well supported. So the application would generate the right instance based on the point size. And if you have a series of sizes instead of an axis, it would be great to have application support for choosing the closest ideal size automatically. Of course, this is the type of stuff MM should have done from day one, but they never implemented any automation at all... probably because the average user (the target of Adobe, but hopefully not everybody) went \"huh?\"... <br> <br>-- <br> <br>I can even see software generating optical scaling automatically. Although it can never be as good as the man-made stuff, if the software could make the font wider, looser and darker for the smaller sizes, that would already help a lot. And if it could fiddle with the vertical proportions too, you'd be 90% there. <br> <br>As for turning it off, it should be like an airbag: it should be on by default, and not trivial to turn off. People should only turn it off if they really think they really know what they're doing. <br> <br>hhp <br></p>"
    html_clean: "<p>&gt; I am sure there will be lots of opinions as to what should be done in the way of optical scaling. <br> <br>So what's your opinion? <br>What are some instances of superb optical compensation, and why? <br> <br>&gt; I suspect each designer would like to have some control over his or her font product! <br> <br>Designer control is great. It doesn't preclude designers from approaching the problem from an analytical angle, not just one of preconceptions and personal preference. There are different ideologies out there, and each can have validity in certain contexts, but there are also the realities of human perception and cognition. <br> <br>One central tricky question is this: <br>What's a good balance of character versus legibility at the smallest sizes? <br> <br>For example, does the ATF Garamond go too far? Is the Imprimerie Nationale's version* better because it preserves more of the Garamond character (albeit at the cost of reducing legibility)? How much character can be conveyed at 6 point? And what about the greater proportion of all-caps setting at the smallest sizes (I think the reason for the sudden shrinking in the descenders of the ATF)? <br> <br>* Thanks to Kent for helping me make these: <br><a href=\"http://www.themicrofoundry.com/other/garas_12.gif\" target=\"_blank\" class=\"link-external\">http://www.themicrofoundry.com/other/garas_12.gif</a> <br><a href=\"http://www.themicrofoundry.com/other/garas_10.gif\" target=\"_blank\" class=\"link-external\">http://www.themicrofoundry.com/other/garas_10.gif</a> <br><a href=\"http://www.themicrofoundry.com/other/garas_06.gif\" target=\"_blank\" class=\"link-external\">http://www.themicrofoundry.com/other/garas_06.gif</a> <br> <br>-- <br> <br>As for the mechanics of using optically scaled type, I think generally a continuous axis -like in MM- is just fine, although MM is no longer well supported. So the application would generate the right instance based on the point size. And if you have a series of sizes instead of an axis, it would be great to have application support for choosing the closest ideal size automatically. Of course, this is the type of stuff MM should have done from day one, but they never implemented any automation at all... probably because the average user (the target of Adobe, but hopefully not everybody) went \"huh?\"... <br> <br>-- <br> <br>I can even see software generating optical scaling automatically. Although it can never be as good as the man-made stuff, if the software could make the font wider, looser and darker for the smaller sizes, that would already help a lot. And if it could fiddle with the vertical proportions too, you'd be 90% there. <br> <br>As for turning it off, it should be like an airbag: it should be on by default, and not trivial to turn off. People should only turn it off if they really think they really know what they're doing. <br> <br>hhp <br></p>"
  - id: 4125
