    html: "<p>So I was looking through that FyrisFonts site - it's quite amazing. <br>Very broad and deep content, or at least it seems so - I don't read Swedish. But I tell you, I don't remember the last time I wanted so badly to be Swedish! <br> <br>-- <br> <br>It looks like Lundhem takes optical scaling much more seriously than most, with some intelligent and novel analysis. Particularly interesting is the graph towards the bottom of: <br><a href=\"http://www.fyrisfonts.com/artiklar/jenson/default.asp\" target=\"_blank\">http://www.fyrisfonts.com/artiklar/jenson/default.asp</a> <br>It indicates that Adobe Jenson uses a \"bi-linear\" model, and it's notable that InDesign's \"optical spacing\" follows this model exactly as well. <br> <br>But then in the Minion section, the scaling seems to be much more refined. Very interesting. <br> <br>-- <br> <br>On the other hand, as for the work on Garajannon-MM (which seems not to be for sale except as distinct instances), if in fact he's made a linear interpolation between the 8 and 48 point, that's not optimal - although the effort itself is highly commendable. <br> <br>hhp <br></p>"
