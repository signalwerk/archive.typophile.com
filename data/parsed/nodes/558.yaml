    html: "<p>&gt; how steep is the adjustment curve at the low end <br> <br>Who knows... <br> <br>The only solid thing I myself would state is that there are three ranges: immersive reading (generally about 8 to 12, but usually more like 9 to 11), below it, and above it. Below immersion you're basically making reading as painless as possible, not expecting high reading speeds, instead making sure there are no ambiguities. Above immersion you're appealing to deliberative, conscious aesthetic observation. But this doesn't mean aesthetics are irrelevant during immersion - who knows what the subconscious likes? It's only sure that the subconscious is a lot less worried about liking things, and more worried about getting the job done. <br> <br>Here's a <i>really</i> rough graph I once did: <br><a href=\"http://www.themicrofoundry.com/other/optic_01.gif\" target=\"_blank\">http://www.themicrofoundry.com/other/optic_01.gif</a> <br> <br>&gt; the only *solid* info we have to work <br>&gt; with at this point is theoretical <br> <br>Kinda. But the theory is derived in large part from empirical studies (from disparate fields). So you could say it's quasi-empirical. But where any empirical data at all is almost totally lacking is in fact in the <i>numbers</i>. <br> <br>hhp <br></p>"
