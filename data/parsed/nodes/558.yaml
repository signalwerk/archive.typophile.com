    html: <p>I was with John, when Lege gived the custom Palatino, and I'm still septical. <br> <br>Its somewhat a bit better than the actual Palatino, but when you know the ITC Bodoni story, the Palatino story is rather minor and quite similar than the non existant Minion MM who sound a first optical attempt by Adobe? <br> <br>To what Sumner tell it to me, circa 1995, the 12pt was fisrt done from original Bodoni, then they done an interpolation between the 6 and 72, who have show very good result, very close to what Bodoni have done with its 12pt cut. <br>So they kept the interpolation. In ITC Bodoni, what is fabulous, is the incredible difference between the narrow delicate 72, and the 6 large "Clarendon style effect" Bodoni 6. <br> <br>Interpolation is good for such task, but only if the two masters are really good in term of design. FB fonts generally propose good variations in this area, despite you can't completely agree with the style of the typefaces to which they applied the Optical scaling. <br></p>
