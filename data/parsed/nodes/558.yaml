    html: "<p>&gt; the \"g\" varies differently than the a! <br> <br>Well, I didn't actually mean to imply that. My guess is that the whole falls into some logical method (even though the eye is indeed the gauge). <br> <br>The dimension in the \"g\" missing from the \"a\" is the descender. Some of the most interesting things in optical scaling happen in the vertical proportions, and as you can see even the \"a\" falls into that. And the thing with compensations of proportion is that you can't fake it in the software... <br> <br>&gt; the aperture becomes relatively closed at the small end of the scale. I wouldn't think this would be helpful at such sizes. <br> <br>I was wondering about that too, but then I realize that aperture is only one of the factors that has to be considered. Some others are: maintaining the character of the design at small sizes; increasing the weight; limiting the increase in x-height. If you look at the 6 point \"a\" again and try to picture just those four factors pushing against each other, you might agree that they did it pretty well. <br> <br>BTW, thanks for that FyrisFonts link! I'd never even heard of them before - looks very interesting. <br> <br>-- <br> <br>William, that's a great article. Note also that APHA's most recent issue is entirely devoted to ATF. I have a copy, but I'm almost too giddy to actually read it! <br> <br>hhp <br></p>"
    html_clean: "<p>&gt; the \"g\" varies differently than the a! <br> <br>Well, I didn't actually mean to imply that. My guess is that the whole falls into some logical method (even though the eye is indeed the gauge). <br> <br>The dimension in the \"g\" missing from the \"a\" is the descender. Some of the most interesting things in optical scaling happen in the vertical proportions, and as you can see even the \"a\" falls into that. And the thing with compensations of proportion is that you can't fake it in the software... <br> <br>&gt; the aperture becomes relatively closed at the small end of the scale. I wouldn't think this would be helpful at such sizes. <br> <br>I was wondering about that too, but then I realize that aperture is only one of the factors that has to be considered. Some others are: maintaining the character of the design at small sizes; increasing the weight; limiting the increase in x-height. If you look at the 6 point \"a\" again and try to picture just those four factors pushing against each other, you might agree that they did it pretty well. <br> <br>BTW, thanks for that FyrisFonts link! I'd never even heard of them before - looks very interesting. <br> <br>-- <br> <br>William, that's a great article. Note also that APHA's most recent issue is entirely devoted to ATF. I have a copy, but I'm almost too giddy to actually read it! <br> <br>hhp <br></p>"
