    html: <p>"The most useful thing about studying "history" is to learn form the mistakes. Otherwise it's just cloying nostalgia." <br> <br>Might be the wrong path. I'd be looking at the techniques for the why, and how they contributed to later technologies. <br> <br>I took a workshop in cave painting once a while back. Spit painting. Where you expell the colored "inks" from your mouth and guide and manipulate the airborne particles with your hands. Kind of like crude ink jet. But a bit more intuitive. Our inks were all organic and politically correct but some of the authentic inks used by the cave painters (at least the spit painters) were apparently quite dangerous. <br> <br>Gerald <br></p>
