    html: "<p>OK, here goes; translations of the selected pieces from the articles in question by Stefan Lundhem/Fyrisfonts. <br> <br>I apologize, most of all to Stefan, for any misinterpretations.  <br> <br> <br>--------------------------------------------------------------------------- <br> <br>The Jenson article: <br> <br>Important optical crossing point <br> <br>The optical axis gives an even shape adjustment between 12 and 72 points,but from 12 down to  6 points there's a dramatic change. Here the typeface has a crossing point, which makes text in small point sizes really work text-wise. <br>This is excellent and a step forward compared to the cautious optical adjustment in Minion MM. <br> <br> <br>The Minion article: <br> <br>Minions optical \"masters\" <br> <br>Minion MM:s optical masters for 6 pt and 72 pt generates point size adjusted fonts when you choose a digit from the optical axis. <br>This choice won't happen automatically when you choose size, instead a certain category must be created in ATM or a program that handles MultipleMaster-typefaces, like Illustrator. <br>The crossing point for interpolation is 11 pt. Here Minion MM is identical with old Minion. From 11 to 6 pt the letters get gradually wider and sturdier, from 11 points to 72 pt they get gradually thinner and more narrow. <br>This interpolation isn't made linear. The smaller point sizes are in a larger proportion based on the 6 point master than they should've been, had it been linearly interpolated. <br>The optical adjustment works in captions, but be careful in the smaller point sizes. <br> <br>--------------------------------------------------------------------------- <br> <br> <br> <br></p>"
    html_clean: "<p>OK, here goes; translations of the selected pieces from the articles in question by Stefan Lundhem/Fyrisfonts. <br> <br>I apologize, most of all to Stefan, for any misinterpretations.  <br> <br> <br>--------------------------------------------------------------------------- <br> <br>The Jenson article: <br> <br>Important optical crossing point <br> <br>The optical axis gives an even shape adjustment between 12 and 72 points,but from 12 down to  6 points there's a dramatic change. Here the typeface has a crossing point, which makes text in small point sizes really work text-wise. <br>This is excellent and a step forward compared to the cautious optical adjustment in Minion MM. <br> <br> <br>The Minion article: <br> <br>Minions optical \"masters\" <br> <br>Minion MM:s optical masters for 6 pt and 72 pt generates point size adjusted fonts when you choose a digit from the optical axis. <br>This choice won't happen automatically when you choose size, instead a certain category must be created in ATM or a program that handles MultipleMaster-typefaces, like Illustrator. <br>The crossing point for interpolation is 11 pt. Here Minion MM is identical with old Minion. From 11 to 6 pt the letters get gradually wider and sturdier, from 11 points to 72 pt they get gradually thinner and more narrow. <br>This interpolation isn't made linear. The smaller point sizes are in a larger proportion based on the 6 point master than they should've been, had it been linearly interpolated. <br>The optical adjustment works in captions, but be careful in the smaller point sizes. <br> <br>--------------------------------------------------------------------------- <br> <br> <br> <br></p>"
