    html: "<p>Hrant said... <br> <br>\"the x-height has to start getting \"obese\" at about 8  <br>point. Look at the ATF Garamond stuff\" <br> <br>certainly there is a point (no pun intended) where the  <br>body needs more room to breath than in larger sizes.  <br>but how steep is the adjustment curve at the low end,  <br>and where does it begin to flatten out? uhhhh, yeah...  <br>I'm just not sure about that right now... (for all you  <br>Office Space fans). <br> <br>\"Your \"bias\" there is probably an issue of deliberation  <br>versus immersion: you can't judge the merits of a text  <br>face by reading it large. You can only really do it to the  <br>extent that you understand readability.\" <br> <br>absolutely. it's a sloppy science trying to judge a bunch  <br>of factors on a conscious level that are only fully  <br>understood (at this point in history) in the  <br>subconscious. reading studies provide guestimates, but  <br>the contributing factors are so multifarious as to largely  <br>discredit anything we can gather. <br> <br>so far, it appears that modern scales are developed  <br>from an automated system based on two subjective*  <br>axes. since the only *solid* info we have to work with  <br>at this point is theoretical, I'm not so much bothered by  <br>that road block. I do think we might need to consider  <br>added axes, however. <br> <br>*I realize that there are a lot of supposed facts behind  <br>these assumptions, but nothing is concrete yet. <br> <br>what axes are we ignoring that might lead us to more  <br>comprehensive scales? I imagine that the designers of  <br>the past had intuitive systems (and physical  <br>constraints) that lead to multi-faceted systems of  <br>alteration. I think Hrant's (and others') investigations  <br>into the construction of punches are the best way to  <br>reveal these characteristics -- now we just need to  <br>distill the info into usable guidelines. obviously, that's  <br>why we're all here.</p>"
