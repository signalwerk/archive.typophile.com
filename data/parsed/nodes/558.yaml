    html: <p>What I meant is that the empirical data points to the existence of three zones (or actually, two thresholds), but it doesn't say how steep the changes are on either side (with any usable accuracy). <br> <br>But even what we know now is very usable. For example, we could say that the bi-linear model (as shown on the FyrisFonts site concerning Adobe Jenson-MM scaling, and as used by InDesign for spacing) which has one threshold (at 12 point) isn't good enough. And a tri-linear model might be the ideal compromise at this time, since we know there are three segments, but we don't really know their precise shapes. <br> <br>-- <br> <br>BTW, could somebody please translate the "Viktig optisk brytpunkt" section on the Jenson-MM page, and the "Minons optiska 'masters'" section on the Minion-MM page**? That would be really great. <br> <br>* <a href="http://www.fyrisfonts.com/artiklar/jenson/default.asp" target="_blank">http://www.fyrisfonts.com/artiklar/jenson/default.asp</a> <br> <br>** <a href="http://www.fyrisfonts.com/artiklar/minion/default.asp" target="_blank">http://www.fyrisfonts.com/artiklar/minion/default.asp</a> <br> <br>hhp <br></p>
