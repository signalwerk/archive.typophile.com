rd as generic modifications of many typefaces, will always be sloppy approximations to the craft that individual type designers use to create remarkable, specific instances of a typeface. <br> <br>Used with discretion, automations are marvelous tools for the type designer creating special typeface families with a limited set or scale of optical sizes that relate to the typeface design (you can deduce that from Hrant's example, where apparently the \"g\" varies differently than the a!), but beyond that they are nothing more than glorified versions of the faux-bold button.  <br> <br> <br> <br> <br> <br> <br> <br></p>"
