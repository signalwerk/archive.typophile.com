    html: "<p>A scale is not a spectrum. <br> <br>Interpolation creates any point on a spectrum (between big and small, thin and heavy, etc.) but a scale is a set of instances that work harmoniously - with each other, and also with other fonts, and also in relationship to layout proportions. Being non-scalar (incemental) for weight/condensing, Multiple Master typefaces lacked personality, a fault recognized by the addition, later in the game, of extra \"master instances\" between the ends of the spectrum. <br> <br>Printing used to be highly conventional (materials and layout), and much of the aesthetic effect of the page was taken care of \"in the font\". But the situation has long since   changed, there is no longer a dominant harmonic structure which type designs must conform to. <br> <br>(Ironically, the scale of sizes in WP apps has put the masses in better touch with the principle of a harmony of type sizes in a page layout, than the majority of professional graphic designers, who get to create their own \"atonal cacophony\" out of peculiar size choices.)   <br> <br>Now size-specific harmony, aesthetic perfection, if you will, is not crucial in the font, because there are hundreds to choose from, and all kinds of environments to use them in. And 8.75 pt, horizontal scaling of 95%, tracked to minus 3, works quite well for newspaper text. <br> <br>A number of foundries have realized that \"size-specific\" or \"optical-size\" is a rather one-dimensional term. For instance, HTF (and myself) have used the term \"Fine\" for what is ostensibly a large-size display font. Such would be suitable for newsprint headlines, but typographers can, and do, use these fonts for text work, when they have #1 coated stock. <br> <br>Poynter Oldstyle is available in different \"grades\" or \"tunings\" for different amounts of press gain. <br> <br>So I'm with Hrant, \"human vision, not geometry\". Automations like MM, optical scaling, and optical kerning, when used across the board as generic modifications of many typefaces, will always be sloppy approximations to the craft that individual type designers use to create remarkable, specific instances of a typeface. <br> <br>Used with discretion, automations are marvelous tools for the type designer creating special typeface families with a limited set or scale of optical sizes that relate to the typeface design (you can deduce that from Hrant's example, where apparently the \"g\" varies differently than the a!), but beyond that they are nothing more than glorified versions of the faux-bold button.  <br> <br> <br> <br> <br> <br> <br> <br></p>"
