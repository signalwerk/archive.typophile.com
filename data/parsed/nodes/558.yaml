    html: <p>Hrant said... <br> <br>"if in fact he's made a linear interpolation between the  <br>8 and 48 point, that's not optimal - although the effort  <br>itself is highly commendable." <br> <br>unless I'm not understanding you, it sounds like you're  <br>dodging the issue here. is the outcome a good scale or  <br>not? no matter what their process was, it's the final  <br>letterforms that matter. <br> <br>unfortunately (for me), my insufficient knowledge  <br>disallows me from judging the designs; but, the  <br>differences throughout the scale seem to address  <br>important issues. I really don't know what *optimal*  <br>means here... but I'd like to. <br> <br>since you've been browsing the site, you may have  <br>already seen this, but the variations of their <a href="http://www.fyrisfonts.com/typsnitt/spartacus/mm.asp" target="_blank">Spartacus</a>  <br>are quite interesting as well. I'm especially interested in  <br>the possibility of using the display design (far left on  <br>the graph, sharp endings) in concert with the normal  <br>(far right on the graph, softened endings) for text. <br> <br>I think that the bottom end of the Spartacus scale  <br>might be a bit malformed in that the x-height seems  <br>somewhat obese, in the spirit of ITC circa 1970  <br>perhaps. since these sizes would be used for extended  <br>text, I would like to see more adventurous extenders.  <br>there seem to be other proportional issues with these  <br>sizes as well, but I'm at a loss to define them. is this  <br>some bias of mine from looking at typefaces too large  <br>for too long, or am I on the right track? I certainly don't  <br>know. <br></p>
