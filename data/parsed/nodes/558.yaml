s Imprimerie Nationale Garamont. My guess is they became experts motivated by their engineering background, but always using human vision (not geometry) as the guide. <br> <br>To this effect, I'm working on printing a waterfall of 10 sizes of ATF Garamond, and will be doing some numerical analysis on the results. <br> <br>hhp <br></p>"
