    html: <p>Hrant, <br> <br>I am sure there will be lots of opinions as to what should be done in the way of optical scaling. I suspect each designer would like to have some control over his or her font product!  <br> <br>Do you have any ideas as to how the software should handle it? OpenType, page layout, font development software? <br> <br>Point sizes for each font? That sort of opens up many complaints. I found one with Fletcher Challenge project. Tiffany had objections of her own. <br> <br>Easily, I would think, there is something more elegant. Are you aware of what is, or is not going on in this area in the OpenType forum? I was led to believe there were objections to including optical scaling solutions other than "the awkward". <br> <br>Frankly I think it should be somewhat like the kerning function. Either turn it on or turn it off in the page layout software. Changing fonts, I don't like that idea. <br> <br>Do you think we should ask John Hudson? <br> <br> <br> <br>Gerald Giampa</p>
