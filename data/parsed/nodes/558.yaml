    html: "<p>For a term, I think \"optical size compensation\" is good, but it's too cumbersome, and \"optical scaling\" seems to strike a nice compromise. <br> <br>&gt; optical scaling means different fonts <br> <br>Not necessarily. One could indeed argue that <i>some</i> features in <i>some</i> fonts cannot be adequately interpolated merely through Cartesian transformation*, but that's about it. When you consider the elements needed to deviate the smaller sizes from the \"deliberative ideal\", you realize that they can be interpolated just fine (although certainly not linearly wrt point size). Furthermore, it's a matter of quality, not absolutes. For example, you could say that the optical scaling in the Adobe fonts is weak, but it's still there. <br> <br>* See my Founders Caslon elaboration (June 20) here: <br><a href=\"http://www.typophile.com/forums/messages/30/12111.html\" target=\"_blank\">http://www.typophile.com/forums/messages/30/12111.html</a> <br> <br>The Lege project seems interesting. However, interpolating [linearly] between 6 and 9 will not work very well, because 6 is below the immersive reading threshold and 9 is above. If you look at the 6 versus 8 versus 10 point of ATF Garamond for example, you'll see that in the 6 the descenders get abruptly much shorter. My theory is that they wanted to give more room to the caps, since the very small sizes are more often used for all-caps. <br> <br>-- <br> <br>In my case, I'd love to formulate my own rules from scratch as to what needs to happen when sizes get small, but of course one can save a lot of effort by looking at existing/past practice. The ITC Bodoni stuff is nice, but in looking carefully at what different font houses have done from the very beginning, ATF stands out. There are many clues to this (such as their determination that 40 point -an odd size- is the upper limit for compensation), but their mastery is most obvious in ATF Garamond, as compared even to the glorious Imprimerie Nationale Garamont. My guess is they became experts motivated by their engineering background, but always using human vision (not geometry) as the guide. <br> <br>To this effect, I'm working on printing a waterfall of 10 sizes of ATF Garamond, and will be doing some numerical analysis on the results. <br> <br>hhp <br></p>"
