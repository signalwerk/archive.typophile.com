    <p>Hi all!</p>
    <p>This might sound like a trend or something, but I'm also heading out West and yes the city in mind is of course San Francisco. It has been on the agenda for quite some time and now the timing is perfect. It won't be forever, but 6 month will give me (and my family) the opportunity to experience daily life in this fantastic city. And since SF also is a good community regarding type design and graphic design, this will probably lead to new connections one way or the other. Already having some close friends there, I would still like to point out to all you other locals here on typophile, that I look forward to meet some new faces during my stay.</p>
    <p>Cheers &amp; long live San Francisco!</p>
