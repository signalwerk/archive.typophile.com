      <p>Well yes, to be precise it is the set of nothing. And since linguistics is founded partly on set theory, the linguistic zero usually means the same thing. So if you have a set of morphemes {<em>-p</em>, <em>-t</em>, <em>-k</em>, and <em>-q</em>} that occur in a paradigm, you can also analyze the set as including an empty set. That’s because by definition the empty set exists in any set, including the empty set itself. This empty set can then considered to be an empty morpheme, <em>-∅</em>. Or you may instead want to define the empty morpheme as an element distinct from the empty set, depending on your theory of morphology. In that case the other morphemes are made of elements taken from the set of all possible sounds in the language, and the null morpheme is the empty set that is included in that set of all sounds. That leaves a distinction between a zero morpheme and a lack of a morpheme, which is important in some morphological theories.</p>
      <p>So linguistic nulls are the nothings of a category, just like mathematical nulls; indeed, they are mathematical nulls because linguistic analysis is just another application of mathematics. But all of this is pedantic from a typographic and character set standpoint. The basic issue for typographers is that they’re represented by the same character, though not necessarily with the same presentation form (font variant, etc.).</p>
