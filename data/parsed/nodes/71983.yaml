      <p><cite>One thing that I like about the SIL fonts (Charis SIL &amp; Doulos SIL) and Gentium that I haven’t seen much support for elsewhere are the slightly larger and heavier variants of the apostrophic modifier letters, U+02BB – U+02BD and U+02EE. Most fonts simply duplicate the shapes of the quotation marks, but the modifier letters are properly alphabetic letters rather than punctuation.</cite></p>
      <p>Best I can remember, these are raised and turned commas. In a number of fonts today, the apostrophe is smaller than a comma; in these cases anyway, making them larger (as in a raised or turned comma) just makes sense.</p>
      <p>As a typesetter, one problem I always encounter is whether to use the proper Unicode characters, U+02BB &amp; U+02BD, or U+2018 &amp; U+2019 (single open &amp; close quotes). The reason is ebooks are getting to where they are almost always made with university press books, and the spacing modifiers are absent in most fonts. iPAD &amp; Kindle won't display them; and in spite of the EPUB3 specification, Apple's big concern seems to destroying flash. No worry about small things like having the right characters, or allowing embedding fonts. </p>
      <p>The other reason is interior designers never check to see if proper characters are in the fonts they choose, so if the EULA forbids it, you can't even make up the correct character for the print edition. Or you take it from another font, which takes time, money, and hand-fitting every occurrence. Not likely.</p>
      <p>These gripes are pedestrian compared to what is being discussed, but it is an issue once you get beyond the manuscript.</p>
