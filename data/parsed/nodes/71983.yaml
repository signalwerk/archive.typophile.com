      <p>Regarding a point raised earlier in the thread, I discovered a while ago that there are situations where the bars of the phonetic symbol ɪ are indispensable even in a sans design.</p>
      <p>Phoneticians don't always use unmodified phonetic symbols, but sometimes combine them with diacritics that are also part of the IPA. This is especially important for narrow transcriptions.</p>
      <p>I was exploring ways to express sound variations in different accents of English with shorthand symbols in a way consistent with IPA, and one of the best ways I could come up with for one instance was to use the IPA centralization diacritic, the diaeresis, with the phonetic symbols /i/ and /ɪ/, to produce /ï/ and /ɪ̈/ respectively (doesn't seem to display properly, but image below). However, this pair would not be distinguishable if ɪ lacked the bars.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/i-vs-i_6631.png"></div><p></p>
      <p>You can also see that <a class="freelinking external" href="http://en.wikipedia.org/wiki/Vowel" rel="nofollow">Wikipedia</a> uses ɪ with a diaeresis on its vowel chart, because there is no dedicated unmodified phonetic symbol for that particular vowel. So this sort of combination with diacritics isn't entirely rare.</p>
