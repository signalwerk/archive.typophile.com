      <p>The empty set is a subset of {-p, -t, -k,  -q}, it is not an element of that set. The empty set ∅ contains no element. The set {∅} contains one element and in the Von Neumann notation for integers, it represents the integer 1. Similarly, the set {∅, {∅}} represents 2 etc. With the word "contains" you keep a dangerous ambiguity: is it an element? is it a subset? You cannot add the empty set to a set without changing it unless it already contains the empty set as an element; ∅ is not an element of ∅, and it is not an element of  {-p, -t, -k,  -q} either.</p>
      <p>What I know of linguistics (way before Government and binding) uses rewrite systems (still in use in computer science). In such systems, a variable may be rewritten as a sequence of variables and letters in some alphabet. When the right-hand side contains nothing, we use the empty string, denoted ε or λ or Λ but never ∅, even if the right-hand side looks like "nothing". For instance the grammar X -&gt; ε, X -&gt;Xa  generates the set of strings {ε, a, aa, aaa, aaaa, ... }. Would you ever use ∅ for ε? If not, why is it more justified with morphemes?</p>
