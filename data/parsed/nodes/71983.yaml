      <p><em>Actually, I lean more and more to the view that the I in sans serif fonts, especially screen fonts, should have bars top and bottom to aid legibility. These should not be thought of as serifs: the I with barred terminals is a well-attested, indeed common form in writing.</em></p>
      <p>You'd get quite a bit of resistance to that, John, from users of sans serif typefaces, many of whom find the barred <strong>I</strong> quite ugly in an otherwise simple-looking design. I think it depends on which is more important in a particular context: character distinction or smooth flow. Within familiar words, the bar-less <strong>I</strong> is often a much more pleasing form (depending, always, on the typeface's overall design), but where letters and numbers and perhaps symbols will be mixed together (as in UK and Canadian postal codes, or in serial numbers and similar codes), then the need to be absolutely sure whether that's an <strong>I</strong>, an <strong>l</strong>, or a <strong>1</strong> trumps beauty.</p>
      <p>I think that if you include both forms in a font, the barred <strong>I</strong> will usually need to sit in a wider space than the bar-less <strong>I</strong>. Otherwise, one of them will look wrong.</p>
      <p>John</p>
