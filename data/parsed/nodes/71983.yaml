      <p>Concerning the slashed zero shape for the empty set, here is what the <a href="http://www.unicode.org/reports/index.html#reports" rel="nofollow">Unicode Technical Report</a> #25, Unicode Support for Mathematics (<a href="http://www.unicode.org/reports/tr25/tr25-12.docx" rel="nofollow">docx, 328K</a>) says about it:</p>
      <blockquote><p>
      A widespread alternate symbol for the empty set is a slashed digit zero. This can be encoded as U+0030 DIGIT ZERO followed by U+0338 COMBINING LONG SOLIDUS OVERLAY.
      </p></blockquote>
      <p>Michel</p>
