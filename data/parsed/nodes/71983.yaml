      <p>I second the request for the undertie symbol. 2040: CHARACTER TIE would also be welcome (it's the same shape, only flipped and higher up). When I'm working on Google Docs or posting comments online and want to use the undertie symbol, I'm forced to use the underscore as a hack because of the lack of font support.</p>
      <p>I use the undertie primarily for pronunciation transcriptions of English (for optional compression of syllables, just like the Longman Pronunciation Dictionary) and French (for liaison).</p>
      <p>If the tie symbols do end up being added to Calibri and Cambria, I hope they are not designed too wide. In most fonts that do have the tie symbols, they are excessively wide, perhaps because out of ignorance of what the tie symbols are used for, designers have simply used the shape for the ligature ties (which need to be wide because they go over two letters) without modification.</p>
      <p>It won't do to have an undertie taking up the space of two letters. It would draw way too much attention to itself. The undertie needs to be comparable in width with a single space or a period. To illustrate how narrow the undertie should be, here is a screen grab from the CD-ROM version of the Longman Pronunciation Dictionary:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Cambriaundertie_3436.png"></div><p></p>
