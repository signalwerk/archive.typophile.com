      <p>One other annoying thing in phonetics is the esh symbol ʃ. This is a particular pain for good overtie and undertie implementations, since the most pedantic representation in IPA of the initial sound in ‘church’ is t͡ʃ or t͜ʃ.</p>
      <p>I also somewhat dislike the ʃ design in most fonts that have it, including Cambria which is otherwise my primary face in my documents. The ʃ is always treated as though it’s a cousin to the integral sign ∫, so that it has either a perfectly upright stem or a slightly forward-tilted stem. This is wrong, however. Instead the esh ʃ is more of a cousin to s and S. The versions in fonts designed for linguists, like Gentium and Doulos SIL, have a slight backward tilt to the stem with a bit more compensatory curl in the top and bottom arms. This enhances the S similarity and also makes it less troublesome for kerning and getting the advance width right. The associated symbols like ʄ, ʆ, ʅ, ᶋ, ᶘ, and ᶴ all benefit from the same design considerations. The esh ʃ also has some problems with superscript-level spacing modifiers like ʼ (U+02BC), so that the symbol for the ejective postalveolar affricate tʃʼ (or t͜ʃʼ or t͡ʃʼ if you’re especially picky) ends up having ʼ collide with the upper arm of ʃ in most faces I’ve seen.</p>
      <p>In context the difference between dotless ı and small-cap ɪ is not terribly important because the two are basically mutually exclusive. A lot of linguists don’t really know or care that there is a difference. Diacritics can cause problems because the dotless ı is then the same as regular i since the tittle is normally deleted in phonetics use.</p>
      <p>Cambria really does a great job on a lot of Latin diacritics, which is why it’s my main font. I particularly like that ḵ and x̱ have the same consistent height for U+0331, for example. Also Cambria’s Greek blends well with the Latin, which is essential for replicating old transcriptions like dùhίdιnάx̣ and xʼύxʼu-ɢa. But for phonetics I use Charis SIL as a companion font, it has about the same weight and when set off in brackets or slashes it doesn’t look out of place in a sea of Cambria.</p>
      <p>I’ve never used Calibri extensively simply because it gets the position of U+0331 wrong in comparison with the precomposed forms, so that the macron below is higher beneath ḵ than it is beneath x̱. That makes the Tlingit word tuḵx̱ʼé ‘anus’ look crappy.</p>
