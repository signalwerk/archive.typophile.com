      <p>James,</p>
      <p>Consider that it isn't the EULA, but the permission to modify that is the issue. For example, Adobe gives the end user permission to modify fonts for one's own use. It is in Adobe's FAQ. It counts as one of the permissible copies. But the Adobe EULA at least use to forbid modifications. It would seem the specifics of the FAQ override a portion of the EULA, as would written permission from the font publisher.</p>
      <p>My belief is the EULA is/was an attempt to stop piracy, and modification for one's own use is only occasionally seen as an extra revenue stream. Anyway, if you ask for and receive permission, modification is allowable. The large font publishers have, for a while now, refused to give permission. Back in the mid-1900s, they sometimes did. Well, that's two or more owners ago for Linotype, and at least a couple of owners ago for Monotype. FontFont use to occasionally grant permission when they first moved into the States. But forget them as of 2012.</p>
      <p>Adobe's policy solves the print problem, and probably the PDF problem, but not the ebook problem, until font embedding (EPUB3) is implemented by Apple and Amazon. Fat chance, today. And the font publishers may want to rule separately on web fonts. At this point, who can say? But some won't and that's all it takes.</p>
      <p>BTW, there are other small foundries/font publishers who will give permission.</p>
