      <p><cite>The difference between the modifier letters (U+02BB – U+02BD and U+02EE) versus the open and close quotes (U+2018 &amp; U+2019) is not really in their appearance. Instead, the modifier letters in Unicode belong to the Lm (Modifier_Letter) category and hence they are meant to be processed like alphabetic characters (A–Z, etc.). That means that they are part of the language’s alphabet rather than being accessory symbols like punctuation. In contrast, U+2018 and U+2019 are in the Pi and Pf categories respectively (Initial_Punctuation and Final_Punctuation). They are punctuation characters just like the ampersand, hyphen, question mark, octothorpe, and so forth.</cite></p>
      <p>You miss my point. As long as the task is limited to getting ink on paper, there is not much of a problem -- ink does not preserve character encodings. Or, if your purpose is limited to academics circulating texts privately, the problems are manageable. </p>
      <p>When you move to publishing material, the problems are rather larger, and decisions more complicated. Now the correct Unicode encoding is important. Here are the problems: (1) Few type designers are willing to include character sets with limited use. (2) Few font publishers are willing to allow their fonts to be modified to make up the needed characters. (3) Few people who select typefaces for published material are willing to use fonts that do include the proper Unicode character. (3) has two forks: (a) the designers who select fonts for ink on paper (rather less of a problem), and  (b) the ebook reader device manufacturers, who limit the typefaces their devices will display.</p>
      <p>So, someone preparing these files -- the typesetter -- is faced with the decision about which character to use. Skipping the problems ink on paper, every book I've worked on in the past two years has required an eventual ebook. The choice one faces is to use punctuation characters, which are wrong and limit searching a file, or using the correct character, which will be searchable, but will not display.</p>
