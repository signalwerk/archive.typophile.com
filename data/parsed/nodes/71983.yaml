      <blockquote><p>[charles_e:] The choice one faces is to use punctuation characters, which are wrong and limit searching a file, or using the correct character, which will be searchable, but will not display.</p></blockquote>
      <p>Yes, this is the exact problem that I have faced, and which I have kludged around with by having TeX display one character but embed a different one in the text stream of a PDF. The <code>hyperref</code> package includes a command <code>\texorpdfstring</code> to do this. It’s a nasty kludge though, and it’d be better if fonts included characters with appropriate variant forms. I’m not a font designer and not willing to abuse EULAs on existing fonts, so I haven’t fixed this problem for myself. It’d be nice if either EULAs were a bit more flexible for these not-entirely-unusual circumstances, and/or if font designers could ask around a bit more about potential uses of their works. It’s not possible to please everybody, but it <em>is</em> possible to try.</p>
