      <p>Two things on my wish list for phonetics fonts are slashed zero instead of a slashed circle for ∅ U+2205 ‘Empty Set’ and a gelded question mark alternate for ʔ U+0294 ‘Latin Letter Glottal Stop’.</p>
      <p>The first wish is because slashed zero is a far more common null symbol in linguistics than the mathematical practice of a slashed circle (which comes from <a href="http://en.wikipedia.org/wiki/Nicolas_Bourbaki" rel="nofollow">Nicholas Bourbaki</a> as I recall). It’s available as an alternate for U+0030 ‘Digit Zero’ in many fonts (the OpenType zero option), but as far as I know it’s never been implemented in any font as an alternate for ∅ U+2205 ‘Empty Set’. Currently I use some TeX shenanigans to get the displayed form as 0 in PDF, but the plain text version in the PDF as ∅ so that it’s semantically correct for text processing. That’s an ugly kludge. Many (most?) linguists are less typographically and technically inclined than I am and hence they abuse Ø or ø because these look somewhat better in text than the slashed circle of ∅ found in most typefaces nowadays. Cambria tried hard to get away from the geometric circle with its ‘slashed ovoid’, but I think in the end it has pleased nobody. (I like it, but I still prefer the slashed zero more. A few mathematicians I’ve talked to still prefer the circle more.)</p>
      <p>The gelded question mark hearkens back to the original development of the glottal stop symbol. I don’t know who first invented it, but after ʼ was used for a while someone wanted a more visually obvious symbol so they started using a question mark without the ball (hence ‘gelded’). The IPA community invented the form with a stem extending to the baseline and a serifed base, but the gelded form is still in use, though mostly only in handwriting nowadays. To properly replicate forms from older documents a gelded alternate for ʔ U+0294 ‘Latin Letter Glottal Stop’ is really appropriate, but so far I know of no fonts that have implemented it. I supposed that variants of ʕ, ʖ, ʡ, and ʢ might be desirable too, but I think just offering the alternate for ʔ would be a good enough gesture. Anyone implementing a modern face like the Scotch Modern used by the US Government Printing Office would be obliged to make the default glottal stop a gelded question mark for historical veracity.</p>
      <p>One thing that I like about the SIL fonts (Charis SIL &amp; Doulos SIL) and Gentium that I haven’t seen much support for elsewhere are the slightly larger and heavier variants of the apostrophic modifier letters, U+02BB – U+02BD and U+02EE. Most fonts simply duplicate the shapes of the quotation marks, but the modifier letters are properly alphabetic letters rather than punctuation. If they are ever so slightly distinct then they are more easily differentiated at the end of quotations, e.g. ‘xʼúxʼ’ or “xʼúxʼ”. One solution, used by Gentium, is to shift the vertical position and change the overall size of the modifier letters a slight bit. The SIL fonts instead change the weight and length of the modifier letters so that they fill the surrounding space a bit more and thus fit better into the word shape (bouma). On this forum the differentiation seems to be an accident since Georgia doesn’t include the spacing modifier letters, so that they are pulled from some other font by browser and layout engine magic.</p>
