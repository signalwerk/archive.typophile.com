  - id: 223447
    user: 1043
    date: 2007-08-30T07:21:00
    date_raw: 30 Aug 2007 — 7:21am
    votes: null
    html: "<p>It's a very rarely used face (at least I've rarely seen it) from the Seventies called Embrionic. As far as I know, there were only two weights--this one (Embrionic 55) and an extra bold weight (Embrionic 85). I've only ever seen a complete showing of the bolder weight. According to an old Zipatone rub-down lettering catalog, it was designed by Graphic Systems. Minor detail: The lowercase \"c\" has been opened up. In the stock version, the opening is about as wide as the one in the \"e\". Finally, as strange as it may seem, this face had a complete set of swash caps.</p>"
    html_clean: "<p>It's a very rarely used face (at least I've rarely seen it) from the Seventies called Embrionic. As far as I know, there were only two weights--this one (Embrionic 55) and an extra bold weight (Embrionic 85). I've only ever seen a complete showing of the bolder weight. According to an old Zipatone rub-down lettering catalog, it was designed by Graphic Systems. Minor detail: The lowercase \"c\" has been opened up. In the stock version, the opening is about as wide as the one in the \"e\". Finally, as strange as it may seem, this face had a complete set of swash caps.</p>"
