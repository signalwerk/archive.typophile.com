    date_raw: 30 Aug 2007 — 9:06am
    votes: null
    html: |-
      <p>Like I said, it's a rare one. I have only seen it in two places: The Zipatone catalog from the late Seventies (sample shown above) and a one-line listing of both fonts in the Solotype Catalog, showing only the names in their respective fonts. I'm sure there exist film font catalogs which include full samples, but none in my collection.</p>
      <p>I would be very surprised if either font has been digitized. There were a ton of typefaces (especially film fonts and rub-down alphabets) made in the Seventies that never became popular and faded into obscurity.</p>
