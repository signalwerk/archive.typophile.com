    <p>Doing a business card for a winery. Problem is, no one knows what the font for the label is, and I'm having a really hard time figuring it out. They thought it was Garamond, but it clearly isn't (as far as I know). </p>
    <p>They gave me the print file, but all the text was outlined, and it didn't have any font references anywhere.</p>
    <p>The "U" is really throwing me off. </p>
    <p>Any leads?</p>
    <p>Thanks in advance!</p>
