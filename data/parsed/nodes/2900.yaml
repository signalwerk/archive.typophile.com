  html: <p>okay, so i broke down (in a moment of weakness) and bought the full version of font lab the other day. i've been having fun playing with it, but i came across a couple things that kinda bother me. maybe someone out there can help me with a couple questions. <br>first - and most annoyingly, i had been using the demo version 4.5 and importing eps files that i had made with adobe streamline, but it seems that 4.6 doesn't support the streamline files. i keep getting an error message about the eps file when i try to import it. works fine in the 4.5 demo, but won't work in 4.6 - wassup with that? <br>second - <br>i've been fooling around with the opentype features and tried to fix it so that when one types 1/4  (one slash four) you get the apropriate fraction substitution. however in previewing this feature in fontlab, the first slash doesn't show up when i type it (oh wait i think i just answered my own question) but lemme see if i'm right - okay fontlab uses slashes to separate glyphs when previewing, so i have to type 1//4 to get onefourth. is this just because the program thinks i'm going to enter something like 1/0145/4 where 0145= some character that isn't accessible by the regular keyboard? anyhow my main concern is will this be a problem when i export the font in otf format? will i still have to type 1//4 in other applications to get the fraction to work properly? <br>oh and one more thing - i've figgered out how to expoert postscript flavored otf fonts, but can't quite figger out how to export ttf flavored otf fonts. i mean i can't tell if my opentype insturictions are being exported when i generate the font in ttf format only because the files i generate aren't being marked with the opentype icon (like other fonts that i'm running in windows xp) so i'm slightly confused about that too. anyhow, any help would be appreciated. thnx for reading!</p>
  html_clean: <p>okay, so i broke down (in a moment of weakness) and bought the full version of font lab the other day. i've been having fun playing with it, but i came across a couple things that kinda bother me. maybe someone out there can help me with a couple questions. <br>first - and most annoyingly, i had been using the demo version 4.5 and importing eps files that i had made with adobe streamline, but it seems that 4.6 doesn't support the streamline files. i keep getting an error message about the eps file when i try to import it. works fine in the 4.5 demo, but won't work in 4.6 - wassup with that? <br>second - <br>i've been fooling around with the opentype features and tried to fix it so that when one types 1/4  (one slash four) you get the apropriate fraction substitution. however in previewing this feature in fontlab, the first slash doesn't show up when i type it (oh wait i think i just answered my own question) but lemme see if i'm right - okay fontlab uses slashes to separate glyphs when previewing, so i have to type 1//4 to get onefourth. is this just because the program thinks i'm going to enter something like 1/0145/4 where 0145= some character that isn't accessible by the regular keyboard? anyhow my main concern is will this be a problem when i export the font in otf format? will i still have to type 1//4 in other applications to get the fraction to work properly? <br>oh and one more thing - i've figgered out how to expoert postscript flavored otf fonts, but can't quite figger out how to export ttf flavored otf fonts. i mean i can't tell if my opentype insturictions are being exported when i generate the font in ttf format only because the files i generate aren't being marked with the opentype icon (like other fonts that i'm running in windows xp) so i'm slightly confused about that too. anyhow, any help would be appreciated. thnx for reading!</p>
