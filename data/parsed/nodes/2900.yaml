    html: "<p>Paul,  <br> <br>1. Setting everything up for digital font signing is tedious, I agree. But I am able to sign my fonts. I have provided some links about signing OpenType fonts at <a href=\"http://topica.com/lists/opentype/read/message.html?mid=1713339467\" target=\"_blank\">http://topica.com/lists/opentype/read/message.html?mid=1713339467</a>  <br> <br>Oh, I forgot. Rather than signing your fonts, you can also change the file extension from .ttf to .otf. In fact, \".otf\" can be used for both OpenType PS (CFF) and OpenType TT fonts, but is recognized only on Windows 2000/XP, while \".ttf\" can be used only for OpenType TT fonts.  <br> <br>2. I speak Polish (native) and Russian (but it's my fourth language, after German and English, so it's not really good). I learned how to read Latin letters at the age of 3, and started reading Russian at the age of 6, so I tell myself that I developed a certain feeling for the Cyrillic script. I'm by no means an expert and wouldn't dare design anything myself, but every time I see Cyrillic letters and have a feeling that there is something wrong with them, this feeling is confirmed by my fellow experts. But I'd suggest you talk to them rather than myself. There was an extensive discussion on Cyrillic design here at Typophile and I provided a set of basic literature: <a href=\"http://www.typophile.com/forums/messages/4100/12232.html\" target=\"_blank\">http://www.typophile.com/forums/messages/4100/12232.html</a>  <br> <br>Best,  <br>Adam</p>"
