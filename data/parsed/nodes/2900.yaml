    html: <p>adam yer a genius! have you actually gone through the process to be able to sign your own files digitaly? if so, what "certificate authority' did you go with and how do you find those services? <br>on a more personal note, i noticed that you've had some experience with cyrillic fonts... what's your conection there? do you speak any slavic languages (i'm guessing Polish at least) iv'e been messing around for a while extending character sets for fonts to include cyrillic characters, mostly display faces simply because i'm a slavophile myself (i almost majored in russian) and like to have cool fonts to correspond with my fellow russian speakers. are there any books readily available on cyrillic design standards? or is that going to be another big hunt for me? thnx for your help!</p>
