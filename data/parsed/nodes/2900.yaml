    html: <p>okay now this post doesn't refer to any quirks, but i thought i'd just tack this on to my current post. so here it goes... i am imensly interested in opentype and opentype capabilities and have have had some fun with some of the more basic stuff in FontLab (like simple ligature subtitution) but is there any text, manual, or other comprehensive set of instructions that breaks down how to program features into opentype? i've been going through the fontlab manual and maybe i'm just missing some things and need to go through it again... but i'm also interested in learning how i can input lookups that aren't supported by FontLab at this time (such as contextual and positioning lookups) is there any way to do this? better yet.. anyone know of a font designing tutorial for dummies? anyhow, thnx for reading.</p>
