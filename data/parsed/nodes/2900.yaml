    html: <p>1. Streamline EPS files. Have you considered contacting FontLab Support? There is a problem report form at <a href="http://www.fontlab.com/html/support.html" target="_blank">http://www.fontlab.com/html/support.html</a> that you could fill, attaching the EPS files that trouble you.  <br>2. No need to worry. The slash character works as an "escape character" only within FontLab. You can type /glyphname or \unicode -- these are useful ways of previewing glyph that normally aren't mapped to the keyboard, or even don't have Unicode indexes.  <br>3. Download and install <a href="http://www.microsoft.com/typography/TrueTypeProperty21.mspx" target="_blank">http://www.microsoft.com/typography/TrueTypeProperty21.mspx</a> -- it'll let you check what OpenType layout features are included in a fonts.  <br>In order to get an "O" icon instead of a "TT" icon in OpenType TT fonts, the fonts must be digitally signed. Read more at <a href="http://www.microsoft.com/typography/developers/dsig/" target="_blank">http://www.microsoft.com/typography/developers/dsig/</a>  <br> <br>Regards, <br>Adam Twardoch <br></p>
    html_clean: <p>1. Streamline EPS files. Have you considered contacting FontLab Support? There is a problem report form at <a href="http://www.fontlab.com/html/support.html" target="_blank" class="link-external">http://www.fontlab.com/html/support.html</a> that you could fill, attaching the EPS files that trouble you.  <br>2. No need to worry. The slash character works as an "escape character" only within FontLab. You can type /glyphname or \unicode -- these are useful ways of previewing glyph that normally aren't mapped to the keyboard, or even don't have Unicode indexes.  <br>3. Download and install <a href="http://www.microsoft.com/typography/TrueTypeProperty21.mspx" target="_blank" class="link-external">http://www.microsoft.com/typography/TrueTypeProperty21.mspx</a> -- it'll let you check what OpenType layout features are included in a fonts.  <br>In order to get an "O" icon instead of a "TT" icon in OpenType TT fonts, the fonts must be digitally signed. Read more at <a href="http://www.microsoft.com/typography/developers/dsig/" target="_blank" class="link-external">http://www.microsoft.com/typography/developers/dsig/</a>  <br> <br>Regards, <br>Adam Twardoch <br></p>
