    html: <p>While the era is Commonwealth, rather than Empire, I suspect that the British Monotype faces such as Imprint, Plantin, Perpetua, Times, and Gill would have been most prominent for text work in India at that time. And of course Baskerville—but you would want to use a digital version that gives a substantial impression. Plantin would be an interesting choice, it’s strong.</p>
