    html: |-
      <p>If the point is to make mothers more visible, then why "invisible"? </p>
      <p>None of the logo's is inspiring, actually they make me think of an ordinary movie or reality show.</p>
      <p>My suggestions: </p>
      <p>- Don't "stack" the words on two lines, with same width, that looks too rigid. Let the words follow each other;<br>
      - Stay away from predictable wishy-washy handwritten typefaces, unless it's masterfully well-done;<br>
      - Try a font like the Aubade logo <a class="freelinking external" href="http://www.aubade.com/" rel="nofollow">http://www.aubade.com/</a>. It has a sense of style, with a feminine twist.<br>
      - Maybe try to accentuate "invisible" (if the word makes sense to the brand) by leaving out certain elements of the word, a letter or the dots. Not sure this will work.<br>
      - Maybe accentuate the "o". Phonetically, it's the name's "centre of gravity". Due to the round shape it is a more "friendly" letter. Try creating something within the "o", initials or whatever. An element being contained in a circle could communicate "protection" or belonging".</p>
