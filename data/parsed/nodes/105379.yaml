    <p>I am creating a wordmark for a brand called "Invisible Mothers".</p>
    <p>I would like your opinions / critiques on which one you think works best, or if you have any suggestions on a font I should use.</p>
    <p>Background:<br>
    Invisible Mothers is a movement to help make mothers more visible in society. We often take Mothers for granted, so we will focus on the importance of mothers by launching a campaign to support these initiatives.</p>
    <p>Here are some samples I've created from different fonts:</p>
