    html: |-
      <p>On Windows fonts are differently displayed depending how well they are “prepared” for the screen (=hinting), on a Mac hinting does not make a difference. </p>
      <p>When printed the type of print technology defines how dark a typeface will look. Offset for example looks light.</p>
