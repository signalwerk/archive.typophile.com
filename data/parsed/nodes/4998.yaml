  - id: 36354
    user: 1262
    date: 2004-05-30T21:32:00
    date_raw: 30 May 2004 — 9:32pm
    votes: null
    html: <p>I generally prefer to hint from left to right, as this makes it easier to preserve good lettershape. If you hint from the outside in, you have limited options for controlling the width of internal counters, which might get squished or extended at some sizes. You end up having to helta hint the whole character width at certain sizes, whereas if you hint from one side to the other you can specify a CVT white space value to control the counter as if it were a stem.</p>
