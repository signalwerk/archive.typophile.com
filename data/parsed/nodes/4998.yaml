  html: <p>Using FontLab, would it be better to build horizontal instructions inward from the left and right sidebearings towards the middle of the glyph, or starting from the left sidebearing, build all the instructions from left ot right? Or would starting with a double link on the main stems without touching the sidebearing be preferred?</p>
