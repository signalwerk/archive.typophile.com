    html: <p>Depends somewhat on the usage of the font and what rasterizers you care about. But the big question is, do you need to preserve the spacing at low ppems, or are you willing to have the spacing get looser to maintain legibility? <br> <br>Most folks doing manual hinting are willing and able to distort the spacing at low ppems, which allows for the possibility of either using left-to-right hinting across the glyph, or using intermediate deltas that affect the right sidebearing to open up a glyph that is hinted outside-in. <br> <br>T</p>
