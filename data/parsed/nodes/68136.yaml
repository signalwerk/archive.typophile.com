      <p>I don't think the first concept works, at least not for me. I don't recognize the icon as a paragraph/text edit one. The second version doesn't help either. I think the idea might work but the text edit part needs to be much clearer if I'm gonna make that connection.</p>
      <p>I like the second work (Factinfo), looks very nice. Feels like the top bar of the 'F' could be shorter, this would probably mess up the angular triangle though. If you'd like the bluprint feeling to come across I think it needs to be thinner, maybe outline the symbol but you don't really need that it works as it is. Other then that, very pretty.</p>
