    <p>hey all,</p>
    <p>i'd appreciate your feedback on those two works.</p>
    <p>1) CMS called "EL" or "el"<br>
    Well, this one should connect the name with resemblance of editing content - you know, all the paragraph edit / text edit icons you can find in text editors nowadays.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/tipophileelcms_5997.png"></div><p></p>
    <p>2) community of young physicists, chemics and technicians called "FactInfo"<br>
    This one should look a bit like a blueprint or something and on the other hand, its simply F and I (as for FactInfo) put together.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/tipophilefactinfo_3855.png"></div><p></p>
    <p>So please, let me know what do you think of those.</p>
