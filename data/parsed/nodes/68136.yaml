    html: |-
      <p>Sorry for my previous terseness. The first logo, as noticed by kattttor, make difficult to recognise the E as paragraphs. Furthermore, it reads more as E/ than EL.<br>
      For the second one, in order to de-emphasise the upper stroke of the F, you could try to "raise" ever so slightly the i, making it a little bit longer and nearer to the F's upper stroke. I also would experiment further with the placement, size and typeface of the wordmark.</p>
