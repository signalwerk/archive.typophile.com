    <p>Greetings, all,</p>
    <p>I have a handful of fonts that I have created, and I want to file the copyright for the computer code with the U.S. Copyright Office.</p>
    <p>They ask for a certain number of pages of the "source code" from the beginning and the end of the "program" to accompany the application for the copyright.</p>
    <p>I have no idea how to get to the "source code" of a font in order to do this.</p>
    <p>Can anyone suggest a method for creating a listing of source, or anchor points and coordinate information, or something that I can submit?</p>
    <p>Any help will be greatly appreciated.</p>
    <p>Brian P. Lawler</p>
