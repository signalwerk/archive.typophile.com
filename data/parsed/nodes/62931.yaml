      <p>Hey Brian,</p>
      <p>Yeah, they didn't know about fonts when they wrote that.</p>
      <p>It depends on the format of the font. If it's OpenType CFF or TrueType, you could use TTX to dump the code in text form. If it's Type 1, I would use an unencrypted PFA file to treat as the text/code form of the font.</p>
      <p>Regards,</p>
      <p>T</p>
