    html: |-
      <p>Yup. Download the TTX tool, and use it to dump your fonts into XML source files (which can also be recompiled into fonts with TTX).</p>
      <p>TTX hasn't been fully maintained, so it doesn't deal with some new developments, like new formats of the OS/2 table, etc. But I don't think FontLab does any of that stuff yet, though Adobe's FDK can produce fonts TTX can't handle.</p>
      <p>Regards,</p>
      <p>T</p>
