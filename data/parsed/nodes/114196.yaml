    <p>hello,</p>
    <p>my magazine uses bembo for body copy, which i find a bit dated and better for book copy.</p>
    <p>can anyone please recommend a more modern serif that works for body copy? Perhaps a little cleaner than Bembo.</p>
    <p>I am considering paring it with Museo (headlines) throughout the magazine. </p>
    <p>The magazine has a dated look, so just looking for something more modern with a little more weight than Bembo, I find it light, wide and antiquated.</p>
    <p>If you know of anything great, don't be afraid to suggest what it might pair with for headlines etc...</p>
    <p>I really appreciate any suggestions. Looking forward to some feedback.</p>
