    <p>typedesign.eu<br>
    typedesign.info</p>
    <p>Domain Names For Sale</p>
    <p>If any fellow Typophile would be interested in the domain names 'typedesign.eu' and/or 'typedesign.info', please, let me know. (I currently dont have the time and the nerves to maintain those domains, and keep the directory beyond alive. Still I would be happy if I knew that some type and design related individual would be continuing to use the domain, no matter what for.)</p>
    <p>So, If anyone of you is interested in purchasing/owning these domains, please say so. :)</p>
    <p>Thank you,<br>
    Dav</p>
