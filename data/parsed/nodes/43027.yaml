    <p>Nikola Djurek's new Foundry Site is live. It is here:</p>
    <p><a href="http://www.typonine.com" title="http://www.typonine.com">http://www.typonine.com</a></p>
    <p>You may know Nikola from his font Amalia which I wrote up for last year's Best of on Typographica here:</p>
    <p><a href="http://typographica.org/001103.php#amalia-fonts" title="http://typographica.org/001103.php#amalia-fonts">http://typographica.org/001103.php#amalia-fonts</a></p>
    <p>His fonts include:</p>
    <p>OT Amalia<br>
    DTL Porta<br>
    Greta Display<br>
    Fedra Display<br>
    Tempera<br>
    Tempera Biblio<br>
    Typonine Stencil</p>
