    <p>Is there any font editor for iPad available in the market?<br>
    Also, is there any way to install any of the desktop softwares (OSX or Win) in an iPad?</p>
    <p>The only one I found is iFontMaker. I didn't try it, It seems nice, but I think will be great to have something more professional.</p>
