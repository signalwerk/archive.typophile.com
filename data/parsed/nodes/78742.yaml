      <p>There's <a href="http://itunes.apple.com/us/app/fontula/id391294314?mt=8" rel="nofollow">Fontula</a>, which is similar to FontShop's <a href="http://fontstruct.com/" rel="nofollow">Fontstruct</a> (which can't be used on the iPad because it requires Flash).</p>
      <p>There is no way to install desktop software on an iPad. It's based on OS X, but has a very different operating environment and application framework. The closest you could get would be to run something like <a href="http://www.iteleportmobile.com/home" rel="nofollow">iTeleport</a> which would allow you to control FontLab (or other font editor) running on a Mac or PC from your iPad. It's useful sometimes, but not as efficient as working on an actual Mac or PC.</p>
