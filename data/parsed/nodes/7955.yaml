  html: <p>I can't seem to find this one, but it has a simular feel to Doodlebug from Letraset shown here in <a href="http://bowfinprintworks.com/Script14Pg10.html" target="_blank">Part 14 of the Script Font ID Guide</a>. There are many other candidates here too, for 'dirty' fonts. <br> <br>Another, that may not be shown there is Linotype's <a href="http://www.myfonts.com/fonts/linotype/russisch-brot/?PREFS_SET%5BRenderSize%5D=60&amp;PREFS_SET%5BRenderString%5D=DIRTY" target="_blank">'Russisch Brot'</a>, which has increasing degrees of crumbiness. <br> <br>Of course, the big point to realize is that your sample has been styled to add colors and shadows. You'd have to play around with the effects to get the right look. Fonts don't come 'out of the box' like that.</p>
  html_clean: <p>I can't seem to find this one, but it has a simular feel to Doodlebug from Letraset shown here in <a href="http://bowfinprintworks.com/Script14Pg10.html" target="_blank" class="link-external">Part 14 of the Script Font ID Guide</a>. There are many other candidates here too, for 'dirty' fonts. <br> <br>Another, that may not be shown there is Linotype's <a href="http://www.myfonts.com/fonts/linotype/russisch-brot/?PREFS_SET%5BRenderSize%5D=60&amp;PREFS_SET%5BRenderString%5D=DIRTY" target="_blank" class="link-external">'Russisch Brot'</a>, which has increasing degrees of crumbiness. <br> <br>Of course, the big point to realize is that your sample has been styled to add colors and shadows. You'd have to play around with the effects to get the right look. Fonts don't come 'out of the box' like that.</p>
