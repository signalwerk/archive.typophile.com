    html: |-
      <p>An example of illogical truth: condensed and small size tend to not go together. Type usually get wider, x-height larger and ascender/descender shorter as they get smaller. I don't know of any condensed serifs for small size. Not sure what kind of a type budget you have, but Garamond Premier Pro "Caption" is a small size option that you may already have. Also free - but in beta so watch the kerning, SerifBeta6 from Betatype.com (I just used this to decent effect).</p>
      <p>Newspaper types may also suit your needs.</p>
      <p>Cross post edit: Minion Condensed Caption -- Ok, I now know of one. I wonder if this was an exercise in completeness for the minion family, or if it's useful. I'll have to take a look. Thanks Stephen.</p>
