      <p><cite> &gt; On that note, I’ve started a newspaper text list. I welcome additions.<cite></cite></cite></p>
      <p>Stephen, nice start. You could add Zócalo Text to the Modern Alternatives list. (Or did that not go out to Vendors yet?)</p>
      <p>Zócalo would probably not be suited to Kate's initial request -- too wide. But it seems that many of the newspaper text suggestions are veering away from the narrow criteria.</p>
      <p>I was working on something in that same classic Corona/Excelsior/Plantin vein, but actually on the narrower side and with a touch more Baroque flavor. But not really ready for primetime, unfortunately. </p>
      <p>What about Nikola Djurek's <a class="freelinking external" href="http://www.typonine.com/fonts/brioni/" rel="nofollow">Brioni</a>? -- on the narrower side and I bet it would handle nicely small. Come to think of it, his <a class="freelinking external" href="http://www.typonine.com/fonts/tempera-biblio/" rel="nofollow">Tempera Biblio</a> might also fit the bill.</p>
      <p>-- Kent.</p>
