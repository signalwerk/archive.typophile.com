  html: <p>I have to do a bookmark design with a hilariously large quantity of text. What's your favourite condensed serif that works in like 6.5 to 8-pt sizes? (All my fave small condensed fonts are sans, and all the good condensed serifs are better in 12-14-pt and up, usually...)</p>
