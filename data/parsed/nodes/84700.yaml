    html: |-
      <p>@William Berkson:<br>
      <cite>That's because of a strong tradition of everyone being trained in hand written brush work. I hope that doesn't disappear because of the computer!</cite>I'm afraid to agree with you because I feel that might be selfish of me.</p>
      <p>Never mind the computer; <em>script reform</em> should cause that to disappear.</p>
      <p>The reason it isn't impossible for the Chinese people to learn to read is because they really only need to memorize a few hundred basic components of characters, with meanings like "man" and "heart" and "speech".</p>
      <p>These are combined by meaning to produce a few hundred more characters, such as "bright", formed from "sun" and "moon".</p>
      <p>Once those characters are learned, to someone who knows how to <em>speak</em> Chinese, the rest of the 8,000 or so characters a person needs to know to be literate are now comprehensible; they're formed from a basic character component identifying the general category of the word's meaning, and another character with the same sound.</p>
      <p>This is a big oversimplification of the Chinese writing system, since (for example) it doesn't deal with the fact that most Chinese words aren't only one syllable long, even though Chinese texts written in Classical style abbreviated words by only representing their first syllable by a character.</p>
      <p>Anyways, though, this means that learning to read Chinese is not impossible, although more difficult than learning to read an alphabetic script: but since there are alternate possible ways to write most characters - the radical (meaning) is obvious, but the phonetic often could be several different characters, of which only one is "correct" - the Chinese writing system serves to make the less-educated easy to spot.</p>
      <p>Like English spelling, only much worse.</p>
      <p>Quaint traditions may be charming from a distance, but one has to spare a thought for the lives of those who actually have to live with them.</p>
