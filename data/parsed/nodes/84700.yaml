      <p>William, I’m not sure it’s as simple as the example you cite. Though it’s certainly a stunning transition, is it a good one or even a necessary one? Was the barber doing badly before the sign change? Is he doing better now? Have the clientele changed? Have prices gone up? Are previous customers excluded? Perhaps proto capitalism is better than advanced capitalism! </p>
      <p>I’m not sure it is a matter of just tidying the world up. Or is it? I just spent the day reading <em>Otl Aicher</em> by Markus Rathgeb… perhaps that is influencing my crisis. There was a line in it, which I can't find now, suggesting that good design inspires confidence in a business - the customer supposedly relates a neater sign to a better haircut - but when I see the first sign I see honesty, when I see the second, improved sign, I am perhaps a little skeptical - why does the barber need to promote haircuts with design? Do the haircuts not promote themselves? Any barber can hire a designer,* but not all barbers can cut hair! I am questioning the first principle of design, that it actually improves things, and not just superficially. Does a graphic treatment still inspire confidence in a business? Or is that concept only powerful at the onset of a graphic design cold war … as opposed to a world where almost all businesses have accumulated a “graphic arsenal”. There is something about the original that cuts through all of that. It is what it is … it’s humorous, natural, temporary, psychogeographical…</p>
      <p>Is typography important because we like it? To say all of the above is to play devil’s advocate, humour me.</p>
      <p>* In this scenario, it seems the designer traded his services for the haircut, which I admire, bartering is good.</p>
