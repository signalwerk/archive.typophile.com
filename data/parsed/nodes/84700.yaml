      <p>First, nice article, Thomas!</p>
      <p>Non-designers typically get in arguments about form without considering function (like in the ligatures example that John Hudson mentioned), and to me that's the reason why typography is so important and relevant for designers. </p>
      <p>Typography is the study of typefaces and their relationship with design and communication. Typography, to be effective, must be the last thing the audience has to worry about about. The typefaces can be noticeable, legible, and possibly meaningful, however, they cannot be something too complex to decipher.</p>
      <p>There's a wonderful book by Jan Tschichold called "The Form of the Book", it deals with many aspects that are relevant to designers regarding legibility, typefaces, etc., but from the editorial design perspective. I've found the principles in that book to be applicable to today's digital design (web, apps, etc.). I highly recommend it :-)</p>
      <p>Cheers!</p>
      <p>- Manuel</p>
    html_clean: |-
      <p>First, nice article, Thomas!</p>
      <p>Non-designers typically get in arguments about form without considering function (like in the ligatures example that John Hudson mentioned), and to me that's the reason why typography is so important and relevant for designers. </p>
      <p>Typography is the study of typefaces and their relationship with design and communication. Typography, to be effective, must be the last thing the audience has to worry about about. The typefaces can be noticeable, legible, and possibly meaningful, however, they cannot be something too complex to decipher.</p>
      <p>There's a wonderful book by Jan Tschichold called "The Form of the Book", it deals with many aspects that are relevant to designers regarding legibility, typefaces, etc., but from the editorial design perspective. I've found the principles in that book to be applicable to today's digital design (web, apps, etc.). I highly recommend it :-)</p>
      <p>Cheers!</p>
      <p>- Manuel</p>
