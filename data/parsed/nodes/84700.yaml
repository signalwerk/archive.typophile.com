      <p>&gt;William, I’m not sure it’s as simple as the example you cite. </p>
      <p>What do you mean by "it?" The point of my example is that "before" and "after" pictures are a good tool to communicate the difference between poor and good design. </p>
      <p>I wasn't arguing that well designed signs are by themselves going to make a business succeed or fail. Good visual appearance and communication are just one aspect. The question of the role of design in persuasion and business success are complex ones, and I wasn't addressing that. </p>
      <p>I think the average person would say that, other things being equal, if they needed a hair cut, they would more likely walk into the shop with the "after" sign than the "before" sign. That's all. Also, the "after" sign is a lot more attractive, which is a social good in itself, if you like beauty over ugliness.</p>
      <p>As Thomas quoted James Pluckett saying in the article, Apple is the best contemporary argument that good design as part of a good business can be a benefit.  </p>
      <p>I think that questions of the choice of typeface and refinements like small caps are secondary to the general question of good graphic design. Once you accept that good graphic design is a benefit, and can see that some is better than others, then I think you're ready to see the benefits of a good choice of type and refined setting. I doubt that a person who fails to "get it" about graphic design in general is going to be convinced about the need for good typography.</p>
      <p>That is why for a general audience—perhaps not necessary for this magazine—I would start with the barber shop, and go on from there. I don't know how large the illustration is in Thomas's article, but I think you only see the "point" of old style figures when you can seem them clearly in running text. I think the thing about good typography that is hard to grasp until you get into it is that while a refinement like old style figures is a small matter, refined typography is an accumulation of small matters. When you get them all right, the result is very agreeable, even if any one of them is not such a big deal.</p>
