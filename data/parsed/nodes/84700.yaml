      <p>As a type designer, I don't have to explain Why Typography Matters, but How Is it Possible to Make a Living Doing That?!</p>
      <p>I explain that everyone with Word is now a typographer, and that despite bundling the number of font users (such as themselves) is so huge that the small segment of users (professional and otherwise) who would pay to licence something different is nonetheless large enough to support a digital font industry with hundreds of foundries producing new fonts, every day.</p>
      <p>The next question is along the lines of How Do You Make it Different? —and that get us into Thomas' Three Fs, but I also like to discuss how the diversity of typographic form (even within a single writing system) makes sense from both a formalist and a structuralist perspective. </p>
      <p>In other words, if you consider type shapes purely formally, there is an almost infinite number of ways a legible alphabet may be shaped.<br>
      And if you consider type forms as representing meanings within the culture in which they occurred, then because cultures are ever-changing, then so too must type forms be ever-changing.</p>
