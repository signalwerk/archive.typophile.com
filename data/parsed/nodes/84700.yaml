      <p><em>One is that to many people, old-style figures look so strange and peculiar, that if you bring them up to people who doubt that good typography is important, you will end up being dismissed.</em></p>
      <p>Years ago, I was typesetting an educational document, and pointed out to the author the fi etc. ligatures that the font I had used provided (in an expert set). She was most put out, and said she thought that they looked weird and would distract readers. I pointed to the novel that she was halfway through reading, lying nearby, and asked her to look in it for words containing fi fl ffi or ffl. She did so and was amazed to find that the book was full of those distracting ligatures. That evening she phoned me from her home to exclaim 'All my books have them!'.</p>
      <p>Books are (mostly) your allies. They represent several hundred years of typographic practice and refinement, and can be used to demonstrate the norms of typographic communication. Even oldstyle figures.</p>
