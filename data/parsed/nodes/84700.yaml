      <p>British Petroleum is an old multi-billion dollar corporation that has a very long standing in the business world. Having a polished graphic presentation is not only expected but required. There has been a long history of unethical activity among wealthy corporations combined with slick marketing spin. The difference between them and a small neighborhood barber shop is huge.  Hand-written notes have a different appeal depending on source and audience.  We treasure handwritten letters from family members.  We expect a certain business decorum from large corporations but do not always trust that they are honest.  Crooks and slime-balls know how to do smoke and mirrors.<br>
      A handwritten grease-pen scrawl on butcher paper covering a fresh leg of lamb from our neighborhood butcher shop means "fresh and cared for" where a plastic boxed leg of lamb with barcoded label means "nothing special" from Safeway or any other major grocery chain.</p>
