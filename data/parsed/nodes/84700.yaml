      <p>Nice job, Thomas.<br>
      I've been spending the last year in my masters of ed in arts &amp; learning program exploring the communicative aspects of glyphs. Several of my research projects involve students creating then assessing typographic or lettering pieces on what they perceive in terms of message, emotion, association of imagery or concept, etc.</p>
      <p>The projects use non-latin alphabets, illegible handlettering, and/or obscure languages in order to remove the "reading of words". In other words, the pure communicative power of letters/glyphs themselves.</p>
      <p>Many of the students were astounded how much they could communicate without "words" and as a result, many pay far closer attention to the minutia and subtleties of typography.</p>
      <p>Now if we can only get the designers and creatives to "see" as opposed to "read".</p>
