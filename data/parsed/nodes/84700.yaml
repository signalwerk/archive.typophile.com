      <p>I'm concerned about two things about that article.</p>
      <p>One is that to many people, old-style figures look so strange and peculiar, that if you bring them up to people who doubt that good typography is important, you will end up being dismissed.</p>
      <p>The other is that the other differences in the example you showed were much too subtle to make an impression on the general person - and while the article itself is written for an audience of typographers, it's about how to make themselves clear to non-typographers.</p>
      <p>To convince a layperson that typography matters, you need to do so in a simple manner that even the layperson can immediately grasp.</p>
      <p>Thus, what I would suggest as a basis for comparison would be a page set in a modern typeface... of the thin and anemic kind favored in the late nineteenth century. Compare that with an example of readable fine typography, and you will begin to make the case that typography can matter, at least to a limited extent in extreme cases. That will be a start.</p>
