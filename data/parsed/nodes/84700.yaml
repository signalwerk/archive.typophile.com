      <p><em>The truth is "What does it say?" is what matters. I don't mean just the words written there. If you are going to a barber who,you would like to think they are reputable, clean, and have a valid license. The hand scrawled note says "probably not" no matter what the words say.</em></p>
      <p>So, what about British Petroleum, for example? Who believes they are reputable, clean and have validity? They have a very polished graphic appearance after all. It’s an extreme example (I apologise in advance), but the contrast of neat corporate image and dire corporate behaviour has to shake faith in the currency of design, in the value of those values, if you will. My initial point regarding the clean up of the barber’s sign was that it no longer suggested to me “good haircut”, just “neat, familiar, well practised sign”, which actually made it harder to “read” in some respects. Conversely the “hand scrawled” sign did not necessarily make me think “bad haricut”, rather “kooky, hand made sign, might have an interesting chat with the barber here, a suitably local price, and a haircut un-phased by current fashion”. Try getting a designer to communicate those sentiments … they probably can’t, especially not with well spaced Futura etc., etc.</p>
      <p>As a designer, I probably have a heightened sensibility to this crisis, but I hope you see my point. </p>
      <p>It’s not clear cut, excuse the pun!</p>
