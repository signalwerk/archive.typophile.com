      <p>I know, Dez, it was funny - my response was <strong>:-)</strong> right there below the quote itself!<br>
      Then I went on to address William. Don't worry man, full credit to you!</p>
      <p>All I meant to say was that there is not a simple scale with good typography at one end and bad typography at the other, with every typographic entity waiting to be positioned according to a subjective idea of what is good and bad. You could begin this process, and chances are you would start filling up the scale with examples, but the next man’s scale would say something else, and would be created according to different esteemed values, so on, so forth. There may be some common ground; good kerning, technical ideas etc., but when it comes to appropriateness of overall design that requires a much more complicated system to cope with the myriad responses. So, William, I would say there is probably such a thing as readable typography (objective, can be tested) but <em>attractive</em> typography is subjective, the latter is something you insist on rather than something you can prove.</p>
