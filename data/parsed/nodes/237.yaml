    html: <p>Hi Dmitry, <br> <br>I like it. Ok, it looks like something I saw before but still it has something of its own. <br>I like the feeling of an italic that is not an italic. Maybe you should use that a little more. If I look for the S and Z, they are for me to much upright. Perhaps they should also lean a little to the right like het A, B, E, F, P, R, etc. <br> <br>I can immagine how hard it must be to make something original. Seeing the fact that it are pixels. You have only so much of them. <br> <br>Keep it up. <br> <br>Ren</p>
