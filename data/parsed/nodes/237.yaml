    html: <p>I like where you're going, but it feels like you're trying to fit things to rigidly to a formula. <br> <br>In your nickname (taran80), I read the 8 as a B (taranb0). 8, B, and Q all look like Bs to me. <br> <br>I think you should pull in the sides on the 8 (eliminate 1 pixel on each side of the crossbar you have now). Try a vertical tail on the Q. At 6 px, you're going to have to occasionally compromise the pureness of your design in favor of legibility.</p>
