    <p>I am looking for a nice and modern sans serif for my company. Any suggestions?</p>
    <p>The following fonts I like, but they are just not it..</p>
    <p>Helvetica (Duah)</p>
    <p>FF Max<br>
    Soho Gothic<br>
    Neo Sans<br>
    Din</p>
    <p>Maybe something with digital/tech like rounded corners like barrister (only without the clumsiness :P)</p>
