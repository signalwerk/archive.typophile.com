  html: "<p>SAUNA FONT <br>----------------------------------------------- <br>Underware has released its second font family: SAUNA. <br> <br>After three years of work, the Sauna font is finally released. The whole Sauna family consists out of 18 fonts. The basic ten fonts are meant for text and display use. One of the features are for example the two italics for every weight. Then there are ligatures fonts and mutli-layered dingbat fonts to give some extra to the typographics.  <br> <br>More info about the fonts:  <br><a href=\"http://www.underware.nl/site/sauna/general/\" target=\"_top\">http://www.underware.nl/site/sauna/general/</a> <br> <br> <br>SAUNA BOOK <br>----------------------------------------------- <br>The font family is first shown in the book 'READ NAKED'. The book can be read inside a sauna and...  it survives! This book gives a rich view on the sauna world. The book includes articles about the world champion sauna bathing Leo Pusa, the weird backyard saunas from Seppo Toivanen, many small personal sauna stories from people all over the world. And also some 'designer's secret sauna stories' from designers like Kurt Weidemann, Henrik Birkvig and John Downer. These stories can only be read inside the sauna, at 80 degrees Celsius or higher. <br> <br>More info about the book:  <br><a href=\"http://www.underware.nl/site/sauna/examples/\" target=\"_top\">http://www.underware.nl/site/sauna/examples/</a> <br> <br> <br>SAUNA PARTY <br>----------------------------------------------- <br>The book and the font were released at the 10th of May 2002 during the 'Secret Sauna Party' at the Goldberg Institut in Berlin. Visitors had the possibility to test the book 'Read naked' live inside a real sauna. For pictures from this party and all the naked men testing the book, check: <a href=\"http://www.underware.nl/\" target=\"_top\">http://www.underware.nl/</a> or <a href=\"http://www.rotorot.de/\" target=\"_top\">http://www.rotorot.de/</a></p>"
