    html: |-
      <p>I like it! A perfect combo with 'Madcon's music, swinging from my speakers right now. The lowercase really have a great deal of potential.</p>
      <p>The Uppercase need a lot work. Not sure where to start. Compare them to the lowercase carefully and perhaps start from scratch. They need more of the swing that the lowercase has plenty of.</p>
      <p>On the lowercase: Remove all straight stroke endings and replace them by the soft stroke endings on n for example. This would affect ijvwxz. They don't fit in currently.</p>
      <p>o is bit too narrow.</p>
      <p>tittles on ij should be more brushy, or just round, instead of the computarized vertical squezed ones you made.</p>
      <p>j would probably benefit from a little curve on the bottom. </p>
      <p>The continuation of the swash on g and y (past the stem) looks a bit forced. I'd simply get rid of it.</p>
      <p>ces are leaning backward ever so slightly</p>
      <p>Calligraphy-wise, it makes more sense to make the stroke ending of the ascender on d the same as in b. same goes for p and q.</p>
      <p>xz don't fit in. Not sure how to fix this.</p>
      <p>Good luck!</p>
      <p>Cheers,<br>
      Jasper</p>
