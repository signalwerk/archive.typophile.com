      <p>That k is darn gorgious! c is also better now.</p>
      <p>/a/ looks better without terminal I think.</p>
      <p>Bein' a pain, I know, but the right side of /e/ also needs work. The part where the 'crossbar' enters the bowl needs to be thinner. The very top node needs be moved to the right a little and the node on the very right (top) needs to move up. Just like /k/, /e/ needs to have the 'italic' feeling more. Perhaps you could even try to use the bowl of /k/ as a mask for the bowl of /e/. I'm not sure wether you should go all the way with the /e/ though, but at least more towards the italicness of the bowl of k.</p>
      <p>In the italic of my font, the /a/ (similar to your alternate /a/, which has the same bowl as d), appeared to be wider than /d/. It's an optical illusion I really don't understand, but you should make sure to check it in your font.</p>
