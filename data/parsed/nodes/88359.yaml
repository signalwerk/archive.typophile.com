    html: |-
      <p>Yes, it doesn't fall back anymore. However, following script/broad-nip logic, the control point I selected in this picture should go up quite a lot. On the other hand, it seems that letters like e and o have a perfectly straight stress, whereas letters like n d v have an obvious diagonal stress. For some reason it doesn't really cause any conflicts between them, though. Bringing up the control point I selected should bring some diagonality to an otherwise vertically stressed letter, which is what my gut tells me it needs, but you might be right in keeping it vertically stressed throughout the e (the way it is now).</p>
      <p>Just to be clear, vertically stressed is when the broad-nip pen is held horizontal. Diagonal stress is when the broad-nip pen is held diagonally.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Picture2_5922.png"></div><p></p>
    html_clean: |-
      <p>Yes, it doesn't fall back anymore. However, following script/broad-nip logic, the control point I selected in this picture should go up quite a lot. On the other hand, it seems that letters like e and o have a perfectly straight stress, whereas letters like n d v have an obvious diagonal stress. For some reason it doesn't really cause any conflicts between them, though. Bringing up the control point I selected should bring some diagonality to an otherwise vertically stressed letter, which is what my gut tells me it needs, but you might be right in keeping it vertically stressed throughout the e (the way it is now).</p>
      <p>Just to be clear, vertically stressed is when the broad-nip pen is held horizontal. Diagonal stress is when the broad-nip pen is held diagonally.</p>
