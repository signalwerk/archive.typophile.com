  html: |-
    <p>Ok, this is a brushy, cutesy, small-x-heighty, condensed display face but I want to keep it somewhat structured, lest it fall into a one-trick-pony category. Ligatures and alternates could be fun on this. My biggest concern has been getting the thicks and thins in the right places. (I've been looking at Franklin Gothic Condensed for guidance) I need some eyes on this...</p>
    <p><a href="http://www.com-vis.com/cvtype/Piquant_02.pdf" rel="nofollow">Piquant 01</a></p>
    <p><img src="http://www.com-vis.com/cvtype/Piquant_01.png"></p>
