    <p>my friend wants a tatoo featuring a kerouac quote, im searching for either :</p>
    <p>a photograph of the original manuscript</p>
    <p>someone with a underwood typewriter, the same type as kerouac’s ofcourse.</p>
    <p>someone with knowledge of what typeface underwood use/d for their typewriter.</p>
    <p>or knowledge on what digital and commercially available typefaces are the best alternatives.</p>
    <p>hope someone out there can help,</p>
    <p>thanks in advance</p>
    <p>christian zander<br>
    copenhagen</p>
