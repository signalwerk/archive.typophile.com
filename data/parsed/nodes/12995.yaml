    html: |-
      <p>Bulletin is actually an old metal face cast by BB&amp;S. Designed in large sizes (18pt, 24pt) in 1925. And then in 36pt in 1933. I have all the sizes in several cases. It was quite a nice looking typewriter face. A bit absurd to have a typewriter face in such large sizes but it fit a niche (display) and sold well in its time. It was cast as a monospaced font and required special spacing. I printed a large broadside “chain letter” in it once. Quite fun. The page form weighed 70 pounds!!!</p>
      <p>As an aside, but alluding to your remark about Kerouac and tattoos, and perhaps indicative of our changed times: as sceptical and suspicious of authority (or the powers that be) as the beats and hipsters were, I suspect they would have avoided permanent identificational markings.</p>
      <p>Gerald</p>
