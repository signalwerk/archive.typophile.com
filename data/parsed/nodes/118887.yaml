      <p>Faces like News Gothic and Franklin Gothic were basically the first sans-serif faces acceptable by modern standards. They are old-fashioned, about at a level with the geometric sans faces such as Kabel or Futura, or with Century Expanded.</p>
      <p>However, given the variety of sans-serif faces in use today, rather than the old monoculture of Univers and Helvetica, it may well be that they would now pass unnoticed in the shuffle and could potentially be due for a revival.</p>
