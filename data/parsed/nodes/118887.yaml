      <p>I'm not sure that recent trends are responsible for the older Gothics becoming passé. I've been around for several decades now, and during that time they've never exactly been "in."</p>
      <p>Those slightly awkward faces were long ago eclipsed by the more refined Univers, Frutigers and Helveticas of the world. The exception (at least for me) might be Franklin Gothic, which is still one of my go-to typefaces. Then again, who am I to say — I just recently started using Akzidenz-Grotesk on a few projects.</p>
