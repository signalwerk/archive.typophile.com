  html: <p>With font preference increasingly gravitating towards "rounder" and "friendlier" fonts, do you think the Gothics (News, Trade, ...) are "passé"? It's fascinating that even the corporate world is following the hype in an attempt to appear more accessible and humane, even when nothing in their culture changes.</p>
