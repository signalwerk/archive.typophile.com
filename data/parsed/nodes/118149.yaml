      <p>Trajan is very poor choice here; it's about as undigital as you can get.</p>
      <p>If you're stuck with it, for the acronym: either tame the leg of the "R" or make it descend to allow the "S" to get closer; try flipping the "S" so the top is bigger than the bottom and thus fits better.</p>
      <p>hhp</p>
