    <p>Dear Typophiliacs,</p>
    <p>I am tasked with designing new logotype for a University Library Digital Center.</p>
    <p>They have chosen Trajan as the preferred typeface.</p>
    <p>Some issues i'm trying to improve:</p>
    <p>they often use an initialism: "CDRS" which  (to me at least)  looks really horrible in Trajan, it looks like the 'S' at the end is going to tip over. I've tried to improve this by making outlines in illustrator and trying to stretch out the leg of the "R" --- how am i doing?</p>
    <p>also in the fully spelled out words, there is another RS combination, which i tried to apply the same "trick" , but i wonder if it looks weird if that is the only R which is 'fancy'</p>
    <p>in the jpeg it has a few variations of size and some with the 'fake' R leg, some regular, and the initialism in trajan pro and trajan pro bold.</p>
    <p>any feedback or critique is appreciated.</p>
