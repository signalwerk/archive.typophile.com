    html: |-
      <p>The swash R is interrupting the flow, in all versions. I wouldn't use it.</p>
      <p>On the spelled-out versions, increase the size of "for" and "and" by 50% and drop them to the baseline of the rest of the type (I don't mind a size differential, but right now it creates too much of a hole and interrupts the linear flow).</p>
      <p>On the stacked, spelled-out versions, try everything flush right (after you fix the size and position of the articles)--that is, move "Center for" right to align with the other two lines on the right margin.</p>
      <p>On the initials-only version, the S looks off balance because you have too little spacing between the letters in general. Use optical, not metric, kerning and increase the letter spacing until it looks more balanced. And I wouldn't use the bold version of Trajan on anything.</p>
