      <p>The letters are rounded as part of their working with a routing tool, essentially a drill bit that is designed to cut sideways, incising means that without manual finishing it is impossible to get a square corner.<br>
      There are some sample fonts here, although pretty rough.<br>
      <a href="http://www.able-engravers.com/engraving_fonts.htm" title="http://www.able-engravers.com/engraving_fonts.htm">http://www.able-engravers.com/engraving_fonts.htm</a></p>
      <p>Tim</p>
