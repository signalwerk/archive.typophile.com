    <p>Hi everyone, this is my first post here, I’m not a professional graphic designer, but I made this logo for myself.  I read a couple of other posts and I really liked how you guys critique and make suggestions so I wanted to know how bad my logo is, or who knows maybe it’s not that bad.  I have already made business cards with this logo, however it’s on a black background.  I wish I had known about this forum before I committed to this logo, but who knows, if you guys help me make it a real logo, I’ll make a new batch of business cards.  Thanks you for taking the time to view my post.</p>
