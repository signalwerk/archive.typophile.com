    <p>Hi,</p>
    <p>I've enjoyed looking over the website and I'm facinated by amount of knowledge you folks have.</p>
    <p>I'm looking for a freelancer to help my small company - BlanchardGroup, and architectural firm that specializes in long range planning for educational instutions - rethink our workmark, and the typefaces we use on a day-to-day basis.</p>
    <p>I would enjoy hearing from anyone interested, and seeing a few samples of your work - <a href="mailto:jeff@blanchardgroup.com">jeff@blanchardgroup.com</a></p>
    <p>many thanks - Jeff</p>
