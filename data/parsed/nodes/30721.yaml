      <p>Sorry, your question wasn't really pointless. </p>
      <p>I'm sure other people will give your more helpful answers - the point was really that in this space you're not exactly spoilt for choice. </p>
      <p>The answer also depends on what you want to make, and what you want to learn. If you're just interested in making a few basic fonts then FCP or Typetool may be totally fine - if you're looking to make OpenType fonts then making the jump straight to FontLab may be a better bet. With respect to FOG, although people still love it, and many designer still use it to start a design, I think all the signs point to FontLab not investing in it long-term. </p>
      <p>Cheers, Si</p>
