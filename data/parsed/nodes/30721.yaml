      <p>Interesting question, but seems a little bit pointless? You basically have four options if you want to use font editing/creation software that's being actively developed... </p>
      <p>1. Commercial product<br>
      2. Cut down cheaper version of commercial product<br>
      3. Open Source product<br>
      4. Cheap 'shareware' product by nice bloke in Holland</p>
      <p>Conveniently it really just comes down to price and philosophy - something for everyone.</p>
