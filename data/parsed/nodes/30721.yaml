    html: |-
      <p>If you have a lot of money and are doing full-time font development, particularly in a team setting, there's also DTL FontMaster.</p>
      <p>But for most other folks doing serious work, if you are only buying one tool, FontLab is the only option worth considering.</p>
      <p>Fontographer simply lacks key features that we need for serious work (such as OpenType support, decent Unicode support, native TrueType editing, adequate hinting for both kinds of outlines, and a zillion aspects of control over what goes into the generated font). It does have a drawing interface that a lot of people like, however.</p>
      <p>Cheers,</p>
      <p>T</p>
