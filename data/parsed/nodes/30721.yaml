    <p>Hello! Thank you for reading this post. </p>
    <p>I have heard plenty of opinions on what font editing software is most effective, most professionally utilized, price comparisons, easy to use or learn and other things that distinguish one program from the next. </p>
    <p>But what should a good font design program actually offer? If you ignore the name, the price, even perhaps ease of use of any given program on the market: What should the program have? </p>
    <p>Please list the options, the price points and such.  I am curious as to what functionality of a program makes it superior to the next.  Please answer this as if you were addressing the average computer user (not a typography expert like yourself, you smart devil).</p>
