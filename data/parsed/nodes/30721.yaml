      <p>From the question, I surmise you have not done a course. As a poorly self taught person, my answer would be as follows</p>
      <p>Everyone works in a different way, and as such should use the program which that person finds easiest to use, and understand. Fontographer to me is easiest to create with, but Fontlab is best for me to do the finicky fine work with. So I use both. Other more professional people would, in general, suggest you use Fontlab, as they know all the ins and outs through training and experience.<br>
      So what you need to do is try the programs and determine which is easiest for you to get the desired outcome.</p>
