      <p>Hey Hey Hey!</p>
      <p>Thomas (as well as the rest of you)you hit it on the nose!<br>
      "Fontographer simply lacks key features that we need for serious work (such as OpenType support, decent Unicode support, native TrueType editing, adequate hinting for both kinds of outlines, and a zillion aspects of control over what goes into the generated font). It does have a drawing interface that a lot of people like, however."</p>
      <p>That is the info I was really looking for. Thats the cold hard stuff that tells me what to look at.</p>
      <p>I have a B.A. in art from a fabulous and prestigious liberal arts college....It just so happens that it wasn't so fab in the art department though. There were no Typography courses and such- my design classes didn't even get into it. But discussing the various avenues of formal art and design education is not what this post is for. What's done is done and I am working hard now. The point is moot and I am happy with it all- just doign a little overtime in the self education thing right now.</p>
      <p>I am an Adobe addict so I comprehend when people say that a program has a tough learning curve. I also understand budget concerns and hobbyists vs. professionals.  </p>
      <p>I want to get into font design (I drool over them honestly...). I don't have the budget right now to invest in Fontlab but I am going to be designing three logos in the comming weeks and thusly I am beefing up my knowledge on everything I can. </p>
      <p>I understand when some will surely say "If you are serious about this you will find a way to purchase Fontlab...". I agree with them. Unfortunately, my bank account doesn't and that is the reality that I have to face.</p>
      <p>So in the mean time, I want to learn about the options and see what makes them tick. </p>
      <p>So what it comes down to is this. Fontlab is worth it- but I can't afford it right now. So can I do everything that I will need to do (and learn mind you...newbie newbie at font work) on Type Tool? Can I save the font in all the formats I need to? </p>
      <p>I don't even know what to ask...get the picture? I am in that land of I know enough to know I don't know anything. Which is a good thing, since I am here putting forth effort. :)</p>
