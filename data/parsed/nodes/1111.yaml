    html: <p>Which system? <br>Which coding languages? <br>Which software? <br> <br>The only thing that's always default is that its monospaced. <br>Don't know about Mac's, but most script editors on proper computers just use Courier New. <br>C++ and VB also use Courier New on my machine &amp; I don't recall changing it, so I guess that's default.</p>
