    html: |-
      <p>Thanks for your comments.  Here is an image of the logo with the typeface.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/cr_lockup_6726.png"></div><p></p>
      <p>So, the letter i is, for the most part, a signification of the meaning behind the creation of the typeface.  I thought, to describe a community and to describe those communities as "rising" is somewhat of an obvious and vague name for the organization.  But a community is made up of a group of individuals.  When you refer to yourself as an individual you use 'I'.  Individuals in a circle make up that community and are unified, and also indicative of a sun, that rises.</p>
      <p>I think that this concept works well with the logo and the feeling of the typeface is right, and the letterforms are unique enough that an emphasis on the I's makes sense, but I really think that the metaphor holds up mostly in the lock-up. I also agree that maybe working too individualistically and trying to make some letters individuals is taking away from the face.  But then why not use DIN or Knockout or any other similar font that has been used for a wide variety of applications? Maybe less of an angle for the rest of the typeface?</p>
