      <p>Simple question, rather hard answer!</p>
      <p>I believe that the number one rule for anything typographic is "trust the eye". No better way to know what to do than trying multiple solutions, at least when you're starting.</p>
      <p>There are no 'rules' about this than your own judgement, so work hard on it. Getting good on combining typefaces is all about knowing a lot of them and being able to imagine them together.</p>
      <p>Hope this helped.</p>
      <p>Cheers!</p>
