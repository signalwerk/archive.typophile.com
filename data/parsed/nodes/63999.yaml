    html: |-
      <p>Right – who needs craft, knowledge or quality.  :-(</p>
      <p>Seriously, I think successful combination of fonts is an important ingredient to making design compositions truly click – making them organized wholes instead of simple additions of elements.<br>
      There are rules, like matching construction principles or proportions, and they're good for starters, to avoid blatant clashes; but it's when you transcend them that things become truly interesting, IMO. A very important thing (and this is where I agree with James) is to play, and observe the new balance/harmony (or lack thereof) carefully. </p>
      <p>Bringhurst sure is a good place to start. There have also been oodles of threads on specific pairings here on Typophile, so digging through the archives and learning from those examples might be interesting too.</p>
