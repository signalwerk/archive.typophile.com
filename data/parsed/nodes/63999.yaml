      <p>I always think of the game <a href="http://www.setgame.com/set/" target="_blank">Set</a> when trying to pair. I like to make sure each attribute (colour, contrast, skeleton, angle, etc.) is either as similar as possible or as different as possible. Fonts with attributes that are close but not quite the same tend not to pair well.</p>
      <p>And of course, if it looks good, then ignore the rules.</p>
      <p> - Lex</p>
