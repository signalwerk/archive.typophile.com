      <p>Minion and Syntax<br>
      Frutiger and Meridiene (or Frutiger Serif)<br>
      Gill and Perpetua<br>
      Bodoni and Futura<br>
      Helvetica and Craw Clarendon<br>
      News Gothic and Times<br>
      Univers and Utopia<br>
      Garamond and SanMarco</p>
      <p>After that I'd have to check my books.</p>
      <p>The main thing to look at when combining a sans and a serif is to counterbalance the x height, cap height, ascenders, descenders, stroke width and character width. Not an easy task. Convention dictates go for similarity (such as Utopia and Univers) or contrast (Futura/Bodoni).</p>
