    votes: null
    html: |-
      <p>I think it is hard finding a nice fit for such a display type, as the characteristics are very different from a text font, but then again: 1st one could work IMO, because they have simular x-height, although it wouldn't neccesarily make a pretty picture. The 2nd has an x-height that is too different to work well together. 3rd is a monospaced font, which makes this a difficult one as well. They do share some characteristics, in that they are both pretty crude in shape and the characters have a roundedness to them. But then again if one is used as only a bold headline and the other only for 11pt bodycopy it doesn't have to be a problem.</p>
      <p>I'm a bit of a sucker for finding perfect matches, but it's by no means an exact science, and fonts could work together in various ways. So there isn't one thing to look at. You could look for historical matches, but also for purely visual pairings. You can go for contrast or simularity. And it all very much depends on the context and the way you want to use them together. If you want to mix two typefaces in a running text the pairing is much more critical than if you only want to use the one for headlines and the other for copy. And in areas like bookcover design you just have to trust the eye.</p>
      <p>Important thing is to have fun!</p>
      <p>greetings Jeffrey<br>
      <a class="freelinking external" href="http://www.infraordinaire.com/wordpress">infraordinaire</a></p>
