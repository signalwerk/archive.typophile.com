    html: <p>Stop worrying about it. People get so freaked out about pairings because design pundits use it to fill out their books about type. But it’s just not a big deal. If you want to use the typefaces together, do it. If you don’t, don’t. Nobody is going to boycott your product because you used two sans types in the same ad, or because the x-heights weren’t close enough, etc. Just relax and have fun.</p>
