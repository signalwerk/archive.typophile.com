    html: <p>Lex, that's a great parallel! Another way that lends itself well to thinking about type is thinking musically. When composing a duet, the two instruments or voices should be harmonious. One can be dominant, the other submissive; or both can be supportive, each with its unique contribution. As James Puckett says, and I agree with it, have fun. Don't become too dogmatic, and surprise yourself with the combinations that you make work. You will find that you can control to a great degree the context in which these combinations are seen.</p>
