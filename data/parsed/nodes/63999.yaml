      <p><a href="http://typophile.com/node/32056" title="http://typophile.com/node/32056">http://typophile.com/node/32056</a>? – Pairing typefaces</p>
      <p>I personally tend to look for something with a similar skeleton structure: the degree of openness in forms like a, e, c and similar letters, how the n, h, m, curve hits the left stem and the proportions of letterforms.<br>
      Looking for fonts that would fit a specific project, I often find both sans and serifs that I consider have a similar “tone”.</p>
