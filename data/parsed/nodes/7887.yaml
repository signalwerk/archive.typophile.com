    html: "<p>[funy but Trebuchet and Meta have some similar characteristics, the &gt; curved l, open loop g... ] <br> <br>...except that Meta was designed in 1985 and published in 1990. Trebuchet came way later, so it�s obvious what influenced what.  <br> <br>Real Simple magazine commissioned Meta Light in 2 weights from FontBureau. Christian Schwartz took those outlines and made them into Meta Hairline, Thin and Light. Not as easy as we thought: just a line without any modulation (as in the Hairline weight) tends to be just cute, without much character. Works for Helvetica, but was a bitch to do for Meta.</p>"
    html_clean: "<p>[funy but Trebuchet and Meta have some similar characteristics, the &gt; curved l, open loop g... ] <br> <br>...except that Meta was designed in 1985 and published in 1990. Trebuchet came way later, so it�s obvious what influenced what.  <br> <br>Real Simple magazine commissioned Meta Light in 2 weights from FontBureau. Christian Schwartz took those outlines and made them into Meta Hairline, Thin and Light. Not as easy as we thought: just a line without any modulation (as in the Hairline weight) tends to be just cute, without much character. Works for Helvetica, but was a bitch to do for Meta.</p>"
