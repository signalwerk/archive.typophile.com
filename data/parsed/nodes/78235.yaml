      <p>My <a href="http://kltf.de/kltf_grotext_features.htm" target="_blank" rel="nofollow">Grotext</a> and <a href="http://kltf.de/kltf_litteratra_features.htm" target="_blank" rel="nofollow">Litteratra</a> do a contextual replacement of f, and <a href="http://kltf.de/kltf_tiptoe_features.htm" target="_blank" rel="nofollow">Tiptoe</a> does the same for f and g. The less problematic short version is the default.</p>
