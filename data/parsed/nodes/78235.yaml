    html: <p>Note that the dot on top of the i used by Nicolas Jenson was pushed to the right so that it wouldn't bump into the kern from a preceding f or long s. This avoided the need either for alternate forms or for ligatures - but this was seen as a failed solution, and since then, Roman types had ligatures, or, much later, buttonhook f's.</p>
