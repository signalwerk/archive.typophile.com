      <p>Linux Libertine has been using this technique for some time now. I like this solution for issues in german where many ligatures are not welcome.<br>
      <a class="freelinking external" href="http://aldusleaf.org/" rel="nofollow">Crimson Text</a> will use it too. In combination with german locl rules, this reduces the number of ligatures you would have to brake up manually.</p>
