    <p>Blue Vinyl Fonts is happy to introduce Darlena!</p>
    <p>Darlena is a swashed typeface that is perfect for grabbing attention. Influenced by Italian calligraphy from the late 1500’s, with modern serifs thrown in.</p>
    <p>Available here:<br>
    <a href="http://new.myfonts.com/fonts/bluevinyl/darlena/" title="http://new.myfonts.com/fonts/bluevinyl/darlena/">http://new.myfonts.com/fonts/bluevinyl/darlena/</a><br>
