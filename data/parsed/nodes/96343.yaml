    html: |-
      <p>Yes, I see from the close-up that it is supposed to kiss.<br>
      However, the effect is ill-considered.</p>
      <p>The reason is that the /e to /b kiss is not two curved vector paths meeting tangentially at an inﬁnitely small asymptote, as the other two kisses are, but a border where the paths are coincident.</p>
      <p>The Univers /e has a straight line edge at the corner of the bowl (see 1, below), which creates a length of simultaneous contrast that is optically jazzy, with perhaps some sub-pixel interference.</p>
      <p>And of course, in print, dead-hit registration is damn tricky.</p>
      <p>It would be a good idea to modify the vectors of the /e so that they come to a single extrema point (2 or 3, below).<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/curves_5983.png"></div><p></p>
