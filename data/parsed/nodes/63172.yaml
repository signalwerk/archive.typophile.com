      <p>Thanks for all your comments.</p>
      <p>@ sii</p>
      <p>We have actually used Ray before so a custom font is an option.</p>
      <p>@ Fontgrube</p>
      <p>Yes, that's where I found Stasmic.</p>
      <p>@ PvdL</p>
      <p>I find Feisar/Feisar Express a little too "alien/retro" for what i'm doing with this front end. On the other hand, I'm not looking for something too futuristic either.</p>
      <p><a href="http://img29.imageshack.us/img29/687/headerbodycomparison.gif" title="http://img29.imageshack.us/img29/687/headerbodycomparison.gif">http://img29.imageshack.us/img29/687/headerbodycomparison.gif</a> (Excuse the link, I can't work out the correct tags &gt;.&lt;)</p>
      <p>Body text? I'm thinking perhaps Century Gothic Italic, though i'm far from convinced.</p>
