  html: |-
    <p>Hi,</p>
    <p>I'm working on the Front End for a modern arcade game. Something similar to SEGA's 'Afterburner Climax', and i'm looking for heading and body fonts.</p>
    <p>I like the italic, smooth feel of Ray Larabie's <a class="freelinking external" href="http://www.dafont.com/stasmic.font" rel="nofollow">Stasmic</a> but i'm worried it may be a little too light and difficult to read, even as a heading font. </p>
    <p>Anyone fancy suggesting some suitable heading/title and body fonts? </p>
    <p>Thanks in advance,</p>
    <p>Dan.</p>
