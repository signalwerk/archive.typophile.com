    html: |-
      <p>Showcard Gothic did NOT do any substitution at all! In the Germandbls position Showcard Gothic has a single glyph that consists of two esses. </p>
      <p>If you want MS Word to automatically substitute SS or ss for every appearance of ß  (I don't know why you'd want to), go to Tools/ AutoCorrect options / and enter the appropriate eszett character and what you want to replace it with in the "replace" and "with" table.</p>
      <p>I don't believe that the germandbls (eszett) is a ligature in the opentype sense, but I could be wrong.</p>
      <p> - Herb</p>
