      <p>I think the term "ligature" is confusing. For instance, in French there is a letter "œ" and it is described as a ligature. However, the wiki entry concerning it, <a href="http://en.wikipedia.org/wiki/French_alphabet#Ligatures" title="http://en.wikipedia.org/wiki/French_alphabet#Ligatures">http://en.wikipedia.org/wiki/French_alphabet#Ligatures</a>, clearly states "The two ligatures œ and æ have orthographic value." You cannot write oe when it should be œ, nor conversely. You need to know, or refer to a dictionary, or use a spell checker. </p>
      <p>Edit: in fact, if you write oe when it should be œ, only the purists will mind.</p>
