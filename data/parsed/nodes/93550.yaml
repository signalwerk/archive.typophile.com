    html: <p>It seems worth mentioning that Showcard Gothic is an all-caps font. It's not uncommon in such fonts to find an "SS" glyph in the slot for the eszett, since that's the conventional all-caps translation (with the capital eszett still competing for wide acceptance). Showcard Gothic isn't doing any substitution aside from substituting it own design of the "ß" glyph, just as it does with every other selected glyph.</p>
