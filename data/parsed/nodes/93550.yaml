  html: <p>I typed the word <strong>groß</strong> in a Word document and tried to see it replaced automatically by <strong>gross</strong>, just by changing the font applied to the word. To my surprise, just one font "Showcard Gothic" did the substitution. I don't know why, but it seemed to me that this substitution should occur more often. Is there any explanation for this behavior, other than the obvious one, that this is the only way to write this word ?</p>
