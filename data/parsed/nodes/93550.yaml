      <p>Belloc,</p>
      <p>Re. the eszett:</p>
      <blockquote><p>But if we had a font that did the reverse, i.e., replaced the 'ss' by 'ß'. Wouldn't that be helpful?</p></blockquote>
      <p>No, because German, especially since the spelling reform of the 1990s, makes a spelling distinction between 'ss' and 'ß' in lowercase, i.e. conversion between them is not reliable without dictionary support.</p>
      <p>Re. Arabic and other decomposition:</p>
      <p>Microsoft Word provides an option to differentially colour diacritic signs. This is based on identification of the signs as 'marks' in the font GDEF table. In order that this feature might apply consistently to all diacritic signs, including those that are part of precomposed combinations such as alif+hamza, these combinations are decomposed in the ccmp feature of some fonts.</p>
      <p>This functionality depends on the font a) decomposing precomposed combinations and b) correct identification of the decomposed diacritics as marks in the GDEF table. Most likely one also wants correct anchor positioning attachment for these marks in the GPOS table.</p>
      <p>Note that although, as you've discovered, it is possible to apply this Word coloured-diacritic function to Latin text, it exists primarily to support Arabic, in which differentially colouring marks has a very long history, dating back to the earliest Koran manuscripts and the early development of the script.</p>
      <p>[You may also notice that in some fonts ccmp is used to <em>contextually</em> decompose precomposed diacritic glyphs when they are followed by additional combining mark characters. This is done so that GPOS mark-to-base positioning does not need to be defined in the font for every precomposed glyph. So, for instance, a font might decompose ë when followed by ́ (combining acute) so that, instead of applying a 'mark' feature lookup of the combining mark to the precomposed diacritic, the sequence can be displayed as a 'mark' positioning of a combining diaeresis on the e, followed by a 'mkmk' positioning of the acute to the diaeresis: ë́ (which may or may not render nicely in your browser).</p>
      <p>By the way, there is a nasty bug in current versions of InDesign that causes such ccmp contextual decompositions to fail. Unfortunately, I didn't get this bug diagnosed and reported to Adobe in time for it to be fixed in the new CS6.]</p>
    html_clean: |-
