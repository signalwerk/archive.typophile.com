      <p><em>I gather from this that the Arial font does not promote this decomposition.</em></p>
      <p>Correct.</p>
      <p>Re. the alif + hamza, note that the dotted ring is inserted dynamically in whatever program you are using to peruse the ccmp lookups, as a means of illustrating that this is a sequence of letter plus combining mark. In actual text using a font that decomposes the alif + hamza character, e.g. the MS Arabic Typesetting font, the resulting display of letter plus combining mark should be indistinguishable from the precomposed form until you turn on the coloured marks function.</p>
