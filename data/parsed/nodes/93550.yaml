      <p>“ß” is a single character in the alphabet of Germany and Austria—but not Switzerland. In lowercase/mixed-cased setting it can’t be replaced by anything else. It has a distinct phonetic purpose. (Unlike the f-i ligature for example)<br>
      So no text or layout application should do a ß →  ss or ss → ß conversion. This would be as useful as doing an automatic f → ph substitution. It doesn’t make any sense and it is not included in any OpenType feature code as well.</p>
      <p>There are however reasons to make this conversion:<br>
      a) When text should be converted to ASCII, like for international travel papers, bank transactions and so on. Then European diacritical marks are then replaced (ö → oe and ß → ss).</p>
      <p>b) Uppercase writing. Traditionally there was no uppercase ß (ẞ). The unicode for it has just been assigned 4 years ago and the official orthography in Germany and Austria still uses SS as official replacement, so “groß” would become “GROSS”. Applications might have this replacement hardcoded in their text engine, so text that is transformed automatically to uppercase writing will have this transformation applied automatically. When you use an uppercase-only font, the slot for the ß character will therefore likely have a SS in it.<br>
      You can find some more articles on the confusion due to the missing capital ß here in my blog: <a href="http://opentype.info/blog/tag/capital-sharp-s/" title="http://opentype.info/blog/tag/capital-sharp-s/">http://opentype.info/blog/tag/capital-sharp-s/</a></p>
