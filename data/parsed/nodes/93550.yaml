      <p>Belloc, </p>
      <p>With the huge difference in the way fonts are handled in different applications, it would be best, I think, when designing a typeface, to not do things like code the ß as a ligature of ss. Even if it was language dependent, you can't count on it working correctly in all software, in all operating systems or assume that all users have the correct language chosen when they use the font.</p>
      <p>Not to mention that you would be changing people's expectations when they switch fonts (there's enough confusion among users already).</p>
