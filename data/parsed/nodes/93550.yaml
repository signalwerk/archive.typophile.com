      <p>MSWord prior to Word 2010 does not support OpenType ligatures at all; however, the replacement method I described above will work with any versin.</p>
      <p>What you're trying is completely dependent on the font. For the decomposition to work automatically, the eszett would have to be defined as a ligature. Just looking at some of the OpenType fonts  provided with  Microsoft Windows, such as Segoe UI, they do NOT define it as a ligature, just as a selectable character.</p>
