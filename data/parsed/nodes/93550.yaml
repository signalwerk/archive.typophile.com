      <p>It's easier to color a glyph, than to color a particular part of a pre-composed glyph.</p>
      <p>If I ask a computer to color the dieresis of an "ӓ" to red, question occurs as there is no enough information about which two of the 4 paths in a "ӓ" correspond to the dieresis.</p>
      <p>However, with the decomposition feature, "ӓ" is decomposed into "a" followed with a Combining Diaeresis (U+0308). This Unicode sequence should produce the same visual output, but now the computer should be able to color the dieresis easily.</p>
