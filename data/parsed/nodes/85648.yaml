    <p>Hi,</p>
    <p>This is my first font. Created from a 'grid'. I wanted to create a font where you can connect all the letters with each other. It didn't really became that but I continued working on it anyway. </p>
    <p>The 'grid' is build from circles divided in four pieces. I added circles until I could make all letterforms. Vertical strokes where added but no horizontal strokes because this would removed the 'flow' from the font. (For the capitals I did add horizontal strokes but used as many curved forms as I could. This all resulted in the 'grid' (second image) witch I used to build all the letters from.</p>
    <p>This is the result, any tips, feedback is really appreciated.<br>
    Download available under the post.</p>
    <p>Cheers Heyman</p>
    <p><img src="http://www.heymansmulders.nl/typophile/Hallo2.png"><br>
    <img src="http://www.heymansmulders.nl/typophile/Hello.png"><br>
    <img src="http://www.heymansmulders.nl/typophile/hallo3.png"></p>
    <p>Download TTF font Hallo <a href="http://www.heymansmulders.nl/typophile/Hallo.ttf" rel="nofollow">Click Here</a></p>
