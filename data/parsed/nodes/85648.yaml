      <p>Heyman,</p>
      <p>Nice work! However I do think that when a font is made from such a rigid geometric system, it loses some of the personality characteristics that would otherwise really help it stand out.</p>
      <p>I'd recommend exploring at least 1-2 more treatments and infuse those in, especially in the awkward shapes that Bendy pointed out. Be brave! Leave the grid, or better yet, find another piece of the design vocabulary that still somehow fits with the grid you've created, and conveniently solves the awkward moments.</p>
      <p>Your font will be better off for it.</p>
