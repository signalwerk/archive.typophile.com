  html: |-
    <p>I'm looking for some typophile's advice on some beautiful flared typeface. I really enjoy Aviano Flare (<a class="freelinking external" href="http://www.myfonts.com/fonts/insigne/aviano-flare/" rel="nofollow">http://www.myfonts.com/fonts/insigne/aviano-flare/</a>) but I can't seem to find any similar typefaces that spark the same emotional feel as Aviano. </p>
    <p>Any suggestions are greatly appreciated as I've been searching for a few days now. Thanks in advance!</p>
