    <p>i am made a Unicode English Arabic (Arabic, Urdu, Farsi, Pushtu and Sindhi) multilingual base font on FC5.6. I assigned glyphs with proper standard Unicode value according Arabic, Arabic extended, Arabic presentation form A &amp; B. but when i install this font in windows xp and work in MS OFFICE 2003 only Isolated Characters of Arabic can be typed. initial, medial and final character cannot be typed in MS WORD. I gave the font Open Type feature in this font Fina, med, isolate and initial, mark to base, mark to mark, case-sensitive &amp; fraction features by MSVOLT. In the MSVOLT Proofing Test is correct but in Win XP font does not work (only isolated forms work/can be typed).</p>
