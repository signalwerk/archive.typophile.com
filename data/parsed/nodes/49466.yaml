      <p>Perhaps you can find this internationally acclaimed book:</p>
      <p>Judith Schalansky<br>
      Fraktur mon Amour</p>
      <p>zweite überarbeitete und erweiterte Auflage<br>
      Text deutsch | englisch<br>
      728 Seiten mit 333 kompletten Frakturzeichensätzen<br>
      schwarz und Tagesleuchtfarbe Pink<br>
      Format 12,45 x 20 cm<br>
      Flexcover aus schwarzem Kunstleder mit Siebdruck und dreiseitigem Farbschnitt, zwei farbigen Lesebändchen. Mit einer CD für Mac und PC mit 150 Fraktur-Schriften zur freien privaten und eingeschränkten kommerziellen Nutzung<br>
      ISBN 978-3-87439-748-3</p>
      <p>It containes a CD with hundreds of fonts so you can have a look at them before buying one for commercial use.</p>
      <p>49,80 EUR</p>
