    <p>Hello all, long-time reader, first-time poster :P</p>
    <p>I'm working on a logo for a "luxury thinktank", and am moving in the direction of a blackletter monogram with the company's initials (JC). I was hoping some of you could point me in the direction of a sexy but solid blackletter J, much like the logo for the New York Times' <a href="http://www.nytimes.com/indexes/2008/09/07/style/t/" rel="nofollow">T magazine</a>.</p>
    <p>Thanks!</p>
  html_clean: |-
