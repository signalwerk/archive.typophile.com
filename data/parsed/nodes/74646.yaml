    html: <p>I'm glad I could help you out, Frans. And as both you and Kenny pointed out, I failed to mention that both the title and the text are the same typeface. The capital T is the telltale sign, and plus the lowercase g and y give it away as being Pabst Oldstyle Roman.</p>
