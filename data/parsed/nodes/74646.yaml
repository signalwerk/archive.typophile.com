    html: <p>Actually, Bernhard Modern is incorrect. This is <a class="freelinking external" href="http://www.fonthaus.com/fonts/vintagetype/pabst_oldstyle/vt10054" rel="nofollow">Pabst Oldstyle Roman</a> by Vintage Type and sold by FontHaus. Compare its letterforms, and you'll find that Pabst Oldstyle has the same antiqued letterforms as your posted example. This version of Pabst Oldstyle has slight differences from the more popular <a class="freelinking external" href="http://new.myfonts.com/fonts/lanston/ltc-pabst-oldstyle/" rel="nofollow">LTC Pabst Oldstyle</a> by Lanston. Bernhard Modern is too refined, and the letterforms aren't the same shapes. (Compare the capital R.)</p>
    html_clean: <p>Actually, Bernhard Modern is incorrect. This is <a class="freelinking external link-external" href="http://www.fonthaus.com/fonts/vintagetype/pabst_oldstyle/vt10054" rel="nofollow">Pabst Oldstyle Roman</a> by Vintage Type and sold by FontHaus. Compare its letterforms, and you'll find that Pabst Oldstyle has the same antiqued letterforms as your posted example. This version of Pabst Oldstyle has slight differences from the more popular <a class="freelinking external link-external" href="http://new.myfonts.com/fonts/lanston/ltc-pabst-oldstyle/" rel="nofollow">LTC Pabst Oldstyle</a> by Lanston. Bernhard Modern is too refined, and the letterforms aren't the same shapes. (Compare the capital R.)</p>
