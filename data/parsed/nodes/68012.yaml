      <p>I think the problem you are facing is part of a larger problem that design is not taught as part of our cultural heritage that every person should be aware of. People with ambitions to be cultured do generally learn something about music and art and literature, but not about design. The partial exception is architecture, where there is some awareness. But for object design and graphic design, the awareness is pretty near zero. </p>
      <p>But the fact is that we live in a designed world, and if we are to appreciate and improve it, we need to understand design. I think that's the starting point of change, but of course that's a more ambitious notion.</p>
