    <p>So as a publications teacher, I obviously think teaching students typography is relevant. I mean, after all, these kids will someday be the ones designing our magazine headlines and advertisements. I thought, heck, this has to be supported in our state standards for technology, right? WRONG. I found these results when I did a general search for typography:</p>
    <p>Arizona Department of Education: 0 results<br>
    Association of Career and Technical Education: 1 result<br>
    Association of Career and Technical Education in Arizona: 0 results<br>
    Electronic Journalism Academic Standards: 0 results<br>
    Audio/Visual Technology Academic Standards: 0 results</p>
    <p>Even in the class where typography SHOULD be relevant, it is not even mentioned! </p>
    <p>What do you all think? Shouldn't we be TEACHING typography to our future designers?</p>
