    html: <p>God that is a depressing story! I know this may be totally cliche, but every time I open the feature article in ESPN The Magazine, I get goosebumps. They have some amazing stuff going on there, but I wonder if the person who designs their headlines even realizes that what he/she is doing is typography. Based on what we're all saying, it's unlikely he/she had any kind of training in type, which means he/she basically just things he is doing graphic design using letters. This is so frustrating!</p>
