      <p>@Terminal Design: "Being a former industrial arts teacher, I'm sad to see that most "shop" classes have been purged from general education" My mother is a Home Economics teacher. She is 1 year away from retiring, and they are keeping her program only until then. After that, they are turning her cooking labs into a science lab and doing away with the program. So sad. </p>
      <p>@Christopher Dean:<br>
      1. What is the level of this program? (1st year undergrad, 3rd year masters…)<br>
      These are freshmen through seniors in a High School program.</p>
