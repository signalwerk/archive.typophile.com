      <p>It might require a philanthropist to step forward and buy a wing for the local museum, dedicated to Graphic Design.<br>
      AFAIK, there is no Warnock Collection at the Seattle Museum.<br>
      The Saatchi Gallery is dedicated to "real" art, not the cultural artefacts that made the Saatchi millions.<br>
      Paul Arden, the genius behind the Saatchi's best creative, did set up a gallery, but devoted to photography, not advertisements.<br>
      You do get graphic design in art galleries, but it's not commercial. So, Barbara Kruger and Richard Hamilton prints, but not his Beatles album cover.</p>
      <p>You are more likely to find design history exhibits in libraries.<br>
      <a href="http://fisher.library.utoronto.ca/resources/projects-completed" rel="nofollow">The Thomas Fisher Rare Book Library</a> in Toronto often has typographically-centred exhibitions of material from commercial culture.</p>
      <p>Posters are most at home in art galleries, for instance <a href="http://www.mfa.org/exhibitions/sub.asp?key=15&amp;subkey=2147" rel="nofollow">Victor Moscoso</a> at MFA Boston.</p>
      <p>One day I will curate an exhibition of 1990s rave flyers. That would be a party :-)<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/bonkers_5962.jpg"></div><p></p>
