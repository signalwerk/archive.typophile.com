      <p>Face it, most professional designers are terrible typographers. And they always were. With the advent of the personal computer and design applications, professional typographers were put out of business, and all of those craftspeople lost their jobs, and along with their jobs went the historical knowledge and experience to create great typography.</p>
      <p>I started my career working in a type shop setting headlines on a Typositor, and I remember getting layouts and specs from art directors and designers with the only spec on the ms. "Set to Fit" or "Make it look great, like the last job". </p>
      <p>So the fact that typographic education is in the crapper doesn't surprise me.</p>
      <p>And I'm not going to start another war here, but Bringhust is only relevant to book typography.</p>
      <p>As for a book about the nuts and bolts craft of typography, I think "Type Rules" by Ilene Strizver is excellent.</p>
