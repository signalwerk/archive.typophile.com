      <p>My professors rarely specify that essays should be set in 12 pt. double-spaced Times. If they do, I just ignore their restrictions and set my essays in Minion, or Meta Serif, or Arno, or Chaparral if I'm feeling frisky. I've only been called out once, and I casually explained that I prefer to use faces that are better-suited to text-setting, and she acquiesced.</p>
      <p>But back to the original topic...</p>
      <p>The only typography/graphic design class at my school is being cut next year because of the recession. This class is one of the reasons I'm pursuing graphic design as a career, and I recruit my newspaper design staff directly from that class. The class is offered as an elective through the humanities school, which is cutting all courses that aren't tied to a major. We do not have a design department, and the visual arts department sure as hell isn't going to pick it up. Now, Rice isn't exactly training future graphic designers, but I do think that part of a liberal arts education is exposing yourself to a wide variety of disciplines. I guess I should be glad that a type course even existed in the first place and that I was able to take it before it was cut, but it's still disappointing.</p>
