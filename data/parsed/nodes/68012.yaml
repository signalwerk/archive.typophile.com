      <p>Typography does not get the attention that it deserves for a few reasons:</p>
      <p>•Academic turf battles keep it in the design departments and out of the rest. If you get really lucky the book arts and/or printmaking department are on good terms with the graphic design teachers, but chances are that they’ve never met. I’m not dumping on art or design, this is just the nature of academia.</p>
      <p>•Many people see designers as skilled tradesmen who aren’t practicing an especially useful skills. Plumbers, mechanics, and electricians get more respect. </p>
      <p>•Honestly, even crap typography done in MS Word still gets the point across, even if it does look like shit. </p>
      <p>•Most people who should know about type will end up working with editors and designers who can worry about it for them.</p>
