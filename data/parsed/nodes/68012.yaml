      <p>I have a feeling that with high school kids you are going to first need to raise awareness of the challenge of good design, and what it is. You can do this by having them design eg posters, fliers, stationary--anything they are actually like to have done, or want to do for practical purposes as a student. Then you can critique them, with "before" and "after" examples. The book Looking Good in Print has nice 'before' and 'after' stuff showing amateur mistakes. </p>
      <p>Once kids are "into it" they will then be open to more formal study.</p>
