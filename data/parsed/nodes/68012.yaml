      <p>I would recommend that beside teaching simply typography, it would behoove you to also teach the history of graphic design. Then your student would understand a wider range of important works and styles, the evolution of printing and design technologies. I am confused by how you separate typography from graphic design.</p>
      <p>I mean, of course the term graphic design is a more recent development-courtesy of Dwiggins in the 1920s. I think that rather than teach high school students mostly from one or two practitioners or authors, teaching them the history of typography is paramount for them to be well-rounded designers of the future or least get them excited about it so perhaps they make it into college. I think you should definitely educate them about the differing opinions about type, especially in the regard to Aesthetics, function, and how these opinions relate to styles and eras of typography and design. </p>
      <p>I think of typography as a continuum, driven by the evolutions and changes in taste, training, and technology. The history of printing and typography that I got in high school was limited to only technology developments, not styles, manifestos, canonical works, commercial art history, design criticism. All of which are possible to share with your students to make them truly better designers. I think you should teach them the rules, the history of the rules, then let them find their own way to use them, to develop their own methodologies for typography.</p>
