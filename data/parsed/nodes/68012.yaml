      15-18</p>
      <p>3. How many are they?<br>
      120+</p>
      <p>4. What is their general educational background?<br>
      For most of them, this is their first exposure to any type of digital design. I use InDesign and Photoshop, but have to spend about 6 weeks just 'teaching' the programs. I use teaching loosely because I believe in an exploratory pedagogy that allows them to learn by using the programs, not by sitting through lectures.</p>
