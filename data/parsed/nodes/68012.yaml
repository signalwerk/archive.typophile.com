      <p>Socrates died many years ago but his method of engaging a student is a dialogue and asking them questions which systematically get the student to arrive at the answer out of his own mouth worked well for me in my teaching days years ago.<br>
      BTW I met Willi Kunz years ago while I was in graduate school. He was teaching undergraduates and had a good method of dialogue in his critiques. I highly recommend both of his books--also Emil Ruder's "Typography".<br>
      I also echo James M on Bringhurst, he does not demonstrate an understanding of advertising typography. His book is a nice style manual like "Strunk and White" but won't make you a typographer who uses type well, it will just makes you a typographer who sets type well. "Strunk and White" won't make you a good writer either, it will just keep the editors from getting on your case.</p>
    html_clean: |-
