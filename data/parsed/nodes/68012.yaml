      <p>I have found that in higher-level undergraduate courses (especially if class sizes are small) instructors tend not to care, and some actually prefer typographically-sound work. The problem is that by this time it might be too late for the student: first year course instructors have already soured the milk and students move on to upper levels scarcely aware that there is more freedom to be had.</p>
      <p>Sadly, very often it's a situation that neither the student nor the instructor really cares to be a part of the process: "We pretend to teach them and they pretend to learn" has become the reality of the student-teacher relationship in many academic institutions. The Top 20% of will always nurture these relationships, but it doesn't seem to be enough to stem the disappointment on both sides of the lectern.</p>
      <p>E.B. White's works (not just the little handbook he wrote with Strunk) should be required reading: One Man's Meat, Second Tree from the Corner, The Points of My Compass.</p>
