      <p>Jennie, are you familiar with Elements of Typographic Style, by Robert Bringhurst? Great book. </p>
      <p>A lot of courses apparently use <a class="freelinking external" href="http://www.designwritingresearch.org/index.php?s=bookstore" rel="nofollow">Thinking with Type</a> as a text. Ellen Lupton I see has a new book on design generally. I don't know either, but they have been well spoken of. </p>
      <p>On the heritage of design, Bringhurst will give you some of the history on typographic design and type design. The recent movies by Gary Hustwitt, Helvetica--which gives a history of graphic design over the past 50 years, and Objectified--which does the same for Object design, are very good. </p>
      <p>Just as there is a history of design and technique and materials in Architecture, there is the same in graphic and object design.</p>
