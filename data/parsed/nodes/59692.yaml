      <p>So, what if the font(s) that are to be machined are used to make moulds for polymer castings, which are then sold.</p>
      <p>It would be possible to replicate the characteristics of wood with a plastic without too much difficulty. Alternatively, real wood could be pressed into a steel die, as was once done with mass produced furniture to mimic ornate carved decorations. </p>
      <p>When I used to run a CNC router, I could set up several jobs on it &amp; then go do something else for a while. There is an economy of scale of sorts to be had here, where if the set up is carefully planned ahead of time, it should be possible to cut down on the cost of machining significantly. </p>
      <p>-=®=-</p>
