      <p>HD foam comes in weights up to 30lbs, which is supposedly hard enough to turn a golf ball. Works great on a CNC router table. Downside is that it is porous. Sealing it is going to be a problem. CNC routers are also very useful of carving hardwoods. Sand blasting will also work on these materials. </p>
      <p>In any case, due to the limitations of blasting and CNC routing, your letters are not going to be 12pt.</p>
