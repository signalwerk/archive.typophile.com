      <p>Yes, of course it would be possible to produce Nyloprint cliches (polymer ones). We own one of these machines to produce cliches up to approx. DIN A4.</p>
      <p>And we already thought about a plastic, like - but of course not the same - Berthold did in the 70ies:<br>
      <a href="http://www.bleisetzer.de/cms/front_content.php?idcat=58&amp;idart=848" title="http://www.bleisetzer.de/cms/front_content.php?idcat=58&amp;idart=848">http://www.bleisetzer.de/cms/front_content.php?idcat=58&amp;idart=848</a></p>
      <p>It's a fact that it prints a better quality and much more cleaner than wood types. And it is cheaper. But would it be the same? The charming of wood letter prints would have be gone, I think. And a replication would - in my opinion - be a little bit like Disney World, its not the original.</p>
      <p>But yes, I agree. It could be a way.<br>
      Now the "only and last problem" would be to find a market.<br>
      A font of 20 Cicero (90 mm) would be at around 600-700 Euro - just calculated be heart. Who would be willing and able to pay it in the letterpress scene?<br>
      We offer simple Grotesk fonts for approx. 250 Euro:<br>
      <a href="http://www.bleisetzer.de/cms/front_content.php?idcat=69&amp;rubrik=Holzlettern&amp;unterrubrik=&amp;maxday_in=19990716&amp;article_id=1929" title="http://www.bleisetzer.de/cms/front_content.php?idcat=69&amp;rubrik=Holzlettern&amp;unterrubrik=&amp;maxday_in=19990716&amp;article_id=1929">http://www.bleisetzer.de/cms/front_content.php?idcat=69&amp;rubrik=Holzlette...</a></p>
      <p>and sometimes we have to wait a year or so, until its sold.<br>
      I am sure, to develop this kind of production, we could get help from the Museum Of Work in Hamburg, Germany. So it would not be too expensive.<br>
      And I am sure its possible without problems, to find a font developer, who is interested to see his font produced in our way.</p>
      <p>And - last but not least - it would make a lot of fun, right?!</p>
      <p>Georg<br>
      _______________________________________________<br>
      „Ich bin ein Preuße, kennt Ihr meine Farben...“</p>
    html_clean: |-
      <p>Yes, of course it would be possible to produce Nyloprint cliches (polymer ones). We own one of these machines to produce cliches up to approx. DIN A4.</p>
      <p>And we already thought about a plastic, like - but of course not the same - Berthold did in the 70ies:<br>
      <a href="http://www.bleisetzer.de/cms/front_content.php?idcat=58&amp;idart=848" title="http://www.bleisetzer.de/cms/front_content.php?idcat=58&amp;idart=848" class="link-external">http://www.bleisetzer.de/cms/front_content.php?idcat=58&amp;idart=848</a></p>
      <p>It's a fact that it prints a better quality and much more cleaner than wood types. And it is cheaper. But would it be the same? The charming of wood letter prints would have be gone, I think. And a replication would - in my opinion - be a little bit like Disney World, its not the original.</p>
      <p>But yes, I agree. It could be a way.<br>
      Now the "only and last problem" would be to find a market.<br>
      A font of 20 Cicero (90 mm) would be at around 600-700 Euro - just calculated be heart. Who would be willing and able to pay it in the letterpress scene?<br>
      We offer simple Grotesk fonts for approx. 250 Euro:<br>
      <a href="http://www.bleisetzer.de/cms/front_content.php?idcat=69&amp;rubrik=Holzlettern&amp;unterrubrik=&amp;maxday_in=19990716&amp;article_id=1929" title="http://www.bleisetzer.de/cms/front_content.php?idcat=69&amp;rubrik=Holzlettern&amp;unterrubrik=&amp;maxday_in=19990716&amp;article_id=1929" class="link-external">http://www.bleisetzer.de/cms/front_content.php?idcat=69&amp;rubrik=Holzlette...</a></p>
      <p>and sometimes we have to wait a year or so, until its sold.<br>
      I am sure, to develop this kind of production, we could get help from the Museum Of Work in Hamburg, Germany. So it would not be too expensive.<br>
      And I am sure its possible without problems, to find a font developer, who is interested to see his font produced in our way.</p>
      <p>And - last but not least - it would make a lot of fun, right?!</p>
      <p>Georg<br>
      _______________________________________________<br>
      „Ich bin ein Preuße, kennt Ihr meine Farben...“</p>
