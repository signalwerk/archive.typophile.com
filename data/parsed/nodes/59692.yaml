      <p>Yes, that was exactly the point where we stopped our internal discussion about producing wood letters with from new digital fonts. I guess, it would not be difficult to find a font designer who is interested to give his okay to build up his font in wood letters. But if there is no chance to sell it, so it will be economically (may be just to finance the costs) it makes no sense. </p>
      <p>By the way: its the same with Ludlow matrizes. From technical side we are able to produce new matrizes from whatever digital font. But who would (and could) accept the price?</p>
