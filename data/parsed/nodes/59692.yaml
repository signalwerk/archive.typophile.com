    html: <p>Sandblasted wood signs are surprisingly easy to make as well as visually interesting. The materials are expensive, but the clients want it. However the soft wood often used for signs (clear heart redwood, or HD urethane foam) is not really suitable for print use.</p>
    html_clean: <p>Sandblasted wood signs are surprisingly easy to make as well as visually interesting. The materials are expensive, but the clients want it. However the soft wood often used for signs (clear heart redwood, or HD urethane foam) is not really suitable for print use.</p>
