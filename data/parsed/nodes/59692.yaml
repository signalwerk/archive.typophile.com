    html: |-
      <p>The original wood letters in the past in Germany were produced out of pear (Birne).</p>
      <p>How deep? Good question.<br>
      I guess as larger the types are, as deeper it has to be.<br>
      It will be printed in letterpress. Imagine a paper where a P shall be printed to. If it is, let's say, 20 Cicero (90 mm) large, there is a risk that the paper flapps to the bottom of the P and gets into contact with the wood material. If this gets contact to the rollers, too, it does not work. - So... anything between 1,5 mm (48 p size) and 2,5 mm (20 Cicero)?</p>
      <p>The Museum für Arbeit (Museum of Work) in Hamburg, Germany, ist testing this technique since years and offer workshops.</p>
      <p>Georg<br>
      _______________________________________________<br>
      „Ich bin ein Preuße, kennt Ihr meine Farben...“</p>
