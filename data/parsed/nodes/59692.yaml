      <p>Ah.. and I know a technic guy in Bremen, north of Germany, who is working on this problem and testing a lot. He bought a CNC-program and machine. He told me, its not the problem to produce these letters, but an enormous economic problem. Because it needs up to 30 min. to produce a letter. So, if you produce a font (which includes more than only one characterset, but two of it as a minimum)), you have to calculate a real high price for it. And there are not enough buyers...</p>
