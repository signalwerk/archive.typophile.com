    <p>Hi everyone!  </p>
    <p>I am new to this, I just signed up today, because I am searching for the fontface that is featured on Martha Stewart’s new magazine called BLUEPRINT.  I really want to find this font or one similiar to it, to use on my wedding announcement.  Does anyone have any suggestions?  I am not really a font expert, I just saw this type treatment and fell in love with it, and I think it would be perfect my a wedding announcement.</p>
    <p>I would appreciate if you had any suggestions for a similiar font, or any other typeface that would be great on a wedding announcement!</p>
    <p>THANK YOU!</p>
    <p>brice</p>
