  html: "<p><a class=\"freelinking external\" href=\"http://www.bloomberg.com/\" rel=\"nofollow\">http://www.bloomberg.com/</a> has been using this combination for a while: Proxima for headlines, Akzidenz for text. What do you think of this combination? Also , why do they switch to Arial+Helvetica in the company menu? If you're paying for webfonts, which make Bloomberg stand out against more traditional competitors, why not use them.</p>"
