      <p><cite>Basically, I want to know what companies and designers look for in a student’s portfolio. And, what do you look for in a person.</cite></p>
      <p>From my experiences interviewing to be an intern employers want <em>relevant</em> creativity and effort. By relevant creativity, I mean that they look for a portfolio of work in line with work they want their firm to produce. For example, when I took my retro-modernist stuff to a firm where everything is hip and current and wildly creative, I got some weird looks and no callback. When I took that portfolio to a firm that uses vast amounts of negative space and grotesque sans in much of their work, I got the job. If you have a big portfolio with a variety of work, you can show different stuff to different employers and leave out irrelevant work. </p>
      <p>My advice is to either look for an internship in a field you care about or want to learn about or to look for something at a large multidisciplinary firm. Before you interview, be ready to explain to them why you want to work there as opposed to the thousands of other hot internships in New York.</p>
      <p>Last, ignore people who tell you to have a big box full of boards and stuff to show off at interviews. It will just get out of order or something will get damaged or you’ll have to hold up three boards with two hands and then need to point at something. I had some really disastrous interviews last semester when I had a big mixed portfolio, and next time it’s all going into a nice book format.</p>
