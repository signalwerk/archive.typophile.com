    <p>Hello all...</p>
    <p>I just joined Typophile today... I was bit of a lurker before.  I have a few questions about student placement/internships (mainly in the NYC area).  </p>
    <p>Basically, I want to know what companies and designers look for in a student's portfolio.  And, what do you look for in a person? I know each place and person will be different, but what are key things that you look for in hiring someone for a short work placement?  Also, any other advice would be great because I need it!</p>
    <p>thanks</p>
