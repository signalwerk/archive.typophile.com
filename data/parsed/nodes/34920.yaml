      <p>kowchow,</p>
      <p>I use to be in New York and every summer I'd hire one intern. (Truth is, I would do it do discourage people from going into typography.) The portfolios they brought were never very memorable. Every now and then there would be one original piece, but mostly it was school projects and done by direction, not love.</p>
      <p>When interviewing each time for this one person, the personality and motivational force was what was so important. I didn't want one more person there because they needed an internship -- I wanted someone there that really loved what they were doing and had the desire to continue in that field - even though they were constantly reminded they were becoming dinosaurs.</p>
      <p>I've stayed in touch with a few of the interns - not many, since I've left the city. One thing, I did pick people that loved type. One of them is now a literary agent and another a designer for a book publisher.</p>
      <p>Of those I interviewed and didn't hire, I wonder if they stayed in this field... my mind says, "NO WAY."</p>
      <p>Good luck, you are just starting out on your journey, and there are many difficult turns in the road ahead.</p>
