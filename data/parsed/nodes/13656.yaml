    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Organizations" class="freelinking" rel="nofollow">Organizations</a> : Type Directors Club</strong></p>
    <p>The Type Directors Club is an international typography oganization based in <a href="/wiki/New%20York%20City" class="freelinking" rel="nofollow">New York City</a>.</p>
    <p>The TDC hosts two design <a href="/wiki/competitions" class="freelinking" rel="nofollow">competitions</a> annually. One is a typographic design competition (good use of type) and the other is type design competition (the design of the font itself).</p>
    <p>TDC members are invited to the clubs' presentations, which feature leading professionals in all areas of typography and design, and receive a complementary copy of the forthcoming edition of Typography, the annual of the Type Directors Club, published since 1980.</p>
    <p>All members will also receive copies of TDC <a href="/wiki/Letterspace" class="freelinking" rel="nofollow">Letterspace</a>, the club newsletter, and will benefit from reduced hanging fees in the annual TDC Competition. Other benefits include reduced member registration fees for TDC <a href="/wiki/conferences" class="freelinking" rel="nofollow">conferences</a> as well as valuable discounts on many typeface font products, design <a href="/wiki/magazines" class="freelinking" rel="nofollow">magazines</a>, and <a href="/wiki/books" class="freelinking" rel="nofollow">books</a>.</p>
    <p><a href="http://www.tdc.org/" title="http://www.tdc.org/">http://www.tdc.org/</a></p>
