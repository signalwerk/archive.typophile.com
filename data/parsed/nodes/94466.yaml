  html: |-
    <p>I'm looking for a good serif for a project with a late 19th century look to it (Alternate Gothic and Clarendon bold are also involved). </p>
    <p>I think I'd like to use something like Brunel (<a href="http://www.christianschwartz.com/brunel.shtml" title="http://www.christianschwartz.com/brunel.shtml">http://www.christianschwartz.com/brunel.shtml</a>) or Benton Modern Display (<a href="http://www.fontbureau.com/fonts/BentonModernDisplay/" title="http://www.fontbureau.com/fonts/BentonModernDisplay/">http://www.fontbureau.com/fonts/BentonModernDisplay/</a>). </p>
    <p>The former seems to be in limited release and the latter could work but I'd like to know what other similar fonts are out there. I tried to search for information on "English Modern" (Which is what the designer says Brunel is) but I can't find anything. </p>
    <p>I know the moderns like Bodoni, Century and Modern No. 20 but I don't think they're right for this. </p>
    <p>What do you think?</p>
