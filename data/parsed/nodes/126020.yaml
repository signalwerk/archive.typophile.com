  html: |-
    <p><em>“First of all: I know I'm not in a good section, however the Release section does not work at this moment. Sorry about that. Thanks.”</em><br>
    – – –<br>
    Goosebreak is a project that took several years to emerge. After using a few syllabic fonts in my projects, I wanted to create typeface with a strong personality like its Harfang Pro that served as the basis for the design. This family is designed for all Canadian Aboriginal languages and adds to the few fonts available for these languages. It’s available in 12 fonts that are suitable for both editorial writing and advertising.</p>
    <p>“I named this font, <strong>Goosebreak</strong>. This name refers to the Spring goose-hunting season, in Cree, <cite>“nituwaaschenaanuu,”</cite> which aboriginal communities of Northern Quebec attach great importance to.” 	Goosebreak is <a href="http://www.andresimard.ca/en">here</a></p>
