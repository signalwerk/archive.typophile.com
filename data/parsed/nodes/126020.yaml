    html: <p>I quite like this. The flare of the lines helps the terminals hold their ground while lending grace to the strokes. And it makes me so, so happy to see someone investing quality design on Canadian Aboriginal languages, which so often get short shrift. Thank you for working on this and sharing it with us, André.</p>
