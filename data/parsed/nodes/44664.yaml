  html: |-
    <p>Hello.</p>
    <p>I am just about to release a font through a large font supplier and they have sent me their standard EULA. They have been very helpful but I just thought I would have a quick check as I don't know much about the subject and also feel a little snowed under by the amount of information out there!</p>
    <p>Should I use the font suppliers EULA?</p>
    <p>or</p>
    <p>Should I try to create my own EULA?</p>
