      <p>Hi Joe,</p>
      <p>I think this is a long discussion. By using the serch engine above you can find many topics about EULAs here in Typophile Forums. </p>
      <p>I particulary use the MyFont's standard EULA and I never had any problem.</p>
      <p>I think this is a matter of 'how do you want people using your fonts'. If you find anything that you do not agree or that you think it could be a little different in any standard EULA, I encourage you to modify that points before licensing your fonts.</p>
      <p>Cheers,</p>
      <p>Ricardo Esteves Gomes<br>
      <a href="http://www.outrasfontes.com" title="http://www.outrasfontes.com">http://www.outrasfontes.com</a></p>
