    html: |-
      <p>I can see one more problem:<br>
      If you increase the size of some glyphs (letters), then you will have to increase the size of the em, which increases the line-spacing. So lines without any Thai letters will look very widely separated.</p>
      <p>Otherwise, it should be pretty simple.</p>
      <p>Once you have permission from the owner of the font (the designer or publisher) —- alternatively use an open-source font, get a font-editing program. I would suggest FontForge (<a href="http://fontforge.sf.net" title="http://fontforge.sf.net">http://fontforge.sf.net</a>) if you’re using Linux or Mac (some people here don’t like it, but this is an easy enough job, and I’m a FontForge fan anyway). Using FontForge on windows is a bit more difficult.</p>
      <p>If you choose FontForge:</p>
      <p>Start FontForge. Open the font you want to edit. Select the glyphs you want to resize. Choose Element-&gt;Transformations-&gt;Transform... Set the origin to “Glyph Origin”. In the drop-down box, change “Move” to “Scale Uniformly”, and adjust the number to, say, 200%. Click OK.</p>
      <p>Choose Element-&gt;Font Info-&gt;General. Adjust the “Em Size” by the same factor as you scaled the glyphs (if you chose 200%, double the em size, etc.). Click OK.</p>
      <p>Choose Generate-&gt;Generate Fonts, change things as you see fit, and click Save.</p>
      <p>I hope that helps.</p>
