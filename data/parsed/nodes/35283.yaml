      <p>The TTF does not contain multiple sizes. The “1000 x 1000” is not a number of pixels, but of “em units” which do not have a fixed size. When you produce text at a certain size, it resizes the letters in the font to be the right size.</p>
      <p>You *could* make a font where the Roman and Thai appear at different sizes, but you would need permission from the designer/publisher of the font, and all your users would need to download and install the font.</p>
