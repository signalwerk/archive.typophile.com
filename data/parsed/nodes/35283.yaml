    html: |-
      <p>Being allowed to use the font (and even distribute it) does NOT necessarily mean you are allowed to edit it. When you got the font, you should have got a licence with it (if you didn’t, it’s probably pirated in the first place).</p>
      <p>But there are open source Thai fonts. These allow you to use, distribute and modify freely (they may or may not require you to pass on these rights on to the people you give/sell the font to). The Thai Linux Working Group and NECTEC has made several fonts (apparently of good quality) under the GPL (open source; you have to distribute modifications under the same licence). You can get them at<br>
      <a href="http://www.ctan.org/tex-archive/fonts/thai/thaifonts-scalable/nectec/" title="http://www.ctan.org/tex-archive/fonts/thai/thaifonts-scalable/nectec/">http://www.ctan.org/tex-archive/fonts/thai/thaifonts-scalable/nectec/</a> and <a href="http://www.ctan.org/tex-archive/fonts/thai/thaifonts-scalable/tlwg/" title="http://www.ctan.org/tex-archive/fonts/thai/thaifonts-scalable/tlwg/">http://www.ctan.org/tex-archive/fonts/thai/thaifonts-scalable/tlwg/</a> (these sites offer “.sfd” files, which can only be opened in FontForge).</p>
      <p>Yes, the difficulties of Thai fonts affect type designers too, albeit in a different way. However, you should not be affected, as the font you choose should already have this done (if it is of decent quality).</p>
