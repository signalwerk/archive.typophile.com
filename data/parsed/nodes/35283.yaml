    <p>Hello<br>
    I’m a regular poster on another board where we study Thai language.<br>
    There is a problem for new learners in being able to display the<br>
    Thai script in a larger size.<br>
    <a href="http://www.thailandqa.com/forum/showthread.php?t=15033" title="http://www.thailandqa.com/forum/showthread.php?t=15033">http://www.thailandqa.com/forum/showthread.php?t=15033</a><br>
    Firefox has a work around for this, but for whatever reasons not all posters<br>
    are or are willing to use Firefox.<br>
    There are many options for adjusting the view both within windows and IE, but<br>
    none of these including personalized CSS (tools/internet options/accesibility)<br>
    are quite whats needed.<br>
    Posters on the forum YES can choose to alter the size of the script posted.<br>
    But not all learners are at the same level. And learners cetrainly don’t want to be<br>
    restricted to posts made larger for them.<br>
    Posts allso often contain both English and Thai and only the Thai needs to be enlarged.</p>
    <p>So I’m wondering... Is it possible within designing a font, to pre-determine it’s display size to be considerably larger? I’m wondering if that is even a value that can<br>
    be controled by designing a custom font?</p>
    <p>Your insights appreciated.<br>
    Rick</p>
