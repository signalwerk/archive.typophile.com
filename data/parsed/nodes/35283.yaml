      <p><em>Is it possible within designing a font, to pre-determine it’s display size to be considerably larger? I’m wondering if that is even a value that can be controled by designing a custom font?</em></p>
      <p>Well... I’m not sure it works exactly that way. In font creation programs, the letters are drawn within a grid that is 1000 x 1000 units, and when you are ready to output the font files you decide which point sizes you want. But you can still make the font any size you want once you have set some text in a graphics or layout program...</p>
