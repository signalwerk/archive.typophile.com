    <p>Hola!</p>
    <p>Mi nombre es Sebastián Salazar, tengo 19 años y estudió Diseño Gráfico en la ORT de Montevideo, Uruguay.</p>
    <p>Estoy creando una tipografía gótica bastarda para un taller de tipografía virtual dirigido por Cesar Puertas y coordinado por Vicente Lamónaca.</p>
    <p>No tengo demasiada experiencia en la creación de fuentes así que deseaba recibir opiniones de gente más experiente que yo en el tema. Muchas gracias por su tiempo....</p>
    <p>*<br>
    Hi!</p>
    <p>My name is Sebastián Salazar, i´m 19 years old and i´m studing Graphic Design in the ORT University in Montevideo, Uruguay.</p>
    <p>I´m creating a gothic tiphography for a workshop of virtual tiphography directed by Cesar Puertas and coordinated by Vicente Lamónaca.</p>
    <p>I´m not much experienced in the creation of fonts, so I wanted to recieve opinions from people more experienced than I am. Thanks very much for your time...</p>
