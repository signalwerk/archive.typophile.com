    html: |-
      <p>I would not include the URL in the logo for the simple reason of size. Once this logo is used small that URL will look more like a smudge. </p>
      <p>They typeface used for “The” and the arabesques work together, but I don’t think they work with the rigidity of Caslon Openface. I do like the slight alteration you made in the o. </p>
      <p>The word “The” is crammed into that space too.</p>
