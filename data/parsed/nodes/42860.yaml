    <p>I’m working on a redesign of a logo for The Scrapbook Manor. It is an old Victorian manor house, turned B&amp;B for scrapbookers. She wants embellishments, but not behind the logo. She wants a Victorian feel, but not too fancy. I feel it may be too simple . . . please help!</p>
