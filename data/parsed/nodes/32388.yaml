      <p>The carved or cut-out look is distinctive and has a nice, agreeable feeling about it. To me the tail of the g looks drawn backwards.  </p>
      <p>Overall it needs more consistency and polish to really work together as an alphabet. </p>
      <p>You need to test it in words extensively to see what works on this. </p>
      <p>On the versions, if you give them different names, 1, 2, 3, or a, b, c, then they should install ok and keep the old version. There may be a better way to do this, but that works.</p>
