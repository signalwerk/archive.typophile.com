    <p>Hello, my name is Joshua and I am a student.  This is my first type attempt at designing a typeface.  </p>
    <p>I would really appreciate any comments on what is working and what's not.  </p>
    <p>Also, to test the font I have been generating the font file in Fontographer, importing into Font explorer to activate and test in Illustrator.  Does anyone have a better way of testing the font?  Every time I update I have to delete the old file or rename the new one to see the updated version. </p>
    <p>Thank you,</p>
    <p>J</p>
