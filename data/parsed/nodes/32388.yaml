      <p>Your face is pretty nice. I like your y &amp; k. the distict un flipped p &amp; q are nice too even if the square looking holes or counters worry me slightly. The work reminds me Of Rudolph Koch woodcut blackletter </p>
      <p>&amp; this: <a href="http://www.itcfonts.com/Fonts/Detail.htm?pid=204549" title="http://www.itcfonts.com/Fonts/Detail.htm?pid=204549">http://www.itcfonts.com/Fonts/Detail.htm?pid=204549</a></p>
      <p>In some cases you are letting the 'rules' that are helping you build your style &amp; the letters get in the way of more ideal forms. the s &amp; a look that way to me. The f seems to need the most help. Do you see what I mean? Congradulations on a very good 1st draft!</p>
