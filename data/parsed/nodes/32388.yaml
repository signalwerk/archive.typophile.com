      <p>I agree with your comment about the square looking holes and counters Big E. I also noticed a trend of inside left edges were kept perpendicular and very straight, where the inside right edge was broken up or curved. I'd suggest trying keep that trend going with all your letters. Adding a slight curve to the holes and counters, even on one side would make them appear thought-about, currently they look as if you weren't quite sure what you wanted to do. </p>
      <p>I do like the look. It has a calligraphic/nib quality while maintaining the solid ridged forms of a sans-serif. </p>
      <p>Are you going to try and expand the weights and add an italicized version? What's name do you have in mind for it?</p>
