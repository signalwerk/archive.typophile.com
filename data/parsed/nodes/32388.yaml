      <p><cite>Does anyone have a better way of testing the font?</cite></p>
      <p>I believe the smoothest way of testing fonts is to generate the fonts in the directory of InDesigns own Font folder. When doing this you don’t have to do anything special for the fonts to work – as soon as a new font is in this folder – it gets updated directly in InDesign. Without having to restart anything or go via some font handling application.</p>
