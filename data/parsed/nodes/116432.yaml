    html: <p>The IBM Electronic Selectric Composer  was introduced in 1975 and was able to produce very nice text for the time. It had a number of fonts and one was a nice sans, as I remember, that looked good with Transfer-Letter Helvetica heads. Some of those Composer type faces have pictures on the web somewhere.</p>
