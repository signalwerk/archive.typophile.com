    html: |-
      <p>Good idea Victor. We are fortunate that Luc Devroye has a page on IBM Selectric and Selectric II Type Fonts <a href="http://luc.devroye.org/fonts-44934.html" title="http://luc.devroye.org/fonts-44934.html">http://luc.devroye.org/fonts-44934.html</a> There were quite a few more, even including an excellent simplified version of Engravers Old English. But the most likely possible candidates for this image are mentioned in Luc Devroye's page, i.e.: _Adjutant_, _Advocate_, _Delegate_, _Bookface72_, _Delegate_ [no image, but a specimen I have seen looks similar to Prestige but seems to have a higher x-height and a more stylish design], _Elite72_, _Orator_, _Pica72_,  _Prestigeelite_, and  _Presigepica72_. Unfortunately, most are not digitized, and those digitized are likely to have been revised from the original monospace letter forms to proportional ones with a wider _m_ and _w_ etc.<br>
      Should try and compile a list of the digital versions.<br>
      For example, Prestige is Alix by Matthew Butterick for Font Bureau. <a href="http://www.fontbureau.com/fonts/AlixFB/" title="http://www.fontbureau.com/fonts/AlixFB/">http://www.fontbureau.com/fonts/AlixFB/</a> This might work for your image.<br>
      Don</p>
