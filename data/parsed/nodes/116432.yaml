    html: |-
      <p>What Bob said.<br>
      Given the date, it could have been done using an IBM Selectric typewriter, which had its own proprietary fonts that were similar but not identical to "real" fonts. In the era before personal computers, low-budget alternative publications often used the IBM Selectric because it was a cheap alternative to commercial typesetting. The headline at the top of the page was clearly produced using a typewriter, which is why I suspect the Selectric for the text that is too small to identify.</p>
