    <p>Hi everyone, <br> <br>I'm new here, but I love these forums <br>and have already learned many things <br>about type that I didn't know before. <br> <br>I was wondering if anyone had any <br>suggestions about books or <br>resources that are ESSENTIAL <br>for a young designer looking <br>to learn more about typography. <br> <br>So far, I've been told: <br>Robert Bringhurst- The Elements <br>of Typographic Style <br> <br>and: <br> <br>Erik Spiekermann- Stop Stealing <br>Sheep &amp; find out how type works</p>
