      <p>charles and rs:</p>
      <p>I find Scala's colour to be very even (that is, not too dark), and I think this is something of an advantage. I understand that there is (or was) a problem with spindly, anemic type. A lot of designers addressed this problem quite well, notably from Underware and OurType. </p>
      <p>The problem with all this rich, dark type, is that it can look somewhat jarring on paper. The type can appear too strong, at least in true 1200x1200 dpi, for example. I find that Scala (and Yoga as well) are a little more sedate on the page without losing their meatiness. Now Luc Devroye of Textism has opined that digital Dante has survived the translation to digital from metal. If this is true, then by comparison Scala is not only designed *for* the digital age, but is a fine example of the characteristics of form that this kind of type is expected to exhibit in this context. Dante is noticeably lighter than Scala at true 1200 dpi.</p>
      <p>Now I understand that a lot of this is a matter of opinion and personal taste, and that these judgments also depend on the medium being used, but a complaint I have with some of that highly-regarded conspicuously dark type in the market (to be used for long tracts of text) is that they tend to scream at the reader. Some of them are just too dark.</p>
