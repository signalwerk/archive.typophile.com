      <p>Mr. Szabo:</p>
      <p>I took what I though enough pains to indicate I was talking about printing with an offset press. To say the typeface is too dark, based on an *unmentioned* viewing of toner-based printing, is more than a bit misleading.</p>
      <p>I'd note that as of 2012, when more than 500 copies of a book are to be printed, using an offset press is still the cheaper method. That's a fact.</p>
      <p>Not fact but personal opinion, whenever I see anything printed with xerography, high praise from me would be "not bad, considering." In other words, I've never seen type well represented by toner.</p>
      <p>Another thing you need to investigate is <cite> resolution</cite> The 1200 dpi resolution you tout is likely the capability of the laser to image the belt. It is an advertising number, that is, it's true, but not terrible meaningful in terms of a final printed piece of work. </p>
      <p>System (total) resolution is what counts to to a viewer/user. Mathematically, System resolution is 1/R1 + 1/R2 + 1/R 3  + ... + 1/Rn = 1/Rt. For your own understanding, plug in some numbers and see how quickly total resolution drops when just one or two items have low resolution -- such as the paper that takes the ink.</p>
      <p>As far as 1200 dip lasers go, when I initially fit the letters of a typeface, including kerning, I use both the screen and a laser printout. But I am aware that when I have a couple books printed, I'll have to go back and make adjustments, because (1200 dpi) laser output does not give an accurate enough  rendering. This for text use, by the way.</p>
      <p>So if laser (toner) output is your thing, have at it. But please make sure that point is clear in your posts, there are some of us who discount laser printouts entirely.</p>
      <p>Edit:</p>
      <p>I should have mentioned that the weight of a font as seen on laser output is quite different than from offset printing. So too the contrast (fine versus thin strokes). As has already been pointed out, so too is the color ...</p>
