    <p>Good day, everyone.</p>
    <p>I've always been quite impressed by Scala Serif. It's dead-easy to make a paragraph hang together nicely with this typeface. Even colour, not too dark and not too light. Extremely readable. </p>
    <p>Xavier Dupré's FF Yoga Serif seems to be Fontshop's "successor" type system to Scala. This is not to suggest that Yoga is somehow a replacement for Scala, but my takeaway from the marketing is the impression that Yoga is the "Scala for our time." </p>
    <p>What I'm also noticing is how similar the two fonts are. There *are* some differences, certainly. However I find that I could substitute Yoga for Scala, at least at sizes between 9-12 point, and still conform to my original reasons for using Scala. </p>
    <p>By "similarity" I'm not implying that Yoga is a slightly modified facsimile of Scala, but rather, that both Majoor and Dupré seemed to have pulled ideas from the same sources, and to remarkable effect. </p>
    <p>I invite your comments.</p>
