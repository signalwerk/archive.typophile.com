      <p><cite>Scala is very light</cite></p>
      <p>Martin Majoor drew Scala when the typesetting-printing workflow was repro-negative-plate. If you look at a book printed using that workflow (circa 1995) and compare it to a later book printed using a direct to plate workflow, you see that the DTP printed type has lost about 2/1000 of weight. </p>
      <p>So, embolding using 1 unit in FontLab (2 in Fontographer) restores what Majoor "saw" when he cut the font. Worth doing. I think the man is a genius. For me, the fonts are not dated, it is simply that the printing workflow changed. Personal taste, I suppose, but I much prefer Scala to Yoga</p>
      <p>Of course, without permission from FontFont, such embolding is not allowed under the license. Luckily for me, due to a sort of historical accident, I have permission. There is another way in an applications program like InDesign that lets you get at the stroke weight of characters. I've not tried increasing the stroke in InDesign for Scala but if you can get a value that works, it would of course be legal.</p>
      <p>It is a shame the publisher didn't re-issue the fonts when the technology changed -- or issue a new book weight...</p>
