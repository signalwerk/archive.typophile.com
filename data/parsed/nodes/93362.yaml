      <p>charles:</p>
      <p>Thank you for such a detailed response. That bit of education makes all the difference to me. So what we're talking about is really the limitation of the medium. </p>
      <p>"So if laser (toner) output is your thing, have at it. But please make sure that point is clear in your posts, there are some of us who discount laser printouts entirely."</p>
      <p>I will certainly keep this in mind. In retrospect I'm surprised I didn't mention it. It seems the obvious thing to have done, on my part. In any case, having thought about your remarks, I should only render judgments within the parameters of the medium being discussed - in this case, laser/toner - and even then, my judgments should be tempered by the actual reality of using that medium, since laser/toner might not be the best way to do justice to a typeface. </p>
      <p>Thank you again. </p>
      <p>Christian</p>
