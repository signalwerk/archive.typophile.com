      <p>Thanks!</p>
      <p>“Optical letter spacing for new printing systems” (1976) - Right? </p>
      <p>Unfortunately he died in 1995. He does have a son who works in stone too.</p>
      <p>Also, I found this snippet from one of his students:</p>
      <p>“I use a brush. In David Kindersley’s workshop we didn’t use brushes but drew our letters on the material with a hard pencil. But that was because we didn’t know then how Roman and Greek inscriptions were laid out. It was only much later that I discovered the historical basis for the feeling I had about the use of brush rather than pen. </p>
      <p>Then, quite by chance, I came across a book written by a man called Edward Catich, The Origin of the Serif. Catich was a well respected American sign writer who had gone to Italy to research incised Roman letters. His research showed that all those precise and immaculately cut inscriptions had been laid out with a brush using single strokes. The book just blew my mind away. I had never been easy with a pen, but that was the way Kindersley’s workshop had taught me to work. I was still drawing everything out. When I worked it was Kindersley’s voice that I heard, ‘My Master’s Voice’. But all the same, I could see that my letter shapes were tight – that I was ‘obeying orders’ rather than finding my own way. I knew I had to find a freedom in my work if it was to develop. It was Catich’s book which showed me the way. Nevertheless that realisation was terrifying. I knew that Chinese calligraphers, who work with the brush, begin their training at the age of seven! I bought every kind of ink, brush and paper and started practising. I would use light water colour and turn the paper over and over again to save on the cos, but I still ended up with enough lettered paper to be able to wallpaper the whole house if I had wanted to! For two years of my life every spare moment went into this practice. I had to find out for myself how it was done – there was no one being taught this time. One day I woke up and knew I had learned enough to be able to use the technique in my work.”</p>
      <p><a href="http://www.art-outside.com/art-outside/article.php?ID=246" title="http://www.art-outside.com/art-outside/article.php?ID=246">http://www.art-outside.com/art-outside/article.php?ID=246</a></p>
      <p>It makes me want to go look at the Catich book...</p>
