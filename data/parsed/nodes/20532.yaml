      <p>Eben,</p>
      <p>I just attended a presentation by calligrapher Carl Rohrs, and one of his interests is the sort of context-specific alterations to letterforms that happen with hand-lettering and calligraphy. He doesn’t focus a lot on text, or on type design, because his business is signage and display graphics, but he would probably be excited to discuss your idea, and probably more excited to find and share examples of these alterations. Should I point him your way? I think you could say there is a display parallel of the Notan we’ve been discussing; letterers and calligraphers do arrange things for compositional balance and harmony, which is relevant.</p>
