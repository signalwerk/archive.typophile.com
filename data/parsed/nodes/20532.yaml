      <p>One person you should <cite>definitely</cite> get in touch with is Andre Gurtler. His book* alone pretty much establishes his prowess in “theoretical calligraphy”, while his fonts prove that he’s not a slave to chirography - so he strikes a balance that would probably be very useful to you. Unfortunately, my email address for him no longer seems to work.</p>
      <p>* For reference only, not necessarily a recommended purchasing channel:<br>
      <a href="http://www.amazon.com/gp/product/3721203208/ref=sr_11_1/104-0842604-0595904?%5Fencoding=UTF8" title="http://www.amazon.com/gp/product/3721203208/ref=sr_11_1/104-0842604-0595904?%5Fencoding=UTF8">http://www.amazon.com/gp/product/3721203208/ref=sr_11_1/104-0842604-0595...</a></p>
      <p>I can think of some others, but among the living most of those who appear to be interested in calligraphy theory are in fact merely desiring to formalize the theory of <cite>conventional</cite> calligraphy, so they would be just as likely to hold you back as motivate you.</p>
      <p>hhp</p>
