      <p>I am interested in letter shape alterations that are made because of inter-letter interactions of two, three or more letters. These might occur either consciously/deliberately; especially in common words like ‘the’; or as a semiconscious reflexive kind of aesthetic choice as a calligrapher writes. My interest in this kind of alteration of letter-forms comes out of some older typophile threads having to do with ideas about ‘bouma*’ and ‘notan’ and type. When the idea of notan came up it was in the context of making better type for immersive reading (not calligraphy) by being aware of notan - the white and the black shapes - not just the black. At the time it struck me that this kind of awareness would have to be very important to European language calligraphers and probably could have an imapct on good typography as well now that scripting is available in open type. I already knew it was important to Asian language calligraphers especially since they have to make significant alteration to elemental forms to make a unified chinese characters or Japanese ‘Kanji’. In Gerrit Noordzji’s book ‘The Stroke’ he talks about getting the need to achieve white/black balance a as well. Of course the tasks are different in some significant ways but the concern with notan is present in both kinds of calligraphy.</p>
      <p>But it isn’t so much the broad idea of b/w balance or notan that I want to explore; it’s specifically the ways in which a European language calligrapher might modify letter forms and spacing to achieve good that notan; especially for longer running texts. And while some options for achieving this effect overlap to a certain extent between typography and calligraphy (for instance - ligatures) the set of options for getting good notan is different and perhaps bigger for calligraphers.</p>
      <p>However, because in general calligraphers have been made to work in a more decorative and expressive context rather than in an immersive text context since metal type took over the job of long texts it might seem that it’s an academic who has spent time analyzing old manuscripts who could help me. But I have a hope that this idea is incomplete and that I might also find find some calligraphers who have noticed this process of letter alteration &amp; spacing for notan in their work and who are interested in discussing it.</p>
      <p>* ’bouma’ being the overall shape &amp; impression created by a whole word vs the individual letter shapes - look up threads here for a more complete idea.</p>
