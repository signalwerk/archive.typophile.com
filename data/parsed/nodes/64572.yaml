    <p>Greetings,</p>
    <p>I have observed an odd behavior with a font. In the attached InDesign CS4 screenshot, selected in the Glyphs panel is the glyph I'm trying to enter. Selected in the text is the combination of glyphs that results. The font is Rachana, a free (GPL) TrueType font for the Malayalam script. The character in question is an akhand, a ligature of three characters: 0D15 + 0D4D + 200D. The latter (200D) is the control joiner character, and all other akhands that use it have the same problem. But no other akhand does.</p>
    <p>So, how do I make the correct glyph appear? Any ideas?</p>
    <p>Leo</p>
