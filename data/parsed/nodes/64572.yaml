    html: |-
      <p>I believe you can get InDesign to use the actual glyph by utilizing its GID (Glyph ID). This is a bit of a hack, but might accomplish what you want for your limited situation.</p>
      <p>I believe you can only do this via an InDesign Tagged Text document. It will be helpful if you are already familiar with InDD Tagged Text and its syntax. If not, you might research a little to familiarize yourself.</p>
      <p>Then try this:</p>
      <p>First, in the Glyph palette, hover over your desired glyph until the info box appears and then make note of the GID #.</p>
      <p>Then, select your text and use File &gt; Export... to export as Adobe InDesign Tagged Text format.</p>
      <p>Open the resulting text document in a text editor. Where you want your glyph to appear place this code: </p>
      <p><code>&lt;pSG:##&gt;&lt;0xFFFD&gt;&lt;pSG:&gt;</code>  &nbsp;(where <code>##</code> is the GID number of your desired glyph).</p>
      <p>Then reimport the text back into your InDesign document. You  may need to fiddle with the import options to make sure it reads your tagged text correctly. (This is where being familiar with InDD Tagged Text can help you troubleshoot.)</p>
      <p>This will probably be easiest to manage if you just export the single paragraph that contains your problematic glyph. Then reimport into a separate text frame and copy and paste back into your main text.</p>
      <p>Because this references the specific glyph order, your text will only display reliably with your specific font and won't necessarily translate to any other.</p>
      <p>HTH.</p>
