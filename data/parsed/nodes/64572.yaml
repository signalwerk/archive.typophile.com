      <p>Thanks, André!</p>
      <p>But InDesign appears to support the "akhn" tag well enough with other akhands, at least in the TrueType Rachana. I have tried the OpenType version, and discovered that ALL akhands have this problem in OpenType. Odd.</p>
      <p>But perhaps, as you suggest, I may embed the glyph elsewhere--not necessarily in another font, but in the private area of the same font, as a standalone character not tagged with "akhn." Could anyone suggest a cheap, lightweight tool to accomplish this? I don't want to shell out several hundred dollars only to fix a single character that appears exactly twice, in two instances of the same word, in my document.</p>
      <p>Leo</p>
