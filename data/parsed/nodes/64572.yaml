    html: |-
      <p>I've found that InDesign won't allow you to insert all characters from scripts which it doesn't support. The problem is essentially that it doesn't actually insert that ligature when you select it from the glyph palette, but rather the sequence of base characters from which it is composed. However, in cases where the font relies on shaping features which InDesign doesn't support, you never end up with the intended result.</p>
      <p>I haven't ever found a way around this short of duplicating the desired character within the font such that InDesign doesn't see it as an Indic (in this particular case) character and thus just treats it as a simple glyph. Of course then your document isn't going to play well with others.</p>
      <p>André</p>
