    html: <p>Although technically this isn’t a “typeface” (this is an alphabet which was specifically produced for making carplates, and as such hasn’t got an equivalent in other media), it strongly resembles DIN 1451 Mitteschrift. For an updated and expanded version of the DIN alphabet see <a href="/wiki/FontFont" class="wiki">FontFont</a>’s FF DIN.</p>
