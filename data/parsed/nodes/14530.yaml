    <p>First, I'm not sure if this is the correct subcategory of the forums for my request, but here goes: I'm interested employing Avant Garde for a side project. Since this would only be a masthead, I'm drawing it vector, which is no problem. Although there are many out there who'll disagree with the decision to use this oft misused font, but, like I said, I'm concerned with accuracy, for accuracy's sake, in specific regard to the ligatures. Any help is greatly appreciated.</p>
