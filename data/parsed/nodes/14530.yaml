      <p>Norbert,<br>
      I'd love to see some relevant ligatures from your resource! 'Traction' is the masthead for a progressive bicycling (tricks) magazine, the audience of which is an eclectic group. Generally young impressionalbe males, but I'm hoping to instill a higher sense of design awareness. Concentrating on style and unity and less on type of bike or difference. (BMX, Mountain Bike, Courier, Wheelie King, Whatever) Basically a reflection in print of what I (want to) see happening right now. But, selling ad space is another experiment that'll happen in October at the annual bike industry trade show...</p>
