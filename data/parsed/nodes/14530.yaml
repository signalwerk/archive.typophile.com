      <p>Not sure what your question is - and this probably belongs in the Design forum. Personal opinion: the TR ligature is fine, but the TI is problematic since Avant Garde doesn't have serifs - your serif in the "I" feels forced. I like the bottom one better, the C is more interesting.</p>
      <p>It is readable and I like the use of ligatures for that name TRACTION.</p>
