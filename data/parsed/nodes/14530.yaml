      <p>I've moved this thread because I think it needs critiquing not ID'ing. This is fun to see someone creating their own ligatures. I personally love Avant Garde and the wacky alternates. Anyone that doesn't can jump in a lake.</p>
      <p>Just like spice, a little goes a long way. I think the TR lig works, but I wonder if you could do a version only using the CT lig? The TI lig isn't working at all. I have a hunch you might be best off just using the TR lig. </p>
      <p>Nice.</p>
