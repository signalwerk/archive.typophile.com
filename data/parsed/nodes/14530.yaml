      <p>Links, no.<br>
      Images, si.</p>
      <p>I have, and I think ChrisL does too, a 10 lb. coffee table sized book with the early ITC typeface specimens.</p>
      <p>There are a whole slew of uppercase ligatures that were designed. When ITC released typefaces to licensed font manufacturers, each manufacturer developed fonts using their standard complement. Special characters, swash and alternate characters would be offered on another font... IF they were released at all.</p>
