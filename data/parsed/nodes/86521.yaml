    <p><img src="https://s3.amazonaws.com/dandd/e0d799d438b47116be59536d5b007e41c24a6e58.jpg"></p>
    <p>I am currently trying to draw an E to match this T (for a top-secret logotype). The bodies of the letter forms are based on Engravers Boldface  but I have been changing the serifs and adding a thick crossbar at the top. The thick crossbar is part of the design concept. So, what I can't figure out is how that thickness should be interpreted in the middle and lower arms of the E.</p>
    <p>I would love some advice.<br>
    Sorry for being a novice.</p>
    <p><img src="https://s3.amazonaws.com/dandd/8afdbac818f0ba67ac95911e3614b93de5fd261d.gif" width="200px">I thought adding this reference might help illustrate how I've been fooling with the thickness of the horizontal strokes.<br>
    <img src="https://s3.amazonaws.com/dandd/90a4e215792e5c0edb2f039609978bf76619695f.png"> The serifs are inspired by what's going on here in Commercial Type's Giorgio.</p>
  html_clean: |-
