      <p>Not sure if you're still checking this thread, but I've posted an amended E below with a couple of minor tweaks. Hope you don't mind me posting the image, describing my suggested changes was getting very confusing! </p>
      <p>Essentially I've shortened the serifs on both the upper and lower horizontal strokes, and also shortened the length of the upper horizontal stroke, so that its serif appears to sit slightly within the serif on the lower horizontal stroke. Hope that's clear! I've placed my tweaked E on top of your original one so you can, hopefully, see what's changed. If you take a close look at the Giorgio E you posted you'll see that its upper horizontal stroke does the same thing, but it's very subtle.</p>
      <p>I made these changes pretty quickly, so if you feel they're worth doing then you might want to take a bit more time over them than I did. Hope that helps.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/e0d799d438b47116be59536d5b007e41c24a6e58_6568.jpg"></div><p></p>
