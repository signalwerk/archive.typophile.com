    html: <p>Hey Alex. The Giorgio E is a good reference point for what you're trying to do. You'll want to take note of the relationship between the stroke width of the serifs and the overall height of the letter within the context of the stem, crossbar, and arms. At the height you're drawing it, the serifs don't appear fine at all. Thin them out some. Experiment with thinner arms (and a thinner crossbar on the T). For further guidance, study the shape made by the negative space where the inner serifs of the E interact. Let us see how it goes.</p>
