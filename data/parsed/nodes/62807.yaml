      <p>I thought it was a really fun flick. Are you referring to the "rules"? The type treatment is interesting because it’s more reminiscent of something you might see in a TV ad than a film. Typography in film is typically an afterthought, which might explain frequent abuse of faces like Arial. Speaking of which, it was bugging me throughout my entire viewing of District 9, an otherwise wonderful film.</p>
