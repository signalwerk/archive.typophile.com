    html: '<p>This deserves it’s own thread for sure James. I’ve seen two  <br>approaches out there: the big agency model and the studio  <br>model. <br><br>The big agencies buy the big libraries (<a href="http://www.fontshop.com/virtual/index.cfm?area=SF_fonts&amp;subarea=SF_fonts_library" target="_blank">like these</a>) <br>and supplement as needed with single fonts from various  <br>places. <br><br>The studio model is more like Kyle described: <br><br>a) If at all possible, pass the cost on to your client. This  <br>means padding the project expenses when you write the  <br>estimate, if you foresee having to buy type. This model is  <br>standard for photography and illustration and can be for  <br>fonts, especially if it’s more of a specialty face that you will  <br>have a hard time reusing in your studio. <br><br>b) If you can’t justify passing the costs onto your client,  <br>invest in faces you will be able to use&nbsp;later.</p>'
