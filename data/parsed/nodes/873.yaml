    html: <p>Well billing, haha, thats a tricky subject. <br><br>In my case it is subjective. <br><br>With purchasing something like a type face, with some clients we would mark it up by 10-20%, with some clients that price might need to be burried within something else. Sometimes we might not even mark up for a type face, if it is something that we are basically bying to use once or twice on some client work and then keep for our own use later. I think realisticly you have to take things like this on a case by case basis. <br><br>I know some that would be ﬁne with purchasing fonts. I know other thats would say, “What th hell? $360 for a font? Why didnt you just use something you had” and would then begin thinking that you are trying to cheat them in some way. <br><br>Like I said with us, we have decided that billing for things of this nature needs to be delt with on a client by client basis. <br>Were not the biggest ﬁrm, but we do have a good a good amount of people, and a modest sized client&nbsp;base.</p>
