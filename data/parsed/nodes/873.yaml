  html: '<p>I ﬁnd myself trying to rethink an Corp <span class="caps">ID</span> i did some time back. <br><br>Currently the type system consists of Trajan as titles, and the palatino family to take care of the rest, they/we are wanting to move to a more mordern appearence, from a more classical one. <br><br>My question to you folk is this: <br><br>The logo is in place (for now) and is basically a reversed out trajan. (see here <a href="http://www.sharingway.com" target="_blank">http://www.sharingway.com</a>) <br>I am looking for a good san-serif face to pair with trajan. it has to have professional appeal, but needs to be a touch friendly, just not to cold. It also needs a fairly complete family (ie. small caps, italics, and several weights, ligatures are always sexy too) <br><br>So, this said, any suggestions? <br><br>Thanks.</p>'
  html_clean: '<p>I ﬁnd myself trying to rethink an Corp <span class="caps">ID</span> i did some time back. <br><br>Currently the type system consists of Trajan as titles, and the palatino family to take care of the rest, they/we are wanting to move to a more mordern appearence, from a more classical one. <br><br>My question to you folk is this: <br><br>The logo is in place (for now) and is basically a reversed out trajan. (see here <a href="http://www.sharingway.com" target="_blank" class="link-external">http://www.sharingway.com</a>) <br>I am looking for a good san-serif face to pair with trajan. it has to have professional appeal, but needs to be a touch friendly, just not to cold. It also needs a fairly complete family (ie. small caps, italics, and several weights, ligatures are always sexy too) <br><br>So, this said, any suggestions? <br><br>Thanks.</p>'
