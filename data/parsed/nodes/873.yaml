    html: <p>Kyle, are you looking for a face for use in text, or a secondary typeface to use with your Trajan logotype?  <br> <br>We just did a system that uses Trajan in the logotype, with Meta as the secondary typeface. I thought it was an odd pairing at first, but it works. I think it might work as your text face - it is fairly complete (with small gaps and lining numerals, etc.) <br> <br>I know Meta was SO used for a while, but it's "trend" status seems to have subsided a bit of late. You might just take a look.</p>
