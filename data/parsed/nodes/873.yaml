    html: <p>&gt;I know Meta was SO used for a while, but &gt;it's "trend" status seems to have subsided a bit &gt;of late. You might just take a look. <br> <br>Same here. After years of not using Meta, I was verrry close to using it again on a job some days ago and found it quite pleasing, but still decided on FFInfo, as the job needed a bit of a more static and computer-like feel while still maintaining legibility. Still, you don't see Meta too often anymore, and the font itself is good work. We still could use a MetaLight, imo, though. And of course, full OpenType Treatment. Makes sense with all those foreign language sets already devbeloped at MetaDesign/FontShop.  <br> <br>And James... for a small foundry, Giacomo does come with a rather painful price tag attached. The OTF made me buy it, but still... prices like these are what keeps me from buying Bliss and a batch of Lineto Fonts. Your work is outstanding, and I'm all for paying the price a speicific work is worth, but when even works by Luc(as) de Groot and Fontshop are less expensive, it makes the decision to get your fonts a bit harder. A few Euro more and I could have bought the wonderful Taz III. And over at Chester's and Rick's you get the great section at 99$... now THAT is an incentive :-D.  <br> <br>Still, Giacomo is well worth the money spent (maybe the Upgrade can be for free, though, hinthintnudgenudgewinkwink...) Would've bought Clearview as well, but my money was all spent... we're finally moving into a larger house/bureau and I'm pretty broke after buying the whole thing. </p>
