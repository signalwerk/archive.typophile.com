    <p>Good afternoon to all my type-lovers. I'm designing my wedding collateral and have here the first of many. My fiencé says she sees an F instead of an S in Sarah, so I'm hoping for suggestions on how to get a better S.</p>
    <p>I believe a more pronounced lower spine would do the trick, but it would disrupt the stress/angle of the font. Solutions and suggestions welcome.</p>
    <p>In general, Sarah is looking for something intimately elegant, vintage (yet not trendy vintage), and with bold damask whispers for the look and feel of the wedding. Suggestions are welcome!</p>
