      <p>One question I have is how you match fonts in photoshop with what you see on sites like Font Shop.  A font at 36pts in Font Shop is much larger/wider than the same font on my computer in Photoshop at 36pts.  How can I match the size?  My browser, Firefox, is set for Normal text size.  </p>
      <p>I know this is a dumb question, but sometimes I buy fonts and they aren't really the right size for what I need.  I only need a few weights now at a certain size.</p>
      <p>Thanks,</p>
      <p>Sharon</p>
