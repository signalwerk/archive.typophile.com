      <p>I am going with Titling Gothic.  However, choosing between compressed, condensed and narrow is where I get confused.  I can't determine from what I see on Font Shop or Font Bureau which one will match the text on my web page the closest.  I don't know why this is so hard for me to see but I sometimes have this problem.  The only thing I know to do is buy several weights and see which one is right. So I'm getting compressed and condensed light, compressed and condensed regular, condensed medium, condensed and normal black.  </p>
