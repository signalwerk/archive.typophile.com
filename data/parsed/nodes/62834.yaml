    html: |-
      <p>I think you've nailed the fonts. </p>
      <p>I find the hierarchy on page 2 a little confusing; your skillset needs to be more subordinate to the rest, by setting the column lower on the page or separating it, whether in a coloured block or with a line. When i first look at that page, I dont know where to look first.</p>
      <p>I like your asterisks but dont think you need brackets as they complicate the communication.</p>
      <p>Leading on the italic descriptions could tighten up and the point size could go down. I'd also keep all your work samples on the same side of the page, either left or right, not staggered, to improve the flow.</p>
      <p>Otherwise good effort and good luck</p>
