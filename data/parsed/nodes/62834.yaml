  html: |-
    <p>Hey guys, was wondering your thoughts on a résumé redesign.</p>
    <p>I'd love to hear if you think the Knockout and ITC Slimbach work well together. I chose Slimbach because I felt its narrower width worked well with Knockout, and they seemed to have similar stroke width proportions. I'd love to hear opinions on other faces that could better serve my needs and why.</p>
    <p>I'd also love to hear some of your thoughts on the hierarchy, whether there's too much leading and anything else you can imagine.</p>
    <p>Thanks!</p>
