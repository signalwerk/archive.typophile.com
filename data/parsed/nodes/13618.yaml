  html: |-
    <p>Mrs. Eaves is a great font. However I have a client who doesn’t see it that way. I am looking for an alternative with a taller x-height and possibly a bit more condensed. Mrs. Eaves has some very nice and sensitively designed letter forms like the lowercase u, m, etc. The criteria is an easy-to-read, approachable, friendly, warm, smart but non-intimidating atypical font.</p>
    <p>Fonts I have eliminated:<br>
    Atma<br>
    Baskerville (all versions)<br>
    Deepdene<br>
    Dolly<br>
    Fairplex<br>
    Goudy Old Style<br>
    Perpetua<br>
    Sherwood<br>
    Tribute</p>
    <p>Thanks.</p>
    <p>ps. This is technically reposted from the design forum. Sorry, but I'm desparate.</p>
