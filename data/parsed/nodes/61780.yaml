  html: |-
    <p>Hi, I’m working on a project for a class attempting to recreate a magazine cover. I’ve got everything figured out except for the typeface used on the cover in the magazine topics: “Fall Comfort!” “Steak Chili...” etc. (shown in attachment). </p>
    <p>I used What the Font and the closest I could come up with is one of the fonts within FF Transit, although there are differences:</p>
    <p>-the letter “k” looks different on the magazine cover, the diagonal strokes meet in a “t”<br>
    -the weight is heavier and letters more condensed than what I’m seeing in Transit<br>
    -the ends of the C are angled on the cover </p>
    <p>I may be wrong on the typeface. What do you guys think? Is it an altered version of Transit? Hopefully I am wrong and it’s a typeface within my library because I’m not paying for Transit! :)</p>
    <p>I’ve also included a screenshot of FF Transit Print Normal from Fontshop.com</p>
    <p>Thank you in advance!</p>
