  html: |-
    <p>I am feeling just bored a little.<br>
    So I ask a thing that makes me curious.<br>
    Why is the minor ‘a’ so hard to design?<br>
    Or am I the only one in the world who spends months designing and correcting<br>
    this tiny little letter in every face I do?<br>
    Or is this indeed the most difficult and therefore interesting letter form?</p>
    <p>Stefan</p>
