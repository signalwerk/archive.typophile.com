    html: <p>Whoever fashioned these metal letters was probably inspired by Sol Hess. Most of the letters follow the basic pattern of <strong>Twentieth Century</strong>, and the anomalous G takes its cues from <strong>Twentieth Century Poster</strong>. I can't find a ready reference for the release dates of these typefaces. but Hess died in 1953 at age 67.</p>
