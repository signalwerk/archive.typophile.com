  html: |-
    <p>Is there an easy way to set up column guides on each side of a spread in InDesign?</p>
    <p>Say I'm working on an 11 x 17 brochure (which will be folded in half). I've got a .5" margin, but I'd like the gutter to be 1", and each side to have 6 columns for my grid. My usual cumbersome method would be to draw a text box with six columns the width of one side of the spread, and then manually put guides at the same spot as the the columns in the text box?</p>
    <p>I feel stupid for asking this (having been working in Indesign for so long), but is there an easier way?</p>
    <p>thanks!</p>
