    html: |-
      <p>If you are working with a 11x17" paper, your procedure is already the best I know.</p>
      <p>But things could be easier if you work with a spread of two 11x8,5" pages:</p>
      <p><strong>01</strong>. Create the document using "facing pages" option enabled.</p>
      <p><strong>02</strong>. Set inside margins to achieve the central gap (in your case, they are actually the same 0.5" in order to get the final 1" gutter).</p>
      <p><strong>03</strong>. In master page, use the command Layout &gt; Create guides to set up your 6-column layout. Note the option to define guides inside margins only.</p>
      <p>These two optional controls could also help your work:</p>
      <p><strong>04</strong>. If you want to edit the spread with both pages visible, disable "Allow document pages..." option in pages panel menu and drag page 2 to be together with page 1.</p>
      <p><strong>05</strong>. Use the File &gt; Print booklet to finnish the work or make imposition in Acrobat with the excellent Quite Imposing plug-in.</p>
