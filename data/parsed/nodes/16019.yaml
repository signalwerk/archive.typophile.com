      <p>The overall concept is appealing, but I find the lower right (kids and building), elements to be far too busy. They distract from the upper left element which, I assume, is intended to be the focus of the page. Also, the composition of the kids' photos leaves something to be desired... They have the appearance of simple snapshots.<br>
      D~</p>
