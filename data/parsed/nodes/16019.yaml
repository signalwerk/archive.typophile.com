      <p>Much stronger than your previous post. I would look at moving the through song to the left to put all the copy on the purple, this might mean reducing the size slightly and possibly the leading so it can range right on the angle. On the images the borders need to be the same weight and possibly the cream colour and if you can increase the size of the two boys so it is not obvious that it is the same image (how stupid will I look if they are different images?). Unfortunately the choir looks seriously under resolution if you can't get better you might try adding a little noise.<br>
      Tim</p>
