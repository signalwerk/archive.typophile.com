      <p>Since it does appear that the children represent two halves of the same whole, have you considered moving the choir to the top triangle and having the children on opposing sides joined by the notebook in the middle? It would be as if they're looking at the choir and smiling. You'll have to raise the purple section a bit, but it would be more balanced.</p>
      <p>I like the basic design, just a simple change.</p>
