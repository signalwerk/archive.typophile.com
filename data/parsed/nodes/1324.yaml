    html: <p> Hi, <br> <br>Sorry- I could've been more helpful there couldn't I? <br> <br>Anyway, the target demographic is difficult to state. I sorta have two. I'm building a specialist directory of hotels and guesthouses. The target in terms of getting people to sign up seems to be largely women in there mid 40's with relatively traditional tastes. This is contrasted by larger hotels, which whilst being fewer in number are considerably more profitable for us. On the other hand the target audience is young mobile businessmen and tourists of all ages. <br> <br>I started out trying to get a very 1950's 'I dream of Genie', or picture postcard sort of look. Then with the mixture of targets I decided I'd prefer something that a)didn't clash with the individual businesses method of marketing themselves, and b)was appropriate for all. <br> <br>What I now want is a type design that blends into the background and doesn't interfere with anything. Something really clean and subtle. To that end I considered using arial. I know that that's a bit of a cop-out, but my feeling was that because it's everywhere on the web, it would present no presence as people of all tastes using the internet are accustomed to it by now. <br> <br>Currently there is no branding or status for the project online or offline, so I've got a clean palette from that point of view. <br> <br>Rotondo has been dropped because my boss hates it (and he's paying my salary), which I think's a shame, but never mind. <br> <br>Any suggestions, on how to fade type selection/design towards subtlety much appreciated. <br> <br>cheers. </p>
