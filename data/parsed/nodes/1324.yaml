  html: <p>Hi, <br> <br>I'm trying to educate myself as much as possible with regards to design. I've read as much as I can get my hands on with regards to typography but I don't really feel there's any replacement for experience, which I don't have. For the first time I've got full control over the design of something the company I work for is doing and I want to make a really good job of it. <br> <br>I'm trying to create a visual hierarchy for my type that isn't boring. The two major concerns I have are that a) It looks quite stylised (which doesn't bode well for the "good typography is invisible to the untrained eye" rule I keep hearing about) and b) Even though the counter spaces on the fonts I've picked seem to go well together, I'm not sure about the variations between other elements of the letters. <br> <br>I'm not hoping to do anything profound or technically impressive. I'd just rather not make any glarring errors with my first real foray into laying out type. I'm aware that the colours for the roll overs are weak and damage the readability, I just haven't come up with any alternatives yet. Obviously it'll look a lot different with lots of text, but I want to get the foundations correct before I start worrying about the rest of it. <br> <br><img src="http://www.typophile.com/forums/messages/29/1644.gif" alt="font examples"> <br> <br>I'd be interested to hear anyone/everyone's opinions/suggestions/criticisms etc. <br> <br>cheers.</p>
