    html: <p> Hi Benjie, I would like to be of some help but it is not easy as you have not told us what type of company it is you work for. What is the audience / demographics that will be seeing the work? What type of information are you trying to deliver with what type of impact. What is the current identity/brand and market positioning of the company you work for. These types of questions are much more important than what typeface to use, If you have a clear picture of the answers I asked I would say you may be ready for the creative process to begin and exploration is a good way to do this. Do not be too critical on your self at this stage. The rules you mentioned are good guidelines but not absolutes. Just look at Emigre type foundry, they did everything wrong according to the critics but they are now considered pioneers in modern type design. <br>As strange as it may sound I often qualify typeface selection for projects based on circulation, if a typeface is distributed by a major foundry or has been over used I will not use it. I personally aim for exclusivity in choosing typefaces. As for your choices of Omega and Rotondo, they may work well together but in what context? </p>
