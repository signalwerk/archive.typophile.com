    <p>I’m sure everyone is sick of doling out free advice but I could really use some help on this. I am redesigning my menu and marketing materials and I am looking for a contemporary font for use in marketing materials. Our marketing materials are understated and classic if that helps at all and I’d like to find something distinctive. </p>
    <p>Any and all suggestions would be appreciated. I consider myself skilled at putting together some reasonable layouts and copywriting but I’m not confident enough in my ability to select the best font.</p>
    <p>Thanks,</p>
    <p>Bryan</p>
