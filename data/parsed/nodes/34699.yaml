    html: |-
      <p>If it is reallyl an “upscale” cafe - then, in my opinion, Frieght is to - pedestrian (freightish a word?)</p>
      <p>Upscale should be something “classy” like a Carlton<br>
      <a href="http://www.myfonts.com/search?search%5Btext%5D=carlton" title="http://www.myfonts.com/search?search%5Btext%5D=carlton">http://www.myfonts.com/search?search%5Btext%5D=carlton</a></p>
      <p>or an Egmont<br>
      <a href="http://www.myfonts.com/search?search%5Btext%5D=egmont" title="http://www.myfonts.com/search?search%5Btext%5D=egmont">http://www.myfonts.com/search?search%5Btext%5D=egmont</a></p>
      <p>but then again, it means what kind of “upscale” — is this catering to the “in” crowd of the day? Is it catering to the money that is out there? What type of fare? What price range? Who are they trying to attract.</p>
      <p>Ah, so many questions go into play before one picks out what would best marry the “product”....</p>
      <p>P.S. If it is just for the menu - I’d try to find a serif font that had a bold and an italic counterpart. I keep redesigning menus here, because the original designers didn’t take into consideration - the 1) lighting of the restaurant and 2) the eyes of the customers.</p>
      <p>I just did an “upscale” seafood restaurant myself - they owners insisted on Caslon Antique for all their menu choices - but we gave the customers - Caslon Book for reading purposes...</p>
      <p>Good luck with the menu. There is more work involved then most are aware. Especially when you are all finished and the Chef says, “wait a minute...”</p>
      <p>P.P.S. You may want to show an example of the restaurant’s logo - because you’ll want a face that compliments... (or is that complements in this case?)</p>
