  html: |-
    <p>Gold leaf lettering makes an office door something special.<br>
    These samples are from the Millennium Centre, an old bank building in Winnipeg, Canada.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/6041958393_45d7efabe4_5089.jpg"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/6041952131_6db0938863_5690.jpg"></div><p></p>
    <p>The word "MANAGER" looks like a condensed Franklin Gothic. And the spacing between the A and G is a bit gappy, but it still has a certain appeal.</p>
    <p>The numerals on "601" look like some kind of bold Baskerville, based on that teardrop terminal on the 6.</p>
