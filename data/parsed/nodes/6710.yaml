    html: <p>Christos, <br> <br>I like the mark.  I think it works.  Don't  know your work, but I get a very rigid and simple vide from it.  Like your work is clean and sans needless embellishements. <br> <br>What is not working for me is the type treatment.  I can't read that big line of letters no matter what is bold and regular.   <br> <br>I would go with a less bitmappy treatment and us a nice humanist or geometric sans.  Have christos tsolerides be bigger than design perhaps.   <br> <br>And I don't think the size relation between the mark and type is working.  I would not try and line up the type with the 'entrance' to the mark, get them more balances out in size.  I could even see the mark going to the right of the type, almost like a book-end or period. <br> <br>Just some thoughts <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"></p>
    html_clean: <p>Christos, <br> <br>I like the mark.  I think it works.  Don't  know your work, but I get a very rigid and simple vide from it.  Like your work is clean and sans needless embellishements. <br> <br>What is not working for me is the type treatment.  I can't read that big line of letters no matter what is bold and regular.   <br> <br>I would go with a less bitmappy treatment and us a nice humanist or geometric sans.  Have christos tsolerides be bigger than design perhaps.   <br> <br>And I don't think the size relation between the mark and type is working.  I would not try and line up the type with the 'entrance' to the mark, get them more balances out in size.  I could even see the mark going to the right of the type, almost like a book-end or period. <br> <br>Just some thoughts <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"></p>
