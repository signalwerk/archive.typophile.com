    html: "<p>Just looking at this now, but I think Hrant got it right: Your work is so richly and warmly artistic that your logo should reflect that. This logo is not only frigid, but awkward - just the opposite of your fabulous poster work. Scrap it and start over is my amateur opinion.  <br> <br>By the way, it is possible for someone with great artistic 'chops' like you to do spare and clean stuff with flair - not that you have to for this logo. See the Ecco logo at louisefilli.com</p>"
