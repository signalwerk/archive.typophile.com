      <p>///</p>
    <p><strong>Hrant Papazian: A Line of Type<br>
    April 17-May 5</strong></p>
    <p>292 Gallery<br>
    Montserrat College of Art<br>
    292 Cabot Street<br>
    Beverly, MA 01915</p>
    <p>Hours: Monday-Friday 12-5pm </p>
    <p>An exposition of typeface designs, featuring strange shapes, Star<br>
    Wars and nanobiotechnology. But mostly strange shapes.</p>
    <p>Hrant Papazian is an Armenian native of Lebanon, currently living in<br>
    Los Angeles. His perspective on written communication was formed at<br>
    the crossroads of three competing visual cultures. A multimedia<br>
    designer by trade, his true love remains the black-and-white, but<br>
    colorful world of non-Latin typeface design, with commissions from<br>
    IKEA, Unitype, UCLA, Disney, the Israel Postal Authority, and<br>
    Liverpool University.</p>
    <p><a href="http://www.montserrat.edu/galleries" title="http://www.montserrat.edu/galleries">http://www.montserrat.edu/galleries</a></p>
    <p>\\\</p>
