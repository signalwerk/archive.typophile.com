      <p>I doubt that walmart will have much success reaching out to the utne reading, Prius driving segment of the population, but being a primium brand has never been their strategy. The logo is clearly a shout out to the rise of environmental consciousness in popular culture (see the rebrands of ge, philip morris/altria, and BP), and for wal-marts base of price oriented shoppers, a bit of gloss will go a long way in making them fell better about themselves for supporting a retailer whose treatment of their workers and the environment leaves little to celebrate.</p>
      <p>My guess is that the new logo has less to do with a full greenwashing of the brand, but a signal of a more general physical downsizing.  Up until now walmart has sold itself as the agricultural wholesaler for the suburban lifestyle, placing giant stores in recently developed rural areas.  As energy prices rise and the middle class moves back to more densly populated areas, walmart needs to find a way to fit in to a more urban landscape.  This logo signals that shift.</p>
      <p>I assume their plan is to put a greater focus on going after rite-aid and walgreens traditional turf of purchasing cheap properties in depressed and aging mid-century suburbs and putting in a big cube of retail/pharmacy.  So when people say the logo looks pharmaceutical, they are probably dead on.  In short, if you imagine the piece on the side of a Walmart, it definitely smacks of corporate doublespeak, but if you place the same on the side of a Walgreens, it looks a better fit.</p>
