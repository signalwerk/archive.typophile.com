      <p><cite>Why bother with a rebrand?</cite></p>
      <p>Because among non-Walmart customers, Walmart is one of the most detested brands around. Walmart’s domestic growth has been stagnating for years because Walmart stores have become persona non grata in many communities, and across America municipalities have been rewriting zoning laws to keep big box retailers like Walmart and Home Depot from setting up shop. Here in DC Walmart announced it was going to open a store in the morning, and within hours the city government was plotting ways to keep Walmart out. By the end of the day Walmart canceled plans for a store in DC. </p>
      <p>Walmart’s reliance on cheap Chinese goods to keep profits high is starting to hurt the company. Tainted pet foods and toys slathered in lead paint have made it much harder to defend that business model. Politicians and pundits blaming China for high gas prices isn’t helping. Neither is manipulating the hours worked by employees classified ”full-time” to avoid providing them with health insurance. Or discriminating against female employees. On the other side of the aisle Walmart is pissing off America’s religious extremists by adding gays to its anti-discrimination policy and making the company greener.</p>
      <p>Walmart has a huge image problem that the people running it don’t know how to fix. It’s probably not one that even can be fixed. But they appear to believe that getting their brand out of backwoods of Arkansas is a start.</p>
