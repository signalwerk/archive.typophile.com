      <p>No, Adobe's version does not have the swash alternates. That's why I posted the link to the Monotype/ITC site, fonts.com. Adobe licenses the typeface from Monotype/ITC, who recently made the swash alternates available in digital form.</p>
      <p>Cheers,</p>
      <p>T</p>
