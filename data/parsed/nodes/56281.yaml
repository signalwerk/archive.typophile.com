    html: |-
      <p>That's ITC Bookman medium or demi italic, with swash alternate characters included.<br>
      <a href="http://www.fonts.com/findfonts/detail.htm?pid=44276" title="http://www.fonts.com/findfonts/detail.htm?pid=44276">http://www.fonts.com/findfonts/detail.htm?pid=44276</a><br>
      You may require both the italic and swash italic fonts to get all the needed glyphs.</p>
      <p>Cheers,</p>
      <p>T</p>
