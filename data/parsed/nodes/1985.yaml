    html: "<p>Ahhh. Amplification of the text. Pretty subtle stuff for the average Barnes &amp; Noble browser.  <br> <br>The reason it piqued my interest: I've got a medium rare bookish jenson in the oven, arrighi in the broiler and some special sauce on the front burner. IMHO, all lovers of type need to have a wrestling match with jenson.  <br> <br>Back to the topic at hand: <br>ITC Garamond? :-) <br>I've often wondered about <a href=\"http://www.presencetypo.com/pdf/Classica.pdf\">Classica</a> (pdf) in extended text setting. <br>The <a href=\"http://www.presencetypo.com/pdf/Prestige.pdf\">Classica Prestige</a> (pdf) extension is delectible. <br> <br>Randy</p>"
