  html: <p>I’m doing the layout for a book, and since I normally work with newspaperdesign I feel like I’m suddenly a bit out of my depth, when it comes to the typography for a book. <br><br>I could really use any suggestions or hints when it comes to selecting a typeface for the text. <br><br>The book is an historical novel set in Germany during the Thirty Years War. Not some textbook on European history, but rather an adventure-story that happens to take place in an historical setting (somewhat like <span class="caps">C.S.</span> Foresters “Hornblower”). <br><br>I’ve looked at what feels like a million possible fonts, and of those I’ve checked out so far I’m leaning towards Adobe Jenson Pro. Maybe.  <br><br>Any other suggestions would be much appreciated. <br><br>Bjorn</p>
  html_clean: <p>I’m doing the layout for a book, and since I normally work with newspaperdesign I feel like I’m suddenly a bit out of my depth, when it comes to the typography for a book. <br><br>I could really use any suggestions or hints when it comes to selecting a typeface for the text. <br><br>The book is an historical novel set in Germany during the Thirty Years War. Not some textbook on European history, but rather an adventure-story that happens to take place in an historical setting (somewhat like <span class="caps">C.S.</span> Foresters “Hornblower”). <br><br>I’ve looked at what feels like a million possible fonts, and of those I’ve checked out so far I’m leaning towards Adobe Jenson Pro. Maybe.  <br><br>Any other suggestions would be much appreciated. <br><br>Bjorn</p>
