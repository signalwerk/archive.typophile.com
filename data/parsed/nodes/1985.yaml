    html: "<p>&gt; there's a whole hell of a lot I have yet to learn regarding the subtleties of typography <br> <br>To be fair, this is all very subjective, and I can't (and frankly wouldn't want to) pretend that my opinions represent some sort of benchmark (that would actually be pretty funny). Formally, Bitstream Kis is certainly \"mellower\" than Ehrhard*, but it's hard to firmly believe which you need more here. My feeling (not much more) is that you need something sharp, elegant and a touch archaic. <br> <br>* <br>Compare these two: <br><a href=\"http://www.myfonts.com/fonts/bitstream/kis/kis/testdrive.html?s=Regal&amp;p=96\" target=\"_blank\">http://www.myfonts.com/fonts/bitstream/kis/kis/testdrive.html?s=Regal&amp;p=96</a> <br><a href=\"http://www.myfonts.com/fonts/linotype/ehrhardt/mt/testdrive.html?s=Regal&amp;p=96\" target=\"_blank\">http://www.myfonts.com/fonts/linotype/ehrhardt/mt/testdrive.html?s=Regal&amp;p=96</a> <br>One important thing MyFonts won't be able to show you though is typographic <i>texture</i>. <br> <br>hhp <br></p>"
