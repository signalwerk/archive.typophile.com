    html: "<p>Jenson was the man (Aldus was a poser), and most Jensons (except those with large x-heights) are wonderful, especially for book work. But: <br>1) You want something that ampliﬁes the topic, and a Jenson seems too Italian Renaissance here. <br>2) What makes a font [nominally] good for a book is mostly technical, like proper vertical proportions — and a bunch of fonts have what it takes, so the one you choose should have a good reason to be used. What’s Jenson’s? <br><br>My ﬁrst choice would actually be something with blackletter overtones, but it’s hard to: <br>1) Find one subtle enough to really work. This is actually something on my back-burner (actually my battery of back-burners). <br>2) Get publishers to accept such a choice. <br><br>hhp <br></p>"
    html_clean: "<p>Jenson was the man (Aldus was a poser), and most Jensons (except those with large x-heights) are wonderful, especially for book work. But: <br>1) You want something that ampliﬁes the topic, and a Jenson seems too Italian Renaissance here. <br>2) What makes a font [nominally] good for a book is mostly technical, like proper vertical proportions — and a bunch of fonts have what it takes, so the one you choose should have a good reason to be used. What’s Jenson’s? <br><br>My ﬁrst choice would actually be something with blackletter overtones, but it’s hard to: <br>1) Find one subtle enough to really work. This is actually something on my back-burner (actually my battery of back-burners). <br>2) Get publishers to accept such a choice. <br><br>hhp <br></p>"
