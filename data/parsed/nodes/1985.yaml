    html: <p>I currently am trying to ﬁgure out the same problem. I have to layout a book which is a scientiﬁc/environmental study of special rocks/stones found in this country. It would be my ﬁrst book, I’ve been designing only magazines this far, so it got me wondering, how much and whether the typeface of the book must reﬂect the topic and by which means it is achievable. I understand that when typesetting novels, it’s mostly about the time and style in which they were written, but what to do when it comes to science/math/physics etc.? Is there a reading on “how to choose the right typeface for a book” topic or the only way to understand it is by collecting knowledge scraps from you&nbsp;folks?</p>
