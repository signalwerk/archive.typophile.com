    html: "<p>I'm actually not a huge stickler for historical accuracy in design. <br>The Kis stuff is indeed from the late 17th century, but mostly it just feels right*, a bit old and with that continental elegance - but there could be a recent font that's even better, maybe one of Storm's more docile designs. <br> <br>* Although some would say that's only because it's in fact from the same period/geography! For one thing, Kis's stuff is certainly Dutch-looking (I mean the style that Caslon sprung from), and that's because he went to the Netherlands (from Hungary) to study under the leading Dutch master, Voskens (who only agreed to teach him because he knew Kis would be going back home at  the end). <br> <br>&gt; Bitstream Kis <br> <br>If you look at the stuff on Myfonts* you'll see that the Bitstream cut is frankly the least suitable here...  :-( <br>It lacks the sharpness and narrowness that I think makes Ehrhard promising. Plus there's only one weight. In fact, considering all the extras of Linotype Janson (like old-style numerals), I might recommend that instead (even thought the caps are much tamed compared to Ehrhard). <br> <br>* <a href=\"http://www.myfonts.com/Search?searchtext=kis\" target=\"_blank\">http://www.myfonts.com/Search?searchtext=kis</a> <br> <br>As for the choice for display, If you go with a Kis, I'm thinking Big Caslon: <br><a href=\"http://www.myfonts.com/fonts/fontbureau/big-caslon/\" target=\"_blank\">http://www.myfonts.com/fonts/fontbureau/big-caslon/</a> <br> <br>hhp <br></p>"
    html_clean: "<p>I'm actually not a huge stickler for historical accuracy in design. <br>The Kis stuff is indeed from the late 17th century, but mostly it just feels right*, a bit old and with that continental elegance - but there could be a recent font that's even better, maybe one of Storm's more docile designs. <br> <br>* Although some would say that's only because it's in fact from the same period/geography! For one thing, Kis's stuff is certainly Dutch-looking (I mean the style that Caslon sprung from), and that's because he went to the Netherlands (from Hungary) to study under the leading Dutch master, Voskens (who only agreed to teach him because he knew Kis would be going back home at  the end). <br> <br>&gt; Bitstream Kis <br> <br>If you look at the stuff on Myfonts* you'll see that the Bitstream cut is frankly the least suitable here...  :-( <br>It lacks the sharpness and narrowness that I think makes Ehrhard promising. Plus there's only one weight. In fact, considering all the extras of Linotype Janson (like old-style numerals), I might recommend that instead (even thought the caps are much tamed compared to Ehrhard). <br> <br>* <a href=\"http://www.myfonts.com/Search?searchtext=kis\" target=\"_blank\">http://www.myfonts.com/Search?searchtext=kis</a> <br> <br>As for the choice for display, If you go with a Kis, I'm thinking Big Caslon: <br><a href=\"http://www.myfonts.com/fonts/fontbureau/big-caslon/\" target=\"_blank\">http://www.myfonts.com/fonts/fontbureau/big-caslon/</a> <br> <br>hhp <br></p>"
