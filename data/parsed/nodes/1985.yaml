    html: <p>Thanks for the help, much appreciated. <br> <br>Ehrhardt certainly looks like a possibility.  <br> <br>I kept thinking in terms of finding a font that fits with the dramatic flavor of the book (though how to find a font that says 'historical action-packed adventure' I don't know).  <br> <br>To instead use a font that fits geographically and chronologically is appealing in some way. As I understand it the style of the Ehrhardt font hails from mid-17th century Netherlands, yes? That's practically a perfect fit, so a Kis of some kind would be the way to go. <br> <br>Is the Ehrhardt particularly superior in some way, though? As it happens, my temporary employer already owns Bitstream Kis, which, to my eye, look pretty similar to Ehrhardt anyway. (Of course, buying a couple of new fonts is no obstacle at all, just wondering.) <br> <br>As for titling font, I haven't considered it yet. I figured I'd choose text font first and work from there. <br> <br>Bjorn</p>
