    html: '<p>Ahhh. Ampliﬁcation of the text. Pretty subtle stuﬀ for the average Barnes <span class="amp">&amp;</span> Noble browser.  <br><br>The reason it piqued my interest: I’ve got a medium rare bookish jenson in the oven, arrighi in the broiler and some special sauce on the front burner. <span class="caps">IMHO</span>, all lovers of type need to have a wrestling match with jenson.  <br><br>Back to the topic at hand: <br><span class="caps">ITC</span> Garamond?&nbsp;:-) <br>I’ve often wondered about <a href="http://www.presencetypo.com/pdf/Classica.pdf">Classica</a> (pdf) in extended text setting. <br>The <a href="http://www.presencetypo.com/pdf/Prestige.pdf">Classica Prestige</a> (pdf) extension is delectible. <br><br>Randy</p>'
