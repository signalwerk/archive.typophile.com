    <p>I have been trying to find out what font's are being used in the newspaper from the movie. It seems that the logo mast head is a combination of two different gothic typefaces. For Caps it is Old English Text MT and for the lower case letters it looks like Muenchner Fraktur. I can't seem to find out what the other headline fonts are. I especially would love to find out what this font is (see attached).  </p>
    <p>Here is a link to the highest quality image of the newspaper I could find.<br>
    <a href="http://www.papermag.com/uploaded_images/budapesthotleNewspaper.jpg" title="http://www.papermag.com/uploaded_images/budapesthotleNewspaper.jpg">http://www.papermag.com/uploaded_images/budapesthotleNewspaper.jpg</a></p>
