      <p>Good find Mike. BTW "fletcher" is the occupational name for an arrowsmith or seller of arrows. Dan X. Solo probably felt that he had a real find when he bought a font of type that was based on a font "from the French foundry of Beaudoire &amp; Cie". A change from all the ATF fonts of type that he would usually find on his buying trips. I have no further information on the French original other than the statement by Dan X. Solo. Of the available digital versions, I am somewhat inclined towards the quality of the version by Character {Herbert F. Van Brink}.<br>
      Don</p>
