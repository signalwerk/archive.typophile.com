      <p>Wow Thanks to everyone for the additional background info on the fonts.<br>
      Mike, That's Fletcher alright. What grabbed my attention about Fletcher is how the arrows blend seamlessly with the black letter serifs. When I saw the newspaper flash in the movie my eyes where drawn to that font. I couldn't find out why this black letter looked so unique. It is was really surprising to see that fletcher looks modular and geometric for a typeface made in 1865. Way ahead of it's time in that regard.  http://en.wikipedia.org/wiki/Fletcher_(typeface)</p>
      <p>Follow up question. I may be pushing my luck on this post but do  you know what the headline font "Will There Be War?" is in the newspaper?  <a href="http://www.papermag.com/uploaded_images/budapesthotleNewspaper.jpg" title="http://www.papermag.com/uploaded_images/budapesthotleNewspaper.jpg">http://www.papermag.com/uploaded_images/budapesthotleNewspaper.jpg</a></p>
