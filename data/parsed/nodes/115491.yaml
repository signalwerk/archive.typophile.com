    html: <p>The headline font is definitely some version of Cheltenham. Giveaway is uppercase A. The headline could be ITC Cheltenham Condensed, but the mixed case “Tanks at Frontier” is some other (older) version with lower x-height. No version on MyFonts.com seems to show “Tanks at Frontier” correctly.</p>
