      <p>Wes Anderson is noted for his quirky approach to film making and an obsession with detail. The press info cited by Fiver refers to his interest in selecting typefaces and mentions Archer, by H&amp;FJ. Wes Anderson may have chosen Arrowhead/Fletcher for the death notice as because the name fits his Archer theme -- a secret irony -- rather than its intrinsic strength as a blackletter.<br>
      Don</p>
