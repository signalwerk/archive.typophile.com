    html: |-
      <p>Based on an early 1900's typeface called, in the West anyway, Arrowhead. Digitally, see Jordan Davies <a href="http://old.myfonts.com/fonts/woodentypefonts/lettres-angulaires/" target="_blank" rel="nofollow">Lettres Angulaires Semi Bold</a>, Intellecta's <a href="http://old.myfonts.com/fonts/intellecta/gotica-moderna/" target="_blank" rel="nofollow">Gotica Modern</a> and Dan Solo's <a href="http://old.myfonts.com/fonts/solotype/fletcher/" target="_blank" rel="nofollow">Fletcher</a>. The latter appears to be the font used. Per Dan, the original was "from the French foundry of Beaudoire &amp; Cie".</p>
      <p>Edit: I wonder if the name Fletcher was a play on Arrowhead. Fletch means to add the feather to an arrow.</p>
