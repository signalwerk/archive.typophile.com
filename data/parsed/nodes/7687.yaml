    html: "<p>&gt;But drink the pisco in tiny shot glasses, it's strong stuff! :-) <br> <br>And don't be fooled by Pisco Sours: they are a lot more pisco than sour (I think it's 2-parts pisco to 1 part lemon?) <br> <br>I very much enjoyed wandering around Santiago w/o a mission or a guide book: I just walked where my feet took me, hopped on random buses &amp; subway trains. Delightful city, w/ the Cordillera as a constant, beautiful background. Re:typography  -- lots of latin exuberance, 'cept in the big shopping malls, that suffer through trying too hard to be Gringo. <br> <br>Only warning: stay up-wind of the Mapocho River! <br> <br>Jay</p>"
