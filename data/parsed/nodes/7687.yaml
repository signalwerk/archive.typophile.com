    html: <p>Koen, <br> <br>Visit Santiago, of course. And when you do, take a bus or two out to the suburbs and check out some of the huge murals painted by the people who live there. <br> <br>Also, Isla Negra, one of the homes of poet Pablo Neruda, is a must-see. That's not too far away from Santiago and if leaving from Santiago in the morning you can be back by evening. <br> <br>I also understand that Chiloe, in the southern region of the country, is a real beauty of a place. <br> <br>Enjoy plenty of wine, and of course some pisco, too. But drink the pisco in tiny shot glasses, it's strong stuff!  :-) <br> <br>Have a great trip!</p>
