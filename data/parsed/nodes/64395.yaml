  html: |-
    <p>Atm i got this code, i only need it 26 times (A to Z) and also with a lot more @all betweens it in case a 'j' is for example 100 chars away from the last 'j'.<br>
    Also i got 100 alt versions for each letter.<br>
    This would mean 26x100x100 = 260.000 rules of code..</p>
    <p>Atm the code looks like this and it works:</p>
    <p>[code]feature salt {<br>
    lookup rotate {</p>
    <p>sub A.alt2 A' by A.alt3;<br>
    sub A.alt2 @all A' by A.alt3;<br>
    sub A.alt2 @all @all A' by A.alt3;<br>
    sub A.alt2 @all @all @all A' by A.alt3;<br>
    sub A.alt2 @all @all @all @all A' by A.alt3;<br>
    sub A.alt2 @all @all @all @all @all A' by A.alt3;<br>
    sub A.alt2 @all @all @all @all @all @all A' by A.alt3;<br>
    sub A.alt2 @all @all @all @all @all @all @all A' by A.alt3;</p>
    <p>sub A.alt1 A' by A.alt2;<br>
    sub A.alt1 @all A' by A.alt2;<br>
    sub A.alt1 @all @all A' by A.alt2;<br>
    sub A.alt1 @all @all @all A' by A.alt2;<br>
    sub A.alt1 @all @all @all @all A' by A.alt2;<br>
    sub A.alt1 @all @all @all @all @all A' by A.alt2;<br>
    sub A.alt1 @all @all @all @all @all @all A' by A.alt2;<br>
    sub A.alt1 @all @all @all @all @all @all @all A' by A.alt2;</p>
    <p>sub A A' by A.alt1;<br>
    sub A @all A' by A.alt1;<br>
    sub A @all @all A' by A.alt1;<br>
    sub A @all @all @all A' by A.alt1;<br>
    sub A @all @all @all @all A' by A.alt1;<br>
    sub A @all @all @all @all @all A' by A.alt1;<br>
    sub A @all @all @all @all @all @all A' by A.alt1;<br>
    sub A @all @all @all @all @all @all @all A' by A.alt1;<br>
    sub A @all @all @all @all @all @all @all @all A' by A.alt1;</p>
    <p>sub B.alt2 B' by B.alt3;<br>
    sub B.alt2 @default4 B' by B.alt3;<br>
    sub B.alt2 @default4 @default4 B' by B.alt3;<br>
    sub B.alt2 @default4 @default4 @default4 B' by B.alt3;<br>
    sub B.alt2 @default4 @default4 @default4 @default4 B' by B.alt3;</p>
    <p>sub B.alt1 B' by B.alt2;<br>
    sub B.alt1 @default4 B' by B.alt2;<br>
    sub B.alt1 @default4 @default4 B' by B.alt2;<br>
    sub B.alt1 @default4 @default4 @default4 B' by B.alt2;<br>
    sub B.alt1 @default4 @default4 @default4 @default4 B' by B.alt2;</p>
    <p>sub B B' by B.alt1;<br>
    sub B @default4 B' by B.alt1;<br>
    sub B @default4 @default4 B' by B.alt1;<br>
    sub B @default4 @default4 @default4 B' by B.alt1;<br>
    sub B @default4 @default4 @default4 @default4 B' by B.alt1;</p>
    <p>} rotate;</p>
    <p>lookup rotate;</p>
    <p>} salt;[/code]</p>
