    html: <p>Fantastic, thanks! <br> <br>Interestingly, I'm sure I can see what seems an excessive amount of round overshoot in Ad Sancs. This is particularly noticeable on larger sizes (seen here on the u, d and c, but not the o, although that is the same size). And that's not present on the AudioMulch logo. <br> <br>To me, it's unquestionably the same typeface though, and I can't believe the AudioMulch author would have tweaked his logo, so what would account for it? Two separately digitised versions? <br> <br>And oh yes, the c is quite different on the small text, I hadn't really looked as I was expecting it to be the same ! <br> <br>I took your advice and registered, btw <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> <br> <br>Cheers, Robin</p>
