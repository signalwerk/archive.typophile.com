    <p>Hi all,</p>
    <p>Please, help me. I'm doing a book cover for a professor of mine, and i'm looking for some kind of vintage typeface to go along with it. I'm trying to simulate a vintage poster from the 20s up to 50s, as the book is about a sculptor from that time.</p>
    <p>Here are some links to some works that are similar to what I have in mind:</p>
    <p><a href="http://flickr.com/photos/karenhorton/2149982374/in/pool-vtype" title="http://flickr.com/photos/karenhorton/2149982374/in/pool-vtype">http://flickr.com/photos/karenhorton/2149982374/in/pool-vtype</a><br>
    <a href="http://flickr.com/photos/karenhorton/2149997100/in/photostream/" title="http://flickr.com/photos/karenhorton/2149997100/in/photostream/">http://flickr.com/photos/karenhorton/2149997100/in/photostream/</a><br>
    <a href="http://flickr.com/photos/apricot_x/1404181266/in/pool-vtype" title="http://flickr.com/photos/apricot_x/1404181266/in/pool-vtype">http://flickr.com/photos/apricot_x/1404181266/in/pool-vtype</a><br>
    <a href="http://flickr.com/photos/sarahbrownandpink/1082929956/in/pool-vtype" title="http://flickr.com/photos/sarahbrownandpink/1082929956/in/pool-vtype">http://flickr.com/photos/sarahbrownandpink/1082929956/in/pool-vtype</a></p>
    <p>From what I could see, people really liked to use typefaces in an ascendent slope.</p>
    <p>Please excuse my engrish!<br>
    Marco</p>
