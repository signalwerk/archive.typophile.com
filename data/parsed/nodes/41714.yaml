      <p>Are you familiar with the Gans foundry?<br>
      <a href="http://www.unostiposduros.com/pdf/gans.pdf" title="http://www.unostiposduros.com/pdf/gans.pdf">http://www.unostiposduros.com/pdf/gans.pdf</a><br>
      I don't know anything about South American foundries, so I'm making some assumptions here--that the subject of the book is South American, and that the Gans typefaces would have been popular in South America during the 20s--50s, or at least have a similar Latin personality to ones that were popular then and there.</p>
