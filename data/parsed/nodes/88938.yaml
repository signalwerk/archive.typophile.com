    html: |-
      <p>&gt;Is there a specific reason for using a different syntax? I can imagine, that web developers won’t like this that much …</p>
      <p>I think it's standard practice to align with the most recent version of a W3C working draft. FireFox implemented support quite a while ago, hence the earlier syntax. </p>
      <p>However, once the standardization process is complete there will be no need to use the prefixes (ms or moz) and browsers will be expected to support the final syntax, which will likely match IE's implementation.</p>
