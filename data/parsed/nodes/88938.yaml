    <p>News hot off <a href="http://blogs.msdn.com/b/ie/archive/2012/01/09/css-corner-using-the-whole-font.aspx" rel="nofollow">the web</a>!</p>
    <p>IE joins Firefox in supporting <a href="http://www.w3.org/TR/css3-fonts/#font-rend-props" rel="nofollow">CSS OpenType markup</a>.  </p>
    <p>Many thanks to FontShop, Monotype and The Font Bureau for producing some great demos to show off the technology. When it comes to web typography some would claim that OT support is "bigger than WOFF" :-) I know I would.</p>
    <p>Cheers, Si</p>
