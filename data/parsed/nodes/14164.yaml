    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Writing%20Systems" class="freelinking" rel="nofollow">Writing Systems</a> : <a href="/wiki/Alphabets" class="freelinking" rel="nofollow">Alphabets</a> : Cyrillic</strong></p>
    <p>The Cyrillic alphabet is an alphabet used for several East and South Slavic languages, as well as many other languages of the former Soviet Union, Asia and Eastern Europe. With the accession of Bulgaria to the European Union on January 1, 2007, Cyrillic is now the third official alphabet of the EU.</p>
    <p><strong>Russian Alphabet:</strong><br>
    АБВГДЕЁЖЗИЙКЛМНОПРСТУФХЦЧШЩЪЫЬЭЮЯ<br>
    абвгдеёжзийклмнопрстуфхцчшщъыьэюя</p>
    <p><strong>History:</strong><br>
    The <a href="/wiki/early%20Cyrillic" class="freelinking" rel="nofollow">early Cyrillic</a> alphabet, is a derivative of the <a href="/wiki/Glagolitic" class="freelinking" rel="nofollow">Glagolitic</a> alphabet, a ninth century uncial cursive usually credited to two Byzantine Greek monk brothers, <a href="/wiki/Saint%20Cyril" class="freelinking" rel="nofollow">Saint Cyril</a> and <a href="/wiki/Saint%20Methodius" class="freelinking" rel="nofollow">Saint Methodius</a>. Both of these writing systems were originally developed in order to preserve texts in Old Slavic (also Old Bulgarian or Old Church Slavonic).</p>
    <p>Although it is widely accepted that the <a href="/wiki/Glagolitic" class="freelinking" rel="nofollow">Glagolitic</a> alphabet was invented by Saints Cyril and Methodius, the origins of the early Cyrillic alphabet are still a source of much controversy. Though it is usually attributed to <a href="/wiki/Saint%20Clement%20of%20Ohrid" class="freelinking" rel="nofollow">Saint Clement of Ohrid</a>, disciple of Saint Cyril and Saint Methodius from Bulgarian Macedonia, the alphabet is more likely to have developed at the Preslav Literary School in northeastern <a href="/wiki/Bulgaria" class="freelinking" rel="nofollow">Bulgaria</a>, where the oldest Cyrillic inscriptions have been found, dating back to the 940s. This theory is supported by the fact that the Cyrillic alphabet almost completely replaced the Glagolitic in northeastern Bulgaria as early as the end of the tenth century, whereas the Ohrid Literary School—where Saint Clement worked—continued to use the Glagolitic until the twelfth century. Of course, as the disciples of St. Cyril and Methodius spread throughout the First Bulgarian Empire, it is likely that these two main scholarly centres were a part of a single tradition.</p>
    <p>Among the reasons for the replacement of the Glagolithic with the Cyrillic alphabet is the greater simplicity and ease of use of the latter and its closeness with the Greek alphabet, which had been well known in the First Bulgarian Empire.</p>
    <p>There are also other theories regarding the origins of the Cyrillic alphabet, namely that the alphabet was created by Saint Cyril and Saint Methodius themselves, or that it preceded the Glagolitic alphabet, representing a "transitional" stage between Greek and Glagolitic cursive, but these have been disproved. Although Cyril is almost certainly not the author of the Cyrillic alphabet, his contributions to the Glagolitic and hence to the Cyrillic alphabet are still recognised, as the latter is named after him.</p>
    <p>The alphabet was disseminated along with the Old Church Slavonic liturgical language, and the alphabet used for modern Church Slavonic language in Eastern Orthodox and Eastern Catholic rites still resembles early Cyrillic. However, over the following ten centuries, the Cyrillic alphabet adapted to changes in spoken language, developed regional variations to suit the features of national languages, and was subjected to academic reforms and political decrees. Today, dozens of languages in Eastern Europe and Asia are written in the Cyrillic alphabet...<a href="http://en.wikipedia.org/wiki/Cyrilic" rel="nofollow">read more</a></p>
    <p>For tips on designing Cyrillic glyphs, see <a href="/wiki/Cyrillic%20How-To" class="freelinking" rel="nofollow">Cyrillic How-To</a>.</p>
