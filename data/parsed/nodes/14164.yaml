    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/12260" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Writing Systems</a>&nbsp;: <a href="/node/12248" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Alphabets</a>&nbsp;:&nbsp;Cyrillic</strong></p>
    <p>The Cyrillic alphabet is an alphabet used for several East and South Slavic languages, as well as many other languages of the former Soviet Union, Asia and Eastern Europe. With the accession of Bulgaria to the European Union on January 1, 2007, Cyrillic is now the third official alphabet of the <span class="caps">EU</span>.</p>
    <p><strong>Russian Alphabet:</strong><br>
    <span class="caps">АБВГДЕЁЖЗИЙКЛМНОПРСТУФХЦЧШЩЪЫЬЭЮЯ</span><br>
    абвгдеёжзийклмнопрстуфхцчшщъыьэюя</p>
    <p><strong>History:</strong><br>
    The <a href="/node/add/wiki?edit%5Btitle%5D=early%20Cyrillic" title="Create node &quot;early Cyrillic&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">early Cyrillic</a> alphabet, is a derivative of the <a href="/node/add/wiki?edit%5Btitle%5D=Glagolitic" title="Create node &quot;Glagolitic&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Glagolitic</a> alphabet, a ninth century uncial cursive usually credited to two Byzantine Greek monk brothers, <a href="/node/add/wiki?edit%5Btitle%5D=Saint%20Cyril" title="Create node &quot;Saint Cyril&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Saint Cyril</a> and <a href="/node/add/wiki?edit%5Btitle%5D=Saint%20Methodius" title="Create node &quot;Saint Methodius&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Saint Methodius</a>. Both of these writing systems were originally developed in order to preserve texts in Old Slavic (also Old Bulgarian or Old Church&nbsp;Slavonic).</p>
    <p>Although it is widely accepted that the <a href="/node/add/wiki?edit%5Btitle%5D=Glagolitic" title="Create node &quot;Glagolitic&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Glagolitic</a> alphabet was invented by Saints Cyril and Methodius, the origins of the early Cyrillic alphabet are still a source of much controversy. Though it is usually attributed to <a href="/node/add/wiki?edit%5Btitle%5D=Saint%20Clement%20of%20Ohrid" title="Create node &quot;Saint Clement of Ohrid&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Saint Clement of Ohrid</a>, disciple of Saint Cyril and Saint Methodius from Bulgarian Macedonia, the alphabet is more likely to have developed at the Preslav Literary School in northeastern <a href="/node/34739" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Bulgaria</a>, where the oldest Cyrillic inscriptions have been found, dating back to the 940s. This theory is supported by the fact that the Cyrillic alphabet almost completely replaced the Glagolitic in northeastern Bulgaria as early as the end of the tenth century, whereas the Ohrid Literary School—where Saint Clement worked—continued to use the Glagolitic until the twelfth century. Of course, as the disciples of St. Cyril and Methodius spread throughout the First Bulgarian Empire, it is likely that these two main scholarly centres were a part of a single&nbsp;tradition.</p>
    <p>Among the reasons for the replacement of the Glagolithic with the Cyrillic alphabet is the greater simplicity and ease of use of the latter and its closeness with the Greek alphabet, which had been well known in the First Bulgarian&nbsp;Empire.</p>
    <p>There are also other theories regarding the origins of the Cyrillic alphabet, namely that the alphabet was created by Saint Cyril and Saint Methodius themselves, or that it preceded the Glagolitic alphabet, representing a “transitional” stage between Greek and Glagolitic cursive, but these have been disproved. Although Cyril is almost certainly not the author of the Cyrillic alphabet, his contributions to the Glagolitic and hence to the Cyrillic alphabet are still recognised, as the latter is named after&nbsp;him.</p>
    <p>The alphabet was disseminated along with the Old Church Slavonic liturgical language, and the alphabet used for modern Church Slavonic language in Eastern Orthodox and Eastern Catholic rites still resembles early Cyrillic. However, over the following ten centuries, the Cyrillic alphabet adapted to changes in spoken language, developed regional variations to suit the features of national languages, and was subjected to academic reforms and political decrees. Today, dozens of languages in Eastern Europe and Asia are written in the Cyrillic alphabet…<a href="http://en.wikipedia.org/wiki/Cyrilic">read&nbsp;more</a></p>
    <p>For tips on designing Cyrillic glyphs, see <a href="/node/14180" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Cyrillic How-To</a>.</p>
