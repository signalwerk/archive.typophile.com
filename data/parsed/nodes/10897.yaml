    html: "<p><b>To calculate the number of layout pages required to flow an article, use the following algorithm.</b> <br> <br>Note: In today's world, copy is readily available in digital format. Most major word processing software can give you a character account. (Microsoft Word: Tools/Word Count) If a character count is not available but you have a printed copy of the article, use steps 1 and 2 to estimate the total # of characters in the article: <br> <br><b>Estimating the total # of characters in original hardcopy:</b> <br> <br>1. Average the number of characters  per line by counting the characters in the longest and shortest line and dividing by 2. <br> <br>2. Multiply (the result of #1) by (the total number of printed lines in your hardcopy) to get the total # of characters in your copy. <br> <br> <br><b>Calculating the # of pages needed in your finished format:</b> <br> <br>3. Multiply (the # of characters per finished line) by (the # of lines in finished column) to get the total number of characters in your finished column. <br> <br>4. Divide (the result of #2) by (the result of #3) to get the # of columns needed in your finished format. <br> <br>5. Divide (the result of #4) by (the number of columns per page) to get the total number of text-only pages in your finished format. <br> <br>Now that you know the sheer amount of text space you'll have to account for, you can now estimate the number of pages you'll actually need to reserve after considering imagery, headlines, and overall pacing.</p>"
