  html: |-
    <p>Irma is a capital-only display typeface in 9 weights that is available in simple Sans &amp; geometric Slab. Inspired by the principles of the Arabic alphabet, Irma provides different conditional letterforms, depending on whether characters occur at the beginning, middle, or the end of the word. Letters can have four different forms (initial, medial, final and isolated). The choice of these forms is controlled by a OpenType feature (Stylistic Set 1), which allows creation of typographic patterns using the negative spaces of the letterforms.</p>
    <p><a href="http://www.typotheque.com/news/new_font_release_irma" title="http://www.typotheque.com/news/new_font_release_irma">http://www.typotheque.com/news/new_font_release_irma</a><br>
    <a href="http://www.typotheque.com/fonts/irma_slab" title="http://www.typotheque.com/fonts/irma_slab">http://www.typotheque.com/fonts/irma_slab</a><br>
    <a href="http://www.typotheque.com/fonts/irma" title="http://www.typotheque.com/fonts/irma">http://www.typotheque.com/fonts/irma</a><br>
