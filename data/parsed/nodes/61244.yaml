    html: |-
      <p>Thanks.</p>
      <p>@skolato<br>
      We are considering Cyrillic (since most of our fonts have Cyrillic support), but it is to a high priority at the moment. We'll see how will Irma do.</p>
      <p>@William Berkson<br>
      I have designed this typeface for a logo originally (<a href="http://www.steppinggrounds.com/" title="http://www.steppinggrounds.com/">http://www.steppinggrounds.com/</a>) and I was annoyed by large overshoots even in Display typefaces. Yes you need them in smaller sizes, but not having them allows creating typographic layouts impossible to make with overshoots. Just look at how the logo used on that website, it works much better without them. </p>
      <p>I was thinking of these kind of applications too (<a href="http://www.flickr.com/photos/typotheque/3871608837/" title="http://www.flickr.com/photos/typotheque/3871608837/">http://www.flickr.com/photos/typotheque/3871608837/</a>) Again, only possible if no overshoots are used.</p>
