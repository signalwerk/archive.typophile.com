      <p>The knock-out version is, er, a knock-out!</p>
      <p>Quite a few OpenType Script fonts, in the Latin alphabet, already have contextual alternates dependent on word-position, so I would say this is something that may be suggested by cursive scripts in general, not just Arabic--but developing it into negative space is a very clever invention.</p>
