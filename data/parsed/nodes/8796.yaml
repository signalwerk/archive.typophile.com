    html: "<p>I'm not a fan of D, but you've got to experiement with these things haven't you? <br> <br>A's nice, but perhaps a bit too nice. It'd be useful to know what kind of non-fiction this publication is looking to publish. I guess they'll say 'anything and everything' but they must have a direction in mind -- is the direction scientific? religious? serious and formal? loose and humorous? <br> <br>I actually really like B: it looks like the title of a 70s naturist photography book. Not that I own any 70s naturist photography books, but you (hopefully don't) know what I mean. <br> <br>Seriously, it looks like with a bit of work it could, well, work. A little spacing (between w and o, and r and d) and a slight resizing and loosening of the 400, and I think it could work. I won't promise anything though <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\"> <br> <br>C is the most coherant concept, though I actually prefer your handwritten (I presume) in your first post. If you tidied the sript up a little on that one (the R's and the tail on the f promarily) I think it could be a really nice idea.  <br> <br>The regularity of the script in C is a little mundane compared to the example in your opening post. I'll add my name to the list of admirers of that engraved face though -- it's lovely. <br> <br>jordan</p>"
    html_clean: "<p>I'm not a fan of D, but you've got to experiement with these things haven't you? <br> <br>A's nice, but perhaps a bit too nice. It'd be useful to know what kind of non-fiction this publication is looking to publish. I guess they'll say 'anything and everything' but they must have a direction in mind -- is the direction scientific? religious? serious and formal? loose and humorous? <br> <br>I actually really like B: it looks like the title of a 70s naturist photography book. Not that I own any 70s naturist photography books, but you (hopefully don't) know what I mean. <br> <br>Seriously, it looks like with a bit of work it could, well, work. A little spacing (between w and o, and r and d) and a slight resizing and loosening of the 400, and I think it could work. I won't promise anything though <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\"> <br> <br>C is the most coherant concept, though I actually prefer your handwritten (I presume) in your first post. If you tidied the sript up a little on that one (the R's and the tail on the f promarily) I think it could be a really nice idea.  <br> <br>The regularity of the script in C is a little mundane compared to the example in your opening post. I'll add my name to the list of admirers of that engraved face though -- it's lovely. <br> <br>jordan</p>"
  - id: 57706
    user: 2172
    date: 2005-01-25T09:17:00
    date_raw: 25 Jan 2005 — 9:17am
    votes: null
    html: "<p>A: I'm not a fan of this. I've never like swash caps in one word without any sort of custom ligatures to unify them. It always struck me as a bunch of beauty contestants in a row, rather than an integrated team. <br> <br>B: I really like the type, but the visual cues draw cultural and historical associations that don't feel relevant or wanted for your purpose. <br> <br>C: I think this is the most appropriate, though I prefer the less formal feel of the original script. I think this one is worth further efforts and variations. I like the contrast of the informal against the formal, but with all hand-written forms (Ermine doesn't strike me as an engraved face, or am I wrong?). <br> <br>D: This one doesn't feel bad to me, but it doesn't feel right to me either. It strikes me more as a title that's logo-ish, rather than a logo that speaks to writing.</p>"
    html_clean: "<p>A: I'm not a fan of this. I've never like swash caps in one word without any sort of custom ligatures to unify them. It always struck me as a bunch of beauty contestants in a row, rather than an integrated team. <br> <br>B: I really like the type, but the visual cues draw cultural and historical associations that don't feel relevant or wanted for your purpose. <br> <br>C: I think this is the most appropriate, though I prefer the less formal feel of the original script. I think this one is worth further efforts and variations. I like the contrast of the informal against the formal, but with all hand-written forms (Ermine doesn't strike me as an engraved face, or am I wrong?). <br> <br>D: This one doesn't feel bad to me, but it doesn't feel right to me either. It strikes me more as a title that's logo-ish, rather than a logo that speaks to writing.</p>"
  - id: 57707
    user: 4754
    date: 2005-01-25T10:49:00
    date_raw: 25 Jan 2005 — 10:49am
    votes: null
    html: "<p>I join the chorus singing for the first concept:  the 'WORDS' looks great. And I like the nearly matching stroke-thickness between the thin parts of the WORD-letters and the stroke-thickness in your handwriting. That's why I'd vote for version nr. 1. <br> <br>But the main reason why I prefer the first example is that I think that the different sizes of the two words provide more energy than the two similar sized words in the examples presented in your pdf. So I would start by reworking the 'Fourhundred' a bit. <br> <br>Another idea concerning the Fourhundred/400: have you already tried to draw something like that swinging f-bow with the 4? That could be nice because of their formal similarity.</p>"
    html_clean: "<p>I join the chorus singing for the first concept:  the 'WORDS' looks great. And I like the nearly matching stroke-thickness between the thin parts of the WORD-letters and the stroke-thickness in your handwriting. That's why I'd vote for version nr. 1. <br> <br>But the main reason why I prefer the first example is that I think that the different sizes of the two words provide more energy than the two similar sized words in the examples presented in your pdf. So I would start by reworking the 'Fourhundred' a bit. <br> <br>Another idea concerning the Fourhundred/400: have you already tried to draw something like that swinging f-bow with the 4? That could be nice because of their formal similarity.</p>"
