    <p>A friend of mine is developing a software package for use in <a href="www.simchecksoftware.com" rel="nofollow">Microsoft Flight Simulator X</a>. He is currently working on an extension pack for that application, for which he works with a GPS computer. This is an image of said display. Does anyone know of a font (commercial or freeware) that approximates the letters and numbers seen here?</p>
