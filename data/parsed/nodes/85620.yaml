      <p><cite>And while I myself tend to give a bit more importance to screen readability, I think the good screen fonts just don't look very good printed.</cite></p>
      <p>What you're describing is a print-optimized font that's been engineered to render well on screen in Windows, also known as a hinted TrueType font. I can't hope to speak for the TrueType-hinting geek squad at Typophile, so I'll let others post names of foundries that sell hinted TrueType fonts that started life as print-optimized fonts.</p>
      <p>The other issue that comes up when you're moving word-processing files around is font embeddability. Most commercial fonts can't be embedded in a word-processing document. The Adobe Originals are an exception, but they don't have any TrueType hinting. </p>
      <p>Is any foundry offering print-optimized, TrueType-hinted fonts that also permit editable embedding? I can't think of any, but perhaps others will enlighten me.</p>
      <p><cite>have you looked at typography.com's EULA</cite></p>
      <p>I won't single out any one EULA for criticism or praise. Some are better than others, but they all have room for improvement. And they could all be shorter.</p>
