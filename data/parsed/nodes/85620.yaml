      <p><cite>Contracts have complex, demanding language</cite></p>
      <p>True, though that's nearly always due to flabby, imprecise writing, not necessity.</p>
      <p><cite>In other words, because they are not the kind of casual narrative or brief snippet for the web, they would not have the same requirements for screen reading as, say, typophile.com. Is this correct?</cite></p>
      <p>I don't frame the typography question in terms of "how will readers use this document?", because you can't control that. Rather, I frame the question as "how does this document invite readers to use it?" because that's within your control. </p>
      <p>For example, when a software installer puts 2500 words of teeny text in a small scrolling box, the typography sends a message. That message is: "I'd prefer you didn't pay attention to what's in this box." When half the words are in caps, that message is even louder.</p>
      <p>For another example, I was writing a font license last week. My view is that someone buying a font should read the license. </p>
      <p>As research, I read about 25 font EULAs from other foundries. But a lot of those licenses — no disrespect to the people behind them —&nbsp;are crazily long and dense. I have a law degree, and I still had to make little pencil diagrams to follow what was going on in some of them. I've no idea what the average MyFonts customer is supposed to do with them. But I know what the average MyFonts customer <strong>actually</strong> does: ignores them. Because they beg to be ignored.</p>
      <p>So how do I get someone to read a font license? I decided that it should be one short, inviting 8.5" x 11" page. The customer can print it if they want, but it also had to be legible on screen. The text of the license had to fit on the page without any typographic trickery (tiny font, condensed font, etc.) That, in turn, put some constraints on how the license was written. But I finished it, and the first customer who got it said "Wow, that's a very clear license."</p>
      <p>That's a long way of saying that the answer to your question depends on whether you assume that contracts can learn nothing from the "casual narratives" or "brief snippets" that we usually see on the web.</p>
