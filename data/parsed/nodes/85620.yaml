      <p><cite>The problem is, essentially, balancing screen readability, for which only a few fonts excel, with printed readability (and attractiveness), for which many excel--and they seem to be mutually exclusive.</cite></p>
      <p>Right, but you're overlooking one key issue. The Microsoft system fonts (Georgia, Calibri, Cambria, et al) are designed &amp; engineered to look great on screen in Windows applications that use Windows text rendering, like Word. But PDF is a Postscript-based format and PDF readers use their own text rendering. (For instance, Adobe Reader uses a technology called CoolType. Why? So ensure consistent text rendering between platforms.) </p>
      <p>Therefore, in PDF, the MS system fonts have no screen-legibility advantage over print-optimized fonts. And since any PDF could also be printed, your best bet is always going to be a print-optimized font (like Miller) not an MS font (like Georgia).</p>
      <p>For a longer version of this answer, with screen shots proving the point, go here:</p>
      <p><a href="http://typo.la/efile1">http://typo.la/efile1</a><br><a href="http://typo.la/efile2">http://typo.la/efile2</a></p>
