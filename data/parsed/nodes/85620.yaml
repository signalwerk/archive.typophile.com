      <p>Thanks for the clarification Matthew.  I am aware of the PDF issue you describe but I note that in my business of negotiating contracts for equipment finance PDF's are normally not viewed (at least not critically viewed) onscreen during negotiation.  There is almost always an exchange of Word documents during the negotiation process followed by signature copies sent by PDF and FedEx.  This is why I am trying develop some insight into the balancing of the readability on *both* screen and paper.  And while I myself tend to give a bit more importance to screen readability, I think the good screen fonts just don't look very good printed.  Thus this thread.  [PS, your book is terrific, and is going on my shelf along with Garner and Adams.]</p>
      <p>=====</p>
      <p>William, you make a good point.  There are a lot of methods for dealing with the small-print-being-difficult-to-read problem.  In the old, old days there was often nothing to do but tough it out.  But then came copiers that could enlarge the small print--a godsend.  (Long ago my company used preprinted forms in 6pt that were often faxed around!)</p>
      <p>Nowadays with editable word processing files it's easy enough to use the zoom function on the computer, this being especially useful if a document is formatted in columns--with "draft" view you see only one column at a time and there is no horizontal scrolling.  And, of course, there's always the expedient of temporarily increasing the font size to 12 or 14 points during editing.  </p>
      <p>Sometimes though, a PDF, fax, or hard copy is the only version provided for review (bad form, I say, so I always ask for an "editable" copy if possible).  In this case I've resorted to OCR'ing the document so that I can reformat it to read it (and to search and use text comparison software).</p>
      <p>=====</p>
      <p>Matthew, have you looked at typography.com's EULA?  I recall reading it recently and thinking it pretty good for clarity and brevity.</p>
