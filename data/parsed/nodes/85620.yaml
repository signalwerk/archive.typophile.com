    <p>Is there a better compromise font than Times New Roman for creating contract forms?</p>
    <p>I've read a lot of "best font" discussion.  I basically get the difference between fonts designed for reading on screen and those for reading on paper.  Our contracts are typically 3-6 pages (occasionally longer) with 1,750 or so words per page (more or less depending).  Generally we use a 9pt, 10pt, or 11pt font (never less than 8pt).  Personally, I read and edit almost 100% onscreen.  However, my company's customers and my fellow employees read both onscreen (in Word and PDF formats) and on laser-printed pages.  And in all cases the final contracts are laser printed before being signed (and scanned—so OCR accuracy is a plus).</p>
    <p>So, is there a better alternative?</p>
