    <p>Hello:<br>
        I am a graphic designer who's neither good at type assessing nor logo designing.<br>
        However I was asked to help with a logo design for a new small company wanting<br>
        to market fruit pulp which will be used to make 'homemade' smoothies.<br>
        I thought the Pump typeface was friendly and echoed somehow fruit forms.</p>
    <p>    I wonder if you could help with some suggestions<br>
        Thank you.</p>
    <img typeof="foaf:Image" class="img-responsive" src="http://www.typophile.com/sites/default/files/forum-files/test-logo_0.png" width="1098" height="520" alt="Test logo for a fruit company" title="Frutaya&amp;#039;s logo">
