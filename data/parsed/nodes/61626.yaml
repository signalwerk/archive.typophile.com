      <p>Kevin, in the experiments graciously you did, the times of exposure were too large to replicate Purcell's findings. In our communication with Purcell, he anticipated problems with the experimental set up you were using, as we related to you. In your experimental set up, with the longer stimulus times, you could not get a normal WSE except with letters as masks, rather than the overlaid Xs and Os of Purcell.  </p>
      <p>Our hypothesis concerned two levels of WSE, one at shorter times primarily due to visual effects and the second cognitive, based on an influence of word memory. The fact that the exposure times were longer, and that letter masks interfered more with stimulus identification made it plausible that memory was involved. Since no shorter times were involved, our hypothesis wasn't really tested.  </p>
      <p>Since our predictions involved longer and shorter exposure times for the exposure of stimulus, and your experimental set up did not get those, I felt it wasn't a valid test of our hypothesis. If you replicate this with a set up that can get the longer and shorter times, and careful control of the SOAs (time gap between stimulus and mask),it would be valid, and either refute or corroborate our hypothesis. Because your experimental set up did not really test what we looking for--the set-up first needed to replicate Purcell, and didn't--I felt it wasn't worth explaining the whole thing at TypeCon. </p>
      <p>Presence of a WSE with mixed case that you found under your conditions has as you know been been found before. --In fact our hypothesis is an alternative explanation for that effect. And it does not in itself refute "any claim that lack of rhythm destroys the Word Superiority Effect." We were only using three letter stimuli, and no disrupted spacing, which still gives a pretty even look. If the s pa ci n g  were like this, with longer words, I do expect there would be a destruction of the WSE, such as Purcell found a destruction of the WSE with very wide spacing of letters. </p>
      <p>Further, with timed tests with comprehension, rather than a WSE test, I think it will be possible to show that disrupted spacing slows down reading--ie will hurt readability.</p>
      <p>I should add that I don't think that reading test by itself it would test Peter's theory of gestalt effects. It would, though, test the idea that letters falling near a regular rhythm is important to readability.</p>
    html_clean: |-
      <p>Kevin, in the experiments graciously you did, the times of exposure were too large to replicate Purcell's findings. In our communication with Purcell, he anticipated problems with the experimental set up you were using, as we related to you. In your experimental set up, with the longer stimulus times, you could not get a normal WSE except with letters as masks, rather than the overlaid Xs and Os of Purcell.  </p>
      <p>Our hypothesis concerned two levels of WSE, one at shorter times primarily due to visual effects and the second cognitive, based on an influence of word memory. The fact that the exposure times were longer, and that letter masks interfered more with stimulus identification made it plausible that memory was involved. Since no shorter times were involved, our hypothesis wasn't really tested.  </p>
      <p>Since our predictions involved longer and shorter exposure times for the exposure of stimulus, and your experimental set up did not get those, I felt it wasn't a valid test of our hypothesis. If you replicate this with a set up that can get the longer and shorter times, and careful control of the SOAs (time gap between stimulus and mask),it would be valid, and either refute or corroborate our hypothesis. Because your experimental set up did not really test what we looking for--the set-up first needed to replicate Purcell, and didn't--I felt it wasn't worth explaining the whole thing at TypeCon. </p>
      <p>Presence of a WSE with mixed case that you found under your conditions has as you know been been found before. --In fact our hypothesis is an alternative explanation for that effect. And it does not in itself refute "any claim that lack of rhythm destroys the Word Superiority Effect." We were only using three letter stimuli, and no disrupted spacing, which still gives a pretty even look. If the s pa ci n g  were like this, with longer words, I do expect there would be a destruction of the WSE, such as Purcell found a destruction of the WSE with very wide spacing of letters. </p>
      <p>Further, with timed tests with comprehension, rather than a WSE test, I think it will be possible to show that disrupted spacing slows down reading--ie will hurt readability.</p>
      <p>I should add that I don't think that reading test by itself it would test Peter's theory of gestalt effects. It would, though, test the idea that letters falling near a regular rhythm is important to readability.</p>
