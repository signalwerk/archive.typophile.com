      <p>In the beginning:</p>
      <p>Bouma, H. (1973). Visual interference in the parafoveal recognition of initial and final letters of words, <em>Vision Research</em>, 13, 762-782.</p>
      <p>For an easier read check out <a class="freelinking external" href="http://en.wikipedia.org/wiki/Bouma" rel="nofollow">Wikipedia's definition of Bouma</a>.</p>
      <p>For a slightly more in depth read see Larson's article <a class="freelinking external" href="http://www.microsoft.com/typography/ctfonts/WordRecognition.aspx" rel="nofollow">The science of word recognition</a>.</p>
      <p><strong>HOWEVER</strong>…</p>
      <p>Besner, D. (1989). On the role of outline shape and word-specific visual pattern in the identification of function words: None. <em>The Quarterly Journal of Experimental Psychology A: Human Experimental Psychology, Vol 41(1-A)</em>, Feb 1989. pp. 91-105.</p>
      <p>While it has been some time since I have read this one, this study, consisting of five experiments, showed that cASe aLterAtioN made no <em>significant</em> difference on human performance tasks such as naming and decision making. This refutes the Bouma law.</p>
      <p>In my opinion, the jury is still out on this one.</p>
