      <p>&gt;Most recent sans serif types [...] make some effort to distinguish I and l, either through height difference, or distinct terminals, or some combination.</p>
      <p>Yes they do. But if I had to add an extra nose to be more easily recognized, I'd pass. </p>
      <p>The true features of I and l that distinguish them in their character groups, are the slight exaggerations to stem thickness and spacing, relative to their nearest kin, not characters from distant groups. The writing systems can definitely handle this, (to prevent what MS calls, "the BIll Hill problem")  But because of other closely related problems, they don't. So now... we've got simplified Latin, i.e. minimal information designed into the font for the reader, poor scaling and not enough pixels.</p>
      <p>And, the challenges to legibility in low resolution environments, though not specifically anticipated in the development of writing systems, are...in the form of grids upon which most classically love fonts are plotted. But even these are defeated by the one thing no writing system could ever anticipate, a lack of competition leading to a constraint of development and trade leading to what we see today on most people's screens. </p>
      <p>Cheers!</p>
