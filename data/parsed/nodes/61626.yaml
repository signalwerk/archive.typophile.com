      <p>I read the paper. In fact, I wish Kevlar had an RSS feed (any old blog would do) of interesting research papers he runs across so we can read what he does.</p>
      <p>I spent a couple of days with Aries Arditi a few years ago. (His first name, incidentally, is not pronounced like the astrological sign but exactly like “heiress.”) He struck me as not letting anything get in the way of actually helping low-vision people who are the clients of his institution. That includes distorting letterforms and using nonsensical IE6-only CSS. He <em>really</em> doesn’t like it when he or his colleagues are claimed to be wrong, let alone proved to be. Quite obviously I would have no idea whatsoever what that feeling is like.</p>
      <p>At any rate, the paper showed the difference between all-UC and mixed-case text was pronounced at small sizes. There was a discrete threshold at which such a difference became large. I view this as merely a finding that below a certain size, raw height of character is an overriding factor. Capitals are taller than mixed case on average even with his method of smoothing out UC/U&amp;lc differences.</p>
      <p>Now, it would be interesting to rerun this experiment with Cyrillic, as its U&amp;lc is essentially caps and small caps, and any unicase alphabetic script, like Hebrew.</p>
      <p>—<br>
      Joe Clark<br>
      <a href="http://joeclark.org/" title="http://joeclark.org/">http://joeclark.org/</a></p>
