      <p>A study that shows what, David? That readability is qualitative? That we can speak meaningfully about a text being more or less readable than another text? That we reckon readability in terms of speed, comprehension (also retention) and comfort? This is all I asserted, and I challenge you to show me a study that <em>doesn’t</em> show this or, indeed, doesn't presuppose this, based on common sense and everyday experience. You don't need a study to prove that when we read we use our eyes and our brain. Some things are obvious to casual observation, and the fact that some things are easier or harder to read than others is one of them.</p>
