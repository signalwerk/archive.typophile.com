      <p>&gt; Is that a hypothesis or an observation?</p>
      <p>I would call it a theory. There are multiple pieces of data that support this. For example, typefaces with letters that can be recognized with size constraints tend to be read faster at normal sizes. I don’t know of any data that goes against this theory.</p>
      <p>Optical sizes is an interesting test for this theory. Clearly a font designed for 4 point is going to perform better than a font designed for 12 point when tested under size constraints. The theory would predict that the designed 4 point design would be read faster than the 12 point design when both are displayed at 12 point. That could be wrong, I don’t know.</p>
