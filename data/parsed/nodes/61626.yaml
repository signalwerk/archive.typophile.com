      <p>I think this is a bit nonsence and the real issue that should be discussed is that no employer can claim this as a reason to let go of an employee. This would certainly be a case for a complaint at the social security institute, but these are things that have nothing to do with typography, so i'll stop here.<br>
      My oppinion is that we cannot, must not, turn written language into spoken language. Screaming is sound, screaming has no correlation to any written letter, the best way you can write a scream is (depending on your particular cultural codes) by the use of onomatopoeia, that's why they exist. Of course all of this can change in the course of history, and the words "must not, cannot" have no meaning anymore realy... But I think it's important to remember that the intent of screaming turned into letters on paper/screan is not screaming at all! And sentences written in capitals are not screaming if the words themselves aren't offensive... but that's just my oppinion.</p>
