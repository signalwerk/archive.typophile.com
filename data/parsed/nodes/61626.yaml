      <p>Kevin, if a single powerful vendor decided 2 point was the "new world order", you know as well as I do we'd just all have to design 2 point masters and fit up the masses with thick glasses (it sounds catchy-phrase-able already), until the monitor manufacturers could fit their products with thick glasses for the poor, while the rich would 'go nano' and not need glasses, (or fossil fuels;). Then...I believe 2 point text would perform better than 12 point text in all tests. Even I could design <em>that</em> study.</p>
      <p>Bill&gt;And the changed conditions affect readability under different circumstances, such as size, print medium, or computer screen.</p>
      <p>I agree completely. This is why I think that tests in cleartype labs and optometrically designed studies are so far away.</p>
      <p>In print, from the type's contrast to paper to the light the user employs, there is plenty of 'positive' wiggle room and designers and readers use it... On screens, e.g. it's only a little funny that the style is selected by one user, before the size, scaling and rendering are selected by the reader. Positive wiggle room is scarce, and we see that in the number of both complaints, studies on the topic, and reader flight to better platforms.</p>
      <p>Fortunately, identifying reliably the characters who've make the major platform's screens less readable than print, is becoming easier. </p>
      <p>Cheers!</p>
