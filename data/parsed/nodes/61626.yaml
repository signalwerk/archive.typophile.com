      <p>&gt; The Arditi and Cho paper is interesting, but I’d like to see what they gave subjects to read.</p>
      <p>Yes, that would be great, but it’s not really possible because of the inherent differences between screen and print. They used Arial (which has no optical size adjustments), on-screen at very large sizes - what information would better help you understand the original material: screen dpi plus ppem size?</p>
      <p>&gt; The fact that Arditi and Cho clearly do not understand what constitutes font size.</p>
      <p>Since they’re not comparing between two typefaces, they don’t need a more accurate definition of font size for this study.</p>
      <p>I liked that they developed a way to control for the inherent size difference between upper and lowercase. They measured the minimal visual angle needed to recognize lowercase and the minimum visual angle to read uppercase. They took those sizes as equal (which involved a smaller point size for uppercase Arial than lowercase Arial). Reading speed at twice the minimal visual angle was faster with uppercase Arial than lowercase Arial.</p>
      <p>Their size control is very clever.</p>
      <p>I think the unanswered question is why does this study differ from earlier studies that found that lowercase is read faster than uppercase?</p>
