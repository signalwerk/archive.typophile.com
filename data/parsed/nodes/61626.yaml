      <p>John, I agree that Lieberman's definition is better. </p>
      <p>&gt;one can say of legibility, as the foundational property, that it is necessary but not sufficient for readability</p>
      <p>I would add that once a threshold of legibility--of letters--is met under a given condition, it may well be that increased legibility under other conditions is irrelevant to the reading process under that condition. </p>
      <p>As you know, at my talk at TypeCon this year I also argued that considerations of evenness of color and rhythm, aside from legibility of individual letters, also contribute to readability. </p>
      <p>And as I said, color and rhythm are important whether or not one accepts Peter's view that gestalt processes are at work in word recognition. (And I do suspect that Peter is right.) Frankly, I think that my slides--similar to your "word" illustration here, but more extended--made the case for the importance of even color and rhythm. And of course it doesn't have to be made to type designers, who have by and large been very sensitive to these issues. </p>
      <p>Ps. I am curious as to when the distinction was made. Lieberman has on the same page as that definition photos of Beatrice Warde of Monotype and Paul Standard of Linotype, and his book is dedicated to them. He consulted them in the writing of the book, along with many others including a young James Mosley. I suspect that the distinction was introduced by Linotype folks in the 1930s, but I am guessing.</p>
