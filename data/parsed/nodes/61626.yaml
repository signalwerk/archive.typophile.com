      <p>Regarding to the last paragraph: I don't think it's nonsense that lower-case letters are easier to read than capitals. The simple reason is that the distinction between different lower-case letters is much easier to grasp than the distinction between different capitals. I would not like to read a book that's all capitals.</p>
      <p>Nevertheless I think that using capitals is not a reason for getting fired ;)</p>
