      <p>Peter, I have no problem with discussing and testing how sub-letter features operate in reading. I'm all in favor of it. I'm afraid I haven't successfully communicated my concerns about your approach, and the role of terminology in it. </p>
      <p>In any case, the key problem is not terminology, but lack of tests. I've suggested some tests of your theory, and that direction is the only one that will advance your theory within science, IMHO. That's the bottom line. Lay out the tests, and your theory will be clear enough for science, however lucid or awkward the terminology. </p>
      <p>&gt;John proposed.</p>
      <p>As did I extensively at my presentation at your panel TypeCon, right? Here is a key slide:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Not_legible_letters_but_readable_words_5618.gif"></div><p></p>
      <p>The point is that all of the letters in the "legible letters" line are very readable when they are with their "mates" in style and weight, but as is the two words are barely readable. It was interesting to me that mixing both case and italic/regular, as well as mixing weights, results in such a dramatic deterioration in readability--much more than mixed case alone. </p>
      <p>&gt;If lowercase letters are an example of poor legibility but good readability, is it because lowercase text tends to have better spacing or letter design consistency than uppercase?</p>
      <p>Well, it's not "poor" legibility, but sub-optimal. A threshold has to be reached, I believe, before reading can take place. I think you now understand the problem that Peter has been wrestling with, and what all we type people have been talking about. </p>
      <p>And yes, lower case has both more even color and better spacing than upper case. If you look at lower case, most of the letters have 'four corner' adjustment of black within the x-height, so that more even color is possible. Eg compare T and t. The cap t inevitably gets more "holes" that can only partly be compensated for by spacing. In addition ascenders and descenders I think increase ease of recognition of word image--a gestalt effect.  </p>
      <p>Peter in particular has argued that letter recognition is worse in normal spacing of lower case, because of crowding. But that closeness is actually better for getting the word image, the gestalt formed by a collection of interpreted sub-letter features across the word. Thus words and letter combinations read better and single letters worse. That accounts for the Word Superiority Effect. </p>
      <p>And the experiments I suggested to you were designed to test that in more revealing way than previous tests. The apparatus unfortunately did not allow you to get the short exposure times of the original experiments of Purcell, and so were not dispositive on the issues.</p>
      <p>If they are repeated with the short times, I think they will be more revealing. I can discuss this at more length with you. </p>
      <p>I have also suggested an experiment using the WSE and missing letter parts which will be even more revealing, I think. This was in part of my TypeCon talk that I didn't get to because of lack of time. </p>
      <p>Separating the benefits for readability of only good spacing and even color from the gestalt effects is something I haven't thought about yet, but that should be doable also.</p>
    html_clean: |-
