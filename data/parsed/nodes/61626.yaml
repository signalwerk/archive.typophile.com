      <p>John, your succinct formulation is helpful, thanks. </p>
      <p>However, I do not want to reduce readability to accuracy of decoding, or even accuracy of decoding at a given speed. The 1967 definition of readability of my Uncle Ben Lieberman, in his book Types of Typefaces is: "Ease with which the eye can absorb the message and move along the line." To me this implies a combination of speed, comprehension and comfort. And more important, those are the basics that readers actually appreciate in a text type. </p>
      <p>So I would be happier reformulating your sentence as "The type that can be read with the best speed, comprehension and comfort in situation A, is not necessarily the type that can be the read with the best speed, comprehension and comfort in situation B."   </p>
      <p>Less comfort could be measured, I have suggested, by a decline in speed or comprehension with time. You might be able to decode one font as well as another in a short time, yet one might have superiority as far as comfort. In fact, I suspect that reading comfort may be the most important difference between reading current computer screens and reading print on paper.  </p>
      <p>This also answers Kevin's question above, "Can readability be separated from legibility?" They can be distinguished because accurate decoding is only one factor in readability; there is also speed and comfort at a given level of comprehension. </p>
      <p>I find 'legibility' a useful term in the narrower sense I have used it because there are specific design qualities that help decode type in difficult reading circumstances--such as large counters for the point size. But in larger sizes these same features though still more 'legible' in that restricted sense--if you bring in darkness or poor eyesight or distance from reading matter they still are an advantage--but they do not help you decode more quickly in normal circumstances.</p>
