      <p>There should be a rule that published reading studies should include not only their methods and results but also the experimental materials used. The Arditi and Cho paper is interesting, but I'd like to see what they gave subjects to read. The fact that Arditi and Cho clearly do not understand what constitutes font size—‘the sum of cap height plus descent, which is usually specified in points’—is disturbing, as is the fact that they are testing at multiple sizes while apparently having no concept of size-specific type. Then they seek to ‘minimize differences based on relative size of upper- and lower-case letters’ by using ‘a font (Arial) with a relatively large x-height’, but in so doing obscure any possible legibility advantage of traditional book face proportions, i.e. smaller x-height.</p>
      <p>I'm perfectly willing to accept that allcaps might be more legible than mixed case or lowercase. But I don't find this paper convincing.</p>
    html_clean: |-
