      <p>Peter, I think I do understand your frustration with existing literature on reading. Since you have interesting ideas, I can't say you have gone into a swamp, even though at times I feel your language sometimes has gone there. I don't want to belabor this, but I would just say two things: first, seeking precision in terminology can become an endless quest and a distraction from finding testable theories. Second, it is hard to communicate new ideas in any case, and new terminology can be an additional obstacle to communication. If it is possible to keep new terms to a minimum, it promotes communication. And communication is actually quite important. </p>
      <p>Because I don't think terminology is very important to the content of a scientific theory, I don't want to put up a big defense of the distinction readability vs legibility. But to answer your question: on readability, I have said this involves speed, comprehension, and comfort. I think all of those are in the psychological literature. Legibility is different because it is, as defined by Lieberman and understood also by Hudson, a measure of ability to identify individual letters. Such tests of letter recognition are also in the literature. </p>
      <p>In fact, Arditi &amp; Cho tests began with legibility tests, and then switch to readability tests. To me these categories are helpful in thinking about what is going on in these experiments and others. </p>
      <p>Also I would also add that because my introduction to type was the book Types of Typefaces I have been more ready to listen to your theories of how reading words differs from letter recognition. Perhaps you think that a benefit, and perhaps not :)</p>
