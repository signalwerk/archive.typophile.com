      <p>Kevin: <em>Is it possible to have the converse: poor legibility but good readability? Or is legibility a subset of readability, so letters with poor legibility will always also have poor readability?</em></p>
      <p>Are lowercase letters an example of poor legibility but good readability?</p>
      <p>I agree with Bill: a baseline of legibility is necessary to readability. This baseline can probably be defined as the distinction between illegible and legible letters, with the caveat that if you have one or two illegible letters but put them in context of legible letters the results will be readable on the basis of context. If most or all of the letters are illegible, readability is defenestrated.</p>
      <p>I wouldn't characterise lowercase letters as having ‘poor’ legibility. Obviously they have ‘good enough’ legibility: writing systems don't tend to develop poorly legible shapes, and if letter recognition tests indicate that particular letters are <em>very</em> difficult to identify that would suggest to me that identification of those isolated letters is not very important to reading that writing system.</p>
