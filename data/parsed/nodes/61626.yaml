      <p>&gt;I’ve never quite understood the division of labor between legibility and readability. </p>
      <p>Well I'll explain it to you, in operational terms. Legibility is whether words can be deciphered under difficult conditions, such as poor vision, poor light, distance. Readability is is whether they can be read under optimal conditions with comfort, speed and comprehension. Operationally defining comfort may be a little tricky, but the others are pretty straightforward. </p>
      <p>Do you understand it now?</p>
      <p>So defined, readability and legibility are conceptually different. The question of the relationship between legibility and readability then can and should be experimentally investigated. There is no reason that they *have to* be the same. The gears in a car that are optimal for going up a steep hill are not optimal for going fast on a flat road. Similarly, the type that is optimal for very small size or viewing at night at a distance may well not be optimal for normal reading under good conditions. </p>
      <p>&gt;For example, typefaces with letters that can be recognized with size constraints tend to be read faster at normal sizes. I don’t know of any data that goes against this theory.</p>
      <p>Hello? You have before you that Tinker found that all-caps reads more slowly, and you have Arditi and Cho showing that caps of the same point size are more legible under difficult reading conditions--including small visual size for normal readers. </p>
      <p>So you have before you clear evidence that more legible type is *not* more readable. So you unscientifically dismiss Tinker, or do you retest and refine his results, as good scientific method would require?</p>
      <p>&gt;Without running hundreds of people (as Tinker did), differences will frequently be missed. Instead it has become common to test typographic quality by measuring words under time or size constraints.</p>
      <p>As I think you have evidence at the very least that agate proportions don't give an advantage in reading print at normal sizes a decision to *not* run tests that are harder to execute for the experimenter seems to me terrible methodology. </p>
      <p>It is like the old story of the drunkard who was looking under the street lamp for his keys. A fellow asks "where did you lose them?"  And the drunk answers: "Over there in the dark, but I can see here."</p>
      <p>And to repeat my earlier suggestion here, readability can be tested, and I think more efficiently than Tinker did. Have students do a lot of SAT reading tests, timed, over several hours, with different fonts. Then you can compare comprehension and speed among different fonts and layouts. Then you can get some real answers, instead of looking under the light, where there are no keys. </p>
      <p>&gt;Can something be readable without being legible?</p>
      <p>To be readable the words have to be legible *under the conditions* which you are reading them, in the sense that you can readily identify them. But there is no logical compulsion that the *most* legible under difficult conditions are the most readable under optimal conditions, which is what the distinction legible vs readable is designed to make.</p>
      <p>In fact we know that very small type intended to be read over the centuries has generally been done with larger x-heights, somewhat wider and bolder, and with looser spacing. And these specifications have generally not been preferred by readers of extended text. Agate type is used for agate size, and text type for text size. </p>
      <p>Thus the evidence of hundreds of years of preference would put the burden of proof on showing that agate type is more readable, whereas you are assuming without testing that it is so, which is hardly scientific. </p>
      <p>In the tests you reported at Typecon, it seemed that you were assuming that legible glyph would be more readable. Since this is important to readability on screen, I don't understand why you don't have a priority on testing it, because otherwise this direction of research may well be irrelevant to screen reading. </p>
      <p>Ps. Under good conditions and legible type, we are talking about relatively small differences in readability, but still significant. For example, we can read on current computer screens, but most of us prefer to read extended text in print.</p>
