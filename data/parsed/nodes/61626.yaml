      <p>&gt;[Lieberman's] definition doesn’t specify what in psychophysical functional terms eyes moving along a line, or telling one letter from another, or —most flagrantly — eyes absorbing messages are.</p>
      <p>I strongly disagree that this makes Lieberman's distinction between legibility and readability useless. On the contrary, when you load theory into it, as you seem to want to, you muddle the concept, and make it hard to understand. His definition is so well formulated that I regret departing from it. The idea that "legibility" applies to letters and "readability" to lines of words is a clear and understandable distinction, and serviceable for discussion and theorizing about type. </p>
      <p>Whenever people create technical terms it causes a new barrier to communication. Sometimes it's worth it, but the meanings should be a clear as possible, and not loaded with theory. The more you load it the higher the barrier to communication. </p>
      <p>Furthermore, I agree with Popper that theories, and not terminology are what is important. Classical physics can be formulated taking force and mass as primitive terms, or work and energy as primitive terms, if I remember rightly. That shows that terminology is not decisive. It is only helpful or not.</p>
      <p>Furthermore terminology is never, never, never completely clear and precise. Max Jammer wrote books "The Concept of Mass" "The Concept of Force", etc., and if you read them the punch line is more or less that nobody knows really what these are.  </p>
      <p>I think Lieberman's distinction is helpful because it enables you to formulate what is to me the "fundamental principle of type design": legible letters are not enough to make highly readable text. There's more to it. There's at least color and rhythm, and probably the gestalt effects you have theorized about.</p>
