      <p>Kevin, I admit I am frustrated because I did define legibility and readability so that they may turn out to operate in a testably different way.  And I explained the two tests. I am not using the words in a conventional way, but in the technical sense that typographers have for over fifty years. It is a technical distinction, but a difference that can be tested for. It is testable, and I explained how, but I will again:</p>
      <p>You test legibility of types as Arditi and Cho did or the Clearview tests did--testing decoding under difficult-to-read situations. Then you test the highest legibility type for reading speed and comprehension in the manner I said, in normal text conditions using the SAT tests. And you also take a good text font, like Minion in normal text case (lc with caps as conventionally), also test both under difficult circumstances, and using the SAT test. It may turn out that the more legible type--the type that comes out better in difficult-to-read situations--does equally as well or worse in the readability tests. That would experimentally establish that there is a meaningful distinction between legibility and readability. </p>
      <p>Sorry to have been so brusque, but what upsets me is that you seem to dismiss the difference as non-existent or not worth testing, even though you now concede that your theory is untested. That's what struck me as not in the scientific spirit. </p>
      <p>The heart of the matter that some type designers keep disagreeing with you about comes down to whether there is a difference between ability to decode letters or single words under difficult circumstances vs what is best for reading normal text, in terms of speed, comprehension, and comfort.  </p>
      <p>Now that John has added his voice on this--thanks John--you concede that agate proportions may in fact turn out not to be superior at bigger sizes. Yet in the beginning you seemed to dismiss this possibility--which is one case of exactly what I have been talking about--as not worth testing because contrary to the current weight of evidence. </p>
      <p>And this in spite of the evidence from Tinker on one hand and Arditi and Cho on the other, which seem to me together to show that on the contrary, one type that is more legible under difficult conditions--small size all caps--is in fact less readable in normal text sizes and conditions in terms of speed with comprehension, or in other words readability.</p>
      <p>Please address the issue of the different results of Arditi and Cho on one hand, and Tinker on the other. For they, as I understand it, are tests of legibility, on one hand, and readability, on the other. </p>
      <p>The issue here shouldn't be one of terminology. I can put the theory without using the terms readability and legibility: the type that can be decoded best in difficult circumstances--distant, small, low light--is not the type that reads most quickly with comprehension and comfort in normal circumstances in print at text sizes. Is that understandable? Do you think it's testable in the manner I described?</p>
