      <p>Adding some further thoughts.</p>
      <p>Your alternative allows one to say that what is good for deciphering or decoding or at thresholds -- a function signage must accommodate -- is not necessarily good for continuous reading under good conditions.</p>
      <p>All I'm trying to say is that to articulate a theory of perceptual processing in reading that is able to correct or underwrite and deepen or extend our understanding of what we say or do, it is not enough to stay with what we are prone to say in our ordinary everyday engagement with these things using words and metaphors that are ready to hand and modally non-specific. Yet what we are prone to say can be an excellent place to start.</p>
      <p>Fundamental principles don't always provide us with conjectures that support effective refutation in their native forms, as Kevin insists</p>
