      <p>&gt; Do you understand it now?</p>
      <p>Yes, I see that you have described legibility and readability differently. What I still don’t understand how these are different concepts. Sure, we happen to have two different words in English, but that doesn’t mean they’re actually different. In both cases light from a surface reaches our eyes. We use that light to recognize features, which we build up into recognized words. We read one word, then the next; our eyes move in predictable patterns. Environmental conditions can be good or bad, but the eyes do the same thing under any condition. I call this all decoding.</p>
      <p>Decoding is materially different from comprehension. I can comprehend text by listening to someone else decode it and read it to be aloud. They are distinctly different tasks. Are legibility and readability different tasks? According to your own description legibility is a component of readability. Can readability be separated from legibility?</p>
      <p>&gt; Thus the evidence of hundreds of years of preference would put the burden of proof on showing that agate type is more readable, whereas you are assuming without testing that it is so, which is hardly scientific.</p>
      <p>William, I am disappointed that you twice accused me of being unscientific. I put forward a strong, falsifiable theory that hypothesized that agate type is more readable. I even followed up that statement with: “That could be wrong, I don’t know.” Nothing could be more scientific that to create a theory that can be demonstrated false. I wish you would propose a theory of readability distinct from legibility that could be falsified.</p>
