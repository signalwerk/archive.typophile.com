      <p>Peter: <em>I want to understand why and in what sense it makes sense to say legible letters are not enough to make readable text. ... Legible letters are enough: they make readily readable words.</em></p>
      <p>Readability is qualitative (and also measurable in terms of speed, comprehension and comfort), so saying that something is ‘readable’ isn't saying much unless you qualify the observation to indicate how readable, on a continuum from minimally readable to optimally readable (for a specific condition). Legible letters are enough to guarantee that text is minimally readable. Consider the classic ransom note made up of letters clipped from different newspaper headlines, in different types, sizes, styles and colours and pasted on a page: all the letters are legible and, of course, the message is readable (it has to be, otherwise junior's gonna get his ear cut off). But we don't typeset books like this, and not only because it takes too long and uses too much glue.</p>
      <p>As I wrote above, all the discussion about word recognition being derived directly from letter recognition <em>presupposes,</em> so far as I can tell, a single typeface set in a single style and size. In other words, the model presupposes factors that Bill has identified -- colour (what I prefer to call texture) and rhythm -- and, I would argue, consistent spatial frequency, which are characteristics of good type design. It is easy to say that legible letters result in readable words -- even very readable words -- if the other factors of typeface design are a given. If you remove those other factors -- mess with spacing, mess with different typefaces, mess with different weights and styles, transcend spatial frequency channels within a word --, reducing the components of words to merely legible letters, you'll pretty quickly see 'why and in what sense it makes sense to say legible letters are not enough to make readable text'.</p>
