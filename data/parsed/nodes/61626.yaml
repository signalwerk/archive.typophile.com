      <p>Bill, my issue isn't terminology, but construct validity. John, when I say “I want to understand…” I mean I want to know what specific, single item, perceptual processing operator or primitive is at stake when questions of legibility or readability are raised.</p>
      <p>Let me explain. Readability and legibility have a specialized meaning in typographic discourse as compared with plain language. Ben Lieberman’s definition is couched in the language of everyday ordinary lived experience, which depends on experientially tractable wholes like identification, ease, line following and message absorption. This makes the definitions palpable and the terms potentially useful as an evaluative category but not necessarily suitable as a fertile term for building greater understanding. Letter-identification, line-following and message-absorption are complex acts, and the task and beauty of science is it’s ability to break these down.</p>
      <p>Let us say that letter identification involves feature detection, role-unit discrimination and some kind of combining or feature integration. When issues of legibility are on the table, I feel it is enriching / clarifying / disambiguating and productive to put forward that all or some of the items in this complex are under the loupe. And that a different complex of items or primitives are under the loupe when issues of readability are on the table. I feel this is a better strategy than just breaking down readability and legibility into matters of comfort, speed and comprehension, as signitors of ease.</p>
