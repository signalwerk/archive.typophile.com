      <p>&gt;The theory that legibility is separate from readability is unscientific (according to Popper) because there is no set of conditions that would show it to be false. It is useless because it can’t predict anything.</p>
      <p>I didn't explain clearly enough. The general idea that there are differences between legibility--ability to identify letters under difficult conditions--and readability under good conditions is a general research program, and not a testable theory in itself. </p>
      <p>However, specific claims of differences are testable and scientific. For example, the theory that bigger counters are helpful to identifying letters at very small visual sizes--helpful to legibility--but those bigger counters do not help readability (speed, comprehension, comfort) at larger sizes is testable. Thus the terminology of legibility and readability can be useful, as you can couch testable theories in it. </p>
      <p>And, given Arditi and Cho, as well as typographic practice, the theory I have stated is very likely true, as well as testable. </p>
      <p>As Popper always said, we don't want to be stuck on terminological debates, and the theories of what features work best in what situations are what are important, and not the terminology. The point is, the idea that all features that help reading in one situation help in every other has been refuted, as you say. The question is what's next. </p>
      <p>Peter's discussion (which I think I understand) gives some ideas on how to further identify and test such features.</p>
