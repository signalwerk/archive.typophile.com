      <p>David: <em>Show me a single study of one font vs. another, believable after even the simplest typographic vetting.</em></p>
      <p>Sure: I sat down and read one book and then I sat down and read another book, and I found one easier to read than the other and got through it quicker. This is what I mean when I say that readability is qualitative and measurable in terms of speed, comprehension and comfort. This isn't a conclusion based on laboratory studies; it is a quotidian observation based on doing reading, not studying reading.</p>
      <p><em>And, since all this talk is aimed at screen readability...</em></p>
      <p>It is? I suppose Kevin's engagement might be, because that's his job, but I don't see anything in what Bill, Peter or I have written that indicates that this talk is aimed at screen readability or, indeed, aimed at readability at all. I believe it is aimed at understanding how reading works and being able to describe that in meaningfully precise terms. Readability is, I argue, a set of properties of text, and hence largely irrelevant to understanding reading as an activity of eyes and brains. As Peter memorably wrote on another occasion: ‘trying to construct a science of readability might be like calling physics the science of the fall-down-ability of falling objects’. Readability is only relevant to understanding reading insofar as empirical testing must try to isolate and control readability properties.</p>
