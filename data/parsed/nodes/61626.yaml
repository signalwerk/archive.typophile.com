      <p>I'm curious to know what Arditi and Cho mean by mixed case. Do they mean standard upper and lower case such as used in this message (capitalizing the initial letter of sentence-initial words and names), or classical mixed case, where every other letter is capitalized?</p>
      <p>That is, are experiments 2 and 3 comparing all capitals with normal upper and lower case, or classical mixed case?</p>
