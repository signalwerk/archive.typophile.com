      <p>Kevin: <em>I don’t take this as evidence that legibility and readability are distinct, because there was no finding here that could have falsified the hypothesis that legibility is distinct from readability.</em></p>
      <p>Bill has put forward two different definitions of legibility and readability: one his own and one from Lieberman's <em>Types of Typefaces.</em> The latter is closer to my use of the terms, and how I believe most typographers reckon the difference. I believe this usage and Kevin's belief that legibility and readability are not distinct can be reconciled.</p>
      <p>I would put it this way: legibility is the property of individual recognisability of letters, and readability is a <em>hierarchical set</em> of properties of text including both perceptual or input properties (recognisability of words, eye comfort) and cognitive or output properties (ease of comprehension, clear use of language, etc.). I suspect Kevin would simply say that what I call legibility is simply another part of the readability set of properties and operationally indistinct from the whole ‘decoding’ process. In his favour, it must be said, we have a word ‘reading’ but no parallel gerund for recognising individual letters and, of course, the etymology of the word legible is synonymous with readable. Further, since Kevin maintains that we recognise words by recognising their constituent letters, ‘leg-ing’ is simply part of reading.</p>
      <p>Yet it remains the case that recognisability of individual letters -- within the superset of properties that constitute readability -- is distinct from other properties, and why shouldn't it have a name. Further, because the set of properties is hierarchical, each property relying on the lower properties, one can say of legibility, as the foundational property, that it is necessary but not sufficient for readability. In the same manner, one can say that word recognition is necessary but not sufficient, or indeed that any of the perceptual properties are necessary but not sufficient: it is perfectly possible to recognise all the words in a text and still not understand what the text means. [Yes, I think reading requires comprehension, and if we have not understood something -- even imperfectly or incorrectly -- then we have not really read. I know how to pronounce Latin, such that I can speak it aloud from a text and am good enough at recognising Latin words that I can sight sing them. But I can't read Latin, and need to refer to an English translation to understand what I am singing.]</p>
      <p>The ‘not sufficient’ clause of legibility may be expressed this way: individual letters may be recognisable while not contributing positively to readability. This is easily demonstrated. These four letters are all legible: <em>d</em> <strong>r <em>w</em></strong> o. But would a <strong><em>w</em></strong>o<strong>r</strong><em>d</em> set in this manner be readable? Would a page of such words? Letters of different sizes may be legible, but do different size letters make readable words when mixed together? [Building on an idea I put forward in my lecture at St Bride's, one can summarise all these distinctions by saying that letters of different spatial frequency may be legible, but will they create readable words when mixed together?]</p>
      <p>It seems to me that in order for an operational distinction between legibility and readability to be ignored, it is necessary to assume consistency of letter proportions, style and weight, i.e. to assume the characteristics of a single typeface applied to, at minimum, words. Much of the time, this is a very reasonable assumption. But only because type designers have already absorbed and applied the assumption.</p>
