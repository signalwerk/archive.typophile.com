      <p>&gt;William, I think you’re proposing that for any typographic variable that one condition will never perform best in all tests.</p>
      <p>No, I didn't and I'm not proposing that. I don't pretend to know about all conditions in all circumstances. </p>
      <p>What I am saying is simply what is regarded by type designers for a very long time as fundamental: different designs are most suitable for different purposes: very small type, extended text, headings, display, screen, newspaper, etc. So *some* conditions are best changed, depending on the intended purpose of the type. </p>
      <p>And the changed conditions affect readability under different circumstances, such as size, print medium, or computer screen. </p>
      <p>In the case of agate proportions, I would be willing to bet money that a face with such proportions will not beat out in readability (measuring speed comprehension and comfort) a good text face like Minion in print at normal sizes and decent layout. </p>
      <p>I do think that somewhat longer extenders have a readability advantage at normal sizes, but I concede that this is going to be hard to test. I think it is most likely to show up in the tests I have mentioned--either the one using the SAT or the frequency of proofing errors. </p>
      <p>I do think that such tests--rather than under small sizes, low light, etc.--are also most likely to enable us to identify reliably the characteristics which make screen less readable than print, the effects of spacing, etc.</p>
