      <p>John, following up on David's comment, it seems more informative to me with type to talk about narrow phase alignment, than having a consistent spatial frequency. You seem to associate the latter with weight. I'm not following here. I associate the former with distribution of role-unit level information. Weight I associate with salience and cue value.</p>
      <p>Bill, to phrase my frustration another way:<br>
      I ask, what is legibility about.<br>
      You say ease, which equals speed + comprehension + comfort.<br>
      I say, ease of what?<br>
      You say, identification or deciphering.<br>
      I say, yes, but do you mean by these the gathering, streaming and assembly of the criterial visual information, which I think has to be, following Pelli and others, assessed at the role unit or distinctive feature level?<br>
      You say, maybe, but let's not get into that to deeply because it gets confusing / it's a swamp / others will recoil / 'deciphering' or 'identification' is clear enough for me.<br>
