      <p>Bill: <em>I can put the theory without using the terms readability and legibility: the type that can be decoded best in difficult circumstances—distant, small, low light—is not the type that reads most quickly with comprehension and comfort in normal circumstances in print at text sizes.</em></p>
      <p>I can go one better:</p>
      <p>The type that can be decoded best in circumstance A is not necessarily the type that can be decoded best in circumstance B.</p>
      <p>It is easy to imagine two extreme but distinct circumstances, e.g. very small type or type viewed at an angle, in which different types will perform better. From this it follows that the same may be true of the circumstance of 'normal' or preferred reading conditions.</p>
      <p>I think contrasting normal conditions with undifferentiated 'difficult conditions' is misleading, because each distinct condition may favour selection of a particular typeface. There are different kinds and degrees of difficult condition, and what more or less characterises typefaces that are optimised for these conditions are describable as distortions away from the characteristics of traditional text types. So to posit that any one such distortion will be better decoded in circumstance B because it was better decoded in circumstance A seems to me foolish.</p>
