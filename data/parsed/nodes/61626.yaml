      <p>First, I should have kept to the definition of legibility in "Types of Typefaces": "legibility is based on the ease with which one letter can be told from another." By keeping legibility to letters, and readability to words in extended text, the distinction is cleaner. I used a different definition: what can be read best under difficult conditions vs good conditions. </p>
      <p>Kevin: "I don’t take this as evidence that legibility and readability are distinct, because there was no finding here that could have falsified the hypothesis that legibility is distinct from readability. If Arditi &amp; Cho had found that lowercase performed better under stressful conditions would you say that legibility and readability are the same? Likely no."</p>
      <p>Any claim that "you can find that x and y behave differently in some way" is not in a refutable form--you are correct. However, if you specify the ways in which they should differ, the list is finite and it becomes testable. And I did give the list: speed, comprehension, and comfort. Further the hypothesis that "x and y never behave differently" is in a refutable form, and refutation and finding of a difference is enough to establish the utility of a distinction. And in this case the hypothesis of no difference is refuted. </p>
      <p>Arditi and Cho have refuted the claim that there is no difference. For they found that speed in reading at 50% accuracy is different between all caps and normal mixed case of the same point size under difficult reading conditions, but these differences disappear for normal readers at bigger size. That is a difference. If the same holds for identifying single letters--and in their tests ability to identify single letters was a factor--that would establish the difference under Lieberman's clearer definitions as well.  </p>
      <p>I'm sorry I missed your Sept 4 statement saying that the question remained of the reason for the differences between Arditi &amp; Cho and past results; had I read it, I would not have been so skeptical about your willingness to experiment on this issue. But I am still curious as to what earlier studies made you think that the same design conditions are equally legible (speed + comprehension, leaving out comfort) under difficult conditions and easy ones? </p>
      <p>I would be delighted if you are willing to do experimental tests on this issue. If you are, another test of readability under relatively good reading conditions is frequency of proof-reading mistakes. It is widely recognized that it is easier to proof extended text on paper than on the screen, so that, as well as the timed test of speed + comprehension with difficult material, seems to me a promising indicator of readability.</p>
