      <p>Re. spatial frequency</p>
      <p>My understanding is that spatial frequency involves both quantity of periodic changes across space and quality of the transitions between those changes. So yes, it relates to weight, because different weights of type have different spatial frequencies due to different arrangements of dark and light shapes within the same area. But it also relates to what I call stroke density, and the resulting quality of the transitions between dark and light shapes, and this is an area in which type on screen differs significantly from type on paper and, indeed, in which different kinds of rendering on screen differ significantly from each other, and how different monitor gammas make type in the same rendering differ, etc. However, insofar as within any one of these conditions the letters have consistent spatial frequency, spatial frequency can be isolated as a factor.</p>
      <p>I should also clarify that when I talk about ‘consistent spatial frequency’, what I mean is restrained within a single spatial frequency channel. In other words, the reader doesn't need to change channels in order to be able to perceive different letters in a word. Within this channel, there is obviously quite a lot of room for variation of letterforms -- enough to allow of all these typefaces -- so consistency in this case does not imply uniformity.</p>
