      <p>“What is the theory…” [Kevin]</p>
      <p>I'll propose one.</p>
      <p>At thresholds simple discrimination affordance issues become the dominant and limiting factor, and these depend on 1) the detectability of distinctive features like closure, aspect and where role architectural components meet; 2) the difference in perceptual distances between lower case glyphs as compared to the perceptual distances between the comparable glyphs in upper case.</p>
      <p>At peaks or performance plateaus issues surrounding the the rapidity and automaticity of ‘visual word-form resolution’ or ‘gestalt processing’ become the more decisive factor. Here gestalt integrity is probably the dimension around which performance varies.</p>
      <p>The consequence of this is that adjusting the size of counters or the proportions of the letters relative to each other at agate sizes to enhance threshold-level performance might create problems with the rhythmic tuning of counters and the phase alignment beneficial to robust, rapid and automatic visual word-form resolution on the plateau or at the peaks. As well, the phasal structure of an all caps setting and the relatively greater salience of the whites in caps that an agate setting allows (compared to all lower case or conventional upper and lower case) might be beneficial to the subject's making out what's there at thresholds, but suboptimal for gestalt integrity at peaks or plateaus.</p>
