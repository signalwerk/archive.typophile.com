      <p>I find it easier to work with the definition that legibility is the ease with which letters can be absorbed and readability is the ease with which sentences (or any larger amount of text) can be absorbed.</p>
      <p>John proposed that there are effects of readability that are independent of legibility, such as consistency of spacing and consistency of letterform. </p>
      <p>Therefore, it is possible to have good legibility, but poor readability by badly spacing well designed letters, or by combining well designed letters of different typefaces.</p>
      <p>Is it possible to have the converse: poor legibility but good readability? Or is legibility a subset of readability, so letters with poor legibility will always also have poor readability?</p>
      <p>Are lowercase letters an example of poor legibility but good readability? Ignoring the Arditi &amp; Cho findings, uppercase letters perform better in letter recognition tests, while lowercase letters perform better in sentence or passage reading. </p>
      <p>If lowercase letters are an example of poor legibility but good readability, is it because lowercase text tends to have better spacing or letter design consistency than uppercase?</p>
