      <p>Kevin, this paper tells us little about the readability of extended text by readers with normal vision under good conditions, as opposed to the legibility of a few words under difficult conditions.</p>
      <p>In fact this paper's results, together with others they reference, support the reality of the distinction between readability and legibility.</p>
      <p><strong>A misinterpretation</strong> </p>
      <p>But first of all let me clear up one misinterpretation, to some extent by the authors, and also by you.   </p>
      <p>&gt;Arditi &amp; Cho argue that uppercase letters are more legible than lowercase letters, even when the size differences are taken into account. I think they are right.</p>
      <p>First of all, contrary to what you infer, they do not establish that Caps are more readable when size differences are taken into account. As they relate, Smith, Lott and Cronnell (1969) found that when you compare x-height caps with lower case, lower case wins in legibility. As they say, there is really no apples-to-apples comparison here, but you can also use simply the caps of the same font size. </p>
      <p>However, when you do use caps of the same font size, these are bigger in the sense that you have more white space within the caps than within lower case letters--which the Clearview Highway tests indicate is a key to legibility. Further, when everything is larger, they say the caps' advantage in legibility tends to disappear. Thus the more accurate inference from their data is that size of counters is critical to legibility, not that caps have a special advantage.       </p>
      <p>I think the authors also wrongly interpret that their results conflict with Tinker's, because, if I've got it right (I haven't read Tinker), Tinker had readers with good vision reading continuous text under normal conditions. </p>
      <p><strong>What Arditi and Cho were testing</strong></p>
      <p>In Arditi and Cho, their main tests paper create very difficult reading conditions. The words are deliberately made hard enough to read that readers miss the correct words 50% of the time. In some cases the difficulties were created by readers' poor vision, and in others by making the text small or far away enough that acuity of those with normal vision declined precipitously.</p>
      <p>Thus they were testing "legibility" in the sense of ability to decipher words under difficult conditions, not speed and comfort of reading with good comprehension, under good conditions, or "readability".</p>
      <p>Hence under this long-standing typographer's distinction, the results of Tinker and Arditi and Cho are consistent, and complementary. The readability of all caps of the same point size of a font is lower, but the legibility is higher--because of larger visual size.   </p>
      <p>I don't know what your view is, but this paper does NOT establish that there is no difference between readability and legibility, nor that caps are more readable.</p>
