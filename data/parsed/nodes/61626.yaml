      <p>“Participants (33 nurses) were searching for drug names such as ’Hydroxyzine &amp; Phentolamine’ in a 10 × 10 matrix of different drug names.”</p>
      <p>I was going to say that using such antiquated drugs as these would almost guarantee lack of familiarity to the nurses in the study. But then I saw that the paper dates from 1967.</p>
      <p>This however brings me to two further points: firstly, it is quite possible that the nurses engaged had no more familiarity with those names than Mr Dean's hypothetical high school students. The practice of using generic names such as phentolamine &amp; hydroxyzine was much less common in 1967, and the proprietary names (brand names) would probably be much better known to the nurses involved. And secondly, the problems of the literature around this issue do not seem to have changed much since then. Others have pointed out that the methods, materials and outcome measures used in readability/legibility studies (I'm ducking that one) are not standardized, and therefore there isn't a comparable set of research studies pointing to a reproducible outcome. You can always find at least one study to reinforce your preconceptions, if you so desire.</p>
      <p>It is perhaps similar to Alex Poole's review of the literature on readability of sans vs serif -<br>
      <a href="http://www.alexpoole.info/academic/literaturereview.html" title="http://www.alexpoole.info/academic/literaturereview.html">http://www.alexpoole.info/academic/literaturereview.html</a></p>
      <p>Paul Hardy<br>
      UK</p>
