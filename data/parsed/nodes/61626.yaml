      <p>Okay, another Enne-Bomb.</p>
      <p>I have grave difficulties with the terms of reference in these debates.</p>
      <p>On the one hand, for Kevin, decoding is decoding. On the other hand, Bill and company refuse to seriously address issues of construct validity and quickly resort to easy operationalism.</p>
      <p>[Kevin] “We use that light to recognize features, which we build up into recognized words. We read one word, then the next; our eyes move in predictable patterns. Environmental conditions can be good or bad, <em>but the eyes do the same thing under any condition</em>.”</p>
      <p>The eyes might do the same thing under widely diverse environmental conditions, but does the visual cortex follow suit? The possibility exists that under good conditions the visual cortex “build[s] up features into recognized words” one way, and that it does so another way in poor conditions. I tried to contrast these two ways in my TypeCon Atlanta presentation. Denis Pelli draws a similar contrast in his “The uncrowded window of object recognition” when he says “some objects are recognized through a single combining of features over the whole object, whereas other objects require separate combining over each of several regions of the object.” His work demonstrates that both happen.</p>
      <p>The relevance of this is that the distinction could anchor a stronger differentiation of readability and legibility, where legibility becomes associated with performance under conditions in which the latter (slot-processing, as I like to call it) is provoked, and readability becomes associated with performance under conditions in which the former (a single combining) is enabled. This might not be entirely satisfactory however, because it doesn't tell us which functional dimensions of perceptual processing in reading legibility and readability relates to.</p>
      <p>I tried to lay a basis for specifying which functional dimensions are in play in legibility as distinct from readability in my earlier post. This post contrasted perceptual discrimination affordance with another kind of affordance which I associate with rapid automatic visual word-form resolution. Pelli draws a similar contrast when he differentiates between feature detection and feature integration. So then legibility becomes associated with performance under conditions in which the slot-processing is provoked and perceptual discrimination affordance comes into play; and readability becomes associated with performance under conditions in which the former (a single combining) is enabled and issues surrounding and extending the rapidity and ease of visual word-form resolution ( a single “transglyphic” gathering or combining) come into play.</p>
      <p>This brings me to my ‘refusal to address’ complaint with Bill and company. Kevin raised the ‘construct validity’ question. Ole Lund in a Reading dissertation made it the key issue in Legibility research, and complain about the dependence on easy operationalism to make up for it. Bill, leaning on Popper, doesn't want to get into endless terminological debates, but in my opinion sustained reflection on the construct validity of the terms and a social contract is the only way to resolve terminological disputes. (I almost wrote ‘therminological’, I guess because these disputes get heated.)</p>
      <p>Neither the avuncular Ben Lieberman definition or it’s Berksonian replacement are fully serviceable. Why? Because Uncle Ben’s definition doesn’t specify what in psychophysical functional terms eyes moving along a line, or telling one letter from another, or —most flagrantly — eyes absorbing messages are. This doesn't make the definition garbage. It just makes it unserviceable for eliciting informative interpretations of empirical data, no matter how it is operationalized.</p>
      <p>Bill’s definition leaves unexplained whether or not the contrast between deciphering and reading is intended or not, and if intended, what in function perceptual processing terms distinguishes the two. Again, this doesn't make the definition garbage. It just makes it unserviceable for eliciting informative interpretations of empirical data, no matter how it is operationalized. What I find potentially useful in Bill’s replacement is the difficult versus optimal contrast, because I can relate them to different positions on the typical reading performance curve, which, no matter what the variable, typically show a steep rise in performance, than a wide plateau followed by a gradual decline.</p>
      <p>So while I am sympathetic to Kevin’s complaints I am frustrated by the unquestionably attractive and ostensibly benign straightforwardness of his scheme. And while I am sympathetic to Bill and company’s insistence that the broad experiential sense of distinguishable dimensions (which has crystallized into language) is real and able to be investigated, I am frustrated by his willingness to leave them be floating signifiers in terms of what in psycho-physically tractable perceptual processing or functional affordance terms the one as distinct from the other has a bearing on.</p>
      <p>What my provocations lead to in the context of the topic for this thread is a partial explanation of why we tolerate all caps on signage but are annoyed at them in extended text unless perhaps when they are used in the Bob, Bath comment to the story at the opening link.</p>
