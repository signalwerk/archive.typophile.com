      <p>Christopher, Typophile has followed the Talmudic model: if a more interesting topic comes up in the course of a discussion, that new topic is followed, and recorded. That's fine with me, because I love the Talmud. The main drawback might be that the topic title is misleading, but in the case of the internet, everything is indexed anyway, so the topic title actually has no special significance in search. </p>
      <p>Also the new topic is not capital letters vs lower case, but legibility and readability. So why not leave well enough alone? What is gained by breaking the thread? I don't see it. And what is lost is something: the continuous narrative findable in one search. </p>
      <p>*</p>
      <p>At any rate, I wanted to clarify that there are several different issues here. One question is how legibility of letters in difficult conditions relates to their legibility in optimal reading conditions. It does seem that this is different. Another issue is how the identification of letters under optimal conditions relates to the identification of words. Neither Lieberman's definition nor my earlier one above--not so good--really captures that there are two issues here. </p>
      <p>On the issue of what more there is to reading than identifying letters, I mentioned in my TypeCon talk three things: good rhythm, even color, and the formation of a word image or "gestalt" or "bouma". I do think it should be pretty easy to show that uneven spacing eg destroys the Word Superiority Effect. But this does not yet prove that "gestalt" effects are happening. This is because what may be critical is just that the letters fit into a grid. The brain may impose a grid, and look for letters within it. So the disrupted spacing may just affect our ability to identify letters. </p>
      <p>Still, is might be possible to separate the two effects by seeing whether it is significantly more difficult to identify letters in unevenly spaced non-words vs evenly spaced non-words. When testing is done in all variations for both words and non-words, I think the result would be interesting. </p>
      <p>I am also struck by how deadly mixing italic and roman is to readability. Testing the effects with words and non-words would also be interesting as to what it says about our mental grid or matrix.</p>
