      <p>Bill: <em>And of course it doesn’t have to be made to type designers, who have by and large been very sensitive to these issues.</em></p>
      <p>Although I suspect, insofar as type designers think about <em>why</em> they are sensitive to evenness of colour and rhythm, they probably do so in aesthetic terms or, if they relate it to reading, they do so intuitively, anecdotally, or presumptively. This is why I am excited about Denis Pelli's spatial frequency study, because it suggests to me a strong perceptual bias for evenness of colour and rhythm: we will read more faster and more comfortably if we do not have to adjust to different spatial frequencies. That strikes me as a key insight into <em>why</em> we're sensitive to evenness of colour and rhythm, i.e. sensitive to maintaining consistent spatial frequency, within a single channel.</p>
