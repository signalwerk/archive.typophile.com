      <p>&gt; I don’t know what your view is, but this paper does NOT establish that there is no difference between readability and legibility</p>
      <p>I’ve never quite understood the division of labor between legibility and readability. Can something be readable without being legible? I would propose a different division for reading: decoding and comprehension. Decoding is the ability to recognize words. Typographic quality is important here, but knowing the letters of the alphabet and the cipher between letters and sounds is a big part of this. Comprehension is the ability to make sense of the series of words. Under normal conditions comprehension is the limiting factor for reading speed. Easy-to-comprehend Harry Potter can be read faster than a difficult to understand book of philosophical writings. The philosophical writings take longer to comprehend even if the typographic quality is amazing.</p>
      <p>&gt; The words are deliberately made hard enough to read that readers miss the correct words 50% of the time.</p>
      <p>While typographic quality does result in reading speed differences in normal conditions, the differences have to be pretty large to detect them. The time spent comprehending the philosophical writings can swamp any effect. Without running hundreds of people (as Tinker did), differences will frequently be missed. Instead it has become common to test typographic quality by measuring words under time or size constraints. The Clearview study was a size constraint study for instance. Typographic conditions that are easier to read under time or size constraints will also be easier to read under normal conditions.</p>
    html_clean: |-
