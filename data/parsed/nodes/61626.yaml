      <p>Yes, the theory that any typographic variable (e.g. uppercase versus lowercase) will show that one condition (e.g. uppercase) performs best in all tests has been refuted. I will have to develop a better theory.</p>
      <p>William, I think you’re proposing that for any typographic variable that one condition will never perform best in all tests (speed, comprehension, comfort, size threshold, and time threshold). I think I can refute that with a thought experiment: I hold the firm belief that 12 point text is a better size for reading than 2 point text (I am hopeful that everyone else holds this impression too). I believe that 12 point text will perform better than 2 point text in all of these tests.</p>
