      <p>David: <em>How about now? Can I talk about crappy anti-aliasing scaling now?</em></p>
      <p>Only if you take into account what else I wrote: ‘However, insofar as within any one of these conditions the letters have consistent spatial frequency, spatial frequency can be isolated as a factor.’ In other words, the fact that spatial frequency varies across reading conditions is irrelevant to the impact of <em>change</em> in spatial frequency so long as it is consistent within a single reading condition, whether that condition is deemed positive or negative. Crappy anti-aliasing scaling is a (presumably negative) reading condition.</p>
      <p>Now, independent of the impact of changes in spatial frequency on reading, there is the separate question of whether specific spatial frequencies are better or worse for reading. And in looking at this question, you need to isolate different factors to determine the specific effect of changing spatial frequency within a particularly reading condition. This is where you can start talking about crappy anti-aliasing, as resulting in a specific spatial frequency. What can we say about it? Well, it is a relatively low spatial frequency, because we're losing sharp edge contrast. Is it worse for reading than a higher spatial frequency and sharp edge contrast? Is there a point at which edge contrast becomes too sharp, at which reading benefits fall away? Or is the sharpest edge contrast permitted by the medium always to be preferred, all else being equal?</p>
      <p>And just try getting everything else equal!</p>
