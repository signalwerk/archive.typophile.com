      <p>Peter, the specific hypotheses I discussed with Kevin are refutable, as I said. And I explained the experiments to test readability. </p>
      <p>I think the demarcation between identifying letters and reading words in text is useful, but I'm ready to drop it in an instant if it's not helpful. It's not important. If you want to separate different aspects of readability, such as speed, comprehension, comfort--or different aspects of comfort--that is fine. There is no need to have a precise definition of readability, or legibility. There is a need for better theories of how all these factors work in reading. </p>
      <p>I think my disagreement with you about scientific method is over how much should be stuffed into terminology, and how much should be put in theory. I am saying that the ideas should should be put into theories. Theories are statements, and can be testable. Terminology is never testable, only useful or not. </p>
      <p>Theories are statements connecting different terms, as in "mass = force x acceleration." The sciences that have grown most successfully focus on testing the statements, not inventing or defining new terminology. I think that if physics spent its time on first getting the definitions of mass, force, and acceleration right, there would still be no physics. Instead there would be a mass of terminological disputes, with little progress.   </p>
      <p>I know that Popper's advice in this situation would be to focus on creating theories to solve the problems of how we read. His view was that new terminology should be something that is forced on you to express your explanatory theories, not something you seek as a way to the truth. Pursued directly, they are a path to the swamp, not to the truth.</p>
