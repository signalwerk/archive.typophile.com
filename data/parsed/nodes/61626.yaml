      <p>&gt; Recognising a word or two in a matrix has almost nothing to do with reading an extended text passage, IMHO</p>
      <p>I think they’re very similar.</p>
      <p>When you read an extended passage you look at a single word, recognize it, and move on to the next word. If the next word is a function word or other frequently occurring short word, you may not have to move your eyes to recognize it. Most of the time you will move your eyes to the next word in order to recognize it.</p>
      <p>When you read the words in a matrix you will look at a single word, recognize it, and move on to the next word. You will always move your eyes to the next word as there are not function words or other high probability words in the matrix.</p>
      <p>The higher level processes of understanding the syntax and semantics will be greatly different, but the low level processes of recognizing words will be the same.</p>
    html_clean: |-
