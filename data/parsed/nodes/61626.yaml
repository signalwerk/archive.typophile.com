      <p>Kevin: <em>Typographic conditions that are easier to read under time or size constraints will also be easier to read under normal conditions.</em></p>
      <p>Is that a hypothesis or an observation?</p>
      <p>It seems to me possible that, just as difficult content such as your ‘philosophical writings’ can diminish or overcome positive effects of reading speed derived from good typography, so ‘normal conditions’ might diminish or overcome the positive effects of some typographies under time or size or other constraints. Consider two different typefaces or settings: just because one is more easily read than the other at 6pt does not mean that the same type will be more easily read than the other at 12pt. It is entirely possible that the one is better suited to 6pt than the other, but that both might perform equally well at a larger size or, even, that the other type is better suited to use at 12pt.</p>
