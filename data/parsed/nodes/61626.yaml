      <p>&gt; Please address the issue of the different results of Arditi and Cho on one hand, and Tinker on the other. For they, as I understand it, are tests of legibility, on one hand, and readability, on the other.</p>
      <p>On Sept. 4 I said “I think the unanswered question is why does this study differ from earlier studies that found that lowercase is read faster than uppercase?” I agree that the Arditi &amp; Cho findings are divergent from other findings, and that there is something interesting to be learned when a type decoded best in circumstances A is not the same as a type that is decoded best in circumstances B.</p>
      <p>I don’t take this as evidence that legibility and readability are distinct, because there was no finding here that could have falsified the hypothesis that legibility is distinct from readability. If Arditi &amp; Cho had found that lowercase performed better under stressful conditions would you say that legibility and readability are the same? Likely no.</p>
      <p>Similarly, I hypothesized that agate proportions would perform better both in a legibility/threshold test and in a readability/ reading speed test. This obviously goes against typographic wisdom and could be proven wrong – falsified. If agate proportions perform better in a threshold test and reading speed test, would that falsify that legibility and readability are distinct? Also likely no.</p>
      <p>&gt; Sorry to have been so brusque, but what upsets me is that you seem to dismiss the difference as non-existent or not worth testing, even though you now concede that your theory is untested.</p>
      <p>Yes, I am challenging the theory that readability is distinct from legibility because I am not convinced by it, but that doesn’t mean I don’t think it’s worth testing. I am looking for a meaningful test of the theory. As you know a test isn’t meaningful if the theory fits equally well with any result. There has to be a finding that the theory absolutely can’t coexist with, else it is a useless theory.</p>
