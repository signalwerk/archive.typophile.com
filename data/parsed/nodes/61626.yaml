    html: "<p>Joe, the challenges to legibility in low resolution environments, which may affect one script more than another, are generally not anticipated in the development of writing systems. Also note that in the full comment from which you quoted, I contrasted ‘poorly’ with ‘good enough’. I stand by the comment, because I do believe that writing systems are intended to be read, and are read, and this implies that the shapes used within those writing systems are indeed ‘good enough’ for reading, presuming that they are legibly made. And that's the kicker: legibility of forms within a writing system means something like ‘ability to be made in a legible way that is good enough for reading’, not inherently legible or illegible. This leaves the onus on writers and type designers to interpret the normative forms in ways that are more or less legible. And this is what we do: we don't invent new letters in order to be more legible, we interpret the existing letters. This leaves the door open to styles of writing that are less legible than others, some deliberately so.</p>"
