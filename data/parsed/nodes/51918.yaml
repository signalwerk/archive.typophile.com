    <p>It took three years, almost to the day, but yesterday I delivered the steel cabinets containing eight drawers filled with lovely old dowagers of hand engraved type to the Hill Memorial Library Special Collections at Louisiana State University.</p><div class="imageWrap"><img src="http://typophile.com/files/Die_5429.Drawer4typophile.jpg"></div><p></p>
    <p>Most of these are personal monograms, family crests and seals from local New Orlean private social clubs and organizations.  One drawer is filled with monograms that would be identical were it not that each has a different combination of initials.</p><div class="imageWrap"><img src="http://typophile.com/files/Die_5339.Drawer4typophile.2.jpg"></div><p></p>
    <p>Some look as if they were engraved in the 1930s.</p><div class="imageWrap"><img src="http://typophile.com/files/Die_4778.Drawer4typophile3..jpg"></div><p></p>
    <p>And others look just a little bit older.</p><div class="imageWrap"><img src="http://typophile.com/files/Die_6510.Drawer4typophile.4.jpg"></div><p></p>
    <p>Here are some close-up of them:</p><div class="imageWrap"><img src="http://typophile.com/files/Die_5286.Drawer4typophile.5.jpg"></div>  <div class="imageWrap"><img src="http://typophile.com/files/Die_3759.Drawer4typophile.6.jpg"></div>  <div class="imageWrap"><img src="http://typophile.com/files/Die_6258.Drawer4typophile.7.jpg"></div>  <div class="imageWrap"><img src="http://typophile.com/files/Die_6419.Drawer4typophile.8.jpg"></div>  <div class="imageWrap"><img src="http://typophile.com/files/Die_6409.Drawer4typophile.9.jpg"></div>  <div class="imageWrap"><img src="http://typophile.com/files/Die_4838.Drawer4typophile.10.jpg"></div>  <div class="imageWrap"><img src="http://typophile.com/files/Die_6418.Drawer4typophile.11.jpg"></div>  <div class="imageWrap"><img src="http://typophile.com/files/Die_4123.Drawer4typophile.12.jpg"></div>  <div class="imageWrap"><img src="http://typophile.com/files/Die_3997.Drawer4typophile.13.jpg"></div><p></p>
    <p>Ironically, during the same visit I also delivered ten oral histories from graphic artists, designers, type salesmen and printers in south Louisiana—each in its own little MP3 file on three DVDs.  This part felt so modern, and yet, the histories go back more than ninety years.  And some of these half inch thick steel dies are even older.</p>
    <p>On my way home I stopped at our local grocery store and ran into the son of one of the engravers whose work is now part of the Hill Memorial collection.  I asked him, "Are you guys still engraving?"  </p>
    <p>"Half and half, I'm working a lot of constructin these days."  Which happened post-Katrina.  "We picked-up a client out of Jersey but only get one job at a time.  Used to be our clients sent in orders five dies at a time, not anymore."</p>
    <p>"Yah," I said, "we all gotta make a living."  <a href="http://hill.blogs.lib.lsu.edu/" title="http://hill.blogs.lib.lsu.edu/">http://hill.blogs.lib.lsu.edu/</a></p>
