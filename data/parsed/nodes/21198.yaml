      <p>One way I know is by using the script <strong>BreakFrame</strong> contained in the InDesign Scripts package: <a href="http://www.adobe.com/products/indesign/xml_scripting.html#sresources" title="http://www.adobe.com/products/indesign/xml_scripting.html#sresources">http://www.adobe.com/products/indesign/xml_scripting.html#sresources</a></p>
      <p>From the ReadMe file, “Removes a selected text frame and its contents from a story”.</p>
