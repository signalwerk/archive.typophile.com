  html: |-
    <p>I’m preparing to pass a file off to a less-computer-savvy boss that I have been interning for this summer, and I was asked to create a document (“template”) for her that should could easily edit text in.</p>
    <p>I’m trying to unlink text frames from a text thread without deleting their contents or having to reformat the rest of the thread—all I want is each text box to stay in their own respective spot. Is this an impossibility, or am I missing something?<br>
    Thanks!</p>
