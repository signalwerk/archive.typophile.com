      <p>&gt; <em>I’m not at all familiar with InDesign Scripts</em></p>
      <p>You don’t need to. It’s _very_ simple to use them. You just have to download the scripts and place them in [InDesign folder]/Presets/Scripts/. Then it’s just a matter of bringing up the ‘Scripts’ palette (Window-&gt;Automation-&gt;Scripts) and start double-clicking. How difficult is that?  ;^)</p>
