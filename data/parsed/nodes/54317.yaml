    <div class="info">Submitted by <a href="/user/108" title="View user profile.">Miss Tiffany</a> : 2.Feb.2009 2.59pm </div>
      <p>For Immediate Release<br>
    Buffalo, NY- February 2nd, 2009</p>
    <p>P22 is proud to announce that it is now offering the TypeSETit collection<br>
    of fonts by Rob Leuschke</p>
    <p>TypeSETit is a type foundry featuring the collected designs of calligrapher<br>
    Rob Leuschke. Rob got his start in the 1980s working as a lettering artist<br>
    at Hallmark Cards.  Eventually Rob decided to pursue a freelance career and<br>
    posted samples of his work online, which led to many requests to purchase<br>
    his lettering designs. In 2000, Rob and P22's International House of Fonts<br>
    came to an agreement giving IHOF the right to distribute five of his<br>
    designs, Corinthia, Imperial Script, Ohley, Petemoss and Ruthie. Now P22 is<br>
    very pleased to announce that it is distributing all 75 Rob Leuschke<br>
    designs. You'll find a script font for every occasion in the TypeSETit<br>
    Collection, whether you need an expressive brush script or elegant formal<br>
    calligraphy. </p>
    <p><a href="http://p22.com/typesetit" title="http://p22.com/typesetit">http://p22.com/typesetit</a></p>
