      <p>I really like it (can read hebrew at a crawl, but can't really understand much). The Lamed is very graceful, and the Ayin's slight droop on the right does feel like the fall of a leaf or branch. I love the way the Nun hugs the following letters in your example. I wonder if the quote marks are a bit too close to the Yod? At a smaller size, might they seem connected? I don't think there would be any confusion on what was written, but for purely asthetic reasons?</p>
      <p>Nice job.</p>
      <p>I'll admit, I don't haven't looked closely at any modern Hebrew fonts since I was living on a Kibbutz in the Northern Galilee...8 years ago.</p>
