    html: |-
      <p>There are a lot of nice forms in this, and the overall impression is very pleasant. There are a few letters, though, that seem a bit too shapeless. This is always a danger in soft designs: letters can become blobby and lacking in dynamism. For the most part, you have avoided this, and most of the letters are nicely rigorous. These are the ones I think need attention: tet, lamed, ayin, and shin. The top part of the tzadi is also a bit weak.</p>
      <p>Compare, for example, the blobbiness of the left side of the tet with the much greater dynamism in he or chet.</p>
      <p>As well as suffering from this shapelessness, the ayin is also a bit dark. You need to compensate the weight where the strokes cross. The adjacent double strokes of the alef also create a bit of a dark spot in text; I would try making the left stroke just a bit lighter to compensate.</p>
      <p>The final forms look nice. It would be good to see another sample with these in context.</p>
    html_clean: |-
