    html: <p><img src="http://www.typophile.com/forums/messages/83/18578.gif" alt="admorph"> <br> <br>It's addmorph with a fake bold applied. I can not find a sample online. <a href="http://www.emigre.com/ArticleCoppingAnAttitude.php">Here is what I did find</a>. Brian Schorn designed addmorph while at cranbrook in 1993 though because it was based upon Twombly's trajan, a licensing dispute ensued and the font was never released.I have no idea where it came from, but I have a copy of this typeface. (?!?)</p>
