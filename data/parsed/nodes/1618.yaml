    html: <p>No Mike, I'm pretty sure, because I recognize the  <br>methodics in constructing the letters, which struck  <br>me when I first saw the face. While Entropy* and  <br>Osprey** are hybrids constructed from two or more  <br>fonts***, this one is assembled by fusing parts of  <br>the next letter in the alphabet of the same typeface  <br>(Trajan by the looks of it). <br> <br>* <b>Entropy</b> is uppercase <i>Missive</i> fused to lowercase  <br><i>Memphis</i>. <b>Missive</b> itself looks like a mix of <i>Garamond</i>  <br>and <i>Trade Gothic</i>. <br>** <b>Osprey</b> is basically <i>Entropy</i> with <i>Park Avenue</i> lower- <br>case thrown in for added flavour. How far can you go? <br>*** a popular practice in the deconstructivist heydays  <br>of the early nineties; see also P. Scott Makela's  <br><a href="http://www.emigre.com/EF.php?fid=88" target="_blank"> Dead History</a> (Linotype Centennial and VAG Rounded)  <br>and Max Kisman's <a href="http://www.identifont.com/show?M0" target="_blank"> Fudoni</a> (you can guess which faces).</p>
    html_clean: <p>No Mike, I'm pretty sure, because I recognize the  <br>methodics in constructing the letters, which struck  <br>me when I first saw the face. While Entropy* and  <br>Osprey** are hybrids constructed from two or more  <br>fonts***, this one is assembled by fusing parts of  <br>the next letter in the alphabet of the same typeface  <br>(Trajan by the looks of it). <br> <br>* <b>Entropy</b> is uppercase <i>Missive</i> fused to lowercase  <br><i>Memphis</i>. <b>Missive</b> itself looks like a mix of <i>Garamond</i>  <br>and <i>Trade Gothic</i>. <br>** <b>Osprey</b> is basically <i>Entropy</i> with <i>Park Avenue</i> lower- <br>case thrown in for added flavour. How far can you go? <br>*** a popular practice in the deconstructivist heydays  <br>of the early nineties; see also P. Scott Makela's  <br><a href="http://www.emigre.com/EF.php?fid=88" target="_blank" class="link-external"> Dead History</a> (Linotype Centennial and VAG Rounded)  <br>and Max Kisman's <a href="http://www.identifont.com/show?M0" target="_blank" class="link-external"> Fudoni</a> (you can guess which faces).</p>
