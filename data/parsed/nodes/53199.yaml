    <p>Greater Albion Typefounders have just released (on <a class="freelinking external" href="http://www.myfonts.com/browse/foundry/gatf/ " rel="nofollow"> MyFonts</a>)two new families.  They are both new designs in the spirit of Victorian SlabSerifs.  Firstly, there's Bamberforth:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/c56802086b8f5df8965e0bbf4fc11f_6429.png"></div><p></p>
    <p>which is a family of five faces, and secondly, Eldridge:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/043a3ad534f647ee3819c24b355644_5600.png"></div><p></p>
    <p>a family of three faces.  They should very shortly be on an introductory special offer with a 30% discount.</p>
    <p>Another preview of these faces can be seen at Greater Albion Typefounder's announcements blog <a class="freelinking external" href="http://gatf/wordpress.com " rel="nofollow"> here</a>.</p>
