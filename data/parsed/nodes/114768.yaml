      <p>Without looking at the Volt project it is difficult to visualise exactly what you are trying to achieve but I will have a go:</p>
      <p>1 + 2 Do you have a range of glyphs for mark on mark? These common mark combinations should be implemented with a ccmp feature that will give you the right combination irrespective of the input sequence. These should then get positioned by anchors in the mark feature. The mkmk feature is also used for multiple mark combinations.</p>
      <p>3 Perhaps someone with more knowledge of Apple IOs can answer this but it may be the font requires some AAT tables to work in IOs.</p>
      <p>4 No. You need to convert your anchor positions in FontLab to Volt lookups and groups by writing some Python to generate the Volt data, otherwise it's a very long and laborious effort putting it in by hand.</p>
