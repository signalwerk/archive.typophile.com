      <p>It is I who thank you sir!<br>
      UPDATE:<br>
      The solution to the mark placement problem on the lamalef has been provided by Ustaz Mamoun Sakkal (one of the top experts in Arabic typography) in his note above 19 April, but I did not understand it fully at the time:</p>
      <p>The lamalef ligature has two components.  In the lamalef-mark lookup click Component 1 in the upper right corner. This allows you to adjust the first mark on the lam, and the mark is in black, while there remains an immovable gray mark.  Then click to change the component number to 2, and the second mark becomes black (i.e. it is now the active one) while the first becomes gray.  Adjust the second mark on the alef or the hamza on alef etc.  That is all.  The same process can be used for the الله or  لله ligatures where the number of components are 4 and 3 respectively.</p>
      <p>Thank you Mamoun it works fine now.</p>
