    html: |-
      <p>It means you need two kinds of mark anchors placement below certain initial letters, one type of mark anchor that remain close to the dots under normal conditions i.e. when not preceded by reh and the other type of mark anchor that place marks far below when the letter is preceded by reh.</p>
      <p>So I hope you should have made one lookup for the normal close marks and the image you posted is for the second lookup for the distant marks when preceded by reh.</p>
      <p>In this look up make two changes<br>
      (1) In the header of this lookup in the PROCESS MARKS box replace <em>ALL</em> with <em><strong>BelowMarks</strong></em>. As you do not need the processing of above marks here in this lookup.</p>
      <p>(2) In the lower part of the lookup, you have given the Context Before as &lt;reh&gt; group only while it should also contain the letter to which you are applying the new marks placement. So the context before should look like this containing the following two lines<br>
      <code><br>
      &lt;reh&gt; &lt;Yeh-init&gt; |<br>
      &lt;reh&gt; &lt;BelowMarks&gt; &lt;Yeh-init&gt; |<br>
      </code></p>
      <p>The string in the second line will work when reh also contain below marks. So it should also be added.</p>
      <p>Thanks,<br>
      M.Z</p>
