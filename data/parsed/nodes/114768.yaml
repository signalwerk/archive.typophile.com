      <p>Hi Tamari,</p>
      <p>The grey mark or marks are usually additional marks in a ligature glyph where you can place one mark above or below each letter by alternating the Component number in the above right side of the lookup. If the ligature has two letters, you will have two marks, if it has 3 letters, there will be 3 marks, and so on.</p>
      <p>In your figure, it doesn't appear that any of these glyphs in Position First should be a ligature, so check your glyphs information in the Glyph Editor in VOLT and assign the glyph Type to Simple and Components to 1.</p>
