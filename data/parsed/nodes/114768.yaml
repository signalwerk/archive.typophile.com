    html: |-
      <p>The recommended order for the positioning lookups is<br>
      1-Kerning<br>
      2-Cursive<br>
      3-Mark<br>
      4-MkMk</p>
      <p>I do not use proofing tool at all. It takes a lot of time.<br>
      I use MS Word 2013 to test the font and to quickly view the results of changes made in lookups. Here is how it works. Open MS Word, type the text in your font, type the words that needs some correction in the Volt project.<br>
      Now keep the MS Word open with the written text and start MS Volt, open your font it it, make the required change in the lookups, click on Compile and then click on Save. Now open the folder containing the saved font, right click on the font file and select install from the menu. It will install the font and the MS Word will apply the changes to the text in real time i.e. you do not have to restart the MS Word for the new installed font.<br>
      Also it is not required to ship the font each time for testing in the application, just compile it, save it, and install it.<br>
      It saves me a lot of time.</p>
