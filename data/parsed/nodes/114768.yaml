      <p>If you give some more detail of the problem 1 or add some images it would become easy for others to suggest any solution.</p>
      <p>The problem 2 can be solved by adding a new glyph to the font (if it is not present in your font) containing the shadda and fatha in a combined shape as in the image<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/shadda_fatha_6681.jpg"></div><br>
      Name this glyph as <strong>shaddafatha</strong> or something alse and then add a lookup to the ccmp feature containing the following substitutions<br>
      <code><br>
      shadda fatha  -&gt;  shaddafatha<br>
      fatha shadda  -&gt;  shaddafatha<br>
      </code><p></p>
      <p>It will produce the required results.</p>
