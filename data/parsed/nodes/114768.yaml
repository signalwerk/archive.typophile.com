    <p>Salaams -  5 years and 39 weeks have passed since a group of us  started this  typophile special interest group! </p>
    <p>I am trying to finalize the OT version of my AlQuds font (started in the 1960s!).  Some final problems in VOLT:</p>
    <p>1- How to create a lookup for a case when two marks are elevated on top of one glyph at a given height.  The first mark shifts up OK but the second one overlaps it.  There is a separate lookup for Marks on Marks  which works fine when the marks are at their "normal" height above the anchor is there a conflict with that?  </p>
    <p>2- When typing a mark then another - for example a shaddeh then a fatha I get shaddeh and fatha on top. But when typing the fatha first then the shaddeh, the shaddeh comes out ontop making it shaddeh kasra!</p>
    <p>3- Why do mark substitutions not work on the Mac, including ios ipad applications?  I have separate glyphs for pairs of marks, and they appear fine in PC applications, but Mac relies on the positioning lookouts.</p>
    <p>4- Do anchors created in Fontlab make their way into VOLT?</p>
    <p>Many thanks<br>
    Vladimir</p>
