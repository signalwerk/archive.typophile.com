    html: |-
      <p>You can download and use the trial version of MS Word 2013 for this purpose. Also you can test the bold style in the same way, just keep the text in bold style in MS Word.<br>
      While working on a font I keep open three windows for a quicker testing (1) MS Word with the (bold or regular) text that need correction (2) Volt with the font project (3) the folder containing the working font files.</p>
      <p>In Volt, make changes in the lookups, Compile it and Save it. then click on the folder tab and install the saved font and then quickly click on the MS Word tab to check the changes taking place. After clicking install, if you were quick in clicking the MS Word tab, you will also observe the changes taking place in the same moment.</p>
      <p> </p><div class="imageWrap"><img src="http://typophile.com/files/image_001_5045.jpg"></div><p></p>
      <p>The anchors are position specific on any specific letter. As you can observe the anchor AbvMrks (green arrow) over the letter laminitial in this image. The red arrow show the marks group that needed to be appear at this anchor position. Here (at red arrow) you can place a group of marks or a single mark or two as you need. </p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/image_002_5742.jpg"></div><p></p>
      <p>If you need 2 different mark positions on the same letter then you will need a new anchor for the 2nd position as shown in the 2nd image. The new anchor is named as AbvMrks2. This 2nd anchor was needed for the placement of two marks only (superscriptalef and maddasuperscriptalef.alt.b) over the same letter laminitial.</p>
      <p>It is better to keep the number of anchors lower in a font. In most cases only one anchor for above marks and one anchor for below marks is enough for all letters. Even for MkMk, the same anchor should be used that is used for Marks. Yes, in certain cases it becomes necessary to create more anchors as observed in the 2 images. </p>
      <p>Now, suppose, if you need two mark positions on Raa, then you should try to use the same 2nd anchor AbvMrks2 for the second position over Raa in the same lookup or in a new lookup as needed.<br>
      Suppose, you needed the 2nd anchor position over Raa for the placement of mark ShaddaFatha only. To do so, add a new lookup, in the first column place Raa, in the second column place only ShaddaFatha and in the third column write down the same 2nd anchor name i.e. AbvMrks2, and it is done.</p>
