    html: |-
      <p>The 2nd Anchor should be locked before adjustment for all marks but it is necessary that you have drawn all the marks outlines at the same position in marks glyphs as shown in the image<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Marks_6169.jpg"></div><br>
      So when you lock the second anchor, all the marks will stick to the first anchor i.e. the cross sign at the locked position and when you adjust the cross sign, to some position, all the marks will also move along with it and appear at that position on the base glyph.<br>
      Now you will also observe in the mark lookup in the lower right side that the second glyph has zero X and Y values as shown in the image below and only the First Glyph values are changing as you make adjustments.<br>
      <div class="imageWrap"><img src="http://typophile.com/files/Marks_1_3745.jpg"></div><p></p>
      <p>Thanks,<br>
      M.Z</p>
