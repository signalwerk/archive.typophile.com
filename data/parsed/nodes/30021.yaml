      <p><em>I liked Powell’s in Chicago (I visited the one near the campus a year ago when I stayed in C for a week) — a nice selection of secondhand books on typography.<br>
      And there was a bookstore specializing in architecture and design in downtown Chicago that had a few cases full of graphic design and type. Can’t remember their name… (old age, I guess).</em></p>
      <p>There's a <a href="http://www.powellschicago.com/html/stores.html" rel="nofollow">Powell's at 2850 N. Lincoln Ave</a>, in Chicago that's usually better than the other stores. It's remaindered or used, and the best (expensive) stuff is in the room in the back. The one at 828 S. Wabash is worth a visit if you have the time. </p>
      <p>I think the other one you're referring to is <a href="http://www.pabook.com/" rel="nofollow">Prairie Ave. Bookshop</a> at 418 S. Wabash in the South Loop. It's mainly an architectural bookstore, but carries the best selection of new graphic design and type books in the city. </p>
      <p>George<br>
      I felt bad because I had no shoes, until I met a man who had no Bodoni</p>
