    html: <p>John, I don't think that script is a font. Notice how the two E's vary. Just to be sure, I did a search for "script" in MyFonts. Zip. There are things that are in the general ballpark, but nothing close to a match. Could be it's not on MyFonts, but I think it's more likely custom. In fact, I'd guess that this EEz-In thing goes back decades as a trademark.</p>
