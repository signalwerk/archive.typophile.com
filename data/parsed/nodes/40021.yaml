    <p>So I snagged this from the latest HOW magazine; it’s a sample of “Market Icons” from Publix Super Markets. I tried identifont and WTF to no avail. Thought I’d serve it up to the experts... also, if no one knows the exact font I’d be interested in recommendations for similar fonts; I was really attracted to the lowered X height and the simplicity of the letters.</p>
