      <p>Identifont is not that useful, I find. They ask a million questions about characters you rarely use like Q and J and fail to ask some very basic questions about the type of font it is, that might narrow things down a lot further.</p>
      <p>WhatTheFont wouldn’t get this either because MyFonts doesn’t carry House Industries fonts. They only search their own database.</p>
      <p>I find Bowfin can be useful for this sort of thing:</p>
      <p><a href="http://www.bowfinprintworks.com/SansIDPage.html" title="http://www.bowfinprintworks.com/SansIDPage.html">http://www.bowfinprintworks.com/SansIDPage.html</a></p>
      <p>(edited, so will fall out of order...)</p>
