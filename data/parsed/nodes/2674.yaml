    html: "<p><i>...would you have trouble equating Christians with Nazi's?</i> <br> <br>What do you mean? If you are pointing out that many people who considered themselves Christians joined the Nazi party and supported Hitler, obviously this is terribly true. If you are pointing to the contribution of 19 centuries of Christian antisemitism in European culture to the making the Holocaust possible, you will get no argument from me. However, if you are suggesting that the tenets of Christian belief and Nazi ideology are the same, then obviously this is not true. They are, at least, different, and most people would agree that they are plainly incompatible: you need to grossly distort one to arrive at the other. <br> <br>Also, I'm increasingly of the opinion that the term 'Christian' is close to meaningless today, and probably has been since long before even the rise of protestantism. There is no religion called Christianity, and the most that can be said is that the term recognises the central position of the figure of Christ in a great number of different religions that do not agree on who or what Christ was.</p>"
