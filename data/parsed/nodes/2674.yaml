    html: "<p>Gerald, there are two things to take into account when comparing different democratic states: one is the mechanism of democracy employed and the other is the political culture of the society. Neither of these things can be considered in isolation, either from each other or from other factors, including external factors, but together they provide a basic understanding of the differences between, say, Canada and Finland. Only some of these differences can be understood in terms of different democratic mechanisms (e.g. first-past-the-post vs. proportional representation); in order to 'accumulate an unimaginable variation of different ideals' you need a political culture that encourages such diversity as well as the mechanism to give voice to it. It also helps to be a relatively small country in which ideas are a greater factor in everyday political discourse than geography and regionalism. <br> <br>Bearing these two things (democratic mechanisms and political culture) in mind, let me answer your question: <i>Is Israel a democracy John?</i> <br> <br>Yes, Israel is a democracy, and in purely mechanical terms, it is much more like Finland than like Canada. Indeed, one can easily argue that proportional representation, which in the Finnish political culture reflects a diversity of ideals, is one of the factors contributing to what you object to about Israeli government policy. For example, extremist settler groups can find a voice in parliament as a result of proportional representation, and can influence voting blocks on issues affecting the occupied territories. At the same time, Israel manages its own 'unimaginable variation of different ideals' -- especially unimaginable to those who see Israel only in terms of the Palestinian conflict --, including a very significant peace movement and a democratic judiciary that has been effectively utilised by human rights organisations representing Palestinians in Israel and the occupied territories. Considering the particular political culture -- and the external factors that contribute to it -- that resulted in the election of Ariel Sharon, you might pause to consider what kind of country Finland would be if it had spent the past 50 years in near-continuous conflict with belligerent neighbours.</p>"
