    html: <p>Israel is a democracy for Jews only. <br><a href="http://www.indybay.org/news/2002/12/1553620.php" target="_blank">http://www.indybay.org/news/2002/12/1553620.php</a> <br> <br><i>political culture -- and the external factors that contribute to it -- that resulted in the election of Ariel Sharon, you might pause to consider what kind of country Finland would be if it had spent the past 50 years in near-continuous conflict with belligerent neighbours.</i> <br> <br>Is it political culture John? Or the morality of its' citizens? Dog pack mob mentality perhaps! <br> <br>Are you saying Finland would be like Israel if it had near-continuous conflict with belligerent neighbours for <i>only  fifty years</i>. That Fins should now turn to genocide exterminating the Swedish settlers still on it's shores. That now, Fins would be entitled to build 14 foot concrete walls around these Swedes, shoot their woman and children, and also any Swede that <i>dare protest,</i> bulldoze their houses, separate them from employment, farms and fields. Cut down their orchards. Rape their women. Common, you know better than that. Fins are fierce fighters, but they are humans. And they like apples. <br> <br>John, assuredly you would be <i>singing in the choirs of protest</i> as would the Americans, your fellow Canadians along with Europeans. You and I both know why. Swedes are <i>Bright White.</i> God didn't make people any whiter than the Swedes. <br> <br>Furthermore John, Finland has only had <i>several years of its' history without conflict and, or occupation.</i> Thanks to <i>Hitler,</i> this changed. <br> <br>Finland gained her independence in 1917, but she was under "continuous attack" and several armed invasions from Russia. The Germans put an end to the threat. After which the Fins drove out the Germans returning to the threat of Russia. This stopped at the end of the cold war. Those conflicts have not made the Finnish people butchers of innocent women and children. <br> <br>T