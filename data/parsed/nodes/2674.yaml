    date_raw: 6 Jan 2004 — 10:45am
    votes: null
    html: "<p>Gerald, if 'Israel is a democracy for Jews only' how come they have representatives of Arab political parties sitting in their parliament? How come they have an Arab judge sitting on their High Court? How come my Arab Israeli friends are able to vote in Israeli elections? How come my Arab Israeli friends would rather be citizens of Israel than of, say, Syria, or even Jordan or Egypt? <br> <br>Understand, I'm not saying that Israeli democracy is anything like perfect, or that the legal position of Arab Israelis can't be significantly improved (not least by prohibiting private discrimination against them by employers, etc.). But it is a calumny to say that Israel is a democracy only for Jews. <br> <br>It is also a calumny to accuse the Israelis of genocide: a calumny against both the Israelis and the Palestinian fighters. When much of the world's media was swallowing the lie that Israeli troops had deliberately massacered civilians in Jenin (a lie that still gets repeated, despite even the report of <i>Palestinian</i> doctors in Jenin that the massacre never took place), the Palestinian Authority was declaring a military victory in Jenin because 15 Israeli soldiers had been killed in the <i>battle.</i> If the Israelis wanted to practice genocide, this whole conflict would be over in a matter of minutes. Instead, Israel puts its soldiers at risk conducting infantry searches for armed militants who have declared themselves to be dedicated to the destruction of Israel -- not to peace, not to human rights, not to a separate Palestinian state: 'Israel will exist and will continue to exist until Islam will obliterate it, just as it obliterated others before it' (Hassan al-Banna quoted in the Hamas Covenant) --; if it were interested in genocide, Israel could level entire towns with missiles without any risk to its own soldiers. As I've said in the past, much of Israel's actions in the occupied territories are immoral and illegal -- including the crime of turning off the water supply to Jenin during the incursion --, but calling it 'genocide' is unsupportable by the evidence of either the method or the result.</p>"
    html_clean: "<p>Gerald, if 'Israel is a democracy for Jews only' how come they have representatives of Arab political parties sitting in their parliament? How come they have an Arab judge sitting on their High Court? How come my Arab Israeli friends are able to vote in Israeli elections? How come my Arab Israeli friends would rather be citizens of Israel than of, say, Syria, or even Jordan or Egypt? <br> <br>Understand, I'm not saying that Israeli democracy is anything like perfect, or that the legal position of Arab Israelis can't be significantly improved (not least by prohibiting private discrimination against them by employers, etc.). But it is a calumny to say that Israel is a democracy only for Jews. <br> <br>It is also a calumny to accuse the Israelis of genocide: a calumny against both the Israelis and the Palestinian fighters. When much of the world's media was swallowing the lie that Israeli troops had deliberately massacered civilians in Jenin (a lie that still gets repeated, despite even the report of <i>Palestinian</i> doctors in Jenin that the massacre never took place), the Palestinian Authority was declaring a military victory in Jenin because 15 Israeli soldiers had been killed in the <i>battle.</i> If the Israelis wanted to practice genocide, this whole conflict would be over in a matter of minutes. Instead, Israel puts its soldiers at risk conducting infantry searches for armed militants who have declared themselves to be dedicated to the destruction of Israel -- not to peace, not to human rights, not to a separate Palestinian state: 'Israel will exist and will continue to exist until Islam will obliterate it, just as it obliterated others before it' (Hassan al-Banna quoted in the Hamas Covenant) --; if it were interested in genocide, Israel could level entire towns with missiles without any risk to its own soldiers. As I've said in the past, much of Israel's actions in the occupied territories are immoral and illegal -- including the crime of turning off the water supply to Jenin during the incursion --, but calling it 'genocide' is unsupportable by the evidence of either the method or the result.</p>"
