    html: <p>&gt;no religion called Christianity <br> <br>Perhaps no single religion, but a group of religions. Any religion recognizing the divinity of Jesus may reasonably be called Christian. This leaves out Jews,Muslims, Buddhists, Hindus and probably Unitarians. Also the belief in original sin, which is closely tied to the belief in the divinity of Jesus, seems to be part of all versions of Christianity. If I remember rightly, this minimal but important commonness of belief was view of the long Encyclopedia Britainica article 'Christianity'. <br> <br>For example, I see on the internet that different Christian groups continue to argue about the historical reasons for and legitimacy of Sunday Sabbath worship - an (irrelevant) issue I mentioned earlier. But all these groups agree on the divinity of Jesus.  <br> <br>It is my observation that how an individual or subgroup interprets and applies the set of beliefs is as important as the beliefs themselves, or moreso, when it comes to how the faith is actually lived.  <br> <br>And happy holidays to all.</p>
