    html: "<p>Stop the frenzy, back on topic, and see what I've found by chance: <br><a href=\"http://www.undt.co.uk/pukkaexplanation.html\" target=\"_blank\">http://www.undt.co.uk/pukkaexplanation.html</a> <br>It's an interview conducted by Steven Heller, for a new book he's working on, about the education of type designers, with Marcus McCallion on his typeface Pukka. <br>McCallion is the mind behind the Undt type foundry and works also with Jonathan Barnbrook on the development of Virus faces. <br>The points expressed in the interview are very similar to what Heller have already said in his many articles and books on the Swastika topic, and McCallion's answers keep underlining what I consider the point, which was, in a very similar way, the same behind Jonathan's own Manson \"craze\", and behind this Microsoft Dingbat silly story. <br>The discussion fostered, of course, from the inspiration behind the Pukka typeface which, needless to say, puts in discussion the demonization of the Svastika and the polivalent meaning of symbols as we already talked about at typographi.ca, using a swastika form (both cw and ccw) for its \"x\" glyphs. <br>That's, more or less, my idea and intention, when I talk of \"redemption\" of symbols put to an ominous use.</p>"
