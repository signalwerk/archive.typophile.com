    html: <p>Freedom of speech is something guaranteed by some <i>states,</i> it is not something guaranteed by companies -- such as eBay --, which reserve the right to discriminate as to what is said or expressed in or via the services that they offer. Freedom of speech means that you won't be arrested, fined, thrown into jail, executed, etc. <i>by the state</i> for saying things, and this is the basis on which it must be judged. It is fair and accurate to observe that some states that affect to guarantee freedom of speech also impose limits on that freedom, but it is neither fair nor accurate to present, as an example of the restriction of freedom of belief, the decision of a company like eBay exercising its rights to define the ways in which its services may be used.</p>
