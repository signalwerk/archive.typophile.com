    <p>Hey, Newb here.  I acquired limited experience in printmaking when I was in school, but I’m far from a typophile. I was hoping someone here would quickly be able to tell me what font the website someecards is using for their greeting cards, since it would probably take me a year of browsing typefaces to figure it out.  I checked it against some of the fonts I know are trendy (i.e. helvetica) but, nothing.    </p>
    <p><a class="freelinking-external" href="http://www.someecards.com/">http://www.someecards.com/</a></p>
