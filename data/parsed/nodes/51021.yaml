      <p>Wow, a big thanks to everyone on some great ideas!  I'm leaning toward Chris' suggestion of Mark Simonson's fonts.  Filmotype Glenlake seems like it might be a good fit.</p>
      <p>Clint: I'm also digging the stroke idea.  I'm trying to think of another way to incorporate it.  I just feel like a script font is too formal.</p>
      <p>fi: that's awesome about IU!  what was your major?  Did you take any telecom classes?  I also appreciate the usability feedback.  I'm definitely hoping to incorporate some additional UI tweaks in the upcoming website revision.  In fact, I am going to be replacing the "Photos" section with "Projects", but I'll probably keep the "Demo Reel" as it'll house my newest demo reel.  I totally hear you about the UI's complexity.  I have freelance clients all the time that ask for something similar in the sites I build for them.  I always have to explain that my site doesn't work for 99% of websites.  Since my job is selling web "bling", I can get away with it, but a normal e-customer would just give up on the site.  In the next revision, I intend to add some additional interactive elements to help clarify that intention tho.</p>
      <p>Keep those ideas coming!</p>
      <p>Thanks,<br>
      Brian</p>
