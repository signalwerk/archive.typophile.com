      <p>Brian, my thought is to pick up on the thick and thin strokes in the little bird logo, and try to find a font that has similar features. I don't know if you would be willing to consider a script, but if so, you might try something like Ribbon 131 Bold (see sample below). Otherwise, perhaps you might try something like Bodoni Italic.</p>
