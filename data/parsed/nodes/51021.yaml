    <p>I'm in the process of overhauling my personal portfolio website.  The old site is viewable here: <a class="freelinking external" href="http://www.BirdInTheCity.com" rel="nofollow">http://www.BirdInTheCity.com</a><br>
    I'm sticking with the vending machine concept, but just updating the graphics/individual pages for a more cohesive/slick/professional flow.</p>
    <p>I'd love some suggestions for picking a new font for the web title/logo at the top.  I'm planning a redesign of the logo, but I'd like to keep a similar general aesthetic.  I'll be using this font in various contexts (business cards, resume, etc), so I'd like for the font to work in many sizes.  On the old site --the one currently posted-- I'm using Frutiger.</p>
    <p>Ideally, the criteria that I'm looking for in order of importance:<br>
    1) Mesh well with the little bird logo<br>
    2) Should denote "Bold, Professional, with a little sense of fun"<br>
    3) Perhaps slightly-retro?</p>
    <p>Any suggestions would be greatly appreciated!</p>
    <p>Thanks,<br>
    Brian Bird</p>
