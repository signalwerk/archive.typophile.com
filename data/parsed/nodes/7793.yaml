    html: <p>I think this was also used famously for the Nightmare Before Christmas logo. This version of Goodfellow was discussed in a typophile thread <a href="http://www.typophile.com/cgibin/discus.pl?pg=next&amp;topic=83&amp;page=15889" target="_blank">here</a>. Scriptorium's Goodfellow bears no relation to Solotype's <a href="http://www.myfonts.com/fonts/solotype/goodfellow/" target="_blank">Goodfellow</a>, which coincidently is discussed <a href="http://www.typophile.com/forums/messages/83/49959.html?1096378563" target="_blank">here</a>.</p>
