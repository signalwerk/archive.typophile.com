    html: |-
      <p>At least InDesign and Quark support contextual alternates and output PDFs. Not sure about the other programs you list, though I'm pretty sure most of them output PDFs. Of course, any program with a glyphs palette that shows all the characters in a font will let you choose alternates by hand, but may not necessarily support the OpenType functionality that will automatically substitute the glyphs. Hope this helps.</p>
      <p>Josh</p>
