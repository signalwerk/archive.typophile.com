    <a href="/node/62683/" title="http://www.typophile.com/node/62683" class="link-kept">http://www.typophile.com/node/62683</a></p>
    <p>A pdf specimen is available. 12 Megs!<br>
    <a href="http://www.typefacedesign.org/2009/" title="http://www.typefacedesign.org/2009/" class="link-external">http://www.typefacedesign.org/2009/</a></p>
    <p>Arrotino uses contextual alternatives for many characters, even forming the "ligatures" in this fashion. (It also supports regular ligatures.)  From the document maker's perspective, what software (that can output pdf's) supports these types of contextual ligatures? InDesign? Quark? MS Word? Serif PagePlus? Scribus? MS Publisher? Others?</p>
    <p>And really, the same question about software that can output e-books.</p>
    <p>This whole contextual alternative stuff is new to me, and I'm just trying to get a lay of the land. Thank you.</p>
