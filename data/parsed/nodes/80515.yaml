    html: "<p>E-books don't work like that: They're an early stage of HTML/CSS and there's no cross platform support for Opentype neither there nor online. Compound ligatures, where the lig is two part and the active part is located in a separate font and applied with f.ex span tag styling in text, would be an option if @font-face was supported across all platforms, but we're not even there yet.</p>"
