    <ol>
    <li>What comes to mind when someone asks for a "dynamic, fresh, energizing and memorable" typeface?</li>
    <li>What about a "lively, clean, readable" one?</li>
    <li>What if your answers aren't the same as my answers?</li>
    <li>What if clients don't like our answers?</li>
    </ol>
    <p>How can we best communicate our subjective feelings about typography? How do <em>you</em> communicate with other people about type? Do you reference a particular aesthetic lexicon or classification system, and are your clients on the same page?</p>
    <p>Cross-posted:<br>
    <a href="http://typedia.com/forum/viewthread/97/" title="http://typedia.com/forum/viewthread/97/">http://typedia.com/forum/viewthread/97/</a></p>
