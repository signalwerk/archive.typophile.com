      <p>Thanks for your concern oldnick. However they are a dependable company estranged from their agency as attention-to-detail errors had started to creep in which were unacceptable for them give the nature of the documents.</p>
      <p>And they've agreed to buy Chronicle! The only concern for them was consistency between their material printed in-house from word or powerpoint and their designed materials.</p>
