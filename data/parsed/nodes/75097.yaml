    <p>Hello,</p>
    <p>I've got a client who's been set up with a look and feel by an agency which they have now asked me to take on and continue. The company is a fund management company so reasonably dry and corporate but a new company with young heads. </p>
    <p>Their initial collateral has been set in Chronicle ( <a href="http://typography.com/fonts/font_overview.php?productLineID=100032" title="http://typography.com/fonts/font_overview.php?productLineID=100032">http://typography.com/fonts/font_overview.php?productLineID=100032</a> ) a tidy corporate font in my opinion. Problem is, since they've parted ways with their agency, they've been using Georgia, the PC default and are now asking me to set an 80 page doc in this clunky font. </p>
    <p>Their overall look and feel is very sophisticated and typographically pleasing. As they deal in millions and billions I'm hoping to convince them to buy me the font but am curious to hear if anyone could suggest an alternative that I could establish as their default print font.</p>
    <p>Reasons for the request are<br>
    a) tight deadline, and I would like to set some pages of their document in the font to show them that:</p>
    <p>b) It's ok for emails and print material to be set in different fonts.</p>
    <p>As an aside, I generally dont agree with a company's main copy font being the same as used in their logo - what do you think? I feel you lose contrast between the copy and logo.</p>
    <p>Thank-you in advance for reading my long-winded request</p>
