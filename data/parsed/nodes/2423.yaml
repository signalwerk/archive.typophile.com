    html: '<p>Puedes decir que hay dos limites minimos basicas: uno para Windows y otro para Mac. Los dos tienen un diferencia de casi 20-25 caracteres; por eso vale la pena suportar los dos. Para detailes exactos, puedes consultar un pagina de "Character Map" en MyFonts. Por ejemplo: <br><a href="http://www.myfonts.com/fonts/emigre/tarzana/narrow/charmap.html" target="_blank">http://www.myfonts.com/fonts/emigre/tarzana/narrow/charmap.html</a> <br>Y tienes que cambiar el "Codepages &amp; Unicode" en la pagina para ver el MacRoman. <br> <br>hhp <br></p>'
