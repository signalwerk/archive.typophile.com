    <p>Not having much luck identifying the typeface used on the original Star Wars posters for the credits and tagline, anyone able to help? Was it a custom, never been digitised or (the most likely option) am I just a poor typeface searcher?</p>
    <p><a href="http://www.cinemasterpieces.com/sw7721-0rolled.jpg" rel="nofollow">Exhibit I - Star Wars Style "A" One Sheet.</a></p>
    <p>Thanks in advance.</p>
