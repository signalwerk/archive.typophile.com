    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Education" class="freelinking" rel="nofollow">Education</a> : The San Francisco Center for the Book</strong></p>
    <p>Since it's opening in 1996, <a href="http://www.sfcb.org/index.php" rel="nofollow">The San Francisco Center for the Book</a> is dedicated to providing educational resources in the book arts. The center offers workshops and exhibitions for varying degrees of expertise, welcoming just about anyone with an interest in books-arts or related crafts, from newcomers to experienced practitioners. Some of it's 300 <a href="http://www.sfcb.org/php/classes.php" rel="nofollow">workshops</a> offered include year-long and introductory courses covering topics like traditional bookbinding methods and advanced printing techniques. In addition to the many workshops and <a href="http://www.sfcb.org/html/exhibitions.html" rel="nofollow">exhibitions</a>, the Center offers free events for the public and some that are designed specifically to reach out to Bay area communities, such as hands-on demonstrations for local schools and organizations.</p>
    <p>The SFCB also serves as a venue for other book-arts organizations in the Bay Area, such as  <a href="/wiki/The%20Pacific%20Center%20for%20the%20Book%20Arts" class="freelinking" rel="nofollow">The Pacific Center for the Book Arts</a> and <a href="/wiki/The%20Hand%20Bookbinders%20of%20California." class="freelinking" rel="nofollow">The Hand Bookbinders of California.</a></p>
    <p>Past Exhibitions include:</p>
    <p>• <a href="http://www.sfcb.org/html/past-hanni.html" rel="nofollow">Swiss Impressions: Romano Hänni and the Art of Metal Type</a><br>
    • <a href="http://www.sfcb.org/html/past-cuba.html" rel="nofollow">Journey to the Source: Handmade Books from Cuba</a><br>
    • <a href="http://www.sfcb.org/html/past-massin.html" rel="nofollow">Massin in Continuo: A Dictionary</a></p>
