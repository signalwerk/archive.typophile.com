    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/12011" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Education</a>&nbsp;: The San Francisco Center for the&nbsp;Book</strong></p>
    <p>Since it’s opening in 1996, <a href="http://www.sfcb.org/index.php">The San Francisco Center for the Book</a> is dedicated to providing educational resources in the book arts. The center offers workshops and exhibitions for varying degrees of expertise, welcoming just about anyone with an interest in books-arts or related crafts, from newcomers to experienced practitioners. Some of it’s 300 <a href="http://www.sfcb.org/php/classes.php">workshops</a> offered include year-long and introductory courses covering topics like traditional bookbinding methods and advanced printing techniques. In addition to the many workshops and <a href="http://www.sfcb.org/html/exhibitions.html">exhibitions</a>, the Center offers free events for the public and some that are designed specifically to reach out to Bay area communities, such as hands-on demonstrations for local schools and&nbsp;organizations.</p>
    <p>The <span class="caps">SFCB</span> also serves as a venue for other book-arts organizations in the Bay Area, such as  <a href="/node/add/wiki?edit%5Btitle%5D=The%20Pacific%20Center%20for%20the%20Book%20Arts" title="Create node &quot;The Pacific Center for the Book Arts&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">The Pacific Center for the Book Arts</a> and <a href="/node/add/wiki?edit%5Btitle%5D=The%20Hand%20Bookbinders%20of%20California." title="Create node &quot;The Hand Bookbinders of California.&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">The Hand Bookbinders of&nbsp;California.</a></p>
    <p>Past Exhibitions&nbsp;include:</p>
    <p>• <a href="http://www.sfcb.org/html/past-hanni.html">Swiss Impressions: Romano Hänni and the Art of Metal Type</a><br>
    • <a href="http://www.sfcb.org/html/past-cuba.html">Journey to the Source: Handmade Books from Cuba</a><br>
    • <a href="http://www.sfcb.org/html/past-massin.html">Massin in Continuo: A&nbsp;Dictionary</a></p>
