    <p>Since it’s opening in 1996, <a href="http://www.sfcb.org/index.php" class="link-external">The San Francisco Center for the Book</a> is dedicated to providing educational resources in the book arts. The center offers workshops and exhibitions for varying degrees of expertise, welcoming just about anyone with an interest in books-arts or related crafts, from newcomers to experienced practitioners. Some of it’s 300 <a href="http://www.sfcb.org/php/classes.php" class="link-external">workshops</a> offered include year-long and introductory courses covering topics like traditional bookbinding methods and advanced printing techniques. In addition to the many workshops and <a href="http://www.sfcb.org/html/exhibitions.html" class="link-external">exhibitions</a>, the Center offers free events for the public and some that are designed specifically to reach out to Bay area communities, such as hands-on demonstrations for local schools and&nbsp;organizations.</p>
