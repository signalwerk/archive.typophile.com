      <p>An example, if you space all the different quote-glyphs in a similar way, they can share one single class, so you dont have to spend so much time on them.</p>
      <p>Normally I think it is enough to give them a little kern here and there against certain key letters that they colide with or are too far apart from.<br>
      Just an example, the rest you'll have to figure out for your self, that is the best way to learn ;-)</p>
