    html: |-
      <p>You really have to spin through every possible pair. For example, only "u" follows "q," right? Ever set transliterated Chinese? Or how about "g" following a cap "Y"? Seem odd? Well, the name of King Arthur's mom is "Ygraine."</p>
      <p>You need a bunch of letters in the kern window, so as not to fool your eye. I start with an "e", follow it with the leading character, then the character to be kerned, then several other letters. For example, starting out with lower case,</p>
      <p>eaalestying</p>
      <p>where the letter I'm kerning is "a" (the first one). The second letter (also an "a" above) is the trailing one of the pair. Just use the keyboard to change &amp; kern the second letter (from "a" to "b" through "z"), then change the first letter to "b" &amp; continue on. In FontLab, the fastest is to also use the keyboard for entering the kern values. You have increments of plus/minus 100, 10 and 1 quickly available.</p>
      <p>Don't forget punctuation, esp. periods, commas, and the quote marks. And BTW, most of us don't consider an apostrophe an accent. Give it some space. Another thing to look out for are prefixes and word endings. I usually find the "n"&amp; "g" in "ing" need a touch. Try several words ending in "ing".</p>
      <p>etc.</p>
      <p>FWIW</p>
