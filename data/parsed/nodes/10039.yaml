    date_raw: 30 Mar 2005 — 5:10pm
    votes: null
    html: <p>Hi there, <br> <br>I guess I'm not the kind of astute person you're looking for to critique this, but my personal opinion is that the vector ornament/logo is very centered and symmetrical, but your choice of the enlarged caps kind of breaks that symmetry, I'd be interested to see what it looks like in uniform caps (all of the same either totally small caps or all caps). <br> <br>I'm not too sure if the typeface says "Spanish Baroque" either, but then again I haven't seen a font that says "Spanish Baroque". I like the colors you've used but if I had composed this I would have shrunk the text to about 85-75% of it's current sized and moved it a little closer to the graphic, however that may be personal taste with tight compositions. <br> <br>Hope this helps in someway. I know what it can be like to work in a feedback vacuum!</p>
    html_clean: <p>Hi there, <br> <br>I guess I'm not the kind of astute person you're looking for to critique this, but my personal opinion is that the vector ornament/logo is very centered and symmetrical, but your choice of the enlarged caps kind of breaks that symmetry, I'd be interested to see what it looks like in uniform caps (all of the same either totally small caps or all caps). <br> <br>I'm not too sure if the typeface says "Spanish Baroque" either, but then again I haven't seen a font that says "Spanish Baroque". I like the colors you've used but if I had composed this I would have shrunk the text to about 85-75% of it's current sized and moved it a little closer to the graphic, however that may be personal taste with tight compositions. <br> <br>Hope this helps in someway. I know what it can be like to work in a feedback vacuum!</p>
  - id: 63895
    user: 5739
    date: 2005-03-30T17:22:00
    date_raw: 30 Mar 2005 — 5:22pm
    votes: null
    html: <p>Linus, <br> <br>Thanks so much for your comments! I would have to agree with you about the type being too large. I actually did this on accident- I had a previous version with smaller type that got mixed up before I posted.  <br> <br>As far as the typeface goes, I don't think it needs to be Spanish Baroque as long as it complements the design. I actually want the whole mark to be very clean, simple, and contemporary. The challenge with this is that everything from the Baroque era is very ornate and complicated. My struggle is going to be one of balance I think.</p>
