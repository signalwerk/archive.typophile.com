    html: "<p>Answers to three main questions, as well as any other comments would be appreciated: <br> <br>1.) Is the Typeface too distracting? :/ <br> <br>2.) What do you think of it's balance, reducability, recognizability.. <br> <br>3.) Does it feel Spanish or Baroque to you? <br> <br> <br>Please really let me have it in this critique. I've never been good at logos and I need to learn the hard way. My professors are way too nice and I need some harsh words from astute individuals. <br> <br>Thank you!</p>"
