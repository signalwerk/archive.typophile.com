    html: <p>If you are keeping the design/logo above the type I would suggest keeping to simpler forms below for better contrast with the form above. If you were integrating them that would be different. It's an iteresting shape above &amp; works to suggest a stage in a way - interesting, albeit baffling. If you do keep the Small caps thing Loose some of the space between L &amp; O in 'Los'!</p>
