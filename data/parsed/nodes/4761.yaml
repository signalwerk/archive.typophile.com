  html: <p>Hello folks, <br> <br>Getting ready to do an identity for SF's Chinatown Night Market.  They want something that will primarliy appeal to potential corporate sponsors, so it's got to be clean and professional looking etc...  I want to make sure though that it doesn't forget it roots, and that it will somehow capture some essence of a Night Market. <br> <br>So, I am going to focus on some sort of simplified latern treatment for the mark.  But for the type I am a bit stumped.  I would like something that it is a contemporary sans-serif, but still hints at Chinese brush script. <br> <br>I'm including last years logo, which has a traditional Chinese brush script.  I think this is a relevant treatment, but it needs to be updated to fit their current goals.  Though I like this logo, I think it is perhaps a bit too coloquial for their needs. <br> <br>Let me know what comes to mind. <br> <br>Thanks</p>
  html_clean: <p>Hello folks, <br> <br>Getting ready to do an identity for SF's Chinatown Night Market.  They want something that will primarliy appeal to potential corporate sponsors, so it's got to be clean and professional looking etc...  I want to make sure though that it doesn't forget it roots, and that it will somehow capture some essence of a Night Market. <br> <br>So, I am going to focus on some sort of simplified latern treatment for the mark.  But for the type I am a bit stumped.  I would like something that it is a contemporary sans-serif, but still hints at Chinese brush script. <br> <br>I'm including last years logo, which has a traditional Chinese brush script.  I think this is a relevant treatment, but it needs to be updated to fit their current goals.  Though I like this logo, I think it is perhaps a bit too coloquial for their needs. <br> <br>Let me know what comes to mind. <br> <br>Thanks</p>
