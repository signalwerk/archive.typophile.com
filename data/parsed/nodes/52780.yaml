      <p>This is likely to be tough to find, because hand-printed fonts are so easy to make. If it's not a commercial font, or a widely used amateur freebie, you are probably out of luck.  <a class="freelinking external" href="http://www.bowfinprintworks.com/Script11Pg1.html" rel="nofollow">Part 11</a> of my Script Font ID Guide (Everyday Hand Printing) would be my best shot at showing it, if I have collected it.</p>
      <p>- Mike Yanega</p>
