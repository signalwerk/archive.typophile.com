    <p>From schoolchildren to senators, every refined 19th-century American learned Spencerian penmanship. <strong><a href="http://www.sudtipos.com/fonts/97">Burgues Script</a></strong> is based on the pinnacle of this style, the ornate lettering of calligraphy teacher Louis Madarasz (1859–1910). More than 500 characters, including swashes, titling, and alternates. A Veer Exclusive by Alejandro Paul</p>
