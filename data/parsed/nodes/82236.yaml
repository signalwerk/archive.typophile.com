  html: |-
    <p>back again.</p>
    <p>I've reworked my font Radical and done the following<br>
    • Several improvements to spacing and kerning.<br>
    • Most of the glyphs revised.<br>
    • Global reshape of inktraps.<br>
    • Font name change, from Radical Display to Novecento.<br>
    • Opentype Locl feature added for Polish: special acute accent kreska now available. To activate it, just select Polish as text language.<br>
    • Opentype SS02 feature added: stylistic alternate for /N/ glyph with all accented variants, included Polish kreska.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/demo_5855.jpg"></div><p></p>
    <p>You're invited to download it and test it<br>
    <a href="http://typography.synthview.com" title="http://typography.synthview.com">http://typography.synthview.com</a></p>
    <p>Of course every comment is much appreciated.</p>
