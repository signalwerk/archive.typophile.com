    <p>I watched the Ninth Gate last night from Netflix. IMHO, a rather unremarkable film that I normally would have just shut off if not for the fact that it all centered around antique books. Type didn't play a huge part, but got me thinking about what other semi-mainstream movies might use graphic design and/or type centric plot elements. Any come to mind? </p>
    <p>Any romances set in a print shop? Any murder mysterious surrounding a sign factory? The Scarlet Letter?</p>
