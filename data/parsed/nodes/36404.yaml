      <p>Linotype–Hell AG was in existence from c. 1989 to 1997. Linotype AG acquired Dr.-Ing. Rudolf Hell GmbH in 1989, and then changed its company name. Heidelberg acquired Linotype–Hell AG around 1997, at which point Linotype Library GmbH was formed (Heidelberg AG sold Linotype in 2006). The "Library" was dropped from Linotype's name in 2005, and the company is now known simply as Linotype GmbH.</p>
      <p>"Hell" was a great company. Its founder (Dr.-Ing. Rudolf Hell) invented both the fax machine and the scanner. They also created the world's first digital typesetting machine, the DigiSet, in 1968 I believe. Many designers, including Hermann Zaps and Gerard Unger, worked for Hell for a time. Note that they were both freelancers or external employees, as far as I know. This is important, because of the differentiation it creates—while they may have worked for Hell, they did not work in Hell. Hell's offices, of course, were located in Kiel, a port city in Northern Germany.</p>
      <p>Some may be sad to hear that "Hell" no longer exists ;-)</p>
