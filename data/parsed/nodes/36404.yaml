      <p>BTW, "<a href="http://en.wikipedia.org/wiki/The_Ninth_Gate">The Ninth Gate</a>" is based on (about half of) the book "<a href="http://en.wikipedia.org/wiki/The_Club_Dumas">The Club Dumas</a>." I recommend the book much more highly, though I quite enjoyed the film. The radically different endings between the two are an interesting discussion item for those who've experienced both.</p>
      <p>Also, note that the all-important book everyone's dying over in "The Ninth Gate" is a thinly-fictionalized version of the actual book "<a href="http://en.wikipedia.org/wiki/Hypnerotomachia_Poliphili">Hypnerotamachia Poliphili</a>" (erotic dreams of Poliphilus), printed by Aldus in 1499. It's a stunning book, with cool typography and imagery. Another fictional unravelling of the secrets of this same book, but under its real name, is also the inspiration for the best-selling thriller "<a href="http://en.wikipedia.org/wiki/The_Rule_of_Four">The Rule of Four</a>," which is also being made into a film.</p>
      <p>Oddly, the Wikipedia pages on "The Ninth Gate" and "The Club Dumas" don't even mention the Hypnerotomachia.</p>
      <p>Dang, must get back to work.  :)</p>
      <p>Cheers,</p>
      <p>T</p>
