    votes: null
    html: |-
      <p>Depends on the character set of the typeface which other characters need to be held the same.</p>
      <p>Note that even with lining numerals, they are not always the exact same size as the caps. Sometimes they are slightly smaller. Look at for instance Helvetica, or most any of Robert Slimbach's typefaces. (Though even then they are close to cap height, and need not be reduced if you're changing the x-height.)</p>
      <p>Cheers,</p>
      <p>T</p>
