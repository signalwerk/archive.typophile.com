    html: |-
      <p>Hi typomania,</p>
      <p>I would definitely recommend you to do the introduction on type design here on typophile: <a class="freelinking external" href="http://typophile.com/courses/type110" rel="nofollow">http://typophile.com/courses/type110</a></p>
      <p>After that you could give your work another try, right now it looks very cluttered, the geometric sans style you've chosen has been heavily replenished on fonts like Futura, Avantgarde, Avenir, DIN Font or ITC Kabel. Look at these fonts and examine them keenly in terms of style, form, aesthetic, harmony, rhythm &amp; proportion. If you haven't capitulated to that point start reworking your font. ;-) </p>
      <p>Links:<br>
      <a class="freelinking external" href="http://www.typeworkshop.com/index.php?id1=type-basics" rel="nofollow">http://www.typeworkshop.com/index.php?id1=type-basics</a><br>
      <a class="freelinking external" href="http://www.chank.com/howto/" rel="nofollow">http://www.chank.com/howto/</a><br>
      <a class="freelinking external" href="http://briem.ismennt.is/" rel="nofollow">http://briem.ismennt.is/</a></p>
