    html: <p>Tnx for help but, after setting new anchor point manually at the crossing of two straight lines I have to cut off one side of the lines and make the lines join at the intersection which means that if I want a nice corner join I should have ending points of each line (after cutting) exactly one above the other (or at the same spot) and that's something I simply can't do by hand (the lines ofcourse must not be moved during the process). Any other suggestions?</p>
