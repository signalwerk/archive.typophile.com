    html: |-
      <p>The only way I've noticed Illustrator adding anchor points automatically is if you trim or divide an object with the pathfinder tool. </p>
      <p>The way I'd do it manually would be: define the bounding box with guides (this will give you your touching edges), then from the tool palette select the add anchor pen tool (pen with the plus sign). You can add an anchor point anywhere on a path (not just centered between the 2 closest points) and as many as you want.</p>
    html_clean: |-
