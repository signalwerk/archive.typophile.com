    date: 2007-04-27T07:48:00
    date_raw: 27 April 2007 - 7:48am
    votes: 0
    html: |-
      <p>Well, you can try this. Makes sure your lines have a stroke on them, select them all and then go to the Pathfinder palette, select Crop. The stroke will reset to None but you'll now have 4 individual lines instead of the 2 intersecting. Also, this will make them a temporary group, just un-group them before you delete the lines you want to remove.</p>
      <p>Then you can use the direct select (white arrow) to select the two end points you want to rejoin, and press Ctrl+J or Cmd+J on a MAC.</p>
      <p>If this isn't what you're looking for, then I'm not sure I understand what you're asking to do. That is about as Automatic as it's going to get in Illustrator.</p>
