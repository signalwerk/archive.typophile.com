    html: |-
      <p>The easiest way to accomplish what you want is to place spacers above and below the exported characters at points reflecting the ascent and descent of the font. I usually export five characters at a time using this method, with font dimensions set at Ascent 1000 and Descent 0 in Fontographer.</p>
      <p>After I have imported all the characters, I determine the location of the true baseline (I use the underscore character), shift all of the characters down by that amount, then reset the font dimensions so that the Descent matches the amount I shifted the characters.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/MillRich-Grange_4027.png"></div><p></p>
      <p>As a footnote, I delete the spacers as I go, since they've served their purpose already.</p>
