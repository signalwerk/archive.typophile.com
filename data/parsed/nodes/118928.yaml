    html: |-
      <p>In both RoboFont and FontLab, 1 point in Illustrator = 1 em unit. </p>
      <p>So, if you draw something in Illustrator that's 500 points tall, copy and paste into RoboFont or FontLab, it will be 500 em units tall. </p>
      <p>The one caveat: While the origin point (0,0) in a font editor is usually the left side of the baseline, the origin point in Illustrator is the top left corner of the page. You can change this in Illustrator, but, at least with the latest versions, it has no effect when you copy paths to a font editor. This means that pasted paths will appear somewhere down below the baseline and you have to reposition them. </p>
      <p>I don't know when this changed, but it used to be that objects copied from Illustrator would honor the modified origin point. In recent versions, it always uses the top left of the page, no matter what you do.</p>
