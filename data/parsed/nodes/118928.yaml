  html: |-
    <p>I want to edit an existing glyph in a advanced vector graphics editor like Adobe Illustrator. After editing complete in AI, I copy/paste the glyph into font editor back.</p>
    <p>The bad thing is the editor has already lost information about the original size/placement of the glyph in the box. Thus, a human is obliged to reduce size and fix placement of each glyph manually and by eye.</p>
    <p>Is there a way to avoid that monkey job?</p>
    <p>Software tried: FOG5 + AI CS6</p>
