      <p>Quoting Fontmesa <a href="http://www.myfonts.com/fonts/fontmesa/black-rose" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Black Rose</a> MF description text, should be "an old Bruce Type Foundry font called <strong>Black Ornamented</strong> created in 1873."<br>
      Some of its digitizations: LHF Old Blackletter, <a href="http://www.myfonts.com/fonts/fontmesa/black-rose" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Black Rose</a>, (aforementioned) Blackletter ExtraBold, Portcullion Bold</p>
