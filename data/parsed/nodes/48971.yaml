    <p>When I talk to type designers and foundry representatives about issues related to Web fonts they often state that they feel as if they don’t have a voice that’s heard by standards bodies and browser makers.</p>
    <p>To address this issue I’ve set up a conference call with Bert Bos (W3C staff contact for the CSS working group) and his colleagues from W3C. Bert wants to hear directly from people making fonts about issues related to fonts and the Web, font-linking (as recently implemented in Safari) and efforts to standardize the Embedded OpenType (EOT) format.  </p>
    <p>The call will take place on Wednesday September 3rd at 8am Seattle time, that’s 11am east-coast, 4pm in the UK and 5pm in mainland Europe. </p>
    <p>If you’re a type designer or foundry rep and would like to be on the call please send me a mail and I’ll send local call in numbers. If the number of participants is high, or the time inconvenient, we’ll set up a second call at a later date. </p>
    <p>In other news, providing he can get his visa, Bert will be joining the Web fonts panel at ATypI St Petersburg next month, and will be able to chat with type designers in person about these issues. </p>
    <p>Cheers, Si </p>
    <p>(cross-posted to ATypI list)</p>
