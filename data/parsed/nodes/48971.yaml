      <p>And that’s fine. There’s nothing wrong with sitting on the sidelines. As you know, because you were on the call (for some reason you failed to mention your “illegal and dangerous” objections???) that we see EOT, as currently spec’d, as a “Version 1” technology, and we don’t expect it to be embraced by every font vendor (heck, some don’t even allow PDF of SWF embedding!). But it’s a starting point that can be built upon by the community (ie. the font community) and not a bunch of browser makers who don’t care about people who make fonts. </p>
      <p>But theoretically as EOT is bad and font linking, as currently implemented, is bad. What’s your alternative?</p>
