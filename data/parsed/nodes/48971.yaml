      <p>“Dezcom. I think he made similar observations re the lack of a voice.”</p>
      <p>Si, my comments were directed to the end of having all the stakeholders get a voice before something is done we may all regret. My problem is that I am not knowledgeable enough to speak for anyone other than to say that those who know more about the technology and the potential ramifications in the type community should be speaking up. I am concerned about intellectual property rights of all designers and foundries and the potential for easily stealing type. More than that—I think it is another way to convince the public that type is free because it can distributed free from a web browser so why should they have to pay for it for print use..</p>
      <p>ChrisL</p>
