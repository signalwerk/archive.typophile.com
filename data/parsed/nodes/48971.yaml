      <p>”...Nick Shinn here on Typophile, who felt that the W3C would not listen to type designers concerns.”<br>
      Clearly, I would not listen to Nick on this topic either, sorry. Who else?</p>
      <p>“I can state with confidence that the number of font vendors considering supporting EOT is infinitely larger than those considering the alternative.”<br>
      Maybe, we have different definitions of infinity. Font vendors considering supporting EOT <em> are dealing with the ’alternative’</em> that’s been adopted by the w3c, consideration is/was not a consideration.  Should we deal with EOT too? with users having both? and with neither? and ’explain’ it all to font designers, lawyers, licensees, and web designers? How? EOT is not a new font format, and since it is the most illegal and dangerous of the options, I cannot support the proposed version. </p>
      <p>“We analyzed 30+ EULAs and none allowed posting to Web sites.”<br>
      Surprise! For an active vendor in this area to allow posting to Web sites, would require a linking situation with either accountability, or other protection, <em> and then</em> a EULA can be written. </p>
      <p><strong>In the mean time, all in favor of  Microsoft’s call to join ’Web Font Linking Wars’, please step forward. </strong></p>
      <p>Cheers!</p>
