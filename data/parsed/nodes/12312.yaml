  html: |-
    <p>When creating a type family I start with the 2 extreme weights - Thin and Extra Bold.</p>
    <p>I then carefully space and kern these 2 weights keeping them consistent. Once I am happy with the 2 weights I blend percentages between them - for example 20%, 40%, 60% and 80% to create a six weight family. Doing it this way ensures correct spacing and kerning throughout the family. I don't use the same kerning for both weights. </p>
    <p>This worked fine in Fontographer.</p>
    <p>I tried this in Fontlab - it was OK blending some of the characters, but others could not be blended even though the outlines (or contours) are totally compatible with similar numbers and types of points (or nodes), path directions and starting points. In the resulting font extra nodes were inserted even when the 'Do not interpolate compatible outlines' box is checked. This apparently shouldn't be the case.</p>
    <p>Also - and this is very bad - there is no kerning in the blended font. Where is the kerning? it also should be a percentage blend between the kerning of the Thin and Extra Bold originals.</p>
    <p>Any advice?</p>
    <p>Thanks</p>
