      <p>Thanks for that Mark. I tried it using the 'Tools' - blend fonts - Build the Multiple Master - axis: weight, then 'tools - Multiple Master - generate instance - with the 2 extremes open. The resulting 20% 'Light' blend weight, (200 between 0 and 1000) was correct, but the kerning was all over the place. Is anything ever straightforward in this ***** program?</p>
      <p>Take the TA characters: Kerning for Thin is -77, Kerning for Extra Bold is -62</p>
      <p>It should be -74 in the new 'Light'  weight but instead it's +32, those were the first characters I looked at, so how can I trust it to do any pairs correctly?</p>
      <p>And what of the characters that refuse to blend properly? Do you have to replace them manually from an Illustrator/Freehand 4 step blend?</p>
      <p>Sorry to bother you with this, but trying to get the info from the manual I may as well be reading Russian for all the sense it makes.</p>
      <p>Nick Cooke</p>
