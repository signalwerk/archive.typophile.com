    html: |-
      <p>I wouldn't trust interpolated kerning pairs, just me though.<br>
      Better, you might want to give the Transform&gt;Metrics&gt;Adjust Metrics a try.<br>
      I usually dump kerning from another weight into a new weight<br>
      and adjust in relation to the change in spacing metrics.<br>
      Of course, you'll want to proof the results of this as well.</p>
      <p>As for just a straight inerpolation, why not use FOG for interps<br>
      if you don't like the results in FL? I've been preparing a font<br>
      with round tips recently and I've found the FL interps with this data<br>
      to be garbage. So back to FOG for some stuff.</p>
