      <p>OK. Here are my thoughts on each glyph. (I'm sorry I can't give you much advice on the swashes.)</p>
      <p>A: The outer bowl curve now ends in a short straight line at the bottom. Could it perhaps continue its arch upwards instead? That would also take some strain off the whole curve. </p>
      <p>Left side of foot serif is now softened where it meets the stem, right side is not.</p>
      <p>B: I still think it's a little tight at the bottom. Pulling the part of the stem under the bowl join a few units to the left would open it up.</p>
      <p>C: Just right.</p>
      <p>D: Slight bumpiness too the inside of the swashy curve, but that might not matter.</p>
      <p>E: A little abrupt transition from stem to curve on the outer side? </p>
      <p>Also, is the difference between top left serif height and "roof thickness" of D and E (and bottom of L) a little too great?</p>
      <p>F: Absolutely brilliant.</p>
      <p>G: Ditto.</p>
      <p>H: Perhaps the crossbar bend should be a little smoother.</p>
      <p>IJK: Great.</p>
      <p>L: Se note concerning D and E. </p>
      <p>Lslash: To thin and boring slash.</p>
      <p>M: Top of thin vertical a little bumpy on the inside.</p>
      <p>N: Brilliant, but perhaps too alone? Could that top left notch be repeated at the bottom of B and U and the top of P, perhaps?</p>
      <p>O: Booooring! ;-)</p>
      <p>OE: Too black at the top, I think.</p>
      <p>P: Se N note.</p>
      <p>QRS: All beauties. </p>
      <p>Eszett: I still prefer the foot serifed version, but this one is also good.</p>
      <p>T: Slightly stiff bend on the hook?</p>
      <p>U: See N note.</p>
      <p>VWXYZ: Just right. Have you considered slanting both of Z's serifs?</p>
      <p>Great pilcrow and section mark! Lovely!</p>
      <p>Copyright, Trademark, number sign and Registered look a little light.</p>
      <p>Cent bar looks unconvincing.</p>
      <p>I think 4 is too black. </p>
      <p>Swashes are all great, perhaps except initial S, its curves looks a little awkward. I'm mightily impressed, I couldn't draw a swash to save my life, I think. (I've never tried.)</p>
      <p>All in all, wonderful work! Keep it up! I want to see this released!</p>
