    html: |-
      <p>Thanks for the compliment and for weighing in, Ben!</p>
      <p><em>I'm personally not a fan of thin hairlines, so I'll avoid giving an answer about which looks best.</em></p>
      <p>So does that mean you as a designer would use the thicker option in every case? (I have to squeeze an opinion out of you since you're the only one who has replied so far! :-) ) Or if you still demur, could you answer at which sizes do these look best (or, which sizes do you think it'd be useful to target with a design like this)?</p>
      <p><em>You could call the large optical size 'poster'?</em></p>
      <p>Yeah, that occurred to me. "Display" and "Poster" — or //blank// and "Poster"...</p>
      <p><em>I noticed your swash s followed by a colon. I wonder if there could be some kind of ligature or interaction between the swash and the dot.</em></p>
      <p>That's an error. To this point, I had created a class of punctuation marks, which "turned off" adjacent swash forms. (Apparently I forgot to add /:/ to the class.) Not an entirely satisfactory solution, but it beat crashes between quotation marks, periods etc. and init/fina swashes. Here's what the colon should have looked like, along with some other examples.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Picture_3897.gif"></div><p></p>
      <p>Just the other day I pondered making custom kerning pairs for all those swash/punctuation combos. I hadn't thought of custom ligatures, but I think that'd be too tall of an order for me at this point. Even the thought of doing it with kerning seems daunting to me right now.</p>
