    <p>Inspired by the funky Romanian 'A's of the images posted by Florinf (for example <a class="freelinking external" href="http://typophile.com/node/59857" rel="nofollow">here</a>), I have begun to develop a single-case font. Where uppercase and lowercase conventional forms of a given letter differ, I've tried to make hybrid letters that borrow from both forms. </p>
    <p>The results are far from graceful, but interesting and more readable than I expected. Does this have any potential?</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/ambicasespecimen4february_4017.png"></div><p></p>
