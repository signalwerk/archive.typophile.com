      <p>Some quick thoughts, jotted down in the dead of night. My eyes are blurred from insomnia, so I might not have the best eyesight right now. So take my critique with quite a few grains of salt.</p>
      <p>A: Lovely, just lovely. Perhaps it looks a little too simple compared to some of the more complicated glyphs?</p>
      <p>B: I understand why the lower bowl curls up before meeting the stem, but I think it looks a little cluttered. Perhaps it should be more curled?</p>
      <p>C: Should the top half be more like the F top half? </p>
      <p>D: Perfect.</p>
      <p>E: Is the bottom curve just a little too sharp?</p>
      <p>G: See last comment.</p>
      <p>J: Perhaps the curve is a little bumpy.</p>
      <p>K: Looks upside down. Cool, but might look awkward in context. </p>
      <p>M and N: I think these are slightly too complicated compared to the A. The N has too much white to the left of the diagonal, perhaps.</p>
      <p>Q: Very cool shape, but it gets very black where the hook joins the circle.</p>
      <p>R: Delicious.</p>
      <p>S: This S looks very polite, and a little shy. Great!</p>
      <p>T: A little weak in the left side?</p>
      <p>W: A little too black?</p>
      <p>X: The fat diagonal looks a little broken.</p>
      <p>Y: Jolly good! Just lovely.</p>
      <p>Z: Too conventional?</p>
      <p>Lovely numerals, but I think the 4 is too fat.</p>
      <p>Looking forward to see further development on this.</p>
