      <p><em>(Please tell me to be quiet if my comments are annoying.)</em></p>
      <p>No, please, keep it coming. These are sharp and helpful observations.</p>
      <p>A couple of requests for clarification:<br>
      "I’ve highlighted where I think the center of the curve [of R] is, but I think it should be down a bit more." Do you mean where the extrema are, or something different by "center of the curve"? (Do you want the whole pseudo-bowl lowered, or just the thin not to arc as much towards the northeast?)<br>
      "About the Y with the tail. The curve, I think, needs to be exaggerated slightly more or removed altogether." Do you mean a sharper curve (or an angle) cutting further into the black near the join?? (And which #version of Y are we looking at?)<br>
      "And I think the left curved apex on the M could be smoother (rounder?)" Maybe on the underside? (This is tricky because the hump has to turn and head down pretty quickly in order to maintain a rough symmetry and approximate the massing of a cap M.)</p>
      <p>Here are four H's with increasing softening of the corners (and trapping of the acute corner). Or actually the top left is as before, with right angles and no trap.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Picture_5020.gif"></div><br>
      Maybe lower left is best?<p></p>
