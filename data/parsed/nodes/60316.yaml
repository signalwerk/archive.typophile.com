      <p><em>Is there the possibility to have just initial letters swashed with your opentype features? I don’t know offhand what the swsh feature conventionally alters, but you could make use of stylistic sets too?</em></p>
      <p>Presently all changes are encoded in the swsh feature: if a designer wanted just the initial letters swashed, he/she could either just apply swsh to those letters, or insert the glyphs manually.<br>
      I asked a related question in the <a class="freelinking external" href="http://typophile.com/node/60990" rel="nofollow">Build forum</a> about this.<br>
      Do you think just initial swashes would be a setting frequently sought by designers using this font? If so, it'd be trivially easy to copy that part of the swsh opentype code over to a stylistic set too, I suppose.</p>
      <p>I eagerly await more feedback when you get a chance - thanks for the encouragement.</p>
