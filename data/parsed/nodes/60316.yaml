    html: |-
      <p>Fantastic work Craig. Exciting to see this nearing completion. You're sure getting close.<br>
      Here are a few comments, focusing not so much on the alphabetics but other stuff less discussed. Being extra picky – mind the salt.</p>
      <p>- To my eye some of the spacing/kerning can indeed do with some polishing. For instance the "T" and the final/swashed "E" seem potentially unhappy.</p>
      <p>- Diacritics: Why leave the breve and circumflex monoline when the tilde, acute, and grave are modulated?</p>
      <p>- Dieresis seems a bit timid – it looks possibly ok on "E", but too small on "O" etc. I'd make them a little heavier overall (&amp; maybe move the dots a hair farther apart).</p>
      <p>- The ring on the Uring might be too far to the right.</p>
      <p>- Why are Math symbols heavier than the parentheses/slashes etc., but not the "logical not"?</p>
      <p>- The parentheses have a bit of unexpected reversed stress? I would have expected them to be completely monoline. (I especially see this in the bottom of the closing parenthesis.)</p>
      <p>- Something funny going on with the second "D" on p. 8 (I see an overscore?)</p>
      <p>…and those Drop Cap examples are gorgeous. Great usage idea; and that initial "T" really is one of the nicest glyphs I've seen lately.</p>
      <p>(Before you make this the official specimen, be sure to fix the "RHTHYM" on p. 2!)</p>
