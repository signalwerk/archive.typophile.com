      <p>Man, this is really getting seriously nice. All your improvements are ... improvements. New "A" is even more delicious. </p>
      <p>The only thing I notice now, is that the tittles of "I" and "J" perhaps should go a little to the right. Or perhaps that's just a convention, I don't know.</p>
      <p>And that Eth/Dcroat doesn't work for me, I thought it was some kind of measurement symbol first. (I do read some Old Norse, so I'm quite familiar with that glyph. But perhaps you should ask someone from Iceland or the Færoese Islands. And don't forget the thorn, by the way. Just move the bowl of "P" downward, and make it a little flatter, but as wide.)</p>
      <p><cite>Should I put corners on everything?</cite></p>
      <p>I don't think it matters much. I've softened every corner on Mondegreen, even the insides of ink traps, and I'm starting to think I've done a lot of work nobody will ever notice. Leave the decision till the final polish.</p>
      <p><cite>Try it, it’s more fun that I thought it’d be.</cite></p>
      <p>I will, but I don't think it'll be any good. While I'm decent at lettering with pen and ink, my manual swashes <em>really</em> suck. But I'm seriously considering, inspired by your effort, giving Mondegreen Italic some swashy cap alternates. </p>
      <p>I'm afraid I again must refrain from commenting on your new swashes, I think they all look brilliant, perhaps with the exeption of the leftover "O". Its different weight from the other swashes makes it stick out, I think.</p>
