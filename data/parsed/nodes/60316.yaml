      <p>Okay, here's the results of my swash/punctuation kerning pairs experiment. First, the "before" picture, showing the init &amp; fina forms turning off when next to punctuation.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/revert_4027.gif"></div><br>
      And "after": showing the init and fina forms allowed next to punctuation, and kerned to not crash with it. The punctuation that allows this are the ones that only come in high (e.g. quotation marks), middle (e.g. hyphens), or low (e.g. periods). (Things like parentheses and colons still shut the swashes off.)<br>
      <div class="imageWrap"><img src="http://typophile.com/files/swashy_6128.gif"></div><br>
