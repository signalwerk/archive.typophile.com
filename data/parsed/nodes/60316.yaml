      <p>Interesting the way this is developing. I like the way you're using alternates to balance the dynamics and colour between glyphs rather than just fit the arms and legs together neatly. </p>
      <p>Funny I'd forgotten about my sketches for the /Y/! I think you've done something really clever with the transition from thin to thick on the curly tail, the shape is nicely balanced.</p>
      <p>&gt;With all this enthusiasm for my new /y/ I considered making it the standard glyph, but I think it might be too much flavor for that.</p>
      <p>Aah, but this font is pretty tasty generally. I think the right-facing tail really brings everything together nicely. But let me see it neighbouring other glyphs.</p>
      <p>With /B/, how about: truncate the left stem before it reaches the cap line. take the new top counter and develop the top left curve into a ball terminal that overshoots the stem? Your new B is definitely nice.</p>
      <p>With /R/ I can't quite put my finger on something that looks uncomfortable. If you're going to pull the teardrop more into the bowl I think you should do the same with /B/. What about taking the first /R/ and adding colour on the top of the bowl instead of on the right? That way it would echo the lowercase perhaps.</p>
      <p>/N/ looks a little wide. I think C needs more colour on the right.</p>
