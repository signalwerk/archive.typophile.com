      Actually, there are severe limits (IMO) to how much the eszett should be seen/interpreted as a ligature at all. It essentially is an autonomous character; and it's not even 100% clear that it was a ligature to begin with (much less which one). So I'm really not sure connecting two "S"s would fully do justice to the character. (And so far yours didn't parse very well for me.)</p>
