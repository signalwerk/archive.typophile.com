    html: |-
      <p><em>A: The outer bowl curve now ends in a short straight line at the bottom. Could it perhaps continue its arch upwards instead? That would also take some strain off the whole curve.</em></p>
      <p>Like this?<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Picture_4320.gif"></div><br>
      Before the idea was that the curve ends where and how the serif on a capital A would, but now that I see this I don't think there's much reason to hold on fast to that conceit.<p></p>
      <p><em>Left side of foot serif is now softened where it meets the stem, right side is not.</em><br>
      Yeah, I rather arbitrarily decided to leave obtuse angles as corners, to soften right angles, and to trap acute angles. Should I put corners on everything?</p>
      <p><em>Lslash: To thin and boring slash.</em><br>
      How do I make a slash not boring?! :-)</p>
      <p><em>N: Brilliant, but perhaps too alone? Could that top left notch be repeated at the bottom of B and U and the top of P, perhaps?</em></p>
      <p>Here again we run into my weddedness to concept - the angle there is supposed to suggest the diagonal of a cap N, so (in origin anyway) it isn't analogous to those other letters. Maybe that's stubborn of me (or I'm putting to much faith in the ability of that line to suggest the cap form?)</p>
      <p><em>Eszett: I still prefer the foot serifed version, but this one is also good.</em><br>
      Okay, I'll make the curly one a swash letter!</p>
      <p><em>Have you considered slanting both of Z’s serifs?</em><br>
      I thought giving different treatment to the terminals would help it fit in with the funky ambivalent character of the other letters.</p>
      <p><em>I’m mightily impressed, I couldn’t draw a swash to save my life, I think. (I’ve never tried.)</em></p>
      <p>Try it, it's more fun that I thought it'd be. </p>
      <p>New pdf up top shows a few more glyphs but mostly a lot of work on the swashes - nearly every one has been changed or adjusted.<br>
      - Which forms of the swashes work and which don't now?<br>
      - There are many different weights here which should be made more uniform - on which letters are the weights of the swash strokes and terminals most satisfying?</p>
      <p>Thanks again for your careful suggestions, Sindre, Riccardo, and Nina. I've agreed with and incorporated nearly all of them.</p>
