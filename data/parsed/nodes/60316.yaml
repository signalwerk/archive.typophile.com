    html: "<p>Riccardo, thanks for that comment, which got me reflecting on the top part of this T, and how the contrast pattern is really alien to the font. Another light bulb went off and I realized that not only this piece, but almost every other part of the font that didn't look quite right to my eye has the identical problem: a stroke that modulates like a broad-nib rather than split-nib pen (i.e. that uses translation rather than expansion). Moreover, some of the things I was most excited about (like that reversed Y tail) take a more daring approach to more sudden expansion of stroke. So I've been rethinking a bunch of glyphs, most especially those with prominent horizontals (TLZ257). Feels like a real breakthrough. I'll post an update some time soon.</p>"
