      <p><em>I find the bottom right corner of N unconvincing. Did you try making the diagonal join to the vertical in any different ways?</em></p>
      <p>That came from trying to force the cap diagonal into a semblance of a lowercase hump at the top left, which automatically pushes that stroke away from the left vertical. Consequentially, I felt I had to make the lower right connection as broad as possible so that the counters would be roughly even (i.e. so the right vertical wouldn't wind up way too close to the diagonal, relative to the left vertical).<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/n_5473.gif"></div><br>
      But maybe the unconventional counter balance is less troubling than the unconventional lower intersection...<br>
      This is a persistent dilemma. I don't think knocking the verticals off vertical will work. I've thought of dropping the beginning of the hump or the entire left side of the letter down to "x-height," but that also reads very strange. Hmmm...<p></p>
