      <p>So it was just my eyes good to see. And the U is better too.</p>
      <p>Not that I'm suggesting this, but I wonder if all the sharp corners (on the serifs specifically) should be rounded the tiniest bit. You have the interesting organic shapes happening within a lot of the letters but then you end the shapes with a sharp serif. I realize at small sizes, text sizes, it won't really matter, but I wonder if the tiniest rounding or champfering might remove the rigidity. (This is my perception.)</p>
      <p>About the Y with the tail. The curve, I think, needs to be exaggerated slightly more or removed altogether to create a smooth transition from the upper stem to the tail?</p>
