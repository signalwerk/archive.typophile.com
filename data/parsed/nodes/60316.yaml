    user: 3254
    date: 2009-08-27T06:27:00
    date_raw: 27 Aug 2009 — 6:27am
    votes: null
    html: |-
      <p><em>By the way, may I ask how you generate all your glyph variant images?</em></p>
      <p>Everything is in FontLab. Got some tips from <a class="freelinking external" href="http://typophile.com/node/56755" rel="nofollow">this thread I started a while back</a>. I copy and paste a glyph onto itself and let FLab generate a replacement, which I then edit. Then I choose all the variants I want in the sample in the Font window and open a metrics window. Then I add all the other characters for context, copying and pasting the variants as needed for multiple appearances. Make sure the metrics window is on preview mode, then take a screenshot.</p>
      <p>(For the screenshot, I use <a class="freelinking external" href="http://lifehacker.com/322363/top-10-quicksilver-plug+ins" rel="nofollow">Quicksilver plugins</a> to quickly capture a region of the screen, convert it to .gif, and rename it suitably.)</p>
    html_clean: |-
