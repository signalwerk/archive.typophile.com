    date: 2010-01-28T09:30:00
    date_raw: 28 Jan 2010 — 9:30am
    votes: null
    html: |-
      <p>@ kyrmse: Thanks for the encouragement. It feels like it's entering the home stretch, but unfortunately I can't give a deadline for release more specific than "soonish"!</p>
      <p>@johnnydib: Thanks to you too. Yes, with the font set for swash, it will recognize when a letter appears at the beginning, middle, or end of a word. By that I mean I've had to program it that way, with a byzantine (and probably laughably inefficient) set of rules I made up myself. Here's a thread I started which helped along the way:<br>
      <a href="http://typophile.com/node/60990" title="http://typophile.com/node/60990">http://typophile.com/node/60990</a><br>
      So it starts with one lookup that says ignore these rules for anything with a letter preceding this one (to separate out the initial positions), then if it's an X before an ascender, use the special X.init, else if it's a K or R before a descender, use the special K.init or R.init, else replace the letter with its .init version. (Yes, you can use opentype classes and would really need to to stay sane.)<br>
      Then it has a lookup that says ignore these rules for anything with a letter following this one (to separate out the final positions), then if it's an X after a descender, use the special X.fina, else replace the letter with its .fina version.<br>
      Then it has a lookup that says ignore this rule if the letter is K, Q, or R followed by a descender (to prohibit tail crashes), then change out the letters that have .medi forms to those.<br>
      Then it has still more complicated coding for the X.medi (since that has to take into account both the letter before and the letter after).</p>
    html_clean: |-
