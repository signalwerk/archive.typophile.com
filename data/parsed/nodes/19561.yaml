    html: <p>Can’t speak to Movable Type  but between Textpattern and Wordpress I’d recommend Wordpress for it’s superior backend UI. If you’re a bit of a nerd and feel like tinkering Textpattern may be a good option but If you’re just looking to get up and running quickly with some minor tweaks Wordpress is your best bet.</p>
