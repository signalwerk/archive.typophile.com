    html: <p>I don’t think one of these is more typographically advanced than the other. They all use HTML and HTML/CSS is what limits our typography on screen. Albeit, of course, hacks like <a href="http://wiki.novemberborn.net/sifr/">sIFR</a> and <a href="http://daringfireball.net/projects/smartypants/">Smarty Pants</a>.</p>
