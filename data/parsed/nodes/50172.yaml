  html: |-
    <p>Is it possible to use Python or Robofab to mark a set of glyphs ?</p>
    <p>I have a complex set of glyphs that I want to mark in a number of fonts to then alter. I know I could to it with a class but I would have to import the class into each font, but with a macro I could simple call it in each font that is opened.</p>
    <p>I was thinking something like :</p>
    <p><code></code></p><code>
    <p>glyphsMark = ['A','C','D','K','1','3','/']</p>
    </code><p><code>glyphsMark.color = red<br>
    </code></p>
    <p>Rr</p>
