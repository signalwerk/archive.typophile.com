    votes: null
    html: <p>As I remember from the article I read, the whole sequence was optically composited, the way it would have been done 20+ years ago. Film positives, negatives, etc were all put together and filmed by the title designer. It may have been color timed on an Avid, but certainly there was no use of After Effects. <br> <br>I'm sure you could come close to duplicating the effect now in AE, but I still think it's cooler that it was done by hand.</p>
