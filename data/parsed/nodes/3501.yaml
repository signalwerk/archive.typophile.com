    html: <p>actually, the "blurring technique" is not some <br>great technique. <br>It's simply applying <br>the blur or gaussian blur in photoshop and <br>then using threshold or brightness/contrast or mode&gt;bitmap <br>to achieve varying levels of blurred rounding. <br> <br>But here the key letters are not identical so <br>i don't think the final result could be called <br>a font.</p>
