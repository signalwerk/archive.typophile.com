    <p>Popular costumes this year: fat cats and stimulus packages<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/Catnip and Stimulus package_4521.jpg"></div><br>
    Oh.. another stimulus pack-- AND CATNIP. IS THAT COSTUME NOT BRILLIANT.<p></p>
    <p>Next we have a simple.. yet cute costume:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/Dow Jones Limbo_5144.jpg"></div><br>
    I am pretty sure that is rosewood (it says "Do the Down Jones Limbo!") on her back.. Limbo Limbo, Limbo<p></p>
    <p>And for my personal favorite:<br>
    I think this is self explanatory. The font works great..<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/bail for less_6401.jpg"></div><p></p>
    <p>Here's a few more.. non political costumes:</p>
    <p>Somehow this seems kind of dirty..<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/candy hearts_5073.JPG"></div><p></p>
    <p>Another Brilliant costume. They blend in! if only these guys were around when someone parked in front of my boyfriend's driveway, trapping me and my two friends for the day!<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/no parking_6197.jpg"></div><p></p>
