      <p>I am totally incompetent to answer a question about current or past Italian political culture. Years ago I did read some books on the Italian Fascist experience. Recently I watched the DVD on the TV mini-series  Il commissario De Lucaon [Inspector De Luca] and was captivated by the stylistic mood. Saw lots of period piece movies too.<br>
      All this being said, Fascism dominated the style of mid 1900s Italy -- at least until 1945 -- and I would have no hesitation for using this boxy lettering for the era. BTW don't lose the squared leg on the R. Also, a  nuanced Trajan style Roman or a flowing script would be so wrong for the era. I detest period recreations with lettering that is anachronistic.<br>
      Don</p>
