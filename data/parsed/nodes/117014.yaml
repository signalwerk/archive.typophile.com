      <p>Credere, obbedire, combattere (“Believe, Obey, Fight”)<br>
      I tried to find a font that matched 1. The specific boxy structure. 2. The ratio between height and width, 4. The stroke weight, and 5. The fascist mood.<br>
      I suggest Linotype Case Study No 1 Pro Bold  <a href="http://www.myfonts.com/fonts/linotype/case-study-no-one-lt/">http://www.myfonts.com/fonts/linotype/case-study-no-one-lt/</a> The main difference is the squared corners in the counters -- which in my opinion adds to the feeling of fascist harshness. The main editing changes for an excellent match are to narrow the _M_, clip the serifs on I and shorten the middle stroke on the E.<br>
      Use the modified font for a Fascist slogan like Se avanzo, seguitemi; se indietreggio, uccidetemi; se muoio, vendicatemi (“If I advance, follow me. If I retreat, kill me. If I die, avenge me”) and it's almost overpowering. For better or worse, few people think or talk like that today. More Italian Fascist slogans at <a href="http://en.wikipedia.org/wiki/Italian_Fascism#Italian_Fascist_slogans">http://en.wikipedia.org/wiki/Italian_Fascism#Italian_Fascist_slogans</a><br>
      Don</p>
