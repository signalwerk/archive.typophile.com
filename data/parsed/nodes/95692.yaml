    <p>The Fine Press Book Association is offering prizes for the best text families and titling faces designed by a student during the 2011-2013 academic years. Winning and runner-up type designs will be featured in the Association's journal "Parenthesis" and the winning titling face will be engraved and cast in foundry metal by the Dale Guild type Foundry.</p>
    <p>This is a student type-design contest, with two first place awards of $750 each and four honorable mentions of $250 each. The winning titling face will be engraved into matrices and issued as a new metal typeface by the Dale Guild Type Foundry. Please study the detailed entry rules, and once you have created your typeface, use the entry form to submit it. Your personal information will be hidden from the judges until after the selection has been made.</p>
    <p>Entry rules, list of judges, and the entry form are at <a href="http://fpba.com/fairs/contests.html" title="http://fpba.com/fairs/contests.html">http://fpba.com/fairs/contests.html</a></p>
    <p>Please pass this on to your type communities!</p>
    <p>Paul Razzell</p><div class="imageWrap"><img src="http://typophile.com/files/FPBA_Student_Banner_Small_4196.gif"></div><p></p>
