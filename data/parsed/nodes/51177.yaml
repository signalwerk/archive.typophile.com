    <p>I'm looking to revitalize a client's logo. Right now they're using <a class="freelinking external" href="http://www.myfonts.com/fonts/bitstream/english-111/vivace/" rel="nofollow">English 111 Vivace</a>, but it needs new life. It's currently a wedding florals company, but is expanding to include other florals, as well as event production design (lounge furniture rentals, etc). Each division will have its own logo, as well, but the new parent logo should be energetic, not strictly weddingy (you know what I mean...), but still be recognizable to her current clientele, as she is well established in the wedding industry already. House Industries' revitalization of Agent Provocateur is a really good example of what I'm trying to do.</p>
    <p>Any font suggestions? I love Burgues Script and Compendium Script, but not sure if they're quite right. Plus my client thinks (on first viewing) that Burgues is too "slanty"...</p>
    <p>Thanks!</p>
