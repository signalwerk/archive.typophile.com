      <p>How does the Agent Provocateur logo factor in? They like it? Have a look at <a href="http://www.typophile.com/node/50595" rel="nofollow">this thread</a>. Have a look also at two new scripts from <a href="/wiki/Stephen%20Rapp" class="freelinking" rel="nofollow">Stephen Rapp</a> that are on the more handwritten end of the spectrum: <a href="http://www.typophile.com/node/50595" rel="nofollow">Memoir</a> and <a href="http://www.typophile.com/node/50595" rel="nofollow">Montague</a>.''</p>
      <p>If they are looking for something less "slanty" and more upright, consider then <a href="http://www.fontshop.com/fonts/downloads/font_bureau/biscotti_ot/" rel="nofollow">Biscotti</a>, <a href="http://www.fontshop.com/fonts/singles/itc/fling_std_plain/" rel="nofollow">Fling</a> or <a href="http://www.fontshop.com/fonts/downloads/linotype/kursivschrift_complete_vp/" rel="nofollow">Kursivschrift</a>, big winners with the Martha Stewart crowd.</p>
