      <p>Thanks for the reference Stephen, it is a monstrous deal to me to be recommended by a fellow typophile. I am up to my ass in alligators, but it is amazing to me that clients are not willing to pay for something that ultimately is their identity in absentia. I have always laughed at the people who have settled for the first and the last capital in their name being big, and the in-between small capitals with an underline, in a non descript font for their logo. I do not even try any more. Ignorance is the soup du jour. </p>
      <p>No offense Cassie. They are not willing to pay for something that will last more than ten minutes. So they get what they pay for, no matter how far you, as a conscientious designer, are willing to go to give them YOUR absolute best. They do not care. But keep on trying!!!!!!!!!!!!</p>
      <p>Any more all I can do is giggle as I drive by store fronts with logos designed by monkeys.</p>
      <p>Michael</p>
