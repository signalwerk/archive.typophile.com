      <p>Young Baroque is indeed delicate. It needs to be set at a large size to perform well, something you can't promise with a logo that will appear in various sizes. In that vein, <a href="http://www.fontshop.com/fonts/downloads/elsner_flake/ballantines_script_1_ot/" rel="nofollow">Ballantines</a> might strike the right balance.</p>
      <p>In the end, this is probably a job for a professional letterer who can get you the precise style, weight, and tone you need. I can recommend fellow Typophiles <a href="/wiki/Michael%20Clark" class="freelinking" rel="nofollow">Michael Clark</a> and <a href="/wiki/Mark%20Simonson" class="freelinking" rel="nofollow">Mark Simonson</a> as well as <a href="/wiki/Doyald%20Young" class="freelinking" rel="nofollow">Doyald Young</a>, the designer of Young Baroque.</p>
