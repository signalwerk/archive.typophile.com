      <p>I showed her the Agent Provocateur before and after to give her an idea of the kind of energy that I want to give her logo, and she got really excited. She knows that her current, "right out of the can" is a little stale, but she still wants to keep the calligraphic, elegant look. I'm not sure that something uber-handwritten will really work... The normal slant of a script is okay with her, but she thinks that <a class="freelinking external" href="http://sudtipos.com/fonts/97" rel="nofollow">Burgues</a> is too "slanty". I love it, I think it has just the energy that the logo needs, without breaking too far from her current logo. I also really like <a class="freelinking external" href="http://www.myfonts.com/fonts/letraset/young-baroque/" rel="nofollow">Young Baroque</a>, but I think it might be a little too delicate. </p>
      <p>Thanks so much for the suggestions!</p>
