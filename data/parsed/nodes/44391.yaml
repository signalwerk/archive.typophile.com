    <p>Hello all,</p>
    <p>I'm looking for a typeface to use on a 70's muscle car inspired invitation. The invite will feature an illustration of a muscle car (Valiant Charger) and a cliched hot girl (think Daisy Duke).</p>
    <p>Any suggestions on a typeface that might complement this illustration?</p>
    <p>Cheers</p>
