    html: |-
      <p>In linguistics it might not be a good idea, but since you say display font, it's probably not going to come up.  A straight line is fine in Spanish but other languages that distinguish tilde vs acute might.  In this font, how are you doing your macron vs your acute?</p>
      <p><em>«El futuro es una línea tan fina que apenas nos damos cuenta de pintarla nosotros mismos». (La Luz Oscura, por Javier Guerrero)</em></p>
