      <p>Sorry about that. I completely botched the answer. Yes, my acute and grave look like a proper acute and grave. Only the macron and tilde are identical.</p>
      <p>As for other languages, so far, I haven't come across one that includes both tildes and macrons. The exception being descriptions of long vowels, dictionaries etc. Nothing where you'd likely a display font.</p>
