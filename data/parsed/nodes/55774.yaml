    html: |-
      <p>You could probably still disambiguate the tilde from the macron by attaching small rungs of sorts on the edge of the macron design.  Just putting a bottom rung on the left side, and a top one on the right.  You won't have to curve it, and will be using a more traditional style to boot.</p>
      <p><em>«El futuro es una línea tan fina que apenas nos damos cuenta de pintarla nosotros mismos». (La Luz Oscura, por Javier Guerrero)</em></p>
