    html: "<p>This is a very worthy project. <br><a href=\"http://www.typophile.com/forums/messages/4077/4803.html\" target=\"_blank\">http://www.typophile.com/forums/messages/4077/4803.html</a> <br><a href=\"http://www.typophile.com/forums/messages/4077/11682.html\" target=\"_blank\">http://www.typophile.com/forums/messages/4077/11682.html</a> <br> <br>And I agree with Dan (although maybe more due to functional concerns than stylistic). Complexity is human and beautiful, and in this case it's what makes blackletter better than roman for readability: <br><a href=\"http://www.themicrofoundry.com/ss_fraktur1.html\" target=\"_blank\">http://www.themicrofoundry.com/ss_fraktur1.html</a> <br> <br>What I would do is, yes, avoid the decorative aspect of blackletter, but only in terms of finish. In terms of <i>structure</i> (especially in the ascenders and descenders) I would leverage blackletter's wonderful divergence. <br> <br>hhp <br></p>"
