  html: <p>Hi, <br> <br>I’m a graphic design student at ECIAD in Vancouver spending a semester here at RISD in Providence, and one of my classes is a typeface design class. It’s taught by Cyrus Highsmith of Font Bureau. <br> <br>I stumbled upon this forum and was impressed by the wealth of knowledge and number of people I recognized (Keith Tam teaches at my school, and I met J.F. Porchez. at last year’s ATypI in Vancouver). I figured this was the right place to ask for some advice! <br> <br>My project and first typeface is a blend of sans-serif and blackletter. It’s been tough going so far, but the general idea is to reclaim and simplify blackletter in a way that doesn’t bring along negative connotations, and to add to the sans-serif some of the interesting features of blackletter type that add character and some might say legibility. To do this, I’ve been trying to both add blackletter features to sans-serif structures as well as to simplify and modernize the blackletter. At the moment, I’m somewhere in the muddy in-between… <br> <br>Any advice would be greatly appreciated, especially in terms of general direction or good blackletter typefaces to analyze or base this on. So far, Gotenburg B Bold, Deutsch Gotische, and Werbdeutsch Heavy have all seemed promising. <br> <br>I don't really want it to be a display type like Orbon, but my limited experience may require it to be so. ;) <br> <br>Thanks very much for your time!</p>
  html_clean: <p>Hi, <br> <br>I’m a graphic design student at ECIAD in Vancouver spending a semester here at RISD in Providence, and one of my classes is a typeface design class. It’s taught by Cyrus Highsmith of Font Bureau. <br> <br>I stumbled upon this forum and was impressed by the wealth of knowledge and number of people I recognized (Keith Tam teaches at my school, and I met J.F. Porchez. at last year’s ATypI in Vancouver). I figured this was the right place to ask for some advice! <br> <br>My project and first typeface is a blend of sans-serif and blackletter. It’s been tough going so far, but the general idea is to reclaim and simplify blackletter in a way that doesn’t bring along negative connotations, and to add to the sans-serif some of the interesting features of blackletter type that add character and some might say legibility. To do this, I’ve been trying to both add blackletter features to sans-serif structures as well as to simplify and modernize the blackletter. At the moment, I’m somewhere in the muddy in-between… <br> <br>Any advice would be greatly appreciated, especially in terms of general direction or good blackletter typefaces to analyze or base this on. So far, Gotenburg B Bold, Deutsch Gotische, and Werbdeutsch Heavy have all seemed promising. <br> <br>I don't really want it to be a display type like Orbon, but my limited experience may require it to be so. ;) <br> <br>Thanks very much for your time!</p>
