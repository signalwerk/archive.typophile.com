      <p>You might find something that works listed in the <a href="http://www.fontbros.com/cgi-bin/commerce.cgi?search=action&amp;keywords=retro&amp;template=Templates/Category.html&amp;sortkey=order&amp;sortorder=descending&amp;sortby=recent">Retro Section</a> at Font Bros.<br>
      Or from <a href="http://new.myfonts.com/search/BTN/fonts/">Breaking the Norm</a>.<br>
      Or from <a href="http://search.veer.com/?producttype=TYP&amp;clarify=false&amp;keyword=1950+or+fifties">Veer</a> looking at fonts listed from the era of the 50s.</p>
      <p>Did you call House about your project? If I were doing something that were more extensive I'd always call and not necessarily go by what is listed on the site.</p>
