    <p>We're currently working on an online game, and wanted to use House Industries' Coop. However, due to their licensing we can't afford it. Can someone recommend a similar style collection? We really like the "toon" feel to Coop, and how it's not over the top.</p>
    <p>Thanks,<br>
    Mike</p>
    <p><a href="http://www.houseind.com/fonts/typographyofcoop" title="http://www.houseind.com/fonts/typographyofcoop">http://www.houseind.com/fonts/typographyofcoop</a></p>
