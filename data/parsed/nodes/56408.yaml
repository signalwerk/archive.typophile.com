    html: |-
      <p>Wow, you are creating an unique font.<br>
      the rythm it has is not very usual in fonts out there.<br>
      However, I believe that it is not easy to think its design the way you are thinking.<br>
      The connection meetings, being each character "active", could make the joins look weird sometimes.<br>
      I'd think of 2 solutions.<br>
      1. The hardest, maybe, is to design conflictive pairs in one glyph. (Then use the open type function of ligatures)<br>
      2. Changing the method: think of longer terminals, so you make the connections more credible and good looking. You will need at least 3 glyphs of each character. The a with the long (low) terminal, the a with the long (middle) terminal and the a for the long (high) terminal. With this I mean, It is easier to think of a script font when the connection of the two glyphs has an active and a passive protagonist.<br>
      The first glyph, the active; the second one the passive, who is "touched" by its neighbour terminal.</p>
      <p>Hope this helps,<br>
      Best<br>
      Maximiliano R. Sproviero<br>
      Lián Types.-</p>
