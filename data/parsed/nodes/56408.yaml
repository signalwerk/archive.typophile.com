    html: |-
      <p>Great design.</p>
      <p>To make it look more naturally handwritten, maybe the lowercase g and uppercase G should connect from the tail, not from the top. Also the lead into the lowercase e is often higher than where a handwritten e would start. In fact, could you just get rid of the top-ending glyphs? That would make it easier to lead naturally into the e's, n's, m's etc. and would make your life easier with the design!</p>
      <p>tt ligature would also be a good addition I think.</p>
