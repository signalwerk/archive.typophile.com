    html: <p>Making the connections meet halfway can result in some abruptly visible joins. As your design stands, I think you could eliminate many of the variant forms by having all low and middle connections extend entirely from the leading letter to disappear into the beginning(/low/middle) form of the following letter. The top connections should extend entirely from the top form of the following letter. A full set would still be needed for a few exceptional cases such as s.</p>
