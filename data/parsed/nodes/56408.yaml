    <p>Dear Typophiles,</p>
    <p>and here's my second scetch from the last weeks... a quite old fashioned script called Gulasch (for the time of being).</p>
    <p>It's my first script font, so I may do some "stupid" things yet which could be done more efficient if I only knew ...<br>
    The general idea is that every lower case characters "ends" at one of three possible levels: low, mid and top; this always stays the same, so every "z" ends mid, every "b" ends top. According to this, the following character has to "adjust" its starting height, so there are three variants to "begin" a character (connects from a low, mid or top predecessor). There is also a variant for beginning of word, having no connector. And ... there are four further variants, for the ending of words ... which make a whopping 8 glyph variants for each character. At the moment, most of these are composed by  components in fontlab, so this works quite well, but anyway it's quite a lot of burocracy (and later, i'd like to decompose and fine tune each variant).</p>
    <p>What do i want to know?<br>
    General thoughts and ideas concerning the big picture, future expansion, future reduction (glyph count...), and if possible lots of tips how to do a script like this more efficiently.</p>
    <p>thanks for your feedback<br>
    Sebastian</p>
