    html: <p>In bookwork, prime and double prime are historically slanted characters; for this reason, generic single and double quote marks in roman fonts are incorrect. Because these characters are not ordinarily represented in text fonts, compositors correctly use characters from pi fonts, typically math pi fonts, for them. If you're including them in a text font, you should draw them at a slant, as if italic. Acute accents should never be used for these characters.</p>
    html_clean: <p>In bookwork, prime and double prime are historically slanted characters; for this reason, generic single and double quote marks in roman fonts are incorrect. Because these characters are not ordinarily represented in text fonts, compositors correctly use characters from pi fonts, typically math pi fonts, for them. If you're including them in a text font, you should draw them at a slant, as if italic. Acute accents should never be used for these characters.</p>
