    user_id: 909
    user_name: Thomas Phinney
    user_path: null
    date_raw: 20 Jun 2006 — 12:24am
    date: 2006-06-20T00:24:00
    votes: null
    html: |-
      <p>I agree, but the best solution I find is usually to use the italic versions of the "typewriter quotes." The main problem with using a math pi font is that the weight may not match very well.</p>
      <p>That being said, these should definitely be in more fonts. I've got them in the typeface I'm working on right now, fwiw.</p>
      <p>T</p>
