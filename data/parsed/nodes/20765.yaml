  html: <p>The prime and double-prime (U+2032, U+2033 respectively) are supposed to be different from the acute accent (U+00B4), but not a single one of the several hundred expensive fonts I checked out has those two glyphs. I was wondering what other people do when they need primes or double-primes — do you go with one or two acute accents, do you create the glyphs yourself, or what?</p>
