      <p>Here are a couple of fonts inspired by ancient Greek inscriptions that should work for excerpts of of a few paragraphs. <a href="http://www.myfonts.com/fonts/adobe/lithos/" rel="nofollow">Lithos</a> designed by Carol Twombly. <a href="http://www.myfonts.com/search/pericles+pro/fonts/" rel="nofollow">Pericles</a> designed by Steve Matteson based on a design by Robert Foster released by American Type Founders in 1934.<br>
      Don</p>
