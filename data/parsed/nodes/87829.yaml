    html: <p>The title is quite deceptive; as John pointed out it is a case study in the design of one typeface. I would add that it is not an especially interesting case study. Unless you adore Barnbrook’s work it is a waste of $15. Do yourself a favor and find a copy of Doyald Young’s <a href="http://www.worldcat.org/title/fonts-logos/oclc/43713945&amp;referer=brief_results" rel="nofollow">Fonts and Logos</a>.</p>
