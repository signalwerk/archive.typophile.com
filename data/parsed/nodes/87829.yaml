    html: <p>The book is described as a case study of Jonathan Barnbrook's Priori typeface. As such, it might be interesting, and may also offer some insights that might be applicable to designing other typefaces, but I suspect it should be considered how to design <em>a</em> -- one, particular -- typeface.</p>
