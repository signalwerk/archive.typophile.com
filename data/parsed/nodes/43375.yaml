    html: <p>The Better Business Bureau is somewhat of a scam, from what I've heard. You pay your annual dues and get a little plaque, but they don't really do anything to verify that you're not a con artist. It's somewhat akin to having a business card -- it might convey professionalism, but in no way does it guarantee it.</p>
