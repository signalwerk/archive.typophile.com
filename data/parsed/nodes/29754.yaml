    html: |-
      <p>This isn’t meant to sound harsh, just honest:</p>
      <p>First, the logo is in need of something a little more elegant if you’re specializing in ‘upscale weddings.’ It’s trying a little too hard to be the superman S but is failing miserably, to put it kindly. I don’t think the mason typeface is what you want for the ‘productions’ part of this logo type. It doesn’t say ‘professional’. It’s context is more of the demonic use.</p>
      <p>Your tagline starts right under the ‘g’ and is just awkward looking underneath the logo. </p>
      <p>I would give more space between your phone number and your website. You might also want to differentiate the two with maybe having one as a sans font. I would also set your name in a sans typeface to make it stand out so people know who to talk to.</p>
      <p>And is it me or did you stretch yourself on the picture? It doesn’t look stretched by much, but just a little bit to throw it off. Maybe it’s just the size I’m viewing it at.</p>
      <p>Hope this helps. Best luck with the redesign.</p>
