      <p>My advice: hire a real designer.</p>
      <p>You would never hire a graphic designer to DJ a wedding, so why would you (a DJ) design a business card?</p>
      <p>If you’re interested in learning more about design, take a look at the “Critique” forum and see what people say about others’ designs. Maybe even get some books on design or take a course at your local college. Right now, however, you clearly lack experience with this sort of thing (“what is a sans font”).</p>
      <p>So, if you need this card right away, hire a pro designer. If it can wait, keep posting here for advice and suggestions. Good luck :)</p>
      <p> - Lex</p>
