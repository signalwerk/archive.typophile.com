    html: |-
      <p>Yes, definitely lose the photo, it could be seen as arrogant, and it is robbing space from the relevant information.</p>
      <p>I’d bring the phone number in line with the job title and website (same type, size, style and right alignment), and lose the horizontal rule. </p>
      <p>The logo could manage without the hyphen, and ‘Productions’ would look much more pleasant in letterspaced caps (or letterspaced small caps if they are available to you) in the same typeface as the other information.</p>
      <p>With a bit of tweaking you could match the height of the ‘G’ to the rest of the logo and also make the horizontal rule line up perfectly with the serif of the ‘G’.</p>
      <p>Once the picture was removed you would have the logo top left and details bottom right, with plenty of space (space implies quality), and nice tension across the card.</p>
      <p>Also, could ‘Emcee’ be unfamiliar terminology to an upscale crowd? MC may be a safer choice.</p>
      <p>Good luck with everything</p>
