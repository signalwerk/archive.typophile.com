    html: |-
      <p>I saw it on Peter's website yesterday. There was also an article in the Dutch newspaper NRC Handelsblad about it. It had a large high res abc image of the typefaces with it. The article itself was also set in the typefaces (normally typeset in Lexicon and Lexicon Headline). </p>
      <p>The serif is reminiscent of Versa (which isn't a bad thing) and looks pretty neat in my opinion. It stood up perfectly to the newsprint (although NRC is a pretty high quality printed paper). The sans however, feels a bit awkward to me. I can't decide if I like it or not. It doesn't have as much character to it as the serif. The general style of the typefamily doesn't really shine though, so to speak. It looks slightly 'common'. But it's possible that that is because it has similar metrics / dimensions to default system fonts (Arial or something) so that existing documents don't shift too much?</p>
      <p>But I'm quite sure that it will look excellent when it is applied in some typographic work.</p>
