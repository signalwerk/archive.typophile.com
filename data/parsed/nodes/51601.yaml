      <p>Bert, I've been meaning to reply to your post with a great quote<br>
      that was in the back of my mind, but had trouble tracking it down:</p>
      <p>"The true teacher defends his pupils against his own personal influence.<br>
      He inspires self-distrust. He guides their eyes from himself to the spirit<br>
      that quickens him. He will have no disciple."<br>
      - Amos Bronson Alcott</p>
      <p>I try hard to be like this when I teach, but of course have no idea whether I<br>
      even come close. As I've said before, the subjugation of individual judgment<br>
      and expression is the seemingly inescapable dark side of formal education.</p>
      <p>hhp</p>
