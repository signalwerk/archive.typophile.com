    html: |-
      <p>To me, Dutch design (including font) always appear to be kind of "cold". They are always "undecorative" and "quiet", very "minimalist" (unlike the others countries, say, the US- The American are always very warm, energetic and passionate...) </p>
      <p>Just look at Peter Bil'ak's. It has got the same kind of qualities too... (now, again, that's my personal view...)</p>
      <p>I remember reading from the book "lifestyle" by Bruce Mau- Bruce talked about an experience he had with a Dutch client, introduced by his associate, Ram Koolhaa, the great architect. At the end of the day, Bruce thought the clients were not interested because they didn't seem to display much enthusiasm. </p>
      <p>This is what Rem said:" Don't be fooled, the Dutch see enthusiasm as a sign of weakness."</p>
      <p>I thought that reflected in their design too...</p>
