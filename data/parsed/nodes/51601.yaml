      <p>I attended the introduction yesterday, Wim Crouwel had a wonderful speech about concise and consistent use and implementation with a typeface in a brand identity. Peter Verheul had a presentation of the design process of the typefaces Rijksoverheid Sans &amp; Serif. </p>
