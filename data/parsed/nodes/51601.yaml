      <p>Hrant,</p>
      <p>No, marriage isn't necessary.</p>
      <p>One of the instructors has actually expressed dismay that it is a shame all the work from KABK is bunched together and dismissed as being 'Dutch'. The thing is that each student has their own flavour and their own ideas of what makes good type (of course some people have a taste for the construction of type our instructors utilize). But because of the diverse range of backgrounds and the variety of tools we are taught to use the end results are actually very rooted in the ideals of the student. Not to mention that all our instructors (in their classroom teachings and personal work) are very different and have many different opinions on type design, it's up to us to pick and choose our path based on the whole array of techniques. Reading your comments I get the impression that you haven't seen too much of the past work from students in Type and Media (though I must say an online gallery showcasing past graduation typefaces would be nice).</p>
