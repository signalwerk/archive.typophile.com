      <p>i think I like the dust jacket...</p>
      <p>i like the font too.</p>
      <p>The fact that a government is serious about their identity and appointed a designer to create a new font for them is just GREAT! (Sorry, I come from a country where the government doesn't give a damn about fonts and identity. To them, Arial could be as good as Helvetica...)</p>
      <p>i wonder how many government would do that?- UK? France? US? Italy?... well it's one thing to work on a new ID for a government, but quite another to get a specialist to design a new set of font- probably just Dutch government would go to that extent? </p>
      <p>A friend of mine who had a chance to work with Dumbar couple of years back - I remember him showing me an identity and logo he had worked on with Dumbar - if I am not wrong- it's this government's logo- the older one.</p>
