      <p>&gt; What we need to see is some “rebels” emerge from within Dutch</p>
      <p>Indeed. Evert Bloemsma was such a person, although rebels are rarely so humble and mild! Tellingly I think, Evert mostly lived geographically away from the Netherlands after his education. This is also the case with two other Dutch rebels: RvL, and De Groot*. Perhaps I'm reading too much into this, but I would posit that Western cultures are typically very good at focusing and refining an ideology, but perhaps not as good at harboring the fruitful self-doubt so necessary for true progress, and the elevating of tolerance beyond merely accepting the presence of opposing viewpoints; to me true tolerance involves embracing and even reveling in the presence of things you don't agree with. When tolerance is limited to simply allowing coexistence without showing any "we're all human" warmth towards your antagonist, that antagonist is never going to be really happy, and is going to end up leaving anyway. When dissent is cherished instead of merely coldly tolerated, that's when society truly benefits. People need to think and say: "Please tell me what I'm doing wrong." And that's rare, East or West.</p>
      <p>* Luc[as] has in fact told me that Amsterdam was too small for him, and that's why he moved to Berlin. And this "size" issue might in fact be an allegory of sorts for differing varieties of ideology.</p>
      <p>hhp</p>
