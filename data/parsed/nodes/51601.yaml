      <p>I do apologize for thinking that this thread would be boring. But I can't apologize for my feelings of boredom when I look at <em>formulaic</em> design, and for expressing those emotions. I do try to keep my emotions in check however, and I would ask that you try to do the same.</p>
      <p>The only saving grace is that any type id for a government probably can't escape being formulaic, so I guess the brief was followed very well, and that's the primary goal of any good designer. So maybe my complaint can be seen in that light.</p>
      <p>hhp</p>
