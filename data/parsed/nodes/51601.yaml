  html: |-
    <p>The Dutch government contracted type designer Peter Verheul to design one coherent font style for all of its hundreds of sub-branches. The results, appropriately (yet unoriginally) called "Rijksoverheid Serif" and "Rijksoverheid Sans" ("Govn't Serif, Sans"), will be presented tomorrow. </p>
    <p>Some initial information can be found on the designer's website: <a href="http://www.studiodumbar.com/main.php" title="http://www.studiodumbar.com/main.php">http://www.studiodumbar.com/main.php</a></p>
    <p>Now, was it money well spent? The font samples look good -- but I'll have to await the next tax form before deciding "I like it".</p>
