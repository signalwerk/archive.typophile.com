    html: <p>It's not a script as you imagine it, but Letterror's <br><a href="http://www.letterror.com/cgi-python/letterror/shop/LetterSetter?accept_entities=%DA%DC%E8%CF&amp;package=all&amp;page=interface&amp;id=8b813b985118327bbd9adfaf9b89dc6&amp;sampletext=Happy%2BChristmas%2C%2BTammi&amp;fontmenu=SalmiakRegular" target="_top">Salmiak</a> looked lovely on our cards last year. <br> <br>We made a rubber stamp and hit scraps of leftover <br>paper found about the office for cheap cards. <br> <br>Now I'm reading that you are doing something "traditional", <br>so maybe I'm not helping at all. But enjoy Salmiak, nonetheless.</p>
