    <p>Oops... I did it again.</p>
    <p>I've given my pop hit <a class="freelinking external" href="http://typetrust.com/font/cooter" rel="nofollow">Cooter</a> the star treatment.  Give it up for <a class="freelinking external" href="http://typetrust.com/font/cooterdeuce" rel="nofollow">Cooter Deuce</a>.</p>
    <p>Where the original <a class="freelinking external" href="http://typetrust.com/font/cooter" rel="nofollow">Cooter</a> offers a grab-bag of solid and counterpunched letterforms, <a class="freelinking external" href="http://typetrust.com/font/cooterdeuce" rel="nofollow">Cooter Deuce</a> has been split in two. The Regular style is endowed with a full set of counterpunched forms while the Plugged has its bowls and most of its counters filled or reduced for a heavier impression.</p>
    <p>Compared to its predecessor, <a class="freelinking external" href="http://typetrust.com/font/cooterdeuce" rel="nofollow">Cooter Deuce</a> has been drawn with more consistently square proportions, and a handful of glyphs have been entirely redesigned. Taking advantage of the Opentype format, it has even been fleshed out with a bevy of alternate glyphs, dingbats, and nifty decorative ligatures.</p>
    <p><a class="freelinking external" href="http://www.typetrust.com/fonts/specimen_pdfs/TypeTrust-CooterDeuce.pdf" rel="nofollow">Here's a Cooter Deuce PDF.</a></p>
    <p>If you've purchased the original <a class="freelinking external" href="http://typetrust.com/font/cooter" rel="nofollow">Cooter</a> at <a class="freelinking external" href="http://typetrust.com" rel="nofollow">TypeTrust.com</a>, there's a free upgrade available for download via the Order History pages of your TypeTrust Account.  Some linework and kern pairs have been adjusted.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/CooterDeuce01_4412.png"></div><div class="imageWrap"><img src="http://typophile.com/files/CooterDeuce02_6267.png"></div><p></p>
