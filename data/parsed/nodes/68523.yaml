    <p>Hey all,</p>
    <p>I am currently designing a serif for text (preview here: <a href="http://bit.ly/c2jbGy" title="http://bit.ly/c2jbGy">http://bit.ly/c2jbGy</a>) and was wondering what the consensus is on making small caps for the italic weights? Are they necessary? A typographic faux pas? A waste of time?</p>
    <p>Thanks!</p>
