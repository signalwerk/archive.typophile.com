    html: |-
      <p>As a typographer I don’t use them, but I see that many people do. Italic small caps are used not very often, but let’s say that a designer decides to set the subheads in small caps. If a subhead contains the title of a book, the designer most likely will feel the need to mark this distinction (FIFTY YEARS OF <em>RAYUELA</em> instead of FIFTY YEARS OF RAYUELA). The options are:<br>
      1) ignore it and set all the text in regular small caps (but the editor may not agree).<br>
      2) slant the regular small caps (I did this once, worked right).<br>
      3) the most common procedure: set the title in italic and use the small caps button, no matter if the typeface has real small caps or not. (Aaaaargh!)</p>
      <p>So, as a type designer, I feel it’s better to provide small caps for all the fonts that have some chance to be used in long texts and/or subheads.</p>
