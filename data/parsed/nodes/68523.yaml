    html: <p>I personally think that you could use regular small caps in a text set in italics, as some printers did in the past. But I agree that the vast majority of designers and editors will be with Freiberger. That’s why I am including them in Espinosa Nova (small caps in regular, italic, bold, and bold italic).</p>
