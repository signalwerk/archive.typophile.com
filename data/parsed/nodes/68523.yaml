    html: |-
      <p>Small caps are a <em>need</em> in italics.</p>
      <p>Most people just think of them as an option to subheads or emphasis. But in a properly typeset text, acronyms must be in small caps too. So, if you have a text in italic and there you have an acronym like UNESCO, you will need this feature in the font.</p>
      <p>The main reason for me not to use some fonts is because its italics don't have small caps.</p>
