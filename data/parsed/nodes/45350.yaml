    html: |-
      <p>"No speaky Papyrus!"</p>
      <p>Ha ha! Nice talk, folks! </p>
      <p>Michael, I like the roman, but I have to admit I don't see the swashy romantic caps going with it. I'd just focus on the scratchy modern. It's so informal already with italic outstrokes and ball terminals; The informality makes for an interesting feel. If there were a big loud bold to go with it I bet it would satisfy. </p>
      <p>Look at some of the informal copperplate styles in the old PLINC catalogs, at Akira Kobayashi's new Cosmiqua, which is sort of informal/modern, and the interesting, crumpled modern used in Martha Stewart Living, Surveyor. That has an informal quality as well. Yours, as display, could evoke everything from old gravestones to historic painted signs to certificates and deeds. </p>
      <p>Also consider the intensity of the roughness. If it's kept at a certain level, it may scale better. Too rough and it will just look blurry at small sizes.</p>
    html_clean: |-
