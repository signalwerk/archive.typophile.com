    <p>This is a lettering job I did many years ago with a pointed pen. I am now thinking about digitizing it. It is quirky, with ornate caps, and has an exterior texture. Purely an antique titling font but not your typical Modern face. So I thought why not. Whatcha think and should I duck?<br>
     </p><div class="imageWrap"><img src="http://typophile.com/files/Rough_3547.jpg"></div><p></p>
