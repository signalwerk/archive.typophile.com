    date_raw: 14 May 2008 — 3:05pm
    votes: null
    html: |-
      <p>The roughness is pretty similar to Peanut and it sets pretty well at smaller sizes. I always tell people that anything I design is not meant for small sizes, can't stop'em though. As to the caps I hear all of you loud and clear. A set of relative caps would be the best way to go but I want to keep the Script. This "face", and it is complete, was used in an annual report with swash caps and I kinda liked the secondary rhythm. Looking at this with fresh eyes you all have supplied me I feel the need for speed... some kick ass ligatures which I did not draw for this job. I knew it was a good idea to throw this up here and wait for the weigh in. Keep it coming. I will try and upload the lower case.</p>
      <p>BTW some of the weights are a tad off. The l.c. a is a bit heavy etc.</p>
      <p>Michael</p>
