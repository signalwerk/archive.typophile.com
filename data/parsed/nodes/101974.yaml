    html: |-
      <p>Yes.<br>
      To make this logo an "evolution" it should have at least something reminiscent of the old logo. As much as I like the latest type-only-no-tweaks logo I suppose it would benefit from a little detail.</p>
      <p>What I would suggest you to try is to cut the top part of /I/ to create a dot (just as high at the top bar of /T/ is) and position the dot to the right at the same vertical level and as much to the right as /T/ is from /I/. If that will be too far, you will maybe have to kern /TI/ pair to make it look harmonious. I think that would make the "lovable" part of this logo.</p>
      <p>Otherwise I really like these letter shapes. Nice, bit poetic but still strong and with character. Nice choice. But about letter shapes. /O/ would benefit from some <em>lighting</em>. It feels heavier than other letters. So you either adjust the weight of other three letters or adjust the /O/ to have the same weight.</p>
