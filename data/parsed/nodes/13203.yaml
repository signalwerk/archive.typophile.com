    html: |-
      <p>6. I’m stingy, and I like to hold onto a version that works. It seems to me that there comes a point when a company decides that their industry isn’t selling enough how-to books and training classes, so they rearrange the interface of each new upgrade to be as complex, nonsensical, and counterintuitive as possible.</p>
      <p>For raster work, I use and love Paint Shop Pro 5. I tried out 7 once, and found that I would be paying to give up the ability to draw a straight line on a flat layer. The line tool now makes a new layer containing a vector line each time you use it. In fact, everything you do becomes a separate layer until memory runs out. So convenient! I wiped it and treasure my 5 disc like gold.</p>
      <p>I once imported a book I laid out in CorelDraw 6 into CorelDraw 8 on someone else’s computer to prepare it for print. Turns out that they defined an RGB equivalent for 100% black that’s like #050108 or something, to reflect that the fact that 100% of all four CMYK is darker. WYSIWYG, you know. Except “what you get” is a PDF where all the black has turned into a 95% screen. Took me a while to figure out what was wrong and what I had to do. I shudder to think what even later versions were like.</p>
      <p>If software companies want any more of my money, they’ve got to stop breaking their product.</p>
