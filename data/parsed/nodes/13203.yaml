    html: <p>v6 for the Mac or PC? v6 for the PC was an utter disaster — it had a tendency to crash JUST as you were trying to save a file, which is pretty inconvenient unless you like doing the same work over and over again. However, I do agree that, as a rule, Corel has managed to break more things than it has fixed along the way. WordPerfect 8 is the last reliable version of that software that they produced, and CorelDraw 9 is much better in MANY ways than the subsequent three versions.</p>
