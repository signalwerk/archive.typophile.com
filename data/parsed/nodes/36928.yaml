      <p>Hello again:</p>
      <p>I checked with the foundry a few days back regarding Hoefler Text <em>and Requiem Text</em> for books. The representative did not know of any instance off hand. However, I did receive and examine the new Hoefler &amp; Frere Jones type catalog. </p>
      <p>Isn't it funny how we form opinions (sometimes damning opinions) about type we see as online samples of repertoires or comprehensive pdf's we downloaded from foundries, then to have that opinion totally change once we see it in print? </p>
      <p>For instance, Verlag- not very pretty to me on screen (perhaps even ugly), looks much better in print. I'll still take Neutraface tho :-)<br>
      We see things much differently don't we?</p>
      <p>With regards to Hoefler Text (the swashy italics excepted), I see it as a face that is so neutral that you only focus on the meaning of the words, not their shapes (much in the same fashion as Minion). It also feels "literary" but I wonder: is it "literary" for magazines or "literary" for books? H&amp;FJ catalog is printed on coated stock (kromecote?) - perhaps this has something to do with it.</p>
      <p>Mike Diaz :-)</p>
