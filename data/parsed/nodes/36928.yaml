      <p>Have you thought about checking with the Hoefler foundry and asking them? Perhaps  designers have sent them copies of books set in Hoefler Text. They could tell you ISBNs and you could get the books through a library.</p>
      <p>Designers should send samples of their design work with new types to those who design those types. Typeface designers appreciate seeing their work in use. This can also set up rewarding dialogue between the maker of a face and the user of the face. That has been my experience the past few years.</p>
      <p>Hmmm . . . . that reminds me: I have not yet sent Hoefler a copy of a poetry anthology I set recently in Requiem. Thanks for the nudge.</p>
      <p>powers</p>
