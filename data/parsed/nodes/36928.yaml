    html: |-
      <p>I just set a book in Hoefler Text (and Titling). It worked great; the letters look "black" and strong, and the page has a nice, old typographic feel, more "letter press" than digital, in some way. Besides the obviuos resemblance to Linotype Janson Text (Hoefler's main influence), to my eye Hoefler Text has some kind of similitude to ITC New Baskerville - not the type design, but the way it looks, the way the letters and the ink fit the paper. Very different from Adobe Garamond, to say. What doesn't seem to work, at least to my eye, is Italic in long reading: there's a sequence of 4 pages set entirely in Italic and it looks too heavy to me. And an alternate Q cap Italic would be helpful - the default one is elegant but perhaps too baroque to some contemporary reader's eye (by the way, I disagree with Mike: this font isn't "neutral" at all; it's very personal. Times New Roman in a book looks neutral :-)</p>
      <p>Anyway, it would be interesting to see how Hoefler Titling, which is a much "finer" typeface, would work in small size. It looks nice even in 13 points, but I'm not sure how it would work in 11, or 8 points.</p>
