      <p>Those two fonts would have been engineered very differently. To the best of my knowledge both Ross Mills and John Hudson at Tiro worked on Cambria Math and would be able to give you insight into how those features were programmed. I know based on <a class="freelinking external" href="http://typophile.com/node/97490#comment-527694" rel="nofollow">comments made in the Build section</a> and elsewhere that John uses VOLT to develop OpenType features and so it is possible that this workflow had a completely different impact than one using AFDKO as likely used by Adobe.</p>
      <p>With regard to your original question, unless you are developing a font that will likely be used in technical composition contexts then you would only really need to include those characters seen in the standard Latin-1 Supplement codepage. Personally I would probably also include those characters in the Superscript and Subscript codepage as well and leave it at that.</p>
