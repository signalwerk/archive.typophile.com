    <p>I am new to designing fonts and was wondering if anyone out there might be able to answer my question: when designing a font what are the typical characters that are included in the superscript, subscript, numerators, denominators and ordinals and scientific inferiors? </p>
    <p>Typically Adobe include the characters included in the image attached (where red text shows the text that changed when applying that style), however, I am wondering if there are any more that should be added? Also what is the difference between Subscript and Inferior     and     Superscript and Superior? I would be grateful for any feedback. Thank you.</p>
