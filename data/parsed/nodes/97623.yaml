      <p>Looking at Adobe Caslon Pro Regular (v2.092) it looks like they include a large part of the <a class="freelinking external" href="http://unicode.org/charts/PDF/U2070.pdf" rel="nofollow">Superscripts and Subscripts Unicode codepage</a> (these links to Unicode codepages from the Consortium's web site may trigger a PDF download depending on your browser, OS and settings) as well as those superscript characters that appear in the <a class="freelinking external" href="http://unicode.org/charts/PDF/U0080.pdf" rel="nofollow">Latin-1 Supplement Unicode codepage</a>. Other Unicode codepages, such as the <a class="freelinking external" href="http://www.unicode.org/charts/PDF/U1D00.pdf" rel="nofollow">Phonetic Extensions</a> and <a class="freelinking external" href="http://www.unicode.org/charts/PDF/U1D80.pdf" rel="nofollow">Phonetic Extensions Supplement</a> contain examples of other sub- and superscript characters.</p>
      <p>For more advanced mathematical support there may also be additional sets of non-Unicode specific characters to support, for example, a complete set of sub- and superscript alphanumeric characters in Latin and non-Latin scripts. If you have access to the Cambria Math font this contains a vast range of both kinds.</p>
      <p>I am not sure about the differences, but I think that Inferior and Superior refer more specifically to usage in scientific, technical and mathematical typesetting and composition. The <a class="freelinking external" href="http://en.wikipedia.org/wiki/Subscript_and_superscript" rel="nofollow">Wikipedia page</a> might be worthwhile reading on the subject.</p>
