      <p>Hi Karl,</p>
      <p>Thanks for the Unicode pages, v. helpful. The wikipedia page is what was confusing me. I took a look at Cambria (TTF) compared to Adobe Caslon Pro (OTF) and there are differences in how things are encoded see below:</p>
      <p>TTF Lookup // OTF Lookup<br>
      SUPS // SUPS * (See note below)<br>
      SINF // ------<br>
      NUMR // NUMR<br>
      DNOM // DNOM<br>
      ORDN // ------</p>
      <p>Opentype SUPS has two lookups, one with a subtable containing a-z lowecase and the other with a subtable with all the symbols i.e. 0-9 -$c(),.</p>
      <p>I'm trying to work out how the encoding happens for Inferiors and Ordinals (you see opentype has no SINF or ORDN lookups)</p>
