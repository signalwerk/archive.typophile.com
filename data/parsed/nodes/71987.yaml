      <p>I was interested to note that the 'r' in the Bitstream version of <a href="http://new.myfonts.com/fonts/bitstream/itc-lubalin-graph/" rel="nofollow">Lubalin Graph</a> is not the same as the other versions.</p>
      <p>I agree with Florian, your MASONRY sample also has the wrong R to be Lubalin - I think it's a different font. The one common letter from MASONRY and your other samples seems to be the M and it has vertical sides in  the 'name' sample, but looks splayed in MASONRY.</p>
      <p>- Mike Yanega</p>
