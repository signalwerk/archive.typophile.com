  html: |-
    <p>Okay, here's something exciting for the ampersand-lover in you!</p>
    <p>Here's a revised, final draft of a new PDF specimen display for the Font Aid "Coming Together" Haitian earthquake benefit font. It's a 46 page PDF booklet created by Alison Eickhoff to show off all the great ampersands and give credit where credit is due to all the designers who helped make this font happen. Hundreds of links included.</p>
    <p>Let me know if you see any typos or broken links or other bugs and I will try to get it fixed. THis is just a preliminary draft that probably needs a little editing before it goes out to the distributors. </p>
    <p>So here it is, have a gander, and let me know what you think. I think it's awesome and I'm so proud to have been able to help with this project. Enjoy!</p>
    <p>-chank</p>
