    <p>Anyone knows what font they used to have on the french police cars? It can't be recent because it was the same font in the 70's :)</p>
    <p><img width="550px" src="http://farm4.static.flickr.com/3178/2615671272_b620115fec_b.jpg" alt="french police photo 1"><br>
    You can view a larger version of this one here : <a href="http://www.flickr.com/photos/stevegreaves/2615671272/sizes/o/in/photostream/" title="http://www.flickr.com/photos/stevegreaves/2615671272/sizes/o/in/photostream/">http://www.flickr.com/photos/stevegreaves/2615671272/sizes/o/in/photostr...</a></p>
    <p><img width="550px" src="http://www.enjoyfrance.com/images/stories/france/news/Police-france-vehicle.jpg" alt="french police photo 2"></p>
    <p>And here are the good old 70's version :)</p>
    <p><img width="550px" src="http://www.koreus.com/files/200407/police_france.jpg" alt="french police photo 3"></p>
    <p>Thanks for your help !</p>
