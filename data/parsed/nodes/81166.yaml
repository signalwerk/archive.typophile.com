  html: |-
    <p>Hi there,</p>
    <p>I'm looking  for nice serif for a magazine.<br>
    It's a Magazine about Cars so the Serif should not be to sweet :)<br>
    It's published in several languages:<br>
    German<br>
    English<br>
    French<br>
    Italian<br>
    Spanish<br>
    Portuguese<br>
    + Russian</p>
    <p>(also in Japanese, Chinese and Korean, but this is another problem but don't hold back)</p>
    <p>Can anyone recommend a good latin+cyrillic serif?<br>
    I liked Arnhem and Albertina but don't know if they work.</p>
    <p>I would be very happy if anyone could help!!</p>
