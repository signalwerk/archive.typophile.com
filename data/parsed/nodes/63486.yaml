      <p><strong>On Wednesday the 18th of November 2009 at the end of the very successful Type[&amp;]Design 2009 Conference session at the Steigenberger Kurhaus Hotel in The Hague, the second <em>Dr. Peter Karow Award for Font Technology &amp; Digital Typography</em> was presented to Thomas Milo by Dr. Peter Karow himself. The ceremony followed on an inspiring talk by Thomas on the history of his company DecoType and the development of the ACE technology.</strong><br>
      &nbsp;<br>
      Prior and during his talk Thomas underlined that without the assistance and support of his colleagues at DecoType, who are his wife <em>Mirjam Somers</em> and his brother-in-law <em>Peter Somers</em>, his smart font technology would not have become as sophisticated as it is today.<br>
      &nbsp;<br>
      Mirjam Somers was educated at St Joost Art Academy in Breda, the Netherlands, where she was a talented pupil of the famous calligrapher Chris Brand. After two years she continued at the Gerrit Rietveld Academy in Amsterdam where she graduated Architectural Design in 1974. Having worked as a carpenter and free-lance typographer she encountered Arabic script in 1982, when together with Thomas Milo she designed and produced the <em>Arabic Letter Box</em>, a wooden prototype of a computer program and an educational tool at once. It taught them that Arabic requires an unconventional approach.<br>
      The inspiration was actually provided by a Chinese character cut by Mirjam during her St Joost days: it gave the clue for the penstroke-based approach. With Tom she reduced the traditional Arabic Ruqah script to 70 penstrokes and defined a mechanism to generate all and any letter combination correctly: the smart font algorithm. Mirjam played a major role in designing the Naskh typeface (1993–), and created the Emiri (2004, a revival) and Nastaliq (2008–, an original analysis) typefaces.<br>
      &nbsp;<br>
      Peter Somers received his degree in æronautics at the Delft University of Technology in 1971, and joined Fokker Aircraft’s R&amp;D department of advanced materials and processes in 1973. Later he joined the Optics Research Group of the Delft University of Technology in 1998 as senior researcher for the development of non-contact methods for the inspection of aerospace structures. There he also continued the development of real time speckle interferometry.<br>
      The combination of the font box and the out-of-the-box font, which Mirjam Somers developed together with Tomas Milo, inspired Peter Somers to write revolutionary smart font program code. He created a software based equivalent: a logical system for context sensitive selection of character variants for Arabic script, incorporating the concept that the Arabic characters in calligraphic composition can be decomposed into a limited series of basic shapes.<br>
      Peter designed an appropriate data structure for these shapes and a logical system to connect them. Available methods such as digital image acquisition and image processing, very common today, but advanced and hard to get by at that time, were used to implement these ideas in software. His efforts led to the first ‘intelligent font’ and resulted in the DecoType <em>Arabic Calligraphic Engine</em> (ACE) which powers intelligent fonts that provide high quality dynamically shaped calligraphic results.<br>
      &nbsp;<br>
      &nbsp;<br>
      The photo shoot below was taken during the ceremony, and show Mirjam Somers and Peter Somers besides Dr. Peter Karow and Thomas Milo.<br>
      &nbsp;<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Kurhaus_1_4731.jpg"></div><br>
      &nbsp;<br>
      <div class="imageWrap"><img src="http://typophile.com/files/Kurhaus_2_3924.jpg"></div><br>
      &nbsp;<br>
      <div class="imageWrap"><img src="http://typophile.com/files/PKAward_1_4813.jpg"></div><br>
      &nbsp;<br>
      <div class="imageWrap"><img src="http://typophile.com/files/PKAward_2_4341.jpg"></div><br>
