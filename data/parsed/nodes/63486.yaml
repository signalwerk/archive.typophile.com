      <p>Dear Sofyaani,</p>
      <p>If the Arab armies in the year 732 had won the Battle of Poitiers (<a href="http://en.wikipedia.org/wiki/Battle_of_Tours" title="http://en.wikipedia.org/wiki/Battle_of_Tours">http://en.wikipedia.org/wiki/Battle_of_Tours</a>) the example could have been in a native Dutch Islamic style - but technically the script would still be valid as a sample of Arabic :-)</p>
      <p>Thomas Milo<br>
      DecoType<br>
      <a href="http://www.decotype.com" title="www.decotype.com">www.decotype.com</a></p>
      <p>PS - Because the Arab armies did win other battles, the sample text happens to be Persian. It means "in personal experience". It is in the nastaliq style (which is widely used in the Arab world in a form simplified by Ottoman calligraphers-designers and called ruqah script), because that style is a typical example of Arabic script that defies all outside, industrial attempts at simplification. The second line has the same text, ergo, it is also in Persian, but in a typeface that represents the tendency to strip Arabic of any characteristic feature that requires other technology than what is available for Latin.</p>
