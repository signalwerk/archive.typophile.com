      <p>Hello John,<br>
      &gt;&gt;...When humans invent a hammer, they start to look around for things to hit...&gt;&gt;<br>
      How true- that is how technology develops.  I am fairly new to digital fonts and  can only appreciate in retrospect how revolutionary was Tom's idea. In my time (the early sixties) I patented a handful of common letter endings to abridge the number of Arabic letter-press types, but that is like a stone to Tom's high-tech hammer.</p>
      <p>It is true that ACE has been developed for Arabic, and initially for one or two particular styles of Arabic. This reminds me to express my admiration for Tom's scholarship dedicated to the study of the historical development of Arabic calligraphy, particularly the Ottoman Naskh style - he deservs another prize just for that. </p>
      <p>I must mention another great advantage of ACE - the same font consisting of relatively few  glyphs (archigraphemes) can be used for Persian, Urdu, Pashtu and a host of other similar scripts. Ace shifts the necessary marks constructing the shapes as it goes. It succeeds brilliantly, but like any computer software it has to be tweaked and adjusted to deal with unexpected issues, and indeed the question of spacing is one that is being dealt with. Adjusting the parameters of ACE to suit the expectations of a particular font is an interesting way to further enhance it.  There are other possibilities but the Decotype team have enough on their plate for now.</p>
      <p>The reason I mentioned Latin scripts is that the whole family of languages that use its basic letter-shapes and marks (Swedish, Vietnamese, Turkish etc. stc. ) can benefit from an ACE-like system in the same way that Arabic-related languages have.  The font designer only creates the minimum number of necessary shapes, and the software places the attached marks when and where they are needed.</p>
      <p>Yes, variation is a key advantage ACE gives the font designer, blurring the difference between calligraphy and font design. Another way it can be applied is to scripts with swashes and other 'artistic' devices. For example if a fluid script like the so-called kusa brush writing of Japanese (in vertical lines) can be applied in an intelligent font the result will be as exciting as Tasmeem is for Arabic.</p>
