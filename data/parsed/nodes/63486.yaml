      <p>Exactly, benham. The success of ACE in dealing with Arabic (and of course that means also Persian, Urdu et al)  is that it is built on Tom's thorough research into the Arabic scripts concerned. What you say about 'any technology' not having dealt with Arabic word shapes before ACE is true- but only if the hundreds of lead letter types with which early Arabic printers hand-set such scripts as thuluth is not considered a technology. Arabic is fortunate in coming late to printing, because the calligraphic tradition overlapped the advent of computer technology.</p>
      <p>Latin scripts had to go through the few hundred years since Gutenberg when the handwriting of letters and documents developed separately from printing, which became set in the  regimented way the technology dictated. Tom is well aware that the Arabic fonts developed in the last sixty years (including my own) in imitation of Latin aesthetics, are a departure from the true genius of connected Arabic writing. I have written elsewhere about the possible advantage Arabic has where each of its words has a unique outline, enhancing legibility. </p>
      <p>ACE-like software can help revive the tradition of Latin calligraphy in the natural way it was written combining disciplined letter shapes with spontaneous variations according to the place of the letter in word or in the sentence and page.</p>
