      <p>Tuesday 17 September 2013 Nicole Minoza posted on Adobe’s <a href="http://blogs.adobe.com/typblography/2013/09/dr-peter-karow-award.html" rel="nofollow">Tyblography</a> the news that Dr. Donald E. Knuth will be presented with the third <em>Dr. Peter Karow Award for Font Technology &amp; Digital Typography</em> at the ATypI Amsterdam 2013 conference. </p>
      <p>Dr. Knuth will receive the award in the presence of the previous two winners: <em>Dr. Peter Karow</em> (in 2003) and <em>Thomas Milo</em> (in 2009; see also this <a href="http://www.flickr.com/photos/exquisitefonts/sets/72157635612489346/" rel="nofollow">Flicker set</a>).</p>
      <p>FEB</p>
