      <p>Vladimir: <em>I feel ACE can yet be applied to other scripts - Latin? Chinese-type ideograms...</em></p>
      <p>When humans invent a hammer, they start to look around for things to hit.</p>
      <p>Since almost all writing is composed of strokes with at least some stroke shapes repeated, any script can potentially be broken down into the kind of pieces that ACE employs. [ACE can handle different levels of decomposition: some fonts might only decompose to the archigrapheme level, i.e. to undifferentiated letter shapes, while others might decompose to smaller stroke units.] The key question to ask would be whether other scripts benefit from such treatment in the same way that Arabic does and, because we're not talking only or even primarily about fonts here but also layout engines, can a general case be made for handling text in this way for other scripts? For instance, I can imagine something like ACE applied to a cursive Latin type such as Bickham Script Pro, and can also see how such a design would benefit from the kind of ACE-based variation that Tasmeem exposes so nicely. The OpenType version of Bickham Script Pro is less static than most Latin fonts, but it still is quite limited in the number of ways in which in can display a particular string of characters: the contextual lookups give the appearance of a lot of variation, but in fact they constrain the variation. Something like the Tasmeem word shaper and dissimilation functions, exposing all the possible ways in which a word could be written with the glyphs in the font, would be a clear benefit and enable more variation. On the other hand, the vast majority of Latin text neither requires such handling nor clearly benefits from it, simply because the norm of the formal book hand in this writing system is disconnected and aims for consistency rather than variation. </p>
      <p>The brilliance of ACE is that it proceeds from the Arabic writing system, taking into account the features of that system <em>as a system</em> and the subsystems of specific styles. It seems to me that the real lesson of ACE is not whether this particular technology can be applied to other writing systems, but that the same process of devising a technology from analysis of those systems might bear similarly excellent fruit.</p>
      <p>OpenType tries to be all things to all writing systems, and ends up being only some things to most writing systems. ACE seeks to be all things to the Arabic writing system, and largely nails it (I'm not yet happy with the spacing results, although the idea is sound and doubtless the implementation can be refined). It's a great Arabic hammer, and perhaps one could use it to hit things other than Arabic. But wouldn't it be more in the spirit of ACE to invent hammers optimised for those other writing systems, based on analysis and modelling of their characteristics?</p>
