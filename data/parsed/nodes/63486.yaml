      <p>Vladimir,<br>
      The concept of ACE is beyond that. This is the first time that technology -any technology- has looked at Arabic script in its natural behavior.<br>
      Arabic script is not more 'complex' than Roman script. It just behaves differently. If Roman text is an assembly of characters, Arabic script is an assembly of words. ACE is the first computing technology that understands that. The immediate outcome of-course, is the work of Tom Milo in tasmeem. But this is not only a calligraphic tool, although Tom may have initially thought it was. ACE essentially is about computing how Arabic script behaves. We can't have a true 'Arabic typography' without being able to draw characters in their natural behaviors. But beyond typography, any matter of computing dealing with Arabic script can not be resolved unless the natural behavior of the script is understood. An assembly of words not characters.<br>
      Think of hand writing recognition in touch screen devices for example. It is impossible to do unless the device view the script the way ACE views it, word by word. So the concept, in my view is far reaching, beyond its original intent.</p>
