    html: '<p>The way you have "dupius" and "productions" the same horizontal width looks strange in this font. as the curve is so extreme on the "d", the vertical line of the "p" seems to make it look as though it is farther to the left than the "d". The change in font listed by Daniel might help this, or you could shrink and maybe right justify the word productions. As well, this would allow for the speech bubble to be in reference of the word dupius, and if you make the "a" the same size as dupius, you should get better readability through the whole name. Here, this is easier than trying to explain in words: <br> <br><img src="http://www.typophile.com/forums/messages/4100/22493.jpg" alt="Dupius2"></p>'
