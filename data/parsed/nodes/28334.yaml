      <p>Yes, that’s what they’ve done, and very well.</p>
      <p>I have hunted through my Script Guide and several of the books I have and I can’t find this script (not even among photo-lettering scripts). It seems closest to <a href="http://www.houseind.com/index.php?page=showfont&amp;id=23&amp;subpage=viewfonts">House Script</a> from the Sign Painter package.</p>
      <p>You might expect it to be in some of the Bluemlein Scripts that Alejandro Paul has been reviving for Veer, but it’s not any that I have collected, as far as I can tell.</p>
      <p>- Mike Yanega</p>
