      <p>Randy,</p>
      <p>I am going to have to disagree with you. I think dafont.com is a steep and slippery slope for students. Free fonts are a prime example of "you get what you pay for" with <em>very</em> few exceptions. Not only this, I find that when designers (students especially) grow comfortable with DaFont, that they begin to devalue type overall and become more prone to find unethical methods of acquiring  the truly great typefaces. </p>
      <p>In my opinion, Bleeding Cowboy does not seem to define our time; it looks to me like it was designed to define a previous era.</p>
