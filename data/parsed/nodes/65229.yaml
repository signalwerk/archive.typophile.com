      <p><cite>Students do grow comfortable with dafont and the sad reality is, they really want to pay for little, given the high cost of tuition.</cite></p>
      <p>Oof! It's one thing to call us frugal, but a whole other to call us cheap!</p>
      <p>We simply don't have the money. My family—bless their hearts!—is already busting their behinds for my tuition and food. My mother very generously funds/assists funding for other pursuits—such as the Adobe Suite.</p>
      <p>But for something like type? There's simply no money to be had. Students don't have money for complimentary supplements. We buy our cameras without the lenses, our paints without the varnishes, and our InDesign without the Gotham. </p>
      <p>Personally? I don't see a problem. If anything, I think it's a positive message to students to say that they have "enough" with simply the default set. </p>
      <p>(Interestingly enough, this board took very poorly to me when I suggested otherwise once before, so I'd be interested to see if that comment will be received differently this time.)</p>
