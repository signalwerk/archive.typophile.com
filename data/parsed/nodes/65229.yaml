      <p>You have got me in a corner! What are the best? I guess that is different for everyone. (IMO) the best faces are the ones that have enough in them to allow a designer to set beautiful text. Type that one might predict would become a standard in years to come (in this sense, I agree with riccard0's first comment in this thread). Type faces like Univers, Scala, DIN, Minion, Meta, etc. </p>
