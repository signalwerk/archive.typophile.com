    html: |-
      <p>Mr Evan<br>
       in my heart I agree with you. But I do think Bleeding Cowboy transcended its visual intent by becoming a modern typeface that has nothing to do with cowboys or the West. I remember many years ago in NYC, DJ Jonathan Schwartz was about to play the definitive sound of the eighties—much to everyone's surprise, it was Jane Fonda's Workout.<br>
      Students do grow comfortable with dafont and the sad reality is, they really want to pay for little, given the high cost of tuition. Teaching typography, one can instill the notion that "you get what you pay for" but for the most part, at this point in their lives, they are happy about "borrowing" fonts, program, music, etc. The subject of this thread was a font that defined or defines our times. By defining one assumes that is not about liking it, but seeing it as some larger aspect of the culture. In that regard, Bleeding Cowboy is the Jane Fonda Workout.</p>
