      <p>James,</p>
      <p>I am with you. As a student I probably spend way too much on type (it's a bit of an addiction, really). However! For my fellow students who do not purchase typefaces, we have the luxury of using computers in the graphic design computer lab. Complete with a wide array of fantastic typefaces (from a complete set of Univers and Akzidenz Gortesque to newer fonts like Skala, Din, Meta, and tons of other typefaces).</p>
      <p>As for your comment "<em>I think it’s a positive message to students to say that they have “enough” with simply the default set</em>" ... I agree 100%. Using poorly crafted fonts from DaFont can really be a scape goat for good design. Limitations are important, the hone your skills as a designer! By limiting oneself to the typefaces that come with one's computer and the Adobe Suite, one is able to really grow as a designer. Much more so that students who over fill their font libraries with the sludge that comes from free font sites*.</p>
      <p>*NOTE: that not all free fonts are "sludge." There are some good free typefaces and with a trained eye and a sensitivity, one can find these rare gems! Places like <a href="http://www.exljbris.nl" title="www.exljbris.nl">www.exljbris.nl</a> and fontsquirrel are good places to start.</p>
      <p>(climbing down off soap box)</p>
      <p><a href="http://www.evanmade.com" target="_blank">evan</a></p>
    html_clean: |-
