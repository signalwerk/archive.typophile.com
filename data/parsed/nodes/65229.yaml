      <p><em>My favs...</em></p>
      <p>That's more like it Evan.</p>
      <p>But I wonder if the types people have said are their favorites really are the faces they favor for their own work.<br>
      Sure, there are faces one has often seen well used, and admired, but they would be favorites as a reader or connoisseur.<br>
      What are the new faces that people who are graphic designers, art directors and typographers have actually used the most--i.e. what are your "go to" faces?</p>
      <p>The only art direction I've done most of the decade involves promoting my own faces, so I don't really have a favorite in that sense, but it could be that Scotch Modern is my favorite, as I've been using it as my browser default face since 2005.</p>
      <p>There are lots of faces I've admired for one reason or another, but I wouldn't say they were favorites or best.<br>
      Recently, I've liked Memoriam and Klimax. I was living in the UK when the Guardian was redesigned in 2005, and that was probably the typographic highlight of the decade for me (that didn't involve my own work)--of course the types involved were wonderful, but they were only part of the picture. </p>
      <p>If there is one face I could perhaps credit as Best, and most inspirational, it would be from the perspective of someone who has designed multi-script, feature rich OpenType faces, and it's there that I would single out Robert Slimbach's work in Arno. I mean, polytonic italic small caps? Five optical sizes? Cyrillic and Greek Swash caps? That's setting the bar pretty high!</p>
      <p><em>...to change the future, for the better.</em></p>
      <p>That's a good criterion Hrant, and your choice accords. But if Legato is so important, how come even its leading type-designer advocate hasn't got around to designing a face along its principles? Put up or shut up!</p>
