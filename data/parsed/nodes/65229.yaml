      <p>That actually is a good example of what I've been thinking about – Nick: My «go to» faces <em>are</em> my favorite faces. Fonts I enjoy, fonts I trust, fonts I think about, are naturally the ones that come to mind most easily when considering font choice for a new project – I can't really imagine that's just me.<br>
      Of course that doesn't mean I always stick to my favorites, and don't check if maybe something else wouldn't be more appropriate; I'm a designer, not a missionary. But in trying to produce good work, it sure helps to like one's tools, and know them in some depth. That, and I also can't afford <em>all</em> the fonts I might want to have/use.</p>
