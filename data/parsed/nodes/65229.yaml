      <p>My fave would have to be Proxima Nova. For the seamless blending of geometric, clasically proportioned letters and the more modern, currently preferred humanist type. I know other fonts are in this area (e.g. Avenir, Museo Sans) but I think Proxima does it best. Really flexible (loads of weights and widths) when I'm using type for image making, integration with a grid. Geometric fonts are too sterile (kind of unwordy) and have a dated look. To me it carresses the nebulous delicious threshold between looking and reading (pretentious, moi?)</p>
      <p>Hrant, Legato is beautiful. Do you think you could elaborate on the critique you gave on typographica, as I didn't quite understand it?</p>
      <p>Regards</p>
