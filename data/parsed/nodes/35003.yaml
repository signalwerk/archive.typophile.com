      <p>&gt; May this be a custom work?</p>
      <p>I guess that for logos, this is a likely occurrence. It is interesting to notice that in the SDMO leaflets, when they need a "compound" logo, either they use another font for "SDMO" or mix the original logo with some other font. Here is an example<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/MicsTELYS_5255.jpg"></div><br>
      where, according Acrobat, the font used for "Mics TELYS" is "Ostara" (?). This being said, I am no designer.<p></p>
