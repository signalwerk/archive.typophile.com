      <p>See if you can ﬁnd Berthold’s 1954 specimen book.<br>
      It shows the most recent versions of AG, at different sizes, that Helvetica was copied from.<br>
      Some sizes are more like Helvetica than others.<br>
      Here’s a sample from it:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/berthold_accidenz_4420.jpg"></div><p></p>
