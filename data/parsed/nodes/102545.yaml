      <p>This sample is from the Berthold chronicle, not the specimen book.<br>
      AG was reworked after the success of Helvetica in 1957 to look more regular/similar. The old version was still available as AG Old Style, the new version as AG Serie 57. Here are some images <a href="http://www.flickr.com/photos/kupfers/tags/akzidenzgrotesk/" title="http://www.flickr.com/photos/kupfers/tags/akzidenzgrotesk/">http://www.flickr.com/photos/kupfers/tags/akzidenzgrotesk/</a></p>
