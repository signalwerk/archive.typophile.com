    html: |-
      <p>Open italic fonts you like in a font drawing program, and copy and paste them over one another, both within and between fonts. Use the guidelines and measuring meter to find slants and weights. All the secrets are in plain sight—not that that makes it easy. </p>
      <p>Also have a look at the "How to" section in the Typowiki. Enjoy!</p>
