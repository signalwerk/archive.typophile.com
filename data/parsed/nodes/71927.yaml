    html: |-
      <p><em>a book that at least shows axial stresses, relative proportions, and some width measurements to compare. </em></p>
      <p>You may have to measure the angles and proportions for yourself, but many metal-era specimen books, especially from type houses (as opposed to founders) have copy-fitting charts, showing characters per em.</p>
      <p>In fact, if you can track down a good "jobbing" typesetter's specimen from the 1950s, it will show types from many foundries.</p>
