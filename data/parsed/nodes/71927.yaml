  html: <p>Is there a reference that explains italic/oblique letterforms in a similar way to Karen Cheng's Designing Type? I'm looking for a book that at least shows axial stresses, relative proportions, and some width measurements to compare. Haven't had any luck in finding even something close to this, and feel like it'd be really helpful. (hopefully the information isn't in some out of print volume…)</p>
