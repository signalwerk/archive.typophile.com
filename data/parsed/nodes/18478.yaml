      <p>Ralph,</p>
      <p>Frankly I am a stranger to this new, well, new to me, typophile forum format. How do you “post a scan” on this page?.</p>
      <p>I fear little can be learned from cutting cards alone. Side bearings husband the fit tables. Wedge choice dictate units rows, the two are married. I am not sure if you are conversant with the unit systems of Monotype, Linotype etc. Also, don’t be fooled, ATF had their own unit system that made casting more efficient. They claimed it made hand setting quicker which was true, but incidental. Monotype display casters used a unit system somewhat like the ATF system</p>
      <p>Cutting cards and patterns froze the decision making. They do not contain previous human input, judgment and trial and error. Those would be recorded in the records themselves. The cutting cards encapsulate the final decision only. Also, although mathematics will be helpful in deciphering optical scaling you will find that human input is greater than you may have imagined. You will be looking at statistic population of coincidence to conclude any final theory.</p>
      <p>I am not trying to discourage you, I have proposed optical scaling for digital type for many years. I do have a suggestion for you however.</p>
      <p>The English Monotype System is intact in London. Perhaps a trip is in order. They also have several people that are conversant with the Benton and optical scaling.</p>
      <p>“Think Times, Centaur”.</p>
      <p>Gerald Giampa.</p>
