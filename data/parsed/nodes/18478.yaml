      <p>Ralf,</p>
      <p>“Cutting cards”—should have been called “punch re-cutting cards” or if you chose, “punch re-cutting slips”</p>
      <p>Their primary purpose is positioning of line up—ex height, fit, stem, “ceriph” (not sick) etc. in the event that a “dupicate punch” was needed due to breakage.</p>
      <p>(Re-) Cutting Cards in every size with a complete set of patterns would be of some use. Remember that there would be more re—cutting cards than patterns. Remember artwork was the “artists intention” but patterns with punch cutting cards were the “masters”</p>
      <p>But what were patterns and punch re-cutting cards, or /slips used for?</p>
      <p>Cutting matrices”</p>
      <p>What were matrices for?</p>
      <p>Casting type! </p>
      <p>You see the destination?</p>
      <p>Think “Times”, purchase a complete series of sizes, use high spaces or upside down type next to each character, ink very lightly, print lightly and there you have the information before you. Well, a generation away. In a perfect world you would have artwork, all re-cutting cards, all patterns, all punches and all sizes of type. Punches and type are duplications I suppose. Serious hands on metal type founding and punchcutting experience would be very good, or, to work with someone that understand the “Benton Pantograph”. I am a little busy or I would offer to help. </p>
      <p>I could probably send you a scan of a cutting card and you would see what I mean by positioning information. I am staring at one right now.</p>
      <p>This note is not spell checked. I am writing without my reading glasses. Hopefully there is not to many typeos.</p>
      <p>I wish you all the best.</p>
      <p>Gerald Giampa</p>
