    <p>Hi Typophiles,</p>
    <p>   In my continuing quest for understanding of the optical scaling techniques implemented as “steam-powered computational geometry” by the Bentons in their engraving machine, I am now at the point where I would really benefit from having images of several more cutting slips.</p>
    <p>   Please see <a href="http://typophile.com/node/18179">the averaging thread</a> for more details on how I’m doing my analyses. Thanks to Patricia Cost, I now have images of three cutting slips (one from her, one at the back of Practical Typecasting by Theo Rehak), and have been able to confirm and refine my inferences based solely on study of the printed samples. I’ve been able to decipher almost all of the notations on the cutting slip, as well. I’m very excited by these new developments and am now eager to write up a paper (possibly in collaboration with Patricia or others) describing the Benton optical scaling techniques in detail.</p>
    <p>   But my cutting slip evidence is still a bit fragmentary. The one at the back of Rehak’s book doesn’t seem to be for a mainstream ATF typeface, as the H height is way too big for its 36pt body size, so it’s hard to know for sure whether I can generalize from it. So, I am now sending out the call to the typophile community: can anyone help me get images of some more cutting slips? I am asking you to dig deep; to contact any typographic libraries or other collections of ATF artifacts, to ask your not so Internet-connected colleagues, etc.</p>
    <p>   Patricia is already in contact with several people, including Theo and David Pankow. But apparently the ATF stuff got scattered to the winds around the time of the 1990 auction, so there are lots of places that might have them.</p>
    <p>   I know I am asking for quite a lot of work here, but you will earn my undying gratitude, as well as the satisfaction of having contributed a major chunk to the scholarship of the remarkable technical and typographic legacy of the Bentons.</p>
