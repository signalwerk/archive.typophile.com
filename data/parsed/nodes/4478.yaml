  html: <p>Hello, <br> <br>   I was wondering if any of you out there can give a few sugestions on how to improve on this design. We have to use the word "Composition" and give the definition. The definition can be in any font, but the word "Composition" has to be in either Helvetica Black or Arial Black. <br> <br>This is due on wednesday and my professor ran out of time toady to give me any kind of solid feedback. Given his "No artwork emails" policy I am feeling frustrated about a good direction to move in. The only critique that he managed to offer was that "the word 'Composition' and the definition are crammed into the space there. And to explore more use of the unlimited typfaces avaliable for the definition. <br> <br>Here's the link and I appreciate any helpful tips or direction to explore!  <br> <br>	Thank you, <br>		 Sean-Paul <br> <br> <br> <br><img src="http://www.typophile.com/forums/messages/4100/34358.gif" alt="Composition Art"></p>
