    html: <p>To me, your deﬁnition is competing with the large overlapping Cs. Because they (the big Cs) create a wonderful, lively shape that dominates the format, perhaps your deﬁnition could be something more subdued and orderly for more contrast. You’ve got big to small, now maybe try chaos to order (but always allow one to dominate). <br><br>I think I would lose the gray and work only with black and white. Only reintroduce the gray if you really need it. <br><br>It’s very nice overall. You’re a much better student than I was… <br><br>-Addison</p>
