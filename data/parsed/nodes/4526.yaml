    <p>Hello, I am a print designer, but have a video/film project coming up that I have to design/produce. I am familiar and love typography for print, but would anyone be kind enough to recommend some fonts (serif, slab and san) for both titles and credits? I am very grateful. Thanks in advance. Tips would be welcome as well <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> I suppose kerning is much harder in film to judge by resolution.</p>
