      <p>At Linotype, we started calling all typefaces that had more than one variant “Type Systems” in our printed media (i.e., the “Charlotte Type System,” which has two typeface families inside of it, Charlotte and Charlotte Sans… or URW’s Corporate ASE, which is a system with three typeface families, and our Compatil &amp; new <a href="http://www.linotype.com/160491/generisvaluepack-compilation.html">Generis</a>, which have four, etc.) </p>
      <p>For awhile, on our website, we would refer to these type systems as “Font Family Groups” as well, i.e., the “ITC Stone Font Family Group.”</p>
