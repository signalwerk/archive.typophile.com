    date: 2003-12-11T19:27:00
    date_raw: 11 Dec 2003 — 7:27pm
    votes: null
    html: <p>If the evaluator is the project, maybe being able to make red drawing marks to show others in the session what you're talking about could add a dynamic. I know from what I've learned in the past two days of reading this board, I find that a better understanding comes when people highlight their critiques in a visual (usually with what looks like the spray paint option in MSPaint for some reason). <br> <br>I'm not sure if what Hrant meant by "setting text" is the idea of locking a character as unchangeable, but if not, that might be a nice function. (And if it is, forgive me, I'm a beginner trying to get up on the lingo.) <br> <br>Oh, and an undo function would be good, I know that I screwed some things up mighty-drastic a couple times fooling around, and could never get them quite back to the way they were. <br> <br>As for the new layout, it is much easier to navigate and use. Keep up the wicked work Nic.</p>
    html_clean: <p>If the evaluator is the project, maybe being able to make red drawing marks to show others in the session what you're talking about could add a dynamic. I know from what I've learned in the past two days of reading this board, I find that a better understanding comes when people highlight their critiques in a visual (usually with what looks like the spray paint option in MSPaint for some reason). <br> <br>I'm not sure if what Hrant meant by "setting text" is the idea of locking a character as unchangeable, but if not, that might be a nice function. (And if it is, forgive me, I'm a beginner trying to get up on the lingo.) <br> <br>Oh, and an undo function would be good, I know that I screwed some things up mighty-drastic a couple times fooling around, and could never get them quite back to the way they were. <br> <br>As for the new layout, it is much easier to navigate and use. Keep up the wicked work Nic.</p>
