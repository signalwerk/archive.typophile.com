    html: '<p>Nic, this is getting good! <br> <br>Question: Are you determining the vertical guidelines from parameters in the font, or manually? <br> <br>BTW, there was a guy (I should really remember exactly who it was, but all that comes to mind is that he was Latino - sorry) who was working on a PDF template that you would plug a font into and you could read off a bunch of useful attributes, like set-widths, vertical overshoots, etc. Can anybody find that stuff in the archives? The reason is that Nic might benefit by colaborating with whoever that was. <br> <br>&gt; is that a standard term in the industry <br> <br>You mean "setting text"? Yes, it always means using a font to lay out some text. <br> <br>&gt; I guess it would be less bothersome if the face were very different from Verdana. <br> <br>Less bothersome to us, but probably more bothersome to your typical user, who appreciates the "convenience"?  :-/ <br> <br>hhp <br></p>'
