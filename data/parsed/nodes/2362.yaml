  date_raw: 10 Dec 2003 — 6:37pm
  votes: null
  html: <p>I've been messing about the past few days and have come up with this... <br> <br><a href="http://www.gizma.com/newprojects/outlines/outline9_content.html" target="_blank">http://www.gizma.com/newprojects/outlines/outline9_content.html</a> <br> <br>You might need a fast machine. It's not really trying to be an editor, i just wanted to see if it was all possible. <br> <br>If you have any ideas of what i could do with this, let me know. <br> <br>Its good fun to set overlay on, press a key, then click degenerate and then the key again, keep on going for a mess. <br> <br>lemme know what you think. <br>(oh remember to click the flash movie to focus beefore typing)</p>
  html_clean: <p>I've been messing about the past few days and have come up with this... <br> <br><a href="http://www.gizma.com/newprojects/outlines/outline9_content.html" target="_blank" class="link-external">http://www.gizma.com/newprojects/outlines/outline9_content.html</a> <br> <br>You might need a fast machine. It's not really trying to be an editor, i just wanted to see if it was all possible. <br> <br>If you have any ideas of what i could do with this, let me know. <br> <br>Its good fun to set overlay on, press a key, then click degenerate and then the key again, keep on going for a mess. <br> <br>lemme know what you think. <br>(oh remember to click the flash movie to focus beefore typing)</p>
