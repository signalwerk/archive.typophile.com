    html: "<p>Hey, nice! This is the future, actually - I mean SW that runs remotely. BTW, there's also a pretty advanced Flash bitmap font (I guess pixelfont) editor - I forget the URL. <br> <br>Two things: <br>1) The Overlay On/Off doesn't seem to do anything. <br>2) I can't get other chars to show up. When I hit a key there seems to be a lot of activity (HD churning), but the display just goes blank (except for the guides), and I can't even get back to the \"A\" (without a Reload). <br> <br>&gt; Georgia ... is covered by Microsoft's EULA, which prohibits decompiling. <br> <br>I wonder what \"decompiling\" really is, though. What Nic is doing here seems to be equivalent to nothing more than something like a \"convert to outlines\" in Illustrator - there's no actual font action [that I can see]. Oh, but I guess you mean the initial conversion to XML... I get it. <br> <br>The good news is that MS isn't extremely strict about this stuff - you can't even save anything at all out in this instance, right? <br> <br>In the future though if it this is going to actually generate new fonts, including a public-domain font instead is indeed a good idea. Nic, the nice Bitstream people can help you out there. <br> <br>hhp <br></p>"
