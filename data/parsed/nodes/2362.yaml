    votes: null
    html: "<p>Nic,  <br> <br>The Letterror folks who created TTX are working on another project called RoboFab. It basically is a high-level XML/Python-based system for creating fonts. It has its own XML-based font format (UFO) that stores glyphs in so-called GLIF files (also XML). The great advantage of it is that it has a much simpler structure, and that UFO is capable of storing both PostScript and TrueType data. I'd encourage you to use UFO as your intermediate format.  <br> <br>They have a handy concept of Python-based \"pens\", i.e. converters from UFO to other formats. Maybe you could try to hack a UFO-to-Flash pen, that would make them probably very happy.  <br> <br>Best: contact Just van Rossum (just at leterror dot com) and Erik van Blokland (erik at letterror dot com).  <br> <br>Adam</p>"
