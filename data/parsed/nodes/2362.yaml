    html: <p>Director Shockwave does indeed allow multiple remote users to interact <br>in a movie (try <i>that</i> with HTML! :-) and I assume Flash does too. <br> <br>&gt; I need an aim for the project. <br> <br>I think a full-featured "type evaluator" is your best focus - an editor will become too challenging too quickly (unless the real aim is to learn the process). An evaluator might include collaboration too - like in annotating glyph features with mini chat sessions or something. <br> <br>So you'd really need some means of setting text too, not just glyph zooms. In terms of resolution issues with this, remember that you can print outline fonts from Flash very easily. <br> <br>hhp <br></p>
    html_clean: <p>Director Shockwave does indeed allow multiple remote users to interact <br>in a movie (try <i>that</i> with HTML! :-) and I assume Flash does too. <br> <br>&gt; I need an aim for the project. <br> <br>I think a full-featured "type evaluator" is your best focus - an editor will become too challenging too quickly (unless the real aim is to learn the process). An evaluator might include collaboration too - like in annotating glyph features with mini chat sessions or something. <br> <br>So you'd really need some means of setting text too, not just glyph zooms. In terms of resolution issues with this, remember that you can print outline fonts from Flash very easily. <br> <br>hhp <br></p>
  - id: 19004
