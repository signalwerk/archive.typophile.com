    html: "<p>Nic,  <br> <br>the Bitstream fonts are available for free. The Bitstream press release says: \"The Bitstream Vera fonts will be available for free copying and redistribution and can be modified as long as the font name is changed.\" The fonts are available here: <a href=\"http://www.gnome.org/fonts/\" target=\"_blank\">http://www.gnome.org/fonts/</a>  <br> <br>In addition, the Ghostscript group has a large set of completely free fonts donated by URW++ that are available under the GNU license: <a href=\"http://www.ghostscript.com/article/44.html\" target=\"_blank\">http://www.ghostscript.com/article/44.html</a>  <br> <br>Finally, there is a collaborative project called Free UCS fonts. Its aim is to create free Unicode fonts (based on the Ghostscript fonts but greatly extended). It's hosted at Savannah: <a href=\"http://savannah.nongnu.org/projects/freefont/\" target=\"_blank\">http://savannah.nongnu.org/projects/freefont/</a>  <br> <br>Since Savannah has been hacked recently, the project is offline now but should be up again soon.  <br> <br>Great tool!  <br> <br>Adam</p>"
    html_clean: "<p>Nic,  <br> <br>the Bitstream fonts are available for free. The Bitstream press release says: \"The Bitstream Vera fonts will be available for free copying and redistribution and can be modified as long as the font name is changed.\" The fonts are available here: <a href=\"http://www.gnome.org/fonts/\" target=\"_blank\" class=\"link-external\">http://www.gnome.org/fonts/</a>  <br> <br>In addition, the Ghostscript group has a large set of completely free fonts donated by URW++ that are available under the GNU license: <a href=\"http://www.ghostscript.com/article/44.html\" target=\"_blank\" class=\"link-external\">http://www.ghostscript.com/article/44.html</a>  <br> <br>Finally, there is a collaborative project called Free UCS fonts. Its aim is to create free Unicode fonts (based on the Ghostscript fonts but greatly extended). It's hosted at Savannah: <a href=\"http://savannah.nongnu.org/projects/freefont/\" target=\"_blank\" class=\"link-external\">http://savannah.nongnu.org/projects/freefont/</a>  <br> <br>Since Savannah has been hacked recently, the project is offline now but should be up again soon.  <br> <br>Great tool!  <br> <br>Adam</p>"
