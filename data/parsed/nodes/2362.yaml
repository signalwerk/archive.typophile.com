    html: <p>By "setting text" I meant being able to see some words set in the font, since each letterform in a typeface has to work harmoniously with the others. In fact many people would say that such "macro" evaluation comes first - the problem here being that the screen doesn't have nearly enough resolution to predict the "texture" that a font will make when set as extended text in print. But that doesn't make it all pointless. <br> <br>hhp <br></p>
