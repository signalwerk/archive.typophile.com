    html: "<p>Works like a charm now. <br> <br>I'm liking this. <br>And I'm thinking that at the very least it could be a great -if casual- evaluation tool: something a typophile could use to compare glyphs and check out their details in his favorite fonts; like compare vertical alignments, stroke thicknesses, etc. (and the overlay is great for this). There would have to be a way for a user to load up a font from a local drive though. <br> <br>Also, I'd add a way to slide the overlay around without moving the other layer. Plus allow overlays across different fonts (like for comparing two weights of a design). And provide a way to add custom alignment lines. <br> <br>hhp <br></p>"
    html_clean: "<p>Works like a charm now. <br> <br>I'm liking this. <br>And I'm thinking that at the very least it could be a great -if casual- evaluation tool: something a typophile could use to compare glyphs and check out their details in his favorite fonts; like compare vertical alignments, stroke thicknesses, etc. (and the overlay is great for this). There would have to be a way for a user to load up a font from a local drive though. <br> <br>Also, I'd add a way to slide the overlay around without moving the other layer. Plus allow overlays across different fonts (like for comparing two weights of a design). And provide a way to add custom alignment lines. <br> <br>hhp <br></p>"
