    html: <p>Thanks Eduardo! (And sorry Hector...) <br> <br>Nic, what about uploading a normal font file and doing the TTX conversion internally? At least in that way chances are less people will end up with an "unauthorized decompiled" version of a font on their drive. <br> <br>BTW, of those features to add, to me Save is the least useful. Except of course as a way to save just the annotations (which would also take up a lot less space). Maybe this can be done with references to chars, without actually storing the glyph data? That's for cases where no outlines changes are made though. <br> <br>hhp <br></p>
