  html: |-
    <p>Estimo is an unusual, yet elegant type family of three styles in five weights. Originally developed as upper-case-only family, Estimo was inspired by the works of Bulgarian type and graphic designers in 1980’s and especially the philatelic works of Stefan Kanchev (late 70's early 80's). It is characterized by its lack of diagonal strokes (wherever possible), thus experimenting with letterforms without losing legibility.</p>
    <p>Additional links:<br>
    Behance <a href="http://bit.ly/behestimo" title="http://bit.ly/behestimo">http://bit.ly/behestimo</a><br>
    MyFonts <a href="http://bit.ly/kaestimo" title="http://bit.ly/kaestimo">http://bit.ly/kaestimo</a></p>
    <p><img src="http://karandash.eu/uplink/Estimo_1.png" alt="Estimo"><br>
    <img src="http://karandash.eu/uplink/Estimo_2.png" alt="Estimo"><br>
    <img src="http://karandash.eu/uplink/Estimo_3.png" alt="Estimo"><br>
    <img src="http://karandash.eu/uplink/Estimo_4.png" alt="Estimo"><br>
    <img src="http://karandash.eu/uplink/Estimo_5.png" alt="Estimo"><br>
    <img src="http://karandash.eu/uplink/Estimo_6.png" alt="Estimo"><br>
    <img src="http://karandash.eu/uplink/Estimo_7.png" alt="Estimo"></p>
    <p>Take a brief look and share your opinion! It will be appreciated! Thank you!</p>
