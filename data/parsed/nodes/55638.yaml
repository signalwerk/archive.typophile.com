    html: |-
      <p>All manking shares a lot of DNA code, so don't you mind it.<br>
      Let me comment on your lowercase set:<br>
      a: It seems bold a bit, especially at the top. I thik the bowl undershoots too much, or maybe you must compensate the serif.<br>
      b: Something in the bowl is weird, perhaps the lower part...<br>
      c: The bottom terminal does not work the same way it does in the e, where I find it balanced.<br>
      d: I think the end of the bowl where it reachs serif at the bottom of the stem needs more air. Currently, that tie is too heavy.<br>
      e: I like that design.I'd like to see it in context.<br>
      f: Both alternates seem pleasant to my eyes (though deeply in my soul I miss the left side of the cross bar).<br>
      g: Looks good. Need more work in contrast.<br>
      h: At a very first sight, I like it as is.<br>
      i: The tittle bothers me, as in the "j".<br>
      j: The tail is bold a hair.<br>
      k: As previously with the UC, you reversed the weight of strokes. I like the last one.<br>
      l: No comments.<br>
      m: As with the "n", "p", "r", IMO the join at the top-left corner lack of light. See my comment on the "d". All in all, the glyph is nice.<br>
      n: Beyond what I said about the m, I like it.<br>
      o: No comments.<br>
      p: Did you added a bowl to a "j"? Descending seems too wide...<br>
      q: Pretty good.<br>
      r: I'm not totally sure about the terminal, but perhaps is me. Definitely, it needs more light at the white space over the top serif. An unwritten rule states  you sould <a class="freelinking external" href="http://www.typeworkshop.com/index.php?id1=type-basics&amp;id2=&amp;id3=&amp;id4=&amp;id5=&amp;idpic=17#pictloader" rel="nofollow">rotate that space at the top 90°</a>.<br>
      Go ahead!<br>
      <strong>MarS</strong></p>
