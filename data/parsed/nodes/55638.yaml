      <p>A: The area over the bar seems a bit tight against the one below. I agree with Craig that lowering could help. The serif on the top looks too heavy compared to the lower left serif.<br>
      B: I'd look for guidance in the E and F to balance both bowls. Though I like the bar as is, I think it would take benefit from their sisters.<br>
      C: Some of our curvy letters (C, G, O, Q) could need to overshoot up and down a bit (as D and S do it at the top). Perhaps it's wide also, as Nina says, but I'd like to see it taller before judging that.<br>
      D: The stress seems much a bit, and makes it look slightly heavy.<br>
      E: I like it as is.<br>
      F: The serif at the right side of the stem needs to be quite longer to provide support.<br>
      G: The same as the C. I'd work more on the small spur.<br>
      H: It's too narrow in comparison, especially with the N or the O.<br>
      I: Well, it's the master glyph...<br>
      &amp;: Very nice shape. I agree with Craig it's out of character.<br>
      J: It deserves a hard work. Look at the U –mirrored– for some help.<br>
      K: Where did it go? :-)<br>
      L: Might it be narrower just a bit?<br>
      M: Good as is.<br>
      N: I'd cut off some serifs here and there. Perhaps it's me, but it seems too busy. I like it as a whole, anyway.<br>
      O: See my thoughts on the C. Nice balance.<br>
      P: Hmmm... I lost it.<br>
      Q: You face a hard challenge here. Hear the guys.<br>
      R: Gone with the P?<br>
      S: Very nice and smooth!<br>
      T: I'd only touch the serifs at the base, coz the letter is wide.<br>
      U: Pay attention to Nina's comments. I like it as well.<br>
      V..Z: See you, girls...</p>
      <p>All in all, an interesting job, Paul.<br>
      About the name, let us know your aims.</p>
      <p><strong>MarS</strong></p>
