    html: |-
      <p>I love that ampersand...<br>
      The A is now well balanced (though I cannot feel yet comfortable with the top serif, but don't take it in account).<br>
      I'd make the spur of the G sharper and less heavy.<br>
      Your  J –the first one– now looks great; perhaps the left serif is still long a bit.<br>
      I like the newborn K, but the weight of the strokes is odd: the upper is too thick, while the lower is too thin (the should follow the same logic of the M or the V); it happens in both versions –the latter is pretty good; the fat J bothers me, but it's just me.<br>
      The open P is nice. I'd like to see an alternate P with the tail of the bowl ascending, more B alike, but not too much.<br>
      Your R suffers the same lightness in the stroke I pointed for the K; the bowl seems big, perhaps because of this; as with the K, I like the latter version the most.<br>
      The S is beautiful as is.<br>
      I think the U is still unresolved in its inner curves.<br>
      With the V and W I have the same concerns exposed about the top serif of the A, but in that case I'm strongly in favor of a thin vertex gently overshooting the baseline.<br>
      The X definitely needs contrast (see notes on the K and R); once it's done, you'll need to shift the extremes of the thin stroke.<br>
      The Y has a poor contrast as well.<br>
      I have to say the same about the Z, even though it's quite beautiful.<br>
      You'd have to clarify us some questions about the eventual lowercase set, guidance to find a name, and so on.<br>
      Cheers!</p>
      <p><strong>MarS</strong></p>
