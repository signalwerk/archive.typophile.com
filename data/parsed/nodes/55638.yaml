      <p>Good job!<br>
      That descending "J" is a nice try, though I guess it needs more weight/width.<br>
      The fat-flat-top "A" annoys me a bit; it think the top full-serif one is the best solution for much.<br>
      I'd try making the upper stroke of the "K" gets thinner top to bottom, at least a half its current width.<br>
      Now, looking thoroughly, the "O" –and consequently the "C", "G", "Q"– seems to be contrasted in excess, I mean: the thinner parts are too thin, especially against the other glyphs.<br>
      You've got a great challenge with the "Q". I'm not sure about saying anything.<br>
      The leg of the first "R" apparently needs more weight. Anyway, I like the second "R", though its bowl is excesively wide.<br>
      I'm starting to enjoy the "U", as well as the V and W.<br>
      About the "X", break the thin stroke to avoid the optical flaw that –precisely– makes it look broken.</p>
      <p><strong>MarS</strong></p>
