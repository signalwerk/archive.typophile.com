    html: <p>So I'm guessing you thought you were adapting "lettering" you found somewhere, and the significantly different letters were not present in the book title or whatever it was. Don't be discouraged, as you probably still have the right in this instance, and I think certain letters such as Z and J are much better than the original. The original K has you beat, though. The new P's have merit but I think you'll have to work harder to create worthy R's that go with them. You could also try other more fanciful changes; the possibility of a wineglass Y based on the U comes to mind.</p>
