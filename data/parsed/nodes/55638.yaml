      <p>I really like the progress on this.</p>
      <p>K's high leg join is great! </p>
      <p>Serifs on V and W are odd, but I think fittingly so. If you keep them, think about spreading those bottom vertices of W away from each other.</p>
      <p>J's curled end looks too flat at the vertical (could be antialiasing).</p>
      <p>The shorter thin stroke of M looks pinched where it intersects at the middle of the glyph.</p>
      <p>Z looks like it has a little italic slope; is the top stroke too short?</p>
      <p>I don't like any of the alternates at the end. </p>
      <p>I think your A looks great as it, but did you think of toying with the flat-topped A (akin to your H)?</p>
