      <p>There's an interesting feel to this.</p>
      <p>I agree about the "Q" – placement and shape of the tail seems arbitrary. A loop might work, or maybe look at the "B" for guidance and have the tail grow out of the left side of the bowl? (Not sure this would work.)</p>
      <p>The "C" has an underbite to my eyes. May also be a bit wide (and I agree with Craig that it's short, as well as the "G").</p>
      <p>I think the "H" may need to be wider.</p>
      <p>One thing that strikes me as odd about the "J" (other than the left side of the curve, which somehow doesn't work) is the long left-side head serif. All your other horizontal serifs seem to be shorter (even on the "F", which might benefit from a longer one on the right), so I'm wondering why you're making an exception here.</p>
      <p>I think the shape of the "U" is somewhat amiable! But you may want to work out the inner vs. outer curves a bit more smoothly where the curve grows out of the stem on the left side.</p>
      <p>Is this going to have lowercase?</p>
