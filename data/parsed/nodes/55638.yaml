    html: |-
      <p>Here's the weekend's further progress. I've made some progress on the lower case set:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/lc_5250.png"></div><p></p>
      <p>I've also refined the upper case glyphs a bit, and added a few more alternates:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/all_6201.png"></div><p></p>
      <p>On looking closer I'm sure the sign that inspired this font-  I'm now thinking of naming it 'Almira' thanks to a helpful suggesion on our blog - and Richmond Old Style share 'DNA', but there a  surprising number of differences too.  Royund serifs vs squaure cut ones, gently tapered uprights rather than straight, extreme contrast in 'O', 'C' etc.  I think the unamed signwriter might have seen Richmond and 'improved' on it!</p>
