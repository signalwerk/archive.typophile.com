  html: |-
    <p>I have been leeching around the forum, to see if I could find the answer to my question. Some topics relate somewhat to the problem, yet none have provided the necessary answer.</p>
    <p>So here we go:<br>
    I have been asked to change the auto line spacing of an existing font, due to the reason that the program which is going to use the font cannot change the line spacing. I have used FontLab and I tried to go to "Font info" and change in the ascender and descender value, yet in order to minimize the distance, I have to ignore the 1000 UPM "rule". This sort of works, but it also scale the letters, which I would prefer not happened. It also seems to affect the hinting of the font, and apparently the generated font only seems to work in InDesign and not illustrator. I have read the pdf mentioned in this post <a href="http://typophile.com/node/59348" title="http://typophile.com/node/59348">http://typophile.com/node/59348</a> but it did not help me.</p>
    <p>So I turn to you guys, and hope that somewhere out there, at least one person has succeded in the "simple" task of reducing the line spacing in an existing font.</p>
    <p>Hope to see some contructive replys</p>
    <p>All the best<br>
    Benjamin</p>
