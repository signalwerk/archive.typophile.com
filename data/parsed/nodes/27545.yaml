      <p>Hi guys:</p>
      <p>Oh and while your at it, can someone please ask Apple if they are going to improve their OpenType implementation so that you can use all your "layout features" in any application. Not just Adobe and Quark products.<br>
      It seems these days that Microsoft is paying a whole lot more attention to typography that Apple. I think Apple needs to be aware that more and more designers are purchasing only OpenType-CFF collections these days and we ACTUALLY use smaller supporting applications. I just think the Apple AAT framework need to be more robust.</p>
      <p>Mikey</p>
