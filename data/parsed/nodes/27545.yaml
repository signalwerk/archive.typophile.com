  html: |-
    <p>Good morning all,</p>
    <p>Just wondering, as many of you are at TypeCon2006, is anyone planning to tape this presentation? Would it violate anyone's copyrights to post it here as an MPG or MOV file?</p>
    <p>Bill</p>
    <p>On Friday, August 11th from 11:15 a.m. - 12:15 p.m., York will discuss font management in OS X by participating in a panel session titled "Demystifying Font Management in OS X." The session will be moderated by well-known book designer and typographer Kent Lew; other panelists in this session will include Peter Lofting of Apple Computer, Bruno Steinert of Linotype and Stephen Coles of FontShop/Typographica.</p>
