    <p>Here is what people have said about Yves&nbsp;Peters:</p>
    <p>“Everyone’s favourite rock ‘n’ roll typographer”<br><a href="/node/14271" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">David John Earls</a> of <a href="/node/13757" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Typographer.org</a></p>
    <p>“He made it cool to be a Type <span class="caps">I.D.</span> nerd”<br><a href="/node/12067" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Brian Jaramillo</a> of <a href="/node/add/wiki?edit%5Btitle%5D=Agency26" title="Create node &quot;Agency26&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Agency26</a></p>
    <p>“A champion of type design”<br><a href="/node/14133" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">chester</a> of <a href="/node/14129" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Village</a></p>
    <p>“Bound to become the most feared type critic of the Northern hemisphere&nbsp;:D”<br><a href="/node/12301" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Peter Bruhn</a> of <a href="/node/12045" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Fountain</a></p>
    <p>“His massive initial contributions to the Type Identification Board made it what it is today.”<br><a href="/node/12036" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Stephen Coles</a> of <a href="/node/12035" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Typographica</a></p>
    <p>“I’m just a glorified type nerd, really”<br><a href="/node/12040" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Yves&nbsp;Peters</a></p>
