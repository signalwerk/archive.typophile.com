    <a href="/wiki/chester%20jenkins" class="freelinking" rel="nofollow">chester</a> of <a href="/wiki/village" class="freelinking" rel="nofollow">village</a></p>
    <p>"Bound to become the most feared type critic of the Northern hemisphere :D"<br>
    <a href="/wiki/Peter%20Bruhn" class="freelinking" rel="nofollow">Peter Bruhn</a> of <a href="/wiki/Fountain" class="freelinking" rel="nofollow">Fountain</a></p>
