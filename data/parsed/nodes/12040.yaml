    <p>Here is what people have said about Yves Peters:</p>
    <p>"Everyone's favourite rock 'n' roll typographer"<br>
    <a href="/wiki/David%20John%20Earls" class="freelinking" rel="nofollow">David John Earls</a> of <a href="/wiki/Typographer.org" class="freelinking" rel="nofollow">Typographer.org</a></p>
    <p>"He made it cool to be a Type I.D. nerd"<br>
    <a href="/wiki/Brian%20Jaramillo" class="freelinking" rel="nofollow">Brian Jaramillo</a> of <a href="/wiki/Agency26" class="freelinking" rel="nofollow">Agency26</a></p>
