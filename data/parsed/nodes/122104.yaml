      <div class="comment-spam-body"><p><cite>Can it be done with only one line?</cite></p>
      <p>No. Feature code has some real limitations. I did a connecting script this year and discovered just how much feature code won't do in certain situations. To me that's a real shortcoming since connecting scripts with alternates have been around for well over a hundred years.</p>
