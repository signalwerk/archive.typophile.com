  html: |-
    <p>I continued working on this handwritten typeface and while I made alternates to replace double vowels before, I would prefer to replace both vowels individually.</p>
    <p>So, right now I have the following feature:<br>
    sub a a by a_a;</p>
    <p>/a_a features two variants on /a that are both different from the default /a. Essentially what I want to do is replace /a /a by /a.alt1 and /a.alt2 instead of /a_a, because I want to maintain the ability to apply tracking to all the letters.</p>
    <p>Now, I actually have this feature working with the following code:<br>
    sub a' a by a.alt1;<br>
    sub a.alt1 a' by a.alt2;</p>
    <p>However, this doesn't seem to be the most beautiful solution and I'm not sure if there are instances where this feature won't work appropriately. Is there a better solution than this? Can it be done with only one line?</p>
  html_clean: |-
    <p>I continued working on this handwritten typeface and while I made alternates to replace double vowels before, I would prefer to replace both vowels individually.</p>
    <p>So, right now I have the following feature:<br>
    sub a a by a_a;</p>
    <p>/a_a features two variants on /a that are both different from the default /a. Essentially what I want to do is replace /a /a by /a.alt1 and /a.alt2 instead of /a_a, because I want to maintain the ability to apply tracking to all the letters.</p>
    <p>Now, I actually have this feature working with the following code:<br>
    sub a' a by a.alt1;<br>
    sub a.alt1 a' by a.alt2;</p>
    <p>However, this doesn't seem to be the most beautiful solution and I'm not sure if there are instances where this feature won't work appropriately. Is there a better solution than this? Can it be done with only one line?</p>
