      <p><cite>And: no, Google hasn’t asked me if they could put my book online, and they’re not sending me cheques. Should I send an invoice? That might be a good way to finance a 2nd edition. Any help with this is appreciated (seriously).</cite></p>
      <p>First of all, I'm not a lawyer nor have I any experience on contracts with the print industry other than what I've read through the years, but still, since you asked, I'll voice my view on the matter.</p>
      <p>The Google Book site says that it has the permission of the publisher to display the whole book on the site; as they are a reputable publisher one could presume that the contract you made with the publisher included a clause that gave them the rights to publish the book electronically. You might want to review the contract and see if this is so.</p>
      <p>As for Google sending you any checks; it seems that they do not pay the publisher any money directly due to the publication of the book in the service; they however fund the service with ads displayed while viewing the book. They pay the publisher a certain amount of money (as to what this amount is, I have no idea) for each click a reader makes while viewing the book.</p>
      <p>This would imply that the publisher receives money directly due to the book, which would imply that you would be justified to receive royalties based on that amount. You might want to go through your royalty cheques/letters from the publisher and see if they specify from which sources the royalty is derived.</p>
      <p>If you have not received any royalty cheques in a while, Google Books says it offers the publisher an easy way of tracking the clicks and amount made from ads according to each book. You most probably have a right to view the accounts that relate to your books, so you might want to politely inquire a copy of these statistics from the publisher in a letter. That said, contracts, according to my understanding, quite often state an amount that royalties have to accumulate to before they are paid. It might simply be that your share of the amount the publisher has received from the ads has not yet amounted to this. You might want to check up on this in the contract.</p>
      <p>This all being said, it seems rather impolite for the publisher to release the whole book to be viewed for free as it pretty much takes away any reasonable chance of a reprint, therefore in a sense depriving you of the monetary income from that source. But if the contract states they have the right to do so, then they have that right. You could always see a lawyer for help with the matter, but I couldn't say whether the cost is worth the possible gains.</p>
      <p>Just my two cents, hope it's of some help.</p>
