      <p>A few comments regarding Google books:</p>
      <p>1. Normally Google books allows only a preview of the full book for copyrighted books. The idea is to allow full text searches, but also to entice the visitor to buy the full text. For "normal" books this usually means allowing the visitor to see a couple of pages. Since your book is so graphic-rich, I can easily see why allowing full text browsing of low-res scans was allowed. The discussion here actually supports that decision, as the physical books is still highly sought after despite scans being available.</p>
      <p>2. Since Google scanned quite a bit of out-of-print (but still copyrighted) books, there was some litigation that ended in settlment <a href="http://techcrunch.com/2009/02/11/google-book-settlement-site-is-up-paying-authors-60-per-scanned-book/" title="http://techcrunch.com/2009/02/11/google-book-settlement-site-is-up-paying-authors-60-per-scanned-book/">http://techcrunch.com/2009/02/11/google-book-settlement-site-is-up-payin...</a><br>
      US copyright holders are entitled to one-time compensation and share of the ad revenues from the pages of your book, IF you claim your right to Google. Not sure what the deal is for European copyrights, I guess you can do further research <a href="http://en.wikipedia.org/wiki/Google_Book_Search_Settlement_Agreement" title="http://en.wikipedia.org/wiki/Google_Book_Search_Settlement_Agreement">http://en.wikipedia.org/wiki/Google_Book_Search_Settlement_Agreement</a></p>
      <p>3. There is a program underway that will allow proper book sales through Google books. Because of number of parties involved, it is unclear yet exactly what form it takes, but if it comes with print-on-demand option and hi-res download option, funding the second printing might not be a problem. ;)</p>
