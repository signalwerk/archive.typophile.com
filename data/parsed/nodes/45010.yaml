    html: |-
      <p>Hi, I thought it would be good to give you all an update on the Dutch Type situation.<br>
      The first edition of the book, 3500 copies, is sold out.  There may still be copies floating in space, but all in all it's very hard to find. Doing a reprint would be an option. There seems to be a demand, which is flattering, although whether that demand will cover a minimum run of, say, 3000 copies, remains to be seen. Problem with a subsidized book (I suppose you know that 90 percent of Dutch books on cultural matters is subsidized?) is that they're such good value initially that a 2nd printing  becomes more tricky to finance. The dollar-euro situation doesn't make it easier: a reasonably prized book from Europe becomes a luxury item in the US.<br>
      What complicates matters is that I'd feel uncomfortable about just reprinting the book without updating it: the last chapters are pretty much a snapshot in time of the situation 5 years ago, and I think a 2009 or 2010 edition should be an updated one.  Besides, the book has a number of  (minor:-) errors that need to be corrected anyway. Which means work -- most of it unpaid -- that I'm not really looking forward to. But I'm a Dutch pseudo-calvinist and have a strong sense of duty, so who knows.<br>
      Now you want to know how many copies are sitting on my shelves. Very few. Less than a dozen. Of course I could speculate with them a bit, wait till the market value goes up, auction them at what then would be a fair price, and earn myself a couple of  days on a wellness farm.  But I guess the last copies will be given away or sold to friends and colleagues before that day comes.<br>
      Back to the reprint option: I think I'd need a well-informed, well-organized English-language intern with connections in the publishing world to pull it off any time soon.<br>
      BTW: yes, I do live in Berlin. My Typophile <a class="freelinking external" href="http://typophile.com/node/35512?" rel="nofollow">bio page</a> is more or less up to date. And: no, Google hasn't asked me if they could put my book online, and they're not sending me cheques. Should I send an invoice? That might be a good way to finance a 2nd edition.  Any help with this is appreciated (seriously).</p>
