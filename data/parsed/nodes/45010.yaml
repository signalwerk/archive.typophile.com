    html: '<p>Google has ignored repeated requests to stop their groups from pirating fonts. They take over a month to send stock replies and still do nothing in the end. Their banner ads are also often one of the primary revenue sources for pirate sites: so you can visit a warez site where fonts are being "shared" and click on a paid link for fonts.com. Essentially, fonts.com pays per click to the pirate site via Google. The clever Google placement engine specifically targets pirate font sites to place the targeted click though links for font companies that pay Google.</p>'
