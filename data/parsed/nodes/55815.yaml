    html: <p>Thanks everyone for the replies.  I am new here - are there professional typographers on these forums who can help with this type of work?!  Actually, it's not an entire font.  I have a wordmark with 5 letters, that I really like at certain sizes, but I think it's too expanded or something, because the lettering is too small when the mark is 100px wide.  Most wordmarks are a decent size at 100px wide, but this one is just far too small, so I think the lettering needs to be narrowed, but I don't want to lose the look it has right now.</p>
