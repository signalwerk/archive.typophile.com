      <p>Arno, </p>
      <p>the "exclude_dflt" and "include_dflt" refer to languages only, because each script has a <code>DefaultLangSys</code> "language", i.e. within each script there is a set of languages plus a "default" language. As a font developer, you specify whether the lookups associated with the default language for a given script should be also registered in the "named" language ("include_dflt"), or whether they should be left out ("exclude_dflt"). </p>
      <p>There is a "DFLT" script tag, but its concept on the script level is different than the DefaultLangSys on the language level. Also, it's a fairly new addition to the OpenType spec and not all layout engines support it. </p>
      <p>So to give you a short answer: yes, the shorthand "exclude_dflt" and "include_dflt" only works for languages. Scripts are always mutually exclusive. </p>
      <p>The following is a way to define an OpenType Layout feature <code>swsh</code> to be registered in all globally (i.e. for the entire font) declared languagesystems: </p>
      <p><code>languagesystem DFLT dflt;<br>
      languagesystem latn dflt;<br>
      languagesystem latn ROM;<br>
      languagesystem cyrl dflt;<br>
      languagesystem cyrl SRB;</code></p>
      <p><code><br>
      feature swsh {<br>
        lookup swsh01 {<br>
        sub a by a.swsh;<br>
        } swsh01;<br>
      } swsh;</code></p>
      <p>The following is a valid way to write the same but using locally declared languagesystems (in AFDKO 2.5 syntax). </p>
      <p><code>feature swsh {<br>
        script DFLT;<br>
        language dflt;<br>
        lookup swsh01 {<br>
        sub a by a.swsh;<br>
        } swsh01;<br>
        script latn;<br>
        language dflt;<br>
        lookup swsh01;<br>
        language ROM include_dflt;<br>
        script cyrl;<br>
        language dflt;<br>
        lookup swsh01;<br>
        language SRB include_dflt;<br>
      } swsh; </code></p>
      <p>The following is an invalid way to write the same but using locally declared languagesystems (in AFDKO 2.5 syntax). I.e. it will not work with the current AFDKO syntax, although I guess it would be useful if such syntax were implemented. </p>
      <p><code>feature swsh {<br>
        script DFLT;<br>
        language dflt;<br>
        lookup swsh01 {<br>
        sub a by a.swsh;<br>
        } swsh01;<br>
        script latn include_DFLT;<br>
        script cyrl include_DFLT;<br>
      } swsh; </code></p>
      <p>This way, all lookups defined in the script <code>DFLT</code> would be also registered with the scripts <code>latn</code> and <code>cyrl</code>. However, the default implicit value for scripts should be <code>exclude_DFLT</code> in order not to break backwards-compatibility. </p>
      <p>Adam</p>
