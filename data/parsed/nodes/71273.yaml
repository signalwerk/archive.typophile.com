    html: <p>It is also worth remembering that the script + language system tag combination actually represents a particular typographic convention for that script, which may or may not directly relate to natural language usage. In theory, the tags could be used to differentiate e.g. French and German classicist typographic conventions for the Greek script. While it is attractive to software makers to link OTL language system tags to spellcheck and hyphenation dictionaries for natural languages, as Adobe do in InDesign, ideally a user should be able to tag text directly with the OTL language system tags. This should be possible in CSS3.</p>
