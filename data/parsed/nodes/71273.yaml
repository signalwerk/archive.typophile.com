      <p>No, this won't work. Try compiling it and you'll see that only the script tags DFLT and cyrl have been registered. (In fact, FontLab Studio doesn't even properly register DFLT and uses four zero bytes instead). </p>
      <p><a href="http://www.adobe.com/devnet/opentype/afdko/topic_feature_file_syntax.html#4.b">http://www.adobe.com/devnet/opentype/afdko/topic_feature_file_syntax.htm...</a> explains how it works in detail. </p>
      <p>I should revise my earlier statement: all lookups declared within a feature definition before an explicit <code>script</code> and/or <code>language</code> keyword are registered for all languagesystems specified globally. However, if you don't specify any global languagesystem, AFDKO will assume <code>languagesystem latn dflt;</code>.</p>
      <p>Adam</p>
