      <p>Arno, </p>
      <p>the "include_dflt" or "exclude_dflt" rules are just shorthands for the AFDKO compiler as to which lookups to associate with which languagesystems. </p>
      <p>The AFDKO code:<br><code>feature swsh {<br>
      script latn;<br>
      language dflt;<br>
      lookup swsh01 {<br>
      sub a by a.swsh;<br>
      } swsh01;<br>
      language ROM include_dflt; # (include_dflt can be omitted)<br>
      lookup swsh02 {<br>
      sub b by b.swsh;<br>
      } swsh02;<br>
      } swsh;</code></p>
      <p>will produce the the following OpenType languagesystems-to-lookups associations:<br>
      latn/dflt — lookups: swsh01<br>
      latn/ROM — lookups: swsh01 &amp; swsh02</p>
      <p>while the AFDKO code:<br><code>feature swsh {<br>
      script latn;<br>
      language dflt;<br>
      lookup swsh01 {<br>
      sub a by a.swsh;<br>
      } swsh01;<br>
      language ROM exclude_dflt;<br>
      lookup swsh02 {<br>
      sub b by b.swsh;<br>
      } swsh02;<br>
      } swsh;</code></p>
      <p>will produce the the following OpenType languagesystems-to-lookups associations:<br>
      latn/dflt — lookups: swsh01<br>
      latn/ROM — lookups: swsh02</p>
      <p>It does work in Adobe InDesign CS4 for example. </p>
      <p>If you mark your text as "U.S. English" in the Character palette's language selector, only "a" will be replaced with "a.swsh". </p>
      <p>If your code is like in my first example and you mark the text as "Romanian", both "a" and "b" will be replaced with the ".swsh" counterparts, but if your code is like in my second example, then only "b" will be replaced. </p>
      <p>I just tested it, it works as advertised. As I said, in InDesign CS4 and CS5 (and I think also in CS3) — but only if the language you want to use is in the Character palette's dropdown list for languages, and if you explicitly assign that language to your text. </p>
      <p>In Uniscribe-based applications, it all comes to whether an application that uses Uniscribe "signals" to the library that a non-default language is used for a text string. That may be the case for complex scripts currently (I don't really know), but I doubt this is done for Latin-based scripts in any applications. John Hudson might know. </p>
      <p>Best,<br>
      Adam</p>
