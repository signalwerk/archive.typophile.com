      <p>Arno, </p>
      <p>If there are no global languagesystems defined explicitly, then AFDKO assumes latn/dflt. </p>
      <p>Then, within each feature definition, if there are no explicit language and script statements, AFDKO assumes that that feature is registered into all globally defined languagesystems. That is, if there is no explicit definition, latn/dflt is assumed, otherwise all the languagesystems that you defined outside of the feature definitions. </p>
      <p>If you have explicit language and script statements within feature definitions, you must start the feature definition with a script statement, and then you need to basically work through all the scripts and languages that you registered globally, and decide what needs to be done for each (using the include_dflt and exclude_dflt statements). </p>
      <p>If you have a feature where you want script- or language-specific behavior, I for one always recommend spelling out all the scripts and languages, and even always use the include_dflt keyword if necessary. That is — for the sake of readability and predictability — do not use the implicit behavior but instead, always spell out what you want done. Then you have full control and know what you're doing. </p>
      <p>Implicit definitions are sometimes tricky because they may confuse you more than they will help. </p>
      <p>Adam</p>
