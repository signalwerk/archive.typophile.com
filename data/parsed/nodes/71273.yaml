      <p>@ Adam</p>
      <p>Thanks!</p>
      <p><code><br>
      feature swsh {<br>
      script DFLT;<br>
      language dflt;<br>
      lookup swsh01 {<br>
      sub a by a.swsh;<br>
      } swsh01;<br>
      script latn;<br>
      language dflt;<br>
      lookup swsh01;<br>
      language ROM include_dflt;<br>
      script cyrl;<br>
      language dflt;<br>
      lookup swsh01;<br>
      language SRB include_dflt;<br>
      } swsh;</code></p>
      <p>You were probably so detailed because of comprehensibility. The statement "include_dflt" can be omitted, because the language statement is set to include by default, right? And in case of the script statement it is just the other way around with the difference, that it can be exclusive only. And the statement "language dflt;" can be probably also omitted.</p>
      <p>It is much easier to keep the overview in your code.</p>
      <p>But this would result in the same, wouldn’t it?:</p>
      <p><code><br>
      feature swsh {<br>
      script DFLT;<br>
      language dflt;<br>
      lookup swsh01 {<br>
      sub a by a.swsh;<br>
      } swsh01;<br>
      script latn;<br>
      # language dflt;<br>
      lookup swsh01;<br>
      language ROM; # include_dflt;<br>
      script cyrl;<br>
      # language dflt;<br>
      lookup swsh01;<br>
      language SRB; # include_dflt;<br>
      } swsh;</code></p>
      <p>And how about this?:</p>
      <p><code><br>
      feature swsh {<br>
      # script latn;<br>
      # language dflt;<br>
      lookup swsh01 {<br>
      sub a by a.swsh;<br>
      } swsh01;<br>
      language ROM; # include_dflt;<br>
      script cyrl;<br>
      # language dflt;<br>
      lookup swsh01;<br>
      language SRB; # include_dflt;<br>
      script DFLT;<br>
      # (?) language dflt;<br>
      lookup swsh01;<br>
      } swsh;</code></p>
      <p>I ask, because if you open a font in FontLab, it does not display the statement "script latn; language dflt;".</p>
