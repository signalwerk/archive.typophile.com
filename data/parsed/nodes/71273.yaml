      <p><cite>One would think that if one specified the Serbian language with the Latin script, what one would get is the Croatian language.</cite></p>
      <p>Maybe 30 years ago one could have said that, but it's hardly acceptable now. Although the Serbian government officially uses Cyrillic script, Serbo-Croatian speakers who self-identify as Serbs, and use Serbian linguistic forms where these differ from Croatian, quite frequently use Latin script as well, and one really can't tell them that they're writing in Croatian when they do this.</p>
