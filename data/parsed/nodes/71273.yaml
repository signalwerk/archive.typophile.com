      <p>Arno, you're right. If <code>include_dflt</code>, <code>script latn</code> and <code>language dflt</code> are omitted, they are implied. </p>
      <p>You're also right that <code>languagesystem cyrl DEU</code> is allowed. Any mixture of valid script and language tags are permitted, except that for the <code>DFLT</code> script tag, named language tags are not permitted (only the special <code>dflt</code> language tag is allowed, which inside of the font file represents the DefaultLangSys). </p>
      <p>Note that <code>languagesystem grek BUL</code> is not allowed because <code>BUL</code> is not a valid language tag. The language tag for Bulgarian is <code>BGR</code>. Similarly, <code>TUR</code> is an invalid language tag but it keeps popping up. The valid language tag for Turkish is <code>TRK</code>.</p>
