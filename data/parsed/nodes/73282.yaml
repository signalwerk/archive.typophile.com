    <p>LEGAN is a font that follow the classical Trajan pattern, with Lower Cases now, following exactly several geometrical proportion like root five and divine proportion (Golden Rectangle), same like Greek Trajan Upper Cases used at TRAJAN COLUMN. LEGAN creation processes include drawing  and calligraphic artwork studies too.</p>
