    <p>Hello,</p>
    <p>I’m a Win 2000/FontLab 4.6 user.  Several years ago, I worked with a mac-only type designer to convert his commercial mac PS fonts to PS and TT for win.  Font technology has changed drastically since then!</p>
    <p>Some of these fonts are based on reverse images [solid-rectangle background with transparent glyphs].  </p>
    <p>Win fully supports a solid-rectangle glyph in the spacebar cell—a very cool, intuitive feature to be preserved if possible.</p>
    <p>When these fonts were first developed c1997, the mac OS in use at the time did not support a spacebar glyph.  Experiments crashed the designer’s machine.</p>
    <p>Now that OSX [theoretically?] supports win-generated TTFs, I’m concerned about spacebar glyphs after reading this info:</p>
    <p><a href="http://typophile.com/node/30303" title="http://typophile.com/node/30303">http://typophile.com/node/30303</a><br>
    <a href="http://developer.apple.com/textfonts/TTRefMan/RM07/appendixB.html" title="http://developer.apple.com/textfonts/TTRefMan/RM07/appendixB.html">http://developer.apple.com/textfonts/TTRefMan/RM07/appendixB.html</a></p>
    <p>1) Is there a danger that a win-generated TT font with a glyph assigned to the spacebar cell would crash an OSX system?</p>
    <p>2) Would PS-favor OT do a better job of supporting this glyph than TT?</p>
    <p>3) Is there a FontLab setting, default character or CodePage combo for a win/mac solution with spacebar glyph support?  </p>
    <p>4) Is it likely that win support for spacebar glyphs will continue in the foreseeable future?</p>
    <p>5) In FontLab’s Naming dialog, there is an option in the More Styles list labeled “negative.”  This term is not defined in the manual.  If I chose it, it does not stay selected.  </p>
    <p>Is it relevant to this kind of font?  If so, how can I use it?</p>
    <p>Many thanks for your help, Anna<br>
    —<br>
    The Type Heritage Project<br>
    Honoring the Genius of Type Designers<br>
    from Ancient Scribes to Digital Wizards</p>
