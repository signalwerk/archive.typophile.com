    html: <p>I just tested this on my OSX 10.3 system.  I made a font with a X-shaped contour in the space glyph in TTF format, and then installed the font on OSX.  Using TextEdit (the simple text-editor that comes with OSX), I wrote out some text and then set it to use the font I’d just made.  It showed the contour that I’d put in the space glyph as you would expect, everywhere there was a space character.</p>
