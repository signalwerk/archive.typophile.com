    <p>This is from a 2008 political science book published in Germany. It is pretty decently designed, compared to most other publications in its academic field, the typographic standard of which is pretty low these days IMHO (in Germany, that is).</p>
    <p><img src="http://i.imgur.com/F7999.png"></p>
    <p>(sorry, no better qualitiy available)</p>
    <p>The typeface used looks one of those Caslon revivals, c. 1900; Binny/Bruce/Monotype »Old Style«, etc.: the T, E, the g, the Q, the numerals... but which one is it? <a class="freelinking external" href="http://www.identifont.com/list?2+monotype%20old%20style+0+4J5+1+S1+1+NGT+3" rel="nofollow">Monotype Old Style</a> is close, but it's not quite it. I've had a look at several »proper« Caslons, but none of them had that Q. What's weird about this book, by the way, is that there's <em>no italics</em> it.</p>
    <p>thanks in advance!</p>
