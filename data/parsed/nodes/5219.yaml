    html: "<p>To get the width of a string set in a given font, you need: <br> <br>- font size <br> <br>- the font itself (advance widths at least) <br> <br>- to know if kerning is on, and if so, account for it as well <br> <br>- if it's TrueType (as Arial is), and you're looking at the hinted widths, you need to actually run the glyphs as programs to see whether the widths change <br> <br>This assumes the text isn't justified and has nothing else to mess up its spacing.... <br> <br>Regards, <br> <br>T</p>"
    html_clean: "<p>To get the width of a string set in a given font, you need: <br> <br>- font size <br> <br>- the font itself (advance widths at least) <br> <br>- to know if kerning is on, and if so, account for it as well <br> <br>- if it's TrueType (as Arial is), and you're looking at the hinted widths, you need to actually run the glyphs as programs to see whether the widths change <br> <br>This assumes the text isn't justified and has nothing else to mess up its spacing.... <br> <br>Regards, <br> <br>T</p>"
