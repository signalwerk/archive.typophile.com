    html: <p>"I'm exploring some ways to get text to fit within a certain pixel width of an html table cell." <br> <br>That's not how the web works. The best you can do is suggest a typeface at a certain size, but you need to accomodate the fact that anyone can change the typeface and size as they personally see fit. <br> <br>If you're OK having text just 'disapear' then wrap the text in a fixed-sized div with overflow set to hidden. <br> <br></p>
