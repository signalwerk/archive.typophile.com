    html: <p>You might consider using a monowidth font - that'll save you a lot of coding. <br> <br>Otherwise you might use canned approximations of bitmap widths for "prototypical" glyphs (which does depend on point size though) - like take "i" to be three or four pixels. Arial would be a good source for these. <br> <br>hhp <br></p>
