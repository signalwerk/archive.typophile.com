    <p>Hello All,</p>
    <p>In FontLab 4.6 is was possible to select a node by dragging and then deleting it together with the curves from and towards that node.<br>
    Is this possible in FontLab Studio 5 for Macintosh (I can’t figure out how)?</p>
    <p>Regards,<br>
    Pieter</p>
