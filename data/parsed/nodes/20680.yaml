      <p>Hi, Peter</p>
      <p>In order to break the contour when deleting a point you must apply the correct settings in “Options”.</p>
      <p>Go to Tools&gt;Options&gt;Glyph Window&gt;Advanced<br>
      and check the box where it says “Edit/delete command breaks contour”</p>
      <p>That’s it</p>
      <p>Regards</p>
      <p>Magnus</p>
    html_clean: |-
