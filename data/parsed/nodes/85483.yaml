    <p>I am extremely new to this forum, so pardon my lack of typographic lingo and such.</p>
    <p>This <a class="freelinking external" href="http://www.brandsoftheworld.com/sites/default/files/styles/logo-thumbnail/public/092011/magna.png" rel="nofollow">logo</a> has text saying "Magna" in a sort-of Magneto look-a-like font.  I was wondering if anyone could identify this font and direct me to where I can purchase/download it.  Thanks in advance, Polarity.</p>
