    date_raw: 12 Feb 2003 — 8:14am
    votes: null
    html: <p>And cross stitching... <br> <br>Speaking on "first pixel fonts, I own two embroidery books, containing more of 200 full square flavored alphabets, most of them are very "enlightened" with more of 30 pixels x-height, but the small sizes, 7, 9, 10, 12, are very similar to our contemporanean screen fonts (Silkscreen and others) <br>They all came from the "Sajou", "Rouyer" and "Alexandre" embroidery booklets, from 1940/50 I think. <br> <br>By the way, my favorite classic pixel font is Georgia in small sizes.</p>
    html_clean: <p>And cross stitching... <br> <br>Speaking on "first pixel fonts, I own two embroidery books, containing more of 200 full square flavored alphabets, most of them are very "enlightened" with more of 30 pixels x-height, but the small sizes, 7, 9, 10, 12, are very similar to our contemporanean screen fonts (Silkscreen and others) <br>They all came from the "Sajou", "Rouyer" and "Alexandre" embroidery booklets, from 1940/50 I think. <br> <br>By the way, my favorite classic pixel font is Georgia in small sizes.</p>
