    html: <p>But if you want something that has U&amp;lc, and suitable for body text and not just for navigation or captions, check out <a href="http://www.wpdfd.com">MiniHaha</a>, the sister (or descendent?) of Mini 7. We're using that on <a href="http://www.typophile.com/">our home page</a> right now. The two faces work brilliantly together. Well worth the equally mini price tag.</p>
