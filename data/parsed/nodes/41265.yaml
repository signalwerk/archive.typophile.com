    <p>Ok so I’ve been considering getting an established logo going but there are so many good choices out there. I’ve narrowed it down to 4 different ones that I like.</p>
    <p>I’m a freelance web designer but the site is basically non-important drivel and banter ... so take that into account when considering which choice. It needs to be professional enough to look like I didn’t slap Arial on there, but cute / playful enough to fit the style of my site. Check out <a href="https://web.archive.org/web/20080821152435/http://tinycrumb.com/home">the site</a> for a better idea of the style I’m going for.</p>
    <p>Also, along with which choice, I’d appreciate any critique on them individually, e.g., if Kerning is off on one particular one, if one choice is just really bad type-wise, etc...</p>
    <p>I am a noob though so please be nice :)</p>
