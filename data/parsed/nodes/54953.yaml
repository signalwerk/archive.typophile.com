    date_raw: 18.Feb.2009 10.48am
    votes: null
    html: |-
      <p>Oh thank you chasteauneuf for your feedback!!! =)</p>
      <p>The child like colors were suppose to be “rgb” — that’s the only reason I used it. Not my most favorite combo. </p>
      <p>I did play with the type and kerned and tweaked the hell out of it. But I don’t know how interesting it would be without the visual elements in both the options. </p>
      <p>The idea for the circles comes from mathematical theories (but that is way to technical and off base with what the company does). So I refined it to be a simpler and more visual appealing. </p>
      <p>The test tube idea came from reading some of the copy (i.e. business plans/elevator pitch) and even though there isn’t a lab. The words “experiment” “mix” “blend” were words reoccurring in the copy.</p>
    html_clean: |-
