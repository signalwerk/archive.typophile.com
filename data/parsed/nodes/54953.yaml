    html: <p>I love the font and the dark green colour you use on some of the first options. So I think definetely on the way. Quite like the first option with the circles...could you just loose the icon all together? Just think the icon is a bit too fussy and it needs more simplicity. The second options are good too but the different colours almost look a bit child focussed so maybe something abit crisper? Perhaps less wavy almost?</p>
