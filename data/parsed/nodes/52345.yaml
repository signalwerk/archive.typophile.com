      <p>Thanks for the good suggestions. Because my deadline was the 10th I didn't change much on the type, but I do think I will ditch the high join on the h-e like was suggested and  try one where they are connected at the bottom. </p>
      <p>Randy: it's not a series right now but I could see it a couple of ways it could be. Glad to see we were on the same page about using the same type as on the can. I omitted the SOUP face because it would have been clunky.</p>
