    <p>I'm doing a poster for Austin Food Bank for my design class at Texas State. I'm setting the headline on a Campbell's soup can. I was not able to find a font that came close enough for my taste, so I'm attempting to mimic the script. I don't have any experience lettering so let me know what you think. The Headline Reads </p>
    <p>The Bank<br>
    That Deserves A<br>
    Bail Out.</p>
    <p>I wanted to wait for some opinions before I started the T so I used commercial script as a place holder</p>
    <img typeof="foaf:Image" class="img-responsive" src="http://www.typophile.com/sites/default/files/old-images/thebankcampbells.jpg" width="600" height="374" alt="">
