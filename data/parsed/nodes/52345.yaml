      <p>Super headline. Is this one of a series? If so what are the other lines? (there's probably a TARP line to be discovered)</p>
      <p>The h-e combo is a bit awkward since the original e is a result of the high join with the b. But I wouldn't worry about it since it's a campbell's distinctive.<br>
      Rather than set the whole headline in Campbell's script, consider using all the type on the can (you may already be doing this).<br>
      Eg:<br>
      "Campbells" =&gt; The Bank<br>
      "CONDENSED" =&gt; THAT DESERVES<br>
      "Cream of Mushroom =&gt; A Bail Out </p>
      <p>Don't forget to show us the final result.</p>
      <p>Randy</p>
