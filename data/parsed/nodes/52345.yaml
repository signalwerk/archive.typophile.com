      <p>I think the stem and crossbar of the T should be joined. That would start making it match the B better. If you want to go further perhaps try making the crossbar a bit longer on the right side so it is over the h more, and think about the relationship between it and the angle of the top of B.</p>
      <p>Nice work. Have you tried printing the label and photographing it around an actual can? A whole stack of these would look great especially if a few were slightly dented.</p>
