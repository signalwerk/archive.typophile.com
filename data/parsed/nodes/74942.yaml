  html: |-
    <p>I have this lookup for ordinals. It works OK for 1st, 2nd, 3rd, 4th, etc., and for Caps, 1ST, 2ND, 3RD, etc., but not for ordinals in French or Spanish, which use one or three ordinals e.g. 2º or 1ème.</p>
    <p>How can I change my code to cater for one or more alpha characters after the digits? One to three superscripts would be OK, but I think one or more would be more flexible. </p>
    <p>feature Ordinals ordn {<br>
        lookup Ordinals;<br>
    }<br>
        group @Digits [zero-nine];<br>
        group @Alphas [A-Z a-z];</p>
    <p>    lookup Ordinals{<br>
        context (@Digits) @Alphas @Alphas;<br>
        sub 0 Super;<br>
        sub 1 Super;<br>
    }  lookup Super {<br>
        sub [A-Z] -&gt; [uniEAA1 - uniEABA];<br>
        sub [a-z] -&gt; [uniEAC1 - uniEADA];<br>
    }</p>
    <p>I am using <a class="freelinking external" href="http://home.kabelfoon.nl/~slam/fonts/otcomp.html" rel="nofollow">OpenType Compiler</a>.</p>
