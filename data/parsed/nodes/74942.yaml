    html: |-
      <p>I found my own solution with some help from the Serif™ forums.</p>
      <p>The following code does what is needed as long as the ordinal glyphs are included in the font and have the corresponding Postscript names.</p>
      <p>feature Ordinals ordn {<br>
          lookup Ordinals;<br>
      }<br>
          group @Ordinals [zero-nine uniE2C0-uniE2C9 uniEAA1 - uniEABA uniEAC1 - uniEADA uniEB28 uniEB3A uniEB48 uniEB5A];<br>
          group @Alphas [A-Z a-z Egrave Uacute egrave uacute];</p>
      <p>    lookup Ordinals{<br>
          context (@Ordinals) @Alphas;<br>
          sub 0 Super;<br>
      }  lookup Super {<br>
          sub [A-Z] -&gt; [uniEAA1 - uniEABA];<br>
          sub [a-z] -&gt; [uniEAC1 - uniEADA];<br>
          sub Egrave -&gt; uniEB28;<br>
          sub Uacute -&gt; uniEB3A;<br>
          sub egrave -&gt; uniEB48;<br>
          sub uacute -&gt; uniEB5A;<br>
      }</p>
      <p>The @Ordinals group includes the digits, OldStyle figures, and the Superscripts, so any character in the @Alpha group following a digit or superscript in the @Ordinals group will use the "Super" lookup table, and will also be superscripted. As soon as a character not included in the @Alpha group is encountered, the superscripted text reverts to normal text.</p>
      <p>I used FontCreator 6.1 to create my fonts. I wrote a script to map the ordinals, copy the base glyphs, scale them, and embolden them. That removes much of the donkey work. I included capitals for using ordinals in All Caps or Small Caps text.</p>
