      <p><a href="http://graphicdesign.sfcc.spokane.cc.wa.us/tutorials/process/type_basics/slab_serif.htm" rel="nofollow">Basic information</a> on Slab Serifs</p>
      <p>The first typeface to be registered:</p>
      <p>"The first face to be registered was Besley’s Clarendon type in 1845. It has been argued that Besley’s foundry was not the first to offer a typeface of this kind, but the act of naming the face and registering that name secured the grounds to defend its ownership. By the mid nineteenth century typeface names were acting as marketing tools and marks of property and effectively this remains the case.<br>
      -- from <a href="http://www.typotheque.com/site/article.php?id=62" rel="nofollow"><em>Thirty-six point Gorilla</em></a><br>
      by Emily King</p>
      <p>If I find more I will post it.</p>
      <p>Yes, I'm old, but I'm back in style!</p>
