      <p>First, please know that many designers are credited when making a version of the original typeface. The original was done in 1845 by Robert Besley!</p>
      <p><a href="http://www.linotype.com/187/hermanneidenbenz-designerfonts.html" rel="nofollow">Hermann Eidenbenz</a> created a version of Clarendon in 1953.</p>
      <p>I was just about to give you this link about Freeman "Jerry" Craw, who created a famous version called <a href="http://www.tdc.org/events/2003crawtalk.html" rel="nofollow">Craw Clarendon</a>.  I had the pleasure of meeting Mr. Craw several times at Type Directors Club meetings, so you know it can't be as old as the original Clarendon.</p>
      <p>I don't think you will find EVERY variation of the original Clarendon, but just know that the two above are very well known and accepted.</p>
      <p>------------------------------------------------------------<br>
      Yes, I'm old, but I never met Robert Besley!</p>
