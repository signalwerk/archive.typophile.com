    <p>I´m searching for Information about Robert Besley and Besley´s Clarendon Type</p>
    <p>I´m a student of Graphic Design from University of Buenos Aires, Argentina and I´m working on an investigation of the Clarendon Typography. Luckily, I´ve found this site. I´ve been looking for information about Robert Besley and his Clarendon family type but I could not find anything. I´ll apreciate very much if you could help me with some references where to find or if you could send me some info for my investigation. &nbsp;  </p>
    <p>Thank you very much, &nbsp;<br>
    Maximiliano del Intento</p>
    <p>My email: <a href="mailto:mdelinte@telecominternet.com.ar">mdelinte@telecominternet.com.ar</a> / <a href="mailto:email@arnet.com.ar">email@arnet.com.ar</a><br>
    ___________</p>
    <p>A quién corresponda:</p>
    <p>Soy estudiante de la carrera de Diseño Gráfico en la Universidad de Buenos Aires, Argentina... Estoy haciendo una investigación sobre Robert Besley, creador de la typografía Clarendon... y lamentablemente en diversos medios intenté obtener información y no tuve éxito.</p>
    <p>Agradecería infinitamente si usted pudieran enviarme algún tipo de info relacionada o en su defecto alguna referencia de búsqueda ya que sinceramente ya no se me ocurren alternativas.<br>
    Desde ya muchísimas gracias!<br>
    Saludos.<br>
    Atte. Maximiliano del Intento.</p>
    <p>Mi email: <a href="mailto:mdelinte@telecominternet.com.ar">mdelinte@telecominternet.com.ar</a> / <a href="mailto:email@arnet.com.ar">email@arnet.com.ar</a></p>
