    html: <p><a href="http://www.emigre.com/dp/getfontpage.php?PTarNR.html" target="_blank"> Tarzana</a> does. Tarzana roman (no slant) is inspired by its own italics, with an italic style cap E and some other less formal traits to match. <br> <br>In traditional serif faces the italic a will do just that (while the accompanying roman will have both stacked forms of a and g). It has more to do with staying true to italics. <br> <br>I'd say, just do what works, but make sure you have good reasoning that can help you drive other decisions about the face as its developed. Both the stacked a and the stacked g offer more interesting flexibility, in terms of letting you push the personality of a face. Then again, as with Futura, the single-story a and g both add to it's rationalized lack of personality.</p>
    html_clean: <p><a href="http://www.emigre.com/dp/getfontpage.php?PTarNR.html" target="_blank" class="link-external"> Tarzana</a> does. Tarzana roman (no slant) is inspired by its own italics, with an italic style cap E and some other less formal traits to match. <br> <br>In traditional serif faces the italic a will do just that (while the accompanying roman will have both stacked forms of a and g). It has more to do with staying true to italics. <br> <br>I'd say, just do what works, but make sure you have good reasoning that can help you drive other decisions about the face as its developed. Both the stacked a and the stacked g offer more interesting flexibility, in terms of letting you push the personality of a face. Then again, as with Futura, the single-story a and g both add to it's rationalized lack of personality.</p>
