      <p><cite>I believe Ææ (Œœ) are digraphs, not ligatures, and I believe further that it is very much a distinction with a difference.</cite></p>
      <p>It’s a common misunderstanding that a »ligature« has to be a different thing than letter, digraph or whatever. Ligature just means that there is something that is connected (From Latin LIGARE - to bind). </p>
