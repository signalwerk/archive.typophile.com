    html: <p>Well, it just depends what you call the “alphabet”. Even when I say, ä/ö/ü/ß belong to our alphabet, we still usually say the alphabet has 26 letters, so we don’t count ä/ö/ü/ß. In a broader sense the “alphabet” are the letters that were used for Latin. But all the languages that are based on the Latin alphabet needed special characters (diacritical marks) to represent the certain local pronounciations. This is true for almost all European languages. A French é is equally important as your å. The reason  why people sometimes don’t consider them as part of the alphebet is because they are build from other latin characters. But that doesn’t mean they can be omitted. I cannot use a o instead of ø in your language, can I? Same is true for German umlaut or French accents.</p>
