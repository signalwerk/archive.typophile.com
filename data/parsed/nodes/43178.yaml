      <p>What constitutes a distinct letter in one alphabet may be considered only a modification of a letter, and hence of its pronunciation, in another alphabet. Hence, the same diacritic letter may function differently in different alphabets. This may affect sorting decisions.</p>
      <p>Joe: <em>I believe Ææ (Œœ) are digraphs, not ligatures, and I believe further that it is very much a distinction with a difference.</em></p>
      <p>A digraph is a sequence of two letters functioning as a single phonemic signifier — e.g. ’ch’ in English ’church’ —, so the term doesn’t automatically apply to the æ and œ. I would probably call those something like ’compound letters’, at least as the former is used in Norwegian, which is as a distinct letter, sorting separately from a and å. In other languages, æ and œ might be encountered as optional variant forms of the digraphs ae and oe; this is largely as they occur in modern French. In Latin, these forms have gone in and out of fashion, so are probably best considered ’historical ligatures’ for that language. So whether æ and œ are letters, digraphs or ligatures depends on what language you are looking at.</p>
