      <p>Whether these special glyphs are considered as separate letters or just diacritical could perhaps be differenciated by their status in a “alphabet listing” - as learned in school?</p>
      <p>The norwegian (and danish) alphabet contains 29 letters:<br>
      ABCDEFGHIJKLMNOPQRSTUVWXYZÆØÅ<br>
      but we also use many letters with diacritics:<br>
      ÀÉÓÔÒ and even others for foreign loanwords</p>
      <p>The swedish alphabet also has 29 letters, but a different selection (and order):<br>
      ABCDEFGHIJKLMNOPQRSTUVWXYZÅÄÖ</p>
      <p>These are all considered as separate letters, with their own entries/sections in encyclopaedias and dictionaries.</p>
      <p>Do most other latin languages consider their alphabets to contain 26 letters?<br>
      Hey, I’ll start a separate thread for that train of thought. Carry on. ;-)</p>
