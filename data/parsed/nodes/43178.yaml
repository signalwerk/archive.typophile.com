      <p><cite>«I believe Ææ (Œœ) are digraphs, not ligatures, and I believe further that it is very much a distinction with a difference.»</cite></p>
      <p>When typing on a keyboard that does not facilitate inputting Æ/æ or Œ/œ, forcing you to type Ae/ae and Oe/oe, then they are digraphs. In themselves, though, Ææ and Œœ are both alphabetic ligatures, not digraphs: they are single letters. Note that alphabetic ligatures are different from typographic ligatures in that they are historical contractions of letters (or one letter plus a second element) that have become single entities, rather than merely specialised versions of one or more letters, designed to be used only in conjunction with certain other characters.</p>
      <p>Other examples of alphabetic ligatures are regular letters with diacritic marks, especially when they are considered single letters, rather than modified letters, and even the letter G.</p>
      <p>&nbsp;</p>
      <p><cite>«Does the æ in Norwegian work the same as it does in Icelandic?»</cite></p>
      <p>Not quite, no. It appears in many (though not all) of the same words, where there are cognates, as in Norwegian, but phonetically and grammatically, they behave in different ways. In Norwegian, æ can be both long and short and is pronounced either [æ: / æ] or [e: / e] (the former being the ‘default’ pronunciation, the latter only found in a smaller number of words), whereas in Icelandic, it is always long and represents the diphthong [ai].</p>
      <p>In Norwegian, while the original grammatical (by which I really mean morpho-phonological) rôle is still found in many cases, it is no longer productive. In Icelandic, it is nearly always productive, though not always: æ is the regular outcome of an i-umlauted á. The concept of i-umlauting has been lost as a productive pattern in all Scandinavian languages (including Danish, but excluding Faeroese and Icelandic).</p>
      <p>&nbsp;</p>
      <p>The traditional way of representing æ, ø, and å in the Scandinavian languages when stuck in Cambodian Internet cafés and other such æøå-derived locations, is ae, oe, and aa. However, lately there seems to be a growing trend (especially common among Swedes) to simply use a, o, and a. Thus, a Swede would now commonly write, <em>“Min vaska holl pa a bli ranat”</em> (“My bag was being stolen”) in a colloquial-style e-mail from said Cambodian Internet café, whereas his worried mother sitting comfortably in her home in Swedish would be likely to reply with a properly diacrined (if I may thus verb a noun), though no more grammatically correct, <em>”Höll din väska på å bli rånat?”</em>.</p>
