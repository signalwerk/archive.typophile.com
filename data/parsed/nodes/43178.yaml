      <p>In Spanish, the accents simply mean either A- stress this letter, or B- break the diphthong that this letter is in.  There is no unique sound to them other than the letter is pronounced slightly louder.  Ñ is not considered an accented letter but a separate letter and represents a separate sound.  Older standards (pre 1998) dictated that the sequence «áéíóñúü» be capitalized thus: «AEIOÑUU», although now it’s standard to see «ÁÉÍÓÑÚÜ».  This shows they aren’t really needed for understanding the language though they certainly help.</p>
      <p>In German the umlauts developed from the writing traditions which had the letter e placed over top of vowels at times.  In old German handwriting, the e is composed of two diagonal strokes which later became realized as the umlaut we have today, again, German is quite readable without umlauts but it’s easier and more efficient with them.</p>
      <p>Each language has its reason for writing them as they do.  In some cases it means taking one letter and overtime re-realizing it as another letter with a mark (z-&gt;ç), while other times it’s quite deliberate (Danish aa-&gt;å).  Even the same modern diacritic can have two different sources and meanings in different languages (Germanic umlaut versus Romance diæresis).</p>
      <p>Ralf, my understanding was that although discouraged, it’s always “okay” when umlauts aren’t available to replace them with ae, oe, and ue respectively.  Has that changed?</p>
      <p><em>«El futuro es una línea tan fina que apenas nos damos cuenta de pintarla nosotros mismos». (La Luz Oscura, por Javier Guerrero)</em></p>
