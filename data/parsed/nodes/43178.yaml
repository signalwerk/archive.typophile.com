    <p>My alphabet (the Norwegian) contain the characters æ, ø and å. </p>
    <p>“Æ” (or “æ”) is a ligature made up of “a” and “e”. I’m not so sure what the two others are made up of. We tend to write “ø” as “oe” in international communication. I’ve seen “å” written as “aa” in old newspapers and letters, but I’ve also heard that it’s made up of “ao”.<br>
    These ligatures, or accented characters, are contained in the alphabet to describe a certain sound.</p>
    <p>My question is this: How come the Germans don’t include for example “ü” in their alphabet?</p>
    <div class="forum-topic-navigation clear-block"><a href="/node/42956" class="topic-previous" title="Go to previous forum topic">‹ Are you a Grammarian? 10 Grammar Myths</a> <a href="/node/43179" class="topic-next" title="Go to next forum topic">Study on Medical Typography ›</a></div>
