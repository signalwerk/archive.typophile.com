      <p>There is a distinction between digraphs and ligatures however the “ash” (æ) is indeed a ligature. A digraph is a combination of 2 characters representing a single sound (like the ph in phonetic) but are not necessarily visually connected like the æ.</p>
      <p>My interpretation (without any scholarly backing) is that most written languages based on the latin alphabet gave up trying to represent every specific sound in their language with a contrived alphabetic symbol and just started adding diacritic marks to the latin symbol that seemed closest.</p>
      <p>Consider the history of the U, double-U and V. All based on one latin symbol with 3 distinct sounds.</p>
