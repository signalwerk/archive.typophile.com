    html: <p>I'm familiar with this letter having an ascender, and only the Apple fonts seem to have the short form. I couldn't find the original Unicode proposal document for this character -- possibly it was included in one of the large early batches of pre-encoded characters --, but did find the proposal document for the related <em>shha</em> with spike descender, and the samples used to illustrate the proposal all have an ascender.</p>
