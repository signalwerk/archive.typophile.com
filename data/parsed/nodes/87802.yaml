    <p>I stumbled upon this h-like char. in Cyrillic Tatar. It seems to be not quite settled wether it has to be ascending or x-hight.<br>
    Any insights?</p>
    <p>B.t.w., I repeatedly face image upload hazard here. Admins, – any insights?<br>
    I’d really prefer to show the image directly, attaching a little png is clumsy.</p>
