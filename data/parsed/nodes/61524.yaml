    html: <p>PIN-UP magazine surprised me by their nice use of arial for display use. it's hideous that they use it for bodycopy through the whole magazine, but their use of it for display sizes, especially on the cover, really does look good. i had to take a second glance too to check that it's really arial that looks that good.</p>
