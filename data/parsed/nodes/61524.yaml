    <p>Hi,</p>
    <p>I need help to identify the font used in the PIN-UP Magazine Issue 6. It is a grotesque font. The form-principle is similar to Helvetica, Akzidenz. But it has some special characteristics, like the lowercase a, or the uppercase R. Maybe its custom made?</p>
    <p>Does anybody know this font?</p>
    <p>Nitzki</p>
