    <p>Clementhorpe is Greater Albion's latest project.  It's based on some 'found' lettering (about a dozen letters in all) in an early 1900's enamel advertisment for chocolate.  A sampling of work to date is shown below.  All feedback greatfully received...</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Clementhorpe-_5753.jpg"></div><p></p>
