    html: |-
      <p>I think a lot of the forms are very appealing, and I definitely think the style and feel of the original translates nicely.</p>
      <p>My issues with it involve some of the vertical strokes, especially on the lowercase. A lot of them just seem too thick and weight the letter one way or the other, like with the "p." I'm also not a big fan of the "S," I think the upward bulge in the bottom curve is just a bit much.</p>
      <p>These are the first impressions of a novice typophile, so take them for what they're worth. A well-executed revival, I say!</p>
