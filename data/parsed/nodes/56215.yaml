      <p>Awe this is the cutest post ever.<br>
      Seriously though I think that when designing something for a practical application or use there is great reward in seeing the design being used and appreciated over long term.<br>
      The exposure from winning contests is super. At this point in my career just seeing the satisfaction on a client's face once Ive given them something they appreciate is enough for me. Even encountering a piece of my portfolio in it's intended use years after designing it is satisfaction enough. I often feel like I've won an award just knowing people like and use my work. It is wonderful how my pieces show up in odd places and not a soul in the room can identify the connection between me and the design.<br>
      It is delightful like being the writer of a book with a secret alias.</p>
