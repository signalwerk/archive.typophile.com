      <p>@sii <em>...classic confidence scheme, where the mark gets a small pay-off at...</em> it's so funny that you refer to the scammed as a 'mark' it's like a spy movie!</p>
      <p>I generally feel weird about contests and whatnot but Jakes has a great point about employers and resumes and whatnot. I think it was at the AGI student conference this past Spring where the panel was giving us advice about winning contests:</p>
      <ul>
      <li>make it big, if it's printed and huge, it dwarfs everything when they're all laid out on the tables.</li>
