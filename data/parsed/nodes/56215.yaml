    <p>So the very first time I submitted to Print I got into the Print Design Annual.</p>
    <p>It was really great since that is my favorite design contest out there. However I have been submitting every year since and have not made it in again. So now they have raised their prices and I have lost a bit of my confidence...</p>
    <p>so my question is are design contests worth the money to submit and how can one tell when something is worth submitting?</p>
    <p>thanks!</p>
