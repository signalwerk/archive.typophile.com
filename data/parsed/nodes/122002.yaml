    html: |-
      <div class="comment-spam-body"><p>As for the Faux Russian letters, there is some pretty similar stuff in the Cyrillic glyphs of Parachute's Bodoni <a href="http://www.myfonts.com/fonts/paratype/bodoni/bodoni/glyphs.html" title="http://www.myfonts.com/fonts/paratype/bodoni/bodoni/glyphs.html">http://www.myfonts.com/fonts/paratype/bodoni/bodoni/glyphs.html</a> and New Standard <a href="http://www.myfonts.com/fonts/paratype/new-standard/pt-new-standard/glyphs.html" title="http://www.myfonts.com/fonts/paratype/new-standard/pt-new-standard/glyphs.html">http://www.myfonts.com/fonts/paratype/new-standard/pt-new-standard/glyph...</a> The latter was widely used in Russian language publications churned out by Moscow during the 1950s and 196o's and would almost certainly have been seen by a lettering artist of the era researching how to do a Faux Cyrillic.<br>
      Don</p>
      </div>
