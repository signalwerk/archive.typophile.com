      <div class="comment-spam-body"><p>Cute, but for some people who read Cyrillic a Faux Russian with Cyrillic letters substituted directly for the wrong Roman letters is a painful mish-mash.<br>
      But I do like the artwork. A charming children's storybook style that evokes the beloved family characters of Tolstoy's War and Peace.<br>
      Don</p>
      </div>
