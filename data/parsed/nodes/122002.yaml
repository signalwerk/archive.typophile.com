    html: <p>The album is from 1965; the versions in other languages - Russie de Toujours (France - 1965), Vodka and Wine (UK - 1966), Rußland wie es klingt und swingt (Germany - 1967), Russian Souvenirs (Holland - 1969) were more dignified; only in the United States was <em>faux</em> Cyrillic resorted to.</p>
