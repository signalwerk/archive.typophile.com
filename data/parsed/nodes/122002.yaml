    html: <p>The several phi and A letters are identical (I 'fused' pairs visually as in stereoscopic imaging, and the slightest difference would have immediately shown). A possibility is that they were concocted using parts of letters and decorative elements from a Letraset transfer sheet which had their heyday in the sixties.</p>
