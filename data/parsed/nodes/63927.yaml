  html: |-
    <p>Hey y'all - </p>
    <p>Do you prefer a single-story, handwritten kind of "a"?<br>
    Or a double-decker, typographic style "a"?<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/mingler_a_variations_4907.gif"></div><p></p>
    <p>I'm working on an update to my old Mingler font. </p>
    <p>It's been used in pizza commercials and ads for a<br>
    few years now, but now I get to give it a facelift<br>
    and re-issue it at my site soon.</p>
    <p>I wanna change the "a" and I could kinda go either.</p>
    <p>But I'm wondering, which do you like better?</p>
    <p>-chank</p>
