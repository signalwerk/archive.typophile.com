      <p>Can't name it and really doubt this is a font as it, more a customization of an existing typeface. I guess you do pretty much the same from many wide/extended grotesk., pulling up/downwards some middle crossbars and reworking /R.<br>
      2 alternatives in the same vein: <a class="freelinking external" href="http://www.myfonts.com/fonts/storm/abalda" rel="nofollow">Abalda</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/hubertjocham/motora-sans" rel="nofollow">Motora Sans</a><br>
      Candidates for customization: <a class="freelinking external" href="http://www.myfonts.com/fonts/synthview/novecento" rel="nofollow">Novocento Wide Demi Bold</a> (probably my choice because /W centre vertex is below the outer strokes), <a class="freelinking external" href="http://www.myfonts.com/fonts/paratype/engravers-gothic" rel="nofollow">Engravers Gothic Bold</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/glen-jan/road-radio" rel="nofollow">Road Radio</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/itc/blair" rel="nofollow">Blair Bold</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/fontdiner/turnpike" rel="nofollow">Turnpike</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/storm/zeppelin" rel="nofollow">Zeppelin</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/betatype/doublewide" rel="nofollow">Doublewide</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/typetrust/reservation-wide" rel="nofollow">Reservation Wide</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/typodermic/presicav" rel="nofollow">Presicav</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/positype/halogen" rel="nofollow">Halogen</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/filmotype/fashion" rel="nofollow">Fashion</a>, <a class="freelinking external" href="http://www.vllg.com/Constellation/Aero" rel="nofollow">Aero</a>, <a class="freelinking external" href="http://www.typography.com/fonts/font_overview.php?productLineID=100043" rel="nofollow">Idlewid</a>, <a class="freelinking external" href="http://fonts.kylewaynebenson.com/farmers-co-op" rel="nofollow">Farmers Co-op</a></p>
