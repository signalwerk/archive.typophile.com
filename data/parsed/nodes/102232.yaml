      <p>This is what was originally published by American Type Founders in 1934 as Thermotypes:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/ThermoTypes1@ATF1934_3473.jpg"></div><br>
      and<br>
      <div class="imageWrap"><img src="http://typophile.com/files/ThermoTypes2@ATF1934_6497.jpg"></div><br>
      The mid-line is high in Thermotypes, but it is low in the sample image, except for F, which is high. There is a different W. But the flavor matches the image and the midlines and other differences are easy to edit.<br>
      Don<p></p>
