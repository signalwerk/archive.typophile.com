  html: |-
    <p>Hello, I have developed a website that uses a particular font. All was good until the client told me that they want the website to be multilingual.</p>
    <p>The problem is that the font I have selected does not support some of the characters present in the other language (ex: ħ). I have little experience on how to solve this problem since this will be my first multilingual website. Therefore my question is; how can I search for a font that supports these special characters? Do I really have to go through all the fonts and try them out? Or maybe there are some well know fonts that support such special characters?</p>
