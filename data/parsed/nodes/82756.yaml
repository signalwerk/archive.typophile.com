      <p>If I remember correctly, <a href="http://www.wazu.jp/" title="http://www.wazu.jp/">http://www.wazu.jp/</a> lists stuff like that.</p>
      <p>But... for a quick stop, try looking at the <a class="freelinking external" href="http://www.dejavu-fonts.org/" rel="nofollow">DejaVu fonts</a> and the <a class="freelinking external" href="http://savannah.gnu.org/projects/freefont/" rel="nofollow">FreeFonts</a>. Both have good coverage.</p>
