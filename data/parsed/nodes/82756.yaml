    html: |-
      <p>For Google Web Fonts you can use the Chrome previewer extension to quickly see what the page will look like: <a href="https://chrome.google.com/webstore/detail/engndlnldodigdjamndkplafgmkkencc" title="https://chrome.google.com/webstore/detail/engndlnldodigdjamndkplafgmkkencc">https://chrome.google.com/webstore/detail/engndlnldodigdjamndkplafgmkkencc</a><br>
      Sorts Mill Goudy should work, for instance; probably Crimson Text, as well. Most don’t have the Esperanto characters I need, though they might have Polish and so forth.</p>
