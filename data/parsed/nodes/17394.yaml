    date: 2006-01-19T07:31:00
    date_raw: 19.Jan.2006 7.31am
    votes: null
    html: "<p>This appears to be a FL bug which I have also experienced. You need to assign the percent name and Unicode index - 0025 - manually. I have seen similar problems with hyphen (sometimes), and a couple of random glyphs: Imacron and musicnaturalsign.</p>"
    html_clean: "<p>This appears to be a FL bug which I have also experienced. You need to assign the percent name and Unicode index - 0025 - manually. I have seen similar problems with hyphen (sometimes), and a couple of random glyphs: Imacron and musicnaturalsign.</p>"
