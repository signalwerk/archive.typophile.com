  html: |-
    <p>Hi there,</p>
    <p>I have imported a percentage symbol design into Fontlab 5 from Illustrator CS; as I have done for all the other font designs but when generate the font and go to type the percentage symbol, either nothing comes up or is replaced by the question mark symbol. It is visable in Fontlab 5 as an outline but not when you view it in a new metrics window.</p>
    <p>Can anyone help....I’m a little stuck?</p>
    <p>Thank you.</p>
