    <p>I was lucky enough to receive this book as gift from my family (good to have a brother in the business). It seems like a really valuable read. I'd like to recommend it to beginners because of the original drawings, which I found very revealing, but I imagine the price and the more technical aspects might be a bit much. Perhaps a good addition to a college library.</p>
    <p>Cheers.</p>
