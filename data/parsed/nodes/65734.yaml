    html: |-
      <p>I'm up to the chapter on Frutiger, the typeface. Some gossip the type-crazed might be interested in: </p>
      <p>Frutiger was the third version of the same typeface idea. </p>
      <p>The first Concorde, never produced, came from a "whiskey sketch". When things got too hectic there was a bottle of whiskey that everyone would turn to to loosen up. After such a session, Frutiger drew the top terminal of a 'c', and explained to André Gürtler how the idea could be expanded into a typeface, and Gürtler writes "something wonderful happened, an energetic current ran through me." Frutiger gives Gürtler credit as a co-creator on Concorde. </p>
      <p>The second was Roissy, which Frutiger simplified and adjusted the weight of, as it was for airport signage. When Mike Parker saw it, he immediately saw that it would make a great face for print. </p>
      <p>Frutiger was so busy that he had Hans-Jürg Hunziker draw it. Frutiger says that Hunziker, who had spent four years at Merganthaler Linotype in Brooklyn, is "an unbelievably good draughtsman." He gives credit to Hunziker for the "high contrast terminals ...closer to an antiqua." These really give a shimmering beauty to Frutiger in large sizes, and though Frutiger only credits himself on this one, I'm glad that Hunziker's role is acknowledged, as I've long admired those special terminals. </p>
      <p>Mike Parker named it "Frutiger" because he thought it would be more difficult to pirate if it had someone's proper name. In retrospect, ha ha ha!</p>
      <p>Here's Frutiger on Myriad, which has been often discussed here on Typophile. Frutiger thought, "My typeface has gained a little cousin--and it's not badly done either." A fellow from Linotype then sent Frutiger side by side comparison, and then Frutiger was a bit miffed that Adobe had done such a similar typeface, because Adobe had just been digitizing Linotype's faces. But later he returned to his initial reaction: "Why shouldn't a good typeface be developed further by a third party? When I see today that someone has taken my thoughts and developed them further, I'm even proud of that." </p>
      <p>The comments on Frutiger Next are revealing in that Frutiger basically rips it. He thinks that it is more appropriate for the face to have a sloped roman, not italic characters. And he doesn't think the interpolated weights look as good as the original drawn ones. </p>
      <p>Not in this book is the new <a class="freelinking external" href="http://www.linotype.com/5940/introduction.html" rel="nofollow">Neue Frutiger</a>, which I imagine he is very happy with. Here he worked with Akira Kobayashi to correct the distortions due to the Linotype phototype restrictions to 18 widths, as explained last summer by Kobayashi in a lovely talk at TypeCon. And the sloped roman is back, as are the original proportions. I hope the issues of interpolation are also addressed, though I don't know. </p>
      <p>At any rate, I think it's great that he had a fourth bite at this apple, as he confesses it's his favorite of his typefaces: "It's probably the typeface that holds the middle ground of the type landscape. It's like a nail that's been driven, and on which you can hang everything. ...as typeface that really is beautiful, one that sings."</p>
      <p>Happy New Year Mr. Frutiger!</p>
    html_clean: |-
