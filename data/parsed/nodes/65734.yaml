      <p>I'm reading it right now, slowly working my way through it. To reduce the bite on my wallet, I got it used, 1/3 off. </p>
      <p>A tremendous amount of work has gone into it, and it was obviously a labor of love for all those involved. It combines copious illustration and extensive interviews with Frutiger on each typeface, keyed to the illustrations. Though often enough I question Frutiger's theories, I am learning a lot and loving it. </p>
      <p>I suspect you have to really be serious about type to enjoy this, but if you are it's a joy to read.</p>
      <p>It has to be one of the best books on type design, ever.</p>
