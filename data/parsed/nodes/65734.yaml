      <p>Sorry for any confusion: I was not, on this occasion, referring to the whisky.</p>
      <p>Bill: <em>...a successful type design needs to have its ’design DNA’ show in every feature...</em></p>
      <p>That's not quite what I meant, although I suppose that is largely the result. I was referring to the process by which a decision made regarding the design of one feature of one letter has implications for other features in other letters. Understanding those implications and either applying them, moderating them or rejecting them -- it is not a deterministic process, after all -- seems in large part how I spend my days.</p>
