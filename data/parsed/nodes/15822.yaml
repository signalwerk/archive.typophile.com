      <p>The Trajan column inscription was masterfully rendered thank to G.F. Cresci<br>
      and Luca Pacioli’s drawings.  Cresci arrived in Rome from Milan on 1550;<br>
      six years later was nomined “Scriptor Latinus” of the Library, and on 1560,<br>
      keeping his appointment, calligrapher for the Cappella Sistina, the time<br>
      he publish is writing book “Il Perfetto Scrittore”.</p>
      <p>Regards,<br>
      AS</p>
      <p>ps/ <a href="http://www.letterspace.com/LETTERPERFECT_FONTS/cresci.htm" title="http://www.letterspace.com/LETTERPERFECT_FONTS/cresci.htm">http://www.letterspace.com/LETTERPERFECT_FONTS/cresci.htm</a></p>
