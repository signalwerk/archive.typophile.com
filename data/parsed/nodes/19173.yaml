    html: |-
      <p><em>Would I make the vertical sections of the stroke wider? I was afraid that would give the appearance of stretching… suggestions?</em></p>
      <p>No, you want to keep the relative thickness of the horizontal and vertical strokes consistent, though not necessarily mechanically consistent. Your eye is the final arbiter. Basically, it means that the wider you go, the bolder you go, to keep the same color impression. Again, it's not a mechanical thing. You need to decide for yourself how much the stroke weight needs to change to achieve visual consistency. Take a look at type families with lots of widths and weights to see how others have done it.</p>
      <p><em>Mark, would you suggest a book on letter construction and typeface design? Something practical, with examples?</em></p>
      <p>These may be hard to find, but here are some I like:</p>
      <p>Type Sign Symbol, by Adrian Frutiger<br>
      The Modification of Letterforms, by Stanley Hess<br>
      Lettering Design, by Michael Harvey</p>
      <p>For the most part, these books are concerned with drawing letters by hand, but the main principles apply to digital type as well.</p>
