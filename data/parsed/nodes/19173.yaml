    <p><strong>TYPE BATTLE: Week 11 (10 April)</strong></p>
    <p>Here’s your chance to stretch your type muscles on a weekly basis. Each game kicks off on Monday with a new challenge, and closes at midnight PST on Friday. Anyone may submit a design response to the challenge. You may enter as often as you wish. Post anytime. Critiques and comments are welcome throughout the game, from participants and spectators alike. Smack talk is encouraged.</p>
    <p>Winner take all, no holds barred. May be the best designer win.</p>
    <p>Link directly to this thread: <a href="http://www.typophile.com/battle11" title="http://www.typophile.com/battle11">http://www.typophile.com/battle11</a></p>
    <p><strong>Requirements:</strong></p>
    <p>- Size: 600 width x 400 height. 72 dpi<br>
    - Color: Black and white only<br>
    - Format: Please save your graphics as PNG<br>
    - Only respond with the characters posted in the challenge.</p>
    <p><strong>// THIS WEEK’S CHALLENGE: S Mahem II<br>
    Design four more s's: Supercondensed, Condensed, Regular, Super Wide. For extra points: interpolate the characters with the four weights from last week.<br>
    </strong></p>
