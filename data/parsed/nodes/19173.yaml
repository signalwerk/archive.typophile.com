    html: <p>One thing to keep in mind when going from condensed to wide is maintaining the appearance of weight. Notice in some of these examples how much bolder the condensed appears compared to the extended. It's not too noticeable in the lightest weights, but the bolder you go, the more obvious it becomes. Weight is not just the relative thickness of the strokes, you must take into account the relationship of the strokes to the internal space.</p>
