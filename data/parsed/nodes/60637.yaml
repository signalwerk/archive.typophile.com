    <p>I’m stumped. The font identifier on fonts.com is stumped. Help!</p>
    <p>Sample A:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/sample3_6094.jpg"></div><div class="imageWrap"><img src="http://typophile.com/files/sample2_6244.jpg"></div><p></p>
    <p>My first thought was Trajan Pro or LaGioconda, but neither of those fit. Trajan Pro is very close, but the lower right serif on the capital A does not extend at all to the right in the sample. The font in the sample also appears to be squarer in its proportions.  </p>
    <p>Sample B:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/sample1_4412.jpg"></div><p></p>
    <p>I hope I'm not missing something obvious on this one. I thought maybe in the Garamond family, but nope. </p>
    <p>Thanks!</p>
