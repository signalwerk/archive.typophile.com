    html: <p>Very odd П, г, н, ь, ъ &amp; I don't really like Л, ы, у. The Serbian letters are incorrect. Because it's a script, it must either have Serbian cursive alternates for г, п, т, ш or have no Serbian glyphs at all, just not to confuse people.</p>
