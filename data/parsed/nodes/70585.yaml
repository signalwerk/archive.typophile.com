    <p>Hey All,</p>
    <p>I'v been asked by a client to convert this handmade type into a font, I have all the letters as a psd file, what's the best way of getting this all into Fontlab? </p>
    <p>I have saved as bmp, but Fontlab won't see them, I'v open in Ai, live traced, painted and saved as an .eps. This opens, but it's upside down, and all the paths are wrong.</p>
    <p>Any ideas?</p>
    <p>Justin</p>
