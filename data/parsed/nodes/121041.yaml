  html: |-
    <p>On occasion I'll purchase the desktop/webfont packages on Mighty Deals. A few months ago I picked up Norpeth.</p>
    <p><a href="http://www.myfonts.com/fonts/northernblock/norpeth/" title="http://www.myfonts.com/fonts/northernblock/norpeth/">http://www.myfonts.com/fonts/northernblock/norpeth/</a></p>
    <p>I noticed on the heavier weights the colon is merged to form one "dot". Also, commas are vertically compressed to almost appear as periods. I did contact Northern Block about this and they said they'd be happy to build a custom font (for a fee, of course).</p>
    <p>Question is: Has anyone ever seen glyphs designed this way? I like the font but I think I need to relegate this to my "don't use" folder.</p>
  html_clean: |-
    <p>On occasion I'll purchase the desktop/webfont packages on Mighty Deals. A few months ago I picked up Norpeth.</p>
    <p><a href="http://www.myfonts.com/fonts/northernblock/norpeth/" title="http://www.myfonts.com/fonts/northernblock/norpeth/">http://www.myfonts.com/fonts/northernblock/norpeth/</a></p>
    <p>I noticed on the heavier weights the colon is merged to form one "dot". Also, commas are vertically compressed to almost appear as periods. I did contact Northern Block about this and they said they'd be happy to build a custom font (for a fee, of course).</p>
    <p>Question is: Has anyone ever seen glyphs designed this way? I like the font but I think I need to relegate this to my "don't use" folder.</p>
