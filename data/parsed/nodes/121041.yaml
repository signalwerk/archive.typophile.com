    html: <p>The colon design is indeed awful. My understanding is that they designed the thinnest and the heaviest weights and then automatically interpolated the intermediate ones. Something evidently went wrong with the colon and the fact that they didn’t check and put it on sale anyway is frankly inexcusable.</p>
