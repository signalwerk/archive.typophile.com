    <p>Hi !</p>
    <p>I just finished a new script for <a href="http://www.Letterheadfonts.com" title="www.Letterheadfonts.com">www.Letterheadfonts.com</a>   It is called Chicago Script. It is a period style script with lots of alternate characters and some ligatures.</p>
    <p>Thanks for taking a look.</p>
    <p>Have a nice day,</p>
    <p>_Charles Borges de Oliveira</p>
