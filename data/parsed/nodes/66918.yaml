    date_raw: 3.Feb.2010 6.22am
    votes: null
    html: <p>hopefully no one will put you on blast about this post :) typographers are a sensitive lot. many of us spend an inordinate amount of time on a font only to be rewarded by someone casually using it for personal gain without any compensation offered. how would you feel if after all the time and effort you put in producing your yearbook, someone comes along and takes a copy, not knowing or not caring if it needs to be purchased? educate yourself about the use of fonts - unless it says free, you need to pay for it; if free and asking for a 'donation' give something. additionally, many fonts may be free except for commercial use - if you're charging for your yearbook (directly or indirectly), that's commercial. there are many free font websites, you have the burden of researching and finding the font that is right for your project. best of luck.</p>
