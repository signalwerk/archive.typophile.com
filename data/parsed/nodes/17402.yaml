    <div class="info">Submitted by <a href="/user/108" title="View user profile.">Miss Tiffany</a> : 19.Jan.2006 8.46am </div>
      <p>/ / / / / / / / / /</p>
    <p>Announcing the release of Apex New, which replaces Apex Sans. After the publication of Apex Serif, Thirstype's first OpenType font family, Chester returned to Apex Sans with a view to extending the glyphset and combining the Small Caps and numeral sets into OpenType fonts. As he worked, Chester started seeing the type's flaws, and set about fixing them. </p>
    <p>All weights of the type have been revised, and everything heavier than Book has been completely redrawn. The bold weights had previously "closed up", especially at smaller sizes; the heavy weights are now more open, with subtle contrast; the new version has been described as "elegant". The family has grown to seven weights, with over a thousand glyphs in each font. The font files are shipped solely as cross-platform CFF-flavoured OpenType, with loads of basic and advanced features.</p>
    <p><a href="http://www.vllg.com/Thirstype/ApexNew/mudTyper+Weights/" title="http://www.vllg.com/Thirstype/ApexNew/mudTyper+Weights/">http://www.vllg.com/Thirstype/ApexNew/mudTyper+Weights/</a></p>
    <p>Those who have purchased Apex Sans packages from vllg.com or Thirstype.com can purchase upgrades for a small price: US$25 for those who had purchased the full family, and US$49 for those who purchased the Roman+Italic package. (Have your original order # on hand; you'll need it to order an upgrade.)</p>
    <p>/ / / / / / / / / /</p>
    <p>Don't forget our special "Typographica Favorites 05" package: 5 Village exclusives chosen as amongst the best of 2005 by the editors of Typographica:<br>
    / Arrival by Keith Chi-hang Tam from Type Initiative<br>
    / Crank 8 by Greg Lindy &amp; Henk Elenga from Lux Typographics<br>
    / Flama by Mario Feliciano from Feliciano Type Foundry<br>
    / Garda by Mario Feliciano from Feliciano Type Foundry<br>
    / Litteratra by Karsten Luecke from KLTF</p>
    <p>The designers are offering this package of five notable type families for US$575.00, a savings of one-third off the combined price of US$865.00. (That's a savings of US$190.00.)</p>
    <p><a href="http://vllg.com/offers.php" title="http://vllg.com/offers.php">http://vllg.com/offers.php</a></p>
    <p>/ / / / / / / / / /</p>
    <p>With best regards,<br>
    chester</p>
    <p>Village<br>
    168 Second Avenue #253<br>
    New York NY 10003<br>
    USA</p>
