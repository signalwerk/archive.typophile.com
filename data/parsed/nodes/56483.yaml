  html: |-
    <p>If you had never formally studied the design of type (despite using it for 30+ years) and were looking for the best hands on workshop on the planet, where would you go? I've seen a few blog postings documenting these wonderful intensive weekend to weeks long type retreats. </p>
    <p>Is there a compendium of them somewhere?  Does Typophile have a "Worldwide Type Events" calendar hidden away somewhere?</p>
