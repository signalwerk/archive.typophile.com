    <div class="info">Submitted by <a href="/user/108" title="View user profile.">Miss Tiffany</a> : 2.Apr.2008 4.48pm </div>
      <p>From their site:<br>
    The new Arlt family has been just released. Inspired by the work of Argentinean writer Roberto Arlt, it is a contemporary, versatile and expressive family of types in 25 different styles for text, display and decorative use. Arlt has the advantages of OpenType technology such as style alternates, ligatures, and all sets of figures. Due to both its comfortable readability and the ’spicy’ atmosphere that it gains in text, Arlt is ideal for composing literature.</p>
