    <p>Hi</p>
    <p>I'm to be working soon on an optimization of fonts to be used in a phone book listing. I'd greatly appreciate any information that could help me regarding legibility at small sizes and a selection of potential fonts.</p>
    <p>We are using Bell Centennial right now, but might well decide to change.<br>
    Whitney, Martin Majoor's Janszen, ... suggestions will be most appreciated!</p>
