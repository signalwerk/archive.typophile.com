    html: <p>Another problem with what Luka was trying to do, at a technical level, is that he was trying to replace two glyphs with two glyphs. As I recall, OpenType does not directly support many-to-many substitutions. One has to use contextual substitutions to get an equivalent effect. <br> <br>(There are, btw, good reasons for this. Many-to-many substitutions tend to obscure the mapping from characters to glyphs, among other things.) <br> <br>Regards, <br> <br>T</p>
