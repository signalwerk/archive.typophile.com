    html: <p>Luka,  <br> <br>1. The functionality you're proposing does NOT belong into the OpenType layout features of a font. Each language has different conventions when inserting quotation marks. English uses quotedblleft and quotedblright, German uses quotedblbase and quotedblleft, Polish uses quotedblbase and quotedblright etc.  <br> <br>2. The "liga" feature is NOT for putting typographic quotation marks. It's intended for ligatures.  <br> <br>Regards,  <br>Adam Twardoch <br>Fontlab Ltd.</p>
    html_clean: <p>Luka,  <br> <br>1. The functionality you're proposing does NOT belong into the OpenType layout features of a font. Each language has different conventions when inserting quotation marks. English uses quotedblleft and quotedblright, German uses quotedblbase and quotedblleft, Polish uses quotedblbase and quotedblright etc.  <br> <br>2. The "liga" feature is NOT for putting typographic quotation marks. It's intended for ligatures.  <br> <br>Regards,  <br>Adam Twardoch <br>Fontlab Ltd.</p>
