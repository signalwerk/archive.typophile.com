    html: <p>Hi Adam, <br>thanks for inforamtion. <br>Thing is, Im doing all I can to avoid cumbersam and tedious manual changing in page design. <br>I got some material in text format with "straight" double quotes that needs replacing with curly quotes. One way to do it is inside page layout app like Indesign with search/replace command, but it will replace them with either quotedblleft or quotedblright glyph not both. So i'm trying somehow avoid that manual tweaking which is unavoidable in the end i guess. <br> <br>sorry for long post <br>cheers,</p>
