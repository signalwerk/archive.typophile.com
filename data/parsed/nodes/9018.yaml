  html: '<p>need some help with lig feature in OT(CFF). <br>here is the code: <br>loookup liga5 { <br>   sub quotedbl quotedbl by @_typquotes; <br>} liga5; <br> <br>it compiles with errors which Im aware of (prolly because of quotedbl x2). <br>Can someone than suggest how to replace two double quotes with two typographic quotes..quotedblleft and quotedblright when there is some text between them expl. " ffff " to “ ffffff ” . <br>huh..hope I made my self clear <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"></p>'
