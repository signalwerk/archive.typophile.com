      <p>Charles — I got that example from my mother, who is a copyeditor. I don’t recall the book (if I even ever knew the title).</p>
      <p>Nick — My biggest pet peeve about Truss’s book (that edition anyway) is that the text font, Quadraat, did not have kern pairs for comma/period and close quotes, in either order. These pairs appear a lot in the text, with distracting holes. “The Zero Kern Approach to Punctuation”!</p>
