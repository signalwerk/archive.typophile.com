    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Kerouac_5572.jpg"></div><br>
    I like this sign in Lowell, Massachusetts. It's hand-lettered in the old-school way, with a relaxed grace that speaks of years of discipline.<br>
    I like the story it tells, too. I didn't know people could defend their views on such arcane matters as punctuation with physical force. Now that I know, the first person who looks at this <em>handlettering</em> and asks me what <em>font</em> it is will get a knuckle sandwich.<p></p>
