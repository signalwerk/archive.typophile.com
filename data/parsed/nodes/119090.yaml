    html: <p>I might be able to go up in the attic and find some type specimen books from the 60s &amp; 70s from type houses I've worked at.  They would be the type used by in-house specifiers to mark up copy that ad agencies would submit for ad repro proofs. Most would include some handset, Ludlow, Linotype, and Monotype line samples. Is that what you had in mind?</p>
