    <p>In the 1960s I was marking up copy as a type specifier in an advertising typography house in LA when they closed shop. One of the items I was able to take with me was a 1923 ATF specimen book that I'm now offering for sale on ebay:</p>
    <p><a href="http://cgi.ebay.com/ws/eBayISAPI.dll?ViewItem&amp;item=271592263221&amp;ssPageName=ADME:L:LCA:US:1123" title="http://cgi.ebay.com/ws/eBayISAPI.dll?ViewItem&amp;item=271592263221&amp;ssPageName=ADME:L:LCA:US:1123">http://cgi.ebay.com/ws/eBayISAPI.dll?ViewItem&amp;item=271592263221&amp;ssPageNa...</a></p>
    <p>It has been well used and shows some signs of wear, but it is in excellent condition considering its age. </p>
    <p>This is an invaluable reference volume for any serious digital age designer.</p>
    <p>I've placed quite a few images of various pages of the book on my ebay listing, but if you have any questions, feel free to ask.</p>
    <p>Thanks,</p>
    <p>DC</p>
