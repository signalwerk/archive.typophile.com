  html: <p>This font appear on the cover of Harlan Ellison's paperback of "I Have No Mouth &amp; I Must Scream" (printed in 1983) and on the videogame based off of the book (released in 1995.)  I've tried Identifont but that site hasn't helped.  Any suggestions, font detectives?<img src="/sites/default/files/old-images/I Have No Mouth And I Must Scream ( text)_5907.jpg"></p>
