      <p>Regarding c and e: these are a problem, more so in the semi serif and sans faces.<br>
      It's too easy to mistake c for e.<br>
      A combination of similar counter shape, and the suggestion of a horizontal bar which is made by the flat bottom of the terminal, create a "notan" that is similar for the two letters.</p>
      <p>Now you may ask, why isn't this a problem in, say, Helvetica? The answer is that the counters of the two letters are quite different sizes in Helvetica. </p>
      <p>The design of the Rotis "c" defines a "broken" counter, with a semi-circular top part that is similar to the enclosed counter in "e", and an open bottom half; whereas in Helvetica, the counter of "c" is one big oval, quite distinct from the two semicircular counters in "e"</p>
      <p>Surely this is a design flaw in a text face?<br>
      And as this is a key characteristic of the face, isn't it fundamentally flawed?<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/ces_4385.png"></div><p></p>
