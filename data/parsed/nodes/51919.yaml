      <p>James, I don't find divergent shapes per se a problem: what bothers me about Rotis is that the shapes pull in all sorts of different directions and are out of proportion to each other. The problem with the Rotis <strong>c</strong> and <strong>e</strong>, in particular, is not that they are 'wrong' because the don't follow the shape of other bowled letters, but that they are massively wider and more open than any of the other letters, so much so that they appear out-of-scale, and have a pronounced visual thrust toward the upper-left while other letters have either a vertical or slight rightward lean.</p>
      <p>The <strong>c</strong> and <strong>e</strong> also draw attention to themselves because they are, in fact, the only interesting shapes in the design: if you look at the Rotis types without the  <strong>c</strong> and <strong>e</strong> present, you see that they are, in fact, rather dull and <em>very conservative</em> designs. Is introducing two eccentric but high-frequency shapes into an otherwise pedestrian typeface really a non-conformist or avant garde exercise, or is it a bit of typical graphic design sleight of hand, giving the appearance of greater novelty than is actually present? Compared to genuinely ground breaking work such as Evert Bloemsma's types, Rotis looks pretty thin in both conception and execution.</p>
