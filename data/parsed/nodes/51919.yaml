      <p>I agree with your general direction, but one has to always factor in real text in discussions of readability. How many word-pairs are there where one has a "c" and the other an "e" in a given spot? Almost zero. Compare that to the much greater "swappability" between "e" and "o", and one would start thinking that Helvetica's "e" is too close to its "o", and it would be better if it diverged towards the "c" instead (promoting at least some stylistic consistency).</p>
      <p>hhp</p>
