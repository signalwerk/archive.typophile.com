      <p>John, if that's a good question (and it probably is) it leads to the converse: why does such-and-such font have -what is considered- harmony in all its glyphs? Is it because the designer truly understood readability, or is it because the designer understood how to mimic fonts that people simply don't complain about? In virtually every single case, it's sadly the latter. In fact in most cases the designer doesn't even give a hoot about understanding readability; he is content to celebrate and imitate. It makes him feel warm, and helps pay the bills. At least Aicher was not a performing monkey, a cultural hanger-on.</p>
      <p>hhp</p>
