      <p>I think John's observations are limited by what he sees as the only functional and artistic process to design an alphabet. Evert Bloemsma and Otl Aicher (besides living in entirely different places and times) worked with letters in different means. It's clear Bloemsma strived to refresh and perfection arrangements of forms, while Otl was working on a visual level with cultural and ideologic elements. Since the latter are not planned in John's approach (but they are present, since they are unavoidable), he sees Rotis only on a functional/formal level, while the life of a typeface can by no means be measured by that alone.<br>
      I don't know what Bloemsma could have designed, if he witnessed nazism (Aicher was 17 when he got involved in the White Rose movement) and lived in Germany during World War Two.</p>
      <p>Nick's observations about the [c] and [e] are important, but I never noticed them, since I was always fascinated by Rotis as a whole. It shows it sometimes doesn't work so well, but I don't have to set books with it, maybe catalogues or some magazine.</p>
