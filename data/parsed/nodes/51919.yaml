      <p>@Norbert: <em>If he had collaborated more with Adrian Frutiger there may have been a more successful attempt with Rotis.</em></p>
      <p>As if Rotis is not already successful as it is? Maybe you mean Rotis would have been more conventional, conformist and to your liking, more like other type designs? Maybe you mean something else. Don't let me put words into your mouth.</p>
      <p>@John: <em>Most seriously, perhaps, one can ask ’Why doesn’t this type design really work?’ Of course, this is a question one can ask of many typefaces, but few so prominent as Rotis. It provides a good case study in the problems of producing letter shapes that are, individually, interesting, but which don’t work together as a typeface.</em></p>
      <p>I think Rotis "works" just fine. Its disparate forms work together as a typeface if you let go of some of your preconceptions about what makes a "good" type design.</p>
      <p>==============================================</p>
      <p>The widespread assumption that disparate letterforms are a bad thing or somehow undesirable in a type design may be due to the general flaw in Western thinking which tends to regard non-conformity and inconsistency, no matter how small, as inherently "bad" and undesirable.</p>
      <p>Rotis' <strong>c</strong> and <strong>e</strong> are depart structurally from the face's <strong>o</strong>. Ho boye, what a liberty! How terrible, they say, those Rotis haters. I don't know much about Rotis' creation or history, or the man who designed it, but I think the differentiated <strong>c</strong> and <strong>e</strong> are the main features of Rotis that cause its detractors to dislike it so readily.</p>
      <p>You see the problem? Rotis and its <strong>c</strong> and <strong>e</strong> are not the problem. One-eye black &amp; white Western thinking is the problem. It's a typeface, not a flipping army you know. Don't take it personally, it's aimed at everybody who thinks Rotis doesn't work.</p>
      <p>There is nothing fundamentally wrong with the Rotis design. Its differentiated <strong>c</strong> and <strong>e</strong>, once assimilated by the human mind, should result in enhanced readability. Nothing could make more sense to a guy like me who thrives on non-conformity.</p>
      <p>@Hrant: <em>. . . his dedication to improving readability while tossing out stagnant conventions is quite apparent, and to me highly commendable. The same cannot be said of the great majority of type designers, who are either too busy being artistes or too afraid to think.</em></p>
      <p>Precisely. Convention is good for the sake of standards and having a mainstream, for better or worse. At the same time convention, or more accurately—conformity—is the enemy of typeface design.</p>
      <p>In other words, Jenson and Griffo's roman type designs are very pretty because they follow the renaissance ideal of harmony in art &amp; design. But how much grasp did those two men possess of readability theory? I think we can safely assume both Jenson and Griffo had a solid grasp of the need for a typeface to be readable since they were inventing Western Latin neo-classical type design &amp; typography at a time when the so-named gothic style, complete with all its strengths and foibles, remained very strong, and neo-classicisim was relatively new.</p>
      <p>Stylistic uniformity (artiste-ry) is one thing, and structural sophistication is something else. </p>
      <p>We can ask the question then: is "visual unity" or a "unified visual whole" the be-all and end-all of typeface design, or should this kind of stylistic preoccupation be demoted, and should it be informed by the structural principles that make blackletter forms diverse?</p>
      <p>Can Western type designers ever relinquish their preoccupation with stylistic unity? Fear of thinking holds us back.</p>
      <p>I am not afraid to think. I am not afraid to die either. My only fear is coming to the end of the second life before my work is complete. </p>
      <p>If it doesn't kill you, it's good for you.</p>
      <p>j a m e s</p>
