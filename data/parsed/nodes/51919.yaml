      <p>I wasn't comparing, I was contrasting: Bloemsma's work is serious, thorough and challenging; Rotis is half-baked, lazy and superficial. Was I compelled to make such a contrast? More importantly, was I compelled <em>by Rotis?</em> -- no, I was responding to James' comments, which I thought gave Rotis far more credit than it is due. Seriously, take out those two dramatic lowercase letters that don't fit with the others, and what is left? Some very arbitrarily proportioned but conservative shapes. Rotis is a bit like listening to a very tentative musical composition in which a couple of 'daring' dischordant harmonies are thrown in to make it seem avant garde.</p>
      <p>I doubt if I have anything more to add to this thread, and I don't enjoy criticising typefaces, especially when the designer isn't alive to respond.</p>
