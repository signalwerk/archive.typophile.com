      <p>I could never understand all this criticism towards Rotis. Though it's not my favorite typeface ever, there is not much I dislike in it. The unusual e and c give a nice twist of personality to a somewhat conservative design, thus making it very useful for specific works where seriousness and readability must go together well with uniqueness (bank identity, corporate communication). The sans serif - serif variations are among the best I've seen (and also among the very first ones). And saying that it's easy to read e instead of c is irrelevant - you really must have a serious problem to make this kind of mistake when reading a text.</p>
      <p>I'm glad I dedicated a chapter of my book to Rotis. It deserves it.</p>
      <p>dr</p>
