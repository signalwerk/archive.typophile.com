      <p><em>Since the latter are not planned in John’s approach (but they are present, since they are unavoidable), he sees Rotis only on a functional/formal level, while the life of a typeface can by no means be measured by that alone.</em></p>
      <p>The life of a typeface, no, but then lots of not very good typefaces have been very popular indeed, including typefaces that functionally are very much worse than Rotis. The life of a typeface -- how it is used, the place it comes to have in design or cultural history -- is often a reflection of 'cultural and ideologic elements' that are external to the design. The life of Helvetica is an obvious example.</p>
      <p>The historical context of a thing is often interesting, and can sometimes suggest criteria for judging that thing which might not otherwise have been considered. But when the thing in question is a typeface there are prerequisite criteria.</p>
