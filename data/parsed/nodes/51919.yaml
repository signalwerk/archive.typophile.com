      <p>The reprint is of surprisingly substandard quality. The pages are reproduced, not reset. Some of the type was blurry in some of the copies I saw. I recommend trying to track down a used copy of the first edition, if you can.</p>
      <p>There are a number of things I do not understand about the book, but the chief among them is this: Aicher was not a fan of uppercase letters, as he deemed them to authoritarian. The book's text is in German and English; the columns sit side by side on the page. The German text does not use any capital letters—quite a statement in German, where capitals play an important role. However, the English translations DOES uses upper and lowercase letters. This I cannot understand. Are English-speaking people not as equally oppressed by the (albeit less frequent) use of capital letters? Did he just overlook this aspect of the book's production? I do not know.</p>
