      <p>Aicher's book <a tagert="new" rel="nofollow">Typographie</a> is very good, but it's less about designing typefaces than his philosophical dialogues about communication and the influence of contemporary culture and environment on our ability to comprehend visual language. I haven't seen the reprints so I can't compare it to the original edition printed by <a href="http://www.wiedler.ch/felix/books/story/106" target="new" rel="nofollow">Druckhaus Maack</a> in Germany.</p>
      <p><a href="/wiki/Otl%20Aicher" class="freelinking" rel="nofollow">Otl Aicher</a> was by no means a type designer and was best known for his graphic design, corporate brands and informational systems. As Hrant stated, Rotis was more about Aicher's intent. If he had collaborated more with Adrian Frutiger there may have been a more successful attempt with Rotis.</p>
      <p>Personally I truly enjoyed my  time working with Herr Aicher in bringing Rotis to the marketplace, though we had to heavily rework his font data to meet Agfa's quality standards. Yes, Rotis is not among my favorite typefaces, but neither will I bash it.</p>
    html_clean: |-
