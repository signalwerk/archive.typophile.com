      <p>What criteria do you use for “reputable”?</p>
      <p>Do you intend to eventually monetize this service by charging a fee for inclusion in your database of annotated fonts?</p>
      <p>If so, what is your legal arrangement with your college?</p>
      <p>I think that if you are going to publish this educational project online, you should include the full slate of web site links to “info” the site, e.g. your qualiﬁcations and typeface-analysis criteria, so that users have some idea of the credibility of your claimed-as-reputable suggestions, which to me is the real issue here, other than building a functioning site that performs the task of designing a UX that matches clicks with a database.</p>
