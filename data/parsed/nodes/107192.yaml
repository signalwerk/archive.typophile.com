    <p>Hey all.<br>
    Type Finder, a project I've been working on for quite some time as part of my senior thesis, launched today. The website asks viewers a series of questions, and based on the answers, displays a list of typefaces that match the requirements/feel/use. </p>
    <p>I thought I'd reach out to other people interested interested in typography through this forum to promote the project (hopefully it is helpful to people looking for some new typefaces) and get some feedback and suggestions from anyone willing to share their thoughts!</p>
    <p>Cheers!<br>
    Gabe Ferreira/Elijah Zapien</p>
    <p></p><div class="imageWrap"><img src="https://web.archive.org/web/20150421203855im_/http://typophile.com/files/type-finder_5510.jpg"></div><p></p>
