      <p>Hey Nick.<br>
      We don't intend to monetize the service. The idea is to make it available as a resource for anyone who needs a database of reliable typefaces to choose from for whatever project they are working on. There are several online articles describing what makes fonts good and set a criteria for "reputable", (a recent and rather lengthy one is this article from Jessica Hische's blog, for example: <a href="https://web.archive.org/web/20150421203855/http://jessicahische.is/talkingtype" title="http://jessicahische.is/talkingtype">http://jessicahische.is/talkingtype</a>) but we couldn't find a website that puts those guidelines to use by basically doing the "filtering" for whoever needs to browse some typefaces. People could use the built-in filtering technology from Adobe, Linotype, MyFonts, etc., but that can be very misleading as they offer several thousand fonts as opposed to the 140 on our website.</p>
      <p>I do like your idea of adding a section that describes our analysis criteria in case someone is wondering why a specific typeface made it to the list (thanks for the suggestion). Did you have any comments regarding the current selection of fonts?</p>
