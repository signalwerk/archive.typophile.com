      <p>I like the sprightly question format!  </p>
      <p>You can only ask so many questions if you want to keep it brisk.  But, would you consider an additional question that checks for special needs?  For example, is there a need for high legibility due to an audience of older readers (who might not have glasses handy), or very young readers?  Is there a language need?  The resulting recommended fonts seem to be mainstream with comprehensive glyph sets to satisfy many languages, but it could be a consideration.  </p>
      <p>Good luck with your project.</p>
