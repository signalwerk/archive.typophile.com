    html: |-
      <p>Gentium covers a huge range of Latin-based alphabets and also covers basic Cyrillic and Greek. But it doesn't include Chinese characters. You must have seen it used in combination with another font that supports Chinese.</p>
      <p>Code2000, on the other hand, covers just about every writing system you can think of; take a look at the list at <a href="http://en.wikipedia.org/wiki/Code2000" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://en.wikipedia.org/wiki/Code2000</a>. There are not many other fonts with even comparable coverage of the world's writing systems.</p>
      <p>A quick search reveals Code2000 includes 53,068 characters (63,546 glyphs) in version 1.171. <a href="http://titus.fkidg1.uni-frankfurt.de/indexe.htm" title="Click to visit an external URL." class="freelink freelink-external freelink-external">TITUS Cyberbit Unicode</a> by comparison has 36,161 characters in version 4.0, and Gentium has around 1,500 glyphs.</p>
    html_clean: |-
