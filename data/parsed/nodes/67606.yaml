    html: |-
      <p>So this font usage *is* justified after all? One Font To Rule Them All?</p>
      <p>Perhaps it is -- no time slash money to check per case what font combos best suit plain text plus a smattering of other scripts. I always take my time to scan my library for the best font that <em>also</em> covers all characters I need -- it can take some time, finding, say, a Chinese font, with that particular requirement.</p>
      <p>Given the sheer number of characters, I suspect class kerning is out of the picture :-) And the odd "J" must have been to save <em>one single</em> position in the glyph list, dubbing for the Cherokee eclectic "TJ".</p>
      <p>Does Code2000 come with a real beta, or is that fused with the German double es?</p>
