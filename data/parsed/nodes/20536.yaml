      <p>Hallo Seb,</p>
      <p>Do you know the recommendation from one type and media student?</p>
      <p>"Even I already lived at several places, also abroad, I am having the most trouble with housing here in The Hague. That's why I place a few notes, helping people not making the same mistakes.</p>
      <p>First of all, look for a place to stay very early in advance! This means also to subscribe to lists (student housing or housing pools), because the longer you are on the list and the further you live away the better the chances to get a room. Following a few addresses:</p>
      <p><a href="http://www.duwo.nl" title="http://www.duwo.nl">http://www.duwo.nl</a> - duwo is a student housing organisation with furnished or unfurnished appartments, rooms, studios</p>
      <p><a href="http://www.kamernet.nl" title="http://www.kamernet.nl">http://www.kamernet.nl</a> - kamernet is a housing platform where you have to subscribe to react to ads, it is worth doing it</p>
      <p><a href="http://www.stroom.nl" title="http://www.stroom.nl">http://www.stroom.nl</a> - stroom is an art organisation handling the anti-squat housing in the hague</p>
      <p><a href="http://www.huisbel.nl" title="http://www.huisbel.nl">http://www.huisbel.nl</a> - online mailing list for housing</p>
      <p>Housing agencies are also an option, they usually charge one month rent as commission fee. There is one around the Academy which you definetly should avoid. It is PR Housing who are fooling clients. One month security fee is common. Don't pay any rent upfront!</p>
      <p>If you bring your car with you, in most streets you have to pay (sometimes till 24:00) and the fine is 45 Euros. You can get a parking license for 6 month for 48 Euros. Be aware of temporary no parking zones, the city will imediatly tow away your car (298 Euros). Keep the car empty and the glove box open."</p>
      <p>I guess we'll see us in September<br>
      Slade</p>
