      <p>Sebsan, congrats!</p>
      <p>Slade has made some good suggestions. When I was in The Hague I lived in a <a href="http://www.duwo.nl" rel="nofollow">DuWo</a> building which was fun experience because I was living with 16 people from 10 countries, but it was a little bit too dormitory-ish and a little more than I wish I was paying for the size of the room. If I did it over again I would have tried to find a place through <a href="http://www.stroom.nl" rel="nofollow">Stroom</a> or with another anti-squat organization. The city of The Hague has a website that gives students information on finding anti-kraakt housing but I can't find it right now, but that would be something to look for.</p>
