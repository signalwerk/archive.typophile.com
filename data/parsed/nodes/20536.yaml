      <p><a href="http://www.kabk.nl/international_students/student_housing/-/en" title="http://www.kabk.nl/international_students/student_housing/-/en">http://www.kabk.nl/international_students/student_housing/-/en</a></p>
      <p>This should be of use.</p>
      <p>Also consider other cities for housing. The Hague isn't much of a university city, so temporary, affordable housing isn't big there. Consider Rotterdam, Delft, Utrecht and Amsterdam as alternatives at travel distance. More exciting cities as well.</p>
      <p>Housing in the Netherlands can be a bit of a nightmare, so best of luck.</p>
      <p>*EDIT* Just read about the anti-squat housing. This is a great option if you're on a budget and not as illegal/dodgy as it may sound. You can get very comfortable and very temporary living space for a very low price. You'll have to put up with an alternative crowd, but they're not as wild as the word squat might suggest.</p>
