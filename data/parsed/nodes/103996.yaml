    html: |-
      <p>To use a font to create something, you need a license for it. If you purchase an operating system, that will include the licenses for the fonts that come with it.</p>
      <p>So you are good there.</p>
      <p>Some fonts require that you pay for an additional and/or different license if you plan on using the font embedded within a PDF. Someone else will have to verify, but I believe there is no PDF embedding restrictions on any system fonts that I know of. </p>
      <p>So I think you are good there too.</p>
      <p>For the web, if you plan on using a system font, then you can (hopefully) assume most of your web site visitors will have that same font on their own system, so you're good there. If it's not a common system font, however, you may need to get a separate/additional license to use it as a web font.</p>
