      <p>Here is a link that works for Adobe Web fonts, <a href="http://www.adobe.com/products/webfont.html" title="http://www.adobe.com/products/webfont.html">http://www.adobe.com/products/webfont.html</a>, and to typekit.com <a href="https://typekit.com" rel="nofollow">https://typekit.com</a>.</p>
      <p>Those web fonts virtually contain all the opentype tables (GPOS, GSUB) for the browser to properly position the characters, for example the diacritics used in linguistics web pages (they appear on top or at the bottom of letters; see for instance <a href="http://en.wikipedia.org/wiki/Ipa#Consonants" title="http://en.wikipedia.org/wiki/Ipa#Consonants">http://en.wikipedia.org/wiki/Ipa#Consonants</a> with a good browser on a recent system). On the other hand, a pdf contains none of those tables. It is the application (inDesign etc) that positions the characters (be they in text or equations) using the tables in the font.</p>
