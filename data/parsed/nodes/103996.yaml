      <p>1. Minion and Myriad are not system fonts on any system that I know of.<br>
      2. Minion Pro and Myriad Pro are fonts of the Adobe Type Library and according Adobe's statement on <a href="http://www.adobe.com/products/type/font-licensing/font-embedding-permissions.html" rel="nofollow">font embedding permissions</a>, they may be embedded in PDF files.</p>
