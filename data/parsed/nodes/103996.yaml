    html: <p>Minion and Myriad are application fonts installed at the system level (/Library/Fonts on Macs and C:\Windows\Fonts on Windows) with Adobe software such as InDesign. If you want to use them in web content you can license optimised web font versions through <a href="/wiki/https%3A/%252Ftypekit.com/" class="freelinking" rel="nofollow">Adobe's Typekit service</a>.</p>
