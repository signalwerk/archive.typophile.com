      <p>From Adobe, I understand that there are no PDF embedding restrictions on their bundled fonts (<a href="http://forums.adobe.com/thread/843478" title="http://forums.adobe.com/thread/843478">http://forums.adobe.com/thread/843478</a>). My clients want to use system fonts for their work documents, and they use PCs rather than macs, so I'm thinking of going with a few of the stand-bys that can be found in both systems; Lucida, Palatino, Tahoma, etc. </p>
      <p>I'm talking about using these as their "company" typefaces for PPTs, ebooks, workbooks, press releases, business cards, etc. Basically, the fonts one would find in their company style guide (which I'm going to create). </p>
      <p>In that way, I assume we can work on our respective machines using fonts that we all have, and only purchase additional licenses if we want to use the fonts in a website, or other application not covered in the MS/Apple licenses for these system fonts. Hope I'm understanding all this right. Typography is a deep dive.</p>
