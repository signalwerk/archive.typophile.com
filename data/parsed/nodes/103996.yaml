    <p>I have been searching around and trying to confirm a few things that I *think* I know but it's all somewhat confusing to me:</p>
    <p>- My client wants to publish an ebook, which will actually just be a PDF displayed online (rather than a Kindle ebook, etc.). It would likely be downloaded by others, though, for a fee. They would get access to the PDF both online and offline (if they purchase it). We haven't chosen a font, but will probably go with a standard system font (minion, myriad, etc.). Assuming i do go with a system font, are we covered legally to use the typeface in this way?</p>
    <p>- Am I correct in telling the client that if we use a system font (say, minion), and they have it on their computer as well, they may also use it for their further commercial purposes without worrying about getting a license? I understand that a license would come into play only if they did NOT have the font on their computer.</p>
    <p>- What about for web use? if we wanted to use a standard font like minion for their website, would we need a separate license? I'm not a web designer -- I focus on static graphics -- but if they hire a web designer later, I want to make sure they can still follow their style guide, which by that point will be suggesting specific fonts to use.</p>
