    html: '<p>Adobe is indeed quite clear. As for the fonts that come with Microsoft Office 2011 for the Mac (and that are installed in <code>/Library/Fonts/Microsoft</code>) the license (in the Microsoft Office folder) says: "You may only embed fonts in content as permitted by the embedding restrictions in the fonts". I checked and their embedding is at least "Editable" (i.e. <code>fsType = 0x0008</code>, cf <a href="http://www.microsoft.com/typography/otspec/os2.htm#fst" title="http://www.microsoft.com/typography/otspec/os2.htm#fst">http://www.microsoft.com/typography/otspec/os2.htm#fst</a>) when not installable (<code>fsType=0x0000</code>). There is one exception, Engravers MT, that has bits 1, 2 and 3 of <code>fsType</code> all set, which falls outside their specs.</p>'
