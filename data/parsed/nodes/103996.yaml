    html: <p>A more interesting example is the corresponding page in Hindi <a href="http://hi.wikipedia.org/wiki/अन्तर्राष्ट्रीय_ध्वन्यात्मक_वर्णमाला" rel="nofollow">http://hi.wikipedia.org/wiki/अन्तर्राष्ट्रीय_ध्वन्यात्मक_वर्णमाला</a> where the font used to display the text in Hindi is LohitDevanagari, a web font (and properly displaying indic text requires the unicode tables). However, the phonetic tables in the text use no web font, they rely on fonts installed on the viewer's system (I get them in Arial). In fact, I don't know if there is any web font that can properly handle linguistics.</p>
