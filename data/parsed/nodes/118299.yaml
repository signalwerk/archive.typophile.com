      <p>Tapered strokes like this were found in some 1920s lettering designs. The most famous is the poster lettering for Fritz Lang's Metropolis </p><div class="imageWrap"><img src="http://typophile.com/files/MetropolisLang_5327.jpg"></div> I have not found any matches for your lettering. I was able to find a serif font with tapered strokes, but it has a whimsical and informal flavor rather than the formal thick and thin structure of _ACAPULCO_. Here is  Phil Bracco's Spidertoes <div class="imageWrap"><img src="http://typophile.com/files/SpidertoesPhilBracco_4103.jpg"></div> <a href="http://www.myfonts.com/fonts/pink-broccoli/spidertoes-pb/" title="http://www.myfonts.com/fonts/pink-broccoli/spidertoes-pb/">http://www.myfonts.com/fonts/pink-broccoli/spidertoes-pb/</a><br>
      Don<p></p>
