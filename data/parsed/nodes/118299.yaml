    html: |-
      <p>Are you saying it's known that the sample dates from the 20's or 30's ... or just that it looks that way to you?</p>
      <p>The closest that comes to mind is Florentine Bold (predigitally). Today's digital, commercial version of <a href="http://old.myfonts.com/fonts/urw/florentine/" target="_blank" rel="nofollow">Florentine</a> does not include the bold. Opti offered the bold, but they are long out of business - and were of shady reputation anyway.</p>
      <p>Oddly enough, the Solotype Catalog's brief showing of Florentine Bold (probably phototype) includes an 'A' much like yours - something I've not seen in any other showing of the typeface.</p>
