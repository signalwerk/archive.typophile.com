    <p>Hi,</p>
    <p>i'm hoping to get some suggestions from you. </p>
    <p>Contemporary Dingbats –<br>
    especially loaded with nice signs (as an addition, different weights would be handy) of abstracted mobile phones, phones, email, monitors, websites, small computer devices and all those regular stuff we are surrounded by.<br>
    Maybe this helps you (or me, hehe); think of the style genre of Klavika, FF Max, Etelka, Neo Sans/-Tech …</p>
    <p>Pure vector "art" suggestions (not typefaces) are welcome too.</p>
    <p>Thanks a lot, t.</p>
