    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Designers" class="freelinking" rel="nofollow">Designers</a> : Ted Staunton</strong></p>
    <p>Ted Staunton was born in 1942 in Lincoln, England. He served an apprenticeship in the <a href="/wiki/letterpress%20printing" class="freelinking" rel="nofollow">letterpress printing</a> industry before training as a typographic designer at Leicester College of Art. His first complete <a href="/wiki/alphabets" class="freelinking" rel="nofollow">alphabets</a> were designed at this time, the mid-'60s. In 1970 he emigrated to Canada, and lives in a suburb of Vancouver, on British Columbia's superbly scenic west coast, with his wife and family .</p>
    <p>website: <a href="http://www.sherwoodtype.com" title="www.sherwoodtype.com">www.sherwoodtype.com</a></p>
