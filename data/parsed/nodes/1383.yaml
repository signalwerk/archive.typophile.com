    html: "<p>Botvide -- Can I ask you to post this sample in a different way? Can you enlarge the separate letters (x2), shrink the sample setting (x2) and change the color to black? Just to \"see\" things a little more in the black and white. Oh and save it as a .GIF not .JPG  <br> <br><img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\"> <br> <br>I really like the angularity of the italic. <br> <br>Quick thoughts: <br>• The w looks pinched from both sides on the bottom. <br>• The i seems taller than the normal x-height. <br>• The g seems to be falling backward. <br>• The v seems to be leaning forward. <br>• Perhaps the G could become more Elzevirian. <br>• The k seems a bit tall, the x-height portion of it.  <br> <br>And, I agree with Hrant's remarks. Accept, of course, the classic remark. I'm all about the classic.</p>"
