  - id: 11137
    user: 2340
    date: 2003-09-23T14:40:00
    date_raw: 23 Sep 2003 — 2:40pm
    votes: null
    html: <p>Yes, <br> <br>you're right that I have done some overlapping, but only at certain, for me, especially tricky parts, and only to get "forward", so I can move ahead, see what works, what does not, get the feel of at least some kind of holistic perspective. This is only a first rough draft, nothing more, just as I pointed out in the beginning. At this stage I am more interested in what creates a flow, not the individual letters (which, naturally, is the key anyway - but these I can work on from scratch as soon as I know my direction). It is not as if it is the last check before it goes to the type store. I am not interested in copying someone's work, rest assure.  <br> <br>And Hrant, you're also right right about the irregularities. But some seem to disturb, others looks tempting to the eye. I just can't see any system in it. But you have to start somewhere, I guess. <br> <br>Best  <br>H</p>
