    html: <p>Hi again! <br> <br>Thanks a lot for your comments. I think I agree with all of them. My problem is that I'm getting stuck. Everything has gone quite smoothly until now, but now suddenly everything I do seem to make things worse. And not being a type professional I think I need to stop and take a deep breath. And sleep. Goddammit, I haven't slept for two days because of this! Is this how you type maniacs lead your life? The last thing you think of before you fall asleep is a possible curve of a lc "c"? <br> <br>Anyhow, here is a pdf, which perhaps makes it easier to look at the font. Please, feel free to send comments - I'm listening. I just need to take a nap first! <br> <br>Best, <br> <br>H</p>
