    html: '<p>Personally I find it a little bit too "classic" for my own tastes, but it certainly looks well-made, at least from that sample.  Anyway, if you could provide better sample it would be easier to spot problems. From that sample the only things I myself would suggest are: <br>- The "A" is too tall. <br>- The "G" needs work. <br>- The "Q" needs a much braver tail. <br>- The spacing is nice and tight. <br>- The italics is great [for this genre of face]. <br> <br>BTW, it reminds me a little bit of Vendetta, and Scala Serif too. <br> <br>hhp <br></p>'
    html_clean: '<p>Personally I find it a little bit too "classic" for my own tastes, but it certainly looks well-made, at least from that sample.  Anyway, if you could provide better sample it would be easier to spot problems. From that sample the only things I myself would suggest are: <br>- The "A" is too tall. <br>- The "G" needs work. <br>- The "Q" needs a much braver tail. <br>- The spacing is nice and tight. <br>- The italics is great [for this genre of face]. <br> <br>BTW, it reminds me a little bit of Vendetta, and Scala Serif too. <br> <br>hhp <br></p>'
