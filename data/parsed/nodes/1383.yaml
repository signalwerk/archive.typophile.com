    html: <p>It looks like you're using overlapping letterform parts to make the letters... That makes it hard to appreciate what it will <i>eventually</i> look like. I assume at least some of the irregularity is intentional though, and that I feel is a good thing in this case. <br> <br>hhp <br></p>
