  html: |-
    <p>I'm new to typography(although technically I've taken two classes on it). Very sorry for any sort of mix ups. I've been working on a magazine layout and given the ability to design for a section has sparked my interest in experimental typography. I've seen so much of these very interesting uses of type. </p>
    <p>Recently because of research of trying to achieve a specific look for the title of the article I noticed these very interesting mixing of different fonts stacking them in all sorts of ways, sometimes stacking type both horizontally and vertically. I've seen many examples of this. How would I actually achieve this sort of effect? I've been experimenting and wondering if all of these variations are done in one text box inside a design program or is it a design that is manually placed together with several text boxes?Maybe different positioning methods? I don't know if it would be rude to include pictures of examples as it's not my own work. Hopefully I'm not confusing you guys. Thanks a lot for hearing me out!</p>
