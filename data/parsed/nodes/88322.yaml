    html: <p>Well, it’s not a bad idea if the layout will actually benefit. There’s also no “proper” way of doing this. It all depends on tools at hand and how well you can use or hack them. Some of the tools will give you great amount of flexibility in setting type in one frame, others don’t. The rest is up to you, really.</p>
