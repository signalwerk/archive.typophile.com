    html: <p>Is it a bad idea then? How would I go about designing it? Justifying the text? Is it done in one text box or several? Also I see some people that use several different fonts. Is that also done in the same way? Mixing serif and sans-serif type. I saw this one that had the type stacked in different ways horizontally, vertically with brackets hanging outside. By the way thanks for the link.</p>
