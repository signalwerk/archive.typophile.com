      <p>Hi Nick,</p>
      <p>When we originally set out about naming the font, we looked and couldn't find anything. We must of missed it!</p>
      <p>The name actually refers to 'Earl Fortescue' <a href="http://en.wikipedia.org/wiki/Earl_Fortescue" title="http://en.wikipedia.org/wiki/Earl_Fortescue">http://en.wikipedia.org/wiki/Earl_Fortescue</a><br>
      This is due to the typeface originally being created for an artist who resided at Fortescue House (The House in Devon in which Earl Fortescue lived).</p>
      <p>Again, as hrant says, they look completely different, it just happens to be a coincidence about the names sounding similar.</p>
      <p>- Colophon</p>
