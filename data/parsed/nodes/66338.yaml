    <p>Hi,</p>
    <p>Just a quick heads up to let you all know that we (Colophon Foundry), have just released Fortescue &amp; Fortescue Pro. A new serif typeface with stylistic pointy serifs.</p>
    <p>The Pro set comes complete with extended characters for use in Eastern &amp; Central European languages. Full OpenType features include contextual ligatures, discretional ligatures, superior &amp; inferior numbers, fractions, oldstyle proportional figures, proportional and tabular lining figures and a full set of small caps. Please note that the pro set features are in addition to the standard weights.</p>
    <p>Visit: <a href="http://www.colophon-foundry.org" rel="nofollow">www.colophon-foundry.org</a> for more information.</p>
    <p>Let us know what you think.</p>
    <p>Warmest,</p>
    <p>Colophon Foundry</p>
