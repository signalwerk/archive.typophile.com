    <p>Hello everybody!<br>
    I'm having a huge problem in Fontforge. I'm an absolute beginner at typography so please have mercy.</p>
    <p>What I tried to do was creating a type from hand-drawn letters. I used Illustrator to create a 'svg' file and transported the letters to Fontforge. I created every capital letters, every small letter, a period, question mark and some other extrema.</p>
    <p>I did the kerning manually without autokerning (I'm not used to this kind of thing so I won't be able to explain it in full detail).<br>
    When I was finished I generated a truetype font. Sadly there is little to no kerning visible and I'm doubting the kerning applies at all. I need this font for a project so it's really urgent.</p>
    <p>I'm using WIndows XP nd apparently Fontforge version 1 if this is of any help.</p>
    <p>I'm literally begging on my knees here. I don't know what to do. I probably just forgot to do a little thing, but I'm not sure.<br>
    If you have ANY Idea how to help I'll be happy.</p>
