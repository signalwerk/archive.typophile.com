      <p><cite>there some convention about making numbers after the decimal smaller</cite></p>
      <p>Well, yes. As road signs go, it makes sense that from a distance or with limited visibility (fog, rain, etc.) the driver can quickly distinguish between, say, 4.5 km and 45 km.</p>
