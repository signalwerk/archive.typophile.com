    <p></p><div class="imageWrap"><img src="http://typophile.com/files/08_03_11_019_1_5770.jpg"></div><p></p>
    <p><a href="http://signobserver.wordpress.com/2008/04/05/on-the-edge-of-scarborough" rel="nofollow">Observed on Friday</a> While trying to avoid a traffic jam.</p>
    <p>(any idea why the .1 is smaller than the 4? is or was there some convention about making numbers after the decimal smaller?</p>
    <p>they used templates to copy and lay out the letters on signs like this that were made one or two at a time before computer driven plotters came along. My theory is that the sign painter could find or didn't bother to look for the correct size of 1. maybe off the wall... but... oh, who cares :-)</p>
