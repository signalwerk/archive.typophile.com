    html: <p>FWIW, URW's Helvetica clone <a href="http://www.myfonts.com/fonts/urw/nimbus-sans/">Nimbus Sans</a> is freely available as part of their <a href="http://linux.about.com/cs/linux101/g/urwfonts.htm">GPL font collection</a> distributed with <a href="http://artifex.com/downloads/">Ghostscript</a>. But, as Yves mentioned with the standard Mac fonts, the free set does not include light or extended weights.</p>
    html_clean: <p>FWIW, URW's Helvetica clone <a href="http://www.myfonts.com/fonts/urw/nimbus-sans/" class="link-external">Nimbus Sans</a> is freely available as part of their <a href="http://linux.about.com/cs/linux101/g/urwfonts.htm" class="link-external">GPL font collection</a> distributed with <a href="http://artifex.com/downloads/" class="link-external">Ghostscript</a>. But, as Yves mentioned with the standard Mac fonts, the free set does not include light or extended weights.</p>
