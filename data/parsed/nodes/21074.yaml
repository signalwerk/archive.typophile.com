      <p>Actually, no...</p>
      <p>I studied Illustration in school, and am one of *those people* who don't know enough about the history of type–I only had 2 semesters of Typography at Pratt, during which we did more hand lettering than learning about the history of it all (a shame, but that was covered in a different class, which was assigned to the Design majors). I hope to learn more from you guys, so that I will be able to make more educated choices (instead of just "ooh..that looks nice!").</p>
      <p>In the meantime, I hope you won't get annoyed by my newb-ness.</p>
