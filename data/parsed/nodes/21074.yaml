      <p>Great idea...I'll ask my printer (hopefully he'll have it, since I'm sort of locked in to using specific vendors for this job...calling in some favours ;-) </p>
      <p>I'm indeed going balls-out on the printing of this stuff. </p>
      <p>BC's will be:<br>
      Printing &amp; letterpress 2/2, PMS 396&amp;271 on dual-mounted (triplex a possibility) 180# Winstead, colored edges using PMS 396.</p>
