      <p>Aye! Now we're talking about an entirely different creature!</p>
      <p>If it's indeed your intention to go all out on the printing side, why not locate a press that still possess Centaur matrices and have them print it?  I know that a small place in Portland set their letterpress stuff on Bembo, among many others; so, really, the possibility of finding such printer is not that hard.</p>
      <p>Ooh, I can't even imagine to think how beautiful would Centaur's italic look on letterpress!</p>
