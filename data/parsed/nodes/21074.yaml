  - id: 132560
    user_id: 108
    user_name: Miss Tiffany
    user_path: null
    date_raw: 2 Jul 2006 — 7:42pm
    date: 2006-07-02T19:42:00
    votes: null
    html: <p>Letterpress can change the tone of the most stubborn typeface. I'd be willing to bet the qualities we dislike in Centaur would disappear (for the most part) once letter-pressed. Where it is spindly it will be rendered more bold, where it is crisp it will be made soft. Letterpress is the perfect answer for seeing a typeface in a whole new light.</p>
