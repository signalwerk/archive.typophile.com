    html: |-
      <p>Strangely, no matter how educated and historically accurate your choice may be, in the end it's all back to whether the face actually looks good on the page and if it can work for that specific application.</p>
      <p>Design is, after all, an industry of taste; so have fun with it.</p>
      <p>So is this a personal identity project, then? Or something else?</p>
