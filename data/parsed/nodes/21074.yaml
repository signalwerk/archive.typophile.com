    date: 2006-07-02T09:07:00
    votes: null
    html: <p>Hmm, if what Palatine saying is indeed true (I haven't had too much experience with Venetian serif, only Garalde), then what about changing your Centaur to Jenson (many versions are abound) or the less used but still beautiful New Winchester (although there's a lot of criticism surrounding its digitization.)</p>
