      <p>Palatine,</p>
      <p>With all due respect, a "poor" digitization of Centaur is still ten times better than a lot of recently designed typefaces. There is nothing inherently wrong with it, it's just that we could have had something much better. (By the way, my son recently picked up an abridged version of Narnia, set in Centaur, probably because there are centaurs in the book!)</p>
      <p>Just because Bringhurst and Dean Allen pointed that out to you doesn't mean Centaur is unusable.</p>
      <p>Now for companion -- Centaur for titling works well, so perhaps you don't need one?</p>
