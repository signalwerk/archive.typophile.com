      <p>How about something along the lines of Gill? Yes, it's a humanist sans so there is a connection to Centaur somehow; but it's also, in a sense, a geometric sans that'll provide the needed contrast.</p>
      <p>On a side note, I've found that <a href="http://www.fontshop.com/index.cfm?fuseaction=verity.search&amp;searchstr=kievit" rel="nofollow">FF Kievit</a> (my new favorite sans!) works well with almost any Garalde out there.</p>
