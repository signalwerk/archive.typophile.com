    html: |-
      <p>No problem. Originally, I presume that everyone was under the impression that your job is going to be set digitally -- until you mentioned "letterpress". In my opinion, it truly changes everything, from being able to get a more faithful version of Centaur on metal to getting that warm, charming look on print.</p>
      <p>After all, ginapaloma, in a world where offset and gravure run the cogs of commerce, taking part in the creation of a letterpress ephemera is every typophile's dream -- a romantic one, we can say.</p>
      <p>Speaking of which, your color scheme is really interesting. I've seen a color similar to PMS 396 used in a small press' short-run bookmark, but I never saw the likes of PMS 271. I would love to see how it all worked out.</p>
