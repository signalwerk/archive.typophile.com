      <p>Oh *blush*, I do like Centaur...</p>
      <p>However, I'd be open to other suggestions for what to use instead (like maybe a nice pointed pen, easy to read text with lots of nice ligatures?). Slightly different direction, I know...</p>
      <p>Context-wise, I'm a Freelance Pre-Press Artist/Illustrator, and I'm wanting to redesign my resumes/invoices/other materials. I love type/letterforms, but am far from being an "expert" at identification, etc; I'm here to learn.</p>
      <p>Thanks for the suggestions, Bram! I did try Gill, but it wasn't quite right. I'll look into FF Kievet...</p>
      <p>Thanks to everyone for their help.</p>
