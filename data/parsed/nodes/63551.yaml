    <p>Two nights ago my wife and I carved some pumpkins with our little one. Even though <a class="freelinking external" href="http://typophile.com/battle19" rel="nofollow">|this type battle</a> was long past, I decided to render our house number in the style of a particular font. I did it freehand, and with admittedly poor tools (and then took blurry images of it!), but I think it came out passably enough that someone should be able to ID it.</p>
    <p>Any takers? (BTW, this is solely for my own validation as a pumpkin carver.)</p>
    <p>I'll also admit that the kerning is kind of off :(</p>
