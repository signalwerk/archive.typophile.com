    html: |-
      <p>It is funny to see these type published nowadays.<br>
      The first type I ever designed (with FontStudio 1.0!!!) was a copy (read "inspired") of a typeface that the magazine Premiere was using for their titles around 1991-92.<br>
      I rely liked that typeface, and i wanted to use it, but I had no idea how to get it, so I decided to make my own version of that font as an exercise to learn how to design a typeface.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/criniera_5921.gif"></div><p></p>
      <p>For everybody amusement you can see the results. Don't laugh too hard please.</p>
      <p>Only many years later I learned that the original type was called Corvinus Versailles and it was designed by Dennis Ortiz Lopez.</p>
      <p>My congratulations to both Christian and Flop Design for their more professional work.</p>
