    <p>A Japanese designer has released a font, called ‘<a class="freelinking external" href="http://www.flopdesign.com/font3/readymade.html" rel="nofollow">Readymade</a>’.<br>
    It is similar to <a class="freelinking external" href="http://www.christianschwartz.com/giorgio.shtml" rel="nofollow">Giorgio</a> by <a href="/wiki/Christian%20Schwartz" class="freelinking" rel="nofollow">Christian Schwartz</a>.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Readymade_4110.jpg"></div><br>
    Of course, the x-height of Readymade is shorter than the one of Giorgio, and the characters are not the very same as characters of Giorgio. But Readymade seems to be inspired by Giorgio and Corvinus.<p></p>
    <p>The designer is selling Readymade for commercial use, but it is downloadable freely only in this November for personal use.</p>
