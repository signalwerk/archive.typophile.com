      <p><cite>If you believe that to be true, why did you use the inflammatory word “rip-off” in the title of this thread?</cite></p>
      <p>I think it's just because Akira is japanese, Nick, and – like me – he often misuses an English word missing most of its possible impact on an English-native person.<br>
      For the little I have read, it seems to me Akira is so positively interested in the Latin alphabet that it should be praised, there are a little number of Japanese designer taking Latin seriously; for many of them, Latin is quite a fascinating "fashion" and nothing more…</p>
      <p>Personally I don't like Giorgio so much, since, despite the big work on type families like that, there is not enough departure (for my conception) from the original model. I do not mean this ethically, of course, (there is plenty of it), I am just talking in terms of design.</p>
      <p>@Matteo: Ciao Matteo, come stai? :=)<br>
      Matteo has been one of the first (and few) designers to use my Ottomat in our native Italy.<br>
      On a side note, his cover for the essay "Impossibilities" by John D. Barrow shows one of the most conscious and accomplished examples of Barry Deck's "post-modern" typeface Template Gothic in use.</p>
