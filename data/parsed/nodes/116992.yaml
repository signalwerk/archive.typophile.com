    html: |-
      <p>Thanks Dick, you jogged my memory.<br>
      These are capital letters from _Cloister Cursive_ designed by Morris Fuller Benton and sold by American Type Founders Company [ATF]. Here is a sample from ATF's 1923 Specimen Book </p><div class="imageWrap"><img src="http://typophile.com/files/CloisterCursiveATF1923_4996.jpg"></div><br>
      ATF featured the font with a four page presentation [pages 68 to 71].<br>
      There is a digital version by Jim Rimmer under the name LTC Cloister Cursive <a href="http://www.myfonts.com/fonts/lanston/ltc-cloister/cursive" title="http://www.myfonts.com/fonts/lanston/ltc-cloister/cursive">http://www.myfonts.com/fonts/lanston/ltc-cloister/cursive</a> He also did additional bold and light weight digital versions.<br>
      Don<p></p>
