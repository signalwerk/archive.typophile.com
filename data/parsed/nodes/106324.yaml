    <p>I wonder about a few options/checkboxes in Font Info &gt; TrueType specific settings and Preferences &gt; Generate OpenType &amp; TrueType that I can’t seem to find much info about. And, also a wildcard that I’d like to discuss.</p>
    <p>• Automatically reorder glyphs. From what I have read, this only affects CFF-OT fonts in OS9 (not very relevant for me). <a href="http://typophile.com/node/42382" rel="nofollow">Karsten Luecke writes in another thread</a>: “In CFF-OT fonts, the first glyph must be .notdef. And in TT(-OT) fonts, the first four glyphs must be .notdef, .null, CR and space.” I assume this talks about the glyph ID order. I wonder where/how I can inspect or modify this.</p>
    <p>• HDMX settings: What determines the sizes I should apply this for? The sizes I have hinted?</p>
    <p>• Copy HDMX data from base to composite glyph: I’m not sure what this part means. Can anyone explain?</p>
    <p>• Create VDMX table: I use some vertical delta instructions, so I assume FL is correct when it says I need to check it, but what does it actually do?</p>
    <p>• Re. kerning settings: When I am making webfonts, file size is very important. From what I’ve read, browser support for a flat kerning table is as spotty as the support for OT class kerning. Also, people are pushing for OT support because that’s the cool stuff. (And David Berlow only includes a selected few kerning pairs in the RE fonts. I can understand that for stuff that is only geared at text sizes, btw. Even the retina screen is lowres when it comes to kerning at text sizes.) So: I am only exporting OT class kerning. What are you doing? Why?</p>
    <p>• The two options “Write stored native TrueType hinting” and “Export visual TrueType hints”. What are these referring to?</p>
