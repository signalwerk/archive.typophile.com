    html: <p>The "St Etienne Daho" font sample come from a cover sleeve of an EP by french singer Etienne Daho in 1995. Artwork was done by Me Company (background picture credit go to Pierre &amp; Gilles). Does Rian Hughes had any relation with Me Company at this period ? As you said Bald Condensed, the general feel makes you think of Miserichordia, well some other fonts he made give me that feeling too.</p>
