    html: <p> Thanks a bunch guys! (I especially like the "a thing of beauty") <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":)"> <br> <br>John -- <br>Yep, it does indeed seem a tad stretched, I'll take care of it. <br> <br>Hrant -- <br>Powerful was the idea. I like typefaces with a rich and heavy texture, that was what I was aiming for anyway.  <br> <br>Ole -- <br>Q is my favorite. I love Q's. <br> <br>The only thing I'm not quite satisfied with is the X... I think it looks almost slanted. <br>On the other hand, I guess there must be some compromises in every typeface <img src="http://www.typophile.com/forums/clipart/sad.gif" alt=":("> </p>
