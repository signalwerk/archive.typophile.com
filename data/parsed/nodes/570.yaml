    html: "<p> I agree with Hrant's suggestions. Where are the originals? Are you scanning from a book or something? <br> <br>Other specific suggestions: <br>the end of the tail on the R might look nicer if it was small and not the same height as the slab serif sides; the junctions of stroke and serif could be larger in the C and G - more white space, less ink in other words; you might experiment with some curves instead of sharp angles for the serifs. Seeing as this font should be used at poster size for best effect, curves might look nicer at those sizes. <br> <br>There is a not dissimilar font called Eglentine - published by I don't know who - and it even has a lower case. </p>"
