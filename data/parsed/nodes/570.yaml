    html: "<p> Sorry but the G looks totally bizarre now. <br>Q is wonderful. I think you could afford to be as bold with the interpretations of some other characters too. The S looks like it is on the verge of becoming oblique - perhaps there might be a way to do a version with a thin section in the middle of the main stroke - the same as the Q tail beginning and the E, F and H center strokes. This would give you more space to play with to balance top and bottom. <br>The thickness and thinness of the M and the N still seems off.  The M's thin-thick-thin-thick should be enhanced: thinner thins and thicker thicks. The N seems like all the strokes have the same weight but the shape would surely have more character if it was thin-thick-thin.  <br>As usual - sorry to be negative. Overall you've moved in the right direction and given the face more consistency. </p>"
    html_clean: "<p> Sorry but the G looks totally bizarre now. <br>Q is wonderful. I think you could afford to be as bold with the interpretations of some other characters too. The S looks like it is on the verge of becoming oblique - perhaps there might be a way to do a version with a thin section in the middle of the main stroke - the same as the Q tail beginning and the E, F and H center strokes. This would give you more space to play with to balance top and bottom. <br>The thickness and thinness of the M and the N still seems off.  The M's thin-thick-thin-thick should be enhanced: thinner thins and thicker thicks. The N seems like all the strokes have the same weight but the shape would surely have more character if it was thin-thick-thin.  <br>As usual - sorry to be negative. Overall you've moved in the right direction and given the face more consistency. </p>"
