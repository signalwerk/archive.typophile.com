    html: "<p>All good, and to an extent, planned suggestions.  <br>I have only just started roughing out the shapes, with a low resolution picture as a template: <br> <br><img src=\"http://www.typophile.com/forums/clipart/your_image.gif\" alt=\"original\"> <br> <br>which I got hold of from: <br> <br>http://www.lib.udel.edu/ud/spec/exhibits/tradecat/1print.htm <br> <br>Optical corrections and modelling of strokes, are planned, I like \"human\" typefaces (and a typeface as the one above do need some human qualities). <br> <br>I think I will keep the sharp inside of the J, as I like it quite much. I will kill that darling if it looks odd in the final design though. <br> <br>The R, I agree completely, I'll get right on it. <br> <br>As for lowercase, I'm planning on making it when I have all the UC and numerals done. <br> <br>Thanks for the comments.</p>"
