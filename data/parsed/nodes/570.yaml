    html: <p>Richard <br>Glad to see a well-realized slab based closely on wood. Yes, the strokes of the middles on E and F are a bit thin, but seem appropriate for the period of generally idiosyncratic designs.  <br> <br>Someone mentioned something about a market. Maybe, though I have been trying for quite a bit. Check out my <a href="http://www.woodentypefonts.com/" target="_top">http://www.woodentypefonts.com/</a> for examples and demos. I too use specimens from various sources. Will look more at comments when I have more time. Nice to see others working along the same lines as I have been, and with success. <br> <br>Jordan</p>
