    html: <p> As someone who loves (and frequently uses) old woodcut-style fonts, I'm going to disagree somewhat with Hrant and (to a lesser extent) Martin. (No offense intended to either Hrant or Martin -- you both know I respect and agree with you most of the time. <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":)"> ) <br> <br>The strength of this design is in its quirks. The extreme thins of the middle strokes of the "E" and "F", the slight (almost unnoticeable) taper of the lower stroke of the "C", the squared curve of the tail of the "J" and the thick-tailed "R" are what make this font interesting and set it apart from other similar woodcut-style Egyptians such as Giza and Farao. If I wanted Giza or Farao, I'd use them. (And I do. <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":)"> ) This font offers delightful and interesting alternatives. <br> <br>I do agree with Hrant and Martin, however, in that certain optical adjustments should be made. The spur of the "G" should be thinned slightly, along with Martin's suggestions regarding the serifs of the "C" and "G", to avoid the problem of ink spread closing the space between the strokes. Similar attention should be given to the "Q" and the "2", once you get to them. <br> <br>Nice work so far. <br> <br>David </p>
    html_clean: <p> As someone who loves (and frequently uses) old woodcut-style fonts, I'm going to disagree somewhat with Hrant and (to a lesser extent) Martin. (No offense intended to either Hrant or Martin -- you both know I respect and agree with you most of the time. <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":)"> ) <br> <br>The strength of this design is in its quirks. The extreme thins of the middle strokes of the "E" and "F", the slight (almost unnoticeable) taper of the lower stroke of the "C", the squared curve of the tail of the "J" and the thick-tailed "R" are what make this font interesting and set it apart from other similar woodcut-style Egyptians such as Giza and Farao. If I wanted Giza or Farao, I'd use them. (And I do. <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":)"> ) This font offers delightful and interesting alternatives. <br> <br>I do agree with Hrant and Martin, however, in that certain optical adjustments should be made. The spur of the "G" should be thinned slightly, along with Martin's suggestions regarding the serifs of the "C" and "G", to avoid the problem of ink spread closing the space between the strokes. Similar attention should be given to the "Q" and the "2", once you get to them. <br> <br>Nice work so far. <br> <br>David </p>
