    html: <p> Wow. Bizarre <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":)"> <br>Maybe I should settle for something inbetween the current and the before version.  <br> <br>As for the semi-obligue S, I'm aware of that, it's sort of fixed already, I noticed it right after I had uploaded it. On the other hand, I've noticed that many of the old woodcut styled fonts actually have slightly obligue S-letters... (taken to a silly extent in some bauhaus fonts, not that those were fonts like this...but still). <br> <br>As for the thickness and thinness issue, I wanted this to be a heavy font, with almost equal (percieved) strokes. I've stepped away from that in the Q though, so I might as well do it in other places. <br> <br>Oh yeah, the G does look a bit retarded. hehe. </p>
