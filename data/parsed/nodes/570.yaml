    html: <p> Although this isn't my cup of Lapsang Souchong, it seems to hold together well. <br> <br>I think the "C" needs a thicker lower curve, the middles of "EF" are a bit too thin, and the inside of the "J" should just curve. <br> <br>You might also consider implementing some "modeling" of the strokes (like making the left diagonal of the "A" slightly thicker at towards bottom) in order to compensate optically - on the other hand maybe this type of design *needs* a certain imbalance. <br> <br>hhp </p>
