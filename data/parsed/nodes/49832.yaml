    html: |-
      <p>The goal is that every version of InDesign should be able to set type in every writing system is different from the goal that every version of InDesign should offer full typographic support for every writing system. </p>
      <p>The English and Middle East versions of InDesign allow you to do basic typesetting for East Asian (CJK) languages, but only the East Asian version gives you access to the full set of typographic features specific for those languages. </p>
      <p>But until now, the English and the East Asian version of InDesign did not at all allow setting Arabic or Hebrew. I think Adobe is now changing that, but I'm not sure if their goal is to completely unify all the editions, including the advanced typographic features. </p>
      <p>It is possible that they fear that this would make the user interface overly complex. (I imagine putting the East Asian, Middle East, Indic and European typographic controls would result in some serious complexity). </p>
      <p>A.</p>
