    html: <p>Today, I typeset a Hindi novel in InDesign CS4 Middle East edition. In the ME version, the World Ready text composer is available by default (since it is used for Arabic and Hebrew), so this version is easy to use for Devanagari. There is no Hindi dictionary support yet, and no hyphenation module, so one has to be careful to get good results and be prepared for some manual editing, but overall the World Ready composer seems to do a grand job with Devanagari OpenType fonts.</p>
