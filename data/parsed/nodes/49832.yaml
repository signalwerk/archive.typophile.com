      <p>You can probably tell from Thomas' comments that we're trying to figure out the best way to describe the support for what we're calling "complex scripts" in InDesign CS4. We spent a lot of effort integrating the glyph layout engine that is in the ME version of InDesign into the mainline product. The goal was to allow documents that were created in InDesign ME to be opened, viewed, printed, and edited in the non-ME version. We did not have time to figure out a user interface or to do as much testing of this separate engine as we would like. We consider it "beta" and we'll continue to improve this area as we move forward. That said, you can use scripting or template-style documents to access features for the correct composition of Arabic, Hebrew, Tamil, Devanagari, Thai, Lao, and more. Full cross-platform support of these writing script at the level we and our users demand is going to take more than one release. We're excited about the functionality that is under the hood and hope that this first step will allow our more cutting-edge users to do high-end design with these scripts.<br>
      eric</p>
    html_clean: |-
