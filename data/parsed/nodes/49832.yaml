      <p><em>Once we’ve figured out how to roll this “beta-but-useful” functionality out...</em></p>
      <p>How about a set of complex script template files for download?</p>
      <p>I suspect the most obvious UI deficiency will be right-to-left text controls for Hebrew, Arabic, etc. Being able to set paragraph directionality is pretty critical for working with RTL scripts. A lot of other complex script support doesn't really need much dedicated UI, since so much is handled via input, layout engine and character properties.</p>
