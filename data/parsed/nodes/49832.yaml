      <p>Hello Guys<br>
      I have been working on Adobe Indesign CS2/CS3 from so many years and was so frustrated by it's minimum support for Indian Languages.I intalled IndiPlus And SpellPlus Plugin provided by Metadesign Solutions. Indicplus Plug-in is capable to render complex scripts (Indian Languages and others) without error using Unicode fonts. This is the first plugin which supports typing in both Indian and Other languages using complex script in Indesign.<br>
      SpellPlus delivers the much needed spell check feature to Adobe Indesign in various Indian languages including Hindi, Tamil and Bengali etc. SpellPlus enhances the potential of Indesign by augmenting the language and spelling options available to the user It just saved me. Site: </p>
      <p><a href="http://www.metadesignsolutions.com/index-3.html" title="http://www.metadesignsolutions.com/index-3.html">http://www.metadesignsolutions.com/index-3.html</a></p>
      <p>Never had any problems with it. Awesome tool for Indian Languages. Has one tool for Adobe Indesign CS4 also. I will highly recommend it.<br>
      Cheers<br>
      SA</p>
