    html: <p>Chris, is the OS X Devanagari font an OpenType font or an AAT font? If it is an Apple system font, it probably contains AAT tables instead of OpenType tables. In that case, you would expect the World-Ready composer to correctly re-order Devanagari characters, but you wouldn't get all the refinements of conjunct forms, accurate mark positioning, etc. that rely on the OT GSUB and GPOS tables. Mangal is an OT font, so will perform better.</p>
    html_clean: <p>Chris, is the OS X Devanagari font an OpenType font or an AAT font? If it is an Apple system font, it probably contains AAT tables instead of OpenType tables. In that case, you would expect the World-Ready composer to correctly re-order Devanagari characters, but you wouldn't get all the refinements of conjunct forms, accurate mark positioning, etc. that rely on the OT GSUB and GPOS tables. Mangal is an OT font, so will perform better.</p>
