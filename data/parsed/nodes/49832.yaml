      <p>Well, I downloaded CS4 trial, added a script found on the Swiss InDesign forum "hilfdirselbst" at<br>
      <a class="freelinking external" href="http://www.hilfdirselbst.ch/gforum/gforum.cgi?post=373891" rel="nofollow">http://www.hilfdirselbst.ch/gforum/gforum.cgi?post=373891</a> to enable the World-Ready paragraph composer, and had an experiment with some Unicode UTF8 text copied from the BBC Hindi website.<br>
      Just to double-check, I viewed the same web page via Safari on OS X 10.4 and via Firefox on Windows XP, and used both those renderings to check against the same text in CS4.<br>
      Result: The World-Ready paragraphs certainly join the Hindi/Devanagari letters much better, and in the same order as the text rendering via the browsers.<br>
      Oddly, the results were better when I switched from the OS X 10.4 font Devanagari MT to the downloaded font Mangal.</p>
      <p>Probably needs someone with a better understanding of the language to be 100% sure, but to<br>
      this amateur, it looks OK so far.<br>
      Now for some experiments with other Indian languages...</p>
