      <p>Exotic scripts. Like the Arabic language with with Arabic script. Or Indic languages with Indic script. Don't forget the Chinese language with Chinese script. What about the Aztec language with Aztec script. And, don't forget, the Egyptian language with Egyptian script. Good point. </p>
      <p>Why not make English exotic, too? Let's concentrate all design efforts on creating a proper English script for the English language. It's way overdue to get rid of the totally obsolete, millennia old, and outmoded and out-of-place complex Latin letters which are continually causing endless ridiculous spelling problems all over Yurp.</p>
      <p>Thomas Milo<br>
      DecoType<br>
