      <p>¶ Anyone know this reference:</p>
      <p><em>The Palaeotypography of the French Renaissance: Selected Papers on Sixteenth-century Typefaces</em><br>
      by Hendrik D.L. Vervliet<br>
      [Brill, Library of the Written Word - The Handpress World, 2008]</p>
      <p>¶ Table of contents</p>
      <p>VOLUME I</p>
      <p>Preface</p>
      <p>Introduction<br>
      Abbreviations and Conventional Signs<br>
      Old English and French Names for Body Sizes</p>
      <p>Early Sixteenth-Century Parisian Roman Types<br>
      Conspectus of Types<br>
      Table 1: Roman Types by Body Size</p>
      <p>Simon de Colines, Punchcutter; 1518–1546<br>
      Conspectus of Types<br>
      Table 1: Colines’s Types by Letter Family and Size</p>
      <p>The Printing Types of the Young Robert I Estienne; 1526–1530</p>
      <p>Robert Estienne’s Printing Types<br>
      Conspectus of Types<br>
      Table 1: Estienne’s Types by Family and Body Size<br>
      Table 2: Estienne’s Types by Year of First Occurrence</p>
      <p>Garamont’s Canons: Roman Type Design in Sixteenth-Century France</p>
      <p>The Young Garamont: Roman Types Made in Paris in the 1530s<br>
      Conspectus of Types<br>
      Table 1: Types in Order of First Occurrence<br>
      Table 2: Types Classified by Punchcutter</p>
      <p>Roman Types by Robert Granjon<br>
      Conspectus of Types<br>
      Table 1: Granjon’s Romans by Date<br>
      Table 2: Granjon’s Romans by Body Size</p>
      <p>Printing Types of Pierre Haultin; c. 1510–1587<br>
      Conspectus of Types<br>
      Table 1: Haultin’s Typefaces in Order of Date and Place of First Appearance</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/paleotypo_6494.jpg"></div><p></p>
