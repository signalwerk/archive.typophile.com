  html: |-
    <p>I'd like to get some opinions about whether or not it is deemed ok to uses a font other than the one the specimen is created for in that specimen.</p>
    <p>I'm thinking specifically about using a different font for body copy in a specimen designed for a display font.  It seems fairly straight forward to me that you wouldn't want to use a bold display font for body text in the specimen.</p>
    <p>And what if I have never created a font meant to be used for body copy?  Is it ok to use someone else's font for the copy?</p>
