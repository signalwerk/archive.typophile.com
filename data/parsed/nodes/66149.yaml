    html: |-
      <p><cite>What kind of person are you going to be for the rest of your life?</cite></p>
      <p><cite>...I would hope someone would stop me.</cite></p>
      <p>I think the more ill-advised a tattoo, the better it will ultimately serve as a reminder of the transience of identity. One fantastic reason to get a tattoo is that (most) people harbor delusions that at least some of the things that make them who they are are immutable. I’d be surprised if anything about a person is necessarily safe from change. I know a lot of self-serving middle-aged types who could benefit from a daily reminder that they were once myopic 20-year-olds.</p>
      <p>And that said, the illusion of the durability of identity is often a very complete one, and the pleasure (short-term) of a tattoo can be great. It’s an experience, and one that carries truly minor risks compared to some of the things people do to metaphysically scarify themselves.</p>
