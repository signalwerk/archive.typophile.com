      <p>I'd use the ampersand from a font that held some special significance to me. Maybe the &amp; from my wedding invite, or the ones from Joanna and Georgia (my daughters names are Johanna and Georgia, for reasons unrelated to type.)</p>
      <p>Maybe if there's an ampersand in the epitaph of one of your heros, or a relative. Do a rubbing and use that. The possibilities to work some kind of meaning into it are endless.</p>
