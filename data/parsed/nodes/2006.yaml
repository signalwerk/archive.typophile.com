    html: "<p>Brian: no, I don't have that issue of the  <br>JoTR but I had access to the article all  <br>the same. It mentions the New Alphabet only  <br>very briefly. The gist of it is that type <br>in the computer age shouldn't be based on  <br>the old, hand-derived forms. I quote this  <br>sentence that might delight our friend <br>Hrant: \"Writing by hand is fortunately a  <br>vanishing skill.\" (Exercise for HHP: compare <br>Crouwel to Gerrit Noordzij). Instead, the  <br>inner \"modular\" logic of the computer should <br>inform the structure of \"letters\". Crouwel <br>calls that a cellular structure - which can <br>be represented by \"dots\" (I think the word <br>\"pixel\" wasn't current yet in 1970). Only, <br>the concept of a cell is richer and more <br>complex than that of a pixel or dot. The  <br>signs formed by these cells - \"enlarged  <br>cellforms\" - he wouldn't call \"letters, but <br>\"nuclei\", the grouping of <i>nuclei</i> not \"words\", <br>but \"units\". Together, <i>units</i> form a  <br>\"communication\". <br> <br>R</p>"
    html_clean: "<p>Brian: no, I don't have that issue of the  <br>JoTR but I had access to the article all  <br>the same. It mentions the New Alphabet only  <br>very briefly. The gist of it is that type <br>in the computer age shouldn't be based on  <br>the old, hand-derived forms. I quote this  <br>sentence that might delight our friend <br>Hrant: \"Writing by hand is fortunately a  <br>vanishing skill.\" (Exercise for HHP: compare <br>Crouwel to Gerrit Noordzij). Instead, the  <br>inner \"modular\" logic of the computer should <br>inform the structure of \"letters\". Crouwel <br>calls that a cellular structure - which can <br>be represented by \"dots\" (I think the word <br>\"pixel\" wasn't current yet in 1970). Only, <br>the concept of a cell is richer and more <br>complex than that of a pixel or dot. The  <br>signs formed by these cells - \"enlarged  <br>cellforms\" - he wouldn't call \"letters, but <br>\"nuclei\", the grouping of <i>nuclei</i> not \"words\", <br>but \"units\". Together, <i>units</i> form a  <br>\"communication\". <br> <br>R</p>"
