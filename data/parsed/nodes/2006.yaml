  html: <p> I've recently become very interested in  Wim Crouwel, especially his New Alphabet, but though all my searching on the web I have found very little on him or the New Alphabet. All leads on books he's written, or been featured in, have run dry for me. Any information that doesn't turn up on google searches for "Wim Crouwel", "New Alphabet", or combinations of the two would be appreciated. </p>
