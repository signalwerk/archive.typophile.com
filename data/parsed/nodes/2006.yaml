    html: "<p> Brian: I thought you said you \"would like to  <br>know everything I can about the New Alphabet\".  <br>How come you're satisfied? ;)  Now, if you get <br>any new information from your professors, <br>please share with us. <br> <br>Hrant: yes, that's the point. Both of them  <br>(Noordzij, Crouwel), in their opposite ways, seem <br>to be preoccupied with the formation of signs <br>rather than their reading/decoding (I think that's <br>an over-simplistic assessment however). In any <br>case, Crouwel's progressive approach (and let's <br>put it in context, that's 1967-70 - at least six <br>years before R2D2) seems healthy, especially <br>when so much typography and type design today <br>tend to a certain smug regressiveness...  ;) <br> <br>regards, <br>R </p>"
