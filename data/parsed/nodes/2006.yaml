    html: <p> &gt; type in the computer age shouldn't be <br>&gt; based on the old, hand-derived forms. <br> <br>Yeah, it should be based on R2D2... As Paul Stiff replied to Noordzij in Typography Papers (#4), type is about *reading*. Not the hand, not robots, not dead Italians. <br> <br>Brian, I'm an "alphabet conception" guy (as MyFonts calls it), but I don't do Wim - sorry. <br> <br>hhp </p>
