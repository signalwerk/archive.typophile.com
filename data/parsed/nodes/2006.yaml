    date: 2002-08-10T10:20:00
    date_raw: 10 Aug 2002 — 10:20am
    votes: null
    html: "<p>Hi Brian. <br> <br>I have a copy of Crouwel's <i>New Alphabet</i> booklet. <br>What kind of info do you want? If you want the <br>faces themselves (\"what the wall shows\") they're <br>sold by TheFoundry as it was mentioned. <br>Of course, the 'New Alphabet' is a 'conceptual' <br>design - a proposition for a CRT face (the main <br>text of the booklet is set in Univers). That's <br>1967 of course. Some theoretical aspects behind <br>it are developed in an article Crouwel wrote in <br>the Journal of Typographic Research (=Visible <br>Language), in its Winter 1970 issue: \"Type Design <br>for the Computer Age\". <br> <br>On Crouwel himself, the main reference is <br>Frederike Huygen and Hugues Boekraad's <br><i>Mode en Module</i>, a thick <i>catalogue raisonné</i> <br>(Dutch-only unfortunately), nicely designed by <br>Karel Martens and Jaap van Triest (though I <br>have problems with some aspects of its printing). <br> <br>R</p>"
    html_clean: "<p>Hi Brian. <br> <br>I have a copy of Crouwel's <i>New Alphabet</i> booklet. <br>What kind of info do you want? If you want the <br>faces themselves (\"what the wall shows\") they're <br>sold by TheFoundry as it was mentioned. <br>Of course, the 'New Alphabet' is a 'conceptual' <br>design - a proposition for a CRT face (the main <br>text of the booklet is set in Univers). That's <br>1967 of course. Some theoretical aspects behind <br>it are developed in an article Crouwel wrote in <br>the Journal of Typographic Research (=Visible <br>Language), in its Winter 1970 issue: \"Type Design <br>for the Computer Age\". <br> <br>On Crouwel himself, the main reference is <br>Frederike Huygen and Hugues Boekraad's <br><i>Mode en Module</i>, a thick <i>catalogue raisonné</i> <br>(Dutch-only unfortunately), nicely designed by <br>Karel Martens and Jaap van Triest (though I <br>have problems with some aspects of its printing). <br> <br>R</p>"
