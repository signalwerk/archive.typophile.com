    <p>For some reason FontExplorer X's AutoLoad keeps popping up in my System Preferences &gt; Accounts &gt; Login Items. Unfortenately this causes my Mac to hang during the startup process and forces me to start up in Safe Mode, remove the AutoLoad from the Login items and start up in normal mode again.<br>
    Even thought I disabled all auto-activation functionality in FontExplorer X's preferences the damned thing keeps showing up.</p>
    <p>Any thoughts?</p>
    <p>Best,<br>
    Artur</p>
