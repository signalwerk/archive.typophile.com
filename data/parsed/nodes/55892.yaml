      <p>In Spain and Portugal respectively, "Kabron" and "Cabrão" is a very insulting word. It means a guy that is doing sex with the wife of a married man. May be it means something like "****" in English</p>
      <p>Talking about the topic, it seems to me that the lower case letters and upper case letters are two completely different typefaces.</p>
      <p>The 'a' seems very weird. It creates a lot of space between it and the next letter, due to its tail, and you may consider doing an exception for its kerning.</p>
      <p>Now i am looking more attentively and seems to me the first example of text has an exaggerated kerning, unlike the rest of the document.</p>
