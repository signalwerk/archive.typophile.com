      <p>IMHO, ‘a’ has potential, but it needs a little more of work. No doubt about ‘r’: it looks really weird. Ring: too little white space. Agree with Bendy about ampersand.</p>
      <p>The linguistic note: “Cabrón”, at least in Mexico, has a lot of meanings, but certainly it is a bad word in some circles… If you call “cabrón” a very good friend, it’s ok (“mate” meaning). If you call “cabrón” your boss, you’re dead (“asshole” meaning).</p>
