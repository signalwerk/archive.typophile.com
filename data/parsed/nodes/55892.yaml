      <p>Hi Andrej<br>
      This is neat, I like it. Looks like it would be nice for headlines. Your s is really nice.<br>
      Here are my observations, as a not-very-accomplished type designer:</p>
      <p>Ampersand looks like there's a section missing.<br>
      B and G look narrow. W also looks a bit tight.<br>
      S could do with a couple of units more weight on the spine.<br>
      I find a's tail a bit on the long side.<br>
      m is very skinny.<br>
      r looks like a cut-off n.<br>
      I would have a straight y. x looks dark.<br>
      I find the curved terminals on gjt a bit tight.<br>
      I like your cedilla. The other diacritics look a bit close to the base glyphs.</p>
      <p>Hope that's a bit useful! :)</p>
