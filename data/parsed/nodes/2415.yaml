    html: <p>Weidemann designs the corporate familiy for Mercedes-Benz. as far as I know,  <br>most glyphs based on the "golden cut". I love those faces especially the lc g,  <br>the corpo A small caps and the whole corpo E.  <br> <br>I've done some work for daimler chrysler and used the urw-version of corporate.  <br>this version has a few bugs and its badly screen optimized.  <br> <br>corporate A ntiqua <br>corporate S ans <br>corporate E gyptienne <br></p>
