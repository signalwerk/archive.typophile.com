  html: <p>We are all aware of the typeface <a href="http://www.bertholdtypes.com/bq_library/090161000.html" target="_blank">Corporate S</a> from Berthold Types. Yes? I'm wondering if anyone knows of a suitable replacement. I feel awful putting it that way. Oh, the guilt! I know that once you do the math it is only $20 per font, but ... well ... any ideas? Is someone else licensing this typeface for less? </p>
