    html: |-
      <p>Listed below are a  few usability websites out of my bookmarks. Hope you find them useful.</p>
      <p>Usability Expert Jakob Nielsen’s website:<br>
      <a href="http://www.useit.com/" title="http://www.useit.com/">http://www.useit.com/</a></p>
      <p>Usability Expert Bruce Tognazzini’s website:<br>
      <a href="http://www.asktog.com/" title="http://www.asktog.com/">http://www.asktog.com/</a></p>
      <p>Outdated but nevertheless comprehensive database of some very useful websites on user interface design and information architecture:<br>
      <a href="http://www.usableweb.com/" title="http://www.usableweb.com/">http://www.usableweb.com/</a></p>
      <p>An association for Usability professionals worldwide. You’ll need membership but I say its worth it.<br>
      <a href="http://www.upassoc.org/" title="http://www.upassoc.org/">http://www.upassoc.org/</a></p>
      <p>Resource for techniques on usability testing and heuristic evaluation:<br>
      <a href="http://jthom.best.vwh.net/usability/" title="http://jthom.best.vwh.net/usability/">http://jthom.best.vwh.net/usability/</a></p>
      <p>An HCI (human computer interaction) portal:<br>
      <a href="http://www.hcibib.org/" title="http://www.hcibib.org/">http://www.hcibib.org/</a></p>
      <p>Resources for user interface design<br>
      <a href="http://gui-designers.co.uk/resources/resources.htm" title="http://gui-designers.co.uk/resources/resources.htm">http://gui-designers.co.uk/resources/resources.htm</a></p>
      <p>A very useful (and well designed too!) webzine on UI design:<br>
      <a href="http://www.uigarden.net/english/" title="http://www.uigarden.net/english/">http://www.uigarden.net/english/</a></p>
