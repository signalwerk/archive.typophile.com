    <p>Disney pays the cash, but the Pixar execs walk in and take the first-class seats. Very interesting. I guess for a cool 7bn you should be able to buy yourself a new swanky studio in Emeryville (ahem, my place of residence in the SF Bay Area), put Mr. Midas (Jobs) on your board and replace your executives and the creative staff in both the animation and the imagineering divisions.</p>
