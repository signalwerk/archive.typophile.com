    html: "<p>I quite like the detached tail of the Q, but I do see how in some contexts, with different leading etc it could look a bit odd and less readable. I'm not usually fond of the high contrast Q and its tail (see: Ambroise, Bodoni, Walbaum) but this works.</p>"
