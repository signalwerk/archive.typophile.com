    <p>Hello!<br>
    I'd like to share and get feedback on a set of capitals I have designed for a client work, maybe it will see the light of day as a font. I'm calling it Exotique, and it's a Modern Display Serif. It is made to be seen at big display sizes.</p>
    <p>Cheers and thanks!<br>
    Rodrigo</p>
