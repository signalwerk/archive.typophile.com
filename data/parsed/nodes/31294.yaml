    html: |-
      <p>Coop, </p>
      <p>keep in mind to design the ldot/Ldot so that: </p>
      <p>* When ldot is immediately followed by the normal l, and when Ldot is immediately followed by the normal L, the dot in ldot/Ldot appears visually centered between the two l/L's. </p>
      <p>* There should be no implied wordspace between ŀ and l, so a word like "coŀlecció" should look like one word, the space between the two "l"s should not be visibly larger than between other letters.<br>
      This is a similar recommendation to what you should do with the "apostrophic caron" for Czech and Slovak: the word "ďábel" should have no implied wordspace, very much unlike the English "don’t", where the apostrophe can have some space on its own. For this reason, the dot in ldot, and the apostrophic caron in dcaron, tcaron, lcaron should be designed very "sparsely".</p>
