      <p>Have you looked at the Art director's toolkit, it tells you where to find glyphs? With Minion Pro it actually only says glyph 771, and doesn't give any unicode results.<br>
      If your font has the glyph, you can access it via glyph pallette in InDesign and Illustrator<br>
      If you're designing a font I can't help, sorry.</p>
