      <p>A couple of thou', either euros or dollars. Rough enough?<br>
      The design itself should come to, well, no more than a few hundred dollars -- an hourly rate is fair <em>if</em> you know your way around InDesign.</p>
      <p>Biggest part of the printing costs is setting up and get started; only with more than 300 or 400 copies, time and paper are going to kick in. Binding sheets into real books is mostly a flat fee, though.</p>
      <p>Why not ask a quotation from one or more printers in your neighbourhood? They are a friendly lot, and when given the opportunity, they will tell you what to ask next time.</p>
