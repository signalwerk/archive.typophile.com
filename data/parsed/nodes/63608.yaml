      <p><cite>I find Theunis’ price estimate may be a bit low.</cite></p>
      <p>Ah, right. That would come out to a production cost of about $2.00 per 300 page book -- a bit on the low side. I'd change that to an estimate of $5 to $8 per book, retailing for something inbetween $50 and $80.</p>
      <p>I don't think a 1,000 copy run can be done with Printing-on-Demand for that price.</p>
