    <p>I'll start with two apologies:<br>
    1. I'm certain this topic has been discussed frequently, but I had no luck searching within the forum.<br>
    2. My lack of knowledge about this subject makes it virtually impossible for me to be very specific, so I would just like some general estimates/guesses in response to my inadequate question.</p>
    <p>I am setting a book using InDesign. My client is undecided about self-publishing or using a publishing company. (My client has several agents who are interested in handling the book.) I need to get a rough estimate of how much it would cost to print a professional quality paperback book in standard format, (about 5"x8"), approximately 300 pages in length, with back and front cover in color. My question involves only printing production costs for 1000 copies. Artwork and typesetting will be provided by yours truly.</p>
    <p>I fully realize that my lack of details will result in less-than-happy responses, but all I need is a very rough approximation!</p>
    <p>Thanks Much!<br>
    DK~</p>
