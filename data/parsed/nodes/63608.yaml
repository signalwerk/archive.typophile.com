      <p>chris said:<br>
      &gt;   A couple places come to mind you may want to check out:<br>
      &gt;   Lulu<br>
      &gt;   Lightning Source</p>
      <p>um, lightning source, yes.  lulu, no.  i love lulu, but<br>
      you use lulu for one-offs, not a run of 1000 copies.</p>
      <p>you should also consider _distribution_.  unless you<br>
      actually _want_ to handle the distribution, or unless<br>
      all the books are going to just a handful of locations,<br>
      it might be good to go with a printer (like lightning,<br>
      or createspace) which is willing to handle fulfillment.</p>
      <p>-bowerbird</p>
