  html: |-
    <p>I'm currently creating a PDF template within Acrobat for a client. I'm using HF&amp;J Whitney and forgot that I wouldn't be able to embed the font. Does anyone know of a typeface that looks similar to Whitney and would be able to be embedded? The goal is to allow the client to make edits/updates from their end. This might be a tough one. Maybe the easiest solution would be to have them purchase a license to Whitney.</p>
    <p>Thoughts?</p>
