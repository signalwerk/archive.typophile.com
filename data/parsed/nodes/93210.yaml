    html: |-
      <p>Those are Bash shell scripts, right? Copy into a plain text editor and save under an appropriate name (end it with .sh). Then run from Mac OS X's Terminal and see what happens :-)</p>
      <p>(Do <em>not</em> attempt on a Windows machine, it's Useless. Linux may or may not work.)</p>
      <p>From mere eye-balling the scripts, and interpolating between the flaky bits of knowledge I have:</p>
      <p>The first one creates a HTML file with the test characters and fonts in the top halve (it's clearly a CSS file). The http header makes me think this might get fed right into a compatible web browser.<br>
      The second one creates a HTML file with the color codes of the hex color list at its bottom, in their respective color.</p>
      <p>... How am I doing so far, Té? :-)</p>
      <p>I would need to encounter a specific scenario where this kind of command-chaining is useful, but then again when I <em>do</em> I'll make sure to look these up and see how to adjust to taste. It could be priceless stuff, and just what you are looking for -- under the right circumstances.</p>
