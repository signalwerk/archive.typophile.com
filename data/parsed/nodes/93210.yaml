      <p>rehint – one way of applying ttfautohint to a bunch of fonts. Also shows use of getopt, case and while. You'll almost certainly have to change the shabang from /bin/ash to /bin/sh. On my system, /bin/ash is compiled static with dietlibc to lessen startup time and memory requirements.</p>
