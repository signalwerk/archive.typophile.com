    votes: null
    html: |-
      <p>Forgot to mention, but I got the HKS numbers in hks2css from <a class="freelinking external" href="http://www.tabelle.info/hks_farben.html" rel="nofollow">tabelle.info</a>. The scripts were written on a Linux box on which /bin/sh is <code>ash</code>, the Almquist shell, though my login shell is Bash. I <em>think</em> the scripts will work with BSD.</p>
      <p>The CGI script must be adapted to amyone else's system, but it takes two font names and two file names. The file names are expanded to CSS files with @font-face declarations for the two fonts named. It returns HTML with some embedded CSS that sets up a basic comparison between the two fonts as subhead/text as well as a side-by-side comparison of some characters so you can judge their match for yourself. Can't remember off the top of my head where on the web I found this test. I merely CGIfied it.</p>
      <p>You can use the latter script of a Windows machine, <em>if</em> you have a suitable port of various Unix utilities installed and working. Cygwin and mingw ought to bring them in as a matter of course, but <a class="freelinking external" href="http://gnuwin32.sourceforge.net/" rel="nofollow">GnuWin</a> should suffice.</p>
      <p>The latter script can also serve as a sample of the use of printf(1), here-documents and passwd-style databases. Any C coder should know the first already. A here-document is a document embedded in a script. Here, it's the stuff from '&lt;&lt;_E_O_F_' up to the '_E_O_F_' at the end.</p>
      <p>A passwd-style database is a text file with the fields separated by semicolons. Setting IFS=: lets you read them with the usual shell commands.</p>
      <p>There's a whole bunch of Bash tutorials out there that will explain this, and hopefully much better than I did.</p>
