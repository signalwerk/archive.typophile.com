    html: <p>Zach - by "custom" I mean do not simply set TARTAN  <br>in a font and call it your flag. Treat it like a logo, or <br>as Jay-W would say, a trademark. <br> <br>Treat it with care, space it tighter <br>than you would a headline, look for harmonious combinations <br>with your TA combo, which appears twice. <br> <br>btw, Jim Parkinson is one of many flag experts. <br> <br><a href="http://www.typedesign.com" target="_blank">www.typedesign.com</a> <br> <br>Also, I think nameplate and flag are interchangeable, <br>while masthead refers to the staff listings commonly <br>put inside, typically near the op-ed page.</p>
