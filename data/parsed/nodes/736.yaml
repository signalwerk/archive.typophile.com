    html: "<p>&gt; For the text, which will be 9 or maybe 10 pt, I'm toying with Mrs Eaves or (a little angel on my right shoulder says this is a bad idea) Bodoni. <br> <br>If your little angel warned you about Bodoni but said nothing about the dangers of Mrs Eaves for small point sizes, fire him pronto - no severance pay. News fonts are all about x-height, and Mrs Eaves's in tiny. <br> <br>As for Bodoni, there's such a wide range of them in terms of appropriate point size usage that some choices would produce passable results while others would produce readability quicksand. I say \"passable\" because even the best Bodoni would not be a good choice: its letterforms are structurally display-centric, not text-centric. <br> <br>There are many rock solid news faces you can choose from. Like the calm, versatile Olympian, or the edgy, highly efficient Swift, or the multi-talented (but pricey) Poynter. There are so many, and I'm not really an expert. If you need some good places to start, look at FontBureau* and Unger**. And beware small foundries who have one or two fonts they claim are fit for news setting; they pretend -or even believe- they know what it takes to make a real news face, but it's really a dark art. <br> <br>* <a href=\"http://www.fontbureau.com\" target=\"_blank\">http://www.fontbureau.com</a> <br> <br>** <a href=\"http://www.gerardunger.com/\" target=\"_blank\">http://www.gerardunger.com/</a> <br> <br>hhp <br></p>"
