    html: "<p>Both Mrs Eaves and Bodoni are bad as newspaper faces: Mrs Eaves has a really small x-height so it always looks smaller than it is, and Bodoni has a vertical contrast and fine hairlines that are easily lost when printed with a coarse process on coarse paper. Try Matthew Carter's ITC Charter. It would work fantastically on newsprint and it's way underused. Others suggested are great too. <br> <br>I agree with bj about Gotham. It's beautiful and would make a smashing headline face. These two families are all you need. Forget about Futura; it's clich</p>"
