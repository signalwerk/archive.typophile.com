  html: "<p>I'm editing my college's small student newspaper this coming school year, and learned enough from Bringhurst's _The Elements of Typographical Style_, which I just finished, to realize that we badly need a redesign. Right now I'm being daunted by the task of choosing fonts... any input would be appreciated. <br> <br>I'm leaning towards keeping two elements from last year: setting the flag (the paper's name on the top of the front page) in Modern No. 20 and using Futura for the paper's sans-serif. For the text, which will be 9 or maybe 10 pt, I'm toying with Mrs Eaves or (a little angel on my right shoulder says this is a bad idea) Bodoni.  <br> <br>I also thought about just using Bodoni for the headlines. But every damn newspaper I look at seems to be doing just that, or using something close. I also thought Futura Bold looks interesting as a headline font, but it feels like that would be overusing it if we're already going to be using it a lot elsewhere.</p>"
  html_clean: "<p>I'm editing my college's small student newspaper this coming school year, and learned enough from Bringhurst's _The Elements of Typographical Style_, which I just finished, to realize that we badly need a redesign. Right now I'm being daunted by the task of choosing fonts... any input would be appreciated. <br> <br>I'm leaning towards keeping two elements from last year: setting the flag (the paper's name on the top of the front page) in Modern No. 20 and using Futura for the paper's sans-serif. For the text, which will be 9 or maybe 10 pt, I'm toying with Mrs Eaves or (a little angel on my right shoulder says this is a bad idea) Bodoni.  <br> <br>I also thought about just using Bodoni for the headlines. But every damn newspaper I look at seems to be doing just that, or using something close. I also thought Futura Bold looks interesting as a headline font, but it feels like that would be overusing it if we're already going to be using it a lot elsewhere.</p>"
