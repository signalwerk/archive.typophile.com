    html: <p>&gt;Nothing wrong with using Futura in different places for different elements (it comes in different weights right?) but there's plenty wrong with Bodoni or Mrs Eaves for a newspaper text faces. Most Bodonis are made from Bodoni's display sizes - not his text sizes (ITC Bodoni 6 is one of the few exceptions, but it has a very dark colour). This makes most Bodonis unsuitable for the setting of long text. There's also a cultural thing here as well - if you were publishing in France, say, they have a cultural legacy of modern faces used for materials like novels - but in English-speaking countries your average reader expects faces derived more from transitional sources. Since you probably have no budget, I'd suggest picking up Melior. It's oft-neglected, but it's got a nice high x-height (an important consideration as mentioned earlier) and a pleasing, slightly square anatomy.</p>
