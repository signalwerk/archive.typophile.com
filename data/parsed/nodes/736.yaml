    html: <p>Agreeing with Nathan... <br> <br>some common newspaper typefaces include... <br> <br>Cheltenham, Miller, Olympian, Ionic, Corona, Century, Nimrod... <br> <br>there are probably a dozen more. <br> <br>Make sure you read Tim Harrower's book and <br>visit <a href="http://www.ronreason.com" target="_blank">www.ronreason.com</a> + lots of <br>other resources online for newspaper designers. <br> <br>For headlines, Futura might not be versatile enough. <br> <br>Jim Parkinson's Richmond, Hoefler's Knockout are <br>2 versatile families. Maybe even Gotham. <br> <br>You could probably do one-stop shopping at Font Bureau. <br> <br>Of course the text face should go with the display face. <br>I'm sure the FB staff could give you some great suggestions. <br> <br> <br>For the Flag, I would look into doing something custom. <br> <br>I'm sure someone has some better specific suggestions. <br>I've been out of newspapers for a while now. <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0">. <br> <br>good luck. What's the name of the newspaper?... <br> <br>bj <br></p>
