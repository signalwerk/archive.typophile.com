    html: "<p>Thanks for the responses everyone. Sorry I haven't been able to reply sooner. <br> <br>&gt;For the Flag, I would look into doing something custom.  <br>bj: Could you elaborate? As for the name, it's The Tartan, as Gordon has some sort of Scottish root. Last year, the first year we used Modern No. 20 (Times New Roman for the whole damn paper before that), it was typed like this: \"the TARTAN\", which I like better than just plain ol' \"The Tartan\". <br> <br>&gt;Hey Zach, is the paper printed on newsprint? Do you have an existing masthead you must use? If so, please post an image thanks <br>Ly: Yes, newsprint, 11x17. No, no existing masthead we must use. We're not quite that established, and I don't like the masthead from last year. Though if we kept the font (M.N.20) it would give us some continuity. (But if it's a bad idea artistically, it's a bad idea. It works for the Nation magazine though...) <br> <br></p>"
    html_clean: "<p>Thanks for the responses everyone. Sorry I haven't been able to reply sooner. <br> <br>&gt;For the Flag, I would look into doing something custom.  <br>bj: Could you elaborate? As for the name, it's The Tartan, as Gordon has some sort of Scottish root. Last year, the first year we used Modern No. 20 (Times New Roman for the whole damn paper before that), it was typed like this: \"the TARTAN\", which I like better than just plain ol' \"The Tartan\". <br> <br>&gt;Hey Zach, is the paper printed on newsprint? Do you have an existing masthead you must use? If so, please post an image thanks <br>Ly: Yes, newsprint, 11x17. No, no existing masthead we must use. We're not quite that established, and I don't like the masthead from last year. Though if we kept the font (M.N.20) it would give us some continuity. (But if it's a bad idea artistically, it's a bad idea. It works for the Nation magazine though...) <br> <br></p>"
  - id: 5166
    user: 2091
    date: 2003-07-31T20:27:00
