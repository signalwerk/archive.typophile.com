    html: "<p>&gt;1. what is \"small newspaper\"?  <br>David: We'll be printing about 1600 copies, weekly. <br> <br>&gt;2. # of pages?  <br>Probably 12 or 16, though I can't be sure because a lot will be changing from last year. Maybe 20 some weeks. <br> <br>&gt;3. b&amp;w? color?  <br>Black and white. <br> <br>&gt;4. pictures? illustrations? - yes - what kind or style? no - why not?  <br>We have the usual amount of photos. We just got a $1000 digital camera and a $500 high-speed lens, so we may have good quality photos this year. We will also start this year having other artwork -- op-ed and feature illustrations, cartoons. <br> <br>&gt;5. what kind of layout? grid?  <br>Five columns, 2 in. each, on 11x17 newsprint. Margins and gutters TBA. Don't know nothing 'bout grids... I saw something about them in a layout book I've been reading, but I don't know if I'll have the energy to figure them out before school starts. But layout was hell last year so maybe I should. <br> <br>&gt;6. what kind of space - headline, picture, text ?  <br>I don't know what you mean... Nothing is really established. Last year's layout/design was OK but not great, and definitely is not staying. So I really have the liberty to do whatever I want. <br> <br>&gt;7. most important: newspaper is not like magazine.  <br>Oh but I wish it *was* a magazine... But you could probably tell all that from the typeface ideas I had. <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\"> I really don't care for news much at all -- at least the kind of news we usually cover (\"New Dorm Unveiled\"). I wish we could just do arts, editorials, and op-eds. And look like either Harper's or Radar.  <br> <br>To everyone: I will look at all those fonts you people suggested. I think I may even be able to give up Futura, if there's something good. I just really really don't want to use Helvetica or Franklin Gothic... what do you think about Akzidenz Grotesk? Or Interstate? (which someone mentioned that as overused on the Overused thread...) <br> <br>Oh, important note: we do in fact have $ to spend... I'm prepared to spend up to 400-500 if it's necessary.</p>"
