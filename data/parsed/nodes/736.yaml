    html: <p>I'm not one to piss on anyone's parade Zach, but I'd caution you against using either Mrs. Eaves or Bodoni as a copy face. As much as it's overused, I'm afraid my poor eyes would rather see Times again than either of of those at 9 points. There's a thread here about Eaves somewhere (I'll see if I can find the URL) that you might be interested in. [<a href="http://www.typophile.com/forums/messages/30/13202.html?1059028644" target="_blank"> here's the link</a>] <br> <br>And now that I've pissed on your parade, I don't have any suggestions right off. I'm assuming (from past small press work) that your budget is small if not non-existent. What other faces do you have at hand?</p>
