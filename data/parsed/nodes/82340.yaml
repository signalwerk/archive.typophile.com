    html: |-
      <p>These glyphs are very geometric which makes some very unstable and visually uneven. Take /s/ for instance which seems as if top half is bigger than the bottom half.</p>
      <p>Glyphs also seem of having different weight. Look at word /often/ in the second line. /e/ seems much lighter compared to neighbouring /f/ and /t/.</p>
      <p>You will have to change bowl of /a/ because it seems as if someone is pushing it up on the left.</p>
      <p>But otherwise... With some work this monospaced font may be useful even though lately there's tendency for readable shaped monospaced fonts. Imagine developers reading and writing code all day long. It's easier to read all that code when font is much more legible. "Consolas" for instance (which is a modern monospaced font) is a very good example of such font. Non-legible monospaced fonts are otherwise too much strain and tend to make people tired after using them for hours.</p>
