      <p>I little background info is appropriate: I dont imagine developers to use this typeface in their consoles. There are enough good fonts designed for that purpose.</p>
      <p>Then why did I designed it? </p>
      <p>Monospaced typefaces have a certain charm, that makes them appropriate for a number of occasions, such as for headings in any computer and technology-related book or magazine(or user documentation) and also in comment forms such as the one  that I am using right now). </p>
      <p>Thancks for commenting, any other opinions are welcome</p>
