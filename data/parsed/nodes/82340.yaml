      <p>Since you're a technical writer, I'm guessing your plan is to use this font to set code in your books... Since I assume your primary goal in writing such books is to convey the <em>content</em> to readers (as opposed to express your desire to design fonts) what I would ask first is: what do you find lacking in existing monospace fonts you could use?</p>
      <p>BTW, if you like Consolas, also try Inconsolata.  :-)</p>
      <p>hhp</p>
