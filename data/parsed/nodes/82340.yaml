    html: |-
      <p>I'm not convinced you must reduce yourself to only one "trick," but I do agree with Hrant that there is... well I'd say "too much going on."</p>
      <p>Also, the bold really needs some different treatment of how curves join straight stems, because they look pretty clotted. Any one or more of these options might help:<br>
      - optical compensation (thinning the curved strokes a bit before they join)<br>
      - changing the letterforms so they don't usually extend past the join (like at the bottom of a "b" for instance)<br>
      - increasing the angle of the joins<br>
      - reducing the weight of the bold</p>
      <p>Cheers,</p>
      <p>T</p>
