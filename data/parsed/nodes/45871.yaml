      <p>Hello Miss,<br>
      I like the idea of the Titanic poster, the text illustration works well, the rest is not so strong. The body copy  doesn't compliment the the text illustration. How about a slightly celtic influence style to the body copy seeing as the Titanic was built in Belfast, or even referencing the typography of time (which included some amazing hand drawn work). The gold theme you suggest really doesn't add up for me, and the whole layout seems a little cramped, if it's going to b a poster you need to allow more space all around for the mounting. purple and foil block ( as that the nly real way of getting gold on a poster) again doest fit with the theme, I'd look closer at posters of the time and their colour schemes then update your selection.</p>
      <p>It wasn't until you explained what your Maggie Thatcher poster was about until I got it, and I am pretty into my politics.<br>
      The poster doesn't in anyway remind me of Maggie, it's far too subtle (she wasn't anything like subtle). If a poster requires an explanation then it's really failed in it's job. I think  a poster more influenced by it's era, (the 80's) or even influenced by the highly successful Saatchi &amp; Saatchi campaign would be a more appropriate avenue to explore.  </p>
      <p>Looking forward to more of your revisions<br>
      Martin</p>
