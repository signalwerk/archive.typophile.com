      <p>The Margaret Thatcher is definitely not as easily "gettable" as the other two. It seems like a riddle more than a commemoration, and to focus more on the incidental -- the address of the 10 Downing Street -- than the central -- the Iron Lady is prime minister.</p>
      <p>But it's a great project, and I'd love to see more.</p>
