      <p>Zwoelf: As this is an A5 book that folds out into an A1, I had to make a decision on whether they were going to be portrait or landscape. I was reluctant to stick to portrait as they could also be displayed as type posters in their own right.</p>
      <p>Chris G: I need to sort my portholes out. I am thinking of photographic portholes rather than illustrations. The thing with using colour is that my book is meant to be one colour only (goldish colour to celebrate excellence)  and due to that, I have to try and work ways round it as colour plays an important role when trying to convey a message. Otherwise, teh idea of using yellow at the top would have been great.</p>
