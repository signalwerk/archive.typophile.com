    html: |-
      <p>missgiggles, I think your solutions are very good.<br>
      In this resolution the kerning and tracking in the rocket works as it is to me. You might want to widen the words that end with L, P and R a little, to fill the gaps in the right side of the rocket. I also think it might be valuable to look at the leading and make sure it is (optically) consistent.</p>
      <p>Mixing typefaces can be tricky! In designs like this it might be best to stick to one family. I second Tiffany's suggestions about trying to draw the whole thing by hand, and/or finding a 1 that is more pointed (I'm thinking <a class="freelinking external" href="http://www.myfonts.com/fonts/fontbureau/eagle/" rel="nofollow">Eagle</a> or <a class="freelinking external" href="http://www.myfonts.com/fonts/tilde/futura-black/" rel="nofollow">Futura Black</a>). You might get away with just changing the font of the 1, if it is close enough in style to the other font you use.</p>
      <p>You could also try tilting the rocket just a little, to make the design more alive.</p>
      <p>As regards the ship, it might benefit from some tracking and kerning. The word spacing could be decreased somewhat, especially between THE and UN. As an alternative to the Bodoni, you could try using a 1910's art-deco font, such as <a class="freelinking external" href="http://www.myfonts.com/fonts/adobe/bernhard-boldcond/" rel="nofollow">Bernhard</a>.</p>
      <p>As aluminum so wisely wrote: take the critique that you think is valuable, and ignore the rest. :)</p>
