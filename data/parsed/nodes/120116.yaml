      <p>Known as Typo Script, which started out as metal type (p. 402, American Type Founders Specimen Book, 1923) and moved into the phototypesetting era:<br>
      <a href="http://library.rit.edu/cary/typo-script-extended-specimen" title="http://library.rit.edu/cary/typo-script-extended-specimen">http://library.rit.edu/cary/typo-script-extended-specimen</a></p>
      <p>It seems to have been digitized for math typesetting, of all things, but by a hobbyist, not a foundry (not putting down hobbyists, just making a distinction in case licensing or web fonts are needed):<br>
      <a href="http://levien.com/type/myfonts/ofl.html" title="http://levien.com/type/myfonts/ofl.html">http://levien.com/type/myfonts/ofl.html</a></p>
      <p>No one seems to have revived it commercially. These faces are very similar (essentially the same font, just different foundries):</p>
      <p><a href="http://www.myfonts.com/fonts/bitstream/english-111/" title="http://www.myfonts.com/fonts/bitstream/english-111/">http://www.myfonts.com/fonts/bitstream/english-111/</a> [Adagio]<br>
      <a href="http://www.myfonts.com/fonts/linotype/shelley-script/" title="http://www.myfonts.com/fonts/linotype/shelley-script/">http://www.myfonts.com/fonts/linotype/shelley-script/</a> [Pro or Andante]</p>
