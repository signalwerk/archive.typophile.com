      <p>Have you contacted Hallmark at all, to inquire about employment? I don't think you can assume out of hand that they would require you to relocate. Better to make the inquiry; there is a lot of work that is done remotely, since high-quality scans, bezier versions and fonts are all easily transferred digitally. </p>
