  html: |-
    <p>My dream is to be a lettering artist for Hallmark Cards. Unfortunatly that is all that it will be. Just a dream. My family does not want to relocate to Kansas and I am not even sure if Hallmark would even hire me. So I guess I will have to go after more realistic goals which is to become a fulltime lettering artist and Typeface designer. I designed this new typeface called “Enchanted” which is my tip of the hat to all of the lettering artists past and present at Hallmark. I sent it out to FontBros, myfonts.com, Veer and also Fonts.com. Hopefully Fontshop will pick it up also. I talked with Stuart Sandler and he should have it maybe up by tomorrow at FontBros.com :) It has seven alternates also. The word “Thanksgiving” in the samples shows the alternate k and g.</p>
    <p>Happy Holidays</p>
    <p>-Charles Borges de Oliveira</p>
    <p><a href="http://www.borgeslettering.com" title="www.borgeslettering.com">www.borgeslettering.com</a></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Enchanted-Christmas-Promo_4638.jpg"></div><div class="imageWrap"><img src="http://typophile.com/files/Enchanted Samples 2_4274.jpg"></div><p></p>
