      <p>Svenni: I wrote to the carver Teucer Wilson to ask him your question. </p>
      <p>His reply: he designs his own digital fonts, but they are not for sale -- yet! In the meantime, he suggests that you check out...</p>
      <p>Everything by Michael Harvey<br>
      <a href="http://www.linotype.com/search/michael%20harvey#b99d745f909bc591c9e01c5ac9b1fde6" title="http://www.linotype.com/search/michael%20harvey#b99d745f909bc591c9e01c5ac9b1fde6">http://www.linotype.com/search/michael%20harvey#b99d745f909bc591c9e01c5a...</a><br>
       (I'd say to check out Strayhorn in particular.)</p>
      <p>Everything by Hermann Zapf (as suggested above)<br>
      <a href="http://www.linotype.com/645/hermannzapf.html" title="http://www.linotype.com/645/hermannzapf.html">http://www.linotype.com/645/hermannzapf.html</a></p>
      <p>He said, "I also like fonts like Bodoni Roma, Baskerville, Lithos, Baker Signet, Black Swan, Clairvaux, Torquemada, Edwardian script, Espresso, Rusticana Roman... Trajan, Playbill... I could go on. I guess it’s the design and what you do with the letters that makes them interesting, right? Also I tend to refine and change when I get to drawing on stone, and carving."</p>
