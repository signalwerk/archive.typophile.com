    <p>Hi.</p>
    <p>I'm looking for a typeface that is similar to this lettering I found, done by Teucer Wilson.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/castironlettering_4080.jpg"></div><p></p>
    <p>Something with that broad nib contrast, flairing stems and hand-made feel, yet stability. It's for a tombstone, for my friend's brother.</p>
    <p><a class="freelinking external" href="http://www.teucerwilson.co.uk/content/images/castironlettering.jpg" rel="nofollow">http://www.teucerwilson.co.uk/content/images/castironlettering.jpg</a></p>
    <p>Found here:</p>
    <p><a class="freelinking external" href="http://www.teucerwilson.co.uk/portfolio/othermaterials/" rel="nofollow">http://www.teucerwilson.co.uk/portfolio/othermaterials/</a></p>
    <p>Any suggestions greatly appreciated.</p>
