    html: "<p>Spacing: I think it's slightly loose. <br> <br>M: wider? Hey, the smallcaps one is different! And to me better. <br> <br>e: I like the angled bar one. <br> <br>g: I think the open one doesn't work as it stands, but an open bottom might be a great opportunity to try to make the angled join less steep, matching the \"a\"/\"e\". The different angle in the \"g\" has always been the biggest thing that has bugged me about Pill. <br> <br>k: definitely the straight-legged one. <br> <br>s: needs work. <br> <br>y: the curved tail one. <br> <br>Pound: beak out of character. <br> <br>I'd put more staightness in the Pilcrow and Section. <br> <br>Your accents seem out of character - more rigid please! Same with the Cedilla. <br> <br>The \"OE\" is a \"CE\". <br> <br>The Bold: I think it needs some modeling to avoid dark spots. But be very careful not to soften the character. <br> <br>Almost there! <br> <br>hhp <br></p>"
    html_clean: "<p>Spacing: I think it's slightly loose. <br> <br>M: wider? Hey, the smallcaps one is different! And to me better. <br> <br>e: I like the angled bar one. <br> <br>g: I think the open one doesn't work as it stands, but an open bottom might be a great opportunity to try to make the angled join less steep, matching the \"a\"/\"e\". The different angle in the \"g\" has always been the biggest thing that has bugged me about Pill. <br> <br>k: definitely the straight-legged one. <br> <br>s: needs work. <br> <br>y: the curved tail one. <br> <br>Pound: beak out of character. <br> <br>I'd put more staightness in the Pilcrow and Section. <br> <br>Your accents seem out of character - more rigid please! Same with the Cedilla. <br> <br>The \"OE\" is a \"CE\". <br> <br>The Bold: I think it needs some modeling to avoid dark spots. But be very careful not to soften the character. <br> <br>Almost there! <br> <br>hhp <br></p>"
