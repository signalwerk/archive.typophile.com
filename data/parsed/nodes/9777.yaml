    html: <p>Pill is original without looking odd, which is an achievement, especially in a sans serif.  <br> <br>Somehow the original higher middle on the M looks more consistent with your face, but is a bit awkward in your original. Johnston Underground, which looks wider (as Hrant suggests) and ends further off the baseline, has a nice balance.  <a href="http://www.myfonts.com/fonts/p22/underground/" target="_blank">http://www.myfonts.com/fonts/p22/underground/</a>  <br> <br>On the S and s, Palatino's unusual S's (also in the italic) might give you ideas on how to keep your 'pill' arch at the top and bottom, and make the connecting stroke stronger.    </p>
    html_clean: <p>Pill is original without looking odd, which is an achievement, especially in a sans serif.  <br> <br>Somehow the original higher middle on the M looks more consistent with your face, but is a bit awkward in your original. Johnston Underground, which looks wider (as Hrant suggests) and ends further off the baseline, has a nice balance.  <a href="http://www.myfonts.com/fonts/p22/underground/" target="_blank" class="link-external">http://www.myfonts.com/fonts/p22/underground/</a>  <br> <br>On the S and s, Palatino's unusual S's (also in the italic) might give you ideas on how to keep your 'pill' arch at the top and bottom, and make the connecting stroke stronger.    </p>
