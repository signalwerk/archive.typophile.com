    html: "<p>HI Christian, <br> <br>Nicely done on the extra light. So tricky to balance the modulation! <br> <br>Your obliques look pretty good to me. The following picture illustrates the major distortions that happen when mathematically skewing a font. All letters are thinned vertically as you mentioned (and fixed). The letters that get most distorted are the round ones. You may know all this, but I thought I'd post it anyways for typophile edification: <br> <br><img src=\"http://www.typophile.com/forums/messages/29/28240.gif\" alt=\"\"> <br> <br>1. The verticals become more thin as noted above <br>2. The bottom right and upper left (if applicable) thin out <br>3. The upper right and bottom left (if applicable) thicken up <br>4. The upper right and bottom left contract (the curve gets tighter) <br>5. The bottom right and upper left expand (the curve opens up) <br> <br>Also note generally that the distortion gets bigger and the glyph more narrow as the angle increases. In my (limited) experience the tricky and time consuming part is fixing 4 &amp; 5 (usally 2 &amp; 3 at the same time). I was given this tip by Ed Benguiat:  <br>The obliqued curve should look pretty close to what it would be if you oblique it half as much. In other words, if you oblique it 20%, make the curves emulate the 10% version. I find pasting the 10% version into the mask layer a handy guide. You still have to fix the modulation problem, but it's a good start. <br> <br>Cheers, <br>Randy</p>"
    html_clean: "<p>HI Christian, <br> <br>Nicely done on the extra light. So tricky to balance the modulation! <br> <br>Your obliques look pretty good to me. The following picture illustrates the major distortions that happen when mathematically skewing a font. All letters are thinned vertically as you mentioned (and fixed). The letters that get most distorted are the round ones. You may know all this, but I thought I'd post it anyways for typophile edification: <br> <br><img src=\"http://www.typophile.com/forums/messages/29/28240.gif\" alt=\"\"> <br> <br>1. The verticals become more thin as noted above <br>2. The bottom right and upper left (if applicable) thin out <br>3. The upper right and bottom left (if applicable) thicken up <br>4. The upper right and bottom left contract (the curve gets tighter) <br>5. The bottom right and upper left expand (the curve opens up) <br> <br>Also note generally that the distortion gets bigger and the glyph more narrow as the angle increases. In my (limited) experience the tricky and time consuming part is fixing 4 &amp; 5 (usally 2 &amp; 3 at the same time). I was given this tip by Ed Benguiat:  <br>The obliqued curve should look pretty close to what it would be if you oblique it half as much. In other words, if you oblique it 20%, make the curves emulate the 10% version. I find pasting the 10% version into the mask layer a handy guide. You still have to fix the modulation problem, but it's a good start. <br> <br>Cheers, <br>Randy</p>"
