      <p>A new 's' shape occurred to me today. I'm trying to decide if I should include it as an alternate, or make it the default. It is more extreme, so in some ways makes the font less versitile. On the other hand, it makes the font more interesting, and, I think, justifies the 'a' and the 'g'. Of course, the old S's would be included in the "Stylistic Alternates" OpenType feature. What do you all think? Does it make the font less useful; does it make it more interesting, or both? <br> <br></p>
