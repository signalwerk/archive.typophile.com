    html: <p>Another <a href="http://betatype.com/pill/pill_sample_2.pdf">pdf</a>. I added small caps and a ton of punctuation to the lineal skeleton. Some of the punctuation is kind of rough, and I haven't done any kerning. Next step will be polishing the italic, then adding weight. <br> <br>I threw in some OpenType features (small caps and a couple of ligatures). It's not as tricky as I thought it would be. It really irks me that it only works in InDesign, and even their implementation is pretty weak.</p>
