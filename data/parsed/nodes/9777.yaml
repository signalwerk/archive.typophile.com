  - id: 62395
    user: 1250
    date: 2003-12-30T23:37:00
    date_raw: 30 Dec 2003 — 11:37pm
    votes: null
    html: "<p>Four weights is much better than three, if they're <i>paired</i> right. James Montalbano once explained it (on Typophile) very sensically - assuming I remember it right: the Regular should be weighted for text, the Bold for emphasis in a body of Regular; the Light should be an alternate weight for text; and the Semi (or Demi) an emphasis weight for the Light. All this means that you don't want them spaced mathematically, but instead according to function. <br> <br>Also, in practice the Semi can serve very well for text, except it doesn't have a \"bold\" (in a set of 4). <br> <br>hhp <br></p>"
    html_clean: "<p>Four weights is much better than three, if they're <i>paired</i> right. James Montalbano once explained it (on Typophile) very sensically - assuming I remember it right: the Regular should be weighted for text, the Bold for emphasis in a body of Regular; the Light should be an alternate weight for text; and the Semi (or Demi) an emphasis weight for the Light. All this means that you don't want them spaced mathematically, but instead according to function. <br> <br>Also, in practice the Semi can serve very well for text, except it doesn't have a \"bold\" (in a set of 4). <br> <br>hhp <br></p>"
