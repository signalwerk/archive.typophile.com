  - id: 62393
    user: 1250
    date: 2003-12-30T19:03:00
    date_raw: 30 Dec 2003 — 7:03pm
    votes: null
    html: <p>Well, I don't know what's already been kerned in there, but you have to account for linguistics, like how often what ends up on the right side of the "r"; that determines your base spacing - and then comes kerning. Plus you have to decide how bad touching is - I think people who have kerning off don't mind touching that much. Also, in a sans face with such a strong-beaked "r" you're in a position of relying more on kerning to really make things click. <br> <br>-- <br> <br>That "A" can be seen in the December 29 PDF, in the captions for the side stuff on page 1. <br> <br>hhp <br></p>
    html_clean: <p>Well, I don't know what's already been kerned in there, but you have to account for linguistics, like how often what ends up on the right side of the "r"; that determines your base spacing - and then comes kerning. Plus you have to decide how bad touching is - I think people who have kerning off don't mind touching that much. Also, in a sans face with such a strong-beaked "r" you're in a position of relying more on kerning to really make things click. <br> <br>-- <br> <br>That "A" can be seen in the December 29 PDF, in the captions for the side stuff on page 1. <br> <br>hhp <br></p>
