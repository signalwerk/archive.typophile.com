    html: <p>Tricks! More tricks! Just kidding. I don't like tricks for  <br>tricks' sake. I didn't want a simple oblique, so I added  <br>some curves to make it feel more <i>italic</i>, for lack of a  <br>better word. Here <a href="http://betatype.com/pill/pill_italics_sample.swf">[swf.7k]</a> is what I had previously <br>done on the italics. The <b>y</b> needs some work, of course,  <br>and some of the other forms will change, possibly with  <br>some alternates.</p>
