    date: 2003-10-20T18:24:00
    date_raw: 20 Oct 2003 — 6:24pm
    votes: null
    html: <p>Expanding on Joseph's comments, it the quirkiness in those few characters which really sets Pill Gothic apart from being just another DIN (JAD?) I especially like how you've modified the cross-stroke of the e in the ae ligature to slope into meeting the one from the a. Perhaps the standard e should use the same type of diagonal. Without going overboard, there may be a few other select characters that could also utilize that diagonal stroke - the tail of the y and the tail of the Q, for example. <br> <br>I would agree the M would fit in a bit better dropped to the baseline, and in terms colour across the uppercase, I would consider narrowing the width of the U - it looks particularly out of place the all-caps heading for your regular weight PDF. <br> <br>I really like how this family is progressing.</p>
    html_clean: <p>Expanding on Joseph's comments, it the quirkiness in those few characters which really sets Pill Gothic apart from being just another DIN (JAD?) I especially like how you've modified the cross-stroke of the e in the ae ligature to slope into meeting the one from the a. Perhaps the standard e should use the same type of diagonal. Without going overboard, there may be a few other select characters that could also utilize that diagonal stroke - the tail of the y and the tail of the Q, for example. <br> <br>I would agree the M would fit in a bit better dropped to the baseline, and in terms colour across the uppercase, I would consider narrowing the width of the U - it looks particularly out of place the all-caps heading for your regular weight PDF. <br> <br>I really like how this family is progressing.</p>
