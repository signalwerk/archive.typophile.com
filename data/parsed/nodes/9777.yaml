    date_raw: 21 Oct 2003 — 11:56pm
    votes: null
    html: <p>Here is a <a href="http://betatype.com/pill/pill_sample_4.pdf">pdf</a> of nearly finalized spacing (the other <br>one was InDesign optical) without kerning. I also included <br>the bold (so far, it needs some tweeks--any suggestions  <br>are appreciated) and the accented characters. <br> <br>I also included some alternate characters. To Grant's  <br>comments about the <b>e</b>, the original <b>e</b> had an angled  <br>cross-bar, but I couldn't decide if I liked the horizontal  <br>cross bar better. I have since reinstated the angled <b>e</b>. <br> <br>As for the DIN stuff, if Pill is really a useful alternative, <br>I am flattered. They do have a similar feel, but Pill is  <br>much 'trickier'. Whether that's a good thing or bad I  <br>guess depends on how you use it. I would like to add  <br>some more alternate characters to tone Pill down or  <br>dress it up.</p>
    html_clean: <p>Here is a <a href="http://betatype.com/pill/pill_sample_4.pdf" class="link-external">pdf</a> of nearly finalized spacing (the other <br>one was InDesign optical) without kerning. I also included <br>the bold (so far, it needs some tweeks--any suggestions  <br>are appreciated) and the accented characters. <br> <br>I also included some alternate characters. To Grant's  <br>comments about the <b>e</b>, the original <b>e</b> had an angled  <br>cross-bar, but I couldn't decide if I liked the horizontal  <br>cross bar better. I have since reinstated the angled <b>e</b>. <br> <br>As for the DIN stuff, if Pill is really a useful alternative, <br>I am flattered. They do have a similar feel, but Pill is  <br>much 'trickier'. Whether that's a good thing or bad I  <br>guess depends on how you use it. I would like to add  <br>some more alternate characters to tone Pill down or  <br>dress it up.</p>
  - id: 62381
    user: 1250
    date: 2003-10-22T09:40:00
