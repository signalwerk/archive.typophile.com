    <p>6 States Hitting Residents With Big Tax Hikes</p>
    <p>	<a href="http://washedit.com/wp-content/uploads/2009/06/tax.jpg"><br>
    	</a><br>
    	State legislators faced with mammoth budget gaps and sharply lower revenue<br>
    	are looking to residents to bail them out.<br>
    	Right now, at least 47 states are facing significant shortfalls in their<br>
    	2009 and/or 2010 budgets, according to the Center on Budget and Policy<br>
    	Priorities, a think tank in Washington, D.C. And many of those states are<br>
    	looking to tax hikes to help fill the gaps.<br>
    	“Pretty much everyone is doing poorly,” says Kim Rueben, senior research<br>
    	associate at the Tax Policy Center. “It’s just a question of who’s hurting<br>
    	more than others.”<br>
    	The top honor goes to California, which is projecting that it will fall<br>
    	about $25 billion short come fiscal 2010. Taking second place is New York<br>
    	with a projected $17.6 billion deficit for fiscal 2010, according to the<br>
    	National Conference of State Legislatures, a bipartisan policy research<br>
    	organization in Washington, D.C.<br>
    	How can these states miss the mark so badly? The recession has sapped the<br>
    	two major sources of state revenue: income taxes (thanks to rising<br>
    	unemployment, fewer people are getting paid) and sales taxes (quite simply,<br>
    	consumers are spending less.) “Those two things together really, really lead<br>
    	to a high loss of tax revenues, far in excess of loss of income,” says<br>
    	Michael Hicks, director of Ball State University’s Center for Business and<br>
    	Economic Research.<br>
    	Even though raising taxes are typically a last resort, many states have<br>
    	no choice but to do so. And, in some, lawmakers are leaving no stone<br>
    	unturned when it comes to finding items or services to tax. New York, for<br>
    	instance, has raised taxes on tobacco, wine and limo services. Meanwhile,<br>
    	Massachusetts is proposing a tax on satellite television service and Georgia<br>
    	lawmakers are proposing a “pole tax” that would charge gentlemen’s club<br>
    	patrons $5 at the door.<br>
    	To figure out which states are inflicting the biggest tax hikes on<br>
    	residents, SmartMoney pored over reports from tax research groups and<br>
    	contacted state budget offices. We looked at state budget deficits tracked<br>
    	by the National Conference of State Legislatures and current sales tax rate<br>
    	data from the Federation of Tax Administrators, a group that provides<br>
    	services to state tax authorities. Finally, we turned to the Tax Foundation<br>
    	— a nonpartisan tax research group — for figures on tax burden, the average<br>
    	percentage of each state’s residents’ income that is paid in state and local<br>
    	taxes (the figures we use are for 2008).<br>
    	Here are six states where residents should prepare to pay up.<br>
    	<a href="http://online.wsj.com/article/SB124517776696719927.html"><br>
    	</a><br>
    	Ads –&gt; <a href="http://www.classicfloorsbonita.com/">Bonita Flooring</a><br>
    	| <a href="http://www.byteshop.com/">Naples Computers</a> |<br>
    	<a href="http://bonitaspringscondosforsale.com/">Bonita Condos </a><br>
    	California: Diminishing This Huge Deficit May Just Be a Dream<br>
    	State deficit estimate for fiscal 2010: $24.7 billion<br>
    	Percent of general fund budget: 22.3%<br>
    	State and local tax burden: 10.5%; Rank: 6<br>
    	California is facing the biggest budget deficit in the nation, yet<br>
    	voters’ willingness to chip in is starting to wane. Last month, they voted<br>
    	down five ballot measures that included sales and income tax increases. Who<br>
    	could blame them? At 11%, California has one of the worst unemployment rates<br>
    	in the country, the housing market has been decimated, and the state already<br>
    	raised taxes on sales by 1% to 8.25% and income by 0.25% (both of which<br>
    	expire in 2011). Gov. Arnold Schwarzenegger’s latest budget plan includes<br>
    	steep spending cuts across the government and cutbacks in social services.<br>
    	In a testament to California’s grim predicament, one assemblyman’s<br>
    	proposal to legalize marijuana for personal use and allow counties to tax it<br>
    	is gaining public support. It’s one of the “wacky things you might be able<br>
    	to get away with now,” says Rueben.<br>
    	New York: If It’s Bad for You, It Will Be Taxed<br>
    	State deficit estimate for fiscal 2010: $17.6 billion<br>
    	Percent of general fund budget: 31.9%<br>
    	State and local tax burden: 11.7%; Rank: 2<br>
    	New York State Gov. David Paterson may have been unsuccessful in levying<br>
    	an 18% tax on soda and other sugary drinks in the name of combating obesity,<br>
    	but he’s had a hand in raising taxes on plenty of other “sinful” items,<br>
    	including tobacco (up to 46% from 37%) and wine (up 58% per gallon, or about<br>
    	two cents more per bottle).<br>
    	For those living in New York, all those tax hikes can really add up.<br>
    	Second only to New Jersey, New Yorkers bear the second-highest tax burden<br>
    	thanks to a high income-tax rate of 7.85% (for those earning more than<br>
    	$200,000). And property and gas taxes are among the highest in the nation,<br>
    	according to the Tax Foundation. Nevertheless, shoppers can rejoice: The<br>
    	sales tax here remains relatively low at just 4%.<br>
    	Florida: Driving and Smoking Will Cost You<br>
    	State deficit estimate for fiscal 2010: $6 billion<br>
    	Percent of general fund budget: 27%<br>
    	State and local tax burden: 7.4%; Rank: 47<br>
    	Florida passed its budget in May with a not-so-pleasant surprise for<br>
    	smokers: a $1-per-pack hike (the first such increase in 19 years). Motorists<br>
    	also got hit with higher fees to renew a license or register a vehicle. It<br>
    	could have been worse, though. Senate lawmakers had proposed eliminating the<br>
    	sales tax exemption on items like bottled water and tickets to sporting<br>
    	events, both of which didn’t make the cut.<br>
    	Still, residents here aren’t feeling as much tax pain as some of their<br>
    	peers in other states. Overall, Florida’s tax burden is the third-lowest in<br>
    	the nation and it’s one of eight states that imposes no individual income<br>
    	tax, according to the Tax Foundation. But those perks may be outweighed by<br>
    	the rest of Florida’s economic situation. Home values are among the nation’s<br>
    	hardest hit and the state’s $6 billion budget deficit could mean more tax<br>
    	hikes are on the horizon.<br>
    	Massachusetts: Shoppers and Couch Potatoes, Prepare to Pay Up<br>
    	State deficit estimate for fiscal 2010: $3 billion<br>
    	Percent of general fund budget: 11.2%<br>
    	State and local tax burden: 9.5%; Rank: 23<br>
    	Just when Massachusetts was starting to shake its “Taxachusetts” nickname<br>
    	(it’s ranked a middle-of-the-road 23rd in the Tax Foundation’s tax burden<br>
    	assessment), the state is preparing to hike taxes on everything from alcohol<br>
    	to satellite TV.<br>
    	The most hard-hitting for residents is a proposed increase in the sales<br>
    	tax to 6.25% from 5%. Both the House and Senate approved the measure and<br>
    	it’s looking likely the increase will pass by the July 1 deadline, says Noah<br>
    	Berger, executive director of the Massachusetts Budget and Policy Center, an<br>
    	independent research group. Satellite TV subscribers may also get hit. The<br>
    	state is proposing a 5% sales tax on satellite services. Providers, of<br>
    	course, are fighting the tax.<br>
    	Arizona: Proposed Sales-Tax Hike Could Hurt Already-Strapped Residents<br>
    	State deficit estimate for fiscal 2010: $3 billion<br>
    	Percent of general fund budget: 28.2%<br>
    	State and local tax burden: 8.5%; Rank: 41<br>
    	The recession has thumped Arizona harder than most other states, says Lee<br>
    	McPheters, research professor of economics at Arizona State University’s W.P.<br>
    	Carey business school. The housing slump is partially to blame: During the<br>
    	boom, construction accounted for at least a quarter of new jobs created.<br>
    	Since home prices have fallen 43% from their peak, the construction industry<br>
    	has lost tens of thousands of jobs, says McPheters. Arizona’s unemployment<br>
    	rate in April was 7.7%, shy of the 8.9% national average.<br>
    	If Gov. Janice Brewer gets her way, residents will pay for the state’s<br>
    	problems by shelling out an extra 1% at the cash register. The proposed<br>
    	sales-tax hike, which would bring the rate to 6.6%, was omitted from the<br>
    	budget the legislature passed this month, but the governor may veto the<br>
    	budget until it’s put back in. (She could also place it on a November<br>
    	special election ballot.)<br>
    	Nevada: What Happens in Vegas Is Going to Cost You More<br>
    	State deficit estimate for fiscal 2010: $1.2 billion<br>
    	Percent of general fund budget: 32%<br>
    	State and local tax burden: 6.6%; Rank: 49<br>
    	Nevada’s freewheeling, low-tax past is coming back to haunt it like a bad<br>
    	hangover. The state levies no personal income tax and imposes some of the<br>
    	lowest taxes on businesses in the nation, says Bert Waisanen, a fiscal<br>
    	analyst at the National Conference of State Legislatures.<br>
    	Nevada used to be able to afford being so generous with its residents.<br>
    	Revenue from tourism and gambling supported the state just fine. But now, as<br>
    	consumers would rather put their coins in a bank account than a slot<br>
    	machine, that revenue source is drying up. In fact, the state boasts the<br>
    	dubious honor of having the largest deficit in the country as a percentage<br>
    	of its budget – 32%. It’s hiked the sales tax by 0.35% to 6.85% and taxes on<br>
    	hotel rooms are up 3%. It’s even gambling with its business-friendly climate<br>
    	by raising taxes on businesses.</p>
