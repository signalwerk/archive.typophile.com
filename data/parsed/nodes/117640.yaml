    html: |-
      <p>If the font needs to "follow curves well", doesn't this mean it will be used in generating map images, rather than used in a web font?</p>
      <p>Of course, there are some presentation techniques used on the Web that do allow text to be laid out in curves - PostScript, and hence one's map could be an Adobe .PDF file.</p>
      <p>Ah, I see I'm out of date. Text in Google Maps sometimes follows curves.</p>
