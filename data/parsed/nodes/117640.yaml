      <p><a href="http://www.linotype.com/2276/cisalpin.html" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Cisalpin: The ideal typeface for cartography</a> </p>
      <p>The Swiss designer/typographer Felix Arnold designed Cisalpin during the late 1990s, after he had challenged himself to create a contemporary typeface that could be used for cartographic uses. Arnold came to the subject of cartographic typefaces after analyzing many maps and atlases, and discovering that there was no standard typeface for these types of documents.</p>
