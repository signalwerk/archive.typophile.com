    html: |-
      <p>I am a cartographer with more than 22 years of experience. I had few bad experiences with fancy fonts and my advise is to use for road labels extremely readable condensed fonts like Arial Narrow.<br>
      If you are ready to buy one, here you are a commercial font designed for cartographers: <a href="http://www.linotype.com/2276/cisalpin.html" title="http://www.linotype.com/2276/cisalpin.html">http://www.linotype.com/2276/cisalpin.html</a><br>
      Andras</p>
  - id: 582327
