      <p>Cisalpin, a sans serif,  would seem to win the prize for clarity in messy situations and at small sizes.<br>
      There are serif cartographic typefaces that have variations for specific information, e.g. rivers as opposed to cities. For example Roemisch <a href="http://www.myfonts.com/fonts/linotype/roemisch/" title="http://www.myfonts.com/fonts/linotype/roemisch/">http://www.myfonts.com/fonts/linotype/roemisch/</a> and Kursivschrift <a href="http://www.myfonts.com/fonts/linotype/kursivschrift/" title="http://www.myfonts.com/fonts/linotype/kursivschrift/">http://www.myfonts.com/fonts/linotype/kursivschrift/</a><br>
      Don</p>
