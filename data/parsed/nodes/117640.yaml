    votes: null
    html: <p>Would you consider commissioning something new? A map typeface to be used online at small sizes have very specific requirements. You need large apertures, big x-height, simplified features, clear contrast between various pieces of information and possibly condensed styles, maybe a set of symbols, and all of it has to be hinted to render clearly across all modern browsers.</p>
