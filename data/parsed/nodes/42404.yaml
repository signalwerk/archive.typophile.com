  html: |-
    <p>Hi Everyone, I am looking for suggestions for a font that I can use in designing a logo for a sports bar.  I am trying not to use any actual sports reference, ie. a baseball or basketball.I wanted to get it across with a really great font.  Any type of sports theme is fine.<br>
    Any suggestions are welcome, I have been searching for hours and have not come up with a great one.</p>
    <p>Thanks!</p>
