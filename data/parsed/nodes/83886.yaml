    <p><a href="http://bit.ly/oRmUT2" title="http://bit.ly/oRmUT2">http://bit.ly/oRmUT2</a> </p>
    <p>From their website (and no, I'm not an affiliate, just a fan):</p>
    <p>Playtype™<br>
    Concept Store</p>
    <p>The Playtype concept store was launched in conjunction with the revamp and redesign of Playtype.com. Located in Copenhagen’s Vesterbro, the store is the physical manifestation of the online shop – and then some. Created as a place to further our typographic practice, the store provides a street level entry to typography - it is a place to share our passion with the general public and a place where our designers can experiment with their craft outside of the studio. Aside from type, the store continuously features new editions and products created by e-Types alongside friends and colleagues in the design and art world.</p>
    <p>Playtype is located at Værnedamsvej 6,<br>
    Copenhagen and will be open for exactly<br>
    one year — from December 1st 2010 to<br>
    December 1st 2011</p>
