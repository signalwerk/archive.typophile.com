    <p>Can someone please read the Summary and Portfolio sections below and comment if they make any sense at all? This is for my friend's resume, she will be looking for freelance/contract font development projects.</p>
    <p>(Hopefully I'm going to catch some attention before everyone sits down in a Dublin pub!)</p>
    <p><strong>Summary</strong><br>
    15 years of experience in font production. Implemented all stages of font production from digitization to font file generation.<br>
    Produced bitmap, PostScript Type 1, TrueType, OpenType fonts. Optimized fonts for b&amp;w, grayscale and ClearType display anti-aliasing environments. Worked on extended Latin, Cyrillic and Arabic scripts. Proficient Fontlab user.</p>
    <p><strong>Portfolio</strong><br>
    Over 3000 fonts processed, major projects include:</p>
    <p><strong>1) Bespoke handwriting fonts production</strong></p>
    <p>Designed development process and supervised a team of 6 font engineers. Over 1000 individual fonts were produced over the course of 5 years. In addition to bespoke non-public fonts, several commercial fonts were produced as a part of this project: <em>Birch, Epsilon, Irina, Kremlin, Nina, Tatiana</em>.</p>
    <p>For these fonts I developed Latin script glyphs based on original handwriting samples, Cyrillic glyphs were further designed by Tagir Safaev. Samples of these fonts can be found at: <a href="http://www.paratype.com/pstore/" title="http://www.paratype.com/pstore/">http://www.paratype.com/pstore/</a></p>
    <p><strong>2) Manual TrueType hinting commissioned by major foundries </strong></p>
    <li><em>World best known sans-serif typeface</em> (designer John Hudson of Tiro, commissioned by a major foundry)<br>
    Manual hinting of Greek, Cyrillic and Hebrew scripts for year 2009 re-issuance of famous sans-serif typeface originally designed in 1957.  (Due to an NDA, full details and samples are available on request.)
    </li><li><em>Well-known grotesque typeface</em> (commissioned by a major foundry)<br>
    Manual hinting for a well-known grotesque typeface, originally released in 1898.<br>
    (Due to an NDA, full details and samples are available on request.)
    </li><li><em>SBL BibLit</em> (designer John Hudson of Tiro, commissioned by Society of Biblical Literature)<br>
    Parts of SBL BibLit have been released as SBL Hebrew: <a href="http://www.sbl-site.org/educational/biblicalfonts.aspx" title="http://www.sbl-site.org/educational/biblicalfonts.aspx">http://www.sbl-site.org/educational/biblicalfonts.aspx</a>
    <p><strong>3) PostScript and TrueType hinting of Russia’s national pan-Cyrillic font.</strong></p>
    <p><em>PT Sans</em> family (designed by ParaType, commissioned by the Government of Russian Federation)</p>
    <p>True Type hinting performed on PT Sans font family, that was specifically developed for excellent on-screen presentation. Over 700 glyphs manually hinted for 48 sizes, for b&amp;w, grayscale and ClearType modes. Full fonts are available at <a href="http://www.paratype.com/public/" title="http://www.paratype.com/public/">http://www.paratype.com/public/</a></p>
    <p>Additionally, PostScript hinting performed on <em>PT Sans Pro</em>, a commercial release consisting of 32 styles. Font samples are available at <a href="http://www.paratype.com/pstore/fonts/PT-Sans-Pro.htm" title="http://www.paratype.com/pstore/fonts/PT-Sans-Pro.htm">http://www.paratype.com/pstore/fonts/PT-Sans-Pro.htm</a></p>
    <p><strong>4) PostScript, TrueType and OpenType font development</strong></p>
    <p>Produced fonts designed by Paratype, leading Russian font foundry.<br>
    Worked on Latin, Cyrillic, Hebrew and Arabic scripts.</p>
    <p>Over 45 typefaces produced, including top sellers of Paratype catalog:<br>
    <em>Bachenas, Bannikov, BaseNine, ITC New Baskerville, Bazhanov, Caslon, DIN Condensed, ITC Franklin Gothic, FreeSet, Futura PT, Gothic725, Harry Plotter, Haverj, Herold, Hortensia, Humanist 531, ITC Eras, ITC Garamond, ITC Officina Sans, ITC Officina Serif, Joker, Karolla, Ladoga, Lazurski, Literaturnaya, Mason Serif, Mason Sans, Meta, Neva, Pragmatica, News Gothic, Newton, Octava, Parangon, PT Sans, QuadratGrotesk, Quartet, Raleigh, Reforma, Rodchenko, Rossika, Stroganov, Swift, Zagolovochnaya</em><br>
    Samples of these fonts are available at <a href="http://www.paratype.com/pstore/" title="http://www.paratype.com/pstore/">http://www.paratype.com/pstore/</a></p>
    </li>
