    html: <p>It could be an "off" version of Dom. I have an old Lettergraphics catalog that shows a face called "Dom Bold" that looks very much like this (edges smoothed, lacking the hand-brushed quality), and doesn't match the typical digital version. It's the same proportions as the original, but stretched horizontally would be a close match, I think.</p>
