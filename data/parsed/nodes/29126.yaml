  html: |-
    <p>Hi all,</p>
    <p>I’ve recently taken on the job of redesigning a reputable student newspaper (print) here in the UK and am looking for a Impact-like sans-serif face to use as a foundation for the construction of the paper (to be used for article titles etc.) </p>
    <p>The audience is university students from first to third year, typically 19-25 year olds. The stress in the brief is on accentuating the ’hard news’ aspect of the paper, but with a contemporary designer’s touch (not my words). Something with visual impact, but without being too clunky. </p>
    <p>Absolutely any suggestions would be greatly appreciated! Do ask if you need any more information, too.</p>
    <p>Thanks,<br>
    Jez.</p>
