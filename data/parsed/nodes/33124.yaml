      <p>Hey Sandy, I think those respondents here who are turning the question around and saying 'why? what are you using it for?' deserve an answer... </p>
      <p>I say this because typeface choice is contextual to the job in hand – and that includes the differences between one Garamond and another.</p>
      <p>Much of the discussion here focuses on letterpress book production; this is what the Garamonds were traditionally used for, so fair enough, I see the Jannon-based ATF and Monotype Garamonds rightfully praised for their appearance in text setting, but if (for example) you are designing a big poster about cheesy 1980s corporatism, then the ITC Garamond (hideous tho' it is), might be entirely appropriate.</p>
      <p>Myself, I would tend to use the Sabon and the Stempel Garamond in preference to anything else, assuming the job <em> had</em> to be set in a Garamond of some kind, but (shameless plug) there is more information about the many versions <a href="http://www.100types.com/100types.com.4garamond.html" rel="nofollow">here...</a></p>
      <p>To add to what Addison Hall's just said, the 'Poliphilus' (facsimile rendering) of the Garamond scene would have to be Paul Shaw's <a href="http://www.letterspace.com/LETTERPERFECT_FONTS/old_claude.htm" rel="nofollow"> Old Claude LP.</a></p>
