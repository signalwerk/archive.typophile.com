      <p>Not too long ago I read a novel in Granjon--must be digital--and found it very pleasant. It had a rhythm to the characters that was lovely. </p>
      <p>Adobe Garamond is a triumph, and probably Premier is even better, but I haven't got it. </p>
      <p>&gt;letterpress printing is the inks</p>
      <p>I that brings me back to one of my pet theories: that letter press ink was blacker on the page. This was rejected by a knowledgeable printer I told this theory to. But I recently looked at old letter press print and compared it to offset, with a 50 x magnifier (low magnification microscope). The letter press had some whitish veins running through it--fibers--but offset looked like granite, with white and black flecks throughout. Was I actually seeing the digital dots? Whether there is more of letterpress ink on the page, or digital offset is actually speckles--whatever the cause--digital offset looks greyer to my eyes. And worse. </p>
      <p>Can you shed any light on this issue Charles?</p>
