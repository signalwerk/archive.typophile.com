      <p>When you say less contrast, do you mean the "color" contrast between the body and the background, or the crispness of the border between those two? Because: in the former digital can actually do that; but in the latter digital can only do that by... defocusing the imagesetter laser! Just by a hair, mind you.</p>
      <p>&gt; ... I can only listen to one or two albums before I begin to feel some fatigue.</p>
      <p>Interesting.</p>
      <p>&gt; ... easier to live with.</p>
      <p>This makes sense to me as well, and I think Nature (meaning here the way Nature ends up looking to us) is the reason (as ambiguous as that is). The thing is, I think there are ways digital can be made more like analog (if never exactly). We just have to take the necessity of doing so to heart, instead of obsessing over higher resolutions, finer color control, etc.</p>
      <p>hhp</p>
