    html: <p>Seriously, tho, Adobe Garamond is very versatile, elegant, understated and complete. I think you get more bang for your buck with that one than any other. But I recently used both Garamond 3 and FB Garamond (not on the same job!) and think those are both beautiful fonts. Garamond 3 was probably the inspiration for Adobe Garamond but it lacks the range. FB Garamond is very expensive, as are all the Font Bureau fonts. I've never worked with Berthold but you can't buy individual weights. And the rest (Stempel, Simoncini, etc) don't have the range of weights either.</p>
