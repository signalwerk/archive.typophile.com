      <p>One of my great loves is George Jones's Granjon but, like so many designs, it did not make it over the hump from metal to digital with any grace. Linotype composition in Granjon, well cast, and printed carefully with proper makeready on nice uncoated paper, is as nice a Garamond as I can remember seeing, even with the limitations imposed by the Linotype system. Great stuff. Not in digital, though!</p>
      <p>So far my choice for digital comp has been Adobe Garamond. I should probably upgrade to Pro: I've been using the same A.G. font since it first came out, and it doesn't owe me anything by now.</p>
      <p>Charles, I had a Lasercomp with a Penta front end and never felt that what we produced could match metal Monotype for good readability (we were printing books almost exclusively). Even though it was only 1000 dpi, it held its own against a number of the types output at 2540 on the linotronic machines, and at 1000 dpi you could really only see pixels with a lupe. </p>
      <p>I may be alone in this, but I also felt that the type from the VIP was more welcoming and readable than the 202, which produced results with greater resolution but more contrasty and dazzling.</p>
      <p>But that may be my personal prejudice: I would always have proofs from linotype or hand type pulled on high-finish Superfine rather than the clay-coated Relyon that we were supposed to use, because the Relyon was so !@#$% hard and unyielding. Matter set in something like Caslon Old Face or Janson would gain contrast horribly, especially in the thin strokes.</p>
