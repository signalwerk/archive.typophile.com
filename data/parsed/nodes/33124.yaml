      <p><em>Indeed, how could I forget Sabon Next? Maybe because I haven’t used it. Who have used it, and how does it compare to the others?</em></p>
      <p>The difference between Sabon and Sabon next is also quite noticable.<br>
      Sabon Next Regular compared to Sabon Roman, the best comparison I can get (from PDF specimen), Sabon Next is much more rounded, a bit more heavy, and the general shapes have been toned down a bit, as is the contrast.</p>
      <p>Adobe Garamond compared to Sabon Next, Sabon Next has a little bit taller x-height, it's a bit heavier, more smooth, and I think the shapes are more refined than those of Adobe Garamond.</p>
