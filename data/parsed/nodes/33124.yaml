      <p>As to seeing the dots of digital type being the difference, no. Some of the old photocomp type we set (repro) looked quite gray when printed. I use to complain, but was told it was more than the ink/water balance; it was the ink itself.</p>
      <p>But it is true that the paper fibers &amp; dust seem to show through more with offset/text stock (not so much with coated stocks, obviously). I'm no ink expert, but I think the letterpress inks were thicker, and as I said earlier, I know they were pushed out to form a blacker edge, even though the center of the letter was lighter.</p>
      <p>So in addition to the inks, the paper may be another factor.</p>
      <p>But as to what you <cite>can</cite> do with uncoated paper, if you ever get a chance to look at <cite>South Street</cite> by Barbara Mensch (Columbia University Press), take a look at the photographs. These are duotones we did, black &amp; brown, not double black. What we wound up doing was profiling the printer's proofer, and adjusted the dotgain for that. The printer did have to match their own proofer, of course. Anyway, I think these are nice blacks, esp. for an uncoated stock. (Finch Smooth Text Opaque, Vanilla). Inks were Process Black, &amp;  Pantone 4655 U. In passing, the type was bumped 2/1000s over foundry, but it is a real old version, so newer ones may be different.</p>
      <p>Even so, the dynamic range of the original photos was way more than what you can achieve with ink on paper, so some HRD compression techniques were used in preparing the scans.</p>
      <p>I'll allow this is an exceptional sheet for an uncoated stock, not so much for it's feel, but it's ability to hold blacks.</p>
      <p>The old pressmen I knew used to say that with letterpress, the ink is <cite>in</cite> the paper, with offset, it is <cite>on</cite> the paper. While this is technically sort of backwards, it does capture the feel of letterpress.</p>
      <p>Edit:</p>
      <p>P.S. Mark, my grumble with AG Premier Pro is that the descenders are a bit too short. If they would offer longer descenders, I'd be a  happier camper. If the descenders currently balance with the ascenders, then I have two grumbles. But I haven't used it yet, just compared it to our AG.</p>
