      <p>To add to what Addison Hall's just said, the 'Poliphilus' (facsimile rendering) of the Garamond scene would have to be Paul Shaw's <a href="http://www.letterspace.com/LETTERPERFECT_FONTS/old_claude.htm" rel="nofollow" class="link-external"> Old Claude LP.</a></p>
