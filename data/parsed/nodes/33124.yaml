      <p>IMSLTHO the Jannon Garamonds have not fared too well in PostScript. In the case of Linotype's Garamond No. 3, this goes back to the Linotron 202 fonts. I never use the Monotype LaserComp, so I don't know the how far back the problems with Monotype Garamond go. I re-weighted PostScript Monotype Garamond, &amp; worked on the ascenders &amp; descenders, in the days when we used Type 1 fonts but still ran repro. With the repro-negative-plate process, the type picks up a bit more weight. This was the font used in Hendel's <cite>On Book Design</cite> -- except that was set (by someone else) without running repro -- Applications files output to a film negative, with halftones in place, which meant the characters picked up almost no weight. I've since reworked it for DTP printing, but of course, that font isn't available to anybody, though it wouldn't be too hard for anybody with the correct (old) license to replicate this for their own work. When I did this, I kept one eye on letterpress printed specimens of Monotype Garamond. Except for the comma, which I can't stand.</p>
      <p>I think the advice to use Adobe Garamond is about right. Jannon's fonts were wonderfully quirky, but unless you work over the current offerings, they don't print well.</p>
