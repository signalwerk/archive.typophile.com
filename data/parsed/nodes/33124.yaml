      <p><em>Whether there is more of letterpress ink on the page, or digital offset is actually speckles—whatever the cause—digital offset looks greyer to my eyes. And worse.</em></p>
      <p>Charles is right, as far as I know, that letterpress ink is much thicker then offset-ink. Offset ink is more oily-textured, it can almost be poored. While letterpress ink is much more solid, you practically have to scoop it out of the can. At least the inks I have used. So I guess offset ink is much better distrubuted across the surface of the printed characters. Letterpress ink too, but by a lesser extent, so less paper shows through. And don't forget the impression letterpress might leave on the paper, that can also create small 'shadows', that make the image darker and also press the ink into the paper (like Charles also mentioned).</p>
