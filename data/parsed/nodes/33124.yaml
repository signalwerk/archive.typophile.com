      <p>Personally, I don't feel Garamond Premier renders Adobe Garamond obsolete. The former is a more restrained and modernized interpretation, and the latter is a more directly authentic revival. There's room for both, and more besides.</p>
      <p>Of the various non-Adobe takes on the original Garamond types, I find the Monotype and Berthold versions both quite good.</p>
      <p>Of the Jannon revivals, I have a fondness for both Granjon and Garamond #3 (or ATF Garamond). I've recently been introduced to Linotype Estienne, which is also interesting, if rather quaint and not available in digital form.</p>
      <p>In related typefaces, I'll put in another good word for MVB Verdigris. It's a first-rate book face.</p>
      <p>Cheers,</p>
      <p>T</p>
