      <p>Granjon was in fact B Warde's favorite Garamond, IIRC.</p>
      <p>&gt; at 1000 dpi you could really only see pixels with a lupe.</p>
      <p>Yes but the difference in color and texture between that<br>
      and 2400+ is very clear, especially for small sizes.</p>
      <p>&gt; type from the VIP was more welcoming and readable</p>
      <p>This is interesting.<br>
      I've had this theory that letterpress is more readable than offset (at any resolution)* and this is not due to impression (and certainly not to irregularity) but the fact that it has this very slight softness, something that our perceptual system somehow naturally prefers. And by extension phototype -as despised as it deservedly is for all the things it did wrong and all the crappiness it facilitated- just might have had an advantage over digital in this respect, at least towards the end when (assumedly) the fuzziness was largely tamed. Based on your experience and judgment do you think this is a real possibility?</p>
      <p>* This part is admittedly not a very original thought.</p>
      <p>hhp</p>
