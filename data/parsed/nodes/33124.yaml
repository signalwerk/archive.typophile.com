      <p>I’m a bit late getting into this, and I must start by saying that I am apparently no fan of "Garamond" types. Over the past 12 years I have probably designed around 250 books, and I doubt I have used "Garamonds" more than 12 times.</p>
      <p>But I do have a few comments, following some of the tangents this thread has taken.</p>
      <p>**  Given that I don’t care for Garamonds, I will say I have found Adobe Garamond a pretty dull face. It has not enough vigor or color for me. I have resisted its use, submitting only when pressed. But after all this high praise, I shall listen to you all and give it a closer look.</p>
      <p>**  Monotype Garamond. Now there’s a typeface that dances and is a joy to look at! When I worked in letterpress I had lots of it, and loved it for job work. I did not then use it for text setting. But I do recommend you look at the work charles_e has set in it. He has made the face work really well. Maybe he can list some ISBNs.</p>
      <p>**  I’m really glad to see charles_e contributing here. If you are interested in how to set books well, pay attention to what he says, and try to look at some of his books. He has put a lot of effort into this craft, and has done significant work.</p>
      <p>**  Garamond 3 may not be the perfect Garamond, but I see it is the one I use most. Its letterfit is a bit wonky at times, but for a PS face it has good offset color. I find I use it for books dealing with American arts of the 1900s-1920s, when the original face was used a lot: F. Scott Fitzgerald, Sinclair Lewis, Cass Gilbert. But not  for academic work.</p>
      <p>**  INK: I can tell you from 20 years of working in commercial letterpress book printing shops that by and large letterpress ink is thicker than the juice used in offset presses. But there is a lot of variation among letterpress inks. Much depends on paper, press, density of forme, and the overall intent of the designer and / or the production manager. At times I have used two different blacks in one job. Say: one black for type, another for woodcuts. Whether or not ink is well-distributed almost always depends on the skill of the press operator. And as an "old pressman" I can say to Charles that the other old guys were right: the very nature of relief printing does indeed push letterpress ink "into" the paper, while offset lays it "on" the sheet.  Depending on the sheet, some offset ink will, of course, be absorbed into the paper.</p>
      <p>**  as for the "color" of letterpress vs. offset, Charles is right. That little ink spread is responsible for the good density of black. &amp; that disappeared with generations of photo and computer type because it was not added into the letter shapes. Type designers now know about that and are making types that can yield the equivalent of letterpress blackness. Thank goodness. But much still depends on presswork.</p>
      <p>**  Paper. Let me second Charles on the Finch vanilla. I have just done two books on it. It is a wonderful sheet for that illustrated book that does not want coated stock, but demands something better than the standard text offerings. </p>
      <p>**  and finally: Hrant never got an answer to: "Why exactly are you after a Garamond?"</p>
      <p>OK. That’s it for me tonight. The mescal glass is empty &amp; I must go to bed.</p>
      <p>powers</p>
