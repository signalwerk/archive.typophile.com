      <p>Marc,</p>
      <p>The sharp f in Sabon is actually an artifact of Linotype's metal typecasting technology. Lines of Type (Linotype) mean all the matrices have to be assembled first, and then a single piece of type, containing the whole line of glyphs, is cast. This meant there could be no overhanging kerns, and it also meant the Italic or Bold, whatever was duplexed on the matrices, had to match the roman widths. Optima, Palatino, Melior, Caledonia, Electra, and other classic Linotype faces designed in the metal era had this constraint. Some designers met the challenge so well we don't notice the unusually narrow italic f, but with a classic design like Garamond as a model, the Sabon f had to stand out.</p>
    html_clean: |-
