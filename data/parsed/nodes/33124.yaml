      <p>I bought Adobe Garamond in 1990, as part of a Christmas software—tho', of course, not strictly software if you think of that as <em>programs</em>—buying spree for myself in my last holiday season as a single person. I bought it because I loved how it looked—just a really elegant typeface. Same for Adobe's Futura 1 family, tho' I imagine I could get more argument there. (Actually, I bought the teo together in that selfish shopping spree.)</p>
      <p>And, although I've retired straight AG in favor of Adobe Garamond Premier Pro—yes, indeed, wider assortment of glyphs—I haven't used it in a book in ages, either of my own design or in the majority of my work lately, straight layout jobs (where the design was part of a long-established series or house style of the client). ITC Slimbach is one that's been used.</p>
      <p>I just recently used ITC Usherwood for an illustrated children's story book on which I did page design and layout. I was <em>very</em> pleased with how it looked on the page, as was my client, a self-publisher. I actually used Medium, rather than Book, for the body type. Normally, that'd be an unusual choice. But for a book geared towards 6- to 8- or 9-year olds, I though the slightly heavier appearance worked nicely. A nice, large x-height and not a great deal of contrast in the ever-so-slight thickening and thinning of vertical to horizontal.</p>
    html_clean: |-
