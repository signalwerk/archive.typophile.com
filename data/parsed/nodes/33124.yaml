      <p>As to the softness -- I think I disagree, if you mean the edges of the letters. I scanned in some type printed letterpress at 800 ppi (Bembo, by the Stinehour Press) &amp; took a look at it. It seems to me the metal type pushes the ink outward, so there is a heavier, solid black on the edge of the printed letter. This is one phenomena we can't produce with Type 1 PostScript; I guess you could have with Type 3, but it isn't worth it. The other differences are the bit of randomness with the individually cast letters, and the bit of randomness with their positioning, esp. with Linecasters.</p>
      <p>Having said that, it isn't too difficult to recapture the <cite>feel</cite> of metal type. You can't get the feel of letterpress, but remember that Linotype metal was only good for about 5,000 impressions; the harder metal of Monotype maybe 7,500 impressions. Longer runs meant stereo plates, or pulling repro &amp; printing offset. I think we can easily beat the repro/offset with metal fonts using todays technology.</p>
      <p>The other difference is the foundries seemed to feel their old metal font designs will sell better if they changed the ascender/descender relationships. This isn't just x-height, as it affects the fit of letters with ascenders/descenders to the capitals as well. A magazine look . . .</p>
      <p>As to the type itself, it is largely a matter of the contrast within the letterforms. Adjusting this isn't too hard. Find a well-printed book, scan in a bit at high resolution, &amp; examine how the letterforms look when printed. Granjon can be revived. As a commercial typesetter, I have done this with a few PostScript fonts, but the problem was most people have already decided that the revivals in photocomp (OK, PostScript) fonts aren't any good, so they don't use them. I don't sell fonts (or with rare exceptions, even give them to my wife, who is a book designer), so they by in large lay idle. The best of the old metal fonts could be revived, but I wonder if the marketplace would support this.</p>
      <p>I sometime think the reason I prefer the metal fonts, printed letterpress (even when printed from stereo plates) was that was how the books I read as a child were produced. Anybody remember the "Freddy the Pig" books?</p>
