      <p>I do think it's a possibility, but I also think there is inherently less contrast with letterpress than there is with the same type design rendered digitally.</p>
      <p>I'd like to take your softness comment and move it to a couple of slightly different arenas: </p>
      <p>These days in photographic reproduction there seems to be a lust for unsharp masking. The apparent increase in sharpness is traded for a loss in tonal smoothness. I think there is much to be said for tones being as important in the message of a picture as edge definition.</p>
      <p>Also I am lucky to have a really good stereo. I can listen to LPs all day long and never feel tired or bored. Although CDs offer more definition and greater dynamic range, I can only listen to one or two albums before I begin to feel some fatigue. </p>
      <p>I think the analog realm, softer by (lack of) definition, is easier to live with.</p>
