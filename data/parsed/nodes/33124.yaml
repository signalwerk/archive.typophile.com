    date_raw: 13 Aug 2007 — 11:10pm
    votes: null
    html: "<p>Adobe Garamond is certainly a safe choice, but I feel it's just a tad delicate below 10 point and so I usually use Stempel Garamond with oldstyle figures (its liner figure for zero is just too strange). Garamond Three is too small for most use, and Simoncini Garamond, though elegant, is even more delicate in its fine strokes than Adobe Garamond, and its wide letterforms come close to the disastrous proportions that doomed ITC Garamond. Sabon, among Garamonds, is unique and outstanding: it's Garamond, and yet it isn't. It's a true miracle among postwar typefaces for wide editorial use, and for book designs, only Adobe Janson Text works better. And if you want historically literate versions of Garamond, you need look no further than Storm Foundry in Prague, carried on MyFonts.</p>"
