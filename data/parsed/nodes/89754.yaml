    <p>Hi there,</p>
    <p>I'm trying to find a good type pair to go with Acta Display(as the headline font): <a href="http://dstype.com/typeface/acta" title="http://dstype.com/typeface/acta">http://dstype.com/typeface/acta</a><br>
    for my personal portfolio website. It's a high contrast typeface. I'm using Typekit so would prefer a recommendation from their type library. I'm open to either a sans or serif. My current considerations are 'Leitura News' or 'Futura'. </p>
    <p>My site will show primarily web design work and a small amount of print plus blog posts. </p>
    <p>Any help would be appreciated.</p>
    <p>Cheers,</p>
    <p>BD</p>
