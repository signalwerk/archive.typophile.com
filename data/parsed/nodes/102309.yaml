    <p><img src="http://ninastoessinger.com/posted/selavy-sample.png"></p>
    <p>This is a quick project, a little display font I’m making for a project of my friend <a href="http://soulellis.com/" rel="nofollow">Paul Soulellis</a>.<br>
    He was looking for a typeface reminiscent of the dotted one in <a href="http://25.media.tumblr.com/tumblr_m8g18iTqQm1rru3rpo1_500.jpg" rel="nofollow">this 1934 artwork by Marcel Duchamp</a>.</p>
    <p>After a quick back-and-forth on Twitter (which revealed there was apparently nothing reasonably close available in digital) I spontaneously started sketching a font inspired by those letters. (I only looked at the 13 letters in the French version of the project – there is also an English one that has more letters, which however differ from mine.)</p>
    <p>I like the quirkiness of the original caps, including that cropped “S” and the half-circular “C” (which led me to make the “O” quite round). In the lowercase and other glyphs I tried to strike a balance between simplicity / geometric clarity (well, can’t have too much detail with these dots) and (potentially historic-feeling) quirkiness. Hence the straight “y” descender, the funky “g”, etc. In some glyphs (for instance, “a” and “e”) it has been rather hard to find a solution that would work for all of (1) glyph proportions and implied stroke construction, (2) dot density, and (3) desired character/design.</p>
    <p>The design is now roughly complete, with some of the glyphs still needing some tweaking and a couple of minor glyphs still missing. Spacing still has some kinks, kerning is in its first iteration and shouldn’t yet be looked at too closely, and some of the diacritics need readjusting; so it’s very much in progress. </p>
    <p>Anyway I’d love some more eyeballs on this though and would appreciate any and all feedback! Like I said, it’s a bit of a quickie – Paul needs the font in a week or so, and we’re planning to make it available as a free download then, too, just the one style.</p>
