    html: |-
      <p>Sélavy. Funny.  :-)</p>
      <p>This sort of thing seems easy at first, but it's actually quite hard! I think you've done a great job, but there are some places I'd say you're being too ambitious/optimistic; especially in the lc where the dots are pretty far apart I think you need some different compromises.</p>
      <p>Some specifics:<br>
      - Could you make the top of the "a" denser?<br>
      - I didn't like the tilt in the "e" crossbar at first, but I think it's firm enough to work.<br>
      - I love the "g"... on its own. But it just seems out of character here. I'm surprised the Koch "g" didn't work - it seems like a natural here. But a mono "g" seems like it would be a lost opportunity.<br>
      - I would dump the "i"/"j" tittles! A gap of one dot seems insufficient to support them.<br>
      - Unlike in the "e" I think the curl in the "el" is a mistake.<br>
      - The "S"/"s": it's tempting to like them, but they still look like a dot went missing, like it's a mistake. I don't know if there's a way to make the top flatter.<br>
      - Can you make the tilde less disjointed? One day you might need a double-acute, and then what?!  :-)<br>
      - The ring diacritic isn't working. Why not just one dot? Or is that its own accent...<br>
      - I'd make the cedilla longer. It <em>is</em> a French design!  :-)<br>
      - I think the zero is a bit much.<br>
      - Love the asterisk! (Is it one? :-)<br>
      - The pilcrow is very pretty, but it needs more weight to work; try doubling the stem on the inside of the bowl. But maybe I'm thinking too texty.<br>
      - I think the BP is too narrow.<br>
      - Lower the bar of the Yen?</p>
      <p>Your "dot-wise" ligation is brilliant! I wonder if there might be a way to take that idea further/deeper...</p>
      <p>And a semi-crazy idea: if you built all the glyphs as composites, you could change the "foundational dot" into something else (like a diamond, a star, or even a letter :-) and the whole font would change!</p>
      <p>BTW, I don't know if looking at this might help in some way, but:<br>
      <a href="http://www.typophile.com/node/88148" title="http://www.typophile.com/node/88148">http://www.typophile.com/node/88148</a></p>
      <p>Good luck with your deadline!</p>
      <p>hhp</p>
