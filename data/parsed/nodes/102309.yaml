    html: |-
      <p>Thanks for all the feedback so far! (Here and elsewhere)<br>
      I think this is getting better.<br>
      EDIT: I can’t find how to edit the original post, so here is a link to the new PDF: <a href="http://ninastoessinger.com/posted/130416_Selavy_alternate.pdf" rel="nofollow">130416_Selavy_alternate.pdf</a><br>
      (Note: this screenshot doesn’t have all the dots aligned right, check the PDF)</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/lowercase_3525.png"></div><p></p>
      <p>– Simplified/clearer shapes for “b”/“d”/“p”/“q”<br>
      – Changed “g”/“a” accordingly. I have a bit too many variants of these now. Must say I’m quite attached to this new double-story “g” and reluctant to give it up – the old one was too busy with the ear and all but this one might work, no? Not sure what to do with the “a”. The double-story one doesn’t seem to want to belong. Boo.<br>
      – Straightened the lowercase “l”.<br>
      – Lengthened cedilla, tweaked the tilde.<br>
      – aring: Hrant: Our Norwegian friends have convinced me a dot for an aring is not a good idea (btw: “one day you’ll need a dotaccent, and what then?!” ;) ) – but I’ve rotated the “ring” by 45 degrees, probably better like this.<br>
      – pilcrow: I tried, but doubling the stem doesn’t seem to work very well with these dots. I concluded that this was a display face and would need to be able to handle a single-“stroked” pilcrow.<br>
      – I’m still a bit unhappy with the “s”&nbsp;but not entirely sure yet how to fix it.</p>
      <p>BTW, yes Hrant, they’re all components. This font has exactly one drawn outline. :-)</p>
