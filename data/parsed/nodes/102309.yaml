      <p>Some things I forgot to mention (then I’ll shut up for now):</p>
      <p>– There are no actual ligatures in the sample above (or the font), and none are needed I think. Part of the fun in working this out has been observing how patterns and apparent “ligatures” form by themselves with judicious placement of dots, also by way of spacing/kerning.<br>
      – For future reference, <a href="https://twitter.com/soulellis/status/321609365553569792" rel="nofollow">here</a> is a link to the original Twitter conversation (or more precisely, Paul’s original post) of a week ago.<br>
      – As an aside: Look ma, no FontLab! This is the first project I’m doing in a complete UFO workflow (RoboFont, MetricsMachine). So much more pleasant.</p>
