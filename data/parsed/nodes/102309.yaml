    html: |-
      <p>Hey Nina, nice design! Here's my two pennies' worth. </p>
      <p>I think most of the changes you've made are good (like the longer /L/, the newer /bdpq/ and the straight /l/). </p>
      <p>I'd agree with Jasper about the /e/, I think the slope is almost gentle enough to look horizontal, and then because it's not, it catches the eye a bit. I'd make it more definitely sloped.</p>
      <p>Original /hmn/, I think are better. The /m/ especially I think is too wide in the newer version.</p>
      <p>I prefer the original /a/ where the bowl comes in at the bottom. I know that's not consistent with the new /bdpq/, but it's a different bowl anyway, and it's probably a good idea to distinguish them more in a font like this where things can easily get confused. In the newer version, the flatness of the bowl is making the whole shape look a little stretched horizontally/flat/wide. Maybe just the bottom could be flat? Or Craig's Telefon suggestion might be worth a try.</p>
      <p>Did you try a round /y/? (I mean like the /u/ but with a curved tail.) Or a goblet shaped /y/ like a /u/ with a centred straight descender ?</p>
      <p>That /g/ is hard. I think the way you're treating the ear at the moment is somehow anachronistic. This seems to want to be essentially a geometric typeface and having the bowl so asymmetrical gives a very different feeling. I didn't find the original ear busy. And although I don't think a Koch /g/ should become your signature glyph, I think a) that it might actually fit very well here and b) you don't have too many options with only two or three discrete layers/levels of dots for the descenders. </p>
      <p>The cap /S/ is bugging me. I think it's the way the dots aren't quite aligned horizontally. Geometrically, it's constructed of two circles, and your circles have dots at predictable places. I'd try aligning like this (sorry, I can't explain without actually drawing it). I think the second works better. </p><div class="imageWrap"><img src="http://typophile.com/files/S_4026.png"></div><p></p>
    html_clean: |-
