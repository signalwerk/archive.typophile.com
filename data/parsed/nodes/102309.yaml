      <p>For the /A/ crossbar, how about two dots that align with the third dots up on each side? Perhaps you don't want such "normal" proportions...</p>
      <p>The /C/ looks meager and could use two more dots (reverse the /D/ and drop the five dots in the middle of the stem. Here again maybe I'm "normalizing" more than you want, but I think an issue with this is that the uppercase and lowercase are feeling different in character. It's like the caps are quirky in both structure (many) and proportion (most), and the lowercase quirky in only structure (some). I might suggest the charming naivete of what you started with got lost in the sophisticated letters you added. Duchampian caps, Kochian lowercase?</p>
      <p>I think a one-story /g/ with a descender that comes halfway around (cf /j/) might fit better with the other letters.</p>
