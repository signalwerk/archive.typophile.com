      <p>Thanks!</p>
      <p><cite>“and the lowercase quirky in only structure (some).”</cite><br>
      Well, there is the “c”. And the “s”. But, yes, I see what you mean:</p>
      <p><cite>“Duchampian caps, Kochian lowercase?”</cite><br>
      Well put, and a valid point. If you knew how long I had a Koch “g” in there, too...</p>
      <p>I think I did it semi-consciously, making the lowercase more texty than the caps, although I may have taken it too far. What struck me when testing is that, Display or not, if you make it very large (or view it from close up) the letters invariably disintegrate into a pattern of dots – especially since the “resolution”, if you will, is pretty coarse. When set smaller, however, it becomes quite legible. Hence I figured it might be a cool idea to have a lowercase that breathes a related spirit to the caps but can work for a sentence or even a short paragraph here or there – which needs it to be less DIY-coarse, and more texty. But, yeah, I guess, I will have another look at simplifying / de-textifying some of the lc a bit, along with what you suggested about the caps (especially maybe the “C”).</p>
