  html: |-
    <p>hi folks. new to this forum, so let me start by saying howdy. now to the gist of the post. i am in the process of starting a redesign for the magazine i work for. we are going to do this the right way by determining what our two type faces are going to be.  <br> <br>my preliminary selections are Alfon (serif) and Giacomo (sans) by terminal design.  <br> <br>I would like to get some input from the typography gurus here on a couple more sets of sans and serif types faces. so that i can better compare and contrast to my preliminary selection above. <br> <br>the only is, is that these faces have to be classic yet contemporary. any and all input is welcomed and appreciated. <br> <br>thanks in advance. <br> <br>erin potter | art director <br>charlotte magazine | charlotte, nc</p>
    <div class="forum-topic-navigation clear-block"><a href="/node/8866" class="topic-previous" title="Go to previous forum topic">‹ Fashion mag font</a> <a href="/node/8806" class="topic-next" title="Go to next forum topic">Type creation with components ›</a></div>
