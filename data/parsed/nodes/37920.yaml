      <p>Well, <em>sometimes</em> you can find telecommuting opportunities on <a href="http://www.craigslist.org">craigslist</a>, and it even lets you search for those exclusively, but do be careful of potential scams, frauds, etc.</p>
      <p>Surely there is an American expatriate community in the city where you live... That might be a good place to look for work opportunities. (And don’t just stick to Americans... Any English-speaking expats will do!)</p>
