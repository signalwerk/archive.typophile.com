    <p>So, some advice here from all you lovely people, please?</p>
    <p>I work for an American company, in an overseas office (Israel).</p>
    <p>This is important because:<br>
    * I’m really only fluent enough for professional work in English (I’m American).<br>
    * Salaries here tend to be extremely low, unless you work remotely for a foreign company (which I am already doing).</p>
    <p>The company I work for is a commercial furniture seller, and I do the most basic work for their website graphics. I was working on some more fun design projects for their website redesign but then they got annoyed that I wouldn’t move to NJ, where they’re based, and told me I could only do the boring stuff.</p>
    <p>How can I find a really enjoyable and challenging job that will let me telecommute, and which will pay a reasonable rate ($25 per hour or more)?</p>
    <p>I’m quite a decent designer although I haven’t worked for any really large companies. I have a BA in graphic design and would love to continue my education (when I can afford it!). I have been working in graphic design on and off for about ten years, and working for my current company for a little over 1 year. I would like to be doing illustration, original logo design, advertising work, or anything that’s a LITTLE more interesting than cropping pictures of office chairs (augh). I’m proficient in Adobe Illustrator, Photoshop, InDesign, Quark and several other programs.</p>
    <p>Any ideas, folks? I haven’t been able to find anything in the papers or on websites for this area, but maybe I haven’t been looking in the right places.</p>
    <p>Thanks!!! :)</p>
    <div class="forum-topic-navigation clear-block"><a href="/node/37840" class="topic-previous" title="Go to previous forum topic">‹ Alphabelt by chance</a> <a href="/node/37791" class="topic-next" title="Go to next forum topic">HELP Comic Sans Crisis ›</a></div>
