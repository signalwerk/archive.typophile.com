    <p>I have not been able to track down this one. It has been in use for a couple of months in ‘Dagblad van het Noorden’, a Dutch newspaper:<br>
    &nbsp;<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/dvhn_4775.png"></div><br>
    &nbsp;<br>
    Further samples are available <a href="http://www.multimmo.de/knipsels2/stemmenvanuitdeheimat0706.jpg" rel="nofollow">here</a>, <a href="http://3.bp.blogspot.com/_St9yvWSS_O4/TEoe2XO9GQI/AAAAAAAABPg/n14lsd4RNLc/s1600/dbvnartikeltje.jpg" rel="nofollow">here</a>, <a href="http://www.zepta.nl/cms/images/stories/artikel/toernooi/42WPT_zepta_dvhn.jpg" rel="nofollow">here</a>, <a href="http://www.brandsbouw.nl/Uploads/509%20eigen%20ontwikkeling/509%20emmen%20bad%20kapelstraat/artikel%20Kapelstraat%20Dagblad%20van%20het%20Noorden.jpg" rel="nofollow">here</a>, <a href="http://klaasadema.nl/wp-content/uploads/2010/08/DvhN-maandag-9-augustus-2010.jpg" rel="nofollow">here</a>, <a href="http://4.bp.blogspot.com/_XYe42x1oO4Y/THtwEkXQ7RI/AAAAAAAAACQ/DQYYRtDpDb8/s1600/dvhn28-8-2010.jpg" rel="nofollow">here</a> and <a href="http://files.n361.com/Krantenartikelen/DvhN%2004-08-2010-01.jpg" rel="nofollow">here</a>.<br>
    &nbsp;<br>
    Anyone? Thanks in advance!<br>
    &nbsp;<p></p>
