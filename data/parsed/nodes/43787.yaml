  html: |-
    <p>I'm a student at SVA and I'm working on setting two bodies of text next to each other in a book. I want to use Futura T1 Light for one, but I'm not sure which typeface to use for the other text. I know I want to use a serif face, but that's about it. I don't have any extra money to buy a type family, so I'm limited to pretty much what Adobe CS3 has to offer, unless I can find something else at school.</p>
    <p>Any help would be great.</p>
    <p>Thanks!</p>
    <p>Bailey</p>
