    html: <p>If you're going to use Futura, especially Futura Light, for any kind of text, the important thing is to track it V E R Y loose. The bigger the space inside the characters, the more space you need between them – so the light weight needs to be set looser than a bolder weight. And the default letter fit for Futura, at least the commonly available varieties, is much too tight. Open it up, and look at the difference it makes.</p>
