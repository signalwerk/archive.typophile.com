      <p>Your professor should really have pointed this out, but for God’s sake, don’t set book type in Futura. Reading a book set in Futura is like having nails pounded into one’s eyeballs. Head over to the library and try reading the <a href="http://www.amazon.com/Bauhaus-1919-1933-Taschen-25-Archiv/dp/3822850020/ref=pd_bbs_sr_2?ie=UTF8&amp;s=books&amp;qid=1207077544&amp;sr=8-2" rel="nofollow">Bauhaus 1919-1933</a> to see what I’m talking about.</p>
      <p>Anyway, your best bet alongside Futura is a face based on Futura. You can get Memphis light for $20 on MyFonts, that’s not a bad deal.</p>
