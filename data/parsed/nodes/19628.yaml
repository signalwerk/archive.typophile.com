      <p>I consider myself pro-immigration. It is one of the things that makes this country great. That said, I fervently support LEGAL immigration. Allowing illegal immigration hurts those that follow the proper channels. </p>
      <p>My wife is Azeri and immigrated here on a fiance visa last year to marry me. The process of the fiance visa and adjusting her status after we married to allow her to stay took about a year. Additionally, we had to wait two years for her 212(e) residency restriction to expire prior to the fiance visa process. I speak from personal experience when I say that the legal process of immigration takes time and can be filled with anxiety. BUT the process exists for a reason and should be respected. My wife and I were treated with the utmost respect throughout the process by USCIS officials and in the end we were rewarded for following proper procedures.</p>
      <p>The issue of illegal immigration touches my wife and I personally as we followed the rules and waited over two years to be married and together. To reward illegal immigration in many ways punishes those of that follow the rules. I am in favor of more open immigration policies, but at the same time I believe that whatever immigration policies/laws are in place should be enforced.</p>
