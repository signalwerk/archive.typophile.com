      <p><cite>it’s a short term acceptable solution, full citizenship of course would be the best thing to get.</cite></p>
      <p>I guess one big problem I have with the whole thing is do we ever draw a line? Is the American taxpayer expected to be Mexico’s welfare system, with no limit? As a rule we don’t get the cream of the crop sneaking across the border. There are parts of OC where you can see all these little Mexican baby machines cranking them out as fast as they possibly can. (partly because of the Catholic beliefs on birth-control, I imagine), while all their brood is orbiting them as they cross at the intersections </p>
      <p>Meanwhile I can’t seem to get ahead here, even though I am making what some people think is decent money. We can’t afford to buy a house, let alone provide for retirement at my current income levels. </p>
      <p>If there is no limit to letting the poor of Mexico flood into California, then no amount of taxation will ever be enough.</p>
      <p>If the bleeding-hearts are so concerned about the poor Mexicans crossing our border looking for opportunity, they should be ultra-concerned about the Guatemalans, who are even worse off, who are raped, have their money stolen, usually by soldiers or police. Since they have no right to be there, no one cares how they are treated.</p>
      <p><a href="http://hosted.ap.org/dynamic/stories/M/MEXICO_MISTREATING_MIGRANTS?SITE=AP&amp;SECTION=HOME&amp;TEMPLATE=DEFAULT&amp;CTIME=2006-04-18-18-08-31" target="_blank">Check this AP news story</a></p>
      <p>Vincente Fox’s hypocrisy reaches new levels of irony.</p>
      <p>Please keep in mind I am married to a Mexican citizen who feels much the same way I do, only she is more cynical about the Mexican government. And I love much of the Mexican culture and music. I probably have the biggest collection of trios, rondallas, and female ranchera singers of any white person in California. Lucha Villa, Chelo (Mejor Me Voy, Si Ya Te Vas: Si algun dia las penas de la vida te hacen daño, no pretendas buscarme, etc.), Lola Beltran, Flor Silvestre, Beatriz Adriana (echele ganas) etc. are the part of my music collection I would grab if the house were burning down. Too much effort went into getting them all, and many are out of print. </p>
      <p>So I can say I love Mexicans, I don’t don’t think I should be taken advantage of by the ones who don’t respect our laws.</p>
      <p><cite> There are also some illegal north americans in mexico (many of them in San Miguel de Allende, about 40 km from here), and I can assure you they are well treated.</cite></p>
      <p>From my experience, it would only be because they have money. I have family in Mexico, I have traveled in Mexico, and I know how it works. Please don’t paint a picture as if ghetto occupants started sneaking into Mexico and down to San Miguel de Allende, they would be welcome with open arms. I have been in San Miguel. I bought some nice Huichol art there, fortunately before the price started skyrocketing. </p>
      <p>The city is very pretty. And I imagine they want to keep it that way.</p>
      <p>And another thing, why in the flying blankety-blank shouldn’t we be able to decide our own laws, or enforce the ones we have without extortion from people with no right to be here. The whole thing is ludicrous.</p>
      <p>Now to balance my position, I am in favor (as I think is a majority of Americans) of a program that legally allows workers to be here. There is no doubt they make a valuable contribution. </p>
      <p>But not without restrictions or guidelines.</p>
      <p>And now a story we personally know about. A Mexican women (cousin of a friend of my wife) crossed the border illegally, then started having babies here (now she is at four), so now all the kids are US citizens, and she is getting benefits; Money for a place to stay (using forged Social Security docs) and since the fourth son is deaf, she is given money for special education, and hearing aids. She doesn’t work, because if she did she wouldn’t be elegible for all the benefits. </p>
      <p>And I could go on for quite a while about things like this, because of the work my wife does. She is trusted by many of them to hear the details of all the stories the working ones have concerning their relatives.</p>
      <p>All courtesy of the unknowing Californian taxpayers.</p>
      <p>And Ricardo, you make a valid point about my wording which I have amended above.</p>
      <p><cite>Ah, that’s a bit too close to Seattle. Sorry, my offer is off the table. ;-)</cite></p>
      <p>Hey, I have asked to be transferred to develop that area for my company. I’ll look you up if it happens. From the conversations I overheard at Starbucks in Enumclaw, you guys could use a few more people there whose political viewpoints aren’t in the clouds.<br>
      ; )</p>
