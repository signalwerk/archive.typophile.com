      <p>You say you’d do the same if you moved to another country. That makes sense. And yes, it does make sense for someone living in the US to learn English. But in areas where Hispanophones are paying large parts of the tax bill, it isn’t fair <cite>not</cite> to be bilingual. America isn’t like other countries. It isn’t the motherland that Italy, China, or most Old World countries are. And, unlike other American countries, it has never become one. You can be American, but most Americans are something else as well, be it Italian, German, Dutch, Chinese, or whatever.</p>
      <p>Anyway, it’s about time North Americans start learning more than one language. It seems to me that most of the negative feelings towards these people come from simple ignorance. Most Americans don’t speak their language or understand their culture. If you remove yourself a bit and think of the reality, what would it change to allow these immigrants into the US legally and accept Spanish as a de facto official language alongside English in the places they live? It would mean more taxpayers. Besides that, not much would change. I don’t understand what everyone’s problem is..</p>
      <p><cite>If you add in that many of the people we are talking about can hardly read or write in their own language, it becomes more difficult.</cite></p>
      <p>Don’t get so self-righteous. My grandparents from Italy weren’t well-educated. It takes my grandmother 15 minutes to write a birthday card and I don’t think she’s ever read a book besides maybe from a small Missal from when she was a girl that she has by her bed. She finished grade 6 (which means she was more educated than most people her age from my region) and my grandfather only finished grade 4. Meanwhile, they are better off, no, <cite>much</cite> better off than most native-born Canadians. Why? They worked their asses off and saved every penny, like all immigrants. Immigrants tend to be more driven, ambitious, and successful than most people. Just think: they saw a problem and went to such great lengths to overcome it as moving to a foreign country, learning a new language (or several), finding a place to live and a job all over again, etc...</p>
      <p>Would you have the wherewithal to do something like that? I don’t mean moving to a new country because you can afford to do something new (my grandparents had to raise and sell a runt pig their neighbor gave them to afford the ticket to come here), but overcoming your conditions to do it. Acknowledge that in business, there are many entrepreneurs who never had much schooling but who had an idea that made them very rich.</p>
      <p>Next, acknowedge that the rich pay more taxes.</p>
