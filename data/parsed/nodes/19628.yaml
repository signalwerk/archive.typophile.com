      <p>I couldn’t agree more that Americans should learn more than one language and was lucky enough myself to go to a school that started language ed pretty young. Hence I’m fluent in French and also basically functional in Spanish and Italian. But unfortunately not enough emphasis is placed on language ed in most schools here, especially spanish.</p>
      <p>However there are so many different immigrant groups, thru history &amp; all over the country, that bilingual education isn’t that practical - besides it further marginalizes immigrants not to speak English. I understand it isn’t easy for a 65 year old immigrant to learn a new language, but kids in school can and should if they want to get anywhere. Again, I’m not being rah rah rah USA here but practical. English is the lingua franca here (and a LOT of places) and is likely to remain so.</p>
