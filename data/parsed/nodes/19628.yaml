    <p>I, as most mexicans have family working in the United States, so I decided to make this post as a mean to support them asking all north american typophiles to reject and help to stop the HR 4437 bill.</p>
    <p>There are about 41 million hispanic inmigrants working in the united states, doing an honest life trough hard work on duties most north americans are not willing to do. It’s true many of them (about 11 million) reached the United States ilegally, but it is also true that ilegal workers are hired under very unfair conditions like up to 14 or 16 hour working days, not medical or social assitence, unjustified dismissal and very low payments.</p>
    <p>Trying to turn this people into criminals is not fair, and is not going to fix the problem, it´s just going to make it worse. A wall in the desert is not going to stop illegal inmigration and treating people like animals (denying medial assitance) is the real crime. There are also some illegal north americans in mexico (many of them in San Miguel de Allende, about 40 km from here), and I can assure you they are well treated.</p>
    <p>The real solution is to have a fair treat for temporal inmigrant workers, because we all know you need the workers and we need the work, this radical position is an hipocresy that only benefits the ones who explode and violate the human rights of workers.</p>
