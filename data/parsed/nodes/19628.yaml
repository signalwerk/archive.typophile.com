      <p>From what I’ve read, it’s an attempt to do something..</p>
      <p>It seems like this situation may be too complex for 1 bill to solve.</p>
      <p>An excerpt:</p>
      <p>“Detractors say the bill includes measures that will infringe on the human rights of asylum seekers by stripping important due process protections, criminalizing status over which they may have no control, and dramatically limiting their access to essential services. It would also redefine undocumented illegal immigrants as felons, and punish anyone guilty of providing them assistance. It also would create several new mandatory minimum penalties for a variety of offenses, including some that would expose humanitarian workers, public schoolteachers, church workers, and others whose only object is to provide relief and aid to five-year mandatory minimum prison sentences.</p>
      <p>On the opposite side of the issue it is argued that living illegally in the United States is a crime, and that this bill merely aims at recementing US immigration codes that have for so long been neglected. Supporters of the bill argue that it will increase border security by providing more US Immigration and Customs Enforcement agents to the border, thereby helping to curtail any possible entry to the country by terrorists, and that the passage of this bill may help curtail drug trafficking and human trafficking from Mexico to the US by depriving smugglers of sources and contacts on the US side of the border.”</p>
