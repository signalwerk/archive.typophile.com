      <p>This is one of those issues on which so many of us feel compelled to have an opinion, but which very, very few of us really grasps at all. I mean, I can sit here in Ohio and watch the marches, and then listen to Lou Dobbs, and then read some posts here, and maybe I’ll have an opinion. And maybe my opinion will roll around and re-shape itself over and over, as I reflect on the fact that my own great-grandparents were immigrants, but they came through Ellis Island, and their whole life situation was really not like that of the southwest-border immigrants at all. </p>
      <p>On top of that, I don’t think much of the political “debate” we see is about much of anything susbtantial. We have a kind of sprawling and fairly active border patrol, as far as I can tell, but people come streaming in anyway. They’ll get themselves woven into American society if they want to, and these bits and pieces of legislation won’t end up meaning much. We’re not gonna close our borders in any significant way, and we’re not gonna open them up much either. We’re just gonna keep muddling along. We can pontificate about the supposed obnoxiousness of people marching with Mexican (not American!) flags, or we can pontificate about the ways in which immigrant labor (illegals or not) is an essential part of our economy, so “illegal” must be considered in context. It just doesn’t matter.</p>
      <p>My own “opinion” is that a lot of this brouhaha is election-season politics, nothing more. And another opinion would be that we in America just need to acknowledge we can’t have it both ways: free trade worldwide, but limited circulation of human beings. Globalization is just gonna happen, like it or not. These are perhaps some of the growing pains, but it’s mostly just a whole lot of nothing.</p>
