    <p>Brand NEW! </p>
    <p>New typeface released, it was inspired by movie tittles from old B&amp;W Hollywood movies. The typeface was custom designed in vector format using a high number of colors to produce a realistic 3D effect.</p>
    <p>It is perfect for display use, large format graphics, magazines, posters and 3D design.</p>
    <p>It was showcased at Typography Served: <a href="http://www.typographyserved.com/gallery/Smoking-Club-Typeface/5410327" title="http://www.typographyserved.com/gallery/Smoking-Club-Typeface/5410327">http://www.typographyserved.com/gallery/Smoking-Club-Typeface/5410327</a><br>
    More about me <a href="http://www.rodrigoaguade.com/" title="http://www.rodrigoaguade.com/">http://www.rodrigoaguade.com/</a><br>
    Buy it here <a href="http://matoi.myshopify.com/" title="http://matoi.myshopify.com/">http://matoi.myshopify.com/</a></p>
