    html: |-
      <p>As nice as this design and implementation is, it is not a typeface or thefont, but a graphic alphabet. That is, it cannot be used in any standard computer application by entering via the keyboard. For all practical purposes, this is letter-shaped clipart.</p>
      <p>Herb</p>
