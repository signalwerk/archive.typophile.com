      <p>Take a close look at the work that Bruce Mau has done for Zone Books. (Any title will do, as he's basically designed them all). If you can find a copy of his book <em>Life Style,</em> he devotes many pages to this topic, and even specifies some 40 or so composition rules that he follows for Zone Books. It is all very sound advice.</p>
      <p>Other excellent points of reference are some of the better designed titles from MIT, as well as anything put out by the Princeton Architectural Press.</p>
      <p>The work of Richard Eckersley is superlative, but harder to come by. (He did many titles for the University of Nebraska Press, among others.)</p>
