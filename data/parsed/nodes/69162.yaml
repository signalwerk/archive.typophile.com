      <p>Sebastian, the Tschichold/Penguin approach is a great reference - one of the greatest editorial design achievement of XX century, though it should not be taken as an absolute reference *per se*. Tschichold was a master in book design, and was central in reviving the quality editorial design in popular literature during last century, but one should always consider that he was a man thinking and working some forty/fifty/sixty years ago, in a completely different technological environment. That is to say, for example, that the typefaces he used and championed (in letterpress years) aren't necessarily the best ones to use today. I, for example, would think twice before setting a book in Perpetua or Joanna: excellent metal types (see Gill's essay "On Typography") with a weak digital translations. Same for the Golden Section - setting a double page spread with those proportions can be risky if you don't mind having a very narrow inner/very wide outer and bottom margins (and you should always consider how the book will be binded - softcover of hardcover?). So, if you're after some good editorial book design (in the essay genre), first of all I would have a look to your local bookshops and libraries, I'm sure there's tons of good stuff among Spanish publishers. Then I would consider using a contemporary typefaces; and if you're after a revival, there are some great *recent* digital interpretations to consider, both in the Renaissance/Venetian/Garamondish/Humanistic and in the Neoclassical/Romantic types. Finally, here is a quick link to the work of a great book designer (see the illustrated books section in particular):</p>
      <p><a href="http://www.matthewavery.com/index.php?/projects/illustrated-books/" title="http://www.matthewavery.com/index.php?/projects/illustrated-books/">http://www.matthewavery.com/index.php?/projects/illustrated-books/</a></p>
