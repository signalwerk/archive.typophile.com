      <p>I didn't mean to suggest that Bruce Mau's use of Perpetua had anything to do with Jan Tschichold (I have no evidence either way). It's a superb design. Ordinarily I would agree with Nicola's assessment of the face's digital incarnation, but for Zone Books it was an inspired choice. An outwardly correct form, slightly sculptural, but with a subtle hint of perversity. In their pages I have even noted a customized version, where the ascenders/descenders of the italic <em>f</em> have been, how shall I put it, somewhat "castrated"—</p>
      <p>I wouldn't recommend it to a novice.</p>
