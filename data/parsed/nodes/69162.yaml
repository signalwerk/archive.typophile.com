    <p>hi guys,</p>
    <p>I will start a Philosophy book in the future. The style is mostly text with very few pictures. A very classic approach in design but well done. Do you know of good editorials that i could take a look at the use of typography and design? I thought on Penguins Books, maybe some Phaidon ones but i cannot think of another one. </p>
    <p>Any help or ideas?</p>
    <p>Cheers,<br>
    S</p>
