    html: <p>I should mention that Bruce Mau plainly acknowledges his debt to Jan Tschichold, and there exists a clear lineage between the two men's respective rules of composition. Both are worthy of close study. Bruce Mau elected to set all of the Zone Books in Eric Gill's Perpetua, which Tschichold had been known to use to great effect. (Many of the classic Penguin covers were of course set in Gill Sans).</p>
