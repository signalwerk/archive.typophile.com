    html: <p>With Penguin, just try and pick up one of the older (orange/green/blue) paperbacks for a few pennies on amazon (or at a second-hand bookshop) to look at the layout and typesetting. They're all just based on golden section rules, there's a load of information online if you dig around, and here's <a class="freelinking external" href="http://ronin-group.org/misc_etext_tschichold.html" rel="nofollow">Jan Tischgold's composition rules</a>. Monotype Joanna, Monotype Plantin and Linotype Pilgrim show up frequently, all would be good choices. Joanna and Pilgrim are both Eric Gill typefaces, very good, make very readable book text.</p>
