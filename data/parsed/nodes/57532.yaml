    html: |-
      <p>&gt; "I don’t think it would be difficult to read for people at that time".</p>
      <p>The "reading times", the way they used to read, were totally different than what they are nowadays.</p>
      <p>Reading and calligraphy were considered religious acts. Every reader would take long hours in churchs and libraries reading, with the big "In folio" books, which were tied to the seat with a chain.</p>
      <p>The aim of those calligraphers of medieval times, and of the PreRafaelist ideology followers (SXIX and part of SXX)<br>
      was to generate a very dark black block on every page.<br>
      Although they were more used than we are, to read those pages, I bet they knew that if they looked at the page from a meter of distance the blackness would make the page illegible. </p>
      <p>I think the blackletter style is full of positive points, like the mystic spirit it has, but the risk of not achieving the communication it pretends is big.</p>
      <p>Lián Types.-</p>
    html_clean: |-
      <p>&gt; "I don’t think it would be difficult to read for people at that time".</p>
      <p>The "reading times", the way they used to read, were totally different than what they are nowadays.</p>
      <p>Reading and calligraphy were considered religious acts. Every reader would take long hours in churchs and libraries reading, with the big "In folio" books, which were tied to the seat with a chain.</p>
      <p>The aim of those calligraphers of medieval times, and of the PreRafaelist ideology followers (SXIX and part of SXX)<br>
      was to generate a very dark black block on every page.<br>
      Although they were more used than we are, to read those pages, I bet they knew that if they looked at the page from a meter of distance the blackness would make the page illegible. </p>
      <p>I think the blackletter style is full of positive points, like the mystic spirit it has, but the risk of not achieving the communication it pretends is big.</p>
      <p>Lián Types.-</p>
