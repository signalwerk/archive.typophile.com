      <p><cite>what kind of learning and inspiration are you looking for ?</cite></p>
      <p>Mmm, I don't know really. I think that with time people becomes fan of some things. Type is –for the strange people like us– one of them.<br>
      I am thinking to design a new font and right now I want to think before start what I have to do and what not. I mean: in my last project I started to design but with no parameters or goals clearly defined. And this is not a good start point because you really don't have how to compare if you are right or wrong in the process.<br>
      In typophile I learned a lot of things, and ask you a «top five» font ranking will be good to know another designs and oppinions about what are the cool and lovely things on type.</p>
      <p>Juan</p>
