    <p>I was wondering what is the best type designed in your opinion.<br>
    I'm looking for references to learn and to find inspiration.<br>
    I think that some typefaces are not very elegant but it works very well (Quadraat) and others are really beautiful ...<br>
    Trinité is perhaps one of my favorites.<br>
