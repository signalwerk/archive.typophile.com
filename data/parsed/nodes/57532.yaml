    html: |-
      <p>Mr Shinn:</p>
      <p>Agreed.</p>
      <p>That is a beautiful page. There's really nothing like letterpress. </p>
      <p>I love reading old E.B. White books. Most of them are set in either letterpress Electra or Fairfield. Whenever I read them I feel as if I'm part of an earlier, simpler time - on White's salt water farm in Maine during the late 30s or early 40s, maybe in early summer. I doubt that the same material set in today's laser-optimized, ultra-sharp fonts could achieve the same effect, respectfully. </p>
      <p>No one could construct a sentence quite like E.B. White. Now combine that with a wholesome, warm, dark letterpress font on faintly musty, creamy paper, and what you've got is a kind of sensory and intellectual nirvana.</p>
      <p>By the way, Mr Shinn, what type is being used on that page?</p>
