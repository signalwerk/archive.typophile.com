    html: <p>Thanks Mark, but the FontSilencerXT will not allow valid corrupt fonts to be announced and we take many customer fonts for their jobs - The folks at FontLab suggested I buy TypeTool 2 for the Mac for renaming. What I thought I could do but hasn’t worked yet is to open a viable Helvetica Oblique and basically just change the correct names within the font to the a2HelveOblique that I need and re-export it to the a “noncorrupt” font. The ID names and numbers in Quark are very particular so I haven’t gotten this to work yet. Anyone have any ideas?? Thanks</p>
