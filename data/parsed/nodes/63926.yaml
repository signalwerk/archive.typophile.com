    html: |-
      <p>I don't see how you could accomplish this within a font.</p>
      <p>While one could in principle make use of one-to-many substitutions to replace English <em> words </em> with Dutch ones, it would be impossible to replace arbitrary English <em> text </em> with Dutch text. Because English and Dutch syntax are non-identical, you'd need to have code which handles entire phrases. Since the length of those phrases is unbounded you'd be looking at an infinite amount of substitution code.</p>
      <p>André</p>
    html_clean: |-
