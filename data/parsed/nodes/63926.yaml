    html: |-
      <p>The OpenType font format does not support many-to-many substitutions. It supports many-to-one substitutions (they are implemented in FontLab Studio 5, and work in most OpenType applications), and it supports one-to-many substitutions (they are not implemented in FontLab Studio 5 but are in the new Adobe FDK for OpenType / AFDKO library version 2.5, which will be included in the next version of FontLab Studio and which is available separately from Adobe free of charge, but those substitutions don't work properly in most Adobe applications). </p>
      <p>Cheers,<br>
      Adam</p>
