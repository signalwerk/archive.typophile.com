    html: |-
      <p>What exactly do you mean by 'it doesn't work'?</p>
      <p>Do you mean you are getting an error from AFDKO, or do you mean that you aren't observing 'a' being replaced by 'bc' when you test your font?</p>
      <p>If the latter, this is not surprising. Very few major applications support one-to-many substitutions, so even if an appropriate lookup is present in your font, the substitutions will not be performed.</p>
      <p>FontLab doesn't support one-to-many substitutions, so you won't be able to code such substitutions there. The Adobe CS 3 applications don't support such lookups, so your font won't work correctly in any of those (and AFAIK, CS 4 doesn't support them either), nor do most other OpenType-savvy applications on the market today.</p>
      <p>One-to-many substitutions are something which offers a great deal of promise for certain things, but they are still sufficiently undersupported that I wouldn't recommend relying on them at this time.</p>
      <p>Moreover, it's really very unclear to me why you would <em> want </em> to perform the kinds of substitutions which you are proposing above within a font. Cases where I would consider one-to-many lookups useful would include things like</p>
      <p><code> sub eacute by e acutecomb; </code></p>
      <p>where the replacement of a particular glyph by a sequence of glyphs doesn't alter the underlying semantics. The replacements which you are proposing, however, involve changes to the semantics which are the sort of thing which one would normally want to achieve by changing the <em> character </em> string rather than the <em> glyph </em> string, and that's the sort of thing which should be done by the application rather than the font.</p>
      <p>Perhaps you might clarify what it is that you are trying to achieve and why.</p>
      <p>André</p>
