      <p>Correct me if I'm wrong James, but I don't believe the Museum has actually <em>acquired</em> Clearview.<br>
      I assume they have<em> licensed</em> it, which as foundries usually take great pains to emphasize, is not the same thing.</p>
      <p>Anyway, if a museum is going to "acquire" a typeface, Clearview is prime. Props.</p>
