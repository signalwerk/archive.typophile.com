    <p>King Fahd Glorious Quran Printing Complex, released Arabic Symbols Font.  KFGQPC already released two fonts, Uthman Taha Naskh Medium and Uthman Taha Naskh Bold. These fonts are free for everyone. </p>
    <p>Home page:<br>
    <a href="http://fonts.qurancomplex.gov.sa" title="http://fonts.qurancomplex.gov.sa">http://fonts.qurancomplex.gov.sa</a> </p>
    <p>Download Link for Arabic Symbols Font:<br>
    <a href="http://fonts.qurancomplex.gov.sa/download/Symbols1_Ver02.otf" title="http://fonts.qurancomplex.gov.sa/download/Symbols1_Ver02.otf">http://fonts.qurancomplex.gov.sa/download/Symbols1_Ver02.otf</a></p>
    <p>Downlaod Link for Naskh Fonts:<br>
