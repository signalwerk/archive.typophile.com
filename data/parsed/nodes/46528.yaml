    <p>As an experiment, I have been trying to contstruct a useable fat slab serif typeface using Fontstruct. Some of the characters look quite nice, I think, but others look ... well, not so nice. What needs changing? And how should I solve the F, so that it looks normal when it preceeds lower case characters?</p>
