      <p>I think the problem about your F relates to the E. They stick out, I think primarily because they don't have the same vacuum feeling of the rest of the typeface.</p>
      <p>Overall, I kind of like it. It's really not my style, but I can see some contexts it could be suitable.</p>
      <p>By the way, does Slabbedask mean anything normal in Norwegian?</p>
