      <blockquote><p>Richard at P22 for example makes it a point to pursue potential rightful owners of fonts he'd like to revive before; he tells me they often say "thanks for asking - go ahead - don't even worry about paying us anything" - but of course that doesn't make his desire for correctness less honorable.</p></blockquote>
      <p>We also agree here too</p>
      <blockquote><p>Is Cancelleresca Bastarda in the public domain?</p></blockquote>
      <p>Good question on a very interesting topic :)<br>
      I think it is. Other people think it's not. Each one has different arguments, so it's not entirely clear yet.</p>
