    html: |-
      <p>The problem with hand lettering and research is there may not be a complete specimen of lettering you wish to digitize. Often lettering styles were handed down from a "master" (for lack of a better term) to apprentices with no formal specimen. Sometimes styles were the personal invention of the sign-writer cobbled together from pieces they picked up. Others were the adaptation of print letters to hand lettered brushwork. Some styles of lettering were completely regional. Worse, sign-writers could vary the letters from one basic format to produce cursive scripts, casuals (or money strokes), italics, or  calligraphy on the fly. Each would have the same characteristics but with a different brush or treatment each would be a completely different font by modern standards. There are several books covering hand lettering available, Speed Ball, Atkinson, Becker, etc., but don't be surprised if you can't find this variation.  The end result will generally be a collection of specimens and samples. From this you will build your font. Another possibility is to find an old sign painter or calligrapher to make a specimen and hope that he or she can duplicate this lettering.</p>
      <p>Even if you find a complete specimen, there is no way to copy it verbatim. Such demonstration specimens were meant as  guides only. The artists were expected to adjust each character to fit the application. I've heard purest say that their font was a true representation of the font as presented in the specimen. This means that it is crap. Hand lettered specimens are not composed as iron clad rules but rather as guides. Stroke widths, x-heights, character width, etc. will look great as long as all you do is spell out the glyphs as originally rendered. Anything else will need correction. </p>
      <p>So, good luck and good hunting. Please don't listen to me. There is probably a real expert around here somewhere who will completely refute everything I've written, and he or she is probably right. I only know from personal experience. I am still working on my script and I had a decent specimen.</p>
      <p>James</p>
