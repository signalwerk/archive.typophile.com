    html: <p>Yeah, I've looked through the Filmotype collection and Sudtipos Bluemlein collection. I don't think I'd be stepping on anyone's toes too much by digitizing this (as a font, not a perfect tracing of lettering!). I figured a near exact match in a lettering style guide would not exist; I was just after something close enough to help me deal with the typical problem letters like x, z, k and then maybe find something that could work as a matching upper case. I've gathered a collection of lettering styles (via Google image search) from 30s to 60s, and hopefully I'll have enough to do a kind of mash-up, but keep it a consistent looking face. I'm not into revivals, I just really like the feel of this sample. We'll see how it goes...</p>
