      <p>Let's say you make a revival of a font that's not in the public domain (which you might or might not realize) and the people who still have rights to the design don't notice, so they don't complain. It's still not OK. This often happens when the guy who made the font is dead/dying and his heirs/agents -who are accountants and waiters- do not follow the type design scene.</p>
      <p>Richard at P22 for example makes it a point to pursue potential rightful owners of fonts he'd like to revive before; he tells me they often say "thanks for asking - go ahead - don't even worry about paying us anything" - but of course that doesn't make his desire for correctness less honorable.</p>
      <p>Is Cancelleresca Bastarda in the public domain?</p>
      <p>hhp</p>
