    <p>Well, not really!<br>
    I stumbled across this lettering in a fifties advert:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/sensitive_3986.JPG"></div><br>
    As far as I know there are no digitizations of this style (House Industries' Studio Sable is similar). I want to make a font out of it, and was wondering if anybody knows of any lettering specimen where I might find a full alphabet of this style, or similar, to get a feel for how the other letters should look, rather than just expanding the charset myself by guesswork. I'm in Thailand so any physical book is going to be hard to get hold of. Maybe there's a flickr or other online resource that I've not been able to find? It won't be a straight revival, so even low res images would be helpful. I just want to get a feel of how it should look, then make it from scratch.<br>
    Cheers,<br>
    Dave<p></p>
