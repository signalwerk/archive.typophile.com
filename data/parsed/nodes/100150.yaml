      <blockquote><p>But is the original now "ownerless"?</p></blockquote>
      <p>The original sources have become public domain. Now the entire world population is the "owner".<br>
      Foundries can claim ownership of his own digital version, but not on the original source design.  And anyone can make a new version if its based on the source material.</p>
      <blockquote><p>Nobody might complain, but it might still be shady.</p></blockquote>
      <p>Are you referring to Holub, Stirling, Garamonds, Caslons, Baskervilles, Bodonis or Didots? </p>
      <p>Also, why shady? Not at all.<br>
      If someone does a revival, why would you deny the same possibility to everyone else? No ones gets to get exclusivity on public domain revivals. If you want to get exclusivity, you should do something completely new instead.</p>
      <p>Personally, I welcome diversity and I like very much that there are a lot of different version of each revival. So you can choose, for example, the Caslon or the Baskerville that best fit your taste or your intended use, or the one that gives you best results under different printing methods, or the one that renders best on the screen, etc...</p>
