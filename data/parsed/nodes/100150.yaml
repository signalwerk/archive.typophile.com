      <p>They can't complain as long as you don't use their digital outlines.<br>
      If you use the original book scans as your source, everything is fine. </p>
      <p>Different people can do their own version of the same source material.<br>
      A recent sample of this are Medusa* and Bellisima Script**, both independent digitization based on the same Stirling's book, released with only a few weeks of difference.<br>
      And each one added his own vision to Stirling's calligraphy.  Ale added a lot of crazy swashes and sing-painter's style alternates, while Ramiro added perfect connecting letters, wonderful decorative caps and a useful smallcaps companion.</p>
      <p>* Medusa: <a href="http://typophile.com/node/101122" title="http://typophile.com/node/101122">http://typophile.com/node/101122</a><br>
      ** Bellisima Script: <a href="http://typophile.com/node/99939" title="http://typophile.com/node/99939">http://typophile.com/node/99939</a></p>
      <p>Others samples will be all the different digital incarnations of Garamonds, Caslons, Baskervilles, Bodonis, Didots, Clarendons, etc...  Recent Caslons, for example, are FB Williams Caslon Text and DaMa Kings Caslon</p>
