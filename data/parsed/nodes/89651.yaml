      <p>Some people have trouble coming to terms with the paradox that social harmony (read: people you get along with) does not lead to cultural progress*; that might be the reason the "other forum" (started BTW by a former student of James) seems to be going nowhere fast. In contrast, I thank my lucky stars that Nick Shinn has been a stalwart member of Typophile all these years.</p>
