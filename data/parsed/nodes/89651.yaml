      <p>So a bunch of Typophiles leave to start their own web site because they dislike hrant, yet they let people like Montalbano join?</p>
      <p>Maybe hrant is annoying, but he's not a vandal, at least. </p>
      <p>I'm kind of losing respect for a chunk of the type community here. Seems like a petty bunch of personalities (or, at least a petty bunch of online personas). </p>
      <p>I'm sure that's not how it truly is, but that's how it feels--at least from the perspective of us on the sidelines watching the online sparring going on.</p>
