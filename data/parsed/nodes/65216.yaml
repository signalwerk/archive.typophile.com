      <p>I don't understand the industry well enough to comment further on the market. My goal was just to get the best text face I could. I don't have a business head, but hopefully the good folks at Font Bureau do.  </p>
      <p>Thanks, Jos!</p>
      <p>Nick, it is the same, but from a screen capture, large. The others are scanned from the printed page, which are small point sizes. Everything makes a difference, which always amazes me. </p>
      <p>Hrant, thanks. On the g, as I mentioned above I don't like Caslon's g's, so I just made my own. In some cases, when I decided to depart from Caslon, I repented and returned to his forms, but not in this case.</p>
      <p>Kevin, there is a long answer to your question, which would be an essay on the history of Caslon and its revivals. And a short answer. </p>
      <p>The short answer: I think of basic three kinds of Caslon: based on text size, based on display size, and only roughly inspired by Caslon. ATF's Caslon 540 and its revivals are based on the display sizes, with more heavily bracketed, pointed serifs, and wider characters with higher contrast. The ones based on the text sizes include Monotype Caslon and Merganthaler Linotype Caslon and Adobe Caslon. These are narrower and more slabby, but Adobe has a bit more influence from larger sizes. Big Caslon is based on display sizes, the largest ones. There are a number of Caslons that are only loosely inspired by the original, like Ed Benguiat's Caslon 224, which is more Benguiat than Caslon--not that there's anything wrong with that. </p>
      <p>The thing I spent the most time on studying and trying to capture was the magic of Caslon's reading comfort. This has to do with a lot of subtle things put together: the weight and width of the characters, the spacing, the modulation of both straight and curved strokes, handling of the serifs.</p>
