    html: |-
      <p>Thanks for the appreciative words! It means a lot from my fellow typophilers. </p>
      <p>Stefan, as you know from working on Caslon, because of the big difference of different sizes and the rough printing of the original, "Caslon" is a bit of a typographic "Rorschach test", and different people see different things in it. Many revivals are very good, and very different one from the other--including Matthew Carter's Big Caslon, above. </p>
      <p>John (quadribloc), I don't think there is any danger of this getting mixed up with Baskerville. Actually, Abobe Caslon, being wider and because of the way it handles contrast is a bit of a "Caskerville". But in this the narrower characters (from Caslon's Pica 2 size) and lower contrast I think gives it quite a different look. Of course this is most obvious side by side. </p>
      <p>Actually, one of the notions that guided me is that a really strong typeface design, such as Times New Roman or Baskerville is recognizable just from its texture on the page. Such a distinctive look was my goal here.</p>
