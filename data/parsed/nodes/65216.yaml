      <p>William,</p>
      <p>Yes I'm aware of all the differences regarding point sizes. I have among other Caslon specimens a copy of the facsimile printed in the twenties (i think 1924). The book has many great reproductions of the original cut printed in various situations. This book have become the foundation from which my design have developed. I have then made certain choices, changes and additions from the original. Ligatures, SC, full CE and ornaments are things that have been added. Also a headline cut for the regular will also be featured. Hopefully reviews and notes of both our version will create a minor revival for the beautiful typeface that Caslon is.</p>
