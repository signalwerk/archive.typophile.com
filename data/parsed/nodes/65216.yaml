      <p>Thanks, Tiffany. Yes, it has been a thrill to see it used by really sensitive and creative designers. </p>
      <p>The main thing for me was seeing that the color was right on the page of a magazine, which I was really anxious about it. That was a relief. </p>
      <p>Then they did things that surprised me, like using it so small in very short columns, which turned out to be quite readable. And occasionally using the italic large, in color, which also worked.  </p>
      <p>Also it was nice to see that all those additional characters are useful. For example in doing the first line in small caps they could set "Boston", the name of the magazine, in small cap italics--and if need be in bold small cap italics, which their design pattern would call for in other circumstances. Also the small cap question mark they used after "What happened?" And in the new version there are small cap figures, so "Sept. 11" could be set with a barbed "1" that fits the small cap height. </p>
      <p>Oh, and thanks to your and others' urging on Typophile, in the final version I made the stressed "0" and barbed "1" in the old style numbers default, and put the traditional circular 0 and "small cap I" looking "1" in a stylistic alternative set, which you can choose if you want.</p>
      <p>At any rate, I can see that the months of work expanding the character set and kerning will actually be useful to good designers. </p>
      <p>They also sometimes use this text size quite large, negatively leaded, in a kind of decorative text block. That has kind of made me cringe, because I know that the incomplete version of the Great Primer size (18 point) in my computer will look much better when it's complete. One day...</p>
