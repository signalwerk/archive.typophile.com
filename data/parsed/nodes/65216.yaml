      <p>In my opinion, there are some specific factors about Caslon that explain why it was more popular than Baskerville, or either a Jenson roman or an Aldine roman. Not better, just more popular.</p>
      <p>Caslon and Times Roman don't seem very similar on the surface - and they are very different in proportions and x-height. But they both have sharp serifs and slanted stress.</p>
      <p>I think that Bell, Oxford, Baskerville, Bembo, Poliphilus, and even a modern roman that isn't condensed could all provide plenty of reading comfort - but Times and Caslon, without compromising reading comfort, also have features that make them seem more brilliant - and that is the combination that worked for them both.</p>
