      <p>I had missed looking at this thread originally. I think this typeface fills a serious gap, an authentic, yet not over-authentic, revival of Caslon that works well as a type for ordinary body copy.</p>
      <p>I do see <em>one</em> problem, although that problem is not a criticism of the typeface itself. The decision to give Caslon a heavier weight is one that I endorse as something that was needed. In this face, though, that was done with perhaps a tad too much restraint and caution. As a result, and given that, generally speaking, magazines deal with a typographically-unsophisticated public, I fear that some potential sales of this font will be lost because potential purchasers may decide they can get much the same overall visual effect with, say, Baskerville.</p>
      <p>Which marks the first time Caslon and Baskerville could be confused since the days of Ben Franklin.</p>
