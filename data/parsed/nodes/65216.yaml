    html: |-
      <p>Nick, I wasn't really seeking authenticity in letter form. What I was seeking was to get the overall dark-but-open look and the reading comfort. When I didn't like something, I just changed it. For example, the a and g aren't W.C. but W.B. :)  </p>
      <p>Very often when I tried to do Caslon better, I was humiliated because his proportions worked better. And so I often went back to Caslon in the regular roman. But some of Caslon's stuff is just screwy, like wildly different weights of caps. And he has some howlers, like the lower case italic s in some sizes. My theory is that he had an excellent eye, but just needed to get it out the door, so he just said, screw it, I'll get it better next time.  </p>
      <p>And speaking of the italic, mine is far from authentic, but nobody's revival is authentic, partly because the original isn't very good. The 19th century revivals are "improvements", and so even Founders Caslon, which is based on them, isn't authentic. But then, I don't really believe that trying to be authentic is worth the candle.</p>
      <p>Mine takes the original italic and redraws it both wider, which Carole Twombly also did in Adobe Caslon, and more upright, unlike what she did. I did keep the varied slants of Caslon's original, and not the revivals. I think that there is an inner logic in the variations that give a liveliness absent from other more regularized italics. But with the adjustments is more readable than Adobe Caslon's italic. So I'm pleased with the way it came out. The display sizes will be prettier, because of more contrast, when I get around to finishing them.</p>
      <p>I am also concerned about whether more kerning will detract from the look. I think not, but I'll only really know when I see it printed, in mass. The word space is not tight--it is 250 em units in the regular (x height 393). Also the letter spacing is slightly looser than Adobe Caslon, and the characters a bit narrower. Both of these are authentic to Caslon's Pica 2, and I think do contribute to the look and comfort that got Caslon its reputation. The overall effect is that it sets about the same as Adobe Caslon, but I think looks darker and more open because of various tricks I did--mainly following Caslon, but I'd like to think creatively rather than slavishly. </p>
      <p>The lack of kerning in "Yet", above, to me is a bit glaring, and I think the proper kerning that is in the final will be a help without messing things up. I tried not to over kern--a number of times I did and tested and then pulled back--but I guess I'll only really know for sure when the final version is used.</p>
