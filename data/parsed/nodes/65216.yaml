      <p>&gt; John (quadribloc), I don’t think there is any danger of<br>
      &gt; this getting mixed up with Baskerville. Actually, Abobe<br>
      &gt; Caslon, being wider and because of the way it handles<br>
      &gt; contrast is a bit of a “Caskerville”.</p>
      <p>I don't disagree; as noted, I wasn't criticizing the typeface itself, which indeed is clearly a Caslon and not a Baskerville.</p>
      <p>Rather, what I was trying to say was:</p>
      <p>- Mass-market publications generally cater to a fairly undiscriminating audience in typographic terms;</p>
