      <p><em>I do think that the high contrast types of the early nineteenth century were less readable, and that as a result Caslon seemed somewhat of a miracle when it re-appeared.</em></p>
      <p>Bill, if what you think is capable of influencing perceptions 150 years ago, that would indeed be a miracle!<br>
      Caslon's re-appearance was a novelty, given far more importance than it merited by historians such as Updike and Reed, who used it as a hammer with which to bash the popular modern style that was too trade for their taste. Its significance was probably more in motivating the Miller &amp; Richard "old style", which was a variant of the modern style. </p>
      <p><em>Caslon didn’t make as successful a transition to photo type...</em></p>
      <p>That's not supported by its appearance in many major campaigns of the photo-type era, eg:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Honda_6482.jpg"></div><p></p>
