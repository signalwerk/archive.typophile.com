      <p>Nick, I was talking about text type, not display. That example you have is Caslon 540, I think, which was and is excellent in all media, but it's a display type. In general the problems in transition to digital I believe were in text types, and display did much better.</p>
      <p>My memory is not seeing so much Caslon in the photo era--70s and 80s--and of course being an old guy I lived and read before during and after photo type. But I wasn't in the graphics business as you were, so I may be wrong. (I'm not talking about Ed Benguiat's Caslon 224, which is an attractive display type but not really Caslon.) </p>
      <p>My memory of the way the New Yorker looked then was that its Caslon was very anemic looking, but I may be confusing it with pre-photo type. The digital New Yorker Caslon, digitized based on the photo version by Bruno Maag, and worked on later by James Montalbono is pretty good.</p>
      <p>I think Adobe Caslon, the best text Caslon generally available till now, falls short of what Caslon was in metal as a text type, and I suspect it's been used more in display, though it was intended for text. </p>
      <p>Above I think I mixed up De Vinne and Updike. It was Updike who said that the revival of Caslon in 'Lady Willoughby's Diary' was "the chief typographic event of the mid-19th century." This was in the 20s, perhaps the height of Caslon's second wave of popularity.  </p>
      <p>The Miller &amp; Richard Old Style is not a 'modern' face as Bodoni is. It is obviously influenced by Caslon, and its c and e have a backslanted stress. But most notable the contrast is much less than 'modern' types. It was evidently intended to capture the qualities of Caslon for those used to reading 'modern' style, and is called 'Old Style' for that very reason. --Revivals of Caslon were also at first called 'Old Style' as well. Your view that it is simply a variant of modern I don't think will wash, as it clearly adopts and adapts aspects of Caslon's look. </p>
      <p>Also I believe that once the high contrast look was supplanted toward the end of the 19th Century, lower contrast types remained dominant for text ever since, at least in English speaking countries. </p>
      <p>Why lower contrast won out we can disagree about, but the general view today is that text type needs lower contrast for good readability. So in hypothesizing that readability was an important factor, I don't think I am out of line.</p>
