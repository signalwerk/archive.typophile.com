    html: |-
      <p>Thanks, David, Peter. I do appreciate your good words.</p>
      <p>&gt;How were these judgments made or substantiated?</p>
      <p>Caslon had a mystique and caché from the late 19th to mid-20 Century. Theodore Low De Vinne, revered as the greatest printer of the 19th century in the US, praised Caslon to the skies, which probably helped promote the mystique. George Bernard Shaw insisted that all his works were printed in Caslon. And every major foundry had several versions of Caslon in the early 20th century. Printers said, "When in doubt use Caslon."</p>
      <p>I don't know how much of this mystique had to to with readability, but I think a lot of it did. Writing in 1967 Ben Lieberman in Types of Typefaces wrote specifically about its readability, noting that the individual characters weren't so great, but the result in mass is very effective.</p>
      <p>My suspicion is that part of the mystique came from the fact that it was the first old style to be revived. I do think that the high contrast types of the early nineteenth century were less readable, and that as a result Caslon seemed somewhat of a miracle when it re-appeared. When Monotype started reviving other old styles, I think it took some of the edge away from Caslon. But there was still something distinctive in Caslon that a lot of publishers and readers liked. I think it was reading comfort, but I can't prove it.</p>
      <p>Caslon didn't make as successful a transition to photo type and digital type, as it had from foundry type to hot metal.</p>
      <p>&gt;How did that occur.</p>
      <p>Years of work. I just kept trying out different things until it worked to my eyes as a text face. Of course I have a definite idea about what combination of things was needed, but maybe it's better just to let the design speak for itself.</p>
    html_clean: |-
