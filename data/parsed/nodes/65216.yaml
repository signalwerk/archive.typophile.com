      <p>John (quadribloc), I think I understand your point, but I do think that the differences do affect reading comfort, though I acknowledge that it is a small affect, and that other classic faces are also very readable. I think your comparison of Caslon &amp; Times isn't on target. The pointed serifs, similar to Times New Roman, are in the Caslons influenced by Caslon's larges sizes, reflected in Caslon 540 and Big Caslon. The Caslons intended for text, the originals as well as Adobe Caslon and mine, have longer, less bracketed serifs.</p>
