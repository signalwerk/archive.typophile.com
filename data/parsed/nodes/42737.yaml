    html: |-
      <p>I vote for edit staying around. At one time or another we’ve all written something that came out backward and read horribly, and only realized it five minutes later. Being able to go back and fix it real quick keeps Typophile pretty civilized.</p>
      <p>One suggestion I do have is that edits be tracked with comments regarding the nature of the edits so that moderators can spot people who abuse the feature. I frequent a few other forums that handle edits this way, and it keeps people in line.</p>
