      <p>The problem with that, Patty, is that it can really change the whole conversation.</p>
      <p>Bob: You are a jerk.<br>
      Sam: No, YOU are a jerk.<br>
      Bob: You are a really stupid jerk.<br>
      Sam: No, you are the stupidest jerk face ever!</p>
      <p>Bob may regret that a year later and change the whole conversation:</p>
      <p>Bob: You are a fine human being.<br>
      Sam: No, YOU are a jerk.<br>
      Bob: I don’t know why you are being so hateful. I find you to be pleasant and caring.<br>
      Sam: No, you are the stupidest jerk face ever!</p>
      <p>(Kind of unfair to Sam).</p>
      <p>OK, yea, maybe a stretch, but I think the point is there.</p>
