    <p>In my opinion this feature is detrimental to discussion.</p>
    <p>Things are said and that is that. You can retract or change opinion, but to overwrite (or delete) a previous comment is disengenuous and unhelpful for discussion. Besides, you can’t do it in speech as much as you might want to!</p>
    <p>In a previous thread a message was removed that essentially changed the conversation and appearance of what I was saying. So much so, someone emailed me to say they were offended by what appeared to them was bullying, when in fact it was v. much the opposite.</p>
    <p>Let’s edit this feature out</p>
    <p>just me? ok...</p>
