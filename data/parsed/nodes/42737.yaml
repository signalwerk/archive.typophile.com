    html: |-
      <p>I disagree. This topic has come up before, ever since the update last summer which has caused edited posts to drop to the bottom and therefore out of context.</p>
      <p>It was a long tradition on the Type ID board for people to post a quick ID and then go back in and add the link. The edit feature was very important there.</p>
      <p>I often reread my posts and edit for spelling, grammar and clarity. I only (now) do this when there isn’t another post after mine, but there have been MANY times when I’ve wished I could change or add something and have refrained for fear of the thread not making sense.</p>
      <p>Additionally there have been times when I’ve said something in the heat of the moment and later regretted it. In those cases where I edit for content, I always indicate that I have done so.</p>
      <p>My suggestion would be to allow the edit feature as before, where the comment remains in its proper order in the thread, but for there to be a way for readers to know that the comment has been edited.</p>
