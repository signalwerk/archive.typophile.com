      <p>i reserve my right to edit anything i write if given the opportunity. if my words in digital archives are going to outlive me you can bet i’m going to optimize them as time and reflection allow.</p>
      <p>not sure if the edit in question was a self-edit or admin imposed ?<br>
      no reason for the latter beyond de-flaming, but that doesn’t seem to be a problem among this erudite group.</p>
      <p>what exactly does it mean to “abuse the feature” ?<br>
      as far as i can tell in this GUI i have no ability to edit anyone else’s posts, and i’m not a coder. self-editing for accuracy and clarity makes sense to me, possibly with some sort of notice : “edited”.</p>
