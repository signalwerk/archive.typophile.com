      <p>Switzerland is not part of the European Union (only an associate member). Otherwise this policy of ‘Swiss first’ would be illegal — all companies and governments in EU-countries are obliged to tender large(r) jobs. Excluding firms from other countries is punishable by enormous fines.</p>
      <p>. . .<br>
      Bert Vanderveen BNO</p>
