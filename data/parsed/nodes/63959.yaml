  html: |-
    <p>I have been tasked by a Swiss client to find either an independent Swiss typographer or type foundry to design a corporate typeface. Does anyone have an ideas of possible contacts. I have Bruno Maag - Dalton Maag, Lineto, B&amp;P and even though of Sibylle Hagmann at Kontour. </p>
    <p>Ideally it would be someone based in Europe.</p>
    <p>Thanks for any suggestions / help with this.</p>
