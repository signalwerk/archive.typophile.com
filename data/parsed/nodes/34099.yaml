    <p>I’m looking for a contemporary, bookish, Caslon-like, font. The closest I’ve come across is <a href="https://web.archive.org/web/20080907003024/http://www.vllg.com/Feliciano/Merlo/mudTyper+Weights/">Merlo</a>, but maybe something with a little less contrast.</p>
    <p>It is going to be display size, about 40pt.</p>
    <p>A few lines of text above and below a few lines set in Helvetica Black.</p>
    <p>Thanks</p>
