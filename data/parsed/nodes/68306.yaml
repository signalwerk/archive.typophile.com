  html: |-
    <p>Dumbarton Oaks Research Library and Collection Publications is sending out a call for bids to create new scholarly inscription font. We are inviting professional type designers to submit bids for the creation of Athena Ruby, a font for the publication of inscribed coins, seals, and other objects from the Byzantine world. Formal review of bids will begin 12 April 2010 and continue until the project is awarded.</p>
    <p>For complete specifications for the Athena Ruby typeface and the bidding process, please go to <a href="http://www.doaks.org/publications/athena_ruby_bids.html" title="http://www.doaks.org/publications/athena_ruby_bids.html">http://www.doaks.org/publications/athena_ruby_bids.html</a>.</p>
    <p>Inquires are welcome at <a href="mailto:AthenaRuby@doaks.org">AthenaRuby@doaks.org</a></p>
