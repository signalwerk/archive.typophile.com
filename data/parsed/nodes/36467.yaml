      <p>I always felt Herb Lubalin was set free on his spacing from the 1950s and the start up of the typositor. That was freedom from lead type. It allowed creative folks to place their letters where they wanted to - without using the knife.</p>
      <p>I knew many designers from that era - and can even remember a few late night discussions of "letterspace tighter -- tighter -- tighter..." *</p>
      <p>*It wasn't called "kerning" back then -</p>
