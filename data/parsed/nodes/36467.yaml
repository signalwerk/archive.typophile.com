      <p>Yes, there is overlap between 'Finer Points' and 'Elements'--I'm sure Bringhurst knows Dowdling. Also I think Dowdling I think overdoes it on the tightness of word spacing. --The main point of the book is to combat overly loose word spacing, which was apparently common in the metal Linotype days, when the book was written. </p>
      <p>However, it does go into more detail on a number of issues. It's a nice book, but not a 'must'. </p>
      <p>Incidentally, <a href="http://Book Typography" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://Book Typography</a> by Mitchell &amp; Wightman is excellent and quite comprehensive on type setting for book design. It's a bit expensive, but does cover everything that Dowdling does, I think, and a lot more.</p>
