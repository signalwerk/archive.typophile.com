    <p>Two different questions,not related with Herb Lubalin spacing type or the type spacing of Herb Lubalin:</p>
    <p>First. I'm an admirer of the work of Herb Lubalin but I can't find a book with writings and samples of his work. ¿What could you recommend?</p>
    <p>Second. I don't know how to handle the finer aspects of type spacing such as kerning heads, spacing punctuation marks or using the hair, thin, third, quarter, n and m spaces. ¿Is there a book on the topic?</p>
    <p>Héctor</p>
