      <p>Ok, I've found <a class="freelinking external" href="http://www.houseind.com/index.php?page=showfont&amp;id=4&amp;subpage=viewfonts" rel="nofollow">this page</a> with what I think are different weights/styles of Chalet. The 1970 ones are closest to what I'm after, but they have a slanted bar in the 'e'. Ideally, I'd want a straight bar.</p>
      <p><a class="freelinking external" href="http://www.bowfinprintworks.com/BauhausFaces1B.html" rel="nofollow">Harry</a> is pretty close too, but has a curved descender on the y, whereas I prefer a straight descender.</p>
      <p>The hunt is on!</p>
