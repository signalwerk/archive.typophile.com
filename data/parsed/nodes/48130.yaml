    <p>I rather like this kind of font: no serifs, no tail on either the b or the d. But I don't know much about typography, so I'd be very grateful if somebody could tell me the name of the font and/or the name of this <em>kind</em> of font (is there a family into which it belongs?).</p>
    <p>Many thanks,</p>
    <p>Sam</p>
