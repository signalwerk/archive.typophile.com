      <p>Hi Sam,</p>
      <p>Yes, I meant Chalet 1970, not 1960.</p>
      <p>Chalet was designed to be mixed and matched, so the 'e' could be from one of the other "years", although on closer inspection, your original sample looks more like a modified Avant Garde to me (the narrow 'r' gives it away).</p>
      <p> - Lex</p>
