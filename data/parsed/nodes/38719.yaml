    <p>I am doing a multiple master based interpolation project. I have the light and the extra bold as masters and will interpolate the rest of the weights.</p>
    <p>However, when I kern I would prefer that the kerning automatically will apply to both masters and the generatad weights in between. Right now the pairs I add only applies to the weight I have chosen to kern.</p>
    <p>Or... could I decide wheather to use the same kerning for all weights or kern the both weights differntly and then interpolate the kerning also?</p>
    <p>Anyone with this experience?</p>
    <p>Thanks in advance!</p>
    <p>Göran</p>
