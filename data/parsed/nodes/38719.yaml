      <p>Yes, I know. With interact I mean that I want to lets say kern the A + V on the extra light, and then switch to the Extra bold and se how the kerning pair will work on both masters. If I change the light, I also want the Bold o be changed automatically. I want to see it happen "live" is what I mean.</p>
      <p>What I'm trying to do is to develop a system on a font where the sidebearing-difference is related to the kerning so they could share the same kerning value. I convinced it will work on this particular font, but I would love to be able to compare them both instantly.</p>
      <p>For example, if the Light O has a sidedearing that is 60 on both sides and the Bold has 40 and a kerning pair is needed on O A. Lets say the preferred kerning is -20. That could be the same as -30 if the sidebearing was bigger on the light etc. So what I am doing is making a system from the start that relates to the sidebearings difference. Well, at least a try to do this :)</p>
      <p>I'm having problems describing this idea in english, but maybe you get the point?</p>
