    html: |-
      <p>Well, on some fonts, if seeing the kerning on both masters – the kerning could also be used as a tool to find small errors in sidebearings (or developing a system where the kerning and sidebearings work together). That is pretty much why I want this function to be available.</p>
      <p>I am not talking about a traditional serif font here, but if you take a look at Flieger Pro, it is easy to see the positive sides of being able to see the kerning right away on both masters.</p>
      <p><a href="http://www.autodidakt.se/index.php?page=flieger" title="http://www.autodidakt.se/index.php?page=flieger">http://www.autodidakt.se/index.php?page=flieger</a></p>
      <p>I could here decide that I want to use only one kerning (to save time) and then adjust the sidebearings according to that on each master to make the joining strokes "connect" to the next glyph where kerning is needed for that.</p>
      <p>I think it makes sense in a way. Especially when the sidebearings in <strong>not</strong> the same on both masters.</p>
