      <p>Aha ... it appears to be <a href="http://www.youworkforthem.com/font/T0235/ywft-hannah" target="_blank" rel="nofollow">YWFT Hannah</a>. Note that there is variation between upper- and lowercase glyphs.</p>
      <p>I found it via <a href="http://typophile.com/node/80075#comment-456211L" target="_blank" rel="nofollow">this 2011 Typophile thread</a> which features an image of the font's use by Starbucks as well as links to similar fonts.</p>
      <p>For anyone who is interested, I was led to that thread by <a href="http://typophile.com/node/81517" target="_blank" rel="nofollow">another</a> - which is a very useful, categorized überlist.</p>
