    html: |-
      <p>As cerulean said, in Metrics windows colors* you can change the color from purple to any color you wish, including black. By doing this the dependent letters don’t change their status, only the color in which they are shown.</p>
      <p>* I am on a Mac, so the path is: Fontlab Studio menu &gt; Preferences &gt; Metric windows &gt; Metric Window colors &gt; Dependant pairs.</p>
