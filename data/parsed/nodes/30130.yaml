      <p>I think James Puckett and I came up around the same era, on the cusp of some new technologies. I'm almost 29 and our era is old enough to remember old technologies (the REAL card catalog complete with REAL CARDS!!!) but young enough to embrace new ones. Its funny when I talk to my girlfriend (who is only a few years younger) because internet wasn't really up and running for me until I was a sophomore in college— she mentions having it in high school.</p>
      <p>I got my bachelor's degree in 2000 (in TV/Film), just missing the digital video revolution. Then I was shooting on Super8 and 16mm film, nowadays anyone with a handheld can post on You Tube. When I graduated, digital video wasn't remotely affordable or considered viable for the mainstream. Didn't take long for that to change. It was only 2001 when I started carrying a cell phone. Hell, Chris still doesn't even turn his on. ;)</p>
      <p>This is a new generation folks. We're in an era where people can literally do nothing and skate by. I think the design field (including type design) needs to start taking notice of people who don't come from wealth, went to a top notch school, or studied under a rockstar...or we're going to continue to spawn a legion of Paris Hiltons. Where are the underdogs? Where are the rags to riches stories?</p>
