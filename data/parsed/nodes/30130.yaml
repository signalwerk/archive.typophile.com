      <p>It wasn't really any more than today, it was just different. You couldn't get information out of a yet-to-be-invented electronic box, so you went and visited real living people and had long talks. You made things with your own hands instead of downloading something. When you left work, you just were gone and there was no Blackberry to fetch you back at any moment of the day or night. I am not saying it was better or worse, it was just different. As Terry says, my cell phone stays off 99% of the time not because I am against cell phones, I just don't need to be "reachable" 24/7 anymore now than 20 years ago. Solitude can be a cleansing thing sometimes.  Seeing people face-to-face is a cherished experience too--far better than Blackberry-barrage bondage.</p>
