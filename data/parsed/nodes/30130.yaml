      <p>Choz, fact is, when it comes to history, there's no substitute for dealing with original artefacts. And vast areas of the past have yet to be "digitized". </p>
      <p>All you have to do is pick up a publication from the mid 20th century and google though it. Most company names will draw a blank. So how can you find out anything online about their advertising, or the art directors or illustrators?</p>
      <p>And as for digitization, well, there was the debacle of microfiche.<br>
      What will scans tell us about letterpress?<br>
      Octavo's CD of Bodoni's Manuale doesn't have anywhere near enough resolution.</p>
      <p>The first comprehensive history of graphic design was Meggs, 20 years ago. His modernist perspective is being questioned. Helen Mazur Thomson (The Origins of Graphic Design in America) has a quite different view. In type history, the bible (Updike, 1920s) doesn't show a single sans serif typeface (which we are so interested in the origins of, today) -- despite their having been in use for 100 years by then. No wonder Ms Giggles is confused -- the questions she is being asked, like about serifs on Carolignian scripts -- would make good PhD theses. You could read dozens of books before you come up with an answer as succint as Peter's. And she's supposed to put all this 500 years of Western history, technology, and culture together and make sense of it, and it's a sidebar to a practical design course? </p>
      <p>There is a lot to be said for Miss Giggles "legally blonde hive mind" methodology. Getting your information from books is a narrow and passive way of inhaling the dominant narrative, why not ask the experts directly and see what the current POV is? It's a different awareness, and oh the serendipity.</p>
      <p><em>future generation</em></p>
      <p>Let's hope we're smart enough.</p>
