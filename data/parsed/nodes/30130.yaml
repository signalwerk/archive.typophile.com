      <p><strong>Do unto others...</strong></p>
      <p>It's simple. This is a site for those who like to talk about type and typography without having other peoples eyes roll back into their heads. I can post the most arcane question about type here and somebody other than me will be interested in the conversation.</p>
      <p>It is a great resource for those looking to understand the deeper things of type and typography, and to point people in the right directions when looking for answers.</p>
      <p>That being said, while many of the people involved in the discussions on Typophile might be educators, many are not. Most have spent years learning their craft, whether it be on the job or at school. Most have worked very hard to gain the knowledge and understanding that they have.</p>
      <p>Some might feel a bit, shall we say <cite>used</cite>, when someone who obviously cares enough about type to even be here won't take the time to properly frame their questions using standard grammatical customs such as punctuation and proper case. Some others might feel that although there are no stupid questions, there <cite>are</cite> lazy ones.</p>
      <p>As students, we have an obligation to respect the time and attention our teachers give us. Especially when they provide it for free. And as students, we have an obligation to apply the things we learn, even to things like questions posted to an online forum.</p>
      <p>No one here WANTS to get into a Flame war. Although entertaining in their own way, they do not lend themselves to a discussion about the deeper things of type and typography.</p>
