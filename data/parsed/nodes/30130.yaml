      <p>i am not familiar with miss giggles' history, but i am reading with interest the sincere and pained comments regarding her lack of capitalization.</p>
      <p>i am well-educated and fairly competent with respect to grammar, and i prefer to write in all lowercase. indeed, i'm certain some of you must be aware of herbert bayer, a teacher at the bauhaus, who said:</p>
      <p>"why should we write and print in two alphabets? both a large sign and a small sign are not necessary to identify a single sound. we do not speak in a capital a and a small a. a single alphabet gives us practically the same result as the mixture of upper and lower case letters, and at the same time is less of a burden on all who write." --herbert bayer from bauhaus 1919-1928</p>
      <p>this concept has motivated the design of various new single-case alphabets as well.</p>
      <p>apologies if both A) that was completely obvious, and B) the forums require only the most conventionally proper grammar and punctuation regardless.</p>
      <p>jarrod</p>
