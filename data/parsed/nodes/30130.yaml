      <p>Wise people admit their mistakes easily. They know progress accelerates when they do.</p>
      <p>Daniel John Gayle, could you please elaborate the thought <em>“while many of the people involved in the discussions on Typophile might be educators, many are not.”</em></p>
      <p>Erik Spiekermann has been teaching me a lot just with a few spoken words in NYC, I realized it was because of a mistake I did, this also led me to write this little <a href="http://homes.ieu.edu.tr/~asegalini/learning.html" rel="nofollow">page</a> for my students.</p>
      <p>I really think you can only learn from a mistake after you admit you’ve made it. As soon as you start blaming other people (or environment) you distance yourself from any possible lesson. But if you courageously stand up and honestly say “This is my mistake and I am responsible” the possibilities for learning will move towards you. Admission of a mistake, even if only privately to yourself, makes learning possible by moving the focus away from blame assignment and towards understanding. </p>
      <p>John Downer also kindly gave me a great piece of advice, and I have other people in Italy as well, my parents included, they actually don’t know what design is, but it happens in daily life that they do something good and positive for society. And sometimes a smile is enough.</p>
      <p>These advices run counter to the cultural assumptions we have about mistakes and failure being shameful things. We’re taught in school (ah, my memory), in our families (not my case), or at work to feel guilty about failure and to do whatever we can to avoid mistakes. This sense of shame combined with the inevitability of setbacks when attempting difficult things explains why many people give up on their goals : they’re not prepared for the mistakes and failures they’ll face on their way to what they want.</p>
      <p>What’s missing in many people’s beliefs about success (yes, not “fame”) is the fact that the more challenging the goal, the more frequent and difficult setbacks will be. The larger your ambitions, the more dependent you will be on your ability to overcome and learn from your mistakes.</p>
      <p>But for many reasons admitting mistakes is difficult, and the fact that our work represents us is an implied value in many cultures.</p>
      <p>For anyone than never discovers a deeper self-identity, based not on lack of mistakes but on courage, compassionate intelligence, commitment and creativity, life is a scary place made safe only by never getting into trouble, never breaking rules and never taking the risks that their hearts tell them they need to take.<br>
      Learning from mistakes requires three things : putting yourself in situations where you can make interesting mistakes ; having the self-confidence to admit to them ; being courageous about making changes.</p>
      <p>Merry Christmas and Happy New Year,</p>
      <p>Alessandro Segalini</p>
