      <p><cite>Daniel John Gayle, could you please elaborate the thought “while many of the people involved in the discussions on Typophile might be educators, many are not.”</cite></p>
      <p>I only meant that some are teachers by profession. Others are designers, etc. Some, like many artists, dabble in both. </p>
      <p>Not everyone has the patience and stamina to deal with questions from students. Not even all teachers are good at it. (I should know, because I tend to ask questions that put teachers on the spot. A very annoying habit, if you're a teacher who doesn't actually know what you're talking about...)</p>
      <p>But that's the point, if a student takes responsibility and poses a well thought out, properly framed question, then the onus is on the teacher. You gotta knock the teacher back onto their heels and keep them off balance, or else you'll never learn. If you slack and give them an "out" by asking a poor question that they can brush off, then you've lost and have wasted your breath.</p>
