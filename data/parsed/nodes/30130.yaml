      <p>&gt;Getting your information from books is a narrow and passive way of inhaling the dominant narrative, why not ask the experts directly and see what the current POV is? It’s a different awareness, and oh the serendipity.</p>
      <p>It's not a question of either-or, but both-and. Use the internet, use libraries, talk to librarians, go to book stores, talk to experts in the field, talk to other researchers, look at original artifacts. If you are serious about research in a subject you do all of them. I certainly have done all of these for my work on Caslon, and I think I learned something essential from each of them. And Nick, I'm sure you're doing all of them as well for your historical writing. </p>
      <p>If you want 'information nuggets', the internet is fabulous. If you want 'knowledge' in the sense of understanding of a subject you have to go to print and talk to people. For example, the best single book on typography, Bringhurst's, is not on line. So you have to go to print--and of course it's a lot nicer to read on paper as well. </p>
      <p>Let me repeat how great a resource librarians are. They are not the resource people think of for research, but they can be amazingly helpful--especially those associated with specialized libraries and fields. I am very grateful to James Mosley, former librarian at St. Brides, and Larry Oppenberg, who organized the Linotype library at the Museum of Printing. For me, they held the keys to the kingdom.</p>
