      <p>The issue of spelling, and use of lower case are of minimal concern to me in this situation. Of more concern to me is tactics in learning and self-teaching. I think if we are asked by a student, "What is 2 plus 2, and we answer 4, we have done a disservice. It would be more enlightening to explain the concept of addition and allow the student to come back with their own answer, even if it is wrong. In the first case, by saying 4, you have taught the student that the process for adding 2 numbers involves asking someone to give them the answer. In the second case, we are teaching them how to find an answer for themselves. We old farts will eventually die off and leave the next generation with nobody to ask :-)<br>
      I don't know if this kind of asking for "the answer" is an indication of education in the present or just a small example of a few of our youth today. Perhaps we need more of the Socratic method and less "Ask Jeeves" in our modern World?</p>
      <p>ChrisL</p>
