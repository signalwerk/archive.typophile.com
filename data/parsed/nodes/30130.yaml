      <p>Jarrod, this particular idea of Bayer was never taken up widely. Or to put it another way, it was almost universally rejected. People evidently find caps at the beginning of sentences a helpful marker. That is the answer to Bayer's question, and it is a very good answer, IMHO.  </p>
      <p>In any case, our eyes are trained to expect the the caps at the beginning of sentences, the word 'I' to be capitalized, etc., so that not having them is a distraction to the reader. You are making a decision to tax the reader by using all lc. </p>
      <p>I can see a point to dropping UC in instant messages, as the rush to get out the text is then paramount. </p>
      <p>But generally it is novices who think that Bayer had a great idea. (Students regularly come on typophile typing this way, but generally stop or stop posting.) In my view and the view of publishers generally, it's a bad idea.</p>
