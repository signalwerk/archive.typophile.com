      <p><cite i="" think="" google="" and="" wikipedia="" has="" destroyed="" the="" wonder="" beautiful="" process="" of="" learning="" for="" next="" generation="" students="" born="" with="" joysticks="" in="" their="" drawing="" bars="" soap="" commonly="" called="" cite=""></cite></p>
      <p>I agree with you in part; I think that young people often simply ask questions instead of looking for answers, not entirely out of laziness or desire for instant gratification, but because right now can be an odd, challenging time to do research. When I was in grade school, I learned to use card catalogs. Middle school coincided with user-friendly electronic catalogs, along with magazine searches and access to the internet in the form of Usenet, Gopher, and IRC. High school brought along electronic encyclopedias, newspaper searches, and  (the first time) I went to college the web started to be worthwhile. That's a hell of a lot to absorb, it still confuses the hell out of me, and younger college students (I'm 28) did not have the luxury of picking the technologies up one at a time like I did.</p>
      <p>In my opinion, all these different sources of information have yet to congeal into anything that most people find especially useful. There's so much information to find that it can be overwhelming. The only people who seem to cope well are nerds (myself included) and researchers with assistants and bottomless Lexis-Nexis accounts. Until some of this stuff settles out, and we have new generations of computer-savvy teachers and librarians to go along with it, research will be an oddball thing for kids unsure how to make any sense of the options.</p>
