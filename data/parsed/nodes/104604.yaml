      <p>Basically it was the zeitgeist of this period after world war 1. </p>
      <p>Futura was titled »Schrift unserer Zeit« it means the type of our time. Futura was influenced by the bauhaus and neue sachlichkeit movements based on geometric shapes. Also there where lots of other such faces like Erbar Grotesk oder Kabel. They are all very geometric and share similarities but where still different in detail.</p>
