    html: |-
      <p>When I first saw the question of this thread, I thought it was unanswerable. There is no "why" in the sense that someone had a newspaper, and melting rubber rollers were causing the ink to smear (that's why Corona was created).</p>
      <p>But why a font is created doesn't have to be an external cause. The artist could have had an intention in mind when creating it.</p>
      <p>Many popular books on typography will give this for Futura: basically, Futura is based on basic geometric shapes, straight lines and circles, and it was intended by the type designer to break with precedent by creating a type face based on such principles. (There were other such faces from that period, such as Kabel - but Kabel and Futura are <em>very</em> different typefaces, even though they share this attribute.)</p>
