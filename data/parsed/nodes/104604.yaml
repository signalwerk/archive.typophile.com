    html: "<p>The previously mentioned book on Renner will answer your question, especially chapter four. If you don't feel like buying the book, email me and I'll get you some info. It's been several years since I read it, but if I remember correctly the creation of Futura had something to do with an alternative to the insistence on the use of blackletter forms by some segments of German society and evolution (for lack of a better word) of that style. It also reminds me of this comment by Wassily Kandinsky: \"Every work of art is the child of its age and, in many cases, the mother of our emotions. It follows that each period of culture produces an art of its own which can never be repeated. Efforts to revive the art-principles of the past will at best produce an art that is still-born. It is impossible for us to live and feel, as did the ancient Greeks. In the same way those who strive to follow the Greek methods in sculpture achieve only a similarity of form, the work remaining soulless for all time. Such imitation is mere aping. Externally the monkey completely resembles a human being; he will sit holding a book in front of his nose, and turn over the pages with a thoughtful aspect, but his actions have for him no real meaning.\"</p>"
