      <p>ahh thanks! Sorry I've been out all weekend at a water polo tournament :P</p>
      <p>@Matt Squire: Thanks for the ideas, I'll take a look at what I can do.</p>
      <p>@aleksander: The client's logo is that leaf shape that was styalized for the intro. But if you have any ideas on how to add some more floral elements to the main site I would love to hear the!</p>
      <p>@MattB: Frankly I find your remark condesending. The clients insisted on having actions occur on rollover so I had no choice in the matter. But since we are talking about user friendliness you might want to get you company to use a different flash embed method so that there is no click to activate on you site ;)</p>
