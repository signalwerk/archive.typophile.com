      <p>There are plenty of Typophiles who can say much more much better than me about your typography.</p>
      <p>But as an interface designer, I've gotta say it: navigation which only functions on rollover (not click) is an absolute disaster. I accidentally switched pages on your site every 0.3 seconds, just because I moved my cursor. Were I you, I'd think real hard about switching to clicks and ditching the rollover gag, esp. since you're presenting yourself as a web designer.</p>
