      <p>Hi there,. </p>
      <p>Not amazing, the font used breaks up when it is in small sizes. My be due to the light weight of it, probably needs bumping up to regular. I think the leading is far too generous within the body copy. Needs tightening a little. The Where Fresh Ideas Grow intro probably needs tighter kerning, the letters read almost more as seperate letters rather than words. </p>
      <p>I think the kerning within the body copy is ok, its easy on the eye. </p>
      <p>It is also a simple layout which makes it easier to navigate and know where you are which is a nice thing. </p>
      <p>Overall its a nice little site, just needs a few tweaks here and there. </p>
      <p>M</p>
