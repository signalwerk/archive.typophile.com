    html: |-
      <p>The major stumbling point here is that there are a lot of elements here, and generally they are not working together, or even in tune with each other. Introducing the circle complicates things more as it is working more as an independent element rather than a mechanism to bring the composition together.</p>
      <p>Although this is coming across as not being a unique idea, that's ok, as long as it is put together well, I am sure the client will be happy, and most small business don't have the budget to have a designer spends days and days looking for the perfect new solution.</p>
      <p>I would suggest taking a step back, and look at the base elements of the design, which to me are fine, just need some thoughts and tuning, mainly with the type, layout and colour rather than graphic concept.</p>
      <p>How about working from the perspective of the name, animal rescue has a dynamic about it, yet to this point the colours and composition are quite corporate and pedestrian. Maybe it should be approached as a badge that someone would wear embroidered on a uniform - like, these guys go out and do rescues, not Joes pet shop.</p>
