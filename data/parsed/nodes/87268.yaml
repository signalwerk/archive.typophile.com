    <p>Hi Experts,<br>
    I need your help in coming up with a great color combination for this logo for an animal shelter and clinic in Arizona. </p>
    <p>I want to come up with colors that embody the animals as well as the professional location they are.</p>
    <p>They have had many poor logos created for them in the past. And, unfortunately that is the case for most non-profits. This is why I want to make this one GREAT!</p>
    <p>Please help. This is what I have come up with so far.</p>
    <p>Thanks in advance for all your expertise!</p>
