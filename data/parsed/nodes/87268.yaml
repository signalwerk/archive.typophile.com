      <p>Luma, I agree with you that the concept been used a lot. </p>
      <p>And not just for animal-related organizations; the Girl Scouts for instance use a similar figure-ground technique in their logo, and I'm sure there are countless other examples, too.<br>
      <a href="http://www.famouslogos.org/logos/girl-scouts-logo.jpg" title="http://www.famouslogos.org/logos/girl-scouts-logo.jpg">http://www.famouslogos.org/logos/girl-scouts-logo.jpg</a></p>
      <p>I'm just saying that figure-ground is a pretty basic design technique. It's been around a long time and will continue to be used long after we're gone. But I agree it's not the most original solution.</p>
