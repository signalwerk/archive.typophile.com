    html: |-
      <p>I agree that the slope on the left edge is distracting. Regarding the general concept -- a figure-ground effect using animal silhouettes -- it has indeed been used many times, but there are millions of logos in use and any logo you create is bound to have resemblances to others. The important thing is that it fits the client and is well executed. But I'd check to make sure that other animal-related companies in your area aren't using anything similar.</p>
      <p>The font looks a bit corporate to me; you might try something with a friendlier look.</p>
      <p>Regarding colors, I'd probably stay away from the blues and greens and try earth tones (maybe a rust color?).</p>
    html_clean: |-
