    date_raw: 27 Apr 2013 — 7:59am
    votes: null
    html: <p>The TypeEd site does look pretty good. As does its content. While I understand it’s presently fashionable, and the design of the site is in itself a marketing piece, I <strong>strongly</strong> recommend setting your body copy to black instead of grey. When viewed from even a slightly oblique angle it becomes very difficult to read on certain monitors such as my MacBook Pro. The primary navigation almost entirely disappears and I need to adjust my seat or screen in order to use the site at all {I didn’t even notice the braces around the wordmark until half way through composing this}. While my eyesight a little less than average—irregular astigmatism in both eyes, corrected to normal as best as possible with glasses—even with direct viewing I need to increase the type size by ~200% in order to read the majority of your content without squinting and straining my eyes (and deepening the wrinkles in my forehead ;). I’m confidant a salient typographic hierarchy can be achieved without resorting to grey text.</p>
