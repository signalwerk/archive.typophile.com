      <p>Chris, I'm also using a MacBook Pro and while their gray type is light I can read it, even when viewed at an oblique angle. And I'm in my 50s and wear bifocals. So perhaps your monitor is a bit lighter than mine, or your astigmatism is a factor. </p>
      <p>But I agree that it's too light (I especially notice it on the "We're not referring..." line). Normally I'm okay with gray type (for example I think Apple uses it well at their site), but TypeEd went a little too light.</p>
