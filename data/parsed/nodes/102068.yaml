    <p>Hey, folks. I am new at book design, and working on a self-published nonfiction book. The subject matter is partly about indigenous people and the wild, and I'm having a hard time settling on the typeface.</p>
    <p>If you had to pick a bookface that exemplified wild grace -- not the grace of a ballerina, but the grace of a mountain lion, dirt and burrs and all -- what would you suggest? To me, it seems like there should be a slight edge to it, just a bit rugged, in its tone if not its actual forms.</p>
    <p>Details:<br>
    -The book has a high word count, long stretches of text: needs to read comfortably for the long run.<br>
    -No subheads. I don't really think I need a bold weight at all. It would be nice to have something with a light or display weight.<br>
    -I prefer humanist models, though I wouldn't say that's absolute. Not a big fan of high-contrast faces.<br>
    -A face that is decently tested, and has something of a track record already; I am totally not qualified to be making a whole lot of adjustments.</p>
    <p>Any thoughts appreciated, any questions welcomed.</p>
    <p>Thanks! Have fun with it.</p>
