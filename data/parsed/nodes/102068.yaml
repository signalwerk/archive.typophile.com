      <p>Great -- interesting stuff.</p>
      <p>For me, Chaparral is definitely powerful, but not what I'd call graceful. It's more like a linebacker.</p>
      <p>I'd been thinking of Beorcana, so I like the suggestions of Hiroshige Sans and Lucca. I might be more drawn to the standard Hiroshige (from what I can tell on screen, which isn't a hell of a lot). Lucca has a lot in common with Beorcana, but I like the greater angularity of the italic. Very new!</p>
      <p>Has anyone seen Beorcana on paper in an extended setting? I know there's a book of poetry out there, though I haven't seen it in person. I'm interested in impressions of its readibility.</p>
      <p>I'm also considering Maiola, Seria, and maybe Romanée. I don't know if the last two have that feral touch I'm looking for, but they have their own grace.</p>
