      <p>BTW, if this is self-publishing, your troubles are just starting. You're going to need print-bind work. In my somewhat less than humble opinion, printing with the offset press is still superior to any xerographic technique, at least for text.</p>
      <p>Offset short-run book production now goes down to as few as 500 copies, maybe less. Short-run book printing is a specialty.</p>
      <p>You'll want to use a house sheet, for cost reasons. Probably that will be Gladfelter's Natures Natural, most places stock that. Unless you have a lot of images, and they are extremely important, avoid a white sheet like the black death.</p>
      <p>Considering all the inevitable compromises, the "best" short-run printer I know of now isn't in Michigan, but North Carolina. Long way to ship to Oregon.</p>
      <p>Call the University of Washington Press, and in the production department, ask for Tom or Pam. I'll get you last names if you need them.  As quickly as possible describe your project -- esp. number of copies needed,  and ask them for a short-run printer they'd use. If it's Thomson-Shore, that's back to Michigan. OK, but get two other quotes. Include Edward Brothers/Lillington (North Carolina) in the quotes. Sheridan will be cheaper, but how should I say this, they "work best" with experienced people?</p>
      <p>If Washington can recommend someone on the west coast, consider that printer carefully, it will save you a bunch in shipping costs.</p>
      <p>Frode was (maybe still is) a typesetter. If you prefer his font to Huronia, just tell him what sheet (paper) you'll print on, and he'll advise you as to the best weight of the fonts to purchase. Trust him, he will know. </p>
      <p>If you prefer Huronia, what you get is just fine for an uncoated sheet, printed offset.</p>
