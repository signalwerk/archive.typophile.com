      <p>Romanée in digital form won't print. You'd have to use metal. If you want something similar, use Trinité.</p>
      <p>You really seem to want to bring the Italian Renaissance into your book...I'd sorta, kinda put Beorcana in that category as well. </p>
      <p>Unless the typeface is more important than the story, with the typeface selection, you want only a whiff, a very subtle hint, almost unnoticed. I once suffered through a noir detective story set in Palatino...it was never very comfortable. Similar with <cite>The Pacific</cite>, all the gritty ugliness of World War II brought to you via Adobe Jenson (again with the Renaissance).</p>
      <p>If you're going to force me beyond generalities, I'd say take a look at Huronia, now available in two places</p>
      <p><a href="http://www.rosettatype.com/Huronia" title="http://www.rosettatype.com/Huronia">http://www.rosettatype.com/Huronia</a></p>
      <p>or probably from Ross himself, at</p>
      <p><a href="http://tiro.com/huronia/" title="http://tiro.com/huronia/">http://tiro.com/huronia/</a></p>
