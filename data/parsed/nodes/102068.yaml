      <p>Wow, great suggestions.</p>
      <p>Satyr: amazing. In one sense, with all the curves, it seems kind of soft, and my feeling for wild grace is that the face might be a little harder, leaner. But the other opposition here is between the straight lines of industry and modernity, and the arcs of the earth. (The irony isn't lost on me that I'm looking for something wild in one of the most detailed and machined of the arts.) I'm going to have to sit with that one for a while.</p>
      <p>Huronia: Y'know, I never looked too closely at that face before, but now it's starting to show me something. Nice nominee.</p>
      <p>Trinité: Oh, I thought about it. Just the price on narrow face, regular weight roman &amp; italic: well, I'll see if I can get some charitable contributions towards a poor, deserving book project. I actually hadn't looked for a digital Romanée yet, and if it's not available, that's fine, I'm not wedded to it.</p>
      <p>On mixing Italian Renaissance with the subject, I'm not set on a humanist face, I just tend to like the proportions. And the subject of the book really goes back before printing, back before writing even, so there's no "appropriate" historical connection. It's kind of a fun challenge, really: how to evoke a wild world, not draw undue attention to the typeface, and try to foster an illusion that's it's not really being printed at all...</p>
      <p>And Charles, thanks for all the info on printing the thing. I don't look on the design as troubles, but I'm prepared to beat down the printing if it so much as looks at me cross-eyed. Or maybe whimper in a corner, I don't know yet. I had to read your post three or four times just to make sure I understood what you were telling me. The initial print run will probably be around 1000 copies, and I'm intrigued to look at printing it offset; not so intrigued to be working with a printer across the country, I'm usually a little more hands-on. I'll have to do a lot more research; I may have a few more questions, if you're willing.</p>
      <p>Thanks, everyone.</p>
