      <p>A typeface itself is never a political statement. Every political connotation is based on the USE of a typeface, NEVER on it's design. Futura is connected to the ideas of the Bauhaus. The pure design was not political, nor was it non-humanistic. The opposite is true. The designers at the Bauhaus believed, that simplified letters would be easier to read and easier to learn. This was a important issue at that time in Germany because there were 3(!) alphabets in use at the same time (Roman, Blackletter and German Cursive). So it was a very humanistic approach to come up with a new, simpified design.</p>
