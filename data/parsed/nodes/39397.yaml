    html: <p>Equating geometric type with fascism is really missing the mark. The Constructivist notions behind geometric design were entirely humanist. Malevich worked out these notions of simple shapes and color as an attempt to create universal forms of expression that anyone could understand, this was a reaction the nihilism spreading through Europe and Russia as a result of the first World War and the implosion/annihilation of the Russian aristocracy. Everything Malevich did was rooted in the folk art of the Ukranian peasants he grew up around, as he explored Cubism and Cezzanism he broke art down further and further, trying to make it less local and less ephemeral. When Lissizky spread these ideas across Europe, including at the Bauhaus, likely including Munich where Tschichold and Renner would have picked it up, it was anything but fascist, he was working to create an egalitarian world that would be more accepting of the Russian Jews, himself included.</p>
