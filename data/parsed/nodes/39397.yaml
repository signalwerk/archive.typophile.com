      <p>&gt;the nazi swastika ...structure is very close to Futura’s</p>
      <p>I think you are way off the mark here. They both have a monoline feel, but there are lots of fundamental differences that I see. Some of these I would call 'inter-subjective' in that almost everybody reacts the same way. And some are objective. </p>
      <p>The most fundamental of these is that Renner was trying for a classical feel, and the swastika is romantic (provoking strong emotion) and belligerent. Renner, influenced by the discovery that the eye reads when it is at rest, wanted to avoid any sense of motion in his letters. He even tried to have a square topped m and n, so that there would be no sense of the pen's motion in an arch branching from a stem. </p>
      <p>By contrast, the innovation in the Nazi symbol was Hitler's twisting the swastika--which is always oriented horzontal-vertical in Hindu and Buddhist iconogrophy--by 45 degrees, and having it on a white circle. Having the symbol rest on a point, and within a circle, gives it a sense of motion, like it is a buzz saw that is going to cut up whatever is in its way. </p>
      <p>Also Futura is not actually geometrical and monoline. It is very cleverly full of tapers and adjustments. For example, the X, which would most resemble the swastika if it were trying for that feel, is quite different. The bottom left to top right strokes are tapered toward the center, and they are not cut off at right angles, but along the horizontal. The geometry is objectively different, and subjectively quite different, giving a restful, balanced look, rather than an aggressive, dynamic look. </p>
      <p>In sum, emotionally they are quite different, and this is based on objective differences. </p>
      <p>As others have said, the Nazis used all kinds of typefaces, and that doesn't mean the the typefaces were Nazi. For example, black letter, which is most associated with Nazism, was developed by Christian monks, and Nazism was anti-Christian.</p>
