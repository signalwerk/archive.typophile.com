      <p>I doubt that the Reich government adopted Futura in 1941–42 because they liked it more than any other specific Roman typeface. Rather, since Futura was one of the most popular typefaces from 1928–1933 (and even thereafter), there was a lot of it around.</p>
      <p>By the late stages of the war, most type foundries had had their production switched over to wartime support, meaning that there wasn't any new type being cast. You had to used type you already had. Type wears down and goes bad. So if you want to use something for official uses, you'd better pick something that a lot of printers have in quantity or you can forget about design guidelines and unity.</p>
      <p>Renner remained in Germany in part because he felt too old to be able to start all over again in another country. I also don't think his foreign language skills were so keen (although, that didn't stop Mies). You should also remember that almost all German artists and designers stayed in the country, and that many of them also served in the military (either willfully or unwillfully) leading some of them to their deaths and or imprisionment and deaths. What I'm getting that is that it was the norm not to flee. These days, we hold up a few famous names, like Gropius, Mies, Bayer, etc. who emigrated. But Germany had a huge designer class before 1933, and most of them stayed put, even a lot of them who didn't have it very well at all with the regime.</p>
      <p>If Renner "compromised" himself by working on a government typeface, that would be unfortunate, but it isn't really damning and it doesn't warrant comparison with someone like Speer, who designed projects that used slave labor, for instance. We can remember it, but I don't see how it warrants a rewriting of the Renner biography. Some people's cases do need revisiting. But Renner? This seems like a hunt for some fresh red meat.</p>
