      <p><em><br>
      &gt;I certainly don’t want to rewrite Renner’s autobiography</em></p>
      <p>Well, you certainly shouldn't re-write his autobiography :-) One writes an autobiography oneself! I was just talking about his biography, stories about his life that others have written, and stories which we tell ourselves now. One could rewrite that, but one should also have good reasons in order to do so.</p>
      <p><em><br>
      &gt;I think this is unaccurate, there was plenty of types available in the same amount</em></p>
      <p>Yes, Memphis for instance, and maybe Venus, and certainly a lot of real serif typefaces. These were all used during 1933–1945 as well. The Nazis were equal-opportunity exploiters. They used whatever they could to get their message across with. If you do a little searching (with Google?), you can find a thread where Andreas Seidel (Cottbus, Germany) expands upon which typefaces were available during that that time, and how they were used, or rather misused. This has been a rather popular topic on Typophile over its seven-year history…</p>
      <p><em><br>
      &gt;and the design of Futura can indeed be qualified as “fascist”, not in a provocative way<br>
      &gt;but in a serious, analytic way: don’t you think?</em></p>
      <p>No, I don't agree with this at all. I don't see what is fascist about it. Sure, the concept was universal and forward-looking, and is inspired two two sorts of ancient imperialisms (Imperial Rome and the early Holy Roman Empire), but that doesn't make it fascist. I think that is reading too much into how it was used, and trying to deposit some of that n the minds and hands of its creators ex post facto.</p>
