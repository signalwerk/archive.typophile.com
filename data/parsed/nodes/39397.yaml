      <p><em>but the only sans serif I’ve seen used on official papers and signs from the NSDAP between 1941 and 1945 is Futura.</em></p>
      <p>Well, you obviously haven't seen very much or you haven't looked very closely.<br>
      There were dozens of Grotesques around&nbsp;- every foundry had their own. Erbar was there before Futura, and there were Kristall, Super, Berthold, Nobel, Neuzeit, to name but a few of the geometric designs. Most used for everyday jobbing work were faces like Akzidenz Grotesk, Scheltersche (that's what the Bauhaus had in their cases), Block, Hermes, Woellmersche, and other heavy-duty type.</p>
      <p>As has been pointed out, the Nazis were nothing if not pragmatic technocrats. They would employ anything that served their purpose and make up an appropriate ideology on the fly (like declaring Blackletter to be "Schwabacher Judenletter"). One of the reasons for abolishing Fraktur was the fact that the printers had simply run out of founders type, while Monotype casters weren’t used very much in Germany.</p>
      <p>Futura, apart from the philosophical approach behind its restrained, pseudo-geometric shapes, still shows quite a bit of Art Deco influence, a prevalent style in the early 20s. Just look at the A, M, N, V, W in the lighter weights with their points protruding beyond the baseline! Futura caps, properly spaced, still look elegant in stainless steel across any entrance.</p>
      <p>I have the complete range of Klimsche Jahrbücher, the annual for the German printing and typesetting industry, from 1921 until 1941, and they give you a better impression of what went on in the industry than reproduction in design books.</p>
      <p>In short: your attempt to connect Renner and the Nazis is ill-conceived, badly researched and altogether too transparent</p>
