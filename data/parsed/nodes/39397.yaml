      <p>I would like to put my word in for Ralph who hit the nail on the head when he said :<cite> Every political connotation is based on the USE of a typeface, NEVER on it’s design.</cite></p>
      <p>Expanding on that point; I want to add that saying that a design is essentially 'fascist' or 'French' or 'femme' is a reading or interpretation of the design. Put another way it's just a cultural overlay. This kind of imposition is unavoidable in my view. None of us are without visual culture and it's network of associations. However, we can be aware of the process and realize that our overlay says more about the reader and the culture of the reader than about the design. This also means that there are not going to be more or less common readings of a design but those readings shift with time. But they are still just readings - and readings that will change. This shifting over time points to the non-essential nature of the design itself. This might seem like hair splitting but it isn't. It actually cleans things up enormously. Obviously people will continue to associate a design and their reading of it and even conflate them. But conflation is a mistake.</p>
