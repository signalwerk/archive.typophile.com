      <p>I wouldn't trust a designer's rationale.</p>
      <p>Things have a life of their own, and more than one <em>auteur.</em><br>
      I would say that the unusual lower case letter forms of Futura that didn't survive the first cut are indicative of Renner's intentions to produce a radical design somewhat different than the actual end result--and when one looks at the rejected two-bowl "g", there's no way that could be considered modernist or reductive, in comparison to, say, Kabel or Erbar's "g".<br>
      Then there are the "typographic" nuances, the refinements added to the letterforms by the foundry; joint adjustments, that sort of thing.</p>
      <p>Futura's strange combination of capitals that have the proportions of ancient Rome, with a "schulebuch" lower case, doesn't seem to exhibit any culturally-informed connection!--they just look cool together and happen to work nicely. So the design logic is entirely visual and right-brain.</p>
