      <p>Dan:</p>
      <p>Thanks for the comments. I certainly don't want to rewrite Renner's autobiography, for I'm sure He didnt willingly work with the 3rd reich, and I do know how easy it is to judge these events with today's eyes, I guess for him it was just a question of surviving the best He could. I'm just rather curious about the fact that this is truely poorly documented. One point I don't agree with you is when you say that the nazis used Futura mainly because it was available in large quantities in the printhouses: I think this is unaccurate, there was plenty of types available in the same amount, and the design of Futura can indeed be qualified as "fascist", not in a provocative way but in a serious, analytic way: don't you think?</p>
