      <p>OK, so:</p>
      <p>- Sorry for the 'autobiography', I - of course - meant biography.</p>
      <p>- You name other typefaces, such as Memphis et al, but the only sans serif I've seen used on official papers and signs from the NSDAP between 1941 and 1945 is Futura.</p>
      <p>- Why do i describe Futura's design 'fascist' : fascism cn be shortly described as a totalitarian rejection of humanism, and by extension a celebration of purity (purity of the race, and so on). Futura, in my opinion, fits the requirements: its shapes are very geometric, very radical, it also, in a way, 'rejects' the humanist serifs, slabs and even humanistic sans: it bears the influence of the entity over the person, of the machine over the human being. Its shapes are pure, straight, simplified and rationalized to the extreme. It is, according to me, a typographic metaphor of the fascist ideology - but don't misunderstand me, I LOVE Futura.</p>
      <p>- About europe: I made a mistake regarding the time it was introduced in France, and here what Fernand Baudin says in la Revue Suisse de l'Imprimerie n.1, dated 2001: ' Charles Peignot renamed Futura Europe in order to mask its german origins. Maximilien Vox said more than once, in front of me and other people, how hard it has been for him to persuade Peignot to go to Frankfurt, at Bauer, in order to negociate with the germans. Vox even threatened to resign from the board of Deberny &amp; Peignot '. </p>
      <p>Again, thanks for your comments.</p>
      <p>dr</p>
