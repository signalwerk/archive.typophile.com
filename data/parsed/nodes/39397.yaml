      <p>The way I remember it (and I looked it up), the book about Renner (by Burke) states that he had quite a hard time under the nazi's, being blacklisted and his state pension withdrawn. Only the fact that he received royalties from his typedesigns and intermittent work kept him and his family afloat.<br>
      Re Speer and Renners involvement in a state-santioned letterform, Burke writes that this was a tangential involvement, in cooperation with the Bauer Foundry. It seems that he was paid 10000 marks, but for what is unclear. To put things into perspective: a lot of anti-nazi artists and craftsmen worked for the Generalbauinspektor (Speer) — it was considered to be non-political. Among the non-nazis employed were Peter Behrens and Paul Bontaz. (Burke, pp 168–9).</p>
      <p>. . .<br>
      Bert Vanderveen BNO</p>
