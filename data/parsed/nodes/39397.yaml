      <p>This "great man" history of Futura is simply not true.<br>
      It was introduced in the USA in 1929, and used by everyone for everything ever since.<br>
      Every type shop had it.<br>
      The idea that its use by one or two famous designers shaped its popularity is lazy history, derived second-hand from graphic design histories.<br>
      Take a look at USA mass market publications from the 1930s and you'll see.<br>
      Take a look at any type shop specimen.</p>
      <p>Here is the earliest use of it in America that I've come across, from <em>Harpers Bazar</em> fashion magazine, August 1929.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Ambrosia_3875.png"></div><p></p>
