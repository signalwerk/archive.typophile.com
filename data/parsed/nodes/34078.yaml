  html: |-
    <p>I recently noticed that the blog Visualmente has started a featured called <a href="http://visualmente.blogspot.com/search/label/Tipogr%C3%A1ficamente">“Tipograficamente”</a>, in which the authors plan to ask 100 designers about the typefaces they love and the ones they hate. My Spanish is okay enough that I can understand most of what the designers say (and so far there’s one profile in English).</p>
    <p>From the <a href="http://visualmente.blogspot.com/2007/05/100-profesionales-100-tipografas.html">blog</a>: <em>La tipografía más usada, la preferida y la más odiada, en una encuesta única que nadie se animó a hacer. La opinión de los mejores, de aquí y de allá, en castellano, en inglés y en portugués. Desde esta semana, 100 profesionales opinan sobre las 100 tipografías de su vida en VisualMente. Lo que nunca nadie dijo de las tipografías.</em></p>
