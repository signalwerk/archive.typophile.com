  html: |-
    <p>I'd like to compile a list. Perhaps to transfer over to the wiki eventually. Even though many browsers still do not support @font-face AND many foundries won't allow it, I think it would be useful. And I hate to get complicated, but can you copy/paste the information from the foundries EULA which states the accord?</p>
    <p>I'll start:</p>
    <p>Foundry: exljbris<br>
    Quote: You may use this font for Font-Face embedding, but only if you put a link to <a href="http://www.exljbris.nl" title="www.exljbris.nl">www.exljbris.nl</a> on your page and/or put this notice /* A font by Jos Buivenga (exljbris) -&gt; <a href="http://www.exljbris.nl" title="www.exljbris.nl">www.exljbris.nl</a> */ in your CSS file as near as possible to the piece of code that declares the Font-Face embedding of this font.</p>
