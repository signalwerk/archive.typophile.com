      <p>Great idea...</p>
      <p>Are you only interested in foundries that support both, or is this an either/or question.  Also licenses may be hard to understand - but FAQ's not so much. </p>
      <p>H&amp;FJ case in point (for both points)...</p>
      <p><cite>What's involved in using fonts on websites?</cite></p>
      <p>HTML doesn't offer any way to force a web page to render itself in a typeface that the viewer doesn't have, but fonts can be used to create different kinds of images:</p>
      <p>— Bitmap graphics (gif, jpg, png) There's no difference between using a font to create a printed page and using it to create a pixellated image. As long as the person creating the images has licensed the fonts, no additional license is needed.</p>
      <p>— Vector art (swf) Because Flash files embed actual portions of a font's sourcecode within themselves, our font licenses require that designers observe some basic safety precautions when publishing Flash files. Text in Flash files must be static (not dynamic), the files must embed only a subset of the character set, and the "Protect from Import" option must be enabled when the files are generated.</p>
      <p>— sIFR (Scalable Inman Flash Replacement) sIFR is a great technology that brings rich typography to the web through a combination of Javascript, CSS and Flash. To use an H&amp;FJ font with sIFR, purchase an additional single-computer font license for the webserver itself, and then configure sIFR's customize_me.as file in two ways to prevent unauthorized users from accessing the system: first, set the allowedDomains array to include only the domain of your website (instead of "*"), and then set allowlocal to "false" before publishing the .swf to the web. </p>
      <p>The emerging @font-face tag within Cascading Style Sheets (CSS) will hopefully lead to a secure technology that allows fonts to be used in web pages. But at this time, no such security measures exist, so the use of this tag with our fonts constitutes the illegal distribution of the font software. This type of use is therefore specifically prohibited under our End-User License Agreement.</p>
      <p>If you are exploring other technologies that aren't covered here, please contact us at <a href="mailto:info@typography.com">info@typography.com</a>.<br>
      </p>
      <p>Via <a href="http://www.typography.com/ask/faq.php?faqID=15#Faq_15" title="http://www.typography.com/ask/faq.php?faqID=15#Faq_15">http://www.typography.com/ask/faq.php?faqID=15#Faq_15</a></p>
