      <p><cite>Alternative technologies (like Typeface.js, Cufón)</cite></p>
      <p>I’ll reiterate a point I’ve already raised about these: if they get used we’ll end up with people ripping font from them and distributing those fonts. That means fonts with a foundry’s names trademarks on the outside and a bunch of degraded letters, bad OT code, and bad naming tables on the inside (similar to the bad pirate fonts that appear to have come from Flash files). And the less intelligent users out there might assume that the foundry just makes crappy fonts. Personally, I’d rather just license for @font-face and let people stick to pirating the original.</p>
