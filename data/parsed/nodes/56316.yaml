    html: |-
      <p>To come back to the original idea:</p>
      <p><strong>sIFR:</strong><br>
      This would probably very useful for the users. Though a simple "yes" or "no" would not suffice since some foundries limit the use within Flash to static text fields and/or subsetting. </p>
      <p><strong>What about PDF embedding?</strong><br>
      Many users are not aware that PDFs used online might require an additional license or might be limited to non-commercial PDFs.<br>
      For example Typotheque:<br>
      <cite>A license extension is available at the cost of $350 per year that allows Typotheque fonts to be embedded in any read-only PDF document.</cite><br>
      Or our EULA at fonts.info:<br>
      <cite>You need an additional license to produce commercial PDFs like E-Books or PDF magazines. </cite></p>
      <p><strong>@font-face</strong><br>
      This would be useful although limited to EOT at the moment. As far as I know there is not one foundry yet that would allow @font-face in general for all fonts –&nbsp;not even exljbris.<br>
      Adobe (T. Phinney): <cite>Our current license terms allow for EOT usage (with a URL binding). Our license terms do not allow font linking to original format font files. </cite></p>
      <p><strong>Alternative technologies (like Typeface.js, Cufón)</strong><br>
      Would be interesting to hear about those from the foundries, but current EULAs don't mention any of those technologies. But we could probably assume commercial foundries don't allow them, because they require the fonts to be converted and uploaded (without protection) to a public webserver.</p>
