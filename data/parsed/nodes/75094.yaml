  html: |-
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/meadowcondtop_typphile_5863.png"></div><p></p>
    <p>I guess the subject line says it all. Before the weekend we released <strong><a class="freelinking external" href="http://www.fountaintype.com/typefaces/meadow" rel="nofollow">Meadow Condensed</a></strong> designed by Göran Söderström. A version that saves a little space but has the same character. Meadow Condensed works well on its own or as a family member. Character sets are identical, finish and quality is the same, it's just narrower to make room for more words.</p>
    <p>Meadow Condensed is well suited for strong headlines all the way down to small size settings.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/text_meadowConde_4026.png"></div><p></p>
    <p>Just as the first release – Meadow Pro – Meadow Pro Condensed range from Light to Extra Bold with matching italics, in a total of 10 fonts. It come with Small Caps and a wide range of OpenType features, allowing extensive and versatile use.</p>
    <p>If you already bought a Meadow license you can upgrade by simply subtracting you initial cost. Please [http://www.fountaintype.com/contact|contact us]] for more information.</p>
    <p>For a closer look and  got to the <a class="freelinking external" href="http://www.fountaintype.com/typefaces/meadow" rel="nofollow">Meadow page</a></p>
    <p>Download the updated <a class="freelinking external" href="http://www.fountaintype.com/specimens/65/original/FTN_Meadow_Complete.pdf" rel="nofollow">PDF</a>.</p>
    <p>have a nice week</p>
    <p>Peter Bruhn<br>
    <a class="freelinking external" href="http://www.fountaintype.com/" rel="nofollow">Fountain</a></p>
