    <p>Hello all my name is Erica i just wanted to post some thoughts of mine on here, im starting out in this world of type so i dont know to much but i have had alot of thoughts.  please feel feel to comment thats why were here :)  </p>
    <p>I have always been a creator of sorts and went to many different font sites to check out the latest designs, though it upset me i never could get the “free” font to download, i could always look at them.  i didnt really have to much use for them then because i didnt do that kind of creating.  but now as i have started my way into the graphic design world i find that right now i am using text alot and new and different fonts could come in handy. right now im just using the regular apple fonts that came with my MAC (which im falling in love with)  but i think i would like to venture outward and take advantage of these designer fonts.  but i have come to a question, when i am designing mock logos for any of my design classes are these internet fonts ok to use? is that a normal thing to do?  when i go to make a real logo for a company one day will it be ok to use one of these internet designer fonts for a company, or must you come up with your own? im not sure how all that works.</p>
    <p>and mostly it fasinates me how someone can design an entire alphabet of designer fonts that do not look anything like another, where do you get your ideas???</p>
    <p>as i have scaned through just about every forum topic on this web page i can see how far advanced most of the people here are, and makes me feel that there is a ton more to learn and that there is alot more involved with designing things that i do not see yet.  the longest read was about<br>
    “hidefweb solutions” this person had 6 pages of series of logos for this one company each page of design was different from the next but the content of each page individually were variations of the style being portrayed.  and the company said that non of them hit to home, they wanted a text based logo, not so much an image because they were expanding.  well there were some really good varieties of designes going on there, but to fathum that the company could not pick one??  hmmmmm i must be missing something.  it must be my untrained eyes.  what am i missing </p>
    <p>last this one will stray off topic, have you ever seen the movie “HERO” wow good stuff well in there they explain the relationship of how thier ancient scrips (the writting they do with a large brush and paper)  goes hand in hand with sword fighting, now how beautiful is that? i want to learn how to sword fight.  just check out the movie  :)</p>
    <p>now most of you might beable to reference which discussions i speek of here in the forums, because yall get around, this place is pretty awsome, i should hope to beable to submit worthwile comments in the future. :) good luck everyone have a good night</p>
    <p>ERICA</p>
