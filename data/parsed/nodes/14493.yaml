      <p>Erica, welcome! Yes, it’s not “usual” to design a complete font... But it’s a unique challenge with special rewards, and you seem to already have an important ingredient: you think it’s fascinating!</p>
      <p>Using a free/cheap font for a logo: that’s actually safer than using such fonts for text! Because you have a chance to look closely at the beziers and fix stuff as needed; for text a font has to be adequate out of the box. To be fair though, not all free/cheap fonts suck. And some reputable foundries even give out quality free fonts, sort of as bait.</p>
      <p>BTW, I’ve always wanted to learn swordfighting. There are different styles I guess; to me the stuff at the Olympics is least interesting, because it has neither romanticism nor spirit; I prefer what might be called “Conan-style”, but most of all I would love to learn to properly use a wakizashi. The katana seems too... loud. I actually have a Japanese sword set (although it’s stored half a world away now) but the most action it’s seen was against a side of ham.</p>
      <p>One parallel between swordfighting and making type I guess is the level of concentration required: putting your life on the line and making a good quality font cannot be done casually (even though few type designers rely on type to make a living).</p>
      <p>hhp</p>
