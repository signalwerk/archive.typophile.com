      <p>It’s ok to do work based on already existing fonts, IBM logo is based in Berthold’s City font for example. Many logos are based on modified versions of already existing fonts and then there are many hand drawn logos too.</p>
      <p>It is up to you to decide if a font face is appropriate for a work or a new lettering needs to be done.</p>
      <p>A dirty little secret: I made my own logo from scanned letters of DTL Nobel (a font I didn’t wanted to buy).</p>
      <p>Héctor</p>
