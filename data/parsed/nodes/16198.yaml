      <p>I don't think you'd have to worry if you replaced your printer, but it is quite common for foundries to require that outside agencies have their own license for fonts you want them to print.</p>
      <p>Some foundries allow you to supply fonts to an outside agency if the fonts are only used to output your work, but that's rather unusual. Many, but certainly not all, foundries will allow you to make a PDF for output.</p>
      <p>Again, the simple fact is that the EULAs can say whatever the foundry wishes...they can require you to only use their fonts to promote dental hygiene if they wish: it's their prerogative. (Within the limits of the law.)  It's up to you to read and understand the EULA before you buy. If you don't like the terms, or you don't understand them, by all means contact the foundry.</p>
      <p>Different foundries have different terms, and you should take those terms into consideration when buying. It even happens that the same font can be offered on different terms from different vendors.</p>
