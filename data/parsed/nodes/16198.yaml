      <p>I agree that the one output device restrictions seems very, well, very restrictive, and I've never been clear what it really means in practice. </p>
      <p>If I have 2 printers, e.g. an inkjet and a laser printer, and they're both connected to my computer, well, yes, it seems clear that a "single output device" EULA would see me buying a second license. </p>
      <p>But, as Louis has pointed out, surely I don't need to buy a new license when I replace my printer. </p>
      <p>Well, what about if I decide I'll never print Galliard on my inkjet, only on my laser. Surely that's okay, right? </p>
      <p>Now I'm on a slippery slope: can I change my mind, and say I'll only use it on the inkjet starting tomorrow? Would it be okay if I unplugged one printer when I was using the other? </p>
      <p>Clearly it takes no time at all for the situation to become absurd. So, the best thing really is to contact the foundry and ask for different terms, and hope they rewrite their EULA, if not for everyone, at least for you.</p>
