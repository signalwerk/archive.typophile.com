    html: <p>Frankly, I think this particular wording is a hangover from Ye Olden Days, when font outlines had to be loaded onto the output device (like to old Compugraphic photosetters). With all the newfangled contraptions available today, the outlines are downloaded to the printer when you send the job and, in a typical printshop workflow, that might mean sending it to a laser printer for rough proofing, then a color laser for intermediate proofing, a color plotter for final proofing, and a film or CTP imagesetter for final output. Foundries should perhaps <em>read</em> their own EULAs and adjust them accordingly to reflect working realities, consarn it.</p>
