      <p>Welcome to the world of EULAs (End User License Agreements). It's a hot topic here, as a search of this forum will reveal. See<a href="http://typophile.com/node/14264" rel="nofollow"> The End User's Manifesto.</a></p>
      <p>Every font foundry is free to set their own terms of use, and the font user is free to accept them, negotiate with the vendor, or look elsewhere for their fonts. </p>
      <p>The terms offered by this licensing agreement seem pretty clear to me, but it's possible that if you contact Carter and Cone you could obtain different terms, or you might find that a multi-printer license is within your means. Certainly a license for Galliard CC is a worthwhile purchase, if you can obtain it on terms you can live with.</p>
