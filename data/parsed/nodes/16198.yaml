      <p>Louis,<br>
      I agree with Crossgrove; if you contact C+C (again) and tell them what your intended use is, hey should be willing to offer you a personalised EULA.</p>
      <p>As has been stated elsewhere on this site, many EULAs have been written and re-written to deal with particular circumstances, like say: A purchaser buys a font license, she then embeds particular phrases set in the font in PDFs which she sells for profit. As a result, she is eating into potential sales of the font. (This is purely hypothetical.) The foundry would likely, and understandably, respond with a knee jerk: banning all embedding.</p>
      <p>The result of this protectionism is that honest people are made to feel like potential criminals, and are restricted in the use of the fonts. All because of a few bad apples.</p>
      <p>I salute you for wanting to legally license "Galliard" because it is a great typeface, and you want to raise the visual quality of your documents.<br>
      c</p>
