    <p>I am a beginner to the world of typography and have what seems to be a rather basic question about typeface purchasing.  Carter and Cone's licensing agreement (for ITC Galliard CC) includes the following paragraph:  </p>
    <p>"The Software is licensed for use on a single output device such as a laser printer, film recorder, high-resolution typesetting device, or other such imaging device. If you need to use the Software on more than one output device, you need to upgrade to a multi-printer license."</p>
    <p>Can anyone elucidate this for me?  How can they expect a user to utilize a single printing device?  (Note that I'm attempting to purchase a typeface for the first time and am hesitant to spend the money being unsure of what I'm getting.)</p>
  html_clean: |-
    <p>I am a beginner to the world of typography and have what seems to be a rather basic question about typeface purchasing.  Carter and Cone's licensing agreement (for ITC Galliard CC) includes the following paragraph:  </p>
