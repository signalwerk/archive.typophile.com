      <p>Oldnick was right.  I just got a reply from Cherie Cone wherein she stated that Fontshop's C&amp;C license is a tad on the ancient side.  She forwarded me C&amp;C's current EULA.  The critical section appears below:</p>
      <p>"The Software is licensed for use on a single central processing unit (CPU). If you need to use the Software on more than one such device, you need to upgrade to a multi-user license."</p>
      <p>That is, "single output device" should now read "single central processing unit".</p>
      <p>Now that that's clear, and it seems to be a rather common restriction, I assume that I am permitted to install the font on any one computer at a given time.  That is, surely I may install the font on an infinte number of PCs provided that I've removed it from the previous unit(s), correct?</p>
      <p>If I am to print through outside sources, which I am now presuming to be legal, am I correct to assume that the font need not be installed on such PCs in order to print my work?  Is it possible to re-work documents on PCs without the font installed?  (I presume it is not.)</p>
