    votes: null
    html: "<p>Allright guys! <br> <br>Thank you all for your thoughts, it really is an interesting matter. <br> <br>This is how I decided to do it - in the middle left window, reading upward, aligned to the top right of the window. <br> <br><img src=\"http://www.typophile.com/forums/messages/30/14453.jpg\" alt=\"MC signage\"> <br> <br>Motivation: if you look on Google-images for conference stand, very large corporate banners etc, the all go upward. I do think the reason for this is the downward=negative and upward=positive explanation. I think the book spine is just a different discussion, although personally, being from The Netherlands, I am used to downward titles, and also the point that it's readable when the book is on its back seems logical to me. <br> <br>But since this signage is more like the \"vertical text on a big object\" matter than a title on a book cover, I choose the upward option. Also consider that the windows are very big, the text as you see it in the picture is almost 1 meter high! The alignment changed because think the text should have some ground under its feet, so its now grounded on the right side of the window.  <br> <br>Thanks for the advice and the food for thought!</p>"
