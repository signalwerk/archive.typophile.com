    html: <p>I’ve had many discussions about the issue, both working on books and on signage, but have never been able to ﬁnd a written/explained rule. <br><br>Book and magazine spines go up in most european countries; in the <span class="caps">US</span> and Britain they go down so you can read them straight when they are lying ﬂat with the cover up (that’s what I’ve been told here in the <span class="caps">US</span>). <br><br>Back home -Spain- we would always argue a lot about it, and then follow the accepted use; upwards on spines for the local market, downwards on spines for english speaking countries, and upwards on signage, banners, etc. <br><br>I would also go with your right option,&nbsp;upwards.</p>
