    html: "<p>there is a paragraph on Binding in ‘Designing Books’ Hochull, Kinross: Hypen Press. pg 101 <br><br>it suggests if the spine is broad enough to have it horizontal. then goes on to say:  <br><br>‘If they are vertical, traditionally in German-language books text runs from the bottom up (except on large-format volumes that are laid front cover up in the bookshelf, so that the spine title can be read normally). Since the spine title functions primarily when a book is standing upright on a shelf, this arrangement is certainly more rational—because one inclines one’s head more readily to the left than to the right—than the international standard, according to which text should be made to run from the top down. That one can read this spine text better when the book is lying on the table is not a factor in the matter; by then the reader knows which book is lying there (and anyway, many books also have their title on the&nbsp;cover).’  </p>"
    html_clean: "<p>there is a paragraph on Binding in ‘Designing Books’ Hochull, Kinross: Hypen Press. pg 101 <br><br>it suggests if the spine is broad enough to have it horizontal. then goes on to say:  <br><br>‘If they are vertical, traditionally in German-language books text runs from the bottom up (except on large-format volumes that are laid front cover up in the bookshelf, so that the spine title can be read normally). Since the spine title functions primarily when a book is standing upright on a shelf, this arrangement is certainly more rational—because one inclines one’s head more readily to the left than to the right—than the international standard, according to which text should be made to run from the top down. That one can read this spine text better when the book is lying on the table is not a factor in the matter; by then the reader knows which book is lying there (and anyway, many books also have their title on the&nbsp;cover).’  </p>"
