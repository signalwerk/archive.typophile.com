    html: <p>David, <br> <br>For the most part you design with rules. But the rules don't make the design. More often than not I would prefer the work of a non designer following well established typographical rules than a bad designer abusing them or working without knowledge. Admittedly however, some brilliant designs are successful by playing with, or teasing both the rules and their makers. <br> <br>This particular problem, I believe, has no traditionally established rules. Maybe one, running stacking type downwards, are to some, an offence. But this specific design problem has irritated many in the past. Solutions are only to be found by compromise of established reading habits and therefore reasonably, leads to, as we can see, "individual" solutions.  <br> <br>The "individual solution" is Caspar's, he is the designer, and he shows us his solution. <br> <br>And from what I can make of it, a good one. <br> <br>Now I could say what I would do, however that would be my solution, not representative of Caspar. His individual solution is of paramount importance. <br> <br> <br>Gerald Giampa <br>P.S. Hope you got insurance. I think when I fell I banged my head and now I am a nice guy. <br> <br> <br> <br> <br> <br> <br></p>
