    html: "<p>I prefer the 'top-down' orientation. (I'm an American and a lefty, if that's relevant.) <br> <br>My rationale for my visual preference (beyond any theories about my physiological/ geographic biases) is in 2 parts: <br> <br>1) If I'm not mistaken, readers' eyes move across the tops of letterforms (lowercase), along with examining the word shapes formed by the acsenders and descenders. The top-down allows more air space (so to speak) for the eye to read the forms. <br> <br>2) The window frame acts like a sitting point for the type. To my eye (and therefore my mind), the type feels 'seated' on the left, as though it's using the wooden frame as a base. Its placement looks more considered to me. <br> <br>A caveat: upon second (and subsequent) glances, the righthand one feels more active to me, as though it's moving up, rather than sitting nicely still. If you're looking for a more active, irreverent, young, (blah, blah, you get where I'm going) appearance, the righthand may end up serving your purposes better. Use the potential difference from the 'norm' to your advantage.  <br> <br>Ultimately, I agree with Jacques' first post, just ask some people you trust in the office about it informally. (Just be careful, maybe some designer will want to use that orientation for your stationary...)</p>"
    html_clean: "<p>I prefer the 'top-down' orientation. (I'm an American and a lefty, if that's relevant.) <br> <br>My rationale for my visual preference (beyond any theories about my physiological/ geographic biases) is in 2 parts: <br> <br>1) If I'm not mistaken, readers' eyes move across the tops of letterforms (lowercase), along with examining the word shapes formed by the acsenders and descenders. The top-down allows more air space (so to speak) for the eye to read the forms. <br> <br>2) The window frame acts like a sitting point for the type. To my eye (and therefore my mind), the type feels 'seated' on the left, as though it's using the wooden frame as a base. Its placement looks more considered to me. <br> <br>A caveat: upon second (and subsequent) glances, the righthand one feels more active to me, as though it's moving up, rather than sitting nicely still. If you're looking for a more active, irreverent, young, (blah, blah, you get where I'm going) appearance, the righthand may end up serving your purposes better. Use the potential difference from the 'norm' to your advantage.  <br> <br>Ultimately, I agree with Jacques' first post, just ask some people you trust in the office about it informally. (Just be careful, maybe some designer will want to use that orientation for your stationary...)</p>"
