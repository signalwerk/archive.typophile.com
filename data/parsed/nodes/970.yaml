    html: <p>Good morning from Finland. <br><br>Well, I am used to, left eye up, reading down. It also makes marketing sense if a book lies cover up to produce them in that fashion. At least some sense. Obviously it is not in fashion everywhere. <br><br>However I don’t think the window will often lie “cover up” as it does not have one. <br><br>Mind you if the window went sideways it would not be a question. Or if it was, the question would be, should the sign read right way up, or, upside down? <br><br>My advice however is to pick what you like the best as long as it is the window on the left. Left eye up, reading down. <br><br>However I would remove those stairs because it will certainly be hard for anyone using them to read that sign. Also about my earlier observation, I would not make things easy for those folk that look in your window!! <br><br>So that said. Ignore all of my previous advice and pick the window shown on the right. <br><br>And leave the stairs where they are. <br><br>? <br><br>Gerald Giampa <br>Lanston Type Company <br><br></p>
