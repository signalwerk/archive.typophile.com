    html: "<p>Another way to think about it is:  <br>Where would one normally look for the start of the text?  <br><br>On printed matter, the ﬁrst place you look by habit is  <br>the top. Text, whether it is right-to-left or left-to-right  <br>goes top to bottom. So running vertical text down  <br>from the top implicitly follows this rule.  <br><br>Out in the world, everything starts from the ground  <br>and goes up. There is no <i>top</i> outside to use as  <br>a reference point, after all. So, text looks more “natural”  <br>going from the ground up (or from the horizon up).  <br>On the other hand, if the text was near the top of a  <br>building, running down might be better. <br><br>I guess my point is that it’s more important where you  <br>think the eye will go ﬁrst and start the text&nbsp;there.</p>"
    html_clean: "<p>Another way to think about it is:  <br>Where would one normally look for the start of the text?  <br><br>On printed matter, the ﬁrst place you look by habit is  <br>the top. Text, whether it is right-to-left or left-to-right  <br>goes top to bottom. So running vertical text down  <br>from the top implicitly follows this rule.  <br><br>Out in the world, everything starts from the ground  <br>and goes up. There is no <i>top</i> outside to use as  <br>a reference point, after all. So, text looks more “natural”  <br>going from the ground up (or from the horizon up).  <br>On the other hand, if the text was near the top of a  <br>building, running down might be better. <br><br>I guess my point is that it’s more important where you  <br>think the eye will go ﬁrst and start the text&nbsp;there.</p>"
