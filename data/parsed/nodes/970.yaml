    html: <p>Vincent, <br> <br>For the most part I agree. But, more often than not, it is impossible to run the name of the volume horizontal. Also you probably can read the book title from the cover when lying down. A stack of magazines? The top one, stack of books the top one. But books tend to have more personality than magazines. Well. at least that's the way it was in my day. <br> <br>Besides, I do not subscribe to the theory that just because you are left handed, you are left eyed, or visa versa. <br> <br>Also I am not sure we can move our heads to the left or right any easier. My old noggin just gets dizzy no matter how I look at it.  <br> <br>Kids, be kind. <br> <br>I figure we just read from left to right. There are those that don't. <br> <br>If we rotate our heads to the position of "left eye up", that eye is closer to the beginning of the text because it is up. If printed the opposite way, then the opposite is true. Unless we tilt our head the other way and theoretically all things become equal. Assuming, naturally, that the head is central to the text. Have you ever noticed how difficult it is reading the spines tight against the wall. My books closest to the wall left, I keep my books that are right reading upwards. My right reading downwards books I keep closest to the right hand wall. Try it, you will thank me later. Especially when you are as old as me. <br> <br>But, still we have those stairs, I think you may fall down if you choose the picture on the left, increasing liability insurance. <br> <br>So still, I stick to my position, at least for now, with sign as illustrated in the right hand picture. <br> <br>I think, it was the right hand picture. Oh well! <br> <br> <br> <br>Gerald Giampa <br> <br></p>
