      <p>'JR': confirming Plate or <a class="freelinking external" href="http://www.myfonts.com/search/copperplate" rel="nofollow">Copperplate</a>, awfully squooshed<br>
      'Painting &amp; Decorating Services': no Dutch 766 but <a class="freelinking external" href="http://www.typography.com/fonts/hoefler-text/overview" rel="nofollow">Hoefler Text</a> (comes bundled with iOS) and again terribly stretched</p>
      <p>EDIT: even hardly squooshed, can't be Hoefler Text. Fivos is right, should be Sabon Italic.</p>
