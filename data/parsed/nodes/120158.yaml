      <p>"JR" looks like an expanded <strong><a class="freelinking external" href="http://www.findmyfont.com/index.php/fonts/font-preview?fset=Linotype%20%2F%20%28Commercial%29&amp;ffam=Copperplate%20Gothic%20LT%20Pro%20-%2033%20BC&amp;fid=0014ffdfff748f9902f5d870580cf2fa&amp;fsize=60&amp;text=JR&amp;fit=1" rel="nofollow">Copperplate Gothic</a></strong>  to me, available from Adobe, Linotype, Bitstream, Tilde (and probably others)<br>
      "Paintings &amp; Decorating ..." must be an expanded <strong><a class="freelinking external" href="http://www.findmyfont.com/index.php/fonts/font-preview?fset=Linotype%20%2F%20%28Commercial%29&amp;ffam=Sabon%20-%20Italic&amp;fid=5cffb15740f70db33b21ec0b09ea7830&amp;fsize=60&amp;text=Painting%20%26%20Decorating%20Services&amp;wrap=2" rel="nofollow">Sabon (Italic)</a></strong> available from Adobe, Linotype, Monotype and probably Berthold</p>
      <p>PS: Ryuk, if you look at the details of /&amp; /g /s you can see it's Sabon not Hoefler Text</p>
