      <p>this old, small, tattered red-covered hardbound book called 'painting signs and sho cards' by e.c. matthews from 1920 that my dad had. it shared commercial art and composition philosophies as well as the intricacies of using type and lettering to set the mood and speaking to your audience or market. very little about set type but mostly about handpainting and fountain pen lettering. timeless design principles came from this little unassuming book that i still have to this day.</p>
      <p><a class="freelinking external" href="http://ia301525.us.archive.org/3/items/howtopaintsignss00matt/howtopaintsignss00matt.pdf">I found a pdf of it!</a></p>
