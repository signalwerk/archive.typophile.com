      <p>Robert Bringhurst, The Elements of Typographic Style<br>
      Jan Tschichold, The Form of the Book<br>
      Rich Hendel, On Book Design<br>
      The Trial of Six Designers: Designs for Kafka's The Trial (1968 Hammermill piece, truly one of my most treasured books!)<br>
      Adrian Wilson, The Design of Books<br>
      Many copies of old AAUP Book, Jacket, and Journal Show catalogs</p>
      <p>I also treasure my copies of<br>
      Avital Ronell, The Telephone Book (designed by Richard Eckersley)<br>
      Jost Hochuli, Designing Books<br>
      Joseph Blumenthal, Typographic Years<br>
      Joseph Blumenthal, The Printed Book in America<br>
      A Century for the Century: Fine Printed Books from 1900 to 1999<br>
      and especially my copy of the issue of The Princeton University Library Chronicle honoring P. J. Conkwright</p>
      <p>And there's one more I am having trouble recalling the name of, and it's at home: it has lots of Merle Armitage spreads in it! Seems like it has a bright cloth &amp; endpaper combo, like black and yellow? Something about the Modern Book? Anyone?</p>
