    html: |-
      <blockquote><p>
      It’s strange how the appreciation for a font features may vary with knowledge and this trend seems to be systematic.<br>
      Observing around me — not only among professionals — it seems the less you’re experienced in graphic and/or type design, the more you love strictly geometrical fonts with round shapes.<br>
      So younger designers and non-professionals will tend to love fonts like Futura, or other round-like geometric fonts; they would prefer Didot to Bodoni as more minimalistic, etc.<br>
      Me as first, I loved Didot but found a bit difficult to use on small sizes.<br>
      Today, analysing modern (=modern means 18th century) typefaces, I discover how Bodoni’s construction, balance and optical details are much more readable than Didot making of it a typographically better font the Didot itself.</p>
      <p>But the fact persist: the more you dig in typography, the more your taste and expectations drive towards the opposite path than “common people”, to read as clients, opinion leaders, but also graphic designers without solid typo background.</p>
      <p>Of course you can say there are two audiences and you must address each one in a different way, but when you’re working on a visual identity project and have to choose a typeface, it can find yourself in a paradoxical situation.
      </p></blockquote>
      <p>I do not totally agree with the thought according to which a young and unskilled graphic designer is used to chose a geometry based typography. I think instead that his choice would fall much more easily on unconventional ones, independently  if based on geometry or not.</p>
      <p>The point changes if we talk about the real design of a typeface. Probably the young type designer, that decides to create a typeface, opts for a geometrical one because, during the construction of single glyphs, he will rely not only on his eyes, of which probably he still do not totally trust, but also on well defined geometric rules.</p>
      <p>The more he will practice in type design, the more he will trust in his eyes and the more he will leave geometrical path (IMHO of course).</p>
