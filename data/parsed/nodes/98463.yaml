      <p><cite>I think instead that his choice would fall much more easily on unconventional ones, independently if based on geometry or not.</cite><br>
      You're right but I didn't even considered this case :p </p>
      <p>As written, it's coming from the observation of design student works, vernacular designs, and my own past experience.<br>
      Maybe it's statistically irrelevant,  but I feel in graphic design there is a trend for simplicity; geometry is an answer to that.<br>
      So it happens graphic designers, when looking for a font, search the same pure geometric simplicity. As it's really time taking to learn to look at letter shapes (I'm still a junior in the field but realise very well how hard is it) for an inexperienced (in typography) graphic designer, it's really difficult to feel the text-line rhythm is not perfect.<br>
      On the other side, as a typographer you know a purely geometric font can't be good. However it can "look as" geometric; if you compare lettershapes at 2000px size you'll see it isn't (BTW one of the  reasons Gotham sells so much?)</p>
