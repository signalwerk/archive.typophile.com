      <p>Filippo, your observation on youth is bang on.</p>
      <p>Novice type designers may well have sophisticated ideas about design in general, but it takes time to develop the special drawing skills needed to engage type design—in which the past and its masters are so evident— at a deeper level (although this is not necessarily more useful to typographers!)</p>
      <p>As well as geometrical forms, other viable area for novice font makers are hand-drawn styles, distressed/ﬁltered styles, and revivals.</p>
      <p>The ﬁrst digital font I made was <a href="https://www.fontfont.com/fonts/fontesque" rel="nofollow">Fontesque</a>, in 1994. It was drawn during the Grunge/Deconstruction era; at the time I already had some skill at vector drawing, through 5 years using Illustrator, but knew dick all about how important hinting and alignment zones were to the Type 1 PostScript format. Fortunately, such knowledge was unnecessary in that kind of bouncy wonky typeface!</p>
