      <p>But the fact persist: the more you dig in typography, the more your taste and expectations drive towards the opposite path than “common people”, to read as clients, opinion leaders, but also graphic designers without solid typo background.</p>
      <p>Of course you can say there are two audiences and you must address each one in a different way, but when you’re working on a visual identity project and have to choose a typeface, it can find yourself in a paradoxical situation.</p>
