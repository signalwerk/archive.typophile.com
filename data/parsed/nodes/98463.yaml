      <p>Nick, that's true, but to me Filippo is essentially alluding to simplicity. A line is simpler than a circle, which in turn is simpler than an oval, which is simpler than a bézier - that sort of thing.</p>
      <p>The problem Filippo is that simplicity is a matter of style, not function; the way humans perceive things (especially when in "deep reading") is not at all simple. Here's a very primitive but telling  example: if you make a mathematically perfect square where all the sides are mathematically equal in thickness you'll end up<br>
      with something that looks a bit oblong and with horizontals that look thicker than the verticals.</p>
      <p>An individual might personally prefer things to look simple, but that doesn't lead to Good Design (which is about helping many people, sometimes without them realizing :-).</p>
      <p>hhp</p>
