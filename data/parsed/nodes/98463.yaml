    <p>Hello all! I'm new to the forum and my name is Filippo. I actually work as graphic designer in Italy and I'm specialized in brand identity (Sorry for my bad English!!!).<br>
    I'm very interested in typography and would like, one day, to start creating a complete set of glyphs. Unfortunately right now I understood only some fundamentals of typography and so I'm here to ask you, experts, some questions that turns in my mind! Hope you will be so kind as to answer. :-)</p>
    <p>First of all, in my typographic works, created generally for logotypes in brand identities, I'm always looking for a strict geometrical relationship between every single curve: relationship that can be reduced to circles and lines and tends to exclude Bezier curves as in these three screenshots of works: <a href="/wiki/https%3A/%252Fdl.dropbox.com/u/54593770/screenshot_01.png" class="freelinking" rel="nofollow">https://dl.dropbox.com/u/54593770/screenshot_01.png</a> , <a href="/wiki/https%3A/%252Fdl.dropbox.com/u/54593770/screenshot_02.png" class="freelinking" rel="nofollow">https://dl.dropbox.com/u/54593770/screenshot_02.png</a> , <a href="/wiki/https%3A/%252Fdl.dropbox.com/u/54593770/screenshot_03.png" class="freelinking" rel="nofollow">https://dl.dropbox.com/u/54593770/screenshot_03.png</a> .<br>
    Now I wonder if is always possible to use this method or I've to reason in other ways to create good glyphs. For example, taking an authoritative font as the Univers by Adrian Frutiger: is every single glyph amenable to a series of circles and lines linked one to another? Is it possible to see a drawing?</p>
    <p>Don't you think that a purist geometrical construction (perhaps not always possible) gives to you a more solid and stable base compared to Bezier curves? I don't know, I feels like Bezier curves are not properly really definable in every single smallest aspect. They seems...inaccurate compared to the strength of a circle, of a simple geometrical form. Don't you think?</p>
    <p>Thank you in advance for every flash of inspiration!!!</p>
