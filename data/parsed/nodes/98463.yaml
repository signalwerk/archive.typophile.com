      <p>Don't you think simple geometrical shapes are more constricting than bezier curves?</p>
      <blockquote><p>They seems...inaccurate compared to the strength of a circle, of a simple geometrical form.</p></blockquote>
      <p>What do you mean? Inaccurate is being used very loosely here. Circle is strong but there is very little which can be achieved with straight/regular shapes. Even the most geometric typefaces are not perfectly geometric. There is a slight variation in curvature or slant. Beziers are very powerful and the most complicated shapes can be achieved using beziers.(IIRC, I remember someone drawing a girl using fontlab bezier curves)<br>
      Cheers<br>
      Typo</p>
