      <p>In these days I analyzed the situation and I think I arrived to a good theorem (but I want to know if you agree). In type design there are three ways of creating a single glyph:</p>
      <p>1) Free hand (with a specific calligraphic pen, a normal pen or a pencil): it is a very versatile system but, on the other and, it is also very inaccurate.</p>
      <p>2) Geometrical basic figures on a grid (before the computer with compass and rulers on graph paper): a system extremely precise but not so versatile (theoretically all glyphs can be projected only by a series of circles and lines but...in most cases this way is too long and complicated).</p>
      <p>3) Bezier curves (before the computer with series of plastic or wood curves): I think this is the way in the middle, quite precise and quite versatile and it is probably for this reason that is the most widespread.</p>
      <p>I personally prefer way number 2 but, recently, I realized that is not always applicable mainly because of problems of time. So sad!</p>
