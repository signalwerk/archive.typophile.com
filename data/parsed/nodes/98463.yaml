      <p>@Filippo: You can use building elements if it helps you get into the forms, even basic geometric figures, but in the end you’ll see quickly that a well-drawn form, no matter how constructed (rather than drawn, or casually handwritten), needs complex curves.<br>
      This does not mean complex curves can’t be produced simply: it just requires a visual training, attempts and hard work. </p>
      <p>I realized this very early, as my very first experiments were alphabets built from modular forms, but I did not like them (right now I see that experiments with basic geometric parts were fascinating because it was difficult to attain them by hand: now that we are in the opposite situation, they are less interesting, although it depends a lot on *what* you are trying to convey with your alphabet).</p>
