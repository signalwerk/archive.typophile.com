      <p>For example, yesterday I tried to project by hand a small set of glyphs with the method of plastic curves and pencil. In Adrian Frutiger's pencil drawings I saw he was used to specify the thickness of the lines of the glyph and so I tried.<br>
      This is the result (italic 15°): <a href="https://dl.dropbox.com/u/54593770/photo_01.jpg" rel="nofollow">Photo</a></p>
      <p>I think the final result is good but:<br>
      1) the thickness specified by numbers (as you can see from the photo) isn't exactly equal in every single point...it is not possible! Where I wrote 12 (in the top part of the "a") is not really every time 12 mm but can be 12.01, 12.1, 12.05, ecc...<br>
      2) to join two points with a set of plastic curves we can use millions of different curves. If I drew the glyphs by free hand would be the same thing but the lines have been more dirty.</p>
      <p>So can the design of a glyph be considered geometric? I think, in this case and in a lot of other, no...because is more a matter of eye rather than of strict proportions and because geometry is unconditionally precise and this glyph is not. Don't you agree?</p>
      <p>Sorry if I stress you with this sort of questions but you have to help me killing my mental block...and this can be done by reasoning. I'm a square and want to be a curve!</p>
