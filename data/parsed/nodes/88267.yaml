    <p>Hello all!</p>
    <p>Working on a site for a real estate research company where there are hundreds of graphs. Currently the graphs are almost to the point of not being legible. I am wondering if there are any webfonts that really work well at smaller sizes...sort of in the same vein as HF&amp;J's Retina but for web. I have found a few options but figured I would see some variety from the folks here..</p>
    <p>Thanks!</p>
