    html: |-
      <p>Good question, but do we mean legibility or readability?<br>
      Heck, the former does fine at double-digit resolutions!<br>
      Concerning the latter, since the difference (at the 30cm,<br>
      12" typical reading distance for a printed book) between<br>
      1200dpi and 2400dpi is noticeable*, but between 2400dpi<br>
      and 3600dpi isn't, I'd say at least 2000dpi. I'd estimate<br>
      that good** onscreen anti-aliasing halves the resolution<br>
      requirement, so around 1000 ppi.</p>
      <p>* And anything that can be seen<br>
      consciously <em>must</em> affect reading.</p>
      <p>** Which BTW is <em>not</em> the iOS/OSX stuff.  :-(</p>
      <p>hhp</p>
