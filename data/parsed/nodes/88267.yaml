    user: readthetype
    date: 2011-12-15T14:41:00
    date_raw: 15 Dec 2011 — 2:41pm
    votes: null
    html: |-
      <p>To the best of my knowledge <a href="http://en.wikipedia.org/wiki/Tahoma_%28typeface%29" rel="nofollow">Tahoma</a> and <a href="http://en.wikipedia.org/wiki/Trebuchet_MS" rel="nofollow">Trebuchet</a> were designed for screen usage. For positive confirmation I’d ask <a href="http://typophile.com/user/4431" rel="nofollow">Kevin Larson</a>.</p>
      <p><em>However</em>, beyond ~300 PPI at a distance of ~30 cm, resolution doesn’t matter. With certain exceptions — such as a crappy ATM or giant airport sign — we are moving away from needing to concern ourselves with screen resolution as a factor (and eventually hinting and rasterization).</p>
      <p>This has been discussed at great length here, but I do not have any specific threads ready to mind. You can read more about it in <a href="http://prometheus.med.utah.edu/~bwjones/2010/06/apple-retina-display/" rel="nofollow">an article about Apple Retina Displays</a> from Jonesblog, as well as:</p>
      <p>Curcio, C. A., Sloan, K. R., Kalina, R. E. &amp; Hendrickson, A. E. (1990). Human photoreceptor topography. <em>Journal of Comparative Neurology, 292(40)</em>, 497-523. doi&gt;10.1002/cne.902920402</p>
      <p>Bernard, M., Liao, C. H. &amp; Mills, M., (2001). The effects of font type and size on the legibility and reading time of online text by older adults. <em>Conference on Human Factors in Computing Systems</em>. New York, USA. doi&gt;10.1145/634067.634173</p>
      <p>You’ll need database access to get at those last two, but I have had great success simply contacting the primary authour and requesting an electronic copy of the article in the hopes it will you assist you in your research, and you will be able to cite them (academics like to brag about how many times they have been cited).</p>
    html_clean: |-
