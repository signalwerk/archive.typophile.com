      <p>Thanks for the ID.</p>
      <p>The quote is from an <a class="freelinking external" href="http://books.google.com/books?id=eOQCAAAAMBAJ&amp;pg=PA55&amp;lpg=PA55&amp;dq=new+school+%22provoked,+engaged,+coaxed,+compelled%22&amp;source=bl&amp;ots=-S2eWMRXu7&amp;sig=2PR_9gaBjOMeEkUZIhrS9hj77e0&amp;hl=en&amp;ei=XdDBTO_GIMT68AaCx4jaBg&amp;sa=X&amp;oi=book_result&amp;ct=result&amp;resnum=1&amp;ved=0CBMQ6AEwAA#v=onepage&amp;q=new%20school%20%22provoked%2C%20engaged%2C%20coaxed%2C%20compelled%22&amp;f=false" rel="nofollow">advertisement</a> for The New School that appeared in 1992. I wanted to use the sentence, but have since decided against using all caps and trying to match the original font. It does look good in U&amp;lc Optima.</p>
      <p>And given your answer, Jens, try going to a Unitarian Universalist congregation or two.</p>
