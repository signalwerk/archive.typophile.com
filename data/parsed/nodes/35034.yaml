    <p>I just activated FL 5.0.4 for Mac - it has the same bug as every version since 5.0<br>
    </p><div class="imageWrap"><img src="/web/20080907000737im_/http://www.typophile.com/files/bug-1_4339.jpg"></div><br>
    <div class="imageWrap"><img src="/web/20080907000737im_/http://www.typophile.com/files/bug-2_5720.jpg"></div><p></p>
    <p>When clicking the blue box under the character in the preview window it doesn’t show ’key glyph in class’ or ’referenced in class’ as it should.</p>
    <p>Oh well - back to 5.0 again.</p>
    <p>Does anybody else have this problem?</p>
