    html: <p>You may be better off writing a single script that has a global variable defining the master. So run it once with the value 0 for light master, and then 1 for the next and so on. I've several scripts that I use on fonts with 7+ masters and this works fine, but I also don't do kerning within FontLab so I'm not 100% sure this will work for what you are doing.</p>
