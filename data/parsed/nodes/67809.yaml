  html: |-
    <p>Hi all</p>
    <p>Is it possible for a Robofab script to affect all the masters in a Multiple master font ?</p>
    <p>I have a MM font with a Light and a Bold Master. I'm kerning this fonts and to speed thing up slightly I wrote this little script to transfer the kerning amount to glyph pairs with the same shape. The script works but only on the light master - is it possible to haveit work on both masters.</p>
    <p><code><br>
    from robofab.world import CurrentFont<br>
    f = CurrentFont()<br>
    kerning = f.kerning<br>
    #<br>
    OA = kerning[('O','A')]<br>
    AO = kerning[('A','O')]<br>
    OV = kerning[('O','V')]<br>
    VO = kerning[('V','O')]<br>
    OW = kerning[('O','W')]<br>
    WO = kerning[('W','O')]<br>
    OY = kerning[('O','Y')]<br>
    YO = kerning[('Y','O')]<br>
    OX = kerning[('O','X')]<br>
    XO = kerning[('X','O')]<br>
    OT = kerning[('O','T')]<br>
    TO = kerning[('T','O')]<br>
    KO = kerning[('K','O')]<br>
    #<br>
    #<br>
    kerning[('A','C')] = kerning[('A','G')] = kerning[('A','Q')] = kerning[('A','OE')] = AO<br>
    kerning[('D','A')] = kerning[('Q','A')] = OA<br>
    #<br>
    kerning[('V','C')] = kerning[('V','G')] = kerning[('V','Q')] = kerning[('V','OE')] = VO<br>
    kerning[('D','V')] = kerning[('Q','V')] = OV<br>
    #<br>
    kerning[('W','C')] = kerning[('W','G')] = kerning[('W','Q')] = kerning[('W','OE')] = WO<br>
    kerning[('D','W')] = kerning[('Q','W')] = OW<br>
    #<br>
    kerning[('Y','C')] = kerning[('Y','G')] = kerning[('Y','Q')] = kerning[('Y','OE')] = YO<br>
    kerning[('D','Y')] = kerning[('Q','Y')] = OY<br>
    #<br>
    kerning[('X','C')] = kerning[('X','G')] = kerning[('X','Q')] = kerning[('X','OE')] = XO<br>
    kerning[('D','X')] = kerning[('Q','X')] = OX<br>
    #<br>
    kerning[('D','T')] = kerning[('Q','T')] = OT<br>
    kerning[('T','C')] = kerning[('T','Q')] = TO<br>
    #<br>
    kerning[('K','C')] = kerning[('K','G')] = kerning[('K','Q')] = kerning[('K','OE')] = KO<br>
    #<br>
    #<br>
    f.update()<br>
    print "UpperUpperKern Done"<br>
    </code></p>
