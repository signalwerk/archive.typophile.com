    html: |-
      <p>I could be wrong, but AFAIK when you handle the kerning through Robofab you can only control the values of the first master. The kerning value amounts of the remaining masters will be the same as the first master. Therefore, you might have to use <a class="freelinking external" href="http://robofab.org/howto/lowlevel.html" rel="nofollow">Robofab's naked() method</a> and go from there, or use FontLab's API's all the way.</p>
      <p>I've wrote several scripts for FL that handle MM kerning, and I can tell you things can be complicated. The kerning values reside in something that looks like a list, and are associated with the left glyph of the pair.</p>
      <p>Imagine a 2-master font with only one kerning pair AV, with a kerning value of -50 for the first master, and -80 for the second. If you do,<br>
      <code>print fl.font['A'].kerning[0].values</code><br>
      you'll get <code>[-50,-80]</code>.</p>
      <p>The difficulties start when you try to modify the values or add new pairs.</p>
      <p>The list of kerning pairs is read-only, so this will fail,<br>
      <code>fl.font['A'].kerning[0].values = [-10, -30]</code><br>
      but you can change the values one by one, like so,<br>
      <code>fl.font['A'].kerning[0].values[0] = -10<br>
      fl.font['A'].kerning[0].values[1] = -30</code></p>
      <p>And to copy the values of one pair to another pair, you first need to create that pair (if it doesn't exist already),<br>
      <code>defaultKerningValue = -1<br>
      rightGlyphID = fl.font.FindGlyph('T')<br>
      pair = KerningPair(rightGlyphID, defaultKerningValue)<br>
      fl.font['A'].kerning.append(pair)</code><br>
      and then go through the values and modify them accordingly.</p>
      <p>Again, handling MM kerning is not trivial. You might be better off saving AFM files, modifying them and reading back in. But that process is not 100% reliable sometimes, so proceed with care.</p>
