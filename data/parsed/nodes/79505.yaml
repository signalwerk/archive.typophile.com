    <p>Although this is, in part, a type ID question, I have posted it in general discussions because I would like to know more about this bizarre face than simply a name. On any PDFs downloaded from the JSTOR database, the name and copyright info appear in a distinctive and very amateur-looking typeface. Adobe Reader identifies it as CODE-2000 (TrueType). It is an unusually inconsistent font in many ways, as the attached pictures show. I am sure every typophile out there can pick out the idiosyncrasies for him- or herself. Does anyone know who deigned this face, or what its history entails?</p>
    <p>Josh</p>
