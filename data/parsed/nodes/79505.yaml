      <p>Since I use JSTOR regularly, I was curious.  I only know what Google knows, but here's some information from <a href="http://www.unifont.org/fontguide/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">www.unifont.org/fontguide/</a>:</p>
      <blockquote><p>Code 2000 is an experimental shareware font with over 34,000 glyphs designed by James Kass to cover all of the non-Han sections of the Unicode Basic Multilingual Plane (BMP)... The shareware fee for continued use of this font after evaluation is $US 5.00.</p></blockquote>
      <p>The links to the home page for Mr. Kass and for the font seem to be defunct.</p>
      <p>Another link:  <a href="http://www.alanwood.net/unicode/fonts.html#code2000" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://www.alanwood.net/unicode/fonts.html#code2000</a>.</p>
      <p>st</p>
