    html: |-
      <p>They are in the basic Symbol font which comes with the OS.</p>
      <p>Nowadays, some foundries are putting these characters in their OpenType fonts.<br>
      I am, but haven't released any yet.</p>
      <p>So you would use the glyph palette to set them.</p>
      <p>You could cheat by using the "hungarian umlaut" -- a double-acute accent, which might do the job depending on the font, and which is easily accessible with option-shift-g.</p>
