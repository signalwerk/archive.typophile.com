    html: |-
      <p>Use true primes or double primes for foot and inch marks. Not quotation marks. Not the up-and-down primes you get with the control key. I use the Universal News + Commercial Pi font.</p>
      <p>Hit 8 for single prime. Hit 9 for double.</p>
      <p>They look so much better than the others. I'm sure other typographers have other ways to do this.</p>
      <p>good luck.</p>
      <p>powers</p>
