  html: |-
    <p>This should be SO easy, and maybe it is, but I can't find ANY information in my ID manuals or ID Help on how to make inch marks. In Quark you just use the control key, so I am sure there must be a simple way to do this without turning off curly quotes in Preferences every time an inch mark is needed.</p>
    <p>So can someone enlighten me?</p>
    <p>Much thanks!</p>
