    html: |-
      <p>In ID3 just hold down Alt instead of Ctrl. But as others have pointed out, that doesn't produce true inch marks, it's just a convenient way to get non-curly quotes.</p>
      <p>True primes can be found at Unicode U+2032 and U+2033. They're under the Punctuation category in ID's glyph palette.</p>
