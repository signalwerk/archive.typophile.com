    html: |-
      <p>As has been mentioned, most fonts don't come with U+2032 and U+2033.</p>
      <p>But . . .</p>
      <p>When making these up for a font that lacks them, skewing a "quotesingle" works about as well as rotating it -- better in some ways, worse in others. I tend to use a little of both. So, in InDesign, you could set the quotesingle &amp; then just slant it about 15 degrees for a reasonable prime/minute/foot. And of course, the quotedbl for minute/inch.</p>
      <p>FWIW</p>
