      <p>Wow! Privateortheris, that looks great! It definitely seems to be based on my font. Only the lc a’s and e’s seem significantly different. Out of curiousity, how would you plan on “tracking” the real thing down? Although it seems based on something, I’m unsure how to get any closer to the real font. I’m happy to do some searching on my own if someone would tell me where to luck. Thanks again, privateortheris!</p>
      <p>Just got finished searching myfonts. Good matches include Cooper Old Style (probably the best), Windsor, Goudy Catalogue, and Cooper BT. Couldn’t find any other good matches on myfonts, but these were encouraging.</p>
