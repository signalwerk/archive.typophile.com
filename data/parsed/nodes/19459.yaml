    <p>I know I said that I wouldn’t be back until the redesign had percolated a bit more, but after the amazing help I received yesterday on what I now know to be a blackletter/art nouveau nameplate, I thought that I’d see whether I could get a bit of help ID-ing a few more old nameplates. If this one goes well (and you Typophiles would like to help out even more), I’ll post the other two in separate topics; they’re each pretty distinct.</p>
    <p><a href="http://i48.photobucket.com/albums/f202/auricfuzz/RRFirstLogo2copy.jpg">This</a> one is the very first logo we used, starting in 1917 and ending approximately 1930. It’s a very soft, rounded font that I, in my limited typographical knowledge, would call humanist because of the minimal contrast and oblique stress. Like my original blackletter, it could be hand drawn or have never been digitized, but I thought I’d give it a shot.</p>
    <p>For those who are interested, the other two nameplates that I’m not sure about are a script mixed with an outline serif and a “groovy” font that I feel like I’ve seen before. I’ve identified other nameplates from the Review’s history that used Bodoni, Broadway (although the uc r is slightly different in ours), Monotype Engravers Old English, Helvetica, and Times. I was surprised to see how much we’ve changed over the years, so I’m thinking that for the coming year, my school’s centennial, I might try replacing our current or future nameplate with some of these. So if I can get these three unidentified nameplates fixed, this might become a reality. Thanks a ton in advance.</p>
