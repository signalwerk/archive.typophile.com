      <p>It must be <strong><a class="freelinking external" href="http://www.findmyfont.com/index.php/fonts/font-preview?fset=MS-Windows-Fonts&amp;ffam=Nyala%20-%20Regular&amp;fid=9f895be44fd462d400a25832ec1095a1&amp;fsize=60&amp;text=CONSEILS%20HOLDING&amp;wrap=2" rel="nofollow">Nyala</a></strong> Microsoft Windows Font</p>
      <p>from the Microsoft site:</p>
      <blockquote><p>The Nyala typeface is named for the mountain nyala (tragelaphus buxtoni) a species of great African antelope native to the highlands of Ethiopia. The Ethiopic characters were designed by John Hudson, based on initial drawings by Geraldine Wade. The Latin characters were designed by John Hudson, and harmonise with the Ethiopic to facilitate the typesetting of texts including un-transliterated foreign names, technical terms, etc.</p></blockquote>
      <p>Another similar font: <strong><a class="freelinking external" href="http://www.findmyfont.com/index.php/fonts/font-preview?fset=Adobe&amp;ffam=SerifSans%20-%20Roman&amp;fid=143d8d85ca5316c29248f5c742d2f014&amp;fsize=60&amp;text=CONSEILS%20HOLDING&amp;wrap=2" rel="nofollow">Serif Sans (Roman)</a></strong> by Adobe or Linotype</p>
      <p>Please post your future requests in main type-id Board:<br>
      <a href="http://typophile.com/typeid" title="http://typophile.com/typeid">http://typophile.com/typeid</a><br>
      (this one was in Type ID FAQ and Posting Guidelines)</p>
      <p>-----------------------------------------------<br>
      I found it using Find my Font - <a href="http://www.findmyfont.com" title="http://www.findmyfont.com">http://www.findmyfont.com</a></p>
