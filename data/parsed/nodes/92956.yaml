      <p><em>Perhaps for the first time, we can see the changes as they happen, and advance into them or retreat from them with an understanding of what is taking place.</em></p>
      <p>Therein lies the problem: seeing is not necessarily understanding. Thomas Starr King once observed that the difference between a wise man and an ignorant one is that, while the latter only sees what is happening, the former understands what is happening. In other words, information doesn’t always translate into knowledge, much less wisdom.</p>
