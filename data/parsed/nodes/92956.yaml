      <p>The reading-age of inaugural presidential addresses (USA) has been progressively lowering since Lincoln. This trend is caused by the advance of technology, but not in a direct manner.</p>
      <p>One would assume that longer sentences with more complex construction provide a more subtle and profound expression, communication and understanding of ideas.</p>
      <p>But the hyperlinked hive mind, immanent in digital social media, with its wisdom of crowds, is a horse of a different color.</p>
