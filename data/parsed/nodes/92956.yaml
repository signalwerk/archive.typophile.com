      <p>Ok, I'm reading it, it's not a joke, but I clicked the back button 'cause you're just the man I wanted to speak to.</p>
      <p>Is there any research to your knowledge which focuses on vertical space and readability?<br>
      By vertical spacing I mean gaps. I mean all the variations in "whitespace" used in a running column of text.<br>
      Yes, "leading" - and it's HTML equivalent "line-height" - would qualify but also things like the distance between sections of text - like the distance between a heading and the last paragraph of the previous section. And the space between the heading and the first paragraph - that kind of thing.</p>
