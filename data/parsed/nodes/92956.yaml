      <p>@christopher<br>
      &gt;@Richard: Leading ? Tons. Is the science any good? Questionable.<br>
      &gt;Space between paragraphs, headings, &amp;c? Nothing springs to mind.</p>
      <p>Thanks. What's prompting the question is newefangled web design I'm seeing lately that has, to my eye, huge gaps between sections, and/or headings and sections, and it effects the flow of reading because it throws relatedness into doubt.</p>
      <p>I mean, if you picked up a newspaper and there was a three inch gap below a headline before the body copy began, you'd think WTF? You'd assume it was some kind of missprint, a typo.  You might even have to look back up at the headline to refresh yourself and get your bearings back.</p>
