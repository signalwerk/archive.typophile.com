      <p>Well, if you <em>see</em> what is happening, then at least it is <em>possible</em> for you to understand it. If, on the other hand, the changes come as a surprise that cannot be anticipated, then they cannot be understood before they happen.</p>
      <p>However, I would criticize this position for being overly sanguine for an entirely different reason. If reading on display screens is "bad", and reading from paper is "good", making use of our understanding of this fact requires that we have a <em>choice</em>.</p>
      <p>Thus, instead of noting the fallibility of human understanding, I would be more inclined to point out that we're running out of trees. (I suppose, though, that could be rebutted on the basis that if laser printers are "good enough", then so would be retina displays and e-ink and so on, as long as our "understanding" made us realize they were necessary for our brains to process type properly.)</p>
      <p>EDIT: Reading the article, though, I see it's about content-related positives of the digital era, rather than typography-related negatives.</p>
