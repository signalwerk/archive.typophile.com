      <p>Hmm. The Ascender pack it seems includes two of four weights of Font Bureau’s Eagle, and one of three weights of Mark Simonson’s Coquette. Perhaps what is going on—and will continue to—is a segmentation of the market, with fonts aimed for the professional market being very full families and Open Type features—with correspondingly higher prices. And then the bundling of selected weights as a marketing tool. Adobe seems to be different here, as their bundling is aimed at enhancing the value of their production software, which nobody else producing fonts has to sell.</p>
