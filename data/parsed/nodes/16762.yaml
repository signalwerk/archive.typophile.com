      <p>Educated guesses:</p>
      <p>More bundling of font packages aimed at non-professional markets (like the <a href="http://typophile.com/node/15111" target="new">Ascender Creativity Font Pack</a> for only $19.99) which will in fact degrade the per font perceived value within new markets we potentially could sell to.</p>
      <p>More font bundling within software packages aimed at non-print professional and consumer markets (web, video, digital imaging).</p>
      <p>More font bundling within multi-software packages (like Adobe CS2. Surprise, surprise... I got fonts I never had or installed before).</p>
      <p>Gut feel:</p>
      <p>I just have a feeling that <a href="http://typophile.com/node/16326" target="new">TypeExpertise.com</a> wants to do more than just create a “universal type classification” system based on touchy-feely search criteria. Why the hell go through all that effort unless you want to start selling fonts to non-type oriented markets.</p>
      <p>And there are other distribution modes in development and on the drawing board for getting old and new markets to use more type.</p>
