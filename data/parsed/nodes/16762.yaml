    html: |-
      <p><em>Will happen in 2006:</em> More grubby fonts will come bubbling up through MyFonts and more people will buy them. The best seller list will become uglier than ever. This can only be a good thing for the industry. Some snobby type designers will thumb their noses at the great unwashed buying “type”. (And they’ll pronounce “type” with just enough emphasis to make it clear to everyone that they are smart enough to call it type, and not fonts). Other companies will seize the opportunity and make wads of cash a-la Wal-Mart. In short, the markets for non-professionals will continue to expand. At the same time, professional users will become even more addicted to OpenType features, and continue to pay a premium for beautiful work, driving sales and encouraging creativity in type design like it’s never been possible in the past.</p>
      <p><em>Wishful thinking:</em> Software makers will realize that hard coding a control panel into each application for each OpenType feature is ridiculous. They will simply implement an engine to read the available features out of the font, and allow the users to turn them on or off. People setting type without the help of Adobe’s multiline composer will either finally go completely insane spacing by hand in Quark or will actually die of old age. Everyone else will finally dump Quark for Microsoft Word, and not know the difference. </p>
      <p><em>Will happen in in the future but not necessarily in 2006:</em> Adobe will become all powerful and start to atrophy, though it won’t be completely obvious to everyone. Then, after a few years, Adobe will have become a blubbering glutton, unable to move under it’s own weight, gobbling 10,000 calories a day of fried food. Since nothing has changed inside their software in years (though a lot more code will be added to top of the pile), open source apps will finally have copied every piece of functionality in each app. Smaller, smarter companies will invent new paradigms that promise to revolutionize the industry. They will, of course, be purchased and dismantled immediately. Finally, Adobe will start to crumble from within, as all empires do, with pressure from the barbarian tribes (open source) and the next round of smart, nimble companies will carve them to pieces creating a lot more work for open source to copy.</p>
    html_clean: |-
      <p><em>Will happen in 2006:</em> More grubby fonts will come bubbling up through MyFonts and more people will buy them. The best seller list will become uglier than ever. This can only be a good thing for the industry. Some snobby type designers will thumb their noses at the great unwashed buying “type”. (And they’ll pronounce “type” with just enough emphasis to make it clear to everyone that they are smart enough to call it type, and not fonts). Other companies will seize the opportunity and make wads of cash a-la Wal-Mart. In short, the markets for non-professionals will continue to expand. At the same time, professional users will become even more addicted to OpenType features, and continue to pay a premium for beautiful work, driving sales and encouraging creativity in type design like it’s never been possible in the past.</p>
      <p><em>Wishful thinking:</em> Software makers will realize that hard coding a control panel into each application for each OpenType feature is ridiculous. They will simply implement an engine to read the available features out of the font, and allow the users to turn them on or off. People setting type without the help of Adobe’s multiline composer will either finally go completely insane spacing by hand in Quark or will actually die of old age. Everyone else will finally dump Quark for Microsoft Word, and not know the difference. </p>
      <p><em>Will happen in in the future but not necessarily in 2006:</em> Adobe will become all powerful and start to atrophy, though it won’t be completely obvious to everyone. Then, after a few years, Adobe will have become a blubbering glutton, unable to move under it’s own weight, gobbling 10,000 calories a day of fried food. Since nothing has changed inside their software in years (though a lot more code will be added to top of the pile), open source apps will finally have copied every piece of functionality in each app. Smaller, smarter companies will invent new paradigms that promise to revolutionize the industry. They will, of course, be purchased and dismantled immediately. Finally, Adobe will start to crumble from within, as all empires do, with pressure from the barbarian tribes (open source) and the next round of smart, nimble companies will carve them to pieces creating a lot more work for open source to copy.</p>
