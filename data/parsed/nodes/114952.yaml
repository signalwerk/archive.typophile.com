      <p>I wonder if a designer ever tried to strip down the serifs of the traditional era typefaces?<br>
      Turn <em>Jenson</em>, <em>Garamond</em>, <em>Kis</em>, <em>Caslon</em>, <em>Fournier</em>, <em>Baskerville</em>, <em>Didot</em> naked and 'sans' and with a satisfying result from readability and design perspectives.<br>
      Imagine this superfamily package:<br>
      <em>Garamond</em>, <em>Garamond Semi Serif</em>, <em>Garamond Sans</em>, <em>Garamond Semi Sans</em>.<br>
      If only Slimbach could do the task.</p>
