    html: <blockquote><p>"Meier described <strong><em>Syntax</em></strong> as being a sans-serif face modeled on the Renaissance serif typeface, similar to <strong><em>Bembo</em></strong>. The uppercase has a wide proportion, and the terminals not being parallel to the baseline provide a sense of animation. The lowercase a and g follow the old style model of having two storeys. The italics are a combination of humanist italic forms, seen in the lowercase italic q, and realist obliques, seen in the lowercase italic a, which retains two storeys, unlike in other humanist sans-serif typefaces like <strong><em>FF Scala Sans</em></strong> and <strong><em>Gill Sans</em></strong>, where the a has a single storey italic."</p></blockquote>
