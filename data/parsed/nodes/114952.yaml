      <p>Well, Martin Majoor has done this type of work. He has written about his particular approach to deriving sans from serif designs on his website: <a href="http://www.martinmajoor.com/6_my_philosophy.html" title="http://www.martinmajoor.com/6_my_philosophy.html">http://www.martinmajoor.com/6_my_philosophy.html</a></p>
