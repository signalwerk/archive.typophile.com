    html: <p>The way you phrased your question is interesting - "stripping down the serifs" sounds as if one is peeling some vegetable to get rid of some rough texture or hard parts.  I think the process with which a traditional type or script turns into a san-serif  is fascinating and has occurred in almost all the scripts I have encountered - Arabic, Japanese, Thai, etc etc.  In Japanese for example the brush-strokes which have thick and thin could be  made mono-width, and the stroke endings which often twist into a tiny this edge are neglected. More than just stripping extra detail, san-serif as it has become to be used means finding the generic essential shape of the letter of a script and presenting it free of the traditional marks left by tools such as a chisel, bamboo pen, quill or brush. I have tried to do that for Arabic 50 years ago and am just now finishing the font!</p>
