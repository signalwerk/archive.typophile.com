    html: |-
      <p>I am no big fan of Helvetica (too uniformed in my opinion), but Arial makes me sick. I was on a convention not too long ago, and had to listen to some people from Microsoft boasting what a great design Arial was, and what an even greater design Segoe is.</p>
      <p>Face it, they're both clones, stolen from fonts made by somebody else. I simply hate it when people do that, and I hate it even more when big companies do that, because they know they'll get away with it.</p>
      <p>Oh, and I do think that Akzidenz Grotesk and Helvetica are quite different - Miedinger and Hoffmann did design a new typeface here, but they of course had references (don't we all?). But Arial is just copied. If you print it on thin paper and put the letters on top of each other, you can see that clearly. One of our profs at the university did this, and I was astonished to find that it was hard to find any differnces. 95% of the letters are simply the same! That is not true with Akzidenz Grotesk and Helvetica (or Neue Haas).</p>
      <p>I was very sorry to see Berthold go... they had some great typefaces!! But they just did not make it through to modern technology. It sometimes reminds me of Commodore :-)) It's always the companies I like, hihi...</p>
    html_clean: |-
