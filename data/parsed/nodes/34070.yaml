      <p>Hi all. Agreed, that Slate piece was sort of weak. </p>
      <p>In terms of <cite>Helvetica</cite> coming to "normal" cinemas, this will be happening this fall in selected cities. Generally independent films do festivals and special event screenings first, then normal art house cinema runs. So the film will have a two-week run at the IFC Center in New York City in September, and there will be more runs like that announced in the next few months. The DVD release will happen immediately after those September cinema showings. </p>
      <p>But overall the response from both design and non-design audiences so far has been fantastic.</p>
      <p>Cheers from Minneapolis (we had two great screenings at the Walker Art Center last night),</p>
      <p>-Gary</p>
