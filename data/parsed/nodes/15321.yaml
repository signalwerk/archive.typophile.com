    html: |-
      <p><strong>Phints</strong><br>
      (Phinney + fonts + Hints [tech.: type hinting + instruction, tip, indication])<br>
      It’s short, easy to spell and remember and it does not include the both obvious and ubiquitous “type” label that I think is not necessary in the blog title - your readers will associate it anyway. “Phints” also includes a subtle notion of “mints”, which would be small (11pt? ;-]) intensive and distinctive candies – not the worst thing to have in mind when thinking about entries of your blog.<br>
      Alternatively, if you don’t trust the readers’ media literacy and want to stress the word “type” like other posts have implicitly suggested, you could append “-ty” or “-type” (would then be: Phinty/Phintype), but you’d lose some of the “fonts” and “hints” associations.<br>
      Perhaps a short subtitle like “Thoughts on type(, Adobe) and more by Thomas Phinney” would clarify your blog’s goal and its contents.</p>
    html_clean: |-
      <p><strong>Phints</strong><br>
      (Phinney + fonts + Hints [tech.: type hinting + instruction, tip, indication])<br>
      It’s short, easy to spell and remember and it does not include the both obvious and ubiquitous “type” label that I think is not necessary in the blog title - your readers will associate it anyway. “Phints” also includes a subtle notion of “mints”, which would be small (11pt? ;-]) intensive and distinctive candies – not the worst thing to have in mind when thinking about entries of your blog.<br>
      Alternatively, if you don’t trust the readers’ media literacy and want to stress the word “type” like other posts have implicitly suggested, you could append “-ty” or “-type” (would then be: Phinty/Phintype), but you’d lose some of the “fonts” and “hints” associations.<br>
      Perhaps a short subtitle like “Thoughts on type(, Adobe) and more by Thomas Phinney” would clarify your blog’s goal and its contents.</p>
