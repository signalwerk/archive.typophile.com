      <p>Well, it’s been hard to narrow things down, but I have it down to a handful of nine finalists:</p>
      <p>Phinneyus Blogg (inspired by Hrant)<br>
      My Other Car is a Sans Serif (superkhy - might use this as a subtitle below the actual main title)<br>
      Typ(bl)ography (Jason)<br>
      Tyblography (or a variant, Paul Dwyer)<br>
      Fontabule (Kristina)<br>
      Phonts (inspired by Stephan Kurz “Phints,” later also “Phont” suggested by Chester)<br>
      Seriphin (Norbert Florendo)<br>
      Font Matters (Stephan Kurz)<br>
      TypeTalk (gln)</p>
      <p>Here are some that nearly made it:</p>
      <p>Long Primer (John Butler)<br>
      Thomas the Type Engine (John Hudson)<br>
      OpenTypographer (Jan Sandvik)<br>
      Type &amp; Character (Stephan Kurz)<br>
      Type A (jupiterboy)</p>
      <p>And these special runners up, that I had to eliminate for other reasons besides how much I liked them personally:</p>
      <p>- Adobe Type Manager, which is a great title, but since the product is discontinued it’s probably politically incorrect now. Also would be easily confused with the application if anybody ever Googled to find the blog.</p>
      <p>- We Love Miranda, which is very true, but probably not suitable for this particular blog. (Miranda is my daughter’s name.)</p>
      <p>- PostScript or post-script, which are very good, but in the context of Adobe will make people think of something else.</p>
      <p>- PhinneyUncensored.otf, which has great appeal personally, but probably has some wrong connotations for this purpose. </p>
      <p>- Whatever Fredo suggested, just because he has a Watchmen/Rorshach avatar/icon thingie.  :)  They almost made a movie of it, too.  <a href="http://www.efavata.com/CBM/Watchmen.htm" title="http://www.efavata.com/CBM/Watchmen.htm">http://www.efavata.com/CBM/Watchmen.htm</a></p>
    html_clean: |-
