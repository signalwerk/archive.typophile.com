      <p>FINAL TITLE: Typblography, the Phinneyus Blogg</p>
      <p>Thomas “my other car is a sans serif” Phinney is Adobe’s Program Manager for Fonts &amp; Core Technologies. Typblography, the Phinney-us Blogg contains his musings on the technical, business, historical and design aspects of type/fonts and their technologies, including OpenType and SING.</p>
      <p>* * * * *</p>
      <p>This just shows how indecisive I can be when confronted with many good choices. So we have three winners: Hrant Papazian (Phinney-us Blogg), Will “superkhy” (my other car is a sans serif) and Jason Dewinetz (typblography). I wasn’t planning on three first prizes, but in a spirit of justice and generosity, that’s what we’re doing.</p>
      <p>Regrets to Paul Dwyer who also came up with some other riffs on “typblography,” but Jason did it first, and his was the version I went with (keeping the “P” in there).</p>
      <p>Interestingly, two of the three winners are based in Canada. I swear I didn’t look at where they were from until I was notifying them to get them their prizes.  :)</p>
      <p>Note also that I have sent email to all three prize winners. If you’re one of the winners, and didn’t get it, check your spam filters or just write me directly.</p>
      <p>Thanks,</p>
      <p>T</p>
    html_clean: |-
