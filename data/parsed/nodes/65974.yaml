      <p>Oh, dear. Yes, this logo is confusing. </p>
      <p>What's poor? </p>
      <p>Firstly, the eye doesn't easily read the words in any particular order. We don't know where to start. The position of the words makes it read backwards. Why is the text broken this way? </p>
      <p>Secondly, the text sizes make 'people' the least important part of the logo. At small sizes that word is going to become unreadable.</p>
      <p>Thirdly the mix of type styles seems not to be purposeful. Why is 'people' in caps? Why is 'moving' in a serif font?</p>
      <p>Fourthly, what are the segment and the swoosh supposed to represent? Why is the graphic element obscured by the text? It looks very cluttered. </p>
      <p>Fifthly, the m and p look poorly executed custom jobs.</p>
