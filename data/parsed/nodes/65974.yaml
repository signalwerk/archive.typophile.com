      <p>It's great that at least now you're talking about the values of the company: fresh, unique and energetic. You will need to think a little harder about what makes the company unique though, then hopefully you can start to think about how those values are portrayed in the logo. That's what branding is. The current logo communicates no brand at all and it unlikely to succeed on its own. (What I mean is that unless somebody already knows about the company they are unlikely to suddenly get interested by seeing just the current logo.) </p>
      <p>The unfortunate thing is, unless you have senior management buy-in you'll find that nothing can change. If they can't see for themselves that a new logo is an incredible asset, they're not going to be persuaded about something they don't understand.</p>
      <p>I'm speaking from the perspective not of a designer here, but of someone who has in the last six months taken an international company through a dramatic rebrand and met with a fair amount of resistance. I'm still not sure our Managing Director is convinced of the reasons we rebranded, but he does trust out judgment and that has been really important. </p>
      <p>It sounds like the people in this company could benefit from talking to other organisations that have rebranded, to design agencies, and to their target market to find out their opinions. Our market thought our old brand was 'ok'. For a company positioning itself in the 'premium' category this was not what we wanted to hear. </p>
      <p>I hope I'm not teaching you to suck eggs :)</p>
