      <p>When the time comes for the redesign--and you should keep pushing to make it sooner, not later--explain it to the board this way: They have certainly solved one problem with their logo, which is to capture the energy of dance. But how they would react if a dancer came to audition for them, and did nothing but flail his arms and legs and head around in different directions, completely out of step to any rhythm or music or the dancers around him, and without a care in the world for whether his movements were communicating anything but confusion and disarray to the audience? </p>
      <p>A logo that doesn't get across the name of the company, that has no graphic rhythm and unity, and can't be used in any practical graphic applications without destroying them is just like that dancer.</p>
