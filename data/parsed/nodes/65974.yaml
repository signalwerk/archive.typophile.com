      <p>Scratch my above comment. I didn't realize a board of directors would be reading this. </p>
      <p>Here instead is my (a bit cheeky but considered) advice: </p>
      <p>1. Hire a designer and trust their experience and expertise (it's what you're paying for) to design. And yes, as with almost everything in life, you generally get exactly what you paid for in terms of talent, experience, ability and quality of ultimate outcome.</p>
      <p>2. Take on a role of design expert or experienced art director in the project, if you've dedicated your professional life to the visual communications industry (or are secretly an unappreciated design genius—aren't we all). Otherwise, don't. </p>
      <p>3. Designers are not robots who "input my visionary direction into software programs I can't be bothered to learn." (If this approaches your conception of design, just hire a nephew who knows some photoshop).</p>
      <p>4. And remember, the phrase "designed by committee" is never, ever, ever a compliment. (It also implies unsteady leadership and lack of vision). Even ten brilliant individual art director visionaries, if they're put on a committee with everyone's input given equal weight, will produce a compromised, negotiated, bland, mediocritized, unfocused pile of mush).</p>
      <p>4. Did I just invent the use of mediocre as a verb? Mediocritized?</p>
      <p>5. Final Step: If you've done step one and only step one, enjoy your organization's professional, apropos and unique new visual identity.</p>
