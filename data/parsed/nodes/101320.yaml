      <p>I added the <strong>ccmp</strong> to the existing feature code. Now I wonder if the hyphens in my special glyphs names may have caused the trouble. The beginning looks as follows:<br>
      <code><br>
      feature ccmp {# Dania Akzentkombinationen<br>
        sub uni0252 uni0324 by d-a2-1;<br>
        sub d-a4 uni030A by d-a4-1;<br>
        sub d-ae-1 uni030A by d-ae1-1;<br>
        sub d-ae-1 gravecomb by d-ae1-2;<br>
        sub d-ae2 uni030A by d-ae2-1;<br>
        sub d-c2 uni0307 by d-c2-1;<br>
      </code></p>
      <p><strong>d-a4-1</strong> and the like are special custom glyphs in the font.</p>
