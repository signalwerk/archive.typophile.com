    html: |-
      <p>James: ‘In addition to the curved endings and basic serifs simply angled terminals would be a great feature.’</p>
      <p>Stroke endings, including serifs, represent the contrast and contrast sort. In case of slab serifs or sans serifs (if such things exists) the lowest possible contrast is represented and the contrast sort can’t be distilled anymore from the (lack of) serifs. </p>
      <p>Page 82 of the <em> Automating Type Design Processes</em>, which is part of the LeMo version 2.0 download, shows the effect on the serifs of the lowering of the contrast. In one of the next versions of LeMo the ‘Pen thickness’ function will work for all letters and subsequently the used parameters will have an effect on the contrast and the related serif angles, and optionally the serifs can be removed then.</p>
