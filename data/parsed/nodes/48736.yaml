      <p>James Puckett:</p>
      <p>‘[...] Are user-created models something we can expect in a future version? [...]’</p>
      <p>You must correct me if I am wrong, but this question seems to imply that the underlaying models for the Harmonic Systems are arbitrary, which they are not in my opinion. The model for the Textletters shows the underlaying and historically developed construction, which finds its origin in writing with the broad nib. This opposed to user defined patterns for constructing a particular type design, which can to a certain extend be derived from, or relate to a Harmonic System, depending on the level of support of the conventions.</p>
      <p>‘[...] Also, will the text of your talk be posted for those of us who can’t make it to ATypI? [...]’</p>
      <p>The next edition of the DTL LetterModeller will be accompanied by the launch of the lettermodel.org/com web site, on which supporting texts will be placed.</p>
      <p>Frank E. Blokland</p>
