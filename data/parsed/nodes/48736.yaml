    html: |-
      <p><strong>Some brief notes to a few illustrations from the <em>Harmonische Systemen</em> PDF, which is part of the LeMo 2.0.0 download.</strong></p>
      <p>The characters which are part of the scripts that are in use all over the world are not supplied by God(s) nor find their origin in nature, but are actually inventions of mankind. The differences between these scripts and their underlaying structures make it plausible that the requirements are mostly culturally and historically based. One can’t apply the same (design) rules concerning harmony and rhythm for the latin script on for instance Hangul, like the traditional music of Korea is not comparable with Western music and even seems to lack what we call harmony.<br>
      &nbsp;<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/LeMo_2_6482.jpg"></div><br>
      &nbsp;<br>
      Therefore the rules for good typography, that derive from the scripts, i.e., the letterforms themselves, and which for instance show up in the ‘hierarchy of space’, cannot be universally applied, but only within the (elements of the) scripts themselves. These rules are anchored in what I would like to name <em>Harmonic Systems</em>. For Latin these <em>Harmonic Systems</em> are Capitals, Textletters and Cursives. These systems are not completely coherent and share collections of different <em>Harmonic Models</em>, <em>Proportional Systems</em>, <em>Relational Systems</em> and <em>Rhythmic Systems</em>.<p></p>
      <p>These models and systems and their combinations are the result of the sum of evolution, direct interference of scholars and (the moments in time of) technical innovations.<br>
      &nbsp;<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/LeMo_1_5686.jpg"></div><br>
      &nbsp;<br>
      The <em>Harmonic Syetems</em> are neither perfect nor sacred, but anchored in conventions. Conventions are blueprints for conditioning and conditioning on it’s turn preserves the conventions. That may be a scary thought for every type lecturer (at least it is for me!), but we simply have to acknowledge this fact and to deal with it.<br>
      &nbsp;<br>
      <div class="imageWrap"><img src="http://typophile.com/files/LeMo_8_5734.jpg"></div><br>
      &nbsp;<br>
      To understand the requirements, or to be able to deviate from these, one has to understand the structure of the underlaying systems and models. The themes on which all current type designers make variations, find their origin in systems and models that were fixated in the fifteenth century by the invention of movable type. Type designers basically put a relatively thin (but often complex) layer of varnish by making variations on the more than five centuries old themes which have become the standard. The newly created typefaces are the result then of the designers’ insights, technical skills and, of course, the <em>Zeitgeist</em>.<p></p>
      <p>Letterforms that are made for Latin but which are outside the conventions, like for instance Wim Crouwel’s <em>New Alphabet</em>, can only be judged as such by applying the rules that derive from the underlaying structure, i.e., the conventions that are defined by the type design itself.</p>
      <p>One could argue that Capitals, Textletters and Cursives find their origin in the movements that result in a single line (‘skeleton’) form on which a certain contrast sort (‘translation’, ‘expansion’ or a combination of these), contrast and subsequent contrast flow (can be influenced by rotation) are applied. Another opinion is that the shapes find their origin in (the restrictions of) the tool that was used to make the movements. In case of the variations on the Textletters and Cursives from the Renaissance (‘Humanistic’) the pen in question was the broad nib, as was the case with the ‘base model’ from the 8th century (‘Carolingian’).<br>
      &nbsp;<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/LeMo_9_3668.jpg"></div><br>
      &nbsp;<br>
      The models above show that when translation is applied on a ‘skeleton’ form of a Textletter ‘n’, the construction changes significantly depending on the vector angle. The position of the highest contrast in the arch moves in case the pen angle is changed. Due to the conventions one would expect the highest contrast in the arch nearby or even attached to the stem. So, the ‘skelton’ shape works for the ‘n’ on the right, but not for the other one.<br>
      &nbsp;<br>
      <div class="imageWrap"><img src="http://typophile.com/files/LeMo_3_6544.jpg"></div><br>
      &nbsp;<br>
      When writing such a Textletter, normally (but not necessarily) the pen is lifted and the ‘skeleton’ lines that define the stem and arch are not connected. When stem and arch have to be connected to construct an uninterrupted shape, the 'skeleton' line should represent/follow the ‘vector bridge’, i.e., the angle and width of the broad nib effect applied.<br>
      &nbsp;<br>
      <div class="imageWrap"><img src="http://typophile.com/files/LeMo_4_6583.jpg"></div><br>
      &nbsp;<br>
      In the primary Harmonic Model (phm) in the current LeMo edition the ‘s’ lacks and it is obvious that the 'k' and 'v-z' range are not faultless when it comes to the design and digital representation, especially when serifs are applied. One could conclude that therefore the model is to much restricted or is even incorrect to represent the Textletter. In fact, it is not strange that the letters in question cannot be defined faultlessly with the phm; as everyone who writes with a broad nib knows, these letters need some tweaking and bending to fit with the other ones.<br>
      &nbsp;<br>
      <div class="imageWrap"><img src="http://typophile.com/files/LeMo_5_4972.jpg"></div><br>
      &nbsp;<br>
      The ‘k’ and the ‘v-z’ range, but also the ‘s’ are definitely directly derived from the capitals and therefore represent a different Harmonic Model. Capitals <strong>do</strong> find their origin in ‘skeleton’ lines, which were eventually vectorized by the Romans. The geometrical and relatively simple shapes of the Capitals allow the applying of broad nib effects using different vector angles.<br>
      &nbsp;<br>
      <div class="imageWrap"><img src="http://typophile.com/files/LeMo_6_6272.jpg"></div><br>
      &nbsp;<br>
      The next edition of the LetterModeller will contain a library of ‘skeleton’ shapes for, amongst other characters, the Capitals and ‘k’ plus ‘v-z’ range. All parameter settings for the phm can be applied on these characters then.<br>
      &nbsp;<br>
      <div class="imageWrap"><img src="http://typophile.com/files/LeMo_7_6438.jpg"></div><br>
      &nbsp;<br>
      Another addition will be the ‘disconnection’ of the serifs of the basic model afterwards, by using the ‘general’ parameters and the subsequent applying ‘independent’ general parameters, i.e., for all serifs, or even local ones (per [part of the] serif).<br>
      &nbsp;<p></p>
    html_clean: |-
      <p><strong>Some brief notes to a few illustrations from the <em>Harmonische Systemen</em> PDF, which is part of the LeMo 2.0.0 download.</strong></p>
      <p>The characters which are part of the scripts that are in use all over the world are not supplied by God(s) nor find their origin in nature, but are actually inventions of mankind. The differences between these scripts and their underlaying structures make it plausible that the requirements are mostly culturally and historically based. One can’t apply the same (design) rules concerning harmony and rhythm for the latin script on for instance Hangul, like the traditional music of Korea is not comparable with Western music and even seems to lack what we call harmony.<br>
      &nbsp;<br>
      </p><div class="imageWrap"><img src="/files/lemo_2_6482.jpg"></div><br>
      &nbsp;<br>
      Therefore the rules for good typography, that derive from the scripts, i.e., the letterforms themselves, and which for instance show up in the ‘hierarchy of space’, cannot be universally applied, but only within the (elements of the) scripts themselves. These rules are anchored in what I would like to name <em>Harmonic Systems</em>. For Latin these <em>Harmonic Systems</em> are Capitals, Textletters and Cursives. These systems are not completely coherent and share collections of different <em>Harmonic Models</em>, <em>Proportional Systems</em>, <em>Relational Systems</em> and <em>Rhythmic Systems</em>.<p></p>
      <p>These models and systems and their combinations are the result of the sum of evolution, direct interference of scholars and (the moments in time of) technical innovations.<br>
      &nbsp;<br>
      </p><div class="imageWrap"><img src="/files/lemo_1_5686.jpg"></div><br>
      &nbsp;<br>
      The <em>Harmonic Syetems</em> are neither perfect nor sacred, but anchored in conventions. Conventions are blueprints for conditioning and conditioning on it’s turn preserves the conventions. That may be a scary thought for every type lecturer (at least it is for me!), but we simply have to acknowledge this fact and to deal with it.<br>
