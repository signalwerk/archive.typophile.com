    html: |-
      <p>Ultimately, the system should work for connected scripts. This looks promising!</p>
      <p>I developed a feature code for OpenType substitutions in connected scripts (Latin), with glyphs having joins (connecting entry/exit strokes) that are:</p>
      <p>Left joins:<br>
      1. none<br>
      2. top<br>
      3. bottom</p>
      <p>Right joins:<br>
      1. none<br>
      2. top<br>
      3. bottom</p>
      <p>There is a reductive logical constraint here, but the system has much in common with the traditional "joining rules" of calligraphy, e.g. in the chancery script.</p>
      <p>This technique was explained at a workshop at TypeCon in New York which I co-presented with Adam Twardoch and Thomas Phinney.</p>
      <p>I haven't got around to fully implementing it in a type design yet (although there is some of it reverse engineered into Handsome Pro), but will have a go at using it on my own handwriting one day.</p>
      <p>I got the idea that a connected script could be based on a skeletal path when making the Handsome family, with a variety of styles that are different "pens" based on the same skeleton, executed with different path-stroking treatments. </p>
      <p>But of course, this is Knuth's idea of the metafont.</p>
