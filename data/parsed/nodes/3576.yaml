  html: <p> Im dealing with an agency at the minute who are producing a custom font for a company I work for. As we are increasingly using fonts cross platform for director and powerpoint presentations I was wondering if I should get them to publish the final version in OpenType format. Which OSs / applications are supported at the minute? I dont need bells and whistles, just that the font will work. <br> <br>Also is anybody here using OpenType fonts and found any advantages/disadvantages using them. <br> <br>Cheers <br> <br>Craig </p>
