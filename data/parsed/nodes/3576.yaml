    html: <p>I'm having a lot of problems working with OT and can't seem to find anyone--Adobe, included--who can give me some answers. <br> <br>I'm using ATM Deluxe 4.6x and laying out collateral in Quark 4.x. My machine's performance is severly impaired using them (printing takes longer, page scrolling is a chore, etc.). Is there a reason for this? <br> <br>My main problem is with the local service bureau not being able to handle the OT formats. I've checked with them to ensure they are up-to-date with software versions and all of that; they assure me that they are. They are unable to print to any printer, film output device, whatever.  <br> <br>Can anyone here shed any light on this? I've read all of the readme's, pdfs, and official documenation at adobe.com, and looked everywhere else I can for more information. While everyone seems to speak highly of OT here, the design community still seem to be resonating with grumblings. <br> <br>Thanks in advance. <br> <br>cp  <br> <br></p>
    html_clean: <p>I'm having a lot of problems working with OT and can't seem to find anyone--Adobe, included--who can give me some answers. <br> <br>I'm using ATM Deluxe 4.6x and laying out collateral in Quark 4.x. My machine's performance is severly impaired using them (printing takes longer, page scrolling is a chore, etc.). Is there a reason for this? <br> <br>My main problem is with the local service bureau not being able to handle the OT formats. I've checked with them to ensure they are up-to-date with software versions and all of that; they assure me that they are. They are unable to print to any printer, film output device, whatever.  <br> <br>Can anyone here shed any light on this? I've read all of the readme's, pdfs, and official documenation at adobe.com, and looked everywhere else I can for more information. While everyone seems to speak highly of OT here, the design community still seem to be resonating with grumblings. <br> <br>Thanks in advance. <br> <br>cp  <br> <br></p>
