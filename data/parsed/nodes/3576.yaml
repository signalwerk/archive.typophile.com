    html: <p>There's a lot of information on OS and app stuff in the OpenType User Guide from Adobe, and our readme. Both can be found at <a href="http://www.adobe.com/type/opentype" target="_top">http://www.adobe.com/type/opentype</a>. <br> <br>Any other comments I make on the wonderfulness of OpenType are likely to be suspect, given my day job, but I can say that OpenType works on Windows 2000 and XP, and Mac OS X, natively. On Windows 95/98/ME and Mac OS 8.6-9.2, you need ATM Light or Deluxe. But of course, you'd need that for Type 1 fonts as well on those OSes. <br> <br>Regards, <br> <br>T <br> <br>Thomas Phinney <br>Program Mgr., Western Language Fonts <br>Adobe Systems</p>
    html_clean: <p>There's a lot of information on OS and app stuff in the OpenType User Guide from Adobe, and our readme. Both can be found at <a href="http://www.adobe.com/type/opentype" target="_top" class="link-external">http://www.adobe.com/type/opentype</a>. <br> <br>Any other comments I make on the wonderfulness of OpenType are likely to be suspect, given my day job, but I can say that OpenType works on Windows 2000 and XP, and Mac OS X, natively. On Windows 95/98/ME and Mac OS 8.6-9.2, you need ATM Light or Deluxe. But of course, you'd need that for Type 1 fonts as well on those OSes. <br> <br>Regards, <br> <br>T <br> <br>Thomas Phinney <br>Program Mgr., Western Language Fonts <br>Adobe Systems</p>
