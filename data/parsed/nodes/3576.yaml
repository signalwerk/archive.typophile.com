  - id: 27474
    user: 1262
    date: 2003-03-17T08:55:00
    date_raw: 17 Mar 2003 — 8:55am
    votes: null
    html: <p><i>OT, although a very problematic format for developer, as I hear, is wonderful from this users perspective.</i> <br> <br>I've been making pretty much nothing but OT fonts (TT and CFF) for three years now, and find them much <i>less</i> problematic than Type 1 fonts. Simply having a single binary file to maintain and ship (rather than multiple outline, bitmap, metrics files) makes OT development much easier and less time consuming. Even when I'm not making an extended character set or adding OT Layout features to a font, I'll still output a CFF-OT font in preference to a Type 1 because the file format is tidier, more compact and cross-platform.</p>
