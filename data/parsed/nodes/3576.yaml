    html: <p>For you info, I have done film output on my usual local printer shop from Indesign 1.5 and 2.0 on Mac 9 and Mac X in last september with OpenType fonts (my own OT done with FL 4.5 win version) -- with no problem at all. The film machine was an Agfa something... What is generally need is a rip with PS 3 (5 to 10  years old now I think... but many services bureaus in France still be on PS 2, hum). <br> <br>Miss to say, that I came with my Powerbook, mainly to avoid to give fonts and control everything, its for the Sabon Next brochure and the Charles Peignot book for ATypI. <br><a href="http://www.typofonderie.com/atypi/cpbook.html" target="_blank">http://www.typofonderie.com/atypi/cpbook.html</a> <br> <br>I never trust a printer when he say that he was up to date. Indeed some are up to date! Thanks for us. <br> <br>Good luck.</p>
