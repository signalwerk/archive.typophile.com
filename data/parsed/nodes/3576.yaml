    html: <p>Hmmm... re your problem with OT-Fonts, the problem seems to be with the ouput bureau. The only thing about OT is that SOMETIMES they'll have to be installed locally, at the machine doing the actual output, not on some server location. But that's about it. When I bought my first OTs via Fontshop US from Adobe (couldn't buy them directly, as Adobe doesn't do business with Non-US-Customers on their homepage, alas, so Fontshop helped me for a small fee), I got MAC Fonts and even those installed perfectly on my XP-machine.  <br> <br>OT, although a very problematic format for developer, as I hear, is wonderful from this users perspective. If you work with InDesign and -- as we do -- on Wintel workstations, youi'll not only be happy about the MASSIVE plus in typographic efficiency and freedom but </p>
