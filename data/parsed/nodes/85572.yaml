      <p>Looking at one of the two DVD cases I have available and I'd say Futura Medium Condensed. But I would honestly think it can change from case-to-case. I am looking at the back of a Sons of Anarchy case and it doesn't specifically say: "NOT AUTHORIZED FOR SALE OR RENTAL OUTSIDE THE USA This copyrighted product has been..." it says something more like: "The unauthorized reproduction..." and that is set in Futura Medium Condensed.</p>
      <p>I looked on the other case and it looked like that type of text was laid out in Helvetica of some sort. Can't upload an image to get a more exact answer?</p>
