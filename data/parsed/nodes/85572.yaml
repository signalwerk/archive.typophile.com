    <p>Hi there! </p>
    <p>Does anyone know what font is used on the back of DVD covers at the bottom? Please note that I do NOT mean the font used on movie posters. The font I mean is the one that might say "NOT AUTHORIZED FOR SALE OR RENTAL OUTSIDE THE USA This copyrighted product has been..." etc...</p>
    <p>Any feedback welcome. </p>
    <p>Thanks.</p>
