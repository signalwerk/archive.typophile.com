    <p>Hello, My name is Luciano Vergara, i'm from Chile and I'm new in this forum, but not in this site. <br>The reason that bring me to this place, it's help, cause' i'm also new in typedesign, actually this is my first attempt to design a text font. <br>Let me explain a little about this type, it's a font for small sizes and low resolution paper like newspaper and dictionaries, this version is the base for the family "Patuda". <br>I need your comments and critics for finished this version and working in the book version and the rest. <br>For the actually estate of "Patuda" please print the pdf, because it's very important the printed function. <br>Please excuse my bad English, I am also speak and write an awful spanish. if you answer in spanish i'll be grateful. Thanks and bye for now.</p>
