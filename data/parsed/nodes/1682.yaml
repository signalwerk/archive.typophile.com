    votes: null
    html: "<p>Luciano, the text samples in the PDF look very good, indicating that the lowercase is in a good state. Can you provide some text in a language that uses the letter k? This is the only lowercase letter that looks a little weak. The lower left stroke of the g looks a bit dark compared to the top, diagonal stroke of the lower bowl: try transferring just a little weight between these strokes. <br> <br>The uppercase has some weight problems: Z, in particular, is very heavy compared to the other letters. Also try making the stem of the J just very slight lighter: it looks darker than the other vertical stems because it is longer. I like the large bowl of the P very much. The middle of the S is a bit heavy. <br> <br>Can you provide a few lines of text set in all uppercase? In the image above and the PDF the baseline overshoot of the C looks extreme, but that may be the effect of seeing it between the B and D.</p>"
    html_clean: "<p>Luciano, the text samples in the PDF look very good, indicating that the lowercase is in a good state. Can you provide some text in a language that uses the letter k? This is the only lowercase letter that looks a little weak. The lower left stroke of the g looks a bit dark compared to the top, diagonal stroke of the lower bowl: try transferring just a little weight between these strokes. <br> <br>The uppercase has some weight problems: Z, in particular, is very heavy compared to the other letters. Also try making the stem of the J just very slight lighter: it looks darker than the other vertical stems because it is longer. I like the large bowl of the P very much. The middle of the S is a bit heavy. <br> <br>Can you provide a few lines of text set in all uppercase? In the image above and the PDF the baseline overshoot of the C looks extreme, but that may be the effect of seeing it between the B and D.</p>"
