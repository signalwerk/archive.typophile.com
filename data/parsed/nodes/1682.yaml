    date: 2003-10-17T09:33:00
    date_raw: 17 Oct 2003 — 9:33am
    votes: null
    html: "<p>Pretty nice! The \"South American style\" of type seems to be converging on this style. Some of your glyphs are very beautiful. <br> <br>Some things: <br>Your vertical proportions are very good (especially for magazine setting). <br>The caps are maybe too small. Making them wider is probably best. <br>The \"a\" and \"g\" are too wide. <br>I'd remove the middle serif from the \"w\". <br>The \"G\" is too wide. <br>The \"M\" needs work. <br> <br>I haven't looked at the spacing yet. <br> <br>hhp <br></p>"
    html_clean: "<p>Pretty nice! The \"South American style\" of type seems to be converging on this style. Some of your glyphs are very beautiful. <br> <br>Some things: <br>Your vertical proportions are very good (especially for magazine setting). <br>The caps are maybe too small. Making them wider is probably best. <br>The \"a\" and \"g\" are too wide. <br>I'd remove the middle serif from the \"w\". <br>The \"G\" is too wide. <br>The \"M\" needs work. <br> <br>I haven't looked at the spacing yet. <br> <br>hhp <br></p>"
