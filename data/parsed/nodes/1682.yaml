    date_raw: 17 Oct 2003 — 6:52pm
    votes: null
    html: <p>The k looks okay in text, although you could very slightly lower the connection to the upright and make the top diagonal arm reach a little bit further to the right. <br> <br>Randy is right about the horizontals in the uppercase, but don't make them too thin. <br> <br>The overshoot of the C looks okay in the all caps setting. The overshoot of the D could be reduced by a couple of units top and bottom. <br> <br>I don't necessarily agree with Hrant and Eduardo about making the caps wider. I'm looking at what seems to me a very attractive magazine face, and in that context I think the narrow caps are a good thing. If you make a book version of the face, that would be when to make the caps wider. However, the K should be a bit wider and the G a bit narrower.</p>
    html_clean: <p>The k looks okay in text, although you could very slightly lower the connection to the upright and make the top diagonal arm reach a little bit further to the right. <br> <br>Randy is right about the horizontals in the uppercase, but don't make them too thin. <br> <br>The overshoot of the C looks okay in the all caps setting. The overshoot of the D could be reduced by a couple of units top and bottom. <br> <br>I don't necessarily agree with Hrant and Eduardo about making the caps wider. I'm looking at what seems to me a very attractive magazine face, and in that context I think the narrow caps are a good thing. If you make a book version of the face, that would be when to make the caps wider. However, the K should be a bit wider and the G a bit narrower.</p>
