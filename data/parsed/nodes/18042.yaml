      <p>More on Amsterdam at <a href="http://www.fontshop.com/fontfeed/archives/2005/11/i_amsterdam_in.cfm" rel="nofollow">The FontFeed</a>.</p>
      <p>Ole Schäfer and Erik Spiekermann's <a href="http://www.fontshop.com/showfont.cfm?fid=FF.11230.0.0" rel="nofollow">FF Govan</a> is based on the acclaimed type concept developed for Glasgow 1999 City of Architecture and Design. The Glasgow fonts were reworked by Schäfer and extended to include three widths each of six variations plus dingbats. The strength of the family lies in the innovative manner in which the three widths, two ascender heights, two descender lengths and dingbats can be combined. The results are striking and offer a unique way to create emphasis in a sentence or even within a single word. The expert sets also include a large selection of ligatures that represent the most common letter combinations in English, German and French. With FF Govan type setting becomes type sculpting.</p>
    html_clean: |-
      <p>More on Amsterdam at <a href="http://www.fontshop.com/fontfeed/archives/2005/11/i_amsterdam_in.cfm" rel="nofollow" class="link-external">The FontFeed</a>.</p>
      <p>Ole Schäfer and Erik Spiekermann's <a href="http://www.fontshop.com/showfont.cfm?fid=FF.11230.0.0" rel="nofollow" class="link-external">FF Govan</a> is based on the acclaimed type concept developed for Glasgow 1999 City of Architecture and Design. The Glasgow fonts were reworked by Schäfer and extended to include three widths each of six variations plus dingbats. The strength of the family lies in the innovative manner in which the three widths, two ascender heights, two descender lengths and dingbats can be combined. The results are striking and offer a unique way to create emphasis in a sentence or even within a single word. The expert sets also include a large selection of ligatures that represent the most common letter combinations in English, German and French. With FF Govan type setting becomes type sculpting.</p>
