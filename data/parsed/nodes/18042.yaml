      <p>Andrew Haig discusses the use of ! exclamation marks in branding cities. It’s an interesting read. </p>
      <p>The Destination !mark <a href="http://www.oneplusoneequalsthree.com/2006/01/thats_ncredible.html#more" title="http://www.oneplusoneequalsthree.com/2006/01/thats_ncredible.html#more">http://www.oneplusoneequalsthree.com/2006/01/thats_ncredible.html#more</a></p>
      <p>I currently reside in Melbourne, or Me!bourne in that case! It appears to be set in  Ole Schäfer and Erik Spiekermann's FF Info Text. I think it's a good choice.</p>
      <p>However, recently, I have seen the exclamation mark disappear from some branding campaigns! </p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/melbournelogo.gif"></div><p></p>
