      <p>Amsterdam uses Adrian Frutiger's <a href="http://www.linotype.com/72/avenir-family.html" rel="nofollow">Avenir</a> (from Linotype) for their identity work.</p>
      <p>Milan uses a custom typeface derived from <a href="http://www.linotype.com/1046/linotypegianotten-family.html" rel="nofollow">Linotype Gianotten</a>. An article about that project is in the current issue of the <a href="/wiki/Linotype%20Matrix" class="freelinking" rel="nofollow">Linotype Matrix</a>.</p>
