      <p>You ask a great question. I'd be tempted to recommend any of the Martin Majoor faces - perhaps Seria? (<a href="http://www.myfonts.com/fonts/fontfont/seria-sans/familytree.html" title="http://www.myfonts.com/fonts/fontfont/seria-sans/familytree.html">http://www.myfonts.com/fonts/fontfont/seria-sans/familytree.html</a>)</p>
      <p>Also, Neutraface is getting a lot of play lately, but I'd guess you want more x-height...</p>
      <p>There's always Filosofia (<a href="http://www.myfonts.com/fonts/emigre/filosofia/" title="http://www.myfonts.com/fonts/emigre/filosofia/">http://www.myfonts.com/fonts/emigre/filosofia/</a>) and Eidetic Neo (<a href="http://www.myfonts.com/fonts/emigre/eidetic-neo/" title="http://www.myfonts.com/fonts/emigre/eidetic-neo/">http://www.myfonts.com/fonts/emigre/eidetic-neo/</a>).</p>
      <p>Hope this helps, and I'm eager to see what other folks suggest.<br>
      --Michael.</p>
