      <p>I assume you want a serif font.</p>
      <p>FF Quadraat perhaps? Apolline comes to mind. I know that Adobe's WarnockPro is well-liked. Proforma from Font Bureau might serve you well.  FF Avance is a quality face.</p>
      <p>Have a look at some of those. </p>
      <p>Good question, though.</p>
