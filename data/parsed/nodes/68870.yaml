      <p>If you want a modern looking Sans without being 'techno' looking, how about <a class="freelinking external" href="http://www.fontshop.com/fontlist/super_families/fp_dancer/?&amp;sample_text=Whisperjet%20WHISPERJET&amp;update=0" rel="nofollow">FP Dancer</a>, or <a class="freelinking external" href="http://www.fontshop.com/fontlist/super_families/sansa/?&amp;sample_text=Whisperjet%20WHISPERJET&amp;update=0" rel="nofollow">Sansa</a>? Admittedly, this is a random sampling, but I think these look fresh without being the clichéd 'techno' look we see too much of. Maybe some added slanting would be OK too with these.</p>
      <p>- Mike Yanega</p>
