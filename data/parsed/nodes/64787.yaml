  html: |-
    <p>Hello all,</p>
    <p>On the site:  <a href="http://fonts.philip.html5.org/" title="http://fonts.philip.html5.org/">http://fonts.philip.html5.org/</a> there is a font optimization tool for minimizing the font file size by stripping out parts of the font not needed along with some freely available fonts.  The site also lists the "The font-subsetting source code."  </p>
    <p>I was wondering if this type of function is available in any software usable on a Mac or is available as a web op that could do the same for a user with a particular font he is in posession of?</p>
    <p>Hopefully I've made myself clear enough.</p>
    <p>Thanks in advance</p>
    <p>Patrick Chuprina</p>
