  html: |-
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/8_3670.gif"></div><p></p>
    <p>.<br>
    Comalle is an organic roman typeface that recovers some elements proper of handwritten letter forms, even though its strokes do not necessarily refer to a literal calligraphic structure.</p>
    <p>.</p><div class="imageWrap"><img src="http://typophile.com/files/2_6676.gif"></div><br>
    In order to produce a powerful impact on the page, Comalle has thicker strokes than its counter forms. This makes the black of the letter to fill the page thus causing a faster visual impact than other typefaces of similar black and white balance.<p></p>
    <p>.</p><div class="imageWrap"><img src="http://typophile.com/files/1_3422.gif"></div><br>
    One of the most important challenges in the design of Comalle was precisely the balance of black and white areas in the typeface. Interestingly, that precision work would not produce the blacks, but the whites of the letter forms. This is why at first all the efforts were put in the generality rather than the details, but in the end the design of the counter space proved to be by far the major visual feature of the new typeface.<p></p>
    <p>.</p><div class="imageWrap"><img src="http://typophile.com/files/3_4285.gif"></div><br>
    Comalle was conceived at the careful draining and filling of letter forms and thus intends both to charm with its delicate counters and impact the reader with the heavy strokes that conform its unique personality.<p></p>
    <p>More information:<br>
    <a href="http://www.veer.com/products/typedetail.aspx?image=UMT0000327#about" title="http://www.veer.com/products/typedetail.aspx?image=UMT0000327#about">http://www.veer.com/products/typedetail.aspx?image=UMT0000327#about</a></p>
    <p>Type specimen:<br>
    <a href="http://www.veer.com/download/pdf/comalle_specimen.pdf" title="http://www.veer.com/download/pdf/comalle_specimen.pdf">http://www.veer.com/download/pdf/comalle_specimen.pdf</a></p>
    <p>Even more information (in spanish):<br>
    <a href="http://letritas.blogspot.com" title="http://letritas.blogspot.com">http://letritas.blogspot.com</a></p>
    <p>.</p><div class="imageWrap"><img src="http://typophile.com/files/portada_4732.jpg"></div><p></p>
