  html: |-
    <p>I'm looking for a font that similar to Futura, but with a tiny x-height, similar to the attached, but obviously without the distortion of the uppercase and the numerals.</p>
    <p>Failing that perhaps something lighter, with a more curved w, but still with the tiny x-height and the 1920s style. Can anyone recommend anything along those lines?</p>
    <p><img src="http://typophile.com/files/tall%20futura.jpg"></p>
