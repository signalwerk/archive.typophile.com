    html: "<p>Hi Kenn: <br> <br>I've found Myfonts to be very worthwhile. The foundry support has been excellent, for me, and helpful too. More outlets can only help your exposure. Feel free to email me for more info. I haven't had any unpleasant surprises in a year and a half. Myfonts has provided an unxepected extra income. <br> <br>In the last week, I've added a shopping cart and cc processing to my own site to provide an alternative / backup to Myfonts. I don't like having all of my eggs in one basket. <br> <br>Joe VanDerBos <br><a href=\"http://www.joevanderbos.com/type/\" target=\"_blank\">http://www.joevanderbos.com/type/</a></p>"
