    html: <p>Hi Ken, <br> <br>I used to be the Kagi evangelist for a while but quickly changed my tune when I realized they were taking somewhere in the neighborhood of 26% of my total sales for processing. <br> <br>I have been happy as a clam with my new set up using the PDG Shopping Cart. Solid cart and I've had little trouble with it. In total about $400 to set that up and the merchant account plus monthly fees of about $40 and .35 per transaction, but it's closer to 6% of my total sales than 26% <br> <br>I think my fonts is 80/20 so you'd still be better off with Myfonts than Kagi. <br> <br>Stuart :D</p>
