  html: |-
    <p>Hi everyone. Thanks in advance for any assistance you may be able to give.</p>
    <p>I’m working on a (student) project where I’ll be creating a small exhibition<br>
    space describing some aspects of Maroc.</p>
    <p>While I will have some arabic text (for atmosphere), this exhibit would be<br>
    geared to the English speaker, so I’ll need an English-langage typeface to<br>
    deliver my information.</p>
    <p>I’ll be discussing primarily the people and crafts of the country — and not<br>
    the showcardianism of Bogey’s Casablanca, et al.</p>
    <p>Any suggestions for type that might have some interesting features but<br>
    remain readable? A touch of the arabesque without being campy?</p>
    <p>Thanks again.</p>
