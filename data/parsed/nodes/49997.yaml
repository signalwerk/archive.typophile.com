    <p>Someone please talk to me about the height of the paragraph ¶ and section § glyphs .</p>
    <p>Are they cap height tall or descender tall?</p>
    <p>Should they be the same height as each other (disregarding any overshoot)?</p>
    <p>Should they both descend below the baseline or is that a bit old school?</p>
    <p>Does anyone have any thoughts or can I basically do what I want?</p>
    <p>Thanks,<br>
    Nick.</p>
