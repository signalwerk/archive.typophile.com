      <p>The Solotype catalog shows this under the name Zorba and the only digital version by any name that I'm aware of is Zorba on the <a href="http://store.doverpublications.com/0486999769.html" target="_blank" rel="nofollow">24 Bold Script Display Fonts CD</a> by Dover/Dan Solo.</p>
      <p>Note that if you click on the image at the URL above, you'll get a larger image and a few letters from Zorba can be seen on the cover of the book.</p>
