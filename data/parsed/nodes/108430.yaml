      <p>Hi Ryuk, you put me on the spot:)<br>
      Anyway the lettering of "TURKISH &amp; AMERICAN BLEND" is in the style of the rounded serif approach style that was popular circa 1900. Not certain if they were in a font or just artwork. Something fairly close is captured in the italic of Jeff Levine's Lamp Post, a smoothed version of  Post Old Style<br>
      <a href="http://www.myfonts.com/fonts/jnlevine/lamp-post/" title="http://www.myfonts.com/fonts/jnlevine/lamp-post/">http://www.myfonts.com/fonts/jnlevine/lamp-post/</a><br>
      Don</p>
