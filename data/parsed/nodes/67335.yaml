    <p>In the library I just came across some old ATF material that showed "Alpha-Blox."<br>
    These were modular shapes out of which you could build letters etc. A forerunner of Fontstruct, in a way.<br>
    A web search found this:<br>
    <a href="http://www.flickr.com/photos/thearm/4348630485/in/pool-37718678610@N01" title="http://www.flickr.com/photos/thearm/4348630485/in/pool-37718678610@N01">http://www.flickr.com/photos/thearm/4348630485/in/pool-37718678610@N01</a><br>
    Has anyone ever played with these?</p>
