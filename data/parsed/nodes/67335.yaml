      <p>I'd actually planned to post this today, but was having trouble uploading the images.  Micah Currier at The Dale Guild Type Foundry cast these for The Cooper Union.  They are a heck of a lot of fun.  They are essentially letter fragments, but you can also use them to draw images.  We fonted a few extra sets to sell.  You should see the zombie prints the Yee Haw guys have done with them!</p>
      <p>Our promo print linked above is by Yee Haw alumnus Brian C. Baker.</p>
      <p>DGM<br>
      The Arm Letterpress/The Cooper Union/The Dale Guild Type Foundry<br>
      Brooklyn, NY</p>
