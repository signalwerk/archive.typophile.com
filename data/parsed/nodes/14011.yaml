    <p>i've heard arguments for and against (not so much for but i've seen it in practice) that when you create a letter like lowercase 'b' you can use that letter shape to create other letters like lowercase 'd', lowercase 'p' etc...</p>
    <p>i sort of figure minor adjustments are necessary in some situations, but i've seen instances where the letter is completely flipped or flopped with no adjustment at all. is this common practice amongst well established and revered type designers? is flopping a 'b' to make a 'd' completely legit? my gut would say no but then i am just a rookie</p>
    <p>any advice would be great</p>
    <p>w|m</p>
