  - id: 273636
    user: 1262
    date: 2008-04-18T20:03:00
    date_raw: 18.Apr.2008 8.03pm
    votes: null
    html: "<p>I finally bit the bullet and started using Vista when I bought a new machine recently. I have to say that I was pleasantly surprised, but I’m aware that the ’pleasantly’ part of that experience is in large part due to the staggeringly powerful nature of the hardware: this is not an operating system that I would want to be using on a slower machine. But on the whole, I like it, and see many features that I had long wanted in XP (including an ’Install’ option in the right-click context menu for font files, and the ability to overwrite an existing font without first uninstalling the old version, which is like gold for font testing).</p>"
