      <p>Yeah I don’t quite get that. I am a Mac user but I had to set up a PC for my wife. It had XP on it. It was actually much easier than I remember, the last time I had run a PC was a Dell 386. Back then I remember having to specify an interrupt for the audio card I installed, it was a total pain. XP was actually plug and play so I didn’t think it was that bad.</p>
      <p>pbc</p>
