    html: <p>It’s sort of funny to watch Windows users groveling like dogs for Windows XP, an OS so awful it made me feel like some programmers and UI designers had just taken a dump on Windows 2000 and rereleased it. This sort of silliness makes me glad that I haven’t used Windows as a primary OS in a long, long time.</p>
