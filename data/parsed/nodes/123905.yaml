    html: <p>Unfortunately there are not many good options when it comes to low contrast Arabic typeface. If I were commissioned to the task I would choose myriad arabic. In my opinion it's the only one which is drawn respectfully to the arabic script esthetics. You might say that Gill sans is a geometric design compared to myriad but I can't really suggest you a better option.</p>
