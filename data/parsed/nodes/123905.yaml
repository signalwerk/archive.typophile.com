  html: |-
    <p>Hello everybody,<br>
    Right now I'm designing an academic online magazine, and I'm looking for<br>
    1) an Arabic font to pair with Gill Sans for headlines (light) and sub-heads (reg)<br>
    2) an Arabic font to pair with a humanist serif like Scala (it must be a font that supports Greek) in the long copy.</p>
    <p>I've been doing some research, and came across some stuff that I liked, but I know really only a little bit about Arabic typography (I'm really not a typography specialist anyway), so I thought I'd try to get some professional's opinion (besides my partner's, whom I'll pester with my questions tonight, too).<br>
    I especially enjoyed reading this discussion: <a href="http://typophile.com/node/92658">http://typophile.com/node/92658</a><br>
    Since the academic project is about research in different medieval cultures, I definitely want to avoid a "latinized" Arabic font by all means.</p>
    <p>I started out with the Quadraat – which I love – for the logo and headlines (sans) and long copy (serif), and the client liked it for the long copy, but settled for the Gill as headline font – which is also fine with me.<br>
    Then it turned out that they'll have Greek and Arabic words in headlines and text every now and then, so I have to change the text font as well to support Greek. I think Scala will do fine – it's long texts that will be read online as well as printed out on desktop printers.</p>
    <p>Any suggestions? Also, if you have any other suggestions for the Latin fonts, I'm open to that as well.</p>
    <p>Cheers!</p>
