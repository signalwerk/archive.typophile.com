      <p>Thanks a lot to everybody.<br>
      I just received a scan of the original edition from 1923 (not in the best quality, though), which is similar to the second version in my first post: </p><div class="imageWrap"><img src="http://typophile.com/files/i-orig_6438.jpg"></div><br>
      Previously, I thought that the upper left sample from the first image I posted here had been the original version, but that does not seem to be the case. My guess is now that the newer version has been created especially for the edition of Schwitters’ works done by Friedhelm Lach in 1974-1981, then reprinted <a href="http://www.amazon.de/Die-literarischen-Werke-5-B%C3%A4nde/dp/383217883X" rel="nofollow">[Amazon]</a>.<br>
      I think that this makes sense – do you agree?<p></p>
