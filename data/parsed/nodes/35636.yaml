      <p>Gerald,<br>
      thank you for your comment, that is exactly the kind of information I am looking for because I don't have any real working experience in a letterpress environment.<br>
      I hope that such knowledge will be preserved though it seems to be a little outdated.<br>
      You are indicating that procedures like the ones presumably used for the preparation of my examples is <cite>fairly routine letterpress practices</cite>: This seconds my assumption that most of the "historical avant-garde" type experiments are in fact applications of standard printing opportunities of their time (and space, and knowledge, and availability of resources) to a new field (literature).<br>
      Any more comments on the examples above?<br>
      Thanks again, Stephan</p>
