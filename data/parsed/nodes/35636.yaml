      <p>Stephen</p>
      <p>In most of these illustrations the combinations of existent cast material would have been constructed using a printers' saw (or similar device), which would allow one to either cut away material or undercut (the body only) as in kerning. Fairly routine letterpress practices. None of these look like they would have required a special lockup as you speculate. </p>
      <p>Gerald<br>
      The Bieler Press<br>
      <a href="http://BielerPress.blogspot.com" title="http://BielerPress.blogspot.com">http://BielerPress.blogspot.com</a></p>
