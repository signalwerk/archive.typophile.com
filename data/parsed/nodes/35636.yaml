      <p>The bottom example really shows how it was done. Note that the N does not join ... it is done with three pieces of rule, abutting. Thus I suspect that the dot is a bullet character built into the line above. It would be interesting to see what arrangement of furniture pieces was used to make those slanted rules sit as they do.</p>
      <p>The top example is more likely a logotype cast in one piece. The thin strokes of the N make me fairly certain it would be cast metal, and not a wood type block.</p>
