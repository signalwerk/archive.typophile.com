    html: |-
      <p>Stephen</p>
      <p>To some extent, most of the "historical avant-garde" experiments would have been produced with time-honored printing practices. I think that Marinetti's page of 1918[?] (which interestingly is contemporary with Cobden-Sanderson's Genesis page) was produced simply by pouring molten lead into the chase to lockup the random configuration of the various metal type pieces. Nothing new about the practice, but there sure was about Marinetti.</p>
      <p>I'm not sure the slanted lines are actually rule but likely large slashes that were undercut. Looks like the 2nd and 3rd examples are simply a lower case i snugged up against the slashes. First example could simply be a large point (period) turned sideways and cut to fit. All kinds of possibilities. But I don't see any need here for clever lockups.</p>
      <p>Gerald<br>
      The Bieler Press<br>
      <a href="http://BielerPress.blogspot.com" title="http://BielerPress.blogspot.com">http://BielerPress.blogspot.com</a></p>
