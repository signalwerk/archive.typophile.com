      <p>The letter was made by mitering the lines (Rules) up against a conventional letter. A letterpress bullet was placed on the top.<br>
      The spacing material to support it were also mitered at a 45 degree angle. It was an everday practice in the composing rooms of the past. I maintain a letterpress environment just to keep my head straight and I find it a way to unwind from the Mac.</p>
