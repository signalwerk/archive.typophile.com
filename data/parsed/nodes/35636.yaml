    <p>Hi everyone,<br>
    I’ve got a tricky question especially for those familiar with metal typesetting: How would you think the “i”s in the figure below were printed?<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/ivarianten_3664.jpg"></div><br>
    I’ve already got some ideas especially on the ones with separate strokes, but I’d rather not bias your opinions.<br>
    The samples date from the years 1922 to 1924 [exception: I don’t know about the origin of the middle and right sample in the upper row as these are scans I found from the web] and they are taken from the works of Kurt Schwitters.*<p></p>
    <p><em>* Of course, this is copyrighted material. I consider uploading the above picture a quotation for solely scientific purposes and I am willing to remove it on request.</em></p>
