    html: |-
      <p>Kristian, Don (Don: it’s an i, not an N! ;-)), thanks so far. Both of your guesses go into the same direction that I thought possible. The cliché or other type of “done in one piece” seems to be done differently in the two examples, though: I agree that the thin strokes could probably be cast metal, but in the lower right example ("1924") the left upstroke is not as smooth and the bottom of the stem looks curved or even carved (by hand?): </p><div class="imageWrap"><img src="http://typophile.com/files/i3_3673.jpg"></div><br>
      Then again in the other examples, there are different types of rules: some are angled on one (or both) ends, others aren’t. E.g. in the lower left example, there might have been used two different kinds of rule: the left one (first upstroke) being angled ~60° on the lower end, ~30° on the upper end, and the right one (second upstroke) twice ~45°. I haven’t worked with lead composition that much, and of course I don’t have any idea about the actual usage of leaden rules (in Germany of the 1920s). If a typesetter had to do such a figure and did not want to produce any kind of cliché, would he or she start filing the rules or were there special rules (for creating frames, I would think 45° were a pretty good start…) designated for such jobs normally available in printshops?<br>
      I am inclined to ask the same question about the (bolder) central part of the two examples at the right in the first row (only, they are angled like "//" instead of "/\\").<br>
      And, one more question: Do you think that the different "i"s in the first two lower examples are actually "i"s from a sansserif face with rules to the left and right or are they more likely to be constructed from a rule plus some kind of dot or bullet character?<br>
      Quite a lot of more tricky questions, I would appreciate your answers!<p></p>
