      <p>Eric,</p>
      <p>What James says is largely true to a degree. The profit margin isn’t as good as other segments of the industry. The deadlines are shorter because production time isn’t usually properly factored in. And, signs are generally the last thing that a business considers, by which time the money is gone. That said, personally, I think every designer that might design a sign should work in a sign shop, at least for a few months. It would give them a better feel for the media and what is possible. </p>
      <p>But, the biggest problem comes later when you are ready to move on in your career. Every other segment of the design industry looks at sign makers as just above dog catchers or garbage men. It doesn’t matter how good you are or what you have done, as soon as you say signs you are branded as incompetant. It may be different if you work for some of the few high end sign shops that get the national accounts.</p>
      <p>My personal exerience, I have established sign standards for multi-million dollar organizations. I have overseen the designs and fabrication for one project with more pieces of art in three weeks than most design operations do in six months. I’ve gone head to head with people worth millions so that they would get good product even above their objections. </p>
      <p>I can’t even get an interview in an entry level position.</p>
      <p>I might not be the best person to listen to on the subject because I’m a little bitter...</p>
      <p>~~~~~~~~~~~~~</p>
      <p><a class="freelinking-external" href="http://www.thefontry.com"><em>...from the Fontry </em></a></p>
