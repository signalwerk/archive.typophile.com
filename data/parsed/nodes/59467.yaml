      <p>I recently got my first professional gig after graduation—well, 13 months after graduation. Now my first paychecks are going to the parents, since I didn’t get any sort of job over that whole time. I just painted the house and did lawn work—it was pretty much an allowance. </p>
      <p>Now i have a job that pays really well, in the 4th hardest hit town/city in America. Go figure. I think you DO need to mail, not email, and know who you’re sending to. You DO need to call at a time you stated in your cover letter. It shows you really are interested, and that you want a job, and aren’t just expecting one to land in your hands.</p>
      <p>However, for all the people I mailed, interviews I went to (that would have hired if it weren’t for current economic conditions), it was the fact that I was on monster.com that got me a job. GO FIGURE! </p>
      <p>And though I don’t want to say that such things will pan out, I can say that this particular employer wasn’t posting an open job, just browsing applicants at their leisure—so it may be worth setting yourself up on those things, and maybe that good job will come around.</p>
      <p>In the meantime, take a crappy job so you can have yourself some kind of insurance, or at least money to make life seem worthwhile until that next job!</p>
    html_clean: |-
      <p>I recently got my first professional gig after graduation—well, 13 months after graduation. Now my first paychecks are going to the parents, since I didn’t get any sort of job over that whole time. I just painted the house and did lawn work—it was pretty much an allowance. </p>
      <p>Now i have a job that pays really well, in the 4th hardest hit town/city in America. Go figure. I think you DO need to mail, not email, and know who you’re sending to. You DO need to call at a time you stated in your cover letter. It shows you really are interested, and that you want a job, and aren’t just expecting one to land in your hands.</p>
      <p>However, for all the people I mailed, interviews I went to (that would have hired if it weren’t for current economic conditions), it was the fact that I was on monster.com that got me a job. GO FIGURE! </p>
      <p>And though I don’t want to say that such things will pan out, I can say that this particular employer wasn’t posting an open job, just browsing applicants at their leisure—so it may be worth setting yourself up on those things, and maybe that good job will come around.</p>
      <p>In the meantime, take a crappy job so you can have yourself some kind of insurance, or at least money to make life seem worthwhile until that next job!</p>
