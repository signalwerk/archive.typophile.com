    <p>ok, so I graduated last month, send some mailers, got my website published on blogs, got some good feedback.</p>
    <p>BUT, I haven’t had many interviews at all.  No offers for jobs.</p>
    <p>I’m being supported by my parents for the meantime, but that won’t last very long.  I freelannced for free.</p>
    <p>Given that I think most of you have been in similar situations or at least gone through the post design school ordeal, can you offer advice?  I’m not discouraged, but it would be great to have a paycheck thats better than retail.</p>
    <p>my school has a job board with a bunch of jobs I don’t want?</p>
    <p>Should I hold out and look more, inquire about places I’m not interested in?</p>
