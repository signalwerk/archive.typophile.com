      <p>NY placement agencies (in no particular order): </p>
      <p><a href="http://www.cnsny.com/">CNS</a></p>
      <p><a href="http://www.rgarecruiting.com/rga/">Roz Goldfarb Associates</a></p>
      <p><a href="http://www.updategraphics.com/home.asp">Update Graphics</a></p>
      <p><a href="http://www.cti-group.com/graphics.htm">CTI Graphics</a></p>
      <p><a href="http://www.creativecircle.com/">Creative Circle</a></p>
      <p>...Just a few that I am able to remember off the top of my head.</p>
      <p>Job Boards: Creative Hotlist, Mediabistro. </p>
      <p>Put your résumé on Monster, and create a portfolio on Coroflot. Doing so won’t cost you any money! (Mediabistro and Creative Hotlist charge you for putting up a portfolio on their sites.)</p>
      <p>It’s been said before, but looking for a job is a full-time job. Be proactive about it. These are tough times, so you might have to be less picky, as aluminum says. The important thing is to get some real-world work in your portfolio, and a list of clients or employers on your résumé. Best of luck!</p>
