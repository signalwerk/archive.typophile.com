      <p><cite>Is there a list somewhere on this forum that might give me more bards that I might have missed?</cite></p>
      <p>Even if you watch them all there really just aren’t many junior jobs right now, especially if you don’t have advanced web skills. Clients aren’t paying as much, mid-level people are working for lower salaries, and because there are so many unemployed young designers many studios are using unpaid interns instead of junior designers/production staff. This isn’t just confined to the design industry, it’s a trend that hits most industries during recessions and until things get better there’s not much you can do.</p>
      <p><cite>I know calling can’t hurt, but if you send your resume, a booklet and a business card, and they don’t respond, do you think calling would do any good?</cite></p>
      <p>It probably won’t hurt, but don’t expect it to get you a job, and don’t try to badger or pester your way into an interview. It’s one thing to bug people for an interview doing good times, but right now some of those studios are probably having trouble staying solvent and don’t need the distraction. Also, don’t ever expect any kind of response from designers when you send a resume or apply for a job. Designers have a rather <em>different</em> sense business etiquette and don’t respond to applicants in the ways that other businesses do.</p>
