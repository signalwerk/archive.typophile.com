      <p>Trolling Craigslist under “Creative” and “Creative Gigs” might work, but I’ve found it to be a complete waste of time. Lots of garbage, lots of requests for ludicrously cheap or free work. Insulting, often. However, I may be skipping over a lot of jobs that you may be interested in as a Junior designer, just to get connected.</p>
      <p>On that note, I will say that networking via AIGA events can be fruitful. Hand out business cards, make a good impression, follow up with an email. Tap into your old teachers. Friends of friends always seems to end up as the best resource for me.</p>
      <p>Placement agencies: Creative Circle, Aquent, etc.<br>
      Depends on what city you live in. There will also be smaller talent agencies.</p>
      <p>Job lists: Craigslist, Coroflot, AIGA Design Jobs<br>
      These are being applied to by the hundreds, no doubt. But worth keeping an eye on as you can network and apply specifically for junior positions.</p>
      <p>It’s rough out there. Good luck!</p>
