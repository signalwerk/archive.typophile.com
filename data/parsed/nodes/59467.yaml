      <p>There are definitely things you can learn from a not-so-perfect job:<br>
      - Communicating with bosses and clients<br>
      - Presenting your ideas to an audience of non-designers<br>
      - Compromising (or NOT compromising, gracefully)<br>
      - Dealing with real-world deadlines and time management<br>
      - How a business runs, and how design relates to that business model (ideas you can steal when you run your own business or freelance practice)</p>
      <p>I learned the above at my first few “crappy” jobs; I did NOT learn these skills at school, despite everyone’s best intentions!<br>
      Good luck.</p>
