    html: <p>Since it sounds like you don’t have the luxury of waiting out a perfect job, take the “crappy” one. There have been many good suggestions as to what to try to gain from the experience, also you never know what connections you may make there. The economy is tough and the competition is fierce right now. I’ve been looking for full-time work since my division closed around the holidays and I have gotten very little response to my resume and when I have gotten to the next step, I’ve been told that they received anywhere between 500-800 submissions. There just isn’t much out there and having the opportunity to choose between jobs is really rare. One person on Craig’s list is even offering $700 to whoever can help him/her land a graphic design job. I’m in the tri-state area, if I hear of anything entry level I’ll pass it along. Best of luck to you.</p>
