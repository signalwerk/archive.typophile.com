    <p>Can someone identify the font used in this logo of Harley-Davidson (see attachment)?</p>
    <p>It looks a lot like the the free "Deftones Stylus" font at first sight, but when you look closely it don't. It looks a lot more pro.</p>
    <p>Thanks in advance!</p>
    <img typeof="foaf:Image" class="img-responsive" src="http://www.typophile.com/sites/default/files/old-images/Harley-Davidson-logo-86593F6887-seeklogo.com_.gif" width="200" height="200" alt="">
