      <p>I think you're right that they share a strong resemblance. My thought was that Ray Larabie might have modeled his font on the Harley logo, but I don't know how old the logo is. The font was designed in 1999. If the font came before the logo, the obvious answer is that the logo was a customization of the font, or at least inspired by it.</p>
      <p>We need a Harley fan to tell us when that logo appeared.</p>
      <p>- Mike Yanega</p>
