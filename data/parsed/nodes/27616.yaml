    <p>I've been watching Linotype's <a href="http://www.linotype.com/fontexplorerX" title="Visit Linotype's FontExplorer site" rel="nofollow">FontExplorer X</a> site for months now waiting and waiting for the Windows version, but alas, it has still not been released. In my despair I even asked Linotype last October via email and they said they hoped to have it out at the beginning of 2006.</p>
    <p>So I'm wondering if anyone here can give me a more definive answer or recommend a compelling alternative for Windows.</p>
