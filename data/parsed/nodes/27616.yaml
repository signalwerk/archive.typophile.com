      <p>Peter, I've been waiting and nagging about this for months as well, but a previous post pointed me in the direction of Proxima's <a href="http://www.proximasoftware.com/fontexpert/index.html" target="_blank" rel="nofollow">FontExpert2006</a>, which was just released a few days ago, and while I've only just downloaded the trial a few minutes ago, I like the interface a lot: full character set preview, easy creation of font sets, temporary activation (something Extensis Suitcase removed in their last version), etc. I'm just about to give their auto-activation for InDesign plug-in a test run and will report back here on the result, but even if the plug-in is buggy I have a feeling I'll be migrating to FontExpert (after 4 years running Suitcase).</p>
      <p>As for Linotype, well, I'm sure they're busy with mergers and whatnot, but I'm tired of waiting. I don't mean to look a gift horse in the mouth (Linotype's FX being free and all), but, seriously, why not just throw a note on the website saying "Don't hold your breath."</p>
