      <p>Sharon, I applaud you for even giving FX a shot; I've been so fed up with the wait on this that reading the long list of known issues with this beta was the icing on the cake. While they were probably trying to address the frustration Windows users have felt, waiting and waiting and waiting, this release just screams "we can't be bothered to make this thing actually <em>work</em>, so here's a bungled version for the time being."</p>
      <p>Linotype didn't have to develop FX at all, and for their part I realize all they're getting out of it is PR and some traffic to their store, but to my mind the PR attempt has backfired in a big way. A couple of years ago I simply thought of Linotype as a big foundry where one can purchase font licenses, and now, simply because this ball has been dropped so badly, they've lost me as a possible consumer of their product.</p>
      <p>I'm one person, of course, so who cares what I think, I'm just pissing in the wind here, but if I feel this way I have a feeling others might as well.</p>
