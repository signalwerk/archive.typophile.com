    date: 2008-08-24T18:37:00
    date_raw: 24 Aug 2008 — 6:37pm
    votes: null
    html: <p>I think it has some potential, but I would take a big breath and maybe reconsider the direction you're going with parts of it. For starters, it seems to reference pointed pen script ( I was going to say copperplate, but afraid the terminology may be confusing). Many letters seem too devoid of this reference and, I think, weaken the overall look. Also...even with a lot of randomness going on with swashy forms, I would pay closer attention to how they interact with each other. You might want to close up that word spacing a tad while you're at it.</p>
  - id: 297493
    user: 11831
    date: 2008-08-25T01:21:00
    date_raw: 25 Aug 2008 — 1:21am
    votes: null
    html: <p>Thanks Stephen, yes it initially started life with a pen and paper and almost filled an entire sketchbook with designs. I was aiming for something between copperplate and handwriting, but I am no craftsman when it comes to pen lettering. It's by far finished but I wanted to see what peoples thought so far.</p>
  - id: 298381
    user: 34040
    date: 2008-08-28T15:59:00
    date_raw: 28 Aug 2008 — 3:59pm
    votes: null
    html: |-
      <p>It looks really great from far.<br>
      I realize that this is meant to be read from a reasonable distance but when I get close, I see a lot of inconsistancies with the fine ends on the curves. This is all concerning Penmanship. The actual design of the typeface from a distance is very nice. </p>
      <p>Another thing that I noticed is that the top of the lowercase 'z'  is very straight and horizontal which doesn't fit the handmade look of the other characters. </p>
      <p>The swashes have a lot of personality which is very nice.</p>
