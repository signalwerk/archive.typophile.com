      <p>We’ve found that <a href="http://www.fontshop.com/fonts/downloads/emigre/malaga_volume/">Malaga</a>, <a href="/wiki/Xavier%252BDupr%2525C3%2525A9" class="wiki">Xavier Dupré</a>’s other typeface for Emigre, works well as a companion to his Vista Sans. See it in practice in our <a href="http://www.fontshop.com/fontfeed/archives/2007-fontshop-calendar-november/">November 07 calendar</a>.</p>
      <p>Dupré’s <a href="http://www.fontshop.com/search/?q=Zingha">Zingha</a> and <a href="http://www.fontshop.com/fonts/downloads/fontfont/ff_reminga/">FF Reminga</a> are other serifs infused with his signature flavors.</p>
