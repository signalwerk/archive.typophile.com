      <p>Stephen, I think I'm with you' if this were alone, without other precedent. Where this might break down is there's no parallel for device fonts and embedded fonts. </p>
      <p>But, since it's important to communicate that the software people are licensing is distinctly different (technologically different, or even with distinct licensing characteristics), it adds clarity to call them webfonts.</p>
      <p>webfonts = specific software designed for web browsers</p>
      <p>web fonts = the use or discussion of the software (how about web type, browser-based typography or even just typography). My personal agenda is to remind people that we've entered the post-browser internet age, so you can see my bias showing.</p>
      <p>By the way, Web Fonts or WebFonts will eventually expire. I was thrilled when the style manuals moved away from capitalizing Web and Internet, even though they were about 10 years behind the common lowercase usage. (Ironically my iPad wants to keep capitalizing it without my permission!)</p>
