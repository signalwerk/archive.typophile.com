  html: <p>When writing about fonts made for or licensed for web use, what is your preferred spelling? "Web fonts" is certainly more common (Google results for <a href="http://www.google.com/search?hl=en&amp;as_q=&amp;as_epq=web+fonts" rel="nofollow">web fonts</a> and <a href="http://www.google.com/search?hl=en&amp;as_q=&amp;as_epq=webfonts" rel="nofollow">webfonts</a>), but I'm seeing more of the one word usage now that the market is maturing and providers and users are seeking a way to set apart those fonts that are specifically for the web.</p>
  html_clean: <p>When writing about fonts made for or licensed for web use, what is your preferred spelling? "Web fonts" is certainly more common (Google results for <a href="http://www.google.com/search?hl=en&amp;as_q=&amp;as_epq=web+fonts" rel="nofollow" class="link-external">web fonts</a> and <a href="http://www.google.com/search?hl=en&amp;as_q=&amp;as_epq=webfonts" rel="nofollow" class="link-external">webfonts</a>), but I'm seeing more of the one word usage now that the market is maturing and providers and users are seeking a way to set apart those fonts that are specifically for the web.</p>
