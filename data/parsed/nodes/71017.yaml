    html: |-
      <p>We're already seeing that making two-word "web" compounds into one word is actually behind the trend.</p>
      <p>Web site --&gt; web site --&gt; website --&gt; site</p>
      <p>The same thing has happened for "e-" in many cases. People use "mail" nearly as much as they use "email/e-mail/E-mail" to refer to electronic mail. </p>
      <p>E-mail/e-mail/email --&gt; mail</p>
      <p>So perhaps we could leapfrog some intervening steps here:</p>
      <p>Web font/web font/webfont --&gt; font</p>
      <p>So, why start out specifying "web" or "Web" at all? We're getting to where the Internet and the Web are the default locations for just about everything. The trend to drop "web" is so widespread and common that it's hardly noticed. We have a few highly contested battles for things like "website," but those are the minority cases. </p>
      <p>Look at it from another angle: in most of my conversations with people, they no longer even specify that they heard, read, or learned something on the Internet or Web. It's just assumed. Disambiguation is only required when they learned it offline *and* there's room for confusion. </p>
      <p>I could see how highly technical insiders might require some disambiguation, the same way they might require specifying TrueType or OpenType fonts to their design and typography peers.</p>
      <p>If you do feel that "web" is required, then I am afraid I think it should be an open compund: "web font" or "Web font," which by necessity should create the backformation "desktop font" or similar. But that's just a matter of opinion and style, not of grammar or anything inherent in English.</p>
