      <p>Both Ralph's and my interpretations – where "web fonts" and "webfonts" are slightly different concepts – perhaps bring up a larger issue of a lack of clear terminology to help people avoid lumping everything in to one vague concept. </p>
      <p>Most people will understandably consider "web fonts" to be synonymous with "webfonts" and use them interchangeably. It seems worth killing one or the other, whether or not we adopt other terms to help clarify the subtle distinctions.</p>
