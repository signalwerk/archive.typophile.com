      <p>But in the transition to webified fonts, what of the webbishness of the font? Its webasticity? Is anyone thinking of that!</p>
      <p>Goofing aside - one problem nobody's mentioned is search engines. On the web you write for robots, too. web font, webfont, - what I'm wondering is how Google or Bing pick up on the difference.</p>
      <p>"web fonts" is a topic now popular among techie and type geeks. I don't think anybody outside those professional circles is going to understand or make any distinction between a "web font" and simply a "font".</p>
      <p>I'd prefer just "font" for general readers.<br>
      But right now, it's all about the target audience, context, and SEO.</p>
