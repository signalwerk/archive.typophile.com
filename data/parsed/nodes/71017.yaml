      <p>I should note that using either "webfonts" or "web fonts" is less than ideal when what we really mean is "web typography"; unfortunately, the general public isn't very likely to make those distinctions.</p>
      <p>If the phototype industry is any indication, I get the feeling that people will be inclined to squish the words in to one term as the field grows, so perhaps we should just make like the Germans and decisively embrace the contraction(?)</p>
      <p>I struggled with a similar issue on the issue of "wood type" vs "woodtype". I opt for the two-word variation there, though mostly because of how it has been used historically. See also the thread I started on "sans serif": <a href="http://typophile.com/node/38484" title="http://typophile.com/node/38484">http://typophile.com/node/38484</a></p>
