      <p>I had a conversation about this just the other night at dinner with Jesse Ragan, Jackson Cavanaugh, Kent Lew, and Robb Ogle.</p>
      <p>My personal take on it is perhaps more complicated than it needs to be, but I use "web fonts" when referring to fonts that were made for the web, and "webfonts" when referring to the general use of fonts on the web. Compare it to the difference between "type" and "typography".</p>
