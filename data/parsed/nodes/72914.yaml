    html: |-
      <p>So much depends on the name.<br>
      Some names look harsh, merely through the accident of letter forms (or through being short), while others are naturally soft -- and there is also the sound and meaning of the name to consider -- you may want to counteract or enhance these qualities, at the least they should be negotiated. Get designing, for goodness sake!</p>
      <p>Clearface (U&amp;lc) is very friendly, IMO, and compact, which is useful for making the name big in signage.<br>
      Choice of serif or sans.</p>
