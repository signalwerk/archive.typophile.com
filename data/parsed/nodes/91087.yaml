      <p>I agree with the others that it doesn't matter. </p>
      <p>The only argument I can think of against it is that odd sizes may make it harder to notice a sizing mistake when you glance at the character palette. If you're setting 10/12, a quick glance at the palette will confirm if you're using the right size, but if you're setting 10.25/11.75, those extra digits may make it easier to overlook a sizing mistake when you're tired or in a hurry.  But I don't think that's anything to really worry about, especially since you'll probably be using style sheets anyway.</p>
