    html: |-
      <p>The ideal is what looks right. With  x hts and cap hts not uniformly sized to the em, people who size text for newspapers and magazines looking for just the right size almost always end up in tenths of points. That's what I've seen.</p>
      <p>Also:<br>
      "If delta hints are hints that trigger adjustments at certain sizes, are there ramifications for delta-hinted fonts of using fractional point sizes?"</p>
      <p>Delta hints trigger adjustments at certain pixel per em sizes, not at point sizes, so no, fractional point sizes don't ramify, as such a size is rounded to a whole pixel value by the time deltas strike.</p>
      <p>And, when you're dealing with screen fonts, unless the per inch resolution of the device is a multiple of 72, almost none of the sizes one sees or selects actually are whole numbers if considered in points. E.g. a 10 point font on a 72 dpi device is 10 pixels. One point is one pixel. But a 96 dpi device has 1.333 points per pixel. So at 10 point, 10 x 1.333 = 13.33. Since this rounds to 13 pixels, what you see is really 9.7 point, or whatever.</p>
