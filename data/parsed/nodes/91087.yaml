    html: |-
      <p>@rs_donsata:<br>
      <cite>If there is any value in the point size system is the idea of proportional increments: having a scale relating all type styles in a given design.</cite></p>
      <p><cite>Fibonacci, piramidal numer increments (4, 9, 16, 25), modular...</cite></p>
      <p>It is true that before the point size system we now use was adopted, other schemes were tried based on different principles.</p>
      <p>In 1822, George Bruce proposed a system in which every size of type would be related to the next one smaller by a constant ratio, the sixth root of two:</p>
      <p>Pica: 12 points<br>
      Small Pica: 10.69 points<br>
      Long Primer: 9.52 points<br>
      Bourgeois: 8.49 points<br>
      Brevier: 7.56 points<br>
      Minion: 6.73 points</p>
      <p>In 1824, James Fergusson proposed a system in which 14 lines of Nonpareil type was the fundamental unit, and all the other sizes of type were aliquot parts of that unit:</p>
      <p>Pica: 12 points<br>
      Small Pica: 10 1/2 points<br>
      Long Primer: 9 1/3 points<br>
      Bourgeois: 8 2/5 points<br>
      Brevier: 7 7/11 points<br>
      Minion: 7 points</p>
      <p>So it is indeed true that other mathematical relationships between the different sizes of type were considered before the simplest system, multiples of a basic unit, was accepted. Of course, that system was the most convenient for allowing a limited number of thicknesses of leading to be used to align different type sizes.</p>
      <p>John Savard</p>
