      <p>When I served my time as a comp. in the 1960s, my boss was an old guy aged 63. He knew the old point sizes and would often refer to primer (he pronounced it primma), long primer and minion.</p>
      <p>Large woodletter type, above 72 pt was referred to as, for example, 12 line. This would be 144 pt or 12 picas.</p>
      <p>Our standard range of point sizes for most faces went 6—8—10—12—14—18—24—30—36—48—60—72. For a few faces we also had intermediate sizes, usually 9 and 11 pt. Mostly, the size range was dictated by the foundry, for founders' type and, of course, the needs of the work in hand.</p>
      <p>Odd but somehow I still feel very slightly uncomfortable using a size outside of this range. I think it's because I became so familiar with these sizes that I know exactly what I'm getting so to speak and going outside this feels slightly anarchic. Weird.</p>
