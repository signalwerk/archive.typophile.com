  html: <p>A question I've never directly posed, waiting for the answer to become apparent over time (still a relative newcomer), is whether there are conventions regarding body text sizing in whole or perhaps half point size increments? In book layouts, I often find myself using the work of others as a template, and the point size of the body sometimes appears to be in half increments or even something odder than quarter point size increments. Do my eyes deceive, and do most designers/typsetters adhere to standardized sizings for body text (10, 11, 12 pt)? At present, I'm tempted to set something in 11.25 Dante MT.</p>
