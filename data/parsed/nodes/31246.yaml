      <p>I recently had similar problems, and my solution was not to use Indesign (which makes my comment rather useless for you, I guess). Now I use a homegrown and probably more complicated workflow: XML with a simple DTD &gt; XSLT &gt; LaTeX. Takes more time to convert things, but at least I am now able to use it the way I want…</p>
      <p>Back to topic: What exactly did you change in BBEdit? Might the cause of your problem also be an encoding issue or error in your grep replace pattern?</p>
