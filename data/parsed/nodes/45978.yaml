  html: <p>I am in need of a delicate script font, something very feminine and light, for use in various promo materials for my wedding photography business.  I really like windsong (<a href="http://www.dafont.com/windsong.font" title="http://www.dafont.com/windsong.font">http://www.dafont.com/windsong.font</a>), but the loopy lowercase d drives me insane, especially since "wedding" requires it to be doubled up, which just looks tacky and wrong.  I have tried modifying the more subtle lowercase b, but without much luck.  Any suggestions for a similar look?</p>
  html_clean: <p>I am in need of a delicate script font, something very feminine and light, for use in various promo materials for my wedding photography business.  I really like windsong (<a href="http://www.dafont.com/windsong.font" title="http://www.dafont.com/windsong.font" class="link-external">http://www.dafont.com/windsong.font</a>), but the loopy lowercase d drives me insane, especially since "wedding" requires it to be doubled up, which just looks tacky and wrong.  I have tried modifying the more subtle lowercase b, but without much luck.  Any suggestions for a similar look?</p>
