      <p><cite>&gt; Most any typographically savvy person will tell you that a font<br>
      that works well large cannot work well small, and vice versa.</cite></p>
      <p>No, I'd challenge the «vice versa». I've used text fonts for display to (I think) convincing effect. They may not look as «pretty» as faces made expressly for display sizes; but pretty isn't always what's needed. I think at display sizes you're really quite free to do whatever works or looks right in a given context.<br>
      But yes, display fonts for text, indeed do not work. They need more size to show off their beauty. Not only are they not optimized for reading, they're not optimized for even being reproduced at the smaller sizes typical for text – which may lead to undesired effects upon printing (such as looking too thin/fragile, for example).</p>
