      <p>Your samples may appear the same on screen only. A typical Display font is tweaked to have slightly thinner verticals, because it's intended to be used at larger sizes (this definition of "larger" <em>is</em> left to the type designer). So it's possible your screen just doesn't show the subtle changes.</p>
      <p>Do the same exercise with a large point size and print it out on a high rez laser printer.</p>
      <p>(There are some "Display" fonts that are <em>not</em> simply tweaked variants for larger sizes. The Display style of <a href="http://typophile.com/node/51198" rel="nofollow">Aller Sans</a>, for example, has quite a unique design of its own.)</p>
