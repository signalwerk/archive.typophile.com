    <p>There is a particular typestyle I am interested in, mostly for body text, and all of the weights I like are called Display. The text versions are all heavier.</p>
    <p>Are these designations arbitrary or meant as a general guideline, or are there real things that prevent a display font from working for text, and vice versa?</p>
