    html: |-
      <p>A lot depends on scale.<br>
      For instance, a “display” font will work well at small size in a small document viewed closely—the most stringent measurement of apparent size being arc of vision.</p>
      <p>By a different token, “display” fonts will work better and smaller on coated stocks, rather than on uncoated stock or pixel screens.</p>
      <p>Conversely, “text” fonts will work well at display size when fit is tightened, by decreasing tracking and adjusting kerning accordingly.<br>
      Also, such ostensibly “text” fonts are to be preferred for headlines in hard-to-read media, such as billboards and signage.<br>
      Again, their broad readability may be leveraged in deliberately low-contrast situations, such as color-on-colour, and surprinting the “noise” of patterns or images.</p>
      <p>Context is king, and the typographer the highest authority.</p>
      <p>This is not to say that the distinction between Text and Display is arbitrary, merely provisional; and to these categorical poles must be added the interim designation of Deck.</p>
