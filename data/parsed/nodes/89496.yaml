    html: <p>These days, whether we approve or not, sans get used in text.  Not so much in traditional book usage, but in brochures and technical materials.  The web has brought about a great deal more sans text as well.  Serifs are more difficult to render properly at screen resolution.  I see no reason why not to make a sans, that addresses that market, read as well for text as it can.  Contrast is by nature less of a problem than with roman faces but the width adjustment can still be an issue. When a foundry releases a face that fits the bill and markets it well, it gets used--even if they do not label it as "Text" or "Display."  I think most type buyers take a spin around the block and kick the tires before they settle on a what they might use it for.</p>
