      <p>Good eye on the apparent incongruence between those two statements. Sometimes we make statements based on assumptions, particularly when we are new to a given field. It seems obvious to me that certain fonts are display by virtue of their ornate design, like Curlz, and yet others present ambiguity precisely because they appear conventional, and I was under the impression that the distinction was self evident. In addition, I have to trust the reader knows or can figure out what I mean when I use the descriptor conventional. </p>
      <p>I am not changing my mind, I am merely trusting the reader to make the more obvious distinctions that I cannot be expected to explain with perfect precision.</p>
