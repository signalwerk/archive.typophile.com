      <p>Sans faces are often done in many weights, and sometimes many widths as well. The different weights can be used for different sizes, with tracking. So they don't need to be labelled a much. </p>
      <p>Serif faces usually have much more modulation in stroke, as well has more horizontal elements, and bracketing. All these don't visually scale with linear changes in the outline, so more adjustment is needed. Could it be that these very features that don't scale as easily are the ones which help readability in text? Interesting question, I think.</p>
