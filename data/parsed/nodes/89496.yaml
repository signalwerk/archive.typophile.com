      <p>To my observation, the issue of a display font not working for text has nothing to do with the font per se. The problem with display fonts for use in text appears to be in spacing. The display fonts I looked at simply did not provide enough space between words and lines to be legible. </p>
      <p>As one who is still very new to typestyles, what is most peculiar to me is the lack of control offered to the user in typical word processors with regard to line and word spacing. This is as important as the characters themselves. Another peculiarity is how few typestyles are distinguished as being designed for text or display.</p>
