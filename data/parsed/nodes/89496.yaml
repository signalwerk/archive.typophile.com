      <p>Letterforms intended for text may very well look “ugly” and unbalanced at close inspection, but at text size – with ink spread and all the variables of the human eye – they take on a whole new appearence. In fact (and take this with a grain of salt — I’m still learning), I suspect one of the true virtues of a great designer of text faces is the ability to look beyond the isolated beauty of an “a” or a “g” and rather perfect the word shape and rythm.</p>
      <p>Display type is a whole other beast.</p>
