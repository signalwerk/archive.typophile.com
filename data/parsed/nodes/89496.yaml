      <p>John —</p>
      <p>I suggest you use the term "typeface" or simply "face" to talk about individual designs. What a "typestyle" might mean is ambiguous.</p>
      <p>E.g., "Curlz is my favorite typeface (or face)!" "The Curlz family (or type family) is highly extensive, comprising one font."</p>
      <p>Interestingly, the term to refer to styles of calligraphy is "hand." I've always thought it's suggestive that type comes in "faces" but calligraphy comes in "hands."</p>
      <p>Traditionally, the "three Fs" worked like this:</p>
      <p>A type <strong>family</strong> (e.g., Times) comprised all the versions of that design, and would have been stored in several cabinets in a letterpress shop.<br>
      A type <strong>face</strong> (e.g., Times italic) was one version of that design, and would have been stored in a single cabinet.<br>
      A type <strong>font</strong> (e.g., 10pt Times italic) was one size of one face, and lived in a single case (drawer) in the type cabinet.</p>
      <p>Nowadays, the terms can kind of mean anything, with "font" doing duty for all of them. But "typeface" is usually the way to refer to a specific design.</p>
      <p>Sorry to slightly hijack the thread — I thought you had another thread on terms going, but it seems to have gone away. And now back to your scheduled programming.</p>
