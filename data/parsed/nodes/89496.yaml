      <p>'Display' versions are optimized for printing at larger sizes (often 72 pt but this varies), whereas 'text' versions are optimized for text sizes. You want heavier stems, sturdier serifs, less acute angles and wider letterforms at smaller sizes. If you haven't purchased these fonts yet, is it fair for me to surmise that you're basing your observations on samples you've been looking at on the vendor's website? If so, you're probably looking at the faces at larger sizes to begin with, or are looking at text-sized samples as rendered by your browser. Since WYSIWYG isn't really WYSIWYG, I'd recommend downloading a .pdf sample (if one is available) and printing it out.</p>
      <p>André</p>
