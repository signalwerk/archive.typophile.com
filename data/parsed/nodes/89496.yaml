      <p>I agree with Nina about text fonts often working for display, but generally not visa versa. I would add that I think whether a text font works well in display is not a measure of how good it is as a text font. I don't think my Williams Caslon Text works well as a display font, though Boston Magazine occasionally used it at large size. The bold versions work ok, but not great, as display, in my opinion. Of course I think it works great at text size. </p>
      <p>Times New Roman is to me an example of a great text type where you can just scale up to large sizes, and it still works. I think this is because of its sharp serifs and high contrast. The very oblique old style slant keeps the high contrast from hurting it too much as a text type, and the high contrast keeps working at large sizes. I've seen some say here that Times 10 is better for text, but I haven't done the comparison.</p>
