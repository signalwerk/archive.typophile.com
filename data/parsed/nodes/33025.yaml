    <p>Hi,</p>
    <p>I’m about to design a training certificate for a company in Middle East region. I’d like to incorporate a symbol of knowledge as part of the artwork. But the problem is the meaning of symbols might be very different in different parts of the world.</p>
    <p>For example a popular symbol of knowledge/wisdom in Poland (Europe) is an owl but who knows what it means in Kuwait?</p>
    <p><a href="http://www.wpodkowie.osdw.pl/custom/_3/img/logo.png" title="http://www.wpodkowie.osdw.pl/custom/_3/img/logo.png">http://www.wpodkowie.osdw.pl/custom/_3/img/logo.png</a></p>
    <p>A kind of safe symbol might be a book but maybe there is something different and more specific for Middle East culture?</p>
    <p>Oh, also any references to Middle East ornaments would be much appreciated.</p>
    <p>AL</p>
