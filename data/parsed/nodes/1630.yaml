  html: "<p>Hi there! <br>As a student for design I need your help in <br>identifying the type of the brand Marlboro and <br>the claimtype of Mc Donald's! <br>Marlboro: <br><a href=\"http://www.logo.nino.ru/main/?id=4831&amp;query_id=79165&amp;page=1\" target=\"_blank\">http://www.logo.nino.ru/main/?id=4831&amp;query_id=79165&amp;page=1</a> <br>McDonalds(click on the picture): <br><a href=\"http://www.stern.de/id/wirtschaft/unternehmen/meldungen/512446.html\" target=\"_blank\">http://www.stern.de/id/wirtschaft/unternehmen/meldungen/512446.html</a> <br>McDonalds' claim could be Arial Black... <br>I'm no genius in type... <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\"> <br>Many thanks!!!!! <br>Robert <br> <br> <br></p>"
