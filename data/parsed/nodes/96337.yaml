      <p>The following behavior refers to Adobe InDesign, which I consider the benchmark for sophisticated OpenType feature support:</p>
      <p>Whichever glyphs are include in the ‘cpsp’ feature, they will be spaced accordingly (whether or not they are capitals), when the ‘All Caps’ feature is applied, or with ‘caps lock’ depressed when typing.</p>
      <p>However, if small cap glyphs are included in the cpsp feature, their spacing won’t be affected when smcp or c2sc is applied. </p>
      <p>There is no ‘scsp’ feature.</p>
      <p>Therefore, if small caps are to be spaced out, it has to be done by giving them wider sidebearings.</p>
      <p>The trick is to have the spacing of the small caps match the spacing of the all-cap setting with cpsp applied.</p>
      <p>**</p>
      <p>But how many fonts have this ‘extra sidebearing’ spacing for small caps, tuned to the amount of extra spacing in the ‘c2sc’ feature?</p>
      <p>**</p>
      <p>As an aside, I very rarely include the cpsp feature in my types.<br>
      I think the base setting for an all cap setting should be the sidebearings of the glyphs; then the typographer may track in or out from this benchmark according to the demands of the layout, without having an arbitrary value implemented which is unrelated to that.</p>
