    html: <p>As long as there is an "avoid like the plague" sidebar, I will mention Gisol (Global Internet Solutions). They belong in jail. <br> <br>The selling point of Warped is that you pay for what you get. If you are slashdotted and see a huge spike in traffic, other places usually ask you to upgrade to a higher-limit plan from then onward. At Warped, your bill would be $10 instead of $5 <i>just for that month.</i> <br> <br>Also, there is no obscenity clause in Warped's terms of service. Even when it isn't necessarily relevant, knowing I don't have to worry about running afoul of someone's "community standards" is peace of mind to me.</p>
