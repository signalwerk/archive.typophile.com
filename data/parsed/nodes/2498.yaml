    html: <p>Can't really say anything about the service because I'm not hooked up yet, but I'm currently looking at going with POWweb (quite possibly the worst ending to a name brainstorming session ever). <a href="http://www.powweb.com/" target="_blank">POWweb Link.</a> Their package seems to be pretty awesome for only $7.77 per month, with tons of storage, bandwith, etc. The only complaint I've heard from some current users is that they have some downtime and their support takes a little bit to reply. Otherwise, if you know what you're doing and don't need to be walked through, POWweb is supposed to be great.</p>
