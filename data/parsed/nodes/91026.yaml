      <p>Hmm. I'm going to have to argue with your point on Gutenburg.</p>
      <p>What you said:</p>
      <blockquote><p>I accept that the chinese had wooden blocks but in western culture Gutenberg is generally credited with the invention of the printing press so I'm inclined to let that stand. The point was to establish a timeline in the development of (latin) typography.</p></blockquote>
      <p>The printing press, sure. Gutenburg really helped standardise the process of printing press, ink, etc. but to say that he "invented the first moveable type" is overly simplistic. </p>
      <p>You're working on an MA, so providing more information is a good thing! If I was writing a dissertation on the subject, I would probably say that he standardised the practice in the west, then include a footnote along the lines of "technically moveable printing was first invented in China and there is some controversy over if Gutenburg was influenced by Chinese designs, but that is beyond the scope of this paper." Even if you don't plan to go into it, do explore it and give more context.</p>
      <p>Another thing you might want to consider. For a website dedicated to "web typography", and thus screen typography, your design speaks more to book design and feels old fashioned. I notice under "Best Practices" you talk extensively about Bringhurst and wonder if you're taking your design cues or direction from him. </p>
      <blockquote><p>"The book is aimed squarely at print typographers, devoting only two pages to the screen, nevertheless the fundamentals of typographic design are as valid for the web as for the printed page."</p></blockquote>
      <p>The fundamentals yes, but I wouldn't go so far as to say that one should design a webpage experience to replicate that of a book (Of course, I'm also one who believe's Bringhurst's book as more of guidelines than actual rules). Anyway, food for thought.</p>
    html_clean: |-
