    html: |-
      <p>@inkwell Exactly, functional typography. I get that many feel Bringhurst's book is the pinnacle of all things, but functional typography on screen is actually different (in some ways) from functional typography in print. But there's room for differing opinions :)</p>
      <p>@Bill I'm not arguing that Gutenburg isn't important or that his work was eclipsed by the printers in the Far East, just that saying he "invented the first moveable type" is overly simplistic. As you said, the Korean and Chinese printers used water-based inks without a press, but it was still a technique capable of mass production. Disregarding their approach because Gutenburg's was superior is just as bad as saying Gutenburg's work wasn't that important!</p>
      <p>Additionally, as you said, folk were experimenting (in Europe) beforehand with all the different elements that Gutenburg brought together (except for the one). So yes, he did create something superior to all European methods, but part of inventing is also standardising, aka "this press" with "this ink" with "this paper" with "these metal types". Semantics, I know. </p>
      <p>Finally, yes Gutenburg's work was used in the Far East, but really only once the missionaries brought it over and said, "this is what we use". Ultimately it was superior to the existing systems, thus leading to the strength of the missionary presses in Japan and Korea, but that doesn't take away from the fact that the native process was still pretty dang impressive and was invented as early (I think) as 600AD for wood block and 1200AD for metal (according to some sources. Oldest extant metal type is 14th century). </p>
      <p>In any case, this is a very roundabout way to say, yes, Gutenburg was important and his printing process changed the world, but that he didn't invent metal moveable type printing (since the first inventors of that were in Korea) as invent a <em>particular process</em> for metal moveable type printing, which then went on to change the world. For a MA, one should acknowledge that fact and not gloss over it.</p>
