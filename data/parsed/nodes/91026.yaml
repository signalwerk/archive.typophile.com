      <p>Guttenberg did far more than standardize the process. He *invented* a process that was superior to anything before. Each element of the process, except for his invention of the the adjustable type mold, existed before. But he put them together: the wine press, oil-based ink, punch cutting and casting. He invented mass production printing, and changed the world. And they used his methods of the press and oil based ink in the far east as well, which shows its superiority. </p>
      <p>I believe the Koreans and Chinese used water-based inks, without a press. </p>
      <p>I'm no expert on this, but I believe those who are have no doubt of Guttenberg's importance.</p>
