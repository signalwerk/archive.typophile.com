    <p>Hi all. I'm a noob on this site - I posted on the typography section on Reddit and one of the commenters suggested I would get more useful feedback here.</p>
    <p>I'm writing a Masters thesis on web typography and am creating a website as part of the project.<br>
    It's a work in progress, some sections need to be expanded, others edited down. I would appreciate any comments, criticisms or advice you might have.</p>
    <p><a class="freelinking external" href="http://www.inkwell.ie/typography" rel="nofollow">http://www.inkwell.ie/typography</a></p>
    <p>Thanks in advance.</p>
    <p>[edit] I've corrected most, if not all of apocryphal apostrophes.</p>
    <p>[edit 2] I should probably point out that this is a component of a taught Masters rather than a Research Masters. The website and paper only comprise 25% of the overall MA.<br>
    I've  altered the opening paragraph to credit the Chinese and Koreans respectively. Thanks for all the comments so far.</p>
