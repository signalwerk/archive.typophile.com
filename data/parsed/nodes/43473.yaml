    html: <p>What about the letter width and dimensions. Is there a method for determining the proper width of the new 'E' based on the dimensions of the *F* and *L*.</p>
  - id: 267820
    user_id: 5094
    user_name: charles ellertson
    user_path: null
    user_image: null
    date_raw: 22 Mar 2008 — 10:24am
    date: 2008-03-22T10:24:00
    votes: null
    html: <p>Well, it would depend on the font, wouldn't it. In general, a capital E is a touch wider than an F (about 1.045 times wider in Helvetica, for example), and almost always the right sidebearing is greater. Often the left sidebearing is the same. But at some point, you'll have to dial it in for your font.</p>
