    html: <p>What about the letter width and dimensions. Is there a method for determining the proper width of the new 'E' based on the dimensions of the *F* and *L*.</p>
    html_clean: <p>What about the letter width and dimensions. Is there a method for determining the proper width of the new 'E' based on the dimensions of the *F* and *L*.</p>
  - id: 267820
