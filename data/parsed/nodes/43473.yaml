  html: |-
    <p>I have a sans face I am customizing for a logo that needs a new letter 'E' in uppercase. The existing 'E' is represented lowercase even in the upper set. Having the dimensions of the other uppercase letters is there is a method to creating this new letter from the existing bunch.</p>
    <p>Thanks</p>
