  html: <p>Now that InDesign 2 and Photoshop 7 support OpenType, does anybody around here have a clue when we can expect OpenType support in Illustrator? Couldn't find anything on their website. <br> <br>I'm considering upgrading my license for Mrs Eaves to the OpenType version and purchasing a license to Neutraface. As I'm doing almost all my single page work in Illustrator, this is important information to me.</p>
