    html: "<p>&gt; [From what John Hudson has told me, InDesign ME (Middle East) is even better than the international Adobe version. It's been developed by a third-party software firm for offering support for indic scripts and it's probably the state of the art of layout programs today. I wonder if as an InDesign registered user I could get an upgrade. I'm on a Mac, anyway. I don't know if InDesign ME exists for both platforms... FreeHand will always be in my heart, anyway. I recalled when I started using FreeHand 2.0.2 in awe. At the time, PageMaker 3.0 didn't allowed color separations, rotations, and it allowed only point size increments of 1: 11 pts or 12 pts, etc... Anyway, just as a reminder: FreeHand offered color separations from within the program since 1988/89 while for Illustrator people had to wait until release 5 or 6 if I recall correctly. And version 6 still didn't allowed the import of tiff files. Illustrator is good for Illustrations. FreeHand might go away, but it's been a landmark for designers and typographers as well...]</p>"
