    html: <p>Since we're on the matter. <br>In the US Illustrator is big, but in Europe FreeHand is big, too. <br>As far as you know, are there any serious indication on Macromedia discontinuing FreeHand? <br>I've always used both programs (I started with FreeHand 2 and Illustrator 88), and although they may seem similar, you can't even imagine to do with Illustrator what you do with FreeHand, and vice-versa. <br> <br>Besides, many Illustrator 10 features stinks and there are many bugs, while FreeHand (well, FreeHand 10 stinks as well) has now a "copy special" feature very useful for type designers. <br>I used Illustrator to copy directly my outlines in FontStudio, but now you can do it directly from FreeHand 10, which supports a copy format like the one of Illustrator 8 and 9. <br> <br>Typographically FreeHand is so superior to Illustrator that I would die if they decide to discontinue it. I need to hurry to upgrade my home copy to version 10.</p>
