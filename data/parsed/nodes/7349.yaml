    html: <p>&gt; [Ciao Jon, welcome! This is very stupid of Macromedia. Before InDesign, and even after it, FreeHand was the only program handling complex graphic design and excellent typographic layout capabilities at the same time. No Opentype support is a really stupid move. But I'm just glad they haven't discontinued it for now. Before InDesign there was no program allowing you to force punctuation out of justified text, for better alignment, or to adjust so finely tracking and other type issues. I have been a PageMaker user since version 3 (back in 1988) and I welcomed InDesign as a fantastic step forward. But if you do things like packaging, where the complex handling of graphics is often paired with the need of great typographic control, FreeHand is invaluable.]</p>
