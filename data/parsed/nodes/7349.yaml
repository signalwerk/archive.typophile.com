    html: <p>Illustrator first needs to be updated to handle Unicode text input and processing, once that is in place (or at the same time) Adobe will doubtless start adding OpenType Layout support. Rewriting core text handling for an application is a major job, which can easily take more than one typical rev cycle. I know Adobe won't make any public statements about this, but my guess is that they are actively working on updating the text engine for Illustrator. I'm hoping that we'll see the results in the next release.</p>
