    date_raw: 11 Feb 2003 — 4:16pm
    votes: null
    html: <p>At the risk of souding like a salesman, they way we are handling the issue with illustrator is that we bundle the "Neutraface Standard" fonts with the "Neutraface Expert" collection. So if you wanted to specify, for example, small cap tabular figures in NeutraText Bold in Illustrator, you'd have to use the "Standard" fonts (which, incidently, also ship in .otf format only). If you wanted to do the same in InDesign, it's as simple as invoking a few features with the NeutraText Expert counterpart. Both collections (Standard and Expert) will coexist peacefully in the type menu. Drawback is that you have a boatload of fonts added to your menu...the full Neutraface Standard collection is 85 fonts (OpenType programming in the Expert collection trims it down to 29). <br> <br>At this point, we are telling people who have no intention of using InDesign that they should not bother spending the extra 50 bones for the Expert collection at this point. We also tell them that we'll "upgrade" them to the Expert collection for the $50 difference if they change their mind down the road. <br> <br>Not having OT support in AI is a bummer, but I'm sure Adobe will have it in subsequent versions, especially since all of their new collections since 1999 ship in OpenType only format.</p>
