      <p>Are you sure? I'm confused. The Swiss Ricoh website lists "PostScript® 3 emulation" in the <a href="http://www.ricoh.ch/products/printers/smalloffice/sp3300dn.xhtml" rel="nofollow">specs</a> of the printer James mentioned – whatever that means … the whole PS business seems quite convoluted. </p>
      <p>FWIW, I use a HP printer currently, and Dan Reynolds told me over on the German Forum not to use any hinting during the design process because the HP emulation tends to misinterpret hints &amp; ends up ignoring overshoots. :-|<br>
