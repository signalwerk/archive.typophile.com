    html: <p>I really love my Ricoh Aficio SP 3300. It was cheap, has real Postscript 3 support, does great 1200 DPI prints and Ricoh sells a wonderful velvety black toner that produces more consistent prints than the uneven greyish mess I get from HP or even Xante.</p>
