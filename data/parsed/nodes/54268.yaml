    date: 2009-02-02T05:07:00
    date_raw: 2 Feb 2009 — 5:07am
    votes: null
    html: <p>I have an HP Laserjet P2015 as well for proofing type designs. Works great, really fast. Slow with bitmap images though, especially in 1200 dpi mode. The duplex model has more RAM (faster) and comes rather cheaply, but with a smaller toner cart, so the first cart (comes in the box) runs out fast (it's smaller than the normal ones), but then you can replace with to the regular size cart.</p>
