    html: "<p>I also think that this may be a custom typeface, created by the Designers Republic, for Gatecrasher.. <br> <br>And, according to the <a href=\"https://web.archive.org/web/20141112141020/http://www.typophile.com/cgibin/search.pl\" target=\"_blank\">Typophile archives</a> ( and Google, of course ) it actually is.: <br><a href=\"https://web.archive.org/web/20141112141020/http://www.typophile.com/forums/messages/83/28573.html?51769\" target=\"_blank\">www.typophile.com/forums/messages/83/28573.html?51769</a> <br> <br><i>But, I still think that there are a few 'look-a-likes' out there..</i> <br> <br>Maybe everything started with a classic, '<a href=\"https://web.archive.org/web/20141112141020/http://www.myfonts.com/fonts/ef/digital-sans/\" target=\"_blank\">Digital Sans</a>'.. <br><i>( Designed in 1974, according to myFonts.. )</i></p>"
