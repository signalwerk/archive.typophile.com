  html: "<p>I would assume that the Gatecrasher typeface used in the past several years throughout their image is a custom typeface (tDR?)... <br> <br><img src=\"https://web.archive.org/web/20141112141020im_/http://www.typophile.com/forums/messages/83/48426.gif\" alt=\"gatecrasher_typeface\"> <br><a href=\"https://web.archive.org/web/20141112141020/http://www.neverstandstill.com/crasher\" target=\"_blank\">http://www.neverstandstill.com/crasher</a> <br> <br>I am wondering if anyone would know about it or about typefaces that come close to it...?!? <br> <br>I came across one of Mr. Fewell's creations, Exhaust: <br><a href=\"https://web.archive.org/web/20141112141020/http://www.unionfonts.com/2004/exhaust.html\" target=\"_blank\">http://www.unionfonts.com/2004/exhaust.html</a> <br>Are there others?!</p>"
  html_clean: "<p>I would assume that the Gatecrasher typeface used in the past several years throughout their image is a custom typeface (tDR?)... <br> <br><img src=\"https://web.archive.org/web/20141112141020im_/http://www.typophile.com/forums/messages/83/48426.gif\" alt=\"gatecrasher_typeface\"> <br><a href=\"https://web.archive.org/web/20141112141020/http://www.neverstandstill.com/crasher\" target=\"_blank\" class=\"link-external\">http://www.neverstandstill.com/crasher</a> <br> <br>I am wondering if anyone would know about it or about typefaces that come close to it...?!? <br> <br>I came across one of Mr. Fewell's creations, Exhaust: <br><a href=\"https://web.archive.org/web/20141112141020/http://www.unionfonts.com/2004/exhaust.html\" target=\"_blank\" class=\"link-external\">http://www.unionfonts.com/2004/exhaust.html</a> <br>Are there others?!</p>"
