    <p>Hey all,</p>
    <p>Can anyone tell me whether there's an appreciable distinction between braces and curly brackets? I always thought they were the same, but I've got a colleague who <strong>insists</strong> that they're different and that we're using curly brackets.</p>
    <p>Thanks,<br>
    R</p>
