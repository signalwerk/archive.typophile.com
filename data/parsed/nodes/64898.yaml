      <p>I use "square brackets" and "curly braces", to reduce potential confusion.</p>
      <p>In terms of usage in running text, I use the former to indicate something that can be included in the text or not; and the latter to mention something "meta" that's relevant beyond the textual content. And parentheses I use to mean something that is an aside to the main text (sort of a more casual or immediate version of asterisked or footnoted content).</p>
      <p>hhp</p>
