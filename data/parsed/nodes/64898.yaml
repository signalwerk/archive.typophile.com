    html: |-
      <p>Page 303 of Bringhurst's Elements of Typographic Style calls {these} braces.</p>
      <p><em>"Braces are rarely required in text work, but they can function perfectly well as an extra and outer (or inner) set of parenthesis:</em> { ( [ - ] ) }.<em> In mathematics they are used to mark phrases and sets. In editing classical papyri, braces are often used to mark editorial deletings."</em></p>
