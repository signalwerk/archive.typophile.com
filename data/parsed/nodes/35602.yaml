      <p>Daniel, your points are rational and logical, <em>but</em> re limiting the spread of gossip, I don’t think it can be done. What did Churchill say about a slander travelling the world in five seconds, or something vaguely like that?  And what’s the use of censoring her name when anyone who wants can get it by clicking on Uli’s link? </p>
      <p>So: what’s the point of censoring something in a thread, and not censoring a link to the censored material in the same thread? Where do you stop? In my admittedly limited experience here and in photo science blogs, moderators who censor will stop short of censoring links known to be to the material they just censored. How daft is that? </p>
      <p>Yet I do wonder one thing, the perpetually unanswered question in this thread: has R-word (name available by clicking on Uli’s link) been informed of her tarring and feathering? Are we ever going to hear her side of the story, or a defense by some supporter of hers? How can we deepen the original discussion until we hear from her? </p>
      <p>&gt;You said you’d probably regret posting it... why not just avoid doing so in the first place if you realized that when writing it, given your aversion to editing?&lt;</p>
      <p>Because I think that would be a boring way to exist. As Lynn Fontanne said when MGM asked the Lunts to make a second film, ’Mr Mayer, we can be bought, but we cannot be bored’ — </p>
      <p>There’s a kind of thrill in it. As a French friend wrote to me, in a phrase almost worthy of Balzac, “I always knew you liked gossip and limelight, but I really had no idea you were this suicidal.”</p>
      <p>Besides, in the history of litigation it is one of the craziest incidents: you have two organizations, Emigre and ATypI, at one another’s throats, over the behaviour of a perpetrator who, both agree, cannot be let know that the conflict exists. In effect, Hrant was sued, and a settlement was made, without him ever knowing about it. How delightful!</p>
