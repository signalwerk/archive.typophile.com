      <p>Bill: you seem to be viewing the whole censorship issue from one side, in a “it’s your responsibility you posted it. take the responsibility and don’t censor yourself.” I agree with it in principle, but I think sitting on a high horse and chanting “no censorship” while someone is getting pilloried for your actions isn’t much better than the so-called censorship itself. </p>
      <p>What if you’d unintentionally deeply embarrassed someone? or given away something that could threaten someone’s life? or their career? You may argue that once one person’s seen it, it’s out, but that’s like not quarantining an infectious illness just because “someone else has probably already caught it.” There is a real benefit to limiting something’s spread, if it has the potential to harm. Damaging information tends to be one of those things, and that’s why people wanted to limit its spread. Sure, I saw the name and you did, and so did dozens of others, certainly, but seeing how big this thread has now become, the newcomers will not. Those searching for “typography teachers advice” (eventually) on google will not, and so on. People who are really curious might find it on some cache, if it managed to be picked up quickly enough, but it will have succeeded in limiting the spread. Sure, if someone goes and writes about it on their own blog or opens a wiki page on it, there’s no stopping them, but then that might be seen as libel, given the difficulty of verifying the original claims.</p>
      <p>So yeah, I can see you’re angry, and can understand it, especially if a mod censored you and you feel strongly about censorship, but going all hot-headed and pissing more people off while also releasing more potentially damaging information isn’t hurting anyone. You said you’d probably regret posting it... why not just avoid doing so in the first place if you realized that when writing it, given your aversion to editing?</p>
      <p>Daniel</p>
