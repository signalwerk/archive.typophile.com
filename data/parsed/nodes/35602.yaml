      <p>Pro-piracy attitudes from design teachers are pretty common in my experience, albeit not this blatantly. </p>
      <p>As for the penalties, well, a good IP litigator will run you at least $300 an hour, if he likes you. One who can deal with the law surrounding fonts is probably even more. And the bad press that comes from suing (perceived) customers can be really nasty, so going after individual fonts pirates is sort of a lost cause.</p>
