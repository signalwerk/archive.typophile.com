      <p>Taking Paul’s point: that’s absolutely true. There’s no chance of coherence if anyone can edit at will. I look at it from a different perspective. I’ve been on type listserves and newsgroups since the early 90s, when they were just coming out. There was no way to edit once you had said something. You had to take responsibility for saying whatever you said. Is there something wrong with that?</p>
      <p>One difference with a listserve is that it _can_ be private, theoretically — if the list isn’t made public. This is what happened, for example, to the ATypI list, a few years ago. Hrant Papazian said some things about John Downer that his publisher Zuzana Licko didn’t like. She contacted Cynthia Hollandsworth and threatened to sue if the offensive posts were not removed. Instead, ATypI chose to take the list private.</p>
      <p>At that time, both parties to the dispute decided _not_ to tell Hrant that it was his actions that led to the ATypI list being closed, on the sensible grounds that if he found out, he’d make a very great deal of noise about it. I’m being a little naughty, revealing it here for the first time .... so I might as well add the quaint detail that amused me the most, which was that Cynthia had no idea who Licko was or of the high esteem in which she then was held by some. She referred to her as ’some woman’.</p>
      <p>I know I’m going to regret posting this. It’s bound to make me new and influential enemies .... yet somehow, in spite of my dreadful history of 15 years of dreadful public indiscretions in type, the people who really matter still talk to me, perhaps because they know I love their work, and sometimes come close to understanding it.</p>
      <p>When I was first on the Type Design List and to a very limited extent Typo-L, they were not available to non-subscribers on the net but I think they now are. Very embarrassing in some cases.</p>
      <p>The lists have largely been taken over by blogs such as typophile and typographica. I don’t think posts should be editable. You want to make a public pronouncement? Then take the responsibility for doing so.</p>
      <p>Taking it a level further, what about the case of the internet AA group where someone confessed to a murder? I know the girl who outed him to the police. Want to bet he wished he hadn’t posted? Yet that is a case where there was a far greater presumption of privacy ....</p>
