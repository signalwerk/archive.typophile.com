      <p>I swore I’d ignore this thread from now on, but I have to interject.</p>
      <p>For those of us who frequent the Type ID forum, it’s a time honored tradition to leap in there with your ID as fast as you can, then go back in and add the link, as a courtesy to the original poster. I would hardly call this censorship. Before the upgrade the time stamp held even if you edited your post to add the link. It was an honor system, if your ID was wrong you didn’t go back in and change it after someone had correctly ID’d the sample later on. Now, with the edited posts jumping down it requires us to add a new post with the link. Whatever. I preferred the old system. I sometimes used to go back into my post to clarify something I thought was fuzzy, or to reword something. Now I don’t because it screws up the order of the thread - unless my post is still the last one.</p>
      <p>Now I am ignoring this thread and the pedantry contained herein.</p>
      <p>(and for the record my family came thru Ellis Island, not the Mayflower)</p>
