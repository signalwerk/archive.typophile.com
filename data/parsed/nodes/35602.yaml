      <p>As an educator, this just ticks me off (the teacher, not the student). My suggestion would be for Mark to publish online all the course outlines, lecture notes, tutorials, and any other work that the teacher had put together over the course, and then tell her that since she is in favor of sharing other peoples work without compensation, you felt it was fair to share her work.</p>
      <p>Many teachers I know feel no pang of guilt at using the work of others, but are adament that they will not share their work without compensation. I am constantly trying to convince teachers that the Internet is not a buffet placed for them to pick and choose illustrations for their lectures without asking permission.</p>
      <p>(And of course, after the point has been made to the teacher, Mark should then remove the materials, since two wrongs have never equalled a right ... although three lefts do.)</p>
