      <p>If people here are clamoring for the operators to fiddle with the editing system some more, then I must ask them not to. When a concept is important to a thread, no self-edit can delete the ripples in other posts, so there is nothing of essential value lost. Typos, run on sentences and a million other annoying trademarks of internet message boards are often (on Typophile) preened, cleaned and culled by the posters, leaving a more readable mass-memoir. Additionally, it is a useful tool when a project name changes, or a new sub-version is posted to the build boards (eg: Agamemnon #x).</p>
      <p>I felt the temptation to go see the “teacher”’s site. The reason I didn’t was out of respect to the original poster, who seems to genuinely regret including that detail. Editing himself and explaining it shows effort to fix a mistake that should be accepted.</p>
      <p>To those who don’t want anyone else to edit their own posts; the moderators and funders of Typophile have done a great job of creating a diverse center by communicating instead of dictating, so go and not-edit your own posts.</p>
