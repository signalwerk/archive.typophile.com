      <p>I too have a problem with site such as ratemyprofessor for you can’t tell if a poster is being truthful or not, and realizing that I was doing something much like that I decided to remove her site. I am certainly telling the truth, but I have know way of proving it and perhaps she herself was exaggerating when she made the comments, though having gotten to know her a bit, I don’t think she was. As for a witch-hunt, I am very bitter. I work very hard for three years to become certified and the culmination of all my hard work was this class, where she was able to go though all of my past projects and put her grubby little prints all over them. She still gave me a good grade, though, and I will be able to fix the things she has changed. I was going to chalk it up to experience when I read another person on another board complaining about his type work being used without compensation. This reminded me of her advice and how mad it made me, for she wasn’t simply stating what her practices are but encouraging the students to do the same. I don’t care if she destroys her career but her advice could destroy the career’s of her students.</p>
      <p>Am I Bitter, Yes.<br>
      Do I really want to be the one to crucify her, not really.<br>
      Would I shed a tear if she lost her professorship, not at all.</p>
