    <p>I am a recent grad and in my final class I had a teacher who I and many of the students butted heads. I don’t believe her to be a great designer and she consistently tried to force the students to produce work to her own taste as oppose to developing their own voice. This is all beside the point, I am posting here for she gave me and the students advice that I would think to be career ending. She said to find type faces by any means necessary and use them in our work, I think this is fine as long as it is just for student purposes and the work never goes to print. How ever she also stated that in all the years of her own career she has payed for only two or three fonts herself. When asked about the legal ramifications of this practice she simply stated “who is going to check.” I know this is absolutely wrong and would never do this myself not only because it is immoral but what would happen if someone did find out. What are the penalties for doing such a thing and how do people like her get away with it for so long?<br>
    -Thanks</p>
    <div class="forum-topic-navigation clear-block"><a href="/node/35411" class="topic-previous" title="Go to previous forum topic">‹ font management?</a> <a href="/node/27362" class="topic-next" title="Go to next forum topic">License plate typography ›</a></div>
