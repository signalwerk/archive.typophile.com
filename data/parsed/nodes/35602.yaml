      <p>If push comes to shove, just report her to your school’s technology services. Those guys, in my experience, are just itching to bust people for piracy in any form on any school owned computers.</p>
      <p>In fact, they tend to go way overboard, and force people to use only the fonts originally supplied by the system admin, which in a way could be a good thing. </p>
      <p>Having a teacher emphasize the use of many typefaces indicates to me that she is covering up a general typographic weakness. A good designer/typographer should be able to “make do” with only a handful of fonts.</p>
