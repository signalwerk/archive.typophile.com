      <p>Digital liscensing is a mess. I sympathize with the creators, being one myself - however i think that fonts are ludicrisly expensive, as is most graphics software.   The supply and demand market model doesn’t work when the supply (of digital liscences) is infinite and the overhead is virtually nil.</p>
      <p>Furthermore, I’ll never ever understand how anyone can say making an illicit copy of, say “gill sans” is stealing when Eric Gill died more than 60 years ago.  i don’t think the repackaging of gill sans into a computer font is worth $156/liscence. Maybe $5.  In fact i’d say selling it for $156, and claiming you have the fair “market-value” right to do so is more of a theft than making an illegal copy! </p>
      <p>Until copyrights have sensible limits - I’d say somewhere in the 5 to 15 year range, i’d definetly consider “stealing” a typeface by a dead designer. Fortunately, my work is such that i’ve never needed to use a typeface i didn’t already own legitimately.  </p>
      <p>As a creator, i’d gladly reliquish copyright after a sensible time.  in fact, even at this point i doubt i’d ever claim copyright to something i did 10 years ago as a matter of principle (unless maybe my work was used to advertise something i found repugnant.)</p>
