      <p>Mark Typo,</p>
      <p>All of the name her/don’t name her stuff aside, the fact that her students marked her as a hack and a thief is a good indication that she’s reaping the rewards of her attitude already. There is very little penalty enacted for this behavior. Penalties do exist, but I have never been ticketed for jaywalking, in spite of the penalties for that, and it’s much the same with typeface piracy. It’s too hard for the people who have a stake in type to go hunting down the ’pedigree’ of every design piece out there, if not impossible. I’ve only ever heard of large companies being taken to task for being stupid (UPS with the Dax rip-off).</p>
      <p>I’m sure that Linotype or whoever could start auditing people, but that’s also a bit of PR nightmare, because there are few designers/firms without a few licensing skeletons in their closets, either by mistake or by design. Additionally, it can be due to the attitudes of higher-ups that lead to this sort of behavior: who’s going to risk their neck at work by threatening their boss with exposure to legal action? That would be suicide, frankly. And then there’s the flip side: the designers bring in their fonts and slip them into projects without proper licensing. When it’s 2 AM and the deadline’s tomorrow, who will scrutinize that stuff?</p>
      <p>That being said, it’s not impossible. Sometimes simply taking responsibility for the often tiring and pedantic job of managing font licenses is enough to encourage compliance. I’ve seen instances where it is simply left undone becaues it can be a bit onerous. I’ve found success in taking this stance, as well as simply making it known that I don’t tolerate it.</p>
      <p>Just an FYI, <a href="http://www.linotype.com/1710/licenseagreement.html?PHPSESSID=3ecba013275ca7f2f8cc4e0b24caeb8e">here’s Linotype’s offical word on penalties</a> from their License Agreement:</p>
      <p>———-<br>
      Article 4<br>
      Termination of License Agreement</p>
      <p>4.1 The license and usage right guaranteed under subsection 1.2 shall become immediately null and void in the event of a breach of this contract.</p>
      <p>4.2 If the licensee or one of the licensee’s employees breaches the agreed-upon license and right of use and/or property rights of Linotype GmbH, Linotype GmbH has the right to terminate the license and right of use, with termination taking immediate effect. Linotype GmbH reserves the explicit right to assert any further claims (specifically information, compensation for damages, etc.).</p>
      <p>4.3 In the event of termination, the licensee is obligated to delete and return to Linotype GmbH the original Font Software affected by and pertaining to the termination, including documentation and all copies.<br>
      At the request of Linotype GmbH, the licensee is obligated to provide written assurance that said deletion has occurred.<br>
      ———</p>
      <p>I’m not sure how standard this is, but I’d bet most EULAs specify the right to pursue damages in court.</p>
