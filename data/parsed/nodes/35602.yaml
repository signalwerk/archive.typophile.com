      <p>&gt;Furthermore, I’ll never ever understand how anyone can say making an illicit copy of, say “gill sans” is stealing when Eric Gill died more than 60 years ago. i don’t think the repackaging of gill sans into a computer font is worth $156/liscence. Maybe $5. In fact i’d say selling it for $156, and claiming you have the fair “market-value” right to do so is more of a theft than making an illegal copy!&lt;</p>
      <p>I could not disagree with this more. I first proposed reviving the Gill font Pilgrim to Linotype around 1995 and started desultory work on it around then. Then I got involved in other things ... Finally, Lino released a pre-existing and (in my opinion) very poor Linotron version, and agreed to do my version as ’Pilgrim Next’. We had the first critique last year, and ... work proceeds very slowly. Obviously, I have not been putting that many hours into it over these past 12 years, but I have been thinking about it and its problems for all this time, learning more about type all the time, learning more about the font all the time, and hey, I would be very annoyed if lots of people used it without paying and nobody actually bought a license — if, when, I ever finish it. </p>
      <p>Anybody who seriously thinks about the problems of reviving a design for any format must surely acknowledge that each revival for some new format, if it is seriously-intentioned, takes an enormous amount of time, perhaps more than the original design itself, even.</p>
      <p>If you looked at material set in metal Gill and wanted to reproduce it exactly with the digital versions available today, you wouldn’t be able to. There’s plenty more work that could be done on Gill Sans. Why would that work be worthless just because the original design came out eighty (not sixty) years ago? </p>
      <p>Anybody got a really great idea for the dagger in Pilgrim? The reason I’ve been posting today is that I’m trying to avoid working on this problem! God, is that a pathetic thing to admit in public or what?</p>
