      <p>I think Old Nick misunderstood the question.</p>
      <p>Brown Fox is saying he wants to include symbols in his font for country codes, as single glyphs. He's wondering if there's a standard way of doing this.</p>
      <p>The answer is: there are standard codepoints for these characters, yes. <a href="http://en.wikipedia.org/wiki/Regional_Indicator_Symbol" title="http://en.wikipedia.org/wiki/Regional_Indicator_Symbol">http://en.wikipedia.org/wiki/Regional_Indicator_Symbol</a><br>
      They are encoded at U+1F1E6 to U+1F1FF.<br>
      The original proposal is here: <a href="http://std.dkuug.dk/jtc1/sc2/wg2/docs/n3727.pdf" title="http://std.dkuug.dk/jtc1/sc2/wg2/docs/n3727.pdf">http://std.dkuug.dk/jtc1/sc2/wg2/docs/n3727.pdf</a></p>
      <p>Thus there are standardized glyph names for those characters, of the form "u1F1E6" etcetera.</p>
      <p>The type designer can use OpenType ligation to do what she wants with the combining sequences. Does "FR" turn into a single circled FR glyph? Up to the designer.</p>
