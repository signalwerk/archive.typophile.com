    html: <p>Back in school I attended a presentation by... Hoefler, I think, but I may not be remembering correctly. Anyway, he was leading us through the design of a typeface, and apparently the creation of swash characters had become a bit much, and he had to indulge in a little self-parody. Imagine an octothorpe, a slash, a period... all with a big ol' Bookman swash extending from the upper left, or as close to an upper left as could be had.</p>
