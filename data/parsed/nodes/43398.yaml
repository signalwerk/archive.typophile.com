    <p>As I was standing in the checkout line at a Tokyo supermarket my eye met this Arabic numeral "1".  For a while I was struck dumb - what tha! is that a serif - with serifs? It was disorienting - a typographical zen koan- what am I seeing?  Then I thought of the poor lettering designer unused to Latin letters and interpreting the 1's upper stroke (can it be called a serif?) in his or her own way. I almost burst out laughing. I later came and took a photo of the sign. The green variation is my photoshopped vision of what a serif with serifs with serifs ...might look like. Keep adding serifs like this and you get a fractal...<br>
    Have you seen anything else that is funny? I do not mean ugly or badly-designed glyphs or letters, but something that would make a typographer laugh.</p><div class="imageWrap"><img src="http://typophile.com/files/serif-of-serifs_6731.jpg"></div><p></p>
