      <p><em>does Copperplate have lowercase? </em></p>
      <p>No, but a typeface from the 1970s called <a href="http://www.houseoftype.com/prod_display.asp?group_id=AmerGothURW" rel="nofollow">American Gothic</a>, which was based on Copperplate, does. It was designed by Vladimir Andrich for Alphatype. (He also did a lot of the Filmotype fonts back in the 1950s and the exquisite <a href="http://www.typophile.com/node/17017" rel="nofollow">Andrich Minerva</a> for VGC.)</p>
