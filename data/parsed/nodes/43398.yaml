      <p>Alessandro - thanks for the haha-meter (am I the only one who finds the Typophile link color too subtle to distinguish from the rest?<br>
      cerulean - yes swashbuckling periods and slashes are what I had in mind uner the category of funny type.<br>
      ChrisL - the eye can get used to anything - even that eyeglass lowercase g- I wonder what is its ancestry?<br>
      John - does Copperplate have lowercase?<br>
      russellm - nothing new under the sun I guess! <em>Well the idea was infinite iterations of serifs, but it gets crowded really</em> - also its tiring to make manually. As to getting crowded that would not happen if each iteration gets smaller- it will be much like a mathematical fractal where the original has a given outline, and succeeding iterations become smaller and more complex - one has to zoom to see them. Fascinating stuff really- I just tried the freeware program ChaosPro to produce fractals but there may be less difficult programs that demonstrate the results only as animations.</p>
