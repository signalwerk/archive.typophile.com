      <p>I have no memory of reading about that, but for some reason I always thought Copperplate Gothic was designed to be used mostly on small sizes, especially business cards, and those "serifs" all over the letter are a compensation means for the ink (negative inktraps). Am I daydreaming or maybe there is some evidence of this? :=(</p>
      <p>A thing goes for sure, at least for me: Copperplate used for storage signs and in large applications is awfully bad…</p>
