      <p>This is kind of like one of those fishing stories where the fish gets bigger with every telling, because I can't find it now, but... I did a sketch a few months ago of letters with endlessly iterating serifs... Well the idea was infinite iterations of serifs, but it gets crowded really fast so it only got to about 4 or 5 levels. And it was the Goudy Copperplate 1 that gave me the idea. It's odd. It looks like a part of a kitchen sink drain, but I like it.</p>
      <p>-=®=-</p>
