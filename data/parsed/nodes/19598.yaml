      <p>My OCD-like symptoms manifest themselves in strange ways. I have to wash my hands every 30 minutes or less, for example. I can leave things absolutely messy all of the time, but the moment I arrange something it has to be perfect. I create "margins" around objects when tidying up my desk. Recently my boss asked me to tidy up a bit, and I replied "I forgive you, for you know not what you do." </p>
      <p>There's now a near-perfect 1/4" margin surrounding everything from my phone to the stapler.</p>
      <p>...I will be folding everything in my closet when I get home. </p>
      <p>Failure is the condiment that flavours success - Truman Capote</p>
