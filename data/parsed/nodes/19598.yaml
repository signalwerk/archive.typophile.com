      <p>I've got OCD in my family, but I just have some of the chemical vestiges of it; my problems are different, for the most part. Still, I do find myself-- like someone mentioned above-- careening between unholy tornadic messiness and extreme neatness. When I do swing in the neatness direction, I always have a method, and I'm ferocious about it. Not one speck of dust, not one unwiped spot. Even as a child, I cleaned my room in "rows," kind of like a vacuum cleaner or lawnmower.  I still do it-- something about moving along the surface from 0,0 to x,y that just "satisfies"! One of my earliest memories is of picking up bits of lint and placing them neatly in a pill bottle that my dad used for electrical components like resistors and capacitors. Still, I am patient only in bursts (impatiently patient?). I can spend three hours sorting screws on my workbench, but it'll take a few months before I'm ready to do that again (most recently, I spent 90 minutes removing every one of a couple hundred nails from a pile of mostly rotten roof planks). As for clothing, I have folding methods, but I think a lot of people do. What I find curious, though, is that I fold things differently than I used to. Like, my mother taught me how to make a "ball" out of a pair of socks by rolling them up and wrapping the open end back 'round the ball thus formed. Now I just put them together and wrap the end down about an inch or so, just enough to keep them bound together. When and why did that change, I wonder? The only indication that any of this is OCD is that I had to forbid my wife from folding my t-shirts, because her method just got under my skin and I had to re-fold them all. I don't know if she's forgiven me yet ("Fold your own damn t-shirts!" Ok, yes, gladly, thanks dear!)</p>
      <p>Okay, I guess I'm sounding a lot more OCD than I thought. Come to think of it, I usually post, edit, and re-post everything I write here about three or four times. </p>
      <p>Yikes!</p>
