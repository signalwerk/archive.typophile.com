    <p>I have a slight case of OCD. Although, I'd be willing to bet that most graphic designers do. It is part of the job to have an insane obsession with details. Anyway, as I struggle with obsessing over the details, sometimes it spills over into not wanting wrinkles on my bed or color coding my closet ... and even folding my t-shirts. I received this in my e-mail today and suddenly felt a wave of normality wash over me when I realized that at least I didn't fold my t-shirts <em>this</em> perfectly.</p>
    <p>Enjoy!</p>
    <p><a href="http://www.typegirl.com/temp/HowtoFoldaShirt.MPG/" title="http://www.typegirl.com/temp/HowtoFoldaShirt.MPG/">http://www.typegirl.com/temp/HowtoFoldaShirt.MPG/</a></p>
