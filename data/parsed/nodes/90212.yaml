  html: <p>Hello dear typophiles. I'm working on a project for which I will have to design a bus schedule and I'm wondering whether there are fonts specifically designed for this kind of jobs or a well designed Myriad or Frutiger like fonts will work just fine. Thanks for your help and suggestions.</p>
