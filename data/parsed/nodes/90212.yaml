    html: |-
      <p>Good advice.<br>
      Also, look for non-grotesque styles, because 3, 6, 8 and 9 in that genre are too similar.<br>
      And, make sure that descenders are short (which is often the case in fonts with large x-heights), this will enable you to minimize leading.<br>
      IMO, the lining “one” glyph in tabular fonts should always have a foot crossbar.</p>
      <p>Arguably the most legible of such styles is Bell Centennial, so you could use that as a benchmark and see how far away from its hyper readability you are prepared to depart in the name of style.</p>
      <p>My best agate-for-tables type: <a href="http://www.myfonts.com/fonts/shinn/sense/" rel="nofollow">Sense</a>.</p>
