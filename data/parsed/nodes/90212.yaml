    html: |-
      <p>It depends on how small it will be printed, there are font (or font cuts) specifically designed for listings and long columns of tiny figures (sometimes called Agates). They’re usually used in newspapers. H&amp;FJ, Commercial Type, and Font Bureau, among others, have them.<br>
      One feature you could find useful would be tabular figures with the same metrics in any style or weight (so that, for example, an italic or bold number will still vertically align with the regular one placed above or below).</p>
