      <p>Karsten has neatly summarized the issue, drawing on a presentation of mine on the subject. As he says, if you don’t have full Greek support you don’t need to cover multiple Unicodes with those glyphs anyway.</p>
      <p>At Adobe, we never double-map glyphs today. We did briefly in our very earliest release of OpenType fonts around 2000, but quickly changed that practice.</p>
      <p>Regards,</p>
      <p>T</p>
