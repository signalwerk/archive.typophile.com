      <p><em>Why would you want to use non-standard names like Increment, Ohm and micron?</em></p>
      <p>Glyph names aside, there are a number of reasons you might want to have separately mapped glyphs for the actual Greek letters and the Greek letters used as symbols for increment, ohm and micro:</p>
      <p>1. You want to be able to reverse map from a glyph name to a specific Unicode character (Adobe's reason).</p>
      <p>2. You want to vary the spacing of the symbol glyphs to better suit them to mathematical or scientific typesetting.</p>
      <p>3. You want to vary the form or scale of the symbol glyphs.</p>
      <p>Personally, unless I'm making fonts for Adobe, I only provide separate glyphs if I am varying the design and/or spacing of the symbol glyphs, otherwise I double-map them.</p>
      <p>Paul, for increment, ohm and micro, respectively, these are the Unicode values and glyph names you should use:</p>
      <p>U+2206 uni2206<br>
      U+2126 uni2126<br>
      U+00B5 uni00B5</p>
