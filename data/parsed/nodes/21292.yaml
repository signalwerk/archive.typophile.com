      <p>The <a href="http://blogs.adobe.com/typblography/typotechnica2007/Glyph%20names.pdf" target="_blank">Glyph Naming Standards</a> presentation is a bit more explicit, i.e. relative:</p>
      <p><cite>Why glyph names?</cite><br>
      <cite>— PDF creation</cite><br>
      <cite>— Due to legacy elements of certain workflows, </cite>sometimes<cite> only glyph names are left when PDF generated</cite><br>
      <cite>— Users want better quality underlying text in PDF for text searchand extraction</cite><br>
      <cite>— So, sometimes need to get Unicode from glyph names</cite></p>
      <p>“Due to legacy elements of certain workflows” seems to refer to generating PDFs via PS.<br>
      Another take: Very few glyphs in a font are actually double mapped. Those may not be used often in texts. And PDFs are not necessarily generated via PS. These are quite a few conditions to be met so that text extraction problems occur at all.</p>
      <p>Do the fonts of which you speak only cover the roman/western alphabet, or a full Greek alphabet too?<br>
      If roman/western-only fonts, it is not really important whether Greek/math glyphs are double mapped or not, as long as you give these glyphs a uniXXXX name which is derived from the <cite>math</cite> glyphs’ names (the ones provided by John Hudson). This because if someone uses these glyphs in such a font, most likely he wants to address math symbols, not Greek letters.</p>
