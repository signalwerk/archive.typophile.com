    html: <p>This might be a semi-offtopic in this thread, but I would like to point out that the Greek set in Unicode has much better candidates for double mapping than 3 glyph pairs discussed here. I mean the accented combinations with polytonic oxia which are canonically decomposed to the corresponding combinations with tonos and actually are exact duplicates of them. Note that in this particular case double mapping will not break PDF searching capability, but rather benefit the user by removing an unnecessary ambiguity.</p>
