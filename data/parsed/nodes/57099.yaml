  html: |-
    <p>hi all,</p>
    <p>I've been having this issue with inDesign lately. I am setting a<br>
    paragraph left-justified, ragged right. Hyphenation is turned off,<br>
    and snapping to a baseline grid is turned on.</p>
    <p>InDesign will send words to the next line which I am quite certain<br>
    will fit within the column measure. And there is no manual carriage<br>
    return.</p>
    <p>Does anyone have any suggestions to address this?</p>
    <p>thanks much,<br>
    jarrod</p>
