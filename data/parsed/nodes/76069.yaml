    <p>LeBeaune is a contemporary lapidary engraved font with many ligatures and alternative letters.<br>
    This font was at first drawn for the famous town in Burgundy (France) for its corporate identity and signage.<br>
    This version is entirely redrawn and digitalized.<br>
    It's an openType font.<br>
    You can have a preview, download the specimen and buy at:<br>
    http://www.editions205.fr/index.php?/fonderie/lebeaune--soon/</p><div class="imageWrap"><img src="http://typophile.com/files/lebeaune-205-01_5622.jpg"></div><div class="imageWrap"><img src="http://typophile.com/files/lebeaune-205-02_5411.jpg"></div><div class="imageWrap"><img src="http://typophile.com/files/lebeaune-205-03_6589.jpg"></div><div class="imageWrap"><img src="http://typophile.com/files/lebeaune-205-04_4031.jpg"></div><div class="imageWrap"><img src="http://typophile.com/files/lebeaune-205-05_6647.jpg"></div><div class="imageWrap"><img src="http://typophile.com/files/lebeaune-205-06_5521.jpg"></div><p></p>
