    <p>Hi,<br>
    I really don't know that much about fonts, and am only a user, but I was wondering if someone could help me out. I Recently installed the light and medium version of a font, and when I switch to that font family in my word processor, it defaults to the medium layout. However, I want to use the light version in stead of the medium and the medium as the bold. Is there a way to edit the font files (they're in OTF format) so that the light and medium are viewed as medium and bold?<br>
    Thank you!</p>
