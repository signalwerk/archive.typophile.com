    html: |-
      <p>You failed to mention a few critical details - such as:<br>
        The fonts in question - their names and source.<br>
        The word processor you're using<br>
        The Operating system you're using.</p>
      <p>It is a very poor idea to change those names, even if you could. Particularly if what you have are two members of a larger family that already has regular and bold versions. You would make both your fonts and your documents incompatible with any other operating environment. (For instance, if you changed 'Medium' to 'Bold' and your document was read on a system that already had the PROPER 'Bold' version, the user of that system would see the BOLD font instead of your intended MEDIUM font.</p>
      <p>In general, changing the internal font names requires a few things:<br>
         1) Permission from the vendor/foundry/source. This may or may not be specified in the EULA.<br>
         2) An appopriate program that is capable of changing those names and styles etc.<br>
         3) Knowledge of how the multiple font name fields and flags in a font interact with each other and with other members of the same family. And what you do might have to be different depending on the OS and applications involved.</p>
      <p>There are differences in the ways that font families, names and styles are used and displayed on menus by Apple and Microsoft Operating Systems and by Microsoft and Adobe applications.</p>
      <p> - Herb</p>
