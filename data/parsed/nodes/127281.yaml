    html: |-
      <p>So, the short answer is, that won't work very well, for exactly the reason you describe. It's not a bug, it has to do with how MM fonts work. (FontLab VI deals with this a bit differently, but still, not something you want to do, normally/)<br>
      There are two possible answers:<br>
      - if you are going to make separate fonts, then remove overlap as part of your font-output routine AFTER you generate the instances. Generate instances, then remove overlap.<br>
      - if your ultimate output is variable fonts, then don't remove overlap. That's the whole reason variable fonts allow overlapping paths, because the consequences of overlap removal can be really problematic for your shapes.</p>
