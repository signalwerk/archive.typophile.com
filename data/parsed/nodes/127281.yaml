    <p>Hello everybody!<br>
    First i hope i didn't overlook a specific topic where my question would fit better than in "general discussions".<br>
    I have another "random" bug in FontLab i don't know how to deal with: I drew a font with 2 axes (4 masters) and before generating want to flatten all glyphs (means "merge contours"). But if i do so, the merged contour from e.g. master 1 will be applied to all other masters, which means i would have to draw these again. Also, this error applies randomly to some glyphs who don't even have 2 or more separate forms that could be merged.<br>
    In an older project file this all works fine, so i really have no guess what this is about — has anyone of you ever dealt with this bug or some suggestions to fix it?<br>
    Thanks in advance and have a nice sunday!</p>
