      <p>re. ligature: certainly, the part that joins two letters, is, from an etymological point of view, the salient quality of a ligature, but in typography it is generally understood that a ligature is a two (or more) character glyph, where the shapes of the constituent glyphs are modified as they coalesce. So it's important, for instance, not just that there is a single joined crossbar in "ff", but that the ascenders of the two "f"s generally differ in height.</p>
      <p>I was going to say that the first f is shorter, but then I remembered Blado.</p>
