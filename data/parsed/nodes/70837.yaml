      <p>A few quick notes:</p>
      <p>If "ascender" is singular, "descender" should also be;<br>
      The word and the line associated with "Spur" don't align with anything;<br>
      Technically, "fi" as a whole represents a ligature, not simply the crossbar which joins the two letters in your example.</p>
