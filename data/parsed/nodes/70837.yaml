    <p>Hi. </p>
    <p>I am new to typography &amp; recently started reading about typography in detail. As a first step, i am trying to understand type anatomy, to help myself i making a simple poster with type anatomy explained, so i can stick it in-front of me &amp; let it hammer in my mind. </p>
    <p>Till now, these are the details i am able to fetch from various sources : <a href="http://nitingarg.com/shared/first-draft.jpg" title="http://nitingarg.com/shared/first-draft.jpg">http://nitingarg.com/shared/first-draft.jpg</a></p>
    <p>Now, it would be really helpful if you can just check &amp; let me know if i am missing something or done something wrong there.</p>
    <p>Thanks for your time !</p>
