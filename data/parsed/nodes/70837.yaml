    html: |-
      <p>I sympathize.<br>
      It's hard to set your moral compass when you see the relativity of standards that are applied to originality/homage/plagiarism, in different areas of digital culture (and countries).</p>
      <p>Nitin appears to have swiped the layout, but he has made his own artwork from scratch, changing the font. And as he says, this is a starting point.</p>
      <p>That degree of "sufficient change" would be quite acceptable in making a font.</p>
      <p>The meaning of plagiarism has not changed, and I think that irrespective of how legal or changed derivative work may be, it never hurts to credit one's sources -- this is a perfect usage for metadata.</p>
      <p><a href="http://www.docspopuli.org/articles/RecyclingArt.html" title="http://www.docspopuli.org/articles/RecyclingArt.html">http://www.docspopuli.org/articles/RecyclingArt.html</a></p>
      <p>Latest on the Fairey case:</p>
