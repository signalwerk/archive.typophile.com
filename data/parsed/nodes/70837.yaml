      <p>Overshoot and sidebearing could be added. Possibly kerning, which is sidebearings that overlap.</p>
      <p>The callouts for "bowl" and "counter" could end in the middle of the spaces they describe, not on part of the type that surrounds those spaces.</p>
      <p>In his <em>Short History</em>, Warren Chappell included a drawing of a piece of metal type, which gives concrete identity to some of the more abstract spatial concepts of typography.</p>
