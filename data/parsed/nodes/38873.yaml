    <p>Hi all.</p>
    <p>A month ago I posted here concerning a logotype that I’m making. Thanks for your advice! I’ve devoloped a new one, but I’m not satisfied with it. Could you please help me develop a new one? Please take a look:</p>
    <p><a href="http://img3.freeimagehosting.net/uploads/b90aee2697.jpg" title="http://img3.freeimagehosting.net/uploads/b90aee2697.jpg">http://img3.freeimagehosting.net/uploads/b90aee2697.jpg</a></p>
    <p>The logotype is for my (small) advertising and PR firm. The company name is my last name (the one you see above).</p>
    <p>There’s one logotype that I really like. It’s a fictional one, but it’s really cool. </p>
    <p><a href="http://img3.freeimagehosting.net/uploads/3383b76e87.jpg" title="http://img3.freeimagehosting.net/uploads/3383b76e87.jpg">http://img3.freeimagehosting.net/uploads/3383b76e87.jpg</a></p>
    <p>The thing I like with the typography is that the Y is in the center of the word, and being wrapped by “WA” and “NE”. Two letters on each side. The font is also well made. Unfortunately I can’t use this technique as the name has seven letters.</p>
    <p>The symbol is the best one I’ve seen so far. A “W” which is formed like a trident. The only symbol which have anything with the letter “G” I’ve found is the G-clef. But I don’t  work with music so it’s nothing for me.</p>
    <p><strong>—————————————————-</strong></p>
    <p>The font I use now (Adobe Garamond Pro) is okay. But not good enough. Do you have any suggestion conerning font/space et.c.? Should I use capital letters instad?</p>
    <p>I’ve got no idea what I should use as a symbol. The one I use now is a bit childish. Please help me with this one, I’ve got no clue. I’m stuck on this one.</p>
    <p>I would prefer if the symbol reminds one of a “G” or something similar.</p>
    <p><strong>—————————————————-</strong></p>
    <p>When writing in a design forum, I could take the opportunity to ask you about colors. I have experimented with colors, and 722A7E (C67/M100/Y14/K3) is the one color I like best. This is my profile color and I use it on my webs</p>
