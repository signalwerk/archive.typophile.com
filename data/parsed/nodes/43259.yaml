    <p>I have never understood exactly what these are. I do know that I have had problems with them before, I had a printer call me and complain about "composite" text, I ended up having to outline the fonts. Thomas Phinney once threatened to write a piece in his blog about them, but I remember checking and it never showed up.<br>
    ID CS2 stopped generating them, by and large, and now with CS3 it seems that all the fonts are encoded this way.<br>
    Can anyone explain what a CID encoded font is? Is this something that is still going to cause me problems?</p>
    <p>thanks</p>
    <p>pbc</p>
