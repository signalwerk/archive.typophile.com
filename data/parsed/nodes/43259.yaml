      <p>I do remember that thread and thought that CS2 had put this issue to rest. But now it's back in full force with CS3. Weird. Bert in that other thread says this has been remedied by CS2 (which I found to be largely true). But now it has been "un-remedied".<br>
      I have just been experiencing some funny behavior on my computer and it feels like fonts are at fault so I have been looking into it.</p>
      <p>pbc</p>
