    html: <p>There are 2 different scripts on this wedding invitation. "your response is requested by"/"dress to impress" is <a class="freelinking external" href="http://www.myfonts.com/fonts/adobe/bickham-script-mm" rel="nofollow">Bickham Script</a> (using some <a class="freelinking external" href="http://www.myfonts.com/fonts/adobe/bickham-script-mm/regular/glyphs.html" rel="nofollow">stylistic alternates</a>). Unfortunately, that's a different story for "Angela and Justin" which is clearly stated "<a class="freelinking external" href="http://www.bespokepress.com.au/invitation/angela-and-justin" rel="nofollow">custom hand lettering with personalised monogram</a>". You may have a look to the work of <a class="freelinking external" href="http://www.myfonts.com/foundry/Emily_Lime/" rel="nofollow">Emily Lime</a>, <a class="freelinking external" href="http://www.myfonts.com/foundry/Laura_Worthington/" rel="nofollow">Laura Worthingthon</a>, <a class="freelinking external" href="http://www.myfonts.com/foundry/Magpie_Paper_Works/" rel="nofollow">Jessica McCarty</a>, <a class="freelinking external" href="http://www.myfonts.com/foundry/Tart_Workshop/" rel="nofollow">Crystal Kluge</a>, <a class="freelinking external" href="http://www.myfonts.com/foundry/Corradine_Fonts/" rel="nofollow">Manuel Corradine</a>, <a class="freelinking external" href="http://www.myfonts.com/foundry/Sudtipos/" rel="nofollow">Alejandro Paul</a>, <a class="freelinking external" href="http://www.myfonts.com/foundry/Li%C3%A1n_Types/" rel="nofollow">Maximiliano Sproviero</a> and <a class="freelinking external" href="http://www.myfonts.com/foundry/Typesenses/" rel="nofollow">Sabrina Lopez</a>. <a class="freelinking external" href="http://www.myfonts.com/fonts/emily-lime/carolyna" rel="nofollow">Carolyna</a> could be, for instance, an excellent substitute.</p>
