      <div class="comment-spam-body"><p>ATF  1923 is a magnificent specimen publishing effort. Print copies are rare.<br>
      Invitation is also in ATF 1934 -- a much less extensive book --at page 133. Readily available in an accurate reprint by Schiffer in 2007. ISBN: 978-0-7643-2770-4. Currently priced at only $19.95 for direct sales from the publisher.<br>
      Online copies of ATF 1923 &amp; 1934 are disappointing.<br>
      Don</p>
      </div>
