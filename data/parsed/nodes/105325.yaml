      <p>Just guessing here, but this looks like a pastiche from the era of photo-lettering in the 1960s to 1980s.<br>
      The distinctive wedge serif on leg on the h, and the wedge shaped crossbar on t, are features of a pre-WWI era serifed font sold by American Typefounders as Invitation. The sagging bowls on g and p were the height of font design fashion circa 1910.<br>
      Can't say if this was a full font or just enough to design the book title.<br>
      Don</p>
