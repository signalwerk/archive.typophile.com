    html: |-
      <p>For those not in the know, "Club Jibarito" is a funny name for an upscale jewelry store because it basically means something along the lines of "Little Hillbilly Club."  No matter; my last name is "Hladek," and I'm half Puerto Rican, so go figure.</p>
      <p>I second David's perspective.  The proposed logo doesn't have very good balance.  The 'j' makes it top heavy, and yet, at the same time, the 'C' is too big.  Not a bad direction, though.</p>
      <p>--<br>
      Nick Hladek</p>
    html_clean: |-
