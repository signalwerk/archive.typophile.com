      <p>You have a seashell spiral thing going on with the tail of the j and the continuance of the C... extend the bottom stroke of the C a little, then continue that spiral up and around with an offset lighter-toned (grey) accent mark. That'll help maintain the strength of the Cj combo plus adding a "catcher" should the j start falling over. Having it an different shade will help to create more dimension as well. </p>
      <p>I like how your original design creates conflict, it's uneasy which helps create focus.</p>
