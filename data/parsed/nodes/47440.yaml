    <p>Hi,</p>
    <p>We are trying to redesign the logo for an upscale jewelry in San Juan.  They mostly sell very expensive watches. The brand must represent luxury and also the client wants a symbol they can use alone.  Don't pay any attention to the name because it doesn't have any relation to luxury, jewelry or anything for that matter.</p>
    <p>Here is the current logo:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/logo_jibarito_5478.gif"></div><p></p>
    <p>This is the proposed logo used in various sample executions:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/200290680-003_1_4237.jpg"></div><p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/maria-menounos-chopard-and-valentino-dinner-party-cannes-3_1_5818.jpg"></div><p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Gad-Elmaleh_1_5179.jpg"></div><p></p>
    <p>What do you think?</p>
    <p>E.</p>
