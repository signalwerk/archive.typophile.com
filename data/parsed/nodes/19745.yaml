      <p>Not only a beautiful type face, but beautiful words:</p>
      <p>"Type designers are crazy. Not crazy like we think we’re Napoleon, but crazy in the sense that with the sky falling, wars tearing the world apart, disasters splitting the very ground we walk on, and plagues circling the continents to pick victims randomly, we will still try to make a little facet of the world more appealing to the human eye. We ought to be proud of ourselves. Optimism is hard to come by these days. Regardless of our personal reasons for doing what we do, designing type is an act of optimism and belief in the beauty that exists within humanity." </p>
      <p>Alejandro Paul</p>
