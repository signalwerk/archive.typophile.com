    <p><a href="http://www.sudtipos.com/fonts/2" rel="nofollow">A foreign Affair</a></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/affaircoll_4650.gif"></div><p></p>
    <p>"Upon finishing the font I was fortunate enough that a few of my colleagues, great type designers and probably much saner than I am, agreed to show me how they envision my Affair in action. The beauty they showed me makes me feel small and yearn for the world to be even smaller now – at least small enough so that my international colleagues and I can meet and exchange stories over a good parrilla. These people, whose kindness is very deserving of my gratitude, and whose beautiful art is very deserving of your appreciation, are in no particular order: <a href="http://www.coreyholms.com" rel="nofollow">Corey Holms</a>, <a href="mhiriart@fibertel.com.ar" rel="nofollow">Mariano Lopez Hiriart</a>, <a href="http://www.fontbureau.com/people/XavierDupre" rel="nofollow">Xavier Dupré</a>, <a href="http://www.alejandroros.com.ar" rel="nofollow">Alejandro Ros</a>, <a href="http://www.canadatype.com" rel="nofollow">Rebecca Alaccari</a>, <a href="http://www.laurameseguer.com" rel="nofollow">Laura Meseguer</a>, <a href="http://www.positype.com" rel="nofollow">Neil Summerour</a>, <a href="http://www.emtype.net" rel="nofollow">Eduardo Manso</a>, and the <a href="http://www.doma.tv" rel="nofollow">Doma group</a>. You can see how they envisioned using Affair in the section of this booklet entitled A Foreign Affair."</p>
    <p><a href="http://www.sudtipos.com/fonts/2" title="http://www.sudtipos.com/fonts/2">http://www.sudtipos.com/fonts/2</a></p>
