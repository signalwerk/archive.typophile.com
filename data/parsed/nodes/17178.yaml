    <p>Hi,<br>
    there are two Niggli books by Willi Kunz:</p>
    <p>1. Typography: Macro and Microaesthetics<br>
    2. Typography: Formation + Transformation</p>
    <p>What is the difference between them? Are they two volumes of a single manual? Is the latter a new edition of the former? What do you think about them?</p>
    <p>TX</p>
    <p>P.S. What is the internet address of Willi Kunz Studio?</p>
