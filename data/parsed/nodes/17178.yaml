    html: |-
      <p>Personally, I think Typography: Formation + Transformation is WAY overpriced. $100 bucks for a hardback book is steep. It should be at least HALF that price. There are other books that can teach you about type and grid structures. You can get TWO books for the same price and can learn the same thing. </p>
      <p>Univers is a GREAT typeface...but given that this is the 21st century, there are many other type choices.</p>
