      <p>MULE: could be <a class="freelinking external" href="http://www.myfonts.com/fonts/linotype/alternate-gothic-lt/" rel="nofollow">Alternate Gothic</a> (no.1), manually roughened and rounded. Some alternatives, ready to use: <a class="freelinking external" href="http://www.myfonts.com/fonts/hvdfonts/cheap-pine/" rel="nofollow">Cheap Pine Sans</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/flat-it/mocha-mattari/" rel="nofollow">Mocha Mattari</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/yellow-design/anodyne/" rel="nofollow">Anodyne</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/yellow-design/veneer/" rel="nofollow">Veneer</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/flat-it/dharma-gothic-p/" rel="nofollow">Dharma Gothic P</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/hipopotam/mr-black/" rel="nofollow">Mr Black</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/astigmatic/prison-aoe/" rel="nofollow">Prison AOE</a>, <a class="freelinking external" href="http://www.fontshop.com/fonts/downloads/fontfont/ff_dirty_faces_2_ot/" rel="nofollow">FF Dirty Seven One and Two</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/fontfont/ff-kipp/" rel="nofollow">FF Kipp</a>, <a class="freelinking external" href="http://www.dafont.com/thorne.font?text=MULE&amp;psize=l" rel="nofollow">Thorne</a>, <a class="freelinking external" href="http://www.dafont.com/growly-grin.font" rel="nofollow">Growly Grin</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/baselinefonts/woodgrit/" rel="nofollow">Woddgrit</a><br>
