    <p>Hi all,</p>
    <p>Sometime in the last few years, at one of the main type sites, I recall seeing a face that I think was based on something from Germany in the 1920s or 30s. I’ve gone back and can’t find it anywhere, but I doubt it’s that tough to ID. Characteristics:</p>
    <p>— Heavy/Thick<br>
    — San-serif with (I think), very slightly rounded corners<br>
    — Used for signage (I think)<br>
    — Might only be title case</p>
    <p>Thanks!<br>
    T. Ross</p>
