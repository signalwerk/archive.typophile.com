      <p>Hi there,</p>
      <p>Ok, I don’t know if it exactly fits - it hasn’t exactly got rounded corners - but even if this is the wrong one, it’s a doozy, so I’ll post it anyway.</p>
      <p>The <a href="http://isarsteve.de/blog/index.php?/archives/2006/10.html">Deutsche Blockschrift</a> was not a font, but hand lettering used in the 1920’s and 1930’s. It’s used in a bunch of the central subway stations in Berlin, most notably in a few old platforms at Alexanderplatz.</p>
      <p>I’ve always thought it definitely must have influenced Arno Drescher’s <a href="http://www.myfonts.com/fonts/bitstream/drescher-grotesk-bt/familytree.html">Grotesk</a>, which was also designed in the 30’s. After WWII, the (only) East German type foundry <a href="http://pingmag.jp/2007/10/05/veb-typoart-the-east-german-type-betriebsstatte/">VEB Typoart</a> continued producing Drescher Grotesk, also called Super Grotesk, and it became one of their bestsellers. </p>
      <p>After the Wall fell and VEB Typoart dissolved, Sven Smital from Berlin design collective eBoy (known for their elaborate pixel drawings) did a <a href="http://www.fontshop.com/fonts/downloads/fontfont/ff_super_grotesk/">Super Grotesk revival</a> for FontFont.</p>
      <p>Also interesting and German and partly from the 30’s are the <a href="/wiki/FF%252BCity%252BStreet%252BType" class="wiki">FF City Street Type</a>s, although they’re probably not what you’re looking for. The East Berlin version has rounded corners, but it’s from the 50’s. </p>
      <p>Good luck!</p>
