      <p>Could it be you mean Super-Grotesk schmalfett (bold condensed) in the german poster edgeonyou shows? The text is from the communist East Germany in the beginning of the 60ies, Cold War started already. And in East Germany Super-Grotesk was the most common Grotesk after all old east german foundries were overtaken in VEB TypoArt. They had no access to lead types from West Germany in the following decades.<br>
      Here is a sample of Super-Grotesk schmalfett (just scroll a little bit):<br>
      <a href="http://www.typografie.info/typowiki/index.php?title=Super_Grotesk&amp;diff=0&amp;oldid=3017" title="http://www.typografie.info/typowiki/index.php?title=Super_Grotesk&amp;diff=0&amp;oldid=3017">http://www.typografie.info/typowiki/index.php?title=Super_Grotesk&amp;diff=0...</a></p>
      <p>Georg</p>
