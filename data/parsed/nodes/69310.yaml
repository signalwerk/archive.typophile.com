    html: |-
      <p><cite>.. a wmf format, which I believe is too low quality for high-end printing. ..</cite></p>
      <p>Nah-- not if the images are vector-based. Sure, wmf lacks stuff like bezier curves and three-point gradient filling, but I presume you are talking about simple (in geometric terms!) black-and-white shapes.</p>
      <p>Did you check the <em>other</em> files you get on Save as Web page? You are probably overlooking the .emz (or .wmz) files because you cannot open them with anything. Rename one of these to .gz, extract using just about any compression program except Windows' built-in one (7-Zip has no problems with gz), rename the result back to: emf (for an emz file) or wmf (for a wmz). Then open in Illustrator.</p>
      <p>If that doesn't work, follow Tomi's advice and print to PDF.</p>
