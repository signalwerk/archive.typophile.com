    html: <p>There is also <a href="http://jsesh.qenherkhopeshef.org/"><strong>JSesh</strong></a> whose input is in the <em>manuel de codage</em> format;  it is free, and runs on many platforms. It comes with lots of egyptian texts ready to open and read (if you read the language). I just opened one of those files on my MacBook Pro, copied some text as pdf (the Edit menu allows "Copy as..." &gt; "Copy as PDF") and pasted it in InDesign without a glitch.</p>
