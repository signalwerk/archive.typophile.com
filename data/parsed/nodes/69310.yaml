    html: "<p>You can also export in a variety of formats including eps, encapsulated pdf, svg (for further processing in Illustrator for instance) but be careful: at least with encapsulated pdf, it is the selection that is exported, not the full text. If you select nothing, you get an empty file and an error when you try opening (or at least that is what I get  on my MacBook Pro with OS X 10.5).</p>"
