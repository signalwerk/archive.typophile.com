      <p>Andreas, if Egyptologists are anything like the other language scientists I have had to deal with, they'd probably <em>reluctantly</em> submit their papers electronically. Because before that, they'd always sent in engraved stone slabs, and that worked just fine the past two hundred years.</p>
      <p>If the Unicode coding only makes sense in combination with Opentype features, the task of producing the correct hieroglyphs is delegated to software developers ... in other words, you may expect the full range of 'totally not supported' <em>via</em> 'good-but-not-quite' to 'hey, in <em>this</em> program it works perfectly'. Granted, as soon as you found a program where it works, it's just a matter of writing a PDF and using that instead in the program of your choice.</p>
