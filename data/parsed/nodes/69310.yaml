      <p>It may be worth noticing that Egyptian Hieroglyphs have been given official Unicode points about one year ago. Though that will hardly help with handling of older documents and specific file formats, the way is now open to implement Old Eyptian based on regular encoding. Of course, the variable stacking of glyphs renders a particular challenge for text composing. However, I imagine that some Opentype solutions may well provide remarkable possibilities to elegantly master even that. Given the sheer amount of characters (over 1000) this means a very great deal of intense work to master though.<br>
      Are Egyptologists aware of that perspective? Or will they lean back and wonder about others who “fail to handle” the matter, like they did for so long time? The encoding of the Egyptian Hieroglyphs was not a project of any academical institution, it was the effort of one single independent man.</p>
