  html: <p>Has anyone here ever worked with Egyptian hieroglyphics? I am working with an author who has embedded hieroglyphs in Microsoft Word documents using a program called WinGlyph (which is no longer available). This is for a university press book. From what I've been able to determine the images made their way into Word via a wmf format, which I believe is too low quality for high-end printing. But the author says that he has submitted Word documents with such glyphs embedded in them to journals and they looked all right. The author also says of hieroglyphs in conventional font formats that "none of them is adequate for serious Egyptological work, insofar as they do not allow for 'stacking,' i.e. the placement of one glyph on top of one, two, three others. They are all just linear which is not how hieroglyphs were written." If I am looking at taking each instance of the glyphs and fixing it in Illustrator this would be a monumental project. Any thoughts?</p>
  html_clean: <p>Has anyone here ever worked with Egyptian hieroglyphics? I am working with an author who has embedded hieroglyphs in Microsoft Word documents using a program called WinGlyph (which is no longer available). This is for a university press book. From what I've been able to determine the images made their way into Word via a wmf format, which I believe is too low quality for high-end printing. But the author says that he has submitted Word documents with such glyphs embedded in them to journals and they looked all right. The author also says of hieroglyphs in conventional font formats that "none of them is adequate for serious Egyptological work, insofar as they do not allow for 'stacking,' i.e. the placement of one glyph on top of one, two, three others. They are all just linear which is not how hieroglyphs were written." If I am looking at taking each instance of the glyphs and fixing it in Illustrator this would be a monumental project. Any thoughts?</p>
