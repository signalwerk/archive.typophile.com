    html: <p>If the author can send you the input text, which is presumably in <em>Manuel de codage</em> format, you can use one of the other Egyptian layout engines that is available. FWIW, there's one for Mac called MacScribe, which can output *.eps files for you. I don't know whether the Windows options (InScribe, Glyphotext) output vector art, but this might be worth looking into. There's also a TeX one called HieroTeX.</p>
