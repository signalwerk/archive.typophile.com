    html: <p>Sumner Stone did several presentations about this stuff years ago. His general theme was the increasing complexity of the Latin writing system, which has had letters, case, punctuation, figures, and styles (Italic, then Bold) folded in over the centuries. As pointed out above, manuscripts in Carolingian Europe used Lombardic and Uncial caps for initials and lead-in text blocks of the Carolingian minuscule that provided the model for our lower case. The cpas moved from a role of initials and emphasis into one of more general case (still effectively initials) over time.</p>
