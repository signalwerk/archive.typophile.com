    <p>The evolution via writing facilitation of what we now consider lowercase forms out of monumental uppercase originals is well-documented. But I don't remember reading much about how eventually the two cases were combined to deliver text, and acquire the grammatical determinance we take for granted today. For example, how long did it take after the establishment of lowercase for this to happen? And did uppercase completely fall out of common use at any point? This applies not only to Latin but also Cyrillic, Greek and Armenian at least.</p>
    <p>Any elucidation would be most welcome.</p>
    <p>hhp</p>
