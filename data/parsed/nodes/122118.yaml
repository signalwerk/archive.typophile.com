      <p>Before minuscules were developed (Latin), there were uncial sorts used for body text in book production. To set captions, chapter initials, certain word or sentence beginnings and similar focal points inside the text against the common style, more “ancient-style” e.g. Roman capital shapes have been employed, more or less obvious/deliberate. I think there lies the origin of a dualistic behaviour which later became a bicameral canon.</p>
      <p>Still today the regular use of lower/uppercase is remarkably different in different languages.<br>
      But no country adopted the tricameral system of the old days as mandatory, this is the sad side of the story ;)</p>
