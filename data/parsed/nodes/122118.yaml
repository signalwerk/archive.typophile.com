      <p>Well, it is known that for the Latin alphabet, dual case script was a deliberate invention - it came about when Charlemagne sought to have a standard scribal hand created, and so it combined the original Roman monumental script for capital letters with a lower-case based on uncial.</p>
      <p>According to this page,</p>
      <p><a class="freelinking external" href="http://learnrussian.rt.com/alphabet/the-history-of-the-cyrillic-alphabet/" rel="nofollow">http://learnrussian.rt.com/alphabet/the-history-of-the-cyrillic-alphabet/</a></p>
      <p>lower-case letters were added to Cyrillic by Peter the Great.</p>
      <p>And the Wikipedia article cited in the post above gives information on the origin of Greek lower-case as well. So far, I've found nothing on Armenian lower-case.</p>
      <p>...but now I remember that a few days ago, I came across something that mentioned that Bolorgir was originally the name for the Armenian minuscule hand, before it became applied to the traditional style of Armenian types.</p>
