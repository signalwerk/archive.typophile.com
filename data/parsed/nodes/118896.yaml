    <p>I'm sure we're all bored to tears by now with those <a class="freelinking external" href="http://experimentalsans.tumblr.com/" rel="nofollow">'experimental sans'</a> typefaces that flourished a year or two ago. Essentially they're taking naivist, vaguely Futura-esque geometric lettershapes and adding extra lines, disporportionate character extensions, strange glyph shapes and whatnot for the hell of it. The basic style is clearly still geometric, but the're a bunch of extra crap haphazardly thrown on, negating the original simplifying intent. (This distinguishes it from the actual experimentation Renner was doing with Futura, and from more traditional alternate and swash shapes that tend to emanate from varying the basic ideas of the skeleton itself.)</p>
    <p>I thought this affliction was a particular blight on our age, but then while looking for info relating to <a class="freelinking external" href="http://typophile.com/node/118802" rel="nofollow">this thread</a> I came across a set of similarly silly Art Nouveau types: <a class="freelinking external" href="http://luc.devroye.org/Schelter+Giesecke-Washington.jpg" rel="nofollow">Washington</a> and the two in <a class="freelinking external" href="http://typophile.com/node/4567?page=1#comment-117488" rel="nofollow">this comment</a>. Again, it's obviously basically shapes from a particular genre of type (grotesque, in this case) with a bunch of extra, haphazard changes thrown in to make it trendy. </p>
    <p>Makes me wonder: Can you think of other examples from other historical periods, that give off a similarly ill-fitting vibe? It's sort of fascinating.</p>
