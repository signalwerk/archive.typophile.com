      <p>There have always been gimmicky typefaces. Most are poorly designed and poorly constructed, but some are quite nice. Very few will ever enjoy widespread use, but every now and again, one of them will be perfect for a particular project (like in Nick's example).</p>
      <p>I won't say that I'm bored with the "experimental sans" designs you mentioned. I might not use them, but that's because their personalities haven't matched what I've needed for the design projects I've been working on. Mostly, I pay little attention to the trends that come and go, and it hadn't even occurred to me that this trend had arrived and then gone by.</p>
      <p>For what it's worth, I see nothing wrong with typographic experimentation, and the fact that the results from these experiments are derivative of something else doesn't bother me either — all typography is derivative of what came before it.</p>
