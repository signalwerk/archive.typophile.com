      <p>Interesting. I learned a new term from this discussion: Art Nouveau Grotesk. A very useful pigeon hole for some monoline fonts that are a hybrid of a grotesque/sans-serif and swash stokes, like the old Washington by S&amp;G.<br>
      As for use, I don't see a lot of applications for most of these. Too quaint for cutting edge presentations like Serena Ryder Harmony. Retro labels perhaps?<br>
      Steampunk?<br>
      Many are interesting mainly as exercises in alternative forms, such as the S&amp;G 1912 boxy sans design with reverse contrast and Hebrew style tabs at <a href="https://www.flickr.com/photos/n1ke/4856191305/in/set-72157624519443005/" title="https://www.flickr.com/photos/n1ke/4856191305/in/set-72157624519443005/">https://www.flickr.com/photos/n1ke/4856191305/in/set-72157624519443005/</a> and discussed in the thread noted by Johan. It can now join its strange sisters in the Art Nouveau Grotesk playground.<br>
      Don</p>
