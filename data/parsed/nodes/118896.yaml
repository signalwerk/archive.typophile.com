      <p>Matthew Carter gave a lecture on this subject at the Society of Printers in Boston in 1994, with the title <em>Experimental Type Design: Historical and Contemporary Alternative Letterforms.</em> It's possible he published a version of it somewhere.</p>
      <p><strong>Follow-up:</strong> I can't find an edition of this lecture in print, but it appears that some colleges where he delivered it have it on VHS tape in their libraries, including the <a class="freelinking external" href="http://www.worldcat.org/title/modernism-eclecticism-symposium-4-a-graphic-design-symposium/oclc/32041742" rel="nofollow">University of Illinois at Chicago Library</a> and the <a class="freelinking external" href="http://nscadvrc.omeka.net/items/show/5352" rel="nofollow">Nova Scotia College of Art and Design</a>. I hope someone has digitized it and posted it somewhere, but I couldn't find it with Google or YouTube.<br>
      You may be able to send Matthew Carter an inquiry through his company, <a class="freelinking external" href="http://www.carterandcone.com" rel="nofollow">Carter &amp; Cone</a>.</p>
