      <p><cite>This may be considered bad grammar in the States — I wouldn’t know — but it’s fine over here!</cite></p>
      <p>It’s perfectly acceptable in the States too. There’s a difference in meaning (verb aspect, in this case) between the “preterite” (completed action) and the “present perfect” (something occurring in past that continues or relates to present) that works mostly the same, so far as I know, in both American and British standards of English. In this case, the latter verb form is useful to imply that the toaster still does not work.</p>
