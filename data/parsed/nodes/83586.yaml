  html: |-
    <p>Came across this...</p>
    <p><a class="freelinking external" href="http://www.microsoft.com/typography/otspec/features_ae.htm#cv01-cv99" rel="nofollow">http://www.microsoft.com/typography/otspec/features_ae.htm#cv01-cv99</a></p>
    <p>I've read through this description several times and can't quite get a handle on it's application and usage. It appears that with each Character Variant, a selection of glyphs can be accessed to replace one glyph or group of associated glyphs say cap A's. Is anyone using this feature and does any software currently support it. </p>
    <p>James</p>
