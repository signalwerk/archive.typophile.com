    html: <p>Support for this feature is defined in the <a class="freelinking external" href="http://dev.w3.org/csswg/css3-fonts/#font-variant-alternates-prop" rel="nofollow">CSS3 Fonts spec</a> and there's an example showing it's use in a font designed to support glyphs found on Byzantine seals.</p>
