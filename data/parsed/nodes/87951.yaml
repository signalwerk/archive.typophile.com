    html: <p>Read the <em>entire</em> multiple master chapter of the Fontlab manual. Then read Adobe’s PDF book <a href="http://www-cdf.fnal.gov/offline/PostScript/5091.Design_MM_Fonts.pdf" rel="nofollow"><em>Designing Multiple Master Typefaces.<em></em></em></a> I am not blowing you off; this stuff is very complex and those articles are the only decent documentation of the process, regardless of what program you use to interpolate fonts. If you get through the reading first, everything else will be a lot easier.</p>
