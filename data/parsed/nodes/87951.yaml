      <p><cite>I already read that pdf but this is helpful when you design from begining, but i got 2 fonts already..</cite></p>
      <p>You <em>are</em> at the beginning. You cannot just blend two incompatible outlines and interpolate a family. The math doesn’t work that way. You are so still at the beginning that you have not even grasped the complexity of what you are getting into. Read the stuff again, slow down, build your compatible fonts, and experiment with interpolation a few letters at a time until you have figured out how it works. Trust me, it will take you a while to really wrap your brain around it.</p>
      <p>On a related note, this stuff is much easier to do in Glyphs or Robofont. FontLab’s multiple master implementation is a buggy heap of shit.</p>
