    html: |-
      <p>Glyphs does not have a standalone interpolation panel. Everything is done by adding masters in the font window. Set your master font weight settings are set to a common stem width (such as the stems of H). Then all you have to do is plug in the stem widths for the instances as you add them. Stem widths can be determined either by working with various interpolation theories or by using existing type families as a model.</p>
      <p>If the glyph has a red flag in the upper left then the outlines are not compatible. If the outlines have matching paths and points then “Correct path direction” will fix start points and glyph orders to make them compatible. Sometimes glyphs cannot work out path order and you have to fix it manually by copy/pasting paths in one-by-one from the background layer.</p>
