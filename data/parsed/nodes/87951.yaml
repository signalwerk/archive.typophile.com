    html: |-
      <p><cite>you tryin to tell me that Glyphs and Robofont are better than FontLab?</cite></p>
      <p>Absolutely. If you work with Fontlab you have to work with its strict—and buggy—implementation of Adobe’s multiple master system. Components do not work correctly, creating the MM font from extant font is a PITA, and you cannot use an arbitrary number of masters. Glyphs and Robofont are much simpler. In Glyphs and Robofont you just add another master layer for each master and dump the glyphs in (or just draw them in one font from the start). If your curves have the same number of point Glyphs does a great job of ordering paths, setting start point locations, and flagging incompatible glyphs. This whole process is much more intuitive in Glyphs—but not especially well documented, so you have to figure some stuff out yourself or email Georg.</p>
    html_clean: |-
