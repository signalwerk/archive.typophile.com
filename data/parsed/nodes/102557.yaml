    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Selavy_Specimen-590_4952.gif"></div><p></p>
    <p>Sélavy is the result of a serendipitous collaboration with <a href="http://soulellis.com/" rel="nofollow">Paul Soulellis</a>. For his project <a href="http://libraryoftheprintedweb.tumblr.com/" rel="nofollow">Library of the Printed Web</a>, Paul was looking for a dotted typeface reminiscent of the punched-out caps on Marcel Duchamp’s 1934 <a href="http://www.metmuseum.org/toah/works-of-art/2002.42a-vvvv" rel="nofollow">Green Box</a>. As he could not find a typeface close enough, I was spontaneously tempted to make one. This is it. (<a href="http://soulellis.com/2013/04/selavy/" rel="nofollow">Paul’s beautiful blog post</a> also reflects on the process.)</p>
    <p>Sélavy (named after Duchamp’s pseudonym Rrose Sélavy) is a dotted typeface that does not follow a non-dotted model; it exploits its dotted character for instance by forming spontaneous «ligations» between letter pairs like fi or fl, but also EE or LL. (Or FTW!) It is quirky (especially in the caps) and recognizable, but pretty legible also in non-huge sizes (whereas if set very large, it tends to disintegrate into a pattern of dots).</p>
    <p>In addition to being used by Paul in his abovementioned project, we are simultaneously releasing Sélavy to the public as a free font under the SIL Open Font License. And we are not only making the ready-to-use font file available but also the fully component-based source UFO file, making it easy for those with access to type design software to generate new instances of the design.</p>
    <p><a href="http://ninastoessinger.com/projects/selavy/" rel="nofollow">Project info / download page</a></p>
    <p><a href="http://typophile.com/node/102309" rel="nofollow">Typophile Critique thread</a> (thanks, all!)</p>
