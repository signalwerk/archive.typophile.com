  - id: 186399
    user: 896
    date: 2007-02-21T07:14:00
    date_raw: 21 Feb 2007 — 7:14am
    votes: null
    html: |-
      <p>To be honest the 'Q' was the main problem character in the uppercase as it's the only character (bar the numerals) with a left-right downward slant; all the others have an upward slant which (hopefully) draws the eye to the top of the next character. I've drawn a few more options in the latest PDF.</p>
      <p>The left sidebar of the 't' was causing problems so good call on losing it. It just didn't sit well with other characters as the left side sat just a little lower than the x-height.</p>
      <p>The 'N' is drawn like that intentionally to fit with the 'K', 'R', 'X', 'Y' and 'Z'. Just having an 'N' where the diagonals met the top/bottom of the verticals wouldn't fit (in my opinion). If anyone else thinks it's a problem too then I suppose I'll need to look at it again. I do have some alternates for the uppercase (shown in the PDF) and a full small caps set drawn too.</p>
      <p>The 'f' horizontal again was intentionally lowered to help the general flow of the face but I agree it's a bit unorthodox. I've dropped the left sidebar like I did on the 't' and comped a few tests together.</p>
      <p>And I will be putting the dots on the 'i' and 'j', I just haven't got around to it yet as I can't decide what form they're going to take.</p>
      <p>Goran, that 'C' is from the previous version so hopefully it has been resolved at least a little by the redraw. I drew it as a monoline face originally and was hoping that I wouldn't have to alter the thicknesses. If anyone agrees that it needs looking at then that's what I'll do.</p>
      <p>I was a bit concerned about the width of the 'r' so I've altered that too, hopefully not too much though.</p>
      <p>New PDF sample attached (up there somewhere, 'magnitude_07_upd1.pdf', I couldn't see how to attach a file to the comment down here), let me know what you think. Thanks for the feedback so far!</p>
