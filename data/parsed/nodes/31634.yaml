      <p>Much better. Kept the sexy foundation but now it's more versatile with the lowercase and more standard forms.</p>
      <p>I don't think anyone will buy the 'Q'. Bring the line down a bit more to the corner and keep this one in as a fun alt.</p>
      <p>I think the 't' horizontal is a little week on the left side. No other stroke is that short on one side of the vertical. Try just cutting the left side altogether.</p>
      <p>The 'N' is awkward. A rotated 'U' might make more sense. Or just a more traditional 'N' with the diagonal meeting the ends of the verticals.</p>
      <p>The 'f' horizontal is way too low.</p>
      <p>Don't assume people don't want 'i' and 'j' dots. It looks nice without them, but give them the option.</p>
      <p>Good move on the slashed zero. There are far too few of these around.</p>
