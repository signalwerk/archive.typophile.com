    <p>I tried to figure this one out, but no match so far: <a href="http://new.myfonts.com/WhatTheFont/forum/case/252212/" title="http://new.myfonts.com/WhatTheFont/forum/case/252212/">http://new.myfonts.com/WhatTheFont/forum/case/252212/</a><br>
    It resembles Futura, but the umlaut and i-dots are squared and the C has the same slants as Erbar-Grotesk. But it is not Erbar. The G-bar isn't slanted and the S is just like Futura's.</p>
    <p>More samples can be found here: <a href="http://www.urbanrail.net/eu/ham/hh-gallery/hh-gallery.htm" title="http://www.urbanrail.net/eu/ham/hh-gallery/hh-gallery.htm">http://www.urbanrail.net/eu/ham/hh-gallery/hh-gallery.htm</a></p>
