  html: "<p>Does anyone know what font is used for Anthology magazine? Here is a link to the virtual edition of the mag: <a href=\"http://anthologymag.com/blog3/issues/\" title=\"http://anthologymag.com/blog3/issues/\">http://anthologymag.com/blog3/issues/</a>. I can upload a scanned portion if needed. Is it Baskerville? It has that very distinct upper-case Q. If it is Baskerville, is it a new version? I can't figure out why it looks different than other Baskervilles I've seen. It looks more modern and updated and I think there is more space between letters. Thanks!</p>"
  html_clean: "<p>Does anyone know what font is used for Anthology magazine? Here is a link to the virtual edition of the mag: <a href=\"http://anthologymag.com/blog3/issues/\" title=\"http://anthologymag.com/blog3/issues/\" class=\"link-external\">http://anthologymag.com/blog3/issues/</a>. I can upload a scanned portion if needed. Is it Baskerville? It has that very distinct upper-case Q. If it is Baskerville, is it a new version? I can't figure out why it looks different than other Baskervilles I've seen. It looks more modern and updated and I think there is more space between letters. Thanks!</p>"
