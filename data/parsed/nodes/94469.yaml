    html: <p>Agree with fvilanakis. Looks like they distorted some generic condensed sans. It could also have been manually slanted. I'm sure it would be not so hard to reproduce the same effect starting, for instance, with some generic sans like <a class="freelinking external" href="http://www.myfonts.com/fonts/adobe/helvetica-neue/cond-bold-obl/" rel="nofollow">Helvetica Condensed Bold Oblique</a> or <a class="freelinking external" href="http://www.myfonts.com/fonts/linotype/univers/UniqueName-217369-115593/" rel="nofollow">Univers Condensed Bold Oblique</a>. For the rest, <a class="freelinking external" href="http://www.myfonts.com/fonts/fontbureau/bureau-grot/cond-medium/" rel="nofollow">Bureau Grot Condensed Medium</a> suggested by fvilanakis is probably one of the best approximation you could get to me.</p>
