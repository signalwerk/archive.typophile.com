      <p>Evetts’ book is interesting but it may give the mistaken impression that the Trajan letters were planned out geometrically. There isn’t any evidence of this.</p>
      <p>You should try to find a copy of Fr Edward M. Catich’s <em>The Origin of the Serif,</em> which a good university library should have, and the rarer <em>Letters redrawn from The Trajan inscription in Rome.</em> The latter is likely to be kept in special collections, although there are six copies for sale on ABE, beginning at $138.</p>
