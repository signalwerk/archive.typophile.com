      <p>Quoted from A2/SW/HK website (scroll down to business case)</p>
      <blockquote><p>The Penguin Book of Modern Speeches and The Penguin Book of Historic Speeches, 2012<br>
      Penguin Press UK, London<br>
      Cover Design and <strong>bespoke typefaces</strong></p></blockquote>
      <p>What I could say though is, part of the spurless /a, it is very close to Helvetica. As A2/SW/HK is run by Henrik Kubel, I would probably choose an Helvetica-like from his foundry A2-Type so, why not, <a class="freelinking external" href="http://www.newrailalphabet.co.uk" rel="nofollow">New Rail Alphabet</a> (which appears to have the same spurless /a).</p>
