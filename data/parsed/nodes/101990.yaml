      <p>To me, that only confirms two things:<br>
      - I really don't know any fonts with such /M and /N (which could be easily reproduced BTW)<br>
      - Seeing now /Q, Block Gothic is definitely a fair alternative to what I'm now convinced is a bespoke typeface<br>
      Hard to tell for the smaller one, that could be a lot of fonts from Avenir to DIN...</p>
