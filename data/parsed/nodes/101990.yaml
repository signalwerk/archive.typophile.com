      <p>Found <a class="freelinking external" href="http://www.sciarc.edu/images/inside.jpg" rel="nofollow">another sample</a> but still can't find a match. Could be a bespoke typeface, loosely similar (except digits) to <a class="freelinking external" href="http://www.myfonts.com/search/compacta" rel="nofollow">Compacta</a> or <a class="freelinking external" href="http://www.myfonts.com/fonts/linotype/helvetica/pro-ultra-compressed" rel="nofollow">Helvetica Ultra Compressed</a>.<br>
      <a class="freelinking external" href="http://www.myfonts.com/fonts/redrooster/block-gothic-rr" rel="nofollow">Block Gothic</a> would be an interesting alternative.</p>
