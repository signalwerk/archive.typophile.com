      <p>Hi Florian,</p>
      <p>this came up before: <a href="http://typophile.com/node/47417" rel="nofollow">Problem with Double Quotes in Arno Pro</a>.<br>
      Miguel Sousa from Adobe chimed in, so the Type Department is aware of this bug for 15 months now. I don’t know if there is an update available yet.</p>
      <p>It’s really a pity, since it renders Arno almost useless for German typesetting: The »guillemets« are too extravagant (or ‘historically authentic’), and the „Anführungszeichen“ don’t harmonise.</p>
      <p>See also this rant on <em>spatium</em>, a German typography blog: <a href="http://www.spatium-magazin.de/arno-pro-–-unterschiedliche-an-und-abfuhrungszeichen/1778.php" rel="nofollow">Arno Pro – unterschiedliche An- und Abführungszeichen</a>.<br>
      F</p>
