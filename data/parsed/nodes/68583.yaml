    <p>Hi,</p>
    <p>I would like to know what you think and what I should do.</p>
    <p>I bought the font "Arno Pro" from Adobe (Designer is Robert Slimbach). And I think, that the german quotes are wrong (see the attachment). What do you think?</p>
    <p>I wrote to Adobe Support, an they said, they can see only a little discrepance and they think everything is fine. I wrote back, that I don´t think this is right - I´m waiting for the answer since almost 2 months! I didn´t find the "type department" by Adobe, so I couldn´t ask them. </p>
    <p>Thanks for support.<br>
    Greetings<br>
    Florian</p>
