      <p>Florian G., I'm sorry that you got that response from Adobe Support. That's certainly not the answer that the Type department would give you, since we're aware of the bug and have fixed it already in version 1.012 (dated 8 December 2008) as you can read on the <a class="freelinking external" href="http://store1.adobe.com/type/browser/html/readmes/ArnoProReadMe.html" rel="nofollow">font's Release Notes</a>.</p>
      <p>Since you licensed the fonts 3 months ago, I don't understand why you got an old version, but I'll try to find out. Meanwhile, I'll contact you directly to resolve your problem. Sorry again for the inconvenience.</p>
