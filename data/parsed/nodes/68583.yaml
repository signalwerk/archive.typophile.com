    html: |-
      <p>@ Peter</p>
      <p>Although the bug was fixed after ten months, the reason might be, that the bug lately was reported. And if somebody does not reply, this does not necessarily mean, that you are ignored. In this case I simply would ask a second time. I never had such a request to Adobe, but somehow I doubt, that they intentionally ignore their customers. At least this does not coincide with my notion of Adobe. (But I admit, that I am an Adobe junkie, since they have got me hooked on Photoshop 5.) And in contradiction to most if not all other foundries, Adobe publishes release notes of their fonts, which is commendable. Additionally there are a few people active on this forum, that work for Adobe and that probably recognize bug reports, if they are posted here.</p>
      <p>But generally I agree with you with regard to update information: Licensees should be informed per mail, if a font is updated.</p>
      <p>Edited: I just see, that someone wrote, that the bug was reported 15 months before the fix. This would be definetely too long, especially because it was a heavy bug in my opinion.</p>
