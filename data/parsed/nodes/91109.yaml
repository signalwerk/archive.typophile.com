    <p>Here's a thought, as we're all molding our letters with copy &amp; paste. What if you drew one alphabet, avoiding the use of copy &amp; paste—just judging by eye. Then take a some letters, maybe <em>d, i, Q,</em> and <em>E</em>*, and redraw the rest of the alphabet. Probably halfway through, remove your DNA letters, and redrew those too. Do it a few times, maybe with different letters for DNA. I wonder what you'd come up with.</p>
    <p>I would assume you would get a few alphabets look, without close examination, much the same. But if these different sets of letters were substituted and interspersed throughout the text would create a lively underdone, or perhaps bring back some of the flavor missing from the days when letters were things, not pictures, or bezier representations of things.</p>
    <p>Thoughts? :)</p>
    <p>* There is no perfect set of DNA letters. I chose <em>d</em> because you have your ascender, its serif, a bowl, and the bottom-right terminal that is usually shared with <em>u</em> and <em>a</em>; <em>i</em> because you get a dot, x-height serif, and baseline serif; <em>Q</em>because it is round, and also has a tail; <em>E</em> because it has just about all uppercase serifs in one glyph.</p>
    <p><img src="http://21326.info/work/alpine/a.png"><br>
    <em>Not really a great example of what I'm talking about, but it's towards the idea. (And what ever happened to the scrolling images?)</em></p>
