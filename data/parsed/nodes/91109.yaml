      <p>How many words is it possible to see in a fixation? Isn't the average around 2-3 words, with good readers able to take in up to around 5? That's quite a block to optimize for.</p>
      <p>Do you have more info on LettError's scheme?</p>
      <p>In any case, I'm making a script to count glyph pair occurrence in a given document (actually, it's almost done). It would take little effort to make it count trios, or larger groups. With little modification, I could count occurrence of glyph pairs near one another. For example, how often e occurs next to i with three glyphs between.</p>
