      <p>You’d also have to factor in the most noticeable opportunities for divergence—i.e. those letters which appear most often next to, or close to, each other.</p>
      <p>With that in mind, I developed a pseudo-random feature that requires only one alternate.<br>
      The theory is that because there are virtually no instances in which a letter appears three times in a row, two letters may be coded so that the closest they appear is separated by four letters, far enough apart to not be present simultaneously in the fovea, which is the only circumstance in which artifacts are detectable in ﬂuent reading.</p>
      <p><a href="http://ilovetypography.com/2011/04/01/engaging-contextuality/" title="http://ilovetypography.com/2011/04/01/engaging-contextuality/">http://ilovetypography.com/2011/04/01/engaging-contextuality/</a><br>
      (Discussing Fontesque Pro.)</p>
