      <blockquote><p>I'm sorry, why exactly are we doing this?</p></blockquote>
      <ol>
      <li>Because it's interesting. What if you made the same font twice—what would be different?</li>
      <li>To make text 'livelier', by making slightly different versions of each glyph. In a way emulate artifacts of older methods of printing.</li>

      <p>I've thought this out, though, and that it may make more sense to make alternates based on <a href="https://en.wikipedia.org/wiki/Letter_frequency" rel="nofollow">letter frequency</a>. The glyphs that are used more often are the ones that "need" more alternates. A piece of type that is used more gets worn more. Or, has more sorts made.</p>
      <p>Does it seem like a pointless idea?</p>
      </ol>
