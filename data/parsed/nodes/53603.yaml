    <p>I have a project and I would like to get it right ... I need your help.<br>
    The logo uses Edwardian Script ITC<br>
    I used Adobe Garamond Pro for a headline and it looks (goes together) okay but I would like to know if there is a better go-together?  Continuing with Edwardian Script ITC doesn't seem like a good idea (too fancy).</p>
    <p>Also, for website copy, I need to select a default, would you use Verdana or ?</p>
    <p>Your guidance will be appreciated.<br>
    LinK</p>
