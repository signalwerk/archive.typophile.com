      <p><cite>Just wondering ... from your professional viewpoint is there no such thing as “font go-togethers?”</cite></p>
      <p>In display settings, yes. When setting inline text one can always mix types in ways that distracts or detracts from the copy, which can be a problem, but otherwise just go for broke.</p>
