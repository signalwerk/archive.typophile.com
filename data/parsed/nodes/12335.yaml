    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Foundries" class="freelinking" rel="nofollow">Foundries</a> : International House of Fonts (IHOF)</strong></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/images_6385.jpeg"></div><p></p>
    <p><strong>International House of Fonts</strong> is a division of <a href="/wiki/P22" class="freelinking" rel="nofollow"> P22 Type Foundry</a> which showcases distinctive type designs and designers from around the world. Operating as a download-only type boutique, IHOF is proud to offer such fine faces as <a href="http://www.p22.com/ihof/dearest.html" rel="nofollow">P22 Dearest</a> (which is consistently on the <a href="http://www.myfonts.com/bestsellers.html" rel="nofollow">Best Sellers</a> list at <a href="/wiki/MyFonts" class="freelinking" rel="nofollow">MyFonts</a>), <a href="http://www.p22.com/ihof/operinaset.html" rel="nofollow">P22 Operina</a> and many other fine faces. If you are considering releasing one of your own type designs or are looking to license some fresh type, check out IHOF.</p>
    <p>website: <a href="http://www.p22.com/ihof/" rel="nofollow">International House of Fonts</a></p>
