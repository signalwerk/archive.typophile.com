    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Software" class="freelinking" rel="nofollow">Software</a> : <a href="/wiki/Font%20Management%20Software" class="freelinking" rel="nofollow">Font Management Software</a> : Linotype FontExplorer X</strong></p>
    <p><a href="/wiki/Linotype" class="freelinking" rel="nofollow">Linotype's</a> FontExplorer X (FEX) is a free font management tool, which includes an integrated font store. Users of FEX may purchase fonts via this store if they so choose (unlike traditional internet font shopping, fonts purchased via FEX will be directly installed in the font manager, for easier activation and deactivation).</p>
    <p>As of this writing (April 11, 2006), FontExplorer X is currently available just for MacOS X 10.3.9 and higher. A PC version is in the works.</p>
    <p>The Font Store within FontExplorer X (April 11, 2006) only contains <a href="/wiki/Linotype" class="freelinking" rel="nofollow">Linotype</a> fonts. However, <a href="/wiki/Linotype" class="freelinking" rel="nofollow">Linotype</a> is currently making agreements with many third party foundries, so that their fonts will soon appear in the store as well.</p>
    <p><strong><em>Nota Bene</em></strong><br>
    During the late 1990s, <a href="/wiki/Linotype" class="freelinking" rel="nofollow">Linotype</a> created a product called the <a href="/wiki/FontExplorer" class="freelinking" rel="nofollow">FontExplorer</a>, which was a catalog plus CD. On the CD, customers could sift through Linotype's font library by using subjective keywords and descriptive terms. FontExplorer was and is an aide for those looking to find specific fonts. In 2004, <a href="/wiki/Linotype" class="freelinking" rel="nofollow">Linotype</a> placed the contents of the CD online for free download (c. 180 MB). By that time, over 1 million catalogs and CDs had been distributed.</p>
    <p><a href="/wiki/FontExplorer" class="freelinking" rel="nofollow">FontExplorer</a> and FontExplorer X are two different products that both aim to help font users find the right fonts for their needs.</p>
    <p><strong>Discussion:</strong><br>
    <a href="http://typophile.com/node/27616" rel="nofollow">Windows Version of FontExplorer X or alternative</a></p>
    <p><strong>External Links</strong><br>
    <a href="http://www.linotype.com/fontexplorerX.html" rel="nofollow">The iTunes of Font Management</a></p>
