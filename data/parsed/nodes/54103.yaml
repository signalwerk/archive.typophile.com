      <p>Your concept of the 'ripple through' problem is a great insight - I wonder if you think the ideas behind font synthesis tools like <a class="freelinking external link-external" href="http://download.adobe.com/pub/adobe/fontchameleon/discontinued.txt" rel="nofollow">Ares Font Chameleon would help? I saw [[http://www.thomasphinney.com/about/about-long-version/on your new blog you mentioned you held some software idea patents about "glyph synthesis"</a>. Are those patents published online anywhere? :-)</p>
      <p>Has anyone got access to Ares Font Chameleon and could post some screencasts? Or is (going to be) in Europe, as I'd love (to hang out and) see it in action :-)</p>
