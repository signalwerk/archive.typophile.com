      <p><cite>Since type design is a patient activity, I wonder if you could explain why you think the patience of working at a type design on your own is less frustrating/needing-patience than working collaboratively? :-)</cite></p>
      <p>I would venture that people who care enough about type design to put in the huge amount of time and effort are also more likely to seek creative control over their work. I don't know much about the free software community, but I suspect the contributors wouldn't be quite as hung up on maintaining their own creative vision.</p>
      <p>Earlier, you said you weren't convinced that type designs that have come about through decentralized, democratic collaboration would not work at all, as you haven't seen any examples. I'm not sure such designs can even exist, since competing creative visions will be hard to reconcile without central direction, and the result will hardly be coherent enough to stand as a typeface design.</p>
      <p>I'm still trying to understand how you picture this would work. Perhaps A designs some of the letters, B comes and contributes a couple, C comes and tweaks some of the existing letters done by A and B, D comes and fills out the remaining letters, A comes back and retweaks the letters... How would design consistency be maintained over this whole process when A, B, C, and D will have differing creative visions? Unless the collaboration process takes place at a different, well-defined level (i.e. someone designs the basic glyphs, another adds diacritics, yet another takes care of the naming and production), I just don't see a coherent typeface coming about as a result.</p>
      <p>Just so you understand, I would love to see a workable collaborative model for type design set up, as it would make type design more approachable for people who are intimidated by the prospect of taking on the entire process by themselves. I am just trying to point out how it might not work, as I'm not convinced the open software or Wikipedia models of collaboration will translate to the type design process.</p>
      <p>I see a modular approach as being necessary for successful collaboration. It could go like this:</p>
      <p>A designs the basic lowercase and uppercase alphabet.<br>
      B designs the numerals to harmonize with the alphabet.<br>
      C and D design punctuation and diacritics to fill out the basic character set.</p>
      <p>Throughout, the designers give each other feedback, but rather than freely editing one another's designs, allow the original designer to incorporate the others' suggestions in modifying his or her design. A sort of creative director over the entire project may come handy if there are disagreements over creative direction. Constant cooperation would be required just in order to maintain consistent spacing and design detail for the characters.</p>
      <p>Later on, teams consisting of the same members or new ones could add italics, different weights, expand into different writing systems, etc. using this modular approach.</p>
      <p>In practice, it would be more efficient were these modules to be combined where possible; it is easier to get a consistent result with a single designer working on all the glyphs of the basic character set rather than with multiple designers. But then people might be more willing to contribute if the workload is less. The trouble would be to determine which contributors are competent enough and to maintain a high standard of design throughout the modules. This doesn't look to be at all easy.</p>
