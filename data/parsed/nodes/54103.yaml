      <p>@Sii: Unpaid volunteers are involved at some levels of the effort to write the Linux kernel, yes. Off the top of your head, what would you guess the percentage is? :-) </p>
      <p>@Thomas Phinney: That's interesting details indeed about how the collaboration in Hypatia actually breaks down :-) I 100% agree with you that font development tools with collaboration-specific features are required - this is what I meant when I said "the design of the design process" earlier. </p>
