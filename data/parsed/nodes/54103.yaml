      <p>I would be inclined to agree with Dave in that type design has historically been a collaborative process. Isn't it only thanks to the Digital Age that a single individual can hope to create a whole typeface from start to finish? Even now, I most CJK typefaces are produced through collaboration, as they require thousands of glyphs.</p>
      <p>However, this needs to be a strictly controlled variety of collaboration. A single creative vision must be applied consistently throughout the design. This might be achieved by having a single individual make the creative decisions and leaving the rest to do mechanical work, or by having a small group of individuals closely discuss the creative decisions they make throughout the process. I believe the latter option describes many of the more recent collaborations, such as that for Meta Serif.</p>
      <p>I think Thomas Phinney might have just wanted to make the point that Linux-style decentralized, democratic collaboration would not work for type design.</p>
