      <p>@Sii: Sorry I seem to be giving you a hard time, that's certainly not my intention! :-) I agree with your 'strong man in charge' idea - free software projects work like that anyway, such as the Linux kernel and Linus Torvalds, or Python and Guido van Rossum, or the Ubuntu GNU/Linux distribution and Mark Shuttleworth.</p>
      <p>Although, I do think that this phrasing of the idea gives the wrong impression; the free software community uses the term 'package maintainer,' which implies a more accurate picture of consensus and harmony rather than conflict and force. </p>
      <p>And I agree this is academic and speculative topic, which is why I hoped to discuss examples of collaboration in some detail :-)</p>
      <p>My question about your guess at the ratio of paid to unpaid work in the Linux kernel relates to your point about type professionals not wanting to work as maintainers even if they were paid, which I don't understand, and hope you can clarify. </p>
      <p>I would have estimated it was 20%, but after spending the last while researching it, it seems <a class="freelinking external" href="http://lwn.net/Articles/222773/" rel="nofollow">its actually 10%.</a> So I think thats a good ballpark figure to suggest that a paid-up, collaborative, libre font project would involve "a group of amateurs or even professional volunteers ... involved at some level of the effort" - say, 10-20% of the effort. </p>
      <p>Since type design is a patient activity, I wonder if you could explain why you think the patience of working at a type design on your own is less frustrating/needing-patience than working collaboratively? :-) </p>
      <p>I would agree that the unsuitability of current font development tools means it is frustrating. But since I'm familiar with working collaboratively with plain-text tools, and that process isn't frustrating - though surely different to writing alone - I see no reason collaborative type design would require unreasonable levels of patience if the tools facilitated it. </p>
      <p>Since you say it would be extremely fun and entertaining to watch such projects develop,  do you agree that its the available tools that are the problem? Or is there something else inherent in the process of type design that I'm missing? </p>
      <p>I'm very much a beginner at type design, so I can't tell :-)</p>
