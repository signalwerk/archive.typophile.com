      <p>&gt;Since you say it would be extremely fun and entertaining to watch such projects develop, do you agree that its the available tools that are the problem? Or is there something else inherent in the process of type design that I’m missing?</p>
      <p>No I don’t think it’s a matter of tools. Managing large collaborative font development projects is hard for a variety of reasons, even when everyone involved is employed by a single company, with a clear spec, with set milestones and deliverables. I think adding the prospect of including many unpaid, part-time resources to such a  project would make it even more difficult, and unappealing, and somewhat outside the comfort zone of the people best suited to running such projects. </p>
      <p>One alternative option might be to have a trinity of strong-men run the project… “the father” an upstanding leader from the type world as the figurehead, “the son” the person who does all the actual co-ordination passing the work to the father to be blessed, and the “holy ghost” someone from the OSS world who can ensure all the OSS religious rites are adhered to.</p>
