      <p>Sii: I think you're making an assumption about the background for the question. This isn't the thread solely about open source fonts.  :)</p>
      <p>Dave regarding Hypatia Sans: To the best of my memory, With the exception of the "hook" accent for Vietnamese, for which Robert did the outlines, I did all the outline work, and all the sidebearings (but with a *lot* of verbal input from Robert on both). Miguel did a lot of work setting up scripts, revised my feature coding, did actual builds using scripts plus the AFDKO, and generally patrolled my work to make sure I didn't miss anything. Plus the "small matter" of kerning, which Robert and Miguel collaborated on and I pretty much didn't touch, except to suggest a couple of additional things that needed to be covered.</p>
      <p>Regarding the free-for-all development approach....</p>
      <p>I am not sure whether a single Wikipedia page is a good analogy for a font (or font family) either. Maybe a set of related pages? But in any case, speaking as somebody who does both writing and font work for money: I am pretty sure that an open free-for-all model is a crappy model for developing high-quality fonts; even though I enjoy participating in Wikipedia, I am pretty sure I would be frustrated by that same model for font development.</p>
      <p>One major problem with that model for fonts is that it's harder to judge the quality of an edit/contribution in just a few seconds, the way one can on Wikipedia. How do you "diff" the changes? If what has been changed is a sidebearing, you need to see it in context of other sidebearings. If it's an outline, you need to both see the previous outline *and* in many cases compare against other outlines.</p>
      <p>Then there's the ripple-through problem. If somebody changes the design of the cap "R" in the regular, it probably needs to be changed in all the other weights and the italics too... and maybe have kerning adjusted as well.</p>
      <p>I think it would be an interesting open-source project to devise a set of tools/scripts or what-not just to better *enable* type design collaboration by addressing those two issues.</p>
      <p>Cheers,</p>
      <p>T</p>
