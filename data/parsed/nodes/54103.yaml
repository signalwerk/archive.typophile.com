      <p>I hope that my later comments made it clear that what I think is that with more people working on a typeface, more structure and central vision is needed. Type design and production is poorly suited to a free-for-all approach like wikipedia. I do think one *could* have a bunch of people collaborate to make something that is ultimately released in FOSS form, and have it be really well done.</p>
      <p>My own Hypatia Sans had kerning done by Robert Slimbach and Miguel Sousa, major production assistance from Miguel, and is going to have the finishing touches on the italics, plus some character set expansion, from Paul Hunt.</p>
      <p>Cheers,</p>
      <p>T</p>
