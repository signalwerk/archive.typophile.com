    <p>I had a discussion mainly with John Hudson about the potential for collaboration in the type design process over on the technical OpenType mailing list a while ago, and promised to bring up the subject here on Typophile, and then became busy with other things.... But I was reminded of this when Thomas Phinney <a class="freelinking external" href="http://typophile.com/node/53444#comment-322796" rel="nofollow">recently wrote</a>: </p>
    <p><em>"As noted previously, one key difference between Linux and a typeface in an open source perspective is that the latter can benefit from contributions from lots of people, and the former will not work if too many people are working on it."</em></p>
    <p>I'm not sure this is true, because I've not yet heard of anyone trying to do a collaborative type design process with many people involved, and failing. </p>
    <p>Still, I'd be very interested to here people's good and bad examples of collaboration in the type design process at any scale. </p>
    <p>Most type designers who work as individuals seem to collaborate with a font developer on the actual production of the final files that users have on their computers, and small foundries seem to share both the design and production around a bit between their overall group. </p>
    <p>Has anyone had a great internship doing the "unglamourous" work of 'filling out' character sets? </p>
    <p>Or mentored an "appentice" in that way? :-)</p>
    <p>I would guess that, before the MA courses that are now so popular, this was the way that most people learned digital type design...?</p>
    <p>Best,<br>
    Dave</p>
