      <p>@Thomas Phinney: Thanks for the detail about Hypatia; I like the design :-) When you say Miguel did major production assistance, did he collaborate on the design of the outlines? And could you clarify if when you say kerning you mean only kerning, or the generic metrics too? :-)</p>
      <p>And I must apologise if you feel quoted out of context; thanks for your clarification and encouragement - I was happy to see that you're open to consulting on these kinds of projects, and I hope one day a "Free Font Foundation" might be able to take people up on that kind of offer :-)</p>
      <p><em>Type design and production is poorly suited to a free-for-all approach like wikipedia.</em></p>
      <p>Since wikipedia is a collection of many pages, like the open font library is a collection of many fonts, IMO a better comparison is between a type design and a wikipedia page. </p>
      <p>Wikipedia pages tend to have maintainers who patrol for poor quality additions, and trim them out. This means sometimes people come across pages before they are trimmed, and end up writing in their newspaper that <a class="freelinking external" href="http://www.guardian.co.uk/media/mediamonkeyblog/2008/sep/23/mirror.digitalmedia" rel="nofollow">"This football club wears hats of old shoes"</a> ;-)</p>
      <p>Free programs are not developed "live" like this, though. A free program has a life cycle from an cutting edge, experimental sideline source code version, to a "mainline" source code version, to an experimental "alpha" pre-compiled binary version, to a testing "beta" binary version, to a stable "release" binary version, to being obsolete. </p>
      <p>With Wikipedia pages, there is only the cutting edge version, and this is why the Wikimedia Foundation has discussed publishing a 'stable' version akin to the way free programs are released.</p>
      <p>For programs, the life cycle before the pre-compiled binary versions is not linear like the part that follows, though: Wikipedia's is faily simple - no 2 people can edit the same page at the same time, for example. </p>
      <p>But with distributed version control, there is an official/golden/master or 'trunk' copy of the source code, and each developer makes a complete copy of this, a 'branch.' They change their branch however they want to, and then they publish the branch for others to compare with the trunk. Another developer might maintain a branch that collates a number of different, non-overlapping branches with some theme. The maintainers of the master copy can choose to integrate any set of branches as they like. </p>
      <p>If someone makes changes that aren't accepted into the 'trunk,' they are already publishing their own version. So if the maintainers misjudged it, and that version is actually more useful for people, its already available, and so it comes into use quickly - and likely causes the maintainers to re-evaluate it. </p>
      <p>To make this visual, <a href="http://oandrieu.nerim.net/monotone-viz/Screenshot-git-viz.png" title="http://oandrieu.nerim.net/monotone-viz/Screenshot-git-viz.png">http://oandrieu.nerim.net/monotone-viz/Screenshot-git-viz.png</a> shows two branches, the column on the left being the 'master' trunk, the right side col being the 'experimental' branch, and the trunk twice merging in the branch, that continues to develop in parallel. </p>
      <p>This is how Sii's comment about a maintainer who "passes judgment" works in practice. </p>
      <p>@Sii: Yes, people whose business models depend on the source code being secret probably won't participate. But people with business models that depend on source code being public probably will. I certainly hope that when those business models are proven, we'll see people change from one way of doing business to another :-)</p>
