    html: |-
      <p>A heuristic that could potentially work would be:<br>
      1) Get the hyphen points for a word. e.g.  auf-lauf tref-fen<br>
      2) For each hyphen point, see if the letters before the break &amp; the letters after the break constitute legal words (the spelling dictionary would be used here). e.g. 'auf'+'lauf', 'tref'+'fen<br>
      3) If both parts are legal words, then assume that there shouldn't be a ligature there.</p>
      <p>This might be an example of the cure being worse than the disease...</p>
