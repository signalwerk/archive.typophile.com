    html: |-
      <p>There is a clear distinction in InDesign betweeen <em>Ligatures</em>, which is on by default, and <em>Discretionary Ligatures</em>, which is off by default.</p>
      <p>Therefore it behooves German editors to be aware of the opportunity for confusion, and to mark words such as "auflauf" to the effect of "No Ligatures", as the f ligatures are generally included as basic Ligatures, not Discretionary. Writers could pre-empt the situation, as Eric notes, with a "non-joiner".</p>
      <p>By the same token, type designers should make a clear distinction between their "f" ligatures and non-ligated "f" combinations, which should be designed and kerned to not overlap.</p>
