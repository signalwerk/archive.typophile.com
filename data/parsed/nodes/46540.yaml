      <p>The technical possibilities aside, the fact remains that there are type faces, which are incompatible with the rules for ligature use in some languages (German in this case). </p>
      <p>I would argue, that this incompatibility does only exist in type face that are designed in a way where ligatures imply too strong a connection of the individual characters they are representing. After all, there is no implied semantic in a standard ligature related to the word of which it is a part. Thus, if we accept what is implied by this rule, namely that ligatures that connect characters very strongly imply additional semantic, this would mean that such type face, as beautiful as they may be (e.g. Garamond) are in some way flawed. At least if you follow the reasoning behind the German ligature rules.</p>
      <p>Of course, typography like language is part of cultural development and thus is is perfectly acceptable that typographers of different languages arrived at different conclusions concerning the question of how much semantic a standard ligature carries. It would also very much depend on the type-faces they looked at in order to form that conclusion. Nevertheless, now that typography is a much more globalized thing, it may indeed be time to re-evaluate such conclusions. </p>
      <p>If you accept that a ligature implies semantic relationship, you can also find english examples that may be a problem. Examples I could come up with in short time are "elflike" and "selfless" (in Garamond Premiere):</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/liga_5602.jpg"></div><p></p>
      <p>Thus whenever a type face's ligatures make german "auflegen" "au flegen" or "aufl egen" they also make "selfless" into "sel fless" or "selfl ess". Thus, you would have to conclude that such a type face isn't fully usable in either language.</p>
      <p>I personally think the people that made the typefaces had a better understanding of how the characters and ligatures are perceived than the people that came up with the rules for ligature use (this is an assumption). Hence if in doubt, I'd rather trust the type.</p>
