      <p>Michel, I’m afraid it’s not as easy as that.<br>
      You don’t use a ligature across <em>morpheme</em> borders.</p>
      <p>In a word like ‘treffen’ [to meet, to hit], you are allowed to hyphenate between the ‘f’s, but there may be a ligature, too.<br>
