      <p>Andreas said: <cite>The problem of no dictionary support for ligatures in German language leads to the strategy of avoiding the usage of ligatures at all.</cite></p>
      <p>To speak from my experience, I think the opposite is true: fl/fi ligatures are switched on by default (in InDesign, that is). And people are lazy. Therefore, most of the time we’ll end up with ligatures for <em>all</em> instances, whether correct or not.</p>
      <p>Ralf said: <cite>Most Germans would read “Au-flauf” if you set it with a ligature.</cite><br>
      I’m skeptic. Yes, it’s a problem. And yes, it’s not very nice. On the other hand, people are not stupid machines. I’ve read texts with incorrect ligatures without having serious difficulties. Admittedly, sometimes I get stuck. But I <em>always</em> get stuck and have to read the line again when the typesetter wanted to do it overly correct and added (too much) extra white-space, like in Lars’ example #3.</p>
      <p>The solution is having a ‘short f’, be it by default or as an alternate.</p>
      <p>And: there will always be ambiguous words, like be-inhalten [to contain] — bein-halten [to hold a leg], or the notorious Röſchenhof—Röschenhof. Or would you use a diaeresis for ‘beïnhalten’ and a long s for the latter? ;-)<br>
      F</p>
