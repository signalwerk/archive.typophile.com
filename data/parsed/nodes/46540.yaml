      <p>In the daily business (magazines and dailies), no writer have the time to include non-joiners or to make special selections for ligatures. They work with pre defined styles at best. So the ligature feature is set by default to off by the informed "design" head. So its true, you can divide German publications into two main categories.</p>
      <p>1. no ligatures used at all<br>
      2. the lazy bones - ligatures used, right or wrong</p>
      <p>And some publishers use fonts with wrong* designed f base glyphs, what joins with most diacritics of the next letter. </p>
      <p>*wrong in the case the font is used for languages with lots of diacritics</p>
