      <p>The worst typographic (actually: type design) sin I know and hate is, when the basic design of the font has a narrow f <em>per se</em> that would not collide with either i or l, and type designers fill the MacRoman's fi/fl ligature slots with connected glyphs. ACK!</p>
      <p>This is a perversion of the idea of ligatures where collision is remodelled. Here, naturally, if you don't want to leave the encoding slot empty, just use a glyph composite of f and i, as if they would follow each other when set normally.</p>
      <p>These forcedly connected f-i ligatures have usually an upper arc of the f which is -naturally- way to wide for the design idea of the whole alphabet and strikes the eye immediately. An other mistake is, though this happens with "legitimate" ligatures as well is when the stems of the f and the i the ligature do not fit the overall rythm of the font.</p>
      <p>Szabolcs</p>
