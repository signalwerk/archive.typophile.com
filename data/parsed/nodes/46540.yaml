      <p>Thanks Ralf,. The discussion in the thread you pointed to was quite interesting.</p>
      <p>My personal conclusion would be that the rule should be considered in the context of the type face to which it is being applied. There will be cases where the rule works just fine and where an adjustment of spacing yields good results. In other cases, not using ligatures may produce really ugly collisions (and thus negatively impact legibility) and (or) adjusted spacing may produce large gaps  (which again would deter legibility). In such cases I'd say using the ligature and breaking the rule (or guideline) might be the lesser evil.</p>
