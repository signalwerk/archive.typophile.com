      <p>Andreas,<br>
      I agree that avoiding ligatures completely could be an unfortunate consequence of not having the correct ligatures for German in the first place. There were multiple issues that prevented us from just "doing it right" for German, including:<br>
      - Complexities around determining the correct solution for script faces or faces with many ligatures. Would some ligatures be considered part of the design and be wrong if disabled?<br>
      - Lack of dictionary support. We don't have data to work from.</p>
      <p>However, I think that maybe some mechanism similar to adding custom words or custom hyphenation points to the user dictionaries could be considered here. </p>
      <p>In the mean time, you can insert a <em>"non-joiner"</em> (<code>U+200C</code>) between components. Not a great solution, but you can use find change and replace "<code>auflage</code>" with "<code>auf^jlage</code>" in this particular example. Menu: Type &gt; Insert Special Character &gt; Other.</p>
