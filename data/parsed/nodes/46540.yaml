      <p><cite>This looks best but "they" say it's wrong.</cite></p>
      <p>It not about looks! It's about reading. Most Germans would read "Au-flauf" if you set it with a ligature.<br>
      You are right, there are typefaces which create a huge gap if you don't use the ligature. But that doesn't change the rules. From the standpoint of the type designer it would be a good idea to include a language-specific fl-glyph or even better: a contextual (shorter) f. </p>
      <p>Since your German you might also checkout this discussion:<br>
      <a href="http://www.typografie.info/typoforum/viewtopic.php?f=1&amp;t=3050" title="http://www.typografie.info/typoforum/viewtopic.php?f=1&amp;t=3050">http://www.typografie.info/typoforum/viewtopic.php?f=1&amp;t=3050</a></p>
