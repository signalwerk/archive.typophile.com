    html: |-
      <p>I'm confused about your assignment. Are you designing a logo to be stamped onto pills and capsules? They don't put logos on those, they just put identification codes.</p>
      <p>On the other hand, if you're designing a logo for marketing purposes (to be put on a label or in an an advertisement) I don't know why you'd pick a utilitarian stencil font. The fact that it somewhat resembles the codes stamped on pills seems totally irrelevant to me.  The codes on pills are so tiny that most folks can barely read them anyway, and they certainly aren't designed to convey anything about the product except factual data.</p>
      <p>The whole point of a placebo is to fool the patient into thinking they're getting real medicine, rather than a sugar pill, so you'd want a logo that looked very similar to traditional prescription logos.</p>
