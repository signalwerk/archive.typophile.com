    <p>Hello there , I'm a design student currently working on a project in which I am aiming to create a logo type for placebo medication.<br>
    I have hit a wall and would like feedback to help me develop my designs.<br>
    I am currently working on a stencil logo type<br>
    based on the rounded type that is stamped onto pills &amp; capsules (see ref1)<br>
    I started with quite a light typeface made of two sections ( to represent the pyschological &amp; physiological aspects of medicine that work together ) </p>
    <p>My tutor suggested to thicken it up , using the omnipresent helvetica as a reference.<br>
    i've tried this but now it just looks (for want of a better phrase) ' sausage-y '<br>
    illegible would probably be a more relevant phrase to use, but i'm sure you will understand.</p>
    <p>any help or suggestions for further development would be greatly appreciated, thanks</p>
