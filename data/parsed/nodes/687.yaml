    html: "<p>I think there are two reasons: <br>1) It combines femininity with what Bilak calls \"synthetic construction\". This is a very rare combination in type (usually feminine faces are very chirographic), and novelty is an important force in marketing. One could also add that femininity in society in general has been on the decline, and is now missed. <br>2) There was a massive core of Emigre lovers who wanted desperately to set a lot of text in an Emigre face. With Mrs Eaves they could finally do it! Except they didn't know enough about the importance of tight/regular spacing to readabilty... <br> <br>hhp <br></p>"
    html_clean: "<p>I think there are two reasons: <br>1) It combines femininity with what Bilak calls \"synthetic construction\". This is a very rare combination in type (usually feminine faces are very chirographic), and novelty is an important force in marketing. One could also add that femininity in society in general has been on the decline, and is now missed. <br>2) There was a massive core of Emigre lovers who wanted desperately to set a lot of text in an Emigre face. With Mrs Eaves they could finally do it! Except they didn't know enough about the importance of tight/regular spacing to readabilty... <br> <br>hhp <br></p>"
