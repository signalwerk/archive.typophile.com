  html: <p>So as not to hijack Ralf's thread, I decided to start a new one. <br> <br>I'd like to know everyone's impressions on why Mrs. Eaves has become such a very popular font in such a short time and whether or not it maybe just a temporary phase. <br> <br>Personally, I think the charm of Mrs. Eaves is the fact that it looks modern, but has such a wonderful antique feel to it.  Combined with the extra ligatures and it's lovely italic, Mrs. Eaves can be quite whimsical without being very "scripty" or novelty. <br> <br>I'd like to think that it will be around for a long time, though I'm not sure if it will ever take a place alongside the big classics such as Garamond and Caslon.</p>
  html_clean: <p>So as not to hijack Ralf's thread, I decided to start a new one. <br> <br>I'd like to know everyone's impressions on why Mrs. Eaves has become such a very popular font in such a short time and whether or not it maybe just a temporary phase. <br> <br>Personally, I think the charm of Mrs. Eaves is the fact that it looks modern, but has such a wonderful antique feel to it.  Combined with the extra ligatures and it's lovely italic, Mrs. Eaves can be quite whimsical without being very "scripty" or novelty. <br> <br>I'd like to think that it will be around for a long time, though I'm not sure if it will ever take a place alongside the big classics such as Garamond and Caslon.</p>
