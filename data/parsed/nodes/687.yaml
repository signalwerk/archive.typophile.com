    html: <p>Mrs. Eaves can be condensed a bit to make up for the wideness of it. Not a lot mind you, but it can be. I just wish the serifs were a little smaller or shorter. <br> <br>The way I see it, if a typeface is poorly spaced, but fits the bill for your needs, you shouldn't shy away from the challenge of using it. I do have some personal opinions about Mrs. Eaves, but even still I use it because it is unique and it does stand out. But, I don't use it when I need a crystal goblet.</p>
