    html: <p>I've mainly seen Mrs Eaves used quite large, most strangely in information panels at the Doge's Palace in Venice. The spacing is loose, but it is also a strangely wide face, so the spacing is not as bad as it might be for a narrower face, but I still would be inclined to respace it and add more kerning pairs if I ever had occasion to use the face. <br> <br>Bilak is <a href="http://www.typotheque.com/">Peter Bilak</a>, who gave my second favourite presentation at TypeCon.</p>
