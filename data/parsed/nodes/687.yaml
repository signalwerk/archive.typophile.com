    html: <p>I think you're being a bit harsh. I mean, <i>ITC Garamond</i>?!  :-) <br> <br>&gt; the finer details of the relationship between the x-height and the ascenders and so forth <br> <br>The problem with Mrs Eaves isn't just that the spacing is messy (with only 40-something kerning pairs to patch things up) it's that its overall loose spacing goes against all its other parameters, like the tiny x-height, and the lightish color. You can't use it small, and you can't use it large. Except if you throw InDesign's optical spacing on it, in which case you can use it for about 14-24 point. <br> <br>Robin Kinross has equated Mrs Eaves with a loose bicycle. I wouldn't ride it myself, but at least it's very pretty. <br> <br>hhp <br></p>
