    html: <p>Mrs. Eaves may be be chique, fancy, fresh, charming, cool, "feminine", beautiful etc etc. <br> <br>But it has rarely anything to do with good typography. It is superficial, shallow and, in short, an abomination. <br> <br>It is a failure of ITC Garamond proportions. <br> <br>Use it as you wish.  <br>It may bring you luck, it might even bring you typographical insight, but do not set any amount of text over ten syllables. <br> <br>I'll leave it to the good people of Typophile to explain the finer details of the relationship between the x-height and the ascenders and so forth, while I, in desperate need for more nuance, go and polish my english typographical vocabulary. <br> <br>Next time I'll post as a registered member. Promise. <br> <br></p>
