    <p></p><div class="imageWrap"><img src="http://typophile.com/files/obys_5437.jpg"></div><p></p>
    <p>The Drudge Report is suggesting that Obama's VP will be Bayh based on a bumper sticker. But the sticker does not to me seem to be using Gotham and Requiem--and Obama's known for his incredibly consistent brand (just look at his personal jet, styled in Gotham). I can't quite ID them--it doesn't seem like Requiem or Perpetua for the serif, though it may be Trajan, and the sans didn't appear to be Gotham, Gill Sans, or Antique Olive.</p>
    <p>Anyone have any ideas/think this bumper sticker is bogus?</p>
