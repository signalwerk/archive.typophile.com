    <p><img src="http://cdn.theatlantic.com/newsroom/img/posts/IMG_5296.jpeg"></p>
    <p>“At 35 feet wide by 8.5 feet tall, this three-dimensional mural designed by CBS design director Lou Dorfsman and the typographic maestros Herb Lubalin and Tom Carnase took over one entire cafeteria wall of Eero Saarinen’s Black Rock, the CBS Building on Sixth Avenue between 52nd and 53rd Streets. Dorfsman considered this massive frieze of custom-milled woodtype spelling out foods and food groups—from lamb chops to hasenpfeffer—his magnum opus, his gift to the world.”</p>
