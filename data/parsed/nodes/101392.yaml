      <p>&gt; how have you handled countries with multiple official scripts and/or languages?</p>
      <p>By choosing the most used one from the list of official languages (according to Wiki and other sources), or, in case of a tie, the one in which the name looked most interesting. It was not exact science, I admit, but most of the times the choice was quite clear.</p>
