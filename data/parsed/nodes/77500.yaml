      <p>IMO architects' taste in typography is anything but contemporary.<br>
      They seem to be stuck in the modernist vein, and these examples are conservative like that, traditional modernist identities.</p>
      <p>My parents were architects, and used a lot of Clarendon (Letraset) back in the day.<br>
      I made a Christmas card, a painting plus words in Letraset Clarendon, c. 1960.<br>
      Sorry, Catalonia, that's retro.</p>
      <p>Not quite sure what the box kite has to do with Cooper Union.<br>
      Yeah, isometric perspective as optical illusion, we get it -- a cliché/meme used in the Harvard logo too, more about the graphic designer's take on architectural design than communicating a business/institution to its audience.</p>
