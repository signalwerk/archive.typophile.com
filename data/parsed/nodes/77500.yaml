      <p><em>...what about something rooted in tradition like DIN Next or Avenir, or something slabby like PMN Caecilia or Lubalin Graph (which always reminds me of architectural drawings)?</em></p>
      <p>Why does architecture still need to be evoked by referencing the simplest of mechanically drafted shapes, those made with compasses and ruler? How very masonic! Or is it some kind of de Stijl thing? (Architects were not averse to using oval templates and French curves, not to mention quadratic equations to support domes.)</p>
      <p>Strange, after such iconic progressive 20th century buildings as the Ronchamps chapel and the Sydney Opera House, and any number of polymorphic Autocaded blobs by Gehry and Foster. </p>
      <p>Claire, rather than going on your client's typographic suggestions (WTF do they  know? -- didn't they hire a designer to make those decisions!), get your type cues from their work.</p>
