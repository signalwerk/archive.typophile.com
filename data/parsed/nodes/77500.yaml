    <p>Holy molly, it's Christmas.</p>
    <p>I just received a brief from a new client; architectural group. They need a logo, letterhead, envelope, flayer, postcard, poster...for some reason they mentioned the font "Calibri or designer choice" in the brief, they also have included some logos that I guess they like(see the attached file).</p>
    <p><img src="http://i51.tinypic.com/2s7gbpt.gif"></p>
    <p>Are there any font's that you would recommend or some sites for inspiration.</p>
    <p>Thank you!</p>
