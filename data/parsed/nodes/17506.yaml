    <p>I remember seeing a sans-serif version of <a href="http://www.myfonts.com/fonts/bitstream/libra/" rel="nofollow">Libra</a>, designed by de Roos as a sorta modern version of the uncial. I'm wondering if anybody can remind me what that face is called, and tell me if there's a digital version of it available.</p>
    <p>thanks...</p>
