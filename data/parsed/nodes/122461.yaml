    <p>Hello. I'm new here- I fall in as one of those guys who's read articles occasionally the past few years and is finally posting.</p>
    <p>I'm fairly new to typography- finishing up my undergrad at the moment, and I'm having trouble learning about type on screen. I have a lot of questions, and was wondering if there are any books or articles on the subject that are worth their salt.</p>
    <p>To be specific, I'm working on a magazine which will be released digitally, and potentially in print down the road. I'm trying to find an appropriate typeface for the body copy, but I'm beginning to see that my current methods of selection is a bit… young. Aesthetics aside at this point, where would you start if you were trying to find something intended to work well on screen? Is there a difference between type to be read on a desktop computer and type to be read on a tablet/phone?</p>
    <p>All the best,<br>
    ~Jordan</p>
