      <p>"Aesthetics aside …"</p>
      <p>Noooo! Aesthetics not aside! The display technology is finally mature enough that decisions about type on screen do not need to start by taking into account the weaknesses of the technology. Start by identifying a style or tone that you're looking for, as you would when designing in any other medium. Start, in other words, with the ideal. Then worry about making it work on screen.</p>
      <p>And to answer your second question — yes, the resolution on phones and tablets is typically higher than on computers, which is nice. But computers are catching up.</p>
