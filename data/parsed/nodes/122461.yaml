      <p>I would start with <a class="freelinking external" href="http://www.fontbureau.com/ReadingEdge/" rel="nofollow">Font Bureau's Reading Edge series of fonts</a> and/or <a class="freelinking external" href="http://www.monotype.com/etext/" rel="nofollow">Monotype's eText series of fonts</a>.</p>
      <p>You could also check out <a class="freelinking external" href="http://typeonscreen.info/" rel="nofollow">Ellen Lupton's Type On Screen website</a>, which also provides links to purchase the associated book.</p>
