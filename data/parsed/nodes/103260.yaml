  - id: 555378
    user: 8664
    date: 2013-05-27T03:38:00
    date_raw: 27 May 2013 — 3:38am
    votes: null
    html: |-
      <p>Steve Marston: <em>I still think style linking R/I/B/BI should be a given, regardless of how many fonts in a family.</em></p>
      <p>Thomas Phinney: <em>And that is going to be a pretty common POV. Despite seeing the technical and logical arguments otherwise, I lean that way myself.</em></p>
      <p>The key is consistency. Which is hard to achieve with bigger families.<br>
      Linking R/I but not R/B and I/BI is the easiest way to achieve consistency across the entire family: Touch the I button, but never the B button.<br>
      If you try to meet Windows users' R/I/B/BI-linking expectiation, with bigger families, you end up with solutions guided either by two guiding principles rather than one, or one guiding principle with exception(s):<br>
      Either you style-link only these fully. Other style would only be I-linked but not B-linked. Cf Monotype. Being able to use the B button with the Regular weight, however, it is too tempting for a user to do the same with other weights too – anticipating consistent behavior (with the Regular-related R/I/B/BI is considered the model).<br>
      Or you style-link everything the R/I/B/BI way. Bold would be B to Regular, Medium would be B to Light, or Extrabold would be B to Medium, etc. Cf Adobe. Try this with a really big family! It works properly only with rather small big families, and usually you end up with one or two left-over weights for which there is no B. See either.</p>
      <p>In short, the Regular-related R/I/B/BI linking is indeed easily explained. The tricky part is all the other weights that in a bigger family may, by their number, outweight R &amp; B. Do you define consistency based on the tiny R/I/B/BI part, or do you define it based on all other weights?</p>
      <p>That said, a foundry should indicate whether their families' members are style-linked or not, or at least do so when being asked about it.</p>
    html_clean: |-
