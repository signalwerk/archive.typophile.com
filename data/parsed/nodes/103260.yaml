      <blockquote><p>paying for fonts does not necessarily help</p></blockquote>
      <p>Not necessarily, but generally it does. One direct and practical way it helps is that a designer would usually rather fix (or even customize) a font than issue a refund and/or get embarrassed in public. Free fonts naturally have a sort of "as-is" clause, and complaining is almost comical.</p>
      <p>Here's a recent example: <a href="http://typophile.com/node/103134" title="http://typophile.com/node/103134">http://typophile.com/node/103134</a><br>
      People have been complaining about the defective "2" in Bebas Neue for over two years. It's a one-minute fix. But it ain't gonna happen.</p>
      <p>That said, I certainly agree that paid fonts should adhere to higher standards than free fonts. And/but most of them do. The ones that don't end up slowly killing their makers.</p>
      <blockquote><p>there's no good way to find out what you're getting before you actually buy a font.</p></blockquote>
      <p>Sure there is: ask the designer (and not the seller). On the other hand it <em>would</em> be nice to [be able to] elegantly share more technical info.</p>
      <p>hhp</p>
