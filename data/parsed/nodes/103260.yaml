      <p>I own your Goodchild font, Nick.</p>
      <p>My puzzlement is that some vendors cannot or will not tell you if a font is style linked, or how many kerning pairs it has, or if there are any known problems. I've often been berated on Typophile when I complain about free fonts (wadda ya want, it's free) and when I criticize paid fonts (give us a break, mistakes happen, that's common). Others have responded that there were errors in well-known fonts that went unnoticed and unfixed for years.</p>
      <p>I don't post on Typophile to berate anyone. But we can't denigrate free fonts and then set a sloppy standard for paid fonts.</p>
      <p>I am neither a professional nor an expert, but I do get embarrassed (for designers) when I know that naming conventions have been violated, and they do not.</p>
      <p>I'd just like us all to be credible, responsible, and maybe even honest about our craft. Then customers will be satisfied and designers will be respected and honored. Sure beats rants that berate people who can't afford mega-buck font families, and rants that defend professionals that once in a while screw up. I can understand the complexities of testing an operating system on multiple platforms in almost infinite configurations. Isn't it much easier to test a font before it's put to market?</p>
      <p>I honor you, Nick, for standing behind your work.</p>
