      <p><cite>I still think style linking R/I/B/BI should be a given, regardless of how many fonts in a family. </cite></p>
      <p>That’s a valid opinion. Not less, but also not more. It’s an opinion.<br>
      From a technical and logical point of view, there are good reasons not to use the typical 4-style-family linking, when the font is not a 4-style family. </p>
      <p><cite> but if I'm using regular, I have to switch fonts to use bold. What a bummer.</cite></p>
      <p>Please explain why that is a bummer? What apps are you using and how do you select the styles?<br>
      If you need to change the style, you need to change the style. Whether you use buttons, shortcuts, character styles or whatever — you need to perform an action. In what way does not style-linking the regular to the bold will cause serious problems for you?</p>
      <p>In text apps (like Word) and layout apps (like InDesign) one would and should use paragraph and character styles to apply different styles of a family. If I apply a character style to a word to make it bold, it doesn’t matter at all how the family is style-linked. I just set up the character style called “bold” to use the bold style. </p>
      <p><cite> I'm not thrilled when type designers don't bother to answer their emails. </cite></p>
      <p>How much time have you given the designer to answer?</p>
