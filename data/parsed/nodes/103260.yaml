      <p>There was an initial glitch, but as HvD said in his last email to me, "I am really happy that we could solve this problem. Good teamwork :) I always try to help when it is possible and I think that happy customers are very important. Especially if this is your daily job and you want to live from your font-sales."</p>
      <p>I said this earlier, but it bears repeating: even without the R/I/B/BI style linking, I turned down MyFonts offer of a refund because I really like Mikado. It's useful at small sizes and its character is more fully revealed at display sizes, especially in the heavier weights. I'm even more impressed that Hannes  took the time and trouble to resolve the (my) style linking issue.</p>
      <p>I still like MyFonts as a font vendor, and they do send out emails to tell you if a font has been updated, and do offer a refund if the product is defective or totally unsuitable for your work. But if there's a problem or question, they're clueless. I know fonts are not cars or toasters, but imagine if your car dealer or toaster vendor hadn't a clue about the product and you had to write to the manufacturer. (Yeah, I know that there are way more fonts than there are car models or toaster brands.)</p>
      <p><strong>Anyway, a big thanks to Hannes von Döhren and  a hearty endorsement for his Mikado font family.</strong></p>
