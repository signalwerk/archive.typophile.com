    <p>I just bought the 12 font Mikado family. I got a good deal from MyFonts: 50% off. However, the R/I/B/BI are not style linked. The six roman weights are linked to their italic counterparts, but if I'm using regular, <em>I have to switch fonts to use bold.</em> What a bummer. I wrote to MyFonts, and three times they told me each weight roman font is style linked to its italic. Each time I told them they're not addressing the issue. The message I'm getting from MyFonts is that they are clerks who don't even understand my concern and are not font people, or that they're tying to tell me (without actually telling me) that's the way it is, there's nothing they can do about it, and I'm stuck with it.</p>
    <p>I CCd Hannes von Döhren, the type designer, on the last two emails but have not heard back. Any suggestions? Is there an inexpensive way for me to style link the fonts?</p>
    <p>It's getting to be a crapshoot buying fonts from respected designers and vendors. One recent font had 1 kerning pair and looked horrible when printed (Lenga family of 16 fonts from Eurotypo). Another font was defective, and MyFonts said they'd contact the designer and I'd probably get a corrected font in a few days (ASNerd). Two months later I asked for a refund. Mikado in not the first font I've gotten from MyFonts where the R/I/B/BI were not style linked (another was Janson URW). And there's no way to find out these kinds of details on the MyFonts website. </p>
    <p>There's at least one Typophile regular who's always admonishing us: "Reducing the biggest motivation to make (good) fonts hurts everybody (certainly font users) eventually. Getting people used to paying for fonts helps." My experience is (a) paying for fonts does not necessarily help; and (b) there's no good way to find out what you're getting before you actually buy a font. Not good. It's this kind of stuff that hurts careful and conscientious designers.</p>
