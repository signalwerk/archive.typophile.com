    html: <p>One thing about style linking is that the way it should be set up is obvious for the two-weight fonts that were preponderant when it was developed, but for a six-weight font it isn't always so clear how it should be done. (Should Black be the linked bold of Medium? or should the Medium be the linked bold of Light? etc.) It's true that the Bold weight could have been linked to the Regular, but it doesn't seem unreasonable to me that the designer concluded, since bold style-linking is ill-equipped to handle the whole family, that weight selection should be left to choosing from the menu. I wouldn't call that sloppy, nor a violation of naming conventions.</p>
