    html: |-
      <p>Correct me if I'm wrong, but it appears that you have set things up so that kerning is required for nearly every letter pair; that you are using kerning to do the basic spacing for the font. In the second screen shot, you are showing the "waterfall" sample that Windows displays when you open a font. As far as I know, kerning is never shown in that sample window. </p>
      <p>Spacing should be worked out as far as possible by adjusting the sidebearings. Kerning is intended to be used only for exceptions (like "AT" or "r.") where the combination of certain characters creates spacing problems. That way, in cases when kerning is not supported, the font will still be mostly well spaced, with a few problem combinations here and there.</p>
      <p>My apologies if I have jumped to the wrong conclusion about your case.</p>
    html_clean: |-
