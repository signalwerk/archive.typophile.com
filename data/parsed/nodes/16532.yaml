    <p>Since this is my first post I'll say "Hi all" first.</p>
    <p>Hi all,</p>
    <p>I'm creating a script font in Fontographer for PC and I've put quite some time in manually kerning almost every pair imaginable. After generating the font I opened the .ttf file to find all kerning is lost! The font looks like a mess and it seems like the kerning wasn't exported at all.<br>
    Could anyone tell me what might have gone wrong and/ or how to generate a .ttf from Fontographer that includes my kerning?</p>
    <p>Thanks a lot.</p>
    <p>Regards,<br>
    Joe</p>
