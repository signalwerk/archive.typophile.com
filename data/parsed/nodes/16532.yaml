    html: |-
      <p>I have poked around with Joe's font, and indeed, there are 2621 kern pairs. This includes kerning between UC/UC, UC/lc, lc/lc, lc/UC, and #/#. The accented letters aren't kerned. There are a few "ridiculous" kerns, such as -1, -3, and 1. Which makes me think that the font has been auto-kerned.</p>
      <p>I imported the kerning as a feature, and fixed naming conventions, then generated the font as a TT-flavoured OTF..</p>
      <p>The kerning showed up perfectly in Font Book and Text Edit, but was NOT there in InDesign, which is something I have never seen in my life!</p>
      <p>So, I agree with Mark that Joe should spend some time re-spacing the font, then get the kern table down to the minimum. Is it possible that the 2621-strong kern table is simply too much for type-handling engines to handle? Might the complexity of the paths contribute to this failure?</p>
