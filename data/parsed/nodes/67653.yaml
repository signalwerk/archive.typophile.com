      <p>Mario: <em>Both releases are considered as definitive versions and at first sight the DTL Albertina and the MT Albertina seem to be identical to each other. But on closer inspection slight differences reveal themselves to the beholder [...]</em><br>
      &nbsp;<br>
      When released midst 1990’s, both the DTL and Monotype versions of Albertina were identical, but I kept on working on the DTL versions since and every later version is a bit more different. Earlier in the 1990’s Chris Brand gave me <em>carte blanche</em> and I simply could not resist improving the typeface within the existing metrics.<br>
      The OpenType format and hence the possible new font naming gave me the opportunity to enhance the letterforms and contours even further and also to occasionally change the metrics. So, the DTL OpenType version of Albertina differs most from the original editions and also contains a new ‘Book’ weight.<br>
      &nbsp;<br>
      At the moment I am finishing new Greek and Cyrillic versions (both scripts are exclusively available from DTL).<br>
      &nbsp;<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/DTLAlbertina_overview_6621.jpg"></div><br>
      &nbsp;<p></p>
