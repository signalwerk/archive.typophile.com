      <p>Thank you for that information! The DTL Albertina is—in my unprofessional eyes—one of the most beautiful typefaces, but unfortunately it is high in price from the non-professional point of view (typography is my hobby and not my job), so I have to save up for it for a while …</p>
      <p>Are there any other ligatures included in the OpenType format besides the ›fi‹ and ›fl‹ ligature?</p>
      <p>Thanks again!</p>
