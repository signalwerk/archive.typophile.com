  html: <p>I'm doing some graphics that will be die cut vinyl and go on a friend's boat. It will include the name of the boat and we want the font to match type of the the <a href="http://www.jboats.com">J/Boats</a> logo (see below). The font they use is probably a custom job. I could try to draw it myself, but I don't know if I can pull that off. I've tried taking an existing font (Chaparral Pro Semibold Italic) and editing it in Illustrator, adding curves and rounded edges to make it match. But I'm not entirely happy with the results. <br> <br>If any of you recognise it or can suggest an a font that would match let me know.  <br> <br>I would appreciate it. <br> <br>-thanks <br> <br>-brad <br> <br><img src="http://www.typophile.com/forums/messages/83/66249.jpg" alt="JBoat Logos"></p>
  html_clean: <p>I'm doing some graphics that will be die cut vinyl and go on a friend's boat. It will include the name of the boat and we want the font to match type of the the <a href="http://www.jboats.com" class="link-external">J/Boats</a> logo (see below). The font they use is probably a custom job. I could try to draw it myself, but I don't know if I can pull that off. I've tried taking an existing font (Chaparral Pro Semibold Italic) and editing it in Illustrator, adding curves and rounded edges to make it match. But I'm not entirely happy with the results. <br> <br>If any of you recognise it or can suggest an a font that would match let me know.  <br> <br>I would appreciate it. <br> <br>-thanks <br> <br>-brad <br> <br><img src="http://www.typophile.com/forums/messages/83/66249.jpg" alt="JBoat Logos"></p>
