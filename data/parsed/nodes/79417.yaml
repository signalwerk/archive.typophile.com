    html: |-
      <p><cite>I need to buy a company license correct</cite></p>
      <p>Whoever is <em>using</em> Scala needs to have a license. If you already have a license you buy nothing. If your client will never use the font internally they buy nothing. If your client needs to use Scala on every single desktop in the company then they need to negotiate a corporate license with FontFont.</p>
      <p><cite>My assumption would be that the company needs to buy that cut / weight of the typeface to use the logo correct?</cite></p>
      <p>No. You already paid for the didot license and used it to create a static logo. If the client is not actually using the font to create more graphics, they don’t need a license. The rare exception if if this particular font was purchased from a foundry like House or TypeTrust that requires an additional license for use in identitie.</p>
