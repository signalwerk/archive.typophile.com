    <p>My intent, is to purchase a license for the scala (to become the full corporate typeface) - this seems simple enough - I need to buy a company license correct?</p>
    <p>The trickier question is, I used didot for a base of the main logo, and altered it considerable. My assumption would be that the company needs to buy that cut / weight of the typeface to use the logo correct?</p>
    <p>Let me know, I've not purchased typefaces for clients this large, and I am a bit in the dark about it. </p>
    <p>Thanks!</p>
