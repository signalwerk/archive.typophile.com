    html: <p>Only the one who uses the font needs a licence. YOU have designed the logo, so YOU should have the licences. If you sell the result (the logo) to your customer, he doesn’t have to have a licence (if you have converted the fonts into paths). Only if the customer wants to use the font as his corporate typeface for example he needs to licence this font. If he only gets his logo in vector artwork he doesn’t need to licence the fonts used. But have a look in the EULA of the fonts if the modification of the font is allowed. And of course it is ilegal to give away any font-files.</p>
