      <p><cite>Can I just purchase a single license for them - since it will not be used elsewhere, and since it is a tweaked outlined version at this point?</cite></p>
      <p>Read the EULA first. Some EULAs are totally non-transferable, so in theory, a designer cannot even purchase fonts on behalf of a client.</p>
