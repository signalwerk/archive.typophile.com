    html: |-
      <p>Hi Lou,</p>
      <p>#1 looks like <a href="http://e-daylight.jp/design/fonts/type/f/firenze%20.html">ITC Firenze</a>, by <a href="/wiki/Tom%2520Carnase" class="freelinking">Tom Carnase</a>. Not really available at the moment, see <a href="http://www.typophile.com/node/20844">this older thread</a>.<br>
      #2 is Pistilli Roman by <a href="/wiki/John%2520Pistilli" class="freelinking">John Pistilli</a>. Also not available anymore, <a href="http://www.typophile.com/node/2156">see this thread</a>. There’s a new version by <a href="/wiki/Jason%2520Walcott" class="freelinking">Jason Walcott</a>, named <a href="http://www.veer.com/products/typedetail.aspx?image=JBT0000118#specimen">Eloquent</a>.</p>
      <p>For alternatives, see this <a href="http://www.fontshop.com/fontlist/genres/didone_extra_bold/">FontList of Extra Bold Didones</a>. <a href="http://www.typejockeys.com/type/6_Ingeborg">Ingeborg Fat</a> by <a href="/wiki/Michael%2520Hochleitner" class="freelinking">Michael Hochleitner</a> is a marvellous fresh option with accompanying italics; it has a few swash cap alternates and all the other bells and whistles you could wish for.<br>
      F</p>
