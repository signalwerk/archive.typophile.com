    <p>I stumbled upon this little doozy of a script logo for a 4 on 4 soccer/football tournament.</p>
    <p>Associated with: <a href="http://www.mlsfutbolito.com" rel="nofollow">http://www.mlsfutbolito.com</a> </p>
    <p>The colors and the bitmappiness make it feel like a logo for a video game from the early `90s... or maybe some fast food startup.</p>
