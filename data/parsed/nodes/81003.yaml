    <p>Hello all,</p>
    <p>I have encountered a rather interesting dilemma. I am creating a yearbook which will be distributed as a PDF. So a yearPDF... if you will.</p>
    <p>My design team and I are in the process of determining typography. Right now, we're confused about the realm we are dealing with. Is web or print typography best suited for a PDF, which will be laid out like a book? Web typography seemed like the obviously answer to this question. However, the more I thought about it, the more I realized that no, this production is not the same as a website or app; that it will have infinitely more information and allow for greater control and viewing on the part of the user. I also realized that there's nothing stopping our peers from taking this thing to FedEx Office one night and just getting it printed for their own sentimental amusement. So really... the question and its answer aren't so obvious.</p>
    <p>Any thoughts or opinions?</p>
