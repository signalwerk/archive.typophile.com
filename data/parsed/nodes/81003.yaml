      <p>I would suggest laying out the pages in Adobe InDesign, if you have access to it and know how to use it. </p>
      <p>It's the program that most professional graphic designers use for page layout. It gives you a great deal of typographic and layout control, it works well with Adobe PhotoShop  and Adobe Illustrator (in fact you can import native Photoshop and Illustrator files directly into your InDesign layout), and InDesign has the built-in ability to easily export your pages as a multipage PDF with complete control over image quality, resolution, etc.</p>
