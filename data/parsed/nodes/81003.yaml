      <p>Thank you all for the advice! @JamesM coincidentally, my co-lead brought up this same concern. We are laying the book out by page, but exporting by spreads so the organization will be like a book, but the presentation will be screen-friendly.</p>
      <p>That said: Any thought anyone on the typeface selection? I am leaning towards using typefaces which are screen-friendly. </p>
