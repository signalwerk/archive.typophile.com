    html: |-
      <p>You'll want it to look great whether it's viewed on a monitor or printed. If it's a long document, I doubt if most folks will print all of it, but some might, and many folks will certainly print portions of it, especially if they want their friends to autograph it and write comments.</p>
      <p>You might want to consider a landscape orientation for the pages (the long dimension is the width), as it will fit the proportions of monitors better, and will also still work fine when printed. </p>
      <p>Keep in mind that some laser/ink jet printers will not print to the paper's edge, so don't put headlines or anything else important too close to the page's edges. Also leave extra room on the edges that may end up bound.</p>
      <p>If it's a long document full of photos and graphics, you may run into the problem of the PDF's file size becoming huge, so keep that in mind when designing the piece.</p>
