      <p>Interesting. I lived in Thailand for a few years and more familiar with Thai typefaces. The Thai script, of course, derives from that of Khmer and the similarities are obvious.</p>
      <p>In Thai, designs where the horizontals are thicker than the verticals are very rare even for display lettering. Thai text faces usually are monoline or have slightly thicker verticals (which seems to have been due to Western influence), and display faces that have heavy contrast usually stress the verticals.</p>
