      <p>I find both scripts very beautiful. It seems Jongseong is right in saying that 'reversed' contrast is very rare in Thai. I thought the more calligraphic styles of lettering exhibited reversed contrast, but perhaps not so much. </p>
      <p>My example shows Thai lettering that seems to have some Khmer characteristics (extra spurs and curved finials) but yet not quite reversed contrast. <cite>Dor dek</cite> (ด) and <cite>pho sampao</cite> (ภ) have unusually heavy arches, and <cite>hor heep</cite> (ห) looks decidedly like a digraph to my Western eyes (in the same way as does Khmer <cite>qa</cite> (អ)).</p><div class="imageWrap"><img src="http://typophile.com/files/3934497622_43bffdc4d2_5844.jpg"></div><p></p>
