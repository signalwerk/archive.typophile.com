    html: |-
      <p>Thank you Jongseong for your interest on my work.<br>
      There are 2 different writings in Khmer, "Chrieng" for text (but we can use it for display as well) and Mool (Mula) widely used in sign shops like featured above by Kosal.<br>
      We could do the comparison with our uppercases and lowercases (some have a similar design like 'Cc' and some very different like 'Aa') but these 2 writings work separetly, we can not mix them on a same word.<br>
      Those I designed are Chrieng, I didn't design Mool but I hope one day to design an old version of Mool used for holy texts, wich is different than the Mool for sign shops.<br>
      Initially, khmer writings (idem for other asian writings) were carved on latania leaves or stones, so the glyphes were monolines. In contemporary and advertising use, the Mool is calligraphied with a square brush and we have thick horizontals &amp; thin verticals, this is a visual writing like our mecanes or fat didones on the XIXth c.</p>
      <p>&gt;&gt; I've seen that most examples of display lettering where horizontals<br>
      &gt;&gt; are thick and verticals are thin. I've always wondered how it came to be.</p>
      <p>&gt; Maybe the influence of Devanagari.</p>
      <p>For Thai or Khmer, influence is probably more from Southern India like Tamil and Malayalam. To have thick horizontals &amp; thin verticals, we need a nib beveled in the other sense, opposite our western nibs for latin calligraphy.</p>
      <p>And yes Ricard0, it really looks like Blackletters!</p>
      <p>BTW, I updated the <a class="freelinking external" href="http://www.xavierdupre.com/html/plus.php?p_lang=en" rel="nofollow">unpublished works</a></p>
      <p>xd</p>
