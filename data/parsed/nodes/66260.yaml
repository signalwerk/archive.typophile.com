    <p>Type designer Xavier Dupré, whose new FF Yoga was recently the featured face on Typophile, has a new website, <a class="freelinking external" href="http://www.xavierdupre.com" rel="nofollow">http://www.xavierdupre.com</a>.</p>
    <p>There are some examples of early versions of his designs in a section called <a class="freelinking external" href="http://www.xavierdupre.com/html/design.php?p_lang=en" rel="nofollow">Design Steps</a>, which offer some glipses into his creative process.</p>
    <p>Even more fascinating, for me, are the samples of two of his typefaces for the Khmer script used in Cambodia, <a class="freelinking external" href="http://www.xavierdupre.com/html/sipar_apsara.php?p_lang=en" rel="nofollow">SIPAR Apsara</a> and <a class="freelinking external" href="http://www.xavierdupre.com/html/cks.php?p_lang=en" rel="nofollow">CKS Chrieng</a>. I don't read Khmer and can't judge them as a native reader would, but they appear beautiful. I knew Xavier had designed some non-Latin typefaces while living in Southeast Asia, but I had not seen any samples until now.</p>
  html_clean: |-
    <p>Type designer Xavier Dupré, whose new FF Yoga was recently the featured face on Typophile, has a new website, <a class="freelinking external link-external" href="http://www.xavierdupre.com" rel="nofollow">http://www.xavierdupre.com</a>.</p>
    <p>There are some examples of early versions of his designs in a section called <a class="freelinking external link-external" href="http://www.xavierdupre.com/html/design.php?p_lang=en" rel="nofollow">Design Steps</a>, which offer some glipses into his creative process.</p>
    <p>Even more fascinating, for me, are the samples of two of his typefaces for the Khmer script used in Cambodia, <a class="freelinking external link-external" href="http://www.xavierdupre.com/html/sipar_apsara.php?p_lang=en" rel="nofollow">SIPAR Apsara</a> and <a class="freelinking external link-external" href="http://www.xavierdupre.com/html/cks.php?p_lang=en" rel="nofollow">CKS Chrieng</a>. I don't read Khmer and can't judge them as a native reader would, but they appear beautiful. I knew Xavier had designed some non-Latin typefaces while living in Southeast Asia, but I had not seen any samples until now.</p>
