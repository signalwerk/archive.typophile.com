      <p>I'm Khmer, and I'm familiar with the alphabet. I can tell you that in general, Khmer lettering is beautiful. Although I can only "read" it by sounding out the few letters I know, I've seen it enough to know that Xavier's examples are transparent enough to not appear odd. </p>
      <p>In text, the forms are usually monoweight. I've seen that most examples of display lettering where horizontals are thick and verticals are thin. I've always wondered how it came to be. </p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/haircut_5472.jpg"></div><br>
      You can see next to the prices where the weights are standard from a western perspective.<br>
      But everything else there has the weights opposite.<p></p>
