    html: <p>just because the client says he likes the type doesn't mean  <br>it's finalized.  I think the type needs a lot of work still, and you  <br>shouldn't be so satisfied just yet. <br> <br>the bottom of the letterhead isn't handled very nicely.  <br>it's blocky and weighed down.  it's also forced into a tiny  <br>space.  i would move it up a centimeter or 2.  also,  <br>the horizontal bars going right across the page are so generic.  <br>there's no unique quality to them.  i've seen that done  <br>a thousand times.  you could maybe just put the bars bleeding  <br>off the bottom edge, like the business card does.  also, the  <br>repetition of the car twice is not very clean.  <br> <br>and why not just center the logo at the top? it looks good  <br>that way on the business card. <br> <br>... <br> <br>each element is too different from each other. <br>the hairline on the business card stops before reaching <br>the edge. that could happen on the letterhead too. <br>look at all the pieces together (above)  and notice how the spacing <br>of each object or text block from a paper edge is different  <br>every instance it's used.  the logo, for example, looks best with  <br>a certain amount of negative space around it.  i don't think <br>you should ever cram the logo somewhere or put other objects <br>too close to it. <i>(back of business card)</i></p>
