    html: <p>Galin, I hope your client has plenty of money because the only way you will get the black on the envelope to work properly is to print and then convert into envelopes. Alot more expensive. Same holds true for your bleeds on the letterhead and business cards. Also when cutting the business cards with the knock out type so close to the edge you will have alot of waste and the overs will cost alot once again. I would suggest showing your designs to a printer and maybe get some feedback on how to make them work with in a resonable budget.</p>
