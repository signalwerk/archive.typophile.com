    html: "<p>To Hrant : <br>&gt;&gt; What kind of cars?  <br>&lt;&lt; All kind of cars. <br> <br>&gt;&gt; What kind of [potential] buyers?  <br>&lt;&lt; Ranging from a penniless guy looking for a jalopy to a tycoon looking for a Porshe. <br> <br>&gt;&gt; How do Bulgarians feel about Arabs, or Turks?  <br>&lt;&lt; Not so great, because of the turkish slavery on Bulgaria. It lasted for 5 centuries. Nevertheless, nowadays people are more broad-minded than they were for example 1-2 centuries before. It seems that the contemporary spirit of the bulgarians is trying to mingle with every single culture it come across. This creates an amalgam(mixture) of cultures, which in my humble opinion is not a good thing. Everybody is trying to copy the East or the West and not care about \"us\" and \"here\".  <br>If I have to answer the question directly - No, there is no prejudice about the arabs and sometimes they are even thought as a good thing. (if we don't stem from historical point of view of course ;) <br> <br>&gt;&gt; Especially since it sounds like \"sheikh\"! :-/ <br>&lt;&lt; You are right about that. However, in Bulgarian the word \"sheikh\" is pronounced somewhat differently than the word \"shik\". In fact, the word \"shik\" in phonetical point of view is composited of only 3 phonemes (\"sh\" - diphthong, \"i\" and \"k\"). <br> <br>&gt;&gt; If it were Russia I'd say stay away from that style for sure (I still remember the way the people on the plane from Moscow to Novosibirsk were looking at me. <br>&lt;&lt; <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\"> Don't mind them. They always gawk at strangers. (Beware stranger ;)) <br> <br>To Tanya :  <br> <br>&gt;&gt; hmmm...spooky car. <br>&lt;&lt; Is it the color(black) that creates the spooky sensation? I didn't want to entangle in complex illustration. <br> <br>&gt;&gt; It's looking quite eastern to me. some kind of asian or indian thing going on definately. <br>&lt;&lt; I feel the same thing. It was not intentional, but after I am here maybe we can comment on the eastern look.  <br> <br>&gt;&gt; ...has me thinking japan <br>&lt;&lt; I have to admit that the circular elements on the business card are quite japanese ;) <br> <br>&gt;&gt;...has me thinking Arab <br>&lt;&lt; It seems are though I have created a Corp.ID for an Arabic company. ;)  <br> <br>To Scott :  <br> <br>&gt;&gt; ...\"cute\" rather than chic.  <br>&lt;&lt; The word \"chic\" in my language have a multiple meaning and is often perceived as the word \"cute\" with a slight tint of extravagant. <br> <br>&gt;&gt; I'm not sure about repeating it on both sides of the bizcard. <br>&lt;&lt; I'm not sure, either. <br> <br>&gt;&gt; Is there a reason you didn't layout out the letterhead in that same fashion?  <br>&lt;&lt; It was a requirement for the envelope design - (to center the logotype) <br> <br>p.s Some propositions on fonts that look chic are welcomed ;)</p>"
