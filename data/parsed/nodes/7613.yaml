  html: <p>I was hired to create a Corp.ID (logo design, business card, envelope, A4 blank) for a company, which specializes in car sales "automobile sales".  <br> <br>The client wants a fresh and stylish look (but not abstract / more or less illustrative). The name of the company "Shik" in translation means chic/elegant. <br><img src="http://www.typophile.com/forums/messages/29/53223.jpg" alt="auto"> <br>I would love to hear your critique and advices. <br> <br>P.S Any advices on the font choice are welcome. The direction is to match the word "chic" with a corresponding font.</p>
  html_clean: <p>I was hired to create a Corp.ID (logo design, business card, envelope, A4 blank) for a company, which specializes in car sales "automobile sales".  <br> <br>The client wants a fresh and stylish look (but not abstract / more or less illustrative). The name of the company "Shik" in translation means chic/elegant. <br><img src="http://www.typophile.com/forums/messages/29/53223.jpg" alt="auto"> <br>I would love to hear your critique and advices. <br> <br>P.S Any advices on the font choice are welcome. The direction is to match the word "chic" with a corresponding font.</p>
