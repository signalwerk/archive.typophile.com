  html: |-
    <p>Hi everyone</p>
    <p>I am designing a logo for a marketing company. The two partners have differing styles and I am finding it hard to find a typeface that they both like.</p>
    <p>One partner likes bold and slightly quirky. She really liked Appetite. The other partner is minimalist and clean, and likes Sodermalm. As you can see, they have quite differing tastes. They are willing to meet in the middle. I tried Mrs Eaves but they are not convinced.</p>
    <p>I have been staring at typefaces for hours! Any suggestions?</p>
    <p>Thank you</p>
