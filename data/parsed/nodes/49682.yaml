    html: |-
      <p>Depending on the text, I usually set them stacked. See, for example, <cite>Bach Perspectives</cite> Volume 1. Volumes in this series later than 2 or 3 (if any) weren't set by us, &amp; I have no idea whether or not they continued this practice. As the previous poster said, it also depends on whether or not you can make up good characters (numbers), and to some extent, the design of the book/journal.</p>
      <p>If you don't set them stacked, on-line numbers separated by a the virgule is probably best.</p>
