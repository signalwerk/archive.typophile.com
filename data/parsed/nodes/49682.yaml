  html: <p>In a book on music, how does one properly set (e.g. 3/4 or 6/8) time signatures? In a musical score, numerals sit one above the other in vertical alignment. Are standard fraction figures (not that 6/8 seems all that common) acceptable? Or should the numbers be separated by a colon, virgule, etc.?</p>
