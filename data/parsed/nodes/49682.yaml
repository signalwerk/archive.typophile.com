    html: |-
      <p>What I see most commonly (and I am a musician, so I see this sort of thing fairly often) is simply the numbers separated by / (just as you typed them in your message). Setting them on top of each other, as you'd see in a score, causes problems not only because, unless you make them very small, they are quite high and so cause problems with line spacing, but also it's slightly jarring (to me) to see them presented in any typeface other than the heavy 'standard' time signature style, or variation thereof. Seeing 4/4 or 12/8, however, is quite clear and looks fine in text.</p>
      <p>In a footnote to a score itself, however (also something I deal with fairly often) I'd tend to actually use time signatures matching those in the score, with the numbers on top of each other; but that's less of a problem, since footnotes are usually a few lines (rarely more than two), and one can be flexible about line spacing and so on, especially since on occasion you need to put all kinds of musical notation into them (anything from accidentals, notes to indicate rhythm, or even fragments of music on a stave).</p>
      <p>This is IMHO, of course; I've seen various approaches in music books. In some texts, and assuming enough control over the niceties of the layout, it might be nice to present time signatures in their 'proper' form, especially if other musical symbols are often used in running text.</p>
