    html: |-
      <p><a href="/wiki/Fontographer%3A%20Type%20by%20Design" class="freelinking" rel="nofollow">Fontographer: Type by Design</a> by Stephen Moye</p>
      <p>It is currently out of print but can be found in digital form on the net. If you'd rather take the non piracy approach, some members had copies for sale.</p>
      <p>Most of the information in the book is not specific to Fontographer and it covers the correct drawing of outlines from a technical perspective particularly well. Opinions as to its usefulness were mixed among typophile members, but I found it contained some very interesting information that I had not found in other books on the subject.</p>
