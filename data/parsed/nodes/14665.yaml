    html: <p>The Briem site is good, also look on Google for Chank. Some might not like him, but he is there and has been. A good book, among many, is "Designing Typefaces" by David Earls, more history than how-to, but best of all are the interviews with designers. The Bringhurst book never leaves my sight, nor does Tracy's "Letters of Credit." Also good is "Typographically Speaking The Art of Matthew Carter" by Margaret Re, with essays by Johanna Drucker and James Mosley. Also very good is "Goudy's Type Designs" with text by Goudy. Goudy's commentary is very interesting and often amusing.</p>
    html_clean: <p>The Briem site is good, also look on Google for Chank. Some might not like him, but he is there and has been. A good book, among many, is "Designing Typefaces" by David Earls, more history than how-to, but best of all are the interviews with designers. The Bringhurst book never leaves my sight, nor does Tracy's "Letters of Credit." Also good is "Typographically Speaking The Art of Matthew Carter" by Margaret Re, with essays by Johanna Drucker and James Mosley. Also very good is "Goudy's Type Designs" with text by Goudy. Goudy's commentary is very interesting and often amusing.</p>
