    html: '<p>Discussed many times at <a class="freelinking external" href="http://www.myfonts.com/WhatTheFont/forum/?q=NEW+YORK+POST" rel="nofollow">WTF Forum</a> and still unsolved. Most probably not-a-font. Some suggestions for alternatives, mainly slanting lettering, reworking /R leg terminal and /K and adding a faux-3D shadow: <a class="freelinking external" href="http://www.myfonts.com/fonts/linotype/helvetica-inserat" rel="nofollow">Helvetica Inserat</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/adobe/impact" rel="nofollow">Impact</a>, <strong><a class="freelinking external" href="http://www.myfonts.com/fonts/adobe/gothic-13" rel="nofollow">Gothic 13</a></strong> (possibly the closest, "only" slanting it and reworking /R leg terminal), <strong><a class="freelinking external" href="http://www.myfonts.com/fonts/berthold/akzidenz-grotesk-pro" rel="nofollow">Akzidenz Grotesk</a> XBold (Italic)</strong>, <a class="freelinking external" href="http://www.myfonts.com/fonts/bagraphics/shadow-gothic" rel="nofollow">Shadow Gothic</a></p>'
