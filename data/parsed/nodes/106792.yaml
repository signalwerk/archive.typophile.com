    html: '<p>Discussed many times at <a href="http://WTF Forum" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://WTF Forum</a> and still unsolved. Most probably not-a-font. Some suggestions for alternatives, mainly slanting lettering, reworking /R leg terminal and /K and adding a faux-3D shadow: <a href="http://www.myfonts.com/fonts/linotype/helvetica-inserat" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Helvetica Inserat</a>, <a href="http://www.myfonts.com/fonts/adobe/impact" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Impact</a>, <strong><a href="http://www.myfonts.com/fonts/adobe/gothic-13" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Gothic 13</a></strong> (possibly the closest, "only" slanting it and reworking /R leg terminal), <strong><a href="http://www.myfonts.com/fonts/berthold/akzidenz-grotesk-pro" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Akzidenz Grotesk</a> XBold (Italic)</strong>, <a href="http://www.myfonts.com/fonts/bagraphics/shadow-gothic" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Shadow Gothic</a></p>'
