    html: |-
      <p>Yes, Arial may in some sense be seen as a perversion of Helvetica, but I think the primary reason there is so much rage against it is simply that it is a default, and therefore carries with it a sense of unprofessionalism. Whenever I see Arial or Arial Black used in a design, my initial thought is that the person designing it did it in PowerPoint and didn't bother to change the font from Arial.</p>
      <p>Would Arial attract so much designer rage if it hadn't been a default? Maybe, maybe not. I've seen Arial used effectively (usually with all-caps), but I've seen it used ineffectively and unprofessionally so many times that even a decent use of it sets off something in my head. There are very few times I see Arial where I don't think that Helvetica would have been a better choice (which is not to say that Helvetica would have been the best choice, but still better than Arial).</p>
      <p>What we need to ask ourselves is, what if Helvetica had been a default font in MS Office instead? What about Meta? Futura? Now that Verdana is a default in PowerPoint, whenever I see a presentation set in it I immediately think that it looks unprofessional, regardless of how well-designed the rest of the presentation is.</p>
      <p>I don't get this reaction to Cambria and Calibri yet, but I imagine that we'll start having similar feelings towards them about 10 years from now.</p>
      <p>That said, the leg of the R in Arial is absurd and bothers me to no end. Also, the t and the r.</p>
    html_clean: |-
