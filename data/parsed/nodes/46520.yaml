      <p>When I was in college, my favorite (bad) feature of Arial was its metrics: namely it could turn your 12 page paper typed in Garamond 12pt into the 15 page paper that the professor wanted.  (I was a Classics major, and few, if any, profs cared about the font used.)</p>
      <p>To weigh in on the discussion about why Arial is so hated, the lore, at least, is that Microsoft didn't want to pay royalties to Linotype like Apple did for Helvetica and so commissioned Arial.  (Can anyone verify this?)  The problem, of course, is that Arial is a poor replacement for Helvetica, hence, designers' white-hot ire.</p>
      <p>Considered on its own, Arial is functional type.  Granted, as many have said before, its 'R', 'C' and 't' are completely inadequate and unnerving.  But it will do in a pinch.  It has no place in a professional design, but for everyday tasks, it is not unacceptable.</p>
      <p>--<br>
      Nick Hladek</p>
