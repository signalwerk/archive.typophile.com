      <p>For me, there are two big problems of Arial: kerning and diacritics.<br>
      <strong>Kerning</strong> There is no kerning of accented glyphs in Arial. It looks horrible when Arial is used for setting Czech language, for example the name TAŤÁNA looks like TA Ť ÁNA.<br>
      <strong>Diacritics</strong> The shape of several accents is very poor. The position of (comma-like) caron in the 'tcaron' glyph is not acceptable. It creates a big gap between 'tcaron' and next glyph.<br>
      You can compare Arial with Linotype Helvetica CE. (Although not perfect, at least acceptable).</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/arial_5909.gif"></div><p></p>
