      <p>The R leg and the sloped top of the t are the easiest ways to tell Arial from Helvetica, which I think is why many people have a negative reaction to them, because when you see them, that's usually the exact moment where you think "ugh, that's Arial". But I don't think those choices are inherently bad design. They would be fine choices for a typeface that isn't trying to knock off something else. In fact, if one could judge from a blank slate devoid of Helvetica's decades of cultural context, I would say the extreme squareness of Helvetica's R is the more dubious decision.</p>
      <p>However, in reality, Arial's R loses simply because it is part of Arial, which as a whole is inferior. Not merely because it isn't Helvetica, but because you can tell it was thrown together with very little care in regard to proportion.</p>
      <p><em>My</em> greatest peeve with Arial is the way the ends of such curves as c are <em>nearly, but not quite</em> horizontal. You know how you can unbend a paper clip, but if you try to restore it to its original shape, you can't get it <em>exactly</em> the way it was? For this reason, Arial looks like someone did that to it.</p>
