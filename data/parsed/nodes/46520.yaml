      <p>James, I was thinking something similar (that is, that the aversion may be caused by the frequent bad usage, not the badness of the type itself). DrDoc has the same point, and I think his question might be the right one to ask there: what if it hadn't been set as a default?</p>
      <p>Personally, I don't get a very negative reaction when I see Arial – honestly, I might ignore a good part of those "badly applied" cases as well. I really do dislike the leg of the R though..</p>
      <p>A better example might have been Comic Sans actually. This typeface is another one of those widely hated typefaces (even in the non-design community). But this aversion may be  connected primarily with the bad usage (at least, for me). Interestingly, I've read that it is very useable for dyslexics, because of the uniqueness of every letter. That might explain some of it's popularity, because it might be easier to distinguish each letter (not saying that the general public is dyslexic btw)</p>
      <p>Sii, I didn't have the patience to learn the other kind of fishing. It's too ambigious and unpredictable. Plus, we have learned to dislike disagreements in my country. Very good for our NNP.</p>
      <p>Malte</p>
