      <p>First posting - hello.</p>
      <p>I have _no_ typographic expertise, just an interest. Arial &amp; Helvetica are of course ubiquitous but somehow as a layman I feel irritated by Arial but not Helvetica. Perhaps it's a learned "type snobbery"? The R bothers me also, not just the strange leg but the bowl seems too wide/elongated.<br>
      Of course here in the UK, Gill Sans is very widespread &amp; has a "quirky" R, but I still like it. Don't know why. I acknowledge cerulean's point that Helvetica's R is out of keeping with the rest of the face. The BBC News mixes Helvetica &amp; Gill Sans all the time, but I'm getting over it :)</p>
      <p>Arial's a lacks something compared to Helv, but the ubiquity bothers me most. In the UK health service it is actually recommended for printed communications, which irks me.<br>
      But the British Medical Association delivered a petition with 1M patient's signatures to the UK Parliament this month, and the front cover appeared to be printed in Comic Sans MS, which was about the design low point of the month for me.</p>
