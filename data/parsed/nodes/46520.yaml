      <p>I had a boss once who fancied herself a graphic designer, and she made all the menus (it was a bowling alley) and gave each menu item its own Microsoft Clip Art of the product. So for a hot dog it would say HOT DOG (she didn't use lowercase, and she generally spoke in all caps too) and next to the words would be a helpful picture of what a hot dog looked like. </p>
      <p>Naturally, to give it more of a classy upscale look (she was always trying to "trend up" our brand image) she went for the all-business look of Times New Roman, with the bold button selected for emphasis. On the side she had a business making wedding picture montage DVDs set to oldies, complete with fades and wipes to cut from picture to picture.</p>
      <p>People like this need Arial when going for that more modern feel.</p>
