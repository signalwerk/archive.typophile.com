      <p>I don't think kerning is the issue, as I understand Helvetica metrics were a moving target even back in 1991. And beyond the basic char-set no attempt was made to match  Helvetica widths - in fact the version of Arial in Vista (and latest Mac OS) has many characters not in any version of Helvetica. And as mentioned elsewhere the target for metrically compatible fonts is now Arial, not Helvetica - Albany, Liberation Sans to name but two.  </p>
      <p>But the kerning issue does raise an interesting question as to if its legally possible to make a metrically compatible version of a modern multilingual OpenType font where metrics, class kerning and OpenType features would need to be matched.</p>
