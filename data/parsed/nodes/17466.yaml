    <p>I just made a font somthing inbetween my handwriting and the german Schulschrift. I made the joiners out of calt of the "underscore". So every time I mant wo have an joiner, i just type in an "_" and the calt feature does the rest. And some alternate letters are needed ("e", "s", "l", "b" ...)</p>
