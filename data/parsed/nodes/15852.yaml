      <a href="http://www.acaballoartesdellibro.com/2006/07/mi_sueno_de_nino_tener_una_min.html" title="http://www.acaballoartesdellibro.com/2006/07/mi_sueno_de_nino_tener_una_min.html">http://www.acaballoartesdellibro.com/2006/07/mi_sueno_de_nino_tener_una_...</a></p>
      <p><a href="http://la-matanza.blogspot.com/2006/03/venta-de-minerva-tipografica-doble.html" title="http://la-matanza.blogspot.com/2006/03/venta-de-minerva-tipografica-doble.html">http://la-matanza.blogspot.com/2006/03/venta-de-minerva-tipografica-dobl...</a></p>
      <p>Any updates on this? I'm waiting to get some information from someone who (from what I heard) has won a lot of awards in Mexico. I hope I can get this info and will keep you posted on this.</p>
      <p>Thanks</p>
      <p>Kco</p>
