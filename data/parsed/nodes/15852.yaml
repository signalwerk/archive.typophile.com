      <p>kco:</p>
      <p>The correct terms are imprenta tipografica and prensa plana, as someone said, which correspond somewhat<br>
      to "letterpress shop" "platen press".</p>
      <p>I have a small (very) letterpress shop in the city (D.F.), dedicated to limited editions of poetry,<br>
      while the most experienced shop I know is called Ditoria, and they have been working for almost 15 years.<br>
      They have made some 20 or 30 fine editions during that time.</p>
      <p>There is a medium-sized shop with a large heidelberg cylindrical that prints wrestling posters<br>
      and used to do some work for bullfights, not the fancy kind of poster, mind you, in the Colonia Obrera.</p>
      <p>Other than than that, small shops use letterpress to number invoices, and that is about it.</p>
      <p>There is also the handpress printer Juan Pascoe in Michoacan, and there are some graphic artists<br>
      like Ehrenberg and Magali Lara who have made "artist's books", as well as Toledo. But I have not seen<br>
      examples and cannot be sure if they can be considered letterpress.</p>
      <p>I hope this is of some use. Send me a message if I can help you out with anything.</p>
