      <p>Some updates on this thread:</p>
      <p>I have not found the final real name for letterpress in spanish but I've heard of a couple other ones besides the ones listed here:</p>
      <p><cite>Prensa plana</cite>: I've heard this from someone who creates custom paper for wedding invites. That's what she calls it.</p>
      <p><cite>Minerva, Minerva tipografica</cite>: I found this through google.</p>
      <p>You can see some HEIDELBERG here:<br>
