      <p>I skimmed Jorge de Buen's "Manual de Diseño Editorial" (2000) a bit but couldn't find anything. I suspect you could use the term "letterpress" and anybody who would know what that is would know the English term too. But you might contact Jorge directly - he's highly approachable; he teaches at the Universidad Iberoamericana in Tijuana. I'm sure he can help you find letterpress printers too.</p>
      <p>Another thing you could do is ask old-timers at newspapers that have been around for a while (like at least a few decades) - they're likely to have good leads for you.</p>
      <p>hhp</p>
