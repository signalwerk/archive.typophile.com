      <p>Hola Javier, I believe that the name is "Imprenta de Tipografía" or "Imprenta Tipográfica". The problem I see is that this name in the present time is too general, too common becouse of the word "Tipografia".</p>
      <p>De todas formas intentalo tambien con estos nombres:<br>
      Imprenta de Tipos Móviles<br>
      Imprenta de Caracteres Móviles<br>
      Imprenta de Tipos de Caja</p>
      <p>Buena suerte.</p>
