    html: "<p>I must say I'm not entirely sure about the bottom  <br>type treatment: that's where he starts to get  <br>feverish, so I wanted to invoke an atmosphere of  <br>halucination. It's not a path treatment though (I  <br>hate those too), it's all done by hand with a  <br>photocopy machine. The ole' Terry Jones routine. <br> <br>With this piece I pay tribute to my influences from  <br>my Art Academy days: 90s deconstructivism and  <br>neo-goth. So it could be slightly dated looking,  <br>but I hope to add a contemporary twist. <br> <br>I'll try to whup up a rough translation. It won't  <br>be easy because there's a lot of word play and  <br>poetic license, but I agree it would help to make  <br>sense of the piece. Gimme till tomorrow. <br> <br>BTW There's no 'beautiful' in my spreads: it got  <br>lost in the previous double page. ;) The images  <br>are not meant to be taken literally.</p>"
