    html: <p>&gt; photocopy effect <br> <br>I can appreciate you doing this much more than I can simply putting type on a path. (In this instance) But, it seems there is too much separation. Between the horizontal and the curved. The visual play with scale and type is much more interesting, although with more of a mixture or transition (segue) from the one to the other it could also still work.  Perhaps you transition from the well-set type to the spastic too?  <br> <br>The large square skeleton is too heavy and seems to weigh [edit] that side down without purpose. <br> <br>I was reading into the images. The whole, "beauty is only skin deep, but ugly goes to the bone" thought came to me. <br> <br>the starkness of your type, black and white, matches (for me) the starkness of the line drawing. But, it doesn't seem to work (for me) with the photo. <br> <br>Granted. A lot depends on what precedes and what follows. It could be that those spreads set the pace and follow the lead of this spread.  <br> <br><img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"></p>
