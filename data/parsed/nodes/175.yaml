  html: |-
    <p>Hi everyone, <br> <br>We were asked to produce a book that shows off  <br>our capabilities. Total creative freedom! The horror... <br> <br>The basic idea is that all five designers in our  <br>studio collaborate on a book that tells the story  <br>of 'Beautiful', a kind of legend-like tale. Each  <br>one of us gets two spreads, and a 'transfer page'  <br>preceding your section that incorporates an  <br>element from the designer of the previous spreads  <br>and another 'transfer page' to hand over an  <br>element from your pages to the designer of the  <br>following spreads. <br> <br>This is my first spread. At this point in the story  <br>'Beautiful' has just met the first 'Ugly' and starts to  <br>feel very ill. It gets from bad to worse throughout  <br>the page. <br> <br>Let me know what you think. I'll provide additional  <br>information if need be. <br> <br><img src="http://www.typophile.com/forums/messages/29/10929.jpg" alt="screenshot.jpg"> <br> <br>Here's a PDF to allow close-up viewing. <br> <br></p>
