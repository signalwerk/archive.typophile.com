    html: <p>Hey there. <br> <br>Unfortunately I can't read the words, which would help in my understanding.   <br> <br>First off, my initial reaction to the type was enjoyment and interest, except for the type at the bottom, which is wavy and slightly dated looking.    I just don't like the wavy vector path type elements.  The type up top and before this is fine.  Your use of the letterforms of the different fonts is engaging. <br> <br>Now, in terms of concept.  I am not seeing it that much.  What/where is beautiful in this piece?  The "nervous" man?  The brain ties into your concept I will say, it looks like it is ill...hungover <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> <br> <br>But I am not seeing the beauty here. <br> <br>Ciao!</p>
