    date_raw: 19 May 2003 — 3:55pm
    date: 2003-05-19T15:55:00
    votes: null
    html: <p>I agree the transition is too abrupt as it is now,  <br>but I wanted some extra input before deciding which  <br>way to go. <br>Actually I was going to segue the large compositions  <br>into the curved/distorted type by slightly distorting  <br>the former, but I couldn't bring myself to do it  <br>because for the moment I quite like the crispness of  <br>the clusters. <br> <br>BTW Which type families did I use? ;) Let me have it,  <br>Tiff! <br> <br>I thought I had the pictorial elements balanced out,  <br>but I'll reconsider the square x-ray pic.</p>
  - id: 136051
    user_id: 110
    user_name: Bald Condensed
    user_path: null
    date_raw: 19 May 2003 — 4:02pm
    date: 2003-05-19T16:02:00
    votes: null
    html: "<p><i>A lot depends on what precedes and what follows.</i> <br> <br>The spreads are meant to function as independent  <br>units: there's no connection in terms of graphic  <br>design nor typography between the spreads of the  <br>different designers. That's why we introduced the  <br>'transfer pages' to unify the whole. We all have  <br>quite different styles, and this book is meant to  <br>show off the diversity of our studio.</p>"
