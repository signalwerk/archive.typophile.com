    <p>Native <a href="/wiki/Arizona" class="freelinking" rel="nofollow">Arizonian</a> type-enthusiast-turned-<a href="/wiki/bezier%20wrangler" class="freelinking" rel="nofollow">bezier wrangler</a>. Dedicated <a href="/wiki/Typophile" class="freelinking" rel="nofollow">Typophile</a> and self-proclaimed "<a href="/wiki/typowiki" class="freelinking" rel="nofollow">wiki</a> kahuna."</p>
    <p>Became associated with <a href="/wiki/P22" class="freelinking" rel="nofollow">P22</a>/<a href="/wiki/Lanston%20Type%20Co." class="freelinking" rel="nofollow">Lanston</a> in December of 2004.</p>
