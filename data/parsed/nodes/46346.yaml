  html: |-
    <p>Adobe Type Marketing will commission 80 RGB GIF images of 100x100 pixels, each representing a specific typeface family (e.g. Myriad Pro) or themed collection of fonts (e.g. Weddings). The design must be interesting to graphic designers, and communicate something of the family’s/collection’s unique qualities. Adobe will provide the fonts, and review the work (and may request changes).</p>
    <p>The delivery date is negotiable, but by default will be 60 days after the contract is signed. If interested, please submit a bid and a few digital samples of relevant designs to Nicole Bok nbok[at]adobe.com.</p>
