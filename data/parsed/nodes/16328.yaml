    html: |-
      <p>I resisted drawing directly in FontLab for a long time, but once you get used to it, you realize it is particularly suited to drawing glyphs, and working directly in the program makes development go much faster. </p>
      <p>I used to draw in Illustrator and copy and paste into Fontographer. However, this method is not so straightforward with FontLab, a factor which kept me from moving up to FontLab for years. Now that I have become accustomed to (frankly, enamored of) FontLab's drawing tools, I can work much faster than I used to, mainly because there are fewer steps involved. The productivity gains were well worth the couple of weeks or so it took me to get used to using its tools.</p>
      <p>There are font designers who work in Illustrator (or other drawing programs), but among those who do it for a living, I think it's the exception.</p>
