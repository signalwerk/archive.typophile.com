      <p>Fontlab allows you to import EPS files (<em>menu</em> Glyph —&gt; Import from EPS...).</p>
      <p>However, I just tried to import an EPS 3.0 file generated with Flash MX 2004,<br>
      but it didn't work as expected — Fontlab imported some paths, but these<br>
      looked like an explosion of the shapes I had drawn :^/</p>
      <p>So, you can still use Flash to draw your glyphs, but you'll have to use Illustrator<br>
      for an intermediate step. This consists of opening the EPS or AI file generated<br>
      with Flash, and saving it in a format that Fontlab understands. In alternative,<br>
      after opening the files, you can Copy/Paste the paths from Illustrator directly<br>
      into Fontlab.</p>
      <p>It's all documented here: <a href="http://groups.msn.com/FontLab/tipsandtricks.msnw?action=get_message&amp;mview=0&amp;ID_Message=2675" rel="nofollow">Using Illustrator to draw typefaces</a></p>
