    <p>I am currently using fontLab, and after painstakingly creating 5 glyphs for my first Arabic font (and first font overall) I can't help but wonder, is there an easier way?<br>
    I'm a flash designer, and im wondering, since flash is vector based, and so is fontlab, is there perhaps someway of designing the glyphs in flash and then importing them into fontLab?<br>
    I'm guessing not, but I honestly think the flash method of creating outlines (using the line tool) is much more user friendly than the method in fontLab, though that's probably a biased point of view (since I've been using flash for close on 6 years now and just started with fontLabs).<br>
    So, to get to the point, is there an easier way to design glyphs?<br>
    Even if I were somehow able to import a bitmap and have it in the background just to use as a guide, that would be helpful.<br>
    So, if anyone knows of such a method, sharing would be appreciated.<br>
    Thanks</p>
