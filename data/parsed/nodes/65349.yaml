    <p>Hi there,</p>
    <p>I’m a digital media student and have just started my own company just so I can freelance and do some work on along side my studies. I used to be an interface developer so mostly what I do is just “PSD to XHTML” or “PSD to Wordpress” work.</p>
    <p>For the name of my company I’m using Calgary script. I wanted something that looked handmade as all my work is bespoke and handcrafted, and not using templates or dreamweaver etc.</p>
    <p>When I worked at a large agency, I only recall using Arial, Georiga, Tahoma and Verdana, the boring web-safe fonts. I’ve never been involved in print...</p>
    <p>So my question is, should I have the same font for print (letterheads, invoices) as for the website? Or can I choose something more exiting for print?</p>
    <p>Should I have a mix of serif and sans serif on the website? What could go well with Calgary script?</p>
    <p>Any advise or links to relevant articles etc woukd be very much appreciated=)</p>
    <p>Thanks,<br>
    Linda</p>
