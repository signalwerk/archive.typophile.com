      <p>@oque -I’m consdering it because I’m seriosuly sick of arial, georgia, verdana and tahoma, which seems to be all websites come in these days (although I’m not a designer, I just do the xhtml/css/javascript/php...)</p>
      <p>@Bert Vanderveen -I think a script can work. If you have a look at Calgary script at <a href="http://www.sudtipos.com/fonts/90" title="http://www.sudtipos.com/fonts/90">http://www.sudtipos.com/fonts/90</a>, I think it it is fun, playful and would stand out among the normal corporate-y looks.<br>
      I think making a website should be fun, for both the client and for me. I used to work in a big agency and for a lot of very, eh, boring clients. If candy script would scare them off then great.<br>
      And it could work, take a look at Morphix for example <a href="http://www.morphix.si/#home" title="http://www.morphix.si/#home">http://www.morphix.si/#home</a><br>
      As I said, I wanted a script font because it looks human made rather than computer made. I handcode everything, I do not use templates. I want to emphasize this.</p>
