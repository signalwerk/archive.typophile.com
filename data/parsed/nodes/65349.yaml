      <p>I’m not sure “more exciting” is the proper way to go, but yes, you definitely want to explore non-web fonts for printed materials. You can then use an image of the logo on the website, until we finally get our act together to allow all fonts to be used effectively on the web.</p>
      <p>I would suggest a open, humanist sans serif with large x-height to complement Calgary Script.</p>
      <p>Don</p>
