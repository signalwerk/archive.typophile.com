  html: "<p>Did anybody else receive this beautiful new mail order catalog? An elegant serif typeface is used throughout. (Sorry, it's text size only and too small to upload a scan.) It's got oldstyle numerals (descenders drop below the baseline). It's most idiosyncratic quirk: the cap Es look like numeral 3s -- sort of like Emigre's Tarzana face, only this is an oldstyle serif font. (It doesn't appear on either the Nordstrom or Tommy Bahama web site either. I already checked.) Can anybody help identify this beautiful typeface?</p>"
