    user_name: Thomas Phinney
    user_path: null
    date_raw: 11 Nov 2004 — 9:35am
    date: 2004-11-11T09:35:00
    votes: null
    html: <p>No. Word has kerning off by default, and if you turn it on you get the kerning built into the font. <br> <br>Or at least you're supposed to. For a few years, every other Mac version of Word broke kerning by reading the pairs backwards. So you'd end up with kerning for aV but not Va, that kind of thing. I believe they have gotten over this one now. <br> <br>Cheers, <br> <br>T</p>
