  html: <p>Let me begin by saying that I actually don't have a problem with Microsoft as a corporation, however... <br> <br>What's the deal with the really [really!] bad kerning of some diacritical characters (both tilde vowels and macron vowels) in Times New Roman in MS Word? <br> <br>I just didn't expect two industry standards (Word and TNR) to act so sporadically; I really thought every aspect of TNR would have been absolutely perfect. <br> <br>Si?</p>
