    html: <p>Scott, I am afraid there are no kerning pairs for accented characters in TNR at all. I have just looked at its kerning table and it lists 877 pairs. If you take into account that the font contains over 1600 glyphs, you can imagine how far from perfect this font is. <br>Si, I hope you need not see any screenshots as proof, don</p>
