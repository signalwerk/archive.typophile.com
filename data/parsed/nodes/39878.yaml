    html: <p>My impressions from a recent visit to China match Jongseong's. Unofficially, many Chinese have co opted the Yen sign (¥), especially in contexts they feel to be international. There seems to be no official  typographical symbol for the yuan, yet. The government of Taiwan calls their currency "New Taiwan Dollar", abbreviated NT$.</p>
