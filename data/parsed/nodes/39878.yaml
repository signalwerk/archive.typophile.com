    <p>Today I ran across the currency Symbol for the Yuan (Chinese Currency) U+5143 here</p>
    <p><a href="http://www.decodeunicode.org/en/U+5143" title="http://www.decodeunicode.org/en/U+5143">http://www.decodeunicode.org/en/U+5143</a></p>
    <p>And I wondered if it would be prudent to add to the set of major currencies that my monospaced programmer's font supports. But maybe there is a reason why this isn't standard- (yet?). Maybe there is a latin abreviation that's used. Maybe because the Yuan doesn't float in currency trading it isn't relevant. Or maybe it's time we all added the Yuan symbol!</p>
    <p>What do you think?</p>
