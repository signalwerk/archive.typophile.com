      <p>First, let me clear up a slight mistake I made. I almost made it sound like 元 is a variant form of the traditional ideograph for yuan, 圓. It is not. It is a standard ideograph in its own right, of similar pronunciation but quite independent origins from 圓, with the meaning of "fundamental" or "element". Like most Koreans, I don't speak Chinese although I wish I did, and barely read some hundreds of Sino-Korean characters, as in knowing their Korean pronunciations and having a vague sense of their meanings.</p>
      <p>So when I was in China and saw signs giving prices in the form 100元, I knew that 元 had the sound value of "won" in Korean (which corresponds to yuan), and immediately realized that it was the ideograph being used for yuan. Though I should have known better and in fact had a vague idea of what had happened, until I looked it up just now, I didn't know for sure that the Mainland Chinese just adopted a simpler ideograph with the same sound as the symbol for the currency yuan.</p>
      <p>I've visited China three times for a total of around three months. I've never been to Hong Kong, and only briefly visited Singapore too long ago to have any memory of the Chinese price signs there. So I only have fleeting impressions of how yuan is written in China.</p>
      <p>As I recall, in printed signs and price tags, both the forms ¥100 and 100元 are used. In department stores, I recall the form ¥100 being used more often, but don't quote me on that. In handwritten signs, the form 100元 seems to predominate. I might have seen other permutations like 100 RMB where RMB stands for the Mainland currency <em>renminbi</em>. When the context is clear, the numbers alone may be used to indicate a price. I've never seen the traditional ideograph 圓 or its simplified variant 圆 used to indicate price in Mainland China. Bear in mind though that I've only seen signs and tags, not what's used in books or magazines for example. So there's the possibility that the traditional ideograph is reserved for more formal, literary uses.</p>
      <p>As for Unicode code points, 圓 is U+5713 and 圆 is U+5706, both different from U+5143 for 元. Unicode encodes traditional and simplified Chinese characters separately.</p>
      <p>I also found <a href="http://www.alanwood.net/unicode/currency_symbols.html" rel="nofollow">this page</a> which lists 圎 (U+570E) and 圜 (U+571C) as variants of the same ideograph. The page also describes the traditional ideograph 圓 as the currency symbol used in Hong Kong and Taiwan (I've been to neither).</p>
      <p>So what about the Korean won? The Korean dictionary I looked up has separate entries for "won", the currency currently in use, and for "won", the historical currency before the currency reform of February 1954 when the <em>hwan</em> replaced the won. The difference? The latter is written as 圓 in <em>hanja</em>, the Chinese characters used for Korean; the former is not written in <em>hanja</em>. Won is ultimately a cognate of yuan and yen, but I guess the public and/or the powers that be decided that any sense of the etymological origin of the word ("round object") has been lost by now and has been entirely replaced with the sense of "unit of currency".</p>
      <p>So legally and properly, the (current) Korean won has no Chinese ideograph equivalent. However, "won" is a short enough, monosyllabic name that the Korean alphabet spelling 원 is used in most price signs and tags, as in 5000원. The same price may also be listed as ₩5000 in print or more rarely in handwriting (₩ is the currency symbol for the won).</p>
      <p>I think word order might be an important reason why the currency is "written out" rather than indicated by the currency symbol; we say "one hundred dollars", which is better reflected in writing "100 dollars" rather than "$100". Whereas in English, writing out "dollars" is unwieldy compared to just writing "$", in Chinese, Japanese, and Korean (as well as Thai, I might add), "writing out" the names for the currency is less cumbersome and so makes using currency symbols like ¥ and ₩ less pressing alternatives.</p>
