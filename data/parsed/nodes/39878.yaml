      <p>I was wondering what you were referring to when I saw the topic. Well, 元 (U+5143) <em>is</em> a symbol for the yuan, but it is not a currency symbol in the vein of $, €, or £. It is a Chinese ideograph.</p>
      <p>I guess because of the nature of the Chinese writing system, many Chinese characters can be used in a way they can be considered symbols, and in the case of 元, it functions as a currency symbol. But keep in mind that many single Chinese characters stand for single words, and 元 standing for 'yuan' is a typical example of that. I don't have one at hand, but I'd think that Chinese dictionaries would include 元 as a character, whereas for example $ would not be considered a part of even an extended latin alphabet.</p>
      <p>The character 元 is an interesting one though, because it bears little resemblance to the traditional character for 'yuan' is 圓 (the character for 'circular object'), or in the Mainland simplification, 圆. It is an übersimplified, informal character that must have been invented to avoid writing ten strokes or more for every mention of yuan in shop signs.</p>
      <p>As displayed prominently on Japanese bank notes, the Japanese yen--which shares the character etymology of 圓 with yuan--uses a similarly simplified character 円.</p>
      <p>So to answer your question, I'm not sure 元 (or 円) would be suitable for a monospace font, or indeed any font not supporting any other Chinese characters. Also, in "monospace" fonts supporting Chinese characters, the Chinese characters usually take up double the space of the usual monospace glyphs, and it might be jarring to see a "half-width" form of a Chinese character. Still, you're welcome to experiment.</p>
      <p>The currency symbol for yuan is ¥, which it shares with the yen. As used for the yuan, ¥ can have either one or two crossbars; as I remember, two bars are preferred for the yen.</p>
