    html: <p>I agree. Working at 100% eliminates another variable for those doing the production. I've had to produce signs at smaller sizes before, however, and find myself being incredibly careful and giving clear instructions to my rep and the production people. As long as you sign off on a PO or Work Order that agrees with what you need to end up with you should be, ok. But, you see, the word "should" scares me to death. I've been known to call people twice to make sure we are on the same page.</p>
