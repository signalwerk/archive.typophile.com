  html: <p>Can anyone recommend the best way to set up a 20-ft long banner in Illustrator? Is it to layout the banner at 10-ft and then have it printed at 200%?</p>
  html_clean: <p>Can anyone recommend the best way to set up a 20-ft long banner in Illustrator? Is it to layout the banner at 10-ft and then have it printed at 200%?</p>
