    html: |-
      <p>I've done many large format signs in Illustrator, and it's important that you talk directly with the printer before proceeding.  Depending on the media and the printer, you may encounter major problems with certain design elements. </p>
      <p>On duratrans material, for example, I've seen vector gradients print as choppy stripes, depending on the printer.  There are tricks to resolve this, but only the printer knows how to fix it -- and if it can be fixed. Sometimes it can't be fixed, so it's better to know beforehand and design around the caveats.</p>
      <p>Good Luck!</p>
      <p><a href="http://www.eileenburke.org" rel="nofollow">Eileen Burke Graphic Design</a></p>
