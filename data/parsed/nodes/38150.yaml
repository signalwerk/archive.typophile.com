    html: |-
      <p>I just did a series of billboards that were anywhere from 40' to 62' feet wide in Illy. With large signage call the printer and find out what they want you to do and then deliver it.</p>
      <p>I have worked from 1/48 scale in Illy to full scale in Photoshop and everywhere in between.</p>
      <p>Good communication with the vendor will get you there.</p>
      <p>pbc</p>
