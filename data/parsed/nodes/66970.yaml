    <p>Named after its original creator, typeface designer Sumner Stone, the new 24-font ITC Stone® Sans II suite of typefaces expands range of widths and weights offered by the original ITC Stone Sans design. </p>
    <p>In his role as lead designer and project director, <a class="freelinking external" href="http://www.fonts.com/AboutFonts/DesignerProfiles/SumnerStone.htm">Sumner Stone</a> collaborated with Jim Wasco of Monotype Imaging and typeface designer Delve Withrington to rework the original ITC Stone Sans design. One of the objectives was to include an expanded range of widths and weights. “These fonts had enjoyed great popularity for many years – during which graphic designers repeatedly asked for more weights and condensed designs in the family,” said Stone. “Their comments were the impetus.”</p>
    <p>ITC Stone Sans II comprises 24 typefaces, including six weights ranging from light to extra bold. An italic counterpart and suite of condensed designs complements each of the weights. The ITC Stone Sans “super” family of 48 typefaces includes the original ITC Stone Sans design, along with the ITC Stone Serif, ITC Stone Humanist, ITC Stone Informal and now the ITC Stone Sans II typeface families. ITC Stone Sans can be viewed online on a wide range of websites including <a href="http://www.fonts.com" title="www.fonts.com">www.fonts.com</a>, <a href="http://www.itcfonts.com" title="www.itcfonts.com">www.itcfonts.com</a>, <a href="http://www.linotype.com" title="www.linotype.com">www.linotype.com</a> and <a href="http://www.faces.co.uk" title="www.faces.co.uk">www.faces.co.uk</a>. </p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/StoneSansII_hires small_6340.JPG"></div><p></p>
