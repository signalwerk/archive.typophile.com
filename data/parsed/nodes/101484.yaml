      <p>Just being a little careful here. A number of the threads you've started concern using type for what might be considered "commercial" work. "Not-for-Profit" isn't the same thing as "non-commercial" -- otherwise, most any university press could use these fonts. And that's not the case; they can't.</p>
      <p>I'm not a lawyer &amp; don't know, but if you publish journals &amp; there is any fee at all for them, even if, in your eye, it is just to cover some of the distribution costs, Brill might consider that commercial &amp; outside the license.</p>
      <p>Best might be to write Brill &amp; explain your intended uses, if  for any kind of publishing.</p>
