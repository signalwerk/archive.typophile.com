      <p>Since I have a keyboard which allows exploration of such fonts [*] (and since I thought that it would help in showing the docs of the keyboard :-[) I did some (really trivial) experiments with the font.  I investigated only diacritics on the ffl ligature (and the related topics).  The results are: (a) very nice and impressive; (b) showing the limitations of the approach.  (Instead of (b), they may be <em>just</em> bugs. ;-)</p>
      <p>I focus on these: ƚ̧́ ļ́l̊́ ĺ̨.  Note that on ƚ the cedilla is shown as ‘ₛ’, but on l it is shown as comma.  One can put the stress (=acute) mark on l-ogonek, but not on l-cedilla. (This might be related to the exponential blowup of number of needed OT substitutions; or they may be just bugs…. On the other hand, I suspect that one do Unicode-like reordering of diacritics with linearly increasing number of rules — must think about it more…)  (And maybe John just <strong>knows</strong> that ļ is never a vowel; I do not know — I do not speak languages where l is a vowel. ;-)</p>
      <p>But <em>this</em> is just on the theoretical front; I did not try to invent a scenario where this would be a real-life problem. The major problem for end-user applications is that the font is “a specialized font”, so does not play games with the font environment. A lot of useful glyphs are missing (I did not try to time this, but my first impression is that the coverage for LCG is about the same as one of DejaVu, which is somewhere about end-of-90s/beg-of-00s). And when they are missing, they are not just let be subbed by <code>.notdef</code>: they completely disappear (in most of the cases: empty 0-width glyph) or are drawn as an explicit placeholder glyph (I did not see the latter in action, but this is what the <code>character map</code> shows; maybe this is circumvented by OT features).</p>
      <p>Essentially, this means that systems which pick up a font automatically to show missing glyphs will be confused and will think that Brill supports all these “empty” characters.  Which would mess up things enormously — the text which was shown fine before Brill was installed may now be not shown (and not shown in a very disasterous way — by just disappearing).  (This is exactly the problem which forced me to start to tinker with <code>GNU unifont</code>.)</p>
      <p>  Ex: ₙₘₗ ⲁⲗⲫⲁ ⲃⲓⲇⲁ ⲅⲁⲙⲁ Ꚇꚁ꠷ нⷺт ꞡꞡ ļᶂḟƚ̧́</p>
      <p>  [*] <a href="http://k.ilyaz.org/iz" title="http://k.ilyaz.org/iz">http://k.ilyaz.org/iz</a></p>
    html_clean: |-
