      <p>Ilya, in what environment are you testing, and do you know whether OpenType GSUB and GPOS are properly supported (note that, for example, there is a bug in Adobe InDesign, up to and including CS6, that fails to handle {ccmp} decompositions for extended combining mark sequences lookups resulting in incorrect positioning of combining marks relative to precomposed diacritic characters that should be decomposed by the font).</p>
      <p>It looks like there may be some issues with multiple mark positioning on l. Not sure why, but probably fixable. Thanks.</p>
      <p><em>Note that on ƚ the cedilla is shown as ‘ₛ’, but on l it is shown as comma.</em></p>
      <p>That seems to be because some software performs a character level substitution of l + combining cedilla to the Baltic ļ.</p>
      <p>When you say 'a lot of useful glyphs are missing', I don't know whether you mean glyphs or characters. The character set coverage was defined to meet Brill's publishing needs. They had an extensive wishlist, based on current publication lists, review of existing publications, and new series. Now that the initial release of the fonts has been made, I anticipate review of possible additions, including some characters that have been added to Unicode since the glyph set was originally spec'd.</p>
      <p>The font contains a clearly identifiable .notdef glyph, and if this is not being displayed in place of unsupported characters, then that is a software problem, not a font issue. Specifically, I think what you are seeing is the result of software not recognising fairly recent Unicode additions as characters, and failing to fall back to the .notdef glyph. I pasted your example string into Wordad on Windows Vista, and depending on what font I select I get various different permutations of invisible and .notdef glyphs. In NotePad, however, I get consistent .notdef glyph display for all unsupported characters. This tells me that the problem is likely something to do with RichEdit font fallback mechanisms.</p>
