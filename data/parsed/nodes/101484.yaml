  html: <p>So far I haven't seen much comment about John Hudson's <a class="freelinking external" href="http://www.brill.com/author-gateway/brill-fonts" rel="nofollow">Brill</a> font. It was great news to me, but all I've found was the pdfs on Brill's webpage. It sounds strange it hasn't received much comment or reviews so far -- or am I missing something?</p>
