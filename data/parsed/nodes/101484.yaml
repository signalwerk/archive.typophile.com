      <p>Custom proprietary fonts, even if also made publicly available (for non-commercial use), tend not to attract as much comment as new retail font releases. Which is fine by me: I know the fonts are getting good use by Brill, and have had some nice emails from individuals using them for e.g. Phd dissertations.</p>
      <p>If you're interested in commentary about how the fonts were built, rather than about the design, check out this video of the talk <a href="http://www.youtube.com/watch?v=24-HQ236Tyc" rel="nofollow">Text to Typeform,</a> which I delivered at Brill's symposium on type and scholarship last November. [Apologies for the staggering number of times I say 'um' and 'ur' during the talk: I'm barely aware of it while I'm speaking, and always appalled when I hear recordings afterwards!]</p>
