      <p>The Windows Character Map is notoriously unreliable as an indicator of what a font actually contains, because it makes use of the same system fallback mechanisms that also affect -- or afflict -- Wordpad and Word. So, for instance, it will display Arabic and Indic characters from a fallback font for pretty much any font, even though the font does not support them. For instance, it shows this for Brill, even though Brill supports no Indic scripts:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/charmapsucks_6649.png"></div><p></p>
      <p>As you note, at other times Character Map shows the .notdef glyph for unsupported characters, and sometimes just a blank cell. I long ago concluded that the purpose of the Character Map tool is <em>character selection</em>, and there's no point to it providing a selection of fonts at all, especially since it's copy-to-clipboard function doesn't include font selection formatting.</p>
      <p>With regard to the fallback issues I referred to in Wordpad, this is what I see when I copy your example string from FireFox into WordPad and set it in a variety font fonts:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/fallbacksucks_3977.png"></div><p></p>
      <p>What you are seeing here is a variety of different failures. Some fonts display .notdef for some unsupported characters, none of the fonts display anything at all for the U+A6xx range characters, all of the fonts display something recognisable for н and т even though most of them do not actually support those characters (i.e. font fallback is being used).</p>
