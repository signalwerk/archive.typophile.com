      <p>I see your point. At that time I just wished I had some leverage to suggest, as future editor/translator of the publication(s), the fonts/look for the actual designer. The experience with the actual design of academic journals I published in was rather unpleasant, so I thought, if I'm in charge of some publication or other, I won't let a book that cost so much in terms of time and money be published, and sold at a reasonable (that is, expensive) price, but still in Times New Roman. I always thought that, even if the publication is open access and also available online (the case with all my published articles), it does deserve some attention.</p>
      <p>Otherwise, all I do is just typeset my all articles and handouts for students -- I wouldn't dare give them some "12pt double spaced Times ragged right" kind of syllabus.</p>
