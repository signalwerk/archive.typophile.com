    html: <p>I have some problems with the initials, the D is too round and C too closed. If i squint my eyes it reads like almost as "Oon Oorleone". <br>The combination D-o looks tight.  <br>Perhaps the upward stroke of "l" should join?  <br>Perhaps the joining stroke between o and r could do a deeper "dive"? The large white space under the r looks a bit problematic. <br> <br> <br>Even if I'm complaining I like the overall feel a lot.</p>
