    html: |-
      <p>True, and I have done that for some of the ligatures. But that only applies to those ligatures that occur indiscriminately; that is, they always appear, regardless of context.</p>
      <p>Perhaps I left out the most important piece of information. In the example above, it doesn't look like this ligature would need to be in the 'clig', it could just as well be in the 'liga' feature. But the reason it has to be here is that it actually looks like this:</p>
      <p>sub t.alt1’ u.alt2’ [@LETTERS @WORD_BREAKS] by t_u.alt1;</p>
      <p>Since there are an arbitrary number of t_u ligatures (not enough to fill all the slots seen by the flipper), then t_u cannot belong to a set of variations. It has to live outside @SET_ONE, @SET_TWO, etc. In order, then, for the character that follows to pick up on continuing the sequence established by the flipper, there has to be a letter typed <em>after</em> the ligature before the ligature even forms. That way, there is a letter after the ligature that is part of one of the sets, and the flipping sequence can continue as planned, even though the ligature itself does not belong to a set.</p>
      <p>Does that make sense? So, odd as it may seem, the ligature's context matters, even though the context is: "as long as it's followed by anything at all".</p>
      <p>Alan</p>
