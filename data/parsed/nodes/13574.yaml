    html: |-
      <p>FYI --<br>
      A quick summary of the Century Family before Matthew Carter</p>
      <p>Theodore Low DeVinne (1829--1914), printer of <em>The Century</em> magazine, designed a stronger, bolder and more readable face for the magazine and commissioned Linn Boyd Benton (1844--1932) of ATF to cut it.</p>
      <p>L.B. Benton cut it on the newly invented Benton punch-cutting machine and in 1895 was christened Century Roman. Afterwards, a companion face was created for ATF by L.B. Benton: Century no. 2, later called Century Broad-face. This face became the basis for Century Expanded, designed by L.B.'s son, Morris Fuller Benton in 1902. Over the course of three more years, the italic, bold and bold italics were developed.</p>
      <p>Then after a few more years, Morris Fuller Benton developed Century Oldstyle.</p>
      <p><em>"While the essential appearance of Century Roman and Century Expanded derived from Bodoni and Didot, that of Century Oldstyle seems to have been based on Caslon."</em> -- Paul Shaw</p>
      <p>In 1915, redevelopment of Oldstyle face began and was renamed Century Book.</p>
      <p>Soon after, ATF was approached by Ginn &amp; Co., the textbook publisher, with a request for a new typeface for schoolbooks. M.F. Benton began review of research done at Clark University on the relationship between the legibility of type and the eyesight of children.</p>
      <p>Consequently, Benton increased the space between letter, the x-height of each letter, and the weight of each stroke, and balanced the color of the type by opening up the counters. The result was Century Schoolbook, completed in 1919.</p>
      <p>In 1964 ATF commissioned Charles E. Hughes to design a new proportion for Century Expanded... the result, Century Nova, which was more condensed.</p>
      <p>Under license from ATF, Tony Stan designed the sixteen weight ITC Century family between 1975 and 1980 for International Typeface Corporation.</p>
      <p>The greater part of this summary is from<br>
      THE CENTURY FAMILY<br>
      an article by Paul Shaw for <em>Fine Print</em> magazine</p>
      <p>Yes, I'm old, but I'm back in style!</p>
