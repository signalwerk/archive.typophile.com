    html: <p>Linn Boyd Benton designed the metal 'Century'. His son Morris Fuller Benton designed a number of variations, including 'Century Schoolbook'. The father invented the pantographic punch cutter, but the son was the better type designer. Who worked on the digital versions is not clear on the web sites.</p>
