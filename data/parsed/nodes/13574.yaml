    html: <p>New Century Schoolbook was designed 1979-81 in the New York Lettering office of Merganthaler Linotype based on Century Schoolbook, long after the Benton's had passed on. It was the second face, after New Baskerville, that was digitized and expanded using Ikarus (digital technology). The Bitstream version is a near exact copy, only being moved from a 54 unit to a 2000 or so unit design.</p>
