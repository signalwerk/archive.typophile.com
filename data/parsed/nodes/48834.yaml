    <p>Hi,</p>
    <p>I’m looking at getting some opinions on a logo I’m currently designing for a photographer.</p>
    <p>The client likes to give the impression of being a person and not a company, and therefore doesn’t want over the top branding. It was therefore my job to come up with something simple and to the point.</p>
    <p>With this in mind I simply want to focus on creating a logo that was simple yet recognizable (as it will also be used as a watermark on his images). So far I have been playing with the his name and have come up with the following 4 alternatives.</p>
    <p>Comments, suggestions, critique welcome by all...</p>
    <p>:)</p>
