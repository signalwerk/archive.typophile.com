    html: |-
      <p>My thoughts exactly. I've never been a fan of Iowan for that reason alone (but the caps are indeed lovely). Satyr is a bit taller in the x-height than the classical Jenson model too, but the much sturdier and less sloping top serifs makes the ascenders appear somewhat taller than they really are, when compared to those of a Venetian typeface. It is also optimised for ten points, not twelve or fourteen. Then again, Satyr is not a Venetian, it just shares a few traits. I'd say it belongs to the non-existing category Nordic Old-style, if any. </p>
      <p>Anyone know which size of Centaur was used for Monotype's digitisation, by the way? Why did it end up so disastrously thin and frail? Has anyone tried to redo it properly?</p>
