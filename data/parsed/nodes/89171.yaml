    <p>Hello All,</p>
    <p>I'm doing a simple business card set in Centaur. The "@" symbol (for email address) looks to be generic, and doesn't have the feel for the face, at large (a historical afterthought). Would there be any alternatives to this? Your suggestions are greatly appreciated.</p>
    <p>Thanks in advance.</p>
