    <p>I have problems identifying the sans on this movie poster for <em>Somewhere,</em> the latest movie by Sofia Coppola. Please note the lowercase "g" with open bowl, the descending "f", the characteristic uppercase "S" and the high "M".</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/somewhere-8132-poster-large_6179.jpeg"></div><p></p>
