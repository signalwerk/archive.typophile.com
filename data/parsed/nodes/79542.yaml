      <p>Excellent suggestion, fredo.  No. 3 Roman is such a gorgeous set of letters. Claude would be proud.  Although, what did you mean about your 'dipped in chocolate' comment? Do you think those faces are too sweet, too homogenized to do justice to the originals?</p>
      <p>"Renard belongs to the broad category of Garamonds but occupies a unique place among them. The roman descends - unlike some other Garamonds - from a clearly traceable historical origin. In other words: it's from a good pedigree with decent papers. Next to that it's the only Garamond which can rightfully claim to be 'Flemish'. Not only because of its roots, but certainly due to its almost Breughelian features. Which is something that's lacking not only in competitive revivals, but in any other Garamond."  - <a href="http://www.teff.nl/fonts/renard/" title="http://www.teff.nl/fonts/renard/">http://www.teff.nl/fonts/renard/</a></p>
