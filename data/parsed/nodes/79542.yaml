      <p>I enjoy reading the more modern interpretation of Garamond, like Sabon, immensely! I find the new Adobe font Garamond Premiere Pro needs good printing conditions, because of the more historical accurate lower x-height, so personally as non professional, I would have no use for it. </p>
      <p>Similar to my preference for Sabon, I admire Garamond (sometimes mixed with other old-style influences) <em>inspired</em> fonts like <a class="freelinking external" href="http://www.terminaldesign.com/Fonts/#/Rawlinson2" rel="nofollow">Rawlinson 2.0</a>, Lyon, <a class="freelinking external" href="http://new.myfonts.com/fonts/positype/epic/" rel="nofollow">Epic</a>, <a class="freelinking external" href="http://www.felicianotypefoundry.com/cms/fonts/merlo" rel="nofollow">Merlo</a>, etc… I personally would love to see more of them in use. But I guess book design is a conservative business, why implement a new typeface (with print optimization process involved as well) if one has a set of typefaces already, which proofed to be reliable.</p>
