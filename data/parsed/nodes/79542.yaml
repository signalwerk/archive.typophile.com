      <p>Good points.</p>
      <p>Another point of discussion is drawing the line between a Garamond and a Garalde.  Of course Garamond has become the archetypal Garalde, but a typeface is only a "Garamond revival" if the type designer was attempting to recreate/interpret the work of Claude Garamond.  Anything else that simply falls under the style is a Garalde.  Is that oversimplifying it?</p>
      <p>For example:  Adobe/Stempel/Berthold Garamonds are Garamonds, and by inclusion, Garaldes. But ITC Galliard, Plantin, MVB Verdigris, Rongel, Espinosa Nova et al are Garaldes but not Garamonds.</p>
