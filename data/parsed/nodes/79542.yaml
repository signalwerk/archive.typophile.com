      <p>Uh, Trevor, I just want to be clear. Are you saying you’re excluding general Garaldes, but intend to add Renard to your set of true Garamonds? </p>
      <p>If so, then I think you’ve just contradicted your own definition.</p>
      <blockquote><p>“Renard is an interpretation of a 2-line Double Pica Roman (Gros Canon) cut by the Flemisch punchcutter Hendrik van den Keere around 1570.”</p></blockquote>
      <p>Van den Keere may have possessed and cast type from some of Garamond’s matrices during his career as a typefounder. And he was undoubtedly influenced by Garamond, as were most of his contemporaries. But this Gros Canon was from his own punches. </p>
      <p>I don’t think Van den Keere should be considered any truer a “Garamond” (as opposed to working in the general “Garalde” style) than Robert Granjon, for example. Which would make Renard no more eligible for your list, in my opinion, than Galliard and Plantin. </p>
      <p>Don’t get me wrong. They’re all admirable faces. I’m just trying to clarify your scheme and intent.</p>
