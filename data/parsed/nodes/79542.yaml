    html: |-
      <p><em>…sanded lens effect…</em></p>
      <p>The blobbyness which many old style revivals exhibit is a parsing of the ink spread that was a strong feature of printing in the old style era, on rag paper. Goudy was a pioneer of this look, and both Monotype Garamond (in metal) and Tony Stan's ITC Garamond had a lot of it.</p>
      <p>It comes from basing a display cut (or single master) on a small size letterpress sample, and resisting the temptation to clean things up. Seneca has that effect too.</p>
      <p><em>…Psychedlic Oldstyle…</em></p>
      <p>I don't think so. Trying to capture the sometime strange proportions, irregularity and bounce of old letterpress printing in newer, more precise technology, is a clear-headed design strategy, not whimsical. It's an integral part of the look.<br>
      The vast majority of revivals, which make everything so neat, are white bread emasculations, IMO.<br>
      And not just my opinion, Goudy, Cooper, Weiss and Koch were similarly minded, back in the Historicist era; experimental perhaps, but not on hallucinogens.</p>
