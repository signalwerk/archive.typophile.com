      <p>Adobe Garamond - Slimbach's first rendition - is still my favourite digital Garamond, a version I've learned to love after using it. I still prefer it to Slimbach's second (and historically, apparently, more accurate) version, the Premier. Most of other digital renditions of metal-era types (Sabon, Simoncini, Monotype et al.) look poor when compared to the original ones.</p>
      <p>For Andreas Stötzner: Elsner and Flake license a Typoart Garamond.</p>
