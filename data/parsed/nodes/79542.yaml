    html: <p>Not too sweet. Mushy, more like it. I find them too soft around the edges. I assume it's done to imitate the inkspread and impression of Garamond-era printing, and I know people appreciate them for their warm fuzziness, but if I wanted that, I'd go for Cooper Black.</p>
