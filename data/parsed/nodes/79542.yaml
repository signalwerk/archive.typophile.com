      <p>I suppose you deal with Slimbach’s older Garamond here which Adobe replaced by a new (and better) one some years ago.</p>
      <p>Preferences?<br>
      As a reader of books printed in Germany I am quite fond of the Stempel version too, though it is not actually the most garamondish one (compared to the original). The next in my ranking would be the <cite>Typoart Garamond</cite> by Herbert Thannhäuser, followed by Monotype and Adobe.</p>
      <p>Perhaps someone out here can shed light on the availability of a digital Typoart version –?</p>
      <p>Last and least, the ITC sort is a non-starter for me, and has always been.</p>
