    html: |-
      <p>Appears to be an old Image Club Graphics typeface called Andrich Minerva, but I can’t find a current source for it:<br>
      <a href="http://www.findmyfont.com/index.php/fonts/font-preview?fset=Image-Club-Graphics%20%2F%20%28Commercial%29&amp;ffam=Andrich%20Minerva%20-%20Regular&amp;fstyle=&amp;fsize=60&amp;fid=63e7b36a8e9b624045c8de12a3508089&amp;wrap=2&amp;text=bespoke%20%26%20co" title="http://www.findmyfont.com/index.php/fonts/font-preview?fset=Image-Club-Graphics%20%2F%20%28Commercial%29&amp;ffam=Andrich%20Minerva%20-%20Regular&amp;fstyle=&amp;fsize=60&amp;fid=63e7b36a8e9b624045c8de12a3508089&amp;wrap=2&amp;text=bespoke%20%26%20co">http://www.findmyfont.com/index.php/fonts/font-preview?fset=Image-Club-G...</a></p>
      <p>ITC Century Light is very similar:<br>
      <a href="http://www.myfonts.com/fonts/itc/century/" title="http://www.myfonts.com/fonts/itc/century/">http://www.myfonts.com/fonts/itc/century/</a></p>
      <p>So is Chronicle Display Extra Light (though it’s ampersand is a bit more ornate):<br>
      <a href="http://www.typography.com/fonts/chronicle-text/styles/" title="http://www.typography.com/fonts/chronicle-text/styles/">http://www.typography.com/fonts/chronicle-text/styles/</a></p>
