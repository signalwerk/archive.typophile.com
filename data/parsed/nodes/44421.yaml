    date: 2008-04-21T18:59:00
    date_raw: 21 Apr 2008 — 6:59pm
    votes: null
    html: "<p>Image Club Graphics digitized a version of ITC Didi from large format Velox masters back in 1989. When Image Club was part of Adobe Systems (c. 1998), several hundred typeafces (including our ITC Didi) were discontinued. It was determined that the quality of the outlines and metrics in those faces were simply not up to our upgraded technical and aesthetic standards at the time. Due to a lack of resources, ITC Didi was never redigitized.</p>

      <p>If your are able to locate an older copy of one of Image Club\x1d’s Letterpress CDs, ITC Didi will be part of it. Unfortunately, my stash of those old discs has long since been exhausted.</p>

      <p>g.</p>"
    html_clean: "<p>Image Club Graphics digitized a version of ITC Didi from large format Velox masters back in 1989. When Image Club was part of Adobe Systems (c. 1998), several hundred typeafces (including our ITC Didi) were discontinued. It was determined that the quality of the outlines and metrics in those faces were simply not up to our upgraded technical and aesthetic standards at the time. Due to a lack of resources, ITC Didi was never redigitized.</p>

      <p>If your are able to locate an older copy of one of Image Club\x1d’s Letterpress CDs, ITC Didi will be part of it. Unfortunately, my stash of those old discs has long since been exhausted.</p>

      <p>g.</p>"
