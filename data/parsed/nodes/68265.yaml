      <p>I think this is probably the strongest of the bunch, and as I said in the other thread, I find it very difficult to critique work that is created under such vague guidelines. I shall attempt to give some feedback, hopefully it will be useful...</p>
      <p>I think the contrast between the type and the real world ingredients is too great, so when the quote is revealed, the viewer is not surprised because we already knew what was coming. There are several ways to go from here - the entire thing could be made solely from type like some of the <a href="http://www.youtube.com/watch?v=qBjLW5_dGAM">Pes</a> videos (where he uses unconventional objects in a conventional way), or the type and the ingredients are similar enough that the viewer never quite realizes that you are cutting up the items and making type from them until you get your quote at the end.</p>
      <p>I'm actually pretty bad at motion design and probably not the best person to be critiquing the work, but since you were so nice in the other thread I felt compelled to respond. Hopefully there's something you can use from what I wrote for future projects. </p>
      <p>Take care.</p>
