    <p>Hello,<br>
    <a href="http://vimeo.com/9685587">Typographic Video</a> was created by students in <a href="http://tannerwoodford.com/syllabus/2010s">Advanced Media</a>, a course in the <a href="http://design.asu.edu/sdi/">School of Design Innovation</a> at <a href="http://www.asu.edu">Arizona State University</a>. For more context on this work-in-progress, <a href="http://typophile.com/node/68269">see other videos from this class</a> or <a href="http://tannerwoodford.com/syllabus/2010s/1.html">read the official project description on the course syllabus</a>. The video was produced by Amy Ashton, Angie Copolillo, Josh Davis, Garrett Fox, Princess King-Taylor, Jennifer Lane, Adam Martin and Paris Polcyn.</p>
    <p><a href="http://vimeo.com/9685587">http://vimeo.com/9685587</a></p>
    <object width="600" height="450"><param name="allowfullscreen" value="true"><param name="allowscriptaccess" value="always"><param name="movie" value="http://vimeo.com/moogaloop.swf?clip_id=9685587&amp;server=vimeo.com&amp;show_title=1&amp;show_byline=1&amp;show_portrait=0&amp;color=00ADEF&amp;fullscreen=1"><embed src="http://vimeo.com/moogaloop.swf?clip_id=9685587&amp;server=vimeo.com&amp;show_title=1&amp;show_byline=1&amp;show_portrait=0&amp;color=00ADEF&amp;fullscreen=1" type="application/x-shockwave-flash" allowfullscreen="true" allowscriptaccess="always" width="600" height="450"></object><p><a href="http://vimeo.com/9685587">Typographic Video</a> from <a href="http://vimeo.com/parispolcyn">Paris Polcyn</a> on <a href="http://vimeo.com">Vimeo</a>.</p>
    <p>We look forward your feedback.<br>
    Thank you.</p>
