  html: |-
    <p>i'm trying to generate an open type font file, and fontlab keeps hanging up on me. the same file worked fine before i merged all of my contours. so now i have nice clean simplified outlines (presumably) but can't make an OT font. i am able to generate OT files from other vfb files.</p>
    <p>i also tried to generate a mac suitcase, which seems successful. but indesign says the outline is not available for the installed font.</p>
    <p>what am i missing here? the only thing i can somewhat pinpoint is that the paths may be corrupted somehow from when they were 'simplified'.</p>
