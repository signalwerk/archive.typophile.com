    html: |-
      <p>I'm just passing on a similar problem I had that was solved by replacing a corrupt outline.<br>
      I discovered it by a process of trial and error, by deleting half the glyphs in the font and seeing if it would compile, and so on. Another thing you can do is go round each path "next point" at a time, and if you click and there's no movement, then you know there is a double-point. All this is assuming that a corrupt path somewhere is the source of your difficulty, and not something else!</p>
