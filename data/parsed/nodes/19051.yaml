      <p><em>if i delete everything except the ‘a’, i can export. if i delete everything but the ‘b’, same deal</em></p>
      <p>Well, start from scratch and copy your glyphs in to a new vfb file. See if that works.<br>
      The import the metrics.</p>
      <p>Oh, and you need more than just the kern feature.</p>
