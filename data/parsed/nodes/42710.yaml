    html: |-
      <p>I looked at the first poster, and that looks like <a class="freelinking external" href="http://www.typography.com/fonts/font_styles.php?productLineID=100013" rel="nofollow">H&amp;FJ Knockout</a> (No. 70 , I think). There are 32 weights/widths, so picking the right one may involve using their test drive, but I think No. 70 looks pretty close to my eye.</p>
      <p>- Mike Yanega</p>
