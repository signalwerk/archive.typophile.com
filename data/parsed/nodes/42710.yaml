    html: |-
      <p>So far I have not found anything closer than Knockout. Another similar font is <a class="freelinking external" href="http://www.fontshop.com/search/?q=Rhode&amp;x=22&amp;y=9&amp;sample_text=WALKING%20FOSTER" rel="nofollow">Rhode Medium Condensed</a>, and it does have the right K, but the uneven arms of the E &amp; F are more like Knockout.</p>
      <p>It may be a customized mix of the two fonts, but more likely it is a customized version of Knockout, if I had to guess.</p>
      <p>- Mike Yanega</p>
