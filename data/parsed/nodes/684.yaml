  html: '<p>A lot of improvements have been made in version 1.08.002 of DTL FontMaster. New functionality has been added, the stability has been improved and the quality of the interface has been enhanced. An example of this is the use of anti-aliasing in the Font Administration tool. The actual generation of fonts has been made more simple in DTL DataMaster by adding a range of default settings. Besides this a new module has been added: DTL KernMaster, which makes it possible to generate kerning for a complete BE or IK database, including Cyrillic, Greek, Eastern-European, etc. at once.  <br> <br>More information can be found at: <a href="http://www.fontmaster.nl/Blogs/FMNews/" target="_blank">http://www.fontmaster.nl/Blogs/FMNews/</a> <br>Demo versions are available at the DTL FontMaster web site: <a href="http://www.fontmaster.nl" target="_blank">http://www.fontmaster.nl</a></p>'
  html_clean: '<p>A lot of improvements have been made in version 1.08.002 of DTL FontMaster. New functionality has been added, the stability has been improved and the quality of the interface has been enhanced. An example of this is the use of anti-aliasing in the Font Administration tool. The actual generation of fonts has been made more simple in DTL DataMaster by adding a range of default settings. Besides this a new module has been added: DTL KernMaster, which makes it possible to generate kerning for a complete BE or IK database, including Cyrillic, Greek, Eastern-European, etc. at once.  <br> <br>More information can be found at: <a href="http://www.fontmaster.nl/Blogs/FMNews/" target="_blank" class="link-external">http://www.fontmaster.nl/Blogs/FMNews/</a> <br>Demo versions are available at the DTL FontMaster web site: <a href="http://www.fontmaster.nl" target="_blank" class="link-external">http://www.fontmaster.nl</a></p>'
