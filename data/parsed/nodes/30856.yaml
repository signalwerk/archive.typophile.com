    html: <p>You're very welcome, Jeremy. I'm very excited to have made (apparently) valuable suggestions -- gives me more impetus to get started on my own creative endeavors. I really like how Chennai turned out, and I really like your suggestion about using alternates for body text. I think that the overshoot is now just about perfect, with the bowled characters sitting right where they should. That new Q is also terrific. I hope that I'll have a project that calls for me to buy it sometime soon!</p>
