    html: |-
      <p>Auric,</p>
      <p>I greatly appreciate your input throughout this process. </p>
      <p>I think I was having difficulty with the overshoot because of the rounded forms. There was a slight overshoot, and I though it was enough (it looked ok visually), but I took a look at VAG rounded’s overshoot and decided to extend mine.</p>
      <p>I tried a swash b, but it didn’t look right.</p>
      <p>I made the leg on the k and K uniform with the other ears and stems.</p>
      <p>I tried a really swoopy tail on the Q. It didn’t work because you couldn’t taper the tail and have it be unified with the face. However, I did do an alternate, and ultimately ended up with a better looking Q. Did the same with the R.</p>
      <p>Did a flat top for the traditional alternate.</p>
      <p>Good call on the y. Did an alternate for it.</p>
      <p>The font is available <a href="http://www.insignedesign.com/Typeface.aspx?FamilyName=Chennai" rel="nofollow">here</a>.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Chennai-Final_6583.gif"></div><p></p>
