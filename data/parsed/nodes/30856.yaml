    html: <p>The S seems to be falling backward (to the left) and the overshoot at the baseline for letters with bowls (b, g, and especially e) seems too much, as they all seem to be floating slightly above the baseline. Other than those two comments, I really like it. I agree with Jason completely; it also seems to echo the handdrawn architectural feel of <a href="http://typography.com/catalog/gothamrounded/index.html" rel="nofollow">Gotham Rounded</a>, although yours is very different. Being a sucker for alternate glyphs, I'd love to see nearly all of your capitals have more simplified versions, but the ones you show here are terrific!</p>
    html_clean: <p>The S seems to be falling backward (to the left) and the overshoot at the baseline for letters with bowls (b, g, and especially e) seems too much, as they all seem to be floating slightly above the baseline. Other than those two comments, I really like it. I agree with Jason completely; it also seems to echo the handdrawn architectural feel of <a href="http://typography.com/catalog/gothamrounded/index.html" rel="nofollow" class="link-external">Gotham Rounded</a>, although yours is very different. Being a sucker for alternate glyphs, I'd love to see nearly all of your capitals have more simplified versions, but the ones you show here are terrific!</p>
