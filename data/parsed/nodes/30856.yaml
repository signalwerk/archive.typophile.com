    votes: null
    html: |-
      <p>I really do like it, especially the ability to swap some of the characters for more traditional ones. Sometimes I'm in a mood for techno/futuristic, sometimes for just a soft typeface. But, as I mentioned before, I'd like alternates for even more glyphs (and a better name than "swash," which isn't quite appropriate here).</p>
      <p>Some particulars: I was just about to say that the bowled letters seemed still floaty, but now that I'm looking at it again, it's not as apparent. I think the amount of overshoot you used is still not enough; it's especially apparent in the e, which seems to be <em>slightly</em> above the baseline even though it probably touches it.</p>
      <p>a (both swash and not): I love both of them!<br>
      B: Needs to overshoot! Also seems to be tilting slightly forward.<br>
      b: I'd suggest a swash version, like you did with the d.<br>
      f: Terrific. I haven't seen too many descending f's in non-italic fonts.<br>
      g swash: The ear seems to big and obtrusive. Maybe make it horizontal or curl it.<br>
      K and k: Like the curved leg, but maybe you want to make that the alternate version?<br>
      Q: I'd like to see an alternate with an especially swoopy tail.<br>
      R: Same comment as the Q.<br>
      r no swash: Feels like it thins out at the curve, but maybe it's just the pixelization.<br>
      T: Not so crazy about it; the top feels like it curves awkwardly. Try a flat top?<br>
      t: I really like the short crossbars on the f and t.<br>
      y: Can you make an alternate like the straight-sided alternate capital?</p>
      <p>Hope that helps. Really nice work so far.</p>
