    html: |-
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/chennairound2_5495.gif"></div><p></p>
      <p>Thanks for the comments; I found them very useful, and appreciate all who took the time to do some critiquing.</p>
      <p>Metalfoot, thanks for the heads up about the site on Firefox. I have made the site so it is "useable" but not pretty under Firefox. Does anyone with Safari want to give it a try? I would greatly appreciate it.</p>
      <p>Cuttlefish, great comments about the direction. I hadn't really thought about Comic Sans, but I can see your points. I think that there IS a place somewhere between comic sans and VAG rounded. One influence is Futura, which probably gives it a slightly "childlike" quality. I also see your point about the e. I did some experimentation with it, but I still think it works as is. Does anyone think the e sticks out to much?</p>
      <p>Auric, I fixed the S: missed a chunk of vector from illustrator. I think I have the baseline float worked out better. </p>
      <p>I made a decision that the more simplified forms will be the dominant ones. To get to the more traditional forms you will have to turn OpenType swash on. How does everyone feel about that? Please ignore the temporary spacing. I'm primarily looking for letterform comments.</p>
      <p>Jeremy Dooley<br>
      <a href="http://www.insignedesign.com" title="www.insignedesign.com">www.insignedesign.com</a></p>
