    html: <p>I hope this doesn't come off the wrong way, but it looks like just the thing to use when Comic Sans just doesn't cut it and VAG Rounded is too formal. By that, I mean the style looks to be right on the edge between hand lettering and a more formal typeface. Mostly the curves of the horizontal bars of the uc, and the way the g and e are drawn contribute to the hand-lettered aesthetic, but the G and O appear to be nearly circular, lending a more formal, mechanical quality. Do you want to walk the line, or go to one side or the other with it?</p>
