    <p>Hello, my name is Aleix and I'm a spanish graphic design student. This is my first post, so be nice!! hehe</p>
    <p>My typography teacher wants us to do a type catalog about any typography subject. I chosed lettering and I divide it this way: </p>
    <ul>
    <li>[manual lettering] before computer age (I know a spanish letterer called <a class="freelinking external" href="http://www.neufville.com/Designer/RICROUS_.htm" rel="nofollow">Ricardo Russelot</a> but I can't find any info, I guess I'll just contact him)</li>
    <li>[computer age] before open type (I don't know any authors here... could be some emigre's fonts?)</li>
    <li>[computer age] after open type (underware, sudtipos, house industries?)</li>
    </ul>
    <p>I don't even know if this would be a good way to make the catalog sections. But this is not the main problem. The main problem is that I'm having a hard time finding info about lettering as I don't want to put so much info about the historical starting of writting, the romans, italics and so... I want to start more like about 1600-1700 or so, where people started making letterings for shops and so on.</p>
    <p>So, to sum it up, I just need to know if you guys think I'm going the right way on this, and if you could give me any links/names of authors/names of books where I can get the info I need for the catalog (mainly text and images).</p>
    <p>Thank you!!</p>
