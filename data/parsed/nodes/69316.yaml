    html: <p>There is a lot of lettering for advertising, packaging, signage that is difficult to attribute, meaning the lettering artists are anonymous. Much advertising lettering of the 20th century was done by experts with long careers, but who never had a presence beyond their work. The House Industries guys are very avid students of hand-lettering styles and the craftspeople who practiced hand-lettering; if you contact them, you might get some useful leads. They have already done a lot of research to discover the identities of otherwise forgotten lettering artists.</p>
