  date_raw: 9 Aug 2004 — 5:51pm
  votes: null
  html: <p>I've been hired by a major advertising firm (thanks to my art director friend) to design a font from the logo of a multi-million dollar company.  There is no existing font from which the logo was created. <br> <br>This is my first time designing an entire typeface for a specific product/company.  In the past, I've designed logos from my own font designs, but never in this scope. <br> <br>My main question is- how much do I charge?  And are there resources where I can find this information? <br> <br>Thanks.</p>
  html_clean: <p>I've been hired by a major advertising firm (thanks to my art director friend) to design a font from the logo of a multi-million dollar company.  There is no existing font from which the logo was created. <br> <br>This is my first time designing an entire typeface for a specific product/company.  In the past, I've designed logos from my own font designs, but never in this scope. <br> <br>My main question is- how much do I charge?  And are there resources where I can find this information? <br> <br>Thanks.</p>
