    html: "<p>Just curious, James, as I've never done this kind of work before: Wouldn't you factor in some sort of multiplier on top of a simple hourly charge, since the type will presumably become part of this mega-corp's identity? <br> <br>Surely most corporate identity folks charge more for a logo, for example, than just the time it took to develop it. <br> <br>(Not that $10,000 [50 hrs. x $200] is anything to sneeze at.) </p>"
