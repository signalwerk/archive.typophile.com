  html: |-
    <p>The October edition of the Metal Type newsletter is now out, as well as the usual Metal Type news, there are pictures and video footage of York Beer and Cider Festval - an annual event for craft and micro-breweries.</p>
    <p>Click this link to take a look at the video: <a href="http://j.mp/k5KA95" title="http://j.mp/k5KA95">http://j.mp/k5KA95</a></p>
    <p>I'm pleaseed to announce that the Printers' Tales ebook is now out.</p>
    <p>Kindle owners can buy it from Amazon US: <a href="http://j.mp/OhdJj6" title="http://j.mp/OhdJj6">http://j.mp/OhdJj6</a> or Amazon UK: <a href="http://j.mp/NRVdxY" title="http://j.mp/NRVdxY">http://j.mp/NRVdxY</a></p>
    <p>Most types of ebook readers are catered for with the Smashwords version: <a href="http://j.mp/QZF3Rz" title="http://j.mp/QZF3Rz">http://j.mp/QZF3Rz</a></p>
    <p>Subscribers to the Metal Type email newsletter will have received an exclusive code for 50% off at Smashwords (valid until October 14). If you would like to receive the code, use this link to subscribe to the newsletter before October 14: <a href="http://bit.ly/n3wkjc" title="http://bit.ly/n3wkjc">http://bit.ly/n3wkjc</a></p>
    <p>All the Best<br>
    Dave Hughes<br>
    York, UK</p>
