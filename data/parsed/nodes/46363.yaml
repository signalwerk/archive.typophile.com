    html: |-
      <p>Hi Kentlew</p>
      <p>Thanks for your message. A little bit of background about the criteria for choosing the fonts... </p>
      <p>The target market for the book is graphic design students and those starting out in a career in design, although more experienced designers would doubtless find it useful as well. The idea behind the book is to order the fonts featured by major aspects of function, allowing the reader to quickly identify a range of suitable fonts for a particular project at hand. The book is heavily illustrated with examples to demonstrate the range and variety of results achievable with a single font, examples which will hopefully provide both experienced designers and newbies with inspiration to apply to their own projects. Given our target audience there was a need to include a percentage of classics/tried and tested/"workhorses" as well as some more contemporary typefaces. In this regard, our consultant editor on the title, Bob Gordon of the University of Brighton, was ideally placed to direct the selection as he has massive experience with both design students and young/emerging typographers. What we're aiming for is a book that will stand the test of time though, so we believe it's important to maintain a proportion of "classics" (we have also found in our image research to date that there is no shortage of designers producing exciting and enduring work with these fonts). </p>
      <p>Coming back to the issue of artworks. Yes, we have found examples for the majority of fonts that we are looking to illustrate, these 170-odd are the ones that we are now directing our search towards... no fear: there will be 1000 fonts in the book!</p>
      <p>Any questions, please don't hesitate to ask!</p>
      <p>All the best</p>
      <p>James</p>
