    html: |-
      <p>Dear all</p>
      <p>First, a big thank you to all of those who have submitted work following my initial post. We have received some really interesting submissions and it will take some time to go through them and determine which ones we use for the book, but I will be in touch with you individually as soon as we have made our decisions to let you know if we will be using your work. </p>
      <p>Thank you also to all those who have responded to my initial post. Whether positive or not, all of your feedback is useful. It's good to see that the post generated some debate as well. Of course, it's an impossible task to keep everyone happy with a book of this type (a list of 1000 of anything will always divide opinion to some degree)... however, we're open to all types of feedback (although naturally we prefer the constructive type!). </p>
      <p>For those who were disappointed at the omission of certain fonts, please feel free to submit work. If you feel that we've made some glaring omissions we would welcome the opportunity to see examples of those fonts we have omitted... we're completely open-minded and prepared to have our minds changed on this one.</p>
      <p>Secondly, I just wanted to address the issue of font licenses. We are not, as some have suggested, soliciting works in order to obtain font licenses. We in fact have licenses already for all of the fonts that will be included in the book. </p>
      <p>Lastly, a reminder that the invitation for entries is still open. Deadline: 14 July.</p>
      <p>Thanks again for your interest and feedback.</p>
      <p>All the best</p>
      <p>James</p>
