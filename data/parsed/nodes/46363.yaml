      <p>Aw spit, what's the topic of this one again? Oh yeah, one time a few years ago a woman wrote to me to ask for permission to use one of my retail fonts in a book about typography, promising my font catalog URI would be printed next to samples of the font in the book when it was published. She conveniently made no mention of license fees due. She only asked for permission to use the font. I told her I was very busy and my time is worth money, and just answering her crawling request had cost me twenty bucks, and she certainly had my permission to use the font if she paid the license fee. She wrote back saying another font maker had granted permission to use their font at zero cost (no license fee) in the book. I told her that person was a  fool she had bilked into letting her use their font for free.</p>
