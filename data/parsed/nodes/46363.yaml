    <p><strong>Calling all designers, typographers and typophiles:</strong></p>
    <p>I am currently working on a major new international typography book – called “1000 Fonts” – which will be published by Chronicle Books in early 2009. I’m looking for outstanding examples of typography to illustrate the book.  </p>
    <p>I have already received a large number of artworks for the title, from huge agencies such as Saatchi &amp; Saatchi through to one man graphic design companies working out of bedroom studios: the only condition for work to be included in the book is that it is of the highest quality... and that it uses one of the fonts on our shortlist of 1000.  </p>
    <p>The book will cover typography in a wide variety of media, so examples ranging from publishing to corporate identity, product design to signage, are all encouraged. Also, feel free to submit as many examples of typography as you wish, using as many or as few of the fonts on our list as you like. </p>
    <p>A full list of the fonts which we need artworks for is at the foot of this message. The deadline for submissions is Monday 14 July 2008.</p>
    <p>If you would be interested in showcasing your work (alongside your URL) within the book, please get in touch at the contact details below, or upload your work directly to our FTP site, along with: your contact details, client details, the date the work was produced, and the font the work was produced with. If your entries are selected for inclusion, you will also receive a complimentary signed copy of the book.</p>
    <p>Thanks for reading, and I look forward to hearing from you,</p>
    <p>James Thomas<br>
    Senior Project Editor</p>
    <p>The Ivy Group<br>
    <a href="mailto:thomas@ivy-group.co.uk">thomas@ivy-group.co.uk</a></p>
    <p><em><br>
    INFORMATION:<br>
    Please send examples of your best typographic work, specifying which font(s) is/are used in each example, and giving details of designer, agency, client and the date the work was produced, to:<br>
    James Thomas,  Senior Project Editor, The Ivy Group, The Old Candlemakers, West Street, Lewes East Sussex BN7 2NZ, UK<br>
    Please send material on CD or DVD, not as email attachments. Alternatively, you can upload material to the Ivy Press FTP server at:<br>
    Address: ftphome.ivypress.co.uk User id: ftpfonts Password: 1000fonts2008<br>
    We can also accept submissions via yousendit.<br>
    We guarantee that your work will not be used for any purpose other than for inclusion in 1000 Fonts. Inclusion of you artwork is subject to acceptance of our standard terms, the details of which are as follows:<br>
    1. You agree that we may reproduce all artworks provided by you for inclusion in this title, in all editions of this title. This agreement does not extend to their inclusion in other works produced by Ivy Press.<br>
    2. If selected for use, the artwork will be fully credited to you.<br>
    3. You confirm that all artworks provided by you for inclusion in this title were created by you and that you own the copyright. Where third-party copyright holders are involved you undertake to deliver written permissions and releases from these third parties in a form satisfactory to Ivy Press.<br>
    If you would like further details about the project, please contact <a href="mailto:1000fonts@ivy-group.co.uk">1000fonts@ivy-group.co.uk</a> or go to (<a href="http://www.ivy-group.co.uk/1000_fonts/" title="http://www.ivy-group.co.uk/1000_fonts/">http://www.ivy-group.co.uk/1000_fonts/</a>)</em></p>
