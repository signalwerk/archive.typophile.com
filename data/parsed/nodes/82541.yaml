    <p>This family was inspired by a Type Battle here at Typophile: How would you design a font metrically compatible with Helvetica, but better than Arial? Working with preset letter widths was an interesting constraint, both a relief and a limitation at the same time.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/CheapProFonts-Familiar_Pro_450_4770.gif"></div><p></p>
    <p>I have done all the 4 basic weights, and the skewed obliques (done to a slightly less steep 10 degrees angle as opposed to the originals 12) has been optically adjusted. The letters have been designed quite close to the german/swiss grotesk tradition, but by using super-elliptical rounds, rounded dots and slightly curved outer diagonals the end result is a friendly looking font family that still looks... familiar.<br>
    <a href="http://www.cheapprofonts.com/Familiar_Pro" title="http://www.cheapprofonts.com/Familiar_Pro">http://www.cheapprofonts.com/Familiar_Pro</a></p>
    <p>Please enjoy the free "Bold" weight of our new 8-face family Familiar Pro. Download it and take it for a spin. Test out the quality of the outlines and the language support - and then come back for the rest of the family! ;)<br>
    <a href="http://www.cheapprofonts.com/Familiar_Pro_Bold" title="http://www.cheapprofonts.com/Familiar_Pro_Bold">http://www.cheapprofonts.com/Familiar_Pro_Bold</a></p>
    <p>Roger</p>
