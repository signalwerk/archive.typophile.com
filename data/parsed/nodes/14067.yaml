    <p>Please take a look at my new Hebrew typeface, Hagalil ("Galilee", Hebrew). You're more than welcome to give me your opinion.</p>
    <p><a href="http://img2.tapuz.co.il/CommunaFiles/4681048.pdf" title="http://img2.tapuz.co.il/CommunaFiles/4681048.pdf">http://img2.tapuz.co.il/CommunaFiles/4681048.pdf</a></p>
