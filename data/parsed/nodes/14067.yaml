      <p>I'm a bit reluctant to register with Tapuz, but will probably do it soon.</p>
      <p>I still think the Yod is a bit too large: you should make it both shorter and narrower, imo.</p>
      <p>To me, the immediate association of Galileean Hebrew writing is Jewish occult -- think of all the Kabbalah masters that used to live there.<br>
      I'd imagine such font as an ornate, hard to read Ashkenazi letters, like those gracing all those new-age books (think Culmus Druglin Italics, or Fontbit's Ashkenazi). </p>
      <p>Shay.</p>
      <p>btw, what is it with mathematicians and typography?</p>
