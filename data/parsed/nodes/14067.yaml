    html: |-
      <p>As somebody who admittedly doesn't know Hebrew, my only observation is that you might want to reconcile the smooth, flary terminals with the abrupt shears differently. For example: the ascender of the Lamed seems to need a flare; the top-left "trench" of the (non-final) Mem should probably be abrupt; and the (non-final) Tsadi seems to need a flare, somewhere. And maybe more.</p>
      <p>&gt; what is it with mathematicians and typography?</p>
      <p>Good question! And what is it with programmers and type design? I think it has to do with type design being accomodating of an analytical spirit, while fostering a creative/expressive dimension that writing code doesn't.</p>
      <p>hhp</p>
