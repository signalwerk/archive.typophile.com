    html: |-
      <p>I really like what you did so far.<br>
      The serifs reminds me of display types used in the 50's, but the letters are much more modern in appearance. </p>
      <p>I think the יו"ד is a bit out of place, though. It seems larger than it should. </p>
      <p>And I'm not so sure about the עי"ן either, something about the left stem seems too bold (in appearance, not weight.)</p>
      <p>If I may ask, why do you name it Hagalil? Nothing about it seems Galileean to me.</p>
