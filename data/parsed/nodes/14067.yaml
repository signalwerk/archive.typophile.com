      <p>Hi, Shay.</p>
      <p>At <a href="http://img2.tapuz.co.il/CommunaFiles/4690612.pdf">http://img2.tapuz.co.il/CommunaFiles/4690612.pdf</a> you could find a newer version with the Yud and Ayin corrected (among others). For the full list of corrected letters please turn to <a href="http://www.tapuz.co.il/communa/userCommuna.asp?Communaid=3055">http://www.tapuz.co.il/communa/userCommuna.asp?Communaid=3055</a> (in Hebrew).</p>
      <p>As for the name, like you suggested yourself, the face is inspired by types used in the 50's. That made me think of it as being a "zionistic" type, which led me to the name Atzmaut ("Independence", Hebrew). However, this name has already been taken (by two different fonts! One from Masterfont and one from Yanek Iontef). Thereafter it was only a matter of my own associations, and the Galilee was one of the first.</p>
      <p>How would a Galileean typface look to you?</p>
      <p>Thanks,<br>
      oribendor</p>
