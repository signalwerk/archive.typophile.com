  html: |-
    <p>See also:<br>
    <a href="http://typophile.com/node/14378">http://typophile.com/node/14378</a> _<br>
    <a href="http://typophile.com/node/15175">http://typophile.com/node/15175</a> _<br>
    <a href="http://typophile.com/node/15361">http://typophile.com/node/15361</a> _</p>
    <p>Normally I would have waited for #3 to run its course,<br>
    but this scrap of paper on my desk is driving me crazy<br>
    so I’m just going to throw this out:</p>
    <p>Poppl Laudatio has been one of my favorite fonts since<br>
    the mid-90s. I especially like to use it for on-screen<br>
    work because it’s so shallow* without being devoid of<br>
    character - in fact it’s one of the very few fonts that<br>
    I use both (very) small/lo-fi and very large. I think<br>
    Poppl really knew what he was doing, and we’re very<br>
    lucky to have such a design available.</p>
    <p>* <a href="http://typophile.com/node/15367">http://typophile.com/node/15367</a></p>
    <p><strong>The thing is, many people always complain about its<br>
    ampersand. You can think “they need an education” but<br>
    the fact remains it can be useful to have a “conventional”<br>
    ampersand for it. So let’s make one.</strong></p>
    <p>Being a Berthold font it’s become hard to view through<br>
    other font houses (can’t really blame them I guess)* like the<br>
    always-great-for-a-preview Myfonts. You can see a cruddy<br>
    GIF** on their site, but I would recommend downloading the<br>
    the PDF that shows all their “Hybrid” fonts, from here:<br>
    <a href="http://www.bertholdtypes.com/bq_library/BQ_library.html">http://www.bertholdtypes.com/bq_library/BQ_library.html</a></p>
    <p>* In fact I’d strongly recommend remaining squeaky-clean-legal<br>
      on this one. Maybe read the PDF usage conditions on their site,<br>
      and definitely only work with just renderings of the letterforms,<br>
      not original outlines.</p>
    <p>** <a href="http://www.bertholdtypes.com/bq_library/90089.html">http://www.bertholdtypes.com/bq_library/90089.html</a></p>
    <p>hhp</p>
