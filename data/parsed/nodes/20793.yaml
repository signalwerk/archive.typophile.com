      <p>What makes you think it's a font? It is most likely designed by itself, like a logo or the other pictures. It would also vary from one slot machine manufacturer to another.</p>
      <p>It's possible that somebody has since put one of these into a font imitating the original design, but I haven't seen it.</p>
      <p>Regards,</p>
