      <p><em>…a slick graphic designer trying to make something look "quaint" </em></p>
      <p>Most graphic designers don't have to try very hard, once they put down their mouse and pick up a pen or brush.</p>
      <p>Also, even if you are adept at drawing/writing on a small format -- mostly wrist -- things don't come out nearly so nice on a larger canvas once the arm comes into play. The slick boys there wield spray bombs.</p>
      <p>Having said that, my local coffee shop has some sweet chalkboard menus, courtesy of a nearby tattooist.</p>
