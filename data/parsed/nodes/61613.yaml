    html: |-
      <p>Kent — <em>this is vernacular</em> lettering. <em>No type involved</em>.</p>
      <p>That depends how we define "typography". There's some great material in:</p>
      <p><a class="freelinking external" href="http://nscad.ca/en/home/academicprograms/design/faculty/hanno_ehses.aspx" rel="nofollow">Ehses, H.</a> (1976). <em>Design Papers 1. Semiotic Foundation of Typography</em>. NSCAD University. Halifax, Nova Scotia, Canada.</p>
      <p>Last I looked, <a class="freelinking external" href="http://www.elupton.com/index.php?s=about" rel="nofollow">Lupton's</a> latest definition was:</p>
      <p>"Typography is what language looks like."</p>
    html_clean: |-
      <p>Kent — <em>this is vernacular</em> lettering. <em>No type involved</em>.</p>
