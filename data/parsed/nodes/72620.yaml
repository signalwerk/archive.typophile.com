    html: |-
      <p>Thanks, Adam!  John Boardly at "I love typography" is now implementing the new web type possibilities, which I really like. Fontfont, which publishes Scala, has been early out of the box with web type, but Font Bureau it seems will soon join the move web with <a class="freelinking external" href="http://www.webtype.com/" rel="nofollow">webtype</a>. I designed it for high resolution, but the fact that Caslon has been printed with success in so many different processes over the centuries does make me very curious how it will adapt to the web. </p>
      <p>ps Scala does look pretty good on the web :)</p>
