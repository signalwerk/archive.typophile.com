  html: <p>I have some curiosity to learn about the differences between the registered and the copyright glyphs. Robert Bringhurst on his book "The Elements of Typography Style" said that the registered symbol is a superscript character and the copyright symbol align on the baseline. My question is what is the reason that some fonts have this two glyphs so identical each other on size and typography alignment (align on the baseline).  <br> <br>Ricardo </p>
