    html: <p>The old hot type specimen books I have all show both characters the same size. These characters were never part of a normal typeface, but part of a set of universal characters that could be used with any typeface. If a digital font follows the traditional model, the two characters would be the same size, and this is generally the case with most digital typefaces.  <br> <br>But I think many recent type designers (me included) have changed the proportion of these characters to take the superscripted </p>
