    html: <p>A registered trademark symbol "circle r" is usually meant to add information to a marque or a word. It is superscripted just like the standard trademark "TM" symbol as its a sort of note, in much the same was as an asterisk is used <br> <br>The Copyright glyph, however, is used as an abbreviation of the word to be used inline as a word in its own right (usually as part of a copyright notice), rather than as an adjunct to another.  <br> <br>However, just as T&amp;Cs are coming ever smaller, commercial pressures, usually from the legal department of a corporation, have resulted in the circle r becoming increasingly big, to the point where it takes on the characteristics of a fully blown character, sitting on the baseline.</p>
