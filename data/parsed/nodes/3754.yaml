    html: <p>Matthias -- I see this for short heds and titling <br>(like a bjork vespertine CD titling face kinda) <br>and I'm guessing that you are setting text in <br>this face only to show how it works, more or less. <br>However, like plenty of other one-off display faces, <br>it should be used in moderation, otherwise <br>the mass of glyphs is difficult to read and/or look at. <br>Maybe if you set some words or short phrases in it, <br>or did an a-z, then it might be easier to critique. <br> <br>bj <br></p>
