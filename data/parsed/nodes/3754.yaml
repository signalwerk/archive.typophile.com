    html: <p>Matthias, on the one hand I don't want to discourage you. On the other hand I'd like to somehow help you to focus on what kinds of type designs might be appreciated by many users (if I can). <br> <br>It feels like this stuff is too 90s. Any instance of type design is good "training", but if you want to produce something other people will enjoy I don't think this will prove fruitful. If you decide to continue in this direction anyway, then I hope I'm wrong! If you instead decide to use this just as practice, that's great. And if you totally abandon it, then you might find it hard to focus on something better, but I think it's worth the effort. Anyway, don't just give up - good luck! <br> <br>hhp <br></p>
