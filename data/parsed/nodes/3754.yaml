    html: <p>Matthias -- I will assume that this typeface shouldn't be used for text settings, right? I don't see a _v_ anywhere, but the _u_ looks more like a _v_. I don't think you need the downstroke on the a to complete itself at the baseline, I think it should just be rounded. While your _m_ is clever, next to an _e_ it looks too small, or maybe the _e_ is too large? The _w_ seems a little narrow. The _r_ might need work in regards to combinations such as _ri_ where it disappears. Your _ff_ ligature is too wide as well. You might consider just posting a JPG of the characters.</p>
