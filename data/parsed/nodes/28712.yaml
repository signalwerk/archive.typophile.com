      <p>Yes, I know that, of course ;-) My question was just whether or not this Deberny was the Deberny that later became the Deberny in Deberny et Peignot.</p>
      <p>There are very few Deberny et Peignot typefaces available in digital format. Auriol, Cochin/Nicolas Cochin, Peignot, and BiFur come to minda, as well as almost all of the typefaces that Adrian Frutiger drew for them (especially Univers!). Otherwise, it can be tricky.</p>
