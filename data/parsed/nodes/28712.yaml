      <p>I once went to a very old printer's shop who for generations had done bank stationary, notes, bonds, certificates, etc.  While in the back room, I notices stacks of old litho stones in the corner. On the stones were the most beautifully done scripts and ornaments.  Each stone was a blank for a particular bank note.  They used to be inked and pulled in the traditional art printmaker style for years! I was young and stupid and did not have a camera (or a huge truck to carry the hundred pound stones) or I would have asked to keep some of them. Someone must have labored hours by hand crafting each letter.  They sure looked better than todays, "Grab some clip-art and throw some Arial at it" kind of stuff. :-(</p>
      <p>ChrisL</p>
