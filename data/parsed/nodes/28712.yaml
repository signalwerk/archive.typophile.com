      <p>In 1985, Linotype took over of the type division of D. Stempel AG. In connection with the liquidation of D. Stempel AG, Stempel's shares in the Haas’sche foundry were acquired by Linotype (see <a href="http://www.linotype.com/49-14026/1973-1989.html" title="http://www.linotype.com/49-14026/1973-1989.html">http://www.linotype.com/49-14026/1973-1989.html</a>).</p>
      <p>There is an article about the history of Deberny et Peignot in the most recent version of the Linotype Matrix, which was written by John D. Berry (<a href="http://www.linotype.com/2720/linotypematrixvol4no2.html" title="http://www.linotype.com/2720/linotypematrixvol4no2.html">http://www.linotype.com/2720/linotypematrixvol4no2.html</a>).</p>
      <p>Most of what typefaces from Deberny et Peignot there are to be found in digital format are in the Linotype Library (<a href="http://www.linotype.com" title="http://www.linotype.com">http://www.linotype.com</a>).</p>
      <p>The biggest exception that comes to mind is BiFur, of which P22 has a version (<a href="http://www.p22.com/ihof/bifurset.html" title="http://www.p22.com/ihof/bifurset.html">http://www.p22.com/ihof/bifurset.html</a>).</p>
