    html: <p>The firm of Laurent &amp; Deberny derives from the foundry of Gillé. Alexandre de Berny bought out the foundry of his partner Laurent in 1840, and ran a business as Laurent &amp; Deberny, or Deberny &amp; Cie. In 1923 the foundry was merged with that of Georges Peignot and his son Charles, forming Deberny &amp; Peignot. <cite>Specimen des Divers Types de la Fonderie Laurent et Deberny</cite> is a hard to get type specimen from that time. You could check out Fonthaus.com for fonts that might be similar to what you are looking for..</p>
    html_clean: <p>The firm of Laurent &amp; Deberny derives from the foundry of Gillé. Alexandre de Berny bought out the foundry of his partner Laurent in 1840, and ran a business as Laurent &amp; Deberny, or Deberny &amp; Cie. In 1923 the foundry was merged with that of Georges Peignot and his son Charles, forming Deberny &amp; Peignot. <cite>Specimen des Divers Types de la Fonderie Laurent et Deberny</cite> is a hard to get type specimen from that time. You could check out Fonthaus.com for fonts that might be similar to what you are looking for..</p>
