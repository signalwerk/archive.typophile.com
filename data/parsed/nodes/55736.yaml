  html: |-
    <p>This is a spread for a prison literary magazine I'm laying out. </p>
    <p>I've used 15pt Minion for the title and 15pt Legacy SC for the author name. The body is set in 11/15 Minion. </p>
    <p>The page is 39 x 51p.<br>
    The textblock is 26 x 39p.</p>
    <p>inside margin: 3.833p<br>
    top margin: 5p<br>
    outside margin: 9.1666p<br>
    bottom margin: 7p</p>
    <p>I'm curious what people think of the large title size and if the leading for the body is too high. Also would like to hear thoughts on the block dimensions and location on the page. </p>
    <p>Thanks for your time!</p>
    <p>ps-I've a NYTimes article as dummy text.</p>
