  html: <p><strong>Dots Per Inch</strong>. Measure of the resolution or <em>resolving power</em> of an input device such as a scanner or trackball, or an output device such as a computer monitor (typically stated in <span class="caps">PPI</span>/Pixels Per Inch) or&nbsp;printer.</p>
