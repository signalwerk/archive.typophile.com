  html: <p>Can anyone help me find a macro that generates all open files from FontLab? I'm sure there has to be one out there somewhere... <br>Any help is greatly appreciated. Thnx.</p>
  html_clean: <p>Can anyone help me find a macro that generates all open files from FontLab? I'm sure there has to be one out there somewhere... <br>Any help is greatly appreciated. Thnx.</p>
comments:
  - id: 54420
    user: null
    date: null
    date_raw: null
    votes: null
    html: '<p>Paul,  <br> <br>1. Save all files as .vfb files, best in the same folder.  <br> <br>2. Go to Tools / Transform Range / Transformation range: Fonts in the fonts list / ...  <br> <br>3. Click on "+", add the .vfb files that you want to generate, in Destination format select the format you want, in Destination folder pick a folder to your liking.  <br> <br>4. Click on OK, then Run.  <br> <br>Adam</p>'
    html_clean: '<p>Paul,  <br> <br>1. Save all files as .vfb files, best in the same folder.  <br> <br>2. Go to Tools / Transform Range / Transformation range: Fonts in the fonts list / ...  <br> <br>3. Click on "+", add the .vfb files that you want to generate, in Destination format select the format you want, in Destination folder pick a folder to your liking.  <br> <br>4. Click on OK, then Run.  <br> <br>Adam</p>'
