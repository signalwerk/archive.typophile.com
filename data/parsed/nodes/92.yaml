    html: <p> &gt; I don't think he'll be having much to say. <br> <br>From what I understand, he'll soon be saying even more than what he's said already... <br> <br>Maybe the actual morons are the sue-happy misers who might just lose a few hundred thousand dollars as a result of a juicy counter-lawsuit? Aaah, if one could only pay the bills with regret as the currency! <br> <br>In any case, the reason you are obviously so angry is because you lost the battle - and in a major way. But you can really only be angry at yourselves. Don't hate little ol' me, I'm just the messenger - alerting you to your misguided value system. <br> <br>Respect is what you really want - but you can't get it through intimidation. Leveraging the legal system is no substiture for decent behavior. First, you have to make good enough fonts; then, you have to treat *others* with respect; lastly, you have to educate people as to why they should respect you. And even after all this, you still won't have everybody on your side - but that's life. <br> <br>Learning to handle your loss, and subsequently admitting your fault(s) are the first steps to a happy (or at least less miserable) life. <br> <br>Peace. <br> <br>hhp </p>
