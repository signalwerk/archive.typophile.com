    html: "<p> &gt; from a single court document <br>&gt; just going for the headlines <br> <br>Wrong. <br> <br>&gt; will the costs to the defendant get inflated <br> <br>The defendant might actually end up *making* a few hundred thousand dollars... <br> <br>&gt; why take me seriously <br> <br>It's not at all a matter of taking you seriously or not, it's a matter of taking you for a coward who has something to hide - something that reflects very poorly on you, and hence your stance and opinions. <br> <br>If your name has been tainted by previous misdeeds, then there's only one thing you can do to exist in harmony within the type community in general and this forum in particular: apologize. <br> <br>I hope you have it in you. <br> <br>&gt; with no backup whatsoever <br> <br>Wrong again. I might just have more backup than you! <br> <br>&gt; is no better than Apostrophe anyway <br> <br>Riiight - what an accurate comparison... <br>And that's why -on the TypeDesign discussion list- Apostrophe was confronted most strongly by *me*, and subsequently got kicked off the list simply for being Apostrophe (without actually harming the discussion list itself - usually the only reason to get kicked off). Your \"friend\", on the other hand, was kicked off THREE TIMES for his incessant, misguided flaming. Among very many other things, he equated me with a rapist. Twice he was allowed to rejoin based mostly on his reputation, but after the third time he was not allowed back. This whole ordeal took almost a year and a half, and the list is still squirming from the wounds. I hope we don't have to repeat this here - the outcome will be the same. And you're not getting any younger. <br> <br>Making good fonts (even if they're just display fonts) is no excuse for indecent public behavior. <br> <br>The list archives say it all - just go read the entire sordid story. I have nothing to hide - unlike you (plural). <br> <br>The Nasty Queen and her fellow ogres are sitting in feces. And instead of getting up and washing themselves off, they're actually developing an apetite for eating feces. CHANGE. Now. <br> <br>You're angry because you lost the battle(s), and you're losing the war. And not because you were the underdog - but because you committed a greater fault than the people you were hunting, in your rabid berserker rage. First, you must regret your actions - just like Apostrophe did, btw. After that, you will probably see the road to harmony clearly on you own. <br> <br>&gt; he is trying so hard to bait and embarrass. <br> <br>Not at all. At the very beginning, yes, but I got over that a while ago. Now I'm back to my original \"core issue\": to get people to behave decently. Why? Because it's good for the type community. What you did was not decent - in fact it's almost as bad as what Apostrophe did. <br> <br>Don't assume I'm like you - I have reasons distinctly my own, and a lot less dishonorable than yours. I am greater than you. <br> <br>&gt; Who has standing here, Papazian because he puts his name? And what is that worth?  <br> <br>You want a dollar amount, you materialistic cretin? <br> <br>Standing?! You're not using your name because you don't have any yourself! I am what I am, and refuse to hide it. And I'm not worried, because -as much as there's so much room for improvement- I'm still a better person than you and your miserly cohorts. <br> <br>&gt; that was harsh! <br> <br>Riiight. <br>I grew up in a civil war, with car bombs, snipers, no running water, the works. At 17 I was guarding my high school with a \"klashin\" (AK-47). This little conflict -which is destroying your lives- is essentially just entertainment for me. <br> <br>&gt; bragging about this act of piracy <br>&gt; dared the designer to do something about it <br> <br>More distortions. Don't believe the hype, as they say. Read the archives, and decide for yourselves what *really* happened. I have nothing to hide, especially not my name! The only thing I'd like to avoid (but probably less than you) is wasting time repeating history. <br> <br>The bottom line -in this context- is this: <br>You cannot harm me. Against my clear written warning, you decided to make an enemy out of me. But this is *not* payback - it's just lack of self-censorship. If you had not made an enemy out of me, you would simply be assured favoritism from me, in the form of keeping my mouth shut to help a friend in need. I have a weakness in being too honest, and here I see no reason to shut up. It's that simple! And I told you this would happen. <br> <br>Also note this: as a favor to one of you who *did* ask me nicely to keep my mouth shut, I did not reply to Ole's original post. But when I saw yet another attempt at spin-doctoring from your gang (and I do mean gang) in the form of \"Though I don't think he'll be having much to say\" I got provoked into correcting that attempt at distortion. The truth is that Apostrophe won (and might win even more soon), and you're trying to hide it. The fact that he *shouldn't* have won (as far as I'm concerned) does not relieve you of the responsability to be honest. You will understand that as an Armenian I have a particular aversion to historical revisionism. <br> <br>The only thing you can -and are- doing is harming Typophile. Do not drag Typophile into this - it can only bring more grief, especially to you! <br> <br>So maybe you should be kicked off from here as well. Unless you can admit defeat and regain your senses. Pronto. <br> <br>---- <br> <br>Now that you've read the above in anger, please do everybody a favor and re-read it calmly with just a little bit of objective self-doubt: if my remaining iota of faith in you is justified, you will realize this: you need to change. And don't worry about me. <br> <br>hhp </p>"
