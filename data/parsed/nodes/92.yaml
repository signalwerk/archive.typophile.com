    html: "<p> The thing from another planet: <br>&gt;I think some people have a serious problem with  <br>&gt;me for a very simple reason: I am bad for <br>&gt;business. Suffice it to say that I'm not  <br>&gt;exactly the biggest fan of capitalism...  <br>&gt;But in the end I am not the problem. Just  <br>&gt;like you, I am part of the solution. <br> <br>And Hrant came down from the mountain with the word of god, thou shalt listen to me, in my gobbledegook speak, as no one can disclaim what I say. <br> <br>Ask yourselves some questions: <br> <br>Who really cares about Hrant Papazian's rantings to fear for their own businesses? <br> <br>Who is Hrant Papazian in the grand scheme of things anyway? <br> <br>Who outside of a few lists and boards like this (which are of little consequence outside their instant in time) knows or cares what he has to say? <br> <br>Who appointed him as our all-knowing saviour? <br> <br>Why does he speak in riddles, never saying anything straight out, but at the same time claiming to be a straight shooter? <br> <br>Ask yourself, if you had a secret, that couldn't be said, would you choose Hrant Papazian as the guardian of that secret (which is what he appears to be claiming)? <br> <br>All I see here is huff and puff trying to cover his own failings and shift the focus/blame onto someone else. <br> <br>Papazian: font thief. <br> <br>Papazian: dared the designer of that font to do something about it. <br> <br>Papazian: ignored invoices and letters from that foundry asking him to pay for that font. <br> <br>Papazian: had to have debt collectors sent out after him to collect the money he owed, and had to pay the fees of the debt collectors. <br> <br>Papazian: bitter and twisted egomaniac who is now embarking on a vendetta against that same foundry. </p>"
