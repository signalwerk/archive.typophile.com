    html: "<p> &gt; Who are \"the fascists,\" Hrant? <br> <br>I'm about as stupid as you are curious. <br> <br>---- <br> <br>&gt; the only person to post in this thread who was actually a party to this lawsuit <br> <br>Correction: The only non-anonymous person. Which is highly commendable. <br> <br>BTW, the reason for the anonymity of others might be tangentially related to: <br> <br>&gt; no party to this lawsuit is at liberty to disclose the financial terms of the settlement. <br> <br>But they might have anyway - you know that. <br> <br>Also: <br>It's not just the \"financial settlement\" that's at issue, but certain repercussions from possible subsequent violations of various clauses in the whole agreement. You know what I'm talking about. <br> <br>&gt; the villainy of the commercial type industry <br> <br>That's the type of thing Apostrophe might say - not me. Most type designers, and many type \"managers\" are good people. Most, and many - not all. <br> <br>&gt; welcome to air their grievances <br> <br>Not so easy when the consequences can be a gestapo vendetta campaign! But in the end, it backfires - as it did. <br> <br>---- <br> <br>In any case, I really need to offer a clarification, because -as you say- I did generalize too much: <br> <br>Some of the people involved in this mess are basically good people, and the most they can be accused of is allowing their anger to be manipulated by the truly nasty fundamentalists. They were essentially swindled - and that's not really a crime. Plus I'm sure they're smart enough to learn who not to associate with from now on. Note, for example, that Adobe and a certain other party were previously teamed up in a suit, but in this subsequent action Adobe was smart enough to stay away. <br> <br>So many lessons, so little time! <br> <br>hhp </p>"
