    html: "<p> &gt; You are under no restrictions here. <br> <br>Yes I am. <br> <br>&gt; Then why did you say (post) it? <br> <br>I didn't say anything remotely close to \"the commercial type industry is villaneous\". Because I don't believe that. My complaint is with a certain minority, people who are poisoning and polarizing the field. <br> <br>&gt; How do you know if they're good or bad? <br> <br>I don't \"know\" it, I feel it. Just like you do! <br> <br>It's basically the normal way people make their decisions about others - personal character judgment - but we each have our variations - which we need to mutually tolerate. Example: I talked to Rodrigo Cavazos for a few minutes at TypeCon98, and I could feel his goodness. I can't point to what I saw in his eyes, or what I heard in the timber of his voice, but I know what I feel. But also, I listen to who's saying what - and analyze what they really mean in the context of where they're coming from. I peel the layers, and look as deep as I can, while trying to peel my *own* layers which might interfere with a good evaluation. When I like or dislike somebody, I ask myself: why do I feel this way? And sometimes I realize that a psychological issue on my end is causing me to judge that person unfairly. So I correct it - or at least try to. <br> <br>But I'd be an idiot to claim that I'm clairvoyant - I make judgment mistakes all the time - every human does. But at a given moment I believe what I believe, and I act on it. If I'm less tentative than most people, and that makes certain poeple uncomfortable, *they* need to deal with it. <br> <br>&gt; Do you know the whole situation on which you are commenting? Are you sure your \"sources\" have given you all of the facts? <br> <br>I know *enough* of it, about certain entities - which I cannot allow myself to name - but is it really necessary anyway? People who I don't have enough \"information\" about (like you) I tend to give the benefit of the doubt. And when they come out like you did and openly ask rational questions with good poise and self-control, then I start to think better of them. <br> <br>Sources? My best source is myself - other sources I always trust less than 50%. But I'm really not extrapolating very much. Trust me, I don't enjoy knowing what I know - but I'm very bad at looking the other way. Maybe I have a sick attraction to conflict, or maybe I can remain lucid under much greater \"conflict-pressure\" than most people, or a combination. <br> <br>I can only hope that you believe me when I say that certain zealots in this industry are lashing out and victimizing people left and right, including people they should not alienate, including people who are still on their side but remain oblivious to their destructive fundamentalism. Why do they not see it? Maybe because it would hurt too much. <br> <br>But whether you believe me or not is a non-issue for me - I'm not a politician looking for votes. I have no agenda. I am doing this because it's the right thing to do at this instant. Anybody who really knows me will tell you that I don't plan ahead more than a couple of meals. Which doesn't mean I'm reckless, at a given moment. <br> <br>&gt; you are throwing around some pretty heavy insults <br> <br>The insults are commensurate with their actions. <br>When people make mistakes, they suffer the consequences. I didn't make up that law, I'm just part of the equation. The path to happiness is through self-improvement, not the punishment of others - and I'm enabling the communication (external and internal) necessary to the realization of this fact. <br> <br>I think some people have a serious problem with me for a very simple reason: I am bad for business. Suffice it to say that I'm not exactly the biggest fan of capitalism... But in the end I am not the problem. Just like you, I am part of the solution. <br> <br>hhp </p>"
