    html: "<p> &gt; nobody should jump to conclusions based on partial facts <br> <br>1. There is no jumping - it's just walking, and imperfect lighting will not deter me. If I sound cagey sometimes, it's because I've made certain promises. <br> <br>2. You're not seeing the spin-doctoring that's the entire point of everything they've posted since what \"Someguy\" wrote. <br> <br>&gt; Nasty queen? Feces? <br> <br>The truth hurts - it surprised me too, when I started realizing it. You have no idea of the disgusting things going on in the background. Everything I myself have done on the other hand is in plain view for all to see and judge. <br> <br>I have some -but not a complete- idea of their actions because I was one of the victims, and as a result now have a \"channel\" of sorts. But really, now I'm only the messenger. <br> <br>They tried to make an example out of me, and not only did it fail, but now they've lost my favor, so I don't feel the urge to go out of my way to be nice to them, that's all. Until/unless they apologize. If they would just treat me with some respect, they would find me on their side again - instead of being the too-honest neutral party. <br> <br>I'm not singling them out. This is how I treat non-friends who commit wrongs. <br> <br>&gt; things are getting just a _little_ out of hand?  <br> <br>These are just the ripples from horrible decisions made a while back. <br> <br>&gt; Why does every thread on this board have to end in a _(insert_name_here)_ vs. Hrant flame?  <br> <br>Simple: I'm one of the few people both willing and able to uncover distortions. Both in stagnant typographic practices, as well as misguided social values. Those who would benefit from the status quo and/or those who have something to gain by hiding the truth can't stand me, of course. But they have to realize that I'm just the catalyst - not the actual problem. <br> <br>They want to force me out of the type community - but is that community served by such cyberterrorism? Anyway, as soon as they realize that I'm here to stay, maybe they can regain some of their dignity. <br> <br>&gt; Is there a remedy? <br> <br>You can never completely erase confict - and you shouldn't anyway. Now, I do agree that anonymity *can* have value, but in practice it's mostly serving to further petty agendas. <br> <br>Solution? A possible compromise: <br>Allow a *single* *unique* username per *valid* email address, and make the email address public. This would preserves anonymity, but to some extent hold the poster accountable, in terms of third-party reactions to his posts. <br> <br>hhp </p>"
