    html: <p> Joe, dialups most often give unique IPs on each connection, that doesn't mean it's a different person. If you have a trace route app you can see all the switches the connection goes through from you to the selected IP, if the last ones all belong to the same ISP... good chance it's the same person. <br> <br>But at the same time, same IP doesn't make it the same person - even if it's simultaneous. </p>
