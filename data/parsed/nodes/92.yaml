orism? Anyway, as soon as they realize that I'm here to stay, maybe they can regain some of their dignity. <br> <br>&gt; Is there a remedy? <br> <br>You can never completely erase confict - and you shouldn't anyway. Now, I do agree that anonymity *can* have value, but in practice it's mostly serving to further petty agendas. <br> <br>Solution? A possible compromise: <br>Allow a *single* *unique* username per *valid* email address, and make the email address public. This would preserves anonymity, but to some extent hold the poster accountable, in terms of third-party reactions to his posts. <br> <br>hhp </p>"
