    html: <p> FOOL, why do you want to know my IP address, what do you think it will tell you!? Great, I've a dialup/cable/dsl account with an ISP - tens of thousands of others use the same ISP, so what? You could take a guess at who I was, but it'd only be a guess - you can't even verify a physical location with an IP, all of AT&amp;T's customer's resolve to New Jersey, because that's where their net block is registered. <br> <br>Should we have them post your IP too, are you any braver than me? <br> <br>If the admins of this board want to verify users then they shouldn't allow anonymous posts. If they want a membership scheme where everyone is absolutely known, then they should set one up. Don't moan about anonymity when you've already voted for it. <br> <br>As to the moron. It's fairly straight forward. Someguy stated that a site was down. He was wrong, because, as you can see he wrote *labs.com, when the site URL is *lab.com, no "s". <br> <br>Some other guy decided that I'd mispoke, because he couldn't be bothered to read the posts properly, and what was cited. I think that calling such a moron isn't to far from the truth. <br> <br>Same guy thought he'd discerned the facts in a lengthy legal matter, took three years to be resolved, from a single court document - do you think there may be more documents, that discuss other aspects of this case, that are not published on the web? Seems likely to me. <br> <br>You may also note that the legal document concerned is something like six months old, the case has only just been resolved - did something happen in the mean time, did something happen before this? <br> <br>If you read the legal document properly, you'll see that the defendant is basically being accused of lying in his defence. The judge has odered that the defendant be subjected to a discovery process, sat in a room and asked question after question, all documented - the judge must therefore agree that there is something to the plaintiff's accusation of falsehood, though he doesn't strike out the defendant's statement at that time. <br> <br>If you got this far, you'll see that the defendant was also ordered to pay the costs of this hearing before the court - again suggesting the judge had seen/heard evidence as to the falsehoods claimed, and accepted those claims. <br> <br>I think that, if someone wants to start posting figures about this or that, then they should at least understand the process, and the figures they are quoting. Someone who didn't do that, just going for the headlines, would, in my opinion, rightly be called a moron. <br> <br>You may also want to consider that the same person was ranting on a few days ago at Creative Pro, about how the defendant "never had to pay a single red cent" (see comments in response to John D Berry's latest dt font article). In a few days less than a "red cent" has been inflated to $1000, is he going to find some more "facts" (ie the real thing, not stuff he wants to opine about), will the costs to the defendant get inflated to $10,000, $100,000, a million!? <br> <br>If we don't find the facts, will we *know* that it was only ever $1,000 - like he *knew* a few days ago that it was "nothing". <br> <br>This same person has claimed costs to a single plaintiff were hundreds of thousands of dollars (posted here, and then deleted - I can't have been the only person that saw it). How does he know, does he work for any of the foundries concerned, does he cite some evidence. No he does not. <br> <br>If that same person then went off tangentially, with no knowledge of the facts, and no evidence to support his statements to essentially berate those who had no choice other than to defend their rights (their rights protected by long-standing legislation), then I think again he would rightly be described as a moron. <br> <br>But, why take me seriously, I have no standing as an anonymous poster. But do you really know who anyone is in this forum, are they all validated just because they gave a name, do they have any greater standing, are they really who they say they are? <br> <br>There was a guy used to post to a mailing list with the mail address "nevillebrody@[an isp].fr", what do you reckon are the chances? <br> <br>And now I got really upset, let's put this into perspective. This *moron*, this troll, this seeker of truth and justice, this fukcing idiot that will post anything he likes with no backup whatsoever just so he can point fingers and use innuendo to convict - is no better than Apostrophe anyway. This moron pirated a font, was discovered, and had to have debt collectors sent out after him to get him to pay the license fee. <br> <br>The font he pirated, just happens to be put out by one of the foundries in this case, whom he is trying so hard to bait and embarrass. <br> <br>Papazian, you are a worm, go back and crawl under your rock where you belong. <br> <br>Who has standing here, Papazian because he puts his name? And what is that worth? </p>
