    html: <p> &gt; You are under no restrictions here. <br>&gt; <br>&gt;Yes I am. <br> <br>Uhh...what restrictions? <br> <br>&gt;complaint is with a certain minority, people who are <br>&gt;poisoning and polarizing the field. <br> <br>Okay. I'll ask again. Who are these people that are poisoning and polarizing the field. Please share with us...I am sure we would all like to know so we can all benefit from your vast wisdom and steer clear of their poisonous and polarizing ways. <br>&gt; <br>&gt;&gt; How do you know if they're good or bad? <br>&gt; <br>&gt;I don't "know" it, I feel it. Just like you do! <br> <br>How do you presume to know how I make judgements about people? I certainly don't make these bold pronouncements about people I've never met.  <br> <br>&gt;But I'd be an idiot to claim that I'm clairvoyant - I make <br>&gt;judgment mistakes all the time - every human does. <br> <br>I think you are making judgement mistakes here. You are using this soapbox to drag the names of some really good people through the mud. I think you really need to stop and think about what you are saying. <br> <br>&gt;I know *enough* of it, about certain entities - which I <br>&gt;cannot allow myself to name - but is it really necessary <br>&gt;anyway?  <br> <br>Yeah...it really is necessary if you are going to continue to make your disparaging statements. <br> <br>&gt;Sources? My best source is myself - other sources I always <br>&gt;trust less than 50%. But I'm really not extrapolating very <br>&gt;much. Trust me, I don't enjoy knowing what I know - but I'm <br>&gt;very bad at looking the other way.  <br> <br>Did anybody ask you to look the other way? We want more! What specifically do you know? Who are these miserable people to whom you keep referring? You are not backing up your statements with specifics. When it comes to that, your conversations degrade into philosophical discussions  <br> <br>&gt;&gt; you are throwing around some pretty heavy insults <br>&gt; <br>&gt;The insults are commensurate with their actions. When people <br>&gt;make mistakes, they suffer the consequences.  <br> <br>What mistakes. What people made these mistakes? What are the consequences? <br> <br>&gt;But in <br>&gt;the end I am not the problem. Just like you, I am part of <br>&gt;the solution. <br> <br>Who is the problem? Why are you part of the solution? Please tell me so I can bask in the glory of being part of the solution to this problem. <br> <br>How do you know I'm part of the solution? Do you know me? Do you know my business? I might be a complete SOB. The folks you are criticizing might be perfectly wonderful, honest and upstanding people. You just don't know. <br> <br>Do you see what you are doing? You are making uneducated and unsubstantiated judgements of people about whom you know very little. You might know actions, but you do not know the context in which they were taken. </p>
