    html: <p>As the only person to post in this thread who was actually a party to this lawsuit, let me set a couple of things straight. <br> <br>First, the document Ole Sørenson listed does not represent "court findings" in this matter. You'll see from its date that this order significantly predates the settlement of Emigre et al v. Apostrophe, which was closed in March 2002. <br> <br>Second, neither side "won" or "lost" in this matter. The parties settled the lawsuit; settlements are, by definition, agreeable to both parties. You should not find the words "won" or "lost" in any press release issued by the foundries. <br> <br>Third, no party to this lawsuit is at liberty to disclose the financial terms of the settlement. Anyone implying otherwise is, to use the legal term, talking out of their •••. <br> <br>Finally, on a personal note, let me just say that I find these sweeping generalizations about the villainy of the commercial type industry to be not only childish, piteous, bizarre, vindictive, and wholly unproductive, but somewhat insulting as well. Anyone on this board who has a beef with the practices of a particular company is welcome to air their grievances -- professionals consider this a cost of doing business. But as a commercial type foundry, which basically means a type designer with "Inc" for a last name, I really don't appreciate being characterized by any of the foul and slanderous language used above. <br> <br>I am a type designer, and I work my butt off trying to create an environment in which I and my colleagues can produce the best typefaces we're capable of creating. Anyone who thinks otherwise just doesn't know me. And anyone who thinks that the "Inc" in my name makes me "miserly," "litigious," "misguided," "indecent" or "self-righteous" just doesn't know business.</p>
