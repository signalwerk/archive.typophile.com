    html: <p> Jared, I think you hit the nail on the head, Papazian does seem to be proposing that the foundries concerned should not have persued this case through legal means. What does he want them to do instead? <br> <br>He also seems to want to drag other type vendors into this, as weight behind his claims, stating that they did not take part in the suit - specifically Adobe. <br> <br>His point here seems to be that because Adobe did not take part then the suit was without merit. <br> <br>Is there any logic to this claim? It doesn't appear so, without knowing why Adobe didn't take part. <br> <br>One thing is fairly evident though. My experience of Adobe's legal efforts is that they have always been pursued against commercial piracy. I don't know of any instances where they have pursued cases against individuals distributing their intellectual property for no (direct) financial gain. <br> <br>Perhaps this is corporate policy at Adobe, and would explain why they took no part in this case. <br> <br>In any event, I believe it's true to say that this case united a greater number of foundries in one case than has ever been the case before - we should take that as testimony as to the integrity with which that case was pursued. <br> <br>Papazian's mud slinging sticks to all the plaintiffs in this case (see the list of designers cited at the URL given at the top of this page) - yet he offers no evidence to back up his accusations, and no remedy to what he (alone) sees as wrong-doing. </p>
