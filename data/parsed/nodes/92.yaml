    html: "<p> &gt; How could anyone who frequents this board possibly object to this? <br> <br>Jared, if you were listening you would have heard me condemn Apostrophe's actions - I always have. <br> <br>Please don't fall into the \"you're either with us or against us\" fanaticism, which is exactly what I'm complaining about. You and others are aligning yourselves with these covert, rabid name-callers, whether you realize it, want it, or not. <br> <br>The bottom line is that if we're going to reduce piracy, we have to be *stronger* and *smarter* than them. Alienating people who are essentially on your side but simply don't agree with you 1000% backfires - as it is doing now. Just because -as an example- I don't share some people's deluded dependence on the letter of the law doesn't mean we can't work together for a more harmonious co-existence. It certainly doesn't mean you come hunting after *me*! And diverting this discussion by putting a spin on an over-blown (not to mention *resolved*) incident from almost two years ago does not serve type design - it only serves to distract us from the failure at hand. <br> <br>I am caught in the middle of people who would end up turning the world into a bitter, barren landscape. I did not choose this confrontation - they brought it upon us. Some of my opponents here simply do not realize what's happening (yet) - and those people I cannot hold too liable. But some of them need to be shunned - until they can abandon their manipulative fundamentalism. <br> <br>Do no get caught up in this polarization. Remain a resonable human being, and you'll come out fine. <br> <br>&gt; If you aren't willing to back up your .... <br> <br>Human opinion is not a US court of law. <br>I cannot give out the type of information you seem to want - for very good reasons. If this makes you discredit my views completely, then I can only feel sorry for your absolutism - but nonetheless ask you again for a little bit of your trust. The conclusions I've arrived are not set in stone - but neither are they the result of delusion - my thoughts and feelings on this have been forming for a while now. BTW, I am willing to share them in much greater detail in person - any time. Like ATypI's upcoming conference in Rome, if you like. I am sorry if my obtuseness here is frustrating - but think what it's doing to me! <br> <br>And note this: I would indeed have stayed quiet if it were not for that original attempt at putting a spin on what really happened: \"Though I don't think he'll be having much to say.\" If we don't realize and admit that Apostrophe is very much alive and kicking, in fact fighting *back* now, then we're shortchanging our long-term prospects. Why? <br> <br>I have no vendetta - I am simply trying to pull down the unethical distortions that are being aired right in front of my eyes! I am slinging no mud - they are sitting in mud of their own doing - I have simply erected a roadsign alerting motorists. Now, some of the people are sitting in mud because they have mistakenly associated with unethical fanatics - they need to get up, and wash off. <br> <br>My actions here are actually a reaction to their misleading spin-doctoring. This is a key point: I am not conducting some crusade, but simply trying to balance a wrong which I have seen aired before my eyes. I am ready to stop, as long as no new spins are introduced. <br> <br>BTW, Jared, how come I can't voice my opinion freely without necessarily giving out \"hard evidence\", but anonymous people can conduct a vile, profane defamation campaign against me with no resistance? I think you are being unfair. <br> <br>So go ahead you people, have the last word, throw more insults, whatever - and I'll stay quiet. Just please don't introduce new spins - I have great difficulty allowing myself to let it slide. <br> <br>hhp </p>"
