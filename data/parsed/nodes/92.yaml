    html: "<p><a href=\"http://www.typedesign.org/\" target=\"_top\">http://www.typedesign.org/</a> <br>BTW, I encourage everybody here (except the two people who were previously kicked off...) to join that list, now that the storm is definitely gone... There's  currently an interesting discussion about numerals, and usually there's a lot more than that. <br> <br>BTW, I cannot put the messages up because there are *hundreds* of them, with a very complex dynamic, and they span more than a year!! When I tell you that this forum will suffer greatly if the same witch-hunt is allowed to take place here, I'm not joking. <br> <br>&gt; Can you really say that you were not guilty of font theft <br> <br>No. But I can say that I made reparations for my transgression (which was reported to them by none other than *me*, you should know) - but it was not enough in the eyes of the gestapo. And the people who tried -and failed- to make an over-blown example out of me were guilty of *much worse* than one font theft. <br> <br>Their stance was and has been ludicrous, and now they're suffering the consequences. <br> <br>&gt; Will the archives earn you the respect you want?  <br> <br>Not from everybody, but I only want respect from certain types of people - again: I'm not a politician. <br> <br>For these people, reading -and absorbing- the archives might surprise them, but will only endear them to me more. Not least because they will see me admitting to, and fighting my own faults. Even when faced against their tyrannical, puritanical fundamentalism. <br> <br>Bottom line: <br>1. You cannot get more out of me than you already have - which was less than what you would have gotten if you had done #2. <br>2. It's better to have me as a friend than a critical non-friend. I don't say \"enemy\" because the pity in me overpowers the hatered. <br> <br>---- <br> <br>&gt; can they *ever* regain full citizenship in the type community? <br> <br>The community isn't some country - it's essentially made up of individuals. So to answer your question in that light: <br> <br>Among some people, easily. Among other people, with greater difficulty. Among the type of people I'm complaining about, only if: <br>1. I can't be more useful as an \"example\". But that didn't work... <br>2. I grovel and beg for mercy. But why would I, when they can't really harm me? <br> <br>I lost a little bit - they lost a ton. Face it. Move on. <br> <br>---- <br> <br>&gt; Buy the type? <br> <br>No, no. <br>For these fascists, that's not even close to good enough. But now they're starting to learn their lesson... <br> <br>Human behavior has to be mutually reasonable. They weren't. Don't let them use Typophile for their deluded goals. <br> <br>Anyway, this isn't about me, it's about how you fight *real* piracy, on the scale of Apostrophe. Conclusion: not the way they did it!! <br> <br>hhp</p>"
