    html: "<p> &gt; I am just a bystander <br> <br>And how in hell are we supposed to know that.. or believe it?... <br> <br>&gt; cite your evidence. <br> <br>I'm sorry - my hands are tied. You don't have to believe me - but I hope there's more to your life than \"evidence\". <br> <br>&gt; You, Papazian, talk of Apostrophe as if he is some friend of yours <br> <br>Nope. <br> <br>&gt; you've some sympathy for his cause!? <br> <br>You're seeing this as black-and-white, just like so many others are, just like your entire society forces you to be. I think Apostrophe did something very wrong. I think his hunters did something almost as bad. Get it? <br> <br>&gt; You want to accuse others of abusing the law, what would Apostrophe be doing then?  <br> <br>Where did you get that idea?! My whole point is that the law doesn't even work! Do you get that part? Again: I DO NOT THINK LIKE YOU. <br> <br>&gt; Their only option was to seek legal redress. <br> <br>Nope. <br> <br>&gt; Perhaps you're suggesting, with your civil war swagger and Kalashnikov that you know a better way. <br> <br>Actually, the fact that I lived through that taught me that that doesn't work! And my point is that your cherished social systems are simply a bloodless version of that savagery. <br> <br>&gt; You are just so screwed up because they answered your call <br> <br>Everybody's a little screwed up - but my screwiness has nothing to do with the font world. On the other hand, the screwiness of both sides of this confrontation has everything to do with self-righteous fundamentalism. Trust me, I know it when I see it. <br> <br>&gt; Apostrophe is a proven liar, thief and fantasist. His words carry no weight. <br> <br>His words carry less weight than that of his opponents. However, the words of his opponents carry less weight than they did before the confrontation - and that's only *their* fault. Get it? <br> <br>&gt; You are a proven, captured and made to pay font thief. <br> <br>More distortions. Read the archives. <br> <br>&gt; All you're doing is trying to shake the tree to see what falls out.  <br> <br>Nope. The tree has fallen, and I'm simply pointing that out. <br> <br>&gt; don't visit forums like this because of your rantings <br> <br>They're free to ignore me! If they don't have the willpower to co-exist with somebody they don't like/agree_with, whose weakness is that? <br> <br>&gt; Places you'll *never* be invited to. <br> <br>Why do you assume I want to be invited to places frequented by over-the-hill deluded misers? <br> <br>&gt; you're the one who has no respect or standing. <br> <br>I can assure you that over time I've made a quantity and quality of friends to more than match this rag-tag collection of opponents. You're just not in the right circles. <br> <br>Look at it this way: <br>I'm on an accelerated program: I've made more friends and enemies in four years than most people do in a lifetime. Why even make any enemies? One reason is that -when like me you don't care about being a politian- the strength of your friends is proportional to the strength of your enemies. Or maybe it's just the way I am. In any case, I *do* try to compromise - but it *is* a two-way street. <br> <br>---- <br> <br>&gt; you just wore out your welcome.  <br> <br>Among certain people, I was never welcome. <br>Among others, I'm more welcome than ever. <br> <br>The type community isn't one big block - I'm disliked in some parts, liked in others. Normal. <br> <br>&gt; this isn't irreversible <br> <br>Nothing is. <br> <br>But the bridges you speak of, I'm not burning them. I simply refuse to cross some of them, occasionally speaking out as to why: those bridges lead to disreputable people. <br> <br>You see, I enjoy a certain luxury: because I don't expect to make a living in type design, I can be honest, instead of suffering the internal nail-biting of a canniving diplomat. The good news is that along with the people I alienate (who aren't people I would enjoy associating with anyway!), I have endeared myself to some others. This is not my imagination. <br> <br>All of us have some controversial positions - I'm just lucky in this context (but not the in the context of my day job, mind you) to be able to voice many of them! Are you envious? <br> <br>&gt; You're so far gone you don't even know what planet you're on.  <br> <br>You're too naive. <br> <br>And no, I will never stop being Hrant. When they asked me in kindergarten \"what will you be when you grow up\", I responded: \"I am the Hrant.\" Egomaniac? Probably. Candid? I try to be - unlike too many people around here. <br> <br>What will *you* do, is what you should ask yourself. <br> <br>hhp </p>"
    html_clean: "<p> &gt; I am just a bystander <br> <br>And how in hell are we supposed to know that.. or believe it?... <br> <br>&gt; cite your evidence. <br> <br>I'm sorry - my hands are tied. You don't have to believe me - but I hope there's more to your life than \"evidence\". <br> <br>&gt; You, Papazian, talk of Apostrophe as if he is some friend of yours <br> <br>Nope. <br> <br>&gt; you've some sympathy for his cause!? <br> <br>You're seeing this as black-and-white, just like so many others are, just like your entire society forces you to be. I think Apostrophe did something very wrong. I think his hunters did something almost as bad. Get it? <br> <br>&gt; You want to accuse others of abusing the law, what would Apostrophe be doing then?  <br> <br>Where did you get that idea?! My whole point is that the law doesn't even work! Do you get that part? Again: I DO NOT THINK LIKE YOU. <br> <br>&gt; Their only option was to seek legal redress. <br> <br>Nope. <br> <br>&gt; Perhaps you're suggesting, with your civil war swagger and Kalashnikov that you know a better way. <br> <br>Actually, the fact that I lived through that taught me that that doesn't work! And my point is that your cherished social systems are simply a bloodless version of that savagery. <br> <br>&gt; You are just so screwed up because they answered your call <br> <br>Everybody's a little screwed up - but my screwiness has nothing to do with the font world. On the other hand, the screwiness of both sides of this confrontation has everything to do with self-righteous fundamentalism. Trust me, I know it when I see it. <br> <br>&gt; Apostrophe is a proven liar, thief and fantasist. His words carry no weight. <br> <br>His words carry less weight than that of his opponents. However, the words of his opponents carry less weight than they did before the confrontation - and that's only *their* fault. Get it? <br> <br>&gt; You are a proven, captured and made to pay font thief. <br> <br>More distortions. Read the archives. <br> <br>&gt; All you're doing is trying to shake the tree to see what falls out.  <br> <br>Nope. The tree has fallen, and I'm simply pointing that out. <br> <br>&gt; don't visit forums like this because of your rantings <br> <br>They're free to ignore me! If they don't have the willpower to co-exist with somebody they don't like/agree_with, whose weakness is that? <br> <br>&gt; Places you'll *never* be invited to. <br> <br>Why do you assume I want to be invited to places frequented by over-the-hill deluded misers? <br> <br>&gt; you're the one who has no respect or standing. <br> <br>I can assure you that over time I've made a quantity and quality of friends to more than match this rag-tag collection of opponents. You're just not in the right circles. <br> <br>Look at it this way: <br>I'm on an accelerated program: I've made more friends and enemies in four years than most people do in a lifetime. Why even make any enemies? One reason is that -when like me you don't care about being a politian- the strength of your friends is proportional to the strength of your enemies. Or maybe it's just the way I am. In any case, I *do* try to compromise - but it *is* a two-way street. <br> <br>---- <br> <br>&gt; you just wore out your welcome.  <br> <br>Among certain people, I was never welcome. <br>Among others, I'm more welcome than ever. <br> <br>The type community isn't one big block - I'm disliked in some parts, liked in others. Normal. <br> <br>&gt; this isn't irreversible <br> <br>Nothing is. <br> <br>But the bridges you speak of, I'm not burning them. I simply refuse to cross some of them, occasionally speaking out as to why: those bridges lead to disreputable people. <br> <br>You see, I enjoy a certain luxury: because I don't expect to make a living in type design, I can be honest, instead of suffering the internal nail-biting of a canniving diplomat. The good news is that along with the people I alienate (who aren't people I would enjoy associating with anyway!), I have endeared myself to some others. This is not my imagination. <br> <br>All of us have some controversial positions - I'm just lucky in this context (but not the in the context of my day job, mind you) to be able to voice many of them! Are you envious? <br> <br>&gt; You're so far gone you don't even know what planet you're on.  <br> <br>You're too naive. <br> <br>And no, I will never stop being Hrant. When they asked me in kindergarten \"what will you be when you grow up\", I responded: \"I am the Hrant.\" Egomaniac? Probably. Candid? I try to be - unlike too many people around here. <br> <br>What will *you* do, is what you should ask yourself. <br> <br>hhp </p>"
