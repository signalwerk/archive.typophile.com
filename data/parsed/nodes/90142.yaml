      <p>Igdesign,<br>
      I thought it is a new logo for the site <a class="freelinking external" href="http://www.lanefurniture.com/" rel="nofollow">http://www.lanefurniture.com/</a></p>
      <p>About the Weight of /N/ /E/, I agree it it may be a bit too tight now.<br>
      Another point is the /A/ /N/. The horizontal line of the /N/ crates an optical illusion which lets the end stroke of the /A/ appear to be asymmetrical, although it is perfect. An explanation of what I mean is here: <a class="freelinking external" href="http://66.147.242.192/~operinan/2/2.3.2a/2.3.2.06.illusion.htm" rel="nofollow">Crossed lines can appear broken</a></p>
      <p>I personally find the logo suggested by apankrat beautiful. Although I don't know how versatile it is.<br>
      Your current logo proposal will be perfectly identifiable at small sizes, business cards, letter heads, etc.</p>
