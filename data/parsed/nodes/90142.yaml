      <p>I think the changes on the thickness of the E have helped. But is the spacing between the A and the N looking a little tight? I might try increasing it a little.</p>
      <p>On the whole I wonder if having the type tracked so tightly is the right approach though. It might be an idea to go the other way and space the letters out. It could give the wordmark a more indulgent, expansive feel, which may give it a more classic, sophisticated look, whereas at the moment it's looking slightly edgy, especially with those sharp serifs.</p>
      <p>Hope that helps</p>
