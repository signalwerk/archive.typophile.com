    <p>Wordmark is for a b2b services company that wants to be perceived as:<br>
    Classic, Sophisticated, Mature, Serious and Traditional</p>
    <p>Are these kind of forced ligatures too much? I wanted the mark to be unique but am I sacrificing too much legibility here?</p>
    <p>Thank you</p>
