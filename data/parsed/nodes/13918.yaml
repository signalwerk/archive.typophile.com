    <p>In typography, the term bicameral refers to <a href="/node/12248" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Alphabets</a> which are made up of an <a href="/node/13919" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">upper</a> and <a href="/node/17241" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Lower Case</a>. These alphabets include the <a href="/node/14789" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Greek</a>, <a href="/node/14507" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Roman</a>, <a href="/node/add/wiki?edit%5Btitle%5D=Armenian" title="Create node &quot;Armenian&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Armenian</a> and <a href="/node/14164" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Cyrillic</a> alphabets.</p>
