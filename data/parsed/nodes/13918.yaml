    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Terminology" class="freelinking" rel="nofollow">Terminology</a> : Bicameral</strong></p>
    <p>In typography, the term bicameral refers to <a href="/wiki/Alphabets" class="freelinking" rel="nofollow">Alphabets</a> which are made up of an <a href="/wiki/Upper%20Case" class="freelinking" rel="nofollow">upper</a> and <a href="/wiki/lower%20case" class="freelinking" rel="nofollow">lower case</a>. These alphabets include the <a href="/wiki/Greek" class="freelinking" rel="nofollow">Greek</a>, <a href="/wiki/Roman" class="freelinking" rel="nofollow">Roman</a>, <a href="/wiki/Armenian" class="freelinking" rel="nofollow">Armenian</a> and <a href="/wiki/Cyrillic" class="freelinking" rel="nofollow">Cyrillic</a> alphabets.</p>
