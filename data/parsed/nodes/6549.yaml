    html: "<p>The most common Latin word would be <i>ora</i> which means an edge or boundary, but which is applied to the coast also. <br> <br>Here are a few from dictionaries that I am fairly sure of: <br> <br>In Indonesian it is <i>pantai.</i> <br> <br>In Dutch it is <i>kust</i>, while in Afrikaans it is <i>kus.</i> <br> <br>My favourite may be the Tagalog (Philippines) word <i>pampang.</i> <br> <br>I think in Swahili it is <i>pwani</i>, but can't guarantee that.</p>"
