    html: |-
      <p>Perhaps this is already being done, but....</p>
      <p>In terms of the relationship between upright and italic, generally after you slant* the italic, you need to also shift all the glyphs slightly to the left, to compensate for their new lean to the right.</p>
      <p>The amount of the shift is arguable. Do you do the compensation based on making up for the italics at half the x-height, or half the cap height, or something in between? I tend to go about 50-60% of x-height....</p>
      <p>So the amount of shift is about 1/2 * xheight * [sin (italic angle)].</p>
      <p>* Of course it is usually more than just slanting.</p>
      <p>[EDIT: fixed error in formula!]</p>
