      <p><em>.... When the italic is selected it looks like it is nearly touching the roman weight?</em></p>
      <p>If you work with FL, you have 4 options as a reference to slant transformation: <strong><em>"Zero Point, Center of Selection, Bottom Left Corner</em>, and <em>Reference Point"</em></strong>. What happens to your description seems to use the reference "zero point" or "Bottom left corner". If you choose the "center of selection", then you'll get a glyph (some still do) amid heavy point glyph box. This will solve the problem of individual glyphs. But will most likely change the composition of the kerning and metrics when applied to all existing glyphs.</p>
      <p>IMHO, indeed more appropriate to use the reference "zero point" or "Bottom left corner" but it should do a re-adjustment as the value that has been suggested by <strong>Thomas</strong>. Or a practical way: subtract the left bearing with a specified value (eg -10) but you have to add +10 on the right bearing. This is I called a "zero sum balance" aims to glyph still get the same size of glyph box. This method is more stable against possibility of changing the composition of kerning</p>
      <p><strong>@Thomas</strong> ... Thanks for your formula. it's interesting to try</p>
      <p>Best Regatds.</p>
    html_clean: |-
