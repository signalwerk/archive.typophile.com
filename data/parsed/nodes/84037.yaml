    <p>Dear All</p>
    <p>In my typeface, lets say there are two words: hello and, (see attached makeshift example image), when I select the word: hello, in italic in InDesign the right word: and, comes way too much to the left, why does this happen and how do I correct this in FontLab? Basically the italic selected word does not increase or keep the same the space on the right of the word: hello&gt;</p><div class="imageWrap"><img src="http://typophile.com/files/problem_6143.gif"></div><p></p>
