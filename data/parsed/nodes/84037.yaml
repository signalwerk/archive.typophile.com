      <p>OOPS, error in my formula! Should be 1/2 * xheight * [sin (italic angle)]. Somehow I got a divide instead of a multiply. (I went back and edited it in my original post, too. I just don't want to leave anybody messed up who just reads it there.)</p>
      <p>Note also that if you use Excel, it expects angles in radians rather than degrees. The Excel version of my formula would be:<br>
      =0.5*SIN(RADIANS(n))*x</p>
      <p>Where "n" is the italic angle and "x" is the x-height. You can bump up that 0.5 a little to maybe even 0.6, if you want to accomodate caps and letters with ascenders a bit more.</p>
      <p>BTW, the "average" results of my formula, with a 1000-unit em, a 500-unit x-height, and an 11 degree italic angle, should be about 47 units to shift.</p>
      <p>* * * *</p>
      <p>"IMHO, indeed more appropriate to use the reference "zero point" "</p>
      <p>I agree whole-heartedly. For a starting point for italics, that's about the only sane thing to do. Then do the global left shift on the whole font.</p>
      <p>Of course, that transformed glyph may be just a placeholder for one that has been properly reshaped. Even in a sans serif, you'll need to do something else to get your round letters the right shape. But having that initial auto-transform might still be helpful for positioning/spacing.</p>
      <p>Of course, I suck at spacing anyway, feel free to ignore me.  :)</p>
      <p>Cheers,</p>
      <p>T</p>
