      <p>&gt; just a personal/family project...<br>
      &gt; It'll be heavy on pictures and scans of documents</p>
      <p>Then maybe just go for the look of a vintage diary or photo album (you can find examples via Google), with some period-appropriate fonts. Maybe do captions in a handwriting font if they aren't too long. </p>
      <p>And at iStockPhoto.com if you search for phrases like "photo album vintage" you can find inexpensive stock art that might be useful (backgrounds that simulate old paper, old photo corner mounts, etc.).</p>
