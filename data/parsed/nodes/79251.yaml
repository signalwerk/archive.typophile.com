      <p>Thanks for all the input. This is good stuff! I hand't thought about the "romantic adventure" aspect of what he did. I guess because most of the documents of his I have involve swords and explosions and things like that. The adventure novel idea certainly has some potential (too bad I'm not an illustrator).</p>
      <p>I probably should've been clearer about what it is I'm working on. It's just a personal/family project to be printed through blurb.com. It'll be heavy on pictures and scans of documents, and fairly minimal in the text department, but some of the adventure novel stuff could certainly be woven in.</p>
      <p>thanks!</p>
