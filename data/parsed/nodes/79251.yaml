      <p>The notion of manliness is problematic, because many of the gentlemanly qualities that were appropriate to real men in the 1920s would now be considered effete. Russel Crowe did not play Robin Hood in tights, as Errol Flynn did.</p>
      <p>Perhaps a graphic quality like an adventure book from the 1920s would be good to aim for, as you grandfather's story seems to have been one of romantic adventure.</p>
      <p>Rockwell Kent, although not a navy man, was a sailor and adventurer, his <em>NbyNE</em> comes to mind (scroll down the thread for images):</p>
      <p><a href="http://www.typophile.com/node/57532" title="http://www.typophile.com/node/57532">http://www.typophile.com/node/57532</a></p>
