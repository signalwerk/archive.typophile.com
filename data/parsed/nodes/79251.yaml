  html: |-
    <p>I'm working on a book about my grandfather, who was a badass US Marine in the 1920s (first, he lied about his age to join the US Navy, and served in WWI, and then when he got out, he joined the Marines and served in South America). I'm looking for typeface suggestions for both headlines and body copy — something that would've been used in America around that time, that would also be appropriate for a guy who, with his bare hands, saved a woman from a sword-wielding criminal in Nicaragua.</p>
    <p>Franklin Gothic is the only thing that comes to mind.</p>
    <p>Would a Clarendon work? I know it's origins are in England, but it seems like it could work.</p>
    <p>thanks!</p>
