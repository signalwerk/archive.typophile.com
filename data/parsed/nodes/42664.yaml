    <p>Why is it nowadays there is no careful crafting of type for much-exposed titling for things like movies? For example the highly-acclaimed "There Will Be Blood" uses a typeface that is repeated yet its supposed to look gothic and somewhat grunged? Take a look at the example, with the tile, and see the "l"'s and the capitol "B"'s and "o"'s are the same, just like when you type them out on your computer. Wouldn’t you think the designers would take the time to build variation from repeated letter-to-letter? I know most consumers wont notice, but it bugs me to bloody hell why they cant stop being lazy and add some variation to make it custom. I see this more and more, and worry its the new age of laziness. What are your thoughts on this?</p>
    <p><a href="http://media.movieweb.com/galleries/4743/posters/poster4.jpg" title="http://media.movieweb.com/galleries/4743/posters/poster4.jpg">http://media.movieweb.com/galleries/4743/posters/poster4.jpg</a></p>
  html_clean: |-
