    html: |-
      <p>See <a href="http://forum.fontlab.com/fontlab-studio-tips-and-tricks/font-family-naming-in-fontlab-studio-5-t313.0.html" target="_blank" rel="nofollow">Adam's description</a> and <a href="http://kltf.de/kltf_otproduction.htm" target="_blank" rel="nofollow">my illustration</a>.</p>
      <p>Windows allows for four Regular, Italic, Bold, Bold Italic styles per family only. There's no place for anything like Minor or Light. You'd need to move Minor Light to the Family Name and make sure that Style Name is exactly one of the above-mentioned four.<br>
      You can assign any number and kind of styles via Preferred Family/Style Name on the next Font Info page. This then is used e.g. in CS apps.</p>
      <p>You may also try FOG5's Font Info dialog in Easy mode, fill in Family Name and Design Parameters and then check in Advanced mode which names it has produced.</p>
