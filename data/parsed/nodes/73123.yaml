      <p>@ Andreas</p>
      <p><cite>And one day I wish to see MS adressing typography’s peculiarities, to bother us no longer.</cite></p>
      <p>Even if Microsoft applications would make use of the same name records as Adobe applications, you still should care about backwards compatibility. We are not talking about a hack for Windows, that might cause problems with your fonts, when Microsoft has addressed “typography’s peculiarities”.</p>
      <p>It <em>is</em> your fail, if you don’t care about other platforms, the specifications or the recommendations of experts like Adam. I only wonder, that it was the first time, that you got a bug report. The MAC is not the mother of all computers and even for creatives it is not necessarily better than Windows.</p>
      <p>Addition to my first post in this thread: I don’t style link weights, but uprights and italics only, because in most cases the regular weight is style linked to the semibold, but not to the bold weight. If there is a bold style in the family, the Office user could accidentally take that instead of the semibold weight and the other way around.</p>
