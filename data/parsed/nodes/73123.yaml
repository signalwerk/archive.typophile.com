    html: |-
      <p>You can split Lapidaria in Lapidaria Minor, Lapidaria Medior and Lapidaria Maior (FontLab info panel / OpenType-specific font names / OT Family Name). This would improve the comfort; if the user wants to switch between Minor, Medior and Maior, he would do it with the font main menu in Adobe applications. And the weight would be changed with the font sub menu. Because I assume, that you did not make mistakes with regard to Lapidaria Light only, you have to correct the names of the whole family.</p>
      <p>If you decide to style link the semibold styles to the regular styles, the family names of the semibold and the regular styles must be Lapidaria Minor, Lapidaria Medior and Lapidaria Maior. And the family names of the Lapidaria Light styles must be Lapidaria Minor Light, Lapidaria Medior Light and Lapidaria Maior Light. If you don’t want to style link them, the style names must be regular in case of all nine styles. If you want to style link regular and semibold, the style names of the three semibold styles must be bold and the style names of the other six styles must be regular.</p>
      <p>The thread on the FontLab forum is really good. In one of my posts you find links to all technical documents, that I have found with regard to the naming.</p>
      <p>The FontLab info panel "Additional OpenType Names" is useful, if you really want to have full control over the naming.</p>
