    <p>Maybe this has been raised before. </p>
    <p>I quote from MyFonts support messages:<br>
    <cite>We received a report from a customer regarding a problem with Lapidaria<br>
    Minor Light … On Windows, Lapidaria Minor Light shows up as just Lapidaria. If it is installed in addition to the free Lapidaria Medior, it is not possible to<br>
    access both fonts; one overwrite the other. … Windows can handle only regular, bold, italic and bold-italic as styles within a family.</cite></p>
    <p>– Really??!</p>
    <p>Now I wonder:<br>
    – I have other families in stock named individually, no complaints so far.<br>
    – on the Mac the family runs perfectly.</p>
    <p>Now here’s a screenshot from the font’s relevant naming entries. I will have to change something *anyway*, but what?<br>
    .<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/LapidariaLight_names_1_5723.jpg"></div><br>
    .<br>
    Thanks in advance for some hints. This really annoyes me.<p></p>
