      <p>I've used Adams' namining system for some six years with no hitch. But I must say that there should be a <em>lot</em> more simple way for naming fonts.</p>
      <p>I would like to challenge the people from Apple, Microsoft and Linux to write a proper piece of code to get all of us out of this totally unnecessary tinkering.</p>
