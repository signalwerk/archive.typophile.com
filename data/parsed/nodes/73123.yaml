      <p>Hey all:</p>
      <p>The source of our troubles is that people need new fonts and new font formats to:</p>
      <p>1) work with previously existing apps and OSes<br>
      2) work with both Mac and Windows<br>
      3) display more typographically reasonable behaviors (or in this case, names) in savvy apps</p>
      <p>So we end up with needing to have multiple sets of info in the fonts, to handle legacy Mac constraints, legacy Windows constraints, and the preferred way we want things to work going forwards.</p>
      <p>Many of the most confusing aspects of OpenType font development stem from this issue: naming, vertical metrics, etc.</p>
      <p>If you want font naming to be easier, Apple, Microsoft and Linux are the wrong folks to bother:</p>
      <p>1) Neither you nor they are likely to be willing to abandon compatibility with existing apps and OSes.</p>
      <p>2) If you did want to abandon that, you'd want your approach enshrined in the OpenType / Open Font Format specification as well, and you should make your pitch on the appropriate mailing lists.</p>
      <p>3) If you are going to work within the existing framework of the world, the place to deal with this is in the tools! Adobe has already contributed work on *testing* families to show whether the names seem to be properly coordinated. What is needed is a framework to make it easier to properly coordinate font names across an extended font family in the first place.</p>
      <p>Adam Twardoch is one of a handful of people (including me as well) who know this naming stuff inside out and backwards, and understands the hassles it creates. He did a bunch of research towards this in working on the new Fontographer. Probably one of the most useful things they could do in FLS 6 would be to further develop this, and if done right could drive some upgrade revenue.</p>
      <p>Cheers,</p>
      <p>T</p>
