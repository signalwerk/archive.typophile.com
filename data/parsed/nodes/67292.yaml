      <p>shapeau my friends.<br>
      interesting fact is mentioned by Henry Friedlander, the designer of the Hadassah type:</p>
      <p>"מרודולף קוך למדתי את הערך האנושי ואת כוח הביטוי הגנוז בכתב, מידות שאינן קשורות ליופי פורמאלי, כי אם מצויות אפילו בצורות מכוערות לפי מושגים מקובלים." [מקור - הספר "אות היא לעולם", ישראל. משרד החנוך והתרבות. האגף לתרבות תורנית]</p>
      <p>(rough translation)</p>
      <p>"from Rudolf Koch i have learned the human value and the hidden expressive strength in type- measures which has nothing to do with formal beauty, but are existent in even the ugliest forms by common standarts".<br>
      [Henry Friedlander, taken from "ot hi leolam" book, israel, dep. of education and culture]</p>
