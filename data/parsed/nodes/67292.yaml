      <p>The relatively-recent English-language monograph <a href="http://www.amazon.com/Rudolf-Koch-Letterer-Designer-Teacher/dp/1584560134/ref=sr_1_7?ie=UTF8&amp;s=books&amp;qid=1265893696&amp;sr=8-7" rel="nofollow">Rudolf Koch: Letter, Designer, Teacher</a> is quite OK, too. I certainly enjoyed reading it, and finally bought a copy a few months ago. On Amazon.com right now, you can get a copy for less than $20. The author translated a number of texts from German to English himself.</p>
      <p>Other excellent English-language sources are the Rudolf Koch chapter in <em>Letters of Credit,</em> as well as the two <em>Fleuron</em> articles that touch on his work… an article about Karl Klingspor, and another about Koch's work itself. Both <em>Fleuron</em> articles were written while he was still alive. But I doubt that either of them covers work like the Haggadah.</p>
