    <p>hello.<br>
    i would like to know more details about the typographer rudolph koch's ties with the jewish community and his designs made for the jews, like the offenbacher haggadah.</p>
    <p>also, for hebrew readers, i wrote an essay about koch's work in my hebrew blog:<br>
