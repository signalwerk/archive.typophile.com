      <p>The first edition of this book was a private project of the notary Dr. Guggenheim of Frankfurt a.M. For the German text a very early stage version of the later called "Jessen Schrift" was used. The Hebrew letters for text setting are from  the Frankfurter Druckerei J. Kaufmann (no Klingspordesigns, a compromise). The Hebrew titles are made by Berthold Wolpe (woodcutter). Max Dorn does the book design. The musical notes are probably made by a son of Rudolf Koch, Paul Koch. The illustrations are made by Fritz Kredel (woodcut) and are hand colored. The book binding versions were done by Dorothea Freise. I think all persions belong to the Koch-Kreis. The price for the paper-bound version was 60 RM (a lot of money in 1928) and could be ordered directly from Dr. Guggenheim. </p>
      <p>The known and popular second release from 1960 used a new layout with the typeface Palatino.</p>
      <p>There are a loot of literature available of Rudolf Koch - I think, he is the most commented and documented type designer of Germany.</p>
      <p>If you like to know more you have to read German books about him. Have a look to <a href="http://www.zvab.com/refineQuickSearch.do?anyWords=%22Rudolf+Koch%22+%2BKlingspor&amp;lastXDays=-1&amp;submit=Suchen" title="http://www.zvab.com/refineQuickSearch.do?anyWords=%22Rudolf+Koch%22+%2BKlingspor&amp;lastXDays=-1&amp;submit=Suchen">http://www.zvab.com/refineQuickSearch.do?anyWords=%22Rudolf+Koch%22+%2BK...</a></p>
