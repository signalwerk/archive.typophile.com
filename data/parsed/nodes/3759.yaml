    html: "<p>John, I don't agree. <br>But I started out as an ad agency art director who became more and more interested in typography, and eventually ended up designing typefaces. <br> <br>I don't think anything in the art/design sphere is that difficult that you can't get up to a good professional level in a few years studying and working at it (providing you have a general aptitude for visual art).  <br>But there is a diffenence between plying several trades sequentially, and juggling them at the same time. <br> <br>Multitasking is harder, because while the basic skill may be there in a variety of areas, getting your head into \"where the scene is at\" in a particular discipline is harder, and the design modality is slightly different than the typographic. <br> <br>What's hard: switching modes. These days, I find myself favoring typographic solutions to art direction problems (in my book cover design work), and constantly have to guard against it, because letting a design ride on some clever typography is not often the best way to please one's client.</p>"
