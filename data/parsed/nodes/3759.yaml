    html: "<p>When I was in high school, my art teacher used to call me \"the Renaissance kid.\" My AP chemistry teacher insisted I had a career in science. And my AP English teacher thought I should become a writer.  <br> <br><i>&gt;...is there anybody out there who is actually successful in many mediums? </i> <br> <br>I eventually took a degree in fine art, and I had a couple of exhibits in commercial galleries before I got sick of the art \"scene.\" I have been a graphic designer for about 20 years. I have designed a few websites, coding the HTML manually in a text editor. I was competent, but didn't feel like trying to keep up with the ever-evolving standards. I have also worked as an illustrator and recently completed a set of twelve illustrations for a toy/gift packager. But I don't pursue that so much any more (the field has gotten so competitive). For the past few years I have been focused on book design (interiors and some covers) and type design. <br> <br>I suppose it all depends upon how you define \"successful\".  <br> <br>The flip side of \"Renaissance man\" is sometimes expressed as \"Jack of all trades, master of none\". <br> <br>I agree mostly with what Nick said. The distinction of working sequentially versus simultaneously in several disciplines is an important one. Switching gears is the hardest part. <br> <br>As far as advice in how to pursue many interests, it boils down to what Paul Giambarba said above, which can also be summed up by that shop-worn Nike slogan.  <br> <br>I have found that working as a freelancer has afforded me the flexibility to pursue new opportunities as they arose and to follow my personal interests and natural curiosity. However, it is not the route for everyone. Especially if financial security is important. It helps if you maintain a simple lifestyle. And it helps to have an understanding spouse whose interests, talents, and strengths complement your own. <br> <br>Incidentally:  <br>W A Dwiggins [designer of Metro, Electra, Caledonia, among others] started out as a graphic designer (a term he actually coined), but was also a well-known illustrator. He spent the latter part of his career focused on book design and type design.  <br> <br>Rudolph Ruzicka [Fairfield, Primer] was a well respected and sought-after illustrator (mostly wood engravings) and book designer.  <br> <br>Warren Chappell [Trajanus, Lydian] was also an illustrator and book designer. <br> <br>Eric Gill [Gill Sans, Perpetua, Joanna, et al.] was an illustrator/artist and stone cutter. <br> <br>Hermann Zapf [Palatino, Optima, Melior, et al.] was a book designer as well. <br> <br>-- K. <br> <br></p>"
