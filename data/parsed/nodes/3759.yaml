    html: <p>This is reminds me of the typophile of old. <br>Hudson, Berkson, Stand�n and Papazian in a 15 foot philisophical steel cage... I digress. <br> <br>Professionally, I think trying to do it all will be a disaster. Everyone measures the opportunity cost of say, learning Flash action scripting, and makes a judgement to proceed, or hire someone. Most often it is more cost effective to hire someone. If you enjoy a challenge, you may do it yourself anyways for the sheer pleasure of kicking Flash butt. (or Fontlab, or watercolor, or construction, or whatever it is).  <br> <br>I don't recommend buying a copy of <i>Home Surgery for Dummies</i> and grabbing some cutlery and a few paper towels.  <br> <br>Randy</p>
