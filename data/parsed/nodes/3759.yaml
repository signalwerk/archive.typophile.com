    html: <p>Frank, <br> <br>I sooooo know what you mean. Especially in web, things go so fast it's really easy to get outdated. I've been called a Renaissance girl before, I blame this on the fact that I literally want to know everything and try everything and I'm extremely stubborn at this. <br> <br>If I were you, I'd try to learn the very basics and widest aspects of each thing you want to know. These are less likely to change over time (instead of keeping up to date with the latest fonts, learn how to kern well. This can apply to everything). I'd ask people around for which books are best for learning certain things and also finding good resource sites with forums like this one where people can learn off each other.  <br> <br>Another advice would be to keep in good physical shape (and mental shape should come with it at the same time). I used to think working out twice a week was 2 hours less in my schedule, in fact it's not, it's probably an added 4 hours (if not more) in terms of being awake and focused at what I'm doing. Keeping a clear mind will help you learning more efficiently. <br> <br>You can also ask yourself what you really aspire to. (i.e. Is being skilled in all aspects of designs your direct goal or would it be a way of achieving something else for which there might be other ways?) I know for one I've often aspired to things that once I had, I realized it wasn't all that important in the end. =) <br> <br>Em</p>
