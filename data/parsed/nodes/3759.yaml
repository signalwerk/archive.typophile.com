    html: "<p>Hello Everyone. <br>This thread is very timely for myself, for the juggling, flailing, mixing of many fields has been one of glorious disaster and horrible triumph for me.  <br> <br>Last Saturday, I had what I considered my most fruitful day of work ever: up by 6am, read a good portion of Chaplin's autobiography, set three pages of type for a book of poetry, read about Elizabethan drama, wrote 5,000 words of my novel, finally structured the short film I'm shooting on Friday &amp; Saturday and then read some letters of Lord Byron. I was in a strange exhausted sort of ecstasy following some time with Bach searching for the themes in his variations, content with the days work. <br> <br>But the next few days were pure hell, the deepest depression I've ever had. In my more coherent moments, I have accused that terrifyingly perfect Saturday of ruining my mind, which already was unfocused for decades but not to such a complete degree of fruitfulness.  <br> <br>It seems that discipline and a time of reflection before and after the time of work is absolutely necessary. Probably keeping my body in shape is a good idea, too, though I haven't extended my discipline to that area of life. <br> <br>Personal routine: <br>everyday I must do three of these four things, and must never skip the same thing three days in a row: 1. Memory Palace (don't ask) 2. read fiction 3. read non-fiction: aesthetics or philosophy or history 4. draw <br> <br>If I do not do these things, I do not allow myself to work on any of my projects. It's harsh, but it seems to have worked. Notable on Saturday was that I did not prepare myself and on Sunday and Monday I was unable to do the routine (family, teaching, etc).  <br> <br>But I am young and certainly foolish. I registered for typophile before finding this thread and I used a quote from my own novel (forgive me) to attach to my profile. I don't know if it will appear on this post, but it had to do with Leonardo da Vinci and his own dissatisfaction with his life. I fully expect to have the same dissatisfaction, but I doubt it will be for nearly as a great a body of work. <br> <br>A body of work, a corpus, is exactly that. The final assessment of a person's life comes as they are finally making their house in order as death draw's near. I've fought to keep notions of success out of my head, and failed all too often: perhaps I should listen to that clear-thinking rascal Schopenhauer, and simply live.  <br> <br>I feel blessed that type is a part of that living. <br>~h</p>"
