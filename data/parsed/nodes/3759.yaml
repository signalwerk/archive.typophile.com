    html: "<p>A social life is possible, with a supportive spouse, but you should rule out vacations  and entertainment. Avoid housework. Multi-task: Travel should be combined with exercise, on a bike. Business should be combined with lunch. TypeCon is a vacation. <br> <br>If you have a party, greet your guests at the door, \"Hey everyone, so and so is here,\"  introduce likely soul mates, then back to the studio. Reemerge every hour or so for 5 minutes. <br> <br>Above all, don't fritter your days away on email and online forums.</p>"
