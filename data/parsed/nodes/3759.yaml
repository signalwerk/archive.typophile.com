    date: null
    date_raw: null
    votes: null
    html: "<p>From various comments here, finally from Kyle's, I surmise that typography is necessary to graphic design, but graphic design is not necessary to typography. This makes practical sense, and also explains how it is possible to be a first rate typographer and have neither interest in nor aptitute for the broader discipline of graphic design. <br> <br>This is not to say that such a typographer might not be capable of some kinds of extra-typographic design, but he will probably approach them in the same spirit as he designs and sets type. I'm thinking here of Jan Tschichold's covers for Penguin, which frequently employed illustration and other non-textual, graphic elements but always in a typographic context: the opposite of the general graphic design context.</p>"
    html_clean: "<p>From various comments here, finally from Kyle's, I surmise that typography is necessary to graphic design, but graphic design is not necessary to typography. This makes practical sense, and also explains how it is possible to be a first rate typographer and have neither interest in nor aptitute for the broader discipline of graphic design. <br> <br>This is not to say that such a typographer might not be capable of some kinds of extra-typographic design, but he will probably approach them in the same spirit as he designs and sets type. I'm thinking here of Jan Tschichold's covers for Penguin, which frequently employed illustration and other non-textual, graphic elements but always in a typographic context: the opposite of the general graphic design context.</p>"
