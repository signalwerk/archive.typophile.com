  html: <p>hey guys I need some help. <br>I am currently a web designer..however due to my hectic schedule I never seem to have enough time to myself to pursue other interests like creating type, drawing, or other design discplines...it is my aspiration to be skilled in all facets of design...is there any advice one can share in terms of pursuing ones interests or how one should go about being a "rennaisance" man?</p>
