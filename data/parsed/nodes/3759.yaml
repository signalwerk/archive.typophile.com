    html: <p>Did I leave alcohol off of my list? Don't get me wrong, a fine glass of slivovitz after the requisite cups of coffee makes a page shimmer beautifully... <br> <br>Emilie, I'm glad you mentioned Camus because by sheer accidental and wholly american association, I think of Gide. His Lafcadio is one who must be thought of and emulated when thinking of the Renaissance man (doubtful term though it is) and intending to keep suicide far from home. For to Lafcadio was given the gift of laughter (forgive this sententious speech, laced with words like sententious), which Bataille embraced so strongly. Such joy is the only thing to give life to a person that tries to "do everything," which we all know is an impossibility and truly something ridiculous. A man who writes and wishes to preserve his text in type, must (or may) learn the art of typography [this sentence seems absurd now that I reread it]. A storyteller, if he believes that medium is as important as the message (a typographer's attitude if ever there was one), may try to learn as many different media as he feels are necessary to telling the story the best way possible (be it book, film, poem, play etc). But the despair which follows, something I recently experienced, is more likely to be based in fear than utter disappointment. Recall that in my post above, I considered it to be a "successful" day. Blasted wondrous life of paradox. Thus, Lafcadio to your Sisyphus. (Les Caves du Vatican is translated into English as Lafcadio's Adventures, by the way��which doesn't quite match up when you read it). <br> <br>And yes, you've guessed it��my career in surgery ended early. Stupid wiggly fruit flies. </p>
