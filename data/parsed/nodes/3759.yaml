    html: "<p>This is my mantra -- and what I try to instill in designers that work under me. <br> <br>I pose the question: <br> <br>What seperates fine art from graphic design. <br> <br>My answer is this: the addition of type, or typography. <br> <br>There is not a place where design can be 'good', without 'good' typography, the result would be an oxymoron. <br> <br>I truely believe it is not possible to be a good designer, with a firm understanding of typography. Good design is effective communication of a message -- even if the message is to confuse. <br> <br> <br>I would agree that type designers usually dont make good graphic designers. Much like good developers dont make good designers. <br> <br> <br>Hildebrant.</p>"
