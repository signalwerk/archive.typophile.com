    html: "<p>Wise words Shinn &amp; Simon Schmidt. I'm into this life for 6 years now. Lucky enought I found out at the same time I went into design a very special girl than just keeps \"waiting\" for me and the promissed weekends &amp; vacations. The problem is that this is getting worse as time goes by and in fact I don't have a valid vacation for 3 years now and used the company vacations in August on very important works. <br> <br>So, this post came out on it's perfect timming. I've been a web designer &amp; programmer for 4 years (8 hours a day) at a multimedia company and when I return home I systematicaly turn on my computer and work on my freelancer work (mainly ID's &amp; some cool\"er\" sites), usually more 4-5 hours a day. I admit this is a disease, being a designworkaholic, but I found out that the only thing that kept me going was the pleasure of what I did at home, and this got to a point that I loss all the will to work at the webcompany. So, typophiles I'm happy to report that from April to the end of the year I'm quitting the day job and focus on what I really like (as a freelancer) &amp; hoefully have time for the family &amp; the clouds. <br> <br>I'd say: See what gives you more plasure on your work (don't be afraid if it just open Illustrator &amp; place a real huge g on the canvas, change the colour, smile and close the program) and if it's economically profitable, and decide! It's better to make a wrong decision than keep on trying everything at the same time and never decide to change and feel miserable every day. Don't try to do everything alone! Get a good partner and share the work &amp; vision.</p>"
