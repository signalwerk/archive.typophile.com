    html: <p>My advice would be to do one thing and do it well. In my opinion, life is too short to try to be an expert at everything. If you focus on one thing, you'll have a better chance of succeeding IMHO. I'm not saying having hobbies is bad (I've got plenty), but they should stay hobbies.</p>
