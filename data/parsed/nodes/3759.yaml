    html: "<p><i>I'm not sure that's what might be called the \"real thing\". You don't need to be a good graphic designer to realize that classical typography* works, and what the \"rules\" are (think Bringhurst), but to me that seems like a formulaic application. I think good typography (the kind that produces notable degrees of pleasure and readability) is in fact the \"graphics\" you mention. </i> <br> <br>I agree, Hrant. Designers tend to forget typography � the traditional kind in which legibility and readability are important � is part and parcel what graphic design is, along with being 'expressive' (whatever that means) graphically. Being 'functional' or 'invisible' seems to be so pass� these days. Graphic designers want to be noticed, so they are more interested in big concepts rather than tiny details. How often do you hear people say: 'but this is not <i>designed</i>!' Designed means: Is it clever? Is it shocking? Is it stylish? Is it cool? Or even 'Is it Photoshopped?' <br> <br>For me graphic design is about the big concepts as well as the small details. And graphic designers should be good typographers and perhaps type designers too (in a perfect world). But I think at the moment graphic design is moving further and further away from typography. <br> <br><i>I'm always very disappointed when I pick up the latest 'typography' annual and find that it's full of graphic design, i.e. design in which text is entirely subservient to visuals</i> <br> <br>I agree too, John. It is disappointing. Type is very often the 'icing on the cake', mere decoration for images. </p>"
