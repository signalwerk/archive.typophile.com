    html: <p>hi frank, <br> <br>working in a network environment makes it possible for me to work in different media fields. i design print but leave the pre-press and production matters to others. i design websites but leave the coding and programming to others. i design typefaces but leave the distribution to others. and eventhough i also work as art director in the advertising field i still have time for my family, vacations, the gym, a social life, plenty of sleep, my ps2 and visiting online forums. <br> <br>this only works because i have partners in my network that i can depend upon at all times, each an expert in his/her field. the output is therefore of high quality in combination with high efficiency, which as a result allows me/us to charge higher rates, but not as high as those of agencies that offer a similar quality. <br> <br>so, eventhough it's hard and takes a lot of time to find the right partners, i would say that networking is the way to go today. i've been working like that for many years and it definately works for me. <br> <br>simon</p>
