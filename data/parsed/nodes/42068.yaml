    <div class="info">Submitted by <a href="/user/110" title="View user profile.">Bald Condensed</a> : 13.Feb.2008 5.01pm </div>
      <p>If you know what it’s like to passionately love a typeface, here’s a golden opportunity. Surf to <a href="http://www.fontshop.be/details.php?entry=272">Unzipped</a>, declare your love for a FontFont (only FontFonts apply!) and win a full official license to four (4) weights in OpenType format of that FontFont (for example Regular, Italic, Bold, Black). This love declaration can take any form you like: a poem, an image, a short text, whatever you feel like creating. Just make sure that I don’t have to do anything to post your entry in the gallery which will be appended to <a href="http://www.fontshop.be/details.php?entry=272">this post</a> (see technical details below). The best/most original/most beautiful entry wins.</p>
    <p>The contest starts now and ends tomorrow (Friday) night February 15th at midnight. But there is one catch — we want at least sixty (60) submissions or the contest is void, annulled, nihil, zilch, nada. Fortunately you can enter up to three (3) submissions, so in theory if twenty very motivated people compete we’re good.</p>
    <p>The contest is open to anyone, FontShop customers and non-customers alike, students and professionals, men and women, straight and gay, all races, all religions, no restrictions, no boundaries. So get busy in the name of love, you’ve got a little under 48 hours! And remember — sleep is highly overrated. ;)</p>
    <p><strong>Procedure</strong></p>
    <p><strong>Send me an e-mail</strong> (unzipper{at}fontshop{dot}be) with “Valentype” and the name of the FontFont in the subject line. Include your name and address in the message and your love declaration in attachment.<br>
    <strong>Poems or short texts</strong> should be saved as text or MS Word format.<br>
    <strong>Typographic art or design</strong> must be saved for web (<em>Save for Web...</em> command in Adobe Photoshop) as JPEG High Quality RGB image, measuring exactly 440 pixels wide and minimum 100 to maximum 500 pixels high.<br>
    The file name must read “YourFullName_FontFontName” (plus the file extension of course). Substitute “YourFullName with your actual name (no spaces) and “FontFontName” with the name of the FontFont you covet.</p>
