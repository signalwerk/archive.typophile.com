      About being bald... I still have my hair but it looks like its not staying for long- genetics suck!</p>
      <p>Thanks for elucidating the word 'nameplate' too. HFJ have interpreted Didot's work nicely- very sexy proportions. </p>
      <p>Although if Jessijohn had a mac, she would probably be satisfied with the version of Linotype Didot (interpreted by Andrian Frutiger) that comes standard with Mac OS X and save herself $299.00. Linotype Didot comes standard with small caps- something HFJ Didot does not have. However, a thorough compliment of optical character sizes is standard equipment for HFJ Didot.</p>
      <p>Mikey</p>
