    html: <p>I don’t feel comfortable with the idea of students downloading free fonts oﬀ the ‘net for their projects. More often than not they end up using something really badly made without even realizing that it is not a ‘professional quality’ font. It’s dangerous. It’s such a bad inﬂuence for them because they’ll end up thinking that fonts are free and anyone can make fonts. Not a good idea. Though I think it’s also a typography instructor’s duty to teach their students how to discern the diﬀerences between well and badly made typefaces, and about the legalities of typeface&nbsp;licensing.</p>
