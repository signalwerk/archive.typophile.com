    html: <p>i think 20 type faces is perfect. this is what i tell my class to begin with. the idea that you need hundreds of typefaces is ridiculous. when i was in school i had thousands upon thousands of bad typefaces. i hoarded anything i could get. this only helped confuse me when it came to choosing an appropriate face. it was a breath of fresh air to just delete them all off my hard drive. i only use about 10 or so at any moment in my career. type can be tricky and hard to deal with. it is best to have fewer faces and understand the ins and outs of each one. this is the only way one can expect to master a typeface and type in general. <br> <br>i think it is also important to avoid display faces. these can be made individual depending on the project and current aesthetic. i make all of my own display faces or i am at least very picky about a display face made by someone else. no matter how trendy and cool the display face is you will look back in 10 years and think to your self "what the hell was i thinking" <br> <br>anyway here is the list of classics i use. <br> <br>akzidenz grotesk bq <br>helvetica neue  <br>avenir (or futura, both are geometric sans, i prefer avenir) <br>frutiger <br>trade gothic <br>franklin gothic <br>optima <br>bodoni (or didot but not filosofia) <br>adobe garamond <br>adobe caslon <br>minion <br>hoefler <br>dante <br>sabon <br>perpetua <br>requiem (or bembo) <br>centaur <br>clarendon <br>shelly (or snell roundhand) <br>fette fraktur (or goudy text)</p>
