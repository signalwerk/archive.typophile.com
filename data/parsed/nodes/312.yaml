      <p>I had started to post before and looked at the date of this original request...2003! Just for the sake of anyone who may be gleaning useful information from this thread, I'll post the information that I have.</p>
      <p>My type class at an accredited art &amp; design university had an official "list of typefaces"; thus insinuating they were faces that learned designers should be familiar with.</p>
      <p>On this list were:</p>
      <p>Centaur<br>
      Jenson<br>
      Bembo<br>
      (Adobe) Garamond<br>
      Minion<br>
      Times New Roman<br>
      Baskerville<br>
      Mrs Eaves<br>
      Bauer Bodoni<br>
      Didot<br>
      Clarendon<br>
      Rockwell<br>
      Serifa<br>
      Frankiln Gothic<br>
      News Gothic<br>
      Helvetica Neue<br>
      Univers<br>
      Futura<br>
      Fruitger<br>
      Copperplate Gothic</p>
      <p>*</p>
