      <p>This sounds fun. Here are my twenty desert island typefaces:</p>
      <p>1. Helvetica Neue<br>
      2. Univers<br>
      3. Garamond<br>
      4. Bodoni<br>
      5. Clarendon<br>
      6. Rockwell<br>
      7. Gotham<br>
      8. Avenir Next<br>
      9. DIN<br>
      10. Perpetua<br>
      11. Bembo<br>
      12. Trade Gothic<br>
      13. Interstate<br>
      14. OCR-A<br>
      15. Caslon<br>
      16. Sabon<br>
      17. Mrs. Eaves<br>
      18. Meta<br>
      19. Meta Serif<br>
      20. Comic Sans</p>
      <p>Yeah, I said it. Comic Sans. It serves as a way to weed out the bad ones: any student that uses it gets dropped from the program.</p>
