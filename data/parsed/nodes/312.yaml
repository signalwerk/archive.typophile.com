    html: "<p>Here's my list of 20: <br> <br>Minion Pro <br>Myriad Pro <br>Sabon Next <br>Monotype Baskerville (or Berthold) <br>HTF Didot <br>Perpetua <br>Monotype Gill Sans <br>Berthold Akizidentz Grotesk <br>Thesis Sans <br>Swift <br>ITC Charter <br>FF Meta <br>PMN Caecilia <br>Adobe Caslon Pro <br>FB Miller <br>Adobe Syntax <br>ITC Franklin Gothic <br>Bitstream Futura <br>Monotype Bembo <br>Snell Rounhand <br> <br>Maybe this is my wish list... I only have five of these myself. I tried to be as unbiased as possible. These are mostly text typefaces, except Snell Roundand (which I think is the best copperplate script ever created!). It's difficult to include display typefaces in a list of just 20.</p>"
