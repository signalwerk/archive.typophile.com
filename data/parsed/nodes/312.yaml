    html: <p>In no particular order <br><br>01 &gt; Neue Helvetical  <br>(it’s a classic and still modern) <br><br>02 &gt;  <span class="caps">FF</span> <span class="caps">DIN</span> <br>(I really really really love the facelessness of this font, sorry) <br><br>03 &gt; Clarendon <br>(It’s so brutal and primitive, I love it — Belizio is nice as well) <br><br>04 &gt; Thesis Sans <br>(<span class="caps">THE</span> perfect Corporate Font, a must have. I love Luc(as) work) <br><br>05 &gt; Garamond Pro <span class="caps">OTF</span> or NeueSabon  <br>(Best for setting text. GaramondPro is such a nice redesign, and NeueSabon, although not a Sabon, imo, is a verrrrry nice Garamondesque typeface as well, wish I had the $$$ to buy it.) <br><br>06 &gt; Myriad Pro <span class="caps">OTF</span>  <br>(Great alternative to all those Frutigers, Helveticas and Akzidenz… and the <span class="caps">OTF</span> multilangual functionality is beautiful. Great font.) <br><br>08 &gt; Mrs Eaves <span class="caps">OTF</span> <br>(Sooooo cute. So cute. Sooooooooo cute) <br><br>09 &gt; <span class="caps">FF</span> <span class="caps">OCR</span> or <span class="caps">FF</span> Letter Gothic <br>(For those cool and mechanical designs. Not as cold as the originals, but more versatile) <br><br>10 &gt; Rotis Sans or SemiSans <br>(Jeez, I hat the Rotis, but when learning typography there is no way around it — and it still looks nice for many designs that try to be clean and eﬃcient.) <br><br>11 &gt; Futura <br>(Overused, yeah, but you gotta have it. Lovelovelove the Caps. Instant Warmth, somehow.) <br><br>12 &gt; Scala <br>(Very nice font — legible yet diﬀerent. Quadraat would be solid as well. The Scala Sans is a nice alternative to the ThesisSans, more quirky yet not as monstrously complete…) <br><br>13 &gt; <span class="caps">TAZ</span> <span class="caps">III</span> <span class="caps">OTF</span> <br>(De Groot is a monster, this font rocks. Again, wish I had the money right now. Great stuﬀ.) <br><br>14 &gt; Univers <br>(Classic. And nice to play with. Look at Emil Ruders work with that single font — amazing).  <br><br>15 &gt; Bauer Bodoni <br>(Must-have-classicism for your students. And great to play with in Display-size) <br><br>16 &gt; Franklin Gothic or Bureau Grotesque <br>The strong and strudy workhorses. Also, you can use Franklin to let your students do a bit Brodyism. <br><br>17 &gt; Bell Gothic or Interstate <br>Looking modern yet not too modern. Nice for Corporate stuﬀ, although lacking in some departments (Caps, Ligaturs, <span class="caps">OSF</span>s). Both nice because of their not-too-cold-coldness. Used <span class="caps">ALL</span>-<span class="caps">CAPS</span>-Bell for a <span class="caps">CD</span> just some months ago, it just was perfect.  <br><br><br>18 &gt; Jenson Pro <span class="caps">OTF</span> or Warnock Pro or Kepler <br>More older-looking quirky text-fonts. <span class="caps">OTF</span> rocks.  <br><br>19 &gt; Thesis Serif or Thesis Mono  <br>The serif is just beautiful for short texts, the Mono has a more lively approach to the coldness of <span class="caps">OCR</span> and Letter Gothic. <br><br>20 &gt; Zapﬁno <span class="caps">CD</span> <br>wonderful Toy. Next best thing to being a calligraphic genius yourself&nbsp;:-D. (Which, alas, I ain’t) <br><br>And a whole buch of those endless <span class="caps">TTF</span>-Freefonts available on the net, just to have some plain fun with (which is why&nbsp;some </p>
