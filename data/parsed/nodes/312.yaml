    date: 2003-06-14T15:29:00
    date_raw: 14 June 2003 - 3:29pm
    votes: 0
    html: '<p>I’m not so sure I-Totally-Conked-Garamond isn’t worse than Helvomita. I mean, the latter is certainly the village idiot (and one who persists in thinking he’s a studmuﬃn), but the former is the insidious town charlatan. And can you really like the way “Macintosh” rendered out in it, with that domestic-abused “t” and such? <br><br>There are many depths to which one can disdain <span class="caps">ITC</span> Garamond. Some poeple only mind that it was called a Garamond, since its spirit is so distorted from the original. But that’s too forgiving. You would want to go deeper and hate what it does to French culture: according to some people (like Mandel), a small x-height is a <i>requirement</i> of being a French font, and Garamond is the Frenchest of them all. And you might go deeper, into functionality, and hate the fact that it combines such gaudy proportions with features only ﬁtting in a serious text face. <br><br>On the other hand, in terms of corporate indentity, I agree that shifting to Myriad was a horrible idea. <br><br>Have a good day! &nbsp;;-) <br><br>hhp <br></p>'
