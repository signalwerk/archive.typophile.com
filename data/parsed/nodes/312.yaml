    html: <p>I think that <span class="caps">ITC</span> Garamond campaign was such a brilliant idea. Simple and powerful and its a hilarious inside joke. Just love it. I want one of those tee-shirts! I would happily use <span class="caps">ITC</span> Garamond instead of Helvetica any day&nbsp;:-) It’s so 80s! (I hate Helvetica, by the way&nbsp;;-) <br><br>I know I lot of typographers/type designers can’t stand <span class="caps">ITC</span> Garamond. Apart from the enormous x-height, the rounded treatment on absolutely everything is a bit much. I don’t mind it as a display face for certain things. I wonder what you guys think of it? And why do you think Apple dropped their Apple Garamond Narrow (they redrew from the <span class="caps">ITC</span> condensed version which I think was a much more plausible type)? I think it was a stupid decision because it was such a strong element in their corporate identity. They were desperate to be more ‘modern’ I guess. But Myriad?! That’s someone else’s corporate&nbsp;type!</p>
