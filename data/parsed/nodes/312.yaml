  - id: 1801
    user: 1250
    date: 2003-06-14T13:29:00
    date_raw: 14 Jun 2003 — 1:29pm
    votes: null
    html: "<p>I'm not so sure I-Totally-Conked-Garamond isn't worse than Helvomita. I mean, the latter is certainly the village idiot (and one who persists in thinking he's a studmuffin), but the former is the insidious town charlatan. And can you really like the way \"Macintosh\" rendered out in it, with that domestic-abused \"t\" and such? <br> <br>There are many depths to which one can disdain ITC Garamond. Some poeple only mind that it was called a Garamond, since its spirit is so distorted from the original. But that's too forgiving. You would want to go deeper and hate what it does to French culture: according to some people (like Mandel), a small x-height is a <i>requirement</i> of being a French font, and Garamond is the Frenchest of them all. And you might go deeper, into functionality, and hate the fact that it combines such gaudy proportions with features only fitting in a serious text face. <br> <br>On the other hand, in terms of corporate indentity, I agree that shifting to Myriad was a horrible idea. <br> <br>Have a good day!  ;-) <br> <br>hhp <br></p>"
