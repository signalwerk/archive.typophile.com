    date_raw: 14 June 2003 - 5:54pm
    votes: 0
    html: '<p>Some detailed history: <br><a href="http://www.myfonts.com/fonts/itc/garamond/" target="_blank">http://www.myfonts.com/fonts/itc/garamond/</a> <br><br>I think the <span class="caps">ITC</span> comes from Linotype: <br><a href="http://www.myfonts.com/fonts/linotype/itc-garamond/" target="_blank">http://www.myfonts.com/fonts/linotype/itc-garamond/</a> <br>But I also seem to remember a connection to Garamond #3, which is basically a reincarnation of the <span class="caps">ATF</span> cut. <br><br>— <br><br>As to the Jannon issue, of course you’re right in terms of history, but it’s interesting to consider what people actually <i>think</i> when they hear/see “Garamond”. I suspect it’s safe to say that when a person chooses a “Garamond” from the font menu, chances are better than 50% he’ll get a Jannon — and of course not even realize what the hell that even means. Even among type people, Jannon-denial is alive and well. Check out this: <br><a href="http://www.itcfonts.com/fonts/detail.asp?sku=ITC6214&amp;AID=5671704&amp;PID=939805" target="_blank">http://www.itcfonts.com/fonts/detail.asp?sku<span class="caps">=ITC6214&amp;AID</span>=5671704&amp;<span class="caps">PID</span>=939805</a> <br>as well as the awkward ambivalence here: <br><a href="http://www.myfonts.com/fonts/linotype/simoncini-garamond/" target="_blank">http://www.myfonts.com/fonts/linotype/simoncini-garamond/</a> <br><br>hhp <br></p>'
