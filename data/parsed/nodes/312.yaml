  html: <p>I am in the process of purchasing a number of type licences for a London University. The idea is to limit the number of typefaces available for design students enabling them to be familiar with around 20 families. <br>Rather than pick them myself I would like to have a broad input into the ﬁnal pickings. <br>Please could you post typefaces that you personally feel are indispensable to the modern designer.Ideally you could list your top 20. i will be posting a chart of deigners top 20 typerfaces on <a href="http://www.fatears.co.uk" target="_blank">www.fatears.co.uk</a>  in the near future. Andy wall <br></p>
