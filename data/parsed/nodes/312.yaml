    html: <p>I think that limiting the list to 20 faces is an excellent idea. It is a good way to teach typography. With a limited selection students can see how principles work in all of the typefaces you select. It is an excellent way to have them compare and contract the strengths of each face.  <br> <br>Becuase of that I would make my list from historic sources. Students would see the evolution of type, and see how that evolution happened as they used the faces. <br> <br>Without putting a ton of time considering the faces I'll throw up a list.  <br> <br>Blackletter <br>Centaur <br>Janson <br>HTF Requiem <br>Bembo <br>Caslon <br>Garamond <br>Baskerville <br>Palantino <br>HTF Didot <br>Perpetua <br>Electra <br>Clarendon <br>Akzidenz Grotesque <br>Helvetica Neue <br>Futura <br>Franklin Gothic <br>Trade Gothic <br>Poetica <br>Shelly <br> <br>OK, its a rough list, but it has some solid faces that would be good to learn principles with. </p>
