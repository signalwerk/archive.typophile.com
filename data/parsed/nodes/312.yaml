    html: <p>Sooo. Hope I am not being blasphemous by brining this up, but how come there are no bitmap fonts mentioned here?   <br> <br>Being a designer today invariably means that there is a rather huge potential you will have to design something for screen.  Hence the need for  a bitmap. <br> <br>Even as a write this, I am hesitant since we are dealing with only 20.  But I think adding Miniml's 'Standard' or Thirstype's 'Pixella' might be highly useful. </p>
