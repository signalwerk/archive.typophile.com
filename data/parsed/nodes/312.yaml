    html: <p>since you said <i>starting</i> a design career, I would ﬁrst  <br>procure the classics. a collection including full families of  <br>strong old style, transitional, modern (though I never  <br>use them), grotesk, egyptian, and humanist typefaces  <br>would provide you with a lot of possibilities. for the  <br>sake of contemporaneity, you might throw in a few  <br>recent designs such as the aforementioned Gotham or  <br>Scala Sans/Serif (or Seria for more delicate work).  <br>expand any of the catagories according to taste and  <br>you have a highly versatile&nbsp;library.</p>
