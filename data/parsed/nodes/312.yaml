    date_raw: 12 Jun 2003 — 1:32am
    votes: null
    html: <p>I think everyones comments are very helpful. i think the one point I have to clarify is that we are talking about 20 typefaces that a designer should know as part of their job. Many graduate designers have not yet came to grips with more than, say,5 typefaces. The idea here is to push students into using a limited number of type designs, during certain projects, and see how their typographic awareness increases along with their knowledge of the '20 typefaces'. Ive already included comic sans, minstrel and brush script so there is no need to include them in future post! ;) On leaving university they should be able to identify each of the designs, and be able to adjust their use according to the project. Its OK to have a favourite type design, but worrying when they try to use it for the wrong job!</p>
