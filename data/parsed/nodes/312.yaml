    html: |-
      <p>" The idea is to limit the number of typefaces available for design students enabling them to be familiar with around 20 families."</p>
      <p>Goto: freshly installed operating system.<br>
      Open: design application of choice<br>
      Find: font menu<br>
      Pull down:See list? </p>
      <p>You are done. </p>
      <p>This is not a trivial recommendation as otherwise the students will have all these bundled families (the school will not be able to delete them), PLUS the 20 families you give them, and thus you will be defeated by such a plan.;) How? Wind blows, fire burns, students rebel. Tell them they can only use "these 20" and you'll see!</p>
      <p>Cheers!</p>
