      <p>I think that as you learn about the history of type design certain faces are landmarks in the evolution of type. If the history is taught correctly I think most student designers pick it up along the way. One typeface to mark each major development in the appearance of type will leave you with plently. An appreciation for these typefaces needs to be established. I know students that wouldn't have a breeze about typefaces solely because lectures on type where not common enough on their course. </p>
      <p>For more contemporary type I'm sure the <a class="freelinking external" href="http://www.createreject.com/unicef/" rel="nofollow">unicef</a> book could be handy.</p>
      <p>If it all works out then you can test your students with <a class="freelinking external" href="http://fontgame.ilovetypography.com/" rel="nofollow">this</a>.</p>
    html_clean: |-
