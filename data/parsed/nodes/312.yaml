    html: "<p>Incidentally, Andrew, you should look into Adobe's Type Classics for Learning. It has most of the OpenType Pro fonts in it: Caslon, Garamond, Jenson, Minion, Myriad, Warnock, Utopia... plus other extremely useful fonts from Adobe. Very good value. I bought it just before I graduated! It's only a 1 computer license though, but I think you could get site licenses for the school. <br> <br>URL: <br><a href=\"http://www.adobe.com/education/ed_products/typeclassics.html\" target=\"_blank\">http://www.adobe.com/education/ed_products/typeclassics.html</a></p>"
