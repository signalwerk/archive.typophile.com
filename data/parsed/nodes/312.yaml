    html: <p>Yes, Jean. It's not a Garamond at all. As a student, I was quite confused by the different versions of the supposedly 'Garamond'. At one point I was naive enough to think that ITC's version was THE Garamond! How silly was I? Yes, it does look more like a redrawing of Monotype's version. And now my favourite 'Garamond' is your Sabon Next! <br> <br>Hrant, nice reference from MyFont. I always wondered about the Apple Garamond. You know what? I still have the TrueType Apple Garamond Narrow on my computer. It was bundled with my old Color StyleWriter printer. Bitstream did a nice job, I think. Much nicer than the original ITC. Quite a few other fonts were bundled with that printer, including Lucida Bright, Lubalin Graph, etc.</p>
