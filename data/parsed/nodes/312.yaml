    html: <p>Andrew, this is really an interesting premise. Is the limit 20  <br>because of budget? I think if you hand-picked 100 typefaces <br>you'd have a great start. <br> <br>In my school we had the entire Bitstream library and some  <br>basics form Adobe. The result was first-year students all <br>crowding around the bitstream poster looking for a cool,  <br>different font and ending up with Copperplate (gasp!) or  <br>Bank Gothic (egads!) or worse; Mistral, Hobo, Handel or  <br>Balloon gothics (pow! biff! splat! oof!). <br> <br>In those early years, design students are so caught up  <br>trying to find what's cool, that they don't learn what works.  <br>(I know there are always exceptions...) <br> <br>My school has since purchased the entire HTF library,  <br>kudos to them.</p>
