    html: "<p>You know, I'm not sure I can think of 20 typefaces that I would recommend as a beginning library. Once you get beyond a small number of solid text faces and a couple of good titling and sans serif designs, you quickly get into that area in which the right typeface to have is the right typeface for a particular project. Take script faces, for example: I can suggest a number of good ones, <i>i.e.</i> types that are well designed and executed, in a variety of different styles, but I don't think any of them necessarily belong in a beginner library because each tends to be particularly suited to such a narrow range of work. <br> <br>On the seriffed text typeface front, I would suggest selecting one example from each of the major historical styles: one Venetian, one French renaissance, one Dutch oldstyle, one neo-classical, one romantic, etc. I would try to avoid the more obvious choices, <i>e.g.</i> Mardersteig's Dante instead of Bembo, Monotype Bullmer instead of Baskerville.</p>"
    html_clean: "<p>You know, I'm not sure I can think of 20 typefaces that I would recommend as a beginning library. Once you get beyond a small number of solid text faces and a couple of good titling and sans serif designs, you quickly get into that area in which the right typeface to have is the right typeface for a particular project. Take script faces, for example: I can suggest a number of good ones, <i>i.e.</i> types that are well designed and executed, in a variety of different styles, but I don't think any of them necessarily belong in a beginner library because each tends to be particularly suited to such a narrow range of work. <br> <br>On the seriffed text typeface front, I would suggest selecting one example from each of the major historical styles: one Venetian, one French renaissance, one Dutch oldstyle, one neo-classical, one romantic, etc. I would try to avoid the more obvious choices, <i>e.g.</i> Mardersteig's Dante instead of Bembo, Monotype Bullmer instead of Baskerville.</p>"
