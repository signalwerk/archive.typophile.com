    html: <p>In no particular order <br> <br>01 &gt; Neue Helvetical  <br>(it's a classic and still modern) <br> <br>02 &gt;  FF DIN <br>(I really really really love the facelessness of this font, sorry) <br> <br>03 &gt; Clarendon <br>(It's so brutal and primitive, I love it -- Belizio is nice as well) <br> <br>04 &gt; Thesis Sans <br>(THE perfect Corporate Font, a must have. I love Luc(as) work) <br> <br>05 &gt; Garamond Pro OTF or NeueSabon  <br>(Best for setting text. GaramondPro is such a nice redesign, and NeueSabon, although not a Sabon, imo, is a verrrrry nice Garamondesque typeface as well, wish I had the $$$ to buy it.) <br> <br>06 &gt; Myriad Pro OTF  <br>(Great alternative to all those Frutigers, Helveticas and Akzidenz... and the OTF multilangual functionality is beautiful. Great font.) <br> <br>08 &gt; Mrs Eaves OTF <br>(Sooooo cute. So cute. Sooooooooo cute) <br> <br>09 &gt; FF OCR or FF Letter Gothic <br>(For those cool and mechanical designs. Not as cold as the originals, but more versatile) <br> <br>10 &gt; Rotis Sans or SemiSans <br>(Jeez, I hat the Rotis, but when learning typography there is no way around it -- and it still looks nice for many designs that try to be clean and efficient.) <br> <br>11 &gt; Futura <br>(Overused, yeah, but you gotta have it. Lovelovelove the Caps. Instant Warmth, somehow.) <br> <br>12 &gt; Scala <br>(Very nice font - legible yet different. Quadraat would be solid as well. The Scala Sans is a nice alternative to the ThesisSans, more quirky yet not as monstrously complete...) <br> <br>13 &gt; TAZ III OTF <br>(De Groot is a monster, this font rocks. Again, wish I had the money right now. Great stuff.) <br> <br>14 &gt; Univers <br>(Classic. And nice to play with. Look at Emil Ruders work with that single font -- amazing).  <br> <br>15 &gt; Bauer Bodoni <br>(Must-have-classicism for your students. And great to play with in Display-size) <br> <br>16 &gt; Franklin Gothic or Bureau Grotesque <br>The strong and strudy workhorses. Also, you can use Franklin to let your students do a bit Brodyism. <br> <br>17 &gt; Bell Gothic or Interstate <br>Looking modern yet not too modern. Nice for Corporate stuff, although lacking in some departments (Caps, Ligaturs, OSFs). Both nice because of their not-too-cold-coldness. Used ALL-CAPS-Bell for a CD just some months ago, it just was perfect.  <br> <br> <br>18 &gt; Jenson Pro OTF or Warnock Pro or Kepler <br>More older-looking quirky text-fonts. OTF rocks.  <br> <br>19 &gt; Thesis Serif or Thesis Mono  <br>The serif is just beautiful for short texts, the Mono has a more lively approach to the coldness of OCR and Letter Gothic. <br> <br>20 &gt; Zapfino CD <br>wonderful Toy. Next best thing to being a calligraphic genius yourself :-D. (Which, alas, I ain't) <br> <br>And a whole buch of those endless TTF-Freefonts available on the net, just to have some plain fun with (which is why some </p>
