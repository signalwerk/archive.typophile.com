    <p>Kia ora folks!</p>
    <p>I am not sure whether this topic has come up, but a typography conference is going to hit Wellington &amp; you are invited:</p>
    <p><a class="freelinking external" href="http://www.typeshed11.co.nz/" rel="nofollow">TypeSHED11</a>: <cite>Typography, across five stretched out summer days on the water's edge. </cite></p>
    <p>Our wine is fantastic, our beer is cold, our food is delicious &amp; we are happy to see you! How can you not be tempted? </p>
    <p>The call for papers deadline is 31 October 2007. Get those submissions in!</p>
    <p>—K</p>
