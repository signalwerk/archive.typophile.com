    <p>Hello again! This logo is for an organization helping elders in need.</p>
    <p>The first version of the symbol is a quieter one and resembles a comet:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/HDFlogo_3413.gif"></div><p></p>
    <p>The second one adds more sparkle, but feels flashy (and masonic?):</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/HDFlogo1_5668.gif"></div><p></p>
    <p>Any thoughts? Thanks you!</p>
