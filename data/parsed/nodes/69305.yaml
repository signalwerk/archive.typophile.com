    html: |-
      <p>OK. I can't work it into a sun in this concept without making the symbol too complicated. But I'm happy with the star-light.</p>
      <p>Here is the logo with more attention to kerning:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/1_3688. HDsamesize.gif"></div><p></p>
      <p>Next, I've made the "foundation" smaller:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/2_6064. HDsmall3.gif"></div><p></p>
      <p>Finally, I've also enlarged the mark:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/3_4671. HDbig1small3.gif"></div><p></p>
      <p>Conceptually, "foundation" is quite important, as they'll be communicating mostly to raise money, so number 1 seems most appropriate to me. On the other hand, as it is not part of the name, perhaps it should be smaller, as in number 2. In the 3rd version the symbol just seems too bold. But if treated in a lighter color, it might just balance with the black text.</p>
      <p>For now, I'd go with 1 or 2. Thank you again for your competent comments.</p>
    html_clean: |-
