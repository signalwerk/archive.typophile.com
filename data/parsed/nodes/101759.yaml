    html: |-
      <p>Thanks for replying George. I should have added that I've set things that way. I've not seen Karsten's fabulous explanation (he has SO much great info available, very helpful/generous guy) but I've read the article by John Hudson that he references.</p>
      <p>Setting the values as described in those articles works but only when Word is determining the leading with it's Line Spacing set to something other than "Exactaly." Unfortunately we need to be able to set the line spacing in these projects to the specifications of the series.</p>
      <p>It doesn't seem to matter what those settings are made in the font, Word still clips the characters on screen when the leading is set to "Exactaly." I guess that's just the way it works, unfortunately.</p>
      <p>Thanks again,<br>
      Ken</p>
