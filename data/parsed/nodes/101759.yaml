    <p>We've developed a couple of fonts in FL 5, generating OTFs.</p>
    <p>In MS Word the descenders glyphs get clipped on screen as shown in the below picture. I've played around with the WinAscent and Typo values but can't get it to stop. Word 2003 and 2010.</p>
    <p>Is this just how Word works? Is there anything that can avoid this?</p>
    <p>Thanks,<br>
    Ken</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Capture_5084.JPG"></div><p></p>
