  - id: 548634
    user: 1262
    date: 2013-03-27T09:44:00
    date_raw: 27 Mar 2013 — 9:44am
    votes: null
    html: <p>This is a Word issue. If you set an absolute ('exactly') leading value that is shorter than the WinAscent/WinDescent OS/2 values, then Word will clip. This is because of the way in which Word lays out each line.</p>
