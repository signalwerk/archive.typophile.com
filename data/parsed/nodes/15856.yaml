    html: |-
      <p>Just for reference, our font Allegheny does bear some resemblance to Aquiline, but is not the same.  Having seen and liked Aquiline I set out to design a similar font, likely following a process not much different from how Aquiline itself was designed, using samples of 17th century calligraphy in a similar style (see our Orford font) and rendering a rougher and more casual variation, admittedly aping some of the character variations in Aquiline, while adding other unique variations.</p>
      <p>There is no point in ripping off a font when you can reimagine it and hopefully make it better, or at least more to your personal taste.</p>
      <p>Dave</p>
    html_clean: |-
