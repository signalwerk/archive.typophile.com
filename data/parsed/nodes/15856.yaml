      <p>Found this:</p>
      <p><cite>Aquiline and Aquiline Extra Bold, made by Expert Software, has been discontinued and is no longer available for purchase.  The company went out of business in 2001.</cite></p>
      <p>Also, it gets mentioned in the <a href="http://www.t26.com/about/help.php" target="new" rel="nofollow">T-26 FAQ</a>:</p>
      <p><cite><strong>Whatever happened to that old, scripty Jim Marcus font "Aquiline"?</strong><br>
