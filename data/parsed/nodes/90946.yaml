    html: |-
      <p>Like Nick says, much of the information you need is contained in the sample. </p>
      <p>Each letter in GARDENS provides directions for handling that class of letters: </p>
      <p>- G for round letters like C and O<br>
      - R for letters like P and B<br>
      - N for its siblings/cousins M and Z</p>
      <p>...etc.</p>
      <p>Find other types from the period, or in the same style, or from the same foundry, to absorb the zeitgeist that informed the design decisions.</p>
