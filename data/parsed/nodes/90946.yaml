  html: |-
    <p>I've scoured the internet and it seems that these great woodcut fonts by Harrild &amp; Sons were never digitized.</p>
    <p>Does anybody here have anymore info about these fonts?  Does anyone know if the actual woodblock themselves are still around?  I am particularly interested in the "Regent" font that spells out the word "GARDENS" in this specimen from 1906.</p>
    <p>If there is nothing else available, what is your opinion of the possibility on creating a complete uppercase alphabet and numerals from this one specimen?  Also, is there any information available on how one might do this?  I've been looking for some writing about doing such things for awhile now.  Call it, "how to make a complete font set from one letter" or something like that.  Obviously this type has been done before, such as when old fonts are updated with characters they didn't originally contain.</p>
    <p><a href="http://maelhorn.com/xtra/harrild_woodcut_fonts.png" title="http://maelhorn.com/xtra/harrild_woodcut_fonts.png">http://maelhorn.com/xtra/harrild_woodcut_fonts.png</a></p>
    <p>(note to webmaster, the insert image function and the attachment function are not working. "onHTTPError: 500" and "An HTTP error 0 occurred. /upload/js" respectively.)</p>
