    html: |-
      <p>Interesting -- as a piece of History. Not calligraphy.</p>
      <p>That wasn't an exercise unless the scribe stated that. That said, the scribe will write a colophon where he states, when he wrote the copy, from where he got the copy etc etc .</p>
      <p>The aim was to have a pocket book to carry with while traveling and such. Whoever wrote this book had  another MS in front of him! I really doubt that he knew the book of Psalms by heart.</p>
