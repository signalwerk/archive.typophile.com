  html: "<p>I <a class=\"freelinking external\" href=\"http://smg.photobucket.com/albums/v504/exfish/Jesuit%20manuscript/\" rel=\"nofollow\">found this</a> at a relative's house: a bound manuscript, text probably written in the 18th century, containing some Christian prayers in Hebrew and the text of Psalms. Looks to have been written by a Jesuit missionary, probably as an exercise in learning biblical Hebrew. As a specimen of calligraphy it's pretty abysmal, but it gives interesting insight into an outsider's perception of the Hebrew alphabet. The way the author (or possibly authors) structure the letters is often different from what I grew up with. Note especially the Mem, Shin, Tet and Pey. Some of the characters (the Mem especially) afforded me a minor epiphany or two about their typographic forms vs. handwritten. Also, the Aleph occasionally gets some pseudo-calligraphic swashiness.</p>"
  html_clean: "<p>I <a class=\"freelinking external\" href=\"http://smg.photobucket.com/albums/v504/exfish/Jesuit%20manuscript/\" rel=\"nofollow\">found this</a> at a relative's house: a bound manuscript, text probably written in the 18th century, containing some Christian prayers in Hebrew and the text of Psalms. Looks to have been written by a Jesuit missionary, probably as an exercise in learning biblical Hebrew. As a specimen of calligraphy it's pretty abysmal, but it gives interesting insight into an outsider's perception of the Hebrew alphabet. The way the author (or possibly authors) structure the letters is often different from what I grew up with. Note especially the Mem, Shin, Tet and Pey. Some of the characters (the Mem especially) afforded me a minor epiphany or two about their typographic forms vs. handwritten. Also, the Aleph occasionally gets some pseudo-calligraphic swashiness.</p>"
