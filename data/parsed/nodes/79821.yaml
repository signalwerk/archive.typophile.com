    html: <p>Sorry for the flip of the tongue; I meant the baseline stroke. I would like to try directing it downwards (slightly below the baseline) - I plan to reshape the typical diagonal ramp of the words into something more sinusoidal. This works with initial Seen, Meem, Hah etc. But with the Ain and Hah I am afraid of the Meem ligature effect.</p>
