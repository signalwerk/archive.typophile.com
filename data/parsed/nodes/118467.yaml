    <p>Greetings! This is a romantic case.</p>
    <p>My girlfriend was at her trip to Prague, and got this tattoo. This numbers mean the important day for us.<br>
    When I decided to make the same thing, I realized that it’s not so easy to find the exact font.<br>
    Some of them are too heavy, others have different “M” letter shape.</p>
    <p>I hope you can help me find this font.<br>
    Already tried myfont tool, 50 pages of listings on different sites ant tools like identyfont.</p>
    <p>Thank you in advance!</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/54321-1000IMG_1320_5147.jpg"></div><p></p>
