    html: |-
      <blockquote><p>BTW Jan, Dick, Mike: Do you think this is all OK?</p></blockquote>
      <p>I read over the comments on dafont and I’m convinced that Claude Pelletier works from scans of old specimens. No outline theft. In the case of Chopin Script there’s also a commercial version from URW called Polonaise which isn’t exactly the same. Both seem to be based on specimens by Dan X Solo. I can’t judge if the designs are copyright-protected or owned by anyone. In the case of Champion a copyright sure must have expired. In the case of Pistilli it says that Pelletier recreated Pistilli with John Pistilli's son’s blessings.<br>
      I <em>do</em> think this is all OK.</p>
