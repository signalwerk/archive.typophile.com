    html: <p>I'm still using Mac OS 9 and there's no alt key on my keyboard. I use shift-W for the fi ligature for Adobe and Emigre fonts, whereas in the FF fonts it's shift-I. I don't mind using an expert set, since I can set up a style sheet for it in Quark. It just gets confusing when I'm working on several projects simultaneously and they all have fractions. I end up using PopChar to grab the ligature out of frustration. <br> <br>The date on my Meta seems to be 1993. <br> <br>I'm in the process of upgrading to OSX so maybe this will sort itself out. In the meantime I just need to keep track of which set of keystrokes to use with each job. <br> <br>Thanks for the lovely fonts, though. Kudos.</p>
