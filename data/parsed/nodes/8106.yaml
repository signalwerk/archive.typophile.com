    html: <p><i>Erik Spiekermann mention a "trend" and not and innovation</i> <br> <br>Exactly. I would never claim having designed the first Sans with both O/S figures and Small Caps. Futura did have those figures back in 1927, and quite a few other faces did. Small Caps, however, were more unusual and still are. As a lot of Sans faces had larger x-heights than their Serif peers, one could more easily fake caps by setting them half a point or so smaller, something I often did in photosetting. Nowadays, I expect Sans faces to have all possible sorts of figures, tabulating, Old Style, lining (kerned full size) and perhaps even tabular figures with slight descenders and ascenders, as we did with FF Unit and actually ITC Officina which ITC didn't publish in the first release back in 1990. <br> <br>The reason FF Meta (which was first designed in 1985) got all the works was that I wanted to point out that it was really a Serif face, except those little strokes remained virtual. <br><img src="http://www.typophile.com/forums/messages/83/55712.gif" alt="spiekerfigures"></p>
