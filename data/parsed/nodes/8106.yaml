    html: <p>Well I got my OS X upgrade today, including InDesign, and am settling in for the evening to teach myself as much as I can. I don't think I'll be using it for books right away since my clients all use Quark for the time being, but I think that's likely to change over time. <br> <br>And Yves, you may live to regret your offer of help, as I'd rather get advice on the software from a typophile than anybody else.  <br> <br>But as a female, I don't mind reading manuals.</p>
