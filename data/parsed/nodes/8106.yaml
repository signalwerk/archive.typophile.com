    html: "<p>Jeremy Tankard's <a href=\"http://www.typography.net/type/bliss.htm\" target=\"_blank\">Bliss</a> is gorgeous, but it'll cost you at 125 GBP per weight (though each 'weight' includes small caps, all kinds of figures you could think of, superscripts, subscripts, et al. for both roman and italic). <br> <br>Also, some vendors sell SC/OSF versions of traditional sans faces: <a href=\"http://www.myfonts.com/fonts/neufville/futura-nd/sc-osf-medium/testdrive.html?s=I+dig+this+2%21&amp;p=48\" target=\"_blank\">Neufville Futura</a> has SC/OSF for Light, Book, Medium, Bold, and several condensed weights. <a href=\"http://www.myfonts.com/fonts/urw/futura/sctmed/testdrive.html?s=I+dig+this+2%21&amp;p=48\" target=\"_blank\">URW</a> also sells several Futura SC/OSF weights for cheaper, along with <a href=\"http://www.myfonts.com/fonts/urw/franklin-gothic/sc-t-book-condensed/testdrive.html?s=Franklin+with+SC+1234567890&amp;p=48\" target=\"_blank\">Franklin Gothic</a>, and even their clone of <a href=\"http://www.myfonts.com/fonts/urw/nimbus-sans-novus/nimbus-san-nov-sctmed/testdrive.html?s=Strange...1234567890&amp;p=48\" target=\"_blank\">Helvetica Neue</a>! <br> <br>Of course House's <a href=\"http://houseind.com/house.php?kit=NEUTRAFACE-FO&amp;sub=inuse\">Neutraface</a> has all the trimmings. <br> <br>Another cool one is Storm's <a href=\"http://www.myfonts.com/fonts/storm/john-sans/\" target=\"_blank\">John [as in Baskerville] Sans</a>, very reasonably priced and with 140 (!) different styles and variations for display and text.</p>"
