    html: "<p>Question, Erik: why don't the keystroke for ligatures and fractions in the FF fonts conform to the Adobe ligature/fraction keystrokes? It gets very confusing.  <br> <br>Also it would be nice to get a full set of fractions (including the 1/8ths) or if not, then a complete set of fraction uppers and lowers (don't know the technical name for these), like The Sans or Emigre's Mrs. Eaves and Filosofia. Sorry to sound demanding but I design cookbooks and art books both of which contain measurements so I'm constantly dealing with fractions. And I'm a ligature freak. Truly complete fonts are greatly appreciated.</p>"
