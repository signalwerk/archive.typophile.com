  html: <p>A while ago I noticed a thread on this topic but can't seem to find it now. Below I've started a (very brief) list of Sans w/ OSF &amp; SC in multiple weights (esp. semibold/medium &amp; bold), but I'm looking for other options. Please add to the list if you know of any... <br> <br><i>Eureka Sans - FontFont <br>Quadraat Sans - FontFont <br>TheSans - Lucas Fonts <br>Officina Sans - ITC/Linotype <br>Scala Sans - FontFont <br>Stone Sans - ITC/Linotype</i> <br> <br>Thanks in advance for any suggestions...</p>
