    html: <p>Mike, I know what you mean, but I think Erik Spiekermann mention a "trend" and not and innovation. And from my modest point of view this is true. <br> <br>Just have a look to printed design before FontShop (in the 70s and 80s) and it's really hard to see true small caps or OsF sans serifed type. <br> <br>Original Paul Renner's Futura had OsF, but they were buried by font technologies until Neufville Digital resurrected them some years ago. <br> <br>Maybe the point is on what we mean with the word "trend".</p>
