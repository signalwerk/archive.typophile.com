    html: <p>Hehe, when anything else fails, read the frickin' manual. <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> <br> <br>In InDesign, text boxes on master pages are linked from left  <br>page to right page, contrary to QX where you had to link them  <br>from the "incoming text link" icon in the top left of each master  <br>page. <br> <br>After importing your text, hold down the "shift" key before  <br>clicking the first linked text box if you want to automatically  <br>generate new pages as the text flows into the text boxes. <br>Easy as pie, but it also took me a while to find that out. <br> <br>Does that solve your problem, Erik? <br> <br>BTW I've become quite the InDesign-meister, so if anyone  <br>needs to know anything, don't worry about asking me. And  <br>yes I realize I sound like a pedantic arrogant bastard now. <img src="http://www.typophile.com/forums/clipart/bigsmile.gif" border="0"> <br>Just trying to be helpful ...</p>
