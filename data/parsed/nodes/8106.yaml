    html: <p>I'm getting InDesign along with my OS X upgrade but I need to use Quark (and currently OS 9) because that's what the clients want. Publishers seem to be the very last to switch over and it's really held me back.  <br> <br>I've heard from a lot of my book design fonts that while InDesign is much better in almost every way, it still isn't quite up to Quark's standards either for type or for elements like master page and style sheets which are essential to book design. Best used for smaller documents. I am looking forward to learning it though.</p>
