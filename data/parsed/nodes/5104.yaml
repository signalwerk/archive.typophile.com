    html: "<p>I love this forum for the quick and helpful inspirational responses. Thanks Grant and Stephen! <br>Santa Fe is the direction I'm going for. It's more generic, constructed than the nice \"Handsome\". But the \"e\" ... . French Letters looks good to me in the lower letters. Poppl-College and Signal (a little bit to edgy) are cool, Tarantula is supercool,except of some too postmodern features like the \"V\". <br> <br>I'm thinking of making a logoish monoline script font. Perhaps it could also look a little bit painted. Something like a bold template handwriting. It's gonna be used for a serious of logos in an art project.   <br>I just want to check: Whats in this field of \"template handwriting\"? Do you know more contemporary logos based on (custom) handwriting?</p>"
