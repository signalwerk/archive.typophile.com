    html: <p><a href="http://www.myfonts.com/fonts/bitstream/kaufmann/">Kaufmann Script</a> comes to mind immediately. <br> <br>As does Nick Shinn's <a href="http://www.veer.com/products/typedetail.aspx?image=SHT0000008">Handsome Bold</a> <br> <br>Letraset's <a href="http://www.veer.com/products/typedetail.aspx?image=LFT1058400">Santa Fe</a> is very clean. <br> <br>And Typodelic's <a href="http://www.myfonts.com/fonts/typadelic/natural-script/bold/">Natural Script Bold</a> isn't too bad. <br> <br>Neil Summerour's <a href="http://www.veer.com/products/typedetail.aspx?image=UMT0000004">Luce</a> probably isn't as bold as you need, but it's definitely monolinear. <br> <br><a href="http://www.myfonts.com/fonts/urw/gillies-gothic/">Gilles Gothic</a> is probably a bit too displayish. <br></p>
