      <p>The last time I heard from Andy he was going back to school.</p>
      <p>I think he was involved somewhat with the letterpress configuration of the proprietary face for Arion Press, and I think he mentioned some involvement with the Yale Carter typeface. </p>
      <p>But those are a couple/few years back already. And I’m not sure if he was involved or not or whatever happened to him.</p>
      <p>But in his short period of influence he changed us all. When grunge/post-modernism/de-constructionism/etc ruled the roost he brought us back common-sensically to the nuts and bolts of typography. We owe him a great debt.</p>
      <p>Gerald</p>
