  html: |-
    <p>National Geographic has a new blog showcasing forgotten imagery,<br>
    it also features a rather lovely italic serif for its masthead.</p>
    <p>Initially, I thought it was a Barnbrook face due to the seated italic U, I was wrong.</p>
    <p>Anybody have an idea as to which typeface they've used here?</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/found-logo3_5870.png"></div><p></p>
