      <p>&gt;  I don't own any printed specimens</p>
      <p>Me too. Back in the days when I ordered type from commercial typesetters I used to have several large binders on my shelf full of specimens, but those days are gone. </p>
      <p>As Nick said, printed samples can be cherished as things of beauty. And perhaps in specialized areas like maybe book publishing they are still used, and of course print shops and sign shops still have lists of available fonts to show clients, but in general I don't think graphic designers or others use high-quality printed type specimens much anymore.</p>
