      <p>I’ve published a few. My most recent:<br>
      <a href="https://www.facebook.com/photo.php?fbid=10151445442386565&amp;set=t.692020872&amp;type=1&amp;theater" title="https://www.facebook.com/photo.php?fbid=10151445442386565&amp;set=t.692020872&amp;type=1&amp;theater">https://www.facebook.com/photo.php?fbid=10151445442386565&amp;set=t.69202087...</a></p>
      <p>However, that was five years ago and since then I’ve generally produced specimen PDFs that people may print out, or view online. For dedicated print, I’ve taken out a few ads (e.g. in <em>Eye</em> magazine) and been participating in compendium volumes, e.g.—</p>
      <p><a href="http://shop.gestalten.com/type-navigator.html" title="http://shop.gestalten.com/type-navigator.html">http://shop.gestalten.com/type-navigator.html</a><br>
      <a href="http://www.slanted.de/shop/yearbook-type-i" title="http://www.slanted.de/shop/yearbook-type-i">http://www.slanted.de/shop/yearbook-type-i</a><br>
      <a href="http://www.amazon.ca/Creative-Characters-Interviews-Font-Designers/dp/9063692242" title="http://www.amazon.ca/Creative-Characters-Interviews-Font-Designers/dp/9063692242">http://www.amazon.ca/Creative-Characters-Interviews-Font-Designers/dp/90...</a></p>
      <p>I think printed specimens will be around for a long time. Quite apart from the issue of whether screen will replace print in general commercial work, or their functionality, printed specimens are beautiful <em>objets d’art</em> that typographers cherish, part of an ancient tradition that still informs design culture, especially typography.</p>
