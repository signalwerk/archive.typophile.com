    html: |-
      <p>Unfortunately there is no standard way of accessing the open-type features (such as alternate glyphs) of an OTF (open-type) font. It depends on the application you are using and there are some Apps which still doesn't support open type features.</p>
      <p>You can read how to use them in Microsoft Word 2010 or later here:<br>
      <a href="http://www.magpiepaperworks.com/blog/wedding-tutorials/using-opentype-fonts-in-microsoft-word/" title="http://www.magpiepaperworks.com/blog/wedding-tutorials/using-opentype-fonts-in-microsoft-word/">http://www.magpiepaperworks.com/blog/wedding-tutorials/using-opentype-fo...</a></p>
      <p>and there is some information about open type features in Adobe Illustrator here:<br>
      <a href="http://mediamilitia.com/taking-type-to-the-next-level-with-alternate-characters/" title="http://mediamilitia.com/taking-type-to-the-next-level-with-alternate-characters/">http://mediamilitia.com/taking-type-to-the-next-level-with-alternate-cha...</a></p>
