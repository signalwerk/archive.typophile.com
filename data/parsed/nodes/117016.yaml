      <p>The closest base fonts to my eye are Classic Roman MT <a href="http://www.myfonts.com/fonts/mti/classic-roman/" title="http://www.myfonts.com/fonts/mti/classic-roman/">http://www.myfonts.com/fonts/mti/classic-roman/</a> Pontif <a href="http://www.myfonts.com/fonts/letterperfect/pontif/" title="http://www.myfonts.com/fonts/letterperfect/pontif/">http://www.myfonts.com/fonts/letterperfect/pontif/</a> or a very similar Trajan. The faux Medieval touches Such as the X could come from a font like Mason Serif <a href="http://www.myfonts.com/fonts/emigre/mason-ot/" title="http://www.myfonts.com/fonts/emigre/mason-ot/">http://www.myfonts.com/fonts/emigre/mason-ot/</a> which has it as an alternate letter, or from Avqest <a href="http://www.fontspace.com/gemfonts/avqest" title="http://www.fontspace.com/gemfonts/avqest">http://www.fontspace.com/gemfonts/avqest</a> or it might simply be a little creative design work.<br>
      Don</p>
