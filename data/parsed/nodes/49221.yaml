    html: <p>All monospaced fonts are condensed? Don't type designers make the "M" and "W" as narrow as possible, and that sets the width of the font?</p>
    html_clean: <p>All monospaced fonts are condensed? Don't type designers make the "M" and "W" as narrow as possible, and that sets the width of the font?</p>
  - id: 300329
    user: 18444
    date: 2008-09-08T17:26:00
    date_raw: 8 Sep 2008 — 5:26pm
    votes: null
    html: |-
      <p>I have seen tricks done with the middle stroke of an M and W to make narrow even narrower.</p>
      <p>I think one of the failures of Adobe's Muliple Master technology was related to the M and W. </p>
      <p>If we inspect Merganthaler/Linotype's metal type designs of days gone by, we will find the designs of M and W very much differed dependinfg upon the point size of the design. At wider at smaller point sizes, and narrower at larger point sizers.</p>
      <p>This is because to promote readability, a wider M or W is required at smaller point sizes, but at larger point sizes the increased white space is unnecessary and too dominant.</p>
      <p>Similarly, good monotype designs to appear at smaller point sizes should be wider, than designs to appear at larger point sizes, which should be narrower.</p>
      <p>On a related topic, I heard from a professional type designer who did very interesting creative work for Microsoft's Typography Group. The designer explained that at very small points sizes, widths could be manipulated for on-screen only (@ lower resolution) representation, where certain characters could appearer wider than during printing at a much higher resolution.</p>
