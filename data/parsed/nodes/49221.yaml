  html: |-
    <p>Hello typophiles,<br>
    I'm working on a project that calls for a monospace typeface - but here's the catch - it needs to be condensed and somewhat elegant as well...<br>
    I did the original design with Letter Gothic but I'm looking for something else, with possibly more weight.</p>
    <p>Do you know of a great condensed monospace typeface that I may have overlooked?</p>
    <p>I'd love to know about it!</p>
    <p>Thanks in advance,</p>
    <p>Viviane</p>
