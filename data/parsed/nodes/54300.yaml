    <p>What up cousins. I am in need of your great opinions, I have a freelance graphic design studio based in Los Angeles, CA. I want to update my logo, but I'm stuck in choosing a type that will suit our icon. the type we were using before is in the Myriad family, but now it looks a bit soft to me, I want something a bit bolder but not to strong any suggestions? oh by the way the new revision i did I used Univers. Let me know your thoughts.</p>
    <p>Peace.<br>
    Elias Tercero</p>
