    <p>I put this in the build section because the people with the most experience tend to hang out here, at least from time to time.</p>
    <p>* * *</p>
    <p>If you look up most any typographic topic in Wikipedia -- say, letterspacing</p>
    <p><a href="http://en.wikipedia.org/wiki/Tracking_%28typography%29" title="http://en.wikipedia.org/wiki/Tracking_%28typography%29">http://en.wikipedia.org/wiki/Tracking_%28typography%29</a></p>
    <p>or</p>
    <p>justification (typographic)  </p>
    <p><a href="http://en.wikipedia.org/wiki/Justification_%28typesetting%29" title="http://en.wikipedia.org/wiki/Justification_%28typesetting%29">http://en.wikipedia.org/wiki/Justification_%28typesetting%29</a></p>
    <p>you find so many errors as to want to cry, shout, whatever your favorite form of expressing frustration.</p>
    <p>It's beyond my energy, and competence, to fix everything, but we should try.</p>
    <p>Nick Shinn? John Hudson? Etc.? Others who who know the history &amp; how technical word usage has changed over time.</p>
    <p>For example, the claim that:</p>
    <p><cite>Kerning adjusts the letters closer together (negative spacing), tracking adjusts the letters further apart (positive spacing).</cite></p>
    <p>ignores the history &amp; development of the use of this technical term. Originally, with both foundry type and Monotype, kerning was always a removal of space  between letterpairs. -- a saw with foundry type, and casting a kern with Monotype (&amp; probably could have foundry-cast type with a kern, don't know if this was ever done).</p>
    <p>The point is that the original notion of kerning always being a negative space was simply a technical issue,  hunks of metal were involved. You could add space, but that was a different technique.Can't do it with a saw. And in no case (save perhaps Monotype?) would you apply positive space to a whole paragraph, just too damn much work.</p>
    <p>As photocomp made inroads, letters were no longer hunks of metal, and the same system that provided for removing space between pairs of letters could be used to add space. "Postive kerning" ceased to be an oxymoron.</p>
    <p>And on &amp; on.</p>
    <p>If Wikipedia is to be fixed, it's going to take a bunch of us. Not interjecting our personal aesthetic, just accurate, fairly complete description.</p>
    <p>In the "talk" page on justification, Wiklipedia says</p>
    <p><cite>This article has been rated as High-importance on the importance scale.</cite></p>
    <p>and my first comment is</p>
    <p><cite>This article is full of inaccuracies</cite> </p>
    <p>Anyone want to help?</p>
