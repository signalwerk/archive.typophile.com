    html: |-
      <p>Thomas, one small quibble, and it's probably not for Wikipedia. </p>
      <p>You corrected the Wikipedia copy to <cite>Although digital type sets tighter on average than metal type...</cite></p>
      <p>All your changes were for the better, I think,  but I'd at least qualify this one. The overall wordspacing with computer comp (esp. PostScript &gt; OpenType) is probably tighter then with metal, but the letterfit with metal was often tighter. You are of course quite right that letterfit is a function of type design.</p>
      <p>With both Monotype and foundry metal, the presence of kerns on some letters meant that type would touch, though not overlap. And that meant editors -- those who mark proofs -- when looking at metal, were comfortable with "touching" letters. When photocomp came along, "not touching" became the new standard for text settings. For fun, just look at some Penguin books during Tschichold's and Schmoller's tenure. </p>
      <p>As for Linotype -- Over the past week, I've been re-reading a couple Nero Wolfe novels.</p>
      <p>The first, <cite>The Mother Hunt,</cite> (1963) was obviously printed letterpress, and just as obvious, printed from stereo plates. Too many copies printed for it to have been printed from the cast type.</p>
      <p>The second book, <cite>The Doorbell Rang</cite>, (1965) is set in the same typeface. My copy is a first printing, first edition. While it is set from the same metal type, I'm 99.44% sure repro was pulled and the book printed offset. It has that look, and an (almost) 21.66 pica measure offers another clue.</p>
      <p>Here's the point. These were set Linotype, not Monotype. Ignoring the problems of certain characters with the linecaster, the letterfit is tighter than we usually see today, esp. with the book where repro was pulled, where the ink spread is a bit greater.</p>
      <p>The common "not touching" requirement that came in with photocomp, even with kerning regularly applied, often results in a bit looser letterfit.</p>
