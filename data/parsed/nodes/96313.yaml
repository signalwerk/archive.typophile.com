      <p>TP: - Nicely done! From a position of ignorance, I wondered why you said that metal type could only be negatively kerned. Wasn't it possible to spread two letters apart? In fact, unless the individual characters were physically altered (by removing parts) they could NOT be kerned by moving them closer together. Granted, that was the only meaning of the term at the time. I'd suggest saying it something like this: </p>
      <p>"In its original meaning as defined for metal type, a kern could only bring letters closer together (negative spacing my modifying characters such as A and V so they weren't rectangular), though today it can go in either direction. Tracking can similarly go in either direction, though with metal type one could only adjust the letters further apart (positive spacing)."</p>
      <p>I wouldn't deign to make such a change myself, because I really don't know whether I'm right or not.</p>
      <p>- Herb</p>
