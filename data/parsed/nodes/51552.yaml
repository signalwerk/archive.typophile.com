    html: |-
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Untitled-1_3714.jpg"></div><p></p>
      <p>So I've been studying Michelangelo, Beata, Eurostile and Microgramma pretty closely for this. That's been really helpful.</p>
      <p>Here are some disconnected notes...</p>
      <p>-Been working on the diagonals a bit. I think they're a bit more consistent now, though I'm still not happy with the K.<br>
      -Made the tops of the B, R and P a little curved to counteract that leaning effect.<br>
      -Staightened up the D.<br>
      -Made the U thinner, but I think I overdid it.<br>
      -Made the S a little more angular. I think I need to go farther with that.<br>
      -Made lots of changes to the overshoots and width of various things, to get things looking more consistent. I'm trying to be less rigid about the numbers and just eyeball it.</p>
