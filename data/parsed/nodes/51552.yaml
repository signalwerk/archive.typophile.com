      <p>If you are looks for guides to designing type, the stuff I have found most helpful is:</p>
      <p>1. <a class="freelinking external" href="http://briem.ismennt.is/" rel="nofollow">Briem's site on type design</a>. Free!</p>
      <p>2. Letters of Credit, by Walter Tracy.</p>
      <p>3. Fonts &amp; Logos by Doyald Young</p>
      <p>Cheng's book is useful, but she doesn't really approach the subject as a type designer would--you get that from the others. </p>
      <p>For the technical side: Learn FontLab Fast by Leslie Cabarga</p>
      <p>And the most helpful is studying in depth--in FontLab so you can make overlays and comparisons--other fonts you admire. </p>
      <p>And finally, Typophile! </p>
      <p>Good Luck :)</p>
