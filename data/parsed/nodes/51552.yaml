    html: "<p>Ok, you asked more than once, so here's my two bits: you have a sound idea, but the execution doesn't look professional. The ideas are not consistently carried through--eg the tapered and bent verticals on the MN aren't followed elsewhere, and even the M and N are different treatments. The weight of the horizontals seem too heavy and clunky. Compare <a class=\"freelinking external\" href=\"http://fontbureau.com/fonts/Armada/inuse\" rel=\"nofollow\">Armada</a> by Tobias Frere-Jones for a balanced and polished execution of a related idea. Finally, the a lot of the curves are wonky, and the tail of the Q looks way out of place.</p>"
