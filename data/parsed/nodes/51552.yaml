    html: |-
      <p>Way better; you're starting to get your 'type eyes' :)</p>
      <p>The key to making it better is to study a lot of other stuff in depth. </p>
      <p>You can start with similar stuff. Armada is good, because it's Tobias Frere-Jones, who is one of the best, even though this is relatively early in his career. <a class="freelinking external" href="http://fontbureau.com/fonts/Clicker" rel="nofollow">Clicker</a>--done for TV guide on the basis of the old TV screen shape--is another to look at. Also <a class="freelinking external" href="http://www.myfonts.com/fonts/adobe/eurostile/" rel="nofollow">Eurostile</a>.</p>
      <p>You probably would find useful Karen Cheng's book Designing Type, which has a lot of comparisons between the widths and proportions of the caps. </p>
      <p>The idea of something wide, a bit squarish rounds, and somewhat Albertus serifs is fresh, I think. But you need both more consistency and better proportions to make this sing. On proportions see Cheng's book. There are no hard and fast rules, but still that will educate your eye. On consistency, I think for example the S needs to be more 'cornered' to look consistent with the rest of the face. check Armada, Clicker and Eurostile. Now the S looks like it can't decide what it wants to be when it grows up :) The D also needs to relate to the O, and currently looks like its having a severe identify crisis.</p>
