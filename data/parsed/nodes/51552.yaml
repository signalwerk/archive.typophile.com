  html: |-
    <p>Hi everybody!</p>
    <p>So... I'm currently developing a video game for this women's tackle football league, and wanted a font that had that blocky, authoritative look that you see on all the tv networks' NFL coverage... but I wanted something a little warm, too. (For lack of a better word, more <em>feminine</em>.)</p>
    <p>I couldn't find something, so last Saturday I started work on this.</p>
    <p>The game is due out in four months, so I'm a bit pressed for time... I was wondering if anybody had comments. I think it looks a little too cartoony; it's supposed to look kind of elegant and sexy, yet blocky. Not sure what's going wrong there.</p>
    <p>Thanks!</p>
