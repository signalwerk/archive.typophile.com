  - id: 315916
    user: 1138
    date: 2008-12-02T12:01:00
    date_raw: 2 Dec 2008 — 12:01pm
    votes: null
    html: |-
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Untitled-1_4759.jpg"></div><p></p>
      <p>I think I'm starting to get a better feel for this. But if I'm on the wrong track, could somebody please let me know?</p>
      <p>So I'm trying to make this look more professional, more balanced. I thought I'd start by looking at the whitespace; people at TypeCon are always talking about that. But I've never really looked at it much.</p>
      <p>I started with a redesigned R, that I'm fairly happy with (though it appears to be falling forward or something now).</p>
      <p>My normal instinct for the P then, would be to just remove the diagonal stroke on the R. But, without that there, the bottom of the bowl of the P doesn't feel balanced anymore; the diagonal was taking up some of that whitespace there. So I made the bowl a smidge taller.</p>
      <p>Having done that, the bowl felt a smidge too big, compared to the R.. so I made it thinner, trying to make the whitespace in the bowls similar in area, if not in shape.</p>
      <p>With that sort of logic in mind, I've increased the width of the E to make those counters match the R, and made the F a little thinner than the E, and moved the center bar down a tiny bit.</p>
      <p>On to the horizontal bars on the A, E, B and F. I've made those thinner; if the height of the horizontal bar on the top or bottom of the E is a particular percentance of the cap height, I figured the height of the center bar should be the around same percentage of the height between the top of the bottom bar and the bottom of the top bar... so that visually, they look the same. Just a guess, but I think that's helped.</p>
      <p>Anyway, I'm babbling. There's also a more conservative Q now, and I fixed up the S so it looks a little more balanced.</p>
