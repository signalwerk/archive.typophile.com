    <p>I've run into a bit of a feature-ordering dilemma, where two features can't be consistently ordered to produce the desired results. I'd thought of a rather ad-hoc hack to solve this, but was wondering whether this might potentially cause problems.</p>
    <p>What I'd thought of doing was something along the lines of the following, where a 'dummy' feature is declared simply as a placeholder for a lookup:</p>
    <p><code> feature QRXC { # dummy feature</code></p>
    <p>&nbsp;&nbsp;&nbsp;lookup X {<br>
    &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;# do X<br>
    &nbsp;&nbsp;&nbsp;} X;</p>
    <p>} QRXC;</p>
    <p>feature ss01 {<br>
    &nbsp;&nbsp;&nbsp;# do Y<br>
    } ss01;</p>
    <p>feature ss02 {</p>
    <p>&nbsp;&nbsp;&nbsp;lookup X;<br>
    &nbsp;&nbsp;# do Z</p>
    <p>} ss02; </p>
    <p>This would force the relevant lookups to be ordered such that feature 'ss02' would be able to do some stuff both before and after feature 'ss01' is applied. Feature 'QRXC' presumably would never be activated on its own since 'QRXC' isn't a registered feature and presumably therefore no application will be aware of it.</p>
    <p>Has anyone ever made use of this approach? Are there potential problems which might arise from using 'dummy' features (apart from the obvious problem that someone might someday register such a feature)?</p>
    <p>André</p>
