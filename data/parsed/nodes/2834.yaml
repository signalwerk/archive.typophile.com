  html: <p>This is a little something I have been working on, my first serif type. It is related to Kilbirnie Sans. The 'p' is off, can't quite get it right at this stage. I intend for this to be a fairly serious type. Comments are more than welcome.  <br> <br>Thanks, kris. <br> <br> <br> <br><img src="http://www.typophile.com/forums/messages/29/24833.jpg" alt=""></p>
