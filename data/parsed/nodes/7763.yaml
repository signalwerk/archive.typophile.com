    html: <p> hmm...kinda reminds me of an oldstyle digital clock mixed with a garage font...I think you have the right idea in trying to use a "building block" in order to create a modular type of font, but it seems like you have lost patience in a few cases, namely in the "B" (looks more like an "8"), the "D" (you should try something besides skewing it), the "J" (using an inverted "L" is a little bit easy) and the "R" (the terminal on the stroke is not quite what it should be...). I'm talking about the "soft" version here. You seem to have a better way of handling italic though. I especially like your "N" and "O" in the "hellacious" version, they are very well balanced. Some of the other letters could use a bit of breathing space in their counters. <br>I think you have a good idea, but it needs some refinement. Maybe you could try introducing another building block, a similar shape but used differently, or maybe something really unexpected that would add a whole different flavour to the font. Or sometimes it helps to have a smaller building block, so you can have a more diversified grid to play with. <br>In any case, keep on it! I wanna see the numerals! </p>
