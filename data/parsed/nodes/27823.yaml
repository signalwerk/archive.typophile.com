    html: <p>I have been lucky enough to mess with the beta OpenType version of Galaxie-Polaris, with small caps, text figures and glyph palette large enough to give Minion Pro a run for its money, and I think it is pretty close to ideal. Grotesque, but not autoclaved like Helvetica. The full typographic accoutrements make it suitable for book type and, by extension, sophisticated smaller bits of type. V3 is not yet released, but it shouldn't be too long. If you get the regular version, you can upgrade later. So I recommend it as something new and good, and an alternative to the current deluge of Gill-esque humanist sans faces.</p>
