      <p>Timeless, yet cutting-edge, humanistic, yet geometric, gallery, yet street, fun, yet classy, fine-art, yet fresh, elegant, yet not old-school....</p>
      <p>This is the voice of the nightmare client. Offer 300 different solutions until they see the one they want. After looking at 300 of them they'll pick the safe system font.</p>
