      <p>These suggestions are all great.  My want list has expanded immensely!  </p>
      <p>Oddly but possibly predictably, the client went back with Futura, but they are worried about the low X-Height of the standard Futura, and would like something a little higher than usual.  My easy answer to this would be to use <a href="http://www.fonts.com/findfonts/detail.htm?pid=243160&amp;grab_id=0&amp;page_id=388&amp;query=futura%20maxi&amp;SCOPE=Fonts" rel="nofollow">PL Futura Maxi</a>, but I know there's been some issues with some early digitizations being egg-shaped.  Can anybody vouch for this version?</p>
  - id: 155585
    user_id: 103
    user_name: Stephen Coles
    user_path: null
    user_image: /files/pictures/picture-103.gif
    date_raw: 1 Sep 2006 — 8:44am
    date: 2006-09-01T08:44:00
    votes: null
    html: <p><a href="http://www.fontshop.com/index.cfm?fuseaction=catalog.fontdetail&amp;displayfontid=C.106298.0.2&amp;attributes.sampleSize=144&amp;sampleText=ok&amp;sampleSize=230" rel="nofollow">Futura Maxi is indeed round</a>, but a little extreme in x-height. I'd go for <a href="http://www.fontshop.com/index.cfm?fuseaction=catalog.fontdetail&amp;displayfontid=BT.122658.0.0" rel="nofollow">Drescher Grotesk Small Sizes</a> unless you need more weights.</p>
  - id: 155760
    user_id: 1337
    user_name: ben_archer
    user_path: null
    user_image: /files/pictures/picture-1337.png
    date_raw: 2 Sep 2006 — 11:29pm
    date: 2006-09-02T23:29:00
    votes: null
    html: |-
      <p>David; absolutely! My want list too is straining at the leash...</p>
      <p>Funny how clients do that – revert to the original (boring?) plan after asking the designer to consider so much else besides. I'd swear they do it on purpose... </p>
      <p>Since I put that earlier post up I had a chance to closely compare the Neufville, the Adobe Linotype and the Bitstream version of Futura, but I hadn't thought to include either the PL Futura Maxi or the Drescher Grotesk. To my eye the counters in Futura Maxi b,d,p and q as shown at the Fontshop font detail link do indeed, look egg-shaped. But not the o. If the x-height got increased but the type design attempted to stay true to the geometry then something had to give, right?</p>
      <p>Although I'm loathe to suggest it, <a href="http://www.fontshop.com/index.cfm?fuseaction=verity.search&amp;font_categories=1&amp;font_categories_search=font_name_search&amp;searchstr=Avant+Garde" rel="nofollow">ITC Avant Garde</a> is often treated like a Futura with a greater x-height (maybe that's why my students like it so much: ).</p>
      <p>Even with the revamped Futura scenario my money would still be on <a>Neutraface</a> or  <a>Verlag,</a> as modern reworkings of the same thing but with better features.</p>
