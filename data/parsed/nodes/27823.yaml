    <p>Just kidding.</p>
    <p>But I'm looking for some ideas on a sans-serif face for a logotype that is well crafted enough to be timeless but different enough to be cutting edge.  Something with a humanistic feel but yet has a solid geometric foundation (yet without being too cold).  Something that speaks to the gallery crowd, but yet has some street cred as well.  Fun, but not tacky. Something that says fine art, but isn't as old-school and used to death as Futura.  It should have a tiny hint of elegance, however.</p>
    <p>I guess this can begin to sound like the search for the perfect sans serif after all.</p>
    <p>Any thoughts are well received. I hate asking these questions, but at the same time I'm green to this frontier and submit myself to the masters.</p>
    <p>Cheers,<br>
    DC</p>
