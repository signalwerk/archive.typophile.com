    html: |-
      <p><em> Could you describe “flare points”? </em></p>
      <p>The 22-inch distance between the seams at the bottom of your (grrooovy) trouser legs? The glowing afterimage burnt into your retinas after staring at the fireworks display? The tailights of my car as it disappears from view down that darkened highway? Or the thicker bits of the strokes in <a href="http://www.linotype.com/1305/optima-family.html" rel="nofollow">Optima?</a></p>
      <p>Just kidding. David maybe meant 'something with more <em>flair…</em>'</p>
      <p>BTW David, if you go for a nice clean Futura face, please take note of what Eric Spiekermann says <a href="http://www.spiekermann.com/iblog/C61720386/E1641366970/index.html" rel="nofollow">here</a> because evidently not all Futuras were created equal. To my mind the <a href="http://www.ftbauer.com/bswebs.G3?log%3Apkid=2&amp;log%3Acompany=22&amp;log%3Acontract=1&amp;log%3Aserviceid=1&amp;xtd%3Alanguage=es&amp;pkid=2&amp;idcompany=22&amp;idcontract=1&amp;idservice=1&amp;language=es&amp;behaviour=PRODUCT&amp;menukeys=TYPES_BUSCADOR&amp;buscador=Futura" rel="nofollow"> Neufville Digital</a> one is the best, but other people may tell you differently.</p>
      <p>To answer your initial question directly, I'd recommend Richard Dawson and Dave Farey's  <a href="http://www.itcfonts.com/fonts/font/pid/415078/ITC+Johnston+Complete+Family+Pack/detail&amp;grab_id=0&amp;page_id=53647&amp;query=ITC%20Johnston%20Sans&amp;SCOPE=ITCFonts" rel="nofollow">ITC Johnston Sans</a> as a contender. Also Jeremy Tankard's <a href="http://www.typography.net/type/bliss.htm" rel="nofollow">Bliss.</a> They both say 'the art that conceals its art' to me, but they're both old school compared to Futura.</p>
