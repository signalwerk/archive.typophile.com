      <p>If this is a logo, just draw it, so you can control how groovy/classy, fresh/timeless and organic/geometric it is. Who knows, it might be so good you could make a typeface out of it. Sounds like it would be an amazing typeface.</p>
      <p>The voice of the nightmare client will not leave my head!  And please don't hold the details of my queries against me, I assure you they're in jest (to some degree).</p>
      <p>I'm already leaning strongly on drawing the iconic element of the logo by hand, and what seems fitting is a nice clean Futura face. I'd love to make the perfect typeface, but I respect and know enough about the craft too much to think this can easily be done and at the same time be successful.  (if that makes any sense)</p>
      <p>I really appreciate all these suggestions.  Verlag is beautiful.  I'm loving the lowercase + italics.  Antifer looks like something I would use for my own identity.  It seems to have some DIN qualities, and I'm a huge fan.</p>
