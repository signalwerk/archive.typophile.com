    <p>Now we've had the whole talk about getting what you pay for and everything, but my coworker really likes the Adobe Type font <a href="http://www.veer.com/products/typedetail.aspx?image=ADT0003223" rel="nofollow">Avenir</a> and wants to use if for her personal stationery. We have the font at work, but she wants to do it the honest way, just on a tight budget.</p>
    <p>Can anyone suggest a similar font with a not-so-similar price? Any suggestion is appreciated...</p>
