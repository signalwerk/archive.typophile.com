    html: |-
      <p>Flash does not support OpenType advanced typographic features (ligature substitutions) at all.</p>
      <p>Basic ligatures (ff fi fl ffi ffl) have their own Unicode entries, but less conventional ligatures are either mapped to the PUA or <a href="http://blogs.adobe.com/typblography/2006/05/eliminate_priva.html">left unencoded</a>.</p>
      <p>In practice, this means:</p>
      <ol>
      <li>Flash can not use unencoded glyphs.</li>
      <li>It can use PUA-mapped glyphs (I think), but the original HTML page would render unreadable without the sIFR intervention.</li>
      </ol>
      <p>-- <a href="http://www.omine.net/">omine.net</a></p>
