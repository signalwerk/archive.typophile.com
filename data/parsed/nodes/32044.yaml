      <p>SiFR takes the ASCII text on the page as it's source. AFAIK, there wouldn't be a practical way to specify the ligatures in that manner.</p>
      <p>Now, perhaps this is an OpenType issue that Flash may or may not have support built in for...that'd be a question that one of the OpenType experts would have to address...</p>
