      <p>Oh boy, I can only say thanks. Invaluable. I have to go to bed now, but I'm really looking forward to reworking my typeface according to your input tomorrow afternoon. </p>
      <p>Yes, that small cap R may seem odd, but it's really a lower case Yr, used for scholarly transcription of Proto-Norse. (The upper case Yr is that weird R with the right part moved a storey down.) Yes, I know nobody will ever use it for this (nor for Livonian), but <em>I</em> want to be able to set "Ek HlewagastiR HoltijaR horna tawido" properly. I have a near-autistic fascination for archaic, classic and mediæval languages, you see.</p>
