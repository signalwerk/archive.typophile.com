      <p>Looking great. IKEA should've waited on their rebranding font choice! :-)</p>
      <p>/v/ looks both light and insufficiently overshot on the baseline to me.</p>
      <p>Tell me what's guiding your extender length decisions. I'm surprised you're pulling up the descenders with such (appealingly) high ascenders. </p>
      <p>I especially like the /n/, the /i/, the /f/, and the /z/. That question mark strikes me as too close to Futura (Telefon's got its own quirks, it doesn't need to copy Renner's!).</p>
      <p>The /y/ feels like it's falling rightward, and the intersection seems high relative to the baseline to my eyes. Perhaps just shifting the long stroke's bottom points rightward while retaining the angle of the short stroke would solve both issues.</p>
      <p>I wonder if all of your vertical strokes should be thinned the tiniest bit. Looking at "squaw," the /q/'s stem seems darker than the rest; and the vertical-dominated "litt" is the darkest word of all. (Some of this could be rasterization...)</p>
