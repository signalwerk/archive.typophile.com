      <p>Thank you, Hrant! </p>
      <p>You're definitely right about the "a", it looks like the afterthought it is. Originally I had a one storey-"a", but that is boring (and illegible, and makes the "æ" impossible). It didn't feel right, but I didn't know what I was looking for. Thanks for telling me. The Q is stolen from Jakob Erbar's sadly forgotten geometric (much used in the 30s up here), and you're right, it doesn't work. I'll think of something else. Those s-es are the most difficult glyphs I've <em>ever</em> drawn. The simplest shapes are the hardest. I'll try and fix it.</p>
