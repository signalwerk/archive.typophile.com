    votes: null
    html: |-
      <p>Thank you, everyone! </p>
      <p>Nina, the narrow "D" was a subconscious decision, I think. I've widened it slightly, just for you. (Er, and because it looks better.) Thanks for good-mouthing the "a". I like it too. It gives the lower case a much stronger identity, I think. Now the "g" and "a" are better friends, too. </p>
      <p>Craig, I've subtly softened "69", and made the "4" even taller. Darn, I love drawing spiky glyphs! And I've fought with the BDPR curves quite a bit. These shapes are always difficult for me, too tight, they get an undesirable diamond shape with ugly transitions from the lines, too soft, they look squarish. But I've finally learnt too use points at approximately 45 degrees in addition to extrema points, and that makes the transitions from the lines better, at least. Any better now?</p>
      <p>Chevron kays I've tried twice, just can't make them work. Perhaps I'll try again. </p>
      <p>I've strengthened the "N" diagonal slightly, and widened the letter half a hair. But this is one of the letters I really want a little "wrong". </p>
      <p>Gee, I didn't know Tempo once was a proper typeface, I only knew those nondescript condensed bolds Adobe sell. Thanks for bringing it to my attention, it's great! I think Neutraface is but a parody, by the way. Some may say the same thing about my typeface. Well, at least it's parody that I <em>like</em>.</p>
      <p>The "G", yes, that's a misfit. But I really like it. Georg Fredrik Fasting, the architect of the Norwegian telephone box, drew "G"s like that. On an ideological level, there's no other remnant* of the pen in this typeface, why use one here? But of course, it looks weird. I've thought a lot about it, too. </p>
      <p>* Except for the slanted "t" top. That's an influence from the old Norwegian street signs, and I just dig it. It should remind you of Erbar, not Arial.  </p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/52_4777.png"></div><p></p>
