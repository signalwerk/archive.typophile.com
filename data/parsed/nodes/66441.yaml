      <p>s is incredible. Good work.</p>
      <p>scedilla may need cedilla further right.</p>
      <p>w is awesome.</p>
      <p>Wow, a wynn! Why not indeed.</p>
      <p>yacute: move the acute right. And the opposite for ygrave.</p>
      <p>Fractions: I think I'd add a hair more weight overall.</p>
