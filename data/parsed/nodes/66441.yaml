    html: |-
      <p>Cool project, and I'm right with you on feeling pressed to finish something a bit simpler.</p>
      <p>In a way this is quite a difficult design to critique, since almost anything criticizable is equally likely an error or part of the deliberate naivete!</p>
      <p>I definitely agree on the /a/.</p>
      <p>I think sixes and nines may be *too* constructed looking, in their lack of tapering at the join and their sudden changeover from circle to line. Fours might need some more overshoot up top.</p>
      <p>BDPR also have too hard of a break from straight to round on the outside contours.</p>
      <p>Did you consider a counter on the R that was open at the bottom? That'd be another place where that acute angle could show up.</p>
      <p>Did you consider a chevron-style structure for /K/ (and, I suppose, for /k/)? That might go with the /M/ well.</p>
      <p>The diagonal of /N/ looks thin to me.</p>
      <p>I wonder if the /G/ is a stylistic misfit in the way the /a/ is. Did you try any versions with crossbars? Euro also feels rather out of place.</p>
      <p>That sliced off /t/ seems awfully arbitrary in a font where every other terminal hews to horizontal or vertical. Reminds me of Arial, too. :-( </p>
      <p>The spacing seems way too tight in the text setting, given the boldness, lack of contrast, and small x-height. I'm sure you haven't done much work with spacing at this stage, but I think it would be good to be able to determine fairly soon how legitimate the hopes of making this a font for running text are - and to judge that it needs some breathing room. </p>
      <p>This reminds me not only of Neutraface but even more of Tempo. <a class="freelinking external" href="http://typophile.com/node/10490" rel="nofollow">Here's</a> one of several interesting Typophile threads on the latter.</p>
