      <p></p><div class="imageWrap"><img src="http://typophile.com/files/58_4865.png"></div><p></p>
      <p>I've done some more work on the "R", here are three candidates. The first one is wider, as per Frode's suggestion, the middle one is a slightly reworked version of the old one, the third one is an interpretation of Craig's suggested R (it took me quite a while to understand that shape, thanks for helping enlighten me), which I think probably is my favourite at the moment. What do you think?</p>
      <p>Strange how defining the upper case R is! These three settings makes the word look like set in different typefaces, almost.  </p>
      <p>I've no idea what the typeface of that Vogue cover is (I almost thought it was a mock-up, by the way, as all the headlines are so stereotypically women's magazine that it is laughable. "Love, sex and what to wear", isn't that the essence of all women's magazine headlines?). This is a very good illustration of what Jan Tschichold called "a thicket of letters", by the way. Thanks for scanning and uploading. </p>
      <p>I've been wondering about the crossbar "G" (I now think that one has to be the definite version ...), is the crossbar's length and height right? Is it a problem that it is only slightly higher than the "E" and "F" crossbar? Should I raise and/or lengthen it? (Am I getting type blind already?) </p>
      <p>Thanks, Frode, and so do I. Type and craft beer are amongst the nicest of man's inventions, and they should indeed be combined. </p>
      <p>Jonathan, that is a splendid idea, in fact, I thought of it when I started drawing, and then forgot. I'll go for a full stencil font instead of alternate glyphs, I think, but, as you suggest, only make cuts in the letters that needs them to stay together. This is going to be fun!</p>
