      <p>@ might benefit from more space between the a and the ring.</p>
      <p>Your punctuation rocks!!</p>
      <p>TM: more weight?</p>
      <p>Section is such a hard one. It looks wide maybe?</p>
      <p>Uppercase:</p>
      <p>Ccedilla: should the cedilla be a slight bit heavier than on the lc?</p>
      <p>D: perhaps the bcps need pulling a few units right on the top and bottom of the bowl?</p>
      <p>E with diacritics: the diacritics seem to be all slightly too far left.</p>
      <p>Eogonek needs to have the ogonek flush with the right end of E's foot.</p>
      <p>Ezh may be too narrow. I'm quite unfamiliar with it really though.</p>
      <p>Q may need its right side lifting ever so slightly to even out the density above its tail.</p>
      <p>What is that funny R thing?</p>
      <p>Scedilla: see scedilla.</p>
      <p>OE: I've never seen one like that, but I really like it. Is that ok?</p>
      <p>I haven't looked in such depth through the bold and black. See what happens with the regular first!</p>
      <p>Really liking this, there's something really 1930s about this style to me, but much sharper.</p>
