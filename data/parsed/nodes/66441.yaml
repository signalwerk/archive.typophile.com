      <p>Looking at it in the text settings, I think the bowl of /a/ should be a hair smaller in the regular weight.</p>
      <p>In the bold weight, the /Q/ looks heavy at the bottom - should you push that counter down the slightest bit?<br>
      Also in bold, I think the upright segment of /5/ could be heavier by a touch.</p>
      <p>In the black weight, the diagonal of /7/ may taper too much - the cartoonish effect threatens to arise.</p>
