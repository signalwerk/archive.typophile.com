    html: |-
      <p>Thanks, guys!</p>
      <p>Curves are difficult, and the simpler the shape, the more difficult they are. New BPRD here. And Craig, here's your conventional "G", too. And a wider N. There's now also quite a bit of optical tweaking in most of the glyphs shown here.</p>
      <p>About your "R" suggestion: I actually tried this twice early in the process, and while I dig this shape, it reminds me very much of (the original) AvantGarde and Herb Lubalin and the 70s, and I discarded it because it felt out of place. Did that R shape exist earlier? I'd love to see an example of that. </p>
      <p>Jonathan, you're right about that, but you see, I don't want to make another Futura. I want this to be quirky. The letters that started it were TELEFON (see photograph in the specimen). Maybe I'll make more conventional alternates later, but that'll have to wait. </p>
      <p>About the spacing: Perhaps this is a display typeface, I really don't know yet. But if it is, the spacing is quite OK now (though crude) now, isn't it?</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/56_6618.png"></div><p></p>
