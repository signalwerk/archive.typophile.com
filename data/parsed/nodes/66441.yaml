      <p>What is your method for filing the corners? Lately I have found this effect very pleasing, perhaps too much time looking at vector perfect corners cuts into the eyes.</p>
      <p>I'd be careful not to lose the dimensional quirks through iteration.<br>
      <em>S</em> is a bit depressed at the base IMHO and the outlines seem shaky compared to the otherwise smooth alphabet.<br>
      I keep rotating S as I am drawing, otherwise I tend to run out of space constructing the lower curve.<br>
      (This sounds like a contradiction – what I mean is keep the proportional quirks, but execute smoothly. Also, please take my comments lightly as I am very pleased by this design and I don't wish to detract or patronise.)</p>
