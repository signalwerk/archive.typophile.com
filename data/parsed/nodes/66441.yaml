      <p>Thank you for all your comments and suggestions! I haven't had time for type drawing this weekend, so I'll just comment now and upload images and stuff later. </p>
      <p>Thanks for your kind words, Ben. You're probably right about the "D". It needs to be narrow, I think, but a few more units of width and some more meat in the curves will make it right. Your comment on the "G" confirms my own concerns about that glyph. Consider "2" and "5" fixed.</p>
      <p>Thanks, Elias, and no, it's not just you, the middle bars of E and especially F are too long, but I think they really have to be. Their eccentricity sort of defines the whole typeface. Then again, someone good once said "kill your favourite glyph" or something like that. I'll have to think about it. </p>
      <p>Thanks for your advice, Randy. I've decided on the "R" now, and your spacing words will come in handy.    </p>
      <p>Andrew, the corners are both filled and filed, and my method is quite straightforward. For this typeface, I made 10x10 bevels, and then I convert the sharp points to curved ones. I probably could use some script, but I prefer doing it by hand. Quite a lot of work (and lots of copy and paste), but that's okay with me. I like fiddling. </p>
      <p>You're right about the "S", it will be fixed. And thanks for your "S"-making advice.</p>
