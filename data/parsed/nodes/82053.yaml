      <p><em>Something I have been wondering lately is if using the same identity forever just leads people to take it for granted and not notice it. </em></p>
      <p>That's a different argument. Sure, perfectly good designs wear out.<br>
      I'm not advocating never updating, merely adhering to whatever the brand identity is at any given point in time.<br>
      Also, some brands may incorporate a multiplicity of type styles, if the varied styles are associated with distinctly branded products. But that isn't the case with Network Solutions, because they are not presenting the non-granny product, whatever it is, as such.</p>
