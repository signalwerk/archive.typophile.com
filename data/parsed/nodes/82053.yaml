      <p><em>The only fonts that should appear in an advertisement are the corporate fonts, anything else corrupts the identity.</em></p>
      <p>That's a very old-fashioned approach to brand standards. Something I have been wondering lately is if using the same identity forever just leads people to take it for granted and not notice it. For example, I can't even remember the last time I saw any promotions for American Airlines because the brand standards have been the same for almost fifty years. Everything AA does just blends into my environment. I don't see the Coke logo much, either. Logos and type standards may have worked well in the twentieth century but I think we are moving into a world where brand standards are less important than meaningful customer interaction.</p>
      <p>That said, a halfassed grannies-with-guitars gimmick is not even close to meaningful customer interaction!</p>
