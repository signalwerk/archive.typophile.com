    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Host_May2011-25_5178.jpg"></div><p></p>
    <p>I've never liked the kind of comparative ad that shows the wrong product choice, without having the guts to go head to head with a competitor. It seems counterproductive to devote most of an advertisement to a screw-up, and then attach one's brand to it.</p>
    <p>Usually Stupid Dad is mocked, but here the object of scorn is rocking grandmas. Sexist and ageist. </p>
    <p>Typographically, the error is compounded with what appears to be a selection from 1001 Free Fonts.</p>
    <p>The only fonts that should appear in an advertisement are the corporate fonts, anything else corrupts the identity.</p>
    <p>Telus has recently made the same mistake, after an awesome 15-year run of pure Helvetica 25 and 35, with this:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/Telus_4485.png"></div><p></p>
