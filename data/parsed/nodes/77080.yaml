  html: |-
    <p>from Michael Adkins...</p>
    <p>Just wondering if I could get some feedback on this new font. First: this font isn't trying to take itself too serious. It is a condensed tribute to the classic 1940s Captain America covers. Second: It fits in fine when bold, fill-up-the-space lettering is called for, and it works great for signage when you're trying to cram everything into a tight space (DOT numbers and GVW's come to mind.) In all other venues, its usability remains to be seen. </p>
    <p>Really, it's a work of passion, so the question of overall functionality also remains to be seen. Still, people are downloading the freebie at a hot pace, so there may be life for it beyond the funny books and sign shops. Thoughts?</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/fontry_american_cap_520_3928.png"></div><p></p>
    <p>~~~~~~~~~~~~~~~~~~~~~~~~~~~~~</p>
    <p><a class="freelinking external" href="http://www.fontspace.com/the-fontry/american-captain# " rel="nofollow"> <em>the beta version...</em></a></p>
