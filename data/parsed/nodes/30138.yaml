      <p></p><div class="imageWrap"><img src="/files/burbank_block_3826.gif"></div><p></p>
    <p><strong>HOUSE INDUSTRIES INTRODUCES “BURBANK” COLLECTION OF ANIMATED FONTS </strong><br>
    (YORKLYN, DE) December 18, 2006 — In a tribute to the golden age of animation, House Industries is introducing<br>
    Burbank, a versatile new collection of 20 animated fonts. The collection will be available January 1, 2007. </p>
    <p>The collection features Burbank Big, in three widths and four weights, and Burbank Small, in four weights of both<br>
    Roman and italic. Designed for mixing and matching, Burbank offers a nearly endless array of combinations. </p>
    <p>“Until now, animated typefaces were drawn as single, stand-alone display fonts. They rarely had relatives or a<br>
    supporting cast,” says Burbank designer Tal Leming, who was inspired by the versatility of his favorite cartoon<br>
    characters and the hand-lettered titles of classic animation. </p>
    <p>Often stymied by the lack of typographic options for his own graphic design projects that called for animated fonts in display and text weights, Leming set to work nearly a decade ago to create the Burbank “super family”<br>
    of typefaces. The collection features hand hewn fonts from big to small, wide to condensed, light to black and<br>
    nearly everything in between. </p>
    <p>“Designers need a coordinated, animated font family like this. I know that I sure did,” Leming says. </p>
    <p>House Industries is offering the entire Burbank collection of 20 fonts for $299, including a free T-shirt. Or you<br>
    can purchase the display and text sets separately, for $199 each. Burbank Big features the 12 display fonts<br>
    (condensed, regular and wide in light, medium, bold and black weights). Burbank Small includes eight fonts total,<br>
    four Roman and four italic, for use in text sizes. </p>
    <p>Order online at <a href="http://www.houseindustries.com" title="www.houseindustries.com">www.houseindustries.com</a> or call 1-800-888-4390. </p>
    <p><strong>About House Industries </strong><br>
    House Industries is a Delaware-based independent type foundry, illustration studio and design firm that markets<br>
    unique fonts and artwork worldwide. Noted for its typographic synthesis of popular culture, House Industries<br>
    creates functional fonts and lettering that permeate every facet of our visual landscape. </p>
    <p><strong>About the Designer </strong><br>
    Tal Leming is a type designer based in Baltimore, MD. His work can be spotted around the world on screens<br>
    large and small, in magazines and newspapers and on everything from packaging to clothing. His previous work<br>
    includes United, the largest-known American typeface family, released by House Industries in 2006. </p>
    <p>House Industries<br>
    1145 Yorklyn Rd.<br>
    P.O. Box 166<br>
    Yorklyn, DE 19736-0166 </p>
    <p>For more information visit <a href="http://www.houseindustries.com" title="www.houseindustries.com">www.houseindustries.com</a> </p>
