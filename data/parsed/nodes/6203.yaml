  html: <p>The Astigmatic One Eye Typographic Institute has just released its Specimen Collection Vol. I.  From inspirations both retro and today, Volume I captures an eclectic array of offbeat and playful typographic specimens, from the bold to the lightweights and everything in-between, 14 fonts in all.  This set is alive with playful pizzazz! <br> <br>Check it out at <a href="http://www.astigmatic.com" target="_blank">http://www.astigmatic.com</a> <br> <br>Purchase this set and you get access to the super-cool bonus font archives with over 20 great fonts.</p>
  html_clean: <p>The Astigmatic One Eye Typographic Institute has just released its Specimen Collection Vol. I.  From inspirations both retro and today, Volume I captures an eclectic array of offbeat and playful typographic specimens, from the bold to the lightweights and everything in-between, 14 fonts in all.  This set is alive with playful pizzazz! <br> <br>Check it out at <a href="http://www.astigmatic.com" target="_blank" class="link-external">http://www.astigmatic.com</a> <br> <br>Purchase this set and you get access to the super-cool bonus font archives with over 20 great fonts.</p>
