      <p>David, you will find visuals if you can get hold of a copy of "Printing Types of the World" by Alfred Bastien and G J Freshwater published by Sir Isaac Pitman &amp; Sons, Ltd. But you may find it difficult as it was published in 1931.<br>
      It has visuals of all the typefaces I mentioned. It also has many more, very beautiful designs as well, but these are my favourites (it was a hard choice) and so much better than the later digitized versions. Unfortunately they are shown incomplete and not very large, most range between about 18 to 24 pt and some smaller.</p>
      <p>If you can not find a copy in the library or second hand bookshop (well worth the effort in getting hold of a copy), then let me know and I will scan them for you.</p>
      <p>As an aside: It may have been tied eyes last night, but I thought that I noticed some subtle differences between Exoctic 350 and Peignot. But perhaps it is just a serif equivalent of a sans 'innovation'  :)</p>
