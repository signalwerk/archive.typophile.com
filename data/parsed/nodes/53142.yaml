      <p>Thanks, Craig. I've been trying to steal some time from other chores to respond to Graham's note. The point I was tying to make was that Cassandre designed a face the foundry called Peignot. When Bitstream issued its version they called it something else, as part of their overall somewhat descriptive style of name + number. The reasoning is not obscure at all.</p>
      <p>There may indeed be some "subtle differences" between Exotic 350 and Peignot. This invariably happens when a face is re-done by a manufacturer different than the originating foundry. It can also happen when a face is re-worked for a different technology.</p>
      <p>Both these kinds of differences and the use of new names is all part of the type business, and has been for a long time.</p>
      <p>powers</p>
