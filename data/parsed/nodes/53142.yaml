      <p>Cassandre’s Exotic 350 deserves to be forgotten.<br>
      Hasn't this thread been done before?</p>
      <p>Anyway, I am in a posting mood tonight for some reason. My examples:</p>
      <p>the original Healey from John Haddon &amp; Co, London<br>
      Goudy Catalogue &amp; Catalogue Italic<br>
      Old Style from Miller &amp; Richard, Edinburgh and London - designed by Alexander Phemister in the 1850's<br>
      Bernard Roman from Frederic Wesselhoeft, Ltd, London - designed by Lucian Bernard in 1924-28<br>
      Carlton from H W Caslon &amp; Co, London and not the ITC version<br>
      the original Stellar designed by Robert Hunter Middleton - its a sans, sorry Michael.<br>
      and lastly Hans Mohring's 1928 designs for his Elegant Face series including the Outline Face - a sans family, again, sorry Michael, but you will understand.</p>
