      <p>Thanks need—that’s the kind of informed—and unflinching—feedback I’m looking for.</p>
      <p>I admit to recency and technological determinism, but feel it is important. While Cheltenham is a large family with clearly distinguishable letterforms, it was—at least as far as I know—developed for metal setting on paper. There is a big difference between that and, say, FF Info, which was designed to work in small sizes and large, backlit signs. In the days of Cheltenham a signpainter could certainly have been hired to paint it onto a signboard, but that’s hardly the same thing. I probably need to state this very directly and up front.</p>
