      <p>According to your criteria, Cheltenham was the first multi-platform typeface:</p>
      <p>1. Developed concurrently for foundry and machine composition<br>
      2. Drawn with microdetailed serif structure (s-curve bracket) to provide visual interest at display size—an early Benton-pantograph drawn face, and...<br>
      3. At text size, sturdy construction held up on emasculating coated stock, and in crude process (halftone) knockouts and surprints of the era, and poorly registered multi-color printing, while fine details nonetheless looked smart, and...<br>
      4. On uncoated stock, small x-height provided elegant proportions.<br>
      5. Large family for all occasions.<br>
      6. Short descenders because focus of character recognition is on upper half of lower case letters (your “highly legible”).<br>
      7. Signature characters are “intentionally dissimilar” — spurred A and G, quirky g.</p>
      <p>So your origin-theory “as identity programs and typography converged” doesn’t hold up — a case of recency.<br>
      Favoring technological determinism, I would say that media convergence in the late 19th century prompted Cheltenham’s multi-platformism, and that relationship is probably a general principle, occurring most noticably in times of rapid technological change when a new media assimilates older media.</p>
