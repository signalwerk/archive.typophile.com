      <p>To keep things cleaner, here’s my followup post to the big one.</p>
      <p>First, I realize that trying to do a four-weight face in a short timespan is stupid and likely to fail or go horribly wrong. And even moreso as an undergrad project at school with no type designers on staff. But sanity and moderation are not my strong points. To be frank: I expect this typeface will likely come out looking light eight miles of cow shit, and that really doesn’t bother me. This is a learning experience. </p>
      <p>Second, I’m really interested in workflow and interpolation/blending. Right now, I see three options:</p>
      <p>1: Draw light and bold, blend them to get regular, blend regular and bold to be get semibold.<br>
      2: Teach myself multiple master next to the pool while I’m vacationing in Mexico.<br>
      3: Buy superpolator and teach myself that while I’m by the pool in Mexico.</p>
      <p>Anyway, suggestions are welcome!</p>
