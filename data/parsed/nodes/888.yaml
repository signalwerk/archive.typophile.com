    html: <p> For me, I continue to love the "solid" characters --  the S, the G and the E, for instance. (The non-condensed versions). The problem I have is that those characters don't sync up with the "non-solid" characters as well -- Q, U, and so on. On the other hand, there are some characters that are flat-out impossible to make fit into that paradigm, like the T and I -- no matter how you make them, they will never be as black as the S and G. <br> <br>So I'd have to say things are going great -- I love the typeface. However, the condensed still doesn't turn my crank. </p>
