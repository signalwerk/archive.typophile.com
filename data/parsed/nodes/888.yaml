    html: <p> i agree. the "s" was actually developed as a logo, and the face was built around that concept. those forms definitely are more dense than the others--H, L, T, and U are the most open feeling-- but there's just not much to work with on those letters. i've found that the condensed is easier to actually set type with, but the extended has a more unique feel. </p>
