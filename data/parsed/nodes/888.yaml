  html: <p>this is a face i've been developing based on a couple of directions in type i'm interested in personally. one being stencilled lettering ala the punk or d.i.y. music scene, and the second being the more structured, grid based forms we've all been seeing a lot of lately. the first one is based on  a 14 x 8 grid, and the condensed just rotates the grid 90 degrees. each letter- and number-form fills the space, but i don't intend it to be a true monospace, due to bad optical spacing issues i'm getting. i'm not totally sure i like it, which is why i'm posting. be harsh. is this something derivitave or that someone would actually buy/use? also looking for input on the forms themselves. thanks! <br> <br><img src="http://www.typophile.com/forums/messages/29/1404.gif" alt="syndicate.gif"></p>
