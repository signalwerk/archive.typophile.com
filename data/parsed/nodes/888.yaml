    html: <p> Tyler - well you know already how I feel about this face!* So maybe some Typophiles can help answer some questions that really haven't been answered here. <br> <br>Specifically, if a face like this goes to retail, approximately HOW MANY copies (licenses) will be sold? <br> <br>There are plenty of lurkers who could give us some idea of retail sales. Someone said 50 might be an average of sales within the first year. <br> <br>For example, Gothic Gothic by IHOF. Is that selling 50 copies, 100 copies, or more? <br> <br>I've read about percentages offered by various foundries, but I've never heard anyone mention how many of a particular font is sold. <br> <br>If anyone wants to contact Tyler or myself directly, we will respect your privacy and not share the information if that's what you request. <br> <br>thanks, <br> <br>bj <br> <br>* I contacted Tyler the day he posted this about possibly including Syndicate in Apollo 26's first retail release. </p>
