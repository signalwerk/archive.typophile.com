    html: <p>Wow. This has got to be one of the best dystopian typefaces I have ever seen! <br> <br>Your subtle blend of stencil, blackletter and grid-based type is just excellent, and the condensed version, which imho is the best, even reads quite well. I can easily picture this successfully used in a cyberpunk scifi-flick on oppressive propaganda posters. (Too bad you didn't finish it before they made Blade Runner... ;D) The slanted line-ends are my favourite, as they subtly echo blackletter type and the (undeserved) associations that it has gained with Nazism, thus strengthening the totalitarian feel of the face. (They also remind somewhat of <a href="http://www.typeco.com/3Gothic.html" target="_blank"> Gothic Gothic</a>, another great face.) I hope I didn't read to much into your face... ;D <br> <br>Furthermore, making the normal and condensed verions related, but not by squishing or extending, is a stroke of genious. (But skip the italics.) However, the normal version seems a bit too heavy to my eye. I would look into either sacrificing the grid, or making it one "pixel" narrower. But then again, this might destroy the feel of the face. You could try it anyway. <br> <br>Also, shouldn't the stencil gap of your normal 'G' be positioned like that on your normal 'C'? And shouldn't the tail of the normal 'Q' extend outside of the letter, just like that on the condesed 'Q'? Possibly, you could also slant the line-end of the roof on the '1'. <br> <br> <br>Btw, the name makes me associate to the computer game classic Syndicate, which indeed is very dark and dystopian. Is this intentional? Do you even know of the game?</p>
    html_clean: <p>Wow. This has got to be one of the best dystopian typefaces I have ever seen! <br> <br>Your subtle blend of stencil, blackletter and grid-based type is just excellent, and the condensed version, which imho is the best, even reads quite well. I can easily picture this successfully used in a cyberpunk scifi-flick on oppressive propaganda posters. (Too bad you didn't finish it before they made Blade Runner... ;D) The slanted line-ends are my favourite, as they subtly echo blackletter type and the (undeserved) associations that it has gained with Nazism, thus strengthening the totalitarian feel of the face. (They also remind somewhat of <a href="http://www.typeco.com/3Gothic.html" target="_blank" class="link-external"> Gothic Gothic</a>, another great face.) I hope I didn't read to much into your face... ;D <br> <br>Furthermore, making the normal and condensed verions related, but not by squishing or extending, is a stroke of genious. (But skip the italics.) However, the normal version seems a bit too heavy to my eye. I would look into either sacrificing the grid, or making it one "pixel" narrower. But then again, this might destroy the feel of the face. You could try it anyway. <br> <br>Also, shouldn't the stencil gap of your normal 'G' be positioned like that on your normal 'C'? And shouldn't the tail of the normal 'Q' extend outside of the letter, just like that on the condesed 'Q'? Possibly, you could also slant the line-end of the roof on the '1'. <br> <br> <br>Btw, the name makes me associate to the computer game classic Syndicate, which indeed is very dark and dystopian. Is this intentional? Do you even know of the game?</p>
