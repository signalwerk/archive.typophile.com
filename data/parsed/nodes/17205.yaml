      <p>For the r you could bring the horizontal at the bottom of the arm further down than the first storey of the a and by curving the bottom of the t’s crossbar and raising it (and the oblique) you could close that space, not to your standard space but slightly, the j seems slightly out of place, the curve at the bottom and the dot, you could try a (rounded) rectangle for the dot and make the body rectangular too. In the end though it is the differences that make the letters.<br>
      Tim</p>
      <p>Add a swoosh, make it blue and you’ll be there ;)</p>
