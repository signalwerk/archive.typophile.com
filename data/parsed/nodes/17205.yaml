    html: <p>I would worry about the spacing in between the _ra_ pair. I would worry about the spacing overall and make sure it is mechanically even. The open spaces within the letterforms set the pace for you to follow. The top version works more for me than the bottom. Why not have the tagline in yellow if that is where you think it is best placed?</p>
