    html: <p>Here is the original lettering and a simulation done (crudely) using Pump Demi. I can see that there are rounded joins in the original. That's probably a bit beyond my skill with Illustrator, but probably not for a more accomplished professional. I think this is at least a close approximation. I used short line segments for the connections. <br><img src="http://www.typophile.com/forums/messages/83/49816.gif" alt="Hil St Soul Simulation"></p>
