      <p>To answer Tom - some of the typefaces listed were from the original publisher's spec. There will be some adjustments, depending on the quality of work we get in for all the listed typefaces. I know some of the choices might seem out of the norm, but they were chosen based on trying to get a well rounded overview of classic types, with a few modern "classics" worked into the mix.</p>
      <p>Multiple cuts will be illustrated to show designers how different some variants are that are sold under the same or similar names.</p>
