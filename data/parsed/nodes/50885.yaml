      <p>I'm not trying to start a debate or anything, but I'm curious as to how the list of typefaces was chosen? I was kind of surprised to see that of the three Adobe Originals in the set, two of them were Blackoak and Wood Type Ornaments.... Eldorado, Monterey and Vineta were also unexpected (to me).</p>
      <p>Also, some typefaces listed are classics that have been revived in often radically different versions, such as Bodoni, Caslon, and Garamond. Are we to assume that the different cuts are interchangeable for purposes of this book? </p>
      <p>Cheers,</p>
      <p>T</p>
