    <p>New project I'm working on... with the good help of Miss TIff and Jimmy G. All good typographic design meeting the parameters will be happily considered.</p>
    <p>. . . . . . </p>
    <p>Invitation to Submit Work for Rotovision Book - FONT - Classic Typefaces for Contemporary Graphic Design</p>
    <p>I am working on a book on classic typefaces used in contemporary graphic design for Rotovision, a noted UK publisher. FONT will feature around 60 classic typefaces and will feature the best in today's design using typographic favorites like Frutiger, Helvetica, Bodoni, Clarendon, and Baskerville. FONT will be published next summer by Rotovision in the UK and Princeton Architectural Press in the United States.</p>
    <p>We are seeking a variety of design work that uses the classic typefaces featured in FONT. Work across all media is welcome.</p>
    <p>At the end of this message is a list of the fonts that will be featured in FONT. If you have created design work using any of these typefaces, we'd like to see it. You can submit good quality jpegs, PDFs, or other Mac-compatible formats for the initial review. Once we've taken a look at the images you submit, we'll ask for high-resolution files suitable for print, along with more information about each project, and have you fill out and sign a simple release form granting us permission to publish the image(s) in FONT.</p>
    <p>We ask that you please only submit work that you already have permission to publish for promotional purposes, or work that you can quickly and easily obtain a client release for.</p>
    <p>Multiple submissions are encouraged. All work will be properly credited.</p>
    <p>Please submit your images for review no later than Friday, November 14. You may attach your images to email if the total of all attachments is less than 20mb; otherwise, please send a link for downloading the images. Email address for submissions is <a href="mailto:fontthebook@gmail.com">fontthebook@gmail.com</a>.</p>
    <p>For each image, please include the following information:</p>
    <p>1) Title of the project<br>
    2) Type of project<br>
    3) Name(s) of typeface(s) used (please specify exact font name and foundry if known)<br>
    4) Name of Studio and Principal Designer(s)<br>
    5) Client<br>
    6) Year the project was completed</p>
    <p>To help ensure that your email gets through all the spam filters in the world, please title it as shown:</p>
    <p>Rotovision FONT Book Submission - Your Studio Name 1 of 3</p>
    <p>Rotovision FONT Book Submission - Your Studio Name 2 of 3</p>
    <p>Rotovision FONT Book Submission - Your Studio Name 3 of 3</p>
    <p>etc.</p>
    <p>DEADLINE FOR SUBMISSIONS IS Friday, November 14. </p>
    <p>---------------------------<br>
    FONTS IN USE LIST<br>
    ---------------------------</p>
    <p>Please submit work that uses at least one of the typefaces from the following list. Projects that use multiple typefaces are welcome. You can submit work using any cut/weight/style/variant of these typefaces.</p>
    <p>Akzidenz Grotesk<br>
