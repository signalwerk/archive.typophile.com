      <p>Hi Brian,<br>
      Thanks for your interest and response, here are some answers.</p>
      <p><cite>playing around = what exactly? does that mean sketching on paper ... or digital ideations — illustrator, or some other program?</cite><br>
      Playground is in Adobe Illustrator of course, I didn’t post drafts because I don’t really like any of them.</p>
      <p><cite>do they want upper or lowercase? (i’d imagine upper).</cite><br>
      They currently use both, I prefer lowercase rather which would give it more of a modern feel.</p>
      <p><cite>Do they have a site we could see?</cite><br>
      Website doesn’t show much, here is a <a class="freelinking-external" href="https://web.archive.org/web/20081007181312/http://www.sesmedia.com/">link</a>.</p>
      <p><cite>Any background on the company? What *exactly* do they do? Who are their competitors? Who are their customers?</cite><br>
      This is the interesting part, I can’t elaborate much because some of the details are confidential, but here are the basics. They are a young and fresh think tank group aspiring to reach the american orthodox jewish sector just like other ethnic marketing agencies (e.g. WingLatino, Vidal Partnership, Alma DDB, etc.) are already doing with the hispanic sector for example.</p>
