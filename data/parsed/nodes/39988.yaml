    <p>Hi,<br>
    I’m working on a logo for a media (Advertising/Marketing) agency, the name is just initials with the letters s, e, s, I’ve been playing around with different concepts but keep on getting stuck because of the duplicate “s” letters. </p>
    <p>The goal is to create more of an ’Identity’ than a logo, I’m thinking of implementing <a class="freelinking-external" href="https://web.archive.org/web/20081007181312/http://www.fontshop.com/search/?q=vista%20sans">Vista Sans</a> as the general brand typeface (a custom font would probably not be affordable).</p>
    <p>Any suggestions or direction?</p>
    <div class="forum-topic-navigation clear-block"><a href="/web/20081007181312/http://www.typophile.com/node/47763" class="topic-previous" title="Go to previous forum topic">‹ Self Promo Logo</a> <a href="/web/20081007181312/http://www.typophile.com/node/48041" class="topic-next" title="Go to next forum topic">Logo Design for Photographer ›</a></div>
