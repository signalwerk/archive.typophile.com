      <p>BEP ... seems like there might be some interesting possibilities.</p>
      <p>but we need some questions answered ... :D</p>
      <p>playing around = what exactly?</p>
      <p>does that mean sketching on paper ... or digital ideations — illustrator, or some other program?</p>
      <p>do they want upper or lowercase? (i’d imagine upper).</p>
      <p>any particular style they are trying to convey with the letterforms? Do they have a site we could see?<br>
      Any background on the company? What *exactly* do they do? Who are their competitors? Who are their customers?</p>
      <p>what are they currently using for a logo? Where are they based? Do they want something monogram-ish? Do they want a graphic device or just the three letters?</p>
      <p>are there periods between S.E.S. ?</p>
      <p>kinda difficult to assist b/c Step 1 = research and we don’t have any info. :)</p>
