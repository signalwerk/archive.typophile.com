    <p>I'm surprised this hasn't come up before, but typographically what are your favorite beer labels. There are so many hand scripted/lettered versions out there! </p>
    <p>Personally, I like the Leinenkugel logo. [ <a href="http://www.leinie.com/av.html" title="http://www.leinie.com/av.html">http://www.leinie.com/av.html</a> ]<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/1455993232_95269ae10a_4377.jpg"></div><p></p>
    <p>and  [ <a href="http://www.schneider-weisse.de" title="http://www.schneider-weisse.de">http://www.schneider-weisse.de</a> ] The Schneider and Sohn's Shneider Wiesse logo</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/hefe3_4932.JPG"></div><p></p>
    <p>and not so much for taste, but for script skills:<br>
    [ <a href="http://budweiser.com/" title="http://budweiser.com/">http://budweiser.com/</a> ] the Budweiser logo:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/budweiser_6713.gif"></div><p></p>
