    <p>I'm surprised this hasn't come up before, but typographically what are your favorite beer labels. There are so many hand scripted/lettered versions out there! </p>
    <p>Personally, I like the Leinenkugel logo. [ <a href="http://www.leinie.com/av.html">http://www.leinie.com/av.html</a> ]<br><img src="/sites/default/files/old-images/1455993232_95269ae10a_4377.jpg"></p>
    <p>and  [ <a href="http://www.schneider-weisse.de">http://www.schneider-weisse.de</a> ] The Schneider and Sohn's Shneider Wiesse logo</p>
    <p><img src="/sites/default/files/old-images/hefe3_4932.JPG"></p>
    <p>and not so much for taste, but for script skills:<br>
    [ <a href="http://budweiser.com/">http://budweiser.com/</a> ] the Budweiser logo:</p>
    <p><img src="/sites/default/files/old-images/budweiser_6713.gif"></p>
