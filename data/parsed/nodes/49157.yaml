      <p><em>Miss Tiffany, are you speaking of naive forms or refined lettering solutions.</em></p>
      <p>Today the OT tech is so advanced that we can be tricked. But I'm speaking of the façade, so perhaps refined lettering solutions. I'm generalizing, of course, as there are honest and appropriate reasons for using this style of typeface/lettering. I'm mostly bored with it becoming a go to sort of way to achieve a look without really considering if it is the best and/or most appropriate answer for the problem at hand. So I do agree with your second statement.</p>
  - id: 300631
    user: 6065
    date: 2008-09-10T12:29:00
    date_raw: 10 Sep 2008 — 12:29pm
    votes: null
    html: |-
      <p>I guess what I am asking is how can hand lettering speak to eco-friendly. Sure you can use naive (or rather ill-informed letters) to suggest "I am green" but that is a graphic ruse that has been perpetrated for many many decades. You can also bore potential consumers with minimalist "Less is better" (see above) and say the same thing. It is the whole generic brand fad. As to it looking elegant or rough around the edges, it is a "product of the product." It is not green or sheen, just job specific.</p>
      <p>I guess I am surprised by some of the comments about lettering. It is almost as if it is thought that lettering is a flash in the pan. Nick even said something the other day about the script "fad." Scripts have been being produced one after another, AND applied to product, since I have been at this, several decades. I have always perceived what we lettering artists do is enhance the "product" when nothing else will do. </p>
      <p>No argument from my side just pure curiosity as it affects what I (and others) do and how lettering is perceived by people of "the tangential letter mind."</p>
      <p>Michael</p>
  - id: 300662
    user: 108
    date: 2008-09-10T15:17:00
    date_raw: 10 Sep 2008 — 3:17pm
    votes: null
    html: |-
      <p>Ah. Ok, first while I do agree there is a huge "fad" right now with script fonts, I don't think it will die out, but mutate into new styles.</p>
      <p>Second I didn't mean to say that lettering is a flash in the pan. Not at all. What I do think is there happens to be a lot of people using naïve looking fonts/typefaces/lettering on indie films and products where they are trying to convince us that it has been hand-held (cared for?) from the beginning. As if to say the slicker it is somehow the less authentic it is. Does that make sense? Maybe we should start a new thread.</p>
