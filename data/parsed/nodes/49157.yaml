      <p>I guess what I am asking is how can hand lettering speak to eco-friendly. Sure you can use naive (or rather ill-informed letters) to suggest "I am green" but that is a graphic ruse that has been perpetrated for many many decades. You can also bore potential consumers with minimalist "Less is better" (see above) and say the same thing. It is the whole generic brand fad. As to it looking elegant or rough around the edges, it is a "product of the product." It is not green or sheen, just job specific.</p>
      <p>I guess I am surprised by some of the comments about lettering. It is almost as if it is thought that lettering is a flash in the pan. Nick even said something the other day about the script "fad." Scripts have been being produced one after another, AND applied to product, since I have been at this, several decades. I have always perceived what we lettering artists do is enhance the "product" when nothing else will do. </p>
      <p>No argument from my side just pure curiosity as it affects what I (and others) do and how lettering is perceived by people of "the tangential letter mind."</p>
      <p>Michael</p>
