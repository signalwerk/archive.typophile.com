    html: |-
      <p>Hmm, I'm not sure that Meta wins the most typographic beer prize, Si… I have two other contenders:</p>
      <p>1. Schöfferhofer Weizen. Here is just the logo. But the label uses a nice orange background with nice engraved lines, etc. Aside from the German blackletter coolness, this beer has a picture of Peter Schöfferhofer on it. Mr. Schöfferhofer apparently worked with Gutenberg in Mainz, and then helped take over the business. The Schöfferhofer family was involved in printing and typography from the beginning, and this is their beer. How do you beat that?</p>
      <p><img src="/sites/default/files/old-images/schoefferhofer_logo_4748.jpg"></p>
      <p>2. Frankfurter. Schöfferhofer Weizen is brewed in Frankfurt am Main now, I believe. The Frankfurter beers comes from the other Frankfurt – Frankfurt an der Oder, which is on the German border with Poland. This beer doesn't use any of that traditional blackletter stuff, but rather Akira Kobayashi's Calcite.</p>
      <p><img src="/sites/default/files/old-images/fra_flasche_logo_4933.jpg"></p>
      <p>Both of these images are from <a href="http://www.fontblog.de">FontBlog.de</a></p>
    html_clean: |-
