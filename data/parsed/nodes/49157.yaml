      <p>Well, considering the current flair for "GREEN" design, it's probably quite cliche to expect a sustainable brewery to follow the trends of hand-lettering to symbolize that they're eco-friendly, blah blah blah...</p>
      <p>I was just remarking that I don't associate Copperplate with that whole "Green" motion.</p>
      <p>I do like the New Belgium logo, and the type selection does work well. They must be doing something right because I wish I had more access to their beers. I've even commented directly to them about getting more of their beer in PA. They said that because the distribution distance is so great, they couldn't justify shipping that far. It goes back to their earth-friendly approach and desire to reduce their impact on non-replenished fuels. I guess I'll have to wait until their are more electric freight trucks on the road till I can have a cold New Belgium in PA.</p>
