      <p>Winnipeg "shoegaze" band "Guitaro" released a CD called "Futura Black" in 2002. At <a href="http://guitaro.ca/" title="http://guitaro.ca/">http://guitaro.ca/</a> , they write that "the name 'Futura Black' was taken from a typeface designed by Paul Renner." They use Futura Black in the CD cover design.</p>
      <p>There is also an Ohio band named "Times New Viking."</p>
