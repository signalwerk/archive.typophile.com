    html: |-
      <div class="comment-spam-body"><p>Occasionally a crossbarless _A_ might suggest that a word has ancient roots in Greek. But contemporary readers who recognize Greek letters are almost non existant.<br>
      So usually a word with a crossbarless _A_ suggests the opposite of ancient. Perhaps "ad Astra" the face of the future.<br>
      In any case, the crossbarless _A_ is  now such a design cliché that I would be reluctant to use it for anything that does not have an ultra sleek, high tech or futuristc character. Even there, it's in the "been there, done that" category.<br>
      Don</p>
      </div>
