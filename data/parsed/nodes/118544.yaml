      <p>I think if the crossbar is going to be removed it should be done for a valid reason, and not because the designer didn't have any better ideas. Victoria Beckham kind of skirts the line, but I guess it can be justified by the fact that the crossbar-less A at the the end of "VICTORIA" acts as an inversion of the initial V and sort of book-ends the name, creating a natural break with "BECKHAM". But perhaps I'm stretching.</p>
      <p>As always, it depends on the particular execution and whether it's done well or badly.</p>
