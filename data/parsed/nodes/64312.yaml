      <p>In this economy I just do what it takes to get paid. Nobody has the clout to do otherwise right now.</p>
      <p>But I don’t do ANY volunteer design anymore. I’ve gotten burned too many times by people at nonprofits who jerk volunteers around every chance they get because it never costs them any money. The last straw was with a guy who would make appointments with me and not even be in the building when I arrived. The next time I want to volunteer I’m just going to go clean up at an animal shelter—at least the dogs appreciate the help.</p>
