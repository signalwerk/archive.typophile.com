      <p>In my limited and largely second-hand experience, non-profits are notoriously toxic places to work, let alone do business with. So yeah, no surprises there there, Dan. </p>
      <p>Screw the economy. Everyone wants to squeeze a little more blood and blame it on the economy. It's way too easy. Sure things are tough, but things cost what they cost, and a good design job is not a luxury. I think that (with the option of being more flexible in your back pocket), you lean as far in the direction of "call me when you are serious" as possible. I've been learning you don't get a lot of respect for being agreeable. Even less for being cheap and agreeable?<br>
      …<br>
      -=®=-</p>
