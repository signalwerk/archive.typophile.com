      <p>You draw the line where you have the clout to do so. Paul Rand once told us the story of working on the Ford Identity project. He said the Ford PR guys first flew him up to Detroit to see the glitzy airbrush takes on a new logo they had done to show him their "ideas" for a logo. It was a big bash with spotlights and fanfares. Randy said, "I told them to take me back to the airport and call me when they were serious about the identity project." </p>
      <p>Paul Rand could get away with that, you and I would have been dumped at the bus station.</p>
      <p>ChrisL</p>
