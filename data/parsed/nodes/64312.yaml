    <p>Here's the issue:<br>
    The less you charge, the less you are valued<br>
    The more you charge, the more you are listened to.</p>
    <p>I remember a designer Bruce Hale telling a story about working for a non-profit for very little money, but getting very little respect or cooperation in return. But when working on a six digit project it's "Yes sir, Mr. Hale. Would you like coffee with that Mr. Hale? How high again did you ask us to jump?"</p>
    <p>I've seen this time and again, whether it be web design, a custom font project, book or brochure. Where, financially or otherwise, do you draw the line?</p>
