      <p>It still seems that the relation between OT specs and layout engines needs improved documentation.<br>
      (1) One part would describe how this or that current application or layout engine works. For backward compatibility, if desired. To be done by applications' developers.<br>
      (2) The more important part would be more instructive/imperative: How <cite>should</cite> layout engines do it? (This seems most important for complex scripts, but even Latin raises questions regarding typographic features like, which features to be called by an application's 'All Caps' option -- with or without 'lnum'?) This would establish a stable ground for both font and application developers, and make sure users can expect the same font behavior across platforms and applications.</p>
      <p>Great thread.</p>
      <p>P.S. -- <cite>The method described essentially entails reduplicating the lookups under blws and abvs features under the rlig feature as well.</cite> -- Reminds me of the 'ssXX'/'salt' thread ...</p>
