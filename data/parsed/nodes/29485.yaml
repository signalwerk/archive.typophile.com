      <p>In order to support Tibetan OpenType fonts a rendering engine or application needs to support and apply the following OpenType features for Tibetan script: ccmp, blws, abvs, blwm, abvm, calt, and kern.</p>
      <p>(These are the features used in Microsoft's "Himalaya" font and in several other OpenType fonts for Tibetan script).</p>
      <p>InDesign and other Adobe applications currently *do not* support these features for Tibetan script. Without that support you may be able to enter glyphs for basic Tibetan characters but the complex conjunct stacks (ligatures) absolutely necessary for proper rendering of Tibetan will not be formed.</p>
      <p>Microsoft's Uniscribe does support these features - and Unicode Tibetan has worked pretty well for several years in MS Word &amp; MS Publisher - and in IE, Notepad, OpenOffice 2.x, Firefox,  Thuderbird and a number of other applications if you properly install the Uniscribe (usp10.dll) that comes with the most recent service pack for Office 2003 in  \Windows\System32\ directory.</p>
      <p>The main drawback in Word was that Tibetan line wrapping was not implemented. This meant that you sometimes had to insert manual line breaks in order to get lines of Tibetan text to wrap at the proper place. I expect this has been properly implemented in Word 2007. </p>
      <p>Tibetan line wrapping and even Tibetan collation (sorting) work fine in OpenOffice 2.x</p>
      <p>On Windows XP I have very successfully entered and formatted several large volumes of pecha (traditionally formatted Tibetan books) using both Word 2003 and OpenOffice with Unicode Tibetan and OpenType fonts.</p>
      <p>On Linux operating system Pango (used by GTK) and ICU have partial support for OpenType Tibetan script fonts. The main thing missing is proper support for ccmp feature. Lack of support for this feature causes  problems if characters U+0F73, U+0F76, U+0F77, U+0F78, U+0F79, and U+0F81 are encountered as these need decomposing before any other OpenType lookups are applied. Lack of support for ccmp may also cause problems with characters U+0F43, U+0F4D, U+0F52, U+0F57, U+0F5C, U+0F69, U+0F93, U+0F9D, U+0FA2, U+0FA7, U+0FAC, and U+0FB9 as most    OT Tibetan fonts either decompose or compose these in a lookup under ccmp in order to simplify later lookups.</p>
      <p>(Without support for ccmp but support for the rest of the features everyday Tibetan and Dzongkha renders OK since all of the above characters are not normally found in common everyday words. These characters are mostly used in Tibetan transliteration of Sanskrit words.)</p>
      <p>There *are* standard keyboard layouts for Tibetan script. One is the layout approved by the Government of Bhutan. A example of this layout can be found at:   <a href="http://www.thdl.org/tools/dzkeylayout.html" title="http://www.thdl.org/tools/dzkeylayout.html">http://www.thdl.org/tools/dzkeylayout.html</a>. This layout is implemented in XFree86 and can easily be implemented in Windows using MSKLC.</p>
      <p>I understand Windows Vista also comes with a Tibetan keyboard layout approved by the Chinese Government.</p>
      <p>- Chris </p>
      <p>            </p><div class="imageWrap"><img src="http://typophile.com/files/OO-pecha_5995.jpg"></div><p></p>
