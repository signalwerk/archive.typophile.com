      <p>Si, </p>
      <p>this is why I prefer to say that an application supports the Unicode character set, rather than saying it supports “Unicode”. The latter is an ambiguous expression, people may read different things under that label. </p>
      <p>An even more difficult question is when it comes to “OpenType support”. Being able to render fonts in both OpenType flavors at all, being able to enter and display the full encoded character sets, or the full glyph repertoires in OpenType fonts, supporting some or all advanced typographic layout features for some or all scripts and languages, supporting the layout features necessary to correctly render some languages including directional support, supporting different GSUB and GPOS lookup types -- all this are different “shades” of possible OpenType support. </p>
      <p>Unfortunately, the makers of the OpenType font format do not seem to be interested in documenting this publicly, which leaves us with obviously incomplete resources maintained by interested 3rd parties, such as the <a href="http://www.myfonts.com/info/opentype/" rel="nofollow">MyFonts OpenType</a> page (authored by Laurence and myself) or the <a href="http://www.typotheque.com/fonts/opentype_feature_support/" rel="nofollow">Typotheque OpenType</a> created by Peter Biľak. </p>
      <p>Regards,<br>
      Adam</p>
