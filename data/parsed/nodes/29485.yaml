      <p>The main issue with typesetting a Tibetan font is that there does not exist a uniform keyboard layout (palette) that can be installed on your computer. I suggest that this should get the first priority in the digital development of typesetting Tibetan. </p>
      <p>Each Tibetan font uses their own methodology in mapping the Tibetan characters to the Latin ones on the keyboard (phonetically or QWERTY-method), and special software (such as Wylie) was developped to convert the transliterated text into Tibetan. This means that the user of this software (i.e. Wylie) first inputs the text in Latin characters. The whole text is afterwards converted in the Tibetan font, embedded in the software.</p>
      <p>The Tibetan Unicode chart only relates to the base characters, vowel signs, diacritical marks, some of the subscripted characters and punctuation signs (and a few unnecessary symbols).<br>
      However, the Tibetan conjuncts (the 'ligatures' that Alexander was referring to) do not have an indivual Unicode number (although some of the 'half forms' do). Each font developer has to use his/her own creativity in organizing these stackings of the Tibetan consonants to form the 'ligatures' within their fonts and the OpenType features provide reasonable solutions for achieving this. </p>
      <p>I have not yet studied Vista, nor Microsoft Himalaya, so I can not provide info on which keyboard layout or input system is used with this font.</p>
      <p>Alexander, I was wondering whether you created the OpenType features in Fontlab or in VOLT. When you import your .vfb file into VOLT, then all embedded OpenType features will be lost and you need to create them all over again in VOLT.</p>
