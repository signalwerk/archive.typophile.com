      <p>OpenOffice.org Writer works well for Tibetan script. </p>
      <ul>
      <li>Word-breaks / line wraps occur in the proper place - not in the middle of a syllable</li>
      <li>Lists of Dzongkha or Tibetan words can be sorted correctly (no mean feat as the collation rules for these languages are exeedingly complex)</li>
      <li>Switching between Tibetan script and Roman fonts is automatic - depending on characters typed.</li>
      <li>Tibetan digits can be used in calculations, page numbering, numbered lists &amp; headings, dates, etc.</li>
      </ul>
      <p>None of these things worked in Office 2003 - though I'm told they  are fixed in Office 2007  </p>
