      <p><em>The order in which they’re applied is set by the order of the lookups, not the feature set.</em></p>
      <p>That was the origial intention of OpenType, but complex script handling led Microsoft to modify its approach and the Uniscribe script engines apply certain features in a fixed order, regardless of the lookup order in the font. So far as I know, the first two features to be applied for any script are 'locl' and 'ccmp'; after that, the order is determined by the layout needs of the script.</p>
