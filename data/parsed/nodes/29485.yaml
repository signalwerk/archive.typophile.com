      <p>&gt; InDesign is fully Unicode compliant</p>
      <p>Miguel, </p>
      <p>I think this is a statement that is a bit overly optimistic, or at least imprecise. InDesign supports the Unicode character repertoire but there are many aspects of the Unicode Standard that InDesign does not entirely support, for example the bidi algorithm (UAX #9), the normalization forms (UAX #15) or some aspects of the case conversion. While InDesign is an excellent product, I do hope that its Unicode support will continue to improve. </p>
      <p>A.</p>
