      <p>Jo</p>
      <p>You can create all OT features needed for Tibetan in VOLT. Fontlab currently does not support creation of one to many lookups (decomposition) required under ccmp feature necessary to handle characters U+0F73, U+0F76, U+0F77, U+0F78, U+0F79, and U+0F81. </p>
      <p>Unlike with previous <em>"un-intelligent"</em> Tibetan fonts with non-standard glyph based encodings which did require <em>"smart"</em> input methods designed to work with particular fonts - a keyboard or input method for Unicode Tibetan only has to generate the simple base Unicode Tibetan characters as the complex conjuncts or ligatures are formed by the OpenType rendering engine applying the OpenType lookups in the font to get from the underlying simple basic characters to the conjunct glyphs. In other words, since the <em>"smarts"</em> are now built into the font (giving the type designer far more flexibility) they are no longer required in the input method. </p>
      <p>If you want to use a Wylie (transliterated Tibetan) input method to enter Unicode Tibetan in Windows see: <a href="http://www.thdl.org/tools/tise.html" rel="nofollow">TISE: Tibetan Wylie Input Utility</a> - also available at: <a href="http://byak.sinp.msu.ru/tise/" title="http://byak.sinp.msu.ru/tise/">http://byak.sinp.msu.ru/tise/</a>. This type of input method does still require some built in <em>"smarts"</em> - since you are going from one script to another and there is not a straightforward one-to-one relationship between the characters typed and the Unicode Tibetan characters that need to be generated.</p>
      <p>An example of a simple one-to-one keyboard for Tibetan script is the  <a href="http://www.thdl.org/tools/dzkeylayout.html" rel="nofollow">Dzongkha Keyboard </a> layout.  </p>
      <p>Any properly made OpenType font for Tibetan script should work fine to render Unicode Tibetan text entered using either of these input methods.   </p>
      <p>- Chris</p>
