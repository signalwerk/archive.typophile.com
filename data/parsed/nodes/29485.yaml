      <p>BTW, a Microsoft veteran Raymond Chen wrote an excellent posting about the ambiguity of the word “support”: </p>
      <p><a href="http://blogs.msdn.com/oldnewthing/archive/2005/11/18/494442.aspx" rel="nofollow">http://blogs.msdn.com/oldnewthing/archive/2005/11/18/494442.aspx</a></p>
      <p>My favorite incarnation of the blurry meaning of the word “support” in the OpenType domain is the quotation from the OpenType specification: <a href="http://www.microsoft.com/OpenType/OTSpec/kern.htm" rel="nofollow">“OpenType™ fonts containing CFF outlines are not supported by the ‘kern’ table”</a>. It is a liguistic equivalent to the acrobatic splits, trying to say that while the makers of the OpenType specification do not “like” people putting the “kern” table into fonts that use CFF outlines, there is really no penalty for including that table anyway. </p>
      <p>Adam</p>
