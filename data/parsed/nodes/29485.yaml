      <p>Alexander,<br>
      Here are a couple of resources that might be useful.<br>
      <a href="http://www.xenotypetech.com/" title="http://www.xenotypetech.com/">http://www.xenotypetech.com/</a><br>
      <a href="http://www.thdl.org/" title="http://www.thdl.org/">http://www.thdl.org/</a></p>
      <p>Simon,<br>
      &gt; <em>I suppose you need this hack for InDesign</em></p>
      <p>Don't know what makes you believe that, but I'm glad to say your supposition is far from the truth. InDesign is fully Unicode compliant, so there's no reason for hacks. It's true that its text engine might not have all the shaping rules necessary for Tibetan (does Uniscribe?), but having a Unicode encoded Tibetan font and a proper keyboard layout, is all you need to do some Tibetan typesetting in InDesign.</p>
