      <p>You can use ccmp - though its generally cleaner to use all three substitution lookups:  ccmp, blws, abvs - and maybe calt if you need to substitute contextual forms.</p>
      <p>mark/mkmk will not be applied to Tibetan text by most OpenType shaping engines. Generally only a specific sub-set of OpenType features is applied for each particular script. </p>
