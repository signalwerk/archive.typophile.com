      <p>&gt; <em>What exactly “Unicode compliance” is in your understanding?</em></p>
      <p>It can mean a lot of things. In this case I was alluding to the fact that InDesign is aware of all the necessary Unicode codepoints. This means that the font can use the codepoints that Unicode defined for Tibetan. There's no need for hacking it to use the first 256 codepoints that are assigned to Latin. People had to do that in the pre-Unicode era.</p>
      <p>&gt; <em>It is not the same as OpenType compliance</em></p>
      <p>Yes, I know that. I didn't mention OpenType, you did.</p>
      <p>&gt; <em>, if people need hacks like that.</em></p>
      <p>Alexander never explicitly said that he's hacking his font to overcome an InDesign flaw. And what I said in my previous post was that, if he definitely needs to hack his font, that shouldn't be because of InDesign (since InDesign can perfectly use a properly encoded Tibetan font).</p>
      <p>&gt; <em>I just do not know, do you execute OpenType features for Tibetan characters with Tibetan script tag?</em></p>
      <p>I don't think so. That's what I meant when I said <em>"It’s true that its text engine might not have all the shaping rules necessary for Tibetan"</em></p>
      <p>Sergey, have you tried to use InDesign? If so, which version?</p>
