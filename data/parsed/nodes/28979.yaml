      <p>I don’t think that website is the same Team 77. His “Team 77” was a group of Basil students who designed the first  Oblique typefaces for the ITC Avant Garde Gothic family. They did this in 1977. Hence the name…</p>
      <p>Its just like Egyptian 505, which was designed by his class at the Basel School in… Room 505!</p>
      <p>Maybe you can try the Basel telephone book (online?), and write him a letter? Alternatively, you could try to get in touch with Hannes Famira, who seems to have moved to Brooklyn from Basel. He was teaching in Basel for a few year recently ( Oblique typeface). Maybe all all Basel lettering people know each other.</p>
