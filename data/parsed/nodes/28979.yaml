    <p>Does anybody know how to get in contact with André Gürtler? He wrote ’Experiments With Letterform and Calligraphy’ and designed Egyptian 505, Basilia, and other things as well.</p>
    <p> I found reference to his working with Team 77. Is this the same place? <a href="http://www.team77.de" title="http://www.team77.de">http://www.team77.de</a></p>
    <p>Here is more info:</p>
    <p><a href="http://www.linotype.com/411/andreguertler.html?PHPSESSID=239a012999ab33a5442b08ff93318cff" title="http://www.linotype.com/411/andreguertler.html?PHPSESSID=239a012999ab33a5442b08ff93318cff">http://www.linotype.com/411/andreguertler.html?PHPSESSID=239a012999ab33a...</a></p>
