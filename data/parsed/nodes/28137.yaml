  html: |-
    <p>Hi<br>
    i asked here few times in the past about<br>
    city /arch’ typographic relation projects.</p>
    <p>well its been done(few months ago), and i graduate from a design school<br>
    and this is my final project.</p>
    <p>its mostly visual, and the texts that are in hebrew are some<br>
    article related(but they not the main issue.</p>
    <p>the project is based on the relation between city and text<br>
    on its visual and content,the way we read and scan textual information<br>
    to the way we use the city,it got some levels of resulotion<br>
    and in a line ill sum it:we read a content and live the content.<br>
    its not the best presentation but its the general idea.</p>
    <p>the final product is a 120 pages hardcover book that describe<br>
    this textual journey|i called it “reading space,a textual journey in the city”<br>
    if you find it intresting ive upload <a href="http://www.yousendit.com/transfer.php?action=download&amp;ufid=379BD123006967E5">a 20mb pdf</a> that contain all the book spreads.<br>
    (it look better in the book)and it would be nice to hear opinions.</p>
    <p>have fun</p>
