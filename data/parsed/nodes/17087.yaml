      <p><em>Let’s just hope it’s the passengers who are impaired in this scenario.</em></p>
      <p>My point being that standards are followed <em>blindly</em> even when they make no sense. If the standard says that elevators should have a voice prompt, that is implemented even when it is absurd, eg in a parking garage where the visually impaired would never be in an elevator by themselves.</p>
      <p><em>“Looks better” is so subjective.</em></p>
      <p>No more so than "reads better".<br>
      It all depends on who's doing the reading.<br>
      Type spec'd for the visually impaired will read worse for the normally-sighted.</p>
