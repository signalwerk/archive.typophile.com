      <p>A few years ago, they added a second set of elevator buttons at about 2 and a half feet off the floor in each elevator in our building. This was so that people in wheel chairs could read and press the buttons more easily.  A few years later, the removed the higher set of buttons meant for everyone else in the human race. (I assume there must have either been a cost or malfunction issue with having 2 sets). I have 2 bad knees which makes bending painful for me so now I can't see the buttons down there at thigh level. I am only 62 but there are plenty more folks older than I am who have even more trouble with the subterranean buttons. I wonder what blind people do trying to figure out where the bloody buttons are?<br>
      My point is, there are ADA laws requiring button placement for the wheelchair population but none for the so called "normal" user.  Since you can't get sued or fined for taking the needs of the majority population to heart, they are just ignored.<br>
      I am very much in favor of access for the handicapped but I am also in favor of access for everyone else too! Somewhere trained professionals need to be allowed to figure out the best way to deal with all of this because the politicians sure will screw it up if left to their own devices.</p>
      <p>ChrisL</p>
