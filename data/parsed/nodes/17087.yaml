      <p>These would be the same people who put recorded voices in the elevators (lifts) of parking garages, to let visually impaired drivers know which floor they're on. Who are now proposing the visual equivalent of everybody being shouted at all the time, for the benefit of an impaired minority.</p>
      <p>But seriously, I think that this problem is being tackled the wrong way.<br>
      Rather than have bureaucratically-imposed physical standards, there should be a professional standard requiring licensed environmental designers. That would give some professional respect, and leeway for intelligent interpretation, with the onus on the professional licensing body to maintain standards, not a government bureaucracy.</p>
      <p>And it would mean that the professional would have to study and understand the issue in depth, rather than just follow ugly guidelines verbatim.</p>
