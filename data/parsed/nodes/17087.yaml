    <p>Hi - I'm designing a signage system using ITC Officina Serif Bold. At large point sizes I always like to pull the tracking in as it looks much tighter (at least on headlines in print publications).</p>
    <p>However - in the UK - all signage needs to be brought in line with new legislation that makes environmental design more accessible for the visually impaired. This means that the recommendation from the relevant bodies is to increase line spacing and tracking where possible. I have seen many signage systems that don't conform to this, which in my view look better (but then I'm not visually impaired).</p>
    <p>I'd be grateful to hear anyone's thoughts on the matter.</p>
  html_clean: |-
