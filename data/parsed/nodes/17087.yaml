      <p>Hello there,</p>
      <p>which legislation is this? I'm curious because I'm also working on a signage project in the uk.</p>
      <p>I'd say it's difficult to have hard and fast rules, particularly about spacing. They never quite meet the case at hand. Every design problem needs to be thought through proplerly on a case by case basis. For example, the size of a lot of the signs I work on is dictated by the height of the ceiling (signs can't hang too low). This puts a limit on vertical (line) spacing. This in turn effects word- and letterspacing. At the same time, the type has to be a certain size to be read from (and be credible from) a certain distance. The overall effect of large, tight(ish) text is that the typography is quite dense, but because of limits imposed by architecture rather than typography. </p>
      <p>So, I suppose I'm saying, look at the limits imposed by the job itself first, before trying to deal with more (usually quite arbitrary) externally imposed limits.</p>
      <p>Some practical thoughts: is your signage illuminated? Is it dark text on light, or light on dark? How much space do you have?</p>
