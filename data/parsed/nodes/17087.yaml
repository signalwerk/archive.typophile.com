      <p>You should make your signs at the size they will be used. Create different versions with different letterspacing options. Put them on a wall and walk back and take a look. All design should be evaluated in its proper context. Making a decision on some assumption will most likely be the wrong decision. </p>
      <p>Most regulations cover letter height and stroke width but rarely consider letterspace. When we were doing the Clearview research, we were amazed how much letterspacing mattered.</p>
