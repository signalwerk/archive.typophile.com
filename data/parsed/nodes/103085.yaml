    <p>I'm trying to find out what the name of this font is, but it is eluding me. There are many inline serif's I've found, but none where the serif is so long or quite as vertical on the E, also many of the ones I located had a hollow stroke on the right side of the A where this one does not.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/bake_5702.jpg"></div><p></p>
    <p>Help me out guys! Please!</p>
