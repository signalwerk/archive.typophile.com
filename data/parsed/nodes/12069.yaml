    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Designers" class="freelinking" rel="nofollow">Designers</a> : Jared Benson</strong></p>
    <p>Best known for his involvement with Typophile, Jared Benson is an interface designer with an insatiable typographic addiction. He launched <a href="/wiki/Typophile" class="freelinking" rel="nofollow">Typophile</a> on his birthday in April 2000 in hopes of creating a venue where designers could get together to share knowledge and critique one another's work. Jared originally vetted the idea for Typophile with <a href="/wiki/Jonathan%20Hoefler" class="freelinking" rel="nofollow">Jonathan Hoefler</a> while interning at <a href="/wiki/The%20Hoefler%20Type%20Foundry" class="freelinking" rel="nofollow">The Hoefler Type Foundry</a> in summer of 1999, and later launched it as a component of his BFA thesis.</p>
    <p>When he's not spending every waking moment working on Typophile, he's acting as Executive Creative Director at San Francisco interface design firm <a href="/wiki/Punchcut" class="freelinking" rel="nofollow">Punchcut</a>. From 2004-2010, he served as a member of the <a href="/wiki/FontFont%20TypeBoard" class="freelinking" rel="nofollow">FontFont TypeBoard</a>.</p>
    <p>Jared has designed a number of typefaces, however none have yet made their way to the retail market. His bitmap fonts can be found scattered throughout the Typophile Critique boards. </p>
    <p>His bitmap font, QC Sans, is bundled with the Qualcomm developer SDK and is becoming a popular choice on many mobile carrier's handsets. QC Sans was developed in collaboration with <a href="/wiki/Christian%20Robertson" class="freelinking" rel="nofollow">Christian Robertson</a>.</p>
    <p>Jared has a BFA in Graphic Design from Brigham Young University.</p>
