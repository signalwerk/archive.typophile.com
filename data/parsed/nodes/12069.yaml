    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/17745" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Designers</a>&nbsp;: Jared&nbsp;Benson</strong></p>
    <p>Best known for his involvement with Typophile, Jared Benson is an interface designer with an insatiable typographic addiction. He launched <a href="/node/12022" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Typophile</a> on his birthday in April 2000 in hopes of creating a venue where designers could get together to share knowledge and critique one another’s work. Jared originally vetted the idea for Typophile with <a href="/node/12061" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Jonathan Hoefler</a> while interning at <a href="/node/add/wiki?edit%5Btitle%5D=The%20Hoefler%20Type%20Foundry" title="Create node &quot;The Hoefler Type Foundry&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">The Hoefler Type Foundry</a> in summer of 1999, and later launched it as a component of his <span class="caps">BFA</span>&nbsp;thesis.</p>
    <p>When he’s not spending every waking moment working on Typophile, he’s acting as Executive Creative Director at San Francisco interface design firm <a href="/node/12021" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Punchcut</a>. From 2004-2010, he served as a member of the <a href="/node/13610" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">FontFont TypeBoard</a>.</p>
    <p>Jared has designed a number of typefaces, however none have yet made their way to the retail market. His bitmap fonts can be found scattered throughout the Typophile Critique&nbsp;boards. </p>
    <p>His bitmap font, <span class="caps">QC</span> Sans, is bundled with the Qualcomm developer <span class="caps">SDK</span> and is becoming a popular choice on many mobile carrier’s handsets. <span class="caps">QC</span> Sans was developed in collaboration with <a href="/node/12008" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Christian Robertson</a>.</p>
    <p>Jared has a <span class="caps">BFA</span> in Graphic Design from Brigham Young&nbsp;University.</p>
