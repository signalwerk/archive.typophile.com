  html: |-
    <p>Hello All,</p>
    <p>I recently compiled a small collection of text morsels which resonated with me over the years. They are largely focused on design, art, philosophy and architecture.</p>
    <p>I used a modest grid to establish a versatile visual system complemented by a sparse aesthetic approach - I'm curious what you (my peers) think about the implementation of the UX along with your appetite for the subject matter I chose to run with.</p>
    <p>Any feedback is appreciated.</p>
    <p><a href="http://inspire.boranikolic.com/" title="http://inspire.boranikolic.com/">http://inspire.boranikolic.com/</a></p>
    <p>Thanks,<br>
    Bora</p>
