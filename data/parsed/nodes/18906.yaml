    html: |-
      <p>Well I am no professional, but I would like to say something. Gradients are useful but they can get out of control very fast. I like using very subtle gradients to break up a flat color. Dropshodows are useful only in motion-based work, no-where else.</p>
      <p>I understand that you DON’T want a great contrast between the background and text, but there are so many more “professional” ways to approach that than this.</p>
      <p>Hope that helps.</p>
