    <p>I have never had the benefit of comments from professional graphic designers, so I was hoping if someone could comment.</p>
    <p>Almost everything I do is only for web, so screen resolution factors in. And size.<br>
    Usually I try and keep the image’s longest side 500 pixels or less.</p>
    <p>The following two samples are the same except for slight dropshadow. What I wonder is if the average persons screen with still have good legiblity without the shadow.</p><div class="imageWrap"><img src="files/nondrop.jpg"></div><div class="imageWrap"><img src="files/drop.jpg"></div><p></p>
