    html: |-
      <p><em>If I understand what you mean, then the problem I see is that there would be a part in the middle where there was no contrast at all.</em><br>
      Yes, but worth investigating (in my opinion) all the same, you can also look at slightly rotating or stretching the background to avoid that. Have fun experimenting, reject any that you feel don’t work keep the others (as a file or just at the back of your mind) to use in other circumstances that might suit. Part of the skill of designing is to know when to reject an idea.<br>
      For example that shadows only effect on white can produce a blind embossed look where budgets or circumstances don’t permit.<br>
      Tim</p>
