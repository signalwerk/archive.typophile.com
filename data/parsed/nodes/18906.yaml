      <p>I am gonna disagree on you there Chris. And the word “elements” is very vague. There are so many other ways to create seperation other than drop shadows. The idea of drop shadows is to create depth anyway, which is sometimes useful in highly-dynamic motion graphics…. keyword being “motion.”</p>
