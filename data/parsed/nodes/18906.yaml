    html: <p>Well Prakash, you said they’re useful in motion work and nowhere else. That’s a pretty narrow point of view. I can definitely agree that drop shadows are overused. Photoshop filters can be used for evil or good :) But if used subtely, they can create seperation between type and a background. I’ve done drop shadows where you couldn’t even tell they were there, but when they were removed it was obvious that they helped. If you don’t need ‘em don’t use ‘em. That’s my 2 cents…</p>
