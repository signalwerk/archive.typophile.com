    <p>Hi everyone,<br>
    I'm doing a rebranding project right now, and I'm trying out some typeface combinations. The company is within womens fashion FYI, and their existing CVI only makes use of a Bodoni as it is now (both for their logo and all type applied in brochures etc.)</p>
    <p>Much appreciated if you have any feedback on what combinations you prefer.</p>
    <p>Regards in advance</p>
