      <p>Ok, the combinations are (from top to bottom, and starting with the headline, then emphasized text and then body):</p>
      <p>1. LT Helvetica Neue Bold combined with AG Souvenir</p>
      <p>2. Leitura Display combined with LT Helvetica Neue Bold/Light</p>
      <p>3. Leitura Display combined with Leitura Sans Grot 1/Grot 3</p>
      <p>4. Leitura Display combined with LT Helvetica Neue Bold and AG Souvenir</p>
      <p>5. Leitura Display combined with HJF Gotham Bold/Light</p>
