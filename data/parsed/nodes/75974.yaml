  html: |-
    <p>Here's a group of fonts I'm working on.<br>
    They're all based on Titillium, which is distributed<br>
    under the SIL Open Font License, version 1.1.</p>
    <p>Slanted Titillium to get the Titillioblique fonts.<br>
    Added some more interesting characters to make<br>
    a family called Titillitalic.<br>
    Added even more interesting, bendy characters<br>
    to make it into something called Elbonium-Italic.<br>
    Then slanted that back upright to make the Regular<br>
    Ebonium fonts.</p>
    <p>Hope these pics show up okay...</p>
    <p>-chank</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Titillium_DerivedVersions_1110_6482.jpg"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/Elbonium_fontlog_pic2_3989.gif"></div><p></p>
