    <p>This is the little brother of the Gotika thread. I am searching for anyone who:</p>
    <p>1/  Has a contact at Neufville,  or knows of someone who does.</p>
    <p>or</p>
    <p>2/ Lives in Spain.</p>
    <p>I am currently digitizing the Imre Reiner face Gotika, and am searching for any kind of printed specimen. Preferably an original, but would settle with hi-res scans (300+). I've already made attempts to contact them, with no luck. If you qualify for either one, I would be interested in enlisting your assistance. Gratefully and humbly.</p>
    <p>Eric</p>
