      <p>It is quite rare for a font house (especially an old-school one like Neufville) to pick up an unsolicited design, even if it's free - the main reasons being quality and suitability. The one case like this I remember is that guy who made a DIN clone, not knowing the issues (although DIN is admittedly a "public" design) and when he tried to sell it or something the FontFont people graciously paid him to take it completely over... and didn't even use it.</p>
      <p>In Eric's case: he's a self-confessed beginner*, he knows the issues, and hasn't even fleshed out the whole design yet*, so here's what I would suggest: contact Neufville (maybe even arrange for a telephone call) and tell them there's a design you really really like, and you've sort of started on it, but realize they own it; you want to keep working on it, and see it released somehow; you offer to submit it to them when it's pretty much finished; they don't have to pay anything, and they can accept it or not, but what would be really nice is if they critiqued the work in progress so that it ends up to their liking and they'll sell it. If they say no, you stop (and maybe make something inspired by it). If they say yes, you work hard, and listen to them. The risk is that they'll say no at the end and you'll end up with a design that's dead in the water. But at least you would have learned a lot.</p>
      <p>* Correct?</p>
      <p>hhp</p>
