      <p><em>&gt;Maybe I’m just being a big chicken.</em></p>
      <p>Yeah, you are being a big chicken ;-)</p>
      <p>Now cut it out! Make sure you get the whole international dialing code thing right. It should be in the front of your phone book. Then, after they pick up the phon, say Buenos Dias, and then ask politely if they speak English. I'm sure that they get English-speaking calls all the time. English is the language of European business now, with the EU and all. How many Swedes speak Spanish? Exactly. Nothing to be afraid about.</p>
      <p>Then tell the person on the phone that you are type designer calling from the United States. You'd like to speak with someone to get some information on old German Bauer tyapefaces. I'm sure that they will connect you to the correct person, or ask you to call back later.</p>
      <p>Then it is up to you. It isn't that hard, really.</p>
      <p>I used to get the fear of God in me when I had to call up German institutions for the first time, and speak in horrendous German (while English is the international language of business, it is not the international language of bureacracy. Bureacrats must always be spoken to in their native language, if possible). But it always worked, and I soon got over it. Now I live in the midst of these crazy people. No one will hate you because you are from the midwest.</p>
