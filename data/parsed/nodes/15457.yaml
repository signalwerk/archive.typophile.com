      <p>Hrant, Gerald,</p>
      <p>This isn't quite accurate. Occasionally, designers will revive an un-revived typeface that a certain foundry has the rights to. After that designer shows the fonts to the foundry, the foundry will—on some occasions—license them and distribute them itself. This is what Eric is hoping for, I think.</p>
      <p>It is quite costly for a foundry to revive a face like this on its own. (The money for Blackletter just isn't there…) But if a designer does it for them, it costs them nothing. It is a win-win situation, and I know designers who have gone through this before. So please don't say never, or assume the worst. Eric's intentions here are admirable, and this is the right path to take. If Neufville is not interested in the design, Eric may be able to release it through other channels under a different name—perhaps even with Neufville's blessing. </p>
      <p>Discussion is always good.</p>
    html_clean: |-
