      <p>Eric, most people in the font biz, especially old-schoolers, will appreciate a phone call very much. English will most probably be fine. If not, say "pwehdoh ablar con el heffeh por fahvor?" ("Could I please speak with the boss?" - he knows English, I've had lunch with him :-). You might add "Estoy yamandoh desde los estados ouneedos." ("I'm calling from the US." - to put some pressure). If you're still faced with Spanish, it probably means the guy is out* - try again later (after saying "moutchas grahsias" - "thank you very much"). Oh, do get the time-zones right. And remember that in Spain they start the day late and finish it later, and take a HUGE lunch break, starting around 1PM in Barcelona.</p>
      <p>* Just like that great Don Qixote song!</p>
      <p>One last thing: don't just dial it.<br>
      Get one of those calling cards - much cheaper.</p>
      <p>hhp</p>
