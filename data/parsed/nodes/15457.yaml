      <p>And have the guy hang up on him for saying "peweedoo hablar con el djefe por fayvor?"?! When I first started practicing my Castillian in Barcelona, the slightest flaw in my accept would throw a wrench in the attempt, especially with older folk. I've noticed that when a person has only heard a clean version of a single language all his life, he has a lot of trouble with deviation. You should have seen some people struggle with my "azucar" and "servilletas" - it was quite annoying.</p>
      <p>hhp</p>
