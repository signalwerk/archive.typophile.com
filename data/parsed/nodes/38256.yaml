      <p>Thanks, John.</p>
      <p>I actually agree it should be a macron below, except for the small problem that some Comanche's apparently don't agree. In the past, I have found myself arguing with the Navajo that their early rendition using a "reversed cedilla" was wrong for the nasalized vowels, and with the Cherokee that Plantagenet Cherokee served them better than the official Cherokee, when mixed with a particular Latin font. </p>
      <p>As you can imagine, neither of these is a comfortable place for a Norwegian-American to find himself.</p>
