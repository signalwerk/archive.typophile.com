    <p>We have to set some Comanche.</p>
    <p>The editor of the volume feels that a macron below (U+0331) is a better way to represent the unvoiced vowels than using an underline below (U+0332). There is an amazing amount of experience on this forum though, and if anyone has special knowledge of the correct orthography, I'd be willing to argue with the editor (I've already checked out the usual sites, Wikipedia, Omniglot, etc.).</p>
    <p>TIA,</p>
    <p>Charles</p>
