    html: |-
      <p>Thanks, Ross, I will pass this thread on to the editor.</p>
      <p>As a typesetter, I don't face the problems a font designer does. However the MS comes in, we'll change the character to uniXXXX0332, and I will make up precomposed glyphs for the print edition. Following your suggestion, I suppose the underline should be optically the same width as the character, with a contextual alternate feature for successive underlined vowels, so in those cases, the underlines would overlap. I'll take a look at the MS &amp; see just how many of those we encounter.</p>
      <p>In passing --</p>
      <p>The Navajo with the reversed cedilla was a font prepared by the Navajo Schools, available for a while (long ago) on the SIL site. As I remember, it was one of the Times Romans, and an ogonek was available in Times. I believe that font has now been withdrawn, or replaced with one using the ogonek.</p>
      <p>As I'm sure you know, there can be competing orthographies. Ella Deloria's rendering of Lakota is quite different than the Buchtel (sp) system -- and far harder to typeset, though probably easier to mark with a pencil. And while many orthographies use the raised comma (aka "apostrophe", "single close quote", "quoteright") to signal a glottal stop, Polynesian uses a turned comma (aka "single open quote", "quoteleft") for that purpose. At some significant level, what is right is a matter of convention, not a pre-established system.</p>
      <p>Thanks again,</p>
      <p>Charles</p>
