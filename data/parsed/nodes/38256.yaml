      <p>Well, you could argue for either. Typographically, you may want to use the macron beneath an 'i' or an 'I' and the low line beneath wider glyphs. Semantically (in terms of text encoding), one or the other should be used. So, what is the expected form? Generally, I would say it is the wider, or underline, form. The combining lowline is encoded as the combining form of the underscore, and theoretically should join on the left- and right-hand sides if in sequence (which, by logical extension would mean that the combining low line needs to be a bit wider then any glyph it is to sit under). One could say then it is not a diacritic, but that would be wrong, because it has effectively been used as such. The orthographies of Comanche or Pawnee use(d) an underscore to mark short or voiceless vowels and a barred u for a rounded high central vowel.</p>
      <p>Ideally, the underline width should optically match the glyph it is sitting under in terms of width. In producing fonts, I am mapping both combining marks to pre-composed glyphs for composition/decomposition because these are fairly ambiguous marks and if someone is making a keyboard that uses them, they may use either 0331 or 0332 (there is no codepoint for the pre-composed glyphs for the bar/line below characters although there is for the barred-u). In reality, such niceties have not seen much use due to technological barriers; rather the characters are represented most often as underlined and struck-though in case of the barred-u.</p>
      <p>There is much in some of the more isolated languages and orthographies that can be viewed as typographic aberration. This has to be tempered with users' expectations and is an interesting subject. Were the Navajo you mention actually using a backward cedilla instead of the proper ogonek? It wouldn't surprise me, as many fonts come with a cedilla, but not so many with an ogonek (or a+ogonek with acute, or epsilon with ogonek etc. etc.). Native languages may possess an orthography, but haven't been graced with typographic sensibilities—either in available typefaces or in the production of documents in terms of necessary technological requirements for handling such orthographies. This can lead to a degradation of quality of the typographic presentation of these languages, which in turn becomes the norm, which in turn may become a user expectation. Sometimes this takes the form of the perceived value in that which is degraded, or mutilated.</p>
      <p>I wouldn't classify the use of an underline as such an typographic aberration (I'm not willing to argue the linguistic side, as I'm not a linguist) but rather the sort of adaptation that goes on all the time in establishing orthographies.</p>
      <p>-Ross</p>
