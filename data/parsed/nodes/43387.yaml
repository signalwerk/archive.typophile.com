    <p>hello everyone,<br>
    I read you for few times, i learned lot of interesting things here and this is my first post.</p>
    <p>I'am looking for some infos about unicase typography and at the beginning with the bauhaus and new typography concept of the lowercase use.<br>
    I learn that this bauhaus ideas comes from a book nammed "sprache und schrift" from 1920 by dr walter Porstmann, the guy who created the standard A4, A5 ... format of paper in the DIN organization.<br>
    I would know if a translation of this book is avaiable.<br>
    If you have any information or texts about this concept, would you post it to me? </p>
    <p>I am also interested in unicase experimentation and looking for info on this subject and also on the alphabet 26 concept by bradbury thompson.<br>
    The main problem for me is that the bradbury thompson book "The art of graphic design" is sold out and that the few used avaiable are too expensive for me. If you have this book, could you say me if bradbury thompson speak or not about his alphabet 26 concept in this book. If so, could you please send me scans images from the selected parts of this books.</p>
    <p>I will write a thesis about unicase typography and typographic (utopian or restrictive) experimentations; so all links, infos, texts, images are welcome.</p>
    <p>Sorry for my english, i am a french graphic design student. If i'm not clear, ask me more explanaition.<br>
    I hope for answers<br>
    thanks</p>
