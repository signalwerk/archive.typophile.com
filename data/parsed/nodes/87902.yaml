    <p>Hello all. I've been a lurker here for some time, but I am currently conducting some broad research around the area of board games and would be very grateful if some of you would take the time to fill in a brief (10 question) survey.</p>
    <p>The survey can be found at <a class="freelinking external" href="http://www.surveymonkey.com/s/DQT9VKW" rel="nofollow">http://www.surveymonkey.com/s/DQT9VKW</a></p>
    <p>I am looking at board games from the point of view of a graphic designer (currently a part-time MA student), and specifically, a typographer (albeit not a very accomplished one). However this survey is very much a general overview of the board game demographic and is not specifically concerned with graphical elements. My reason for posting here is that I would like to try and source information from people who are not necessarily primarily involved with or concerned by board games (unlike, for example, the community at boardgamegeek.com)</p>
    <p>I know the whole student-research issue has been a bone of contention around these forums before, but hopefully no-one will find anything to be offended by in this request.</p>
    <p>Thank you for your time.</p>
