  html: |-
    <p>Hello, I have been designing a logo/wordmark for my portfolio website and it's bloody hard to come up with something I like. I've finally settled on something and would like your opinion if that's alright. I'm no type designer/typographer but I do have a passion for it and always interested in learning more.</p>
    <p>I've gone for a superfat Bodoni here. I'm Italian and the name of the website is too. I just chose something shorter and easier to spell than my own name. It's two words really (from the film partly of the same name) but I've shoved them together.</p>
    <p>What I liked about the word I found so hard to design for is the continuity and symmetry of the letters u-o-n-o in a serifed italic. I morphed the Bodoni U and N into one character to fit this and turned it upside down. I also made a bit of a ligature out of the L and the B.</p>
    <p>It's not an important logo specifically it just needs to reside on my portfolio website and possible the business card if I decide to print one.</p><div class="imageWrap"><img src="http://typophile.com/files/ilb-1_4949.png"></div><p></p>
