    html: <p>It looks like a really nice logomark and has a nice rhythm to it. Without a comparison, I can't visualize the difference in what you did with the 'u' and 'n' but it works well. If I did anything to this myself I would just want to look at versions with a disconnect at the top of the 'lb' ligature as well just to see how it feels to let the eye not be blocked up top there which might create a bit more continuity to the overall undulation between all the characters, but that's just my subjective take on it all. Nice work.</p>
