    html: |-
      <p>By spacing I wonder if you mean tracking? (the field to the right of the kerning field in InDesign or Illustrator)</p>
      <p>Tracking is used for many letters at once (i.e. on whole words like to space up a title made of small caps) and kerning would be to correct the space between a specific pair of letters. At least that's what I do :-)</p>
      <p>Em</p>
