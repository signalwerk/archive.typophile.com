    html: <p>Well, it depends if you are talking about creating a font or using one.  Making a font, you can have specific kerning pairs that are exclusive to that pair of characters.  This is different than side bearings.  If you are setting type, you can kern individual letter pairs and not affect other instances of that letter pair.  In setting type you also can have control of tracking which changes the overall horizontal letter spacing of all the selected text.</p>
    html_clean: <p>Well, it depends if you are talking about creating a font or using one.  Making a font, you can have specific kerning pairs that are exclusive to that pair of characters.  This is different than side bearings.  If you are setting type, you can kern individual letter pairs and not affect other instances of that letter pair.  In setting type you also can have control of tracking which changes the overall horizontal letter spacing of all the selected text.</p>
