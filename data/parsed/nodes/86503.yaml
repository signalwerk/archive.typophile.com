    html: |-
      <p>You kern only letter combinations between which the standard spacing doesn't work well, due to the shapes of the letters.<br>
      So for example in most cases HH, HT, HA will be set by the spacing and not require kerning, but TA will require a modification to the spacing, namely, a kerning pair.</p>
