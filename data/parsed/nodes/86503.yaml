    <p>hey guys<br>
    i really want to know what's the difference between spacing and kerning.<br>
    i have gone through many links but i still have doubts.<br>
    i have deciphered the following from my studies.<br>
     spacing should be done before kerning<br>
    now here is my main doubt, we <em>kern</em> after we space and hence we are changing the spacing between letter. so wont the overall spacing change.?</p>
    <p>Can anyone point me to some resources where it's explained properly?</p>
    <p>Cheers<br>
    M</p>
