    html: |-
      <p><a class="freelinking external" href="http://ericbank.com/2011/02/introduction-kerning/" rel="nofollow">Here is a decent explanation for the user of digital type, with graphics.</a> </p>
      <p>In designing type, yes, kerning numbers only apply to the pairs you specify, whereas the side bearings apply everywhere. The kerning adds or subtracts from the side bearings of the pairs you specify. (Actually I think it's only one of the pair, but that doesn't matter.)</p>
      <p>The difference between spacing and kerning is not visual, but something the technology defines.</p>
