      <p>That's how it works, though, you need to judge how the media value news stories and tailor your marketing accordingly. The person who co-ordinated the diving operation was acting out of interest and curiosity, definitely, but it will also help his company sell more copies of the typeface I'm sure, whether through direct clickthroughs or through raising awareness of its existence.</p>
      <p>A lot of marketing works this way. The actual story sold to newspapers is rarely the "story" the marketers want out, which is inevitably "here's our new product, please buy it". (A press release written that way, unless the product is exceptionally innovative, will rarely result in more than specialist press coverage.) Instead, the story is modelled to the specifications the media wants, to maximise exposure, and the fallout from that (if correctly designed) will result in increased exposure for the client as well. New York Times writer Rob Walker calls this sort of strategy "murketing" – using indirect stories of no obvious connection a specific product to eventually sell it, being dark and murky about the actual marketing intentions. </p>
      <p>Here in Sweden, now-defunct PR agency Studio Total was infamous for this sort of thing. They'd even routinely create fake products and blogs and music releases and whatnot to build up momentum, only to eventually be revealed as something else entirely. I'm not saying font makers work this way, often the story is genuine, but their marketing efforts can work using the same underlying mechanism.</p>
    html_clean: |-
