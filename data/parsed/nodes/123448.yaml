      <p>The following deﬁnition was approved by the American Marketing Association Board of Directors:</p>
      <p>Marketing:<br>
      Marketing is the activity, set of institutions, and processes for creating, communicating, delivering, and exchanging offerings that have value for customers, clients, partners, and society at large.</p>
      <p>It’s about value, not income. Therefore bundling is marketing—as long as it’s not perceived as spamming (although that could be construed as negative value, which is still value). Certainly, Comic Sans has acquired enough value to be notorious.</p>
