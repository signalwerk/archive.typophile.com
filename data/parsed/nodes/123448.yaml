      <p>I would have interpreted the question as being "was there ever a <em>typeface</em> that was aggressively marketed"... and so the bundling of True Type fonts with either the Macintosh OS or with Microsoft Windows would not een have entered my mind.</p>
      <p>I certainly don't recall ever seeing TV commercials for Helvetica or Times Roman, and so I would say that the answer is "no".</p>
      <p>Even though one could consider bundling Arial as aggressively marketing the typeface as well as the font, and then there are all the Google fonts, or the Gandhi font family as another example.</p>
      <p>But a case where the general public has been approached with a view to making money off the typeface afterwards... I can't think of one.</p>
      <p>But then, I may not be recognizing all the possible forms that the marketing of a typeface might take. (I know I haven't seen ads for Perpetua in TIME or LIFE or Newsweek either... but I may be missing things far more subtle.)</p>
      <p>Since before the era of computers, ordinary people in their homes didn't have phototypesetters or even Selectric Composers, the idea of marketing a typeface to the general public, as I envisage it, would be to create a demand for published materials in that typeface, so as to encourage its sales to the usual suspects.</p>
      <p>But that leads to a different tangent: Prestige Elite and Courier are typefaces too, and IBM marketed its <em>typewriters</em> broadly enough at times that they could be said to be addressing the general public. Would that count?</p>
