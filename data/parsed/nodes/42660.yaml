    html: <p>Like minds.  I thought of a rotring when I saw this.  There was one in a weekly newspaper I worked for and I wish I had asked for it.  It had a raft of adjustments and could even do italics.  You used a relief template with the pointer and an engineering pen traced the letter with india ink.  Does the fact that so many suspected that was the source mean we’re all grey beards?</p>
