      <p>Charity? Just smart marketing. For 10 cents a pop this company gets a valid email and other information to target in future campaigns.</p>
      <p>You want to be charitable on account of X-mas? Invite a street person to dinner, or write a check for a real charity. Or go to the betterplace.org website and pledge real money.</p>
