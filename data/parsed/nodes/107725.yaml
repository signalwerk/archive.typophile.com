  html: |-
    <p>SoftMaker is currently running a charity campaign until Christmas Eve  (Load and Help 2013) - </p>
    <p>you can support it by downloading free software:</p>
    <p>-  either updated versions of SoftMaker FreeOffice (fast and compatible office suite for Windows or Linux)</p>
    <p>- or  a  type collection of 55 nice typefaces ("Elegant Holiday Fonts" for PC and Apple Mac)</p>
    <p>For every download, SoftMaker donates € 0.10 to charity projects via betterplace.org, a non-profit platform for aid projects around the world. </p>
    <p>I think it's a great idea. Spread the word!</p>
    <p><a href="http://www.loadandhelp.com" title="www.loadandhelp.com">www.loadandhelp.com</a></p>
