  html: |-
    <p>I’m exporting glyphs from CorelDraw, and importing them to Typetool 1.3. Any glyph with a counter gets cleaved down the middle into multiple adjacent shapes. How do I prevent this?</p>
    <p>EDIT: Found workaround, exporting inside and outside paths as separate files. Not that this interests anyone.</p>
