    <p>My dad's asked me to create a website for his law firm (only two lawyers), and the first thing they want to do is create a new logo. They don't currently have a "logo" per se, but simple text used on their letterheads. </p>
    <p>Here are a couple of the ideas I've been working on. I don't want to just have a plain text logo, so I tried my hand at an accompanying symbol/image. I couldn't come up with anything original that related to law/lawyers, only a gavel and the scales of justice images which are incredibly overused.</p>
    <p>Any ideas where I can go from here?</p>
    <p>Their areas are: divorce law, criminal defense, civil litigation and personal injury. The firm name is King &amp; Lloyd, P.A.</p>
    <p>I want the logo to be simple, clean and portray professionalism, trustworthiness, and success (?).</p>
