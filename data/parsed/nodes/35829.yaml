      <p>I rather like sample1; it's classy without being stereotypically stuffy. I like the contrast between the sans-serif text and the fancier ampersand, and I think the text meshes nicely with the colored blocks.</p>
      <p>However, the ampersand seems a bit off center to me... maybe you could move it to the right a bit? It feels like 'Lloyd' is all by itself there.</p>
      <p>Also, the small serif text on the bottom doesn't fit quite right to me. I think you should stay with a serif font, but that particular one seems a bit too plain perhaps.</p>
      <p>I hope that helps. Good luck!</p>
