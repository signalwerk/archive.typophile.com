      <p>Caslon Antique is a heavily used old 'veteran' . There are plenty of less frequently used distressed old typefaces. <a class="freelinking external" href="http://www.p22.com/sherwoodtype/index.html" rel="nofollow">Sherwood Types at P22</a> has a very nice collection of fonts based on old types that might give you a less familiar, but authentic look. You can also search on 'Antique' at sites that allow  keyword searches, and find some other ideas.</p>
      <p>- Mike Yanega</p>
