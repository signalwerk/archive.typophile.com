      <p>George Belwe is a possibility. But about all I can say at this point is that I see cira 1910 as the design date. If we knew who Carl Kuhn used as type supplier -- Bauer, Berthold etc. -- we might be able to track it down, through the Klingspor Museum online  publications or through specimen books.<br>
      Don</p>
