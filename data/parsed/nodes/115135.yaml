      <p>The quest to identify another example of Tiemann-Mediaeval in use is dealt with in <a href="http://typophile.com/node/82212">http://typophile.com/node/82212</a>. Note the reported satisfaction with the process of buying fonts from Gerhard Helzel.<br>
      Here is a sample text as shown at Mike Yanega's Bowfin Printworks <a href="http://bowfinprintworks.com/SerifGuide/sample.php?id=2&amp;sample=txt#">http://bowfinprintworks.com/SerifGuide/sample.php?id=2&amp;sample=txt#</a><br>
      Use the "Show Sample: ABC" to see the character set.<br>
      Don</p>
