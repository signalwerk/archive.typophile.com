    html: <p>You can examine Helzel’s freeware Koch-Fraktur and Mars-Fraktur in FontLab, and you’ll find the outlines are very high quality. Helzel has been at it for a long time; I think he even uses or used Ikarus. Today I suspect it’s FontLab or DTL FontMaster, the latter being a spiritual successor to Ikarus.</p>
