    <p></p><div class="imageWrap"><img src="http://typophile.com/files/BhBJR7dIcAAuEmP_5901.jpg-large.jpg"></div><p></p>
    <p>The letters “A” (double-sided serif o top), “g”, „ß“ and the and the steep serifs on „b, d, l, h“ are very special.<br>
    This Typeface was used by a Munich publisher called Carl Kuhn, from at least 1915 through at least 1937.</p>
    <p>Thank you for your help!</p>
