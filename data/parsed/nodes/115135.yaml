      <p>And a little icing for the cake. Tiemann-Mediaeval has been used by the German music publisher Edition Peters from 1917 or earlier until the present day:<br><img src="/sites/default/files/old-images/Peters8_5950.jpg"><br>
      Tradition! As well as a distinctive style.<br>
      Don</p>
