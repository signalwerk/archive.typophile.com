      <div class="comment-spam-body"><p>Brown was not available in 1964, but Brown Bold has many similar letters </p><div class="imageWrap"><img src="http://typophile.com/files/BrowneBoldAsCome_4242.gif"></div><div class="imageWrap"><img src="http://typophile.com/files/BrownBoldAsNew_3808.gif"></div> to the poster lettering.<br>
      The file info for Browne gives credit to Arno Drescher's Super Grotesk and Edward Johnston's Johnston.<br>
      It is plausible that these same sources were influences on the design of our mystery lettering of 1964.<br>
      Compare to Super Grotesk Med which was available in 1964 <div class="imageWrap"><img src="http://typophile.com/files/FFSuperGroteskMedAsCome_5081.gif"></div><div class="imageWrap"><img src="http://typophile.com/files/FFSuperGroteskMedAsNew_4213.gif"></div><br>
      and the condensed version of _C_ <div class="imageWrap"><img src="http://typophile.com/files/FFSuperGroteskCondMed_C_5752.gif"></div><br>
      which is now digitized by Font Font <a href="http://www.myfonts.com/fonts/fontfont/ff-supergrotesk/" title="http://www.myfonts.com/fonts/fontfont/ff-supergrotesk/">http://www.myfonts.com/fonts/fontfont/ff-supergrotesk/</a><br>
      Don<p></p>
      </div>
