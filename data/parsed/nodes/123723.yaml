    html: |-
      <p>Unfortunately, don't have the answer, was not even able to find this poster online (sure about its originality?).<br>
      Mainly because of single storey /a and cross-shaped /t, <a class="freelinking external" href="http://www.myfonts.com/search/ag+schoolbook" rel="nofollow">AG Schoolbook</a> comes to mind but that's far from it either. There's also <a class="freelinking external" href="http://www.myfonts.com/search/ag+old+face" rel="nofollow">AG Old Face</a> and <a class="freelinking external" href="http://www.myfonts.com/fonts/fontfont/ff-schulbuch" rel="nofollow">FF Schulbuch</a> but still not matching.<br>
      Reminds me a lot of <a class="freelinking external" href="http://typophile.com/node/95908" rel="nofollow">this previous discussion</a> about 2012 edition of Whitney Museum Membership Calendar font. It was identified as Mike Gallagher's <a class="freelinking external" href="http://mikegallagher.org/gross.html" rel="nofollow">Gross</a> which actually does not look like it at all... But the one from your sample and the one on Whitney Museum Membership Calendar looks pretty close, some kind of textbook/infant version of Akzidenz-Grotesk.<br>
      Some alternatives: <a class="freelinking external" href="http://www.myfonts.com/fonts/fontfont/mark" rel="nofollow">Mark</a> FF, <a class="freelinking external" href="http://lineto.com/The%20Fonts/Font%20Categories/Text%20Fonts/Brown" rel="nofollow">Brown</a>  and <a class="freelinking external" href="http://lineto.com/The+Fonts/Font+Categories/Text+Fonts/Circular" rel="nofollow">Circular</a> LL, <a class="freelinking external" href="http://www.myfonts.com/fonts/rene-bieder/galano-grotesque" rel="nofollow">Galano Grotesque</a> RB, <a class="freelinking external" href="http://www.myfonts.com/fonts/ondrej-kahanek/zirkel" rel="nofollow">Zirkel</a> OK, <a class="freelinking external" href="http://www.myfonts.com/search/nanami" rel="nofollow">Nanami</a></p>
