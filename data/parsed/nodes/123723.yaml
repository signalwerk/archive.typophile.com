    <p>This vintage World's Fair poster from 1964 was found in the gift shop of the Queens Museum. I found the choice of typeface to be quite interesting -- it seems to be an unusual marriage of Futura and Akzidenz-Grotesk. Any ideas?</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/wf-1_5106.jpg"></div><p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/wf-2_6122.jpg"></div><p></p>
