    <p>Hi there, I'm new, so if I screw this up I apologize. </p>
    <p>I'm looking for a font that's been used a little obscurely. It's like a sans or slab serif with slanted Ms Ws As Ys. </p>
    <p>It's a very retro 1970s and 1980s font. It was used in the title of the </p>
    <p><a href="http://upload.wikimedia.org/wikipedia/en/thumb/0/06/Moonlighting.jpg/200px-Moonlighting.jpg" title="http://upload.wikimedia.org/wikipedia/en/thumb/0/06/Moonlighting.jpg/200px-Moonlighting.jpg">http://upload.wikimedia.org/wikipedia/en/thumb/0/06/Moonlighting.jpg/200...</a></p>
    <p>moonlighting TV series and I've seen a similar version of it as the header for <a href="http://www.candycollective.com/index.html" title="http://www.candycollective.com/index.html">http://www.candycollective.com/index.html</a></p>
    <p>candy collective's magazine.</p>
