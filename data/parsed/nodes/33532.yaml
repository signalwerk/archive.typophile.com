      <p>Missgiggles,</p>
      <p>Not to hijack the thread too far off the current course (heh heh), but I have to agree with some of the others that this is, to say the least, an ambitious self-assignment. Wouldn't hurt to narrow it down a little. What's your field, or what would the Ph.D be in?</p>
      <p>Just as a starting point, here's a <a href="http://mktg-sun.wharton.upenn.edu/advertising/PDF%20and%20Other%20Files/advertising%20bibliography.pdf" target="_new" rel="nofollow">reading list</a> on "Advertising and the art of persuasion" someone already compiled. Note that it's 40+ pages long, yet at a quick glance I can already see holes in it, and it doesn't even venture into the historical perspective as you propose to do. </p>
      <p>Any SINGLE one of the bullet points in Part 2 and Part 3 would probably be enough to build a dissertation around. I suspect you are looking to do a dissertation which is a more comprehensive whole than a focused inquiry, but there are problems with that approach, one being that there will always be holes that your dissertation committee can, should they choose, drive trucks through. If you focus enough, you should be able to wow them with your detailed level of knowledge, yet be able to fit your topic into larger ones (typically one near and dear to their hearts - be sure to do the research on your committee members!).</p>
