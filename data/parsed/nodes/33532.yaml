    <p>The Art of Persuasion</p>
    <p>INTRODUCTION</p>
    <p>-What power is and how it affects our attitudes and<br>
    reactions to certain thing in society.<br>
    -It’s influences on people and how it psychologically<br>
    works with our minds.<br>
    - How it affects us and our daily lives generally.<br>
    Have a part that can leads into referring to the past<br>
    of Christianity, Egyptian Era and beyond.</p>
    <p>Part 1</p>
    <p>- Christianity and how people saw it as their lives.<br>
    Christianity made their lives. It was some form of<br>
    persuasion.<br>
    - Egyptian Pharaohs etc. They had power over the<br>
    people. They Pharaohs had gold which equals power<br>
    because rich and wealthy and therefore able to have<br>
    anything and everything they ever wish for, thus<br>
    making them hierarchy and powerful.<br>
    -  Alexander the Great. His statue was made to look<br>
    powerful and so the people chose him as leader<br>
    although they had never seen the guy before! He was<br>
    noway like he was in real life so they were persuaded<br>
    by the power of the statue to remind them who their<br>
    leader was and who t hey should aspire to.<br>
    - Renaissance onwards, talking about church, mosques<br>
    (architecture and how it helped people to believe in<br>
    religions etc - Not sure on the architecture bit<br>
    because I have not yet looked into it).<br>
    - You once mentioned the Notre dam Cathedral (again,<br>
    need to research, not sure what it is about though.)<br>
    - Are Romans important enough in this context? Should<br>
    they be included? And if so, in what form?</p>
    <p>Part 2</p>
    <p>- Propaganda posters = World War I (Hitler and how he<br>
    was backed by his people even though he was in the<br>
    wrong).<br>
    - Uncle Sam War posters 'WE WANT YOU'<br>
    - You mentioned at one point about Goebbels, Minister<br>
    of Germany (need to look into, I am not sure what it<br>
    is though).<br>
    - Triumph of the Will film which is a propaganda film<br>
    by Leni Riefenstahl (German film maker)<br>
    - Eternal Jew film from 1940.  Anti Semitic.<br>
    -Would I have to mention quotes from Genesis?<br>
    - Italian Fascism ruling between World War I and World<br>
    War II. Hitler was inspired by Italian Fascism.<br>
    - deconstruct advertising after World War I and II<br>
    - Barbara Kruger, born 1945 and worked as guerrilla<br>
    artist. Guerrilla art is philosophical thus, focuses<br>
    more on ‘cause and effect’<br>
    <a href="http://en.wikipedia.org/wiki/Guerilla_art" title="http://en.wikipedia.org/wiki/Guerilla_art">http://en.wikipedia.org/wiki/Guerilla_art</a> Her work was<br>
    black, red and white therefore relates to Hitler in<br>
    some form; also the Russian Constructivism.</p>
    <p>- You mentioned Robin Hood so I might speak to you<br>
    about it I think. Is it because he was seen as a<br>
    legend and a hero because he gave money to the poor<br>
    but then was seen as bad because he robbed passers by<br>
    to do it?</p>
    <p>Part 3</p>
    <p>-Advertising, packaging etc How we decide on what to<br>
    buy and which brands. is it because they stand out as<br>
    quality via packaging design or are they well<br>
    established companies and so they tend to appeal more?<br>
    Or what would people on a budget generally go for and<br>
    why? Is it financial situations that help us decide<br>
    which brand of product to buy or some other<br>
    psychological aspect that needs looking into i.e.<br>
    colour psychology advertisers and designers use to<br>
    attract people to buy their products. Is it the<br>
    'celebrity endorsement' technique they use to persuade<br>
    people to buy to represent 'quality' ?<br>
    - I might choose certain design pieces of advertising,<br>
    branding or packaging that I can expand on in terms of<br>
    persuading the consumer to buy. How and why? Including<br>
    colours used which have certain connotations, choice<br>
    of graphics and typeface used etc and why? Who are<br>
    they aiming for and how successful they are in<br>
    targeting their chosen T.A and how they do it. What<br>
    methods and how ideas work.<br>
    -TV advertising. Effective use of type, image and<br>
    sound and how long they last for. Humans don't have<br>
    long attention spans, therefore advertisers have to<br>
    accomodate in a short, clear, concise manner.</p>
    <p>CONCLUSION</p>
    <p>Overall message and what i found out etc Sum out my<br>
    findings. Should be strong and to the point so reader<br>
    left to make their own mind up whether they agree or<br>
    not. Not sure at this moment in time.</p>
