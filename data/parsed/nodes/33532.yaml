      <p>Your writing is not very coherent, so I may not understand where you are going at all, but here goes:</p>
      <p>Keep in mind that that while imagery as a persuasive tool did exist in the past, the reasons leaders stayed in power and religions were a greater factor in life are far more complicated than anything that can be boiled down to the visual arts. For example, while Alexander may have sent forth a stone simulacrum as an emissary, people were probably caving in to him to avoid their nations being razed by his armies. </p>
      <p>If you do examine Nazism look into Albert Speer. He was essentially Hitler’s head of design, and wrote a big fat memoir about his work in the Third Reich.</p>
      <p>Trying to connect propaganda from the second world war with modern advertising is too much of a stretch. The war propaganda was total (as any true propaganda system must be); governments put out their messages in every media in existence. Aside from Coca-Cola’s ubiquitous advertising, there has never been any commercial advertising that comes close to reaching the level of propaganda at all, much less WWII propaganda.</p>
      <p>Florian is right, you really need to boil this down to something much simpler. What you seem to be proposing would generate a stack of research notes larger than the Mahabarata, getting a dissertation out of that would be a nightmare.</p>
