      <p>Persuasion can come from reasoning, and the tool of reasoning is the argument. Arguments an be (1) conclusive, such "All A is B, All B is C, therefore All A is C." Conclusive arguments are usually what are termed "truths of logic, or formal truths, and are pretty boring.</p>
      <p>Arguments can also be (2) compelling, which take the same form as (1), but disputes arise because the premises aren't commonly agreed to, and the form of disputation is usually an attempt to refine the premises so both parties reach agreement. Usually agreement over premises isn't reached, but it is a lot more fun than formal logic. Another term for this would be "critical thinking."</p>
      <p>It appears this is a form of persuasion (rational argumentation) is not what you are after. Taking a convenient dicotomy (reason versus emotion), you appear to be after chronicling persuasion that appeals to emotional issues. But this is a terribly presumptive dicotomy; read <cite>Blink</cite>. I found Chapter 3 particularly interesting; my understanding of this chapter was that the very thing that lets us function well without a syllogistic analysis also requires us to rely on generalizations. Generalizations are quick, useful summations which are known to contain untruths as well as truths, so don't lend themselves to becoming "absolutes." One form of this is the "stereotype," which is, roughly, a generalization once useful, but either not currently useful or far less useful than formerly. Stereotypes lead to, in Gladwell's terms, "the dark side of thin-slicing." </p>
      <p>Now there is a point to all this. Most of us allow that there is some -- and sometimes a lot -- of truth of generalizations. Advertisements appeal to generalizations, while trying to get us to ignore the places where the generalization breaks down. How successful they are depends on how well they get us to ignore that breakdown. Not much has changed since <cite>Generation of Vipers.</cite></p>
      <p>I find your inclusion of Religion strange. Religious truths are <cite>revealed truths.</cite> If the truth has not been revealed to you, you do not accept it; i.e., if it has not been revealed <cite>to you,</cite> no reasoning process will change your mind. This isn't to say religious truths are wrong, simply that they are of a different form.</p>
      <p>I once had a professor who, when we complained about the Ph.D. exams told us "Exams are puberty rites. Get past them." His view on the dissertation was that it was one more term paper, designed to please the small audience of your adviser and his friends. Success there lead to a degree, a job, and eventually tenure. Any search for truth could wait until after you had tenure. He persuaded me. After passing exams, I quit academics; time was too precious.</p>
      <p>Blink</p>
