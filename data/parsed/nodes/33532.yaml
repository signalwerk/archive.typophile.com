      <p>I once talked with the widow of the man who was head of the Communist Party of Germany during the time of the Nazi takeover. She said that the party did not ally with the center parties--which would have created a majority--because they thought that Hitler was so bad that the people supporting the center would soon react against him, and go over to them, and then the Communists could take over. In other words, they did not try to make democracy work, but relied on a reaction to put them in power. "That was our guilt," she said. </p>
      <p>Of course it was not surprising that the Party did not try to make democracy work, as Marx, like Hrant, was contemptuous of democracy.</p>
