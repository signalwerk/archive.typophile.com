    html: |-
      <p>Basically, what's wrong with Arial is it's too up tight. It needs to un-wind. </p>
      <p>It needs a freaking vacation!</p>
      <p>It is not that it is good or bad. Just an overworked typeface trying to fit in where it wasn't really wanted and being wanted where it doesn't really fit in. It feels guilty for being forced to do Helvetica's job, even thought Helvetica has been overworked for years and years. Designers, the only people on the planet who could pick Arial out in a police line-up, despise Arial for being a cheap impostor, even if they also despise Helvetica. The fact is, because of its interloper status, it never really gets judged for its merit. It's always, "Oh, that Helvetica wannabe, Arial…" Not that most people judge it all. It's just a steady work horse to most, who gets called time and time again to fill in for somebody else because he'll work for less, or he's just there: "Here's a pile-o-crap, would you clean it up for me." Arial says, "B,b,b, But …" but accepts the shovel, sighs and gets to work. "here's a load of cod's wollop. would you dress it up and make it smell nice." Arial says, "B,b,b, but,…"</p>
      <p>So, my solution was to help Arial relax. Get it out of that suit. Send it to the spa for some pampering and a nice massage. The whole nine yards. In the Caribbean. On the beach. </p>
      <p>If you want to relax a typeface, what do you do? Why, of course, you convert lines to curves, make them smooth &amp; you remove nodes. Lots and lots of them.</p>
      <p>Arialicious: Arial is so relaxed, he's downright counter-culture. Hand that kid a dooby.</p>
      <p>Comarial Sans: The tie is loosened, the top button opened, but he's ready to work. Maybe something not too demanding down in shipping.</p>
      <p>Helvarial: Think mullet. Hockey-hair… Business in the front, party in the back back.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/arialicious_6713.jpg"></div><p></p>
