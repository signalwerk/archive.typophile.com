      <p>The Microsoft license states that you may not "reverse engineer" the font, but I don't think that means you can't "convert text to outlines" in a graphics program, or a great many people would be in big trouble. What you end up with when you "convert to outlines" is a bunch of shapes that look like Arial, not a "reverse engineered" font. If graphics programs had a "convert outlines back into text" command, then there might be reason for concern. </p>
      <p>If anyone is still worried about the issue, you can always work on paper or in a paint program, such as Photoshop.</p>
