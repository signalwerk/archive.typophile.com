    html: |-
      <p>I agree ... Arial's really wound up tight.<br>
      Was it not also designed to be a more on-screen counterpart of Helvetica? Back in the days of lower res monitors, it made a difference in smaller sizes, like in body text. You only had like 7 pixels and no anti-aliasing to define your caps, and Helvetica's humanistic roundness didn't resolve as nicely as Arial's straighter lines.</p>
      <p>Now that screen resolutions have all but obliterated Arial's advantage, let's take the typeface back to its roots to inject some character back into it. Maybe take some influence from Grotesk and Gothic faces. And fix some real annoyances while we're at it. Like that God-awful cap R leg. And the fugly lowercase a and r. Here's a quick go at it.</p><div class="imageWrap"><img src="http://typophile.com/files/arialnext_6519.gif"></div><p></p>
