      <p>Yo Mark, since this is your idea, where's your solution?</p>
      <p>My hope is that Arial will, in fact, gain a bit of respect as a result of this battle. It is easy for me to hate on typefaces because they are popular, or because they have flaws, or even because their origins are perceived as being dubious. Comic Sans sucks. Ok, draw a better comic sans. Not so easy. I'm not commenting on the quality of any executions in this thread, only observing that as I worked on my entry below, I decided Arial deserves more credit that I give it. Next battle: improve Papyrus (good luck).</p>
      <p>What I did: I contemporized Arial while fixing a few of the flaws (bad curves on the a, width of the a, anemic r, high-waisted R). The result is a blunt terminal Cholla meets Info meets Helvetica typeface that is still pretty bland:</p>
