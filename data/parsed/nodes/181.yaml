    html: "<p>&gt; Our Latin alphabet has been designed and redesigned <br> <br>Actually, it's only been designed (successfully) once: the Carolingian standardization. To me the rest is too subconscious to be called design. What we <i>do</i> design is letters, but not the alphabet per se. <br> <br>Alphabet design is very rare, although in one case -Korean Hangul- it resulted in a writing system that makes all others look like village idiots. <br> <br>&gt; the most successful types of all time are are drawn very closely on the same character widths. <br> <br>Do you mean the same as the Trajan model, or the same as each other? <br> <br>&gt; study what has gone before. <br> <br>Great advice indeed. <br> <br>-- <br> <br>Garald, I have that article. And I'd recommend it highly because it contains references to all significant [historical] \"construction\" efforts (which I agree are generally misguided, for text at least). And I wish Carter would write part 2 already! <br> <br>&gt; not bad for \"ancient\" Rome, huh! <br> <br>Except they got that -and most everything else of value- from the Greeks. <br> <br>hhp <br></p>"
