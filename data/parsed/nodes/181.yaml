  html: <p>Ok, so making continuous optical adjustments to the individual character widths in a typeface I'm working on is taking forever. Is there a more <i>scientific</i> way of doing it than looking at the letters in context (words, text), making (subjective) judgements about their legibility, adjusting accordingly and then repeating the cycle? <br> <br>There seems to be an (inate?) optimal width for each glyph. If a glyph is too wide it <i>looks wrong</i> and is distracting. This <i>sense</i> of what is ideal is what I'm trying to use as a benchmark against which to make adjustments. But isnt that a bit too subjective? <br> <br>Where does this sense come from? Have our eyes just become accustomed to reading letters at a certain width, or is there an actual optimal width at which each character imparts its information and can thereby be recognisable? (Perhaps related to the number of vertical strokes in a chracter, for example) <br> <br>How does you design legibility (as regards charcter widths specifically) into an original typeface? Is it just optical adjustments or is there a more objective way? <br> <br>je</p>
