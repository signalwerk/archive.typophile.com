    html: "<p>Back to the original issue: <br> <br>&gt; There seems to be an (inate?) optimal width for each glyph. <br> <br>It seems that the optimal width for a given character is a value that can be deviated from safely, upto a point. This point depends on the sensibilities of the viewer (which is subjective). Furthemore, the deviation can be controlled to make the font more dynamic. However, the <i>set</i> of deviations might have to be consistent, otherwise the harmony is too deep, and it will be seen as discord by practically everybody. What I mean is you can't make half the UC Classical and the other Modern. <br> <br>As for what the \"ideal\" is, I would say it depends on the structure of the glyph. One obvious example is the \"B\" versus the \"D\": the former is narrower because you can't make half-size bowls look nice that wide. But it's not so simple because a \"B\" with bowls of [roughly] equal height can't be as wide as one with a large lower bowl. <br> <br>So there might be a way to quantify the optimal widths of characters by first quantifying their structure, <i>but</i> taste is subjective, so you could only do that for a given person (and really only at a given instant). So what you could do is make a set of caps where the widths please you personally, then make variations of certain characters (like make a \"B\" with a lower/higher middle) and see how that affects your ideal width, and formulate some numbers for future use. So the next time you make a font, you can draw a single character and \"propagate\" the ideal widths of all the others, based on their other structural determinants. Once you have the set of ideal widths, you would work inwards. <br> <br>To avoid making the solution too personal, you could do this to a \"classic\" face. For example, you could take the Trajan \"B\", lower the middle, see how its ideal width changes, and use that dataset as the guide for a new font. <br> <br>-- <br> <br>This is exactly the sort of thread I think type design needs most now. So I hope many people brainstorm about it and delve deeply towards its warm core. <br> <br>hhp <br></p>"
    html_clean: "<p>Back to the original issue: <br> <br>&gt; There seems to be an (inate?) optimal width for each glyph. <br> <br>It seems that the optimal width for a given character is a value that can be deviated from safely, upto a point. This point depends on the sensibilities of the viewer (which is subjective). Furthemore, the deviation can be controlled to make the font more dynamic. However, the <i>set</i> of deviations might have to be consistent, otherwise the harmony is too deep, and it will be seen as discord by practically everybody. What I mean is you can't make half the UC Classical and the other Modern. <br> <br>As for what the \"ideal\" is, I would say it depends on the structure of the glyph. One obvious example is the \"B\" versus the \"D\": the former is narrower because you can't make half-size bowls look nice that wide. But it's not so simple because a \"B\" with bowls of [roughly] equal height can't be as wide as one with a large lower bowl. <br> <br>So there might be a way to quantify the optimal widths of characters by first quantifying their structure, <i>but</i> taste is subjective, so you could only do that for a given person (and really only at a given instant). So what you could do is make a set of caps where the widths please you personally, then make variations of certain characters (like make a \"B\" with a lower/higher middle) and see how that affects your ideal width, and formulate some numbers for future use. So the next time you make a font, you can draw a single character and \"propagate\" the ideal widths of all the others, based on their other structural determinants. Once you have the set of ideal widths, you would work inwards. <br> <br>To avoid making the solution too personal, you could do this to a \"classic\" face. For example, you could take the Trajan \"B\", lower the middle, see how its ideal width changes, and use that dataset as the guide for a new font. <br> <br>-- <br> <br>This is exactly the sort of thread I think type design needs most now. So I hope many people brainstorm about it and delve deeply towards its warm core. <br> <br>hhp <br></p>"
