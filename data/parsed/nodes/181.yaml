    html: "<p>Jumping in as a relative newcomer: <br> <br>An important factor might be where in the spectrum from classical proportions to monospaced proportions a typeface lies. <br> <br>A classical font like Trajan is built on the forms of the circle, the square, and the triangle. The result is that some letters, like O and C (based on the circle) are twice as wide as letters like E and L (based on two squares). <br> <br>With a typeface like DIN, on the other hand, all letters strive to look the same width. <br> <br>There's plenty of room in between, but I expect that the classical proportions should give you a good idea of relative widths between letters. Applying this to lowercase might be another matter. <br> <br>Paul</p>"
    html_clean: "<p>Jumping in as a relative newcomer: <br> <br>An important factor might be where in the spectrum from classical proportions to monospaced proportions a typeface lies. <br> <br>A classical font like Trajan is built on the forms of the circle, the square, and the triangle. The result is that some letters, like O and C (based on the circle) are twice as wide as letters like E and L (based on two squares). <br> <br>With a typeface like DIN, on the other hand, all letters strive to look the same width. <br> <br>There's plenty of room in between, but I expect that the classical proportions should give you a good idea of relative widths between letters. Applying this to lowercase might be another matter. <br> <br>Paul</p>"
