    html: "<p>I found something. An article in the 1968 Penrose Annual (which I actually mentioned in the \"Trapping\" thread) by Louis Rosenblum, where he's devised a system to standardize the measure of the relative widths of text fonts. The apparent aim being to be able to predict layout and/or save on storage (remember: 1968). <br> <br>Rosenblum's style is very terse (he's an engineer by training), so I'm not exactly sure, but it looks like he's taken measurements of many \"classic\" fonts and arrived at average relative widths: <br> <br>Lowercase: <br> 5: i <br> 6: f j l <br> 7: r s t <br> 8: z e c <br> 9: q g x a o <br>10: n h u d p b k y v <br>13: w <br>15: m <br> <br>Uppercase: <br> 8: I <br> 9: J <br>10: S <br>11: Z <br>12: P L F <br>13: Q O A V B T E C <br>14: G U Y R <br>15: N H X D K <br>18: M W <br> <br>Numerals: 9 units. <br> <br>One strange thing is that for a given width the letters listed aren't alphabetical. But there must be a reason behind their orders. My guess is that they're listed in increasing statistical divergence from the given width. <br> <br>Rosenblum also ties the TTS width system into the discussion, but I couldn't follow that well enough. <br> <br>One last thing <br>In pointing out that metal fonts have smaller sizes that are proportionally wider and darker than the larger ones (optical scaling), he says that's due to practical manufacturing concerns! I'd never heard that before. <br> <br>hhp <br></p>"
