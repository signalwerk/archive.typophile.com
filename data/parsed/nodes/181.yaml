    html: "<p>&gt; Time for something else. <br> <br>I'm all for that! <br> <br>But just to make sure: we <i>are</i> talking about the widths <br>that glyphs conform to, right? Not letterform style. <br> <br>What do people think of Richler's caps, <br>especially in terms of the widths scheme? <br> <br>-- <br> <br>Something new, eh? Hmmm... What about this: <br> <br>Since letters are put together to form words, and we can appreciate the way a word sets as much as the way a letter sits, the set of optimal widths in a writing system depends on linguistics. If the Classical widths are seen as optimal for ancient Roman inscriptions (in Latin), they simply can't be seen as optimal for a contemporary novel. So maybe we need a new set of widths? <br> <br>That said: <br>1) There are -as I'm fond of stating- two strands of reading: deliberative (where you can consciously appreciate shapes) versus immersive (where your reading \"firmware\" takes over, and doesn't care how sexy that finial is). As a result, \"optimal widths\" can be [at least] two things... <br>2) I've only thought about caps so far... <br> <br>hhp <br></p>"
