    html: "<p>Indeed, there seem to be two models of UC width: the Classical with its great divergence*, and what might be called the Modern with its convergence. But I'm not sure how much there is in between. You do see some faces with a letter or two deviating from the Classical (like the wide \"S\" of Will Carter and sometimes Zapf, and a wide \"E\"/\"F\" here and there), but I can't think of any that deviate much from the Modern - I guess that would look totally lousy. What I'm saying is that your caps have to either diverge a lot or not at all**. Makes sense? <br> <br>* Although I'm not sure how strong the geometric basis is. <br> <br>** The only exception I can think of is Nick Shinn's fascinating Richler. <br> <br>So Jos</p>"
