    html: |-
      <p>1) Adding spaces on either side of a dash allows for better line breaks; if you didn’t add them, both words on either side of the dash and the dash itself would jump to the next line if you hit the hot zone. Since you want the close quote to stay with the en dash, don’t add a space. Simple.</p>
      <p>2) Arnhem Pro has an /fk ligature, but that appears to be it; I guess you’ll have to like the /r or lump it…</p>
