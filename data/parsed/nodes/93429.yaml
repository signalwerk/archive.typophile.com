    html: |-
      <p>There is no reason not to change the kerning to your taste. You can do this in the application program.</p>
      <p>(Aside: A good modification to standard EULAs might be to allow any change to the font data, for one's own use only, if that change could also be made in the applications program.  In the first place, there's just no way to tell from the printed piece  where the change was made. In the second place, if you're going to make the change in the applications program, you have to be careful to get all occurrences. In the third place, it's sometimes faster, hence cheaper, to make the change in the font.)</p>
      <p>Having said that, for Arnhem Blond used as the text font in books, often set a bit larger than magazines and newspapers, I like about  1.5% to 2% condensation. You can do this in InDesign. The downside is this may affect the kerning &amp; letterfit just a bit. You'll have to try &amp; see how it works for you. Remember, the original design was for a newspaper.</p>
      <p>As for the en-dash before a right quote, I'd think you would want a bit of space if you're spacing the dashes elsewhere. Nor would I change to a closed-up em dash just for this one case. However, you could use a kern, or a fixed space such as a thin, which might give the same or just slightly less optical space as the word space used with other characters. IIRC, InDesign won't break at a thinspace, but in any case, you can put a "no break" command around the character sequence globally. Note that the "no break" command is different than the nobreak space (U+00A0)</p>
      <p>Arnhem is a very  nice text face. From the link, I guess someone found it "too Dutch," but I think Smeijers, like Carter &amp; Majoor, is one of  the geniuses in type design. (<cite>Counterpunch</cite> is a wonderful book, too.) Sadly, even being a genius doesn't mean you always get the kerning right, or minimally, that there can't be alternate, acceptable views.</p>
      <p>FWIW</p>
