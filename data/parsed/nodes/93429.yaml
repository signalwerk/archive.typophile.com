    <p>1) throughout the book I'm leaving a word space between the en dash...e.g blablabla - blablabla...what happens if it comes at the end of a quotation mark? e.g 'blablablbla -' should i leave a space? 'blablabla - '</p>
    <p>2) the typeface i'm using is arnhem...for some reason the r &amp; t , r &amp; y, f &amp; k collide...it doesn't really affect the legibility but it looks ugly to me...should I change it? would it be considered unprofessional if I left it? why would a great designer like Fred Smeijers leave it like that? </p>
    <p>Thank you!</p>
  html_clean: |-
