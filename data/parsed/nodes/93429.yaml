      <p>There's no reason you should have an en dash next to a quote mark. Even if you are using en dashes consistently throughout.</p>
      <p>"I like en dashes – they're really cool."<br>
      "But when a dash ends a quote —" it is always an em dash. Signifying interruption (which is the only reason I can imagine ending a quote with a dash) is the special job of the em dash.</p>
