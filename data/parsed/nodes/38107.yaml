      <p>Here are more examples.  As you see, these aren’t old at all.  Though I believe that the one without the date could be a little older.  I’m not convinced at all that it’s one of the Engravers from Monotype.  It still seems to be another font to me.  Especially the middle serif of the “G” is not that wide in the original, the little gap of the “R” is missing in the original, and the middle bar of the “E” is set a little higher in the original.  What do you think?</p>
