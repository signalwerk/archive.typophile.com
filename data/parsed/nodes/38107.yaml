      <p>The letter from Venrock is from 1995.  The one from Gerald R. Ford isn’t that old either — I’ll try to find out when he was active (government), because the date is missing on this paper.</p>
      <p>I have already noticed the Engravers packages from Monotype Imaging, which include the Sackers in package no. 2 — a font often used by the government, White House etc.  Unfortunately, these really seem to be the only ones digitalized yet.</p>
      <p>By the way, I don’t think it is any of the above mentioned fonts though.  Of course, one of them is pretty similar, but still they’re different.</p>
      <p>Does anyone else have an idea?  Also, I’m pretty sure that the pictured examples include two different fonts.  They are not the same either.</p>
