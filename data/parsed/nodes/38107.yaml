    <p>Can you help me identify the fonts used here?  These cover letters are from the U.S., so I believe they’re American fonts.  I haven’t been able to find or identify them anywhere yet.  Maybe they haven’t been digitalized yet at all.  We have two different fonts here, by the way, though pretty similar:  the one with “Gerald R. Ford”, the other is from “Venrock Associates”.  Thank you so far, and excuse the bad quality.</p>
