    <p>I have a problem.</p>
    <p>I'm getting married in December and am currently putting the finishing touches to my invitations. I'm tring to find a modern script typeface (such as Ministry Script) that can handle the name 'Lizzie' (my wife-to-be's name). As you can imagine the double z is proving to be a bit of a problem.</p>
    <p>I did have my heart set on Ministry Script but would welcome any suggestions.</p>
