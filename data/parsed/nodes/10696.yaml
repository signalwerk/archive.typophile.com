    html: <p>I think I asked this a while back, but for the sake of the newer members...what do you think of "correcting" handwritten fonts? i.e. seanmichael's comment about changing the slant of the "q". Doesn't that take away from the authentic handwritten look? <br> <br>I think this is very nice, BTW.</p>
