  html: <p>This is a type based on the notes in my sketchbook. Usually I write with a fine Sharpie on thinish paper which absorbs and spreads most of the ink. Hmmmm....I've wanted to use my print on posters before, so this is my attempt to digitalize it.<img src="http://www.typophile.com/forums/messages/29/7426.gif" alt="Sketchbook Text"></p>
