    html: <p>yup. the z is too wide, but i know you're fixing that. i agree that the B is really nice, but disagree that the q should back slant--handwriting is handwriting, plus it adds some variety and keeps things from being too systematic. also the angle echoes the z and y descenders. overall the face has a real nice energy and positive feel, maybe due to the stems thickening at the top and the upward thrust of the B, p, and e. another nice quirk, in addition to the B stem, is the descender on the z. if you can keep that, it will be a nice touch on the rare occasion of its use. the lowered x is nice as well--keeps things spontaneous. </p>
