    html: |-
      <p>I would just look at other faces done by Adrian Frutiger that have similar characteristics, which may prove difficult trying to pair with an egyptian font like Serifa.</p>
      <p>I'd probably choose <a class="freelinking external" href="http://www.linotype.com/50/apollo-family.html#" rel="nofollow">Apollo</a> since it has subtly bracketed serifs which would compliment the slabs.</p>
