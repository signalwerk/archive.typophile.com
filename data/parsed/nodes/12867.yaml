    html: |-
      <p>On Panther, Apple’s FontBook was inusable with more than “a few dozen” fonts since it simply moved fonts in and out from /Library/Fonts/ folder, slowing down the machine.</p>
      <p>I recently upgraded to Tiger, had problems with my old Font Reserve app, and I’m trying to move to a different font manager.<br>
      Now, I’m quite pissed off.</p>
      <p>Dowloaded demos:</p>
      <p>Suitcase X11, installs correctly, crashes on startup (this happened also in Panther - worked well with Jaguar). Trashed.</p>
      <p>I’m trying FontAgentPro (idea from: <a href="https://web.archive.org/web/20080908085947/http://typographi.com/000992.php" title="http://typographi.com/000992.php">http://typographi.com/000992.php</a>).<br>
      Yesterday it worked quite well, then today I activated Helvetica and HelveticaNeue: it seems in causes problem with the system-wide helvetica, that now renders as cirillic caracters in Mail.app (it happened before with Panther, but a “verify privileges” cycle used to resolve the problem): so I’m unable to activate other Helveticas on my machine.<br>
      And now, every font I import into FontAgentPro, is misteriously listed as minion...<br>
      Auto Activation doesn’t work for Photoshop...<br>
      FontAgent Pro could be a killer app, but (the demo) seems to be filled with bugs that render the app nearly inusable...<br>
