    <p>Anyone here actually USED Apple’s Font Book v2.0 (Tiger) with more than a few dozen fonts?<br>
    If so, how’s it working?<br>
    I’ve been gun shy ever since Font Book v1.0 ate a bunch of my system fonts, so I dare not try it myself!</p>
    <p>Anyone care to render an opinion? Can Font Book v2.0 handle (say) upwards of 1,000 fonts total? If so, will it work WELL?</p>
    <p>Thanks for you input(s),</p>
    <p>Chris</p>
