  html: "<p>I'm selling my Font Book from Digital Typeface Compendium. It includes the Font Finder brochure as well. I wanted to offer it for sale here first before uploading it to eBay. If it sells here, I'll donate half the proceeds to Typophile. This is a serious offer. For more information, here's a link to the book on Amazon: <a href=\"http://www.amazon.com/exec/obidos/tg/detail/-/3930023024/103-3926384-5127865?v=glance&amp;vi=reviews\" target=\"_blank\">The Font Book</a> <br> <br>If you're interested, I prefer PayPal as a payment method. Email me for further details: <a href=\"mailto:dylan@customartco.com\">dylan@customartco.com</a></p>"
