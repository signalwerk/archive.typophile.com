      <p>It seems that at one or more points there has been a confusion between copywriting (writing copy text) and copyright (intellectual property rights).</p>
      <p>It is true that copyright is integral to any creative work whether it is registered or not, but "copyrighting" described as an action can only mean registering the copyright, which if you choose to do so will incur fees that may be included in expenses.</p>
      <p>Also, the copyright integral to the work is <em>yours,</em> and it is possible to buy it off of you with a clear contract, which should involve serious money because it would be signing away your own claim of creation. But all the client should really need is the trademark, which is different and belongs to the business it represents.</p>
      <p>If your client actually thinks that you can't charge for writing copy, then he is simply dreaming up excuses not to pay for your work because he wants it free.</p>
