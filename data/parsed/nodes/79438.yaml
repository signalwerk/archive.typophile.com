      <p>&gt;my client claims copy is not chargeable.</p>
      <p>It despends on the contract you made with your client before you started the project.<br>
      Normally there is written down an allocation of responsibilities between the two parties, the more exact the better. Was copywriting an integral part of the project contract? </p>
      <p>The normal tactics of clients is pushing towards new jobs during a incomplete described project without paying extra. Alarm bells start ringing in my head. There should be a renegotiation about every "new module" be added during the process. It pays. </p>
      <p>The game: Fully-qualified traders against not-so-qualified traders (grafic designers).</p>
