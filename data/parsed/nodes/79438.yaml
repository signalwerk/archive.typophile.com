    <p>Hi Guys,</p>
    <p>I recently worked on branding a new furniture store in India. The branding involved creating large showroom panels that depicted lifestyle, furniture usage, materials etc. Considerable research went into the conceptualisation and I came up with precise copy and taglines. The panels were approved, fabricated and put up. But now two months past my invoice date, to my surprise, my client claims copy is not chargeable.   </p>
    <p>And I quote </p>
    <blockquote><p>"PLEASE NOTE COPYWRITING IS ALWAYS AN INTEGRAL PART OF ANY CREATIVE - AND NO AGENCY CHARGES EXTRA FOR COPYWRITING - CAN A CREATIVE BE PRESENTED TO A CLIENT WITHOUT COPYWRITING &amp; TAGLINE AND PAY JUST FOR IMAGES THAT ARE PRESENTED CREATIVELY???"
    </p></blockquote>
    <p>Can this be true? If the client has no concept, no brand proposition and the designer comes up with a credible one, is it not chargeable? Your comments.</p>
