    html: <p>I'm out of New York City, the job is a promo piece called A little Book of Logos. 24 pages, 4x6 inches final size. It will be a mix or art/type so I think we're talking polymer plates rather than hand setting type. Oh, one color. Anyone hazard a guess? +20% +50% +100%?  <br> <br>Randy <br> <br>Somehow I missed the initial post to this thread!!! Based on my experience, I would say yes, letterpress is going to cost a lot more than offset. But there are levels of letterpress. If cost is the main fact and you just want that "letterpress" look, go to the cheapest printer you can find, he or she may be able to match the price of offset, but then, there are levels of offset (cost/quality) as well.</p>
