    html: <p><i>Quality is in the eye of the beholder</i> <br> <br>Quality isn't just technical. That said, however, certain things I can't disagree with. For instance, is it in register? Is it trapped? Does the overprint line up? Is it cut straight? Are their typos? Did the type bitmap? Is the sky purple? Are buses orange? <br> <br>Certain things aren't in the eye of the beholder. I realized once I posted that this would come back to haunt me. Technical quality isn't in the eye of the beholder. I take that back. But I still think there is something to it.</p>
