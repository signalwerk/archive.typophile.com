    html: '<p>Looks aside, it all depends upon quantity. I just had a wedding invitation letter pressed, including: rsvp cards, place cards, registered cards, and receptions cards + envelopes, for only $280.00US. But it was because we only need 70 total invitations. This would have cost much more to offset. I realize cost is almost considered secondary to "how it looks", but letterpress can be cost-efficient for the right job.</p>'
