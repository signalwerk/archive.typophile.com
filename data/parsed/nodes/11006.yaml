    html: "<p>The physicality of handsetting (I'm not talking about the results of impression printing) results in text being sub-optimal, in three ways: <br>1) It's too painful to optimize letter- and line-spacing to just the way you want/need it. And you can't choose 10.3 point for example! I'm not even getting into continuous-axis (like MM) technology. <br>2) Optimal reading sizes (9-11 point) are so small as to be beyond reasonable human ergonomic/perceptual comfort: they're too small to handle very well, and too small to see very well (the letterform blends into the shoulder). <br>!NEW! 3) Wear/damage affects smaller type more. <br> <br>In addition, handsetting being a physical thing, it's much more emotionally satisfying to handle a 60-point hunk than a dainty little thing. <br> <br>Handsetting likes big, tangible things. <br> <br>hhp <br></p>"
    html_clean: "<p>The physicality of handsetting (I'm not talking about the results of impression printing) results in text being sub-optimal, in three ways: <br>1) It's too painful to optimize letter- and line-spacing to just the way you want/need it. And you can't choose 10.3 point for example! I'm not even getting into continuous-axis (like MM) technology. <br>2) Optimal reading sizes (9-11 point) are so small as to be beyond reasonable human ergonomic/perceptual comfort: they're too small to handle very well, and too small to see very well (the letterform blends into the shoulder). <br>!NEW! 3) Wear/damage affects smaller type more. <br> <br>In addition, handsetting being a physical thing, it's much more emotionally satisfying to handle a 60-point hunk than a dainty little thing. <br> <br>Handsetting likes big, tangible things. <br> <br>hhp <br></p>"
