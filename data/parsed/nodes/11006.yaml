 of work, relatively fast, relatively good, and relatively cheaper. Professional grade work most of the time. These kind of operations are quite rare though. <br> <br>Bottom dwellers: motor driven platen job press operations. Job work, cards, stationery, labels, die-cutting, stamping, etc. Rarely capable of decent book work. Should be quite inexpensive (unless boutique), rarer to see good quality work, fast. <br> <br>Basically, operator somewhat aside, the more distancing the machine from the human hand, eye, and mind (not to mention heart), the cheaper in cost and quality. But not always so!!! <br> <br>My five minute attempt here to put a bit of a different spin on this.</p>"
