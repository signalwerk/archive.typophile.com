    html: <p>Bud? Hmmm. Okay, I guess we are buddies. But I feel as if you want me to ask you to rant.  <br> <br>After I posted I realized that perhaps I shouldn't have. Some people instantly equate price with quality. "Honey, you gotta pay through the nose, otherwise you aren't getting quality work."  <br> <br>Well, hmmm. Is that what you were insinuating? I hope not. My fingers are crossed for you not to say something like that. I hope you tell me the opposite.  <br> <br>The press I used to do my invitations were very generous. I had lined up another printer only to have them cancel at the last minute. (Which was good because they weren't going to be able to meet my deadline.) The press I used saved by bacon and that of my clients as well. And I have a feeling they were also generous in their pricing. <br> <br>It was my first time to letter press anything, ever. I'm willing to learn. LIfe is one big lesson, and I'm a forever student. So, Gerald, educate me. I'm listening. <br> <br></p>
