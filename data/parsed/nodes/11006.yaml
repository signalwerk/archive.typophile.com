    html: "<p>&gt; just very labor intensive. <br> <br>To the point of discouraging most people from tweaking enough. <br> <br>In terms actual practice, figuring out if the average digital setting is better than the average metal setting is a major project (and it would depend on whether you're looking at the jobbing work of the past versus the fine-press stuff of today). And in terms of the theoretical high-end, I guess they're the same: there's nothing physically stopping a handsetter from inserting steel thins between each pair of letters for example...  :-/ <br> <br>But in terms of the barriers to making a very good real-world setting (where for example you'd choose the point size of 10.3), they're much greater in metal. <br> <br>&gt; Some folks prefer [setting small metal type] <br> <br>But in terms of human physiology, it's harder, no? <br> <br>Wear: if you consider that wear is an absolute thing (for example the same amount of mils no matter the size), their effect must be proportionately greater the smaller the type. <br> <br>hhp <br></p>"
