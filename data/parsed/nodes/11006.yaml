    html: <p>Tiffany <br> <br>I was way too flippant about this. The price you paid seems way low but perhaps not necessarily so. If a printer is set up for this kind of work and has the right presses for the job, and is doing significant volume where they can standardize it a bit, yes, the price could get fairly low I'd suppose. I just don't see these kind of prices anywhere. I don't do wedding invites because I'm not set up for it and could not be competitive (like your friend, I just do fine press bookwork), but in the LA environs I'm seeing obscene prices being charged for not much effort. A couple of the bigger boutique letterpress outfits who do cater almost exclusively to weddings have me make their plates for them. Their prices are easily ten times what you paid.  <br> <br>Obviously, high price does not necessarily equal high quality, in fact, it rarely seems to. On the other hand, I think you were given a gift (?), and I wonder if this is their normal rate of charge. As Hrant suggested, I think also that the cost of plates would eat up a portion of the charge here. So your printer wasn't getting much for his effort.  <br> <br>But you never did say what they looked like. So I guess I should throw this back at you. Is cost more important than quality? And what is quality? Is letterpress a qualitative measure in and of itself?</p>
