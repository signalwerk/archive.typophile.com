    html: "<p>\"Do I pass?\" <br> <br>Are you on pass/fail basis or do you want a grade? I was thinking maybe an A+ (for thinking about stuff!!!). <br> <br>I guess when I furtively responded I was thinking about quality without really getting in to it. But since quality is difficult to evaluate I'd prefer to apply it to the work of persons who have a certain approach to their work which would include concern for appropriate materials, work attitude, experience, etc. To determine the quality herein, one, unfortunately, must share a lot of these characteristics. <br> <br>But when I said \"degrees of letterpress\" I was thinking of an easier way to define this. The degrees of letterpress are a combination of the above qualities of the printer as well as his or her equipment and technique. The latter is actually somewhat important in evaluating letterpress. They don't always follow but... <br> <br>At the high end, in cost/quality you would probably encounter folks using an iron hand press. These are less machine than tool and are quite labor intensive and require a great deal of skill, expertise and \"thinking.\" They also, for the most part, require dampened handmade paper. Most of the work here is fine book work. Not many of these folks around. <br> <br>A second step down, but not necessarily so, are folks working with hand-operated cylinder presses.   Dampened handmade paper is often used, and often not. Bookwork, broadsides, and the like but not so much jobwork, though occasionally. But you are somewhat dependent upon the operater here (lot a variation in quality and professionalism) and most folks running these kind of machines have rarely been trained in printing (in the traditional technical school way). <br> <br>Interchangeable somewhat with the above are fully functioning commercial letterpress shops running big automatic cylinder presses. Handmade papers are generally not applicable here but these folks (generally trained) are capable of running any kind of work, relatively fast, relatively good, and relatively cheaper. Professional grade work most of the time. These kind of operations are quite rare though. <br> <br>Bottom dwellers: motor driven platen job press operations. Job work, cards, stationery, labels, die-cutting, stamping, etc. Rarely capable of decent book work. Should be quite inexpensive (unless boutique), rarer to see good quality work, fast. <br> <br>Basically, operator somewhat aside, the more distancing the machine from the human hand, eye, and mind (not to mention heart), the cheaper in cost and quality. But not always so!!! <br> <br>My five minute attempt here to put a bit of a different spin on this.</p>"
