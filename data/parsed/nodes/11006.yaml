  html: "<p>Hi all. <br> <br>My gut feeling is that this is going to be a hard question to answer. Here goes: Is there a rule of thumb about the cost difference between letterpress and offset printing. Obviously in many ways this is like comparing apples and orangutans. <br> <br>Understanding of course, to get a solid answer, just request a quote. I'm in the dreaming phase and don't want to bother if the cost will be prohibitive. I'm out of New York City, the job is a promo piece called A little Book of Logos. 24 pages, 4x6 inches final size. It will be a mix or art/type so I think we're talking polymer plates rather than hand setting type. Oh, one color. Anyone hazard a guess? +20%  +50%  +100%? <br> <br>Thanks  <br>Randy</p>"
  html_clean: "<p>Hi all. <br> <br>My gut feeling is that this is going to be a hard question to answer. Here goes: Is there a rule of thumb about the cost difference between letterpress and offset printing. Obviously in many ways this is like comparing apples and orangutans. <br> <br>Understanding of course, to get a solid answer, just request a quote. I'm in the dreaming phase and don't want to bother if the cost will be prohibitive. I'm out of New York City, the job is a promo piece called A little Book of Logos. 24 pages, 4x6 inches final size. It will be a mix or art/type so I think we're talking polymer plates rather than hand setting type. Oh, one color. Anyone hazard a guess? +20%  +50%  +100%? <br> <br>Thanks  <br>Randy</p>"
