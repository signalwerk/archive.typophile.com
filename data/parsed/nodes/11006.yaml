    html: <p>Ah, "the potential for better results." There was the potential for better results with photofilm as well. Where you could stretch and crunch and whatever. Use negative leading, negative kerning, variation of point size, etc, all kinds of cool stuff. That turned out well for the "reader." <br> <br>I'm not, as you know, questioning what you have to say. But I think that much of the "better" of twentieth-century typesetting (with metal, photofilm, digital) would have been concerned with the needs of the reader. Limitations of technology and all. Digital is no magic pancea if the designer typesetter/designer doesn't share these concerns. <br> <br></p>
