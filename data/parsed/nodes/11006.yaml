    html: <p>&gt; "why do letterpress" if you can't see it? <br> <br>Because you can <i>feel</i> it. <br>It's subtle, "subvisible", the way you might not concsiously <br>notice a perfume, but it will "atmospherize" you anyway. <br> <br>Hard to sell, things that you can't fondle, I know. In fact, some people seem to enjoy letterpress because they like the feel of a lump of metal in the hand. This is problematic, in a number of ways. For example, it's display-centric (handling 9 point type is no fun compared to 60 point), and it has nothing to do (except maybe metaphysically) with the result, which is the only thing the <i>user</i> cares/needs_to_care about. <br> <br>One great thing about metal type though is it lets you physically appreciate why chirography is anti-typographic. Holding some large Palatino in my hand recently, I couldn't help but think "this is not right". It's supposed to be engraved - even though the illusion of the result can be convincing. <br> <br>&gt; quality is in the eye of the beholder. <br> <br>I myself would say that wholeheartedly about Beauty, but Quality is not so simple. <br> <br>hhp <br></p>
