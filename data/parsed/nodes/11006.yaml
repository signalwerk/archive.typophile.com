    html: <p>I think that quality is achievement and satisfaction. The concept of quality is used to evaluate the result of a process. <br> <br>From a nearly "objective" view i would say that a result that achieves the best from all of the measurable and perceptible characteristics that a process can deliver has the higest quality. <br> <br>From the final user perspective i would say that quality can be measured by the level of satisfaction the result produces accomplishing the expectations the user has on it. <br> <br>Quality can</p>
