    votes: null
    html: <p>Not "too painful," just very labor intensive. The ease at which digital allows for sizing and leading doesn't necessarily lend itself to optimal reading since very few designers will take the time or even know about such readability concerns no matter how less "painful" the computer is to compose on. The easier it gets, doesn't necessarily mean, the better it gets. <br> <br>Small metal type faces aren't actually that hard to set. Some folks prefer them. Its an experiencial thing. <br> <br>I'm not sure that wear or damage effects small type more. Hard to make that claim for foundry type, maybe for Monotype where the metal is softer and the smaller sizes might not hold well. <br> <br>Well, I always preferred the hunk of type, but like I said, some prefer the very tiny. I've set as small as 4-pt. Setting Copperplate Gothic in the 6-pt with its four ranged sizes within that size is a pain. Without a loop, hard to know sometimes if you are setting the cap I, the exclamation mark, or the figure 1. Even the proof and the printing can be deceiving at that size. But Copperplate is a bit of an anomoly because of its size ranging. <br> <br>But I think the more experienced one is at hand setting the less size is any kind of a preferencial matter. Actually, very large sizes are even more of a pain in the butt.</p>
