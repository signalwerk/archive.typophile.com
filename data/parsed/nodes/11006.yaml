    html: <p>The invitations were simple, not fancy, one color. Printed on Classic Columns Pistachio with a medium-dark grey ink. <br> <br><i>Is cost more important than quality?</i> <br> <br>No. I'd say that, for me, I try not to separate the two. In general, I can tell what my clients want/need and base my press (paper, ink, binding) selection on these things. If they want it quick, but don't want to pay a lot or if they want it quick, but quality is important ... well, I have different presses for different jobs. There are presses that I won't use based on the fact that they can't cut straight and often forget to call for press checking, even though they can outbid everyone. And I also don't use presses just because they have Philipe Starck chairs in their front office. Quality, Price, Time -- all important.  <br> <br>In this instance, this wedding invitation, as it was for a friend I wanted it too look good (quality). My friend had seen the letterpressed invitations while doing the rounds of wedding planning and saw how it added a little something special. So for her, quality meant letterpress. So I suggested letterpress. Now, it could be said that just because we printed letterpess doesn't mean the final project was of high quality. Letterpress doesn't necessarily equal high quality. Although I did use a pressman who does quality work. <br> <br>While your question is good, it's difficult to say without generalizing. Of course, I always want the final product to be quality and cost effective. I don't like the word "cheap", but I've been known to tell my rep that I need the paper to be "inexpensive". Cheap connotes trash and polyester. I don't like to think I do trash. <br> <br>Perhaps quality is in the eye of the beholder. You have been known to say that you shouldn't slam the paper into the plate. But, for some the question is "why do letterpress" if you can't see it? To protect myself, we didn't do any slamming on these invitations, only mild tapping.  <br> <br><img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> <br> <br><i> Is letterpress a qualitative measure in and of itself?</i> <br> <br>No. I don't think so. No amount of good inking and perfect padding can save a poor design. Or on the other hand, a good design can be made bad by poor press work. <br> <br><i>What is quality?</i> <br> <br>Quality is a combination of everything. But mostly, quality is in the eye of the beholder.  <br> <br>Thanks for the questions. I think everyone should answer these. It would make for a great discussion in and of itself. <br> <br>Do I pass? <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"></p>
