    html: <p>Well, I think that you cannot really claim this or that font as elementary. <br> <br>There are too many functions type has to provide. For example, do you need only a western character set, or also a CE version of the font? Or maybe a greek/cyrillic charset is needed as well? Would you use it for a newspaper or could it appear on a 30 square metre banner? <br> <br>For display fonts I think it is even harder to tell, not only because taste differs, but also because their impressiveness narrows their application much more than it would for a sans serif. Except if your basic font set includes 3.000 fonts...  ;-) <br> <br>To me, it is important that a font includes many styles and characters to be applicable to (almost) every possibility that could turn up, especially if I would use it as a basic or even a corporate font. Someone who has to design for print and screen as a whole would end up with a totally different list.&lt;/font&gt;</p>
