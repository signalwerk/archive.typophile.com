    html: <p>Interesting article, Steve! Although Nick's ideas are correct, I don't think that the typefaces he selected make a perfect group. But alot of that is subjective. Just because there would be almost no overlap between his list of the 22-must-have-fonts and mine (if I were to make a list) doesn't mean that his selection is incorrect in-and-of-itself. <br> <br>Aside from the article's being a tad stylistically and theoretically out of date, the one thing that requires re-evaluation is his comment about OpenType. Now, almost every major graphic application supports OpenType, or will support OpenType in the next version (Macromedia products being the exception). And, most type foundries seem committed to the idea of future OpenType development, including OpenType-only development, even if they aren't on that road yet. I think that it is same to bet that OpenType is the near and middle term future. In any event, OpenType isn't GX, and PostScript support will slowly soon disappear. <br> <br>Mike, what is your definition of 80s crap?</p>
