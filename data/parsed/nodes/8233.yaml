    html: <p>i think rather than certain faces, it's more important to have certain types of faces. I mean the perfect set would be different for a newspaper than from a magazine or a design firm. But I think a solid set should include a serif family (or 2 or 3) with all the bells and whistles, an extensive sans family, and a handful of display faces incuding a formal script, a blackletter, and others as needed. I think Scala and Scala Sans are excelent choices and a solid foundation from which to build.</p>
