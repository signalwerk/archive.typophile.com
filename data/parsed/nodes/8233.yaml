    html: "<p>Regarding must-have fonts: the Berthold library, many of which were developed during the eighties and sold through Adobe in the 90's, are still widely used in a variety of compelling applications. These remarkably versatile gems include Berthold's Poppyl Pontifex, Waldbaum, Garamond, Concorde, Formata, City, Azkidenz Grotesk, and Baskerville Book. I would include all of these on a list of must-have typefaces, even with the plethora of outstanding faces that have been developed since. <br> <br>Other must-have faces would include Din, Meta, FF Bau, FF Unit, Copperplate Gothic, Sabon, Gil Sans, Jenson, Fairfield, Octavian, and Transit (originally developed for Berlin's public transportation system; too bad we don't see much of it in the U.S.). Remember, too, that Adobe's flagship fonts during the era of Multiple Master technology were Minion and Myriad, and these faces set the stage for further directions from a variety of talented sources. They are still widely used today, for good reason. <br> <br>Looking at the choices made by designers these days, I see a lot of intriguing new fonts from Dutch foundries (primarily used in Europe, unfortunately), and lots of well known faces who've survived the rigours of style, including Chapparal, Trade Gothic, Frutiger, and even Engravers. I know I'm omitting a thousand more, but these are being successfully applied in important work and deserve recognition, and inclusion, in a working library.</p>"
