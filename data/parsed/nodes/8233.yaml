  html: <p>Greetings All ~ <br> <br>I seem to remember some time last year there was a thread around what fonts should be included in a basic collection - the must have workhorses. <br> <br>Does anyone remember this? I have done a quick search but could not find the original discussion. Can anyone help with a link to the thread? <br> <br>I want to embark on cleaning out my firm's 30 year old font collection - there is so much 80's crap in there it is killing me! I thought the Typophile tread I am asking about would be a good place to start research on replacements. <br> <br>Thanks <br> <br>Mike</p>
