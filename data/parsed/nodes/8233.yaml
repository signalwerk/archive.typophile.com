    html: "<p>1. Frutiger preferable to Myriad, yes, but far too expensive. The full Myriad family was, at the time, way less expensive than any other of the full-family sans serif options. <br> <br>2. I recommended Times New Roman, as a better cut of Times than the default system font. About the Canon: my principle was to include examples of a full range of contemporary relevant genres for students to work with -- Garamond, Times, and Century (aka Worldwide) were the classic serif faces. It would have been nice to also include a Didone, that is the biggest gap, I think, in the selection. Bear in mind that this is a working tools selection, not a type-history selection. <br> <br>3. Zapfino and Hoefler Text: my principles state that in order not to confuse students, there should be a limited number of fonts, one example of each major genre, and not typefaces that are quite close. Snell is the fine classic script, and Adobe Garamond is the Garamond. <br> <br>4. You are agreeing with what I wrote: I did actually mention the 1920s hot-metal Baskerville revival, as well as the ITC. <br> <br>5. Mrs Eaves: as I said, Adobe Garamond was chosen as the classic small x-height face with all the bells and whistles.  <br> <br>6. Do the math. The Myriad package was (at the time) by far the best deal for a full-family sans. <br> <br>7. The Myriad package was not MM -- it was a collection of instances. <br> <br>8. Student discounts: things have changed, and much is negotiable. At the time, and working with FontShop Canada (no longer a franchise), there wasn't too much of a discount for colleges. <br> <br>9. It's more important to give students the opportunity to work with fonts in a wide range of contemporary, relevant genres (including a few classic serifed faces), than it is to bore the pants off them with fancy theoretical distinctions between historical/national sub-genres (I've tried that, and it creates a very bad vibe -- leave it for the MA!) BTW, I am no big fan of patriotism (I mentioned it somewhat tongue-in-cheek), but yes, supporting your local type designers is a worthy cause. <br> <br>10. The Chalet styles: 60 does Helvetica/AG; 70 does Pump/Bauhaus; 80 does Avant Garde/Futura. In three weights, that's an excellent deal and a good way to cover the basics, the theme of this thread. Also, Chalet begs the Post-modern question of just how rational the modern movement was, and how much it was about cool, understated style: a good question to ask, especially in school. <br> <br>11. Officina is more \"technical\" than Meta. Note letterforms of cap I and l, and the open fit. Perhaps DIN would be another choice to \"cover this base\". <br> <br>Dan, you can pick away at the details of my selection, but I challenge you to produce your own \"Perfect Set\" under similar budgetary constraint.</p>"
    html_clean: "<p>1. Frutiger preferable to Myriad, yes, but far too expensive. The full Myriad family was, at the time, way less expensive than any other of the full-family sans serif options. <br> <br>2. I recommended Times New Roman, as a better cut of Times than the default system font. About the Canon: my principle was to include examples of a full range of contemporary relevant genres for students to work with -- Garamond, Times, and Century (aka Worldwide) were the classic serif faces. It would have been nice to also include a Didone, that is the biggest gap, I think, in the selection. Bear in mind that this is a working tools selection, not a type-history selection. <br> <br>3. Zapfino and Hoefler Text: my principles state that in order not to confuse students, there should be a limited number of fonts, one example of each major genre, and not typefaces that are quite close. Snell is the fine classic script, and Adobe Garamond is the Garamond. <br> <br>4. You are agreeing with what I wrote: I did actually mention the 1920s hot-metal Baskerville revival, as well as the ITC. <br> <br>5. Mrs Eaves: as I said, Adobe Garamond was chosen as the classic small x-height face with all the bells and whistles.  <br> <br>6. Do the math. The Myriad package was (at the time) by far the best deal for a full-family sans. <br> <br>7. The Myriad package was not MM -- it was a collection of instances. <br> <br>8. Student discounts: things have changed, and much is negotiable. At the time, and working with FontShop Canada (no longer a franchise), there wasn't too much of a discount for colleges. <br> <br>9. It's more important to give students the opportunity to work with fonts in a wide range of contemporary, relevant genres (including a few classic serifed faces), than it is to bore the pants off them with fancy theoretical distinctions between historical/national sub-genres (I've tried that, and it creates a very bad vibe -- leave it for the MA!) BTW, I am no big fan of patriotism (I mentioned it somewhat tongue-in-cheek), but yes, supporting your local type designers is a worthy cause. <br> <br>10. The Chalet styles: 60 does Helvetica/AG; 70 does Pump/Bauhaus; 80 does Avant Garde/Futura. In three weights, that's an excellent deal and a good way to cover the basics, the theme of this thread. Also, Chalet begs the Post-modern question of just how rational the modern movement was, and how much it was about cool, understated style: a good question to ask, especially in school. <br> <br>11. Officina is more \"technical\" than Meta. Note letterforms of cap I and l, and the open fit. Perhaps DIN would be another choice to \"cover this base\". <br> <br>Dan, you can pick away at the details of my selection, but I challenge you to produce your own \"Perfect Set\" under similar budgetary constraint.</p>"
