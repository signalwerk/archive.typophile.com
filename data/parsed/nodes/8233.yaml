    html: <p>&gt;theoretically out of date, <br> <br>In what way Dan? <br>My theory is stated in six principles on page one of the article, and I go on to explain why using these principles to build an educational font library will lead students towards typographic literacy. <br> <br>I took particular care to debunk the "single source, one volume" strategy.  <br> <br>I mentioned the alternate minimalist approach. <br> <br>What new theories (or refinements) of library-building have emerged since 2001?  <br> <br>(OpenType would certainly throw a wrench into the calculations, but it doesn't effect the theory.) <br> <br>&gt;a lot of that is subjective.  <br> <br>Of course. All choice is. But the set I selected was primarily determined by having to fit the criteria of my principles (as well as a fixed budget) -- so I ended up choosing many faces which I no longer favor personally, such as Adobe Garamond, and others which I have never taken to, such as Matrix. <br> <br>For a working professional, a more subjective "Perfect Set" than the one I proposed to a college would be easier to work with, although of necessity conscientious designers often end up making aesthetic choices tailored to the projects they're working on, not their own tastes. <br> <br>One omission in the article is that, although the exercise was conducted to a budget, the final total is never mentioned! It was $11,800 (Canadian), for a 50-user licence. That was in 2001.  <br> <br>If you are really serious about the subject of this thread, and not just fantasizing about desires, ya gotta do the math!</p>
