      <p>Personally I think it's better to err on the side of caution, lest people who make type (you know, the people making the things being IDed...) think this place is disreputable (I mean even more than it's become...) and we keep losing actual content generation.</p>
      <p>It's not like there aren't enough legitimate alternatives out there.</p>
      <p>--</p>
      <p>And allow me to clarify something: when I point out that a given font recommendation is potentially tainted, don't take it personally; it's not an attack more than it is a defense. However I am indeed critical of one thing: not caring.</p>
      <p>hhp</p>
