      <p>Titillium Text is very well known free typeface.<br>
      <a href="http://www.google.com/webfonts/specimen/Titillium+Web" title="http://www.google.com/webfonts/specimen/Titillium+Web">http://www.google.com/webfonts/specimen/Titillium+Web</a><br>
      You could also do your own detective work and try to teach us (me at least) what is legal and what is not. I don't have your knowledge or skills (that's why I only participate here, posting elsewhere would be irrelevant, senseless and probably stupid) but I'm a font lover. My quest (my obsession I should say) is to know them all :) And I try, as much I can (know) not to recommend what I suspect to be illegal or outline theft. But you'll have to admit that the font world is quite nebulous, dark and blurry where the big ones are probably the biggest thieves (cf previous discussion on Triplett). Reliable information is also very hard to find.</p>
      <blockquote><p>
      Titillium is born inside the Accademia di Belle Arti di Urbino as a didactic project Course Type design of the Master of Visual Design Campi Visivi.<br>
      The aim of the project is the creation of a collective fonts released under OFL. Each academic year, a dozen students work on the project, developing it further and solving problems. Any type designer interested in the amendment or revision of Titillium is invited to co-operate with us, or develop their own variants of the typeface according to the terms specified in the Open Font license. We also ask all graphic designers who use Titillium in their projects to email us some examples of the typeface family in use, in order to prepare a case histories database.<br>
      Three years after the birth of Titillium, the project is still evolving, and even we don’t know what it will become in the future.<br>
      Special thanks go to:<br>
      Prof. Luciano Perondi, design and curation<br>
      Prof. Marcello Signorile, coordination<br>
      Prof. Manuel Zanettin, web project supervision<br>
      Diego Giusti, design of the first prototype
      </p></blockquote>
