      <p>This example helps to show why I think sans italic faces are the hardest things to ID. To me that ’a’ looks nothing like any form of Gill Sans, but so many sans faces have this sort of look. I think it’s <a class="freelinking-external" href="http://www.typography.net/type/bliss.htm">Bliss</a> myself.</p>
      <p>- Mike Yanega</p>
