  html: |-
    <p>Hello Typophiles, </p>
    <p>I'm looking for a font pairing to get with Sirba Web. I'm looking to use Sirba for headlines on my blog. I'll also be using the italics for use sparsely throughout for things like metadata and other small type. </p>
    <p>I'm looking for a sans-serif pairing to go with Sirba for the body copy. Dagny comes to mind.</p>
    <p>I'm new to all of this, so go easy on me. And all ideas will be considered. I'm not locked into a sans to go with Sirba. I'd consider Sirba at a different weight as body copy or Sirba as the body copy and a sans as the headlines.</p>
    <p>What do you guys think? Thanks in advance!</p>
    <p>Here is the link to Sirba: <a href="http://typekit.com/fonts/sirba-web" title="http://typekit.com/fonts/sirba-web">http://typekit.com/fonts/sirba-web</a><br>
    Here is the link to Dagny: <a href="http://typekit.com/fonts/ff-dagny-web-pro" title="http://typekit.com/fonts/ff-dagny-web-pro">http://typekit.com/fonts/ff-dagny-web-pro</a></p>
