    html: |-
      <p>Lion -- and its predecessor, Snow Leopard -- does not natively support Type 1 fonts. Anything you got on an older machine had to do with its older OS. Equally, anything you get now with your Lion setup <em>must</em> be courtesy of FontExplorer, because it cannot be the system itself.<br>
      So check if FEX has a history, dealing with Type 1 fonts.</p>
