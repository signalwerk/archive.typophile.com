    html: |-
      <p>Many have said that the days of Postscript Type 1 support at the system level are numbered. It appears that with Lion &amp; Snow Lion those days have run out.</p>
      <p>Because it uses its own font-rendering engine, Adobe is likely to privately support Postscript Type 1 longer than the Macintosh operating systems, although perhaps unofficially. So, making the fonts available to Adobe apps via one of the Adobe Application or Application Support &gt; Fonts folders will enable Postscript Type 1 fonts to be fully functional even when they are not otherwise supported (but only within the Adobe suite).</p>
      <p>As you have discovered, Jeffrey.</p>
    html_clean: |-
