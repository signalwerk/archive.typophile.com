    html: |-
      <blockquote><p>Lion -- and its predecessor, Snow Leopard -- does not natively support Type 1 fonts.</p></blockquote>
      <p>Aside from the fallback Multiple Master fonts in the System/Library/Fonts folder, no Postscript data is distributed with the operating system (referring specifically to Lion 10.7.3) but it is possible to add Macintosh formatted Postscript Type 1 fonts to the system font folders. I was able to add a Postscript Type 1 collection to the Library/Fonts folder which was then recognised by FontBook and picked up by TextEdit, Word 2011 and Adobe CS6.</p>
