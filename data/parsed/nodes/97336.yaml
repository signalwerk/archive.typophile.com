      <p>...and asking them for every single thing makes you look as if you're just creating what they told you. So they don't actually need you to charge them more than any school kid would to just put pieces together.</p>
      <p>A nice questionaire at the beginning with letter forms, shapes, colours is a nice test to ask them what they relate each of these shapes to? And then from their brief of the company get the actual liking what will fit their mind. While also giving you enough space of creativity.</p>
