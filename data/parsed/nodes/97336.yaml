    html: |-
      <p>&gt; I've always been confused about the meaning of elegant</p>
      <p>Words like "elegant" can mean different things to different people. </p>
      <p>Same thing with color names. Google a descriptive color name (such as "teal") and you'll see considerable variations. If a client tells me they want a certain color, I pull out a swatch book and make sure we're both thinking of the same thing.</p>
