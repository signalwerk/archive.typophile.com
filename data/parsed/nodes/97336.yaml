  html: |-
    <p>I'm creating a logo for an interior design/architecture company, attached image is one of my proposals, but the client keep telling that he need more elegant typeface. I've tried san serif fonts like gill sans and skola sans.<br>
    What does he mean by elegant? is it like bodoni/didot, or some scripts or what?</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/3_5327.png"></div><br>
    here is my client comment for this design:-<br>
    " Can try to add color yellow in the name HAITHAM JAFFER OR in TAG LINE<br>
    tag line font size to be revised<br>
    try to change name HAITHAM JAFFER font to be more elegant"<p></p>
    <p>Any suggestion for the font(preferably free)? especially something that suits interior design/architecture company</p>
