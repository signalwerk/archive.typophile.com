    date_raw: 29 Feb 2004 — 10:04pm
    votes: null
    html: <p>The word spacing (not letter spacing) in "da costa" is still a little much compared to the spacing in "carlos felicio". Even if the spacing was the same mathmatically/technically, optically the height of the red "f" and the lightness of the silver make it feel more open in comparison. <br> <br>I don't necessarily think the logo/title needs to be on the backside of the card. In fact, the value of the red as an identifier is stronger without the name. In other words, with the presence of the logo/title you focus on the company name, but without it you focus on the flooded red color, which might be a distinguishing factor in their visual communications (if they do much of it). <br> <br>Aloha! <br>Scott</p>
