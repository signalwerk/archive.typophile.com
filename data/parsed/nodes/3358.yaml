    html: <p>Verrrry beautiful, although I'm not sure about the MetaDesign-esque rectangular at the bottom, it has a kind of 80s feeling that doesn't really mesh with the rest. Other than that, ligatures and everything.. nice and solid for a lawyer.  <br>I like the red, btw. It fits the PMS877 and isaggressive, which I'd personally say is a GOOD quality in a lawyer (as long as he is on your side). Blue is such a standard colour for advocats, as is dark green. Red is it, if you ask me. The first feeling is often the right one. If you know the guy -- is he more agressive or more a laid back person? if the former, go ahead with red. Maybe you can use a bit of a darker tone to mellow it a bit, if need be.  <br> <br>Uncoated paper with such a full bleed CAN work, if the prrinter knows what he does and the type isn't too small. Imo, the subtle inclusions and structures in the paper, the small imperfections ARE what makes it work in that case.  <br> <br>The right hand card in the first example has such a nice red background and the type is neat, if it technically is workable, you should use that, with a motto or something.  <br> <br>Btw, the only thinhg I don't like is the arrangement of the type on the card-front. It looks much nicer on the back in the left-hand example, more symmetric and in-the-middle, a better use of proportion and white-space. </p>
    html_clean: <p>Verrrry beautiful, although I'm not sure about the MetaDesign-esque rectangular at the bottom, it has a kind of 80s feeling that doesn't really mesh with the rest. Other than that, ligatures and everything.. nice and solid for a lawyer.  <br>I like the red, btw. It fits the PMS877 and isaggressive, which I'd personally say is a GOOD quality in a lawyer (as long as he is on your side). Blue is such a standard colour for advocats, as is dark green. Red is it, if you ask me. The first feeling is often the right one. If you know the guy -- is he more agressive or more a laid back person? if the former, go ahead with red. Maybe you can use a bit of a darker tone to mellow it a bit, if need be.  <br> <br>Uncoated paper with such a full bleed CAN work, if the prrinter knows what he does and the type isn't too small. Imo, the subtle inclusions and structures in the paper, the small imperfections ARE what makes it work in that case.  <br> <br>The right hand card in the first example has such a nice red background and the type is neat, if it technically is workable, you should use that, with a motto or something.  <br> <br>Btw, the only thinhg I don't like is the arrangement of the type on the card-front. It looks much nicer on the back in the left-hand example, more symmetric and in-the-middle, a better use of proportion and white-space. </p>
