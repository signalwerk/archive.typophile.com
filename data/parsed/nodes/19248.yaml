    <p>I need a bit of help selecting a text face for a publication I’m redesigning. We have no budget for purchasing new faces, but have several from the Adobe suite. I put a star next to the faces to which i’m leaning toward:</p>
    <p>Minion +<br>
    Warnock<br>
    Giovanni<br>
    Berling +<br>
    Garamond<br>
    Utopia<br>
    Rotation<br>
    ITC Stone Serif +<br>
    Caslon +</p>
    <p>The publication will be printed on a higher-quality newsprint. Not bright white, but not the cheap junk you see everyday. The publication is an annual city guidebook. It will have several feature stories and have an overall warm and inviting feel. </p>
    <p>I like Caslon for its readability, but i feel like it less suitable for a magazine-style publication. I love Minion, but one of our other publications uses it as a text face. Berling is nice, but i wonder if it would hold up on the newsprint. </p>
    <p>Any thoughts would be greatly appreciated.</p>
    <p>-Roy</p>
