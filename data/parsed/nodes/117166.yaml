      <p>&gt; the client is requesting a mini brand manual </p>
      <p>If you Google "Brand Manual" (or similar phrases) you should be able to find some examples in PDF format, although they may be more detailed than you need.</p>
      <p>It may help if you consider what the manual will be used for. If your client will be using people with design training to put together their pieces, you might be able to rely on their training and good judgement and focus on factual issues such as the fonts, colors, general look of the pieces, etc.  </p>
      <p>But if it's to help people with NO design training to put pieces together (for example if a secretary is asked to create a booklet) then you need to give more detailed instructions to avoid them making beginner's mistakes (don't make the logo too small, keep some blank space around it, don't put it on a patterned background, use a white logo if on a dark background, etc.).</p>
      <p>&gt; how to set some rules for the individual<br>
      &gt; sizes of symbol and logotype? </p>
      <p>This is largely determined by the designer's judgement. All  you can do is create some general guidelines and show examples for common situations. If you find some PDFs of other manuals that might help.</p>
      <p>&gt; B/W version not dynamic</p>
      <p>Well you could make it grayscale to get the overlap effect, but I wouldn't worry too much about the black-and-white version unless your client is still printing a lot of booklets that way. In the past a b&amp;w version was extremely important, but it's less so today since so much communication is via the internet, PDFs, emails, and other situations where color is free.</p>
