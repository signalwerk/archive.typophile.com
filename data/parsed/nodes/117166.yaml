      <p>I know B&amp;W is still important for social media sites, as an example, because a lot of other websites link to them, and often use a custom webfont with social media logos to do so. Since the twitter bird is just one color, it easily looks good as white on black, black on white, or in the traditional blue.</p>
      <p>I like the all-red logo, especially because of the bigger negative space / outline in the middle of it. Hate how the other one was pencil thin. And I like that it's all red too, looks nice in B&amp;W, and it sort of looks like a dinosaur footprint which makes me extremely happy. (I'm going to go ahead and assume the company makes dinosaur skeletons for museums) :)</p>
