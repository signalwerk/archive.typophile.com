    <p>Hi Philes!</p>
    <p>I've been working on a brand refresh for a company focused on fashion entertainment.<br>
    The original logo was perfect for at startup at that time, but their strategy has changed alot since then... and therefore a logo-update has become a hot topic :-)</p>
    <p>The logo is loosly based on some spikes seen in Tryon Park in New York, where the founders got the idea for the company.</p>
    <p>The problem with the current logo is alignment-issues, not very legible in small sizes and lack of character - especially in B/W... and so on.<br>
    I've included some excerpts from the presentation.</p>
    <p>Anywhooo... I've recently presented a new redesign which they love and we are starting to plan the roll out of the identity.<br>
    The new design is more simple and with respect to the original idea.</p>
    <p>But I'd really like your input on how to properly set some guidelines for this logo - I mean, how to set some rules for the individual sizes of symbol and logotype? Until now I've only done this by eye and simple guides - and the client is requesting a mini brand manual now and my experience is rather vague.</p>
    <p>So please guide me you cool type-people :-)</p>
    <p>Thanks!!</p>
    <p>/S</p>
