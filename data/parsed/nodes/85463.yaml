  html: |-
    <p>I'm designing an iron gate, and the client wants lettering in it, both upper and lowercase. Can you suggest a font that would look suitable in this material? They're looking for something regal, elegant, not too decorated but somewhat "script-y" - like something you might find on the entrance to a palace, or perhaps the logotype of a fancy hotel...</p>
    <p>Here are some references:</p>
    <p><img src="http://ezitis.myzen.co.uk/qamh14.jpg"><br>
    <img src="http://www.classical-composers.org/uploads/place/2631/10/d07.1.11.jpg"><br>
    <img src="http://www.featurepics.com/FI/Thumb300/20090510/Buckingham-Palace-Gate-1178042.jpg"><br>
    <img src="http://apexembdesigns.com/files/imagecache/product_large/regal.jpg"></p>
    <p>Any ideas?</p>
