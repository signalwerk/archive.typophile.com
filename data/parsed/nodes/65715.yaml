  html: |-
    <p>The typefaces that tend to be suggested as alternatives to the much-maligned Papyrus have not seemed to me to even resemble it all that much. I thought I would dig around a bit, and find other possibilities.</p>
    <p>Some of these, though, others have mentioned; I wouldn't want to leave out the best ones.</p>
    <p>Ereshkigal (Scriptorum)<br>
    Codex (Linotype) [Calligraphic 421 (Bitstream)]<br>
    Present (Adobe) [President (Letraset)]<br>
    Scrivano (Outras Fontes)<br>
    Fran Hand (Signs of Gold)<br>
    Sonopa (Kenneth Woodruff)<br>
    Hermanita; Yngreena; Ingriana Casual; Federhosen (Ingrimayne Type)<br>
    P22 Lindrum (Sherwood Type)<br>
    Brinar; Albe Sans; Arturo; Altra; Altra Two (Hackberry)<br>
    Stellar Classic SG (Spiece Graphics; Ludlow)<br>
    Jubilee (Red Rooster; Stephenson Blake)<br>
    URW Alcuin Light<br>
    Ondine (Linotype, Monotype Imaging, Adobe, URW) [Formal Script 421 (Bitstream)]<br>
    Yan Roman JY (JY&amp;A)<br>
    Maiandra (Galapagos)</p>
