    html: "<p>Incidentally, I discovered that Elsner &amp; Flake Papyrus is slightly different from other versions of that typeface: the capital letters are larger, and have a baseline below the line. A sample of that face which I saw on a web site matched Ereshkigal but not Papyrus because of that.</p>"
