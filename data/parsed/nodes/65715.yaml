      <p>I was looking for a specific font, and did not have an image handy to use the search feature on MyFonts. That worked very well in finding Adobe Present for me, but for some reason its "fonts like this" feature seems to go all over the map.</p>
      <p>I was looking for a font that looked a bit like Kingthings Petrock, but plainer - more like Post Roman, for example.</p>
      <p>That doesn't even seem to exist; I found EF Karonlinger, Post Antiqua (and Scriptuale), Lucida Casual, and I even found EF Medieva... which looks like the old Magic: the Gathering font!</p>
      <p>... oh, and did I mention Sanvito?</p>
