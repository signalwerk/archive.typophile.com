    html: |-
      <p>Paradigm: apart from Cooper Black, I don't know of any other faces with convex serifs.<br>
      So convex-on-on-the-bottom, sharp-on-the-sides is a new idea.</p>
      <p>Beaufort: the serifs have an (almost) asymptotic construction, so that they are very sharp at any size, without optical scaling:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Beauf_4701.png"></div><p></p>
      <p>These ideas may or may not be particularly useful typographically, but they are contemporary in a way that decorative serif styling is not.</p>
