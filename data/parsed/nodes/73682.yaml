    <p>Hi Everyone</p>
    <p>I am looking for examples of contemporary serifs. </p>
    <p>Is there something like that? Would it simply mean serifs developed in the last couple of years, or is there something distinctly different about the design, the style of the characters? I have been looking at Fedra Serif, Mrs Eaves, Farnham even some slab fonts like FS Clerkenwell. Are they seen as contemporary? Or is there something else I'm missing.</p>
    <p>Best<br>
    Gustav</p>
