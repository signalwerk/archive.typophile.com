    html: |-
      <p>DejaVu's glyphs are mostly unchanged from Vera Sans Mono. The goal of the <a href="http://www.dejavu-fonts.org/" title="Main Page - DejaVu" rel="nofollow">DejaVu font project</a> is to expand and improve on the character sets of the Vera families in an open-source environment.</p>
      <p>Panic Sans is based on DejaVu. The changes are fewer than Menlo's—mostly the B, e, hyphen and underscore are the only noticeable differences between Panic Sans and DevaVu/Vera.</p>
      <p>All the fonts share the same weight width and line-height.</p>
    html_clean: |-
