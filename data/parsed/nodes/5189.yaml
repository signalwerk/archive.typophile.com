    html: <p>Green lobbiests, eh? <br> <br>Have you tried any variations to the "u-g" yet? I'd be interested to see what the form would look like if the "g" continued a bit further up the left side (curling around a little before it was cut off) and then adding a tail to the bottom right of the "u". Adding a tail would require pulling the right side of the "u" in a little. Doing something like that might create more of an organic transition, rather than a bold "u" attached to bottom half of a "g". <br> <br>By using the green color, I don't think there is any need for a sun representation. For several years now green has been a strong indicator for earth sensitivity. My guess is that politicians rarely look forward to correspondence/communication with green peace activists, so I think a more subtle approach might help their acceptability. <br> <br>Aloha! <br>Scott</p>
