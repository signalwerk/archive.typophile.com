    html: <p>I agree with Ole about the unhappy style mix, the the "u+g" is basically a clever ligature - a sound trick in logo design, no? But you're right that the "u" is too dark - or actually maybe the "g" is too light. Plus the "g" is cramped (which is natural in a [texty] font, but not a logo). <br> <br>I was trying to think how best to incorporate a sun/rays into it, and I was thinking you could make the left stem of the "u" curl around in a circle, and put the rays on the top-left of it (and maybe give the "u" a full stem on the right to reinforce its identity*). But then I thought maybe you should incorporate a leaf instead? <br> <br>* Which you might do even if you leave the "u+g" structure as-is. <br> <br>&gt; .... a more subtle approach might help their acceptability.  <br> <br>Good point. <br> <br>hhp <br></p>
