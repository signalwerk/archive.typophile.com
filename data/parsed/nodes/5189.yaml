    html: <p>I like these two alot. They feel complete, but if you want to get nitpicky than here we go. In my personal opinion the 4 leafs should be 5, for the simple reason that an odd number is more appealing than an even one. It might look funny, but give it a shot. Think of the leaf arrangement in terms of a half circle tilted at a 45 degree angle. Right now my eye sees the leaves arranged in an un-even fashion, but that's just an opinion. <br>It is important to have the invisible diagonals going through the mark at key places(sorry if that, makes no since).  <br> <br>Due to the asymetrical logo form you have created you might find it necessary to try some asymetrical lockups with the tagline, which Might work might not. Right now my eye reads the logo and then reads GRUN, and then reads UnternehmensGrun. It feels like the balace of information is a little skewed.  <br> <br>Finally What does the variations of tones in the leaves symbolize. For me it feels a little to decorative and less direct. I would stick with one solid green, it seems more powerful that way, Unless there are conceptual reasons for tonality changes. <br> <br>However, with that said. This is a really beautiful mark, congradulations.</p>
