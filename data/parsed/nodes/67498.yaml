      <p>Frank, I don't think all the facts you quote from the thread wormwood pointed to will make the font look "Norwegian" to customers of a travel agency. People planning their first holiday in Norway will not say "hey, that looks like the writing on Norwegian phone booths" ;-)<br>
      That's one thine often overlooked when someone asks for a theme font: Most people looking at printed paper don't immediately associate the nationality of the font designer. The more the typeface business becomes international, the less a particular font has a local flavour. Maybe we have to get used to it that not every idea or feeling can be conveyed by a font.</p>
