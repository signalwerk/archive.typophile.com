      <p><a href="http://www.fjordtours.com/en/" title="http://www.fjordtours.com/en/">http://www.fjordtours.com/en/</a></p>
      <p>CONCEPT OF THE BRAND:<br>
      The concept behind our brand is inspired by the Norwegian ‘friluftsliv’<br>
      philosophy, meaning ‘free-air living’. This restorative way to engage and live with nature is at the heart of our holidays.<br>
      --</p>
      <p>TARGET AUDIENCE:<br>
      one of the largest categories of client revealed in market research was ‘educated urbanites’ – wealthy<br>
      professionals who could afford to take five-star, luxury holidays but want adventure instead.</p>
