    html: <p>Gerhard Munthe's Draumkvæde-typeface is a good suggestion, it's very relevant to the dragon style-architecture of 1880–1915 (a Norwegian take on art nouveau, rooted in Viking-æra and Northern mediæval ornamentation), that's still very visible on popular tourist destinations here. See it <a class="freelinking external" href="http://www.bildesalg.no/fontdatabase/samples/TE102577.gif" rel="nofollow">here</a> (in Torbjørn Eng's nice interpretation), order it <a class="freelinking external" href="http://www.luth.no/default.asp?side=fontprisliste&amp;Searchstring=Frisianus" rel="nofollow">here</a>.</p>
