  html: <p>I don't think the way these letters bounce is part of the font. I suspect this may be a heavy weight of Helvetica Condensed in which each of the letters has been set individually.  <br> <br>(Also, in the future, please use a more unique title for your post, like 'Aftermath letters', so we can tell it from other posts.)</p>
