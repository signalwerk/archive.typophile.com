    html: <p>It’s a brilliant marketing gimmick. Months after the release of the software, people are <em>still</em> going on about the icons. Which is, somewhat surprisingly, more than I can say about the rest of CS3. I sort of assumed that the new Photoshop features and the new interface would at least be getting some nice attention, but maybe Adobe’s fast-paced release cycle is putting people off.</p>
