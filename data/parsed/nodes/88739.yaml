  html: |-
    <p>The January 2012 edition of the Metal Type newsletter is now out.</p>
    <p>Lots to tell you about as usual. Plenty of new stuff was added to the site during December.</p>
    <p>To take a look at this month's video newsletter (now available in HD), click this link:<br>
    <a href="http://www.metaltype.co.uk/rail/clicks/click.php?id=17" title="http://www.metaltype.co.uk/rail/clicks/click.php?id=17">http://www.metaltype.co.uk/rail/clicks/click.php?id=17</a></p>
    <p>This month's "additional footage" is of a brand new giant observation wheel that has been erected here in the historical city of York, here in the UK. You can see what it's like to take a spin on that wheel.</p>
    <p>Still not subscribed to the Metal Type monthly newsletter?<br>
    Click the link below to enter your details:<br>
    <a href="http://j.mp/n3wkjc" title="http://j.mp/n3wkjc">http://j.mp/n3wkjc</a><br>
    Just one email per month, usually on the first.</p>
    <p>All the Best<br>
    Dave Hughes<br>
    York, UK</p>
