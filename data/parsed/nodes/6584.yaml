    html: <p>For Arnold Boecklin, I'd do searches for shorter parts of the name, like "Arnol" and "Boe" in file names. (Thanks to the naming conventions of Type 1 fonts.) <br> <br>The correct spelling uses an o with dieresis (umlaut) not oe or plain o. So these are just different renderings of the full name. <br> <br>As for Brioso's place in font menus, that's just a bug. It may be partly the OS's fault, but we hope to fix it in future releases of our affected applications. <br> <br>Finally, I think Nathan is referring to a registry hack that allows a font which has extended langauge support to show up as several "virtual" single-byte fonts. So instead of just Brioso Pro, you could get also "Brioso Pro (CE)" and so on as separate fonts that would work like single-byte fonts in non-Unicode apps. <br> <br>Regards, <br> <br>T</p>
    html_clean: <p>For Arnold Boecklin, I'd do searches for shorter parts of the name, like "Arnol" and "Boe" in file names. (Thanks to the naming conventions of Type 1 fonts.) <br> <br>The correct spelling uses an o with dieresis (umlaut) not oe or plain o. So these are just different renderings of the full name. <br> <br>As for Brioso's place in font menus, that's just a bug. It may be partly the OS's fault, but we hope to fix it in future releases of our affected applications. <br> <br>Finally, I think Nathan is referring to a registry hack that allows a font which has extended langauge support to show up as several "virtual" single-byte fonts. So instead of just Brioso Pro, you could get also "Brioso Pro (CE)" and so on as separate fonts that would work like single-byte fonts in non-Unicode apps. <br> <br>Regards, <br> <br>T</p>
