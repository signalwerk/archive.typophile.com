    html: <p>These "virtual fonts" that Thomas mentioned make it possible for applicatios like QuarkXPress, that are only capable of accessing the first 256 chars in any font, to properly access different codepages in multilingual OpenTypes. Under MacOS X this would be just as vital - does anybody know a similar workaround?</p>
