    date: 2004-09-22T13:22:00
    date_raw: 22 Sep 2004 — 1:22pm
    votes: null
    html: "<p>Thomas, thanx for the reply. What you said of QXP was true of versions 4 and 5, but some brains here in Russia hacked that a with an OS 9 system extension - I can share it if anyone needs. But QXP 6.1 under OS X seems to have no problem handling Cyrilic and CE fonts, at least those created by FL4.6. I will recheck that tomorrow - not sure if the version I used was single-language and not Passport. <br> <br>As for that Mac hack I was asking about, there definitely is something, the question is whether it can be put to easy use: on a MacOS X system with a cyrillic keyboard layout installed, the LucidaGrande font, while represented as a single file, shows in font menus as 2 instances: LucidaGrande and LucidaGrande CY simultaneously. It's not a regular OpenType though, but a datafork TruType...Keeps me wondering.</p>"
    html_clean: "<p>Thomas, thanx for the reply. What you said of QXP was true of versions 4 and 5, but some brains here in Russia hacked that a with an OS 9 system extension - I can share it if anyone needs. But QXP 6.1 under OS X seems to have no problem handling Cyrilic and CE fonts, at least those created by FL4.6. I will recheck that tomorrow - not sure if the version I used was single-language and not Passport. <br> <br>As for that Mac hack I was asking about, there definitely is something, the question is whether it can be put to easy use: on a MacOS X system with a cyrillic keyboard layout installed, the LucidaGrande font, while represented as a single file, shows in font menus as 2 instances: LucidaGrande and LucidaGrande CY simultaneously. It's not a regular OpenType though, but a datafork TruType...Keeps me wondering.</p>"
