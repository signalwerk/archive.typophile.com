  html: |-
    <p>This font is a sans serif in the traditional context. I like to think of this as a whimiscal font that can be used in text blocks. <br> <br>I want to release this as a free font, so I'm trying to get everything just about right. The first link is the letters and some punctuation, and the second is a poem written by a good friend of mine set to Whipple. They are *.swf files so zoom in and tell me what you think of the letter forms, fixes for spacing, etc. <br> <br>Thanks! <br>tim <br> <br></p>
