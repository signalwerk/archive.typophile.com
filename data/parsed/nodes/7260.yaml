    html: <p>tim <br> <br> i like it, it has a script character but with some corrections it can stand like a text font. <br> <br>i think you should fix some letters that are to rigid and doesn't belong to you font personality.( E, F, h, z, 8, v, Z, Y, X), they shouild be solved in a less shy way. <br> <br>BTW, i think the kerning in the poem is to tight, loose it a little bit. <br> <br>CG</p>
