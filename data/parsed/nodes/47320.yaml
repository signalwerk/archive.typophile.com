      <p>It is certainly possible. In the 1980s my brother and I<br>
      made an Arabic font for the Commodore64: 8×8, with<br>
      the bottom row unused! And it was entirely readable.</p>
      <p>These days I make bitmap fonts with grayscaling:<br>
      <a href="http://www.themicrofoundry.com/manademo/" title="http://www.themicrofoundry.com/manademo/">http://www.themicrofoundry.com/manademo/</a><br>
      If this were applied to Arabic it would certainly help!</p>
      <p>hhp</p>
