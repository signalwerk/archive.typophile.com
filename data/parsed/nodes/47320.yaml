    <p>I’m trying to find an acceptable Arabic font that can be the basis for generating and displaying preferably in 8 wide x 16 high pixel characters, or alternately 16 x 16.</p>
    <p>Is that possible considering the complexities of Arabic ?</p>
    <p>All suggestions welcome</p>
    <p>Tony</p>
