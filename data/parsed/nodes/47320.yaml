    html: |-
      <p>Thank you Jens.</p>
      <p>I have had a look at the Al Abdali 8 font and from what I can see it looks promising.</p>
      <p>I have to admit that working with .ttf and .otf Font files, other than installing them into Windows, is something new to me, and I am having trouble seeing the form of the individual characters.  Trying to insert each character into MS word is causing Word to crash.</p>
      <p>The system into which I want to build the font, is an OEM piece of equipment with embedded firmware. It runs a 192 x 64 pixel display user interface, displaying pregenerated English text strings from within the embedded code.  The user can also select to change to French, German, Spanish, etc. and we have had relative strings simply translated into the appropiate languages and stored in the code.</p>
      <p>When it comes to Russian, Greek, or Chinese, we have generated a bitmap look-up table for each character to be displayed. </p>
      <p>Ideally, I was hoping to do the same thing for Arabic message strings that have already been correctly constructed, but to do this I need to be able to see the full form of each character and it's code within the font table in order to generate the bitmap look-up table. </p>
      <p>Other than downloading the Al Abdali font file, I have so far been unable to find any other information, or make progress.</p>
      <p>Any advice, please</p>
      <p>Tony</p>
