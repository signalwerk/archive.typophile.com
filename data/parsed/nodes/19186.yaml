    <p>Hi all</p>
    <p>I’m currently cutting some characters for a translation of Frege’s<br>
    <em>Grundgesetze</em> and one of them, a variant infinity, has me<br>
    completely baffled.  Has anyone seen anything like it before?</p>
    <p>  <a href="http://miles.shef.ac.uk/~jjg/infinity.jpg" title="http://miles.shef.ac.uk/~jjg/infinity.jpg">http://miles.shef.ac.uk/~jjg/infinity.jpg</a></p>
    <p>[I tried attaching the image but got “File copy failed: no directory configured,<br>
    or it could not be accessed”]</p>
    <p>I’m tempted to think that this was something designed by Frege himself<br>
    and cut by his printer (Hermann Pohl, Jenna, 1893); note the asymmetry<br>
    in the overbar, the uniform width of the bowl strokes.  But Frege took<br>
    great care in the typography of the <em>Grundgesetze</em> (and paid for<br>
    its publication himself) so surely this cannot be the case.</p>
    <p>Any pointers would be most gratefully received!</p>
