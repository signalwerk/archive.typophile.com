      <p>I know enough logic to be dangerous, but I am not familiar with Frege’s notations, especially as originally published.</p>
      <p>My undereducated guess is that this is a stylized lowercase \omega with a wide inverted breve above. If I were drawing it, I’d use the same ductus (or lack thereof) as the \union sign. The part below might indeed by a double\union, but if it <em>does</em> mean some kind of infinity, \omega makes more sense as it is often used as an infinity sign. I wouldn’t worry about the asymmetry - if it had real meaning, I doubt it would be done that subtly.</p>
      <p>What methodology are you going to use to draw your fonts? If it’s not too many glyphs and you don’t have a strong attachment to doing it all yourself, I might be tempted to pitch in.</p>
    html_clean: |-
