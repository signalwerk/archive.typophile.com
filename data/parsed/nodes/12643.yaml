    html: |-
      <p>Very nice.</p>
      <p>It does bother me that the spline control points in the <em>FontLab Studio</em> icon are wrong. I think those could be fixed without detracting too much from the design of the icon.</p>
      <p>It’s also a little disconcerting to see that the split-up pieces of the <em>BitFonter</em> logo contain partial pixels of the <em>B</em> glyph. The pieces should be split on exact pixel boundaries.</p>
      <p>Finally, I’m confused as to the purpose of the <em>r</em> that exists in the negative space of the <em>TransType</em> logo. It seems to just clutter up the logo — probably more so in the smaller versions of the icon, such as the Windows-typical 32×32. It also doesn’t work at all with the upside-down <em>T</em>. I’d probably keep the two <em>T</em>s and eliminate the <em>r</em> entirely.</p>
