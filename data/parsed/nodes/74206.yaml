  html: |-
    <p>cross-posted</p>
    <p>VOLT includes various supplemental files including a version of USP10.dll (AKA as Uniscribe) users can optionally use that .dll for font testing fonts (for example by copying it into a folder along with a copy of notepad.exe). </p>
    <p>Based on today's security advisory we would recommend avoiding using using that DLL. For more details see <a href="http://www.microsoft.com/technet/security/bulletin/MS10-063.mspx" title="http://www.microsoft.com/technet/security/bulletin/MS10-063.mspx">http://www.microsoft.com/technet/security/bulletin/MS10-063.mspx</a> </p>
    <p>In the coming days we'll replace the current VOLT download with one that does not include Uniscribe.</p>
    <p>Cheers, Si</p>
