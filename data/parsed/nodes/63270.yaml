      <p>I really dig your font. A few of the characters have legibility issues... but who cares!</p>
      <p>I do have a question... </p>
      <p>The font seems slightly different between the poster and the pdf specimen. Did you alter the font in Illustrator/Photoshop for the poster? Or is it a different version/weight of the font? I definitely think it benefits from a little breathing space in the counters, which also improves the legibility quite a bit (not that legibility matters, really).</p>
