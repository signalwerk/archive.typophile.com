    html: |-
      <p>Oh... OK... now I get it. I guess I skipped a few words when I read it.</p>
      <p>It could definitely use more negative space. At smaller sizes, the hairline counters disappear.</p>
      <p>X and Y look the same at small sizes.</p>
      <p>The height of counters and serifs aren't consistent across the alphabet. Half of the letters have short counters, the other half have tall counters.</p>
      <p>The lowercase letters are nice. Really nice. The "r" seems a bit weak, but I'm not sure how it could be improved. </p>
      <p>Of course, this isn't a text font and I feel that if most of the letters are workable, then it's a victory.</p>
      <p>I think if you open up the counters and let them breathe a bit, that will make a huge difference.</p>
      <p>---</p>
      <p>On a side note, if you have time, could you take a look at a font I did and give a few words of feedback?</p>
      <p><a href="http://typophile.com/node/63238" title="http://typophile.com/node/63238">http://typophile.com/node/63238</a></p>
