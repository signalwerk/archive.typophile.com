    html: <p>Thanks. The poster on flickr is a Herb Lubalin poster, not mine. I referred to it for guidance on certain letters when I made my font (the pdf). I was not attempting to recreate the poster's characters into a font. although, maybe i should try and offer that as another style in the family!</p>
