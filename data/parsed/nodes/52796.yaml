    <p>This is my latest font Mixamatosis.  Its slightly out there and slightly unpolished, which is what I going for. I tried to make each letter have their own personality and not be too rigid with guidelines for making the font.  </p>
    <p>Zoom in for best detail. </p>
    <p>Type Specimen</p>
