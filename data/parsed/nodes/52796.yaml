    html: |-
      <p>I think Bendy was getting at the technical challenges involved in making multicolor fonts. As far as I'm aware, the available options are to either make them as vector clip art, in PS Type 3 font format (which is a largely obsolete format, for which tools and compatibility are limited), or make a separate font for each color with the same spacing and overlay them in use. That sort of layered font set has been done before, but for the moment I'm blanking on the names</p>
      <p>I love what you've done with the thing, though. What a fun poster!</p>
