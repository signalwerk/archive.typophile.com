    html: |-
      <p>I thought the font was going to get trashed in this critique, which when constructive isn't always a bad thing.  However, I'm pleased with some of the impressions you guys are receiving. </p>
      <p>In concerns with the backward D, I agree and have made the changes to reverse it. </p>
      <p>To Bendy: The two fonts are going to be as one. I've never seen a font that was constructed like that and I think it was part of what drew me to making the complete letter set.  I enjoy this font but I'm unsure what I am going to do with it as of right now, it kind of feels like a wild animal.</p>
      <p>One thing for sure is I'm going to touch up some of the inside portions of the letters a little and play around with the M and the W a little more.</p>
