      <p>Hi,</p>
      <p>I see you've been working hard, approaching different angles, which is nice. It's OK to be confused a lot, and I'm supposed to be a professional, so I guess it comes with the job.</p>
      <p>About the covers. I think it's good you worked more on the type, it definately has more power. I like the type on the door version. The 2nd vase version is a bit too much, though I still believe it has potential. It has too many elements, without real focus. I think it might also be too flat an illustration, with the rather harsh looking orange not helping. A photo might work better, I think black n white would be best. The word meditation in the title would suggest a subtle approach, and I think a b/w photo or subdued color photo would work best. To return to the door version, I think the door image is pretty good, but the symbolism isn't too clear. I think you want to suggest an 'open' door. So think how you could make this clearer. Sorry if this is a bit vague, but if I look at these images I find it hard to connect to the theme of hospitality, or conversation. If you have a good image this is 50% of the job, so it really helps to find one. I think the last version is interesting, but pretty biblical, I don't know if this is appropriate?</p>
      <p>I've just bashed together two covers. Not that they the way two go, but just to give you an idea of what I think might work. Just have a look, maybe it helps... Images are from istockphoto.com.</p>
