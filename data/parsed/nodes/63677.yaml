      <p>This is a good concept. Not knowing anything about the book, I can't say if it is appropriate subject matter. But from a design standpoint, it looks promising. The quality of the illustration definitely helps. Not sure if you should have a full 4-sided bleed though.</p>
      <p>See if you can crop the image to generate more space for the title/author. The title/author should probably sit firmly on the page. It looks like you were simply fighting for space with the people in the illustration.</p>
      <p>See if you can find similar illustrations and then do a wide range of crops/layouts. In aligning the title/author, you would be well served to note how other designers have approached this grid-related issue.</p>
      <p>Phil Baine's <a href="http://www.penguin.co.uk/nf/Book/BookDisplay/0,,9780713998399,00.html">Penguin By Design</a> might be a good reference for this style of layout.</p>
      <p>Good stuff.</p>
