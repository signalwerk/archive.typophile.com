      <p>Hi, I'm try to put some thoughts about these down here, and I'll try to be constructive, so don't stop reading after the first sentence ;)</p>
      <p>I think they are alright, but...a bit stock photo-y...and clean... and boring... Don't know about the plates, I would think this is a book about food. And looking at your plate seems the opposite of looking at ones face. Then again, if the client liked the idea of the plates, you gotta try to work with it. I think the covers lack visual impact, if I were to see this among other books this wouldn't jump out. Maybe it's not a kind of book that has to stand out, but think about how a book would look from the other side of the room. Generally I think the problem is that it's all to neat and clean and unadventurous. It doesn't 'feel' like a good conversation (engaging, exciting etc). It's hard to put to words how to go about and experiment some more with this, even if it's just a rough idea. Put together a few covers in a limeted timespan, all with different ideas explored, not just one idea like these. Don't be too fussy about it, they don't have to be ready for print just yet. You could also do this fase on paper, if you feel more confident with that. In this way you will hopefully get one or two covers that you like, for whatever reason. Then you can continue to explore in this direction. But even in this fase try to be a bit bolder. Do things you never thought you would do. After this fase you can work on details, but not at the beginning, as it will kill anything you try to do (I've been there :))</p>
      <p>To make a long story short: these are too clean and neat, be bolder! Think about the idea with the plates, try some different things with it, but if it doesn't work: throw it out, no use trying to make something work that just doesn't. And most importantly: Have fun and don't take it too seriously!</p>
      <p>I hope this helps you a bit. I don't think it will help you to give very detailed feedback on each one of these, but I hope you post your progress here, to see how you're getting on. Good luck!</p>
      <p>Jeffrey<br>
      <a class="freelinking external" href="http://www.infraordinaire.com/wordpress">infraordinaire</a></p>
