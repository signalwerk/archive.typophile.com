      <p>Just a nontypographic thought...</p>
      <p>If you go with the two-plates-on-a-table-idea, make sure the shading indicates that the light source is the same for both plates. Right now it looks like one is convex and the other concave (or more like the bottom one is right-side-up and the top one is upside-down). If you need to repeat symmetrical *objects* (as opposed to shapes), don't just flip them, or this problem will arise.</p>
      <p>Good luck!</p>
