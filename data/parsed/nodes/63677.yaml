      <p>I think the idea with the faces, creating negative space is the most interesting. I think it still has too many elements, and I would just concentrate on this idea with the faces, the dark/light contrast. Fiddle about a bit with the elements and the colouring, give yourself an overview of possible options. On the side of typography there is still a lot to be won. I would go for a bit more of a display face, with a bit more edginess to it. It still looks a bit to timid now I think. When you have only a limited amount of fonts available and no budget to buy fonts you could look on a freefont site. The use of these fonts is mostly pretty limited as they are not very refined, but for a cover like this it could work. You might find some good ones <a class="freelinking external" href="http://www.fontsquirrel.com/">here</a>. I think you can further explore the mirroring effect as well, play with the symmetry/assymmetry, both in the faces as well as the typography. I like these <a class="freelinking external" href="http://www.penguincatalogue.co.uk/hi/press/imprint.html?imprintId=360&amp;catalogueId=211">covers</a> a lot for instance, both in colour as well as composition. I share the idea of making it all a bit rougher, with more texture. You might wanna have a look <a class="freelinking external" href="http://www.cgtextures.com/index.php">here</a> for ideas and free downloads. Have a look at the fabric category for instance. I guess this is enough feedback for now, good luck and keep us informed ;)</p>
      <p>Jeffrey<br>
      <a class="freelinking external" href="http://www.infraordinaire.com/wordpress">infraordinaire</a></p>
