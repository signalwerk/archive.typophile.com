      <p>You're absolutely right about the brainstorming, and not diving into photoshopping and photosearch right away. But sometimes it helps (i.m.o.) to test an idea in some different ways, nothing final, just a quick match of type and photo to see how it'll work. Sometimes something that looks great on paper doesn't work when you try to make it. I would call this imageresearch, but you definately shouldn't work to much on refinement in this phase.<br>
      I feel that the photo's and illustrations lack a certain something, so that's why I advised to have a look at some other photos in these directions, and look how type can be combined with illustration. But I guess everyone has a different way of approaching these things ;)</p>
