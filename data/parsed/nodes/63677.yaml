      <p>I think your flexibility and willingness to branch out definitely showed in the 2nd iteration, where you introduced the vase and the door.</p>
      <p>I agree that the vase is the strongest composition, thus far. The 3rd round, I think, was a little hasty.</p>
      <p>My very limited experience with this sort of work is that you really want to stay in the sketching/conceptual stage as long as possible.</p>
      <p>Another thing to consider is the subject of your composition, other than the title. Sometimes it is OK to make the title the subject, but almost all illustrations/photos are bound to become the subject, and so you want to make sure your subject has some depth and character. For example, I think the concept, layout and composition of the frist vase is excellent, but it would need a more refined illustration. Of you coul keep the same concept at use a photo of a vase. (I don't think the optical illusion is nearly as important as a solid layout). Vases have a nice way of shaping positive and negative space.</p>
      <p>I think the concept of a design "subject" is relevant here. The subject needs to be one of four things.</p>
      <p>1. Typography (i.e., title/author)<br>
      2. Illustration<br>
      3. Photo<br>
      4. a combination of the above</p>
      <p>And ideally, it would be a depiction of a person or a place.</p>
      <p>What this means is that a good book cover designer has access to the necessary illustrations or photos.</p>
      <p>For instpiration, check out <a href="http://bookcoverarchive.com/">The Book Cover Archive</a>.</p>
      <p>I also have a potential book cover client, and the theme is Bolivian finance... so rest assured, I feel your pain.</p>
