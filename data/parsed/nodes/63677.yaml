    <p>Hello all. I'm pretty new to the world of design, but decided to make the jump into freelancing after a recent move. So far it's gone quite well, with a couple of mistakes from ignorance, but nothing too major. But now there's a client I'm trying to design a book cover for, and just can't seem to get it to the final level. I'd really like to get this right, because I'd really like this to turn into a somewhat steady client.</p>
    <p>Book: Face to Face; on friendship/hospitality, based on a series of sermons. The tone is very easy-going, but also direct and exhortative. Stipulations were just that the cover not be too obvious (i.e., two faces).</p>
    <p>The client liked my idea for the cover, but hasn't been happy with my versions of the idea, I think mainly because it doesn't have as much impact and interest as they would like.</p>
    <p>Here is the third round of revisions (apologies for the huge size of this post). I'm afraid these won't be warm enough. Any suggestions? Should I start over?<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/face_to_face_1_4099.jpg"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/face_to_face_2_4960.jpg"></div><br>
