      <p>Ideally, the artwork would have a hint of narrative to it. Notice how Jeffrey's layouts almost seem to be saying something by virtue of how the text relates to the artwork. That is partly his keen layout, but it has mostly to do with the strong/appropriate imagery.</p>
      <p>You can always keep sketching -- and I would not discourage it if you have time -- but with a deadline looming you should make a last push to find some compelling artwork -- be it photo or illustration. In seeking that perfect artwork, try to think outside the box... look for quality or mood instead of a particular object. If you search "door"... all you're gonna find is a bunch of doors. If you haven't already, see what you can find at Flickr. Most photographers on Flickr will sell you images, and many can be used for free.</p>
      <p>Keep us posted!</p>
