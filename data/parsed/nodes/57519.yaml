      <p>Regarding the Open Forum poster:</p>
      <p>I don’t really understand the purpose of the background image (except perhaps in relation to “Saving the Earth?”). Would it be more appropriate to use an image that is closer to the thrust of the event? I think you could simply use the image on the bottom.  </p>
      <p>I don’t know if this is a personal preference but I think the multiple alignments is jarring and I get stuck in the all over cluster in the middle. </p>
      <p>The type looks amateurish to me (a cousin to comic sans?). </p>
      <p>“realy” is spelled “really”</p>
      <p>The y of Everyone is falling into the t of Invited.</p>
      <p>Are the prospective attendants of this event subject to censorship? While I think forums like these are a staple of democracy, I think it is a mistake to invoke quasi-revolutionary rhetoric in a country where freedom of speech rules the day (for the most part). </p>
      <p>Hope others will disagree with me.</p>
