  html: |-
    <p>I wanted to let everyone know that there is a great class starting in the fall at Cooper Union.</p>
    <p>I have been taking private classes with Hannes Famira, and it has been hugely beneficial to my development as a type designer.</p>
    <p>I went from barely clunking around in FontLab to producing a type family which was accepted by FontShop and Village, the latter of whom I will distributing with.</p>
    <p>I recommend it to anyone in the New York area who is serious about type.</p>
    <p>You can register for his class here: <a href="http://www.cooper.edu/ce/calligph.html#p105" title="http://www.cooper.edu/ce/calligph.html#p105">http://www.cooper.edu/ce/calligph.html#p105</a></p>
    <p>And learn more about Hannes and his teaching philosophy here: <a href="http://www.typedu.org" title="http://www.typedu.org">http://www.typedu.org</a></p>
    <p>Jeremy</p>
