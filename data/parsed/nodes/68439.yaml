    <p>Hello all,</p>
    <p>Below is a logo about which I'd like to get your professional opinions. Many of the letterforms were redrawn and I'm now too close to it to see its inconsistencies. I'm looking for any constructive recommendations about refining the details (stroke width consistency, kerning, etc.)</p>
    <p>Stylistically speaking, the logo will not be changed, but I suppose I could hear any related comments there, too. </p>
    <p>Thanks kindly,<br>
    Ray</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Forsight-Innovation-Logo_5102.png"></div><p></p>
