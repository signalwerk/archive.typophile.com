    html: |-
      <p>I like this type a lot. It has a nice soft and stable character. It's true that "R" has a curved tail, but that puts a special twist into it. I like it. But... The only thing I don't like is the length/width of this logo. So you could ask yourself this:</p>
      <p>Do both words have equal importance or should one be more emphasized/remembered?<br>
      Is the company doing any everyday stuff not just innovating?</p>
      <p>...</p>
      <p>You've probably guessed where these questions are taking. I think that word "innovation" has a lesser meaning. But I may be wrong. Even though if they don't bare the same weight, what can you do? Can you change one of the two in a way so it won't become disturbing and unpleasant? I think you can. But make sure you don't create a seen-it-before logo out of it.</p>
      <p>If both words will stay the way they are right now, you could put one over the other to make your logo narrower.</p>
