    html: |-
      <p>Don't think it's a typeface, more a custom work based on a commercial typeface.<br>
      Depending on what you need, the logo itself is freely available to download as vector <a class="freelinking external" href="http://www.brandsoftheworld.com/logo/ibanez" rel="nofollow">here</a> or you could try to reproduce it starting (even if it sounds cliché) from <a class="freelinking external" href="http://www.myfonts.com/fonts/linotype/helvetica/" rel="nofollow">Helvetica Black Oblique</a> adding serifs and connections (hardest part would probably be to recreate almost entirely /e).</p>
