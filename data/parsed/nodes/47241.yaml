      <p><a class="freelinking external" href="http://www.linotype.com/791/itcserifgothic-family.html?subviewmode=FONTS&amp;samplestr=Rhythm+Computer+ d+TR+8+6+0" rel="nofollow">Serif Gothic Bold</a> is closer than I thought now that I can see more examples of the Roland font. However it looks as if they've taken the bold weight &amp; lightened it slightly, so it doesn't have the separation in letters like R &amp; B that the lighter weights have. d, a &amp; p have that slightly awkward "elbow". The e &amp; that lovely z could be unique features of the customisation. Something doesn't look quite right about Serif Gothic's e.</p>
      <p>There is something similar used by the ibuprofen brand Nurofen, although this uses a different capital E to the Serif Gothic one.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/NurofenLiquidCaps30_4148.jpg"></div><p></p>
      <p><cite>PS.. Justin.. I’m extremely jealous! hehe. Do you make music?</cite></p>
      <p>Most of my audio work these days is editing &amp; sound effects creation, usually for artists making films or sound installations. I had some deep house tracks out quite a few years ago &amp; I'm trying to get back into that side of things.</p>
