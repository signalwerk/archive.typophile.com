      <p><cite>Pre-digital versions of Serif Gothic had that round ‘E’.</cite></p>
      <p>Thanks for that Jan. I've just dug out a 1989 Letraset catalogue &amp; indeed it has both a rectangular &amp; round "E". Not only that, it also has the slanted "e" used by Roland and that swashy "z"!!!</p>
