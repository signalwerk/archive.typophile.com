    html: |-
      <p>The 808 was a classic, especially in terms of how it revolutionised Electro music (we're talking early 80's NYC, btw) from diverse artists like Afrika Bambaata to early Depeche Mode and UK jazz funk band Freeeze (the track I.O.U. specifically).  The 808 Kick and clap were killer in the clubs!  I always dreamed of owning one of those when I was a teenager, only being able to afford it's poor cousin the Roland Drumatix.  Nowadays, all the sounds it can do are available everywhere, especially complete sequencer packages like Propellerheads Reason.</p>
      <p>I think the 808 still carries a lot of kudos though and as such may well still command a respectable price.</p>
      <p>And where do you think 808 State got their name from...</p>
      <p>JH</p>
