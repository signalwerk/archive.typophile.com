    html: |-
      <p>I prefer v1 as well.  The thing that I like the most of it is that your dot matrix is pretty unique, that your X center is above the mid-riff, and that C has an upward swell.  Almost hinting at the Deco.</p>
      <p>This is a good thing to my eyes, since a lot of my favorite old movie theatres are from the deco era.</p>
      <p>But this also has a nice contemporary feel to it as well.  So I'd recommend adjusting the letters, but just don't turn them into your generic dot matrix letters.</p>
      <p>You could also play with putting this in a type of relevant frame (i.e. look at old theatre billboards).</p>
      <p>And make sure you look at this really big.  I learned some lessons doing this on a similar logo approach awhile ago.  Given, it won't be that big that often but it may find itself on a billboard or banner someday).</p>
