      <p>I'm still feeling the original dot approach.  As is the case, it's usually the first idea that shines the brightest.</p>
      <p>That said, B3 might be a good way to go depending on how they want to position themselves.  That has a very fandango big brand look and feel to it.  Whereas A has a more sophisticated unique feel to it.  This appeals to me more, but am I your audience group?</p>
      <p>I think C1 might have some legs, but I see it working like the Paramount logo or the old Le Monde Cafe logo.  Big globe with big ol letters in front of it.  Again a nod to the deco.</p>
      <p>I agree on the shadowing on those newer attempts, seems a little off to me.</p>
