      <p>I think your type choices work fine. I agree with having photographer in italic, makes a nice contrast against the sans. You've clearly delineated the information. As I said, I wouldn't change anything beyond placement. The card works well, and no it doesn't look like the "c-word," The spaces within the mark are pretty consistent so there's no confusion.</p>
      <p>You could fiddle with different faces for the text, but the way it is now there is a four step hierarchy and that's not going to get a lot better with different typefaces. Of course it's hard to tell from the jpg.</p>
      <p>And if you're going letterpress, price out a blind emboss for the mark which would make it even more striking. Just a thought.</p>
      <p>George<br>
      I felt bad because I had no shoes, until I met a man who had no Bodoni</p>
