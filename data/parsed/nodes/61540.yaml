    <p>This is a card design in progress for a photographer friend of mine, he's a wedding photographer with a bit of an edge whose style is a rather outside the traditional wedding box.</p>
    <p>We decided to use his somewhat offbeat personality to really brand him as part of his business, the mark was developed a while back and we printed a simple two-sided card. He's now moving into a higher end market segment and wants to do a richer looking letterpress card along with some other collateral.</p>
    <p>This is my first shot at the business card, the typeface in the mark and for his name is Gotham, the info is set in Eplica. I'm thinking we'd print this with a silver metallic and a gold on dark gray stock. I like the way the mark and his name feel but I think they could be set a bit higher, I don't know if I like how the contact info falls at this point.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/clint_lpcard01_5769.jpg"></div><p></p>
