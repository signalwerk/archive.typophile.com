    html: |-
      <p>I'm assuming the card is standard size 12P x 21P. I suggest moving all the text up 20pt then. This is approximately the average between the distance from the left edge of the card to the yellow box/distance from the left edge to "C" in Clint. Hard to measure it accurately on a jpg, but that should be close. The visual focus stays on the mark and pulls all the text into a single unified form. This puts it below the vertical center, but the smaller space at the bottom works with the lighter type and brings your eye back to the mark. I think centering it vertically would give you an odd looking space at the top and it won't relate as well to the side spaces.</p>
      <p>If you want a two-sided card I suggest just putting the mark alone, same placement as the reverse and switch the color scheme like you did in the second example: Yellow background, box in white, Clint in grey.</p>
      <p>I wouldn't do anything else. You could work with the line spacing between the type blocks, but it will work fine without having to do that and I think that length of time vs. diminishing returns makes it kind of nitpicky. </p>
      <p>In my opinion.</p>
      <p>George<br>
      I felt bad because I had no shoes, until I met a man who had no Bodoni</p>
