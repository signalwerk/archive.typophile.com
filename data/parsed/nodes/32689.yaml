      <p>Thanks everyone. I think I’ll end up modifiying an existing font.<br>
      (I don’t want anything too piratey.)</p>
      <p>FYI, the photo comes from some Mexican colonial signage.<br>
      The web site I found it on says this:<br>
      “In order to keep a colonial flavour to the cities settled by the Spanish conquerors in the center of Mexico (Morelia, Patzcuaro &amp; Puebla), most of the signs of this area respect the following rules: composition in an incised typeface, first letter composed in red and substitution of the capital ‘O’ by a lower-case ‘o’ above a tilde. “</p>
