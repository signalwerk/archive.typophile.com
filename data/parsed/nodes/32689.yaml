    html: |-
      <p><cite> by their very nature, those faces are so evocative of a particular genre or period that they wouldn’t function well in common use these days.</cite></p>
      <p>That’s just it. Why do they have to look exactly like the original, why can’t it just borrow some of the charm and character. </p>
      <p></p><div class="imageWrap"><img src="/files/Picture 1_66_4249.png"></div><p></p>
      <p>The example has an old world charm, but the letters are really pretty normal aside from the embellishments. Just look at “Hotel”, the majority of the characters are slab serifed, but what makes it unique are the embellishments of the crossbar on the H and E, and of course the inconsistent outline. Same with the A’s in San Agustin. This has a modern feel, and I could see it being used often, but what sets it apart from a standard utilitarian font is the additional features (which could be Alternative figure set in a font). </p>
      <p><strong>That being said, Cybele try <a href="http://www.lucasfonts.com/cgi-bin/loadframe/lucasfnt/antib/antib-.html">The Antiqua</a> from Lucasfonts.</strong></p>
