      <p>What are you using this for?</p>
      <p>Check out Fonts&amp;Logos by Doyald Young (speaking of Art Center) pp.110-113 where he nails this style for LORETO. Not a font however :-)</p>
      <p>It looks like spanish/italian painted lettering — what was my first clue :-) The ogee shape shows up in rococo and arts-n-crafts in northern europe also. I can see the small caps of DTL Fleischman with ogee crossbars evoking the same rustic look.</p>
      <p>If this is for a logo, then letter it, or hire someone to do the lettering. It will get you much closer to what you want. Sorry, not a convenient answer.</p>
      <p>R</p>
