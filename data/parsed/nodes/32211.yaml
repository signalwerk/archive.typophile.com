    <p>Hello from SXSW Interactive! This morning I attended a panel discussion entitled <em>Web Typography Sucks</em> hosted by <a href="http://www.markboulton.co.uk/" rel="nofollow">Mark Boulton</a> and <a href="http://clearleft.com/" rel="nofollow">Richard Rutter</a>. The panel delved into some of what plagues typography on the web and offered some insights about what can be done to correct the most common offenses. Topics covered included:</p>
    <ul>
    <li>Creating a vertical typographic rhythm</li>
    <li>Building em based grid structures</li>
    <li>Web friendly typeface selection</li>
    </ul>
    <p>Admittedly, many of these ideas have been presented before. However, Mark and Richard are doing a great job of packaging everything together for an audience that may not otherwise know the names Tsichold or Bringhurst. For those interested, slides from the presentation and additional resources can be <a href="http://webtypography.net/sxsw2007/" rel="nofollow">found here</a>.</p>
