      <p>&gt;Try printing out every Web page you visit instead of viewing it on screen, you’ll soon work out the true cost of your $69 printer ;-).</p>
      <p>Er... but I don't print them out. I read them on the screen. I print some out, yeah. What I'm thinking of is simply print resolution-- in, you know, books and magazines and stuff-- versus screen resulution. If I really wanted to save money, I'd have neither a screen nor a printer. I'd use my local library more.</p>
      <p>Anyway, luminosity seems to be the screen's chief advantage. And the associated blending of colors of light that make photographic material look pretty decent at low resolutions (which has the analogy in the 150 dpi color inkjet printout, which can look ok for a lot of photos on glossy paper). But this is getting more and more off-topic. Sorry.</p>
      <p>- J</p>
