    html: |-
      <p>Good stuff-- I'm linking it all up for my students.</p>
      <p>One thing I notice about these kinds of discussions, though-- where is the push for truly high resolution monitors? I got a laser printer for $69 that'll do 600 x 1200, while my snazzy 19-inch flat screen remains stuck at less than 100 ppi in real measurements. Even so-called "ultra high pixel density monitors" like <a href="http://www.viewsonic.com/support/desktopdisplays/lcddisplays/proseries/vp2290b/" rel="nofollow">this one</a> are barely more than <strong>200</strong> ppi and cost, in this case, <strong>$6000</strong> (100 times as much as my printer?!).</p>
      <p>I appreciate all the general design ingenuity that this presentaiton offers. It's very good, useful stuff. But I think that ultimately the "look and feel" of on-screen typography will never rival print until the resolution issue is addressed on a big scale. In a way, it's kind of like dealing with printouts that never get any better than what you'd get from an NOS dot-matrix printer.</p>
