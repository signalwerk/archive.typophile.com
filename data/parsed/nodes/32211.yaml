      <p>jlg4104...that is one of the main complaints that Tufte has. I agree. Every aspect of computing as increased 1000+% (ram, disk storage, speed, size) except monitor resolutions. The standard resolution increase on most monitors in that past 25 years as increased what...25% at best?</p>
      <p>Related to that, is the lack of resolution independant screen rendering. Eventually, we will have more control over on-screen rendering when we can specify sizes in real measurments like an inch and have it display as an inch regardless of the screen resolution.</p>
