    html: |-
      <p>First, thank you for taking the time to explain some of the intricacies of FreeType's rendering options. Fascinating stuff!</p>
      <p>I do think that knowing the relative numbers of users is important, and things such as their geographical distribution. For example, if we were looking at rendering of Chinese or Indic characters, I'd be looking at the relative use of different rendering in those regions, and I might have very different ideas about the importance of considering FreeType's rendering.</p>
      <p>For what it's worth, I share your preferences for the new sub-pixel filter. I think I'd have to see a wider range of fonts and sizes before I would want to venture a preference between light and full auto-hinter, though.</p>
      <p>Speaking of the auto-hinter, for other folks reading this thread, I think I should explain something in the background here that could otherwise confuse some of them (I know *you* know this, and so do many of the likely readers, but I doubt everyone is aware of it)... "hinting" means something slightly different in this context than it often does elsewhere.</p>
      <p>At the broadest level, though, the meaning is consistent. "Hinting" is additional code, applied to an outline font, which influences or even controls what a rasterizer does when rendering the font outlines to pixels or dots.</p>
      <p>In the classic usage, the hinting code is created as part of designing or compiling the font, and the hinting is an integral part of the font file.</p>
      <p>But what FreeType does is to ignore any hinting code in the font file, automatically hint the font on the fly, and then use that new hinting as input to the rendering of the font. Given that the FreeType auto-hinting is better than that in many (probably most) fonts out there, the results are likely to be reasonable. Especially so given that FreeType's auto-hinting is presumably tuned to work as well as possible with FreeType's rasterizer.</p>
      <p>This is an important distinction, because a lot of people who develop fonts or web font services hang out here. The main take-away for them is that with FreeType, the hinting in the font is irrelevant. What matters for FreeType is the nature of the design and the quality of the outlines.</p>
      <p>I'd also be curious to see how equivalent outlines in perform in FreeType rendering when the variable is whether they are OpenType CFF vs TTF. That could be very interesting....</p>
      <p>Regards,</p>
      <p>T</p>
      <p>P.S. (edit) I welcome any corrections if I have misunderstood what FreeType is up to.</p>
