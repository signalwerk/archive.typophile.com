      <p><cite>This is an important distinction, because a lot of people who develop fonts or web font services hang out here. The main take-away for them is that with FreeType, the hinting in the font is irrelevant. What matters for FreeType is the nature of the design and the quality of the outlines.</cite></p>
      <p>You are spot on with this insight. And it surprised me that <a class="freelinking external" href="http://design.canonical.com/2010/08/the-first-milestone/" rel="nofollow">just that work</a> went into crafting the <a class="freelinking external" href="http://typophile.com/node/68016" rel="nofollow">next Ubuntu system font</a>.</p>
      <p>The only two reasons I can think of for commissioning the hinting was to make sure that it would look acceptable cross-platform when used as a webfont on corporate and community websites (just the topic of this thread) and to please the few users savvy enough to edit config files and enable the formerly ”infringing“ TrueType byte-code interpreter.</p>
      <p>No idea if that’s money well spent.</p>
      <p>I would guess that TrueType and CFF fonts are rastered identically. Are there examples in the wild that are straight conversions that I could use?</p>
