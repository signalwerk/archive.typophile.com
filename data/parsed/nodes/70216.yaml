      <p>I added a line that other browsers respect OS settings. There are more possible scenarios, some users turn CT off – either in OS or in IE browser. If they turn it off in OS, they still see it in IE, but not in FF and others. And so on and on …<br>
      The problem is that I have no data how many users actually change the defaults, and how.</p>
      <p>There is also a type designer who has all control how to display TT-based font in Standard mode: when and if to display it aliased/greyscale.</p>
      <p>Web designers haven't got a lot control, but they can force grayscale AA with CSS filters – CT enabled or not (in some browsers).</p>
