    html: |-
      <p>Don't get me wrong. I think FreeType rendering is not only interesting, but sometimes quite good. But it may be a little while before FreeType rendering is any significant proportion of folks looking at web pages. I based my &lt;1% comment on previous looks at stats from various web tracking services that claim to measure such things. Looking at the latest from NetMarketShare, they would claim about 1.7% for Linux and Java combined. Seems like StatCounter says something similar for Linux plus "Other." So I'd say that I probably understated it, but I have no doubt total FreeType usage is under 2%.</p>
      <p>BTW, with these samples, it would be really helpful to explain what the various conditions mean and what causes them. What elements are controlled by user prefs, and what's their default? What elements are controlled by the vendor's choice(s)? What choices are the major vendors currently making?</p>
      <p>Cheers,</p>
      <p>T</p>
