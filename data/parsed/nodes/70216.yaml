    <p></p><div class="imageWrap"><img src="http://typophile.com/files/aaaaaa_4787.png"></div><br>
    I made this just as a general info for those uniformed.<p></p>
    <p>It is simplified, but generally speaking these are main possible paths with default settings.</p>
    <p>X axis is market share (with some guessing).</p>
    <p>I know a small examples of renderings could be included for better understanding, and I will post this &amp; other refinements later.</p>
    <p>A few things not mentioned:<br>
    Linux with FreeType rendering, but I have no idea how many people use subpixel rendering or other settings. Each setting has probably less than 1% of users.<br>
    Quartz rendering does also other types than subpixel AA, but I would say they are in minority (I really don't know).<br>
    There is also an <em>old</em> version of Safari, with Quartz rendering on Windows with default setting.<br>
    Mobile market falls under Other, but some browsers aren't capable of displaying @font-face fonts anyway.<br>
    PS: I made this quickly, I hope there is no huge mistake that I can not see...</p>
    <p>[edit: I made corrections and some changes. Old version is attached below.]</p>
