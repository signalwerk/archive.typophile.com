    html: |-
      <p>As John Hudson noted, both subpixel AA and positioning are important for smaller text sizes.  Windows GDI (and Uniscribe) only provide positioning information at pixel boundaries.  The DirectWrite API allows both better subpixel AA *and* subpixel positioning, plus font sizes can be any arbitrary size (GDI limits font size to integer units).</p>
      <p>Compare this waterfall test on XP with a DirectWrite-enabled browser (IE9 beta or Firefox nightly with DirectWrite enabled):<br>
      <a href="http://people.mozilla.org/~jdaggett/tests/decimalfontwaterfalls-default.html" title="http://people.mozilla.org/~jdaggett/tests/decimalfontwaterfalls-default.html">http://people.mozilla.org/~jdaggett/tests/decimalfontwaterfalls-default....</a></p>
      <p>On the Mac and with DirectWrite browsers you'll see a nice smooth waterfall.</p>
      <p>One thing to note is that Webkit browsers don't do subpixel positioning, even when kerning is enabled.  There's some odd code that repositions glyphs to pixel boundaries but hopefully that's just legacy code that will get fixed at some point.</p>
      <p>Firefox4 will probably also use Cleartype rendering on XP, similar to IE7/8, with an option to revert to standard GDI.  That patch landed today, it'll be in the nightlies in the next day or so.</p>
    html_clean: |-
