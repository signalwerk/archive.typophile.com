      <p>Let’s not talk about percentages. Given the global number of people using the web, even one percent amounts to millions upon millions.</p>
      <p>I’m glad to hear you’re interested. I’ll give you a fragmentary précis.</p>
      <p>The FreeType library itself offers a range of render modes – each with tunable knobs – and among them some are disabled by <code>#ifdef</code> switches in the code. Some distributions compile those in and some don’t (for confused IP reasons I suppose).</p>
      <p>For instance,<br>
      </p><dl>
      <dt>OpenSuSe</dt>
      <dd>disables both LCD filtering and bytecode hinting interpreter (default is 5th sample).</dd>
      <dt>Fedora</dt>
      <dd>does use an LCD filter by default but it only offers the legacy type that is intra-pixel and looks horrible with light hinting. Hence they need pixel-snapping and use sample 3 by default.<br>
      </dd><dd>
      </dd><dt>Ubuntu</dt>
      <dd>found out through user polls and outright flamewars that light hinting (unhinted in x, autohinted in y-axis) combined with a newer signal-processing LCD filter is preferred by most. Hence their default font rasterization is sample 1.</dd>
      <dt>Android</dt>
      <dd>I’m guessing from screenshots that they disable LCD filter and use light FreeType autohinter. Hence specimen 4.</dd>
      <dt>monochrome is only used by maniacs</dt>
      </dl>
      <p></p><p>This variance is compounded by the many ways to configure all the knobs – from config files (”.fonts.conf“) to high-level settings panels (”Best Shapes“, “Best Contrast”) – and the many different desktops and graphics libraries in use.</p>
      <p>I’m assuming that browsers all obey the global desktop setting for their font rendering because if they didn’t they would be spammed with bug reports until they do. When it comes to taste and preference there are two dug-in camps. The ones who prefer the signal-processing look and the ones who hail from the olden Unix (or Windows) days and insist on pixel snapping or superhinting.</p>
      <p>I think the former approach is the way forward, in particular because web fonts look good in it no matter what the format or feature set of the font is. The autohinter with the LCD filter is excellent, most robust, readable at small sizes and usable on scalable canvasses.</p>
      <p>The only thing lacking at the moment is subpixel positioning. Still getting odd kerning in waterfalls and animations due to integer pixel effects.</p>
      <p>These are the options exposed in the config file.<br>
      <code><br>
      &nbsp;&nbsp;antialias&nbsp;Bool&nbsp;Whether&nbsp;glyphs&nbsp;can&nbsp;be&nbsp;antialiased<br>
      &nbsp;&nbsp;hinting&nbsp;&nbsp;&nbsp;Bool&nbsp;Whether&nbsp;the&nbsp;rasterizer&nbsp;should&nbsp;use&nbsp;hinting<br>
      &nbsp;&nbsp;hintstyle&nbsp;Int&nbsp;&nbsp;Automatic&nbsp;hinting&nbsp;style:&nbsp;light,&nbsp;medium,&nbsp;full,&nbsp;none<br>
      &nbsp;&nbsp;autohint&nbsp;&nbsp;Bool&nbsp;Use&nbsp;autohinter&nbsp;instead&nbsp;of&nbsp;normal&nbsp;hinter<br>
      &nbsp;&nbsp;rgba&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;Int&nbsp;&nbsp;unknown,&nbsp;rgb,&nbsp;bgr,&nbsp;vrgb,&nbsp;vbgr,&nbsp;none&nbsp;-&nbsp;subpixel&nbsp;geometry<br>
      &nbsp;&nbsp;lcdfilter&nbsp;Int&nbsp;&nbsp;Type&nbsp;of&nbsp;LCD&nbsp;filter:&nbsp;lcddefault,&nbsp;lcdlight,&nbsp;lcdlegacy<br>
      </code></p>
