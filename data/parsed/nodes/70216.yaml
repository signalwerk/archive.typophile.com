      <p>Your bottom row is a bit confusing because there is ClearTyoe implementation within GDI, and this is distinguished from ClearType rendering in DirectWrite (which applies a combination of x-direction subpixel AA <em>and positioning</em> and y-direction greyscale AA to both TT and PS).</p>
      <p>In IE6 and IE7, PS fonts cannot be served as EOTs, so the blue line to and from these browsers is misleading.</p>
