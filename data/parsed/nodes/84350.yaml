    <p>Hi Everyone,</p>
    <p>working on my personal identity and looking for a condensed, bold sans serif similar to Knockout. A typeface that has a bit more of a woodtype/vintage element (if that makes sense). </p>
    <p>For example, I am choosing Knockout Bantamweight rather than Din Black Condensed or Univers 59 Ultra condensed because of that specific element that my 'G' has.</p>
    <p>I'm just looking for some alternatives that can work here. Maybe something with a unique uppercase G or something.</p>
    <p>You're also welcome to critique my logo, even though I'm going for something quite minimal.</p>
    <p>Thanks!!!</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/dg_4798.jpg"></div><p></p>
