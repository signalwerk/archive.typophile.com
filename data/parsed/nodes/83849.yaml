      <p>I agree with Christopher's comments.  An additional advantage is that a local printer has actual paper samples to inspect and choose from. Also you can discuss your job with a real live person and they can point out any potential technical problems with your layout.</p>
      <p>I'd suggest using a small (but good) print shop. (Not a copy shop that does mostly xeroxing, but a real, full-service print shop.) A big print shop that's geared towards large jobs would probably not be an economical choice for printing a few hundred business cards.</p>
