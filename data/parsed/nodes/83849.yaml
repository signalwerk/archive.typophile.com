    html: <p>And as I get older I am increasingly impressed with the quality/capabilities of digital presses which are essentially bus-sized colour photocopiers. Nothing to turn your nose up at. Cheep, fast <em>and</em> high quality. They can handle pretty beefy stock as well. Most important is to find a good contact and person to work with. Respect their knowledge.</p>
