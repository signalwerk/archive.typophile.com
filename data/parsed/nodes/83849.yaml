      <p>I <strong>strongly</strong> recommend using a local printer <em>instead</em> of a cheep web vendor for the following reasons:</p>
      <p>a) It is important to patronize your local economy<br>
      b) If the printer makes a mistake, such as poor registration, your chances of getting a reprint at no charge is much greater.<br>
      c) You will develop a real relationship with a real person which, over time, has many benefits. For example, when you have been working with the same printer for 20 years, they will often do you small favours that other printers normally wouldn’t (deals, turnaround &amp;c).</p>
