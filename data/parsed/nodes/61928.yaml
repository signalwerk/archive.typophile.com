      <p><a class="freelinking external" href="http://typophile.com/user/42308" rel="nofollow">cschroeppel</a>: <cite>I think that Sabon... is a good font to be used together with Computer Modern for math content.</cite></p>
      <p><em>Computer Modern</em> is a Didone, and as such does not sit very well on a line of type with any other face, even another Didone such as <em>Didot</em> or <em>Bulmer.</em> A Neoclassical face such as <em>Baskerville</em> may work better, and there are some enticing similarities between Computer Modern and <em><a class="freelinking external" href="http://www.tiro.com/Plantagenet/plantagenet_index3.html" rel="nofollow">Plantagenet</a>.</em> The greatest difficulty you will have is matching the weight.</p>
      <p>If <em>Garamond</em> does not work for you, how about pairing Computer Modern with a Garamond that is not a Garamond at all? Namely, a ‘Garamond’ that is based on the work of Jean Jannon, such as Monotype <em>‘Garamond’</em> or Simonicini <em>‘Garamond’?</em></p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/SimoniciniGaramond_ComputerModern_5803.png"></div><p></p>
      <p>Finally, have you considering using Hermann Zapf's <em>Euler</em>? That would allow you to select among Zapf's other designs, such as <em>Aldus</em> or <em>Palatino,</em> for a companion face.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Zaph-Aldus-Euler_specimen_5220.png"></div><p></p>
      <p>The glyph coverage of Euler might not be as large as Computer Modern, but it is an eminently more handsome face.</p>
