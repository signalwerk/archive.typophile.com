      <p><cite>Computer Modern may not be typographically perfect, but it’s a good font for displaying maths (and has the most extensive support for LaTeX, as far as I know). For text, it’s not the best choice, in my view. </cite></p>
      <p>Most of the time, Computer Modern needs to be complemented with the amsmath and amssymb fonts. A font that is more self contained and that comes with opticals (5, 6, 7, 8, 9, 10 and 12 points) in regular and bold,  is <a href="http://tug.ctan.org/cgi-bin/ctanPackageInformation.py?id=mnsymbol" rel="nofollow">MnSymbol</a>. Here is your sample using the minionpro package. The header is</p>
      <p><code><br>
      \documentclass[11pt,twocolumn]{article}<br>
      \usepackage[german]{babel}<br>
      \usepackage[mathlf,textlf]{MinionPro}<br>
      </code></p>
      <p>The rest should be obvious</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/pic25_6704.jpg"></div><p></p>
      <p>Michel</p>
    html_clean: |-
