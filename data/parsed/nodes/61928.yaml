      <p>Thank you for your advice, Christopher! Your observation on Computer Modern not sitting well with any other font is quite to the point. If the CM parts would not be limited to single letters, this would be probably an unsolvable problem. </p>
      <p>Simoncini Garamond and Computer Modern looks like a reasonable combination, I'll check that out. (There might be problems with the relative weight of the fonts, difficult to say by just looking at the screen images.) </p>
      <p>Garamond Monotype is too "lively" (too much difference in stroke widths, I guess, but I'm not familiar with how to verbalize the technical details). Aldus and Palatino have the same problem. (If you have too write rather ugly prose, and math-related texts tend not to allow excessive creativity, a lively font contrasts too much with the dry nature of the content.) </p>
      <p>As for the Euler math fonts, the glyph coverage (extensible math characters, specialized symbols) is not as comprehensive as for the Computer Modern, so it would be a risky choice. </p>
      <p>Plantagenet is a very interesting font, but much too heavy for Computer Modern, as far as I can see.</p>
