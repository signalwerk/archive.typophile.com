      <p>I'd tend to agree with the posters who suggest changing out the Computer Modern for math, rather than finding a suitable text font to match it.  The difference in weight between Computer Modern and almost anything else is just too jarring to me.  Of course, a beautiful mathematician once said to me, "Oh, Computer Modern---it's so spindly."  After that, I could never go back.</p>
      <p>Personally, I like looking at the Palatino/Euler pairing, especially for dry mathematics, but it is a bit informal-looking.  The Minion packages look very nice to me.</p>
      <p>st</p>
