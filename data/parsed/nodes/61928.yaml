      <p>"Ask yourself, do you really need bold?" Titles of mathematical papers are often rather long, so the font size cannot be much larger than the text font size, so title are often set in bold letter. It's possible to use a different font for titles, of course. I don't know if I would use bold elsewhere (e.g. semibold for margin notes), but I haven't used it in the text itself for a long time. </p>
      <p>Melior looks promising. Zapf International's serifs probably don't fit well with CM, but the font is a very interesting combination of "calm" and "lively" elements.</p>
      <p>I have to do some other stuff at the moment, so I'll come back to this later. Thank you very much for your help! (Is there a section on Typophile for font combinations? I assume that these kind of questions come up rather regularly.)</p>
