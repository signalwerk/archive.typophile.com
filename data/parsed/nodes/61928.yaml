      <p>Monotype <em>Bulmer</em> has a range of weights (regular, semi-bold, bold, display) and expert character sets (text figures, small caps, ligatures, fractions, etc.).</p>
      <p><cite>(Are there any bold weights for that particular font.)</cite></p>
      <p>Ask yourself, do you really need bold? In the case of <em>Bulmer</em> the heavier weights are surely retroactive additions to the design.</p>
      <p>If you want a typeface that comes with a bold weight and is at all honest with itself, you should look to 20th century designs instead.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/HermannZapf_Melior_4112.png"></div><p></p>
      <p>Hermann Zapf's <em>Melior</em> dates from the 1950s and is suitable for setting extended text.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/ITCZapfInternational_5811.png"></div><p></p>
      <p><em>Zapf International</em> dates from 1977 but is more suitable for titling.</p>
