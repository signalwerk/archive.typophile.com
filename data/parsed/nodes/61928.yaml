      <p>These are two more modern faces that could make a companion for Computer Modern, and are fine for setting extended text.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/ComputerModern_Bulmer_4135.png"></div><p></p>
      <p><em>Bulmer</em> was cut in London in the 1790s by William Martin and later revived by Morris Benton.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/ComputerModern_Bell_6358.png"></div><p></p>
      <p><em>Bell</em> was cut in London in 1788 and widely used in America, but the numerals (not shown) may not agree with you.</p>
