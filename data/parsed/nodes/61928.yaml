    <p>Hi. Computer Modern may not be typographically perfect, but it's a good font for displaying maths (and has the most extensive support for LaTeX, as far as I know). For text, it's not the best choice, in my view. I think that Sabon (I'm using the Monotype version) is a good font to be used together with Computer Modern for math content. (Garamond is too "round", in my opinion, although I would prefer it - Garamond Stempel - for text without math content. Note: For texts that need a more personal style, I'd use other fonts, however.) What do you think about the choice?</p>
