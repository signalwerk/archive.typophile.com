      <p>I have been using the <a href="http://tug.ctan.org/cgi-bin/ctanPackageInformation.py?id=fourier" rel="nofollow">Fourier package</a> with the upright option (French mathematics, upright uppercase and upright greek letters) for years and have been quite satisfied with it. Here is how it looks:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/fourier_5111.jpg"></div><br>
      If I wanted to keep the Computer Modern fonts for the mathematical alphabets (one advantage being that there is a matching sans serif that some use for tensors or the like), I might be tempted to have a look at Nick Shinn's <a href="http://www.fontshop.com/fonts/downloads/shinntype/modern_suite_full_family/" rel="nofollow">Modern Suite</a>. There is a very nice presentation document on his web site (<a href="http://www.shinntype.com/Figgins_Scotch.pdf" rel="nofollow">pdf, 5.05MB</a>). Has anyone ever tried it?<p></p>
      <p>Michel</p>
      <p>PS I should add that the mathematical latin alphabet of the Fourier package is <a href="http://www.ctan.org/tex-archive/fonts/utopia/" rel="nofollow"><strong>Adobe Utopia</strong></a>.</p>
