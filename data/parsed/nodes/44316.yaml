    html: |-
      <p>&gt; <em>how does AFDKO effect what would already be in your Fontlab files in the naming info sections if they are already filled out? </em></p>
      <p>The workflow we use for generating the OTFs (described here <a class="freelinking external" href="http://blogs.adobe.com/typblography/typotechnica2007/TypoTechnica2007_FontProduction_at_Adobe.pdf" rel="nofollow">Font Production at Adobe</a>) involves generating a Type 1 font (.pfa) from the VFB. That font will only contain certain values from the fields on FontLab's Font Info panes. In terms of naming, you just need to worry about these fields: Family Name, Weight, PS Font Name and Full Name. These need to match the information you put on the FontMenuNameDB file. This file is used for building the 'name' table, whereas the names you type in FontLab go into the 'CFF ' table.</p>
      <p>There's other Font Info data that goes into the Type 1 font, like the Copyright, the Notice, the Version number, the Italic angle, the Hinting, etc., but these don't affect the naming.</p>
      <p>&gt; <em>And what about the weight input such as Regular - 400, and in situations where you need to manually correct ExtraLight, to make it 250 instead of 200?</em></p>
      <p>Those values don't end up in the Type 1 font. That data is put in the 'features' file, in the form of a table declaration,<br>
      <code><br>
      table OS/2 {<br>
      &nbsp;&nbsp;&nbsp;CapHeight 650;<br>
      &nbsp;&nbsp;&nbsp;XHeight 440;<br>
      &nbsp;&nbsp;&nbsp;TypoAscender 709;	# top of ascenders<br>
      &nbsp;&nbsp;&nbsp;TypoDescender -291;	# TypoAscender-UPM<br>
      &nbsp;&nbsp;&nbsp;TypoLineGap 200;	# 20% of UPM<br>
      &nbsp;&nbsp;&nbsp;WeightClass 400;	# Normal (Regular)<br>
      &nbsp;&nbsp;&nbsp;WidthClass 5;		# Medium (Normal)<br>
      &nbsp;&nbsp;&nbsp;Vendor "ADBE";<br>
      &nbsp;&nbsp;&nbsp;FSType 8;			# Editable embedding<br>
      &nbsp;&nbsp;&nbsp;Panose 2 4 5 3 5 2 1 2 2 3;<br>
      } OS/2;<br>
      </code></p>
    html_clean: |-
