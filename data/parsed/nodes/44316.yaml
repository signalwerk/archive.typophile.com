      <p>Actually, Microsoft <em>has</em> changed their font menu name handling dramatically, in Windows Presentation Foundation (WPF), their new API. (They couldn't change it in GDI without breaking existing apps.) WPF is available in Vista, and can optionally be installed on XP.</p>
      <p>Now the problem is that no major office type apps have moved to WPF. Actually, hardly any major apps of any type.</p>
      <p>My latest version of my <a href="http://blogs.adobe.com/typblography/typotechnica2007/Font%20names.pdf" rel="nofollow">font naming presentation</a> includes WPF info, and I've spoken about it at ATypI TypeTech and TypoTechnica. <a href="http://blogs.msdn.com/text/attachment/2249036.ashx" rel="nofollow">MS has plenty of info</a> on it as well.</p>
      <p>Cheers,</p>
      <p>T</p>
