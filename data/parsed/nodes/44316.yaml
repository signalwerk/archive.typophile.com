      <p>Infuriating, isn't it? This topic is probably one of the more challenging things facing font developers, apart from the actual design part. I would say, "something needs to be done" but I fear that might result in another half-dozen name table fields that need to get added to fonts.</p>
      <p>Anyway: I'm not sure if you've seen Thomas Phinney's bit on this which includes some screen captures for FontLab settings: <a href="http://blogs.adobe.com/typblography/typotechnica2007/Font%20names.pdf" title="http://blogs.adobe.com/typblography/typotechnica2007/Font%20names.pdf">http://blogs.adobe.com/typblography/typotechnica2007/Font%20names.pdf</a>   ... it might help but don't be surprised if there are still some oddities in some application somewhere.</p>
      <p>Also: under Mac OS X you may find it helpful to delete your font caches and reboot. In fact that may be the problem, especially if you've been installing and uninstalling your fonts as you work on them. The FontNuke app at <a href="http://www.jamapi.com/" title="http://www.jamapi.com/">http://www.jamapi.com/</a> is useful for this.</p>
      <p>Good luck.</p>
