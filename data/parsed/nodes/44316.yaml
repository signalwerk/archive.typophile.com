      <p>A nice MakeOTF manual should be on your HD already, being part of the AFDKO download. I think it gives very detailed information.&nbsp;&nbsp;;-)</p>
      <p>Regarding Miguel's link to his post in the other thread:<br>
      To understand the relation of MakeOTF's FontMenuNameDB to FLS5's naming interface, just bear in mind that MakeOTF's "FamilyName"/"StyleName" roughly matches FLS5's "OT Family Name"/"OT Style Name" ("long family" in Adam Twardoch's naming how-to), while MakeOTF's "WindowsCompatibleMenuName" matches FLS5's "Family Name" ("short family").<br>
      This equation is not absolutely true, but may help get the idea.</p>
