      <p><em>Is this on CS3 apps again? If so, the the Weight values in the fonts might not be quite right.</em></p>
      <p>Yes, it is on CS3 apps, although I'm positive the weight values are correct, in a descending order from lightest to heaviest as I'm very careful with these details after having gone over and over them.</p>
      <p>What is interesting, is, shortly after trying the Fontshop naming convention, I went back in for further testing and re-named all styles similar to (A Twardoch's naming how-to and kl's), yet I eliminated the 'Menu Name', 'FOND Name', and on the next page, 'Mac Name' was left blank as well.</p>
      <p>I then re-generated the 'Additional OpenType Name' panel for each and the generated font family worked excellent, with the sub-menu styles in order from lightest to heaviest (and all styles showing up in the sub-menu correctly). </p>
      <p>In a way, I've come full circle with this issue, coming to understand what fields are most important and what role they play. As of now, I plan to sticking to the convention I just mentioned as it seems to work best, and it splits the 6 styles into 2 sub families for MS.<br>
      The ExtraLight and Light styles have the 'Family Name' of Myfont Lt and the other four weights the family name of Myfont Rg and every other field is consistent within this family.</p>
