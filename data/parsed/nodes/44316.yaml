    <p>I'm currently having trouble with a OpenType family of six weights (ExtraLight, Light, Regular, Medium, SemiBold, Bold) where I've tried different naming options (AT's MSN Forum naming guide) yet no matter what changes I make the sub-menu omits Light and Medium styles.  (I've never had problems with up to three styles it's the six that is troubling)</p>
    <p>Everything looks good and consistent with the naming and all the styles show up under one family in Font Explorer… any ideas of what could be the problem?</p>
    <p>Mike</p>
