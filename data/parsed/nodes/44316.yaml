      <p>&gt; <em>I’m curious as to what the magic key is to successfully generate a PS OpenType font family consisting of six styles is. (And have them ALL actually show up in the sub-menu)</em></p>
      <p>The magic is, <strong>use the AFDKO !</strong> At this point I probably sound like a broken record, but I still haven't seen a tool that does the <a href="/wiki/Font%20Naming" class="freelinking" rel="nofollow">Font Naming</a> correct and effortlessly like the <a href="/wiki/AFDKO" class="freelinking" rel="nofollow">AFDKO</a> does. And if you find this hard to believe, ask the <a href="/wiki/Education" class="freelinking" rel="nofollow">Type &amp; Media</a> or the <a href="/wiki/Education" class="freelinking" rel="nofollow">Reading</a> students. I was over there a couple of months ago giving a workshop on how to use the AFDKO tools, and we probably spent like 10 minutes(!!) setting up the naming. And half of that time was actually just typing.</p>
      <p>Are you planning to attend <a href="/wiki/TypeCon" class="freelinking" rel="nofollow">TypeCon</a> this year? I'm going to give a full-day workshop there about using some of the AFDKO tools.</p>
      <p>&gt; <em>This topic is probably one of the more challenging things facing font developers</em></p>
      <p>I completely agree. Getting the 'name' table right is not an easy task. Fortunately there are (free) tools out there that simplify the whole process. Have I mentioned the <a href="/wiki/AFDKO" class="freelinking" rel="nofollow">AFDKO</a>? :) I just don't understand why FontLab hasn't taken advantage of this yet...</p>
