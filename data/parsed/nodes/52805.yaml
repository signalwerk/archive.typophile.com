    <p></p><div class="imageWrap"><img src="http://typophile.com/files/review_6406.jpg"></div><p></p>
    <p>  Hi all,<br>
    I am working on a new typeface which combines elements of early sans faces (Grotesque MT) and roman glyphic (Albertus).<br>
      All too often I use Grotesque MT as a sans text face and felt that I needed to make my own alternative (with an antique twist).</p>
    <p>   Its in its early testing phase and so far I have made Regular, Semi-bold and Bold (although I started building the font from the semi-bold weight)</p>
    <p>   I'm not sure how to present it (or even <em>name</em> it) at this point but I'd like to get some critiques and comments on it. I am attaching a simple PDF for your collective consideration.</p>
    <p>Thanks<br>
    J.</p>
    <p><a class="freelinking external" href="http://www.alfa60.com/joe" rel="nofollow">http://www.alfa60.com/joe</a></p>
