      <p>Knowing that Speilberg is often faithful to his inspirational sources, I tried finding pics of Flying Crawl chapter titles seen in old Flash Gordon serials of 1936. </p>
      <p>Of the few I found (very poor resolution) it is evident that the visual effect of words gliding off to the distance is best achieved with justified copy. That way both left and right margins clearly follow one-point perspective.</p>
      <p>Oddly enough, the Flash Gordon title seemed fairly well spaced, but too small to see any detail.</p>
      <p>I remember being slightly irked by the opening crawl in Star Wars Episode III, but really, I was too excited to care.</p>
      <p>-------------------------------------------------------------------------<br>
      Yes, I'm old, but I remember Yoda when he had hair!</p>
