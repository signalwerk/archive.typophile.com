      <p>I find I can't stop noticing &amp; thinking about text/fonts anymore, especially at films. Like Erik Spiekermann said : paraphrasing : Typophilia is a terrible disease.</p>
      <p>Nick, text on de-texting! :-) </p>
      <p>Actually it is relaxing for me to be without texts, for the reason above. Have been somewhere where there is lots of text which you can't read? I find that also relaxing...</p>
      <p>I guess I was thinking of the most recent star wars film as a kind of vision of the future like the film 2001 was meant to be* and the abscence of writting seemed to me somehow not like wimbeldon as you describe it, but as kind of purposely bland, almost neutered vision - because of the abscence of incidental text - as opposed to simply advertising.</p>
      <p>*silly already i know. Really it's just a marketing vehicle after all.</p>
      <p>This is the opposite of The Lord of the Rings, where text is central. It's on the ring. Or Blade Runner where incidental text is everywhere to create atmosphere.</p>
      <p>I think what I am getting at is that there was a missed opportunity to make this Star Wars more compelling. But then with dialog like that - it is not too surprising...</p>
