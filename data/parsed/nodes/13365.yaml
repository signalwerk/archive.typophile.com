      <p>So I just finally caught Episode 3. Amazing movie, one of the best I've seen - much better than I expected. No stupid one-liners, very intense, both in emotion and action - reminds nicely of the original long, long ago, in a state of youth far, far away. I especially liked the little things, like catching a glimpse of the young Grand Moff Tarkin on the sidelines.</p>
      <p>BTW, I did notice <strong>some</strong> type: on the computers on Musafar. It looked a little bit like those ancient Hebrew Dead Sea inscriptions. But yeah, otherwise type was absent. And the titles? I was too excited to check. I can hear Jabba scoffing: "He's no type Jedi!"</p>
      <p>hhp</p>
