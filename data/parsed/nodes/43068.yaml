    html: |-
      <p>Cool I like it.</p>
      <p>Any way you do it is going to be a bit laborious.<br>
      This is what I'd do:</p>
      <p>• draw a line with the pen tool<br>
      • duplicate, rotate and repeat the lines the same way you have done with your text.<br>
      • Then use 'type on a path' tool to start writing on one line and write more information than can fit into the single text box.<br>
      • Deselect the type box and select the white arrow tool<br>
      • Select the text box again and you should see a little box with a red plus indicating there's more info than can fit in the text box.<br>
      • using the white arrow tool, click on the red arrow and the cursor will change to show what looks like a tiny block of text<br>
      • select the start of the next line and the overflow will run onto the next line – you can just repeat this all the way round the circle and every line will adjust when you change one detail.</p>
      <p>Hope that helps.<br>
      If you're really stuck send me your email address and I'll send you an ai file showing what I mean... or check out 'typing on a path' and 'linking path type' in help files.</p>
      <p>Good luck!<br>
      Ed</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/typeonapath_5810.png"></div><p></p>
