      <p>Don't know the precise font, but I can give you a font with the extended diagonals on the M -- which was a lettering feature by Ozwald Cooper and others circa 1920.<br>
      Packard New Style:<br>
      <a href="http://www.identifont.com/show?2DOR" title="http://www.identifont.com/show?2DOR">http://www.identifont.com/show?2DOR</a><br>
      which is a smoothed version of Cooper's original Packard:<br>
      <a href="http://www.identifont.com/show?2DOQ" title="http://www.identifont.com/show?2DOQ">http://www.identifont.com/show?2DOQ</a><br>
      Also Packard Patrician NF:<br>
      <a href="http://www.myfonts.com/fonts/nicksfonts/packard-patrician-nf/" title="http://www.myfonts.com/fonts/nicksfonts/packard-patrician-nf/">http://www.myfonts.com/fonts/nicksfonts/packard-patrician-nf/</a><br>
      Don</p>
