      <p><em>A quick check would be to copy the text from the whiner's screen and paste it anywhere else, then change the font.</em></p>
      <p>She tried to but I think the whiner was too <em>intense</em> to listen to reason. I wonder how many often people have received emails which inadvertently appeared to be yelling because fonts were substituted for all caps fonts.</p>
      <p>I imagine the typical Panose settings for a typical all caps font doesn't differ from a regular font. For example, if someone created an all caps rounded sans and faithfully applied <a href="http://www.panose.com" rel="nofollow">proper</a> Panose settings according, it could end up with exactly the same Panose settings as Arial Rounded.</p>
      <p>To prevent future yelling, perhaps font creation software could automatically set all Panose categories to No Fit for all caps font. Provide an ALL CAPS checkbox the same way FontLab studio provides a Monospaced checkbox. When checked, it would automatically set all Panose settings to no-fit.</p>
      <p>If you're reading this and you don't know what Panose settings are, check out <a href="http://www.panose.com" title="http://www.panose.com">http://www.panose.com</a> &amp; <a href="http://www.typophile.com/node/74374" title="http://www.typophile.com/node/74374">http://www.typophile.com/node/74374</a></p>
