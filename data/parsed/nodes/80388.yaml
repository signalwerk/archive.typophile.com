    <p>My mom uses Arial Rounded . . . a lot. She sent an email to a mailing list, as she often does and some crazy woman totally flipped out on her for ALL CAPS YELLING. However the original was not in all caps. I suspect the internetwhiner didn't have Arial Rounded and an all caps font with similar Panose settings was substituted. I don't think there is Panose setting to indicate that a font is all caps. Should every Panose setting in an all caps font have all setting set to "no fit"? What about the Latin Decorative/initials setting?</p>
    <p>I don't want a despot to launch missiles because Obama seemed to be yelling at him in an email.</p>
