    html: <p>Take a look at type specimen books of that era. There are plenty of them on Google Books and Archive.org. <a href="http://www.garloo.com/atf_reference_books.htm" rel="nofollow">The 1912 ATF specimen book is a good start</a> and if you have time try books from Barhart Brothers and Spindler and The Inland Type Foundry. BB&amp;S has some of the richer books due to them flagrantly ripping off everyone else (flagrantly even for that era!).</p>
