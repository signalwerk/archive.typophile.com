    <p>I saw this specimen of <a class="freelinking external" href="http://www.utexas.edu/cofa/rrk/specimen.php?type=Gothic&amp;sub=Lineal&amp;specname%5B%5D=Gothic%20Light%20Face&amp;specname%5B%5D=Gothic%20Special&amp;specname%5B%5D=Gothic%20Extended&amp;specname%5B%5D=Gothic&amp;specname%5B%5D=Gothic&amp;specname%5B%5D=Gothic%20Condensed%20Outlined&amp;specname%5B%5D=Gothic%20Round&amp;specname%5B%5D=Ancient%20Gothic&amp;specname%5B%5D=No%20133&amp;specname%5B%5D=Octagon&amp;top=lineal&amp;folder=B_3_3A&amp;text=RRK_B_3_3A_01.rtf&amp;img=B_3_3A_Spec_01.jg&amp;count=1&amp;countmax=9" rel="nofollow">Gothic Light Face</a> and I'd like try my hand at (re)constructing the lowercase, I'm aware that many of these early gothics didn't have a lowercase counterpart, however, looking at the <a class="freelinking external" href="http://www.utexas.edu/cofa/rrk/specimen.php?type=Gothic&amp;sub=Lineal&amp;specname[]=Gothic%20Light%20Face&amp;specname[]=Gothic%20Special&amp;specname[]=Gothic%20Extended&amp;specname[]=Gothic&amp;specname[]=Gothic&amp;specname[]=Gothic%20Condensed%20Outlined&amp;specname[]=Gothic%20Round&amp;specname[]=Ancient%20Gothic&amp;specname[]=No%20133&amp;specname[]=Octagon&amp;top=lineal&amp;folder=B_3_3A&amp;text=RRK_B_3_3A_02.rtf&amp;img=B_3_3A_Spec_02.jpg&amp;count=2&amp;countmax=9" rel="nofollow">Gothic Special</a> it seems I could derive an understanding of how the lowercase might've been intended for the Light Face. My intention isn't strictly about revival – maybe a re-interpretation? </p>
    <p>What other sources I could look at to understand how a lowercase could be constructed for this kind of gothic? (19th Century American gothic?.</p>
    <p>Any help appreciated!</p>
