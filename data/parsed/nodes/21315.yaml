    html: |-
      <p>Let’s say it’s thin Helvetica.<br>
      The connectors are probably added in Illustrator.<br>
      The w is a upside down m.<br>
      The a is a modified d.<br>
      And g is combined from u and g.<br>
      Also c, e and t are modified.</p>
      <p>Well, maybe not Helvetica but close.</p>
