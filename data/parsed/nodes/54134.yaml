  html: <p>We have just releases two new faces- Chipping and Terazza Tiling.  New additions have also been made to our Helenium and Bromwich families.  Samples and further information are at our <a class="freelinking external" href="http://gatf.wordpress.com " rel="nofollow"> blog</a>.  As always the fonts can be previewed and purchased at <a class="freelinking external" href="http://new.myfonts.com/browse/foundry/gatf/ " rel="nofollow"> MyFonts.com</a>.</p>
