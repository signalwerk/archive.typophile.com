    <p>My son, a recent transplant to Portland OR, alerted his type-geek dad to the <a class="freelinking external" href="http://www.printerstrader.com/Article.aspx?ns=833" rel="nofollow">C.C. Stern Type Foundry</a>, a volunteer-run working museum, offering public programs to preserve the craft of type casting, and to educate and inspire a new generation of printers and students of printing history.</p>
    <p>Here are some photos he took at their open house on March 26, 2011:</p>
