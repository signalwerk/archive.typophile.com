      <blockquote><p>consistency of overall text colour, and consistency of scale of detail.</p></blockquote>
      <p>This is what I don't believe in, because the functionality of a [text] face doesn't come from formal attributes, especially when you factor in differences in how cultures see forms; such formal consistency ignores tradition (which harms functionality). For example, a "literal" Cyrillic Trajan cannot mean the same thing for Russians as Trajan does for Westerners.</p>
      <p>To me -in a text face- the correct way to approach it is "multi-laterally": start form the scripts individually and see where they can meet; and very often they simply can't get close enough to satisfy the important requirements (which for one thing doesn't include the conscious appreciation of alignment) so you snap away (for example by not forcing the "x-height"s to align).</p>
      <p>hhp</p>
