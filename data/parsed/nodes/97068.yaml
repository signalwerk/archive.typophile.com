    html: <p>Want to come back to the ideas of this thread later, once I've properly formulated the problem that's been troubling some of us all year in Reading, basically that the same formal characteristics of a design may be either very very conventional or completely alien in a different script. What some call the 'atmospheric values' of a typeface depends entirely on socio/cultural associations; where formal characteristics may connote a very different era or mood in a different script. For example the broad nib convention in Latin doesn't work well in Thai, where expansion serves the letterforms more historically accurately, as well as more aesthetically. Sorry, I appear to be speaking in fragments.</p>
