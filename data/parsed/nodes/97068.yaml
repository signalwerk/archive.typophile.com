      <p>The Roman alphabet is itself an artifact of European culture [as Hrant observed while I was writing this], so it's perhaps inevitable that designing variations on the Roman alphabet is a profession mainly practiced by people of European origin or descent. I imagine us white folks are similarly under-represented in the ranks of those who design Kanji fonts. </p>
      <p>Non-Europeans creating designs for the Roman alphabet is one measure of progress toward a more diverse society. Another measure--more important, in my opinion--will be more white folks learning to read non-Roman alphabets, and to respect the ideas they communicate.</p>
