      <p>I could be completely off base here, but I get the impression that Europe has a longer and deeper history of typefaces in general due to having a longer and deeper history of using movable type.  I gather movable type took off in Europe more readily than in other cultures because Europeans had simpler writing systems.  For instance, ISTR reading that movable type was invented in China some time before Gutenberg but just didn't see any significant adoption because it simply wasn't practical for a language with many thousands of common-use characters.</p>
      <p>If that's the case, then European (and by extension Latin) text largely set the trends in printing and type design, and once the digital age came along (and computer character sets became standardized) the support of Latin text became embedded.  The earliest generations of computers were Anglo-American and only supported ASCII (Latin).  As new computer character sets were developed they were implemented as extensions of ASCII for compatibility purposes, and so virtually all character set standards mandate full Latin support, regardless of what other languages are covered.  That logically extends to the computer fonts designed for them.  </p>
      <p>I've seen many references on myfonts and other sites to designers with Russian-sounding, Japanese-sounding, Middle-eastern-sounding, and other non-Anglocentric names.  Even their fonts tend to include Latin, and that's what we see in the previews (usually).  I suppose if they didn't, the fonts wouldn't be disseminated much outside their own countries/cultures.</p>
      <p>Living for five years in Japan, I can't say I ever noticed a particularly wide variety of fonts being used, for either English/Roman text or for pure Japanese.  (Virtually every sample of English I ever saw written used either MS Mincho/MS Gothic or Helvetica; the vast majority of Japanese text outside calligraphy or custom logos always seemed to be either Heisei-Gothic/Heisei-Mincho, MS Gothic/MS Mincho or something resembling the M+ fonts.)</p>
