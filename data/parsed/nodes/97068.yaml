      <p>Consistent color is generally a good thing in my view, but thinking "let's start with serifs where they would be in Latin and maybe take some out so the two scripts look closer" isn't.</p>
      <p>As for trying to match apparent size (which I've never heard of as "scale of detail") as I said I agree that it's very important (mostly because you don't want people feeling inferior). That said it's possible to counter-balance that with color (i.e. make one script smaller but darker than the other) especially if you simply can't make the apparent sizes close enough - think of combining Latin and Arabic.</p>
      <p>hhp</p>
