      <p><em>…the functionality of a [text] face doesn't come from formal attributes…</em></p>
      <p>By “consistency of overall text colour”, I mean between the two scripts, so that they both appear to be the same weight of font. This is a reasonable expectation for typographers to have, tasked as they often are with balancing the import of blocks of different-script text, side by side on the same page. You don’t want your Greek to look like Regular and your Latin to look like Semibold.</p>
      <p>Similarly, with “scale of detail”, you don’t want your Roman to look like a body face and your Greek to look like an agate.</p>
      <p>Weight and optical size are formal attributes of a typeface, and they have to be consistent between scripts, or else the settings of at least one of the scripts will require so much tweaking by the typographer that the font becomes dysfunctional for multi-script layouts.</p>
