      <p>Another reason could be that the entire technology <em>an sich</em> is deeply culturally biased towards the Western world. The ASCII table, for example, has been the bane of everything European for literally decades on end (the "AS" stands for "<em> American</em> Standard). After much deliberating, and various more or less succesfull hacks (e.g. the dreaded "code pages"), the 'world wide' embrace of Unicode put an end to accent related troubles. Or to a lot. Not all of them.<br>
      However, in that the Western culture also ruled supreme! Arabic characters, for example, have been coaxed into 'different' code points for their four different forms. If you think writing a case insensitive search routine is a bother for Latin text, you can quadruple the efforts needed for Arabic.</p>
      <p>Another example of technology following culture could be the keyboard. Much as "we" are used to a Shift key to toggle between capitals and lowercase -- to the point where we can mentally extend the concept to toggling between the number "3" and the character "#" <em>even though these are unrelated</em> --, if the keyboard concept was of Arabic origin, one could expect it to have <em>four</em> 'shift' keys to alternate between initial (somewhat equivalent to "our" capitals), medial, final, and isolated form. (Two shift keys with a binary function may also work.)<br>
      But that's still imaginable for "us" Anglo-Europeans. What if the concept of machine input was inherited from Chinese sources? I'm not talking about the clunky 30,000 key typewriter (which is just Western tech projected onto Chinese target audience). In China, an age old habit in discussing ideograms is to 'write' them in the palm of your hand. Extrapolating that to a mechanical method may have led to the <em>touchpad</em> as the primary input source for a computer!</p>
      <p>Coming to a point here: if the reason Western font designers are dominant, and there may be "not that many" non-Western font designers, it is because the entire technology, from storage to display, is based  on Western concepts of data storage, text input, rendering, and font design itself.</p>
      <p>This whole story only covers one of my three points, Technology. I'm sure a similar argument (long winded, apologies) can be made for the other two: Money and Opportunity.</p>
