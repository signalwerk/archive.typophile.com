      <p>Good analysis, and interesting ideas!</p>
      <p>BTW Arabic would need only two shift keys (giving the necessary four possible combinations)* but only if you could place any one of the four forms anywhere, which you can't; so Arabs are lucky that -assuming the necessary software environment- an algorithm can choose for them... and in fact they don't need <em>any</em> shift key! Although personally I happen to be a fan of reforming Arabic to support capitalization. In case that sounds jingoistic: you should see what I want to do to Latin.  :-)</p>
      <p>* This being something I actually implemented in the late 80s for Broadcast Titler on the Amiga**; and you had to hit the left arrow key after each keystroke. :-)  Those fonts of mine were actually also used to set Arabic and Farsi ads in some ethnic "yellow pages" directories. Memories...</p>
