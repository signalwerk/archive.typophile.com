      <p>Hrant, two shift keys are sufficient for four forms. :)<br>
      (1) None, for medial forms, because those occur most frequently; (2) ShiftA for Capitals, (3) ShiftB for Finals, and (4) both, for isolated (as I think that would be the rarest form).</p>
      <p>Typing, by the way, on my iPad. Actually the "keyboard" implementation on this device is dreadful. I make far more errors than usual, and they are way harder to correct (to a point where I hesitate to do a quick spell-and-grammar check). Then again, it's Western technology projected onto a device that <em>does not naturally</em> lend itself to it. Were I of Chinese descent and finally be able to write down any ideogram I wanted, I would have been delighted.</p>
