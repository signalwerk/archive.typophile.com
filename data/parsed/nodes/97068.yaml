      <p>Ha, <a href="http://www.flickr.com/photos/ohbendy/3935238365/" rel="nofollow">here</a>'s another one of the kinnari from Bangkok's Grand Palace.</p>
      <p>Anyway, what I'm trying to get at is the way that one needs to understand the traditions of a culture in order to avoid unwittingly imposing models or formal characteristics that have different associations. What this boils down to (at least for me) is that in multi-script typefaces, one may need to look beyond a single stroke model as the unifying element, and instead tie things together with atmospheric values, by which I mean the associations and preferences of the target readership, something which is very difficult for a complete outsider to grasp. One thing that I consciously kept in mind when creating Lumen Thai was to draw 'Thai' curves, which meant sometimes going against the shapes that came naturally out of my hand. Also it meant discarding the Latin stroke model and matching things in other ways: in terms of colour (though I've since realised Thai does need to be lighter because of the amount of superscript and subscript activity and lack of wordspaces), and by aiming for a humanist feel, though in the Thai the swelling stroke of a flexible nib is as conventional as the broad-nib in Latin, so the implementation of that humanist feel is executed differently.</p>
