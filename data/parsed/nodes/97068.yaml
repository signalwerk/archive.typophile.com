      <p>I dabbled a little in Japanese calligraphy, although I always wished I could study it in more detail.  (I was just looking into joining a local class when the earthquake and subsequent evacuations put paid to that, unfortunately.)  </p>
      <p>I have grown quite interested in looking at the internal consistency of Japanese fonts, with respect to how they combine the Latin and Japanese glyph sets.  It's rare to find the Japanese font which uses Latin characters that aren't painfully generic.  <a href="http://mplus-fonts.sourceforge.jp/mplus-outline-fonts/design/index-en.html" rel="nofollow">M+</a>, which is IMO one of the more attractive Japanese text fonts, uses a Latin set that looks extremely similar to Frutiger and Myriad.  (And that's one of the better examples - at least those are fairly nice Latin glyphs, if not very original.)  Of course, it goes both ways - Monotype's pan-Unicode WorldType fonts from the 1990s, for example, use extremely generic Japanese characters (although to be fair, their Latin is pretty unimaginative too).  One of the things I want to experiment with is in designing fonts with an internally consistent character style between Latin and Japanese (which still "fits" both writing systems).</p>
