      <p>It actually <em>is</em> kind of a Star Trek font. The posters/cover of the Star Trek movies throughout the '80s used a font that is strinkingly similar. <a class="freelinking external" href="http://images.themoviedb.org/posters/5373/star_trek3.jpg">Look at this.</a> Anyway, I don't think you can blame people for making the connection.</p>
      <p>That said, I would be interested to see an updating of this with Aller or some other corporate face like Officina. Another interesting direction might be something like <a class="freelinking external" href="http://new.myfonts.com/fonts/castletype/shango-gothic/">Shàngó</a>. It doesn't have a lowercase, but those serifs are interesting. Galaxy has serifs but it also has the sci-fi baggage, so if you want to make a less drastic change of face I would try out something with distinct serifs.</p>
