    <p>Hi All,</p>
    <p>I've inherited a company logo that I feel needs to be updated.  It's a software company, and they've had this logo for ten years.  I realize there is some equity built into this brand by now, so I don't think I want to make a drastic change, but I do want to evolve it a little:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/logo-ni_4742.png"></div><p></p>
    <p>I think I may need to adjust the typeface.  I've personally heard a few reactions from people when encountering our brand along the lines of "hey - is that the Star Trek font?"</p>
    <p>It's actually Galaxy, which is not the Star Trek font, but definitely has a distinct sci-fi feel to it.</p>
    <p>I'm looking for font suggestions.  Something that keeps some of the characteristics of Galaxy, but moves away from sci-fi and more towards a corporate feel.  For example, the lowercase t in <a class="freelinking external" href="http://www.fontsquirrel.com/fonts/Aller">Aller</a> is similar to the t in Galaxy.</p>
    <p>Any thoughts or suggestions?</p>
    <p>thanks.</p>
