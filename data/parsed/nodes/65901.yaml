  html: |-
    <p>Hi</p>
    <p>I am in the process of building a website setted in Museo <a class="freelinking external" href="http://www.josbuivenga.demon.nl/museo.html" rel="nofollow">http://www.josbuivenga.demon.nl/museo.html</a> .</p>
    <p>I will embed the font with @font-face so no need for sifr and the likes.</p>
    <p>I have a couple of questions for you experts : )</p>
    <p>First of all, I am looking for a good companion italic for the font (it misses one), what do you think of museo slab <a href="http://www.josbuivenga.demon.nl/museoslab.html" title="http://www.josbuivenga.demon.nl/museoslab.html">http://www.josbuivenga.demon.nl/museoslab.html</a> ? Could it fit?</p>
    <p>Second, do you think Museo can be a good font for body text or is it best to limit its use to titels and short bursts of text?</p>
    <p>Third, in case you think the font is not suited for body text, could be museo sans <a class="freelinking external" href="http://www.josbuivenga.demon.nl/museosans.html" rel="nofollow">http://www.josbuivenga.demon.nl/museosans.html</a>  a decent one?</p>
    <p>Thanks</p>
