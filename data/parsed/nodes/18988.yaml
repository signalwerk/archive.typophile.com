    html: <p>Nice little family. Should make a great annual report, etc., - Baskerville makes a very readable book font and this also has elegant display options. I would suggest that you specify a companion font for the occasions (such as tables and diagrams etc.) that probably won’t really suit it. Probably a useful condensed sans, but keeping the options quite limited, as with this Baskerville family.</p>
