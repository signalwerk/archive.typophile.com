  html: <p>Im realy in to the Fountain Baskerville 1757 and im going to use it in a design profile for a semi large company. I have never worked with companys this size - that put out annual reports and that kind of large publications, so I dont know if the baskerville will work in all the necessary form - tables, very small compact pargaphs etc. If you have any experience on baskerville in these contexts, please give me some advice.</p>
