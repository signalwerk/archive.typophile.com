      <p>Superb work, all!  Points all around for "Morris," "Oblig.," and the correct names.</p>
      <p>Thanks, Cerulean, for that illumination -- I see it now, and can imagine how a practiced hand would produce that sort of linear congruence. I often find that my own (unskilled) handwriting produces parallel lines and harmonious swashes that I could never have drawn by deliberate effort; it's delightful to see Ketchum's hand at work. This is an effect that OpenType may approximate, but will never equal.</p>
