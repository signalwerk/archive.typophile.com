    html: |-
      <p>I'm intrigued by the swashes between the lines "until that time. / Send me. . . " and the signature. I'm trying to imagine when (in the writing) one added these. The Signature swash seems to grow out of the "M," but it wraps around "Ketchum" in a way that suggests the name had been written by the time the swash surrounded it. The prior swash seems to function as the crossbar of the "t" in "time," but it aligns with other crossbars, and perhaps corsses the "t" in "the bill."</p>
      <p>Quin, as best I can puzzle it out, it reads:</p>
      <p>Capt. Ivor Higbe(e?)</p>
      <p>D[ea]r Sir,</p>
      <p>I wish you to deliver<br>
      me 800 bush. sand. Same<br>
      kind as before at Merrit<br>
      Dock next week without<br>
      fail as I have only<br>
      about enough on hand<br>
      to last one until that time.<br>
      Send me the bill and<br>
      I will send you the money<br>
      by Mr [name I can't make out] Young.</p>
      <p>Truly,<br>
      J[oh]n McKetchum<br>
      Dover, New York<br>
      Nov, 5, 1852</p>
      <p>Do not fail to get the<br>
      sand there next week<br>
      by the middle if possible.</p>
