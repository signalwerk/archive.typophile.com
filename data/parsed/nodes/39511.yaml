    html: |-
      <p>This is an exaggerated, sarcastic "review", to inform and entertain (mainly for entertainment value).</p>
      <p><strong>Letter to Captain Higbee of the Vapor</strong><br>
      Utterly maniacle everyday cursive hand from the late 18th century with expressive if rather over-enthusiastic pen manner. Existing on the margins of outright stupefaction but still posessing a fundamental coolness that modern handwriting just doesn't have. Pressure-induced changes in stroke width, character size variation visible from space and hedge-threatening understeer present a daunting challenge to digitzation.<br>
      <strong>Spec notes:</strong> All but j, q and z are present, but alarming lack of capitals means Jimmy Cat will need to study loads of similar writing from the period.<br>
      <strong>Completion date:</strong> Not distant enough<br>
      <strong>Rivals:</strong> P22 Cezanne, Lamar Pen, Houston Pen, Emily Austen, A good fountain pen<br>
      <strong>But also try:</strong> A nice sit down and a cup of tea.<br>
      <strong>My choice:</strong> Provided I don't intend to finish working on it before 2020, why not?</p>
      <p>Looking at the high res pic the plot gets a lot thicker. Do I seriously believe it can be made into a font? Maybe, maybe not. At this early stage I think the basic effect of the letter can be wrought in font form, but a full-blown emulation with all eccentricities may prove impossible. </p>
      <p>I'll keep you posted.</p>
      <p>j a m e s</p>
