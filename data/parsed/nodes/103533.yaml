    html: |-
      <p>This was a typeface known as "Roman" which was popular during the third quarter of the 19th century. Note the extreme thick-thin contrast like Didot or Bodoni. Also note the huge pointed-wedge shaped beaks on E, G, L, T &amp; S and mini unbracketed serifs. Foundry terminology varied but Roman Extra Condensed Italic, or Roman Elongated Slope would fit.  Here is a condensed version, with no slope, from Bruce Foundry 1869.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/RomanCond@Bruce1869p55_3914.jpg"></div><br>
      AFAIK "Roman" is not digitized in a precise match to your image.<br>
      Don<p></p>
