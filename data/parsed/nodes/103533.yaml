      <p>For a not exact, but fairly close to your image, rendition of the letters in your image see the following image using Woodentype's Roman Xtra Cond, wqhich also shows the letters with a slope of 4 degrees:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/RomanXCondWoodentype_5066.jpg"></div><br>
      I have no idea how you could purchase this font. MyFonts does not sell it and the website <a href="http://www.woodentypefonts.com/" title="http://www.woodentypefonts.com/">http://www.woodentypefonts.com/</a>, which used to sell it, merely has a notice in Russian that the website is suspended. Perhaps someone has current info on the foundry?<br>
      Don<p></p>
