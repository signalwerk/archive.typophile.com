    html: |-
      <p>Thanks Ryuk for posting the Wooden Type Foundry fonts. I won't duplicate the references.<br>
      A few more: Matthew Carter's <a href="http://www.linotype.com/899985/Regular-product.html/" rel="nofollow">Elephant Regular</a> is a well designed presentation of a design that is somewhere between Thororowgood and the font that formed the basis for your image. Somewhat similar is Monotype's 1931 design for <a href="http://www.myfonts.com/fonts/mti/falstaff/" rel="nofollow">Falstaff</a>. Berthold's 1860 design, <a href="http://www.myfonts.com/fonts/berthold/normande-bq/" rel="nofollow">Normand BQ</a> includes a condensed version and an italic version but not a condesnsed italic. There is also a Bitstream version of Normande.<br>
      Don</p>
