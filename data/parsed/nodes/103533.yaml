    html: '<p>Thanks to Don, digged a bit more and found these 3 ones, all from Wooden Type Foundry and possibly some digitizations of "Roman" as identified by him: <a class="freelinking external" href="http://www.myfonts.com/fonts/woodentypefonts/roman-x" rel="nofollow">Roman X</a> (no more available to sell unfortunately), <a class="freelinking external" href="http://www.myfonts.com/fonts/woodentypefonts/penny" rel="nofollow">Penny</a> and <a class="freelinking external" href="http://www.myfonts.com/fonts/woodentypefonts/roman-wells" rel="nofollow">Roman Wells</a></p>'
