    html: |-
      <p>Hi Jens, thanks! </p>
      <p>Those and the Kris's flickr photo were the best we could get.<br>
      We will love to have access to even better sources, like photos of the metal punches or original drawings, but sadly we don't so we have to guess a lot of the details.</p>
      <p>It's not just me. Rodrigo is also doing a lot of work.<br>
      He does the first round during the day and I iterate and refine during the night, and we chat over Skpye to discuss ideas.</p>
      <p>I'm also studying "Three Classic of Italian Calligraphy" by Oscar Ogg (facsimile reproductions of Arrighi, Tagliente and Palatino), and "Penmanship of the XVI, XVII &amp; XVIIIth centuries" witch can be read online here: <a href="http://www.archive.org/stream/penmanshipofxvix00dayluoft#page/n7/mode/2up" title="http://www.archive.org/stream/penmanshipofxvix00dayluoft#page/n7/mode/2up">http://www.archive.org/stream/penmanshipofxvix00dayluoft#page/n7/mode/2up</a></p>
      <p>Also, playing and writing with a variety of nib pens to try to get a better sense of the flow and the contrast.</p>
      <p>We sincerely hope that this can be good revival, and we are putting all our effort to make it as good as possible. But we can't do it alone, we need all the help and feedback from everyone. That's the only way we can improve it.</p>
      <p>We also have the previous digital CB revival by Richard Beatty, called Romus (the entire romus family) but it's not of any help, because it lacks all the details we are trying to include in our version, and it's also pretty different from the specimens. In fact, one of the reasons for doing this new revival, was that I was not happy with the one from Richard.</p>
      <p>We still have a lot to improve (the spacing in particular) but we are making progress every day.</p>
