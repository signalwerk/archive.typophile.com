    html: |-
      <p>Exactly what was the best available?<br>
      Can he be convinced to provide something better?</p>
      <p>If you have enough sample settings you can reverse-<br>
      engineer the original spacing. However the process<br>
      William describes seems too iterative; I'd use math,<br>
      and start with an "nn" you might hopefully find.</p>
      <p>But that's assuming you like the original's spacing...<br>
      A revival can be faithful in various flavors; since CR<br>
      was a metal type, adhering to the original spacing can<br>
      potentially be seen as a bit <em>too</em> faithful. You might study<br>
      JFP's revival of Sabon (they once produced a highly<br>
      revealing booklet about it) to see ways of figuring out<br>
      what compromises were originally made and why, in<br>
      order to decide what original decisions to over-ride.</p>
      <p>hhp</p>
