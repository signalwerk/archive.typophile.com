    <p>We are working on a Jan van Krimpen Cancelleresca Bastarda Revival, together with Rodrigo Fuenzalida. And we are doing it 'In the open', posting all the betas as we make progress, and encouraging public participation and feedback.</p>
    <p>I started this back in November 2011, and then put it to sleep because of the lack of high quality sources.</p>
    <p>But something awesome happened:<br>
    A very generous and humble Benedictine monk, that have the original metal cut, printed a specimen just for us and sent a high-quality scan. And we like to share it with the world.</p>
    <p>Now the project is back to life! We are currently on Beta21.<br>
    And, as usual, it will be released under the SIL Open font license.</p>
    <p>There is a little system in place, for easy sharing of comments and source files.<br>
    Here you will find the latest betas and source files (and the high-res scanned specimen):<br>
    <a href="http://www.impallari.com/projects/overview/jan-van-krimpen-cancelleresca-bastarda-revival" title="http://www.impallari.com/projects/overview/jan-van-krimpen-cancelleresca-bastarda-revival">http://www.impallari.com/projects/overview/jan-van-krimpen-cancelleresca...</a></p>
    <p>We will like to invite everyone to check it out, and participate!<br>
    You can make any edit to the sources you see fit, and post it back in the project comments.</p>
    <p>Beta21 Preview (Basic a-z A-z):<br>
    <img src="http://www.impallari.com/media/uploads/profotos/63-foto01-original.jpg"></p>
