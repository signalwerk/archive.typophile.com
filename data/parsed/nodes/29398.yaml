      <p>Sorry if this takes the thread off-topic somewhat, but I'm also looking around for foundries, to help me release a font I have in the queue. I had a nice email discussion with James Montalbano of <a href="http://terminaldesign.com" rel="nofollow">terminaldesign</a>, and he recommended setting up shop for myself, but I'm still thinking that I need an outfit that's set up to handle the commerce and deal with the routine day-to-day interactions with customers.</p>
      <p>The font I'm hoping to release is a highly faithful digitization of an metal face from the first half of the 20th century. In keeping with the exclusive spirit of the original face, I have decided to price it very high (say $500), so to my mind that rules out options like myfonts. Of course I don't expect to sell many licenses at that price, but that's ok. The goal is to make the face available to those who are passionate about using it.</p>
      <p>The foundry from the list above that seems to fit my needs most closely is <a href="http://vllg.com/" rel="nofollow">vllg</a>, but I sent in a query on their webform and it hasn't been returned. I don't know why not, but that's certainly not the experience I want customers to have.</p>
      <p>I'm not sure whether I need a foundry per se, or more of a shop. I haven't tried to get in touch with the people from Veer or FontShop, but perhaps that would be a way to take care of the customer service side of things while maintaining my own brand (I like the "despotype" suggestion of Hrant, and may indeed take that up).</p>
      <p>If you are the foundry I seek, feel free to get in touch. Any other ideas and suggestions are welcome.</p>
