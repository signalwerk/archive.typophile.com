      <p>This might save time:</p>
      <p><a href="http://www.bluevertigo.com.ar/bluevertigo.htm" title="http://www.bluevertigo.com.ar/bluevertigo.htm">http://www.bluevertigo.com.ar/bluevertigo.htm</a></p>
      <p>Beware; it's a 'clever' horizontal-scrolling thing. </p>
      <p>Keep in mind there's no standard way type gets sold. Some foundries sell only direct, some use one, or all distributors, some are collectives only, and most prolific type designers have work available from different sources. See Josh Darden and Christian Schwartz; both have fonts available at Village, but not the same ones as on their own sites... My stuff is all available at fonts.com but only because of reseller arrangements. Each design is from a different foundry. It's complicated. </p>
      <p>A better idea might be to catalog the gems themselves, and put the availability information second. I agree, there are some gems that don't get as much press as they should.</p>
