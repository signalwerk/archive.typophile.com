      <p>You will probably find after looking for a while that there are certain founderies or designers whose work you particularly like. I have particularly admired FontBureau--now I'm working on a font for them--and the folks at Village (<a href="http://www.vllg.com" title="http://www.vllg.com">http://www.vllg.com</a>). </p>
      <p>Make sure you check out the Dutch founderies, whose work is always impressive, if expensive: Lucasfonts, Gerard Unger, TEFF, DutchTypeLibrary, Typotheque, Ourfonts. </p>
      <p>Oh and don't overlook Jeremy Tankards wonderful stuff (<a href="http://www.Typography.net" title="http://www.Typography.net">http://www.Typography.net</a>).</p>
