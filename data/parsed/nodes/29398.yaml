    html: <p>Your price is too high for any dealer known to me. But apart from that, you need to incorporate, set up a website if only to show your work, and then join as many dealers as possible, starting with FontShop and MyFonts, where everybody surfs. But not if you insist on pricing that high--nobody will take you on, and why should they? The market is now flooded with inventive, quality fonts at affordable prices, though not as affordable as I would like. Fonts should be priced like paperback books, not bone china.</p>
