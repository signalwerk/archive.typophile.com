      <p>The cost of typeface licensing is meant to fund both the development of that typeface and the development of future typefaces. Like novels or albums, typefaces take months or years to create, and there is no guarantee that a typeface will sell enough to subsidise its creation. But a successful typeface will fund the design of other types, as well as (hopefully) paying rent, and in our case, server hosting, merchant bank fees, advertising, promotion...</p>
      <p>Some foundries and distributors believe in quantity over quality: release enough stuff and some of it is bound to sell. Others, including Village, believe that quality is more important than quantity, and we know that our clientele continues to visit us due to the quality of the offerings from our small group.</p>
      <p>With many apologies for the blatant self-promotion.</p>
