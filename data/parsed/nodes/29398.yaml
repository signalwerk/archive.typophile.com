    <p>Hey guys,</p>
    <p>I know this has probably been posted a bunch on this site, but I'm needing a refresher and maybe I can give you a few new type <a href="/wiki/foundries" class="freelinking" rel="nofollow">foundries</a> to look at as well.</p>
    <p>I am looking for those small, nitche market type foundries that have that charm and excellence. Everyone knows about the following:</p>
    <p><a href="http://www.typography.com" title="http://www.typography.com">http://www.typography.com</a></p>
    <p><a href="http://www.myfonts.com" title="http://www.myfonts.com">http://www.myfonts.com</a></p>
    <p><a href="http://www.fonts.com" title="http://www.fonts.com">http://www.fonts.com</a></p>
    <p><a href="http://www.linotype.com" title="http://www.linotype.com">http://www.linotype.com</a></p>
    <p><a href="http://www.fontshop.com" title="http://www.fontshop.com">http://www.fontshop.com</a></p>
    <p>But I'm looking for more sites like this:</p>
    <p><a href="http://www.typetrust.com" title="http://www.typetrust.com">http://www.typetrust.com</a></p>
    <p><a href="http://www.processtypefoundry.com" title="http://www.processtypefoundry.com">http://www.processtypefoundry.com</a></p>
    <p>and</p>
    <p><a href="http://www.ascendercorp.com/portfolio_commercial.html" title="http://www.ascendercorp.com/portfolio_commercial.html">http://www.ascendercorp.com/portfolio_commercial.html</a></p>
    <p>If you guys have any type foundries you know of or just those one off fonts that someone has created and is selling, but is a high-quality font, I'd love to archive it. Thanks for all the help.</p>
