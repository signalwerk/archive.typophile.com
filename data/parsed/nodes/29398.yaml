      <p>My other concern about setting your initial price that high is that you will remain unknown and your fonts unused--is that the best payoff for your development efforts? Perfect example: Rialto, a three-font family that represents the finest Renaissance interpretation on the market today, comes from European designers with no website yet, and costs 580 euros via snail mail, so of course its progress in the marketplace is obstructed and slowed. With lower prices and better consumer access, they can compete with, say, Josh Darden, who offers Corundum, 12 fonts for $189, a really distinguished effort, among others on his site.</p>
      <p>Regular half price sales, like DSType is now offering, are a great boon to us freelancers who work in, say, nonprofit, and need the sort of break that companies and agencies don't need.</p>
