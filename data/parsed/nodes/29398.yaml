      <p>Use MyFonts and FontShop to survey all the best indie foundries in one spot at a time. Just go into the font categories, set your screen to show the max number of entries, and surf away. Xavier Dupré is the key indie guy in both places right now.</p>
      <p>Best designer with his own buy-direct website is<br>
      <a href="http://www.joshuadarden.com/" title="http://www.joshuadarden.com/">http://www.joshuadarden.com/</a></p>
      <p>the Prada of type houses is Hoefler-FJ:<br>
      <a href="http://www.typography.com/catalog/requiem/charset.html" title="http://www.typography.com/catalog/requiem/charset.html">http://www.typography.com/catalog/requiem/charset.html</a></p>
      <p>and Berthold from Germany has some fabulous families, well-priced:<br>
      <a href="http://www.bertholdtypes.com/bq_library/BQ_library.html" title="http://www.bertholdtypes.com/bq_library/BQ_library.html">http://www.bertholdtypes.com/bq_library/BQ_library.html</a></p>
      <p>the best free fonts are from Nick Curtis at<br>
      <a href="http://www.moorstation.org/typoasis/designers/curtis/pages/a.htm" title="http://www.moorstation.org/typoasis/designers/curtis/pages/a.htm">http://www.moorstation.org/typoasis/designers/curtis/pages/a.htm</a></p>
      <p>and Larabie fonts at Myfonts</p>
      <p>Happy hunting!</p>
