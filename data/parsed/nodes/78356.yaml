    <p>Hello everyone.</p>
    <p>I'm making a PHP application to generate text labels. The PHP libraries seem to don't support OpenType features.<br>
    Now I have no problem working with unicode index to display the standard characters.<br>
    But, as far as I know, the OpenType features are name based.<br>
    For example: if I want to display a ligature «my» I have to replace «m» and «y» unicodes indexes by «my» unicode index.<br>
    The problem now is I don't have unicode indexes on this characters and I can't reffer to them by their names.</p>
    <p>The questions are:</p>
    <p>Is there any existing unicode for these glyphs and I am missing them?<br>
    Do I need to reencode all the glyphs?<br>
    Which is the best way to reencode a font and/or generate unicode names for this purposes?<br>
    Is there any standard?</p>
    <p>I also noted, when I reencode an existing font with many glyphs and generate a new version the file size increases almost ten times.</p>
    <p>Your help and contributions will be appreciated.</p>
    <p>Thanks in advance.</p>
