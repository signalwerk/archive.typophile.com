      <p>A different way to do it:</p>
      <p>In font window select "Names mode" and "OpenType Standard"<br>
      Glyph &gt; Glyph Names &gt; Generate Unicode<br>
      And then "Standard Table" + "Try to keep Unicode indexes" + "Assign PUA indexes to unencoded Glyphs"</p>
      <p>I was missing to change to «Names mode» in the Font Window. Once I do it it seems to work when I reencode and generate unicode, it adds PUA indexes.</p>
