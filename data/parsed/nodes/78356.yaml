      <p>Nick: </p>
      <p>Actually what i'm trying to do is to get the special characters unicode for any font. Because it depends on the encoding of the font I'm trying to figure out the more quick and simple method to do it.<br>
      For example, I want to use a font with ligatures and stylistic alternates for image generation. I'm not sure if there is a way to reffer to the unicode from scratch, i think it strictly depends on how the unicodes were asigned to this font. If there is no unicode for the special characters (ligatures, alternates, small caps, etc), how should I reencode / reassign the unicode numbers in Fontlab avoiding doing it one by one? Is there any way to assign them in one movement?</p>
