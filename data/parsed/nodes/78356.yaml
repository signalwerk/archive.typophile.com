      <p><em>How to assign Private User Area unicodes to all the swashes, alternates and ligatures?</em></p>
      <p>Here's what I did; I'm not sure that it's the approved method, but it has worked for me so far.</p>
      <p>In <strong>Program Files &gt; Common Files &gt; FontLab &gt; Mapping</strong>, I opened the file <strong>standard.nam</strong> in NotePad+ and saved it as <strong>standard_old.nam</strong>. I then made a few changes to the file, following this format...</p>
      <p><code>0xF### glyphname</code></p>
      <p>then saved the file as <strong>standard.nam</strong>.</p>
      <p>Then, in FontLab, I made sure that under <strong>Tools &gt; Options &gt; Unicode and OpenType &gt; Default Unicode-Name mapping table</strong>, I selected <strong>Standard Table</strong>.</p>
      <p>Finally, in order to generate my new "standard" Unicode, after I have composed all my glyphs and named them according to MY standard, I select <strong> Glyph &gt; Glyph Names &gt; Generate Unicode</strong>. Finally, just for good housekeeping, I select Index Mode, Select All glyphs, sort them by Unicode, then select Charmap View.</p>
      <p>As I said, I don't know if this method is kosher/halal, but it works for me,</p>
