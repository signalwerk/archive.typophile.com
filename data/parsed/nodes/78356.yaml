      <p>OK, I'm going to go out on a limb, since no one else has bothered to answer.</p>
      <p>AFIK, you can assign unicode numbers to your special characters in the Private Use area. However, you should be aware that some folks have already staked out niches in that territory...</p>
      <p><a href="http://scripts.sil.org/cms/scripts/page.php?item_id=VendorUseOfPUA" title="http://scripts.sil.org/cms/scripts/page.php?item_id=VendorUseOfPUA">http://scripts.sil.org/cms/scripts/page.php?item_id=VendorUseOfPUA</a></p>
      <p>but you ought to be able to find some unclaimed slots to code your characters so your script will work.</p>
