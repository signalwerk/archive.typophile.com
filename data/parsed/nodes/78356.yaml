      <p>I made an experiment:</p>
      <p>I created a Robofab script that assign an unicode to every character without unicode index.<br>
      It checks every glyph, if it doesn't have unicode the script will assign a new PUA value, starting from E000 (57344) and increasing by one for every glyph.<br>
      I generated an Opentype/PS version and it works with my image generator.<br>
      I'm not sure if this is extremely unortodox or if it will take me to new problems.<br>
      I tried it and it works. I assume there is no problem with these unicodes until I try to use it in other systems.</p>
      <p>Nick: Thank you for your solution for the Standard Table edition. I didn't try it yet.<br>
      Also, if you want the script I made, just let me know.</p>
