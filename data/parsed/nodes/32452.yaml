    html: |-
      <p>&gt; Although i don’t know if we can work with pdf in html? anybody?</p>
      <p>PDF is great for what it does ... provide a consistent print/web look. It is not the tool for making an entire website, however. For one thing, you will never get a good listing with the search engine, since they only index HTML pages, not PDFs.</p>
      <p>The top web program is Adobe Dreamweaver, although there are other programs worth considering (Microsoft Front Page is NOT one of them).</p>
      <p>You can build web page with a simple text editor like TrueText or Notepad, but it requires learning how to write the code.</p>
