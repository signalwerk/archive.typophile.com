      <p>ID does output to XML, I think, and that is HTML on steroids. It sounds like you might want to get into data-driven websites, where you design a basic page, and it feeds the necessary copy to it, depending on the situation. This site is an example, along with Amazon, etc.</p>
      <p>The tool for doing that kind of thing is the php language, ASP, ColdFusion, and maybe more. You can access some of these tools in Dreamweaver.</p>
