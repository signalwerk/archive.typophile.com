      <p>If you've got nothing, and I mean <strong>nothing</strong> else, it might be OK for some preliminary layout, and then you could tinker with the code with a text editor.</p>
      <p>That being said, I'd either buy a dedicated package (like Dreamweaver) or explore the templates of Blogger: even as a pretty hardcore and competent IDer, I've done both of these, and they are ***way*** better at doing web than ID.</p>
