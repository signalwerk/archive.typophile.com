      <p><em>Optima Nova is a business decision.</em></p>
      <p>New weights and features were necessary for today’s font usage, but it seems to me that redesigning key glyphs such as /a and /c and making a “proper” italic were done to provide a clearly visible difference to potential purchasers, despite the fact that the original design is best.</p>
