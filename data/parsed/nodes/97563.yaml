    html: |-
      <p>Another Optima alternative that a really like is <a class="freelinking external" href="http://www.fontshop.com/fonts/downloads/monotype/mentor_sans_pro_volume/" rel="nofollow">Mentor Sans</a>, particularly the bold. Where Optima has a wonderful classical stateliness and elegance, Mentor Sans has a briskness and vigor and strength that is wonderful in its own distinctive way. By contrast, to me most Optima variants look like they're trying to be Optima and failing. </p>
      <p>By the way I like both the old and new versions of Optima by Zapf, except for the condensed, which to me is a betrayal of the concept, with the wide, elegant classical arches.</p>
    html_clean: |-
