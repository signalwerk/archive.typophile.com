      <p>Mendoza is a fantastic typeface. Its low contrast makes it great to set type in small sizes.<br>
      I actually found I owned a license (bundled with some old software, I don't recall if it was Freehand), and I hope some day I will have the opportunity to use it…</p>
      <p>I do not have a similar feeling for recent faces, besides it seems there are so many gems to de discovered among 1980s designs (which went overlooked because of the frenzy of the digital avant-gardes, pursuing more display-oriented letters).</p>
