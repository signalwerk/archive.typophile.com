    html: |-
      <p>I've seen Melior and Plantin often enough not to think of them as particularly rare. Aldus, the "book" version of Palatino, on the other hand, seems to turn up only in books typeset in Europe, particularly in German-speaking areas, so I would put it at the borderline of this category.</p>
      <p>But there are <em>many</em> excellent typefaces that truly are almost never used - they probably number in the hundreds, if not thousands.</p>
      <p>Despite the fact that Sturgeon's Law also applies to typefaces, and poor ones vastly outnumber excellent ones. Actually, <em>despite that</em> in one way - if poor typefaces outnumber excellent ones so much, how can so many excellent ones exist - but <em>because of that</em> in another - since so many inferior typefaces exist, sifting through them to find good ones is arduous, so it's simpler to rely on a "gatekeeper", and only consider the most popular typefaces from the biggest font suppliers.</p>
