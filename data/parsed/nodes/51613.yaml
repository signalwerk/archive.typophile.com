      <p>Thanks, Hrant for pointing me to this thread. I've been working on an Emerson project for the last couple of years, and I'm taking a very broad approach, digging up lots of interesting history, pattern drawings and correspondence, reading about Blumenthal and comparing the foundry type with the Monotype conversion. I've settled on my approach, but progress is slow as I have plenty of other projects on the go, but here's a sneak peek. There's still a need to even out the colour but this shows the overall proportions, weight and styling I'm aiming for. There are some interesting unpublished italics which I intend to revive too, along with bold and possibly other weights. </p><div class="imageWrap"><img src="http://typophile.com/files/EmersonBM_6466.jpg"></div><p></p>
      <p>I'm interested in the comment about the long extenders; are you referring to the Nonpareil revival?</p>
