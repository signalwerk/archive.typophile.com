      <p>Jay Rutherford<br>
      I used Mendoza along with Interstate Bold for a corporate identity project a few years ago. They go great together! I built a font package with Mendoza normal, Mendoza Italic, Interstate Bold in the bold position and Mendoza small caps in the bold italic position. The contrasts work well, and it's easy for the architects to use on their PCs. </p>
      <p>I also used Clifford some years ago for a book – the documentation of a typography conference we held here in Weimar in 2001. It was never actually printed, rather the PDFs were burned onto a CD and sold that way. Clifford reads really quite well on screen, as well as being an excellent text face for print. I'll upload an image when I get to a computer where the drive works.</p>
