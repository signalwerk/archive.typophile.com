      <p>Just took a look at Silica.</p>
      <p>Yes, it has enough weights that one could use an intermediate bold instead of italics. Doing so still limits flexibility in choosing which weight to use for normal text, though: if this <em>is</em> what is intended, it should have had twice as many weights as it does.</p>
      <p>Also, I do have to admit that the design does not seem well suited to a companion italic. However, there are many quite similar typefaces out there which have italics, so I suspect that it isn't that badly suited to one.</p>
      <p>If there's a more faithful revival of Emerson out there now, that's really good news.</p>
