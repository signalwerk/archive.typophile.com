  html: |-
    <p>I'm sure we all have certain typefaces we know are really brilliant but somehow they never seem to get the exposure or publicity the rightfully deserve as examples of great type design.</p>
    <p>One of those for me is ITC Mendoza. I very rarely see it but it seems to me that it's a really lovely typeface.</p>
    <p>Anyone else knows fonts like this?</p>
    <p>(granted, this is all personal opinion)</p>
    <p>Mark</p>
