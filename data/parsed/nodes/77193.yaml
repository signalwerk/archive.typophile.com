    <p>I know I have seen it before, bu I can't find it. I am looking for an image of a sans-serif, lower case, double-storey letter g. The G doesn't have the link between the loop and the bowl. It sits simply as two rings, the top one with an ear. I know it was quite beauitful, but I can't find it. If anyone can supply a link to an image that would be great. If there is a typeface that comes to mind that would also be fantastic.</p>
    <p>Thank you.</p>
