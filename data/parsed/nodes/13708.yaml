    html: "<p>Art for arts sake. It pretty but doesn't say anything about your agency or its portfolio. The type is a mess and doesn't really say anything. It should be more direct and point you to a direction to see the portfolio. When I'm on the web I don't want to fight to find links or information. Unlike print its a media that I have very little patients with. Its not like you can close the cover and reopen it to the last page you were reading. Remember: KISS (Keep It Simple Smarty)</p>"
