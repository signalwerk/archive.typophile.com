  html: |-
    <p>As you might know, to avoid legal issues with Apple*, the LiveType Project will change it's name into... what into it's still not decided. <strong><a href="http://livetype.sourceforge.net/poll" rel="nofollow">Please vote on this poll</a></strong> and give us your oppinion about wich name to choose, or suggest a new name.</p>
    <p>To people who still don't know this project, <a href="http://livetype.sourceforge.net/index.html" rel="nofollow">here's a litle info</a>.</p>
    <p>*As suggested by Adam <a href="http://www.typophile.com/node/13565" rel="nofollow">in this node</a></p>
    <p>Some of the names thought were:</p>
    <ul>
    <li>Liveforge</li>
    <li>Livefoundry</li>
    <li>Typeforge</li>
    <li>Livefont</li>
    <li>Collabtype</li>
    <li>Co-type</li>
    </ul>
    <p>We've been running slower these past days, but we'll make it up, you'll see!<br>
    Thanks in advance for all the help and oppinions!</p>
    <p>Cheers,<br>
    Pedro</p>
    <p>P.S.: We are also getting very excited as we prepare to attend ATypI Conference in Helsinki, next September. It would be cool to see some oppinions about ATypI here too!</p>
