  html: <p>You all know that <a href="http://www.truthindesign.com" target="_blank">www.truthindesign.com</a> and with partnership with fontsforflash.com started super pixel fonts for flash which gives a smooth look in flash. A similar method is used on this site <br><a href="http://www.pixietype.com/news.html" target="_blank">http://www.pixietype.com/news.html</a> <br> <br>But they called it Pixel Fx. <br>Is this the same as super pixel fonts?</p>
