    html: '<p>JARED <br>did you smash the type or stretch it?? in #1 &amp; #3? It has a very squashed,  cluastrophobic feel which you may not want. You should also determine whether the name of your business is one word, or 2...If you are into the ligature idea, look at how the fl ligature is often constructed. The f doesnt need to curve completely around to the stem of the l...the l and f usually collide, not blend into each other. <br>Also, in #3, I keep seeing "Ah" and grain silos. <br> <br>I would have to say that #2 is the strongest idea. But, work with the monogram a little bit more, maybe enlarging the black square. If you use it though, I would definately ditch the type next to it. They look like two different elements which coincidentally butted up against each other...Also maybe something less geometric would work better for the monogram concept---something less German Aircraft factory, circa WW2 (das fairhaus) <br>Could you find a more interesting sans serif to work with? Or maybe experiment with handwriting---or even color instead of black?</p>'
