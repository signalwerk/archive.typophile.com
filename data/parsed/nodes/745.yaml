    votes: null
    html: <p>Ignacio's (halfway up the thread) is very good, as far as working with your original monograms. <br> <br>However, you may be putting the cart before the horse. There are a million ways of combining F, H, and D. What you need to do first is identify the look and feel you want, because this will characterize your company. <br> <br>Do you want an edgy, techy "new media" look? Would you like a clean, European feel? A muted, subdued, professional look? Do you want to portray energy or steadfastness? Fun or seriousness? Cheap or expensive? Common or elite? Questions that need answers... <br> <br>Paul</p>
