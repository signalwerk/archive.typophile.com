    html: <p>This is an interesting direction. What do you think of softening it to something of a pinwheel shape? The squareness at the center is reminiscent of a swastika (This may be just me). You might try breaking the circuit to alleviate this feeling as well. <br> <br>In any case, in my tinkering I came up with an interesting, and I believe more pleasing alternate. What if you extend both the ascending and descending small tips flush with the tops of the f's, delete the left and right tips. and break the box into an F character and an H. (note you will also need to extend the hook of the f.) The result is an FH melded into a pinwheel. <br> <br>I hope this makes sense.  <br> <br>Andrew</p>
