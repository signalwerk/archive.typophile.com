    html: |-
      <p>I too could not find Adonis.</p>
      <p>The image is small scale so I don't know if this font has small serifs, like Copperplate, or is a plain sans.<br>
      Assuming it's plain, there is a fairly close match in Silas Dilworth's design for Reservation Wide, a Type Trust Font:<br>
      <a href="http://www.myfonts.com/fonts/typetrust/reservation-wide/" title="http://www.myfonts.com/fonts/typetrust/reservation-wide/">http://www.myfonts.com/fonts/typetrust/reservation-wide/</a><br>
      The only letter that is significantly different from the image is capital G, which could easily be edited to replace the bar with a curve.<br>
      Don<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/ReservationWideTypeTrust_6395.jpg"></div><p></p>
