    <p>Hi everyone,</p>
    <p> I'm new to the website and I've found all the information here very helpful. For my senior project I chose to design a typeface from scratch, and there are some technical issues that I am having. I am making an italic serif typeface in the old style/ transitional style. I've taken some inspiration from Giambattista Bodoni's Bodoni typeface, and it will be used for displays, pull quotes, and headers. </p>
    <p>Just like Bodoni's italic font in the lowercase the serif curves (e.g. lowercase 'h') up to the right and the width of this serif determines the width of the thin areas in the rest of the family. My questions is; In illustrator I'm having difficulty making sure the widths of the thin areas are consistent? because of the angle and different shapes of the bowls, cross bars, and descenders are all so different.   </p>
    <p>I apologize in advance if this isn't the right section to be posting this topic, but any help would be much appreciated since I am new to this process. </p>
    <p>thank you</p>
