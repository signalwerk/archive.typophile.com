    html: |-
      <p>Leslie Caberga advises drawing a "gauge ball" - a perfect circle of the chosen diameter, which can then be moved around to check widths. </p>
      <p>That said, mathematically equivalent widths and optically equivalent widths are two different things; and really, the only tool to achieve the latter is your eye.</p>
