    html: <p>A path with a <strong>normal stroke</strong>, when converted to an outline, will have a uniform width. A path with a <strong>calligraphic stroke</strong>, when converted to an outline, will have a width consistent with the dimensions of the calligraphy tool chosen. Such outlines can replace elements in the glyph designs, or you can put them on a lower layer and adjust your glyph outlines to match the results.</p>
