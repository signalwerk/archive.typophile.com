      <p>&gt;<em>david L</em><br>
      thanks so much – this really is light at the end of the tunnel and it seems worth waiting for the release. i hope adobe will not delay shipping too long (there are others waiting for the release, too, as various threads tell).</p>
      <p>a followup-question appeared to me lately: i know that <em>Hypatia</em> works in office-applications but of course without support for the open type functions. do you know if there are plans to deal with (at least some of) the stylistic sets? e.g. for the specific organisation i mainly used the stylistic set 1 (i.e. sans serif – or dongleless as it appears to be called lately) and it would be handy if the client could license this set as a truetype-font. the same with the stylistic set 13 (i.e. unicase). other sets like the W-variants might not be as important, though i really love the multitude of varieties and use them for other clients, too. </p>
      <p>thanks again,<br>
      gerhard</p>
