    <p>right after i got CS3 in 2007 i created a corporate design for an international organisation. i was really positively influenced by the options that came with the <em>hypatia sans</em> font and made it the central font in the design, using it in a mutlitude of variations for titles, headlines, bodytext from logodesign to magazines, letterheads, annual reports etc. - all this believing that the font (including the itallics) would be available within short time. </p>
    <p>The CD was highly acclaimed by the customer and i did quite a lot of follow-up designs since then. by now, though, my client needs to do regionalised layouts and other stuff in departments all over the world - so here i stand not willing (and not allowed) to pass on the font, but not able to supply my client with a satisfying solution. </p>
    <p>here's my question: what would be good fonts do replace <em>hypatia sans</em> or assist it (as i won't change logos and frontcover-designs for the sake of continuity)? </p>
    <p>to make it easier: i only used the stylistic set 1 (i.e. sans serif) and (for headlines etc.) the set 13 (unicase). but i used all 6 weights. i used proportional and tabelar medivial numbers, too.</p>
    <p>i wouldn't mind to get suggestions for itallics, too, as they are afaik still not out yet.</p>
    <p>i would be really thankful for some suggestions.</p>
    <p>gerhard</p>
