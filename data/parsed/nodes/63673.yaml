      <p>Gerhard,<br>
      What does your client need:<br>
      A license to use Hypatia?<br>
      Or characters beyond what's included in Hypatia?</p>
      <p>If it's the first, we do expect to have Hypatia available for regular licensing soon. There's been a delay while finishing the Italics, but those are now done and the final layout feature work in going on.</p>
      <p>If it's the second, please explain in more detail. Hypatia has broader language coverage than most fonts, so I'm curious what else is needed.</p>
      <p>- thanks,<br>
        David L</p>
