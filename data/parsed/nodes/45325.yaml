      <p>I think the tail on the ’l’ looks quite forced. I would have brought the ’y’ in tighter to get around that. The sub looks a little light too.</p>
      <p>I can’t really make out the symbol in red.</p>
      <p>That said, it has a nice feel about it for an Italian restaurant.</p>
      <p>Ross</p>
