    html: |-
      <p>While UPM 1000 is typical for PostScript fonts, 2048 is typical for Truetype. If you are outputting to OpenType of either flavor, you can use 2000 if you wish or 2048 as well. There was a thread on this in the past with some posts by Adam Twardoch explaining it in great detail. Try a search on UPM and see if they turn up?<br>
      I have just had a problem with a font requiring higher resolution and bumped it up to 2000 with no problem so far. I hope to release the font soon so I will post any issues that I find in testing the higher UPM.</p>
      <p>ChrisL</p>
