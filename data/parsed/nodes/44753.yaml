    <p>My understanding is that most fonts have the design space (UPM) of 1000 units and I'm curious if anyone knows why this is the standard?</p>
    <p>The reason I ask is because I'm beginning to feel the limitations of that space when working with small scale details, most notably when creating complex angles, intersecting shapes and especially when working with circular shapes (at a small scale or while merging or deleting from).</p>
    <p>Often times the point(s) of intersection when merging shapes or deleting from them do not land on a perfect grid coordinate, thereby distorting the end shape that I've created however slightly.</p>
    <p>Does anyone have any thoughts or experience with this topic?</p>
    <p>Is there anyone that defaults to a (UPM) of 2000 because of this issue and to work in fine detail?</p>
    <p>It seems that a (UPM) of 2000 would be a more flexible space to work in, generally speaking.</p>
    <p>Any feedback is greatly appreciated.</p>
