    html: <p>Is the advantage of higher UPM fonts just getting more finite control over the beziers for type that needs to look “perfect” at huge sizes?</p>
    html_clean: <p>Is the advantage of higher UPM fonts just getting more finite control over the beziers for type that needs to look “perfect” at huge sizes?</p>
  - id: 275502
    user: 3135
    date: 2008-04-28T12:45:00
    date_raw: 28 Apr 2008 — 12:45pm
    votes: null
    html: |-
      <p>The advantage for larger UPM sizes is the control over curve and point placement as well as bezier handle placement. There is not a resolution change like you see with pixels. The grid made by the UPM controls where all points must fall so that any inbetween position is not possible. Most fonts won't need the difference but some can be helped--those which need more curve control.</p>
      <p>ChrisL</p>
