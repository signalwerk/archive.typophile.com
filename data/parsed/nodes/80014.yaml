    <p>Consider a scenario wherein a financial services business wants a postcard to send to their clients, their clients being other businesses and organizations in the financial and legal fields; the postcard announces their new level of certification which qualifies them for handling specialized financial services. As a marketing piece it should communicate an attitude of: "We aren't a big business, but we are absolutely professional, have decades of experience, and the service you'll get with us will be top quality, creative, and personal." </p>
    <p>Obviously there are many types one could employ here, but consider this one artificial constraint: it is to be either FF Scala Sans or Atlanta. One or the other. Without poisoning the well, I can say that I'm not so much seeking guidance — I already know what I think — as I am curious for anecdata of a consensus of expert opinion. So, if you had to choose between the two, which one would it be?</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/sample_01_4922.jpg"></div><p></p>
