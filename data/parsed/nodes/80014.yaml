      <p>I don't know. I felt that Scala Sans looked too much like other popular typefaces (Lucida, Stone) of the present day that people wouldn't notice it, whereas Atlanta would look more comfortable to the intended audience of people who are not typographic experts.</p>
      <p>What I'd expect bankers to use would be, say, Caslon, or Helvetica Extra Light (but <strong>not</strong> Futura) if the two faces shown were being considered. The shape of h, m, n, and q in Scala Sans looks uncomfortably unconventional.</p>
      <p>So, basically, the reason for my dissenting opinion is the fact that the question asked was, "which typeface is more suitable for this specific application", and not "which typeface has more typographical props".</p>
