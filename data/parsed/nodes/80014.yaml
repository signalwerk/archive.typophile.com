    <p>Obviously there are many types one could employ here, but consider this one artificial constraint: it is to be either FF Scala Sans or Atlanta. One or the other. Without poisoning the well, I can say that I'm not so much seeking guidance — I already know what I think — as I am curious for anecdata of a consensus of expert opinion. So, if you had to choose between the two, which one would it be?</p>
