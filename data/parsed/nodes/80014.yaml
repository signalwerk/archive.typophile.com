      <p>Who makes Atlanta? It looks to be just a knock-off of Avant Garde with a few minor changes.</p>
      <p>Anyway, aside from Atlanta looking really dated, I don’t think it looks all that professional. The upper and lowercase S in Avant Garde have always bugged me. They're so narrow that they look like a mistake. To me, those characters alone make the whole font look cheap.</p>
      <p>To me, Scala Sans looks much more professional, much more clean, and much more modern, without being trendy or gimmicky.</p>
      <p>I guess Atlanta/Avant Garde only implies "decades of experience" in that it might look like the postcard was designed decades ago, in the 1970s, when Avant Garde was first popular.</p>
