    <p>Unicode has allowed codes for each letter in a language though on the internet, fonts cannot be copied and pasted similar to content.  Thus I propose that you should implement or request others in your group to develop the FUNICODE (Font and Unicode) feature allowing copying and pasting of the exact fonts and not only content on the internet.  </p>
