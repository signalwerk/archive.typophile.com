    html: |-
      <p>This doesn't directly relate to the topic of this thread, but I happened to be searching for documents on Google Books, and ran across a copy of the New Testament translated into the Multani language.</p>
      <p>I had admired an image of that script when I saw it in a book on the history of written language, so I searched for further information.</p>
      <p>It turned out that the language, also called Saraiki, Derwal, or Wuch (the last being the name of the province where it was spoken; the first is the name usually used today) was written both with the script I had seen, the Lahnda script (the language was also, <em>incorrectly</em>, assigned to the "Southern Lahnda" language group) and with a variation of the Arabic script.</p>
      <p>Hindus used Lahnda, Muslims used the Arabic script. The area where Saraiki is spoken is mostly within Pakistan (part of it is in Afghanistan), and so when India was partitioned, the Hindu speakers of Multani or Saraiki fled to India, in which they are scattered. Many still speak the language, but little is published for them in their script any longer, as they also use the language of the surrounding communities to which they have moved.</p>
      <p>As a result, the Lahnda script has declined enough in importance that it is not yet among those encoded in Unicode.</p>
