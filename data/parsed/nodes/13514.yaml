    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/12270" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Typefaces</a>&nbsp;:&nbsp;Helvetica</strong></p>
    <p>Helvetica is a Grotesque sans serif face, also classified as Lineal under the <a href="/node/30089" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Vox-<span class="caps">AT</span>ypI Classification Of Type</a>. The strokes in Helvetica are monotone in weight and the overall forms of the typeface itself are based on <a href="/node/add/wiki?edit%5Btitle%5D=Akzidenz-Grotesk" title="Create node &quot;Akzidenz-Grotesk&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Akzidenz-Grotesk</a> from Berthold (around&nbsp;1898). </p>
    <p>In 1957, at the behest of the <a href="/node/add/wiki?edit%5Btitle%5D=Haas%20Typefoundry" title="Create node &quot;Haas Typefoundry&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Haas Typefoundry</a>’s <a href="/node/add/wiki?edit%5Btitle%5D=Eduard%20Hoffmann" title="Create node &quot;Eduard Hoffmann&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Eduard Hoffmann</a>, <a href="/node/13515" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Max Miedinger</a> designed a Grotesque sans serif face, distributed as <a href="/node/add/wiki?edit%5Btitle%5D=Neue%20Haas%20Grotesk" title="Create node &quot;Neue Haas Grotesk&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Neue Haas Grotesk</a>.</p>
    <p>In 1960, <a href="/node/13697" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Linotype</a> and <a href="/node/12158" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">D. Stempel <span class="caps">AG</span></a> in Frankfurt decided to take the face over and redrew it for the <a href="/node/12232" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Linotype Machine</a>. (51% of Haas was owned by Stempel, which itself was controlled by Linotype since 1941). Haas still produced type for hand composition and larger&nbsp;sizes. </p>
    <p>Stempel and Linotype were not fond of selling a typeface that was named after a “competing” company (Haas), so they wanted to rename it “Helvetia,” the latin name for <a href="/node/19747" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Switzerland</a>. <a href="http://www.jinnlife.com/buy-powerful-android-tablet/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Eduard Hoffmann</a> disliked the idea to name the typeface after a country and suggested “Helvetica”: latin for&nbsp;“swiss”. </p>
    <p>Throughout the 60s, 70s, and 80s, more weights were added to the ever-increasing family. In 1983, in an attempt to rein in the font’s expansion, an updated version of Helvetica was designed by Linotype called <a href="/node/15610" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Neue Helvetica</a> (New Helvetica) that included more weights and styles, and overall made the type family more consistant. 2004 saw the release of <a href="/node/15925" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Helvetica Linotype</a> (renamed <a href="/node/17046" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Helvetica World</a> in 2006), a family of four fonts, each of which has over 1,500 glyphs—representing Latin, Greek, Cyrillic, Hebrew, and Arabic. The Cyrillic, Greek, and Hebrew were drawn by <a href="/node/12151" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">John Hudson</a>.</p>
    <p>Similar to Helvetica is <a href="/node/add/wiki?edit%5Btitle%5D=Arial" title="Create node &quot;Arial&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Arial</a>*, originally created by Monotype for <span class="caps">IBM</span>. The TrueType version of Arial, installed by default on Mac and Windows based personal computers, is one of several fonts designed to be metrically compatible with Helvetica (ie. has the same character widths). Both Helvetica and Arial are widely specified on the web for screen&nbsp;use. </p>
    <p>Today Helvetica is still one of the most widley used typefaces of all time; although it is loved by many, it is hated by some. There is no shortage of commentary on the typeface, and there have even been two books published by <a href="http://www.lars-mueller-publishers.com">Lars Müller Publishers</a> entitled “Helvetica: Homage to a Typeface” and “Helvetica forever” dedicated to the famous type&nbsp;family.</p>
    <p>*For an article on how to differentiate between the two, read <a href="http://www.ms-studio.com/articlesarialsid.html"><em>How to Spot Arial</em></a> by <a href="/node/15527" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Mark Simonson</a>.</p>
    <p><a href="http://www.linotype.com">Linotype’s website</a> includes an overview of all of the <a href="http://www.linotype.com/526/helvetica-family.html">Helvetica font</a> weights, and all of the <a href="http://www.linotype.com/1266/neuehelvetica-family.html">Neue Helvetica font</a> weights as&nbsp;well.</p>
    <p>See also <a href="/node/add/wiki?edit%5Btitle%5D=Helvetica%20Film" title="Create node &quot;Helvetica Film&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Helvetica Film</a>.</p>
    <p><strong>Discussion:</strong><br><a href="http://typophile.com/node/27479">Helvetica: the film</a><br><a href="http://typophile.com/node/28845">Everything from the Wheel to the Bra Strap and Two Typefaces</a><br><a href="http://typophile.com/node/33301">Helvetica vs. Univers</a><br><a href="http://typophile.com/node/57065">Helvetica Impact</a><br><a href="http://typophile.com/node/80032">What is Helvetica Medium and where did it come&nbsp;from???</a></p>
