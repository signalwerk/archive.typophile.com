    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Typefaces" class="freelinking" rel="nofollow">Typefaces</a> : Helvetica</strong></p>
    <p><img src="http://upload.wikimedia.org/wikipedia/commons/2/28/HelveticaSpecimenCH.svg" img=""></p>
    <p>Helvetica is a Grotesque sans serif face, also classified as Lineal under the <a href="/wiki/Vox-ATypI%20Classification" class="freelinking" rel="nofollow">Vox-ATypI Classification Of Type</a>. The strokes in Helvetica are monotone in weight and the overall forms of the typeface itself are based on <a href="/wiki/Akzidenz-Grotesk" class="freelinking" rel="nofollow">Akzidenz-Grotesk</a> from Berthold (around 1898). </p>
    <p>In 1957, at the behest of the <a href="/wiki/Haas%20Typefoundry" class="freelinking" rel="nofollow">Haas Typefoundry</a>'s <a href="/wiki/Eduard%20Hoffmann" class="freelinking" rel="nofollow">Eduard Hoffmann</a>, <a href="/wiki/Max%20Miedinger" class="freelinking" rel="nofollow">Max Miedinger</a> designed a Grotesque sans serif face, distributed as <a href="/wiki/Neue%20Haas%20Grotesk" class="freelinking" rel="nofollow">Neue Haas Grotesk</a>.</p>
    <p>In 1960, <a href="/wiki/Linotype" class="freelinking" rel="nofollow">Linotype</a> and <a href="/wiki/D.%20Stempel%20AG" class="freelinking" rel="nofollow">D. Stempel AG</a> in Frankfurt decided to take the face over and redrew it for the <a href="/wiki/Linotype%20machine" class="freelinking" rel="nofollow">Linotype machine</a>. (51% of Haas was owned by Stempel, which itself was controlled by Linotype since 1941). Haas still produced type for hand composition and larger sizes. </p>
    <p>Stempel and Linotype were not fond of selling a typeface that was named after a "competing" company (Haas), so they wanted to rename it "Helvetia," the latin name for <a href="/wiki/Switzerland" class="freelinking" rel="nofollow">Switzerland</a>. <a class="freelinking external" href="http://www.jinnlife.com/buy-powerful-android-tablet/" rel="nofollow">Eduard Hoffmann</a> disliked the idea to name the typeface after a country and suggested "Helvetica": latin for "swiss". </p>
    <p>Throughout the 60s, 70s, and 80s, more weights were added to the ever-increasing family. In 1983, in an attempt to rein in the font's expansion, an updated version of Helvetica was designed by Linotype called <a href="/wiki/Neue%20Helvetica" class="freelinking" rel="nofollow">Neue Helvetica</a> (New Helvetica) that included more weights and styles, and overall made the type family more consistant. 2004 saw the release of <a href="/wiki/Helvetica%20Linotype" class="freelinking" rel="nofollow">Helvetica Linotype</a> (renamed <a href="/wiki/Helvetica%20World" class="freelinking" rel="nofollow">Helvetica World</a> in 2006), a family of four fonts, each of which has over 1,500 glyphs—representing Latin, Greek, Cyrillic, Hebrew, and Arabic. The Cyrillic, Greek, and Hebrew were drawn by <a href="/wiki/John%20Hudson" class="freelinking" rel="nofollow">John Hudson</a>.</p>
    <p>Similar to Helvetica is <a href="/wiki/Arial" class="freelinking" rel="nofollow">Arial</a>*, originally created by Monotype for IBM. The TrueType version of Arial, installed by default on Mac and Windows based personal computers, is one of several fonts designed to be metrically compatible with Helvetica (ie. has the same character widths). Both Helvetica and Arial are widely specified on the web for screen use. </p>
    <p>Today Helvetica is still one of the most widley used typefaces of all time; although it is loved by many, it is hated by some. There is no shortage of commentary on the typeface, and there have even been two books published by <a href="http://www.lars-mueller-publishers.com" rel="nofollow">Lars Müller Publishers</a> entitled "Helvetica: Homage to a Typeface" and "Helvetica forever" dedicated to the famous type family.</p>
    <p>*For an article on how to differentiate between the two, read <a href="http://www.ms-studio.com/articlesarialsid.html" rel="nofollow"><em>How to Spot Arial</em></a> by <a href="/wiki/Mark%20Simonson" class="freelinking" rel="nofollow">Mark Simonson</a>.</p>
    <p><a href="http://www.linotype.com" rel="nofollow">Linotype's website</a> includes an overview of all of the <a href="http://www.linotype.com/526/helvetica-family.html" rel="nofollow">Helvetica font</a> weights, and all of the <a href="http://www.linotype.com/1266/neuehelvetica-family.html" rel="nofollow">Neue Helvetica font</a> weights as well.</p>
    <p>See also <a href="/wiki/Helvetica%20Film" class="freelinking" rel="nofollow">Helvetica Film</a>.</p>
