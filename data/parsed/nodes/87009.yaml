    <p>Does anybody know how to contact Simon Garfield?</p>
    <p>I was reading this article<br>
    <a href="http://www.fastcodesign.com/1665318/the-8-worst-fonts-in-the-world" title="http://www.fastcodesign.com/1665318/the-8-worst-fonts-in-the-world">http://www.fastcodesign.com/1665318/the-8-worst-fonts-in-the-world</a><br>
    and was upset that he can't see the great merits of the<br>
    2012 Olympics font (I do NOT mean the logo) but he<br>
    has added insult to injury by using an extremely poor<br>
    and inaccurate rendering of the font for the sample.<br>
    I have a PDF of the font I could provide him with,<br>
    although that certainly wouldn't help his case...</p>
    <p>BTW Garfield's email in his bio there is shown as<br>
    <a href="mailto:dummy@email.com">dummy@email.com</a>... I didn't bother trying that.</p>
    <p>hhp</p>
