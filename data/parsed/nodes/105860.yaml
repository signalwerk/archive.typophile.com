  html: |-
    <p>Hi typophiles,</p>
    <p>I am re-designing an old font of mine. And I need your help at this point!<br>
    Indeed, I've been re-thinking the letterspacings and all seems to me in a mess now…!<br>
    The typeface is a display one, only for fun : mixing pixel 80's-style and Textura Blackletter, a weird thing! :)<br>
    In the first version of the letterspacings, I made it to be legible but now, I find it interesting to use it more in a tight letterspacing, in a way to be more alike with a revival of the historic calligraphic form. But of course, it is less legible, if it's not to say almost "not-legible", like the old Bibles though…<br>
    Want do you think of it? Do you have any advice?<br>
    Thank you in advance for your return!</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Test_4020.jpg"></div><p></p>
    <p>Exemple of the historic design:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/mainz_187_detail_sm_6358.jpg"></div><p></p>
