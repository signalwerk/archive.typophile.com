    <p>I have a case of 72 pt lead display gothic type and a blank wall in my house, so I tought of printing the beginning of El Quijote in Spanglish over a big sheet of paper. I think it will be somehow humorous and appropriate to print this text in a gothic face.</p>
    <p><img src="/sites/default/files/old-images/4490593762_329db19d49_z_5969.jpg"></p>
    <p>Here´s the text: "In un placete de La Mancha of which nombre no quiero remembrearme, vivía, not so long ago, uno de esos gentlemen who always tienen una lanza in the rack, una buckler antigua, a skinny caballo y un grayhound para el chase."</p>
    <p>Has anyone done something similar before? How? Which ink? Which paper? What about Fabriano?</p>
    <p>Thanks in advance.</p>
