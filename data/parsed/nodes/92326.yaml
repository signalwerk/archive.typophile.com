    html: |-
      <p>Don’t substitute oil paint. If you don’t want to (or can’t) get the quantity of letterpress ink, then you could use oil-based blockprinting ink instead. You should be able to find it in any reasonably well-stocked art supply store.</p>
      <p>For paper, consider Rives BFK or Rives Lightweight. </p>
      <p>You might consider dampening the paper slightly first. If you’re not familiar with the technique, search for general instructions for wood block or relief printing.</p>
