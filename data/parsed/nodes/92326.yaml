    html: |-
      <p>I'd suggest setting the type on a flat surface, clamp or wedge is in place, ink it... (and this is actually very clever :o) . I did it with lino cuts once upon a time using the ink from some ball point-pen refills. It looks like the surface area you're covering will render that option impractical, but oil paint would probably work as well (or, what the heck, get your self some printing ink from an art supply store) . Spread<br>
      it on a piece of glass and use it to ink the type with a hard rubber roller. </p>
      <p>Then, lay the paper onto the type - keep it from moving and firmly press the paper onto the type with a clean rubber roller.</p>
