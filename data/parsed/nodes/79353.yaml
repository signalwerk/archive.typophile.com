      <p><em>Is this possible for a designer to do on their own?</em></p>
      <p>It is, but if you're not familiar with the process, it may be more hassle than it's worth*. I think the most painless way is to have the foundry modify the fonts for your. And besides, I'm pretty sure the H&amp;FJ licence doesn't allow it to do it on your own.</p>
      <p>* switching the outlines of the R around isn't the only thing you'd have to do. The horizontal metrics of the glyph must be adjusted too, then kerning, hinting, then the OpenType feature code, which can't just be read from the font, modified and written back 1:1, then there are more variants of the R like accented variants and small caps, which all should get the same treatment ...</p>
