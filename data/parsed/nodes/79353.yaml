  html: |-
    <p>I have been corresponding with Hoefler Frere about customizing the standard character set for Whitney. Whitney has a default character set and an alternate set. We want to have some of the alternate characters to replace their default characters in the main set, and are told that choosing an alternate character can only be done manually, one at a time, through the glyphs palatte in InDesign/Illustrator. </p>
    <p>We are buying Whitney for use in a very large organization after months of study as to the right typeface for the job, and have found Whitney has just the right characteristics, so long as the alternate 'R' is used in place of the standard 'R', and the alternate 'K' is used in place of the standard 'K', as well as a few other replacements. We want some of the alternate characters to be used entirely in place of the default characters at all times. In other words, we want this font to be carefully controlled without the option of somebody choosing, for example, which 'R' they want to use.. a situation where people are going into glyph sets to choose an R here, an A there would be far too labourious and confusing; we want them to have only one option.  We simply want to have a few of the characters switched around from the alternate to the default character set, so we can deliver the various copies we buy to our designers in that uneditable configuration.</p>
    <p>Is this possible for a designer to do on their own? Must I use Fontographer?</p>
    <p>Neal</p>
