      <p>Aside from legalities (which it seems don’t hold water with some quarters), if this is for “very large organization after months of study as to the right typeface for the job,” then there are practical benefits to having the foundry do it, despite any customization fee.</p>
      <p>For one thing, they can work directly from original sources, which will avoid some of the potential problems that Jens alludes to. If you’re talking about the entire Whitney family, then this potential is compounded. If the foundry does the work, you will be assured of commercial-quality robustness and consistency. </p>
      <p>And you will also remain entitled to customer/technical support for the modified fonts. Which, for a large a widespread organization, is no small matter.</p>
      <p>Your requests and your rationale are both quite reasonable. Hopefully someone from H&amp;FJ can respond to you in a timely fashion with a practical solution.</p>
