      <p>OK,</p>
      <p>The swap is complete. I don't see products at MyFonts yet, but other outlets have the whole schmeer. Linotype has a special freebie if you sign up for their newsletter. </p>
      <p>I also discovered that you can try out a few of the styles in the Fonts.com Web Fonts preview tool. Try it on a site that is normally very staid, or one that is normally decorative and frilly. This tool is fun and helpful at the same time. </p>
      <p>Hrant, your idea of pillows is excellent and perfect! I wish that ovoid shape were something easily sourced. I like the idea of a series of colorful blob letters as pillows on a sofa.</p>
