    <p>Typophiliacs,</p>
    <p>The Biome superfamily has grown. I've managed to finish all the work on the full, originally-planned suite:  Biome Narrow, Normal and Wide will be re-released in all 42 styles (7 weights plus italics, in all 3 widths) in early June. </p>
    <p>Caveat: This release will see Biome taken under the wing of the Monotype/ITC label, so will become a product they handle. I've chosen to simplify things by taking the original Wide fonts off the market. The new ones are slightly improved, but there is a big difference:</p>
    <p>The new fonts have a more conventional character set, and DO NOT include all the wacky alternate forms. It would have been more overwhelming than it already was, to consider including all those options and building out OT features for all 42 styles. The more conventional set was chosen as defaults, because it seems the range of possible uses grows even larger with this modification. </p>
    <p>Meanwhile, for a few more weeks, the original Wides are still available. If those display alternates seem valuable, grab them now, before they go away. Maybe someday, if Biome is successful, I can consider producing all those alternates.</p>
    <p>The new Wides won't have the alternates, but all the upcoming styles are fully-featured pro fonts, with small caps, various figure styles and ligatures. </p>
    <p>Everything will be available on Monotype's many, many outlets! ;)   For the first time since Makambo days, my work will be available on MyFonts.... </p>
    <p>I'm so relieved this project is nearly complete! Now to see about a nifty Biome gift item to celebrate.... Ideas? </p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/biomesplash03_5540.gif"></div><p></p>
