      <p>adam, last night i was testing this hypothesis just a bit with a font that had an ll ligature. i named the glyph l_l, generated a PST1 font (for Windows), installed the font, opened InDesign, selected preset text, selected the font i had just installed, and presto! the l_l ligatures were inserted without any OpenType programming. The ligatures persited even when i unchecked the ligatures option.<br>
      I believe this is the source of the problem with some postscript fonts automatically substituting discretionary ligatures when they are not wanted (as has been documented elsewhere on these forums): they just exist in the font and InDesign calls them when they are named c_t &amp; s_t.</p>
