    html: |-
      <p>BTW, this is the reason why FontLab Studio 5's STANDARD.NAM file has the old-style names "fi" and "fl" for exactly those two ligatures. Names for all other ligatures should be formed using the underscore convention ("f_f", "f_f_i" etc.) but for these two, the "fi" and "fl" names without the underscore are probably better if you generate your fonts as both OpenType and Type 1. </p>
      <p>As usual, I simply recommend following the FontLab Studio 5 STANDARD.NAM practices of glyph naming and encoding unless there is really a good reason not to. Note that in FontLab Studio 5.0.2, the naming was updated (see <a href="http://fontlab.com/The-News/Announcements/FontLab-Studio-5.0.2/" title="http://fontlab.com/The-News/Announcements/FontLab-Studio-5.0.2/">http://fontlab.com/The-News/Announcements/FontLab-Studio-5.0.2/</a> for details) and I recommend all FontLab Studio 5 users to get the update. </p>
      <p>A.</p>
