      <p>Paul, </p>
      <p>I'm not quite sure what you mean. I've never heard that arbitrary ligatures would work in Type 1 fonts. </p>
      <p>For Type 1 fonts with Adobe Standard Encoding, the two standard ligatures "fi" and "fl" will work as ligatures if they are named with the names used by the Adobe Standard Encoding itself (i.e. "fi" and "fl" rather than "f_i" and "f_l"), simply because they always have been part of the Adobe Standard Encoding. </p>
      <p>A.</p>
