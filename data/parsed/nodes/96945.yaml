    html: "<p>I have used Whitney as a display face with Garamond Premier Pro as a text face, but this doesn't sound like quite what you're after. Both Whitney and Verdigris are favorite typefaces of mine, though I don't think I've ever used the two together. Might work nicely, though. However, if you're looking for contrast, you ought to have at least two kinds of contrast: not just structure (sans/serif) but also size, or weight, or position on the page, or some other extra way of distinguishing them.</p>"
