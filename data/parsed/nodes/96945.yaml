    html: <p>I would say, if you want a serif, almost all humanist / old styles work, also some Scotches maybe or more contemporary designs. Depends a little if you want to emphasize the friendliness or counteract it. I like Proforma, Parabel, Tibere, Harriet, Whitman, Page Serif, Really, Elmhurst, Atma, Miller …</p>
