      <p>I would match Whitney through historical allusion, with another face in the style of the era which it references.</p>
      <p>Or through harmonious formal characteristics.<br>
      The principal here is: very close or very far apart, but not “sort of” (a little bit similar).</p>
      <p>Verdigris is a sturdy face, and, like all single-master serifed faces, the size at which it is reproduced has a huge bearing on how well it works in a layout, or with another typeface. </p>
      <p>With printed color, it’s always best to look a sample appearing in the medium intended.<br>
      Pantone produces printed specimen swatches that are helpful.</p>
