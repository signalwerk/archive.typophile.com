    <p>Hi everyone, i'm new here, i'm a second year student graphic design in Brussels Belgium and of course a passion for type (not a type designer just a user :-p)  and been reading the forums for quite some time and it helped me out allot in my first year at the academy of art.</p>
    <p>I kind of had a question and hope that someone could help me out a bit. I'm looking for a nice "serif" font to accompany H&amp;FJ's Whitney Book (Sans Serif) The purpose is to use it in some poetry text.</p>
    <p>I was looking at Verdigris from MVB but don't know if that would be a good choice?...I know the H&amp;FJ site recommends using a serif of their own but i'm looking for some more suggestions...</p>
    <p>Also maybe another question, is it okay to use a Pantone color when its getting digitally printed...i printed out (at the print shop) some pages that have a blue background but i can't help but notice that it has this really soft subtle  red/pink tint to it...whats the best way to use color in a document for print (digitally)</p>
    <p>Thanks everyone for helping</p>
