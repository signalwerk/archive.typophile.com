  - id: 510937
    user: 1250
    date: 2012-05-24T21:06:00
    date_raw: 24 May 2012 — 9:06pm
    votes: null
    html: |-
      <blockquote><p>slightly longer ascenders would easily be accommodated</p></blockquote>
      <p>I believe it's not really about "accommodating" (i.e. descenders of one line not touching the ascenders of the next line) it's about efficient use of space, especially in terms of maximizing apparent leading (hence the ability to lengthen lines without impeding reading). The space wasted by overly long descenders can be used to make the x-height and/or ascenders more visible. It's basically wasted functional potential, with very little practical aesthetic gain.</p>
      <p>You don't know how your font is going to be used. Sometimes it won't matter, but if a user pushes the vertical-space limits the font will not deliver what it could have if the descenders weren't so long.</p>
      <p>And why do the lion's share of text fonts have ascenders longer than descenders, even though: making them equal is the most intuitive thing to do; or making the descenders longer allows them to elaborate their more complex structures better?</p>
      <blockquote><p>skipping small caps</p></blockquote>
      <p>Reducing the need for, sure; skipping entirely, no. Long acronyms are not uncommon these days, and fullcaps that are small enough to make those acceptable would be too small to function well in capitalization.</p>
      <p>hhp</p>
