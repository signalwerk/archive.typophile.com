    html: |-
      <blockquote><p>they shouldn't be the same length</p></blockquote>
      <p>That's pretty much what I meant ("compared to the ascenders"). But although the fitting is too tight for a news face (not the same as a magazine face) the color -which is much harder to adjust- fits that usage, and that's why I gravitated to seeing this as a news face... which means the descenders are too long. If Fernando does lengthen the ascenders instead, he can keep the tightness, but then the color will be too dark (barring peculiar taste).</p>
      <p>It might be nice to gawk at pretty descenders, but immersive reading is quite removed from such deliberative enjoyment. Especially in a news face linespacing plays a huge role in optimal vertical proportions, necessarily at the expense of letterwise beauty. Or: it's beauty on another level.</p>
      <blockquote><p>the ascenders can be taller than the cap height</p></blockquote>
      <p>Which they currently are. But if the descenders are made longer the caps will probably need to go up too...</p>
      <p>Ergo: the shortest route to making this more usable is shortening the descenders, and shooting for small size setting.</p>
      <p>hhp</p>
