    votes: null
    html: |-
      <p>Hrant,</p>
      <p>You can't really judge a typeface outside it's use; either pixels on a screen or ink on paper. I have no expertise with pixels on a screen, but (sadly) over 30 years with ink on paper, spanning several printing technologies, and many  kinds of paper.</p>
      <p>Cutting to the chase, for printing on a coated sheet as with an art book, I think the font will have about the right weight. I'm reminded of Merlo, too heavy for an uncoated sheet, but  attractive on coated stock. The font has enough understated elegance to work for illustrated books, too. Not all of them of course, but that's the argument for having more than just a few fonts.</p>
      <p>With the leading typically used today, slightly longer ascenders would easily be accommodated. Were it my font design, I'd play with just slightly lengthening the ascenders first, and leaving the caps alone.  This would allow for skipping small caps -- a heresy for those who only read rules and can't use their eyes, I know. But it might work with this font.</p>
      <p>Still, the lack of an italic makes it all moot for me.</p>
