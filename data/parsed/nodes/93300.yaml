    <p><strong>Hello Typophiles!</strong><br>
    --------------------------------------------------<br>
    We are proud to announce our new release!<br>
    --------------------------------------------------</p>
    <p><a href="http://www.myfonts.com/fonts/tipotype/fenix/" rel="nofollow"><strong>"FENIX"</strong> by Fernando Díaz:</a> a FREE typeface specially designed for display and long texts, it has it’s fundations based in calligraphy, with strong serifs, and rough strokes. Its proportions have an objective to gain space in height and width. Itís elegant at large sizes and legible at the same time, with a lot of rhythm in small sizes.</p>
    <p><a href="http://www.myfonts.com/fonts/tipotype/fenix/" rel="nofollow"><br>
    <img src="http://cdn.myfonts.net/s/aw/720x360/155/0/79844.jpg"></a></p>
    <p>Available for FREE in <strong>MyFonts</strong> on TipoType, and a lot of typefaces to come this year... Hope you like!</p>
    <p>----------------------<br>
    Best Regards<br>
    <a href="http://www.tipotype.com" rel="nofollow"><strong>TipoType.com</strong></a></p>
