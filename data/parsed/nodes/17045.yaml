      <p>Thanks, </p>
      <p>I’ve designed a book within a book, which is to say that I have a larger book that surrounds a smaller book. I’ve been making a puzzle book using  words that end with another word so for example ’Smoking’ or ’carriage’.</p>
      <p>The second part of the word is set in the inner book with the outer book representing the first part of the word. I’ve printed the words onto various types of paper to work with layering and seeing other words appear through layers of tracing paper and accetate, thicker card and paper with texture, each paper or print being relevant to the word and it’s meaning. It’s been a nightmare pagenating (sp?) it all and then I realised I’d forgotten the prelims and so now I’m putting them in. </p>
      <p>I only knew the half title page as a bastard title page as that is what I’ve been taught, half title is much more polite I agree :)</p>
