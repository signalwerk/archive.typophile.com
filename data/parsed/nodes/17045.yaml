      <p>“Front Matter” in Chapter 1 of the Chicago Manual of Style?</p>
      <p>Marjorie Skillin’s <em>Words into Type</em> has the following list for front matter (somewhat abbreviated).</p>
      <p>i Bastard title<br>
      ii Card page (books by same author), imprimatur, series title, or blank<br>
      - Frontispiece (usually unnumbered)<br>
      iii Title page<br>
      iv Copyright page<br>
      v Dedication<br>
      vi Blank<br>
      vii TOC<br>
      viii TOC (continued) or List of illustrations<br>
      ix List of illustrations or Acknowledgements<br>
      x continued, or blank<br>
      xi Editor’s preface<br>
      xii continued, or blank<br>
      xiii Author’s preface<br>
      xiv continued, or blank<br>
      xv Foreword or Introduction<br>
      xvi continued, or blank</p>
      <p>The card page, frontispiece, and copyright page are always on left-handed pages. Other sections appear, or at least begin, on right-handed pages.</p>
