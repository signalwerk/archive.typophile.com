    <p>I’ve been searching the web to find the traditional page order that books used to follow, like having a bastard title page, pre lims etc... but for the life of me I can’t find the order. Does anyone know the order of traditional book design or could you please point me in the right direction? </p>
    <p>Any help is greatly appreciated.</p>
    <p>Bec</p>
