      <p>We like to call the “bastard title” the half-title. It’s more polite.</p>
      <p>The copyright traditionally is supposed to go on the back side of the title page (that is, page iv) but it can also be the very last page of the book. It can’t go anywhere else as far as I know.</p>
      <p>The rules about contents pages and openers always beginning on the recto (right hand page) are pretty loose these days, especially in illustrated book publishing. You can certainly design the table of contents to run across a spread.</p>
