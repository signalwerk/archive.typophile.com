    <p>Hello people:) I have started my typography life since this summer and I have published couple of fonts already, but I realized that I never got critiques from people which is really important in order to make my font as perfect as possible:)<br>
    Anyway, I have offer to Design, Futura looking font by a design company , so I added my taste to create a new type.<br>
    I'd like to hear any comments from all of you, Thank You.<br>
    Khaito Gengo </p><div class="imageWrap"><img src="http://typophile.com/files/AF_Critiques_4370.png"></div><p></p>
