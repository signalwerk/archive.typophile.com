    html: <p>Dav(id) is just out of control these last couple of weeks. He simply can't be caught!  <br> <br>Maybe he won't reveal his type tricks, but there's one thing I've always wondered about ... why the (id) as separate from the Dav? Is this just something I'm not clued into? If I type David will it offend? And while we're here, why is Stephen Coles sometimes referred to as Stewf and do only personal friends call him that? What is preferred here? <br> <br>My hope is not to offend anyone by using the incorrect use of their name or irritate them by using a personal nickname when a formal one is preferred. <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"></p>
