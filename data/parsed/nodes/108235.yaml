    <p>Hi all</p>
    <p>I'm designing a biannual publication for a large conglomerate client. Their corporate ID uses Myriad and Clarendon - neither of which I have issue with, but for a magazine format which is about 'demonstrating what they're about' rather than 'selling what they're about'. I want something that hints at their corporate ID but is a bit more lifestyle and characterful.</p>
    <p>Any suggestions?</p>
    <p>Thanks, as always.</p>
