      <p>Hi sorry for the late reply. I've re-posted but in case here is what I'm doing:</p>
      <p>I'm designing a print publication for a large Indian conglomerate which is involved in heavy manufacturing, service industries and FMCG's. The title is to introduce their brand(s) to the European market, and will be akin to Monocle in it's ideology and breadth.</p>
      <p>I had in mind a font superfamily to bring harmony to the various strands of content and wanted something classic but fresh and contemporary and also future-proof.</p>
      <p>I have been looking at Freight, but the cost is prohibitive especially as I can't test the font in the design and present to the client.</p>
      <p>Can anyone suggest a similar hard-working family or any other thoughts/recommendations?</p>
