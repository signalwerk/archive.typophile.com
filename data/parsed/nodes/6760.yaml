    html: <p>Renato Here again(Tiffany's Brother) - John B. - excellent idea....I have actually come to a similar conclusion myself...so it's off to a tacky stamp store..... <br> <br>Also,,,,,Geraint you have a good point. as far as big band music goes...I have written many big band scores....and arranged many works by the so-called "core" of famous jazz composers....Ellington, Mingus, Monk, Coltrane, Evans, Strayhorn, and list could go on forever....but I also write alot of species counterpoint as a perpetual student of the perfection of Bach. However - the main reason for this idea is more of a compositional process that Robert Craft's book inspired when he went on to describe the methods Stravinsky had come to employ in the later serial phase of his life(serial meaning he had left his neo-classical period and embraced(albeit in his own inimitable way)the philosophy of the second viennese school(namely Schoenberg and his 2 disciples Alban Berg and my favourite - Anton von Webern)....at this point in time Stravinsky began to employ a method of composition involving blank paper that he could write ideas on and merely put staves whereever he neede to accompany ideas....a rather organic process...which appeals to me.....Chris....yeah i have loads of staff paper...i have even created several documents of custom staff paper in illy.....however it is more a question of trying to create a more organic process...plus lots of staff paper is printed on low quality paper that evaporates under the eraser of my obssesive/compulsive editing.....thanks for the ideas and tips....</p>
