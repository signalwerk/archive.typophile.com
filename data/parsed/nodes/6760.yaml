    html: "<p>Take the innards out of 6 cheap ballpoint pens. Sand the edges of the tips for closer spacing on your lines. Tape them in a row with a splint if need be. Draw to your hearts content. This was the method pioneered by <a href=\"http://www.humorlinks.com/python/sketches/TheBookshopSketch.htm\" target=\"_blank\">Charles Dikkens</a>, the well know dutch composer. <br>Time Estimate: 5 minutes <br>Cost Estimate: 50 cents <br> <br>One issue for your pizza cutter is getting good ink coverage. <br> <br>It would be much simpler to cut your own punch, or if you're interested in an argument use a Benton Pantograph, make a matrix, cast some lead staves, set in a comp stick to the right length, fire it up and letterpress that badboy... use vegetable based inks. They're more organic... <br>Time Estimate: 5 months <br>Cost Estimate: Plenty <br> <br>Come to a bunch typophiles, what do you expect :-) <br>Good luck.</p>"
    html_clean: "<p>Take the innards out of 6 cheap ballpoint pens. Sand the edges of the tips for closer spacing on your lines. Tape them in a row with a splint if need be. Draw to your hearts content. This was the method pioneered by <a href=\"http://www.humorlinks.com/python/sketches/TheBookshopSketch.htm\" target=\"_blank\" class=\"link-external\">Charles Dikkens</a>, the well know dutch composer. <br>Time Estimate: 5 minutes <br>Cost Estimate: 50 cents <br> <br>One issue for your pizza cutter is getting good ink coverage. <br> <br>It would be much simpler to cut your own punch, or if you're interested in an argument use a Benton Pantograph, make a matrix, cast some lead staves, set in a comp stick to the right length, fire it up and letterpress that badboy... use vegetable based inks. They're more organic... <br>Time Estimate: 5 months <br>Cost Estimate: Plenty <br> <br>Come to a bunch typophiles, what do you expect :-) <br>Good luck.</p>"
