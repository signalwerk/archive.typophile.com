    html: <p>I once carried the music staff to a free-ish form. A few years ago I was asked to design a CD cover and some promotional material for a jazz musician.  The name of the album was "Uncertain Times."  I developed a logo-like image using a staff drawn in a circle to resemble a stop watch with no hands and key signatures instead of the usual numbers for hours. Attached is the logo and a picture of the disk itself. <br> <br>ChrisL <br><img src="http://www.typophile.com/forums/messages/30/49460.gif" alt="uncertain times logo"> <br><img src="http://www.typophile.com/forums/messages/30/49461.jpg" alt="CD disk printing"></p>
