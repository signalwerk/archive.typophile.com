    <p>There is someone looking for a tool, similar to a pizza cutter mixed with a stamp, that Stravinsky apparently developed when he wanted to print (stamp) his own paper for music composition.  <br> <br>A) Does anyone know of this device? <br>B) Does anyone know of where to find more information?</p>
