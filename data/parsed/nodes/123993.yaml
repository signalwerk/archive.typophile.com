      <p>There are a couple of oddities in Cambria Math, but it indeed has the largest set of math symbols I know. I use it paired with Minion, but only for those symbols.</p>
      <p>Yan, Cambria Math's OpenType math extensions only work inside Microsoft Word. Are there appropriate LaTeX bindings for it as well, or do you have to use it as any 'regular' font (albeit with an extensive character set)?</p>
