      <p>John,</p>
      <p>LuaTeX and XeTeX have had OpenType math support for a long time. Check out <a href="http://ctan.org/pkg/unicode-math">http://ctan.org/pkg/unicode-math</a>, by the same author of fontspec.</p>
      <p>I mainly use LuaTeX. At the moment there's some small spacing issues with LuaTeX with some OpenType math fonts, but fixed in 1.0 release, which will be included in TeXLive 2017 later this year.</p>
