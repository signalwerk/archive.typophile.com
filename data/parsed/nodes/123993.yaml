  html: |-
    <p>Greeting font anthusiasts,</p>
    <p>I have recently finished typing up my Ph.D. thesis in math and I am looking to improve its overall appearance. Let me say right off the bat that the standard font that tex uses, i.e. Knuth's computer modern, is not bad; I'd simply like to explore some further options. I am using the KOMA script latex package which sets chapter and section headings in sans of whatever font family is used for the main text. While this can be changed, i.e. need not be sans of anything, I think I'd like to keep this feature and thus use a serif typeface for the main body and a sans typeface for section and chapter headings.</p>
    <p>I have been perusing typography books to get an idea of the field and I have to say that I am hooked and will probably keep on reading about typography after I am done with the final submission of my thesis. For now, however, I would appreciate your suggestions for nice serif-sans combos. The word "nice" is in the eye of the beholder of course, so what I am really asking is for your favourite or list of favourites combos. The main issue is the serif font that I will be using for the main body, so feel free to suggest only serif fonts that you like. </p>
    <p>I understand that good typography is purpose-driven, that is, choices of typefaces should further the goal of the text and a math thesis (well, any thesis) should be about the content itself, hence the text should read effortlessly. That doesn't mean it should be set in CM though, right? It does mean, however, that I probably shouldn't set it in Adobe Jenson, even though I like it very much. Minion (combined with Myriad) looks nice, but in the words of Coles, Minion is "too vanilla". Garamond Premier looks really really nice and so does MVB Verdigris.</p>
    <p>Your suggestions for either a combo serif+sans or simply a "humanist serif" would be much appreciated!</p>
