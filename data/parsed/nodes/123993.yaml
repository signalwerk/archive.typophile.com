    html: <p>Common font choices for (La)TeX documents w/ math see e.g. <a href="http://www.tug.org/mactex/fonts/LaTeX_Preamble-Font_Choices.html">http://www.tug.org/mactex/fonts/LaTeX_Preamble-Font_Choices.html</a>. If you don't want to go through the process of preparing fonts for use with (La)TeX yourself (or perhaps having to change your workflow to some newer TeX derivate that accepts system fonts), see <a href="http://www.tug.dk/FontCatalogue/">http://www.tug.dk/FontCatalogue/</a> for a quite a few examples. For my PhD thesis (not in math, but anyway) I used a combination of Gill Sans and MT Joanna, using fontinst and a few other things to prepare the fonts for pdfLaTeX, but this was a conscious choice related to the subject - although noone got the joke in the end…</p>
