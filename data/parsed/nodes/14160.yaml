      <p>I am surprised Chris' original post didn't stir more discussion. Thanks for reviving the topic, Terry. </p>
      <p>Chris asks a lot of questions, inadvertently revealing the state of legibility 'science' in the process. We really don't have any definitive answers to most of those questions yet. </p>
      <p>I maintain that any serious inquiry will require a long gestation period, sufficient funding, and input from a variety of experts, most crucially typographers. It might help to narrow the question down a lot. This is presumably what would be done in lab testing. Suppose we say we are discussing text typefaces designed for immersive reading, as in books? That helps us avoid distractions about display type, signs, glare, children, etc. and lets us focus on immersive reading issues like comfort, speed, etc. But Terry's project pertains to signage. So maybe we should narrow it down to wayfinding typefaces for particular environments, i.e. large metropolitan transit systems. That would take us someplace very different from the discussion/study of ideal book faces. </p>
      <p>Terry, how would you like to frame the discussion? It's clear that these areas overlap, but you may get farther if the topic is more specific. I'm all for starting 2 threads: 'Optimal Signage Legibility Fonts' and 'Optimal Book Legibility Faces', if not more.</p>
