      <p>Research has been done on both country of origin and age.  My poor memory doesn't have the details (perhaps it was the Royal College?).  From what I remember of the conclusions it seems countries like England and the U.S. were more prone to read serif; countries like Germany and Switzerland were more prone to read sans better. This fits Nick's "what they grew up reading" theory as well.<br>
      I have not seen a book that compares a large crossection of legibility literature since Rolf Rehe's 1972 book "Typography How to Make it Most Legible".  This book still did not satisfy my curiosity then and very much has happened since. The "Typo" readability issue <a href="http://www.magtypo.cz/english.html" title="http://www.magtypo.cz/english.html">http://www.magtypo.cz/english.html</a> was a good beginning but I still have not seen work that gets at the whole problem enough to be practical.  There has been far more research done in signage mostly by engineers.</p>
      <p>ChrisL</p>
