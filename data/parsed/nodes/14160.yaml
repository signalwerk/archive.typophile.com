      <p>I remember reading a study several years back that suggested that the comparative legibility of serif vs. sans serif type was based more on the age of the reader than on his or her country of origin. The study concluded that older readers found serif type more legible because that's what they grew up reading; younger readers found sans serifs more legible.</p>
      <p>As best I can recall, the study is now more than thirty years old. I am fairly confident that the conclusions are still reasonably valid, but with a twist. The range of typefaces available now has expanded public awareness of the tremendous range of possibilities for expressing individual letterforms, so what is legible to the younger reader of today might well seem like hieroglyphics to his or her grandparents.</p>
      <p>But we're talking about signage here, and good signs aren't intended to be works of art, but rather useful tools, and really shouldn't require decipherment. Probably the best test of the utility of a typeface used for signage is that individual letterforms be <strong>unambiguous</strong>. If they pass that test, all other design considerations are superfluous.</p>
