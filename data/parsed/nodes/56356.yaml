      <p>Florian,</p>
      <p>Images and files may appear missing because the site is still caching. This could take up to a full day or more.</p>
      <p>This maintenance was not for fixing bugs or addressing feature issues - and yes we are aware of the problems you listed above and are working towards solutions. We were simply upgrading to a faster server - which was supposed to take 30 minutes but our lovely friends at MediaTemple decided it should take much, much longer.</p>
      <p>Thanks</p>
