    <p>New things I have noticed:</p>
    <ul>
    <li>an additional ‘cms’ in the URL (old URLs still work) – why?</li>
    <li>most of the embedded and attached files (images, PDFs) within threads are missing – a temporary issue?</li>
    </ul>
    <p>Known issues that haven’t changed:</p>
    <ul>
    <li>Search still unusable</li>
    <li>long threads are <a href="http://typophile.com/node/53932" rel="nofollow">paged</a> (after 90 replies – that’s reasonable), but <a href="http://typophile.com/node/19295#comment-118510" rel="nofollow">unread replies aren’t marked on following pages</a></li>
    </ul>
