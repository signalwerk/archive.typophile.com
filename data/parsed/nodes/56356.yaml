    html: |-
      <p>What's with messing with the URL structure? It appears that the /cms/ thing is perhaps a staging area? I hope so, because if you thought that your Google indexing was bad before, wait until your entire site is de-indexed. Automated 302 redirects are helpful, and if the move is permanent, full 301 redirects are essential.</p>
      <p>As a side note, if the /cms/ change isn't a staging area for the server transfers, it's a poor URL design structure that does little to help the end user. A URL re-write could be used to make things more user, and SEO, friendly.</p>
      <p>Just some thoughts, in any case. Take them for what you will.</p>
