      <p>Matt, FF Scala has been used for many subjects - I have seen art and recipes books set in it - and it isn't a "democratic" or political typeface per se (*).</p>
      <p>If you're stuck with the idea of finding a typeface related to the subject of your book, or to a particular cultural climate (the union struggles in Hull in post II world war Britain), why don't you look, for example, for a book typeface used in that period in your country?</p>
      <p>You could try to have a look at the classic Monotype catalogue set by Stanley Morison or at the Penguin social essays published in 50/60/70's.</p>
      <p>Eric Gill's work has a strong, unorthodox connection to socialist ideas in XX century Britain: perhaps you could try to have a look at his Aries, Golden Cockerel or Johanna serif types.</p>
      <p>Or, more simply, try to look for a typeface from Britain's typographic heritage - Baskerville and Miller comes to mind.</p>
      <p>Hope this helps.</p>
      <p>(*) Martin Majoor on the origins of Scala: "FF Scala is named after the Teatro alla Scala (1776–78) in Milan. There were two reasons for this name: FF Scala was made especially for a concert hall, the Vredenburg in Utrecht, and the design has it roots in around the time Teatro alla Scala was built, the mid-eighteenth century".</p>
    html_clean: |-
