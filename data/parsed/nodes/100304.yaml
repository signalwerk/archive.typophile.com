      <p>thanks for all the feedback i have looked into Johanna.<br>
      I have looked into the Monotype catalogue previously and they did help.<br>
      I wanted to stay clear of Baskerville due to history of being created for a upper class market and it's like to Cambridge University and it's connotations of dignity and it's common use to day with university studies. Not to say i don't like Baskerville (great typeface) but just feel as if would be slightly hypocritical to the narrative.</p>
      <p>I have a meeting with a manger at GF Smith's (paper) tomorrow morning and his father owned the print company that printed the handbook's and all the forms for the dockers so that could really be a positive move forward.</p>
      <p>Thanks again for all the help,</p>
      <p>Really appreciated</p>
