    <p>Hi There, </p>
    <p>I've got a brief to make a small book/booklet in the style of a "Dockers Workbook" celebrating one man (union leader Walt Cunningham's) life on the docks of Hull between 1950's-1980's. </p>
    <p>i have been looking everywhere for a nice clear legible serif typeface to  use for my body copy , i found one that i loved FF Scala Pro Regular <a href="http://www.fontshop.com/fonts/downloads/fontfont/ff_scala_pro/" title="http://www.fontshop.com/fonts/downloads/fontfont/ff_scala_pro/">http://www.fontshop.com/fonts/downloads/fontfont/ff_scala_pro/</a> it works n perfectly with the ethos of my type having been use in books depicting  democratic revolutions/movements and in Museum booklets.The elegance of this typeface is exactly what i need but don't have the  € 299.00  to purchase it on a student's income. </p>
    <p>I was wondering if anyone had any alternatives to FF Scala with a more friendly price tag. or any other typeface what would communicate perfectly the struggles of a working class movement which have been in mostly forgotten. </p>
    <p>Thanks for any response</p>
    <p>Matt Russell</p>
    <p><a href="mailto:mattrusselldesign@gmail.com">mattrusselldesign@gmail.com</a><br>
    <a href="http://www.mattrusselldesign.net" title="www.mattrusselldesign.net">www.mattrusselldesign.net</a></p>
