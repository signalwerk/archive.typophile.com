      <p>Rich: <em>...what's the best that can be done for now? In bulk. Quickly.</em></p>
      <p>Not good enough.<br>
      _____</p>
      <p><em>I disagree on the VTT part. Learning curve too high. Can't produce enough to meet the immediate demand. There are very acceptable, quicker alternatives.</em></p>
      <p>Hinting is a design process, measured in the legibility of its results at specific sizes, so the notion of acceptability, like all notions of quality in type design, is directly related to individual typefaces for particular writing systems at specific sizes. There is no generalised basis for declaring one tool, process or strategy ‘very acceptable’, except insofar as the tool enables one to do everything that might need to be done to achieve the desired results.</p>
      <p>If you go back and read the post in which I made the comment about VTT, you'll understand that I'm talking specifically about situations in which autohinting or even manual hinting in FontLab is not sufficient, because that tool doesn't enable one to do everything that needs to be done. Claus was wondering why Microsoft still rely on hinting in their rasterisation model, instead of ignoring hints in the way that Apple do or some applications using Freetype do. I replied with reference to the visible benefits of hinting generally, and more specifically in context of making dedicated screen fonts for small ppem sizes for writing systems that have much more stroke complexity than Latin or other European scripts. I might suggest that the reason Microsoft still include hinting in their rasterisation approach is that they have a much better understanding of the needs of internationalisation than any other OS developer. There are plenty of glyphs in plenty of writing systems that, without hinting control, resolve into grey blobs at typical text sizes on screen.</p>
