    html: |-
      <p>There is nothing wrong with most of the bug reports. I find most of them really interesting (true, there are some funny ones which show a lack of type design knowledge like the one James quoted about adding a Monospace family). It just seems to me that Linux has been flying under the radar of commercial font production until now*, but now a whole new can of worms has been opened.</p>
      <p>On Windows the rendering options are quite simple: No smoothing, Greyscale smoothing, ClearType (+recently DirectWrite). That's 4 options.</p>
      <p>On Ubuntu (Gnome? I kind of lost track there ...) there is No smoothing, Greyscale, Subpixel; with hinting ignored (Mac-like), slight, medium, and full. The interpreting of certain instructions may be switched on or off in FreeType (patent issues). That gives you over 20 combinations that may affect the final result.</p>
      <p>* Yes, I know there are the Droid and Liberation fonts, but I haven't seen a bug tracker for them.</p>
