    html: |-
      <p>John you’re  absolutely right. Hinting for Ubuntu is like trying to hit a moving target.</p>
      <p>The FreeType rasterizer on Ubuntu is configurable by any application, so you find that OpenOffice rasterizing is different from Mozilla Firefox rasterizing which is different again from the ‘standard’ system rastersing. </p>
      <p>The Ubuntu system rasterizing is also extensively configurable by the user – from ‘full’ hinting down to ‘no’ hinting with switches turning off or on B/W, Greyscale and LCD. Some of these various levels have effects like ignoring ‘hdmx’ values and ‘cvt’ values.</p>
      <p>Another problem here is that the fonts (under an OpenSource license) will inevitably end up on other OS’s so the hinting has to take account of this therefore the fonts cannot be hinted just for FreeType on Ubuntu.</p>
    html_clean: |-
