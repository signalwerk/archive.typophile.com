    html: <p>I don't see what is funny about asking for a monospaced font, Ubuntu font is intended to be an interface font, and a monospaced variant is a must. It might not be worded in the most type savvy way, but canonical is explicitly asking for community input which would certainly include requests like this (and they seem to acknowledge the need for a monospaced font). I agree about the diversity of the possible configurations and it might be a challenge to support all of those. But Ubuntu as an OS vendor (or distribution maker) can opt to only support whatever their default configuration is (plus another one or two most common configurations).</p>
