      <p>Rich&gt; And if crap sells, you have to ask yourself "why mess with a winning formula?"</p>
      <p>I’d ask if <em>only</em> crap sells. But the winning formula you refer to, is that there is no one winning formula, because there are many more than just one baby, baby.</p>
      <p>Rich&gt; I disagree on the VTT part. Learning curve too high.</p>
      <p>I think that’s s’posed to be “too steep,” as only an overshooting curve can be too high. And, perhaps VTT is documented for another age and some things have happened to change the curve steepness that are not reflected either in its operation or its documentation? I’ll ask. </p>
      <p>John&gt;</p>
      <p>Your suggestion, that Microsoft still include hinting because they have a much better understanding of the needs of internationalization than Apple e.g., I think is partly not on target. Microsoft still include hinting because they have less control over fonts, font software and display devices as a percentage of their OS base vs. Apple who is in control of a huge percentage, (down to the very fonts allowed in most of their new devices). </p>
      <p>&gt;There are plenty of glyphs in plenty of writing systems that, without hinting control, resolve into grey blobs at typical text sizes on screen.</p>
      <p>And so they zoom, (the old fashioned way) on most Macs, which I guess one can’t just assume on all Windows devices? I think the issue is not, with all due respect, understanding of the needs of internationalization so much as solving the needs of open-system font adoption on an international scale, without control over the whole process from what font is loaded, to pixels on the screen. </p>
      <p>And this, as you know I believe, is a situation without a process adequate to manage the unfolding complexities of a web-gone-property-wild.</p>
