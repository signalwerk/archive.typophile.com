      <p>@jh</p>
      <p>&gt;&gt;Rich: ...what's the best that can be done for now? In bulk. Quickly.</p>
      <p>&gt;Not good enough.</p>
      <p>It's gotta be and besides, it will be. But that doesn't mean there shouldn't levels.<br>
      There is the mass-produced and the hand-tailored. Remember, too, that a large part of the market using Mac-iPhone-iPad/Quartz aren't going to see the results anyway no matter how hard anybody slaves away.</p>
      <p>I've been spending a lot of time in FontLab over the past month and one of the things I focused on was learning to manually hint. The documentation - which I've read over and over - isn't bad. I've gotten info from other sources too - whatever I could find. But I have to assume something's missing because my brain remains unpenetrated. I'm still largely mystified by the results I get.<br>
      But that's OK, because it at least answered the question for me: "How accessible is this stuff?"<br>
      I've put it aside and will revisit - much else to do with bigger payoffs.</p>
      <p>At this point, I would imagine MSFT sees it as against their own interest to start offering more intuitive font-creation tools. They can get what they need from the existing pool of cogniscenti familiar with their ways, and that's that. Why get more people involved - to create better quality fonts for Google and Sun to wield as hatchets as they <a href="http://www.nytimes.com/2010/10/21/technology/21soft.html?_r=1&amp;hp" rel="nofollow">chip away</a> at MS Office? I don't think so.</p>
      <p>&gt;I don't see zooming as an adequate solution to screen legibility issues.</p>
      <p>Zoom, zoom, zoom. Interestingly, it has gone completely unremarked anywhere as far as I know that IE9 has done away with IE's Text Size menu. Gone *and* instantly forgotten. Resizing text independently of the surrounding content is now totally in the realm of on-page JavaScript widgets. [A+] [A-]<br>
      I'd rather have seen a Text Only resize/reflow remain in the browser chrome but these days on mobile platforms there's nowhere in the chrome to put the feature. And there's no spec that allows you to detect - cross browser/cross platform - when the user zooms so as to present an alternative. (I've done a lot of work on this - to completely no avail.)<br>
      So here we are, paddling on.</p>
