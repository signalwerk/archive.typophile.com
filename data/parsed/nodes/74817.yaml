    html: |-
      <p>Clause: <em>I can't believe why Microsoft is still hanging on to the hinting approach.</em></p>
      <p>I can, because I get to see the clear benefits of hinting on a daily basis making fonts for a whole range of writing systems legible at 11 and 12 ppem. Since these are fonts primarily targeted at limited size ranges on screen, I get to design to the bitmaps as much as feasible (given that the fonts need to be reasonably future-proof against higher resolutions and zoomable environments), which in theory is the ideal situation for hintless rendering. But applying hinting to these size-targeted outlines has immediate, obvious visual benefits: stem density (blackness) is increased, stem edges are sharpened, small counters can be held open, letter proportions and sidebearings can be adjusted for proximate ppem sizes.</p>
      <p>I'll go further: not only should people still be hinting, they should be using VTT to do it. FontLab's TT hinting is nice to have for mocking stuff up and for quickly checking GDI CT rendering during outline design, but the range of control and options available in VTT makes it pretty indispensable for high quality developing screen fonts.</p>
    html_clean: |-
