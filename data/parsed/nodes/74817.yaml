      <p>As of yesterday, the Typekit blog has started to hone in on sites using Typekit's library.</p>
      <p><a href="http://blog.typekit.com/2010/10/08/sites-we-like/" rel="nofollow">Sites We Like</a><br>
      One of them is <a href="http://100k.bigcartel.com/" rel="nofollow">Bigcartel.com</a></p>
      <p>Using faces named LTC Bodoni and Ambroise.<br>
      Now, Ambroise, at least at the larger sizes used, looks OK. (There are a few defects - the capital H is missing it's crossbar, for example. At least on my machines.)</p>
      <p>But LTC Bodoni is a disaster. At first, I thought some things - like the t's that overshoot the baseline were a design feature. A little bit of funk.<br>
      But no, it's just a crap hinting job all around. And it makes you wonder how something like that passes.<br>
      But it does. It do. And it's there for all to see. And pointed to with pride!<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/10-9-2010 8-41-01 AM_3921.jpg"></div><p></p>
