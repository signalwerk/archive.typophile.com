      <p>John, I've made some screenshots from Typekit's specimens <a class="freelinking external" href="http://typekit.com/fonts/adobe-text-pro" rel="nofollow">http://typekit.com/fonts/adobe-text-pro</a> That way others are able to pull up the same specimens on their computers for comparisons. Adobe fonts are famously auto-hinted, but if you want to point me to another font that will perform better in Windows let me know.</p>
      <p>Waterfalls<br>
      Ubuntu 10.10 RC / Firefox<br>
      <a class="freelinking external" href="http://dl.dropbox.com/u/10940424/screenshots/Ubuntu%20Firefox.png" rel="nofollow">http://dl.dropbox.com/u/10940424/screenshots/Ubuntu%20Firefox.png</a></p>
      <p>OS X 10.6.4 / Safari 5.0.2<br>
      <a class="freelinking external" href="http://dl.dropbox.com/u/10940424/screenshots/Safari%20OS%20X.png" rel="nofollow">http://dl.dropbox.com/u/10940424/screenshots/Safari%20OS%20X.png</a></p>
      <p>Windows 7 / Internet Explorer 9 beta<br>
      <a class="freelinking external" href="http://dl.dropbox.com/u/10940424/screenshots/Windows%207%20IE9.png" rel="nofollow">http://dl.dropbox.com/u/10940424/screenshots/Windows%207%20IE9.png</a></p>
      <p>Best renderings:<br>
      36 Ubuntu wins. OS X is too dark/fat. Windows is too thin, some strokes disappear (f, a, u, h, m, p). 'T' is flat on the top, compare with Ubuntu – I say it's better fidelity to the outline.<br>
      30 Id.<br>
      24 Id.<br>
      21 Id.<br>
      18 This is where the Windows (auto-)hinting falls apart. All the Windows renderings below this size are awful. Ubuntu still clearly in the lead, OS X is too dark.<br>
      16 Id.<br>
      14 Id.<br>
      13 From this size and down Ubuntu does become anemic compared to OS X, however it retains higher fidelity to the design, and it's not bad per se.<br>
      12 Id.<br>
      11 Id.<br>
      10 Id.<br>
      9 Id.</p>
      <p>Sample text<br>
      Ubuntu 10.10 RC / Firefox<br>
      <a class="freelinking external" href="http://dl.dropbox.com/u/10940424/screenshots/Ubuntu%20Firefox%202.png" rel="nofollow">http://dl.dropbox.com/u/10940424/screenshots/Ubuntu%20Firefox%202.png</a></p>
      <p>Smoothest rendering of the three. Keeps a contrast between vertical and horizontal strokes that OS X does not.<br>
      Major colour-fringing in negative text, but still the best between to three (but only because the three are generally horrible in negative).</p>
      <p>OS X 10.6.4 / Safari 5.0.2<br>
      <a class="freelinking external" href="http://dl.dropbox.com/u/10940424/screenshots/Safari%20OS%20X%202.png" rel="nofollow">http://dl.dropbox.com/u/10940424/screenshots/Safari%20OS%20X%202.png</a></p>
      <p>Blocky, splotchy (eg. vertical stroke in 'a') rendering with a noticeable lack of contrast between horizontal and vertical strokes.</p>
      <p>Windows 7 / Internet Explorer 9 beta<br>
      <a class="freelinking external" href="http://dl.dropbox.com/u/10940424/screenshots/Windows%207%20IE9%202.png" rel="nofollow">http://dl.dropbox.com/u/10940424/screenshots/Windows%207%20IE9%202.png</a></p>
      <p>What can I say? The Windows rendering is extremely jagged. Fidelity to the design is very low. People who prefer this should probably get prescription glasses or an LCD monitor, or both.</p>
      <p>Comments?</p>
