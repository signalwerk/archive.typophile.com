    <p>Music and animated type combine to make typefaces/imagery<br>
    <a href="http://www.ni9e.com/typo_illus.php" title="http://www.ni9e.com/typo_illus.php">http://www.ni9e.com/typo_illus.php</a></p>
    <p>Kinetic Typography coupled with sound (Fight Club and Sky, etc.) at:<br>
    <a href="http://www.cs.cmu.edu/~johnny/kt/" title="http://www.cs.cmu.edu/~johnny/kt/">http://www.cs.cmu.edu/~johnny/kt/</a></p>
    <p>This is an interesting site, although sometimes frustrating:<br>
    <a href="http://www.typorganism.com/" title="http://www.typorganism.com/">http://www.typorganism.com/</a></p>
