      <p>"Brand Lager" and "The Famous Cinci": I don't have an exact match but you may be able to approximate it using <strong><a class="freelinking external" href="http://www.findmyfont.com/index.php/fonts/font-preview?fset=Typodermic&amp;ffam=Blue%20Highway%20-%20Regular&amp;fstyle=i&amp;fsize=60&amp;fid=3b7e7e678645357a77e3fe6c440e44ab&amp;wrap=2&amp;text=THE%20FAMOUS%20CINCI%20BRAND%20LAGER" rel="nofollow">Blue Highway</a></strong> by Ray Larabie (Typodermic) by modifying /H &amp; /M and probably some more letters</p>
      <p>"BRANDIN"S": The closer I can see are some condensed forms of <strong><a class="freelinking external" href="http://www.findmyfont.com/index.php/fonts/font-preview?fset=Adobe&amp;ffam=DIN%201451%20Std%20-%20Engschrift&amp;fid=1cf07fdc01da97ba3a1410d18951d28f&amp;fsize=60&amp;text=BRADING'S&amp;fit=1" rel="nofollow">DIN 1451</a></strong></p>
    html_clean: |-
