      <p>"BRADING'S" - only similars: <a class="freelinking external" href="http://www.myfonts.com/fonts/jnlevine/inventory/" rel="nofollow">Inventory</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/jnlevine/canby/" rel="nofollow">Canby</a><br>
      "Cincinnati Cream": those I like (and even you're not after it ;) <a class="freelinking external" href="http://www.myfonts.com/fonts/sudtipos/fan-script/" rel="nofollow">Fan Script</a>, <a class="freelinking external" href="http://www.letterheadfonts.com/fonts/chicagoscript.php" rel="nofollow">Chicago Script</a>, <a class="freelinking external" href="http://www.letterheadfonts.com/fonts/ballparkscript.php" rel="nofollow">Ballpark Script</a>, <a class="freelinking external" href="http://www.letterheadfonts.com/fonts/ephemera.php" rel="nofollow">Ephemera</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/fontbureau/casey/" rel="nofollow">Casey</a><br>
      ""Brand Lager"/"The Famous Cinci": suggestion by Fivos is fine to me. Some more: <a class="freelinking external" href="http://www.myfonts.com/fonts/nicksfonts/outer-loop-nf/" rel="nofollow">Outer Loop</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/fontbureau/benton-sans/" rel="nofollow">Benton Sans</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/fontbureau/interstate/" rel="nofollow">Interstate</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/pixymbols/highway-gothic/" rel="nofollow">Highway Gothic</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/urw/saa/" rel="nofollow">Saa</a>, <a class="freelinking external" href="http://www.youworkforthem.com/font/T1052/signal" rel="nofollow">Signal</a></p>
