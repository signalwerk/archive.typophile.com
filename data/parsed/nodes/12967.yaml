    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Terminology" class="freelinking" rel="nofollow">Terminology</a> : Squoosh</strong></p>
    <p>v. transative. A term used to describe type that has been horizontally or vertically stretched or condensed using graphic design software. Glyph scaling in this manner is almost always inadvisable and is often a sure sign of amateur typography. Space is best saved by reducing the type size or using a condensed (or extended) version of the font professionally drawn by a type designer.</p>
    <p>“Squooshed™” is a trademark of <a href="http://www.typophile.com/node/6471" rel="nofollow">Miss Tiff Industries, Inc.</a></p>
    <p>See also <a href="/wiki/Faux%20Formatting" class="freelinking" rel="nofollow">Faux Formatting</a>.</p>
    <p><strong>External Links</strong><br>
    <a href="http://www.artlebedev.com/mandership/134/" rel="nofollow">A Limit to Font Scaling</a><br>
    "As a way to train the eye, we suggest that designers (and customers) take their own photo and distort it along with the font. When the distortions become visible on the face, it’s time you stop disfiguring the font."</p>
