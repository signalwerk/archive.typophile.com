  html: |-
    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/12038" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Terminology</a>&nbsp;:&nbsp;Squoosh</strong></p>
    <p>v. transative. A term used to describe type that has been horizontally or vertically stretched or condensed using graphic design software. Glyph scaling in this manner is almost always inadvisable and is often a sure sign of amateur typography. Space is best saved by reducing the type size or using a condensed (or extended) version of the font professionally drawn by a type&nbsp;designer.</p>
    <p>“Squooshed™” is a trademark of <a href="http://www.typophile.com/node/6471">Miss Tiff Industries,&nbsp;Inc.</a></p>
    <p>See also <a href="/node/17752" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">faux formatting</a>.</p>
    <p><strong>External Links</strong><br><a href="http://www.artlebedev.com/mandership/134/">A Limit to Font Scaling</a><br>
    “As a way to train the eye, we suggest that designers (and customers) take their own photo and distort it along with the font. When the distortions become visible on the face, it’s time you stop disfiguring the&nbsp;font.”</p>
