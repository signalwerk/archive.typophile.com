    <p>Hi Folks,</p>
    <p>I am happy to report that I have a FontLab class starting up soon. Most of you probably don’t need it (it’s super basic), but anyone who’s interested is welcome.</p>
    <p>All that entry requires is enrolling at <a href="http://www.ccsf.edu/Offices/Matriculation/step1.htm">City College</a> and having some demonstrable command of Bézier curves (like in Illustrator).</p>
    <p>Everything else we can take care of on the first day of class.</p>
    <p>GRPH 152 Digital Font Creation<br>
    Wednesdays: 6:00–10:00pm, Visual Arts 143<br>
    CCSF Ocean Campus: 50 Phelan Ave.<br>
    8-week course: October 26–December 14, 2005<br>
    CRN 76938</p>
    <p>BTW, it’s a one-unit class, making it a whopping $26!</p>
    <p>Feel free to email me with questions,</p>
    <p>Amy Conger<br>
    <a href="http://fog.ccsf.cc.ca.us/~aconger/"> http://fog.ccsf.cc.ca.us/~aconger/</a><br>
    <a href="http://www.abecedarienne.com" title="http://www.abecedarienne.com">http://www.abecedarienne.com</a></p>
