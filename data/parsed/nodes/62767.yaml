      <p>The left-slanted serif, seems to be a normal serif with the O and M graphically backslanted. I don't think that's the way the font was designed. I couldn't identify the serif offhand though. The longer baseline leg of the E should be a good clue.</p>
      <p>- Mike Yanega</p>
