      <p>Subtle erif is close to <a class="freelinking external" href="http://new.myfonts.com/fonts/adobe/itc-symbol/" rel="nofollow">ITC Symbol</a> and <a class="freelinking external" href="http://new.myfonts.com/fonts/redrooster/alexon-rr/" rel="nofollow">Alexon</a> by Les Usherwood. There are a number of these tinyserif (MyFonts keyword) fonts. These two looked closest to me. They may have been manipulated graphically too.</p>
      <p>- Mike Yanega</p>
