    html: |-
      <p>This isn't an old Letraset font, it is even older ;-)<br>
      This is Prisma, from Rudolf Koch / Gebr. Klingspor. Prisma is an inline, all-caps version of Kabel. There isn't an official digital version, but there are free fonts around the internet somewhere.</p>
