    <p>The only information I can find on Hans Möhring's Florida 1932 is a set of upper case letters from A to W in the Klingspor Schriftdesigner pdf on him:<br>
    <a href="http://bahoe.de/Klingspor/KlingsporKuenstler/Schriftdesigner/Moehring/Moehring.pdf" title="http://bahoe.de/Klingspor/KlingsporKuenstler/Schriftdesigner/Moehring/Moehring.pdf">http://bahoe.de/Klingspor/KlingsporKuenstler/Schriftdesigner/Moehring/Mo...</a><br>
    For ease of reference, here is A to W, in a digital interpretation I  did based on the letters in the Klingspor pdf.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/FloridaHansMöhringWilhelmWoellmer1932SM_3734.jpg"></div><br>
    Note the  asymmetrical stroke weight in _O_, _B_, _D_, _P_, and _R_.<br>
    I was wondering if there was a lower case and other characters and what they might look like.<br>
    The foundry might have been Wilhelm Woellmer.<br>
    Thanks.<br>
    Don<p></p>
