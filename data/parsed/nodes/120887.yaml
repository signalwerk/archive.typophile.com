      <p>|X|, |Y|, and |Z| could be seen on the credits of "Persona": <a href="http://youtu.be/iO4gk3_kZjU?t=6m23s" title="http://youtu.be/iO4gk3_kZjU?t=6m23s">http://youtu.be/iO4gk3_kZjU?t=6m23s</a> (linked in this font ID thread: <a href="http://typophile.com/node/120614" title="http://typophile.com/node/120614">http://typophile.com/node/120614</a>).<br>
      Not exactly sharp, but at least the shapes, contrast and proportions are visible.<br>
      Also some awkward so-tight-they-look-like-stubs umlauts.<br>
      I think this is a caps-only design. Moreover, the position of diereses and the retracted |Q|'s tail make me think it was designed as a titling typeface intended to take up any ascender and descender space available.</p>
