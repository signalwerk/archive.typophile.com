      <p>It’s strange how the sharper look make it appear more art deco, “more Peignot” to me, thus less modern.<br>
      In any case, I don’t think the pointed terminals (on |M|, |N|, etc.) belong to the original design. Also, judging by the version used for the DVD cover,* indubitably lifted directly from the film, the |N|’s thin stems appear to be a bit tapered. It could be an artefact of photo reproduction, but I think they harmonise nicely with |E|, |T|, etc.<br>
      Sorry to not adding any valuable historical information.</p>
      <p>* <a href="http://www.criterion.com/films/28491-persona" title="http://www.criterion.com/films/28491-persona">http://www.criterion.com/films/28491-persona</a><br>
