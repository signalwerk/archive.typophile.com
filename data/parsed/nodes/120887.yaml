    html: |-
      <div class="comment-spam-body"><p>Ye, I can see that a recreation would:<br>
      1. Loose the points<br>
      2. Probably, taper thin strokes, like _N_ and perhaps elsewhere. This was not obvious from the small scale letters in the Klingspor pdf, but could be there.<br>
      I'm not certain about the bulbous ends. The letters in the Klingspor pdf don't seem to have them. I know from previous research of Criterion covers that they sometimes rework fonts substantially.<br>
      As for the sharper look of this digitization, it might look more Art Deco than my scan but the thickness and alignment of the clean digital strokes follows the scan very closely, with the exception of the the tapered thin strokes of _N_ which I probably incorrectly interpreted as a printing effect rather than a design feature.<br>
      As for  subtlety and warmth, I see a hard edge Art Deco design of 1932 in the  letters in the Klingspor pdf with variations being mainly the result of the printing and scanning process.<br>
      This issue could be clarified by a better specimen.<br>
      Still would love to know if there is a lower case and other characters.<br>
      BTW I agree with the similar to Peignot observation. This is a design of that era.<br>
      Don</p>
      </div>
