      <p>Hi everyone,</p>
      <p>I third Insignia!  ;-D</p>
      <p>And I'd have to nominate Futura Condensed as a very '80s sans serif.  Yeah, I know it's been around and in use a long time, but it seemed to me that it was EVERYWHERE during the Me Decade.</p>
      <p>Avant Garde was still getting a lot of use, but to me that's a quintessentially '70s sans serif.</p>
      <p>Helvetica was everywhere too, but to me that doesn't exactly count because to most people back then, it was a "default" "block style" font.  Heck, until the Mac made its debut in 1984 I had never heard of the word "font" except in the baptismal sense!  ;-)</p>
      <p>Cheers,<br>
      John the Fontaholic</p>
