    html: |-
      <p>Ubiquitous and in the background: Helvetica, Univers, and still a lot of Avantgarde</p>
      <p>What I used most: Futura - all weights, (think extrabold caps, bold ital u/l, bold condensed, light all caps) - it felt rebellious and new wave against the not exactly sans, but very prevalent Souvenir, Stymie, etc., also some Gill Sans</p>
      <p>What I was very excited about because they were so hard to get - mostly on typositor: Radiant, Empire</p>
      <p>Representative but very hard to get: Insignia, Industria</p>
      <p>A lot of condensed type.(Think Univers Ultra Condensed)</p>
      <p>The fun of phototype: condensing type, letterspacing it.</p>
      <p>The fun of the photocopy machine: distressing it</p>
    html_clean: |-
