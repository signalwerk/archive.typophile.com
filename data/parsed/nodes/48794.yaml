    html: |-
      <p>&gt; there’s not much room to move within strict constraints.</p>
      <p>True, but there's a "genetic" difference between a constraint coming from a medium (lo-res screen) versus a constraint that somebody dreams up: unlike the former, the latter can possibly been inspired by another designer's work. As in "Oh, that looks like an interesting constraint - let me see what I can do with that". Unlike in bitmap fonts, Industria had no "inherited" constraints. That said, I do agree that Industria could very well be "original".</p>
      <p>hhp</p>
