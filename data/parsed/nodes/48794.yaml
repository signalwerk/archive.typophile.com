      <p>"Brody rapidly constructed the typeface later named Industria, and debuted it throughout The Face in July. What a leap, and so rare: an art director designing a typeface for his own magazine."</p>
      <p>Actually Industria seems to be based closely on some student work from the first half of the 20th century, specifically from the Stuttgart School of Decorative Art. See page 105 of "130 Alphabets &amp; Other Signs" by J Rothenstein &amp; M Gooding.</p>
