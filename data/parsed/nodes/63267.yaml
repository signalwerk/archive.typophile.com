  html: |-
    <p>Hey everyone,</p>
    <p>I'm tweaking a logo for a church and looking for the perfect sans-serif. Ideally it would be something pretty geometric -- I'm looking for a round "O" to complement the mark. Also, I would prefer something with a single-story lowercase "a." Right now I'm actually considering using Futura. It's definitely geometric, but it doesn't come off as very warm or personable.</p>
    <p>Thanks for your help!<br>
    Matt</p>
  html_clean: |-
