    <p>Hi all,</p>
    <p>Something new is preparing slowly and this is just small preview of one of them.</p>
    <p>It's called "Passage" and for now it has only 2 styles. Currently working on one more (higher contrast of "Passage Decor") and have one more decorative idea on my mind.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/TDF_Passage_6215.jpg"></div><br>
    <strong>Passage</strong><p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/TDF_Passage_Decor_4798.jpg"></div><br>
    <strong>Passage Decor</strong><p></p>
    <p>In a couple of days I will attach some more previews with longer texts and other tests, this is everything for now.</p>
    <p>What do you think?<br>
    Wasted time or not? :)</p>
    <p>Thanks,<br>
    Dusan</p>
