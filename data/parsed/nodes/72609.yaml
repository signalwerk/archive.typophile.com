    <p>Hi guys,</p>
    <p>I am designing a magazine/book for a Psychiatric Association. The magazine has 100 pages and is mostly for reading long articles. The layout and design is quite "serious". I am trying to make more interesting while keeping its formal style. The client want to use Garamond. </p>
    <p>Now the question are:</p>
    <p>1) What size and leading of Garamond do you suggest?  I thought of Garamond 11 pt (or 11.5 pt) with 14 pt leading. Take in account that is for people over 40 or 50 years and older who reads a long articles and usually complaint to magazine with small minimal type size. </p>
    <p>2) Any suggestions of margins for A4 size? Here is my sample. </p>
    <p>MARGINS are:<br>
    Top: 24 mm (0.944 inches)<br>
    Bottom: 16 mm (0.629 inches)<br>
    Inside: 16 mm (0.629 inches)<br>
    Outside: 16 mm (0.629 inches)</p>
    <p>SAMPLE LAYOUT JUST FOR TEXT<br>
    (80% of the magazine layout)</p>
    <p>a) 2 columns and a half for footnotes (not centered)<br>
    <a href="http://www.pixentral.com/show.php?picture=1ubahhmQILBkStaBYbvuPg36qkihGh" title="http://www.pixentral.com/show.php?picture=1ubahhmQILBkStaBYbvuPg36qkihGh">http://www.pixentral.com/show.php?picture=1ubahhmQILBkStaBYbvuPg36qkihGh</a></p>
    <p>b) 2  columns centered.<br>
    <a href="http://www.pixentral.com/show.php?picture=194nBRVVNHHbPqMoROMsKz9ZaF0J0" title="http://www.pixentral.com/show.php?picture=194nBRVVNHHbPqMoROMsKz9ZaF0J0">http://www.pixentral.com/show.php?picture=194nBRVVNHHbPqMoROMsKz9ZaF0J0</a></p>
    <p>FOR TEXT AND IMAGES<br>
    (10% of the magazine, not the usual layout)<br>
    <a href="http://www.pixentral.com/show.php?picture=1zrTpAY4Bqf6PqAmPQvfJeiqlhTum" title="http://www.pixentral.com/show.php?picture=1zrTpAY4Bqf6PqAmPQvfJeiqlhTum">http://www.pixentral.com/show.php?picture=1zrTpAY4Bqf6PqAmPQvfJeiqlhTum</a></p>
    <p>Sorry for the long post, but i want to show the full info here.</p>
    <p>Thanks for any help or info!</p>
    <p>Regards,<br>
    Sebs</p>
