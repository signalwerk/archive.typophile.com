      <p>Sebastian,</p>
      <p>I made the InDesign sample with CS5. Probably you're using an older version and thus got error messages. I did other versions: ID markup from <a class="freelinking external" href="http://if.pro.br/psy-cs5.idml" rel="nofollow">CS5</a> and <a class="freelinking external" href="http://if.pro.br/psy-cs4.idml" rel="nofollow">CS4</a>, which may be opened with both. And also an <a class="freelinking external" href="http://if.pro.br/psy-cs3.inx" rel="nofollow">interchange CS3</a> version. Hope one of these will work.</p>
      <p>As you said the font was already chosen, I did not talk about this. But others pointed Garamond has many cuts (and there is also Adobe Garamond Premier and Simoncini Garamond, not cited until now). Bitstream had four cuts (American, Classical, Elegant and Original Garamond) but I guess these are just copies from others. So you may choose between seven cuts, besides revivals with other names as MVB Verdigris.</p>
      <p>As nowadays Psychiatry uses a lot of Biochemical, you may consider how the numbers of all these Garamond work with technical information present in the articles. Superiors and inferiors may be need to Mathematical and Chemical formulas. Some OT features, like arbitrary fractions, could also be an issue. Old style numbers are more elegant than lining ones. But if you have many numbers in a text, I think old style ones do not works so well.</p>
      <p>To footnotes, it would be better to remain with the same font used in main text –maybe with a different cut, as Nick suggested.</p>
