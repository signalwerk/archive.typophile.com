      <p>Hi guys thanks for the fast replies...very interesting tips indeed. </p>
      <p>I think i get what you say about the botton margin being larger than the top one. Maybe to get closer to the idea of the good  proportion as Tschichold said in</p>
      <p><a href="http://en.wikipedia.org/wiki/File:Van_de_Graaf_canon_in_book_design.svg" title="http://en.wikipedia.org/wiki/File:Van_de_Graaf_canon_in_book_design.svg">http://en.wikipedia.org/wiki/File:Van_de_Graaf_canon_in_book_design.svg</a></p>
      <p>Regarding your suggestions i made a couple of fast samples</p>
      <p>Body Type:Stemple Garamond LT.<br>
      Size/Leading: 12/15 pt</p>
      <p>Footnotes: Myriad Pro<br>
      Size/Leading: 10/13 pt</p>
      <p>1) One column with good space at the bottom margin for footnotes.<br>
      <a href="http://www.pixentral.com/show.php?picture=1vLXsfXq53wk4dFEP5r2zIaiVzZL" title="http://www.pixentral.com/show.php?picture=1vLXsfXq53wk4dFEP5r2zIaiVzZL">http://www.pixentral.com/show.php?picture=1vLXsfXq53wk4dFEP5r2zIaiVzZL</a></p>
      <p>2) Two columns with good space at the bottom margin for footnotes. (the 2 columns have more design features to play with that a one column central paragraph i think).<br>
      <a href="http://www.pixentral.com/show.php?picture=1lhMQXECGovEpBPynEwKQQlSVt42J" title="http://www.pixentral.com/show.php?picture=1lhMQXECGovEpBPynEwKQQlSVt42J">http://www.pixentral.com/show.php?picture=1lhMQXECGovEpBPynEwKQQlSVt42J</a></p>
      <p>3) Two columns with a vertical footnote.<br>
      <a href="http://www.pixentral.com/show.php?picture=11ZwQYjxwKvUE12UM1h3bok6vZk76Y0" title="http://www.pixentral.com/show.php?picture=11ZwQYjxwKvUE12UM1h3bok6vZk76Y0">http://www.pixentral.com/show.php?picture=11ZwQYjxwKvUE12UM1h3bok6vZk76Y0</a></p>
      <p>So what do you think you like the best?</p>
      <p>I am sorry but my client is decided that the font has to be Garamond. There is a famous psychoanalytical essay of Lacan regarding Garamond Font, and even though it is not a good enough functional design reason to me but is my client fascination with this so Garamond will have to be. Later on what version of Garamond: Stemple or Adobe Garamond Pro. </p>
      <p>By the way, i just found an interesting website with a Golden Section A4 Template with margins and grids. It could be interesting to give it a try.<br>
