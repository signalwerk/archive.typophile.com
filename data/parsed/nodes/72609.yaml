      <p>Generally speaking, optical center is slightly above actual center, so your top margin should be smaller than your bottom margin and, according to general proportional rules, the outside margin should be slightly larger than the inside margin.</p>
      <p>Garamond is a reasonable choice but, given the presbyopic nature of your readers (like me), ITC Garamond Condensed (larger x-height) at 12/14 might be preferable...or not.</p>
