      <p><em>...people speak with certain disdain about the ITC Garamond versions...</em></p>
      <p>There is indeed snobbery directed at ITC Garamond.<br>
      It is said by some that a face with such a large x-height has no business appearing in book text.<br>
      ITC Garamond was also extremely popular in commercial work (the old "trade" stigma) in the 1970s and 80s, as well as being Apple's display face (in the Condensed version), where it acquired the negative connotation of being the face of desktop publishing in the 1980s, when DTP signified cheap and nasty typography.</p>
      <p>However, if your client is going to challenge you with a Lacanian peccadillo, I would say that warrants a non-conformist response.</p>
      <p>For the exact size and leading, and whether you choose Light or Regular weight, experiment and trust your judgement, but in my opinion the Light is far more interesting. I prefer it without much leading, as the extenders are so short.</p>
      <p>With Light for text and Book for footnotes, fixing the optimum relationship could help structure your page.</p>
