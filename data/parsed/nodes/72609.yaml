      <p>I'm not aware of any essay by Lacan "on Garamond," but he may mention it in passing in his <em>Écrits.</em> See, especially, <em>Section I: Le Sens de la lettre.</em> But he is discussing the Letter as some sort of (impenetrable) metaphor for unconscious being the Seat of language. I don't think it has anything to do with Garamond, specifically.</p>
      <p>If there is, in fact, anything by Lacan specifically dealing with a typeface called Garamond, I would be quite surprised.</p>
      <p>But, hey, all the more reason...</p>
