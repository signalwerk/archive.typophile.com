      <p>Geometrical schemas to construct page margins are presented in detail by Robert Bringhurst in <em>Elements of Typographical Style</em>. van de Graaf's is one of them.</p>
      <p>Anyway, I never agreed about these schemas because they produces margins too large without a real logical reason. To have a geometrical division of the page is not enough (in my opinion, of course) to waste so much space on paper.</p>
      <p>Grid systems are useful to layouts with many elements, especially newspapers. In your case, this is not necessary.</p>
      <p>I did a sample using these margins:<br>
      Top: 18mm, bottom: 24mm, outside: 16mm; inside: 30mm.</p>
      <p>You can see it in <a class="freelinking external" href="http://if.pro.br/psy.png" rel="nofollow">small</a> and <a class="freelinking external" href="http://if.pro.br/psy-full.png" rel="nofollow">full size</a>. The InDesign file is also <a class="freelinking external" href="http://if.pro.br/psy.rar" rel="nofollow">available</a>.</p>
      <p>I used Berthold Garamond in 11.5/14pt because this is my favorite Garamond revival. It's just an example (text is from Deutsche Wikipedia page about Psychiatry).</p>
