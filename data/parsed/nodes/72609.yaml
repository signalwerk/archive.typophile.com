    html: <p>How many footnotes do you expect to have and what will be their function (will they be long parenthetical explanations or brief citations, for example)? The use of Myriad 10/13 for footnotes with Stempel or Adobe Garamond 12/15 seems odd to me, because if there is a lot of footnote on the page, the Myriad will look dominant. Myriad 10 has almost the same x-height as Adobe Garamond 12 (and I think the x-height of Stempel Garamond is about the same), and being sans Myriad is denser. If you will have a lot of footnote text, it would be much simpler to use a Garamond for both, using different optical sizes.</p>
