      <p>Just some notes. I'm surprised nobody has mentioned it, but there are two general "Garamonds." Haul out your Bringhurst. Quick synopsis, not entirely accurate: One tradition is more or less out of the Garamond foundry. The other is the work of the French Huguenot, Jean Jannon -- Garamond No. 3, Monotype Garamond being prime examples. Tongue partly in cheek, the Jannon variants seem perfect for psychology. Sadly, the digital versions of Garamond No. 3 and Monotype Garamond are lacking.</p>
      <p>* * *</p>
      <p>I tried to get Stempel Garamond to work, first with the Linotron 202, and later wth PostScript. Miserable font. Sidebearings wrong, letterfit poor. Well, maybe I'm just squawking because I couldn't fix it. Blow to the ego. Letterforms (as oppose to fit) are beautiful.</p>
      <p>As John Hudson said (but less crudely), ITC Garamond didn't even get hind teat, it got pushed clean off. No nourishment at all.</p>
      <p>Sabon Next isn't Sabon, but it is a pretty nice Garamond.</p>
      <p>A lot of the revivals don't look good printed offset, esp. direct to plate, which is how yo'll be printing the magazine, I imagine.</p>
      <p>If it has to have the name "Garamond," that is, if Sabon Next is out, Adobe Garamond is probably it. But take a look at Adobe Garamond Premier Pro, a different font than Adobe Garamond.</p>
      <p>FWIW</p>
