      <p>Lacan mentions Garamond only once in his Écrits, in Seminar 5, page 501, in <cite>L'instance de la lettre dans l'inconscient</cite> (The Instance of the Letter in the Unconscious):</p>
      <p>::: <cite>Or la structure du signifiant est, comme on le dit communément du langage, qu'il soit articulé.</cite></p>
      <p><cite>Ceci veut dire que ses unités, d'où qu'on parte pour dessiner leurs empiétements réciproques et leurs englobements croissants, sont soumises à la double condition de se réduire à des éléments différentiels derniers et de les composer selon les lois d'un ordre fermé.</cite></p>
      <p><cite>Ces éléments, découverte décisive de la linguistique, sont les phonèmes où il ne faut chercher aucune constance phonétique dans la variabilité modulatoire où s'applique ce terme, mais le système synchronique des couplages différentiels, nécessaires au discerne­ment des vocables dans une langue donnée. Par quoi l'on voit qu'un élément essentiel dans la parole elle-même était prédestiné à se couler dans les caractères mobiles qui, <strong>Didots ou Garamonds se pressant dans les bas-de-casse</strong>, présentifient valablement ce que nous appelons la lettte, à savoir. la structure essentiellement localisée du signifiant.</cite></p>
      <p>-</p>
      <p>::: <cite>Now the structure of the signifier is, as is commonly said of language, that it is articulated.</cite></p>
      <p><cite>This means that its units-no matter where one begins in tracing out their reciprocal encroachments and expanding inclusions-are subject to the twofold condition of being reduced to ultimate differential elements and of combining the latter according to the laws of a closed order.</cite></p>
      <p><cite>These elements, the decisive discovery oflinguistics, arephonemes; we must not look for anyphonetic constancy in the modulatory variability to which this term applies. but rather for the synchronic system of differential couplings that are necessary to discern vocables in a given language. This allows us to see that an essential element in speech itself was predestined to flow into moveable type which, in <strong>Didots or Garamonds squeezing into lower-cases</strong>, renders validly present what I call the "letter"-namely, the essentially local­ized structure of the signifier.</cite></p>
      <p>---</p>
      <p>At least they're not insisting on a Didot.....</p>
