      <p>Last time I checked MVB had a very restrictive EULA, not permitting to publish a PDF online set in any of their fonts, without a prior special agreement with MVB. Keep this in mind if your client needs online publishing. I mention it because you said something about a masters paper, and if the university is going to host his thesis for public access online, then he could get into troubles. </p>
