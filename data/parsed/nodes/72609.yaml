    html: |-
      <p>General approach is good and adequate to contents. This kind of publication does not let much room for artistic or creative design, it needs to be technical and simple as yours.</p>
      <p>Inside margin may need to be larger due to binding.</p>
      <p>I agree with Oldnick: top margin must be smaller and bottom larger. If you will have footnotes, this is even more needed because you have more graphic elements at the bottom of page.</p>
      <p>Garamond has a rather small x-height. So 11.5/14pt or 12/15pt will produce better reading experience to your public. With larger text you may use just two wider columns.</p>
      <p>Scientific publications usually adopt footer indication about article title and/or author name and/or edition number and date.</p>
