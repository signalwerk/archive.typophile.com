      <p>Interesting thread. Here's my two cents -</p>
      <p>Since the common opinion about ITC Garamond is that it works well as a display face, not so much as a text face, Nick Shinn's suggestion of using Tony Stan's typeface seemed to me more like a cultural taunt - something like reviving a typical late Seventies typeface (an era focused on postmodernism / humanities / cultural studies / fascination for European philosophy) for a magazine written by Lacan oriented psychiatrists, than a *real* typographical proposal. But maybe that was just my impression.</p>
      <p>If I had to set a magazine like this in a Garamond, I would choose Adobe Garamond Pro, set in two columns and with a very tight leading. Other suggestions of contemporary serifs based on Garamond shapes are Epic by TypeTrust and Augereau by George Abrams.</p>
