      <p>I don't think an old style like Garamond is sufficiently "serious" for psychiatry these days.<br>
      Perhaps in the days of Freud and Jung.<br>
      But now, the mainstream of psychiatry is more scientific, in the sense of being concerned with prescribing particular drugs for particular conditions, not psychotherapy on a couch.<br>
      So I would recommend something less literary and old-fashioned.<br>
      No doubt your client has a reason for wanting Garamond, but it is a wrong reason.</p>
