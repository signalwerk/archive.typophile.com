    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Designers" class="freelinking" rel="nofollow">Designers</a> : Daniel Lanz</strong><br>
    <a href="http://www.lafonts.com" title="http://www.lafonts.com">http://www.lafonts.com</a><br>
    After completing an apprenticeship as an engraver, Daniel Lanz – who was born in 1958 in Schaffhausen (Switzerland) – spent 20 years carving letterforms and contours into metal. Studying typographic design at the School of Design in St. Gallen considerably depend his interest in the forms and effects of typography.</p>
    <p><strong>Typedesign:</strong><br>
    <a href="http://www.lafonts.com" title="http://www.lafonts.com">http://www.lafonts.com</a></p>
    <p>2003 Design and production of the display typeface „Studio4“ for SOVAZ, Zurich<br>
    <a href="http://lafonts.com/fonts/custom/sovaz.html" title="http://lafonts.com/fonts/custom/sovaz.html">http://lafonts.com/fonts/custom/sovaz.html</a></p>
    <p>2004 Design of the typefamily „Diverda“ for Linotype<br>
    <a href="http://lafonts.com/fonts/diverda/sans.html" title="http://lafonts.com/fonts/diverda/sans.html">http://lafonts.com/fonts/diverda/sans.html</a></p>
