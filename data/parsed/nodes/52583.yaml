      <p>Resolution is not set in InDesign. InDesign always places images at 100% of size except when you are re-linking an old image with a new one.</p>
      <p>Nominal resolution will change for imaging purposes if you scale a raster image up or down when placed in InDesign.</p>
      <p>I tried to duplicate your problem but could not. I have seen a similar problem in old versions of Quark but don't remember what caused them and even then, though the image showed to be very small when placed, it still printed at the correct size and resolution. I have been using InDesign since v2.0 and have never encountered what you describe.</p>
      <p><cite> &gt;&gt; does scaling up by dragging them in indesign result into pixeled images knowing they are 150DPI (can’t check cause i have no printer atm) &lt;&lt; </cite></p>
      <p>If the small image you are seeing is 100% then you cannot scale it up without losing all hope of quality. Try scaling it by two or three hundred percent then view it in InDesign's hi-res mode; that should tell you what you need to know.</p>
      <p>Sorry I don't have a definite solution for you.</p>
