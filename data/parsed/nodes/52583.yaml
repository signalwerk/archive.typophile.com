      <p>Ah. Four years old. There goes my first thought, which was if your images really were 20 x 29.7 <strong>inches</strong> that may be the problem. But probably not, I've placed images bigger than the document size before, and they behaved normally. Never tried poster-size images though...</p>
      <p>As a note, if you're going to reduce the size of an image, best to do it in Photoshop, or some software that doesn't simply scale. That way you can retain/improve resolution.</p>
