      <p>&gt; <em>does scaling up by dragging them in indesign result into pixeled images knowing they are 150DPI (can’t check cause i have no printer atm)</em></p>
      <p>With the image is selected, you can look at the info bar if the image is placed at 100% or not. If it is placed at 100% or smaller, it will print fine. If it's placed smaller than 100%, enlarge it until it's back at 100% (well... if that is the size you want it to be...)</p>
      <p>Pixels will only appear if you place it larger than 100%, especially at 150dpi, which is rater lowres. :)</p>
    html_clean: |-
