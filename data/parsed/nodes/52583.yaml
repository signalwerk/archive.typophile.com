    <p>i have a question about placing images in indesign CS3, all the images i'm placing are at 150DPI 21x29.7 in size (jpeg), now when i place them in the image rectangle they turn out very small. Does anybody know why indesign does this and how to avoid this, i would like to have the correct image size when placing my images in indesign.</p>
    <p>does scaling up by dragging them in indesign result into pixeled images knowing they are 150DPI (can't check cause i have no printer atm)</p>
    <p>thnx in advance</p>
