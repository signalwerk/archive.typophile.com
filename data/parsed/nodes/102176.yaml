    <p>Hi there!<br>
    I really hope this is the right forum to post the question in. I have a font called Skitch from Yellow Design. I have installed all 11 variations but only some of the are available in Photoshop. For example the Skitch fill version doesn't show. I am quite new at using an opentype font like that. I tried to look in the character sub menu in Photoshop but that didn't help. They show so many nice options on their site but I can't access them. F.ex how do you stretch the borders like that when they consist of two characters?<br>
    Here are some links<br>
    <a href="http://www.myfonts.com/fonts/yellow-design/skitch/" title="http://www.myfonts.com/fonts/yellow-design/skitch/">http://www.myfonts.com/fonts/yellow-design/skitch/</a><br>
    <a href="http://yellowdesignstudio.com/fonts" title="http://yellowdesignstudio.com/fonts">http://yellowdesignstudio.com/fonts</a><br>
    Thanks!</p>
