    <p>With the flood of Type IDs hitting this board on a regular basis, we've had an idea that we'd love to get your feedback on.</p>
    <p>How would you feel if incoming Type IDs were pre-sorted into font classifications? </p>
    <p>Potential categories could be:</p>
    <p>- SANS<br>
    - SERIF<br>
    - SCRIPT<br>
    - DISPLAY<br>
    - BLACKLETTER</p>
    <p>Would this be helpful? More appealing? Overcomplicating things? Let us know.</p>
  html_clean: |-
