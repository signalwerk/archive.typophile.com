    html: |-
      <p>What Mark and Lex said. Categories won’t help (even a distinction of sans and serif seems to be too tough for some of our guests). They even would slow down things, as we then had to go through various index pages.</p>
      <p>Better (= distinguishable, ideally descriptive) thread titles would be a real improvement. For the guidelines: There used to be a sticky post with <a href="http://typophile.com/forum/typeid/faq/" rel="nofollow">FAQ</a> (which nobody actually read). They included this paragraph:</p>
      <p>What do I enter in the “Title” line?<br>
      Try to define your type ID request as clearly as possible. For example <em>“1960’s newspaper headline face”</em> or <em>“Lost in Translation movie logo”</em> or <em>“retro script”</em> will do nicely. Whereas <em>“Please help me identify this font”</em> is pretty pointless as that’s the only thing we do on the Type Identification Board. Compare it to a newspaper where every single headline would say <em>“Stuff happened!”</em></p>
      <p>F</p>
