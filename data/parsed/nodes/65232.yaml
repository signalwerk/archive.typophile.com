      <p>I think it would overcomplicate things. Most of the people asking for Type IDs aren't very knowledgeable about type (which is why they're here in the first place), so I can see a lot of requests being miscategorized.</p>
      <p>Plus, I don't want to have to check five separate places to do IDs.</p>
      <p>What I would like is the "Next Thread" and "Previous Thread" links back (lost in the previous redesign).</p>
      <p>Also, maybe include some help text next to the "Title" field when creating new threads to help minimize the "ID THIS FONT PLEASE!!!" titles.</p>
      <p> - Lex</p>
