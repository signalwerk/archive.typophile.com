      <p><cite>Is type design graphic design, or industrial design.</cite></p>
      <p>It’s just design. In principle, designing type is no different from designing a chair, a door handle, a cloth, a house, a car.</p>
      <p>In German we term this *Gestaltung*, i.e. to lend <cite>Gestalt</cite> to something. In Italian, the craftsman calls himself an <cite>artigiano</cite> which word is derived from “art” – now, what is it? I always found the question “art or craft?” leading to nowhere. For me, <cite>Gestaltung</cite> always comprises craft, art and science.</p>
      <p>Or, to put it with Vitruvius, who postulated this target for architecture some two thousand years ago: <cite>venustas, firmitas, utilitas</cite>. Which is beauty, soundness and usefulness. Venustas first, n.b.</p>
      <p>.<br>
      More such Whisky questions, please.</p>
