    html: <p>Personally, Bill, I don't see I need to further categorize type design at all. Unless all you are looking for is one of those discussions which end up just being for the fun of an academic exercise.  I don't see what purpose it serves, particularly in this day of intelligent search engines. You don't even need to know the hierarchy of system categories to find information as Darwin did years ago. You just type "Typeface Design" in to a search box and you get the whole enchilada. If you don't know what either a typeface or design is, you are in bigger trouble than I can help you with.  The design profession as pertains to any of the graphic areas has gone through a long litany of nomenclature changes just in my lifetime. People have argued hours over differences between Visual Arts, Graphic Arts, Graphic Design, Visual Communication Design and now its many new subcategories such as information design, human interface design, web design, branding, corporate identity, media design. Unless you are writing an old fashioned encyclopedia without an index, where you need to pin a label and sub label on everything just to find it in the book it is a futile effort.  I think it is far better to spend your time writing an absolute fool-proof set of rules for spelling in the English language.  When you finish that, if I am still alive, look me up.  By then, all the names will have changed and we will be known as glyphologists or bezier wranglers :-)</p>
