    html: |-
      <p>Type design is a kind of making or factura. Originally done by hand (manu-facture), it is now computer-assisted manufacture. In this sense it is an art requiring aptitude and skill in the sense of a techné.</p>
      <p>It’s principle end or telos is to produce objects-of-use for the manufacture of other objects-of-use, i.e., books and other species of text, whose principle ends are reading. Because the objects of use in this equation are letters and texts and the end is reading, readability and legibility are primary considerations.</p>
      <p>In so far as aesthetic considerations and considerations of gestural force or expressivity come into play type design approaches, in it’s best practitioners, the conditions of the societal institution we call art. </p>
      <p>In so far as knowledge and the exploration of how forms behave in optical-grammatical terms and in so far as the knowledge of the limits of affordance in the perceptual-processing terms comes into play, type design approaches, in it’s best practitioners, the conditions of an exact or applied science.</p>
      <p>In so far as it is a response to already extant type designs and externally or internally constructed briefs type design is a social act, and issues of responsiveness, societal enrichment and fashions come into play.</p>
      <p>Type design is not one or another of these things by itself, but all of them together.</p>
