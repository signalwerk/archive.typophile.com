  html: |-
    <p>Hi,</p>
    <p>I am designing a book that contains interviews.<br>
    I have decided to use indents, both as a relief but also to make the questions (italics)<br>
    stand out, in order to make it easier for the reader to distinguish questions from answers in the text.</p>
    <p>I feel I am doing the right thing, but nevertheless, I am not quite sure if I am violating some clear typographic<br>
    rule or making nonsense by doing this.</p>
    <p>NB: My intention is to avoid 'empty lines'.</p>
    <p>So my question is; am I doing the right thing or not, with these indents for firslt lines of questions and answers?<br>
    If not, what would be the most appropriate way?</p>
    <p>Thanks<br>
    J</p>
