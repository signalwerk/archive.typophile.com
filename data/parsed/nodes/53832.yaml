      <p>Hi</p>
      <p>One option is to indent only the text that makes up the answers:</p>
      <p>Question 1<br>
      --Answer text etc etc<br>
      --Answer text etc etc<br>
      Question 2<br>
      --Answer text etc etc<br>
      --Answer text etc etc<br>
      --Answer text etc etc</p>
      <p>A bit like hanging punctuation, if you get what I mean.</p>
