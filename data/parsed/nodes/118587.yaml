    ¶ Some Twenties and Thirties Sans Serif feature a couple of letters derived from the early or late Middle Age.<br>
    · · · <strong>Examples</strong>: <a class="freelinking external" href="http://www.myfonts.com/fonts/p22/bayer-universal/" rel="nofollow">Bayer's Universal</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/lanston/ltc-goudy-sans/" rel="nofollow">Goudy Sans</a>, Lydian, Peignot.</p>
