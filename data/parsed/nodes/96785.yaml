    html: <p>I would like to second marcox's full-screen PDF presentation scheme. This is how I have done many "PowerPoint" presentations. PDFs even support sound and video files. If I need more sophisticated animations than I can do in PDF, I will use Apple's Kenote, which has some very decent typography controls. Even then, though, I will usually set all my text in InDesign, output to PDF, and then place into Keynote. Because of the non-ubiquitousness of Keynote, though, this only works if you are providing your own computer (and projector dongle) for the presentation. I have also been known to use QLab for presentations, and various other programs. PowerPoint is never one of them.</p>
