    html: |-
      <p>@JamesM: Acrobat has a presentation mode (Command + L on the Mac) which expands the document to fill the screen. You can set transitions between pages, and it responds to USB "clickers" to advance the pages. As mentioned, it's not a great solution when you're trading slides with the sales team. But for self-produced, self-contained presentations, I greatly prefer the typographic/image control of an "InDesign to PDF to Acrobat presentation mode" workflow.</p>
      <p>As for the OP's original question: do those free fonts work in other applications? Have you restarted PPT after installing them? Unlike the Creative Suite apps, Powerpoint (at least on the Mac) isn't smart enough to recognize newly activated fonts on the fly.</p>
