      <p>PowerPoint offers one main thing that PDF lacks in presentation mode, and that is the ability to have my laptop screen displaying mostly my notes (along with a mini slide, and preview of the next one), while projecting just the slide on the other screen, and keeping the two in sync.</p>
      <p>That being said, I use PDF more often than PowerPoint for presentations. Especially when I might need to present on somebody else's hardware.</p>
