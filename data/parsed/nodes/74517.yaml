    html: |-
      <p>thanks for your feedback.</p>
      <p>which particular red did you prefer? They are all slightly different.</p>
      <p>at this point I think the red ones look best because they are much more refined, the bottom one is refined also, but I don't like it so much as it moves away from the calligraphic form which was the initial idea behind the mark. </p>
      <p>i don't think not instantly getting the "vi" part is a problem, i actually like it being quite abstract. </p>
      <p>One other thing I would love some suggestions on is the text to go with the logo. </p>
      <p>I was thinking of something along the lines of 'DESIGN &amp; WEB' however I can see how that may be a bit of a clichè. Is it important for my mark to convey exactly what i do? And web is a very vague term these days, as one can be a front-end developer, a web designer, a SEO guru or a usability expert. Myself I do design, front-end &amp; usability.</p>
      <p>I could also just have Victor Ivanov to go along with the mark, but I think if I were to put my name there, I should probably explain what i offer. </p>
      <p>Would love to hear your thoughts everyone, I really want to nail this identity mark and move on to the website redesign + stationary etc.</p>
