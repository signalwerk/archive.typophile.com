  html: |-
    <p>Hi Every One,</p>
    <p>I want to show you a project that I made. It’s Open Source Code to build bitmap fonts from a very generic format and a Bitmap-Typeface in a lot of variations (88 different fonts). I use the typeface for my stuff, but it’s free and open, too.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/graphicoreBitmapFont-specimen_small_6679.png"></div><p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/graphicoreBitmapFont0_6534.png"></div><div class="imageWrap"><img src="http://typophile.com/files/graphicoreBitmapFont2_6538.png"></div><div class="imageWrap"><img src="http://typophile.com/files/graphicoreBitmapFont4Book_3900.png"></div><p></p>
    <p>I wrote more on my website:
    </p><ul>
    <li>
    English version (not my mother tongue) <a class="freelinking external" href="http://graphicore.de/en/archive/2010-09-09_A-Brute-Font-Attack" rel="nofollow">http://graphicore.de/en/archive/2010-09-09_A-Brute-Font-Attack</a>,</li>
    <li>
    German version <a class="freelinking external" href="http://graphicore.de/en/archive/2010-09-09_A-Brute-Font-Attack" rel="nofollow">http://graphicore.de/en/archive/2010-09-09_A-Brute-Font-Attack</a></li>
    </ul>
    <p></p><p>Hope you like it, cheers,<br>
    Lasse</p>
