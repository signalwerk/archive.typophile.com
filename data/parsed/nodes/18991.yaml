      <p>I was lucky to find a copy of his <em>Thames and Hudson Manual of Typography</em> when I got my first freelance book project a few years ago — I learned quite a bit from this manual! </p>
      <p>McLean not only wrote about Tschichold, he also translated at least two of his books into English — <em>Aymmetric Typography</em> and <em>The New Typography</em> (this last has a great introduction by Robin Kinross, I might add).</p>
