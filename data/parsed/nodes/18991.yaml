      <p>I am very sorry to hear of Mr. McLean’s passing.<br>
      We worked together during his translation of Jost Hochuli’s <em>Detail in typography</em> from the original German, which Agfa-Compugraphic published around 1986-87.</p>
      <p>I knew him as a kind and gentle man who loved type.</p>
