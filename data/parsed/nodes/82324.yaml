    <p><a href="http://typeweek.isiaurbino.net/" title="http://typeweek.isiaurbino.net/">http://typeweek.isiaurbino.net/</a></p>
    <p>ISIA Urbino Type Design Week is a one week intense course which will take place the last week of July at ISIA (High Institute for Applied Arts), in the Renaissance city of Urbino in Italy.</p>
    <p>For one week the students will be guided by proven professionals in the development of an individual type design/lettering project. An interesting programme of lectures will provide the participants with background information addressing discourses and techniques of type design and the design of letters as a critical design process.</p>
    <p>Dalton Maag's crew will be the leading team for 2011. Bruno Maag, together with Jonathan Pierini are looking forward to working hard with you in a studio-like environment.</p>
    <p>If you want to apply send us your cv and a short portfolio of your work in PDF format to <a href="mailto:info@isiaurbino.net">info@isiaurbino.net</a> before the 24th of June 2011.</p>
