    html: |-
      <p>1) It depends on the design, but generally I'm not good enough (yet?) to avoid making semi-finished sketches (at least of the key glyphs).</p>
      <p>2) I avoid geometry explicitly (unless somebody pays me [enough] to rely on it). And although it's funny that you say "intuitive <cite>and</cite> empirical", that's actually exactly what I do! I trust myself, but not completely, and think it's very important -especially in text type- to pay central attention to empiricism and theory.</p>
      <p>hhp</p>
