      <p>Personally, I used to do more sketches but now I just go right to the blank computer screen and start.<br>
      Regarding geometry, it depends on the typeface.  Sometimes the geometry is  the concept but usually I just use my eyes and let my mind decide what it sees to be done. I have no hard "method", so I can't really pin it down.</p>
      <p>ChrisL</p>
