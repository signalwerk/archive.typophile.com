      <p>What would be useful to know in some further detail is what is your goal. Trajan and Lithos are two very different designs, each referencing very different styles and times.<br>
      All that said, you could be interested in the work of Sumner Stone (<a href="http://www.stonetypefoundry.com/stonetypefoundry.html" title="http://www.stonetypefoundry.com/stonetypefoundry.html">http://www.stonetypefoundry.com/stonetypefoundry.html</a>)</p>
