      <p>I don't think I understand your request; I don't mean to be snide, but it sounds similar to asking for a contemporary version of Cuneiform.</p>
      <p>You might go to a site like MyFonts, look up Trajan or Lithos, and then see what they suggest as 'fonts like this' .</p>
      <p>Herb</p>
