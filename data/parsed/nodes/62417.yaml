    html: |-
      <p>Thanks johnnydib, and jwchen I was just on the verge of doing exactly that, but luckily I came across the solution. </p>
      <p>The Solution<br>
      Ok so after hours of trying to figure out what was going on I came up with a solution that tells me nothing of what was going on but still solves the problem without being destructive to the font</p>
      <p>The big answer is .....</p>
      <p>Indesign does not reconize the .ai file on the initial import so I had to right click the image -&gt; Edit Original -&gt; Change something within illustrator -&gt; save the .ai file -&gt; Problem solved within Indesign</p>
      <p>The only problem after that is that I have a 104 page document and I will have to go through all 104 pages to fix the problem. </p>
      <p>which brings up a question<br>
      Is there any way to make global changes in illustrator to multiple documents?</p>
      <p>but on the bright side it did get fixed</p>
      <p>Thanks again</p>
