      <p>The advice to make all your .ai files into .eps files, and statements like "Importing/linking a psd or ai files into indesign are asking for trouble." are of course a load of rubbish.<br>
      :)</p>
      <p>The preferred file formats for use with Indesign are .psd and .ai files.<br>
      If you are using .eps files you are living in / hanging on to the past.</p>
