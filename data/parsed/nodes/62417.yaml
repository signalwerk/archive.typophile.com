    <p>The Rundown<br>
    I am using .ai files inside of Indesign<br>
    Inside of each .ai file is a font "Tekton" (only one font)<br>
    I have bought the licensing agreement for it and my computer does not show the font as missing sooooo.... </p>
    <p>The Problem<br>
    All the Tekton fonts inside of illustrator are changed to a different font within InDesign</p>
    <p>has anyone else ran into this issue it is very frustrating.</p>
    <p>I need some help!!!</p>
    <p>Thanks in advance<br>
    Patrick Palone</p>
