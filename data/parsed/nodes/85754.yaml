    <p>Hey all, I was working on a GD resume for giving out to potential internships and I was curious as to what would be a good compliment to Blur?</p>
    <p>Here is what it looks like for those who don't know exactly if that helps:</p>
    <p><img src="http://bonfx.com/custom/100-best-fonts/images/61_blur.png"></p>
    <p>I obviously want a good contrast to the typeface and ideally would like it to be serif. The blur type on the page is used for header obviously. Thanks in advance!</p>
