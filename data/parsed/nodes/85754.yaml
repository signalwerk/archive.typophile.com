      <p>Hi Alex, I'd suggest you not to use Blur at all. Your potential employer might get the wrong impression; as if you are trying too hard. I would stick to using one font by applying different weights, styles and sizes. You could use <a class="freelinking external" href="http://scalafont.com/specimen/" rel="nofollow">Scala</a> for body and Scala Sans(Bold) for headings. In case if you go on using Blur, then Times is a good choice. </p>
      <p>SB</p>
