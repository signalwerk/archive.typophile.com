      <p>Thanks for the suggestions. Hmm, I guess I didn't think about it like that, and it wasn't more or less me trying too hard but me wanting to have fun designing my resume - I'm still sticking to a grid layout. I have the Scala family so I may do two separate resumes and get my teachers to compare the two. They're all close to AIGA so they're opinion should be valid as well. Thanks! :)</p>
      <p>PS I actually usually stick to the more traditional typefaces which is why I had an interest in blur.</p>
