  html: |-
    <p>I have been racking my brain trying to think of the name of a particular type of mechanism used (mainly decades ago) for interactive children's books. It basically consists of a pull tab, which when pulled, reveals an image – however, the image is concealed in a sort of venetian blind way – sort of like outdoor billboards that change and have two sides (both sides of the image are sliced into thin strips which can rotate and reveal etc)</p>
    <p>...so, any ideas?!</p>
