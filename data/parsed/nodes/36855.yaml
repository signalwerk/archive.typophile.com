      <p>But the coffee grinder is really essential. And of course the coffee, which I think has to be tested with the machine. There are huge differences how the same coffee tastes when brewed with a different machine. With Bialetti Brikka e.g. 100% Arabica coffee is too subtle. And the coffee shouldn't be too old. At the moment I use an indonesian mixture called "sulawesi kalossi", freshly roasted by the coffee bar in town, mhm ...</p>
