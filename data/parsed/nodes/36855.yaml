    html: |-
      <p>It's only from a purist's view and it's based on the steam developed while brewing coffee:<br>
      "Common" Bialettis produce a beverage called "mokka", with Brikka it's a bit different because of the special valve. Here the steam is accumulating until the vapor pressure has reached 6 bar. Big espresso machines generally reach more (ca. 10) bar, which results in a better "crema".<br>
      To complicate things even more: oriental coffee brewed in a little pitcher (boiled up 3 times, with lots of sugar and a little cardamom, no accumulating of steam) is also called mokka.</p>
