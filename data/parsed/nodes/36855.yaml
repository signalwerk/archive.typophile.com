      <p>I use the Melitta one-cup drip cone too, like James. I work at home and have a tiny kitchen. If I had more counter space I'd get an espresso machine - there's a Krups a friend has that I like. I hate old coffee so whatever I use it has to be made fresh. Don't like the french press because it gets grainy.</p>
