      <p>Regarding the aeropress—yes, I have one and it’s excellent. I’d highly recommend it, though it takes some calibration before you get the timing and proportions right. But once you get your routine, it makes great Moka-type espresso. I sometimes dilute it to make Americano.</p>
      <p>I used to use a <a class="freelinking-external" href="http://chemexcoffeemaker.com/">Chemex manual drip coffeemaker</a>. Now I just use the Aeropress (and a French press when I’m in the mood for unfiltered coffee). Although the Chemex makes better drip coffee than any automatic drip machine I’ve had, it’s still drip coffee. I prefer a small, strong cup of coffee (or espresso) to a weak pitcher of drip coffee.</p>
      <p>Fresh-roasted beans make a huge difference, as long as you grind them just before you make the coffee. There’s no comparison between beans roasted yesterday and beans roasted 6 months ago (that “expire” in another year). Check with a local independent coffee shop: they probably buy their beans from someone local.</p>
