      <p>I use a <a class="freelinking-external" href="http://www.aktie-online.nl/images/843410.jpg">Philips Coffee Gourmet</a> machine, because it actually boils the water before it touches the coffee grind. A lot of coffee machines don’t do that, they just make it warm-ish. This is for very good coffee. If I want a quick, but still fairly good coffee, I use a  <a class="freelinking-external" href="http://www.dejuistekeus.nl/images/philips_hdsenseotitanium.jpg">Philips Senseo</a> machine with coffee-pads.<br>
      But as long as the machine boils the water, the beans or grind are important as well.</p>
