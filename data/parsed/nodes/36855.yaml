      <p>I’ve got two old reliables . . .</p>
      <p>1) Jura-Capresso Z6 Super Automatic (got a nice license deal and decided to treat myself) - Loaded with Starbucks Espresso blend of half regular and half decaf - Tip: Buy Starbucks beans only from Starbucks free standing stores, not in Target Starbucks, the beans are drownding in oils to further preserve shelf life at retail chains.</p>
      <p>Machine is mostly used for Cappucinos and Americanos (and Frothed Milk + NesQuick for Hot Cocoa for the Kiddos)</p>
      <p>2) Starbucks Barista Thermal Mug Machine - When I’m in the mood for good old fashioned drip, this machine honestly makes better coffee than my Krups and keeps it hot right in the mug it drips in for like half the day. Also, Starbucks House Blend or Breakfast Blend.</p>
      <p>It should be noted we have acquired a near collection of coffee machines ranging from 1950s percolators to vacuum pots to Senseo and so fourth . . . I worked at Gloria Jeans during my college years and became a coffee snob once I knew better . . . BTW, there is no finer coffee on a week long fishing trip in Canada than propane fired perk with the grounds sunk at the bottom . . . It’s horrible and I love it!</p>
      <p>Of course my reply is going on but there is something so very simple and complex about coffee machines that is just appealing to me in a gadgety way. It’s just steeping near boiling water over ground beans but like toasters or mouse traps, there are like a billion ways to do it . . . I’m always pleased with new ideas on a very old process . . .</p>
      <p>Stuart :D</p>
