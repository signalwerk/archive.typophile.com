      <p>Chris: <em>What do you French Press users do about the “silt” that is left in the coffee? I personally don’t like it, have tried pouring it through a filter, which takes way too much time.</em></p>
      <p>For French press coffee, you want a very coarse grind to prevent small bits of coffee grounds getting through the press filter. Blade grinders are ideal for this (in fact, it’s the only thing they’re good for: they don’t grind nearly fine enough for espresso or moka (e.g. Turkish coffee)). I give one short burst on a blade grinder for each spoonful of coffee beans (usually five for a full-size pot): that breaks the coffee up enough to release the flavour, but not enough to produce much ’silt’. There will always be a small amount of powder, no matter how coarse the grind, but that shouldn’t bother you.</p>
      <p>Mind you, I like Turkish coffee, so finding a small mudslide in the bottom of my cup isn’t an issue.</p>
    html_clean: |-
