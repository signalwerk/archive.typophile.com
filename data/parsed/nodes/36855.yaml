      <p>At home I have a pretty crappy drip machine with a hotplate that will burn the coffee if you leave it in the pot for too long. But then, I also use Maxwell House in it, so it doesn’t much matter. </p>
      <p>My other coffee-makers are: one of those tiny stove top things — but now that I no longer have a gas stove it’s not so great — and a Bodum French press which I really like, but am terribly lazy about cleaning out afterwards. In the Bodum I use good coffee. My more recent forays have been “Kick Ass” made by Kicking Horse, which is fair trade.</p>
      <p>I like my coffee overly strong, and I have no problem with the silt. If it’s not there I sorta think something’s missing. My inlaws make incredibly weak (coloured water) coffee. Something like half a spoon of coffee for every two cups. Ew. I always have to remember when they visit to make it “their way”. When they’re over I make two pots — the maxwell house crap and my bodum. </p>
      <p>At work, I have no desk space, but I tried one of those one cup drip machines. Problem was it splattered, and made such a mess. Communal coffee pots just don’t work in our office — I even have problems even keeping a small carton of cream in the fridge. It either spoils or gets finished by other people (thieves!). So it’s downstairs to Timmy’s Ho for me, twice a day. I’ve actually grown to like it. Somehow it fits the work environment just so well. Every once in a while I get a paper cup that is leaking at the seam, and it makes the morning all the more enjoyable. ;)</p>
