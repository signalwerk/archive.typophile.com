      <p>Braun Coffeemaker<br>
      (I have the Aromaster KF420 which they don’t make any more. It brews great coffee and is an ergonomic marvel.) Get an inexpensive 10 cup: it’s better to brew fresh coffee more often than to drink old muddy coffee. As with any coffeemaker, turn it off after it finishes brewing, unless you want your coffee cooked and bitter. Reheat leftover cups in a microwave. New Braun 10 cup model KF510 in white or black, $30 at <a href="/wiki/%252Bhttp%25253A%25252F%25252Fwww.amazon.com%25252FBraun-KF510-WH-AromaDeluxe-10-Cup-Coffeemaker%25252Fdp%25252FB00006JL0A" class="wiki-create">Amazon (White only)</a>with free shipping. ($35-50 elsewhere)</p>
      <p>Krups 203 Coffee Grinder (in white or black); about $20<br>
      Works great; other grinders make a mess.</p>
      <p>Try Kenya AA (“excellent body, heady aroma, very little bitterness”) or Ethiopian Yirgacheffe  (“distinctive floral bouquet, rich body, a pleasingly fragrant aroma, with a smooth mellowness”) if you haven’t already. Best coffee prices online are at <a class="freelinking-external" href="http://www.freshcoffee.net">California Coffee Roasters.</a> A five pound bag is $30 + shipping.</p>
