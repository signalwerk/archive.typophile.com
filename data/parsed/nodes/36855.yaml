      <p>Too true. I share a beach house with a finicky couple who have polar opposite taste in coffee. She likes hers dark and strong and he likes his to taste like it came from a diner (ick). So we need two machines, two different coffees. Her coffee is understandably more popular although at times it tastes like it can take the paint off your car. Then there's a third guy in the house who inexplicably likes his coffee made in a percolator. This ups the ante to three machines. It's absurd. If we had to license our coffee per machine like fonts we'd be paying thru the nose ;-)</p>
