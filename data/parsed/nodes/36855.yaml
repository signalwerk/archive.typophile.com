      <p>This is a very interesting subject. At my desk I have a Senseo coffee pod machine. Not bad, not great.</p>
      <p>In the studio we have the Keurig k-cup system. Better, but still not great. I have chosen to use the Keurig system because I have found a distributor that sells a 25-serving box of Jet Fuel by Coffee People $10.95. Keeps me from spending $$$$ at the local coffee shop (It’s a Grind).</p>
      <p>However, I spoke with a kind gentleman at Peet’s Coffee. I wanted to intall the Miele espresso machine with warming drawer in my home. I love the beautiful lines and would hate to have yet another appliance sitting on my countertop. He informed me to stay away from the Swiss and German espresso machines. (Breaks my heart as I am of 100% German/Swiss descent) He gave me this list of names for great coffee makers:<br>
      Gaggia<br>
      La Marzocco<br>
      Livia<br>
      La Pavoni<br>
      (all Italian brands)</p>
      <p>If you’re really a coffee snob, you would do the French press route with extremely cold filtered water, freshly ground beans, heat the water to the precise temp, brew the coffee for the required time period, plunge enjoy. Then there are some that would say the remaining coffee is too bitter because it is still technically brewing and won’t be the same as the first cup.</p>
    html_clean: |-
