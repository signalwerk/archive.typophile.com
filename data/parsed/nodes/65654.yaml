      <p>Most publishers have style guides specifying how to handle reference notes and citations. You should follow these. If you are publishing yourself, then you might choose to make use of a respected general style guide. </p>
      <p>In the U.S., the <em>Chicago Manual of Style</em> is often followed. Not sure what the equivalent is in the U.K.</p>
      <p><em>CMoS</em>, 15th ed., gives this guidance: “§16.33 Multiple citation. A note that applies to more than one location should be cross-referenced; a note number cannot reappear out of sequence.”</p>
