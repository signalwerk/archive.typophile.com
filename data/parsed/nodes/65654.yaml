      <p>Writing as someone working for a UK academic journals publisher, my two-cents’-worth is that we acquired some journals that did that “18. See note 3 above” thing, and hated it. It’s a waste of space in the reference list, and looks dumb. If that work is cited twenty times, do we want nineteen identical references all saying refer to item 3? Yuck. For all our other journals (at least those using some variant of Vancouver references, rather than Harvard), we’d just repeat the ‘3’ cue number at each citation, as Theunis says. But then, being non-US, we don’t have to jump when Chicago says jump. ;-) </p>
      <p>Kent, I guess the nearest UK equivalent would be something like the <em>Oxford Guide to Style</em> (or <em>New Hart’s Rules</em>, which is much the same thing); they’re my usual first port of call on style issues.</p>
      <p>Hm, wonder why the &lt;sup&gt; tag isn’t allowed here...?<br>
      ______________________________________________<br>
      Ever since I chose to block pop-ups, my toaster’s stopped working.</p>
