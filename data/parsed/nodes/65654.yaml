    <p>Hi,</p>
    <p>I’m working on a project at the moment that features a lot of references. However, I’m really restricted on space and I was hoping to save as much of it as possible.</p>
    <p>There are a few references that are repeated, so I was wondering what the rules are for using the same reference indicator throughout for the same reference. It seems logical and fine to me, but I never know if I’m breaking some age-old cardinal sin by doing such things.</p>
    <p>For example the text would look like this (references are in parenthesis as I can’t get superscript in web forms like this):</p>
    <p><cite>Tony Blair said on the 25th February 2003 that “The purpose in our acting is disarmament”(8) when justifying the UK’s involvement in the Iraq war. Since then it has become clear from leaked memos (which can be found on government websites) and evidence given to the Chilcott inquiry that Tony Blair’s real reason for the invasion was regime change,(9) which is illegal under international law. If Tony Blair took the UK to war knowing that the reason behind his decision was regime change in allegiance with the USA then he is an architect of an illegal war that has seen 100’000 Iraqi civilians dead as well as 179 British troops killed there since 2003.(8) </cite></p>
    <p>Is that ok or should I keep the indicators progressing and repeat the references in the list at the end?</p>
    <p>Any help on this would be gratefully received as always.</p>
    <p>Thanks</p>
    <p>Jono </p>
    <p>(all text copyright Jono Lewarne 2009!)</p>
