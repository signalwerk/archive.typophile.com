      <p>I do note (a pun!) a possible source for the confusion between the two standard lists at the end of a journal article.</p>
      <p>Jono <em>describes</em> a reference from a full reference list, which may be referred to in any number of ways (de Jong, 2009). Or [1]. Or (2), which, by the way, may be confused with (1) an inline, (2) enumerated, (3) list of statements. But as he said, there seems to be a lack of space and an abundance of references, which leads to another possible way of referring.²</p>
      <p>This ought not be confused with endnotes. Endnotes should always appear consecutively, in their logical order. It <em>is</em> possible to put references into endnotes, but then you are bound by their nature.</p>
      <p>From his wording, I understood Jono to have a regular references list at the end of each article, enumerated rather than called upon by name, and if so, there is no harm in repeating and out-of-order numbers. However, as <em>usually</em> superscript numbers denote notes, it might be confusing for the reader, and I’d personally advise against these and use square brackets.</p>
