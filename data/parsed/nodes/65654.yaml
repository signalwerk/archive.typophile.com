    html: |-
      <p><em>Writing as someone working for a UK academic journals publisher, my two-cents’-worth is that we acquired some journals that did that “18. See note 3 above” thing, and hated it. It’s a waste of space in the reference list, and looks dumb. If that work is cited twenty times, do we want nineteen identical references all saying refer to item 3?</em></p>
      <p>It has its disadvantages, but also its advantages in some texts. For example, if I’m writing an article referencing another article I might want to cite a note in that article by number. Or if I’m discussing a text with students, it would be handy to be able to refer to citations by unique number.<br>
      In the academic writing with which I’m most familiar, most notes will include specific page numbers (or additional information) which won’t likely be the same for every reference made by the text.<br>
      Additionally, though I acknowledge the reptition may seem wasteful, it can be handy to get a sense of the proportion of reliance on a given source for information backing up an argument, which would be less obvious if references kept directing back to a single note. </p>
      <p>I won’t necessarily go to the mat defending all US academic formatting practices - there is a much about them that is annoying or illogical - but in this case I appreciate the usefulness of consecutively numbered references. </p>
      <p>EDIT: I wrote all that before I carefully read Theunis’s post, which makes a helpful distinction.</p>
