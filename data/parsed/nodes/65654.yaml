      <p>Hi guys,</p>
      <p>Seems I’ve started quite a debate here. What I should have said is that this is not an academic project referencing journals etc, and that it is indeed style-it-yourself. However, it will be entered into an ISTD competition so I want it to be spot on typographically. I’m mostly referencing online news stories and newspaper articles so quoting the authors name and year in brackets wouldn’t really work as a fair few of the articles are written anonymously on news websites. </p>
      <p>I think I’m going to go with superscripted numbers in consecutive order as it looks neatest and seems to be quite conventional. There are only a couple of references that are repeated so using a system where it was ’See 3’ for repeated references doesn’t look bad at all, it just uses a little more space than usual, but I’ve found a way around that now anyway so it’s all good.</p>
      <p>Thanks for your help on this guys.</p>
