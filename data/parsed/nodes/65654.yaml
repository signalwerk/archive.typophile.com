      <p>If Jono’s extract reflects the actual subject matter of the project in question, I’d certainly second what Theunis said about “any number of ways (de Jong, 2009)” – which would end with references listed alphabetically by author (the Harvard style); it does make it easier to cite specific pages, notes etc (Williams, 2009: 18–20; de Jong, 2009: n3), and is popular in social-science subjects (we certainly use it on our politics titles). </p>
      <p>Indeed the numbered Vancouver style <em>does</em> mean you have to be very careful with reference marks if there are to be both references and notes. (Not sure about “<em>usually</em> superscript numbers denote notes”, but I can only speak from the publications I actually see day-to-day of course...)</p>
      <p>So assuming Jono’s project is entirely style-it-yourself (rather than needing to conform to someone else’s pre-set style), the practical answer is to use whatever best suits the length of the document, number of references, number of multiple citations, number of other-note-types, and space constraints, so long as it’s obvious to the reader what’s going on.<br>
