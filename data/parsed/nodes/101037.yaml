      <p>A bit of info on Brush Script from <a class="freelinking external" href="http://books.google.com/books?id=BYjgAAAAMAAJ" rel="nofollow">American Metal Typefaces of the Twentieth Century</a>:</p>
      <blockquote><p>...designed in 1942 by Robert E. Smith as one of ATF's group of contemporary scripts, intended to replace designs from the early part of the century. This one has a handlettered, freely-drawn appearance, with the letters joined skillfully so the connections are not obvious. The availability of the face on Monotype mats has given it a much greater range of popularity and usefulness. A heavier weight was projected but not completed.</p></blockquote>
      <p>Other ATF fonts in that group include Brody (Harold Broderson, 1953) and Repro Script (Jerry Mullen, 1953), the latter described as "another of the foundry's attempts to replace its delicate old traditional scripts with contemporary faces."</p>
      <p><a class="freelinking external" href="http://books.google.com/books?id=alglQxkHi-wC" rel="nofollow">American Type Design &amp; Designers</a> mentions that Smith worked with ATF from 1933 to 1942 and was the art director of the New York World's Fair in 1939.</p>
