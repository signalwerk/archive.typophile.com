    <p>Hi All,</p>
    <p>I am looking for information about the designer Robert E. Smith and the designing process of his typography Brush Script, created in 1942 for the American Type Founders (ATF).</p>
    <p>The only relevant thing I have found is that he designed the mentioned font and another one calles Park Avenue. In the internet or in books, there is not much information about Brush Script besides stating it was a landmark for Script typographies along with Mistral. </p>
    <p>Best,</p>
    <p>--<br>
    CFCG</p>
