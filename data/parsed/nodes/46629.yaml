      <p><cite>I’ll also concur with Nick regarding the use of condensed or extended type in the featured spot here on Typophile. It doesn’t make good sense to me.</cite></p>
      <p>Sometimes we do this intentionally. Of course, we think about the context and the quality of the design, whether or not it would make sense to use it on Typophile. However, it is also a unique opportunity to be playful and expressive through a variety of styles. </p>
      <p>Plus it causes controversy amongst the community and makes for interesting discussions :)</p>
      <p><cite>It was suggested that the point of the ’featured faces’ is to have feedback and I don’t think that’s the case.</cite></p>
      <p>Not necessarily. The intent is to show off type. Particularly, the designs of this community, the work that so many of you put blood, sweat and tears into. The fact that the Typophile community is seeing them, criticizing them, using them even, is a huge benefit for everyone. We encourage this kind of discussion, after all that is why Typophile exists. Ultimately, these designs will undergo the critical eyes of all Typophiles, something I'd be nervous about :)</p>
