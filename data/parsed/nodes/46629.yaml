      <p>From the Veer site...</p>
      <p><em>About this typeface:</em></p>
      <p>Doublewide is an informal sans serif with lots of character, designed to withstand several percentage points of stretching either wider or narrower. Though it was designed as a display face, it can be useful for callouts and subheads as well. Doublewide is available in four weights: Bold, Medium, Regular, and Light with corresponding obliques.</p>
      <p>About the designer:</p>
      <p>Christian Robertson designed his first digital font in 1986 when he was in the fifth grade. It was aptly titled ‘Christian’. Since that first encounter with ResEdit, he has spent thousands of hours in the blue glow of the monitor tweaking type. When he’s not drawing type, Christian works designing/programming interfaces as a Senior Media Designer at <strong>Punchcut</strong> in San Francisco. Christian also operates Betatype, an independent, one-man type foundry. Betatype offers custom type design services as well as commercial fonts.</p>
      <p>This package contains:</p>
      <p>Doublewide Light, Light Italic, Regular, Italic, Medium, Medium Italic, Bold, Bold Italic</p>
      <p>Copyright © Christian Robertson / Betatype</p>
      <p>Not suggesting your typophile account may start to get glitchy - but, you never know.</p>
