      <p>I'm going to go out on a limb here and defend David the poster. What is the point of having and changing a featured face if not to get some feedback and opinion about it? Frankly, it's the folks who got so excited about the opportunity to politely and righteously tell David to keep his subjective opinions to himself that...ah, nevermind. What the rule here? Don't offer an opinion that might hurt someone's feelings? Sorry, but that kind of dialogue makes me sick.</p>
      <p>Maybe every weight of Doublewide isn't ugly, but the extra bold most definitely looks "squooshed," or, more technically, ridiculously extended, and that's the featured typeface. According to Veer's marketing: "lots of character." What a stupid way to talk about type. Someone define "character" for me and tell me what gives one typeface more character than another. Are they talking about character like a John Candy character, as in big, fat, and silly?" If that's the case, then yes, this typeface has lots of character. But there are so many different kinds of character. </p>
      <p>I'll also concur with Nick regarding the use of  condensed or extended type in the featured spot here on Typophile. It doesn't make good sense to me.</p>
