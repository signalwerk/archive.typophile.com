      <p>"The English love an insult. It's their only test of a man's sincerity." </p>
      <p>--Benjamin Franklin.</p>
      <p>That's a quote from the recent "John Adams" HBO biography film. I assume it's authentic, because I recognize a lot of the other dialogue as quotes from Franklin. </p>
      <p>As a five year student of English manners, when I was there in London at the LSE, I can attest that this love of insult has survived the intervening 200 years. English manners are at once more civil and more rude than American manners. --Or is it civil and rude in different ways?</p>
      <p>Englishmen--and I am writing of men here--as a rule wouldn't dream of asking you a possibly embarrassing personal question, or even volunteering personal information. But many will take pleasure in insulting your politics, religion, abilities, nation or ethnic group at the earliest opportunity. And they expect it back. It was once called good natured "raillery". I admit I still don't quite get it.</p>
