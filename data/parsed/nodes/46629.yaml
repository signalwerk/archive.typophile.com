      <p>Chris, it is not that one is more rude than the other, but that the English and Americans are rude in different ways. </p>
      <p>National characteristics are very tricky to talk about, because very many--perhaps even most--people in a country don't fit the stereotypes. But it is equally true that these characteristics are very real and striking to anyone who spends time in another country. </p>
      <p>In the case of Simon Cowl, vicious criticism is not at all unusual for those in the record business. The English flavor is that he finds his own viciousness highly amusing, and expects you to, because he views it as part of the 'raillery' game. You may agree or not about his being witty, but that is the twist. </p>
      <p>I don't approve of any variety of rudeness, but I confess that I can it amusing when I dislike the victim of the attack. I'm way less amused when I am the target :)</p>
