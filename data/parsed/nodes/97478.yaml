      <p>Perhaps the main notable thing about Caslon's types is their very high degree of inconsistency (which some people see as warm, and others -including myself- as sloppy). Speaking of the "Q", it's especially notable in the Italic, where it undergoes dramatic <em>topological</em> changes depending on point size; see this old post<br>
      <a href="http://typophile.com/node/13420#comment-77833" title="http://typophile.com/node/13420#comment-77833">http://typophile.com/node/13420#comment-77833</a><br>
      including the image link.</p>
      <p>hhp</p>
