    html: |-
      <p>Hey, I think those two “l“‘s appear different because I spilled silk screen washing chemicals on my source art and the type got distorted when the image dried.</p>
      <p>If you look at other characters on the recto side such as “e”, “r”,”n”, “s”, and “a” they appear the same throughout, plus or minus spacing. Look at “Manu Dibango” and “Mamba Percussion”. Also look at the numberals.  Those letter forms are more similar than unique.  This is clear when looking at the type with a magnification lense.</p>
      <p>The irregularity is mostly because my source art is warped.</p>
      <p>I think the quest to ID this typeface is still on.</p>
      <p>Thanks for your input Patty Fab(ulouso)!</p>
      <p>Bookie</p>
