    html: |-
      <p>The reason people think it’s hand-lettered (and I still do) is that the characters are not consistent. It is possible that the entire thing was done by hand.</p>
      <p>Look at the two l’s in collection for example.</p>
      <p>It’s also possible that someone typeset this initially using an existing font and then traced over it by hand to get the rough effect.</p>
