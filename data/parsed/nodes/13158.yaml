    <p>I found my CD.  its been through hell and back, so bare with the image.<br>
    According to last thread (Funky Courier Similar to Rough) many users thought the type was hand lettered.</p>
    <p>I don’t think the type is hand lettered because the type is used in the liner notes fairly frequently.  So lets take another stab at it.</p>
    <p>This time with better photo reference.</p>
