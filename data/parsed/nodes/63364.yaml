      <p>I remember discussing this and when I did a search for 'wired" <a href="http://typophile.com/node/60752" rel="nofollow">Node 60752</a> popped up first. Some of the type at the time was a custom typeface called <a href="http://www.typography.com/fonts/font_overview.php?productLineID=100035&amp;affiliateID=33" rel="nofollow">Tungsten </a> from H&amp;FJ but that was just released last month.</p>
      <p>Here is a cover image for good measure.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/wired-cover_4417.jpg"></div><p></p>
