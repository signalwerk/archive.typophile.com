    <p>Hi everyone,</p>
    <p>I did search for this in the forum, but couldn't locate it.</p>
    <p>Does anyone know the typeface used for "WIRED" magazines masthead and body and headings?</p>
    <p>The masthead looks like mix of sans serif and a slab/humanist/geometric</p>
    <p>Any help would well....help!!</p>
    <p>Simon</p>
