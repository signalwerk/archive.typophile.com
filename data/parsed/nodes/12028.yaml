    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/12038" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Terminology</a>&nbsp;:&nbsp;x-height</strong></p>
    <p>Succinctly put, the x-height is the height of the <a href="/node/13807" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">lowercase</a> x in a given&nbsp;alphabet.</p>
    <p>In the past x-height was stated by some as a proportion of the <a href="/node/20273" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">cap height</a>. In digital fonts, the x-height is specified in the font as a proportion of the <a href="/node/13761" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Em</a>, typically with 1000 or 2048 units to the Em. Additionally, many typographers state the x-height as a proportion of the total vertical span of the lowercase, often limited to simply the ascender height. This practice is based on the realization that lowercase letters constitute approximately 95% of&nbsp;text.</p>
    <p>Many regard the relative x-height of a given typeface as a factor in readability, believing that a larger x-height better accentuates the distinguishing characteristics of the lowercase letters simply because the main body of the letters are larger. For this reason it is a commonly held notion that smaller x-heights are better reserved for <a href="/node/add/wiki?edit%5Btitle%5D=display%20type" title="Create node &quot;display type&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">display type</a> where an enlarged size compensates for diminished readability. On the other hand, because reading is quite heavily dependent on the overall shape of the word, especially the top “edge”, if x-height is very big the contrast between ascenders and the body of letters tends to be reduced, making text harder to read for longer periods. (Just as lines set in all capitals are generally regarded as difficult for extended reading.) Larger x-heights may also require more leading at a given point size for good&nbsp;readability. </p>
    <p><strong>Discussion:</strong><br><a href="http://typophile.com/node/31427">Large x-heights = More&nbsp;Readable?</a></p>
