    <p>Hey all,</p>
    <p>So, I’m having trouble previewing a few fonts with Font Agent Pro - Mac OSX.</p>
    <p>Instead of displaying the proper typeface when previewed, they appear as a generic san-serif font which is incorrect. The pattern seams to happen most often with True Type fonts. The Font cache has been cleared and F.A.P. reinstalled a number of times on my machine but still the problem persists.</p>
    <p>The strangest thing is that once these troubled fonts are activated they function fine in other applications. They also preview fine in OSX’s FontBook. It’s only when trying to preview from F.A.P. it becomes an issue. I contact F.A.P’s Tech support and went through there suggested fixes but the problem still persists.</p>
    <p>Has anyone experienced this or know of a possible solution?</p>
    <p>Any help is much appreciated!</p>
