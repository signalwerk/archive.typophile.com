      <p>I like it it. I don't know exactly what they're on about but it sounds good to me. Just because we have the time and the paint doesn't mean we need to decorate our caves. Should we design because it's good? Because we just should? Should we consider the option of not designing? Maybe there are times when it's better not to. Maybe our eyes need a break from design. </p>
      <p>I escape from design nightly. I've got interfaces on my phone, my iPod, my TV, my DVD players, my media box, my Wii, my DS, GPS. Every web site is a new interface. But when I catch up on my favorite sites, I do it through an RSS reader. No matter how a site is designed, it's all the same Helvetica on a white background to me. Sure, I'm on a sofa that was designed using an iPod that was designed with and app that was designed. But I'm insulated from the design on those 100 or so sites that I visit. I don't experience 100 different color schemes. 100 different menus. 100 different layouts. There's a case where I think eliminating design is good. Maybe it's not the same as what they're talking about but I think I understand the desire to think critically about whether or not design is needed in every situation.</p>
      <p>Oh wait. This won't help me sell more fonts. I meant to say "fuck you, anti-design!"</p>
