      <p>The anti-London Design Festival festival logo reads as being anti-design, rather than anti-corporate or pro-creativity. So now we all spend time bickering about that instead of thinking about the message.</p>
      <p>I'm so tired of these periodic "manifestos" from graphic designers. Don't lecture people about consumption and technology with a superior tone. "We have exchanged freedom for peace. What we need is Liberation." What? Liberation? From what? Creative habits? Are we gearing up for the next deconstructivist, anti-legibility movement in design that can be used sell <a href="http://ericking.tv/wp-content/uploads/2008/10/pepsibottle.gif" rel="nofollow">Pepsi</a>? Graphic design has its mouth open beneath the spigots of commerce. It's how we buy all of our nice stuff. It's what we use to fund our other work. Some of the biggest names on that list have served large corporate clients.</p>
      <p>Take the nine days for creative release and refreshing. I bet it will be fantastic. Lord knows we could all use a bit of that from time to time. And I love and respect the work of many of the names associated with this event. But *please* stop turning these things into something more than they are. It's an art and design event sponsored by a <a href="http://www.londonewcastle.co.uk/#/about_us/what_we_do" rel="nofollow">residential developer in London</a>.</p>
      <p>And by the way, kern your g--damn type.</p>
