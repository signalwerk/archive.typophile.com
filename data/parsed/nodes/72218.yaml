      <p>I would submit that failing to kern a "VA" pair on a website banner is <em>not</em> progress in art. It is not a Dangerous Idea nor a thaw from the Deep Freeze. It is not Freedom from Freedom, and it is not Liberation (on a side note, does making proper nouns out of your own lingo make it more effective?).</p>
      <p>Just my two cents....</p>
      <p>EDIT:</p>
      <p><em>Maybe it's not the same as what they're talking about but I think I understand the desire to think critically about whether or not design is needed in every situation.</em></p>
      <p>But isn't the conclusion that "design" is unnecessary in a given situation a design decision in and of itself?</p>
