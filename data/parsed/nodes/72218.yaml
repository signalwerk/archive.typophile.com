      <p><em>Art for art’s sake was sacrificed for entertainment and bums on seats. Ideas became cliches and anything different was viewed with suspicion and disdain.</em></p>
      <p>Where is it written that we can't have "art for art's sake?" Anyone can make art for art's sake—just don't expect it to sell! What, they want me to pay money (or complments) for art that I don't like just because the "artist" is absolutely enamored with it, and it's brimming with emotional significance for him? Somehow I get the feeling that kind of art wouldn't make it far even in the "anti-design festival." There's a place for that kind of "art:" next to the grocery list on his parents' fridge.</p>
      <p>And since when does commercialism or capitalism regard things that are different as bad? I come from a film background, not a graphics background, so my examples are only tangentially relevant, but I'd like to point out that 3D animation (even animation in general) is very much new and different. Films like <em>Toy Story</em>, <em>UP</em>, <em>The Incredibles</em>, and <em>WALL-E</em> didn't earn near-unanimous popular and critical acclaim for being the same as everything else—it was being different that made them competitive! If anything, consumerism <em>rewards</em> artists who dare to be different. </p>
      <p>Why else do we have positive connotations with words or phrases like "visionary," "groundbreaking," or "defies convention?"</p>
      <p>My philosophy is that, as artists (who intend to create art as a living, not as a hobby), we get paid to make things for people that they find beautiful (or thought-provoking, or meaningful). To successfully and truly defy convention in art is not to reject what we already know to be beautiful, but rather to create something nobody before knew was beautiful. And many times, it's more the case that someone once, found it to be beautiful, and the artist is merely reminding us.</p>
      <p>I would submit that failing to kern a "VA" pair on a website banner is <em>not</em> progress in art. It is not a Dangerous Idea nor a thaw from the Deep Freeze. It is not Freedom from Freedom, and it is not Liberation (on a side note, does making proper nouns out of your own lingo make it more effective?).</p>
      <p>Just my two cents....</p>
      <p>EDIT:</p>
      <p><em>Maybe it's not the same as what they're talking about but I think I understand the desire to think critically about whether or not design is needed in every situation.</em></p>
      <p>But isn't the conclusion that "design" is unnecessary in a given situation a design decision in and of itself?</p>
