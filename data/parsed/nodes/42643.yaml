      <p>Ladies and gentlemen,<br>
      may we present,<br>
      all new in 2007,<br>
      it's the <strong>Fat Font Fad!</strong> </p>
      <p>An '80s throwback, counter-filled, constructivist, geometric, sausage revue, starring:</p>
      <p><a href="https://web.archive.org/web/20191013111743/http://www.fontshop.com/fonts/singles/creative_alliance/black_boton_bold/?affid=99346">Black Boton Bold</a><br><a href="https://web.archive.org/web/20191013111743/http://www.neutura.org/Frank.html">Frank</a><br><a href="https://web.archive.org/web/20191013111743/http://www.neutura.org/Deuce.html">Deuce</a><br><a href="https://web.archive.org/web/20191013111743/http://www.fontsmith.com/fonts/">FS Pele</a><br><a href="https://web.archive.org/web/20191013111743/http://www.fontshop.com/fonts/downloads/mark_simonson/mostra_blk_one_two_three/">Mostra Black</a><br><a href="https://web.archive.org/web/20191013111743/http://www.fontshop.com/fonts/singles/creative_alliance/blocks/?sample_text=TOTALLY%20NU%20RAVE&amp;sample_size=36">Blocks</a><br><a href="https://web.archive.org/web/20191013111743/http://www.fontshop.com/fonts/singles/font_bureau/alpha_bloc_sculpture/?affid=99346">Alpha Bloc Sculpture</a><br><a href="https://web.archive.org/web/20191013111743/http://www.fontshop.com/fonts/downloads/fontfont/ff_extra/?affid=99346">FF Extra</a><br><a href="https://web.archive.org/web/20191013111743/http://www.fontshop.com/fonts/singles/paratype/unovis_regular_ot/?affid=99346">Unovis</a><br><a href="https://web.archive.org/web/20191013111743/http://www.neutura.org/Neutrino.html">Neutrino</a><br><a href="https://web.archive.org/web/20191013111743/http://lamosca.com/">Toch</a><br><a href="https://web.archive.org/web/20191013111743/http://www.neubauladen.com/catalogue/NB-Typografie/3/NBBlock%E2%84%A2/1310/1">NB Block</a><br><a href="https://web.archive.org/web/20191013111743/http://www.fontshop.com/fonts/downloads/device_fonts/acton/?affid=99346">Acton</a><br><a href="https://web.archive.org/web/20191013111743/http://www.paratype.com/pstore/default.asp?fcode=TM_BBT&amp;letter=B">Bebit</a> (Cyrillic version of Milton Glaser's Baby Teeth)<br><a href="https://web.archive.org/web/20191013111743/http://www.myfonts.com/fonts/jnl