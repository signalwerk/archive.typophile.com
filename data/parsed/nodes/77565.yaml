    <p>I’ve had this scan of a typeface from a Dover book (i think?) on my desktop for a while with the intention of learning Fontlab while digitizing it. From what I’ve read here this seems to be the best way to get “stuck in”.</p>
    <p>Here’s the scan.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/block-scan_4481.png"></div><p></p>
    <p>And here’s a pdf of my progress so far.</p>
    <p><a href="http://typophile.com/files/01-draft1.pdf" title="http://typophile.com/files/01-draft1.pdf">http://typophile.com/files/01-draft1.pdf</a></p>
    <p>Also if anybody knows if this typeface happens to exist somewhere I’d appreciate it. Like I said this was for learning purposes so I guess that would help to see where I’m going wrong. I was considering making it a freebie after I’m done if it doesn’t currently exist. </p>
    <p>I’ve been looking for a decent ‘how to’ guide for designing a typeface and Kris Sowersby’s article on I love typography is the best I could find. Any other suggestions are much appreciated. </p>
    <p>Thanks<br>
    Seán</p>
