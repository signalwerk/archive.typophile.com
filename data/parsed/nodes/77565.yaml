    html: |-
      <p>This sort of thing has been done a lot, so the thing that will sell it is what clever bits you put into it—the places you stray from the obvious solution.</p>
      <p>With that in mind, your /S/s/$/ is I think the strongest (as it appears in the image above; the pdf seems to be different). /H/ is an interesting solution, I wonder how it would perform in context... /A/ also really appeals to me, though there's nothing particularly new about it.</p>
      <p>The first thing I thought, though, was Yikes, that 7 is kooky. I see what you were going for, but it does not work. I think a sloped stem, somewhere in between that of the /Y/ and vertical, would be best.</p>
      <p>The flipped /W/ doesn't look good as an /M/. Try making a square version. What would it look like to take that /N/ and repeat that second part of it?</p>
      <p>The cuts making /b/d/g/h/m/n/p/q/ round-ish look kind of sloppy. For the /m/ and /n/, you can definitely take out the cuts sloping to the left and make those corners squared. That might not work as well on the others, but try it. It's just that that many small changes in direction 1)makes it look like just a rough curve from a distance and 2) kind of works against the whole idea of rigidity that the font is based on.</p>
      <p>........I just re-read your original post. I've been critiquing an old scan of somebody else's font, haven't I?</p>
