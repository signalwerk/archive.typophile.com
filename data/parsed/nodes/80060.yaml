    <p>I need help finding this font.</p>
    <p>I think it is called "Air Force", and there is a maple leaf glyph, so it is probably somehow associated with the Canadian Air Force.</p>
    <p>However, I can't seem to find anywhere to buy it online.<br>
    Searching for fonts with the keyword "air force" results in stencil fonts and airplane icons.</p>
    <p>Any help?</p>
    <img typeof="foaf:Image" class="img-responsive" src="http://www.typophile.com/sites/default/files/old-images/Picture%201_430.png" width="858" height="154" alt="">
