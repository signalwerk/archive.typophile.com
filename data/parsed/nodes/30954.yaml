    <p><a href="/wiki/Michael%20Abbink" class="freelinking" rel="nofollow">Michael Abbink</a> with <a href="/wiki/Paul%20van%20der%20Laan" class="freelinking" rel="nofollow">Paul van der Laan</a></p>
    <p>The initial work on FF Kievit occurred in 1995 as part of a school project and was finished several years later for a corporate client of Method Inc., a design firm in San Francisco. The openness of the characters and their proportions makes it an ideal typeface for use in small print. The clarity of classic sans serif faces (<a href="/wiki/Frutiger" class="freelinking" rel="nofollow">Frutiger</a> and <a href="/wiki/Univers" class="freelinking" rel="nofollow">Univers</a>) and the humanistic characteristics of old styles (<a href="/wiki/Garamond" class="freelinking" rel="nofollow">Garamond</a> and <a href="/wiki/Granjon" class="freelinking" rel="nofollow">Granjon</a>) were the inspiration for this contemporary design that is equally at home in a headline or a body of text. The FF Kievit family includes six weights, true italics, old style figures and small caps -- everything necessary for even the most demanding typography.</p>
