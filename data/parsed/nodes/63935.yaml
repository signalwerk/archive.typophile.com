    html: <p>I think the typeface is quite attractive, and the i doesn't need a tittle in my opinion, as it would ruin the pure look of it a bit (however, it would make it more dynamic, which is desired). I think the symbol is wonderful, but very cold indeed. I would probably use that symbol but add some sparkles around it in a dynamic composition (but don't make a sparkle-cloud), and change the color from emerald to orange/yellow, and position the symbol centered above the text.</p>
