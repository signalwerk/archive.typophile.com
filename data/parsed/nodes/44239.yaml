    <p>You can look at some Aldine letterforms here.</p>
    <p><a href="https://web.archive.org/web/20080907163341/http://www.flickr.com/photos/ebensorkin/sets/72157604543193589/" title="http://www.flickr.com/photos/ebensorkin/sets/72157604543193589/">http://www.flickr.com/photos/ebensorkin/sets/72157604543193589/</a></p>
    <p>Here is a sample image:</p>
    <p> </p><div class="imageWrap"><img src="/web/20080907163341im_/http://www.typophile.com/files/Quint_5050.jpg"></div><p></p>
    <p>I will be posting more from other books soon. </p>
    <p>This is, like the Jenson thread part of my attempt to learn what foundries did or did not have multiple sorts (versions) for certain letters and if they did if they used them in a deliberate possibly contextual way. </p>
    <p>My investigation is far from complete but my impression is that in the case Aldus is that he did have multiple sorts and early on he used them in a more ( but not always) contextual way and later on he was perhaps less fussy.</p>
