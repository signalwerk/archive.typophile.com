  html: <p>Dear friends, <br> <br>He fills to me of joy to be able to communicate to them that the product of two years of arduous work in the area of design of bitmap typography has taken shape successfully, in the launching of the update of Atomic Media, in which they will find my first 12 fonts, available from today in images for his appreciation and commercial acquisition.  <br> <br>I Like to thank specially to Matthew Bardram &amp; the people of the Typophile Forums, for to each one you, who you comprise important of the process of this one particular project since my first pixel scketches.  <br> <br>Some of the first avalilable fonts start growing here, in the critique forums like Circa, Dotic, Minority and Fundamental.  <br> <br>Many people here are very talented, most of them are in the same chance to work as type designer in other foundries, i like to make a call to these foundries to take a look at them. <br> <br>The feedback support here is great, special thanks to all of you who make us learn and grow about type design everyday. <br> <br> <br>sincerely, <br> <br>Miguel Hern</p>
  html_clean: <p>Dear friends, <br> <br>He fills to me of joy to be able to communicate to them that the product of two years of arduous work in the area of design of bitmap typography has taken shape successfully, in the launching of the update of Atomic Media, in which they will find my first 12 fonts, available from today in images for his appreciation and commercial acquisition.  <br> <br>I Like to thank specially to Matthew Bardram &amp; the people of the Typophile Forums, for to each one you, who you comprise important of the process of this one particular project since my first pixel scketches.  <br> <br>Some of the first avalilable fonts start growing here, in the critique forums like Circa, Dotic, Minority and Fundamental.  <br> <br>Many people here are very talented, most of them are in the same chance to work as type designer in other foundries, i like to make a call to these foundries to take a look at them. <br> <br>The feedback support here is great, special thanks to all of you who make us learn and grow about type design everyday. <br> <br> <br>sincerely, <br> <br>Miguel Hern</p>
