    <p>FOR IMMEDIATE RELEASE<br>
    …………………………………………………………………………………………………….</p>
    <p>London 21 February 2007 – Kapitza Shop, a new online shop specialising in picture fonts and illustrations, releases the highly versatile graphic elements font Pop, designed for creating unlimited numbers of graphic patterns.</p>
    <p>Pop contains 320 graphic elements in 4 weights (Pop10, Pop20, Pop30, Pop40). Each Pop element of one weight fits on top of the other weights to create new variations. In addition to this all Pop elements can be combined with each other to create an unlimited number of patterns.</p>
    <p>Petra Kapitza, one half of the Kapitza partnership talks about the inspiration for Pop: ‘We have always been fascinated by patterns. Pop was inspired by the bold and colourful fashion textiles of the sixties and seventies, particularly by their graphic simplicity, bold colours and shapes. The result is nonetheless a very modern font which makes it easy to create an endless variety of patterns of all styles, both retro and contemporary.’</p>
    <p>POP PATTERNS<br>
    …………………………………………………………………………………………………….</p>
    <p>Pop is also available in a variety of ready made repeat patterns in vector eps format. These patterns can be opened by any major graphics software like Illustrator and Photoshop. They can be re-sized and coloured without any loss of quality.</p>
    <p>ABOUT KAPITZA SHOP<br>
    …………………………………………………………………………………………………….</p>
    <p>Kapitza Shop (<a href="http://kapitza.com/shop">http://kapitza.com/shop</a>) is a new online store specialising in picture fonts and illustrations created by design partnership Kapitza <a href="http://www.kapitza.com">http://www.kapitza.com</a>.</p>
    <p>Nicole Kapitza, one half of the partnership, gives her thoughts on Kapitza Shop: ‘Our objective for the shop is to create a source of inspiration for people as well as building up a continuously growing resource of high resolution picture fonts and illustrations for designers to use in their work.’</p>
    <p>Petra Kapitza continues: ‘We are really excited about how the Shop is beginning to grow. We only publish work that we think is of the highest quality and the feedback we have been getting from our customers has been really encouraging.’</p>
    <p>HOW TO ORDER<br>
    …………………………………………………………………………………………………….</p>
    <p>OpenType font for Mac and PC<br>
    Digital download<br>
    4 weights £49<br>
    <a href="http://kapitza.com/shop/fonts/pop">http://kapitza.com/shop/fonts/pop</a></p>
