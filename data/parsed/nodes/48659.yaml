      <p>hmmm, this doesn’t look like it came from Sloop at all.</p>
      <p>This one actually looks Custom, in other words, designed/drawn/built from scratch. In this case, it feels like it was done by hand, before it ended up on a T-shirt. It could be the handiwork of an LA artist/art director, Jose Soto.</p>
      <p>If it was indeed based on Sloop’s outlines (adding flourishes to an existing font) ... you could call it Customized, or you could call it a Type Treatment. </p>
      <p></p><div class="imageWrap"><img src="/files/todiefor_6120.jpg"></div><p></p>
      <p></p><div class="imageWrap"><img src="/files/sloop1_3460.jpg"></div><p></p>
