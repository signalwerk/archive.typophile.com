    html: "<p>Amusing. That reminds me of a conversation I've had about First Union's new identity: <br> <br>C: \"On the radio, they're always calling it 'the Wok.' It's been the Wachovia Center for barely a month and they're already trying to force a catchy nickname on it.\" <br>K: \"Wait, so it isn't Wa<b>ch</b>ovia?\" <br>C: \"No, it's pronounced Wa<b>k</b>ovia.\" <br>K: \"So, at Wachovia, they don't 'watch over ya.'\" (I had speculated earlier about whether they would have commercials saying this.) <br>C: \"No.\" <br>K: \"They <b>walk</b> over you.\" <br>C: \"I guess so.\" <br>K: \"So they're still The Bank That F.U.'s Back.\" <br>C: \"Pretty much.\"</p>"
