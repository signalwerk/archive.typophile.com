  html: "<p>Meet Ted. (No, I didn't say meat head.) <br> <br><img src=\"http://www.typophile.com/forums/messages/4100/20653.gif\" alt=\"\"> <br><a href=\"http://www.salon.com\" target=\"_blank\">Salon</a> features an article on <b><a href=\"http://www.salon.com/business/wire/2003/11/12/ted/index.html\" target=\"_blank\">Ted</a></b>, United's discount carrier. <br> <br>My initial reaction to this is with a jaded sense of skepticism toward a big, bankrupt airline -- even though I've had a good experience with United in my various travels with them. So, in trying to think past that and think about the branding issue at hand, here are my initial thoughts: <br> <br><b>The strategy is ripe because nobody likes the airline industry</b> <br>- The airline industry is full of unfeeling behemoths that fundamentally don't <i>get</i> customer service. Travelers are at the service and mercy of the airlines, when it should be the other way 'round. <br> <br>- A new airline has the opportunity to be more human, more approachable, and perhaps more irreverent in breaking through the bad stereotypes. <br> <br>- A new no-frills airline has to avoid seeming 'cheap' and by extension unsafe. Think ValueJet. You may remember ValueJet as the East coast carrier that, as a cost-cutting measure, put passengers at risk by shipping hazardous materials (strike one). Then, with a crash and ensuing passenger deaths (strike two) they're not around anymore. <br> <br>- Finally, we can't expect JetBlue and Southwest to be the only players in the no-frills market forever. <br> <br> <br><b>The execution is a missed opportunity</b> <br>If United wanted to copy the golden formula for JetBlue and Southwest, they missed a key ingredient. One of the key ingredients for JetBlue and Southwest is the low cost. But the reason people buy into flying Southwest and JetBlue is one part price and one part attitude. SW and JB have poked a proverbial stick in the eye of the airline industry. They've axed the class seating system (now all customers get the same good service) and they've dumped the chicken or beef mentality. <br> <br>Ted is too close to United to effectively be sold as an independent. Instead of benefitting from peoples' frustration with the big airlines, Ted is in danger of just being a little, obnoxious version of same. <br> <br>Think about this a second. With a no-frills version of United, should we expect the new cheaper flights <i>and</i> the same old planes? Should we expect limited destinations <i>and</i> the same crappy food? Do we get to have the first-come seating arrangement <i>and</i> that signature grumpy, \"and you are\" attitude from the 'service' staff? No thanks. <br> <br>They should have distanced themselves from the baggage of the airline industry as a whole and from United specifically. Southwest and JetBlue have done this successfully. Their ads are witty but they're careful not to  over-promise. It's because they don't readily fit the airline industry mold that they can credibly call themselves independent. <br> <br>I'm sure Ted wanted the best of both worlds. They want the appeal of a first-name basis and the independence that comes with being a little informal. Yet they hang on to the safety of not straying too far. With the name Ted and the big U mark on the tail, they've tried to infuse the airline with United's credibility, safety and on-time record. Instead, they're in danger of having strung United's dirty laundry from the tail. <br> <br>_____ <br><b>Disclaimer:</b> I know this is early to judge a new brand. Especially when all we've seen is a press release and the airplane livery. We'll know the full story when we fly Ted or deal with their site or watch their ads.</p>"
