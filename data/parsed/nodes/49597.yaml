      <p>I'm not certain, though I wouldn't be surprised if it was hand-lettering.<br>
      A few years back I had the opportunity to repackage the book the "Anatomy of a Murder" movie was based on. At the time, a design with <a href="http://images.google.com/imgres?imgurl=http://ecx.images-amazon.com/images/I/516H559HXKL._SL500_BO2,204,203,200_PIsitb-dp-500-arrow,TopRight,45,-64_OU01_AA240_SH20_.jpg&amp;imgrefurl=http://www.amazon.com/Anatomy-Murder-Robert-Traver/dp/0312033567&amp;h=240&amp;w=240&amp;sz=18&amp;hl=en&amp;start=14&amp;um=1&amp;usg=__qCGstDjzRmOkhFVlM9-OcWjhnPs=&amp;tbnid=pakdg6cy51D5SM:&amp;tbnh=110&amp;tbnw=110&amp;prev=/images%3Fq%3Danatomy%2Bof%2Ba%2Bmurder%2Bst.%2Bmartin%2527s%26um%3D1%26hl%3Den%26client%3Dsafari%26rls%3Den-us%26sa%3DN" rel="nofollow">no resemblance</a> to Saul Bass' iconic poster was in place. I pushed to revert back to using Saul Bass's iconic movie poster image <a href="http://www.designrelated.com/portfolio/Karen/page/6/entry/6587/" rel="nofollow">on the cover</a>. And when I needed to add the "#1 Bestseller" line I found the font <a href="http://www.myfonts.com/fonts/agfa/hatmaker/" rel="nofollow">Hatmaker</a> to be the closest match I could find at the time. Not perfect--but a similar feel. (And <a href="http://www3.isrl.uiuc.edu/~unsworth/courses/bestsellers/images/A1319980216130350.jpg" rel="nofollow">just for for fun</a> here is the package for the first edition of the book back in 1958)</p>
