      <div class="comment-spam-body"><blockquote><p>
      I've already used the alt-gr keys as a sort of compose key in my keyboard layout. Here's what I've been working on:</p>
      <p><a href="http://grant.org/mgrant/uscmpse/windows-compose-key.html" title="http://grant.org/mgrant/uscmpse/windows-compose-key.html">http://grant.org/mgrant/uscmpse/windows-compose-key.html</a></p>
      <p>The goal of my layout was to extend the US keyboard. All the original keys sequences are unchanged (including ctrl-keys). Everything that was added was with the addition of the alt-gr key.
      </p></blockquote>
      <p>I (finally!) added <code>Compose</code> key to <a class="freelinking external" href="http://k.ilyaz.org/iz/windows" rel="nofollow">my keyboard layout(s)</a>.  Now on Windows they have everything I wanted to have when I started this project 2 years ago. — But, of course, during these 2 years my goals have changed, and now, again, just a small fraction of what I want is implemented.  (But most of the infrastructure is there, so additions should be much easier now — I hope!)</p>
      <p>The code to count the number of available characters is broken by the updates of the recent months; I think that about 3⎖500 characters are accessible without <code>Compose</code>, and maybe a thousand more with.  The current state is summarized in <a class="freelinking external" href="http://math.berkeley.edu/~ilya/keyboard/iz/windows/izKeys-visual-maps.html#compose-key" rel="nofollow">the progress report section of the docs</a>.</p>
      <p>Now the major goals is to bring the docs up to an appropriate level, and fix all Windows applications with broken keyboard input handling (yes, <strong>ALL</strong> the applications I checked do it wrong; and, yes, I think I know the right way — which, of course, is not documented anywhere — or at least further than my Google-fu goes…).</p>
      </div>
