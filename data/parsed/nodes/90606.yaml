      <p>MSKLC is/has been a spare-time project by Michael Kaplan et al. at Microsoft (AFAIK); therefore it does not get a lot of maintenance. I think it is not possible to create a ‘smart’ keyboard like the Japanese one with the tool’s capabilities.<br>
      There is another editor called ‘KBDedit’, which definitely can do some more things; but I am not sure if you can go as far even with that one.</p>
      <p>In fact, the idea a keyboard with a lot of alternative characters idea is quite widespread; multiple shift states come with every Mac keyboard layout (for accessing lower-use characters like † … £ ¢ etc.).<br>
      Those keyboards usually use four shift states:</p>
      <p>– unshifted<br>
      – shift<br>
      – alt<br>
      – alt+shift</p>
      <p>The state you are still missing in your project (and that would give you room to accommodate a whole buch of characters) is alt-shift.</p>
