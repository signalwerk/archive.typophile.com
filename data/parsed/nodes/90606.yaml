      <p>Thanks for the tip!  I bought a full copy of KBDedit to play with it.  It's fairly complete, it has some nice features in that it looks like one can modify the keymap in real time.  It's also easy to add in several other modifier shift keys.  Like I could turn the useless Menu key into a Kana key and have a few more shift states (kana, kana-ctrl, kana-shift, kana-shift-ctrl).  </p>
      <p>I did not see how to use KBDedit to add dead-dead keys, but it almost looks like it should be possible.</p>
      <p>Yes, you're right, I could just add more shifted states.  I may have to do that.  However, I'm trying hard to keep things where I'll remember them.  It's logical to remember to do something like alt-~, =, / to produce ≇.  alt-~, = produces this on my kb: ≅.  Yah, I guess I could do alt-~, kana-=, but it's not terribly memorable.</p>
      <p>Are there tools that let one build japanese style keyboards like KBDedit and MSKLC?</p>
