      <p>I've already used the alt-gr keys as a sort of compose key in my keyboard layout.  Here's what I've been working on:</p>
      <p><a href="http://grant.org/mgrant/uscmpse/windows-compose-key.html" title="http://grant.org/mgrant/uscmpse/windows-compose-key.html">http://grant.org/mgrant/uscmpse/windows-compose-key.html</a></p>
      <p>The goal of my layout was to extend the US keyboard.  All the original keys sequences are unchanged (including ctrl-keys).  Everything that was added was with the addition of the alt-gr key.</p>
      <p>It's not yet complete in my opinion but it's quite usable (though one could question *what* exactly you would need all these characters for!)  However, I must admit in my day to day life, I do find myself using several of these characters (like € and £ and ≠), especially as they are easily accessible from my keyboard in more or less logical places.</p>
      <p>However, there are a few other characters I'd like to add to this mapping and I'm starting to lack a logical place to put them.  </p>
      <p>It would be useful if I had another shift state.  Is there a way to get it to work like holding down a shift/ctrl/alt-gr key?  Or is it always a toggle?</p>
      <p>It would also be useful if I could create "dead-dead" keys so I could, for example, create a key sequence like alt-gr . . . to produce an ellipsis '…'.</p>
      <p>If I can't do these things with the Microsoft Layout Creator, is there some way I could create the required DLL from c# myself?</p>
      <p>I also have seen the Japanese keyboard which does a pretty cool thing of allowing the user to choose a character by composing it from the phonetics.  Perhaps I could use this method, but is there a tool to create those sort of mappings like the Layout Creator?</p>
      <p>Michael Grant</p>
