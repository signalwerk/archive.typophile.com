    <p>I'm not sure if this is the best forum for this but a number of folks here seem to have experience with the Microsoft Keyboard Layout Creator tool.</p>
    <p>I'm trying to create a keyboard layout which includes some of the more useful unicode characters.  Mostly I am doing this for myself but if anyone wants it, I'll be happy to send them the layout.  It's based originally on a US keyboard layout.</p>
    <p>I would like to use the caps-lock key as another shift key.  I see there is a way to use it as SGCAPS mode in the keyboard creator.  But the key still functions as a locking toggle.  As in, you press the caps-lock key and you're in caps-lock mode, then you press it again and you are out of the mode.  Is there any way to create a keyboard layout where this key is not a toggle?</p>
    <p>Michael Grant</p>
  html_clean: |-
