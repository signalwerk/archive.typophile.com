    <p>Current URL:<br>
    <a href="http://www.typography.com/fonts/font_overview.php?productLineID=100030" title="http://www.typography.com/fonts/font_overview.php?productLineID=100030">http://www.typography.com/fonts/font_overview.php?productLineID=100030</a></p>
    <p>Designed by <a href="/wiki/Tobias%20Frere-Jones" class="freelinking" rel="nofollow">Tobias Frere-Jones</a> Published by <a href="/wiki/Hoefler%20%2526%20Frere-Jones" class="freelinking" rel="nofollow">Hoefler &amp; Frere-Jones</a></p>
    <p>Gotham Rounded is a technical letter that goes from friendly to high-tech to cheeky with ease.</p>
    <p>Our Gotham typeface, inspired by signs on buildings, celebrates the workmanlike “draftsman’s alphabet” at a monumental scale. Similarly unadorned, but at a more intimate size, is the lettering of engineering: the marks on precision instruments, blueprints, stencils and templates. Drawn, stamped, engraved and routed, these forms are sensitively captured by our new Gotham Rounded family, available in eight styles including italics.</p>
