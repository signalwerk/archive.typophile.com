      <p>If you can sort your glyphs by Unicode (such is possible, for instance, with InDesign) or you can <em>type in</em> the Unicode for this character (OS X allows that; rumour has it that Windows also can, I don't know how) you don't have to "find" it -- it's there in the font or it is not.</p>
      <p>If it is, you'll see it. If it is not, then you'll see the default "Not available" character for the font (usually just an empty square). If it's not in the font, you have to find another one that comes close, design-wise, and either use that font for all of your text (recommended), or use it for just this single character (not recommeded, unless you are highly skilled in spotting the design differences between the two. Compare this to using an Arial "A" inside a Times Roman Text.).</p>
      <p>You can try "Fonts that support..." on <a href="http://www.fileformat.info/info/unicode/char/503c/index.htm" rel="nofollow">Fileformat.info</a> -- I have had mixed experience with these, good and bad.</p>
