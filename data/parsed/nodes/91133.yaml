    <p>Hello all</p>
    <p>I am doing some Chinese typesetting at work.<br>
    I am using Hiragino Mincho ProN W3 but I am missing this character: </p>
    <p>值 GID 1047<br>
    Unicode 503c<br>
    GB D6B5<br>
    CJK UNIFIED IDEOGRAPH-503c</p>
    <p>Can anyone help me find this character in Mincho?<br>
    Many thanks</p>
    <p>Andrew</p>
