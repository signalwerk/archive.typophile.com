      <p>The OP reports he is setting Chinese, and my point is that in such work it is generally wise to start with a Chinese font and look farther afield only when necessary.  值 versus 値 both illustrates and complicates the issue.  Lin Yutang's 1972 Chinese-English dictionary uses 值 for the headword, but says (91A.30-1) 値 is the form usually used in print; DeFrancis' 1996 Alphabetically-Based Computerized C-E dictionary uses 值 and ignores 値.  The Unicode look-up gives the same reference for both forms in the 1931 Mathews C-E dictionary, #975; however, Mathews -- which frequently shows variants -- in this instance gives only 値. </p>
      <p>Out in the world of fonts, Arphic's Big-5 font "AR Mingti Light Big5" uses the glyph 値 at the codepoints where Big-5 and Unicode have 值, supporting the notion the two forms are interchangeable; not surprisingly, the same foundry's Unicode 3 font "AR MingU30" has both forms at their proper Unicode locations.  The Kozuko Mincho and Gothic fonts that Adobe bundles with InDesign do not include 值, but they do offer a variant glyph for 値 at the same code-point (i.e., <em>not</em> 值 -- though many other Kozuko variants point to alternates with separate code-points).</p>
      <p>So it's probably okay to swap 值 for 値 in Chinese text, though the former may seem more "modern."   But how about 內/内 and 說/説?  If you know which one you want, InDesign can use Kozuko Mincho's alternate forms feature to swap the underlying codes.  The trick, of course, in knowing what the author or editor intends, even if they don't always know themselves.</p>
      <p>David</p>
