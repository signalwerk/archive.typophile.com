    html: <p>The bottom line is that if you are intending to typeset some text in Simplified Chinese, you should be using a Simplified Chinese font, not a Japanese one. In terms of fonts that are bundled with Mac OS X, the 华文宋体.ttf (STSong) font is the closest to Hiragino Mincho ProN W3, design-wise.</p>
