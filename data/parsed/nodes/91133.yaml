      <p>The trouble with using a Japanese font for setting Chinese is that despite a great many shared characters the two languages are different.  The <a class="freelinking external" href="http://www.unicode.org/cgi-bin/GetUnihanData.pl?codepoint=503C&amp;useutf8=true" rel="nofollow">Unicode look-up for 值</a> doesn't give a Japanese mapping for the character, nor a listing in major Japanese dictionaries, so you'll probably need a Chinese font.  The fact that the character has both GB and Big-5 encoding suggests it is available in most Chinese fonts, and perhaps you already know that "Mincho" is "Ming" in Chinese. </p>
      <p>David</p>
