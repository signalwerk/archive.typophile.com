    html: <p>The PPM ranges at which a TrueType font is antialiased are located in the GASP table. In FontLab, you can set the ranges in the Font Info panel under TrueType Settings -&gt; Font Smoothing. Fontographer should have something similar. There's also a Windows command line app called <a href="http://www.geocities.com/SiliconValley/Lakes/8162/" rel="nofollow">TTFGASP</a> that will add a GASP table to a TrueType font.</p>
