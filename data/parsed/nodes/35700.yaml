  html: |-
    <p>HI,</p>
    <p>I have developed a font. When I tested it under MS Windows environment (MS office), I examined that most of the fonts get gray scaled at point size 12 but not the one that I developed. Is it possible to add information inside font to force it to be Gray scaled at a particular defined point size? </p>
    <p>Note: Standard option (not ClearType)is selected for smooth edge and screen fonts. </p>
    <p>Best regards,<br>
    Atif</p>
