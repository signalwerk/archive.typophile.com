    html: |-
      <p>@ Cameron</p>
      <p>Understanding the difference between the logical structure and the style is important, because many people with handicaps are also using computers. Blind people are using screenreaders. If the markup is misused for the style, the access to the content is harder for them. Cascading Style Sheets are not limited to the visual style by the way. But how should a screenreader interpret the expression "italic"? The expression indicates a visual style, while "emphasis" indicates "importance". Additionally it would be absurd to style the italic element upright bold with the help of CSS, while there are cases in which it makes sense to style the em element upright bold.</p>
      <p>For the same reason you should make use of attributes like "title" or elements like "acronym". In case of the acronym-element the handicap is the limited knowledge of the user. The biggest handicap is stupidity. This does not mean, that you always should design for the most stupid user, but in case of websites, that are intended to be used by a wide range of users, that don’t belong to a group with special interests, the Amazon website or a government website for example, you should keep in mind, that many people are more stupid than you or that many people are less competent than you.</p>
      <p>There are cases, in which blinds are not in your target group. I think, this website is one example – although even on this website you probably find discussions about braille.</p>
