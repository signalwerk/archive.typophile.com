  html: |-
    <p>I am a traditional typographer having difficulty understanding HTML tools, some are easy, such as <em>emphasis</em>; though why "ital" wasn't used rather than "em" is a mystery; shouldn't "em" have been reserved for an em-space?</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Type-example_3997.jpg"></div><p></p>
    <p>The above example is easy to set in typographic programs such as QuarkXPress or InDesign, and the coding made sense on Quadex and other type systems, back in the day. Note that there are hanging numerals in bold, the text is set 9/11, with alignment for breaking lines, and 2 pts additional space between paragraph returns. </p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Superior_4827.jpg"></div><p></p>
    <p>The same goes for the superior shown, again, easy in Quark or InDesign, nearly impossible (at least to me) in HTML.</p>
    <p>The dialogue in Quark is easy for a typographer to understand:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/QuarkDialogue_5061.png"></div><p></p>
    <p>I've been wading through page after page of code for two days now, and am more befuddled than when I began. Can someone please recommend a resource for learning Dreamweaver, HTML, and CSS that is geared to typographers? The web people I've been able to speak to seldom understand even the word "leading". Can someone give me some hope?</p>
