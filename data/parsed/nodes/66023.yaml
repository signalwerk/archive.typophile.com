    html: |-
      <p>Yes, stick with standards compliant HTML. Again, you don't style text with HTML (though browsers do have default styles for the HTML). </p>
      <p>Use CSS to style the typefaces to the extent that you can.</p>
      <p>Beyond that, you can do things with CSS to fudge what you want. For instance, you could create your own numerals as GIF files, then via CSS, cover the default numbers created with your custom image based numbers. You end up with standards compliant HTML, but with the look you want. You could look into using @font-face as well. </p>
      <p>"Aluminum is not really accurate."</p>
      <p>Like I said, not a great analogy. It was the best I could think aimed at someone that is primarily coming from a print-centric mindset. </p>
      <p>Joe's literal definition is the better way to describe it. HTML is semantic markup. CSS makes it pretty.</p>
