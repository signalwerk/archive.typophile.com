      <p>You’re talking to the wrong “Web people.” Talk to Jason Santa Maria, Clagnut, Andy Clarke, Mark Boulton. (Buy Mark’s book.)</p>
      <p>Don McCahill, <code>em</code> <a href="http://www.w3.org/TR/CSS21/syndata.html#length-units" title="Actual CSS spec" rel="nofollow">is</a> “the font-size of the relevant font,”&nbsp;namely the font in use for the text to which the declaration applies. HTML has no “ugly”; it is unstyled by default, save for rare presentational elements that are not used by the pros.</p>
      <p>—<br>
      Joe Clark<br>
      <a href="http://joeclark.org/" title="http://joeclark.org/">http://joeclark.org/</a></p>
