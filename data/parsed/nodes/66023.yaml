    html: |-
      <p>Originally, HTML, and SGML on which it was based, was highly unfriendly to typographers. Initially you didn't have access to leading, paragraph indents, or paragraph spacing. We still are hampered with lack of hyphenation, making justified text ugly, although possible. It was all originally built by a committee of programmers, with little or no typographic input.</p>
      <p>When CSS came out, it did get some input from typographers, and you can now do many more things. (Although I am still baffled how you can use em as a dimension without it being based on some other element).</p>
      <p>Slowly the ugly is being squeezed out of HTML, but it is a slow process.</p>
      <p>I suggest that the hardest step for a print designer is to learn that on the Web, you never know what size of 'paper' you are designing for. Get past that, and you are more than half way towards being a web designer.</p>
      <p>Oh yeah, you did ask a question ... I use <a href="http://www.w3schools.com" title="http://www.w3schools.com">http://www.w3schools.com</a> as an excellent learning resource on HTML and CSS.</p>
