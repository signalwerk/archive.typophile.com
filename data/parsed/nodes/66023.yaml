    html: |-
      <p>I used to be a stubborn as Joe in terms of full on obedience to web accessibility guidelines but have become more pragmatic over the years. Partly because I'm not a pundit and have to adhere to demands of others and partly because the more you learn about web accessibility, the more gray area you find within it. It's getting better (really looking forward to ARIA standards). </p>
      <p>In the end, it all depends. Apply and/or ignore the rules of thumb based on the context of the site you are building. </p>
      <p>ricadus is sort-of correct. If the numeral is an image, and a user changes their font size, it may not scale in relation to the type. You could get around that by sizing the image in ems. The other issue if a person is using page-zoom (via the OS or the browser itself) the image will scale, but quickly become much more pixelated than the text. That may be an issue. But that's but one way to skin the cat. </p>
      <p>You can do a lot with HTML + CSS but there are limitations when comparing it to traditional typesetting. It's up to you to decide when over-rides are warranted and when they are not. Both from an end-user usability/accessibility standpoint as well as production-side sanity.</p>
