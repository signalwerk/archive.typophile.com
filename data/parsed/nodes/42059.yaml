      <p>Here are your caps - but this digitization doesn't have a lower case. I expect it is a font, but may not be digitized in the form you see it.</p>
      <p><a href="http://www.myfonts.com/fonts/hihretrofonts/schnorr-gestreckt/" title="http://www.myfonts.com/fonts/hihretrofonts/schnorr-gestreckt/">http://www.myfonts.com/fonts/hihretrofonts/schnorr-gestreckt/</a></p>
      <p>A search on myfonts.com for "nouveau" will turn up some similar fonts, many from Solotype.</p>
      <p>Ah there ya go. I just found Ambrosia in my Art Nouveau fonts Dover book but I was beaten to the punch.</p>
