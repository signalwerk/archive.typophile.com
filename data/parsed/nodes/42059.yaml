    <p>Longshot here, but a client would like to try and replicate the display font from Carole King's landmark album <a class="freelinking external" href="http://images.barnesandnoble.com/images/9180000/9189509.jpg" rel="nofollow">http://images.barnesandnoble.com/images/9180000/9189509.jpg</a>.<br>
    Doubtful that it's actually a typeface, more like hand drawn piece of art. But, I have to ask... </p>
    <p>Anybody out there know of a font that's even remotely close?</p>
    <p>Thanks in advance for any replies!<br>
    Dr. Theopolis</p>
