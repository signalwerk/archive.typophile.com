  html: "<p>Here's the full list of fonts included in the <a href=\"http://www.myfonts.com/foundry/fontaid/\">Font Aid III appeal</a>. To remind you, from Jan 14 to Feb 14 2005, 100% of money spent at MyFonts on these fonts is donated to Direct Relief International, a major charity targeting relief at victims of the South Asian Tsunami. <br> <br><b>There's never been a better time to expand your font library, with a splendid selection of sans and serifs, delightful decoratives, seductive scripts, funky fonts and picture fonts. All best-sellers from their respective foundries, highlights include:</b> <br> <br>Serif: <a href=\"http://www.myfonts.com/fonts/ef/zapf-renaissance/\">Zapf Renaissance</a>, <a href=\"http://www.myfonts.com/fonts/castletype/goudy-trajan/\">Goudy Trajan</a> <br>Sans: <a href=\"http://www.myfonts.com/fonts/efscangraphic/today-sh/\">Today</a>, <a href=\"http://www.myfonts.com/fonts/device/paralucent/\">Paralucent</a>, <a href=\"http://www.myfonts.com/fonts/thirstype/infinity/\">Infinity</a>, <a href=\"http://www.myfonts.com/fonts/pampatype/quimera/\">Quimera</a>, <a href=\"http://www.myfonts.com/fonts/ef/tvnord/\">TV Nord</a>, <a href=\"http://www.myfonts.com/fonts/bitstream/bank-gothic/\">Bank Gothic</a> <br>Scripts: <a href=\"http://www.myfonts.com/fonts/p22/cezanne-regular/\">Cezanne</a>, <a href=\"http://www.myfonts.com/fonts/gideon/mea-culpa/\">Mea Culpa</a>, <a href=\"http://www.myfonts.com/fonts/lillie/elegeion-script/\">Elegion</a>, <a href=\"http://www.myfonts.com/fonts/canadatype/secret-scrypt/\">Secret Scrypt</a>, <a href=\"http://www.myfonts.com/fonts/wilton/about-face/\">About Face</a>, <a href=\"http://www.myfonts.com/fonts/efscangraphic/neue-luthersche-fraktur-sb/\">Neue Luthersche Fraktur</a>, <a href=\"http://www.myfonts.com/fonts/elemeno/chalk/\">Chalk</a>, <a href=\"http://www.myfonts.com/fonts/cruz/troubadour/\">Troubadour</a> <br>Funky &amp; decorative: <a href=\"http://www.myfonts.com/fonts/tailspinstudio/softie/\">Softie</a>, <a href=\"http://www.myfonts.com/fonts/chriscostello/blackstone/\">Blackstone</a>, <a href=\"http://www.myfonts.com/fonts/emtype/dixplay/\">Dixplay</a>, <a href=\"http://www.myfonts.com/fonts/bluevinyl/hot-fudge-bv/\">Hot Fudge</a>, <a href=\"http://www.myfonts.com/fonts/joevanderbos/retrofit/\">Retrofit</a>, <a href=\"http://www.myfonts.com/fonts/tailspinstudio/rostra/\">Rostra</a>, <a href=\"http://www.myfonts.com/fonts/gigofonts/gf-selfcensor/\">Gf Selfcensor</a>, <a href=\"http://www.myfonts.com/fonts/nicksfonts/snoopy-snails-nf/\">Snoopy Snails</a>, <a href=\"http://www.myfonts.com/fonts/ihof/p22-durer-caps/\">Durer Caps</a> <br>Picture: <a href=\"http://www.myfonts.com/fonts/outsidetheline/holiday-doodles-too/\">Holiday Doodles Too</a>, <a href=\"http://www.myfonts.com/fonts/lillie/lil-diddles-one/\">Lil' Diddles One</a>, <a href=\"http://www.myfonts.com/fonts/altemus/sports/\">Altemus Sports</a> <br> <br><b>You've only got until February 14</b> to buy these fonts under the Font Aid scheme, so if you see some on the list you've been wondering about buying for a while - please hurry! <i>And if you know others that may be interested in buying fonts this way, do let them know.</i> <br> <br>See previews of all FIFTY type families in the Font Aid III appeal, and read more about Font Aid: <br><a href=\"http://www.myfonts.com/foundry/fontaid/\" target=\"_blank\">http://www.myfonts.com/foundry/fontaid/</a> <br> <br>----------------------------- <br> <br>Here's a complete listing of all 50 families. <br> <br>About Face (Wilton Foundry) - from $29.00 <br><a href=\"http://www.myfonts.com/fonts/wilton/about-face/\" target=\"_blank\">http://www.myfonts.com/fonts/wilton/about-face/</a> <br> <br>Altemus Arabesques (Altemus Creative) - from $22.00 <br><a href=\"http://www.myfonts.com/fonts/altemus/arabesques/\" target=\"_blank\">http://www.myfonts.com/fonts/altemus/arabesques/</a> <br> <br>Arts And Crafts-GS (Bannigan Artworks) - from $19.95 <br><a href=\"http://www.myfonts.com/fonts/bannigan/arts-and-crafts-gs/\" target=\"_blank\">http://www.myfonts.com/fonts/bannigan/arts-and-crafts-gs/</a> <br> <br>Bank Gothic (Bitstream) - from $24.75 <br><a href=\"http://www.myfonts.com/fonts/bitstream/bank-gothic/\" target=\"_blank\">http://www.myfonts.com/fonts/bitstream/bank-gothic/</a> <br> <br>Gf Blackmail (Gigofonts) - from $49.75 <br><a href=\"http://www.myfonts.com/fonts/gigofonts/gf-blackmail/\" target=\"_blank\">http://www.myfonts.com/fonts/gigofonts/gf-blackmail/</a> <br> <br>Blackstone (Chris Costello) - from $28.75 <br><a href=\"http://www.myfonts.com/fonts/chriscostello/blackstone/\" target=\"_blank\">http://www.myfonts.com/fonts/chriscostello/blackstone/</a> <br> <br>Bosin (Australian Type Foundry) - from $25.00 <br><a href=\"http://www.myfonts.com/fonts/australiantype/bosin/\" target=\"_blank\">http://www.myfonts.com/fonts/australiantype/bosin/</a> <br> <br>P22 Cezanne (P22) - from $19.95 <br><a href=\"http://www.myfonts.com/fonts/p22/cezanne-regular/\" target=\"_blank\">http://www.myfonts.com/fonts/p22/cezanne-regular/</a> <br> <br>Chalk (Elemeno) - from $15.00 <br><a href=\"http://www.myfonts.com/fonts/elemeno/chalk/\" target=\"_blank\">http://www.myfonts.com/fonts/elemeno/chalk/</a> <br> <br>Cross Stitch (Gerald Gallo) - from $20.00 <br><a href=\"http://www.myfonts.com/fonts/gallofonts/cross-stitch/\" target=\"_blank\">http://www.myfonts.com/fonts/gallofonts/cross-stitch/</a> <br> <br>Daisy (GeoBoFonts) - from $15.00 <br><a href=\"http://www.myfonts.com/fonts/geobofonts/daisy/\" target=\"_blank\">http://www.myfonts.com/fonts/geobofonts/daisy/</a> <br> <br>Dixplay (Emtype Foundry) - from $35.00 <br><a href=\"http://www.myfonts.com/fonts/emtype/dixplay/\" target=\"_blank\">http://www.myfonts.com/fonts/emtype/dixplay/</a> <br> <br>Dominique (Canada Type) - from $19.95 <br><a href=\"http://www.myfonts.com/fonts/canadatype/dominique/\" target=\"_blank\">http://www.myfonts.com/fonts/canadatype/dominique/</a> <br> <br>Drop_it (Just i