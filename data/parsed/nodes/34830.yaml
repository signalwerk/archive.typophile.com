  html: |-
    <p>Would it be too presumptuous to ask for a moratorium on editing your posts until that feature is fixed? You see, when you edit your post it changes the time stamp causing the flow of the conversation to change quite a bit as well. I mean, a quick edit seconds after your initial post is one thing, but going back even 5 minutes later can cause a break in conversation and confusion for those who read the posts later.</p>
    <p>Thank you for considering the proposal.</p>
    <p>I've posted this in the GENERAL DISCUSSIONS area instead of my BLOG because I know some of you do not use the tracker to follow Typophile.</p>
