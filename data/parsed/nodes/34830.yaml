    html: |-
      <p>I always thought Typophile had a bit of a lag to it, even the previous version. I would usually sign in, go to my account and check my contributed topics (this had the longest loading times) before going back to the front page to see what's new and hot.</p>
      <p>I still do this, but now I don't really feel like checking out the news/hot topics as much. I can't put my finger on it, but there's something overwhelming about that front page. The Flash seems intrusive compared to the previous version; which was just slightly intrusive. The animated logo is annoying (and if you go to any other page, it looks like a ? not a T), the topic headers are too bold and appear slightly blurry (I'm on a Windows machine with Cleartype turned on), not to mention the issue with the editing comments. </p>
      <p>I do like some of the changes though. I like the expanding comment box, the ticker on the front that lists the latest comments, the user icons at the bottom, the multiple page link in the original post, and the fact that the links at the very top are all available.</p>
      <p>I've been waiting for an update to this site for a while, and I'm glad it's finally arrived, I just think it might have been too much all at once. It's upset the natural order of things and the adjustments are a bit of a shock. Changes is good, I applaud the efforts. I just think it might have been to much in too little without a proper feedback period.</p>
    html_clean: |-
