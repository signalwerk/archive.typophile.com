    <p>/// Due to popular demand! MyType has been extended to May 18th. ///</p>
    <p>the exhibit will now show until Sunday, May 18th...make sure to check it out!<br>
    designer Noel Nanton will be closing the show with a talk about ’his’type...<br>
    Sunday May 18th at 3pm, this is a free event.<br>
    see below for MyType details and exhibit location...</p>
    <p>—-</p>
    <p>typotherapy+design, Keep Six Contemporary Gallery and the Festival of<br>
    Architecture and Design invite you to:</p>
    <p>MyType: An exhibit of limited-edition, new modernist<br>
    posters by graphic design genius Noel Nanton.</p>
    <p>Exhibition dates: May 2- May 18th. 2008</p>
    <p>Keep Six Contemporary Gallery 938 Bathurst Street, Toronto, Canada.<br>
    Free Admission.</p>
    <p>Featuring new fonts designed by typotherapy, eye-popping popsicle colours, bold abstract shapes, and a very new take on classic modernist typography.</p>
    <p>Starting with the premise that typefaces are as expressive as the words they form, typotherapy has created a series of large-format posters that explore the relationship between positive and negative space. Letters speak, and if you remove them from the constraints of sentences and even words, they have a language of their own. </p>
    <p>MyType uses the craft of typography to find new ways of speaking using fonts famous and unknown including Helvetica, Avant Garde and typotherapy creations like Tomeri and VWmobile.</p>
    <p>For more information visit: <a href="http://www.keep6c.com" title="www.keep6c.com">www.keep6c.com</a> and <a href="http://www.toronto.ca/fad" title="www.toronto.ca/fad">www.toronto.ca/fad</a><br>
    For more new modernist design genius, visit: <a href="http://www.typotherapy.com" title="www.typotherapy.com">www.typotherapy.com</a></p>
