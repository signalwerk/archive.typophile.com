    html: <p>I'm reasonably sure Apple has their old Mac operating systems available at least up to System 7, if not later, available for free download at their company website <a class="freelinking external" href="http://apple.com" rel="nofollow">http://apple.com</a>. I can't think of the direct link off hand. Those old OS versions should include the basic fonts along with them. You'll have to dig through their download archives, though, and there may be other hoops to jump through.</p>
