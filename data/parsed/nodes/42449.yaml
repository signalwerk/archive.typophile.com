  html: |-
    <p>I'm looking for some of the older system fonts for the Mac - namely Chicago and New York. Is there a place where I can get these? (Preferably online, as I don't really want to dive into my huge collection of system and OS-discs to find it right now...) </p>
    <p>In theory, I still have the license for them, as my old OS licenses are still valid; though I really wouldn't mind paying a little for them either...</p>
    <p>Thanks!</p>
