      <p>From that list:</p>
      <p><a class="freelinking external" href="http://download.info.apple.com/Apple_Support_Area/Apple_Software_Updates/English-North_American/Macintosh/System/Older_System/System_7.5_Version_7.5.3/" rel="nofollow">http://download.info.apple.com/Apple_Support_Area/Apple_Software_Updates/English-North_American/Macintosh/System/Older_System/System_7.5_Version_7.5.3/</a></p>
      <p>It appears System 7.5.3 is the latest full version posted for free download, but with updaters you might be able to push that to 7.6.1. You'll have to skip up the parent directories to find everything. I'm not sure how up-to-date the fonts are at those versions. You should find the GX versions of the ones you're looking for, which is nice to have, though you might have to take them apart to find all the goodies hidden within.</p>
