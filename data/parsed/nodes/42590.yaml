    <p>Hi all,</p>
    <p>I work in-house, where Avenir is the typeface of our identity. I've been playing with this Ultralight weight in my "spare" time. I realize that I can't license it or anything, and that it's not as difficult as creating a face from scratch, but I wanted to know what the 'philes think....</p>
    <p>Caps only as of right now, halfway through digits...</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Avenir_Ultralight_6354.jpg"></div><p></p>
