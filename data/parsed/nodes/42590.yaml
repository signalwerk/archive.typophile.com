    html: |-
      <p>To answer Dan...I was at first overlaying letterforms from the Heavy to Light weights to see how much the widths of the individual characters decreased. I think in a few places I wasn't sure exactly where the characters should begin and end. I'm not sure how well I can explain myself.</p>
      <p>To answer Stephen... Maybe I'll should re-title this typeface as "moot point" to get away with it. I don't think a 26-character face would do too well...</p>
      <p>Thanks all!</p>
