    html: |-
      <p>Initial reaction is they look good, points I would look at are the vertical stroke of the R I feel it should flare to the left rather than right and possibly work in a closed loop where the counter and leg meet; work on the second o – it is slightly cramped; slightly close up the fto combination; try a thinner connecting stroke on op or maybe a more exuberant stroke – it is rather straight compared with some of the others; and possibly make the counter of the p a little wider.</p>
      <p>Tim</p>
