  html: <p>Just wondering what the general rules/guidelines are when using ligatures? <br> <br>Can they be used for headlines or should they be limited for use in body copy only? ie. below 12pt. <br> <br>Is there a general rule that they should not be used over a certain point size?</p>
  html_clean: <p>Just wondering what the general rules/guidelines are when using ligatures? <br> <br>Can they be used for headlines or should they be limited for use in body copy only? ie. below 12pt. <br> <br>Is there a general rule that they should not be used over a certain point size?</p>
