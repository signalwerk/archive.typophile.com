    html: |-
      <p>If you're going to go with hand-drawn 'E's, go with actual hand-drawn 'E's. Because they're exactly the same, they don't look hand-drawn. Get out the India ink and a brush, and make eight strokes.</p>
      <p>If you feel the need to use a font, don't go with one as readily available as Bradley Hand.</p>
      <p> - Lex</p>
