    html: |-
      <p>I concur that the handwritten Ε is a little weak. There's no need to make it as bold as the black text, because the red already add to its visual "weight". But a little bolder/larger should be better (I would made a little less thin the 40 too).<br>
      Also, I think you should align all the red text to the vertical center of the black one and not to the baseline as it is now.</p>
