    <p>Hi all!</p>
    <p>You created your Chrysanthi Unicode Monospace font by Font Creator, but when you try to test it in Scribus, you get excessive spacing.</p>
    <p>Unicode range coverage:<br>
    Basic Latin (complete in both fonts)<br>
    Latin-1 Supplement (complete in both fonts)<br>
    Latin Extended-A (complete in both fonts)<br>
    Latin Extended-B (incomplete in proportional, complete in monospace for 5.0) i<br>
    (proportional font only) These characters are not part of the Unicode Standard, and have been mapped to private use sectors 0234 – 0237. These characters are used in the Tsœxisca language. I have also mapped a capital and lower-case ezh to 0220 and 0221, respectively.</p>
    <p>IPA Extensions (incomplete in proportional, complete in monospace for 5.0)<br>
    Spacing Modifier Letters (incomplete in proportional, complete in monospace for 5.0)<br>
    Combining Diacritics (incomplete in proportional, complete in monospace for 5.0) ii</p>
    <p>(proportional font only) Because this is not a fixed width font, the combining marks will not line up precisely with all characters. I have tried to make them line up as well as possible with as many characters as possible.</p>
    <p>Greek (incomplete in proportional, complete in monospace for 5.0) iii<br>
    (proportional font only) Missing Variant Letter Forms, Archaic Letters, Coptic-unique letters, and Additions subsets [03D0-03F3]</p>
    <p>Cyrillic (incomplete in proportional, complete in monospace for 5.0)<br>
    Cyrillic Supplement (complete in monospace for 5.0)<br>
    Armenian (complete in both fonts)<br>
    Hebrew (incomplete in proportional, complete in monospace) * iv<br>
    (proportional font only) Missing Cantillation Marks subset [0590-05AF]</p>
    <p>Arabic (experiencing technical difficulties in proportional, complete in monospace) * v<br>
    (proportional font only) Missing 060C, 0653, 0654, 0655, 066C, 0680-06FE. Keeps printing out as Ariel Unicode, as do most of the subsets marked “technical difficulty.”)</p>
    <p>Syriac (unavailable in proportional, complete in monospace) *<br>
    Arabic Supplement (unavailable in both fonts)<br>
    Thaana (unavailable in both fonts ) *<br>
    NKo (unavailable in both fonts) *<br>
    Devanagari (experiencing technical difficulties in proportional, complete in monospace) * vi</p>
    <p>(proportional font only) These characters are mapped to the devanagari subset, which doesn’t seem to work in Windows 2000, and also to the Private use subset from E900 to E97F.</p>
    <p>Oriya (unavailable in both fonts) *<br>
    Tamil (unavailable in both fonts) *<br>
    Telugu (unavailable in both fonts) *<br>
    Kannada (unavailable in both fonts) *<br>
    Malayalam (unavailable in both fonts) *<br>
    Sinhala (unavailable in both fonts) *<br>
    Thai (unavailable in both fonts) *<br>
    Lao (unavailable in both fonts) *<br>
    Tibetan (experiencing technical difficulties in both fonts) * vii<br>
    (proportional font only) These characters are mapped to the tibetan subset, which doesn’t seem to work, and also to the Private use subset from EF00 to EFBF.</p>
    <p>Myanmar (unavailable in both fonts) *<br>
    Georgian (unavailable in both fonts) *<br>
    Hangul Jamo (unavailable in both fonts)<br>
    Ethiopic (unavailable in both fonts) *<br>
    Ethiopic Supplement (unavailable in both fonts)<br>
    Cherokee (unavailable in both fonts)<br>
    Canadian Aboriginal Syllabics (unavailable in both fonts)<br>
    Ogham (development progress stopped in proportional)<br>
    Runic (complete in both fonts) viii</p>
    <p>(proportional font only ) These characters are mapped to the runic subset, which doesn’t seem to work, and also to the Private use subset from E6A0 to E6F0.</p>
    <p>Tagalog (unavailable in both fonts) *<br>
    Hanunoo (unavailable in both fonts) *<br>
    Buhid (unavailable in both fonts) *<br>
    Tagbanwa (unavailable in both fonts) *<br>
    Khmer (unavailable in both fonts) *<br>
    Mongolian (unavailable in both fonts) *<br>
    Limbu (unavailable in both fonts) *<br>
    Tai Le (unavailable in both fonts) *<br>
    New Tai Lue (unavailable in both fonts) *<br>
    Khmer Symbols (unavailable in both fonts)<br>
    Buginese (unavailable in both fonts) *<br>
    Balinese (unavailable in both fonts) *<br>
    Phonetic Extensions (unavailable in proportional, complete in monospace)<br>
    Phonetic Extensions Supplement (unavailable in proportional)<br>
    Combining Diacritics Supplement (unavailable in proportional)<br>
    Latin Extended Additional (complete in both fonts)<br>
    Greek Extended (complete in both fonts)<br>
    General Punctuation (incomplete in proportional, complete in monospace) ix<br>
    (proportional font only) Missing 204A.</p>
    <p>Superscripts and Subscripts (complete in both fonts)<br>
    Currency Symbols (incomplete in proportional, complete in monospace) x<br>
    (proportional font only) Missing 20AF.<br>
    Combining Diacritical Marks for Symbols (unavailable in both fonts)<br>
    Letterlike Symbols (incomplete in proportional, complete in monospace)<br>
    (monospace font only) These characters are mapped to the letterlike symbols subset, which seems to have excessive spacing in Windows.</p>
    <p>Number Forms (incomplete in proportional, complete in monospace)<br>
    Arrows (incomplete in proportional, complete in monospace) xi<br>
    (proportional font only) Missing 21EB - 21F2.</p>
    <p>Mathematical Operators (incomplete in proportional, 42 glyphs in monospace)<br>
    Miscellaneous Technical (incomplete in both fonts) xii<br>
    (proportional font only) Status uncertain. No immediate plans to complete this section.</p>
    <p>Control Pictures (unavailable in proportional, 1 glyph in monospace)<br>
    OCR (unavailable in both fonts)<br>
    Enclosed Alphanumerics (unavailable in proportional, 139 glyphs in monospace)<br>
    Box Drawing (complete in proportional, 40 glyphs in monospace)<br>
    Block Elements (complete in proportional)<br>
    Geometric Shapes (incomplete in proportional)<br>
    Miscellaneous Symbols (incomplete in proportional, 25 glyphs in monospace) xiii/xiv<br>
    (proportional font only) 2671 replaced by similar symbol.<br>
    (proportional font only) Yin-yang patterns for Taoist medicine added to 25F9 though 25FF. Decorative glyphs added to 2614 through 2617. Zodiac wheel added to 2618. Private use area 2672 through 267F mapped as follows: 2672 - pentagram, 2673 - inverted pentagram, 2674 - tripple goddess moon, 2675 - dharma wheel, 2676 - fire glyph, 2677 - air glyph, 2678 - earth glyph, 2679 - water glyph, 267A - akasha glyph, 267B inverted akasha glyph, 267C - three triangles, 267D - three overlapping circles, 267E - five overlapping circles, 267F - three pointed circle.</p>
    <p>Dingbats (incomplete in proportional, unavailable in monospace) xv<br>
    (proportional font only) Left shadowed white circle mapped to 274E. Compass design mapped to 270A. Four pointed circle mapped to 270B. Pentagraph mapped to 2728. 2768 and 2769 inverted versions of 2766 and 2767.</p>
    <p>Miscellaneous Mathematical Symbols-A (unavailable in both fonts)<br>
    Supplemental Arrows-A (unavailable in both fonts)<br>
    Braille Patterns (unavailable in both fonts)<br>
    Supplemental Arrows-B (unavailable in both fonts)<br>
    Miscellaneous Mathematical Symbols-B (unavailable in both fonts)<br>
    Supplemetal Mathematical Operators (unavailable in both fonts)<br>
    Miscellaneous Symbols and Arrows (unavailable in both fonts)<br>
    Glagolitic (unavailable in both fonts)<br>
    Latin Extended-C (unavailable in proportional, 1 glyph in monospace)<br>
    Coptic (unavailable in both fonts)<br>
    Georgian Supplement (unavailable in both fonts)<br>
    Tifinagh (unavailable in both fonts)<br>
    Ethiopic Extended (unavailable in both fonts)<br>
    Supplemental Punctuation (unavailable in both fonts)<br>
    CJK Radicals Supplement (unavailable in proportional, 9 glyphs in monospace)<br>
    Kangxi Radicals (unavailable in both fonts)<br>
    Ideographic Description (unavailable in both fonts)<br>
    CJK Symbols and Punctuation (incomplete in both fonts)<br>
    Hiragana (incomplete in proportional, complete in monospace)<br>
    Katakana (incomplete in proportional, complete in monospace)<br>
    Bopomofo (incomplete in both fonts, and experiencing technical difficulties) xvi<br>
    xvi Missing non-mandarin subset.</p>
    <p>Hangul Compatibility Jamo (unavailable in both fonts)<br>
    Kanbun (incomplete in both fonts, and experiencing technical difficulties)<br>
    Extended Bopomofo (unavailable in both fonts)<br>
    CJK Strokes (unavailable in both fonts)<br>
    Enclosed CJK Letters and Months (unavailable in both fonts)<br>
    CJK Compatibility (incomplete in both fonts, and experiencing technical difficulties)<br>
    CJK Unified Ideographs Extension A (unavailable in both fonts)<br>
    Yijing Hexagram Symbols (unavailable in both fonts)<br>
    CJK Unified Ideographs (unavailable in both fonts) xvii<br>
    xvii Some of the CJK Unified Ideographs are available in a private use area from E300 to E400, but the entire subset could not be presented due to space considerations.</p>
    <p>Yi (unavailable in both fonts)<br>
    Yi Radicals (unavailable in both fonts)<br>
    Modifier Tone Letters (unavailable in both fonts)<br>
    Latin Extended-D (unavailable in both fonts)<br>
    Syloti Nagri (unavailable in both fonts)<br>
    Phags Pa (unavailable in both fonts)<br>
    Hangul (unavailable in both fonts)<br>
    High Surrogates (unavailable in both fonts)<br>
    Low Surrogates (unavailable in both fonts)<br>
    CJK Compatibility Ideographs (unavailable in both fonts)<br>
    Private Use Area (selected glyphs) xviii<br>
    (proportional font only) This subset contains Dlatci, Common CJK Unified Glyphs, and certain other characters with which I had difficulty mapping to their original location (i.e. Runic).</p>
    <p>Dlatci (development process stopped in proportional, unavailable in monospace)<br>
    Some Common CJK Unified Glyphs xix<br>
    (proportional font only) Contains numbers, directions, seasons, elements, horary characters, zodiac animals, and characters necessary to write the names of the solar terms.</p>
    <p>Chrysanthi Runes (unavailable in monospace)<br>
    Alphabetic Presentation Forms (incomplete in both fonts)<br>
    Arabic Presentation Forms-A (incomplete in both fonts)<br>
    Variation Selectors &amp; Vertical Forms (incomplete in both fonts)<br>
    Combining Half Marks, CJK Comp Forms &amp; SFV (unavailable in both fonts)<br>
    Arabic Presentation Forms-B (incomplete in both fonts)<br>
    Halfwidth and Fullwidth Forms (unavailable in proportional, 162 glyphs in monospace)<br>
    Specials (unavailable in both fonts)</p>
    <p>* indicates that a language needs OpenType features to render it properly.</p>
