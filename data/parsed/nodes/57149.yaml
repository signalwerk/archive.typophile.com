    html: |-
      <p>In grade two, when we started to learn cursive writing instead of printing, mine was so bad that my teachers stopped asking me to try and just go back to printing. My dad printed in caps, and of course I wanted to be just like dad, so from then on, I printed in capital letters. After a while, (20 years) it got to a point that it was so messy that I couldn’t read my own notes half of the time.</p>
      <p>I had always known about the <a class="freelinking-external" href="http://en.wikipedia.org/wiki/Bouma">Bouma</a> model, so I decided to try an experiment.</p>
      <p>So there I was, 20something years old, sitting on my deck in downtown Toronto with a stack of printouts with dashed lines on them and I literally practiced drawing a sheet of letter a’s, then b’s, then c”s… I did this for a little less than a week, and then simply forced myself to print in U&amp;lc. It took about six months - one year to become comfortable with it, but once I had made the transition I noticed that I could go about 2x faster, have letters that were almost 2x messier, but due to the fact that I now had word-shapes that weren’t there when printing in all caps, I could read it 2x as easily. It’s still pretty bad though.</p>
      <p>Even more interesting, the day following a seizure, my handwriting is bad beyond belief. If I’m not sure I’ve had a seizure in my sleep, my handwriting the next day is often a give-away. I’m sure there’s a PhD thesis in there somewhere.</p>
