      <p>“graphology is to graphic design what phrenology is to neurology”</p>
      <p>I’ve actually been gathering research and books on graphology. Neurology as well, but that’s another topic.</p>
      <p>I run the risk of being stoned to death for supporting quackery, but mind you, handwriting analysis is respected in Europe, less so in the United States, and if for nothing provides an interesting and often times amusing take on letterforms from outside my profession.</p>
      <p>Antiquated systems of interpretation and description have their merits in the over all scheme of everything. It wasn’t that long ago that designers were seriously trying to find the corresponding geometric shapes for the colors red, blue, and yellow.</p>
