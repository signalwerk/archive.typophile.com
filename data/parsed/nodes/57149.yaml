      <p>Interesting topic, one I’ve always wondered about. </p>
      <p>I pretty much learned to type so that others could read my writing. When I do write it is more of a shorthand notation. You could not understand the individual words without the greater context. I think I learned that from my dad. When I do try to slow down and write legibly it usually comes out mixEd cAsE and I tend to run out of room on the right side of the sheet.</p>
      <p>And as far as content (like my graphic design) I usually need to spew it all out on the sheet then cut/paste/move it into some sort of logical order. Hard to do when it’s hand written.</p>
      <p>...I’m glad I’m not the only one :-)</p>
