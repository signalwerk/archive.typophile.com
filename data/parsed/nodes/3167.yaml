  html: "<p>I've been toying around with the new illustrator CS and its Opentype capabilities.  <br> <br>Works very, very nice with Adobe Pro fonts, but Illustrator doesn't recognize the OT features of the .dfonts, that came with Panther, like Big Caslon. Only if you insert manually with the Glyph Palette. But I can hardy call that \"user-friendly\". <br> <br>Example: if you specify Small Caps in Illustrator with Big Caslon, it gives you scaled capitals (aaaaaargh). It works in TextEdit tough. But on the other hand, TextEdit can't cope with the Adobe Pro-fonts... <br> <br>I tought that Opentype would end all this misery ?</p>"
