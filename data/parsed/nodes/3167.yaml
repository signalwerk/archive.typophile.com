    html: <p>.dfonts are Apple-style Truetype fonts with the resource data moved to the data fork. They are slightly different in structure than .ttf fonts, though both are data fork Truetype. .dfonts can but generally don't contain OpenType tables. Apple built the format purely out of necessity, because the Mac OS X build process requires files with all data accessible on a Unix filesystem, which doesn't have resource forks. <br> <br>Resource forks are an ideological issue among programmers. Personally I think they're dumb and Steve did good to make OS X work on filesystems without them, whether or not he wanted to. <br> <br>Big Caslon, Skia, Apple Chancery and some other Apple system fonts are AAT (Apple Advanced Typography) fonts. AAT used to be called GX. The only way you can use their features is in AAT-savvy apps, which includes TextEdit and Keynote on Panther systems, and WorldText on pre-Panther systems. To get those features in InDesign, do the text in TextEdit, export it as a PDF, and import the PDF into InDesign or Illustrator or whatever. Awkward, ja? It's generally only useful for headlines.</p>
