      <p>It's a good thing I caught you just in time!</p>
      <p>While an English translation of the Scriptures can be made more idiomatic by being paraphrased, when it comes to the original actual text of Scripture, while one can choose <em>which portions to present</em>, modifications of the sort you are considering are... considered objectionable by many persons of faith.</p>
      <p>The operative principle is noted in Revelations 22:18-19 -</p>
      <p>Μαρτυρῶ ἐγὼ παντὶ τῷ ἀκούοντι τοὺς λόγους τῆς προφητείας τοῦ βιβλίου τούτου· ἐάν τις ἐπιθῇ ἐπὶ ταῦτα, ἐπιθήσει ὁ Θεὸς ἐπ' αὐτὸν τὰς πληγὰς τὰς γεγραμμένας ἐν τῷ βιβλίῳ τούτῳ· καὶ ἐάν τις ἀφέλῃ ἀπὸ τῶν λόγων τοῦ βιβλίου τῆς προφητείας ταύτης, ἀφελεῖ ὁ Θεὸς τὸ μέρος αὐτοῦ ἀπὸ τοῦ ξύλου τῆς ζωῆς καὶ ἐκ τῆς πόλεως τῆς ἁγίας, τῶν γεγραμμένων ἐν τῷ βιβλίῳ τούτῳ.</p>
      <p>For I testify unto every one that heareth the words of the prophecy of this book, if any man shall add unto these things, God shall add unto him the plagues that are written in this book: and if any man shall take away from the words of the book of this prophecy, God shall take away his part out of the book of life, and out of the holy city, and [from] the things which are written in this book.</p>
      <p>Thus, the welfare of your eternal soul was in great jeopardy there!</p>
