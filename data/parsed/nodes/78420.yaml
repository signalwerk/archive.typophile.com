    <p>Hello,<br>
    I'm working on a quick calligraphy project for some friends, and it is going to be in both Hebrew and English (one above the other).</p>
    <p>The main bit of text will be Ecclesiastes 4:9-12 (King James Version):</p>
    <p>9 Two are better than one; because they have a good reward for their labour.<br>
    10 For if they fall, the one will lift up his fellow: but woe to him that is alone when he falleth; for he hath not another to help him up.<br>
    11 Again, if two lie together, then they have heat: but how can one be warm alone?<br>
    12 And if one prevail against him, two shall withstand him; and a threefold cord is not quickly broken.</p>
    <p>And in Hebrew&nbsp;(The Westminster Leningrad Codex):</p>
    <p>9 טֹובִ֥ים הַשְּׁנַ֖יִם מִן־הָאֶחָ֑ד אֲשֶׁ֧ר יֵשׁ־לָהֶ֛ם שָׂכָ֥ר טֹ֖וב בַּעֲמָלָֽם׃<br>
    10 כִּ֣י אִם־יִפֹּ֔לוּ הָאֶחָ֖ד יָקִ֣ים אֶת־חֲבֵרֹ֑ו וְאִ֣ילֹ֗ו הָֽאֶחָד֙ שֶׁיִּפֹּ֔ול וְאֵ֥ין שֵׁנִ֖י לַהֲקִימֹֽו׃<br>
    11 גַּ֛ם אִם־יִשְׁכְּב֥וּ שְׁנַ֖יִם וְחַ֣ם לָהֶ֑ם וּלְאֶחָ֖ד אֵ֥יךְ יֵחָֽם׃<br>
    12 וְאִֽם־יִתְקְפֹו֙ הָאֶחָ֔ד הַשְּׁנַ֖יִם יַעַמְד֣וּ נֶגְדֹּ֑ו וְהַחוּט֙ הַֽמְשֻׁלָּ֔שׁ לֹ֥א בִמְהֵרָ֖ה יִנָּתֵֽק׃</p>
    <p>They really liked this text, but thought it was a bit long. I was able to shorten it as much as possible, while still retaining the overall meaning:</p>
    <p>Two are better than one;<br>
    For if they fall, the one will lift up his fellow.<br>
    Again, if two lie together, then they have heat: but how can one be warm alone?<br>
    And if one prevail against him, two shall withstand him; and a threefold cord is not quickly broken.</p>
    <p>טובים השנים מן־האחד׃<br>
    כי אם־יפלו האחד יקים את־חברו׃<br>
    גם אם־ישכבו שנים וחם להם ולאחד איך יחם׃<br>
    ואם־יתקפו האחד השנים יעמדו נגדו והחוט המשלש לא במהרה ינתק׃</p>
    <p>The tricky part is the Hebrew, because of my limited knowledge of Hebrew. I'm not sure if I broke it in terms of syntax, so any input would be appreciated. :)</p>
    <p>Thanks in advance!</p>
