    html: |-
      <p>Hi David</p>
      <p>Years ago I knocked up this one for my own amusement; all gradients applied within Indesign.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Somedays-poster_5638.jpg"></div><p></p>
      <p>As James says, the postscript routines in both Indesign and Illustrator are pretty much the same thing. However – <em>vector-based gradients can go horribly wrong</em> – the only time this happened to me was on an A1 poster in which the banding was a direct result of the shift between two colours being <em>too subtle over too wide a distance</em>. A 10 or 15% shift on one of the plate colours was not enough, and the gradient was replaced with a blend containing the maximum number of steps. Wearing the cost of remaking the film &amp; proof certainly learnt me a lesson...</p>
