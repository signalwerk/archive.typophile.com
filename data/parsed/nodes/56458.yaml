    html: <p>Vector gradients in any program can result in some nasty banding at large sizes, so I would be loathe to use one on a poster unless I really trusted the printer to work with me and make sure that the printing comes out right. And if you do the whole thing in Photoshop it’s easier to add some noise and make the whole thing look more natural.</p>
