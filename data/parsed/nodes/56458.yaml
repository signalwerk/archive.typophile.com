  - id: 338949
    user: 42737
    date: 2009-03-31T23:04:00
    date_raw: 31 Mar 2009 — 11:04pm
    votes: null
    html: <p>I second doing the gradient in photoshop and adding a tad bit of noise to it. Vector-based gradients can go horribly wrong. There's quite a discrepancy between math-based formulas for color gradations and real-world printed fades. The only time I'll use a gradient in Illustrator or Indesign is if it's a very subtle fade between similar values of the same color.</p>
    html_clean: <p>I second doing the gradient in photoshop and adding a tad bit of noise to it. Vector-based gradients can go horribly wrong. There's quite a discrepancy between math-based formulas for color gradations and real-world printed fades. The only time I'll use a gradient in Illustrator or Indesign is if it's a very subtle fade between similar values of the same color.</p>
