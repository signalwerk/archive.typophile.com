  html: "<p>I need expert Typophile advice. <br> <br>Working on a 20-pg brochure for a web-based medical software product. Sample pages below. <br> <br>So far I'm using an old favorite, Avenir. But as the product positions itself as being innovative but relatively neutral to some of the trends in technology advertising, I'm attempting to introduce Clarendon into the picture.  <br> <br>Here's a sample spread with Avenir for the headline, somewhat Apple-esque and relatively \"safe\": <br><a href=\"http://www.cameronmoll.com/misc/foldout1.gif\" target=\"_blank\">http://www.cameronmoll.com/misc/foldout1.gif</a> <br> <br>Now here's the same piece with Clarendon, a bit shy of the norm and somewhat daring: <br><a href=\"http://www.cameronmoll.com/misc/foldout2.gif\" target=\"_blank\">http://www.cameronmoll.com/misc/foldout2.gif</a> <br> <br>Does the Clarendon headline fly? Or is it too daring? Feedback appreciated. <br> <br>(If you'd prefer to see other pages to get a better feel, lemme know.)</p>"
