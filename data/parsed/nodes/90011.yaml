  html: |-
    <p>I'd like to use Hoefler Text for setting text but one annoying feature I can't turn off is the final form of some italic letters (n, m, t). I'm using a Mac and, no matter what I do, if the text is in italic and that letter is not followed by a word or a point, it turns out with the "fancy" final form, which can't be changed even using the typography options. Even if I de-select glyph variants, and chose the variant form I want, it is not changed in the text (see image).<br>
    Is this a feature of the specific font, its version, or the OS?</p>
    <p>In that case, should I just move on and use another font?</p>
