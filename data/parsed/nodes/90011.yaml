    date: 2012-02-13T15:09:00
    date_raw: 13 Feb 2012 — 3:09pm
    votes: null
    html: "<p>\"Overlapping characters\" does nothing. There must be something automatic with Apple software -- if I put a dot after the character, it goes back to \"normal\". There is a trick I've found out that can result in the desired effect, though: if I press \"tab\" within italics, or if I place a character at the end of the text after a lot of tabs (no \"enter\", though), glyph variants don't appear. I guess that can be done with headings, but with running, long text it's too much work.</p>"
    html_clean: "<p>\"Overlapping characters\" does nothing. There must be something automatic with Apple software -- if I put a dot after the character, it goes back to \"normal\". There is a trick I've found out that can result in the desired effect, though: if I press \"tab\" within italics, or if I place a character at the end of the text after a lot of tabs (no \"enter\", though), glyph variants don't appear. I guess that can be done with headings, but with running, long text it's too much work.</p>"
