    html: <p>In TextEdit 1.5 on OS X 10.5.8 I can turn off the final swashes in Hoefler Text using the Smart Swashes part of the Typography panel. Did you make sure "Word Final Swashes" (or equivalent in your language) is unchecked?</p>
