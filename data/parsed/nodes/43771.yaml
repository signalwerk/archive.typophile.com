    <p>Hi there,</p>
    <p>To all Tokyo typophiles, Christian Schwartz will be giving a talk about his work and type in general, next Tuesday, April 8th. The talk will be bilingual (Ja/En), with Q&amp;A and an hour of chit chat and mingling afterwards. </p>
    <p>The talk is presented by Tokyo Art Beat, and will be hosted by myself. </p>
    <p><a href="http://www.tokyoartbeat.com/event/2008/073D" rel="nofollow">More info about the event on Tokyo Art Beat</a></p>
    <p>To give a preview of the event to TAB's audience, I did an <a href="http://www.tokyoartbeat.com/tablog/entries.en/2008/03/christian-schwartz-on-type-design.html" rel="nofollow">interview with Christian on TAB's blog</a>.</p>
