      <p>Looks pretty good to me so far, but I'm sure others with more authority in inspecting the curves will have more to say about  that than I.</p>
      <p>The internal up-hooks in the h, k, m, and n are pretty distracting to me, as they interrupt the flow of what one expects to see as a single stroke. Likewise with the top loops on b, d, h, k, and l, though it seems more of a stylistic decision than the afforementioned up-hooks. At least by the way I learned cursive, the connecting stroke from the b should come from the top, similar to the o and v, so this one looks a bit off to me.</p>
      <p>Are your connecting strokes attached before or after the letters?</p>
