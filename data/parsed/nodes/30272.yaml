      <p>Hey chillypepper!</p>
      <p>Good work! </p>
      <p>Thers's go my humble opinion:</p>
      <p>I believe that there are some forms that do not get along between them, if one watches the system as a whole.</p>
      <p>The stroke modulations and its relation with a pen are strange in "A".<br>
      There are thickenings and refinings where it must not have them (c,g,z,x, etc). Counterforms are unbalanced in some letters (f,z). </p>
      <p>The final strokes (that small hook) of (h,k,m,n) I would make them subtler. </p>
      <p>And finally, it seems to me that the "x" and "z" deserves a redesign. "z" looks like it has a big head and "x" seems not to be part of this group.</p>
      <p>Sorry about my english, hope I has been clear...</p>
      <p>Best regards!</p>
