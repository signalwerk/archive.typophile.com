      <p>I think the 'h', 'k', 'm', and 'n' don't need the little hooks on their first strokes. Rounding them (like the top of 'u') might look better.</p>
      <p>If you're really worried about the 'b' not connecting, you could try making it look like your 'v' with an ascender.</p>
      <p>Overall, this is a really fun and tasty script. I like the direction you're taking with the caps 'A' as well.</p>
      <p> - Lex</p>
