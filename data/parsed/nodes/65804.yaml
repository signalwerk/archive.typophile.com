    <p>I am proud to announce that this February I will be presenting a portion of my graduate research at the Fourth International Conference on Design Principles and Practices in Chicago. I will be presenting a paper I wrote (co-authored by my supervisor, Professor Raymond Klein) titled <strong><a class="freelinking external" href="http://g10.cgpublisher.com/proposals/139" rel="nofollow">In search of the font effect: the effect of conﬂict upon reading and naming typefaces serially</a></strong>. This will be my ﬁrst conference presentation.</p>
    <p>For more information you may visit <a class="freelinking external" href="http://designprinciplesandpractices.com/Conference-2010/" rel="nofollow">the conference website</a> where they have posted <a class="freelinking external" href="http://g10.cgpublisher.com/program-detail.html" rel="nofollow">a preliminary schedule</a>.</p>
    <p>Thank you and happy new year.</p>
