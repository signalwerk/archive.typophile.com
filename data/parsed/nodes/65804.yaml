      <p>Congratulations Christopher!</p>
      <p>The talk that Papazian cited is certainly relevant to your research. Lewis &amp; Walker built upon the Stroop effect by showing that word recognition is improved when font characteristics like heaviness match words that carry the semantic characteristic of heaviness (rhinos are heavy, while rats are light).</p>
      <p>Lewis &amp; Walker:  <a href="http://www.psych.lancs.ac.uk/people/uploads/PeterWalker20061116T111653.pdf" title="http://www.psych.lancs.ac.uk/people/uploads/PeterWalker20061116T111653.pdf">http://www.psych.lancs.ac.uk/people/uploads/PeterWalker20061116T111653.pdf</a></p>
      <p>Collaborators and I have built on Lewis &amp; Walker’s research by showing that other kinds of characteristics built into fonts also can improve word recognition when paired with words that carry that semantic characteristic. For example a font can range on formality from formal to informal. People are faster to recognize formal words in a formal font and informal words in an informal font.</p>
      <p>I have tentatively proposed this as the key difference between serif and sans serif typefaces.</p>
    html_clean: |-
