      <p>Bringhurst and many others have said that you need to read the text you are setting before selecting an appropriate type. My study confirmed this observation. The style of the font needs to match the style of the content for the best reading experience.</p>
      <p>The finding also means that studies of legibility are not leading us towards one font to rule them all. Many fonts are necessary in order to match many kinds of content.</p>
      <p>John: <em>Can you tell whether that is due to positive reaction in the case of matched form and content or to negative reaction to mismatched form and content? </em></p>
      <p>In order to answer that question you would need words that are 1) consistent, 2) inconsistent, and 3) neutral with the font being presented. My study and Lewis &amp; Walker only used consistent and inconsistent words. That would be an interesting next step.</p>
