      <p>@ Hudson and Larson: The best article I have read about Stroop (other than Stroop's 1935):</p>
      <p>MacLeod, C. M. (1991). Half a century of research on the Stroop effect: An integrative review. <em>Psychological Bulletin. 109(2)</em> 163 – 202. </p>
      <p>Regarding "<em>Can you tell whether that is due to positive reaction in the case of matched form and content or to negative reaction to mismatched form and content?</em>"</p>
      <p>MacLeod (1991) describes what he calls a "congruency effect." In this section he cites several studies, most of which were colour naming tasks. One conclusion was that time to name congruent stimuli was indeed faster than time to name incongruent stimuli. However the difference in time between neutral and congruent stimuli was less than the difference between neutral and incongruent stimuli. I do not have access to their data to attest to the statistical significance of their findings. Overall, an excellent read for anyone interested in anything Stroop.</p>
    html_clean: |-
