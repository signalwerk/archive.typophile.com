      <p>I'm not sure that shows the dominance of reading.<br>
      Certainly, if the question is put <strong>in text</strong> "what typeface is this?" the answer, in words, may well be what the text signifies. However, flash the subject "Helvetica" set in Times, and then ask him to choose which typeface it was from a selection of various "a"s in different typefaces. I suspect he would choose Times, not Helvetica. "Read and identify," not "read and name."</p>
      <p>Has anyone re-done the Stroop test in a similar fashion?<br>
      That would be, flash the word "black" in red, and then have the subject pick the colour from a palette of square swatches.</p>
      <p>Beyond a pointed rebus-concept headline, the idea that type may match the semantic meaning of text is banal.<br>
      Self-referentiality, in which text refers to its own appearance, is a parlour trick, an art gallery amusement, a game of <em>double entendre</em>, nothing more. Ceci n'est pas une pipe.</p>
      <p>Nonetheless, I do love the concrete poetry of type specimens.</p>
