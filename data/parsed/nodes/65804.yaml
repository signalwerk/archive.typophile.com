    html: |-
      <p>Christopher, Macleod's congruency effect is certainly interesting, but I think we need to be careful in extrapolating from simple visual or property congruence (e.g. <strong>heavy</strong> vs. heavy; <strong>rhinoceros</strong> vs. <strong>squirrel</strong>) and more abstract, culturally engendered associations such as formal/informal. I'd want to see evidence that the same kind of congruency effect accounts for the latter and not a higher level aversion to incongruent form and content.</p>
      <p>One of the reasons that I found the study that MS sponsored on ‘personality’ in typefaces problematic is that most of the keywords used were ones that we've been trained to associate with certain styles of typography by their use in advertising. So typeface ‘personality’ seems to me a self-reinforcing construct: the more times people see Didot used in fashion magazines, the more likely they will be to associate Didot with ‘elegance’. And of course, if you are asking participants to select keywords from provided lists, rather than to explain the associations they make in their own words, one is filtering out a lot of potentially interesting variance. I'm the guy who'd be describing Didot as decadent :)</p>
      <p>I'm doubtful that congruence at this level of abstraction functions in quite the same way as simpler visual or property congruence. At the very least, the associations involved are more nuanced and variable.</p>
    html_clean: |-
