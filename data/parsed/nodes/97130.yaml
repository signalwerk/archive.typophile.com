      <p>Futura seems much better to me, and I have to disagree, Hrant, it can be really beautiful, if used correctly. I saw a book by Paul Renner completely set in a heavier cut of futura, and it is gorgeous. I also love the Isotype displays. But then again I also like Bodoni, if used right... :P</p>
      <p>I have Lanstons Twentieth Century Pro, which has only one weight, but it does also have all the extra characters Renner designed for Futura, but were never issued (until the digital age, that is), so in a sense this is even more authentic than Futura....</p>
