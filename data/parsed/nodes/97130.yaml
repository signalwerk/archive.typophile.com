      <p>Some quick identifiers of Twentieth Century:</p>
      <ul>
      <li>the round counters such as in the lowercase b and d are more nearly perfectly circular</li>
      <li>the ascenders and descenders are shorter</li>
      <li>the dots on the lowercase i and j are bolder and closer to the stems</li>
      <li>the crossbar on the lowercase f extends farther to the left</li>
      <li>the counter in the lowercase e is vertically narrower (the entire outer shape of the e is more nearly perfectly circular)</li>
      <li>the 4 is wider and the angle on the diagonal closer to 45°</li>
      <li>the asterisk is flower-shaped, with rounded terminals</li>
      </ul>
      <p>David</p>
