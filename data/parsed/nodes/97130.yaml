      <p>If you’re a stickler for authenticity, then Futura is the only choice. The choice then becomes which cut.</p>
      <p>That aside, to my eye, Futura, at least in the lighter weights, seems more elegant, probably due to the fact that it is slightly lighter and has longer ascenders and descenders. Use Twentieth Century for a truckers’ convention, Futura for a fashion show.</p>
