      <p>Futura is one of the most important fonts of all time if you ask me, never seen the other.  That said, Futura can be a little stale in some ways.  I find myself using the caps in the extra bold often for display work however, while almost never using any other weight in the family for anything. </p>
      <p>So many other fonts flowed from Futura like saplings from a father tree, it influenced quite a lot.  Every Geometric font ever made owes something to Futura. For that at least, Futura is Great.</p>
