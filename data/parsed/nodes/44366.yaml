    <p>I am completing a font which I have traced in Fontlab. I am currently trying to clean up the font, removing overlapping points etc, and I have noticed there are lots of grey arrows on some glyphs. (See image)</p>
    <p>Can somebody tell me what this means and what I should do about it. </p>
    <p>Also is there a way of removing single points or incomplete paths automatically?</p>
    <p>Thanks in advance!</p>
