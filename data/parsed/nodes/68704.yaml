    html: <p>As a manufacturer of film fonts during the 80s. I found Handel Gothic Bold and Light a popular seller. Faces like Blippo Bold, Yagi Double (CNN logo) were also popular. Some of the basic display fonts had added swash characters. Alphabet Innovations had some very popular franchised fonts.</p>
