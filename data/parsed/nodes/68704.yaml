    html: |-
      <p>ITC Garamond and ITC Berkeley especially have the fine details for display.<br>
      Make sure to set them reeeeeeeal tight.<br>
      In fact, that style of setting is more significant as a marker of the era than the choice of typeface.<br>
      This from Typsettra:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/BarB2_4527_5030.jpg"></div><p></p>
      <p>But that tight look for headlines, which began in the 1960s, was passé by mid decade, replaced by heads that were tracked out.</p>
      <p>That was for mainstream.<br>
      Alternatively, Punk was the look 1977-1984, with collaged heads where many fonts were mashed up in the same sentence.<br>
      Again, mid-decade, that changed. Neville Brody introduced Industria in the London scene magazine <em>The Face</em> in 1984, heralding a structured look.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/the-face-nov-1984_4420.jpg"></div><p></p>
      <p>So there you have it, four "eighties" type looks, depending whether you go straight or alternative, early decade or late.</p>
