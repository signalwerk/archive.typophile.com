    html: <p>That's an artifact of Fontstruct. I think the rendering on the site is still done with the separate blocks intact, so the slope isn't a continuous line. If that effect carried through to the finished font, it would mean the angles on those blocks don't match, which I hope would be too big a blunder to expect of FontShop.</p>
