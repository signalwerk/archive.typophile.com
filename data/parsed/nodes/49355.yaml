    <p>Hi. I'm working on sencilla in fontstruct. It's the font with more characters in all the website. It has Latin, Cyrillic, Extended Latin, Hebrew, Greek, Armenian, Coptic, Arabic. If you read or write some of this languages please help me to fix my mistakes. You can see and dowloand it at: <a href="http://fontstruct.fontshop.com/fontstructions/show/4701" title="http://fontstruct.fontshop.com/fontstructions/show/4701">http://fontstruct.fontshop.com/fontstructions/show/4701</a><br>
    I forgot to introduce myself. I'm Diego Sanz Salas, peruvian 24 years old. I love typography and Sencilla is my first font. </p>
    <p>Thank you</p><div class="imageWrap"><img src="http://typophile.com/files/sencilla_5803.gif"></div><p></p>
