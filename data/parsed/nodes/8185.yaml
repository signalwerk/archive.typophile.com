  html: "<p>Phil's Fonts End of the Year News! <br><a href=\"http://www.philsfonts.com\" target=\"_blank\">http://www.philsfonts.com</a> <br> <br>--------------------------------------------------- <br>FontFont 35 - The FontFonts keep on flowin'! <br> <br>The latest releases from FontFont have arrived! FontFont 35 includes new designs such as FF Absara, FF District, FF Hydra Text, FF Nexus Mix, Nexus Sans, and Nexus Serif. Updates to FF Bau, FF Max, and FF Signa have been released as well. FontFont has also generated a few Opentype versions of these fonts, which will be available at Phil's soon. More good news! All FontFont fonts have been discounted 10% until year's end.  <br> <br>Here's a link to the FontFont 35 release: <br><a href=\"http://www.philsfonts.com/sresults.html?key=4&amp;fcs=ff35\" target=\"_blank\">http://www.philsfonts.com/sresults.html?key=4&amp;fcs=ff35</a>  <br>800-424-2977  |  301-260-2280 <br> <br>---------------------------------------------------- <br>ABC Types - A New Addition <br> <br>We are excited to introduce ABC Types to our large array of type foundries. Check out Generation Gothic, a clean, friendly sans serif design suitable for magazine headlines and subheads. Need something new for posters or book titles? Try Poster Gothic. It's a flavor of the post industrial age and is available in solid bold, double line, inline, and shadow. <br> <br><a href=\"http://www.philsfonts.com/sresults.html?key=4&amp;fcs=abctypes100104\" target=\"_blank\">http://www.philsfonts.com/sresults.html?key=4&amp;fcs=abctypes100104</a>  <br>800-424-2977  |  301-260-2280 <br> <br>---------------------------------------------------- <br>Opentype at Phil's <br> <br>Phil's Fonts is happy to offer the Opentype collection from Linotype Library, which includes designs cross-licensed from Adobe. Browse, search, and view full character sets and pdf specimens from over 1,800 carefuly crafted Opentype designs. Opentype - the font format of the future.  <br> <br><a href=\"http://www.philsfonts.com/opentype_info.html\" target=\"_blank\">http://www.philsfonts.com/opentype_info.html</a>  <br>800-424-2977  |  301-260-2280 <br> <br>----------------------------------------------------- <br>Year End Specials! <br> <br>20% off all Red Rooster Fonts*: <br>Through the end of the year you can take advantage of this fantastic offer. All Red Rooster fonts are crafted to the highest professional standards. The basic letterfit and kerning is meticulously perfected, allowing you to produce effortless, top-notch typography.  <br> <br>Some of our Rooster favorites - the very graphic Block Gothic and Byron,  perfect for your designs that need a touch of flair. Doing a poster? Try the condensed, slab serif of Grand Canyon. *Discounts apply to single fonts and packages, not libraries. <br> <br><a href=\"http://www.philsfonts.com/sresults.html?key=5&amp;fcode=RR\" target=\"_blank\">http://www.philsfonts.com/sresults.html?key=5&amp;fcode=RR</a>  <br>800-424-2977  |  301-260-2280 <br> <br>10% off all FontFont packages*: <br>Amazing typeface designs from the FontFont collection: FF Meta, FF Scala, FF Scala Sans, FF Celesta, FF DIN, FF Seria FF Unit and on and on. Some of the most popular and usable in the world. *Discounts apply to font packages only, not libraries. <br> <br><a href=\"http://www.philsfonts.com/sresults.html?key=5&amp;fcode=FF\" target=\"_blank\">http://www.philsfonts.com/sresults.html?key=5&amp;fcode=FF</a>  <br>800-424-2977  |  301-260-2280 <br> <br>----------------------------------------------------- <br>Looking for Font Libraries?  <br> <br>Check out these sales� Enough savings to buy an iPod and thousands of tunes! <br><a href=\"http://www.philsfonts.com/librarysales_1204.html\" target=\"_blank\">http://www.philsfonts.com/librarysales_1204.html</a> <br>800-424-2977  |  301-260-2280 <br> <br>FontFont Library: <br>The FontFont Library is the world�s largest collection of original, contemporary typefaces. What makes the FontFont Library unique is its wide variety of outstanding type designs. The spectrum of styles ranges from tasteful, high-quality text faces to eye-catching display fonts to terrifying �destructive� fonts to amusing �fun� fonts that reflect current moods and often set new typographic trends. The Library includes the work of some of the world�s foremost typographers and graphic designers such as Neville Brody, Erik Spiekermann, David Berlow, Max Kisman, Erik van Blokland, Just van Rossum, Tobias Frere-Jones and many, many more. Currently the FontFont Library includes over 2700 fonts and continues to grow steadily, adding new typefaces every year. FontFont constantly breaks new ground in style, quality and innovation with their �cutting edge� typeface designs. <br> <br>SAVE $4,751: Enough to buy one iPod and over 4,000 tunes! <br>FontFont Library Vol 1-35 - 2,700 fonts <br>20 CPU License <br>Includes Mac Postscript, PC Postscript and PC Truetype <br>Regular cost is $14,400 - Special price until December 31, 2004 is $9,649. <br> <br><a href=\"http://www.philsfonts.com/librarysales_1204.html\" target=\"_blank\">http://www.philsfonts.com/librarysales_1204.html</a> <br>800-424-2977  |  301-260-2280 <br> <br>Linotype GoldEdition�: <br>Linotype's GoldEdition� is the most comprehensive product of Linotype Library and <br>contains all important typefaces available through Linotype Library. <br> <br>SAVE $890: Enough to buy one iPod and over 640 tunes! <br>Linotype GoldEdition 1.7 - 3,980 fonts <br>20 CPU License  <br>Mac &amp; PC Fonts Included <br>Regular price $8910 - Special price until December 31, 2004 is $8,019.    <br> <br>SAVE $500: Enough to buy one iPod and over 250 tunes! <br>Linotype GoldEdition 1.7 - 3,980 fonts <br>10 CPU License  <br>Mac &amp; PC Fonts Included <br>Regular price $4990 - Special price until December 31, 2004 is $4,489. <br> <br><a href=\"http://www.philsfonts.com/librarysales_1204.html\" target=\"_blank\">http://www.philsfonts.com/librarysales_1204.html</a>  <br>800-424-2977  |  301-260-2280 <br> <br>Download a PDF listing all the fonts on the GoldEdition 1.7 CDs:  <br><a href=\"http://www.philsfonts.com/downloads/GoldEdition.pdf\" target=\"_blank\">http://www.philsfonts.com/downloads/GoldEdition.pdf</a> <br> <br>GarageFonts Library: <br>840 fonts, includes the new GF release Freight, a 60 font family by Josh Darden. <br> <br>SAVE $256: Enough to buy one iPod and a little left over for a few tunes!  <br>20 CPU License   <br>Includes Mac Postscript, PC Postscript and PC Truetype <br>Regular price $2,995 - Special price until December 31, 2004 is $2,739. <br> <br><a href=\"http://www.philsfonts.com/librarysales_1204.html\" target=\"_blank\">http://www.philsfonts.com/librarysales_1204.html</a>  <br>800-424-2977  |  301-260-2280 <br> <br>----------------------------------------------------- <br>Christmas Presents <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\">  <br>It's time to start buying holiday gifts for your favorite type nut! <br>   <br>Start them off with the unique \"Your Favorite Font Sucks\" T-shirts from our boutique foundry, GarageFonts. Only $10.95 plus shipping.  <br> <br><a href=\"http://www.philsfonts.com/gfshirt.html\" target=\"_blank\">http://www.philsfonts.com/gfshirt.html</a> <br>800-424-2977  |  301-260-2280 <br> <br>On the more serious side try the book INDIEFONTS 1. This is a limited edition compendium of digital type from independent foundries. It is the first edition of two books. It features specimens of 2000 fonts from 18 foundries and a CD-ROM with 33 free fonts. This hard bound book, divided by foundry, includes a visual font index and a fully cross referenced index by font names and designers. Only $34.95 plus shipping! <br> <br><a href=\"http://www.philsfonts.com/detail.html?sku=GF00100201M1\" target=\"_blank\">http://www.philsfonts.com/detail.html?sku=GF00100201M1</a> <br>800-424-2977  |  301-260-2280 <br> <br>And take a look at these terrific products. These collections are a great way to get lots of fonts at reduced prices.: <br>- Linotype Compilations: <a href=\"http://www.philsfonts.com/licomps.html\" target=\"_blank\">http://www.philsfonts.com/licomps.html</a> <br>- FontFont Pro Series: <a href=\"http://www.philsfonts.com/ffprofseries.html\" target=\"_blank\">http://www.philsfonts.com/ffprofseries.html</a> <br> <br>----------------------------------------------------- <br>Here are some catchy typefaces you should check out. <br> <br>Metroflex - Think silent film \"Metropolis\" by Fritz Lang: <br><a href=\"http://www.philsfonts.com/sresults.html?key=4&amp;fcs=PFNEWS1204\" target=\"_blank\">http://www.philsfonts.com/sresults.html?key=4&amp;fcs=PFNEWS1204</a> <br> <br>FF Atma - Big typeface family for that big job:  <br><a href=\"http://www.philsfonts.com/showing.html?sku=FF011264X1P2&amp;start=1\" target=\"_blank\">http://www.philsfonts.com/showing.html?sku=FF011264X1P2&amp;start=1</a> <br> <br>Livery - I'm thinking woodcut, western, big slab serif: <br><a href=\"http://www.philsfonts.com/showing.html?sku=GF090001X1P2&amp;start=1\" target=\"_blank\">http://www.philsfonts.com/showing.html?sku=GF090001X1P2&amp;start=1</a> <br> <br>Eunoia - This will put you in a normal mental state: <br><a href=\"http://www.philsfonts.com/showing.html?sku=SH000017X1P2&amp;start=1\" target=\"_blank\">http://www.philsfonts.com/showing.html?sku=SH000017X1P2&amp;start=1</a> <br> <br>District - For your corporate ID: <br><a href=\"http://www.philsfonts.com/showing.html?sku=GF095002X1P2&amp;start=1\" target=\"_blank\">http://www.philsfonts.com/showing.html?sku=GF095002X1P2&amp;start=1</a> <br> <br>Chicken Parts - Cooked and frozen: <br><a href=\"http://www.philsfonts.com/showing.html?sku=GF07800101P2&amp;start=1\" target=\"_blank\">http://www.philsfonts.com/showing.html?sku=GF07800101P2&amp;start=1</a> <br> <br>Dotminatrix - Nice looking wall tiles: <br><a href=\"http://www.philsfonts.com/showing.html?sku=GF05700401P2&amp;start=1\" target=\"_blank\">http://www.philsfonts.com/showing.html?sku=GF05700401P2&amp;start=1</a> <br> <br>----------------------------------------------------- <br>And Finally� <br> <br>We're in a gift-giving mood, and we're offering up District Thin, part of the great District typeface family from GarageFonts.  <br> <br>Enjoy: <a href=\"http://www.philsfonts.com/freefont.html\" target=\"_blank\">http://www.philsfonts.com/freefont.html</a> <br>800-424-2977  |  301-260-2280 <br> <br>Freight is coming! The amazing new typeface from Josh Darden and GarageFonts will be rolling into town this month. Keep your eyes and ears open.  <br> <br>Happy Holidays from the Phil's Fonts crew! <br>----------------------------------------------------- <br>Phil's Fonts, inc. <br>501 Olney Sandy Spring Road, Suite 201, Sandy Spring, MD 20860 USA <br>Tel: 800-424-2977 or 301-260-2280  Fax: 1-301-260-2277 <br>Email: <a href=\"mailto:sales@philsfonts.com\">sales@philsfonts.com</a> <br>Website: <a href=\"http://www.philsfonts.com\" target=\"_blank\">http://www.philsfonts.com</a> <br>Copyright (c) 2004 Phil's Fonts, Inc.</p>"
