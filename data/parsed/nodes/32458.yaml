      <p>I think this is a Mac+Adobe problem. Sometimes I’ve had contextual features not show up in certain applications unless the font is installed directly to the Adobe Fonts folder. Try installing the font there and see if the problem persists, if the problem is fixed, then I’m guessing the font is fine, but OS/App handling is the culprit.<br>
      I’m assuming that you’re testing the font on a Mac, have you tried it on a PC? If so, do you notice the same problem?</p>
