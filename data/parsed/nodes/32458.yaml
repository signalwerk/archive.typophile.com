    <p>I’m finishing up a script font that uses <code>calt</code> (Contextual Alternates) to pick appropriate glyphs depending on where they fall in a word—mainly selecting different glyphs for the beginning and ending of lowercase runs, but not exclusively. All is working exactly as it should in InDesign (CS, CS2), Illustrator (CS, CS2), and Quark 7. </p>
    <p>However, Photoshop (CS, CS2, and CS3-beta) is not cooperating. It does not seem to recognize that the feature is present (it’s grayed out in the OT feature menu). Not only this, it seems to think my font has a <code>titl</code> feature instead—which it does not. </p>
    <p>I’m using FLS5 (Mac) and generating OT CFF fonts. What’s going on with this? Anybody run into this problem before?</p>
