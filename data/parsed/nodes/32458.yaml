      <p>Two of the systems I tried it on are Intel Macs—a Mac Pro tower and a MacBook Pro. Both of these also have the Photoshop CS3 beta installed on them. Both are running 10.4.9. On the MacBook Pro, the calt feature works, but it’s grayed out and checked (on by default, I presume) and the Titling Alternates feature is enabled, even though it doesn’t exist in the font. </p>
      <p>I also tried it on a PowerMac Dual G5 tower (Photoshop CS2, 10.4.8) and had the same results as the Mac Pro. This computer did not have the CS3 beta installed.</p>
      <p>In some cases (on the Mac Pro), when I was trying different OT output settings in FL, Oldstyle Figures would be enabled instead of Titling Alternates.</p>
