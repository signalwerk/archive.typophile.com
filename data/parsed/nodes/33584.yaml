  html: |-
    <p>I’m searching for an application that can display <em>uninstalled</em> fonts I drop on it. I just got this Mac Pro box, and the app I used before (XFontInfo) is not universal binary. Anyway it would be nice to have an app that could take whole folders of fonts and display them, that could XFontInfo not do. I don’t want to install Linotype’s Fontexplorer as it gets in my way with its caching and auto-this and auto-that. Mac OS X’s fontbook preview window is way to small to be usable.</p>
    <p>There is a host of font viewers on versiontracker, but I have yet to find one that simply works. Are there any applications that you have tried and can recommend?</p>
