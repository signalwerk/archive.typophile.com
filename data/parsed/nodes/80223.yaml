      <p><em>Is it a French word? Usage of "sans" in English goes back to Shakespeare, at least.</em></p>
      <p>The language in which Shakespeare wrote owes a great deal to the influence of Norman French on Old English. And, the OED says the preferred pronunciation of <em>insouciance</em>, a pure borrow from French, is the Anglicized pronunciation, so go figger...</p>
