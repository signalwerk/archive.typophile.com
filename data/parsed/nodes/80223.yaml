  html: <p>There are a lot of sans-serif fonts out there, many of which put "Sans" in the typeface name such as <a class="freelinking external" href="http://www.exljbris.com/callunasans.html" rel="nofollow">Calluna Sans</a>, <a class="freelinking external" href="http://dejavu-fonts.org/wiki/Main_Page" rel="nofollow">Deja Vu Sans</a>, <a class="freelinking external" href="http://new.myfonts.com/fonts/linotype/gill-sans/" rel="nofollow">Gill Sans</a>, <a class="freelinking external" href="http://www.identifont.com/show?3RV" rel="nofollow">Scala Sans</a>, etc. Being a Canadian, sometimes I'm torn between saying /sænz/ in English or /sɑ̃/ in French. Which one???</p>
  html_clean: <p>There are a lot of sans-serif fonts out there, many of which put "Sans" in the typeface name such as <a class="freelinking external link-external" href="http://www.exljbris.com/callunasans.html" rel="nofollow">Calluna Sans</a>, <a class="freelinking external link-external" href="http://dejavu-fonts.org/wiki/Main_Page" rel="nofollow">Deja Vu Sans</a>, <a class="freelinking external link-external" href="http://new.myfonts.com/fonts/linotype/gill-sans/" rel="nofollow">Gill Sans</a>, <a class="freelinking external link-external" href="http://www.identifont.com/show?3RV" rel="nofollow">Scala Sans</a>, etc. Being a Canadian, sometimes I'm torn between saying /sænz/ in English or /sɑ̃/ in French. Which one???</p>
