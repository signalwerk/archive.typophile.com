    date_raw: 20 Mar 2011 — 2:46pm
    votes: null
    html: <p>The OED has an entry for "sans" where "sans pareil", "sans cérémonie" etc are mentioned,   but there is a separate entry for sanserif, where there is no reference to French. Since I see "Calluna sans" as an abbreviation for "Calluna sanserif", I see no reason to make it sound French.</p>
