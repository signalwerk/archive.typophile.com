      <p>I go with [sænz] in an English context, or, if I'm feeling particularly elegant, [sɑnz]. Of course, the French pronunciation is arguably more correct, as it is a French word. However, it's been accepted into English with an English pronunciation in other contexts as well.</p>
      <p>Josh</p>
