      <p>Florian,</p>
      <p>First, my apologies for taking so long to respond. Work took over most of my week.</p>
      <p>Regarding Prillwitz, it’s nice actually, but speaking only personally, it just doesn’t have the same impact for me, though I’m at a loss to explain why.</p>
      <p>On the other hand, Givry is lovely! Thank you so much for recommending it. I’ve added it to my (growing) list of typefaces to buy (thanks a lot! ).</p>
      <p>Before I say anything more, let me again repeat that I am not a professional typographer. My opinions are formed only what (little) I have learned on my own, and my profound love for the written word.</p>
      <p>Thank you sharing those two threads with me. I learned a lot from them, especially the second one regarding keyboard links. I was completely unaware of the issue until I started reading about it on this site. It certainly seems like an issue the industry should address, and perhaps it is. it can be exciting to come in on something like this and perhaps even contribute to the discussion. I was a Windows user, and just this past May bought a Mac Pro (I still love Vista and installed it via Fusion on my computer), but I am completely in love with my Mac. There are things Windows does differently, of course, and some things that, well, it does better. I wouldn’t be surprised to find that handling type isn’t one of them.</p>
      <p>I can see now that I will have to make some Global Styles to avoid this problem.</p>
      <p>As for adding bold (or bold italic) to a typeface, I have to confess I’m probably still more for it than against it. Now, I don’t design type, and therefore I don’t know how hard it must be, though I can at least make a decent guess. When I think back on most of the works of fiction I’ve read, I can readily admit that bold was not used, or at least unnecessary. That realization alone was eye-opening. However, it is clear from reading a couple threads that spun off from “Why doesn’t Cycle’s have bold…” that there was a desire, a legitimate desire for emphasis, and not only for commercial works but academic as well. Perhaps I’ll have to purchase some Clarendons now as well.</p>
      <p>I certainly respect a designer’s decision not to include bold and bold italic, but I hope some will consider it, or perhaps at least make suggestions for other typefaces they feel complement their own work and provide that extra level of emphasis which some designers may wish for or need.</p>
      <p>What an amazingly great resource this site is!</p>
      <p>My thanks for your advice and suggestions,</p>
      <p>Keith</p>
      <p>Fabricando fabri fimus.</p>
