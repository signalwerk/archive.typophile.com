    <p>I have been reading this site for just under a year, and I’m deeply impressed by what I have read and by the people who have written it. I am nothing like a professional, so I hesitate writing this; I hope you’ll forgive me if I express myself poorly or use incorrectly what little terminology I know.</p>
    <p>I am in the process of trying to build a quality (professional?) typeface collection. This will likely be a life-long process, and I hope I have taken a couple steps in the right direction, but it’s time to move forward a bit farther.</p>
    <p>My first purchase was Brioso Pro (opticals) from Adobe when it first came out. I’ll never forget the day I received the type magazine from Adobe in the mail: I devoured the article on the new typeface. Looking at the examples on the page, I saw through the Italian Renaissance all the way back to the Carolingian—and on back to Rome and Greece. I had never been so impressed with a modern serif. I had to have it and purchased it immediately. I love this typeface; I feel fortunate to own (license) it.</p>
    <p>A while ago, I was trying to find a really good sans serif that I would love and want to use as much as Brioso. I posted on here asking for advice and received some great suggestions. I’m still looking, but I have narrowed down the field to a few choices: Helvetica Neue, Avenir, and Gotham. While I was looking at Gotham, I discovered H&amp;FJ. And then I discovered Requiem and the Historical Allsorts collection. Requiem. What a beautiful and elegant typeface. I think of Brioso when I look at it, and have the same historical telescoping sensation. And the Allsorts collection, not surprisingly, has a similar impact upon me.</p>
    <p>This past Friday and Saturday, I spent hours and hours researching Requiem (with the occasional sidetrack), a great deal of it here on this site (along with the H&amp;FJ site) and I learned a few things which caught me by surprise.</p>
    <p>I hesitate mentioning the first thing that surprised me because it’s clear that there’s some…disagreement…on this site around this issue, but, there are no bold (or semi-bold) fonts for Requiem or Fell (Allsorts). I never even noticed that during all my visits to H&amp;FJ to look at the typeface. I’m really rather embarrassed that I didn’t notice the fact till I read a complaint about it here! Now, as soon as I read it, I thought back, and it’s true as some have said there seldom seems a need for it, at least in some instances, but it seems to me there are other uses where it would be handy (I’m thinking of examples from the Lewis &amp; Short Latin Lexicon and some other scholarly works). Bold fonts seem to give one more level of visual organization. Now, perhaps I could use Brioso for dictionary-type settings, and Requiem for other, more literary settings.</p>
    <p>In reading this site, here are the issues which concern me—and which no doubt show my lack of experience and training:<br>
    1) Proper superiors (do they exist for this typeface?)<br>
    2) Requiem’s lack of bold or semi-bold fonts (and other typefaces from H&amp;FJ)<br>
    3) The lack of OpenType formats<br>
    4) Style-linking (is this the right term…using keyboard commands to go from Roman to italic?)<br>
    5) The licensing, eg, saving my work as PDFs (at least the one from H&amp;FJ)</p>
    <p>OK, I’ve clearly strayed from my original intent of asking about expanding my typeface collection. Here is my current plan, funds permitting:</p>
    <p>I have Brioso, and through my research on here learned that I also have Arno Pro (lovely! Thank you CS3). This weekend I had intended to buy Requiem and the Historical Allsorts (currently on hold while I try to learn more). Next, I’d love to buy Hoefler Titling and Text—those patterns and fleurons are exquisite and I’d love to produce some Victorian-styled works. Then on to Adobe’s Garamond Premier Pro (opticals). Somewhere in there I also need to pick up one or more of the above-mentioned sans serif faces.</p>
    <p>I also have a strong attraction to Didot and Bodoni (but not…?…Bauer?).</p>
    <p>Oh, and if I might be permitted, could someone point me towards some quality reproductions of Medieval and Ancient scripts? I’m thinking particularly of various Gothic and Batarde scripts. I know there was a company that was doing some amazing digital reproductions of certain works (The Grammar of Ornament?). I thought the company’s name started with an “A” but I can’t find anything. Anyway, there are tons of knock-offs out there, but that’s not what I want.</p>
    <p>I have some friends who are priests, and one reason for some of my choices would be a personal project to create sections of the Office (Breviary) as gifts. I also have something of a scholarly leaning, so Garamond’s Greek (polytonic) is an added bonus. (I see there was a problem displaying polytonic Greek with Adobe’s Garamond (or InDesign CS2) at one point. I wonder if that’s been fixed?)</p>
    <p>Well, this is a much longer post than I had intended. Thank you for you patience, and I look forward to reading any replies!</p>
    <p>Regards,</p>
    <p>Keith</p>
    <p>PS I hope the “problems” I list for Requiem aren’t taken as anything but personal problems, and likely due to my own ignorance and lack of proper training! I am deeply impressed with H&amp;FJ, and the beauty and quality of their work. And may I just say the examples they use to illustrate each typeface’s potential are inspiring! I wish I could get a specimen PDF containing these examples when I buy the typeface! (Perhaps they do offer such a thing.)</p>
