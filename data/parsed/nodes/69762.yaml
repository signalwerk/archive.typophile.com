  html: |-
    <p>I have just taken up letterpress printing and have bought a collection of metal founts, some of which are easily identifiable, others less so. I have two blackletter founts that have got me stumped.  Images are incuded here - if anyone needs bigger, higher quality images of specific character, just ask.</p>
    <p>If it is of any help, I have amongst the type I have just purchased, quite a few that are clearly marked from the Stephenson Blake &amp; Co. foundry. There are no marks on the blackletter type itself, but there are one or two bits of spacing material with their mark, but I'm unsure whether the spacing was originally with the type.</p>
    <p>Any help or advice you can give would be very useful. Many thanks in anticipation of your response.</p>
    <p>Kind regards,</p>
    <p>Christopher Skinner<br>
    (Norfolk, England)<br><img src="/sites/default/files/old-images/blackletter-1_3949.gif][img:sites/default/files/old-images/blackletter-1-detail_6703.gif][img:sites/default/files/old-images/blackletter-2_5373.gif][img:sites/default/files/old-images/blackletter-2-detail_6535.gif"></p>
