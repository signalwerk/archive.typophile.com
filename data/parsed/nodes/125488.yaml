  html: |-
    <p>The attached FontLab script is intended to copy composites from specific, already existing glyphs in the PUA range, into new code points.<br>
    This is for a specific application which uses differently encoded fonts on Mac and Windows. Therefore, to make the font platform independent, the script has to make two copies of each PUA glyph, and paste them to different codepoints.</p>
    <p>The script works fine as long as it doesn't have to go through the glyph creation process twice in succession. However, when I try to create glyphs for both platforms in one go, the script crashes.</p>
    <p>I'm fairly new to scripting in fontLab and to Python in general, so I'm hoping someone here will spot the error pretty fast.<br>
    Any further constructive criticism on the code would also be most welcome.</p>
