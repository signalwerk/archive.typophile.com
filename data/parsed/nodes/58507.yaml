    html: |-
      <p>Daydream, </p>
      <p>if you want to use a free tool, you could either use FontForge to regenerate the TrueType hinting, or you could do something else: use Adobe FDK for OpenType to convert the font into OpenType PS (.otf) and autohint it at the same time. After installing the Adobe FDK for OpenType from <a href="http://www.adobe.com/devnet/opentype/afdko/" title="http://www.adobe.com/devnet/opentype/afdko/">http://www.adobe.com/devnet/opentype/afdko/</a> just type in Terminal/commandline the two lines one by one: </p>
      <p><code>makeotf -f RockoFLF.ttf<br>
      autohint -nb RockoFLF.otf</code></p>
      <p>and use the final RockoFLF.otf. The PostScript hinting model used in OpenType PS fonts tend to be more robust and less prone to "strange errors" caused by automatic hinting. </p>
      <p>Cheers,<br>
      Adam</p>
