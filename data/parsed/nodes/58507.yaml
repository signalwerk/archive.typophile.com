    <p>I recently downloaded a font, <a class="freelinking external link-external" href="http://www.fontsquirrel.com/fonts/RockoFLF" rel="nofollow">RockoFLF</a>, and have been loving it, except that I've noticed one small problem with it.</p>
    <p>Basically, when using the font in Illustrator CS4 (PC), I notice that sometimes the counters of the "a" and other letters go a bit crazy, and it makes the weight vary in some point sizes. But then the effect disappears in other point sizes. The screenshot below shows you what I'm talking about. The letters in black are how they should be, but the ones in pink show the errors. And the funny thing is it all corrects itself if I convert the text to paths.</p>
    <p>I'm wondering if this is a hinting problem with the font, and if it's possible to correct something like this in a free program like Fontforge?</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/rocko_4566.png"></div><p></p>
