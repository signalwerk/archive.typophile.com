    html: <p> Wow, something really new. Many many others have tried to introduce/adopt such iconoclasm in type design, but 99% have failed. <br> <br>Christian, I think you're really onto something here. Those sporadic but tempered quirks in an otherwise docile <br>design really work, to my surprise. Maybe put a spin on the UC "Y" as well? But it would have to be non-calligraphic. <br> <br>It seems to me that the biggest difficulty in such  an unorthodox design is to avoid over-rationalization, and trust your instincts. But at the same time don't fall into the "artiste" trap that renders a font unusable. <br> <br>Anyway, go all the way with this! <br> <br>hhp </p>
    html_clean: <p> Wow, something really new. Many many others have tried to introduce/adopt such iconoclasm in type design, but 99% have failed. <br> <br>Christian, I think you're really onto something here. Those sporadic but tempered quirks in an otherwise docile <br>design really work, to my surprise. Maybe put a spin on the UC "Y" as well? But it would have to be non-calligraphic. <br> <br>It seems to me that the biggest difficulty in such  an unorthodox design is to avoid over-rationalization, and trust your instincts. But at the same time don't fall into the "artiste" trap that renders a font unusable. <br> <br>Anyway, go all the way with this! <br> <br>hhp </p>
