    date_raw: 7 Nov 2001 — 10:37am
    votes: null
    html: <p> Yes, the kinks might be kind of gimicky. I'm not sure if they don't add some character, though. I might try making the curves a little more subtle. It all started with the lc f, who's shoulder ended up a straight line (a happy accident). I wanted to apply that same feeling to some other characters, hence the lc a, the uc G and even the Q (which has grown on me over the past few hours, though it will definitely be refined). <br> <br>Oh, I thought I'd explain the name. I had a high school teacher who (while she explained Aldus Freehand) thought bezier curves were called "beezers". </p>
    html_clean: <p> Yes, the kinks might be kind of gimicky. I'm not sure if they don't add some character, though. I might try making the curves a little more subtle. It all started with the lc f, who's shoulder ended up a straight line (a happy accident). I wanted to apply that same feeling to some other characters, hence the lc a, the uc G and even the Q (which has grown on me over the past few hours, though it will definitely be refined). <br> <br>Oh, I thought I'd explain the name. I had a high school teacher who (while she explained Aldus Freehand) thought bezier curves were called "beezers". </p>
