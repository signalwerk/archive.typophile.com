    html: "<p>Hi Christian. <br> <br>Here comes a shotgun blast of thoughts. <br>Much prefer the extended version at this point (for some reason I can't put my finger on) <br> <br>You've got to love the gj combo in german! <br> <br>In the regular width: <br>m: What up with the assymetry in width between the legs? <br>I vs l: That's capital *eye* versus lowercase *el*. They are quite similar (you're not alone here!) At one point in the french there is the word Il. Looks totally weird. Of course it's a weird word. <br>x: the / stroke looks ok. The \\ looks like it could use a more vertical stance. <br>E: I'd extend the middle bar. That's just me. <br></p>"
