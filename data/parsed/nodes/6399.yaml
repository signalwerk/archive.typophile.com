    date_raw: 7 Nov 2001 — 2:47am
    votes: null
    html: "<p> Christian, <br> <br>Don't let this one sit on the shelf like all your  <br>other beauties that taunted us once and we never <br>see again. <br> <br>There is great potential here. The replication of  <br>glyph parts has been done. Adding a human, <br>organic, hand drawn touch to a text font isn't  <br>often done - and when it is done, it rarely works.  <br>When it works, it's usually a design based in  <br>calligraphy (Zapf) or brush forms. <br> <br>Beezer is something new. It reveals clearly the use <br>of computer-based tools, but the human touch is still <br>evident. I'm interested to see how the quirks affect  <br>the font at small sizes (Flash doesn't exactly allow a  <br>good view of tiny type). I'd also love to see more of  <br>the Brush style. <br> <br>My favorite glyphs: \"a\",\"g\",\"l\" <br>Glyphs that make me extra glad: \"a\",\"g\" of Bold Study <br>The glyph that makes me sad (and might benefit  <br>from a more conservative approach): \"G\" <br> <br>I think those letters with more gradual curves work  <br>best. The sudden kinks of the \"G\", \"K\" \"R\" and \"Q\"  <br>(oops, was I supposed to ignore that?) are  <br>distracting and mar an otherwise clean design. <br> <br>Focusing on gentle curves still leaves room for your  <br>hand-massaged expirimentation and I think it works  <br>great on those glyphs I mentioned. <br> <br>Noting the method and the preview sample, I predict  <br>the Bold style will be the star of this family. <br> <br>Stephen </p>"
    html_clean: "<p> Christian, <br> <br>Don't let this one sit on the shelf like all your  <br>other beauties that taunted us once and we never <br>see again. <br> <br>There is great potential here. The replication of  <br>glyph parts has been done. Adding a human, <br>organic, hand drawn touch to a text font isn't  <br>often done - and when it is done, it rarely works.  <br>When it works, it's usually a design based in  <br>calligraphy (Zapf) or brush forms. <br> <br>Beezer is something new. It reveals clearly the use <br>of computer-based tools, but the human touch is still <br>evident. I'm interested to see how the quirks affect  <br>the font at small sizes (Flash doesn't exactly allow a  <br>good view of tiny type). I'd also love to see more of  <br>the Brush style. <br> <br>My favorite glyphs: \"a\",\"g\",\"l\" <br>Glyphs that make me extra glad: \"a\",\"g\" of Bold Study <br>The glyph that makes me sad (and might benefit  <br>from a more conservative approach): \"G\" <br> <br>I think those letters with more gradual curves work  <br>best. The sudden kinks of the \"G\", \"K\" \"R\" and \"Q\"  <br>(oops, was I supposed to ignore that?) are  <br>distracting and mar an otherwise clean design. <br> <br>Focusing on gentle curves still leaves room for your  <br>hand-massaged expirimentation and I think it works  <br>great on those glyphs I mentioned. <br> <br>Noting the method and the preview sample, I predict  <br>the Bold style will be the star of this family. <br> <br>Stephen </p>"
