    html: "<p>OK, In the spirit of \"S\" research, I offer the following specimens. I took three of my preferred sans serif typefaces, namely Berthold Akzidenz Grotesk, Trade Gothic, and HTF Knockout. Note their differences in construction. I found it particularly interesting to note that Hoefler's bezier handles appear at right angles and both sides of the handles are the same length. <br> <br>I asked him about this and he mentioned that while it worked for this particular specimen, a rectilinear approach is sharply at odds with letters that are either wide or heavy, as seen in some of the heavier faces of Knockout. <br> <br>The specimens follow: <br> <br><img src=\"http://www.typophile.com/forums/messages/29/484.gif\" alt=\"akzidenz\"> <br><img src=\"http://www.typophile.com/forums/messages/29/485.gif\" alt=\"trade\"><img src=\"http://www.typophile.com/forums/messages/29/486.gif\" alt=\"knockout\"></p>"
