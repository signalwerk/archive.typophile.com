      <p>Now that I've finished PIll (for now), I'm getting back to Beezer. I added a bunch of other characters today, and pulled it all into FontLab. I calmed down a few characters, the lc g in particular. I included a new text setting. The first thing that jumps out at me from the setting is that I need to work a little on proportions. Some characters are too wide; the x,k and z, are a couple that jump out at me. <br> <br>I'm still thinking about how to resolve the point Stephen brought up: the lumpy curves are too digital as the font scales up. I think I either need to smooth out the lumps, or soften up the terminals. I may try my hand at a script to round them off. <br> <br></p>
      <!--attachment: beezer_sample-35356.pdf*mime_pdf.gif*application/pdf*43.3*New+Characters*beezer_sample%2epdf --><!--attachment: beezer_sample-35356.pdf*mime_pdf.gif*application/pdf*43.3*New+Characters*beezer_sample%2epdf --><p></p><center><br>
