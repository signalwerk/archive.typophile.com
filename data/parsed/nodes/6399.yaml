post:
  id: 6399
  user: 1
  date: 2001-11-06T22:11:00
  date_raw: 6 Nov 2001 — 10:11pm
  votes: null
  html: "<p><!---Attachment: beezer.swf-!--></p><center><table border=\"1\"><tbody><tr><td><img src=\"http://www.typophile.com/forums/icons/mime_gif.gif\" align=\"LEFT\" alt=\"application/x-shockwave-flash\">beezer.swf<br><a href=\"http://www.typophile.com/forums/messages/29/beezer.swf\"><b>beezer.swf</b></a> (8 k)</td></tr></tbody></table></center><!---/Attachment-!--> <br> <br>Hi. Here is another face I've been playing around with. I am experimenting a little bit with process here. I think to be good one has to master the medium (or at least learn to work with it). For ex. while the stone has a lot to do with what the letters on the trajan column look like, the masons were in control of what was going on. My medium, in this case the bezier curve, often masters me. (how many clunky s's do we need to do before we can get it right?) That being the case, I decided to do a face without using any geometric crutches (circles, squares, etc.) or duplicating any parts of letters. It's still a sketch right now, and is just a lineale (sp?). <br> <br>Some of the letters are still pretty lumpy. I'm trying to decide where the roughness is working and where I need to apply a little more polish. I'm torn on the Q. It could be really cool or completely off. (it could be a bit less lop sided for sure, but is the tounge working or not?).<!--!-/attachment-!--><!--!-attachment:--><p></p>"
  html_clean: "<p><!---Attachment: beezer.swf-!--></p><center><table border=\"1\"><tbody><tr><td><img src=\"http://www.typophile.com/forums/icons/mime_gif.gif\" align=\"LEFT\" alt=\"application/x-shockwave-flash\">beezer.swf<br><a href=\"http://www.typophile.com/forums/messages/29/beezer.swf\" class=\"link-lost\"><b>beezer.swf</b></a> (8 k)</td></tr></tbody></table></center><!---/Attachment-!--> <br> <br>Hi. Here is another face I've been playing around with. I am experimenting a little bit with process here. I think to be good one has to master the medium (or at least learn to work with it). For ex. while the stone has a lot to do with what the letters on the trajan column look like, the masons were in control of what was going on. My medium, in this case the bezier curve, often masters me. (how many clunky s's do we need to do before we can get it right?) That being the case, I decided to do a face without using any geometric crutches (circles, squares, etc.) or duplicating any parts of letters. It's still a sketch right now, and is just a lineale (sp?). <br> <br>Some of the letters are still pretty lumpy. I'm trying to decide where the roughness is working and where I need to apply a little more polish. I'm torn on the Q. It could be really cool or completely off. (it could be a bit less lop sided for sure, but is the tounge working or not?).<!--!-/attachment-!--><!--!-attachment:--><p></p>"
