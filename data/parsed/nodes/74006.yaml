    <p>This is for a swimwear company which focuses on "form-fitting bikinis". I incorporated a figure of a woman in the negative space of the bikini. Also, the knot of the bikini is formed into an L and an H which is just a bonus if you happen to catch it. I'd appreciate any suggestions/crits on the mark and/or type.</p>
    <p>-edit- <strong>Client wanted another direction. Please view the new samples in the posts below.</strong></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/samples_6116.jpg"></div><p></p>
    <p>Btw, the circle will be cleaned up. It looks a bit jagged right now.</p>
    <p>-edit- <strong>Client wanted another direction. Please view the new samples in the posts below.</strong></p>
