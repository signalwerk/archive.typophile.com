    html: <p>Sans Serif has a more modern feeling to it, Slab I think is a little too manly for a swimwear company unless you used something light. I think the comment that jakes made about the newer iterations being old fashioned was on the money, especially using the ampersand as the logomark of the type. Nevertheless, the ampersand is one of my favourite glyphs. On the other hand, the blue/orange colour scheme really works. I think the primary problem with the stylisations of the ampersand is scale, none of them really hold up to scaling very well. What about abbreviating Lauren &amp; Holly to just L&amp;H? If the client wants to appeal to 20's and 30's they ought to reconsider your original direction, perhaps if you tried rehashing some iteration of your original with the pizazz of the new direction? I dunno, tough case but I think you've brought a lot to the table.</p>
