      <p>Thank you for the feedback. Rather than an upscale image, I believe the company wants to give off a warmer, lighter feeling while still projecting a professional image. They requested the use of warm earth tones and provided me with a pdf with images of natural elements. As for the circle, I added it because just having the bikini top looked unbalanced to me. I felt the circle sort of glued everything together. If you guys have any suggestions on that, please let me know. I did try something hand-written but it ended up looking a bit kiddish which would not fit the target audience. But again, I'm open to suggestions.</p>
