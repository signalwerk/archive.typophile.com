    html: <p>I've thought about such a ligature but never seen one. <a href="http://www.stormtype.com/">Storm</a> sells at least <a href="http://www.pismolijna.cz/pdf/Walbaum.pdf">one package</a> with f-ligatures for f next to an umlauted (dieresis) vowel. <a href="http://www.romana-hamburg.de/fraktur7.htm">Helzel's version of Wilhelm Klingspor-Schrift</a> includes some long-s ligatures with the dieresis compressed and shifted over somewhat. They may have been part of Koch's original design. <br> <br>Andrea de Leeuw van Weenen <a href="http://www.ntg.nl/texnl92may.html#Mon%2C%2025%20May%2092%2013:47:00%20CET">wrote</a> about an acute fi ligature to the TeX-NL list back in 1992, it  would appear. That's all I can find about it. <a href="http://www.google.com.ni/search?sourceid=mozclient&amp;ie=utf-8&amp;oe=utf-8&amp;q=%22accented%2Bligatures%22">Mrs Eaves Opentype</a> contains accented quaint ligatures, including a capital acute fi.</p>
    html_clean: <p>I've thought about such a ligature but never seen one. <a href="http://www.stormtype.com/" class="link-external">Storm</a> sells at least <a href="http://www.pismolijna.cz/pdf/Walbaum.pdf" class="link-external">one package</a> with f-ligatures for f next to an umlauted (dieresis) vowel. <a href="http://www.romana-hamburg.de/fraktur7.htm" class="link-external">Helzel's version of Wilhelm Klingspor-Schrift</a> includes some long-s ligatures with the dieresis compressed and shifted over somewhat. They may have been part of Koch's original design. <br> <br>Andrea de Leeuw van Weenen <a href="http://www.ntg.nl/texnl92may.html#Mon%2C%2025%20May%2092%2013:47:00%20CET" class="link-external">wrote</a> about an acute fi ligature to the TeX-NL list back in 1992, it  would appear. That's all I can find about it. <a href="http://www.google.com.ni/search?sourceid=mozclient&amp;ie=utf-8&amp;oe=utf-8&amp;q=%22accented%2Bligatures%22" class="link-external">Mrs Eaves Opentype</a> contains accented quaint ligatures, including a capital acute fi.</p>
