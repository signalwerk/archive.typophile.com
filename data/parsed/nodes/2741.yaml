    html: <p>I've seen them occasionally -- sorry can't remember the names of any typefaces off-hand -- but they are uncommon and, typically, of little use. The problem is that in an fi ligature it is typical for the overhang of the f to replace the dot of the i. The only way to have sufficient space for an accent above the i is to either move the i further from the f or to retract the overhang of the f; in either case, you usually cease to have a need for a ligature.</p>
