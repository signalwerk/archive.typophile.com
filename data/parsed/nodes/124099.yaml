      <p>Given what is said in <a href="http://de.wikipedia.org/wiki/%E1%B8%A6" rel="nofollow">http://de.wikipedia.org/wiki/Ḧ</a> and <a href="http://de.wikipedia.org/wiki/%E1%BA%8C" rel="nofollow">http://de.wikipedia.org/wiki/Ẍ</a>, a combining diaeresis U+<code>0308</code> that is well positioned might be enough.</p>
      <p>PS The French Wiki provides the additional information that those letters are found in the <a href="http://en.wikipedia.org/wiki/ALA-LC_romanization" rel="nofollow">ALA-LC-romamization</a> of Kurdish. Cf <a href="http://www.loc.gov/catdir/cpso/romanization/kurdish.pdf" title="http://www.loc.gov/catdir/cpso/romanization/kurdish.pdf">http://www.loc.gov/catdir/cpso/romanization/kurdish.pdf</a> When searching Wikipedia, it is good to check what is said about your search  in various languages.</p>
