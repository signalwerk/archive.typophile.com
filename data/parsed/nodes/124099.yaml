  html: <p>I’m wondering if the characters ḧ ẍ are needed for Kurdish or not. <a class="freelinking external" href="http://www.omniglot.com/writing/kurdish.htm" rel="nofollow">Omniglot</a> shows them but e.g. Wikipedia only mentions them once, without giving more information.</p>
