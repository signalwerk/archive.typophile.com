      <p>I thought that Kurdish was written with the Arabic script. But then many Kurds live in Turkey, and there they may be legally required to use the Latin script for their language like the Turks.</p>
      <p>Looking at Omniglot, their illustration shows ẍ beside its equivalent, Xh, in an alternate Latin script for their language, and beside the Arabic and Cyrillic script equivalents. I would take that as sufficient evidence that ẍ corresponds to an actual element of Kurdish phonology and orthography. On the other hand, ḧ is <strong>not</strong> shown on the <a class="freelinking external" href="http://www.omniglot.com/writing/kurdish.htm" rel="nofollow">Omniglot</a> page <em>my</em> Google search turned up. (Oh, wait, it did appear once - in the chart of how Kurdish can be written with the <em>Armenian</em> script.)</p>
      <p>The Wikipedia article on <a class="freelinking external" href="http://en.wikipedia.org/wiki/Kurdish_alphabets" rel="nofollow">Kurdish Alphabets</a> does give detail. It turns out that the two letters you mention, plus the apostrophe, were part of Jeladet Ali Bedirkhan's original proposal of a Latin alphabet for the Kurdish language, but only for rendering words of foreign origin, as the sounds they represent are not native to Kurdish. Old orthography Russian had extra letters for words borrowed from Greek, and Tibetan and other Indic scripts have extra letters for writing Sanskrit, so this isn't that unusual - for that matter, in French, the letter W has that status.</p>
      <p>On top of that, until very recently, since the letters Q, W and X aren't part of the Turkish language, Turkish law forbade Kurds from using them.</p>
      <p><a class="freelinking external" href="http://kurdishacademy.org/?q=node/145" rel="nofollow">This article</a> is another source for information on Kurdish scripts, but it doesn't mention those letters at all.</p>
