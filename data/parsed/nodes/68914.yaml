      <p>Using italics is, as you say, a stylistic convention, tied, among other things, to the language you are writing in.<br>
      For example, in Italian, titles of publications, be they books or magazines (and ships' names as well), would go in italics, but not articles, which would go between double quotes. Definitions too would go between double quotes, while the use of italics for emphasis was not common.<br>
      So, for websites, if they are in some way publications (as opposed to, say, brochures), I suppose you could use italics. The problem is that most often websites' names are hyperlinks too. That means they already have their styling distinct from the surrounding text. Adding italics to this styling can add visual clutter and reduce legibility.<br>
      As for what to use, the "i" tag is the only sensible one, maybe paired with an appropriate class.<br>
      I say this exactly because it is semantically neutral.</p>
