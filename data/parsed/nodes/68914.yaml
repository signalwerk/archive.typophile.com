      <p>Better to have said "for information that is meant to be displayed" (i.e., on the web): stuctural and presentational semantics and not much more.</p>
      <p>Still, the examples of the &lt;strong&gt; and &lt;em&gt; tags are in fact both presentational mark-up, rather than structural (much less lexical). They differ not in kind from &lt;b&gt; and &lt;i&gt; but only in degree of physical abstractness.</p>
      <p>&lt;b&gt; and &lt;i&gt; are still valid tags, even in HTML5.</p>
