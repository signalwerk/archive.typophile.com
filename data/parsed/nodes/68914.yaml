    html: <p>As a technological side-note, I'm also curious how the topic of implementing such styles plays in to the picture with semantic web coding. For example, I used the <code>&lt;cite&gt;</code> HTML tag to italicize <cite>Moby Dick</cite> above, and have practiced a similar method in the past when mentioning book titles (as opposed to using <code>&lt;em&gt;</code> or <code>&lt;i&gt;</code>). However I'm not positive that's really what <code>&lt;cite&gt;</code> was semantically intended for. From much of what I've read, it seems to have been introduced more for proper citation in the traditional sense – for attributing quotes and such – than it is for simply mentioning a book's name in passing.</p>
