      <p>That makes sense for relatively straightforward cases, like blogs with editorial content. But do you think it should apply to all sites? Like, would you italicize <cite>Typophile</cite>? I have a hard time answering that question decisively, and could go either way.</p>
      <p>And what about referring to the online publication of a news organization? The websites for newspapers often feature unique content and might be considered their own separate entities, but you rarely see something like "Khoi Vinh is the design director for <cite>NYTimes.com</cite>."</p>
