      <p>The W3C Recommendation for the <code>cite</code> tag specifies that it <em>Contains a citation or a reference to other sources.</em></p>
      <p>The Recommendation does not specify the type of the source.</p>
      <dl>
      <dt>An example:</dt>
      <dd><code>As &lt;CITE&gt;Harry S. Truman&lt;/CITE&gt; said,</code></dd>
      <dd><code>&lt;Q lang="en-us"&gt;The buck stops here.&lt;/Q&gt;</code></dd>
      <dd><code>More information can be found in &lt;CITE&gt;[ISO-0000]&lt;/CITE&gt;.</code></dd>
      </dl>
      <p>Other XML schemas such as Docbook have much richer semantics than this.</p>
