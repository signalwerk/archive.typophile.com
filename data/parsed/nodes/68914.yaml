      <p>Thanks all for the technical insight. What I'll probably end up adapting myself is a custom class. Unfortunately, that doesn't answer the question of what markup to use to refer to books on Typophile (I'll probably stick with <code>&lt;cite&gt;</code>).</p>
      <p>It also still leaves me a bit unsettled as to where I should even apply specialized typesetting or not – be it on my own site, Typophile, or any of the other places of varying code-flexibility that I might be writing. The recommendation Craig offers from Kate Turabian is a practical solution, but I can't help feeling that it implies an inferiority of any content that exists online… why should Huffington Post be treated any differently from <cite>New York Post</cite>?</p>
