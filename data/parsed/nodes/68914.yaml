      <p>Nick, I would add that HTML is mark-up language primarily for the display of information, and not for its semantics. As such it is not a commendable storage format for content that needs to maintain the kinds of distinctions you have specified.</p>
      <p>That said, you could achieve the desired effect by including a class attribute of your own devising in each cite tag, and controlling the output via a CSS rule. This would also allow a cleaner conversion of your HTML into a semantically richer mark-up at some point in the future, should the need arise.</p>
