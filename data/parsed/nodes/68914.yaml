    <p>As websites have become more and more of cultural reference points, I'm curious how people approach the task of typesetting their names. When externally referring to a traditional piece of work – like a book – it is standard to typeset the title in italics (or in quotes, etc, depending on your style preference). For example…</p>
    <p>"I just finished reading <cite>Moby Dick</cite> last night."</p>
    <p>In the past I've done something similar when referring to websites, but hesitantly so. It seems to make more sense for some websites than others, but I haven't figured out where to draw the line, or if a line should be drawn at all. Many of the standard style guides go in to detail about how to treat books, periodicals, poems, plays, articles, etc. However, the consideration of websites, blog posts, and other digitally published material still seems to be a gray area.</p>
    <p>As is the case with any stylistic practice, it's flexible and subject to taste/cultural norms, but I'm curious about what thoughts other people have on the topic. I tried searching to see if this conversation has come up here before, but couldn't find anything of note; apologies if this might be a redundant thread.</p>
