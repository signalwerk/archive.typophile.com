    <p>[Couldn’t add images for some reason, so they are attached to the post]</p>
    <p>I got these screenshots from a developer using my one of my fonts developing an application in Cocoa. This is a TrueType font, hinted in the y-direction. (Prob not hinting related, since this is on a Mac). The kerning is class based. I wonder if it should be flattened for a TT file, but in any case missing kerning is clearly not the issue. The strange spacing gaps are not in the font file, and I haven’t seen them in any other application. The gaps kick in and out until 17 pt size, when everything goes back to normal. They also differ in intensity with various alignments (left, right or centered text). I’m generating the font from Fontlab. </p>
    <p>Any idea what might cause this?</p>
