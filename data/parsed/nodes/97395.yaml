      <p>Hi Frank,</p>
      <p>I have the same problem on OS X and it seems it’s not related to a special typeface. I found this bug(?) some month ago, during writing a text in an App, where the System is "responsible" for kerning/spacing.</p>
      <p>Try out the preinstalled GillSans at 15 or 16 Point and 17 Point in TextEdit with the word "Total" for example, and you will see, that the "To" in 15 or 16 Point isn’t kerned correctly (to much space between). </p>
      <p>I think the problem is present in Snow Leopard and Lion (10.7.5.). Not sure how it is in Mountain Lion.<br>
      Anyone?</p>
      <p>-Thomas</p>
