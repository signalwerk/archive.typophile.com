      <blockquote><p>How do I create a native Mac TrueType file?</p></blockquote>
      <p>FontForge has the most robust interface in terms of options for generating Mac TrueType formatted fonts. I do not have a great deal of experience in doing this and no experience with AAT, but I have managed to resolve system level complications (in the deep, distant past) by converting a font to the Mac .dfont TrueType format. If you do not have FontForge up and running I would be happy to run the basic conversion for you but note that it would be just that, with no AAT bells and whistles.</p>
