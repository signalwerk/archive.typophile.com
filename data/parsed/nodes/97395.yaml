    html: <p>Is this just within the XCode environment itself, or does the problem still exist when the program is compiled for use? Assuming the latter, UILabel doesn't use Core Text for layout, for the sake of speed, so I don't think it uses any kerning at all (regardless of whether flat or OT), but as you say, this doesn't explain the odd spacing. The UILabel class defaults to 17pt system font, so this may be one clue. But I don't have any clever ideas about why your font is working differently from the system fonts in this situation.</p>
