      <p>Dear Eben<br>
      It's such a colossal work you are into, with so many of technical limitations. I'm not familiar with so many of these technical issues regarding your font, that it's hard for me to comment. I'm designing fonts as a graphic designer who has an ever-lasting love for typography, mainly because I design lots of books, catalogues, etc. That means I'm drawing lots of glyphs for specific projects, but I never edited a complete font in Fontlab. </p>
      <p>FEED-Mono is intended for a personal use – it would be part of our studio branding – is intended for print. It was also a good pretext to put myself into Fontlab.<br>
      <a href="http://typophile.com/node/31145" title="http://typophile.com/node/31145">http://typophile.com/node/31145</a></p>
      <p>But after looking at your the last posts of this thread, my main concern is about the r. Someone already told you this, but I really think you should add a serif to it, the spacing would be much better.</p>
