      <p>"..OSX gives you the ability to turn smoothing on below 12 but not to turn it off above 12. So I can look at it both ways in 12 but not say 13."</p>
      <p>hmm, I'm late, but I have an answer here. Two useful tricks:</p>
      <p>Terminal.app will happily display type any size you like, with or without antialiasing, whatever the system settings. Make a sample file with textEdit, save it as plain-text in your home dir, let's say filename "sample.txt". Open up Terminal.app, size it conveniently, and type<br>
      <code>cat sample.txt</code><br>
      Poof! Instant screenshot fodder. Since there are size+- hotkeys, I used Terminal extensively tweaking the hints of my own font.</p>
      <p>For the slightly braver, open up Terminal.app and type<br>
      <code>defaults write 'Apple Global Domain' AppleAntiAliasingThreshold 14</code><br>
      This sets the system-wide antialiasing threshold to 14pt. Any number from 1 to 128 will work.</p>
      <p>-- R.</p>
    html_clean: |-
