      <p><a href="http://www.flickr.com/photos/fontfont/3883981724/sizes/l/"></a></p><div class="imageWrap"><a href="http://www.flickr.com/photos/fontfont/3883981724/sizes/l/"><img src="/files/Kava-vs-Kaffessatz_500_4826.png"></a></div><br>
    <em>FF Kava vs FF Kaffeesatz</em><p></p>
    <p><a href="http://fontshop.com/fonts/downloads/fontfont/ff_kava_ot/"><strong>FF Kava</strong></a> started out as a free typeface called <a href="http://yanone.de/typedesign/kaffeesatz/">Kaffeesatz</a>, published by the über-talented <a href="http://www.fontshop.com/fonts/designer/yanone/">Yanone</a> in 2004 during the early stages of his type designing career. The bold weight was reminiscent of coffee house grotesk typefaces of the 1920s, while the lighter versions were supposed to bridge the gap to contemporary type design. The current <a href="http://fontshop.com/fonts/downloads/fontfont/ff_kava_ot/">FF Kava</a> family is a carefully revised, more rounded version of the old Kaffeesatz fonts. A <a href="http://www.fontshop.com/fonts/singles/fontfont/ff_kava_ot_black/">black weight</a> has been added as well as <a href="http://www.fontshop.com/fonts/singles/fontfont/ff_kava_ot_regular/?&amp;acs_ss=17">small caps</a> and more <a href="http://www.fontshop.com/fonts/singles/fontfont/ff_kava_ot_regular/?&amp;acs_pt=48&amp;acs_ss=11">figure sets</a> to form now an attractive modern and soft sans serif type family.</p>
    <p>Read the complete story and try it out on <a href="http://fontfeed.com/html/archives/new-fontfonts-ff-kava-with-extra-flavour/">The FontFeed</a>.</p>
    <p><a href="http://fontfeed.com/html/archives/new-fontfonts-ff-kava-with-extra-flavour/"></a></p><div class="imageWrap"><a href="http://fontfeed.com/html/archives/new-fontfonts-ff-kava-with-extra-flavour/"><img src="/files/FF-Kava-by-LiveSurface_500_4247.jpg"></a></div><br>
    <em>FF Kava: Ideal for packaging [Image: LifeSurface®]</em><p></p>
