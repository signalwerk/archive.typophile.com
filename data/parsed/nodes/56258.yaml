      <p>I chose Marilyn Monroe as my historical figure. I knew right away, I'd need something pretty, but powerful. After doing a little research, I knew I wanted a mix between her signature and these two logos from the 50's I found: </p><div class="imageWrap"><img src="http://typophile.com/files/Signature_4269.png"></div><div class="imageWrap"><img src="http://typophile.com/files/HolleyLogo_5013.png"></div><div class="imageWrap"><img src="http://typophile.com/files/Frigidaire_3792.png"></div><br>
      After searching high and low for a typeface, I narrowed it down to these two: <div class="imageWrap"><img src="http://typophile.com/files/BickleyScrpitPlain_3800.png"></div> Bickley Script Plain and <div class="imageWrap"><img src="http://typophile.com/files/OPTICarmellaHandScript_5783.png"></div> OPTICarmella Hand Script. I think I'm going to have to go with the latter though. It has a strong "M" and the stroke is thick enough so it won't fade into the background, giving it strength. The typeface has the 50's feel I was looking for and is in red like Monroe's famous shade of lipstick. Marilyn Monroe and OPTICarmella Hand Script are strong and seductive while remaining feminine.<p></p>
