      <p>I chose Mozart as my historical figure. My piano teacher was very much obsessed with the classical artists and therefore we spent many lessons learning their backgrounds and studying their musical compositions. To represent Mozart, I chose ChopinScript. Its flowing and beautiful strokes are reminiscent of hand drawn music notes. Each letter flows into the next as if it is dancing across the page. The typeface is both intricate and delicate, just as Mozart's music is played and heard. I left his name in black to stay true to the black and white of both the piano keys and the music sheets that go hand in hand with one another. While it is not my everyday choice of music, I think its important to study the classics of any genre, and having played the piano for a number of years I came to respect and appreciate the time and effort that each artist puts into their work. </p>
      <p>Jess</p><div class="imageWrap"><img src="http://typophile.com/files/mozart_2_6548.jpg"></div><p></p>
