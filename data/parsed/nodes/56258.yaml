      <p>I decided to do no one other than the great Ella Fitzgerald. Typically in the past Ella's name is written in fonts similar to Broadway. However, these bulky fonts are not characteristic to Ella Fitzgerald Jazz legend. When I think of Ella, I think of velvet melting you with her words of love. I think of someone who is very much feminine, yet strong, with a name like Fitzgerald, how could you assume anything different.</p>
      <p>I decided to use the font Cornet Mtd Std Bold. As you can see it is the perfect combination of femininity, found in the easy flow of the type and masculine in its nature, exemplified in the sharp, crisp serifs.</p>
