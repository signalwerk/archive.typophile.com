      <p>For a very long time I have had this obsession with Josephine Baker. For those of you who have no clue who Josephine Baker was, she was an entertainer from the 1920s and 30s, and the first black international superstar. She was a very versatile entertainer and an amazing performer. She was very feminine, elegant, and sensual but she was also a very strong woman with attitude who stood up for her beliefs. She refused to play for segregated audiences and because of that Las Vegas night clubs became integrated. She was very popular in Paris.</p>
      <p>A font that I think matches Miss Baker perfectly is Parisian. Like Josephine, I think it and elegant and sensual typeface with it's thin and curvilinear strokes but at the same time strong and bold with it's thick and straight strokes. Now some may wonder why I chose pink for a color? It is very simple, for one of the first dances that Josephine performed in Paris her costume was nothing more than a girdle/ corset covered in pink feathers.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/josephine_baker_3781.jpg"></div><p></p>
      <p>SRB</p>
