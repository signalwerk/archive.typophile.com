      <p>Archimedes was a Greek mathematician, physicist, engineer, inventor, and astronomer. He is regarded as one of the leading scientists in classical antiquity.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/archimedes_3715.jpg"></div><p></p>
      <p>This is Mason Alternate. The m has the same shape of a pi symbol, and since Archimedes was a mathematician.. Mason also has this simple, geometric feel. The serifs are very long and the leg of the R is pointed with no serif. It reminds me of a Compass leg.</p>
      <p>I chose orange because orange and yellow are the colors he wears in the painting "The School of Athens." I also did a quick google search on Archimedes and found that he was mainly portrayed in yellow and orange clothing..</p>
