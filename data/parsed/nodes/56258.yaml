      <p>I chose Bodega Serif Small Caps to represent one of my favorite movie stars Bette Davis. I knew I wanted a condensed serif typeface, that stood strong and regal. I didn't want a typeface that was too dated, because of the progressive roles that she was awarded. Granted the typeface was designed in the 90's, Bodega Serif has an older feel that would fit in during during her earlier acting years. I left it black and white, because I believe that her only roles were in black in white.</p>
