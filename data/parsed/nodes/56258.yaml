      <p>My grandmother shared her love for the the King of Rock'N'Roll and his music with my mother and then they both shared it with me. I've been listening to Elvis' music ever since I was a little girl and I still love it. His sound and style was very unique because of his diverse musical influences like country, pop, gospel, and R&amp;B music. Elvis challenged the social and racial barriers of the time, he ushered in a whole new era of American music and popular culture. His talent, good looks, sensuality, charisma, and good humor endeared him to millions. He is regarded as one of the most important figures of twentieth century popular culture. I think Eccentric Std is a good typeface to represent him. Eccentric was designed in 1881 by Gustav F. Schroeder. Eccentric is an all-capital, narrow display face with high horizontal cross-bars and main junctures more than halfway up the letter forms. It has a tall look which reminds me of a microphone stand. Also, Elvis was tall and a singer that performed on a stage with a microphone. Eccentric looks edgy and classic at the same time. :)</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Elvis_5118.jpg"></div><p></p>
