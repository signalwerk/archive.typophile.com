      <p>I chose the font called Modern No. 20 to represent the architect Frank Lloyd Wright. FLW is arguably one of the best architects in history and much of his aesthetic involved almost dangerously long cantilevers. So, in looking for a font, I wanted one with long/wide serifs that seemed to cantilever off their stems. In Modern No. 20, the first thing I noticed was the capital "F". It looked like as if it was any wider it would topple over. And I chose the color brown because of his work was organic: incorporating nature and the environment into his designs.<br>
       </p><div class="imageWrap"><img src="http://typophile.com/files/FLW_4965.jpg"></div><p></p>
