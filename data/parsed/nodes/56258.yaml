    <p>this is inspired by the thread "what typeface would michelle obama be?"...i started thinking about what typefaces other historical figures might be? post away if you have any thoughts!</p>
    <p>here's one i was playing with...</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/amelia_5135.jpg"></div><p></p>
    <p>i've always been a little fascinated by amelia earhart and chose SUBURBAN (emigre font) for her....there is a masculine/feminine feel to this font, that seems appropriate for earhart... i also like the loops where the strokes cross over each other that are reminiscent of loops an airplane might make (acrobatic airplane!)</p>
    <p>there is also a vintage/retro/art deco feel to this font that seems appropriate (earhart's time period was the 20's-30's), the solidness of the strokes relate to earhart's courage and the loops of the "l" and "E" lend themselves to an unconventional "prettiness"...</p>
    <p>the color? well, the first plane she was able to buy on her own was named "canary" (it was bright yellow...</p>
