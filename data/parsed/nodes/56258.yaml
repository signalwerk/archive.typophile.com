      <p></p><div class="imageWrap"><img src="http://typophile.com/files/meryl_streep_blog_6412.jpg"></div><p></p>
      <p>Meryl Streep is someone that I have admired for a very long time because of her ability to achieve a successful career as well as to raise four children.  Through her movies, it is easy to see her class as well as her kind personality.  In interviews she is witty and funny, and has a strong opinion about everything (and is not afraid to voice it).  Though she recognizes her success, she is not overly outward about it and is very modest.  </p>
      <p>I picked Minion Pro Regular to represent Meryl.  It is simple yet classy.  With its elegant serifs and variety of thick and thin lines, I think that it represents the professionalism and accomplishment that is found in Meryl.  It's uniquely formed serifs and terminals make it special in the world of font, as Meryl's talent and beauty makes her special in the world of acting.  Because she wears mostly blues, grays, and whites to award ceremonies and other public engagements, I chose to use a dark gray-blue as the color of the text.</p>
    html_clean: |-
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/meryl_streep_blog_6412.jpg"></div><p></p>
      <p>Meryl Streep is someone that I have admired for a very long time because of her ability to achieve a successful career as well as to raise four children.  Through her movies, it is easy to see her class as well as her kind personality.  In interviews she is witty and funny, and has a strong opinion about everything (and is not afraid to voice it).  Though she recognizes her success, she is not overly outward about it and is very modest.  </p>
      <p>I picked Minion Pro Regular to represent Meryl.  It is simple yet classy.  With its elegant serifs and variety of thick and thin lines, I think that it represents the professionalism and accomplishment that is found in Meryl.  It's uniquely formed serifs and terminals make it special in the world of font, as Meryl's talent and beauty makes her special in the world of acting.  Because she wears mostly blues, grays, and whites to award ceremonies and other public engagements, I chose to use a dark gray-blue as the color of the text.</p>
