      <p>My historical person would be Cicero.  Ancient Roman orator, lawyer, and philosopher, Cicero's speeches were composed of some the most beautiful and memorable prose of that time period.  His speech was as strong as it was beautiful.  I feel that Trajan Pro best exemplifies Cicero.  The gentle curves of some of the strokes reinforced by the contrast of thick and thin strokes echoes Cicero's versatility in speech as well as in occupation.  The all-caps typeface also adds gravity to the words, something for which Cicero was well known.</p>
