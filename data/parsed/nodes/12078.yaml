    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Foundries" class="freelinking" rel="nofollow">Foundries</a> : astype</strong></p>
    <p>astype is the font label of <a href="/wiki/Andreas%20Seidel" class="freelinking" rel="nofollow">Andreas Seidel</a>, Germany.</p>
    <p><strong>External Links</strong><br>
    <a href="http://www.astype.de/" rel="nofollow">astype.de</a><br>
    <a href="http://new.myfonts.com/foundry/astype/" rel="nofollow">astype on MyFonts</a></p>
    <p>Fonts in the astype library include <a href="/wiki/ADANA" class="freelinking" rel="nofollow">ADANA</a>, <a href="/wiki/CRAYFISH" class="freelinking" rel="nofollow">CRAYFISH</a>, <a href="/wiki/GRACIA" class="freelinking" rel="nofollow">GRACIA</a>, <a href="/wiki/HERAUT" class="freelinking" rel="nofollow">HERAUT</a>, <a href="/wiki/MISSALE" class="freelinking" rel="nofollow">MISSALE</a>, <a href="/wiki/PAOLA" class="freelinking" rel="nofollow">PAOLA</a>, <a href="/wiki/SATTLER" class="freelinking" rel="nofollow">SATTLER</a>, <a href="/wiki/SIMEON" class="freelinking" rel="nofollow">SIMEON</a>, <a href="/wiki/SECCA" class="freelinking" rel="nofollow">SECCA</a>, <a href="/wiki/SVEVA" class="freelinking" rel="nofollow">SVEVA</a>, <a href="/wiki/TOSHNA" class="freelinking" rel="nofollow">TOSHNA</a> and the very known <a href="/wiki/Astype%20Ornaments" class="freelinking" rel="nofollow">Astype Ornaments</a>.</p>
