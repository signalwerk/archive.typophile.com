    html: <p>hhp - Good question. I come across hundreds of fonts (mainly in pdfs) that have names that are almost, but not quite the same as well-known faces. Sometimes they are corporate licensed variations, such as NYTLyon used by the NYTimes, but many others, like the one cited in this thread, seem arbitrary. I wonder whether they have been modified, then renamed to avoid confusion, renamed to bypass embedding restrictions, or whatever. In any case, the alterations may or may not be legal or ethical; I know of no way to know which is which.  - Herb</p>
