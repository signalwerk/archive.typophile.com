    html: "<blockquote><p>

      Elsewhere I suggested that ttx could be used for this purpose…

      </p></blockquote>

      <p>That looks like the most simple way to do it. You just apply \"ttx -t name\" to your font file to get filename.ttx. If your field 13 (there are two occurrences of it) is something like</p>

      <pre>----

      Abracadabra licensed

      ----</pre><p>you replace it with something like</p>

      <p>----<br>

      Abracadabra licensed \r

      Serial Number: SSEERRIIAALL<br>

      ----</p>

      <p>and then if you have some file <code>serials.txt</code> with serial numbers, say</p>

      <pre>----

      AB1234CD56

      EV3144EF45

      ----

      </pre><p>executing the script</p>

      <pre>----

      for i in `cat serials.txt`\ 

      do\ 

      \  sed \"s/SSEERRIIAALL/$i/\" filename.ttx &gt; $i.ttx

      \  ttx -m filename.ttf $i.ttx

      done

      ----

      </pre><p>will produce the files <code>AB1234CD56.ttf</code> and <code>EV3144EF45.ttf</code> with those serial numbers inside (one font file per line in <code>serials.txt</code>).</p>

      <p>Even for something more complicated, I don't think you need an xml parser; <code>sed</code> and <code>ttx</code> can do the job.</p>"
    html_clean: |-
      <blockquote><p>
      Elsewhere I suggested that ttx could be used for this purpose…
      </p></blockquote>
      <p>That looks like the most simple way to do it. You just apply "ttx -t name" to your font file to get filename.ttx. If your field 13 (there are two occurrences of it) is something like</p>
      <pre>----
      Abracadabra licensed
      ----</pre><p>you replace it with something like</p>
      <p>----<br>
      Abracadabra licensed 
      Serial Number: SSEERRIIAALL<br>
      ----</p>
      <p>and then if you have some file <code>serials.txt</code> with serial numbers, say</p>
      <pre>----
      AB1234CD56
      EV3144EF45
      ----
      </pre><p>executing the script</p>
      <pre>----
      for i in `cat serials.txt` 
      do 
        sed "s/SSEERRIIAALL/$i/" filename.ttx &gt; $i.ttx
        ttx -m filename.ttf $i.ttx
      done
      ----
      </pre><p>will produce the files <code>AB1234CD56.ttf</code> and <code>EV3144EF45.ttf</code> with those serial numbers inside (one font file per line in <code>serials.txt</code>).</p>
      <p>Even for something more complicated, I don't think you need an xml parser; <code>sed</code> and <code>ttx</code> can do the job.</p>
