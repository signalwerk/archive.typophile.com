    html: |-
      <p>I’ve updated the code with the correct indentation.</p>
      <p>Of course the code only works if a name ID 13 is already present in the font. I’m not sure if the name table is the best place to store such information.</p>
      <p>Perhaps you could make up your own custom sfnt table format. If you add an »unknown« table to a font, I think tools that don’t understand it are required by the spec to ignore it but keep it in the font.</p>
      <p>For WOFFs, you could store this in the »<a href="http://www.w3.org/TR/WOFF/#Private" rel="nofollow">private data</a>« block, but that is likely to be stripped when someone converts the font.</p>
