    html: |-
      <p>ttx is a Python program, so it would be even easier to use pure Python to modify the font files.</p>
      <pre>from fontTools.ttLib import TTFont

      mySerial = "MYS3R14LNUM3ER"
      f = TTFont("myfont.otf")
      for n in f["name"].names:
      	if n.nameID == 13:
      		if n.platformID == 1 and n.platEncID == 0:
      			n.string = mySerial.encode('mac_roman')
      		if n.platformID == 3 and n.platEncID == 1:
      			n.string = mySerial.encode('utf_16_be')
      f.save("myfont_personalized.otf")
      </pre><p>
      (untested code)</p>
