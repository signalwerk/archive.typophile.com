    <p>Why is it that the <a href="/wiki/superior%252Bfigures" class="wiki">superior figures</a>, if present, are always on the same body? Whether you’re using them for footnote calls or scientific superiors — or anything I can think of — they need to act like proportional numbers, not tabular. It wouldn’t hurt if they were kerned, either.</p>
    <div class="forum-topic-navigation clear-block"><a href="/node/41733" class="topic-previous" title="Go to previous forum topic">‹ Norwegian style guide</a> <a href="/node/41393" class="topic-next" title="Go to next forum topic">Where is Hrant? ›</a></div>
