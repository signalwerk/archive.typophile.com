      <p>Charles:</p>
      <p>1. Yes, superior figures should be kerned to follow lower case letters, if for nothing else than “f”. However, some negative kerning may be useful when following letters such as “a”. So, for an OpenType font, the designer should create a kerning class for the superior figures, and then kern one of those, the two, against the lower case. Question: is there ever a need for superior figures to follow capitals or small caps?</p>
      <p>2. So, you’re suggesting the 7 is too close to the quote mark? I would agree. However, in this and the following example, I don’t have a problem with excessive space between superiors—it is of the same order as the space between lower case figures, and surely the goal is to create evenness amongst the different typographic elements? The 7 4 sequence is most gappy of figure combinations, but occurs so rarely, let’s leave it to the typographer/comp to kern, if they consider it necessary.</p>
      <p>3. The problem with introducing kerning between a period or comma and following superiors—it backfires when the mark itself follows f, r, v, w, or y, and is kerned negatively with them. In those situations, the arm of the f, for instance, would touch the superiors following the mark. Therefore, as letter-to-mark is a more frequent occurence, mark-to-superior kerning must be left to the typographer/comp. There, still some work for you guys to do, at least until Adobe invents three-character contextual kerning!</p>
      <p>4. In an oldstyle face, where capitals and ascenders have different heights, and the f is frequently tallest of all, surely it’s not a problem to have a variety of vertical alignment. As with accents (diacritics), it’s a judgement call for the type designer, based on the face and the particular accent/superior, whether to align by centering along a horizontal axis, or “flush bottom”.</p>
      <p>5. I’m afraid I have to disagree. IMO, the slash should, as much as possible, disambiguate from the vertical extremity of all other characters. Generally, this means it’s a little above cap top, and a little below baseline, only lining up with ascender top in old style faces. I mean if you’re OK with the irregular depth of old style figures, which is never the same as the descenders of letters, then surely having the slash somewhere else again fits in with that scheme. After all, if the bottom of the slash is lined up with the bottom of the descender, the question arise, why isn’t it lined up with the bottom of the old style figures? It’s better to have it line up with neither, which provides greater consistency.</p>
