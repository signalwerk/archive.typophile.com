      <p>OK, the simplest method is to have one set of superior figures which is both monowidth AND kerned.</p>
      <p>The kerned version is of course the default according to the layout application, and that’s good, because that’s what’s mostly used.<br>
      But on the rare occasion when tab superiors are required, just enter “0” in the kerning field and voilà—tab figures!</p>
