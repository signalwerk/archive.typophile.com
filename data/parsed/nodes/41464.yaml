      <p>Hello Nick!<br>
      This is as tiny as it can be.&nbsp;&nbsp;:)&nbsp;&nbsp;You should see the code for uppercase spacing which is built on the same basic idea ...<br>
      Even though these additional lookups are located in the kern feature, better consider them as <em>spacing</em> adjustment rather than kerning. They make sure that else too narrow sidebearings get ’normalized’ in context of glyphs other than superiors. It is like adjusting the fundament, based on which you would do the fine-tuning: Indeed you would go through relevant pair and kern them individually.<br>
      (Also I don’t say that such an adjustment is required in every typeface. It’s just an offer. As trivial as this solution is, it can be helpful for similar general spacing adjustments too.)</p>
      <p>Karsten</p>
