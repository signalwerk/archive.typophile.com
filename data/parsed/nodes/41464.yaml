    html: |-
      <p><cite>Surely when superior figures appear in a footnote, they are neater if the same width.</cite></p>
      <p>Only with one style, not much used. That style is flush &amp; hang with superiors numbers. If you use paragraph style, with either on-line or superior numbers, it matters far less. Yes, you can make a case for tabular numbers, esp. if the book uses notes a lot of reference-type notes — <cite>ibid</cite> &amp; title-only citations create a lot of short lines, so the numbers do form a sort of list.</p>
      <p>I can’t remember the last time we set superior note numbers for footnotes proper. It does happen, in once or twice per every 500 books.</p>
      <p>Note calls are an entirely different matter. Whether you are setting footnotes, end-of-chapter notes, or end-of-book notes, they have to be signaled in the text. Those are always superiors. Frequently, they fall after quote marks, periods, or commas. The way everything is spaced today (from most foundries), you get a very tight sequence of letter, period, quotedblright, and then a very gappy set of superiors. And the numbers themselves need kerning against the punctuation, they are too tight against a quotedblright, and too far after a period or comma. Then, you also run into a few authors who call a note after a word without punctuation. </p>
      <p>But if you really want to do it in perfect harmony, have two sets of superiors for notes, one for the calls in the text, one for the few times when superiors are used in the note proper. And I suppose you could add another set for scientific superiors, if you think a particular font is good for setting science or math.</p>
