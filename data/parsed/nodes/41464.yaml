      <p>It seems to me that the option of Tabular or Proportional figures should be available for ALL figure styles.<br>
      At the moment, the “tnum” feature would seem to allow this, but how do Quark and Adobe interpret this—if I create an OT class of tabular superiors and another of proportional superiors, and put the appropriate coding in my “tnum” feature, is this something that could be implemented by a layout application?</p>
      <p>Another instance is “cap figures”.<br>
      I am producing several typefaces which have three-quarter lining figures as the default or default lining figure, but which also have cap figures (cap height and weight) for when “case” (all caps) is applied. At the moment, I am making most of these figures proportional and kerned, but that doesn’t cover all potential uses. Ideally, and in honour of the great god Proliferation or his pal Becozwecan, why not have tab cap figures too? in fact, the font shown above IS with tab cap figs, because the superiors align with the top of the caps and cap figures, and not with the three-quarter figures.</p>
