    html: |-
      <p>Or use two (identical) sets of superiors, both tabular, but one is kerned while the other is not. Then ’pnum’/’tnum’ would care rather than kerning settings.</p>
      <p>Earlier I wrote — <cite>... superiors are smaller and need less space “within” (inbetween two superiors) but more space to the outside (between normal glyph and superior).</cite></p>
      <p>As simple solution: Imagine that superiors are spaced rather tight so that a string of superiors looks well spaced, but superiors and surrounding non-superior letters are a bit too close. Now the latter can be adjusted like this:</p>
      <p>&nbsp;&nbsp;&nbsp;@SUPERIORS = [zero.sup one.sup two.sup ...]<br>
      &nbsp;&nbsp;&nbsp;@NON_SUPERIORS = [A B C ...] # contains all glyphs not being superiors</p>
      <p>&nbsp;&nbsp;&nbsp;feature kern {</p>
      <p>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;# here the content of your standard kern feature:<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;lookup standardKerning {<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;pos V odieresis 10;<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;pos X one.sup 10;<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;pos @UC_V @LC_O -50;<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;} standardKerning;</p>
      <p>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;# increase space between non-superiors and superiors:<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;lookup spaceBeforeSuperiors {<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;pos @NON_SUPERIORS @SUPERIORS 15;<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;} spaceBeforeSuperiors;</p>
      <p>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;# increase space between superiors and non-superiors:<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;lookup spaceAfterSuperiors {<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;pos @SUPERIORS @NON_SUPERIORS 15;<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;} spaceAfterSuperiors;</p>
      <p>&nbsp;&nbsp;&nbsp;} kern;</p>
      <p>The trick is to use <em>two</em> additional lookups for adding space leftside of superiors and rightside of superiors independently. Space inbetween two superiors is not touched.<br>
      An advantage is that effectively you do a global adjustment — and are still free to <em>also</em> kern superiors the usual way. Kerning values resulting from different lookups will add. E.g. the pair “X one.sup” will be kerned at 25.<br>
      A disadvantage is that older and most current applications would ignore this kern feature completely because it contains more than one lookup. Adobe CS2/CS3 applications <cite>can</cite> handle this, and hopefully other applications will add support too. Considering that many Word users may not know how to switch on kerning anyway, I don’t think this is a real issue.&nbsp;&nbsp;;-)</p>
      <p>(There’s a more elegant solution with contextual positioning which would get more matches, but it does not work yet.)</p>
      <p>Karsten</p>
