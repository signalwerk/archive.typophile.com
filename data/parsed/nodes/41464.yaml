      <p><cite>and put the appropriate coding in my “tnum” feature, is this something that could be implemented by a layout application?</cite></p>
      <p>This should work. The application doesn’t care which glyphs your tnum or pnum cover. The important thing is feature order. If your superior feature precedes tnum/pnum, then your addition will do. If they are ordered the other way round, then your superior feature needs to replace tabular numerals with tabular superiors, and proportional numerals with proportional superiors, because the tabular vs proportional selection has been done already.</p>
      <p><cite>It seems to me that the option of Tabular or Proportional figures should be available for ALL figure styles.</cite></p>
      <p>In a way, yes. Unfortunately every addition does not add to but multiply the number of numerals ... I really hate doing numerals. They cost me at least half the design time.&nbsp;&nbsp;:(</p>
