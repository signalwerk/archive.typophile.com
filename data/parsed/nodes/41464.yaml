      <p>[An addition. Nick, I only saw your post after clicking the “post” button!]</p>
      <p>Spacing superior numerals and letters is tricky and hard to address with the current sidebearings+kerning approach: superiors are smaller and need less space “within” (inbetween two superiors) but more space to the outside (between normal glyph and superior). Solving this by pair kerning alone would require kerning them with almost the entire glyph set. In future this could be done contextually.<br>
      The same, btw, is true for all caps spacing. Uppercase letters usually are spaced to fit best in lowercase context. This implies that with the current pair kerning approach,  uppercase-uppercase pairs requires a lot of kerning to make the white space in A L T V W Y disappear. Again, contextual positioning can help by not only do pair-wise corrections but by giving uppercase letters completely different sidebearings in all caps context.</p>
      <p>Your examples uncovers a weak point. Not so much of Arno or any other particular typeface, but of the underlying font technology.</p>
