    html: |-
      <p>First of all, I’ll abandon the comment on the slash — it is as deep as an old-style figure, and that’s enough. And it is off-topic.</p>
      <p>Back to superscripts: Obviously, the clashes &amp; too tights should be fixed, either in the font, or by the compositor as set.</p>
      <p>As to kerning the superiors themselves: whatever balance you want should be achieved. But look at the space between 7 and 4. Just like any other set of numbers, if not kerned, it is far greater than the space between 6 and 9. And 69 &amp; 74 as note calls could well fall in the same paragraph Then look at 100. The space between the one and zero is large; the space between the two zeros quite small. etc. Just like with any tabular number set.</p>
      <p>The example I gave does not show the usual situation, justified copy, with all the compromises of word spacing that occur on the page. But these spaces between the word and the note call are fixed, in that they result from the sidebearings of the characters themselves. How you space them needs to accommodate a tight and a loose line. Ideally (I believe), there should be less space between the number &amp; what it refers to than in the following wordspace, whether that space be tight or loose in a particular line of justified text. Nothing new here, it is simply that these numbers must be made to space correctly just like any other set of numbers.</p>
      <p>For what it is worth, when I rework a font, I make these numbers proportional (varying setwidths). I then kern them against themselves. I next kern them individually (pairs kerning) with close quotes, periods, and commas, because that is the most commonly found placement. When I get the sidebearings just right, I probably could use class kerning for period/comma &amp; quoteright &amp; quotedblright and the “super” class. I suppose if you are a foundry, you’d consider it sloppy not to do so. For me, since as a comp I have to go back into the file &amp; find my place, I use pairs kerning for important stuff.</p>
      <p>For the rest, these are the characters I start with:</p>
      <p>quotesingle  asterisk exclam  bracketright c d e g i j k l p r s t v w x y question uni02BE uni02BF];</p>
      <p>adjusting the class as needed for particular fonts. </p>
      <p>And typical kerns:</p>
      <p>   pos @_quotesingle @_zero.super 50;<br>
         pos @_f2 @_zero.super 130;</p>
      <p>FWIW</p>
