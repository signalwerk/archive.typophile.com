    <p>My book at present seems to be quite dull, also something about it looks off (I know a couple of lines end on 2 character words, I forgot to fix those before i made the jpeg.)</p>
    <p>I was wondering if anyone has any ideas to get some more interesting page layouts within this book....as the format is driving me quite barmy.</p>
