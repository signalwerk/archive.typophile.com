      <p>Looking good!<br>
      Is it possible to rotate and/or skew the triangle but keep all text horizontal?<br>
      Is it an option to place text outside of the triangle (keep the triangle white)?<br>
      You've put the page numbers inside the triangle, how about putting those outside it?</p>
      <p>It seems to me that - since your client is in to this kind of design - you've got a lot of freedom. Use it!<br>
      Good luck!</p>
