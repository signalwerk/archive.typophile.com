    html: |-
      <p>Actually this is a personal project for my course X) I wish I had a client like that!</p>
      <p>Though the restriction I have now placed on myself, is that the book is that shape, and that the triangle is the edge of the page. So it folds on that white diagonal line which goes through the middle of those two text blocks.</p>
      <p>The reason for this shape, is that the book itself is a graphic illustration of an object from this horror/fantasy story. So the pages need to be like this for the main object to work.</p>
      <p>So would you say play more with the direction of the text?</p>
