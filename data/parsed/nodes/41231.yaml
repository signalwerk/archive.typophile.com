      <p>Very true!<br>
      There are OT features. And then there is the real world: "I cannot find the small caps font in the font menu!" Layout applications, including InDesign, don't make it easy for designers to even <em>find</em> OpenType features, and it is not much helpful if Small Caps are in one menu while All Small Caps are in another one ...<br>
      How to teach designers is a good question. Currently I like Adobe's short how-to videos. I fear that designers who by definition should be creative and ahead of their time, are pretty conservative when it comes to the tools they use.</p>
      <p>So my attempt is to make things work as automatic as possible. The differently aligning fractions are part of the Oldstyle/Lining numeral features. And I still hope that the punctuation spacing functionality which Nick mentions one day will be an option in layout applications -- it is part of the typographer's and not of the type designer's domain, and should allow the typographer some adjustments. (With this in mind it is located in a Stylistic Set feature and thus is optional.)</p>
