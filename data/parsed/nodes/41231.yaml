      <p><a href="http://www.p22.com/products/cezannepro.html" rel="nofollow">P22 Cézanne Pro</a> may be the most popular feature-rich OpenType font. It was very popular before OT, but was one of the first typefaces to make use of <a href="http://www.fontshop.com/fonts/singles/p22/p22_cezanne_pro_ot/" rel="nofollow">contextual alternates, ligatures, and swashes</a> to improve the emulation of natural handwriting. <a href="http://www.fontshop.com/fonts/singles/linotype/zapfino_extra_lt_pro_ot/" rel="nofollow">Zapfino Extra Pro</a> is also a candidate in this handwritten script category, despite it's hyperbolic name. Of course, <a href="http://www.veer.com/partner/link.aspx?i=1048&amp;c=4&amp;p=search/results.aspx?searchTerm=100002831,100007756,100007359" rel="nofollow">Alejandro Paul's scripts</a> came later, breaking records as far as number of glyphs.</p>
      <p>I'll let someone else determine which fonts take best advantage of the text typesetting features OpenType has to offer.</p>
