      <p>Robert Slimbach's open type faces for Adobe have set a new standard for text families. </p>
      <p>They are not only aesthetically very good and superbly crafted, but they have taken great advantage of both Multiple Master and Open Type technology. They don't have all the contextual substitutions of script faces, but they have set a standard by having not only optical sizes--facilitated by multiple master technology--but also within each size they greatly exploit Open type technology: four different sets of figures, fraction creation, small caps in all styles and weights, Central European, Turkish and Greek and Cyrillic characters as well. And open type class kerning. I don't have the latest--Garamond Premier and Arno--but only Minion Pro. Still these, as well as Adobe Jenson and probably others must be counted among the 'bests' of Open Type. </p>
      <p>So I would think that if you are going to feature two 'best of' open type faces, picking one of Slimbach's and one of the script faces would make sense.</p>
    html_clean: |-
