      <p>Armin,</p>
      <p>At Monotype we did a sort of redesign or update to Noori Nastaliq, which had been in Monotype's library for a long time, but was always maddeningly complicated to implement; the calligraphic Nastaliq style has a characteristic slope in each word (among other characteristics), making conventional typographic alignment impossible. As well, given the fluid style of the traditional calligraphy being mimicked, context changes everything, making numerous glyph variants essential. Previous technologies relied on huge numbers of ligatures and substitutions, making for really enormous font sets; we boiled it down to individual glyphs again, with contextual variants, and with the power of OpenType, engineered a way for text to be shaped dynamically, in a convincing Nastaliq style, while you type. It's a good example of the positioning Karsten (and maybe Si) is referring to. This font really takes advantage of OT technology throughout; in fact it depends on OT for basic functionality; without it, words wouldn't compose at all.</p>
