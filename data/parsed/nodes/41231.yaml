      <p>This following quote is from an interview I did with Tal Leming last Summer:</p>
      <p>"One great thing about OpenType fonts is that they can be programmed with sophisticated pattern matching routines that can be used as “rules” that govern when glyph substitutions should occur. … When a series of these rules are used in combination, a glyph can flip from its alternate state and back any number of times before the algorithm is finished processing. This makes it very difficult to predict which glyph state will be output, thus effectively creating the illusion that the glyphs are being randomly selected.<br>
      After sitting on this idea for a while, I finally got a chance to use it in the OpenType version of Christian Schwartz’s typeface Local Gothic. The idea behind that typeface is that there is a set number of alternate forms for each character, and these alternates should be used in an arbitrary way. The randomization algorithm takes in the string of characters that the user has entered, pushes it through the various test filters and uses some cipher-like routines to create a sequence of glyphs that appear to be chosen in an unpredictable way."</p>
      <p>ChrisL</p>
