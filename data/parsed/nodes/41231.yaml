      <p>Caflisch was certainly the face that I noticed first, suggesting the design potential of contextual alternates, which is particulalry pertinent to scripts.</p>
      <p>It inspired me to produce Handsome Pro, released in early 2005, about the same time as Christian Robertson's Dear Sarah.</p>
      <p>The idea is to use a system of alternates rather than precomposed ligatures, which I demonstrated in a TypeCon 2005 workshop, along with Adam and Thomas. There's still a lot of unexplored territory in this area, for instance, enough already with the fancy retro scripts, where are the fonts that look like real contemporary handwriting? A second generation is no doubt in the works. </p>
      <p>Also, I'm still waiting for the release of a roman face which uses contextual alternates to simulate the vagaries of letterpress -- or did I miss that?</p>
