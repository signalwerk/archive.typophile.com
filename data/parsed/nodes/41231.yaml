      <p>I can't imagine not selecting Bickham Script Pro as one of the couple of typefaces. It was one of the first script typefaces to do *really* complicated ligature/alternate stuff in OpenType, and it is still one of the most complex, and with very few bugs in its implementation. Caflisch Script Pro is great, too, but nowhere near as cool (albeit more of a pioneer).</p>
      <p>I don't find glyph count very convincing by itself, even though it makes our (Adobe's) fonts look "better." First, there are more or equally important things to sheer glyph count. Second, our practice of duplicating certain glyphs inflates the glyph count relative to other fonts. (Note that thanks to subroutines, it doesn't have much impact on file size.) But if you were to count that way, either Arno or Hypatia Sans would come out "on top":</p>
      <p>Arno Pro Regular: 2845<br>
      Hypatia Sans Regular: 3057<br>
      Hypatia Sans Italic (coming soon): ~3092<br>
      Arno Pro Italic: 3222</p>
      <p>Not that I'd pick Hypatia Sans as either a pioneer or best of, myself. I agree that one of Robert's text faces such as Arno makes a great representative for OpenType.</p>
      <p>Cheers,</p>
      <p>T</p>
