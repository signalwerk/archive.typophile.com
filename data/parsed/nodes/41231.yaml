      <p>Both Thomas (Hypatia) and Karsten (Tiptoe) have done interesting, dare one say pioneering, work with Stylistic Sets, pushing the notion of what constitutes a typeface (as if OpenType itself didn't call that into question).</p>
      <p>Stylistic Sets is the youngest OpenType feature, a proliferation of the initial Stylistic Alternate feature, and it appears to be turning into the conceptual key that a type designer can use to manage the multiple potentialities of an emerging type design.</p>
      <p>I'm developing Stylistic Sets in the Modern Suite to manage varying degrees of historicism in the Greek characters as defined by Unicode. Thomas has done a similar thing enabling the Hypatia user to pick a point on the axis between old style and modern, by applying overlays of Stylistic Sets.</p>
      <p>Tiptoe offers its users the Stylistic Set of "Typographic Spacing", which increases space between word and punctuation, word and guillemet, word and index numeral, currency symbol and numeral. That's like alternate kerning.</p>
      <p>In some ways, Stylistic Sets are like the axes of the Multiple Master format, but the infinitely variable nature of that technology always bothered me. With the alternates in Stylistic Sets, each glyph is carefully considered by its designer, and the typography consequently more purposeful.</p>
      <p>TipToe also has fractions that align differently in oldstyle and lining context. It seems to me that this kind of nuancing, of the way that a large font can be organized by its designer into different groups of characters, and alternates made which optimize the relationships between members of different groups, is a great and subtle potential of OpenType.</p>
      <p>The Case feature is a prime example of this: initially it was implemented to allow different punctuation for all-caps (e.g. raised parentheses).  But now a designer can add typeface-specific content to this feature. For instance, a font with default "three-quarter" lining figures, for use in U&amp;lc and general setting, may be equipped with a cap-height set of lining figures weighted to the capitals. And these figures are deployed seamlessly when "All Caps" is selected by the typographer.</p>
