      <p>Thomas Phinney -- <cite>Caflisch Script Pro is great, too, but nowhere near as cool (albeit more of a pioneer).</cite></p>
      <p>Speaking of best-of, Bickham Pro may be the choice. (And as regards technical solutions one can always learn from Adobe.)<br>
      Speaking of pioneers, I consider Caflisch Script as more important. Not so much because it was first in terms of publication date, but because it was the first* typeface where contextual alternates and ligatures are really essential -- it would not be the same <em>design</em> without them. (Apple Zapfino and even Bickham Pro may do without contextual alternates and still be Apple Zapfino and Bickham Pro.)</p>
      <p>* The first? One of the first? I don't know exact dates.</p>
