      <p>Caflisch Script Pro was indeed the first *OpenType* typeface to make significant use of contextual alternates, contextual ligatures, and big multi-letter ligatures (like "offi"). It was bundled with InDesign 2.0, which was the first significant application to support such features. Bickham Script Pro shipped a year and a half later, with InDesign CS(1).</p>
      <p>(Of course, the GX version of Zapfino may pre-date even Caflisch Script Pro, but the question was about OpenType pioneers.)</p>
      <p>Regards,</p>
      <p>T</p>
