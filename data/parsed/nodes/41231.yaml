      <p>I think Nick was calling my name...</p>
      <p>I recall the first OpenType fonts that we tested in InDesign being Adobe Caslon Pro, Garamond Pro, Warnock Pro, Tekton Pro, etc.  The first really fun font was Caflisch and we liked showing that one off! We also tested with Palatino Linotype pretty early.<br>
      Generally, these early fonts were just slightly better than the Type 1 font would have been. You got a few more characters supported, you got a couple ligatures, old-style figures, fractions...<br>
      The choice of a best/pioneering OpenType font would choose the font(s) that inspired all of the really amazing fonts being sold today (Ed Interlock, all of the script faces, etc.)  Caflisch Script Pro might be that pioneer, but I'm not sure (since I'm not a font developer) what faces inspired Tal Leming's work, Alejandro Paul’s work, etc.</p>
