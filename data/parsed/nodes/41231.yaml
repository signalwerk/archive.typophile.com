      <p>Adobe were the pioneers of course -- they created fonts with all the OpenType features, concurrrently with developing the software applications which support those features, a "symbiotic" process testing one against the other.</p>
      <p>Robert Slimbach's Caflisch, for instance, which already had many alternates in Type 1, was a natural candidate for applying the contextual alternates, swash, and ligature features in a script font. This was some time before Cézanne Pro.</p>
      <p>At least, that's my impression, but Adobe's Typophilers can probably give a fuller account--I'd be particularly interested in Eric's perspective. </p>
      <p>Subsequently, Zapfino Extra Pro and Bickham pushed script coding further, because AFAIK these were designed with OpenType in mind.</p>
      <p>However, before OpenType, Emigre's "Ligmaker" utilized substitution routines for implementing Mrs Eaves' eccentric ligatures. </p>
      <p>I don't think you can say that any one face makes the best use of OpenType, because by now the technology has been subsumed into the design process, so may be used integrally by different type designers for quite different purposes that are hard to compare.</p>
    html_clean: |-
