  - id: 66019
    user: 1112
    date: 2003-03-03T14:54:00
    date_raw: 3 Mar 2003 — 2:54pm
    votes: null
    html: "<p>I don't know why Emigre fonts mostly leave me cold. I never seem to have projects that Emigre fits nicely, at least in my opinion. I appreciate their craft, but their designs just don't usually speak to me, with the notable exception of Triplex Sans Condensed, but I would never set text in Triplex Sans, so I'm out of luck for this project. Quelle bummer. <br> <br>FF Meta, on the other hand, seems to be gaining interest for me. Info, as HD pointed out, has a softness to it that may ultimately undo it for me, plus that the romans and the italics are in two different sets, as opposed to separated by weight. I don't understand people sometimes. <br> <br>Here's the lowdown on the Impact logo -- I didn't design it so much as redesign it. Originally it was like this: <br> <br><img src=\"http://www.typophile.com/forums/messages/30/7151.jpg\" alt=\"impact old\"> <br> <br>And I never really cared for it that much. The old artistic director (as opposed to an art director) made it. So when I came on board, I just wasn't using it on posters, and no one seemed to notice. <br> <br>Then I came up with a different direction: <br> <br><img src=\"http://www.typophile.com/forums/messages/30/7152.jpg\" alt=\"impact revision\"> <br> <br>But it turned out, they liked their logo and didn't want to go too far afield. (Plus, I'll admit, Bell Gothic is a bit overused these days.) So I fused the two into a solution I can live with: <br> <br><img src=\"http://www.typophile.com/forums/messages/30/7153.jpg\" alt=\"impact\"> <br> <br>I'm mostly happy with it, but it's really hard to use. I'm currently trying to get them to agree to a fundraising idea where we just have t-shirts with the logo without the splat, and people can pay to shoot a paintball gun at their shirt and make their own splats. Could be fun.</p>"
