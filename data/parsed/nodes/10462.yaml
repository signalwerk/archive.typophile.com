    date_raw: 27 Feb 2003 — 3:49pm
    votes: null
    html: "<p>The Mix is a bit extravagant, quite annoying in longer texts (I think the German magazine H=F6rzu used it, horror on the eyes. ) Other than = that ANY font by Lucas is well worth ist money, you'll never regret spending your money on him :-). I cannot think of another European Font Designer with as much flair and a taste for readable and practical, yet very unique and individual fonts. Luc(as), in my humble opinion, is one of the finest typographers on the continent, with a sense of sleek and pure functionality and a wild streak that leads to monstrous gigantic families and hundreds of extra characters and thousands of kerning pairs... And on lucasfonts.com we just see the fonts on sale, there's a bit more he did for corporate designs, like the Volkswagen Futura riff, a Multiple Master with old style figures... Coolest Futura ever :-). <br> <br>Also very good, if you work with InDesign, albeit not as unique as Lucas work: Chaparral pro and Myriad pro, both available at adobe.com</p>"
