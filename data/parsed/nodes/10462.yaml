  date_raw: 27 Feb 2003 — 2:48pm
  votes: null
  html: "<p>I'm the art director for a small theater company whose unofficial motto is \"theater for people who hate theater; theater for people who love theater.\" <br> <br>Our audience, for the most part, ranges from 18-35, not your typical theatergoing crowd. Here is the logo, plus some recent poster images, to give you an idea of the kind of work we do: <br> <br><img src=\"http://www.typophile.com/forums/messages/30/7036.gif\" alt=\"impact\"> <br> <br><img src=\"http://www.typophile.com/forums/messages/30/7037.jpg\" alt=\"scab\"> <br> <br><img src=\"http://www.typophile.com/forums/messages/30/7038.jpg\" alt=\"henry iv\"> <br> <br><img src=\"http://www.typophile.com/forums/messages/30/7039.jpg\" alt=\"mouse\"> <br> <br>Now, the request: I want to select a typeface (with both display and text weights) that reflects the company's attitude. Show logos will always vary, but I want to keep the information font the same from poster to poster (other design elements will also help create a consistent look among posters). <br> <br>In addition, I want the typeface to be appropriate for text usage, such as for the program. Two faces I've considered are <a href=\"http://www.typography.com/catalog/gotham/index.html\">HTF Gotham</a> and <a href=\"http://www.psyops.com/html/spec_faceplate.html\">PsyOps Faceplate Sans</a>, but neither seems to really fit the bill. <br> <br>Any suggestions will be quite helpful.</p>"
  html_clean: "<p>I'm the art director for a small theater company whose unofficial motto is \"theater for people who hate theater; theater for people who love theater.\" <br> <br>Our audience, for the most part, ranges from 18-35, not your typical theatergoing crowd. Here is the logo, plus some recent poster images, to give you an idea of the kind of work we do: <br> <br><img src=\"http://www.typophile.com/forums/messages/30/7036.gif\" alt=\"impact\"> <br> <br><img src=\"http://www.typophile.com/forums/messages/30/7037.jpg\" alt=\"scab\"> <br> <br><img src=\"http://www.typophile.com/forums/messages/30/7038.jpg\" alt=\"henry iv\"> <br> <br><img src=\"http://www.typophile.com/forums/messages/30/7039.jpg\" alt=\"mouse\"> <br> <br>Now, the request: I want to select a typeface (with both display and text weights) that reflects the company's attitude. Show logos will always vary, but I want to keep the information font the same from poster to poster (other design elements will also help create a consistent look among posters). <br> <br>In addition, I want the typeface to be appropriate for text usage, such as for the program. Two faces I've considered are <a href=\"http://www.typography.com/catalog/gotham/index.html\" class=\"link-external\">HTF Gotham</a> and <a href=\"http://www.psyops.com/html/spec_faceplate.html\" class=\"link-external\">PsyOps Faceplate Sans</a>, but neither seems to really fit the bill. <br> <br>Any suggestions will be quite helpful.</p>"
