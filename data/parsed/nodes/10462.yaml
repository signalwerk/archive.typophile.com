    html: "<p>FF Info.  <br>VERY nice font, typical Spiekermann, a mix of Meta and Officina sensibilities. But be careful: The info, you can't see this as clear on he web, is very rounded, as it was designed for the Duesseldorf International Airport and was to be used in backlighted signs and displays. So it has a very unique feel, and after a time of using it as nodesign's house-font, I got very very tired of it, especially as it isn't really a good font for longer text. (Well, duh.. the new CD font we use is FF DIN, not much better to read when it comes to long texts, but at least clearer and colder... and better suited for the steel engraving we use on our letterheads and biz cards).  <br> <br>Bliss is cool but will rip a massive hole into your pockets as well, Jeremy Tankard ain't cheap :-D. </p>"
