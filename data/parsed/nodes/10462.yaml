    html: <p>Luc(as) OSFs are more modern, not as playful as the Neufville Medievals. Neufville looks more Art Deco, but Luc somehow captured the cleaner, more geometric and practical aspect of the Futura. While it doesn't feel as historical, maybe, it just fits better into the context and it is MUCH better for practical purposes, at it doesn't feel as jarringly old-fashioned. Such a shame I cannot use that font in any commercial work at all, as it is licensed to Volkswagen exclusively. </p>
