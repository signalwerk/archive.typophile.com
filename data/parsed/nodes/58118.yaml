      <p>&gt;I’m beginning to come to the conclusion that the only way for such a font to be created is to do it myself.</p>
      <p>It's a bloody ungrateful job :-) The linguists just cannot <em>stop</em> adding new "variants" into the mix. And more likely than not, you <em>will</em> need regular, italics, bold, and bold italics -- at least for the most frequent characters.</p>
      <p>For tools, you are required to have a program that can output either only TrueType, or full-fledged OpenType. That is, unless you want to restrict yourself to a niche market with some propriety format! There are lots of editors, from nigh-on usable to excellent -- FontLab is considered the very best. FontForge is a free product, but you'll have to wrestle it into submission first.</p>
      <p>You will need a fairly advanced editor if you want to add OTF goodness. Microsoft VOLT (free) might be useful if you want to add self-aligning diacritics, although I didn't try that myself so far.</p>
      <p>As for methods: there seems no way around 're-using' parts of the target font. You need at least the same x-height and stem width for your new characters. Since most IPA characters are based on existing ones, you can use parts as base for the new ones. Some artistic appreciation comes in handy if you need to rotate an existing glyph; some regular fonts, and most italics, do not survive that treatment without extensive re-aligning of stems and diagonals. It's hell to create a pleasing italic schwa (rotated 'e') ...</p>
