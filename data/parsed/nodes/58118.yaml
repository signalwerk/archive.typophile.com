      <p>IPA is essentially an extension of the Latin lowercase alphabet. A few letters of non-Latin origin are encoded in Unicode with latin codepoints because these are also used in the alphabets of e.g. African languages and have uppercase mapped characters that differ in form from the mappings in the original script. Case mapping is a functional character property, so needs to be distinguished at the character level. As you note, a few Greek letters in IPA are not separately encoded as Latin letters, because the distinction between their Latin and Greek use is not functional, only stylistic, and hence is considered a glyph-level distinction.</p>
      <p>In the current software environment, my recommendation to clients is to have separate fonts for IPA, and not to try to support IPA in the context of fonts that also provides more typical Latin and Greek. This is not only an issue for Greek letters, by the way, but also for some Latin letters. IPA makes a semantic distinction between e.g. double- and single-storey lowercase a, which has implications for the design of italic IPA fonts. Similar issues exist for the f and g. The easiest way to manage these design issues is to make separate IPA fonts.</p>
      <p>That said, the new OpenType 1.6 specification list of <a href="http://www.microsoft.com/typography/otspec/languagetags.htm" rel="nofollow">language system tags</a> includes entries for IPA and Americanist phonetic transcription, and these can be used to trigger 'locl' variant glyph forms. But I'm not aware of any mainstream typographic layout software that yet implements these.</p>
