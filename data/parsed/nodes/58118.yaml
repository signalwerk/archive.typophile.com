      <p>This is an issue I have been tackling, and so while I don't know that my solutions are the best or even recommendable yet, I can illustrate my experiences. In the example below I decided to not have a Greek with a Latin-like ductus, nor to hybridize it too much (either being options when you know that your font will support both Greek and phonetic transcription) so am left with the problem being discussed here. </p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/latin_Greek_5082.png"></div><p></p>
      <p>I can't say these are final forms, or that I am completely satisfied with how they work yet, but they suggest a possible approach, at least for this particular typeface. Shown at the top are some glyphs from the normal Greek, followed by their ‘Latinised’ counterparts, some of which are encoded as IPA, some of which need to be mapped by some other mechanism. Without support for locl-variants, one option would be via stylistic sets, the other (more complicated) option would be to trigger the alternates display via [calt]. Either of these hacks presuppose you don't take the recommendation to have a separate IPA font for whatever reason.<br>
      In the above sample, there are a couple of implementations shown for different contexts: Americanist and IPA. Both have similar problems in harmonizing forms, but IPA will tend to discrete amounts of text rather then continuous text (whether or not that has an influence on how the forms develop is debatable). Another consideration for languages which use the Americanist system is that it is possible readers will be unfamiliar—or otherwise find odd—the overtly Latinised forms of some of the (IPA) Greek characters, as materials published may well have only used more ‘traditional’ Greek letterforms (e.g. the gamma, vs. the IPA gamma) and so there is a chance a third form needs to be made.</p>
