      <p>Thank you, Peter and Ross, for your fine posts. It's great to have an overview of the current options for setting IPA as well as a preview of what's to come.</p>
      <p>The selection of freely-available non-SIL IPA fonts made me cringe. I hope at least that those who use IPA symbols regularly would know better than to use these.</p>
      <p>Huronia (the design in Ross's sample) is looking really great! In addition to the IPA symbols needed for American languages, I like the organic design of the Canadian Syllabics, especially the cursive. My only complaint is that the small Latin letter upsilon, ʊ, looks too literally like a small upside-down capital omega at the moment; I think the serifs should be simple. But that's very much a minor complaint about a typeface that everyone dealing with American languages will be extremely grateful for. Any idea when it will be ready?</p>
