      <p>Andreas, your approach makes assumptions about the design of the Greek. If, as you have done in Andron or Victor Gaultney has done in Gentium, the Greek shares the same stroke contrast pattern as the Latin, then the Greek letters may serve as IPA forms. But if the Greek is designed with a traditional steep contrast pattern, then these letters look really out-of-place in IPA.</p>
      <p>There is nothing ‘anachronistic in the age of Unicode’ about providing separate fonts for specialised purposes, since there is absolutely nothing in the Unicode Standard that demands or even recommends that multiple scripts be stylistically harmonised in a single font.</p>
