      <p><cite>1. Of the Greek characters without IPA-specific codepoints, beta is by far the most problematic. Really think hard about offering a latinized glyph variant.</cite><br>
      I agree. However, if a proper blending of Latin and Greek is seen as a desirable option for fonts, it would not be neccessary.</p>
      <p>   <cite>2. If you make sure that your theta stands upright and that your Greek and Latin have generally similar weight and ductus, you might be able to get away with one glyph for both systems.</cite><br>
      This shall be the target. </p>
      <p>  <cite>3. I consider chi to be an unsolved problem for the IPA. It seems to me that there must be a way of unifying its stroke weight and serifs with the Latin without making it and the letter x hopelessly ambiguous. Could a chi-like glyph based on the letter y (with serifed upper terminals and a ball terminal on the descender) be successful? Maybe a Q-like terminal on the downward diagonal? Previous efforts suggest not satisfaction but surrender; this calls for further experimentation.</cite><br>
      See my last posting for that.</p>
      <p>Allow me one last remark adressed to all Do-it-yourself-fontists: D O N ’T  do it – unless you’re a trained type designer. The samples shown above of all these free fonts may illustrate what I mean.</p>
