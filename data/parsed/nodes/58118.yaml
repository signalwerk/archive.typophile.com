      <p><em>‘My only complaint is that the small Latin letter upsilon, ʊ, looks too literally like a small upside-down capital omega at the moment[...]Any idea when it will be ready?’</em></p>
      <p>If you're looking at the specimen on the website, its nearly two months out of date—yes, I did change the design of ‘ʊ’. I hope to have the regular done soon, but can't give an exact date as its being done on my own time and dime.</p>
      <p><em>‘your small-cap ƛ. Who did you design this for? Are there any languages that use the symbol in their practical orthographies?’</em></p>
      <p>I designed it for whoever uses the barred lambda. My general principal was/is to provide users with full casing support (uppercase, lowercase, and smallcaps), insofar as possible and practical, despite the fact many languages have not traditionally had that option. It may be the lack of full casing for some characters has become a defacto standard or at least the expectation—ie. official orthographies may not specify casing rules, but this doesn't preclude casing being used for titling, emphasis etc.. I simply want to present users the same typographic sophistication available to other <em>(majority)</em> languages—whether or not anyone will use them, I don't know yet, but at least the option is there.</p>
