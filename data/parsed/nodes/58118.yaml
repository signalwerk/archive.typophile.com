  html: <p>Many characters in <a href="/wiki/International%20Phonetic%20Alphabet" class="freelinking" rel="nofollow">IPA</a> are based on Latin and Greek forms. Is considered an independent alphabet for them but Unicode unifies them with Latin letters, except for three characters that are unified with the actual Greek ones (the beta, the theta and the chi). The IPA is not supposed to be neither Latin nor Greek set, but that unification feels awkward since the Latin and Greek characters have different traits, and I've seen the beta drawn with a serif at the bottom in some IPA resources. Do you think that Unicode needs to make "Latin" characters for these? If not, what's the best way to create both an "unified" set for IPA and providing proper support for the greek characters at the same time? Or is fine as it is and all the somewhat Greek characters must maintain his Greek form?</p>
  html_clean: <p>Many characters in <a href="/wiki/International%20Phonetic%20Alphabet" class="freelinking link-lost" rel="nofollow">IPA</a> are based on Latin and Greek forms. Is considered an independent alphabet for them but Unicode unifies them with Latin letters, except for three characters that are unified with the actual Greek ones (the beta, the theta and the chi). The IPA is not supposed to be neither Latin nor Greek set, but that unification feels awkward since the Latin and Greek characters have different traits, and I've seen the beta drawn with a serif at the bottom in some IPA resources. Do you think that Unicode needs to make "Latin" characters for these? If not, what's the best way to create both an "unified" set for IPA and providing proper support for the greek characters at the same time? Or is fine as it is and all the somewhat Greek characters must maintain his Greek form?</p>
