      <p>Peter, I would use FontLab FontStudio. I've been using FontLab a long time, including the period when we used "Buffalo TeX" (our implementation of the old Y&amp;Y TeX).</p>
      <p>But that was 8-bit fonts. Now we use InDesign. It may be that another font editing program would better meet your needs if you plan on sticking with a 16-bit version of TeX. Are you going to have to rewrite all the OT features for the TeX you use? Is the fact that FontLab will compile the existing features of Garamond Premier Pro of interest to you? Those sorts of questions.</p>
      <p>The program is not cheap; there may be a student discount.</p>
      <p>The learning curve is not quick, but it is worth it.</p>
      <p>If you cannot draw -- not in the sense that Matthew Carter meant when he said "I can't draw", but in my sense, where I *really* can't draw, you can still do work. Basically, as complicated as I get is to cut apart existing pieces &amp; hook them up again. If the curves need a little work, I can do that. I never start from scratch; I don't have the skill.</p>
      <p>This runs counter to most of the people who hang out on Typophile, they can all draw, can all create glyphs from scratch. But with patience, you can fiddle things into shape.</p>
      <p>Charles Ellertson</p>
      <p>Edit: I see the subject of feature files has come up.</p>
      <p>FontLab will export and export feature files. I use an old text editor to write them, Vedit. A better, modern program would be  EditPad Pro. Much better than writing the features in FL, but that too can be done.</p>
