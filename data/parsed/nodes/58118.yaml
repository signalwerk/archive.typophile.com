      <p>Andreas, a couple of contra points:</p>
      <p>I am not advocating a particular style of Greek typography, and not the Byzantine cursive style per se, although I have designed a couple of types in this style. I am pointing out that, for any script, one needs to be aware of the tools and techniques that contributed to the basic shapes, and to recognise that it is possible to do violence to those shapes and how they relate to each other if one applies the logic of different tools and techniques.</p>
      <p>The most common typographic text style in Greece for serious publishing remains the Didot styled types that in Greek are commonly referred to as <em>apla</em>, i.e. ‘normal’, and typified by Monotype Greek 90. The corresponding italic is of Leipzig origin. These represent an authentic modernisation of the Byzantine lowercase, in the Romantic period corresponding to the Greek war of independence and hence strongly associated with the rebirth of the Greek nation. Typographically, they take into account both the change in common writing tool and developments in paper manufacture and printing refinement, as do the Latin types of the same period. But they do so in a way that preserves the distinctive character of the Greek letter shapes.</p>
      <p>It simply is not true that the Byzantine minuscule style of Greek typography was developed ‘entirely without Greek participation’. I recommend to you Constantine Staïkos' <em>Charta of Greek Printing,</em> which catalogues the contribution of Greek émigré scholars, scribes, and printers across Europe.</p>
