    html: <p>Andreas, one person's ‘harmonised’ is another person's ‘Latinised’. What's ‘classical’ in this context? Obviously not classical Greek letterforms, since there was no minuscule alphabet in the classical period. When Greek minuscule letters developed, they did so in a Byzantine context and they share the characteristics of most other near-eastern writing, notably the steep nib angle. So the normative forms of Greek letters derive from a particular tool, the reed nib, held at a particular relationship to the page, and on the other hand there are Latin minuscule letters whose normative forms derive from a similar tool but held at a very different relationship to the page. Changing the stroke contrast model of the Greek letters so that it harmonises with that of the Latin letters is, in my reckoning, a form of Latinisation. Sure, people have been doing it for quite a long time now, and depending on a number of factors -- tellingly, on the nature of the Latin design to which the Greek is harmonised -- the results may be pleasing in themselves. But that doesn't change the nature of the exercise.</p>
