      <p>Andreas asked me by email to talk about the history of Greek glyphs in the IPA and discuss some options for the modern designer, and I figured I might as well make my reply here, where others can view and discuss the matter. To review Peroyomas's opening post, the IPA mostly consists of variants on latin minuscule characters, with a few small caps and handwritten forms thrown in for good measure. It also includes eight glyphs of greek origin:</p>
      <p>0251 Latin small letter alpha (ɑ)<br>
      0252  Latin small letter turned alpha (ɒ)<br>
      028A Latin small letter upsilon (ʊ)<br>
      0263 Latin small letter gamma (ɣ)<br>
      0278 Latin small letter phi (ɸ)<br>
      03B2 Greek small letter beta (β)<br>
      03B8 Greek small letter theta (θ)<br>
      03C7 Greek small letter chi (χ)</p>
      <p>The Handbook of the International Phonetic Association of America, which is as close as we can get to the holy word on the issue, has this to say in its Appendix 1:</p>
      <p>"In the construction of the IPA attention has been paid not only to the appropriateness of each symbol from a phonetic point of view, but also to the suitability of symbols from the typographical point of view. The non-roman symbols of the IPA have, as far as possible, been made to harmonize with the roman letters. For instance the Greek letters included in the IPA are roman adaptations; as the ordinary shape of the greek letter [inclined beta] does not harmonize with roman type, in the IPA it has been given the form [upright beta with serifed descender]."</p>
      <p>The extent to which the Greek characters of the IPA must be latinized is thus somewhat open to debate - on the one hand, merely setting them upright and unifying weight and ductus with the corresponding Latin characters might be adequate. On the other hand, the Handbook says that the characters should be harmonized "as far as possible", and most type designers have gone quite far indeed.</p>
      <p>To begin with, the first four characters listed above are, in essentially all IPA faces, treated as symbols distinct from their Greek counterparts, and have received separate codepoints in the IPA. 0251 (ɑ) is normally drawn as a handwritten single-story lowercase "a", although in handwriting many phoneticians draw it as a greek-looking fish-alpha. 028A (ʊ) has absolutely nothing to do with greek upsilon (υ) and is instead always drawn as a rotated small-cap Omega. 0263 (ɣ) is always drawn upright, horizontally symmetrical, and with a visible counter in its descender.</p>
      <p>Of the remaining characters, the IPA version of phi has its own codepoint, but the rest do not. In general, chi is the least harmonized of the Greek IPA characters, usually retaining a cursive aspect to set it apart from lowercase x, with which it must be frequently contrasted. Beta, theta and phi, however, are usually drawn to closely resemble their latin counterparts.</p>
      <p>The semi-official typeface of the IPA during the 90s was LaserIPA, drawn by <a href="http://www.linguistsoftware.com/" rel="nofollow">Linguist's Software</a>. It's a very Times-like font; graceless and ordinary, but it gets the job done.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/LaserIPA_3419.png"></div><p></p>
      <p>Note the serifed descender of the beta, which perfectly matches the p. The phi features a similar but narrower stem, with a serifed descender and an ascender that's not quite like anything else in the latin lowercase. The chi remains thoroughly non-latin, with a stroke weight that completely contradicts the x, no serifs of any kind, and a cursive crossbar.</p>
      <p>The earliest professionally cut IPA fonts were variants of ITC Stone and Linotype Times, which Adobe still sells. Here is Stone Serif Phonetic, with some reference characters from Stone Serif Medium:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/StoneSerif_4092.png"></div><p></p>
      <p>Again, the beta features a serifed descender which matches the p. The the stem of the phi is much closer to that the of the beta and p, although still noticeably thinner, and again featuring the unusual top-serif which seems to be drawn from the uppercase I. The theta is simply the numeral zero with a crossbar drawn from uppercase H. Chi is again exhibits the opposite stroke weight of the x, although an awkward attempt at furnishing the character with weird, stubby serifs has been made.</p>
      <p>According to Adobe, Linotype's Times Phonetic is designed for eight points, and I don't have a matching optical size for comparison, so please forgive me for using Apple's twelve point edition of Linotype Times.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Times_4041.png"></div><p></p>
      <p>I think this face is particularly disastrous. As you can see, the beta is not a beta at all, but an ess-tzet (!) with a descender stolen from the lowercase p. (I hope we can all agree that this precedent should not be followed by future designers). Theta, again, is a zero with a crossbar, and chi remains almost entirely Greek. Compare the phonetic symbols with the Greek glyph's from Apple's Times on the second line.</p>
      <p>The consensus among the early designers of IPA typefaces is therefore pretty clear: Letter forms are upright; chi maintains the Greek ductus while beta, theta and phi adopt the latin ductus. Phi has an ascender and descender with uppercase-I like serifs. The descender of beta matches the descender of p and q.</p>
      <p>The SIL fonts Charis (above) and Doulos (below) follow this precedent precisely:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/SILfonts_4982.png"></div><p></p>
      <p>Neither one has an associated Greek type, so there's nothing to worry about with respect to the shared codepoints. Gentium, on the other hand, has full coverage of Latin, Greek, and IPA:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Gentium_6713.png"></div><p></p>
      <p>Gentium's calligraphic ductus allows the Greek and Latin to share the same stroke without doing undue violence to either (although I cannot emphasize this enough: despite being a linguist's dream in terms of glyph coverage, its texture makes it weird to the point of unusability for body text). Unfortunately, I think that the Greek beta just does not work with the other IPA glyphs. The use of the d's ascender on IPA phi seems logical enough, but I can't help but find the glyph a little disconcerting - maybe the stem robs the bowl of its negative space, and it needs to be wider to stand up to the p? Theta works fine in either a latin or Greek context, here (again, due mostly to Gentium's harmonizing, vaguely hand-drawn quality).</p>
      <p>Just to round things off, here are some of the other (non-SIL) freely available IPA fonts. From top to bottom, Cardo, Junicode, LeedsUni, and Titus Cyerbit.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Misc_3658.png"></div><p></p>
      <p>I think you will agree with me that these are all unmitigated failures.</p>
      <p>Let me conclude, then, with a few thoughts.</p>
      <ol>
      <li>Of the Greek characters without IPA-specific codepoints, beta is by far the most problematic. Really think hard about offering a latinized glyph variant.</li>
      <li>If you make sure that your theta stands upright and that your Greek and Latin have generally similar weight and ductus, you might be able to get away with one glyph for both systems.</li>
      <li>I consider chi to be an unsolved problem for the IPA. It seems to me that there must be a way of unifying its stroke weight and serifs with the Latin without making it and the letter x hopelessly ambiguous. Could a chi-like glyph based on the letter y (with serifed upper terminals and a ball terminal on the descender) be successful? Maybe a Q-like terminal on the downward diagonal? Previous efforts suggest not satisfaction but surrender; this calls for further experimentation.</li>
      </ol>
