      <p><cite>… to just have a separate font.</cite></p>
      <p>This is but anachronistic in the age of Unicode and completely archaic when it comes to text composing including IPA. There’s normally no need to have a “greek beta” alongside with a “latin/ipa beta”.<br>
      A good multiscriptual font blends Latin and Greek smothly without unduely equalizing them. Hence the fitting of some greek letters into the latinish IPA set should work smoothly as well. If not, choose a better typeface.<br>
