      <p>John: <em> The descending hook is a generative form in IPA (palatal); so even though the hooked-descender f is not used within IPA, I think descending hooks within that system should not be treated as stylistic elements as in typical italic typefaces.</em></p>
      <p>Okay, I see where you might have gotten that idea, but the "featural" elements of the IPA shouldn't be treated as the featural elements of a system like Hangul. Each glyph is individually defined. While there are a few recurring elements that seem to have their own meaning (like the right hooked descender that derives all the retroflex consonants from the alveolars), this shouldn't be extended to the j-tail of the palatals. For one thing, there are palatals that don't have it (c, ç and ʎ), but more importantly, the idea of /f/ with palatal coarticulation is nonsensical. An /f/ with a palatal secondary articulation would be transcribed as /fʲ/. No one could ever see the italic f and confuse it for anything (except maybe ʃ or ʄ, but there will always be similar-looking characters in a system as finicky as the IPA). Anyway, italic f in IPA should definitely have the same form as the corresponding text font.</p>
      <p>Ewe is another story, and I thank you for pointing it out to me. Sounds like a good job for that Sabon-style italic f.</p>
      <p><em>I think it needs to retain some chi-ness, probably through retention of the Greek stroke contrast: otherwise it looks too static.</em></p>
      <p>Obviously you have precedent on your side with that position; but if nothing else in the system has Greek stress, I just think the chi ends up looking terribly lost.</p>
