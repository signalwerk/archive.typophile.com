      <p><cite>There’s normally no need to have a “greek beta” alongside with a “latin/ipa beta”.</cite></p>
      <p>I'll have to disagree here. Not all Greek typefaces for text are designed to blend smoothly alongside the Latin. Some historically-informed designs of Greek follow a different ductus from the Latin. Why should these designs be cast aside as anachronistic just because the Greek letters don't look like Latin letters?</p>
      <p>There are other cases where straightforward equalization based on Unicode points doesn't work. In most normative Korean text fonts, the period and the comma will be a bit smaller and sit somewhat lower than would be appropriate for the Latin. But there are no separate Unicode values for the 'hangul period' or the 'hangul comma' (those would be ridiculous). There are loads of such cases, due to different stylistic preferences in different languages or different traditions. Until the OpenType locl feature is widely supported, having separate fonts is probably the best solution.</p>
