      <p>Peter: <em>John, you are correct to point out the need to distinguish the single- and double-story as in Italic IPA, and that g should always appear in a single-story variant. However, I’m not sure I know any system where your two f glyphs are contrastive...</em></p>
      <p>Yes, that needs a bit more explanation. The descending hook is a generative form in IPA (palatal); so even though the hooked-descender f is not used within IPA, I think descending hooks within that system should not be treated as stylistic elements as in typical italic typefaces.</p>
      <p>The hooked-descender f is used extensively in African alphabets (to indicate a voiceless bilabial fricative), and needs to be distinguished in form from the regular f character. In an italic font, this means that the regular f needs a localised form, either non-descending or with a straight descender.</p>
