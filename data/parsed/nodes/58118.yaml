      <p><em>‘...the question about a separate phonetics font then, is simply how to draw the glyphs that must reside in the Greek Unicode spots. If that is the extent if it, I’d reverse myself on an earlier objection to separate fonts for IPA and Greek...’</em></p>
      <p>The answer is that there are options. The approach is dependent on the circumstance. The user may have some valid rationale for wanting a single font, or separate fonts. This decision may be informed by whether the typeface is new, and decisions can be made from the ground up, or whether you have to work with an existing design, whose IPA and Greek glyphs may or may not be usable, elegant, or functional. If this is the case, are you willing to re-draw the Greek to suit an environment in which they are used for phonetics? Does this compromise their use for Greek language text (if that is a priority)? Or perhaps you simply have to make do with what you have for fiscal reasons. Options.<br>
      Fonts are tools, and tools are mutable dependent on their application. The option I have shown for one particular typeface is one of maximum function and at the same time respecting the scenarios it may be used for; whether for typesetting Greek classics or Salishan—I can't discount either. Such an approach may well be outside the purview of a single project, but in the larger context of many diverse projects may be viable—and indeed preferable. So, it may be that re-working some glyphs is sufficient; or if you are willing to take on the baggage, a more comprehensive approach which will suit wider applications, if such development is not too onerous. Or, one could just license a typeface to suit, should it exist, and its design be suitable for its given tasks.</p>
