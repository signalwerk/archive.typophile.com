      <p>Ross, I love your small-cap ƛ. Who did you design this for? Are there any languages that use the symbol in their practical orthographies?</p>
      <p>John, you are correct to point out the need to distinguish the single- and double-story as in Italic IPA, and that g should always appear in a single-story variant. However, I'm not sure I know any system where your two f glyphs are contrastive - are you thinking, perhaps, of ɟ or ʃ?</p>
      <p>Theunis, the serifed beta <em>is</em> ugly on its own terms, but it has to be considered in the context of the latin characters here. I realize dressing a beta up like a Latin character seems like a cruel sort of thing to do, but I think it's better than sticking a Greek beta in the middle of a bunch of latin characters.</p>
      <p>For the thread, I recently stumbled upon IPAPhon, a very old (c. 1994) set of phonetic characters drawn up in the style of Palatino, created by <a href="http://www.chass.utoronto.ca/~rogers/" rel="nofollow">Henry Rogers</a>, a linguist at the University of Toronto. They are not totally unproblematic as typefaces, but I wanted to share a few of their attributes. For one thing, he gets the various a characters absolutely right:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/IPAPhonA_6080.png"></div><p></p>
      <p>I was also totally charmed by his latinized chi:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/IPAphonChi_3626.png"></div><p></p>
      <p>This is clearly just an x with a stretched-out downward diagonal and a normal-length upward diagonal, and it has no right to work as well as it does, but it strikes me as quite tolerable: noticeably distinct from x, latin, kind of clever and with a little bit of off-kilter personality.</p>
      <p>One other thing to consider when talking about italic IPA faces that I don't think anyone here has brought up is the contrast between v and ʋ (028B). ʋ is itself derived from an italic v, much as ɑ is derived from an italic a, but because the letter shapes themselves do not drastically differ, keeping them distinct is really hard. This is another problem that I don't think anybody has really solved adequately - here are a few of the faces I have that include italic IPA, and how they treat the issue:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/vs_6063.png"></div><p></p>
      <p>Gentium does it best, but I think it's just an irritating glyph in general. I never know how to handwrite it, either.</p>
      <p><em>The selection of freely-available non-SIL IPA fonts made me cringe. I hope at least that those who use IPA symbols regularly would know better than to use these.</em></p>
      <p>My desperation for a straightforward old-style phonetic typeface with italics is so deep that I actually seriously considered using Junicode for a few runs of IPA in a paper last year (I didn't happen to need any of the greek glyphs at the time). I'm beginning to think I may have to draw such a face myself. Unfortunately, my skills and experience are as close to zero as you could imagine. Can anyone here tell me about the methods and tools I would need to draw up the relevant glyphs in the style of, say, Garamond Premier Pro?</p>
    html_clean: |-
      <p>Ross, I love your small-cap ƛ. Who did you design this for? Are there any languages that use the symbol in their practical orthographies?</p>
      <p>John, you are correct to point out the need to distinguish the single- and double-story as in Italic IPA, and that g should always appear in a single-story variant. However, I'm not sure I know any system where your two f glyphs are contrastive - are you thinking, perhaps, of ɟ or ʃ?</p>
      <p>Theunis, the serifed beta <em>is</em> ugly on its own terms, but it has to be considered in the context of the latin characters here. I realize dressing a beta up like a Latin character seems like a cruel sort of thing to do, but I think it's better than sticking a Greek beta in the middle of a bunch of latin characters.</p>
      <p>For the thread, I recently stumbled upon IPAPhon, a very old (c. 1994) set of phonetic characters drawn up in the style of Palatino, created by <a href="http://www.chass.utoronto.ca/~rogers/" rel="nofollow" class="link-external">Henry Rogers</a>, a linguist at the University of Toronto. They are not totally unproblematic as typefaces, but I wanted to share a few of their attributes. For one thing, he gets the various a characters absolutely right:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/IPAPhonA_6080.png"></div><p></p>
      <p>I was also totally charmed by his latinized chi:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/IPAphonChi_3626.png"></div><p></p>
      <p>This is clearly just an x with a stretched-out downward diagonal and a normal-length upward diagonal, and it has no right to work as well as it does, but it strikes me as quite tolerable: noticeably distinct from x, latin, kind of clever and with a little bit of off-kilter personality.</p>
      <p>One other thing to consider when talking about italic IPA faces that I don't think anyone here has brought up is the contrast between v and ʋ (028B). ʋ is itself derived from an italic v, much as ɑ is derived from an italic a, but because the letter shapes themselves do not drastically differ, keeping them distinct is really hard. This is another problem that I don't think anybody has really solved adequately - here are a few of the faces I have that include italic IPA, and how they treat the issue:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/vs_6063.png"></div><p></p>
      <p>Gentium does it best, but I think it's just an irritating glyph in general. I never know how to handwrite it, either.</p>
      <p><em>The selection of freely-available non-SIL IPA fonts made me cringe. I hope at least that those who use IPA symbols regularly would know better than to use these.</em></p>
      <p>My desperation for a straightforward old-style phonetic typeface with italics is so deep that I actually seriously considered using Junicode for a few runs of IPA in a paper last year (I didn't happen to need any of the greek glyphs at the time). I'm beginning to think I may have to draw such a face myself. Unfortunately, my skills and experience are as close to zero as you could imagine. Can anyone here tell me about the methods and tools I would need to draw up the relevant glyphs in the style of, say, Garamond Premier Pro?</p>
