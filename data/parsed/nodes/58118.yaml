      <p><cite>What’s ‘classical’ in this context?</cite></p>
      <p>Admittedly, the term “classical” is somewhat misleading here when referring to Greek typography. Let me talk briefly about a personal experience.</p>
      <p>When I traveled to Greece two years ago I noticed many many magazines and newspapers sold were using typefaces which may be termed ‘hardcore latinised’. Then I talked about that to M. Savidis, a Greek scholar from Athens with a remarkable alertness of ‘Greekness in typography’. He said: oh, that is the wrong direction; many do feel ‘modernised’ when using such a typeface, but many others already claimed that this is not the way to go for Greek typography, because it’s ‘not really Greek’.<br>
      Considering that situation, one may conclude that the traditional byzantine Greek faces are thought of being ‘not modern enough’ to the Greeks themselves whereas the ‘modernised’ faces are ‘not Greek enough’ – to the same Greek eyes. An issue which already has been widely debated. – Why is the situation as such? </p>
      <p>My personal answer to that is, though rather political incorrect: the typical (byzantine) traditional ductus of the Greek minuscule typography is inferior to the typical (venetian) ductus of Latin minuscules (yes, bash me for that /////). Many do argue: why/how can Greek become “equal“ to Latin – regarding the close kinship of the two systems? The wrong interpretation of that question would be: “how Latin can Greek be”. The other possibility of dealing with that question is: “how can Greek get equally ‘modern’ to match (the rank of) Latin?”. This is something very different.<br>
      The attempt of finding a way through the middle is to carefully modernise Greek so as to make it ‘less byzantine, more modern, yet *not* less Greek’! I think that approach has a future and I am convinced that many Greeks themselves do feel like that.</p>
      <p>By the way, the typical byzantine minuscule mode (in typography) was developed – entirely without Greek participation. In fact, it’s a mere product of lousy central European lettermaking. Dwelling on Byzantinism for Greek type today is to lock Greek into foreign ungreekness. – No wonder that nowaday’s Greek eyes do imagine something else.</p>
