      <p>Well, of course you can always use three or more different typefaces for a multiscriptive text. But scholars who publish a 300-pages volume loaded with mixed text simply don’t want to do this, they seek a typeface which covers *all* they need. 8-bit-encoding was launched to enable precisely that: typeset more than one script at once with just one font. That remains the target. All I wanted to express is that in the case of IPA it is possible to find a typographically convincing solution for that. – By this I do not want to generally question the possible reasons for adjusted local fonts (I did some myself).<br>
      Alas, Opentype fancies: I still doubt that the average end user’s vast majority will ever come to make serious use of it. But that’s another issue  ;-)</p>
