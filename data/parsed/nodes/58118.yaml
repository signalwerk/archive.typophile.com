      <p>Thank you Peter and Ross.</p>
      <p>As I see it, the question about a separate phonetics font then, is simply how to draw the glyphs that must reside in the Greek Unicode spots. If that is the extent if it, I'd reverse myself on an earlier objection to separate fonts for IPA and Greek, as long as the full Latin character complement is included in the IPA font.</p>
      <p>I've used both Stone &amp; Times in the PostScript Type 1 days. It was a mess, having the (2) separate IPA fonts for Stone and (4) separate Times fonts in the Linotron 202 days. But of course that was in part due to the the limitation of 8-bit fonts.</p>
      <p>For my own work, where I only have to coordinate with two other comps, I'll probably use a stylistic set to switch to the phonetic Greek characters. But these are end-user only fonts, and the work environment allows "voice" communication (as in "Hey, Charles, whatdidyoudohere?"). You can argue the separate/same font either way when both Greek and "phonetic Greek" are included.</p>
      <p>Again, Peter, thanks for the good discussion on what these glyphs should look like.</p>
