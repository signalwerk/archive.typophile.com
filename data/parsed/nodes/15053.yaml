      <p><cite>Are German designers careful to pronounce U.S. font names exactly the same way we do in the U.S? I kind of doubt it.</cite></p>
      <p>We pronounce it like our “standard English” we have learned. So we don’t try to simulate how someone in Texas or Georgia or New York would say it, but we would say it in English of course. We will certainly NOT apply German pronunciation rules to English names. (As some of you do it the other way around.)</p>
      <p>I certainly agree that common usage also dictates the right usage and that can mean that proper names can take on slightly different pronunciation or for very common foreign words even completely new pronunciations. (The names of famous cities are a typical example of that.)<br>
      But where does that “common usage” for font names come from? What if some say it this way and some say it another way? What is the right way then? What happens, when in each and every language the font name is pronounced as if it were a word of that local language? THIS would cause endless confusion when people from different countries talk to each other.  The best common denominator is then to stick close to the original pronunciation. Neue Helvetica will then certainly still sound different when Matthew Carter, J.F. Porchez or Erik Spiekermann say it, but at least it will be more understandable then when every nation has “invented” a unique pronunciation. </p>
      <p>So I see some benefit in trying to stick close to the original pronunciation. That collection of pronunciations in my blog is more about getting to know the original pronunciations. It’s up to you what you make of it.</p>
