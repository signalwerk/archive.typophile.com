    html: |-
      <p>Helvetica could be feminine in German for three reasons:</p>
      <p>1. The word for writing and/or a typeface (Schrift) is feminine: <strong>die Schrift</strong>. In German, Helvetica (or any other typeface name) is often used in context, i.e., <strong>die Helvetica Schrift</strong>…</p>
      <p>2. Helvetica is derived from the Latin name of Switzerland, <em>Confederatio Helvetia</em>. In Latin, I think I can remember that Helvetia is a first declention noun, and therefore feminine. So Helvetica would be feminine because the Latin Helvetia is feminine.</p>
      <p>3. Switzerland in German is also feminine, <strong>die Schweiz</strong>, maybe because of the Latin root? Not all nation-names are feminine in German, though. Germany and France are both neutral (<strong>Deutschland</strong> and <strong>Frankreich</strong>) because their suffixes (<strong>Land</strong> and <strong>Reich</strong>) are also neutral nouns (<strong>das Land</strong> and <strong>das Reich</strong>… country and empire, respectively).</p>
      <p>Lastly, at Linotype (where German in spoken), all typeface names are feminine. This must be because of reason number 1, I guess.</p>
      <p>I do not know what the gender of Font is, however.</p>
    html_clean: |-
