    html: '<p>In Russian there is no glottal fricative [h] sound (it is used in Ukrainian, though). So ‘Helvetica Neue’ is pronounced, alternatively, either as <a href="http://ru.wikipedia.org/wiki/Гельветика" rel="nofollow">Гельветика</a> Нойе (<em>Ghelvetika Noyeh</em>), or as <a href="http://www.paratype.ru/e-zine/new/helv/down.htm" rel="nofollow">Хельветика</a> Нойе (<em>Khelvetika Noyeh</em>). <em>Ghelvetika</em> should be more correct: the Latin name of Switzerland is spelled/pronounced <a href="http://dic.academic.ru/searchall.php?SWord=Гельвеция&amp;from=ru&amp;to=xx&amp;submitFormSearch=Найти&amp;stype=0" rel="nofollow">Гельвеция</a> (<em>Ghelvetsiya</em>) in Russian and <a href="http://slovopedia.org.ua/29/53395/8701.html" rel="nofollow">Гельвеція</a> (<em>Helvetsiya</em>) in Ukrainian.</p>'
