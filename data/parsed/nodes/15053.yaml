      <p>Thanks ralf h. for that link.  </p>
      <p>The Typophile pronunciation FAQ is helpful, too: <a href="http://typophile.com/node/28051" title="http://typophile.com/node/28051">http://typophile.com/node/28051</a> .</p>
      <p>Chris Rugen wrote "Unfortunately most U.S. designers call it Helvetica New (in a more French pronunciation)."</p>
      <p>I'm an American academic  (nothing to do with design), and in professional contexts I try to pronounce non-English words and names as correctly as I can.  But I also believe that natural languages are created by the people who use them, and that the ultimate standard is common usage.  So outside of academia, I often end up pronouncing non-English words ... "incorrectly".  (Growing up in Chicago, I referred to a couple of streets named after two famous Europeans artists as Go-thie and Mo-zart, even though I knew how to pronounce their names.  It bothers me to refer to my favorite Baroque composer without pronouncing the gutteral kh at the end of his spoken name, but in most conversations in the U.S. it sounds pretentious to say anything but Bahk.)</p>
      <p>So I still don't know how to say Helvectica Neue.<br>
      It might depend on how successful sites like typophile.com are.</p>
