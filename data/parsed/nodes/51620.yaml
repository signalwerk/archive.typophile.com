  html: |-
    <p>Does anyone know if its possible to find helvetica or something very similar that will work in arabic, hebrew, greek and such like. Basically languages that dont use english letters for the alphabet? Russian and greek too. Unfortunately my knowledge of opentype/cycrillic fonts is minimal (if indeed that is relevant) so any help/pointers would be greatly appreciated.</p>
    <p>Thanks</p>
