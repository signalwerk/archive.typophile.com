    html: |-
      <p>The Helvetica World fonts, to which Si links, should meet all your needs except perhaps Arabic. The fonts do contain Arabic support, but the design of the Arabic is not harmonised to Helvetica in the way that the other scripts are (it is a revised version of the Yakout simplified Arabic design). Also, in order to fit the Arabic into the vertical metrics of the existing Latin design, without compromising backwards compatibility or clipping the Arabic descenders, the Arabic has a raised baseline.</p>
      <p>If you need Arabic as well as the other scripts, I would recommend getting Helvetica World for everything else but using another font for the Arabic.</p>
