      <p>I would suggest using simple htaccess method. Here's a quick tutorial: <a href="http://www.besthostratings.com/articles/password-protection.html" title="http://www.besthostratings.com/articles/password-protection.html">http://www.besthostratings.com/articles/password-protection.html</a>.. </p>
      <p>Using .htaccess is very simple. You don't even have to create a login page, because the browser will popup a login dialog, in which you can fill out name and password.</p>
