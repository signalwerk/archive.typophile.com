      <p>There are dozens of way to handle this. The quickest is likely the htaccess method (if you are on an Apache server). Give each client a folder and password protect each folder. </p>
      <p>The ones where a client logs in on the home page would be applications written in PHP or ASP.net or RoR or the like.</p>
