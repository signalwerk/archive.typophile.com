    <p>My portfolio is undergoing some heavy changes, with a complete revamp estimated to be complete within the next month. One thing I've been asked by a client of mine is a page where they can actually log in and view progress on work being undertaken for them, which is easier said than done but I can definately imagine the benefits.</p>
    <p>After continual searching on Google and indeed our own forum, I've been unsuccessful in finding any relevant information about creating such a system.</p>
    <p>If any of you know of a decent resource with a tutorial or otherwise, and can indeed gauge the difficulty of setting up such a service with limited coding knowledge, I'd love to hear from you.</p>
    <p>Regards, </p>
    <p>Paul</p>
