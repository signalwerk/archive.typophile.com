    <p>Hello friends!<br>
    Cocijotype is proud to announce its first font release, Barrilito, a heavy funny typeface based in wood and linoleum engraving. It has a lot of ligatures to make typesetting for titles more interesting. Available at <a class="freelinking external" href="http://new.myfonts.com/fonts/cocijotype/barrilito/" rel="nofollow">MyFonts</a></p><div class="imageWrap"><img src="http://typophile.com/files/barrilito_6138.jpg"></div><p></p>
