    <p>Hallo Font Freaks!</p>
    <p>Ruudi van der Loon here, hallo from Amsterdam! </p>
    <p>Wanted to share with fellow font freaks the amazing results of an project I’ve been working on at my studio, Studio RvdL. This expands on the work of researcher Frederic Gosselin who presented his <a href="http://www.mapageweb.umontreal.ca/gosselif/FISET_PSYCHSCIENCE_2008.pdf " rel="nofollow">findings</a> at ATypI in Iceland…  </p>
    <p>This cropped illustration (data) from the linked paper shows the parts of individual letters that are most important to letter recognition (left most column).  </p>
    <p>Using this research data it was possible to create a perfectly legible ink saving font. So today I unveil for you “Missink”</p>
    <p>Thanks, RvdL!</p>
