      <p>Ruddi, a message to you Ruudi,<br>
      I’m a fan of the Gosselin work on which this is based, and I think this is a very promising first attempt on using that data. Your font is missing the low frequency information that is adding the location of the letters, but I think exclusively preserving the high spatial frequency is surprisingly successful. I’m looking forward to hearing about how well it reads. Since Missink is based on Arial, it would be interesting to compare it against Arial in a performance test, but since the peanut gallery will roast you for that, I recommend comparing it against a REfont.</p>
