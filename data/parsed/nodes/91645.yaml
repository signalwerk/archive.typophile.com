    html: |-
      <p>The initial image at the top, labelled "Data", shows in its first column a set of letters where the areas omitted from the typeface are more strongly blurred than the rest of the letter.</p>
      <p>If I knew where that first image came from, and how it was generated, I could more seriously critique the specifics of this typeface.</p>
      <p>Of course, the date of original posting <em>is</em> relevant, as the actual typeface <em>is</em> totally unreadable, thus wasting ink instead of saving it. (Although texts consisting solely of numbers would be readable, but then no savings in ink would be realized over unmodified Helvetica or Univers.)</p>
      <p>But even if it's an April Fool's joke, one <em>could</em> perhaps produce something useful out of it. An ink-saving typeface made of dots was recently proposed. If, indeed, the areas left in this typeface <em>are</em> those most crucial to legibility according to some legitimate source, then one could just put the rest of the letter back in, but screened to a light grey - and, presto, the typeface isn't a joke any more.</p>
