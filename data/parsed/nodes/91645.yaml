      <p>A couple of days ago, I was working on the ultimate ink-saving typeface.  I call it "Intuit".  Characters are <em>all counter</em>--there is no ink used at all.  All that's necessary is for the reader to use his or her psychic abilities to intuit the writer's meaning.</p>
      <p>(Oddly enough, my utter lack of experience at typeface design seemed to be no hindrance to this project.)</p>
