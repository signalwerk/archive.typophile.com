      <p>My point was that James Felici was not accurate when he said "When set in sizes considered normal for print on paper — 10- and 11-point — it can be a struggle just to decipher screen type."   </p>
      <p>That is clearly a generalization that is not true in many cases, especially on a retina-screen iPad where type is sharp and clear even in fairly small sizes.  </p>
      <p>Now if he'd been a bit more restrained in his comments and said that footnote-sized (like 6' or 7') type could be "hard to decipher" on a monitor, I'd agree. But 10' type is easily readable on my notebook and iPad.</p>
