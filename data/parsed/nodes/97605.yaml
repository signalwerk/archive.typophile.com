    <p>Hello all!</p>
    <p>I am currently doing my 2nd year Masters in Communication Design at ESAD, Matosinhos, Portugal. One of the ideas I had for my final project was to develop a typeface specifically for children e-books. I am still not 100% sure about this, because designing a typeface for good readability and legibility on screen has a lot of issues. As James Felici says in his CreativePro article, "The question of readability is not just an academic or aesthetic issue: Studies show that people read printed text 25 percent faster than on-screen text. What can we as typesetters do about this? Very little, as it turns out (...). The most immediate problem is that screen type is not sharply rendered. On a computer monitor, including the flat screens used by tablet computers, this is true in part because screen images are created using glowing pixels." </p>
    <p>Should I go for it, or is it a lost battle? Comments and advices are much appreciated.</p>
    <p>Thanks you,<br>
    RC</p>
  html_clean: |-
    <p>Hello all!</p>
    <p>I am currently doing my 2nd year Masters in Communication Design at ESAD, Matosinhos, Portugal. One of the ideas I had for my final project was to develop a typeface specifically for children e-books. I am still not 100% sure about this, because designing a typeface for good readability and legibility on screen has a lot of issues. As James Felici says in his CreativePro article, "The question of readability is not just an academic or aesthetic issue: Studies show that people read printed text 25 percent faster than on-screen text. What can we as typesetters do about this? Very little, as it turns out (...). The most immediate problem is that screen type is not sharply rendered. On a computer monitor, including the flat screens used by tablet computers, this is true in part because screen images are created using glowing pixels." </p>
    <p>Should I go for it, or is it a lost battle? Comments and advices are much appreciated.</p>
    <p>Thanks you,<br>
    RC</p>
