      <p>&gt; screen type is not sharply rendered </p>
      <p>That's a pretty broad statement. Certainly it's true in many instances, but books (especially cheaper ones and paperbacks) don't always have perfect printing either. </p>
      <p>The iPad is the most popular tablet, and the newer ones have a very high resolution. And since children's books typically use a larger point size, plus children typically have a short attention span anyway, I don't think this is a big issue when it comes to children's books.</p>
