      <p>Lost battle? We're just warming up.</p>
      <p>Shooting for high readability on a reflective screen is easier. The question is, are younger people using e-readers? I doubt it - I think they're using tablets; e-readers are generally used by adults, in fact older adults. Plus does a font designed for "youth readability" on a reflective screen need to be different than one on an emissive screen? I don't see how (except maybe in a very low-level sense, as in hinting for subpixels). Ergo: maybe shoot for "youth readability" on any medium, including print.</p>
      <p>BTW the* first thing you should do is look at existing efforts, such as Ann Besseman's.<br>
      <a href="http://luc.devroye.org/fonts-52718.html" title="http://luc.devroye.org/fonts-52718.html">http://luc.devroye.org/fonts-52718.html</a><br>
      BTW, she just got her PhD.<br>
      <a href="http://www.flickr.com/photos/68178950@N08/8127809451/" title="http://www.flickr.com/photos/68178950@N08/8127809451/">http://www.flickr.com/photos/68178950@N08/8127809451/</a></p>
      <p>* BTW, I just mistyped that "the" as a "t", and realized something: "the" should be replaced with "t"; as the most frequent word in English that would save quite a bit of room/effort.</p>
      <p>hhp</p>
