    html: <p> Thats awesome. I'd love to see what your doing with it. I was sure somewhere there was someone with similiar sensibilities.  <br> <br>Amazingly I found nothing while looking through books and magazines on tattoos for the last few years. But the tattoo scene is not exactly the most refined when it comes to the design of their books and magazines.  <br> <br>I am using a few different inspirations. One being Sailor Jerry's work. A sheet of Flash that a friend of mine uses in his shop and a slew of other tattooist writing styles. Ive found the lc difficult withthe same rules that Ive developed for the UC. I'll post those when I'm further along. </p>
