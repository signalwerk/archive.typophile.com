  html: <p> Has anyone come across any typefaces derived from tattoo flash?  <br> <br>This is the first sketch I've developed. I think I may make it a little more structurd yet. I am also playing withthe idea of doing condensed and extended versions as well as a symbols set. ie. classic tattoo designs. I have yet to find any face like this but would like to know if there is anything else like it. Let me know. Thanks. </p>
