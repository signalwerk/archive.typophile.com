      <p>Pattyfab, I’ve seen this stone in Cusco. The logo above was inspired by the shapes of Inca stonework rather than the fact that there’s no space between the stones (the lettering need to have some weight, I think).</p>
      <p>I don’t know, after my experience in Peru, if I think about words that could describe that style I think: rough, ancient, geometric, colourful, simple...</p>
