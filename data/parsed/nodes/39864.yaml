      <p>What I found remarkable about the Incas’ stonework was that they didn’t use any mortar, they fitted the stones so perfectly to each other that you can’t even stick a piece of paper between the stones. Perhaps you can work with that idea?</p>
      <p>Here’s the most famous example:</p>
      <p><a href="http://en.wikipedia.org/wiki/Incan_architecture" title="http://en.wikipedia.org/wiki/Incan_architecture">http://en.wikipedia.org/wiki/Incan_architecture</a></p>
