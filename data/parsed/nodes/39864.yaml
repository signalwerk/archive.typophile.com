      <p>Yeah, I have to work on it to be clearly recognisable as “Perú”.</p>
      <p>Swastika sneaked in accidentally, true, however, I don’t see a problem in the symbol present in different parts of the world for thousands of years. And I wouldn’t be surprised if Incas had their own swastika as well... Actually, after quick googling:</p>
      <p><cite>“The origin of the swastika symbol is unknown. For thousands of years, it has been used as a symbol of the revolving sun, fire, infinity, or continuing re-creation, as well as a decorative motif in the Americas, China, Egypt, Greece, and Scandinavia. Swastikas have been found in the catacombs of Rome, on textiles of the Inca period (...)”</cite><br>
      (<a class="freelinking-external" href="http://www.theosophy-nw.org/theosnw/ctg/swas.htm">source</a>)</p>
      <p><cite>“The presence of Swastika is evident in various civilisations such as the Egyptians, Mayans, Aztec, Inca, Native Americans, Romans, Greeks, Chinese, Japanese, ancient Troy and Celts to name but a few and that derived from the Vedic Dharma of Aryans of Bharat or India.”</cite><br>
      (<a class="freelinking-external" href="http://www.ivarta.com/columns/OL_050314.htm">source</a>)</p>
      <p>As for the photoshopping - as I mentioned before I wanted to get close to <a class="freelinking-external" href="http://en.wikipedia.org/wiki/Image:Inka_mauern_cuzco.jpg">stonework</a> effect but not sure if it works actually... The red colour is <a class="freelinking-external" href="http://en.wikipedia.org/wiki/Image:Escudo_nacional_del_Perú.svg">quite Peruvian</a> and <a class="freelinking-external" href="http://en.wikipedia.org/wiki/Image:Tupa-inca-tunic.png">Incas didn’t avoid it as well</a>.</p>
      <p>________<br>
