    <p>Hi,</p>
    <p>My name is Tony and I’m half of a northwest hip hop group, we’re called Citizen Ave. We’re in the middle of the business plan and developing the logo has been next to nerve wrecking. Below is what we have currently. We’re happy with the bold/heaviness of the image, however, we’re struggling with the font - </p>
    <p>We have been downloading endless fonts online. To compromise, we need to have uniformity and a freehand look. Nothing we’ve downloaded translates that. Can I jog the collective rolodex for a font that might work. :-)</p>
    <p>Also, what is your opinion of the placement of the name? Thank you for your insight!</p>
    <p></p><div class="imageWrap"><img src="/web/20080708213726im_/http://www.typophile.com/files/CITIZEN_AVE_FINAL[2"></div> copy_6010.jpg]<p></p>
