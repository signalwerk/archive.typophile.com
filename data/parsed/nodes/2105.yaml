  html: <p>Can anyone identify this specimen? I apologize for the poor contrast. <br><img src="http://www.typophile.com/forums/messages/83/20660.jpg" alt="45rpm logo"> <br> <br>I'm mainly looking for sans-serif letters that have have a slightly worn, broken-in quality (like wood or lead type that has seen better days). Also, they should be readable at smaller text sizes. The example that I've attached has slightly rounded corners. I'd appreciate any recommendations for similar typefaces as well.</p>
