  html: <p>Hi  <br> <br>Is anyone aware of  where I could find the font IBM news gothic? <br> <br>Apparently its a version of News Gothic used by IBM in the 60's and Im desperate to get hold of it. <br> <br>Any help would be great as I have already stumped all of my peers with this one. <br> <br>Best</p>
