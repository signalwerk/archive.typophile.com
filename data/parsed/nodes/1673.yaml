    html: <p>Richard - <br> <br>My guess is that you'd have to get the actual <br>News Gothic "golf ball" for the Selectric - for <br>which the face was designed. There are <br>examples of this face in the Karel Martens <br>"Printed Matter" book. If my memory <br>serves, the examples are naturally very <br>small. Although, you would think there are <br>some specimens somewhere.</p>
