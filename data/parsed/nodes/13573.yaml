    <p>I was told that the company I work for had commissioned the typeface Barmeno, for use as its identity system. Recently while perusing the Typophile forums I discovered that Barmeno was expanded into FF Sari. Barmeno contains NO italics and is exactly the same typeface as FF Sari. Why is this? Does anyone know any more details about this? Yves maybe? I ask because I use Barmeno daily and have to manually italicize Barmeno in Quark to set type properly.</p>
