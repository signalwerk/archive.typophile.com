    html: "<p>Nothing says '70s beach culture to me like Cooper Black: <br><a href=\"https://web.archive.org/web/20081121105606/http://www.myfonts.com/search?search%5Btext%5D=cooper%2Bblack\" target=\"_blank\">http://www.myfonts.com/search?search%5Btext%5D=cooper+black</a> <br> <br>House Industries has several likely candidates in their Street Van collection: <br><a href=\"https://web.archive.org/web/20081121105606/http://houseind.com/house.php?kit=SVANKIT-FO&amp;sub=view\" target=\"_blank\">http://houseind.com/house.php?kit=SVANKIT-FO&amp;sub=view</a> <br> <br>Check out Glyphic Neue from Typeco: <br><a href=\"https://web.archive.org/web/20081121105606/http://www.typeco.com/\" target=\"_blank\">http://www.typeco.com</a> <br> <br>Veer has some lovely, swashy options, like: <br><a href=\"https://web.archive.org/web/20081121105606/http://www.veer.com/products/typedetail.aspx?image=JBT0001000\" target=\"_blank\">http://www.veer.com/products/typedetail.aspx?image=JBT0001000</a> <br><a href=\"https://web.archive.org/web/20081121105606/http://www.veer.com/products/typedetail.aspx?image=JBT0001002\" target=\"_blank\">http://www.veer.com/products/typedetail.aspx?image=JBT0001002</a> <br> <br>Or you might take a common face from the era, and add \"flair,\" as Phil Martin used to back in the day. Scroll down a little to check out this great interview (with samples) by Mark Simonson: <br><a href=\"https://web.archive.org/web/20081121105606/http://typographi.com/2004_05.php\" target=\"_blank\">http://typographi.com/2004_05.php</a></p>"
