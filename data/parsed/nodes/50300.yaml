    <p>Hello,</p>
    <p>I can live with that when browsing, but worst thing is, people see it in advertising and even packaging design.</p>
    <p>In Lithuanian language we have letter „u“ with „ogonek“. And this ogonek is put on wrong place in Helvetica regular system font (Leopard OSX today). See attachment</p><div class="imageWrap"><img src="/files/u_ogonek_5133.jpg"></div><p></p>
    <p>Please anybody: if You know person in Apple or related, push him to correct this thing. </p>
    <p>We learned to put ogonek on the right at school:) And our grands do so:)</p>
    <p>Thanks,</p>
    <p>Žydrūnas.</p>
