      <p>Hrant: <em>Unless one implements a (much) better application of ligation.</em></p>
      <p>In explaining the implementation in the Brill types to the client, I coined the term 'ligaturing' to make it clear that what is involved is an action, not a thing. A ligature, in contrast, is a technical solution to joining behaviour involving the display of multiple characters as a single glyph. And that is what I consider dumb in the implementation of Arabic script, and increasingly for other scripts, including Latin: the only time ligatures make sense are when the representation of the multiple characters is not decomposable into linking contextual and positioned forms, e.g. in <em>some</em> of the Byzantine Greek combinations where the characters are represented by what amounts to a new form. In Arabic, ligatures are particularly dumb because a ligature system cannot capture the range of joining behaviours represented in the script without tens of thousands of ligature glyphs (the old Monotype nastaliq had c. 22,000  and still failed in some situations), whereas the natural efficiency of the writing system means that all those behaviours can be captured with just a couple of hundred well designed glyphs.</p>
      <p>Tom Milo's ACE engine definitely does it best. Recent OpenType fonts that have followed his lead -- avoiding ligatures, breaking the script down into achigraphemes, shaping joining behaviour on the fly, and contextually adjusting the position of dots and marks -- include some very nice design work, and some innovative solutions within the strictures of the OpenType Layout architecture, but they still don't come close to the flexibility provided by the combination of the ACE engine, ACE fonts and the Tasmeem UI. They are, despite the beauty of their designs, hampered by a technology that wasn't designed based on a thorough analysis of the Arabic script, and which involves serious bottlenecks.</p>
      <p>I'll be talking about <a href="http://www.istype.com/?p=704">one such project</a> at ISType in Istanbul this summer: and will discuss the design achievements, as well as both what OpenType has been able to do well and where it runs into problems.</p>
