      <p>Further on this topic:</p>
      <p>The paper by Yannis Haralambous on the Cairo or ’Almatab‘ al’amarya typecase does note the purposes that the ligatures serve, dividing them into a limited number of classes - about twenty - and so it can serve as a guide to a non-ligature implementation.</p>
      <p>What I really would have loved to have found somewhere would have been detailed explanations of the font designed by Mühendis-oğlu and the "American Arabic" of Smith and Hallock - so that a comparison would be possible.</p>
      <p>Because, of course, a proper analysis of the problem requires one not only to make contact with the Arab calligraphic tradition, but also to systematically survey the previous typographic efforts to determine what portions of that tradition are considered most significant.</p>
      <p>It might be that some calligraphic niceties actually inhibit readability instead of promoting it, and so effort might be being put into the equivalent of repeating Gutenberg's mistake of preferring blackletter to Roman.</p>
      <p>Also, while there has been discussion of "Simplified Arabic", where only two versions of each letter, rather than four, are used as being the ultimate debasement of the script, it has seemed to me that this merely displaces the join between two letters to always be on the first letter of a joined pair - which works on a typewriter, but not on metal type - and thus does not result in anything being lost.</p>
      <p>That is, it doesn't result in anything <em>additional</em> being lost as against typical ordinary fonts which incorporate the drastic simplification of having only four forms for each letter, and having an unchanging baseline - that is, those which follow the lead of the "Yakout" font for Linotype machines.</p>
