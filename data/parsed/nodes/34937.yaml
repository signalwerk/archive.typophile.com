      <p>Tom wrote: <em>The fact that OpenType has still difficulty handling it, has nothing to do with calligraphers setting the bar high.</em></p>
      <p>I agree. I think one can also be quite precise in just what aspect of nastaliq is most difficult for OpenType. The actual shaping of letter groups (what Tom calls fusions) is really quite easy, especially if one avoids using ligatures and instead uses a set of contextual letter shapes with GPOS cursive attachment positioning. This is not difficult, either from a design perspective nor from a layout programming perspective. The thing that is <em>very</em> difficult in OpenType -- is, in fact, the greatest weakness of the OpenType Layout model -- is the interaction of spacing and mark positioning. Shaping the letter groups is easy: positioning the letter groups relative to each other and then placing the dots and other marks relative to the letter groups is where the whole thing becomes very difficult indeed. The problem isn't particular to OpenType, but to any font layout technology that has inherited concepts of sidebearings and kerning from metal type. Simply put, this paradigm doesn't work for nastaliq (it doesn't work well for any Arabic style, but is particularly bad for the strongly diagonal styles).</p>
