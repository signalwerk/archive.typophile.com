      <p>Hi Si,</p>
      <p>In 1997 OpenType technology was still in its infancy, and certainly not capable of handling nastaliq. </p>
      <p>The fact that OpenType has still difficulty handling it, has nothing to do with calligraphers setting the bar high. Its rather that OpenType was developed on the basis of artists' impressions rather on the basis of than analysis of Arabic scripts. In other threads I have already (well, much later than your post above, I realize) pointed out that there is no intrinsic difficulty in nastaliq as such. To the contrary, it seems to be simplified Arabic when compared with Naskh - in its pre-typographic form, I mean, not minimalist typographic developments of naskh.</p>
      <p>Thomas Milo<br>
      DecoType<br><a href="http://www.decotype.com">www.decotype.com</a></p>
