      <p>I downloaded Nastal'iq Navees, the open-source Nastaliq font, and I've been able to look at the glyphs in Fontforge. While I don't think my knowledge in this area is equal to porting that font so that it can be used outside of the old Macintosh GX system, I have been also hunting up information on the attempts to capture Nastaliq in metal type.</p>
      <p>Given that Pakistan is a developing country, even a very imperfect attempt at a Nastaliq font that's free is likely to find many grateful users, and it will also help to reduce piracy of the quality products from WinSoft and Deco Type.</p>
      <p>Oh, wait: there <em>does</em> appear to be one in existance other than Nastal'iq Navees, at <a href="http://alefba.us/typography/free-arabic-persian-farsi-urdu-kurdish-fonts/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">this link</a> which appears legitimate and not a link to anything pirated.</p>
      <p>But that font was made in Iran, which may be a problem for some. <a href="http://tabish.freeshell.org/u-font/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Here</a> is another font, for "basic" Nastal'iq (actually Naksh-i-tal'iq, I've learned in today's web searches...), whatever that may be.</p>
      <p>While I have not found information or samples of Fort William College's Nastal'iq font... and I have not even tried to search for details on the "miserable failure" of the attempt to create a Nastal'iq typewriter... still, however inadequate a Simplified Nastal'iq on the model of what Simplified Arabic did to Naksh would be, still, it may be at least a useful <em>starting point</em> on which some would find it possible to build.</p>
      <p>Of course, today, a number of excellent commercial fonts fully implementing Nastal'iq exist, so (finally!) it isn't fair to say that Urdu is not being served by the computer revolution.</p>
      <p>Oh - and the Government of Pakistan has even seen the need, and created a font, called Pak Nastaleeq, to serve this need. It, like the other free Nastal'iq fonts listed above, is a TrueType font, not even OpenType... but also <em>it's still in beta</em>.</p>
      <p>But, hey, it works good in Windows, even if it apparently has problems in Ubuntu...</p>
