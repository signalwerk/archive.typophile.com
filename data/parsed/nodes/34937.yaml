      <p>Reviving this old thread :)</p>
      <p>Last year I learnt that the famous Bulaq press in Cairo had finished their first Nastaliq typeface in 1831 (their first Naskh was finished in 1822), and by the time of Vienna International Exhibition of 1873 they had at least 3 Nastaliq typefaces. The samples I've are small and not clear enough, but the Nastaliq looks very well executed and "authentic".</p>
      <p>Previously I thought the first Nastaliq was developed much later than this, and I was fascinated by this "discovery".</p>
