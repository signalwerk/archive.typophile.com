      <p>of the Arabic type due to Smith and Hallock in <a href="http://a book" title="Click to visit an external URL." class="freelink freelink-external freelink-external link-external">http://a book</a> on Google Books: on page 134 of a book titled "The Fourth Exhibition of the Massachusetts Charitable Mechanic Association, at Quincy Hall, in the City of Boston, September 16, 1844".</p>
      <p>This illustration of the type shows how successive letters that move the baseline up or down are still individual types. So words need to be built up with short pieces of leading. In the metal type era, this was a serious issue.</p>
      <p>Hence, for naksh, if not nastal`iq, ligatures did become the preferred method of implementing the calligraphic niceties:</p>
