      <p>In this connection, the "American Arabic" of Smith and Hallock did implement Naksh by casting individual characters as "linking contextual and positioned forms".</p>
      <p>For metal type, this has its own problems, making Arabic typesetting an exercise in creative leading, like typesetting mathematical formulas. Which is why the Cairo typecase, with a mere 470 characters, ended up being a more successful approach to quality Naksh typesetting.</p>
      <p>In any case, though, the Arabic New Testament typeset in the Smith and Hallock types - it's the translation by van Dyck - is on the Internet Archive. The combined one with the entire New Testament is defective and won't open, but volumes 1, 2 and 3 as separate volumes are apparently good:</p>
      <p><a href="http://archive.org/details/ArabicNewTestament1867VanDyckOriginalVol1" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://archive.org/details/ArabicNewTestament1867VanDyckOriginalVol1</a></p>
      <p><a href="http://archive.org/details/ArabicNewTestament1867VanDyckOriginal_vol2" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://archive.org/details/ArabicNewTestament1867VanDyckOriginal_vol2</a></p>
      <p><a href="http://archive.org/details/ArabicNewTestament1867VanDyckOriginalVol3" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://archive.org/details/ArabicNewTestament1867VanDyckOriginalVol3</a></p>
      <p>I've only downloaded volume 1, though, so I can't be sure about the other two.</p>
