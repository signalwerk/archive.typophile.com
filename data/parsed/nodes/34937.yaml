      <p>@John Hudson:<br><cite>Ligatures are a dumb way to implement Arabic, and especially nastaliq.</cite></p>
      <p>I hadn't been thinking of ligatures as a <em>method of implementation</em> of the unique features of the Nastaliq script.</p>
      <p>But I can see where the idea could have occurred to you that this was what I was talking about.</p>
      <p>Recently, I found this image</p>
      <p><img src="/sites/default/files/old-images/type_smha_4106.jpg"></p>
      <p>of the Arabic type due to Smith and Hallock in <a href="http://a book" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://a book</a> on Google Books: on page 134 of a book titled "The Fourth Exhibition of the Massachusetts Charitable Mechanic Association, at Quincy Hall, in the City of Boston, September 16, 1844".</p>
      <p>This illustration of the type shows how successive letters that move the baseline up or down are still individual types. So words need to be built up with short pieces of leading. In the metal type era, this was a serious issue.</p>
      <p>Hence, for naksh, if not nastal`iq, ligatures did become the preferred method of implementing the calligraphic niceties:</p>
      <p>as I learned from <em>The Traditional Arabic Typecase Extended to the Unicode Set of Glyphs</em> by Yannis Haralambous.</p>
      <p>And, yes, he may have chosen the "dumb" way to upgrade typesetting for Urdu and Farsi to what was available for Arabic, since fiddling around with leading is no longer an issue in the computer age. But I'm more inclined to praise his efforts as a <em>start</em>, to establish what the minimal things that need to be done are, as part of the progress towards doing them right.</p>
      <p>Of course, by now, what with the efforts of people like Thomas Milo, the Arabic script is, or is close to being, a solved problem, I suspect: excuses to accept substandard typography on technical grounds are no longer valid, even if there is still room for progress.</p>
