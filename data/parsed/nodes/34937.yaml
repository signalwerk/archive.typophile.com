      <p>cut/pasted from <a href="http://jamespuckett.blogspot.com">my blog</a>:</p>
      <p>Part of me wants to praise their skill and dedication, while another part of me keeps paraphrasing Jan Tschichold, who said something along the lines of “What the world needs is not more handmade books, but more well-designed mass-produced books.”</p>
      <p>But I think that there could be a bigger future for this sort of operation than most people realize. As printing costs continue to cascade downward and niche marketing becomes more popular, expensive short press run magazines are popping up like weeds in the cities of the US and Europe. Who’s to say that gorgeously hand-composed magazines could not take off in the parts of the world where stunning calligraphy is still revered? Imagine a fashion magazine hand-composed, printed on exotic papers and sold in Jeddah and Dubai. Or a fanfic/dojinshi magazine decorated with kanji and sold in Tokyo, Kyoto, and Osaka. I would love to see an American design magazine hire Marian Bantjes to treat an entire issue.</p>
