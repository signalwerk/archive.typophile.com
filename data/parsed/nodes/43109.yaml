    <div class="info">Submitted by <a href="/user/7151" title="View user profile.">Maxim Zhukov</a> : 12.Mar.2008 5.08pm </div>
      <p></p><div class="imageWrap"><img src="/files/AA 50 xSmall_4276.png"></div><p></p>
    <p>It is with great pleasure that the Programme Committee of <em>ATypI’o8</em> invites you to contribute your proposal of a talk/presentation/panel discussion for inclusion in the programme of this year’s conference. We are confident that the forthcoming conference will provide an excellent opportunity for typographic professionals, experts and enthusiasts to exchange ideas, establish collaborations, and present the results of their research and creative work, to share their views and ideas of the shorter- and longer-term developments in the industry, to take a long, hard look at its past and present, and to peer into the crystal ball trying to see its future.</p>
    <p><strong>Time and place</strong></p>
    <p><em>ATypI’o8</em> is to take place from 17 to 21 September in St. Petersburg, Russia. <em>TypeTech</em> technical workshops will be held on 17 and 18 September. The main conference will open with an event on the evening of 18 September, with sessions running from 19 through 21 September.</p>
    <p><strong>Theme</strong></p>
    <p>The theme of the conference is <em>The Old · The New</em>. This topic is perennially relevant to the creative work of the communication designer, and especially important in our times of rapid advancement of communication technologies. Addressing the many issues and challenges of <em>The New</em>, as well as its complex relationship with <em>The Old</em>—at different levels: psychological, intellectual, methodological, practical, &amp;c.—may provide for a better understanding of the direction in which we as a community are moving, and for the creation of a professional agenda adequate to the challenges of the day.</p>
    <p>For more information on the conference visit the <em>ATypI’o8</em> <a href="http://atypi.org/05_Petersburg" target="_blank">home page</a>.</p>
    <p><strong>Audience</strong></p>
    <p>Most conference attendees are involved in the craft, business, or technology of type design and typography. They include managers, software engineers, program managers, type and graphic designers, Web and information designers, educators, lettering artists, enthusiasts and connoisseurs of typography, and anyone involved in creating or using type.</p>
    <p>Our audience is very interested in the design and manufacture of type, the practice of typography, all forms of calligraphy and lettering, the technology of printing and reading, graphic design in its many forms, and everything to do with typographic communications.</p>
    <p><strong>Sessions</strong> </p>
    <p><em>ATypI’o8</em> may run more than one concurrent session, to maximise the value provided. Meeting formats may vary, to provide for a mix of lecture, demonstration, and discussion, and to support different learning styles. They may include keynote presentations, workshops/tutorials, technical demonstrations, panel discussions, and round tables. </p>
    <dt><em>TypeTech Forum</em></dt>
    <dd>Wednesday, 17–Thursday, 18 September 2008</dd>
    <p>The ATypI’o8 <em>TypeTech Forum</em> committee invites submissions of abstracts for presentations on any theme related to technology in type design and typesetting. As in 2007, there will be no separate introductory section this year; potential presenters should assume that their audience is versed in the basics of type technology, such as Unicode and OpenType.</p>
    <p>Proposals are welcome for practical demonstrations as well as lectures and panel sessions. Preference will be given to talks which have not been done before at <em>TypeTech Forum</em> or ATypI.</p>
    <p>Appropriate topics could include, but should not be limited to:</p>
    <ul>
    <li> New methods in typeface design and production; </li>
    <li> Approaches to testing fonts; </li>
    <li> Issues and solutions for font development; </li>
    <li> New technologies in typesetting. </li>
    </ul>
    <dt> <em>Main Conference</em></dt>
    <dd>Friday, 19–Sunday, 21 September 2008</dd>
    <p>All topics of theory, practice and history of typographic communications are welcome. Special emphasis should be given to those topics that help develop the conference theme of <em>The Old · The New</em>.
    </p><p>Topics could include, but should not be limited to:</p>
    <ul>
    <li> Typography and type design: tradition and innovation; </li>
    <li> Typeface revivals: <em>déjà vu</em>? </li>
    <li> How does the development of communication technologies affect the relationship of typography and writing? </li>
    <li> From voice messaging to text messaging: typographic newspeak; </li>
    <li> Reforming writing / reforming typography: innovation by decree? </li>
    <li> Polyglot typography: from the Rosetta Stone to the World Wide Web; </li>
    <li> Methods of multi-script type design; </li>
    <li> International style and national authenticity. </li>
    </ul>
    <p><strong>Publication</strong></p>
    <p>If your paper is accepted, we will include your proposal in the conference programme. We will publish your biography and paper details on the <em>ATypI’o8</em> Web site and include the same information in the printed programme that will be distributed to all attendees upon their check-in. We strongly encourage you to send us your slides or other visual material in advance so that we can also include them, with all required copyright notices, on the conference CD/memory stick, which will be given out to participants at the start of the event. </p>
    <p><strong>Conference language</strong> </p>
    <p>The ATypI official language is International English. All submissions, papers and presentations should be provided in English. Interpretation from/to Russian may be provided for selected talks.</p>
    <p><strong>Submission</strong> </p>
    <p>A submission must contain a title and an abstract of the proposed presentation (100 words maximum), and a speaker’s biography (100 words maximum). </p>
    <p>To submit a proposal, <a href="http://www.atypi.org/05_Petersburg/60_call_for_papers/ATypI2008_Call2_Form.pdf">download and fill out the form</a>. To move from field to field you can use either the Tab key, or your mouse. To check and uncheck boxes use your Enter/Return key.</p>
    <p>Submissions should be sent by e-mail to <a href="mailto:secretariat@atypi.org">Barbara Jarzyna</a>, the Executive Secretary of ATypI. E-mail messages should have the subject line: <em>Proposal for ATypI 2008</em>.</p>
    <p><strong>Target dates</strong> </p>
    <dd>Submissions due: March 27, 2008</dd>
    <dd>Notification date: April 21, 2008</dd>
    <dd>Papers due: July 7, 2008</dd>
