  html: |-
    <p>I exported my font in FontLab Studio as OpenType PS format and I tested the font with different software to see if it is okay.</p>
    <p>I found that using Adobe Acrobat virtual printer to "print" the MS Word/WordPad document using my font, it will cause a postscript error:<br>
    <code><br>
    %%[ ProductName: Distiller ]%%<br>
    CNLicense-A not found, using Courier.<br>
    %%[ Error: typecheck; OffendingCommand: show ]%%<br>
    Stack:<br>
    (%%[ Flushing: rest of job (to end-of-file) will be ignored ]%%<br>
    %%[ Warning: PostScript error. No PDF file produced. ] %%<br>
    </code><br>
    However, when I use the built-in PDF export feature in Illustrator and OpenOffice.org Writer in Ubuntu, no error is found and the font can be embedded successfully. </p>
    <p>In FontLab, I have already selected "Everything is allowed (installable mode)" in Font Info window. I found that my other fonts exported also encounter this issue but not the fonts created by the others. Is there any other settings can cause this problem? I have no clue what can cause this problem.</p>
