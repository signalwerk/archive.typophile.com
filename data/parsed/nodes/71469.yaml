      <p>I put the font file in C:\WINDOWS\Fonts and got the following error message:<br>
      <code><br>
      %%[ ProductName: Distiller ]%%<br>
      %%[ Error: typecheck; OffendingCommand: xshow ]%%<br>
      Stack:<br>
      [89 89 0]<br>
      (%%[ Flushing: rest of job (to end-of-file) will be ignored ]%%<br>
      %%[ Warning: PostScript error. No PDF file produced. ] %%<br>
      </code></p>
