  - id: 416547
    user: 15033
    date: 2010-06-18T21:28:00
    date_raw: 18 Jun 2010 — 9:28pm
    votes: null
    html: |-
      <p>The typecheck error means that the interpreter was expecting one kind of data but got something else. The xshow command has to do with symbol widths and positioning. Taken together, they suggest that either your font has an internal problem, or you have a bad print driver. Since this only happens with Word and Wordpad, I tend to suspect PDFMaker (I assume this is what you mean by virtual printer). Unfortunately, even if you find out that PDFMaker is the problem, you'll still need to figure out why it doesn't like your font.</p>
      <p>Two things before dealing with PDFMaker: First, how did you put the font file into C:\Windows\Fonts? While you can drag or copy files into the folder, the best way is to open Fonts from the Control Panel and then go to File &gt; Install New Font. </p>
      <p>Second, if your font is very large, with many symbols, try subsetting instead of embedding everything.</p>
      <p>Those things out of the way, bypass PDFMaker by printing your Word document to a .ps file and then distilling the .ps file (doubleclicking on the .ps file should launch Distiller).</p>
