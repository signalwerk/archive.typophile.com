    html: |-
      <p>Some comic book stores also have old magazines.<br>
      Most “collector” flea markets have stalls with magazine traders and dealers.<br>
      In Toronto, there is a twice-yearly “Old Paper Show and Sale”, as well as an “Old Book” show, where some of the dealers have magazines, so I would imagine there is something similar in your neck of the woods.<br>
      Dealers who specialize in antique/vintage photos, postcards, movie posters, money, maps etc. often take out booths/stalls in such shows, so ask them when and where they show.<br>
      AFAIK, trading on eBay has lessened the necessity for dealers to have stores, but they still find shows are useful.<br>
      Google “paper ephemera flea market”. Good luck!</p>
