      <p>If you want to do this properly, acquire some magazines from that era at old paper stores/markets, and a copy of “American Metal Typefaces of the Twentieth Century” by Matt McGrew (Oak Knoll), which will enable you to identify the faces. You’ll find that the 20s and 30s were radically different — going from illustration and historicism to photography and modernism. Knockout and Belizio are 19th century styles.</p>
      <p>Broadway (Inline) is one of the most Art Deco faces, so is Radiant, which has a useful condensed. Bernhard Gothic and Kabel are more deco than Futura. Deco slabs (Stymie, Rockwell) are very different from the Egyptians — round curves and not much stroke contrast. See Keith Tam’s essay on this at Type Culture.com. Bodonis — especially the dark weights — were exemplary Deco faces.</p>
    html_clean: |-
