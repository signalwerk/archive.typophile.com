    html: |-
      <p>I'm not familiar with the left-leaning italics, but I read this on this wiki for italics:</p>
      <p><em>Left-leaning italics<br>
      In certain Arabic fonts (eg: Adobe Arabic, Boutros Ads), the italic font has the top of the letter leaning to the left, instead of leaning to the right. Some font families, such as Venus, Roemisch, Topografische Zahlentafel, include left leaning fonts and letters designed for German cartographic map production, even though they do not support Arabic characters.</em></p>
      <p><a href="http://en.wikipedia.org/wiki/Italic_type">http://en.wikipedia.org/wiki/Italic_type</a></p>
