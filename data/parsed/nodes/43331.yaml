    <p>hi </p>
    <p>im working on a project that will require me to use a reverse italic.</p>
    <p>im currently using minion pro. i am very happy with the font but alas it doesnt have a reverse italic. any ideas of similar complete fonts with the required left moving italic?</p>
    <p>thanks</p>
