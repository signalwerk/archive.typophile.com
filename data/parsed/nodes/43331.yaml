      <p>Hi Michel,</p>
      <p>have a look at <a href="http://www.typophile.com/node/30747">this older thread for more suggestions/links</a>. As Dan, Andreas and Andrew have explained, reverse italics (‘Linkskursiv’ = ‘left cursive’ or ‘Rückwärts Liegend’ = ‘lying backwards’) are often used in cartography, traditionally to indicate waters.</p>
      <p>F</p>
