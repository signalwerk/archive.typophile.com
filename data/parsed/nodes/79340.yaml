    <p>Monotype Imaging Introduces the <a class="freelinking external" href="http://www.fonts.com/FindFonts/RecentReleases/2011/Camphor.htm " rel="nofollow">Camphor Typeface Family</a> into the Monotype Collection</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Camphor Small_6737.JPG"></div><p></p>
    <p>Classic British Typefaces from the 20th Century Provided Inspiration for Nick Job, Designer of Camphor </p>
    <p>Monotype Imaging Holdings Inc. (Nasdaq:TYPE), a leading global provider of text imaging solutions, has added the 12-font Camphor™ typeface family to the company's Monotype® collection. The new additions are now available from Monotype Imaging's Fonts.com, Linotype.com and ITCFonts.com stores. In addition, Camphor Web fonts are available from Fonts.com Web Fonts for website design. </p>
    <p>"Camphor is a sturdy, hard-working yet elegant design," said Allan Haley, director of words and letters at Monotype Imaging. "It's space economical and suitable for a wide range of applications, from branding and advertising to signage and content. Camphor is a perfect addition to our Monotype collection, home to ageless classics such as the Gill Sans® face, a design Nick Job researched when he created Camphor." </p>
    <p>"I wanted to draw a modern, uncluttered sans serif family with classical proportions that was unashamedly English but with fewer idiosyncrasies than its influential forerunners," said Job. </p>
    <p>In addition to Gill Sans, which was designed for Monotype by Eric Gill in the late 1920s, another typeface, created years earlier by Edward Johnston for the corporate identity of the London Underground, provided inspiration for the creation of Camphor. At the time Gill drew Gill Sans, he was also motivated by Johnston's design, which Gill had worked on while he apprenticed with Johnston in the early 1900s. Camphor, however, is "considerably narrower than Johnston's typeface and has less attitude than Gill Sans," according to Job. During the research phase for Camphor, Job also studied European sans serif typefaces, particularly those designed by Adrian Frutiger. </p>
    <p>The complete Camphor family features 12 typefaces. Each of the six weights, which range from thin to heavy, have a companion italic. The family is available as a suite of OpenType® Pro fonts, which allow for the automatic insertion of small caps, ligatures and alternate characters. Pro fonts also offer an extended character set that supports most Central European and many Eastern European languages. </p>
    <p>Availability </p>
    <p>Camphor fonts can be viewed, purchased and downloaded from <a href="http://www.fonts.com" title="www.fonts.com">www.fonts.com</a>, <a href="http://www.linotype.com" title="www.linotype.com">www.linotype.com</a> and <a href="http://www.itcfonts.com" title="www.itcfonts.com">www.itcfonts.com</a>. Camphor is also available for website design to commercial subscribers of Fonts.com Web Fonts. Further information is also available from Monotype Imaging's Camphor microsite. </p>
    <p>Customers may contact Monotype Imaging in the U.S. toll-free at 800-424-8973, or in Europe at (+44 0)1737 765959, or 001781 970-6020, option 2. Linotype may be reached at +49 (0) 6172 484-418. Customers from other parts of the world may dial 001 781 970-6020 (U.S.). </p>
    <p>About the Monotype typeface library </p>
    <p>Established more than a century ago and influenced by British design, Monotype is a Monotype Imaging brand that represents classic, high-quality typefaces for brand managers, publishers and content creators. Many of the world's most widely used typefaces are part of the Monotype library, including the Arial®, Times New Roman® and Bembo® families. Today, typefaces are continuously released into the Monotype collection from some of the world's most talented type designers. In addition, the Monotype Studio design team has created typefaces for global brands such as Barclays, British Airways and Dyson. </p>
    <p>About Monotype Imaging </p>
    <p>Monotype Imaging combines technology with design to help the world communicate. Based in Woburn, Mass. with offices in the U.S., Europe and Asia, Monotype Imaging brings text imaging and graphical user interface capabilities to consumer electronics devices such as laser printers, copiers, mobile phones, navigation devices, digital cameras, e-book readers, digital televisions, set-top boxes and consumer appliances. The company also provides printer drivers and color imaging solutions to printer manufacturers and OEMs (original equipment manufacturers). Monotype Imaging technologies are combined with access to more than 14,000 typefaces from the Monotype, Linotype® and ITC® typeface libraries — home to some of the world's most widely used designs, including the Times New Roman, Helvetica® and ITC Franklin Gothic™ typefaces. Fonts are licensed to creative, business and Web professionals through e-commerce portals, direct and indirect sales and custom design services. Monotype Imaging offers industry-standard font solutions that support all of the world's major languages. Information about Monotype Imaging can be found at <a href="http://www.monotypeimaging.com" title="www.monotypeimaging.com">www.monotypeimaging.com</a>. </p>
    <p>Monotype is a trademark of Monotype Imaging Inc. registered in the U.S. Patent and Trademark Office and may be registered in certain jurisdictions. Camphor is a trademark of Monotype Imaging Inc. and may be registered in certain jurisdictions. Gill Sans, Arial, Times New Roman and Bembo are trademarks of The Monotype Corp. registered in the U.S. Patent and Trademark Office and may be registered in certain other jurisdictions. ITC is a trademark of International Typeface Corp. registered in the U.S. Patent and Trademark Office and may be registered in certain jurisdictions. ITC Franklin Gothic is a trademark of International Typeface Corp. and may be registered in certain jurisdictions. Linotype is a trademark of Linotype GmbH registered in the U.S. Patent and Trademark Office and may be registered in certain jurisdictions. Helvetica is a trademark of Linotype Corp. registered in the U.S. Patent and Trademark Office and may be registered in certain jurisdictions in the name of Linotype Corp. or its licensee Linotype GmbH. OpenType is either a registered trademark or trademark of Microsoft Corp. in the U.S. and/or other countries. All other trademarks are the property of their respective owners. © 2011 Monotype Imaging Holdings Inc. All rights reserved.</p>
