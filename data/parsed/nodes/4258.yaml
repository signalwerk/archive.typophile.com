    html: "<p>Bill, this is a good jumping off point: <br><a href=\"http://docs.info.apple.com/article.html?artnum=75494\" target=\"_blank\">http://docs.info.apple.com/article.html?artnum=75494</a> <br> <br>I use Windows at work for two typefaces and a few others, so I don't even bother to manage my fonts on the machine and am pretty ignorant about it but I do know that Microsoft has a lot of inormation about type and I did a simple search from their main page for Managing Fonts and about halfway down on the results page are articles about font management. <br> <br>I am always baffled or mistrustful of third party FM utilities, so some explanations and comparisons from those experienced would be helpful. <br> <br>Jon</p>"
