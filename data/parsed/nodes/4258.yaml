    html: <p>In my experience, Font Book works wonderfully for previewing and organizing fonts, but I've had limited success with the "on/off" feature set whereby I can disable fonts not currently needed and they won't show up in programs. My Adobe CS apps handle OpenType and MM faces just fine, but the standard productivity applications (notably Office) seem to recognize each variant as an individual font name</p>
