    html: <p>Bill, that would be a great idea. I'm very curious about this even though I do have something that is working. For instance, when I was using Font Reserve I actually had a list of fonts that the system needed and so I could "get rid of" the rest of them. I'm happy with allowing Suitcase to manage my system fonts but I wonder if less system fonts would somehow equal more.</p>
