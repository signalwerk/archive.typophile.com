    html: |-
      <p>I don't find the original question ambiguous. Without further clarification, it can be taken to mean: what resources are available for supporting the languages of indigenous people on the Web.</p>
      <p>In the case of North American Indians/People of the First Nations, there are the Inuktitut, Cree, and Cherokee syllabaries, and some additional Latin letters found in many wide-ranging Unicode fonts.</p>
      <p>Again, some African languages use additional African letters; there's also the Vai syllabary.</p>
      <p>One can go further afield, and, for example, note the existence of fonts for the Yi syllabary (a language related to Burmese, used in China).</p>
