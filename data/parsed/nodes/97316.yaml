      <p><cite>Sorry, in my original post I was quoting language I had heard elsewhere. To get us back on topic, I'm referring to non-Latin webfonts to support indigenous peoples of the world.</cite></p>
      <p>Still don't know what you mean. As far as it goes, most of the "indigenous" people of the Americas (North &amp; South) don't have a written form for their languages. When forced to come up with one, they tend to use the Latin alphabet.</p>
      <p>I did a tri-lingual, three-voulme series (English, Spanish, and "Indigenous") a few years back. </p>
      <p><a href="http://www.utexas.edu/utpress/books/monwo2.html" title="http://www.utexas.edu/utpress/books/monwo2.html">http://www.utexas.edu/utpress/books/monwo2.html</a></p>
      <p>The problems were not matters of typeface, they were organizational. (As the designer/typesetter, it became apparent that it was too late to work around certain editorial decisions that got in the way of clear presentation.)</p>
      <p>But if you really mean only the characters/glyphs, all that's lacking is somebody willing to do the work. And perhaps getting Unicode to recognize the language. Print or pixel, not much difference.</p>
    html_clean: |-
