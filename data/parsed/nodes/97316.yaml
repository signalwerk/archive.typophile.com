    html: |-
      <p>I assume he meant "native" as in "a font native to another language", meaning a font designed first and foremost for users of one particular language, whatever other languages it might support.  (Given that the vast majority of fonts discussed here are "native" to Latin-1 languages, I suppose that implies his primary interest is in fonts which aren't.)</p>
      <p>A font that's "native" to Farsi isn't the same as a font that's "native" to Arabic (the language), even though they're both classifiable as Arabic (the writing system) fonts.  Alternatively, a font that's designed by a Russian speaker primarily for use in writing Cyrillic (but happens to contain Latin support as well) may be considered a "native" Russian font, whereas a Latin font designed by an English speaker that happens to contain Cyrillic support may not be.</p>
      <p>Um, that make sense?</p>
