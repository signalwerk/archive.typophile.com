    html: <p>You've got some nice illustrations there, Nathan. <br>Im digging the flowers most. <br> <br>I am finding the position of Bellus really uncomfortable notched under the floral design.  <br>With such a complex mark, the placement of Bellus seems an afterthought.  <br> <br>I see a pound sign and a couple of d's in the intersecting stems. Do you have a variation  <br>with a B in it? My eyes do most of their travel in the winding lines. <br> <br>In the sihlouetted design, I dislike the long flowered strand. You have some odd angles in there. Also, I dont think you need it. You could attach the flower instead to a lengthened version of the curve under her chin.  <br> <br>Bellus is very small also. Bring it up a bit. <br> <br>Andrew</p>
