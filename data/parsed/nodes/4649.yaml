    html: <p>I prefer the floral design also. I think the "d"s and the "#" that Andrew sees is a result of the intersecting curves being too alike. Art Nouveau is very free flowing, which you are beginning to capture, but I think you can push it a little more. The type is clean and is trying to portray sophistication (fine dining), but I don't think it's working well with the illustration. Bring the letterspacing in tighter and enlarge the letters. Have you looked at some other typefaces? <br> <br>Aloha! <br>Scott</p>
