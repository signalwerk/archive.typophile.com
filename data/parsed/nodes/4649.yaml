    html: <p>I like the concept of the silhouette design, but think the implementation of the floral motif is much better. Even with the pound sign interference pattern. <br> <br>If you created a version of the floral patterns that formed a B, it would work nicely for me. <br> <br>As for the type, I think a general guide for size is to match the lineweight of the character with the stroke weight you used in the stem of the flower. Maybe a more indulgent, Baroque face would work better,</p>
