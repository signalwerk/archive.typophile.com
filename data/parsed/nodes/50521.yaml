      <p>Thanks for these ideas.</p>
      <p>I think something originating in the 15th-century would be best. Or the ones that were in standard use at that time because of course references to the Antique times were often made at then to improve status and the Antique objects (e.g., columns and capitals were routinely pilfered for new buildings). I am especially interested in the cases where precursors of a font are known and/or have been discussed. E.g. like in the case of Bembo (which I suspect would not be so good for the multimedia side of things).</p>
      <p>Cadmus and Sophia refer a little too much to the Classic Greek lettering with Sophia openly acknowledging its 6th-century Greek origins (which is indeed too far from target). Basalt is quite nice even though it is a “fantasy” font according to Stone himself. Maybe I can consider it given my on-screen needs, he certainly thought it would be ubiquitous if the Antique Rome used computers. This also gives me an idea that maybe I could use chiseled lettering for the major headings, calligraphic lettering for media inscriptions and a printed type for the texts… Or it might end up being too much.</p>
      <p>Vendome is pretty nice, I have not seen it before...</p>
      <p>Paradigm is also nice and is the right period especially given that Sweynheym and Pannartz are said to be the first printers in Rome.</p>
      <p>Lots to think about…</p>
