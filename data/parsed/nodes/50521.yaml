      <p><cite>Using period fonts in a contemporary text to support the image is going to result in a boring looking book</cite></p>
      <p>Not if they were good typefaces. But the type "of the time" was used to put ink on paper. Laid paper. Wetted paper. Letterpress. With abbreviations. Etc.</p>
      <p>Merlo is one nice contemporary reinterpretation "of the time" for book-size text. Probably not for multimedia.</p>
      <p><cite>It is not a book. It is a multimedia piece with some printed matter supporting it</cite></p>
      <p>I don't believe the 15th century Romans had what we term "multimedia." There goes the possibility of literal representation. See above for the use of type of that period. *Lettering* would be a different matter.</p>
