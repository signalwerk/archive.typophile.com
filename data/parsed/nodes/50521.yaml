      <p>I don't subscribe to the "what people who don't know any better think is about right" modus operandi.<br>
      The best work satisfies everyone, authentic enough for the most demanding critics, with a lively common touch to boot.<br>
      Authenticity can't be literal, as Charles points out (we don't even use the same alphabet as then).<br>
      The main thing is, any 21st century adaptation would stem from 15th century sources, not anything subsequent.</p>
