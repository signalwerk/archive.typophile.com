    <p>I would appreciate your ideas on suitable fonts for a project to do with the history of art and architecture that is set in the 15th-century Rome but also extends to the Christian Orient, for example to Armenia and Ethiopia.</p>
    <p>The output will be both for the screen (moving images and interactive) and print. I am hoping for a selection of options, something simple and readable for text/headings and something more old-looking/idiosyncratic for maps and images. The body text font will need to have extended pro features.</p>
    <p>Apart from the font names, any links to the pictorial references pertaining to this period would be great too.</p>
    <p>Thank you for the suggestions...</p>
    <p>Anna</p>
