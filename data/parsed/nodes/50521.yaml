      <p>Maybe Centaur. This is Bruce Rogers' redesign of a Nicolas Jenson font--Jenson lived in that same time period you're referring to, in 15th century italy (venice i believe). Centaur itself is classified as a Venetian Renaissance font. It's a personal favorite of mine. Absolutely gorgeous.</p>
      <p><a href="http://www.fonts.com/findfonts/hiddengems/centaur.htm" title="http://www.fonts.com/findfonts/hiddengems/centaur.htm">http://www.fonts.com/findfonts/hiddengems/centaur.htm</a></p>
      <p>It's certainly a font that works well for copy, if you have a lot of information as in a book. But, it alwso works well for display and caption. It's the font used for the Metropolitan Museum of Modern Art.<br>
      Check the top of this page:</p>
      <p><a href="http://www.metmuseum.org/home.asp" title="http://www.metmuseum.org/home.asp">http://www.metmuseum.org/home.asp</a></p>
