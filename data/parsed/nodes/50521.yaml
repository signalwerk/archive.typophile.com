      <p>This might sound strange coming from a font freak, but I think you're being too historically literal if you insist on the design originating from a specific time period. Unless the work is specifically for the highly typographically aware, the historical accuracy you gain will probably result in a bigger loss: functionality. I think it would be a pedantic limitation of your choices more than an instance of design sensitivity. This is especially valid due to your screen quality needs.</p>
      <p>hhp</p>
