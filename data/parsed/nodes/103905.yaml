      <p>Can't agree more with Jan. No font can perfectly replace the feeling of a handwriting and if your handwriting is as bad as mine, you're not out of the woods :)<br>
      I've tried to compile here some handwritings I like: <a class="freelinking external" href="http://www.myfonts.com/fonts/joebob/dear-joe-4/" rel="nofollow">dearJoe 4</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/bomparte/brandy" rel="nofollow">Brandy</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/fontfont/ff-duturner" rel="nofollow">FF DuTurner</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/g-type/rollerscript" rel="nofollow">Rollerscript</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/corradine/alberto" rel="nofollow">Alberto</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/g-type/olicana" rel="nofollow">Olicana</a>, <a class="freelinking external" href="http://www.fontshop.com/fonts/singles/suomi_type_foundry/suomi_hand_script_ot/" rel="nofollow">Suomi Hand Script</a> (my pick for your sample), <a class="freelinking external" href="http://www.myfonts.com/fonts/corradine/handwriting" rel="nofollow">Corradine Handwriting</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/aviation/la-carte" rel="nofollow">La Carte</a>, <a class="freelinking external" href="http://typophile.com/user/22675" rel="nofollow">more resources</a> from an older discussion</p>
