      <blockquote><p>I know she writes all her fonts herself</p></blockquote>
      <p>She doesn’t write fonts. She just handwrites, Period.</p>
      <blockquote><p>does anybody know how to do that by the way?</p></blockquote>
      <p>You need a pen, a piece of paper and a scanner (or a tablet hooked up to you computer)...</p>
