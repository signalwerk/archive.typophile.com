    <p>Hi!</p>
    <p>I'm a fashionblogger and I'm looking for some handwritten like fonts for my images. Someone I really look up to is Garance Doré, I know she writes all her fonts herself (does anybody know how to do that by the way? I would like to try it.. her website is <a href="http://www.garancedore.com" title="www.garancedore.com">www.garancedore.com</a> if you would like to see). But is there a font that resembles to her handwriting?<br>
    <img>http://www.garancedore.fr/wp-content/uploads/2013/06/24-7.jpg</p>
    <p>I am not sure if this post will insert the picture with the handwriting on it, if not, this is the link to the image: <a href="http://www.garancedore.fr/wp-content/uploads/2013/06/24-7.jpg" title="http://www.garancedore.fr/wp-content/uploads/2013/06/24-7.jpg">http://www.garancedore.fr/wp-content/uploads/2013/06/24-7.jpg</a></p>
    <p>Thank you!</p>
