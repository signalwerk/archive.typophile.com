    html: |-
      <p><em>Is it better to sell only the "Regular" font and give the rest of the family for free?</em></p>
      <p>In my experience, people who purchase the Regular version will appreciate the value-added benefit of the free versions, but freeloaders won't buy the Regular version if the freebies are available. And it's not unusual for freeloaders to expect technical support for their non-purchases: recently, I had to walk a newbie through the entire process of downloading, unzipping and installing a freeware font of mine--a total of six emails--and I regularly get requests for added features or expanded families. Freeware fonts are a good way to develop your skills on a (relatively) low-risk basis, but providing goods to the hordes of moochers out there can be more trouble than it's worth.</p>
