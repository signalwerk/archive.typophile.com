    html: |-
      <p>I want advice for each of these two positions:</p>
      <p>- You want to grow in popularity as a designer; it is your first face, but want to keep the attention that is produced publishing it for further typefaces. This face intends to introduce the subsequent ones, and to focus that attention. About how much money you make from it, you don't care.<br>
      - You just plan to do one single typeface and think your design is good enough to give it a price. You want to find the best strategy for the highest benefit. These strategies vary from setting an overall "optimal" price to selling just a few fonts, and giving the rest for free.</p>
      <p>Is there anything that I may be not considering?</p>
      <p>@Nick<br>
      Thanks, I didn't think of that problem of giving your fonts for free. I'll bear that in mind. But do you really think freeloaders won't buy the Regular version (speaking now about a book typeface, not display)? It's the starting point for the rest of the family, or am I getting it wrong?...</p>
