    html: <p>I am referring to the ones that came later....Pgh bought the first PCC ever sold...(was going to go to Baltimore but it ended up in Pgh). the PCCs that went to drake are no longer running...The Overbrook track from South Hills Jnct to Castle Shannon were so bad they had to be closed, so they ran a Drake Shuttle with PCCs from Castle Shannon to Drake, but hardly anyone rode it since they did not want to transfer at Castle Shanon...so the PCC Drake Shuttle closed in 1999....When they redid the Overbrook section and reopened it, the Drake line from the spur to South Hills to Drake never re-opened...I doubt it ever will...they have been waiting for "funding" to redo that line forever, doubt it will ever happen...PAT Transit is hurting bad, they just stopped the little used tunnel bypass line that went through Allentown....All weekend LRV service on the Library line will end in September also. Will only run weekdays....As a kid I visited my Grandma in Wilkins burgh each summer and rode the PCC trolleys on the east End of Pgh....they were taken away January, 1967. End of Pittsburgh trolley update LOL</p>
