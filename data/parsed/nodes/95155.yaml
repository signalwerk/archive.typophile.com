      <p>True, Hrant.</p>
      <p>Lucifer in "Christian Satanism", if you can call it that, is all tied up in Christian symbols by definition.  It uses the same "branding" as the church and turns it on its ear. Upside down crosses and all that.</p>
      <p>The typical portrayal of the devil is just comical, and as many actors have pointed out, the bad guy is just a more interesting role to play. In the same spirit, I think is the common association of blackletter with things satanical by metal bands, tattoo parlors etc.</p>
      <p>Real evil is banal - More like Helvetica or Arial. Guaranteed, a contract with the devil these days would be set in either of those two fonts, depending on what OS the devil favours.</p>
      <p>:o)</p>
