    html: |-
      <p>Perhaps different weights of Drescher Grotesk<br>
      ---start quote---<br>
      Life was frugal for designers (and everyone else) in the GDR. Typeface licenses were very expensive and with little money available to pay for them, type designers were instead ordered to design their own version by state publication authorities. Drescher Grotesk, originally designed by Arno Drescher around 1932 and redrawn by Karl-Heinz Lange as Super Grotesk at VEB Typoart (the state-owned type foundry), was the East German response to Futura.<br>
      ---end quote---<br>
      Source:<br>
      <a href="http://wwnorton.tumblr.com/post/37262931239/fonts-and-the-valley-of-unknowing" title="http://wwnorton.tumblr.com/post/37262931239/fonts-and-the-valley-of-unknowing">http://wwnorton.tumblr.com/post/37262931239/fonts-and-the-valley-of-unkn...</a><br>
      Digital revival:<br>
      <a href="http://www.myfonts.com/fonts/bitstream/drescher-grotesk-bt/" title="http://www.myfonts.com/fonts/bitstream/drescher-grotesk-bt/">http://www.myfonts.com/fonts/bitstream/drescher-grotesk-bt/</a><br>
      Don</p>
