  html: <p>This is a new font, my second attempt. This is my first try at lowercase though. <br>I wanted to blend a formal script and a casual brush to create something for my upcoming wedding. I just scetched out a few letters, and I know that some need work.   <br>Please feel free to add suggestions.  Thanks! <br><img src="http://www.typophile.com/forums/messages/29/10857.gif" alt=""></p>
