    html: "<p> &gt; Fine Print on Type <br> <br>I was thinking maybe you were right*, but then I found my copy: \"Galliard: a modern revival of the types of Robert Granjon\", Matthew Carter, Visible Language XIX 1 Winter 1985. It's really a great article, providing some unique insight. And when you read it, you might join those of us who have no doubt whatsoever that Granjon was the best type designer we have yet seen (although Gill might have had more raw talent). <br> <br>* <br>I *think* I've scoured all the issues of Fine Print, and I distinctly remember going through Fine Print on Type at UCLA-SpecialCollections, and when I do that I never leave without copies of the interesting parts (even if I have to cajole them into exceeding the photocopy limit), but I don't remember anything about Galliard. Dare I suggest it wasn't memorable? Pardon the candor, but what is it about Bigelow that he never manages to turn me on? Maybe it's me. <br> <br>hhp </p>"
