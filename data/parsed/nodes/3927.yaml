    date_raw: 6 Sep 2002 — 12:09pm
    votes: null
    html: "<p> Yes it does!  :-) <br>MasLucida (a set of structures, not a font) was based on Lucida because Lucida has very \"elemental\" letterforms, so they didn't need much change in order to look like *structures*, like I wanted. But I don't think I'm the only one who thinks that a *usable* font must not look so \"structural\". By the way, on the way from Lucida to MasLucida I incorporated certain \"phase one\" changes to Lucida, in order to make it more bookish, and as a result facilitate a comparison to MasLucida' intentions. Besides increasing the extenders and tightening the spacing (I *think* - it's been a while), I added a bicameral \"g\": it wasn't easy to get it to feel right, but except for a slightly large head that needs to be scaled smaller to the left, I think it provides for a better solution than the original mono \"g\". <br> <br>Maybe one thing that bugs me is the scope of the Lucida megafamily: it really seems too strict, formally speaking. Some of the constituent fonts look like they've been inbred just a *bit* too closely to become healthy adults... <br> <br>hhp </p>"
