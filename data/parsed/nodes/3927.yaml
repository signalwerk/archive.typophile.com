    html: "<p>Hrant, I think the article you're referring to is from <i>Fine Print</i> and is collected in <i>Fine Print on Type</i>, Bigelow, Duensing, Gentry eds. (San Francisco: Bedford Arts, 1989). Although, I see now that this article was written by Chuck Bigelow. Maybe you're referring to a different one. <br> <br>It's funny you should mention Galliard in this context, however, because I recently had a very long and encouraging conversation with Mike Parker about the heavier weights of Whitman and we specifically discussed Matthew's process with Galliard. <br> <br>As for how \"divergent\" my work will be, we'll just have to wait and see. <br> <br>Tiffany, I hadn't really considered condensed versions (not being too big on condensed faces myself). I had always figured that when/if I get around to display cuts, they'd be naturally a little narrower; but hardly what I would consider condensed, sorry. But who knows. . . <br> <br>-- K.</p>"
