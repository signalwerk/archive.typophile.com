    html: "<p> i'm glad to see this discussion because i publish a small (in circulation, not paper size) print electronic music magazine and since my volunteer art director left, i have to design the mag myself.  <br> <br>just to detail my experiences as a non-designer by trade, i can say i have the following problems: <br> <br>1) i have to work in black&amp;white (can't afford color) <br> <br>2) image quality of photos i receive are of a wide range of quality, from very good to horrible. <br> <br>3) i can't afford any design help. <br> <br>within these constraints, i'd love to get some suggestions on how to work. it seems to me that if you get great images to begin with, that helps make a good look for a magazine already.  <br> <br>i am currently planning on using a new font, Sys, for the text and a futuristic-looking font--House Spaceport 3009 for heads. one problem i am having is trying to create some kind of \"header\" for our different sections of reviews that meshes well with the rest of the page. perhaps i can put together a couple of PDFs when i get home for some input. is there a way to upload to this site? <br> <br>thanks, sean portnoy <br>grooves magazine--experimental electronic music magazine <br>groovesmag.com </p>"
