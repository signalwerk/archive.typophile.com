    html: <p>I think the complete offical title is supposed to be <i>STEP inside design</i> -- although you'd be forgiven for not guessing it from the logo. It was formerly <i>Step-by-Step Graphics</i>. The second issue under the new name and new design just arrived in my mailbox. I can't say that I'm all that taken with the new format. But I'll give it a year to get settled in.  <br> <br>I remember thinking the piece on Hoefler and Frere-Jones was a bit fluffy. But that may be because I'm no longer a general reader in this particular arena. <br> <br>Paolo, I won't be coming to Roma. Perhaps you can join us in Vancouver next year? <br> <br>And, for those keeping score at home, I'll take this opportunity to report that we've decided to postpone the release of Whitman until I can create the bold and black weights, which, due to a couple of pressing book design commissions, looks like it won't be until January.  <br> <br>-- Kent.</p>
