    html: <p> Fernando Gutiérrez is a Pentagram Partner and the creative director of COLORS nowadays - he studied at LCP in the early 80's - apart from COLORS &amp; MATADOR - he just did a Phaidon photo book on Gandhi - he is in my book one of the finest graphic designers of the classic mould working today. <br> <br>Now with that said i am a big fan of his stark approach at COLORS which i think is the right response to the content and the line of photography they accomodate <br> <br>His work is much more lively at MATADOR where he reaches astonishing expression from so few means (one typeface, often subtle and consistent colors and blinding work in proportions) </p>
