    html: "<p> The use of a weight axis (internally if not in the released font) which has become de rigueur since the increase in sophistication of font editors encourages uniformity in style between the various weights. This has certain advantages, but suffers from the classic flaw of Modernism: lack of contrast; which just happens to be what a Bold is intended for... In contrast (so to speak) Carter explains how he \"diverged\" the darkest weights of Galliard, giving them a singular life. I have a copy of an old article that he wrote about the development of Galliard, but I can't remember where it was from... <br> <br>BTW, this is somewhat parallel to the fact that the copy-paste (which became so easy to do with computers*) also encourages uniformity/Modernism, but on a more local level. <br> <br>* There was actually a primitive form of copy-paste even in the foundry days: punchcutters used the same counterpuch to make similar parts of different letters, like the counters of \"n\" and \"h\". See Smeijers and Paput (personally, if you like ;-) for elaboration. <br> <br>hhp </p>"
    html_clean: "<p> The use of a weight axis (internally if not in the released font) which has become de rigueur since the increase in sophistication of font editors encourages uniformity in style between the various weights. This has certain advantages, but suffers from the classic flaw of Modernism: lack of contrast; which just happens to be what a Bold is intended for... In contrast (so to speak) Carter explains how he \"diverged\" the darkest weights of Galliard, giving them a singular life. I have a copy of an old article that he wrote about the development of Galliard, but I can't remember where it was from... <br> <br>BTW, this is somewhat parallel to the fact that the copy-paste (which became so easy to do with computers*) also encourages uniformity/Modernism, but on a more local level. <br> <br>* There was actually a primitive form of copy-paste even in the foundry days: punchcutters used the same counterpuch to make similar parts of different letters, like the counters of \"n\" and \"h\". See Smeijers and Paput (personally, if you like ;-) for elaboration. <br> <br>hhp </p>"
