    html: "<p>Aw. Disappointed by Fast Company's new cover. I found the last flag incredibly endearing. The compartmentalized cover with the red/black/mustard/cyan color combination makes my stomach queasy. <br> <br>Inside, now it's pretty much Standard-Issue Magazine Layouts with no Storm at all, which was what I liked best. Now seems corporate and robotic. <br> <br>they refer readers here: <br><a href=\"http://www.fastcompany.com/keyword/redesign62\" target=\"_top\">http://www.fastcompany.com/keyword/redesign62</a> <br> <br>Business 2.0 also changed some things. Mimi Dutta, the new creative director, is a little more creative with her feature heds. And she likes DOTS a lot. ...  <br> <br>Mac Addict did a redesign three or four issues ago. There's a face inside that I can't seem to figure out. I'll get a scan up during the week. <br> <br>As far as throwing magazines out...I have a pack-rat collection of magazines dating back about 10 years. Nobody understands why I keep them, including myself....I just can't read a magazine and *throw it away!* <br> <br>bj</p>"
