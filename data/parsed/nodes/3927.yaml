    html: <p>&gt;However, for fun, take a trip around the web to the olde guarde of US graphic design...  <br> <br>&gt;1_ http://www.pentagram.com/  <br>&gt;2_ http://www.vignelli.com/  <br> <br>I saw Michael Bierut <a href="http://www.aigapgh.org/bierut.html" target="_top">speak a couple of years ago</a>, and he said he worked at Vignelli (eventually becoming a vice president there) before joining Pentagram. <br> <br>&gt;It must be an effort to extend their own brand - a kind of visual association. <br> <br>Bierut said that he uses his (and Pentagram's) signature style as a kind of back up plan. With each project he experiments and tries new things, but knows that if nothing new works, he can fall back on a style that he is sure will work. He said that this was similar to the way Vignelli works (something to the effect of  "If all else fails, put <a href="http://www.vignelli.com/poster.htm" target="_top">big black stripes</a> across it").</p>
