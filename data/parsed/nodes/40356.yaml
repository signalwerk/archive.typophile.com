      <p>Exclamation points were called “screamers”.</p>
      <p>Question marks were called “queries”.</p>
      <p>Thin strips of wood spacing are “reglets”.</p>
      <p>When spacing material rises in a forme being printed, black marks show between words or between lines. They are called “workups”.</p>
      <p>In books, several zeroes were often set to indicate a page number to be inserted later, after the whole book was paginated, as “See page 000.” These zeroes were called “deadwood” or “bogus.”</p>
      <p>I can offer more, including one that some may find offensive. but I’m just back at the desk after two weeks off work [and blessedly away from computers] and there are piles of stuff to tend to. So let me get back to this in a day or so.</p>
      <p>H N Y to you all.</p>
      <p>powers</p>
