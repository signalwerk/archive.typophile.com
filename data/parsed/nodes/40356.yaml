      <p>One time on the talk page for Wikipedia:font (typeface), a user asked if the origin story for "upper case" and "lower case" was a lot of hokum somebody made up. This guy said something like, "That sounds like an urban myth, as if typesetters in metal days actually had an upper case and a lower case. Glad to meet you, I'm Lincoln's grandfather."</p>
      <p>I assured the person the origin story is true---to the best of our knowledge.</p>
      <p>Mark---yes, in all likelihood you are right about "backslash".</p>
      <p><em>What about using the term “cut”? I think that is right in there with “leading”.</em></p>
      <p>Interesting you should bring that up: I reject terms like "foundry" and make a point of not using that word, saying "font maker" or "type designer" instead. Yet I don't think twice about calling line height "leading". "Cut" will probably be around forever, no matter what medium font makers use to draw type outlines with. Cut is almost synonymous with line and outline.</p>
      <p>j a m e s</p>
