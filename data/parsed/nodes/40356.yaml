      <p>OK. Here’s the possibly offensive one. Sometimes “deadwood” was set with sorts that were type high, but that had no image on them. They were rectangles that printed black. And they were very easy for proofreaders and comps to spot.</p>
      <p>In many hot-metal shops, even unto the 1980s, the term for them was “niggerhead.” In fact, that is the only term I ever heard for them. &amp; I was pretty startled.</p>
      <p>****************<br>
      Let me also clarify “deadwood”. That term is used not only for numerical placeholders. Any matter set to indicate where a compositor is to insert other sorts is known as “deadwood.” Or “bogus.” I worked at a Monotype shop where we had to insert Greek, Cyrillic, and Chinese by hand. Keyboard operators set deadwood to the approximately correct width and we comps would insert the non-Latin.</p>
      <p>****************<br>
      “Workups” were pushed down with special awls known in the type and printing trades as “bodkins.” Or sometimes with a “palm rule.” I wish I still had a set of those.</p>
      <p>That’s it for tonight. Gotta go shovel snow.</p>
      <p>powers</p>
