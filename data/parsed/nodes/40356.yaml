      <p>Fridays, we would “Throw in” at the letterpress shop. We would loosen the quoins, re-stock the furniture and “throw in” or dump the type out and put it all back in the California Job Cases.</p>
      <p>I swept the floors while the journeymen differentiated between d’s, p’s, b’s and q’s.</p>
