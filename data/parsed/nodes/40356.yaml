      <p>Furniture - Usually wood, but could be metal pieces which fill in the chase (which see) of a letterpress printer; held tightly in place by quoins (which see). This "word of art" is found in other industries, where it can mean any wooden component part of the whole. For example, a wooden gunstock is the gun's furniture.</p>
      <p>Copy-fitting</p>
      <p>Fist - Guess: a group of Linotype or Intertype slugs lifted from the machine's output tray and taken (in one's fisted hand, from which comes this "word of art") to a composing station, usually passing a Hammond cutoff saw first to adjust the length as required by the job.</p>
      <p>Slug - A cast line of Linotype or Intertype type</p>
      <p>Logotype</p>
      <p>Calendar figures</p>
      <p>Quad - Mechanism on a Linotype or Intertype which mechanically fills in the line; can be quad left, quad center or quad right, as set on the mechanism's control; it is an add-on accessory for most older machines, say, a Model 15, and may be standard on later machines; often found on machines installed in newspapers.</p>
      <p>Mortise - Guess: Related to furniture, but I can't remember how.</p>
      <p>Quoin &amp; quoin key - Rectangular (one piece) or wedge-shaped (two piece) device which tightens the furniture (which see) in the chase; once so tightened, the chase may be safely moved from the composing station and installed in the letterpress printer. Quoins are operated by a quoin key.</p>
      <p>Electrotype</p>
      <p>Stereotype</p>
      <p>(Actually, modern letterpress printers will know a lot of these.)</p>
    html_clean: |-
      <p>Furniture - Usually wood, but could be metal pieces which fill in the chase (which see) of a letterpress printer; held tightly in place by quoins (which see). This "word of art" is found in other industries, where it can mean any wooden component part of the whole. For example, a wooden gunstock is the gun's furniture.</p>
      <p>Copy-fitting</p>
      <p>Fist - Guess: a group of Linotype or Intertype slugs lifted from the machine's output tray and taken (in one's fisted hand, from which comes this "word of art") to a composing station, usually passing a Hammond cutoff saw first to adjust the length as required by the job.</p>
      <p>Slug - A cast line of Linotype or Intertype type</p>
      <p>Logotype</p>
      <p>Calendar figures</p>
      <p>Quad - Mechanism on a Linotype or Intertype which mechanically fills in the line; can be quad left, quad center or quad right, as set on the mechanism's control; it is an add-on accessory for most older machines, say, a Model 15, and may be standard on later machines; often found on machines installed in newspapers.</p>
      <p>Mortise - Guess: Related to furniture, but I can't remember how.</p>
      <p>Quoin &amp; quoin key - Rectangular (one piece) or wedge-shaped (two piece) device which tightens the furniture (which see) in the chase; once so tightened, the chase may be safely moved from the composing station and installed in the letterpress printer. Quoins are operated by a quoin key.</p>
      <p>Electrotype</p>
      <p>Stereotype</p>
      <p>(Actually, modern letterpress printers will know a lot of these.)</p>
