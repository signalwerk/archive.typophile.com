      <p>"A quad is a standard space, measured in ems or ens, such as an em quad or en quad. When you say 'quad left' or 'quad right' it just means 'fill out the line with quads,' pushing the line to the left or right."</p>
      <p>When used as a noun, yes.</p>
      <p>When used as a verb on a linecaster (Linotype and Intertype, and possibly also on a Monotype, although I've never operated a Monotype typecaster), or with specific reference to a quadder as a noun, it refers to the mechanism or the operation thereof, which is attached as an accessory to, or is built into the linecaster, and which effects quadding, left, right or center, without the use of true quads (em or en, or whatever, as matrices) combined with adjustable spacebars.</p>
