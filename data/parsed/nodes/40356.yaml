      <p>The accepted solution to most Wikipedia content disputes is, or has been, to join the Inclusionist Church of Wikipedia, which has the largest number of followers. To achieve a neutral point of view, multiple authors working on a single article include all points of view established as valid, with criteria for notability and verification. Readers are left to decide the relevance of the various points of view for themselves.</p>
      <p>The NPOV requirement is the reason why, for example, Wikipedia's main type history article is titled <a href="http://en.wikipedia.org/wiki/History_of_western_typography" target="_new">History of Western Typography</a>: an Asian contributor pointed out my initial breach of NPOV, concensus was established at the Village Pump, and the title was changed.</p>
      <p>You are quite right in pointing to the contemporary nature of the newer terms. Wikipedia has always been the bleeding edge in Encyclopedestrianization. The reality of Encyclopedestrianization has its shock value for everyone.</p>
      <p>j a m e s</p>
