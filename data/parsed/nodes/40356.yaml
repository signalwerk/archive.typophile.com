      <p><em>Some of Wikipedia’s listed synonyms for the slash are new to me: “oblique, diagonal, whack, separatrix, virgule, scratch comma, slant, or forward slash.” Have any of you called it a whack, a separatrix, or a scratch comma before?</em></p>
      <p>Some of them may be made up. Do any of the terms you list have citations with verifiable references? If not, you can't trust them. As a Wikipedian myself I know Wikipedia to be a crank magnet---the most powerful crank magnet in the universe. While working on type-related articles there I discovered a lot of programmer-like geeks working on them as well. They consider themselves qualified to write on typography matters, which is absurd really, all things considered, and they have an annoying habit of introducing terms and jargon from the programming world. They justify it by saying that programmers use these terms for writing code.</p>
      <p>If you guys see anything questionable or dubious in Wikipedia's typography articles and it has no citation or reference, jump right in there and put this tag next to the suspect text:</p>
      <p>{fact}</p>
      <p>That generates a [citation needed] tag in the rendered article. You don't need to be a registered Wikipedian to do it. Anyone can challenge what's there. If the author(s) who put the unreferenced material in fail to come up with a valid reference within two months it is considered acceptable to remove the unsourced material.</p>
      <p>Some people I work with call a slash a "forward slash", but it's hard to see the point when "slash" makes perfect sense contrasted with "backslash".</p>
      <p>j a m e s</p>
