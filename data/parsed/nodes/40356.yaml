      <p>The term “virgule” goes way back before typesetting, back to the mediæval era. OED (2nd edn. 1989) says:</p>
      <p>“1. A thin sloping or upright line (/, |) occurring in mediæval MSS. as a mark for the cæsura or as a punctuation-mark (frequently with the same value as the modern comma). Now also in more general use with various functions (see quots.). Cf. SLASH <em>n.</em>¹ 5”</p>
      <p>“Solidus” is used by Unicode, and was metaphorically transferred from the symbol separating shillings from pence, since “shilling” is an equivalent to “solidus” which was the Roman gold coin worth about 25 <em>denarii</em> (which itself is the source of “d.” for pence). OED gives this as sense 2:</p>
      <p>“2. A sloping line used to separate shillings from pence, as 12/6, in writing fractions, and for other separations of figures and letters; a shilling-mark. Also <em>attrib.</em> Cf. OBLIQUE <em>n.</em> 5.”</p>
      <p>“Oblique” has its first citation in the OED (sense 4) at 1785, although the first citation referring specifically to the typographic sense is from 1965: “1965 W. S. ALLEN <em>Vox Latina</em> 9 Phonemic symbols..are conventionally set between obliques, e.g. /t/.”</p>
      <p>“Scratch comma” is attested in the OED under sense V.12.b of SCRATCH: “scratch-comma, a diagonal stroke used by some early printers in place of the comma”</p>
      <p>On the other hand, the OED doesn’t have a lemma for “seperatrix”, which strikes me as suspect anyway.</p>
      <p>Feel free to deposit this info in the Wikipedia article. I can’t be bothered at the moment.</p>
      <p>(How I wish that either Unicode or HTML supported proper small caps.)</p>
