      <p><em>Some people I work with call a slash a “forward slash”, but it’s hard to see the point when “slash” makes perfect sense contrasted with “backslash”.</em></p>
      <p>I suspect these are mostly Windows users who are used to using the backslash for path names and therefore are prone to use it instead of a slash in URLs out of habit. Calling it a forward slash helps to make it clearer for them (although I sometimes hear people on the radio mistakenly saying "backslash" when reciting a URL). "Forward slash" sounds odd mainly to non-Windows users who don't use the backslash so much.</p>
