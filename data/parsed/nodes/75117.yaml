    <p>Hi, can anyone point me to some online resources that will  help me with hinting? I want to know the specifics of the process for FontLab 5, since the Fontlab manual is not especially helpful to me. In particular, I want to know if–when generating PS flavoured OT fonts–there's anything I can do to adjust the hinting on individual glyphs. But I am also interested in the process of hinting for TT flavoured OT fonts</p>
    <p>I already know the basics, I am just finding it difficult to take the step with hinting towards a more professional approach than the Auto-settings in FontLab.</p>
    <p>Thanks for any help you can offer.</p>
    <p>Wayne, ATF.com.au</p>
