      <p>Holdup a moment there... I'll give some contrary advice and suggest that Don got it right first time – his original version suceeds in <em>integrating</em> the supporting text and graphic, pretty harmoniously and pretty playfully IMHO. Separating the two only introduces an uncalled-for problem in the composition as that slanty right hand edge of the type directs the reader's attention to ...where exactly?</p>
      <p>I can read Joe's middle name fine (ornate script faces rely on a bit more context perhaps) and I think the walnut colour ink is a nice touch from someone who's not a girlygirl.</p>
      <p>I have no problem with the bullets either – they allow more air into the lines and keep that Goudy Italic from looking bunchy (which is what you might get if you only allowed for a comma and a single space).</p>
      <p>Don it's time you upgraded to charging Merlot. Enjoy the wedding y'all.</p>
