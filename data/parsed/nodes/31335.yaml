      <p>Zaner is a gorgeous face. A few thoughts. </p>
      <p>1. The serif face needs to at least be as light as the thin appears to be in Zaner otherwise it will continue to be a darker block of text. I'd suggest, in the least, making your typeface smaller.</p>
      <p>2. Our eyes natural travel from the left of the page to the right. The bottom block catches my attention because of the aforementioned weight as well as the fact that it hangs further to the left that the names. </p>
      <p>3. Perhaps consider making the larger illustrations a bit smaller or lighter in tone so it doesn't call more attention than the names. (Same problem as mentioned in #1 in that the thickness is overpowering the names.)</p>
      <p>Very lovely colors though and it is nice to see Paul's type in use.</p>
    html_clean: |-
