      <p><a href="http://www.flickr.com/photos/fontfont/3833231080/" title="FF Unit Slab - Wallpaper 1440x1080 von FontFont bei Flickr"></a></p><div class="imageWrap"><a href="http://www.flickr.com/photos/fontfont/3833231080/" title="FF Unit Slab - Wallpaper 1440x1080 von FontFont bei Flickr"><img src="/files/FFUnitSlab_Wallpaper_500_5979.png"></a></div><p></p>
    <p>When <a href="http://www.fontshop.com/fonts/designer/kris_sowersby/">Kris Sowersby</a>, <a href="http://www.fontshop.com/fonts/designer/christian_schwartz/">Christian Schwartz</a>, and <a href="http://www.fontshop.com/fonts/designer/erik_spiekermann/">Erik Spiekermann</a> were designing the parameters for <a href="http://metaserif.com/">FF Meta Serif</a>, they spent quite some time on details like the thickness and the shape of the serifs — should the face veer towards a slab with blocky, heavy serifs or should it be more of a traditional book face? In the end, they went for a “normal” serif face with fairly solid serifs, but some thick-thin contrast and counters that aren’t totally parallel to the outside shape of the letters. Stronger and thus more useful than Times New Roman while not as constructed as Rockwell. They did, however, like some of their explorations into a “humanist slab” so much, that they asked Sowersby to develop the initial sketches further as a companion for <a href="http://www.fontshop.com/fonts/downloads/fontfont/ff_unit_complete_collection_ot/">FF Unit</a>. That, in fact, is <a href="http://www.fontshop.com/fonts/downloads/fontfont/ff_meta_ot_collection/">FF Meta</a>’s more serious sister, and it looked good with heavier serifs.</p>
    <p><a href="http://www.fontshop.com/fonts/downloads/fontfont/ff_unit_slab_ot_collection/"></a></p><div class="imageWrap"><a href="http://www.fontshop.com/fonts/downloads/fontfont/ff_unit_slab_ot_collection/"><img src="/files/FFUnitSlab_Dynasty_500_5614.png"></a></div><p></p>
    <p><strong>The new <a href="http://www.fontshop.com/fonts/downloads/fontfont/ff_unit_slab_ot_collection/">FF Unit Slab</a></strong> is a fairly condensed slab which pulls a punch in bold headlines and looks surprisingly good in text with its typewriter-like discipline. Its serifs are decidedly no-nonsense and un-selfconscious. FF Unit Slab can be mixed with FF Unit, of course, but also works as companion to FF Meta. The two families share a common heritage and like to hang out with each other. <a href="http://www.fontshop.com/fonts/downloads/fontfont/ff_unit_slab_pro_collection/">FF Unit Slab Pro</a> adds Central European, Turkish, and Extended Latin character sets.</p>
    <p><a href="http://www.fontfont.com">FSI FontShop International</a> designed a digital specimen which you can enjoy on <a href="http://issuu.com/fontfont/docs/ffunitslab">Issuu</a> as well as on <a href="http://www.behance.net/Gallery/FF-Unit-Slab-The-No-Nonsense-Slab-Serif/287356">Behance</a>. Typophile moderator Yves Peters wrote a continuative article on ‘<a href="http://fontfeed.com/archives/ff49-the-creation-of-ff-unit-slab/">The Creation of FF Unit Slab</a>’, where you can download the PDF as well.</p>
