    html: |-
      <p>The Optima lower case based on that inscription was Herman Zapf's invention to harmonize with the upper case—which he also modified from that model, which inspired him. </p>
      <p>A lower case of flared sans that I also like a lot is <a class="freelinking external" href="http://www.linotype.com/171900/MentorSansBold-font.html" rel="nofollow">Mentor Sans.</a></p>
