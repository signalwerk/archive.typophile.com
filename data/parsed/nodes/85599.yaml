    <p></p><div class="imageWrap"><img src="http://typophile.com/files/italian sans_4055.jpg"></div><p></p>
    <p>Hello, Friends.</p>
    <p>   I'm a Brazilian designer looking for old examples os latin sanserif letters. Above is the only example I´ve found, used for Optima. Does anyone have more pictures?</p>
    <p>   I am specially curious about the faces pointed in these lines:</p>
    <p>   "Perhaps it is no more than an accident of history that the unserifed letters of the fifteenth century Florentine architects and sculptors were not translated into metal type in the 1470s." - Bringhurst, Elements of Typographic Style.</p>
    <p>I have already searched for Brunelleschi's and some other architects' handwriting, without success.</p>
    <p>Thanks for any help!</p>
    <p>Jeansou.</p>
