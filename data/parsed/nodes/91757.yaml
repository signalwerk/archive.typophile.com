    html: |-
      <p>Looks handdrawn to me. There are a few fonts which have been created by hand calligraphers, and used for letterpress invitations at <a class="freelinking external" href="http://www.bellafigura.com/letterpress/customize/calligraphy.html" rel="nofollow">Bella Figura</a>. Could be one of them. Makes me also thinking to the work of <a class="freelinking external" href="http://neithersnow.squarespace.com/" rel="nofollow">Mara Zepeda</a> at Neither Snow and <a class="freelinking external" href="http://shop.magpiepaperworks.com/" rel="nofollow">Magpie Paper Works</a> (<a class="freelinking external" href="http://shop.magpiepaperworks.com/category/fonts" rel="nofollow">Vermandois and Saissant</a> are available to buy).<br>
      A list of very loosely similar: <a class="freelinking external" href="http://shop.magpiepaperworks.com/category/fonts" rel="nofollow">Vermandois and Saissant</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/betatype/dear-sarah-pro/" rel="nofollow">Dear Sarah</a>, <a class="freelinking external" href="http://www.dafont.com/antrokas-demo.font" rel="nofollow">Antrokas</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/laura-worthington/alana/" rel="nofollow">Alana</a>, <a class="freelinking external" href="http://marketplace.veer.com/font/Cenizas-UMT0000164" rel="nofollow">Cenizas</a>, <a class="freelinking external" href="http://marketplace.veer.com/font/Plumero-UMT0000018" rel="nofollow">Plumero</a></p>
