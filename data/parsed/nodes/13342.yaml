      <p>Scott, Nick is his being usual insightful self. But:</p>
      <p>&gt; all of the pixel typefaces you see are TTF, PS1 or OT fonts that<br>
      &gt; have been designed to reproduce cleanly without antialiasing.</p>
      <p>Superhinted TT fonts (like the previous generation of the MS core fonts) are this sort of thing. But they take a lot of effort. Which is why so many people now make what are called “pixelfonts”, which has come to mean something different than “bitmap font”, because it involves the use of an outline font to map pixels to a “virtual grid” - basically little outline blocks of one sort or another that map to exact bitmaps at a certain point size. The main reasons for this are that: Flash didn’t support “true” bitmap fonts; and increasing (like MacOS now) bitmap fonts are not [properly] supported. Furthermore, if you want to handmake <strong>grayscale</strong> bitmap fonts (which I’ve been doing) you can only do it through pixelfonts (at least robustly and portably).</p>
      <p>&gt; 1) Work with a clearly defined grid: 7x7<br>
      &gt; is probably the smallest workable area.</p>
      <p>But please don’t make really small pixelfonts! We have too many, and their expressiveness is necessarily in proportion to their unreadability.</p>
      <p>&gt; 2) The smallest design unit is a true square. All other elements<br>
      &gt; will be composed of whole-number multiples of the height or the<br>
      &gt; width of that square.</p>
      <p>Except if you make grayscale ones…</p>
      <p>&gt; 3) Have fun and take chances.</p>
      <p>Yes!</p>
      <p>hhp</p>
