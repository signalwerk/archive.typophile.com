    <p>Kind of not sure how to get started but I would really like to create a pixel font for a website I’m designing.  This isn’t something I’ll be doing much of, and I have no idea how to begin.</p>
    <p>Is there anyone that has suggestions as to where I can start to find some information about this?  What are the tools people usually use for this?</p>
    <p>Thanks!<br>
    Scott</p>
