      <p>Twenty-plus years ago, the Chyron IV character generator used by many television stations had a function for creating true pixel fonts, but that technology has long since been eclipsed. Nowadays, I am reasonably confident that all of the pixel typefaces you see are TTF, PS1 or OT fonts that have been designed to reproduce cleanly without antialiasing.</p>
      <p>Here are a few tricks for creating a workable pixel font:</p>
      <p>1) Work with a clearly defined grid: 7x7 is probably the smallest workable area.</p>
      <p>2) The smallest design unit is a true square. All other elements will be composed of whole-number multiples of the height or the width of that square.</p>
      <p>3) Have fun and take chances.</p>
      <p>If you would prefer not to re-invent the whell, there are a lot of serviceable and clever examples already available: <a href="http://dafont.com/en/author.php?author=308" target="_blank">Yuji Adachi</a> is one of my favorite pixelware designers.</p>
