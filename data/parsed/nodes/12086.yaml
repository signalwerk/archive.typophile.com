    <p>Looking to identify the font used by Wizz Air (discount airline in Europe):<br>
    <a href="http://wizzair.com/gallery/images/gal006_038.jpg" title="http://wizzair.com/gallery/images/gal006_038.jpg">http://wizzair.com/gallery/images/gal006_038.jpg</a></p>
    <p>The backwards-slant to the ends of the a, r and c and the pointy corners on the z should be a dead giveaway, but I’m coming up blank...</p>
    <p>—Mike</p>
