  html: <p>Should numbers be tabular or proportional by default? (Assuming the font is OpenType format) Or does it really matter? <br>What characters besides numerals need to be set on the same width for tabular lining? (dollar, Euro, yen, sterling, period (decimal), comma, fractions, others???)</p>
