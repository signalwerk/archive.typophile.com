    html: "<p>It depends on the style/usage of the font. <br>In general, for a text face I would make one or both of two main styles: hybrid proportional, and 3/4-lining fixed-width. And unless the caps are very short I wouldn't align the latter with them (in general). This will cover you 90%. BTW, see de Groot's numerals for the best in the west. <br> <br>As for non-numeric characters that might benefit from having a relationship with a fixed-width numeral width, certainly the currencies should be that width - and here's a trick I learned from JF: make stuff like commas and periods (and the en dash) exactly <i>half</i> that width, and make the blank space character that width too. That way you can easily pad the widths as necessary. <br> <br>* Actually, you would of course determine the space first and then double it to get the fixed-width for the numerals. <br> <br>BTW, Paul, dude, are you guys gonna give Typophile.com credit when the Lanston stuff is [re-]released? You've been mining our heads like there's no tomorrow!  ;-) <br> <br>hhp</p>"
