d the os-figs were not on a common body. For many fonts, it was easy enough to construct them. Matthew Carter constructed a special set for Galliard; you can get them from Carter &amp; Cone if you ask � they are drawn differently than the proportional figures; he didn�t just put the proportional os-figs on a common body. <br> <br>As for using oldstyle figures in tables, I use them when the tables are straightforward data, and when the book isn�t one I think the audience would be more comfortable with lining figures. <br> <br>And I�d note that it is sometimes necessary to make a tabular comma and period, for either os or lining tabular figs. <br> <br>FWFW <br> <br>Charles</p>
