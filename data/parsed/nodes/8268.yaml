    html: <p>Paul, <br>It is hard to read your user's intentions when designing a typeface.  If your intent is to make your font more marketable to everyone, I would suggest including both lining and oldstyle figures.  If you must choose one, I would make it lining but at a height somewhere between cap height and x-height.  This makes the numbers less obtrusive in the text but still allows for the tables found in annual reports and price catalogues. Like Tiffany, I think business cards set in oldstyle can be disruptive when you have so many phone numbers and addresses and zip codes all packed into such a small size card.  This again is the users choice and why having both sets is always the best solution. <br> <br>ChrisL</p>
