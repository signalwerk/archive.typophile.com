    <p>Hello,</p>
    <p>I'm after a font I can use in a newsletter to school kids. It has to be legible down to a small point size.</p>
    <p>The font used for text in Pokemon trading cards seems to be ideal (for example, the text in the Pokemon Magnemite card).</p>
    <p>Would anyone know the name of this font or possibly recommend an alternative font?</p>
    <p>Many thanks,<br>
    Adrian.</p>
