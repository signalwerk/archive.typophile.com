    <p>Hey!<br>
    I’m currently writing a parser for the TrueType file format for a project I’m doing. I don’t need all the tables present in the TT standard, and everything I’ve parsed so far has worked out nicely. Now I’m battling with the glyf-table, which I just can seem to get right!</p>
    <p>When I parse this table, everything works as expected as long as there are no blank glyphs (zero contours (spaces etc)). Sometime when my parser hits a blank glyph it gets out of synch, which of course has devastating effects...</p>
    <p>The files I’m parsing don’t have composite glyphs, so I don’t have to worry about that (contour values = -1).</p>
    <p>I think I’ve localized the error. If I look at my font in a hex editor I can see that the blank glyphs do not have a full glyph-header (n_contours, x_min, y_min, x_max, y_max). Instead they seem to have an arbitrary (usually 1-3) byte entries which are zero, and then the next glyph on comes right after that.<br>
    For instance, a blank glyph in a hex editor looks like this:</p>
    <p>... 05 e6 fa 1a    |    00    |    00 01 01 AA ...</p>
    <p>The first part is the en parts of the previous glyph. This seems to be correct - I get the right point values and flags for it.</p>
    <p>The middle part is a single 0 entry, and that’s all I can find from the blank glyph.</p>
    <p>The last part first says 0001 countours, which is correct, and 01AA xMin which is also correct for the following glyph. As you can see, the middle glyph, which is a blank glyph, only has one single entry... no full 5 Short value glyf-header!</p>
    <p>I have no clue why that is! For a while I thought the varying amount of zero entries were some kind of allignment padding in the file, but that doesn’t seem right...</p>
    <p>I’m thankful for any help I can get to help me out here!<br>
    Thanks in advance!!</p>
    <p>/Magnus</p>
