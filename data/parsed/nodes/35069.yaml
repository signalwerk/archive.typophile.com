    html: |-
      <p>It’s hard to say for sure without seeing the rest of the font data, but I would guess that what you’re calling the data for the blank glyph *is* in fact padding at the end of the first glyph. There can be 0 - 3 pad bytes at the end of each glyph’s data, depending on the length of the data and ’loca’ format (’indexToLocFormat’ value from the <a class="freelinking-external" href="http://www.microsoft.com/typography/otspec/head.htm">’head’ table</a>).</p>
      <p>Are you reading the ’loca’ table to obtain each glyph’s offset and length within the ’glyf’ table? I would be surprised to see such results if so, as it would indicate corruption (as an aside: if you haven’t already verified the integrity of the data, you should consider doing so with <a class="freelinking-external" href="http://www.microsoft.com/typography/FontValidator.mspx">Font Validator</a> or other utility). Truly blank glyphs will have a length of zero.</p>
      <p>If you’re not using the ’loca’ values...well, you need to. The ’glyf’ table data is meaningless without the ’loca’.</p>
