      <p><cite>‘scientists adding knowledge to the field with empirical data, supporting (or refuting) what you do through aesthetic, intuitive, conventional, and anecdotal “wisdom.”’</cite></p>
      <p>Are you sure? If what they are studying is inherently flawed – in other applications the requirement (for fast word recognition) might not be the same and the effects might be different –&nbsp;then it is a red herring.</p>
      <p>Type-wise a heads-up display has significantly different environments to cope with and retinal implants are, obviously another kettle of herring.</p>
      <p>But, as Nick mentioned, my point was to avoid the problem altogether. Is an lcd screen really required to operate a car efficiently? Could the systems be, for example, voice operated and the responses aural? I am not proposing that as the only solution, just as a thought. </p>
      <p>It is surely obvious that if any device (vehicle) requires concentration to operate, with life and death consequences for distraction, using another device that holds “crucial” information (out of the operator’s eyeline, or blocking it as in the image at the top of the article) is detrimental.</p>
      <p>Whether that information is actually crucial is another matter, of course.</p>
      <p>Tim</p>
