      <p><em>…optimizing typeface characteristics may be viewed as a simple and effective method of providing a significant reduction in interface demand and associated distractions.</em></p>
      <p>i.e. Choosing an easy-to-read typeface will make text easier to read.<br>
      That much has been self-evident to graphic designers for over 100 years.</p>
      <p>However, optimizing is never simple; it implies at least making some headway on the slope of diminishing returns. The choice between Frutiger and Eurostile may be simple, but I would be tempted to try Clearview and something with serifs, to see how they fare. But I wouldn’t go too far down that route without considering:</p>
      <p><em>Future work will need to assess if other typeface characteristics can be tuned to provide further reductions in demand.</em></p>
      <p>i.e. Choosing the right weight, grade, size, color, letterspacing, horizontal scaling and leading will also improve readability.<br>
      That much has been self-evident to graphic designers for over 100 years, in fact it forms the basis of the profession.<br>
      This is where taste and experience come into play, because it’s not possible to test every combination of every typographic variable, there are too many. Graphic designers can identify packages of values, settings that look right for page under consideration.</p>
