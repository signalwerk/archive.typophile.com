      <p>@Nick: I thought about Clearview as well, but then realized it was for highways, not dashboards. I wouldn’t consider it a contender, but am surprised it wasn’t included regardless. And especially surprised that there were no serifs. AND, that there was no conflict of interest clause in this paper, given it was funded in part by Monotype. </p>
      <p>As far as “<em>Choosing an easy-to-read typeface will make text easier to read. That much has been self-evident to graphic designers for over 100 years</em>.” Agree. But the key word there is <strong>self</strong>. What we have is anecdotal evidence, convention, aesthetics, and intuition. The little scientific research we have in this field with objective measures of human performance and empirical data is still very much in the early stages of its development. Its quality reflects this.</p>
      <p>@Ryan: “<em>I have been trying to get a decent test for most legible for long text sans for a while now</em>…” And unless you drastically clarify and operationalize what you mean by “<em>most legible for long text</em>” you never will. The only way this paper got results was because they had clearly defined measures such as time, accuracy, and eye movements.</p>
      <p>You may find some articles of interest in the literature section of my site. It’s small, but I try add to it as I go.</p>
      <p><a href="http://readthetype.com/literature/">http://readthetype.com/literature/</a></p>
      <p>What you will most certainly find disappointing is that there is not a lot of research out there that looks at long passages of text. This is because, sadly, there are very few standardized reading comprehension tests with long passages. In fact, I can’t think of a single on off the top of my head. A very common complaint in the field. I have tried to make up my own comprehension questions for long passages I selected myself, but it is amazingly difficult. They just end up measuring recall or visual search depending on your methods. I had no idea that writing your own comprehension questions was such a highly specialized skill.</p>
      <p>Still reading the paper, but it’s 5:00 on Friday, and somewhere there’s a pint with my name on it.</p>
