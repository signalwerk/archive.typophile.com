    <p>Hi everyone,</p>
    <p>I'm glad to be here and I'm looking forward to some great discussions. I thought I'd dive right in: I'm a graphic designer and just starting out with calligraphy and lettering. I've finished my first project and I'd appreciate some feedback on it. On any angle, really. I have no one here to critique my work and there seem to be some real pros here, so I hope I can learn a lot from you guys :)</p>
    <p>Here's my project:<br>
    <a class="freelinking external" href="http://www.behance.net/gallery/Much-Madness-is-Divinest-Sense/12102353" rel="nofollow">http://www.behance.net/gallery/Much-Madness-is-Divinest-Sense/12102353</a></p>
    <p>All the best,<br>
    Natascha</p>
