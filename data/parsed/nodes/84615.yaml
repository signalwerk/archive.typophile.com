    <p>Look at <a class="freelinking external" href="http://www.fontclub.co.kr/productimage/detail/고운한글견본.pdf" rel="nofollow">this sample</a>. This is a pair of serif and sans serif - or batang and dotum - (Called 고운한글 (Go-un Hangul) in Korean) designed by Ryu Yanghee. They have the most feminine aproach in all the Hangul typefaces.</p>
    <p>But I have question: Where were the Latin and numeral portions of the fonts came from? I tried MyFonts' What the Font and several other font identifier sites, but couldn't find exact matches. Were those portions designed by Ms. Ryu herself? Or, were those came from existing typefaces not listed on those sites? (Like Panno and Gotham on MyFonts)</p>
