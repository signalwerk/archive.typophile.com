    html: |-
      <p>I e-mailed <a class="freelinking external" href="http://www.sandoll.co.kr/" rel="nofollow">Sandoll</a>, the distributor of Go-un fonts. And returned mail said that the Latin and numeral portions were made with references to <a href="/wiki/Garamond" class="freelinking" rel="nofollow">Garamond</a>, <a href="/wiki/Goudy" class="freelinking" rel="nofollow">Goudy</a>, <a href="/wiki/Times" class="freelinking" rel="nofollow">Times</a>, etc. for batang/serif ones and <a href="/wiki/Helvetica" class="freelinking" rel="nofollow">Helvetica</a>, <a href="/wiki/Fedra%20Sans" class="freelinking" rel="nofollow">Fedra Sans</a>, Humania[sic, I guess?], etc. for dotum/sans ones.</p>
      <p>I don't want to close this thread just with this. So let me ask something. We learned the serif ones are close to <a href="/wiki/Goudy%20Old%20Style" class="freelinking" rel="nofollow">Goudy Old Style</a>. Then, which Latin sans serif font is close to Go-un Hangul Dotum's Latin and numeral portions? Helvetica is unlikely. I guess it's one of those two remaining humanist sans serif fonts, but the shape of glyphs is slightly different from that of Fedra Sans. (Especially capital M, etc) Any ideas?</p>
