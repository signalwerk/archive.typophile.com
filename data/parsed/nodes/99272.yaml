  html: |-
    <p>Hello everybody!</p>
    <p>Just a quick question: Is there such a things as a guide to typical or standard character sizes? I'm in the process of creating a new typeface and I'm having trouble deciding on the width of some characters in relation to each other... for example, what's the typical length of the minus hyphen compared to the m dash? And the plus character? And so on and so on... Some very good info is in the "Character design standards" Microsoft Typography site, but no info on widths/proportions.</p>
    <p>Also, any resource listing all the characters that "need" to be included in a font? My typeface will be Latin and Cyrillic and I'm using other fonts to look at which characters to include.</p>
    <p>Thanks!</p>
