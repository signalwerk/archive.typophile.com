    html: |-
      <p>Regarding Latin and Cyrillic, both of those are nearly open-ended. How *much* Latin/Cyrillic do you want to cover? It's a complicated question.</p>
      <p>Some Latin groupings, each a superset of the previous</p>
      <p>Western Europe (Adobe Latin 1 or 2)<br>
      +CE<br>
      +Adobe CE (includes Turkish, Baltic, etc, a.k.a. Adobe Latin 3)<br>
      +Vietnamese<br>
      Adobe Latin 4 (not much more than Vietnamese)</p>
      <p>See <a href="http://blogs.adobe.com/typblography/2008/08/extended_latin.html" title="http://blogs.adobe.com/typblography/2008/08/extended_latin.html">http://blogs.adobe.com/typblography/2008/08/extended_latin.html</a> for more on this.</p>
      <p>One can make a similar ladder for Cyrillic. See for example: <a href="http://blogs.adobe.com/typblography/2006/08/defining_an_ext.html" title="http://blogs.adobe.com/typblography/2006/08/defining_an_ext.html">http://blogs.adobe.com/typblography/2006/08/defining_an_ext.html</a><br>
      Not quite as well developed, but a start.</p>
      <p>Cheers,</p>
      <p>T</p>
