      <p>One possibility is to look up information on Monotype matrix-case arrangements, or on the Selectric Composer, since these were systems that made character widths explicit.</p>
      <p>My web page, at</p>
      <p><a href="http://www.quadibloc.com/comp/propint.htm" title="http://www.quadibloc.com/comp/propint.htm">http://www.quadibloc.com/comp/propint.htm</a></p>
      <p>happens to deal with this very subject.</p>
