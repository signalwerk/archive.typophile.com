    html: <p>Chris, thanks for the feedback. Here I made changes to the logo. Removed the horizontal rules(i think it goes better now), made changes to the overlapping, and in the 2nd one, removed the extra lines just to show u how it looks (I had tried that earlier but it doesn't really work because of the abrupt breaks). The client is quite happy with the letter forms because I had done another one with the similar font as the emblem but it was too stretched and also the thickness of the lines didn't match. <br> <br>I still don't think the letterforms in the emblem are readable. That is the only thing the client wants to be changed. <br> <br>Would appreciate any feedback. <br> <br><img src="http://www.typophile.com/forums/messages/29/57145.jpg" alt="pdba 2"></p>
