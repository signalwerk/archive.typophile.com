    <p>Hi,  <br> <br>This is a corporate logo design I am doing for the "Progressive Dyers and Bleachers Association of West Bengal".The corporate group is an association of corporates from the hosiery industry involved in dying and bleaching of cotton cloth in the factories.  <br> <br>I took the shape of the initials and used the form of "PDBA" to form the shape on the left which is there to represent the rollers in the dying machines.  <br> <br>The problem is that, the client likes the logo but, he wants the letters to be readable in the same format. Also, I am not sure about horizontal lines at the bottom enclosing "Of West Bengal".  <br> <br>I would appreciate any kind of help or feedback.  <br> <br>Thank you <br> <br><img src="http://www.typophile.com/forums/messages/29/57090.jpg" alt="pdba logo"></p>
