    html: "<p>Ritesh, I like the concept of the rollers. The way the letters work is too good to pass up. The execution does need refinement(as you noted). <br> <br>First off, the overlapping forms should probably be more related to their forms, so: the ascender of the d should overlap the bowl of the p, which should overlap the bowl of the d. The ascender of the b should overlap the bowl of the d and the bowl of the a should overlap the line descending from the b. Some of this you've done already, but the lines that define the letters should probably stay more intact. Have you tried to remove any line portion that is not part of a letter? It might help a bit. <br> <br>The rules enclosing \"of West Bengal\" don't do anything for me either. <br> <br>Does the client want to change the condensed letters to large, open ones like the \"pdba\"? If so, it could get very long/confusing to read.</p>"
    html_clean: "<p>Ritesh, I like the concept of the rollers. The way the letters work is too good to pass up. The execution does need refinement(as you noted). <br> <br>First off, the overlapping forms should probably be more related to their forms, so: the ascender of the d should overlap the bowl of the p, which should overlap the bowl of the d. The ascender of the b should overlap the bowl of the d and the bowl of the a should overlap the line descending from the b. Some of this you've done already, but the lines that define the letters should probably stay more intact. Have you tried to remove any line portion that is not part of a letter? It might help a bit. <br> <br>The rules enclosing \"of West Bengal\" don't do anything for me either. <br> <br>Does the client want to change the condensed letters to large, open ones like the \"pdba\"? If so, it could get very long/confusing to read.</p>"
