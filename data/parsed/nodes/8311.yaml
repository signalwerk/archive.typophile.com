  html: <p>This is not very well drawn. I would say it's probably custom lettering. Possibly based on Times Bold (stretched). Hard to say for sure. I seem to recall a few fonts that have characters similar to some these, but it would take some time to find them. An R like that is pretty rare. I'm not sure if I've ever seen one quite like it.</p>
