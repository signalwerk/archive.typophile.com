    <p>Hi all, I am new to posting, but have used this board<br>
    as a reference for some time now. I’m hoping you can help this newbie!</p>
    <p>I am looking for an opentype font which is  similar to Scala Sans. It must have bold versions, small caps, and old style figures. I realize that Scala has an opentype version, but the cost is prohibitive!</p>
    <p>I am using this for a publication that uses Scala, but in the next issue, I have to set many, many uncommon fractions.</p>
    <p>I’m looking at<br>
    <a href="http://www.linotype.com/91948/beret-family.html">Beret</a><br>
    but would love other suggestions.</p>
    <p>Thank you for any help!</p>
