  html: |-
    <p>Doing a book layout, we're playing with using Rotis Serif and Sans, liking the verticality and the very slightly unconventional forms – 1988, but it still feels fresh.</p>
    <p>However, one of the people involved is not convinced.</p>
    <p>Any suggestions for a similar sort of super-family, sans and serif, clean and crisp, somewhere not too far from the moment?</p>
