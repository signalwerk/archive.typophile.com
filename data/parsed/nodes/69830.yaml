    html: |-
      <p>You can use Adobe Illustrator to make it.</p>
      <p>make an oval or star outline or any shape outline you like</p>
      <p>right click on shape- transform- rotate</p>
      <p>experiment with degrees, i would start small if you want it to look like those, 3 or 4 degrees<br>
      hit Copy, NOT ok, this will create a copy, rotated a few degrees<br>
      hit command(mac)/control(pc) and 'd' - this will repeat the action.</p>
      <p>keep hitting cmd 'd' until you are happy!</p>
      <p>I hope this helps, im sure there are better ways or software but this will work</p>
