      <p>The typeface is the original Uptight Neon (Jack L Deskin, 1971)  as seen in the 1980 VGC catalog (phototype). Later, ITC released it as a font and my copy came bundled with CorelDraw software years ago (legit and co-copyrighted ITC/Corel).</p>
      <p>The thing is, the ITC version differed from the original. <a href="https://images.search.yahoo.com/images/view;_ylt=AwrTcX.X3INTJzIAFyWJzbkF;_ylu=X3oDMTIybHAxZ3VjBHNlYwNzcgRzbGsDaW1nBG9pZAMzNzhhNjlhZWI2YTA4MjEwZGM1OGRkNGM4MmMxZThiMwRncG9zAzIEaXQDYmluZw--?back=https%3A%2F%2Fimages.search.yahoo.com%2Fsearch%2Fimages%3F_adv_prop%3Dimage%26va%3D%252Bfonts%2B%252Buptight%26fr%3Dyfp-t-432%26tab%3Dorganic%26ri%3D2&amp;w=434&amp;h=243&amp;imgurl=e-daylight.jp%2Fdesign%2Ffonts%2Ftype%2Fu%2Fimg%2Fuptight-neon_all.gif&amp;rurl=http%3A%2F%2Fe-daylight.jp%2Fdesign%2Ffonts%2Ftype%2Fu%2Fuptight-neon.html&amp;size=22.8KB&amp;name=%E3%83%95%E3%82%A9%E3%83%B3%E3%83%88%E3%81%AF%E3%81%93%E3%81%93%E3%81%AB%E6%8E%B2%E8%BC%89%E3%81%97%E3%81%9F+Image+Club+Graphics+%E7%A4%BE%E8%A3%BD%E4%BB%A5%E5%A4%96+...&amp;p=%2Bfonts+%2Buptight&amp;oid=378a69aeb6a08210dc58dd4c82c1e8b3&amp;fr2=&amp;fr=yfp-t-432&amp;tt=%E3%83%95%E3%82%A9%E3%83%B3%E3%83%88%E3%81%AF%E3%81%93%E3%81%93%E3%81%AB%E6%8E%B2%E8%BC%89%E3%81%97%E3%81%9F+Image+Club+Graphics+%E7%A4%BE%E8%A3%BD%E4%BB%A5%E5%A4%96+...&amp;b=0&amp;ni=120&amp;no=2&amp;ts=&amp;tab=organic&amp;sigr=11qbpl9ah&amp;sigb=13i8fbl1m&amp;sigi=11q03pa1a&amp;sigt=12994avq6&amp;sign=12994avq6&amp;.crumb=BNzpGjoA2us&amp;fr=yfp-t-432" target="_blank" rel="nofollow">Here</a> is the ITC version and <a href="https://images.search.yahoo.com/images/view;_ylt=AwrTcX4C3oNTSTcAcMqJzbkF;_ylu=X3oDMTIycHJrN3NvBHNlYwNzcgRzbGsDaW1nBG9pZAM1YTYxZDQzODY2NzMyNWQ0NmYxNzJlNWExODAwMzc0MgRncG9zAzYEaXQDYmluZw--?back=https%3A%2F%2Fimages.search.yahoo.com%2Fsearch%2Fimages%3F_adv_prop%3Dimage%26va%3D%252Bfonts%2B%252Buptight%26fr%3Dyfp-t-432%26tab%3Dorganic%26ri%3D6&amp;w=400&amp;h=400&amp;imgurl=static.fontgal.com%2Ffont%2Fshare%2F26391-uptightc.png&amp;rurl=http%3A%2F%2Ffontgal.com%2Ffont%2F11055-uptightc&amp;size=62.6KB&amp;name=26391-uptightc.png&amp;p=%2Bfonts+%2Buptight&amp;oid=5a61d438667325d46f172e5a18003742&amp;fr2=&amp;fr=yfp-t-432&amp;tt=26391-uptightc.png&amp;b=0&amp;ni=120&amp;no=6&amp;ts=&amp;tab=organic&amp;sigr=1166ipbhn&amp;sigb=13ijh06sd&amp;sigi=11gjl3u0h&amp;sigt=10ih82oe4&amp;sign=10ih82oe4&amp;.crumb=BNzpGjoA2us&amp;fr=yfp-t-432" target="_blank" rel="nofollow">here</a> can be seen a portion of the original - with your B and e.</p>
      <p>I know of no digital versions of the original.</p>
