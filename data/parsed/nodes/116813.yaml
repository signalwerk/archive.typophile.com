      No need to edit. Claude Pelletier created a digital revival of Uptight C in 2010 <a href="http://www.dafont.com/uptightc.font" title="http://www.dafont.com/uptightc.font">http://www.dafont.com/uptightc.font</a><br>
      Claude said he redrew it with Autocad.<br>
      Don<br>
