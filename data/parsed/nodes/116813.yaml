      <p>This Art Deco style sign looks like ITC Bauhaus, with a modified initial B<br><a href="http://www.myfonts.com/fonts/itc/bauhaus/">http://www.myfonts.com/fonts/itc/bauhaus/</a><br><a href="http://www.myfonts.com/fonts/linotype/itc-bauhaus/">http://www.myfonts.com/fonts/linotype/itc-bauhaus/</a><br><a href="http://www.myfonts.com/fonts/adobe/itc-bauhaus/">http://www.myfonts.com/fonts/adobe/itc-bauhaus/</a><br>
      This is based on the Universal typeface designed by Herbert Bayer of the Bauhaus School in Dessau, Germany in 1925. Ed Benguiat and Vic Caruso redrew the typeface in 1975.<br>
      Don</p>
