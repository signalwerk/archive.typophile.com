      <p>The typeface is the original Uptight Neon (Jack L Deskin, 1971)  as seen in the 1980 VGC catalog (phototype). Later, ITC released it as a font and my copy came bundled with CorelDraw software years ago (legit and co-copyrighted ITC/Corel).</p>
