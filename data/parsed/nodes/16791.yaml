    html: |-
      <p>"is when you over compensate for printing errors"<br>
      it is only "overcompensation" when you over do it.</p>
      <p>To me, trapping is also a way to open visual space at small sizes--even if ther was no ink plugging going on. Angle joins of M, W, and N are examples of glyphs that might need it. The bolder the weight, the more likely the need will arise.</p>
      <p>ChrisL</p>
