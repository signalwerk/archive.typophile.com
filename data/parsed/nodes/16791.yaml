    <p>Hi all,</p>
    <p>I am writing a logo and brand guidelines and I cannot remember the proper name for the 'dent' in a letterform.<br>
    For example the letter 'k'. I have looked on the web and can't seem to locate it.</p>
    <p>If anyone can help, I'd really appreciate it.</p>
    <p>Thanks,<br>
    T.</p>
