  html: <p>Maybe some of you would like to get started with Dreamweaver. <br>I'm selling my license, now that I figured out how to transfer it properly. It's the recent version btw. I'm selling it a bit cheaper than Macromedia is currently, since bits don't suffer from wear and tear I think that's fair game. <br> <br><a href="http://cgi.ebay.com/ws/eBayISAPI.dll?ViewItem&amp;item=5735037420" target="_blank">http://cgi.ebay.com/ws/eBayISAPI.dll?ViewItem&amp;item=5735037420</a> <br> <br>Also I'd like to get rid of Contribute 2 and Adobe's GoLive 6 which I accidently over-licensed <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> No really, since I got GoLive 6.0 as a box and CS Premium as a box I don't need to have a dead license lying around.</p>
