    html: |-
      <p>I try to write as quickly as possible, time's running out. This means my handwriting is a matter of getting something on paper at high-speed, not necessarily conducive to thinking "what shall I make a particular character look like?"</p>
      <p>Maybe this is one of the reasons I can't understand why anyone wants a font to resemble handwriting. Since one of the basic premises of handwriting is speed, why would I then wan't anything to look like a handwritten form when, in type design, I have got time to make a character look exactly like I want it to without the limitations of a hand on a pen governing how it should look. That would be illogical. Call me a Philistine if you like.</p>
