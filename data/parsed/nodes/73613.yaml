    <p>I'm just wondering, as I've noticed I've paid more attention to the form of my handwriting ever since I developed an appreciation for various typefaces. For example, I started to add a tail onto my Gs due to the influences of Helvetica and occasionally try to write my Rs like the Helvetica Rs. Also, for a time I tried to make my question marks similar to that of Futura and tried adding a flag to my 1s, again influenced by Futura. </p>
    <p>So have any of you changed your handwriting due to the influences of a particular typeface?</p>
