      <p>I overhauled my signature in high school, and my redesign was heavily influenced by Tolkien's Fëanorian Tengwar, with a lot of sharp descenders and a couple swashes.</p>
      <p>Likewise, I redesigned my messy handwriting in high school, shifting to a printed Roman drawn with different strokes many of which simulate serifs (on the B, D, I, J, P, R, and S), which greatly improved the legibility and readability of my printing. I didn't have a specific serif face in mind when I did the redesign, so it was probably Times New Roman that influenced it the most; still, clarity is one of TNR's virtues, so I could have chosen a worse model.</p>
