      <p>No. I used the cursive style I had learned at school by age 10. It became slicker by the time I was an adult, but had the same basic construction. Then around age 30 I studied calligraphy, and subsequently adapted my casual handwriting to use the proper joining rules of the chancery script.</p>
      <p>The only typeface I've made from my handwriting is Panoptica Script, but it's not my everyday writing. Handsome, a script face, was "written" in Fontographer with a Wacom stylus, but the effect is too stiff and formal to bear much relationship to my "real" handwriting. One of these days I might make a typeface based on my writing.</p>
