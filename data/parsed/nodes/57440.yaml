    <p>Dear Typophiles:</p>
    <p>Today <a class="freelinking external" href="http://www.tipotype.com">TipoType</a> (<a href="http://www.tipotype.com" title="www.tipotype.com">www.tipotype.com</a>), a digital type foundry from Montevideo, Uruguay comes to light. This is the first type foundry of Uruguay, feel free to contact us.</p>
    <p>Thank you,<br>
    Fernando Díaz<br>
    TipoType Coordinator.</p>
