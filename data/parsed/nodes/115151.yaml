    <p>John Baskerville was first a calligrapher in his youth<br>
    and then became a rich merchant.<br>
    Baskerville stated that his own romans were influenced by calligraphy.<br>
    How do you spot the calligraphic leaning in the letters of the <a class="freelinking external" href="http://www.myfonts.com/fonts/mti/baskerville-mt/" rel="nofollow">Baskerville Roman</a>?<br>
    I'd like to know your personal view.</p>
