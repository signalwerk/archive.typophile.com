    html: <p>I agree about the font. Looks like a feminine product. Why don't you try and express purification or purity in your logo. Look at good water bottle packaging. I like "Smart Water" they have a pure feeling in their logotype and packaging. Also think about the utility aspect. A good water company should have a very trustable versitile logo. As it stands now your logo can be trusted on the surface but lacks backbone and longevity.</p>
