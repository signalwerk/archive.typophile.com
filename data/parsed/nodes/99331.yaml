  html: <p>I designed a logo using the Coffee Shop typeface from YWFT (<a class="freelinking external" href="http://www.youworkforthem.com/font/T3310/coffee-shop" rel="nofollow">http://www.youworkforthem.com/font/T3310/coffee-shop</a>). I'm wondering if anyone has any suggestions for a complementary font that I can use for the header slogan and header bars on the blog this logo is to go on. I wanted something with a certain deconstructedness to it, but handwritten fonts don't really match well. I'm open to any suggestion because I'm stumped at this point. Thanks!</p>
  html_clean: <p>I designed a logo using the Coffee Shop typeface from YWFT (<a class="freelinking external" href="http://www.youworkforthem.com/font/T3310/coffee-shop" rel="nofollow">http://www.youworkforthem.com/font/T3310/coffee-shop</a>). I'm wondering if anyone has any suggestions for a complementary font that I can use for the header slogan and header bars on the blog this logo is to go on. I wanted something with a certain deconstructedness to it, but handwritten fonts don't really match well. I'm open to any suggestion because I'm stumped at this point. Thanks!</p>
