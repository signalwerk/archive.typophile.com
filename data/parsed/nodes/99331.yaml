    html: <p>Thanks for the suggestion, hrant! I checked out some thin slab serifs, and I like the look of Josefin slab (<a class="freelinking external" href="http://www.fontsquirrel.com/fonts/josefin-slab" rel="nofollow">http://www.fontsquirrel.com/fonts/josefin-slab</a>). Even though I'd prefer a font that I pay for, I didn't really see any that compared.</p>
