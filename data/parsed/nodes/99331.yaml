    html: |-
      <blockquote><p>I'd prefer a font that I pay for</p></blockquote>
      <p>Nice to hear that sentiment!  :-)</p>
      <p>That said Josefin seems like a decent choice (although I'd be wary of the spacing - many Google fonts are sadly deficient in that respect). You could also take Lubalin Graph and make the ascenders and descenders much longer (not too hard in this case). And that way you'd have a font nobody else has (instead of a free font that every Joe could use).</p>
      <p>hhp</p>
