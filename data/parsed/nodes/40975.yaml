      <p>There is a speciman chart of it at:<br>
      <a href="http://www.personal.rdg.ac.uk/~lts98gl/MATD/Pollen_specimen.pdf" title="http://www.personal.rdg.ac.uk/~lts98gl/MATD/Pollen_specimen.pdf">http://www.personal.rdg.ac.uk/~lts98gl/MATD/Pollen_specimen.pdf</a></p>
      <p>perhaps someone from that website can help you?</p>
      <p>But the last thing I can find was he was a student when he drew Pollen and he put this out in 2003<br>
      <a href="http://www.typeculture.com/academic_resource/articles_essays/" title="http://www.typeculture.com/academic_resource/articles_essays/">http://www.typeculture.com/academic_resource/articles_essays/</a></p>
      <p>Eduardo Berliner</p>
      <p>Brazilian ex-student at the University of Reading who designed Pollen (2003). - from<br>
      <a href="http://cg.scs.carleton.ca/~luc/brasilfonts.html" title="http://cg.scs.carleton.ca/~luc/brasilfonts.html">http://cg.scs.carleton.ca/~luc/brasilfonts.html</a></p>
      <p>Maybe the U of Reading could help?</p>
      <p>Funny, most of the inquiries from the search on Yahoo and Google seem to come from typophile.com</p>
      <p>Good luck - and if you find him, please share -</p>
