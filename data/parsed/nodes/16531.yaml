      <p>I agree with your first impulse. I'm not experienced with FF Kievit, but if the ligatures are too noticable, the addition of them could come off looking strange in places like faxes and letters.</p>
      <p>In general, I would say inclusion depends on the face and instance. For example, Kennerly "fi" ligature would be fine -- maybe even preferable to none, but "st" (overhand swoop connection) would be a bit strange.</p>
      <p>Hrm... if your client needs help with using specialized characters, maybe they should steer clear anyway.</p>
