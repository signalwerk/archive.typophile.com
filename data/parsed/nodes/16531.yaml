    <p>hey members and professionals,</p>
    <p>i have a general question regarding ligatures. i know ligatures from books, usually used when it's long text. for ME ligatures have an old-style look and feel. nice, but i wouldn't use it in business letters etc.</p>
    <p>we purchased the font kievit to use as corporate font.<br>
    now my client wanted to know how to use the ligature. i proposed not to use the ligatures, because of what i've already written.<br>
    my clients opinion is that it gives a sophisticated feeling.<br>
    we both asked ourself, is it just a matter of personal and subjective feeling? and why not use it everywhere? </p>
    <p>sorry i am still a design student...</p>
    <p>WHEN DO YOU USE ligautres? would you use them for a company which does marketing, design and communications?</p>
    <p>opinions greatly appreciated :-)</p>
    <p>a.</p>
