    html: |-
      <p>Considering that the standard <cite>f</cite> ligatures are meant to improve legibility, I see no problem with using them. In most good fonts, the reader will not even notice a standard ligature, which are meant to be quiet and unassuming. To me, <cite>not</cite> using the <cite>fi</cite> usually adds unnecessary weight and offsets the color balance of the page.</p>
      <p>Of course, I would stay away from the discretionary (ct, st, etc.) ligatures in almost every business setting.</p>
