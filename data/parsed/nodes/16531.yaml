      <p>With almost any font, the standard f-ligatures should always be used, if present and usable automatically in the software the client is using. If the f-ligatures are ungainly and stand out, that design is arguably defective and shouldn't have been chosen in the first place.</p>
      <p>Archaic ligatures such as ct and st are a different matter, of course, and have no place in typical business usage.</p>
