    <p>First it was an only Persian / Arabic color font. I have created it with Fontself and then 2 other styles with TransType. A lot of colors and a random-shaped font for all those Persian glyphs. This was the very first Persian / Arabic font created by Fontself too. I did a little trick to do that. Because at the moment (and yet) there is no option to add initial, medial, isolated and final glyphs in Fontself. It was a fun thing to do actually.</p>
    <p>So a few days ago, I have released the Latin versions too! Now I think it is the first Latin / Persian / Arabic color font :)<br>
    I hope you like the colors. Lots of colors they have. </p>
    <p>My Behance and Dribbble profiles: @si47ash<br>
    Websites: <a href="https://shahabsiavash.com">https://shahabsiavash.com</a> &amp; <a href="https://sfonts.ir">https://sfonts.ir</a><br>
    And if you want these fonts I've created a bundle of 8 color fonts here: <a href="https://sellfy.com/p/wVaO/">https://sellfy.com/p/wVaO/</a></p>
