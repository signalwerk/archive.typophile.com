  html: <p>I’ve only just noticed that almost nobody kerns their slash and backslash characters. And these aren’t being drawn with sidebearings that can balance them out, so they can get really hideous in conjunction with L, O, J, figures, and so on. Is there some technical reason for not kerning slashes? Or do they just not get kerned because kerning them is a PITA and users don’t care?</p>
