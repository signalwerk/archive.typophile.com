    html: |-
      <p>I think the answer to that is at least partly historical.</p>
      <p>If you go through an old type foundry specimen book, you will find that a standard font consisted of upper and lower case letters, with the standard punctuation marks and the ampersand. Even parentheses, and the dollar sign and the symbol for pounds sterling were considered “typographic accessories”. Later on, with Monotype and Linotype, a somewhat greater variety of characters would be made specific to each typeface, including (, ), $, and /.</p>
      <p>For a given typeface, there would often be available matching small capitals, accented letters, and fractions.</p>
      <p>But characters like +, =, *, @, # and % were sorts. There would be one or two generic versions sold by point size, not typeface.</p>
