    html: |-
      <p>William Berkson sez:</p>
      <p><em>Personally, I think kerning of the slashes, particularly the backslash, is a lower priority than than the quotes. Quotes, because of their position, greatly benefit from kerning, and and are used very often in text.</em></p>
      <p>I’m always surprised at the number of otherwise well-kerned fonts that don’t include the combinations of single-quote/double-quote. In English, at least, this combination occurs quite frequently, whenever there’s a quotation within a quotation (whichever way around you prefer to use them — singles first [UK] or doubles first [US]). I’ve gotten in the habit of globally inserting a thin space between them, so they don’t run together into what looks like three single quotes together; but whether that amount of space will work really depends on the typeface.</p>
