    html: |-
      <p>&gt;And these aren’t being drawn with sidebearings that can balance them out [...]</p>
      <p>There are a lot of multi-case characters that can’t possibly be spaced once for all glyphs. So we do and have kerned slashes and quotes since kern 1, (1989). I have noticed that quite a few founders only concern themselves with kerning the cases and have always assumed that they simply expect the user to kern the odd combination that gets in the way. </p>
      <p>We feel our fonts should just work seamlessly unless the user tracks a lot... or something horrid.</p>
      <p>Cheers!</p>
