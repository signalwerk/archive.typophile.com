    <p>We are very very proud to announce the release of “Feijoa”, the debut from the brilliant New Zealand designer Kris Sowersby. This subtly soft-edged serif face is built on classical proportions, but Kris’s design sensibility is clear in every detail. His is a unique new voice, and we’re very excited about this design and the other types Kris has in development. (You can expect more designs before the end of the year.)</p>
