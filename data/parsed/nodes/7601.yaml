    votes: null
    html: "<p>I've sold \"beta\" copies of some of my fonts, generally at the full [eventual/intended] price, without exclusivity, and with the promise that they will get the full version when it comes out. Also, the client and I \"use\" each other via feedback: the crits they give me are often applied, and if so of course end up in the final version they get. <br> <br>Just try to make sure of one thing: that copies of your beta won't end up floating around even before you release the real thing! That's a sure way to make zero dollars from it, not to mention create a version-control nightmare. So choose your \"beta-testers\" carefully. I've stuck to dealing with Typophiles when I do that: I know they care about type; and being co-members of a society keeps both parties straight. <br> <br>hhp</p>"
