  html: <p>I've recently developed a font that has attracted the attention of someone I know who's designing a new magazine. He's asked if he can buy a copy and use it for titles and headings in the magazine. <br> <br>It's not my understanding that he wants any kind of exclusivity for the magazine, and there's only one weight at the moment. <br> <br>Should I just sell him a copy of the font at it's normal price? Or should I ask for some sort of commercial/extortionate fee for it? I suspect the former but I'd like to be told the latter ;) <br> <br>Thanks in advance, <br> <br>Jordan</p>
