      <p>Though I can't comment on Bridge and Photoshop's speed, since I think most of the issues there are on Macs, I actually find the improvements to be terrifically useful. The Filter panel lets you sort instantaneously by just about any criteria you want, so no need to use Find very much anymore. The Metadata panel is much more accessible, looking like a camera's display. And the Slideshow finally lets you zoom in!</p>
      <p>That said, I've been using Bridge as an essential part of my workflow for a while, but Bridge 2.0 doesn't do much different, so if you're not using 1.0 now in some capacity, you might not be convinced. At the least, though, if you've been using the OS's built-in file browser for file management, Bridge, I've found, is a big step up in utility.</p>
