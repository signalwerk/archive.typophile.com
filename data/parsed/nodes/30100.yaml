    html: |-
      <p>I'm already using CS3 to wrap up my semester final, and performance on Mactel machines is great. Once activated, startup time is incredibly quick-hopefully this means no more going to get coffee while I wait for software to load like I've been doing since CS2 came out. Even better, Photoshop is <em>finally</em> using the graphics processor—or at least that's the rumor, which is supported by a GPU section under the performance perferences. Why should my background apps take a performance hit just because I'm running a filter than can be done by a pixel shader?</p>
      <p>Like Auric, I'm pretty much in love with smart filters. This alone will be a feature that pays for the entire CS3 suite by saving designers countless hours of time.</p>
      <p>The interface is interesting. Adobe clearly learned a lot from all they people they pissed off with the After Affects 7.0 interface, and they were a lot more careful with the new Photoshop. It's still a blatant knockoff of Final Cut, but not nearly so annoying.</p>
      <p>Bridge fans aren't as lucky as Photoshop fans. Bridge is even more of a pig than it used to be. Doing nothing with it soaks up somewhere in the neighborhood of 90 megs of RAM, and it tends to respond pretty sluggishly to the user. It's still built around organizing/navigating massive libraries of media with metadata and keywords, but does anyone really work that way? There's a nifty new loupe tool similar to the one in Aperature/Lightroom, but it only works in modes where you get a tiny preview window jammed into a corner, and not in the light table mode where it would actually be useful. Hopefully the CS4 release will see some serious adjustments made for the benefit of people with established workflows, as opposed to people who work how Adobe thinks we should.</p>
