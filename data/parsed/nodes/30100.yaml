    <p><a href="http://www.adobe.com/cfusion/entitlement/index.cfm?e=labs_photoshop" rel="nofollow">http://www.adobe.com/cfusion/entitlement/index.cfm?e=labs_photoshop</a></p>
    <p>This is a link to the Photoshop CS3 Beta Release download. It's about 350mbs and currently the downloads are pretty laggish. It'll give you a 30 day trial preview of the <strong>Standard version of Photoshop CS3</strong> which includes <strong>Adobe Bridge CS3</strong> and the new <strong>Adobe Device Central CS3</strong> also. <em>You'll have to register for an Adobe.com username and password if you do not currently have one.</em></p>
    <p>I've only been dabbling around with it for a little while, so I'm not qualified to give a detailed review. For more information check out: <a>http://www.photoshopuser.com/cs3/sk_features.html</a>  which gives a wonderful overview of what to expect in the next install of Photoshop CS3.</p>
    <p>I will say; the overall look is very clean, and has a nice, soft, customizable workspace system.</p>
    <p>For lucky few that have a strong connection and patience, I hope you enjoy the release.</p>
