      <p>Well, since this seems to now be the active PS CS3 post [mildly grouchy], I'll post my very brief impressions here.</p>
      <p>I haven't had a chance to dive into all of it yet, so I thought I'd look to see if the typography features in CS3 have changed from CS2. Unfortunately, it seems that with CS3 installed, I can't load CS2 anymore (not that I really mind), so I'll have to go by memory.</p>
      <p>A big change is the interface. Now, by default, the character and paragraph palettes are docked as icons next to the other palettes.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/CS3 Screencap1_3650.jpg"></div><p></p>
      <p>As for the character and paragraph palettes, they seem mostly the same.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/CS3 Screencap2_5841.jpg"></div><p></p>
      <p>The flyout menu for the character palette does say "Faux Bold" and "Faux Italic," which, if it wasn't there before, is an improvement. I don't remember either if the paragraph palette had Justification and Hyphenation options from its flyout, but those are there too, the same as in ID except for no hyphenation slider.</p>
      <p>One new feature that may come in typographically handy are Smart Filters, which is an upgrade to CS2's Smart Objects. For those not in the know, when PS creates a smart object from a layer, it creates an embedded file within the original file with the layer's contents. In CS2, you could transform, warp, and apply blending modes and layer styles to the smart object, which would re-render itself each time you applied one, meaning that you didn't lose any of the layer's information with each new effect.</p>
      <p>Now, filters can be applied to smart objects. This means that you can apply tons of filters and transformations without losing the editability of text, just like in Illustrator (albeit less seamlessly and without Illustrator-specific effects and filters). The first picture below shows the text "Hello" in Myriad Pro that I applied the Mosaic and Ripple filters to. The next picture shows the same layer after I opened the smart object layer and changed the text to "Bye" in Chaparral Pro. As you can see, the filters are reapplied to the new text, and they can even be separately masked and turned off by clicking on the eyes next to them in the layers palette.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/CS3 Screencap3_3769.jpg"></div><p></p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/CS3 Screencap4_6330.jpg"></div><p></p>
      <p>That's about it as far as typography is concerned, to my knowledge. There are a lot of other terrific new features, like the great upgrades to Bridge, the Clone Source palette, the Quick Select tool, and Refine Edges. One tiny change that I'm very happy with is that they added to the Image Size dialog next to Bicubic Smoother "(best for enlargement)" and for Bicubic Sharper, "(best for reduction)." Since I've never been able to remember which to use when, this is going to make my life much easier.</p>
