      <p>Here's a nice video that talks about the palette changes in CS3: <a href="http://www.youtube.com/watch?v=yO4Y6TwKBpQ" rel="nofollow">http://www.youtube.com/watch?v=yO4Y6TwKBpQ</a></p>
      <p>Some of you have noticed that clicking the palette icons brings out a fly out full view palette, this can be set to auto collapse thru the preferences menu. You can essentially have a single column of all the palettes on one side of the screen, organized as you like and reduced to Icon view to allow for maximum screen real estate for the project window (selecting Maximized Screen Mode further enforces this). A single column for your Tools palette on the other side. So, instead of shuffling palettes around,  your workspace is streamlined for maximum work conditions. Gotta love it.</p>
      <p>Here you can see with the Layer's palette flyout:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/workspace_3941.jpg"></div><p></p>
