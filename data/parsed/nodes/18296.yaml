    html: |-
      <p>If this helps, it’s not one of the 300 ClickArt Handritten (HW) fonts (unfortunately), like one of the recent posts. Part 11 of the Script Guide is the right one, as Lex suggested, but I’m afraid I can’t save you any more time with a quick answer.</p>
      <p>As I have said (too) many times before, fonts like this can be made for $9 or less with a sample of your own printing, so there are an almost unlimited number of them out there, including many that are probably not being distributed. Your best bet if you don’t see an exact match is to find something you think has the same ’feel’, and use that.  It can be very frustrating trying to match a hand-made font that may be one-of-a-kind.</p>
      <p>- Mike Yanega</p>
