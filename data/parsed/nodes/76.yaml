  html: <p><a href="http://www.typofonderie.com/Gazette/PTFExpo17_18mai2003.html" target="_blank">http://www.typofonderie.com/Gazette/PTFExpo17_18mai2003.html</a> <br> <br>For the first time, I have organised a small exhibit, and visit of my studio during the 17 and 18 May 2003. <br> <br>I have invited Albert Boton and Eric de Berranger to present their work. <br> <br>Everybody is welcome for a visit. The only problem is you need to go (not virtually) at Malakoff, France (5 mn from Paris). <br> <br>No web streaming available during the event!</p>
