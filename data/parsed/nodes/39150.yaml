    <p>Hello Everyone.</p>
    <p>I am webmaster of an association’s website that hosts scanned images of vintage books on calligraphy and penmanship: <a href="http://www.iampeth.com/books.htm" title="http://www.iampeth.com/books.htm">http://www.iampeth.com/books.htm</a> </p>
    <p>Today I was contacted by a typographer that would like to create a couple of fonts from some images on our website, that were originally published in a book: </p>
    <p><a href="http://www.iampeth.com/books/dennis_pen_art/dennis_pen_art_page27.html" title="http://www.iampeth.com/books/dennis_pen_art/dennis_pen_art_page27.html">http://www.iampeth.com/books/dennis_pen_art/dennis_pen_art_page27.html</a><br>
    <a href="http://www.iampeth.com/books/dennis_pen_art/dennis_pen_art_page28.html" title="http://www.iampeth.com/books/dennis_pen_art/dennis_pen_art_page28.html">http://www.iampeth.com/books/dennis_pen_art/dennis_pen_art_page28.html</a></p>
    <p>The artwork in the book was created by W.E. Dennis, and published in 1914 by the A.N. Palmer Company.</p>
    <p>If we agree to provide high-resolution scans of these pages to aid this typographer in his creation, could IAMPETH (the owner of the website) be liable at all?  Would we be violating any type of copyright laws?</p>
    <p>I would be very grateful for any advice you could offer.</p>
    <p>Trying to do the right thing,</p>
    <p>James Ivey<br>
    Dallas, Texas</p>
