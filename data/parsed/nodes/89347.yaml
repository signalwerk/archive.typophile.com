  html: <p>Some typophiles may be interested in having a <a href="http://www.ebay.com/itm/Adobe-font-package-1988-shrink-wrapped-original-type-package-typography-/160721486243?pt=LH_DefaultDomain_0&amp;hash=item256bbf41a3#ht_500wt_1413" rel="nofollow">circa 1987 Adobe font</a> for Mac, in the original packaging. I have nearly the entire original collection, but I only need a few for my early desktop graphics collection, and I ended up purchasing a large collection. I doubt that they'll attract much attention on Ebay, so I thought that I'd give you a heads-up.</p><div class="imageWrap"><img src="http://typophile.com/files/small-adobe-package_3433.jpg"></div><p></p>
