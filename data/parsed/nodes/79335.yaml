      <p>Judging by how the logo has changed through the years (examples: <a href="http://www.flickr.com/photos/milliemotts/2957921217/sizes/l/in/photostream/" title="http://www.flickr.com/photos/milliemotts/2957921217/sizes/l/in/photostream/">http://www.flickr.com/photos/milliemotts/2957921217/sizes/l/in/photostream/</a> <a href="http://www.flickr.com/photos/melsatcs/3232492495/sizes/o/in/photostream/" title="http://www.flickr.com/photos/melsatcs/3232492495/sizes/o/in/photostream/">http://www.flickr.com/photos/melsatcs/3232492495/sizes/o/in/photostream/</a>) maintaining the "mirrored 3" Es, it’s surely a custom job.<br>
      Mike’s suggestions are sound.<br>
      For some strange reason, it reminds me of the recently released Lorimer (<a href="http://www.typophile.com/node/78056" title="http://www.typophile.com/node/78056">http://www.typophile.com/node/78056</a>). A much more modern feeling typeface with a similar E is Panefresco (<a href="http://www.fontsquirrel.com/fonts/panefresco" title="http://www.fontsquirrel.com/fonts/panefresco">http://www.fontsquirrel.com/fonts/panefresco</a>).</p>
