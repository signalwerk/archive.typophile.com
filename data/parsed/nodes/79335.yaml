      <p>Hey thanks guys... Definitely think Gill Sans Condensed fits the bill for most similar, broadly speaking. Backwards 3s &amp;/or bisected 8s for the Es. </p>
      <p>Riccardo: I think you are likely right that this is custom, the client i am helping just wants something that is similar rather than exact repro, so all your suggestions have been super useful. </p>
      <p>Thanks again!<br>
      Alex</p>
