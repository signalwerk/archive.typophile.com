      <p>I believe this is custom. It's Art Deco-ish, but I cannot find anything that is even very close. If I was trying to reproduce it I think I'd start with <a href="http://new.myfonts.com/fonts/bitstream/humanist-521/" rel="nofollow">Gill Sans Condensed (Humanist 521 is Bitstream version)</a>. I'd tweak the R proportions, then use the 8 to make the E, and borrow the S from a font like <a href="http://new.myfonts.com/fonts/urw/casablanca/" rel="nofollow">Casablanca Condensed</a>.</p>
      <p>- Mike Yanega</p>
