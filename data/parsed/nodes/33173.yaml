    html: |-
      <p>Image texts are really annoying on a website, especially when you want to copy some informations so what you can do is to use css code which says that if someone hasn't the first typography it swaps to the following one, for exemple : </p>
      <p>{font-family: Helvetica, Arial, sans-serif}</p>
      <p>This way users that has a mac and those who bought Helvetica can see it and the others will see Arial.</p>
