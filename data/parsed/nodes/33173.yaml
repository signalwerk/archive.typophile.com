  html: |-
    <p>I'm using Clarendon at 64 points and need a sans that reads well and looks good at 20, 14, and 10pts on page that has huge Clarendon. This is for a photographer's website, not a print piece, by the way.</p>
    <p>EDIT<br>
    I don't normally use images as text when I make websites, this time I'm making an image heavy rather than a copy heavy site and feel the look is more important, so I'll be using image text.</p>
