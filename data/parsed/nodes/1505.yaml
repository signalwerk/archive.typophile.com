    html: "<p>Fascinating project! Your teacher is good. <br>And Times is a great candidate: it's \"constructed\" but has good readability, plus it has all those funky IPA characters designed for it which you might look at. <br> <br>I see some problems with you proposed new character, but I think you need to back up and look deeper at the problem before going too far towards a solution. <br> <br>I would start with the \"Intro to Typeface Design 110\" under Courses on Typophile itself. It's a great \"formal\" aesthetic approach in understanding not just shapes, but their underlying structures. <br> <br>But there's a world of richness beyond that exercise. There's the issue of spacing, where your new character is problematic (it may hit a subsequent left-hand descender*). There's the issue of what the/an alphabet <i>needs</i>: does it need a character that fits in more (like the \"n\") or that diverges more (like the binocular \"g\")? And does it need an x-height, ascending, or descending (or both!) character? <br> <br>* It might help to decide if the new letter is a consonant or a vowel, or if it's just phonemically superflous (like the \"c\", \"q\" and \"x\" are already). <br> <br>I would love to make concrete recommendations, but since this is about the process of learning, it's better if you try to answer questions like the above - the answers will draw out the solution from within you. <br> <br>hhp <br></p>"
