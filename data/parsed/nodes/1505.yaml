    html: "<p>Randy, since email delivery is down (not just for me, I assume?) I was working my way down manually, and I saw Drew's thread here first, <i>then</i> the other one with your post!  :-) <br> <br>Since I think the Design section is a better place for this than Typography/Composition, just to streamline things here's Randy's post from the other thread: <br> <br>\" <br>Hi Drew,  <br> <br>Let me be honest. I think the length of your decender is the  <br>least of your problems! Sorry...  <br> <br>As a start at curing your letter of it's maladies, let me point  <br>you to Jonathan Hoefler's course at typeophile that looks at  <br>the very assignment you've got: Type Design 110  <br> <br>Honestly, first check out what he's saying. What are the  <br>characteristics of times roman? Given that, is the basic  <br>stucture of the \"letter\" consistent with Times? How could it  <br>be more Times-like in structure? Where is there evidence of  <br>a pen? What angle is it held at? As a result, where are the  <br>thick parts? Where are the thin parts? Where are the serifs?  <br>Where does times roman break it's own rules?  <br> <br>Your glyph needs all these questions to be asked. Take a  <br>look, and if you're still at a loss, I'll give you more specific,  <br>practical pointers.  <br> <br>Looking forward to seeing the fruit of your studies!  <br>\" <br> <br>BTW, I agree with what you said, except I would [predictably] caution against the \"pen\" approach. You'll note for example that Drew's glyph has one thick horizontal and one thin: depending on the \"structural context\" of the rest of the glyph, that might actually work best, irrespective of chirography. <br> <br>hhp <br></p>"
