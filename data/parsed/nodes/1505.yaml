    html: <p>&gt; the counter space.. too big? small? <br> <br>&gt; I guess it should be as thin as the serif in the inital glyph. <br> <br>Before you worry about the finish of the glyph, you have to figure out the structure of the character. Before you figure out the structure of the character, you have to figure out the essence of the letter. For one thing, in the Latin alphabet letters have two cases, and they're related. <br> <br>A letter is not a shape, it is an <i>idea</i>. <br>The idea has to be solid before you can build a structure of it, and then build a shape on the structure. <br> <br>-- <br> <br>You're probably enthusiastic about the project in general, and what you've done so far in particular, and enthusiasm is extremely important! But the end-result quality of the glyph depends most of all on developing a solid alphabetic foundation. <br> <br>Don't polish a boat when you need to build a car.  :-) <br> <br>-- <br> <br>And what Randy said. <br> <br>hhp <br></p>
