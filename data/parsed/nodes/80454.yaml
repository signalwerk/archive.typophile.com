  - id: 457612
    user: 3135
    date: 2011-03-29T06:49:00
    date_raw: 29 Mar 2011 — 6:49am
    votes: null
    html: <p>Walk a mile in your prospective employer's shoes.  If you were hiring someone for the kind of position you seek, what would you like to see or be impressed by? One of the greatest skills needed to do design work is the ability to "see" the clients problem. This is something you will never find in a pull-down menu. Role-play out how an interview might go.  Read everything you can find out about the company. Do your homework. What would impress me is if someone could demonstrate their problem-solving skills.  You are hired to solve problems, not just to flash your glitz.</p>
    html_clean: <p>Walk a mile in your prospective employer's shoes.  If you were hiring someone for the kind of position you seek, what would you like to see or be impressed by? One of the greatest skills needed to do design work is the ability to "see" the clients problem. This is something you will never find in a pull-down menu. Role-play out how an interview might go.  Read everything you can find out about the company. Do your homework. What would impress me is if someone could demonstrate their problem-solving skills.  You are hired to solve problems, not just to flash your glitz.</p>
