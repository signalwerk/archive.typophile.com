      <p>&gt;What about "no phone calls please" or "Do not contact us by telephone". Really, after a week of not hearing what should one do? Just an email? Is that all I can do?</p>
      <p>Hm, in my experience these things always take longer than anyone expects. Employers in small businesses especially don't realise what an important decision recruiting someone is, until they're actually trying to decide. So I'd wait another few days and if there's still no news then my approach would be a quick, polite call.</p>
