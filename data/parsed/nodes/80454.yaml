    html: |-
      <p>Joe, A suit for a junior position? I actually don't think so. I had this conversation with a lot of art/creative director friends and we all agreed that a suit sets a weird message. Unless you are fashion driven and you wear suits (and good ones) most of the time, then it is OK. When I have interviewed junior designers, I want to see who they really are, what's their style and what stuff they like. Be clean and a little bit more "dressed" than normal but be yourself.</p>
      <p>My advice is: if you don't have enough works to show  on your portfolio or you're not happy with the few projects from school or work, just make your own projects and be serious about it. Research a lot about the company you're having the interview and if you know who's interviewing you, research more...</p>
      <p>And yeah, bring a positive attitude and ask for feedback.</p>
    html_clean: |-
