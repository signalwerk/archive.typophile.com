      <p>Regarding clothing, you probably want to dress at the same level of formality as other folks in the company.  Most companies have a relaxed dress code these days, but some are more formal, especially if they're meeting with a client. </p>
      <p>If the interview is important to you, swing by the company at a time when people are coming or going (lunchtime, for instance) and observe how folks are dressed.</p>
