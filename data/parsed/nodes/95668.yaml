  html: |-
    <p>To my mind nothing is more characteristic of the Fifties than the breezy hand lettered headlines you used to get in the advertisements of the period – “We bought an Edsel” etc.  I suppose in those days the availability of fonts (the original hot metal variety) must have been severely limited by today’s standards, and lot of those headlines simply had to be hand-lettered by an in-house studio artist.</p>
    <p>Attached is my attempt to recapture the spontaneous joy of those Fifties faces.  It is a font.  It’s called Bebopalula.  And if you’re interested it’s available from studio-k at myfonts.com  But whaddya think – do you dig it, Daddy-O?<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/Fifties Style_4568.png"></div><p></p>
