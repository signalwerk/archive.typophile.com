    votes: null
    html: '<p>Sorry, but I do not think that the 13th Century English Chancery Hand from Germany is similar to the hand in the ‘Annals of Quedlinburg’ as shown here. Shure, both can be described as minuscule, but minuscule includes a fairly wide range of styles which is known as ‘lower case’ in typography. The example shown on <a class="freelinking external" href="http://www.medievalwriting.50megs.com" rel="nofollow">mediavalwriting</a> has a roman / an interrupted construction (two-story a and g, no upstroke in the n). The Annals of Quedlinburg are written with a cursive / running construction (one story a and g, upstroke in n). Also it has to be noted that on Wikipedia the following is stated: ‘The original document has disappeared, surviving only as a 16th-century copy held in Dresden’. This means that the text is based on / copied from annals probably written between 1008 and 1030, but this does not tell us anything on how the script in the original document may have looked like. When the description of the document as shown on Wikipedia is accurate enough, this could be the Dresden version from the 16th century. The script is a humanist cursive as we know it from the italian writing masters such as Arrighi and Palatino. <a class="freelinking external" href="http://en.wikipedia.org/wiki/Ludovico_Vicentino_degli_Arrighi" rel="nofollow">Arrighi</a> published his writing method in his book Il Operina around 1524. A facsimile which includes a translated version can be found at the website of Gunnlaugur SE Briem: <a href="http://66.147.242.192/~operinan/8/index.html" title="http://66.147.242.192/~operinan/8/index.html">http://66.147.242.192/~operinan/8/index.html</a></p>'
