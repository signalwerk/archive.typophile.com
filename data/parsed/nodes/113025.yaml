      <p>For a proper answer you would do best to consult a Medievalist.<br>
      This type of script is sometimes called miniscule.<br>
      I found an interesting page with samples including some that have similarities. For example a 13th Century English Chancery Hand from Germany <a href="http://medievalwriting.50megs.com/scripts/examples/c13chancery.htm" title="http://medievalwriting.50megs.com/scripts/examples/c13chancery.htm">http://medievalwriting.50megs.com/scripts/examples/c13chancery.htm</a> and other minisucles and cursives etc. <a href="http://medievalwriting.50megs.com/scripts/scrindex.htm" title="http://medievalwriting.50megs.com/scripts/scrindex.htm">http://medievalwriting.50megs.com/scripts/scrindex.htm</a><br>
      Don</p>
