    <h2><a href="/web/20080905051749/http://typophile.com/node/47967" title="Welcome to the Typophile Hebrew Typography &amp; Type Design Group">Welcome to the Typophile Hebrew Typography &amp; Type Design Group</a></h2>   <p>This forum is aimed at discussing both Biblical &amp; Modern Hebrew. So, roll up your sleeves and be prepared to talk, share, and ask anything  and everything about  type design, typography, lettering, cantillation, grammar, culture &amp; history.  Please respect other  members’ opinions even if you don’t agree with them.  Don’t hijack other threads,  there’s room for  everyone so  start your own thread. And please do not post links, works or fonts that smell of  plagiarism.</p>
    <p></p><div class="imageWrap"><img src="/web/20080905051749im_/http://typophile.com/files/HebrewSample_4955.gif"></div><p></p>
    <p>We hope you will stay and participate. Please observe courtesy at all times. This is a community, so please help make it a pleasant and welcoming environment. Offensive or insulting comments will be brought to the attention of the Typophile moderators.</p>
