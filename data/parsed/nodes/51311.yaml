    <p>Hi friends and colleagues</p>
    <p>I’d love to design a lot of new picts for my 'Siruca Pictograms' but I can’t find the time, so I decided to distribute it as Open Source.<br>
    Could you help me to grow the number of picts?</p>
    <p><a href="http://www.fsd.it/sirucapictograms" title="http://www.fsd.it/sirucapictograms">http://www.fsd.it/sirucapictograms</a></p>
    <p>Thanks in advance!<br>
    Fabrizio</p>
