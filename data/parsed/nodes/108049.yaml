      <p>Mike's reference to Douglas F. Olena's Elegant led me to track down its availability at Linotype<br>
      Elegant Open Face<br><a href="http://www.linotype.com/176897/elegantopenface-font.html">http://www.linotype.com/176897/elegantopenface-font.html</a><br>
      Elegant Inline<br><a href="http://www.linotype.com/176894/ElegantInline-product.html">http://www.linotype.com/176894/ElegantInline-product.html</a><br>
      Serifs that are mirco -- smaller than mini!-- with one of the lowest crossbars on A that I have seen, and including a fairly conventional lower case.<br>
      Don</p>
