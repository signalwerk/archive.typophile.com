      <p>Will check some more for a low crossbar on A serif with a lower case.<br>
      Perhaps another typophile could make a suggestion.<br>
      This design is rare for serifed fonts but is found in some art deco sans. These tend to have a lot of exaggeration in letter shapes. For example Party At Gatsbys by T.W. Jeffery:<br><img src="/sites/default/files/old-images/PartyAtGatsbys_5928.jpg"><br><a href="http://www.fontspace.com/tysmagic/party-at-gatsbys">http://www.fontspace.com/tysmagic/party-at-gatsbys</a><br>
      Don</p>
