    html: |-
      <p>Ana - not knowing what, besides the low crossbar, you are after, I'll offer five options ...</p>
      <p>The first is <a href="http://old.myfonts.com/fonts/tilde/windsor/" target="_blank">Windsor Light</a> (or Light Condensed).</p>
      <p>The next two are based on the early twentieth century lettering of Elizabeth Colwell. There is the fanciful <a href="http://old.myfonts.com/fonts/nicksfonts/mckenna-handletter-nf/" target="_blank">McKenna Handletter</a> and even quirkier <a href="http://moorstation.org/typoasis/designers/lab/lab_colwell.htm" target="_blank">Colwell</a>.</p>
      <p>Next there is <a href="http://old.myfonts.com/fonts/mti/handle-old-style/" target="_blank">Handle Old Style</a>.</p>
      <p>And last, with its mini-serifs, is Doug Olena's <a href="http://www.fontsfordesign.com/preview.html" target="_blank">Elegant</a>.</p>
    html_clean: |-
