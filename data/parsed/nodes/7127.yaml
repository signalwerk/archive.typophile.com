  html: "<p>Hi everyone, <br> <br>Seeing as I only know crap ones, I'm looking for a freelance (or inexpensive) good webdesigner to build me a serviced apartments website. Timescale is sometime over the next 3 months, most probably. <br>There will also be a bit of logo design work. <br>It will need a searchable database function which can be updated by me from my own computer. If it can be SEO'd by the same guy (or girl) then that would be cool too. <br>I don't need hosting for the site. <br>For an example of what a serviced apartment website might look like, copy/ paste this:    central-london-apartments.com <br> <br>I'm not asking anyone to copy that site, but I would like something which looks funkier. It needs to look professional and not like something from 1998. <br>I posted on this board a while back and was impressed by the professional responses hence I returned. <br>Oh yes, I'm aware that this is a type discussion board but you guys will know a good designer or two, I'm sure. <br> <br>Either post the contacts here or email to <a href=\"mailto:funkmachine@gmail.com\">funkmachine@gmail.com</a> <br> <br>Cheers, <br> <br>Michael</p>"
