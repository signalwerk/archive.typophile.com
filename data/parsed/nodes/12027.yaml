    <p>Small caps have many uses, but are primarily used for initials in body copy, such as <span class="caps">NASA</span>, <span class="caps">NATO</span> or the <span class="caps">UN</span>. The aim of this use is to diminish the visual awkwardness of capital letters hindering the flow of a paragraph. (<a href="/node/13897" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Text Figures</a> are also used for better flow in body text versus <a href="/node/add/wiki?edit%5Btitle%5D=Lining_Figures" title="Create node &quot;Lining_Figures&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">lining figures</a>.)</p>
    <p>The <a href="/node/12420" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">OpenType</a> feature registered for small capitals is <code><a href="/node/add/wiki?edit%5Btitle%5D=smcp" title="Create node &quot;smcp&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">smcp</a></code>, there is also a feature registered for <a href="/node/add/wiki?edit%5Btitle%5D=petite%20caps" title="Create node &quot;petite caps&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">petite caps</a> (<code><a href="/node/add/wiki?edit%5Btitle%5D=pcap" title="Create node &quot;pcap&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">pcap</a></code>).</p>
    <p>From <a href="/node/12442" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Nick Shinn</a>:</p>
    <p>Here are some differing strategies for “Caps with Small Caps” titling.<br>
    I don’t think any of them are ideal for this typeface.<br>
    In the designated small cap font the small cap is, as I said earlier, too wide.<br>
    You get better matched letter proportions by “faking” the display small cap with a downsized “normal” cap, but the stem widths don’t quite match.<br>
    My preference for the best match is the Regular with SemiBold, although it might be a bit heavy&nbsp;overall.</p>
    <p><img src="/sites/default/files/old-images/Nick SMCP Illus1 copy_5644.jpg"></p>
    <p>To demonstrate that the situation is not a fault of any particular typefaces, but rather the outcome of the general habit of creating small caps primarily in relation to lower case, I’ve created an alternate small cap for Goudy, matched to the&nbsp;capital.</p>
    <p><img src="/sites/default/files/old-images/Nick SMCP Illus2_5415.jpg"></p>
    <p>There may be other genres of type where the caps and small caps are better matched, and some typefaces where the small cap is matched to the cap rather than the lower case, but it is my opinion that in general, old style faces are configured like Minion and Goudy, making the use of caps/small caps in titling problematic, and requiring quite discriminating&nbsp;typography.</p>
    <p><strong>See Also:</strong><br><a href="/node/13776" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Mid-Capitals</a>,<a href="/node/14255" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">SmallCaps How-To</a>.</p>
