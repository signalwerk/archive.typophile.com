    <p>In the old days of OS 9 one could easily double click a font suitcase containing the whole family and delete some of the bitmaps - say the italic 12 and 24 points.<br>
    Today with OSX, once you double click the suitcase it automatically launches FontBook.</p>
    <p>And within FontBook - there is nothing I can do if I want to get rid of some bitmap files.</p>
    <p>Any idea?</p>
