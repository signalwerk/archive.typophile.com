    html: <p>Three-digit area codes with a 0 or 1 in the middle are a feature of the zone of the world with 1 as its country code. (Now abandoned because of the need for more numbers.) This includes the United States, Canada, and the Carribean. Prior to Castro, Cuba was in this area as well, under the 809 area code, which originally covered all the Carribean before being confined to the Dominican Republic.</p>
