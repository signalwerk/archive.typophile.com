    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/17745" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Designers</a>&nbsp;: Giambattista&nbsp;Bodoni</strong></p>
    <p><a href="http://www.mb-museobodoniano.it/">Museo&nbsp;Bodoniano</a></p>
    <p><em>List of the main bodonian cuts</em>, by A. Segalini <span class="amp">&amp;</span> <span class="caps">F.M.</span> Rossi&nbsp;:</p>
    <ul><li><span class="caps">ATF</span> Bodoni (1911, Morris Fuller Benton) [Amsterdam, Stempel, Deberny <span class="amp">&amp;</span> Peignot, Monotype, Haas, Intertype, Typoart,&nbsp;Linotype]</li>
    <li>Nebiolo Torino (1913, Alessandro&nbsp;Butti)</li>
    <li>Ludlow Bodoni Modern (1836, Robert Hunter Middleton) [Bodoni&nbsp;Campanile]</li>
    <li>Bauer Bodoni (1926, Henrich Jost, Louis&nbsp;Höll)</li>
    <li>Tippecanoe (1942, William Addison&nbsp;Dwiggins)</li>
    <li>Novarese’s bodonians (1961-1989, Aldo&nbsp;Novarese)</li>
    <li>Letraset Carousel (1966, Gary&nbsp;Gillot)</li>
    <li>Berthold Bodoni Antiqua (1970, Günther Gerhard Lange, Karl&nbsp;Gerstner)</li>
    <li>Berthold Bodoni Old Face (1983, Günther Gerhard&nbsp;Lange)</li>
    <li><span class="caps">WTC</span> Our Bodoni (1989, Tom&nbsp;Carnese)</li>
    <li><span class="caps">PDM</span> Bach Bodoni (1989, Piero De&nbsp;Macchi)</li>
    <li><span class="caps">FF</span> Bodoni Classic (1994, Gert&nbsp;Weischer)</li>
    <li><span class="caps">ITC</span> Bodoni 72,12,6 (1994, Sumner Stone, Holly Goldsmith,&nbsp;&amp;c.)</li>
    <li>Emigre Filosofia (1996, Zuzana&nbsp;Licko)</li>
    <li>Linotype Gianotten (1999, Antonio&nbsp;Pace)</li>
    <li>Preuß Battista (2005, Ingo&nbsp;Preuß)</li>
    </ul><p>At TypeCulture, find a concise biography of one of the most prolific type makers and printers of the 18th and early 19th centuries. Here is Bodoni’s life in brief, year by year, in which his reputation as the “Printer of Kings and King of Printers” is&nbsp;illuminated.</p>
    <p><em>Format</em>&nbsp;: <a href="http://www.typeculture.com/academic_resource/articles_essays/pdfs/tc_article_42.pdf">.pdf</a> 109 <span class="caps">KB</span></p>
    <p>© 2006<br><em>Written by</em> Alessandro Segalini, <em>edited by</em> Mark&nbsp;Jamra.</p>
    <p><img src="/sites/default/files/old-images/majuscole_3671.gif"></p>
