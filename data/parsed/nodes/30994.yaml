    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Designers" class="freelinking" rel="nofollow">Designers</a> : Giambattista Bodoni</strong></p>
    <p><a href="http://www.mb-museobodoniano.it/" rel="nofollow">Museo Bodoniano</a></p>
    <p><em>List of the main bodonian cuts</em>, by A. Segalini &amp; F.M. Rossi :</p>
    <ul>
    <li>ATF Bodoni (1911, Morris Fuller Benton) [Amsterdam, Stempel, Deberny &amp; Peignot, Monotype, Haas, Intertype, Typoart, Linotype]</li>
    <li>Nebiolo Torino (1913, Alessandro Butti)</li>
    <li>Ludlow Bodoni Modern (1836, Robert Hunter Middleton) [Bodoni Campanile]</li>
    <li>Bauer Bodoni (1926, Henrich Jost, Louis Höll)</li>
    <li>Tippecanoe (1942, William Addison Dwiggins)</li>
    <li>Novarese’s bodonians (1961-1989, Aldo Novarese)</li>
    <li>Letraset Carousel (1966, Gary Gillot)</li>
    <li>Berthold Bodoni Antiqua (1970, Günther Gerhard Lange, Karl Gerstner)</li>
    <li>Berthold Bodoni Old Face (1983, Günther Gerhard Lange)</li>
    <li>WTC Our Bodoni (1989, Tom Carnese)</li>
    <li>PDM Bach Bodoni (1989, Piero De Macchi)</li>
    <li>FF Bodoni Classic (1994, Gert Weischer)</li>
    <li>ITC Bodoni 72,12,6 (1994, Sumner Stone, Holly Goldsmith, &amp;c.)</li>
    <li>Emigre Filosofia (1996, Zuzana Licko)</li>
    <li>Linotype Gianotten (1999, Antonio Pace)</li>
    <li>Preuß Battista (2005, Ingo Preuß)</li>
    </ul>
    <p>At TypeCulture, find a concise biography of one of the most prolific type makers and printers of the 18th and early 19th centuries. Here is Bodoni’s life in brief, year by year, in which his reputation as the “Printer of Kings and King of Printers” is illuminated.</p>
    <p><em>Format</em> : <a href="http://www.typeculture.com/academic_resource/articles_essays/pdfs/tc_article_42.pdf" rel="nofollow">.pdf</a> 109 KB</p>
