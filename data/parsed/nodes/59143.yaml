      <p>Hot off the presses, we're pleased to announce an Exclusive NEW release from Crystal Kluge of the Tart Workshop, Nelly Script and Nelly Script Flourish. . .</p>
      <p>Nelly is a beautiful yet sensible romantic, clearly hand drawn but easy to read.  She’s a bit formal but not stuffy and simply adores a lovely party.  A perfect choice for invitations and announcements, especially those of the romantic nature. Nelly Script comes complete with a handful of alternate lowercase forms in OpenType format.</p>
      <p>Sometimes you need to gild the lily, add a little drama, bling. With that in mind we’ve created a collection of flourishes &amp; embellished letters to enhance Nelly Script’s romantic appeal.  Nelly Script Flourish is the jewelry to a beautifully appointed lady, the icing to the wedding cake, the VaVoom! Nelly Script Flourish comes complete with a large variety of alternate upper and lowercase forms in OpenType format.</p>
      <p>You can see both of these amazing new scripts at: <a href="http://www.fontbros.com/tartworkshop_new.php" title="http://www.fontbros.com/tartworkshop_new.php">http://www.fontbros.com/tartworkshop_new.php</a></p>
