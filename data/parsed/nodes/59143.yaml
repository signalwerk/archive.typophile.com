    <p>This month is exceptionally exciting for us because Font Bros is proud to release no less than ten BRAND NEW exclusive fonts not available any where else! From scripts to fun novelty faces to instant classics and fresh monograms, you're gonna LOVE these new fonts!</p>
    <p>Filmotype - Filmotype is thrilled to re-release Filmotype Modern! This bouncy sans serif was originally introduced in the early 1950s and was redigitized by Device Fonts own Rian Hughes! Check it out at: <a href="http://www.fontbros.com/cgi-bin/commerce.cgi?preadd=action&amp;key=FILM-MODE" title="http://www.fontbros.com/cgi-bin/commerce.cgi?preadd=action&amp;key=FILM-MODE">http://www.fontbros.com/cgi-bin/commerce.cgi?preadd=action&amp;key=FILM-MODE</a></p>
    <p>Fontalicious - Ben Balvanz Fontalicious Font Foundry brings the typographical hotness with THREE amazing new releases! You're gonna love the tricked out OpenType stylings of Wonderkid as well as the playful Rascal and Bike! Check 'em out at: <a href="http://www.fontbros.com/fontalicious_new.php" title="http://www.fontbros.com/fontalicious_new.php">http://www.fontbros.com/fontalicious_new.php</a></p>
    <p>Harold's Fonts - Monograms anyone? Yes, your wishes have been answered! It's Harold's expanded College Monogram family Collo Monograms for 3-letter acedemic monogram styles! Check 'em out at: <a href="http://www.fontbros.com/cgi-bin/commerce.cgi?preadd=action&amp;key=HAFO-COLM" title="http://www.fontbros.com/cgi-bin/commerce.cgi?preadd=action&amp;key=HAFO-COLM">http://www.fontbros.com/cgi-bin/commerce.cgi?preadd=action&amp;key=HAFO-COLM</a></p>
    <p>Sideshow - That crazy Squid has been at it again! Meet two new instant classics you're gonna flip over! Beachcomber, a realistic driftwood plank font and Kitchenbats, a pantry full of dingbatty fun! Check 'em out at: <a href="http://www.fontbros.com/sideshow_new.php" title="http://www.fontbros.com/sideshow_new.php">http://www.fontbros.com/sideshow_new.php</a></p>
