      <p>A nice short read:</p>
      <p>Tinker, M. &amp; Patterson, D., (1949). Speed of reading nine point type in relation<br>
      to line width and leading. <em>Journal of Applied Psychology, 33(1)</em>, 81-82. </p>
      <p>"Examination of Table 1 shows that the region of optimal legibility<br>
      ranges between a 14 pica line width with 1 point leading or more to a line<br>
      width of about 30 picas with 1 point leading or more."</p>
      <p>There are many other scientific studies and traditional claims that are incongruent with one another. In my opinion, further research is required to draw ecologically valid conclusions.</p>
