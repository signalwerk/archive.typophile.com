      <p><em>It is a shared opinion in book typography that a generous leading helps the reading process; </em></p>
      <p>Yes, this is the present myth.<br>
      But not too long ago, type specimens showed text type both set solid, and with extra leading.<br>
      The 20% leading default is a norm established in the early days of DTP, along with fake small caps, and faux bold and italic, and deserves similar opprobrium. It is a shameful waste of paper.</p>
