    <p>I am going to suggest an argument which I have been struggling about recently. It is a shared opinion in book typography that a generous leading helps the reading process; and a 120% ratio (leading percentage referred to type size) is a typesetting norm that is usually given as correct for setting pages - obviuosly also depending on the typeface's specific design (ascenders and descenders lenghts, for example). But I am more and more persuaded that a *tighter* leading not only generates a better colour and texture - a page that *looks* better - but also helps reading as well, contributing on visually connecting one line to another. I have a set an example to clarify this, with the left page set in Adobe Garamond 11/13 (the standard 120 ratio) and the right page set at 11/12. I am curious to know any other opinion on the matter.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/texture_6687.jpg"></div><p></p>
