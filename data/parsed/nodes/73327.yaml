      <p>Few loose observations:</p>
      <p>Left page's leading seems to be intended for more "humanistic" content then the other. (Anyway: it's like Rorschach's Test, isn't it?).</p>
      <p>But, sincerelly, I don't think the right page has better colour and texture.</p>
      <p>Both pages are in English, which gives an even colour. My language (Polish), containing high percentage of diagonals: a, k, s, w, y, z, would create a messy surface with such tight leading.</p>
      <p>Once I mechanically increased contrast of a tested typeface (of a medial contrast) which seemed to need some larger leading. The vivisection returned distinct boumas which resulted in faster reading and allowed to reduce the leading. So I suppose, also the inner wordspace is an important factor.</p>
      <p>I also think (as a habitual reader), that the even colour is not always the best and desirable solution.<br>
      [Footnotes of complicated content (so using small caps, italics and numbers alltogether) set in the best typographic manner, are extremely heavy to read].<br>
      In the plain text, elements like en-dash help during scanning a page or searching a certain place in a book. But they are visible only at larger leading.<br>
      Polish typesetting practically abandoned the em-dash in recent years, what results in better colour, but dialogues in fiction seem to be spoken with the machinegun speed, since there is no pause in the air; they melt together. So I see a paradox here.</p>
