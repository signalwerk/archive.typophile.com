      <p>Well, there is a lot of dogma about. The other argument for generous leading is that it minimizes the variance in word spacing you'll get with justified csettings.</p>
      <p>I think what is really going on is that *readability* is a matter of type size, measure, leading, and word spacing. Change one, and the optimum value of the others may change. </p>
      <p>BTW, designers often give different answers than readers -- yes, I've done some limited testing, using editors as readers, versus designers.</p>
      <p>Finally, all these are constrained by the trim. Times past, paper came is certain sheet sizes, and people wanted to be efficient; not pay for a larger sheet &amp; then trim away what wasn't wanted.</p>
      <p>Anyway, sheet size affects margins, which in turn affect measure, which affects leading, type size, etc.</p>
      <p>For a generality though, yes, I think you are right, current leading practices are a designer affectation from looking at shapes rather than words.</p>
