      <p>There is a very interesting setting of dark and light typefaces with different leadings in Mitchel and Wightman's Book Typography. (p. 185-6) It shows that with the dark Quadraat, it benefits from generous leading, whereas the light Spectrum benefits from tighter leading. They conclude, </p>
      <p>"If you decide to use a dark face it wll benefit from increased leading to prevent the overall colour from becoming too black. Equally, if you decide to use a very light face, reducing the leading will prevent the text from becoming a pale grey."</p>
      <p>Overall lightness and darkness is not the only factor. The impact of leading also varies with the length of the extenders, and also how the weight is distributed in the face. </p>
      <p>One of the things I was fascinated with in Linotype Caslon Old Face (a metal face only) is that it looks dark, but could be set solid or almost solid and still look good. I tried to achieve this in my revival Williams Caslon Text, also. That is, I tried to "square the circle" by looking both dark and open, so that it could take less leading yet not look too light. </p>
      <p>As the influences are so complex, the only thing to do is to try out different typefaces with different measures, sizes and leading, and see what looks inviting and readable to you—as well as considering what the economic demands are.  </p>
      <p>Personally, I like the more lattice-like look of the page with less leading than is fashionable now, but it has to be the right typeface design that can take it. Adobe Garamond, with its long extenders, doesn't need as much leading as, eg., Quadraat, I would think, though I haven't actually tested them against each other.</p>
