      <p>Good point. I think it’s no good for continuous reading if the leading is too wide when text is set in a typeface with low x-height and long descenders and ascenders. One sees this very often in publishing where omnipresent Garamond is used. This causes more pages and the book thicker, which may be the reason behind it.<br>
      If the lines are falling apart something is wrong. But this is to be judged by a good typographer: a type with the classical proportions of a Renaissance Antiqua needs less leading, others with larger x-heights and shorter descenders and ascenders a bit more.</p>
