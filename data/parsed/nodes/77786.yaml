    html: |-
      <p>I highly recommend Designing Type by Karen Cheng. It may be a little difficult to find but it has been invaluable to me.</p>
      <p>This is a good place to start in the meantime:<br>
      <a href="http://www.typeworkshop.com/index.php?id1=type-basics" title="http://www.typeworkshop.com/index.php?id1=type-basics">http://www.typeworkshop.com/index.php?id1=type-basics</a></p>
      <p>Another thing I've found to be very helpful if you're having trouble drawing a particular glyph is to open up fonts that you think are successful and analyze the letters on a macro level. There are a lot of subtle touches that add up to a character working that you don't notice from a distance.</p>
      <p>Beyond that, the search feature of this forum works very well if you have a specific question.</p>
      <p>I also recommend a sketchbook with grid paper or a dot grid (at least to start). It'll help you keep your character widths under control until you get a better feel for it.</p>
