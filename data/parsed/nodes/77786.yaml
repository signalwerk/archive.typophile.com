      <p>Actually, it appears that it's not difficult to find anymore. It's in stock on amazon</p>
      <p><a href="http://www.amazon.com/Designing-Type-Karen-Cheng/dp/0300111509" title="http://www.amazon.com/Designing-Type-Karen-Cheng/dp/0300111509">http://www.amazon.com/Designing-Type-Karen-Cheng/dp/0300111509</a></p>
      <p>Oh, and about the grid notebook: I'm not saying you should always follow a strict grid structure when you design your type. Your eye is always better than rigid geometry (and when you get into it, you'll see that most "geometric typefaces" aren't as geometric as you thought). Certain characters (in order to be most successful) should break the grid. The notebook is just a tool that I've found to be useful for keeping track of measurements. It makes cap/x-height easier to keep track of so you spend less time drawing guide lines, and makes it easier to keep an even stroke weight.</p>
