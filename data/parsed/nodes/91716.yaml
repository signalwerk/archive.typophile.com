    html: |-
      <p>a font-size-adjust setting was included in Font Squirrel's @font-face kit demo pages. (It might still be there, I don't know, but I rerouted by my workflow around it. It drove me crazy until I found out THAT was the reason for the strange font-size rounding I was seeing. And only FF supported it at the time (that might still be true) . Not good.</p>
      <p>font-size-adjust - its lack of universal and consistent support is a big problem. Stay away, I say.<br>
      Beyond that, I think it's one of those properties with a theoretical promise that exceeds it usefulness in reality. And idea hatched in Las Vegas one drunken night.</p>
