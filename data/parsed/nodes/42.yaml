    html: <p> I see the remnants of the "french fry" shape as being vaguely "arts &amp; crafts", vaguely "Metropolitain" -- the H as it stands now is not particularly Art Deco -- but it works, in my opinion. I think every typeface should have surprises. <br> <br>The letters that for me don't fit now are O and S (the rounder S, not the elongated diagonal S). The O seems too modern. I have yet to fit on a curve that seems right for the face. I was thinking maybe a geometric O, but it's a narrow face.... </p>
