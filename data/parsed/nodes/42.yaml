    html: <p> John - The reliance on the )( parenthetical shapes makes Cronus a tough one to pull off. Maybe Scoles can find a similar font that does it. <br> <br>Somewhere out there, there's a font based on the McDonald's Golden Arches. While executed okay, it maintains a gimmicky feel. <br> <br>Gimmicks are fun. Uh, I use gimmicks. But sometimes the end result is not highly usable as I have learned. <img src="http://www.typophile.com/forums/clipart/sad.gif" alt=":("> <br> <br>(Emigre's OutWest comes to mind) <br> <br>How do you see Cronus being used? The answer to that might tell you which direction to take it. <br> <br>BTW, Cronos is also the name of an Adobe font.* <br> <br>I enjoyed some of the other faces on your site more than Cronus + the design- and type-related content is a good read for Typophiles. <br> <br> <br>www.famished.org <br> <br>good luck, <br> <br>bj <br> <br>*do a search on this site to learn more about Cronos. </p>
