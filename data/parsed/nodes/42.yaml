    html: <p> Thanks for the feedback guys. <br> <br>Hrant, I agree with your favorite letters. I also like the numeral 2 a lot. <br> <br>Good idea on the "G" <br> <br>To answer BJ's question, I really didn't have a use for the font. I'm strictly a hobbyist when it comes to fonts. I have to say, though, that the comparison to OutWest is an unsettling one because I had always mocked OW for its unusability. <br> <br>Cronus seems to me to be a concept font, kind of like in the fashion industry where they have bizzare outfits on the runway but end up using just a couple of elements in their next mainstream clothing line. <br> <br>Thanks again guys and I will put my thinking cap on to see where to take this font... </p>
