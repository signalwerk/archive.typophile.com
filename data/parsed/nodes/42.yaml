    html: <p> John - The Art Deco is coming through very nicely and the ligatures are a nice touch. <br> <br>I think you have a brand new font. Now, with these new shapes, the letters that seem out of place are the C D G and Y. <br> <br>I think you have an entirely diff. cool font (Nu Art Deco?) if you play off the sharp style of the 'U' which is my favorite letter. <br> <br><img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":)"> <br> <br>bj <br> <br>btw, i recently stumbled upon ITC ANNA Pro (itcfonts.com) and I have a newfound appreciation for ANNA. Might be something to check out. <br> <br>And FB Anisette is another to check out. </p>
