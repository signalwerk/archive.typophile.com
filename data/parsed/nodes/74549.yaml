      <p>It's <a href="http://new.myfonts.com/fonts/bitstream/itc-grouch/" rel="nofollow">ITC Grouch.</a> Unfortunately, the only distributor that has it, Bitstream, is not allowed (by ITC) to distribute it. However, it was included on the Bitstream TypeShop CD-ROM back in the nineties. You may be able to find a copy of that on eBay or somewhere.</p>
      <p>(It baffles me that ITC prohibits Bitstream from distributing it, yet does not offer it itself. There are a few other early ITC fonts that fall into this legal purgatory at Bitstream, such as ITC Gorilla and ITC Grizzly. ITC has also not seemed interested in releasing digital versions of it's early display fonts, such as ITC Bernase, ITC/LSC Book, ITC/LSC Caslon, ITC Caslon Headline, LSC Condensed, ITC Didi, ITC Milano, ITC Tom's Roman, ITC Firenze and more. Many of these are regularly sought after here on Typophile.)</p>
