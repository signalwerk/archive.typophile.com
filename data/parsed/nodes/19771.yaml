      <p>I like it, as well.</p>
      <p>I am not Eron, but you may like '<a href="http://www.stormtype.com" target="_blank" rel="nofollow">Ohrada</a>', by Frantisek Storm, or '<a href="http://www.fontboutique.de" target="_blank" rel="nofollow">Noga</a>', by Heinrich Lischka, if you are considering a condensed typeface for the tagline.</p>
