    html: "<p>Neat idea.  <br> <br>One little nit to pick: The Bembo card states that Bembo was \"Released in 1495 by Aldus Manutius.\" I think this inaccurate and misleading.  <br> <br>First of all, Aldus' typeface was not called \"Bembo.\" That's the name Monotype gave <i>their</i> version in 1922. It comes from the name of an author of a book printed by Aldus (<i>De Aetna,</i> by Pietro Bembo, published by Aldus in 1495).  <br> <br>Second, he didn't \"release\" it in the sense that we mean today. Aldus was a 15th century printer in Florence, Italy. Several types were cut for his use by Francesco Griffo. \"Bembo\" is a modern revival of one of them. It was never made available to the general public in Aldus' day the way fonts are today.</p>"
    html_clean: "<p>Neat idea.  <br> <br>One little nit to pick: The Bembo card states that Bembo was \"Released in 1495 by Aldus Manutius.\" I think this inaccurate and misleading.  <br> <br>First of all, Aldus' typeface was not called \"Bembo.\" That's the name Monotype gave <i>their</i> version in 1922. It comes from the name of an author of a book printed by Aldus (<i>De Aetna,</i> by Pietro Bembo, published by Aldus in 1495).  <br> <br>Second, he didn't \"release\" it in the sense that we mean today. Aldus was a 15th century printer in Florence, Italy. Several types were cut for his use by Francesco Griffo. \"Bembo\" is a modern revival of one of them. It was never made available to the general public in Aldus' day the way fonts are today.</p>"
