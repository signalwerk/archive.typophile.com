  html: <p>This is not an identification request, but is very pertinent to Type ID ... <br> <br>Check out Fonts.com's monthly <a href="http://www.fonts.com/fontent/fontent_home.asp?nCo=AFMT&amp;con=articles&amp;sec=tradingcard" target="_blank"> Type Trading Cards</a>. They include <br>history of a typeface and ID hints. Cool! Hope it lasts awhile. <br> <br>Useless, perhaps, to you experts, but useful and FUN for some of <br>the rest of us. <br></p>
