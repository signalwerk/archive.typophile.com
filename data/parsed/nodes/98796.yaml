    html: |-
      <p>In Illustrator, you could do:</p>
      <p>- Add blur<br>
      - Rasterize<br>
      - Live Trace &gt; Make<br>
      - Live Trace &gt; Expand<br>
      - Simplify paths</p>
      <p>I got some pretty nasty paths that way, but it keeps you in Illustrator.</p>
    html_clean: |-
      <p>In Illustrator, you could do:</p>
