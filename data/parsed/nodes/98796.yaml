    <p>Dear typophiles:<br>
    I'm experimenting with a blurred version of one of my typefaces. I have all glyphs as outlines, please see example:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/MN-Miso-Chunky_6586.png"></div><p></p>
    <p>This is what I'm trying to achieve:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/MN-Miso-Chunky2_5340.png"></div><p></p>
    <p>I used Photoshop to blur the first image (Filter&gt;Blur&gt;Gaussian) and then Threshold (Image&gt;Adjustment) to get the black/white image.</p>
    <p>My question:<br>
    Is there a way of doing this while maintaining a vector format? (inside Illustrator for example?)</p>
    <p>Best<br>
    /Mårten</p>
