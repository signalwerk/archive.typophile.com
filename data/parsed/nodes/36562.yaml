      <p>That's somewhat better, but still way too static and serious.</p>
      <p>Try the following:</p>
      <p>1. Use livelier colors;<br>
      2. Use less straight lines and angles, more curves;<br>
      3. Use less serious, more dynamic fonts;<br>
      4. Use less geometrical, more "out of order" placement.</p>
