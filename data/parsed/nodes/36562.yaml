      <p>The last thing this world needs is another Christian/Youth Group "look my "T" is actually a cross" thing. For God's sake, please don't do that. It's so overplayed, cheesy, and cliche.</p>
      <p>(sorry, but this is a constant gripe for me).</p>
      <p>That said, your second concept is worlds better.</p>
      <p>I also disagree with Henry. This doesn't need to be livelier, curvy, etc.<br>
      This is headed in a good direction. You may wish to refine the Omega Symbol. The bar on the "M" needs a lot of work. It is a little clumsy here. Maybe something a little sharper.</p>
      <p>I would also consider a different face for the text. You know what might work well with this is Klavika.</p>
