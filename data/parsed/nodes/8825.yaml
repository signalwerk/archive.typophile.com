    html: <p>I see 2 different a's, two e's, 3 i's (including the uppercase), like letters with slightly different rotation and matching letter pairs with different spacing between them (see 2nd a-i pair in faisant and a-i pair in jaillir). Makes me wonder if someone drew some characters and stuck them in rough position to make these words.</p>
