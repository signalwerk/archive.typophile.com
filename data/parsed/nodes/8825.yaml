    html: <p>It appears to be a font, because the repeated letters look identical. However, this style could have been made by anyone.  No skill is required -- just a way to  produce a font from crudely drawn letters -- and so you might guess this is not my favorite type style, right? <br> <br>Well, I know you didn't ask for my opinion of it, but that is my way of explaining that this could have come from anywhere. It could have been made only by the person who made the original that you saw. <br> <br>Only if someone recognizes this particular sample would you have a chance of finding it. <br> <br>My advice is to look for 'distorted', 'destroy' or 'eroded' fonts at <a href="http://www.dafont.com" target="_blank">DaFont</a> and pick something that you think looks close enough.</p>
