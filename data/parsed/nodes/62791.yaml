      <p>With my somewhat limited experience, I've to say that using fonts from Dafont can get very messy down the road. It's not the first time I see this problem happen with accents, punctuation or even numbers. In one occasion, one of my partners used a font from Dafont and after finishing the job he was going to export a PDF (from InDesing). The font didn't allow embedding so he had to change the font, the text reflowed and he had to redo all of the text fitting. The funny part is that this typography was advertised as "free".  Sometimes paying for a good font or downloading one free but better will pay itself several times when you start to work.</p>
      <p>If you tell us what font you're using I might be able to help you further. Some of the fonts in that page are public domain so editing permission is not needed.</p>
      <p>Regards.</p>
