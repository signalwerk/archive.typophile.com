    html: |-
      <p>Whether it's legal or not depends on the terms of the license.  You can always e-mail the font designer and ask them.  There's always an outside chance that they'll add the hyphen for you.</p>
      <p>An alternative to TypeTool is FontForge (<a href="http://fontforge.sourceforge.net/" title="http://fontforge.sourceforge.net/">http://fontforge.sourceforge.net/</a>), which is free, somewhat tricky to install (unless you happen to be on Linux), and not totally intuitive.  The FontForge website includes detailed installation instructions and, once you get past that, tutorials, which you may not need for the task at hand.  Adding a glyph is mostly a matter of drawing Bezier curves; beyond that, you just set the sidebearings and generate the font.</p>
      <p>You may still decide that TypeTool is the right tool for you, but you should at least consider the alternatives.  On the one hand, the effort required to install FontForge may not be worth it for a single hyphen; on the other hand, $99 is a lot to pay for a hyphen.</p>
      <p>I guess a third option is to pay for a font that already contains the characters you need...</p>
      <p>If you do decide to go with FontForge and happen to run into problems, send me a message and I'll do my best to help.  I'm no expert, but I think I can handle adding a hyphen.</p>
