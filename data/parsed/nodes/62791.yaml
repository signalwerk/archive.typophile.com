  html: <p>Hey this could be an incredibly stupid question, but I am working on a job for a client that is using a handwriting inspired typeface. It took a long time to select one and we finally settled on a free one from DaFont. I am now slightly regretting this decision as the font is not fully built including all of the glyphs, especially a hyphen which is really the only thing I need added. If someone has the time to explain, what would it take to add a glyph to this font? and is this illegal even though the font is free? I know nothing about typeface design or working with font editing software, I am mostly versed in Adobe products. Any info would be helpful, Thanks!</p>
  html_clean: <p>Hey this could be an incredibly stupid question, but I am working on a job for a client that is using a handwriting inspired typeface. It took a long time to select one and we finally settled on a free one from DaFont. I am now slightly regretting this decision as the font is not fully built including all of the glyphs, especially a hyphen which is really the only thing I need added. If someone has the time to explain, what would it take to add a glyph to this font? and is this illegal even though the font is free? I know nothing about typeface design or working with font editing software, I am mostly versed in Adobe products. Any info would be helpful, Thanks!</p>
