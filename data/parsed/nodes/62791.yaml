    html: "<p>The cheapest and easiest way to add a hyphen to the entire font is with TypeTool from Fontlab: <a href=\"http://www.fontlab.com/font-editor/typetool/\" title=\"http://www.fontlab.com/font-editor/typetool/\">http://www.fontlab.com/font-editor/typetool/</a>  It costs $99 and is fairly easy to use. In TypeTool simply open the font, add the hyphen, and export (only exports truetype fonts though). I'm unsure about the legal concerns. I've been wondering the same thing myself.</p>"
