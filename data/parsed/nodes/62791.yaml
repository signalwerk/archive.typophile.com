    date: 2009-10-06T17:25:00
    date_raw: 6 Oct 2009 — 5:25pm
    votes: null
    html: <p>This depends on the foundry (or designer or whoever who owns the rights of the font). Based on my little experience with Dafont, I can tell you that every font comes with some kind of text who tells you if it is allowed or not (it is called EULA = End User License Agreement). If there is not such text, or if the text doesn’t talk about this, you can contact the author via email. Most of the times, he/she will allow you to make the change if you explain your situation.</p>
