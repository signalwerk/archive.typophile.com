  - id: 338625
    user: 3596
    date: 2009-03-30T15:11:00
    date_raw: 30 Mar 2009 — 3:11pm
    votes: null
    html: |-
      <p>Drawing the bold is much more fun :) I used to draw the regular first then the hairline then the bold. But it turns out that I had too make so much corrections on the 2 first weights that sometimes I almost redraw them completely. The bold weight let you "push" the weight to the extremes you need. If it works in bold it will work in the lighter weight almost always, the contrary is not always true.<br>
      For my last 2 fonts I first draw the extra bold and the hairline weights and interpolate the regular. It was assle free for me…<br>
      And if your points are on the right spots it is super easy to do the rest of the weights.</p>
