    <p>Hello,</p>
    <p>I started a new project from some calligraphic quadrata drawings I had in a drawer. The source displayed in my pic is not my calligraphy, just an example of the structure of the calligraphy. But I have a question about the way the interpretation may be. Here is my "problem". The quadrata was a calligraphic model that has been abandonned because it was too "straight" to draw regarding the tools used by the monk at the time. When I was drawing my calligraphic model I was using a wooden calam and it turns out that the result was straight but subtle. So here is my interrogation. Would it be more logical to go for #1 or #2 interpretation knowing the historical factor of the calligraphy?</p>
