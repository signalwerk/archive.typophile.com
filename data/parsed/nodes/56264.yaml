    date_raw: 27 Mar 2009 — 6:51am
    votes: null
    html: |-
      <p>I've already started my first typeface by the bold weight and I will not do de same anymore. The problem to my point of view when you choose that way is that you have to draw almost all the weight without the benefit of the interpolation. For my second one I've start by the light one and I did the black in a second step. Choosing that way I've been able to easily work with the interpolation with less adjustments.</p>
      <p>André</p>
