      <p>Another way of putting it is that fine art is generally concerned with self-expression (so form can indeed be an end in itself), but graphic design is generally concerned with communicating a message on behalf of a client. </p>
      <p>(Of course there are exceptions, like a fine artist doing a commission job, or a designer doing a project for themself.)</p>
