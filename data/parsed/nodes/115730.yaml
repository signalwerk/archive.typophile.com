      <p>My own view is not mainstream, but I believe the two are in fact opposed: function is so complex that simplicity of form cannot do the job. Or: simplification is an escape from function's complexity.</p>
      <p>Concerning the actual <em>use</em> of the terms on the ground, I think it's sadly true that people associate simplicity with functionality. Part of it is understandable, since complex forms are often decorative. But for example if you look at a Formula-1 car, it's not simple at all, but it has beauty.</p>
      <p>hhp</p>
