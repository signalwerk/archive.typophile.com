    <p>Hello Everyone</p>
    <p>I am a second year graphic design student currently working on a self - formulated essay question that discusses whether the principle of 'form follows function' is the same as 'simplicity', in design, or if the terms have gradually started to be incorrectly used in an interchangeable fashion. What are your takes on the matter?</p>
