      <p>The principle of "form follows function" is to avoid making form into an end in itself. Things should not be simple for the sake of simplicity, nor should they be elaborate for the sake of being elaborate. There should be a reason for simplicity or complexity, and that reason should be derived from who's going to use it, what they're going to use it for, and the circumstances they'll use it in. </p>
      <p>Incidentally, this may be the most important difference between design and fine art, since in the latter, it is perfectly OK for form to be an end in itself.</p>
