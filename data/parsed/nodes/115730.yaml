    html: |-
      <p>"Form Follows Function" is a phrase that originated in the late 1800s and was a rejection of  the highly ornamented style that had been popular in architecture and in other areas of design. </p>
      <p>Objects designed with this philosophy in mind often appear simpler because they lack ornamentation. </p>
      <p>However simplicity as a design concept goes deeper than lack of ornamentation. It means really thinking a problem through and making an object that does the intended purpose well and in a simple, easy-to-understand manner.</p>
      <p>For example, let's say I'm designing a new tractor for farmers. I could use "form follows function" and design a tractor that's very functional with no frills, but it might be confusing to operate. Or I might design a tractor that's simple to use, but doesn't do the job well. Or if I'm really smart, I'll design one that's both functional AND simple to use.</p>
      <p>A poster advertising an event could be a simple design but it doesn't communicate well. Or it could be very functional but not attractive or easy to read. Ideally you want both.</p>
      <p>So what I'm saying is that they are really different things.</p>
      <p>(And some designers have been successful with highly ornamented designs. Different strokes for different folks.)</p>
