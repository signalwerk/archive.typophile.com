      <p>The crux of it is best expressed by the popular paraphrase of Albert Einstein by Roger Sessions: "Everything should be as simple as it can be, but not simpler!" The second part is very important and often overlooked, and properly applying it, taking into account all necessary complexities, will often result in something that is not very simple at all.</p>
      <p>I doubt I could come up with a more succinct summary of biological evolution than "form follows function", yet the results are, of necessity, staggeringly complex.</p>
      <p>Furthermore, one must remember that pure aesthetics often serve a function — indeed, can <em>be</em> a function. The look of something is often useful in ways that are not easily realized or expressed.</p>
