      <p>Edmund Arnold called the ordering you mention a "Canadian Wrap" in his books on newspaper design in the 50s and 60s. (Very dated now.) Thing is, I am in Canada, and had never seen such. Perhaps it was a western Canada thing. There would be a deck between the 1/2 and 3/4 levels.</p>
      <p>I personally find it confusing.</p>
