    <p>I am copyfitting some text to what-will-be a report with letter sized paper (though the spreads are double that... and I don't know the name!)</p>
    <p>I am wondering if zigzagging the copy is ever permissible and what would be the conditions necessary to merit it? Since we are a visual community, a graphic:</p>
    <p>1 2</p>
    <p>3 4</p>
    <p>Voila!</p>
    <p>Following the grid straight down hits me wrong entirely. The point size is 9/12 so I feel as though the type is simply too small to run that much of it. (It's Minion Pro). Thoughts? I feel as though I have seen this <strong>1,000</strong> times in other publications but alas, I never paid much attention. Visually, the copy is very pleasing but even I get a little confused as to the flow; sometimes I read down as opposed to across.</p>
