    <p>About as far from science as you can get (not that there's anything wrong with that).</p>
    <p>A famous graffiti artist, <a class="freelinking external" href="http://www.artrepublic.com/biographies/10-blek-le-rat.html" rel="nofollow">Blek Le Rat</a>, somehow ended up on my facebook and he joined a group that linked to this site called <a class="freelinking external" href="http://www.maquis-art.com/" rel="nofollow">Maquis Art</a>. Better brush up on your <a class="freelinking external" href="http://en.wikipedia.org/wiki/French_language" rel="nofollow">Français</a>.</p>
    <p>Despite the fact I'm a bit of a digit head, I have to admit I've always been fascinated by graffiti art, due to the fact that it's largely type-based. There's a fantastic documentary on the history of graffiti called <a class="freelinking external" href="http://www.bombit-themovie.com" rel="nofollow">Bomb It</a>. I highly recommend.</p>
    <p>(<em>clip in top right corner</em>)</p>
