  html: <p>Now for one that requires a bit more thinking about. How do you typographically encompass the word 'Citizen' without specifying a certain place of belonging. <br> <br>(Which typeface do you believe most encapsulates the word 'Citizen'. I am doing a study into typographic reactions to words, there have been some great responses so far. All the results will be published on my website with an accompanying conclusion.) <br> <br>It would be fantastic if people could respond, there were some great responses to fear. I'd really appreciate it.  <br> <br>Thanks</p>
