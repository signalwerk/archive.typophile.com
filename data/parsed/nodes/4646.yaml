    html: <p>C, try this, look at a real ice cube and draw it in dimension or photograph it. Make the type look like it is etched into the ice cube. and maybe let the cube melt a bit so it looks cool and refreshing. Add a tagline something about cool and refreshing food and drinks. There is a chain called Chillys here that features hot and spicy food you need to make sure you get what your resturant does across to the consumer clearly. Remember the meaning of Assume. Assume means make an ••• of U and Me. So don't assume the customer knows anything.</p>
