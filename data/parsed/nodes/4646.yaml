    html: <p>"this logo just 4 our school assignments" is a bullshit excuse. <br> <br>School work can be your best work. Take this seriously. <br> <br>In real life you will have clients that have no consistant <br>views regarding branding and identity, It will be your task to educate them and explain why some things will work and others <br>will not. You will have to consider everything, and bill them for your expertise. <br> <br>Example- I am billing a client $2600 tomorrow to do pre-liminary scope of their branding needs. No actual design work just consulting and planning. With better planning better work will be done in the end that is target orinented and a real business tool with actual worth (intellectual property), not just something to physically differentiate a restaurant from it's neighbor the corner grocery store.  <br> <br>Take this chance to created an original, logical, and aesthetic <br>identity for a client (even if it imaginary or a professor)  <br> <br>In the real world you will have to fight for your ideas, or become  <br>someone who just does as clients suggest and make a few bucks but never feels proud of the work. Later you may find clients that want you to think harder and develop better concepts but  <br>because your portfolio does not reflect great concepts and deployment of concepts no one will listen. You are smart to ask good question at this stage in you education, and to spend the time to deliver a viable solution. This work can get you hired. <br> <br>This process will obviously take more time, so have another cup of coffee and stay up all night to deliver something exceptional.</p>
