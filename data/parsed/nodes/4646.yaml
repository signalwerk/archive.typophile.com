    html: <p>C, where are you going to school, if its in a city, I'd suggest walking around and looking at the signage, if thats not possible, surf the web and look at the logos of some of the chains like McDonalds and Chili's. Start your logo design with pencil to paper, come up with the shapes that you like, then find the type to suit. Make sure you tell the potential client its a restaurant and the type of atmosphere and food thats served.</p>
