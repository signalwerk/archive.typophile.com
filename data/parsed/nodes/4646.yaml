    html: <p>the Rodney Sheldon Fehsenfeld font you used seems a bit dated. <br>To assist you in finding the right typeface, it would be helpful to know more about the client / restaurant. Upscale or inexpensive daily grub. Location - mall, college town or suburbs, the type of people you would expect to visit this place- business folks of high school students. Alchohol establishment or not. In other words serious demographics. I am no legal expert but the name sure sounds a lot like the famous Chili's franchise. To take precaution perhaps it would be worth suggesting to your client to double check with lawyer who knows copyright laws regarding the name. <br></p>
