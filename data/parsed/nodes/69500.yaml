    <p>I wonder if someone can help me with a "noob" question. This is probably something that is being taught on a second week of a proper type design class... which I fully intend to attend at some point later on :)</p>
    <p>I am trying to understand the reason for the lower curve of the a's tail not following the geometrically obvious path:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/a_5249.png"></div><p></p>
    <p>My guess is that it has to do with the visual balance. The notch is deepened to cut away some of the black and improve the uniformity of perceived stroke thickness in that area. Am I off?</p>
