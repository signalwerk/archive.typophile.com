      <p>Strokes are generally thinned at oblique intersections.<br>
      Otherwise, the joint becomes enlarged, and ends up looking bigger than it really is, due to "bleed"<br>
      Bleed is of several kinds. </p>
      <p>Firstly, it is a traditional artefact of print typography, because these sharp crevasses are apt to fill in with ink.<br>
      Hence the preemptive move of thinning the stroke(s), and even taking it further and enlarging the pit as an "ink trap".</p>
      <p>Secondly, there is a visual bleed in the perceptual process, because the apex of the joint is beyond the threshold of acuity.</p>
      <p>Thirdly there is categorical or conceptual bleed, which is further up the perceptual chain; this occurs because at a joint there is a wider distance of solid than either of the stroke widths that comprise it, and this does not appear to be aligned with either stroke-- it "reads" as a blot or hot spot, visual noise which serves no purpose. </p>
      <p>That third kind is more what happens at the bottom of the "a".</p>
      <p>Letter forms also suffer shrinkage as well as bleed, at the outside of corners.<br>
      Or perhaps that could be described as a kind of "negative" bleed, of the surrounding ground into the figure.<br>
      The serif is the most obvious method of dealing with shrinkage, but in phototypography, "ticks" were sometimes added to corners to prevent the arris from becoming rounded. Even in a sans, the end of a stroke is often widened and sharpened, as at the top left of the "a" above, to counteract shrinkage.</p>
