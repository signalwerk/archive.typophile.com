    html: <p>I had some uptight designer/know-it-all come in one day and specify that she wanted her bold headlines set in "Gheel Sahns." I asked her if that was the same thing as Gill Sans, and she said yes, but that I was mispronouncing it. I replied that I didn't know Eric Gill was French since he was from England. That shut her up.  <br> <br>In retrospect, though, I don't know how Eric pronounced his last name. Soft G or hard? </p>
