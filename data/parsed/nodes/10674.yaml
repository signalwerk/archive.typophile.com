    html: <p>I'll let you in on a little secret, Andrew, if you promise not to tell anyone.  <br> <br>All over the world there are a hell of a lot of Graphic Designers using typefaces with exotic/foreign names every day. A high proportion of them don't pronounce 'Gill' exactly as Gill himself would have done. What does that change? Do they respect his work any less that you? And what about non-French designers trying to pronounce French names? I don't think they're going to win any pronunciation contests. <br> <br><i>Not if (a) you deal with these names everyday, and (b) respect the people who designed them.  <br>By your answer, it's apparent that you do not</i> <br> <br>This is total hypocrisy coming from someone who admits to shutting up an uptight know-it-all because she mispronouned a typeface name. Try a little more respect for people, Andrew, and a little less for typeface names. <br> <br>And I advise you to reread your posts. Do you really mean to suggest that there is <b>nothing</b> more important in the world that correctly pronouncing a typeface name? <br> <br>Don't be a chauvinist. Self is not the yardstick of truth. <br> <br>Matha Donnchadh Stand</p>
