    votes: null
    html: |-
      <p>VOLT does not decompile OTL tables, so the data needs to be either in the plain text formats used to store and transfer VOLT projects, lookups, groups or glyph set data (.vtp, .vtl, .vtg, .vtd) or in the private table binary format in which VOLT projects are stored within a source TTF). FontLab offers an option to 'Export VOLT data' when generating a TTF, which I think means it will try to write the private table, but I don't think it is very reliable. You would probably need to rebuild your features and lookups in VOLT.</p>
      <p>Alternatively, you should be able to use the AFDKO v.2 outside of FontLab to compile your feature code. Or you could use DTL OTMaster.</p>
