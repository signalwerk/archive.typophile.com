    <p>Hi there,</p>
    <p>I am trying to solve some triplets kerning problems in a script font without designing more characters.<br>
    I thought I could use contextual kerning (LookupType 8, chaining contextual positioning) but when I try to set something like </p>
    <p>feature kern {<br>
    position d space' 20 D ;<br>
    } kern;</p>
    <p>I get the message "Cannot mark positioning glyphs". What is the problem? Is 'kern' not the proper feature to place such substitution? In this case, which should be the proper feature to set my contextual positioning?</p>
    <p>Thanks in advance.</p>
    <p>R.</p>
