    html: |-
      <p>You need "Single Positioning" used in your kerninglookup:</p>
      <p>lookup kernHorizontalKerninglookup2 {<br>
            pos \f  \space' \T  ;<br>
      } kernHorizontalKerninglookup2;</p>
      <p>lookup SinglePositioninglookup3 {<br>
           pos \space &lt;0 0 300 0    &gt;;<br>
      } SinglePositioninglookup3;</p>
      <p>if I understand it correctly...</p>
