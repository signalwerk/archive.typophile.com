      <p>"FontLab Studio currently does not support:<br>
      GSUB lookup type 2 (Multiple substitution, e.g. a b -&gt; c d)<br>
      GPOS lookup types 3 (Cursive attachment positioning), 4 (Mark-to-Base attachment positioning), 5 (Mark-to-Ligature attachment<br>
      positioning), 6 (Mark-to-Mark attachment positioning), 7<br>
      (Contextual positioning), 8 (Chaining contextual positioning)"<br>
      Manual, p. 835<br>
      So VOLT or FontForge...</p>
