      <p>“I just wanted to know how a designer would see these concepts from their point of view.”</p>
      <p>From a designers perspective, all these logos are very bad. The concepts need to be heavily refined and simplified, and the implantation needs to be absolutely overhauled. A designer giving you their honest opinion would suggest that you hire a professional.</p>
      <p>You may not have a large budget, but the identity of your company is one of the most important investments you can make. When you have an online business your logo is the face of your company. People will make judgements because of your design that directly influence weather they choose you or your competitor.</p>
      <p>There are plenty of inexperienced student designers who are very inexpensive. If there aren’t any in your country you can outsource the project to someone from another country. Another option is to hold a design contest where people compete for your prize money. <a href="http://99designs.com" title="http://99designs.com">http://99designs.com</a> is a good site.</p>
      <p>I hope I didn’t offend you with my blunt honesty. Your english is very good by the way.</p>
