    html: "<p>Here's the link Peter Bruhn provided to David Lemon's article on hinting: <br> <br><a href=\"http://www.pyrus.com/downloads/hinting.pdf\" target=\"_top\">http://www.pyrus.com/downloads/hinting.pdf</a>  <br> <br>It's also available in html fomat, thanks to Google.com: <br> <br><a href=\"http://google.com/search?q=cache:ZHA0khd1fmEC:www.pyrus.com/downloads/hinting.pdf%2BFontographer%2BHinting&amp;hl=en\" target=\"_top\">http://google.com/search?q=cache:ZHA0khd1fmEC:www.pyrus.com/downloads/hinting.pdf+Fontographer+Hinting&amp;hl=en</a> <br> <br>I have also come across this article, \"Hints on Hinting in Fontographer\" on Macromedia's site: <br> <br><a href=\"http://www.macromedia.com/support/fontographer/ts/documents/tn3718.html\" target=\"_top\">http://www.macromedia.com/support/fontographer/ts/documents/tn3718.html</a> <br> <br>And then, there is this rather useful basic tutorial on font design, including manual hinting, from [Divide By Zero]: <br> <br><a href=\"http://www.andrew.cmu.edu/~twm/makefont/\" target=\"_top\">http://www.andrew.cmu.edu/~twm/makefont/</a> <br> <br>David</p>"
    html_clean: "<p>Here's the link Peter Bruhn provided to David Lemon's article on hinting: <br> <br><a href=\"http://www.pyrus.com/downloads/hinting.pdf\" target=\"_top\" class=\"link-external\">http://www.pyrus.com/downloads/hinting.pdf</a>  <br> <br>It's also available in html fomat, thanks to Google.com: <br> <br><a href=\"http://google.com/search?q=cache:ZHA0khd1fmEC:www.pyrus.com/downloads/hinting.pdf%2BFontographer%2BHinting&amp;hl=en\" target=\"_top\" class=\"link-external\">http://google.com/search?q=cache:ZHA0khd1fmEC:www.pyrus.com/downloads/hinting.pdf+Fontographer+Hinting&amp;hl=en</a> <br> <br>I have also come across this article, \"Hints on Hinting in Fontographer\" on Macromedia's site: <br> <br><a href=\"http://www.macromedia.com/support/fontographer/ts/documents/tn3718.html\" target=\"_top\" class=\"link-external\">http://www.macromedia.com/support/fontographer/ts/documents/tn3718.html</a> <br> <br>And then, there is this rather useful basic tutorial on font design, including manual hinting, from [Divide By Zero]: <br> <br><a href=\"http://www.andrew.cmu.edu/~twm/makefont/\" target=\"_top\" class=\"link-external\">http://www.andrew.cmu.edu/~twm/makefont/</a> <br> <br>David</p>"
