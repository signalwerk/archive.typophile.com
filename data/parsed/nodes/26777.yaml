    <div class="info">Submitted by <a href="/user/3" title="View user profile.">Jared Benson</a> : 7.May.2003 6.52pm </div>
      <p>We're pleased to announce that Typophile Forums are back up and ready!  <br> <br>We can't express enough how much we appreciate the outpouring of support and suggestions we received during our downtime.  <br> <br>The outage was directly attributed to the amount of traffic/activity Typophile is seeing combined with inadequate resources on behalf of our host. Watch for more news in this space as we consider our alternatives.  <br> <br>In order to try and keep our host happy we've had to <b>temporarily</b> delete any messages older than 720 days in hopes of lightening server load. We'll do everything in our power to ensure this type of outage doesn't happen again.  <br> <br>The floor is yours! <a href="http://www.typophile.com/forums/" target="_blank">http://www.typophile.com/forums/</a> <br> <br>Best, <br>Jared &amp; Joe <br>Typophile Admins <br> <br></p>
