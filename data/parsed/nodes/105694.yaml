    html: |-
      <p>That is an unusual face and probably would make a nice revival if enough resource material is available. I do believe it is hand-set rather than by machine. </p>
      <p>I looked through my foreign foundry specimens (French and British) but cannot locate it, nor in the US foundries either. I'm uncertain as to where a Romanian book publisher of that era would go for type, perhaps a Russian foundry. Unfortunately I cannot find a Russian foundry specimen book.</p>
      <p>If you do identify it, please post the name here for our information. In the meantime I will keep it on my list of to-be-identifieds.</p>
