      <p>Hi! I tried to find something about the foundry... All I can say is that the book was printed in the Austrian-Hungarian Empire, in a german typography, in present day Romania (right on the Romanian-Hungarian border).</p>
      <p>Thanks for the help! I'll keep searching myself...</p>
