    html: |-
      <p>You can assign the fsType value via Python with the command<br>
      <code>fl.font.ttinfo.os2_fs_type = X</code><br>
      where <code>X</code> can be one of the following integers:</p>
      <p><code>0</code> : Everything is allowed (installable mode)<br>
      <code>2</code> : Embedding of this font is not allowed<br>
      <code>4</code> : Only printing and previewing of the document is allowed (read-only)<br>
      <code>8</code> : Editing of the document is allowed</p>
      <p>(Wording as it appears on Fontlab v4.6 Mac, Font Info window, Embedding panel under Names and Copyright)</p>
      <p>As a side note, I believe Adobe usually sets their fonts to "Editing of the document is allowed" so that you can make small changes in a PDF document, for example. [Edit: Not entirely true. Here's the correct <a href="http://store.adobe.com/type/browser/legal/embeddingeula.html" rel="nofollow">list</a>]</p>
