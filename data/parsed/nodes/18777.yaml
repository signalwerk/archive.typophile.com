    <p>Hi, </p>
    <p>I recently started selling fonts on the myfonts.com website and after a month the owner of the site asked me if I could change some values of the truetype versions of my fonts: "...the TrueType versions of your fonts will need to be updated. For this the value of fsType in the OS/2 table needs to be set to 4."<br>
    I use Fontlab 5 and I searched for a spot/field where I could change these values, but I cant find them at all. I have no experience with these things so I would really appreciate someone telling me where I can make these changes. </p>
    <p>Thanks,<br>
    Joe</p>
