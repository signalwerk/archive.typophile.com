      <p>from the TrueType specification:<br>
      <a href="http://www.microsoft.com/typography/tt/ttf_spec/ttch02.doc" title="http://www.microsoft.com/typography/tt/ttf_spec/ttch02.doc">http://www.microsoft.com/typography/tt/ttf_spec/ttch02.doc</a></p>
      <p>Restricted License embedding (0x0002): Fonts that have this bit set must not be modified, embedded or exchanged in any manner without first obtaining permission of the legal owner.  Caution: note that for Restricted License embedding to take effect, it must be the only level of embedding selected (as noted in the previous paragraph).</p>
      <p>Preview &amp; Print embedding (0x0004): Fonts with this bit set indicate that they may be embedded within documents but must only be installed temporarily on the remote system. Any document which includes a Preview &amp; Print embedded font must be opened “read-only;” the application must not allow the user to edit the document; it can only be viewed and/or printed.</p>
      <p>Editable embedding (0x0008): Fonts with this bit set indicate that they may be embedded in documents, but must only be installed temporarily on the remote system. In contrast to Preview &amp; Print fonts, documents containing Editable fonts may be opened “read-write;” editing is permitted, and changes may be saved.</p>
      <p>Installable embedding (0x0000):  Fonts with this setting indicate that they may be embedded and permanently installed on the remote system by an application. The user of the remote system acquires the identical rights, obligations and licenses for that font as the original purchaser of the font, and is subject to the same end-user license agreement, copyright, design patent, and/or trademark as was the original purchaser</p>
