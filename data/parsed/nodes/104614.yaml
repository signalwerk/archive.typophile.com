    html: <p>«Recent Articles» is nearly illegible from the low contrast. «Type &amp; Music» looks odd centered when the other text on orange is asymmetric. I don’t think quotes (Bringhurst) should have as much spacing between them as the subheads have before them. It makes the quote look too separate from the enclosing paragraphs it’s in context of.</p>
