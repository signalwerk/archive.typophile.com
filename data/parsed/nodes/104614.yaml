    <p>Hi everyone</p>
    <p>I've been playing around with content and composition for a little project I'm working on and I'd really love some critique to help me improve.</p>
    <p>Here's the link <a class="freelinking external" href="http://typeandmusic.com/articles/measure.html" rel="nofollow">to the work in question</a>. I'd just like to get another set of eyes to look over it and make sure I'm not making any blindingly obvious mistakes.</p>
    <p>Any advice would be greatly appreciated!</p>
    <p>Many thanks.</p>
