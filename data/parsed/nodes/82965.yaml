      <p>And yeah, they often look clunky and horsey and ... boring. I think to many type designers are horseshoing their types into a system (re: Univers) either by interpolating or by drawing a light, a regular and a black around the same rules and principles when they obviously have different needs. Looking at stuff up close will reveal it's inconsistencies, all the while text type is ALL about using those very inconsistencies too make even colour and rythm when viewed from a distance. Hello conflict!</p>
