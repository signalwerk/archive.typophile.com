    <p>Hello,<br>
    I am a graphic designer with a great interest in and respect for type design, but I am not a type designer by any means.<br>
    Here is my question:<br>
    It's my understanding that the original weights of Helvetica were expanded into more weight varieties (in the early 90s, I believe), the results of which included extremely thin "hairline" weights, and the whole family was named "Helvetica Neue."<br>
    Judging from the frequency that I see the ultra-light weights of Helvetica Neue used in design projects, the family must have been extremely profitable.<br>
    So why has no one done the same thing with other classic sans faces... i.e. made additional ultra-thin weights of Futura, Avant Garde, Optima, Akzidenz, etc.?<br>
    I know that was recently done with Avenir... what about other fonts?  It seems like something almost guaranteed to be financially successful.<br>
    Is it a legal issue? Is it a matter of type designers not being interested in something "old" like this?<br>
    I, for one, would love to have more thin weights of some of these faces, and would happily pay for them.</p>
    <p>Thanks for any thoughts you have.</p>
    <p>-Rob</p>
