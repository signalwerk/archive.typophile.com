      <p>I have little interest in revivals, although I have done a few.<br>
      I certainly would not revive a well-known sans.<br>
      There is more room for an original interpretation in reviving a serif face.</p>
      <p>I think you will find that there are many recent, new sans faces that are in the same genres as the faces that you mention, and which include Thin and Ultra Light weights. Why not use those?</p>
