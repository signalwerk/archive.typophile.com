      <p>I know a popular sans serif that is "secretly" in the process of being retro-fitted, but in general:</p>
      <p>- sometimes the foundry or designer doesn't think of it</p>
      <p>- sometimes the designer isn't interested, either because they think it doesn't make sense for the design, or because it is much more work to retrofit than to design it that way in the first place</p>
      <p>- it is very rarely a legal issue, except when licensing from one foundry to another is involved. So for example it would be a legal issue for Foundry A to extend a typeface that they license from Foundry B.</p>
      <p>Cheers,</p>
      <p>T</p>
