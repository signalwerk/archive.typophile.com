      <p>“Cartoon Favorites” is close to <a class="freelinking-external" href="http://www.fonts.com/FindFonts/Detail.htm?pid=203633&amp;/cgi-bin/MsmGo.exe?grab_id=0&amp;page_id=5674&amp;query=OLIVER&amp;SCOPE=Fonts">Oliver</a> from Panache. This is like many very similar brush lettering fonts that were made as film types. URW also has digitized some of these old brush lettering typefaces.</p>
      <p>Is the age of this pre-1990? If so, all this lettering may be film types (photo-lettering), whose originals were hand-drawn. </p>
      <p>- Mike Yanega</p>
