      <p>I have looked through all the suggestions and I will try to answer some of your questions. I confess, I do not quite understand all the nuances between styles of slab-serif. In terms of pure subjective taste, I prefer slabs that are more geometric, with very little contrast between thick/thin strokes, which Museo and Archer seem to fit quite well. I stumbled across House Industries’ Neutraface Slab last night, and am really considering that or Neutraface No 2.</p>
      <p>I like The Serif from LucasFonts, but it feels awfully similar to Chaparral to me, which I own, and I’m looking for building up as much diversity in my font library as possible. On my sticky note of serious considerations, I now have the following: Archer, Museo Slab, Neutraface Slab, Neutraface 2, and Gotham.</p>
      <p>I’m delighted to see you frequent these forums, Jos! I feel like I’ve stumbled upon a goldmine of knowledge and expertise. I myself am designing a geometric slab-serif... which may not turn out to be any good, but I am learning a ton in the process. Part of the reason I want to purchase a geometric slab is for study purposes.</p>
