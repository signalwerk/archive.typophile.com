    <p>Hi folks, new to the forum, but consider myself a neophyte type snob (that is, still a beginner, but I am a type nut nonetheless).<br>
    I am a student, and purchased the Adobe Font Folio (academic), so I already own such faces as Helvetica, Avenir, Univers, Futura, etc etc,plus the faces that come with OS X and Adobe CS4.</p>
    <p>What I lack is a really complete slab-serif family of fonts. I am thinking that purchasing a good slab-serif font would be a really useful addition to my library, so I am currently considering Jos’ Museo Slab family or H&amp;FJ’s Archer. I see Archer everywhere, however, and I don’t want to invest in a library that could soon be ubiquitous/overused (if it isn’t already...)</p>
    <p>Other faces I’m considering: Gotham, Verlag, some nice brush scripts like Alpine Script... maybe a combination of fonts. However, I can only afford spending up to $300 on fonts. I see the merit in getting one high-quality family (or at least a subset of a family) and learning how to use it really well.</p>
    <p>I’d really appreciate your feedback!</p>
