    html: <p>I think Hrant is on target in asking what kind of slab you are looking for, because they can be so different. For a happy sans you can’t do better than Museo, and a friendly one, Archer. <a class="freelinking-external" href="http://new.myfonts.com/fonts/linotype/pmn-caecilia/">PMN Caecilia</a> is a humanist slab, very nice for some clean looking text. The heavy condensed weights of <a class="freelinking-external" href="http://fontbureau.com/fonts/Dispatch">Dispatch</a> look great in headlines, for which they were designed. <a class="freelinking-external" href="http://www.seblester.co.uk/type_lettering.php?CategoryId=7">Soho</a>’s heavy weights are pretty, and somehow say ’magazine’ more to me. Newsy, but very stylish is <a class="freelinking-external" href="http://christianschwartz.com/stagsans.shtml">Stag</a>, which is my favorite at the moment.</p>
