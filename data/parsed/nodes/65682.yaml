    html: <p>Brendan, I am right now reading the monumental “Adrian Frutiger Typefaces. The Complete Works”. In the discussion of his slab serif, Serifa, there is a wonderful classification of slab serifs on p. 168. It’s a classification by structure and really gives a lot of insight into the form. If you are going to work on a slab serif I would definitely recommend having a look at it in a library. Interestingly, Frutiger regards Serifa as “one of my worst attempts at a typeface.”</p>
