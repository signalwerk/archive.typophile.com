    html: |-
      <p>Karsten — Adam Twardoch is a major expert on things font. I acknowledge that, no doubt. And I really appreciate his magnanimous sharing of know-how. This is precisely why it vexes me that he does not (will not?) make sense out of my in the mean time elaborate explanations. But no hard feelings, I started this thread as a "newbie" and still remain to be so. Still, I'm not dumb and really do not need to be told when to do over my lesson. </p>
      <p>I follow your interpretation about non-OT supporting applications expectedly not be willing to implement even a DFLT feature ever. I guessed so myself, but this doesn't involve the rationale behind a DFLT feature, for at least applications that do support OT, but are not suited (i.e. are too basic) to implement all conceivable, more advanced features (such as Apple Keynote), could still take advantage of a DFLT feature. Too, I repeat and stress that the DFLT feature is essentially not about backing up for lack of support by applications, but far more its purpose is to supply font developers with a resort for all their ad hoc custom features and at the same time to allow them to set defaults themselves.</p>
      <p>You're quite hitting the core of this discussion in that this all is about the strategic question of font vs application task management. (I read your <a href="http://www.kltf.de/downloads/SpacingIssues-kltf.pdf" rel="nofollow">article</a> on spacing). I guess I'm on the font-side with my DFLT feature. Some reasons are:</p>
      <p>(a) With OT (and GX/AAT) fonts have become like programs, being much more than a mapped collection of glyphs. In the old days, founts of type were supplied in cases out of which the typesetter had to choose the right sort, in early DTP the designer had to do the same, manually selecting expert sets out of simple font files, later on he could use search-and-replace, even scripts and macros, whereas today all, even inexperienced users, can benefit from intelligent fonts that automate typesetting. I think this has several advantages. For one, typographic knowledge is automatically available for all users (that have the right fonts and apps). From the commercial/legal perspective, it cannot be maintained that fonts are just a database of node positions (thus failing the legal protection as copyrighted programs), but more and more become to behave like programs. And not the least: intelligent fonts give their designers the opportunity to put in their own (to their design suitable) typographic preferences. </p>
      <p>(b) Fonts "do some design related (contextual) substitution/positioning", as you wrote. They not only do so, but should do so, precisely because the greater part of micro-typographic formatting is design related. Therefore, rather than applications, fonts are more suited, not for some, but all design related interventions.</p>
      <p>(c) For the success of their designs, type designers ideally do not want to depend from backward applications and/or uninformed/illiterate users. Bad use spoils the design efforts greatly. The more a font can influence the final typesetting all by itself, the greater its chances for success.</p>
      <p>(d) Intelligent fonts may eventually turn typesetting (truly typographical correct and handsome setting of type, that is) in just "flowing text into a frame", thus greatly improving workflow efficiency and consistency.</p>
      <p>(d) With publicly available Feature coding templates, font designers can share their knowledge, thus guaranteeing for consistent typographic formatting of text, whereas applications typically do not disclose their features. This implies that with upgrades, platform or workflow changes, users always need to port their preference settings. Fonts remain what they are, whatever the platform or workflow. </p>
      <p>As regards language/script tags in the font's feature coding. I agree that most such issues are not design related. Some are, though. Russian vs Bulgarian glyph shapes, different diacritics in some languages…</p>
