    html: |-
      <p>Adam — First of all, thank you for your always exhaustively and logically structured clarifications.</p>
      <p>If I understand it correct and may complete your explanation, each (properly set-up) OpenType font includes (1) tables, (2) glyph classes, (3) languagesystems, (4) features, (5) lookups and (6) statements, and lists their names and defines them, with the exception of tables (which are constituted by the OT format as such) and of statements (which are nameless definitions by themselves.)</p>
      <p><strong>List Order</strong> — The five aforementioned types of OT components, must be listed in a logical order. It is not all too clear what that order ideally must be. Two different relationships of chronological hierarchy are to be taken into considerations. There is (1) the list order of those five types of components as regards each other, (2) the order of instances of these component types amongst themselves.<br>
         As for the first, I guess, the above itemisation represents a quite common, perhaps even (partly) obligatory hierarchy, with the exception that, in the example files I looked into, languagesystems are stated within features, rather than that features "are mapped to a tree structure of (…) language systems", as you say they are. As for the second, it is my understanding that the order in which the tables are listed is of no relevance (i.e. has no consequences for the behaviour of the font during its interpretation by the OT engine), apart from the fact that the head, name and base tables should go first, in that order, and that furthermore the GSUB table, for instance, doesn't have to be stated explicitly. Neither so, complies the order of glyph classes to any prescription, unless glyph classes contain other classes, in which case they must evidently be listed below those which they contain. The order in which features and lookups are listed, conversely is of crucial importance, because of changed contexts that might affect later substitutions.<br>
         However, in the .fea feature files I inspected, there seems to be no strict order for the listing of glyph classes, of features nor of lookups, apart from such a one that does not cause features and lookups to become obsolete. There is no really systematic structure. The structure I think to be able to recognise is that, first all glyph classes are defined, then the languagesystems, thereafter the naming list of features (within the aalt feature (!)), and lastly the explanation of these features, which on their turn both list and define lookups.<br>
         In short: (1) there is no list (index) for the tables (which is made redundant because of the OT specification itself), (2) there is a list of glyph class definitions, which precedes the features and lookups in which they will be used, (3) there must be a list of languagesystems, also preceding the features for which they will be needed, (4) there is a list of all features that are present in the font's feature file, namely listed <cite>within</cite> the aalt feature, which consequently is listed first and (5), contrary to what you seem to write, I find no such list for lookups. Lookups appear to be both listed and defined at the same within the features, at the moment they are needed first. To me, it seems indeed useful to define lookups only at the moment they will be called for, for the first time, but this should also apply for glyph classes. This would facilitate scripting and the reuse of code snippets into other feature files.<br>
         I do not understand what you mean by an "n:m map" — in the .fea example files I looked into (especially minionpro.fea, FontRevision 2.012), there seems to be no such thing. </p>
      <p><strong>Lookups</strong> — You write lookups "are actions that are performed on <cite>groups</cite> of glyphs". Does this imply there is no use for 'singleton' lookups (i.e. lookups that contain only one substitution or position change statement)? This would make sense, though, because of their extensibility and reuse in several following features. I notice however that, contrarily to what you seem to suggest, features do not contain lookup actions (mapped to languagesystems) only, but that they also define (isolated) actions that are not grouped into lookups.</p>
      <p><strong>Embedded features</strong> — You confirm that features cannot contain other features (and neither can lookups). As I mentioned above, there is however at least one exception, namely the aalt feature, which contains (lists) all other features in the font. May I conclude from this exception that the OT feature language syntax does allow for the embedding of features? I see at least one (to me) useful implementation, namely to have a 'default' feature (<code>dflt</code>), that, of course, should be applied by default by the OT engine, and which contains all the features the developer/designer of the font deems typographically necessary for his font, but which may be overruled by other features, accessed through the UI.</p>
      <p><strong>GSUB LookupType 2: one-to-many</strong> It's unfortunate indeed that this is not supported more widely, especially since the similar (and less useful) one-from-many (LookupType 3) is. I agree that there is no <cite>need</cite> to decompose the fi ligature for TRK, because of the workaround you mentioned. However, my proposed solution would imho not only be more elegant, it also solves the awkward collision of the overhanging f with the dotted i (for which the fi-ligature was needed in the first place), by substituting the f by an alternate buttonhooked f. But there are more useful implementations, such as the earlier mentioned insertion of hair spaces in a feasible punctuation spacing feature (<code>sppu</code>). An <code>insert</code> (substitute non-into-many) and <code>remove</code> (substitute many-into-none) command would alternatively offer the same flexibility.</p>
    html_clean: |-
