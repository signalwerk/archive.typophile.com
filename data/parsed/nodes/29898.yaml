      <p>BTW, all the substitution and positioning rules are stored (in a compiled form) in two tables: "GSUB" and "GPOS". There are many other tables in a font, such as "glyf" or "CFF " that store the glyph outlines (for OpenType TT or OpenType PS fonts, respectively), "name" that stores all the family and style names, copyright and version strings and other textual information, "OS/2" that stores some important style-linking and character set coverage information, "cmap" that stores the Unicode-to-glyph mapping information, "post" that stores the glyphnames in OpenType TT fonts, and many many others. </p>
      <p>I recommend taking a look at the OpenType specification at least to familiarize yourself with the purpose and the names of the tables included in the font. You can use a tool such as TTX ( <a href="http://www.font.org/software/ttx/" title="http://www.font.org/software/ttx/">http://www.font.org/software/ttx/</a> ) to convert a binary OpenType or TrueType font into XML and preview the internal table structure. </p>
      <p>A.</p>
