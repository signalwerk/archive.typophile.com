    html: |-
      <p>Thomas — I guess the technical, or rather logical, restriction for a many-into-many substitution is the ambiguous nature of this kind of lookup type (which from many is to be substituted into which one out of the other group of many?), as Adam wrote somewhere.</p>
      <p>Lookup Type 2 (one-into-many), however, is in the OT specs, but hasn't been implemented yet. This should be done as soon as possible. As I said, commands such as 'insert' or 'remove' would be an alternative solution. One possible application I see is the contextual insertion of spaces (as they have Unicode codepoints). Too, editors could customise their OT fonts for all sorts of text editing specifications.</p>
      <p>As I understand it, 'nul' or 'nought' is in the OT specs as well, but hasn't been implemented either. 'sub x by nul;' would have the same effect as 'remove'.</p>
