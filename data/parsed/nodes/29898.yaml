      <p>Chris, </p>
      <p>my guess is that it was done not overcomplicate things. Currently, what you can do (in apps that support all lookup types) is replace one glyph by one (A -&gt; B), several glyphs be one (A B -&gt; C) or one by several (A –&gt; B C). There is always "one" included in each lookup type, so for a line layout engine, it’s comparably easy to track the character-to-glyph dependance and do things like "remove glyphs from the internal buffer" or "add glyphs to the internal buffer" is some subprocedures. A many-to-many lookup would introduce a situation where the internal buffer might grow or shrink or stay the same, all potentially in the same lookup. I guess it would be more difficult for layout engine developers to deal with this kind of "variability". </p>
      <p>Also, the AFDKO support for *building* OpenType tables and the type engines' support for *running* (i.e. "consuming) OpenType tables are somewhat different things. Of course, in a perfect case, both the development tools and the layout applications should support everything. </p>
      <p>A.</p>
