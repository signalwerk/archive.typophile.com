    html: |-
      <p>Adam —</p>
      <p>&gt; <cite>What exactly</cite> [sic] <cite>behaviors are there that cannot be</cite><br>
      &gt; <cite>implemented in calt, clig and liga? Please give an example.</cite></p>
      <p>What about spacing of punctuation, at least one example that has been given here repeatedly?  </p>
      <p>&gt; <cite>what makes you think that these applications will follow</cite><br>
      &gt; <cite>the next OpenType specification that includes “DFLT”? </cite></p>
      <p>I don't, as you would have known if you had actually read what I wrote instead of looking for opportunities to debunk: "I follow your interpretation about non-OT supporting applications expectedly not be willing to implement even a DFLT feature ever. I guessed so myself, *but* [etc]"</p>
      <p>&gt; <cite>You cannot apply “all features associated with DFLT”.</cite><br>
      &gt; <cite>DFLT is one feature. A feature cannot have many features.</cite><br>
      &gt; <cite>Your description doesn’t make sense.</cite></p>
      <p>You should remember I started this thread exactly with this question: "Is it allowed that a feature contains another feature?" So, apparently it isn't, that became clear early enough. No big deal, since features may contain lookups that are defined in other features. This is virtually the same as features being associated with other features. Just for the sake of proper wording: "Other features may be associated with the DFLT feature." = "The DFLT feature includes lookups that are defined in other features and excludes lookups from features it needs to overrule."</p>
      <p>&gt; <cite>You can already do this with “calt”, “liga” and “clig”.</cite><br>
      Again, yes, but not with anything else. Even less so with unregistered features.</p>
      <p>&gt; <cite>What is this, Jesus Christ performing wonders? If you add</cite><br>
      &gt; <cite>one feature to your font, you just add one feature to your font, not many.</cite></p>
      <p>No need for miracles, just plain efficient use of resources. If you rearrange the words from a given text, you create a new text; if you do it well, you create one that makes sense. Likewise, if you add a container for lookups from other features, that arranges its content in a specific new way, then you add a new feature; if the arrangement is done well, the new feature will make sense. If you add lookups to that very same container from features that are not otherwise accessible, you extend its functionality and hence practically add as many new features to your font.</p>
      <p>&gt; <cite>You cannot just list all features available in the font, blindly.</cite><br>
      Tss— your FontLab's OT Preview Panel does exactly this.</p>
      <p>&gt; <cite>The application needs to present those features</cite><br>
      &gt; <cite>with human-readable captions in the UI.</cite></p>
      <p>This is why I wrote: "If eventually feature tags would be expanded with name flags, for clarity the user app might list them instead of the four letter tags."</p>
      <p>&gt; <cite>Well, if half of the UI is static and half of it is dynamic, I don’t</cite><br>
      &gt; <cite>understand how anyone could call it “consistent”.</cite></p>
      <p>The static menu is for consistency (and benchmarking), the dynamic one offers additional functionality for advanced users, in exchange for less (anyhow logically impossible) consistency. This approach is in itself consistent.</p>
      <p>&gt; <cite>A dynamic menu has its problems as well. If the user selects</cite> [etc]<br>
      This is also the case with a static menu (e.g. InDesign's).</p>
      <p>&gt; […] <cite>special purpose that is limited only to specific writing systems</cite><br>
      &gt; […] <cite> Listing those features in menus would only clutter them</cite><br>
      Not if you group them by language system.</p>
      <p>&gt; <cite>I’m sorry, which suggestion!? I never suggested that you</cite><br>
      &gt; <cite>should do something on the character coding level.</cite></p>
      <p>In spite of my repeated arguments, you did that twice: "I replied to you: 'If you want a particular glyph appear by default when a particular Unicode codepoint is keyed in, the easiest way to achieve this is to simply assign that Unicode codepoint to that glyph. No extra OpenType features need to be applied then.'"</p>
      <p>&gt; <cite>Another alternative is of course to develop a text layout</cite><br>
      &gt; <cite>application that does just what you need, regardless of the “level”.</cite></p>
      <p>No need. Since this is being done already by accomplished people (<a href="//www.freedesktop.org/wiki/Software_2fHarfBuzz" rel="nofollow">Harfbuzz</a>, <a href="//scripts.sil.org/cms/scripts/page.php?site_id=nrsi&amp;item_id=CatGraphite" rel="nofollow">Graphite</a>, <a href="//scripts.sil.org/cms/scripts/page.php?site_id=nrsi&amp;item_id=xetex" rel="nofollow">XeTeX</a>, <a href="//wiki.contextgarden.net/Main_Page" rel="nofollow">ConTeXt</a>, <a href="//www.scribus.net/" rel="nofollow">Scribus</a>) who welcome ideas for extra functionality, do bother to conceive them, are unbiased about feature requests and usually don't need more than but a few days/weeks to implement them *and* release the upgrade — without all the bloating. </p>
      <p>&gt; <cite>I agree that argumenting</cite> [sic] <cite>with proposals that don’t make sense</cite><br>
      &gt; <cite>is a tough challenge, but I’m trying. (…) you tried how many<br>
      &gt; <cite>— five times? — to explain what you want to achieve with this,</cite><br>
      &gt; <cite>and nobody else stood up to admit that he or she understands your concept.</cite></cite></p>
      <p>I'll make no further attempts here to teach the dumb to speak, so that you won't feel urged to spill your energy on a sixth refutation.</p>
      <p>&gt; <cite>unless it turned out that I’m telling my story</cite><br>
      &gt; <cite>in Polish to a crowd of Hungarians</cite></p>
      <p>This may very well be the case. No offence to the Polish, though, for the blame may be on the Hungarians, notwithstanding that they are experienced and esteemed usurpators of Polish territory.</p>
    html_clean: |-
      <p>Adam —</p>
      <p>&gt; <cite>What exactly</cite> [sic] <cite>behaviors are there that cannot be</cite><br>
      &gt; <cite>implemented in calt, clig and liga? Please give an example.</cite></p>
      <p>What about spacing of punctuation, at least one example that has been given here repeatedly?  </p>
      <p>&gt; <cite>what makes you think that these applications will follow</cite><br>
      &gt; <cite>the next OpenType specification that includes “DFLT”? </cite></p>
      <p>I don't, as you would have known if you had actually read what I wrote instead of looking for opportunities to debunk: "I follow your interpretation about non-OT supporting applications expectedly not be willing to implement even a DFLT feature ever. I guessed so myself, *but* [etc]"</p>
      <p>&gt; <cite>You cannot apply “all features associated with DFLT”.</cite><br>
      &gt; <cite>DFLT is one feature. A feature cannot have many features.</cite><br>
      &gt; <cite>Your description doesn’t make sense.</cite></p>
      <p>You should remember I started this thread exactly with this question: "Is it allowed that a feature contains another feature?" So, apparently it isn't, that became clear early enough. No big deal, since features may contain lookups that are defined in other features. This is virtually the same as features being associated with other features. Just for the sake of proper wording: "Other features may be associated with the DFLT feature." = "The DFLT feature includes lookups that are defined in other features and excludes lookups from features it needs to overrule."</p>
      <p>&gt; <cite>You can already do this with “calt”, “liga” and “clig”.</cite><br>
      Again, yes, but not with anything else. Even less so with unregistered features.</p>
      <p>&gt; <cite>What is this, Jesus Christ performing wonders? If you add</cite><br>
      &gt; <cite>one feature to your font, you just add one feature to your font, not many.</cite></p>
      <p>No need for miracles, just plain efficient use of resources. If you rearrange the words from a given text, you create a new text; if you do it well, you create one that makes sense. Likewise, if you add a container for lookups from other features, that arranges its content in a specific new way, then you add a new feature; if the arrangement is done well, the new feature will make sense. If you add lookups to that very same container from features that are not otherwise accessible, you extend its functionality and hence practically add as many new features to your font.</p>
      <p>&gt; <cite>You cannot just list all features available in the font, blindly.</cite><br>
      Tss— your FontLab's OT Preview Panel does exactly this.</p>
      <p>&gt; <cite>The application needs to present those features</cite><br>
      &gt; <cite>with human-readable captions in the UI.</cite></p>
      <p>This is why I wrote: "If eventually feature tags would be expanded with name flags, for clarity the user app might list them instead of the four letter tags."</p>
      <p>&gt; <cite>Well, if half of the UI is static and half of it is dynamic, I don’t</cite><br>
      &gt; <cite>understand how anyone could call it “consistent”.</cite></p>
      <p>The static menu is for consistency (and benchmarking), the dynamic one offers additional functionality for advanced users, in exchange for less (anyhow logically impossible) consistency. This approach is in itself consistent.</p>
      <p>&gt; <cite>A dynamic menu has its problems as well. If the user selects</cite> [etc]<br>
      This is also the case with a static menu (e.g. InDesign's).</p>
      <p>&gt; […] <cite>special purpose that is limited only to specific writing systems</cite><br>
      &gt; […] <cite> Listing those features in menus would only clutter them</cite><br>
      Not if you group them by language system.</p>
      <p>&gt; <cite>I’m sorry, which suggestion!? I never suggested that you</cite><br>
      &gt; <cite>should do something on the character coding level.</cite></p>
      <p>In spite of my repeated arguments, you did that twice: "I replied to you: 'If you want a particular glyph appear by default when a particular Unicode codepoint is keyed in, the easiest way to achieve this is to simply assign that Unicode codepoint to that glyph. No extra OpenType features need to be applied then.'"</p>
      <p>&gt; <cite>Another alternative is of course to develop a text layout</cite><br>
      &gt; <cite>application that does just what you need, regardless of the “level”.</cite></p>
