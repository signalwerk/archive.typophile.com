      <p>Not sure about 1 and 2, but 3 is not allowed as far as I know. Do this instead:</p>
      <p><code>sub glyph.1.a' glyph.2.a by glyph.1.b ;<br>
      sub glyph.1.b glyph.2.a' by glyph.2.b ;<br>
      </code></p>
      <p>Only one substitution per statement, but easy enough to work around.</p>
