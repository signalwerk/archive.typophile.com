  - id: 173306
    user: 1133
    date: 2006-12-13T14:52:00
    date_raw: 13 Dec 2006 — 2:52pm
    votes: null
    html: |-
      <p>&gt; its purpose is to combine the functions<br>
      &gt; of both registered and unregistered<br>
      &gt; features</p>
      <p>What for? What exactly behaviors are there that cannot be implemented in calt, clig and liga? Please give an example. </p>
      <p>&gt; Not all applications enable clig and the<br>
      &gt; like by default or even give access to them </p>
      <p>But the OpenType specification recommends that they should. If applications don't follow the current OpenType specification, what makes you think that these applications will follow the next OpenType specification that includes "DFLT"? </p>
      <p>&gt; If they would support the DFLT feature<br>
      &gt; and by preference would enable it by default, </p>
      <p>Right, "if". But if the applications makers take the time to implement this new feature, they will probably also take the time to implement existing features properly. </p>
      <p>&gt; they would apply all features that are<br>
      &gt; associated with DFLT at once, </p>
      <p>You cannot apply "all features associated with DFLT". DFLT is one feature. A feature cannot have many features. Your description doesn't make sense. </p>
      <p>&gt; without having to further implement a complex<br>
      &gt; OT menu (which one can expect only to be<br>
      &gt; available in advanced layout applications). </p>
      <p>You can already do this with "calt", "liga" and "clig". They are applied by default in UI-less applications such as Notepad on Windows (if complex script processing is activated in the system). </p>
      <p>&gt; Also, unregistered features and/or other<br>
      &gt; registered features that likely will<br>
      &gt; never be implemented in even the most<br>
      &gt; sophisticated of user applications<br>
      &gt; would be available without having to<br>
      &gt; rely on UI support, as long as they<br>
      &gt; are associated with DFLT. This way,<br>
      &gt; font developers would have the flexibility<br>
      &gt; to devise and add as many features to their<br>
      &gt; fonts, </p>
      <p>Heee? By adding one feature, font developers would add "as many features as they want". What is this, Jesus Christ performing wonders? If you add one feature to your font, you just add one feature to your font, not many. </p>
      <p>&gt; (3) Could you state those important reasons<br>
      &gt; or advantages why developers would prefer<br>
      &gt; static over dynamic OpenType feature lists? </p>
      <p>You cannot just list all features available in the font, blindly. The application can only support a certain number of registered features, for the simple reason that each feature in the font is only labeled with a four-letter tag. The application needs to present those features with human-readable captions in the UI, in a logical order, grouped into some sections (e.g. all the features that regard numerals would be listed together). </p>
      <p>Also, many registered OpenType feature have a special purpose that is limited only to specific writing systems (e.g. Arabic, Devanagari, Japanese), is used in certain combination with other features and should be only called automatically by the layout engine in specific contexts. Listing those features in menus would only clutter them, and the ability to invoke them arbitrarily would give no benefit to the user. </p>
      <p>If activated, some features such as "liga" or "smcp" are supposed to be applied to entire runs of text, while other features such as "fina" or "init" are supposed to be applied only to specific characters (first, last) in a word. In other words, with each registered OpenType feature, an application needs to *know* what to do with it, and what purpose this feature serves. This is an essential element of the OpenType Layout format, and it is its essential difference from AAT (Apple Advanced Typography). In OpenType, the "intelligence" is shared between the font and the application, in AAT, the "intelligence" is all in the font. </p>
      <p>So in AAT (formerly known as TrueType GX), all the burden of implementing a complex typesetting system is placed on the font vendor, which potentially gave great flexibility but in practice resulted in very few GX/AAT fonts ever produced, most of them by or for Apple directly. Microsoft and Adobe learned from this lesson and implemented a system that is more pragmatic, and while having some limitations regarding flexibility, it *actually gets implemented*. </p>
      <p>AAT was an attempt to build a vehicle that can swim, drive and fly, all at the same time, and all to an excellent degree. OpenType understands that you should either build a car, or a plane, or a boat, and that a Formula 1 racing car will not necessarily perform well on a desert or in the jungle. </p>
      <p>&gt; If it is for consistency, applications could<br>
      &gt; at any time implement both static (with standard<br>
      &gt; features) and dynamic (with all other features<br>
      &gt; that are in the font) OT menu palettes.</p>
      <p>Well, if half of the UI is static and half of it is dynamic, I don't understand how anyone could call it "consistent". </p>
      <p>A dynamic menu has its problems as well. If the user selects a text that is set in roman type with some words set in italic, and the roman font has small caps but no swashes and the italic fonts has swashes but not small caps, what would the menu show and why? </p>
      <p>&gt; Your earlier suggestion to nevertheless impinge<br>
      &gt; on the character coding therefore doesn’t fit<br>
      &gt; the purpose. </p>
      <p>I'm sorry, which suggestion!? I never suggested that you should do something on the character coding level. </p>
      <p>&gt; However, in as far as OpenType support doesn’t<br>
      &gt; allow (yet) for more advanced tasks (one-into-many<br>
      &gt; substitutions, operator values for sequences,<br>
      &gt; language support), I considered scripting with<br>
      &gt; regular expressions to be a practicable alternative.</p>
      <p>Another alternative is of course to develop a text layout application that does just what you need, regardless of the "level". </p>
      <p>&gt; If application developers however consider my<br>
      &gt; proposals being nonsensical, then be it so. </p>
      <p>I cannot speak for typographic application developers (because I'm not one), but as a type designer, typographic engineer, typesetter, and a person involved in software creation, I do consider your proposal for the "DFLT" feature completely nonsensical. </p>
      <p>&gt; It would be a pity if they would disregard<br>
      &gt; useful recommendations, </p>
      <p>I agree that *useful* recommendations should be taken into consideration by application developers. I don’t think your "DFLT" proposal fulfils this criterion though. </p>
      <p>&gt; Thus far, your counter argumentation has not<br>
      &gt; been valid, nor convincing and is at several<br>
      &gt; instances contradicting itself.</p>
      <p>I agree that argumenting with proposals that don't make sense is a tough challenge, but I'm trying. </p>
      <p>You surely have an interest and a dedication, and some energy to spend. I'd recommend that you continue your studies of type and the technology, and try to really understand all the variables involved. The OpenType font format has been developed and shaped to a certain stadium for the last 10 years by a collective mind of application developers, typographic engineers, type designers and typographers. Not everybody is happy with everything, but there is a common ground on which things operate. </p>
      <p>A "DFLT" feature certainly does not fit onto this ground -- by miles. Among others, because it by no means specifies the use and purpose of this feature. Within the domain of OpenType, people agreed that functionalities that can do "all or nothing, anything or everything" do not have a place, because it is difficult to communicate what that particular functionality is all about to other parties involved. Your case is a perfect example of this failure: you tried how many -- five times? -- to explain what you want to achieve with this, and nobody else stood up to admit that he or she understands your concept. If I were talking to a crowd explaining my concept, and nobody seemed to understand what I'm saying, for me it would be a hint that perhaps my concept has serious flaws (unless it turned out that I'm telling my story in Polish to a crowd of Hungarians). </p>
      <p>I encourage you to work out solutions and concepts, but also to listen to experienced people in the field. In many cases, they have (mentally, conceptually) "been there, done that". Of course there always is a chance that you may discover a major omission in your predecessors' reasoning and figure out that the Earth is round rather than flat. But either way, a thorough study of the subject is required. </p>
      <p>A.</p>
