      <p>Hm, I think the point Adam Twardoch makes is this:<br>
      Applications that do support OT features, do it the right way, i.e. liga or calt will be on by default -- which means that no additional feature is required. Applications that do not support OT features, will not support a DFLT feature either.</p>
      <p>The more interesting question to me is, where to draw the line between things addressed by the application, and things addressed by the font. This is not an easy decision.<br>
      Personally, I am unhappy that there are language/script tags <cite>at all</cite> in fonts, for I think that all a font should be is a collection of glyph designs, a table to map glyphs to characters, and some OT features [a] to help the application find alternate glyph sets and [b] do some <cite>design related</cite> (contextual) substitution/positioning -- in short: provide applications with the resources with which applications can do smart things.* Following this logic, even punctuation spacing is something that, strictly speaking, should be offered by applications rather than by fonts. I encourage everyone to send a feature request to Adobe, see the link already provided <a href="http://typophile.com/node/29898#comment-171725" rel="nofollow">here</a>.</p>
      <p>* An example: It is quite unhappy that things like Turkish i/dotlessi in liga and smcp, or germandbls in smcp, are dealt with on font level. InDesign CS2 is a noteworthy exception: When applying Small Caps, first it switches from lowercase to uppercase on application level and then applies s2sc feature to map to small caps. Similarly, it turns germandbls into S S, which then will become S.smallcap S.smallcap.<br>
      Then, as soon as a question like 'how to address a text string of 3 or 4 characters length?' turns up, this indicates that here is something which is better solved on application level.</p>
      <p>Adam Twardoch's remarks are backed by his knowledge of, and experience with, font and application development and testing, unicode and related issues (his website, which is understatement rather than boasting, gives an idea of this).</p>
