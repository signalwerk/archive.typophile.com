    <p>(1) Is it allowed to include <code>LOOKUP</code>s into another lookup?<br>
    (2) Is it allowed that a <code>FEATURE</code> contains another feature?<br>
    (3) What about multiple substitutions, like <code><strong>sub</strong> glyph.1.a<strong>'</strong> glyph.2.a<strong>'</strong> <strong>by</strong> glyph.1.b glyph.2.b</code>? Is this forbidden in OT syntax as such or is this kind of substitution simply not implemented in user apps to-date?</p>
    <p>( P.S. Sorry for these obvious questions, but the <a href="//typophile.com/wiki/OT_How-To" rel="nofollow">How-To Wiki</a> here is not really helpful as regards useable info on syntax rules &amp;c. The Adobe website pages to which it refers are a mess to navigate and I can find no printable document for the OpenType specs and syntax. If some pdf is available with this kind of (exhaustive!) documentation, please refer me to the link.)</p>
