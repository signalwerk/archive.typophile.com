      <p>Just to clarify, one thing that is not supported in the OpenType *format* itself is many-to-many substitutions as a single substitution. This is not a matter of text engine support, but of format support. As I understand it, this was a deliberate decision, not something overlooked.</p>
      <p>Regards,</p>
      <p>T</p>
