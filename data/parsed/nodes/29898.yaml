      <p>I believe the biggest problem of the DFLT feature is that its purpose is underspecified. All other OpenType Layout features have a clearly devised function, purpose. As far as I understand, the idea behind "DLFT" is to have some sort of "wildcard" feature. But my understanding of the OpenType specification is that its makers specifically did not want to allow this kind of arbitrary, wildcard behavior. </p>
      <p>A.</p>
