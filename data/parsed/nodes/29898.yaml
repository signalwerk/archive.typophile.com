      <p><strong>GSUB LookupType 2: one-to-many</strong> It's unfortunate indeed that this is not supported more widely, especially since the similar (and less useful) one-from-many (LookupType 3) is. I agree that there is no <cite>need</cite> to decompose the fi ligature for TRK, because of the workaround you mentioned. However, my proposed solution would imho not only be more elegant, it also solves the awkward collision of the overhanging f with the dotted i (for which the fi-ligature was needed in the first place), by substituting the f by an alternate buttonhooked f. But there are more useful implementations, such as the earlier mentioned insertion of hair spaces in a feasible punctuation spacing feature (<code>sppu</code>). An <code>insert</code> (substitute non-into-many) and <code>remove</code> (substitute many-into-none) command would alternatively offer the same flexibility.</p>
