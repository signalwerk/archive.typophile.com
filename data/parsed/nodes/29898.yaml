      <p>Karsten — Thank you very much for the links. I did find your pdf link list already and it’s a great help. It seems I'll have to do without a "OT for Dummies" like, printed manual.</p>
      <p>There are several space characters in Unicode (have a quick overview <a href="http://www.cs.tut.fi/~jkorpela/chars/spaces.html" rel="nofollow">here</a>). If you put those in your fonts, you can determine yourself what should be the ideal width for e.g. hair space, instead of relying on the user app. I am not sure in how far page lay-out applications such as InDesign or Quark actually use the space's advance width information in the font: maybe it's ignored, or overruled by the program's default H&amp;J parameters. (Likely the regular word space is accepted, but as it seems most fonts designers don't consider the space character, the user app has its own default widths. This goes for the regular inter-word breaking space, but probably even more so for thin space, hair space and the like.) Nevertheless, if the font would have all those spaces included, and if it would have an OT feature which contextually inserts these spaces, typesetting at the micro-typographical level would get much easier, better, and because of the automation it would be seen more often (font designers, being aware of the possibility, would put this feature in their fonts).</p>
      <p>I considered to use the <code>pos</code> command instead of substitutions too, mainly as a workaround, because Lookup Type 2 (one-into-many) isn't supported. But position changes are much harder to implement, need more code and hence are a less elegant solution. Too, the insertion of a no-break space (uni00A0), e.g. between day and month, is not possible.</p>
      <p>Now, some will argue that these kind of uses, which actually affect the typography of the text, are in opposition with the intended use of the OpenType format, that they belong to the task of the typesetter/typographer, or that of the editor, and they really shouldn't be a feature of the font. Hence, the page lay-out program should be responsible for them. I put forward, however, that the present generation of typesetting programs is not capable to do this yet, or at least does not offer the possibility — with the exception of TeX and its various distributions. Furthermore, one could argue that spacing depends on the design of the typeface and should hence be dictated by the type designer. If a typographer doesn't agree with the type designer's settings, he would still have the possibility to overrule them. Also, it is improbable that lay-out programs would apply spacing by default, so that users who are not aware of micro-typographical issues (i.e. most users), will never use the feature, and as a result, the vast majority of typesetting would be devoid of it. Is this a problem? Yes, to me it is, and to all who care for typography, just as the absence of ligatures in most publications that came under their eyes, was to their annoyance, before the advent of OT and InDesign's default application of them. Ligatures were possible, sure, with the tedious use of Expert Sets, but before OT, they were but seldom used. </p>
      <p>Yes, I'm an enthusiast, and probably may seem naïve as well. Nevertheless I do am aware that as font developers we depend completely from the developers of user apps. We may invent all sorts of uses, devise even new OT features, but as long as these are not supported, because application programmers find them "crazy", it's of no use. This is exactly why I advocated that rather than adding support for features, the developers of the user apps, should concentrate on the implementation of the OT format as such, and of all its Lookup Types. This, along with the DFLT feature I proposed on <a href="//typophile.com/node/29648?from=50&amp;comments_per_page=50 " rel="nofollow">the other thread</a>, would give font developers the flexibility they need, without having to rely on the support of apps any further. (Backward compatibility is another issue.) As long as this is not the case, I'm afraid, engineers and programmers, will be imposing which is proper design and which is not — such as the discretionary oldstyle use of the ampersand. (Sorry, Adam ;-) As font designers, I think we have the duty of being enthusiasts, and as users, we have the privilege to make suggestions, even if in the eyes of engineers they seem improbable. I am not asking for unrealistic things. I am no programmer, granted, but I do have an understanding of what computer programs are capable of and how they work. After all, the implementation of Lookup Types is not that hard, and to me it is a matter of the willingness to it, rather than the technical impossibility of it.</p>
    html_clean: |-
