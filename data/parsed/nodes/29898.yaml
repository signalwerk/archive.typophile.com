    user: 1133
    date: 2006-12-04T15:06:00
    date_raw: 4 Dec 2006 — 3:06pm
    votes: null
    html: |-
      <p>Ludwig, </p>
      <p>1. A lookup can apply to singleton glyphs, classes, series of singleton glyphs, or series of classes. By "groups" in my former description, I meant a generalization of those, i.e one or more glyphs. </p>
      <p>2. Changing spacing of characters does not have to be done through inserting glyphs. The OpenType positioning statements <code>pos glyphname &lt;dx1 dy1 dx2 dy2&gt;;</code> allow you to change the position of the current and the next glyph origin. For example, <code>pos A &lt;200 0 400 0&gt;</code>;" moves the glyph origin of the "A" glyph by +200 units (therefore, effectively, increasing the LSB of "A" by 200 units) and moves the next glyph origin by +400 units (therefore, effectively, increasing the RSB of "A" by another 200 units). <code>pos parenleft &lt;0 100 0 0&gt;;</code> moves the glyph origin of parenleft (i.e. the glyph itself) by 100 units up. </p>
      <p>3. One thing that you need to understand is that the internal structure of the OpenType GSUB and GPOS tables is different than the AFDKO source code syntax that is used to describe the OpenType Layout feature definitions in FontLab Studio and Adobe FDK for OpenType. The AFDKO syntax simplifies the creation of lookups and some features in two ways: </p>
      <p>- For "aalt", it provides a simplified syntax; what actually gets done is that all lookups that are associated with all the features that are enumerated in the "aalt" definition also get associated with "aalt". In other words, the special AFDKO syntax for "aalt" hides some implementation specifics; in reality, there still is no "features within features". </p>
      <p>- Lookups in the AFDKO syntax are defined within feature definitions. Lookups don't even have to be named explicitly. </p>
      <p>The AFDKO syntax: </p>
      <p><code>languagesystem latn dflt;<br>
      languagesystem latn TRK;<br>
      feature smcp {<br>
      &nbsp;&nbsp;sub [a b c f g l u] by [A.smcp B.smcp C.smcp F.smcp G.smcp L.smcp U.smcp];<br>
      } smcp;<br>
      feature liga {<br>
      &nbsp;&nbsp;lookup liga_i {<br>
      &nbsp;&nbsp;  sub f i by f_i;<br>
      &nbsp;&nbsp;} liga_i;<br>
      &nbsp;&nbsp;lookup liga_noi {<br>
      &nbsp;&nbsp;  sub f l by f_l;<br>
      &nbsp;&nbsp;} liga_noi;<br>
      language TRK exclude_dflt;<br>
      &nbsp;&nbsp;lookup liga_noi;<br>
      } liga;</code></p>
      <p>actually compiles to something like this (this is in pseudosyntax): </p>
      <p><code># LOOKUPS </code></p>
      <p>lookup L01 {<br>
      &nbsp;&nbsp;sub [a b c f g l u] by [A.smcp B.smcp C.smcp F.smcp G.smcp L.smcp U.smcp];<br>
      } L01; </p>
      <p>lookup L02 {<br>
      &nbsp;&nbsp;sub f i by f_i;<br>
      } L02; </p>
      <p>lookup L03 {<br>
      &nbsp;&nbsp;sub f l by f_l;<br>
      } L03; </p>
      <p># FEATURES</p>
      <p>script "latn";<br>
      &nbsp;&nbsp;DefaultLangSys;<br>
      &nbsp;&nbsp;  feature "liga" {<br>
      &nbsp;&nbsp;    lookup L02;<br>
      &nbsp;&nbsp;    lookup L03;<br>
      &nbsp;&nbsp;  } liga;<br>
      &nbsp;&nbsp;  feature "smcp" {<br>
      &nbsp;&nbsp;    lookup L01;<br>
      &nbsp;&nbsp;  } smcp;<br>
      &nbsp;&nbsp;LangSys "TRK";<br>
      &nbsp;&nbsp;  feature "liga" {<br>
      &nbsp;&nbsp;    lookup L03;<br>
      &nbsp;&nbsp;  } liga;<br>
      &nbsp;&nbsp;  feature "smcp" {<br>
      &nbsp;&nbsp;    lookup L01;<br>
      &nbsp;&nbsp;  } smcp;</p>
      <p>While the AFDKO syntax: </p>
      <p><code>languagesystem latn dflt;<br>
      languagesystem latn TRK;<br>
      feature liga {<br>
      &nbsp;&nbsp;lookup liga_i {<br>
      &nbsp;&nbsp;  sub f i by f_i;<br>
      &nbsp;&nbsp;} liga_i;<br>
      &nbsp;&nbsp;lookup liga_noi {<br>
      &nbsp;&nbsp;  sub f l by f_l;<br>
      &nbsp;&nbsp;} liga_noi;<br>
      language TRK exclude_dflt;<br>
      &nbsp;&nbsp;lookup liga_noi;<br>
      } liga;<br>
      feature smcp {<br>
      &nbsp;&nbsp;sub [a b c f g l u] by [A.smcp B.smcp C.smcp F.smcp G.smcp L.smcp U.smcp];<br>
      } smcp;</code></p>
      <p>actually compiles to something like this: </p>
      <p><code># LOOKUPS </code></p>
      <p>lookup L01 {<br>
      &nbsp;&nbsp;sub f i by f_i;<br>
      } L01; </p>
      <p>lookup L02 {<br>
      &nbsp;&nbsp;sub f l by f_l;<br>
      } L02; </p>
      <p>lookup L03 {<br>
      &nbsp;&nbsp;sub [a b c f g l u] by [A.smcp B.smcp C.smcp F.smcp G.smcp L.smcp U.smcp];<br>
      } L03; </p>
      <p># FEATURES</p>
      <p>script "latn";<br>
      &nbsp;&nbsp;DefaultLangSys;<br>
      &nbsp;&nbsp;  feature "liga" {<br>
      &nbsp;&nbsp;    lookup L01;<br>
      &nbsp;&nbsp;    lookup L02;<br>
      &nbsp;&nbsp;  } liga;<br>
      &nbsp;&nbsp;  feature "smcp" {<br>
      &nbsp;&nbsp;    lookup L03;<br>
      &nbsp;&nbsp;  } smcp;<br>
      &nbsp;&nbsp;LangSys "TRK";<br>
      &nbsp;&nbsp;  feature "liga" {<br>
      &nbsp;&nbsp;    lookup L02;<br>
      &nbsp;&nbsp;  } liga;<br>
      &nbsp;&nbsp;  feature "smcp" {<br>
      &nbsp;&nbsp;    lookup L03;<br>
      &nbsp;&nbsp;  } smcp;</p>
      <p>Note that in both cases, the order of the features in the compiled format is the same. Only the order of the lookups differs, and it is inferred from the order in which the lookups are defined (implicitly or explicitly) in the AFDKO syntax. Also note that the lookups don't have any actual names, the "L##" convention I used is just an example. Internally, numbers are just used. </p>
      <p>The problem with the second implementation is that if a user applies both "liga" and "smcp" to the word "flug", the L01 lookup replaces the glyph sequence "f l" by a glyph "f_l", and then, lookup L03 replaces the glyphs "u" with "U.smcp" and  "g" with "G.smcp". You end up with the glyph sequence "f_l U.smcp G.smcp", which is surely not what you wanted.</p>
      <p>In the first, correct, implementation, the lookup L01 replaces "f" with "F.smcp", "l" with "L.smcp", "u" with "U.smcp" and "g" with "G.smcp", and then L02 is executed but has nothing to replace. You end up with the string "F.smcp L.smcp U.smcp G.smcp", which is probably what you wanted. </p>
      <p>This illustrates why the sequence in which you define your lookups is important. In the AFDKO syntax, it means that the sequence in which you place the feature definition blocks is important, but when the font is generated, the AFDKO compiler will extract all the (implicit and explicit) lookup definitions from the feature definition blocks, create a lookup list from them (in the order they come in), and then the compiler will build a list of features (sorted alphabetically) and will map the lookups to the appropriate features within the appropriate languagsystem contexts. </p>
      <p>In AFDKO 2.0, it is possible to defined named lookups in the order you want outside of the feature definition blocks. This is sometimes useful if you want to, on one hand, precisely control the sequence of lookups while on the other hand, re-use lookups in different features. </p>
      <p>A.</p>
