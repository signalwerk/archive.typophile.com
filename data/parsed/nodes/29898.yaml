      <p>Also, one-to-many substitutions (GSUB LookupType 2) are unfortunately not widely supported in OT Layout engines. For example, the normal international versions of InDesign, Illustrator or Photoshop do not support them (the Middle Eastern versions do). </p>
      <p>There is no need, however, to decompose the fi ligature into anything. The currently preferred implementation of the Turkish ligature behavior is by applying a "locl" feature in the Turkish languagesystem context (latn/TRK). That feature should be mapped to a lookup that substitutes the "i" glyph with a "i.TRK" glyph which is identical in appearance. More on this in <a href="http://typophile.com/node/29469" title="http://typophile.com/node/29469">http://typophile.com/node/29469</a> </p>
      <p>Regards,<br>
      A.</p>
