      <p>Adam, Thomas — Sorry I didn't reply sooner. I have no time to explain the idea in full. The basic concept is quite simple, though. (1) A DFLT feature should be registered. (2) Implement the DFLT feature in the user application, have it checked-on by default (i.e. the application's OT engine should look for the presence of a DFLT feature in the font, and if so, should run all its functions). But allow the user to uncheck the feature. (3) Font developers associate all the usual lookups (associated with registered features) they deem essential to their font to the DFLT feature (such as some or all lookups from e.g. LIGA, CLIG, CALT, with or without language system specific exception rules and/or contextual rules), expanded with custom lookups (that do not fit into registered features and are hence not otherwise accessible). Of course they should take care the lookups are defined in the proper sequence and that they are defined thusly that for example strings of uppercases only are substituted with small caps. The DFLT feature is truly a default (generic) feature in that for more specific formatting or local exceptions the intervention of the user is required through the OT palette. Also, the font developer should not compromise the usability of his font by associating extravagant substitution lookups with the DFLT feature. (4) If this all were to be implemented, user applications (only those that already support OT, of course, i.e. are equipped with an OT engine), wouldn't have to worry about adding feature checkboxes in the UI, while the DFLT feature would take care of a font's most essential features (such as ligatures in MS Word). Font developers on the other hand, would have more flexibility in that they could add unregistered custom-made features to their fonts, having them function by associating them with the DFLT feature.</p>
      <p>Additionally, I wonder if it were feasible if the user application could generate a dynamic menu of available features in a font, instead of presenting the user with a fix and inflexible menu, such as is the case now. The OT menu in InDesign, e.g., lists but a standard menu of features which the user can check or uncheck, putting those features that are not available in the font between square brackets, but leaving out features that are present in the font but are not supported. I think this (having the user app generate a dynamic OT menu on the fly) could be easily done. The AALT feature already lists all available features within a font, so the user app would have but to display them with checkboxes. If eventually feature tags would be expanded with name flags, for clarity the user app might list them instead of the four letter tags.</p>
      <p>As regards the support for Lookup Types, I wonder in what way the OT format differs from or makes use of / is compatible with <a href="http://www.regular-expressions.info/" rel="nofollow">Regular Expressions</a> (<a href="//en.wikipedia.org/wiki/Regular_expression" rel="nofollow">Wikipedia info</a>). Would macro scripting, taking advantage of regular expression, offer an alternative to solve typesetting issues that cannot be solved with OT features?</p>
