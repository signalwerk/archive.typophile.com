      <p><cite>Yes, I’m an enthusiast, and probably may seem naïve as well.</cite></p>
      <p>Hope you didn't read this as an insult -- because the description fits for one of my former selves too (say, the one of three to two years ago). I said farewell to PS T1 fonts three years ago and stick to OTFs, but have to face the <cite>fact</cite> that most collegues (designer, typographer) are rather afraid of OTF, and that there are people who still don't know what "this OTF thing" is.</p>
      <p>Using positioning instead of space substitution for punctuation spacing is no disadvantage. As to feature code, it is virtually the same. If you can insert a space in certain contexts, you can increase the advance width of a glyph or glyph class as well; it is neither more nor less code.<br>
      I too try to put as much "typographic knowledge" into fonts as possible, as I indicated when saying that I already include a feature for spacing punctuation marks. (It's in a Stylistic Set feature so users can switch it off. One must not forget that spacing rules are very different in different countries.) Related to this, I am working on a contextual positioning feature which spaces uppercase letters differently in lowercase and uppercase-only context (I think that increasing advance width or sidebearings at a fixed value for all glyphs is not enough, typographically). To date, I used an additional set of uppercase glyphs that are substituted in uppercase-only context; but this blows up the glyph set unnecessarily.<br>
      Whenever you take advantage (typographically, pleasing the user, technically, pleasing yourself when producing fonts) of aspects of OpenType that are supported by a few new applications, you risk that your fonts or parts of them are incompatible with most applications. Even very tiny details can have a huge effect:<br>
      Say, you make PS-OT (CFF-OT) fonts. You can sort glyphs nicely, so the application's glyph palette shows a well ordered glyph set. But if you do this, and if you use this font in MacOS9 applications other than InDesign, then the (German keyboard) Euro-shortcut will not return the Euro sign but the currency symbol ...<br>
      Or, you could solve the kern feature subtable overflow problem with a little addition (no need to care for subtable breaks) -- but: such a kern feature will be <cite>completely</cite> ignored by most applications.<br>
      Whenever you incorporate very recent OT things you have to remember that you exclude many people from being able to use your fonts.</p>
      <p>As to the ampersand, I use it whenever possible, but this is nothing that I would impose on others. If you consider it to be an essential part of your type design, put it into liga or calt which are on by default at least in typographically sensitive applications.</p>
