      <p>Adam —</p>
      <p>&gt; <cite>Inserting spacing glyphs doesn’t make sense</cite> (…)<br>
      Again: what about the no-break space? And what if the user changes tracking or applies Optical Kerning instead of the font's metrics? Positioning values are expressed absolutely, and not as a relative amount (percentage). </p>
      <p>&gt; <cite>simply assign that Unicode codepoint to that glyph</cite><br>
      This is really no solution, since there are no Unicode codepoints for each and every glyph shape the font designer may devise — this is exactly what OpenType, the Unicode Private Area and unassigned glyphs is all about, isn't it? Assigning the lowercase Unicode codepoints to the small caps glyphs, as you propose, is certainly not what we would want to do, for we do not want to regress into the practices from the days of Expert Set fonts, do we?</p>
      <p>Thanks for the coding, I'll give it a try. Would it be possible to define a minimum/maximum amount of glyphs in a string, so that a sequence of three uppercases would be substituted by intermediate caps, those of four or more by small caps? I realise that this "smartness may backfire". However, experienced typographers would always have the possibility to overrule/disable the feature. Also, I think most of these substitutions could and should be in accordance with generally accepted traditions of good typographic practice (Oxford Rules, Chicago Manual). As Karsten put it, I too like to have "as much typographic knowledge build into the font as possible".</p>
