      <p>Generally, I would suggest shopping your proposal on the OpenType mailing list first, and getting feedback. That can give you a pretty good idea of the likelihood of your proposal getting adopted. Not all the key players hang out on Typophile.</p>
      <p>Personally, I am a bit skeptical of the need for a DFLT feature. The main dividing line out there is not between applications supporting a couple of features and applications supporting many, it's between applications supporting features versus those not supporting any features. If you're talking features that would all be on by default and have no UI, supporting a single OpenType layout feature that can use many lookup types is not particularly easier than supporting a whole bunch of OpenType layout features. The problem is getting into OpenType at all, really.</p>
      <p>Cheers,</p>
      <p>T</p>
