      <p>&gt; What about spacing of punctuation, at least one<br>
      &gt; example that has been given here repeatedly?</p>
      <p>Why can't you use the "calt" feature for that? </p>
      <p>&gt; &gt; A dynamic menu has its problems as well.<br>
      &gt; &gt; If the user selects [etc]<br>
      &gt; This is also the case with a static menu (e.g. InDesign’s).</p>
      <p>Heh? Have you ever tried it? In TextEdit or Keynote, you cannot turn on or off ANY features if you have selected a text run that involves different fonts. In InDesign, sure you can -- the features will be turned on and off appropriately. </p>
      <p>&gt; &gt; […] special purpose that is limited only to<br>
      &gt; &gt; specific writing systems<br>
      &gt; […] Listing those features in menus would<br>
      &gt; &gt; only clutter them<br>
      &gt; Not if you group them by language system.</p>
      <p>No, because the whole point is that an application is not supposed to list them in the UI *at all*. RTFM. </p>
      <p>&gt; Tss— your FontLab’s OT Preview Panel does exactly this.</p>
      <p>Exactly -- this is why it wouldn't make sense in an end-user application, though it works in a development tool.</p>
      <p>&gt; This is why I wrote: “If eventually feature tags would<br>
      &gt; be expanded with name flags, for clarity the user app<br>
      &gt; might list them instead of the four letter tags.” </p>
      <p>This is up for the consideration only for the ssXX features, nothing else. </p>
      <p>&gt; (Harfbuzz, Graphite, XeTeX, ConTeXt, Scribus) </p>
      <p>Harfbuzz is nothing else than an OpenType Layout engine, I very much doubt that it will implement behaviors that contradict the OpenType specification. Graphite uses a completely different layout system -- you're free to add tables for Graphite into your font, just like you are free to add AAT tables, but this has nothing to do with OpenType Layout. XeTeX implements AAT (on Mac OS X) and OpenType Layout (on all systems), and I doubt that Jonathan Kew will bend over backwards to do anything that breaks the spec, though AFAIK, he is also working on adding Graphite support to XeTeX. The creators of pdfTeX/ConTeXt have very ambitious plans for a complete TeX rewrite. I wish them well but I doubt it will happen in forseeable time. As for Scribus, I don't know much about it. </p>
      <p>Again -- you're free to develop a layout system on your own, or extend one of the existing ones, so that one particular application works the way you want it to work. There is nothing wrong with that. But it's a completely different goal than trying to expand an international ISO standard (which OpenType is: ISO/IEC 14496-22 "Open Font Format Specification") that is supposed to be used across various operating systems and applications. OpenType is not everybody's playground. Yes, there are things that you cannot do with OpenType, and this is so *by design*. Simple things gets adopted and implemented, complex things have a far lesser chance for that to be done. </p>
      <p>If you think that this is bias, then go kick the wall somewhere and chill down. Once your "DFLT" feature gets implemented in Harfbuzz, Graphite, XeTeX, ConTeXt or Scribus, please let me know! </p>
      <p>A.</p>
