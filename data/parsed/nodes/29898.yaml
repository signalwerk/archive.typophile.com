      <p>Karsten — No, be assured, I didn't take it as an insult, for I don't think it to be shameful not knowing all about something new. I am new to OT feature coding, and find the topic highly stimulating, because I realise it might solve lots of typographical issues that in the past were very hard to accomplish and practically undoable. But it does annoys me if people who are experts systematically dismiss the enthusiast's proposals as unfeasible. (This does not apply to you.) As a young, but old school typographer I seek to find a way to get the highest level of typography without the time and effort that was needed in the old days, *and* I actively look into the technical side of it, so as to find workable, not imaginary or utopian solutions. Not that I dislike the challenge of time-intensive work, but, as a pragmatist, I know most people (users of programs) do. This is why I find computer typography so motivating: taking advance of instructed default settings, it can subtly induce the ignorant to make more beautiful typography, without him even needing to be aware of it.</p>
      <p>You may be right about positioning being a better strategy for punctuation spacing, I don't know, I will have to learn more about it. But what about the no-breaking space?</p>
      <p>Putting the punctuation spacing in one of the Stylistic Sets, is a good thing. But you say, this way, users can switch it of. It’s the opposite: Stylistic Sets are not switched on by default, so users will actually have to turn them on. As a result, you could but hope that users will indeed and that they are aware of the availability of the feature. It is my (somewhat patronising) conviction that the default settings of user apps, and by extension, those of fonts, should yield the highest level of typographical standards, without needing the intervention of the user. Much the same way as hyphenation routines follow lexicographic rules, without having to rely on the user's knowledge of the language. If advanced users, who consequently are aware of these issues, disagree with your default settings, they still have the possibility to overrule the defaults. The same argument applies to backward compatibility. As a (font or other) developer, you should take care not to confuse the ordinary user or to disable his functionality (cfr your example of changing the character mapping). But adding extra glyphs and features to your fonts, doesn't harm if the user is not aware of their presence. If he is and he likes to use the extra's, but his software doesn't support, that's a pity for him. But if he really cares, he has to and likely will upgrade. I don't think technological progress is helped by restricting itself in giving too much consideration to users that are not willing or do not care to follow. Mind you, I am not saying the ordinary user's functionality may be hindered, but that the addition of novelties by definition only targets the most advanced and up-to-date users. It's a question of different levels.</p>
      <p>As regards the ampersand, I'd like to stress that I am not insisting on this (turning me into a some sort of swash freak). I just imagined it might be a feasible extra, without much of work, but certainly not something to be a default setting.</p>
      <p>Putting default settings in the LIGA or CALT, is not really a solution. This is what I called (in the other thread) hijacking of features. And as you say, these defaults would be recognised and applied by OT-savvy applications only. This is why I proposed the DFLT feature.</p>
