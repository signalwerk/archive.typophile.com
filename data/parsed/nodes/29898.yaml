      <p>I'm curious: how do you code contextual strings of characters? I'm looking for a feature that automatically recognises strings of uppercases, so as to substitute them by small caps (so that the typesetter doesn't need to tag or format those explicitly, by applying the SMCP and C2SC features manually). Ideally one could program a minimum amount of characters, so that a string of max. 3 consecutive uppercases (as in MD, or EUR) would be substituted by intermediate caps, and those of 4 or more, by small caps.</p>
