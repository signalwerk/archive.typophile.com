    html: |-
      <p>Ludwig, </p>
      <p>In each OpenType font, there are two *separate* lists of visual text transformation procedures: there is a list of features and there is a list of lookups. </p>
      <p>Features are functional procedures that do visual text transformation. They have a name and a widely accepted meaning. </p>
      <p>Lookups are actions (substitutions or position changes) that are performed on groups of glyphs. Each font contains one list of lookups, ordered in a particular sequence. You could view lookups as being the technical implementation of some visual text transformation procedures. </p>
      <p>The features in a font are mapped to a tree structure of writing systems (scripts) and language systems. </p>
      <p>Each font also includes a n:m map from features to lookups. In other words, one feature can map to several lookups -- if this is the case, when the feature is activated, the lookups will be applied on the text in the sequence in that they are ordered in the font. Also, several features can map to the same lookup (for example, the "sups" and the "numr" features could both map to the same lookup that replaces regular figures with superscript figures). </p>
      <p>This means that you have a tree structure of scripts and language systems that defines when particular functions should be applied, you have a list of features that defines what those functions actually mean, and you have a list of lookups that define the internal implementation of the functions, i.e. what exactly should happen when a particular visual text transformation is applied. </p>
      <p>Lookups cannot contain other lookups (although theoretically, such a scheme might be useful) and features cannot contain other features (this wouldn't make sense anyway because each feature has a different meaning). </p>
      <p>A.</p>
