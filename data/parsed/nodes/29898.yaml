      <p>Ludwig, </p>
      <p>1. What's the purpose of registering one more feature that duplicates the purpose of liga, clig and calt? </p>
      <p>2. "Font developers on the other hand, would have more flexibility in that they could add unregistered custom-made features to their fonts, having them function by associating them with the DFLT feature." -- I cannot make any sense at all of it. How is "DFLT" more flexible than what is already done with liga, clig and calt? Typically, liga, clig and calt are all enabled by default but can be disabled by the user. I don't see why adding yet another feature that does the same would add any flexibility or make anything for the user easier. </p>
      <p>3. User applications can build their user menus any way they want. Adobe applications such as InDesign, Illustrator and Photoshop use static OpenType feature lists while Apple applications such as Keynote, Pages and TextEdit use dynamic OpenType feature lists. Both approaches have their advantages and disadvantages. There are important reasons for both Adobe and Apple why they chose one implementation over another. </p>
      <p>4. OpenType Layout features operate on the glyph stream (the visual representation of text) while leaving the encoded character stream (the logical/semantic representation of text) intact. Search/replace operations, regular expressions and scripting typically operates on the encoded character stream. This is the principal difference. </p>
      <p>I assumed that before suggesting extensions to the OpenType format, you have actually read the essential OpenType documentation in order to understand what the format is about. However, perhaps you may want to re-read John Hudson's <a href="http://www.microsoft.com/typography/Glyph%20Processing/intro.mspx" rel="nofollow">Windows Glyph Processing: an OpenType Primer</a> and Microsoft Typography's <a href="http://www.microsoft.com/typography/OpenTypeDevIntro.mspx" rel="nofollow">OpenType Development</a>.</p>
