    html: |-
      <p>Ludwig M. Solzen wrote:<br>
      <cite>[...] or which would correctly space punctuation, using a statement such as:<br>
      sub @word [question exclam]' by uni2007 [question exclam];<br>
      (uni2007 being the codepoint for punctuation space)</cite></p>
      <p>Adam Twardoch wrote:<br>
      <cite>such as the earlier mentioned insertion of hair spaces in a feasible punctuation spacing feature (sppu)</cite></p>
      <p>Interesting. I haven't even recognized this punctuation space <cite>character</cite>. However, taking into account <cite>possible</cite> problems*, you should follow Adam Twardoch's recommendation to increase space before punctuation via pos commands. This could look like a second class based kern feature, and is something that I already put into fonts.</p>
      <p>* See the OT List posts with the subject "Acrobat text restoration and unrecognised glyph names" ...</p>
      <p>It's nice to see your enthusiasm, but just changing or adding to specs is not enough. It is applications -- i.e. the extent to which they do or don't support features or lookup types -- that impose restrictions.<br>
      But: <cite>Even if</cite> future versions of applications would support lookup type 2 -- there are <cite>current</cite> application versions which have real problems with fonts that contain lookup type 2. Since the lifetime of old versions of applications can be pretty long (people will continue to use Creative Suite 2 for some time to come, just as some still use MacOS9, XPress 4, PhotoShop 7, InDesign 2 now), it doesn't seem to be wise to include this lookup type into fonts for the next few years ...</p>
      <p>Having said this, it seems there is some demand for a collection of feature and lookup related information: Not only which apps support which features, but also which apps support which lookup types.</p>
      <p>Adobe's Feature File Syntax document is a pretty good introduction to writing OT features. Download it <a href="http://partners.adobe.com/public/developer/opentype/afdko/topic_feature_file_syntax.html" rel="nofollow">here</a> or -- which I'd recommend -- you download the complete AFDKO <a href="http://partners.adobe.com/public/developer/opentype/afdko/index.html" rel="nofollow">here</a>. The latter includes the Feature File Syntax plus some other important documents, and very useful Python scripts for use in FontLab Studio. For more links, you can download a PDF <a href="http://www.kltf.de/downloads/OpenTypeResources-kltf.pdf" rel="nofollow">here</a>.</p>
      <p>Karsten</p>
