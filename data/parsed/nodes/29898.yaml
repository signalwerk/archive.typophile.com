      <p>George — Thanks for the hint. I tried to subscribe to the OT List, but did not get approval so far. Rather than joining yet another list/forum, I'd like to thoroughly study the OpenType Feature Language syntax first, find out solutions by myself, so that I do not need to ask any more obvious questions. Is the documentation available for download as a printable pdf? It is hard to study and read from a screen, browsing hopelessly cluttered web pages, so I hoped there might be a nicely structured pdf OT syntax manual, somewhere…</p>
      <p>Mark — As regards my question (3): Yes, I knew, thanks, but this workaround will likely cause problems in some cases, and sure becomes perilously tedious when one needs to substitute large sequences. Furthermore, it is my understanding that multiple-substitutions are implemented into (allowed by) the OT syntax, but are not supported by present interpreters.</p>
      <p>Additionally, I'd like to know what be the case with one-into-many substitutions (or ligature decomposition) such as <code><strong>sub</strong> fi <strong>by</strong> f.buttonhook i<strong>;</strong></code> (which would save the i-dot in <code>TRK</code> in the most appropriate way, or which would correctly space punctuation, using a statement such as:<br>
      <code><strong>sub</strong> @word <strong> [</strong>question exclam<strong>]' by</strong> uni2007 <strong> [</strong>question exclam<strong>];</strong></code><br>
      (uni2007 being the codepoint for punctuation space).) An <code><strong>insert</strong></code> command keyword would of course be even more convenient…</p>
      <p>As for (1) and (2), this would offer lots of possibilities such as <cite>embedding features</cite> into other features, e.g. features that are not supported by user apps yet, to become available through features that do are supported already, without confusing the code by merely hacking existing features. Also, this would allow type developers to enforce certain substitutions into a feature, that generally are not included in that feature, such as pairing small caps lining figures (x-cap numerals) with small caps by default.</p>
