      <p>Adam —</p>
      <p>(1) The purpose of the DFLT feature is <strong>*not*</strong> merely duplicating already existing and registered features. As I explained, its purpose is to <cite>combine</cite> the functions of both registered and unregistered features, and this <cite>according to the arrangement of the font developer</cite>, who might judge differently than application developers on which features should be defaulted. This is an essentially different thing. Associating liga, clig and calt to the dflt feature is just an example, not compulsory and certainly not exhaustive.</p>
      <p>(2) Not all applications enable clig and the like by default or even give access to them (e.g. QuarkXPress 6, present PhotoShop releases and both present and future releases of MS Office). If they would support the DFLT feature and by preference would enable it by default, they would apply all features that are associated with DFLT at once, without having to further implement a complex OT menu (which one can expect only to be available in advanced layout applications). Also, unregistered features and/or other registered features that likely will never be implemented in even the most sophisticated of user applications would be available without having to rely on UI support, as long as they are associated with DFLT. This way, font developers would have the flexibility to devise and add as many features to their fonts, without needing to rely on their standard implementation (apart from the generic DFLT feature, obviously), what for most of these custom feature will evidently never be the case. I recur that the functions of such customised features in several cases do not fit into registered features (which is why they would be "hijacked"), including Stylistic Sets, which are never enabled by default neither generally supported, anyway.</p>
      <p>(3) Could you state those important reasons or advantages why developers would prefer static over dynamic OpenType feature lists? If it is for consistency, applications could at any time implement both static (with standard features) and dynamic (with all other features that are in the font) OT menu palettes.</p>
      <p>(4) I grant that probably I look for more appliances of OpenType than those for which the format was intended originally, such as automated text editing (spacing issues, contextual small caps, …). In most cases, though, the OpenType technology and its coding syntax already allows to implement these, which brings about that users (font developers) actually will, whatever the intentions or recommendations of the format owners. (They may very well have to, for custom font projects.) As I said before, OpenType moreover quite fits these purposes, precisely because it operates on the glyph stream, and does not hard-code substitutions on the character level. Your earlier suggestion to nevertheless impinge on the character coding therefore doesn't fit the purpose. However, in as far as OpenType support doesn't allow (yet) for more advanced tasks (one-into-many substitutions, operator values for sequences, <a href="http://typophile.com/node/30032" rel="nofollow">language support</a>), I considered scripting with regular expressions to be a practicable alternative.</p>
      <p>I read through all the documentation available. I also assume I understood what I read and that by now I comprehend what be the essence of the OT format. Thus I see there are some shortcomings which I hope to help to overcome with my iterations. As a font developer and experienced typographer, evidently I look at things from the user's perspective. Nevertheless do I try to get hold of the ways in which applications are built and how programs function, and so in order to avoid proposing unrealistic or unworkable solutions for my needs as a user and those of my fellow typesetters, type designers and clients. If application developers however consider my proposals being nonsensical, then be it so. It would be a pity if they would disregard useful recommendations, but of course, it's their right to do things only the way they think is the right way. Likewise, I do my things my way and in doing so get my jobs done. I don't <cite>need</cite> extra extensions, but, sure, it would help. Thus far, your counter argumentation has not been valid, nor convincing and is at several instances contradicting itself.</p>
