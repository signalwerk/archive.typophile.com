      <p>First thing I would do is replace Alte Haas Grotesk. Sure it's free, but this is important enough to spend a little bit of money on. Something with soft corners does seem to be in order, but certainly not something slapped together, and preferably not something derived from such a generic original. I think it would also be useful to choose something narrow, since the name is long. What about one of these?<br>
      <a href="http://new.myfonts.com/fonts/primetype/notes-soft/" title="http://new.myfonts.com/fonts/primetype/notes-soft/">http://new.myfonts.com/fonts/primetype/notes-soft/</a><br>
