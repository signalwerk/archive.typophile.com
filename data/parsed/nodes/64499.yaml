    <p>Hi, I'm in the process of designing a look for our rebranded marketing company.  I'm a motion designer, and by no means am I type savvy (I tend to lean on go-to typefaces way too often).  We are currently using Alte Haas Groteske Bold (usually all lowercase as the characters are much more interesting) for the majority of our work, its a modified Helvetica, with rounded corners and lots of little imperfections that make it very nice when used in large type sizes, but it loses all of its character and gets really boring when its small.  We want to find a nice typeface to could be used to complement it in all of our branded pieces.  Any ideas?  Take a peek at a temporary page I've put up with some of our branding (although it's quite rushed and not the nicest design) <a href="http://www.mk3creative.com" title="http://www.mk3creative.com">http://www.mk3creative.com</a></p>
    <p>HELP ME!</p>
