      <p>First thing I would do is replace Alte Haas Grotesk. Sure it's free, but this is important enough to spend a little bit of money on. Something with soft corners does seem to be in order, but certainly not something slapped together, and preferably not something derived from such a generic original. I think it would also be useful to choose something narrow, since the name is long. What about one of these?<br>
      <a href="http://new.myfonts.com/fonts/primetype/notes-soft/" title="http://new.myfonts.com/fonts/primetype/notes-soft/">http://new.myfonts.com/fonts/primetype/notes-soft/</a><br>
      <a href="http://new.myfonts.com/fonts/emtype/geogrotesque/" title="http://new.myfonts.com/fonts/emtype/geogrotesque/">http://new.myfonts.com/fonts/emtype/geogrotesque/</a><br>
      <a href="http://new.myfonts.com/fonts/typonine/tempera-rose/" title="http://new.myfonts.com/fonts/typonine/tempera-rose/">http://new.myfonts.com/fonts/typonine/tempera-rose/</a></p>
      <p>BTW, the fork is a bit organic, clashing with the rest. I'd either make it rigid, or much more organic - like a melted caricature of a fork. If you make it rigid, you might leverage the fact that both "m" and "w" actually look like the business end of a fork...</p>
      <p>hhp</p>
