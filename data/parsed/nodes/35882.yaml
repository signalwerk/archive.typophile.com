    date: 2007-08-07T08:12:00
    votes: null
    html: <p>Be aware that many U.S. licences contain causes that are not valid outside of the U.S. and can simply be ignored. The EU countries have a much higher level of consumer protection laws (especially northern Europe) than the U.S. and those laws may render some clauses in the licences void.</p>
