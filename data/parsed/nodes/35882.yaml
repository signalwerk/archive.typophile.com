      <p><cite>What happens to your iTunes when you die?</cite></p>
      <p>Your heirs get screwed—which is the whole point of DRM. The companies pushing DRM know that it will never stop piracy, but it will screw customers into buying the same old stuff over and over and never being able to unload it at the local used book/software/music/movie store.</p>
