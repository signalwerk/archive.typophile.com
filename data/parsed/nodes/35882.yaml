    <p>Dear Members!</p>
    <p>Is it possible to bequeath or entail font licenses?<br>
    I would appreciate any advice! </p>
    <p>Thank You in advance!</p>
    <p>Vertex</p>
comments:
  - id: 217672
    user: 14722
    date: 2007-08-07T07:53:00
    date_raw: 7 Aug 2007 — 7:53am
    votes: null
    html: <p>It would really depend on whether or not the font license is non-transferable. If the license can be transfered, there’s no reason one could not bequeath it. But with non-transferable software licensing you’ll probably need to talk to a lawyer.</p>
  - id: 217681
    user: 16321
    date: 2007-08-07T08:12:00
    date_raw: 7 Aug 2007 — 8:12am
    votes: null
    html: <p>Be aware that many U.S. licences contain causes that are not valid outside of the U.S. and can simply be ignored. The EU countries have a much higher level of consumer protection laws (especially northern Europe) than the U.S. and those laws may render some clauses in the licences void.</p>
  - id: 217683
    user: 6012
    date: 2007-08-07T08:15:00
    date_raw: 7 Aug 2007 — 8:15am
    votes: null
    html: |-
      <p>Vertex,</p>
      <p>That is a very interesting question. When I bought the original Adobe Font LIbrary (1989 or was that 1990) they sold it to me on a) floppy disks and 2) a hard disk for my imagesetter.</p>
      <p>They told me if I ever got out of the business and wanted to sell it (that library was $15,000) I could sell it to anyone and they would have all the legal rights to it.</p>
      <p>I still own it - never sold it.</p>
      <p>I think jpad gave you good advice -- good luck.</p>
