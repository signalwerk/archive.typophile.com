      <p>Bundling fonts with an app is not covered by standard EULAs. The font is supposed to be installed on 1 to 5 computers and not on possibly millions of devices of the users who use your app. </p>
      <p>FSI has just started to license fonts for iOS apps: <a href="http://www.mobilefontfonts.com/" title="http://www.mobilefontfonts.com/">http://www.mobilefontfonts.com/</a><br>
      The pricing is pretty fair, too!</p>
