  html: |-
    <p>I'm designing an iPhone app for the first time and am confused about what fonts I am allowed to use and how font licensing works in this situation. I had assumed that I could use Museo Slab (which is the font used for the product's branding) and embed it in the application (much like a font is embedded in a flash movie on a website) and the font would only be available for the application I'm distributing. It never occurred to me that there might be a licensing issue. But it sounds like maybe this isn't the case? When I contacted the foundry to ask, they say the font I want to use "is not available for your licensing purposes". </p>
    <p>Can someone explain how custom fonts for iphone apps work? And in what circumstances I can use a font (ie can I still use it as an image embedded in the app)? And does anyone know of a good alternative to Museo Slab that I could use for an iphone app?</p>
