    html: |-
      <p>I just came through this discussion and I wanted to add my two cents as I thought the point of the <a href="http://www.mobilefontfonts.com/" rel="nofollow">Mobile FontFonts</a> website was more legibility than licensing issues.</p>
      <p>Let say I want to buy <a href="http://www.mobilefontfonts.com/font/8376/usecases" rel="nofollow">FF Yoga Mobile</a> (from Xavier Dupré) on <a href="http://www.mobilefontfonts.com/" rel="nofollow">Mobile FontFonts</a>. When take a look at my cart I've got:</p>
      <p>FF Yoga Sans Mobile Pro € 159.00<br>
      Licenses:  5</p>
      <p>At this step I see no difference on the licencing point as I always have to choose the number of devices (1000 max. which isn't realistic in the case of an app)<br>
      I thought the only difference concerned legibility issues more than the licencing issue because as you could see on the screenshot bellow, the price of the mobile font is the same than the classical version:<br>
      <img src="http://dl.dropbox.com/u/6143195/Screenshots/FF-Yoga-Mobile.png"></p>
      <p>So, from my side, the licencing issue raised by @jujube is not really solved.<br>
      I thought the price of Mobile FontFonts fonts would be higher than the classical versions and that I wouldn't have to choose the number of devices (as we don't have this data during the design process and the app would be used by a potentialy high number of users).</p>
      <p>With the informations I have, I guess the better solution is to ask the foundry or the type designer himself to know wether the font could be used within iPhone app or not ?</p>
      <p>So, what you think ?<br>
      Maybe I missed something ?</p>
