    html: |-
      <p>It's not about what you call “embedding”. It's about whether or not the font software is used. If you embed glyphs in a PDF or just create a logo as a bitmap, the ones using these files don't use the original font software.<br>
      But if you embed the font software in an app, you redistribute the software to an unlimited number of people and it is used as it would be installed on the device. That's something very different.</p>
