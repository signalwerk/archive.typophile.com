    <p>Hello,</p>
    <p>I stubled upon this font during a holiday trip to Portugal and instantly thought it would be good for a graphic project I have. </p>
    <p>It's edgy in the same way as Gridnik and Blender (which I identified thanks to this forum!), but it is still a bit different, maybe a bit more softer looking. </p>
    <p>At least 'E', 'A' and 'V' are different.</p>
    <p>Hope you can help :-)</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Tomarjovem1_5035.jpg"></div><br>
