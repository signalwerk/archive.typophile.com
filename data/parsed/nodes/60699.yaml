      <p>Hey guys...</p>
      <p>I normally don't do this – coloring the logo before it's final. However, I had a little spare time on my hands, so I started fooling around with the logo a little bit. If you think it's horrible please tell me :-) The drips are getting worked on and I'll make a stencil over the weekend and post the results as well... Also, I'll check the type and reset it....</p>
      <p>cheers....</p>
      <p>p.s.: I am aware that the stenciled draft might cause trouble with low resolution printers or when I set it in B&amp;W (or somebody photocopies a document with this logo on)... That's why I though, it wouldn't be a bad idea if I vary the use of the logo by keeping it's main visual aspects – the insides aka. the circle with drips and the type – and diversifying the rest depending on use, occasion or medium. Like the stenciled logo might work on the www, the transparent-slide/screenprint one on slides and the b&amp;w one on the web, paper and keynote presentations.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/logo_coloured_5047.jpg"></div><p></p>
