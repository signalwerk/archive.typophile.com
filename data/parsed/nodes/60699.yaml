    date_raw: 11 Aug 2009 — 1:52pm
    votes: null
    html: |-
      <p>At first glance the drips looked like legs on a round character that's leaning backwards. I don't get a paint ball from that, way too round and perfect. I think stencli might also be bit of a strech, again way to perfect.</p>
      <p>Doing some real stencil work with your mark as Frambwaze suggested is a good idea. I think you should do that after you're done with the type, shape and placement. That would add some originality to it, try to use to much paint, too little, do it sloppy and see what kind of variations you get. Would be cool if you could see some part a little smudged or blurry with to little paint or something like that. Also maybe doing something with the circle so you would get more of a variation when you do the stencil.</p>
      <p>I also reacted with a little head tilt when I tried to read it. The tilt dosent feel right, I'd play around with that some more. The type I like I don't think you need to do much about that if you don't want to.</p>
      <p>Another thing that would help getting across the message of a graphic designer is colour. I'd start to add and play around with colours after the stencil work, maybe use three or four colours.</p>
      <p>Yeah.. I'd say go for the stencil.</p>
