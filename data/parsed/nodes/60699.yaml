      <p>hey guys,</p>
      <p>thanks a lot for your input... Well, I just recently finished my studies in graphic-/visual design and I am trying to figure out a good way of presenting myself and my portfolio. I don't know if the logo really delivers that message, but it could be interpreted as some stencil where to much paint had been applied or even a paint bomb. What I am trying to deliver is, that I like the rough approach and also like to mix traditional and modern ways of designing (by what I mean, that I am not the kind of person who creates everything on his Mac, when the real deal is already out there and one just has to scan it in - a piece of fabric for example...).</p>
      <p>epsilicon: I've played around with the drips quite a bit already -- flipping them, changing their sizes and so on... -- However, I like your idea of "making the font drip and will give it a try. I added the : to leave things I do up for discussion... It could also be interpreted as an introduction to a presentation. So when the logo is added to a photo of mine for example, it reads as if it's presenting the piece. Do you think it's confusing? Is it too bumpy, is there too much going on?</p>
