      <p>Hey guys...</p>
      <p>ok, sorry – I was way too busy during the last week so I didn't get a chance to respond. Anyway – first off: thanks so much for your feedback, I really appreciate it... When you're at the beginning of your design career, just out of university, it's great to get advise from professionals. I think you know that – just right after uni you feel uncertain and always question your decisions, if the design-decisions you took was right.</p>
      <p>I share your objectives – like the one with the (lets call him 'obese' ;-) ) man. I realized that after looking for some time at my logo and playing around with it, I thought it was only me but obviously it's not. So this needs some tweaking for sure. I feel it might be the drips looking like legs, I'll work on that. I quite like the idea with the arms though ;-)</p>
      <p>Also you're right with the shape – that it's probably way to 'perfect' to be a paint-bomb or stencil. I'm going to print it out and make a real stencil out of it... and do some stuff with it during night *hehe* ;-) . </p>
      <p>Regarding the colours: well, I quite liked it's black simplicity. It looks rougher like taht I guess. However I will also give that a try...</p>
      <p>I am going to keep the :</p>
      <p>I am also going to play around with the tilt, I also think of it as a bit too extreme now...</p>
