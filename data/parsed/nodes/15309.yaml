    html: |-
      <p>If you are looking for historical Spanish types, then Mário Feliciano is your man. He is Portuguese, but has done masterly work reviving historical Spanish types. (There were no printers per se in Portugal, so the Iberian models all come from Spain. And most of those were based upon contemporary French, Italian, and German models.) </p>
      <p>Besides Rongel, Mário has released Merlo, and has several more Spanish types in the works: Geronimo, Eudald, Monteros, Salustiana...</p>
      <p><a href="http://felicianotypefoundry.com/" title="http://felicianotypefoundry.com/">http://felicianotypefoundry.com/</a></p>
      <p>For contemporary Spanish type, one might check out Type-O-Tones:</p>
      <p><a href="http://www.type-o-tones.com/" title="http://www.type-o-tones.com/">http://www.type-o-tones.com/</a></p>
