      <p>Try to understand what the company stands for first.  I understand your type study, but if a logo doesn’t communicate what a company is about at a first glance then you’ve missed the point.  I don’t think it looks like Nike.  It reads Nike, but it doesn’t feel like Nike.  Hard angles might be the most difficult issue.  Nike doesn’t use hard edges.<br>
      best regards,<br>
      daniel</p>
