  html: |-
    <p>Is <a href="https://web.archive.org/web/20080705153820/http://www.adobe.com/type/browser/P/P_059.html">Helvetica Neue</a>, as sold by Adobe, the same thing as <a href="https://web.archive.org/web/20080705153820/http://www.linotype.com/88565/neuehelveticafamilyvaluepack-compilation.html">Neue Helvetica</a>, as sold by Linotype?</p>
    <p>Adobe lists the designer of Helvetica Neue as “Linotype Staff,” while Linotype appears to sell some <a href="https://web.archive.org/web/20080705153820/http://www.linotype.com/112299/itcofficinabyadobefontfamilygroup-clan.html">Adobe fonts</a>. The PostScript versions of both fonts appear to use the same “easy-to-use numbering system” in the font names.</p>
    <p>Curiously, the <a href="https://web.archive.org/web/20080705153820/http://www.adobe.com/type/browser/P/P_1198.html">Adobe OpenType</a> version of Helvetica Neue doesn’t seem to have numbers in the font names, while the <a href="https://web.archive.org/web/20080705153820/http://www.linotype.com/88565/neuehelveticafamilyvaluepack-compilation.html">Linotype OpenType</a> version does.</p>
    <p>I’m writing a style guide, and I’m trying to figure out which of these fonts (if any) are interchangeable. Thanks for your help.</p>
    <p>If you have any additional insights into differences between the two, or why this confusing situation exists, I’d love to know.</p>
    <p>P.S. I originally posted this question on <!--
