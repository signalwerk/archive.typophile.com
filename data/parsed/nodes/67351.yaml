    <p>After 26 hours I finally finished all the Latin capital letters. I still need to do some letters with diactrics, the Polish letters and several ligatures. After that I can finally start the undercast letters and then the rest...</p>
    <p>Célente is a narrow, modern yet elegant typeface particularly designed for the fashion industry, though it can be used for virtually anything including book text. I wanted to design a narrow serif typeface with very small serifs - almost like a humanist sans-serif. Eventually the serifs became a bit larger, but still smaller than usual. I would like your opinions and possibly suggestions.</p>
    <p>I will make the Z a bit more narrow, the S a bit more wide, and possibly the O and Q a tiny bit more narrow as well.</p>
