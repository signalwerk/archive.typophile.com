      <p>It doesn't look like Trajan at all. I guess you're making that association because you're only seeing capital letters and they have a large x-height.</p>
      <p>I've never seen Memoriam in use, actually. I frequently buy fashion magazines and keep track of several major fashion labels, and Didot, Bodoni and Avant Garde Gothic are used extensively in fashion. So you're right; fashion does make use of typefaces with a high contrast. This regular Célente will be useful for book text and headings. Célente light will have a higher contrast.</p>
      <p>On an other note, I made the presentation at work today on a Mac. Now I look at it at home on a PC. it looks horrible. I might replace it with a more appropriate presentation, though I guess the typeface is up so that's what counts.</p>
