      <p>It is quite a bit like a more rigid Trajan. The swash-like tail of the Q and similar strokes on the R, K, and J especially. It's interesting though, that while some of the aspects are more formal looking than Trajan (the straighter lines, the more consistent character width and serif size), others are more whimsical, like the S, C, and the alternate, rounded G. Meanwhile, Trajan breaks from rigidity on characters that Celente leaves formal, like the M, N, and P.</p>
      <p>I think the short, blunt serifs work well for it, especially as a body font. It still retains its elegance and class, too. The thing is, if it is going to be a body font, it might be best to tone down the swash-like strokes in favor of something more consistent and reserved. On the other hand, if it is something that is to be used in titling, maybe those whimsical aspects of the font should be played up, and you should make the widths more varied. (Leave the Z, O and Q wide and adjust some others to break the box as well).</p>
      <p>On that note, for a whimsical title font, the S is great. It has a sense of dimensionality.</p>
      <p>Anyway, those are my thoughts about it. Good luck finishing it.</p>
