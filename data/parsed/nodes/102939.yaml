      <p>Just some clarification.</p>
      <p>I never said more kerning pairs were better, or an indicator of quality. But I do agree with John: <em>"I would be wary of any (non-monospace) font that contained no kerning of any kind."</em> (And recently I did unknowingly buy a font that  contained no kerning of any kind.) So the difference of zero kerning pairs and 500 is significant; the difference between 4000 and 6000, not so much.</p>
      <p>My other point was that I think <strong>all</strong> vendors (not just MyFonts) should  be able to get the number of kerning pairs either from a font program, or from tech specs that should come with the font, or from the type designer. I just can't get over the fact that a company that sells fonts can't even tell me if a font has <strong>any</strong> kerning or not.</p>
      <p>I'm not familiar with font internals, but I would be interested to know, given the many variations possible within Open Type, if font programs (like Linotype FontExplorer Pro) can discern all or just some of the kerning in OT. The font I just bought is OT; Typograph was able to tell me that Mikado had over 1000 kerning pairs, although I have no idea if Typograph can discern all the combinations, permutations, and possibilities John describes.</p>
