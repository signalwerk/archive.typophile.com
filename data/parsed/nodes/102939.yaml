      <p>My first published retail font has over 10,000 carefully adjusted hand-made kerinig pairs. I know this because Fontlab counted them. </p>
      <p>Since then, I've improved my letter-spacing and learned to use class kernig. Now Foblab only tells me how many key glyph kerning pairs there are in a font, which is not at all revealing if you don't know how the classes are organized</p>
      <p>Font retailers' preview displays show kerned text, so why is this an issue? Just type in some kerning pairs.</p>
