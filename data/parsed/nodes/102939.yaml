    <p>Short story: A while ago, MyFonts offered what appeared to be a quality font at a bargain price so I bought it. It looked good on their website, but absolutely dreadful when printed. It turned out that the font had zero kerning pairs! I suggested to MyFonts that they include the number of kerning pairs in their "Tech Specs" tab, but they elected not to do so. (The font was so bad I wouldn't have used it even if it was free; I eventually got a refund.)</p>
    <p>One of their "Rising Stars" this month was offered at a 50% discount, so I wrote and asked "How many kerning pairs (on average) does Mikado have? None? Tens? Hundreds? Thousands?" This was their response: "Unfortunately, we are not aware of the kerning pair data for the Mikado font."</p>
    <p>So I wrote back: "Shame on you. I downloaded the free font, and found that there were over 1000 kerning pairs. Would that have been so hard for you to do? Do you need me to recommend a font program to view the number of kerning pairs?"</p>
    <p>Their response: "Glad to hear that you now have the kerning pair information. The font was also downloaded, and opened in FontBook...." (No kerning pair info.)</p>
    <p>Is it just me, or should a font vendor know, or be able to find out, font information more readily than a non-pro? To find out font info, I rely on Typograph 5.1.2 available from <a href="http://www.neuber.com/typograph/index.html" title="http://www.neuber.com/typograph/index.html">http://www.neuber.com/typograph/index.html</a></p>
    <p>What's with font vendors that profess ignorance of their fonts and do not have the wherewithal to find out info?</p>
