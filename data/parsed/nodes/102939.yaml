      <p>Kerning pairs? That seems to presume old-fashioned kern table kerning, which is indeed easy to query. But OpenType fonts are more likely to have GPOS kerning, which may be arranged in class kerning, class kerning with exceptions, or pair kerning, and may include contextual kerning, contextual interactions between kerning and mark positioning, etc.. This information is difficult to query, since that would require being able to decompile the GPOS table and to represent the kerning data in a meaningful way that would enable comparison across fonts built in different ways.</p>
      <p>While I would be wary of any (non-monospace) font that contained no kerning of any kind, I don't think the actual number of kern pairs -- even when this information can be accurately extracted from the font -- is in itself a good indicator of quality, and can quite understand why a vendor such as MyFonts would consider this unhelpful and potentially misleading information to present to customers.</p>
