    <p>One of their "Rising Stars" this month was offered at a 50% discount, so I wrote and asked "How many kerning pairs (on average) does Mikado have? None? Tens? Hundreds? Thousands?" This was their response: "Unfortunately, we are not aware of the kerning pair data for the Mikado font."</p>
    <p>So I wrote back: "Shame on you. I downloaded the free font, and found that there were over 1000 kerning pairs. Would that have been so hard for you to do? Do you need me to recommend a font program to view the number of kerning pairs?"</p>
