    date: 2005-03-30T18:18:00
    date_raw: 30 Mar 2005 — 6:18pm
    votes: null
    html: "<p>The Hellobye stuff seems like pretty standard fashion-type stuff. I do like #14 at the hellobye site, but only in concept. I get quite frustrated alot of the time by this kind of stuff.  It's Hot Right Now, but it wont hold. <br> <br>It's intimidating enough how much can be done with computers and printing without people doing something so \"whimsical\". Bloody fashion. So why is it that I go out with a fashion student? Hmm. Still, after all that the style is pretty cool. Very \"ephemeral\". This person must do something that's really cool, doing all those shows and projects. <br> <br>- Chris</p>"
    html_clean: "<p>The Hellobye stuff seems like pretty standard fashion-type stuff. I do like #14 at the hellobye site, but only in concept. I get quite frustrated alot of the time by this kind of stuff.  It's Hot Right Now, but it wont hold. <br> <br>It's intimidating enough how much can be done with computers and printing without people doing something so \"whimsical\". Bloody fashion. So why is it that I go out with a fashion student? Hmm. Still, after all that the style is pretty cool. Very \"ephemeral\". This person must do something that's really cool, doing all those shows and projects. <br> <br>- Chris</p>"
