    html: |-
      <p>Andre, this is not good that the stems are not printing consistently for you. I wonder why this is? Mathematically, the stems are very simple in this font which why I thought I it gives good results at a variety of resolutions. Both straight and bowl vertical stems of the lowercase letters are all the same, 80 units on a 1000unit em. They can be the same because of the angle of the stroke on the bowls. The o, being vertical, has heavier sides of 96. I have the basic stems defined accurately in the font info, so I am not sure why it would be printing inconsistently. It might be that to produce a more even color I would have to adjust the contrast of some of the letters. But then I would lose authenticity. </p>
      <p>Thanks for taking such a close look at it. Any comments on the lowercase display? I haven't given that part much thought yet.</p>
      <p>P.S. Sorry for accidentally typing your name wrong last post!</p>
