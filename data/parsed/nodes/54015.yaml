    html: <p>I was referring to the width of the stem of some letters for the text weight. Yesterday the print out of the text weight shows the t, r and h to name a few,  with a stem wider than the other stem. That thing showed a weird effect on reading the text giving not a regular gray. This morning I printed the same page and the stem of the latter was better but still too wide. I just wanted to say to you this, be sure your stem are the same width on all letters to assure a regular gray and an easier readability. It also could be a print out problem, so probably what I saw it's not real.</p>
