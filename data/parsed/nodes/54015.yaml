    html: |-
      <p>Sindre, thanks for the compliment :) I'm assuming you mean the titling font. I like it quite a lot and rarely use other fonts for titles. </p>
      <p>André, thanks for the feedback. Are you referring to the text weight or the display? I'll have to ask you to clarify what you mean so that I know how to respond to you. If you're saying that the h and n are too wide in relation to the round letters, I think you'll find that quite the opposite is true in relation to many contemporary faces. If I have a minute, I try to comp a comparison so we can discuss it that way.</p>
      <p>Keep in mind that my goal for this was to produce a faithful revival, rather than an lovely text face. It turns out, however, that it is highly useable. I've used it in as bad conditions as 9pt at 600dpi, and it still holds up. It is certainly more robust than it is beautiful! (I'm talking strictly about the text weight here.)</p>
      <p>Also bear in mind that I've done <em>very</em> little work on the titling lowercase. I'm not even sure I will include it in a final release. Any critique for aspect?</p>
