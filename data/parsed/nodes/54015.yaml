    <p>This is a continuation of a previous thread: <a href="http://typophile.com/node/7596" title="http://typophile.com/node/7596">http://typophile.com/node/7596</a>.</p>
    <p>Where you will notice the biggest change is in the italics, which are really what are most this face. The nice thing about having made the contrast very low in the roman is that it gives an even, dark impression that well suited to academic papers which require to be set double spaced. </p>
    <p>I had pretty much stopped working on this for a few years except for minor tweaks as I used if for my academic papers. I've refined the outlines, improved the kerning (maybe going a bit overboard), added some IPA characters, accents, logical symbols, etc. Currently I am developing lining figures and am trying to prep these fonts for release. (It is a lot of work!) I may release the titling caps with just caps and punctuation for free and then sell the roman and italic as companion faces. Haven't quite worked that out yet.</p>
    <p>If you print this out I think you will see that the roman reads very well, with a dark, even color and good legibility. The roman strikes me as quite neutral, making it a typeface well suited to the demands of academic publishing in the humanities; the italic adds a pleasant contrast to the roman but needs redesigned figures and improved spacing.</p>
    <p>I will post more samples over the next while for italic issues and the design of the lining figures. Special thanks goes out to Hrant who really helped and encouraged me so much back when I started work on this (and back when you were posting 250 times per day). I knew absolutely nothing about font design then, and have learned much thanks to your help as well as the help of other typophilers. </p>
    <p>I have also made a few other fonts that I will post for discussion, although this crit boards seem pretty slow these days.</p>
