      <p>Cristobal,</p>
      <p>I haven't been logged in in Typophile for very long and I realize now I had not thanked you for your answer, sorry for that. Very belated thank you! :)</p>
      <p>And to any (ideally Spanish-speaking) student interested in such education, I finally chose EINA school in Barcelona. I am very happy with my choice, since I have been able to both design and apply type, and I am now working on a short thesis. It was all very condensed though, but I have learned a lot! I think this program provides a great basis for any graphic designer.</p>
      <p>Cheers</p>
