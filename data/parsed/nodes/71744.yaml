    <p>I have recently graduated from a design program (Concordia University, Montreal) and I am looking for masters abroad that would combine both type design and typography (preferably a one-year program). </p>
    <p>I was wondering if anyone has information about the quality of the masters in Advanced Typography taught at the EINA school in Barcelona. Apart from their official website, I have trouble finding extra information and comments about this program.</p>
    <p>I am also considering KABK's "Type and Media". However, from the information I have been able to gather, it seems like it much more focused on type design, and much less on typography, am I correct? </p>
    <p>Finally, any thoughts about the Centro de Estudios Gestalt (Veracruz, Mexico)? Or other suggestions?</p>
    <p>Thanks a lot!</p>
    <p>Ruxandra</p>
