  html: <p>This may be a drawing, or a phototypositor font (Asian Music is in volume 36), but ew're beginning toset it, &amp; the art is rather ratty. If it is a font, I'd sure love to know which one. <br> <br><img src="http://www.typophile.com/forums/clipart/your_image.gif" alt="asnmsc.gif"> <br> <br>If the image doesn't post, the type is also on the web at <br> <br><a href="http://www.skidmore.edu/academics/asianmusic/" target="_blank">http://www.skidmore.edu/academics/asianmusic/</a> <br> <br>Thanks, <br> <br>Charles<img src="http://www.typophile.com/cgibin/board-post.pl?action=posting_upload_form&amp;what=show&amp;img=56663" alt="asnmsc.gif"> </p>
