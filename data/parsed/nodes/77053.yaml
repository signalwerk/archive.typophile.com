      <p>Some economic sans serifs I tried recently.</p>
      <p>Bureau Grot has a very wide range of variants, from super narrow to a bit condensed.<br>
      <a href="http://www.fontbureau.com/fonts/BureauGrot/styles/" title="http://www.fontbureau.com/fonts/BureauGrot/styles/">http://www.fontbureau.com/fonts/BureauGrot/styles/</a></p>
      <p>Similarily versatile and narrow but with a more friendly feel: Amplitude<br>
      <a href="http://www.fontbureau.com/fonts/Amplitude/" title="http://www.fontbureau.com/fonts/Amplitude/">http://www.fontbureau.com/fonts/Amplitude/</a></p>
      <p>A classic: Bell Centennial<br>
      <a href="http://www.fontshop.com/fonts/downloads/linotype/bell_centennial_std_complete_pack/" title="http://www.fontshop.com/fonts/downloads/linotype/bell_centennial_std_complete_pack/">http://www.fontshop.com/fonts/downloads/linotype/bell_centennial_std_com...</a></p>
      <p>more humansit: Ourtype Alto Condensed and Extra Condensed<br>
      <a href="http://www.fontshop.com/fonts/downloads/ourtype/alto_extra_condensed_family_ot/" title="http://www.fontshop.com/fonts/downloads/ourtype/alto_extra_condensed_family_ot/">http://www.fontshop.com/fonts/downloads/ourtype/alto_extra_condensed_fam...</a></p>
      <p>Ronnia from Type Together<br>
      <a href="http://www.type-together.com/Ronnia" title="http://www.type-together.com/Ronnia">http://www.type-together.com/Ronnia</a></p>
      <p>Camingo by Jan Fromm<br>
      <a href="http://www.fontshop.com/fonts/downloads/jan_fromm/camingodos_condensed_premium_pack_ot/" title="http://www.fontshop.com/fonts/downloads/jan_fromm/camingodos_condensed_premium_pack_ot/">http://www.fontshop.com/fonts/downloads/jan_fromm/camingodos_condensed_p...</a></p>
      <p>Qugard Sans by Ole Schäfer<br>
      <a href="http://new.myfonts.com/fonts/primetype/qugard-sans" title="http://new.myfonts.com/fonts/primetype/qugard-sans">http://new.myfonts.com/fonts/primetype/qugard-sans</a></p>
      <p>Not particularily narrow but works well in tiny sizes: Vectora by Frutiger<br>
      <a href="http://www.linotype.com/de/1577/vectora-schriftfamilie.html" title="http://www.linotype.com/de/1577/vectora-schriftfamilie.html">http://www.linotype.com/de/1577/vectora-schriftfamilie.html</a></p>
      <p>Maybe check out these font lists from fontshop.com<br>
      Small Text list by Nick Sherman<br>
      <a href="http://www.fontshop.com/fontlist/applications/small_text/" title="http://www.fontshop.com/fontlist/applications/small_text/">http://www.fontshop.com/fontlist/applications/small_text/</a></p>
      <p>more deco but narrow nonetheless:<br>
      <a href="http://www.fontshop.com/fontlist/genres/skyline_sans/" title="http://www.fontshop.com/fontlist/genres/skyline_sans/">http://www.fontshop.com/fontlist/genres/skyline_sans/</a></p>
