      <p>David, I've done a lot of work with complex script fonts involving OpenType GPOS mark anchoring (Hebrew, Arabic and Thai), and also know the people who have added IPA support to a lot for fonts for the next versions of Windows.</p>
      <p>I make the outlines in FontLab, but do all the mark positioning and other OT Layout stuff in VOLT. This is the only tool that supports all the OTL lookup types that you will need to do dynamic mark positioning.</p>
      <p>The version of the Uniscribe shaping engine that ships with MS Office 2003 on Windows (and I believe the one that ships with Windows XP Service Pack 2), supports such GPOS mark positioning for that Latin script, including the IPA extension. So if you have a font that supports the  and  features you should be able to use it effectively in Word and other Office apps right now.</p>
      <p>Note that the Mac version of Office does not support OTL features yet. On the Mac side you could try Mellel, which has pretty decent OTL support, or any other software that uses the OpenSource ICU library for text layout.</p>
      <p>Before heading off down the AAT path, you should check what applications are actually going to be available to work with the font. Although AAT support is built into Mac OS, it is not actually used by many applications. Also, note that AAT does not use anchor mark positioning, so you have to include dozens of different mark glyphs at different heights and horizontal offsets and contextually substitute them. This aspect of AAT is particularly poor.</p>
