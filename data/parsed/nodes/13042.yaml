      <p>OpenType layout features are expected to be in one of three states: on by default and impossible to turn off (e.g.  for the Arabic lam_alif ligature); on by default but able to be turned off (typical for 'standard' ligatures such as ffi, fi, etc.); off by default but able to be turned on (typical for discrtionary ligatures such as ct, st).</p>
      <p>The individual feature descriptions generally indicate in what state a feature should normally be, but this needs to be intepreted by applications, and may be subject to the limitations of their user interfaces.</p>
      <p>In the case of Word 2003, you have pretty good language processing support, but poor typographic support. So this means that features that should be on by default, which include the 'mark' and 'mkmk' features, because they are essential for proper language display, are supported, but because of the UI limitations they cannot be turned off even if this would normally be expected. So, for example, Word support for the Arabic script includes implementation of the 'rlig' and 'liga' features, but the latter cannot be turned off (other than by inserting a control character between the component characters of a ligature).</p>
      <p>It is also important to note that Word implements OTL support via the Uniscribe script engine, which includes separate shaping engines for different scripts. So the layout features applied to support language shaping will vary from script to script.</p>
      <p>You might find it helpful to read my essay on <a href="http://www.microsoft.com/typography/Glyph%20Processing/intro.mspx">Windows glyph processing</a>.</p>
