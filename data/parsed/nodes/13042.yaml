      <p>Making CFF OpenType fonts with VOLT:</p>
      <p>VOLT uses the TIDE, which is a font tool development environment that includes its own TT rasteriser. As far as I know, VOLT is the only tool that uses TIDE, which seemed like a good idea at the time, but no one else has implemented anything in it. One of the attractions of TIDE was that one was not limited to using the system rasteriser, but could plug in other rasterisers. However, TIDE does not include a PS rasteriser, which is why one can't work directly on CFF fonts in VOLT.</p>
      <p>However, the problem is only in the display of glyphs in VOLT windows. <em>You can open CFF fonts in VOLT and compile OTL tables to them.</em></p>
      <p>So the work-around is to make a dummy TTF font that will be your VOLT working file. This needs to have exactly the same glyph set and order as the final CFF font, and also needs to have the same UPM value if you are doing any GPOS work. Generate this dummy TTF from your FontLab source, and open it in VOLT. Do all your VOLT development on this dummy TTF and, when you are done, <em>export a VOLT project file.</em> You can now open the CFF version of the same font in VOLT, import the project file, compile and ship a CFF master font containing the OTL tables that you developed using the TTF dummy.</p>
    html_clean: |-
