    <p>Dear Typophiles,</p>
    <p>I have a few questions for those of you who are experienced in using "Anchors" in Fontlab.</p>
    <p>I am a student of linguistics. At our institute we are currently trying to make a font with advanced accent capabilities. For instance we'd like to have a simple way for putting multiple accents (&gt;2) on a base glyph (see attached picture of a "long syllabic stressed r").</p>
    <p>For this purpose the "Anchors" feature seems very useful. It seems to me, though, that anchors work only within Fontlab and cannot be understood by an ordinary word-processing program. Is that true?</p>
    <p>What has OpenType got to do with anchors or how could I make use of OpenType features for solving the problem (smartly and elegantly, may I add?)?</p>
    <p>Thank you</p>
    <img typeof="foaf:Image" class="img-responsive" src="http://www.typophile.com/sites/default/files/old-images/r.jpg" width="96" height="161" alt="">
    <img typeof="foaf:Image" class="img-responsive" src="http://www.typophile.com/sites/default/files/old-images/ie_fun.jpg" width="384" height="174" alt="">
