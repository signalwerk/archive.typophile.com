    html: <p>I like the music analogy, we know what we like, there are stars and classics songs, the rest is generally just background noise, with the occasional new stars and new classics appearing. Well continue to play our favourites and get knew ones, some won't stand the test of time, that is the way of the world. I guess the difference is these days is that the variety of fonts and their accessibility is incredible, the hard part for the new designer is knowing what makes a font great. I don't believe all fonts are useable, except maybe to the person who designed it, readability is a great reality check, particularly when letters are strung together to form that singular graphic unit called a word.</p>
