    html: |-
      <p><em>Do you think today's new typefaces will still be in use fifty years from now?</em></p>
      <p>Of the types I published 10 or 15 years ago, some have proved to be more durable than others.<br>
      Beaufort, Handsome, Bodoni Egyptian for instance; Morphica and Artefact, not so much.<br>
      At the time of design, it's impossible to know which is the mayfly, which the quahog.<br>
      But I do believe that one or two may still be in use 50 years from now.</p>
      <p>Certainly, it helps to update formats: I've gone from PostScript Type 1 ("legacy") to OpenType and now web fonts.<br>
      Nonetheless, as long as the legacy formats continue to be supported by layout applications, all manner of typefaces will survive.<br>
      It helps that in the digiverse there is scant difference between warehouse and museum—which retailers delete poorly selling stock?<br>
      The tale is long.</p>
