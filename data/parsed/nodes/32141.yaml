    html: |-
      <p>Use the red version wherever it can be reproduced accurately, then use an extremely simplified version (i.e. no drop shadows, highlights, etc.) wherever the other one would lose those details.</p>
      <p>As for typeface, I'd suggest hand-lettering at a small size, using comic books as a reference, then scanning and tracing as a vector.</p>
      <p> - Lex</p>
      <p>P.S. If you didn't want the client to go with the halftoned version, why did you show it to them? :-P</p>
