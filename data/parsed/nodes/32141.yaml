    html: |-
      <p>Is it possible to use two lines for the name at small sizes?<br>
      SUPER<br>
      DUPER<br>
      PTY LTD</p>
      <p>Even in the one line version it might make it easier to read if the D had as much differentiation as the S.</p>
      <p>I would also make the stroke go to a point at the mouth end of the speech bubble.</p>
      <p>Tim</p>
