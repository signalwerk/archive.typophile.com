  html: |-
    <p>Hi there,</p>
    <p>I've been tasked with finding a new typeface to use in this company logo; for better or worse the client has decided to go with the red, halftone drop shadow version, and I'm worried about the legibility of the current text, particularly at small sizes.</p>
    <p>It's for a local production company, the rest of their branding has a pop-art/Lichtenstein-esque kind of theme. This logo will be reproduced at a number of sizes, the smallest probably being on their business card, and it will also be reproduced on screen in a motion graphics context -- so needs to scale reasonably well for TV.</p>
    <p>Anyone have any suggestions for a font (or a better way of resolving the white/black layering)?</p>
    <p>(edit - for some reason can't get Insert Image to work, so jpg is attached)</p>
