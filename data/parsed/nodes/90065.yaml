      <p>You might consider adding a background behind the type. Create a triquetra that looks like a 3d object, similar to the one below, and put the type on it, sort of like it was engraved on a bracelet. Space the words so that the hidden areas are between two words, so that no characters are hidden.</p>
      <p>In the example below the bands are obviously way too thin, there's not room for the type, but take that general shape and make the bands much wider so the type will fit in them.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/shape_4800.jpeg"></div><p></p>
