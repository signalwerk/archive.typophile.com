    <p>For starters, I am not a graphic designer or artist. I've come to this forum to get assistance from those of you who enjoy doing this type of thing. I'm getting a tattoo this weekend, but need someone to draw it up for me. I tried using GIMP2.6 (which my friend suggested), but could not, for the life of me, figure out how to accomplish what I wanted. It may as well have been in Hebrew. I also tried installing "Illustrator" and "Photoshop" (to no avail). I'm just not talented at all when it comes to this type of thing. I'm looking to get a tattoo of a triquetra using this verse (And now abideth faith, hope, love, these three; but the greatest of these is love. I Cor 13:13). The verse itself will be in the form of the triquetra. I don't know how to twist/turn/shape text into a desired shape. If any of you could help me with this, I'd GREATLY appreciate it. I'd like the font to be Lucinda Handwriting. And the image itself can be no smaller than 3"x3" and no larger than 4"x4" (though I'm sure the size can probably be scaled up or down when printing---so I've been told). Thank you in advance for all who decide to help me out. By the way, I don't need the circle in the triquetra (just the triquetra itself). Feel free to email me your design at <a href="mailto:dreinva@yahoo.com">dreinva@yahoo.com</a></p>
    <p>And now abideth faith, hope, love, these three; but the greatest of these is love.<br>
    And now abideth faith, hope, love, these three; but the greatest of these is love. I Cor 13:13<br>
    And now abideth faith, hope, love, these three; but the greatest of these is love. I Corinthians 13:13<br>
    (whichever length works best)<br>
    Lucinda Handwriting (if it's no more work to switch fonts, I'd also like to see it in Minya Nouvelle)</p>
    <p>Unfortunately, the guy who's doing my tattoo is fairly new and only hand draws his tats. This tat has to be done with a program for it to come out right (as the letters have to be SPOT ON). That is the reason I'm asking for assistance from you guys.</p>
