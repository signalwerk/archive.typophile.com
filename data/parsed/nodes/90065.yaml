      <p>Please don't be offended, but if you are getting text tattooed, go to someone who has specific examples of text tattoos in their portfolio. Letterforms are very hard to tattoo properly and if you're going to have it for the rest of your life, it might as well be well done.</p>
      <p>That said, go talk to a couple of artists and ask them about size, the amount of text, the design and placement.</p>
