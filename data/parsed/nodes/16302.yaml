    <p>Hi,<br>
    Althought I am reading your posts for a year, this is my first post.<br>
    I'm working on a logo for a delivery express company named Kangaroo.The company has several activities: expressdelivery, expressdistribution, directmail, floralexpress.<br>
    I was asked for a redesign of their logo. What do u think? The type is a modified version of erasltc. Here are the 2 proposals and the old logo too. I prefer kangaroo.gif.<br>
    Thank you very much.</p>
