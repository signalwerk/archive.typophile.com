    html: <p>Of course I find new logo idea well. The old was well working too. Often you you must not to redesign logo global but rather improve. Example of such redesign is german railway by Kurt Weidemann. Comparison of old kangaroo logo could be also <a href="http://www.lupach.de" title="http://www.lupach.de">http://www.lupach.de</a> I have created for my customer. It`s not stylish, but well understandable by target groups. So I would improve impact of experess and comprehensibility in new version.</p>
