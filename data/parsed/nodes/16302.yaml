      <p>I love where you're going with the most recent upload, but I am bothered by the line weight of the kangaroos silhouette. It feels too thick around the ears/head. I would definately stay on this track, but finesse the kangaroo a bit more. </p>
      <p>The typography is very nice, but I would definately keep "express" at the bottom. And again, I see what you are working at with the dual "oo"s at the end, but they need a little more work.</p>
      <p>But its definately in the right direction, no doubt. Keep at it!!!</p>
