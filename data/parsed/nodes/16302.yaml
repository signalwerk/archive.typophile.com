    html: <p>My take on the look is you really need to discuss this with the ad agency and the marketing department. Its a cute look but the marketing of this business probably needs a bigger picture view. Think of Geico, they created a cute Geko to act as the image of the company. This is a situation where they can either be major players or the little guy.</p>
