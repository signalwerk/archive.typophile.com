    html: |-
      <p>ID does not have a proper hanging control.</p>
      <p>In regular text you can combine a left indent with a first line negative indent to simulate this –a solution valid just for the paragraph opening. The other resource is to activate optical adjust for margins –again, a very limited procedure for achieve hanging aligment, useful most for quotes and capitular swashes.</p>
      <p>In a table, the same limitations from regular text are also present. You can just simulate the hanging effect placing the brackets in a thin first column and the remaining text is the next one. A sample:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/idtable_4112.gif"></div><p></p>
      <p><em>Example above shows optical margins adjust working in table. Table below pretends a hanging aigment with additional column at left.</em></p>
