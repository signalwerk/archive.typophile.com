    votes: null
    html: |-
      <p>I'd probably use the first method that Freiberger suggested -- left indent with negative first line indent. I'd create a style sheet for that formatting and apply it to all paragraphs that begin with a bracket. </p>
      <p>If you also have some paragraphs in that table that don't start with a bracket, I'd create a separate style sheet for them that was identical except it didn't have the 1st line negative indent. </p>
      <p>If the bracket is not on the paragraph's first line, you'll need to put a hard break at the end of the line above it, so that InDesign views the bracketed line as the start of a new paragraph.</p>
