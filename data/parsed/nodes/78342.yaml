  html: <p>I am currently working in InDesign CS3 and would like to hang brackets in tables. Is this possible? I have asked around and searched the web but yet to find a solution. Any help would be much appreciated.</p>
  html_clean: <p>I am currently working in InDesign CS3 and would like to hang brackets in tables. Is this possible? I have asked around and searched the web but yet to find a solution. Any help would be much appreciated.</p>
