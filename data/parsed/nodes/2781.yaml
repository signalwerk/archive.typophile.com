    html: <p>&gt;a font for the magazine name <br> <br>In that case, I really like your suggestion, as Panoptica looks very different and trendy - suitable for the purpose - but actually good. <br> <br>Another good option for a title is <a href="http://www.fontbureau.com/fonts/font_frames.tpl?cart=10747087233638044&amp;fontname=Amplitude" target="_blank">Amplitude</a>. The ultra all lowercase might look great, as the title is only 6 letters. It has 'edge' and is very stylish. It is so bold you could also do an outline and stick pictures in it.   </p>
