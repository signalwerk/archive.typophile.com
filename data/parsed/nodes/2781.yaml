    html: <p>Tiffany, <br> <br>If you mean sparkly as in light, Jim has digitized an even lighter version. There was a beautiful award winning Dutch Design magazine that used Albertan. It was printed on a light bees wing book paper. Truly beautiful. <br> <br>Sparkly can be a really good thing. <br> <br>When I  am completed with the project I will send everything along to you. The bold is in question, Jim has redrawn or refined the bold. I am not sure what Lanston's status will be with that? The naming will be more self explanatory throughout. We have dropped the Monotype operators codes. <br> <br>In otherwords, it will not be Albertan L, it will be Albertan Lining Figs. <br> <br>But I no longer have your e-mail address. We changed web hosters, naturally loosing many e-mails. If you drop me a note, I think the Metropolitan is finished. I could send it along. At least I will try before I move.  <br> <br> <br></p>
