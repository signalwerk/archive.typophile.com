    html: <p>Well . . . how about a proven face by famous Canadian type designer, Jim  Rimmer? Jim has cut many faces in hot metal for letterpress printing. One of the greatest living masters.  <br><a href="http://lanstontype.com/JimRimmer.html" target="_blank">http://lanstontype.com/JimRimmer.html</a> <br> <br><a href="http://lanstontype.com/Albertan.html" target="_blank">http://lanstontype.com/Albertan.html</a> <br><a href="http://lanstontype.com/AlbertanItalic.html" target="_blank">http://lanstontype.com/AlbertanItalic.html</a> <br><a href="http://lanstontype.com/AlbertanInline.html" target="_blank">http://lanstontype.com/AlbertanInline.html</a> <br> <br>Rimmer's Albertan package comes with small caps, oldstyle and lining figures, and all the ligatures. <br> <br>Bookish, modern, yet traditional. The Inline gives the same pucker as eating Kefalograviera Metzovao Saganaki on a hot summer eve. Think about it? <br> <br>Shamelessly Zesty!</p>
