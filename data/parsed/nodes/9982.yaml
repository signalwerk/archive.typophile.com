rred CT settings? What I'm getting at is, if you're going to say that the particular equipment you use when viewing these pages is important, than you ought to specify the equipment. That way some of us might be able to view the material under optimum conditions. I would expect that everyone reading this has some kind of reasonable minimum as regards equipment, but perhaps I am naive?</p>"
  - id: 63510
    user: 1262
    date: 2005-03-30T04:54:00
    date_raw: 30 Mar 2005 — 4:54am
    votes: null
    html: "<p>Bill, see my response in the 'CT and the future' thread re. Verdana and Georgia. <br> <br>[I'm sitting here -- unable to sleep as it happens -- wondering if it is possible that we might actually have a civil discussion. I would like that.] <br> <br>I think the new CT fonts might <i>seem</i> compressed because they're not what we've become used to in 'screen fonts'. With the exception of Calibri, which I think of primarily as a subhead type, they're actually not compressed in terms of the norms of print typography. Candara is very generously proportioned, and Corbel and Constantia are both quite typical in width for sans and serif text types. ClearType reduces the gap between screen and print, and as it and monitor resolutions improve the gap will be further reduced. Unlike some of the people at MS, I'm not convinced that reading on screen will ever be as comfortable as reading print (presuming similar levels of relative quality -- there is some printing that is decidedly worse than text on screen!), but I do think that ClearType brings the conventions of screen and print typography closer together. Yes, after using Georgia and Verdana in every screen reading situation for so long because they were the only option, most other fonts are going to seem compressed at first. <br> <br>Yes, numerals were tested in text. I have a theory about numbers on screen, based on the fact that we don't actually read numbers in the same sense that we read text (except perhaps commonly recurring numbers such as dates from recent years). I suspect that we notice the compromises of low resolution more consciously in numerals than in letters forming words. <br> <br>By the way, the new CT fonts all contain at least four different numeral styles (not counting superscript and subscript): proportional oldstyle, proportional lining, tabular oldstyle and tabular lining, and some of the families also include smallcap lining numerals. MS decided that the proportional oldstyle figures would be the default for all the families except Cambria (the latter is intended things like for business documents, in which tabular lining is likely to be expected as default). <br> <br>I will try to find some time to post more graphics in the next few days. If you let me know what kind of things you would like to see in a fitting text, I can see what I can do. Making the graphics with my test tools is time consuming, because I can't show multiple sizes or styles at the same time, so have to cobble the graphics together. <br> <br>Regarding my monitor, as I noted in the caption for the first graphic, my display is 146ppi. This is a 15\" widescreen Dell laptop display, running 1900 x 1200 pixels. So I have a pixel pitch of about 0.1725mm. As far as I know, it is the best display this side of the IBM 200ppi monitor. <br> <br>I have another laptop that I use when I'm travelling because it is very small and light, but it only has about a 105ppi screen and it is very difficult to go from reading ClearType on my Dell to reading it on the lower resolution screen. For some tasks, I turn ClearType off on the smaller machine and use b/w rendering instead. ClearType really comes into its own around 130ppi: that's the 'sweet spot' at which, even at text sizes, design details like serif form start to become distinguishable and the individual identity of typefaces start to assert themselves.</p>"
