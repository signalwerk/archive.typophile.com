    html: <p>This is great, thanks very much. At first glance I see nothing alarmingly irregular in this (the Calibri spacing), although I could (and in fact do) quarrel with the underlying parameters, but that is another issue. This makes me suspect that there really _is_ something fantastically wrong with the Poynter showing. I should have the book soon, anyway. But ... if the Poynter setting is an accurate representation of the book (and I see no reason to suppose that it is not) and if the book, therefore, has some really awful spacing, the question arises, how on earth did it get there? Is it even remotely possible that the book was set with InDesign, with the optical kerning settings on? And could they have caused these problems? Just last week, finally, after all these years, I actually tested InDesign CS for an article. (Surely, John, you will be glad that I have done this, as you have been asking me to do it since at least the end of 1999!) I discovered some rather alarming things about the optical kerning - far worse than anything even I ever suspected. Could that be the problem? Or, could some designer have done some hand kerning that was hopelessly misguided? Such things, after all, do happen! Needless to say, it's MS that ought to be finding out the answers to these questions, not me! But let me get on with my measurements. Too bad I don't have the fonts! I should hate to have to go abegging to the ACT for them!</p>
