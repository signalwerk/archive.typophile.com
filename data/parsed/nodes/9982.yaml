    html: <p>If you are referring to the image of Calibri on &lt;a href="<a href="http://www.poynter.org/column.asp?id=47&amp;aid=78683" target="_blank">http://www.poynter.org/column.asp?id=47&amp;aid=78683</a>"&gt;this page&lt;/a&gt; then that is not the character set showings to which I referred, but part of the text samples which should not be optically kerned and, obviously, are not tracked. To confirm what we're talking about can you grab and post the precise image from the Poynter pages to which you are referring, and let me know what combination you think has spacing problems. Then I can check it against the book in print, and also check the original InDesign file. <br> <br>I'm intrigued to know how the Poynter people produced the images. The website says the images are scanned from the book, but the total lack of any paper texture indicates that the scans have been touched up in Photoshop. <br> <br> <br><i>Good Heavens! John! Do you realize that's how our famous quarrel started?</i> <br> <br>Really? I never understood how it all started. If that was it, it hardly seems worth all -- or any -- of the years of bitterness, insults, accusations, etc. <br> <br> <br>Anyway, here is the Verdana / Meiryo Latin comparison, which I think is very interesting. The differences in the designs on screen are much more evident than they are in print, especially at the larger size shown here (nominal 11pt on my setup). <br> <br>The very tight linespacing is generally acknowledged as the sole obvious fault of Verdana (and also Georgia). The linespacing of Meiryo is particularly huge in comparison, but bear in mind that the linespacing in Meiryo is primarily intended for Japanese text, of which I'll post an image shortly. <br> <br>Left, Verdana. Right, Meiryo. Total graphic width on my screen = 152mm. Longhorn CT rendering. <br> <br><img src="http://www.typophile.com/forums/messages/30/68452.gif" alt="Verdana/Meiryo comparison"></p>
