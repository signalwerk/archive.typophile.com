    html: <p>Thanks, John, for these marvellous specimens. I am just blown over by how much more readable Verdana is than anything else you have shown. You have really helped me deepen my appreciation of Verdana. In the past, I believe I have muttered some words to the effect of 'oh, Verdana, nothing special, anyone who has ever seen a 4-1/2 point news sans could have done it.' And I have also said that Verdana was the world's ugliest sans serif, even if it was also the world's most functional. Well, I take that all back. Verdana is a miracle of legibility, and in massed type, as you have set it here, I must to my utter astonishment admit that I actually find it almost heartbreakingly beautiful. Now those are words I thought I would never utter!  <br> <br>Again, with Georgia. You really help me see why it is so much more readable than the comparison fonts. Carter is really much better than even I thought he was. <br> <br>Great job!</p>
