  - id: 63509
    user: 4019
    date: 2005-03-30T01:02:00
    date_raw: 30 Mar 2005 — 1:02am
    votes: null
    html: "<p>This is a fascinating display. It is immediately clear that Verdana, in either rendering system, looks better than the other sans serifs. It is less obvious why Georgia, again in either rendering system, is superior. Very generally I would suggest that it is a matter of the proportions - - the proportions and weight of each letter individually, and each in relation to its neighbour, the perfect judgment of the serifs, which really do aid readability, and the well-judged x-height. What I find particularly remarkable is that when magnified even a little, one sees that the rendering of the newer fonts is better in some respects than for Georgia. Yet there is something so sturdy and functional about the shapes of Georgia that even at its worst, it easily emerges as the most readable. How on earth did he do it? <br> <br>One thing I am curious about is that so many of the new fonts seem to be somewhat compressed. Traditional wisdom has it that this impedes readability, and I am with traditional wisdom here. But was there a practical reason to make the new fonts slightly compressed? <br> <br>I notice also with interest that few of the numbers in the new fonts seem happy. Some are too small, others have too much ascender and descender play, few seem just right in relation to text, although they might look fine on their own. Were they tested in text?  <br> <br>Do please post some more. It would be nice to see Meiryo Latin, and it would be lovely to see Georgia in one of the narrower columns of continuous text such as the one directly above. <br> <br>it would also be great to see some larger text samples and perhaps a few fitting tests. <br> <br>Oh, and a question: you write, \"I suspect that most of you will have a lower resolution screen than mine, so the graphics will appear larger on your screens than on mine.\" <br> <br>Could you tell us what your resolution is? Is it some special kind of monitor that can't be generally bought? And what are your preferred CT settings? What I'm getting at is, if you're going to say that the particular equipment you use when viewing these pages is important, than you ought to specify the equipment. That way some of us might be able to view the material under optimum conditions. I would expect that everyone reading this has some kind of reasonable minimum as regards equipment, but perhaps I am naive?</p>"
