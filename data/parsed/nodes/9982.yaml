  - id: 63521
    user: 4019
    date: 2005-03-30T23:32:00
    date_raw: 30 Mar 2005 — 11:32pm
    votes: null
    html: "<p>Most interesting images. I hate to be so perverse, but I don't think I like Meiryo as much as Verdana. However, I've only looked at these images, briefly, on the Mac, on two monitors, 1600x1200, colour and greyscale (which remains I must say sharper than anything else I've ever seen). I'll look on the PC later. Speaking of which, I have exactly the same Dell screen you specified. Does it make any difference what browser is used? How should ClearType be set up? And are there any other desired parameters? I wouldn't want to make some silly mistake in some setting that would invalidate the view. <br> <br>But before anything else, and just based on the quickest glance, I am coming to wonder the following: I am not at all sure I like the new proportions of Meiryo (considered not at all as a companion to Japanese, but simply as an alternate Latin to Verdana - that is of course a wrong consideration, but let it stand for the sake of argument), and I know I don't like many of the proportions (x, desc, asc, cap height) of the new CTs. So: is there a technical reason for these proportions? Or was there some research which suggested these proportions as desirable and which was incorporated into the design briefs? I suspect I'm on the wrong track here, but I do wonder. <br> <br>Speaking of the design briefs, that is helpful background, and there is much to respond to in that and other areas when time allows. <br> <br>Finally, I find myself uncomfortable with the new default line spacings, which I find too generous. I wonder the following: are the new line spacings calculated to improve comprehension of every word? If so, is it possible that they impede rapid skimming? My point being that I don't actually want, on screen, in many cases, to read every word of text before me as I haven't the time. I want to be able to glance at the entire paragraph and take away as much information as I can in a couple of seconds. For this purpose, I would suggest that tighter default line spacing might be more helpful.</p>"
