    html: <p>The 'Longhorn CT' example (more accurately the Avalon WinFX rendering) uses subpixel spacing, so if you look at other T's (like the T in Everson Typography) you'll see that the bitmap pattern is different. In the XP version which snaps to whole pixels every T is the same.  <br> <br>The trade-off here is better spacing vs consistent bitmap pattern.  <br> <br>Cheers, Si <br> <br>PS Nick - Irish Bloggers alert - <a href="http://www.sluggerotoole.com/archives/2005/03/fontastic_paper.php" target="_blank">http://www.sluggerotoole.com/archives/2005/03/fontastic_paper.php</a> ;-)</p>
