    html: "<p><i>In the specimen, (Post Number: 1857), both the images of the glyphs and the spacing between the glyphs varies. So, when I say color has become more important than rythym, you know what I mean.</i> <br> <br>Can you perhaps grab the image and edit it to indicate specific places where you think the spacing varies? I'd like to confirm that we are talking about the same thing. <br> <br>If the spacing did vary, it could only vary by a subpixel, but I think there is a spacing illusion caused by the variation in the glyph rendering that may account for what you are seeing. If you look at the close-up from the Meiryo in post number 1857, below, you will see that the spacing of touched sub-pixels is actually very regular indeed, but the colour density of those touched pixels varies, making some glyphs look lighter on one side or the other. I think this can create the illusion of greater space between some glyphs than others. <br> <br><img src=\"http://www.typophile.com/forums/messages/30/68521.gif\" alt=\"Meiryo subpixel close-up\"> <br> <br>The question of rhythm is an interesting one in regard to screen typography, because although it is possible to create very regular intervals of verticals in b/w bitmap rendering -- and this was a major goal of most of the hinting that has been done in the past decade and a bit -- this is done at the expense of that interplay of rhythm and form that we prize in good text faces for print. So, for example, the subtle reduction in the widths of the bowls of a lowercase <i>m</i> relative to that of the <i>n</i> is abandoned in b/w screen rendering in favour of total regularity in the spacing of verticals. Is this really typographic rhythm? Or is it a mechanically determined simulacrum? The rhythm of a well hinted font in a b/w display, compared to the rhythm of even the same typeface in print (Verdana is a good example, despite being designed around bitmaps: Matthew has put into the design as much subtlety of rhythm as he could, which is only evident in print), is a bit like the rhythm of a drum machine compared to Buddy Rich. <br> <br>The promise of sub-pixel rendering and positioning -- only just beginning to be delivered on the higher resolution screens, in my opinion -- is that the subtleties of typographic rhythm, i.e. rhythm as it relates to form and not merely to regularity, can be deployed on screen as it is in print. (although obviously not to the same degree of refinement). <br> <br>I think at the moment, we're in an awkward position where the technology of screen displays is in transition, and we can no longer optimise type for a presumed level or type of display, as we could when MS commissioned Georgia and Verdana. ClearType is in part an anticipatory technology. This is also true to some degree of the new CT fonts; there are details in Constantia, for example, which probably won't be evident on screen, except at very large sizes, for several years, but they are based on the direction of development of both the CT renderer and screen resolution.</p>"
