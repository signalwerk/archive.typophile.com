    html: <p>OK. I know I'm going to get jumped on for all-surpassing ignorance in this area, but why is it necessary for the same consecutive letter to be rendered differently? Is there some good documentation anywhere that would explain this? (And if you tell me it's all in that book I haven't read yet, I shall offer myself as a sacrifice to -- well, something with a typographic theme.) That can't, intuitively, be desirable. Yet it doesn't seem to make much practical difference either, does it? Is this one of those cases where you get say 70% advantage and 30% disadvantage, so you go with it since the benefits outweigh the losses? Also, now that we are getting a little technical, how do competing systems work? What parts do patents protect? (I suppose I should just look them up instead of asking. -- uspto.gov, I think, for anyone interested, or just google patent server.)</p>
