    html: <p>Matthew Carter's Georgia is a work of genius, rightly acknowledged as the state of the art for b/w screen rendering, so I'm starting the visuals with a comparison of Georgia and Constantia in two different CT rendering environments, to show how the state of the art for b/w rendering is not necessarily ideally suited to the new rendering systems. This is primarily a comparison of a font optimised for one renderering technology and one optimised for another. <br> <br><img src="http://www.typophile.com/forums/messages/30/68222.gif" alt="Georgia/Constantia comparison WinXP"> <br> <br><img src="http://www.typophile.com/forums/messages/30/68223.gif" alt="Georgia/Constantia comparison Longhorn"></p>
