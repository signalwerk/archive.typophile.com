    html: <p>Ah. It _could_ explain everything, if the text in the Poynter specimen was, indeed, kerned by InDesign. <br> <br>Of course, one couldn't be sure without testing the font in InDesign, but I have a very good idea of what might have happened. <br> <br>Consider the word ' jumps' set at 12 point in Adobe Garamond OT Pro. No kerning for any of the letter combinations. Everything just sets perfectly, it has been perfectly spaced by not any longer so Slimbach. Now apply 'optical kerning'. InDesign subtracts 23 units of space between j and u, adds 14 units between u and m, subtracts 16 units between m and p, and -1 units between p and s.  <br> <br>The u is now much too close to j, and there is a coruscating river of space between u and m. A well-made font is now useless -- it looks like shareware. <br> <br>Something very like this could  have happened to the text shown on Poynter, and tracking would only have magnified the unfortunate artefact.  <br> <br>For many years I suspected that what I have just described would happen with InDesign optical kerning. But because of my friendship with John, and my relationship with </p>
