    html: "<p>Hmmm. Sleep well!  <br> <br>When you rise, I'm curious: The specimen that shows the lines of letters repeated... In the old mak days, there was an option for switching from sub-pixel to whole pixel positioning. (it was not called that , but that''s what it did). In those days, you could tell right off by putting your finger on the i or l key, and holding it for while, then, if you looked closely at the picket fence, you could see some spaces larger than others in the sub-pixel positioned vs. pixel positioned specimen, where the picket was/is perfect. <br> <br>In the specimen, (Post Number: 1857), both the images of the glyphs and the spacing between the glyphs varies. So, when I say color has become more important than rythym, you know what I mean. <br> <br>Agreed or halucination? <br> <br>(Also, if I were in charge, I'd make the dot on every i in this specimen, every one, twice as heavy (taller in this case). Then I'd spend the rest of the day on the j dot.  <br> <br>Otherwise, I think these are some of the finest looking screen shots of what must be the finest screen type that can be made with XP's CT. <br> <br>Agreed or halucination?</p>"
