    html: <p>Not to toot my own horn <i>too</i> much, but this <a href="http://www.artofcode.com/ei04/contrast.pdf">paper</a> presented at Electronic Imaging '04 might help with questions about how changes in display resolution affect text rendering contrast. See also Avi Naiman's thesis (<a href="http://www.iro.umontreal.ca/~poulin/fournier/theses/Naiman.phd.ps.gz">link to PS file</a>) for an older but thorough study, especially of AA vs. bilevel rendering. Unfortunately, most of his work was done with CRT displays and doesn't generalize well to LCD's, for the reasons that Mark pointed out.</p>
