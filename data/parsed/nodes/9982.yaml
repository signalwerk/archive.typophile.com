  - id: 63542
    user: 4019
    date: 2005-04-04T17:00:00
    date_raw: 4 Apr 2005 — 5:00pm
    votes: null
    html: "<p>So you're saying that it's kind of ironical to discuss the qualities of a series of type designs, because the designer doesn't have control over the design anyway, because the new rasterizer for which the types have been developed will render them in dozens of different ways on the screen? Is that the basic point?  <br> <br>Well, so it is. That raises the question, at what point does this make any perceptible difference in the real world? Isn't that part of the science of CT, that artefacts will not be perceptible? I suppose there is the possibility that the studies are all wrong, and the artefacts will actually result in subliminal viewing fatigue, but that seems far-fetched. <br> <br>A problem, I now see, with John's images, is that they are, in fact, images, and can thus be enlarged and substantial defects revealed. <br> <br>But so what? If you enlarge a photo too much, and put your nose right to the print, the grain will be too large and you won't see anything. But if the normal viewing distance is respected, everything looks sharp and artefact-free. <br> <br>The same applies here. When we are looking at real CT onscreen, will we really be able to tell that characters are non-uniformly rasterized and that spacing is subliminally irregular? And if we enlarge the type onscreen, won't such artefacts decrease, not increase? I mean, the type is scalable, so artefacts should be less and less obvious as size increases. (The exact opposite happens with John's images, since they are images of type, not actual type. I hope this is clear to everyone - it is the nature of the bitmapped image versus the nature of scalable type.) I say that I expect CT artefacts to decrease as size increases, and I do, but will that really happen? <br> <br>Re increasing the density of the dot of the i, may I play devils advocate and ask if there isn't a point, in a high x-height font, where the i could then be confused with the l? The possible advantage of a weak dot on the i is that you might minimize this possibility. <br> <br>Re customers with old equipment, MS must be calculating that those who buy Longhorn will primarily have LCDs with reasonable resolution (at least 1280x960 I would guess) and must have reasonable grounds to make this calculation.  <br> <br>How will the CTC types render on older screens using older versions of Windows?  <br> <br>And should we be worrying about that? Isn't the whole point of these types that they are not recommended for webpages? <br> <br>What interests me more is the hint of a closed, proprietary nature of the type system - a holy grail that the type industry has been searching for ever since the unfortunate invention of PS and TT. <br> <br>How does CT-style rendering contrast with Cool Type and Quartz when used with older CRTs? <br> <br>Mais je divague. I don't want to lose track of my question: we have established that CT will render 7 consecutive i's in 7 different ways. But we also know that we will never normally have to view a text stream of 7 consecutive i's. However, the point is has been made: strokes are rendered differently, according to their position on the screen vis-a-vis subpixel positioning. What do we gain from this? What do we lose?  <br> <br>And another question: what is the processing overhead for CT? We know it is turned off by default in XP, but why? Turning off a great new feature by default is always a mistake, as GX showed. So what's the problem with CT that mandated this counterintuitive situation?</p>"
