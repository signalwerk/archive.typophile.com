    html: <p>In the <i>Now read this</i> book there is only a very small, three line comparison of Verdana and Meiryo, but the most obvious thing about it is that Meiryo is more space-efficient than Verdana. I was wondering how much more efficient, so prepared this illustration. The strings of letters in this image represent the relative frequency of lowercase letters occuring in an English text of 34,643 words; I've compared this to frequencies in other, somewhat smaller samples (c. 10,000 words) to confirm that it is similar or identical to what you could expect in other texts. The only distortion in the frequencies is the q, which was rounded up to 1 from .3 in order to ensure that at least one instance of every letter appeared in the sequence. <br> <br>To assist comparison, I have reduced the linespacing of Meiryo in this graphic to match that of Verdana. <br> <br>Top, Verdana. Bottom, Meiryo. Total graphic width on my screen = 149mm. Longhorn CT rendering. <br> <br><img src="http://www.typophile.com/forums/messages/30/68455.gif" alt="Verdana/Meiryo relative space efficiency"></p>
