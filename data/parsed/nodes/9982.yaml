    html: "<p>In CT rendering, outlines are 'supersampled' across 16 pixels, and for colour filtering purposes these are weighted to account for greater human sensitivity to some colours than to others: Green 8, Red 5, Blue 3, if I recall correctly. As I understand it, it is impossible to employ subpixels positioning without <i>some</i> effect on contrast, because of the difficulty of obtaining identical shades of 'grey' in red, green and blue subpixels. Nice graphic, by the way. <br> <br>I've asked Greg Hitchcock at the MS ART group about the stem rendering and resulting illusion of spacing variation. Hopefully either he will chime in here or provide me with some information that I can post.</p>"
