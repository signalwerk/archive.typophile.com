igures would be the default for all the families except Cambria (the latter is intended things like for business documents, in which tabular lining is likely to be expected as default). <br> <br>I will try to find some time to post more graphics in the next few days. If you let me know what kind of things you would like to see in a fitting text, I can see what I can do. Making the graphics with my test tools is time consuming, because I can't show multiple sizes or styles at the same time, so have to cobble the graphics together. <br> <br>Regarding my monitor, as I noted in the caption for the first graphic, my display is 146ppi. This is a 15\" widescreen Dell laptop display, running 1900 x 1200 pixels. So I have a pixel pitch of about 0.1725mm. As far as I know, it is the best display this side of the IBM 200ppi monitor. <br> <br>I have another laptop that I use when I'm travelling because it is very small and light, but it only has about a 105ppi screen and it is very difficult to go from reading ClearType on my Dell to reading it on the lower resolution screen. For some tasks, I turn ClearType off on the smaller machine and use b/w rendering instead. ClearType really comes into its own around 130ppi: that's the 'sweet spot' at which, even at text sizes, design details like serif form start to become distinguishable and the individual identity of typefaces start to assert themselves.</p>"
