      <p>here is an example showing Natural Widhts ClearType v Subpixelpositioned CT. For reading I much prefer the more accurate spacing and placement of glyphs in the SPP case. There is a slight loss of contrast but the gain is more accuracy in letterfit or letterspacing, (see the word "subtleties" in both cases. I find the SPP to be much better spacing, find your own favorites :-) and a much more even tone or typographic color to the page. I dont notice the different stems when set in normal text, of course its more obvious when a line of "i's" are set together. </p>
