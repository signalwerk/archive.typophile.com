    date: 2005-04-02T07:37:00
    date_raw: 2 Apr 2005 — 7:37am
    votes: null
    html: <p>I find anti-aliased text easier to read than aliased, at least on LCDs (and I don't use anything but LCDs these days). When I was running OS9 on a Powerbook, I always found the text to be <b>too</b> crisp, having an effect similar to the "dazzling" which affects print faces when there is too much contrast between the thicks and thins. <br> <br>On an LCD, you get sharpness similar to print, but at a much lower resolution. Try reading aliased type in print and you can see the problem. Some sort of anti-aliasing is called for, but clearly there are differing opinions about the best approach. <br> <br>CRTs are a different story. I would agree that aliased text looks better. But I think this is because of the inherent softness of the CRT. Anti-aliasing just makes it look even softer and blurrier. <br> <br>This debate will probably continue inconclusively until reasonably-high-resolution displays become the norm and the point becomes moot  (i.e., indefinitely).</p>
