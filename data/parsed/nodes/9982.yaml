    html: "<p>The Longhorn renderer can apply y-direction antialiasing to smooth horizontals, but this would normally only be turned on as the type size increases (this is design specific: MS have defined a new GASP table format so that font developers can set the sizes at which y-direction antialiasing kicks in). Y-direction antialiasing makes display type look excellent, but as in the OSX display, it reduces contrast and crispness at small sizes. One thing that pretty much all legibility/readability research agrees on is that contrast is key to reading.</p>"
