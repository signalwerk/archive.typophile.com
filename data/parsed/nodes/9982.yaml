    html: <p>Okay, one last post, and then I'm going to sleep. <br> <br>Since you're looking at screenshots rather than live rendering, it doesn't matter how you have your ClearType tuned. What you are seeing is how I have <i>my</i> ClearType tuned. You should be able to make a direct comparison of live Georgia rendering on your own screen to the first image above if you do want to compare tuning. Be sure to compare to the WinXP rendering in the image, not the Longhorn. The background colour of the above images is R255,G255,B220. <br> <br>The proportions of the new types was not technically determined, no. The horizontal proportions were left to the discretion of the designers. Since the new CT renderer allows glyph boundaries to fall on subpixels, there isn't a technical need to conform to something approximating full pixel widths as there was for Georgia and Verdana. As I wrote previously, I think part of your reaction to the proportions of the new types might be that you are so used to the wideness of Verdana and Georgia in on screen reading. I'd be interested to know, in a couple of years, after you've had a chance to live with the new types for a few months, whether you still dislike their proportions. <br> <br>Regarding the linespacing, the idea was that the <i>default</i> linespacing should be similar to that which one would use e.g. in a book for a text column of typical length according to the canons of traditional typography. I don't think one can make assumptions about how people want to read text on screen. Yes, there is probably more skimming on screen than in print, simply because of the quantity of information presented, but I think it would be a mistake to set default vertical metrics in a font based on this. And, as I say, this is only the default spacing, employed where there is no human intervention in the linespacing. You can always increase or reduce the linespacing as appropriate to particular text using CSS. <br> <br>Goodnight.</p>
