    html: <p>Counting subpixels in the enlargement above, I note that there seems to be a single subpixel increase in space between the touched subpixels of the 2nd and 3rd <i>i</i> and between the 5th and 6th. But this is because the stems of the 3rd and 6th <i>i</i> appear to be one subpixel narrower than the others. This confirms my suspicion that the actual spacing is regular -- in terms of the advanced widths of the glyphs falling on regular subpixel boundaries --, but there is an illusion of spacing variation based on the variation in stem rendering. <br> <br>At this point in the conversation, it would probably be helpful to hear from Mike Duggan or Beat Stamm, since we're reaching the limits of my own technical knowledge of ClearType. Once we start getting into the maths of supersampling and colour filtering, I'm less confident in my ability to explain, or even understand.</p>
