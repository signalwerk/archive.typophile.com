    html: <p>I have no intention of sounding typographically blasphemous, but which was exactly the reason which pushed in the direction of having anti-aliased text display in the new Operating Systems? <br> <br>It may be I'm negatively naive or it may be my total ignorance on the matter (and on advanced technical issues), but I keep looking at anti-aliased type and still miss in which way it could/should be better than aliased one. <br> <br>At the beginning I thought the idea and the direction taken by the research on onscreen readability might have come from the need of having a better rendering of Japanese or graphically complex glyph systems (even Arabic, which I assume is harder to read in small sizes compared to Latin), but in the end I came home after work, and as I switch on my Mac with Os9, I can't help but being delighted by Georgia and even Arial in their aliased form. <br> <br>Is there a main reason for which people felt the need of an anti-aliased screen typography?</p>
