    html: "<p>John: thanks for explaining in simpler terms. In the case of ClearType, it's clear that it's not <i>just</i> a case of offsetting by 1/3 pixel (i.e. whole color stripe) increments, as you can see from the following example (taken from your Meiryo, but with the stripe pattern faded in so you can more clearly see the pattern in the underlying subpixel image). <br> <br><img src=\"http://www.typophile.com/forums/messages/30/68580.png\" alt=\"stripe example\"> <br> <br>Note how the first two i's have a \"darkest pixel\" width of two pixels, while the third's is a single pixel wide. If I had to guess, I'd say that the subpixel positioning is calculated to 1/6 pixel accuracy. So the subpixel offset <i>does</i> have an effect on contrast, even aside from the question of which color stripes get addressed.</p>"
