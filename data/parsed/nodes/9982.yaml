ges will be helpful to making up your own mind about these fonts, but I maintain that the real time to judge these fonts will be when Longhorn ships and people actually start using them. <br> <br>One final note, where I label an image as 'Longhorn CT rendering' this is actually output from a test app using the Longhorn APIs running under Windows XP. This test app does not, currently, employ the y-direction antialiasing of the Longhorn renderer, so I will limit such examples to typical text sizes. I can post some display size examples from another test application, but this will not show sub-pixel positioning. <br> <br> <br>PS. If nothing else, this thread might convince some people of the near impossibility of forming a valuable judgement of screen typography via screenshots. I just looked at the images below on a 96dpi screen, and they look worse than I feared. Live text on your own screen is the only way to judge these things at all well, and even then you are likely to learn as much about the limitations of your screen as you are about the qualities of the type.</p>
