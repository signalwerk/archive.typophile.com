    html: "<p>Yes, Verdana is really excellent: difficult to improve on, and it adapts well to ClearType. It will be interesting to see what people think of the Meiryo Latin, which is based on Verdana. I was about to post specimens of that type, including comparison with Verdana, but now Bill has shown up in this thread, I'm not going to post any more. <br> <br>I think Georgia suffers under ClearType: the stem weights, geared to producing the best b/w pixel arrangements, make the colour of text very uneven under ClearType. It would be great if MS hired Matthew to revise Georgia for ClearType: it is a splendidly readable face (barring the default linespacing, which is too tight, but I doubt if that is Matthew's fault). <br> <br>Anyway, goodbye, again.</p>"
