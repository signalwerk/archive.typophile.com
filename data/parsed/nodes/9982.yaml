    html: "<p>Last image today: <br> <br>Here is a specimen of Meiryo Japanese text at the same sizes as the samples of the Latin specimens of Cambria et al, above. I know almost nothing about Japanese typesetting rules, so have just cobbled together random sentences, and I'm pretty sure that I've broken at least one rule about what characters can occur at the beginning of a line. But this gives you some idea of just how phenomenally good the ClearType rendering of kanji is. <br> <br>I've underlined, in red, an instance where the number of horizontal strokes has been reduced with hinting at the smallest size (compare to the same kanji glyph in the medium size); there may be others. Eichi Kono discusses this technique in <i>Now read this</i>, and explains the cultural precedence for this in particular calligraphy styles. <br> <br>Meiryo specimen. Total graphic width on my screen = 112mm. Longhorn CT rendering. <br> <br><img src=\"http://www.typophile.com/forums/messages/30/68470.gif\" alt=\"Meiryo Japanese specimen\"></p>"
