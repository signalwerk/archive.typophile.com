    html: "<p>&gt;John, a footnote: When you say \"One thing that pretty much all legibility/readability research agrees on is that contrast is key to reading.\" Do you mean contrast in the sense of foreground/background separation, or stroke contrast? I don't see that legibility/readability research addresses the second at all, and when it does (indirectly, through the serif / sans serif conundrum), the test--as Ole Lund's PhD thesis shows--are riddled with cognitive scientific problems. Arguments for the importance of contrast have another kind of foundation.</p>"
