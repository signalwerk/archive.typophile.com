    html: <p><i>Is it even remotely possible that the book was set with InDesign, with the optical kerning settings on?</i> <br> <br>The character set showings in the book use InDesign's optical kerning along with tracking, since the goal in this is simply to ensure that all letters are reasonably evenly spaced, including conbinations that occur in such showings but not in text so might not be kerned in the font. But none of the other showings of the fonts in the book should be optically kerned. If they were, it would be an error, and I'm sure I would have heard about it from Luc(as), because he is very particular about his spacing, as anyone who has seen his 'Kernologica' presentation knows. I don't always agree with the way he spaces and kerns, but I do know that he is very thorough in his approach.</p>
