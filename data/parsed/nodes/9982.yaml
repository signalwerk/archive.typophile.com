    html: "<p>Some informal observations: <br> <br>The biggest difference I can see in the way CT renders text compared to OSX (Panther) is in the way horizontal elements are rendered.  <br> <br>On both CT and OSX with sub-pixel smoothing on (\"Best for LCD\"), vertical elements are rendered using sub-pixel rendering.  <br> <br>With CT, horizontal elements are pixel-aligned, just like non-antialiased type. This leads to a bit of jaggy-ness in strokes that are close to horizontal, like the middle of the lowercase s in the examples John provided. The most noticeable difference in the Longhorn example is the addition of sub-pixel spacing, as Si noted. <br> <br>With OSX, horizontal elements are antialised the conventional way, using varying shades of gray. This leads to smoother glyph shapes, even in slightly horizontal elements, but also a certain degree of fuzziness with some fonts at some sizes. OSX also appears to use sub-pixel spacing because the glyph patterns vary in the same way as the Longhorn CT example. <br> <br>To my eye, CT renders text more crisply with some distortion of the glyph shapes, while OSX renders text with more even color and less distortion at the expense of crispness.  <br> <br>They both look good to me, but for different reasons. I don't know which would be best for reading.</p>"
    html_clean: "<p>Some informal observations: <br> <br>The biggest difference I can see in the way CT renders text compared to OSX (Panther) is in the way horizontal elements are rendered.  <br> <br>On both CT and OSX with sub-pixel smoothing on (\"Best for LCD\"), vertical elements are rendered using sub-pixel rendering.  <br> <br>With CT, horizontal elements are pixel-aligned, just like non-antialiased type. This leads to a bit of jaggy-ness in strokes that are close to horizontal, like the middle of the lowercase s in the examples John provided. The most noticeable difference in the Longhorn example is the addition of sub-pixel spacing, as Si noted. <br> <br>With OSX, horizontal elements are antialised the conventional way, using varying shades of gray. This leads to smoother glyph shapes, even in slightly horizontal elements, but also a certain degree of fuzziness with some fonts at some sizes. OSX also appears to use sub-pixel spacing because the glyph patterns vary in the same way as the Longhorn CT example. <br> <br>To my eye, CT renders text more crisply with some distortion of the glyph shapes, while OSX renders text with more even color and less distortion at the expense of crispness.  <br> <br>They both look good to me, but for different reasons. I don't know which would be best for reading.</p>"
  - id: 63499
