    html: "<p>Bill: if you want to control the space between letters with subpixel accuracy, then the relative offset of the glyph with respect to the pixel grid will have different subpixel values for different renderings. Otherwise, you're forced to quantize to whole-pixel space values, which can be ok if the spacing of the font is carefully tuned to screen resolutions, but can also be a serious problem for WYSIWYG rendering. <br> <br>The basic antialiasing algorithm is to render the glyph at a higher resolution in monochrome (say 400 dpi for a 100 dpi rendering), then count the number of \"on\" pixels within each 4x4 cell. If you offset the pixel by 1/4 increments, that corresponds to offsetting the high-resolution rendering by 1 pixel increments before doing the subsampling, which is all pretty straightforward. (Adobe uses 4x4 subsamping and 1/4 pixel subpixel positioning accuracy in their font renderer that ships with Acrobat; Apple does something a little different which results in even higher precision). <br> <br>Doing grayscale subpixel offset to a stem aligned to the pixel grid (as the result of hinting, perhaps) reduces contrast. If the high res rendering is ####____, and you subsample by 4, then you get #_, which is quite crisp. Move two pixels to the right, so that the high res is __####__, and the subsampled version has two pixels of 1/2 intensity. <br> <br>With ClearType, subpixel positioning has much less of an effect on contrast, because of the subpixel LCD addressing. A stem which is rendered as RGB___ and shifted 1/3 pixel to the right turns into _GBR__, which visually looks almost the same. (I believe Adobe uses 1/3 pixel subpixel positining increments in their CoolType implementation). Even if you shift by 1/2 pixel, you get _gBRg_, which is a lot better than the grayscale case. <br> <br>As far as I know, there is no patent protection on basic subpixel positioning in antialiased text (I know AA text itself goes back well over 20 years). MS, of course, has a sheaf of patents on their ClearType implementation, but it is unclear to me whether those cover the basic concept of LCD subpixel rendering, or just their specific implementation. If the latter, then Apple (with their \"font smoothing\") and Adobe (with CoolType) don't have anything to fear in the patent department. <br> <br>As for other competing systems, you might be interested in my <a href=\"http://artofcode.com/fontfocus/\">FontFocus</a>, which does <i>not</i> use LCD subpixelling, but does a much better job of preserving spacing than techniques based on quantizing to pixel coordinates. I am finding, incidentally, very little interest in the technology, so it's not clear I'm going to keep working on it (even though I do have a few more ideas on how to refine it still further).</p>"
