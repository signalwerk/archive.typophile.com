    html: "<p><i>In what way do the designs of the new CT faces address the unique qualities of ClearType, or is the program a pastiche of print typography?</i> <br> <br>Nick, do you have a copy of <i>Now read this?</i> If not, I can arrange to have one sent to you. <br> <br>In the book, all the designers discuss the specific design decisions that relate to the ClearType rendering technology. At the kick-off meeting in Redmond, we began with a technical briefing on how ClearType works, and the development progressed from that understanding. The initial phase of development for the designs involved sending test glyphs for hinting, to test rendering under ClearType. My own design went through two rounds of weight testing, with five variant stem weights. Decisions about details were informed by the kind of forms that ClearType renders particularly well, and avoiding as much as possible the kind of shallow horizontal diagonals that look jagged under ClearType. I also conducted a series of tests to determine the best italic angle for Constantia's forms under ClearType. <br> <br>The designs do address the unique qualities of ClearType. What they do not do, unlike the Base types for example, is to fetishise the technology stylistically. <br> <br>Refer also to my explanation of the design briefs in the other thread: the types need to look good in print as well as being readable on screen, because they are intended for areas of use that include both print and screen.</p>"
    html_clean: "<p><i>In what way do the designs of the new CT faces address the unique qualities of ClearType, or is the program a pastiche of print typography?</i> <br> <br>Nick, do you have a copy of <i>Now read this?</i> If not, I can arrange to have one sent to you. <br> <br>In the book, all the designers discuss the specific design decisions that relate to the ClearType rendering technology. At the kick-off meeting in Redmond, we began with a technical briefing on how ClearType works, and the development progressed from that understanding. The initial phase of development for the designs involved sending test glyphs for hinting, to test rendering under ClearType. My own design went through two rounds of weight testing, with five variant stem weights. Decisions about details were informed by the kind of forms that ClearType renders particularly well, and avoiding as much as possible the kind of shallow horizontal diagonals that look jagged under ClearType. I also conducted a series of tests to determine the best italic angle for Constantia's forms under ClearType. <br> <br>The designs do address the unique qualities of ClearType. What they do not do, unlike the Base types for example, is to fetishise the technology stylistically. <br> <br>Refer also to my explanation of the design briefs in the other thread: the types need to look good in print as well as being readable on screen, because they are intended for areas of use that include both print and screen.</p>"
