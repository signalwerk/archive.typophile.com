    html: <p>In simpler terms, Bill, the rendering will vary depending on whether a stem edge falls on an RG GB or BR subpixel boundary. That will determine across which subpixels the whole stem will fall, and hence what colours need to be dealt with. See page 13 of <i>Now read this</i>, which explains the principle and purpose of subpixel positioning. <br> <br>Note that this is particular to the new, Longhorn version of the CT renderer. The version you have on WinXP always renders each glyph the same way because the left and right sidebearings always fall on a full pixel boundary.</p>
