    date_raw: 18 Mar 2003 — 11:03am
    votes: null
    html: <p>Hi Stephen, hi Yves, hi all, <br>It's an honour to be welcomed by such harmonious flourish of trumpets. <br>The Druk story is kinda off-topic here, but let's say that all parties decided that it was time for something new, and one party (guess who) that it was time for something less expensive.  I'm now thinking about an English-language anthology of 4 years of Druk. I may have a publisher for it, I only need a volunteer with impeccable English to edit the text.... <br> <br>Any luck with the Fleischmann, Dave?</p>
