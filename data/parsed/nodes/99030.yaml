    html: |-
      <p>You can do that with pos:</p>
      <p>	lookup shiftup {<br>
      		pos hyphen &lt;0 30 0 0&gt;;<br>
      	} shiftup;</p>
      <p>It is best to add it to the case feature.</p>
      <p>Best,<br>
      Pieter</p>
