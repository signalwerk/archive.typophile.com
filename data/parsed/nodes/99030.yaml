  html: |-
    <p><strong> Hi Typophiles, </strong> </p>
    <p>I wanted to know the script that allows hyphens (and other similar signs) to adjust if they are in a cap context, or a lower case context, or even between small caps.</p>
    <p>Thank you!</p>
