      <p><cite>(not refering to this thread)</cite></p>
      <p><em>*yanks lighter away from portfolio*</em> There is hope!</p>
      <p>Well nina, what I think is best will make everyone shrill loudly. But given that the client is a relative (yes... one of those jobs <em>*wink*</em>) <strong>free</strong> will work best, even if the typeface is stretching it a wee bit. ;–)</p>
      <p>But, in a perfect world, with a little bit of persuasion, something between classy and relaxed. It is indeed a fancy restaurant, but located in suburban Connecticut, so the clientele is upper-middle class. But they certainly would stick out in a high-end NYC joint (whatever <em>that</em> means.) I'm thinking this means proportionality... a serif that doesn't let its white space (within each letterform) get too liberal. So our basic Sabon is getting close, but still doesn't seem appropriate. </p>
      <p>Or maybe, how about this: if you were taking a morning stroll through an Italian vineyard, the type of typography you'd <em>want</em> to see on a wooden sign, drenched in shadow from a canopy of trees.</p>
      <p>Not garamondial, not a (noticeably) slab serif, nothing too humanist (though a tad bit wouldn't hurt...) But I'm not too turned off from Minion, so, what I'm thinking:</p>
      <p>Is there a serif from like before the 1900s that looked like someone has designed it from the past twenty years?</p>
      <p>Very vague, but you all know so much more than I so maybe I'm barking up a tree and just don't know it yet.</p>
