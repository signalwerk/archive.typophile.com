      <p>I don't have too much experience in fine dining restaurants, but some have dim lighting, almost like candle light. Test your design in the restaurant after dark. </p>
      <p>There is a trade-off. If you want a font that's not so thin, it will probably be a little wider; more ink gets put on the paper.</p>
      <p>There is another trade-off. A font like Minion may look more<br>
      "sophisticated" than a low contrast font like Chaparral. And I say that as a big fan of Chaparral. If you have to choose between sophistication and readability...</p>
      <p>Again, I haven't seen too many fine-dining menus. But I think the diners appreciate a easy-to-read menu at the ambient lighting.</p>
      <p>J. Tillman</p>
