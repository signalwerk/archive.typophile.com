    <p>Hello all,</p>
    <p>I was wondering if anyone had any suggestions for a good menu typeface? It'd be no more than two pages; no abnormal glyphs necessary. It'll probably be set in 14 pt, with a leading perhaps a hair larger than standard (assuming standard is something like 14/16). It's a fine dining restaurant, with an Italian cuisine bias.</p>
    <p>I'm looking for a serif that isn't boring, but at the same time, something where the vertical and horizontal strokes are predictable enough so as not to be distracting to the reader. </p>
    <p>Just to give you some more ideas: When set in Minion Pro, I was pleased with the small letter width (in comparison to Times or Sabon, which I set for comparison), as well as the cleanliness, almost "friendliness" of the font. I wasn't a fan of the contrast between the thicks and the thins.</p>
    <p>Meanwhile, I also took a look at the menu set in exljbris' Fontin typeface. It was a little too idiosyncratic for my tastes, but the strength of each letter form on the page was very assertive and I was wondering if there was something similar though not as humanist (assuming I'm even using that work correctly.)</p>
    <p>Thanks!</p>
