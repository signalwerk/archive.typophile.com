      <p>He's a student, Frode. Might just be he's wanting to learn how to do this himself. :)</p>
      <p>*</p>
      <p>James: Trying to settle on the point size before settling on a font is a total shot in the dark, no matter if you say 12 or 14. :-)  Because the actual size of the letters, and the question of how large (and how readable) they <em>look</em>, is going to vary greatly according to the font you choose. 14pt doesn't need to be huge, depending on font and application. </p>
      <p>It seems to me a bit like you're trying to find too-precise answers too early. There probably isn't going to be The One Precise Perfect Font for this project, but many good options and many not-so-good ones. So what you really need now are the right <em>questions</em>. What in fact are you looking for? What do you <em>need</em> in a font so that it can do this job?<br>
      One very good point is raised by J. Tillman above. Restaurant menus are read in the near-dark – and they're not supposed to frustrate people, but tickle their appetite! So you need something that's very clear, and maybe actually is a bit bigger than usual, so that it will read pretty much effortlessly.<br>
      Are there other practical constraints?<br>
      Another question would be aesthetics – how this should feel. Classy? Standard? Expensive? Quick? Leisurely? Luxurious? If you can find some more words to describe the feeling you're after, that will make the search much easier. Also, where does your idea come from that the horizontals and verticals should not be very different? Is this just personal preference, or why do you believe it will do the job better?<br>
      And if you're stuck, just go play – try out some options, and take the printouts to an actual restaurant to check. Train your eyes; observe.</p>
