      <p>There are very useful links on the <a class="freelinking external" href="http://typophile.com/node/27804" rel="nofollow">Spacing How-To section</a> of the Typowiki, particularly those by Briem and by Jamra.</p>
      <p>I would advise you to not even think about kerning until you have the general spacing down cold. It's best to think of spacing to kerning as a one-way street.</p>
