    html: |-
      <p>HHOHOO nnonoo 000 are my key characters to determine spacing. Set these up and space them manually until you get the spacing effect you want. I usually do these before I begin the work of digitizing the entire font.</p>
      <p>Measure the space between the stems of the HH, between the stem and curve of HO, and between the curves of OO; repeat for the lowercase nn, no, oo and the zeros. If the font you were working on had serifs, you would ignore the serifs for the purpose of determining spacing.</p>
      <p>Everything else works off these numbers with adjustment for one side of those characters which don't fall into the basic shape of H and O or n and o, i.e. optical adjustments. Whatever character width you end up with for a zero becomes the character width for all numbers although for display faces this is sometimes not true. Punctuation and special characters need to be set up between the same key characters above and the best spacing determined for them.</p>
      <p>This technique will also allow you to set up far fewer kern pairs than you might need otherwise. It all depends on the design of the font.</p>
      <p>Basically, that's it. I've been doing it this way for years.</p>
