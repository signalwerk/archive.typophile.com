      <p>There are very useful links on the <a href="http://typophile.com/node/27804" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Spacing How-To section</a> of the Typowiki, particularly those by Briem and by Jamra.</p>
      <p>I would advise you to not even think about kerning until you have the general spacing down cold. It's best to think of spacing to kerning as a one-way street.</p>
