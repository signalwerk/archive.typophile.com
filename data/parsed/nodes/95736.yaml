    <p>Alright so I'm quite new to the font design world but I'm working on a geometric sans (ala Avant Garde, Futura, and the like). I've got most of my glyphs made up and now comes the fun and hard part: spacing and kerning. I'm mostly interested in workflow, since a lot of you are quite experienced I figured I'd try to gleam some information from the veterans. Do you start by setting all your glyphs' side bearings to 0 and work out from there? Do you set all your glyphs to a certain width and bring them in or out? What's the best method?</p>
    <p>Thanks so much for any help.</p>
