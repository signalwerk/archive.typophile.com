    <p>Hello fellow type-aficionados</p>
    <p>I'm sure a lot - if not all - of you do it: Take pictures of type that you think is interesting, well-made or odd in some way. Well, I decided to put mine up on a blog, and you're all very much invited:</p>
    <p><a class="freelinking external" href="http://www.madshougaard.dk/blog" rel="nofollow">http://www.madshougaard.dk/blog</a></p>
    <p>My idea is to tag each letter, so that you'll  be able to hit (for example) 'e' in the sidebar and be presented with a lot of different ways to do e's. Geeky! I know. </p>
    <p>My hope is that this will turn out to be some sort of inspiration resource when you're designing type or logos.</p>
    <p>If you know of other sites that do the same thing I would be happy to hear from you.<br>
    Of course, I'd be happy to hear from you altogether :)</p>
    <p>Best regards<br>
    Mads</p>
