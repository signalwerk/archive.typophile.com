    votes: null
    html: |-
      <div class="comment-spam-body"><p>The sharp Calibri definitely looks better. I'm tired of seeing the rounded Calibri in very inappropriate contexts. A sharp Calibri is some progress already. At the art academy I'm at you can almost guarantee students will use DIN. If not, they usually don't care enough to change the typeface to something original at all and they go for the standard Calibri. Last week I saw it in a digital presentation where it was practically used as a display typeface. I got really frustrated seeing that. Calibri is a nice typeface, but it seems packing it with Windows inevitably leads to abuse of the typefaces. I'm actually surprised people at the academy aren't typographically versed enough to make an appropriate choice in typeface. They never really seem to care. Well, they're starting to discover Gotham now. They're late to the game but they will inevitably follow trends while they're supposed to think about their type choices.</p>
      <p>Anyway, I see the sharp Calibri has bigger counters. That's good. I sometimes use Calibri in Word when I need to type out something before putting it into InDesign and I always felt the counters are too small. Especially with the rounded edges, the /a in particular looks very small.</p>
      </div>
