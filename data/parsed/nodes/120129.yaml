    html: |-
      <p>That brings me to another font: Calibri. According to Lucas de Groot he initially proposed a version without rounded corners. MS chose the rounded version instead. Why? One of the most given critique of Calibri is that it looks "childish" because of the rounded edges.</p>
      <blockquote><p> De Groot redesigned the font, taking out the rounded corners. When submitting the proposal to Microsoft, he sent along a sample of the original version, adding: ‘I like the look of it, but as you see these rounded tops look real ugly in ClearType; don’t choose this.’ De Groot had in fact been critical of the ClearType rasterizer when he first saw it demonstrated.<br>
      To his astonishment, Microsoft chose the rounded version.</p></blockquote>
      <p>Also to my astonishment... Anyway, can we expect a Calibri without rounded corners? Maybe as an OpenType feature? Lucas de Groot already designed the font without rounded corners, so it might cost half the effort. Just sharpening the edges would not cause reflow issues. Besides, Windows 8.1 also came with another Calibri variant, Calibri Light.</p>
