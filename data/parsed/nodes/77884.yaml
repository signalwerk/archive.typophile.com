      <p>Hey, Graham, welcome to the thread. </p>
      <p>I'm curious, what was the idea behind this font? My impression, as I look at it now, is that it was kind of deconstructivist, grunge kind of thing. </p>
      <p>And the Indiana Coop Center maybe didn't really get it, thinking more like "ooh! free font!", with the intentions of the font sailing clear over their heads, especially considering that bizarre "A" which has more of a stale '80s vibe to it...</p>
  - id: 447752
    user_id: 10671
    user_name: typotheticals
    user_path: null
    user_image: /files/pictures/picture-10671.gif
    date_raw: 16 Jan 2011 — 9:06pm
    date: 2011-01-16T21:06:00
    votes: null
    html: |-
      <p>It was about 10+ years ago. I had a rather bad idea to make something resembling water pipes, and I had this rather bad font in my work folder. It was one I was training myself to actually make from scratch at that time, so stupidly I just slapped those serifs on the end. </p>
      <p>Definitely not a good idea. Plus at the time I was doing a lot of rubbishy free stuff, and some other unsavoury behaviour. As a fumbling amateur I didnt really consider ethics, or aesthetics of what I was doing.</p>
      <p>I havent improved much since.</p>
