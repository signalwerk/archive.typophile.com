      <p>It was about 10+ years ago. I had a rather bad idea to make something resembling water pipes, and I had this rather bad font in my work folder. It was one I was training myself to actually make from scratch at that time, so stupidly I just slapped those serifs on the end. </p>
      <p>Definitely not a good idea. Plus at the time I was doing a lot of rubbishy free stuff, and some other unsavoury behaviour. As a fumbling amateur I didnt really consider ethics, or aesthetics of what I was doing.</p>
      <p>I havent improved much since.</p>
