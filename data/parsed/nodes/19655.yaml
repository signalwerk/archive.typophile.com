  html: |-
    <p>This is my first attempt at designing a typeface. This is for an assignment in type class and I drew my inspiration from an R I saw on a headstone in a cemetary. The name comes from the fact that some of the letterforms are a combination of regular and small caps. I'm still working on a few of the letters...the Q, S, G, and O in particular...so any feedback is welcome. Thanks!</p>
