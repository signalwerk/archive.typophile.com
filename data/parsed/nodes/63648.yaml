      <p>There is a slight difference with my setup (Win XP). In mine, the primary key ".ai" (which is picked up by the system as the file extension -- oui, mon fier Mac amices, that's how Windows' file system works!). That contains another definition as default: "Adobe.Illustrator.13” -- and <em>that</em> is the name of another key further down the list, with all details. I think you should leave the key you just changed to "Adobe.Illustrator.13".</p>
      <p>.. Oh well, there is also the possiblity it's all changed with Win 7.</p>
