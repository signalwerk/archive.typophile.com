  - id: 320452
    user: 16911
    date: 2009-01-02T14:37:00
    date_raw: 2 Jan 2009 — 2:37pm
    votes: null
    html: |-
      <p>Yes, Nina, 1000‰ correct! Sorry Craig, you’re too late …<br>
      It is <a href="http://www.lucasfonts.com/case-studies/calibri-consolas/" rel="nofollow">Consolas</a>, ‘the de facto successor of the ubiquitous Courier’. The second glyph is a long s (ſ), as you might have guessed. I don’t know if there’s a frequent need for that character in <a href="http://www.typophile.com/node/41253" rel="nofollow">programming</a>, but ‘all six Western typefaces in the [<a href="http://www.microsoft.com/typography/ClearTypeInfo.mspx" rel="nofollow">ClearType</a>] collection were to be developed […] with the same robust glyph set for all’ — <a href="http://www.lucasfonts.com/case-studies/calibri-consolas/" rel="nofollow">LucasFonts</a>. </p>
      <p>Did you know that Consolas comes with a number of alternates for some lowercase characters? There are no less than four variations on the ‘r’ – per style, that is. Switching those alternative forms on can change the look of the typeface quite dramatically – which reminded me of Hypatia Sans, and Nick Shinn’s <a href="http://typophile.com/node/33619" rel="nofollow">thoughts about its manifold faces</a>. Alas, unlike Hypatia Sans, Consolas’ alternates aren’t organized via stylistic subsets, thus toggling them is more difficult.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/consolas_3799.png"></div><p></p>
      <p>Now it’s your turn, Nina!</p>
    html_clean: |-
