  html: |-
    <p>This is how it works:</p>
    <ul>
    <li>A complete glyph is published in the Type ID Pop Quiz.</li>
    <li>Try to identify the typeface. To win, you need to name both the typeface and the weight.</li>
    <li>Show off your knowledge by casually mentioning additional trivia, like who designed it, when and by whom was it (first) published, and other cool stuff to impress your fellow Typophiles with.</li>
    <li>The winner produces a new challenge -- a complete glyph, black on white background, presented in a 288 x 288 pixel square, including a R204G000B00 1 pixel border.</li>
    <li>The person who posts a challenge can't win the next game.</li>
    </ul>
    <p>In case of any disputes, I will act as judge, jury and avenging angel of wrath.</p>
    <p>If you think this is a little too difficult, maybe try the <a href="http://typophile.com/entry_level" rel="nofollow">Entry Level Type ID Pop Quiz</a> first. Too easy? Go to the <a href="http://typophile.com/expert_level" rel="nofollow">Expert Level Type ID Pop Quiz</a>.</p>
    <p>Good luck everyone, and have fun. ;^)</p>
    <p><em>With respectful thanks to the originator of this utterly useless but highly entertaining waste of time, the often imitated but never duplicated Cheshire Dave.</em></p>
