      <p>Hi Bart,</p>
      <p>yes, that is correct; <a href="/wiki/Palatino" class="freelinking" rel="nofollow">Palatino</a> by <a href="/wiki/Hermann%20Zapf" class="freelinking" rel="nofollow">Hermann Zapf</a>!<br>
      This sample is taken from the Palatino Linotype <a href="/wiki/OpenType" class="freelinking" rel="nofollow">OpenType</a> version that ships with Microsoft Windows. It comes with a substantial character set, including Greek and Cyrillic, small caps, ligatures and various figures &amp; fractions … and this glyph, the <a href="http://www.decodeunicode.org/u+2116" rel="nofollow">Numero sign (№)</a>.<br>
