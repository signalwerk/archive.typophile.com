    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Designers" class="freelinking" rel="nofollow">Designers</a> : Rene Verkaart</strong></p>
    <p>Rene Verkaart started <a href="/wiki/CharactersFontFoundry" class="freelinking" rel="nofollow">CharactersFontFoundry</a> in 2004 as the result of a decade of custom logo- and typedesign for clients. Since 1995 he's been running his own graphic design studio, <a href="http://www.stoerebinken.nl" rel="nofollow">Stoere Binken Design</a>, with a friend. Most of his early typefaces were custom designed for clients.</p>
    <p>Most of his typefaces originate in his holidays. "Visiting new places in the world is a big inspiration for creating new typefaces", he says. </p>
    <p>All his typefaces are extensively tested by carefully selected <em>BetaTesters</em>. This are renowned graphic designers or design studios that <em>TestDrive</em> the typefaces in practice and give critical feedback to improve the final release versions.<br>
    Currently Characters Font Foundry is working with the following <em>BetaTesters</em>: <a href="http://www.magnusland.com/" target="_blank" rel="nofollow">Magnus Holder Bjørk at Magnusland</a>, <a href="http://www.biplaza.com/" target="_blank" rel="nofollow">Vicente Arregui at Biplazadesign</a> and <a href="http://www.ontwerpbureaub2b.nl/" target="_blank" rel="nofollow">Dennis van Eikenhorst at Ontwerpbureau B2B</a>.</p>
    <p>His typefaces are featured in magazines like <em>Items (Netherlands)</em> and <em>Diseno (Spain)</em>.</p>
    <p><strong>Fonts</strong><br>
    <a href="http://www.characters.nl/index.html?font=accelerator" rel="nofollow">Accelerator</a>, <a href="http://www.characters.nl/index.html?font=balletmechanique" rel="nofollow">Ballet Mechanique</a>, <a href="http://www.characters.nl" rel="nofollow">Bionix</a>, <a href="http://www.characters.nl" rel="nofollow">BorVer</a>, <a href="http://www.characters.nl/index.html?font=cucaracha" rel="nofollow">Cucaracha</a>, <a href="http://www.characters.nl/index.html?font=encryptedwallpaper" rel="nofollow">Encrypted Wallpaper</a>, <a href="http://www.characters.nl/index.html?font=fatboy" rel="nofollow">FatBoy</a>, <a href="http://www.characters.nl" rel="nofollow">Freaky Animals</a>, <a href="http://www.characters.nl/index.html?font=insider" rel="nofollow">Insider</a>, <a href="http://www.characters.nl/index.html?font=kryptonite" rel="nofollow">Kryptonite</a>, <a href="http://www.characters.nl/index.html?font=nantua" rel="nofollow">Nantua</a>, <a href="http://www.characters.nl/index.html?font=nantuaflava" rel="nofollow">Nantua Flava XL</a>, <a href="http://www.characters.nl/index.html?font=nordica" rel="nofollow">Nordic A</a>, <a href="http://www.characters.nl/index.html?font=nordicnarrow" rel="nofollow">Nordic Narrow</a>, <a href="http://www.characters.nl/index.html?font=plan" rel="nofollow">Plan A, B, C</a>, <a href="http://www.characters.nl/index.html?font=porta" rel="nofollow">Porta</a>, <a href="http://www.characters.nl/index.html?font=reethirah" rel="nofollow">Reethi Rah</a>, <a href="http://www.characters.nl/index.html?font=sbdblock" rel="nofollow">SBD Block</a>, <a href="http://www.characters.nl/index.html?font=sbdblock" rel="nofollow">SBD Block Cutout</a>, <a href="http://www.characters.nl/index.html?font=shellshock" rel="nofollow">Shell Shock</a>, <a href="http://www.characters.nl/index.html?font=shellshock" rel="nofollow">Shell Shock Cloak</a>, <a href="http://www.characters.nl/index.html?font=siventi" rel="nofollow">Siventi Logo + Icono</a> and <a href="http://www.characters.nl/index.html?font=vagebond" rel="nofollow">Vagebond Condensed / Normal / Extended</a>.</p>
    <p><strong>Facebook fanpage</strong><br>
    <a href="http://www.facebook.com/pages/Characters-Font-Foundry/152467264800443" rel="nofollow">Like me and I like you</a></p>
    <p><strong>Twitter</strong><br>
    <a href="http://www.twitter.com/characters" rel="nofollow">Tweet tweet</a></p>
    <p><strong>FlickR</strong><br>
    Check out Fonts in Use, sketches and other interesting type things on <a href="http://www.flickr.com/photos/characters/" rel="nofollow">FlickR</a></p>
    <p><strong>Daytime job</strong><br>
    Rene Verkaart is co-founder of <a href="http://www.stoerebinken.nl" rel="nofollow">Stoere Binken Design</a>, a renowned Dutch graphic design studio based in Maastricht, The Netherlands.</p>
