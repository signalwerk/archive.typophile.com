      <p>I am not 100% clear if this is exactly what you are looking for (depending on your browser this will attempt to trigger a direct download of the PDF):</p>
      <p><a href="http://www.access-board.gov/ada-aba/comparison/comparison.pdf" title="http://www.access-board.gov/ada-aba/comparison/comparison.pdf">http://www.access-board.gov/ada-aba/comparison/comparison.pdf</a></p>
      <p> It certainly does not provide all of the additional information you need, but it does specify:</p>
      <blockquote><p>ANSI 703.2.2 Case. Characters shall be<br>
      uppercase, lowercase, or a combination of<br>
      both.</p></blockquote>
      <p>Otherwise all instances of font references appear to be specific to characteristics of uppercase letters.</p>
