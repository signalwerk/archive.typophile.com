    <p>Hi,<br>
    I was wondering if anybody knew of any IBC restrictions on certain fonts. It's pretty specific on height minimums but I cant determine whether or not you can use lowercase letters and if there is a font list or description of unacceptable characters, weights etc. ADA signage literature is pretty specific in all of these areas. Dont want to break any IBC code on a current project.<br>
    Any info/thoughts would be greatly appreciated.</p>
