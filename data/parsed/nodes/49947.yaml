    html: <p>I don’t have a photo, but type foundries sometimes put photos or engravings of their buildings in specimen books. <a href="http://www.worldcat.org/search?qt=worldcat_org_all&amp;q=specimen+book+of+bauer+types">Try getting some Bauer Specimen books sent via inter-library loan and see what turns up</a>.</p>
