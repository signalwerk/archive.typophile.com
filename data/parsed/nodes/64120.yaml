      <p>This is a pretty old shop, and I think that’s the original sign. So it’s probably the work of an English sign writer. Go back there and have a look as they sometimes wrote their names very small in the corner of the sign somewhere in the olden days.</p>
      <p>And buy some fresh pasta while you’re at it! I love that shop. (or I did when I lived in London).</p>
      <p>Nick Cooke</p>
