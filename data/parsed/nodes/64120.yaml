      <p>Thanks for the response Nick. I took that snap so have been fairly close up, but havent actually checked for a signature in the corner – will definitely look out for that. Do you have any thoughts on fonts that might come close to either of the words ’Lina’ or ’Stores’? Its actually the ’Lina’ word Im more intrigued by as the Stores word looks to at least reference Granby or Johnston.</p>
