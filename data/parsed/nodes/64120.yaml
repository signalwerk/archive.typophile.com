    <p>Hi all, Id be really grateful for input on this one. It looks to me to be similar to Granby and is certainly of that era in terms of when the lettering was applied to the sign but its baffling me abit. The ’Stores’ word looks to have slightly different proportions to the ’Lina’ word so they are maybe from different fonts. Perhaps it was just an old school signwriter/maker who didnt want to play by the rules, though hopefully someone here can enlighten me! Any help/thoughts on this much appreciated.<br>
    Thanks<br>
    Arran</p>
