    html: <p>Thanks! It's very odd, because I did a "test drive" with this font on the foundry's website, and they show it displaying more toward the middle of the x-height. But it's also weird that InDesign does the same thing (I always like to blame quark for these things...). Dashes are doing the same thing, as well. I've written tech support and will let you know what I find out (if anything).</p>
