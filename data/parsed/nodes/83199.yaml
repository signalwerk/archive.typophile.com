    date_raw: 21 Jun 2011 — 6:50pm
    votes: null
    html: "<p>This has nothing to do with Quark. This is a problem with the Hoefler Text fonts included in OS X. There are two hyphen and dash vertical positions: standard and uppercase. The positions are swapped in these fonts. The Baskerville and maybe a few other OS X fonts have the same issue. I planned to file a bug with Apple but haven't yet.</p>"
