  html: <p>Typesetting a book in Quark 7, not my usual software. Typeface is Hoefler.  I've noticed that the automatic hyphens are riding too high in the text, brushing up against the characters, especially "r". I checked against the HFJ website, and it's not a font quirk, it's something that Quark is doing.  I can't find a method to edit this so they display correctly. Anyone experience this and know how to fix?</p>
