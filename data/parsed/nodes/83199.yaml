    date_raw: 21 Jun 2011 — 7:56pm
    votes: null
    html: <p>After a quick check I found at least 4 other fonts that have the same issue with one or more dashes. This includes Courier New! I wonder how long these bugs have been around and how many OS X users have been working with the fonts oblivious to the problems. I first noticed the Hoefler Text issue at least 3 years ago.</p>
