      <p>Well, I went through ALL 1,890 ’sansserif’ font families at MyFonts, and I can say that I don’t think it’s anything they sell — so it comes from an independent foundry.</p>
      <p>The closest resemblances were <a href="http://www.myfonts.com/fonts/ef-typeshop/formula/">TS Formula</a> from TypeShop (which is probably a version of some other design — most of theirs seem to be); <a href="http://www.myfonts.com/fonts/dtptypes/fuller-sans-dt/">Fuller Sans</a> from DTP Types; <a href="http://www.fontbureau.com/fonts/BentonSans/styles">Benton Sans</a> from Font Bureau; <a href="http://www.myfonts.com/fonts/device/paralucent/">Paralucent</a> from Device; and I kept looking at Franklin Gothics of various foundries.</p>
      <p>I will keep track of this thread to see what comes out, but I have made my attempt for now. Good luck.</p>
      <p>- Mike Yanega</p>
