    html: <p>...but it's more elegant if the primes given using Cmd-Shft-' were actually "dumb quotes" and not the primes designed with the font.  <br> <br>I've never noticed this to be the case, nor do I know much about whether designed primes are standard in a font or not. <br> <br>&gt; better than mousing through the Insert Glyphs <br> <br>Maybe somebody could write a script to do this with a keystroke.  :^)</p>
