    html: <p>Hi Kent, <br>I believe this is what you a looking for... <br>ShiftOptionApple '   <br>Once you've hit this key command nothing appears to happen...what you don't see is that it has made the switch to primes/or glyphs depending on what your default is set at. Now hit ' and you'll see the change. <br> <br>Let me know if you have any problems. <br> <br>Chris  <br></p>
