  html: "<p>Okay all you InDesign experts: is there a way to override the typographic quote marks on a temporary basis from the keyboard in order to insert inch and foot marks?  <br><br>I realize that I can just insert them from the Type &gt; Insert Glyphs… palette. But how tedious and clumsy is that?! In Quark (Mac) I could just use the control modiﬁer key and type either control-’ for a foot prime or shift-control-’ for an inch double prime. <br><br>Anything like this in InDD? <br><br>— K. <br></p>"
