    <p>The University of the Arts London was until recently called the <a href="/wiki/London%20Institute" class="freelinking" rel="nofollow">London Institute</a>.</p>
    <p>It consists of five colleges:<br>
    <a href="/wiki/London%20College%20of%20Communication" class="freelinking" rel="nofollow">London College of Communication</a> (formerly the <a href="/wiki/London%20College%20of%20Printing" class="freelinking" rel="nofollow">London College of Printing</a>)<br>
    <a href="/wiki/Camberwell%20Collge%20of%20Arts" class="freelinking" rel="nofollow">Camberwell Collge of Arts</a><br>
    <a href="/wiki/Central%20Saint%20Martins%20College%20of%20Art%20and%20Design" class="freelinking" rel="nofollow">Central Saint Martins College of Art and Design</a><br>
    <a href="/wiki/Chelsea%20College%20of%20Art%20and%20Design" class="freelinking" rel="nofollow">Chelsea College of Art and Design</a><br>
    <a href="/wiki/London%20College%20of%20Fashion" class="freelinking" rel="nofollow">London College of Fashion</a></p>
