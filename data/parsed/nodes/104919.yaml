    html: <p>InDesign will be using the OpenType GPOS {kern} feature kerning, rather than what might be in the 'kern' table. Generally speaking, it is not advisable for a font to contain both kinds of kerning, but some fonts include a 'kern' table for backwards compatibility with e.g. older versions of MS Office. The GPOS kerning can include class kerning and even contextual kerning; the 'kern' table is quite limited and due to application issues it is generally recommended to include no more than c.6000 pairs in the 'kern' table. This means that when fonts do contain both kinds of kerning, the 'kern' table will usually include only a subset of the GPOS kerning. A good workflow will ensure that this subset will at least use the same values as the GPOS kerning, but I have seen fonts such as you describe, in which the two differ. This might happen if, for example, GPOS kerning developed for OpenType versions of a font involved significant new development and revision, but the 'kern' table was copied from an older version, which might be done on purpose to avoid existing document reflow in older apps.</p>
