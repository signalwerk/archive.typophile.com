      <blockquote><p>Just realized that InDesign is showing a different kerning value than what is in the "kern" table of the ttx. For instance, the kern table shows  but InDesign's kern menu shows -70.</p></blockquote>
      <p>I don’t think the kerning values actually differ. InDesign displays kerning values in ‰ of 1 em, while in a font the kerning values are relative to the units per em setting, in this case probably 2048.</p>
      <p>70/1000 = 143/2048</p>
