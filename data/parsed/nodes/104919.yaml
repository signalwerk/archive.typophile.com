      <p>Just realized that InDesign is showing a different kerning value than what is in the "kern" table of the ttx. For instance, the kern table shows <code> &lt;pair l="T" r="o" v="-143"/&gt;</code> but InDesign's kern menu shows -70.</p>
      <p>So InDesign is definitely looking at something else in the font and using it as kerning. I'm assuming Word 2010 is using that same thing as kerning.</p>
      <p>Thanks again for any help anyone can offer.</p>
