    <p>A client with a TrueType font wanted some glyphs added but were not able to contact the person who created it the font initially.</p>
    <p>Because it uses has at least MKMK, which FontLab doesn't support, I used ttx to create a text file and through a combination of FontLab and the ttx file was able to add the glyphs they wanted.</p>
    <p>They now want some kerning added, which I did in the ttx text file and recompiled. The new kerning works when the font is used in Word 2003 but NOT in Word 2010 or InDesign. There is SOME sort of kerning working in InDesign as I can see that the characters pairs listed in the font have kerning between them. Likewise for Word 2010, turning the kerning on and off with some text selected makes definite changes at some kerning pairs.</p>
    <p>The font does have a DSIG feature (for that weird Word problem).</p>
    <p>Any ideas?</p>
    <p>Many thanks,<br>
    Ken</p>
