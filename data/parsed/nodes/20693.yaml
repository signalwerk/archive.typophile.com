      <p>Very arabic, I cant understand the meaning behind the calligraphic part about it, if your audience is predomoniately english speaking it can be solved with a descriptor I suppose. I think its a very interesting mark, personally I like marks which are simpler and therefore easier to remember. And this does that justice… But I worry yours might not be unique enough to be remembered and just come off as looking arabic? I am trying not to sound like I have a I bias but I am being honest at the same time… </p>
      <p>* NOTE edited after an update was made.. I just saw that you updated the images with some text included with your mark. I think it works.</p>
