      <p>There is something very lovely about this. Refreshing. After so many people going sans and cold, this is exotic and warm. The exit stroke of the tail seems a tiny bit flat on the left side, but at smaller sizes this will most likely disappear. You might need to have an accompying logotype, but I would guard against using them right next to each other as whatever you do this logo should be allowed to stay organic. I really like it.</p>
      <p>There is something Arabic or maybe even Armenian, about it.</p>
