    <p>I hope that you can help me with this logo, i buid it for myself, this is a calligraphic logo, i started with the sketch just a few days ago. The forms are based in the initials of my name (jaime ayala) write in calligraphy. I do it in a calligraphic way cuz i want to do classical look, to a young designer. regards. Jaime Ayala. p.d.: sorry about the lazy english, any comment in spanish will be wellcome.</p>
