    html: <p>The size of the logotype is over-powering the mark. I’m not sure I would stack it either. The idea would be to use the logotype in conjunction with it, but not necessarily right next to it. Fontin works, I think. I nice compromise for a sans, as I’m not sure a serif would be necessarily appropriate (or the perfect match attainable) for your mark.</p>
