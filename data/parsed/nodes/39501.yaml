    html: |-
      <p>Hey Skippy,<br>
      I have no idea about the 2nd one …&nbsp;looks a little bit self-made: is the ‘n’ an upside down ‘u’?</p>
      <p>Btw., Beton is one hell of an inconsistent family!<br>
      Type IDer: “Tell me, does the ‘A’ have a left-pointing top serif?”<br>
      Light: “Yes.”<br>
      Regular: “No.”<br>
      Demi/Medium: “Sure.”<br>
      Bold: “Nope.”<br>
      Bold-Condensed: “Well, yes!”<br>
      Extra Bold (by URW/E+F): “No way!”<br>
      Extra Bold (by Creative Alliance): “Yes, and now shut up.”</p>
