    <p>Hello! Which version is this? The serifs are perfectly flat, so initially I thought it was Berthold Antiqua. But the "a" doesn't look like. <a class="freelinking external" href="http://criacaocriativos.blogspot.com/2010/05/25-classic-fonts.html" rel="nofollow">Source</a></p>
