    <p><strong>Type Battle: Typo-O-Lantern Pumpkin Carving</strong><br>
    Halloween 2007</p>
    <p>// <strong>Rules</strong><br>
    1- Carve, cut, etch, &amp;c., your typographic design, letterform or mark into a pumpkin or other gourd.</p>
    <p>2- Post a photograph (600 x 400 please) of your entry in this thread. Feel free to inform us about your method, inspiration, &amp;c. but the best entries will speak for themselves.</p>
    <p>3- As with other type battles, this starts on a Monday and ends this Friday (which happens to be 2 days after Halloween, no points will be reduced with November entries).</p>
    <p>// <strong>Judging &amp; Prizes</strong><br>
    As with any street battle, there is no panel of judges and no prize — only the ability to call yourself the best on the block.</p>
