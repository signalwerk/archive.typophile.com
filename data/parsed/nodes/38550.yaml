      <p><strong>Scariest Halloween Pumpkin Ever!</strong></p>
      <p>Last Halloween I created the Scariest Halloween Pumpkin Ever by re-interpreting the usage of your typical Halloween pumpkin. </p>
      <p>I created the pumpkin insert!! </p>
      <p>Got my buddies sign shop to cut some black vinyl and I put it on clear thin super flexible vivak. I then cut a display (tried to get a circus feel to it ...ahem) window opening in the pumpkin and slipped the insert in behind!!!</p>
      <p>Now, anything can be said using the Halloween pumpkin as the 'delivery system'</p>
      <p>Scariest Halloween Pumpkin Ever...</p>
      <p><img src="/sites/default/files/old-images/CS_scariest_4424.jpg"><br><img src="/sites/default/files/old-images/CS_halloween_6022.jpg"><br><img src="/sites/default/files/old-images/CS_pumpkin_4918.jpg"><br><img src="/sites/default/files/old-images/CS_ever_5060.jpg"><br><img src="/sites/default/files/old-images/CS_scarypumpkin_howto_6389.jpg"></p>
      <p>...</p>
