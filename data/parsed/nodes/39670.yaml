      <p>The thing that grabbed me immediately was how the stems of pairings like UM, ON, MN, etc blend together and make those letters difficult to read.  Not sure if is helpful but your font reminded me of some of the sandblasted lettering in the Toronto Subway system.  In that case the grid kind of manifests itself within the medium to give a (similar?) effect. Might be worth checking out for some more ideas.</p>
      <p>(There are some photos in Joe Clark's recent article on type in the Toronto Subway..<br>
      <a href="http://joeclark.org/appearances/atypi/2007/TTC/inscribed/" title="http://joeclark.org/appearances/atypi/2007/TTC/inscribed/">http://joeclark.org/appearances/atypi/2007/TTC/inscribed/</a>)</p>
