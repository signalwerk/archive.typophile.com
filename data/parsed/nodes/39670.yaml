      <p>Okay, I've doubled the inter-character spacing, so it should be more readable. I'm not sure if it's enough, but as the creator of the font, I'm probably not the best judge of that. I've attached the results as datum-v0.2.pdf.</p>
      <p><em>Maybe you could try justing using the rectangle shape to build the letters, instead of having all the little bits.</em></p>
      <p>I'm not quite sure what you mean by "the little bits"--the little rectangles that all the characters are made out of, or the smaller rectangles on characters like C and G? Could you please clarify?</p>
      <p>Finally, does anyone have any ideas about how I could improve my Q? I think it could use some improvement, but I don't know just what to change.</p>
