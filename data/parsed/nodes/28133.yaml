      <p>I found a couple more options:</p>
      <p>Eureka:<br>
      <a href="http://www.fontshop.com/?fuseaction=catalog.fontdetail&amp;searchby=manufacturer&amp;displayfontid=FF.11046.1.6" rel="nofollow">Serif</a>, <a href="http://www.fontshop.com/?fuseaction=catalog.fontdetail&amp;searchby=manufacturer&amp;displayfontid=FF.11162.1.10" rel="nofollow">Sans</a>, and <a href="http://www.fontshop.com/?fuseaction=catalog.fontpackage&amp;searchby=manufacturer&amp;displayfontid=FF.11249.0.0" rel="nofollow">Monospace</a></p>
      <p>Fedra:<br>
      <a href="http://www.typotheque.com/fedra_serif_a/" rel="nofollow">Serif</a>, <a href="http://www.typotheque.com/fedra_sans/" rel="nofollow">Sans</a>, and <a href="http://www.typotheque.com/fedra_mono/" rel="nofollow">Monospace</a></p>
      <p>All the settings I can see online of Eureka mono have the letterspacing cranked up which makes me think the wide setting is built into the font. This make me a little suspicious that it won't look so hot at a more normal letterspacing. Fedra looks more mature, as it should I suppose since it could reasonably be called Eureka 2.0.</p>
      <p>What I haven't been able to find at all is a well executed monospace font derived from a serifed design. Every well done monospace typeface is at heart a sans.</p>
