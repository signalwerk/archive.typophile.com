    <p>As a project, I'm putting together a sort of code scrapbook, a small bound book with interesting excerpts of code from my work and small bits of prose about the code. I've been looking for font families that could supply both a serif typeface for paragraphs of text, a sans for captions next to the code, and a monospace font for the code itself. As you might expect, the set of font families with a well built monospace cut are very few. In fact I've managed to track down just two:</p>
    <p>Quadraat:<br>
    <a href="http://www.fontshop.com/?fuseaction=catalog.fontdetail&amp;searchby=manufacturer&amp;displayfontid=FF.6180.1.5" rel="nofollow">Serif</a>, <a href="http://www.fontshop.com/?fuseaction=catalog.fontpackage&amp;displayfontid=FF.10989.0.0" rel="nofollow">Sans</a>, and <a href="http://www.fontshop.com/?fuseaction=catalog.fontdetail&amp;displayfontid=FF.11188.1.5" rel="nofollow">Monospace</a></p>
    <p>Thesis:<br>
    <a href="http://www.lucasfonts.com/cgi-bin/loadframe/lucasfnt/theserif/serif-.html" rel="nofollow">Serif</a>, <a href="http://www.lucasfonts.com/cgi-bin/loadframe/lucasfnt/thesans/sans-.html" rel="nofollow">Sans</a>, and <a href="http://www.lucasfonts.com/cgi-bin/loadframe/lucasfnt/thesansmo/sansmo-.html" rel="nofollow">Monospace</a></p>
    <p>Quadraat might be a bit too mannered for this project. Thesis might be a bit too femine. Ideally there would be a monospaced version of Freight Micro since the rest of the family feels just right. I'll probably end up using Quadraat since the monospace works better in my eyes than TheSans Mono, but I'm still interested to know if there are more families out there with a monospace cut. Anyone know?</p>
