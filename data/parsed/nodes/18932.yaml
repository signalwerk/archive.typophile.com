      <p>&gt;When we get stuck in spelling we imagine writing the word.</p>
      <p>It is striking to a non-Chinese that when Chinese meet and give their names, and want to know the character—it gives a meaning, and there may be many for each sound—they draw it in the air with one finger against the palm of other hand. Then the person observing will instantly recognize the character, though it is invisible.  </p>
      <p>I just tried it with roman characters and it works for me also.</p>
