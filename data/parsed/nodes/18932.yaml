      <p>“Learning to read must involve a pre-emption of part of the existing visual system and it’s conversion, by minimal modification, to process the shapes of letters and words.” [Stanislas Dehaene, Laurent Cohen, Mariano Sigman and Fabian Vinckier: “The neural code for written words: a proposal” (Trends in Cognitive Sciences, Vol 9 No 7, July 2005)</p>
      <p>So the Changizi hypothesis is not far fetched.</p>
      <p>Dehaene, et. al., add: “Indeed, in most expert readers, a localized region of the left occipito-temporal sulcus, just lateral to the fusiform gyrus, systematically takes on the function of identifying visual letter strings. The ’visual word form system’ is thought to play a pivotal role in informing other temporal, parietal and frontal areas of the identity of the letter string, for the purpose of both semantic access and phonological retrieval. Thus it must provide a compact ’neural code’ for visual words, a cell assembly unique to each word, yet invariant under changes in location, size, case* and font.”</p>
      <p>In “Neuroimaging Studies of Reading Development and Reading Disability” Kenneth R. Pugh, et. al. (W. Einar Mencl, Annette R. Jenner, Jun Ren Lee, Leonard Katz, Stephen J. Frost, SSally E. Shaywita, Bennett A. Shaywitz), posit “a word-recognition system in which processing is fast because linguistic knowledge is encapsulated in highly efficient pattern-recognizing templates.” (Learning Disabilities Research &amp; Practice, 16(4), 240-249.</p>
      <p>I’ve tried to argue for neural encoding of whole words at the ’pattern of features’ level. It seems to me that, in addition to direct encapsulation of ’linguistic knowledge’ in these ’templates’ or ’neural codes’, there are—yoked to these complexes—’chirographic scripts’, which form the basis of our knowledge of orthgraphic shape.</p>
      <p>In other words: while letter topologies do not perhaps correlate well with the number of hand movements needed to create the topology, our sensory-motor familiarity with the concrete movements we make in writing senquences of letters underlies our abstract knowledge of orthgraphic codes (and how they are most effectively learned). When we get stuck in spelling we imagine writing the word.</p>
      <p>* debatable</p><div class="imageWrap"><img src="/web/20080905060530im_/http://www.typophile.com/files/][img:"></div><p></p>
