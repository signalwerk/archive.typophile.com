      <p>&gt; our sensory-motor familiarity with the concrete<br>
      &gt; movements we make in writing senquences of letters ...</p>
      <p>Just one problem with that theory: we don’t write any more.</p>
      <p>&gt; When we get stuck in spelling we imagine writing the word.</p>
      <p>You don’t know that to be generally true. I can assure you that I for one don’t do that. I visualize the letterforms. Or type them out! This, even though I did write a lot as a child. And one can only hope that the kids of the future will avoid such pointless intermediate steps entirely:<br>
      <a href="https://web.archive.org/web/20080905060530/http://news.bbc.co.uk/2/hi/uk_news/education/3103421.stm" title="http://news.bbc.co.uk/2/hi/uk_news/education/3103421.stm">http://news.bbc.co.uk/2/hi/uk_news/education/3103421.stm</a></p>
      <p>hhp</p>
