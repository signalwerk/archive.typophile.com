      <p>The paper is available on Prof. Changizi’s website.<br>
      <a href="https://web.archive.org/web/20080905060530/http://www.changizi.com/" title="http://www.changizi.com/">http://www.changizi.com/</a></p>
      <p>They take an interesting tact and analyze letters as orientation invarient topologies. This means that there is no difference between L, v, and 7. They find that the letters in different orthographies tend to use the pattern of topologies. They go on to find that these same topologies correlate well with those seen in natural scenes, but do not correlate well with the number of hand movements needed to create the topology.</p>
      <p>For this to be useful for type design, the work will need to be extended past topology to looking at geometric differences within each of their topologies. They do note this in the paper as a possible future direction.</p>
      <p>Cheers, Kevin</p>
