      <p>___<br>
    Encore goes Designmai Youngsters<br>
    <strong>’Handmade Typography’ Contest</strong></p>
    <p>___<br>
    Encore Magazine is searching for the finest typographic and completely handmade realization of the word “Encore”.</p>
    <p>Different techniques are possible, e.g. painting, drawing, spraying, or tinkering. However, the use of modern technical equipment such as computers is not allowed.</p>
    <p>The goal of the contest is to receive as many variations of the word “Encore” as possible.</p>
    <p>The best works will be presented at an exhibition at the Designmai Festival in Berlin/Germany.<br>
    For more informations and an example image provided by Eikes Grafischer Hort, check out <a href="http://contest.encore-mag.com" title="http://contest.encore-mag.com">http://contest.encore-mag.com</a></p>
    <p>___<br>
    Contact:<br>
    <a href="mailto:contest@encore-mag.com">contest@encore-mag.com</a><br>
    <a href="http://www.encore-mag.com" title="http://www.encore-mag.com">http://www.encore-mag.com</a></p>
