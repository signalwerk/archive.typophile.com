  html: |-
    <p>Hello all,</p>
    <p>Would someone be able to identify this title font for me (i.e., the font in which "GAME OF CAGES" has been written? It is used on the cover for the first couple of novels in the Twenty Palaces series by Harry Connolly. </p>
    <p>Neither WhatTheFont nor Identifont yielded any results, so I am hoping that someone here has seen this font before or can help me identify it. </p>
    <p>Thanks either way!</p>
    <p>- Robert</p>
    <p><img src="http://farm5.static.flickr.com/4032/4257904825_e06893bce7_m.jpg"> Cover - Game of Cages </p>
