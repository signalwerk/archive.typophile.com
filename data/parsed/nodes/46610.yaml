      <p>The rolling hills background doesn’t look like hills to me even in an abstract sense. I do like the colors but would try to make the hills part of the logo not a background. </p>
      <p>The name seems a bit hokey to me too - especially for the market. Sounds a bit “AS SEEN ON T.V.”</p>
      <p>Is the name fixed or possibly changeable. Right now nothing in this logo (name or design) suggests Irish owned or ingredients. Do steer clear of cliched stereotypes and iconography though. I’m Irish BTW :)</p>
      <p>Have a look at some nice branding by <a class="freelinking-external" href="https://web.archive.org/web/20081013110837/http://www.pinkincdesign.co.uk/portfolio_obriens.html">Pink Inc</a> who do most of the <a class="freelinking-external" href="https://web.archive.org/web/20081013110837/http://www.obriensonline.com/">O’Briens Sandwich Bars</a> work.</p>
