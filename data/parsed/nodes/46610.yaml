    <p>hey can you give me some advice on a logo I’m working on please. The logo will be on a the label of a pre made gourmet sandwich. The sandwich brand uses hand made stone-oven baked bread is fully Irish owned and uses all Irish products. I started using the hills in the back to represent this and the wheat to represent the traditional method in which their bread is cooked (apparently this is unusual) I’m having trouble with the font and as being done on a low budget I need to use a free font. I just feel that its missing a traditional, quality for money, good food feel all suggestions welcome!!</p>
    <p>Thanks</p><div class="imageWrap"><img src="/web/20081013110837im_/http://www.typophile.com/files/logo_4959.jpg"></div><p></p>
