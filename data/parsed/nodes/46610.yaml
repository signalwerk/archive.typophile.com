      <p>This name screams for an exclamation mark at the end, and definitely doesn’t say gourmet to me. It sounds like something Don Cherry would endorse. I’d suggest using the last name of the owner to give it a traditional, family-owned feel.</p>
      <p>I like what you’ve come up with, but it doesn’t say “traditionally-made with local ingredients” to me. Even your image of the wheat is a bit sterile-looking.</p>
      <p>Since you don’t have the budget for a font, why not hand-letter the logo?</p>
      <p> - Lex</p>
