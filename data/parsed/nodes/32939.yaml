    <p>I just got hold of the graphic guidelines for a Finnish company, and it states there that only Meta+ should be used. What could that be, is it an old name? Looks very much like ordinary Meta to me. Are Meta and Meta Pro the same design wise? Is Meta+ normal the same as Meta Pro Book? I’m trying to get the cheapest and most effective way out of here...</p>
