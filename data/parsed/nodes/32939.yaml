      <p>Hi mili.</p>
      <p><a href="http://www.fontshop.com/fontfeed/archives/meta-morphosis-how-ff-metaplus-became-ff-meta/">FF MetaPlus was renamed FF Meta</a> several years ago.</p>
      <p>FF Meta comes in three flavors: <a href="http://www.fontshop.com/search/?q=FF+Meta+-Pro+-OT">FF Meta</a>, <a href="http://www.fontshop.com/search/?q=FF%20Meta%20OT">FF Meta OT</a>, and <a href="http://www.fontshop.com/search/?q=FF%20Meta%20Pro">FF Meta Pro</a>. The OpenType version is cross-platform compatible and includes OT niceties like small caps and figures styles built in to one font. The Pro version adds more language support. All use the same lettershapes, the OT and Pro just add extras.</p>
      <p><a href="http://www.fontshop.com/search/?q=FF%20Meta%20Normal">FF Meta Normal</a> and <a href="http://www.fontshop.com/search/?q=FF%20Meta%20Book">FF Meta Book</a> are two different weights (Book is heavier) available in any of the three flavors.</p>
