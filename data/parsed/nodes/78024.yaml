    date: 2011-01-15T12:23:00
    votes: null
    html: <p>Indeed, there is only one character that uses commaaccent.salt, yet it's still useful to make it into a component, and make uni0123 a composite glyph primarily so that the "g" glyph is a component, which makes things like hinting easier.</p>
