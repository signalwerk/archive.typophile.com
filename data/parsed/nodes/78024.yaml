      <p>Kristians, </p>
      <p>There are, of course, many ways to achieve a certain goal. Having an extra glyph is the simplest solution, and works well with various automatic glyph-creation mechanisms. Also, it works with all tools. Rotated components may work with some font-creation tools, but may not work with others. </p>
      <p>Best,<br>
      Adam</p>
