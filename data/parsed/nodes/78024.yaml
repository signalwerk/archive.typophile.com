    html: <p>The commaaccent.salt slot is indeed intended for the 180-degree rotated commaaccent which is to be placed above g. The caron.salt is intended for the "upright-acute"/"apostrophe-shaped" variant of caron, intended for use with d, t, l and L.</p>
