    <p>Probably this is an easy one.</p>
    <p>For the very first time I am trying to add Central European diacritics for a font I am designing. I am using the new encodings that appear in FontLab Studio if you have installed Fontographer 5 (either the full version or the demo). I am using the encoding called “OpenType LatPro”.</p>
    <p>I did some readings online and watched some fonts who include the glyphs proposed by this encoding and so far I think I am doing right, but I am unable to find what is commaccent.salt for. </p>
    <p>I have read at <a class="freelinking external" href="http://diacritics.typo.cz/index.php?id=9" rel="nofollow">typo.cz</a> that “In Latvian, the use of cedilla is wrong, the correct shape of the accent is a small comma under letter. Both for technical and aesthetic reasons, the comma accent is drawn above the lower case ģ, rotated by 180 degrees”, and I am aware about Adam Twardoch’s recommendations quoted on that same page regarding Scedilla, scedilla, S with commaaccent, s with commaaccent, T with cedilla, t with cedilla, T with commaaccent, and t with commaaccent. Everything clear, but I still don’t know what to put inside the commaccent.salt slot. Any help appreciated.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/commaccentsalt_6577.png"></div><p></p>
