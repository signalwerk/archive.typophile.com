      <p>Knowing she's female is helpful, but we need to know what her <em>photos</em> are like.</p>
      <p>I will say one thing though, assuming she's of Turkish origin: the diamond in #1 makes for a nice allusion to how Turkish used to be written (in the Arabic script). Which might be moot though.</p>
