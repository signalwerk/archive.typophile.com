    <p>Hi everyone,<br>
    I am working on a wordmark for a female fashion photographer.<br>
    Between the several options I am exploring, I came across the possibility to play around with some custom ligatures.<br>
    Here attached you find some examples I came up with.<br>
    I know they are not *there* yet - but I would like to hear some feedback on how to improve them and which direction to go.</p>
    <p>Thanks,</p>
