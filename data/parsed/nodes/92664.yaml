    html: |-
      <p><cite>the OpenType code should be accessible in Window &gt; Panels &gt; OpenType. When I open that up, there is no code or classes listed – it is completely blank. Is this the problem?</cite></p>
      <p>Yes</p>
      <p><cite> Do the small capitals and old style numerals need to be defined here in order to generate the OpenType PS file?</cite></p>
      <p>Yes. Well, not necessarily "defined." You need (1) a set of classes and (2) a set of instructions as to what to do with the classes. You can put both in the features file, or you can use the classes file to "define" them. I prefer to have everything in the features file. In fact, I prefer to have that file written off so as to be able to use a text editor on it.</p>
      <p>You might have to read the manual...</p>
