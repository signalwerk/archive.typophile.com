      <p>Charles: ‘<em>[…] there is a faster way […]’</em></p>
      <p>Another option would be to collect all your OT layout features in <strong>one</strong> ﬁle, to <a href="http://www.fontmaster.nl/english/downloads.html" rel="nofollow">download OTM Light 2.0</a> (which supports the AFDKO 2.5), and subsequently to use the <em>File</em> –&gt; <em>Import</em> function to compile the features. In <em>File</em> –&gt; <em>Messages</em> a detailed report of the compiling process will be listed. Compiling will abort in case of an error, of course, and there will be an indication presented of what went wrong.</p>
      <p>Please note that the <strong>export</strong> of OT layout features in <em>OTM Light 2.0</em> is not as perfect as in the latest OTM 2.4 <em>full</em> version.</p>
      <p>FEB</p>
