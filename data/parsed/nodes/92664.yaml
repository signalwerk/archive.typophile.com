    html: |-
      <p><cite>test compile them one at a time until you find the broken one</cite></p>
      <p>Assuming it is only one gefuched feature -- always risky -- there is a faster way than one at a time. Dump half of them. If that complies, try the other half. Keep splitting in halves. You'll find the bad one a lot quicker this way.</p>
