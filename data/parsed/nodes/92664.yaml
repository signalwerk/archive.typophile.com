    <p>I'm trying to generate a font so I can layout a decent proofing sheet. Two problems:</p>
    <p>I am able to generate a Win TrueType/OpenType TT file, but when I try OpenType PS, it gives me this message: "ERROR: There was a problem while compiling OpenType font. Final .otf font is not saved. Please, check OpenType features definition for errors." Does anyone know what this is referring to? I looked through the fonts features panel, but didn't see any red flags. Feel like I'm missing something on how to preflight these files before generating.</p>
    <p>Also, when I use the Win TrueType/OpenType TT file in InDesign, the small capitals and old style numerals are not accessible through InDesign's OpenType menu, however, I can access them in the Glyphs window. What steps need to be taken to create files that work seamlessly with InDesign</p>
    <p>Any help or direction would be greatly appreciated. Thank you.</p>
