    html: |-
      <blockquote><p>My guess is then that the designer of Sweet Sans had permission to make a derivative of Sackers Gothic</p></blockquote>
      <p>Why is that? Do you know the origin of Sackers Gothic? I can't seem to find any info on it. In any case, even if Monotype's font was the first engraver-style sans to be digitized doesn't mean it has any special permission from an original designer. In fact, it would be very difficult to find an official source for any typeface in this genre. It was a common, standard style used by many engravers. Something like a sign painter's style or architectural lettering.</p>
      <p>Like Marc said, I think the <a href="http://mvbfonts.com/sweet_sans/design_info" rel="nofollow">Sweet Sans design description</a> is pretty clear about sources (though I'm biased because I wrote it), but the font maker, Mark van Bronkhorst, should get you any more information if you require it.</p>
