    html: <p>I don't have very clear information on this; but, to the best of my knowledge, Gary? Sackers was a stationer who approached a photolettering studio in the fifties or sixties to create a phototype version of the popular 'block' style from engraver masterplates. Allan Haley might know about the transition from Compugraphic to Agfa to Monotype, but my understanding is that a digital version was drawn from the phototype. The Sweets comprise a collection of many different engraving styles as interpreted directly from the plates, including Sweet Sans. So they look quite similar because to some extent they share original sources.</p>
