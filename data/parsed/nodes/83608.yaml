    <p>Can anyone tell me the original typeface that is now called Sackers Gothic. Also is Sweet Sans a derivative of Sackers Gothic? They look very similar. </p>
    <p><a href="http://new.myfonts.com/fonts/agfa/sackers-gothic/" title="http://new.myfonts.com/fonts/agfa/sackers-gothic/">http://new.myfonts.com/fonts/agfa/sackers-gothic/</a></p>
    <p><a href="http://new.myfonts.com/fonts/sweet/sans/" title="http://new.myfonts.com/fonts/sweet/sans/">http://new.myfonts.com/fonts/sweet/sans/</a></p>
    <p>I believe Sackers was made in '94 &amp; Sweet Sans after that, but I'm not sure. These look like early 20th century Engraver's fonts, but I'd like to know the type design origin, or what at least inspired it.</p>
    <p>BL</p>
