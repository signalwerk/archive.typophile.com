    html: |-
      <p>Yeah, this is the puzzle - </p>
      <p>The boards are part of 'kiosks' (9 of them) for historic interpretation - the panels will be the kiosk 'backing', with key text and images on them. They will have tables/surfaces in front of them with more in depth information and interpretation (books, touchy-feely things, interactive tablet screens etc). So you are meant to go in close. Yet the panel is huge.</p>
      <p>During busy periods there is NO way you are going to be able to stand back to view them in the hallway/concourse where they are going to situated. You're going to be shuffling around and near them  like in a busy museum. </p>
      <p>Also let me correct - the panels will be 5.5ft high, 4ft wide (Overall is 8ft - 2.5ft is taken by the table height below them)</p>
