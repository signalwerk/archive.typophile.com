  html: |-
    <p>Hello,</p>
    <p>I'm about to start a project designing several large information/interpretation panels, and i've never done this sort of large scale design before.</p>
    <p>Each panel will be around  4ft wide x 8ft tall<br>
    with around 200 words of text and a couple of images.</p>
    <p>I have to use the client's proprietary typeface (which is similar to Optima)</p>
    <p>Any tips?  Anything I should avoid as far as letter or line spacing? (beyond normal things like orphans, widows etc.)</p>
    <p>Thanks</p>
