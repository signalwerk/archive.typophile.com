  html: |-
    <p>Rockport Publishers would like to publish your best typographic work ranging from classic to expressive applications—in all media—in their upcoming book, <em>Design Elements: Choosing and Using Type</em>. Select projects will be presented in this full-color, 160-page publication.</p>
    <p>To download the official call for entries, please go to:<br>
    <a href="http://www.kristincullen.com/rockport.entries.pdf" title="http://www.kristincullen.com/rockport.entries.pdf">http://www.kristincullen.com/rockport.entries.pdf</a></p>
    <p><strong>The deadline for submissions is February 25, 2011.</strong></p>
    <p>Questions? Email author Kristin Cullen:<br>
    <a href="mailto:contact@kristincullen.com">contact@kristincullen.com</a></p>
    <p><em>About the Author</em> | Kristin Cullen is a graphic designer, author, and educator. She received a Master of Fine Arts in Graphic Design from the Rhode Island School of Design. Her work has appeared in national and international exhibitions, as well as publications, which include <em>Graphis Poster Annual</em>, <em>Graphic Design USA</em>, <em>American Corporate Identity</em>, and <em>Print</em>. She also wrote and designed, <em>Layout Workbook: A Real-World Guide to Building Pages in Graphic Design</em> (Rockport Publishers).</p>
