    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Melia_6019.gif"></div><p></p>
    <p>Here's another project, currently titled Melia. It's a friendly agate design, maybe less successful at its intended size than as a magazine headline font. It's also surprisingly readable on screen even without hinting.</p>
    <p>I think some of the proportions are slightly off but need some fresh eyes to tell me which bits. And I should expect my spacing is way too tight as usual :P</p>
    <p>Thanks in advance guys :)</p>
