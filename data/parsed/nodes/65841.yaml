  - id: 414456
    user: 20652
    date: 2010-06-04T13:57:00
    date_raw: 4 Jun 2010 — 1:57pm
    votes: null
    html: |-
      <p>Hi Craig, I'm happy you're liking this so much!</p>
      <p>Yes, I guess you're right, the corners should be proper corners (or even have thorns) if it was for seriously small sizes. I'm seeing 7pt as a target for the regular — having tested that in various sizes, it works well that size — surprisingly as it doesn't have traps. I wanted it to be suitable for larger sizes though too, and the rounding has a good effect there. I suppose I could try a 'plain' non-rounded version too. Re the rounding on the bold, you could be right, I'll have to set some inline bold with the regular at different sizes to see.</p>
      <p>Alternate g, yes, I think I agree. I already pulled the tail back some, but could do with a bit more.</p>
      <p>Q is also one of my favourite letters!</p>
      <p>t: not sure, what makes you think that?</p>
      <p>Comma and period...er...I'm not sure why they ended up like that and I had noticed it without really thinking about it. I've now pulled the comma up.</p>
      <p>i and j: maybe I'll raise the tittles...I think there was some resistance to lowering the stems below the x-line.</p>
      <p>Round w and y could be a good idea, especially y I think. And why not in the regular and bold too!</p>
      <p>Thanks for catching the u...I'm not sure if maybe the b and g need a bit of narrowing. The spurless construction makes the counters taller so may need a bit of narrowing. I'll have to check the u with other letters. Maybe a couple of units only.</p>
      <p>Very good observations, thank you. :)</p>
