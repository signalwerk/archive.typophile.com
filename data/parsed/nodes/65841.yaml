    votes: null
    html: |-
      <p>This is really really great work.</p>
      <p>On the corner rounding:<br>
      - I would guess that if the Regular's really intended for small sizes, its corners shouldn't be rounded at all (better in fact that they would pinch outwards, I'd guess).<br>
      - I wonder if the rounding on the Bold font should be diminished, to distinguish it more from the Rounded Bold.</p>
      <p>Other thoughts:<br>
      - Does the tail of the Regular alternate /g/ come around too far? Or maybe it has to, to keep the raised-off-the-baseline bowl from looking like it's floating...<br>
      - Love the /Q/s!<br>
      - Should there be a hair--just a hair--more weight to the part of the /t/ above the crossbar?<br>
      - What it the thinking behind not having the period and comma align at the top in the bold weights?<br>
      - It might be nice to get a little more breathing room between stroke and tittle in the bold /i/s and /j/s. Would one want to lower the stroke below the mean line (analogous to lifting /g.alt/'s bowl off the baseline)?<br>
      - Those /K/k/ gaps work quite well in the Regular; little less sure in the bolds<br>
      - Would you consider adding round-structured /w/ and /y/ alternates in the Rounded Bold?<br>
      - Is /u/ a touch narrow? It looks it surrounded by those big bowls in "Abugeda."<br>
      - I love that diagonal alignment of the hood- and crossbar terminals in /f/.</p>
