    user: 20652
    date: 2010-06-04T15:36:00
    date_raw: 4 Jun 2010 — 3:36pm
    votes: null
    html: |-
      <p>That's right. The regular certainly needs some negative tracking for title sizes. I made the spacing quite loose so it would work first as a text font.</p>
      <p>t, yes, I thought you meant the bottom of the taper needed widening, but can see the top in fact could be a unit or two wider.</p>
      <p>It seems to me that the trick with counters is to see the overall area, rather than the exact height or width. And the area can be quite dramatically altered even without moving the nodes (just the bcps). Like on the bold cap B, I had to make the counters bigger without making them wider or taller, which would have affected the width of the strokes or overall width of the letter. Interesting.</p>
      <p>Here are the numerals and the round alternates.</p><div class="imageWrap"><img src="http://typophile.com/files/Gecko numerals_4580.png"></div><p></p>
    html_clean: |-
      <p>That's right. The regular certainly needs some negative tracking for title sizes. I made the spacing quite loose so it would work first as a text font.</p>
      <p>t, yes, I thought you meant the bottom of the taper needed widening, but can see the top in fact could be a unit or two wider.</p>
      <p>It seems to me that the trick with counters is to see the overall area, rather than the exact height or width. And the area can be quite dramatically altered even without moving the nodes (just the bcps). Like on the bold cap B, I had to make the counters bigger without making them wider or taller, which would have affected the width of the strokes or overall width of the letter. Interesting.</p>
      <p>Here are the numerals and the round alternates.</p><div class="imageWrap"><img src="http://typophile.com/files/Gecko numerals_4580.png"></div><p></p>
