      <p>Wow, that is a really nice design here, Ben. </p>
      <p>Gread legibility in that small sizes and solid Hinting, too. I currenty work on a very similar design. But yours is much more polished and has the nicer rhythm. :) Maybe you have the time to drop by and leave some thoughts/critique. <a class="freelinking external" href="http://typophile.com/node/67799" rel="nofollow">http://typophile.com/node/67799</a></p>
      <p>Some thoughts on your design: </p>
      <p>- "y" seems to be above baseline. Maybe lowering the connection between the stems would help here.</p>
      <p>- "z" seems a little bit wide for you rather tidy design.</p>
      <p>- Crossed lines in "x" and "X" appear broken. Shifting the thiner line by some units could counter that effect.</p>
      <p>- The tail of "Q" seems a little too bold to me, but maybe thats just me.</p>
      <p>- Maybe shape of "W" is a little too distinctive in that overall design.</p>
