    html: |-
      <p>As for _AX_ I doubt this is from a font as such. BTW the _X_ looks upside down. Whether this is the result of intent or just poor drafting, I don't know.<br>
      If you want to use a font to make the letters consider a combination of<br>
      ITC Serif Gothic Roman<br><img src="/sites/default/files/old-images/ITCSerifGothicRomanAsAX_6216.gif] and ITC Serif Gothic Bold [img:sites/default/files/old-images/ITCSerifGothicBoldAsAX_5462.gif"><br><a href="http://www.myfonts.com/fonts/itc/serif-gothic/">http://www.myfonts.com/fonts/itc/serif-gothic/</a><br>
      compress the width and cut a stencil effect on _A_.<br>
      Don</p>
