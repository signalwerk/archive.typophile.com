    html: |-
      <p>_Alpha Chi_ is a very simplified Old English for _A_ and _C_<br>
      The _C_ is very similar to this old set of iron on letters<br><img src="/sites/default/files/old-images/IronOnOldEnglishTypophile78988b_4689.jpg"><br>
      Nothing digital that even approximates the look.<br>
      One could try to simplify something like Engravers Old English  <a href="http://www.myfonts.com/fonts/mti/engravers-old-english-mt/">http://www.myfonts.com/fonts/mti/engravers-old-english-mt/</a><br>
      For the lowercase one could modify something like Morris Gothic <a href="http://www.myfonts.com/fonts/hihretrofonts/morris/">http://www.myfonts.com/fonts/hihretrofonts/morris/</a> or P22 Morris Troy <a href="http://www.myfonts.com/fonts/p22/morris/">http://www.myfonts.com/fonts/p22/morris/</a><br>
      A far from satisfactory answer, but this is as good as it gets...<br>
      Don</p>
