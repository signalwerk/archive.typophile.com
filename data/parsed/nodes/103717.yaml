    html: |-
      <p>You can find it as:<br>
      <strong>Eremitage</strong> by Brendel Informatik (1994)<br>
      <strong>Zapotec</strong> by NovelFonts (1994)<br>
      <strong>Watford DB</strong> or <strong>Watford</strong> by SoftMaker (1995)</p>
      <p>but you should be extra careful on obtaining a license to use it in a project, as all of the above companies are well known for their font clones/forgeries.<br>
      I suspect that all above are clones of the original, if somebody knows more about it please enlighten us.</p>
      <p>------------------<br>
      I found them using "Find my Font": <a href="http://www.findmyfont.com" title="http://www.findmyfont.com">http://www.findmyfont.com</a></p>
