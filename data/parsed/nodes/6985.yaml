    html: <p>that little lot is from the fence around the local catherdral, here in Newcastle upon Tyne. I have no idea how long the fence has been there, but when I took a shortcut a few weeks ago I cam across it and felt I had to go back and get some pictures. <br> <br>The best story about the catherdral from me, is that during the English / Scottish border wars, the Scottish had the city surrounded and started to bombard the city. So the English sent a message out to the Scottish army, that the Scottish prisoners had been put in the tower of the catherdral, so the catherdral survived the seige. <br> <br>Jim</p>
