    html: <p>I found the A Lincoln Font on dafont and it appears to be slightly different from the sample that DPape provided. I then searched for Abe Lincoln and found this font called LD Abe Lincoln <a href="/wiki/https%3A/%252Fwww.myfonts.com/fonts/lettering-delights/ld-abe-lincoln/" class="freelinking" rel="nofollow">https://www.myfonts.com/fonts/lettering-delights/ld-abe-lincoln/</a>. Thanks to the both of you.</p>
