    <p>Hi there!</p>
    <p>This is my first time posting, although I have known about this site for quite a while. I don't know why I hadn't signed up before, but I felt recently like this project warrents it.</p>
    <p>I am a senior at the University of Utah in Salt Lake City. I am working on a semester long project which requires us to build two clocks. The clocks have to be based on a similar idea, but they but be different from each other visually. </p>
    <p>My clock series is going to be called Lunar Solar, or Lunar / Solar. The clocks must keep accurate time, but it doesn't have to be easy to read them. The clocks are going to be backlit, and will have rotating elements that are mostly black printed on a transparent piece of plastic, which will at times hide the numerals or the hands of the clock, making it hard to read. The idea is basically "such is the nature of the moon and sun" I suppose, being that it's not always easy to observe either one, but sometimes (full moon or lunar eclipse) it can be beautiful. </p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/lunar-solar-finals_4912.jpg"></div><p></p>
    <p>these are the three logotypes, which are very rough, that I am considering. The top two felt like they needed the "/". I'm not sure that I like it on the top and the bottom, as it doesn't make sense. I like throwing off the balance of the AR AR with a single /, which I should have shown in hindsight, but that felt somewhat awkward at the same time. Perhaps it will just take more fine-tuning to be resolved. </p>
    <p>The upper two are both Gotham, the bottom one is Didot small caps. </p>
    <p>I removed the cross bars on the As because I liked the idea of the O being the only letter with a counter. However, when I made the R of the gotham a continuous stroke as I did on the Didot R, it made me want to lose my dinner. The Didot also doesn't feel like it NEEDS the /, but I may add one anyways.</p>
    <p>I also like the inverted A (or V) in place of the U, it speaks to roman numerals which relates back to the clock. I might be trying too hard with that though, what do you think?</p>
    <p>I haven't spent enough time to feel comfortable with the letterspacing either, but I thought I would throw these up for some initial feedback, if you are willing.</p>
    <p>Thank you all ahead of time!</p>
