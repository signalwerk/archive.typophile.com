      <p>the third looks most like a roman, ancient chiseled representation, thus the 'u' and 'a' shapes make sense to be rendered like they are with v's. i would keep the kerning like it is but manipulate the r to have the interior point connect. it would keep it tight and obvious, since you are asking your viewer to consider the abstract nature of the u and a, they might overthink the r. that last bit of advice may be overkill but worth a look at least.</p>
