    html: <p>I'm immediately drawn to the second one -- I don't have a solid reason why, it's just aesthetically pleasing. The one element that feels out of place is the R at the end of both words. It feels a bit heavy, like it's wanting to be more old New York industrial, with that heavy bowl sitting on top, and the rest of the words feel like they're Laser engraved into the space shuttle, which I think is the correct feel for this based on what you said about the sun and moon. I would suggest just modifying that R a bit, so it's more like the Didot R below it, where it's not closed.</p>
