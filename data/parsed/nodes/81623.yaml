    html: |-
      <p>I think if you look closely at all the letters it's clear that Ritmo is similar, but not a match. Look at the V, for example. Ritmo has no gap anywhere in that letter, but this type does.</p>
      <p>It's admittedly hard to visualize this, because the solid (raised) part is the shadow, not the letter itself, which is actually the voids outlined by the shadow. I think Lex got it right.</p>
      <p>- Mike Yanega</p>
