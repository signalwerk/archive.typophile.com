  html: |-
    <p>I just had a disaster with an embossing project that was supposed to be and ode to nothing...well it was nothing!  No ink was to be used.  However the shadows of the font were to be cast onto the paper creating an architectural 3 dimensional structural look.  </p>
    <p>Anyone have any experience with this who could explain to me the mathematics of what font size and weight is needed to pull off the nothing...but something look?</p>
