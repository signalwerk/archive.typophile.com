      <p>Peter Anderson: graphic art<br>
    ===========================</p>
    <p>Illustrated talk, Tuesday 27 November 2007 at 7pm</p>
    <p>      * Admission, including a glass of wine: £5 (£3 concessions), on<br>
    the door<br>
          * Venue: Bridewell Hall, St Bride Foundation, Bride Lane (off<br>
    Fleet Street), London EC4Y 8EE</p>
    <p>Peter Anderson, graphic artist and designer, will trace an unusual<br>
    typographic journey energetically mapped out against an eclectic<br>
    portfolio of clients and commissions. Starting out with typographic<br>
    printmaking and the making of artists’ books, his open-minded<br>
    approach to what the field of graphics might involve has since led<br>
    him through the construction of three-dimensional typographic<br>
    interior spaces and now into the area of moving image and the<br>
    development of television title sequences.</p>
    <p>As well as commercial projects for clients including Moschino, BBC<br>
    and the European Union, Peter Anderson’s work can be found in the<br>
    Tate Gallery, the Victoria and Albert Museum and the Museum of Modern<br>
    Art, New York.</p>
    <p>His work has also branched out into grand scale commissions,<br>
    including an installation of poles around the perimeter of the island<br>
    of St Lucia for the St Lucia Fine Art gallery; a series of<br>
    installations for Puma Sportswear in London; and both interior design<br>
    and installations for Paul and Jeanne Rankin’s series of Belfast<br>
    restaurants. He is currently exploring the graphic use of large scale<br>
    light sculptures in the branding for Altnagelvin Hospital in<br>
    Londonderry, Northern Ireland.</p>
    <p>Current television projects (mainly for title sequences) include: The<br>
    Whistleblowers (ITV1), The Castleford Project (Channel 4), Five Days<br>
    ( BBC 1) and Primeval (ITV1). He contributed to The new hand made<br>
    graphics (Rotovision), a publication which significantly increased<br>
    public awareness of his work and for which is he is still best known.<br>
    Finally, for his sins, he is preferred design partner at EMI records;<br>
    web projects range from Genesis and Pink Floyd to the current Spice<br>
    Girls reunion site.<br>
    Image by Peter Anderson</p>
    <p>Peter Anderson is the Director of the art/design studio Peter<br>
    Anderson Studio Ltd. <a href="http://www.peterandersonstudio.co.uk" title="http://www.peterandersonstudio.co.uk">http://www.peterandersonstudio.co.uk</a>.</p>
    <p>St Bride Library, Bride Lane, Fleet Street London EC4Y 8EE<br>
    Telephone: 020 7353 4660</p>
    <p>For further information, see <a href="http://www.stbride.org" title="http://www.stbride.org">http://www.stbride.org</a></p>
    <p>===========================<br>
    We apologise that we cannot take reservations for this event.<br>
    We plan to make this possible in future.</p>
