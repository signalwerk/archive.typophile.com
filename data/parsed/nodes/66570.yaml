    html: <p>Helvetica and Univers are, relatively speaking, very similar. When pairing two typefaces, one usually wants to find an accompanying style that is different, be it in a harmonious or in a contrasting way. These two neo-grotesques (both from Switzerland and 1957) don’t complement each other very well.</p>
