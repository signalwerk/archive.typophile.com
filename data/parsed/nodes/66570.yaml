    <p>Hi everybody !!</p>
    <p>Once again, I need your help to identify different fonts.<br>
    Indeed, I want to reproduce this French Tourism Guide as the Menu of a weeding;</p>
    <p>Can you help me to identify the differents ones?</p>
    <p>On the cover page:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/guide-routard-corse_4392.jpg"></div><p></p>
    <p>"des centaines de reduction"</p>
    <p>"Corse"</p>
    <p>"le guide du routard"</p>
    <p>"2009"</p>
    <p>Inside text:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/GuideRoutard0809_Sites_Internet_3419.jpg"></div><p></p>
    <p>"VILLES ET VILLAGES FLEURIS"</p>
    <p>"SITES INTERNET"</p>
    <p>"routard.com"</p>
    <p>"Tout pour preparer votre periple …."</p>
    <p>MANY, MANY thanks !!!</p>
