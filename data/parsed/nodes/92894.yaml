    <p><img src="http://typophile.com/files/first-image_3490.png"></p>
    <p>‘Krul’ is a typographic interpretation of the lettering style created by Dutch letter painter Jan Willem Joseph Visser at the end of the 1940s, which decorated the traditional brown bars of Amsterdam. In the beginning, these letters were strongly associated with the pubs connected to the Amstel brewery, given that Visser was the company's official painter. As the years passed, the style became increasingly popular, and various business owners in Amsterdam and other Dutch and Belgian cities also commissioned its use. In the 1970s and 1980s, Leo Beukeboom, another talented letter painter, continued and expanded this lettering tradition while employed under the Heineken brand. Much of his work can still be found in the Jordaan and De Pijp neighborhoods in Amsterdam.</p>
    <p>The Amsterdamse Krulletter, or Amsterdam's curly letter, is strongly inspired by the calligraphic works of the 17th century Dutch writing masters, of which Jan van den Velde was a central figure. However, distinct characteristics of this style, for example, its unusual and beautiful ‘g’, originate from a model that was published by Johannes Heuvelman in 1659, which J. W. J. Visser referenced.</p>
    <p><img src="http://typophile.com/files/cafe-hegeraad_3743.jpg"></p>
    <p>Typographic circles have somehow overlooked the Amsterdamse Krulletter and its heritage. The Dutch calligraphic hands preceded and influenced the formal English penmanship which has inspired numerous typefaces in the Copperplate style. In contrast, the models from van den Velde, Heuvelman, and Jean de la Chambre, among others, are a missing chapter in Dutch typographic history, and had never been turned into typefaces until now.</p>
    <p>Conscious of the cultural and identity issues that arise in reviving a unique style, and concerned about the speed with which the lettering style was disappearing, Ramiro Espinoza focused the project of designing ‘Krul’ on digitally recreating the calligraphic complexity of these beautiful letters. Created through several years of research, ‘Krul’ is not a direct digitization of the Amsterdamse Krulletter, but instead, an interpretation that incorporates numerous alternative characters absent in the original model, and improves upon details where necessary, resulting in an optimal performance on the printed page. The typeface is presented in Open Type format, with an abundance of intricate ligatures, fleurons, and swashes, which permit the creation of numerous calligraphic effects.</p>
    <p>The very high contrast and rhythm of the strokes in this typeface make it especially suited for media applications conveying a sense of elegance and sophistication. Designers of feminine magazines, advertisements, and corporate identities within the fragrance and fashion industries will find in this typeface to be an extremely useful and appropriate resource.</p>
    <p>The great Amsterdamse Krulletter is finally back, and we are proud to make it available to you.</p>
    <p>'Krul' can be purchased at <a href="http://www.re-type.com" title="www.re-type.com">www.re-type.com</a></p>
    <p><img src="http://typophile.com/files/krul-newsletter-news_3470.png"></p>
