    html: |-
      <p>Here is a quote that Gerard Huerta was kind enough to give me.</p>
      <p><cite>The Architectural Digest masthead was designed to be slightly condensed and<br>
      more tightly spaced than I would normally want. It is not a font, but a<br>
      hand-drawn logo. The purpose is to give it more presence on the cover. At<br>
      nineteen characters it is the one of the more complex mastheads.</cite></p>
      <p><cite>As we know a font’s characters are meant to all work with each other. In a<br>
      logo where we have fixed relationships we can draw the best possible<br>
      letterform combinations.</cite></p>
      <p><cite>There are two ligatures in the artwork: “AR” and “RAL.” In the first<br>
      ligature the leg (and angle) of the “R” is allowed to tuck nicely under the<br>
      “C.” In the second ligature the angle of the leg of the “R” has been changed<br>
      to allow the consistent spacing that has been established.</cite></p>
      <p><cite>There are two “C”s in the word “Architectural.” The second “C” has an<br>
      unfortunate neighbor “T”, and combined with the open space left by the “C”<br>
      it leaves more negative space than one would want in this situation.<br>
      Therefore, the ending of the “C” has been slightly extended and weight has<br>
      been added to that part of it to compensate for the excessive negative<br>
      space. </cite></p>
      <p><cite>The last thing to mention is the bookmatched serifs in the combinations<br>
      “CT”, “ES”, and “ST.”</cite></p>
      <p>James, I will comment further on the Huemiller later today or the next.</p>
