      <p>Pretty unsophisticated client, so I clipped a few serifs back so the single mark would print at any size. It also fixed a general crowded feeling and allowed a better rhythm in the white spaces—so the “i” dot shifted a bit as well.</p>
      <p>The “m” character just seemed too wide so I carefully hemmed it in a bit. The mark would appear with photos of fences and decking so a almost mechanical beat was what I was going for.</p>
      <p></p><div class="imageWrap"><img src="/files/AD_5651_5383.png"></div><p></p>
    html_clean: |-
