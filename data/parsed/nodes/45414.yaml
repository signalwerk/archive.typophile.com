    <p>Letter Tailoring is when a logo is made or a sign painted and the letters are modified for a better fit.</p>
    <p>Do you have a favorite example? </p>
    <p>I have collected examples from Doyald Young and Gerard Huerta, but I would be interested in other examples too.</p>
    <p>I am of course especially interested in those examples that might apply to text face design because they are subtle enough and or work with roman forms, but feel free to post your favorite even if it falls outside this range.</p>
