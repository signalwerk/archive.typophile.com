    <p>After doing some pixel typefaces (that I still need to post here) I wanted to do another display font. The idea behind it was to make a bubblegum version of Babyteeth. Since I decided to make it a monotype font there are also some Mojo influences - although less obvious. So far I've done both a regular and a highlighted version with accompanying dingbats. Since it's named after my birthyear, I've tried to use dingbats that represent that time (the 'pacman-ghost' is obviously ahead of its time ;-p ) although I'm not too sure whether I succeeded at that. Either way, I'm quite pleased with the outcome &amp; I hope you'll enjoy it!</p>
