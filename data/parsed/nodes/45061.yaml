      <p>Oops, I guess it shows I played Mario Bros one too many times ;-)<br>
      I can imagine my inspiration sources are not the best description for the font, but they did play a large part in designing it.<br>
      I totally agree with you on the bubblegum comment although I do like some dingbats better in the 'normal' version (e.g. the 8- &amp; 12-pointed star). I think this version also solves a little of the legibility issue. But like you said; the font is only to be used for large texts and preferably even only for single words.<br>
      The problem with distinguishing several letters prompted me to make a different Y. I actually prefer the alternative Y (which is closed at the top), but realize it might get easily confused with the T. I'll probably end up using the 'closed' Y anyway in the assumption most letters will be recognized within the words they spell.<br>
      Oh, and thanks for your comment, I've been waiting a while now to get my first comment on this font ;-)</p>
