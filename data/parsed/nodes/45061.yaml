      <p>After reading what influenced you I did not think I would like this face at all, but it is really nice. </p>
      <p>Obviously, as the typeface shrinks there will be some legability issues, but it wouldn't be used very small. My guess is that the E, N, Q and T are going to give you the most difficulty (I thought the T was a Q at first glance).</p>
      <p>I like the bottom set of letters a lot better, they seem much more bubblegummy.</p>
      <p>The Super Mario Bros. flowers are really nice touch.</p>
