      <p>Bill, the US government institutionalized "software" piracy from the get-go.<br>
      It ignored European copyright, and this acted as a form of subsidy to local content producers.<br>
      So when Morris refused Phinney permission to reproduce the Golden Type, he went ahead anyway, naming it "Jenson Oldstyle". </p>
      <p>There were major changes in British copyright in the late 18th century, going from perpetual to a time-limit, which boosted the UK book industry, opening up the reprinting of cheap classics. That's in St Clair's brilliant "The Reading Nation in the Romantic Period".</p>
