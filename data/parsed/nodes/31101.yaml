      <p>aluminum,</p>
      <p>Here I use "software" not in the computerized sense, but in the sense of information that can be removed and duplicated outside of the boundaries of its tangible medium. Fonts, for example, are the computerized version of tangible punches, but also the computerized version of the letterforms that those punches were cut to embody. For my purposes, the typeface design is the software, and the punches used to set the printed page, along with the press, are the hardware. In that sense, things haven't really changed that much over the course of a few centuries; it's just easier to make perfect or near-perfect copies of original works.</p>
      <p>Think about it in the Platonic sense; I think of "software" as the "pure forms." One can break into a letterpress house and steal their entire heavy case of type, or one can lift the designs through diligent counterfeiting. </p>
      <p>With regards to copyright laws, what would you consider to be "relatively new?" Even the idea of "relatively new" is relative. (Har har.) To be exact, "copyright" laws and the doctrines that inspired them  have existed for centuries. Read more here: </p>
      <p><a href="http://en.wikipedia.org/wiki/History_of_copyright_law" title="http://en.wikipedia.org/wiki/History_of_copyright_law">http://en.wikipedia.org/wiki/History_of_copyright_law</a></p>
      <p>— Josh</p>
