      <p><em>I suggested that it’s likely based on Franklin’s other activities</em></p>
      <p>That's not a very responsible thing to be saying. It's what dictionaries and lawyers call an <strong>allegation</strong>. Now, if you back yourself with some sort of information from reliable sources, then you would have something known as a <strong>fact</strong>.</p>
      <p>The quoted text below is taken from <em>Benjamin Franklin, An American Life</em>, by Walter Isaacson (2003, Simon &amp; Schuster):</p>
      <p>"Because there was no foundry in America for casting type, Franklin contrived one of his own by using Keimer's letters [Keimer was the printer he worked for at the time] to make lead molds. He thus became the first person in America to manufacture type."</p>
      <p>Later, when Franklin decides to leave Keimer's shop and set up one of his own with one of Keimer's apprentices, Hugh Meredith, Meredith's father "agreed to provide the funding necessary (200 pounds) for the two young men to set up a partnership... They sent to London for equipment*, which arrived early in 1728..."</p>
      <p>"*The fonts that Franklin ordered were those created in the early 1720s by the famed London type-maker William Caslon..."</p>
