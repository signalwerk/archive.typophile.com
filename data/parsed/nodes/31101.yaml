      <p>LaPolice is the first revival of an exceptional font produced in exceptional circumstances. Forget copyrights, trademarks: LaPolice is he first hacking of importance in the history of typography! It is the immediate copy of one of the largest typography innovations of the celebrated Romain du Roi created in 1705, which was used as the typeface for the court of Louis the XIV. What did the police do? Nothing.</p>
      <p>The creator of this type, Mathieu Malherbe Des Portes, the sole hallmark punch cutter of all of Paris proper, himself had trained Phillippe Granjean, the engraver of the font Romain du Roi. His version carries all of the unique characteristics of the Romain du Roi, such as the new horizontal serifs, sometimes doubled and the secant L. LaPolice is rounder and more dynamic than its original model - it is also more modern and 'organic'. LaPolice is named after a document named "Traité de la Police". </p>
      <p>you can have a look at this typeface on bpfoundry.com<br>
      a interpretation of Romain du Roi design by Ian Party will be release on bpfoundry in April 07</p>
