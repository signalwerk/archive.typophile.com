    <p>Hello font-fellows,</p>
    <p>Long time no visit. Hope everybody is well.</p>
    <p>I'm in the process of writing an academic paper about software piracy and I have come to a roadblock. I need your expertise.</p>
    <p>I'm fairly certain that at some point in the past, while reading about the history of type design I have come across examples of typefaces that were "pirated" centuries ago by competing printers. For example, Caslon may have cut a typeface and his letters were then blatantly counterfeited by those who could get their hands on a specimen. I know that this happened, but I need to find some sources that discuss it in more detail. Does anybody know of any sources that I could reference for this topic? </p>
    <p>My overall intent is to show that "software piracy" is by no means a new thing, and that unscrupulous folks have been stealing more than tangible property for centuries.</p>
    <p>Any help would be greatly appreciated. Thank you so much!</p>
    <p>- Josh Korwin<br>
    <a href="http://www.threestepsahead.com/" title="http://www.threestepsahead.com/">http://www.threestepsahead.com/</a></p>
