    html: |-
      <p>Josh, I should have pointed out the mistake in your history of Goudy Fancy privately via IM. My apologies. </p>
      <p>My point, in any case, was that the internet is quite poor when it comes to type history. </p>
      <p>After you read some surveys of type history in books, you can find useful, though limited, information on the internet. However the internet will not give you a good basic framework. I would start with Bringhurst's historical chapter in his Elements of Typographic Style, and then you can follow up with others. </p>
      <p>As to Goudy Fancy itself, if you put in that phrase as key word in MyFonts.com you will find another digital version of it which gives a history of it in the photo type era. I don't know if it's correct, but it's plausible, and you could follow up on her references. </p>
      <p>On your thesis: "My overall intent is to show that “software piracy” is by no means a new thing, and that unscrupulous folks have been stealing more than tangible property for centuries." As Gerald indicates above, this viewpoint is a bit off target. </p>
      <p>In the days of punch cutting every glyph by hand, exact copies were not really practical possibilities. During this era--till the invention of the pantographic punch cutter in 1880s--people did take design ideas from others, but didn't do exact copies. However, it is important to note that ideas are not copyrightable. </p>
      <p>Here you get to the difficulty of your topic. When does inspiration from the ideas in another design turn into unethical or illegal theft? This is not simple to determine, which is what makes protecting designs of all kinds difficult. </p>
      <p>Some cases are pretty clear on either end. For example the South Portico of the White House was designed by Thomas Jefferson, inspired by a similar portico in a building in Paris (where he had been posted). I believe he credited the source, and in any case it was one element in the design, and the effect was quite different. And there is no law against copying one element of a building in another, so far as I know. So there is no problem in what Jefferson did. </p>
      <p>On the other hand, some people just do an electronic copy of a digital font and resell them without permission or benefit to the original designer or foundery. That is a clear case of piracy, and is so recognized in law. </p>
      <p>You can find some interesting information on the internet about the history of copyright law that will give you further insight on this issue. </p>
      <p>But basically the story is that literal font copying didn't happen until about 1890, with the use of photographic enlargements and the pantographic punch cutter. I don't know the history of the law and practices on this issue, but getting it will require a lot of library work or talking to knowledgeable people or both. Copying of designs became still easier in the photo type era, and a snap in the digital era. </p>
      <p>In sum, both the question of what has happened and what was ethical in each era is not so easy to find out and say with precision. And the internet will not give you the answers.</p>
