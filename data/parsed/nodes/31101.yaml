    html: <p>I m not sur that we can compare Antoine Augereau and Claude Garamond with Phillippe Granjean and Malherbe Des Portes. The "Garamond" style was "creat" by different engraver in 1530 in Paris (maybe Simon de Colines and Augereau) Guillaume II Le Bé (1604) (son of Guillaume Le Bé who was the associate of Claude Garamond since 1550) talked about this in two different text. When Garmond creat his first typeface in 1540 he was only inspired by the style of the period, the pupils follow the steps of his (dead) master. The "Romain du Roi"  is a custom typeface it had shapes who were supposed to be private for the "Imprimerie Royal" like the secant l, it was like a trademark, Malherbe Des Portes used in his typeface a lot of those shapes. We don t know why the "Imprimerie Royal" said nothing... it s even more strange when we know that at the end of the 18 century, the director of the "Imprimerie Royal" made a lawsuit to Didot typefoundry because they used the horizontal serif, he said that they copy the trademark of the French kingdom's typeface... Didot won the lawsuit...</p>
