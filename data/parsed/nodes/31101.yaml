      <p>James</p>
      <p>The thing about Franklin is not accurate. The American printer Christopher Sower began importing matrices from the Luther foundry in 1770 and he established the first foundry here in 1772. </p>
      <p>Caslon was the more popular of British typefaces at the time, thus it appeared in most American publications. It probably survived, through successive recuttings, longer in the States than in England, until the revival in mid 19th century.</p>
      <p>While foundries certainly did copy the popular typefaces of other foundries this was in no way "pure theft" as there was no way to get accurate copy prior to the development of photography and the camera.</p>
      <p>Gerald<br>
      <a href="http://BielerPress.blogspot.com" title="http://BielerPress.blogspot.com">http://BielerPress.blogspot.com</a></p>
