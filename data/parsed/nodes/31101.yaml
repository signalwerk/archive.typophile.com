      <p>NOW we're getting somewhere. Thank you for the thoughtful insight, Mr. Berkson.</p>
      <p>That's an excellent point. I suppose if there really was direct copying of ideas in the days before technology were strong enough to make two copies indistinguishable, it would be difficult to prove that an exact duplication had taken place, and even the slightest variation would be something of an "evolution" of the design.</p>
      <p>Perhaps then typography isn't really the point. I'd probably have more luck discussing the direct duplication of the <em>content</em> of books; even though the typesetting may have differed, there was definite bootlegging of books at the time. </p>
      <p>As a side note, I do have quite a few books on type (and I've read through <em>The Elements</em> a few times, but I don't think I've come across any mention of Goudy Fancy in any volume. I only originally learned of the typeface, and subsequently digitized it, after a scan of an old Letraset catalogue was posted on a newsgroup a few years ago. I'll keep searching, but if anyone does have any specific information about it, that'd be grand.</p>
