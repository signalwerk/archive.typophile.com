    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/12207" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">History</a>&nbsp;:&nbsp;Trajan</strong></p>
    <p>Trajan <strong>1:</strong> Marcus Ulpius Traianus. Born 53 <span class="caps">AD</span>. Died 117 <span class="caps">AD</span>. <a href="/node/14507" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Roman</a> Emperor from 98–117 (during which point the Empire would reach it’s greatest&nbsp;extent).</p>
    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/12270" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Typefaces</a>&nbsp;:&nbsp;Trajan</strong></p>
    <p>Trajan <strong>2:</strong> A typeface designed in 1989 by <a href="/node/16061" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Carol Twombly</a> for <a href="/node/13428" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Adobe</a>.</p>
    <p><em>Trajan,</em> i.e., the lettered inscription on the base of <a href="/node/14497" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Trajan’s Column</a> in Rome, is often regarded as one of the best models of the Imperial Roman alphabet. Trajan’s Column was erected by the Senate and People of Rome as a memorial the Emperor Marcus Ulpius Traianus’ wars, which slightly extended the Empire’s frontiers even further into “barbarian” territory than it had already&nbsp;been.</p>
    <p>Contrary to the belif of some, the lettering on the base of Trajan’s Column was neither the debut of the <a href="/node/14499" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Roman Alphabet</a>, nor the first time that it had used <a href="/node/14498" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">serifs</a>. It is, however, probably the most famous example of&nbsp;both.</p>
    <p>While Roman handwriting was very different from Roman monumental lettering (whether hand painted, engraved, cut out of metal, or cut into stone), the letters on Trajan’s Column represent one of the best examples left to us from antiquity. Trajan’s Column, and samples like it, would go on to influence the development of the Roman alphabet, and later typeface design, for the next 2,000&nbsp;years.</p>
    <p>What was so special about the Roman’s inscriptional lettering? The Romans—who did not invent the idea of the alphabet—were the first to put serifs on their letters. It is speculated that the <a href="/node/13702" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Serif</a>’s origin was a result of applying a brush to the stone before it was carved. Others speculate the serifs were purely an aesthetic addition, put there by the stone&nbsp;carver(s).</p>
    <p>There have been several typefaces that are direct “revivals” of the lettering on Trajan’s Column. The most direct and most popular—and the only one to simply bear the name “Trajan”—is Twombly’s cut for Adobe. Other notable versions include <a href="http://www.myfonts.com/fonts/castletype/goudy-trajan"></a>Goudy Trajan and <a href="http://www.myfonts.com/fonts/wiescherdesign/imperium"></a>Imperium. <a href="http://www.myfonts.com/fonts/wilton/cyan"></a>Cyan is an attempt to add a lowercase to the classical roman square&nbsp;capitals.</p>
    <p>Adobe’s Trajan is an all caps alphabet. <a href="/node/12027" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Small Capitals</a> take the place of the lowercase glyphs, as Trajan’s Coulumn certainly did not have any symbols similar to our present-days lowercase letters on them (these were invented centuries&nbsp;later).</p>
    <p><strong>Discussion:</strong><br><a href="http://typophile.com/node/46809">An Alternative Font for Trajan Pro</a><br><strong>Additional Articles:</strong><br><a href="http://typographica.org/001120.php">Trajan: the Fallback Font for Lazy Movie&nbsp;Marketers</a></p>
