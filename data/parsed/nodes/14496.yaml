    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/History" class="freelinking" rel="nofollow">History</a> : Trajan</strong></p>
    <p>Trajan <strong>1:</strong> Marcus Ulpius Traianus. Born 53 AD. Died 117 AD. <a href="/wiki/Roman" class="freelinking" rel="nofollow">Roman</a> Emperor from 98–117 (during which point the Empire would reach it's greatest extent).</p>
    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Typefaces" class="freelinking" rel="nofollow">Typefaces</a> : Trajan</strong></p>
    <p>Trajan <strong>2:</strong> A typeface designed in 1989 by <a href="/wiki/Carol%20Twombly" class="freelinking" rel="nofollow">Carol Twombly</a> for <a href="/wiki/Adobe" class="freelinking" rel="nofollow">Adobe</a>.</p>
    <p><em>Trajan,</em> i.e., the lettered inscription on the base of <a href="/wiki/Trajans%20Column" class="freelinking" rel="nofollow">Trajan's Column</a> in Rome, is often regarded as one of the best models of the Imperial Roman alphabet. Trajan's Column was erected by the Senate and People of Rome as a memorial the Emperor Marcus Ulpius Traianus' wars, which slightly extended the Empire's frontiers even further into "barbarian" territory than it had already been.</p>
    <p>Contrary to the belif of some, the lettering on the base of Trajan's Column was neither the debut of the <a href="/wiki/Roman%20Alphabet" class="freelinking" rel="nofollow">Roman Alphabet</a>, nor the first time that it had used <a href="/wiki/serifs" class="freelinking" rel="nofollow">serifs</a>. It is, however, probably the most famous example of both.</p>
    <p>While Roman handwriting was very different from Roman monumental lettering (whether hand painted, engraved, cut out of metal, or cut into stone), the letters on Trajan's Column represent one of the best examples left to us from antiquity. Trajan's Column, and samples like it, would go on to influence the development of the Roman alphabet, and later typeface design, for the next 2,000 years.</p>
    <p>What was so special about the Roman's inscriptional lettering? The Romans—who did not invent the idea of the alphabet—were the first to put serifs on their letters. It is speculated that the <a href="/wiki/serif" class="freelinking" rel="nofollow">serif</a>'s origin was a result of applying a brush to the stone before it was carved. Others speculate the serifs were purely an aesthetic addition, put there by the stone carver(s).</p>
    <p>There have been several typefaces that are direct "revivals" of the lettering on Trajan's Column. The most direct and most popular—and the only one to simply bear the name "Trajan"—is Twombly's cut for Adobe. Other notable versions include <a href="http://www.myfonts.com/fonts/castletype/goudy-trajan" rel="nofollow">Goudy Trajan</a> and <a href="http://www.myfonts.com/fonts/wiescherdesign/imperium" rel="nofollow">Imperium</a>. <a href="http://www.myfonts.com/fonts/wilton/cyan" rel="nofollow">Cyan</a> is an attempt to add a lowercase to the classical roman square capitals.</p>
    <p>Adobe's Trajan is an all caps alphabet. <a href="/wiki/Small%20capitals" class="freelinking" rel="nofollow">Small capitals</a> take the place of the lowercase glyphs, as Trajan's Coulumn certainly did not have any symbols similar to our present-days lowercase letters on them (these were invented centuries later).</p>
