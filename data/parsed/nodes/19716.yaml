    <p>Hello</p>
    <p>I am looking for insight from the big font guns.</p>
    <p>I am designing a web page for a technology company.</p>
    <p>Being a fan of Communication arts and How magazine I want to couple the ff Meta I have (which is very small) used in the nav with a subhead and headlines font.</p>
    <p>Obviously, a bit more flavor that the plain meta would be welcome, but not too much.</p>
    <p>Parisine and Lisbon have had some resonance, but really would love to see if any of you had ideas.</p>
    <p>I guess a bit more beauty than Meta, a bit more character, yet contemporary.</p>
    <p>Thanks!</p>
    <p>wnf</p>
