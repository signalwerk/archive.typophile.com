    votes: null
    html: <p>Well, you can get a lot of stuff on an 11x17 lino velox, and those don't cost a fortune. So you could save money by doing a lot of exploratory advance work and testing it out all at once, instead of iterating and refining gradually. The bad side is that you'll be doing a lot of work you'll end up dumping. <br> <br>BTW, if you go lo-fi there's a lot to learn from observing existing small-size fonts, especially Times Europa, Adsans, Mandel's stuff, etc. It's a whole dark world to itself. <br> <br>hhp <br></p>
