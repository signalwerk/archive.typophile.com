    date: 2004-02-24T10:59:00
    date_raw: 24 Feb 2004 — 10:59am
    votes: null
    html: "<p>Well, Randy's divinity is well-documented (although I'd personally rather not learn all the details of the gory rituals Henboy performs during a full moon), but in my case I fear it's more a matter of invoking a daemon... which you have done! Mwahahahaha... <br> <br>As a display face, I think it's not interesting enough to pursue - except maybe as a learning exercise. <br> <br>But if you have technical leanings you might very well be on your way towards some primo uncharted territory: a font that exudes strong character at very small sizes. The semi-serif aspect might be key, the darkness is there, you just need to loosen it up and shorten the descenders. But most of all, you need to experiment with how exagerated curves behave at like 6 points. If you go this way, plan on spending some money on hi-res output though. <br> <br>hhp <br></p>"
