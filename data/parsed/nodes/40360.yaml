      <p>&gt;<em>**sigh** why they only teach only on Germany or French :( Maybe I should moving to Netherland and ask my grandmother to teach me the language.</em></p>
      <p>Because: (these are just my guesses…)</p>
      <p>1. German, French, Italian, and Rheto-Romanish are Switzerland's four official languages. German and French are the two biggest. Zürich is in the German-speaking part of the country. Despite the increasing amount of English spoken among Swiss, the official "second" language in Zürich is likely to be French.</p>
      <p>2. Both the University of Reading in the UK and KABK in the Netherlands teach their postgraduate typeface design courses in English, even though the Netherlands, for example, only has one official language—and by golly, it isn't even English!</p>
      <p>3. The French and the Germans (as well as, err… the Swiss) have their own brilliant histories of typeface design, which are rather quite separate from England's and that of the United States. Maybe they'd like to continue working in these spirits instead of, umm, burying them ;-)</p>
      <p>4. So that people who come from other countries to study there go through the effort of learning the local language and expanding their own minds and horizons at the same time. The whole world doesn't speak English, nor should it!</p>
      <p>5. Switzerland only joined the United Nations a few years ago, and heaven only knows if they will ever join the EU. They are a democracy, and they like doing things the way they please.</p>
