      <p>First off you're crazy for liking the winter!!</p>
      <p>I love working in interactive. As for coding, my office is larger (around 700 people), so we have the budget to have people to do the coding for us. My job is mostly all concept work and design. But I do know Flash and Actionscript because I don't think you can adequately design something to be produced in Flash if you don't understand the program or how the web works and how users interact with it. My boyfriend is also in interactive in a smaller agency (50 people) and because of that he needs to do some coding and flash work. </p>
      <p>You don't want to apply to an agency as a flash person because you probably won't be doing much of your own creative work. Flash people = production, not creative. It's smarter to get an in as a creative intern then it is as production. Basically what's happening in the industry now is clients are expecting web elements to all their campaigns, where-as before it was more of a specialized thing. So agencies had to start outsourcing the production of the sites to smaller development companies until they realized they were getting totally fleeced by them. That's why there are so many flash and programming jobs opening up in-house right now.</p>
    html_clean: |-
