      <p>I recognized the beautiful lettering as originating from Vyaz, but did not know it was so-called. I once painted a Russian icon (copied from an original)  together with the inscription without being able to read it.</p>
      <p>Here is more on the subject:<br><a href="https://russianicons.wordpress.com/tag/icon-inscriptions/">https://russianicons.wordpress.com/tag/icon-inscriptions/</a></p>
