  html: <p>I guys, i woukd like your feedback in this one. <br> <br>Pablo Donoso is an 18 years old car driver, he has been very succesfull in all the categories he had drive, in 2003 he drove on his first year in europe in Vergani Racing in the World Series Light category, in 2004 he changed to GD Racing and was promoted to the World Series, with drivers older than them, and having Enrique Bernoldi (ex F1 driver) as a team mate. He is a very promising car driver in Chile, and we are beting that he will get to the F1. <br> <br>I've been working with a journalist, his manager and a marketing specialist on his identity since november, and on march we wil launch his new website. <br> <br>look here!!! <br><a href="http://www.pablodonoso.com" target="_blank">www.pablodonoso.com</a> <br> <br>I would love to have comments on the logo, any improvements we are still on time to do it. <br> <br>thanks <br> <br>CG</p>
