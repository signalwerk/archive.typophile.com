    html: "<p>I am enjoying this. Nice idea.\\ <br> <br>Some observations: <br> <br>It took me some time to see the car in the design, which doesn'nt bother me. I think I wanted the green stroke to be a word (zoom?) <br> <br>But once I saw the car, I enjoyed it. <br> <br>The car is driving downhill, could the weight of the mark become more stable if the car were leveled? <br> <br>This idea may be ruinous, but put motion lines in the bottom of D for speed? <br> <br>Also, concerning the weights of the letters, the D,O and O increasingly stick out to me more and more as I look at it. Reweight? <br> <br></p>"
