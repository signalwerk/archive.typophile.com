  html: |-
    <p>I've written a library (in clojure, a lisp dialect), to work with parametric fonts (in a lisp dialect). You can look at it at github: <a href="https://github.com/danielecapo/fonduta" title="https://github.com/danielecapo/fonduta">https://github.com/danielecapo/fonduta</a>, the readme file tries to explain how to use it.</p>
    <p>It was written for my own fun, and it is far from being complete, but I decided to release it, because somebody (maybe) can find it interesting.</p>
    <p>You can see a small video <a class="freelinking external" href="http://www.facebook.com/photo.php?v=10151772596645311&amp;set=vb.906345310&amp;type=2&amp;theater#" rel="nofollow">here</a>.</p>
