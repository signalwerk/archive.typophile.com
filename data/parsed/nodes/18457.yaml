    <p>Hello all... first post here.</p>
    <p>About 9 months ago, when I was absent from work for a few months due to an illness, my organisation’s management decided to undertake a rebranding without involving the inhouse designers.</p>
    <p>So upon my return, I discovered that we’ve ended up with a virtually unusable logo and a corporate family that is completely unsuitable for setting lengthy documents like reports and publications.</p>
    <p>I can’t ditch the family chosen for display type but I do have the option to choose a serif face to accompany it.</p>
    <p>So I wondered if anyone would like to suggest directions to start in to help narrow down the choices? I guess the aim is to go for something with a contemporary feel — maybe with a generous x-height, extremely legible (for diversity purposes) and can tolerate tight fitting if necessary.</p>
    <p>The typeface — which I’m not particularly fond of — that the serif face has to accompany is a humanist sans with a peculiar ampersand: Today SB</p>
    <p><a href="http://www.myfonts.com/fonts/efscangraphic/today-sans-sb/" title="http://www.myfonts.com/fonts/efscangraphic/today-sans-sb/">http://www.myfonts.com/fonts/efscangraphic/today-sans-sb/</a></p>
    <p>The external design agency that foisted this upon us only recommended the Light and Medium variant, which is far too inflexible. First thing on Monday, I will also be purchasing the Regular set as well...</p>
    <p>Thanks in advance to all advice.</p>
    <div class="forum-topic-navigation clear-block"><a href="/node/18533" class="topic-previous" title="Go to previous forum topic">‹ new portal with typographical resources</a> <a href="/battle07" class="topic-next" title="Go to next forum topic">TYPE BATTLE: Week 7 (6 March) ›</a></div>
