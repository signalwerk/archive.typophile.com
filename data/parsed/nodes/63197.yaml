    html: "<p>I don't see the need to use two colors. Is there a reason? If not, go with the blue. In fact, you may want to go white on a blue background. You might have to finagle the blue to make sure it can be printed on.. ) As this is student work, you have total control of the Identity and you can set the rules. So, I wouldn't worry about dots being too small or whatever : they can be always be set to be  proportional to the substrate. What I would try is make 'Adler' and 'Planetarium' the same size and keep them on the same level. Your \"logo\" could then be the two words spaced out to fit the bottom, top, or side of any piece of collateral ( letterhead, business card, website background etc ) and then your stars fading out from the lettering. Your arrangement of stars is very pleasing to the eye otherwise.</p>"
