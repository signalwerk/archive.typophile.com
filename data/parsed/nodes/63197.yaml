    <p></p><div class="imageWrap"><img src="http://typophile.com/files/adler_screencap_3900.png"></div><p></p>
    <p>Hello. I'm currently a design student in my senior year of school. I was hoping to get some criticism regarding my mark for my Corporate ID class.</p>
    <p>My company is the Adler Planetarium in Chicago. Adler is one of the oldest planetariums in the world and by default has one of the richest histories of delivering a universal experience to all its customers.</p>
    <p>My big idea is Awe. I want to show that the universe is infinite by displaying the depth of space. It seems that when people become older the loose faith in what they thought was amazing when they were kids. I wanted to emphasize the imagination of space as well as reconnect with the nostalgia of visitors who have given up on their youthful dreams.</p>
    <p>Thanks in advance. Any criticism will be greatly appreciated.</p>
    <p>Mike</p>
