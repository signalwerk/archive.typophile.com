      <p>I definitely think the stars are way too tiny. In practical applications (such as printing on business cards, etc) they will get lost when reduced to smaller sizes. You might consider making the larger dots even larger, and arranging them into something recognizeable such as the big dipper. </p>
      <p>Right now someone might misinterpret the dots as paint splatters, or worse, when printed, just as accidental ink spots or debris.</p>
      <p>I do like the general idea, but I think it needs to be defined and look like you placed the stars there in a purposeful way.</p>
      <p>Also, consider an all-caps sans serif for the subtext.</p>
      <p>Just a thought: Maybe try a large cresecent shape across the top, to be reminiscent of planetarium tops. If you do that, I wouldn't get too cutesy with the arrangement of the stars b/c it would be too much.</p>
      <p>I like the color palette. This would also look nice as a part of a whole identity where navy becomes the primary background color for certain pieces (such as the back of a business card showing the logo by itself).</p>
      <p>Good work so far!<br>
