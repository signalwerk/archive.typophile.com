      <p>I agree with picard (what an appropriate name)... Those stars and parts of those serif letterforms will disappear at smaller sizes. It's an obvious approach which isn't bad, but at the moment it is too literal. I feel like you can achieve the same effect while using less yet bigger dots/stars, perhaps making a shape with them collectively that has some deeper meaning still.</p>
      <p>I'm a secret geek for space. I think your brief is in the right place; to pursue a type of depth and awesomeness in this mark will be ideal. Personally, the serif typeface, while nice, isn't invoking imagination with me, but more or less prestige.</p>
