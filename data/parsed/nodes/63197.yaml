    html: |-
      <p>I realized I never defended my work, or at least explained the it further.</p>
      <p>I wanted colors that invoke depth, but also tie into the history of the company. The very dark blue is an obvious representation of space, the gold/mustard color representing prestige. However, I do like the one color suggestion that CGI stated. I also like the vertical type treatment. I can assure you I tried many type treatments, some being on the same baseline, not vertical, so it's an interesting solution. The teal is what throws me off. Its a good tertiary color that applies to museums and conveys sophistication, but not space (i guess thats arguable). But thank you for the criticism/help. Its greatly appreciated.</p>
      <p>The reason I like the "mark" with the logotype is that its very anti-mark... if that makes sense. It's not sterile. In other words, its not a circle with some design in it next to myriad pro, call it day. Maybe thats not fair, but this isnt a generic museum. This is the oldest planetarium in America. It has some of the oldest artifacts on the planet. And everyday it inspires children and adults alike.</p>
      <p>So, it makes sense to be unique. The letterforms are kerned out and subtly represent space.  The "stars" are a texture that subtly represents depth and can be applied to a system (currently working on).</p>
      <p>I agree at a small scale, the "dots" will lose their affect. but don't most logo's? (im sure this can be argues to no end)<br>
      But for my idea, and what I'm trying to achieve, which is creating awe, a timeless, infinite, imaginative feeling, it applies. </p>
      <p>My thinking is that its a non-traditional vs traditional logo that im trying to incorporate. Its a little unorthodox what im trying to accomplish. </p>
      <p>One thing im working on in the system, is the mark and the logotype will not appear together in the signature if the two are going to be placed at a small scale. Obviously, its hard for me to showcase my BIG idea at 1/2 inch. But they will appear on the same piece. For example, a business card. One side will be bureaucratic while the other side has the spacial texture.</p>
      <p>One thing I never try to trip up on is whether something is obvious or not, then questioning if its a bad thing. The strongest marks tell the simplest stories.</p>
