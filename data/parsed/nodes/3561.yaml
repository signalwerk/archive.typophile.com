    html: <p>Red Rooster's Alghera and Unifonts Hudson Serif Rough are fairly similar. These and many other hand printed styles are from Part 6 of the Script Font ID Guide, if you want to look for others. I've attached Alghera and Hudson Serif. The Rough version is a bit 'crustier' looking, if that's part of what you wanted. <br><img src="http://www.typophile.com/forums/messages/83/28425.gif" alt="Alghera Sample"><img src="http://www.typophile.com/forums/messages/83/28426.gif" alt="HudsonSerif Sample"></p>
