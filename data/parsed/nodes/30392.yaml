      <p>Hmmm A rule that kinda has worked for me in pairing sans serifs and serifs is to try fonts from the same designer. Examples of fonts that work well together are (not suggestions in this case) ITC Avant Garde &amp; Lubalin but this is overused by many designers (Grafik Magazine is a good example of the harmony between these 2 fonts) Another example is Univers and Serifa (both from Frutiger). In your case since Max didn’t design any exciting serifs how about using some of Tobias Frere-Jones’s typefaces like Gotham in the logo and a serif like Mercury. I have not tried this but I think it might work (all found on Typography.com) You could also try a font that has both serifs and sans weights) One that I recently used is Andrea Tinnes’s Skopex but this is in a different style than you already sketched for the client. </p>
      <p>BTW I also like the logo but think it is an easy way out for you. Anything looks good in Helvetica and it is the reason why it is so overused by designers today. Check out <a href="http://www.the-letterbox.com.au" title="www.the-letterbox.com.au">www.the-letterbox.com.au</a> for funny comments on the topic (The book/publication Grand)</p>
      <p>Death to Helvetica and long live creativity;-)</p>
