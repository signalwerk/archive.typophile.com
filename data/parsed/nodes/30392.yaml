    <p>Hi, and Happy New Year to all of you!</p>
    <p>I’m working on a visual identity for a furniture manufacturer.<br>
    At this moment we (the customer and I) has agreed on a “concept” for the logo. (Attachment)<br>
    A “tag”-based concept, which are to be used further in a variety of angles, positions and so on. All good, I like that, and the customer loves it. The goal is to create a profile which is playful, but at the same time has references to the industry. Hope you understand.</p>
    <p>Then. The customer loves the logo set in Helvetica Neue, and I hate to admit, but I kind of think it works in capitals.</p>
    <p>Anyways, if this is to be used. I want to present a complete manual for font use, sizes and weights. Headings, body etc.</p>
    <p>So, now im kind of in the dark with all of this.<br>
    What’s recommended? Find a sans similar to Helvetica Neue (but better, more readable for smaller body copys). Or, leave Helvetica Neue for logo only. And maybe use something completely different for the rest of the profile? A nice modern serif or something?</p>
    <p>Answers and tips are much appreciated!</p>
    <p>Thanks alot,</p>
    <p>Mathias</p>
