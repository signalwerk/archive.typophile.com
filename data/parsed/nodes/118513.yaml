    html: <p>Thank you for your replies. I think Tesla is a remarkable brand, and the website reflects that. However, I would have expected them to use a less predictable font than proxima nova. Considering their logo for instance, which is somewhat "futuristic". But then, it all looks consistent and gets the message across.</p>
  - id: 598312
    user_id: 225801
    user_name: Suijin
    user_path: null
    user_image: /files/pictures/picture-225801.png
    date_raw: 28 Jan 2015 — 9:06am
    date: 2015-01-28T09:06:00
    votes: null
    html: |-
      <p>I think the font choice and typography is perfect; sophisticated and clean and reflecting the company's focus on engineering, quality and style. </p>
      <p>I think it's a mistake to believe that because a company is innovative that they need to employ a "less predictable" font. I would be curious to know what you think would have been strong alternatives, as it's not clear to me what you mean by "less predictable."</p>
