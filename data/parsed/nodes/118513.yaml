      <div class="comment-spam-body"><p>Excellent website, the width and clean lines of Proxima Nova highlight that this is a car for smoothly moving at speed along the open road, as shown in in at least one version of the website <a href="http://www.teslamotors.com/en_CA" title="http://www.teslamotors.com/en_CA">http://www.teslamotors.com/en_CA</a> BTW the sub-pix add to the message that this is electric and there ARE charging stations.<br>
