      <p>You've got some nice shapes going! I like that "O". And the "g" is nice.</p>
      <p>Some of the widths seem [unnecessarily] off (like the "o" looks wider than the "p") and such, but I think the first thing you should look at are different sorts of optical corrections, without which your font will look clumsy in terms of finish. </p>
      <p>Like Mikey says, one of these is the thinning at joins. If you look at your "a" for instance, notice how where the «foot» branches off at the bottom-right, there is a rather large area of black. If you print it out and squint at it, that will look like a little black blob. These amassments of black need some evening out – meaning, essentially, you need to cheat to make it look correct. One way to think about it is that the strokes should get a little thinner where they join. Another approach is to look at the negative white space (like the little notch coming up from the bottom) and carefully enlarge that.</p>
      <p>Another thing that caught my attention is that you don't seem to have any overshoots. See how in your "n", the «stem» looks like it's just a bit higher than the arch? How your "o" looks a bit shorter than your "i"? Round shapes need to be slightly taller mathematically than flat ones to look right.</p>
      <p>The third thing is that horizontals need to be slightly thinner than verticals. If you look at your "I" or "H" you will see that the horizontal bars look slightly too heavy.</p>
      <p>One of the most fascinating things about type design (and I'm really not such an expert either), to me, is learning to actually perceive these weird little tricks the eye plays, and work with them. For an introduction I recommend you have a look at this helpful paper by Mark Jamra on optical corrections: <a href="http://www.typeculture.com/academic_resource/articles_essays/pdfs/tc_article_6.pdf">PDF Link</a></p>
