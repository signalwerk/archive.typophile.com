    <p>Nova Mono is a monospaced font designed for programmers.  It takes the best of programming specific fonts as well as book fonts and attempts to bring them together.  This font is heavily inspired by many of the existing monospaced fonts especially Consolas and Pragmata.</p>
    <p>I just want to say I love this community and all the positive discussions that I've read here.  This is my first post as well as my first font.  I'm developing a monospaced font partly to learn what it takes to make a font and partly to make a font that I can use while programming.</p>
    <p>Motivations<br>
    - Keep the more mechanical and digital look of a font like Pragmata<br>
    - Apply some of the strengths of more natural monospace fonts like Consolas</p>
    <p>Usage<br>
    - Primarily Anti-aliased screen reading<br>
    - Print is secondary, but should look nice blown up</p>
    <p>This is only the first revision, but I would love some feedback on the general shapes of the glyphs.  I'd also like to hear your opinions on the font in general.  Thanks!</p>
