      <p>Keep in mind that for any typeface to work well for programmers, they have to be able to easily distinguish similar letterforms at small sizes. The 1, l, I, |; O, Q and 0, and (), {} and [], ', `, and " and the curly quotes, even comma and period, and so on. </p>
      <p>I like what you have going on here, but I'd want to see a fuller character set before passing judgment. </p>
      <p>Check out these <a href="http://hivelogic.com/articles/top-10-programming-fonts" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Top 10 Programming Fonts</a> and study what those designers have done. Raph Levien's <a href="http://www.levien.com/type/myfonts/inconsolata.html" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Inconsolata</a> is the best programming font out there, IMHO.</p>
