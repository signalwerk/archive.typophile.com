      <p>If it’s realy constructivist you want &amp; it’s a logo I suggest you get in somne books &amp; make your own! They are fairly simple to make - but probably less simple to make REALLY well. Stil, an original solution for type in a logo is always a little more ideal because it catches the eye better. If you want a super fast solution there is always ‘constructovist’ from P22</p>
      <p><a href="https://web.archive.org/web/20060522200630/http://www.p22.com/products/constructivist.html">http://www.p22.com/products/constructivist.html</a></p>
      <p></p><div class="imageWrap"><img src="/web/20060522200630im_/http://typophile.com/files/Constructivistov_r1_c1.gif"></div><p></p>
      <p>The other thing is that so far you are giving me a swiss modern or post swiss feel not a constructivist one. They were big on wacky energtic angles and didn’t go in for the degree of reductivism/simplicity you are using so far. Again, crack those books!</p>
      <p>And lastly, they were big on using human figures even if they were pretty abstracted</p>
      <p>Check this out</p>
      <p><a href="https://web.archive.org/web/20060522200630/http://www.a-website.org/design/pictohistory/pics/constructivist/kozlinskii.jpg">http://www.a-website.org/design/pictohistory/pics/constructivist/kozlinskii.jpg</a></p>
      <p>But I like what you made too.</p>
      <p>Cheers!</p>
