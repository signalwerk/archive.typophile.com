    <p>hi,</p>
    <p>I’ve been playing with this logo for a few days. This is for a record label’s web site. Right now, with how it is, it doesn’t really click.</p>
    <p>I was aiming for a russian/constructivist look with the bold usage of red and black, but i don’t think the type serves this purpose. The typeface is Akzidenz Grotesk Bold, what do you think would fit in better?</p>
    <p>Thanks</p>
