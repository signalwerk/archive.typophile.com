      <p>thanks for the suggestions so far.</p>
      <p>i think you’re right about the proportions, but i have a thing for the horizantal stroke of the kk. i think they give the abstract/graphic kk feeling better.</p>
      <p>i think my choice of typeface takes the whole feel of te design from consrtuctivist to minimal… i’ll try to come up with a home-made face for the logo based on the suggestions of EbenSorkin. The way i see it, when i change the face i’ll be able to be bolder with the kk icon.</p>
      <p>One thing i found out is that the letter K is very  difficult to manage and tame.</p>
      <p>btw, “Korkunc Kayitlar” is turkish and roughly means “Terrible Records”, terrible with a double meaning, either scary or good as in “terribly good”.</p>
      <p>thanks for your time and suggestions, i’ll post the updates.</p>
      <p>ea</p>
