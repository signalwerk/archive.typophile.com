  html: |-
    <p><a class="freelinking external" href="http://ask.metafilter.com/109060/He-couldnt-just-be-Jr" rel="nofollow">This question</a> about how to use Roman numerals with a script typeface was recently posted on Ask MetaFilter, and I'm curious to see what answers would be given by people at Typophile.</p>
    <p>I'm particularly interested in joeclark's statement "You shouldn’t be using a script typeface for any application that requires all-caps text."<br>
    I would tend to think that Roman numerals aren't considered "all-caps text", but that they're something else entirely. What say you?</p>
