    <p>Hi all,</p>
    <p>I am designing a multi-layered typeface. I created 4 separate files one for each layer but I have no idea how to generate the typeface. What I want to create is a typeface that overlaps my four designs making possible to choose 4 different colours for each of them.</p>
    <p>Thanks!</p>
