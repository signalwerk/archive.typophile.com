    html: <p>The bird is wonderful, but the break in the chest bothers me, and I also looked to see if there was hidden lettering in the illustration as well; which in my mind would be easy to incorporate but might be a bit too much. I feel as though the type needs to be a bit more inviting, ditch the all caps and try to find a way to avoid the use of extra weights and faces.</p>
