    <p>This is a concept for an Aroma Therapy company named Little Bird Therapies.<br>
    Little Bird Therapies is a very small business providing homemade therapies.<br>
    I am open to critiques, especially on the type treatment which doesn't look finished to me.</p>
    <p>The parchment is not a part of the logo at all, it is just a background that I was thinking about putting it on.</p>
    <p>I am a huge fan of this site and this is my first post, so please be kind.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/LB.jpg"></div><p></p>
