      <p>The bird is really nice and well done.<br>
      But I think you have done too much strokes at its tail. Its not balanced. The bird looks left weighted.<br>
      Also it doesnt look like a little bird. I would shorten the body and tail a bit and make the stomach wider. Now it looks like a pigeon not like a sweet little tomtit.</p>
