  - id: 114798
    user: 1139
    date: 2006-03-27T10:38:00
    date_raw: 27 Mar 2006 — 10:38am
    votes: null
    html: <p>Hi, I like the bird too, and I also agree with Steven that it looks little off balance and "pigeony." The curves are so intricate that I was looking for a hidden scripty  "L" and "B" which might look interesting (I'd try it, if it doesn't work, you can always go back). I'd suggest trying to simplify the type. Bold and different color is not necessary. You have three words and each has a different treatment which I think is too much. I like the green/brown combination, but I'd explore one color versions. The parchment compliments the colors very well, but it will be probably used on many different backgrounds so I wouldn't think of it as a part of a logo and worked with white background (at least for now). Nice start.</p>
