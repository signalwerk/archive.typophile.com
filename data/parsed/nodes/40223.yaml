  html: |-
    <p>I’m looking for a display font that conveys the notion of fluid, currents, motion, flow of liquid, etc. </p>
    <p>I’m revamping the quarterly print newsletter for a nonprofit devoted to advocacy and research around a neurological condition. The title of the newsletter is still under debate but will be something about flow/current. The organization’s logo uses Optima (not my decision) along with a wave-like graphic. </p>
    <p>FYI, in the past we’ve used Slimbach and more recently Minion for the body text of the newsletter; I’m not yet sure if we’ll be changing that too. </p>
    <p>I’m clueless when it comes to readable, modern script fonts, so I’m thinking about a really nice italic version of a serif font. Thoughts?</p>
    <div class="forum-topic-navigation clear-block"><a href="/node/40200" class="topic-previous" title="Go to previous forum topic">‹ Programmer CV/Resume Type</a> <a href="/node/40222" class="topic-next" title="Go to next forum topic">Need a font with a good legibility... ›</a></div>
