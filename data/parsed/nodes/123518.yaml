      <div class="comment-spam-body"><p>Lettering on buildings of the era was custom designed by the architect or builder rather than being copied direct from a font. As you note it's similar to Lombardic. The medial spurs and Tuscan terminals make it a true Victorian Frankenfont.<br>
      For digital fonts with some similarity to the Lombardic design you could also check for fonts tagged uncial, medieval, illuminated, Irish, medieval and Celtic.<br>
      I posted a fairly comprehensive set of links to this genre of fonts in <a href="http://typophile.com/node/123144" title="http://typophile.com/node/123144">http://typophile.com/node/123144</a><br>
      Don</p>
      </div>
