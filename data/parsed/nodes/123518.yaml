      <div class="comment-spam-body"><p>I agree that the letters say Victorian neo-gothic whimsy more than appalling.<br>
      In my opinion, there is nothing wrong with a Frankenfont if the mash-up creates a coherent mood.<br>
      They would work quite well for a dragons/steampunk/Harry Potter milieu.<br>
      Perhaps the letters will inspire a lettering artist or fontmaker to venture a full alphabet.<br>
      Don</p>
      </div>
