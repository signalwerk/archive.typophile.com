    html: |-
      <p>Thanks for the reply Don. I should have realised it wouldn’t be a font as such. I wonder though if they did work from some kind of examples.</p>
      <p>I knew there was something incongruous about it all, but as frankenfonts go I don’t find it too appalling. I don’t need to reproduce it. I was just doing some research on the history of the building—some of the descriptions of early picture shows there are quite amusing.</p>
