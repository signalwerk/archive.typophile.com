    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Institute 1868.jpg"></div><p></p>
    <p>I feel like I’ve seen this elsewhere, but I can’t pin it down. It’s a little similar to fonts that are called Lombardic, but it much less flowing. Can anyone identify it?</p>
