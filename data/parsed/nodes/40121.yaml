    <p>Greetings, all. </p>
    <p>I just discovered typophile today while attempting to discover which font would best meet a particular design need I’ve run into. What a cool site. </p>
    <p>Question:</p>
    <p>I’m resetting a pamphlet published in 1883: William Smith on Mormonism. </p>
    <p>It was printed in Lamoni, Iowa (at Herald Steam Book and Job Office), as I said, in 1883. </p>
    <p>While I have access to the text, I have been unable to locate any images of the actual document. </p>
    <p>Without that, I have no idea what font was actually used. While I’d love to know, I’d settle for at least setting it in a historically-tenable font.</p>
    <p>Does anyone have suggestions?</p>
    <p>Much thanks for your time and help, folks. </p>
    <p>Chris</p>
