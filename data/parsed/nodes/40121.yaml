    html: |-
      <p>Also take a look at Oldstyle #7.</p>
      <p>&amp; don’t get too bothered if a face hasn’t got small caps. They were not that common at the time, and I bet the guys down in Lamoni did not have them. Few Midwest country printing shops had them even by the 1960s, I can tell you that from experience.</p>
      <p>&amp; Monticello for sure; look at that.</p>
      <p>But also make sure you have asked yourself how important it is that the job be set in a “historically-tenable font.” I don’t mean you should set it in just anything, but think about the purpose of your work. And the audience for your work.</p>
      <p>powers</p>
