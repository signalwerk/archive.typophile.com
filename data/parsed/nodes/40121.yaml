      <p>URW Modern Extended is nice and dark in color, it prints well on poorer stock. Use a didone like HTF Didot or Bodoni 72 for the titling, and you’ve got a nice, historically-appropriate design I would think.</p>
      <p>I agree that while DeVinne is nice, it is too light for most applications; yet another casualty of the early digitization era.</p>
      <p>I would imagine Font Bureau’s FB Scotch is nice, but I haven’t seen it anywhere other than their pdf specimen sheet.</p>
