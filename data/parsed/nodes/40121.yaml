      <p>While it is from a slightly earlier time, Monticello would be appropriate, and better, I think, than Walbaum or Bodoni for the time, place, &amp; content.</p>
      <p>Matthew Carter made the PostScript version of Monticello for Princeton University Press, as it had been used in their Thoreau series. This was done in partnership with Linotype as they had done some preliminary digitization.</p>
      <p>The fonts are available from Carter &amp; Cone, or I believe Linotype. The C&amp;C has all the goodies, but as it is a Type 1 font, they’re spread out across multiple fonts. Monticello is essentially the same as <cite>Oxford</cite>, and could be thought of as a Scotch.</p>
    html_clean: |-
