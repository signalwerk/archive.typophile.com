    votes: null
    html: '<p>Hard to tell from a small sample, but perhaps Baskerville? <br> <br>Edit: There are a ton of Baskerville digitizations out there - I have Monotype Baskerville but I noticed this new one, called <a href="http://www.myfonts.com/fonts/storm/john-baskerville/" target="_blank">John Baskerville</a> which seems very complete.</p>'
