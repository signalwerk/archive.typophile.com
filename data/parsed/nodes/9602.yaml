    votes: null
    html: <p>I agree that it looks like Baskerville, but the clincher would be to see a Q.  I'd guess in that time period the Monotype might have been the model for most of them, but I think every foundry had their own versions. You are talking about metal type, remember, probably set by something like a Linotype or Monotype typesetting machine. <br> <br>A look at McGrew might give a good idea what was in use.</p>
