    html: |-
      <p>For any who are interested, I found Garage Gothic Bold which is similar, the 3 is as good as the same and the 5 is similar.  The 7 has a curved vertical stroke and the one has a slab serif bit on the bottom which differs from the sample.  In the capitals, the W and M middle strokes do not extend to the base line / cap height as shown in the sample - and is overall a little wider. I have also looked at other Frere-Jones faces, Champion Gothic Bantamweight &amp;  Knockout No. 66 Full Flyweight, however these don't appear to have the angled 3 or irregular 5 (however the 1 is similar).</p>
      <p>Any clues are most appreciated. Thanks again.</p>
      <p><a href="http://www.fontshop.com/fonts/singles/font_bureau/garage_gothic_bold/?&amp;sample_text=COLUMN%20REVIEW%2013574" rel="nofollow">Garage Gothic Bold</a>  |  <a href="http://www.typography.com/fonts/font_styles.php?productLineID=100002" rel="nofollow">Champion Gothic</a>  |  <a href="http://www.typography.com/fonts/font_styles.php?productLineID=100013" rel="nofollow">Knockout</a></p>
