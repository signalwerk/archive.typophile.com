    <p>Hey All,<br>
    First post here as I've always been able to find what I need by trawling the forums,  but this one has me totally stumped.  It's like Compacta or something of that ilk but the numerals / numbers have proved impossible for me to track down.  The '3' has me particularly intrigued.  Hopefully the image is satisfactory to identify the typeface.  It's used in the British photography magazine '8'.<br>
    Thanks in advance for any and all help.</p><div class="imageWrap"><img src="http://typophile.com/files/image1_5700.jpg"></div><p></p>
