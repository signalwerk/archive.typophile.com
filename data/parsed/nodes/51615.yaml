    <p>I have extolled the many of virtues of IKEA before, but did you know IKEA has a Swedish food market? </p>
    <p>Get your Omega fatty acids from the land of Volvo, ABBA, and people with Legoland haircuts. Try the many seafood products IKEA supplies, particularly salmon fish—as frozen blocks, or cured and spiced as Gravlax filets, even in paste form. This leads me to my little font-in-use discovery:</p>
    <p>Abba Seafoods (no relation to the dancing queens) uses FontSmith Albert for their product labeling.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/abbainatube_6366.jpg"></div><p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/5515-2_6217.330w.jpg"></div><p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/5515-main_5814.675w.jpg"></div><p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/53ef9e990b_5385.jpg"></div><p></p>
    <p><a href="http://www.fontsmith.com/font_details.php?font_num=1" title="http://www.fontsmith.com/font_details.php?font_num=1">http://www.fontsmith.com/font_details.php?font_num=1</a></p>
    <p><a href="http://www.abba.se/" title="http://www.abba.se/">http://www.abba.se/</a></p>
    <p><a href="http://en.wikipedia.org/wiki/Gravlax" title="http://en.wikipedia.org/wiki/Gravlax">http://en.wikipedia.org/wiki/Gravlax</a></p>
    <p>Yes, very fonty, even very healthy, but this Typophiler wound up making a beeline to the hotdogs and ice cream anyway.</p>
    <p>Mikey :-)</p>
    <p>PS... For Extra Credit: In  the last image, can you identify the white type running vertically? </p>
    <p>Cream...<br>
    Créme...<br>
    Krab C...<br>
    Pasta a...<br>
    Krabbe</p>
