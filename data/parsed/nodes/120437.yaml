    <p>Hello all,</p>
    <p>I am interested in finding the font used in the article "Lewis F. Richardson's mathematical theory of war" in <em>Game Theory as a Theory of Conflict Resolution</em></p>
    <p>Here is an image: </p><div class="imageWrap"><img src="http://typophile.com/files/fontexample_3912.png"></div><p></p>
    <p>The PDF file is available here: <a href="http://deepblue.lib.umich.edu/bitstream/handle/2027.42/67679/10.1?sequence=2" title="http://deepblue.lib.umich.edu/bitstream/handle/2027.42/67679/10.1?sequence=2">http://deepblue.lib.umich.edu/bitstream/handle/2027.42/67679/10.1?sequen...</a></p>
    <p>As a historical aside, is there any information regarding mathematical typesetting of the period? I have seen the same style used in many texts.</p>
    <p>Thanks in advance for your assistance.</p>
    <div class="field field-type-text field-field-solved">
          <div class="field-label">Font:&nbsp;</div>
        <div class="field-items">
                <div class="field-item odd">
                        New Caledonia        </div>
