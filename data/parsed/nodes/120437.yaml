      <p>The font in the mathematical formulae (which differs from the font used for variables in the text) is not far from Computer Modern (default with TeX) that was based on Monotype Modern 8a. Here is Computer Modern<br>
      <img src="/files/forms_6619.png"><br>
      (The default spacing between f and P given by TeX is larger; I had to use some negative kerning to match the sample)</p>
