      <p>I looked at the maths in the rest of the paper and the typesetting does not meet the mathematical standards of that period. It would also be hard to reproduce formulas that are that badly formatted with currently available tools.</p>
      <p>For a historical overview, there is a nice little publication entitled "Mathematical Typesetting" available from Tiro typeworks at <a href="http://www.tiro.com/projects.html" title="http://www.tiro.com/projects.html">http://www.tiro.com/projects.html</a></p>
      <p>There is also Daniel Rhatigan, <em>The Monotype 4-Line System for Setting Mathematics</em>, Essay submitted in partial fulfilment of the requirements for the MA in Typeface Design, University of Reading, 2007 <a href="http://ultrasparky.org/school/pdf/Rhatigan_Monotype_4-line_math.pdf" title="http://ultrasparky.org/school/pdf/Rhatigan_Monotype_4-line_math.pdf">http://ultrasparky.org/school/pdf/Rhatigan_Monotype_4-line_math.pdf</a>,</p>
