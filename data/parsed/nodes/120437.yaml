      <blockquote><p>I wonder which regular fonts might have this capability?</p></blockquote>
      <p>I’m not sure what you consider a “regular” font, but there are non-TeX fonts especially suited for setting math. Most notably Cambria Math and Stix (<a href="http://www.stixfonts.org" title="http://www.stixfonts.org">http://www.stixfonts.org</a>).<br>
      List of fonts with a MATH table: <a href="https://developer.mozilla.org/en-US/docs/Mozilla/MathML_Project/Fonts#MATH_fonts" title="https://developer.mozilla.org/en-US/docs/Mozilla/MathML_Project/Fonts#MATH_fonts">https://developer.mozilla.org/en-US/docs/Mozilla/MathML_Project/Fonts#MA...</a></p>
