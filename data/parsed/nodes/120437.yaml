    html: |-
      <p>Any of several Scotch Romans, including New Caledonia as suggested by Kevin.<br>
      In the days of metal typesetting, the character sets of a font were limited. To set special characters such as mathematical symbols the printer had to resort to an additional font of symbols, sometimes called, particularly in the US,  a "Pi" font because it usually included the letter π.<br>
      I don't know if this particular page was hand set or in a font that could be used in a Linotype or similar machine.<br>
      By 1957 photo-composition was replacing metal. So this is also a possibility for your page.<br>
      For a digital substitute there are specialized math fonts or you could use a Scotch Roman with a good math component. You might look at Nick Shin's Scotch Modern <a href="https://www.myfonts.com/fonts/shinn/scotch-modern/" title="https://www.myfonts.com/fonts/shinn/scotch-modern/">https://www.myfonts.com/fonts/shinn/scotch-modern/</a><br>
      For more info on typesetting you might start with this wiki <a href="http://en.wikipedia.org/wiki/Typesetting" title="http://en.wikipedia.org/wiki/Typesetting">http://en.wikipedia.org/wiki/Typesetting</a><br>
      Don</p>
