      <p>Kevin, I agree with your call of New Caledonia -- a Scotch Roman -- as the closest digital to the 1957 Italic subhead. The rest of the text is not detailed enough to say 100% but New Caledonia would certainly make a reasonable substitute.</p>
      <p>As for the math, anyone familiar with TeX could use Computer Modern, as suggested by Michel. Some info on Computer Modern at<br>
      <a href="http://en.wikipedia.org/wiki/Computer_Modern" title="http://en.wikipedia.org/wiki/Computer_Modern">http://en.wikipedia.org/wiki/Computer_Modern</a><br>
      <a href="http://www.ctan.org/pkg/cm-unicode" title="http://www.ctan.org/pkg/cm-unicode">http://www.ctan.org/pkg/cm-unicode</a></p>
      <p>I'm not certain the math it could be set in New Caledonia or any of the other  Scotch Romans.<br>
      I wonder which regular fonts might have this capability?<br>
      Don</p>
