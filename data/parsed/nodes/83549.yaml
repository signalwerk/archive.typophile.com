    <p>Hi,<br>
    as I'm writing a book review I'm cross checking some sources, and I'm curious about the Typophile typowiki Helvetica text, in particular</p>
    <p><cite>Stempel and Linotype were not fond of selling a typeface that was named after a "competing" company (Haas)</cite></p>
    <p>I haven't found this anywhere else, so I'd like to know who wrote it, and/or where the source for this assumption comes from.</p>
    <p>Kindly yours,</p>
    <p>ƒ</p>
