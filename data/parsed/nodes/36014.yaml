    <p>This is a quicky prototype logo or a friend who’s starting a web design company. The idea is the company will be like blogger where you upload your files and use templates to create your own website. The idea behind the logo is it’s supposed to be a somewhat famous landmark in the Southern San Francisco Bay Area. Any critique would be appreciated.</p><div class="imageWrap"><img src="/web/20080706165118im_/http://www.typophile.com/files/towerhillproto1_5217.jpg"></div><p></p>
