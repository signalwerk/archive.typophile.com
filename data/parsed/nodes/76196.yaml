      <p>I have an HP color laserjet, which is a fine workhorse printer, but as Freiberger says, if you're proofing type, it comes out bolder than you expect. I don't think this is a function of the toner but rather of the Postscript emulation that the HP print driver uses. Using recharged toner cartridges probably does adjust for this gain.</p>
      <p>But this summer I got a Xerox Phaser monochrome printer with true Postscript. Everything comes out a lot sharper and without the HP bloat. </p>
      <p>What I concluded: If your target output device is a true Postscript printer (e.g. professional offset printing), then it's worth having a true Postscript printer to proof with. I am not sponsored by Xerox, but it's the only true Postscript printer I found at a reasonable price.</p>
