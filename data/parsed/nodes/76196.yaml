      <p>Let me add a second question to this thread: does anyone have different type results with original and recharged toner?</p>
      <p>With my HPs (LaserJet 4P, LaserJet 2100m and ColorJet 2605dn) original toner produces type bolder than I expected. It's clearly more tinted than I see on screen, although contour quality is excellent. But with recharged toner cartridges these same printers produces lighter, less tinted texts. Actually, type printed with recharged toner is more near to off-set print result, but contour quality is not so perfect.</p>
      <p>Was this an issue to you? Which kind of test must be considered more reliable to show how my font will play at commercial prints?</p>
      <p>About color printing, I worked intensively with a Tektronix about ten years ago, just before the company was purchased by Xerox. Although expensive, Tektronix color results were fantastic. Pure B&amp;W text were not so good, always darker than it would be. Phaser printers and also its print results suffered a lot with humidity and heat climate conditions. In other hand, HP ColorJet 2605 I use now produces rather good results for color text and graphics, but has a poor, swashed output with photos. It's much cheaper and hardly affected by humidity.</p>
