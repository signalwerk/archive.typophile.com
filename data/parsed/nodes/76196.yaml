      <p>I second Bob's recommendation of HP network printers. I picked up a LaserJet 5000n for $50 advertised on craigslist.<br>
      The upsides are that it handles 11x17, A3, and sheets slightly larger; it can also handle pretty heavy weight media when loaded manually; it does high-volume printing very well; its toner lasts a long time; after setting it up on the network, it's really simple to add the printer to other computers, particularly ones running OS X; for general graphic design proofing (usually with lots of greys on the page) the print quality is fine—for lettering and type design it's great; it's pretty reliable. In four years I have never had a problem more complicated than a paper jam.<br>
      Downsides: It's big and heavy; setting it up on the network is just slightly complicated, or not at all, depending on how the previous owner configured it. It took me 30 minutes (and you'll need to know a few particulars about how your own network is set up); Also, buying second-hand can be risky. I got lucky and found a machine that had hardly been used and its imaging and output were perfect. Particularly with these older models though you'll find some that have been mistreated, and often the result is repeating defects—some of which disappear with a new toner cartridge, some don't. Just be sure to check its test page output carefully before buying.</p>
      <p>I also second Christopher on Phaser's color. It's the best color laser output I've seen. The place I was working that had it did have to call in professionals occasionally to recalibrate it and replace parts a few times over the course of the 9 months I was there.</p>
