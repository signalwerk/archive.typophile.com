    <p>Hi All,</p>
    <p>A friend and I have started a general graphic design office.  We're in need of a printer that outputs text at acceptable resolutions, isn't going to break down on us and isn't going to cost a fortune.  Though it will primarily be used for printing generic office documents, I would like for it to be able to print out quality drafts and tests when needed.  I don't know much about the standing of laser printers in the current market or which brands to trust.  Most of the posts on the forum concerning the topic are outdated and reviews on the web are scattered about and from people who aren't concerned with the same things we are (ie text qualities, etc.)</p>
    <p>If those of you on the forum feel like sharing your opinions and experiences please do.  It'd be greatly appreciated.  </p>
    <p>Just as an example:  Would this be a suitable printer: SAMSUNG ML-2525W? (<a href="http://www.newegg.com/Product/Product.aspx?Item=N82E16828112184" title="http://www.newegg.com/Product/Product.aspx?Item=N82E16828112184">http://www.newegg.com/Product/Product.aspx?Item=N82E16828112184</a>)  Is Samsung trustworthy?  Are all printers around $100 going to break down in a few months?  Does it even matter which brand I choose?</p>
    <p>Thanks!</p>
    <p>Korey</p>
