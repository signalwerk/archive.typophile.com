    <p>Hi there,<br>
    We keep having a problem when wanting to insert manual line breaks while using the Adobe Paragraph Composer setting (applied on a Paragraph Style). Are we missing some basic setting - is there a way to 'override' the Paraph Composer locally? I.e. applying a manual break without affecting the rest of the paragraph?<br>
    In the following images you can first see a sample paragraph the way it is handled 'by default'. When trying to fix one of the lines, breaking before the word 'used', the whole paragraph gets shifted:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/1_4096.png"></div><p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/2_5362.png"></div><p></p>
    <p>If you have any ideas or suggestions regarding this, we'd be more than happy. Or any advice on the hyphenation zone setting that we don't quite manage very well and might well have some impact on the problem we're having.<br>
    Thank you,<br>
    Fredrik, Nina</p>
