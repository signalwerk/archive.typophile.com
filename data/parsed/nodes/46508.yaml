      <p>This is just an observation, but why are you adding a break before "used"? Your rag in the original is nominal, and hyphenation is limited, but as soon as you force return, you get twice as many hyphens and the ragging seems to become more prevalent. And if you forced return because "used" was too close to the margin, you've now force "found" a few lines lower even closer.</p>
      <p>Like I said, just an observation.</p>
      <p>It's paragraph specific (return to return), but you can switch between single-line and paragraph composer. So if you want to manipulate a single paragraph, this might lead to a more suitable solution.</p>
