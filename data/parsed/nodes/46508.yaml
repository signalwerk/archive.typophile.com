    html: |-
      <p>I would hardly call it a "limitation".</p>
      <p>What InDesign is trying to do, in Paragraph Composer mode, is to equalize the space widths of the <em>entire</em> paragraph. That's best visible with justified text, but it also works with ragged-right text. It appears it works backwards from the manual line break for the first part, and forwards for the rest.</p>
      <p>Putting in manual line breaks should be a last resort, as these will always bite you back when editing the text afterwards. Try using "No Break" on just those words you want to keep together. That will allow ID to use its own judgement on where the exact line breaks will come. I use that function so much for these sort of manual tinkering, I've assigned a shortcut key to it.</p>
      <p>If you intended to get rid of the "used" because it sticks out of the rest, you could try fiddling with the hyphenation settings. The "Hyphenation Zone" doesn't mean much to me, but you could try moving the "Better spacing - Fewer hyphens" slider either way.</p>
      <p>If you desperately need <em>total</em> control of the paragraph (all of them or just this one), switch to the Line Composer. That'll behave the way you are used of lesser programs (!)</p>
