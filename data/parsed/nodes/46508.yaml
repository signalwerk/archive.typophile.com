      <p>Losing control? I see it as 'having less to worry about'. Yeah, if you are editing a book, it's irritating InDesign tries to make the very best of it with the word/letter spacing and hyphenation constraints you impose on it. Fortunately, Adobe foresaw that, so just select the Single Line composer to do your own thinking.</p>
      <p>Ken: awww, do you <em>really</em> favour manual line breaks (meaning: "I want a line break HERE") over No Break (meaning: "I want this word/these words to be unbroken")? I assigned a shortcut to No Break and apply it at will whenever I see something I don't like. For the rest, I let ID decide.</p>
      <p>Or perhaps that 900-page book has pages-long single paragraphs as well :-) that'd help a lot.</p>
