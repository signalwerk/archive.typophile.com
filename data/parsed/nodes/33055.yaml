    <p>Suddenly, the letter “i” and “n” doesn’t display themselves in InDesign, Illustrator etc.</p>
    <p>If I try to recall what I did recently was to fix startpoints-macro from Adobe. There was also an update in InDesign which i run. Nothing else have I done, except from exporting the fonts in the same way I always do.<br>
    The glyphs show themselves in FontLab, but not anymore in applications.</p>
    <p>Anyone experience this problem? It’s driving me crazy.</p>
