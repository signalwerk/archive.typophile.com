    <p>Hi all,</p>
    <p>I’m working on a magazine spread project to bolster my portfolio for an upcoming portfolio scholarship exhibition.  I settled on desiging a political magazine that is aimed at college aged young adults and more creative types.  I settled on the name Ars Politica (our politics) and right now im testing out different fonts for the header/logo.  I’m trying to create some typographic contrast by using two different font styles because i want the header to feel political yet youthful and fresh at the same time.  As of now i have about a dozen or so options but im none of them are particularly jumping out at me. So i could really use any suggestions/comments on whichs ones work/don’t work and what other layouts or fonts might be good to use.</p>
