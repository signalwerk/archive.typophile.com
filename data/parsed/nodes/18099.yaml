    <p>I just saw <a href="https://web.archive.org/web/20081012032444/http://typography.net/type/bliss.htm">Tankard’s Bliss </a>  in a newspaper ad and it reminded me again how important <a href="/web/20081012032444/http://typophile.com/wiki/Edward%252BJohnston" class="wiki">Edward Johnston</a>’s Railway type (1916) has been to the sans world. It’s easy to forget that <a href="/web/20081012032444/http://typophile.com/wiki/Gill%252BSans" class="wiki">Gill Sans</a> got 95% of its genetic material from Johnston, and that Johnston preceded <a href="/web/20081012032444/http://typophile.com/wiki/Futura" class="wiki">Futura</a> by 12 years.  I can’t think of any sans of note that predated it except <a href="/web/20081012032444/http://typophile.com/wiki/Akzidenz%252BGrotesk" class="wiki">Akzidenz Grotesk</a>. Even though Johnston was not available as a commercial face for more than 80 years (<a href="https://web.archive.org/web/20081012032444/http://www.myfonts.com/fonts/itc/johnston/">ITC Johnston</a>, 1999) its influence was immediate and worldwide – since, then and now, many of the world’s educated people seem to pass through London. Johnston’s influence can even be seen in <a href="https://web.archive.org/web/20081012032444/http://www.clearviewhwy.com/ ">Clearview</a>, coming soon to a road sign near you if you live in N. America. P22’s <a href="https://web.archive.org/web/20081012032444/http://p22.com/products/london.html">London Underground</a> is faithful to Johnston’s original and has some cool extras, but also has a very restrictive license.</p><div class="imageWrap"><img src="/web/20081012032444im_/http://typophile.com/files/itcjfortypo.gif"></div><p></p>
