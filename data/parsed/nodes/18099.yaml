      <p>“The basic P22 license is intended to accommodate personal use as in the course of everyday correspondence and document writing, or in the design of self-promotion pieces like business cards, newsletters and brochures. Other uses designated as “professional” or “commercial” may require additional licensing. Professional use is work performed by, not limited to, freelance designers, small design firms and corporate advertising firms that incorporate P22 fonts within a design for a client or self-promotion.”</p>
      <p>I take this to limit most commercial uses of the font. No such limits appear on the ITC agreement - at least that’s the way I took it. Would you take the above<!--
