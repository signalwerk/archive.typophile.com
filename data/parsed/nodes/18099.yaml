      <p>P22’s EULA is far less restrictive than Tankard’s or ITC’s.</p>
      <p>ITC’s actual EULA is difficult to discover: the only way I’ve found is to initiate a purchase, and scroll through the display in a ridiculously small frame. </p>
      <p>It restricts “embedding” of the font to “a static graphic image (for example, a “gif”) or an embedded electronic document...You may not embed Font Software in a Commercial Product without a separate written license from MTI, and you may not embed Font Software in an electronic document or data file for any reason other than your own Personal or Internal Business Use.” </p>
      <p>Modification isn’t allowed.</p>
