      <p>I wonder if you’re not getting into minute details of form too early out here. First of all it has to communicate a clear idea. I’m not sure it does with this concept.</p>
      <p>What I’d do would be to explore as many diverse ideas as possible, without spending too much time on finetuning forms. The formal details can be resolved once you feel confident about any of those routes.</p>
