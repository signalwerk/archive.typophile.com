      <p>Timo,</p>
      <p>The image below is just a 5 minute play about to see how basic it can be. It’s about what you get rid of, not what you keep. The more convoluted the concept becomes, the less successful the logo will be.</p>
      <p></p><div class="imageWrap"><img src="/files/oving_ideas_5567.gif"></div><p></p>
      <p>Satya: <cite>Myriad is a one of its kind, please don’t mess with it.<br>
      Use em properly and it will look awesome by default.</cite></p>
      <p>Don’t use any typeface in a default way when in a logo! As a bare minimum the spacing needs to be adjusted. There is no harm in modification of the forms as long as they end up looking like they belong together.</p>
      <p>Good luck</p>
