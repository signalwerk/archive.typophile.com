    <p>How do you like this one?</p>
    <p>It’s a logo for a freelance light engineer based in Germany. “Oving” is the guy’s name and “Lichttechnik” means “Light engineering”. For the type I used Myriad and then customised all letters except “v”. Please let me know how you like it and what could be improved. Cheers!</p>
    <p></p><div class="imageWrap"><img src="/files/logo_5377.png"></div><p></p>
