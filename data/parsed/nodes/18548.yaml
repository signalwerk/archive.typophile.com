      <p>I am looking for the font Pazlina Normal for a PC.  We had some graphic design done with the font on a MAC and would like to incorporate it into more every day use on our PCs. I am having some issues finding it for PC.</p>
      <p>Do you have any other suggestions as to where I might find this font?</p>
      <p>Thanks!</p>
