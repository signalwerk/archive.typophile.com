  - id: 112627
    user: 9356
    date: 2006-03-15T06:24:00
    date_raw: 15 Mar 2006 — 6:24am
    votes: null
    html: <p>I think that fonts with simple outlines rather than lots of cupping, curving, flanging and just off-vertical or off-horizontal lines work best. The old Monotype drawing office usually produced work like this. Bembo Book, built on the same principles, is also fine at 1200 dpi.</p>
  - id: 112639
    user: 108
    date: 2006-03-15T08:32:00
    date_raw: 15 Mar 2006 — 8:32am
    votes: null
    html: <p>I'd agree with George. I'll bet <a href="http://www.houseind.com/index.php?page=showfont&amp;id=171" rel="nofollow">Paperback</a> would maintain quite well on a printer like that. John Downer designed it using his faceting technique.</p>
