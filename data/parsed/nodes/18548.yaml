  html: |-
    <p>In your experience, which body text typefaces produce satisfactory results on a decent laser printer at 1200dpi and plain office paper?</p>
    <p>Palatino works well (obviously, so does TNR...)<br>
    So do Trump and Lexicon and Stone, but Dante MT gets lost.</p>
    <p>Have you had any good or bad experiences?</p>
