      <p>This is a very conservative list. It covers classes of type that it's useful to get familiarised with sooner rather than later, simply because of their ubiquity (Helvetica being a case in point - know your enemy).</p>
      <p>1. A Garamond<br>
      2. Bembo / Galliard<br>
      3. Palatino / Centaur<br>
      4. Univers / Frutiger<br>
      5. Futura<br>
      6. Gill Sans / Monotype grotesk<br>
      7. Helvetica (in all its many forms)<br>
      8. A Baskerville<br>
      9. A Bodoni<br>
      10. A Caslon</p>
      <p>Not very adventurous I know but once there's a framework on which to build your own tastes, this could then be applied to choosing less well known/more exotic fonts and keeping the independent type foundries going.</p>
      <p>*Sound of a can of worms being opened very sheepishly*</p>
