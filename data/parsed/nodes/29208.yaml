      <p>Having taught Type 101, I can tell you that all the elaborate, historical categories mentioned here, and Bringhurst, are way too much, especially for practical work.<br>
      History would be better taught as history, not in practice at the early stage.</p>
      <p>Although I scoffed at Helvetica, perhaps I was premature.<br>
      If you're teaching basic stuff like leading, paragraph style, size and line length, the depth of type choice mentioned above is not a major consideration, in fact it is dysfunctional.</p>
      <p>So I would say Helvetica, Futura, Bodoni and Garamond (for small caps, alternate figures) would do the job -- or, as Paul poiunts out, equivalent contemporary faces.</p>
      <p>Any "Perfect Set" would be for students in all years.</p>
