      <p><strong>Adobe Garamond, Adobe Caslon</strong> Can't get through life without these. If you're lazy just use Garamond, if you can't decide just use Caslon.<br>
      <strong>Akzidenz-Grotesk</strong> If one is going to learn about modern design, one might as well start with the original modern typeface. And it has the best super weight <strong>ever</strong>.<br>
      <strong>Helvetica</strong> Every designer needs to know how to use this one. Just not at less than 24 points.<br>
      <strong>Univers</strong> There probably isn't a better face for learning to use a big family.<br>
      <strong>Neutraface</strong> Futura's nice, but this updated derivative is a lot cooler. And it wasn't designed by a communist.<br>
      <strong>Meta</strong> Because designers should know how to use a font with a design that originated after 1960.<br>
      <strong>Memphis</strong> Because someone will want to you do something reminiscent of college football at some point.<br>
      <strong>Minion Pro</strong> Minion is great, it works so well in print and onscreen, and it saves paper.<br>
      <strong>Walbaum</strong> A high-contrast font that won't make you go blind. If designers keep staring at Baskerville and Bodoni on screen they'll all go blind and the world economy will collapse when the great unwashed start setting everything in Comic Sans and Times.</p>
