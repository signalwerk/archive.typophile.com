      <p>well if we're going there, i'd think that a Type 101 class should have <a href="/wiki/Elements%20of%20Typographic%20Style" class="freelinking" rel="nofollow">The Elements of Typographic Style</a> as required reading, and to not confuse the poor kids, students should probably follow his divisions which are:</p>
      <p>Renaissance (Venetian)<br>
      Baroque (Garalde)<br>
      Neoclassical (Transitional)<br>
      Romantic (Modern)<br>
      Realist (Grotesk/Clarendon/Pixel)<br>
      Geometric Modernist (Geometric Sans/Geometric Slab/Industrial)<br>
      Lyrical Modernist (Humanist Sans/Neohumanist Serif)<br>
      Postmodernist (Monospace)<br>
      Expressionist (Grunge/Distressed/Hand drawn/Script)</p>
      <p>I think this covers all the classical bases as well as your categories you propose. The important part would be to find a good balance of Text and Display fonts. I was just going with Dan's categories to show that there are new faces that cover the old ground in a fresh way. I should have brought up your article <a href="http://shinntype.com/Assets/Depts/Essays/PerfcSet.pdf" rel="nofollow"><em>The Perfect Set</em></a>. Wasn't this brought up recently in another thread?</p>
