      <p>Right on Paul.<br>
      A little history is essential, and I know the present day can be confusing, but no reason for educators to retreat to the safe shores of the distant past and stick their heads in the sand. </p>
      <p>Still, if you can only juggle with one ball, teaching novices how to use Helvetica is appropriate to your skill level.</p>
      <p>But don't you think those genres are somewhat ancient?<br>
      More pavane and gavotte than hip hop. Not to mention galliard.</p>
      <p>Quite frankly, for beginner level the distinction between Venetian, Garalde and Transitional may be elided, they're all old styles. </p>
      <p>So what about a selection from:<br>
      Grunge<br>
      Distressed<br>
      Pixel<br>
      Postmodern<br>
      Industrial<br>
      Monospace<br>
      Hand-drawn<br>
      Script</p>
      <p>That would certainly capture their fancy a bit more.</p>
