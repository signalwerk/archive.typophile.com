    html: "<p>i've thought about this a bit more and i think that the reason Bringhurst's classification system resontates with me is that it puts type into a larger context of historical art periods. When studying humanities in college it was interesting to see how the architecture, art, music, literature, &amp;c. all incorporated the same sensibilities, i can see in my mind how the teacher might have incorporated types into this scheme as well, but unfortunately this aspect of culture was left out! (what a travesty) Since my education is not in design, i've never had the privelage of sitting in any typography classes, but i can see that too many faces might overwhelm a young student trying to grasp the basics. Rather than Helvetica, I'll take Thomas' idea a bit further and say perhaps limit the students to 1 <a href=\"/wiki/superfamily\" class=\"freelinking\" rel=\"nofollow\">superfamily</a> such as <a href=\"/wiki/Thesis\" class=\"freelinking\" rel=\"nofollow\">Thesis</a>. If it were me, i might choose <a href=\"/wiki/Fedra\" class=\"freelinking\" rel=\"nofollow\">Fedra</a>, but maybe that's another sub-discussion we might have: Which superfamily might best serve students learning typography in an intro level class?</p>"
