    html: |-
      <p>Hi Thomas, it's an interesting question.</p>
      <p>Like Nick, having taught the local equivalent of Type 101 for some time now, I realise that my interests in teaching type history are at odds with a student requirement for the practicalities at beginner level. Although I recommend Bringhurst, Spiekermann <em>et al</em> on reading lists, most of what these authors have to say goes straight over the students' heads, so I must reaffirm what Nick and Paul say on this.</p>
      <p>A far better text at this level, IMHO, is Colin Banks and John Miles <a href="http://www.linotype.com/2305/pleasuresofdesign.html?PHPSESSID=cdfbc6c620ce6c3729a847e0d7b8ecf0" rel="nofollow"> Pleasures of Design</a> which has been revised and is on the Linotype site in their Font Lounge area. </p>
      <p>Although they list 8 categories of type style;<br>
      – Old Face<br>
      – Transitional<br>
      – Modern, or Didone<br>
      – Slab serif<br>
      – Sans serif<br>
      – Decorative and Display<br>
      – Script and Brush<br>
      – Blackletter<br>
      which basically follow the Vox-based/conservative lists offered by the early respondents to your post, they don't subdivide the old face,  sans serif or blackletter categories. Crucially, in the practical exercises they use only the simplest faces, a sans (possibly Univers), and a serif (possibly Melior) – anything else would be counterproductive. </p>
      <p>However I think it's important that the traditional Vox classification gets mentioned <em> before </em> the more recent schemes suggested by either Nick above or the FontShop online that 'capture their (student) fancy' – the issue here is that everyone needs to know the standard terms of reference, before they reinvent the categories to their own satisfaction.</p>
      <p>The assignment I teach requires students to research and come up with their own choices for showing examples of what these categories look like. And then layout the results in a 16 page booklet. Perhaps this is the 'killer reason' for using new, contemporary faces instead of the tired old standards, because (theoretically) it changes the learning mode to an active one.</p>
      <p>As for Futura, it really is <em>not</em> better known as Verlag, nor was it designed by a communist (not that that should be any reason to discriminate against the typeface anyway). Both of you should read Christopher Burke's excellent <a href="http://www.amazon.com/Paul-Renner-Typography-Christopher-Burke/dp/1568981589/sr=1-1/qid=1162687678/ref=pd_bbs_sr_1/102-2755155-9326530?ie=UTF8&amp;s=books" rel="nofollow">Paul Renner: The Art of Typography.</a></p>
      <p><em>What’s the difference between a Garalde and an Aldine?</em></p>
      <p>In case this hasn't become apparent from the other posts, loosely speaking an Aldine is a Venetian (or Humanist) type from the Aldine Press of Aldus Manutius. Therefore the older kind of Old Style faces, approximately pre-1520 and generally Italian. Garalde is a compound name belonging to Vox, formed from GARamond and ALDus and refers to the next historical development of the Old Style faces approximately post-1520 and generally French...</p>
      <p>The redsun timeline that Tiffany refers to above is just <em>not</em> accurate enough for me; I am fed up with students going there and then telling me they have found either a typeface or a category called 'gerald'! It also implies that the styles have discrete cut-off points in their development, which is patently untrue. Wish they'd update it.</p>
