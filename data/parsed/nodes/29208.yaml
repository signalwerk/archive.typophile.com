      <p>I think I posted this in the Indie fonts thread, but shouldn't a student just need the following?:</p>
      <p>A Venetian<br>
      An Aldine<br>
      A transitional<br>
      A modern<br>
      A grotesque sans<br>
      A slab/clarendon<br>
      A geometric sans<br>
      A humanist sans</p>
