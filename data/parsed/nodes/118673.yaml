    html: <p>I think it's probably Times Modern because of the time period and a lot of similar traits. Cole's article says that TimesModernEF was pulled from the market "due to a complaint from Times Newspaper Ltd. who claimed that the name was too close to Times Classic and Times Millennium."  Riccione would probably do the trick.</p>
