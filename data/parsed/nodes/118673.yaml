      <p>Closest digital I can find to this photolettering era creation is<br>
      Riccione Extra Bold with width compressed to 75 percent.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/RiccioneExtraBoldW75pctinUse_4831.png"></div><br>
      <a href="http://www.myfonts.com/fonts/ef-typeshop/riccione/" title="http://www.myfonts.com/fonts/ef-typeshop/riccione/">http://www.myfonts.com/fonts/ef-typeshop/riccione/</a><br>
      TypeShop’s Riccione is perhaps based on Modern Times Black by Lettergraphics International from 1969, but I might have misread a previous thread <a href="http://typophile.com/node/105826" title="http://typophile.com/node/105826">http://typophile.com/node/105826</a><br>
      For an interesting discussion See: The Other Times Modern by Fonts in Use <a href="http://fontsinuse.com/uses/3368/the-other-times-modern" title="http://fontsinuse.com/uses/3368/the-other-times-modern">http://fontsinuse.com/uses/3368/the-other-times-modern</a>. Note the reference to  “EF Times Modern”  which was mentioned by Bob.<br>
      Don<p></p>
