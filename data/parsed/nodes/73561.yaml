    <p>Hi All,</p>
    <p>Although I am neither a typographer or designer, I was asked to show my collection of unique fabric typography at TypeCon last week.<br>
    I have put together a blog with some examples of the collection for those that couldn't attend and I hope you enjoy seeing a taste of what I have</p>
    <p><a href="http://www.textiletrademarks.com" title="www.textiletrademarks.com">www.textiletrademarks.com</a></p>
    <p>I am very happy to give lectures, or share information with anyone who wants to learn more about what was the largest global branding in the world</p>
    <p>Best regards</p>
    <p>Adrian Wilson<br>
    Photographer<br>
    <a href="http://www.interiorphotography.net" title="www.interiorphotography.net">www.interiorphotography.net</a></p>
