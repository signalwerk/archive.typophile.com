      <p>DING! DING! DING! We have a winner!</p>
      <p>Thanks Renko! Mystery solved. </p>
      <p>I'm not sure why the attachment got removed, but I'll add it here again for the sake of completeness.</p>
      <p>As Eyehawk pointed out on the MyFont forum the N glyph has apparently been cut on the baseline from the original American Typewriter typeface and some additional stroke weight has been added.</p>
      <p>From Audio Pi LT:<br>
      <img src="http://typophile.com/files/NDR.png"></p>
      <p>From American Standard Typewriter:<br>
      <img src="http://origin.myfonts.net/114/fs/u/4d/649767b9f5356bfa81f46dfc1813a8.gif"></p>
      <p>Regards,<br>
      Mospeh</p>
