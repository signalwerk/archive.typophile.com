  html: |-
    <p>Hi All,</p>
    <p>While browsing through some wingdings today I ran across the following three letters. Each is stored as it's own glyph in the font file (Linotype Audio Pi LT Std). I think they're gorgeous, all the subtle detail on the serif. I wish I knew what it was!</p>
    <p>My first guess was maybe an old icon for Dolby Noise Reduction (DNR) but none that I found seemed to match these characters. </p>
    <p>Anybody know what these are for ?</p>
    <p>Anybody know who designed them ?</p>
    <p>Are these glyphs part of a complete typeface somewhere ?</p>
    <p>Any info much appreciated!<br>
    Moseph</p>
