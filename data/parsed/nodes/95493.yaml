      <p>There's a font called ITC Serif Gothic in my old Letraset catalogue, and it looks very similar.</p>
      <p>It is avialable here: <a href="http://myfonts.us/td-zXEHqJ" title="http://myfonts.us/td-zXEHqJ">http://myfonts.us/td-zXEHqJ</a></p>
      <p>.... but the digital equivalent doesn't seem to have the alternate 'a' and 'f,' as in the Letraset version. It also looks like the figure '1' has been doctored, but there could have been other versions around at the time of course.</p>
      <p>Not a conclusive answer, but it's somewhere to start.</p>
