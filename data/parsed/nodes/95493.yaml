      <p>I take your point, but the original Letraset version has the alternate 'e', and how can you tell from that low res image that there are no serifs? I personally think there are. Look carefully at the top of the  'V' and 'l' in Violin.</p>
      <p>The serifs are very slight and could be lost in a poor quality image. </p>
      <p>You may still disagree, so please let me know if you find a closer match.</p>
