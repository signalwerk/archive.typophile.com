    <p>Hello,</p>
    <p>I've lurked here for a looong time and finally decided to set-up my account. I'm looking for fonts that have round O's and "stiff" capitals as seen in the logo of <a href="http://www.fhoke.com" title="http://www.fhoke.com">http://www.fhoke.com</a>. </p><div class="imageWrap"><img src="http://typophile.com/files/logoFhoke_5531.gif"></div><p></p>
    <p>I've been scouring my small collection and MyFonts for a bit and I can't seem to find any. Suggestions? Thanks! FF </p>
    <p>P.S I know the correct term is not "stiff", what kind of font is that considered?</p>
