      <p>&gt; The same was also true for the new rupee symbol. I was just wondering why the Turkish lira was singled out for criticism.</p>
      <p>Yes, the new Rupee sign is also a tricky case. Well, the horse has left the barn … so what.</p>
      <p>&gt; If and when the euro crumbles I wonder if different European currencies will return to their old symbols or create new ones to differentiate between their pre and post-euro currencies …</p>
      <p>One never knows. If the UC stakeholders keep proceeding like now, I fear for the standard getting a kind of prisoner of circumstances. The independence from actual political influence is challenged. The encoding principles once heralded fall behind.<br>
      It was pure actionism. There was no need at all to ennoble this *design project of national pride* by hastily encoding it as “a character”. We could well have wait for some time to see this project mature. No one expects this char. being available in fonts for the next few months.<br>
      If I would want to implement the new Turkish Lira sign into a non-sans font, how on earth am I going to know how the rendering of the sign is meant to be? I’m just guessing: the proud Turks themselves have not the faintest idea. But this question is about nothing less than the very nature of the sign, if there is any nature at all, whatsoever.<br>
      We have encoded a silly piece of design simulation. If you take the matter of typographic signage serious, the whole action is a defiance of our trade. </p>
      <p>The introduction of the Euro char. was a different story, however.</p>
