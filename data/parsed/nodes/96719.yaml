      <p>&gt;I did explain my concerns already, in this forum. It’s reflected also here.</p>
      <p>"It is NOT a new character. (!) There is the Lira sign existing at codepoint 20A4"</p>
      <p>The same was also true for the new rupee symbol. I was just wondering why the Turkish lira was singled out for criticism. </p>
      <p>If and when the euro crumbles I wonder if different European currencies will return to their old symbols or create new ones to differentiate between their pre and post-euro currencies. Before the euro the use of Unicode was rare. Most people were using OS's and apps that relied on code pages - hence the "need" for folks to initially hack-encode the symbol in fonts. You could argue that Unicode's success has contributed to the proliferation of new symbols, and maybe the need to properly support the euro was the turning point?</p>
