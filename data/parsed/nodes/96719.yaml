      <p>@Si Daniels:<br>
      It's not anti-Turkish to hold the opinion that for the Unicode Consortium to make a new release of Unicode just to include one new currency symbol is in some way unbefitting.</p>
      <p>Myself, though, I don't entirely share the opinion: rather, I think there should be some streamlined procedure so that people can add support to new characters in their correct code positions immediately, while being Unicode compliant, but without the appearance of favoritism that this may have given.</p>
      <p>However, since that does involve modifying the Unicode standard, it's hard not to call it a new release. Maybe call it 6.1.0.1 instead of 6.2?</p>
      <p>The primary user of the Unicode Standard, after all, is not font designers, but the data processing community. They print checks, after all.</p>
