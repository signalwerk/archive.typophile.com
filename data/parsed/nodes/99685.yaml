      <p>The Microsoft Century Schoolbook might be what you're looking for.</p>
      <p><a href="http://www.microsoft.com/typography/fonts/family.aspx?FID=53" title="http://www.microsoft.com/typography/fonts/family.aspx?FID=53">http://www.microsoft.com/typography/fonts/family.aspx?FID=53</a></p>
      <p>Long ago &amp; far away, it came free with certain Microsoft products, but no more.</p>
      <p>IIRC, it is OpenType, ttf flavored, (but check before buying!) and I'd assume that to the extent MS Word supports OT features, it would support them in its own fonts...</p>
      <p>If you want Open Source, (nonrestrictive license), you'll have to do a lot of work on the TeX Gyre CS. As you say, it's pretty bad. Alternatively, though not "Schoolbook," SIL Charter may have the look you want.</p>
      <p>What the world could really use, Kent Lew, is a good Primer. (Think of Primer as the thinking man's Century Schoolbook. It was good enough for P.J. Conkwright to use for Princeton's Thoreau series.)</p>
