    html: |-
      <p>I've drawn up os figs for Charis, roman &amp; italic. It's open source. If you really want to use it, we can probably find a way to get them to you. </p>
      <p>All this predicated on your being able to copy the glyphs into your fonts and write the OT feature to call them (&amp; be able to compile) with DTL OTMaster Light. Never used that program.</p>
      <p>Oh, IIRC, I've got better ligatures, too. </p>
      <p>(I'd give you my Charis fonts, but I've dropped a lot of the characters -- Some because I just never need them, but most because I use FontLab Studio for compiling the OT features, and FontLab can't (currently) handle "mark" and "mkmk", which SIL used. So, I had to rewrite all the features as well, and added more. Some I'm sure MS Word won't implement, but that probably wouldn't hurt anything. You could have the fonts, but I can't afford to take time to support them.)</p>
      <p>FYI, in the days of photocomp, Linotype reduced the ligature set to just the fi and fl. When they re-released these fonts in PostScript, they didn't add any more ligatures for most fonts. The company's been sold several times since then; I've not seen any evidence the parent company wants to improve the old offerings.</p>
