    <p>I am looking for New Century Schoolbook as an OpenType version. It should include</p>
    <p>- ligatures<br>
    - old style numbers<br>
    - small caps</p>
    <p>Initially I went for the Tex-Gyre project. They offer a free and enhanced version of URW New Century Schoolbook (Tex-Gyre Schola). But... I can't really say what it is, but URW's NCS just looks "wrong". Maybe it's the character spacing? URW NCS looks extremely wide, compared to other versions of NCS like</p>
    <p>New Century Schoolbook from Linotype. Which looks really nice and just "right", but even though I have the OpenType version, ligatures and old style numbers seem not to work (I've used Word 2010). Or is it just my version? (got NCS LT via Folio 11 is installed on this machine).</p>
    <p>Which vendor has the best NCS?</p>
