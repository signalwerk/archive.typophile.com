      <p>As far as I know, no one of the available digital versions of Century Schoolbook features nor small caps neither old style figures (so it's not a matter of compatibility with MS Word, Peter). But I could be wrong. The only typeface related to Century Schoolbook with both os figures and small caps seems to be Mark Simonson's Grad, which has its own unique design features, by the way:</p>
