      <p>Thanks everyone. I investigated a little bit more.</p>
      <p>Indeed Nicola, none of the digital versions seem to have small caps or old style figures.</p>
      <p>The Microsoft (Monotype) Century Schoolbook that is bundled with e.g. Microsoft Office 2007 is not an OpenType version. It is a TrueType font, so of course there are none of the advanced OpenType features (like ligatures) available.</p>
      <p>I've checked the Linotype NCS I own with DTL OTMaster Light, and it does have ligatures for fi and fl. These will be actually replaced by Word 2010. But strangely there are no Ligatures for ff, ft, fl or combinations like fft and ffl. Does someone know, whether this is fixed in later versions of LT's NCS? Having proper ligatures would be at least something. </p>
      <p>But overall, it seems the only choice is to go either for Grad, or to stick with Tex-Gyre Schola (*shudder*). Or Charis SIL (but which has afaik no old style figure).</p>
