      <p>Yes, of course, Charis.</p>
      <p>The TeX-Gyre version of Century Schoolbook does have some terribly done os figs. Kindergarden level, or maybe not even that good. It also has small caps, can't remember how badly done they are.</p>
      <p>But the Original Poster also mentioned that ligatures don't work, and those should be in the Linotype font. They were in the Linotron 202 standard-format font, &amp; by in large, the PostScript versions offered by Linotype had all the glyphs of those older "digital-photocomp" fonts.</p>
