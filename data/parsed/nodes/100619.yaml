    html: |-
      <p>I've tried to focus my search on slab serifs with curved transition (<a class="freelinking external" href="http://www.myfonts.com/search/egyptienne/" rel="nofollow">Egyptienne</a>/<a class="freelinking external" href="http://www.myfonts.com/search/clarendon/fonts/" rel="nofollow">Clarendon</a>) with a varsity/college feeling. Here are some, matching only /P specifications, hoping there'd be at least one that could meet your expectations: <a class="freelinking external" href="http://www.myfonts.com/fonts/urw/egyptienne-2/" rel="nofollow">Egyptienne</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/urw/clarendon/" rel="nofollow">Clarendon</a> (MT version <a class="freelinking external" href="http://www.myfonts.com/fonts/mti/clarendon/" rel="nofollow">here</a>), <a class="freelinking external" href="http://www.myfonts.com/fonts/paratype/xenia/" rel="nofollow">Xenia</a> (the only one with straight-legged /R, more "varsity" to me), <a class="freelinking external" href="http://www.myfonts.com/fonts/fontmesa/gold-fever/" rel="nofollow">Gold Fever</a> (<a class="freelinking external" href="http://www.myfonts.com/search/bookman" rel="nofollow">Bookman</a> track I've decided not to follow because too far from varsity style to me)<br>
      The other option would be to start with any geometric slab serif of your choice and rework transitions for each letters you need. Here is what I've done starting from <a class="freelinking external" href="http://www.myfonts.com/fonts/mti/rockwell" rel="nofollow">Rockwell</a>, reworking serif transition and recreating /O and /C (may be /R leg would have need some tweaking).<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/princeton_4921.png"></div><p></p>
