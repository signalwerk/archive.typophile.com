      <p>Re Futura: What Andreas Stötzner said. It's very hard to use well for text; its uniform shapes don't exactly predetermine it to be reader-friendly.</p>
      <p>Humanist sans fonts do tend to read [more] nicely; my favorite sans for text would be Legato; and I can't help but think of Rotis (possibly the Semi-Sans)* – but will any of these click with Bodoni? I'm not sure. </p>
      <p>(* Even though that's hard to use well too [if for other reasons].)</p>
  - id: 437728
