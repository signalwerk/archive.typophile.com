    votes: null
    html: |-
      <p>I read a novel set in Futura once and the only things that stood out was the question mark. I've also seen Minion (text) paired with Didot (quite large display) and it worked like a charm even though the pair goes against the usual advice. An option to consider is using two or more optical sizes of Bodoni (ITC) or Didot (HF&amp;J). </p>
      <p>The obvious sans match for a modern is, IMO, a grotesque or a geometric, but they're rarely good for extended text. One face that comes to mind though is Grotext.</p>
