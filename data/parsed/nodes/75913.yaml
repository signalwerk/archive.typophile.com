      <p>@nina I have to agree, I don't think I'd set body copy with Futura! I'd prefer a sans as a foil to Bodoni. I've been looking around and quite like the look of Lucas De Groot's Taz III. It's not necessarily out of the question to use a serif, but thought it might clash with Bodoni rather than accompany it? What would you suggest?</p>
