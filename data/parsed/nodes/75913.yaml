    <p>Hi All,</p>
    <p>I'm working on a text book and wondered if anyone could suggest a decent body copy face? I'm drawing a blank here. Main page headings, standfirsts etc. will be set in Bodoni (caps for Headings and italicised for standfirsts); I've been playing around with Franklin Gothic at 9pt with 11pt leading as a suitable body face. I wondered if anyone could suggest anything slightly different to Franklin - legibility is paramount for this document as there's a lot of text. Ideally I'm looking for a face with a narrow measure without being condensed/compressed so as to maximise words on a line.</p>
    <p>Any ideas?</p>
    <p>Many thanks, Si</p>
