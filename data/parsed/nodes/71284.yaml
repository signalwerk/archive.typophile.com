      <p>Palatino isn’t web safe, and neither are these suggestions. </p>
      <p>Below are some CSS font stacks that you might want to consider. I don’t have time to go into all the specifics, but they should all give a relatively similar look in most cases. I have screenshots of the Cleartype rendering, but I’m not sure how well they work with Greyscale/B&amp;W rendering. About <a href="http://www.typophile.com/node/70933" title="Click to visit an external URL." class="freelink freelink-external freelink-internal">31%</a> (although the number is declining rapidly) sees Greyscale/B&amp;W rendering. </p>
      <p>I assume you’re designing on a Windows computer as you mentioned Palatino, so you could easily check the rendering yourself by changing the font smoothing settings.</p>
      <p>Web safe font stack suggestions:</p>
      <ul><li>font-family: Perpetua, Baskerville, "Times New Roman", "Nimbus Roman No9 L", serif;</li>
      <li>font-family: "Bookman Old Style", "URW Bookman L", Georgia, serif;</li>
      <li>font-family: Baskerville, "Baskerville Old Face", "Times New Roman", "Nimbus Roman No9 L", serif; <em>(only regular weight and no italics)</em></li>
      <li>font-family: Garamond, "Hoefler Text", serif; <em>(different x-height at same sizes)</em></li>
      </ul><p>Your other option is to make use of the @font-face tag and rent or buy a font from <a href="http://typekit.com/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Typekit</a> (varying quality and rendering), <a href="http://Fontfont" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://Fontfont</a> (not cross browser yet, unless you also rent from Typekit) or someone else – a web search would give you more options. <a href="http://code.google.com/intl/no/apis/webfonts/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Google</a> also offers the Android fonts for free, and they are hinted for screen use.</p>
      <p>By the way, your safest bet if you stick with Palatino is to code your CSS like this:</p>
      <ul><li>font-family: "Palatino Linotype", "Book Antiqua", "URW Palladio L", serif;</li>
      </ul><p>Palatino Linotype is covered with Windows and all MS Office versions. URW Palladio L is bundled with Ghostscript and has a 91% Linux coverage and Book Antiqua is bundled with MS Office 04 on OSX. Mac users might not have MS Office, so you’re not covered all the way. What Palatino Linotype does offer is decent rendering, as it has been hinted extensively.</p>
