    <p>Hey, new to typophile, but really enjoying it. I originally came here for more selection of fonts.</p>
    <p>Anyway, I'm in the business of web design, and I use the font "Palatino Linotype" alot, just love the serif feel to it and that it's a system font so it's compatible with everyone that happens to come across my site.</p>
    <p>However, I think that I overuse it too much, and need some alternatives. Have anything in mind, EXCEPT "Times New Roman". Thanks!</p>
