      <p>Hmm, okay, for all you Flash people:  How does sIFR compare to using Flash document featuring:</p>
      <p>- Dynamic text<br>
      - Embedded characters<br>
      - Configured as selectable<br>
      - Configured to be rendered as HTML</p>
      <p>I just used this method to create text on a webpage that behaves much like regular text.  Apparently Google (and others, including Yahoo!) are now indexing .swf files.</p>
