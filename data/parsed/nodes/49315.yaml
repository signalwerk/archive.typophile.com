  html: |-
    <p>Did some searches, Im actually baffled as to which search terms to use...</p>
    <p>How would I embed unconventional fonts into a web page, much like the headings on this forum are?  I want to use various Opentype fonts in web page that are selectable, and spiderable by search engines like Google.  Even if the viewer doesnt have the font installed on their system, I want them to be able to see it.  Is this possible?</p>
