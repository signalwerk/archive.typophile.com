    html: |-
      <p>SiFR <em>is</em> flash, generated by a javascript-solution that works fine for headlines. There is also image-based generated solutions with php etc. but this is also just working for headlines and shorter texts.<br>
      For longer texts I don't think there is no other way to go than flash, if you want a bit more typographic and anti-aliasing control than in html based text. To get text in flash avalible for search engines, the best way I think is to add the text as a comment in the html document that holds the flash file.</p>
