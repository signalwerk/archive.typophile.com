      <p>SiFR is an amazing hack. But it is a hack. There are serious performance issues for doing large amounts of text with it. Even some fo the co-inventors of SiFR have said publicly that they just see it as a stop-gap until something more reasonable is implemented.</p>
      <p>@Go: Yes, it's all automatic, when it is supported.</p>
      <p>T</p>
