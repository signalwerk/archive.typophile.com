      <p>SiFR is the only generally usable way today that works with most browsers.</p>
      <p>There are movements afoot to allow HTML/CSS to either refer to regular desktop fonts on web servers (supported by Safari and perhaps Chrome) or to EOT fonts on web servers (supported by Internet Explorer).</p>
