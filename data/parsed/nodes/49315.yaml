    html: |-
      <p>SiFR is a very smart tool. Your html source-code is not flash but just xhtml:</p>
      <p>From the sIFR website:<br>
      <cite><br>
      Your (X)HTML document starts off with its standard styles. Then, once sIFR determines it will run, your html and body tags are classed with “.sIFR-hasFlash”. This is done in order to accomplish two things: 1) to hide your browser text as the method is running, and 2) to create “decoy” styles for the text you are replacing. Decoy styles are never seen by the user. They are meant to adjust the space the browser text takes up before the measurement and replacement occurs.<br>
      </cite><br>
      <a href="http://www.mikeindustries.com/blog/sifr/" title="http://www.mikeindustries.com/blog/sifr/">http://www.mikeindustries.com/blog/sifr/</a></p>
      <p>So, there is no need for the search-engine to index flashfiles...</p>
      <p>~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~<br>
      <a href="http://www.sprachkasse.de/blog" title="http://www.sprachkasse.de/blog">http://www.sprachkasse.de/blog</a><br>
      ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~</p>
