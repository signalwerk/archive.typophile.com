    votes: null
    html: |-
      <p>This is the workflow for kern2volt.</p>
      <p>1. Do your kerning in FontLab, using the RTL preview setting in the kern window.</p>
      <p>2. Generate a .ttf font containing a) an oldstyle flat (non-OTL) kern table and b) post table glyph names that will match your VOLT project glyph names. [Note that if you have used class kerning in FontLab you will need to 'flatten' it, i.e. expand the class kerning to individual pairs before generating the font with the kern table.</p>
      <p>3. Open the font in VOLT and import the glyph names from the post table (this is under the Import/Glyph Data menu. Save the font, and then close VOLT.</p>
      <p>4. Open a command line window (cmd.exe on Windows), navigate to the directory where your font and kern2volt are located (alternatively, if you know how, you can set the Windows path variables so that kern2volt can be run from any directory). Run kern2volt on the font being sure to use the -rtl option:</p>
      <p><code>kern2volt -rtl myfont.ttf</code></p>
      <p>5. kern2volt will produce a .vtl format VOLT GPOS lookup file containing your kerning. Note that kern2volt will have compressed your expanded kerning into ad hoc groups for maximum efficiency based on shared kerning values.</p>
      <p>6. At this stage you generally want to generate a new .ttf font from FontLab *without* the oldstyle kern table. Open this new font in VOLT and import the .vtl generated by kern2volt. Assign this kerning lookup to the 'kern' feature for the Arabic script/language tags.</p>
      <p><strong>Note:</strong> if you have kerning for Arabic numerals as well as Arabic letters, you will need two separate FontLab kerning sources, one for RTL kerning and one for LTR kerning (obviously also true if you have a multiscript font that contains e.g. Latin glyphs as well as Arabic). Follow the above steps for each kerning set, running the LTR kerning through kern2volt without the -rtl option.</p>
