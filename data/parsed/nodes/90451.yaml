    <p>Hi,<br>
    I am working on Arabic font using Fontlab, I just want to know how to Kerning arabic letters/characters in font lab? Anyone knows can help me please? I have checked some well designed arabic fonts through FontLab and observer something like this "pos uni0632 uni0622 &lt;-60 0 -60 0&gt;;"</p>
    <p>what is the numbers refer to? and how I can generating and kerning arabic letters in fontlab??</p>
    <p>Look forward to your help</p>
    <p>thanks</p>
