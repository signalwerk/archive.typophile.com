    html: |-
      <p>You can use FontLab to kern a Right-To-Left (RTL) font, but FontLab will not export the kerning in the proper RTL format.</p>
      <p>The "pos uni0632 uni0622 &lt;-60 0 -60 0&gt;;" you're seeing is the correct kern pair format for RTL scripts.<br>
      For LTR scripts the format is "pos A V &lt;0 0 -60 0&gt;;" which can be simplified to "pos A V -60;".</p>
      <p>The &lt;A B C D&gt; values are:<br>
      -- C horizontal advanced width adjustment<br>
      -- A horizontal position adjustment<br>
      -- B and D are for vertical adjustments</p>
