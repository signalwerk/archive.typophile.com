    html: |-
      <p>I don't think you can generate a finished Arabic font in FontLab. You will need to use the latest AFDK or VOLT. What you are seeing with "pos uni0632 uni0622 &lt;-60 0 -60 0&gt;;" is FontLabs interpretation of kern lookups for right to left kerning.</p>
      <p>Try reading the guiding notes for VOLT and finish your font using it.</p>
