  html: <p>Hi. <br>Im choosing typeface for recent work and found that the style of HTF Gotham / HI Chalet is the right way for me. Gotham Medium and Chalet New-York 1960 are in right weight and form with geometrical feel and look. Im tryin' to find variations of its style and need help of the board. <br> <br>As i read here (<a href="http://houseind.com/house.php?kit=CHALET-FO&amp;sub=special" target="_blank">http://houseind.com/house.php?kit=CHALET-FO&amp;sub=special</a>) Neue Haas Grotesque have to be close to Chalet, but i cant find any Haas Grotesque from modern typefoundries or maybe it is fully replaced with Helvetica? <br> <br>Does Akzidenz-Grotesk a good choise in this story? <br>Please help. <br> <br>Vladimir Losinsky <br> <br>ps <br>Sorry for my English <br></p>
