    html: |-
      <p>If things are not aligning vertically at lower resolution, the usual cause is missing or incorrect alignment zones. These are horizontal regions placed (usually) near the baseline, cap height, x-height, ascender height and descender height (negative, below the baseline). Typically, the zones should enclose any points above or below these places that should align at low resolution. For example, if you have an alignment zone near the baseline, any points that are off the baseline but inside the alignment zone will "snap" to the baseline at lower resolutions. An alignment zone works sort of like the "snap to" distance in drawing programs.</p>
      <p>You can create alignment zones manually or have FontLab create them for you (using the little green gem icon button) in the Font Info dialog box under Hinting Settings.</p>
