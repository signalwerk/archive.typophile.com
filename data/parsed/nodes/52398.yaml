    <p>Hi all, this is my first post here.</p>
    <p>I'm quite a newbie on font creation. I always wanted to create a font, but only recently I got the chance. I am trying to make a font to match my company's logo, so that I can use it in its corporate identity (I didn't use a font for the logo, the characters are crafted "by hand", so it was a great opportunity to finally design a font of my own, based on the logo's characters).</p>
    <p>I have designed all the glyphs in Illustrator CS3, I inserted them in FontLab after reading lots of tutorials on the matter, and then exported the font in .otf format.<br>
    The otf format looked terrible on small sizes on screen (I'm using Windows Vista, if has anything to do with it), so I tried TrueType (.ttf). That looked much better, but in sizes less than 12pt, the characters look like they have different heights (and they don't!). In print the font looks very nice, and in sizes more than 12pt, it looks nice on the screen as well.<br>
    Any ideas about that? I read something about hinting here, but I'm not sure its related to the issue I'm having. </p>
    <p>Another issue: I added some ligatures and they work fine in applications like Notepad or MS Word (strangely enough, judging by the issues that I read other people have with MS Word). However, when I type a text with that font in Illustrator CS3 and that text contains a ligature, I get the message "Can't finish previewing. There is not enough memory" and I can't switch to the normal preview until I delete the part of the text that contains the ligature. Any ideas about that?</p>
    <p>Thanks in advance!!</p>
    <p>PS: Sorry for any english mistakes, its not my native language.</p>
