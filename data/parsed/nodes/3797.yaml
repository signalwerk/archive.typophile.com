    html: <p> I'm going to make a lot of people angry here. I've raised this point in other forums, and caused feeding frenzies among typographic moralists. <br> <br>What is so bad about working from someone elses' work? Why are we so protective of our territory? Why is it OK to work from dead people's work? <br> <br>Type design is an iterative process that builds on and interperets other peoples' work. Why slow the iterations to a minimum of 70 years? I have often modified other people's fonts for various projects. What is so villianous about making it into a font? The new font could be iterated in the same way, and the community would be enriched. <br> <br>In reality I know what the answer is. There are two motivations that are almost universal. Money and recognition. I am questioning the value of those motivations. <br> <br>I am proposing that the value of the aestetics, diversity and flavor in the community are more valuable. Why shouldn't there be 5000 variations of Helvetica, some wonderful and some awful? Why shouldn't type have individual flavor? <br> <br>I have been a fan folk music for a long time. The value of folk music (real folk music, the stuff done by people the don't own copyrights) is that it is shared. No one person is responsible for the flavor and the beauty. The songs are passed around, and everyone takes them and makes them their own. <br> <br>What if students everywhere were encouraged to take the oulines of type faces and modify them? It's true that the font landfills would pile up, but typographic flowers would rise from the compost and work their way into common usage, to then be recycled and grow new faces. <br> <br>Obviously, some faces have more value than others. Cheap copies are not valuable. Inteligent iteration is. The conversation here should be whether frothy has value, not whether it was derived from a living designers' font. </p>
