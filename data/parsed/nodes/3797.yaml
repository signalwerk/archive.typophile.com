  - id: 28620
    user: 1014
    date: 2002-11-22T10:38:00
    date_raw: 22 Nov 2002 — 10:38am
    votes: null
    html: "<p> For those who missed it, the third installment of the Parkinson/Downer interview at Phil's Fonts lends insight into the Janiszewski disqualification. <br> <br>Downer: <br>&gt; I actually take enormous pride in tracking down offenders. Theft is unacceptable. I am firm in this belief. Yet, as unacceptable as font theft is, it is doubly unacceptable when it's committed by a person who knows better. Type designers know that font theft is reprehensible, so any type designer who steals from another stoops as low as a type designer can stoop. There is simply nobody lower to be found in the craft of type design. <br> <br>&gt;I don't know of a case in which a highly accomplished and widely-respected type designer has stolen a digital font from a colleague, but I know of several cases in which an inferior type designer, whose faces are only second-rate at best, has been in possession of fonts that were obtained illicitly. <br> <br>&gt;I do not regard type thieves as colleagues or brethren. They are not peers. They are parasites. <br> <br>the other parts of the interview are fascinating, too, with bonus insight into the world of water polo. <br> <br>bj :] </p>"
  - id: 28621
    user: 1215
    date: 2002-11-23T10:00:00
    date_raw: 23 Nov 2002 — 10:00am
    votes: null
    html: <p>Christian -- <br> <br>For me there is a moral difference between work that is based on or inspired by another's and work which is built directly upon another's.  <br> <br>It's one thing to get a bunch of friends together and jam out a Pete Seeger tune, but it's another thing altogether to take a recording of Pete Seeger's, scrub out the vocal track, and lay your own over the accompaniment. And I don't just mean legally, copyright-wise. I mean creatively -- and perhaps even morally (depending upon what you do with the subsequent recording). <br> <br>In the same way, it's one thing to create an alphabet design which is inspired by, or even based on, the general shapes of Stone Sans, for instance. But it's another thing altogether to open up the outlines and crank them through a filter or two, move a couple of points, or whatever. <br> <br>(Don't get me wrong, I bear no ill-will toward Janiszewski; I accept his explanation and respect his apology. I still don't understand what the Bukva:raz jury was thinking, however, regardless of whether they recognized the origins or not.) <br> <br>There are a lot of things that are shared in type design -- there are at least 26 of them, plus numerals, punctuation, etc. There's no copyright on the way letters are stressed, on how serifs are formed, on a single-story 'g' or a two-story 'g'. Those are the melodies -- now go play them your own way. Claude Garamond sang 'em one way, Baskerville sang 'em another, Matthew Carter sings 'em his own way. <br> <br>If you want to play a Pete Seeger tune, you look at the notes and you play them your way. Maybe you aspire to play like Pete Seeger so you listen real close to his recording, over and over, and you pick out the banjo solo for yourself until you feel like you got it -- fine. But Pete Seeger is Pete Seeger; who are you? Put yourself back into it. Make it your own. <br> <br>Don't take the Seeger recording, pass it through a midi converter, load it into your computer, and start tweaking it digitally, and then use the output to control your midi banjo or whatever. What's the point of that? <br> <br>So, if you're inspired by Carter's Miller, for instance, and you want to create your own Miller-inspired alphabet, then sit down and draw your own. Sure, look at Miller real close, over and over, until you think you got Miller in your blood. But then draw your own interpretation of the tune, put your whole self into it, make it your very own. What are your own thoughts about Scotch moderns? What do <i>you</i> think about how an 'a' should look, how it should work? How do <i>you</i> think the leg of a modern 'R' should be formed? <br> <br>Don't just scan in a specimen and autotrace it. Don't just open the font in Fog and start pushing points around. Where's that going to get you? <br> <br>Again, I'm not really talking about mere legality, I'm talking about true creativity.  <br> <br>There's a moral and creative difference between Copying and Interpreting. Sometimes the line between the two may seem hard to distinguish, but it's there; and you've got to find it. True progress in any craft comes through reinterpreting, not copying. You've got to modify the <i>idea</i> behind the thing, not the thing itself.  <br> <br>-- K. <br> <br>P.S. When I say "you," I don't necessarily mean you specifically, of course; I mean all of us in general.</p>
