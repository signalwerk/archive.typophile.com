  - id: 28624
    user: 1215
    date: 2002-11-24T07:03:00
    date_raw: 24 Nov 2002 — 7:03am
    votes: null
    html: "<p><i>&gt;difference between drawing replicas of an existing font with a pencil and drawing them with a computer are merely technological.</i> <br> <br>Yes, it is. The point is to not make replicas. Make something original. Maybe it's based on something that went before (honestly, what isn't?) but the goal is to make something new and different, not a replica. <br> <br><i>&gt;if carol twombly can \"revive\" an old face, why can't i \"revive\" hers without getting sued?</i> <br> <br>Twombly could revive the capitals from the Trajan column because they were essentially dead and didn't exist in any useable form. The typeface Trajan isn't the same thing as the stonecut letters from the column; they're <i>based</i> on those letterforms. Look closely: they're really not the same. They're her interpretation of those letterforms in a modern, digital idiom. You can't revive her typeface because it isn't dead. But you can make your own interpretation of the classic roman capitals. Designers have been interpreting those forms forever. Go ahead, look at the original inscriptional letters, look at Twombly's interpretation, look at Goudy's, look at Catich's. Then draw your own. You can't be sued for that.  <br> <br>Just don't open up the Trajan font in Fog and start from there. Because you can get sued for that. <br> <br><i>&gt;i think people should get credit, money, and whatever else from the work they do, no matter what it is, but i also think some information should remain free.</i> <br> <br>That is precisely the intention behind the idea of copyright. (The implementation into laws is not always perfect, but the intention is sound.) The point is to secure to a creator for a limited time the rights and opportunities to benefit from their hard work and creativity. And a key concept of copyright is that <b>ideas cannot be owned</b>, just the actual manifestation of ideas as things. <b>Ideas are free.</b> But creations aren't. At least not for a while. The duration is finite, though (despite how Disney would like it otherwise). After a while even the thing becomes public domain -- the invention, the poem, the artwork, whatever. After the creator has had the opportunity to benefit from his creativity (usually after he's dead and his kids are grown up -- that's where the 75 years comes from) then we can do what we want with it, basically. <br> <br><i>&gt;i think he's talking about legit creativity and new ideas coming from old ones.</i> <br> <br>Hey, I'm right with you guys on this. The problem with the current litigious climate is that everyone has become confused about what's okay and what isn't. There's nothing wrong with creating new ideas out of old ones (or even yesterday's leftover ones). Just make sure you're building on ideas, not things. <br> <br>We all stand on the shoulders of giants; just don't cut them off at the knees to do it. <br> <br><i>&gt;i think the line that divides inspiration from imitation is too fine too draw.</i> <br> <br>It may be a fine line, it may even be a sketchy line, but it's a sad day when we don't bother to draw it. You have to keep looking for it. A lot of times, the difference is like that definition of pornography -- you know it when you see it. You've got to be able to feel the difference between inspiration and imitation in your gut. And to do that, you have to keep recalibrating your moral compass. That's why I appreciate this conversation and the questioning. That's how we discover where the line is. <br> <br><i>&gt;isn't mrs. eaves based on something? isn't helvetica?</i> <br> <br>Mrs. Eaves is based on the idea of Baskerville. If you compare the two, the debt of inspiration is obvious. But it's equally obvious that Zuzana didn't copy or imitate Baskerville. She internalized the idea of Baskerville, she added her own ideas, she even contradicted Baskerville, and she came up with something that was rather unique -- despite the fact that she calls it a \"revival.\" And actually, she's right: a true revival isn't a copy, or even a translation (which is what some so-called revivals are). A good <i>revival</i> actually breathes new life into an idea, brings something new to the table. <br> <br>So, if you find an idea that you like and you think you might be able to build on it, then go for it. But you should be sure to bring something new to the table. Otherwise you're not building, you're just rehashing. <br> <br>(BTW, Helvetica was based on Akzidenz Grotesque. But I have no idea *what* Meidinger could have been thinking. ;-) <br> <br>-- K.</p>"
