    html: "<p> &gt; zuzana licko would be a billionaire if everyone came clean <br> <br>Although I think Licko deserves a lot more cash then she's getting, this is a myth: if you were somehow able to prevent people from using illegal fonts, your sales would go up only modestly; most people would simply not use the stuff. <br> <br>&gt; You can't revive her typeface because it isn't dead. <br> <br>But isn't the requirement of death too limiting? I mean, is it healthy to encourage people to circle around their pray like vultures, waiting for them to keel over? <br> <br>&gt; A good revival actually breathes new life into an idea <br> <br>What a wonderful expression! <br>But revivals on the high creative level of Mrs Eaves are extremely rare. <br> <br>hhp </p>"
  - id: 28627
    user: 1215
    date: 2002-11-25T04:56:00
    date_raw: 25 Nov 2002 — 4:56am
    votes: null
    html: "<p><i>&gt;But isn't the requirement of death too limiting?</i> <br> <br>I was being literal: you can't *revive* something that's not *dead.* That doesn't mean you can't develop an idea. And you don't have to wait for an idea to be dead to build on it. Just be sure to evolve it and don't just copy it or rehash it. If you're inspired by Trajan to take classic roman capitals to a whole new level, then great, go for it. But don't just redraw Trajan with a few superficial tweaks here or there and call it a \"revival.\" <br> <br><i>&gt;But revivals on the high creative level of Mrs Eaves are extremely rare.</i> <br> <br>Agreed. But there's nothing wrong with rarity. It keeps the bar set high.  <br> <br>-- K.</p>"
