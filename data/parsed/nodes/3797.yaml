    html: <p> &gt;isn't mrs. eaves based on something? isn't helvetica? <br> <br>rhetorical question. <br> <br>i think we're all in basic agreement. straight up copying is for chickens. maybe the key thing is who profits from what. for example, if someone does some wacky thing with helvetica, maybe it should be given away rather than sold. that way no one is making money from another's work. <br> <br>i agree that we should draw the line, i just don't know who should be drawing it. <br> <br>didn't twombly also do a baskerville or caslon? i think it was caslon. trajan was definitely dead, but caslon? i'm sure her caslon wasn't exactly the same as the original she worked from, but how original can it be and still be caslon? it seems like i'm picking on her, but i'm not. where did she draw the line? ms. twombly, if you're out there, clue me in. </p>
