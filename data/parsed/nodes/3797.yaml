    html: "<p> &gt;Cheap copies are not valuable. Inteligent iteration is. <br> <br>that's the essence of what christian is saying. i think. the difference between drawing replicas of an existing font with a pencil and drawing them with a computer are merely technological. one person's recreation or reinterpretation of a font can be as valuable and individual as the original. if carol twombly can \"revive\" an old face, why can't i \"revive\" hers without getting sued? i think people should get credit, money, and whatever else from the work they do, no matter what it is, but i also think some information should remain free. that little opinion still needs to be fleshed out, so don't ask me what it means. anyway, i think i understand what christian is saying, and i agree. i don't think he's talking about theft, like those guys who make those discount font discs for 12 dollars. i think he's talking about legit creativity and new ideas coming from old ones. remember that song that came out in 98 or 99... symphony of life or something. anyway, they had sampled the rolling stones' ruby tuesday for the song. you could have fooled me. it sounded like a new song to me. on the other hand, puff daddy, or pee diddy or whatever, took a led zeppelin song and just went \"uh, uh\" over the top of it. the idea behind both songs is essentialy the same: take part of an old song and make a new one. the difference is that the good song made the element it's own, and the bad song's element happened to be the entire song (man, puff daddy sucks). so while i agree that type designers have the right to profit from their work (zuzana licko would be a billionaire if everyone came clean), i think the line that divides inspiration from imitation is too fine too draw. isn't mrs. eaves based on something? isn't helvetica? </p>"
