    votes: null
    html: <p> Christian, the altruism you suggest is worth further consideration but I don't think it pans out in a marketplace. <br> <br>If you strip away copyright protection or 'ownability' you strip away the ability of a professional to make a living at the craft. And by taking away that ability you cut off the talent pool at the knees. I think that would be a drastic setback to the body of work available, much more than everybody guarding their work. <br> <br>(Take that Karl Marx. Or take that Linux?) <br> <br>I'm not going to suggest you're off base Christian and don't let this detract from our friendship. I like that you're asking some of these questions. Indeed some of that altruism is the reason we pursue Typophile. I highly <br>respect your work as very original and fresh. Much of your stuff has the stroke of classicism and even better, utility. Would you give it away freely in hopes that it would come back to you better than you left it? If so, try that experiment yourself, with your own work. <br> <br>But all the type designers I know who are making a living at it (and, please, I'm not one of them) have a difficult enough time earning a living with the current meager protections in place. <br> <br>(Finally, please don't misunderstand me. I'm not suggesting type designers are solely motivated by money. If so, they wouldn't be in this field.) </p>
