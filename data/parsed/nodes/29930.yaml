      <p>For further digging, I went through the McGrew book of American Metal Typefaces, and the Jaspert Encyclopaedia of Type Faces. Also the Solotype Catalog, and several of the Dover books by Dan Solo. Couldn’t find this set of initials in any of them.</p>
      <p>- Mike Yanega</p>
