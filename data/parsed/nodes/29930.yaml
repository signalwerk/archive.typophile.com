    html: |-
      <p>I looked in three books I had that have information about Rogers’ career, and a set of initials like these was not mentioned or shown in any of the books. Some examples of initials he used were shown, and in one case they were Cloister Initials, by Frederic Goudy.</p>
      <p>The type for the World Bible was a version of Goudy Newstyle that Rogers did in collaboration with Sol Hess.</p>
      <p>Since the World Bible was basically set in a version of one of Goudy’s typefaces, I looked in a book about Goudy’s works to see if these initials were also his, but they were not shown in the collection that was supposed to show all of Goudy’s type designs.</p>
      <p>- Mike Yanega</p>
