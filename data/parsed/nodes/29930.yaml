  html: |-
    <p>I’m in the process of digitizing this type (see attached). I know <a href="wiki/Bruce Rogers" class="wiki">Bruce Rogers</a> used these letters as chapter initials in the World Bible of 1949, but I also recently discovered that he used them on the title page of “The Wind in the Willows in 1940.” If he designed these letters, it was most certainly not for the World Bible as I previously thought. Also, this type could have been an available font that he simply used for these jobs.</p>
    <p>Anyone know anything about this?</p>
