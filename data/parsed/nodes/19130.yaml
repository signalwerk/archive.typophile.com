      <p>Thanks. I'll check out Caecilia.<br>
      I suspect that you are right about the big x-height. The settings I have seen of the font that were made from cold metal rather than Lino, Mono, photo, and digital all are visually smaller, but you can never determine if that was from the face on the body or through the addition of cast-on or laid in line space.<br>
      To some extent my question is rhetorical. The various images of the Futura plate proofs shown in Burke's <em>Paul Renner: The Art of Typography</em> indicate that all characters with descenders were designed with two lengths that I assume made the font conform with the German baseline standard (shorter descenders) and the Anglo-American baseline standard (longer descenders). If you rescale the longer descender "American" Futura based on the ascenders and descenders (rather than cap height and ascender), you end up with much smaller characters on the body and a x-height identical to Kabel. In other words, a font in proportion and size that is much more like old-style romans than sans serif grotesques.<br>
      So, I guess I am trying to figure out the source of the size change that produces the error shown in the initial image.</p>
      <p>I followed up on the measurements and came up with the following image showing Futura's dimensions. The second image is how the anomoly shows up in InDesign, The third image is a composite of all the patterns for lower-case p shown in Burke on page 93. </p><div class="imageWrap"><img src="http://typophile.com/files/Futura body measurements.jpg"></div><div class="imageWrap"><img src="http://typophile.com/files/FuturaSolidInDesign.jpg"></div><div class="imageWrap"><img src="http://typophile.com/files/DescenderLengths.jpg"></div><p></p>
