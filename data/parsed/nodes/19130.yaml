      <p>Thanks. I read the article. I know that line space is distinct from body size—I'm old enough to have been taught cold- and hot-metal composition where I manually adjusted linespace. I am also aware of UPM size and its calculation. What I cannot figure out here is why in unleaded setting, which is the way the font was originally created by the type designer(s), a font's descender would collide with an ascender on the next line, e.g. have a upm of more than 1,000 in a 1,000 unit system.<br>
      Can I assume that Futura has been incorrectly sized by Abobe or Lino (the sources in this case) or that changing operating systems have produced this anomoly?</p>
