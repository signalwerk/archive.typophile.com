      <p>In short your issue hear appears to be with the leadding of your type.  Leading is the distance between baselines. This term is orignated from the traditional form of typesetting where led stripps would be used to create distance between each block of type (Figure A). When each character is crafted it is placed inside a box that is refered to as the type block.  When the designer places the type in the box he uses a standard base line to determine where the text visually sits this is uniform through each type block, this line is known as the baseline.  This box that they use to "house" the letter is refered to as having "set-width" and "point size," being the width and height, respectively (Figure A).  The baseline in most typesetting programs will use the baseline to determine where to place the type respectively to the other characters. A 10 point font with a 15 point ledding is going to be very loose and open when a 10 point font with a 10 point ledding will feel very tight. But all in all all type is different and it just needs to look right.</p>
      <p><a href="http://www.gcomollo.com/type/figure_a.jpg" title="http://www.gcomollo.com/type/figure_a.jpg">http://www.gcomollo.com/type/figure_a.jpg</a> &lt;-figure a</p>
