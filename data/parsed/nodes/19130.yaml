      <p>Note that the linespacing is independent of the body size, i.e. the size of the actual glyphs. The type size in points always relates to the font UPM size, i.e. the standard design space in units. Most fonts have the design space (UPM size) of 1000 units. This means that when the type is set at 10 points, the 1000 units of the font's design are 10 points large. In other words, at 10 points, each font unit is 0.01 points large. This means that if your uppercase H is 700 units high, at 10 point, your uppercase H will be exactly 7 points high. This means that if you change the font UPM size from 1000 to 2000 without rescaling the glyphs, the letters at 10 point (or any other size) will shrink by half. </p>
      <p>The linespacing is controlled by a number of different parameters in the font. They're discussed at <a href="http://groups.msn.com/fontlab/tipsandtricks.msnw?action=get_message&amp;mview=0&amp;ID_Message=4356" title="http://groups.msn.com/fontlab/tipsandtricks.msnw?action=get_message&amp;mview=0&amp;ID_Message=4356">http://groups.msn.com/fontlab/tipsandtricks.msnw?action=get_message&amp;mvie...</a> </p>
      <p>A.</p>
