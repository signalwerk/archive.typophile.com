      <p>Are you sure this is a font Yves? Those E arms don’t all meet the stems the same way. I think they repeated “STORY”, but other places the letters seem to vary. I searched Part 12 and 14 of the Script Guide, and didn’t find a match, but some of the <a class="freelinking-external" href="http://www.myfonts.com/fonts/fontfont/ff-childs-play/">FF Child’s Play</a> fonts were similar. Stuart’s Spaghetti Western (FontDiner)had similar shapes, but with serifs.</p>
      <p>- Mike Yanega</p>
