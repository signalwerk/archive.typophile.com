    <p>In Quark (oh how I loved it for all those years) to track type by a single unit I could click the tracking arrow while holding the option key. I have tried every key combination with no luck. Surely Adobe doesn’t want me to do it manually. Any ideas?<br>
    Thanks</p>
    <p>Hank</p>
