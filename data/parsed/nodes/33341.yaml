    html: |-
      <p>Well here is what I have found that sort of works:</p>
      <p>In Preferences/Units &amp; Increments/Keyboard Increments you can adjust the amount of keyboard KERNING by 1/1000 of an em. </p>
      <p>But in reality this preference increment works for for BOTH Kerning and Tracking using the Option and Arrow Keys.</p>
      <p>I wonder why they choose not to implement the option-mouse click to do the same thing.</p>
