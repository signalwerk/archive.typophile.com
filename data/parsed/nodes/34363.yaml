      <p>Like all things in type the details of the face ( style, weight, serifs etc.), and your intent will come into the equations as well. The shape of the Question mark &amp; Exclam are important too. </p>
      <p>Not that it is important, I tend to like the feeling of x-height ish alignment better. But I don't read it very much so my opinion is only worth just so much. Some ideas about why I feel that ways include: </p>
      <p>- It might be that lowering the mark before a capital let's me see the the next letter faster/easier. eg - the mark gets in the way of my reading less. (If true this would be a good reason or an endorsement )</p>
      <p>- It might be that a lowered x-height ish alignment has a better 'cue value'. Or put another way it may be that I can recognise the ¡ or ¿ faster when they take that alignment.  (If true this would be a good reason or an endorsement )</p>
      <p>- It feels more even more 'different' than an H height alignment &amp; I like the exotic quality ( not an endoresement or a negative ) </p>
      <p>None of this is more important than using your own Eyes. Find what works best for the face &amp; the reader.</p>
    html_clean: |-
