  html: "<p>A question to our Spanish language typographers: where vertically should exclamdown and questiondown (i.e., ¡¿) be positioned? I've seen examples with the characters essentially on the baseline, and I've seen examples with the characters shifted down, though never as far as the level of decenders.</p>"
