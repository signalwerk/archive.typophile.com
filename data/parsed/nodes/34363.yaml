      <p><em>You’re a type freak, not a target user.</em></p>
      <p>Sure, spotting typos is learned, but so are such simple activities as picking berries or lice eggs.</p>
      <p>Not every text is as simple as a book page. Legal and government documents with their hierarchy of numbered paragraphs and sub-sections (and the Bible) are texts where page-context is important in reading. I'm guessing that not all saccadic scans follow the bouncing ball, and a brief internet search of scientific literature reveals that the "foraging" nature of saccadic eye movements has been documented.</p>
      <p>The presence of an opening question/exclamation mark in some languages and not others suggests the complexity of the issue. How is it that English readers are able to start reading a long question with the final mark well in the distance? Are there sufficient grammatical cues in the opening words, or do we "catch" the question mark in "the corner of the eye" in a foraging saccade?</p>
