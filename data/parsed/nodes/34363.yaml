      <p>Eben and Kent, thanks so much for your thoughtful and articulate observations!</p>
      <p>Eben said... <em>I am not utterly sold on the idea that there is a ‘convention’ yet...</em></p>
      <p>Kent said... <em>What these examples do show is that the x-aligned questiondown does not violate any general cultural acceptance.</em></p>
      <p>I need to expand a little on my earlier comments... I had some schooling in Argentina and some in the States... It is in Argentine grade schools that I was taught to vertically dip the upside-down exclamation point and question mark in my handwriting... After a while it becomes second nature and you don't even think about it. Of course handwriting is not the same as typography, but they are closely related, no?  :-)</p>
      <p><em>Both of Ricardo’s examples are set in Adobe Garamond, so they don’t provide much variety of evidence.</em></p>
      <p>Thanks for catching that, Kent! As tired as I was two nights ago, picking out books, and as tired as I was last night, scanning and posting examples, I can't believe I didn't even notice that either of them were set in Garamond to begin with! </p>
      <p>Now, I don't have that many books in Spanish with me right now; I left a lot of them in Buenos Aires when I moved to New York. But even if I had them all here, I suspect that a lot of the fiction titles would also be set in Garamond... While I was working in Buenos Aires during the 90s, there was a pretty big economic recession in progress, and I know that most book publishers could not afford to spend a lot of money on cover design and illustration... I doubt that they would have been able to invest in many typefaces, either... (I could be very wrong about this, though. It would be good to hear from some other Argentine designers, to see what they say.)</p>
      <p>Kent also said... <em>I would guess that, in these cases, the position of the questiondown is more a matter of the typeface/font design, than any typesetting convention...</em> and <em>...presumably, the designers of these books gave some consideration to what the questiondown looked like before settling on Adobe Garamond. (Or not.)</em></p>
      <p>Very nicely put -- maybe they did, maybe they didn't.</p>
      <p>I'll be posting some display face examples next, and they may just add to the confusion!</p>
