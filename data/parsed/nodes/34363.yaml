      <p>Both of Ricardo's examples are set in Adobe Garamond, so they don't provide much variety of evidence. I would guess that, in these cases, the position of the questiondown is more a matter of the typeface/font design, than any typesetting convention. Presumably, however, Adobe and Slimbach did some surveying and gave some consideration to the standards that they've adopted for their Originals series. And, presumably, the designers of these books gave some consideration to what the questiondown looked like before settling on Adobe Garamond. (Or not.)</p>
      <p>What these examples do show is that the x-aligned questiondown does not violate any general cultural acceptance. </p>
      <p>The best perspective, however, will still be provided by a native Spanish-speaking typographer or type designer who is steeped in his/her own tradition.</p>
      <p>I would hypothesize that historically (meaning handset metal) the questiondown was originally just an inverted question mark, and so it's position relative to the baseline would depend upon the proportions of the font at hand. (Similarly, the earliest opening quote was an inverted comma, and so the alignment of opening quotation marks sometimes varied from that of closing quotes/apostrophes.)</p>
      <p>Relatively longer descenders (like in a Garamond) would yield a top alignment closer to the x-height. Relatively shorter descenders would yield a questiondown that aligns higher. </p>
      <p>-- K.</p>
