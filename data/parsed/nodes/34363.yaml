      <p>I think the design of an individual typeface cannot be completely hostage to convention / tradition any more than it can afford to ignore them. Sometimes it's a great idea to break a rule. Not often. The only way to know is to look; and then weigh the consequences for yourself.</p>
      <p>So it could be that those with the H height are being somehow culturally insensitive or something but  - I can't quite sign up for that because I am not utterly sold on the idea that there is a 'convention' yet. Partly I get this from looking around the font universe. </p>
      <p>Looking at News Gothic the Bitstream version uses the H height. The Linotype NewsGothic uses the x. These seem to be true house-wide ( mostly ). Freight uses the H. Bello, &amp; Feijoa the x. Tiptoe &amp; Omnes the H. Amalia, &amp; Fedra the x. Parry &amp; Sansa Slab the H. Candy Script ( and all of Ale Paul's others) use the x more or less. Eduardo's fonts ( emtype ) all seem to use the x.</p>
      <p>It also seems to me that the heavier the face is, and the more geared to display work the face is, the more an H height alignment seems reasonable. The spirit of the type might suggest what is right too. A slab Egyptian or a modernist face 's 'raison d'être' might be most compatible with an H height aligned '¿'.  </p>
      <p>Still, Ricardo, thanks for posting the link to Malena. And your example is exactly the kind of thing that looks pleasant/natural to my foreign eyes; naive as they are.</p>
      <p>I also agree that hearing from further from Ricardo, Ale Paul, Eduardo Manso, &amp; Miguel Hernández would be far more useful than the meagre theory &amp; observations I have offered.</p>
      <p>Still, since that's all I have I will go on a little further. </p>
      <p>It seems to me that the design of the ¡ ¿ ? &amp; ! probably aught to be done differently if you intend a heavy Spanish/Catalan use. In addition to certain alignments being easier to kern for; or looking better; ( or insert your concern here )- certain forms probably work better when they are spun around than others. Maybe softer hooks?  Does anybody create a different shape for their '¿' vs. '?' ? It seems like that might be a very good idea as well. I should check to see  if that is already being done actually... Maybe these are silly ideas. What do you all think? Any examples?</p>
    html_clean: |-
      <p>I think the design of an individual typeface cannot be completely hostage to convention / tradition any more than it can afford to ignore them. Sometimes it's a great idea to break a rule. Not often. The only way to know is to look; and then weigh the consequences for yourself.</p>
      <p>So it could be that those with the H height are being somehow culturally insensitive or something but  - I can't quite sign up for that because I am not utterly sold on the idea that there is a 'convention' yet. Partly I get this from looking around the font universe. </p>
      <p>Looking at News Gothic the Bitstream version uses the H height. The Linotype NewsGothic uses the x. These seem to be true house-wide ( mostly ). Freight uses the H. Bello, &amp; Feijoa the x. Tiptoe &amp; Omnes the H. Amalia, &amp; Fedra the x. Parry &amp; Sansa Slab the H. Candy Script ( and all of Ale Paul's others) use the x more or less. Eduardo's fonts ( emtype ) all seem to use the x.</p>
      <p>It also seems to me that the heavier the face is, and the more geared to display work the face is, the more an H height alignment seems reasonable. The spirit of the type might suggest what is right too. A slab Egyptian or a modernist face 's 'raison d'être' might be most compatible with an H height aligned '¿'.  </p>
      <p>Still, Ricardo, thanks for posting the link to Malena. And your example is exactly the kind of thing that looks pleasant/natural to my foreign eyes; naive as they are.</p>
      <p>I also agree that hearing from further from Ricardo, Ale Paul, Eduardo Manso, &amp; Miguel Hernández would be far more useful than the meagre theory &amp; observations I have offered.</p>
      <p>Still, since that's all I have I will go on a little further. </p>
      <p>It seems to me that the design of the ¡ ¿ ? &amp; ! probably aught to be done differently if you intend a heavy Spanish/Catalan use. In addition to certain alignments being easier to kern for; or looking better; ( or insert your concern here )- certain forms probably work better when they are spun around than others. Maybe softer hooks?  Does anybody create a different shape for their '¿' vs. '?' ? It seems like that might be a very good idea as well. I should check to see  if that is already being done actually... Maybe these are silly ideas. What do you all think? Any examples?</p>
