      <p>&gt; Is immersion therefore primarily interpretive?</p>
      <p>I'm not sure what you mean.<br>
      What I'm getting at is that during immersion we don't care much<br>
      about consistency of alignment and other such conscious frills.</p>
      <p>&gt; foraging saccades</p>
      <p>Errant saccades break immersion.</p>
      <p>A good example here is when you start to read a question but only realize it's a question when you see the mark at the end, often resulting in a regression just to revisit what's been previously read. This is in fact why opening question marks are so useful. I wouldn't mind seeing them ported over to English! Or even better, do what Armenian does: allow question marks directly on the vowel(s) in question, so to speak.  :-)</p>
      <p>On the other hand, a reader can -and does- go in and out of immersion,<br>
      so there certainly can/should not be such a thing as a "pure" text face.</p>
      <p>hhp</p>
