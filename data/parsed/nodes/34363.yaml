      <p>Eben, I was just saying the way it is. This is what I was taught whenever I had Argentine schooling, and what I see in most of the books I have in Spanish, if they are set in Spanish-speaking countries.</p>
      <p><em>The inverted symbols are usually followed by a cap.</em></p>
      <p>Well, if they are at the beginning of a sentence, yes, they would be followed by a cap. But a question or exclamation can begin mid-sentence, thus:</p>
      <p><strong>Hrant, ¿qué opinas de esta fuente?</strong></p>
      <p><strong>Hace calor, ¡quiero un helado!</strong></p>
      <p>These upside down symbols act as visual cues, to let a reader know when to change intonation, much as the accents (or tildes, as they are known in Español), let you know where the stress falls in a word -- but that is a whole 'nother subject.  :-)</p>
