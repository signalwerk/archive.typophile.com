      <p>These next two examples are from the book <em>Del Diseño</em>, by Yves Zimmermann, a graphic designer from Barcelona. This volume was published by Editorial Gustavo Gili, of Spain, in 1998. (Again, there is no colophon explaining who did the typesetting or which faces were used -- usually, books published in Spanish-speaking countries simply have a note at the end stating the printer's name, how many copies were printed, and the date. Sometimes the designer of the cover will be mentioned on the copyrights page.)</p>
