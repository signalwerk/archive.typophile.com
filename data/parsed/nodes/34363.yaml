      <p><em>it uses lowered exclamdowns despite the text is in all caps,</em></p>
      <p>Lowered relative to what?! -- relative to the capitals that immediately follow, yes, but in relaton to the text as a whole, which wanders considerably from the baseline, no -- and that is logical, when one considers that the exclam down always prefigures by the final exclamup, and in so doing establishes a relationship with every character in the journey to the end of the sentence, and must harmonize with them all. </p>
      <p><em>the little spaces after ¡ and before ! </em></p>
      <p>The exclams' spacing too should be contextual -- needed for an all-cap setting, and more so for sans than serif. Memo to OT developers: alternate exclam glyphs for "case" feature should have wider sidebearing.</p>
