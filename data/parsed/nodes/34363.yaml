      <p>R.C. -- <cite>Some (most?) typefaces have them aligned at the ascender by default, which is also wrong.</cite></p>
      <p>H.P. -- <cite>1) The inverted symbols are usually followed by a cap.</cite></p>
      <p>Hello Mr Cordoba, <cite>how</cite> wrong is this? I made the same observation as Mr Papazian, and for this reason -- deliberately -- chose the position between baseline and H-height. Another issue is that an x-height-aligned questiondown may require quite a few kerning pairs.<br>
      But seeing '¡Hola, Ricardo!' above (exclamdown aligned with uppercase), I could as well argue that descending exclamdown and questiondown are easier to recognize. Hm.</p>
