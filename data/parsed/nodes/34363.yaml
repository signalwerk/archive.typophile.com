      <p>Here are three examples from a children's magazine, Billiken -- I briefly (very briefly!) worked there as a layout artist in 1992, and this was before they switched over to Macintosh production of the mechanicals. So they had typesetters doing phototypesetting in another part of the building.</p>
      <p>In the first sample we have an all-caps Futura headline in which the exclam-down is slightly shifted below the baseline... wheras in the U&amp;lc sentence within the yellow word balloon, we again have Futura, but the exclam-down is aligned at the x-height.</p>
      <p>In the second example the exclam-downs are lined up with the caps in an all-caps subhead, but in the third example the exclam-down is once again shifted slighty down, in spite of the all-caps headline...</p>
      <p>My only guess is that in this case, in which all of the magazine's headlines were set in Futura, the variations in the vertical position of the exclam-down and question-down depended on the knowledge/care/obsessiveness of each individual typesetter at the plant... I never got to meet any of them, so I really don't know. But Kent's earlier observation certainly seems to apply here.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/display_02_4777.jpg"></div><p></p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/display_03_4818.jpg"></div><p></p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/display_04_3734.jpg"></div><p></p>
