    <p>The Medium’s design copyright is dated 1988. There is a lot more recent Times New Roman cut, <em><a href="http://www.ascenderfonts.com/font/times-new-roman-seven.aspx" class="link-external">Seven</a></em>, optically optimised but different in design from both the Semi-Bold and the Medium; its glyph shapes are more faithful to the letter-forms of the original <a href="http://www.ascenderfonts.com/font/times-new-roman-regular.aspx" class="link-external">Times New Roman</a> (Series 327) than Semi-Bold’s. The Seven’s design copyright is dated 1988 too… There was also Series 610, cut in 6½ size in 1959 ‘for the exclusive use of the Oxford University Press’ but that’s another story in its entirety.</p></dl>
