    <p></p><div class="imageWrap"><img src="http://typophile.com/files/TNR_Medium_5911.gif"></div><br>
    What’s the story behind Times New Roman <em><a href="http://www.ascenderfonts.com/font/times-new-roman-medium.aspx" rel="nofollow">Medium</a></em>? How recent is this addition to the TNR family? What was its purpose?<br>
    <dl>It is a well-known fact that Times <em><a href="http://www.ascenderfonts.com/font/times-new-roman-semibold.aspx" rel="nofollow">Semi-Bold</a></em> (Series 421) was developed by Monotype Corporation in 7-pt. size, at the request of CUP, for a Cambridge edition of the Bible; the year was 1936.</dl><p></p>
    <p>The Medium’s design copyright is dated 1988. There is a lot more recent Times New Roman cut, <em><a href="http://www.ascenderfonts.com/font/times-new-roman-seven.aspx" rel="nofollow">Seven</a></em>, optically optimised but different in design from both the Semi-Bold and the Medium; its glyph shapes are more faithful to the letter-forms of the original <a href="http://www.ascenderfonts.com/font/times-new-roman-regular.aspx" rel="nofollow">Times New Roman</a> (Series 327) than Semi-Bold’s. The Seven’s design copyright is dated 1988 too… There was also Series 610, cut in 6½ size in 1959 ‘for the exclusive use of the Oxford University Press’ but that’s another story in its entirety.
    </p>
