      <p><em>"I think it’s not cut into stone, it’s three-dimensional metal letters fixed to the stone (however that’s done ...)"</em></p>
      <p>Yes, of course, but I assumed that the process involved making casts of engraved letters (reversed). In the link Christopher has above, one of the replies is from a stonecutter from Wales who talks eloquently about what is required to make engraved lettering. I believed that making the originals for these cast letters would involve similar constraints and choices.</p>
      <p> - Mike Yanega</p>
