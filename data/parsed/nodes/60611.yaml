      <p>yes, those are letters out of metal with that emboss effect.</p>
      <p>I need to find a similar font, because my family needs to add another name to the gravestone. (don't know about other countries, but it's quite common to share a grave for a hole family in Germany)<br>
      When my Grandfather passed away ten years ago, the stonemason didn't really match the fonts so my grandfathers name looks different to those to names. Now we need another name and we want to avoid another mismatch of fonts.</p>
      <p>I guess I have to talk to the stonemason, what he thinks about that. I really want to know, if those are letters forged by hand or if you can by this alphabet from a catalog.</p>
      <p>Here's the left side of the gravestone with the mismatching font.<br><img src="/sites/default/files/old-images/grabstein2_5495.jpg"></p>
