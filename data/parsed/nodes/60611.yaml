      <p>Lettering on gravestones was all done by hand in those days. In fact a few font designers learned their skill cutting letters in stone (Matthew Carter and Michael Harvey are two that I think have that background). The irregularities you noticed are for that reason. It was a very skilled craft.</p>
      <p>Can I ask why you want to find a similar font? Close will have to be good enough because I suspect many stonecutters evolved their own alphabets that were adapted from existing (or invented) typefaces to make them suitable for the medium they worked in.</p>
      <p>- Mike Yanega</p>
