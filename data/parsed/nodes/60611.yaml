    <p>Here's my ancestors gravestone. We need to find the same font now. It looks definitely condensed but I had no luck finding it in the FontBook. The uneven E and S gave me the thought that it's custom made. But certainly some Font created before 1953.<br>
    Any Ideas?</p>
