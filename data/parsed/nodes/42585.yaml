      <p>&gt;I’m making editable pdf-files and it would be nice if they could be opened in every computer without changes in font (pc to mac).</p>
      <p>Why not embed the fonts? Providing they are set to 'editable embedding' you're fine. Most Microsoft supplied fonts and Adobe Originals are set this way - other vendors will license you editable embedding fonts for a small additional fee. </p>
      <p>Cheers, Si</p>
