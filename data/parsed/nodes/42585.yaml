  html: |-
    <p>Hello!<br>
    Where can I find the most reliable and up-to-date source for information in the web about the fonts mentioned in the subject?<br>
    Which default fonts are used, 99% guarantee, in all windows versions AND in all the mac os versions?</p>
    <p>I'm making editable pdf-files and it would be nice if they could be opened in every computer without changes in font (pc to mac).</p>
    <p>Thanks!</p>
