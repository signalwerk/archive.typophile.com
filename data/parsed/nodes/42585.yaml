    html: |-
      <p><cite>Wow, Macs get way better default typefaces.</cite></p>
      <p>I've found they also get a waaay better search function. On my new iMac, the little magnifying glass in the upper right corner, as best I can make out, searches filenames, subject headings, the contents of documents and e-mail, images, .pdf files, and gives you a definition from the dictionary with results in about the same time it would take to start a search in WIndows. This feature is kick-butt and I don't remember seeing anyone mention it. This has been pretty startling for me.</p>
