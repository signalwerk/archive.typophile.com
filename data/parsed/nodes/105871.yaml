    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Diablo3worldmap_4849.jpg"></div><p></p>
    <p>This is an image of the Diablo 3 World Map "Sanctuary" I've had a hard time trying to identify it. I've used many online tools to try and identify it and no luck. Letters that stand out to me are the W,V,T, and U. I wasn't sure how to classify it. It looks part script part serif. Please help me identify what font it is.</p>
    <div class="field field-type-text field-field-solved">
          <div class="field-label">Font:&nbsp;</div>
        <div class="field-items">
                <div class="field-item odd">
                        Vinque        </div>
            </div>
    </div>
