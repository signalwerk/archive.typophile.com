    html: "<p> After 1 month of fasting and praying I've found <br>the source of the mystery OCR face. It's OCRK <br>MediumSquare by Joe Kral of Test Pilot Collective.  <br>TPC also sells (or sold) his OCRJ family - also <br>available in 6 weights - but they seem to be in <br>limbo since the fall of Makambo.com. <br> <br>Funny thing: I met Mr. Kral at TypeCon last week. <br>I'll send him this thread and we'll see what's up. </p>"
