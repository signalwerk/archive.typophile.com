    html: <p>hello typophiles, <br> <br>thanks stephen for the email. <br> <br>The Citibank font is a custom version of OCRK Bold Square. There's only a few changes from the regular font. We're working on getting a shopping cart system set up for TPC. I think we're also gonna put our fonts up on myfonts.com too. They should be up soon... <br> <br><a href="http://www.testpilotcollective.com" target="_top">http://www.testpilotcollective.com</a> <br> <br>thanks, joe kral</p>
