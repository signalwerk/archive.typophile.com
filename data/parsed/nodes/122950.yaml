    html: |-
      <p>Having 2 different versions of your logo is usually not a good idea, but it's your decision. Create both versions at the same time and make sure the small version is readable in tiny sizes. </p>
      <p>Keep in mind that you don't always control the size of your logo. If you contribute to a local charity event, your logo might appear (along with others) in a tiny size on their printed materials.  This happened to one of my clients (I didn't design the logo) and it was illegible.</p>
      <p>You'll also need black-and-white versions. They aren't needed very often these days, but are useful for items distributed by photocopies, faxes, etc.</p>
    html_clean: |-
