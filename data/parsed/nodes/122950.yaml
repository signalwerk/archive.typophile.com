    html: |-
      <p>I agree completely with James. It's entirely too complicated and does not scale well at all.</p>
      <p>A logo should be an easily apprehended symbol. It should not be something that you need to inspect to understand or absorb. Look at every well known logo that you can think of, that stands out as strong and effective, and you'll see an iconic quality.</p>
      <p>The specific symbols you incorporate are also a bit mystifying, such as the umbrella and the "tile" in the forefront, which is not recognizable as anything at all until you've puzzled out that it's a printed page. Together it seems like a random collection of  "stuff we print", but requires too much work on the viewer's part to come to that conclusion.</p>
      <p>The bolder type certainly works better. I would also make it so that the logotype design is not dependent on the inclusion of  "Print, Signage, and Corporate Merchandise"  as that is more of tagline, and again at small scale it's going to be rendered illegible.</p>
    html_clean: |-
