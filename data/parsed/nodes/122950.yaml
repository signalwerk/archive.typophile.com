      <p>Sorry, but I don't think it works well as a logo. Far too many elements, and when reduced to a small size (which logos often are) it becomes illegible.</p>
      <p><img src="/sites/default/files/old-images/combined_5762.jpg"></p>
      <p>My suggestion would be to greatly simplify it, have one image instead of multiple images (perhaps stacking them would suggest multiple signs without actually showing them), and perhaps break the long name into 2 lines which would allow you to make the type larger. And I wouldn't make the small tag line part of the logo itself.  (Also I'm not sure what the red sign with 3 horizontal lines means, but perhaps that image is well known in the UK.)</p>
      <p>Certainly you can show multiple signs in an advertisement, but don't try to do that in the logo itself.</p>
