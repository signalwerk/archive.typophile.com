    html: |-
      <p>Yep.</p>
      <p>Here’s how that would look as an OpenType feature:</p>
      <p>feature kern {<br>
         pos f_l i -1;<br>
      } kern;</p>
      <p>Couldn’t be simpler! Nice looking forms, too, Eric.</p>
      <p>c</p>
