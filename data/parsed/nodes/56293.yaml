      <p>This may be a bit off topic... It is rare lately that I write any thing with a pen or pencil. Even mundane notes, recipes, grocery lists are typed, so that I can save them in my computer without wasting paper. Sometimes, I need hard copy, such as the grocery list, so I might take the information with me. The side effect is that most of what I write is typeset. The zeitgeist of the near future may make paper even less necessary. I do not yet have a way to easily transfer text to my telephone, although many people do. </p>
      <p>It seems that a child today will transition to this medium much faster than I did; probably in elementary school. </p>
      <p><cite>Manipulating things via indirect controls, such as using a computer, is of secondary importance and something that, developmentally, follows from the first and can’t be a substitute for it.</cite></p>
      <p>I'm not sure that dragging a stick across a page is that fundamentally different than pressing a button which causes the line to appear. Have we tried simply teaching a child without handwriting? Would it be a disaster?</p>
