      <p>When children are young (like my niece) its not a matter of forcing the alfabet into them. They WANT to learn, they imitate letters even if they don't know their meaning yet. The get it wrong the first time, but quickly learn to get better. And the speed at which they learn and absorb things is amazing! So not learning handwriting to me is definately wrong! It's they drilling and the testing that's the problem, not the handwriting. Each kid has it's own pace to learn things, and are better in some things or  worse in others. This should be taken into account when teaching them. They aren't harddrives, for chrissakes! </p>
      <p>I cannot prove anything but I think it is essential to learn proper handwriting, because it trains the brain in a unique way (just like drawing does in it's own way). It's not just a matter of being able to decipher glyphs on a screen. Typing is also different than writing, not better or worse but different. I have nothing against teaching kids with modern tools, but this doesn't disqualify old methods. It's not a case of either/or but of and/and.</p>
