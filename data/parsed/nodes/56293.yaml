      <p>Well, it's editorial so it's meant to stir the pot. Handwriting is essential, of course...it's a foundation skill set for us to learn the alphabet and to read.</p>
      <p>That said, as a parent of young kids, there is some arguments for not depending on it so much. Kids are definitely typing much younger than they ever were before.</p>
      <p>Our 7 year old has atrocious handwriting. Part of that is due to switching schools where they were mixing handwriting methods. Part of that is likely genetic. ;0) But put him in front of the computer, and he can type just fine. </p>
      <p>So, I agree in that as soon as handwriting becomes the hurdle between the subject matter and the student absorbing it, it's time to allow for alternatives.</p>
