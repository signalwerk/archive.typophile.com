      <p>Graham, something else that's possible is to purge the Latin alphabet (or really any writing system) of anachronistic flaws (for example the modularity of b/d/p/q*), while keeping it firmly decipherable to existing readers - in effect gently reforming the structures "under the radar" of the reader. One might be tempted to think that people are free to do this at the typeface design level (which is better than nothing - certainly much better than regurgitating the "hand" mantras), but what I'm talking about entails a move into a more formal realm, arising from a concerted analysis and its application (my old Alphabet Reform shtick).</p>
      <p>* Those who uphold chirography while striking down grid-based "constructed" design conveniently ignore that the hand imposes a grid of its own - just not a Cartesian one! Not that grid-based constructed design has much merit mind you.</p>
