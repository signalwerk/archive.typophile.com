      We're in the middle of a paradigm/generation shift IMHO. Getting back to type design (or design in general), I personally find it much easier to produce good design, smooth curves &amp;c. on screen than with a pen on paper. On the other hand, many of my colleagues still believe there is some sort of brain—hand expressway. Both views coexist – the medial landscape *is* shifting.<br>
