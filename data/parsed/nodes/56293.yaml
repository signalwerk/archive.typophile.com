      <p>Actually I didn't mean to over-emphasize digital creation. Letterforms that are made by arranging pebbles on a beach for example can be superior to handwriting in certain ways. The point isn't to find some ideal method, but to see the flaws in every method, and not fetishize any of them. Especially useful is seeing the flaws in a method that oppressively crushes out everything else.</p>
      <p>Developing fine motors skills can be done without creating and fostering misleading illusions of functionality; teaching kids to make letters by expanding skeletons without immediately warning them that when it comes to reading skeletons are irrelevant is a disservice to society. And cognitive development need not be impeded by cozy anachronisms - there are many ways to get kids (and adults) to think without perpetuating lies.</p>
      <p>BTW, I don't disdain handwriting. I just think it's headed the way of cuneiform writing. One thing I do disdain however is ideological lassitude.</p>
      <p>&gt; How would you do this Hrant?</p>
      <p>You might want to get a copy of "Graphic Design &amp; Reading" (G Swanson, ed.) where my "Improving the Tool" essay can be found. The essay was also published (in English and Spanish) in an issue of tipoGrafica.</p>
      <p>hhp</p>
