      <p>I agree with typerror except I think we're already there almost, I think it's importance will come down to things like playing board games vs video games, reading a book vs watching a movie.  It'll be one of those interesting facets about something that somehow in an elite crowd might make them seem "more intellectual" but not much else.</p>
      <p>On the other hand, as a child of the computer age, and having done school projects on computer from third grade on (hard to do handwriting journals on the computer :) ), I find quickly drawing diagrams, taking non-textual notes and other sorts of things nearly impossible on the computer, at least not at the speed needed to keep up in class or a meeting.  So barring some new fancy program, I expect to see handwriting live on as a very very niche use.</p>
      <p><em>«El futuro es una línea tan fina que apenas nos damos cuenta de pintarla nosotros mismos». (La Luz Oscura, por Javier Guerrero)</em></p>
