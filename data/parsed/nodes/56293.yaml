      <p>I think handwriting is a very important part of our development as a child (or even as adults). I don't think it's a matter of needing it or not. It also teaches a young brain abstract thinking, hand-eye coördination, etc. I can't really explain it very well in English, but I think you get my point.</p>
      <p>I can't imagine why someone would <em>not</em> want to learn how to write well. Just because the 'need' for it is becoming a less important factor? I think that's a pretty weak argument. You also don't 'need' to learn how to play the piano, but alot of people do it anyway.</p>
      <p>I can remember I was really proud when I learned how to write somwhat readable. My first school used to teach a non-italic non-connected type of handwriting, when I switched schools the new school tought a connected-italic-like writing method, and I loved it! Now I could write in two different ways, how marvelous! This is also what sparked my interest in typography and type design.</p>
