      <p><em>"The problem isn’t handwriting, the problem is schools, teachers and things like state assessment standards."</em></p>
      <p>But that doesn't rule out the question of the respective importance that should be attributed to learning handwriting, and other methods of producing letters. I see, and respect, the point that learning which way round to draw a "G" has beneficial effects besides actually learning about lettershapes, but shouldn't education also be about preparing kids for the world they live in? Meaning, get them in touch with the tools of the time as well.</p>
      <p>For what it's worth, I learned to write (and read) with my mum's typewriter when I was about four. I don't think this harmed my understanding of words and communication at all. Quite the opposite, actually. "Look, Ma, I can press these keys here in a different order and it makes a new word!"</p>
      <p>That said, I'm not sure the idea of trying to immediately and completely abolish handwriting is fruitful, or practicable today (though it might be soon). I'm thinking a small dose of handwriting will remain in our lives as a tool next to other tools for a while; at least as long as we don't have good enough digital tools to enable us to note down say a phone number quickly, handwriting will remain useful*. – But definitely, teach kids to type!</p>
      <p>* And maybe voice recognition will/can be just that. But accessibility factors in here as well; not everyone will be able to afford fancy tools when they could use pen and paper.</p>
