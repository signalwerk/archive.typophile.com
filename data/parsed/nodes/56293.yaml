      <p>Nina: <em>Getting back to type design (or design in general), I personally find it much easier to produce good design, smooth curves &amp;c. on screen than with a pen on paper.</em></p>
      <p>As do I, and I doubt if I am alone in practising type design as a compensation for bad handwriting. :)</p>
      <p>As I explained to Hermann Zapf when showing him some of the diacritic letters I had made for the initial Apple version of Palatino (before Hermann and Akira decided the redraw the entire typeface from scratch), I know what the shapes should look like, but can't make them by hand with a pen in the way that he can.</p>
      <p>But what is the skill that I am actually using when I'm designing type directly on the computer? I don't think it is a skill at moving my fingers on a trackball or cursor keys to edit bezier curves, although there is some basic manual competence involved. The skill is in looking and in understanding what I see. There is a difference of kind between the skill involved in making shapes on a computer and making shapes by hand, which has to do with the directness of the relationship between hand, tool and shape. What this means in terms of working with a pen or working with a computer is not that there is a switch between parallel but different skills -- since in the area of design the core skill, of seeing and understanding, remains the same regardless of the tool --, but whether a separate set of skills -- manual, fine motor skills, controlling a mark-making tool in direct contact with a medium -- is employed or bypassed. Or, in the case of education, whether these skills are developed at all.</p>
