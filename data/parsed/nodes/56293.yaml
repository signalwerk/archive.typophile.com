      <p>Hrant, if you were to strike out all your belittling insinuations and derogatory hyperbole there would be little left of your critique. Is the ball in my court to produce the falsifying evidence you can't or won't supply?</p>
      <p>The consequent of my claims above is not that type design imitate writing. Hrant knows that's not what I think. Hrant knows that I'm an advocate of systematic and well-motivated norm-violation when it comes to contrast-styling in type design. I'm also open to role-architectural exploration or reconfiguration in letter-form construction to enhance divergence [edited] or when the mapping problems of the current system become too complex. Hrant and I might have different ideas of where the tipping point might lie. Maybe eventually Hangul will fill the breech after the decline of the west has continued apace. Until then, I don't really see much prospect for a wholesale retranscription from within.</p>
      <p>The consequent of my claim above is that there are strong personal developmental and cultural historical reasons to continue / reinvigorate writing.</p>
