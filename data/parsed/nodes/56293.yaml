      <p>I said: "Writing turns a disparate collection of scribbled and divergent objective correlatives of ideas, or sounds, or syllabic primitives into a script." Hrant replied: "Ideally, it is thought that does this." Hangul is his basis for this. </p>
      <p>What's distinctive about Hangul is its intelligence as a representational system. This includes its basis in articulatory phonetics, and it's transparency to syllabic componency. However as a system of marks or strokes, according to the wikipedia.org entry on Hangul that I consulted, all Hangul letters follow the rules of Chinese calligraphy.</p>
      <p>By the 1400s, chinese calligraphy had long become an optical-grammatically mature and combinatorially powerful script.</p>
      <p>Writing is not the headless horseman Hrant wants to pretend it is. The problem with the latin script is not it's optical-grammatical structure, nor its combinatory arithmetic. It's its wonkiness as a representational system for the articulatorily fluid and linguistically polyglot environment it has to serve, extending it far beyond the Latin of it's birth.</p>
      <p>Learning writing is an inculcation of the perceptual psychophysical grammatology of a script. [edited]</p>
      <p>In Hangul the isomorphism is between the physical gestural logic of the hand in making marks, drawn feom an inherited mark-grammer, and the articulatory gestural logic of the mouth in making sounds.</p>
