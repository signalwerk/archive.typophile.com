      <p>Nina, my take on child development is that children should be allowed to play, and most of the skills they need in this world will be developed as a result of play: the way you played with your mother's typewriter when you were four. I do think thank tactile, manual play is of primary importance, especially for very young children: direct engagement with objects, manipulating them, making them interact, etc. Manipulating things via indirect controls, such as using a computer, is of secondary importance and something that, developmentally, follows from the first and can't be a substitute for it.</p>
      <p>I don't think there is any point in schooling children in e.g. Spencerian penmanship -- especially not if the tool you give them to do it with is a ballpoint pen! --, but I do think it is important for children to develop the fine motor skills that will enable them to learn that form of writing, or any other form that appeals to them, when they want to do so. I think there are a lot of people in the world who would love to make calligraphy, or even simply produce everyday handwriting that gives them pleasure, but who lack fundamental motor skills and this lack will make it very, very difficult for them to obtain even competence let along excellence.</p>
    html_clean: |-
      <p>Nina, my take on child development is that children should be allowed to play, and most of the skills they need in this world will be developed as a result of play: the way you played with your mother's typewriter when you were four. I do think thank tactile, manual play is of primary importance, especially for very young children: direct engagement with objects, manipulating them, making them interact, etc. Manipulating things via indirect controls, such as using a computer, is of secondary importance and something that, developmentally, follows from the first and can't be a substitute for it.</p>
      <p>I don't think there is any point in schooling children in e.g. Spencerian penmanship -- especially not if the tool you give them to do it with is a ballpoint pen! --, but I do think it is important for children to develop the fine motor skills that will enable them to learn that form of writing, or any other form that appeals to them, when they want to do so. I think there are a lot of people in the world who would love to make calligraphy, or even simply produce everyday handwriting that gives them pleasure, but who lack fundamental motor skills and this lack will make it very, very difficult for them to obtain even competence let along excellence.</p>
