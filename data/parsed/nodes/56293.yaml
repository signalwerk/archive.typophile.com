    <p>Saw this and thought of you people and wondered what you'd have to say on the subject;<br>
    <a href="http://www.good.is/?p=8133" title="http://www.good.is/?p=8133">http://www.good.is/?p=8133</a></p>
    <p>Is learning to handwrite important in the understanding of words and communication? or, should we now learn to touch-type from an early age? </p>
    <p>My instant thought is that handwriting is important. Especially in making notes of ideas or phone numbers etc, but thats probably just because its how I was educated I guess. </p>
    <p>Maybe I'll experiment with not using a pen or pencil for a week (except drawing) and just using stickies and notes (though perhaps I should buy some piece of i-phone/blackberry type technology first…)</p>
