      <p><em>"I know what the shapes should look like, but can’t make them by hand with a pen in the way that he can."</em><br>
      John, do I hear you. It's reassuring to hear you say that!<br>
      FWIW, when I started out designing my font, I spent about two months awkwardly sketching stuff on tracing paper that never looked right; my design process, the search for the shapes I wanted only took off once I put those sketches aside and moved to FontLab.<br>
      So I'm always bewildered when people seem to think that analogue drawing skills are some sort of <em>sine qua non</em> for design in general. Especially nowadays.</p>
      <p><em>"The skill is in looking and in understanding what I see."</em><br>
      That's a very good point. Of course béziers are a tool to be learned and understood too, but one that definitely favors brainpower over physical dexterity. I hear too many from the "hand-drawing fraction" say stuff like "only the hand can produce smooth curves". Well mine can't.</p>
      <p>Which reminds me: "physical dexterity leads to mental dexterity", as has been stated in this thread, seems… well, let's say oversimplified at the very least, if not somewhat beside the point in the digital age. If I was thinking the way I can draw, I'd have an IQ of about 50.</p>
