      <p>an abstract expressionist painter friend and i often discuss the relationship between gestural drawing and thinking.  he draws and paints and i write cursive with pencils and pens.  i do this in addition to spending too much time key stroking and pushing pixels around on the computer.</p>
      <p>i flunked spelling in elementary school and my handwriting was illegible until it became my choice to write longhand.  until recently i hated both of these disciplines because i sucked at performing them, but mastering them expands my capabilities, stretches my brain and makes my communication skills more complex, useful and dynamic.</p>
      <p>i know from personal experience that the product of my writing is different when i am on the computer and when i write a letter by hand.  its this gestural thing and also that, although marks made directly on paper are not immutable, correcting, changing or altering them takes a lot more effort than in the computer.  so, i think, the brain performs a different kind of editing in each mode.  and both have practical applications in an increasingly digital age.</p>
