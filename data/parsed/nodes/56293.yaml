      <p>Flipped and rotated letters by children are a very NORMAL sign of development and get corrected as soon as the particular child develops a bit more. It is NOTHING to be concerned about nor dreaded. Government  insistence that standardized testing by means of remembering meaningless dribble has done more to dismantle education than anything. Government officials are seeking ways to "PROVE" that children are learning as much as those in other countries and force teachers to waste precious time on test preparation rather than on learning important skills. All of these tests have done is prove that kids learned more before we started testing!<br>
      Exercising the brain is an important thing to do. One of the important ways to do it is by reading and writing. Writing is a developmental process which begins slowly with numerous errors which give students something to examine and learn by doing. No wonder students today have so little initiative, they have it strangled out of them before they are 10 years old!</p>
      <p>It isn't a matter of if we will later in life communicate by our handwriting, it is a case of learning the process of having different segments of our brain work together to do many different tasks.</p>
      <p>ChrisL</p>
