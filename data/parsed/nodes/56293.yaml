    html: <p>Writing turns a disparate collection of scribbled and divergent objective-correlatives of ideas, or sounds, or syllabic primitives into a script. Hallmarks of a script are the optical-grammatical kinship and combinatorial logic of it's forms, allowing word gestalts to form. We learn writing to trick our bodies into understanding in the most visceral and enduring of ways the idea that our alphabet is a script.</p>
