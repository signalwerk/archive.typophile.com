      <p>Graham, I don't think a fresh alphabet with some sort of collection of forms that go directly to thought is at all feasible. Above all, I like being practical. What remains very practical however is something like Legato, which throws the hand overboard (no matter how much the acolytes of GN want to distort it).</p>
      <p>&gt; Would it have to be constructed of forms that<br>
      &gt; could have lots of additional marks ’bolted on’</p>
      <p>Well, although that's not what I was thinking, I certainly believe that writing systems can be much more complex than the Latin script for example, leveraging our reading abilities better. Just like Morse Code can work, but it's not at all efficient. Chinese I don't think is too complex, and Hangul certainly isn't.</p>
      <p>&gt; I do enjoy the act of writing</p>
      <p>Me too!<br>
      I like lard too; but I don't pretend it's a cornerstone of society.</p>
      <p>&gt; I’d say to isolate the brain is a mistake.</p>
      <p>In fact it is impossible. But the hand does not contain any cognitive powers! One some level conclusions must be thought out, using the brain. And it does not make sense to allow the circumstantial structure of the hand/arm system (coupled to some arbitrary marking tool no less) to dictate what makes sense in terms of the functionality of reading. Unless one invokes some mystical synergy between all the parts of the body...</p>
      <p>Anyway, I've said all this a million times before. But some people just don't want to let go - it would be no fun for them to let go, and they want to have fun. Ergo, it is not possible to administer psychotherapy via ASCII...</p>
      <p>Peter, I forget. But it's out there, and not buried very deep. The thing is, why get hung up on a historical instance? Just because some guy did something one way or another means very little - it should not become an excuse to avoid the guidance of logic and reason.</p>
      <p>hhp</p>
