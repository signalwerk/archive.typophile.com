      <p>Nancy, drawing is awesome! But when it comes to "visible language" we give it way too much importance - for some people it becomes a pseudo-religion. It's comical to picture the not-too-distance past -and the not-too-distant future- where people did -and will do- just fine without authoring visible language by hand. In the future they will look back at us and laugh, just like we now laugh at pre-decimal counting systems, or pushing sticks into mud to remember stuff.</p>
      <p>&gt; And what if you’ve only learned typing and the power fails</p>
      <p>And what if the pencil breaks? I can't tell you how many times I've convinced my son to get a head start on his homework during the drive home only for him to discover that he has nothing to write with. And speaking of cars, what if you live in LA and your car stops working? Knowing to walk doesn't really help much. But frankly that line of reasoning goes nowhere.</p>
