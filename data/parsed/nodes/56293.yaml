      <p>I think the author of the article is confusing the nature of the problem she and her son are facing, although the first paragraph says it all:</p>
      <p><em>My son, who is in third grade, spends much of his school day struggling to learn how to form the letter “G.” Sometimes he writes it backwards. Sometimes the tail on his lowercase “T” goes the wrong way. His teachers keep telling him he may fail the state assessment standards.</em></p>
      <p>The problem isn't handwriting, the problem is schools, teachers and things like state assessment standards. Most schooling is institutional child abuse, and giving up pens and pencils in favour of computers isn't going to change that.</p>
      <p>I'd say that making a G backwards and then gradually understanding shape orientation is a pretty important developmental step: probably more important as a step than being able to write the G correctly. Of course, shape orientation can be learned in other ways, but writing letters and numbers is a good way to learn it and comes with other benefits: fine motor skills (which you don't get, for example, learning shape orientation by flipping and rotating shapes on a computer screen), and of course the ability to produce something that someone else can read, even if the only thing you have to hand is a stick of graphite. And contra what the author writes, there is lots of evidence of the importance of manual interaction in intellectual development (and for this reason it is one of the key principles of the Montessori method, which strikes me as pretty much the only humane and sane approach to education for young children).</p>
