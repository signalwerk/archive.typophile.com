  html: |-
    <p>Does it bother anyone else that internal-page Typophile badges are no longer clickable back to the home page? </p>
    <p>I know I can follow the breadcrumbs, but the clickability of the big red icon was so much more user-friendly and web smart (not to mention, best-practices compliant). Punchcut, please restore this great feature!</p>
    <p>Thanks!</p>
