    date: null
    date_raw: null
    votes: null
    html: <p>I remember the curved characters (top of the a, the c, s, etc) had squared terminals, much like Verona. Thanks William for Edison, I was not aware of it, though it's not the face that I had in mind, but a valuable resource for this style.</p>
