    html: <p>Searching a bit, I found Zapf himself did <a href="http://www.linotype.com/351/edison-family.html" target="_blank"> Edison</a> and also <a href="http://www.linotype.com/1210/marconi-family.html" target="_blank"> Marconi</a>. Both show the influence of his earlier Melior. Could you have seen one of these? </p>
    html_clean: <p>Searching a bit, I found Zapf himself did <a href="http://www.linotype.com/351/edison-family.html" target="_blank" class="link-external"> Edison</a> and also <a href="http://www.linotype.com/1210/marconi-family.html" target="_blank" class="link-external"> Marconi</a>. Both show the influence of his earlier Melior. Could you have seen one of these? </p>
  - id: 41845
