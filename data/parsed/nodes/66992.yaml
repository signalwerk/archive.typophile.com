    <p>Is Adobe Flash dead? (And, was it Steve Jobs in Cupertino with the candlestick holder?)  Here's the article from Slate: <a class="freelinking external" href="http://www.slate.com/id/2243422/">Slate: Did Steve Jobs Just Kill Flash?</a></p>
    <p>What does this mean for typography on the web? (Heck, what would this mean for typophile.com?) </p>
    <p>How about motion graphics on the web? Or is this a VCR / Betamax situation—answerable simply by asking which does the porn industry support? There's an excerpt (the "they" refers to Adobe):</p>
    <p>"They are lazy, Jobs says. They have all this potential to do interesting things but they just refuse to do it. They don’t do anything with the approaches that Apple is taking, like Carbon. Apple does not support Flash because it is so buggy, he says. Whenever a Mac crashes more often than not it’s because of Flash.</p>
    <p>No one will be using Flash, he says. The world is moving to HTML5."</p>
