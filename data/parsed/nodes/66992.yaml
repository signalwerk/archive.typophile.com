      <p>@James: What does modifying an AppleTV have to do with "basement dwellers who lack the social skills required to play WoW" ? Does that also apply to people who jailbreak their iPhones, or other forms of hacking that improve a device? </p>
      <p>Steve Jobs and Apple will have little or nothing to do with the acceptance of HTML5 nor the killing of Flash on the web. Like any web standard, it takes years for adoption rates to catch up. IE6 was *just* bumped by IE8 in most-used browser in the world. HTML5 does not work in IE6, but it does play Flash. If a web browser nearly a decade old is still being used by this many people, it's going to take a very long time for HTML5 to completely replace Flash as a go-to source for video on the web. Flash is still a great platform for online games, as well, something you won't see replaced by HTML5 anytime soon. So while the battle lines may have been drawn by the outspoken Apple leader, it represents very little more than the frustrations of one man lashing out at a company he wishes would develop software that worked better on his OS. That gripe, of course, is a two way street.</p>
      <p>HTML5 is here, it's great, and it simplifies a lot of things. But it's going to have to share the spotlight with Flash at best, and that's not going to change anytime soon.</p>
