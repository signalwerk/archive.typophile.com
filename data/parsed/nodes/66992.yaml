      <p>On the one hand not depending on a cellphone deprives me from certain insights - I admit. On the other hand not depending on a cellphone -especially a specific one- gives me a broader and clearer outside view, like how when I'm in a restaurant waiting area or ski resort chair lift I can observe instead of "communicate".</p>
      <p>But most of all my objectivity comes from being emotionally detached. I dislike all of these companies. MS, Apple, Adobe, to me they're all part of the problem*. This probably comes from my lack of faith in capitalism. The only computer company I really liked (and not for their management :-) was Commodore. The C64 and especially the Amiga could really do things. I was so emotionally attached I convinced my dad to buy stocks in Commodore... :-/  But I can't think of a computer company now that I like, and that's putting it mildly. I believe this gives me a clearer view into the distance than somebody who <em>wants</em> specific companies to succeed.</p>
