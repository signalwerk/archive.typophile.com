      <p>There's definitely a movement among cutting-edge web designers and software companies — the same folks who led the way in the semantic web, XHTML-CSS design, AJAX, and now HTML5 — to abandon Flash. I've been using the Click2Flash plugin to block all Flash except sIFR, and it's a godsend. Youtube videos now play as high-quality H.264 videos embedded in HTML5 pages.</p>
      <p>In early 2009, 65% of global mobile web content was accessed by iPhones and iPods. It is as high as 92% in some markets, like Australia, and 78% in Western Europe. 32% of visitors to popular tech pundit blog Daring Fireball have Flash disabled (like I do). Firefox for Maemo (Nokia's mobile smartphone/tablet platform) will disable Flash due to performance issues. The release of the iPad will only serve to increase the percentage of web users who don't use Flash.</p>
      <p>Other smartphone competitors will face the same choice Apple did. Do they ship with Flash, and leave a core part of their browsing functionality to black-box code by a third-party company known for its bugs and security holes, and thus have no power over compatibility and updates? Or do they rely on HTML5 and open-source Webkit, which can do everything Flash can do, as well or better?</p>
      <p>My hunch is Flash is done for, and good riddance when it goes.</p>
