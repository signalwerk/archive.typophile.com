      <p>"But there is still a lot of Flash content on the web, and it is very unfortunate that it can't be accessed on mobile devices."</p>
      <p>Yes, that's true. However, I think we'll see that remedy itself in short time.</p>
      <p>For video, there are options now (provided web site is willing to implement them) and more options coming soon (HTML5 video support).</p>
      <p>For animations, there are some options now (.js libraries) and some coming soon (webkit CSS transformations).</p>
      <p>For complex animations, that's where flash might stick around. It'd be nice to see that on a mobile device. However, I don't think that's a huge amount of content one would be missing.</p>
      <p>For the typical use of flash...gaming, I'm not sure a touch-based mobile device would even work for that. The standard keyboard and mouse interactions wouldn't apply to a multi-touch interface. So that might be moot. Fortunately, for that there are solutions now that help migrate a flash app into an iPhone app and, I'm guessing, other mobile OS apps soon. In fact, that'd be a great thing for Adobe to focus on...using Flash as an IDE for mobile OS apps.</p>
