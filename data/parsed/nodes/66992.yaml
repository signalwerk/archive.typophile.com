      <p>The reason Flash became a quasi-standard back then was not because Macromedia had a monopoly (which it didn't, with Adobe always being the bigger player), but because it was the decisively superior technology at the time (over competitions like SVG, which Adobe was trying to back, though in the most pathetic manner imaginable). Now Flash has become omnipresent, it requires at least a technologically equal alternative to displace it, even by a monopolistic platform provider. The problem is that HTML5, JavaScript and SVG are still no match for Flash in the visual department (vector animation, advance typography etc.), so there's no immediately available replacement in sight.</p>
      <p>To summarize, the death of Flash by the hand of Apple would require (1) Apple becoming a monopolistic mobile provider (which isn't happening with Google joining the game), and (2) mobile becoming a deciding factor for the web (which will happen eventually, but not in the next few years), and (3) Apple starting to embrace competing technologies (which it hasn't so far -- in fact, Apple was a major blocker of the recently failed HTML5 Video standardization attempt), and (4) the alternatives out-innovating Flash (which is extremely difficult given the snail pace at which W3C and co. move compared to Adobe) . None of those conditions is being met, ergo Apple killing Flash is simply a joke.</p>
    html_clean: |-
