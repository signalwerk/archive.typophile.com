      <p>and that's rather remarkable, because they aren't a _huge_<br>
      company.  but they do know their place on the totem pole.</p>
      <p>they know that the big fish eat the smaller fish, and they<br>
      have successfully avoided being eaten themselves, a feat.</p>
      <p>and they know their station in the pecking order, so they<br>
      make sure they're picking on a competitor of the right size.</p>
      <p>they're also highly skilled at deception.  for instance...</p>
      <p>&gt;   Flash may be "closed source" (as in "not open source",<br>
      &gt;   in the sense that the public has no way of getting<br>
      &gt;   involved in the development process), but<br>
      &gt;   the full spec has public for years,<br>
      &gt;   so it's not as bad as it once was.</p>
      <p>this is one of the biggest tricks they play on the public...</p>
      <p>the make a spec "public knowledge", so that -- in theory --<br>
      anyone can make use of it.  but when you get down to it,<br>
      you discover all kinds of caveats.  for instance, you'll find<br>
      that you are specifically disallowed from making a player.<br>
      moreover, you'll find that there are all kinds of difficulty<br>
      in that spec, which make it extraordinarily complex to<br>
      code an authoring-tool.  moreover, because adobe is<br>
      in complete control of the spec, they can change it at will,<br>
      and they _will_ change it if you _were_ to manage to create<br>
      an authoring-tool that threatened their income-stream...<br>
      (they can also make sure their player will choke on any<br>
      content that's created by your player, making it worthless.)</p>
      <p>they're currently pulling this type of charade with e-books,<br>
      where they combine their viewer-tool with their d.r.m., thus<br>
      making it impossible for anyone else to make a viewer-app,<br>
      which then makes it easy for them to control authoring-tools,<br>
      and thus manipulate what started out as "an open standard",<br>
      the classic "embrace-extend-extinguish" model of microsoft.</p>
      <p>(and, in case you weren't paying attention to e-books then,<br>
      this is what microsoft did with e-books in the late '1990s,<br>
      with an earlier version of this  same "open standard" format.<br>
      publishers pulled out once they realized what microsoft was<br>
      trying to pull on them, but e-books suffered a bad setback.<br>
      now we're replaying the scene, with adobe in the ms-role.)</p>
      <p>(also, in case you weren't paying attention to e-books then,<br>
      adobe also bought-and-shelved some competitors to .pdf in<br>
      the early 1990s, which is when i became hip to their strategy.<br>
      it's how they established .pdf as a "defacto standard", which is<br>
      another trick they love to play, and repeated later with flash.)</p>
      <p>i admire the craftiness of adobe in executing the strategy, but<br>
      they're sleazy, they're very sleazy, and i don't trust 'em a bit...</p>
      <p>-bowerbird</p>
