      <p>I don't think anyone here honestly believes that some company or a technoloqy can kill Flash, just like that.</p>
      <p>Blocking Flash entirely is a good call when you have to make sure everything else stays up and running and you're certain that the culprit is indeed the plugin.</p>
      <p>As for Adobe being lazy, the same can be said about any major software company. They rarely pay any attention to their support forums. The following website was on Hacker News today and it contains a Flash bug reported to Adobe in September 2008:</p>
      <p><a href="http://flashcrash.dempsky.org/" title="http://flashcrash.dempsky.org/">http://flashcrash.dempsky.org/</a> [this web page should crash your browser, just to illustrate a point]</p>
      <p>The bug should have been fixed in the latest beta, though.</p>
      <p>Mozilla also disabled Flash by default on its Mobile Firefox, but besides some Nokia users that's not going to affect anyone yet. They listed the same reasons for doing so as Apple did, and they do make a valid point: if a piece of software they have no control over deteriorates the user experience to a level where the user perceives their product as somehow defective, they have a good reason for disabling it.</p>
