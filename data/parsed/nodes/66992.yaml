      <p><cite>What I meant is an OS that crashes because<br>
      of a browser plug-in needs to be fixed.</cite></p>
      <p>I've never had Mac OS X crash because of Flash, but many times I've had a web browser running on Mac OS X crash due to faulty Flash. Sometimes what crashes Safari won't crash Opera or Firefox or Camino or iCab or Shiira, or it may crash any one or more of those. What is true that the Mac version of the Flash plugin has always run less efficiently than the Windows version on equivalent hardware. I've seen Flash animation that still runs choppy on my year old iMac that ran smooth as glass on a Windows PC a decade ago.</p>
      <p>But there is still a lot of Flash content on the web, and it is very unfortunate that it can't be accessed on mobile devices.</p>
