      <p>Flash has been wallowing in the hands of Adobe for some time. They bought it hoping it was a magic pill but didn't do a whole lot with it.</p>
      <p>It's not dead, for sure, but HTML5, Canvas, jQuery and other solid JS libraries combined have all been gaining quite a bit of momentum as a solid replacement for a lot of what Flash currently does for us on the web.</p>
      <p>Steve Jobs has merely lent a LOT MORE momentum to the cause.</p>
      <p>"People don't write for Carbon for the same reason most viruses are for Windows: installed base!"</p>
      <p>That's incorrect and I'm not sure what that has to do with Flash. </p>
      <p>"And that's also the reason Jobs can't kill anything as huge as Flash"</p>
      <p>Not alone, of course. But there are plenty of folks more than happy to let Flash go by the wayside for a lot of things. </p>
      <p>And the future of the commercial web is mobile. And mobile = iPhone, so people are definitely factoring this into the equation.</p>
      <p>As for what it means for web typography? Not much. If anything, it just leaves more room open for @font-face support.</p>
