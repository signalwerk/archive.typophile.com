      <p>There was a recent news item about how Flash could be used to fill memory with repeaed patterns so as to largely vitiate a precaution Microsoft takes against buffer overflow exploits by locating parts of programs at random locations in memory instead of the same place each time.</p>
      <p>Given that an iPad is a telephone, security is very critical on such a device; subverting its software could switch it into modes that allow intercepting other people's telephone conversations. On the other hand, surfing the web from a cell phone is expensive, and so I doubt that Adobe's Flash will disappear just because it is not accessible from one device.</p>
      <p>Although many computer users find that it makes web sites annoyingly slow - and they value speed and usability over looking pretty. This is not an unreasonable attitude to take, and so web designers who use things like Flash excessively, or where it does not relate well to the purpose of the site, do so at the site's peril.</p>
