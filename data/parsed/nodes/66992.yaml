      <p>@stefan seifert<br>
      <em>I wonder only what will be the future possibilities of using the very typeface I want in Internet not depending on what the user has installed on his system. For me, personally, that’s what it’s all about.<br>
      Why are there no moves in this direction? </em></p>
      <p>There's plenty of moves in this direction. IE, Firefox, Safari, and Chrome all have reasonably functional implementations of @font-face. Opera, <a href="http://readableweb.com/font-face-in-opera-10-5-pre-alpha-stinks-despite-snapshot-hype/">less so</a>, but at least it seems to be on their minds. As it should.<br>
      Firefox 3.6 was just released with support for the compressed font-wrapper format WOFF. Plus a major bug regarding synthesized bolding was fixed. Looks pretty solid now.<br>
      Much more is known now as to how a cross-browser implementation needs to be handled in the CSS.<br>
      There are tools and test pages and how-to information on the way that will make it easier for web developers to compress fonts, subset fonts, and view fonts in the browser.<br>
      There are JavaScript techniques being developed to smooth out the differences between implementations.</p>
      <p>I, too, am sick to death of looking at Georgia, Arial, and Verdana. </p>
      <p>There's plenty going on.</p>
      <p>Rich</p>
