      <p>The "Carbon" comment is puzzling, and I wonder if Steve meant Cocoa. Carbon is the intermediate API that bridges OS 9 and OS X. Carbon apps can run on either, and I believe all Adobe apps except Lightroom use Carbon.</p>
      <p>What Adobe hasn't done is rewrite Photoshop and the rest of their Creative Suite in Cocoa, which they'll need to do to make their apps 64-bit and for other technical advantages.</p>
      <p>As for Flash, I'd say the sooner it's forgotten, the better. What a blight. I suppose it can linger for games, but using it as a video player or, let's say, for inline font rendering is like using a flame thrower to light a cigarette.</p>
