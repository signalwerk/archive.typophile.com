      <p>I think Steve actually has to sell a significant number of devices before Adobe has to worry about him killing Flash. Even if every Mac user buys an iPhone/iPad tomorrow Apple’s Flashless devices will still have a smaller user base than Opera or Chrome, neither of which is relevant commercially. And the iPad could very well be the next Apple TV, which, like the iPad, was great, awesome, amazing, and totally going to destroy a bunch of stuff, and has turned out to be little more than a hacking platform for basement dwellers who lack the social skills required to play WoW.</p>
      <p>But I do think that all this speculation is a sign that Flash is on its way out. A few years ago Flash/Flex seemed to have a brilliant future ahead and now we’re all salivating at the thought of a web with no Flash at all. If this is an omen of how we can expect feelings about Flash to trend it seems like the Adobe/Macromedia buyout will be right up there with AOL buying Time Warner in the history of corporate takovers gone horribly wrong.</p>
