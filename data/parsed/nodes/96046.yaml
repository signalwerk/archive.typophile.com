      <p>Sorry, zeno: you fail again.</p>
      <p>Beer has been around a lot longer than fonts. Beer also represents Nature's most perfect food source: bread and water. I recently went on a six-day fast, when all I consumed was Beck's Non-alcoholic beer, period. I found the experience to be beneficial, both physically, mentally, spiritually and emotionally…and, sad to say, entirely font-free.</p>
      <p>As a result of my recent incarceration (eight days on bread and water alone), I am a few pounds below my optimum weight of 138 pounds, and I get a little loopy if I miss a meal. Still, my mind is sharp, and my new-way-to-distribute-fonts plan is still on track, despite overwhelming reluctance from almost EVERYONE in this forum to take on the Elephant in the Room, evidently for fear of financial ruin, or some other cockamamie, cowardly excuse.</p>
      <p>No guts, no glory. I got a few placeholder pages to put together, outlining the grand plan. Hypothetically speaking, Monotype can kiss my ass, or put up some serious cash to shut me up and shut me down. The world of font distribution WILL change; early adopters will reap the biggest rewards. Hrant: this means you.</p>
