    <p>This year Fountain has been operating as a type foundry for 15 years. To celebrate this we decided to make some changes.<br>
    Fountain is proud to announce the launch of our new website, a brand new OpenType library and the release of 4 new typefaces.  </p>
    <p><a href="http://www.fountaintype.com" rel="nofollow">www.fountaintype.com</a></p>
    <p><strong>New OpenType library</strong> </p>
    <p>It took a while –  a bit longer than we guessed and hoped –  but we are very happy to finally have converted the fonts in our library into the OpenType format. It has not been an easy task. When necessary we have had to re-drawn the glyph curves from scratch and fix old glitches. The glyph sets has been expanded to cover full CE support. A full range of different OpenType features has been added.<br>
    With this launch we say goodbye to the old legacy (PS1/TT) formats, and from now on the Fountain library will be available exclusively in the OpenType format.</p>
    <p>Even though we worked hard to get all families ready, there is still a few families not fully ready at site launch time. We're working hard on them, and we promise to make them available in the beginning of next year.</p>
    <p>We offer upgrades from legacy typefaces. Until January 31, 2009 we will offer very generous discounts (up to 68% off in some cases).<br>
    Have you bought any of our "Std" fonts (see list on the Upgrades page) within 2008 your upgrade discount is even more gentile  – 90% off.</p>
    <p>To be able to upgrade you must have purchased the typeface directly from us.   More info at <a href="http://www.fountaintype.com/support/upgrades" rel="nofollow">www.fountaintype.com/support/upgrades/</a></p>
    <p><strong>New website</strong> </p>
    <p>The site has been re-designed from scratch with a new strong database foundation. The pages load quicker, and we have an easier time updating. Our domain name has changed to <strong>fountaintype.com</strong> so will be easier to find us, old links will be redirected and old email addresses will still work.<br>
    The typefaces can now be downloaded directly after purchase. We will miss the direct contact with our customers, but this will save time for all parties. You are of course still always welcome to <a href="http://www.fountaintype.com/contact" rel="nofollow">contact us</a>.</p>
    <p>We've added a new way to test the fonts and their OT features by using the amazing <a href="http://www.fountaintype.com/typefaces/lisboa/lettersetter" rel="nofollow">LetterSetter</a> application so nicely put together by Letterror. It's available through the typeface pages, please <a href="http://www.fountaintype.com/typefaces/lisboa/lettersetter" rel="nofollow">take it for spin</a>.</p>
    <p><strong>The 4 new typefaces</strong> </p>
    <p>On this day of celebration it would be suitable to not only update our old fonts, but also to release some new typefaces. We think the selection is a nice mix of genres, and we also take the oppertunity to say welcome to two new type designers – Lucas Brusquini and Göran Söderström.</p>
    <p><strong>Atlantik</strong> - Ocean ornaments in 6 fonts</p>
    <p>Atlantik is a font family filled with ornaments related to the waves . Based on patterns from old specimen books it holds a collection of 213 single ornaments divided into 6 sets.<br>
    Exclusively available in OpenType format. </p>
    <p>Designed by <a href="http://www.fountaintype.com/designers/20-sylvia-daniel-janssen" rel="nofollow">Sylvia and Daniel Janssen</a>. </p>
    <p><a href="http://www.fountaintype.com/typefaces/atlantik" rel="nofollow">www.fountaintype.com/typefaces/atlantik</a><br>
    <a href="http://www.fountaintype.com/specimens/18/original/FTN_Atlantik.pdf" rel="nofollow">Download a PDF specimen</a></p>
    <p><strong>Dessau Pro</strong>  - A historical sans serif family</p>
    <p>Dessau is a take on Bauhaus typography with an Hungarian twist. This typeface family consists of a total of 11 different styles, and variations.<br>
    Full CE support. Exclusively available in OpenType format. </p>
    <p>Designed by <a href="http://www.fountaintype.com/designers/21-g-bor-k-thay" rel="nofollow">Gábor Kóthay</a>.</p>
    <p><a href="http://www.fountaintype.com/typefaces/dessau" rel="nofollow">www.fountaintype.com/typefaces/dessau</a><br>
    <a href="http://www.fountaintype.com/specimens/39/original/FTN_Dessau.pdf" rel="nofollow">Download a PDF specimen</a></p>
    <p><strong>Flieger Pro</strong> - A geometric script in three weights</p>
    <p>The origin for this typeface comes from an old logotype. But Göran Söderström has expanded the idea to a large glyph collection of alternates, swashes, end-glyphs and ligatures. Lotta Bruhn added a set of illustrations in font format to go with the typeface and a set of wing initials.<br>
    Full CE support. Exclusively available in OpenType format.</p>
    <p>Designed by <a href="http://www.fountaintype.com/designers/26-g-ran-s-derstr-m" rel="nofollow">Göran Söderström</a>.  Illustrations and wings by <a href="http://www.fountaintype.com/designers/11-lotta-bruhn" rel="nofollow">Lotta Bruhn</a>.</p>
    <p><a href="http://www.fountaintype.com/typefaces/flieger" rel="nofollow">www.fountaintype.com/typefaces/flieger</a><br>
    <a href="http://www.fountaintype.com/specimens/19/original/FTN_Flieger.pdf" rel="nofollow">Download a PDF specimen</a></p>
    <p><strong>Tycho Pro</strong> - A serif family rooted in the stars above</p>
    <p>The typeface Tycho started as a college project. The printed works of Danish astronomer Tycho Brahe, was the starting point. It soon became clear that the font used was of very poor quality and most likely a mix of several different fonts. Gradually the work shifted from pure revival to the design of a new typeface. Tycho comes in four styles – Book, Book Italic, Bold and Display – all with full CE support, Small Caps and OT features.<br>
    Exclusively available in OpenType format.</p>
    <p>Designed by <a href="http://www.fountaintype.com/designers/27-lucas-brusquini" rel="nofollow">Lucas Brusquini</a>.</p>
    <p><a href="http://www.fountaintype.com/typefaces/tycho" rel="nofollow">www.fountaintype.com/typefaces/tycho</a><br>
    <a href="http://www.fountaintype.com/specimens/36/original/FTN_Tycho.pdf" rel="nofollow">Download a PDF specimen</a></p>
    <p>have a nice day</p>
    <p>Peter Bruhn<br>
    [Principal Designer &amp; Proprietor]</p>
    <p><strong>About Fountain:</strong><br>
    Fountain is an independent and friendly digital type foundry based in Malmö, Sweden. We’ve been sending out nice typefaces to the world since 1993.<br>
    <a href="http://www.fountaintype.com" rel="nofollow"><strong>www.fountaintype.com</strong></a></p>
