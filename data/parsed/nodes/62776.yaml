    <div class="info">Submitted by <a href="/user/108" title="View user profile.">Miss Tiffany</a> : 6.Oct.2009 10.37am </div>
      <p>For Immediate Release:<br>
    Buffalo, NY- October 6th, 2009</p>
    <p>P22 Type Foundry and the Sherwood Collection introduce Spooky by Ted<br>
    Staunton</p>
    <p></p><div class="imageWrap"><img src="/files/SpookyPoster_3559.png"></div><p></p>
    <p>Spooky is a chilling font that is evocative of the type used in horror<br>
    films and posters. It’s creepy, it’s kooky...it’s spooky. Perfect for<br>
    invitations, banners or other ghastly uses.</p>
    <p><a href="http://www.p22.com/sherwoodtype/spooky.html" title="http://www.p22.com/sherwoodtype/spooky.html">http://www.p22.com/sherwoodtype/spooky.html</a><br>
    Introductory offer through October 31st.<br>
    ————————————————————————-<br>
    For the month of October, P22 Spooky is also available in a special<br>
    Halloween pack with two sets of must have ornaments from P22- LTC Halloween<br>
    Ornaments and P22 Posada Extras. For more information:</p>
    <p><a href="http://p22.com/products/monthly.html" title="http://p22.com/products/monthly.html">http://p22.com/products/monthly.html</a><br>
    ———————————————————————-<br>
    You can now follow P22 on Twitter.com:<br>
    <a href="http://www.twitter.com/P22TypeFoundry" title="http://www.twitter.com/P22TypeFoundry">http://www.twitter.com/P22TypeFoundry</a><br>
    ————————————————————————<br>
    Become a fan of P22 on Facebook:<br>
    <a href="http://www.facebook.com/pages/P22-type-foundry/11128622951" title="http://www.facebook.com/pages/P22-type-foundry/11128622951">http://www.facebook.com/pages/P22-type-foundry/11128622951</a><br>
    ————————————————————————</p>
