    html: "<p>If you are looking for a 'Hellenic Wide' revival,<i> like '58 Rodeo'</i>, you may want to consider some of these.: '<a href=\"http://www.myfonts.com/fonts/aboutype/antique-central/\" target=\"_blank\">Antique Central</a>', '<a href=\"http://www.buyfonts.com/value_for_money/hefty.htm\" target=\"_blank\">Hefty</a>', '<a href=\"http://hem.passagen.se/spsweet/font2/stereo.html\" target=\"_blank\">HiFi Stereo</a>' <i>( Free )</i>, '<a href=\"http://www.csaimages.com/results.asp?image=FNT018&amp;wwwflag=&amp;imagepos=18\" target=\"_blank\">Platon</a>', '<a href=\"http://www.letterror.com/foundry/zapata/index.html\" target=\"_blank\">Zapata</a>'.. <br> <br><i>( Looking at the 'Victorville' sample  it seems uneven, so I may assume 'Fancy Full Round' may be even closer than those 'Hellenic Wide' variations.. )</i></p>"
