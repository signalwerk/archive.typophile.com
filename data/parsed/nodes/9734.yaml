    html: <p>kemie, wow thats as close as I have found. thank you. your site is quite the gem.  I only wish I had found that a day earlier. I have already begun making the font  from this drawing . I particularly like the curvy nature of the descenders in the drawing. I am also having some narrow kerning to resemble the actual nature of the ink on linen drawing. When viewing the actual drawings you can see the very subtle fine weave in the surface of the ink.  I will share as I have something workable.</p>
