    date: 2005-03-13T07:51:00
    date_raw: 13 Mar 2005 — 7:51am
    votes: null
    html: "<p>I still think Terracotta may be the closest I have found, but just for comparison, other Architect lettering would include: <a href=\"http://www.myfonts.com/fonts/arroyostyle/g-and-g/\" target=\"_blank\">G&amp;G</a> from Woodside Graphics; <a href=\"http://www.myfonts.com/fonts/outsidetheline/architectural-lettering/\" target=\"_blank\">Architectural Lettering</a> from Outside the Line fonts (love that name); <a href=\"http://www.myfonts.com/fonts/australiantype/architect/\" target=\"_blank\">Architect</a> from the Australian Type Foundry; <a href=\"http://www.myfonts.com/fonts/nicksfonts/strongs-draughtsman/light/testdrive.html?s=FOYER&amp;p=48\" target=\"_blank\">Strongs Draughtsman</a> from Nick's Fonts (this is extremely close to the feeling of your sample, but a bit 'cuter' in certain touches, IMHO); there are also the more familiar Engineering styles like Blueprint, Stylus, Tekton and Graphite, which I have not linked. There is also the drafting face included with the House Neutraface set, but you have to buy the whole set to get it, and it is not as expressive, or antique-looking as yours. <br> <br>I would say the choice is between Strongs Draughtsman or Terracotta, from the fonts I was able to find.</p>"
    html_clean: "<p>I still think Terracotta may be the closest I have found, but just for comparison, other Architect lettering would include: <a href=\"http://www.myfonts.com/fonts/arroyostyle/g-and-g/\" target=\"_blank\" class=\"link-external\">G&amp;G</a> from Woodside Graphics; <a href=\"http://www.myfonts.com/fonts/outsidetheline/architectural-lettering/\" target=\"_blank\" class=\"link-external\">Architectural Lettering</a> from Outside the Line fonts (love that name); <a href=\"http://www.myfonts.com/fonts/australiantype/architect/\" target=\"_blank\" class=\"link-external\">Architect</a> from the Australian Type Foundry; <a href=\"http://www.myfonts.com/fonts/nicksfonts/strongs-draughtsman/light/testdrive.html?s=FOYER&amp;p=48\" target=\"_blank\" class=\"link-external\">Strongs Draughtsman</a> from Nick's Fonts (this is extremely close to the feeling of your sample, but a bit 'cuter' in certain touches, IMHO); there are also the more familiar Engineering styles like Blueprint, Stylus, Tekton and Graphite, which I have not linked. There is also the drafting face included with the House Neutraface set, but you have to buy the whole set to get it, and it is not as expressive, or antique-looking as yours. <br> <br>I would say the choice is between Strongs Draughtsman or Terracotta, from the fonts I was able to find.</p>"
