      <p>I own a 2-volume set of the Milton, the 1759 edition. The bindings are clearly very old but I'm not at all sure that they are original. Owner's name on endpaper includes the date 1806. I'm mentioning this simply because the trim size of my two books may have grown smaller in the rebinding, if they were indeed rebound.</p>
      <p>In any case, trim is 7-1/8" x 9-1/2" (182 x 242 mm) upright. The type page is 25x42 picas (4-1/8" x 7" / 105 x 177 mm). Margins are: head, 5p6; tail, 9p; inner, 6p6; outer, 11p. Type is set 14/17.</p>
      <p>I hope this is of some help. They are beautifully designed and printed books with consistent type color from one page to the next, never overinked, and although the paper is foxed it feels as strong and healthy as it must have 250 years ago!</p>
      <p>[edit] In case this is of any value to your collection of data, the edition I own was printed by Baskerville for J. and R. Tonson, London.</p>
