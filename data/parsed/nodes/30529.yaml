  html: |-
    <p>I am currently designing a book based on Baskerville for a graphic design project at Uni. The book has to link to Baskerville in its format and layout grids. So the book doesnt necassarily have to be your standard book with a cover and pages it can be of any creative nature but link to baskerville.</p>
    <p>My idea was a book of stamps showing the transitional features or the Baskerville typeface, but im having problem linking a stamp book directly to Baskerville.</p>
    <p>I'm in need some examples of grids and layouts that link to Baskerville's printed works, all the ones I can find are wide margined and very large books such as the bible. Has anyone got any examples of smaller books or different work?</p>
    <p>Any other thoughts welcome aswell.</p>
    <p>Thanks Simon Moore</p>
