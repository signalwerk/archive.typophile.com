    html: |-
      <p>The answers to the ﬁrst and last of these questions is in the style guides used by editors. Firstly, one would have to compare different editions of style guides to see when the conventions changed. And thirdly, today if one wishes to be proper and demonstrably correct, then one should choose and abide by a style guide (there are different ones available, with different “rules”, e.g. for American English and English English (fewer marks).</p>
      <p>However, “why” is open to conjecture. Note that long ago compositors placed no space after a comma, which might suggest a visual reason for the lack of spaces in acronyms, even those unwieldy conglomerations that cannot be sounded like words.</p>
