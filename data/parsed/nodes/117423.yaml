  html: |-
    <p>Could any of you tell me when, where, and why did the convention of using small caps for acronyms longer than three letters arise?</p>
    <p>If you are using the obsolescent tradition of writing full stops after the inital letters in acronyms, why is it that there are no spaces after the stop, just like there are after the initals in a shortened name?</p>
    <p>Should those spaces, in both cases (acronyms and personal names), be non-breaking or of some other kind?</p>
