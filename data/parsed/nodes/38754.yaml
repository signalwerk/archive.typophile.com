    html: |-
      <p>Gudrun Zapf-von Hesse. </p>
      <p>When I mentioned her name during a Typography 1 class I was teaching several years ago, one of the students raised her hand and said, "That's the first woman you've mentioned. Are there more?" So I named a few others (including Beatrice Warde, who was not a type designer but was a key figure in the development of 20th-century type), and we talked about the imbalance. </p>
      <p>I also recall noticing, at a FUSE conference in London in 90-something, that the majority of the audience was women, while the preponderance of the presenters was men. How come that didn't translate, over the past ten years or so, into a much larger number of women at the top of the graphic-design field? (Well, all right, the pressures and the reasons are obvious, but still. But still.)</p>
    html_clean: |-
