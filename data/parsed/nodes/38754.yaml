    html: |-
      <p>In the first step, I want them to know distinguish typefaces to open their mind for the different forms and the uncountable ways to say: A (or B or C ...) therefore i'm concentrated to type-designers. The typographers are the second step, first they have to learn that typeforms are man/woman-made and that type ist not something fallen down by sky or born in computers ...</p>
      <p>By the way – 60% of the 106 students are female, but this has been so since years, when i remember my time of studying in the early eighties. The role-model didn't change really since that time. To be patient is not sooo easy ;-)</p>
