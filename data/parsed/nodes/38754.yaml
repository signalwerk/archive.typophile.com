  html: <p>Everyone of my 106 students in this first semester has to to do a little research about type designers, and i'm just writing a long list with the name of (106) type designers, where-off they can choose one, to prepare a little lecture ... and as so often i'm wondering about the small amount of female type designers. ”Is there anybody out there” - beside the “to-me-known”  –  Jill Bell, Zuzana Licko, Sybille Hagmann, Veronika Burian, Carol Twombly, Marian Bantjes, Johanna Bi'lak, Nina David, Natascha Dell,  ... ? Many thanks in advance for more information!</p>
