      <p>Essi,<br>
      Retro is far easier now in the digital era because you can research stuff in minutes on the web and the digitising tools are so much faster than doing things by hand. That makes the means readily available. Before digital, lettering styles were copied and used in more current works. Samples were copied by Photostat and reworked with pen and brush.  Much of the display type that you refer to as being retroed was actually much older hand lettering that was made into a typeface in more recent years. Stuart from FontDiner has done a wonderful job of this.</p>
      <p>I think more retro work is done today because we have the means to do it well and quickly. I also think it fills a market niche for art directors who are using older times as venues to create an atmosphere for current products. If you have a national chain of diners who try to pose a 50's feeling, you want type for menus and ads that fits the bill. You also have high-tech stuff going on that prompts modern design as well. I don't think you can make a value judgement that says making retro fonts is some kind of easy way out. It isn't. It is just an area of the market that has customers so why not do it if you have a passion for it. The value judgements come only in how well it is done. Personally, I am more passionate about coming up with my own notions for new type but that is just me. I probably would not fulfill the same market needs as Stuart but that is what makes the World more interesting. Everyone can work on what they feel comfortable with and the customers get a broad range of choices.</p>
      <p>ChrisL</p>
