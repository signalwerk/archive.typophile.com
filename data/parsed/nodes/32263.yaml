      <p>You might find Nick Shinn's article on the persistence of Helvetica and other long-in-tooth type useful. Here's an excerpt:</p>
      <p>"Creative strategy has changed, too. Branding in the global corporate<br>
      era eschews the slightest quirk. Everyone wants to come<br>
      across as MegaCorp Inc, category leader, last man standing, all<br>
      things to all people. For this reason, Neue Helvetica is marketed<br>
      as “timeless and neutral”, appealing to art directors who would<br>
      rather not use typeface to differentiate their clients in the marketplace.</p>
      <p>"For all these reasons, the legacy sans faces — and Helvetica in<br>
      particular — have come to dominate the typographic landscape.<br>
      They are popular not because they are appropriate to the task at<br>
      hand but because they pander to the authority of mass fashion."</p>
      <p>...and a link:</p>
      <p><a href="http://shinntype.com/Stories/Uniformity.pdf" title="http://shinntype.com/Stories/Uniformity.pdf">http://shinntype.com/Stories/Uniformity.pdf</a></p>
