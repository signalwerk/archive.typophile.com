      <p>Thanks for the great answers!</p>
      <p>Maybe I need to clarify some things about this work. It's not a study about certain fonts or styles, it's more about the reviving of fonts and styles in general.<br>
      Personally I think the word 'retro' is problematic because its definition is a bit blurry, but it seems to be the only word I get even close. What I here mean by retro is all the display fonts which are done recently (1998-2007) but have copied the style, more or less, from the past (1900-1980, somehow 90s is not yet retro). I have happily ruled out the odd reviving of blackletter in the hip hop scene.</p>
      <p>The whole topic is really vast but I'm trying to get the most important factors of the 'retro display font phenomenon' in a nutshell, like: the history of reviving, reasons for reviving, retro designers' resources for inspiration, classifying of retro fonts (this is a tricky one), is there certain forms for certain times, how long this retro fashion might last, the most copied styles and so on. I have managed to write the history part but for the other stuff there's not much references. So I'm more than happy to hear thoughts on these things. </p>
      <p>I made one retro font in a typography course in my school and my teacher started to wonder how the retro stuff is so popular nowadays even in font design. That inspired me to take the issue under a magnifying glass, question the whole thing, organize it and study it. I would like to find some reasons why so many people find old styles appealing, It can't be only a matter of personal taste when the same taste is shared so widely. Although it might be useless trying to find the ultimate reason, when these designs often develop from nostalgia and from the cycle of fashion, but still I feel there might be something that has driven our visual taste to the point where past designs are more interesting than fresh innovations. </p>
      <p>What I'd like to find is examples of the new display fonts with their origins, and try to compare the old and new version. Also I would like comments from the people who make the fonts, like: how they started to make revivals and why? What are their favorite styles and why? Also comments from the people who use the fonts would be very welcome. It's interesting to hear why and when they use revivals. </p>
      <p>Sometimes it even seems like some 'authorities' are (or were) against the retro fonts, they are too easy and they appeal to the masses. I guess it's part of the democratization of font design, there is little room for authorities when amateurs upload their fonts to web. But somehow now it's more acceptable because the retro fonts are getting more and more professional. Hmm, well I don't have much to back that statement up, but that's where I need your opinions!</p>
      <p>Write what comes to mind about the things I've said above.<br>
      If you feel like writing more about the topic, please email me directly.<br>
      Stuart,  your email would be worth gold!</p>
      <p>Essi</p>
