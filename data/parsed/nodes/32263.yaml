      <p>Essi,</p>
      <p>To be honest, it sounds like you're callin' me out but I'm surprised you didn't e-mail me directly. As the proprietor of the Font Diner (<a href="http://www.fontdiner.com" title="http://www.fontdiner.com">http://www.fontdiner.com</a>) for going on 11 years now, I'm precisely the fellow your talking about . . .</p>
      <p>As to your questions . . .</p>
      <p><cite>Why now? There’s no limitations in the forming of letters but still people are interested more reviving these old styles.</cite></p>
      <p>Call it personal taste . . . I've always been fascinated with the stylized aesthetic of bygone eras and I identify most of them specifically by the type in use during that time and its method of use. The only reason I create retro display work is because its what I am most passionate about and reflects my personal taste.</p>
      <p><cite>Is that just the point? Are designers just tired of the weird stuff that was made in the 90s?</cite></p>
      <p>Prior to my own discovery of retro, the only specific retro type available from the 90s was little scripty gems by Leslie Cabarga released through Font Bureau, otherwise I can't remember never NOT liking Futura.</p>
      <p>I think in the early 90s it could have been said there was no specific retro movement but nowadays, I feel there actually is a definable retro movement and type designers of today cater to that vs. early on they were helping define it . . .</p>
      <p><cite>Are the retro designers all amateurs who just make what they think will look nice?</cite></p>
      <p>I sure hope not . . . I guess this is my profession so I'm a professional retro type designer. And yes, I make what I like because it appeals to me, AND there are many folks it also appeals to so when I decide the next typeface to create, it's always with both in mind . . .</p>
      <p><cite>What are the reasons for making fonts that look old?</cite></p>
      <p>If you're referring to distressed 'beat up' type, there is an inherent connection between the erosion on a physical object due to its environment and the sense of its age, like wrinkles . . .</p>
      <p><cite>What problems these retro fonts have?</cite></p>
      <p>Explain?</p>
      <p><cite>What styles seem to be the most reproduced and what styles would you wish someone would digitalize?</cite></p>
      <p>There aren't many styles left undigitized and fewer still as the days go on and the retro aesthetic appeals to more audiences . . .</p>
      <p>Again, I may be completely offbase with my reply because you failed to clearly identify what you consider to be 'retro' display fonts . . . My work is primarily 1930s through the 1960s but you may be looking at a different frame of reference . . .</p>
      <p>Stuart :D</p>
