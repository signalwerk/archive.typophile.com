      <p>It's just an extract from a text, Bruce. And it's actually about someone making the same mistake twice. It's pretty much human nature to keep making the same mistakes (because we always want more &amp; better things), but from those mistakes, by now we should have learned not to make them again (which I described in the following part):<br>
      ...<br>
      but know that you would burn your fingers<br>
      if you were to flirt with temptation<br>
      ...<br>
      People always get too greedy to ever really be satisfied with what they have. It's hard to explain from just this little extract, but mankind's returning mistake is that we always try to get a little more instead of trying to find happiness in content.<br>
      Maybe that philosophy is reflected in retro design as well, history being the inspiration for retro design &amp; the changes made to it expressing our desire for something more/different. Although in retro design, I would not describe it as being a mistake, so maybe that's were history repeats itself without mistakes?<br>
      Besides, it clearly states "once you've got it made" &amp; since we haven't quite made it as far as living peacefully in harmony goes yet, we're merely one step in the process of getting there (if we ever even will).</p>
