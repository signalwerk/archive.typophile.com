    <p>I am a graphic design student, working on my final study about retro design in display fonts. </p>
    <p>I chose this topic because there seems to be a lot of new fonts on the market that owe their form to a certain decade or style. Some are direct copies of old novelty faces and some have just a hint or feeling of some era. I'm focusing especially on display fonts done during the last ten years.</p>
    <p>Here I have here some questions to which I would really appreciate some thoughts or opinions:</p>
    <p>Why now? There's no limitations in the forming of letters but still people are interested more reviving these old styles.<br>
    Is that just the point? Are designers just tired of the weird stuff that was made in the 90s?<br>
    Are the retro designers all amateurs who just make what they think will look nice?<br>
    What are the reasons for making fonts that look old?<br>
    What problems these retro fonts have?<br>
    What styles seem to be the most reproduced and what styles would you wish someone would digitalize?</p>
    <p>I would really like to hear your further thoughts and opinions on the matter,<br>
    that would be very helpful.</p>
    <p>Thanks!  </p>
    <p>Essi</p>
