      <p>As Mark infers in referencing my Helvetica article, Helvetica is indeed a retro face, and classic Modernism (the historical movement) is retro too, which is ironically appropriate for post-modern times. So until we're better able to draw a distinction between historical Modernism and being contemporarily modern, and as long as we find post-modernism unpalatably radical, retro will prevail.</p>
      <p>**</p>
      <p>Taking a narrow focus on a specific circumstance (and a point I didn't mention in my Helvetica piece): news media channels foundry typeface development, and that's a lucrative market for independent foundries.</p>
      <p>This involves a font development process that several foundries use, because it makes good business sense. It works like this: one of the major sectors in commissioning typefaces is peridiocal publishers. More so than corporations, I would say. So what happens is that a publication is being redesigned (or launched), and a new typeface is called for.</p>
      <p>Why? Because a new typeface helps to focus design efforts, and helps the product stand out from the crowd in a text-heavy medium, especially at awards competitions.</p>
      <p>However, not only is news publishing a conservative medium, but its business culture is also conservative, especially in the USA. So the kinds of faces that are being commissioned tend to be conservative revivals.</p>
      <p>These faces find their way into a foundry's retail catalogue, after a period of exclusivity.</p>
      <p>Certainly, having one's R&amp;D paid for is an offer that's hard to refuse, with the added benefit that the publication environment adds an extraordinary discipline to the design process.</p>
      <p>But the upshot is that designers who might otherwise be excogitating original types are distracted. The retail market is a speculative proposition at the best of times.</p>
      <p>Another example of "follow the market" is the demand for script fonts. Quite a different beast than news publishing. When it comes to developing script fonts, it's much easier to copy the past, because the professional skill of <em>slick</em> custom lettering has ceased to exist as a part of the graphics industry. There is, quite simply, no contemporary culture of slick script lettering. Well, perhaps that's unfair to those who do still practice the skill, but there are only a few of them, it's not like the 1950s when hand lettered scripts were an integral part of graphic production.</p>
      <p>Despite all this, there are a great many original types being published by independent foundries, and part of this may be that the demand for the classics (Garamond, Bodoni, etc.) is amply catered to by their massive distribution in software bundles with major applications and operating systems.</p>
      <p>Finally, there is the design philosophy espoused by many typographers, that new faces are not to be used, because their personality gets in the way of the art direction. In other words, the old faces have had the novelty worn off, enabling "pure design". This concept leads comfortably to <a href="http://www.studio-gs.com/default.html">default system design.</a></p>
    html_clean: |-
      <p>As Mark infers in referencing my Helvetica article, Helvetica is indeed a retro face, and classic Modernism (the historical movement) is retro too, which is ironically appropriate for post-modern times. So until we're better able to draw a distinction between historical Modernism and being contemporarily modern, and as long as we find post-modernism unpalatably radical, retro will prevail.</p>
