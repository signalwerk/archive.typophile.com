      <p>History is known to repeat itself. Innovation seems to be overrated &amp; after all, why change a winning team? Pretty much everything has been done at least once by now &amp; the only left to do is to pick up the pieces from the past &amp; -best case scenario- make a modern interpretation of them.<br>
      Our time is defined by ephemeral things; everything has to bring in as much money as possible in a very limited period of time. This leads to cheap things (eg. Paris Hilton ;-p ) that are bound to be forgotten in just a few weeks/months time. Survival is only for the strongest &amp; retro design has already proven its strength. It's an easy answer and an only constant in an everchanging world. I blame Brittney!</p>
