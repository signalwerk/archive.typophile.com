      <p>Essi<br>
      Retro design for me consists of American types for display from the 19th century, mostly wood. Wood was used for large display because it was considerably lighter than metal, fairly easy to make. Wooden type was very popular in the middle to late 19th century and into the early part of the 20th. I like the types because the designs are quite unique, rather quirky, and today, still very useful for display. Many like the types in digital form though some still use original wood. Just Google wood type and you’ll see what I mean.<br>
      Jordan Davies</p>
