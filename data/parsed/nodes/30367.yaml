    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Books" class="freelinking" rel="nofollow">Books</a> : FontBook</strong></p>
    <p>"<a href="http://fontbook.com/" rel="nofollow">FontBook</a>" is a typeface compendium in hardback published by <a href="/wiki/FontShop%20International" class="freelinking" rel="nofollow">FontShop International</a> and edited by <a href="/wiki/Erik%20Spiekermann" class="freelinking" rel="nofollow">Erik Spiekermann</a>, <a href="/wiki/J%C3%BCrgen%20Siebert" class="freelinking" rel="nofollow">Jürgen Siebert</a>, and <a href="/wiki/Mai-Linh%20Thi%20Truong" class="freelinking" rel="nofollow">Mai-Linh Thi Truong</a>. Originally published in 1991, it has been revised four times, with the latest edition published in September, 2006. This fourth edition contains 32,000 samples of fonts from 90 international <a href="/wiki/foundries" class="freelinking" rel="nofollow">type foundries</a>. It is widely considered the most comprehensive type reference guide currently in print. In addition to type samples, FontBook also contains historical footnotes (such as the type designer's name and typeface's date of creation) and cross-references to fonts of similar style.</p>
    <p><strong>Discussion:</strong><br>
    <a href="http://typophile.com/node/10440" rel="nofollow">The Next FontBook</a><br>
    <a href="http://typophile.com/node/28415" rel="nofollow">Is FontShop's new FontBook 2006 an objective reference work?</a></p>
