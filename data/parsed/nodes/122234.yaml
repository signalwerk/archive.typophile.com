  html: |-
    <p>Please share your thoughts on the pairing of the following as a serif (text type) and sans serif (display and caption type) combination for a small book of photo-graphic/typographic images:<br>
    1  Sirba and Soliel<br>
    2 Sirba and Myriad Pro</p>
    <p>My initial interest is in the complementary relationship of Sirba and Myriad Pro in terms of ascender height, x-height, character width, friendliness and readability. However, Soliel "feels" like a hybrid of Myriad Pro and Avenir that may be a bit more complementary.</p>
    <p>I appreciate any feedback based on your experiences with these typefaces.</p>
    <p>Thank you,<br>
    Judy</p>
    <p>PS: Attached sample is Myriad Pro and Avenir for Display and Constantia for Text to come as close as possible to the intended type pairing ... until I purchase Sirba and/or Soliel.</p>
    <img typeof="foaf:Image" class="img-responsive" src="http://www.typophile.com/sites/default/files/old-images/YesBob_sample_0.png" width="540" height="324" alt="">
