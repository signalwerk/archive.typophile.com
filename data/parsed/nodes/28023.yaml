      <p>The <a href="http://www.logofontandlettering.com/" rel="nofollow">Logo Font and Lettering Bible</a> by Leslie Cabarga has great practical stuff on how to design fonts and also on hand lettering. I highly recommend it. The <a href="http://typophile.com/wiki/Triumvirate" rel="nofollow">Triumvirate</a> is frequently recommended on these forums. Of those, I've read The Elements of Typographic Style. It is a good reference guide, with much practical information on font design and typography.<br>
      I have not read Designing Type nor Letter letter. The forum threads and <a href="http://www.typotheque.com/articles/designing_type_/" rel="nofollow">this review</a> have led me to believe that Designing Type doesn't have much on actual <em>type design</em> though.</p>
      <p>Eron</p>
