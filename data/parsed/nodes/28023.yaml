    <p>G'day type people,</p>
    <p>Like many before me, I want to design my first font and I would like to know where to start. I tend to learn well from books but I know there are a lot of books with a lot of type theory/history in them and not a lot of practical direction. It's the latter that I want at this stage having ingested already enough former for the moment. </p>
    <p>I have two titles in mind: 'designing type' and 'Letter letter' from typophile's forum history, these seem to be the most discussed, I am curious to know which you think would be better, or if you have any better options. I realize the best-case scenario is for me to become an expert in hand-drawing all of the typefaces from typographic history in pen and ink and completing a four-year apprentiship in sign-writing, but surely there must be a middle-way.</p>
    <p>thanks for your time and I understand if you might baulk at the prospect of answering an oft-asked question</p>
    <p>Nick</p>
