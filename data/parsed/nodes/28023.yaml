      <p>I have a copy of Letterletter. It's big on theory, abstract argument and formation of letterform via handwritten strokes, but if you want practical advice on making digital fonts, then Leslie Carbarga's work is pretty much it. He put out a companion book to the LFLB called Learn Fontlab Fast. They're both at <a href="http://www.flashfonts.com" title="www.flashfonts.com">www.flashfonts.com</a>, but IMHO the LFLB is the better book and probably exactly what you're asking for.</p>
      <p>Carbarga favours Illustrator as a drawing program, but all of the material he covers is equally applicable to FreeHand, if that's what you prefer.</p>
      <p>Having got the Karen Cheng book out of the library, I have to agree with what Eron says above, and the conclusion that Peter Bilak makes in his review. It's a book about comparisons rather than any particular process.</p>
      <p>In my own stumbling attempts to find out more I would say the advice Lucas de Groot has about interpolation of weights at <a href="http://www.lucasfonts.com/index_neu.html" title="http://www.lucasfonts.com/index_neu.html">http://www.lucasfonts.com/index_neu.html</a> is good value, as is the process documented at <a href="http://www.typeworkshop.com" title="www.typeworkshop.com">www.typeworkshop.com</a> by the lovely people at underware.</p>
