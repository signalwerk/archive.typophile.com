      <p>Wow, something else Hrant and I agree on.</p>
      <p>The Hess book is wonderfully useful in helping you understand how letterforms work with different weights and widths (and secondarily with different styles). I haven't looked at it in many years, but if I had ever tried to do a big family early on in my typographic education, it would have been invaluable.</p>
      <p>That being said, if you're going to start with just one book, Cabarga's may be more broadly useful, though it doesn't instill the same discipline of thinking about things.</p>
      <p>T</p>
