      <p>This is a difficult question. I don't think there really is a book about designing type, despite a number that make that claim. There are lots of books about looking at type, of which Karen Cheng's is a good example, and some very good books about the history of type (which were my references when I started out), but I don't think there are any books that really describe a process. I rather hope Gerry Leonidas and his colleagues teaching in the MA programme at Reading will write one eventually, based on the experience of running that programme, having been able to test theory and praxis over a number of years and with a good number of graduates working on varied projects.</p>
      <p>In the meantime, I think Michael Harvey's <em><a href="http://www.amazon.ca/Creative-Lettering-Today-Michael-Harvey/dp/1558214534/sr=8-1/qid=1157342999" rel="nofollow">Creative Lettering Today</a></em> is one of the better introductory books, and a good companions to Leslie Cabarga's <em>Logo Font and Lettering Bible.</em></p>
      <p>Although Hrant will probably come and beat me up again, I'm going to recommend Gerritt Noordzij's <em><a href="http://www.amazon.com/Stroke-Theory-Writing-Gerrit-Noordzij/dp/0907259308" rel="nofollow">The Stroke</a>.</em> But let me be very clear that I don't think one should take Noordzij's work as a prescription for creating typefaces based on calligraphic or other written forms. What I like about <em>The Stroke</em> and parts of <em>Letterletter</em> is that they encourage one to think about the elemental construction of letterforms, from the inside-out. This is not sufficient in itself to designing a good typeface, because one also needs to understand letterforms from the outside-in, i.e. from reading, but I simply don't know any other works that are as thought-provoking. These are not manuals on how to design a typeface: they are jumper cables to get you thinking about letterform construction. Even if you even up disagreeing with everything Noordzij writes, the books will have done their job.</p>
