  html: |-
    <p>My client wants me to shorten the height of the New York typeface we're using by 20%. He'd like the type to look short and wide. I really hate distorting designed type in such a manner.</p>
    <p>Does anyone have suggestions for a typeface with a low x height, thus giving it the appearance of being low in height and wide? Thanks!</p>
