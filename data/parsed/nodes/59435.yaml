      <p>If a glyph occurs in either the first or second glyph column in the cursive attachment feature, then you must define an appropriate exit attachment point for this glyph relative to all glyphs in the other column. You can't leave the dx and dy values for that exit attachment point at 0,0 because this will be interpreted as an exit attachment point with those values, not as default positioning. So to avoid more work than you need to do, only put glyphs in the cursive attachment lookups if they need to be there, i.e. if they need to connect to another glyph in something other than default positioning.</p>
      <p>I'm going to bed now, but I will revisit this discussion tomorrow. I will also bring this to the attention of Sergey Malkin, the VOLT programmer, who may have other advice.</p>
