      <p>Here are some more images, showing the stages of defining a cursive attachment lookup in an Arabic font. In illustration 1, we have created the lookup and defined it as a cursive attachment lookup from the drop down list of GPOS lookup types. This automatically creates the two column layout for 1st and 2nd glyph and the 'exit' attachment point. We have also set the lookup display direction to RTL. At this stage, all the values are still at 0, and you see that the two glyphs are overlapping, this is because the values are saying that the exit attachment point at 0,0 is the same as the entry point.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/msartcurs1_5286.gif"></div><br>
      _<p></p>
      <p>It is helpful to remember that entry and exit are not directional concepts within the GPOS lookup. When designing Arabic glyphs, we may be thinking about them in terms of right-to-left connections, but just as all positive directions in glyph space are reckoned from left-to-right (and bottom-to-top), so entry and exit are reckoned in terms of left side and right side. So even though, from an Arabic script perspective the connecting stroke enters from the right and exits to the left, in VOLT we are actually defining an 'exit' attachment that is on the right side of the 2nd glyph. [I think I've got that right: it confuses me too sometimes!]</p>
      <p>Now here's illustration 2, in which we have defined the dx position of the exit attachment point. In this font, this is equivalent to the advanced width of the 2nd glyph (344 units), which is convenient. In other words, the glyph has been spaced so that the horizontal position of attachment point is directly on the right sidebearing. You see that when this is applied the 2nd glyph shifts to the left. In effect, you are saying that the horizontal position of the exit on the right side of this glyph is aligned to the left sidebearing of the first glyph, whose own dx value remains 0. [If you had not designed and spaced the glyphs so that they fitted together neatly when the sidebearings align, you would need to make many more adjustments to dx values for both 1st and 2nd glyphs, which gets very messy. In order to make cursive attachment positioning easy, it is important that the initial spacing be appropriate and consistent; this is also true, of course, for mark positioning and other kinds of GPOS.]</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/msartcurs2_4909.gif"></div><br>
      _<p></p>
      <p>Finally, here is illustration 3, in which the dy coordinate has also been specified. This says that the attachment position is 508 units <em>up</em> on the right side of the 2nd glyph. So of course this means that the glyph shifts <em>down</em> relative to the first glyph.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/msartcurs3_5917.gif"></div><p></p>
      <p>-</p>
      <p>Although we are always looking at two glyphs together, and can scroll through the 1st glyph column to see the 2nd glyph in context of all 1st glyphs in the lookup, it is important to remember that there is only one exit attachment point on this second glyph. If you change the values when looking at one pair of glyphs, it will affect all the other pairs of glyphs involving the same 2nd glyph. In other words, cursive attachment positioning is similar to mark anchor attachment positioning, not similar to kerning pair adjustments.</p>
