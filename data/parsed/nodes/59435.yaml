    <p>Hello all,</p>
    <p>I'm working on an Arabic Naskh Font. I want to add cursive attachment to the glyphs.</p>
    <p>Here are some confusions I have regarding Cursive attachment:</p>
    <p>1. Do I need to define cursive attachment to all INIT, MEDI and FINA glyphs to all the other INIT, MEDI and FINA glyphs. (I think that is a lot of tedious work).</p>
    <p>2. What will happen to the marks attached to the glyphs e.g. will they move up with glyphs or stay in there place, potentially colliding with the base glyphs.</p>
    <p>Please suggest links to any step-by-step detailed tutorials. I have seen all the material provided by VOLT site, but can't find the answer.</p>
    <p>I would humbly request Mr. John Hudson to write a detailed tutorial on cursive attahment in the context of Arabic fonts.</p>
    <p>Thanks.</p>
