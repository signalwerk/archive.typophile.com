      <p>[Moderators : this discussion probably belongs in the Build forum.]</p>
      <p>First the easy part: in answer to your question 2, the mark positioning lookups should be ordered after the cursive attachment lookups (mark-to-base/ligature and then mark-to-mark positioning should always be the last GPOS operations). The mark positioning will be relative to the cursive attachment positions.</p>
      <p>Here is an image of a VOLT cursive attachment lookup for Arabic attachments:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/msatcurs_5026.gif"></div><p></p>
      <p>I've chosen the yeh_meem ligature for illustration purposes, since it has the most dramatic height adjustment in this font (MS Arabic Typesetting). Let's look at the image carefully, as the way VOLT handles cursive attachment positioning isn't very intuitive.</p>
      <p>The first thing to note is that we're only defining ‘exit’ attachment points, and the adjustments are all being applied to the second glyph (the left glyph in this case, since we're dealing with a RTL lookup direction). The values are positive, but visually the glyph in the GPOS window is moving left and down. If you have designed and spaced your glyphs appropriately, the dx ajustment can always be equivalent to the advance width of the glyph, which is helpful and saves time.</p>
      <p>You don't need to define cursive attachment for all the initial, medial and final combinations in your font: only those that require something other than default positioning. However, note that any glyphs that do occur in the cursive attachment lookup must be provided with attachment positions to every other glyph in the lookup to which it might be expected to connect in text. Beware of stray default values within the lookup, as these will produce collisions and overlaps.</p>
      <p>As you can see from this lookup image, it is possible to use glyph groups as you would for mark positioning.</p>
      <p>This is somewhat less than a ‘detailed tutorial’, but hopefully it is helpful. Once one knows how to set up the VOLT lookup, the rest can be learned from trial and error.</p>
