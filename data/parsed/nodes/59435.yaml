      <p><em>One thing that I inferred from this discussion is that I might need to break my cursive lookups into various categories to ease the development and reduce redundant combinations.</em></p>
      <p>If you are doing this, remember that cursive attachments are like mark anchor attachments: once you set them in one lookup, the values are inherited by any other lookup containing the same glyph in the same column. If you change the exit coordinates for a glyph in one lookup, it will also affect the same glyph in other lookups.</p>
