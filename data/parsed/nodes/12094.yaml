  html: |-
    <p>On April 16th 2005, a project <strong><a href="/wiki/Diacritics%20Project" class="freelinking" rel="nofollow">Diacritics</a></strong> was introduced to attendants of a conference  <a href="http://typographicbeirut.lau.edu.lb/" rel="nofollow">Typo.Graphic.Beirut</a> by Filip Blažek. The aim of this project is to build a free on-line database of knowledge and experience -- how to design correct diacritics: what size, shape and position an accent should have. Text concerning the history, use, languages and also some technical information is related to each diacritical mark. The project web site is based on wiki: after a simple registration, anyone can append or correct any published text or upload pictures. There is no need for special knowledge of HTML code, the editing is also similar to Wikipedia. </p>
    <p>The project (in English only) is on-line at <a href="http://diacritics.typo.cz" rel="nofollow"><strong>diacritics.typo.cz</strong></a>. </p>
    <p>Contributions are welcome.</p>
