      <p>I think your version is a definite improvement on the crowd-sourced logo, but you could push it a little further.</p>
      <p>I agree with hrant, the city landscape doesn't really say equalizer to me at the moment, take a look at this for inspiration: <a class="freelinking external" href="http://www.shutterstock.com/pic-6704374/stock-vector-graphic-equalizer-vector.html" rel="nofollow">http://www.shutterstock.com/pic-6704374/stock-vector-graphic-equalizer-vector.html</a></p>
      <p>I also think you've lost something by focusing on the very top of the space needle, making it less identifiable. Perhaps try another version showing more of the space needle, as in the first logo version.</p>
      <p>And, as hrant stated, the spacing on 'Jet City' needs some work. </p>
      <p>Hope that helps</p>
