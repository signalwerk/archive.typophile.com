      <p>Regarding size and style, it is worth noting that the new Win8 Metro UI makes use of some larger sizes than previous versions of Windows. In the Metro start pane, the text is notably large, and numerals in particular feature large in mobile device displays for things like time and date displays. So the change to the design of the numerals probably relates to this, and the desire to make the forms more sensuous at the larger sizes.</p>
      <p>Of course, what would be cool would be size and resolution dependent shapes for letters like I, so that the bars could be present at small sizes but removed at large sizes for display use. This is the sort of thing that one could have done with hints in a binary rendering, but which is difficult to control in today's subpixel and asymmetric greyscale environments.</p>
