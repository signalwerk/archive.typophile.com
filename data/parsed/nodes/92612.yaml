      <p>@HP "Maybe Apple showed the way: Style &gt; Substance"</p>
      <p>Really! I know it's a silly question, and its not as if i relish the opportunity to staple  your tongue to a belt sander more than once a week, but please elaborate.</p>
      <p>@JH "Of course, what would be cool would be size and resolution dependent shapes for letters like I, so that the bars could be present at small sizes but removed at large sizes for display use."</p>
      <p>This is still cool on the Mac OS. And I think "letters like me" is proper English.</p>
      <p>"This is the sort of thing that one could have done with hints in a binary rendering, but which is difficult to control in today's subpixel and asymmetric greyscale environments."</p>
      <p>You really mean rendering's gerfucked on windows. On the mac OS, it's still possible for the type designer to make serifs disappear without the user changing either OS or rendering technologies, and on the mac iOS sufficient resolution obviates the need. Compare and contrast;)</p>
      <p>Or... recall past opinions that "competitive" rendering helps users?  There is no competition between the Mac and windows or between windows and anything other than windows. I think it's pretty clear that the competition between windows XP rendering, windows Vista rendering, windows 7 rendering and windows 8 rendering... is what's "kilt" windows, with the replacement of efficient instructions like Mirp by do-it-yourself (and processor-intensive) instructions like Msrp leading the massacré.</p>
      <p>"Hopefully there will be a blog post at some point that describes the various font updates in Windows 8."</p>
      <p>Sounds delightful, drool-bucket ready, can't wait for 2016.</p>
    html_clean: |-
