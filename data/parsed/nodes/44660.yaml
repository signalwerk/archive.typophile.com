    <p>Hello!</p>
    <p>This is a very nice set of I believe cca 1800s poster types.<br>
    I have identified most condensed ones as Hoefler Knockout variations, some Poplar, Ziggurat I believe, Bodoni poster etc.</p>
    <p>I have circled the ones I still can't figure out - the image is small I know.<br>
    If you have any ideas please share.</p>
    <p>p.s. - the photo I believe is from an advert for entr'acte music label...</p><div class="imageWrap"><img src="http://typophile.com/files/victoriana_5952.jpg"></div><p></p>
