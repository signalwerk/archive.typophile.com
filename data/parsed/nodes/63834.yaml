    html: |-
      <p>I like the feel of this face its sharp and crisp but I don't think the lowercase s fits with the rest of the characters. It's to soft. I can see what you are trying to do, but I'm not sure it works. Also in the text setting the i and j dots seem a little obtrusive.<br>
      The g reminds me to much of Minion.The lowercase x looks broken I think the strokes are offset to much. </p>
      <p>I think sharp and crisp are the key characteristics of this typeface and this direction should be pushed. Think of Frutiger's Meridian. This would mean a rethink of the foot serif on a, and another look at s.</p>
      <p>But my initial impression remains "I like this" so keep going"</p>
