    html: |-
      <p>Interesting work. You probably need to think through the homogeneity of the work, no? What makes your font a font rather than characters thrown together? Try to group them like that</p>
      <p>aeg eoc obdpqg hklf ars sz kvwxyz lijt hmnu...</p>
      <p>and so forth, to see what does and does not pair up. Do the same exercise on a quality font (Garamond Premier ?) and a bad one (say, ITC Garamond) in order to see what works and does not. Does it also on fonts in a very different genre to get a better eye.</p>
      <p>Then, IMVHO, you'll see the changes you need to make and why other people have suggested them.</p>
