    <p></p><div class="imageWrap"><img src="http://typophile.com/files/preview_4257.PNG"></div><p></p>
    <p>This is my first actual font, though I've drawn some letters before in Illustrator. I have used a broad nib pen before, and handled a copperplate pen, if that matters. This is intended to be a Garamond-like text face. I tried to make the lower serifs somewhat triangular too.</p>
    <p>I drew all the letters right in fontforge, which I've never used before. It's a bit slow-going, and I also happen to be a perfectionist. If you know about font files &amp;c, you can email me, and I can send you a copy to comment on.</p>
    <p>Anyway, you can critique anything, so I'll know if I'm doing something wrong.</p>
    <p>Briän.</p>
