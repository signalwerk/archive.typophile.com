    html: |-
      <p>Okay. I have posted another preview - I'll make a PDF when I get home. (At the Library right now.)</p>
      <p>Why make a text font? Because I've never made one before; I'd like to make a font I at least can use regularly. I really don't have an extreme amount of display fonts I use. I suppose I don't have much to say about what new thing my font has to offer. I thought of that, though. I suppose it will add just as much as any other text font that has been released -- a different flavor.</p>
      <p>I don't think mixing different style elements is bad, per se, as long as they mix well. Though many of those were unintentional. I reworked all of the letters, just about. I think it's better, though I printed a test at text sizes, and I'm sure the eye is too small on the 'e'.</p>
      <p>The diamond dots are a bit of an experiment, though I think if I'm keeping them, I need to soften the corners a bit.</p>
      <p>Thank you for the critiques, that's been helpful. (Maybe I should change the 's'.)</p>
      <p>Briän</p>
