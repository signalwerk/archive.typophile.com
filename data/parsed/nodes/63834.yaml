    html: |-
      <p>Okay, you definitely asked for it ;-)</p>
      <p>Making text fonts is the high art of typography, way more difficult than display fonts. So why would you make your own text font? There are so many excellent ones around. What's so new about yours that the world (or you) should have it?</p>
      <p>Your font mixes different style elements from different eras of fontmaking. There are many Geralde (Renaissance) characteristics in it (slanted axis in o and e, wedge shaped upper serifs). The "a" OTOH reminds me of modern (classicist) fonts like Century Schoolbook. The "s" borrows from Cheltenham, the "k" even from Walbaum. The bottom serifs are mostly too pointy. In summary, I see no concept in your font, except for using a diamond shaped period and i-dot. You could rather take a Garamond or Minion and replace round dots by diamonds if that is what you're after (remember to check the font licenses first!).</p>
      <p>Sorry to be so direct - I'm not American ;-)</p>
      <p>Andreas</p>
