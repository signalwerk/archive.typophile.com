      <p>Khaled</p>
      <p>If I typeset <code>$\hat{H}$</code> in Computer Modern, the H is taken from CMMI10 and the hat is taken from CMR (the mathematical accents are always upright glyphs). To look at the metrics of the CMMI10 fonts, I need only type <code>tftopl cmmi10.tfm</code> in any shell window. If I look at the lines concerning H, I get<br>
      <code><br>
      (CHARACTER&nbsp;C&nbsp;H<br>
      &nbsp;&nbsp;&nbsp;(CHARWD&nbsp;R&nbsp;0.831251)<br>
      &nbsp;&nbsp;&nbsp;(CHARHT&nbsp;R&nbsp;0.683332)<br>
      &nbsp;&nbsp;&nbsp;(CHARIC&nbsp;R&nbsp;0.081248)<br>
      &nbsp;&nbsp;&nbsp;(COMMENT<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;[...]<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;)<br>
      &nbsp;&nbsp;&nbsp;)<br>
      </code><br>
      where I skip the comment. There are three values, CHARWD, the character width, CHARHT, the height, and CHARIC, called the italic correction. That is consistent with this description of the the way <code>\hat{H}</code> is typeset, taken from  Bogusław Jackowski's slides (<a class="freelinking external" href="http://www.gust.org.pl/projects/e-foundry/math/index_html" rel="nofollow">GUST</a>). Here are the two glyphs at stake<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Handhat_3546.jpg"></div><br>
      and here is \hat{H}.<br>
      <div class="imageWrap"><img src="http://typophile.com/files/hatH_3642.jpg"></div><br>
      No other parameter can be used because there is none. <p></p>
      <p>Now if you look at the information on Opentype math fonts mentioned in <a class="freelinking external" href="http://fontforge.sourceforge.net/math.html" rel="nofollow">http://fontforge.sourceforge.net/math.html</a>, each math character still has a height, a width and an italic correction, but there is an additional parameter for the top accent which allows more precision. Am I missing something?</p>
      <p>Michel.</p>
