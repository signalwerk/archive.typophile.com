    html: <p>I am just saying there is no need to make them look like they are attached. Their position in mathematical fonts is determined by the "Top Accent Attachment" (see the <a class="freelinking external" href="http://fontforge.sourceforge.net/math.html" rel="nofollow">Math Fontforge doc</a>). I am just a user of mathematical fonts, with LaTeX. I never implemented those things, not even for LaTeX. You guessed correctly, derivatives are much more often denoted with apostrophes than with dots. The dot notation is used in some parts of mechanics, in particular in the so called Hamilton equations where the dotted x is semantically a variable and then the argumentation would  get quite tricky.</p>
