    html: <p>Hrant, it isn't a question of making the accent-like mathematical operator look either attached or detached from whatever is below them, but of the specific conventions of alignment of operators and operands in mathematical typesetting. In mathematical typesetting, one is frequently dealing with both horizontal and vertical layout, and generally speaking what is true of alignment of larger, more complex expressions is true of alignment of smaller combinations within them. Hence, the centre alignment of the accent-like operators to top of whatever is below them is the same as the alignment of the top part of an expression to the lower part. This means, among other things, that the distance between the accent-like operator and what is below does not affect the horizontal offset above an italic form. So, for instance, looking at Michel's italic H example, you can see that if the accent were raised or is something else were placed above it, this would be a straight vertical shift or alignment, not a slanted move or offset.</p>
