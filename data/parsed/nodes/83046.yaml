      <p>I think something must have happened to the encoding when I posted it. Try making your own. Combining diacriticals are accents with zero width and a left offset. If the font doesn't have proper combining diacriticals, this trick won't work . . . which is why your should stick to Corbel, Consolas, Calibri, Cambria, Candara, Deja Vu, Segoe or Times New Roman.</p>
      <p>I used OpenOffice to construct them. After each R, I used the insert symbol command, chose "combining diacriticals" and selected the appropriate accent.</p>
