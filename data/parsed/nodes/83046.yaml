      <p>If your dotted R is a rate of change, then your text is using  <a class="freelinking external" href="http://en.wikipedia.org/wiki/Newton%27s_notation" rel="nofollow">Newtons's notation</a>. The dot and double dot are then mathematical accents and their centering differs from that of text accents. Here is an example taken from Vieth, <a class="freelinking external" href="http://www.ntg.nl/maps/26/27.pdf" rel="nofollow">Math typesetting in TEX: The good, the bad, the ugly</a>. On the right is the V with the mathematical accent circumflex.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/accentedV_6153.jpg"></div><br>
      Moreover, if R with a dot above is a mathematical formula, then the R should normally be in italics except in France.<p></p>
    html_clean: |-
      <p>If your dotted R is a rate of change, then your text is using  <a class="freelinking external link-external" href="http://en.wikipedia.org/wiki/Newton%27s_notation" rel="nofollow">Newtons's notation</a>. The dot and double dot are then mathematical accents and their centering differs from that of text accents. Here is an example taken from Vieth, <a class="freelinking external link-external" href="http://www.ntg.nl/maps/26/27.pdf" rel="nofollow">Math typesetting in TEX: The good, the bad, the ugly</a>. On the right is the V with the mathematical accent circumflex.<br>
