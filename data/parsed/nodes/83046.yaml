      <p><cite>Am I missing something?</cite></p>
      <p>Not really. Accent positioning is refined in a similar manner to GPOS accent positioning. Accents each have a center position defined via 'Top Accent Attachment'(optically centered in most cases) and each base can also have a center position defined; these two positions are aligned on the <em>x</em>-axis, and are displayed. If a base glyph does not have an entry, then accents are simply centered. For those who don't know, accents can also be mapped to alternates via the [flac] feature ('flattened' accents, analogous to cap-variants of accents) and also to horizontal, or wide variants for placement over wider glyphs (the Math handler measures the base glyph and then uses the most appropriate accent variant). Note that the Top Accent Attachment is really only an <em>x</em>-axis value, unlike a GPOS anchor, which has both <em>x</em>- and <em>y</em>-coordinates. <em>y</em>-positioning is dynamically achieved by measuring the base glyph as well as other elements (eg. stacked accents), whether you're in a display mode or not etc.</p>
      <p>As to fonts that support what Gus wants, he's probably already figured that out, which if you are using (Windows) Word 2007/2010 would be Cambria Math (Word defaults to this when you enter a Math zone) or Maxwell Math, when its released. For outside a Math zone, one would need a font with fairly robust GPOS accent positioning, such as Times or Arial or...?</p>
