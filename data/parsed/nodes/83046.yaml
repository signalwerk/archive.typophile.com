      <p>@Michel: The comment under the second figure is wrong, "italic correction" should be "kern" (in CM fonts the skewchar is usually the tie accent), it actually makes no sense as it is since the italic correction is a fixed value for each character regardless of what is next to it (though it get only applied when switching from italic to upright). I just checked rule 12 in Appendix G of The TeXbook and it states:</p>
      <blockquote><p>
      <strong>rule 12</strong>. If the current item is an Acc atom ... If the nucleus is not a single character, let $s=0$; otherwise set $s$ to the kern amount for the nucleus followed by the <code>\skewchar</code> of its font.
      </p></blockquote>
      <p>If you checked the kerning on the top of the PL file you will see:<br>
      <code><br>
         (LABEL C H)<br>
         ...<br>
         (KRN O 177 R 0.055557)<br>
      </code></p>
      <p>the character with octal code 177 is the skewchar. In MS implementation a dedicated field is used instead of (mis)using kerning (I guess knuth just wanted to keep the TFM file compact for the obvious reason of that time).</p>
