      where I skip the comment. There are three values, CHARWD, the character width, CHARHT, the height, and CHARIC, called the italic correction. That is consistent with this description of the the way <code>\hat{H}</code> is typeset, taken from  Bogusław Jackowski's slides (<a class="freelinking external link-external" href="http://www.gust.org.pl/projects/e-foundry/math/index_html" rel="nofollow">GUST</a>). Here are the two glyphs at stake<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Handhat_3546.jpg"></div><br>
      and here is \hat{H}.<br>
      <div class="imageWrap"><img src="http://typophile.com/files/hatH_3642.jpg"></div><br>
      No other parameter can be used because there is none. <p></p>
      <p>Now if you look at the information on Opentype math fonts mentioned in <a class="freelinking external link-external" href="http://fontforge.sourceforge.net/math.html" rel="nofollow">http://fontforge.sourceforge.net/math.html</a>, each math character still has a height, a width and an italic correction, but there is an additional parameter for the top accent which allows more precision. Am I missing something?</p>
      <p>Michel.</p>
