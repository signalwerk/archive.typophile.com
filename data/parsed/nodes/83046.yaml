      <p>Assuming your Word file is the final version, then the EQ field is fine. </p>
      <p>But if you're subsequently sending it to a publisher/typesetter who are going to import it into some other application, it might break. Either the combining accents, or a regular spacing accent kerned back over the R (which you can still also do in Word) should at least survive the transfer into another system (and the latter would be less dependent on picking a font with a large character set).</p>
