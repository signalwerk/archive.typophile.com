      <p>I forgot to mention that IPA also requires a couple of lowercase Greek letters. The absolute necessities are U+03B2 Greek Small Letter Beta, U+03B8 Greek Small Letter Theta, and U+03C7 Greek Small Letter Chi. Other ones that get used frequently in linguistics are uppercase and lowercase gamma, uppercase and lowercase delta, uppercase and lowercase pi, uppercase theta, uppercase and lowercase sigma, uppercase and lowercase omega, lowercase alpha, lowercase lambda (counterpart to U+019B Latin Small Letter Lambda with Stroke), and lowercase rho.</p>
      <p>The “with Palatal Hook” letters in the Phonetic Extensions Supplement are not used anymore, but they may be necessary for quoting older linguistic work. The superscripts in that same block are definitely in use, as are the diacritics in the Combining Diacritical Marks Supplement just afterwards.</p>
