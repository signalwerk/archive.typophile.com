    <p><strong>Updated description</strong>: this is a contemporary serif family I'm working on since January 2010. It was initially just for personal use, but the project grow up to embrace complete Latin, Cyrillic and Greek scripts, besides phonetic alphabets, arrows and dingbats.</p>
    <p>It's a text font and the family is planned to have several weights in roman and italic versions. I believe it will be released in early 2013.</p>
    <p>Goals:</p>
    <p><strong>1</strong>. it must be suitable for books and magazines, with more contrast than contemporary typefaces like Meta Serif, Greta Text or Stuart.</p>
    <p><strong>2</strong>. it must be clean and legible, with high x-height, generous counterspaces and reduced ornamental elements.</p>
    <p><strong>3</strong>. it must produce a strong horizontal impression, with well defined lines like the ones achieved with Guardian Text, Utopia or Charter, for example.</p>
    <p><strong>4</strong>. it must be adequate to academic, legal and technical texts with harmony between usual text, numeric data and acronyms.</p>
    <p>Many glyphs have alternate designs, as |a|b|f|g|q|y|W|Ж|К|. Target sizes are 9 to 32pt. Small caps are taller than usual. Petite caps are also included. Numbers, currency symbols and related signs are available in 10 variations. Palimpsest is a codename.</p>
    <p><em>Comments are very welcome</em>.</p>
    <p><strong>Historic</strong><br>
    2010.01: lowercase a-f, h-j, l-u.<br>
    2010.02: lowercase complete, marks and basic diacrits.<br>
    2010.03: uppercase complete, punctation, European languages.<br>
    2010.04: small caps, numbers, non European languages.<br>
    2010.05: figurine variations, bullets, dingbats, fine-tuning.<br>
    2010.06: many symbols and additional language support added.<br>
    2010.07: numbers and currencies in ten styles.<br>
    2010.08: general revision, mathematical operators, symbols.<br>
    2010.09: combining diacritics and precomposed glyphs.<br>
    2010.10: spacing, African languages, dingbats, fractions.<br>
    2010.11: support for many non-European languages and IPA.<br>
    2010.12: complete revision, UPM set to 2048.<br>
    2011.01: dozens of glyphs added to increase language support.<br>
    2011.02: first Cyrillic and Greek drafts.<br>
    2011.03: linguistic additions. Glyph naming revision.</p>
    <p><strong>Workflow</strong><br>
    Initial lowercase design was made in Illustrator CS4.<br>
    Further development was done completely in FL Studio 5.<br>
    Final work will need FL Studio 6 due to the large number of glyphs.</p>
