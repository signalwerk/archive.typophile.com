    html: "<p>I like the sans; its proportions are clear and open, easy to read, nicely humanist. I'm undecided about the curve at the top of the tall letters, though: they seem too... playful? They match the n-letters, but they're functional there (opening up the notch). The bottom of the stem of b should be opened to match the n. Maybe the bottom of the e might want to go out a bit, so that it isn't so clearly just a cutaway from the o. But again, it's nice, clean work.</p>"
