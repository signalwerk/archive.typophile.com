      <p>Actually, the project is running normally during all this time. But I did not post new PDFs because I still need to complete the language support –and don't want to show an incomplete result.</p>
      <p>Let me explain: I decided to make this font support all languages which use Latin script. This is a huge task as it includes all Unicode blocks for Latin, besides some IPA glyphs. There are also many glyphs outside Unicode so I did some research about less known languages and its alphabets.</p>
      <p>As I included petite caps and swashes, each character has five glyphs –uppercase, lowercase, small caps, petite caps and swash. Thus, the project is going far away the 3,000 glyphs with support for more than 200 languages and transliterations schemas. This is still under construction.</p>
      <p>BTW, some other parts are complete. All glyphs already made in June were revised and improved. Numbers and associeted figures Punctuation varies accordingly to case and is complete. Arrows, bullets, chess figures and Roman numerals are also ready. Ornaments, dingbats and enclosed numerals are 40% OK.</p>
      <p>I still not decided if IPA and APA will be supported in the first version.</p>
      <p>Thank you very much for your kind message. It will be a pleasure to know you used this font to lay out your brother's book. Hope the font plays as good as you expect.</p>
      <p><em>Sidenote:</em> my team is Internacional, reigning Champion of South America. It seems you like soccer a lot to know about our local teams!</p>
