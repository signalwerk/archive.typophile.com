      <p>Firstly, I must apologize for the lack of updates and answers –especially to Bendy, Andreas and Jasper, who kindly made observations which I'm answering just now.</p>
      <p><strong>Bendy</strong>: you're right, I ran out of space. Even using mark and mkmk OpenType features to build up diacritical combinations, I'll need more room than FL Studio 5 can give me. But the 6,000 glyph limit will be increased in its next version –and probably FL6 will be release much before I could complete the font. So, no problem here.</p>
      <p><strong>Andreas</strong>: I carefully considered all your points and hope the glyphs are better now. Your suggestion about pen exercises is very good. I plan to do this to improve curves and flows –by now, the font is designed directly on screen, without any paper/pen support.</p>
      <p><strong>Jasper</strong>: I really appreciate your detailed and insightful critique. Of course, I did <em>not</em> ignore any comment in this thread, all them helped me a lot. Some problems you noticed were already fixed and many others were addressed.</p>
      <p>Top of |a| was actually not flat, but the curve was so subtle it may cause this impression. Now it's sligth rounder and the same treatment was applied to some other glyphs, as |Ɛ|Ʒ|ɛ|. There are also improvements in |g|t|f|c|e|C|G|O|, not to mention all the other Latin Blocks (Extended A, B, C and D).</p>
      <p>I just disagree about the flat bottom of |V|W|v|w|. This is quite common and there is a number of fonts with this approach –Bembo, Miller, Arno, Utopia, Freight, Glosa, Le Monde, Orbi, Kepler, Tabac, Tanger, Andron and so on. It's more typical to modern and clarendon styles, and less common between garaldes and venetians. Anyway, I improved a bit the colour of |w|.</p>
      <p>Some samples to follow:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/acefg_4061.gif"></div><p></p>
      <p><em>Improved lowercase glyphs.</em></p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/stranges_4051.gif"></div><p></p>
      <p><em>Improved extended Latin glyphs.</em></p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/hooked_5720.gif"></div><p></p>
      <p><em>Improved glyphs with hooks.</em></p>
