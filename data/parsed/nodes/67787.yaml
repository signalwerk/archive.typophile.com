      <p>Thanks Bendy! Another great feedback.</p>
      <p>I immediately agreed with most of your observations. This shows how important is to have a fresh eye critisizing the work. After hours doing and redoing a glyph, you becomes very used to it and tends to think it's OK.</p>
      <p>Now I'm in a crossroads. I just began to design uppercases and agree it must be better to have them to solve problems already found in lowercases. But I'm also in doubt about the weight of the font.</p>
      <p>While designing in IL and FL, it looked OK for the regular version <em>(main stem=84)</em>. But the generated OT prints lighter than I want (and also is lighter in InDesign and PDF text samples). This difference may be due to hinting. As the auto tool in FL is not enough, I did manual hinting to /a/n/ glyphs with optimal results.</p>
      <p>Thus I think the next step is to hint at least some glyphs to get real tests and then choose the general weight. After that, I'd create the UC set. What do you think?</p>
      <p>Anyway, the next update will took a while because I'm migrating the whole project to FL.</p>
