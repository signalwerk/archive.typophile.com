    html: |-
      <p><em>Just a humble opinion I shouldn't write in the first place.</em></p>
      <p>Ok first of all: This is a really great looking font. Hats down to you Freiberger. And to say the least this is one of the most glyph complete font (if not <strong>the</strong> most). I don't think that even Adobe produces this many glyphs in their Pro versions.</p>
      <p>On the other hand I question this decision to make it so very much complete, because on one hand your font has been completed long ago (probably 10% of your time) in a sense that would cover &gt;90% of all Latin writing languages. The remaining 10% is now taking you the other 90% of time. I don't think you'll be able to compensate this 90% of time spent on seldomly used letters.</p>
      <p>Do you think you'll be able to finish all seven weights (28 fonts alltogether as you talk about) in 3 years (one has passed by and you're talking about 2 more)? US$ 25 per font is still not cheap even though they're very VERY glyph complete.</p>
      <p>I think you're <em>over-engineering</em> this a bit too much. But you should know best. And regarding your alternates. I guess you can't decide which ones to keep so you're keeping them all. Maybe that's not the best way of doing it. Choose only those that best fit this family. Think of the sheer amount of ampersands in the family. 1 is standard, 2-3 is nice 4-5 is great, 5+ is overwhelming.</p>
      <p>But put all these aside: <strong>Wow! This font (when finished) will definitely define put you in the typographic space.</strong></p>
