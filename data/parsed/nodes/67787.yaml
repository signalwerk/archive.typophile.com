      <p>I did post a new PDF. Now the version is 0.85, with 10 figurine variations: lining, oldstyle, small caps, petite caps and uppercase, each one in proportional and tabular sets.</p>
      <p>Numbers plays an essential role in this font (as already said in the first post). It's my aim to keep an even and horizontal effect. Actually, I believe numbers are distracting in most fonts. Lining figurines tends to be very tall and oldstyle tends to seem misaligned in a technical text with large number and acronym usage.</p>
      <p>I changed the /r/ terminal and begun to include ligatures. There are also arrows, bullets and asterisks. Punctuation is complete and varies to uppercase and small caps. I also included an alternate /3/.</p>
      <p>Petite caps are incomplete so they are not in this specimen. Still lacking: some dingbats, chess figurines, swashes and indexes (negative type inside geometric contour).</p>
      <p>This version is still unkerned. This will be the last job, to be done in June.</p>
