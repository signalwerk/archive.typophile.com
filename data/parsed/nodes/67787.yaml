      <p>In <a class="freelinking external" href="http://www.typophile.com/node/72819" rel="nofollow">another thread</a> you asked about the glyph-set needs for specialized academic typesetting. Here is one area that I have some experience with.</p>
      <p>For ancient Roman epigraphy, you need most of a basic Latin alphabet, both uppercase and lowercase with dots underneath. Most diacritical forms do not need dotted equivalents, but the vowels with acute accents do (albeit rarely). Usually this is done in roman type, but I've seen it with italic also. I think (in terms of software compatibility with the feature) this can now all be done with the combining dot under (U+0323) and mark placement, although some of them are visually equivalent to characters in the Latin Extended Additional block. You also need the ancient symbols block (U+10190 to U+1019B), the old forms of Roman numerals (U+2180 to U+2188, and probably the rest of the Roman numerals in Unicode for compatibility), and some miscellaneous letters in Latin Extended-D (U+A7FB to U+A7FF) and elsewhere (U+2132, U+214E, U+2C75, U+2C76). For at least the lower Roman numerals (I, V, X), and possibly all of them, you need two forms, with and without overscores. People also use a plethora of different shapes of brackets, including some that resemble U+02F9 and U+02FA (but functioning as brackets rather than as tone markers). Finally, it is sometimes important to note reversed letters, so a reversed (flipped right-to-left) Latin alphabet would also be useful. No doubt I'm forgetting some important things, but this gives you the highlights.</p>
      <p>Since you aren't including Greek, you don't have to worry about all the additional glyphs you would need for ancient Greek epigraphy!</p>
      <p>Now I honestly do not think this is worth your time from a commercial point of view. This is a very specialized topic. If you produced a typeface with really good coverage for Latin epigraphy, you <em>might</em> sell an extra 5 or 10 licenses, but that wouldn't pay for the time it would require to make all those glyphs. Also, for topics like ancient history publishers generally prefer typefaces that are what might be called "updated old-styles", such as Sabon and Minion, rather than more contemporary styles such as your design.</p>
