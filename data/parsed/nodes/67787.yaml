      <p>Updated version, now using FontLab and with lowercase diacritics added (almost all already available, a few ones still need revision). All the changes in glyph design were small, except in the middle of /w/. I also inverted the alternates.</p>
      <p><strong>Changes</strong><br>
      /e/ botton curve matches /c/, top curve a bit tighter.<br>
      /f/ larger right serif.<br>
      /k/ ticker diagonals.<br>
      /r/ terminal and arm are thicker.<br>
      /s/ central portion a bit thinner.<br>
      /w/ higher middle, near to x-height.<br>
      /x/ right upper diagonal repositioned.<br>
      /y/ descender slight bigger, less round and using overshoot.<br>
      Marks a bit smaller.</p>
      <p>The PDF sample is available in the first message.</p>
