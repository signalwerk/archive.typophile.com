      <p>Hey Igor, this is looking great. I love the way you're making such an effort to get all these uncommon glyphs correct. </p>
      <p>I'm looking at Version 085. Here are some questions...I'm not familiar with some of these but here's what strikes me:<br>
      • The curves on cedilla look a little loose...I'd make it more like the bowl of 5. You're definitely more familiar with this one than me though.<br>
      • /hcircumflex/ did you see the thread <a href="http://www.typophile.com/node/68302" rel="nofollow">here</a>? It looks like the diacritic may be too close to the stem?<br>
      • /iacute/ and /jjacute/ diacritic is sliding off?<br>
      • Dots of dieresis look widely spaced.<br>
      • /ohorn/ is the horn big/dark enough?<br>
      • /Thorn/ has a different bowl to /P/?<br>
      • Bar of /Tbar/ is quite high?<br>
      • /Khook/ looks a bit hungry, like it's overstretching the arm to grab the next letter...would it be appropriate to bring in that arm slightly to rebalance?<br>
      • Similar thing with /Uhorn/; I'd shorten the right serif to bring the horn into balance, I think.<br>
      • Any chance of including yogh, hwair and wynn? I don't know why, but they might be fun to draw :)</p>
