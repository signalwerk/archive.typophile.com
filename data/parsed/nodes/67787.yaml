      <p>Thanks again, David. You convinced me. Actually, I already tried to keep the vectors simple at IL, with both nodes and handles at integer positions. Handles are also almost all orthogonal (0º/90º).</p>
      <p>When possible, I tried to follow a 4x4pt grid because 4 is the minor common divisor between the two systems of type measure (1000x2048) and this may help a later version destined to screen with TT hinting. Anyway, this is just a strange idea I had, not sure it causes practical results.</p>
      <p>But it must be better to do the entire job in FL for the reasons you did explain so clearly. As I'm a hobbyist type designer, the extra time FL may demand now is manageable and surely it will pays off later. Thank you very much.</p>
