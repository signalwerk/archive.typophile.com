      <p>Hi Igor,<br>
      Great job! Nice and readable.<br>
      "Comments are very welcome." So I have some doubts (the nuts and bolts ;) Your acute, Polish kreska and Hungarian umlaut have the same slope. I don't think that's right (in particular Polish kreska ought to be steeper than French acute, and French acute steeper than Czech čarka). Hehe, what a mess...<br>
      In lslash 'slash' might be shorter (a notch) on the left side (your choice).<br>
      Ogoneks in UC Aogonek and Eogonek should be shifted left a bit.<br>
      Ogonek in lc eogonek should be shifted right a bit.<br>
      BTW your ogonek looks somewhat anaemic;)<br>
      There are some tips here: <a href="http://typophile.com/node/66141" title="http://typophile.com/node/66141">http://typophile.com/node/66141</a>, especially the last is valuable.<br>
      Best wishes</p>
