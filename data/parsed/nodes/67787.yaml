      <p>Thank you very much, Fernando.</p>
      <p>Top curve of f is one of my doubts since the beginning. I did several experiences but not used the same curve from t until now –actually, f follows a and n curves. It deserves a try.</p>
      <p>You made a very interesting observation about g; I will also do more tests on this.</p>
      <p>About acute and grave, I see there are two styles of positioning, both found in several fonts. Some designers made they almost centralized in relation to the letters, like in Meta. This is the more common criteria. Other prefers to dislocate the diacritic toward its own direction, as in Minion. The second approach is very characteristic in Slimbach's fonts.</p>
      <p>Working on texts with many accented characters, as in Portuguese, I find the second style much more appropriate than the centralized one. The accent becomes more organic, with a kind of flow coherent to its direction. Accents in Meta, for example, seems rigid and heavy –especially in A, which works terribly.</p>
      <p>Anyway, accents were revised and the sample available now still does not show the improvements I made. I'll add new samples soon and hope the acute will be a bit better.</p>
