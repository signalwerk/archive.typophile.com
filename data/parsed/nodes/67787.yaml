      <p>Sorry for the lack of updates but I had very limited time to invest in type projects since early 2012. This scenario will remain the same during about one year from now –so real news are expected just to 2014.</p>
      <p>Anyway, the development continued, although slowly, and the regular style is mostly ready (yellow groups are the incomplete parts):</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/01_5137.gif"></div><p></p>
      <p>In table columns, UC, LC, SC and PC means uppercase, lowecase, small caps and petite caps. Italic style is also underway:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/02_6481.gif"></div><p></p>
      <p>I know just a specimen would give a good view of the font, but for now I do not have an updated one. So these captures may give an idea (sorry for the large width):</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Sample01_4098.gif"></div><p></p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Sample02_6601.gif"></div><p></p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Sample03_3588.gif"></div><p></p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Sample04_6169.gif"></div><p></p>
      <p>Besides this, I also started a sans serif font to work as companion for this project. They share the same glyph set and main proportions. Its basic Latin alphabet is ready. A sample:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/sans_4021.gif"></div><p></p>
