      <p>While it can at times require all your patience to go from an environment where you are comfortable and in control—to one where you are again a novice—in this case it's worth it. Here's why: FontLab requires you to make certain decisions about point type and placement while drawing; the same decisions that Illustrator more or less makes for you. FontLab gets you in the habit of drawing glyphs using the simplest construction possible. This is important for making malleable glyphs that you can adjust as context requires, also keep in mind rasterizing, hinting, and interpolation should you choose to interpolate.<br>
      Another reason for using FontLab for drawing that isn't obvious at all until you do it, is its silent emphasis on thinking about type as a system of interdependence. The decisions about how to space a glyph are best made while the glyph is still being drawn—in the context of the other glyphs around it. As you use it, you'll grow to appreciate its handling of curves, one of the prominent nice things about the software.</p>
