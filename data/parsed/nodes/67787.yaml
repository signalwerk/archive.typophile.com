      <p>Hello, Igor-</p>
      <p>A formidable start. </p>
      <p>But you should really check your control points after bringing your glyphs from AI to FontLab; while AI has pretty much limitless scale, FontLab works (by default) with 1000 x 1000 scale. And a shift of just one unit could look bad in small sizes.</p>
      <p>I would suggest you learn to draw glyphs in FontLab instead of AI.</p>
      <p>This is just my opinion, and I'm pretty anal about these things.</p>
      <p>Anyway, a very nice start.</p>
