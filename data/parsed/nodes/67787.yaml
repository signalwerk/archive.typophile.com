    html: |-
      <p>If you add U+0331 Combining Macron Below and make it work with lowercase g then I’ll be your friend for life. The Tlingit orthography requires K, k, X, x, G, and g with U+0331 and there are precious few fonts that support that diacritic in any reasonable way. I note you’ve got U+1E34 Latin Capital Letter K with Line Below and its lowercase counterpart. Those, along with the other characters “with Line Below” decompose into the base Latin forms and U+0331. U+0331 gets used in a few other Native American orthographies, like in Kwakʼwala (née Kwakiutl) and Coast Tsimshian where it occurs below A and a.</p>
      <p>The lowercase h with circumflex and with caron could have alternate forms where the diacritic is shifted to the right and lowered so that it sits above the leg like the dot above. You could use the caron and circumflex for lowercase since it is narrower.</p>
      <p>Do you plan on implementing IPA at some point? If you do, let me know and I can advise. As a linguist I’m a daily user and I’ve seen a lot of poor designs for IPA letters.</p>
      <p>If you implement U+0332 Combining Low Line then make sure that adjacent pairs connect to each other. It’s supposed to be a textual equivalent of underlining. It should *not* act like U+0331 and be independent. It’s amazing how many font designers seem to have completely ignored the quite explicit instruction in the Unicode standard: “• connects on left and right”.</p>
      <p>Hope to see more soon! Doing the all the Latin diacritics is somewhat of a thankless job, but I assure you that people like me really do appreciate good work.</p>
