      Here are my observations, take with plenty of salt ;)</p>
      <p>I think the lower terminals of c and e (and perhaps t) are a little undecided.<br>
      g looks a little wide I think.<br>
      Ear of g and arm of r (and bottom of y) could be stronger, and r perhaps wider.<br>
      Some counters are slightly bumpy; I think this is just a matter of refining what you have rather than changing the shapes.<br>
      I love your acute and grave! Tilde looks a little shallow, dieresis has the dots perhaps too wide? Cedilla isn't quite there yet. Comma could be a more interesting shape: something like the quotes or acute?? I think I'd rotate the quotes slightly too.</p>
