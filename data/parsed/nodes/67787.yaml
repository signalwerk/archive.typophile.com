      <p>The macron should be positioned below the bottom of the lower bowl, and it should not touch the descender at all. It may have to stick out below the lower boundary of the font, but people who need diacritics below letters with descenders will need greater leading anyway so usually overlap with following lines isn’t a problem. The version you’ve shown is instead appropriate for U+10E5 Latin Small Letter G with Stroke which doesn’t involve a macron below.</p>
      <p>A problem with U+0331 that many fonts have is that the diacritic is not the same distance from the baseline as it is in the “... With Line Below” characters. The two are supposed to be canonically equivalent according to the Unicode standard, so the diacritic should look exactly the same whether it’s part of a precomposed character or whether it’s added to some base character. Since U+0331 is a horizontal line it’s very striking when the distance from the baseline is different from one letter to the next, as in <a href="http://img205.imageshack.us/i/screenshot20100620at185.png/" rel="nofollow">this example</a> of Mac OS X’s current versions of Palatino and Times Roman as well as Victor Gaultney’s Gentium which gets it right. (The screenshot was taken from Mac OS X’s TextEdit.) The example also shows where the macron below should appear beneath the lower bowl of the lowercase g.</p>
      <p>If you implement IPA you should definitely do all of the symbols in the IPA extensions block, as well as the spacing modifier letters and the combining diacritical marks. The diacritics need to be tested for positioning with every IPA symbol. Check the <a href="http://archive.phonetics.ucla.edu/Language/ipa-pop-up-2.html" rel="nofollow">IPA chart</a> to see how the basic diacritics are used, but note that any symbol can have more than one diacritic depending on the narrowness of the transcription. You don’t really have to worry about the ligating tone letters (U+02E5 ... U+02E9), people who want them will use one of the SIL fonts (Doulos SIL, Charis SIL). I recommend not doing any of the “Overlay” diacritics since they’re not supposed to be used according to official Unicode doctrine. You might just use the spots as placeholders for the overlay glyphs used in constructing other characters.</p>
      <p>If you want to do a really good job on diacritics with Latin letters and phonetic transcriptions, I recommend looking at the three fonts from SIL, namely Gentium, Doulos SIL, and Charis SIL. Those serve as great examples of how to properly handle a wide variety of diacritics in different combinations for a very large repertoire of languages and transcription systems. The requirements are quite different from ordinary European orthographic needs, and the SIL fonts are carefully designed to fit the needs of linguists and many minority language orthographies.</p>
    html_clean: |-
      <p>The macron should be positioned below the bottom of the lower bowl, and it should not touch the descender at all. It may have to stick out below the lower boundary of the font, but people who need diacritics below letters with descenders will need greater leading anyway so usually overlap with following lines isn’t a problem. The version you’ve shown is instead appropriate for U+10E5 Latin Small Letter G with Stroke which doesn’t involve a macron below.</p>
      <p>A problem with U+0331 that many fonts have is that the diacritic is not the same distance from the baseline as it is in the “... With Line Below” characters. The two are supposed to be canonically equivalent according to the Unicode standard, so the diacritic should look exactly the same whether it’s part of a precomposed character or whether it’s added to some base character. Since U+0331 is a horizontal line it’s very striking when the distance from the baseline is different from one letter to the next, as in <a href="http://img205.imageshack.us/i/screenshot20100620at185.png/" rel="nofollow">this example</a> of Mac OS X’s current versions of Palatino and Times Roman as well as Victor Gaultney’s Gentium which gets it right. (The screenshot was taken from Mac OS X’s TextEdit.) The example also shows where the macron below should appear beneath the lower bowl of the lowercase g.</p>
      <p>If you implement IPA you should definitely do all of the symbols in the IPA extensions block, as well as the spacing modifier letters and the combining diacritical marks. The diacritics need to be tested for positioning with every IPA symbol. Check the <a href="http://archive.phonetics.ucla.edu/Language/ipa-pop-up-2.html" rel="nofollow">IPA chart</a> to see how the basic diacritics are used, but note that any symbol can have more than one diacritic depending on the narrowness of the transcription. You don’t really have to worry about the ligating tone letters (U+02E5 ... U+02E9), people who want them will use one of the SIL fonts (Doulos SIL, Charis SIL). I recommend not doing any of the “Overlay” diacritics since they’re not supposed to be used according to official Unicode doctrine. You might just use the spots as placeholders for the overlay glyphs used in constructing other characters.</p>
      <p>If you want to do a really good job on diacritics with Latin letters and phonetic transcriptions, I recommend looking at the three fonts from SIL, namely Gentium, Doulos SIL, and Charis SIL. Those serve as great examples of how to properly handle a wide variety of diacritics in different combinations for a very large repertoire of languages and transcription systems. The requirements are quite different from ordinary European orthographic needs, and the SIL fonts are carefully designed to fit the needs of linguists and many minority language orthographies.</p>
