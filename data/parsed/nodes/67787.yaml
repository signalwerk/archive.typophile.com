    html: |-
      <p><strong>Ogoneks</strong> are tricky. Although a good amount of instructions about ogonek design is available (especially from Adam Twardoch), each ogonek is a particular issue as the connection with base letter is almost always different. Another problem is Native North American languages, where the preference is to link ogonek to bottom middle of |a| and |u|.</p>
      <p>While most ogoneks work well, lowercase y with ogonek is terrible. Unhappily, I don't see any solution to improve this awful combination.</p>
      <p>All this was considered in this set of ogoneks:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/ogos_5639.gif"></div><p></p>
      <p><em>Ogoneks.</em></p>
      <p><strong>Cedillas</strong> are much simpler than ogoneks when you work with the usual |C|S| with cedilla. But to make M with cedilla I needed a special connection. And there are letters like N or H with cedilla, without a base where to hang the diacritic.</p>
      <p>Usual solution for Hcedilla and others is to center the diacritic with the first stem of the base letter. I tested this and didn't got satisfied. In this beta version my provisory solution is to connect them to the right serif of first stem.</p>
      <p>Not sure if this is better. I'd like very much any feedback on this:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/cedillas_5485.gif"></div><p></p>
      <p><em>Cedillas and horns.</em></p>
      <p><strong>Horns</strong>. As you can see above, in the last line there are |o|u| with horn. I'm glad with this design as it keeps both horns at the same height and they connect smoothly with the base letter. Horn size also seems adequate and legible.</p>
      <p><strong>Slashes</strong>. As discussed in another <a class="freelinking external" href="http://typophile.com/node/78088" rel="nofollow">thread</a>, in some less known languages |a|c|e|t| can receive a slash as a diacritic. I was initially trying to use the same slash from |Ø|ø|. Later, I learnt the diacritical slash is different from that used in Ø: it's steeper and goes beyond height and base lines.</p>
      <p>These glyphs are far from beautiful, but this diacritic does not leaves much room for a nice design:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/slasheds_4428.gif"></div><p></p>
      <p><em>Slashed letters</em>.</p>
