      <p>Hi Igor,<br>
      Looking very nice indeed! Cudos!</p>
      <p>I find that the lower and possibly upper diagonal on /k/ feels a bit too thin, especially compared to other diagonals.<br>
      I think /x/ leans a bit too far to the right, maybe broadening the base to the right will fix that.<br>
      /w/ stands out a bit because the middel part doesn't reach x-height.<br>
      Maybe /,/ and the middle part of /s/ are a bit too heavy?<br>
      The finial on /y/ looks a bit out of the ordinary...</p>
      <p>I like the fact you've designed a very subtle mix of sans and serif, like in /a/ and /f/. It reminds me of <a class="freelinking external" href="http://new.myfonts.com/fonts/itc/stone-informal/" rel="nofollow">Stone Informal</a>, although that's more a mix of roman with cursive. </p>
      <p>Finally, let me say that I admire the systematic way you have planned this project. This reflects on your design. I just guess you're a systematic guy!</p>
      <p>Hoped to be of any help!<br>
      Kind regards,<br>
      Jean Paul</p>
