    html: |-
      <p>I really like the overall feel of the font. Seemsa like this really has a great deal of potential, however, there are a number of things that bother me. I'm no pro, so feel free to ignore my comments. Although I see you're already pretty far in the design process I noticed a couple of things in the lc, which I want to share.</p>
      <p>The curve at the top of the bowl in /a/ is not smooth. It looks as if there's a straight part in it. I think it will look better if you take away the in-between nodes and extend the control points at the top towards the left.</p>
      <p>The c seems about to fall to the right. I think you should higher the top-right part and maybe also move it to the left a bit.</p>
      <p>I think the finial in /e/ is too short.</p>
      <p>The f is original, but adding a serif to the top would probably be better for legibility</p>
      <p>The eye of g seems a little too dark to me</p>
      <p>The top of t looks fragile. Perhaps move the node at the very top to the left?</p>
      <p>The serifs on the inside of x are probably too 'smooth' to stop ink from filling the space between the serifs and the diagonal strokes. The serifs on the capital X look better to me.</p>
      <p>I'm not sure about the flat bottoms of v w V W. It looks as though they were cut off. I don't think there are many serif typefaces with v's and w's like yours.</p>
      <p>Anyway, it's still a great typeface. Good luck!</p>
