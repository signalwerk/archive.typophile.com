      <p>Your solution to g + U+0331 sounds good to me. However, I do not suggest having U+10E5 be related to g + U+0331. The Unicode specification does not say that U+10E5 should decompose to anything. Having it be produced by some other combination would thus violate the intent of the specification.</p>
      <p>I didn’t review all the orthographies of all the languages of the world, which would be an enormous task that I would never complete. :) But I did look at several orthographies in the Pacific Northwest of North America which I know use underscore diacritics in their orthographies. Here’s a list of those letters which occur with such diacritics:</p>
      <p>Tlingit (Revised Popular orthography): GgKkXx<br>
      Haida (Alaskan orthography): GgKkXx<br>
      Coast Tsimshian: AaGgKk<br>
      Nisg̱aʼa: GgKkXx<br>
      Gitksan: GgKkXx<br>
      Kwakʼwala (Uʼmista orthography): AaGgKkXx<br>
      Squamish: KkXx<br>
      Thompson (Bouchard orthography): GgG̓g̓KkXx<br>
      Senchothen (SENĆOŦEN): KNWX</p>
      <p>Dakelh (aka Carrier) also uses underscore diacritics, but because it uses them in combination with digraphs it benefits from the U+0332 Combining Low Line which is specified by Unicode as connecting between letters. Dakelh has the following with U+0332: Dz dz S s Ts ts Z z.</p>
      <p>There may be other languages in North America where underscore diacritics are used, but the concentration of use is definitely in the Pacific Northwest.</p>
      <p>In practice people seem to be confused between U+0331 and U+0332, with some people using the latter where they should probably be using the former instead. With time this will probably sort itself out, but it is best to support both. When one uses U+0332 I would imagine that it would be better to have the underline run through the descender of the g rather than below it, following the Unicode specification that the U+0332 connects between adjacent glyphs. This dissimilar behavior would help users realize the difference between the two diacritics, which otherwise appear quite similar.</p>
      <p>So far, I’d say that the diacritic designs look pretty good so far. It would be helpful to see them used in the context of a few texts in various languages. You could look at the proof sheets for Huronia from Tiro Typeworks for some examples.</p>
