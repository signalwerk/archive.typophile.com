    html: '<p>The obvious pairing would seem to be a Jannon Garamond - look at that "g". In fact the numerals in Stanyan seem to be derived directly from ATF Garamond, with the idiosyncratic slight vertical extensions. <br> <br>A much more interesting choice however would be a Fleischman, like the fresh-off-the-grill Farnham: <br><a href="http://www.fontbureau.com/fonts/Farnham" target="_blank">http://www.fontbureau.com/fonts/Farnham</a> <br> <br>hhp</p>'
