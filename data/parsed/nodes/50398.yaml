  html: |-
    <p>So this shear has been in our shop as long as I can remember, which is at least 35 years:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/pexto2_4306.jpg"></div><p></p>
    <p>It's my turn to clean up around it, and I'm just getting crouched down to sweep underneath, and the nameplate stares me in the face:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/pexto_4317.jpg"></div><p></p>
    <p>Wow! it's beautiful, right down to the red paint behind the brand name. I probably haven't looked at it since I was 3 or 4 years old, when it was at my eye level. Now I'm off to document the machine plates off the other old equipment we have around, though I'm certain this one is the oldest.</p>
