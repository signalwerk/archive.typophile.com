    html: |-
      <p>&gt;what you say means CT stands for ClearTrees?</p>
      <p>That's hilarious. I don't think ClearType is anti-tree, just think that cross-platform Verdana or Georgia would be better choices than Calibri if the idea is to stop people hitting the "print" button.</p>
      <p>Should also mention that your  50% estimate is a little high. Some XP installations have CT on by default, and IE 7 forced on CT system-wide. So you're really looking at a subset of XP users who are using IE6, so that would be less than 20% of Web surfers*. Many of those are corporate users who aren’t allowed to upgrade, not college kids. </p>
      <p>*http://www.gizmodo.com.au/2010/03/inside-the-excruciatingly-slow-death-of-internet-explorer-6/</p>
