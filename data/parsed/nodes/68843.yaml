    html: <p>When this did the rounds this morning at work, I had to admit that I'd not printed an email since 2003. Switching to a more readable screen-tuned font (Verdana, Georgia or Calibri would be my picks) would be a better idea to reduce printing. Could also include a guilt-line on the mail "The University will kill a puppy every time you print out this mail" for good measure.</p>
