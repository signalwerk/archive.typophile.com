    html: |-
      <p>The text below could be set in Stephenson Blake’s Guildford Sans.<br>
      The logo, although it's probably customized, is tied to the style of lettering of Frank Lloyd Wright, which was adapated as a digital typeface by P22 and Monotype, in different ways.<br>
      "Fine" is probably handwritten.</p>
