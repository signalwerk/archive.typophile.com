      <p>Heldustry looks a bit... familiar, too - but it is still quite cold. I didn't even know such a font existed. Fun idea, though - but IMO it ended up too close to Helvetica and not much like Eurostile at all... ;)</p>
      <p>My aim with Familiar Pro was to make a softer and friendlier "replacement" font by gently squeezing the round shapes (like with a soft ball) and also the diagonal letters (like they were squished from the top and bulged out). Some different lettershapes and the rounded dots completes the friendlyness :)</p>
      <p>Umm... Nightmares?</p>
