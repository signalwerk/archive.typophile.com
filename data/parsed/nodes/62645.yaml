  html: |-
    <p>Recently I was working on a project for a client, and realised that they used different fonts for their East Asian markets. I was looking in proposing one gothic CJK font for the whole region, but had to realise that that'snot so easy.</p>
    <p>I know there are Mircosoft fontswhich offer a complete CJK set, but looking for fonts with a good variety of weights, to mach them with the latin house-type, was not easy at all.</p>
    <p>For the time we kept the 3 different fonts for C, J &amp; K.</p>
    <p>Did anyone else have the same problem?</p>
    <p>j. </p><div class="imageWrap"><img src="http://typophile.com/files/cjk_5023.jpg"></div><p></p>
