      <p>The iPhone includes two Pan-CJK fonts. They went with the TTC approach, meaning that four separate font instances, one for each of the CJK locales (Simplified Chinese, Traditional Chinese, Japanese, and Korean), are advertised. Send to me an email in a couple of weeks, after IUC33 is over, and I'll send to you my presentation about this topic. It will details the issues, the work involved, and various solutions.</p>
      <p>Dr. Ken Lunde<br>
      Senior Computer Scientist, CJKV Type Development<br>
      Adobe Systems Incorporated<br>
      <a href="mailto:lunde@adobe.com">lunde@adobe.com</a></p>
