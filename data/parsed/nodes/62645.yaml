      <p>What you're after is a Pan-CJK font, meaning a single typeface design that serves multiple CJK locales. This is a topic of one of my IUC33 presentations that will take place in about two weeks. See: <a class="freelinking external" href="http://www.unicodeconference.org/conference-at-a-glance.htm" rel="nofollow">IUC33</a></p>
      <p>The primary issue is that some CJK Unified Ideographs may require two or more glyphs to satisfy the CJK locales, due to Han Unification.</p>
      <p>Dr. Ken Lunde<br>
      Senior Computer Scientist, CJKV Type Development<br>
      Adobe Systems Incorporated<br>
      <a href="mailto:lunde@adobe.com">lunde@adobe.com</a></p>
