      <p>I have noticed too that clubs playing in European competitions will sometimes wear numbers that are different form the domestic shirt numbers (albeit on exactly the same kit apart from the numbers), since the domestic league's numbers have a domestic league branding on them in a similar size and position to the Real Madrid crest on the number 9 as worn by Cristiano Ronaldo.</p>
      <p>You can probably guess that I find the football numbers thing fascinating. Sorry if I've bored you!</p>
