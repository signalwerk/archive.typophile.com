    html: |-
      <p>Football clubs (and national teams too) are now getting into the habit of having their own bespoke numbers drawn. </p>
      <p>Some like the English Barclays Premier League and Coca-Cola Championship and Leagues 1 and 2 have to wear the league's own prescribed numbers (which are bespoke).</p>
      <p>England have recently moved away from numbers drawn by Jeremy Tankard towards something a little more traditional in the same vein as Gill Sans in keeping with their new kits which have a very classical feel (literally feels like cotton as opposed to polyester, but is in fact a blend of the two).</p>
      <p>Looking at the photo of Ronnie from the back, I'd say that the club's crest on the number is indicative of a bespoke design. That is not to say a club won't use an off-the-shelf typeface but my money's on bespoke, maybe designed in-house or by the Adidas replicas guys.</p>
      <p>I couldn't tell you if the clubs from La Liga are legally bound to use La Liga style numbers or not but, if so, these are not them (Real Madrid's crest makes them Real Madrid numbers).</p>
