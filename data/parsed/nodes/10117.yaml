    html: <p>Interesting.  <br> <br>I think the 'visual logic' of the Chinese 'broken square line' style, if I can call it that, requires some treatment of the ends of the strokes. For example, if you look at the bottom of the small side table you posted, they have squarish 'feet' that break the straight line of the leg. <br> <br>The ends of the strokes here look 'naked' to me, and call for something like the treatment of the feet of the table, to be consistent with the style.</p>
    html_clean: <p>Interesting.  <br> <br>I think the 'visual logic' of the Chinese 'broken square line' style, if I can call it that, requires some treatment of the ends of the strokes. For example, if you look at the bottom of the small side table you posted, they have squarish 'feet' that break the straight line of the leg. <br> <br>The ends of the strokes here look 'naked' to me, and call for something like the treatment of the feet of the table, to be consistent with the style.</p>
