  html: "<p>Hey. <br> <br>I have just made this font. (Petrograd) <br> <br>I have a couple of weights and styles: <br>-Regular <br>-Bold <br>-Regular Osf <br>-Regular Monospaced <br> <br>The problem is when I make the font files and  <br>activate them in ATM, only one weight/style  <br>shows up in my programs. <br> <br>I have convinced myself that this is because  <br>of the \"font info\" being entered in a wrong way. <br> <br>Can you help me with this? (if this is indeed  <br>the core of the problem) <br> <br>In fontlab the info page looks like this: <br> <br>Family Name:  <br>Weight:  <br>Widht: <br>Style Name:  <br>Font Name:  <br>Full Name: <br>Menu Name: <br>Fond Name: <br> <br>I just can't seem to figure this out correctly. <br>How should I fill this out in the right way? <br> <br>Thanks <br> <br>Magnus</p>"
