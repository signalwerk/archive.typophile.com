    html: |-
      <p>The easiest way I see to do that without breaking spacing and kerning  is to use ttx which comes for instance with <a href="http://www.adobe.com/devnet/opentype/afdko.html" rel="nofollow">AFDKO</a> and modify appropriately the ttx files you will get as follows. </p>
      <p>I will assume you have sed (that comes with OS X and Linux). You could also use perl. The substitutions to make, in the sed syntax, are</p>
      <pre>s/Raleway/RalewayW/g
      s/"w"/"w.ORIG"/g
      s/"w.alt"/"w"/g
      s/"w.ORIG"/"w.alt"/g
      s/"W"/"W.ORIG"/g
      s/"W.alt"/"W"/g
      s/"W.ORIG"/"W.alt"/g
      </pre><p>where the first line changes the font name so as to be able to have both Raleway and RalewayW (the modified font) installed on your system. The other lines just swap the glyph names w.alt with w and W.alt with W.</p>
      <p>You put those lines in a file, say mods.sed.</p>
      <p>In order to get your modified version of Raleway-Regular.ttf you execute (in the railway font folder) the lines (with unix syntax, so that it works on OS X or Linux)</p>
      <pre>ttx -t cmap -t GSUB Raleway-Regular.ttf
      mv Raleway-Regular.ttx Raleway-RegularW.ttx
      ttx -x cmap -x GSUB Raleway-Regular.ttf
      sed -f mods.sed Raleway-Regular.ttx &gt; modfont.ttx
      ttx modfont.ttx
      ttx -m modfont.ttf Raleway-RegularW.ttx
      rm -f *.ttx modfont.ttf
      </pre><p>
      On the Mac, you can just copy and paste those lines in the Terminal window. After a few seconds, you get your new font Raleway-RegularW.ttf and the kerning should work fine. Since there is no alternate for the small cap, it will stay as is but that probably makes no difference for your program.</p>
      <p>You do the same with all the other fonts and you get your family. That can all be done on all 18 font files with a script if you are familiar with unix.</p>
