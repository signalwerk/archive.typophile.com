    <p>I want to use Stylistic Alternates on a program without OpenType support; namely, the alternate a and W/w on Raleway.<br>
    So I would like to make a copy of Raleway where the a and W/w are their alternates.<br>
    Is there a way to do it without expense, or is there another workaround solution?</p>
