  html: |-
    <p>The existance and validity of a ’canon’ in areas such as literature or fine art is usually hotly debated - but is there a canon of typefaces and type designers? Are there names you’d expect young designers to be exposed to early on or do you think it’s more important to cultivate a style from individual influences? Who or what would appear on your personal canon?</p>
