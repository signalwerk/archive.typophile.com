  html: '<p>Alchion Design Lab is essentially Design Alchemy re-named with a few changes in crew, a new marketing strategy and of course naming/identity. <br> <br>Aesthetic: simple, minimalist, balanced yin/yang (soft / hard edges/ weight) geometric. Should form abstract A, D, L.  <br>(for Alchion Design Lab) this is accomplished by removing any single side of structure and leaving rest.  <br> <br>Construction: mathematical construction, re-worked for optical   <br>balance (narrowing horizontal vs vertical elements) so they look equal in weight. I started by deconstructing Unicratica typeface  for to develop basic look.  <br> <br>Market: I would like it to appeal to pharma/scientific industry as well as fashion and manufacturing industry. <br>   <br><img src="http://www.typophile.com/forums/messages/29/54073.jpg" alt="Alchioon logo construction"></p>'
  html_clean: '<p>Alchion Design Lab is essentially Design Alchemy re-named with a few changes in crew, a new marketing strategy and of course naming/identity. <br> <br>Aesthetic: simple, minimalist, balanced yin/yang (soft / hard edges/ weight) geometric. Should form abstract A, D, L.  <br>(for Alchion Design Lab) this is accomplished by removing any single side of structure and leaving rest.  <br> <br>Construction: mathematical construction, re-worked for optical   <br>balance (narrowing horizontal vs vertical elements) so they look equal in weight. I started by deconstructing Unicratica typeface  for to develop basic look.  <br> <br>Market: I would like it to appeal to pharma/scientific industry as well as fashion and manufacturing industry. <br>   <br><img src="http://www.typophile.com/forums/messages/29/54073.jpg" alt="Alchioon logo construction"></p>'
