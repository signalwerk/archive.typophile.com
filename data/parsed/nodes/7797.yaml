    html: <p>I am setting type for the businesscards I am about to get printed and started thinking about a clever title for myself, that projects  <br>a sense of humor well as a clever/concise description of what I do. I came up with a few titles. <br> <br>Alchionist- well my design co. is called Alchion (not an actual word, but a simplification of my previous ficticious business name Design Alchemy) <br> <br>Alphabeautician (sounds scientific which I like but perhaps a bit over the top for some),  <br> <br>Brandist- I believe it has been done by others-and a bit too corporate. <br> <br>Alpha (as in primary contact/owner, and leaning toward type <br>design being something I enjoy- It also could imply an alpha male who takes control (which could be + or -) <br> <br>Visually flipping titles, etc... <br>I have looked to long at this to be objective. please give me your thoughts.<img src="http://www.typophile.com/forums/messages/29/56819.jpg" alt="text"></p>
