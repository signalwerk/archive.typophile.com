      <p>Contemporary serifs for body copy… Mmm, I think that a lot of the contemporary serifs have this copy/paste look, where a funky form of serif gets pasted onto letterforms that started out as sans (sanses?).<br>
      Nothing wrong with that, but traditionally serifs 'grew' organically out of the stems and so on. So, if you ask me — any serif with slapped-on-distinctive-little-(uniform)-shapes is contemporary.</p>
      <p>Just my 2 cts.</p>
