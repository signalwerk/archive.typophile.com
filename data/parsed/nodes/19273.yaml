      <p>There's no way a low-res GIF will convey much [difference] at all. PDF please?</p>
      <p>&gt; what harrier ... would look like in this instance?</p>
      <p>In what instance? If you mean this exact text/layout, if you provide an InDesign file (or even just an EPS with the text as text, not convert-to-outline-ed) I'll set it in Harrier, sure. Just one thing: Harrier has four -close- weights, but no italic (or you could possibly use Patria's italic as its italic - they have the same slope though). The point however is that you can use the Demi to mark emphasis in a body of Regular (or really any other combination you prefer) like the TYPO magazine boys do so well with Nimbus (and did so well with Patria, for my article in #13).</p>
      <p>--</p>
      <p>Mrs Eaves: I wouldn't recommend it unless you go the trouble of respacing it*, since its color is very spotty as it stands. I liken it to a beautiful, captivating woman... with a speech impediment.  :-/</p>
      <p>* BTW, is it true that James Montalbano once did that? Maybe just a rumor.</p>
      <p>hhp</p>
