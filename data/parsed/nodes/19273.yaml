    html: <p>I recently saw a newsletter/sales piece done in <a href="http://www.typotheque.com/site/font_collection.php" rel="nofollow">Fedra Serif</a>. It had a very fresh, contemporary look without being too impersonal. Clean like a sans without being a sans, or being too stiff. Some of the large size stuff and the italic didn't look as good--perhaps they used the wrong one (there is a and b)--but overall I was impressed how well it succeeded in being fresh without looking too self-conscious or slick.</p>
