      <p>i think <a href="http://www.fontshop.com/index.cfm?fuseaction=verity.search&amp;font_categories_search=font_name_search&amp;searchstr=Charter&amp;image.x=0&amp;image.y=0" rel="nofollow">Charter</a> by Matthew Carter has some interesting features in the serifs. especially in the italic.</p>
      <p>Stefan H's Delicato is a beautiful suggestion…  </p>
      <p>i guess it depends on what you are looking for and i'm sorry but <em>progressive</em> can be a pretty vauge term. especially when you are talking to designers who are constantly dealing with people who want something that looks <em>contemporary</em> or <em>progessive</em>.</p>
      <p>i am probably coming off kind of negative, which is something i don't want to do, but i think it's important to define what it is you are looking for (in general) so that everyone has a better understanding. if you can't quite describe it (which is probably why your asking in the first place), begin with perhaps a list of things that you associate with what you are thinking about. what other things (non type related) do you think of when you think <em>progressive</em>?</p>
      <p>2¢</p>
      <p>well, back to Easter weekend with the in-laws… wish me luck ; )</p>
