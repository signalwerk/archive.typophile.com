      <p>There was once, around 1999/2000 I guess, a magazine in the UK named ’level.’ and that was/became my ’all time favourite’ magazine, ever. The design <em>(simple, minimalistic, unusual photography, generous whitespace, Helvetica, ’urban’)</em> and the content. Finissimo.</p>
      <p>Dav</p>
