    html: <p>There is a magazine that comes out of Sydney called Black+White. It is a large magazine of art photography and articles about culture (sometimes pretentious and post-modern, sometimes not). In design terms it is without doubt the most significant mag to be published in Australia. Take a look at that.</p>
