    <p>HI,<br>
    I’m working on a book about magazine design. I’m collecting examples of brilliantly designed magazines from around the world.</p>
    <p>May i have your list of magazines. It does not matter what the magazine is about. only the design matters.</p>
    <p>Thank you for your help,<br>
    Sami</p>
