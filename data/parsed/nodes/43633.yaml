      <p>some currently available magazines:</p>
      <p>dot dot dot<br>
      self-service<br>
      a magazine<br>
      neon (Germany)<br>
      brand eins (by Mike Meire - check also his ’ugly’ design for 032c)<br>
      metal magazine (by Albert Folch, Spain)<br>
      anything by Jop Van Bennekom (RE-Magazine, Butt, Fantastic Man...)</p>
      <p>Spanish title ’Suite’ (<a href="https://web.archive.org/web/20080709011507/http://www.suitemagazine.es/" title="http://www.suitemagazine.es/">http://www.suitemagazine.es/</a>) in terms of typography is just great, featuring the typefaces of AD Inigo Jerez.</p>
      <p>the Wire (non-format years were brilliant)</p>
      <p>to name a few.</p>
