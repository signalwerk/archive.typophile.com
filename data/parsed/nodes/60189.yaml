      <p>Awesome. Figured out how to do it...not in Fontographer unfortunately. </p>
      <p>feature liga {<br>
      substitute Z Z by Z_Z;<br>
      }liga;</p>
      <p>The above worked like a champ where the new "Double Z" glyph was named Z_Z</p>
      <p>Thanks!</p>
