    html: |-
      <p>Yes, it's called ligatures. You can set a character substitution using OpenType feature tag which goes like this:</p>
      <p># Ligature formation<br>
      feature liga {<br>
           substitute f i by f_i;<br>
           substitute f l by f_l;<br>
      } liga;</p>
      <p>You can find more sample of this at:<br>
      <a href="http://www.adobe.com/devnet/opentype/afdko/topic_feature_file_syntax.html" title="http://www.adobe.com/devnet/opentype/afdko/topic_feature_file_syntax.html">http://www.adobe.com/devnet/opentype/afdko/topic_feature_file_syntax.html</a></p>
      <p>Unfortunately, you can't write those feature tags in Fontographer. Fortunately, you can use a tool called VOLT which is freely downloadable from:<br>
      <a href="http://www.microsoft.com/typography/VOLT.mspx" title="http://www.microsoft.com/typography/VOLT.mspx">http://www.microsoft.com/typography/VOLT.mspx</a></p>
      <p>Good luck!</p>
