  html: |-
    <p>I'm creating a handwritten font right now. Had a question if anyone can help?</p>
    <p>I'm currently using Fontographer to create.</p>
    <p>Can I make the font so that when two Zs (e.g. ZZ) are typed together they will produce a different looking combination effect versus if I use a Z in another way (e.g. Za or ZA)? Basically, ZZ is stylized a different way from a regular Z.</p>
    <p>I think this is called a ligature, but I'm new to font creation and new to Fontographer. I only found one mention of ligatures in the Fontographer manual.</p>
    <p>Thanks in advance for the instruction.</p>
