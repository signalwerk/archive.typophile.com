    html: <p>Can you describe what you mean by "royalty-free" - I'm not aware of any mainstream fonts that require royalties for general use (print, publishing, graphics). In general royalties may be due when redistributing the font or building it into a product. If that's what you have in mind you there are a whole other set of reasons for avoiding much of what the "free font" sites offer.</p>
