    html: |-
      <p>There are both knock off versions and leaked version of proprietary fonts. People who work as interns and such come and go and often need to use proprietary fonts outside the building. Its very easy for disks of proprietary fonts to get spread around and the subsequent users have no idea if they are commercial or proprietary. Either way its an infringement. We've seen television commercials and newspaper ads using our fonts. </p>
      <p>I've also had to address issues of type designers doing knock off versions of our fonts. Even that can be hard to stop.</p>
      <p>An interesting side note, recently it was brought to my attention that several fonts of American Greetings were listed on a free font site and credited to American Greetings. After a bit of research it seemed that these were released legitimately. Shortly after that I got a call from a French package design firm asking if indeed they could use these fonts. After running it by our creative director, permission was given. I guess it never hurts to ask.</p>
