      <p>Back in my days as a font collector, I at least strove to make sure any fonts I acquired were with legitimate licenses. This was difficult in the days before the internet became widely available. For a long time in the late 80s and early 90s I would buy floppy discs of "shareware" at swap meets and surplus electronics stores, and it was hard to determine what was what. </p>
      <p> <a class="freelinking external" href="http://www.printerideas.com/fontfairy/webfonts.html" rel="nofollow">The Font Fairy</a> index guided me to many fonts that were released without charge by their own foundries. That list has not been updated in several years, and some of those links may no longer work, but it was among the most well intentioned of the free font sites. Many designers still release free fonts, but sometimes with some limitations against redistribution or commercial use which you must be aware of.</p>
