      <p>"Here’s the hard truth. You’ll never get a good font for free."</p>
      <p>This statement is absolutely false. There are, in fact, many wonderful free fonts available, created and shared by many type designers, both professional and amateurs. </p>
      <p>However, with free fonts you do have to watch for a several things: </p>
      <p>1) There are many rip-offs (inferior and otherwise) of professional typefaces. These should be avoided, and the original fonts purchased instead. </p>
      <p>2) Many free fonts have been designed by amateurs, so you must look closely at every character in the font to make sure the fonts meets your needs (and to ensure that the font has all the characters you need). </p>
      <p>3) Kerning and other finishing touches are often missing, so you should be aware that many free fonts will not work well as text fonts, and may require a lot of special "hand-work" with spacing in display sizes. What you save on getting a "free" font, you may loose in extra time required to make the font work for you.</p>
