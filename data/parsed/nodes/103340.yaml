    <p>Hello,</p>
    <p>I am trying to identify all the typefaces used in John Carpenter’s "They Live" from 1988.</p>
    <p>Most of them is Futura, but I am struggling with one particular shot: The money which says "This is your god" …<br>
    The G doesn’t match any Futura I can find.</p>
    <p>I am pretty sure, it has to be some version of Futura, since most of the other typefaces are as well (I also found Franklin Gothic, a wodden letterpress typeface and a lot of hand-drawn versions of Futura and Century Gothic).</p>
    <p>Does anybody has any idea what version this might be?</p>
    <p>Thank you very much for your help, any suggestions is highly appreciated!</p>
