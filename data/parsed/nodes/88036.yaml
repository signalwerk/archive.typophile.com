      <p>I understand the desire to maintain your client's privacy, but you can't judge the best size for a logo by looking a generic placeholder. Logos vary considerably in their proportions, boldness, etc. </p>
      <p>But as a general comment, it's usually not a good idea to put a logo over a patterned background, like in layouts C and D.  In fact most corporate identity manuals specifically prohibit it.</p>
