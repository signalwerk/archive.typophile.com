      <p>"I just need help supporting my choice"</p>
      <p>Unfortunately, stating "some people on the internet liked X" probably isn't going to win over the stakeholders.</p>
      <p>In general, designers want it smaller, marketing wants it bigger. Given the very limited amount of info, I'd say if the cover, overall, emphasizes the visual brand, go smaller. If it's generic and the logo is the only thing to identify the company, bigger might be the only option.</p>
