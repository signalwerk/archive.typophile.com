    <p></p><div class="imageWrap"><img src="http://typophile.com/files/schild_Lindau_2_T_5126.png"></div><p></p>
    <p>I admitt, there are more ideas for fonts than time to always elaborate them to a whole family package. Usually, the ideas lay dormant in some hidden file for that reason, having little chance to see the light of the day. But sometimes I want to release the baby for I feel that it would be rather a pitty to ‘keep it imprisoned’. So I decided to <a class="freelinking external" href="http://www.myfonts.com/fonts/andreas-stotzner/lindau/" rel="nofollow">release Lindau now</a>, although it is such a “lonely child”. It may be of some usefulness, anyway.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/schild_Lindau_5_T_6523.png"></div><p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/schild_Lindau_4_T_6404.png"></div><p></p>
