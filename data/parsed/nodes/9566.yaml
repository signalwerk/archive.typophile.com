    html: <p>I suspect, the same as John, that the fraction would disappear when pasted from Indy to Quark, since Quark wouldn't interpret the Unicode character code. <br> <br>BTW, Matthew Carter has the fractions in accessible slots of Miller -- onequarter is opt-w, onehalf is shift-opt-p, and threequarters is opt-v. In Whitman, I've placed them slightly differently -- onequarter = opt-w, onehalf = opt-d, and threequarters = opt-j.  <br> <br>This kind of nonstandard encoding is frowned upon by many, as it will "break" your underlying text. But as fabulous as Indy is reported to be, until Quark supports OT/Unicode this sort of thing will likely continue. Many of my clients have too much invested in and are too dependent upon Quark workflows for there to be any significant change in the near future. <br> <br>-- K. <br></p>
    html_clean: <p>I suspect, the same as John, that the fraction would disappear when pasted from Indy to Quark, since Quark wouldn't interpret the Unicode character code. <br> <br>BTW, Matthew Carter has the fractions in accessible slots of Miller -- onequarter is opt-w, onehalf is shift-opt-p, and threequarters is opt-v. In Whitman, I've placed them slightly differently -- onequarter = opt-w, onehalf = opt-d, and threequarters = opt-j.  <br> <br>This kind of nonstandard encoding is frowned upon by many, as it will "break" your underlying text. But as fabulous as Indy is reported to be, until Quark supports OT/Unicode this sort of thing will likely continue. Many of my clients have too much invested in and are too dependent upon Quark workflows for there to be any significant change in the near future. <br> <br>-- K. <br></p>
