    html: <p>Sean -- <br> <br>The only way to access these from the Mac is indeed to reconfigure the font and generate a custom version. Some licenses will allow you to make a derivative like this, others won't. Emigre's license does not allow for this without permission.  <br> <br>But in the case of Mrs Eaves, there's a <a href="http://www.emigre.com/dp/getfontpage.php?PMrsS.html" target="_blank"> fraction font</a> that gives you access to the basic three fractions and a whole lot more. I don't think this is part of the basic package, but if you really want those fractions, you should consider licensing it. <br> <br>In general, though, if you create a custom configuration and place these characters in some of the lesser-used slots, be careful when generating your font to specify Macintosh encoding and not Adobe Standard or you may still not be able to get to your characters, since the Adobe Standard encoding substitutes several characters from the Symbol font.  <br> <br>I've seen this cause untold confusion before. <br> <br>Let me know if you need more explanation. <br> <br>-- K. <br></p>
    html_clean: <p>Sean -- <br> <br>The only way to access these from the Mac is indeed to reconfigure the font and generate a custom version. Some licenses will allow you to make a derivative like this, others won't. Emigre's license does not allow for this without permission.  <br> <br>But in the case of Mrs Eaves, there's a <a href="http://www.emigre.com/dp/getfontpage.php?PMrsS.html" target="_blank" class="link-external"> fraction font</a> that gives you access to the basic three fractions and a whole lot more. I don't think this is part of the basic package, but if you really want those fractions, you should consider licensing it. <br> <br>In general, though, if you create a custom configuration and place these characters in some of the lesser-used slots, be careful when generating your font to specify Macintosh encoding and not Adobe Standard or you may still not be able to get to your characters, since the Adobe Standard encoding substitutes several characters from the Symbol font.  <br> <br>I've seen this cause untold confusion before. <br> <br>Let me know if you need more explanation. <br> <br>-- K. <br></p>
