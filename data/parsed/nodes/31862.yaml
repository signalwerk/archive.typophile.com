    <p>I'm looking for a square, bold, san-serifed typeface. Similar to like a bold trade gothic, but not as vertical.</p>
    <p>Does anybody have any suggestions as to what will fit this description?</p>
    <p>sorry, but i have no visual (it's really something that i want. i know i've seen it before but i don't remember where).</p>
