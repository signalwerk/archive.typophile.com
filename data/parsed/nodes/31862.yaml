    html: <p>FF Hydra all the way, Kenny. It has killer ink traps and comes in three widths -- <a href="http://www.fontshop.com/showfont.cfm?fid=FF.11346.0.0" rel="nofollow">FF Hydra</a> (narrowest), <a href="http://www.fontshop.com/showfont.cfm?fid=FF.11347.0.0" rel="nofollow">FF Hydra Extended</a> and <a href="http://www.fontshop.com/showfont.cfm?fid=FF.11463.0.0" rel="nofollow">FF Hydra Text</a> (widest). Everyone I recommend it to falls head over heels for it.</p>
    html_clean: <p>FF Hydra all the way, Kenny. It has killer ink traps and comes in three widths -- <a href="http://www.fontshop.com/showfont.cfm?fid=FF.11346.0.0" rel="nofollow" class="link-external">FF Hydra</a> (narrowest), <a href="http://www.fontshop.com/showfont.cfm?fid=FF.11347.0.0" rel="nofollow" class="link-external">FF Hydra Extended</a> and <a href="http://www.fontshop.com/showfont.cfm?fid=FF.11463.0.0" rel="nofollow" class="link-external">FF Hydra Text</a> (widest). Everyone I recommend it to falls head over heels for it.</p>
