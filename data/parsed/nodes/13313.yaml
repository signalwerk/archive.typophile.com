    html: |-
      <p>I don't know if Farsi conventions are different on this, but for Arabic they're not bad at all. Assuming Farsi and Arabic are the same, I would make them darker, more curvy, and slightly taller.</p>
      <p>But there are other problems. I don't know Farsi, but I can see that:<br>
      1) The spacing (especially between words) is shaky.<br>
      2) The Kaaf in the last word (far left) most probably needs to join with the Noon, instead of being the lone form (unless it's some quite peculiar Farsi exception).</p>
      <p>hhp</p>
