  html: |-
    <p>could anybody please tell me if i use the quotation marks correctly in this example? the text is farsi (persian), font linotype nazanin.</p>
    <p>huda smitshuijzen abifares writes: <cite>"in well designed arabic fonts they have the shape of a double miniature parenthesis that has relatively flat curves. they are positioned above the baseline with their top lining with the top of the letter aleph."</cite>  (smitshuijzen abifares, huda: "arabic typography, a comprehensive sourcebook", saqi books 2001, london)</p>
    <p>so are the shown quotation marks not well designed (because they do not align with the top of the aleph, do i use them in a flawed way, or is it just fine?</p>
