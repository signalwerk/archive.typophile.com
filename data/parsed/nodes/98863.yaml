      <p>It could be <strong>Grange TF Black</strong> by Joseph Treacy (Treacyfaces), further emboldened, expanded &amp; italicized.<br>
      Grange is mentioned in Luc Devroy pages here:<br>
      <a href="http://luc.devroye.org/fonts-23611.html" title="http://luc.devroye.org/fonts-23611.html">http://luc.devroye.org/fonts-23611.html</a></p>
      <p>Look at the image bellow (Grange TF Black - slanted) :<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/enterprises_3699.jpg"></div><p></p>
      <p>-----------------------------------------------<br>
      I found it using Find my Font - <a href="http://www.findmyfont.com" title="http://www.findmyfont.com">http://www.findmyfont.com</a></p>
