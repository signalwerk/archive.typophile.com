      <p>Thanks for linking to that article, Vincent. That should clarify the MetaPlus vs. Meta.</p>
      <p>A correction: Lining and Tabular figures are not the same thing. <a href="/wiki/Lining%2520Figures" class="freelinking" rel="nofollow">Lining Figures</a> actually means the numbers line up horizontally. You could call them "all caps" or "titling" figures. Lining figs can be proportionally spaced. TF stands for <a href="/wiki/Tabular%2520Figures" class="freelinking" rel="nofollow">Tabular Figures</a> which means they all have same width for tabluar setting.</p>
      <p>I have never heard of Meta LL.</p>
