    <p>What are they?</p>
    <p>I asked a few friends and co-workers  but no one really knew for sure. A few responses I received were:</p>
    <p>1] They are made by different type foundries but essentially the same. (As I recall they were designed by Erik Spiekermann?)</p>
    <p>2] Some are better used as body text and others for signage?</p>
    <p>3] Some are used as Light and Bold sets?</p>
    <p>Can someone out there help distinquish between them? Thank you.</p>
