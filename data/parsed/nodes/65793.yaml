    html: |-
      <p>I made a few scale models and found that very little expansion was actually helpful. It's only a couple of letters, so if you can see them at all, you can make out what they are.</p>
      <p>I'd seen the garage in one of those design award books before, but I'd never looked at the pictures that closely. It's painful. And the office is worse! (In a good way)</p>
      <p>I'm not trying to mess with perspective; I just want it to be legible from afar.</p>
      <p>I'll look at the letters on roads.</p>
      <p>But considering that expansion didn't seem to matter much, I'll probably decide such that the letters fill the space.</p>
      <p>The height of the wall defines the maximum type size. The letters all have round counters, so that combined with the style of type leads to the width of a roman weight. Then I can expand the letters and make them bolder in order to fill the wall.</p>
      <p>The space I have is such that this should give expand the letters by no more than one width.</p>
