    <p>I'm painting a mural of a few really large letters. It will be in a long, narrow hallway, so people will be viewing it largely from an angle.</p>
    <p>I'm planning on drawing them expanded so that they can be sort of legible from the other end of the hallway and still being legible close-up, but I'm having trouble deciding on the degree of expansion. It's easy to calculate how the image that a camera would take would be stretched and shrunk, but our eyes compensate for much of that.</p>
    <p>I'm going to try a few different degrees of expansion and see how they fare, but I'm wondering if there's any sort of rule of thumb for this or where I would look for precedents.</p>
