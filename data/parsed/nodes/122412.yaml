    html: <p>Of course, there was the time when (presumably) they <em>had</em> a lot of typeface expertise in-house. Thus, <em>The Printing of Mathematics</em>, was by T(heodore) W(illiam) Chaundy, a mathematician who taught at Oxford, and Charles Batey, "printer to the University" - and P. R. Barrett, whose role I cannot identify, but he may well have been the actual Monotype operator in the group.</p>
