    html: |-
      <p>Mr Barrett was the specialist maths proof-reader in the printing division of OUP in Oxford, and, as a young proof-reader myself, I was privileged to know him there in the early 1980s, shortly before his retirement. </p>
      <p>There was indeed considerable in-house expertise in the printing house, but the printing division in Oxford was to some extent separate from the publishing division, and only dealt with a small part of the total amount published by OUP in the UK. The publishing division (‘them upstairs’) had a considerable body of experts of its own. But that was a long time ago. :)</p>
