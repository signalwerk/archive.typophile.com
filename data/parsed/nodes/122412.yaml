  html: |-
    <p>I've been doing some consulting for OUP in recent months, and they have rightly come to the conclusion that they need to bring more font expertise in-house. They are hiring a "Font Specialist/Senior Designer" in their UK offices. Full details here:<br>
    <a href="https://eu1.advorto.com/OUP/VacancyInformation.aspx?VId=18443" title="https://eu1.advorto.com/OUP/VacancyInformation.aspx?VId=18443">https://eu1.advorto.com/OUP/VacancyInformation.aspx?VId=18443</a></p>
