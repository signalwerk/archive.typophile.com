    <p>Hello, I am a longtime reader, a recently registered user, and now, a first time poster.</p>
    <p>I am currently working on a font design that will enable users to designate separate colors for two separate stripes within the strokes. Theoretically, there will be two font files for each weight; metrics and kerning pairs will correspond between the two font files so that, when a user typesets text in the first color/font file, they can then paste-in-place the text box, select the text and switch it to the second color/font file. I'm not familiar with the precedents for this, so if anyone can enlighten me, I'd greatly appreciate it.</p>
    <p>The two stripes within the strokes intertwine or weave over and under each other (see first image below), making for what I presume could be quite a headache ahead of me in getting the font functional in FontLab (I've been using Illustrator to build the paths as I'm more comfortable with it). I'm very new to type design and have tried to get a grasp on the 1000 vs 2048 UPM concept by reading past Typophile threads but admit I'm helplessly lost. I first tried 1000 UPM and found that it distorted some of my curves. I've seen better fidelity results using 2048 now, but am having much trouble in getting the areas where the stripes intersect to perfectly align (see second image below). If anyone has <em>any</em> suggestions whatsoever, please let me know!</p>
    <p>Thank you,<br>
    Andy</p>
