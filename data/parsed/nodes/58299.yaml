    date_raw: 23 May 2009 — 3:07am
    votes: null
    html: <p>I would strongly suggest that you build the font directly in Fontlab. I cannot stress enough how much trouble it will save you. Also, independently of if you do this or not I would suggest that you make a 3rd reference font in which all the parts you need are present and that you use the use the remove overlap tool located in "actions" to make the cuts you need then they will be completely precise. Note that to have the change be subtractive you will need to have the direction of the outlines be opposite each other. Also having made the subtraction happen you need to check your outline direction is correct. I have just tested this and it works. I am not at all convinced that with the category of shapes you are showing above that you need more than a UPM of 1000.</p>
    html_clean: <p>I would strongly suggest that you build the font directly in Fontlab. I cannot stress enough how much trouble it will save you. Also, independently of if you do this or not I would suggest that you make a 3rd reference font in which all the parts you need are present and that you use the use the remove overlap tool located in "actions" to make the cuts you need then they will be completely precise. Note that to have the change be subtractive you will need to have the direction of the outlines be opposite each other. Also having made the subtraction happen you need to check your outline direction is correct. I have just tested this and it works. I am not at all convinced that with the category of shapes you are showing above that you need more than a UPM of 1000.</p>
