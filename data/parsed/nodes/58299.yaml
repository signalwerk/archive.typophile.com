      <p>You need to read the section of the Fontlab manual that explains how to configure Illustrator so that you can bring your outlines into Fontlab with no distortion. Because you did not do this before you started you must tweak your existing drawings to work as a font no matter what you do. </p>
      <p>Do not create your work as a 2048 UPM TrueType font, stick to a 1000 UPM Postcript. If you use TT the curves will get distorted if users convert the fonts to outlines and it will screw up your careful attempts to avoid overlapping.</p>
      <p>Rosewood is a great chromatic font that comes with Adobe Creative Suite. There’s a manual for using it either on the CDs or available somewhere at Adobe.com</p>
