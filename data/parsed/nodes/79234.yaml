    html: <p>Preservation Hall is some kind of Western or Tuscan wood type. Jazz Band is a traditional thick-thin-sans. I can't think of any fonts that have such a hand-lettered look, but as a starting point for Jazz Band try <a class="freelinking external" href="http://new.myfonts.com/search/magnesium+mvb/fonts/" rel="nofollow">Magnesium</a> or Letterhead Fonts <a class="freelinking external" href="http://www.letterheadfonts.com/fonts/thickandthin.php" rel="nofollow">Thick and Thin Sans</a>.</p>
