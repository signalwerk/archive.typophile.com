      <p>Hola Cesar,</p>
      <p>Exelente iniciativa de diseño. Me puedo dar cuenta que hay muchos detalles que resaltan o llaman la atención en su particularidad mas que en su conjunto. Cuidado por que los textos de lectura deben carecer de puntos distractivos que por muy cool que se vean individualmente, hacen de que la tipografía no sea versátil y para que hacer otra display si tienes material para "transparentar" lo que actualmente propones.</p>
      <p>La g y la t, particularmente están en esta linea que diseñadores como Fontana proponen por defecto como parte de la familia "regular" lo que a mi parecer deberían ser caracteres alternativos pa uso decorativo..</p>
      <p>Me parece inconsistente insistir en marcar la "diferencia" al presentar tipos como de texto cuando la novedad que contienen son estos caracteres que no aportan tan sutilmente como el resto de tus caracteres.</p>
      <p>La curvas de las ascendentes me parecen interesantes, quizas debas presentar una busqueda mas generosa entre distintas exageraciones en estas hastas para poder sugerirte la mas versátil segun su integracion con las curvas de tu altura x y de tus descendentes.</p>
      <p>Un abrazo desde Chile,</p>
      <p>Miguel Hernández.</p>
