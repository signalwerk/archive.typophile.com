      <p>I wish we could see some set text.  That is the only way you can see what happens when reading.  Regarding the bent entrance strokes on the ascenders, in my experience with my own font, I found that there is a great deal of tweaking that has to be done after seeing small text. You don't have to finish the whole font first.  Just set some quick metrics with what you have and output the font.  Set some long text at various text sizes and see if what you have done is enough.  It seems to me that you need to make the bend a bit more apparent.<br>
      I also think the demi weight is too weak.</p>
      <p>Nice work though! Keep tinkering.</p>
      <p> ChrisL</p>
