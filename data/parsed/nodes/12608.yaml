    <p>Hello everyone,</p>
    <p>The purpose in Obliqua is to combine certain features proper of hand-writing with the proportions of humanistic typefaces in order to achieve both legibility and personality for setting running text and titles.</p>
    <p>I'd like to know what you think of this new typeface I'm developing (see attachments). All of your comments are welcome and very important to me.</p>
    <p>Greetings,</p>
    <p>César Puertas<br><a href="http://www.cesarpuertas.com/obliqua">http://www.cesarpuertas.com/obliqua</a></p>
