      <p>I'm guessing that with "tilde" Matthew meant the acute accent (like in this "á").<br>
      In latin-american countries "tilde" signifies any line-like trace over a character, as described by the <a href="http://buscon.rae.es/draeI/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Spanish's Real Academy's Dictionary</a>.<br>
      I've heard it referring to both the ~ in the "ñ" and the ´ in the spanish vowels; in daily language the second use is much more common.</p>
      <p>__________________________________________________<br><a href="http://www.gabssnake.4t.com">www.gabssnake.4t.com</a></p>
