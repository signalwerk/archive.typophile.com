    html: <p>Bueno, mi punto a tratar era sólo ese. Si eres anglohablante no le vas a ver uso a los caracteres pareados ya que los dígrafos son muy pocos en inglés, yo sólo conozco CH y SH, pues, si descontamos la cantidad de fonemas nuevos que se generan a partir de las vocales. En cambio, en español, hay CH, LL, RR, QU, GU y depronto SH y GN(para los ociosos que escriben lasagna y champagna). Es obvio que César creó esos caracteres enfocados a este idioma.</p>
