      <p>OK, <strong>Critique Thursday 2</strong> (read about it <a href="http://typophile.com/node/14813">here</a>) hasn't officially begun yet, but since I'll be commuting for most of its brief two hours, I'd like to get my two cents in on this great design now:</p>
      <p>I think that this is a great start on a design, but it needs some polish. Wide is certainly ok, but I think that some characters are too wide. The "m" for instance feels uncomfortable to me, but I love the "m"…</p>
      <p>I also think that the boldest weights should be more narrow overall than they are. That would make them feel "right," a bit compacter, and a little more dark.</p>
