      <p>Cesar, sorry I haven't been able to follow the discussion, I only understand English and French.</p>
      <p>I think that with a typeface like this, which competes in some well-occupied territory, the subtlety of detail and proportion is very important, to distinguish the face.</p>
      <p>At the moment, the finish, or "polish" as Dan has termed it, is not decisive enough to reveal how well the proportions and fine shapes and joins work.</p>
      <p>In particular, the curves of most characters are too rough. I don't believe this is a feature of the face, rather, it is a shortcoming which is obscuring the true nature of the letters you are trying to reveal. </p>
      <p>The general shapes and proportions of the letters are fine -- they work well together! But the next step must be to refine the curves.</p>
