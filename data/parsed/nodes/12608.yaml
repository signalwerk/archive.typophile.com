    html: |-
      <p>Me encanta cuando la gente que sabe hace buenos comentarios, me siento como en esos programas de tv donde se juntan los directores técnicos de equipos y con comentaristas hablan de futbol avanzado.</p>
      <p>En primer lugar, me encantaría estar de acuerdo con sergito, porque durante mucho tiempo me dediqué a buscar formas que fueran acorde a un sonido limpio, y que se grafica de manera compuesta. Pero no, en verdad no creo que sea la manera.<br>
      He visto un montón de experimentos frustrados de ligaduras que representan un nuevo sonido, sin embargo no he visto ninguno que resulte. </p>
      <p>Ni la doble"r" de Francisco Galvez<br>
      Ni la "Ch" de Fontana<br>
      La "ae" me carga hacerla, la hago sólo porque es obligación, al igual que la doble "s" alemana.<br>
      O sea, el problema de las ligaduras no sólo le afecta a los de habla hispana, sino que a casi todos los idiomas.</p>
      <p>Claro está que puedes hacer ligaduras decorativas como las de "mrs. Eaves", y te quedan muy bien, pero el aporte en textos es demasiado distractivo.</p>
      <p>Todo esto lo digo con mucha propiedad, ya que las letras compuestas para mi son las más horribles del alfabeto, digamos que la "m" y la "w" son las mas feas formas.</p>
      <p>Ahora, si analizamos la "q+u" nos encontramos con una forma demasiado complicada y absolutamente antinatural, donde el importante espacio entre letras fue eliminado, y cuando uno mira el signo, este espacio se siente muy ausente. Si le sumamos a esto, que estamos compartiendo un asta no terminal con un trazo medio, hmmmm no sé, creo que no resultará bien y se sumará a los experimentos anteriormente mencionados.</p>
      <p>Por otro lado, discrepo absolutamente con Eduardo, ya que la estructura de la letra es demasiado inestable para ser leída en cuerpos pequeños. Digamos que sería como leer una fuente normal pero en un camino empedrado. Sin mencionar a todo esto que conserva un poco de efecto pescado (<a href="http://typophile.com/node/6001">http://typophile.com/node/6001</a>)...</p>
      <p>Sin embargo, creo que es una bella tipografía para ser usada en titulares. El tema de la corrección caracter por caracter, hmmmm, no se, prefiero no hacerlo ya que esta muy bien, y solo encuentro muy extraña la "t" y la "g".<br>
      Esa "t" la he visto antes y creo que no funciona bien, y la "g", creo que si la cerraras te quedaría maravillosa.</p>
      <p>Suerte y felicitaciones, es un excelente trabajo.</p>
      <p>PD: como me gustaría postear con el ejemplo a la vista como en el foro antiguo, y que me llegue un mail avisandome de que alguen ha respondido, para que no se me olvide este tema y no vuelva a leerlo nunca más...</p>
    html_clean: |-
