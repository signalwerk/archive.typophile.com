      <p>Un día, Rodrigo Ramirez bautizó todos efectitos innecesarios que practicamente ni se ven como "pilines". (curvitas misteriosas, serifs a medias, cortes en los trazos, etc)<br>
      Fue ese mismo día que revisó todas sus tipografías, le sacó todos los "pilines", y nos instó a que hiciéramos lo mismo.<br>
      Ese día, la tipografía en Chile empezó a tomar otra cara y comprendimos que los esfuerzos de diseño hay que entregarlos a la estructura de la letra y no al efecto.<br>
      En ese sentido, creo que a tu tipografía le falta mucha limpieza, enderezarle los trazos chuecos porque si, revisar comienzos y terminaciones, ¿serán necesarios?...<br>
      En un texto, no es bueno que la tipografía empiece a bailar. ¿En un titular si...?, a veces...<br>
      Voy a revisar un poco de material y trataré de que el siguiente tema de letritas hable del tema.</p>
      <p>Juan Pablo De Gregorio<br><a href="http://www.letritas.blogspot.com">www.letritas.blogspot.com</a></p>
