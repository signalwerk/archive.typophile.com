      <p>Las últimas muestras me encantan.  Sobre todo la tilde, que en pequeños tamaños se realiza en la pantalla como una línea recta, pero más grande, se ve que sube ligeramente de izquierda a derecha.  </p>
      <p>English designers: César's tilde is exemplary.  It has the feeling of rising slightly from left to right, but at small sizes is more like a macron, which besides being a good general guideline, perfectly fits with his goal of integrating handwriting features as that's how Spanish speakers tend to write.</p>
      <p><em>«El futuro es una línea tan fina que apenas nos damos cuenta de pintarla nosotros mismos». (La Luz Oscura, por Javier Guerrero)</em></p>
