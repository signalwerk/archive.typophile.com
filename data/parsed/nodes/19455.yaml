      <p>Thank you for you reply and help, Lex Kominek. :-)</p>
      <p>I have some doubt, however, regarding the 1st font, about it being, as you suggested, Helvetica Heavy Extended.</p>
      <p>Here’s where my doubt comes from:</p>
      <p>In Helvetica Heavy Extended, the spur of the “G” is oblique in its inner-side/left-side (I’m sorry, but I don’t know how to call it in a more correct way, still I hope you know what I mean?), whereas in the actual font it is perfectly vertical.</p>
      <p>Also, in the “E”, in the actual font, the middle-bar of it seems to be more “out of alignement”, compared to the lower horizontal-bar, than it does in Helvetica Heavy Extended (i.e. the middle-bar appears to be even shorter, compared to the lower horizontal-bar, in the case of the actual font, than it is in Helvetica Heavy Extended).</p>
      <p>And still in the “E”, the space between the horizontal-bars (even compared with the width of the horizontal-bars themselves) appears to be less in the actual font than it is in Helvetica Heavy Extended.</p>
      <p>(Don’t know if any of this justifies for my doubt?...)</p>
      <p>Then again, for the 7th font, yes, Circus is also close. Though the “engraving/shadow lines” in parts are somewhat different (that is especially notorious in the “S”)... But still the thickness proportion of the main font lines seems to be yet closer to that of P.T. Barnum?</p>
      <p>Also, one other doubt, that just came to mind. The 2nd font, that western-like patterned one, is that which most seduces me, yet I was wondering now, could it also be the case that such an inside-pattern might also result from some kind of editing of an originally solid font?... (Or maybe I’m just thinking and saying plain nonsense?... Pardon my ignorance.)</p>
