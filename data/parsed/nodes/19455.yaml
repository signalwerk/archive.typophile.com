      <p>The top one looks like <a href="http://www.fontshop.com/index.cfm?fuseaction=catalog.fontdetail&amp;displayfontid=M.125966.0.5&amp;attributes.sampleSize=48&amp;sampleText=GESSLE&amp;sampleSize=48" target="_blank">Helvetica Heavy Extended</a> with dots added afterwards (the dots line up exactly over the entire word, and the two ’E’s don’t match).</p>
      <p>The fourth is a stencil version of <a href="http://www.fontshop.com/index.cfm?fuseaction=catalog.fontdetail&amp;displayfontid=LH.107997.0.5&amp;attributes.sampleSize=48&amp;sampleText=GESSLE&amp;sampleSize=48" target="_blank">Helvetica Bold</a>. This could have been done “in post” so to speak.</p>
      <p>The fifth is a hand-retracing of <a href="http://www.fontshop.com/index.cfm?fuseaction=catalog.fontdetail&amp;displayfontid=EF.6453.0.5&amp;attributes.sampleSize=48&amp;sampleText=gessle&amp;sampleSize=48" target="_blank">Pump Triline</a>.</p>
      <p>The seventh looks like <a href="http://www.myfonts.com/fonts/itfmecanorma/circus/circus/testdrive.html" target="_blank">Circus</a>.</p>
      <p> - Lex</p>
