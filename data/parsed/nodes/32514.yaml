    <p>Hello everybody!</p>
    <p>Since a friend saw itc didi we are pretty interested in making it new in digital because we couldn't find anything available on internet. No further information also, even on ITC's website.</p>
    <p>So we are looking for information some of you may have, like maybe old itc specimens or catalogues... and i also wanted to know what is the legal latitude about "remaking" a font?<br>
    The goal is not to make it exactly like it is/was, but to get the general feeling, we specially like the 70's decorative vibe.</p>
    <p>For the moment, all i have is this (attached) image, so if that was all we could get, it would finally be, for sure, a new design...</p>
    <p>Thanks for your help!</p>
    <p>Y</p>
