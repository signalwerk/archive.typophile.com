      <p>Didona<br>
      Designed at ParaType in 1992 by Vladimir Yefimov. Based on letterforms of Firmin Didot, a French typographer from the 18th century, ITC Didi, of 1970, by Herb Lubalin and Tom Carnase, and Russian typefaces of the 18th–19th centuries. For use in headlines, in advertising and display typography</p>
      <p>Nice Specimen of ITC DiDi is shown in 1980 hardcover specimen book " The ITC Typeface Collection"</p>
