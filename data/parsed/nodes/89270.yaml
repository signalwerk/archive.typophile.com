  html: |-
    <p>I hereby announce the release of some new Andron fonts.</p>
    <p>The popular Andron-2-English font is now completed by an Italic and a Bold version:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/ANDRON_G2_ENG_2_5971.gif"></div><p></p>
    <p>The Andron-2-Deutsch sort is now grown to a family of its own by three new and rather peculiar fonts. There is a new Italic and a new Scriptive, and Andron-2-Deutsch-Laendlich explores the possibility of a different approach to Capitals. This variation has been inspired by the base glyphs of £, € and $ which dwell in each font but hardly count for a model usually.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/AND-2-DEU-LAENDL_5449.jpg"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/ANDRON_G2_DEU_2_6235.gif"></div><p></p>
    <p>Moreover, the new Italic and Scriptive fonts of Andron 2 contain a splendid set of fancy classic ornaments:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/ANDRON_G2_ENG_orn_4545.gif"></div><p></p>
    <p>This ornament selection is also available separately, as “Andron Ornamente”.</p>
    <p>A scriptive version has also been added to the Andron-1-Latin family.</p>
    <p>All new Andron Fonts are available now at <a class="freelinking external" href="http://new.myfonts.com/foundry/SIAS/" rel="nofollow">MyFonts</a>.</p>
