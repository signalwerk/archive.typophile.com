      <p>What does the rest of the font header look like?</p>
      <p>If you change the Version number you can usually override font cache issues.</p>
      <p>To clean up the font caches search for the files adobefnt.lst and delete them all. Make sure you do not delete adobefnt.db!</p>
      <p>I have had great success using Font Nuke to clean up font cache issues:</p>
      <p><a href="http://www.jamapi.com/pr/fn/" title="http://www.jamapi.com/pr/fn/">http://www.jamapi.com/pr/fn/</a></p>
