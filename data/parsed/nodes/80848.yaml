  html: |-
    <p>Hi Everyone – I have recut a headline regular and italic font. I'm having trouble creating a family with them in Font Lab. I have, from what I can see, correctly named the fonts. I imagined that with the right naming they would automatically form a family when installed on fontexplorer, fontbook etc. but maybe not?</p>
    <p>Is there an easy way to make a family? </p>
    <p>Any comments would be much appreciated. </p>
    <p>Thanks  </p>
    <p>p.s. Bear in mind I'm a beginner in fontlab and could be making any number of errors.</p>
