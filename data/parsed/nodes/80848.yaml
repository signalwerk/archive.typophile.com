    html: |-
      <p>That should work, you probably need to blast your font caches. Try the following:</p>
      <p>• Uninstall all of the fonts you have generated. (never install unfinished fonts.)<br>
      •&nbsp;Clear your font caches<br>
      • Reboot<br>
      •&nbsp;Test the fonts by copying them to your Adobe fonts folder (/library/application support/adobe/fonts). Add them one one at a time, starting with the regular font.<br>
      • Once they work in Indesign try installing them. If they still don't work test them with through MS Font Validator and FontQA.</p>
    html_clean: |-
