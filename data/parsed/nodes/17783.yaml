    <p>February 2006</p>
    <p>New Releases<br>
    Monotype Library, OpenType Edition<br>
    The new Monotype Library offers a uniquely versatile range of fonts to suit every purpose. The 190 new additions include eye-catching display faces such as Smart Sans, powerful texts faces such as Bembo Book, Mentor and Mosquito Formal, the cutting edge Neo Sans and Neo Tech series and the versatile Felbridge family. Classic typefaces include Plantin, Gill Sans, Dante and Rotis among many other industry standard designs - all in the powerful OpenType format. <a href="http://msg1svc.net/servlet/Gateway?p=AGFAAMT&amp;u=3115&amp;et=H&amp;s=68241&amp;da=0">Click here</a> to view the contents of the entire Monotype Library.</p>
