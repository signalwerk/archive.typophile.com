    <div class="info">Submitted by <a href="/user/7006" title="View user profile.">paul d hunt</a> : 1.Feb.2007 6.13am </div>
      <p>Indie Fonts 3</p>
    <p>Fresh from the printers, we have the brand new <a href="/wiki/Indie%2520Fonts" class="freelinking">Indie Fonts 3</a> books. This is the exclusive hardcover version. This volume features 20 foundries with over 400 pages of type specimens, plus a bonus CD with 53 fonts!</p>
    <p>Like the previous two volumes, Indie Fonts 3 showcases some of the best independent type designers and foundries from around the world. There isn’t a better way to preview type designs than in print and this book has over 400 pages of fonts from digital foundries.</p>
    <p>Indie Fonts 3 includes specimens and fonts from:<br>
    <a href="/wiki/Baseline%2520Fonts" class="freelinking">Baseline Fonts</a>, <a href="/wiki/Blue%2520Vinyl" class="freelinking">Blue Vinyl Fonts</a>, <a href="/wiki/Device%2520Fonts" class="freelinking">Device Fonts</a>, <a href="/wiki/E-phemera%2520Fonts" class="freelinking">E-phemera Fonts</a>, <a href="/wiki/Font%2520Bros" class="freelinking">Font Brothers</a>, <a href="/wiki/Handselecta" class="freelinking">Handselecta</a>, <a href="/wiki/Jeremy%2520Tankard%2520Typography" class="freelinking">Jeremy Tankard Typography</a>, <a href="/wiki/Kenn%2520Munk" class="freelinking">Kenn Munk</a>, <a href="/wiki/Letterhead%2520Fonts" class="freelinking">Letterhead Fonts</a>, <a href="/wiki/Pizzadude" class="freelinking">Pizzadude</a>, <a href="/wiki/Positype" class="freelinking">Positype</a>, <a href="/wiki/Process%2520Type%2520Foundry" class="freelinking">Process Type Foundry</a>, <a href="/wiki/Rimmer%2520Type%2520Foundry" class="freelinking">Rimmer Type Foundry</a>, <a href="/wiki/Shinntype" class="freelinking">Shinntype</a>, <a href="/wiki/SparkyType" class="freelinking">SparkyType</a>, <a href="/wiki/Suitcase%2520Type" class="freelinking">Suitcase Type Foundry</a>, <a href="/wiki/Suomi%2520Type%2520Foundry" class="freelinking">Suomi Type Foundry</a>, <a href="/wiki/Village" class="freelinking">Village</a>, <a href="/wiki/Virus" class="freelinking">Virus Fonts</a> &amp; <a href="/wiki/Wilton%2520Foundry" class="freelinking">Wilton Foundry</a>.</p>
    <p>This book was assembled by the original editors of the first two Indie Fonts, but published by Rockport Publishers in a flex-bound cover. The flexbound version will be available everywhere design books are sold. For those completists who prefer all 3 volumes in hardcover, we are the exclusive outlet for the limited hardcover version. Both editions contain the same pages, but the hardcover is...well, hardcover with a dust jacket. As an introductory special, we are offering Indie Fonts 3 at $35 plus shipping (list price $39.95) until February 15th.</p>
    <p>As a special offer we are bundling Indie Fonts 2 &amp; 3 together for the very special price of $60.00 (prices do not include shipping).</p>
    <p>See sample pages and order the book here:<br>
    <a href="http://www.p22.com/indiefonts/indie3.html" title="http://www.p22.com/indiefonts/indie3.html">http://www.p22.com/indiefonts/indie3.html</a></p>
