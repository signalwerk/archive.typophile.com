      <p>Another form of interaction would be back cover/front cover, like the t-shirt that says "the cat is dead" and "the cat is alive" on front and back.<br>
      I know interaction is supposed to supercede mere depiction of an idea, but if you're familiar with the concept in a classical way, interaction is a trite hassle. It's like having to mouseover a CS logo in the OS X dock and they all look the same even after what is it, three years?! when having it spelled out would work better. So the illustration of superimposed cats works very nicely.</p>
      <p>When I say that true randomization is impossible, I mean that the OpenType feature is not supported by any typesetting applications.</p>
      <p>Reading is a quantum phenomenon. You decide what text means by reading it. That's why Helvetica is so stupid -- all that entaglement with billions of other texts clouds the meaning of any particular text it's used for.</p>
