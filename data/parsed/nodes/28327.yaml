      <p>Dear Nick,</p>
      <p>I think you are having a Milli Vanilli moment. This idea has already been done by Tal Lemming in Christian Schwartz's LOCAL GOTHIC. You have seen this before. I hope your failure to provide attribution is simply an oversight.</p>
      <p>Lemming told me over lunch that most of the information on his website is simplistic smoke and mirrors but the basic ideas are deeply rooted in a quantum physics. You see, the problem with producing a "random" effect in OpenType is that the GSUB table is static. There is no way to, as Just van Rossum and Erik van Blokland did in BEOWOLF, link to a pseudo-random number generation library. This prevents the generation of a random seed which in turn causes the utter failure to launch a randomization routine. Most of the attempts at randomization, and I believe that Phiney's attempts fall into this category, use simple glyph rotation schemes or very simple backtracking to trigger a single substitution. What Lemming stumbled onto was a way to simulate a random seed generator. From there it was a fairly simple set of steps for him to implement a basic superposition algorithm. I shouldn't give away any more secrets as he explained all of this in confidence.</p>
      <p>Will you be in Lisbon? We should have a beer together.</p>
      <p>BTW, do you know Professor Andreas Von Shinn of the Hochschüle of Fachhochschule Darmstadt?</p>
      <p>SIncerely,<br>
      Randolph T. Burke</p>
