    <p>Trying to follow my current type bible, Bringhurst's "Elements..." I have been really cracking my head to get a meaningful typography to match such an interesting subject. Nationality is an issue, though. The conference was held in Switzerland, with a German theoretical as chairman, and had participants from Austria, England, US, Chile, among others. But the book will be published in Germany by a German institute identified with the school of Ulm and stuff... </p>
    <p>So, the situation is:<br>
    I have this feline cover<br>
    I have this very contemporary and international (but with a german "output" if you allow me) text, with lots of people talking, the speech goes from one participant to the other, like in a play, I have to keep clear who is speaking at the time.</p>
    <p>First of all I considered Otl Aicher's rotis. Besides the author biography I think the semi serif really has a feline feel. I thought of doing the whole book taking advantage of the many versions of rotis. But when I started to layout the inside text body the rotis serif didn't really behave as I expected. Besides, the version I have do not include text numbers and de fi and fl ligatures cannot be right.</p>
    <p>Then I changed my mind and thought of Glypha and Univers. But recently I decided not to be so hard on the obligation of a german design for the text body. My dynamic duo is, currently, Avenir and Chaparral. Avenir is looking good in the cover and they look good together in a test inside page I did, with side notes. What do you guys think?<br>
    Thank you for commenting or just reading this troubled mind!<br>
    Marco</p>
