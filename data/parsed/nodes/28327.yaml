      <p><em>I hope your failure to provide attribution is simply an oversight.</em></p>
      <p>I don't believe I claimed to have invented the idea of random variation from a set of alternates. (Making it work in a digital font is another matter.)<br>
      The first time I came across it was Kozmik the Flipper font, over ten years ago.<br>
      I have no idea how truly random Tal's "random seed generator" is, but it sounds way kewl.<br>
      John Butler has done something for the OT version of LettError's Kozmik.<br>
      I didn't mention either (and there are probably more) -- I didn't think it was an issue.<br>
      In fact, I published a typeface, Handsome Pro, in 2004 that has many contextual alternates, triggered by a variety of cues, that gives a good random effect -- there are quite a few script fonts that do this.<br>
      The only ostensibly random OT technique I have looked at is Mr Phinney's.<br>
      Sorry, not going to Lisbon. But a beer is always a good idea.</p>
