    html: <p>The original was called Baby Fat and was designed by Milton Glaser. I'm not sure exactly what year, but I think it was around 1970. There were several variations of the shading. Photo-Lettering carried it and credited Glaser. Buxom was probably an unauthorized film font version. The pages on MyFonts for Buxom all credit "FotoStar".</p>
