  - id: 571276
    user: 14556
    date: 2014-02-12T14:48:00
    date_raw: 12 Feb 2014 — 2:48pm
    votes: null
    html: |-
      <p>Some software may be better than others at finding fallback fonts to supplement the empty slots in your main fonts. I have noticed this happening on rare but frequent enough occasions where a startlingly different font appears where there is a recently introduced glyph, like capital sharp S or one of the newer currency symbols that many common fonts haven't yet been updated to support.</p>
      <p>If you don't have any installed fonts with those characters, they won't show up. If you do have at least one such font installed, your software may make the substitution automatically, or you might have to make a settings adjustment.</p>
