    html: |-
      <p>It's definitely NOT Impact. Nonono. The kick on the R is more akin to Helvetica Inserat. Impact was, however, used for Lost promos and DVD boxart.</p>
      <p>I've had a look in all the usual places, but all the Helvetica variants appear to be too wide and/or friendly to be this. It's also not Hoefler's Champion, though it's closer; but bowl on the R is too flat on the vertical.</p>
      <p>But enough about what it's not...what IS it?</p>
      <p>-NJ</p>
