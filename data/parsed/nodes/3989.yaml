    html: <p>Alyce, your idea for a sample comparison document is not a bad one. But I will say that so much depends upon the quality of your actual text (is it punchy journalism with a lot of short terse words or is it academic text with a lot of long jargon, for instance) and the line measure (narrow column vs. full-page measure) that a standard document may not be adequate. <br> <br>A slightly different approach that I might recommend is to create a resource document in which you develop several H&amp;J styles -- for instance, your Standard might be 80% / 100% / 133%, but then you define a Tight at 75% / 100% / 133% and a Tighter at 67% / 90% / 125%, or some such (these are just random examples). <br> <br>Then when you start a new project and you're establishing your line length and type size and leading, you can import ("Append," in Quark lingo) these H&amp;J styles from your resource document and quickly apply them to your actual text.  <br> <br>(Once you've made your decisions and the work begins in earnest, you may wish to delete any unused H&amp;J styles to prevent confusion later.) <br> <br>-- K. <br> <br> <br></p>
