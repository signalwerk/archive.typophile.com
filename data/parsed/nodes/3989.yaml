    html: <p>Kent -- where you use the flex space for adding a little separation, I use kerning. In the other instances you mention, I set tabs, or horizontally scale the space character. The advantage of this method is that by tapping the keyboard command which varies the value incrementally, one can adjust a space until it looks just right. <br> <br>I am also very fond of "command-backslash" (as an alternative to paragraph formatting) for hanging indents, although it can really befuddle other people working on the same file!  <br> <br>There are so many ways to do everything with software... <br> <br>(Alyce, every time I see a post from you, I hear that old Jam tune...)</p>
