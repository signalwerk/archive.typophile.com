    html: "<p>I think generally rewrite is a last resort, depending upon the material being set.  <br> <br>When I'm working on a book, I feel that the author has said what she means in the way she means it and it's my job to make that work. In this case, I will generally only request a rewrite when there are no acceptable alternatives. But sometimes, that's what's required.  <br> <br>If it's average everyday copy, though, then rewriting is usually not a big deal. Sometimes its the most expedient solution. <br> <br>-- K. <br> <br><i>Hey! Post #500!</i> <br></p>"
