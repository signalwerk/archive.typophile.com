    html: <p><i>&gt;where you use the flex space for adding a little separation, I use kerning.</i> <br> <br>True, but with a flex space, I can search and replace an entire document's worth of em dashes. Or I can search an entire document's worth of [inchmark - space - multiply] combinations. Without messing with custom kerning tables or anything. <br> <br>I also use the command-backslash to hang paragraphs, but you're right, others following can get confused. I also have been known to use non-breaking spaces following things like "I" or "a" or "an" in unjustified text in order to keep them from hanging out at the end, but to allow the text to flow if the paragraph gets rewritten (as opposed to what happens with a forced break). Or to keep measurement numbers with their units.  <br> <br>But again, this can mystify colleagues who follow after. (Although, it's less problematic, in my opinion, than hard breaks that get bumped because of an AA.) <br> <br>-- K. <br></p>
