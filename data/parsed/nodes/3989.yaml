    html: "<p>I'm really enjoying this exchange on H&amp;J's, a subject which I've been immersing myself in for the last month or two. I'm about half way through James Felici's <i>The Complete Manual of Typography</i>, and have just started rereading Bringhurst's <i>Elements</i> (which is even better now than 4 years ago). <br> <br>Felici suggests (with many examples), that flexing character spacing with care and respect, along with consideration for how much the word spacing is flexing, is fine and even recommended. Whereas Bringhurst seems less open to that idea. My questions are these: are there any typophiles that allow more flex in character spacing than what Bringhurst and Kent suggest? (I'm talking about a max of +/-5%) Also, Kent, are you speaking about book typography, or do you include magazine typography, with its tight columns and fast turnaround? <br> <br>I'm aware that flexing only word spaces is more 'purist,' but I rarely rely on purism for anything, and would rather settle for reasonable, functional, and attractive. Felici seems to contradict Bringhurst frequently in respect to technique, particularly since Felici is speaking specifically about digital typesetting, and Bringhurst is covering all typesetting. Also, Felici feels more realistic about the environments that typesetting is generally done in, wherease Bringhurst strikes me as describing typesetting ideals. They seem aimed at the same end results (solid typography), but have varied methodologies and philosophies. <br> <br>Like Chris, I was taught next to nothing about H&amp;J's, and my current employer couldn't care less, so I've taken on the responsiblity myself for a while now. I'm trying to figure out what should be discounted at face value, what should be accepted readily, and what should be used with care and judgement. My questions aren't meant as a challenge to anyone's assertions, I just really want to get a solid footing.</p>"
