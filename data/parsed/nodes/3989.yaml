  html: |-
    <p>My new job requires that I sometimes use justified type -- usually just a couple of paragraphs of 9/12 or so, in a measure that can vary between 12 and 30 picas (OK, 2 to 5 inches, picas vs. inches can be a whole 'nother thread :-) ) and I've avoided justified type in the past so don't have a lot of experience with it.</p>
    <p>I'm working in Quark 4.1. Any tips on the percentages used in the Edit Hyphenation &amp; Justification dialog box will be much appreciated. Ditto comments on how kerning and tracking work with justified type, as well as pros and cons regarding squooshing and / or stretching the type by one or two percentage points.</p>
    <p>Thanks.</p>
