    html: "<p>Yves, I used to be a purist and set Character Spacing to 0/0/0. But I found through some experimenting that I actually couldn't always notice the difference in -1% (after putting it down and picking it up later, that is). So I started allowing it, just to give Quark a little more leeway to find a better line. But it does depend upon the typeface. <br> <br>Regarding Cap breaks, it's just a difference in approach. I let the machine try it and I reject it if I don't like it, instead of trying to find places where breaking caps will help. The thing is, I'm usually going over everything anyway, so I let the program take a crack at it first. It depends a lot upon the content. In an Acknowledgement or something with a lot of names, I turn it off because it's a hassle to track them all down. And in medium to long measures, it's usually unnecessary. But in narrow columns, breaking Caps is one of those sacrifices I often consider. <br> <br>Nick, I won't ever scale a line. But I will use additional manual tracking on occasion to fix problems -- depends upon the typeface and measure. But I tell designers working under me not to do it, as a rule, until I can teach them by example, and over time, what's acceptable and what's not. <br> <br>Before resorting to tracking, though, I will usually try tracking just the word spacing. It's a useful trick, and more like traditional, metal typesetting. In Quark, if you have the TypeTricks XTension loaded, then highlight the line and using the following keyboard commands: <br> <br>Shift-command-option-control-[ will reduce word space by 1 unit; <br>Shift-command-control-[ will reduce word space by 10 units. <br> <br>A line will rarely tolerate more than -10 if my H&amp;Js are set well. The same combinations with the right bracket will increase word spacing accordingly. Note that these key combinations are similar to the ones for applying tracking, with the addition of the Control key. <br> <br>On my current projects, though, I have the good fortune to have a really good relationship with the editors and can usually get a rewrite (or an okay on *my* rewrite). <br> <br>-- K. <br></p>"
