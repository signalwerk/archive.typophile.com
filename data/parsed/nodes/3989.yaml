    html: <p>Kent's setting is very much the old hand-composition aesthetic. <br> <br>The crazy flexing that software does was really difficult with foundry type, involving tricks like shaving individual pieces of type. <br> <br>So it makes sense to use Kent's old-school H&amp;Js with an old-style face like Bembo, which was designed for that kind of setting (and no fancy kerning either!) <br> <br>However, for something like ffDIN, a digital version of signage lettering, or Officina, open-fitted offspring of the typewriter, a different H&amp;J strategy would be OK. Even for a present-day oldstyle like Minion, which one would assume Robert Slimbach designed with kerning in mind   <br> <br>The thing is, when you first start to use a face in a project, you can experiment with the vartiables. Size and leading, most obviously, but H&amp;J too. <br> <br> </p>
