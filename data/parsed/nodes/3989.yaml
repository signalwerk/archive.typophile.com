    html: "<p>Alyce, Nick gave a good explanation of the difference between the standard and Quark default em spaces. But let me summarize: a standard em space is a relative unit equal to the point size; the Quark default em space is variable defined as twice the value of the width of the 0 (zero) in a font. So the standard em space is size-dependent, while the Quark default is size- *and* font-dependent. <br> <br>(I believe this default was inherited from some phototypesetting systems and may have some validity when working with tabular matter or extremely condensed fonts. But not as the default, IMO.) <br> <br>The reason I recommend checking the Standard Em square is that it makes some things more predictable.  <br> <br>Although the word spacing is based on percentages of the spaceband character width in a given font, character spacing is determined in units which are 1/200th of an em space. I believe that Quark calculates this differently based on the preference setting for the value of the em space. (There's a slim chance that I'm wrong and that it uses the point size value regardless of whether the standard em space is checked; but I don't think I am. I'd have to go back and do controlled tests to confirm.) <br> <br>Nick, I use the en and em spaces periodically. One example is when I have a run-in C-head. Frequently I will decide to style the head in a bold sans serif, set it without any terminal punctuation, and use an en or em space (depending on the line measure) before the beginning of the paragraph proper.  <br> <br>Sometimes I will use an en space following a graphic bullet, when the list is not being set hanging.  <br> <br>I will also frequently use an en or em space before an end-of-story dingbat. <br> <br>The most important reason I choose to check the standard em space is that I use the Quark flex space as a thin (or hair) space, and the flex space is defined as a percentage of the en space (which in turn is determined by the definition of the em space). I like to define the flex space at 25% (which yields an M/8 space).  <br> <br>I then frequently use this flex/thin/hair space to slightly separate em dashes -- a compromise between the two competing camps of closed or open em dashes, and again, a convention that I've derived from traditional setting.  <br> <br>I also like to use this flex space to separate the multiply symbol in dimensions, or sometimes in botanical hybrid names (depending upon how the typeface sets and where I'm taking the multiply from).  <br> <br>-- K.</p>"
