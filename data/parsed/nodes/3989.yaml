    html: "<p>Hello Kent, Yves, Stephen, Nick, Gerald, Chris A., Daniel, Chris R., Hrant, Eduardo, Thomas, William, Tiffany and James. Thank you all very much for the education, and congrats on making this a handpicked thread. Some questions and comments: <br> <br>\"Make sure that in your Document Preferences &gt; Character tab, the box for Standard Em Space is checked.\" <br> <br>Can anyone explain what this does? Why it is a good idea. (I like to know why too.) <br> <br>Some books were mentioned that I will be looking for.  Tiffany, I haven't forgotten that I owe you a book review. Soon. <br> <br>InDesign? Someday maybe. My use of Quark is and has been dictated by interaction with other Quark users. It is still good to be informed, though, and I am taking note of the comments. <br> <br>To help with future projects my plan is to set up a sample document with several repetions of the same two paragraphs in the same type box and then create a variety of H&amp;J styles based on the numbers discussed in this thread. When I have a new project I should then be able to quickly set the type in the desired font and get a quick look at a couple of options.. That's the plan anyway. <br> <br>Thanks again. <br> <br> <br> <br> </p>"
