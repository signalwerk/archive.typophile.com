    html: <p>H&amp;J is a broad topic, with plenty of room for debate. <br> <br>Nevertheless, here is a set of basic settings that I give to the designers I work with as a starting point. <br> <br><img src="http://www.typophile.com/legacy/messages/30/32190.gif" alt="Standard H&amp;Js"> <br> <br>Make sure that in your Document Preferences &gt; Character tab, the box for Standard Em Space is checked. (If you make these setting changes while no document is open, then these will become your default settings.) <br> <br>These make for a decent starting point. I'm sure others will have different defaults from which they start. Whatever you do, <b>don't use Quark's defaults</b>. <br> <br>The J settings will vary depending upon the line measure, the leading, the typeface, and personal tolerances (or preferences) for tightness vs. looseness. <br> <br>For instance, with a longer measure and more leading, I may allow word spacing to be looser Max. And depending upon the fit of the typeface, I may allow character spacing of +1%. Conversely, with a shorter line, I may prefer a tighter Min. space. Also, with fonts that have an excessive word space built in, I may have to change all of the percentages accordingly. <br> <br>The H settings may vary depending upon editorial standards and line measure. For instance, in narrower columns, I prefer to set Min Before to 2 and allow Caps to break and unlimited hyphens in a row. These looser parameters will allow Quark more options to try to achieve more even spacing. I then manually override any unacceptable breaks. However, some editors will not allow a 2-letter break before under any circumstances. <br> <br>Regarding squooshing/stretching, I say Just Don't Do It. Same with tracking letterspacing. <br> <br>-- K. <br></p>
