    html: <p>I don't agree with Erik's guidelines. I do agree that Quark's defaults often yield too tight letter spacing and too loose word spaces. But I think Erik's guidelines overcompensate.  <br> <br>I don't think 80% word space in unjustified is always a good idea. It really depends upon the space and fitting of the typeface. For some, maybe; but not as a general rule in my book. <br> <br>I would especially *not* combine +2 units tracking with 80% word space. Again depending upon the typeface, the individual words generally start to pull apart and the word space between them starts to close up and approach the size of the intercharacter spacing. You'll get a more even gray texture on the page this way, but I don't think this is necessarily good for the readability. For instance, I think that the text of <i>Stop Stealing Sheep</i> is a bit too loose in this way. (I'm looking at the first edition.) Perhaps he gets away with it in this case because the style of writing is short and bite-sized, but I wouldn't want to read a novel or lengthy essay set like this. <br> <br>I agree that with smaller sizes, positive tracking is a good idea, just as it is a good general rule to use tighter tracking in display sizes. But my threshold for opening up the character spacing is usually down around 8 or 9 point, not Erik's 12. Again, it depends upon the typeface. Most reading faces are designed and fitted for use around 12 point. As a general rule for the average graphic designer, I would not recommend varying from the designed fitting until you get down into the smaller extremes. <br> <br>As far as that unlimited hyphen thing goes -- I have found that even when I allow Quark to use unlimited hyphens, it rarely provides more than three in a row anyway. Sometimes, four hyphens is the only way to achieve acceptable spacing in the paragraph.  <br> <br>Again, I let the program have some leeway to find what it thinks is the best solution, knowing that I will take the time to review everything anyway and can reject those that are not necessary or not acceptable.  <br> <br>I personally don't think hyphenation is the worst compromise in justified text, but it requires human judgement to determine when a hyphenation is cumbersome and impedes the sense of the text and when it is perfectly natural with the phrasing and cadence.  <br> <br>But there's nothing more frustrating than trying to tweak a paragraph by forcing a hyphen and not being able to figure out why it isn't allowing me to adjust it ... until I finally realize that there are already three hyphens and Quark is blindly obeying the three hyphen rule. After all, that's what machines do.  <br> <br>-- K. <br> <br></p>
