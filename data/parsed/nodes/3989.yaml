    html: <p>&gt;the box for Standard Em Space is checked <br> <br>1. An em space is two en spaces. <br> <br>2. This width is not derived from or related to the width of the normal space character. <br> <br>3. Type "option space" to insert an en space <br> <br>4. If the box is checked, the width of the em space will equal the point size of the type. (And the em space will be an em "square". In fact, a pica is merely a 12 pt. em. In hand composition the length of a line of type, or a column of type, measured in ems, is significant. In particular, typesetting was priced by the em. Also, knowing the number of characters per em in a font aids in copyfitting --and for this reason line lengths are also measured in ems. Furthermore, the em square, being a little piece of metal with a symmetrical cross section, has a strong aesthetic presence, enabling the typographer to conceptualize and design space in a scalar, proportional manner, rather than through absolute distances. The zen of the em.) <br> <br>5. If the box is unchecked (Quark default), the em space will be the width of two "0"s -- ie the en space will be the width of the figures in a font with tabular (monowidth) figures. So this may be useful for some kinds of tabular work with figures, and I would imagine that's the reason for this Quark option.  <br> <br>6. The difference between the options is more apparent in a condensed or extended typeface. <br> <br>7. In 15 years, I've never used the em/en space in Quark. Maybe that's my loss -- but does anyone have examples where it's been useful? <br> <br> <br> <br></p>
