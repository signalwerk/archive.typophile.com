    html: "<p><i>&gt;Also, Kent, are you speaking about book typography, or do you include magazine typography, with its tight columns and fast turnaround? </i> <br> <br>My primary frame of reference is book typography, since that is what I am most involved in. But some of the books I work with are two- or three-column formats as well. I think the general principles apply broadly. <br> <br>For magazine composition, I will use different settings than for book composition. But I will be using the same principles to evaluate my decisions. I judge my work against high standards, even though I rarely meet them.  <br> <br>And yes, I have to make the same compromises as anyone else when confronted with difficult situations or time constraints. Narrow columns will require more compromises than traditional book pages, generally. Not every piece of copy is worthy of the same attention or effort to get it just perfect. Sometimes you have to let less-than-preferable hyphens or somewhat loose lines go. I try to be practical.  <br> <br>I think the important thing is that one should know *what* it is you are compromising. <br> <br>Periodically, I will review my assumptions. Here is a controlled test I do now and then with a new face:  <br> <br>I'll set several lines of sample text unjustified (not greeking, but actual text, something representative of the type of work I'm currently doing) with hard returns at the end of each line.  <br> <br>Then I take every third line and apply progressively tighter tracking in -.5 unit increments -- i.e., the first and second lines are set normal character spacing, the third line is -.5 units, the next two lines are normal, the sixth line is -1 unit, etc. (Sometimes, I'll even mix them up more randomly. And sometimes I'll do the same thing with progressively looser tracking, too.) <br> <br>Then I set this aside and come back to it later. I try reading the text and note when the words become noticeably tight (or loose). It is difficult to be a reader and at the same time try to pay attention to the reading itself; this is by no means a perfectly objective test. But by this method, I establish my parameters and tolerances.  <br> <br>+/- 5% is really excessive -- note that this is equivalent to 10 units in Quark. I find that I cannot abide more than 2 units (1%), and am more comfortable with 1 unit. <br> <br>My bottom line is that word spacing is more flexible than character spacing. As a reader, I can tolerate greater variation in word spacing, much more than I can tolerate distorted word shapes through even seemingly modest variations in character spacing. <br> <br>I am, perhaps, admittedly old-fashioned in my aesthetic, as Nick points out.  <br> <br>I think the important thing is to keep looking and analyzing and learning. Notice good composition; notice bad composition; what works and what doesn't. Consider what makes it so. Develop and refine your own discrimination and judgement.  <br> <br>Then you won't so much need Rules. <br> <br>-- K. <br></p>"
