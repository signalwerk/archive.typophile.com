    html: <p>&gt; I judge my work against high standards, even though I rarely meet them. <br> <br>Now that's a golden quote (in the immaterial sense, of course :-). <br> <br>&gt; you'll be hard pressed to find very many fonts with a Yg kern pair. <br> <br>Certainly, and I don't think it's a big deal to miss it... as long as you also exclude "Yq"! <br>Being heavily programmatical, kerning makes most sense when it's consistent, although it can get complicated, especially in terms of linguistic sensitivity. For example, Mana-16 has a kern for "vv" (because it would look like a "w"), but not "ww" (because the undesirable looseness wouldn't be worth it since the string wouldn't generally be confused for anything else), but it also has a kern for "yw" but not "wy" (because of the orientation of the tail of the "y", in terms of filling the space). <br> <br>BTW, these days lc-UC pairs need a lot of attention too. <br> <br>hhp <br></p>
