    html: "<p>&gt; I  don't agree with Erik's guidelines. <br> <br>I think the main problem with them is the same problem with any canned rules: they over-ride the more important <i>reason</i> for the rules. And this isn't just an \"acedemic\" issue - specifically in this case (and as Kent points out) if you happen to apply <i>both</i> of the rules Yves reiterates (set smaller sizes with 80% wordspace and looser tracking) it'll backfire! In fact the way Spiekerman says that his font should be exempt for the loosening rule (like what about other loose fonts - how do you recognize them?) is a hint of the cardinal axiom: It''s Not So Simple. <br> <br>Is it that hard to try to teach people the WHY? <br> <br>hhp <br></p>"
