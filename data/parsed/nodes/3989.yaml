    html: "<p>This is a great thread. Good practical information about H&amp;J from Kent Lew and others. <br>William Berkson said earlier that he thought that Dowding's word-spacing (in Finer points ...)  was too extreme. It certainly looks too tight when you first read the book but after a while it seems just right, at least to me <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\">.  <br>Here is the quote from Tschichold from the Penguin Composition Rules that Berkson mentions: \"All text composition should be as closely word-spaced as possible. As a rule the spacing should be about a middle space or the thickness of an 'i' in the type used.\"</p>"
