    html: <p>In response to the other recent thread on sentence and word spacing, I got a copy of Dowding's 'The Finer Points of Spacing'. <br> <br>I think his views are interesting in the context of this discussion also. He begins the book by railing against excessive word spacing. This was apparently common (in the '40s and '50s) because typesetters were paid by how many 'ens' they set. Thus it paid the typesetter just to end a line quick and dirty and let the machine space it out.  <br> <br>Dowding shows an example of this loose and sloppy style, and it makes the case that the line breaks up with excessive spacing. He says you can counteract the problem with more leading, but tighter word spacing is better. He quotes Tschichold as recommending 1/4 em and recommends this. <br> <br>Now we could note that Tschichold, supervising book production, had an economic interest in keeping down the number of pages, and hence going for tight spacing. Dowding's book itself is too tightly set in my opinion. It is in 9/12 Times New Roman set to a measure of 23 picas. Bringhurst says that for small type sizes 1/3 em may be better, and from Dowding's book this seems to be so.  <br> <br>I think that in the '60s, with the advent of photo type, the 'close but not touching' school went overboard the other direction, of tight spacing, in my opinion. <br> <br>Now that we have such experts as Bringhurst, Spiekermann, Felici, and here Kent Lew and Nick Shinn all not agreeing tells me that people still haven't figured out the new technology of flexible word and letter spacing and glyph stretching, and how it relates to an optimal reading experience.  <br> <br>I think Spiekermann's refutes his own case by immediately saying that you shouldn't follow his own rule with 'Unit'. Surely other faces respond differently, as others have said. <br> <br>Since InDesign is new technology, it would be interesting to hear what Adobe has done in testing out and developing its technology on this issue. </p>
