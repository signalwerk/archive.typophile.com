    <p>Hi,</p>
    <p>I’m looking for a somewhat modern sans-serif that will go well with a round symbol.</p>
    <p>The company gives out certificates in drug prescription and dozage to nurses. I don’t want a type that has one side too thin. Right now I’m using Utopia, it has a nice thickness too it but it looks too ordinary. Would be could if it had nice small caps aswell.</p>
    <p>I’d like to try various versions with more and less notable serifs.</p>
    <p>I could poosibly use a sans type too but it can’t be to soft.</p>
    <p>Or maybe some slab serifs.</p>
    <p>Any suggestions?</p>
    <p>thanks<br>
    peter</p>
