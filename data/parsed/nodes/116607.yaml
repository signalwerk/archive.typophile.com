    html: |-
      <p>Does your sample has something to do with Japan or Japanese fonts?<br>
      I'm saying this because -strangely enough- the only glyphs I have found to look close enough to your sample, belong to the roman (latin) counterpart of some Japanese fonts.<br>
      Look at the image bellow.</p>
      <p>#1 is your sample</p>
      <p>#2 is the Latin counterpart of many Medium Bold font families starting with "A-OTF xxx" by Japan foundry <a href="http://luc.devroye.org/fonts-27267.html" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Morisawa &amp; Company LTD</a><br>
      Examples:<br>
      A-OTF ZenGoN Std (Medium Bold)<br>
      A-OTF WanpakuGN Std (Medium Bold)<br>
      A-OTF TypelaboN Std (Medium Bold)<br>
      A-OTF Shin Go Pro (M Medium Bold)<br>
      Links:<br><a href="http://typedia.com/explore/typeface/shin-go-pro/">http://typedia.com/explore/typeface/shin-go-pro/</a><br><a href="http://www.morisawa.co.jp/english/font/shingo.html">http://www.morisawa.co.jp/english/font/shingo.html</a></p>
      <p>#3 is the Latin counterpart of FOT-NewRodin Pro (DB) by "Fontworks Japan" foundry </p>
      <p><img src="/sites/default/files/old-images/bracegirdle1_4535.jpg"></p>
