    <p>Call me ignorant, but WHAT DOES THIS MEAN?<br>
    Lets just place the whole competition not commission debate aside for a second and I might just revive a few notes from DankRealms' post from a few years ago <a href="http://typophile.com/node/58352#comment-form" title="http://typophile.com/node/58352#comment-form">http://typophile.com/node/58352#comment-form</a>.<br>
    Surely we're not going to splatter our national paperwork with the loose and relaxed works of the Australian Type Foundry, yet when we're not surfy, not british and not European or American mirrors, what are we?</p>
    <p><a href="http://www.canberra.edu.au/typeface" title="http://www.canberra.edu.au/typeface">http://www.canberra.edu.au/typeface</a></p>
