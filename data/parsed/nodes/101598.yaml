      <p>Not those two (yet) but there <em>is</em> this:<br>
      <a href="http://typophile.com/node/89329" title="http://typophile.com/node/89329">http://typophile.com/node/89329</a></p>
      <blockquote><p>I guess if one can devise a typeface that says "government efficiency"</p></blockquote>
      <p>I suspect they instead would want to shed that image. An identity isn't just about what something is, but what something wants to be.</p>
      <p>BTW when I first heard about the resistance to so-called "spec work" among design organizations, my instincts smelled a rat. Eventually, I caught the rat: they don't like the idea because it costs the established elite (who mutually-validate such organizations) client projects = money. The elite want to continue charging half a million dollars for putting two Helvetica letters next to each other... And if they can get paid for only delivering a proposal that gets rejected (nevermind because it sucked) that's nice too. Basically, they want to be the ones usurping/repressing young talent instead of clients usurping/promoting it... So letting talented newborn designers get a foot in the door (without having to slave for years for large design studios, sometimes thereby losing their fruitful individuality) is a positive side. Why do some upcoming talents also oppose spec work? Maybe because they want to be among the elite eventually... I guess it's a matter of how one approaches life: work menially for years and eventually land in a cushy establishment position, versus become culturally significant quickly and hopefully keep innovation at the heart of your work. Some people start planning for their retirement when they're 18, others never do. To me something in between is best. Ergo: spec work can be problematic (like when an organization charges for people to compete) but it's still a natural part of human competitiveness.</p>
      <p>An even nicer positive side is that cities wanting a bespoke typeface is awesome news for us. There's like thousands of them!  :-)</p>
      <p>hhp</p>
