      <p>Since the other thread* has taken on the mainstream aspects of this topic, it might be worthwhile to earnestly address what seems to be Rosetta's (great name for a type designer BTW :-) original intent in this thread: what <em>is</em> Australian typography?</p>
      <p>* <a href="http://typophile.com/node/101651" title="http://typophile.com/node/101651">http://typophile.com/node/101651</a></p>
      <p>I'm not Australian, but I'm deeply fascinated with conveying ethnicity in type design. Anybody who thinks it's pretty limited -especially in text face design- is totally right; anybody who thinks is totally irrelevant is dead wrong.</p>
      <p>Something small I've written addressing this issue is my review of Lisboa here:<br>
      <a href="http://typographica.org/on-typography/our-favorite-typefaces-of-2005/" title="http://typographica.org/on-typography/our-favorite-typefaces-of-2005/">http://typographica.org/on-typography/our-favorite-typefaces-of-2005/</a></p>
      <p>I think of Australia and Canada as the "suburbs" of the core Anglo cultures; it's almost like they're US states - in fact to make a point I often refer to Canada as the Hockey State... This means it's easier for them to import culture than to generate it. But if we can get them to generate more of their own culture the world would be a richer place. So how can Australia be motivated in this way? Maybe this competition could help, but of course there must be much more.</p>
      <p>hhp</p>
