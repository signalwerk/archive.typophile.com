      <p>I myself would be totally OK with it if they didn't charge for entry. That's a bit much.</p>
      <p>As for being able to convey a specific locale with a typeface, there are of course severe limits, but just like you can choose a font that says "London" for example more than some other font, you can certainly <em>make</em> a font that says Canberra to some degree. When you see it, you feel it, or you don't. The main problem with Canberra here is that very few non-Australians (and possibly not even a huge proportions of Australians) have any identifiable feeling of it.</p>
