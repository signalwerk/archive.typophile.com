      <p>At first, when I saw the topic of this thread, comparing it to a thread about the Greek typographical situation, also added, my initial attitude was derisive. But it didn't take too long for me to realize my mistake.</p>
      <p>British typography is distinct from American typography, despite the two countries having the same language; and the typography of other Latin-alphabet nations is also even more distinctive; for example, that of Germany and that of France.</p>
      <p>Australian typography is already distinctive - although similar to British typography, it admits some admixture of American elements. Canadian typography, on the other hand, at least superficially, might be viewed as essentially identical to American typography.</p>
      <p>That's not quite true; there are Canadian typefounders - some of whom participate in this very forum - and every country's typography is the product of the finite number of individuals who are its typographers. But the difference isn't obvious.</p>
      <p>In the 1960's, a Canadian "Sunday supplement" - it actually appeared in the Saturday editions of newspapers, as our blue laws were stricter than those in much of the U.S. at the time - <em>Weekend</em> magazine - was set in Optima. That may have been a bit more adventurous than common in the U.S. at the time.</p>
      <p>@hrant:<br>
      <cite>I think of Australia and Canada as the "suburbs" of the core Anglo cultures; it's almost like they're US states - in fact to make a point I often refer to Canada as the Hockey State... This means it's easier for them to import culture than to generate it. But if we can get them to generate more of their own culture the world would be a richer place.</cite></p>
      <p>One can't argue with that. But one can argue with some of the means used to achieve this goal. I lost access to two of my favorite TV shows - <em>Mission: Impossible</em> and <em>The Beverly Hillbillies</em> - in my youth thanks to Trudeau's "Canadian Content" policies.</p>
      <p>Economic factors do mean that with a market a tenth the size, production values will suffer for movies - and the current state of the movie market is such that even Hollywood is suffering. Because going to the theatre is so expensive, audiences demand blockbusters like <em>Star Wars</em> or <em>Avatar</em> for their money.</p>
    html_clean: |-
