      <blockquote><p>There's a big difference between accusing a country of not generating a distinctive culture and not exporting it.</p></blockquote>
      <p>But I would contend that worthwhile original contributions do end up getting exported, without anybody even really trying. So if Americans aren't importing a given element of Canadian culture, it's either because they already have it, or they don't think it's a big enough deal.</p>
      <p>BTW, FWIW: <a href="http://www.bbc.co.uk/news/magazine-22213218" title="http://www.bbc.co.uk/news/magazine-22213218" class="link-external">http://www.bbc.co.uk/news/magazine-22213218</a></p>
