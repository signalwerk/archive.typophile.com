      <p>FYI Canberra is a "bureaucrat's" city -- lots of government offices, like a mini version of Washington DC. The Australian parliament is there, so is the National Library (awesome library). The defense department is there, so is the prestigious Australian military college (used to be called Duntroon). The Australian National University (ANU) is there, plus a couple of other smaller universities. The city itself is beautifully designed from ground-up by Burley Griffin (Chicago architects).</p>
      <p>I guess if one can devise a typeface that says "government efficiency", then you could apply it to Canberra.  However, Canberra is *not* a representative of Australia.  Sydney and Melbourne have  a totally different feel.</p>
      <p>Is there a typeface for Brussels or Washington DC ?</p>
