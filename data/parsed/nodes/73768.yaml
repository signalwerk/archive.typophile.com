    votes: null
    html: |-
      <p>Some possible contributing factors:<br>
      - I made the slides using the beamer class in xeTeX, which creates relatively small documents (smaller than letter size) that are then enlarged.<br>
      - Further tests show that it's worst with the Subhead optical size of Chaparral. The other cuts rasterize better.  I notice that the regular variant has hinting on the cross of the 't', but the optical sizes don't. This may have something to do with it. I know that xeTeX does use optical sizes when appropriate.<br>
      - Could Freetype be auto-hinting, whereas Acrobat is trying to use hints, but not doing it so well for on-screen rendering?</p>
      <p>So, a more specific question: Does anyone know if there is any way to change the way that Acrobat uses hinting in order to test this hypothesis?</p>
      <p>st</p>
