      <p>For one, evince uses <a href="http://www.freetype.org/" rel="nofollow">FreeType</a>. Acrobat uses Adobe's own proprietary algorithms.</p>
      <p>It's funny, because you'd think Adobe should have done <em>better</em> than Any Old Open Source project ...</p>
