  html: |-
    <p>I've been using Acrobat to show lecture slides, and I've noticed that the typeface I'm using (Adobe Chaparral Pro) doesn't rasterize in the best way in Acrobat. To my eye, it looks much better either using evince in Linux or GhostView in Windows. I've included two images below, with the one on the left Acrobat's rendering and the one on the right evince's render. I assume it's something like a font hinting issue, but the rendering options under Edit-&gt; Preferences in Acrobat don't help. Thanks in advance for any insight you can provide.</p>
    <p>st</p>
