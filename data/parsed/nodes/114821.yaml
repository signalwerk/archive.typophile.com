    <p><a href="http://www.cbc.ca/news/canada/toronto/honest-ed-s-sells-its-signs-1.2564440?cmp=rss" title="http://www.cbc.ca/news/canada/toronto/honest-ed-s-sells-its-signs-1.2564440?cmp=rss">http://www.cbc.ca/news/canada/toronto/honest-ed-s-sells-its-signs-1.2564...</a></p>
    <p>Honest Ed's is a discount store and long time fixture in Downtown Toronto since 1948. http://en.wikipedia.org/wiki/Honest_Ed's<br>
    They are closing now so someone can build - you guessed it, A condo. </p>
    <p>they were one of the last places to employ sign painters to do their in-house signs and advertising.<br>
    <a href="http://www.youtube.com/watch?v=hOrAeW7soVI" title="http://www.youtube.com/watch?v=hOrAeW7soVI">http://www.youtube.com/watch?v=hOrAeW7soVI</a></p>
