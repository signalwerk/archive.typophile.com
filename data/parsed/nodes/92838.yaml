      <p>More likely a stonecutter’s fancy, rather than a specific typeface. A few of the letters show mediæval influence—such as the A and R—while the balance have a strong traditional Roman character.</p>
      <p>Also note that some letterforms—such as the M—vary considerably in width from line to line.</p>
