      <p>The whole shape of the logo is not harmonious--it calls attention to itself in the bad way (which is why you think something is missing). </p>
      <p>You don't HAVE to use Myriad. All that does these days is scream Apple. Search Marketing sounds like it might have a more tech vibe, but maybe the font is ok. The color scheme is also quite organic and natural. Something tells me it there ought to be a more sophisticated, deeper color palette.</p>
      <p>But better typesetting would help tremendously. </p>
      <p>See the example, nothing saying its a good logo, but I'm putting it up just to say you need to think more simply:</p>
