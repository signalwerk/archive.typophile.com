  html: |-
    <p>A lengthy name for a logo, yes.  I had to create the logo with the entire 'Seattle Search Marketing .Net' was in the actual logo for identifying reasons, but also wanted to create a design element to make it pop a bit and make it easier to identify the brand.  </p>
    <p>You will see my attached logo includes themed circles throughout, from the 'S' shaped green and blue 'black hole' (which could also resemble a spinning arrow during search) -- to the same style dot/circle between Marketing and Net.</p>
    <p>You will see how it looks on black, which will be the main use, since the logo will be for a services/blog website.</p>
    <p>I'm fairly happy with the results, but feel something could be missing to make it a bit stronger.  Maybe it's a font change - if anyone has any suggestions on fonts...Any thoughts?</p>
