    <p>Here's one that I'd love to know so much more about.  It may have never ever been digitized, and usually ampersands like this only appear in the italic set of typefaces.  I will say that when I see this out in the world, it is usually with a title face that looks like Bodoni Poster Compressed but I'll keep my reservations.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/peoples-birds-ampersand_3810.gif"></div><p></p>
