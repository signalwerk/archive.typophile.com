      <p>Sure, there may be <em>a</em> Pistilli Roman on Dafont, but that doesn’t make it <em>the</em> Pistilli Roman. It’s a pretty shoddy digitization with poor spacing/kerning and strange mistakes (see below). We’re still waiting for a proper revival.</p>
      <p><a href="http://fontsinuse.com/typefaces/7640/pistilli-roman" rel="nofollow">More Pistilli at Fonts In Use</a> »</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/FontExplorer X ProSnap004_3586.png"></div><br>
      Poor kerning.<p></p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/FontExplorer X ProSnap001_5109.png"></div><br>
      Whoops.<p></p>
