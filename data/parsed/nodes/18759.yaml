      <p>Digital printing is what every laserprinter does. Back in 1988, I designed ITC Officina just for that purpose. Sturdy with blunt corners. A lot of letters have the same width, which is one of the things Officina inherited from Letter Gothic, which was my monospaced model.</p>
      <p>I never presumed that people would use Officina for anything but office correspondence, printed on Laserwriters or other "modest" resolution out put device. At the time, 300dpi was the norm, and Officina was made for that.</p>
      <p>FF Meta was designed for small sizes on bad paper, with pseudo-serifs and pretend-inktraps. That also makes it suitable for digital printing, which is all about a lot of thick ink and oil onto plain paper at medium resolution. The faces that worked well for bad printing conditions obviously work well for digital printing.</p>
