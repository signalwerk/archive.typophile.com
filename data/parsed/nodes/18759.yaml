      <p>I agree with the above comments. Most of the time, when you hear about "digital printing", one is talking about xerographic devices. Printers such as the HP Indigo, use liquid "ink", but the process is much the same. The plastic which holds the pigment is pressed onto the surface of the paper, but not into the paper they way letterpress does. Even litho inks interact more intimately with paper fibers. Devices like the Indigo can have their own, unique pathologies if they are out of adjustment. This is more true with color printing, where the printer may not understand features like overprinting.<br>
      Of course nowdays this mainly matters at small sizes.  </p>
      <p>Also, a lot of high speed photocopiers still produce documents at 300/600ppi. In those cases, Erik's types really look great. I also like Zapf's Melior.</p>
