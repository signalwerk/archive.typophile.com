      <p>This was far before the digital era, but is the only thing that comes to mind right off the bat. Bell Centennial which was designed by Matthew Carter. Specifically used at small point sizes, it avoided many problems that you get with sub-8 point type and dot gain.</p>
      <p>Other than that, having worked with two HP Indigo's, I do not really think that there is any difference between the type of quality that you can expect with fonts from a digital press then you would with a traditional press. The digital presses have their limitations, but they really do not restrict typography. There have been some jobs, high-end photography stuff, were the client thinks they can get good reproduction on the digital press, just like on the traditional press, and this is just not the case. Overall, IMO, the differences are more to do with color, sharpness, and tonal inconsistencies in photographs than with anything to do with type.</p>
