    <p>hello,</p>
    <p>regarding digital printing, i was wondering if anyone had any suggestions on typefaces and or type treatments, or any other type nuance that would lend themselves to this process. are there any type related problems that anyone has run into with a digital job? would you use a different approach if you were going to design a typeface that is intended for digital printing?</p>
    <p>thank you for reading this post. any thoughts would be greatly appreciated.</p>
    <p>------------------<br>
    nick cottrell</p>
