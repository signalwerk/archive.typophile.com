      <p>Kiko, thanks for the nice things you said about our typeface for Publico.</p>
      <p>There are a couple of things I want to clarify here:</p>
      <p><cite>My guess is that it’s a custom designed font, either by Christian Schwartz who did the The Guardian faces which were also inspired by Gerard Unger’s work, or by Gerard himself.</cite></p>
      <p>Paul Barnes and I designed all of the Guardian faces together (Publico, too), and I don’t deserve sole credit.</p>
      <p>I wouldn’t say we were ’inspired by Gerard Unger’s work’. These days, that term is usually interpreted as referring to a revival, i.e. the way Fenway was ’inspired’ by Fleischman’s work. We were certainly influenced by contemporary Dutch type design, and Gerard’s work is an important part of that, but we were also influenced by 19th century English Egyptians, Mark’s love of Renaissance italics, and the headline face the great Willi Fleckhaus used in <cite>Twen</cite>. Did you doze off during our lecture, Yves?</p>
