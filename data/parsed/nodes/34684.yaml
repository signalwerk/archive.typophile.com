    html: <p>OK, so I’ve found that it is indeed Público, a quality Portugese daily, which launched its redesign on february 12th. Mark Porter, Art Director of The Guardian, was in charge of the redesign, following the model of the British paper. My guess is that it’s a custom designed font, either by <a href="/wiki/Christian%252BSchwartz" class="wiki">Christian Schwartz</a> who did the <a href="http://christianschwartz.com/guardian.shtml">The Guardian faces</a> which were also inspired by <a href="/wiki/Gerard%252BUnger" class="wiki">Gerard Unger</a>’s work, or by Gerard himself.</p>
