    html: "<p>Vanilla backtracking. I think I'd written vanilla in terms of the ubiquity of the pairing (in my experience). But let's forget about the cliched, unclear metaphor: instead of continuing with what I know works, I'd like to try something new.  <br>A rocky road, <br>Crushed ice</p>"
