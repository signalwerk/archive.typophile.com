  html: |-
    <p>Looking for three fonts from these images. From Reading (the yellow one), the font that 'AUGUST BANK HOLIDAY WEEKEND' is written in, plus the one used for band names (not the ones that have their own logo, obviously - ones like Deftones, Jimmy Eat World etc). From Download (the black one), the font used for 'MAVERICK_AC'.</p>
    <p>I like making fake posters with line-up predictions, and want to make them as realistic as possible using the correct fonts and everything. Had trouble finding a good match though, I'm a bit of a noob at typography...</p>
    <img typeof="foaf:Image" class="img-responsive" src="http://www.typophile.com/sites/default/files/old-images/Reading_web-31-3.gif" width="909" height="1285" alt="">
    <img typeof="foaf:Image" class="img-responsive" src="http://www.typophile.com/sites/default/files/old-images/ac_twit_bg.jpg" width="2000" height="1017" alt="">
