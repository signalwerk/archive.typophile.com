    <p>Just thought I would start a repository for all the Robothon recaps and photos that will be posted in the next few days as everyone recovers from the (exhausting) 3 day event.</p>
    <p>for those with flickr accounts you can add your photos to the Robothon group:<br>
    <a href="http://www.flickr.com/groups/robothon09/" title="http://www.flickr.com/groups/robothon09/">http://www.flickr.com/groups/robothon09/</a></p>
    <p>Here are a few of the Robothon recaps I have found, please add more if you know of any.</p>
    <p>Rob Keller's coverage: <a href="http://www.youshouldliketypetoo.com/showcase/robothon-2009/" rel="nofollow">here.</a></p>
    <p>Dan Reynolds writes about his experience at the conference <a href="http://www.typeoff.de/?p=504" rel="nofollow">here.</a></p>
    <p>Ricardo Lafuente has some very in-depth posts about Robothon <a href="http://tinkerhouse.net/log/?s=Robothon" rel="nofollow">here</a></p>
    <p>--</p>
    <p>After Robothon the fourth Gerrit Noordzij exhibition was opened, the exhibition of the work of Tobias Frere-Jones was accompanied by a <a href="http://abiabiabi.com/index.php?/project/tobias-frere-jones-catalogue/" rel="nofollow">catalogue</a> which was given out at the opening and will be sold by the publisher: Uitgeverij de Buitenkant. <a href="http://www.flickr.com/photos/tags/tobiasfrerejonesgerritnoordzijprizeexhibition/" rel="nofollow">Some exhibiton images here,</a> more soon.</p>
    <p>The Tobias Frere-Jones exhibition also made it on to the <a href="http://www.rtl.nl/components/actueel/rtlnieuws/miMedia/2009/week10/vr_1930_letters.avi_plain.xml" rel="nofollow">news</a></p>
    <p>On Saturday was a short seminar on the occasion of the Gerrit Noordzij prize and Paul Barnes, Rich Roat, Chris Vermaas, Tobias Frere-Jones and Piet Schreuders (followed by a performance by the Beau Hunks). I'm sure Erik will post a link to the video clips of the Robothon and Gerrit Noordzij prize lectures here as soon as they are up.</p>
    <p>--</p>
    <p>Late that night there was small gathering of Type and Media students, Type and Media alumni and some friends from Reading. Some fun was had with the coasters that were on the table: <a href="http://www.flickr.com/photos/katanan/3341378046/" rel="nofollow">here</a> and <a href="http://abiabiabi.com/index.php?/other/jupiler-coaster--typecooking/" rel="nofollow">here</a></p>
