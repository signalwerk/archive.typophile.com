    html: <p>david, thank you for your post and the links i should have provided... it was my first inclination  to pair Paradox with another Gerard Unger typeface because of everything Hrant said, but  it seems that maybe another Unger face migth be too harmonious if that makes sense. so i'm looking for a more creative pair something with more contrast... also for more backround, these typefaces will be used in a fresh new literary publication.</p>
