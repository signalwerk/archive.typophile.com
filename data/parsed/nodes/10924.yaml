    html: <p>Vesta would be your best bet, but if you need a big family with many weights and sc and osf, Argo from DTL would be great. I chose Coranto with Vesta for a project and they work extremely well together. Paradox is almost identical to Coranto, only that it has a smaller x-height and longer ascenders and decenders.</p>
