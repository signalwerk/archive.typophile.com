    votes: null
    html: "<p>For everyone's reference, here's Paradox:   <br>   <br><a href=\"http://www.gerardunger.com/allmytypedesigns/allmytypedesigns17.html\" target=\"_blank\">http://www.gerardunger.com/allmytypedesigns/allmytypedesigns17.html</a>   <br>  <br>also:  <br>  <br><a href=\"http://www.dutchtypelibrary.nl/DTLParadox.html\" target=\"_blank\">http://www.dutchtypelibrary.nl/DTLParadox.html</a> <br>   <br>I don't have any first-hand experience with Paradox (or any of the other beautiful faces from the Dutch Type Foundry, although many of them are on my wish list), but I would start my search among DTL's selection of sans serif faces. I'd look first at sans serifs designed by Gerard Unger, who designed Paradox, as his sans serif designs might well work compatibly with Paradox.   <br>   <br>Good luck!   <br>   <br>David</p>"
    html_clean: "<p>For everyone's reference, here's Paradox:   <br>   <br><a href=\"http://www.gerardunger.com/allmytypedesigns/allmytypedesigns17.html\" target=\"_blank\" class=\"link-external\">http://www.gerardunger.com/allmytypedesigns/allmytypedesigns17.html</a>   <br>  <br>also:  <br>  <br><a href=\"http://www.dutchtypelibrary.nl/DTLParadox.html\" target=\"_blank\" class=\"link-external\">http://www.dutchtypelibrary.nl/DTLParadox.html</a> <br>   <br>I don't have any first-hand experience with Paradox (or any of the other beautiful faces from the Dutch Type Foundry, although many of them are on my wish list), but I would start my search among DTL's selection of sans serif faces. I'd look first at sans serifs designed by Gerard Unger, who designed Paradox, as his sans serif designs might well work compatibly with Paradox.   <br>   <br>Good luck!   <br>   <br>David</p>"
