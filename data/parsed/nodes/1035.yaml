    html: <p>The <a href="http://www.adobe.com/type/browser/F/FUTQ/F_FUTQ-10016000.jhtml">Adobe version</a> is my least favorite. It was one of their  <br>earliest releases and you can kinda tell. <br> <br>The <a href="http://www.myfonts.com/fonts/bitstream/futura/">Bitstream version</a> is pretty good, especially for text.  <br>There is also <a href="http://www.neufville.com/uk/startfuk.htm">the new one from Neufville Digital</a> which looks  <br>very good and has lots of extras like small caps and old  <br>style numerals. Also, it has CE, Turkish and Baltic language  <br>support. <br> <br>One thing that I miss from the pre-digital days are the  <br>display cuts of Futura. All the available digital versions  <br>seem to be based on the text sizes (except, I remember  <br>Image Club did display versions, I don't know if those are  <br>still available). The text cuts--even good ones--look a bit  <br>clumsy at display sizes.</p>
    html_clean: <p>The <a href="http://www.adobe.com/type/browser/F/FUTQ/F_FUTQ-10016000.jhtml" class="link-external">Adobe version</a> is my least favorite. It was one of their  <br>earliest releases and you can kinda tell. <br> <br>The <a href="http://www.myfonts.com/fonts/bitstream/futura/" class="link-external">Bitstream version</a> is pretty good, especially for text.  <br>There is also <a href="http://www.neufville.com/uk/startfuk.htm" class="link-external">the new one from Neufville Digital</a> which looks  <br>very good and has lots of extras like small caps and old  <br>style numerals. Also, it has CE, Turkish and Baltic language  <br>support. <br> <br>One thing that I miss from the pre-digital days are the  <br>display cuts of Futura. All the available digital versions  <br>seem to be based on the text sizes (except, I remember  <br>Image Club did display versions, I don't know if those are  <br>still available). The text cuts--even good ones--look a bit  <br>clumsy at display sizes.</p>
