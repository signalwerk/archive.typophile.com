    html: <p>One <em>can</em> generate b,d,p, and q all by flipping the same shape around. This can be useful for comparing the weights of the individual glyphs for consistency, but it is generally regarded as bad practice with regard to actual design, but of course there are exceptions to that concept as well. It's not really a hard and fast rule; there could be some relationship to how the letters would be drawn by hand resulting in differing shapes for these similar letters. In a casual style such as this that concept probably should apply, whereas in a rational geometric sans (e.g., Futura, Avant Garde) it likely would not, or at least not as strongly.</p>
