    <p>Hey all, this is a question of taste. There's no one answer I'm looking for, just advice from those more versed than I.</p>
    <p>I'm designing a site which will @font-face embed Museo for use as body copy.</p>
    <p>The site is used for display of statistics and information, tastefully laid out on a grid. A few tabular structures. Nothing with long runs of body copy, and Museo performs beautifully at the task.</p>
    <p>What I am seeking is a reccomendation for a display face to be used sparingly in some prominent locations. Some considerations:</p>
    <p>* Some of these locations are large and numeric, so pretty numerals are important.<br>
    * Obviously, limited to faces which are either widely-installed (separate faces for Win/Mac ok) or legally @font-faceable.</p>
    <p>I've been having trouble settling on one. Thus far I've liked:</p>
    <p>* Museo Sans--usually only when set in uppercase<br>
    * Helvetica-alikes.<br>
    * League of Movable Type's (LMT?) <a class="freelinking external" href="http://www.theleagueofmoveabletype.com/fonts/4-chunk">ChunkFive</a>. I like it more for just the numerals.</p>
    <p>Any recommendations? What face would you use to set off Museo nicely?</p>
    <p>Thanks!</p>
    <p>Idan</p>
