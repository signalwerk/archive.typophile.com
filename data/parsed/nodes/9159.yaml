  html: <p>Hello everyone! <br>I'm searching materials for the publication devoted to the avantguard fonts of the 1910-20s. <br>The subject is the influence of avantgaurde (expecially abstract) art on the acidental fonts. <br>I'm situated in russia, so I have a lot of materials on russian avantguard, and little on western.   <br>Any books or sites, mabe you can recommend me. <br>Fenx, comrades!</p>
  html_clean: <p>Hello everyone! <br>I'm searching materials for the publication devoted to the avantguard fonts of the 1910-20s. <br>The subject is the influence of avantgaurde (expecially abstract) art on the acidental fonts. <br>I'm situated in russia, so I have a lot of materials on russian avantguard, and little on western.   <br>Any books or sites, mabe you can recommend me. <br>Fenx, comrades!</p>
