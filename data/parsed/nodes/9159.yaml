    html: <p>Probably the best single-volume reference to the typographical avantgarde is Herbert Spencer's "Pioneers of Modern Typography", which has a lot of material on the Futurists, El Lissitzky, Rodchenko, Kurt Schwitters and his "solid poetry", and the like. <br> <br><a href="http://youworkforthem.com/product.php?sku=P0351" target="_blank">http://youworkforthem.com/product.php?sku=P0351</a> <br> <br>If you don't have one of the permutations of Lewis Blackwell's "20th Century Type", that's a pretty good overview of modernism in the West, but as it's a survey that covers an entire century, its coverage is short. <br> <br>I think most of the really interesting stuff back then happened in Central and Eastern Europe anyway. I don't know how easy it is to find contemporary histories in Russian on that stuff (although given how heavily the Soviets coopted Futurist style, it might not be that tough), but I think you're in a great place.</p>
    html_clean: <p>Probably the best single-volume reference to the typographical avantgarde is Herbert Spencer's "Pioneers of Modern Typography", which has a lot of material on the Futurists, El Lissitzky, Rodchenko, Kurt Schwitters and his "solid poetry", and the like. <br> <br><a href="http://youworkforthem.com/product.php?sku=P0351" target="_blank" class="link-external">http://youworkforthem.com/product.php?sku=P0351</a> <br> <br>If you don't have one of the permutations of Lewis Blackwell's "20th Century Type", that's a pretty good overview of modernism in the West, but as it's a survey that covers an entire century, its coverage is short. <br> <br>I think most of the really interesting stuff back then happened in Central and Eastern Europe anyway. I don't know how easy it is to find contemporary histories in Russian on that stuff (although given how heavily the Soviets coopted Futurist style, it might not be that tough), but I think you're in a great place.</p>
