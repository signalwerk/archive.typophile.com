    html: "<p>&gt;the influence of avantgaurde (expecially abstract) art on the acidental fonts <br> <br>Not much: de Stijl artist Theo van Doesburg's \"square\" lettering (from c. 1912?) was not made into a typeface until the digital era. Square fonts were made in the 1930s (eg Agency Gothic), but there's no connection to Doesburg's work.</p>"
