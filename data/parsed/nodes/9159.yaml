    html: "<p>Jakob Erbar was, IMHO, one of the first type designers to express 20th century modernism, with his condensed sans (1922): <br> <br><a href=\"http://www.linotype.com/7-380-7/jakoberbar.html\" target=\"_blank\">http://www.linotype.com/7-380-7/jakoberbar.html</a> <br> <br>His Koloss (1923) is quite modern, with a little bit of art deco, but not as much as Morris Benton's Broadway (1925). <br> <br><a href=\"http://www.linotype.com/188/broadway-family.html\" target=\"_blank\">http://www.linotype.com/188/broadway-family.html</a> <br> <br>All these types preceded the definitive modernist type, Futura, which was released in 1928 (although first proofed as early as 1926), Bernhard Gothic (1929), Nobel (1929), and Kabel (1928). <br> <br>There are other ways of defining avant garde, rather than following this \"modernism\" thread. <br> <br>In the first two decades of the 20th Century, Art Nouveau and Arts &amp; Crafts were two art movements which were precursors of Modernism, and which produced radical typefaces which were avant garde in the sense of challenging the status quo. However, their advances weren't followed into the mainstream, as were those of modernism.</p>"
    html_clean: "<p>Jakob Erbar was, IMHO, one of the first type designers to express 20th century modernism, with his condensed sans (1922): <br> <br><a href=\"http://www.linotype.com/7-380-7/jakoberbar.html\" target=\"_blank\" class=\"link-external\">http://www.linotype.com/7-380-7/jakoberbar.html</a> <br> <br>His Koloss (1923) is quite modern, with a little bit of art deco, but not as much as Morris Benton's Broadway (1925). <br> <br><a href=\"http://www.linotype.com/188/broadway-family.html\" target=\"_blank\" class=\"link-external\">http://www.linotype.com/188/broadway-family.html</a> <br> <br>All these types preceded the definitive modernist type, Futura, which was released in 1928 (although first proofed as early as 1926), Bernhard Gothic (1929), Nobel (1929), and Kabel (1928). <br> <br>There are other ways of defining avant garde, rather than following this \"modernism\" thread. <br> <br>In the first two decades of the 20th Century, Art Nouveau and Arts &amp; Crafts were two art movements which were precursors of Modernism, and which produced radical typefaces which were avant garde in the sense of challenging the status quo. However, their advances weren't followed into the mainstream, as were those of modernism.</p>"
