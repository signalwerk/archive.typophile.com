      <p>It depends on the typeface. If it's a text face, then you should make some test documents that have text set in the way you aim the typeface to be used. Is it a book text typeface then set some representative pages of a literary text. Is it a newspaper typeface then design a mock newspaper. Is it a dictionary typeface, then design a few pages of a mock dictionary. You get the idea?</p>
      <p>Also, you should choose a language for which you design the typeface. From one language to another there are different frequencies of characters, of ascenders and descenders, diacritical marks, and capitalization rules (German capitalizes all proper nouns eg.). This can change the colour and texture of the columns of text a great deal.</p>
      <p>Points to consider: Stick to one point size of your test text so you can compare changes to the typeface design by comparing your stack of prints. Annotate the prints with the font version and the date and time it was printed. You can setup Indesign to do the date &amp; time automatically.</p>
      <p>Expand the sophistication of the test document as you add glyphs and features to the font.</p>
      <p>Find one acceptable quality high resolution laser-printer. Compare it's output to off-set printed materials. Some laser-printers are too dark, others too light, some are quite close to off-set print, but they are always unsharp/low-resolution.</p>
      <p>You should print in black if it's a text typeface you are designing. Greyscale is pointless.</p>
      <p>As for paper, choose something close to the intended medium as per my preceding remarks.</p>
      <p>When you have a design down on your laser-printer, try to have it off-set printed to fine tune the design.</p>
