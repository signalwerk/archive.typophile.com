    <p>Hello everybody,</p>
    <p>I don't have any education concerning typedesign, so I was wondering this: How should I make my test-prints?<br>
    What kind of paper?<br>
    The letters in dark-grey or black?<br>
    Bleached paper or not?<br>
    What settings in Adobe Reader?<br>
    or anything else I might need to know.</p>
    <p>Thanks in advance,</p>
    <p>Jasper de Waard</p>
