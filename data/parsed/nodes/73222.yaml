      <p>Laser printer or inkjet?</p>
      <p>The kind of paper and whether or not it's bleached is immaterial, as long as it's reasonably smooth and fairly bright: rough paper might introduce artifacts which don't reflect the actual quality of the outlines. Likewise, screening the letters may distort the outlines, so pure black would be preferable.</p>
