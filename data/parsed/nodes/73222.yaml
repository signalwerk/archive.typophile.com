      <p><cite>What kind of paper?</cite></p>
      <p>The cheapest office paper that will run through your laser printer without making it jam. Because once you get serious about your proofs you will be printing a LOT. Right now I’m finishing up a family with eight masters and blasting through a few hundred pages of proofs a week.</p>
      <p><cite>The letters in dark-grey or black?</cite></p>
      <p>Black—grey is not a solid color.</p>
      <p><cite>Bleached paper or not?</cite></p>
      <p>Definitely bleached, because most printing is done on white paper.</p>
      <p><cite>What settings in Adobe Reader?</cite></p>
      <p>Set up your proofs in a layout program, you shouldn’t be using Adobe Reader at all. I do almost all of my proofing in Indesign, which is very convenient because it makes it very easy to swap out fonts throughout the document and I can create looping nested styles for proofs that compare multiple fonts character-by-character.</p>
