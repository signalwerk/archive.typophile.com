    html: <p>Die Gestalten clearly states that Blender was inspired by a design by Wim Crowel, which also happens to be the same source of inspiration as The Foundry’s Gridnik. I actually like Blender, it’s more subtle, but I can see a little too much of Radio in Pemba. I’m attaching a comparison of Gridnik (in black) vs Blender (in gray). They are definitely very similar.</p><div class="imageWrap"><img src="files/blendnik.jpg"></div><p></p>
