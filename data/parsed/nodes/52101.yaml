    <p>Hello!</p>
    <p>I am working on a text panel for a museum exhibition for a show about modern art from Kyoto. I would love feedback, ideas, criticism - don't be shy. This is a new job for me, very type heavy and any support I can get would help me a lot. </p>
    <p>Some questions:<br>
    Do you like the "nesting" of the type?<br>
    Does the orange line do anything for you?<br>
    What do you think about splitting up "modern art from" and "boston's sister city"?<br>
    and anything else you can think of...</p>
    <p>Some issues to consider: it has to be vector and simple, it's a modern art exhibition of ceramics, prints, and textiles.</p>
    <p>Thanks!<br>
    Lee</p>
