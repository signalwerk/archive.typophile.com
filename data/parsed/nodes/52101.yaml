    html: |-
      <p>Hi Lee,<br>
      Are you still working on the logo? It's been a while since you've posted this...</p>
      <p>The first thing that jumps to mind is "Why Univers?". Univers is sooo commonplace and without character, great for small print, but certainly not my first choice for a logo.<br>
      I like the nesting, though if it were me, I would try some variation in sizes, and maybe put them more toghether even.<br>
      The placing of the orange line is strange. Why not at the top of the x of "Kyoto"? I even wonder if you need it at all; I always think that when a line is needed in a typographical logo, it isn't designed well enough. For me personally: loose the line.</p>
