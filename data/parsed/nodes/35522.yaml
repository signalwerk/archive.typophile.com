    <p>One of my favorite bands, Travis, has just released a new album (The Boy With No Name) and a single, Selfish Jean.<br>
    With Selfish Jean comes a website (<a href="http://www.selfishjean.com" title="http://www.selfishjean.com">http://www.selfishjean.com</a>), where one can confess acts of selfishness, donate for a good cause and download a free font. Design credits of the font go to Martin Demetri, but my guess is, it's based on his handwriting.</p>
