      <p>Using WhatFontIs:<br>
      As far as shapes go, <a href="http://www.ffonts.net/Sci-Fied-2002.font" rel="nofollow">Sci Fied 2002</a> (Andreas Nylin) is a look-a-like, except for the 'N'.</p>
      <p>Ray Larabie's <a href="http://www.myfonts.com/fonts/typodermic/neuropol-x/" rel="nofollow">Neuropol X</a> has sort of the same vibe.</p>
      <p>Nothing with an N quite like this, and nothing with the elaborate ligatures.<br>
      Can you tell where you got your sample? That might help.</p>
