      <p><em>[sorry for the non-English answer, but I am focusing some issues very specific to Brazilian academic norms, known as “ABNT rules”, and it would need somewhat longer English explanations to make sense for other typophiles.]</em></p>
      <p>Youssef, entendo sua preocupação porque também não gosto das normas da ABNT. Elas já eram ruins antes e ficaram ainda piores com a atualização de 2002-2003. Tenho certeza que ninguém na ABNT conhece um mínimo de tipografia ou editoração, mas ainda assim determinam como milhares de estudantes têm de formatar seus trabalhos.</p>
      <p>Já o manual de Chicago é uma referência mais ou menos universal e muito bem feita, muito superior à ABNT. O problema é que os estudantes já têm dificuldade para aplicar as normas da ABNT e não acho que trocar um conjunto de regras por outro vá ajudar no seu caso. Mesmo que houvesse uma versão traduzida e simplificada das normas de Chicago, creio que isso só confundiria os acadêmicos. Além disso, certos aspectos do sistema americano são bem estranhos para os nossos hábitos.</p>
      <p>O que eu faria no seu caso seria editar um desses manuais que as faculdades fornecem sobre as normas da ABNT usadas pela instituição. Removeria todas as regras e detalhes excessivamente rígidos e desnecessários, fazendo uma orientação simples. Exemplo: a entrelinha com espaçamento duplo é uma aberração, resquício das máquinas de escrever e de quando o professor anotava as correções no espaço <em>entre</em> as linhas. Hoje, o professor não está limitado às linhas em branco, pode mandar observações por email ou mesmo colocar notas diretamente no arquivo digital, em cor ou tipo diferente. Assim, a entrelinha dupla pode (e deve) ser dispensada.</p>
      <p>Por outro lado, acrescentaria algumas regras tipográficas flexíveis. Por exemplo: quanto às fontes, orientar o uso de apenas uma serifada em todo documento ou uma serifada nos textos em geral e uma não serifada nos títulos e subtítulos, apresentando uma lista de fontes a escolher (já que dificilmente o pessoa saberia o que é “serifada”). Quanto à separação silábica, reiterar que ela deve ser usada. Quanto ao alinhamento, usar o justificado no texto em geral, mas permitir o centralizado em títulos e subtítulos. Coisas assim.</p>
      <p>Ficaria ainda melhor se no manual você incluísse breves notas explicando porque determinado critério deve ser observado. Por exemplo: a fonte serifada é melhor para leitura imersiva porque as letras são melhor diferenciadas e a visão, que se cansa com a leitura, é favorecida quando não é preciso fazer esforço para distinguir um n de um ri ou um l de u I (problemas típicos das não serifadas). Assim, os alunos são seguiriam as regras apenas porque o professor determinou, mas adeririam a elas porque há um motivo lógico para serem adotadas.</p>
      <p>Aproveitando o exemplo da entrelinha: se o espaço duplo é horrendo e prejudicial à leitura (um texto visualmente rarefeito contraria o fluxo de atenção), tampouco é adequado usar linhas muito estreitas. Basta lembrar aos alunos quantas vezes eles já não estavam lendo um jornal ou revista e, ao terminar a linha, seus olhos recomeçaram a ler a mesma linha e não a seguinte. Isso indica entrelinha muito apertada, coisa típica de jornais, e deve ser evitada com uma folga, usualmente de 20% da altura do texto. Um explicação dessas seria um alento para a nossa educação.</p>
      <p>Quanto ao sujeito que respondeu de maneira grosseira, o melhor é ignorá-lo. Não é de hoje que a criatura em questão tumultua as discussões por aqui. Felizmente, há muitas pessoas com conhecimento e educação e com essas eu sempre aprendo bastante. Se você achar que posso ajudar de alguma outra forma, basta escrever para contato arroba if ponto pro ponto br.</p>
