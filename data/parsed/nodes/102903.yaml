      <p>I agree with S.Olsen. Pick an established style such as MLA or APA and be done with it. It has the following benefits:</p>
      <p>a) Saves you time. No need to develop your own style guides.<br>
      b) Teaches your students a format that most journals will <strong>require</strong> manuscripts to be submitted in. They will most cartainly need to do this at some point in their academic career anyway.<br>
      c) Safes future teachers time from having decode a unique typographic system out of a stack of similarly formatted papers—should students continue to follow your unique guidelines.</p>
