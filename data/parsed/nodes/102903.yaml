      <p>Certainly an odd situation.</p>
      <p>If I were you I’d reference the Chicago Manual of Style and take what you will from there. </p>
      <p>As an undergraduate student myself, most professors don’t worry much about typographic correctness—the focus is on more general style laws such as correct quoting and citing. </p>
      <p>Simply pick an appropriate style, such as MLA or APA, and tell the students to follow that.</p>
      <p>Unless it is a paper on typography or design, then of course be sure to look for good leading, em/en dashes, correct curly quotes, etc.</p>
