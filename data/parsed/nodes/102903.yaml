      <blockquote><p>An academic essay should follow some standard manuscript format, which is completely different from the design of a well typeset published text. "Ugliness" would not be a concern of mine in this situation — not until one of these essays goes to press in a journal. Then I would care.</p></blockquote>
      <p>The notion of an academic *journal* is a strange one. I say this as someone who has both typeset a number of scholarly journals for an extended period of time -- over ten years with some journals -- and as one who has designed them.</p>
      <p>The difficulties arise with authors, and editors who have sense enough to recognize something special, and let it by.</p>
      <p>Within the text, over that 10 years, you'll have prose extracts that contain within them subheads, verse extracts. lists -- whatever can be written can be quoted. In the current journal, what's the style for these elements?</p>
      <p>Someone will occasionally think it important to have epigraphs to their subheads. </p>
      <p>You'll have numbered lists within bulleted lists. Etc. </p>
      <p>Essentially, whatever complication anyone can think of will occur.</p>
      <p>Chapter openings perforce contain an article title and author (or two or three or five). But some will use a subtitle, some an epigraph, and/or a dedication, and/or a text opening subhead -- and occasionally, all these elements -- usually when the title/subtitle is quite long and there are five authors...</p>
      <p>Many of the authors of such articles seem have the (today's) stature of Paul Samuelson; both good and famous. On both accounts, you don't say anything but yes, sir...</p>
      <p>Or:<br>
      I set one legal journal that called a footnote is the first line of the article. I say footnote, as that's what was used, not end-of-article notes. That footnote went on for three typeset pages. The next note was called in the third line of the text. </p>
      <p>So, after we all put our heads together, we set the article opening, two lines of text, then the called footnote for the next three pages, and only then the third line of the text (which called footnote 2) etc. In short, standard, but worrisome for all of that.</p>
      <p>Now the first point of all this is that the design of a journal better be simple, in order to be flexible.</p>
      <p>The second point is there are articles where all these elements do turn out to be important; where the text is the better for their use. Of course not all of the articles, but enough to provide for their accommodation.</p>
      <p>So, journals *design* is the hardest thing there is, because you cannot see, or even anticipate, all the elements to attend to.</p>
      <p>The same, I would think, for student work, from doctoral dissertations on down. Good research &amp; good writing are just that. You can penalize the overly flamboyant when that's all it is, but you shouldn't prohibit anything. One of the hard parts about being a teacher is recognizing the difference, especially with students doing upper level or graduate work. Yes, I've been there, I wasn't that good at it, and is one reason I didn't like teaching.</p>
    html_clean: |-
      <blockquote><p>An academic essay should follow some standard manuscript format, which is completely different from the design of a well typeset published text. "Ugliness" would not be a concern of mine in this situation — not until one of these essays goes to press in a journal. Then I would care.</p></blockquote>
      <p>The notion of an academic *journal* is a strange one. I say this as someone who has both typeset a number of scholarly journals for an extended period of time -- over ten years with some journals -- and as one who has designed them.</p>
      <p>The difficulties arise with authors, and editors who have sense enough to recognize something special, and let it by.</p>
      <p>Within the text, over that 10 years, you'll have prose extracts that contain within them subheads, verse extracts. lists -- whatever can be written can be quoted. In the current journal, what's the style for these elements?</p>
      <p>Someone will occasionally think it important to have epigraphs to their subheads. </p>
      <p>You'll have numbered lists within bulleted lists. Etc. </p>
