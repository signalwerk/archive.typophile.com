      <p>Variations on this question come up a lot, and I think they often result from a misunderstanding of what typography actually is, which is the design of a finished text for publishing or distributing. There is manuscript formatting (<em>typing</em>), which is practiced by authors; and then there is design (<em>typography</em>), which is practiced by typographers, typesetters, and graphic designers.</p>
      <p>An academic essay should follow some standard <em>manuscript format</em>, which is completely different from the design of a well typeset published text. "Ugliness" would not be a concern of mine in this situation — not until one of these essays goes to press in a journal. Then I would care.</p>
      <p>In an academic setting, papers should be double-spaced with 1 inch margins in some boring old normal font on 8.5 x 11 paper. This is a vaguely old-fashioned view and not everyone will agree with it, but I would not encourage students to "design" manuscripts. Leave that to the book designer whose hands the manuscript eventually winds up in.</p>
      <p>As has been said above, if this is actually a design class, all that goes out the window.</p>
