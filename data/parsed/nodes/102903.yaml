      <p>* It is worth noting that the same document (from the federal university of São Paulo in Guarulhos) says</p>
      <blockquote><p>
      Os textos devem ser digitados em fonte Arial ou Times New Roman, cor preta, tamanho 12.
      </p></blockquote>
      <p>"cor preta" means "black", and "tamanho 12" mean "size 12" ... 12 points. Most readers can't tell the difference between Times New Roman and lots of serif fonts, but if the spacing is not chosen as the one given by Times, my guess is that it will be noticed.</p>
