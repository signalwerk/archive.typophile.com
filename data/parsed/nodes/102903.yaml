    html: <p>You are right, Michel. TCC, also called “monograph”, is a research work presented to conclude graduation. Students may be asked to produce other similar works during graduation, with narrower subjects. Its formatting is Youssef's target. There is a set of general rules defined by ABNT, a national equivalent to ISO or DIN. Universities adopt them in variable degrees. Unhappily, these rules are quite deficient regarding DTP.</p>
