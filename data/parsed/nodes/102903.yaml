    <p>I find myself in a situation in which I can prescribe rules for students writing final undergraduate essays. I have considered not mentioning formatting or typographical rules, or refer to the library's rules (always an interpretation of the pervasive nation-wide rules). I find both options unappealing, because the former leaves too much room for error (and random ugliness) and the latter is too strict and dull (a pattern of bad taste).</p>
    <p>Do you think I should just let it be, or that I could establish some pretty wide parameters (or a compromise solution)? Or determine that the supervisor might adjust the formatting if need be?</p>
    <p>If yes, what are some sensible and generic requirements I can establish?</p>
