      <p>"Good research &amp; good writing are just that. You can penalize the overly flamboyant when that's all it is, but you shouldn't prohibit anything."</p>
      <p>Yes.</p>
      <p>My main point above was that the traditions and standards of manuscripts are different from those of published papers — but as long as a student understands the basic expectations of format, there's no reason they shouldn't adjust as necessary for their specific paper.</p>
      <p>As a college student, I've recently written a paper in English that contained both Hebrew and IPA. I've written other papers that quoted Anglo-Saxon and included metrical stress notations and specialized poetry layouts for the sake of making a linguistic point. Sometimes I had to use something other than Times or some indent other than half an inch. But even as a fairly experienced typographer, I resist "designing" my academic papers more than is really necessary to make my argument. If I were designing them as part of a journal, they would look much different and more polished than they do for class.</p>
