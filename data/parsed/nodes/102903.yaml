      <p><em>In an academic setting, papers should be double-spaced with 1 inch margins in some boring old normal font on 8.5 x 11 paper. This is a vaguely old-fashioned view and not everyone will agree with it...</em></p>
      <p>I agree with the notion that there should typically be a standard format for all submissions, required by whomever is receiving them and will be marking them. This is a simple expedient for ensuring that all students have conformed to the length requirement of the submission.* But I also think that this standard format should serve some functional purpose relative to how it will be handled. The old 'double-spaced with 1 inch margins' format is, as Joshua suggests, related to manuscript submission requirements for publication, so in the context of academia was a good way to condition graduate students to producing such manuscripts. The format is designed to enable copy editing between the lines of text. It was introduced in the context of typewriter copy, however, and ignores the ease with which computer documents are reformatted these days. So I think it is entirely reasonable for a teacher to consider different formats, but this should be done not in in terms of ugliness or beauty, but in terms of usefulness. How does the teacher intend to engage with the document? Will he or she be marking grammatical and other textual problems? If so, there remains some merit in the double-spaced requirement, since what the teacher will be doing is akin to copy editing. But these days how many teachers regularly mark student submissions in this way (how many, frankly, are qualified to do so)? If the kind of written feedback a teacher provides addresses content, then a wider margin on one side is going to be more useful than double-spacing.</p>
