      <p>I don't know what the practice is  in the humanities and social sciences; personally, I have not submitted a "printout" in a long time. What I have been submitting in the last 10 years (and more) is LaTeX sources, relying on the LaTeX package suggested (required?) by the journal or the conference. Some publishers have their own package, for instance <a href="http://www.elsevier.com/author-schemas/preparing-documents-with-latex" rel="nofollow">Elsevier</a>; have a look at some templates for <a href="http://www.latextemplates.com/cat/academic-journals" rel="nofollow">academic journals</a>; on the example provided for elsarticle (Elsevier), lines are individually numbered; it would be crazy to do that manually. In my opinion, it is almost as crazy to spend time formatting footnotes for references and bibliography entries instead of using the software that does it in a systematic and coherent fashion. Students should be given the tools to work intelligently and efficiently.</p>
