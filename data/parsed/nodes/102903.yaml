      <p>I had a look at the document <a href="http://humanas.unifesp.br/home/index.php/biblioteca/manual-de-normalizacao" rel="nofollow">Manual de normalização</a> of the UNIFESP Guarulhos, dated 2012, and the suggested spacing is 1.5. </p>
      <blockquote><p>
      O espaçamento deve ser de 1,5 entre as linhas de todo o trabalho, exceto as partes a seguir […]
      </p></blockquote>
      <p>We have the same <a href="http://www.bib.umontreal.ca/theses/redaction.htm" rel="nofollow">requirement at Université de Montréal</a> (follow the link for pdf, in French) and I am a bit surprised that many still mention 2 as the standard.</p>
