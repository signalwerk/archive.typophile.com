      <blockquote><p>Students should be given the tools to work intelligently and efficiently.</p></blockquote>
      <p>Agreed.</p>
      <p> Of the journals we set, all are in either the humanities or social sciences. I don't believe they would accept a "manuscript" in LaTex, as the editors would not be able to work on the files.</p>
      <p>We've done some bookwork for presses who get in LaTex files  from time to time. There are people who can convert these to the format acceptable to the press, so we decline to set these -- Strictly based on economics, it would cost more for us to do the conversion than for someone set up to do that routinely.</p>
      <p>But the point I was trying to make is that the look of any paper/thesis/dissertation -- double-spaced with such &amp; such margins, had less to do with typography than with the mechanics of preparing a manuscript for eventual composition. As pencil editing is no longer the preferred method of editing,  what "manuscripts" should look like (and their for-practice precursors -- papers, theses, dissertations) , is a bit up in the air.</p>
