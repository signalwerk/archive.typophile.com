    html: <p>For a student that has never used a  markup or computer language and that might have a hard time finding a missing closing brace or bracket in his input file, I think LaTeX could be quite traumatizing; <a href="http://en.wikipedia.org/wiki/Lyx" rel="nofollow">LyX</a> might be the solution. I have seen a full M.Sc. thesis in computer science written with LyX, which shows it can serve as a workhorse. On the other hand LyX follows the <a href="http://en.wikipedia.org/wiki/WYSIWYM" rel="nofollow">What  You See Is What You Mean</a> paradigm, so that (so far as I understand for basic use) the student would not have to deal himself with markup elements, he would simply deal with the content and the professor in charge can adjust the LaTeX packages if needed. I must however say that I have never used LyX, not even on the .lyx files provided by the student; I just compiled the  corresponding .tex files with pdflatex.</p>
