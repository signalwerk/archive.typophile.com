    html: |-
      <p>Reading the Wikipedia article suggests that the single-story lowercase G is not merely a feature of modern sans-serif typefaces, modelled on children's handprinting, but was also found in blackletter.</p>
      <p>And, indeed, that is the case.</p>
      <p>Thus, one might better ask: where did the <em>double-storey</em> lowercase G come from? The Wikipedia article also gives an answer to that: in Roman type, it allowed descenders to be shortened.</p>
      <p>Which doesn't <em>quite</em> explain why it was found in the typefaces of Nicholas Jenson, instead of waiting until American Type Founders came along...</p>
