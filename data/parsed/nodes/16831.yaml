    html: |-
      <p>My newest project, which we are still developing,  is a <a href="http://bowfinprintworks.com/SerifGuide/serifsearch.php" target="new">Serif Font ID Guide</a>. It happens that the ’b’ is one of the 12 key letters. If you select that characteristic on the Search page (link), you will get a list of 257 fonts that have this type of ’b’. There will be samples for some of them, but we are still populating the Guide with illustrations.</p>
      <p>- Mike Yanega</p>
