    <p>I need help identifying the font in the head (reading "Yarmouth Clam Festival") and subhead (reading "Competitions &amp; Events") of this page <a href="http://clamfestival.com/competition.php" title="http://clamfestival.com/competition.php">http://clamfestival.com/competition.php</a></p>
    <p>Pages throughout the site have varying subheads that provide additional clues.</p>
    <p>I've had trouble finding a font with the same "s," which is condensed, narrow, and has a very shallow curve.</p>
    <p>Thank you for any leads!</p>
    <p>Lisa</p>
