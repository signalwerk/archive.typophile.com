    html: |-
      <p>With a publication date of 1985 that would be the dark ages of computer type and it may have been hand drawn (the stat machine was still going strong!) But you may want to have a look at <a class="freelinking-external" href="http://www.emigre.com/">Emigre’s</a> Citizen, Triplex and Lunatix all from the late 1980s for a similar flavor.</p>
      <p>Of course it may also be a font - in which case someone else may have just the perfect reply.</p>
