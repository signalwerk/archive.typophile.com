    <p></p><div class="imageWrap"><img src="/files/0097_4306.jpg"></div><p></p>
    <p>Hello all,</p>
    <p>Was wondering if anyone might be able to identify the typeface used in this image. The one that spells ’les immatériaux’, not the Pompidou bit. Not sure if this was done by hand or not, but if anyone can spot it, that would be amazing.</p>
    <p>Thank you!</p>
