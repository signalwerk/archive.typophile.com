      <p>Interesting treatment!</p>
      <p>The ball on the "a" throws me off too. I think one reason for that is that most glyphs have the more «broken»/irregular part towards the x-line and the «cleaner»/«classical» part towards the bottom; the "k" and "a" diverge from this pattern. In the "k" this is not so noticeable though, since the arm is so light; but the "a" sort of ends up looking like it's the wrong way round.</p>
      <p>The "s" feels most like a Dead History style mash-up to me. The top seems too heavy and possibly too monoline? Not sure.</p>
      <p>And I second the question about what's up with the "p"s. If you want to not make them all the same, I'd rather try exploring the double-"p" combination further, maybe.</p>
