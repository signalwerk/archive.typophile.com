      <p>The things that stick out the most for me are the terminal on the \a\, I think the smooth ball-terminal isn't really <em>right</em> for this. Maybe make it more like the terminal of the \r\.<br>
      If you have found a good way to end your \a\ also use it for your \s\, because the top now seems to be very heavy.<br>
      You could try a diagonal stroke for the \e\ instead of the horizontal one you have now, that will open up your counter and maybe help with the color-evenness you mentioned.<br>
      Do you have a specific reason for the bottom serifs of the \p\s not being the same?</p>
