    html: |-
      <p>&gt; pretty aggressive paint handling.</p>
      <p>This could be the angle that could make this click. Otherwise I'd be worried that it's more like a logo for an architecture firm for example.</p>
      <p>For the top of the "a", I might try a thin finial like in the "e". If that creates too much lightness in combination with the top-right of the "k", you could try your thin slab serif form, probably both upward and downward (see the "s" comment below). The foot serif upcurl to me is suspect as well, although I'm not sure how to improve it.</p>
      <p>If the very top of the "s" is made thin that might just be enough. In any case I think the serif(s) in the "s" need to be abrupt, not tapered.</p>
      <p>The variance in the "p" to me is exactly what's needed; it <em>is</em> for a painter. In fact I might use that more. Not that every serif etc. should vary, but I would try tilting the top serif of the "k" for one thing. The baseline and x-line serifs are probably best left totally flat.</p>
      <p>BTW, the two parts should be closer I think.</p>
      <p>&gt; Does anyone think that ’h’ is too narrow?</p>
      <p>Yup.</p>
      <p>hhp</p>
