    html: |-
      <p><cite>most glyphs have the more «broken»/irregular part towards the x-line and the «cleaner»/«classical» part towards the bottom</cite></p>
      <p>Good point. That wasn't exactly intentional, but that certainly is how it turned out. That does give me a pretty good basis for revisiting the 'a'. Thanks for that observation.</p>
      <p><cite>You could try a diagonal stroke for the \e\</cite></p>
      <p>An earlier treatment used a diagonal crossbar at a pretty severe angle, and I couldn't stand it. But I think I'll try a shallower angle. Or maybe a lower, yet still horizontal, crossbar. As you say opening the counter, as well as redrawing the 'a', may well fix the wonky color.</p>
      <p><cite>What kind of painting?<br>
      Who’s the customer?</cite></p>
      <p>The customer is a fairly traditional oil painter. She paints from nature, frequently outside -- representational work with pretty aggressive paint handling. Painters that come to mind, that she owes a debt to, are the late-19th c. crowd: Courbet, Manet, Cezanne <em>et al</em>. For different reasons: paint-handling, color, composition. </p>
      <p><cite>Do you have a specific reason for the bottom serifs of the \p\s not being the same?</cite><br>
      <cite>And I second the question about what’s up with the “p”s.</cite> </p>
      <p>The 'p's. The 'p's are treated differently (not just the bottoms but the tops as well), because that's how the client approaches her work. You can stand in the same spot on the same day making the same painting, and always be looking at something different(ly). Cezanne said (I don't have a citation on-hand) that moving his head a fraction of an inch, one way or the other, would give him an entirely new painting. Copying and pasting the same 'picture' of a 'p' three times isn't a fair representation of her or her work IMHO. That said, the treatment I have now may be a bit too forced, mannered, what have you.</p>
      <p>Does anyone think that 'h' is too narrow?</p>
