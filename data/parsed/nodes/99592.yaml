      <p>This is the umpteenth time this topic has come up. I don't know just how to search for all the posts, but it could be worthwhile, as some of those threads were quite long &amp; brought up many points worth pondering.</p>
      <p>For just one example: In my line of work, scholarly books, the decision would usually be considered "editorial" rather than "design," though that can vary from press to press. </p>
      <p>Nick's suggestion -- rewriting -- would again be an editorial decision. In my experience, the editors would not consider it.</p>
      <p>Then you get into opinions. For acronyms and abbreviations, I think small caps should be a bit bigger than x-height. The goal is to not have them stick out as full caps do, but also not to cause confusion. You can have acronyms that are also words; best to subtly signal them as acronyms.</p>
      <p>Personally, I find no need for complete consistency. For example, in a subhead where each word begins with a full cap, any acronym should be set in full caps. The rhythm of the line is broken up less that way. In running text though, use the small cap setting. Others will disagree, and if they're editors, they'll win.</p>
      <p>But extending that thought, setting an acronym that begins a sentence -- or as you show, a paragraph -- in full caps might be considered preferable. Not to me, but the argument can be made.</p>
      <p>Another point is whats the rest of the text look like? If there are a lot of names with initials, the lines are already visually broken: </p>
      <p><cite>G. E. M. Anscombe and W. V. O. Quine are members of (acronym)</cite></p>
      <p>or, </p>
      <p><cite>J. E. D. Smith, M.D.</cite></p>
      <p>where some would insist "M.D." should be set in small caps. I'd say "why?"</p>
      <p>Etc.</p>
