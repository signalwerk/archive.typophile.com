      <p>Well stated - I essentially agree with all of that.</p>
      <p>Just to be clear about my view of ideal cap-string size specifically: when it's too small (x-height, or only slightly higher) the letters that are structurally similar across the two cases can cause confusion - think of the string "US"; when it's too big (full caps) then it jumps out at you from previous lines you're reading, destroying immersive reading. Avoiding this latter case is parallel to the benefit of making the lining numerals "3/4" height instead of full cap height (at least for a font with a modest x-height). Also, at the beginning of a sentence a diminutive smallcap is particularly confusing. At the beginning of a <em>paragraph</em> it might seem relatively harmless, but it probably looks Wrong to most readers.</p>
      <p>hhp</p>
