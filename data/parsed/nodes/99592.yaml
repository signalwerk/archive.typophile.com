      <p>Is it? I think I disagree. There are cases in which you can’t clearly determine which option yields optimum readability. And using full caps or small caps for acronyms seems to be one of those cases. At least I don’t have any clear evidence that speaks against either. And I personally find full caps quite jarring for acronyms (and slightly downsized full caps even more). Others might feel differently. It seems unlikely to me, however, that anyone would like to read a novel typeset in FF Pitu.</p>
