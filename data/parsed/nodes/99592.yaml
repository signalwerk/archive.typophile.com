      <blockquote><p>There are cases in which you can’t clearly determine which option yields optimum readability.</p></blockquote>
      <p>You're actually describing <em>all</em> cases! We just don't Know. All you can do is think, and make a decision, but placing the reader above yourself. My contention being that that's far better than blindly following one's own taste or some pedantic formalisms. A designer's taste and discretion will still kick in, but without being forced, without being the <em>goal</em>.</p>
      <p>For example, you might personally like how x-height smallcaps line up nicely with the x-height, but if you believe (I hope you do) that immersive reading isn't about things lining up* then you demote your own conscious desire for things to line up.</p>
      <p>* Consider the "ideal" binocular lc "g" for example.</p>
      <blockquote><p>It seems unlikely to me, however, that anyone would like to read a novel typeset in FF Pitu.</p></blockquote>
      <p>Most laymen will love reading it for 10 minutes. And when they stop loving it, few of them will realize why - they will blame something they can relate to (as opposed to readability).</p>
      <p>When I made Maral for AIM Magazine (a hundred years ago) everybody loved it! I was so proud. But then the people actually reading every article, the minority who knew what reading Armenian is supposed to feel like started complaining that the magazine was hard to read. We figured it must be the font, and they commissioned me to make an ungainly -but readable- revival as a replacement. But it took <em>me</em> about 8 years to come to grips with exactly what was going wrong (the x-height was too big).</p>
      <p>hhp</p>
