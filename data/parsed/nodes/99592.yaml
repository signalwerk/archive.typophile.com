      <p>I think I wouldn’t go as far as saying that it is unclear in <cite>all</cite> cases. Is there any chance that FF Pitu is better for a novel than, say, some Caslon? I don’t know if Pitu is better than <a href="http://www.myfonts.com/fonts/hubertjocham/narziss-pro-cyrillic/" rel="nofollow">Narziss,</a> however.</p>
      <p>What you suggest sounds good, i. e. one should try to take decisions that in all likelihood are best or at least not bad for readers (regardless of whether or not these readers—is this even a homogeneous group?—would have taken the same decisions). But as you said: In many (or even all) cases, we don’t know what reads most comfortably and what the impact of deviating from ideal conditions is. We start reasoning from general ideas (like ‘It’s not best for immersive reading if everything is lined up and smoothed out’, some would disagree) that do not say that much about full caps or small caps for acronyms. And even two people who agree on the general idea might differ when it comes to practical execution: If you want an acronym to stand out more than a regular noun, full caps are probably best; if you want it to blend in like any other word, small caps might be the right choice. Or are small caps <cite>too</cite> unobtrusive, even in this case? It’s difficult to tell. That does not discharge us from trying to serve the reader, but one should not forget that most typographic preferences, whatever reasoning they are based on, are not carved in stone.</p>
