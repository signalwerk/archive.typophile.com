    html: |-
      <p>Here are 2 versions. First is the last one marketing and sales saw. They like it, except the fact that 'famous' is the most visible on the title. Unfortunately I came on after the title design meeting. I was told that the title and the subtitle should be nearly the same in importance. This is tricky because the title doesn't tell you what the book is about, thus the sub needs to be more visible. This is like the 12th version of this. AND my immediate boss just told me that the one on the right (which I like only a little less than the one on the left,) is too extreme of a switch.</p>
      <p>The image is cropped photo of a spotlight on curtains, playing on the 'stage-left' aspect of not being famous, similar as to showing a red carpet with no one on it.</p>
      <p>also: they won't let me use any kind of cliché writing instruments. Pencils, pens, typewriters &amp;c.</p>
      <p>Then there is this...<br>
      <a href="http://static.flickr.com/122/303283067_469933c73c_o.png" title="http://static.flickr.com/122/303283067_469933c73c_o.png">http://static.flickr.com/122/303283067_469933c73c_o.png</a><br>
      Out of frustration.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/fms_5146.png"></div><p></p>
