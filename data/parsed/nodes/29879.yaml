    html: |-
      <p>Not liking the Waters -- unbelievable font though. The tight, stacked caps give me spiritual conotations (alt E adds to it).</p>
      <p>Also, waters titling makes me feel like I do have to be famous since it's so expressive. Isn't the point that even anonymous people have a story to tell? Maybe you could hint at this with the type. A nameless, faceless, condensed, grotesque to which you add unexpected flair perhaps? (sounds like I got that from the Typophile Small Chat Generator :-)</p>
      <p>I'm wondering if the text setting can also reflect your stage left concept. Maybe it is coming out of the shadows. Or maybe it is left justified and wraps around the spine (off page left).</p>
      <p>To sum it up either:<br>
      Fancy type hidden in the shadows<br>
      or<br>
      Plain type in the spotlight with unexpected flair.<br>
      or<br>
      Famous in the spotlight and the rest in shadow (would need to get away from stage left concept.</p>
      <p>Obviously 6 ideas on one cover will not work ;-)<br>
      I could be thinking too hard.<br>
      R</p>
