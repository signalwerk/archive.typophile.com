      <p>Benton is your best bet. Not sure what you mean by "ridiculously expensive". It's not too much more than Whitney when you buy more than one weight at a time. Font Bureau gives discounts as you add weights and <a href="http://www.fontshop.com/search/?q=Benton+Sans" rel="nofollow">FontShop offers packages</a>. </p>
      <p>Other good suggestions from Mikey (SUF). Also <a href="http://www.fontshop.com/fonts/downloads/primetype/ptl_skopex_gothic_complete_ot/" rel="nofollow">Skopex</a>, <a href="http://www.fontshop.com/fonts/downloads/lucasfonts/spiegel/" rel="nofollow">Spiegel</a>.</p>
