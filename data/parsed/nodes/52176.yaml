  html: |-
    <p>Wondering if anyone has any suggestions for typefaces similar to Whitney? I've 'accidentally' used it and already use it in another publication. Client has ok'd so am looking for something similar. Thought Freight Sans would work, but the 'e' is not the greatest. Benton Sans is also close, but ridiculously expensive. Neither offer a semibold. Am using it in front of book, back of book and 2 areas for display (this is where the e is noticably yucky). Anyone?</p>
    <p>A</p>
