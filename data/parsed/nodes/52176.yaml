      <p><cite> &gt;Neither offer a semibold. </cite></p>
      <p>FWIW, the weight naming scheme is different, but Benton Sans covers pretty much the same range as Whitney:</p>
      <p><img src="/sites/default/files/old-images/WhitneyBentonSans_comp2_3659.gif"></p>
      <p>Tobias Frere-Jones was working on Benton Gothic (precursor to Benton Sans) about the same time as Whitney, so there's a bit of Benton DNA in Whitney.</p>
