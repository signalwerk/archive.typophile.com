      <p>To my way of thinking, the design in Dezcom's post, a Cyrillic R with the horizontal lines through the stem, is the simplest and most natural choice.</p>
      <p>But since so many countries use $, and, in fact, more than one country uses £, I don't see a problem in saving trouble and using the existing symbol for the Philippine peso, unless, like the Euro symbol, it is trademarked. (Given the value of the Euro, I would have expected the EU to just use $ for that!)</p>
