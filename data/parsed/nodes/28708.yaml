      <p><cite>When you say the to click on “Tabular Figures” on the glyphs palette, are you referring to a drop-down set with that title?</cite></p>
      <p>In Illustrator or InDesign CS2, open the Glyphs palette. Next to the word show is a drop down menu. It is defaulted to say “Entire Font”. Select the menu and scroll down to Tabular figures. The multiplication sign is the second glyph in the palette.</p>
