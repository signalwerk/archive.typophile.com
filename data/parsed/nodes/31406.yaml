    html: |-
      <p>Let's say that you decide to only have <strong>a.sc</strong>. This means that your 'c2sc' feature will look like this:</p>
      <p><code>feature c2sc {<br>
      sub A by a.sc;<br>
      } c2sc;</code></p>
      <p>In environments where character codes (Unicode codepoints) need to be reconstructed from glyph names — like when copying text from a PDF, for example — the text string 'AAA' styled with your 'c2sc' feature, will end up being converted to 'aaa', because that's the result of parsing '/a.sc/a.sc/a.sc'.</p>
