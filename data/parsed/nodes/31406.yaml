      <p>A postscriptum to Miguel's posting:</p>
      <p>According to the more strict Adobe policy (which separates glyphs inserted through OpenType Layout from glyphs inserted through their Unicode codepoints), your font should have two sets of identical (duplicate) superscript and subscript figures, named and encoded as shown below. This encoding and naming ensures that the original text string will always be accurately reconstructed.  </p>
      <p>(U+2070) "uni2070" and duplicated as (unencoded) "zero.sups"<br>
      (U+00B9) "onesuperior" and duplicated as (unencoded) "one.sups"<br>
      (U+00B2) "twosuperior" and duplicated as (unencoded) "two.sups"<br>
      (U+00B3) "threesuperior" and duplicated as (unencoded) "three.sups"<br>
      (U+2074) "uni2074" and duplicated as (unencoded) "four.sups"<br>
      (U+2075) "uni2075" and duplicated as (unencoded) "five.sups"<br>
      (U+2076) "uni2076" and duplicated as (unencoded) "six.sups"<br>
      (U+2077) "uni2077" and duplicated as (unencoded) "seven.sups"<br>
      (U+2078) "uni2078" and duplicated as (unencoded) "eight.sups"<br>
      (U+2079) "uni2079" and duplicated as (unencoded) "nine.sups"<br>
      (U+2080) "uni2080" and duplicated as (unencoded) "zero.sinf"<br>
      (U+2081) "uni2081" and duplicated as (unencoded) "one.sinf"<br>
      (U+2082) "uni2082" and duplicated as (unencoded) "two.sinf"<br>
      (U+2083) "uni2083" and duplicated as (unencoded) "three.sinf"<br>
      (U+2084) "uni2084" and duplicated as (unencoded) "four.sinf"<br>
      (U+2085) "uni2085" and duplicated as (unencoded) "five.sinf"<br>
      (U+2086) "uni2086" and duplicated as (unencoded) "six.sinf"<br>
      (U+2087) "uni2087" and duplicated as (unencoded) "seven.sinf"<br>
      (U+2088) "uni2088" and duplicated as (unencoded) "eight.sinf"<br>
      (U+2089) "uni2089" and duplicated as (unencoded) "nine.sinf"</p>
      <p>(The ".sups" and ".sinf" suffixes can be anything else, e.g. ".superior" and ".inferior" etc.)</p>
      <p>A more economic way would be just one set of glyphs (just like you'd only use one set of small cap glyphs, "A.smcp"). This naming and encoding does not guarantee 100% reconstruction of the original string (because e.g. U+2070 will be reconstructed as U+0030). </p>
