      <p>Robby, </p>
      <p>please don't use the glyph names from the "Adobe OT PS Standard Names (CFF)" encoding. Weird as it may seem, they're not compatible with Adobe's current recommendations for glyph naming. This encoding lists names that are internally represented by numbers rather than names in a CFF table. </p>
      <p>Adam</p>
