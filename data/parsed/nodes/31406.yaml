      <p>&gt; <em>For localized glyph variants, Fontlab Ltd. suggests using the OpenType language tag, i.e. the Serbian “b” glyph would be named “afii10066.SRB”.</em></p>
      <p>Just a small note to say, although 'afii10066' is a perfectly legal glyph name, Adobe is moving away from afiiXXXXX glyph names, in favour of uniXXXX (or uXXXX*) names. So in the case above 'afii10066.SRB' can be replaced by 'uni0431.SRB' or 'u0431.SRB'.</p>
      <p>*Currently, Mac OS X (10.4.8) relies on glyph names and doesn't support this form.</p>
