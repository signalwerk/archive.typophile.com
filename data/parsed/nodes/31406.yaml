      <p>&gt; onum = oldstyle + proportional<br>
      &gt; tnum = oldstyle + tabular<br>
      &gt; lnum = lining + tabular<br>
      &gt; pnum = lining + proportional</p>
      <p>No no no no :) </p>
      <p>There are two typographic properties of figures:<br>
      a) case, i.e. vertical size and alignment, which can be uppercase (lining) or lowercase (oldstyle/floating)<br>
      b) width, which can be monospaced (tabular) or proportional.<br>
      These properties are controlled *independently* of each other by OpenType Layout features. </p>
      <p>The "onum" feature switches UC figures (*lnum) to lc figures (*onum). The "lnum" does the reverse. </p>
      <p>The "pnum" feature switches monospaced figures (*tnum) to proportional figures (*pnum). The "tnum" feature does the reverse. </p>
      <p>If your font has four sets of figures (uppercase monospaced, uppercase proportional, lowercase monospaced and lowercase proportional): </p>
      <p>* the "onum" feature switches from uppercase monospaced to lowercase monospaced and from uppercase proportional to lowercase proportional;<br>
      * the "lnum" feature switches from lowercase monospaced to uppercase monospaced and from lowercase proportional to uppercase proportional;<br>
      * the "pnum" feature switches from uppercase monospaced to uppercase proportional and from lowercase monospaced to lowercase proportional;<br>
      * the "tnum" feature switches from uppercase proportional to uppercase monospaced and from lowercase proportional to lowercase monospaced; </p>
      <p>So, conceptually, you have four sets of figures:<br>
      * "onum_tnum": lowercase monospaced,<br>
      * "onum_pnum": lowercase proportional,<br>
      * "lnum_tnum": uppercase monospaced,<br>
      * "lnum_pnum": uppercase proportional. </p>
      <p>*One* of these figure sets would be your *default* figure set, for which you wouldn't use a glyphname suffix and you would assign the Unicode codepoints to them. These could be the uppercase monospaced figures, but could be also a different figure set. For the three remaining sets, you'd use glyphname suffixes. </p>
      <p>If you have four figure sets, each of the four features (onum, pnum, lnum, tnum) should *always* substitute two sets by two other sets. </p>
      <p>More on this <a href="http://typophile.com/node/29580?from=64" rel="nofollow"><strong>here</strong></a> und <a href="http://typophile.com/node/29648?from=34" rel="nofollow"><strong>here</strong></a>. </p>
      <p>A.</p>
