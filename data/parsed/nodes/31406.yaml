      <p><cite>This "_tnum" [in “one.onum_tnum”] seems to be an oxymoron, as the four basic figure groups are presently understood to be:</cite></p>
      <p><cite>onum = oldstyle + proportional<br>
      tnum = oldstyle + tabular<br>
      lnum = lining + tabular<br>
      pnum = lining + proportional</cite></p>
      <p>Following the OT numeral feature logic, to address tabular oldstyle figures, both tnum and onum features need to be applied by the application. So mentioning both these features in the glyph name makes this obvious. The table should be:</p>
      <p>width:<br>
      pnum = proportional<br>
      tnum = tabular<br>
      (Each of these features however covers both lnum and onum.)</p>
      <p>alignment:<br>
      lnum = lining<br>
      onum = oldstyle<br>
      (Each covers both pnum and tnum.)</p>
