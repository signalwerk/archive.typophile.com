    html: |-
      <p>The colonmonetary is the "colon" currency symbol, which looks like a C with two diagonal bars through it. Because it's a currency symbol, it's commonly designed on tabular widths (that is, the same as your tabular figures).</p>
      <p>The onefitted is the proportional version of the numeral one.</p>
      <p>But as Nick says, you can learn a lot just by looking at the glyphs in an existing font.</p>
      <p>Cheers,</p>
      <p>T</p>
