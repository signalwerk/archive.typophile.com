    html: |-
      <p>William, you can find Adobe's recommendations for glyph names on these two pages:</p>
      <p>— <a href="http://partners.adobe.com/public/developer/opentype/index_glyph.html" rel="nofollow">Unicode and Glyph Names</a><br>
      — <a href="http://partners.adobe.com/public/developer/opentype/index_glyph2.html" rel="nofollow">Glyph Names and Current Implementations</a></p>
      <p>The short answer is, read <a href="http://partners.adobe.com/public/developer/opentype/index_glyph.html#6" rel="nofollow">section 6</a> of Unicode and Glyph Names page.</p>
      <p>For small caps*, for example, <strong>a.small</strong>, <strong>aacute.sc</strong>, or <strong>agrave.smcp</strong> are all sound names.</p>
      <p>* If you care about unique glyph-character correspondence, you'll need to have two sets of small cap glyphs: one that matches the lowercase set, and another that matches the uppercase set. This means you'll end up with two small cap 'A's, one named <strong>a.sc</strong>, and another named <strong>A.sc</strong>. The first should be used in the 'smcp' feature, and the second in the 'c2sc' feature, as the code below illustrates:</p>
      <p><code>feature smcp {<br>
      sub a by a.sc;<br>
      } smcp;</code></p>
      <p>feature c2sc {<br>
      sub A by A.sc;<br>
      } c2sc;</p>
