    <p>I am building an OpenType font and right now I am using the "Adobe OT PS Standard Names (CFF)" ecoding table...</p>
    <p>Most of the glyphs make sense to me... but I am not sure what a "colonmonetary" or "onefitted" glyp should look like.</p>
    <p>Also, is the glyph for "Rupiah" a cap R and lower case p? Or is there something more sophisticated?</p>
