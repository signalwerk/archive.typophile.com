      <p><em>2. Have one set of small caps glyphs named as if they were variants of UPPERCASE glyphs</em></p>
      <p>Surely this is the only option that should be offered, because it maintains <em> typographic</em> correspondence, i.e. the emphasis of the original document -- in the same way that bold and italic are retained in "reconstruction".</p>
      <p><em>“one.onum_tnum” </em></p>
      <p>This "_tnum" seems to be an oxymoron, as the four basic figure groups are presently understood to be:</p>
      <p>onum = oldstyle + proportional<br>
      tnum = oldstyle + tabular<br>
      lnum = lining + tabular<br>
      pnum = lining + proportional</p>
