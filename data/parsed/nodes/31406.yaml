      <p>I'm not bitter Adam, just frustrated working on the never-ending font, as I discover something new each month that should be included or changed. </p>
      <p>But perhaps I'm naiive, in wanting to produce fonts that function perfectly, as that no longer appears to be possible, and they're turning into just another piece of buggy software that needs constant upgrades to keep all the features working properly and in sync with applications. </p>
      <p>I treat your recommendations very seriously, and as I've said before, you are in the perfect position, with FontLab, to take the lead and establish some standardized OpenType font formats that independent foundries can use. Nobody wants to be the little shop whose customers have to figure out its quirks. And the customers -- the typographers -- would like to see some consistency, so that they don't have to read a pdf manual for each font just to figure out how the features of Foundry A differ from Foundry B.</p>
      <p>I'd love to be able to scroll down to a "FontLab Latin Text" codepage and have all the characters (including smcp, sinf, sups, etc.) pop up in grey, with proper unicoding and feature sets pre-built. The I click on "one.superior", and FontLab renders a scaled, positioned version of the "one.lnum_pnum" glyph in the character position. Pre-built family-naming would be handy too.</p>
