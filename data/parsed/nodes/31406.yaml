      <p><em>According to the more strict Adobe policy (which separates glyphs inserted through OpenType Layout from glyphs inserted through their Unicode codepoints), your font should have two sets of identical superscript and duplicated as subscript figures</em></p>
      <p>There's something wrong here.<br>
      There's no need for all this redundancy in the font -- why can't the layout application use Unicode codepoints for determining OpenType layout features?</p>
      <p><em>No no no no :)</em></p>
      <p>Adam, Karsten, I understand the principle of "two variables produces four instances", and have made dozens of OT fonts with four sets of figures that work just fine.</p>
      <p>I came to the conclusion that<br>
      "onum = oldstyle + proportional"<br>
      by looking at the way characters were named in Adobe fonts, i.e. "oneoldstyle", and <em>figured</em> the rest out from there.</p>
      <p>Looks like Adobe made a mistake by coming up with run-on names such as "asmall", "oneinferior", and "oneoldstyle" -- so don't roll your eyes at me, and how about admitting it?</p>
      <p>***</p>
      <p>Adam, please stop refering to "monospaced", "lowercase" and "uppercase" figures.<br>
      The correct terms are "tabular", "oldstyle" and "lining", cast in concrete as OpenType features!<br>
      <a href="http://www.microsoft.com/typography/otspec/features_ae.htm" title="http://www.microsoft.com/typography/otspec/features_ae.htm">http://www.microsoft.com/typography/otspec/features_ae.htm</a></p>
      <p>What is the point of having standards if you don't stick with them?</p>
      <p>You guys are making this up as you go along, changing your minds all the time.</p>
      <p>Now I have to encode a simple "alternate set" as:</p>
      <p>- Salt<br>
      - Titling<br>
      - SS01</p>
      <p>...just to get it to work in past, present, and future versions of CS software!</p>
      <p>Sure, it's software, and the bugs can always be fixed, but this thing is getting out of hand -- the kind of glyph proliferation that has been happening to the *ideal* opentype font in recent months is ridiculous. It's coming at me from every direction -- language support, legacy application support, "reconstruction" support. </p>
      <p>What type designers -- and the font industry -- need is some good standard templates, not to have to figure things out for themselves on constantly shifting terrain.</p>
