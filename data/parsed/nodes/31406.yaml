    html: |-
      <p>William, </p>
      <p>as Miguel said, for casing features, you have three choices: </p>
      <p>1. Duplicate your small caps glyphs so that there is one set that corresponds to lowercase glyphs, with names such as "a.smcp", "agrave.smcp" (or "a.small", "agrave.small" or "a.sc", "agrave.sc" but *not* "asmall" or "agravesmall") and one set that corresponds to UPPERCASE glyphs, with names such as "A.c2sc", "Agrave.c2sc" (or "A.smcp", "Agrave.smcp" or "A.small", "Agrave.small" or "A.sc", "Agrave.sc" but *not* "Asmall" or "Agravesmall"). In such case, the "smcp" feature would replace "a" with "a.smcp" and the "c2sc" feature would replace "A" with "A.c2sc". </p>
      <p>2. Have one set of small caps glyphs named as if they were variants of UPPERCASE glyphs, i.e. "A.smcp", "Agrave.smcp" (or "A.small", "Agrave.small" or "A.sc", "Agrave.sc" but *not* "Asmall" or "Agravesmall"). In such case, the "smcp" would replace lowercase with those glyphs, and the "c2sc" feature would replace uppercase with those glyphs. </p>
      <p>3. Have one set of small caps glyphs named as if they were variants of lowercase glyphs, i.e. "a.smcp", "agrave.smcp" (or "a.small", "agrave.small" or "a.sc", "agrave.sc" but *not* "asmall" or "agravesmall"). In such case, the "smcp" would replace lowercase with those glyphs, and the "c2sc" feature would replace uppercase with those glyphs. </p>
      <p>Adobe follows variant 1, which allows them 100% glyph correspondence. With class kerning and composites, handling these duplicate glyphs is pretty easy in the production process. Also, it's easier to write OpenType Layout features because your font would have suplicate "S.c2sc" and "s.smcp" (as there is both "S" and "s" in your font), but you'd only need "germandbls.smcp" as there is only "germandbls" without an uppercase variant). </p>
      <p>With this variant, if my source text reads "The typeface Constantia was designed by John Hudson" and I style "Constantia" and "John Hudson" with "all small caps" (i.e. both "c2sc" and "smcp" are applied), the document goes to PDF and is then retrieved by Acrobat or Google, the text will still read "The typeface Constantia was designed by John Hudson", so there is no semantic loss. </p>
      <p>Variant 2 is also acceptable. If my source text reads "The typeface Constantia was designed by John Hudson" and I style "Constantia" and "John Hudson" with "all small caps", the retrieved text will read "The typeface CONSTANTIA was designed by JOHN HUDSON". There is some semantic loss but all-uppercase text is always orthographically correct. (After all, small caps are just smaller-sized lowercase letters)</p>
      <p>Variant 3 is the least preferrable. If my source text reads "The typeface Constantia was designed by John Hudson" and I style "Constantia" and "John Hudson" with "all small caps", the retrieved text will read "The typeface constantia was designed by john hudson". This semantic loss is unacceptable becauase all-lowercase text is not orthographically correct in this case. </p>
      <p>As or the glyphname suffixes, you can use whatever you want: "a.smcp", "a.small", "a.sc", "a.SMALLC" etc. are all acceptable for the small caps "a" glyph. "one.onum", "one.osf", "one.oldstyle", "one.lc", "one.o" are all acceptable for the old-style/lowercase figure 1. </p>
      <p>Fontlab Ltd. recommends to use glyphname suffixes that are tied to OpenType Layout feature tags that the glyphs are used in (or primarily used in). So if you follow variant 1 of devising small caps (duplicate sets), You can name the glyphs "A.c2sc" and "a.smcp". Then it's instantly obvious that the OpenType Layout feature definition will be</p>
      <p><code>feature c2sc {<br>
        sub A by A.c2sc;<br>
      } c2sc; </code></p>
      <p>feature smcp {<br>
        sub a by a.smcp;<br>
      } smcp; </p>
      <p>If your font has just two sets of figures (lining with Unicode codepoints, and oldstyle as variants), You can name the oldstyle figures "one.onum" so the feature definition would be: </p>
      <p><code>feature onum {<br>
        sub one by one.onum;<br>
      } onum; </code></p>
      <p>If a glyph is only accessed through a combination of features, e.g. if you have four sets of figures (tabular lining, tabular oldstyle, proportional lining, proportional oldstyle), you can use the names "one" (for the tabular lining), "one.onum_tnum" (for the tabular oldstyle), "one.lnum_pnum" (for the proportional lining) and "one.onum_pnum" (for the proportional oldstyle). In the suffix, you can concatenate the OpenType Layout tags using underscore, and the sequence of these layout tags are alphabetical. Similarly, if you have a stylistic variant of a small caps "R", you can call it "R.c2sc_ss01". </p>
      <p>If the same glyph is used in several features independantly (e.g. a stylistic variant of "R" could be used in "ss01" and "salt"), you can pick the suffix that is most specifically tied to the glyph. "ss01" seems to be more specific that "salt" so you can call the glyph "R.ss01". </p>
      <p>When it comes to ligatures, Fontlab Ltd. currently recommends using suffixes in these as well. The standard "fi" ligature can be named "f_i.liga" while a discretionary "st" ligature can be named "s_t.dlig". This keeps your glyphnames in order and allows you to quickly allocate the ones you need. </p>
      <p>For localized glyph variants, Fontlab Ltd. suggests using the OpenType language tag, i.e. the Serbian "b" glyph would be named "afii10066.SRB". </p>
      <p>Regards,<br>
      Adam Twardoch<br>
      Fontlab Ltd.</p>
