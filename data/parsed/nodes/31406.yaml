      <p>Nick, </p>
      <p>did you test your fonts in various applications that support advanced typographic OpenType Layout features, or just in Adobe applications? One shouldn't presume that one particular implementation is enough to test against. (For example, do you test your features in TextEdit on Mac OS X 10.4? Or in Mellel?) BTW, I'm not implying that there is something wrong with *your* fonts. I haven't seen your OT code, and perhaps everything is all-right with it. </p>
      <p>"You guys are making this up as you go along, changing your minds all the time." — I read some bitterness in what you're saying, but I believe you're being a bit naiive. I think you expect that some superminds behind the scenes had figured everything out back in 1999 (when OpenType was introduced), envisioned all kinds of typographic uses and cases for the layout features, all kinds of problems that a developer may run into. But of course, this was never the case. In the past years, OpenType has always been a work in progress. This is normal: when the specification was written, there were practically no applications that used it (except the Microsoft complex-script engines for Arabic, Indic scripts etc.), and there were only a handful fonts. When you look at the features as they were defined in Adobe Garamond Pro (one of the first OpenType fonts made by Adobe) and in Palatino Linotype (one of the first OpenType fonts with advanced typographic features made by Microsoft), there are a *lot* of bad practices. </p>
      <p>I'm a person who's been trying to monitor whatever the "big guys" (Adobe, Microsoft, Apple) are doing, communicate with some independent developers (such as John Hudson), add my modest bit of knowledge about typesetting practice and about linguistic aspects, and distill this into designer-comprehensible talk. What I'm suggesting are "best practices as I see them", or perhaps "best practices as Fontlab Ltd. sees them". There is a certain amount of subjectivity -- you can always do this or that *differently* if you know why you're doing this. There are cases where you don't want to supply glyphnames at all in your fonts, there are cases where you want to write some features differently from what I recommend etc. I've done some thinking about this topic, but everyone is welcome, or actually even encouraged, to do his own thinking. </p>
      <p>You're free to accept my advice, and you're free to reject it. You're welcome and encourage to comment and challenge my advice and my thinking -- as I never claimed that I know it all. </p>
      <p>Best,<br>
      Adam</p>
