    html: <p>He designed one typeface that was offered at GarageFonts only for a very short time. He used fonts and lettering from a variety of designers, including Rodney Shelden Fehsenfeld, Miles Newlyn (who hangs out here) and Nancy Mazzei. If you're seeking Raygun-era fonts, go to <a href="http://www.garagefonts.com">http://www.garagefonts.com</a> and have a look around.</p>
