      <p>If I recall correctly, a number of proprietary designs and customized versions of existing typefaces that Carson used got unleashed into the underground due to a stolen computer. Patty, I'd be interested to know how you came by your set of "David Carson" fonts. A lot of people have these fonts on their hard drives but don't know/remember where they came from. Some of them are actually available on the market as retail types now, through various foundries (for instance, Gangly is at Font Bureau).</p>
      <p>*Edit to put post in proper order*</p>
