    <p>So I was selecting some nodes while holding down shift and I accidentally clicked around the baseline while still holding down shift and dragged out what appears to be a second baseline. What could this be used for? When right-clicked, you can access a properties panel that shows "Baseline position." I couldn't find anything in the Manual about it.</p>
