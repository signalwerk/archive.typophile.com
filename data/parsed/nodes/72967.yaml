    html: |-
      <p>&gt;So I was selecting some nodes while holding down shift and I accidentally clicked around the baseline...</p>
      <p>Along with accidental selection of the x origin, something I've never wanted to move in my life, this second baseline happens to me all the time. (if you don't want an extra baseline, you have to put it back at y = zero or else).</p>
      <p>To prevent accidental selection of these guides, go to the expanded view of the layers palette and 'lock' "glyph metrics". </p>
      <p>Now you have to unlock that any time you want to change the set width of the character, but the guides on the guides layer won't get in the way of your editing on the character layer. </p>
      <p>Cheers!</p>
