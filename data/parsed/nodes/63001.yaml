      <p>Well, kentlew, I'm going to try Mirarae and see how it looks on a page. I'm not currently very confident about the serifs on descenders. I have realised that nearly all typefaces look sweet in small samples and its only when you see them in blocks on a grid that they expose weaknesses. Those sites don't make it easy to trial fonts - do they have a refund option? :))</p>
      <p>Bendy, it has crossed my mind but I do not want to make an ignorant typographic blunder. I am at the stage where I understand how to read typefaces, but perhaps not ready to make them. For example, if I drop cursive a and g into Minion, anyone who recognises the base font is going to immediately identify the customisation and critique it. I might not be ready for that :)</p>
      <p>May I ask, why did you refer to Rotis as pretentious? I do not disagree, I'm just curious to understand your meaning. For example, I see that the e descends below the line and it has other curious qualities. I think it would be interesting to read the creator's rationale.</p>
