    html: |-
      <p>Well, I may have used outmoded (and misleading) vocabulary because I have recently read Gill's 1931 Essay on Typography and I am still learning. Gill recognised only three alphabets: roman, roman lowercase, italic. His meaning of italic may be equivalent to contemporary cursive.</p>
      <p>If I am permitted to give the fonts a personality: Perhaps I am aiming for cursive and vertical - as though the words are to be perceived as flexible and upholding. I reject roman typefaces because I associate them with inflexible content, such as the words of a printed book. I quite like Minion, for example, but it has that entrenched roman quality that does not suit my aim.</p>
      <p>Stone comes really close to my aim and the only thing I mark it down on is for being rather bubbly and playful - its as though the typeface does not take content seriously. This is due to its large x-height and wide ems (although I do not yet fully understand the em unit).</p>
      <p>The only thing that caused me to reject Rotis Semi Serif is its mixing of roman and cursive glyphs - its as though the typeface cannot make up its mind. My contrasting font is Rotis Semi Sans, which shares the same fault. So I am really looking for cursive vertical replacement of the Rotis family.</p>
      <p>I may need to print off samples because I have observed that fonts look different on screen. Consequently, Stone is still in the running :)</p>
    html_clean: |-
