    <p>:)</p>
    <p>I have been working with Rotis Semi Serif and the conflicting a/g is really started to bother me. The g is a relaxing italic, while the a is stuffy lowercase roman.</p>
    <p>Could you please suggest a font that has an italic alphabet, sits upright, and has serifs. To be a little more demanding, a slanted texture would be interesting as I have not seen that on an upright typeface :)</p>
    <p>Thank you so much!!</p>
