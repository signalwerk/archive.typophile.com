      <p>Tim,</p>
      <p>In my copy of the very good reference book “Encyclopedia of Typefaces by Jaspert, Berry &amp; Johnston (Blandford) I find the following info on Bruce Oldstyle as they are showing a Lanston Monotype version from 1909;</p>
      <p>“Designed by Sol Hess from the Bruce Foundry’s Bruce Old Style No 20 which was first shown in 1869. The type is based on “Scotch” and similar faces.”</p>
