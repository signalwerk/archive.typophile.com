    <p>Hey Typophiles,</p>
    <p>Does anyone know the original production date of Bruce Oldstyle?</p>
    <p>It was produced digitally by Bitstream, and before that a machine version was made by Lanston Monotype ... but I’m looking for the original release by Bruce Type Foundry in NYC. Pretty sure it was 19th century, leaning towards 1880s.</p>
    <p>Any help would be greatly appreciated.</p>
    <p>Tim</p>
