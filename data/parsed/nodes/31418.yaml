      <p>I’m working on a revival of the Bruce Old Style No. 20. It’s a assignment I’m doing in The Hague, based on a book I’ve found in a antiquarian. You can find original printings in the specimen of the Bruce Type Foundry 1869. As soon I’ve finished my essay I can send you an PDF via email.<br>
      Another source is pointing at the Old Style by Miller &amp; Richards as a base.<br>
      Please watch as well: <a href="http://cg.scs.carleton.ca/~luc/bruce/index.html" title="http://cg.scs.carleton.ca/~luc/bruce/index.html">http://cg.scs.carleton.ca/~luc/bruce/index.html</a></p>
      <p>My revival is based on the Long-Primer No. 20 and I’m not sure if I will add the italics and the small caps. The assignment was more about learning to do a revival than ending a finished type-family.</p>
      <p>Unfortunately I was not able to find the designer or caster of the typeface.<br>
      So If you can help me in that case, would be grate.</p>
