      <p>Just looking in ’American Metal Type Faces’ and the Jaspert et al. ’Encyclopedia’, here is some guesswork about Bruce Old style. </p>
      <p>Caslon—the original type it seems—was revived in the 1844 printing of ’Lady Willoughby’s Diary’, and caused a big splash as people had been only reading ’modern’ faces like Bodoni, Didot, and the Scotch romans. And some found Caslon more readable. </p>
      <p>Caslon was first revived by some copying process in 1858, by Laurence Johnson of Philadelphia. </p>
      <p>Not long afterward, in 1863, Franklin Old Style was cut by Alexander Phemister, at Miller &amp; Richards. It is one of the first of many attempts to modernize Caslon and remove what was felt to be backward, but keep its readability. It has a more vertical stress, is widened, and has much shorter ascenders and descenders. Jaspert puts the date at 1860, and just calls it ’Old Style’. </p>
      <p>This type was popular and widely copied. Though Johnson’s Caslon was originally called ’Old Style’ also, the types of this name in the 20th century on all seem to derive from Phemister’s face, including Bruce Old Style—which was one of the early derivatives of Phemister’s face. </p>
      <p>According to ’American Metal Typefaces’ Bookman Old Style is also derived from a similar—or possibly the same—face also cut by Phemister, with thicker strokes. The Bookman we know seems to have come from versions by the Bruce foundry, originally called Antique 310. ATF added the famous swash characters, which were drawn by Wadsworth A. Parker. </p>
      <p>Just looking at it, there may have been an influence of Clarendon on Phemister’s face—it looks like the offspring of a Caslon-Clarendon marriage. In any case, it is certainly a long-lived design. I think it has considerable merits, though it also has a certain dullness to it also.  </p>
      <p>As I say all this is guesswork based on those two books. If historian James Mosley is around, I suspect he could tell us a lot more.</p>
