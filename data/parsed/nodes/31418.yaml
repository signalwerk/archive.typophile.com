      <p>From my friend and colleague George Laws:</p>
      <p>“The notion of a designer as separate from the punchcutter did not exist until the late 19th century. Usually, the master punchcutter was an independent craftsman selling his own products, though occasionally accepting commissions, that would presume input from someone else. Punchcutters did not need finished drawings, just a general sense of purpose. Most likely, George Bruce worked on the punches with other engravers in his shop, and he certainly did his own casting and sold the type under the Bruce Type Foundry name.</p>
      <p>The Bruce type foundry became part of the American Type Founders  in 1901, so I assume that more information on the history can be found in the ATF archives. That collection is now part of the Smithonian Institution. The easiest place to start would be to talk to David Pankow (<a href="mailto:dppwml@rit.edu">dppwml@rit.edu</a>) at the Cary Library, Rochester Institute of Technology, Rochester, New York.</p>
      <p>David is erudite and very helpful.”</p>
