      <p>- - - - -</p>
    <p>ADVANCE NOTICE : <strong>Typeface Design course, Art Center at Night</strong></p>
    <p>This summer I will again be offering <em>Introduction to Typeface Design (E/402)</em> through Art Center College of Design’s Art Center at Night program. This 14-week course will be held at the new “Windtunnel” South Campus (950 S Raymond Ave, Pasadena) on Thursday nights from 7 to 10 pm, beginning May 18 and running through August 17.</p>
    <p><em>From the Catalog:</em> Nurture a deep appreciation for typography through the exploration of classical and experimental letterform design. This new course offers a thorough understanding of the theory behind typography and will examine the philosophies of letterform design, the motivation for creating new fonts, the difference between lettermaking disciplines (e.g. calligraphy, lettering) and type design. Using Font Lab, hand-drawn, traced, and digital letterforms will be compiled into working typefaces. Projects will first emulate existing letterforms and then move into the beginning designs for a new typeface, complete with the application of spacing/kerning, test sheets and a simple specimen. Prerequisite: Form + Letterform, or Typography 1 or by permission of an Art Center counselor.</p>
    <p>Since type design can be a highly personal thing for many people, the emphasis on individual attention will be a central part of this course. Students will be encouraged to start their own journey towards a hobby or a career in the craft of type design, exploring their talents and refining their skills. Please contact me directly to get a copy of the full syllabus.</p>
    <p>Registration begins April 10.<br>
    Enrollment is limited to 12 students.<br>
    <a href="http://www.artcenter.edu/atnight" title="www.artcenter.edu/atnight">www.artcenter.edu/atnight</a><br>
    626-396-2319</p>
    <p>Hrant Papazian<br>
    The MicroFoundry<br>
    hpapazian_at_gmail_dot_com<br>
    <a href="http://www.artcenter.edu/atnight/facultydetail.jsp?id=3225" title="http://www.artcenter.edu/atnight/facultydetail.jsp?id=3225">http://www.artcenter.edu/atnight/facultydetail.jsp?id=3225</a></p>
