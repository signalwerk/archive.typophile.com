    html: |-
      <p>This looks like this is being caused by the drop shadow you have on the type. I believe the portion of the image that corresponds to the area bounding the type path is being rasterized in order to implement the [multiplied] raster shadow, and that is leading to slight color shift.</p>
      <p>I can’t say offhand the exact fix, but it will have to do with either color settings (make sure the image is the same color space as the Indd doc and the PDF output specs), or the drop shadow settings, or possibly with flattening settings. Something like that. If the type and image are not on the same layer, then perhaps combining them on one will help solve by getting the entire layer to rasterize as one.</p>
