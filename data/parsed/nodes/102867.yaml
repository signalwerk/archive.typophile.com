    html: |-
      <p>When making the PDF, try changing the Compatibility popup button to a different setting to save the PDF in a newer version (like if it's 1.4, change it to 1.5), and see if that makes any difference.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/pdf_6455.png"></div><p></p>
      <p>Older PDF versions are more compatible, which is good if someone views the PDF using old software, but newer versions are better at handling transparency and other things.</p>
