    <p>Dear Everyone,</p>
    <p>I exported a document for PDF print that contains several paths in which I used Type on a Path. There is no fill or stroke on the path, yet the PDF consistently shows a light pink background color around the path area (see attached image). I don't see anything wrong with the PDF settings, but I may not recognize the problem - suggestions?</p>
    <p>Thank you!!<br>
    Chava Drummond</p><div class="imageWrap"><img src="http://typophile.com/files/pdf_problem_path_background_4052.png"></div><p></p>
