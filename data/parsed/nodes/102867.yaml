    html: <p>Interesting. I would actually suggest the opposite. Export as the lowest version of PDF you have available — probably 1.3 — and make sure to choose the high-resolution transparency flattener in the Advanced tab. This will "flatten" your drop shadow into an opaque object, which will guarantee it will print correctly, though your file will be larger.</p>
