    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indicies" title="Create node &quot;Indicies&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indicies</a>&nbsp;: <a href="/node/12207" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">History</a>&nbsp;: Maximilian&nbsp;I</strong></p>
    <p>Born 1459 in Vienna<br>
    Died 1519 in Wels, Austria<br>
    Ruler of the <em>Holy Roman Empire of the German Nation</em> from&nbsp;1493–1519</p>
    <p>At his court in Nuremberg, Maximilian I commissioned a group of lettering artists, including <a href="/node/13828" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Albrecht Duerer</a> and <a href="/node/13826" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Johann Neudoerffer the Elder</a> to create the <a href="/node/13772" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">fraktur</a> style of type. Legend has it that the Fraktur capitals were even based directly on his personal handwriting&nbsp;style!</p>
    <p>Maximilian I was not the first Holy Roman Emperor to play such a direct role in the development of the alphabet. His predecessor <a href="/node/13830" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Charlemagne</a> (748–814)—who founded the Holy Roman Empire in 800—had ordered the creation of <a href="/node/13704" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Carolingian Minuscule</a> for use throughout his&nbsp;empire.</p>
