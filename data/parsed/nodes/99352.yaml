      <blockquote><p>Maybe one solution is to create a special set for smaller sizes?</p></blockquote>
      <p>Bingo.<br>
      In fact (although some don't agree) a font for text <em>must</em> exhibit a certain ugliness when set large, otherwise it's essentially not optimal for text.</p>
      <p>Scale changes everything.</p>
      <p>hhp</p>
