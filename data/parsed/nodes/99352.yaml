    <p>Hello again,</p>
    <p>Are there any online resources that deal with character shapes and tips on designing them? I'm looking for something similar to "Designing Type" by Karen Cheng and the tips presented in <a href="http://typographica.org/on-typography/making-geometric-type-work/" title="http://typographica.org/on-typography/making-geometric-type-work/">http://typographica.org/on-typography/making-geometric-type-work/</a> (optical corrections, balance, and so on).</p>
    <p>Besides of the general knowledge I'll get by reading that kind of material, I'm hoping to find info to deal with a problem I'm facing: character "w" in small sizes looks black, heavy, like a dot in a sea of grey lines. I guess there should be some info around regarding this.</p>
    <p>Thanks</p>
