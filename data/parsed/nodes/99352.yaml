      <p>There's this:<br>
      <a href="http://briem.net/" title="http://briem.net/">http://briem.net/</a><br>
      But don't take the chirographic aspects seriously.</p>
      <blockquote><p>character "w" in small sizes looks black, heavy, like a dot in a sea of grey lines.</p></blockquote>
      <p>Doesn't that Typographica article cover that? You need to apply what's called "modulation" to relieve the optical effect of clotting.</p>
      <p>Related: <a href="http://themicrofoundry.com/ss_trapping1.html" title="http://themicrofoundry.com/ss_trapping1.html">http://themicrofoundry.com/ss_trapping1.html</a></p>
      <p>You should also study Futura (just don't make another one like it).</p>
      <p>hhp</p>
