      <p><cite>The rise of Google Web Fonts (GWF) leads indeed to think further the checks and balances between the freedom of tools and value of type design.</cite></p>
      <p>Why should Google Web Fonts have any impact on the way commercial type is licensed? Google Web Fonts is just another free fonts site riding a wave of publicity generated by hyping web fonts and open-source. Most of the collection is badly autotraced handwriting fonts or single weight text font revivals that nobody was clamoring for anyway. Eventually it will be like DaFont.com and every other free font web site—popular with first year design students, and irrelevant to most professionals.</p>
