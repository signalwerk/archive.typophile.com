      <p>I certainly agree that quality doesn't come from the effort put down by<br>
      the maker, and certainly not directly from how much the thing costs!<br>
      However there's always a layer of quality beyond what the consumer's<br>
      consciousness can appreciate - and critically some consumers know this.<br>
      For example in a text face there's the good spacing that leads to ease of<br>
      reading - something virtually no consumer can really gauge on his own.<br>
      So how do consumers decide to spend more money on something than<br>
      makes sense based on the hard facts they know? Simply something at the<br>
      core of human behavior: faith. And I don't mean a gullible, blind faith,<br>
      I mean a faith built up with experience in precedent, coupled to a belief<br>
      that people -especially those who put their hearts into making something-<br>
      are essentially good, and they can't remain good at what they do without<br>
      being rewarded.</p>
      <p>hhp</p>
