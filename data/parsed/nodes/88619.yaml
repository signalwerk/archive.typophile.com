    <p>Hi,</p>
    <p>As a typographic writer and young foundry leader (and titling type designer), I wanted to share some thoughts about libre/free fonts and the value of type design.</p>
    <p>The rise of Google Web Fonts (GWF) leads indeed to think further the checks and balances between the freedom of tools and value of type design.</p>
    <p>I propose also a new licensing scheme and some pieces of advice about web fonts and web fonts service.</p>
    <p><a href="http://www.fadebiaye.com/read/blabla/typonomics.html" title="http://www.fadebiaye.com/read/blabla/typonomics.html">http://www.fadebiaye.com/read/blabla/typonomics.html</a></p>
    <p>Any comment welcome...</p>
