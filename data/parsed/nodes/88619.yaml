      <p>James, I agree that in the graphic design world the set has had, and will have, little impact, but for in the software development space (apps and games) and web font space there's undoubtedly a measurable economic impact for vendors who operate in that area. Quality aside, at least from the legal angle, with Google standing behind them, these are a safer bet than most dafont free fonts. </p>
      <p>PS. Anyone know how close Google is to meeting their goal of 1000 fonts by 2012? They claim 393 families, but how many fonts?</p>
