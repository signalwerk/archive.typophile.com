    html: |-
      <p>I wouldn't say that. Well, I agree with Dafont, but plenty of us 'pros' use Google Web Fonts. Granted, it's not necessarily because of stellar type selection but rather because it's Google, which is a reliable, known entity when it comes to hosting code for us. </p>
      <p>Of course, with the right clients, we'll all be using more of the commercially licensed faces now as well. It's just that Google and the like got a much larger head start so have made some ground there.</p>
      <p>As for free fonts only being popular with first year design students, I think that was true a decade or so ago, when there really was a rather large gap between what was available as free licenses and what was commercial. But that gap, in many ways, has shrunk. There's a lot of really excellent faces out there being licensed in free formats. I wouldn't say that's necessarily REPLACING commercially licensed faces, but rather adding to the mix.</p>
