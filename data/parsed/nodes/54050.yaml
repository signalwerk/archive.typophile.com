  html: |-
    <p>I supposed this is a very novice question, but I was curious what the best font bundles are to buy. For example, I was on <a href="http://www.emigre.com" rel="nofollow"> Emigre's</a> website and was looking at the Mrs. Eaves type bundles. Open type has everything from ligatures to numbers and beyond, but there's a smaller (and less expensive) one without all the ligatures, fractions, etc.</p>
    <p>I suppose the question I post is when purchasing a font should you purchase the Open type files or is it best to buy what you need and move forward from there?</p>
  html_clean: |-
    <p>I supposed this is a very novice question, but I was curious what the best font bundles are to buy. For example, I was on <a href="http://www.emigre.com" rel="nofollow" class="link-external"> Emigre's</a> website and was looking at the Mrs. Eaves type bundles. Open type has everything from ligatures to numbers and beyond, but there's a smaller (and less expensive) one without all the ligatures, fractions, etc.</p>
    <p>I suppose the question I post is when purchasing a font should you purchase the Open type files or is it best to buy what you need and move forward from there?</p>
