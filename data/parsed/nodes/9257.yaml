    html: <p>Thank you typophiles; here is a small part of the contract.. <br> <br>3. TIMING OF PAYMENTS. Payments due to the Publisher will be paid on the first business day after the 20th day of the month following the month of sale. All payments will be made in US dollars and mailed via first class mail. In the event that XX is more than 30 days behind the payments under this agreement, Publisher shall have the right to terminate this agreement immediately by giving XX written or electronic notice of such termination. In such event, the license granted XX shall terminate as of the date of such notice. <br> <br>The only unfair thing that make me ungry is that this XX foundry is still making money form my work. A lawsuit is an imposible thing to do for me actually, and i am not interesed on fight with a situation like this, probably will be a waste of time, because it will be a money stuff. I am only a little confused about what to do now following the contract; i never tought that this will happen to me and maybe the better thing is to quit from the XX foundry as soon as posible via email (...and wait another 5 months..) and make my own e-commerce type place.  <br> <br>Thank for your feedback. <br> <br>Best <br> <br>mh</p>
  - id: 59967
