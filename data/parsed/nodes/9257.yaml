    html: <p>The only thing that's worked for me (and not exceptionally well) is applying pressure via mutual acquaintances. Strictly a socio-moral angle, bypassing the legal crap that's meant to protect the rich - but I'm an old-fashioned kinda guy. <br> <br>One thing though, be careful of the libel angle, if you make accusations that you can't prove in court - in case your adversary is that kind of person (but I don't think he is :-). The good news in this case is that you're not in the US. <br> <br>hhp</p>
