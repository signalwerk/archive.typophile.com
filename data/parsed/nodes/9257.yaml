    user_path: null
    user_image: /files/pictures/picture-1049.png
    date_raw: 15 Feb 2005 — 1:04pm
    date: 2005-02-15T13:04:00
    votes: null
    html: <p>It would seem that by not terminating earlier you've given these guys several months to exploit your work and keep 100% of the proceeds.  <br> <br>I'd suggest you send the termination letter, and take your fonts elsewhere.  <br> <br>I think the only leverage you have in getting the back-royalties would be the threat of publicizing the way you've been treated. But I'd certainly suggest you consult with a lawyer before doing that.  <br> <br>Si</p>
