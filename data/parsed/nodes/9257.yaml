  html: <p>Hi Typophiles, <br> <br>Is there any way alternative to sue, to get any responses from a foundry who fail on an agreement, i mean, a kind of organization related to software/type ethic or legal? <br> <br>I have a depression/frustration of 5 months without email responses or payments, and i am far from the country/state of the governed laws, so its hard to think about a legal way of help "in situ". <br> <br>Any help is very important for me; sorry to the foundry to make this problem public, but 5 months forced me to find any chance of solution, <br> <br>Best, <br> <br>Miguel Hern</p>
