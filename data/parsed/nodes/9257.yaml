    html: <p>Well, I don't know what your situation is, but TypeRight (from their rhetoric, at least) might be able to help. <br> <br>Also, if you and the other party are members of the ATypI, I believe that they still have an arbitration unit, which could handle your situation as well. <br> <br>Unfortunately, whatever your situation is, a lawsuit is probably out of the question. In order to do that, you'd have to hire a lawyer in the respective foreign country, and pay the requisite legal fees <img src="http://www.typophile.com/forums/clipart/sad.gif" alt=":-(" border="0"></p>
