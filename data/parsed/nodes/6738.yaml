    html: <p>Aristotle is the strongest concept you've got there. <br> <br>In fact, I find think it's excellent. Simple, interesting, memorable, and flexible. I like the ones on the right that simply say reason. Consider making the spacing of the boxes consistent. It would be more, er, reasoned? One drawback is that this odd shape may not work in all applications. The beauty is you can do different tree shapes to fit various applications. Well done. <br> <br>I would not even show the version suggested above. Unless they filmed <a href="http://www.imdb.com/title/tt0084726/">Wrath of Khan</a>, of course. At least two reasons. 1. It has no substance to it, no reason for being as it were, and 2. Some words look really bad with classical proportioned caps. REASON is one of them. The RE is too week. Consider modern proportions if you are dead set on this solution. <br> <br>That globe promo piece thingy is interesting. You could do something equally interesting with the aristotle tree that transforms into <a href="http://www.usa-reise.de/galerie/einsendungen/images/eigene/epcot.jpg">Epcot Center</a>. Or something. <br> <br>Randy</p>
    html_clean: <p>Aristotle is the strongest concept you've got there. <br> <br>In fact, I find think it's excellent. Simple, interesting, memorable, and flexible. I like the ones on the right that simply say reason. Consider making the spacing of the boxes consistent. It would be more, er, reasoned? One drawback is that this odd shape may not work in all applications. The beauty is you can do different tree shapes to fit various applications. Well done. <br> <br>I would not even show the version suggested above. Unless they filmed <a href="http://www.imdb.com/title/tt0084726/" class="link-external">Wrath of Khan</a>, of course. At least two reasons. 1. It has no substance to it, no reason for being as it were, and 2. Some words look really bad with classical proportioned caps. REASON is one of them. The RE is too week. Consider modern proportions if you are dead set on this solution. <br> <br>That globe promo piece thingy is interesting. You could do something equally interesting with the aristotle tree that transforms into <a href="http://www.usa-reise.de/galerie/einsendungen/images/eigene/epcot.jpg" class="link-external">Epcot Center</a>. Or something. <br> <br>Randy</p>
  - id: 47080
