    date_raw: 23.Sep.2004 8.18pm
    votes: null
    html: "<p>Thank you so much for the feedback. I agree with the wrath of khan statement -- I personally cringe when forcing ligatures between letters just for the sake of it. It was a last resort. <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\"> <br> <br>I suppose what it's boiled down to is that I need to present the idea to the client that the \"logo\" simply doesn't need to be as designed as he would imagine. I'm in the position to say that a properly kerned, intelligently chosen typeface will represent REASON PICTURES better than a flashy zany logo. <br> <br>I went down some other paths, here's what I have at the moment: <a href=\"http://media.quilime.com/reason/progress/\">http://media.quilime.com/reason/progress/</a> <br> <br>The uppercase italic face is also Emigre's Base Nine. I think it might be too modern for this particular use, more of a poster font. <br> <br>At this juncture, I'm settling on a specific face to represent the company. Futura seems to be as clost as it is. A bit cold, though. I wouldn't mind something a bit more modern, but the Emigre stuff might be too crazy. Thank you for your time, I appreciate the comments. <br> <br>gabe</p>"
    html_clean: "<p>Thank you so much for the feedback. I agree with the wrath of khan statement -- I personally cringe when forcing ligatures between letters just for the sake of it. It was a last resort. <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\"> <br> <br>I suppose what it's boiled down to is that I need to present the idea to the client that the \"logo\" simply doesn't need to be as designed as he would imagine. I'm in the position to say that a properly kerned, intelligently chosen typeface will represent REASON PICTURES better than a flashy zany logo. <br> <br>I went down some other paths, here's what I have at the moment: <a href=\"http://media.quilime.com/reason/progress/\" class=\"link-external\">http://media.quilime.com/reason/progress/</a> <br> <br>The uppercase italic face is also Emigre's Base Nine. I think it might be too modern for this particular use, more of a poster font. <br> <br>At this juncture, I'm settling on a specific face to represent the company. Futura seems to be as clost as it is. A bit cold, though. I wouldn't mind something a bit more modern, but the Emigre stuff might be too crazy. Thank you for your time, I appreciate the comments. <br> <br>gabe</p>"
