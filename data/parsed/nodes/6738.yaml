    <p>Hey all, I've been reading these forums for years, and behold. My first post. I'm designing a logo for a film production company. The name of the company is Reason Pictures.  <br> <br>I've thought so hard about this logo before diving into design that my execution is becoming muddled with the implied meaning of the word "reason". It's conflicting with my typeface choice. I know that I the name is so strong it doesn't really need an icon to accompany the type, it should be clean, and it should be powerful and, well, logical. Logical, meaning no tricks. It needs to stand the test of the time. Here's a glimpse at some of my progress and thoughts. And here</p>
    <div class="forum-topic-navigation clear-block"><a href="/node/6863" class="topic-previous" title="Go to previous forum topic">‹ Typeface Combinations</a> <a href="/node/6732" class="topic-next" title="Go to next forum topic">What with Mrs Eaves? ›</a></div>
