    html: |-
      <p>Nick, I'm no MS apologist, but:</p>
      <p>I think C* is a very good job for such a mass-oriented corporation; just the fact they produced that nice booklet speaks volumes (pardon the pun). Look at what Apple -once revered for its typographic sensitivity- has been doing lately... Chalkboard?! I mean really, cloning Comic Sans. How low can you go? Anyway.</p>
      <p>Could C* have been better? Well, for a malcontent like me that answer is always Yes! Specifically, there could indeed have been more harmony* between the fonts. But "megafamily"? Absolutely not. Think about how people are supposed to use them. Are half a dozen fonts supposed to cover all the bases anyway? Well, we type designers hope that answer is No! And when it comes to pairing, I think it's fair to state that the better such fonts pair the less versatile they will be individually (which is how most people do -and probably should- usually use them). So C* doesn't really <em>replace</em> anything, which is great.</p>
      <p>* Note that the x-heights are normalized.</p>
      <p>In terms of personality, I don't see how you could say that Constantia, Candara and even Calibri are lacking. And remember, these are supposed to be <em>system</em> fonts after all. Corbel for one thing is supposed to be neutral. Frankly only Cambria isn't my cup of tea in terms of styling - it seems... undecided of what it needs to be.</p>
      <p>&gt; What's missing is a geometric sibling (the "Gotham"), and that suggests<br>
      &gt; what went wrong, because as I understand it, ClearType does not favor<br>
      &gt; diagonals and circular curves.</p>
      <p>On the contrary CT prefers regularity. Read for example how Jeremy Tankard had to give up on a more irregular "w" because of CT.</p>
      <p>But yes, technical limitations did cause some design compromises. For one thing, the Bolds are too dark (just like in the old Core Fonts). But the question here is: did the compromise make sense? Is the solution balanced in terms of screen versus print, taking into account contemporary usage, and the sensitivity of users in terms of print versus screen? I think the balance is pretty good.</p>
      <p>hhp</p>
