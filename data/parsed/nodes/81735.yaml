      <p><em>And the fact that Corbel is as you suggest easier to recognize (both because of its default status as well as its rounded finish)...</em></p>
      <p>That's Calibri, not Corbel.</p>
      <p>Of the C* fonts (as they are referred to internally at Microsoft), Calibri is by far the most widely used because it is the default text font in MS Word. Corbel, by contrast, appears only in one of Word's predefined style sheets (the ‘Module’ style), which is one more than the sadly underused Candara. On the plus side, any use of Corbel that you do see represents conscious selection of that font, which is not the case with Calibri.</p>
      <p>Thanks for the WTF forum link, Florian. I had not thought to check that. It is sort of disturbing to see how frequently people are horizontally compressing Constantia.</p>
