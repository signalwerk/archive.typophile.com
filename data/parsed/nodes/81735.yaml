      <p>I studied Microsoft's book "Now Read This" extensively, but have a hard time remembering what the faces look like or what the names are, let alone pairing them up correctly; except Constantia with its pointy serifs. </p>
      <p>"Good" faces now doubt, but lacking in personality (pardon me for applying a human quality to a typeface).</p>
      <p>Whatever the individual merits of the typefaces, the C typeface project was fundamentally flawed at the level of product development. </p>
      <p>If one considers the collection as a megafamily, which is what the "C" naming, simultaneous publishing, and genre diversity suggest, Calibri, Candara and Corbel (the sans components) are neither sufficiently differentiated, nor sufficiently familyish. </p>
      <p>As a megafamily, it's clear where Cambria (chunky serif), Consolas (monospace), Constantia (classic serif) and Corbel (sans/Frutiger clone) stand, but Calibri is vague—neither really condensed nor really rounded, and Candara is tentatively flared.</p>
      <p>What's missing is a geometric sibling (the "Gotham"), and that suggests what went wrong, because as I understand it, ClearType does not favor diagonals and circular curves. It would appear that the focus on ClearType rendering created the lacuna in product development.</p>
