    <p><img src="http://lichtspielhaus3d.com/img/showings/lichtspielhaus/jpg/small/highnoon-poster.jpg"></p>
    <p>Lichtspielhaus Slab is an ultra condensed typeface based on Lichtspielhaus. It still transports you back to a time where neon lights and marquee letters decorated cinema facades. This time with Slab.<br>
    <a class="freelinking external" href="http://www.myfonts.com/fonts/typocalypse/lichtspielhaus-slab/" rel="nofollow">You can get it at myfonts if you like it</a></p>
    <p><img src="http://lichtspielhaus3d.com/img/showings/lichtspielhaus/jpg/small/1.jpg"><br>
    <img src="http://lichtspielhaus3d.com/img/showings/lichtspielhaus/jpg/small/2.jpg"><br>
    <img src="http://lichtspielhaus3d.com/img/showings/lichtspielhaus/jpg/small/3.jpg"><br>
    <img src="http://lichtspielhaus3d.com/img/showings/lichtspielhaus/jpg/small/4.jpg"><br>
    <img src="http://lichtspielhaus3d.com/img/showings/lichtspielhaus/jpg/small/5.jpg"><br>
    <img src="http://lichtspielhaus3d.com/img/showings/lichtspielhaus/jpg/small/6.jpg"><br>
    <img src="http://lichtspielhaus3d.com/img/showings/lichtspielhaus/jpg/small/7.jpg"><br>
    <img src="http://lichtspielhaus3d.com/img/showings/lichtspielhaus/jpg/small/8.jpg"><br>
    <img src="http://lichtspielhaus3d.com/img/showings/lichtspielhaus/jpg/small/9.jpg"></p>
    <p>There are 8 styles: Hairline, Thin, Light, Regular, Medium, Bold, Black and Heavy.<br>
    “Lichtspielhaus Slab” is the third part of a Type Noir Quadrilogy.</p>
