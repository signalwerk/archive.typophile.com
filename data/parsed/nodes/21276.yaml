      <p>Hi,</p>
      <p>Here are couple of links you may want to look at:</p>
      <p>Main page, maybe too much information on it, but at least you can download and install WPF from there:<br>
      <a> http://msdn.microsoft.com/winfx/reference/presentation/default.aspx</a></p>
      <p>WPF Text team has a blog with useful information about text formatting:<br>
      <a>http://blogs.msdn.com/text/default.aspx</a></p>
      <p>Filipe Fortes is another guy working in WPF text layout team and has a nice blog with examples: <a>http://fortes.com/</a></p>
      <p>This should be enough to start.</p>
      <p>Thanks,<br>
      Sergey</p>
