      <p>Thanks for fixing that-- I really appreciate it. Disappointing news about Word, though. Do you know where I could find a list of programs that do support OpenType features? (And whether Word for Vista will?) I'm assuming browsers don't display it. I'd ideally like to use them in xml-based e-books, but it would be up to the e-book reader software to support it, right?</p>
      <p>Also, if someone writes something with the correct combinations for the superscript or ligature in Word, then copies and pastes it into a program that does support OpenType, will the variant glyphs show up?</p>
      <p>Thanks,<br>
      Quinn</p>
