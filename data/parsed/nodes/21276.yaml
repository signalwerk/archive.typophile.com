      <p>Typotheque has a list of applications that support OpenType features:<br>
      <a href="http://www.typotheque.com/fonts/opentype_feature_support/" title="http://www.typotheque.com/fonts/opentype_feature_support/">http://www.typotheque.com/fonts/opentype_feature_support/</a><br>
      But read with caution:<br>
      For some features in XPress7, the mark only means that the according glyphs can be accessed by way the glyph palette (this is: 'ornaments', 'historical forms', 'slashed zero', 'stylistic alternates').<br>
      And that almost all features are marked in the Microsoft Avalon column does NOT mean that any application actually support them. As it seems, Word for Vista does not (there was a thread on this topic).</p>
