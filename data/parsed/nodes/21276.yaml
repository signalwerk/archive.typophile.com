    html: |-
      <p>first of all the Cyrillic script tag should be cyrl, secondly you should copy your lookups to to the default script so for your superscript feature it should look something like:</p>
      <p>feature sups { # Superscript<br>
      lookup sups1 {<br>
      sub [uni0434 uni043C uni0440 uni0441] by [uni0434.sups uni043C.sups uni0440.sups uni0441.sups];<br>
      } sups1;<br>
      script cyrl;<br>
      lookup sups1;<br>
      } sups;</p>
      <p>if i've gotten anything wrong, Adam should show up shortly to straighten you out. &gt;^p</p>
      <p><em>Superscript variants and ligatures *are* supposed to work in Word 2003, right? </em><br>
      I don't believe so. Office apps still give only <a href="/wiki/faux%20formatting" class="freelinking" rel="nofollow">faux formatting</a> for thinks like super/subscripts and smallcaps.</p>
