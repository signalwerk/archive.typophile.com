    <p>Hello,</p>
    <p>I'm new to font-making, and I've been pulling my hair out trying to get some OpenType features working for a Cyrillic font I'm putting together. Superscript variants and ligatures *are* supposed to work in Word 2003, right? (I did try InDesign too, also with no luck.)</p>
    <p>My font needs superscript glyphs that look somewhat different than just a raised standard glyph. If it makes a difference, the superscript glyphs have dimensions such that they should show up above the previous character.</p>
    <p>In addition, the superscript glyphs take on a different appearance if combined with Uni0483 (combining titlo); they should still appear above the previous character.</p>
    <p>I've read everything I can on OpenType superscripts and looked at all the fonts I have for clues, but I wasn't able to find much in terms of examples. All I know is that typing any of the relevant characters in superscript doesn't yield the superscript variants, and none of the ligatures appear when the correct combinations are typed.</p>
    <p>Here's what I did for the OpenType code:</p>
    <p>feature sups { # Superscript<br>
     script cyri;<br>
        sub [uni0434 uni043C uni0440 uni0441] by [uni0434.sups uni043C.sups uni0440.sups uni0441.sups];<br>
    } sups;</p>
    <p>and also</p>
    <p>feature liga { # Standard Ligatures<br>
     script cyri;<br>
        sub uni0434 uni0483 by uni0434_uni0483.sups;<br>
        sub uni043C uni0483 by uni043c_uni0483.sups;<br>
        sub uni0440 uni0483 by uni0440_uni0483.sups;<br>
        sub uni0441 uni0483 by uni0441_uni0483.sups;<br>
    } liga;</p>
    <p>Any help at all would be wonderful.</p>
    <p>Thanks a lot!</p>
    <p>~Quinn</p>
