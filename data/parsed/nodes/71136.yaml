      <p>Hi Jeffrey,</p>
      <p>I have deleted your other posts on this topic, as they seemed to be accidental.</p>
      <p>As far as I can tell, <a href="http://www.linotype.com/216008/photina-valuepack.html" rel="nofollow">Linotype’s Photina Pro Volume</a> for € 259 does not contain the same fonts as <a href="http://www.fonts.com/FindFonts/detail.htm?pid=242758&amp;cur=EUR" rel="nofollow">Monotype’s Photina® Complete Family Pack</a> for € 162. Linotype’s <a href="http://www.linotype.com/1697-21121/opentypecharactersetsopentypepro.html" rel="nofollow">OpenType Pro</a> has a wider language support.<br>
      F</p>
