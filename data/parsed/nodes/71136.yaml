    <p>Hi all,</p>
    <p>I have a question regarding the (huge) difference between the price of certain ITC and Monotype fonts at Linotype and ITC/Fonts.com respectively. For instance the MT Photina family costs 162 EUR at Fonts.com and ITC whilst costing a whopping 259 EUR at Linotype... I find this hard to understand because they are all part of the same company. Can anyone explain these price differences?</p>
    <p>On a related note: why do they not all the same versions of the fonts (ITC might offer an OTF version, whereas Linotype doesn't) and why is Linotype the only one to support Paypal?</p>
    <p>Thanks for your reply</p>
    <p>Jeffrey</p>
