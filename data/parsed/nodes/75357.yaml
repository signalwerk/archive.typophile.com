    html: |-
      <p>...a playful font like Oneleigh...</p>
      <p>I don't think it's the playfulness of the "font".<br>
      It's how homogenized the interpretation of the oldstyle is.<br>
      Compare Monotype Garamond with Adobe Garamond.<br>
      They are both the same typeface, Garamond, but Slimbach's interpretation homogenizes the treatment of the figures.</p>
      <p>This is a departure from 20th century metal, where fractions were generic, modern, and lining.<br>
      So if a typographer used oldstyle figures for integers, then there would automatically be a stylistic contrast with the fractions.</p>
      <p>Nut fractions is another story...</p>
