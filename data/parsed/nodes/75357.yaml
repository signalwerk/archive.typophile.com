    html: |-
      <p>The question about tabular fractions is very interesting. Do any font include fractions with tabular and proportional options?</p>
      <p>I made the fractions in my <a class="freelinking external" href="http://typophile.com/node/67787" rel="nofollow">font</a> all proportional (especially considering the huge difference between digit one and all the others), but I guess it would be a good idea to also include tabular variants. So when user selects tabular numbers, fractions are set accordingly.</p>
      <p>BTW, I'm using 10 set of numbers (aligned to uppercase, small caps and petite caps, besides old style and the default set, whose height is midway small caps and uppercase).</p>
      <p>Although not similar to Caslon, other good options are <a class="freelinking external" href="http://new.myfonts.com/fonts/brassfonts/girando-pro/" rel="nofollow">Girando Pro</a> and <a class="freelinking external" href="http://commercialtype.com/typefaces/lyon/lyon_text" rel="nofollow">Lyon Text</a>.</p>
