      <p>Thanks to another cookbook designer on Typophile, I put "arbitrary fractions" into Williams Caslon: you can do 3/16 or 235/789, and it will work, kerned. Also lining figures, proportional and monospaced, and old style figures, proportional and lined. And small caps fractions.</p>
      <p>If you want some sharp serifs—which work better in display IMHO—you can do Williams Caslon Text for Text and Big Caslon for Titles, as Boston Magazine has done. Big Caslon has stylish italics you can get if you ask.</p>
