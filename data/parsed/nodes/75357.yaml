      <p>I also think that fractions don't work so well with old style figures. With a playful font like Oneleigh, you might make it work, but I doubt it generally.   </p>
      <p>On the issue of having uniform width fractions, this can't work when you have more than one digit in the numerator or denominator. Williams Caslon Text has uniform width fractions for the basic half, thirds, quarters and eighths, if you want them. </p>
      <p>There is also the option in proportional old style of the traditional "I" shaped one and "ring" shaped zero, on one hand, and the default barbed one and stressed zero.</p>
