  html: <p>I’ve been a member of the Typophile audience for quite some time, and though maybe I’d enter the arena with a pixel font, it’s kinda up my ally. This is where one sketch headed. I don’t know what to do from here. I see there are necessary changes to be made, the ‘s,’ for example, could use some tweaking. <br><br>I though I’d keep it small, a six bit x-height, because that’s a great strength of pixel fonts, and a challenge I thought I’d like. Is it working? Is it worth it’s weight in kilobites? <br><br><img src="http://www.typophile.com/forums/messages/29/48267.jpg" alt="fractured six example"></p>
