    html: <p>I’m no expert on pixel fonts, but I’d say that in your original concept, either your e’s are top-heavy, your  <br>s’s are bottom-heavy, or both. (The middle of the word “hopelessly” emphasizes the disparity.) <br><br>Just looking at the set, it looks like the font wants to be a bit top-heavy — you didn’t rethink the o, and  <br>most of the other letters seem to be ambivalent. The word “six” makes it look like your s is upside- <br>down, too. I’d keep the old c for a bit, switch to the middle e, and try to redesign the s to match them  <br>as much as possible. Then let’s see another sample. It’s always hard to judge a letter in isolation. <br><br>As for your second font, maybe a second thread, just so things don’t get&nbsp;confused?</p>
