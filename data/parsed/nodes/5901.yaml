    html: <p>Thanks for the additional followup. <br> <br>I think the ATF Garamond and Bodoni are both worth studying, perhaps having slightly different lessons to teach. I still feel that the Bodoni is more useful for careful analysis of exactly <i>what</i> the Bentons did and <i>how</i> they did it. You can make the argument that the results of the Garamond are more aesthetically appealing, but that is not exactly the focus of my quest right now. It's obvious that it's possible to achieve optical scaling by drawing lots and lots of masters, but that's just too labor-intensive, even in the Bentons' day. <br> <br>As for the going back to the originals, let me try to state it more clearly. The original Claude Garamond fonts carry absolutely no risk of having artifacts introduced by the pantographic scaling process, as each punch is cut by hand so as to please the eye. For example, a waterfall of ATF Garamonds has a discontinuity as you switch from one master to another. <br> <br>One possible reason why the ATF scaling may be more extreme than Garamond's is that they appealed to much more of a mass market, while I assume that Garamond mostly concerned himself with fine printing. <br> <br>Let me put some scans together to illustrate my points, and I'll start a new scaling thread - this definitely isn't a "Release" issue any more.</p>
