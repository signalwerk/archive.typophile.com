    html: "<p>&gt; do you monitor and respond to these boards 24 hours per day, perhaps? <br> <br>:-&gt; <br>I used to. But then I got back from a 2-week vacation and got inundated with Typophile emails, and decided that's it. Now I mostly skim (especially the logo crit stuff - for me it's: just the fonts, maam), but still try to post when it feels useful. <br> <br>I think the 1923 specimen has great repro, but you're saying the '12 is even better? I could believe that. The Enschede 1908 specimen for example is visibly better than the -still masterful- 1978. What was the print run for the 1912? The '23's was 60K+, and maybe that put a dent in the quality. <br> <br>But anyway a carefully printed one-off (with the help of a master printer) on high-quality paper is even better. The only problem with that though is you can't be 100% it's the real thing. For example the 7pt in my waterfall is clearly faulty. And the 14 is funny too - in fact Kent has noted that there have been two cuts of the 14: one texty, one displayy. And I see you've noticed this too! Good job. <br> <br>The fact that the Garamond came later gives it yet another advantage, no? I mean, you're saying that the Bodoni had only one pattern plate (a very interesting observation), and to me that raises a warning flag, because -as you might have read elsewhere on Typophile- I believe there's a qualitative difference between text and display fonts. On the other hand, since Bodoni is so \"constructed\" maybe it only really needed one? But <i>then</i> that plays into my other point: because Garamond is more \"organic\" it pushes the limits of the automation more - so it yields more insight (both into the nature of optical scaling and the nature of the ATF automation) in the end. <br> <br>The original Garamond: <br>1) The ATF Garamond is one of the many \"fake\" Garmonds. It's actually based on fonts made my Jean Jannon. <br>2) Yes, Claude Garamont was not as good as the Bentons in optical scaling. But that's a reason to avoid him, right? <br> <br>Interesting here is a comparison of the \"Garamond\" of the Imprimerie Nationale versus the ATF's, in terms of optical scaling. A lot of it is comparable, except when you get to the really small sizes: at the very low end the ATF boys kicked the optical scaling way up, while the Frenchies tried to maintain more of the character of the design (which however I consider pretty hopeless at that size, and you lose too much readability from the small apparent size). <br> <br>Here's some stuff I did a while back: <br><a href=\"http://www.themicrofoundry.com/other/garas_12.gif\" target=\"_blank\">http://www.themicrofoundry.com/other/garas_12.gif</a> <br><a href=\"http://www.themicrofoundry.com/other/garas_10.gif\" target=\"_blank\">http://www.themicrofoundry.com/other/garas_10.gif</a> <br><a href=\"http://www.themicrofoundry.com/other/garas_06.gif\" target=\"_blank\">http://www.themicrofoundry.com/other/garas_06.gif</a> <br> <br>&gt; I don't really consider [shrinking descenders] part of optical scaling per se. <br> <br>No? Although some of the jumps in extender length are due to integer discretization*, increasing apparent size (through an increase in x-height) to me is a very big part of optical scaling. And there's something else: at the very smallest sizes all-caps setting becomes more important, so the baseline is brought [even] lower. <br> <br>* <a href=\"http://www.themicrofoundry.com/other/ATF_line.gif\" target=\"_blank\">http://www.themicrofoundry.com/other/ATF_line.gif</a> <br> <br>&gt; even a mediocre interpretation of optical <br>&gt; scaling is better than the current status quo.  <br> <br>Indeed. And I think we can get even higher than 90%. <br> <br>hhp <br></p>"
