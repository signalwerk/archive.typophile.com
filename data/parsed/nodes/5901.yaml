    html: "<p>&gt;  trying to reverse engineer, if you will, the way ATF did optical scaling in the metal days. <br> <br>Huh, that's something I've been working on too! And I'm a CompSci guy as well... <br> <br>Based on actual character set waterfalls of ATF Garamond (which I printed at the ArcheType press last year), I've taken measurements of 11 parameters across sizes from 6 point to 48 point, and one day :-/ I'll write a paper explaining the findings from my dissection. <br> <br>BTW, I think ATF is the best target to \"reverse engineer\". ATF Garamond in particular makes for superb study since it's a design that pushes the limits of optical scaling versus \"design integrity\". One thing you should note though: width and weight changes are only two of the many things that need to be accounted for, and the Benton boys (engineers as well, tellingly) certainly knew that. <br> <br>As for figuring out any \"algorithm\" that was used to automate the scaling, that's a very worthwhile goal. The Cost article I didn't find very enlightening though. So I've collected the names of half a dozen \"old-timers\" who might know more, and eventually I have to track them down and see if they'll spill the beans. <br> <br>FYI: <br><a href=\"http://www.typophile.com/forums/messages/4100/14651.html\" target=\"_blank\">http://www.typophile.com/forums/messages/4100/14651.html</a> <br><a href=\"http://www.typophile.com/forums/messages/30/33296.html\" target=\"_blank\">http://www.typophile.com/forums/messages/30/33296.html</a> <br> <br>hhp <br></p>"
