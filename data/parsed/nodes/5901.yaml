    html: "<p>Legally, any design patents are long ago expired (ATF had a lot of these, and many can be seen in the ATF archive at Columbia). <br> <br>In the USA, I understand there is no copyright on abstract typeface designs per se. But even if there were, the copyrights on much of the ATF stuff would have expired years ago. All works created prior to 1923 are in the public domain. Additionally, for works published between 1923 and 1963, the copyright owner would have to have filed an extension with the copyright office, else they would have expired by now. (Most of this info is taken from: <a href=\"http://www.bitlaw.com/copyright/duration.html\" target=\"_blank\">http://www.bitlaw.com/copyright/duration.html</a> ; note that I am not a lawyer and this should not be taken as legal advice.) <br> <br>So, what other rights are there? Well, there are the typeface names, which may be trademarked. I gather trademarks can last indefinitely if maintained. It's my recollection that some non-typographic people in California ended up owning the Kingsley/ATF trademarks after ATF died off. Sorry I don't have more info. <br> <br>Again, I'm not a lawyer, and there's no good substitute for real legal advice, which this is not. <br> <br>Regards, <br> <br>T</p>"
