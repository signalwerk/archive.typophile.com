    date: 2004-08-08T22:05:00
    date_raw: 8 Aug 2004 — 10:05pm
    votes: null
    html: "<p>Thanks for the response and links to the Adobe Garamond and trapping threads, Hrant. [do you monitor and respond to these boards 24 hours per day, perhaps?] We're kinda going off the original topic of the ATF legal rights, but I did want to briefly respond to a couple of scaling points. <br> <br>I absolutely agree that ATF is the best historical model for scaling - I seriously doubt that any numerically inclined font designer has put more thought into the question before or since. However, while the scaling in ATF Garamond is quite pretty, I've pretty much settled on the Bodoni family, for a few reasons: <br> <br>1. The Bodonis are present in the 1912, 1923, 1934, and 1941 books. Of these, the 1912 arguably has the highest reproduction quality. ATF didn't introduce their Garamond until after the 1912 book came out. <br> <br>2. From what I can tell, the Bodonis use a single pattern plate for all sizes from 6pt to 72pt, while Garamond has two patterns: one for 6pt through 14pt, another for 18pt through 72pt (although, in the original 1923 book, 14pt is made from the display patterns). Thus, we see the machine scaling get much more of a workout with Bodoni than the fonts with multiple masters. <br> <br>3. The shapes of Bodoni are easier to analyze because they're more geometric. <br> <br>Actually, if I'm going to analyze the scaling of Garamond, I'll look at the originals, as we know that Garamond wasn't working around the inherent mathematical (as opposed to optical) scaling nature of the pantographic engraving process. I have a nice reproduction of Berner's 1592 specimen sheet, and there's a good range of scales of authentic Garamond types from Canon (roughly 45pts) to Garamond (roughly 9pts). <br> <br>I absolutely agree that width and weight aren't everything, but for some of the ATF fonts (I've looked most carefully at the Bodonis, Century Oldstyle, and the News/Franklin Gothic family) those two parameters are the lion's share of the adjustments. Many fonts also have shrinking descenders in small sizes, but I don't really consider that part of optical scaling per se. Other than that, the main thing I see is that serifs get a mite shorter in the small sizes, after everything else is normalized away. A few letters have additional adjustments. For example, in the Bodoni Book lowercase 'k', the \"less than sign\" moves farther away from the vertical stem in smaller sizes, so as to preserve the visual distinction. <br> <br>But, from what I've seen so far of the Benton's work, fully automatable techniques should capture 90% or so of the effect of optical scaling. Of course, people will always want to hand-tweak beyond that, but in my opinion even a mediocre interpretation of optical scaling is better than the current status quo. <br></p>"
