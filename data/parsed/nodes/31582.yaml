    html: |-
      <p>Marc: </p>
      <p>Because it contains more than just the italics as a style. For example, I had a paragraph style for first paragraph of text, which was not indented and included oldstyle figures and a nested style with the first 4 words in small caps. Every following paragraph was the same, but indented and no small caps. With one click in the paragraph, I could format the whole thing, including the italics, and not have to worry about selecting text. I've used character styles, for example, to create the nested small caps style at the beginning of the first paragraph. But mostly I use paragraph styles so they carry all the information, including space before, paragraph rules, etc.</p>
      <p>K.</p>
