      <p>:) WOW</p>
      <p>Thank you.</p>
      <p>Marc: Hyphenation breaks in French are different from English. But mostly, in English, I can look up a word in the dictionary, and the hyphanation is indicated. There's no guessing involved. As I understand it, French relies on syllables, pronounciation and other factors, which make it a little iffy for me to get right. I have yet to find a French dictionary that shows the breaks.</p>
      <p>ChrisL: Somewhat ashamed. I played with that feature once, albeit very briefly. However, I usually hyphenate manually, and only in places. But mostly, I really wasn't sure how it worked. Does the language apply to selected text or to the document as a whole? Often I have both languages in one document. To be honest, I was too lazy to figure it out. ... I'd rather know the rules than rely on the software, anyway. ;) (That's my story, and I'm sticking to it!)</p>
      <p>I hyphenate in English manually, too, and check each break in my Canadian Oxford. (And yes, I also search my hyphens.)</p>
      <p>Linda: Thanks for the extra references.</p>
      <p>K.</p>
