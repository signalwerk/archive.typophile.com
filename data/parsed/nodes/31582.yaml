      <p>Kristina,<br>
      As you found out, it is by selected text. I always make style sheets that are language specific. You can apply some spaciong preferences in that way as well. You can make a character style for space emdash space that trcks/kerns the space to what you want. Then you can search and replace the text string "space emdash space" with same string and apply character style with adjusted spacing to all French text.</p>
      <p>ChrisL</p>
