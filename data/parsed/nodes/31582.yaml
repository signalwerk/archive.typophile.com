    html: "<p>I'm not a real francophone, but grabbing a small sample of French books from different publishers off the shelf by my computer, I found the following: one has em dashes set off by thin spaces, three have en dashes set off by word spaces, one has en dashes set off by thin spaces, and one has en dashes set off by word spaces on the outside only (i.e., the side away from the text being enclosed). These are all from France, though; Canadian usage might have more anglophone influence.</p>"
