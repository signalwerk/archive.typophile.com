    <p>Raising the Em dash question yet again. </p>
    <p>I generally set the em dash tight. Recently, a text I'd sent to our translation services came back with comments to space them em dashes. I am wondering if this is language-specific (like spaces before colons) or the translator has donned her typographer hat. I'm tempted to ignore the corrections, but first I would like to get a sense of em dash use in French texts from the francophones out there. </p>
    <p>Thanks!</p>
    <p>Kristina</p>
  html_clean: |-
