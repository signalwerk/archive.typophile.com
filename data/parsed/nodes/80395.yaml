    <p>In case you hadn't heard about it, I thought I'd give a mention to Ampersand, a one-day conference specifically focussing on web typography.</p>
    <p>It will be held in the famous Brighton Dome Corn Exchange, in the seaside town of Brighton, UK on Friday 17th June 2011.</p>
    <p>Ampersand is an affordable one-day event for knowledgable web designers &amp; type enthusiasts. The idea is to represent the overlapping worlds of type design, web design and software, and the event should be a fun day of nitty gritty details from experts in font design &amp; development, typesetting &amp; font usage, browser implementations, and with glimpses of a bright typographic future.</p>
    <p>The line up will be:</p>
    <p>* Vincent Connare<br>
    * Jon Tan (web designer &amp; cofounder of Fontdeck)<br>
    * Jonathan Hoefler<br>
    * David Berlow<br>
    * Tim Brown (type manager for Typekit)<br>
    * John Daggett (Firefox developer &amp; editor of the CSS3 Fonts Module)<br>
    * Mark Porter (former creative director of guardian.co.uk)</p>
    <p>More information at <a class="freelinking external" href="http://ampersandconf.com/" rel="nofollow">ampersandconf.com</a> and on Twitter at <a class="freelinking external" href="http://twitter.com/ampersandconf" rel="nofollow">@ampersandconf</a></p>
    <p>Ampersand is sponsored by <a class="freelinking external" href="http://fontdeck.com" rel="nofollow">Fontdeck</a>, <a class="freelinking external" href="http://typekit.com" rel="nofollow">Typekit</a>, <a class="freelinking external" href="http://typography.com" rel="nofollow">Hoefler &amp; Frere-Jones</a>, <a class="freelinking external" href="http://webtype.com" rel="nofollow">Webtype</a>.</p>
    <p>Thanks, Rich.</p>
