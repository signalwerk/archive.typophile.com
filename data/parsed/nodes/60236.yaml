      <p>I'm not sure how this name is pronounced, but I'm guessing at <em>kie-ah-NET-oh</em> or <em>kie-ah-NEAT-oh</em>. Either way, I think the <strong>AE</strong> ligature will make it harder to figure out how to say it.<br>
      To me, the real problem is the <strong>N</strong>, because it looks like a Greek letter pi. My two cents' worth is, use version #2, substitute a more conventional <strong>N</strong>, and use the funky-but-legible <strong>A</strong> and <strong>O</strong> from version #1.</p>
