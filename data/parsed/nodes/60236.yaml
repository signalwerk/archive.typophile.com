      <p>I think you should focus on keeping the dot "i" star and inside "O" star. The N is awfull you should change it to someting more readable. I'm not shure about the A, i'm not a fan of the original One, but maybe changing it like you do is going too far, as for the change of the T, i also don't like the original one, but i think you change it too much.<br>
      Another thing, if you decide to change the A for a more classic form like you did - wich i'm not sure is a good idea, classic look for gamers teenager.... - you should also correct the E to match the style of the A<br>
      that's for my two cents advices: keep the star - you might try versions that focus on it - , correct the N and try to slightly enhance the typo.</p>
      <p> good luck with this project.</p>
