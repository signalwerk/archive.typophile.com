      <p>It looks like a teenage eighties pop band that calls themselves "heavy metal" and doesn't wear shirts on stage. They know three chords and refuse to admit they're wearing mascara. The lead singer "Spitfire" has a lick-on tattoo that he puts on every morning and his real name is Chad. He collects toy dragons and has never beaten his little sister at chess.</p>
      <p>In other words - what the heck is this logo for? Is my impression the one you want? The odd name and the dagger style could work for some applications, but it doesn't work at all if it's not communicating visually the thing you want it to.</p>
      <p>Is it a video game? A band? A comic book hero? A medieval costume designer? A Harry Potter villain?  Because I really have no idea. IMHO, this is a much bigger problem than ligatures. If you walk through the kids books in Borders, you'll see tons of covers with this style in the young boys section. Is that your target market? If so, you've done well. </p>
      <p>Can you give us any information to figure out what you're trying to achieve?</p>
