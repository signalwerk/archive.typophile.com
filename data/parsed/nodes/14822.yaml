      <p>Mark,</p>
      <p>I've now become interested in designing bitmap fonts myself. But I'm absolutely ignorant when it comes to actual bitmap fonts; I have no idea what formats are being used and what for, let alone what programs are being used to create them. How do I take my first steps?</p>
      <p>As for outline fonts that look like bitmap ones, I realize I should use a grid, but I guess not any grid will work if I want the result not to be anti-aliased. How do I set it up correctly, then? And how do I do it in such way that the result won't be anti-aliased in Macromedia Flash as well (if it uses outline fonts at all)?</p>
      <p>TIA</p>
    html_clean: |-
