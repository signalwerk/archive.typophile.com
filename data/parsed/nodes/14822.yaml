      <p><em>some bitmap fonts are designed for use at a specific size (or its multiples); how is it done?</em></p>
      <p>By dividing your em square appropriately: with a 1,000 unit em square, for a 10-pixel font, each block (individual pixel) element would be 72x72; for an 8-pixel font, 125x125; and so on.</p>
