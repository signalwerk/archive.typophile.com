      <p>let me give you a ferinstance...</p>
      <p>“Microsoft® Windows™ consistently outperforms Linux™ based sytems on Dell® Opteron™ boxes using FakeSofts® Checker™ software. In fact Microsoft® Windows™ outperforms MacOS™, OSX®, and other Unixes™ even when FakeSofts® Checker™ software isn’t used in accordance with IEEE™ standards. “</p>
      <p>That’s obviously not a real sentence, but it demonstrates the kind of density of bugs I’m talking about.  If I superscripted them, well, then there is just a dot after every other word.  Hrant got the idea - it’s not “what can I do about it” or “do I have to do it” it’s “How can I convince my client not to do this without saying ’Because it’s flipping hideous!’?”</p>
      <p>Re: Reading this immersively - what exactly qualfies as immersive reading?  We’re talking 250-1000 words of product descriptions.  I don’t really have a problem using these things in display text or headlines, but in the body it really seems to break up the flow. </p>
      <p>Tell me more about this “textural distraction” thing, that sounds like a promising avenue.</p>
      <p>steve</p>
      <p>(the other thing that gets me is he likes to put them where they totally not required, like after IEEE or UNIX.   The argument for that is “better safe than sorry!” which is difficult to respond to without lapel-shaking)</p>
