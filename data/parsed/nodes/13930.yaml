    <p>Hey all, the search isn’t working, so don’t know if this has been addressed before or not.</p>
    <p>Anyway, I have this client I do some work for who likes to put either a (R) or a ^TM after EVERY company name or product.  As you can imagine, this results in quite a few of these things.  (It’s not just his company, it’s EVERY company he mentions or does business with.)</p>
    <p>My question is what effect, if any, this has on readability and comprehension.  I mean, it seems like “Microsoft Windows” is going to be easier to grasp than “Microsoft® Windows™”   </p>
    <p>Any thoughts?  Any studies or actual facts on this matter?</p>
    <p>Thanks.</p>
    <p>steve</p>
