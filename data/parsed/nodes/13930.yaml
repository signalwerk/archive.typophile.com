    html: |-
      <p>If the trademarks are owned by the client then its understandable that they would like to protect them by ’bugging’ the marks. My company’s policy is to bug only the first use of a mark on any given document. </p>
      <p>As for marks not owned by the client, unless there’s some legal requirement between the owner of the marks and the client, they may be able to avoid bugging and just put a standard TM disclaimer on the doc “all TM’s not marked remain blah blah blah”. Obviously they should talk to their lawyer before doing this.</p>
      <p>Cheers, Si</p>
    html_clean: |-
