      <p>Are you concerned solely with readability? </p>
      <p>There is a slightly more subtle problem — using TM and other devices makes the publisher or writer look like a shill for the companies whose products are mentioned. </p>
      <p>If that is what you want, then use them by all means, but make them small and unobtrusive. But if not, no need. (Check with your lawyer, of course.)</p>
      <p>The <em>New York Times</em> doesn’t even use intercaps in company names, btw (let alone TM symbols).</p>
      <p>—Kathleen</p>
