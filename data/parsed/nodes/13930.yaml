      <p>Well, something that would take a mark like that isn’t generally read immersively - which means maybe it’s not so bad. A valid readability concern though is the “textural distraction” that such marks have <strong>before</strong> the reader gets to that point of the text (sometimes from many lines before).</p>
      <p>Also, a big issue in something like this is Familiarity, specifically here how quickly it’s gained with something jarring like this; maybe with a proper name the reader has to learn the bouma <strong>anyway</strong> so again it’s not so bad. Nobody really knows though... So I might work the aesthetics angle (as in, it’s ugly); and/or look for a font with discrete marks, to reduce the textural distraction.</p>
      <p>hhp</p>
