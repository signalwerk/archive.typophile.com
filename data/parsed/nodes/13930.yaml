      <p>&gt; what exactly qualfies as immersive reading?</p>
      <p>Good question. There isn’t necessarily a clear threshold. In fact in this case if somebody has decided to read the thing, he’ll get through it before getting a headache. The question though becomes: do you want to make reading this thing so unpleasant than the reader just gives up?</p>
      <p>&gt; Tell me more about this “textural distraction” thing</p>
      <p>Basically, when there’s enough of a “spike” in the texture or color of text, the eye wants to jump directly to it to quickly figure out what this “special” thing is. When this happens, the eye then has to go back to where it was; this is wasteful and tiring. When a paragraph is littered with such spikes, it become quite unpleasant to read.</p>
      <p>—</p>
      <p>But here’s a possibly stronger argument:<br>
      Somebody reading such text might think it’s a parody.</p>
      <p>hhp</p>
