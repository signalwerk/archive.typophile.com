    <p>First of all I know in the past people have been hounding other people with questions about the MPAA rating letterforms, but my situation is a little different. </p>
    <p>While I know these types are varied and possibly illustrated by hand, I'm trying to create a simple piece of art mimicing the movie rating system but need to have a another letter(s) to come close as I can to the "feel" of the other already rendered by the MPAA.</p>
    <p>I've tried narrowing down a few fonts (ie; Latino Black, Melior Std Bold, Clarendon Std Bold and Egypienne Std Blk) that could come close or if need be modified to my liking but was wondering if any have further suggestions I could look for. Thanks in advance.</p>
