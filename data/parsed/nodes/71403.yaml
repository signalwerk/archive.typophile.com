  html: |-
    <p>how do you convert a polygonal shape into a smooth oval shape in Illustrator?. the goal is to obtain a smooth curve that runs through the anchor points and not the red or the blue curve you can see in this image. </p>
    <p>red=start polygon<br>
    green=approximate curve inside the polygon<br>
    blue=not fitting outside curve derived from the inside curve</p>
