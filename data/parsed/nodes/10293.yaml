    html: "<p>&gt; <i>Unauthorized localization is piracy, Maxim, not an example of a type designer giving away a free font.</i> <br> <br>Unfortunately, this is a bit more complex, and more complicated... The unauthorised development of the non-Latin versions of the commercial Western typefaces is the daily practice in so many countries. <br> <br>Nick, you know well that many EULAs allow the modification of fonts�for private use, of course. That makes playing with the letterforms designed by somebody else�altering them, developing new glyphs matching the original ones, etc., etc.�legal. It is legal even if it is, well, unethical. By the way, that bit about the ethics is fiercely debated by the type hackers. But It all becomes illegal the moment one starts <i>distributing</i> those hacked fonts�for profit or for free, does not matter. <br> <br>Obviously, such distribution <u>is</u> acceptable to the users of the bootleg non-Latins. Let's face it: Napster enjoyed huge popularity with millions of people, world-wide. And those who offer the fonts, or other software for free are�most predictably�popular with the masses. Who cares whether those distributors own the rights to the products they 'share', right? They present their dubious activities as an ultimate virtue, as a service to the community. And, alas, this is how they are seen by so many people out there.  <br> <br>Those generous sharers of other people's property, and their client�le go to great lengths to justify their right, if not their duty) to the distribution of the unauthorised non-Latin 'extensions'. Their favourite argument, of course, is, 'Oh, c'mon, look at that honourable and respectable foundry X: how many clones does it offer of the typefaces that originated with the foundries Y and Z, and vice versa? Why can <i>they</i> get away with it? Everyone steals.', etc. So that laissez-faire attitude, that assumes that no one is entirely clean or innocent, pervades. <br> <br>And so it goes.</p>"
