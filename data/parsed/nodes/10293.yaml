    html: "<p>Nick: yes, I think that selling an OpenType version commercially may well be the way to go. It's not so much a matter of poshness as how the features are packaged. TeX does in fact do small caps, but accomplishes them by choosing a different optical scale of the base font. Yes, TeX does optical scaling, and has since before Microsoft Word was in diapers. This is one of the reasons why doing an optically scaled series of this font is so appealing -- people will be able to use the optical scaling without having to twist themselves into pretzels. You are correct that TeX does not have oldstyle figures in its base glyph complement, and that they're unusual in math setting. <br> <br>From a technical point of view, I'd need to distribute the free version as a PostScript Type 1 font, because that's what the PDF export from TeX needs as its raw materials. TeX's own font format, Metafont, is pretty much dead these days. <br> <br>I have deep roots in the free software culture, but am not a fanatic. In this particular case, it's mostly a pragmatic decision. Many, many companies have tried to build proprietary extensions on top of TeX (including simply selling fonts for it), with absolutely no success. I would much rather see my work used and the overall typographic quality of math publications raised than follow those footsteps. <br> <br>In any case, I don't believe that free software is for everybody, but have warm feelings for its own particular strengths and charms. In any case, William, the analogy here is not people who pirate music, but people who release their own music for free. Maybe that does depress the market for commercial work, but at the same time I doubt that Britney Spears' corporate owners lose much sleep over the vast quantities of jam band music available at etree.org. <br> <br>I'd also like to bring up the EULA issue; users of my free fonts will be able to add new glyphs or otherwise customize them, without having to worry about running afoul of the EULA.</p>"
