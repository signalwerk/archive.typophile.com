    votes: null
    html: "<p>Maxim: excellent point! I think that GPL or other freely licensed fonts may be an excellent alternative for people who want to keep things squeaky-clean. <br> <br>Indeed, we've seen exactly this happen with the Ghostscript fonts. The company I work for, Artifex Software, started the ball rolling by licensing the rights from URW to release a complete set of PostScript Level 2 clone fonts under the GPL. Valek Filippov then added Cyrillic glyphs and released his new versions. This version was picked up by Red Hat for Linux distributions, with some fixes and touch-ups by Owen Taylor. Today, we distribute the <a href=\"http://www.cs.wisc.edu/~ghost/doc/AFPL/get850.htm\">1.06</a> version of these fonts, and plan to set up a repository to import the <a href=\"http://they.com/doc/gsfonts/\">newest (1.07pre22)</a> version, which lots of extra <a href=\"http://lists.debian.org/debian-i18n/2004/06/msg00023.html\">local language support</a>, including Uzbek and Vietnamese. I personally am very happy that all this activity is out there in the open.</p>"
