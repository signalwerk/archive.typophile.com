    date_raw: null
    votes: null
    html: "<p>As someone who gave away over 200 fonts, I think I can add something to the discussion. Idealism and public service did have something to do with it but, for me, it was a way of cutting my teeth, typographically speaking, and a way of determining where the public's taste lie. <br> <br>A lot of my earliest (1997) stuff was, in retrospect, pretty crappy (mostly spacing issues, but some design inconsistencies, too). Practice, practice, practice, and things gradually improved. But progress is not made in a vacuum: I have to acknowledge a tremendous debt to Ilene Strizver, who helped me develop my commercial releases through ITC and Agfa Monotype. <br> <br>I probably would have continued developing freeware fonts while peddling commercial ones as well, if not for a few sad facts... <br> <br>a) if you give stuff away, there are sorry bastards out there who will steal it and sell it; and <br> <br>b) if you give stuff away, there are clueless individuals out there who somehow expect you to personally give them more of your time (I want you to design a font for me, or copy someone else's design, or re-design your website to suit me, or...). <br> <br>I'm not sure which is worse, the thieves or the ingrates, but eventually I got fed up with feeding their kind (so much for the idealismj argument). So, was it all worth it? For the experience AND the exposure, yes, but I wouldn't recommend it to everyone.</p>"
