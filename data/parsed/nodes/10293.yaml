    html: <p>&gt;the analogy here is not people who pirate music, but people who release their own music for free <br> <br>That is true. My point was that some who pirate music - and perhaps also fonts - do it on the excuse that it all 'ought to be' free. And that argument I was rejecting.  <br> <br>It sounds like for the market you want to serve, there is no way to be compensated directly for it. But my point is that being compensated will sustain you to do other worthwhile projects of your choosing. So if you can include the font as part of your math publishing software, and charge for that, all the better, in my view. If that must be free, well so be it; I just worry about you being able to sustain the fine work you are doing.  <br> <br>Good luck with all of it!</p>
