    html: <p>I have not yet released a real font, but plan to release my <a href="http://levien.com/type/myfonts/">Century Catalogue</a> under a free software license. I'm not sure about the others; in part, we'll see how the first one goes. <br> <br>I have a good reason to release the CCat for free; I would like it to be one of a set of fonts useful for typesetting mathematics in TeX, and for it to have any real chance of catching on, it has to be released as free software. Otherwise, among other things, it won't ship with Linux distributions and so on. In addition to TeX, I'm developing some of my <a href="http://ghilbert.org">own</a> mathematics software (derived from Metamath, also released as free software, in this case GPL), and, again, I'd very much like this font to be part of the free release. <br> <br>All seven of Mark's points apply, to different degrees. The <i>design</i> of Century Catalogue is clearly in the public domain, although I am putting a lot of effort into making a good digitization. <br> <br>I have not yet chosen the actual license under which I will distribute the font. It will almost certainly be compatible with the <a href="http://www.debian.org/social_contract">Debian Free Software Guidelines</a>, as that is pretty much the gold standard for making sure that the license is compatible with other free software. I doubt seriously it will be public domain. I would like to keep rip-off artists from piling my font in with a trillion others on scammy download sites and pay CD's, I would like to, but I am not yet sure to what extent that's possible while still remaining within the DFSG.</p>
