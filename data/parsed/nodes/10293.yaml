    html: <p>Raph - Nimbus a clone of the Adobe Postscript set? Where do you get your information from?  <br> <br>1. Adobe wouldn't have Helvetica at all if it weren't for URW, because Adobe couldn't get their Helvetica actually to work with ATM until URW kindly helped them out with completely new data. You know, it's one thing to acquire the rights to the name 'Helvetica'. It's quite another to be able to digitize and manufacture it. That Adobe could not do. <br> <br>2. URW Nimbus is considered by Helvetica experts to be one of the three families of improved Helveticas, which comprise [whatever Berthold calls the version of AkGro which is in fact an improved Helvetica - is it AG Buch? I forget], Helvetica Neue, and URW Nimbus. I believe I have those in the right chronological order. An improved Helvetica was actually first designed by Berthold; Linotype then did its version, and Karow considers Nimbus Sans to be an amalgamation of the best ideas of all three. Karow's claim is not idle boasting, as JM's post illustrates. <br> <br>In any case, Berthold was first with the idea of fixing some of Helvetica's more egregious faults. Lino Neue Helvetica was a response.</p>
