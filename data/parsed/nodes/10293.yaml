    html: <p>Mark, this is a great answer and maps closely to my observations of free fonts, at least on the Web.  <br> <br>With respect to 6, there's often a business motive in giving stuff away, especially if the font is wrapped in a pretty restrictive license. I think the Vera fonts are a case in point. Bitstream hopes that they�ll get some custom work out of the arrangement with Gnome, or that customers will want the better hinted Prima versions. Likewise with our �Web fonts� we gave them away for free to help establish them as the standard for Web typography.  <br> <br>There�s also another element to 3 namely hassle. It�s very easy to post a free font - you zip it up and stick it on your site. But setting up an ecommerce site is hard, even setting up an account with MyFonts involves real work. <br> <br>Cheers, Si</p>
