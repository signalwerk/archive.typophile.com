    date_raw: null
    votes: null
    html: "<p>Unauthorized localization is piracy, Maxim, not an example of a type designer giving away a free font. <br> <br>Nonetheless, despite the situation you describe, I am considering putting non-western characters in some OpenType fonts. While there is not much of a foreign market for a Western foundry doing this, there appear to be two potential purchasers of such fonts: \"ethnic\" publishers catering to their communities in the West, and Western corporations marketing their product in non-Latin countries. <br> <br>Also, I would enjoy the challenge of designing glyphs for different alphabets.  <br> <br>In fact, now that I think of it, there are a number of typefaces I've designed \"for the challenge\" (such as Alphaville, 4,000 and something on the Myfonts sales chart), not because there is any demand for them. Perhaps I should be giving those away. Another category, Vanity Publishing? <br> <br>But maybe not. Typefaces that are not popular now may catch on in the future. And perhaps countries where software piracy is rife now will go legit? Is that a possibility, Maxim?</p>"
