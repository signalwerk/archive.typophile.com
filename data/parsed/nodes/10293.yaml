    html: "<p>i have been working for two years now in developing a flexible bitmap font system called Elementar. this work originated as my diploma work and is currently being further developed as my master thesis. <br> <br>in july this project has to leave the achademical world and become autonomous � i won't have support from scholarships anymore and need to start making some $$$ with it. <br> <br>...so i am trying to figure out myself how to conciliate achademic and commercial interests. <br> <br>my idea so far is to release the fonts under two different licenses: one for commercial and other for non-commercial use. <br> <br>1) i want people to be able to get the fonts for free, to experiment with it and to contribute in the further development of the Elementar system <br> <br>2) i would like to sell the fonts for people who want to use them in commercial projects � with different conditions and values for use in websites / oems <br> <br>i thought about using the creative commons license for the non-commercial release � but i have never seen this license being used for fonts... � i think the idea of having the license embedded in your website to enable searching machines to read it very interesting. <br> <br>i also think it would be better to send the fonts per email rather than to have them available for download � a way to build a database of who has the non-commercial licenses. <br> <br>-- <br> <br>these are my ideas so far, any comments and suggestions would be greatly appreciated...  :-) <br> <br>ps: the Elementar fonts have been originally designed as 1-bit pixelfonts, but since last year there are greyscale versions of some of the fonts commercially available at <a href=\"http://www.ultrafonts.com/fonts.php\">ultrafonts</a>.</p>"
