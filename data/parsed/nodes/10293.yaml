    html: "<p><i>I think there are a number of reasons why type designers give fonts away. Here a few that come to mind: &lt;...&gt; 1. &lt;...&gt; 2. &lt;...&gt; 3.&lt;...&gt;</i> <br> <br>There is another, very special, variety of the free font distribution. It could be considered 'niche' if the numbers of the target users of those fonts were not in the millions, or tens of millions. <br> <br>The non-Latin 'extensions' of the popular Western typefaces�Cyrillic, Greek, Armenian, Hebrew, etc.�developed by the enthusiasts (actually, hackers) are most often given away. 99 per cent of the time those 'extensions' are developed without knowledge, let alone consent, of the copyright owners�designers, foundries or distributors.  <br> <br>It is ironic that some of those unbidden 'localisers' even provide references to the original typefaces, and credit their designers�without ever asking their permission for meddling with their designs. And then those bootleg non-Latins are given away. The quality of those freeware fonts is not an issue, of course: one shouldn't look a gift horse in the mouth. <br> <br>One consequence of the development and distribution of those unauthorised derivates is that along with a set of non-Latin glyphs they include the entire complement of the original 7-bit Latin glyphs. That is quite enough to set texts in English, so this covers 90 per cent of the demand for typesetting in foreign languages that exists among the users of non-Latin fonts. The inability to set texts in German, French, Spanish, etc., does not feel like a great problem to most. <br> <br>Even if the real market for the 'payware' digital fonts existed in, say, Russia, the unauthorised localisation would leave very few chances to the sales of the 'real thing' there.  <br> <br>Of course, the OpenType technology takes this problem to a whole new level. In one quick sweep, a font hacker can snatch so much more than he or she used to in the recent past: small caps, ligatures, alternate alphabetical glyphs and figures, etc. <br> <br>I know that many designers of the original typefaces feel pretty frustrated with the practice I am referring to�even if the development of the non-Latin versions of their typefaces is not at the top of their own production schedules. But now, at the age of Unicode, everything feels so different than ten years ago.</p>"
