  html: <p>Hello, <br>I am wondering if anyone in this forum has designed a font and then given it away for free. If you have, I am really interested in your motivation for donating your design work to the public domain. Did you do it because you are a believer in "free culture?" Did you do it because you judged your font to be "noncommercial?" Did you do it for self-promotion? Can't suggest any more off the top of my head - help me out!</p>
