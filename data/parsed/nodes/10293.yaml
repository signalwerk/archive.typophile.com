    html: "<p>I think there are a number of reasons why type designers give fonts away. Here a few that come to mind: <br> <br><b>1. Promotional purposes.</b> The idea is to give away a free sample to generate interest and good will with hopes that people will pay for other fonts offered. <br> <br><b>2. Specialized non-commercial niche.</b> There are some areas such as academia or hobbies for which type designers, usually amateurs, create fonts to fulfill some special purpose. The fonts are given away out of a sense of sharing with others who have the same interest. <br> <br><b>3. Lack of confidence.</b> Novice type designers or others who may just be dabbling in type design give fonts away just because they don't think their fonts are good enough to charge money. Often, these fonts are incomplete or untested. By giving the font away, the designer absolves him or herself of responsibility for how the font performs. (I suspect that most freeware fonts fall into this category.) <br> <br><b>4. Idealism.</b> Some type designers give away their fonts as part of the free software subculture. This is a nice idea, but I suspect these people have some other source of income and lots of free time. (BTW, giving away commercial fonts created by others is not idealism, it's piracy.) <br> <br><b>5. Hopelessness.</b> Some type designers give away their fonts in the belief that it's not possible to make money in type design (not actually true, btw) and see it as a \"labor of love.\" <br> <br><b>6. Public service.</b> Sometimes a fonts designed for some practical purpose are given away to gain wide distribution, such as web fonts or system fonts. It may also be that free alternatives are already available from other sources. Bitstream's free Vera fonts are an example of this. Their commercial font business does well enough that they can afford to do this as a public service. My font <a href=\"http://www.ms-studio.com/FontSales/anonymous.html\" target=\"_blank\">Anonymous</a> is a similar case. On one hand, it was derived from an existing freeware bitmap font and it only seemed right to keep it free. On the other hand, I saw it as a way to draw visitors to my site and demonstrate the quality of the commercial fonts I offer (see reason 1 above). <br> <br><b>7. Lack of authorship.</b> By this I mean people who trace or autotrace existing fonts from old specimen books, often without much skill, and give fonts their fonts away because they wouldn't feel right about charging for something that took so little effort. (This can be like numbers 3 and 4 above, but for people without original ideas.) <br> <br>I'm sure there are other reasons, and I'm sure that some of these are colored by my own point of view as someone who makes a substantial part of his income from selling fonts.</p>"
