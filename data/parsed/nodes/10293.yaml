    html: <p>I haven't designed any fonts, or typefaces, that I've given away. However, the "Panoptic" alphabet (which emerged in the process of designing the typeface Panoptica) is in the public domain, because I haven't patented it. Too much trouble and expense, and besides, I'd be interested to see other interpretations of the alphabet, although there's not a big market for monowidth unicase typefaces!</p>
