    html: <p>&gt;stingyness <br> <br>Let me explain my thinking on this. Most people have to work for a living. If they get paid for designing type or creating math software, then they can go on doing it. If they don't they have to do something else.   <br> <br>That is why philosophically, I think the 'free work' concept is bogus - just as those who think nobody is hurt by pirating music, because it 'ought' to be free. <br> <br>Of course hobbyists can do good work, but sustained excellence of somebody like a Matthew Carter just isn't going to happen unless they get paid. There are free niches, but it is an illusion to think the market can get excellence without paying somebody for it. Again, the hippie idea 'everybody should just do everything for free' is just bogus.</p>
