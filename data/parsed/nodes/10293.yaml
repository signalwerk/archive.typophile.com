    html: <p>&gt;giving away a font and putting it in the public domain aren't strictly speaking the same. If a font is in the public domain, you can derive other works off of it. <br> <br>Point taken. There are various degrees to which you can give the public access to a font - I have come across stipulations about commercial versus private use like, "if you use these fonts commercially, give a donation to Doctors Without Borders" (Manfred Klein's fonts <a href="http://moorstation.org/typoasis/designers.klein" target="_blank">http://moorstation.org/typoasis/designers.klein</a>). Other options include creative commons licenses that allow flexible copyright for creative work (<a href="http://creativecommons.org/license" target="_blank">http://creativecommons.org/license</a>) as well as  full-on copyleft licenses that insist that all derivative works from the free work remain free and in the public domain. <br> <br>thanks for the input so far,everyone - really interesting stuff.</p>
