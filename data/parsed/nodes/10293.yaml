    html: <p>I respect your goals of releasing your font and mathematics work free, Raph, but I really don't get the concept. Academics are paid by their universities, and don't get paid for journal articles. It makes sense to follow that model to some extent if you are being paid as an academic, but I gather you are a graduate student. Your font is an impressive piece of work and I am sure took many weeks of full days to produce. Your math work probably much more. Will you be compensated in some way for your time and your accomplishments?  <br> <br>This - a font and perhaps your math publishing software - is different from a Journal article in that it is a product that is sold for use. I can see that an operating system like linux, which is massive and many people can make contributions to, can fruitfully grow open source. But I really wonder about applications, which is what you are developing here.</p>
