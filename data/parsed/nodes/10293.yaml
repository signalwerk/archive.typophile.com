    html: <p>"There are free niches, but it is an illusion to think the market can get excellence without paying somebody for it. Again, the hippie idea 'everybody should just do everything for free' is just bogus." <br> <br>Open Source software seems to disprove that. Granted, Open Source software development is certainly not the same as digital type design.  <br> <br>CreativeCommons is a great concept...it allows folks to both give away work for not cost, but retain various levels of credit and rights ownerhip, which preserves some value for the product...even if it's not a monetary value.</p>
