    votes: null
    html: "<p>Hi Andrew. <br> <br>This reminds me of the type/shoe print Tanya did a while back. Nice work. I also like the submarine, spaceship duality. A couple of comments:  <br>- Consider elongating the engine to fill the void caused by the L. <br>- The lighter version is better at small sizes, but weak larger. <br>- The RTU ligature looks a little odd (moreso large size). Consider making it just a TU lig and introducing a bit of space in between the RT. <br>- Color. I might do a two tone paint job, like most boats (the space shuttle for that matter also). One color above the waterline, another below. Maybe light blue above, navy below, red and orange stripes on a light blue engine, with orange flames. Even if it were only one color, I still might go Light on top darker on the bottom, with the engines filled with a tint. <br> <br>Fun stuff. I wanna go back in time! <br> <br>R</p>"
    html_clean: "<p>Hi Andrew. <br> <br>This reminds me of the type/shoe print Tanya did a while back. Nice work. I also like the submarine, spaceship duality. A couple of comments:  <br>- Consider elongating the engine to fill the void caused by the L. <br>- The lighter version is better at small sizes, but weak larger. <br>- The RTU ligature looks a little odd (moreso large size). Consider making it just a TU lig and introducing a bit of space in between the RT. <br>- Color. I might do a two tone paint job, like most boats (the space shuttle for that matter also). One color above the waterline, another below. Maybe light blue above, navy below, red and orange stripes on a light blue engine, with orange flames. Even if it were only one color, I still might go Light on top darker on the bottom, with the engines filled with a tint. <br> <br>Fun stuff. I wanna go back in time! <br> <br>R</p>"
