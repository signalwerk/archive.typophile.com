      <p>Rule number one in billing - client always pays the first 1/3 (or even 1/2) of the estimated cost upfront before any work begins. Otherwise you <strong>will</strong> be stiffed. This helps the client realize its serious and reminds them that they have a vested interest in a successful design process.</p>
      <p>As far as billing by the project goes - it should reflect your hourly rate which should be a reflection of the value of your time, skill, effort, cost of living, and business operating costs. As you get better over time at estimating how much a given project will cost (in time and effort), you’ll be better at providing more accurate “per-project” quotes. But you’ll probably get dinged the first couple of times until you’ve got your “estimating framework” in order and calibrated...</p>
      <p>As for your design - I would have ’shopped out the hair on the model’s cheek - it looks distracting. Type wise you’ve done well - good, clean typesetting and it’s quite readable. The facebook logo looks out of place though - too far off to the left and a heavier and darker typeface make it take more precedence then it should in the visual hierarchy.</p>
