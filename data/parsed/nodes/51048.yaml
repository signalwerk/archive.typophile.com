    <p>Ok, so this is a a6 flyer I designed for the client mentioned in my last post who thinks because I haven’t got commercial experience, I have to show this in my price. Anyway, I now how to come to a price for this flyer on top of all of this and I am worried that he may think exactly the same with this flyer. I would be happy to charge for this flyer £100, but he may think I am overcharging him again. I only have myself to blame as there wasn’t a contract and I sent him the design without getting the money first. He has got 5k printed onto 350gsm silk card. SO how much could I get for something along the lines of this one I designed. I just need a figure that I can go off for future designs.</p>
