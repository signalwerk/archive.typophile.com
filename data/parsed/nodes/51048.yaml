      <p>Commercial Experience? Ha? What a big pot of BS!<br>
      Hey BabyDahl, tell that dude that unless he could do the job you did himself, with the software you used, then it is a commercial job you created. (And looks good!) You don’t need commercial experience to do a commercial/professional job. Some people pick things up quickly and have a professional eye without a degree or experience. I’ve seen some damn awful Graphic Designer who have degrees and commercial experience who turn out badly designed rubbish still after many years of practicing.</p>
      <p>And I bet in his industry there are bad hair stylists(or whatever they are calling themselves this week!)who trash your hair, even with all there commercial experience.</p>
      <p>What is the hourly rate for Design in the UK?</p>
      <p>If you can’t find out, charge him £150 for being a smart pain in your rear end, and tell him next time you’ll charge more thanks to him giving you the now treasured COMMERCIAL EXPERIENCE!!<br>
      If he was happy to print your job and his commercial business deemed it to be commercial and professional, then it is.</p>
      <p>Nice work BabyDahl.Keep up the good work.</p>
      <p>Cheers<br>
      Drj<br>
      (Over 15 years Graphic Design AND Commercial Experience....lol)</p>
