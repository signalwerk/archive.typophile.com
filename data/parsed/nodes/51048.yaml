      <p>You definitely want to charge by the hour + any premium you warrant/can get.</p>
      <p>You may not BILL or INVOICE by the hour, but you have to be sure you’re invoice reflects, at an absolute minimum, your hourly rate * time spent.</p>
      <p>Otherwise, you’re not really making any money.</p>
