  html: |-
    <p>Folks — this a newbie question. </p>
    <p>I have an open type font and I'm really unhappy with how they have kerned the question mark. It is hard up against the preceding letter. When I have used it I have had to do a clumsy search and replace to add 1.25 points between the last letter and the question mark. But I would like to be able to edit the font to make this change the default. How can I do this? I have Quark and Indesign but not Fontlab or anything that can be used to construct fonts. Is it possible to edit these values in the fonts using what I have?</p>
    <p>thanks in advance for your help</p>
    <p>El.</p>
