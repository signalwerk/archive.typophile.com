    html: |-
      <p>As a general observation, it's rare for big brand names to use stock typefaces/fonts, because they want to be distinctive. Once this custom work was drawn by hand, and now it's often done on a computer, but it has always been one of the main ways that type designers have made a living. Nowadays I get the impression that it's frequently the ONLY way that most designers can make any serious money, thanks to font piracy (which is one reason we frown so much on the 'where can I get it free?' question here).</p>
      <p>- Mike Yanega</p>
