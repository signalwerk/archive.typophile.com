      <p>Of all the gazillion of lines of type I've designed / set, I've only used guillemets with English once. It MADE the piece. I just wish I had a tear sheet of it.</p>
      <p>Maybe this is one of the two things Hrant has seen. Circa 1990; cannot recall the product name, but I do know it was an ad for a shampoo made by a midwestern company. The main feature of the ad was a sultry dame on a bar stool, all legs, smirk, and hairdo. The art director had succeeeded [by some lights] in giving her a "European" look, but we struggled with the type for days.</p>
      <p>Finally, switching to Friz Quadrata, I set a version with guillemets around her sassy words. I saw the success immediately, but we did play around with the direction of the guillemets, pointing them in different directions in different versions. This, of course, did not matter; it was a short ad in English, and the assumption was that readers would not care about these matters, but would recongize the asserted European-ness of the product, and then be aware that their sex lives would be remarkably enhanced if they scrubbed with this stuff.</p>
      <p>I did have to instruct several levels of art directors, creative directors, and client managers just what the hell those funny marks were, though.</p>
      <p>That's one instance where this can work. Otherwise, I'm with the cautious ones -- in general.</p>
      <p>powers</p>
