      <p>I think outward-pointing guillemets are esthetically and communicatively the best kind of quotes:</p>
      <p>(1) As so many of you have said, guillemets beat the so-called inverted/raised commas because they leave no ugly gaps. Hrant’s point about avoiding confusion with the apostrophe may be communicatively even more important.</p>
      <p>(2) For maximum clarity, opening and closing quotes should point in a different direction. It may seem odd that I mention this, but in Finnish composition we have this unfortunate convention – it may come from Sweden – of all the quotes pointing right (i.e. either »this way» or ”this”).</p>
      <p>(3) The outward direction looks better, the quotes – especially when they are guillemets – enclosing the quoted matter in the same way as parentheses.</p>
      <p>I don’t think things like this should be considered part of the language per se. They have little to do with the grammatical system; they are arbitrary conventions (though certainly part of the literary tradition and culture of each country).</p>
      <p>Having said all this, would I have the guts to use guillemets in English text? Probably not. I considered it when doing my own thesis (in English), but ended up using the traditional forms.</p>
    html_clean: |-
