      <p>Depends on what you mean by "allowed": is it suggested by any English-language style guide in North America? Nope.</p>
      <p>I think you might get some direction from looking at classical recording liner notes: as an example, I've pulled out my 1983 (remastered 1997) Teldec recording (0630-18952-2)  of Handel's <em>Messiah</em> that has notes in English, French, and German.  The French and German quotes use guillemets as you've specified, but the English use " -- the North American ones, not the British.</p>
      <p>While I will agree with Hrant that they look nice, you risk confusing your readers if you use them: FWIW, I wouldn't, but YMMV.</p>
    html_clean: |-
