      <p>wow, so many posts over night. thank you for all the aspects you are bringing in.</p>
      <p>regarding eben sorkin's first post, i should mention, that it is an art catalog, which is actually selling nothing but the artist himself. it's a documentation of a rather weird performance. i added a slight historical touch to the design and that's also a reason, why i intend to use guillemets as quotes. although it is less common, it is an option, when setting text in german language (i guess, it is rather unsuitable for scientific texts or other highly official stuff).<br>
      in spite of hrant encouraging the use of guillemets in english language, i see, that for most english speaking people it seems so unfamiliar, that they will point fingers at me ("don't you know, you mustn't use these quotes!"). and, well, using hybrid quotes in the height of the minuscules would easily be even more confusing, wouldn't it? i guess, i stick to the official quotes, though, i might change my mind, if there showed up more "references" for the usage of guillemets in english literature.</p>
      <p>// alex</p>
