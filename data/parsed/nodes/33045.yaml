      <p>In the first years of the twentieth century, André Citroën started out with a company that made gears with herringbone-patterned teeth. My simplistic understanding is that these gears will not lose/waste as much energy as teeth with simple horizontal teeth, but require greater precision in manufacturing and alignment. Once he got into the business of making cars he retained the shapes of his gear teeth as a symbol for the Citroën car business. As you can see, though, a realistic representation of the parallel gear teeth was supplanted by guillemets.</p>
