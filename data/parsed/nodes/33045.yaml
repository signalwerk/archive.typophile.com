      <p>I'm not saying <em>never</em>, but I just don't see this one going the way of the great auk anytime soon.</p>
      <p>There just isn't a plausible rationale for it, for starters.  Heaven forfend, I've pushed envelopes all my life, and not-so-long-ago, gave a client a total of 22 choices for using their address in publications.  That there were slim rationales for ten of those, and only legitimate (and, I might add, legal postage regulation) choices for two, I merely shrugged when they picked "something else."</p>
      <p>(That they couldn't even be bother to be consistent with their choice is what led me to bail out of what you might label as <em>just another office job.</em>)  :-)</p>
      <p>There's bleeding edge, and then there's just plain dumb -- using guillemets for English is, right here and right now, the latter, IMO.</p>
