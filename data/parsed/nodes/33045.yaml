      <p>&gt; There just isn’t a plausible rationale for it</p>
      <p>Sure there is; in fact there are two - which I've mentioned:<br>
      1) No confusion with the apostrophe. Think of a plural possessive in quotes, like this: "dogs'". This is especially true for the British practice of using single quotes.<br>
      2) Better spacing - fewer distracting and ugly gaps, especially next to punctuation, like a period or comma. You know those funny typesetting rules that say a period or comma should be inside the quotes (even if it doesn't make content sense)? Those rules are in place to reduce crappy spacing. Plus fewer collisions, like after an "f".</p>
      <p>I wouldn't suggest changing something simply for novelty.</p>
      <p>hhp</p>
