    <p>hello,</p>
    <p>i'm working on a catalog, which will have the german text and the according english translations side by side. i'm currently using «guillemets français» (respectively for german typesetting the »other« way round). for the english translations, however, it even does not seem to be an alternative option to do so.<br>
    but before having different looking quotes, i'd like to ask, whether it is allowed by any reason to use these quotes in english texts.</p>
    <p>opinions?</p>
    <p>//alex</p>
