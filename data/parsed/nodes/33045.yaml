      <p>I speak fluent French and am fairly comfortable in German, and therefore use the guillemets in both directions as you mentioned above (and in French, use them almost every day). </p>
      <p>However, even though I am very fond of those languages and <strong>adore</strong> using the guillemets for their shapes and the strong associations that they carry for me, I agree with Linda. </p>
      <p>If you are addressing an audience that is not very familiar with European languages, they will be confused. If you are addressing Europeans, won't they <em>also</em> be confused, because they will be expecting to see the “ ” symbols? </p>
      <p>To my eye -- and thinking about how skillful design can support and underscore the language -- it seems perfect to set these things »auf deutsch« and “in English” to give each language its strongest flavor. Oder?</p>
