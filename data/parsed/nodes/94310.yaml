      <p>I guess I didn't make myself clear. Neither I'm looking for such typefaces nor I focus on experimental typography. I'm seeing the similarities, a certain system behind those "experiments", and I wonder if there is indeed a source of this trend.<br>
      One can point me in Paul Renner's direction. And that would be possibly the first step of research. However I can't find the next step.</p>
      <p>Thanks everyone for comments anyway.</p>
