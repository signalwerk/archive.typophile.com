    html: |-
      <p>It’s nice to see the return of pure plastic invention.<br>
      In the early days of digital, it occurred because the ﬁeld of type design was suddenly opened up from its turgid, closed-shop state, part of a general turmoil in the graphic arts as the masses got hold of cheap new tools.<br>
      Now, I would say it’s more because the ﬁeld has become so heavily cultivated, with every foundry ﬁlling out its repertoire of the genres, that it’s hard to be distinctive if one hoes the same rows as everyone else.</p>
      <p>Also, the mind-numbing conservatism of the post-grad type design schools must at some point couple with the  servile mentality of foundries churning out their corporate workhorses to provoke a backlash of design for the sake of it. </p>
      <p>My perspective is systems-oriented (Marxist/ecological/technological), the idea being that we don’t just create in relation to other artefacts, but also as agents operating in economic and social systems.</p>
      <p>While it may look like these types are samey, the more you look, the more you see.<br>
      For instance, one distinction is between those which are embellished with overt decoration, and others which are minimal in form, but with the elements conﬁgured in unusual ways.</p>
