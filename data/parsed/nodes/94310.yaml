    <p>Dear all,<br>
    There is a certain trend that I've noticed looking through design blogs, so called, experimental sans serifs. I noticed certain similarities in the glyphs of those typefaces and, although I can see some roots in scandinavian runes and art deco typography, I wonder where such distinct features that you can see in R's came from.<br>
    I would be grateful if anybody points my research in the right direction.</p>
