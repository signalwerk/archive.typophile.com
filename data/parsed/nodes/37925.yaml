    <p>Is it just me...</p>
    <p>I bought a book (The End of Mr. Y by Scarlett Thomas) which I’m greatly enjoying aside from one tiny annoyance - it’s set in <a class="freelinking-external" href="http://www.type.co.uk/index.php?p=a_to_z_listing&amp;let=S&amp;id=8157">Sovereign Light.</a></p>
    <p>I don’t know whether it *is* just me, or the fact I think it’s been set with kerning and leading that’s just not “quite right”, but it seems a strange choice for a novel, and one I’ve never seen before. I find the face itself quite distracting, as though it’s fighting with itself to decide what to be (“I want to be a display face! Oh, wait, no, too scary standing out, I’ll be the weird kid instead.”) if you know what I mean?</p>
    <p>No idea where I’m going with this, other than - thoughts? It *is* a good book, I’m just finding it hard going reading it. Has an interest in typography really come the point of visual aesthetics over content?</p>
    <p>I’ll go away now.. :)</p>
