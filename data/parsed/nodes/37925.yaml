      <p>I wouldn’t want to read that. You are right about Sovereign Light being too distracting; it’s just too noticeable to be a text face. I would find it extremely irritating to read for any length of time.</p>
      <p>I admit it’s a turkey - I was trying to do something different when I designed it - I don’t know what the hell I was thinking of. I quite liked it while I was working on it, but now with the benefit of hindsight, (and not seeing it for a while) I’m not keen at all!</p>
      <p>Anyway, you will not have to suffer it very often; it hardly sells any copies at all! So that’s good!</p>
      <p>I can only apologise from the bottom of my heart and promise to only design good typefaces in the future. </p>
      <p>I just Googled it - the book also uses Geetype - any adverse comments on that?</p>
      <p>Nick Cooke</p>
