    html: |-
      <p>I’m glad others feel the same here, and appreciate Steve’s comment of interfering with reader experience.</p>
      <p>Is it because as a shameless consumer of books usually set in same old same old, that it’s possible to just become habituated to what one perceives to be a “normal” typeface fit for purpose? (A point well made in the Speikerman short in regard to groceries.) And yes, what *would* you use if you were to write a novel? As a book designer do you have a solid set of guaranteed fonts you’d fall back on and run into a burning office to save?</p>
      <p>As a designer - not books may I hasten to add - I do appreciate the publishers trying something new; and as a face per se I quite like Sovereign - I just wasn’t expecting to see it there, mixed with another indented serif (I think Garamond) when Thomas switched between narration and citation.  </p>
      <p>But maybe like any new - almost rebranding I suppose - exercise should be tested out on us, the great unwashed before being released into the wild? Does such a practise exist, or is book publishing centred upon fail safes and tradition or what the design team like?</p>
