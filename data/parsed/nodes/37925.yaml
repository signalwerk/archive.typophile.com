      <p>Even an appropriate text font can be hard to read if it isn’t set well - too small, too tight, bad H&amp;Js, too close to the gutter, even no ligatures can be distracting. I read a book recently that was justified with no hyphens. Some of the word spacing was absurdly loose.</p>
      <p>But nothing more so than the problem I’m facing right now - I accidentally ordered the large print edition of a book recently from Amazon. The type is probably at least 16 or 18 points, looks like a kid’s book. But it’s making the book a real page-turner.</p>
