      <p>Tight or untight is personal preference.  Personally, I hate falling from an x-height read down into the deep chasm of a space before I hit the smooth slide across an em dash just to face another deep drop before I continue.  </p>
      <p>Each font reacts differently, so resolve comes individually for me.<br>
