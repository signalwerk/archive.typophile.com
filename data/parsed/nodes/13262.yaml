      <p>While at some level it is a matter of personal preference -- there are some common conventions that one violates at considerable risk. The British, for example, use a word-spaced en dash for the dash that signals a break in the thought within a sentence. In the States, a closed-up em dash is usually used for this purpose -- see, for example, the CHICAGO MANUAL OF STYLE.</p>
      <p>Having said that, we typically use a dash 3/4ths of an em long centered in an em space (a dash of 750 units with left &amp; right sidebeaings of 125 units with a 1,000 unit em) for the "em" dash. With really condensed fonts, I'll make the dash *about* the width of a capital M, and the sidebearings won't be 125 units. I've done this for over 10 years now, &amp; no publisher has yet complained.</p>
      <p>With en dashes -- usually used with numbers -- I'll usually make up 2 dashes, one to center up (vertically) with uppercase (lining) figures, and one to better center up with lower-case (oldstyle) numbers. Usually only one em dash, though. I suppose one could make a  slightly higher dash for capitals with OpenType fonts, just as one makes up extra parens &amp; brackets for full capitals.</p>
