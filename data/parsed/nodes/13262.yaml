      <p>CMS rules are rather strict: no spaces around any dash.  For what, you ask?  My Chicago-born copyediting girlfriend says it saves space.  Very Midwesternly efficient... and stuffy if you ask me.</p>
      <p>I've held the University of Chicago in contempt for far greater impositions, such as exporting their faculty to the Art Institute of Chicago to suck the life out of foreign cinema courses.</p>
      <p>I'm a half-space kinda guy for emdashes in text settings.  I've taken to setting my sidebearings for such a preference when desgining my typefaces.  Just my way of getting back at U of C, I guess.</p>
      <p>Raising the endash between lining numerals is a valuable lesson as well.  Thanks for advocating that one, Charles.  With Opentype, such automatic adjustments are easily within reach.</p>
