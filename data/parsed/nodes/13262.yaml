    html: <p>This used to be solved by the inclusion of 2 em dashes. There was the regular one, a full em dash on the em width, and what Merg. called a 3/4 em dash, full em width, but the dash was only 3/4 of the em with essentailly a thin built-in on either side. I think most Em dashes today are actually the old 3/4, and the authentic em is dropped.</p>
