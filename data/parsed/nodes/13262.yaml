    html: <p>Not that it's particularly relevant but, in the olden days when setting type meant staring at a stunning amber (or green) screen full of monospaced characters and trying to keep a mental picture of where you were on the page, we used to insert a thin nonbreaking space to the left, and a thin regular space to the right of an em dash. The rationale was that if the line had to break in the vicinity of the dash, it would do so after, rather than before the dash, or--if there were no spaces at all--carry the dash and the words either side of it to the next line, which sometimes made for excessive white space. Nowadays you can actually see what you're doing, so it may be a moot point, but we old-timers are inclined to spin yarns about the days of yesteryear at the least provocation.</p>
    html_clean: <p>Not that it's particularly relevant but, in the olden days when setting type meant staring at a stunning amber (or green) screen full of monospaced characters and trying to keep a mental picture of where you were on the page, we used to insert a thin nonbreaking space to the left, and a thin regular space to the right of an em dash. The rationale was that if the line had to break in the vicinity of the dash, it would do so after, rather than before the dash, or--if there were no spaces at all--carry the dash and the words either side of it to the next line, which sometimes made for excessive white space. Nowadays you can actually see what you're doing, so it may be a moot point, but we old-timers are inclined to spin yarns about the days of yesteryear at the least provocation.</p>
