  - id: 423607
    user: 14653
    date: 2010-08-04T18:38:00
    date_raw: 4 Aug 2010 — 6:38pm
    votes: null
    html: |-
      <p>Unfortunately, unless an application supports the 'ital' GSUB feature, or allows access to unencoded glyphs, the italic glyphs cannot be used. I doubt that iWorks Pages supports either.</p>
      <p>Also, while the Latin glyphs in Kozuka Mincho, including the italic forms, are Adobe Serif, they are based on specific multiple master weights and widths, and are also scaled to be slightly larger.</p>
    html_clean: |-
