    <p>I've been using Kozuka Mincho Pro recently (Latin characters only so it's a lot like using Adobe Serif) but I'm put off by the lack of italics.</p>
    <p>Can you suggest a font that looks very similar to it but also has italics?</p>
    <p>Here's what it looks like: <a href="http://cg.scs.carleton.ca/~luc/MasahikoKozuka--KozukaMinchoMedium--1997.jpg" title="http://cg.scs.carleton.ca/~luc/MasahikoKozuka--KozukaMinchoMedium--1997.jpg">http://cg.scs.carleton.ca/~luc/MasahikoKozuka--KozukaMinchoMedium--1997.jpg</a></p>
