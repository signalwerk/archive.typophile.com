  - id: 423631
    user: 16911
    date: 2010-08-05T00:45:00
    date_raw: 5 Aug 2010 — 12:45am
    votes: null
    html: "<p>Pages (and other Apple apps like TextEdit) have a pretty decent OpenType support: Open the font palette (Format &gt; Font &gt; Show Fonts — ⌘T). Open the fly-out menu that is hidden beneath the gearwheel icon, and you will find ‘Typography…’ and ‘Characters…’. The former gives you access to the OpenType features, incl. Kozuka Mincho’s italics. Via the latter, you can manually insert glyphs, incl. unencoded ones.</p>"
    html_clean: "<p>Pages (and other Apple apps like TextEdit) have a pretty decent OpenType support: Open the font palette (Format &gt; Font &gt; Show Fonts — ⌘T). Open the fly-out menu that is hidden beneath the gearwheel icon, and you will find ‘Typography…’ and ‘Characters…’. The former gives you access to the OpenType features, incl. Kozuka Mincho’s italics. Via the latter, you can manually insert glyphs, incl. unencoded ones.</p>"
