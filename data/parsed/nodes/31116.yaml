  html: |-
    <p>The College for Creative Studies (<span class="caps">CCS</span>) is an art and design school in Detroit,&nbsp;Michigan.</p>
    <p>Primarily known for it’s strong transportation and industrial design programs, <span class="caps">CCS</span> also has a strong graphic design program. Notable faculty include Doug Kisor and Susan Laporte. Along with the design studios Lust and <span class="caps">NLXL</span>, <span class="caps">CCS</span> organizes the annual DeProgram workshop in the&nbsp;Netherlands.</p>
    <p><a href="http://www.ccscad.edu" target="new">http://www.ccscad.edu</a></p>
