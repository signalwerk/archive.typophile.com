    <p>The College for Creative Studies (CCS) is an art and design school in Detroit, Michigan.</p>
    <p>Primarily known for it's strong transportation and industrial design programs, CCS also has a strong graphic design program. Notable faculty include Doug Kisor and Susan Laporte. Along with the design studios Lust and NLXL, CCS organizes the annual DeProgram workshop in the Netherlands.</p>
    <p><a href="http://www.ccscad.edu" target="new" rel="nofollow">http://www.ccscad.edu</a></p>
