    <p>Hello everybody.<br>
    I would like to ask for help, if possible.<br>
    I'm designing magazine and a logo for it, and I would really be grateful if someone can point me in right direction.</p>
    <p>As you can see, I'm not an expert in this field. I do apologize to other graphic designers who are in business for ages, and hope that my work won't be offensive to anybody.</p>
    <p>What do you think about the logo typography, if you have in mind that it will be highly commercial magazine, that contains almost none articles, but only "product placement" stuff, adds, some style and trend directions etc. It aims women between 18-35 years old.<br>
    Basicly, it is catalog wrapped as a magazine.</p>
    <p>Sorry for such a bad font page, I didn't have time to make anything nicer.</p>
    <p>Thank you in advance!<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/jpg 1_5874.jpg"></div><p></p>
