      <p>That's not a mock-up of the full cover.<br>
      You should experiment to see how the nameplate performs with different permutations of layout that include a picture and other text elements.<br>
      Worry about too little going on—a busy layout for a magazine cover is intriguing for readers.<br>
      Without multiple text elements, your publication will look more like a book or catalogue.</p>
