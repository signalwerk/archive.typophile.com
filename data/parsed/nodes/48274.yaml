  html: |-
    <p>I’m about 500 miles from home and just picked up some 48 and 60 point letters along with a monotype matrix. I’m going to have to get it home, and I don’t want to pay to mail this heavy stuff. I can put most of it in a bag and check it to get the stuff home, but I expect that the airline and the TSA will frown on me taking lead type on a plane, checked or carry-on. Does anyone have experience flying with lead type?</p>
