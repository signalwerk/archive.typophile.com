    html: <p>Me too. I want to buy it! I love the color on a page. Really inviting. <br> <br>One quibble- I miss the old Q now. I see how you have put some characters in boxes &amp; that version needs a shorter tail - but does the Regular 'Q'?  <br> <br>There is something Edward Gorey -ish about this font too. It's as if He was doing a book on being in India rather than Edwardian England.  <br> <br>I don't mean to take away from your originality at all. I love the lighthearted cheek put into the old forms with his writing &amp; with your font. It makes a page it warm &amp; human. <br> <br>Too cool. <br> <br>Could there be a font of alternates too? <br></p>
