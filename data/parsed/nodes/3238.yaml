    <p>Hello Typophiles. <br> <br>Attached is a fun side project I've had going. It a handlettered serif with gravy on top. The glyphs were drawn at 1cm high and digitized. There are some color issues with the smallcaps, but overall I was pleasantly surprised by the nice texture. If you can think of other fun addition to the set I'd love to extend it. It kinda reminds me of emigre's journal with a bit more tooth. <br> <br>Enjoy, <br>Randy <br><img src="http://www.typophile.com/forums/messages/29/26963.gif" alt=""> <br></p>
