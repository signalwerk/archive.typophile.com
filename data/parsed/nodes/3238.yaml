  - id: 25257
    user: 618
    date: 2004-03-08T05:22:00
    date_raw: 8 Mar 2004 — 5:22am
    votes: null
    html: <p>The Initial Caps and Ornaments set is what is shown at right above. The boxed initials occupy the cap spots and the regular initials occupy the lowercase spots. Both were intended to be used as drop caps it the beginning of a text (hence fitting them in a square). The un-boxed versions might do better as a swash cap set with a totally wild Q. I'll think about it. The regular Q is unchanged, not to worry. <br> <br><i>I do think you've gone a hair too far correcting the backslant - to me this face seems to want no apparent slant at all.</i> <br>I agree that it wants no slant at all. Was your observation based on looking at the paragraphs or at the detail at the bottom, or both? It was looking right to me. <br> <br><i>BTW, love them hybrid nums. </i> <br>Me too! Hybrids are in general, totally practical. They work in text, do fine tabular, great on a business card (where osf often struggle), and typographically caloused clients don't freak out the way the sometimes do over osf.  <br> <br>I think the new <a href="http://www.evolutionnyc.com/IBS/SimpleCat/Product/asp/product-id/442121.html" target="_blank">Australopithecus</a> ornament lends an especially Edward Gorey element. <br> <br>As a side note, the name Olduvai has less to do with any evolutionary interests, but more the crusty nature of the font combined with intesive immersion in <a href="http://home.thegrid.net/~lllove/otherpaleo.htm" target="_blank">The Far Side</a>. <br> <br>Cheers, <br>Randy <br> <br> </p>
    html_clean: <p>The Initial Caps and Ornaments set is what is shown at right above. The boxed initials occupy the cap spots and the regular initials occupy the lowercase spots. Both were intended to be used as drop caps it the beginning of a text (hence fitting them in a square). The un-boxed versions might do better as a swash cap set with a totally wild Q. I'll think about it. The regular Q is unchanged, not to worry. <br> <br><i>I do think you've gone a hair too far correcting the backslant - to me this face seems to want no apparent slant at all.</i> <br>I agree that it wants no slant at all. Was your observation based on looking at the paragraphs or at the detail at the bottom, or both? It was looking right to me. <br> <br><i>BTW, love them hybrid nums. </i> <br>Me too! Hybrids are in general, totally practical. They work in text, do fine tabular, great on a business card (where osf often struggle), and typographically caloused clients don't freak out the way the sometimes do over osf.  <br> <br>I think the new <a href="http://www.evolutionnyc.com/IBS/SimpleCat/Product/asp/product-id/442121.html" target="_blank" class="link-external">Australopithecus</a> ornament lends an especially Edward Gorey element. <br> <br>As a side note, the name Olduvai has less to do with any evolutionary interests, but more the crusty nature of the font combined with intesive immersion in <a href="http://home.thegrid.net/~lllove/otherpaleo.htm" target="_blank" class="link-external">The Far Side</a>. <br> <br>Cheers, <br>Randy <br> <br> </p>
