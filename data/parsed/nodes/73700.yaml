    html: |-
      <p>When the type designer did his/her work, he took decisions about kerning: if you trust him, stick to the Metrics option. I only use Optical kerning if I have two different fonts and/or very contrasting point sizes in the same line (for instance, the rare case when the first letter of the word is a Script font and the rest is set in a Roman typeface), or if the spacing and/or kerning of the font is terrible. But, if this is the case, it is better to forget it and choose another font.</p>
      <p>Now, for headlines you must check letter spacing and adjust slighty (trust in your eye, not in the Optical kerning option). That is because the type designer probably didn’t think about the particular word and the point size you are using.</p>
      <p>About justification: depends on how perfectionist you are and how much time you have. Typically, my minumum is 90% and my maximum 110%, but if I have narrow columns I allow more flexible values.</p>
