    <p>Hi everyone </p>
    <p>Could someone please explain to a soon to be first year student Graphic design when to use the optical kerning and when to use metrics (Indesign CS4)?</p>
    <p>Is it so that when using like headings it would be wise to use "optical" kerning and for plain text in small size corps to use Metrics? or does this depend on the font used?</p>
    <p>Also  how about justification function in Indesign, is there like a golden tip as to what percentage to use for word spacing (minimum, desired, maximum) someone once told me that minimum should be always at 70% and maximum at 120%, is this true? </p>
    <p>what about letter spacing? Is it better to just leave everything at default, and when do you actually change letter spacing, i never really touch the letter spacing (minimum, desired, maximum)function and leave it at 0%, thinking that the guy who designed the typeface knows best and thus i leave it at default.</p>
    <p>do you guys have like settings you almost always use?</p>
    <p>Thank you again for all the help, learning a great deal here at Typophile!</p>
