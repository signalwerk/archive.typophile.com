    html: |-
      <p>It's really close. The RUBI looks like Avenir Next with some very minor structural differences (the leg on the R starts farther out in the original and has a different angle, the curves of the U are flatter, the upper bowl on the B is shorter). What could cause that?</p>
      <p>The CON, though, looks a lot more like Myriad than Avenir, with some alteration on the C.</p>
