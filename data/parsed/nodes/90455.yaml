  html: |-
    <p>Hello All,</p>
    <p>My client, unfortunately, used an instance of Jensen MM as part of their series and now needs some extended characters that aren't available.</p>
    <p>However, when I try to open the Jensen MM font I'm getting a message saying that it contains "intermediate masters" that aren't supported by FontLab Studio. We have Fontographer 5 but that doesn't open them either.</p>
    <p>Can anyone suggest a way of generating multiple master instances that I can open in Studio?</p>
    <p>Thanks,<br>
    Ken</p>
