    html: |-
      <p>David, I think someone drew some rules on a master page so that on printouts it would be clear where the trim would be. The reason the rules appear only on certain pages is that the document uses several different master pages, and only some of them contain those rules.</p>
      <p>Find the master page(s) that contains those rules and just delete the rules. (The Pages panel will tell which master is applied to which pages.) </p>
      <p>OR, if you want to keep those rules but just don't want them to appear in PDFs, use the Layers panel to create a new layer, move those rules to that layer, and turn off that layer before making a PDF. </p>
      <p>James</p>
