  html: |-
    <p>This is a difficult thing to search for since 'line' means a number of things within the scope of InDesign and PDF.</p>
    <p><img src="/sites/default/files/old-images/Picture-3_3793.jpg"></p>
    <p>I'm talking about the small black line down the middle of each spread, and sometimes (I don't know why) outlining the entire page. Sure, I can cover them up with white lines in the master pages, but is there some way of keeping them from ever exporting?</p>
    <p>I'm using CS4. Crop marks are turned on; PDF export follows the document's 0.125-inch bleed settings. I'm exporting to Acrobat 5 by default.</p>
    <p>Thanks.</p>
