    html: |-
      <p>Without being too bold, Font Bros does . . .</p>
      <p>Our standard arrangement offers the designer 65% on BOTH the net sales amount AND any negotiated royalties . . . Many distributors drop to a 10% royalty on negotiated OEM licensing . . .</p>
      <p>In addition, any sale that comes to the Font Bros by way of a direct link from the foundry garners an additional 5% of the TOTAL sale made so for instance if somebody came from BVFonts.com, MichaelDoret.com, HaroldsFonts.com, or MS-Studio.com to purchase fonts from us, we give that foundry an additional 5% of the total sale EVEN if the customer ended up NOT buying any of their offerings specifically . . .</p>
      <p>That translates to a more than 70% royalty on every font sold through these folks and as far as I'm aware, is the best royalty offered through a 3rd party distributor . . .</p>
      <p>Stuart</p>
