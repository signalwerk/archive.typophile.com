  html: |-
    <p>Situation: purchase load of fonts, realise you can get free merchandise with Veer based on the merchandise deal at that time... DOH!!! nothing out side of North America..! eh?...  charge me the international shipping then... nope. See a merchandised product on Veer...  live outside of North America?... sorry no can do. It is not electronics or country restricted software, just shipping costs would make it expensive... then I will pay... nope.. sorry.</p>
    <p>When noticing fonts on Veer I like and as I cannot get little incentives 'like some typographically designed merchandise' I either try to find at the actual designers site (as I hope 100% of the money makes it direct to that font designer or foundry), or myfonts.com as they sometimes have little specials or I order more that Veer does not have... so Veer misses out?... </p>
    <p>I like incentives, when they are presented.</p>
    <p>Another question, what foundry or font supplier gives more of the margin to the font designer, would too prefer to support that.. I tend to go designer first, then foundry... then the myfonts, veer, fontshop etc...</p>
