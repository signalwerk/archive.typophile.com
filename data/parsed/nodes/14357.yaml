      <p>Greetings from Helsinki,</p>
      <p>Been installed in the Presedentti hotel since Monday night, and we went to see the main venue this morning. It looks great. We even got to meet the students. Peter Bilak was supposed to give a talk to the students this afternoon but had to cancel - Tiffany and myself were drafted in to fill in for him and Miss T gave a wonderful unrehearsed talk about Typophile - expect lots of hits from Finland!</p>
