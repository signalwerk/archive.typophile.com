    html: <p>Hi Dan, <br> <br>I feel compelled to give you feedback since we share the same last name. <br> <br>I think the J as it stands is interesting, but I would personally use a cross bar. The dot is a nice little quirk, but i'm not sure if it fits. Or maybe disconnect it? <br> <br>Other than that, I would consider narrowing the counter space in the 6 just a little, and possibly open up the lower counter of the 3. <br> <br>But that's just my two cents. Hope it helps. <br> <br>r.</p>
