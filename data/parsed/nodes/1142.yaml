    html: <p>Not that I have clue of what I'm talking about. But I love this font. It would be a great web font. I really like the shape of the 6 and agree with Ryan, however to me the 9 looks flat incomparison. All your straight line desenders go below the baseline, you might want consider extending the 9 or curving the tail like the six. The 8 also seems a little out of place visually to me. What about using the oval shape at the bottom and the circular shape at the top? I agree about the j. But I really love this cleanness and the funkiness of this font. I really like the simulated 3d effect it has. It appears to be jumping of the page. Let me know when it's for sale!</p>
