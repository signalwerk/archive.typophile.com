  html: <p>A few years ago, I created this "art deco" font, Blowfish.  I'm at the office right now, and just decided that I want to turn this thing into a full-character set font...  But before I do, I'd like opinions on the basic letterforms (it's mixed-case and will stay that way, at least that's how I'm envisioning it).  Here's the .gif sample.  I'm just looking for preliminary opinions, thoughts, critiques before I delve into the rest of the character set. <br> <br></p><center> <br><img src="http://www.typophile.com/forums/clipart/your_image.gif" alt="Blowfish_Sample_1"> <br></center><p></p>
