  html: |-
    <p>I am currently beginning a project to rebrand a small fine furniture business. Most of the work is high design wooden pieces, the focal point being the wood most times.</p>
    <p>That being said, we are moving away from the craft feel, to better capture the refinement of his business and convey these pieces as art, rather than craft –&nbsp;which they most certainly are!</p>
    <p>He leans towards the modernist approach, which is great as I tend to as well. However, as I have fallen behind on a lot of current faces, I thought someone may be able to recommend a few fonts that I may benefit from seeing / comparing.</p>
    <p>Probably going sans serif on this one, but was hoping for a slightly rougher / humanist sans... if there is such a thing! Trying to avoid slabs even, and a heavier weight is ideal.</p>
    <p>Thank you in advance.</p>
