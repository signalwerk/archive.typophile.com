    html: |-
      <p>Thank you all for the suggestions. I understand the question was a bit "off," and some of the responses (especially mine) reinforced that I was not sure exactly where I was headed. </p>
      <p>I guess by rough / modernist, I actually meant not flawlessly resolved. I commented on Neutra not because I thought it met these specific criteria, but because it seemed to be an alternate approach to type for this... to the rougher idea anyway. Since most of his pieces are very architectural, it seemed appropriate due to it's inspirations / style.</p>
      <p>That being said, there was one suggestion that won it for me... can't seem to locate it now, but it was the type with blown out (not sure the name, but the ink overflow allowance things for letters) but designed to extremes. That, to me read rougher, and a bit more unique in the sans world, and spoke to "process," which was my goal.</p>
      <p>In the end, all proved to scarily offensive to him to purchase, so back to working with Berthold Akzidenz... which I love, and will work, just not quite as custom. </p>
      <p>Thank you all for your suggestions, and sorry I was a bit here and there on it!</p>
