    html: |-
      <p>I think the methods for getting these numbers haven’t changed since you last brought this up, though the percentages probably have.</p>
      <p>My accurate numbers for last week:</p>
      <p>Out of a total of 6159 browser requests to a general interest site, 1439 came from Windows XP (including bots claiming that they’re on XP). Of these 1439 requests, 663 came from browsers that can display web fonts, but don't override the ClearType settings of the system. That’s 10.76 % of the total requests.</p>
      <p>In other numbers, of 129 requests to the web fonts files, 19 (14.7 %) came from browsers on Windows XP that respect the system font rendering settings.</p>
      <p>I know you asked for »how many users«, not for requests, but counting users is hard, and counting requests gives a more accurate reperesentation of real usage (think of one user using ClearType, but only reading one page vs. one user without ClearType reading 20 pages).</p>
