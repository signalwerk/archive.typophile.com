    html: <p>The W3C claims 38% of browser users are on XP. I think that we can safely assume that at least 90% of people who still use XP have no idea how to change rendering settings. Internet World Statistics estimates that there are 2,095,006,005 web users worldwide. So my guess is that at least 716,492,052 web users around the world are still on XP with default settings.</p>
