  html: |-
    <p>I'm tired of always being the cranky one, the one to point out misleading or flat-out lying XP rendering samples &amp;c and I'd really like to get all cards out: So, all ye developers, stat counters and type aficionados -- how many web users are still seeing Windows XP's default greyscale rendering? Really?</p>
    <p>I apologize for beating a dead horse. But is it dead?</p>
