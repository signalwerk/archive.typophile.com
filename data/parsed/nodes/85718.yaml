      <p>Thanks Jens. These numbers are good. I can’t help think many would upgrade beyond IE6 even though they are using other browsers. Perhaps the numbers are even better. </p>
      <p>Anyway: The last time around, the answer was close to 30 % (based on similar numbers from Wikipedia). Statistics grow more accurate with quanitity, so keep em coming.</p>
