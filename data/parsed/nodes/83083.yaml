  html: |-
    <p>Guadalupe, from the family of classic Didots. Is a high performance font, with a great set of alternates &amp; swashes. Carefully refined in details, specially suited for fashion magazines, logotypes &amp; luxury contexts. With a range of two different terminal versions; “Regular” a classic roman typeface and “Gota” much more expressive for word setting.</p>
    <p>Designed by Daniel Hernández</p>
    <p><a href="http://new.myfonts.com/fonts/latinotype/guadalupe/" rel="nofollow">new.myfonts.com/fonts/latinotype/guadalupe/</a></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/newsjune2011-3_3904.jpg"></div><p></p>
    <p>Patagon is a Contemporary Woodtype Sans typeface specially designed for fresh, high impact sentences with a mix of flavored features. Its uppercase opentype ornamental alternates glyphs provide great elegant textures adding versatility to the three weight family: condensed, regular &amp; extended. Mix them up to get really cool designs!</p>
    <p>Designed by Luciano Vergara, Miguel Hernández and Daniel Hernández</p>
    <p><a href="http://new.myfonts.com/fonts/latinotype/patagon/" rel="nofollow">new.myfonts.com/fonts/latinotype/patagon/</a></p>
