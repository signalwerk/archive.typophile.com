  - id: 1871
    user: 872
    date: 2003-06-20T10:43:00
    date_raw: 20 Jun 2003 — 10:43am
    votes: null
    html: <p>no matter what my project is, I always set up a grid to  <br>help achieve harmonious proportions. setting up a  <br>business card grid doesn't take a lot of time, so it's  <br>always worth a shot. and there's no rule that says  <br>head and foot margins should be indentical (in fact,  <br>there are many that state the opposite). <br> <br>the most important thing to remember is that a grid is a  <br>guideline. for consistancy's sake, try to be strict when  <br>there are a lot of items based on the same grid.  <br>business cards, however, aren't a widely applicable  <br>format, so following the grid exactly isn't going to do a  <br>whole lot for you. raise or drop your lowest rule as you  <br>see fit -- in the end it's the harmonious whole that  <br>matters, not your adherence to a grid.</p>
    html_clean: <p>no matter what my project is, I always set up a grid to  <br>help achieve harmonious proportions. setting up a  <br>business card grid doesn't take a lot of time, so it's  <br>always worth a shot. and there's no rule that says  <br>head and foot margins should be indentical (in fact,  <br>there are many that state the opposite). <br> <br>the most important thing to remember is that a grid is a  <br>guideline. for consistancy's sake, try to be strict when  <br>there are a lot of items based on the same grid.  <br>business cards, however, aren't a widely applicable  <br>format, so following the grid exactly isn't going to do a  <br>whole lot for you. raise or drop your lowest rule as you  <br>see fit -- in the end it's the harmonious whole that  <br>matters, not your adherence to a grid.</p>
