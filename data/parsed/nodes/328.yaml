    html: <p>Depends on the design of the business card. But basically, yeah, I work with grids on whatever project I do. I mostly start out without a grid to get the intuitive proportional feeling right and then start building a grid pattern that suits the design - in more complex Corporate Design cases there also is a special logic in the background, a kind of larger DNA of grids and patterns that connect the variuous media, so in such cases I work within the patternparametern I pre-established. Either way, it just helps organize matters and keeps the work tidy :-D. </p>
