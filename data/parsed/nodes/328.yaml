  html: <p>just wondering if most of you gridniks out there create grids to lay out your business cards? if you do maybe you can help me out. <br> <br>i'm using the dimensions 90 x 54mm for the card so that the card is subdividable by 2.25mm units, from these subdivisions i've created my typographic grid. <br> <br>my problem is that the baseline of the bottom line of type is not the same distance to the bottom edge of the card as the top line of type is from the top edge of the card. <br> <br>my question to you is, should i forgo my grid for the sake of aesthetics by moving the bottom line of type to sit the same distance from the bottom edge of the card as the type at the top sits from the top edge of the card, or should i stick with my grid and live with a little extra space at the bottom of the card. <br> <br>any suggestions appreciated. <br> <br>thanks <br>iota.</p>
