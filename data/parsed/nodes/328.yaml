    html: <p>Business cards are so small, i think that whatever aesthetically looks the best will out. I personally don't use grids for business cards. Most layouts don't have equal space top and bottom anyway. <br> <br>you might want to check the dimensions there though - and be sure it'll fit in the credit card slots in someones wallet etc, if thats what you want.</p>
