  html: |-
    <p>Hello - new to the board and looking forward to delving into it when I have some time.</p>
    <p>No excuses though - my first act is a request to identify the typeface(s) used in the attached image.</p>
    <p>A colleague of mine believes that the "Lothbury" part is a face that Marks and Spencer used to use (not Optimum - before even that), but I can only find one dodgy old photo of a label (with the old St Michael on it), which seems to bear this out. Still none the wiser.</p>
    <p>We also believe that the 41 is a different font altogether.</p>
    <p>Any help or suggestions would be gratefully received.</p>
    <p>Thank you!</p>
    <p>Andy</p>
