      <p>If the letterhead is from the 1920s or 30s it is very likely that it is engraved rather than typeset. Note the variations in letter size and details, especially the L.<br>
      Not a lot in the way of digital fonts that recreate the effect, particularly the K and S.<br>
      Some general similarity in Piranesi, designed by  Morris Fuller Benton for ATF (1930) and digitized by Bitstream:<br>
      <a href="http://www.identifont.com/show?25S" title="http://www.identifont.com/show?25S">http://www.identifont.com/show?25S</a><br>
      also Dorchester Script by Monotype (1939)<br>
      <a href="http://www.identifont.com/show?J3" title="http://www.identifont.com/show?J3">http://www.identifont.com/show?J3</a><br>
      Perhaps closer is a new design, Almibar, by  Manuel Corradine (2012)<br>
      <a href="http://www.identifont.com/show?2WQB" title="http://www.identifont.com/show?2WQB">http://www.identifont.com/show?2WQB</a><br>
      Don</p>
