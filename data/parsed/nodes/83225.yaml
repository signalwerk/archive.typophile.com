  html: |-
    <p>This is my problem:</p>
    <p>I've delivered to typefaces to the customer, who is using it in a Flash computer game. The problem is that when rendering the dynamic text in Flash, words containing the letters Æ, Ø, Å, æ, ø, å only renders these letters and the rest of the word is missing.<br>
    The weird part is that it only happens with one of the two typefaces - they say it must be something with the typeface, but I've got no idea of to what could be the cause for this... Anyone?</p>
