    html: |-
      <p>It might be A: The fonts are missing the said letters. B: Dynamic text areas in Flash relies on embedding the font (unless it’s available on the end user’s computer), which by default is just a subset of the font file to save space. Check "character embedding" on the "properties" panel (with said text area selected). </p>
      <p>Edit: Oopps, misread your post, but the embedding part might still apply.</p>
