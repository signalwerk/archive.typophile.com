    html: |-
      <p>Set your letters in words and phrases. That will help you decide if, for example, the spaces that open up with /C/J/L/T/7/ are okay, or need adjustments to fill in the blank spots (as I suspect).</p>
      <p>I think if /B/D/N/ etc. have a hard upper left corner, I would expect the same from /P/ and /R/. </p>
      <p>An asymmetrical /Y/ (with a bottom like that of /J/) could work here.</p>
      <p>I wouldn't throw out diagonals just yet, but I agree that it may be the most pressing question you have to decide. It might help with the /V/ problem you identify, and help you develop a /K/ and a more convincing /2/.</p>
