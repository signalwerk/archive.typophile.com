    html: <p>I think the X is subtly brilliant. It's a departure from the construction grid, but somehow cleaves to the spirit of the face anyway, and I think you'll find that it works surprisingly well in the context of words. V is begging for a similar treatment. Z, however, hasn't captured that essence yet. Explorations I would suggest to achieve this include pointed corners or rounded ones.</p>
