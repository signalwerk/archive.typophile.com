    html: |-
      <p>Awesome feedback! Thanks everyone! Where do I start? :)</p>
      <p>@cerulean - I agree the diagonal X, while a departure, still seems to work. I'm trying a diagonal V and X, however retained the original M and N (with some potential diagonal alternates up my sleeve). I've started the 'K' - but it's not quite there yet.</p>
      <p>@hrant - I think it it's sufficiently different from Industria. What do you think?</p>
      <p>Someone has since pointed me to another similar face, Mekanik, that has a diagonal V (but not X), together with vertical M, N- <a href="http://www.identifont.com/similar?31A" title="http://www.identifont.com/similar?31A">http://www.identifont.com/similar?31A</a> - not sure I'm into the rounded 'X' like that.</p>
      <p>@Linus - agreed the crossbars could be longer - I've already changed the '3' and will look at matching the 'F' with the 'E'</p>
      <p>@eliason - I've been playing around with a lot of words and sentences. Pretty happy with the results. I had since made some changes (based on some offline feedback), dropping the crossbars a touch, lightening the horizontals, lengthening terminals, and a much improved '7'. I think the new terminals go some way to addressing the space issues. I think I may drop the vertical arm of the '4' a touch too. I'm pretty happy with the '2'.</p>
      <p>Another thing I need to work on is compensating for the perceived smaller size of some glyphs - adjusting the baseline and heights of 'A', 'C', 'G' 'O' etc. I'm finding this quite difficult.</p>
      <p>Thanks everyone - I really appreciate all your advice. I'm on a massive learning curve!</p>
      <p>I've got a modified example here: <a href="http://finelysliced.com.au/progress/" title="http://finelysliced.com.au/progress/">http://finelysliced.com.au/progress/</a></p>
