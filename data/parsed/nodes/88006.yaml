      <p>Quite good for a simple beginning!</p>
      <p>I think you should decide if you want diagonals in your font or not.<br>
      X and Y look like they are from different fonts.</p>
      <p>My opinion is you should get rid of the diagonals.<br>
      Try to build the X with the upper part of the Y. The Z could look similar to the 2.<br>
      The (vertical) leg of the R could have a similar joining like in M.</p>
      <p>And maybe E, F and 3 could do with slightly longer crossbars.</p>
