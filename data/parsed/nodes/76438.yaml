    <p>I am sure this discussed already somewhere but I could not find it:</p>
    <p>How many hours does it take to design a standard font? On average?</p>
    <p>Let's say caps and lower case and numerals, standard punctuation and accents - the same as you would get in a 256 postscript font. Spaced kerned and basic hinting. Format can be OpenType but not with all the crazy ligatures, alt. characters and obscure accents.</p>
    <p>Did erik spiekermann once quote 120 hours?</p>
