      <p>How much does a car cost?</p>
      <p>There are too many variables involved to give a meaningful ballpark estimate. I've seen posts in this forum stating that upwards of eight hundred hours were involved with the creation of one font. On the other hand, I have managed to knock out a few with complete Latin 1252 and CE 1250 character sets in less than twelve hours each, including hand-kerning each and every possible letter combination. It all depends: Tata Nano or Maybach?</p>
