      <p>In another thread today I said one could set just about any text (I’m speaking of body text as in a book) in a good cut of Baskerville. Interestingly, although I have a licence for Storm’s version, I’ve never actually used it, believing I could pick a typeface that exactly suited the purpose (Baskerville is comparatively wide, too, and economy is often an issue). Here’s what I’ve used over the years for setting books, and was happy with the results (in order of most to least used):</p>
      <p>Filosofia<br>
      Tyrnavia<br>
      Minion<br>
      Bembo<br>
      Fournier<br>
      Eplica<br>
      Elysium<br>
      Relato<br>
      Caslon (Berthold and Adobe)<br>
      Adobe Garamond<br>
      Centaur<br>
      Adobe Jenson<br>
      Warnock<br>
      Goudy Old Style</p>
      <p>Myriad is the sans serif I use almost exclusively, mainly for labels on maps and diagrams and occasionally for photo captions (I’m not a big sans fan).</p>
