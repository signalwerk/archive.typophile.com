      <p>In general I’m down on the classics, but have to admit that I’ve used them all at one point or other — so I shouldn’t begrudge others having their fling. I even became quite cosy with Helvetica for a while in the mid ’80s. </p>
      <p>In some ways it’s like the repertoire of classical music. There was one pianist who was 30ish, and “saving Beethoven for later” (maybe I got the instrument and the composer wrong, but you get the idea).</p>
      <p>From a type designer’s perspective, many of us take a crack at the classics, doing “our” version of Jenson or whatever. Jenson, Bodoni, Garamond — those seem to be the “essentials” for reviving, and for using no doubt. So I would say, if you’re going to get involved with one of those hoary old faces, why not work with a few variations — including present day interpretations — to really get the feel of the thing.</p>
    html_clean: |-
      <p>In general I’m down on the classics, but have to admit that I’ve used them all at one point or other — so I shouldn’t begrudge others having their fling. I even became quite cosy with Helvetica for a while in the mid ’80s. </p>
