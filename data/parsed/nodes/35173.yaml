      <p>This is always a fun question to answer because whatever I put down now, I’ll most certainly skoff at in the not too distant future. I look back on work that I did 5 years ago and wonder what I was thinking when I picked some of the faces I used. (Be it financial limitations, skill or understanding.)</p>
      <p>So, I’ll go with a few that I enjoy using more often than others (as of late):</p>
      <p>1. Meta<br>
      2. Emigre’s Brothers<br>
      3. Helvetica<br>
      4. Myriad Pro<br>
      5. Farnham</p>
      <p>I don’t use very many serifed fonts. Mainly because I don’t feel confident in picking them.</p>
