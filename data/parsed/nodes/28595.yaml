    <p>I make logos. A potential client of mine has a logo that has been 'designed' this way:</p>
    <p>1.<br>
    Write the company's name in Argo</p>
    <p>2.<br>
    Scale the result 200% horizontally</p>
    <p>3.<br>
    Throw away the dot over i, or crop the ascenders, or both</p>
    <p>4.<br>
    Voila!</p>
    <p>A logo like this may seem trendy at first (to some people), but 10 years after, it is hopelessly outdated.</p>
    <p>Could you please tell me (I am gathering ammo for the designer/client meeting): when did we first see these examples of bad typography? Must have been in early 90s or what?</p>
    <p>--<br>
    sorenolsen<br>
    denmark</p>
    <p>of all the fishes in the sea<br>
    the little mermaid is one for me</p>
