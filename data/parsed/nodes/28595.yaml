      <p>I want to stress that I am not necessaryly against horizontal scaling of type ... but if you design a logo you have to analyze your client's present situation, the desired goal and how to get there - and _then_ you design a logo. If you skip the analysis, and just scale a word 200 percent and crop the ascenders and call that logo design, that is wrong.</p>
      <p>--<br>
      soren olsen</p>
