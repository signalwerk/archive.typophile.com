    html: |-
      <p><em>when did we first see these examples of bad typography</em></p>
      <p>Progress is often the result of incorporating "mistakes", which are made possible by new technology, into the canon.<br>
      That is where the paragraph indent came from, to go way back in time.<br>
      Negative leading and fitting of text in the 1970s were made possible by photosetting.<br>
      Scaling distorion is a desktop-publishing phenomenon, because it's easy for computer-using designers entrusted with typography to "squeeze to fit". And hey, it looks new, different, and interesting -- or at least it did 15 years ago, if you didn't find it horrifying.</p>
      <p>But perhaps your client is into a retro-vernacular-1991 kind of thing?</p>
      <p>"Ransom Note" typography was popularized by Jamie Reid in his designs for the Sex Pistols in 1977, and used by Neville Brody in The Face magazine (before he designed his own typefaces).</p>
