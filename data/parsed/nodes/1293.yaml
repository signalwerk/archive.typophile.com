  html: "<p>The fonts I'm after are quite commonly seen, so I'm sure someone will know what they are ?! I've got a couple of fairly close examples, but I'd like to get the real thing if I could. <br> <br>The first two I'm after are the ones found on vintage travel posters like this one : <br> <br><a href=\"http://imagecache2.allposters.com/images/PIN/VNT16.jpg\" target=\"_blank\">http://imagecache2.allposters.com/images/PIN/VNT16.jpg</a> <br> <br>The orange font - is that the font I've seen that's called simply 'Art Deco', or does anything know of anything very similar (particularly if free !). Also, anyone know what the white *'Monte Carlo Superieur'* font is ? <br> <br>The third, 1930s font I'd like is the one seen, again on posters, but in particular British travel ones including British Rail. It's on these two posters : <br> <br><a href=\"http://imagecache2.allposters.com/images/AWI/AW1160.jpg\" target=\"_blank\">http://imagecache2.allposters.com/images/AWI/AW1160.jpg</a> <br> <br><a href=\"http://imagecache2.allposters.com/images/VIS/v202.jpg\" target=\"_blank\">http://imagecache2.allposters.com/images/VIS/v202.jpg</a> <br> <br>This font looks so simple - could it possibly just be arial or something ? Any advice on achieving this ? <br> <br>Cheers</p>"
  html_clean: "<p>The fonts I'm after are quite commonly seen, so I'm sure someone will know what they are ?! I've got a couple of fairly close examples, but I'd like to get the real thing if I could. <br> <br>The first two I'm after are the ones found on vintage travel posters like this one : <br> <br><a href=\"http://imagecache2.allposters.com/images/PIN/VNT16.jpg\" target=\"_blank\">http://imagecache2.allposters.com/images/PIN/VNT16.jpg</a> <br> <br>The orange font - is that the font I've seen that's called simply 'Art Deco', or does anything know of anything very similar (particularly if free !). Also, anyone know what the white *'Monte Carlo Superieur'* font is ? <br> <br>The third, 1930s font I'd like is the one seen, again on posters, but in particular British travel ones including British Rail. It's on these two posters : <br> <br><a href=\"http://imagecache2.allposters.com/images/AWI/AW1160.jpg\" target=\"_blank\">http://imagecache2.allposters.com/images/AWI/AW1160.jpg</a> <br> <br><a href=\"http://imagecache2.allposters.com/images/VIS/v202.jpg\" target=\"_blank\">http://imagecache2.allposters.com/images/VIS/v202.jpg</a> <br> <br>This font looks so simple - could it possibly just be arial or something ? Any advice on achieving this ? <br> <br>Cheers</p>"
