  html: <p>Neville Brody, who designed Insignia, also designed a similar family of fonts for FontShop called <a href="http://www.myfonts.com/fonts/fontfont/ff-typeface-6-and-7/" target="_blank">FF Typeface 6&amp;7</a> that comes in 3 weights. <br> <br>As for italics, you can always make an oblique (slanted) version using your style menu, or  the 'shear' function in a graphics application, like Illustrator.</p>
  html_clean: <p>Neville Brody, who designed Insignia, also designed a similar family of fonts for FontShop called <a href="http://www.myfonts.com/fonts/fontfont/ff-typeface-6-and-7/" target="_blank" class="link-external">FF Typeface 6&amp;7</a> that comes in 3 weights. <br> <br>As for italics, you can always make an oblique (slanted) version using your style menu, or  the 'shear' function in a graphics application, like Illustrator.</p>
