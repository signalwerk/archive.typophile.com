    <p>G'day Philers,</p>
    <p>I'm working on a logotype for Quakers Australia in part by customizing an exisiting typeface. I'm trying to make it gentler and finer.</p>
    <p>Firstly: Is it OK to customize letterforms this much? Am I treading in murky water licensing/copyright wise?</p>
    <p>Secondly: What do you think of the changes? does it look strange? do the thin strokes look like they belong with the thicks? Is there anything that really clangs? Should I abandon my efforts and go with the original typeface?<br>
    Note: This is not a stand-alone word-mark, it has a device to go with it, so it doesn't so much need to be strong in that sense.</p>
    <p>Sorry my questions aren't more intelligent, I guess I am looking for first impressions, state the obvious kind of stuff, I am not experienced at this by any means. Any help would be greatly appreciated,<br>
    thankyou</p>
    <p><a href="http://home.iprimus.com.au/nkgross/quakers_2.png" rel="nofollow"> here it is </a></p>
    <p>--N</p>
