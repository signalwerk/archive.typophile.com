    <p>I am looking for a sans serif font that would pair well with a Soho Gothic bold logo. It's for a small marketing services agency. They're innovative, modern, fun and young.</p>
    <p><a href="http://www.fontshop.com/fonts/downloads/monotype/soho_gothic_pro_bold/">http://www.fontshop.com/fonts/downloads/monotype/soho_gothic_pro_bold/</a></p>
    <p>Can anyone suggest a sans serif font that would pair well with it when used for text? I found that for large bodies of text, Soho Gothic is not the most readable font.</p>
    <p>Thanks for the help!</p>
