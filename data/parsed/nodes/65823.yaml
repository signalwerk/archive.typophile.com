      <p><a href="http://www.germantype.com/cms/front_content.php?idcat=193" title="http://www.germantype.com/cms/front_content.php?idcat=193">http://www.germantype.com/cms/front_content.php?idcat=193</a></p>
      <p>\D0 results in an Eth, but not in an endash.</p>
      <p>This is from the FontLab manual:<br>
      To add a new name record, click on the button on a toolbar, select<br>
      name record options using the controls below the list and type in the name record content. To enter non-ANSI characters use “\[unicode index]” or “\[code]” notation where [unicode index] is the Unicode index of the character if the name record is for the Unicode (0 or 1) platform and [code] is the character code in the Mac Roman codepage if the name record is for the Macintosh platform. For example you may enter “\0411” for the Cyrillic “beh”.</p>
