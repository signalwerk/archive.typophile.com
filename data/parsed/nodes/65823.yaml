  html: |-
    <p>Platform 1Macintosh Encoding 0Roman Language 0English</p>
    <p>How to I have to type in/encode the following characters, or is it unpossible to use them there?:<br>
    EnDash, CopyrightSign, Trademark, LeftSingleQuotationMark and RightSingleQuotationMark</p>
    <p>For the Microsoft platform it is easy:<br>
    EnDash\2013, CopyrightSign\00A9, Trademark\2122, LeftSingleQuotationMark\2018 and RightSingleQuotationMark\2019</p>
