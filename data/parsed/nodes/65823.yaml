    html: "<p><code>[\\D0, \\A9, \\AA, \\D4, \\D5] results in [–, ©, ™, ‘, ’]</code>, when I open the generated Font in FontLab. Before it is generated<br>

      <code>[\\D0, \\A9, \\AA, \\D4, \\D5] is interpreted in this way: Ð, ©, ª, Ô, Õ</code></p>

      <p>(When I decompile the name table with ttx, I get this: <code>     &amp; #208;, &amp; #169;, &amp; #170;, &amp; #212;, &amp; #213;<br>

      </code>)</p>

      <p>But if I want to preserve the characters, when I regenerate the font, I have to insert [\\D0, \\A9, \\AA, \\D4, \\D5] again. Otherwise I get this: <code>\x13, ©, \", \x18, \x19 (&amp; #19;, &amp; #169;, \", &amp; #24;, &amp; #25;)</code>. Either FontLab does not generate the code correctly or it does not interpret the code correctly, when it imports the name table.</p>"
