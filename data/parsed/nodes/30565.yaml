    <p>I need some help. First some background: This logo is for an apartment building. My client renovated an old brick building with a crown on the top. They added two stories on top of this that look more modern. I used the contrast between the two as the idea for the logo. </p>
    <p>I think its working very well, but unfortunately I am having a disagreement with my client. They want me to include the two lines (see the gif) around the star. The lines came from an earlier version of the logo that included other details of the window. It worked better in that version, but is not working for me in this more simplified version.</p>
    <p>My client wants to include the lines because they didn't think the other version looked enough like a window. I am trying to convince them we don't have to be so literal. It's not a window, its a logo that took some inspiration from a window. I think the lines are ugly, unnecessary, and distracting. How can I convince my client to lose them? Or do you disagree?</p>
    <p>Please help.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/NSaSF_6257.gif"></div><p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/NSbuilding_5719.jpg"></div><p></p>
