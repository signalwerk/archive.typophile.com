      <p>Hi guys, I've been out of town for a couple of days. It's nice to see that there has been some continued discussion in my absence. I really appreciate all of your input.</p>
      <p>The baseline issue that was first pointed out by kco was an error on my part. Not sure how it happened, but I have fixed it now.</p>
      <p>I have tried some of the ideas that have been posted and you can see some of the results for yourselves below.</p>
      <p>I tried arching the negative space between the top and bottom of the N and it's not working for me. It detracts from the original concept and I don't plan on pursuing this option any further.</p>
      <p>2B shows a taller version of the logo, while 2A maintains the original proportions for comparison. To me this does not appear to make it look any less like a tombstone, but I would like to hear some other opinions on this point.</p>
      <p>&gt; If it’s not to be recognizable as a window, then why are there so many details on the shape. Or why is it there in general? Why is it not a square or some other shape?</p>
      <p>When I was considering what shapes I could use, I wanted the shape to reflect the architecture of the building. The windows were a fairly distinct feature of the building, and they have the added bonus of naturally framing the star at the top.</p>
      <p>I did consider using a square as well, but I wasn't sure how to integrate the star. 3B shows the N in a square without the star. I think it works pretty well, but my client has been very insistent upon including the star and I don't think I could convince them against that. And I like that star anyway.</p>
      <p>In earlier versions of the window shape, I did not include the flared top or the lip at the bottom. The lip at the bottom helps integrate the shape with the type and makes it feel more grounded. Both the lip and the flare at the top also serve to give it a little more of the character of the building. I am really just trying to take some visual cues from the building without being too literal about it.</p>
      <p>&gt; The solution: give us a solution that satisfies both your client and yourself. This only means you need to pull this logo a notch up! Don’t give up, it’s looking good.</p>
      <p>Good advice, and thanks for the encouragement. Based on the feedback here, I'm thinking I may need the lines after all. I guess it may need to be recognizable as a window, just so it's not mistaken for a tombstone (good call aluminum).</p>
      <p>Tomorrow I am going to try varying the line weight a bit so they taper out and see if it makes them any more palatable for me.</p>
      <p>Thanks again guys, I'll keep you posted.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/NSvar_5064.gif"></div><p></p>
