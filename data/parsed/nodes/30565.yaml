      <p>If it’s not to be recognizable as a window, then why are there so many details on the shape. Or why is it there in general? Why is it not a square or some other shape?. If you decide to keep it I agree with the lines. Give us a bit more hint of what it is so we don’t think it’s a tombstone. Plus I see you’re taking that shape from the windows of the building and they are much taller in the picture.<br>
