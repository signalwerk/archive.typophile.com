    html: |-
      <p>a bit embarrassed.<br>
      when looking for the right font, i started with itc bookman which has listed swashed letters as an extra font. so when i moved on to others and finally the most matching: bookmania, i didn't check the glyph-catalogue but supposed that swashed letter would be extra as well!…</p>
      <p>bookmania is the closest digitized even though swashes are a bit off… needs a bit of tweaking and PS.<br>
      the original font i suppose will remain unknown?!</p>
      <p>as a little atonement: a typophil picture-riddle<br>
      where's the (hilarious) mistake in below hmv cover?</p>
      <p>enjoy!</p><div class="imageWrap"><img src="http://typophile.com/files/2222_4258.jpg"></div><p></p>
