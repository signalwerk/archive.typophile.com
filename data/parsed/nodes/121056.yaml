    <p>another mornin' - another show!</p>
    <p>it's not that i am suddenly turned lazy - it's just that i need an expert eye…<br>
    …but see for yourself:</p>
    <p>i would say the top headline is a bookman font; the one closest is bookmania semi.<br>
    i cannot however find the fitting swashy letters.<br>
    bottom line looks more like a condensed bookman, also with swashes - pls note the steep capital_r; the stroke of the top swashes is going a bit upwards (just as in above line)</p>
    <p>cover made in gb '65</p>
    <p>(resource probably a scan with minimal distortion)</p>
    <p>good luck!</p><div class="imageWrap"><img src="http://typophile.com/files/1111_4491.JPG"></div><p></p>
