    html: |-
      <p>Confirming Bookman. Quoting MF description text: "Bookmania (2011) is a revival of Bookman Oldstyle (1901) and the Bookmans of the 1960s, but with all the features you would expect in a modern digital font family." Don't know any other version of Bookman available with such an amount of alternate glyphs: /<a class="freelinking external" href="http://www.myfonts.com/fonts/marksimonson/bookmania/semibold/glyphs.html#glyphs/519883/547" rel="nofollow">B</a>, /<a class="freelinking external" href="http://www.myfonts.com/fonts/marksimonson/bookmania/semibold/glyphs.html#glyphs/519883/1653" rel="nofollow">k</a>, /<a class="freelinking external" href="http://www.myfonts.com/fonts/marksimonson/bookmania/semibold/glyphs.html#glyphs/519883/1789" rel="nofollow">r</a>, /<a class="freelinking external" href="http://www.myfonts.com/fonts/marksimonson/bookmania/semibold/glyphs.html#glyphs/519883/1965" rel="nofollow">y</a> and /<a class="freelinking external" href="http://www.myfonts.com/fonts/marksimonson/bookmania/semibold/glyphs.html#glyphs/519883/279" rel="nofollow">A</a> for your sample<br>
      Baseline is also Bookman. My suggestion would probably to keep Bookmania scaling it to match the lettering using /<a class="freelinking external" href="http://www.myfonts.com/fonts/marksimonson/bookmania/semibold/glyphs.html#glyphs/519883/775" rel="nofollow">K</a>, /<a class="freelinking external" href="http://www.myfonts.com/fonts/marksimonson/bookmania/semibold/glyphs.html#glyphs/519883/917" rel="nofollow">N</a>, /<a class="freelinking external" href="http://www.myfonts.com/fonts/marksimonson/bookmania/semibold/glyphs.html#glyphs/519883/1041" rel="nofollow">P</a> and /<a class="freelinking external" href="http://www.myfonts.com/fonts/marksimonson/bookmania/semibold/glyphs.html#glyphs/519883/1050" rel="nofollow">R</a> alternate glyphs.</p>
