    <p>I have posted here before and received some great help; I am in web design — not print / graphic, so I know I need your help.  I appreciate the help some of you gave me in making my web co. logo in the past.</p>
    <p>I am at the very beginning and have just made some sketch concepts - concepts only!</p>
    <p>The logo is for a business for medical professionals involved in real estate transactions.  A good friend of mine asked me to create the logo as quickly as I can, and I keep getting stuck at the very beginning with how to incorporate the stethoscope with the house.  Those are the two things the company wants included on the logo, placing the steth on the house.  I know the stethoscopes look bad - I just freehanded it fast.</p>
    <p>The stethoscope is supposed to read “y”  Do you see that or have to look for it?</p>
    <p>I also considered not using caps, but I feel that it needs to be stronger because it is a real estate company.  Any tips for typeface?</p>
    <p>Thank you for your help and time.</p>
