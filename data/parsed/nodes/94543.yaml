    html: |-
      <p>No, I do not speak Telugu. I understand how the writing system works, and can tell from examining what happens as a result of particular layout engines and fonts what is being done technically, which was the point of this analysis. I didn't design either of the Telugu types shown, although I built the one that implements 'tel2' shaping that fails in CS6 (that font looks very much better in Win8, for which it was designed and in which the correct shaping is applied; it is a UI font, though, subject to a large number of technical restrictions that forced design compromises; a good text face would not be subject to the same constraints).</p>
      <p>The '---2' are not the old ones; they're the new ones. I don't know why CS6 uses the old shaping tags for most scripts. I believe the new '---2' tags is used for Devanagari because Adobe had their own 'dev2' Devanagari font, developed several years ago, and the ---2' tags for Odia and Malayalam are presumably used because, to my knowledge, no one ever shipped a shaping engine that used the old tags for those scripts. In other words, the old Odia and Malayalam shaping was defined by Microsoft but superseded by the new shaping before it was implemented anywhere.</p>
