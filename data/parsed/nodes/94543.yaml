    html: |-
      <p>Good, if odd, news:</p>
      <p>Paul Hunt reported today that Malayalam chillu formation using the 'mlm2' script tag does work in InDesign CS6 <em>if the Malayalam language setting is applied to the text from the dropdown dictionary list</em>. I am able to confirm that this is true, so Malayalam support in ID CS6 seems to be complete with that caveat.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/mlm2cs6_6112.png"></div><p></p>
      <p>It's odd because chillu formation would seem to me to be a script shaping issue, not language-specific, and in any case the test font contains only 'dflt' language system tag. I don't understand why all aspects of Malayalam shaping other than chillus happen correctly without the language needing to be set.</p>
