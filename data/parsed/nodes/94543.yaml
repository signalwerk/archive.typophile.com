  - id: 521968
    user: 1133
    date: 2012-09-12T03:49:00
    date_raw: 12 Sep 2012 — 3:49am
    votes: null
    html: |-
      <p>David, </p>
      <p>MetaDesign Solutions who developed Indic Plus say that from version CS4 onwards, that plugin exposes InDesign's built-in World-Ready composer rather than relying on MetaDesign's own composer. MetaDesign's own composer which was used in CS2 and CS3 was built upon ICU Layout, so it only used the old script tags. The World-Ready composer seems to do the same. </p>
      <p>Other solutions such as InTools' World Tools Pro or Winsoft's ScribeDoor also "only" expose the World-Ready composer (World Tools Pro in addition exposes the Japanese composer). To my knowledge, no custom composer exists for the most recent versions of InDesign. </p>
      <p>However, given that MetaDesign Solutions had developed their own composer in the past, I think they'd be the right place to send your concerns. You might convince them that it'd make sense for them to continue developing their own composer. They might consider switching from ICU Layout to HarfBuzz, though. Then, they'd get the most current support. Alternatively, they might also consider developing a composer for InDesign for Windows only, which would use the system Uniscribe library. </p>
      <p>Whether such development could gather sufficient critical mass of potential customers so that it'd make business sense for somebody like MetaDesign Solutions to actually do it -- is another matter. </p>
      <p>Perhaps Tiro Typeworks should just comission MetaDesign Solutions to do one of the options above, and market the plugins as Tiro. You could get some custom features in, then. You might even get them to port the XeTeX "MATH" engine to an InDesign plugin, effectively enabling OpenType MATH support in InDesign. (Oh, you could also get them to support JSTF, and a few other things... :) ). </p>
      <p>Best,<br>
      Adam</p>
