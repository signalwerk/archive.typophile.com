    html: |-
      <p>It might just be me, but there's something awkward and unstable about the whole font. A few things I'm noticing:</p>
      <p>1. /s/ looks like it's leaning to the left</p>
      <p>2. /e/ looks like it's leaning to the right when next to certain letters</p>
      <p>3. /t/ leaning to the right</p>
      <p>4. terminals of several letters appear too wide and "chunky" (maybe that's what you're going for though)</p>
      <p>5. Shoulders of /n/ and /m/ appear to slope too sharply</p>
      <p>I'm no type designer, so take my advice with a grain of salt, unless some more credible reinforcement comes along.</p>
    html_clean: |-
