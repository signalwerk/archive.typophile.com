      <p>Brockman’s points may be pres-postscript, but it shouldn’t matter. Even if the point sizes are different, the proportions should stay the same as long as Mark is just using points/picas for everthing and not converting it all to some other units.</p>
      <p>Mark, do you have text set to align to the baseline grid in the document? If you accidentally turned the baseline grid on, and only for  some of the text, that could keep things from aligning.</p>
