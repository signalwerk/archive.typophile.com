      <p>1. It depends, but generally this is how it’s done. That doesn’t mean that there’s anything wrong with text not aligning to a common baseline, but doing so can make a layout seem less ordered.</p>
      <p>2. 24 points of leading in indesign should be the same as 20 points type with 4 points of leading. If things don’t look exactly the same it may be because you’re using digital revivals of the fonts, and they may not have the same proportions.</p>
      <p>3. That’s up to the designer, but again, that’s how it’s usually done.</p>
      <p>4. There are plenty of forumlae for page margins, you should be able to find several in any book of typography. In the end the size of margins will be driven by a lot of factors, including paper budget.</p>
      <p>5. Maybe. If you really don’t think you understand indesign, put Muller-Brockman aside and read an indesign manual first.</p>
