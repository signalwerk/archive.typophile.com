      <p>It's hard to diagnose your specific problems without seeing examples, but the vertical spacing you mentioned sounds about right. Using 20pt type and adding 4pts of lead (as in physical strips of lead) would equal a total vertical line height of 24pt. This is usually written 20pt/24pt and spoken 20 <em>over</em> 24.</p>
      <p>Much of what you're asking is, in the end, subjective.  I know designers who prefer to laterally line up with the x-height of letters rather than the cap height. And some of my teachers who studied under Müller-Brockmann point out that he often used blindingly tight leading on <a href="http://www.internationalposter.com/artpick.cfm?SortResults=Title&amp;ArtistNumber=450&amp;ArtistName=Josef+Mueller-Brockmann&amp;ResultsFormat=thumbnail&amp;ShowPosters=Show+Posters" rel="nofollow">his posters</a>.</p>
      <p>I suggest that you play around with the numbers until it feels right to you.</p>
