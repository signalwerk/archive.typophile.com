    <p>Which font is this Italic:</p>
    <p><a href="http://www.sanskritweb.net/fontdocs/zigabonus-italic.jpg" title="http://www.sanskritweb.net/fontdocs/zigabonus-italic.jpg">http://www.sanskritweb.net/fontdocs/zigabonus-italic.jpg</a></p>
    <p>Which font is this Roman:</p>
    <p><a href="http://www.sanskritweb.net/fontdocs/zigabonus-roman.jpg" title="http://www.sanskritweb.net/fontdocs/zigabonus-roman.jpg">http://www.sanskritweb.net/fontdocs/zigabonus-roman.jpg</a></p>
    <p>These 2 fonts were used for typesetting a commentary to the epistles.</p>
    <p>For full bibliography see <a href="http://library.brown.edu/find/Record/b1875141" title="http://library.brown.edu/find/Record/b1875141">http://library.brown.edu/find/Record/b1875141</a></p>
    <p>The commentary was printed in 1544 in Lovanium (Leuven, Netherlands).</p>
    <p>I own a copy of this 603-page huge commentary book bound in parchment.</p>
