    html: |-
      <p>If you update that cart with 1 computer selected, you'll be told: </p>
      <p>Neue Haas Grotesk is not available as a 1 computer license. Please select a different license.</p>
      <p>FontBureau confirmed that with me via Twitter, that their contract specifies no 1-user license.  I could handle $616 for one user, but forcing someone to pick the 2-5 user license is crazy.</p>
      <p>And I guess I don't see why these updates (or revivals, or whatever) are so expensive. Even if it took a ton of time to prepare it, you're still basing it off someone else's design that's readily available, even if the current versions are slightly imperfect. Plus, the high-end font market already has Activ Grotesk and other recent revivals. I fail to understand how this 22-weight family (especially considering 6 are just text versions of the display weights) could be considered more versatile or more valuable than some of the ones I listed above, or hundreds of other typefaces.</p>
      <p>I think they're assuming that people buying with a 1-user license will probably break that license and use it/share it with more computers. So they're just jacking up the starting price and using the 2-5 user license to justify it.</p>
      <p>Also, I updated that MyFonts list to show just how far $1232 could go for a freelancer like me. I prepared it pretty hastily, but the point is the same.</p>
