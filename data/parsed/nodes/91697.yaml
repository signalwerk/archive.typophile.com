      <p>Hello Nikabrik, I can try to explain, at least the pricing part.</p>
      <p>I guess Neue Haas Grotesk is supposed to be sold for the same price on both websites. The basic end user license from Linotype is usually for 1–5 computers = $54 for a standard font and $65 for the pro version. Font Bureau’s webshop though is set-up for their own standard licensing model, which only knows licenses for either one computer at $40 or 2–5 as the next tier. They are probably not allowed to sell it under $54 a style, thus you cannot select the 1-only license but have to chose 2–5. I heard they are currently working on changing it so the price for 2–5 will be the same as 1–5 at Linotype. If you want the fonts urgently, maybe just give them a call.</p>
