      <p>I guess I'm an idiot then, I didn't know Linotype sold single-user licenses of the same font. I guess that begs the question of why Font Bureau is selling it and promoting it like they are, but it doesn't matter really.</p>
      <p>As for why I posted this? Well it's the sort of thing I'd like to buy, yeah. But I don't NEED it, as I've already got Helvetica Neue (plus the mac-native Helvetica).  So when I'm making another font purchase, I usually tend to get something that's going to broaden my palette a little bit.</p>
      <p>And even if I wanted to use it in a project and bill the client, it'd be hard to justify it to them... "yes, I know you've got Arial and Helvetica on your computer, and they look practically identical to this, but it's really worth it for the alternate capital R."</p>
      <p>I think it's the forced 2-5 user license that bothers me about this. It's like they're explicitly saying that they're aiming at in-house designers and design agencies. Which is fine I guess, it just seems discriminatory.  That or they're trying to compensate for piracy somehow... but that's being declared guilty without a chance to prove your innocence.</p>
      <p>What if Adobe eleminiated the 1-user license and started their pricing at two copies of CS6... people would be PISSED.</p>
