      <p>"I guess I'm an idiot then, I didn't know Linotype sold single-user licenses of the same font."</p>
      <p>I think you are just early. FB periodically develops and co-develops fonts from the Linotype library under agreement with Linotype, and with other type designers. This particular design and licensing development took some time to create, and I'm delighted to hear that you found the licensing you were originally looking for. </p>
      <p>As for need for this family at all, I understand that most designers seek things extra-Helvetican to purchase their lifetime rights to. I hope you appreciate that there are others, from designers to large corporations, who seek the densest possible array of choices when it comes to this area of type designs.</p>
      <p>Whether this is the best of them or not is beyond my simple sheep-herding tongue, though I do remember being asked for it quite regularly since the release of Fontographer 1.0.</p>
      <p>Finally, on the need for text and display versions, a lot of people understand that a single version of some glyphs, like the bold M in this case, are doomed to mediocrity when only offered once for all sizes of use.</p>
