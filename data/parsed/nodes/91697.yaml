    <p>Well, Font Bureau has just released their update of Neue Haas Grotesk, as updated by Christian Schwartz.</p>
    <p>Specimen page: <a href="http://www.fontbureau.com/fonts/NeueHaasGrotesk/" title="http://www.fontbureau.com/fonts/NeueHaasGrotesk/">http://www.fontbureau.com/fonts/NeueHaasGrotesk/</a><br>
    Mini-site: <a href="http://www.fontbureau.com/nhg/" title="http://www.fontbureau.com/nhg/">http://www.fontbureau.com/nhg/</a></p>
    <p>Looks great, right? Well you better hope you work for an agency or something, because there's no 1-user license. The complete font of 22 styles starts at 2-5, for the low low price of $1232.  Even if you want to buy individual weights, you have to buy a 2-5 user license, so that's $80 each.</p>
    <p>Can somebody please explain to me why this update to Helvetica is worth that much? Especially when that $1200 could get me ...</p>
    <p>This Air superfamily of 81 weights ($999): <a href="http://www.myfonts.com/fonts/positype/air/" title="http://www.myfonts.com/fonts/positype/air/">http://www.myfonts.com/fonts/positype/air/</a><br>
    All 64 weights of Gotham ($1196): <a href="http://www.typography.com/fonts/font_styles.php?productLineID=100008" title="http://www.typography.com/fonts/font_styles.php?productLineID=100008">http://www.typography.com/fonts/font_styles.php?productLineID=100008</a><br>
    All 32 weights of Knockout ($799): <a href="http://www.typography.com/fonts/font_styles.php?productLineID=100013" title="http://www.typography.com/fonts/font_styles.php?productLineID=100013">http://www.typography.com/fonts/font_styles.php?productLineID=100013</a><br>
    ALL FIVE FONT FAMILIES IN THIS LIST ($1277): <a href="http://www.myfonts.com/users/gikrs2alzi/albums/603578/" title="http://www.myfonts.com/users/gikrs2alzi/albums/603578/">http://www.myfonts.com/users/gikrs2alzi/albums/603578/</a></p>
    <p>I just don't get it.</p>
