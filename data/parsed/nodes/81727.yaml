      <p>&gt; One of the requirements of the project<br>
      &gt; is that it work well on a waistband.<br>
      &gt; I took this to mean that...</p>
      <p>Your guess about what they meant sounds reasonable, but just the same it might be wise to ask them to explain further exactly what they meant.  </p>
      <p>Many times I've tried to guess what a client meant by a vague comment, only to find out later that they meant something else. Sometimes this is because a client is so familiar with their company's product that they tend to talk in verbal shorthand and just assume everyone knows what they're talking about.</p>
