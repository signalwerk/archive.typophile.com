      <p>Good call on the R! That's a great refinement (for what is probably a common blunder). I also increased the thickness of the bottom of the E, ever so slightly to give it a more solid feeling base.</p>
      <p>I'm not sure about the asymmetrical T, though. I gave it a shot, but I don't know that it adds that much. Performing that little experiment did, however, lead me to realize that my original T was too narrow. I definitely prefer it wider.</p>
