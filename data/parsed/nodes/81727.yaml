    html: |-
      <p>Okay, so I've attempted to implement a few more suggestions here to see how they work.</p>
      <p>First off, I increased the contrast of the X in an attempt to keep the same overall design, but make in feel like it has similar thick/thin proportions to the rest of the font, without actually making one stroke lighter. It seems like it might be a tad to heavy now, but correct me if I'm wrong.</p>
      <p>Next, I tried incorporating the "wedge" idea further, but without radically changing the design. The R seems like a logical place.</p>
      <p>Just for kicks, I tried a design direction (that I had previously abandoned) and made the whole thing more "wedgy." Granted, it's a far cry from a balanced bit of type, but I can already see that it's threatening to be a kitschy sci-fi font. I think there's a reason I didn't go down this road the first time I thought of it.</p>
      <p>Finally, I gave a true thick/thin X a try. I turned out better than I anticipated, but I'm still very taken with the other one.</p>
      <p>Any thoughts?</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/TrexLogo3_6336.jpg"></div><p></p>
