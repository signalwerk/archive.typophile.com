      <p>I really it. The X is balanced which I know can be a little tricky.<br>
      If I have to say something: I'd be tempted to see how the T would look if the "serifs" on the bar were assymetrical, what I have in mind is the left serif being wider, I wonder if something like that will make the logo a little more animate.<br>
      Also you see how your R if you remove the leg it's basically a P, meaning the corner of the outside curve where it meets the Leg is lined with the bottom horizontal. Well try bringing that corner up, this will reduce the amount of ink in that area.<br>
      But honestly it looks good like this so...</p>
