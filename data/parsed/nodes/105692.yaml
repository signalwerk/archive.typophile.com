      <p>So far, this is the opposite of weird and quirky.<br>
      <a href="http://www.fontbureau.com/fonts/turnip/" rel="nofollow">Turnip</a> is a better choice than Sentinel, IMHO.<br>
      Check out the contrasts as it is used for <a href="http://getperka.com" rel="nofollow">Perka</a>.</p>
      <p>I think you have to go to such extremes to create contrast with a slab serif face, because they are so strong that the usual serif vs. sans method doesn’t work.</p>
