      <p>Thank you for your reply Nick.<br>
      Perhaps Sentinel isn't weird/quirky on its own, but I was hoping to add a font or two to it in order to get the layers I want. I'm thinking of it like an x + y = z type of equation.<br>
      Although it sounds weird, I was thinking of using Century Schoolbook (or Grad) for the body text, Trade Gothic Bold Condensed for sub-headers, and (Futura Extra Bold??) as my main name font. Any thoughts on that?</p>
