    <p>I keep noticing that a bunch of coffee-table books are set in various sans serif fonts. I am in the middle of putting together a coffee-table book which has some paragraphs of text here and there but otherwise is mostly photographic.</p>
    <p>I am not overly in love with Hadriano Std (which is what I'm currently using) and am planning a font switch. At this point, having never done a coffee-table book before, I am wondering as to whether a sans serif typeface is recommended? Or, apart from the sans serif / serif debate, what some recommended coffee-table-type fonts may be.</p>
    <p>Thanks much!</p>
