      <p>I wonder whether your approach has to do with captions. There was a school of thought that held that if the text is serif, the captions can be sans-serif. So it, sort-of, follows that if you only have captions, you should be in sans-serif. However, in most books the main face is serif (for various reasons). Check some cook books.</p>
      <p>I would say that you are free to do as you wish. Whatever you fancy?</p>
