      <p>Indeed Altaira - agree 100%. What I was thinking was that the serif might somewhat "trap/fishhook" the reader rather than the sans-serif "freeing" the reader to leave the text and look at the photographs. This was somewhat the basis for my question in the first place - wondering if perhaps a sans-serif font would actually be preferable for this kind of project due to its cleaner look/feel. I am tossing various ideas back and forth and doing a lot of undo &amp; redo in InDesign.</p>
      <p>Thanks for the input. Legato appears to be a good lead that I will have to investigate.</p>
