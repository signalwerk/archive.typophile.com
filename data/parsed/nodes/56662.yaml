    html: |-
      <p><em>"I wonder whether your approach has to do with captions."</em><br>
      This is an interesting thought. I'll admit that for the two coffee-table-ish books I've worked on so far, I leaned towards sans serifs as well (once Fedra Sans Alt, once Legato), and your explanation for this sounds pretty good. FWIW, I mostly feel that whoever looks at a coffee-table book doesn't usually want to <em>read</em> for hours, and sans serifs seem to be good at communicating that "don't worry, this text isn't long", plus "this book is not primarily about <em>reading</em>". I often feel that usual seriffed/"book" text faces would give the text in a coffee-table book too much of a "bookish" flavor. If that makes any sense.</p>
