    <p><strong> <a href="/node/add/wiki?edit%5Btitle%5D=Indicies" title="Create node &quot;Indicies&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indicies</a>&nbsp;: <a href="/node/12207" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">History</a>&nbsp;: Linotype&nbsp;Machine</strong></p>
    <p>The first Linotype machine was built in New York by <a href="/node/12246" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Ottmar Mergenthaler</a> in 1886. Perhaps the world’s first commercially-viable typesetting machine, Mergenthaler’s invention could cast a line of type on-the-fly, greatly speeding up the process of metal typesetting. Newspapers around the world took advantage of this immediately. Newsppapers would always be the biggest users of Linotype&nbsp;Machines.</p>
    <p>The Linotype Machine sparked a revolution in typesetting. Soon, competitor machines appeared on the market, like the <a href="/node/add/wiki?edit%5Btitle%5D=Monotype%20Machine" title="Create node &quot;Monotype Machine&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Monotype Machine</a>. Linotype Machines were used well into the 60s and 70s. From the late 1950s onward, however, Linotype had begun to produced photo-typesetting equipment, and later would go onto build digital machines. The typefaces  that were designed for these various machines would later be sold as <a href="/node/14482" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">PostScript</a> (and other format) fonts by a company called <a href="/node/12172" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Linotype Library</a> (since 2005 simply “Linotype&nbsp;GmbH”).</p>
    <p>The Linotype Machine was in a large part technically possible only because of <a href="/node/16219" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Linn Boyd Benton</a>’s pantographic&nbsp;punchcutter.</p>
    <p>A two-part film showing in great detail how the Linotype machine works is available online at the Prelinger Archives at <a href="http://www.archive.org">archive.org</a>. The links below will take you to a page containing information and several downloadable formats for each&nbsp;part:</p>
    <ul><li><a href="http://www.archive.org/details/Typesett1960">Part&nbsp;1</a></li>
    <li> <a href="http://www.archive.org/details/Typesett1960_2">Part&nbsp;2</a></li>
    </ul>
