    <p><strong> <a href="/wiki/Indicies" class="freelinking" rel="nofollow">Indicies</a> : <a href="/wiki/History" class="freelinking" rel="nofollow">History</a> : Linotype Machine</strong></p>
    <p>The first Linotype machine was built in New York by <a href="/wiki/Ottmar%20Mergenthaler" class="freelinking" rel="nofollow">Ottmar Mergenthaler</a> in 1886. Perhaps the world's first commercially-viable typesetting machine, Mergenthaler's invention could cast a line of type on-the-fly, greatly speeding up the process of metal typesetting. Newspapers around the world took advantage of this immediately. Newsppapers would always be the biggest users of Linotype Machines.</p>
    <p>The Linotype Machine sparked a revolution in typesetting. Soon, competitor machines appeared on the market, like the <a href="/wiki/Monotype%20Machine" class="freelinking" rel="nofollow">Monotype Machine</a>. Linotype Machines were used well into the 60s and 70s. From the late 1950s onward, however, Linotype had begun to produced photo-typesetting equipment, and later would go onto build digital machines. The typefaces  that were designed for these various machines would later be sold as <a href="/wiki/PostScript" class="freelinking" rel="nofollow">PostScript</a> (and other format) fonts by a company called <a href="/wiki/Linotype%20Library" class="freelinking" rel="nofollow">Linotype Library</a> (since 2005 simply "Linotype GmbH").</p>
    <p>The Linotype Machine was in a large part technically possible only because of <a href="/wiki/Linn%20Boyd%20Benton" class="freelinking" rel="nofollow">Linn Boyd Benton</a>'s pantographic punchcutter.</p>
    <p>A two-part film showing in great detail how the Linotype machine works is available online at the Prelinger Archives at <a href="http://www.archive.org" rel="nofollow">archive.org</a>. The links below will take you to a page containing information and several downloadable formats for each part:</p>
    <ul>
    <li><a href="http://www.archive.org/details/Typesett1960" rel="nofollow">Part 1</a></li>
    <li> <a href="http://www.archive.org/details/Typesett1960_2" rel="nofollow">Part 2</a></li>
    </ul>
