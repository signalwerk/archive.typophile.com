    <p>I know that the answer depends on what you're printing and what you're printing it with, but as a designer I'd like to be more confident about what's a reasonable resolution for producing a file for a certain context. This mostly applies to images, because type, of course, remains as curves in PDFs, but I'm curious about type as well: even if the resolution is determined only when it gets to the press, what will that resolution be? So I'm asking just for some examples of the resolution of different printed materials: things made on digital presses vs. offset presses; newspapers vs. magazines. How about those coffee table art books? I haven't found a handy reference for this sort of thing.</p>
    <p>When I am scanning or exporting imagery I usually do it at the highest DPI possible, even if I know that the printer isn't capable of maintaining that DPI. Is there any detriment to this? (Other than enormous files, which some people mind but have never bothered me.)</p>
    <p>And is it just me, or can you get away with much lower resolution on images than on type? The same printer that producers gorgeous, detailed photographs can't seem to make type look smooth enough.</p>
    <p>All thoughts are welcome!</p>
