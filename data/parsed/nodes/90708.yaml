      <p>For images destined for print, the thing that drives the equation is the the halftone linescreen (and to a lesser extent, the relationship between linescreen and the output resolution of the rendering device). </p>
      <p>Generally the rule of thumb is that you need at least 1:1 image resolution to linescreen, and more than 2:1 image resolution to linescreen is a waste of file space. </p>
      <p>Since a majority of commercial printing is done at 150 linescreen, the rule of thumb for images is 300 ppi at actual size.</p>
      <p>If you have more than 2 pixels for every halftone dot, then you’re going to end up having pixels that “fall through the cracks,” so to speak, and never end up influencing a printed dot at all.</p>
      <p>One could argue, I suppose, that with 4c you could use greater resolution because the different screen angles have dots falling at different interstices. But I think you’d be hard pressed to find any difference.</p>
      <p>An advantage of optimizing image resolution for targeted linescreen (as opposed to just providing maximum resolution, if it’s greater than, say 2.5x linescreen) is that this allows you to more carefully target any unsharp masking values in order to increase perceived sharpness and clarity. At too high an image resolution in relation to linescreen, any unsharp masking will get lost “between the cracks” and the image will not be as sharp.</p>
      <p>Coffee table art books are usually printed at 175 linescreen; sometimes higher. It depends on the stock and the press and how fine a dot it’s possible to hold reliably. The finer the linesceen, the smoother and more detailed an image.</p>
      <p>Some high-end printing uses stochastic screening (aka frequency modulation), which is a whole different beast. Stochastic allows for much finer placement of dots. But again, the dot size is going to be determined by press &amp; paper conditions. I don’t recall offhand the math for resolution for stochastic. Depending upon your dot, though, you can figure that higher image resolutions may be of value.</p>
