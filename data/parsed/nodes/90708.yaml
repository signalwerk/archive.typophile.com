      <p><cite>One could argue, I suppose, that with 4c you could use greater resolution because the different screen angles have dots falling at different interstices. But I think you’d be hard pressed to find any difference.</cite></p>
      <p>The dots for all colors are spaced out exactly the same. It may appear they do not if you are examining a horizontal line; but the only difference is that each color is printed at another angle to prevent Moiré.</p>
      <p>I feel it's the other way around: a full-color image may touch the lower bottom of "acceptable resolution" <em>because</em> it is to be printed full-color. Any slightly visible pixelation on one color plate will surely be masked by three other plates, each with a slightly different offset -- and thus slightly different pixelation.</p>
      <p>If you consider pure black-and-white images -- with or without type -- go as high as you possibly can. Monochrome bitmaps (of the <em>only</em> black-and-white kind, not a true-color image that just happens to use no more colors) will be passed on to a printer at their original resolution. A 300-dpi monochrome bitmap will look crystal clear in print, with pixels that are visible to the naked eye; if I need a bitmap image, I'm going for broke, at 800 dpi or more. Now <em>that</em> usually renders my bitmaps razor sharp.</p>
      <p>(There is a physical upper limit: if you approach the resolution of the output device, say, a plate-maker, your tiniest details might get lost because this bitmap has to be aligned with the device's own pixels. But you are talking about something like 3000 dpi, for a typical industry standard plate-maker. Each pixel will measure less than 1/100th of a millimeter.)</p>
