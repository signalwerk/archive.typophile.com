      <p>I know that from my experience, 200 dpi on an electrostatic printer/plotter was still very imperfect, with the stairstep nature of curves clearly visible - but at 300 dpi, on an early laser printer, the result looked a lot like "real" typewritten or even typeset copy, although the edges were still visibly a bit "soft" rather than crisp.</p>
      <p>This is not to contradict what was noted in another thread - that even 600 dpi is not adequate to do justice to (at least some) typefaces, but 1200 dpi produces results that (apparently) stand up to comparison with metal type. But it is to note that below 300 dpi, one will run into problems even with unsophisticated readers, because the limitations in quality become obvious.</p>
