    html: |-
      <p>As I said, the other characteristic will be smoothness. </p>
      <p>A vertical line is no problem. Perfectly smooth, regardless of resolution. But as you deviate from vertical or horizontal, you will get stair-stepping; how much and to what degree will depend upon how fine the imaging dot is (which is to say, how high the resolution is).</p>
      <p>The higher the resolution, the finer the stair-stepping and the potentially smoother an angled line or curve.</p>
      <p>At angles with smaller deviation from pure vertical or horizontal, this will be more apparent. This is just a basic fact of approximating an angle or curve on any grid.</p>
      <p>Let’s say you have an ‘o’ in our hypothetical 11-point text face rendered by our hypothetical 1270 dpi imagesetter. And let’s say that the x-height is around 500 units (on the larger side for a text face, imo, but easier math ;-)</p>
      <p>This ‘o’ will be rendered with about 97 imaging dots, in the vertical dimension. (Well, okay, maybe 100 dots with overshoot.) Will that be smooth enough?</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/o-1270_5918.png"></div><p></p>
      <p>Blown up like this and at full monitor pixels, maybe not. But at physical size on paper? Probably.</p>
      <p>What about the same at 600 dpi output?</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/o-600-2x_4210.png"></div><p></p>
      <p>For just plain reading, and for the average person: probably. For a typophile examining closely: probably not.</p>
      <p>But remember, also: stair-stepping and jaggedness in the rendering can be ameliorated by aspects of the physical reproduction process — e.g., ink spread in offset printing, or droplet scatter in inkjet printing.</p>
      <p>This ‘o’ is a broad curve, with plenty of surface for rendering. What about a serif bracket? Or what about a stem with subtle swelling?</p>
      <p>What’s enough? One of those reading-science types will have to weigh in with how fine a difference the average human eye can resolve — i.e., how large those jaggies have to be at what distance, etc.</p>
