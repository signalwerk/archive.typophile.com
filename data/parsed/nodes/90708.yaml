    html: |-
      <p>So, what about type? In this case, you have a completely different set of considerations.</p>
      <p>The two main effects of output device resolution will be resolvable differences and smoothness. These are basically the same issues you encounter with type on the screen, except in print the resolutions are higher and there isn’t any anti-aliasing (gray levels to increase perceived smoothness).</p>
      <p>Average-quality imagesetters generally run in the range of 1270 dpi. (High-quality imagesetters will generally run about double that, maybe more.)</p>
      <p>Let’s take the example of an average text type output from an average 1270 dpi imagesetter. And let’s say that we’re rendering a font with 1000 upm (standard Postscript em).</p>
      <p>The full 11-point height of your em will be made up of 194 imaging dots: 11pt ÷ 72 pts/inch = 0.1527 inches; × 1270 dots/inch = 194 dots.</p>
      <p>Since the full 11-point height of your font is defined as 1000 em units, that means that the diameter of a single toner dot is equivalent to about 5.15 em units.</p>
      <p>What that means is that the resolvable difference is about 5 em units. Depending upon where your outlines fall, you probably won’t be able to render a difference between a stem of 84 units and one of 87 units, for example, or a serif height of 30 vs 34, perhaps.</p>
      <p>(This is oversimplifying a bit, because there are several tricks built into the type rendering algorithms of Postscript imagesetters.)</p>
      <p>There will also be nuances of curves that are similarly undifferentiatable because the differences fall beneath the threshold of device resolvability.</p>
      <p>On that same 1270 dpi imagesetter, however, anything above about 57 pts will be rendered with full resolvability, since the 1000 upm will now be rendered with at least 1000 imaging dots.</p>
