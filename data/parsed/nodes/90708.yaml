    html: <p>For black and white line art, 300ppi is a common standard, and it's okay, but 600ppi is noticeably better to the naked eye (at least to mine), especially if there is type or lettering in the image. Before computers, screening a greyscale image would fuzz out any solid black in it, but modern output can print halftone greys and preserve sharp black lines in the same image. The experience I speak from is in publishing comic strips. As you say, continuous-tone photographs do not require nearly as much fidelity, because the difference between one pixel and the next is indiscernible when they're close to the same color, plus they are entirely subject to the linescreen.</p>
