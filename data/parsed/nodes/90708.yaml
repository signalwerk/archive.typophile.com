      <p>Oh, forgot to address the relationship of halftone linescreen to output device resolution.</p>
      <p>The relationship between the two will determine the number of possible gradations between white (no dot) and solid. If the output device resolution is insufficient to allow for an adequate range of dots between 0 and 100%, then there will be perceptible banding.</p>
      <p>For instance, if you have an output resolution of 600 dpi (a desktop laserprinter, for instance), and you print an image at 150 lpi, then each dot of your halftone will be composed of a maximum of 16 toner dots: 600÷150 = 4 dots in each dimension → 4×4 = 16 toner dots per halftone dot. </p>
      <p>Therefore, you can have only 16 different values in gradation from none to black (well, 17 if you count white). With only 16 levels of grey + white, that’s a 6.25% jump between each level of grey, and you’re going to have a posterized reproduction.</p>
      <p>This is a somewhat simplified and abstracted example, since it assumes essentially non-round dots. To produce rounded dots in an adequate range of values, the math is a little different, depending upon the algorithm for shaping the dots.</p>
      <p>But you get the idea.</p>
      <p>So, in addition to being constrained by press/paper conditions, optimum halftone linescreen for a job may be influenced by the resolution of the output device that is producing the film or plate. Which in turn determines your optimum image pixel resolution.</p>
