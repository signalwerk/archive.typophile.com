      <p>"While some may argue for personal preference, I agree with Colin Wheildon that setting a book in Sans Serif is not a good idea. Good for a STOP sign but not for a book."</p>
      <p>The problem I have with this and other iterations of the sentiment is that it pre-emptively collapses every example of "sans" into a single abstract idea, somehow made binarily opposed to the similarly generic and abstract idea of "serif". It's the most oversimplified, thoughtless, outdated trope that unfortunately still has currency with otherwise intelligent designers. Consider:</p>
      <p>Is digital Bauer Bodoni, at 9 points, set solid, printed in a weak gray ink on hard glossy paper, necessarily, categorically easier to read, safer, more advisable than Syntax, at 11/14, in a rich black ink on soft off-white paper? This is one possible interpretation of the "axiom" being repeated above. It isn't enough to simply say that this exception proves the rule, since every real-world example you can think of is an exception. </p>
      <p>There are so many different typefaces under the heading of "Sans" and so many "Serif" that the very idea that "serif is better than sans for books" now sounds like something you say when you have no other information, or have no ability to discern the differences between typefaces. It's not a visual idea at all. It made a lot more sense in the early 20th century when the available range of types was so much more limited, but this is a very different world typographically, and readers have evolved as well. What constitutes a "Sans" typeface has expanded and grown considerably more complex since this kind of distinction was first made. The evolution of the Sans letter has been a very recent and very sudden one. </p>
      <p>It may cause a number of readers here to become defensive and reach for their Updike and Morison for reinforcement, but I challenge you all to perform with your own eyes, the actual, literal act of reading text set in some of the newer sans designs (see Florian's list above) and compare them with our "classics" like Bodoni, Garamond 3, Cheltenham, Bookman, Palatino, Trump Mediaeval, or any other faces considered acceptable or safe for book text. </p>
      <p>My contention is that this sentiment, this axiom, this truism of typography is an unexamined myth, waiting to be disproved by the simple act of direct engagement with the real typographic scene of today. It is an echo of earlier times, before the sans letter had undergone the enormous, rich and rapid evolution it has undergone during the last century. Right now, it's 2008, and Florian's list is a very useful bellwether of the changes the genre of "Sans" has undergone since Updike and Morison were even alive. </p>
      <p>I've done my part by designing a typeface for book text that has no serifs. Others have existed, and more are on the way. If you want a printed specimen of Beorcana, which is a real example of its actual performance, contact me. As always, judging typefaces online for book text is useless. </p>
      <p>Repeating a tired axiom from decades past only limits you, leaving you prejudiced, blind and unable to take advantage of recent advances. Join the 21st century.</p>
