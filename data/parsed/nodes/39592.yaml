      <p>Yes, to each and every one of the types mentioned here. I've used most of them. I'd throw Usherwood and Cheltanham into the mix, too, tho’, of them, my personal favorites are Bembo and Adobe Garamond. Don’t laugh, I also happen to think that Palatino is an elegant-looking face for extended stretches of text. That said—and despite my ranting about the current, exasperating overuse of sans serifs for book body text on any number of blogs—including <a href="http://www.tianodesign.com/blog" rel="nofollow"> my own</a>—I’m trying to steel my nerve for using Optima if the right project comes along.</p>
      <p>One thing, if you want to approach this like a book designer—and this needn’t take a chunk of time out of your life ... Start by reading just a few paragraphs explaining type classification: the differences between Old Style, Transitional, etc. Then look at some types from different periods and places. Finally, take a look at the material your dad has written about and consider whether there’s a type that just seems to naturally go with his book in your eyes.</p>
