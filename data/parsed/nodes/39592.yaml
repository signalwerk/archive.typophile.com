      <p>Jeez. I've been typesetting -- and occasionally designing -- books for over 25 years. I guess that makes me an old fogy.</p>
      <p>How to be with it (if that's still an acceptable hip term) is to go to a catalog of a juried book show, and see what fonts the designers who got the most books in the show used.</p>
      <p>Then increase the leading. If they set 10/15, you set 10/18.</p>
      <p>Ignore what the book is about. Ignore the audience (who's going to read it). After all, the biggest design problem is designer boredom. Solve that, and everything else falls into place.</p>
      <p>And since I seem to be filled with vitrol this morning, to Will Powers: Why in the world would you use boldface for subheads? I can see it in a travel book, where the reader is skipping around, trying to find only what interests him/her. But in a book to be read continuously, a subhead simply takes the place of a paragraph used to transit from one topic to another. You don't need to ruin the color of the page by using boldface.</p>
      <p>But back to the original question: what's the book about? Who (aside from your dad) is going to read it?</p>
