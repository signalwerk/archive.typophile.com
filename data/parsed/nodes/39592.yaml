      <p>&gt; How about some new, excellent book types? </p>
      <p>Way to go, Carl!</p>
      <p>Here's something maybe more important than which specific face you choose: find a face you know will have all the elements that make for good book typography. Roman + italic, of course. Small caps, and maybe even italic smalls. Semibold, with italic &amp; smalls, if you need subheads. Do you have notes? Then get superiors and stay away from the false ones.</p>
      <p>Make sure you get faces that suit text and body copy to use for chapter numbers and chapter titles.</p>
      <p>&amp; see if you can find some university press books in those areas Dad wrote about and look at them. Do not steal, but get ideas. Buy or borrow a copy of Richard Hendel's "On Book Design."</p>
      <p>Good luck. Have fun.</p>
      <p>powers</p>
