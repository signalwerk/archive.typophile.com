      <p><cite>Gertie, there are two fonts that are ALWAYS successful in books, even with the wrong leading/formatting: Sabon and Janson, both with oldstyle figures.</cite></p>
      <p>I like Sabon but I find Janson's italics very hard to read, like Caslon's. I wouldn't recommend that font for a book that might have a lot of italic text.</p>
      <p>I don't miss the bold in Requiem (altho I'd love fractions!) or in most other serif fonts. In general I don't use a lot of bold serif fonts. Sans serif bold, yes. </p>
      <p>I am going to bookmark this page too next time I want to go on a font spending spree. There are some excellent suggestions here, some I knew already, others not. I must confess to not liking stressed sans in general which cuts out (for me) much of Florian's list.</p>
