      <p>Hmm. Let's seen now.</p>
      <p>John D. Berry  "quite happily read a novel that was typeset in Optima" and Pattyfab "would not read a novel in Optima,  just as a matter of principle."  (<a href="http://www.typophile.com/node/41586" title="http://www.typophile.com/node/41586">http://www.typophile.com/node/41586</a>) OK, so different strokes for different folks.</p>
      <p>And Pattyfab confesses to "to not liking stressed sans in general." Fine.</p>
      <p>But let <em>me</em> suggest that serif is better suited to extended text than sans, and, in a pompous, arrogant, demeaning tone Carl Crossgrove essentially brands me a Luddite. </p>
      <p>"I've done my part by designing a typeface for book text that has no serifs." Whoopee do, Carl, does that "disprove the unexamined myth"? Does your new sans text font rewrite 500 years of typographic practice? You <em>could</em> use Curlz to typeset a book. I could come up with some scenarios where Curlz looks better than a sans, if you want to use ludicrous examples as Carl did. What does that prove?</p>
      <p>If you really examined "the myth," Carl, you'd find that there have been numerous studies over decades and, at best, they're inconclusive or contradictory.</p>
      <p>I have no problem with any typeface anyone wants to set their book or magazine or newspaper in. My principle in refusing to read any text is whether or not it is easy and pleasant (i.e., not difficult or annoying) to read.</p>
      <p>I'm open to lots of things, setting text in sans included. I'm not open to snotty, condescending diatribes like Carl's.</p>
      <p>Is civility so hard?</p>
