      <p>&gt; Why in the world would you use boldface for subheads? </p>
      <p>Charles: I did not suggest "bold" for subs. I just checked my post and it said "semi-bold", and I believe there's valid reasons for using semi-bold as subs in many texts. I very rarely use bold in books, and discourage its use by freelancers who design for us.</p>
      <p>But keep that vitriol flowing, Charles. It keeps us geezers young and healthy. And likable. All your other comments are vitriolically valid.</p>
      <p>I'd never use Chelt for anything in a book except maybe a chapter number. &amp; for the work I do I find very little to like in Adobe Caslon or Adobe Garamond. Chaparral is hard to use well, for sure.</p>
      <p>powers</p>
