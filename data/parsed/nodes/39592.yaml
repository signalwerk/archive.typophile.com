      <p>Speaking of text fonts, may I ask for an opinion (which the original poster might find useful as well)?</p>
      <p>Nine years ago when I started self-publishing my <a href="http://www.costumegoddess.com/series.htm" rel="nofollow"><strong>costume how-to books</strong></a> (with zero funds to buy fonts) an editor friend recommended <a href="http://www.identifont.com/show?1MX" rel="nofollow"><strong>Book Antigua</strong></a> for body text, and I still use that for the book series, with Zapf Humanist for subtitles. </p>
      <p>I know it's the custom here to disapprove of Windows-installed fonts, but what do you think of that choice? To me it has always looked pleasantly clean, legible and non-distracting. </p>
      <p>If it was today I'd probably choose Minion as I now have lots of Adobe fonts, but Book Antigua still looks good, I think.</p>
