    html: |-
      <p><cite>You think Venetian fonts aren’t suitable for chemistry design-wise. What kind would you suggest?</cite></p>
      <p>Ah. Not sure. The last time I had to deal with equations as an "author" was when I took (&amp; passed!) my math-logic prelim in 1970. As a compositor, I've set a bunch of equations since then, usually in economics.</p>
      <p>Book interior design is all about audience, and a little bit about the author. If I'm faced with designing a book where I don't know the subject matter, I look to see what typefaces other designers have used, over a period of time. That "period of time" is the best way to avoid getting caught using a current fashion that will soon fade.</p>
      <p>As a WAG, I doubt most chemists would find, say,  Bembo a comfortable font for professional work. Something modern, but plain. In my grad student days that was Times Roman, but Times has become so much a design taboo that has probably changed.</p>
      <p>I still remember one of my professors saying "Prelims are puberty rites," and my dissertation director saying "just get it done." Since he had taken ten years to write his on the early psychology of Agostino  Nifo, I figured he was wrong. But it turned out he was right, &amp; I never finished mine.</p>
      <p>Moral: Steal a design from something the audience will be comfortable with, &amp; get on with your life.</p>
