    <p>I'm sure this has been a thread at some point, but doing a search didn't show me what I was looking for, so if I just need to be redirected, go for it. :-)</p>
    <p>The situation is this- I have a book I need to format for someone (my dad actually) and am already stuck- trying to decide what font to use! </p>
    <p>The only info I'm beginning with is that I'd like to use serif, having heard more than once that sans serif is inadvisable for books.</p>
    <p>I would like to give a better idea of what I'm looking for, but my ignorance has got the best of me here. The book is non-fiction, essentially about ethics, society, agnosticism, serious schtuff like that. :-)</p>
    <p>So if anyone has suggestions of fonts I can try, I'm all ears. I'm also open to suggestions regarding books about fonts for books, but that is more long term, as I need to begin formatting this book yesterday.</p>
    <p>Thanks for any advice you can give,<br>
    Gertie</p>
