      <p>I'm not the best person to ask about scientific superscripts, but I do remember Arno well because it was just a couple weeks ago I went in and made the superscripts both smaller, and raised them up. Also put the superscripted numbers on a proportional body &amp; kerned them. Also made sure the superscript alphas and numbers had a common "baseline."</p>
      <p>Actually, these were the "number.super" glyphs, switched by the superiors feature. Scientific notation should be called by the Unicode index for superiors (except as I remember, superscript alphas aren't encoded? See, I told you I wasn't the best person to ask). Adobe's superiors feature doesn't switch to these, and that gives improper syntax. </p>
      <p>Additionally, scientific superiors should have a certain relationship with both cap &amp; l.c. letters, and lining numbers. All of these should fit well with the tops of parens &amp; brackets, too, which isn't the case with Arno. Arno is a lovely font, but again, IMO, not for scientific work.</p>
      <p>Adam doesn't post much on the design forum, but I'd trust his judgment, or any of the programmer types with an engineering background (which gives two strikes against me).</p>
      <p><cite>Edited:</cite> S/B above Chris' last post.</p>
