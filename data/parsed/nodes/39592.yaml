      <p>Great thread.  </p>
      <p>I'm looking for a new font to use in a new book project.  It's a heavily illustrated architecture book, hopefully with a lot of white space, but also with some large blocks of text.  I wish that all of the fonts on Carl's list had PDF sample sheets, cause that seems to be the best way to get an initial impression of how the font feels.  I printed out the ones that did, and my initial choices would be Kingfisher, Arnheim and Freight.  I guess I'm looking for something very readable, but with a slight edge.  Usually like to open up the leading, but I think that may be adding to the impression of the type being too light?</p>
      <p>I have been using Terminal Design's <a href="http://www.terminaldesign.com/fonts/sets/?CID=2" rel="nofollow">Alfon</a> quite a lot recently, and like it alot, but I'm starting to think it prints too light, and want to mix things up a bit.</p>
