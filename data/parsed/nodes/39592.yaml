      <p>Some some on (and off) topic comments.</p>
      <p>I think Janson (Text) is among the most readable fonts. I agree with Pattyfab about the italics. It always looked to me like somebody (or something) sat on top of the lc and flattened the tops of some letters.</p>
      <p>If you like Janson, you should also like Ehrhardt, also by Kis. But I am not a big fan of the windswept <em>w.</em></p>
      <p>Another Kis-based possibility is  E+F's Nikis Light, but I don't know where you can get it anymore. I always loved the lc  italic <em>g</em> because it didn't look like a pair of eyeglasses or a wire coat hanger. (Is E+F out of business?)</p>
      <p>I thank Pattyfab for mentioning Sabon, which I haven't used in a while. I'm reprinting some "Best of" pieces from my newsletter, and  switched one piece from Adobe Garamond to Sabon, and I really like it.</p>
      <p>I also think Pattyfab has the most beautiful and classy avatar on the forum.</p><div class="imageWrap"><img src="http://typophile.com/files/Kis_6155.jpg"></div><p></p>
