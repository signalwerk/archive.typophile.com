      <p>John --</p>
      <p>Most folks naturally link Whitman to the Font Bureau site, where the fonts are available for license; but I have an alternate PDF specimen, which might be more useful for judging the type for book purposes, at my site:<br>
      <a href="http://www.kentlew.com/Type/WhitmanSpecimen.pdf" title="http://www.kentlew.com/Type/WhitmanSpecimen.pdf">http://www.kentlew.com/Type/WhitmanSpecimen.pdf</a></p>
      <p>I don't know if you'll deem this design to be what you have in mind. </p>
      <p>I'm not aware of Whitman in use in any architectural books quite like what you do. There was a recent guide to Chicago architecture, but that was a small format (and small type). It has been used in some how-to building titles -- <cite>The Fence Bible</cite> and <cite>How to Build Paths, Steps &amp; Footbridges</cite> (both from Storey Publishing, under my direction), which are similar in format to yours.</p>
      <p>If the type interests you, but you need to review more examples, I'd be happy to set some of your own sample text to match your specifications and send you a PDF. Contact me if you want to arrange this.</p>
      <p>-- Kent.</p>
