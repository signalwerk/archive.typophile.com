      <p>You know, a study on why sans have been cast as inferior in legibility would be very informative in the construction and usage of fonts in general.<br>
      I can see several differences that could be looked at: the serifs themselves, line width variation (humanist sans seem to be a recent development), weight (sans are often heavier), spacing, and letter shape.</p>
      <p>A good idea would be to take a wide variety of serif fonts, and slice off the serifs and line endings, which would be saved separately as serif sets. Then, a variety of sans serif fonts and the castrated fonts from earlier would be taken, to each of which each serif set would be applied, as well as Optima, Albertus, and Candara-style flarings and finishing off the castrated serifs as sans (given that different sans use different cuts [this being one of the main differences between Helvetica and Arial], various endings from sans could also be added to the mix-and-match). This would, of course, require great skill, as tailoring would be necessary for each combination, and potentially tens of thousands of man-hours.<br>
      After this, the various combinations could be tested for legibility. Due to the large number of combinations, this test would be much simpler than it would be for single fonts (though finding enough people would be tough). The scores could than be tied to each feature, so there would be an average of all scores of combinations with geometric builds and an average for old style serifs.</p>
