      <p>Of the types mentioned, I would second Freight Text and Minion. Bringhurst set his "bible" in Minion. There are many other good suggestions as well.</p>
      <p>I would also like to suggest Cycles Eleven: <a href="http://www.stonetypefoundry.com/cyclesoverview.html" title="http://www.stonetypefoundry.com/cyclesoverview.html">http://www.stonetypefoundry.com/cyclesoverview.html</a></p>
      <p>And, yes, I own all three.</p>
      <p>Both Freight Text and Cycles are beautiful *and* extraordinarily readable. Cycles lacks bold italic. The heavier you go in Freight Text, the more the italic loses its neutrality. Depending on how you use it, that may be a good thing or not.</p>
      <p>Twice in the last six months, Cycles was available at MyFonts for half price; not so now.</p>
      <p>I have Cheltenham, but I've never used it, mostly because I think it looks ugly.</p>
      <p>While some may argue for personal preference, I agree with Colin Wheildon that setting a book in Sans Serif is not a good idea. Good for a STOP sign but not for a book.</p>
