      <p>I was going to stay out of this, but now I can't help myself.</p>
      <p>I have to say that Cheltenham is one of the most unlikely and idiosyncratic choices I can think of for setting book text.</p>
      <p>But that's speaking in generalities. I suppose I would have to consider which specific Cheltenham we're talking about (please tell me *not* ITC Cheltenham) and what the nature of the book is -- format, topic, audience. Even so, I have a hard time swallowing it.</p>
      <p>I, too, applaud Carl's list and his perspective -- even though I will confess that there are a handful of faces on his list that I would not likely employ for book work. But maybe that's just the books I work on.</p>
      <p>I do use Miller regularly; it's a standard for me. I've used Mercury with modest success (but I think that's just me getting used to it -- the face has the right qualities and attributes to recommend it, especially with the grades to play with). And of course, Whitman now and then (what can I say? ;-). </p>
      <p>I've worked with Chaparral and it can serve in certain contexts. (The page design wasn't mine, and I was skeptical at first, but came to terms with it.) I've seen Will use it to good effect.</p>
      <p>I've admired Merlo and Rongel, but haven't had a chance to get close enough to them to be certain. Kingfisher, too, holds great promise and has been recommended by designers whose judgment I value. Arnhem has been highly recommended, and I've been keeping my eye on it.</p>
      <p>However, I have mixed feelings about Scala. I admired the design when it was released, but I just don't care for it in books. It's certainly been done often enough (I noticed there was a raft of Scala in last year's AAUP award winners), but it's too stiff and clunky for me in book text. (This was, in fact, part of the impetus to develop Whitman.)</p>
      <p>And much as I admire Farnham and Prensa as designs and for periodicals, I find they are too distracting in book text for my taste. I'm afraid the same might hold true for Feijoa (again, much as I admire it); but I'm willing to suspend final judgment until I've had occasion to put it through more paces.</p>
      <p>All that said, Carl's is a pretty solid list. Even those I have dismissed, I might reconsider under the right circumstances, with the right manuscript.</p>
      <p>-- K.</p>
