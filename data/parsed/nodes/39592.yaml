      <p>I wish Carl's list had links. I couldn't easily track down some of his suggestions. </p>
      <p>I haven't used Cheltenham for running text in about 20 years. I'm a bit of an old fogy too but it reminds me of the 80s, as does Goudy.</p>
      <p>Unfortunately I haven't bought a new serif font in awhile because if I'm going to buy a font for text use I want the complete family and I just haven't had the money recently. I have my eye on Atma and Miller. </p>
      <p>But I think for a book where the text is the thing, not the design, Janet would be wise to stick with a font that doesn't have too much personality, which is why some of Carl's fonts might not work for her. Chaparral for example, I keep trying to use it and it always seems to fall short. I can't articulate why.</p>
