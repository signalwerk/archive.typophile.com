      <p>Steve, at the risk of seeming to nag, while you may feel confident estimating the performance of book types by viewing them onscreen, I think it's unrealistic to think that is enough information. I would have had a more harsh reaction to the idea of Cheltenham for books, except I took a look at the ITC Cheltenham specimen, and while I understand Kent's and others' revulsion, I can see how the Book weight could be used at small sizes. I think this is due to its large x-height, and would be possible only with generous tracking. It wasn't really possible for me to make an estimation of its capabilities without that real example. I encourage you to make more of an effort to research these new faces; If you get PDF specimens and print them out at 1200 dpi, you might be surprised to discover that some of them are indeed valuable, appealing workhorses.</p>
