      <p>Gertie, there are two fonts that are ALWAYS successful in books, even with the wrong leading/formatting: Sabon and Janson, both with oldstyle figures. You can NEVER go wrong with either of these. Just remember to always use old-style figures, and be very careful about throwing in sans-serifs: the combo usually looks vulgar in a book.</p>
      <p>Beyond that, my vote is for fat (Adobe Caslon or MT Plantin with OSF) over slightly condensed letter forms, like Minion. I disagree with one poster's aversion to Scala in books: I feel it looks great. Josh Darden's re-think of Fournier, Corundum, is just outstanding. Then there are all the options re periods and themes: mid-19th-century is effectively called up by ITC Bodoni 12, and earlier 1800s by either Storm's version of Walbaum or Richard Beatty's of Kennerley. For evocations of late 18th century French typography, we're still needy: Sirenne and Acanthus are just too heavy to work properly in today's book designs.</p>
      <p>We still have a horrible problem with foundries releasing text families that lack bold and/or bold italic. There are lots of manuscripts that call for bold somewhere, and a publisher does not want to hear he can't get something in bold. This is why Clifford and Requiem have not swept the design field: they are shamelessly incomplete!</p>
