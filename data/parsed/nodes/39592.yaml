      <p>This is a pretty old thread. I imagine a number of us are finished with it -- I can't even say why I looked at this last post. With that in mind, you might do better starting a new one.</p>
      <p>Off the top of my head, I don't think of Minion as <cite>wrong</cite> for science, but I don't think it is the best choice, either. I think Minion's Greek characters are drawn primarily for classical Greek -- note the Greek extended (aka polytonic) glyphs, used only with ancient Greek. You would know better than I whether or not Minion's Greek glyphs are appropriate for science. I remember having to change something -- either the theta or phi? -- for some technical figures supplied to us by a designer using Minion -- they used the wrong ones. The scientific ones are there, but not in the "regular" Unicode spot.</p>
      <p>Beyond that, the font has none of the chemical bonding characters, and I believe it doesn't have alphabetic superiors/inferiors. The superior/inferior numbers aren't quite right for science either -- nor are they quite right for footnote calls.</p>
      <p>I imagine there are better fonts for your purpose, even though Minion is quite a nice font.</p>
