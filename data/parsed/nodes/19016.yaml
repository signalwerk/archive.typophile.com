  html: <p>I designed a bitmap font and exported it to TTF using Font Creator. Final tests (Photoshop/Flash) were run, everything seemed ok, until I performed some tests on a Mac. Well.. there are unexpected tracking issues in Flash, ie. some characters overlapping. Should I prepare my fonts differently for the OSX? Is there somewhere I could read some more about PC/Mac differences in this area?</p>
