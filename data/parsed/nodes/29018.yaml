    <p>Following my previous post about Stempel Garamond (<a href="http://typophile.com/node/28971" title="http://typophile.com/node/28971">http://typophile.com/node/28971</a>) I received a photo of the Egenolff-Berner specimen of 1592. I could observe that there are different sizes of garamond types. There is "Petit Canon", "Romain Parangon", "Romain Gros Text", "Romain S. Augustin", "Romain Cicero" and "Romain Garamond". There are alos two romans and a few italics by Granjon. </p>
    <p>My intention was to compare Stempel Garamond—the original design of 1924 and not the digital version—&nbsp;with the Egenholff-Berner specimen. My problem now is that I don't know which size was used for the adaptation of the Stempel Garamond. Can you suggest a strategy to help me identify it or at least to get an idea of the kind of decisions the technicians at Stempel took for the adaptation of the Stempel Garamond?</p>
    <p>thanks again</p>
    <p>Seb</p>
  html_clean: |-
