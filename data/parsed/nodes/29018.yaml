      <p>I read over the previous thread, and can highly recommend the "Type Specimen Facsimiles" edition. The reproduction there, while not perfect, is vastly better than the GIF attached to your thread. I also have high-res scans of that facsimile, with 200 dpi versions <a href="http://www.levien.com/type/berner/" rel="nofollow">here</a> and the 2400 dpi original scans at the <a href="http://www.tug.org/levienfonts/berner/" rel="nofollow">TeX archive</a>.</p>
      <p>The best Stempel Garamond source I've found so far in my library is Hermann Zapf's Manuale Typographicum. According to the book, "HZ and his design philosophy," "the type specimen of Konrad Berner of 1592 was the source for the redesign of the Stempel Garamond." Examining it more closely, I see that Stempel was in fact responsible for the shortening of the descenders (they were German, after all). They did a creditable job, but something has definitely been lost in the elegance of the 'g'.</p>
      <p>I'm fairly sure now that they didn't just trace over a particular size, because I see elements from different sizes mixed. Overall, the Garamond is remarkably consistent across the size range, but there are some systematic differences such as 'a' and 'e' counter size, as well as quirks such as the height of the upper left serif in the 'p'. In the Cicero and Galliard, it's just a touch high (a tendency which is greatly exaggerated in the Jannon branch of Garamond-named fonts), but in the Petit Canon it looks just in line. The Stempel follows the large sizes here. (Incidentally, the Stempel 'p' is also considerably wider than the Berner sheet. I think it was traditional for the bowl of the 'p' to be a wee bit smaller than the 'o' norm, something that gave me an inordinate amount of trouble when digitizing the Le Be Book. This quirk is completely normalized out of the Stempel. The Stempel has a more pronounced pen angle, as well, suggesting that this letter was redrawn from scratch).</p>
      <p>The 'a' tells a different story. There's no way the Stempel could have been drawn from the large sizes, which show a very smooth and refined bowl, and a very light touch on the terminal. Stempel is characteristically quirky in both regards, and also has a general lean to the left (a wide top) completely absent in the Canons. The heavier terminal weight and top width vary unsystematically across the size range, but the Cicero is certainly not far off.</p>
      <p>In other tiny details, Stempel doesn't follow the Garamond closely at all. For example, in most sizes the top right serif of the 'u' is much heavier than the top left, but in Stempel they're only subtly different. Also, the Stempel 'i' dot is big and bold, much more subtle in the Garamonds. The Stempel 'M' is much more symmetrical left-right; Garamond in all sizes has noticeably more white under the right side of the vee than the left. A lot of these changes count, I think, as regularizing the alphabet to match twentieth-century expectations.</p>
      <p>Hope you find this useful. It was a pleasure to go back to the Berner sheet and study it closely again. Garamond does indeed deserve much of his fame.</p>
