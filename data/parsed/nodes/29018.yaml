      <p><em>And something gained, seeing as how it’s supposed to be a text face.<br>
      A good text “g” needs to have a certain inelegance.</em></p>
      <p>How about we split up the font design work between us? You do the inelegant text fonts, I'll confine myself to elegant ones.</p>
      <p>Incunabular romans generally have very long descenders (small x-heights) by today's standards, but I have found a couple of very old examples that could almost pass for '70s ITC designs. One is the 1689 <em>Plininae exercitationes</em> by J. Vande Water, Utrecht (reproduced as plate 184 in Day and Morison's <em>Typographic Book</em>), and another is the Groote Garmont Romeyn in the specimen sheet of Jan Roman, Amsterdam, c. 1762 (reproduced in the Type Specimen Facsimiles edition, p. 13). A couple of things to look at next time you head for the library.</p>
