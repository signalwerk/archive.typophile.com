      <p>Yeah, after I wrote that I suspected it might be too<br>
      labyrinthine... but then I got lazy and left it as is.  :-)</p>
      <p>I meant that Stempel Garamond might not be a "literal" recreation of a given size of the original (I mean even if they ironed out -presumed- printing artefacts, which historically almost nobody has ever left in, for any revival effort). It could be (and probably is) that to some extent, but quite possibly not enough for you to be looking too closely at a single size of the original. Note here that you can't ever fully trust the pedigree that might have officially been claimed at the time of its release - like how even to this day some Jannon revivals still try to allude to being a Garamond, all these decades after Warde's article. My all-time favorite is this classic bit of Copperfield-grade obfuscation:<br>
      <a href="http://www.myfonts.com/fonts/linotype/simoncini-garamond/" title="http://www.myfonts.com/fonts/linotype/simoncini-garamond/">http://www.myfonts.com/fonts/linotype/simoncini-garamond/</a></p>
      <p>Somebody around here should know about the Stempel for sure.</p>
      <p>hhp</p>
