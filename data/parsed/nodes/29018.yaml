      <p>Based primarily on the counter of the 'a' and 'e', I'm going to say that the best match is the "Romain Cicero", which according to the Fournier Manuel Typographique is approximately 12pt. The next size up, the St. Augustin, has distinctly smaller counters as appropriate for display.</p>
      <p>The Linotype material I have boasts of Stempel's possession of an original copy of the Berner sheet, and to my eyes, it's a fairly literal revival. Since I'm looking at the Linotype version, some of the differences (short descenders, fairly wide 'm') may be due to that adaptation rather than what Stempel did.</p>
      <p>In any case, the Stempel version does honestly seem to be based on the Garamond model, rather than Jannon or Aldus or anyone else. Also, looking at (my reproduction of) the Berner sheet, I'm struck by how beautifully the optical scaling has been done.</p>
      <p>Of course, now that Garamond Premier Pro is out, pretty much all the fun has been taken out of Garamond revivals. I was just looking at my Le Be from a few years back, and am not sure I'm ever going to finish it.</p>
