    <p>Hi,</p>
    <p>I am new to this forum and to type design in general. Below my first design for which I would like to get your honest critique!</p>
    <p>I started the font under construction via pencil / marker sketches of some of the important small faces, following the general guidelines in the book 'Designing Type' (which I think is an absulote must for every beginner). </p>
    <p>I want the font to be applicable as a book type with good readability but 'with some tension and movement' here and there. I started with the 'a' and instead of having a rounded hook, I settled for a 'curve under tension' (i.e. a high curvature at the upper right shoulder. This was then used as the underlying theme in other faces as well (very noticeable in the 'e', 'c' etc. </p>
    <p>I would appreciate some feedback so that I can roll in some changes during further development.</p>
    <p>Thanks a lot!,</p>
    <p>Sebastian</p>
