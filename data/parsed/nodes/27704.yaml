    html: |-
      <p>Hi Sebastian,</p>
      <p>I greatly appeciate you took the time to comment! To learn about font design I went through the string of reviews / posts on your Sofa font (which looks great!).</p>
      <p>I spend some time over the weekend and did the remaining lower case letters. During completion of this, I also start making some changes to the original version. I put in a sharp corner instead (as in Bembo) and did the same in the 'q' (not as in Bembo). </p>
      <p>One of the things I wonder about as a beginner, is how rigid one needs to stick to the design language, especially for a text font (which seems to me like the 'high-school' of type)</p>
      <p>a: I wasn't happy with it also. I put it upright, removed 'tension' and tweaked the bowl.</p>
      <p>d: Changed the bowl to be more to the left. The stress is now more to the left. I tried to do that with the b and the q as well.</p>
      <p>h: I made it a bit wider than the n. (as outlined in the Desiginging Type book). But I have the feeling that there may be a bit too much white in the counter.</p>
      <p>r: Made some changes here to make it thicker. I homed in on the 'swash' a the common theme in this font (a, c, f, j, r and the y). </p>
      <p>Also, I moved away from the spurs in the b and q. They didn't seem to belong in this font. Instead I used sharp corners (as the 'b' in Bembo). One of the things I wonder as a beginner is how strict the use of certain design elements is in a text font (which seems to be the most rigorous branch of the art). For instance, in Bembo the 'b' has a sharp corner, but the q has a spur. Would it be "ok" to have a font in which the 'b' and the 'q' are identical in 'design language'?</p>
      <p>I use the Designing Type book more or less the same way lately. When I do a group of letters I look up the general 'rules' and then start drawing and wrangling Beziers. Also, I printed a number of samples of fonts I like and look at how diferent elements are used in those fonts.</p>
      <p>Anyway, thanks again for your feedback. I hope you can have a quick peek at my updated version.</p>
      <p>Sebastian</p>
