      <p>This looks quite readable already in text-sizes, so the overall proportions seem to be right. But actually this can only be assessed if all characters are present, at the moment the more difficult ones are missing yet.</p>
      <p>a: too narrow in textsetting I think, wonky lower left part, and it falls to the right. I like the upper part, but maybe it's just a bit too much tension.<br>
      d: the bowl is somewhat "undefined" yet. give it more tension (upper right part of the bowl is too near to the stem, lower part of the bowl is malformed)<br>
      h: is it wider than "n"? It appears to me, but I'm not sure.<br>
      r: the right flag seems to be slightly too thin. Don't make it bigger, just thicker.</p>
      <p>Please take these tips with a grain of salt and please don't rely on them solely, because I am not the Master of Typedesign, but I can only tell what I see, and give some of my experience with my own drafts.</p>
      <p>About "Designing Type": I own the book as well, and after several months in the bookshelf, I have found how it can be used: I draw my characters without the aid of the book, but when revising them I have a look at the book, and often I find the little "problem" the character is suffering from.<br>
      If I read before drawing, I'm so hooked up in "rules", "proportions", "tendencies" that every creativity is killed...</p>
