    html: "<p>For publications I usually have 4 sets of paragraph  <br>stylesheets: head, body, sidebar, and caption.  <br>Then character stylesheets for each of these that require <br>them (body-bold, body-cite, head-smallcaps, etc.) <br> <br>This is very generalized and simplified, of course, but <br>that's the main structure. I find it works well and helps <br>push through the ultimately time-saving, but initially <br>irritating practice of creating the sheets.</p>"
