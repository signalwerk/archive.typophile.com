  html: <p>Anyone have any good/useful style sheet naming/creation/hierarchy techniques? I'm having trouble settling... I do it differently for every publication I work with. Is there a One True Way to do stylesheets?</p>
  html_clean: <p>Anyone have any good/useful style sheet naming/creation/hierarchy techniques? I'm having trouble settling... I do it differently for every publication I work with. Is there a One True Way to do stylesheets?</p>
