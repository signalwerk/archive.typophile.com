    <p>My boss just gave me an unopened and unused Type On Call CD-ROM, version 4.0.</p>
    <p>Since the license was never used, is it still possible to request the fonts you get when you register? When I installed the software, it said that I could request Poppl-Laudatio Condensed and Apollo, both very nice faces, for the unbelievable price of $0.00!</p>
    <p>I can't seem to be able to get anyone on the line at Adobe, but I should be able to request the fonts, right?</p>
