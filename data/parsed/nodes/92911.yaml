      <p>I used Letraset type from its earliest days (at my parents’ architectural practice) thru art school and then as a professional graphic designer. I stopped using it when I became an art director and got all my type from type houses; that would be around 1979. But I continued to use their other products, especially markers and paper, for comps. Then c.1990 I bought some of their fonts on ﬂoppies.</p>
      <p>I submitted Letraset a lot of proposals for typeface designs in the 1970s and 80s, but they rejected them all.<br>
      Thanks goodness for the Mac and Fontographer!</p>
