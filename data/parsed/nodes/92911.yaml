      <p>Mark mentioned Formatt which, instead of being a dry-transfer medium, had characters printed on a clear carrier sheet, which were cut out and positioned to create headlines or subheads or—if you were a real glutton for punishment and/or an inveterate cheapskate—body copy.</p>
      <p>Although Formatt's typeface offerings weren't quite as bleeding-edge as Letraset’s, the medium itself offered some distinct advantages. First, providing you didn't burnish too vigorously, individual letters could be repositioned; and, perhaps more important, the letters were not subject to compromise by errant bits of rubber cement—always an occupation hazard of dry-transfer type.</p>
