      <p>Letraset was one of the first things that got me into type. I love watercolour painting, and one day about 25–30 years ago, while I was looking for porcelain mixing trays at the locat art supply store, I noticed a stack of these “Letraset” catalogues. I was bored, so I picked one up, leafed through it, and noticed page after page of different types of letters. I had no idea there could be so many. And that was it. From that day on, I pretty much took it with me everywhere I went. I had to cover it in clear packing tape to stop the wear, and I even wrote my name and telephone number on it in case I lost it, so kind soul would return my valuable book to me. Believe it or not, I was a little awkward and nerdy as a kid. True story.</p>
      <p>And don’t forget about <a href="http://www.letraset.com/products/2075-Omnicrom-Foils/" rel="nofollow">Letraset Omnicrom Film</a>.</p>
