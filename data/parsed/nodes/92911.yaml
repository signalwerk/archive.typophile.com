    html: <p>My first use was in the early 1960s in design school, soon after it was put on the market.  PressType was the first one I used.  It was sneered at back then but caught on quickly after better typefaces and quality came about--mostly by Letraset.  My design school was Carnegie Mellon University.  We had a very well equipped type lab run by Jack Stauffacher so we just hand set most of our work in foundry type. While I originally only used transfer type for layouts, after a few years, I used it for camera-ready art as well.  It was way cheaper than Typositor output.</p>
