      <p>My first job out of grad school was an AD position with an arts magazine that was put together with CETA funding. The publisher had decided that the name of this publication was "Vector". I think I showed him a hundred comps, mostly made with Chartpak transfer lettering. He rejected all of them.</p>
      <p>One day in the art supply store I saw a Chartpak sheet of a typeface named "Vector". It looked great, so I bought the sheet and comped the word "Vector". The publisher loved it.</p>
      <p>I found out later that Chartpak's "Vector" was really "Neil Bold"!</p>
