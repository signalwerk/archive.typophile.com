      <p>I was a regular "dry transfer" type user starting in high school in the early seventies pretty much up until PostScript fonts came along. Letraset was by far the best, but if I need a typeface they didn't carry, I sometimes used Chartpak, Formatt, Mecanorma, Zipatone, Prestype, and Artype (rarely). </p>
      <p>I first encountered it when a friend of my dad's, who was the in-house designer where he worked, gave me some rub-down type sheets for me to use on model cars when I was about 12. I still remember what the typefaces were: Times Bold, Microgramma, Old Bowery, and Jim Crow. It was very bad stuff, almost like it was on wax paper. No spacing guides. Don't recall the brand.</p>
      <p>The first kind I actually bought was Prestype. Terrible, cheap stuff, bought at a stationery store for use on my high school newspaper. Seemed like you could only get Caslon and Futura Bold. They also carried some Letraset sheets--Helvetica Medium, mostly in large sizes. $2.50 per sheet--expensive! I made the mistake of using a ballpoint pen to rub down the Letraset, resulting in a warped carrier sheet and cracked letters.</p>
      <p>Somehow I got hold of a Chartpak catalog and discovered Bookman Swash, Windsor Bold and "Made By ITC" faces like Avant Garde, Serif Gothic, and Busorama. I got my dad to drive me 35 miles to the nearest art supply store to buy some "Velvet Touch" Chartpak sheets.</p>
      <p>I wonder how many other type designers (or graphic designers, for that matter) in my generation got their first taste of type with rub down lettering. I bet it's a lot.</p>
    html_clean: |-
