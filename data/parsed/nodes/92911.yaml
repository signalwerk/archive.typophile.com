      <p>Prestype, Chartpak, those are names I haven't thought about for years. </p>
      <p>I think my first use of it was in high school, making some graphics for a science project. Then in college a lot of us used it for our design projects as that was before desktop publishing and we couldn't afford professional typesetting. Once I turned pro I used it less often, but it still came in handy sometimes, especially for putting mockup type on colored surfaces or photos. </p>
      <p>I kept my big folder full of transfer sheets for many years — fonts, rules, registration marks, etc. Never used it anymore but hated to discard it, but I finally tossed it away just a few years ago.</p>
