    html: <p>Actually, the logo was designed by Ed Benguiat (at least that's what he told us) and <br>he said that it was a combination of Futura, <br>his Bauhaus typeface (i think) as well as - something else (that's what he said; "something else") , so - it's not really one typeface, but a combination of two or three, plus manual rendering, obviously (like in the O's) <br>But there's a load of these kind of geometric typefaces such as Bauhaus, if you need to imitate or something like that (like the fore-mentioned 'chalet' typeface)  <br>anyway, it's a nice logo - i like it <br>Regards, <br>Amp84</p>
    html_clean: <p>Actually, the logo was designed by Ed Benguiat (at least that's what he told us) and <br>he said that it was a combination of Futura, <br>his Bauhaus typeface (i think) as well as - something else (that's what he said; "something else") , so - it's not really one typeface, but a combination of two or three, plus manual rendering, obviously (like in the O's) <br>But there's a load of these kind of geometric typefaces such as Bauhaus, if you need to imitate or something like that (like the fore-mentioned 'chalet' typeface)  <br>anyway, it's a nice logo - i like it <br>Regards, <br>Amp84</p>
