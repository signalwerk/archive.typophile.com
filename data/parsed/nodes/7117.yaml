    date_raw: 12 Oct 2004 — 5:54pm
    votes: null
    html: <p>I don't think it's Chalet, as bloomingdale's logo predates that font by many years. I wouldn't be surprised, though, if Chalet (particularly the '70) was inspired by the bloomingdale's corporate identity stuff. <br> <br>My personal guess is that it's a modified version of <a href="http://www.myfonts.com/fonts/linotype/itc-avant-garde-gothic/itc-avant-garde-ce-gothic-book/testdrive.html?s=bloomingdale%27s&amp;p=48">ITC Avant Garde Book</a>. Certain details match, like the narrow 's', the tiny aperture on the 'e', and the tall dot on the 'i'. <br> <br>I vaguely recall that some of the characters in Avant Garde had "bubbly" alternates. However, it's quite hard to track these down. My best guess is that Bloomingdale's commissioned custom font modification for their logo and catalog.</p>
    html_clean: <p>I don't think it's Chalet, as bloomingdale's logo predates that font by many years. I wouldn't be surprised, though, if Chalet (particularly the '70) was inspired by the bloomingdale's corporate identity stuff. <br> <br>My personal guess is that it's a modified version of <a href="http://www.myfonts.com/fonts/linotype/itc-avant-garde-gothic/itc-avant-garde-ce-gothic-book/testdrive.html?s=bloomingdale%27s&amp;p=48" class="link-external">ITC Avant Garde Book</a>. Certain details match, like the narrow 's', the tiny aperture on the 'e', and the tall dot on the 'i'. <br> <br>I vaguely recall that some of the characters in Avant Garde had "bubbly" alternates. However, it's quite hard to track these down. My best guess is that Bloomingdale's commissioned custom font modification for their logo and catalog.</p>
