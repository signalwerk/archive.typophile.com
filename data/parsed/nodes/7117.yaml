    date: 2004-10-12T19:54:00
    date_raw: 12 October 2004 - 7:54pm
    votes: null
    html: <p>I don’t think it’s Chalet, as bloomingdale’s logo predates that font by many years. I wouldn’t be surprised, though, if Chalet (particularly the ‘70) was inspired by the bloomingdale’s corporate identity stuﬀ. <br><br>My personal guess is that it’s a modiﬁed version of <a href="https://web.archive.org/web/20191003100449/http://www.myfonts.com/fonts/linotype/itc-avant-garde-gothic/itc-avant-garde-ce-gothic-book/testdrive.html?s=bloomingdale%27s&amp;p=48"><span class="caps">ITC</span> Avant Garde Book</a>. Certain details match, like the narrow ‘s’, the tiny aperture on the ‘e’, and the tall dot on the ‘i’. <br><br>I vaguely recall that some of the characters in Avant Garde had “bubbly” alternates. However, it’s quite hard to track these down. My best guess is that Bloomingdale’s commissioned custom font modiﬁcation for their logo and&nbsp;catalog.</p>
    html_clean: <p>I don’t think it’s Chalet, as bloomingdale’s logo predates that font by many years. I wouldn’t be surprised, though, if Chalet (particularly the ‘70) was inspired by the bloomingdale’s corporate identity stuﬀ. <br><br>My personal guess is that it’s a modiﬁed version of <a href="https://web.archive.org/web/20191003100449/http://www.myfonts.com/fonts/linotype/itc-avant-garde-gothic/itc-avant-garde-ce-gothic-book/testdrive.html?s=bloomingdale%27s&amp;p=48" class="link-external"><span class="caps">ITC</span> Avant Garde Book</a>. Certain details match, like the narrow ‘s’, the tiny aperture on the ‘e’, and the tall dot on the ‘i’. <br><br>I vaguely recall that some of the characters in Avant Garde had “bubbly” alternates. However, it’s quite hard to track these down. My best guess is that Bloomingdale’s commissioned custom font modiﬁcation for their logo and&nbsp;catalog.</p>
