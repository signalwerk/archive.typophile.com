      <p>I have a similar font, almost identical, you can even have the crossed double O placed in { or } keys. STRICTLY FOR PERSONAL USE.. Called it Bloomies, a mix of SF New Republic and ITC Gothic Avant Guard MD and some other fonts. The small w is just a reversed m from S.F.N.R, rotated the c and e from SF and some other stuff… </p>
