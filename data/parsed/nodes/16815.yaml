    html: |-
      <p>It's by Hideakai Otani, a web/graphic designer from Tokyo. The target audience seems to be graphic designers -- MdN is the publisher of a popular Japanese graphic design magazine.<br>
      It has 128 pages, half in color. To me it looks great.</p>
      <p>Contents<br>
      Visual prologue - Essay on Helvetica typography by Hiroshi (?) Sato, based on material from Haas, with designs by the author.<br>
      1. Information about Miedinger and Linotype's Helvetica.<br>
      2. History of sans serif. Features a digital redrawing of Haas Unica by the author.<br>
      3. Comparison of Helvetica, Univers, and Akzidenz Grotesk.<br>
      4. Tips and tricks from Japanese designers.</p>
      <p>The author also designs fonts. One of them is <a href="http://fontgraphic.jp/2004/pdf/fgm_1.pdf" rel="nofollow">here</a>. I like the [at] mark. The person who was asking recently about 3-sided [at] marks might want to look at it.</p>
