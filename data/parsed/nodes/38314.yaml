    <p>A question raised by a <a href="http://typophile.com/node/38292" rel="nofollow">recent discussion</a>: <strong>what digital tools are type designers using today?</strong> Let's keep the discussion separate, and use this thread only for poll answers.</p>
    <ol>
    <li>On what operating system do you do most of your type design work?<br>
    (Examples: Mac, Windows, Linux)</li>
    <li>In what application do you do most of your letterform drawing?<br>
    (Examples: Illustrator, Fontographer, FontLab, Corel Draw)</li>
    <li>In what application do you do most of your <a href="/wiki/font%20editors" class="freelinking" rel="nofollow">font editing and mastering</a>?<br>
    (Examples: Fontographer, FontLab, DTL FontMaster)</li>
    </ol>
    <p><strong>Rules:</strong> Please, no discussion here. Only one post per user. Only one answer per question. "Both" is not a valid answer -- I recognize that many type designers use both Mac and Windows and more than one or two applications, but for the purposes of this simple poll, please only respond with the primary OS and apps (one for drawing and one for mastering) that you use for the bulk of your work.</p>
    <p>Results and analysis will be published on <a href="/wiki/Typographica" class="freelinking" rel="nofollow">Typographica</a>.<br>
    Thank you for participating!</p>
