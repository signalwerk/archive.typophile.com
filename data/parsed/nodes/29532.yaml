    html: |-
      <p>Well, I took this last one as a challenge, and I think it has defeated me. The counter on the P and R is too big for anything I can find. The J, K, C and S are also hard to find in combination anywhere; and of course the low Ä is really <em>not</em> common at all.</p>
      <p>I pretty much hunted the condensed sansserifs at MyFonts, and the best I could come up with were Storm’s <a href="http://www.myfonts.com/fonts/storm/ohrada/">’Ohrada’</a>, Berthold’s <a href="http://www.myfonts.com/fonts/berthold/akzidenz-grotesk-bq/medium-condensed/">’AG Condensed’</a> and <a href="http://www.myfonts.com/fonts/typeart/silverscreen/">’Silverscreen’</a>, from TypeArt.</p>
      <p>This is a good mystery, because condensed sans faces are used a lot, but I am coming to the conclusion that this is from an obscure source — maybe a small European foundry.</p>
      <p>- Mike Yanega</p>
