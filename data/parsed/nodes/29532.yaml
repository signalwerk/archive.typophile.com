      <p>Thank you for trying, Mike!<br>
      That low Ä was the thing that really caught my attention, not too keen on it, to be honest. It looks very strange in words with double-Ä, and that’s not unusual in Finnish, as you can see in this nonsense sentence:</p>
      <p>“kääntäisitkö äänilevyn kääntöpuolen ääriasentoon?”</p>
