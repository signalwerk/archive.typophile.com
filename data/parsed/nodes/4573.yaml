    html: "<p><i>I am currently trying to obtain type specimen sheets of the phototype clones of Helvetica.</i> <br> <br>Geoff, the book you want is <a href=\"http://www.amazon.com/exec/obidos/tg/detail/-/0823044165/qid=1083681142/sr=1-2/ref=sr_1_2/102-3390448-1113701?v=glance&amp;s=books\" target=\"_blank\">Production for the Graphic Designer</a> by James Craig. It was first published in the '70s. The list I compiled (above) is mainly from this book, which has several pages of specimens set from different manufacturers' equipment.  <br> <br>One caveat: The book has been updated, and the copy I have is one of the older editions. I don't know for sure if this section is in the current edition (after all, nobody uses phototypesetting machines anymore). Perhaps someone else here can confirm this. Otherwise, I would recommend getting it from a bookstore or library so you can examine the book and make sure the specimen pages are in it.</p>"
