    html: <p>Mark, thanks for all that info on the reasons behind the numerous clones of Helvetica. I didnt realise this. <br> <br>I am currently trying to obtain type specimen sheets of the phototype clones of Helvetica. So far I have been able to find Megaron, but no luck on the others. Do any of you know particularly where I could obtain them? <br> <br>One of the things I observed is that URW's Nimbus Sans D has a smaller x-height, as a result it has a lighter tonal weight to it. This is especially noticable in blocks of text. <br> <br><img src="http://www.typophile.com/forums/messages/83/35060.gif" alt=""> <br> <br>Nimbus Sans D seems to be based on the original Haas Helvetica not LT's Helvetica Neue (the end serif on the leg of R seems to imply this)  <br> <br>Metadox, I hope you don't mind me using the word "Real." as "R" and "a" are often where differences in Helvetica are identified. <br> <br><img src="http://www.typophile.com/forums/messages/83/35061.gif" alt=""></p>
