    html: "<p>URW seems to have digitized at least 4 (!) different optical sizes of Helvetica, along with Helvetica Neue. (Here I'm talking about the Bold, since that's the weight I can remember seeing most in display type.) <br> <br>Nimbus Sans T: This one is more like the Linotype digitizations I posted here, with heavier stroke weight and more dramatic curves on the 'R' and 'a'. <br> <br>Nimbus Sans D: Intended for display -- this is what I used to make the sample. <br> <br>Nimbus Sans P: The P is for Poster. Intended for even larger sizes! Looks like the glyphs are thinner still, and spaced more closely together by default. <br> <br>Nimbus Sans L: Not sure what this is meant for, but it seems to resemble the text faces more than the display faces. <br> <br>I think these are all based on the pre-Helvetica Neue designs, because in <i>addition</i> to this, URW also has many of the same optical variations of \"Nimbus Sans Novus\", which presumably is a digitization of Helvetica Neue (and has SC/OsF!?!). <br> <br>Though I don't have a type designer's eye to tell you if these faces are well-digitized*, I am really liking the robustness of the Nimbus Sans family. Has any other foundry done this with their Helvetica equivalent? <br> <br>* One weird thing with URW fonts, is that URW will (or at least would, at a time) provide the outlines to different licensees in their Ikarus format, and they can do things like alter the curves (maybe), metrics, kerning, hinting, etc. (definitely) in the process of generating T1's, so not all URW digital fonts you get are equal, especially if they came bundled with something else!</p>"
    html_clean: "<p>URW seems to have digitized at least 4 (!) different optical sizes of Helvetica, along with Helvetica Neue. (Here I'm talking about the Bold, since that's the weight I can remember seeing most in display type.) <br> <br>Nimbus Sans T: This one is more like the Linotype digitizations I posted here, with heavier stroke weight and more dramatic curves on the 'R' and 'a'. <br> <br>Nimbus Sans D: Intended for display -- this is what I used to make the sample. <br> <br>Nimbus Sans P: The P is for Poster. Intended for even larger sizes! Looks like the glyphs are thinner still, and spaced more closely together by default. <br> <br>Nimbus Sans L: Not sure what this is meant for, but it seems to resemble the text faces more than the display faces. <br> <br>I think these are all based on the pre-Helvetica Neue designs, because in <i>addition</i> to this, URW also has many of the same optical variations of \"Nimbus Sans Novus\", which presumably is a digitization of Helvetica Neue (and has SC/OsF!?!). <br> <br>Though I don't have a type designer's eye to tell you if these faces are well-digitized*, I am really liking the robustness of the Nimbus Sans family. Has any other foundry done this with their Helvetica equivalent? <br> <br>* One weird thing with URW fonts, is that URW will (or at least would, at a time) provide the outlines to different licensees in their Ikarus format, and they can do things like alter the curves (maybe), metrics, kerning, hinting, etc. (definitely) in the process of generating T1's, so not all URW digital fonts you get are equal, especially if they came bundled with something else!</p>"
  - id: 33718
    user: 1043
    date: 2004-05-04T07:25:00
    date_raw: 4 May 2004 — 7:25am
    votes: null
    html: <p>Metadox, thanks for pointing out the various versions of Nimbus Sans. I had not looked at it very closely before, assuming it to be similar to the rest. I'm especially surprised to see that URW did the display versions, which match the old display versions of Helvetica.  <br> <br>As you point out, the display versions of Helvetica were distinctly different from the text versions (which are what nearly all of the digital versions--clones or not--are based on). It's too bad Linotype has not released such a version. Helvetica Neue is fine, but the old display version has some merits, especially for anyone trying to capture the look that made it so popular in the '60s and '70s. The text versions (or even Neue) don't do it.  <br> <br>I've often wondered why Linotype has never done a display version of Helvetica, and now I think I know why. In metal, the display version was only available from Haas, and all the "cold" display type (film fonts, rub downs, etc.) got their Helvetica from Haas, not Linotype. Linotype was traditionally a machine composition system used mainly for text even when they went to phototype. Linofilm Helvetica only went up to 36 point. Looking at it in one of my old specimen books, it looks exactly like Linotype's digital version. The Linotype metal version only went up to 14 point. So, that may be why Linotype has never released the display version--they never had it in the first place.</p>
