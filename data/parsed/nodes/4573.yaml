  html: <p>G'day, <br> <br>I am currently doing university research on Helvetica. I will be comparing and identifying clones and lookalikes (or rip-offs) of the 1951 Haas  Helvetica. <br> <br>I am not sure if this post is appropriate for the Type Identification Board. But it would be greatly  appreciated if any of you could spare your time and knowledge on Helvetica clones and rip-offs (lookalikes) and help me identify them. <br> <br>Name the typeface, if you can specify the type foundry that created it. <br> <br>If you can help, great! Thanks. <br> <br>Cheers</p>
  html_clean: <p>G'day, <br> <br>I am currently doing university research on Helvetica. I will be comparing and identifying clones and lookalikes (or rip-offs) of the 1951 Haas  Helvetica. <br> <br>I am not sure if this post is appropriate for the Type Identification Board. But it would be greatly  appreciated if any of you could spare your time and knowledge on Helvetica clones and rip-offs (lookalikes) and help me identify them. <br> <br>Name the typeface, if you can specify the type foundry that created it. <br> <br>If you can help, great! Thanks. <br> <br>Cheers</p>
