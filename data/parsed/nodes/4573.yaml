    html: "<p>Many of these are obsolete now since everything went digital in the eighties: <br> <br><b>Claro</b> (Alphatype, phototype) <br><b>Helios &amp; Helios II</b> (Compugraphic, phototype) <br><b>Triumvirate</b> (Compugraphic, phototype and digital) <br><b>Geneva</b> (Graphic Systems and Singer, phototype, not to be confused with the Mac system font of the same name) <br><b>Vega</b> (Harris Fototronic, phototype) <br><b>Newton</b> (Photon, phototype) <br><b>Helvestar</b> (Star Graphics, phototype) <br><b>Megaron</b> (Varityper/AM, phototype) <br><b>Swiss 721</b> (Bitstream, digital) <br><b>Arial</b> (Monotype, digital) <br><b>Nimbus Sans</b> (URW, digital) <br> <br>There were some metal faces that might qualify (such as certain weights of Ludlow's Record Gothic), but I don't know that I would call any of them clones as much as competing expressions of the same general idea. They were clones in the sense that you couldn't use Helvetica on a Ludlow machine (Helvetica was only available for Linotype machines), so Record Gothic was offered as a substitute.  <br> <br>Most of the phototypesetting faces listed above were offered for similar reasons, but were nearly indistinguishable from Helvetica. <br> <br>Arial is an unusual case in that it was created specifically as a substitute for Helvetica. It was originally for use in PostScript clone laser printers and imagesetters when Helvetica was called for by the print job. It uses the same metrics for all the characters and a similar overall appearance, but differs in its details. It could be thought of as a separate design, except that without Helvetica, it would not exist or have any reason to exist.</p>"
