    html: "<p>Something I just discovered about URW's Nimbus Sans: it's actually closer to the display version of Helvetica, which Mark brought up in an <a href=\"http://www.typophile.com/forums/messages/30/7772.html\">old thread</a>, than either the original Linotype digitization or Lino's Helvetica Neue. Notice how the bold weight is slightly lighter and how, partially as a consequence of this, the counters on the 'a' seem wider. (This is more like the version of Helvetica you see on things like NYC subway entrances and old Lego boxes from the '70s and '80s.)  <br> <br><img src=\"http://www.typophile.com/forums/messages/83/35055.jpg\" alt=\"\"></p>"
