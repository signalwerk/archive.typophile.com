      <p>I want to clarify some things regarding the AC/DC logo. In July of 1976 I was hired by Bob Defrin of Atlantic Records to design some lettering for the AC/DC album called "High Voltage." This was not a logo, but lettering for the album. In April of 1977 he hired me to design the current orange beveled AC/DC logo for an album. This was just a job like any other record job: you did some sketches and you did a finish. I have never really used that art for promoting myself as it was probably one of only two jobs in my career that shared an unusual quality in my work: it was all made out of straight lines. This was not particularly virtuosic for one who prided himself on custom hand lettering. I have recently resurrected my credit for it as it seems to touch a lot of generations. This and some guitar playing has indeed made me cool with all my children's friends. How's that?!</p>
      <p>I would like to make one other comment as to the design, as this seems to be often disputed, particularly with writers who speculate and not seek a source. This logo seems to be one of the first heavy metal, goth-style logos, but its origins are misunderstood. No, there are not meant to be any fascist undertones...I designed a piece of lettering for a live Blue Öyster Cult  album for John Berg called "On Your Feet or On Your Knees." The album showed a church on the front with the Cults' limo on the cover. The back was a photo by Don Hunstein of me holding a bible with the credits on it. My thought on the cover was to take the metallic car marque idea and combine it with lettering reminicent of the Bible. I remembered this lettering when designing one of the AC/DC sketches and used this as my source. So you see that this logo is more Gutenberg than goth...<br>
      As for typefaces, I have seen an attempt in the December issue of Guitar World magazine with Dimebag Darrell on the cover, but I had nothing to do with that. As for parodies, they are what they are.</p>
