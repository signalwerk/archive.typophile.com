      <p>&gt;in the AC/DC logo.<br>
      &gt;- Is all this merchandising legal?<br>
      &gt;- Has the use of the logo a liscence agreement with the designer?<br>
      &gt;- Is it ilicit to tweek it with out previous consent from the band or the designer?</p>
      <p>– Probably not, somebody will have ripped it off to sell cheap t-shirts somewhere.<br>
      – The licence probably belongs to the band or the record label.<br>
      – Are you likely to get consent to parody/satirise the band? With or without that consent, are you doing something that you would be happy if somebody did to your work? I think if you have any doubt it is probably worth getting a proper legal opinion before proceeding.</p>
      <p>Tim</p>
