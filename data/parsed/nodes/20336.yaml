    <p>Hi.</p>
    <p>My question regarding this subject is double.<br>
    First obviously, clarify who designed the logo<br>
    and if it was ever turned into a whole typeface?<br>
    <a href="http://www.ac-dc.net/" title="http://www.ac-dc.net/">http://www.ac-dc.net/</a></p>
    <p>My second questions is a bit more legally-wise.<br>
    This is a wellknown logo,<br>
    and it is easy to see it around,<br>
    being sold printed to t-shirts aand other parafernalia.</p>
    <p>Is all this merchandising legal?<br>
    Has the use of the logo a liscence agreement with the designer?<br>
    Is it ilicit to use it with out previous consent from the band or the designer?</p>
    <p>it is not like i am going to open a "club de fans of AC/DC"<br>
    and sell merchandising of them to make a living.</p>
    <p>All this questions are for better knowledge of subject,</p>
    <p>Here the last follow up questions,<br>
    is until what point is it legal or ilegal tu use this or another logo,<br>
    and tweek it for a new design.</p>
    <p>In my case, i have designed a t-shirt for a limited editions brand in NY<br>
    and have used the same letterstyle to create a satire or parody,<br>
    as asked by my clientes... Basically I was asked to change AC/DC to AD/HD...<br>
    Now the cliente and friends want to printed for a limeted edition of 120 Tshirts,<br>
    but are unsure about if it is legal or not.</p>
    <p>Please let me know your thought and share your knowledge about subject.<br>
    Surely Miss Tiffany will have to say.<br>
    To her or to however can bring light to subject,<br>
    thanks.</p>
