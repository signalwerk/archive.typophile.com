    <p><a href="/wiki/Steffen%20Sauerteig" class="freelinking" rel="nofollow">Steffen Sauerteig</a>, 1998</p>
    <p>FF Typestar™ is a collection of five unaffected fonts for the working world -- the classic typewriter meeting the demands of modern communication. The four basic weights offer everything necessary for office communication and the OCR variation is a monospaced alternative for more mechanical moments.</p>
