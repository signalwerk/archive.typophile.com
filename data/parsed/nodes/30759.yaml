    <p><span class="caps">FF</span> Typestar™ is a collection of five unaffected fonts for the working world – the classic typewriter meeting the demands of modern communication. The four basic weights offer everything necessary for office communication and the <span class="caps">OCR</span> variation is a monospaced alternative for more mechanical&nbsp;moments.</p>
