    <p>Question on kerning this logo (yes, yes, I know a logo in Helvetica Bold is the most hackneyed thing ever):</p>
    <p>The first one on top is tracked at -50 in Ai using optical spacing. The "t" and "y" overlap. </p>
    <p>The second one separates the "t" and the "y" but then the spacing is less even throughout.</p>
    <p>Which one is correct and why? </p>
    <p>Thanks in advance.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/logo_6279.jpg"></div><p></p>
