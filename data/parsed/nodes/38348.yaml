    <p>Please help,</p>
    <p>When I print postscript a multi page document from InDesign and distill it through acrobat the blank (with no text or images) pages are missing from the PDF.</p>
    <p>Any ideas as to why it would delete/not register these pages?</p>
    <p>Thanks</p>
