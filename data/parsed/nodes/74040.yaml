      <p>Science-fiction movies often do show typefaces being used for signage and the like that are unreadable merely because they look "futuristic". The idea is to create a visual look for the show that is understood by present-day viewers - not to show a realistic look into the future.</p>
      <p>If one thinks about it, as technology improves, better options become available. So business letters went from monospaced typewriting to (in a few cases) proportional-spaced characters with a 1/32" unit from an IBM Executive typewriter to proportional-spaced characters with a 1/60" unit from a daisywheel to typeset (if poorly) text in real typefaces like Times Roman from a laser printer.</p>
      <p>So the future might not see Caslon and Garamond all over the place - but type would be very readable and visually appealing. Instead of Microgramma and Stop and Amelia, if one still wanted something that looked a little "futuristic"... Optima might be an option for the visual look of a science-fiction TV show.</p>
      <p>But in the real world, Baskerville would be likelier. Or Goudy Old Style. But a present-day audience just wouldn't react to that the way makers of a sci-fi movie or TV show need.</p>
      <p>I wish they would add small caps to ASCII as a third case like upper and lower case, and put an extra key on the keyboards, but right now Unicode is dead set against that... so I see that as a serious roadblock. (In fact, making italics and bold separate characters instead of stylistic variants would help make it much easier for those variants to be used by ordinary software: but the chance of that seems to be nil.)</p>
