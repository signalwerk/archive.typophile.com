      <p>I have always preferred small caps that are substantially larger than x-height.<br>
      Small caps that are the same size or similar to x-height are too problematic for short acronyms, and historically worked best when tracked out in a way that doesn't work today, when text is set tight with lots of kerning.</p>
      <p>So I think that two kinds of face accommodate acronyms:</p>
      <p>1. Those with small x height and small caps that are much larger, but still not as big as caps.<br>
      2. Those with large x-height and short capitals, generally with ascenders that overshoot cap height: no need for small caps.</p>
      <p>It's also worth noting that if one is designing a typeface for Latin and Cyrillic (and many fonts today are multi-script), and providing uniform features across scripts, then a small-cap height notably larger than x-height is a good idea, because that's a necessity for Cyrillic.</p>
      <p>**</p>
      <p>For figure styles, it seems to me that Quark and InDesign have provided the "pull" for multiple figure styles, by showing the four major variants in the OpenType palette (the implication being that having all four in a font is the default), and OpenType itself has provided the "push", by making it possible to include multiple variants in a single font.</p>
      <p>This isn't just responding to user needs, it's more of a technology/marketplace-driven dynamic.</p>
