      <p>&gt; many acronyms are not only no longer<br>
      &gt; unique but have many possible meanings</p>
      <p>True, although in English there have always been many homophones (words that are pronounced the same but have different meanings), such as  to/too/two and caret/carrot, but that hasn't stopped people from using those words, because the meaning is generally obvious from the context. But I agree it can be confusing at times.</p>
      <p>As for small caps for acronyms, my general impression (perhaps wrong) is that they are mostly used in publications that have a more sophisticated use of typography, but are seldom used in more "everyday" typesetting (business communications, newspapers, websites, and so forth).</p>
