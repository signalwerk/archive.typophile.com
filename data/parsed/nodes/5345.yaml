  html: <p>As you may know, Quark has made the decision not to support OpenType and Unicode in their Mac <span class="caps">OS</span>/X product.  Most font problems in QuarkXPress 6 relate to the use of language fonts like <span class="caps">CE</span>, Greek, Cyrillic, or any Type1 font that has a non MacRoman encoding. <br><br>Type1 fonts in Mac <span class="caps">OS</span>/X rely on the new Apple Quartz system to deﬁne a codepage for the correct encoding. This however is not performing as expected, and is unlikely to be addressed by Apple as the Type1 font format is seen by Adobe and Apple as redundant. <br><br>The <span class="caps">DTP</span> Types hfont Format <br><br>At <span class="caps">DTP</span> Types Limited, we have developed a hybrid font format that performs like a Type1 font in QuarkXPress for Mac <span class="caps">OS</span>/X for any encoding. We call this new format ‘hfont’ format. hfonts also work well in all other Mac <span class="caps">OS</span>/X applications that we have tested (Adobe InDesign, Illustrator, Photoshop, Microsoft Word, Nisus Writer, Apple Text Edit). They perform like any other font in the system and can be installed via ‘Fonts’ folders or by any font manager software (e.g. Suitcase). The new format does not solve the problem of passing non-Unicode text to Unicode applications or Unicode text to non-Unicode applications. The new hfonts will not work in Mac <span class="caps">OS</span>/9. <br><br><span class="caps">DTP</span> Types hfont Availability <br><br>All <span class="caps">DTP</span> Types fonts are available in hfont format at the same cost as Type1 fonts. We can also create hfont format fonts from any other font manufacturer, providing their license agreement allows this, or there is permission from the manufacturer for us to create the fonts for you. The creation of fonts from other foundries is a chargeable service, the price is available on application. <br><br>A trial hfont format font is available from our web site. <a href="http://www.dtptypes.com" target="_blank">http://www.dtptypes.com</a> <br></p>
