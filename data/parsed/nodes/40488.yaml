      <p>You'll have to be careful with the Y not to look as a V. I was also thinking of the swiss cross to use instead of a full T, but I was thinking of it to lift it up to line it up as if it was a T (just as if you would remove the bottom curve from the T and leave the cross lifted).</p>
      <p>Otherwise I'm leaning more toward C version compared to A nd D. You could also give some stem slant on letter "c" in CH. And maybe even on the right side of U but with backward slant to close it a bit and make it a bit less squarish and rigid.</p>
