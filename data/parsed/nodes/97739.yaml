    <p>Most of the fonts I own have the dollar symbol with only one vertical stroke, and sometime of those the stroke doesn't go all the way through the S shape instead simply projects from top of the S shape and from the bottom of the S shape.</p>
    <p>But almost all old school typewriting machines have a double vertical stroke.</p>
    <p>Most advertizements featuring price in dollars use a single vertical stroke. But, throughout the Hip Hop culture the double vertical stroke is most common.</p>
    <p><a href="http://www.google.ca/search?hl=en&amp;q=hip+hop+dollar+sign+pendant&amp;bav=on.2,or.r_gc.r_pw.r_qf.&amp;bpcl=37189454&amp;biw=1269&amp;bih=875&amp;um=1&amp;ie=UTF-8&amp;tbm=isch&amp;source=og&amp;sa=N&amp;tab=wi&amp;ei=msKSUKqVCcqd2QWhyYGgAg" title="http://www.google.ca/search?hl=en&amp;q=hip+hop+dollar+sign+pendant&amp;bav=on.2,or.r_gc.r_pw.r_qf.&amp;bpcl=37189454&amp;biw=1269&amp;bih=875&amp;um=1&amp;ie=UTF-8&amp;tbm=isch&amp;source=og&amp;sa=N&amp;tab=wi&amp;ei=msKSUKqVCcqd2QWhyYGgAg">http://www.google.ca/search?hl=en&amp;q=hip+hop+dollar+sign+pendant&amp;bav=on.2...</a></p>
    <p>So what gives? Which one is 'proper'?</p>
    <p>FYI, from Wiki...</p>
    <blockquote><p>The best documented explanation reveals that the sign evolved out of the Spanish and Spanish American scribal abbreviation "ps" for pesos. A study of late eighteenth- and early nineteenth-century manuscripts shows that the s gradually came to be written over the p developing a close equivalent to the "$" mark</p></blockquote>
    <blockquote><p>There is a theory that the dollar sign goes back to the most important Roman coin, the sestertius, which had the letters 'HS' as its currency sign. When superimposed these letters form a dollar sign with two vertical strokes (the horizontal line of the 'H' merging into the 'S'). </p></blockquote>
    <p>n.</p>
