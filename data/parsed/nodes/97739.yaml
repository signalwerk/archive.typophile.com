      <p>Thanks Nick!</p>
      <p>I got a commish to design a huge backdrop for a Hip Hop artist's photo shoot, a major element of which is a ten foot tall hand drawn dollar sign. I designed the dollar sign with double vertical strokes because because compositionally  speaking I think the double vertical stroke has more tension reacting with the S shape of the dollar sign ...and bonus as it turns out that that form of dollar sign is by far the most common throughout the Hip Hop and Rap community. </p>
      <p>So that would be nu skool youts using old school representation as a means of modern communication evolution.</p>
      <p>n.</p>
