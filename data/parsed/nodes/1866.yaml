  html: <p> I just thought id post something about how much commission type distributors take from sales of foundry typefaces. MyFonts is pretty good at 20%, as is a large US distributor again at about the same. A UK distributor is offering 50/50 which sounds pretty sucky. What do people think to this? What are your experiences? </p>
