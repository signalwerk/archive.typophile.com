    html: <p>As a regular I font buyer I would rather buy from smaller outfits provided goods are of high quality (well tested, superb outlines, interpolation, kerning, design, etc)  <br>The reason is that I will often get fonts that are less circulated which translates to greater value for branding. Who wants to use fonts in branding that are obtained by thousands of designers worldwide? I think the idea of branding is to establish a unique look and feel and less distributed type (or even better-original type) is what is needed.  The problem is that it is hard to find these gems, and once you find them it seems only a short matter of time before these outfits start reselling through the big distributors.  Take Typotheque as an example. Peter Bilak is in my opinion one of the best designers around. His fonts are superb technically as well as unique in design.  He used to distribute via FontShop and then started Typotheque to distribute new designs. <br>Other than typophiles who would ever find the little Dutch foundry Typotheque?  Well good design sells and next thing you know Peter is doing display ads in the great GB magazine Eye to promote his Fedra face, then distribution follows with Myfonts... his Fedra is too sweet to not mass distribute, but does this actually depreciate it's value in Branding? I does in my book but  <br>what does the rest of you typophiles think? Is it the designers who use these fonts responsibility to know  <br>how many are in circulation when approaching a client with type choices for projects? Are most fonts tracked by distributors and if so do they willingly give this information to the designers that buy?  <br> <br>PS. this did not stop me from ordering additional styles and weights.  </p>
