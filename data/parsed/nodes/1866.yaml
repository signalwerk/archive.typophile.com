    html: <p>Ancient thread revival. <br> <br>Jeremy Tankard very sensibly links percentages to marketing. When he enters into a distribution deal, he insists on receiving copies of all the distributor's promotional material. If he does not feel that his fonts are being adequately marketed, he will either cancel the deal or insist that the percentages be changed. If a company is willing to actively market his fonts, Jeremy is willing for them to take a higher percentage but, quite rightly, he isn't going to sit around waiting for pennies from someone who just wants to pad the size of their generic font library.</p>
