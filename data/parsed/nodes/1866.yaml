    html: <p> Why not go with a reputable foundry and get  <br>the best of both worlds. <br> <br>Consider FontFont or Emigre or Font Bureau  <br>(or a handful of others I'm forgetting). They  <br>have a good reputation for treating designers  <br>well with some of the best royalties available  <br>(these are designer-run foundries, unlike  <br>some of the other big behemoths). <br> <br>But the equation doesn't end with royalties.  <br>The other benefit is having a distributor  <br>(foundry) with some muscle (reputation and a  <br>solid distribution channel) promote your work  <br>because they believe in it.  <br> <br>Adding your face to Myfonts may be a good  <br>way to set up an online commerce option, but  <br>the reason they can offer such high royalties  <br>is because they're spending very little to  <br>promote _individual_ fonts. Instead they  <br>promote their site -- leaving designers to hope   <br>people can find their fonts. <br> <br>In the end ask yourself if it make sense to  <br>get 100% of royalties from your micro foundry  <br>(or 80% with MyFonts) if all of 7 people ever  <br>find (let alone buy) your font? </p>
