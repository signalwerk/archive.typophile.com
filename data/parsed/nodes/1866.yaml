    html: <p> In addition to Joe's comments, I'll just add that the other thing that happens with, say, Adobe, is that we do production and testing work on every font we add to our library. It is essentially remanufactured to Adobe's standards, which can include outline fixes, kerning, rebuilding with our tools, and extensive testing. <br> <br>That's just for licensed, non-exclusive designs. "Adobe Originals" have a much more extensive co-development cycle. <br> <br>However, it's true that the royalty rates paid by Adobe tend to the low end of the ranges being discussed. It's just a tradeoff. Also, Adobe tends to be on the high end for volume sold (not that that's saying much, when you're talking fonts!). <br> <br>T </p>
