    html: "<p> Stuart, great practical advice - thanks. Just one thing: <br> <br>&gt; Some places want exclusivity, and for that, you'll always get a higher royalty 50% or better. <br> <br>Most of the more prominent font houses will give you a lot less than 50% even with exclusivity. Some of them keep up to 85% for themselves! <br> <br>I personally think MyFonts is a great choice for many because the *mechanics* of viewing and selling (24hr credit card charging, dynamic character string display) are there. But it seems to me that *promotion* is still something you have to do yourself if you're going with MyFonts - which actually makes good sense if your target is a niche market. <br> <br>BTW, Bitstream also seems to have some very flexible and fair plans for font licensing, and they actually do some promotion. <br> <br>hhp </p>"
