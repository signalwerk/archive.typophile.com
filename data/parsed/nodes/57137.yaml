    <p>Looking to get some critique on a new logo for a client, World of Beer.  I am not formally trained in typography and graphic design, so I am unsure as to where to align the letters in "World of Beer". A couple questions...</p>
    <p>1. Should the "W" and the "B" sit slightly below the baseline because they are larger than the other letters?<br>
    2. Should the "o" in "World" also sit slightly below (but still a bit higher than the "W" and the "B") because it has a rounded lower extent?<br>
    3. I currently have the horizontal line below the "World of Beer" centered on the bottom left point of the "W" in "World" and the bottom right point of the "R" in "Beer". Is this correct? Should the right side of the line be aligned with the upper-right rounded part of the "R" in "Beer"? Should the left side of the line be aligned slightly to the left of where it is now?<br>
    4. The clear space on the left and right sides around the logo is currently calculated from the edges of the horizontal line. I'm unsure if this is correct, as it currently looks a bit off. This might be corrected by adjustments made from answers to previous question.</p>
    <p>Any other comments and critiques are welcome. Thanks in advance for the advice.</p>
    <p>Cheers,<br>
    J.W.</p>
