      <p>the client already had a logo with the exact same "World of Beer" but a different globe (some pretty cheesy stock art looking globe), and they wanted to stay with the same "World of Beer" part so they only had to replace the globe on the big sign on their building, instead of replacing the entire thing. So, the "World of Beer" part was not my design, just the globe. But it's not too late to change little aspects of it. I too have always thought that the "of" was just floating in mid-air. At this point, I don't think i'll be able to make a change as drastic as dropping it to the baseline, but i could make the "o" the same size as the "f" and align the top of them with the median line (see changes below). </p>
      <p>Another person left a comment about the stroke weight needing to be uniform. I'm working on that right now. It's taking a little while b/c i dont actually have this particular font. I actually had to trace the old logo b/c all the client had was a TIFF file. </p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/worldofbeer_new_5930.jpg"></div><p></p>
