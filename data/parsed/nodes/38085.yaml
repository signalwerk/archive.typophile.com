    <p>Hi there,</p>
    <p>Nurembergs (Bavaria, Germany) radio station <a class="freelinking-external" href="http://www.hitradion1.de">HIT RADIO N1</a> communicates with a new designed logo from now on. What do you think? </p>
    <p>This is the new one:<br>
    </p><div class="imageWrap"><img src="/files/N1-Nx_4836.jpg"></div><p></p>
    <p>This is the old one:<br>
    </p><div class="imageWrap"><img src="/files/N1-Ox_4144.jpg"></div><p></p>
    <p>No. HIT RADIO N1 is not an 80s station. Their playlist consists of todays hits in pop, hip hop &amp; r’n’b. Their listeners age ranges from 12 to 30... yes...</p>
    <p>So, what do you think?</p>
    <p>Best, Frederick</p>
