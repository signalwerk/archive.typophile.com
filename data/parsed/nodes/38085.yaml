    html: <p>I think it looks great! It is appropriate for the demographics and the type of music they play. It is a very nice looking logo. My only critique is that the spaces between “RADIO N1” and “N1 92.9” are very close together, while the space in “HIT RADIO” appear looser. Otherwise, well done!</p>
