    votes: null
    html: <p>Way better than the old one, which seems busy and cluttered ... one of those logos that looks great for a week or two, and then grows cloying. The new logo might have a longer lifespan (although radio stations tend to change their visual identity about as frequently as they change station managers.)</p>
