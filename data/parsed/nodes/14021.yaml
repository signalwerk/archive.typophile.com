    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a>: <a href="/wiki/Designers" class="freelinking" rel="nofollow">Designers</a>: Jonathan Barnbrook</strong></p>
    <p><strong>Jonathan Barnbrook</strong> (b. 1966) is a British graphic designer, type designer and typographer. He studied graphic design at <a href="/wiki/Central%20Saint%20Martins%20College%20of%20Art%20and%20Design" class="freelinking" rel="nofollow">Central Saint Martins College of Art and Design</a> and the <a href="/wiki/Royal%20College%20of%20Art" class="freelinking" rel="nofollow">Royal College of Art</a> from 1985-1992, before starting his career as an independent graphic designer. Formerly of <a href="/wiki/Emigre" class="freelinking" rel="nofollow">Emigre</a>, he now runs his own independent foundry <a href="/wiki/Virus" class="freelinking" rel="nofollow">Virus</a> in London. Work includes the Roppongi Hills logo and collaborations with British artist Damien Hirst. Emigre fonts include <a href="/wiki/Exocet" class="freelinking" rel="nofollow">Exocet</a> and <a href="/wiki/Mason" class="freelinking" rel="nofollow">Mason</a>. </p>
    <p>Barnbrook: <a href="http://www.barnbrook.net/" rel="nofollow">http://www.barnbrook.net/</a><br>
    Virus: <a href="http://www.virusfonts.com/" rel="nofollow">http://www.virusfonts.com/</a></p>
