      <p>If this is the typeface you wish to use that is ok. This is a good swash face to work with. But instead of seeing it as letters what if you view them simply as shapes? Make a pattern or a patchwork quilt?</p>
      <p>I’d suggest seeing how the Queen of Swash (amongst other things), <a href="http://www.bantjes.com/">Marian Bantjes</a> uses the swash in her designs.</p>
