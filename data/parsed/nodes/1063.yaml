    html: <p> "it's illegal to embed Emigre fonts in Flash." <br> <br>OH PURLEEZ! <br>Assuming this is true, what planet do these guys live on? And why are type foundries not more realistic when theyre drawing up their licenses? So I cant use Emigre fonts in PDFs (assuming the problem is with embedding) and Flash files? Just as daft is the idea that printers should buy their own copies of fonts. Yeah right. </p>
