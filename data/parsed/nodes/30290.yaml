  html: |-
    <p>Hello all,</p>
    <p>My registration for Typophile FINALLY kicked in after 2 weeks (and 1 day) of waiting for my activation e-mail.  So, I'm celebrating by requesting the name of a font, if at all possible. :-P</p>
    <p>This is an unusual request - many people on here are asking for typefaces used in magazines, films, etc. ... the typeface I'm looking for comes from a game.  As the name implies, and as you're probably wondering when I'm going to get around what I'm actually asking for, the font used in the dialogue bubbles in "The Legend of Zelda: Ocarina of Time" for Nintendo 64 (the good old days).</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/greatdeku_3866.jpg"></div><p></p>
    <p>This is just a sample... other (more complete) examples are:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/zelda1_3698.jpg"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/zeldasecond18_5494.jpg"></div><p></p>
    <p>(Please note: this font is used for both Nintendo 64 games...Ocarina of Time as well as Majora's Mask.)  The most prominent feature, to me at least, is the way the exclamation mark seems to be curved/slanted slightly...also the roundness of the font is noticeable...</p>
    <p>I've been wondering this for ages, and I do apologize for the lengthy post.  Any help/guidance would be greatly appreciated!</p>
    <p>Thanks!<br>
    -BT7</p>
