    html: <p>I looked around for a while, but couldn't ID it. It seems to be a modulated sans-serif, along the lines of the much-discussed <a href="http://beorcana.com/welcome.html" rel="nofollow">Beorcana</a>. I checked out <a href="http://www.myfonts.com/fonts/linotype/optima" rel="nofollow">Optima</a>, as well as Amira, Amerigo, and others on MyFonts, to no avail. <a href="http://www.myfonts.com/fonts/ef/renova" rel="nofollow">Renova EF</a> is the closest match I've found so far, but it was designed in 2006. The font used on the Wii's menus has yet to be identified as well, so maybe Nintendo gets all their typefaces from one, midly obscure source.</p>
    html_clean: <p>I looked around for a while, but couldn't ID it. It seems to be a modulated sans-serif, along the lines of the much-discussed <a href="http://beorcana.com/welcome.html" rel="nofollow">Beorcana</a>. I checked out <a href="http://www.myfonts.com/fonts/linotype/optima" rel="nofollow">Optima</a>, as well as Amira, Amerigo, and others on MyFonts, to no avail. <a href="http://www.myfonts.com/fonts/ef/renova" rel="nofollow">Renova EF</a> is the closest match I've found so far, but it was designed in 2006. The font used on the Wii's menus has yet to be identified as well, so maybe Nintendo gets all their typefaces from one, midly obscure source.</p>
