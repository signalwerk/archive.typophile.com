      <p>I'm thinking this was custom and Nintendo had developed it internally, they've always had the creative talent. It's very possible this font has only ever existed as single character bitmaps created for the game. </p>
      <p>There were quite a few N64 games they released that had unique typefaces I'd never seen before (e.g. there was a great script in Mario Kart 64) or since.</p>
