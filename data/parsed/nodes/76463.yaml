      <p>You can show your work, as long as you make very clear that it was done while working at the company you where working at that moment. If you are clear about that, it shouldn't be a problem.<br>
      I mean: don't just show the pretty pictures... add a line of two of text telling the story about it.</p>
      <p>As an example: I've been running a little website design agency for severals year now, and I don't have any problem when designers that no longer works for me, shows the work they did when working whit us, in his own portfolios. As long as they states that the work was done for my company.</p>
