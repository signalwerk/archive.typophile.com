      <p>Since you're showing the work publicly, the proper thing to do would be to ask your former employer for permission to show the work. Your employment contract with them is only one detail, they also had contracts with the clients, which frequently include NDAs and other details.  </p>
      <p>If you do show the work, be very clear about what your role was in the project and give credit to your collaborators.</p>
