    <p>I'd like to get a temperature readout from fellow designers about using work from a previous employer to hock your own future endeavors.</p>
    <p>Same old story, worked for a company, did a lot of great work, but since I'm no longer with the company, I can't really show it. I left to do my own thing, to fix the problems I continually saw that no one would let me really address correctly, but being able to get work relies heavily on your ability to show you can do the work.</p>
    <p>I have a couple of clients who are friendly with me, who will utilize me, rather than the company where I was formerly employed. They are fine with me using their work as examples of my skills, but as they were done while at another company who does similar projects, who may have those projects listed in their own portfolio, you can see the dilemma. </p>
    <p>Thoughts?</p>
