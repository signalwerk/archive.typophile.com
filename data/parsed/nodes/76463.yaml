    html: |-
      <p>My contract doesn't explicitly state anything, as they never got around to having me sign anything. This was a mistake on their part, but one that works to my advantage. </p>
      <p>Unless I had express permission from the owner of the project, I would never show the work. So anything proprietary or unreleased wouldn't be shown.</p>
      <p>I've thought about the imaginary client thing, but as I'm building a new website for the company, and find myself with text but few example images to show, well, you can see why I came to typophile anyway :p I'm doing as much as I can with text and design on the page itself to show my skills, but when I'm discussing usability &amp; design concepts, to not be able to show my work is hampering. And creating project that showed my skills would be even tougher :p</p>
      <p>Thanks for your reply :) More food for thought!</p>
