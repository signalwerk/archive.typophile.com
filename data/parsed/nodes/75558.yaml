    html: |-
      <p>All your accents are very near the letters. A bit more room will increase legibility. The opposite occurs with |i| + accents, with an excessive gap.</p>
      <p>|d| + commaccent is inverted. Hungarumlaut will collide in small sizes, you may space it a bit. Armstrong does not works, IMHO. Slash for |O| is not centered. Slash for |o| seems very heavy.</p>
      <p>Others accents are OK, especially tilde and cedilla.</p>
