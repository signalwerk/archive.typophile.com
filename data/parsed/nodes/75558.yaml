      <p>Just a few weeks ago I came across this website: <a href="http://diacritics.typo.cz/" title="http://diacritics.typo.cz/">http://diacritics.typo.cz/</a><br>
      It's very helpfull for what you're doing right now. One of the things it states is that Polish people won't recognize your grave or acute because they're more horizontal than vertical, so you might change that or make an alternate. The rest has already been said by Freiberger and Cerulean.</p>
