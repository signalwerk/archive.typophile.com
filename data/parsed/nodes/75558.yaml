    html: |-
      <p>Give acute and grave steeper slope so they can more easily be told apart.<br>
      Raise lowercase accents to the upper middle of the ascender space.</p>
      <p>The ring is supposed to be a circle. Usually it's unstressed or at least evenly stressed. The connected form of Å is a compromise for limited space, and should be avoided if possible. To connect lowercase å is never done. And of course the broken thing on Ů/ů is completely unrecognizable.</p>
