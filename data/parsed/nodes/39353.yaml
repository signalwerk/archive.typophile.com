      <p>Well, Vince is a good guy, and an active member of our type and typohile communities. Isn't isn't nice to bash your friends, or people who support your field.</p>
      <p>Sii also works for Microsoft. Personally, I'm glad we have anyone from MS here on the boards at all. It is only natural for him to remind us of how Comic Sans came about, and why. Vinny's brief certainly wasn't "create a new typeface that will destroy western typography and civilization as we know it." Yet, sometime we treat it like that was exactly what some old guys in big suits around a table must have been thinking.</p>
      <p>Someone needs to open up a reality check on the truth of the matter. Sii might be the one to do this over and over again. But only because someone else invariable feels like devoting a thread to the evils of Comic Sans every six months. or six weeks ;-)</p>
