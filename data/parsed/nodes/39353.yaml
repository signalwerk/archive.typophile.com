      <p>Dan:</p>
      <p>I know the story, Vince made comic sans almost as a private joke in a couple of hours, and it made its way onto windows, and blablabla. I dont blame him for that. I blame the world and MS, let's say. but, I dont like the way Vince defends himself, "everyone talks about my type so it's the best in the world", "i dare you, i double dare you"... reminds me of samuel jackson in pulp fiction. i mean, we are getting close to ridiculous on this one.</p>
      <p>I dont see, in Vince's comments, anything which support our field. telling every typographer here that comic sans is superior to everything they might create because people will talk about it for centuries is quite an insult, according to me- "quantity wins over quality". and that's exactly what he said, in another topic - by the way, i'm answering posts here, but i know it is not really the right thread to do so: i'm sorry.</p>
      <p>cheers,<br>
      dr</p>
