    <p> As a follow-on to <a class="freelinking external" href="http://typophile.com/node/39210" rel="nofollow">this thread</a>, here's a challenge of my own: Can folks find examples of "bad fonts" (defined however you will) used effectively? Or beaten-to-death fonts used in new and interesting ways?<br>
     And just to get them out of the way, I already know about <a class="freelinking external" href="http://bancomicsans.com/home.html" rel="nofollow">ban comic sans</a> and <a class="freelinking external" href="http://www.iheartpapyrus.com" rel="nofollow">I ♥ Papyrus</a>. I'm not looking for irony but for actual effective uses of these beasts.</p>
    <p>—Joel</p>
