      <p>I've always considered the Scala family to be quite feminin. You can't get any more "girly" than the lower case "p". From what's I've noticed... a large percentage of female designers tend to go towards scala when using a post modern font in magazine and books. Would that not suggest that it has feminin qualities? </p>
      <p>Ps. does anyone know if "me" magazine is using a scala slab serif? what is that font for titling? I might just post it in the ID forum.</p>
      <p>I think I just opened a can of worms. :(</p>
