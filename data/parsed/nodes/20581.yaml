      <p>I think you have to be careful of patronising people in this<br>
      age group by avoiding cliches. You also have to remember<br>
      that most teenagers aspire to be older! </p>
      <p>I think Dalliance from emigre (<a href="http://www.emigre.com" title="www.emigre.com">www.emigre.com</a>) is sexy,<br>
      but perhaps a bit TOO sophisticated. </p>
      <p>Perla from <a href="http://www.alias.uk.com" title="www.alias.uk.com">www.alias.uk.com</a> has some really sexy alternates,<br>
      and could work well as a headline face (I don't know exactly<br>
      what it is you're designing).  </p>
      <p>If only you could get you hands on Dederon from<br>
      <a href="http://www.typofonderie.com" title="www.typofonderie.com">www.typofonderie.com</a>. I think that would be perfect, but<br>
      unfortunately it's only for Beyonce's fashion line!</p>
      <p>Phil</p>
