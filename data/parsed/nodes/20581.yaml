    <p>Hello</p>
    <p>Can anyone suggest a girlish font (could be a script) that has the vibe of a fairly sophisticated and moderately sexy, confident teenage girl? Not little girl silly like big circles or hearts over the i's, but older and more sophisticated -- hipper and a little edgy.</p>
    <p>Not retro, like a 1950s or 1960s script.</p>
    <p>Could look hand drawn.</p>
    <p>Thanks for any ideas.</p>
