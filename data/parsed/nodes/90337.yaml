      <p><cite> &gt; Any suggestions for a font that might make him happy and may have more than two weights?</cite></p>
      <p>The standard ITC Franklin Gothic family has four weights, I believe — Book, Medium, Demi, and Heavy.</p>
      <p><a href="http://www.fontbureau.com/fonts/GeorgiaPro" rel="nofollow">Georgia Pro</a> has four weights — Light, Regular, Bold, and Black — if you’re just looking to “make the client happy.”</p>
