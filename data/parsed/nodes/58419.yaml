    html: |-
      <p>Rudy, </p>
      <p>one clarification: the digital certificate is for one year, but you can sign as many fonts as you want with it. That means: one certificate, many signatures. So the cost is $499 per year, no matter how many fonts you produce. I agree that this still is costly. </p>
      <p>A more affordable option is to create a "self-signed certificate" -- which can be done <strong>for free</strong>. You will be able to digitally sign your fonts although to the users, the signer will appear as "untrusted". But well, the contents of the digital signatures in fonts isn't really actually checked by any software at this time, Windows only check for their presence. </p>
      <p>Please check the Microsoft <a href="http://msdn.microsoft.com/en-us/library/aa140234(office.10).aspx" rel="nofollow">Digital Code Signing Step-by-Step Guide</a> document. </p>
      <p>You only need to complete steps 1-3 (Download the code signing executables needed to digitally sign code files, Create a test certificate, Create a Software Publishing Certificate (SPC) file). And you will need to use a Windows machine to do that (or the free <a href="http://www.dosbox.com/" rel="nofollow">DOSbox</a> emulator on Mac OS X -- which is actually quite cool). Once you have the private key file and the .spc certificate file that you produce in this process, you can link these files to the Digital signatures section of FontLab Studio’s Preferences/Options dialog box.</p>
      <p>BTW, I just realized that I already answered this on Typophile, but it was three years ago:<br>
      <a href="http://typophile.com/node/29770" title="http://typophile.com/node/29770">http://typophile.com/node/29770</a></p>
      <p>You can check that discussion for more information. </p>
      <p>Cheers,<br>
      Adam</p>
