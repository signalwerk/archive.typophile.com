      <p>For the end user the distinction between OT/TTF and OT/CFF (PS Outlines) matters with regard of outline quality and screen display.</p>
      <p>Unneccessary outline conversions should be avoided, otherwise the outline quality may suffer. That means, if you already have TT outlines with TT hints, use "Generate fonts -&gt; TrueType/OpenType TT" in FL Studio (and check that you want to include OT features and kerning as an OT feature).</p>
      <p>If you have PS outlines, the easiest would be to generate the format "OpenType PS" from FL Studio. If you generate "TrueType/OpenType TT" from PS outlines, an automatic conversion to TT outlines and TT hint will take place. It's better to convert manually and then make adjustments before generating.</p>
      <p>If the fonts will be used on Windows, TT outlines may have a better screen quality, but more manual hinting corrections are needed for that.</p>
