      <p>From a more "official" point of view:</p>
      <p>A font file with the .otf suffix is normally a Postscript flavoured OpenType font and has Postscript outlines and postscript hintning.</p>
      <p>A font file with the .ttf suffix is normally a TrueType flavoured OpenType font and has TrueType outlines and TrueType hinting.</p>
      <p>Makes sense?</p>
