      <p>A TTF font is *already* an OTF font. Just change the extension, and you have an OTF font. It doesn't have what typophiles might call "OpenType goodness" -- contextual alternates, ligatures, etc. -- and it won't have the OT logo on Windows -- only "signed" fonts get that -- but every TTF is technically an OTF.</p>
      <p>An OTF can also encapsulate all the data from a Type 1 font, so a conversion can be lossless. Whether this is actually the case depends on the tool you're using for the conversion.</p>
