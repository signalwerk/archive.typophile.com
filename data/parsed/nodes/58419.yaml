  html: <p>If you make a .otf file from a TT hinted font, does it convert TT into Type 1? What gives a better result, a Type 1 or TT hinted font to make a .otf file?</p>
  html_clean: <p>If you make a .otf file from a TT hinted font, does it convert TT into Type 1? What gives a better result, a Type 1 or TT hinted font to make a .otf file?</p>
