      <p>It still doesn't matter.</p>
      <p>OTF fonts come in two major types: TrueType (which is why any TTF is also an OTF) and Type 1. I assume FontLab will choose the actual type from the hinting in the font, but for the end user it <strong>really</strong> doesn't matter.</p>
