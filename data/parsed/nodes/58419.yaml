    html: |-
      <p>Rudy, </p>
      <p>that is the right summary. </p>
      <p>One more thing to add is that: </p>
      <p><strong>OpenType PS fonts</strong>, i.e. PostScript-flavored OpenType fonts, also known as OpenType CFF fonts (made out of Type 1-hinted PostScript-curve-based VFBs) <strong>must carry the .otf file extension.</strong> They always get a green "O" OpenType icon in Windows. They always are labeled "OpenType font" by Mac OS X. </p>
      <p><strong>OpenType TT fonts</strong>, i.e. TrueType-flavored OpenType fonts (made out of TT-hinted TrueType-curve-based VFBs) <strong>can have either the .ttf file extension or the .otf file extension.</strong> </p>
      <p>If OpenType TT fonts have the .otf file extension, they always get a green "O" OpenType icon in Windows, and they always are labeled "OpenType font" by Mac OS X. </p>
      <p>If OpenType TT fonts have the .ttf file extension, then on Mac OS X they will always be labeled "Windows TrueType font". On Windows, they will get the green "O" OpenType icon only if the font has a digital signature (DSIG, which you can add in FontLab Studio, but you must purchase an Authenticode code signing Class 3 Standard certificate*). If the font doesn't have a digital signature, it will be shown with a blue "TT" TrueType icon on Windows. </p>
      <p>Whether an OpenType TT font has a blue "TT" or green "O" icon on Windows, and whether it is called "OpenType font" or "Windows TrueType font" on Mac OS X, has <strong>nothing</strong> to do with its functionality. It will rasterize the same way, the OpenType Layout features will work the same way. The only difference is the label that appears in Finder, and the icon the font gets in Windows. </p>
      <p>This is something that you need to explain to your customers if you make OpenType TT fonts. If you don't want to explain it to the customers, then always use the .otf file extension or put a digital signature into your fonts. </p>
      <p>BTW, putting a digital signature into your fonts is <strong>advisable for both OpenType PS and OpenType TT fonts</strong>. A digital signature certifies that the font has been created by a certain foundry, and it cannot be forged. So if someone modifies your font, the digital signature will be removed, or will become invalid, or the person who modified the font will have to sign it with their own digital signature (for which they will need to buy their own digital certificate under their own name). Digital signatures won't help you to protect your fonts from being pirated, but at least they are a proof that a certain font is original. </p>
      <p>*) The <a href="http://www.adobe.com/devnet/opentype/afdko/topic_digital_sig_guide.html" rel="nofollow">Adobe guide to OpenType font signing</a> is helpful, but note that you only need to complete step 1 described there. The rest is done automatically in FontLab Studio if you install your certificate in FontLab Studio's preferences. </p>
      <p>Cheers,<br>
      Adam</p>
