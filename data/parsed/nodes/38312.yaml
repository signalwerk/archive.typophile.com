      <p>This is a technical question. I’ll move it to the BUILD area. </p>
      <p>You should be aware that some foundries would consider this modifying the font. Those same foundries do now allow for it. Your best bet might be to contact the foundry from whom you licensed the type and ask if they can supply you with split families. I know Linotype offers this for one.</p>
