    html: |-
      <p>Hmmm<br>
      I assume your finished size is smaller than your<br>
      paper size?<br>
      well if you can't shift the page on the printer<br>
      than you could export a pdf with crops in<br>
      indesign and replace it on a new document<br>
      (document size same as paper size)<br>
      Place the first page in the center of the page<br>
      and the second 10mm up, down, right, left.</p>
