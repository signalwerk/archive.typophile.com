    html: <p>Oops, I misunderstood your question (sorry, my English in not perfect). I think that FontLab makes drawing glyphs easier because there you can see the coordinates of all the points (including BCPs) and thus control them precisely. Also, all the coordinates are integers there, so there is no chance to be 'a little inaccurate'</p>
