    html: "<p>Press ctrl+alt+; (cmd+opt+;) or select View-&gt;Guides-&gt;Lock Guides to unlock them. <br>Then you can select a guide and enter its coordinates in the Transform panel. <br> <br>Q: Are you going to design a typeface in Illustrator?</p>"
