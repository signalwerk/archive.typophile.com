    html: <p>Matt,  <br> <br>I recomend checking out Leslie Cabarga's book "Learn FontLab Fast" (<a href="http://www.logofontandlettering.com" target="_blank">http://www.logofontandlettering.com</a> ), esp. pages 50-57. On these four spreads, Leslie managed to pack the essentials of glyph drawing in FontLab in a highly informative, concise and yet very understandable manner.  <br> <br>Even though I was technical editor for the book, I still keep learning from it every time I re-read or re-browse it. <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0">  <br> <br>Adam</p>
