    html: <p>Matt, <br>I also started out drawing glyphs in AI but quickly gave it up. The way FontLab curves spring out instead of collapse in (like AI) makes glyph drawing much easier.  You can also select a control handle in FontLab and use the up-down and left-right arrows of the keyboard to nudge the handles in exact units.  If you add the option key, the nudge is 10 units instead of 1. If I were you I would jump into drawing in FontLab and abandon AI as a font drawing program.  You will quickly grasp the nuances of FontLab and soon be glad you made the switch.  I have also noticed that AI nodes and joins sometimes behave strangely when pasted into FontLab.  This can cause peculiarities when making transformations.  AI is a great drawing tool and I use it every day but it is not the best glyph drawing program. Fear not, jump in; the water is warm :-) <br> <br>ChrisL</p>
