    html: <p>Thanks for your reply Andriy. I'm talking about the bezier handles, directional points, BCP's, whatever you call them. Do you mean I could set up precise guides that I could snap the handles to? That does work, but I'd rather transform the bezier handles themselves. With my little experience with Fontlab, it looks like you can do what I want to do - in the node properties and the BCP checkbox. So far I've been creating the glyphs in illustrator and pasting them into fontlab, because i'm a little a more familiar with Illustrator. Is that bad practice?</p>
