    html: |-
      <p>O'tay<br>
      Contrast is what brings interest to a design! Even if it is a placard.</p>
      <p>Look for two Sans with similar interior shapes. That should downplay the boredom. But play with color, weight, texture, harmony and movement!</p>
      <p>Sorry but I thought maybe you were open to suggestion as opposed to what you think the teacher expects or what has been jammed down your throat.  If SANS is the end all then I am way too far gone. Serif, on its face, is not a riot! Especially if it is gently paired with a Sans. See Bringhurst!</p>
      <p>Duh da ta duh duh ta duh da duh da duh da, God save the serif! And its ability to make the Sans sparkle.</p>
      <p>Thirty years is enough. I am going into the recycling business. </p>
      <p>Serifs for a tuppence (sp.)</p>
      <p>More please!</p>
