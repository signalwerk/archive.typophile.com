      <p>Hey,</p>
      <p>everyone is right: pairing two sans is not really subtle, most of the time, its just plain wrong. the best you can do is pairing two styles from the same sans type: gotham thin with gotham ultra black, helvetica narrow with helvetica neue light extended... otherwise, duh, dunno. maybe a humanistic sans for the text (gill sans, cronos, bliss...) and a large, capital sans for the titles, such as gotham or houschka or... well, really, it doesnt sound like a good idea.</p>
