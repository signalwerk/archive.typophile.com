    html: <p>The trick to mixing sans faces is to make sure that the audience thinks you’re a smart designer using two good and distinct typefaces and not one crappy free typeface that doesn’t match across fonts. For example, Gotham and Univers could work provided that you were mixing the wider weights of one with the condensed weights of the other. Or as Nick has pointed out, go bonkers and get the “I can’t afford type so I cut it out of magazines” look.</p>
    html_clean: <p>The trick to mixing sans faces is to make sure that the audience thinks you’re a smart designer using two good and distinct typefaces and not one crappy free typeface that doesn’t match across fonts. For example, Gotham and Univers could work provided that you were mixing the wider weights of one with the condensed weights of the other. Or as Nick has pointed out, go bonkers and get the “I can’t afford type so I cut it out of magazines” look.</p>
