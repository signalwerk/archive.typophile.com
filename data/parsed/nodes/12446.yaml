    <p>Alexander S. Lawson taught typography at <a href="/wiki/Rochester%20Institute%20of%20Technology" class="freelinking link-lost" rel="nofollow">Rochester Institute of Technology</a> from 1947 to 1977. His most well-known work is <em>Anatomy of a Typeface</em> (David R. Godine, 1990), still a much recommended book among type aficionados.</p>
