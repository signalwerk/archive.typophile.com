    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Writers" class="freelinking" rel="nofollow">Writers</a> : Alexander Lawson</strong></p>
    <p>Alexander S. Lawson taught typography at <a href="/wiki/Rochester%20Institute%20of%20Technology" class="freelinking" rel="nofollow">Rochester Institute of Technology</a> from 1947 to 1977. His most well-known work is <em>Anatomy of a Typeface</em> (David R. Godine, 1990), still a much recommended book among type aficionados.</p>
    <p>In late 2009 a <a href="http://lawsonarchive.com/" rel="nofollow">blog archive</a> was developed to honor &amp; document his life's work.</p>
    <p>Died: Sun City, Florida, 2002</p>
