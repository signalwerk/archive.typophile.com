    html: |-
      <p>If you have a regular and a bold then you can try using the <cite>RMX Add MM width Axis</cite> macro, which is part of the Font Remix Tools: <a href="http://remix-tools.com" title="http://remix-tools.com">http://remix-tools.com</a>. There is also a video on the website.</p>
      <p>If you are interested in the question which weights (also interesting: which glyphs) are typicaly condensed how much compared to the others then you might find the PDF on the "About" page interesting, which presents some research I have done on that subject.</p>
