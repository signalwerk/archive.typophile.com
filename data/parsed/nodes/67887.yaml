  html: |-
    <p>Hi all</p>
    <p>Does anyone know of a 'Typowiki' type article or advise I might find online about creating a condensed font from a normal width font.<br>
    I'm looking to create a condensed font and I'm wondering if there are best practise percentage that the font should be condensed by and if the different weights are condensed by the same percentage.</p>
    <p>Any help would be greatly appreciated.</p>
    <p>Rr</p>
