    html: "<p>I remember that article. This TypoWiki is dead but the procedure is simple: having to extremes, one regular and one bold, make an interpolation ONLY in the horizontal axis. The resulting font is a good starting point for a condensed version. Cheers.</p>"
    html_clean: "<p>I remember that article. This TypoWiki is dead but the procedure is simple: having to extremes, one regular and one bold, make an interpolation ONLY in the horizontal axis. The resulting font is a good starting point for a condensed version. Cheers.</p>"
