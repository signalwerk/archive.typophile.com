      <p>I've used it few times, right from the very early versions (1.0.3) and recently a newer version (1.4.3)<br>
      It has much improved since those early days.</p>
      <p>However, it seems to cause havoc with my whole system. I'm still on OSX 10.6.8 (don't ask !)<br>
      I over-rides the functionality of FontBook, and previewing of fonts, and I don't like that.<br>
      So I totally removed it from my system using CleanMyMac.</p>
      <p>I also found when using 1.4.3 that I could not adjust some text that had been created using Fontlab.<br>
      I use someone else to do my kerning, and he says he uses it, but I've yet to be convinced.<br>
      Knowing me, I'm probably doing it all wrong. :)</p>
