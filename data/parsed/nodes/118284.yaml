    html: |-
      <p>I moved to Glyphs from FontLab, and for my purposes it has been an entirely positive shift. To my mind it has a far more intuitive and usable interface, better stability, and much more responsive developers.<br>
      It is set up to be easy to get started with, and for that I think it has a reputation as a beginners' editor (compared to FontLab and especially RoboFont), but I think it is less well known that there is a lot of power and control available through the program. I have yet to encounter an aspect of typeface generation where it seemed that Glyphs was making a decision for me and I wasn't able to change it. (To be sure, there are others with more complicated needs than mine who might run into limitations.)<br>
      Glyphs is a pleasant environment to work in, and there's every indication that developers will continue to make it better at a good pace and in smart ways. It was an excellent purchase for me.</p>
