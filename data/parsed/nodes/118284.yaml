    html: |-
      <p>Thanks for all your answers, they were quite helpful. It appears to me that of the current set of editors, Glyphs may be the most modern one, also more user friendly, if I compare it with RoboFont, for an example. I am not good at writing code and I need automated processes, say for multiple masters and interpolation, to create families and super families.</p>
      <p>From what I understand, the “light” version of Glyphs doesn’t let you create multiple masters in layers, so I could imagine this contributed to the “beginners” reputation.</p>
      <p>What I like in FontLab is the integration of OpenType classes and how kerning can be automated, to a degree, say for diacritics (o has the same kerning like ø and ö, for an example). I am particularly interested in interpolation, multiple master abilities and metrics/kerning in Glyphs. Currently I am going through tutorials to get a better understanding of how these things are handled.</p>
      <p>Again, thank you, also for the critical remarks.</p>
