      <p>I use it… it's hard for me to imagine anything that could be improved. I did have one feature request, but they have a plugin SDK, so I just wrote a plugin. </p>
      <p>In-context editing (combined text/edit view) is a must-have. If I understand correctly, FontLab doesn't have this.</p>
      <p>I looked at RoboFont briefly, but it would take too much tinkering. I really don't mind writing Python, but why bother if Glyphs does what I want? I'd rather spend time making a typeface.</p>
