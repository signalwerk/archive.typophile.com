      <p>It's not funny.<br>
      This is about journalistic standards.<br>
      Comic Sans is a Vince Connare font (as is obvious from the identical "t"s), not the cartoonist in question's lettering.<br>
      So it is, if not a lie, sloppy journalism.<br>
      By making an exception to the style guide, and using the much-maligned CS, the article demeans the subject's status, skewing the objectivity that newspapers are supposed to provide. Again, bad journalism.</p>
