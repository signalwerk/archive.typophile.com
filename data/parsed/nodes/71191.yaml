      <p>Here's some more important Comic Sans information:</p>
      <p><a class="freelinking external" href="http://www.remindblog.com/2010/04/01/avoid-comic-sans/" rel="nofollow">http://www.remindblog.com/2010/04/01/avoid-comic-sans/</a></p>
      <p>However, for all its stylistic faults, Comic Sans is still a professional typeface, so I would be surprised if its fonts have bad kerning. Of course, it isn't intended to be used for all caps text.</p>
