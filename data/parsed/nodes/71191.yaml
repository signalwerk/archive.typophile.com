    html: |-
      <p>Considering the (rather nutty, IMHO) reaction that Comic Sans invokes, it is surely one of the most effective fonts ever produced.<br>
      I deliberately used it on one page in my powerpoint presentation at ATYPI last year just to see if it would produce a gasp. (It didn't.)</p>
      <p>Love it. A work of genius, obviously.</p>
