    html: |-
      <p>For all of you who love comic sans, and can't get enough of it, we just release an update to Comic Sans (and Trebuchet &amp; Impact) with OpenType features to showcase the new typographic features available in Microsoft Office 2010.</p>
      <p>You can read our press release here: <a href="http://www.ascendercorp.com/pr/2010-07-06/" title="http://www.ascendercorp.com/pr/2010-07-06/">http://www.ascendercorp.com/pr/2010-07-06/</a></p>
      <p>We have put together the Ascender 2010 Font Pack for Office 2010 users. This is a collection of 14 TrueType fonts with OpenType features, and a set of Office 2010 and Publisher 2010 templates. So when you start noticing Comic Sans with swashes or all caps - or gasp - improved kerning - you know who to thank (or curse)!</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/ComicSans2010_4492.png"></div><p></p>
