    html: <p>This is flogging a long dead horse, but my primary objection to Comic Sans is that it doesn’t look like comic lettering. You know what does look like comic lettering? The font that Scott Adams uses in Dilbert, that he created based on his own lettering. Wouldn't that have been a better choice than Comic Sans?  So, this just seems like a WSJ art director being uncommonly lazy. As a newspaper, I'm glad the WSJ is making a go of it, but the typographic fit &amp; finish has really tailed off in the last few years.</p>
