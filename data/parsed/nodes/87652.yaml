  html: |-
    <p>Floodfonts offers a new typeface for free download: POLARIS uses historical references as inspiration: slab-serif fonts in a turn-of-the-century style. In combination with modern elements and a technical-like drawing style the font develops an unusual, cool retro charm. Polaris comes with an extensive character set to support all central-european languages. <a href="http://www.floodfonts.com" title="http://www.floodfonts.com">http://www.floodfonts.com</a><br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/polaris_3808.png"></div><p></p>
