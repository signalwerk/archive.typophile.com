    html: |-
      <p>The design of the characters is protected under copyright/author rights. In most countries these rights remain for long time after the author's death. In Brazil, for example, this last 70 years after the death. This is also WIPO recommendation and the criteria adopted in many countries.</p>
      <p>Eric Gill was British and his works are regulated by the British Copyright, Designs and Patents Act. I'm not sure if his fonts are classified as artistic design or typographical arrangements, two different sections in British law. I'm not a native English speaker so I'm unsure if "typographical arrangements" are just the diagrammed pages or also include the fonts.</p>
      <p>If Gill's fonts are artistic designs, their protection expires in January 1st, 2011. If they are classified as typographical arrangements, the protection lasted 25 years after the first publication and thus are all expired.</p>
      <p>All this is jut about the font design. The font software is surely protected because both TT and OT fonts are very recent.</p>
      <p>Besides this, there are moral rights about one's works. This is not limited in any age and may be argued by anyone with rights over Gill's heir. Moral rights refers to work integrity and author's reputation.</p>
    html_clean: |-
