      <p><em>So I can re-paint the Mona Lisa and take credit for it myself.</em></p>
      <p>I did say, that it is poor behavior. But you can. You can do so many things. I mean, where is your fantasy? Don’t be so dismal. The guy is dead. Dead. He is not living anymore. I would be ashamed, when I would claim, that I had made anything, that I did not make. But it is neither necessarily immoral nor it is necessarily a violation of a law.</p>
      <p>It is always such a drama. And the unability to build a sophisticated opinion about good and bad, tolerable scams and real wrongs, is pure <cite>entertainment</cite>.</p>
