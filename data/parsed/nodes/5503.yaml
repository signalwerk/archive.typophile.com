    html: <p>This has come up before (or maybe somebody asked me about this via email), but I can't find the thread. <br> <br>The large capital G, PG, and R date back to when the ratings were introduced in 1969 and were custom designed. <a href="http://www.myfonts.com/fonts/linotype/melior/bold/testdrive.html?s=RPG&amp;p=48" target="_blank">Melior</a> is similar as is the <a href="http://www.myfonts.com/fonts/linotype/renault/bold/testdrive.html?s=RPG&amp;p=48" target="_blank">Renault</a> font, but there are no off-the-shelf fonts that will match these. The 13 is <a href="http://www.myfonts.com/fonts/linotype/itc-korinna/bold/testdrive.html?s=13&amp;p=48" target="_blank">Korinna Bold</a> and the NC-17 is <a href="http://www.myfonts.com/fonts/linotype/itc-stone-informal/stone-inf-itc-bold/testdrive.html?s=NC-17&amp;p=48" target="_blank">Stone Informal</a>.</p>
    html_clean: <p>This has come up before (or maybe somebody asked me about this via email), but I can't find the thread. <br> <br>The large capital G, PG, and R date back to when the ratings were introduced in 1969 and were custom designed. <a href="http://www.myfonts.com/fonts/linotype/melior/bold/testdrive.html?s=RPG&amp;p=48" target="_blank" class="link-external">Melior</a> is similar as is the <a href="http://www.myfonts.com/fonts/linotype/renault/bold/testdrive.html?s=RPG&amp;p=48" target="_blank" class="link-external">Renault</a> font, but there are no off-the-shelf fonts that will match these. The 13 is <a href="http://www.myfonts.com/fonts/linotype/itc-korinna/bold/testdrive.html?s=13&amp;p=48" target="_blank" class="link-external">Korinna Bold</a> and the NC-17 is <a href="http://www.myfonts.com/fonts/linotype/itc-stone-informal/stone-inf-itc-bold/testdrive.html?s=NC-17&amp;p=48" target="_blank" class="link-external">Stone Informal</a>.</p>
