    html: <p>I believe these characters are different (see Mark's post above). NC-17 was added much later than the original ratings (in the 90s, I think) and intended or not, became the defacto replacement for the dreadful-sounding but seldom-used 'X' rating. Also PG-13 was created in the mid 1980s after Spielberg campaigned the MPAA and argued there was too much of a gap in between PG and R. <i>(Many, including Spielberg, thought Indiana Jones and the Temple of Doom was too dark for the PG rating it received)</i>. As mentioned in one of those earlier threads, I don't think they redrew the seemingly-custom ratings logos, but simply patched them. <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> <br> <br>James is fine, Yves, but I don't really care either way. Hope you're enjoying that new arrival! Time flies, before you know it they'll be off to college. </p>
    html_clean: <p>I believe these characters are different (see Mark's post above). NC-17 was added much later than the original ratings (in the 90s, I think) and intended or not, became the defacto replacement for the dreadful-sounding but seldom-used 'X' rating. Also PG-13 was created in the mid 1980s after Spielberg campaigned the MPAA and argued there was too much of a gap in between PG and R. <i>(Many, including Spielberg, thought Indiana Jones and the Temple of Doom was too dark for the PG rating it received)</i>. As mentioned in one of those earlier threads, I don't think they redrew the seemingly-custom ratings logos, but simply patched them. <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> <br> <br>James is fine, Yves, but I don't really care either way. Hope you're enjoying that new arrival! Time flies, before you know it they'll be off to college. </p>
