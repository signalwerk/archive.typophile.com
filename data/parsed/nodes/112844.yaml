    <p>Hi,<br>
    I'm trying to identify this font used in one of the versions of the Kitsuné logo. (It's a French-based clothing and music label.)<br>
    The letters have a high contrast (thick/thin strokes), kind of like a didone type but it has no serifs.<br>
    Does anyone know what this font is or know of similar ones?<br>
    Thank you!</p><div class="imageWrap"><img src="http://typophile.com/files/Maison-Kitsune_logo_2013-02-185121d5b9405d97-54475353_6671.jpg"></div><p></p>
    <div class="field field-type-text field-field-solved">
          <div class="field-label">Font:&nbsp;</div>
        <div class="field-items">
                <div class="field-item odd">
                        DIDOTyounger        </div>
            </div>
    </div>
    <div class="field field-type-userreference field-field-solvedby">
