    html: |-
      <p>Font is called "didotyounger", created exclusively for <a class="freelinking external" href="http://www.kitsune.fr/" rel="nofollow">Kitsuné</a> by <a class="freelinking external" href="http://abake.fr/" rel="nofollow">Åbäke</a> (co-founder of Kitsuné).<br>
      If you need to be as close as possible to original, the "best" would probably be to chop off serifs from a <a class="freelinking external" href="http://myfonts.us/td-vfz5vw" rel="nofollow">Didot</a>, obviously stated by the font name "DIDOTyounger".<br>
      Some alternatives, out-of-the-box: <a class="freelinking external" href="http://www.myfonts.com/fonts/mti/chong-modern" rel="nofollow">Chong Modern MTI</a>, <a class="freelinking external" href="http://www.myfonts.com/search/britannic" rel="nofollow">Britannic</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/linotype/peignot" rel="nofollow">Peignot LT</a></p>
