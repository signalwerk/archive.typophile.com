      <p>Using this form does make sense. You indicated why: <cite>I often tend to perceive the 0 as ‘the odd one out’.</cite> I won't use the terrible R-word. An alternative approach could be to maintain contrast as found in lowercase o, but make the zero a bit lighter and rounder.</p>
      <p>But the question surprises me. With the same argument (the R-word), type designers add a finial to sanserif lowercase l and sometimes i, plus serifs to uppercase I. Even in sanserifs, uppercase I and lowercase l can be distinguished without the finial as versals tend to be smaller and a bit bolder, and sometimes the l's top end differs from the I's anyway. Not to forget context. The finial even makes it hard to space these letters well. Not to mention that in sanserifs, a serifed I is easily mistaken for a T ... Yet this has been widely adopted -- <cite>blindly following a tradition</cite>? ;-)</p>
