      <p>I've asked this before*. In my mind, those drawing contemporary faces using the stressless zero are blindly following a tradition that has been irrelevant for hundreds of years. It's unnecessary and jarring. There are definitely more sensitive ways to design an oldstyle zero that contrasts with the letter 'o'.</p>
