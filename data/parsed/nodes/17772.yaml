      <p>&gt; irrelevant for hundreds of years.</p>
      <p>Well, maybe not hundreds. I've come to believe that the drastically-different zero was mostly to help not the reader, but the distributor of metal type (back into the drawers) to make fewer mistakes; this is because when <cite>setting</cite> type (into the stick) you do it -nearly- blindly (if you're good). So/but yes, it's been a dumb idea for a while now.</p>
      <p>&gt; type designers add a finial to sanserif lowercase<br>
      &gt; l and sometimes i, plus serifs to uppercase I.</p>
      <p>Yeah, but the good designers make sure those<br>
      features don't stick out like a sore thumb!</p>
      <p>&gt; in sanserifs, a serifed I is easily mistaken for a T</p>
      <p>But clearly far less than all those sticks for one-another.</p>
      <p>&gt; the outlines for the ring looking 0 are usually not<br>
      &gt; two circles, but ovals with some resultant stress.</p>
      <p>No, I think they're usually as [apparently] circular as possible.</p>
      <p>--</p>
      <p>Don't get me wrong, I think that form can be useful sometimes (heck, even <cite>Helvetica</cite> can be useful sometimes! :-) and it's possible that a certain designer can sincerely justify its continued use today, but almost all the time it is indeed a result of psychological lethergy.</p>
      <p>hhp</p>
