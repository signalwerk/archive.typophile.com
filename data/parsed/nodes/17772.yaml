    html: <p>The old style 0 has the advangage that it is clearly different from the lower case o, which is nearly the same size. 0o--see the difference here in Georgia? I think it works--2006--see? In text Georgia is actually stressed, but on screen in small sizes it looks to be a ring. Incidentally, the outlines for the ring looking 0 are usually not two circles, but ovals with some resultant stress.</p>
