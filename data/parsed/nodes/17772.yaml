    <p>I have very few expertise in typography, close to none, so please forgive me my possible abusage and misusage of terms.</p>
    <p>When reading books that employ so called ‘old style figures’ I often find the 0 (zero) so contrast-less. Take for example the font Hoefler Text, of which <a href="http://en.wikipedia.org/wiki/Image:Mediaevalziffern.png" rel="nofollow">Wikipedia</a> has an image. This 0 seems so round, I don't think it's perfectly round, but at smaller sizes it almost appears so.</p>
    <p>The 6 and 9 have much stronger contrast, also the lowercase o has much more contrast generally (in a serif font). Why doesn't the 0 look more like the o? I often tend to perceive the 0 as ‘the odd one out’ when reading for example dates like ‘1609’ in a book.</p>
    <p>Are there historical reasons for this shape, or am I seeing things that aren't that common at all. :)</p>
