    html: |-
      <p>I thought about Memphis as well but looked for something closer. Memphis has the angled slab serif to terminate the horizontal strokes for Extra Bold, but not for the weight shown in the image. A font with with the angled slab serif at the right weight is <a href="http://www.myfonts.com/fonts/type-together/adelle/" rel="nofollow">Adelle Extra Bold</a> by TypeTogether. The Adelle Extra Bold is lighter the Memphis Extra Bold and narrower, i.e. a better fit to the image. Do a manual slant, shorten the midstoke on E and you should be pretty close.<br>
      Perhaps someone has an exact match?<br>
      Don</p>
