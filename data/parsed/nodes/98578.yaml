    <p></p><div class="imageWrap"><img src="http://typophile.com/files/burroughesType_6457.jpg"></div><p></p>
    <p>Looking for both the script logotype face (which I think is contemporary), and something that closely resembles the wall type, which is probably old hand lettering based on some classic form. But maybe not?! Candidates for the wall so far include Emigre Brothers, Brokman, PF Din Display Pro, Intropol, and Pill Gothic. Thanks for your help!</p>
