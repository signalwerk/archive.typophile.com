      <p>"LINOLEUMS CARPETS BEDDINGS": makes me thinking of <a class="freelinking external" href="http://www.myfonts.com/fonts/emigre/brothers-ot/" rel="nofollow">Brothers</a> and some Letterhead Fonts like <a class="freelinking external" href="http://www.letterheadfonts.com/fonts/antiquehalfblock.php" rel="nofollow">Antique Half Block</a> (very close), <a class="freelinking external" href="http://www.letterheadfonts.com/fonts/hensler2.php" rel="nofollow">Hensler 2</a>, <a class="freelinking external" href="http://www.letterheadfonts.com/fonts/lincoln.php" rel="nofollow">Lincoln</a>, <a class="freelinking external" href="http://www.letterheadfonts.com/fonts/statestreet.php" rel="nofollow">Statestreet</a>, or <a class="freelinking external" href="http://www.letterheadfonts.com/fonts/naylorville.php" rel="nofollow">Naylorville</a>. Also <a class="freelinking external" href="http://www.myfonts.com/fonts/typodermic/kirsty/" rel="nofollow">Kirsty</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/chank/braingelt/" rel="nofollow">Braingelt</a><br>
