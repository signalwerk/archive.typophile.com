    <p>Here's my problem:</p>
    <p>I need to do a business card for a fitness company. The keywords I'd like to see typeset are Natural and Fitness. But the face can't be too feminine--the company sells products to women and men alike, but the card will be for the head of the company who is a body-builder and tends to like strong styling and something that pops.</p>
    <p>In regards to that last sentence, one product that sells through the company currently uses GeoSlab (extra bold and in caps).</p>
    <p>Perhaps there's something that might work harmoniously with the Geoslab face and still speaks to the requirement for being Natural.</p>
    <p>Anything come to mind? Thanks. I'm stumped and looking for inspiration.</p>
