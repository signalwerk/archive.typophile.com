      <p>The ¨ character really needs a more generic name along the lines of 'double dot’. Umlaut and Diaeresis both indicate a particular function, so don't serve particularly well as a name for the accent itself. They also don't exhaust the list of functions served by this particular diacritic, since the n̈ character used in Malagasy and Jacaltec denotes neither umlaut nor diaeresis. And Jacaltec n̈ has entirely distinct function from the n̈ in ‘Spın̈al Tap’ (which I assume is proncounced [spaɪ̯nəl] rather than [spɨŋal]).</p>
      <p>Since English too suffers from umlaut, I propose we start spelling words like ‘geese’ as ‘gööse’. This would not constitute an appreciable orthographic improvement, but it would force English speakers to learn how to type diacritics.</p>
      <p>André</p>
