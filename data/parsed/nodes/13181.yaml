      <p>Dan, I think you're confusing the dieresis with the umlaut. They're different things, even though they are the same mark.<br>
      "Gödel" = "Goedel". That's an umlaut.<br>
      "Naïve" contains a dieresis, which simply indicates that the two vowels should be pronounced separately instead of as a diphthong. It's not supposed to be "naieve."</p>
      <p>American official documents tend to disregard all diacritics, and using them is up to the individual, just as pronunciation is. A person can suddenly decide to start writing their name with an accent at their own discretion, without getting any kind of official name change.</p>
