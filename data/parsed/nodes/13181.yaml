      <p>No, a vowel with an umlaut is a distinct letter, which is always written that way regardless of context. It is pretty much limited to the orthographies of some Germanic language. In all other languages I can think of, the two dots indicate a diaeresis, which is placed above the second vowel in a two-vowel sequence to indicate that they are pronounced independently and not as a diphthong or compound vowel (e.g. coöperation, a spelling that has fallen out of use in English). Since you're living in Germany, I'm not surprised that you are confused :)</p>
      <p>I suspect that the diaeresis originated in Greek texts, where it is known as dialytika, and distinguishes e.g. εϊ from the diphthong ει</p>
      <p>Chloë and Chloe are both accepted spellings in English. Many people will consider the diaeresis optional, so your daughter can probably get through life using either spelling.</p>
