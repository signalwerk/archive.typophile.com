    <p>My daughter was born about 3 weeks ago and we're just now getting around to sending out the birth announcements. Being the stickler that I sometimes am, I want to make sure, once and for all, that I understand the usage of a diaerisis in her name. Her name is Chloë. We live in the States and have Canadian heritage. </p>
    <p>I researched the diaerisis before naming her and found info in <a href="http://en.wikipedia.org/wiki/Diaeresis" target="_blank" rel="nofollow">wikipedia</a> on the mark. It was that info that led my wife and I to want to include it in her name. </p>
    <p>On her announcement, I wanted to include a simple explanation of the diaerisis for people, so I looked it up again. This time I found more info over at the <a href="http://diacritics.typo.cz/index.php?id=14" target="_blank" rel="nofollow">Diactitics project</a>. Now I'm not sure if we should use it or not.</p>
    <p>Does anyone know the proper use of the diaerisis in english names?</p>
    <p>Thanks</p>
