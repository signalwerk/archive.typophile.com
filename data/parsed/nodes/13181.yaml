      <p>The indication of "Umlaut" and the "diaeresis" had been different forms of sign before:<br>
      The Umlaut consists of two strokes. As I read somewhere (maybe here?) it roots from a small "e" written in brokenscript (formed like an "11") over the umlaut base character. The german word "Umlaut" means "a change in the sound".<br>
      The diaeresis obviously always had been two dots - indicating two different sounds. The greek word "diairesis" means "splitting up, dividing, cutting up" (and it belongs to same field as "heretic" meaning division that separates from the others). </p>
      <p>So confusion of both is only coming from the reduction of the two strokes to two points.<br>
      As german language for a long time has been associated and developped in brokenscript (with strokes) and on the other hand latin script evolved without a sign for "umlaut" the confusion began, when the two strokes where taken from broken script to latin script and interpreted as points.</p>
