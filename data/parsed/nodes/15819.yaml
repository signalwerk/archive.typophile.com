      <p>&gt;It is a freak, not a new model for what the letter j looks like.</p>
      <p>I mentioned it as an example of rationalization/modernization.<br>
      It's immaterial whether it's a one-off: it is "non-Latin" in the sense that you portray straight-sided nu's as being non-Greek. Yet it works perfectly well within the context of a much-loved Roman typeface (whereas many of Renner's radical forms, offered as alternate sorts, fell by the wayside). </p>
      <p>It's incidental that a straight-sided nu looks like a v -- it's a simplified form (symmetry being simpler than asymmetry, straight lines being simpler than curves), not a Romanized form.</p>
      <p>With regard to the kappa, I was perhaps mistaken to characterize the "small cap K" version as Roman; as you point out, it is more plausible as an adaptation of the single-stroke, script original. But if it's acceptable to take the older form of kappa and radicalize its geometry into something more closely resembling a roman glyph (with the same sound, even), what is so heretical about a little ironing of nu?</p>
      <p>I consider Helvetica Greek to be succesful in integrating upper and lower case.<br>
      I think it's successful enough in being both (as far as that is possible) Helvetica and Greek, although I find the alpha, omicron, sigma and rho a little too samey in their roundness -- but I don't think that's a cardinal sin, for the same phenomenon exists in the Roman geometrics (Futura again), to a far greater extent, and that hasn't proved detrimental.</p>
