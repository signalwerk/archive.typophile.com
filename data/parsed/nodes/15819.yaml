      <p><em>To me that -generally- doesn’t lead to progress at all (except by dumb luck).</em></p>
      <p>There you go with your 'dumb luck' again. Nick specifically referred to 'a more historically sensitive form of progress'. I would prefer 'historically informed'. In either case, the emphasis is on knowledge over ignorance, and what one does with that knowledge -- how one combines it, for instance, with other information, intuitions and ideas in the design of new types -- is not a matter of dumb luck. No one is advocating a purely historical revival approach to Greek type design. The immediate programme of the Greek Font Society to date has been one of revival: but that should be seen in the context of digital font making as cultural preservation, not prescriptive for new designs. When designers like Natasha speak of a need for historical understanding as a corrective to a short-sighted and largely amnesiac view of Greek letters informed by the graphic design media of the past thirty years, I think they mean no more than that. I see it fundamentally as a call for the expansion of options in Greek type design and typography, and an opening up of discourse to include the past as an active agent.</p>
