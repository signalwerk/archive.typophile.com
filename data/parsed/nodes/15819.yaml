      <p>Nick, Futura is pretty much a one-off with regard to the straight j. It is a freak, not a new model for what the letter j looks like.</p>
      <p>With regard to the form of the kappa, both shapes have been in use for some time -- indeed, there are plenty of examples of forms that make obvious the transition from one to the other --, and the appropriateness of one or the other is more dependent on the style of typeface than notions of archaic vs. modern. And I disagree with your characterisation of the second form as being a 'roman form small-cap K'. The second kappa form derives directly from the earlier one: the key structural difference is that the leg is a separate stroke, rather than a return from the upper right. The fact that this has been rationalised into something more like K in some typefaces shouldn't obscure the origins and variety of this form. [The two forms of kappa in the new Adobe Garamond Premiere Pro fonts are worth examining.]</p>
      <p>If you are not talking about Helvetica Greek as being successful in terms of mass usage, I wonder in what sense you do consider it successful? I consider it successful <em>only</em> in terms of mass usage. I don't think it succeeds in being Helvetica, and I don't think it succeeds in being Greek. Further, the rationalisation itself is inconsistent and seemingly arbitrary: why maintain the entry stroke of the gamma while removing it from the nu? why treat the poor sigma as an omicron with a stick attached when elsewhere the relationship of adjacent straights and curves is handled in a way that is both more sophisticated and more characteristic of Helvetica?</p>
      <p>Anyway, our disagreement about the (de)merits of Helvetica Greek aside, I look forward to seeing your semi-serif Greek caps. This sounds to me like a good idea to explore, and most likely fruitful.</p>
      <p>By the way, if you take a look at the MS font Sylfaen, you'll note that the Greek caps Geraldine Wade made for the design are different from the corresponding Latin forms. In that case, Geraldine found my thick Latin wedge serifs to be too massive to work with her Greek lowercase, so reduced the weight of them.</p>
