      <p>&gt;it is possible to be both Helvetica and Greek to a much greater extent.</p>
      <p>Nicely done, but I don't think the extent is that great. Some glyphs, such as delta, are more authentic on both counts, but overall the retention of tiny vestigial "curly bits" on characters like upsilon strikes me as tokenism*. It is subtly continued throughout the Linotype version, and forms an effective stylistic theme, but I don't think there is anything significantly less Greek in the more ruthlessly modernized Carter version. In fact, the "dubious" flat top to the delta echoes his treatment of the top of xi and zeta, which to my mind is a perfectly legitimate design feature for all three glyphs, and in this consideration of a shared feature, respectfully Greek. </p>
      <p>I guess what I'm saying is that historic cultural authenticity is not the only game in town, and that I'm suspicious of its volkisch quality. It's also possible to be modern and local, or modern and international.</p>
      <p>*So John, as you hinted in that direction, I'm excited at the prospect of a contemporary, clean, Greek monoline sans from you that goes beyond tokenism, fully grounded in the traditional ductus. </p>
      <p>&gt;Have you asked?</p>
      <p>No, other than second-generation Greek friends in Toronto, and looking at magazines. But I'm aware of the main issue. It seems to me that there are functional problems today with the traditonal Greek letterforms, with their "baroque" stress, to use Bringhurst's terminology (i.e. stress at many angles), and a profusion of extenders -- which combine to create a dense, awkward text body. What to do, and who to do it, and who to decide on whether it's appropriate?</p>
      <p>The forces of commerce in Greece are not afraid to throw out tradition and create bastard "Latinized" forms, if this results in more open, more even text color -- or use western imports to the same effect. On the other side of the issue are public sector traditionalists, who would like to educate the heretics about the error of their ways.</p>
      <p>Our frame of reference at Typophile seems to be faces designed for non-Greek multinationals by non-Greek type designers. Gerry Leonidas, a native Greek I'm assuming, has had some say in the ClearType Greek alphabets, but I suspect there are also other, less conservatively inclined Greek type designers at work.</p>
      <p>I'm not sure how important it is for a type designer to be indigenous, when designing "foreign" scripts. Type designers are doing multiple language encodings in FontLab now. Ideally, I'd like to see more indigenous type design and local typeface use, but the reality is that many indie foundries cater to an international web market.</p>
      <p>A little knowledge sets one off on a sensitive footing -- outreach by Twardoch and Bilak on CE diacritics has been huge -- but then the designer is on his/her own with regards to the degree of historicism, personality, theoretical constructs, etc., that goes into the face. It helps if you can read the alphabet, and for what it's worth Greek is part of my cultural heritage, having studied it at school, so I feel a comfort level that I don't have with Cyrillic; it's unlikely I will include Cyrillic encoding in any of my typefaces.</p>
      <p>&gt;it’s what they feel.</p>
      <p>"Sincerity is bullshit" - Harry Frankfurt</p>
