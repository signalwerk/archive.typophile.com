      <p>&gt;Aren’t they both Canadian?</p>
      <p>I've lived in Toronto since 1977, except for a recent year back in the UK, to which I may return in future, but when and for how long I don't know.<br>
      I became a Canadian citizen in 1990.<br>
      Canada and the UK allow dual citizenship, and I have both.<br>
      Is it like that with you Hrant, or did you have to choose between being a US citizen or an Armenian citizen? </p>
      <p>Canadians aren't big on identifying themselves by hyphenation, with the exception of the old French/English distinction, which goes back to the country's roots. The term Anglo-Canadian usually means an English-speaking Canadian, as opposed to a French-speaking Quebecer or Acadian. So to call me an Anglo-Canadian would have nothing to do with where I was born, only with my mother tongue.</p>
      <p>So you can consider me a Brit, if you think that one's native culture is what determines one's nationality/culture, or you can call me a Canadian, if you think that where one has lived one's adult life is what counts. But really, the distinction is specious, and shame on you Hrant for stereotyping and mocking John and I in such a manner.</p>
