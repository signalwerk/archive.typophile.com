      <p>&gt;it clearly makes things more Latin</p>
      <p>Surely that's not the way it would appear in Greece today, after 30 years of Linotype Greek Helvetica. I think the dominant perception would be of old vs. new, not Greek vs. Latin.</p>
      <p>&gt;I don’t think nu should ever look like a Latin v. I don’t think that constitutes ‘rationalisation’,</p>
      <p>Paul Renner rationalized j into a straight line (Futura), removing the time-honored curve, and rationalizing nu into v is the same idea. It's that art-theory sense or rationalizing that I'm referring to, not implying that it is better because it is more "logical". I'm suggesting that such rationalization, as a formal procedure, is not the stamp of any one culture, but can afflict (if you like) any.</p>
      <p>The "flipped N" form of the kappa appears to have become archaic, replaced by the roman form small-cap K, so I don't think that the traditional forms are sacrosanct.</p>
      <p>&gt;I disagree that Matthew’s Helvetica is a successful proposition.</p>
      <p>What you're saying is that it's incorrect, because it has proved very successful, as has his Verdana, again with a straight, symmetrical nu, and also with a pi shaped like Renner's original n in Futura!</p>
      <p>Anyway, I wasn't talking so much about success as determined by mass usage, but pointing out that in a Greek sans serif there is harmony between caps and lower case, because neither have serifs, whereas in a Greek "serif" face the lower case doesn't really have serifs, so less harmony there.</p>
