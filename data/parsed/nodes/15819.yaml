      <p><em>But surely you will admit that there is also a pull from Greek typographers, especially in commercial publications, away from the traditional forms, just as there has been in the west.</em></p>
      <p>That pull has been there for thirty years, and during that time there has been almost no original type design within traditional styles in Greece.  The Greek Font Society has made some revivals of historical types, and there have been a few other examples of more cursive designs, but the majority of fonts for sale and seen in use are decidedly non-traditional and most often Latinised. What you seem to be characterising as a new dynamic is, in fact, three decades old and, in my opinion, quite tired.</p>
      <p>If I had to identify a current 'pull' or dynamic, I would actually say that it is in the opposite direction, but not in a ideological way. Both within and without Greece there are now type designers who are engaging creatively with the traditional forms again, and in the process revisiting assumptions of the past few decades about e.g. what a sans serif Greek type should look like. I'm not sure what your point was in linking to Natasha Raissaki's thoughts on the question, but she seems to agree with me: 'In this case, the substitution of greek letters with latin ones is no way an evolution but rather a violation (and of course a remnant of the Linotype/Monotype diffusion of greek latinised typefaces back in the 80's -a mistake now partially ammended)' -- citing specifically the design and redesign of Helvetica Greek in her footnotes.</p>
