      <p>Nick,<br>
      I have only done one face in Greek and it was a sans but having grown up in a Greek-speaking household, I am of the opinion that the "Identical" part of what you are saying is a convenience which is often done but, to me, not to be followed.  The lowercase of the Greek is completely different than Roman and the Greek capitals were romanized by whomsoever has adapted roman faces to Greek usage.<br>
      It makes much more sense to me to make the Greek caps Greek caps and not retrofit them to the roman model.  I think that the curves prevalent in the lowercase need something different than traditional roman caps. I don't feel that the roman N is quite right for Greek.  I also feel that the width proportions are not the same.  The roman H feels too wide; the M too vertical; the O too full.  Understand that this is my personal opinion and not that of any Greek scholar. All of the ancient Greek inscriptions that I have seen feel narrower than Roman and the Roman feels too rigid.<br>
      I also wonder about kerning implications as well as fitting of the Tonos.  There may be an advantage of fewer kerning pairs by making a separate Greek set of caps.</p>
      <p>ChrisL<br>
      _____<br>
      I may have 100% Greek blood flowing in my veins, but I do not have scholarly knowledge of Greek writing flowing from my brains :-)</p>
