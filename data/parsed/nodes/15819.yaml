      <p>&gt; is there any reason, other than convenience, for the glyphs to be identical?</p>
      <p>As I've said before (on Typophile, in my Spatium article, and elsewhere) there's actually good reason NOT to make them identical! Especially for a text face.</p>
      <p>One obvious rationale for this is that the spacing is different (Greek having much more round forms, at least in the lc) and this should affect the black bodies too. Related to this is the fact that serifs are indeed not as "authentic" in Greek. And a rationale that's harder to justify but much more powerful in my mind is that communication depends on contrast.</p>
      <p>Veljovic's Sava (at your favorite font house :-) is worth looking at.</p>
      <p>hhp</p>
