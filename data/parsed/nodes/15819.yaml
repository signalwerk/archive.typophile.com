      <p>&gt;you can’t apply the typical uppercase ductus to the lowercase letters without effectively Latinising the Greek letters.</p>
      <p>I haven't experienced that problem.<br>
      I've been able to make a "modern" (Didot) Greek lower case which follows the traditional letter shapes.<br>
      The design difficulty has not been with the ductus, but the serifs.<br>
      As I pointed out earlier, most of the traditional Greek lower case strokes do not end in serifs. Therefore, a sans serif like Carter's Greek Helvetica has proven to be a successful proposition, because both cases have no serifs. So nu looks like v, gamma like y? -- that's rationalization/modernization, not Latinization/Westernization.</p>
      <p>However, a Greek "serifed" face is a bit of an oxymoron, as the lower case is going to be relatively serif free, while the caps are going to have lots of serifs, especially if many of them do double duty in the Roman alphabet.<br>
      So what I'm inclining towards now is a distinct set of semi-serifed Greek-only capitals, so that the glyphs for A and Alpha, B and Beta, E and Epsilon, etc., will all be different -- as has been done occasionally in the past with Y and Upsilon.</p>
      <p>I'll post a PDF when it's done.</p>
