      <p>BTW, if you consider actual letter frequencies rather than just the alphabetic set, you discover something quite surprising: Greek -at least in its contemporary manner of execution- has a <cite>lesser</cite> vertical divergence than Latin! The "problem" you're seeing is [due to] something else.</p>
