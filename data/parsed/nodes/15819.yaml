      <p>&gt;the Roman feels too rigid</p>
      <p>Matthew Carter noted that his Cadmus design of the 1970s was not appreciated in Greece, because its looseness made it look archaic.</p>
      <p>To me, the issue is not that the Greek alphabet is naturally less regularized, in the lower case, than the Roman, but that it is traditionally so. The present day Greek sans faces are more rigid/formalized than the old serif faces, as is the case with Roman types, too.</p>
      <p>A severely formalized Greek serif face should be feasible, with or without serifs in the lower case.</p>
