      <p>Nick, in my view serifs per se are completely alien to the Greek lowercase: there are entry and exit strokes that are properly part of the letter in most styles, but one shouldn't think of these as serifs. They are more like the exit stroke of a Latin lowercase a, which may or may not occur even in sans serif types.</p>
      <p>I disagree that Matthew's Helvetica is a successful proposition. For instance, I don't think nu should ever look like a Latin v. I don't think that constitutes 'rationalisation', considering that there is absolutely no precendence for the nu to take that form. What is being rationalised? Not the form of the nu, which is simply being ignored in favour of a mistaken belief that the Latin v is some kind of homograph. It is an arbitrary decision, as if one decided that a Latin w should take the form of a Greek omega. I mean, ωhat the fυck?</p>
      <p>The most telling problem of the old Helvetica Greek is that it <em>doesn't look like Helvetica.</em> If you put text in the Latin and Greek side-by-side, they have completely different typographic colour. This was the major impetus to design a new Greek for Helvetica Linotype.</p>
