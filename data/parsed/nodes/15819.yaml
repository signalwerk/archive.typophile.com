      <p><em>It’s incidental that a straight-sided nu looks like a v — it’s a simplified form (symmetry being simpler than asymmetry, straight lines being simpler than curves), not a Romanized form.</em></p>
      <p>Sorry, Nick, but I think you have to judge the old Helvetica Greek within the context of all the Linotype Greek designs of the early 1970s. At the time, Linotype had a virtual monopoly on typesetting equipment in Greece, largely due to a promise to the local agent that Linotype would produce Greek versions of any existing typeface requested by the local market (this information from Mike Parker). At the time, partly due to the policies of the military dictatorship, the trend in Greece was to look western and modern. The result was a library of highly Latinised Greek designs: Baskerville, New Century Schoolbook, Souvenir, Times and, yes, Helvetica. Helvetica is not some separate programme of rationalisation and modernism: it demonstrates exactly the same approach to Latinisation as the other Linotype Greek types of that time, only more subtly because it doesn't have serifs stuck on every available appendage. [By the way, at the Greek type conference in Athens in the mid-90s, Matthew joked about being surprised that he hadn't been asked to add serifs to the Helvetica Greek, since they were so much the rage.]</p>
      <p>The Helvetica Greek nu, far from being 'not a Romanized form', <em>is</em> the Latin v glyph! The only difference is the spacing.</p>
      <p><em>I consider Helvetica Greek to be succesful in integrating upper and lower case. I think it’s successful enough in being both (as far as that is possible) Helvetica and Greek...</em></p>
      <p>The integration with the uppercase is primarily a function of the low contrast, not of letter construction. I think it is possible to be both <a href="http://www.tiro.com/John/HelveticaGreeks.pdf" rel="nofollow">Helvetica and Greek</a> to a much greater extent.</p>
