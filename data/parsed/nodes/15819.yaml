      <p>The common disparity between the Greek upper- and lowercase derives from different ducti, and the more traditional the ductus of the lowercase the more disparity there will be. Constantia is an example of a hybrid lowercase, in which the ductus of the lambda, pi and tau tends towards the traditional ductus, while many other letters are closer to the ductus of the Latin for greater harmony of appearance. This may be the last Greek typeface I design in this way: I'm pretty happy with the result in Constantia, but I'd rather work more fully with the traditional ductus.</p>
      <p>I'm not sure that anything can be done about the disparity with the uppercase. You can't apply the traditional lowercase ductus to the uppercase letters without making something very freakish, and you can't apply the typical uppercase ductus to the lowercase letters without effectively Latinising the Greek letters. The Greek bicameral alphabet is the result of a shotgun wedding between two different alphabets of independent evolution.</p>
      <p>Needless to say, the lower the contrast of a typeface is, the easier it is to blend the treatment of upper- and lowercase Greek letters.</p>
