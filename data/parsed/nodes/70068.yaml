    <p>A month ago, mainly as personal experience, i started these two families: <a href="https://dl.dropbox.com/u/795795/typography/tapanapantera.html" title="https://dl.dropbox.com/u/795795/typography/tapanapantera.html">https://dl.dropbox.com/u/795795/typography/tapanapantera.html</a> and <a href="https://dl.dropbox.com/u/795795/typography/dogull.html" title="https://dl.dropbox.com/u/795795/typography/dogull.html">https://dl.dropbox.com/u/795795/typography/dogull.html</a></p>
    <p>(they are temporarily there while <a href="http://nitrofurano.linuxkafe.com/typography/tapanapantera.html" title="http://nitrofurano.linuxkafe.com/typography/tapanapantera.html">http://nitrofurano.linuxkafe.com/typography/tapanapantera.html</a> and <a href="http://nitrofurano.linuxkafe.com/typography/dogull.html" title="http://nitrofurano.linuxkafe.com/typography/dogull.html">http://nitrofurano.linuxkafe.com/typography/dogull.html</a> are offline for a while for technical reasons)</p>
    <p>The first were based on an academic work i did 10 years ago (an analysis on how can work together the roman square captials (lapidaria) with carolingian calligraphic lowercases, in a geometric sans-serif typeface ), and the other were a research and analysis desconstruction (not a ripoff) of how better readable can be a typeface based on Gustav Jaeger's Catull in a sans-serif drawing.</p>
    <p>Please note i wanted to deserve the same importance to smallcaps as to italics, and the italics being not slanted are intentional, since the first italic typefaces from Aldus Manutius and Lodovico Arrighi were not that slanted as well, and i wanted to assume them unslanted at all.</p>
    <p>Of course both typeface sketches are hugelly plenty of naive mistakes, but i'd ask you all here for your oppinions, suggestions, comments, ideas, references, etc., and the bluntest comments are even more welcome! :)</p>
    <p>And if both of these families are a complete disaster, please help me knowing which useful parts of them would be great to utilize and improve in future works.</p>
