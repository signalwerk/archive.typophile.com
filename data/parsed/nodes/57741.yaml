    html: |-
      <p>Google found several things. First, there's a bug in Word's handling of JPGs from Photoshop. Supposedly, there was a fix for both Word 2004 and 2008; do you have all the updates? Other found suggestions: (1) use a TIF instead of a JPG; (2) open the JPG in a third program (e.g., Preview) and resave it; (3) convert from CYMK to RGB.</p>
      <p>If you use Word's insert picture from file, does your JPG show up as a thumbnail in the dialog box?</p>
      <p><a href="http://forums.macosxhints.com/archive/index.php/t-36344.html" title="http://forums.macosxhints.com/archive/index.php/t-36344.html">http://forums.macosxhints.com/archive/index.php/t-36344.html</a></p>
      <p><a href="http://www.microsoft.com/communities/newsgroups/en-us/default.aspx?dg=microsoft.public.mac.office.word&amp;tid=033a76a1-9c21-45a7-9017-25b0322b0517&amp;cat=en_US_3cf8ecf1-ca81-4391-b07d-8933029ee8a9&amp;lang=en&amp;cr=US&amp;sloc=&amp;p=1" title="http://www.microsoft.com/communities/newsgroups/en-us/default.aspx?dg=microsoft.public.mac.office.word&amp;tid=033a76a1-9c21-45a7-9017-25b0322b0517&amp;cat=en_US_3cf8ecf1-ca81-4391-b07d-8933029ee8a9&amp;lang=en&amp;cr=US&amp;sloc=&amp;p=1">http://www.microsoft.com/communities/newsgroups/en-us/default.aspx?dg=mi...</a></p>
