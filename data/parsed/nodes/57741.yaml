    <p>Greetings!<br>
    The project is letterhead. When I bring the jpg image (flat, saved from Photoshop) into Word, the correct dimensions (vertical rectangle) appears, however it has a fill of solid black. The image should have instead the company name, logo, etc. </p>
    <p>How to proceed? Your advice is greatly appreciated.<br>
    Merci!!</p>
