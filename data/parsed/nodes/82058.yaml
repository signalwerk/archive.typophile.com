    html: |-
      <p>After you've imported all of your characters...</p>
      <ol>
      <li>Set the sidebearings (for now, choose any arbitrary value, like 24 units right and left);</li>
      <li>Determine the numerical value of the baseline;</li>
      <li>Select ALL characters and TRANSFORM &gt; MOVE them down (negative value) the same number of units as the above number;</li>
      <li>Under FONT INFO &gt; METRICS, set the Descender, as a negative value, to the same number as above;</li>
      <li>Use the AUTO function to calculate all other values under METRICS.</li>
      <li>Open the original font file and EXPORT Metrics;</li>
      <li>Then IMPORT &gt; Metrics into your new file, selecting Kerning and Spacing from the drop-down box.</li>

      </ol>
