    <p>Hello all.</p>
    <p>This might make me sound a bit simple, but I'm a complete beginner with Fontographer (I only installed it today)</p>
    <p>Basically I've taken an existing font and made all my tweaks in Illustrator (Upper and lower case, bold and light) I've then converted the existing font into a ttf and opened it in Fontographer. </p>
    <p>Now all I want to do is transfer my characters from Illustrator into Fontographer and have them exactly match the size/baseline etc, I haven't changed the proportions of the font in Illustrator so I'm hoping that I won't have to mess with the kerning. But When I paste them in they are huge and I'm struggling with the scale tool and lack of rulers/guides. Is there a way of importing an eps, or just replacing a character without having to manually scale each one? Or have I missed something and gone about this all wrong???</p>
    <p>Thanks in advance!</p>
    <p>Paul</p>
