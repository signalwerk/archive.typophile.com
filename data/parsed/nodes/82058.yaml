      <p>Set your em square to 2048 for a TTF font, with an Ascender of 2048 and a Descender of 0. Then, in Illustrator, place spacers (here shown as blue lines with a 4 pt. stroke) to match the highest point and lowest point of all the characters in your font. This way, all of your characters will import at the same relative size.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/elegant-lichte_4829.png"></div><p></p>
      <p>I usually import five to seven characters at a time, delete the spacers, then Clean Up Paths, Correct Path Direction, Remove Overlap, then Cut and Paste into the correct slots.</p>
      <p>There's a lot more housekeeping to be done once all of your glyphs are placed, but let's leave that for another day. This ought to get you started on the right track...</p>
