    <p>This is a poll to establish why Typophile is great, what makes it so attractive and keeps us Typophilers endeared to the place. Once we've worked out say, 25 good reasons, we can vote for the top ten "most popular" ones.</p>
    <p>I wonder if Paul Hunt would like to put together one of his polling forms so we can get an accurate tally for the top ten?</p>
    <p>I'll start off with a handful of sample reasons:</p>
    <p>* It's a rollercoaster ride but it's the best design &amp; visual arts-based rollercoaster ride going on the internets. Put money on it. Typophile is the best.</p>
    <p>* It's a diverse, dynamic community of mostly open-minded, left-thinking, right-brained and uncannily creative visual thinkers and artists unparalleled in their ability to explain what typography is all about.</p>
    <p>* Some of the world's best typeface designers, typographers, book designers, calligraphers and type engineers are here. The amount of talent on tap surprises me daily. (similar to above but slightly different reason)</p>
    <p>* We have the most exhaustive and thoroughgoing typo discussions &amp; debates in the world, and you can learn more about typography here than you ever thought possible.</p>
    <p>* From a technical standpoint Typophile's forum pages are the easiest to read on the web (you'd expect that anyway but it's worth stating).</p>
    <p>* Typophile is at least as long as it is broad. It's hairy too, in some places some of the time. But stick with it, roll with the punches and take it all in good faith, and you will see the point with everlasting clarity.</p>
    <p>* It makes me proud to be a Typophiler. I'm touched. I'm humbled. I'm impressed. In the future everybody will be a type designer for 15 minutes.</p>
    <p>Any others? There are stacks of reasons. Go for it . . .</p>
    <p>j a m e s</p>
