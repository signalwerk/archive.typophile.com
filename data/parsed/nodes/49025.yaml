      <p>1, When I first came here, I thought serifs were a kind of angel. (bigger than cherubs and not as nice - or much nicer... I forget.)<br>
      Now I know that they are the sort of spiky things on Times New Romain that make it different from Areal. </p>
      <p>2, As part of my job, over the last few years, I have had the opportunity and privilege to study typography and type design quite deeply. And on company time! It's been kinda cool. For me at least. My coworkers seemed to think that eating glass would have been preferable and were glad is was my burden and not theirs, but - That's their problem :o)... Any how, I have found no better source of all-round typo-learnin' anywhere. </p>
      <p>3. In my opinion, typefaces &amp; how they are generated, rendered, reproduced, read and understood are the nuts and bolts of human communication. It is worth knowing about type if you are a designer (... or a reader), and it is frankly just very interesting and fun to read some the debates that take place about the directions things in typography are going in.</p>
      <p>4, I've seen some of the best damned type designers and typographic experts you'll find anywhere on the planet answer the most basic questions from the the greenest novice in enormous detail and with no hint of condescension. </p>
      <p>--<br>
      -- </p>
      <p>-=®=-</p>
