      <p>I found it, took me awhile :) It's a Microsoft Windows 7 packaged font named Ebrima.</p>
      <p>A little history:<br>
      Ebrima was designed to support a large number of African languages. The font contains characters for the Nko, Tifinagh, Vai and Osmanya writing scripts.</p>
      <p>Thanks for the feedback everyone.</p>
