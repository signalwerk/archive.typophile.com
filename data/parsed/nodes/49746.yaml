    html: <p>the 'missing line' is probably not part of the typeface. set SPORTS in <a class="freelinking external" href="http://www.myfonts.com/fonts/berthold/city-be/bold-italic/" rel="nofollow">City Bold Italic</a> and add the line on top. should get you pretty close (if not spot on).</p>
