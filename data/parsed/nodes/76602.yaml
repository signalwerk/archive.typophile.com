    html: |-
      <p>Igor — </p>
      <p>Go to your Account profile. Click on the Edit tab to view your Account settings. Down toward the bottom, under where you set your avatar, there’s a section called Block Configuration. Make sure the check box for Who’s Online is checked. That’s the setting to enable that panel.</p>
      <p>I don’t know how it got turned off. (Unless maybe you accidentally hit it when you updated your avatar recently?)</p>
