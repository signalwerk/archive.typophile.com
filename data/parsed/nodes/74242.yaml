      <p>I was going to recommend the same thing (contact Ron Carpenter). <a href="http://www.daltonmaag.com/contact.html" title="http://www.daltonmaag.com/contact.html">http://www.daltonmaag.com/contact.html</a></p>
      <p>I was in London in 1991 when Dante was launched at one of the Monotype Conferences - it was right after I joined Monotype Typography. All I heard at the time was a lot of praise for the work that was done on digital version of Dante. To this day it remains one of my favourites. :) </p>
      <p>As to hand set type, I remember Harold Berliner (who recently passed away) had cast Dante in different sizes. He sold his type casting equipment to someone in Switzerland if I understand correctly. You can contact Harold's family to find out what he might have printed in Dante. <a href="http://www.haroldberlinerpress.com/" title="http://www.haroldberlinerpress.com/">http://www.haroldberlinerpress.com/</a></p>
