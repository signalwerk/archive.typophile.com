  html: |-
    <p>Hi everyone,</p>
    <p>I am looking for a book or any kind of printing that uses the hand set version of Dante.<br>
    What <em>hand set</em> means here is the first version of Dante, not the Monotype version.<br>
    I heard that Martino Mardersteig actually did not like Monotype version, thus I want to compare each other.<br>
    (However, if this is true, I cannot explain why Giovanni based the Monotype Dante for Valdonega project.)</p>
    <p>Does anyone know anything about this?</p>
