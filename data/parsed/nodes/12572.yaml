      <p>Now that I’ve dropped my horrible Swedish like a turd in this otherwise wellwishing thread,  allow me to continue in English: <a href="http://www.fontshop.com/index.cfm?fuseaction=catalog.fontdetail&amp;displayfontid=FT.118672.0.1&amp;attributes.sampleSize=38&amp;sampleText=Peter+is+my+fonty+friend%21&amp;sampleSize=38">Peter is my fonty friend!</a> A trip to his summer home in Malmö was the perfect end to my stint in Sweden. He has a lovely family and a lovely foundry. He is quick to help and slow to anger. He laughs at my jokes and listens to my music. I love this man.</p>
      <p>Here’s the best to you, Petah! Looking forward to hearing you and Stefan speak at TypeCon. (You’ve become quite the lecturer in your old age.)</p>
      <p>And now, <a href="http://stewf.com/stewftone/Happy%20Svensk%20Birthday.mp3">a song</a>.</p>
