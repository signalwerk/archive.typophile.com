      <p>This is very nice and also it is very useful to have a textura with a good set of ligatures and abbreviations. The numerals look about a century out of place to me, and stylistically Roman rather than blackletter, though.</p>
      <p>This discussion of the tittles inspired me to take a look for some scans of Fust &amp; Schöffer type, and it looks to me like the tittles and hyphens at least in their earlier works like the Mainz Psalter (and also in the 42-line Bible) were drawn in by hand at the rubrication stage. I hadn't realized that before. They may have changed this later; some of the "acute accent" tittles look like they might have been part of the type. Perhaps if it's true that punched matrices weren't developed until c. 1470, before that the tittles may have been considered too difficult to cast?</p>
