      <p>Hello. Thanks for your comments and suggestions. (I’m a bit slow in responding because I don’t look here every day.)</p>
      <p>I’ve redone the numerals, making them more rounded, and also narrower. (The height aligns with the lower case.) I also adjusted the width, especially of the 1, instead of forcing all numerals to be the same width, which is hardly a requirement of this design.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Numerals_4315.jpg"></div><br>
      I’m not sure that I’ll do any more on this. I’ve moved on to other things, and would find it difficult to get the time. Many thanks to all who commented and offered advice.<p></p>
