      <p>Good point about Roman numerals being the proper Fust &amp; Schöffer choice, but for the sake of having something in the Arabic numeral slots, what about numerals from one of their slightly later contemporaries of the 1470s or 1480s? There are good examples to choose from among other German printers. It would still be a mashup, but a much less jarring one.</p>
