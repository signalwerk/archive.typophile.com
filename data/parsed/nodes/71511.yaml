    html: |-
      <p>The numerals are indeed different. Authentic usage with this type would have been roman numerals (lower case), but then I thought it might be preferable to have “normal” (Hindi-Arabic) numerals also. I found a very good sample of contemporary handwritten numerals, and I began to draw them; but when I printed them in conjunction with the blackletter I hated them and so I deleted them, and instead I just put in ordinary numerals, so that at least there would be something there.</p>
      <p>Now I’m not so sure. I would hope that most people who would have a use for this font would not want numerals at all, or if they wanted super-authenticity they would use lower-case roman numerals. But it’s quite a quandary. I can think of compelling reasons for and against every option!</p>
