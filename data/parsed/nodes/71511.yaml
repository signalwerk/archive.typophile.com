    html: |-
      <p>They are a bit clunky. I think if you poke around a bit more among fifteenth-century designs you'll find nicer-looking numerals. Over the weekend I tried my hand at drawing a few based on some of Erhart Ratdolt's and found that the designs are better than the ink spread normally makes them look, but it's often quite hard to guess the exact shapes amidst the ink blobs.</p>
      <p>Another thing that may be an issue here is choosing the proportions. Your lowercase is taken from the Mainz Psalter, I think? That type is very large - around 44pt, I'm guessing - and the letters are proportioned accordingly. The incunabula with Arabic numerals are generally printed with much smaller type, and of course 12pt type is proportioned very differently from 44pt type, so adjustments will be needed to make such numerals work with Mainz Psalter letters. In addition, your font is very small on the em, and your numerals will need to follow that. At the moment your numerals do not seem small enough on the em to fit with the letters. They should, in fact, be even smaller: Ratdolt's numerals seem to use a "figure x-height" that is around 85% of the "letter x-height".</p>
