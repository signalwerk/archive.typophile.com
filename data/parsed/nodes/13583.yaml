    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Software" class="freelinking" rel="nofollow">Software</a> : RoboFab</strong></p>
    <p>RoboFab is a set of tools written for <a href="/wiki/Python" class="freelinking" rel="nofollow">Python</a> designed to help programming tasks common in <a href="/wiki/type%20design" class="freelinking" rel="nofollow">type design</a>. While RoboFab can be used in conjunction with Python scripts in <a href="/wiki/FontLab" class="freelinking" rel="nofollow">FontLab</a>, it can also be used in independent Python programs. RoboFab was/is developed by <a href="/wiki/Tal%20Leming" class="freelinking" rel="nofollow">Tal Leming</a>, <a href="/wiki/Erik%20van%20Blokland" class="freelinking" rel="nofollow">Erik van Blokland</a>, <a href="/wiki/Just%20van%20Rossum" class="freelinking" rel="nofollow">Just van Rossum</a> of <a href="/wiki/Letterror" class="freelinking" rel="nofollow">Letterror</a> fame.</p>
    <p><strong>URL</strong><br>
    <a href="http://robofab.com/" title="http://robofab.com/">http://robofab.com/</a></p>
    <p><strong>Installation</strong> <em>on Mac OS X</em><br>
    Installing RoboFab on Mac OSX 10.5 can be difficult. Useful comments and an installer script by Erik van Blokland:<br>
    <a href="http://robofab.com/download/index.html" rel="nofollow">http://robofab.com/download/index.html</a><br>
    <a href="http://robofab.com/install.html" rel="nofollow">http://robofab.com/install.html</a></p>
    <p>Also see <a href="http://groups.google.com/group/robofab/browse_thread/thread/35bedec16bda51c9#82f6375f89c27144" rel="nofollow">this post</a> to the <a href="http://groups.google.com/group/robofab/" rel="nofollow">RoboFab Group</a>.</p>
    <p><strong>Additional Reading</strong><br>
    <a href="/wiki/Ben%20Kiel" class="freelinking" rel="nofollow">Ben Kiel</a>'s <a href="http://typographi.com/000978.php" rel="nofollow">An Introduction to RoboFab</a></p>
    <p><strong>Discussion</strong><br>
    <a href="http://groups.google.com/group/robofab/" title="http://groups.google.com/group/robofab/">http://groups.google.com/group/robofab/</a></p>
