    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/12015" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Software</a>&nbsp;:&nbsp;RoboFab</strong></p>
    <p>RoboFab is a set of tools written for <a href="/node/13582" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Python</a> designed to help programming tasks common in <a href="/node/12387" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Type Design</a>. While RoboFab can be used in conjunction with Python scripts in <a href="/node/12240" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">FontLab</a>, it can also be used in independent Python programs. RoboFab was/is developed by <a href="/node/15673" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Tal Leming</a>, <a href="/node/65521" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Erik van Blokland</a>, <a href="/node/add/wiki?edit%5Btitle%5D=Just%20van%20Rossum" title="Create node &quot;Just van Rossum&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Just van Rossum</a> of <a href="/node/14101" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">LettError</a> fame.</p>
    <p><strong><span class="caps">URL</span></strong><br><a href="http://robofab.com/">http://robofab.com/</a></p>
    <p><strong>Installation</strong> <em>on Mac <span class="caps">OS</span> X</em><br>
    Installing RoboFab on Mac <span class="caps">OSX</span> 10.5 can be difficult. Useful comments and an installer script by Erik van Blokland:<br><a href="http://robofab.com/download/index.html">http://robofab.com/download/index.html</a><br><a href="http://robofab.com/install.html">http://robofab.com/install.html</a></p>
    <p>Also see <a href="http://groups.google.com/group/robofab/browse_thread/thread/35bedec16bda51c9#82f6375f89c27144">this post</a> to the <a href="http://groups.google.com/group/robofab/">RoboFab Group</a>.</p>
    <p><strong>Additional Reading</strong><br><a href="/node/add/wiki?edit%5Btitle%5D=Ben%20Kiel" title="Create node &quot;Ben Kiel&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Ben Kiel</a>’s <a href="http://typographi.com/000978.php">An Introduction to&nbsp;RoboFab</a></p>
    <p><strong>Discussion</strong><br><a href="http://groups.google.com/group/robofab/">http://groups.google.com/group/robofab/</a></p>
