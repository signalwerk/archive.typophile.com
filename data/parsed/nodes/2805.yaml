  - id: 22366
    user_id: 804
    user_name: designalchemy
    user_path: null
    date_raw: 27 Jan 2004 — 3:49am
    date: 2004-01-27T03:49:00
    votes: null
    html: <p>Hi Ramiro, I like this font a lot. As usual it can always use a few changes here and there. I think S is a bit wide and also a bit heavy on the top. terminals are a bit too bulky for my taste. LC "g" is unusual and perhaps my favorite character. the new LC. "g" is much nicer than the older version on your website. <img src="http://www.typophile.com/forums/messages/29/24985.jpg" alt="type"></p>
  - id: 22367
    user_id: 618
    user_name: aquatoad
    user_path: null
    date_raw: 27 Jan 2004 — 5:50am
    date: 2004-01-27T05:50:00
    votes: null
    html: "<p>Hi Ramiro. <br> <br>This is really very nice. I would definitly use it. <br>Here are some comments in addition to what's been said. <br> <br>P vs R: Are the bowls the same size? The P should be slightly larger (north to south) than the R. <br> <br>r: Lower the join some for color, and add width as Eduardo suggests. <br> <br>E vs F: The middle bar looks to be at the same height. The F should be a bit lower (in this case, I'd raise the E a bit) <br> <br>3: I'd bring in the middle a bit (on the left side). It's hanging out a little far. <br> <br>Trapazoid Problems: As I've said in other posts, most of the letters should fit in a trapazoid that is wider at the base than the top. That way they look balanced and stable. There are several glyphs that have this trouble in your alphabet. <br>S: As Ole mentioned. I'd bring in the top left and top right. <br>s: Similar but to a lesser degree. Mostly on the top right. <br>a: Bring the top left in a little bit. <br> <br>Looking forward to seeing more. <br> <br>Randy</p>"
  - id: 22368
    user_id: 1137
    user_name: Ramiro Espinoza
    user_path: null
    date_raw: 27 Jan 2004 — 9:30am
    date: 2004-01-27T09:30:00
    votes: null
    html: <p>Thanks a lot, guys. Your comments are really useful. <br> <br>I am working too in a extra bold version. And I made some changes in the 'g'. <br> <br><img src="http://www.typophile.com/forums/messages/29/25008.gif" alt="seve-black"></p>
  - id: 22369
    user_id: 618
    user_name: aquatoad
    user_path: null
    date_raw: 27 Jan 2004 — 10:58am
    date: 2004-01-27T10:58:00
    votes: null
    html: '<p>Hi Ramiro, <br> <br>The extra bold looks nice! <br>I noticed 2 very small details: <br> <br><img src="http://www.typophile.com/forums/messages/29/25015.gif" alt=""> <br>With the <b>m</b> it is clear that you made it from an n because the final branch joins before the middle one has finished curving. I tried to illustrate how you could reconfigure the branches to eliminate this small problem. <br> <br>With the <b>b</b> we get really detailed. This is another one of those pesky optical illusions. The stem appears to get thicker below where the bowl joins the stem. It is even more noticable in the extra bold version. To compensate, shave off a little bit. <br> <br>Oh, also the extra bold <b>a</b> and <b>s</b> beak terminals look a little heavy. I would thin them so they look the same as the spurs on the <b>m, r, n</b> etc. <br> <br>Cheers, <br>Randy</p>'
