  - id: 22371
    user_id: 1353
    user_name: eomine
    user_path: null
    date_raw: 10 Feb 2004 — 5:37am
    date: 2004-02-10T05:37:00
    votes: null
    html: "<p>Quick comments: if this is intended to work at 9 pts, it should be wider. And the @ looks odd. Make it shorter (the @ should be shorter than the caps), and also make the inner 'a' one-storey.</p>"
  - id: 22372
    user_id: 1250
    user_name: hrant
    user_path: null
    date_raw: 10 Feb 2004 — 9:42am
    date: 2004-02-10T09:42:00
    votes: null
    html: <p>Have you changed your vertical proportions? They were better before, especially for smallish setting (9 pt). And for small sizes, besides the narrowness being a problem it's also too light (although the spacing is nice and loose). I suggest shooting for 11-12 point instead (in which case you need to tighten it up though). But even so, I like the feel of this - really nice. We need a contemporary replacement for Caecilia. <br> <br>The "a" is too bulky. The "g" is too mannered. It's almost like Formata's (which I like), so maybe just emulate that. But try a diagonal ear. <br> <br>The "J" I'd either make descending, or give it more width. The "M" is a bit narrow. The "L" and "T" a bit wide. Yeah, the "@" needs work. <br> <br>I might try some serifs on some numerals. <br> <br>hhp <br></p>
  - id: 22373
    user_id: 1137
    user_name: Ramiro Espinoza
    user_path: null
    date_raw: 12 Feb 2004 — 2:00am
    date: 2004-02-12T02:00:00
    votes: null
    html: <p>Hrant, I didn't change the proportions, only the values of ascender and descenders in relation with the M square, so now the typeface looks a little bigger in the same size. That's all. <br> <br>Yeah, the regular version is pretty light, but I'm gonna do interpolations, so I tought about future masters. I like to think the details in a light way... it's harder. <br> <br>Thanks! <br> <br></p>
  - id: 22374
    user_id: 1250
    user_name: hrant
    user_path: null
    date_raw: 12 Feb 2004 — 10:43am
    date: 2004-02-12T10:43:00
    votes: null
    html: <p>When I say "vertical proportions" I mean the <i>relative</i> size of the three zones - so you have in effect changed the proportions. Specifically, I think your descenders are way too long now. <br> <br>hhp <br></p>
