    date: 2004-01-22T09:23:00
    votes: null
    html: <p>I like this alot. I am noticing that the weight of the strokes on your curved letters appear heavier than your straight strokes (uppercase G,Q). I agree that the "g" needs some tweaking also. The upper stroke on the lowercase "r" seems a little wimpy also. With some tweaking it will be nice!</p>
  - id: 22363
    user_id: 1353
    user_name: eomine
    user_path: null
    date_raw: 22 Jan 2004 — 9:31am
    date: 2004-01-22T09:31:00
    votes: null
    html: "<p>Cool. <br>This reminds me of a typeface used by David Carson in his 'Revised Edition'. <br>IIRC, it is called Neulin Sans, and it was designed by Miles Newlin. <br> <br>Anyway, I like the 'rawness' in this. <br>Quick comments: <br>- a: nice, did you try a smaller bowl? <br>- g: it may be disturbing at display sizes, but I think it'll work great at small sizes. <br>- r: too narrow; <br>- M, S: too wide; <br>- there are some weight inconsistencies... for example, C, G and S are too dark; <br>- the figures are 'technically' fine, but they don't fit the style. <br> <br>Saludos!</p>"
