    html: |-
      <p>Many Criterion DVD covers were done by <a href="http://www.kellerhouse.com" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Kellerhouse Inc.</a>. May be it's one of their many artworks using some bespoke typeface as they're well-known for.<br>
      Looks like they artificially emboldened by adding an outline stroke to some Signum-like (thanks Don) font and reworked counters.<br>
      BTW, following Don's previous modification guidelines, some more alternatives even if Trump Gothic is a nice find: <a href="http://www.myfonts.com/fonts/mendoza-vergara/proteina" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Proteina</a>, <a href="http://www.myfonts.com/fonts/grouptype/raleigh-gothic" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Raleigh Gothic GT</a>, <a href="http://www.myfonts.com/fonts/dizajndesign/komu" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Komu</a> A, <a href="http://www.myfonts.com/fonts/gautier/le-gendarmerie" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Le Gendarmerie 205</a>, <a href="http://www.myfonts.com/fonts/storm/header" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Header STF</a>, <a href="http://www.myfonts.com/fonts/typetrust/heroic-condensed" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Heroic Condensed</a>, <a href="http://www.myfonts.com/fonts/jnlevine/movieland" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Movieland JNL</a>, <a href="http://www.myfonts.com/fonts/bagraphics/title-gothic-light" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Title Gothic</a></p>
