      <p>The original movie titles from 1949 were quite different.<br><a href="http://www.artofthetitle.com/title/the-third-man/">http://www.artofthetitle.com/title/the-third-man/</a><br>
      I suspect that this is a modern font used by Criterion for its re-issue.<br>
      Some similarity to Georg Trump’s  Signum, digitized as by Canada Type as Trump Gothic <a href="http://www.myfonts.com/fonts/canadatype/trump-gothic/">Trump Gothic</a>, but much heavier in weight and the crossbars on E and H as well as the bottom of the bowl on R are too low. Or perhaps it's just artwork.<br>
      Don</p>
