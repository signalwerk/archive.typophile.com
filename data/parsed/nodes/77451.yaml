    html: |-
      <p>The danger of the "clear winner"  was proven years ago by Quark and is now proven again by Adobe.  Developers who have no competition grow lazy and unresponsive.<br>
      Also, an open system encourages more creative development by all parties. If a small group or even single individual were to create a truly viable auto-hinting tool, they would not need to develop an entire font production product, but could simply sell their "one trick pony" to everyone and have it fit right in to any work flow.</p>
    html_clean: |-
