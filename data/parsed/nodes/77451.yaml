    html: |-
      <p>Hello everybody :)</p>
      <p>I’m intensively testing Glyphs since, more or less, May 2010 and honestly I like it very much. Of course is a 0.X beta; some functionalities aren’t ready yet and there are some little bugs (but Font Lab has bugs too and it’s not free).<br>
      I’m designing and developing 2 font faces with Glyphs and I can definitely say that Yes, you can create a complete font, or you’ll be able to do very soon (for instance, I’m waiting to some advanced OT implementations to be ready).</p>
      <p>About the UI, I’m sorry to say I’ve never seen an uglier interface than FontLab (!)</p>
      <p>I find Glyphs’ UI much easier, friendlier and visually pleasant. </p>
      <p>Working with nodes is lovely (quite similar to FL but a bit nicer).</p>
      <p>Personally I prefer to have my App in one window only especially as I can edit my glyph into an inline text (great feature!). </p>
      <p>Glyphs automatizes many tasks you have to do manually in Font Lab; it does the stupid job leaving me thinking about design.<br>
      In particular:<br>
      1. it auto generates standard OT features<br>
      2. it auto generates all derivative glyphs combining components (accented letters etc.)<br>
      3. you can easily set kerning classes and dynamic side-bearings (that means to give your glyph the value of another and make them change together) all inside your editing window.<br>
      4. you can keep only one production file with open paths; Glyphs merges them automatically while exporting<br>
      5. Glyphs interpolation feature seems good (I’ve tried it on sans-serif only for now)<br>
      6. for now glyphs is free, as FontLab isn’t</p>
      <p>Glyphs drawbacks<br>
      1. You can’t export in TTF nor PS (personally I don’t care, but maybe someone would like it)<br>
      2. Kerning management on the entire-font or multi-layered-font scale could be easier<br>
      3. for the moment you can import .otf files but without reading OT features (It seems it should be implemented in next releases).</p>
