      <p>It is possible to control glyph order in Glyphs. As with many such things, there is a custom parameter to give you this control. It takes a list of glyph names as its parameter.</p>
      <p>I generally don't use the automatic feature generation. I've moved all my font source into Glyphs and I was able to preserve all my existing feature code as well as glyph names. </p>
      <p>Glyphs does lots of automatic stuff by default, but there are almost always ways to override the defaults if you don't like them. </p>
      <p>I also like the fact that Glyphs' document format is plain text, similar to UFO or ttx. It's possible to do certain kinds of operations on a .glyphs file using a text editor (but be sure to back up first--completely hosing the .glyphs file is also possible with this trick).</p>
