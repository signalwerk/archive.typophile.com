      <p>I can't recommend Glyphs highly enough!</p>
      <p>If you're even toying with the idea of switching to Glyphs, download the 30-day free trial and give it a try. If you think you're missing a feature from your previous editor, look around in the tutorials or the manual, or ask on the boards: It's probably available, and possibly in an easier-to-use form than you're used to. :)</p>
      <p>In the ancient part of this thread, somebody mentions the unified edit windows as a drawback. Nonsense! That's the best part of Glyphs. I switched to Glyphs from FontForge, and that was one of the most notable improvements. Do spacing &amp; kerning in context and with live previewing, and use placeholders to switch from one working glyph to the next. Super convenient.</p>
