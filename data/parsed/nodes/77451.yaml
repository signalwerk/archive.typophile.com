    html: |-
      <p>I like it. I work with several other UFO-based tools, so it's easy to add Glyphs to my workflow. I have not been using it long, but here are some of the things I like about it so far:</p>
      <p>- Simple, clean interface that lets me focus on what I'm doing.<br>
      - Automatic anchor placement and accented glyph generation (this is one of the big things I've been using it for).<br>
      - Ability to edit font data pretty much wherever it appears (e.g., the glyph names and unicode values in the font window).<br>
      - The extensive list of "smart" groups in the left column of the main window, with the ability to add your own. (Robofont has a similar feature, but comes with almost none pre-made.)<br>
      - The ability to type in the glyph window, so I can see the glyph I'm working on in context.<br>
      - Virtual slanted sidebearings.<br>
      - Simple search filter in the main font window (e.g., type "caron" and instantly see only the glyphs that have "caron" in the name).</p>
      <p>Things I don't like so much:</p>
      <p>- Transformation tools seem difficult to use (or maybe I haven't figured out how they are supposed to work).<br>
      - No way to go to the next or previous glyph in the glyph drawing view.</p>
      <p>I have not used all the features yet, and have not started or finished or completely created a font in it, but it has been a useful addition to my tool set and has already saved me a lot of work. I am also starting to work somewhat with Robofont.</p>
      <p>I don't see Glyphs by itself replacing FontLab, but it's not hard to imagine spending more of my time in Glyphs + Robofont + the other UFO tools than in FontLab. It will also be interesting to see how FontLab evolves in this changing landscape (and with Georg on board).</p>
