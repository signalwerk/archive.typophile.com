    <p>Who has any experience editing/designing with "Glyphs' (<a href="http://schriftgestaltung.de/">http://schriftgestaltung.de/</a>) - in other words, how would someone compare Glyphs vs. FontLab in terms of features and usability.</p>
    <p>I think the most important question is if it is possible to create a complete font in "Glyphs" e.g. after having all the single shapes prepared in Illustrator...?</p>
    <p>Many Thanks - Alex</p>
