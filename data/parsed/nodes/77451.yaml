    html: |-
      <p>Hi Mark,</p>
      <p>Thanks for your nice summary.</p>
      <p><cite>- No way to go to the next or previous glyph in the glyph drawing view.</cite></p>
      <p>There is a way to do this. on the compact/MacBook keyboards use Fn+left/right on the extended keyboards use the scroll up/down keys (the two in the middle of the six keys block above the cursor keys).</p>
      <p><cite>- Transformation tools seem difficult to use (or maybe I haven't figured out how they are supposed to work).</cite></p>
      <p>I know that the transformation panel is a bit confusing. I will try to explain.</p>
      <p>Transformation Panel:</p>
      <ol><li>First item, like in Adobe apps, is to choose the origin of the transforamtion.</li>
      <li>Then two buttons to mirror the selection.</li>
      <li>This this is the tricky part. If you put in 10% and click the "+" button it actually scales 110%, if you click the "-" button, it does exactly the opposite, scaling to 1/110% = 90,91%. So the both operation reverse themselves exactly.</li>
      <li>The rotation and slanting should be clear</li>
      <li>The slanting has one hidden functionality. If you hold down the shift key while clicking the slant right button, it actually "cursivies" the letter. It applies corrections that remove the slanted appearance. This only works if you have set the standard stems correctly. The same option is available in the transformation filter.</li>
      </ol><p>I hope that helps a bit. If you have more question, please ask (either here or in the Glyphs forum). I’m happy to help.</p>
      <p>And can you describe your workflow with UFO - RoboTools - Glyphs?</p>
