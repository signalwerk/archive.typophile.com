      <p>Chris, </p>
      <p>as I've written here several times, I agree with you. From our own perspective, it's been actually quite a burden to practically be the only font tool company on the market (apart from DTL/URW++). Many users have asked to implement various kinds of functionalities in FontLab Studio, and the tool has grown to become quite complex. We're happy that there are alternatives now, because the tool makers can learn from each other, and the tools can complement each other (provided the exchange of data is easy, and we hope to achieve that with the UFO format). </p>
      <p>Best,<br>
      Adam</p>
