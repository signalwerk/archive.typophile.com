    user: 32723
    date: 2016-12-16T17:19:00
    date_raw: 16 December 2016 - 5:19pm
    votes: 3
    html: |-
      <p><strong>Glyphs</strong> offers several features to make font production easier. Unicode codes, classes, OpenType features, script grouping, sorting, composites with diacritics… all this Glyphs do automatically or demanding minimum effort from the user. It also brings some niceties regarding partial components, letting you work with a more modular approach (regarding parts which repeat between glyphs). You don't need to worry about glyph names as Glyphs controls that. Georg, Glyphs' developer, is regarded as excellent at user support.  And there are dozens of scripts to enhance original functions.</p>
      <p> <strong>Fontlab 5</strong> adopts other approach. It is up to the user define font classes, features, sorting and so on. It is aged and you see that since the very first use as its interface follows the late 90s style. The upcoming <strong>FontLab VI</strong> represents a huge upgrade from version 5. It is still under development and you can try its public previews. The interface is clean, beautiful, very organized, and there is a bunch of great tools to design Bézier curves. A number of procedures are now more easy to do and some concepts, like Genius/Servant points, Shapes/Clones, Tunni controls, and Tags, put on steroids what we used to see in a font editor. But the new FontLab still let to the user define most of the font characteristics. You will not get auto this or magic that. And, as a completely new application, it starts without any add-on/scripts available.</p>
      <p>So which is better? It depends how to you like to work.</p>
      <p>I develop large, multi-script fonts with several alternates. For me, it is critical to freely reorder the glyphs and quickly find where things are because the fonts are quite big. And I use a well defined name schema to identify groups of glyphs (.uc, .sc, .pc, .la. .da, .hs, .op, .ot, etc.) which many times are combined (for example, an alternate small caps to match a language preference would be xxxx.la.sc). Glyphs expect to find specific suffixes like .smcp and .case to make all its automatic features to work. Custom suffixes need to be manually handled. For non-Latin scripts, Glyphs adopts 'friendly' names with suffixes like xxxxxx.cyr or xxxxxx.grk, what I don't like.</p>
      <p>I also prefer to control small details about UI, to manage the OpenType features and classes, and to mark glyphs with pale colors to indicate different groups or stages of development. In other words, I want to choose exactly how to work. This freedom Glyphs does not offer. It chooses so much about the user workflow to achieve more automation — a perfectly valid approach that matches the needs of many designers. But, for me, FontLab fits better.</p>
      <p>Another point is the lack of node/handle coordinates in Glyphs — there is a plug-in that do this, but it is not to my taste. So, although Glyphs is a mature, modern, easier and very good font editor, for me it is still better to use FL5 (and experiment with the new options of FLVI). For you, as I said, it depends how you like to work. Happily, you can try both editors (and also the very good <strong>RoboFont</strong>) prior to decide.</p>
    html_clean: |-
