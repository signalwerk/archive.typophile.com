      <p>Thanks for the tips, Georg. I will try them out.</p>
      <p>Regarding my workflow, it's a bit in flux at the moment with all these new tools becoming available (well, two new tools, anyway).</p>
      <p>Up to this point, I have used UFO mainly when I want to use Metrics Machine, Superpolator, Rounding UFO or other UFO-based tool, but still doing most of the production in FontLab.</p>
      <p>I am interested in moving to a more UFO-centric workflow and Glyphs seems well-suited to be part of that. I like having some flexibility in choosing tools. The .vfb format sort of forces you to stay inside FontLab for most of the process, and only using .ufo in a supplementary way. Having editors like Glyphs and Robofont that can work directly with .ufo format gives me more options, which I'm now exploring.</p>
