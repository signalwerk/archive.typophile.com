    html: <p>You've got nothing to lose by trying out the beta of Glyphs while it's free. (It will be a paid app once finished, though the developer hasn't yet hinted at the price.) You can copy and paste outlines from Illustrator, though just as with FontLab they need to be properly scaled first. While Glyphs can't match the extensive functionality of FontLab, it's got the basic tools and offers some unique features and clever ideas, all within a comparatively elegant UI. I can't think of any reason it couldn't be used to develop a complete font, but keep in mind it's beta software, so save frequently.</p>
