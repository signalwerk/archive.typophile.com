    html: <p>Glyphs is a decent entry-level font design tool. It’s a terribly inefficient program because it crams too many ideas into one tabbed window, which leads to lots of annoying tab switching and zooming. But from a new user’s perspective that eliminates much of Fontlab’s harsh learning curve, so that’s probably a net gain.</p>
