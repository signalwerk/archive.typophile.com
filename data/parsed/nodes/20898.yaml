      <p>Stefan,</p>
      <p>Once again, thank you kindly for producing such a great typeface for the rest of us to enjoy.</p>
      <p>The Roman small caps seem to work fine with the Medium weight, although I realize it's meant for use with the Roman. And that's alright. The Roman looks great as well. I think the solution (to suit my particular tastes) would be to set the leading a little tighter when using the Roman. And I must admit, the finer details of the font show best when using the Roman, obviously.    </p>
      <p>I look forward to your next set of Tarocco faces. Thanks again.</p>
