    <p>My questions about Caslon the other night had me comparing various version of Caslon to one another, as well as to other fonts. I hadn't visited Mac Rhino (<a href="http://www.macrhino.com/" title="http://www.macrhino.com/">http://www.macrhino.com/</a>) in a while, so I thought it might be time to look up a font that caught my eye earlier this year: Tarocco. </p>
    <p>I was impressed with the lovely .pdf specimen, and I determined that Tarocco's generous x-height and airy (but not disturbing) spacing would serve me well. I decided to throw Stefan Hattenbach a few bucks and purchased the font set. I must say, that .pdf really showcased the font beautifully. It was quite effective! Boy am I pleased. Seven weights, including sc/osf faces as well as some basic ligatuers. Although I would have liked a few more ligatures and some ornaments thrown in, I figured the former was due to the overall spirit of Swedish design (right?), and the latter due to keeping costs reasonable. What a great value. </p>
    <p>My question is about the small caps: Maybe I should know better, but there is no Medium small caps set included. It's there for the Roman, however. I prefer to use the Medium for extended text work because (surprise, surprise!) it's a bit more meaty. I have to use the Roman small caps with the Medium. Is this a normal situation? The Roman (non-medium) small caps seem to work well with the Medium, but I still wanted to know whether this is usually a typographic no-no. Or is my eye still the best judge?</p>
