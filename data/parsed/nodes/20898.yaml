      <p>Christian,</p>
      <p>Thanks for your positive thoughts of my typeface Tarocco. This was my first major text face and I've made more ligatures in my later ones (Delicato and Anziano). My intention was to keep it as an original text face for books. These usually don't carry small caps or italic ditto for other weights than the Roman/Regular one.</p>
      <p>Good news about Tarocco though. Very shortly I will have another "set of Taroccos" released at Psy/Ops Type Foundry. All weights will carry OSF (redesigned) and some newly designed ornaments.</p>
      <p>Regarding your question about mixing weights... I wouldn't say it's a total "No No", but maybe not "normal procedure". On the other hand if it looks good with your eyes. I would say it's ok. I'm sure there are many different perspectives on this one... let's see about other comments?</p>
