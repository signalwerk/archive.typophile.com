      <p>&gt;I’m trying to find if there is a benefit in using subjective aesthetics testing to benefit the scientific part of the research, the ’case study’ part being “can it benefit the reader experience”&lt;</p>
      <p>This is excellent. But it is completely wrong. However, the fix is simple: simply invert it to 'the case study part being "do [good aesthetics] <em>detract</em> from the reader experience?"'</p>
      <p>It stands to reason that good aesthetics are noticeable as such, and the time spent noticing them will be time wasted on admiring aesthetics when all time spent reading needs to be spent . . . reading.</p>
      <p>The problem with type designers today is that they are obsessed with harmonious aesthetics to the detriment of readability. Graphic design is not, in many respects, a good foundation for readable type design. Because what the graphic designer finds beautiful, harmonious and attention-getting is a thrust that does not relate at all to what the reader finds easy to read. </p>
      <p>I see graphic design as being primarily about a kind of macro experience and type design as being primarily a kind of micro experience. (That's a very bad way of expressing it but the best I can do at this moment -- enough maybe to get the germ of the idea across?) This was brought home to me when I had a glance at Paul Hunt's Reading project. The typeface seems to have tentacles that want to reach into the very fibres of the paper. Here, I thought, one could see a design axis, a design will, a design theory, a design practice, a praxis, that was relevant to <em>reading</em>.</p>
      <p>It was brought home to me in a different way when I saw a large dual column edition of Shaw's essays set magnificently in metal Fournier. The pages all but read themselves. </p>
      <p>The moral of that experience was one I have felt was paramount since I first tried to design type: nobody, nobody, nobody, is ever going to get <em>reading</em> until they start designing single-size fonts. A single master used at multiple sizes is always a fatally maimed 'monstrico'. Nor is there the slightest justification for single-master/multiple size fonts other than money, money, money. </p>
      <p>You can ask: 'where is the money for us to design single-size fonts? We can't afford to spend ten years, rather than one, on a text design that only a few will buy.'</p>
      <p>Maybe the answer lies in T.S. Eliot's prescription that the poet needs to have a job separate from poetry.</p>
      <p>Certainly, if you look at what is happening today, with the designers who <em>are</em> designing single size type, that is what happens. Two examples: Robert Slimbach's new Garamond (which with four entirely separate optical multiple masters can be permitted, for this argument, to count as single-size) was designed <em>entirely in his spare time</em> over a period of many years. In this he is still following the direction of Sumner Stone who cannot possibly be making enough money from the great Cycles family to compensate him for the endless thousands of hours of development and sheer <em>being</em> that it cost over a period of more than a decade, and continues to cost. </p>
      <p>So I guess my larger point is that there is no point in talking about readability until you have thought through some of the obstacles to readability which have been set in motion by the direction that typeface design has taken since, roughly, 1960.</p>
