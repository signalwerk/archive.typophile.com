      <p>There are some really interesting things being said here. [as a designer] I can understand the frustration of trying to reduce design &amp; typography to a set formula, it does in some ways take the creativity out of design, but could you also use it for the reverse effect?</p>
      <p>I'm quite interested as it would appear that some of the views here are against using scientific research at all in the design process. Considering this, do you feel that the science could fit into the process, even if it is just to create a process? Does anyone feel that the research would be useful in qualifying design choices to clients, after all, I know how annoying it is when a clients only qualifying statement is "because I like it".</p>
      <p>Do you think you could do a study into the emotional reaction to a typeface, a simple "what feeling does it conjure for you?" to see if there is a correlation between opinions to help inform typographic choices? </p>
