      <p>"the kind of test you are talking about is too all embracing to be realistic/useful as a scientific test."...</p>
      <p>Eben, of course it is! That is my point and it is not the scientists fault. The reason more tests are not done and that more useful results don't come out is that there are so many variables to control, which are so far not possible to control, as to make both the test too complex or the data too vague. Other issues are that there is very little financial support for this arena of work and the potential of monetary profit is small.</p>
      <p>"all this gnashing of teeth about scientists coming in to stamp all over our nice typographic grass is a bit silly as well and frankly just as naive."</p>
      <p>Who said that scientists are coming in and taking our turf? Not me. Scientists are not coming in and there is very little work done in the area of typography. My beef is not with the scientists--there are several in my family. My beef is with the rest of us who jump beyond the scientists conclusions and give the studies greater weight than even the scientists who made them. Scientists are not afraid to question each other but we are afraid to question results or to limit the scope of results to the level intended by the scientists. Scientists work incrementally. They take a small piece of the puzzle and analyze what bits they can and build upon the previous work done by others, Other scientists take different chunks either independently or cooperatively. After years, there is a body of work which others look at objectively and may prompt yet another study. This goes on for years. The scientists are not in awe of each other; they just work and read what others have published.</p>
      <p>We all need to stop being so full of ourselves and just look at our role pragmatically, even naively. When we pull and push control points about in FontLab, we are experimenting, too. It may not be rigorous scientific method but we control some variable and change others. I have prattled long enough.</p>
      <p>ChrisL</p>
