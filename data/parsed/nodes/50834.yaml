      <p>Kevlar:"It’s a choice between improving on the existing research or criticizing from the peanut gallery."</p>
      <p>...oh let's not forget the peanut gallery, the Other... who actually measure the humans of specific groups and outfit them with aesthetics to fit. Or, who you callin' peanut gallery, peanut gallery's peanut gallery? ;)</p>
      <p>CA: "...it would appear that some of the views here are against using scientific research at all in the design process."</p>
      <p>On the contrary, that is how we work: the client feels dark we lighten the type, the clients feel happy we put on the swash. Seriously though, our process of outfitting clients with fonts, a subset of the font selection process for sure, is a scientific progress from an unknown through a growing known, to an optimized legible aesthetic for some kind of foreseen reader experience. We do not do this arbitrarily, but rather progress from small to large glyph repertoires, one to more styles, and from general to specific composition, in search of specific complimentary and contrasting typographic aesthetics, to reach that foreseen reader experience.</p>
      <p>I am against most reading research that does not involve reading. I have never been against good scientific research, which I define for one thing, as offering identification of the type(s) used, and the composition(s) and includes in the results, these specifications and examples of the typography as presented to the study subjects. I have also never been against good scientific research on scientific research on design legibility and aesthetics, as Kevlar talks a lot about. But as one can see, sometimes, some forget where the peanut gallery is, and where the use of scientific research is just another live wire in the design business.</p>
      <p>Cheers!</p>
