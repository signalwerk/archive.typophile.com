    html: <p>I'll give you a good example of how typeface design impacts readability. Penguin puts out an excellent set of historical atlases in 9" x 7" softcover format, text by Colin McEvedy. The text was originally printed in Times Roman at about 8, perfectly legible and a pleasure to read. The layout encouraged comprehension. Later, they reprinted these books, same size, but with the typeface changed to one (I forget which right now and I'm too lazy to track it down) with a relatively higher x-height and at slightly larger size, reducing the white space. The design is less attractive and the text less legible, never mind that the point size is bigger. I wanted to sue.</p>
