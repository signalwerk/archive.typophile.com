      <p>In the article <cite>Measuring the reading experience</cite> in Typo Magazine Issue 22, I wrote about my experiences in attempting to measure aesthetic aspects of typography. It’s known that people perform better on cognitive tasks after being induced into a good mood by receiving a gift or seeing something pleasing. I examined if it was possible to do this with typography and found improvements both on the candle task (a cognitive task) and a reduction in the amount of activity in the corrugator (frowning) muscle after reading with better typography.</p>
      <p>It doesn’t cost millions of dollars to do this. In fact I did a live demonstration of this effect at ATypI in Helsinki with the remote associates task (a different cognitive task). After listening to me drone on for a while, I asked the audience to find the word in common with <cite>swiss, cottage, and cake</cite> (answer = cheese). Perhaps half of the audience found the correct answer. Then after listening to the highly entertaining Herr Spiekermann for a minute, I asked the audience to find a different remote associate, which about three quarters of the audience found. It didn’t cost a penny to run.</p>
      <p>Cheers, Kevin</p>
