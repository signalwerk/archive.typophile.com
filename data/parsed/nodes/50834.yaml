      <p>“How is it possible to know whether it’s typeface or type size that’s affecting readability?”</p>
      <p>In my ICTVC 2004 presentation I said a tabulation of the perceptual processing impact of manipulating type-form microvariables is maddeningly elusive. I tried to suggest we look at specific determinants of ‘perceptual discrimination affordance’ in letters or specific determinants of the effective and automatic formation of ’word-level codes’ with words, like lateral interference or crowding, response-bias, cue value and computation costs as some of the areas that are effected.</p>
      <p>It is not enough to change a variable, measure the effect along a single raw dimension like reading speed and then conclude ’readability’ is improved. This becomes blinding. We go around in circles. We stop trusting our cultivated vision and craft wisdom. We kid ourselves into thinking we have understood readability in this way. We've gained no understanding at all of what our type-forming micro-decisions actually <strong>do</strong> <em>in perceptual-processing terms</em>. We can sense and experience what occurs, but we haven't deepened our vision and craft wisdom with evidential knowledge about what occurs. Yet, intelligent design requires just that. </p>
      <p>We need to know, for example how spacing affects the formation of word-level codes. How does too wide or overly tight spacing disrupt this? Why? What are the tolerences? </p>
      <p>Or we need to know, does decreasing stroke contrast, or making it variable effect the cue-value of distinctive features in such a way that word-level codes are harder to assemble in the visual cortex.</p>
      <p>Many sciences have acheived this level of specificity and particularity. Why not the science of reading?</p>
