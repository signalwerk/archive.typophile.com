      <p>Science can havr its place and its value. We must, however, guard against results being presented as scientific being placed on a pedestal and viewed as absolute truth because the name "Science" has been attached to it. Science once told us that Pluto was a Planet; now it says, not so. I don't pretend to know which conclusion is correct but it is clear that scientists can error as much as the rest of us. All scientific results need to be scrutinized and questioned. All research methods and procedures need to be examined and questioned without being held in awe. To me, the biggest issue is that the conclusions that are drawn from data are made by humans. The data may be correct but the conclusion may be wrong. If data tells me that regressions in reading are greater when a reader comes across a word in italic, that may indicate that italic is harder to read or it may also tell us that the reader is pausing to contemplate why that word is in italics or just triggers a memory like "I remember reading that book in college." Both may be true but how do we know? There is judgement in analyzing data just as there is in designing a glyph visually. Either can be misjudged. The difference is that we just say the designer made a human error while we are not so quick to be as critical of anything residing  in the realm of science.</p>
      <p> ChrisL</p>
