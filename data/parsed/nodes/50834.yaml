      <p>“The reclassification of Pluto isn’t evidence of scientific error: it is evidence of science being done.” [John Hudson]</p>
      <p>This obscures the fact that nothing new about Pluto was actually revealed (though it seemed at first that someting new about Plato was being proposed): the reclassification of Pluto had to do with a redefinition of planethood. Taking this into the realm of metaphor though, if Socrates was the sun, might Plato not be admitted to planethood after all?<br>
      See: <a href="http://www.space.com/scienceastronomy/060824_planet_definition.html" title="http://www.space.com/scienceastronomy/060824_planet_definition.html">http://www.space.com/scienceastronomy/060824_planet_definition.html</a></p>
      <p>How my comment about reclassification on account of redefinition applies to the issue at hand is that, if legibility or readbility are operationalized in terms of eye movement patterns (saccadic amplitude and the absence of regressios), or ease of visual word form resolution (as quantified by the size of the word superiority effect), rather than simple reading speed, or the simple <em>discrimination affordance</em> of letter shapes under compromised conditions caused by distance or illumination, what counts as a legible or readible font might be expanded or contracted or reclassified.</p>
      <p>Improving the reader’s experience can of course involve all of these things, but often includes much more, including introducing elements that enhance expressive specificity but have measurable — but non-fatal — perceptual processing costs. Some of the ‘much more’ might only be accessible to anecdotal report.</p>
