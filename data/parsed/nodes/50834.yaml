      <p><em>where is the money for us to design single-size fonts?</em></p>
      <p>I've designed several, some as commissions, some as retail.<br>
      For instance, a text font for the Globe and Mail newspaper, and a revival of a 19th century book face.</p>
      <p>Of course, people will use them at sizes other than for what they were originally created.<br>
      However, that is their prerogative.<br>
      The idea that a typeface will only work at a given size is mistaken, because it ignores the contribution of the typographer, and the effect that different layouts, media, and reading environments have on the effect of type and process of reading, not to mention the variability of reading skills and style, and content.</p>
      <p>This is not to say that the idea of size-specific fonts is wrong, just that text fonts work within ranges, and the specification is as much the typographer's as the foundry's--and online, the reader's. Isn't this appropriately post-modern for the 21st century, multiple authorship?</p>
