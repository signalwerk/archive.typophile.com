      <p><cite>What were the two type specs?</cite></p>
      <p>There are five studies with 3 different pairs of document styles discussed in the article. One pair is of good and poor page layout including good and poor image placement. Another pair either included or omitted OpenType layout features such as ligatures and small caps. The third pair had either reasonable h&amp;j, or had severe problems with rivers. There are pictures of the document styles in the Typo article.</p>
