      <p>There are ways to criticize every study, but sometimes it's more useful to talk about the positive aspects of projects.</p>
      <p>The question being discussed is how to measure aesthetics. The typographic conditions in the Song &amp; Schwarz may not be terribly useful, but along with the studies I wrote about in Typo, these are possible methodologies for measuring the reading experience that go beyond letter legibility and reading speed measurements. With these methodologies you could use your own typographic expertise to compare conditions that you find interesting. It's a choice between improving on the existing research or criticizing from the peanut gallery.</p>
