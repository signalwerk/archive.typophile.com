      <p><em>and under-tracking leads to crowding, but wouldn’t it be nice to know precisely why both these things disrupt reading ... or how exactly having an integral object-like unit improves reading?</em></p>
      <p>As far as I see, rather than describing too tight spacing, "crowding" actually results from <em>good</em> spacing -- "crowding" in the way Eben uses it is formation of "gestalt", or what you seem to call an "integral object-like unit" which, with the subject at hand, may safely be called "word". The latter part of the quote I don't understand though. What "how exactly"? Ideal reading conditions means words that are distinguishable and recognizable as such. What riddle is there that needs to be solved?<br>
      By the way, I am amused by the term "crowding", especially when confronting it with the older "gestalt". Both acknowledge the same phenomenon but approach it from opposite directions. It looks like the "crowding" is rooted in Anglo-American philosophic tradition which is obsessed with reducing everything to smallest particles as if these had some built-in evidence, but gets trapped in the un-answerable question, how come that we are able to get from these particles to a unity? From sensual impressions to conceptions, ideas, objects? (The "reference" problem.) "Crowding" nicely reflects this, alluding to a bunch of particles lumped together <em>somehow</em>. "Gestalt" instead starts out with concepts, ideas, objects -- the unity which "crowding" acknowledges, wants to explain, but does not really know how. From a "gestalt" perspective, perception is perception of objects, period, and particles are recognized only in as far as they form unity.<br>
      Off-topic.</p>
