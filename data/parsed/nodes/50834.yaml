    html: <p>Scientists do science, which is a methodology that tends to limit the scope of individual experiments so as to ensure a solid basis for furture work, rather than overreaching itself. This narrow experimental focus may indeed look like 'tunnel vision', and it often guaranteed to make any individual experiment appear either insignificant or banal to an outside observer, especially one who may have extensive practical or anecdotal experience of the thing being studied. But the point of any individual experiment is not to answer a grand question, but to see whether the result contradicts or supports the results of other experiments. And occasionally the results will contradict the beliefs of the non-scientific practitioner, and that's when things get interesting for the rest of us.</p>
