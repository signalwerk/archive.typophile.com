      <p>Eben - I'm completely aware that the second half of the tests are very subjective and don't really constitute a scientific test, but the idea is that if you were to couple these with scientific tests for reading speed, comprehension, retention, etc. then you could use them to an advantage. I'm trying to find if there is a benefit in using subjective aesthetics testing to benefit the scientific part of the research, the 'case study' part being "can it benefit the reader experience"</p>
      <p>I understand the need to include type designers, or at least designers who are aware of the essentials of type design. I am a graphic designer with a strong interest in typography, I am working on designing my own typefaces, and also work a lot with graffiti and handwriting (one of my interests is the crossover that these have with typography, where the lines blur, etc.) so I'm not <strong>too</strong> naive, but I don't profess to know all about the area.</p>
      <p>I don't think this 'teeth gnashing' is all naive and silly, as it tells a lot about how the designers feel about the process. You get to the point where you can find out exactly <strong>why</strong> they feel like this and then you can find a way either around, or to turn this to the advantage and use it to aid the process. Surely that's of benefit, analysing problems to find solutions?</p>
