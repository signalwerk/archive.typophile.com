      <p>For me science measures only what it sees in nature. Behavioral science only measures what it thinks it sees in human behavior. Humans often think and do things that are not visible or measurable. The products developed by humans can be analyzed by science after creation but not until then. Measuring a product after creation does not necessarily yield a path for science to create a better product of a similar kind. Patterned simplification can lead to measurable malfunction.</p>
