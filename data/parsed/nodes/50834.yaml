      <p>“If you break the rules of good typography, like over or under track [...]”</p>
      <p>David, I think it's not so hard to see that over-tracking causes the word to fall apart as an integral object-like unit, and under-tracking leads to crowding, but wouldn't it be nice to know precisely why both these things disrupt reading, or how exactly having an integral object-like unit improves reading?</p>
      <p>Explain to me in perceptual psychophysical or perceptual-mechanical — perceptual science — terms why it is important — if it is — that the cluster of letters form an optically integral or cohesive object-like unit. Why might it be important that the word as a visual unit resist easy deomposition into it's constitutent letters?  Isn’t this the implicit belief that motivates type-design? Talk to me about the work that the visual cortex performs in reading that makes this desirable or mandatory.</p>
      <p>Knowing this might give weight to our fetishistic attention to spacing.</p>
