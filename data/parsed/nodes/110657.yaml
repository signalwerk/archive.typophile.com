    html: |-
      <p>I would stick with a variation on one of those two. You could choose something from the late 19c or even look at Franklin but older faces seem to lack refinement. Keep it simple and remember the scale changes the type entirely. You have all the Eames faces and tracking and kerning to play with too.</p>
      <p>J</p>
