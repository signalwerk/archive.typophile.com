  html: <p>I'm using Eames (House Industries) for body text, and Trade Gothic Bold Condensed (No. 20) for headers. What do you think is a good font for the main title? Something that plays well with these two. Thanks in advance.</p>
  html_clean: <p>I'm using Eames (House Industries) for body text, and Trade Gothic Bold Condensed (No. 20) for headers. What do you think is a good font for the main title? Something that plays well with these two. Thanks in advance.</p>
