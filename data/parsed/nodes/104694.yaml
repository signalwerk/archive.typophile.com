    <p>I was wondering if the new Breauhare typeface released on MyFonts and called bauhaus-bugler <a href="http://www.myfonts.com/fonts/breauhare/bauhaus-bugler/" title="http://www.myfonts.com/fonts/breauhare/bauhaus-bugler/">http://www.myfonts.com/fonts/breauhare/bauhaus-bugler/</a><br>
    was not a bit too inspired by one my release called Qero also available at MyFonts here:<br>
    <a href="http://www.myfonts.com/fonts/typofabric/qero-nite/" title="http://www.myfonts.com/fonts/typofabric/qero-nite/">http://www.myfonts.com/fonts/typofabric/qero-nite/</a></p>
