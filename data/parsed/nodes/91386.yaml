      <p>Thanks, John. Interesting:</p>
      <p><cite>If it is exported from a program such as InDesign then the original Unicode text strings should be written to the PDF. </cite></p>
      <p>because that's exactly what I did. That's why I added the "disclaimer" about using Preview ;-) If I hover above my font in InDesign's Glyphs panel all capitals are identified as "Uppercase". It's expected as well, as the CFF part of my font only contains the uppercase, as lowercase is added with the Encoding trick.</p>
      <p><cite>Whether this is a problem for you or your users depends on whether they care about the case of the original text source.</cite></p>
      <p>I don't think that's a problem. If one sees all-caps in a PDF, it's reasonable to expect that copying the text would also result in all-caps.</p>
