      <p>Much depends on how the PDF is created. If it is exported from a program such as InDesign then the original Unicode text strings should be written to the PDF. If it is distilled from a print stream, then Acrobat uses the glyph names to try to recreate the text strings. The latter situation is where having single glyphs named e.g. /A/ /B/ /C/ etc. representing both upper- and lowercase characters is problematic. Whether this is a problem for you or your users depends on whether they care about the case of the original text source.</p>
      <p>I recently made a monocase font in which we double-encoded for upper- and lowercase, but in this instance the recommendation to users is to always set all-caps text, and the lowercase encodings are only provided for compatibility purposes.</p>
