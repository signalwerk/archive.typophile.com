      <p>Craig, thanks for being the guinea pig! That thread contained <em>exactly</em> everything I was cont'mplating.</p>
      <p>So I guess it's Okay with doubling uppercase to lowercase for an all-caps font; your Unicase is indeed another style where the "actual" case of characters is irrelevant.</p>
      <p>So, what about the Unicodes that get stored in a PDF? Hold on while I make a test file ... Result of copying text out of a PDF:<br>
      "THIS IS CAPS<br>
      THIS IS CAPS-lC<br>
      THIS IS All lC"</p>
      <p>That returns all as capitals <em>except</em> for that lowercase L. Hmm. Let me add a disclaimer then: I used OS X's Preview, which may not have been the best choice.</p>
