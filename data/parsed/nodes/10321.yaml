  html: <p>It's possible no one will give a hoot about this, but is anyone else as mad as I am about the typography of the Washington Nationals? When I saw the new Nationals hats, with it's loose, playful script 'W', I was intrigued! How old fashioned!  <br> <br>But then I saw the jerseys� The combination of the script 'W' and the jersey typeface is very frustrating to me. Typophile seemed like the safest place to vent.   <br> <br><img src="http://www.typophile.com/forums/messages/30/69793.jpg" alt="Nationals Cap"> <br><img src="http://www.typophile.com/forums/messages/30/69794.jpg" alt="Nationals Shirt"></p>
