    <p>Originating in this post: <a href="http://www.typophile.com/node/40466" title="http://www.typophile.com/node/40466">http://www.typophile.com/node/40466</a></p>
    <p><a href="/wiki/Chuffed" class="freelinking" rel="nofollow">Chuffed</a> (<em>adj</em>): Quite pleased. </p>
    <p>In <a href="/wiki/Typophile" class="freelinking" rel="nofollow">Typophile</a> <a href="/wiki/Terminology" class="freelinking" rel="nofollow">Terminology</a>; it's rather the opposite of <a href="/wiki/Squoosh" class="freelinking" rel="nofollow">Squoosh</a> as coined by <a href="/wiki/Miss%20Tiffany" class="freelinking" rel="nofollow">Miss Tiffany</a>.</p>
    <p>As the orginal post also illustrates, less useful terminology has also been developed, based loosely around the lesser Chuff (<em>intransitive verb</em>): to produce noisy exhaust or exhalations : proceed or operate with chuffs</p>
