    <p>In <a href="/node/12022" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Typophile</a> <a href="/node/12038" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Terminology</a>; it’s rather the opposite of <a href="/node/12967" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Squoosh</a> as coined by <a href="/node/20077" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Miss Tiffany</a>.</p>
