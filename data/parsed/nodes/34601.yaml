  html: |-
    <p>I'm looking for a free serif font that has a short (low-profile) hyphen. I am creating an open source font for Gregorian chant (<a href="http://www.marello.org/projects/caeciliae" title="http://www.marello.org/projects/caeciliae">http://www.marello.org/projects/caeciliae</a>) and I am interested in recommending other free fonts that would work well for the accompanying text. Some very basic requirements:</p>
    <ul>
    <li>short hyphen (these come up a lot in the chant text, and smaller = less obtrusive)
    </li>
    <li>acute accented æ and œ if possible (in case those don't come out correctly, they're ae and oe ligatures)
    </li>
    <li>other standard ligatures would be a great plus
    </li>
    </ul>
    <p>I like Cardo, but wow: it has a long hyphen.</p>
    <p>Thanks for any thoughts or recommendations. -B. Matthew</p>
