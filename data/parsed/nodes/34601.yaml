      <p>Well, regarding the long hyphen in Cardo, you could horizontally compress its hyphen to the size you want (if that's possible in whatever program you're working in). Since it's just a straight horizontal line in Cardo, there shouldn't be any distortion as there normally is when compressing or expanding glyphs.</p>
      <p>A free font that I've heard good things about is <a href="http://scripts.sil.org/cms/scripts/page.php?site_id=nrsi&amp;item_id=Gentium" rel="nofollow">Gentium</a>, but I don't know whether its hyphen is any shorter.</p>
