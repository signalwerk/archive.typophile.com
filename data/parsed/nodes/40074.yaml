      <p>Hi Jorg,</p>
      <p>I’m sorry to inform you but this is a hacked ttf copy of PF Beau Sans. Let me explain to you. Shortly after our site went up a few months ago it was hacked and somehow they managed to get several of our fonts but only the ttf versions which are used specifically online for generating the samples in the font test driver section. We acted immediately and now everything is well hidden but the damage was done. I’ve had a hard time managing illegal circulation of our fonts to a minimum. Our opentype fonts which are sold online including PF Beau Sans are optimized and each one of the characters is made up of just a few nodes (postscript bezier curves). On the other hand the ttf versions being truetype contain multiple nodes (as is the case with this one) which were generated when we converted the opentype into truetype simply for online testing. No hard feelings but I would appreciate you buying the font.</p>
