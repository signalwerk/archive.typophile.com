    <p>After converting <code class="freelink freelink-error freelink-Array freelink-error-Array">[Bad link]</code> (by Parachute) to outlines in Illustrator CS3, I noticed that it's forms are made up of very many points. Especially the V looks like it could be made with a lot less.</p>
    <p>I'm not a font designer, but isn't there a point to using as few points as possible in the design of a font? </p>
    <p>And is this an example of using too many points, or is there a reason for doing it this way?</p>
    <p>I'm now assuming that converting the font to outlines in illustrator will give approximatley the same points as those in the original design. Please correct me on this if I'm mistaken. </p>
