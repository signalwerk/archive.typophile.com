    html: |-
      <p>Cubic_DS says:<br>
      The OTF format can describe the shape of characters in either TrueType or PostScript formats.<br>
      True type format needs more points to describe the same shape of a glyph...<br>
      That’s why I’m asking...</p>
      <p>It is important to be very clear in the definition of OpenType. There are too many myths around this format: OpenType is a transparent format that can hold both CFF outlines (compacted PostScript) and TrueType outlines. If the font file is labelled OTF, either outline can be present in the font. A font labelled .TTF is as much of an OT font as a font labelled .OTF. The reason Microsoft decided to stick with .TTF is to provide backward compatibility with older systems, way back to NT4 even. Of course, OT typographic features will not work in these environments.</p>
      <p>Again, it is very important to understand that .TTF fonts *ARE* OpenType. They work on both Mac OSX and Win.</p>
      <p>My two pennies worth - and yes, the extra points are placed when Illustrator converts a TTF outline.</p>
      <p>Bruno Maag</p>
