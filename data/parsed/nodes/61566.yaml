      <p>In my experience, printer manufacturers employ a variety of inconsistent, non-standardised voodoo arithmetic to come up with essentially meaningless descriptions of resolution. One of my favourites is 2400dpi that turns out to be 4-colour 600dpi.</p>
      <p>The only thing to do is to get test pages printed, preferably from a document you prepare so you can directly compare results.</p>
