      <p>I think it may be a modified Helvetica. The 'a' tail has been clipped, as has the 'y' tail. The 'k' was re-drawn, and the 'r' has had its arm extended.  Of course, I will laugh if someone finds a font that exactly matches this. I have been told that the more changes you need to make it work, the less likely it is to be right (Occam's razor?), but sometimes...</p>
      <p>- Mike Yanega</p>
