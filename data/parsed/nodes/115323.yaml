    html: |-
      <p>With your master pages open, open the Pages palette. Select the icon for the left page of the spread (as in the screen shot below), then set the margins and columns. Then select the icon for the right page of the spread and set the margins and columns for it.</p>
      <p>This works for CS 5.5 for Mac; might be different in other versions.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/pages_6313.jpg"></div><p></p>
