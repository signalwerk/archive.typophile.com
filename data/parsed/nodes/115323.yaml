  html: <p>I've been using InDesign (and before that, PageMaker -- back to Aldus 2.0) for quite some time and the one thing that bothers me is that, somewhere along the line, the devs seemed to think it was a good idea to get rid of the option to set margins and columns for each page in a 2-page spread separately. At least, they dropped the option from the Layout &gt; Margins and Columns... menu. Is there another option available, or do I have to keep wishing for my old PageMaker back? Thanks in advance.</p>
  html_clean: <p>I've been using InDesign (and before that, PageMaker -- back to Aldus 2.0) for quite some time and the one thing that bothers me is that, somewhere along the line, the devs seemed to think it was a good idea to get rid of the option to set margins and columns for each page in a 2-page spread separately. At least, they dropped the option from the Layout &gt; Margins and Columns... menu. Is there another option available, or do I have to keep wishing for my old PageMaker back? Thanks in advance.</p>
