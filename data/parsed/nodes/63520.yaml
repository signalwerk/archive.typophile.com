    html: |-
      <p>You are welcome :-)</p>
      <p>On the subject of Discipline:</p>
      <p>Before I run my own script, I always check first what the Find Fonts list says. The script doesn't behave properly if a font's styles are not called plain "Bold" or "Italic" -- it'll fail miserably on "Light Italic", "56 Italic", "Bold Condensed", and such. I replace those fonts with Times New Roman analogs. It also lets me check up on mis-used Symbol (since most fonts I use have their own Greek characters) and kill off any stray Wingdings arrows.<br>
      And <em>then</em> I'm just starting! Next is to check each and every possible text attribute for mis-use -- I hate superscript spaces in the middle of a regular paragraph, italics that include its trailing space, paragraph returns that are formatted with bold and underline, less-than with an underline standing in for less-or-equal, plus with an underline posing as plus-minus.</p>
      <p>Cleanliness ... Oh, and then I run my script.</p>
