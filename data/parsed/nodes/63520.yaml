      <p>Gregers,</p>
      <p>Your bullets disappearing happened because they were added in the paragraph style in Word. InDesign also allows bullets as part of paragraph styles, but if you override the style they will disappear. Not visible in Tiffany's screen shot (version?), but the Word options should also include sth like "Convert Bullets and Numbering to Text" -- use this if you don't use ID's own bulleted styles.</p>
      <p>The script can be downloaded directly from <a class="freelinking external" href="http://www.jongware.com/binaries/preptext.zip" rel="nofollow">my site</a>. Unzip, copy into your Scripts folder. With a right-click on any script in your scripts panel you can select "Reveal in Explorer/Finder"; copy the script into there.</p>
      <p>A more recent podcast discusses various ways of cleaning up Word before/after importing -- well worth a listening as well.</p>
