    html: |-
      <p>Getting the text formatted into ID is one thing, making it stick is another. Tiff, your local overrides will show the dreaded '+' appended to these paragraphs, and if you ever do something like a search-and-replace using a paragraph style, they will all be flattened to its base definition.</p>
      <p>The recommended way to make bold, italics, and so on "sticky" is by defining them as character styles. These won't disappear with an override; and you can easily change the definitions, for example, from bold to semi-bold, without touching anything else.</p>
      <p>Replacing every possible combination of text attributes with an appropriate style is a bore, especially since ID does not allow nesting of character styles (in particular, you might need a superscript, superscript italic, superscript bold, small caps italic, ... endless possibilities...). So I wrote a script to create them on the fly. It got mentioned on InDesignSecrets! Read (well, listen to) <a class="freelinking external" href="http://indesignsecrets.com/indesignsecrets-podcast-108.php" rel="nofollow">podcast 108</a> for all details.</p>
