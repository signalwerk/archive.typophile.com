  html: |-
    <p>Announcing Twitter Maze: a free Mac and PC application that generates a spiral-shaped maze based on Twitter trends from the last 24 hours.</p>
    <p><a class="freelinking external" href="http://chronotext.org/TwitterMaze" rel="nofollow">http://chronotext.org/TwitterMaze</a></p>
    <p>It was originally produced for <a class="freelinking external" href="http://writtenimages.net" rel="nofollow">Written Images</a> (a generative book initiative) before evolving into this simple desktop application (much more to be done...)</p>
    <p>Feedback is welcome,<br>
    Ariel<br>
    <a class="freelinking external" href="http://chronotext.org" rel="nofollow">http://chronotext.org</a></p>
