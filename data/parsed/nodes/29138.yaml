      <p>thanks martin, i didnt know this font. i found this specimen at the libary of HGKZ (university of applied sciences and art, zürich), close enough to lineto. it seems like a direct digitalization of the font, so what i had planned doesnt make much sense anymore.</p>
      <p>so nick, yes, maybe your idea could be something innovative instead of repeating what martha strutteregger did with it. i'll think about it.</p>
      <p>alessandro, none of the UC-letters show inktraps. but, @hrant, as i found this specimen in a specimenbook (printed), i can be pretty sure that they were not intended as inktraps - because they're a feature of the design, not a necessity of the design itself. they're too extreme to be just inktraps. and they're featured in all sizes. as soon as i get a good scan of the original page, i'll post it. right now at home i only have copies of the book.</p>
