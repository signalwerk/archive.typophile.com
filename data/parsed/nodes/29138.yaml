    <p>dear typophiles</p>
    <p>in a specimen book by Bauer &amp; Co, Stuttgart (1600 pages - wonderful!) i found a font called "Schmale runde Grotesk" (Condensed round Grotesk).  i digized some glyphs from a photo of a copy, some lines arent vertical and so on… its just a first test.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/runde_grotesk_1_2_4149.png"></div><p></p>
    <p>i have two questions regarding this font.</p>
    <p>- the library wasnt able to date the book, but i'd like to know a circa date - so here the clues i have: on the bottom of each page, H. Berthold AG is noted beneath Bauer &amp; Co - Bauer was bought 1897 by Berthold, as andreas mentions <a href="http://typophile.com/node/17643" rel="nofollow">here</a>. AG is shown beneath Royal-Grotesk, so i guess it was after 1908 (in the same post as linked above, andreas states that theinhardt was bought 1908). any idea?</p>
    <p>- is there a reason for the very thin connecting parts in a, d and n? this feature is found in a, b, d, h, n, m, p, q, u.</p>
    <p>thanks for your help!</p>
  html_clean: |-
    <p>dear typophiles</p>
    <p>in a specimen book by Bauer &amp; Co, Stuttgart (1600 pages - wonderful!) i found a font called "Schmale runde Grotesk" (Condensed round Grotesk).  i digized some glyphs from a photo of a copy, some lines arent vertical and so on… its just a first test.</p>
    <p></p><div class="imageWrap"><img src="/files/runde_grotesk_1_2_4149.png"></div><p></p>
    <p>i have two questions regarding this font.</p>
    <p>- the library wasnt able to date the book, but i'd like to know a circa date - so here the clues i have: on the bottom of each page, H. Berthold AG is noted beneath Bauer &amp; Co - Bauer was bought 1897 by Berthold, as andreas mentions <a href="/node/17643/" rel="nofollow" class="link-kept">here</a>. AG is shown beneath Royal-Grotesk, so i guess it was after 1908 (in the same post as linked above, andreas states that theinhardt was bought 1908). any idea?</p>
    <p>- is there a reason for the very thin connecting parts in a, d and n? this feature is found in a, b, d, h, n, m, p, q, u.</p>
    <p>thanks for your help!</p>
