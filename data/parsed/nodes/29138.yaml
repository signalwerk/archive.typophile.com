    html: <p>Re. Chunkfeeder -- my semantic slip, I was actually thinking of what Trapper (also by Jim Grieshaber) looks like, but gave it the wrong name. Which is strange, as the topic is trapping! -- I can only conclude that Chunkfeeder is a much more interesting name and got "trapped" in my memory, whereas the name Trapper makes me think of Davy Crockett, not type. Trappist would be a cool name too, and I would think of a monk ... reading in silence.</p>
