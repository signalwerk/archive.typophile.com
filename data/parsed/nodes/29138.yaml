      <p>&gt; Bradlo, Amplitude, Chunkfeeder.</p>
      <p>But all of those use traps (actually the third uses thorns, not traps) in a decorative way, not for actually fighting gain.</p>
      <p>In the case of Schmale Runde Grotesk, I have a feeling those weren't "real" traps either (not least because the caps don't have any trapping). One should look at a range of point sizes for clues.</p>
      <p>hhp</p>
