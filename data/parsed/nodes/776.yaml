  html: <p>Fellow Typophiles, <br> <br>I'm proud to announce the completion of a thorough overhaul to my humble portal/blog/foundry/&amp;c website, <a href="http://www.typotect.com">typotect.com.</a> <br> <br>Typotect went live about Ten months ago, and has since grown to host more daily visits that I ever expected. The previous site was more than a bit clunky though, and a redesign was long overdue. <br> <br>Typotect was developed as an outlet for a few friends and I to post links. Additionally, there are several fonts available for download including The Spectacle, and Subway R142.  <br> <br>If you are interested in contributing to Typotect, please send an email to karl @ typotect . com. <br> <br>Thanks for your time. <br>-karl. <br> <br><a href="http://www.typotect.com" target="_blank">http://www.typotect.com</a></p>
  html_clean: <p>Fellow Typophiles, <br> <br>I'm proud to announce the completion of a thorough overhaul to my humble portal/blog/foundry/&amp;c website, <a href="http://www.typotect.com" class="link-external">typotect.com.</a> <br> <br>Typotect went live about Ten months ago, and has since grown to host more daily visits that I ever expected. The previous site was more than a bit clunky though, and a redesign was long overdue. <br> <br>Typotect was developed as an outlet for a few friends and I to post links. Additionally, there are several fonts available for download including The Spectacle, and Subway R142.  <br> <br>If you are interested in contributing to Typotect, please send an email to karl @ typotect . com. <br> <br>Thanks for your time. <br>-karl. <br> <br><a href="http://www.typotect.com" target="_blank" class="link-external">http://www.typotect.com</a></p>
