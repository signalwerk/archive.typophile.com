  html: |-
    <p>Hi everyone,</p>
    <p>I need some help, i made this design for a poster, the thing is I'd like to make silk screen prints, only thing is i have never made a pdf file that's good to go and send to the guy who's actually going to do the silk screen printing.</p>
    <p>The design is made up out of green, red, black and yellow.</p>
    <p>Does every color need its own pdf file?</p>
    <p>Would be really nice if someone could point out on how to save a file for silk screen printing with multiple colors</p>
    <p>thnx guys!</p>
