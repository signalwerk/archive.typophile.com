    html: |-
      <p>In Illustrator, you can manage separations via Print/Output/Mode.</p>
      <p>Most screen printers require positives to make their films, but it is critical you speak with the printer directly. Perhaps the best way to manage it is to send native files. </p>
      <p>And remember, Spot Colors only.</p>
