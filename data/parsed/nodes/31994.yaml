      <p>Googling, I found <a href="http://www.pezcyclingnews.com/?pg=fullstory&amp;id=2437">this story of the A style logo</a>. The interesting bit:</p>
      <p>“At this time [from 1991!] there was no income as A-style was just a Logo, nothing more. Some T-Shirts were printed and sold in a friend’s shop in the centre of Milan. Two years ago Marco was presented to Massimo, a real gentleman that worked in the clothing business, who saw the real potential of this Logo in the “Streetwear” clothing market. There are now 2 factories that make only A-Style products. Marketing is still done in exactly the same way, Gorilla, Abusive, or call it what you like but very effective and a HUGE success.”</p>
