      <p>the logo of ...fashion company</p>
      <p>The fact that it is a sales gimick—admittedly an extremely clever one—is not at all surprising. </p>
      <p>I think it’s sad that instead of respecting sex as a private expression of love, it is thrown in our faces on logos to sell us stuff. </p>
      <p>I am an old guy, and so you may dismiss this as the grumblings of a old man. But the reality is that the public space—advertising, entertainment, politics—is full of anger and sexual provocation devoid of love, and it once was not—at least not on anywhere near such a scale.  </p>
      <p>I just saw the movie ’Idiocracy’, which captures the coarseness of the contemporary life with such accuracy that it is depressing rather than funny. Of course this logo is brilliant compared to most in the same vein. But it is still cut from the same cloth.</p>
