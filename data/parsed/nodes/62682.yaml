    <p>Beeing from Sweden I don't know the term in english but i will try to explain my problem. Bare with me.</p>
    <p>I'm trying to find where in InDesign CS3 to insert the "number" of the kern for specific fonts so that CS remembers the given "number".</p>
    <p>This is what i mean by "number":</p>
    <p>Akzidens Grotesk BE Md..</p>
    <p>A?	-11<br>
    AC	-3<br>
    AG	-3<br>
    AJ	4<br>
    AN	-2<br>
    AO	-3<br>
    AQ	-3<br>
    AR	-2<br>
    AS	-3<br>
    AT	-11<br>
    AU	-3<br>
    AV	-7<br>
    AW	-7<br>
    AY	-14<br>
    AZ	4<br>
    Ak	-1<br>
    etc     etc</p>
