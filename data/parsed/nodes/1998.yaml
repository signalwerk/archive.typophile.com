    date_raw: 10 Nov 2003 — 10:46am
    votes: null
    html: "<p>Keith had pointed out that Unger's fonts tend to go well with Chinese - maybe Japanese too? <br> <br>I can think of a few display-type things (like Jared's Yazuka and Want's Fusaka), as well as some perhaps overly-literal text faces (like Hiroshige), but my favorite example of subtlety is this: <br> <br><img src=\"http://www.typophile.com/forums/messages/4100/20176.gif\" alt=\"korea_good.gif\"> <br> <br>The body is Korean, not Japanese, but I like the way the stroke terminals in the Latin match it so well. <br> <br>hhp <br></p>"
