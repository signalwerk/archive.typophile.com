    html: <p>If it were me, I'd study Japanese type designers' work... often times they romanize Katakana and Hiragana faces they've created, giving them a unique feel. <a href="http://04.jp.org">Check out this site</a>. It's got some downloadable faces and some great links to other Japanese sites.</p>
