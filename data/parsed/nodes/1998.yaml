    html: <p>I think I am considering Brioso Pro. <br> <br>I just got it from Adobe, and it feels like it might fit just right. Very caligraphic, and lots of great alternates. <br> <br>I am really not interested in a companion to a Japanese face, nor am I interested IN a Japanese face, but more so a latin face, that would be complimentary to a japanese motif. <br> <br>I'm going to play with Brioso and see how its fits. <br> <br>Hildebrant.</p>
