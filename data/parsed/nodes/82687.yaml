      <p>The first one is perfect!<br>
      But I'm not sure about "records" -- is it necessarily part of the mark?<br>
      At any rate, it might be better in all caps, and I would experiment with where to put it in relation to the logo, in various layouts, especially the business card, which is the most difficult piece of corporate design.</p>
