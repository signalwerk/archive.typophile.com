    <p>Dear all,</p>
    <p>I am dead scared as it is the very first time I post my own work on here but here we go...<br>
    I am designing a logo for a small record label and thought here would be the best place to get expert opinions.<br>
    The labels releases mainly nu-folk bands. So I thought an organic vintage script would a good choice.<br>
    I would be so grateful if you could point me in the right direction for improvements.<br>
    I am no logo designer therefore any help would be greatly appreciated.</p>
    <p>Kind regards</p>
    <p>PJ<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/safetyfirst_6618.jpg"></div><p></p>
