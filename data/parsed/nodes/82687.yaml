    html: <p>Incorporating the type in the safety pin seems forced, not only because the type doesn't look anything like bent metal -- even if it did, bending a safety pin even once is a pain in the ass. Nevertheless, it's a strong symbol with a distinct skeleton. I would look for type that reflected it's shape somehow. Everyone can't be an expert in all matters, so don't be afraid of utilizing the expertise of a type savvy designer.</p>
