    html: |-
      <p>Thanks loads,</p>
      <p>I wasn't actually thinking about the realistic or tangible  aspect of the pin. Thank you for bringing it up.<br>
      I'll bare it in consideration. maybe I should look for a font that looks more "wirey" but I'm worried it will then look a bit too childish.<br>
      I have experimented with text forming the "body" of the pin and have come up with a few variation or the below example.<br>
      Unfortunately I feel the safety pin head doesn't read as much anymore. It has also lost it's organic "folksy" feel. But I do like the half disk closing off the logo and giving the whole thing a sense of inclosed safety/security.<br>
      Guess that's me going back to the drawing board!</p>
      <p>Thanks again,<br>
      PJ</p>
