  - id: 450494
    user_id: 3972
    user_name: Bert Vanderveen
    user_path: null
    date_raw: 3 Feb 2011 — 5:44pm
    date: 2011-02-03T17:44:00
    votes: null
    html: |-
      <p>It’s too loose in general and that’s why you can’t get it right.</p>
      <p>For starters you should use the inner space of the /d/ to define the letterspacing. (Why? Because that is the largest defined inner space.). All other kerns should confirm to that. You will experience that the combinations with /v/ will be problematic. There is some latitude there because the ear of the /r/ is compatible with the /v/ shape. I would start with a hairspace there and then work backwards.</p>
      <p>Tighter works in this case. And when that has been resolved, loosening up is a cinch, because it will be just adding the same amount of space to every combination (as long as you don not exceed the base amount of space, which is equivalent to the inner space of /d/ doubled. Sounds like mumbo jumbo, but it works...</p>
