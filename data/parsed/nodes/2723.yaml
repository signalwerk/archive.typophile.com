    date_raw: 16 Jan 2004 — 7:57am
    votes: null
    html: <p>You're both right in raising questions over my use of the term 'book face'. You're right randy, I don't intend on using it to set A Tale of Two cities - I had in mind much short blocks of text <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> What would be a better description if it is not exclusively for display or setting short passages? I realised from the outset that its width could inhibit readability at small sizes but had in mind that it would save space and hoped to find a healthy balance. I think now looking back, as you said Hrant, I was paying too much attention to my aesthetic preferences with regards to the modulation.  <br> <br>I agree randy - it does look like a lot of existing fonts. Like you say, it's a place to start - I didn't set out to make an original contribution to type design with it. How could I if I couldn't get something like this down properly? Hopefully I'll be able to one day. <br> <br>I really like the idea of referencing uncial structures as an innovative alternative to standard caps. I think for this project I'll keep orthodox caps but I will certainly not forget that idea. <br> <br>I'm not all that familiar with the your terminology when you suggest making the K more 'elemental'. I think I'm on same hymn sheet but it's best to clarify <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> <br> <br>thanks again chaps</p>
    html_clean: <p>You're both right in raising questions over my use of the term 'book face'. You're right randy, I don't intend on using it to set A Tale of Two cities - I had in mind much short blocks of text <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> What would be a better description if it is not exclusively for display or setting short passages? I realised from the outset that its width could inhibit readability at small sizes but had in mind that it would save space and hoped to find a healthy balance. I think now looking back, as you said Hrant, I was paying too much attention to my aesthetic preferences with regards to the modulation.  <br> <br>I agree randy - it does look like a lot of existing fonts. Like you say, it's a place to start - I didn't set out to make an original contribution to type design with it. How could I if I couldn't get something like this down properly? Hopefully I'll be able to one day. <br> <br>I really like the idea of referencing uncial structures as an innovative alternative to standard caps. I think for this project I'll keep orthodox caps but I will certainly not forget that idea. <br> <br>I'm not all that familiar with the your terminology when you suggest making the K more 'elemental'. I think I'm on same hymn sheet but it's best to clarify <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> <br> <br>thanks again chaps</p>
