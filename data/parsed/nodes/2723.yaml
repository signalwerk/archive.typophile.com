    html: "<p>Well, it's not totally monoline, but it's not a book face either. The extenders are generous enough to play a positive role in readability, but it's still a sans (with narrow, constructed forms to boot), so I wouldn't set too much text in it. Display? Definitely. <br> <br>&gt; Peculiarly I started creating a bold weight first (don't ask me why) <br> <br>I tend to draw dakish glyphs to begin a design too - I guess it what appeals to you, plus the fact that drawing large glyphs is display-centric: you have to tame your aesthetic preferences in order to draw a text face [large]. <br> <br>hhp <br></p>"
    html_clean: "<p>Well, it's not totally monoline, but it's not a book face either. The extenders are generous enough to play a positive role in readability, but it's still a sans (with narrow, constructed forms to boot), so I wouldn't set too much text in it. Display? Definitely. <br> <br>&gt; Peculiarly I started creating a bold weight first (don't ask me why) <br> <br>I tend to draw dakish glyphs to begin a design too - I guess it what appeals to you, plus the fact that drawing large glyphs is display-centric: you have to tame your aesthetic preferences in order to draw a text face [large]. <br> <br>hhp <br></p>"
