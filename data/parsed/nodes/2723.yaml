    <p>Howdy All - <br> <br>This is my first post here though I've been lurking for a few months. I've been having a crack at my first 'serious' typeface. My plan was to create two basic weights for use as a book face - regular and bold. Peculiarly I started creating a bold weight first (don't ask me why), and at this point have only designed the lowercase. I have a great deal to learn and no doubt have made many mistakes - I'd appreciate your help putting me on the straight and narrow.  <br> <br>many thanks</p>
