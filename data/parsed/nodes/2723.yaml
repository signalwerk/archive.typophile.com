    html: "<p>Don't let the comments get you down. This a very well done first effort. Extremely well done in fact. The proportions are good. The color is even. Your sense of optical width vs. actual width is great. You've taken time to put in alot of the subtleties. <br> <br>First we gotta define what we mean by book face. I bet you don't mean you plan to set A Tale of Two Cities in this font. Nor (judging from the thread title) did you mean that this is intended specifically for use in children's books. I'm guessing you meant that you can use this font for short passages of text. Or even more generally, not just a display face.  <br> <br>I think you've done that. If want it to work better below 12pt you probably want to consider a bit more width, and perhaps a bit more modulation. As a side note: I'm tempted to say this looks very much like many existing fonts. But really, who cares? This is a place to start, and it looks nice. Press on. <br> <br>Randy</p>"
    html_clean: "<p>Don't let the comments get you down. This a very well done first effort. Extremely well done in fact. The proportions are good. The color is even. Your sense of optical width vs. actual width is great. You've taken time to put in alot of the subtleties. <br> <br>First we gotta define what we mean by book face. I bet you don't mean you plan to set A Tale of Two Cities in this font. Nor (judging from the thread title) did you mean that this is intended specifically for use in children's books. I'm guessing you meant that you can use this font for short passages of text. Or even more generally, not just a display face.  <br> <br>I think you've done that. If want it to work better below 12pt you probably want to consider a bit more width, and perhaps a bit more modulation. As a side note: I'm tempted to say this looks very much like many existing fonts. But really, who cares? This is a place to start, and it looks nice. Press on. <br> <br>Randy</p>"
  - id: 21660
    user: 1250
    date: 2004-01-15T09:42:00
    date_raw: 15 Jan 2004 — 9:42am
    votes: null
    html: "<p>Certainly, the proportions, modulation and detailing are very well done. Maybe it's just a matter of being cautious (anal?) with terms: to me \"book face\" means a font that can be used to set a book without causing rejection (conscious or subconscious) on the part of the reader before the book finishes! I tend to have a narrow definition of \"book face\" (although in some ways it's actually much broader than usual - like in \"allowing\" unorthodox structures): it needs serifs, and the color and width have to be within a certain range. Plus it all has to correspond - like a darkish font works better small which means the x-height has to be bigger, the forms looser and wider, etc. <br> <br>You shouldn't abandon this design, not at all! It's already nice and firm. Just move it towards more display usage - which still means some people will use it for short text - which is fine - usage is out of our hands anyway. Practically this might mean things like making the terminals of the \"a\", \"c\" and \"s\" congruent, making the \"k\" more elemental, etc. <br> <br>As for pulling it away from existing designs, one interesting place you could do that is in the caps. I've recommended this before to others: look at uncial structures if you really want to make a convincing innovation in caps that are conformant to the lc - conventionally they're like two separate creatures. <br> <br>hhp <br></p>"
    html_clean: "<p>Certainly, the proportions, modulation and detailing are very well done. Maybe it's just a matter of being cautious (anal?) with terms: to me \"book face\" means a font that can be used to set a book without causing rejection (conscious or subconscious) on the part of the reader before the book finishes! I tend to have a narrow definition of \"book face\" (although in some ways it's actually much broader than usual - like in \"allowing\" unorthodox structures): it needs serifs, and the color and width have to be within a certain range. Plus it all has to correspond - like a darkish font works better small which means the x-height has to be bigger, the forms looser and wider, etc. <br> <br>You shouldn't abandon this design, not at all! It's already nice and firm. Just move it towards more display usage - which still means some people will use it for short text - which is fine - usage is out of our hands anyway. Practically this might mean things like making the terminals of the \"a\", \"c\" and \"s\" congruent, making the \"k\" more elemental, etc. <br> <br>As for pulling it away from existing designs, one interesting place you could do that is in the caps. I've recommended this before to others: look at uncial structures if you really want to make a convincing innovation in caps that are conformant to the lc - conventionally they're like two separate creatures. <br> <br>hhp <br></p>"
  - id: 21661
    user: 2193
