    html: <p>I don’t know what fonts Brent has acquired - but it’s certainly possible to make fonts based on existing fonts metrics that would not be considered knock-offs - Monotype’s Thorndale and Albany being a case in point. Interestingly we’ve seen a few recent cases of custom fonts that were designed to match the metrics of Arial - Personally I have nothing but admiration for a type designer who can make a new design work within the constraints of another font’s metrics.</p>
