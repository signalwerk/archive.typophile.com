      <p>Heh, didn’t even think that people might not know what the “base 14” reference meant. But if you weren’t into DTP in the mid-80s, you might not have dealt with that particular set (within a couple of years it was the “base 35” instead).</p>
      <p>One reason to have some set of core fonts ship with an application is that the application developer may want to be sure that the users have identical fonts, regardless of platform. That leads the app developer to need to bundle some fonts with the app.</p>
      <p>Of course, simply knocking off somebody else’s fonts instead of either licensing them or doing something new is rather dubious ethics, but that’s another question. I have to concede that Times and Helvetica have been knocked off so many times now that somehow doing still more knockoffs of those two seems a lot less troubling than doing the same to, say, Sabon and Syntax.</p>
      <p>T</p>
