    <p>We are looking for a designer to update our recently acquired Base14 fonts. The fonts which we acquired were rendered with old software and need to be sized to better match today’s base-14 fonts as well as smoothed. </p>
    <p>If you or anyone you know of have the skills to do this and are available for hire please let me know.</p>
    <p>Thank you</p>
    <p>Brent<br>
    <a href="mailto:brent@docudesk.com">brent@docudesk.com</a></p>
