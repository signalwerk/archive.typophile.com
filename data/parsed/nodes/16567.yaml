    html: |-
      <p>In one of my first jobs (at a weekly newspaper) we had a Compugraphic Compuwriter Jr. This was one of the most inexpensive typesetting machines of its time. The oddest thing about it was that all of its fonts shared the same set of widths. There were gears which would be used to scale the widths as a group up or down for a particular font and size. Some fonts looked better than others, but none of them looked really good. </p>
      <p>(And, talk about primitive: It had an 18-character red LED display and you could only load two fonts of one size at a time. And the two fonts were made in fixed pairs. This meant that you couldn’t set a line of type with more than two fonts in it. But, “luckily,” you could set the third style separately and paste it over one of the other two, since it had the same character widths. AND I lived in a cardboard box in the middle of the street.)</p>
