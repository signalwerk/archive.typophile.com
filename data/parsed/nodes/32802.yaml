    html: |-
      <p>I’m sort of allergic to the DDR, but that looks like their emblem to me. I have no idea what their national team graphics or design looked like, but it probably changed several times over the decades, just like West Germany’s did (just compare the three jerseys that the West German team wore during each of their three World Cup victories in 1954, 1974, and 1990).</p>
      <p>DIN isn’t such a bad choice, it is German, and was used during the cold war on West German highway signs (it is still on all German highway signs today, of course). I believe that it was drawn during the 1930s, but I don’t really know exactly. I also have no idea what sort of highway signage the East Germans had.</p>
      <p>…and there is no need to call me Mr.!</p>
