      <p>I would recommend against constructivism. That is more a style from the 1920s, and is aligned with 1920s art and design in Holland, Germany, and the Soviet Union. I don’t see how it has much influence on post-war design or on football!</p>
      <p>Actually, something “bland” like Helvetica or Univers might be the most appropriate here.</p>
      <p>On <a href="http://de.wikipedia.org/wiki/Fußball-Weltmeisterschaft_1974">this page</a>, you can see the logo from the 1974 World Cup. This was hosted (and won!) by West Germany, although the East German team beat them in the preliminary round.</p>
