    <p>Good day everyone, </p>
    <p>I’m laying up an article on cold war football in germany, and was wondering<br>
    if anyone could recommend any online visual references? The piece was<br>
    entitled ’Football behind the Iron Curtain’ so I immediately thought of having<br>
    a look at constructivism, but it turns out to be exclusively about germany<br>
    so this seems a bit misguided.</p>
    <p>Any help and historical enlightenment would be greatly appreciated, </p>
    <p>G</p>
