      <p>Hello Thomas, this assumes that all applications behave like InDesign, i.e. that any line break would 'end' a sequence. If I remember correctly, this is not the case with Mellel where the sequence would continue despite of a line break (the automatic one, not the 'return'). What would be WPF's behavior here?<br>
      It looks like there's no binding standards for layout applications' here, so it is not warranted that contextual features behave as intended.</p>
      <p>Squashing glyphs toward the end of a line somehow indicates bad planning by the writer, so it would make script typefaces even more 'human'.<br>
      Another approach would use abbreviations as found in blackletter, combining 'bo' 'be' etc, these could be distributed evenly throughout a line; I remember that in a hz-Program brochure there was a sketch by Hermann Zapf for applying this to URW Antiqua.<br>
      Yet another approach would include slightly narrower and wider forms of glyphs that allow it (also found in the hz-Program brochure) and one Stylistic Set feature would replace by narrower, another by wider glyphs, the designer would apply the one which would be needed. Or better, there could be two special features, one maps glyphs to condensed and one to wide alternates; then the layout application could decide a line is too long or too short, and needs condensation or stretching, and apply as many substitutions as are required to get the desired lenght. Would be a nice addition to the multi-line composer. And here, the feature merely provides the material, but the decision whether/what to substitute is on the application.<br>
      But this is not the issue of the thread which was handwriting.  :)</p>
      <p>Karsten</p>
