      <p>Although you can't detect the end of a line (yet) in OpenType, you can set something to happen based on there being no further context. Make a class of all glyphs. Do something based on there being no further glyphs, and use a backtracking context. Not too hard, and pretty similar to other contextual font stuff I've demonstrated and shared FDK/FontLab code for. I'm rather busy right now, but if anyone wants to implement it I'd be happy to write the code for it whenever they are at the point where they need it.</p>
      <p>The limitation would be that depending on the application, other things besides the line ending may break the context. For example, a font change will certainly break the context. Being in a different cell of a table would probably break the context. For *some* implementations, even word boundaries may break context, to improve performance.</p>
      <p>Cheers,</p>
      <p>T</p>
