    <p>I was walking by a hand-lettered sign yesterday, and I noticed that the last 4 words were really compressed because the person ran out of space. This is something that happens a lot when people write things out by hand, sometimes drastic, sometimes subtle.</p>
    <p>Now, a lot of typefaces are coming out that "mimic" handwriting/lettering. Wouldn't it be cool if they included contextual alternates that compressed the last few words of a sentence if found near the end of a line?</p>
    <p>I know that might totally screw with people's H&amp;J settings, but is something like that possible?</p>
