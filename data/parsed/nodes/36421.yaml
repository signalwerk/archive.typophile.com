      <p>I'd imagine getting the effect that Dan was originally thinking of would be extremely difficult. The problem being that when you substitute narrower characters, you use less space (I know, "duh!") So even if you could get around the complication Thomas mentions, so that this "squeeze" effect only happens at the end of a prescribed line length - once the effect is applied, the length of that line would get shorter, leaving extra space before the end of the prescribed line length. This would look like someone started trying to squeeze letters in when they still had additional space left.</p>
      <p>What you'd really need to do is detect widows. Once you find a case where a line wraps, with only a few characters on the following line, you'd then want to replace the last X number of characters with narrower versions, so that the paragraph would end on the previous line, and not leave a widow.</p>
      <p>Hmm, it gets worse the more I think about it!</p>
      <p>Jason C</p>
