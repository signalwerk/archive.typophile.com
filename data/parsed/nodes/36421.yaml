      <p>There's the hard part: it's easy to make a font that makes glyphs narrower at the end of the line, but it's hard to make that sensitive to approaching some specific line length. My technique would result in increasingly narrow glyphs to squeeze more stuff in at the end of the current line, regardless of how close you were to any particular target line length, and would still do this on the current line even after some text wrapped to the next line.</p>
      <p>T</p>
