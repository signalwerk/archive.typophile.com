    html: <p>OpenType substitution lookups do not, in themselves, have any knowledge about the proximity of the end of a line. But theoretically you could treat the squished letters as justification alternates, and the jstf table could be used to access them. But no apps currently support the jstf table, and there is no easy way to make one.</p>
