      <p>Yes, it'd be nice to justify with alternates. Berlin Sans has been waiting for 12 years for this. Characters sitting in their sfnt garage gathering dust. No, you don't want to wait 'till the last few characters, it should be sread thoughout the line. URW's research and demonstration of this showed quite convincingly that you do not want to apply this to all glyphs, just the unique.</p>
      <p>"But no apps currently support the jstf table, and there is no easy way to make one."</p>
      <p>The story of OT's life. Maybe we can get Larson &amp; Hitchcock to think it's a good idea to make OT work in HIP generation. Then...type designers can beat the living crap out of hackers trying to keep up with computer recognition of Our weirdest dreams. And then, engineers will think about, and realize they are pathetically backward by not implementing OT. </p>
      <p>"Typography is a subtle art." You must have missed Bill Hill's presentation. Readability, which is typography at its best, is all engineering, no art. Pay attention!</p>
      <p>Cheers!</p>
