      <p>James: <em>have you dropped by a design school since the spawn of postmodernist typography teachers infiltrated the ranks of faculty? Good typography is about being expressive now.</em></p>
      <p>Design schools teach the use of type in the context of graphic design. I'm not even sure that typography is the correct term for this, unless one uses the term in the broadest possible since of making stuff with type. The use of type in graphic design is a specialised use, somewhat alienated -- in intent, if not always in practice -- from what I consider typography, i.e. text manufacture with prefabricated letters. Typography proceeds from text. Graphic design proceeds from different impeti, e.g. branding.</p>
