    html: |-
      <p>I just think if the font is being used for a single job it's a lot to ask someone to pay for it three times. I will never get a client to do that (hard enough to get them to buy it once), so then, the foundry loses out on the sale. If the foundries were a little more flexible with their licenses they'd get more business from me. That said I have been blithely giving fonts to printers for years now without additional purchase of license, since I didn't know better.</p>
      <p>I'd suggest rather than separate licenses for different locations perhaps it should be on a per job basis. But since I rarely actually read the EULAs that may already be the case. Pardon my ignorance.</p>
