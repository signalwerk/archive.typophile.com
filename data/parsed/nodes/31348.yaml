      <p>Out of curiosity,<br>
      is there any recent typefaces that have been tested and made specifically for coarse newsprint screens.<br>
      Looking for more choices than the tried and true list:<br>
      Century, times, Excelsior, Ionic, Paragon, Corona, Ideal, Rex, Regal and imperial. </p>
      <p>Do I need to even worry about this any more since most are printed on Web Offset these days?</p>
