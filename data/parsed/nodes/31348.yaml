    html: <p>Miss Tiffany you are right about that in the cases of Gulliver and Capitolium News. Swift however can bear quite a beating, and i would claim that it survives bad printing better than the 'old workhorses' like Ionic No 5 or the other Scotch Roman news-print typefaces contemporary to Ionic. I mean – just look at the example above. As a matter of fact I don't get why these ancient faces are still in use? Familiarity?</p>
