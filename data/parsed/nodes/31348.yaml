    html: <p>It is important to note that while Gerard Unger's typefaces were designed for use in printing for the news he designed for the new technology. Or in other words, the fact that the paper and printing process had improved drastically and could now print crisp sharp lines and shapes.</p>
    html_clean: <p>It is important to note that while Gerard Unger's typefaces were designed for use in printing for the news he designed for the new technology. Or in other words, the fact that the paper and printing process had improved drastically and could now print crisp sharp lines and shapes.</p>
