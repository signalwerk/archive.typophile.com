      <p>Sorry for the extremely late response to all the responses - I really should make sure I've followed everything up before going on holiday. Anyway. I had looked at all the other threads relating to the overflow error, and followed the advice, hence the original post.</p>
      <p>This was just done to have a fully-featured OT font I could use live on a website to play with a wide variety of font-feature settings in modern browsers without tossing too much money at it - the reason Crimson was chosen was because most of what I would need is already present, unlike other free/cheaper fonts. Could just drop back to something good on Typekit, but then an element of control is lost.</p>
      <p>@Jens, tried clearing the kerning data, and tried keeping the kern features as-is, but no dice, still throws the overflow error. But following @charle_e's advice, I seem to have managed to force it through. It then susequently chokes on further changes of any kind, so temporary fix at most. I think you're right though, and I need to rewrite the kern feature. More work initially, but at least I know I can then have something that will display. And yes, I do realise the current spacing is dubious @hrant, so I'll give it a go.</p>
      <p>Thanks for the advice, it was very useful, and at the very least pushed me to learn in a bit more detail how OT tables store the data. Still want to scream at FL most of the time, but I see why it throws crap at me now</p>
    html_clean: |-
      <p>Sorry for the extremely late response to all the responses - I really should make sure I've followed everything up before going on holiday. Anyway. I had looked at all the other threads relating to the overflow error, and followed the advice, hence the original post.</p>
      <p>This was just done to have a fully-featured OT font I could use live on a website to play with a wide variety of font-feature settings in modern browsers without tossing too much money at it - the reason Crimson was chosen was because most of what I would need is already present, unlike other free/cheaper fonts. Could just drop back to something good on Typekit, but then an element of control is lost.</p>
      <p>@Jens, tried clearing the kerning data, and tried keeping the kern features as-is, but no dice, still throws the overflow error. But following @charle_e's advice, I seem to have managed to force it through. It then susequently chokes on further changes of any kind, so temporary fix at most. I think you're right though, and I need to rewrite the kern feature. More work initially, but at least I know I can then have something that will display. And yes, I do realise the current spacing is dubious @hrant, so I'll give it a go.</p>
      <p>Thanks for the advice, it was very useful, and at the very least pushed me to learn in a bit more detail how OT tables store the data. Still want to scream at FL most of the time, but I see why it throws crap at me now</p>
