      <p>I'm guessing that the old style figures you *copied* to the the Private Use area are in the original font with a name, but not an Unicode index (which is proper).</p>
      <p>If you're using layout software that requires a Unicode index, rather than "copying" them to PU, just assign a PU number to them without changing the name. Should work, and since the kern feature as found in FontLab will be using the name, it shouldn't care that you've added a PU Unicode index.</p>
      <p>Then follow Jen's advice.</p>
      <p>BTW, as far as personal bias goes, if it was a font I was interested in, I'd just write a new Kern feature -- actually, I'd rewrite all the features, but that's because I have a stock set I've gotten comfortable with over the years. I think this not a bad approach for a user, whose primary concentration lies elsewhere.</p>
    html_clean: |-
