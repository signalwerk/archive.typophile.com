  - id: 538535
    user: 21687
    date: 2013-01-17T03:13:00
    date_raw: 17 Jan 2013 — 3:13am
    votes: null
    html: |-
      <blockquote><p>the description of adding tabular oldstyle figures made no mention of any changes to the kern feature.</p></blockquote>
      <p>My guess is that FontLab copied the kerning of the proportional OsF along with the glyphs to the tabular OsF. That would explain a change in the kern feature which leads to the overflow error.</p>
      <p>The solution would be to delete the kerning of the tabular OsFs, they, being tabular, should have no kerning anyway.</p>
      <p>It would be best to keep the kern feature code as it is (uncheck "Generate Opentype kern feature if it is undefined or outdated" in the FontLab options under "Generating OpenType &amp; TrueType" → "Kerning").</p>
      <p>I just tried opening Crimson-Roman.otf in FontLab, and while the existing kern feature code compiles fine, as soon as I regenerate the kern feature code (via the OpenType panel menu → Generate kern feature), it fails with the overflow error.</p>
