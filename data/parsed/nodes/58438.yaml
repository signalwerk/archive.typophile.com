    html: |-
      <p>Windows XP and subsequent are much less lenient about fonts conforming to standards. This applies to both T1 and TT fonts. In some cases, merely opening the font in a program like Fontlab or converting it to itself in TransType and re-generating (re-saving) it is sufficient. Sometimes the names in the name tables have to be modified, and sometimes the lack of specified codepages or unicode ranges disable the font.</p>
      <p>Font Monger is widely known as "Font Mangler". It is known to have been able to do disastrous things to a font. There are good reasons why it doesn't exist any more.</p>
      <p>If the video driver problem is at fault, it usually affects ALL PS fonts, not just a selected few.</p>
      <p> - hvb</p>
