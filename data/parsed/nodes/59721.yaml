    html: <p>Ha, there is a Philip Bouwsma face at Linotype that I found on my first look, quite different, but close enough that it was just possible that it was what you were referring to. It's at <a class="freelinking external" href="http://www.linotype.com/181048/trieste-family.html" rel="nofollow">http://www.linotype.com/181048/trieste-family.html</a>. But you are right, the EF version is virtually identical except for the 'g'. There is a less refined version of the Kleukens at MyFonts <a class="freelinking external" href="http://new.myfonts.com/fonts/nicksfonts/kleukens-antiqua-nf/" rel="nofollow">here</a>, but it does have the right 'g'.</p>
