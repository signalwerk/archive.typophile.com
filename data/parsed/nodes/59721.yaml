      <p>The digital versions by <a class="freelinking external" href="http://new.myfonts.com/fonts/ef/trieste/ef-medium/characters.html" rel="nofollow">Elsner+Flake</a> and Scangraphic both have an alternate 'g' that does not match your sample. The showing of Kleukens Antiqua in Jaspert's "Encyclopaedia of Type Faces" does show the same g as your sample. This makes me guess that your sample was made with a pre-digital version (either film type or metal).</p>
      <p>- Mike Yanega</p>
