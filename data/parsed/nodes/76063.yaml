      <p>To answer this, it's probably best to consider some hypothetical feature:<br>
      <code><br>
      feature test {<br>
      &nbsp;&nbsp;script latn;<br>
      &nbsp;&nbsp;&nbsp;&nbsp;language dflt;<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;sub X by Y;<br>
      &nbsp;&nbsp;&nbsp;&nbsp;language TRK include_dflt;<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;sub A by B;<br>
      &nbsp;&nbsp;&nbsp;&nbsp;language DEU exclude_dflt;<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;sub C by D;<br>
      &nbsp;&nbsp;script cyrl;<br>
      &nbsp;&nbsp;&nbsp;&nbsp;language dflt;<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;sub E by F;<br>
      } test;<br>
      </code></p>
      <p>When you compile the above, the font will actually include four different versions of the 'test' feature, and it will be up to the application to determine which of those versions to use when the user activates the 'test' feature (assuming this is a feature which the application allows the user to (de)activate).</p>
      <p>The four versions of the feature are as follows:</p>
      <p>1. a version which will substitute A by B and X by Y which is intended to be used for Turkish<br>
      2. a version which will substitute C by D which is intended to be used for German.<br>
      3. a version which will substitute X by Y and which is intended to be used by other languages which employ the Latin script.<br>
      4. a version which will substitute E by F and which is intended to be used by languages which use the Cyrillic script.</p>
      <p>You'll want to make sure to include appropriate <code> languagesystem </code> declarations at the beginning of your feature file if you want to make use of language tags. These are also described in the OT syntax spec.</p>
      <p>André</p>
