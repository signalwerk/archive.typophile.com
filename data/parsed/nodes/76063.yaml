      <p>In the example which I give, it is the responsibility of the application to correctly decide which version of the 'test' feature to use. If the user selects a run of text which is marked as being Turkish and then activates the 'test' feature, the application should apply the first version of the feature. If they subsequently apply this feature to a run of text marked as being English, the third version should be applied.</p>
      <p>How (or for that matter whether) an application allows a user to specify the language of a particular block of text isn't addressed by OpenType standard.</p>
      <p>André</p>
