  html: |-
    <p>Trying to learn more about features, focusing on the kerning feature at the moment.</p>
    <p>In another post Jens Kutilek kindly offered the following feature as a suggestion to a problem I was trying to solve (<a href="http://typophile.com/node/72726" title="http://typophile.com/node/72726">http://typophile.com/node/72726</a>):</p>
    <p>feature kern {<br>
    script grek;<br>
    language dflt;<br>
    pos space &lt;50 0 100 0&gt;;<br>
    } kern;</p>
    <p>What I'm wondering about is the script and language statements. I've read about them a bit on Adobe's site but, admittedly, will have to back and revisit to better understand. One thing I didn't see is how these statements get used or activated.</p>
    <p>Does the application call for them? If so the language statement makes some sense as most apps have a language setting. I don't, though, understand how the script command comes in to play. I've seen it in liga features without a language statement, but again, I don't understand how/when it is implemented.</p>
    <p>Also, does anyone know of a source that would be the equivalent to "Features for Dummies?"</p>
    <p>Thanks,<br>
    Ken<br>
    Dummy in Training</p>
