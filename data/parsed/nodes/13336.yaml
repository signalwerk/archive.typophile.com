      <p>The ‘make it like a bar/pub’ just doesn’t make any sense. Shouldn’t they make it like a ‘friendly digital photo printing kiosk’?</p>
      <p>I’d move away from any film reference and maybe focus on photo references. Also, consider using some more fluid faces. </p>
      <p><em>The client wanted to see the old film reels, so I have to leave them in. I might show the martini glass just because.</em></p>
      <p>Help your client think through this. Point out the obvious…that anyone using a digital camera is using it to get rid of the film, and that processing family photos has absolutely nothing to do with downing a martini. For the demographic, it seems that the core emphasis should be on things like ‘fast’ and ‘easy to use’.</p>
      <p>Of the ones you showed, #5 is definitely the one I’d go with.</p>
