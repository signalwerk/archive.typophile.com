      <p>I agree with aluminum. Also, I recommend ignoring the hell out of the bar theme* and just designing a strong logo for a digital photo kiosk. The name says bar, and I imagine the kiosk design will be bar-ish. Since you’re so removed from the core issues, I’d just try stay away from the obviously shaky ideas.</p>
      <p>Preventing you from contacting the client directly is, frankly, asinine. And probably has nothing to do with you and everything to do with ----covering on someone else’s end. But you probably already knew that. I just get rankled when I hear about silly client-side runarounds like that.</p>
      <p>*The client will love the most bar-like logo, as it reaffirms their judgement.</p>
