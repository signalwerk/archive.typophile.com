    <p>“Photobar,” a photo-software company, is going to introduce a new in-store kiosk where you can take in your digital camera’s memory card and insert it into the computer and print out your photos. They want to market to middle-aged Midwesterners.</p>
    <p>The original of the name “Photobar” is that the company wants their kiosks to be like a bar, as in “pub” or “liquor cabinet” or something. That’s all I’ve got to work with.</p>
    <p>I’ve got 9 directions, none too-too worked out, mostly because it’s hard to work just on form without knowing if what you’re doing is anywhere near expectations. That said, you can critique based strictly on form or offer ideas that could make “Photobar” look more like Photobar.</p>
    <p>Much thanks in advance.</p>
    <p>My favs are 9, 1, and 7.</p>
