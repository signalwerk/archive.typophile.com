    html: <p>If you find the right deal for a print on demand publisher, you can probably get a well printed and bound, one-off, glossy book for less than ink jet cartridges will cost. My wife has found deals that are almost free except for shipping. I can't remember what or where those were, but we just used them for books of vacations photos.</p>
