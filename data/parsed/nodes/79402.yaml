    html: |-
      <p>This is probably out of your price range (since you said "cost effective") but I'm starting to see folks put their portfolios on iPads.  </p>
      <p>For printed pieces (a brochure or poster, for example) I'd rather have the actual printed piece to examine, but for showing electronic media (web pages, Powerpoints, PDFs, etc) an iPad works pretty well.</p>
