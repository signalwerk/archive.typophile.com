    html: |-
      <p>I did a horizontal 8.5x14 metal screwpost binder. It was about $60-70 I want to say but you can find similar stuff online if you're looking for cheaper versions. It's great if you need to switch/add stuff. Plus, it looks and feels cool.</p>
      <p>Always a plus to take in actual printed samples if you have them for the interviewer to take a look at, especially if it's something more involved than say, a poster.</p>
      <p>Best of luck!</p>
