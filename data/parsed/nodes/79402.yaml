      <p>If I were you, I would invest in really good printing on high quality paper stock. A print from a machine like the Indigo machine can have you go gaga over the richness of colour.</p>
      <p>I use an small SRA4 sized art cardboard binder that was a hand me down from a senior of mine and it is awesome.</p>
