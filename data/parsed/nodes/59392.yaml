    html: |-
      <p>Kevin: <em>Isn’t .notdef Unicode #FFFD? If not, shouldn’t it be?</em></p>
      <p>U+FFFD is used to replace an incoming character whose value is unknown or unrepresentable in Unicode, e.g. where you have text in a different encoding for which software can't figure a way to convert to Unicode. So U+FFFD indicates a character not recognised as Unicode, whereas the .notdef <em>glyph</em> indicates a character not supported by the font. U+FFFD appears in text up-stream of display; .notdef appears in text during glyph display.</p>
    html_clean: |-
