      <p>Another windmill . . . Where's my donkey.</p>
      <p>Nick, We key about 2 manuscripts a year. Well, no, we no longer key, we send out about 2 manuscripts a year to be keyed . . . The other 398 arrive "editorially correct on disk." We set them with one of the few apps that supports OT - Adobe's InDesign. Not one of our customers would accept, say, an Ariel character if the MS called for a glyph not in the font. And not one of the graphic designers will check to see if the typeface they have selected in fact has all the characters called in the MS, (which may, BTW, have substituted characters from another font).</p>
      <p>Yes, we do have a little script we run that shows all the Unicode characters called in the MS. But you can miss something; each proofing pass catches about 98 percent of the errors.</p>
      <p>So, (1) The appearance of the missing glyphs is important. The starker, the better. And (2) it is important the end user has the right to add the missing glyph -- like the ygrave I encountered today.</p>
      <p>I understand ID-CS4 won't let you export to PDF unless all the needed characters are present. But sadly, I flat guarantee you ID-CS2 will.</p>
