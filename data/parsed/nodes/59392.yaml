      <p>@Jan (paragraph): Both. In InDesign, missing fonts and missing characters are both marked with a pink highlight that can be toggled in the preferences (Compositon &gt; Substituted Fonts). If the font has a .notdef glyph, missing characters are substituted with that glyph <strong>and</strong> get highlighted. Otherwise it’s just a highlighted blank space. I reckon the width of that blank space is one <strong>en</strong> space.<br>
      F</p>
