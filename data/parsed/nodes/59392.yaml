      <p>John, wouldn't it make more sense for applications to substitute a standardized ".notdef" glyph from a system font, rather than rely on the vagaries of commercial fonts? </p>
      <p>How are we going to get all the foundries to play ball, especially when there is no Unicode guide to suggest a standard glyph shape?<br>
      Having the standard in the Microsoft TT spec is not comprehensive enough.</p>
      <p><em>This has nothing to do with Unicode. </em></p>
      <p>By the same token, it's not really a responsibility of font formats<br>
      As Unicode is all about character encoding, it may be better positioned to deal with the lack of an encoded character than font formats.</p>
