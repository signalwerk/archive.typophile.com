    html: |-
      <p>Nick, the .notdef glyph dates back to Apple's original TT spec: it is to be the first glyph in a font, it is to be named .notdef, and it is to be unencoded. It provides the ultimate fallback -- after font switching or other mechanisms that an application may choose to employ -- to display <em>something</em> when text includes a character that is not supported in the font. The .notdef glyph is not a Unicode characters because it may represent <em>any</em> Unicode character that is not mapped in the font cmap table.</p>
      <p>Si wrote: <em>I’m surprised we don’t see more creative shapes – logos, alien heads etc.</em></p>
      <p>I'm glad we don't. I recall some users being confused by the spiral in the Palatino Linotype fonts. It is better that this glyph approximate the evolved conventions: an empty rectangle, a rectangle with diagonal lines corner-to-corner (the form Adobe uses), a rectangle with a question mark in it, a reversed rectangle with a question mark in it.</p>
      <p>In traditional Japanese typography, a placeholder sort was used for a similar purpose: to mark a place in the text that would require a character from a different font. This enabled the typesetter to keep working and to leave a visible marker in the text to indicate the place where the other-font character should be inserted. If I recall correctly, the sort had a horizontal rectangle in the upper half, so would print as a black rectangle above a white rectangular space. This form might be appropriate for the .notdef glyph in an East Asian font, although Ken Lunde should comment on this and correct me if I am wrong. It led me to experiment with this form:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/ndj_5358.gif"></div><p></p>
