      <p>Interestingly, of the 64K glyphs that can be in a CIDFont resource, the only glyph that is required is that for CID+0, which serves as the .notdef. Its function is for rendering as part of a fallback mechanism, and is not encoded. In fact, I would argue that it should not be encoded, which is stronger.</p>
