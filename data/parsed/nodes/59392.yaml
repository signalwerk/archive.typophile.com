      <p>Nick, it's not a good idea to leave the .notdef glyph blank. The point of the glyph is to signal the presence of characters not supported by the font, and that includes characters beyond the codepages that the font aims to support. If your .notdef glyph is blank or, worse, blank and zero-width, those characters will simply disappear from the text in many applications. Consider what happens if someone is using one of your fine fonts, but is sent a text for typesetting that includes e.g. one Chinese character. There should be some visible indication that this character is present and that it requires a different font to be selected.</p>
      <p>My preferred .notdef design is a box with a question mark in it. Recently, seeking to give this maximum visual impact on the page, I've taken to reversing the question mark out of a black box. I usually align the height of the box to the cap-height, because this producing a proportion that doesn't have an atypical impact on the line-layout, i.e. its width is representative of a typical missing character.</p>
