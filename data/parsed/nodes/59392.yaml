      <p>Nick, as I said, it is the <em>ultimate</em> fallback, if an application doesn't attempt any other kind of fallback or such other methods, e.g. font-switching, fail, the .notdef glyph is supposed to be displayed.</p>
      <p>For instance, let's say a piece of text includes a character not supported by the current font cmap table. An application (or system/library/engine) may automatically use the .notdef glyph, or it may go through a series of degrading fallbacks. It may try to find a default font on the system for displaying the character; if it can't find such a font, it may try to find a default fallback font such as Apple use in order to at least identify the Unicode range and script to which the missing character belongs; if the system does not have such a font, the ultimate fallback should still be the .notdef glyph.</p>
      <p><em>Alternatively, Unicode could specify a preferred glyph shape for “.notdef”, even if it has no code number.</em></p>
      <p>This has nothing to do with Unicode. The .notdef glyph is not a Unicode character; its function is defined by the Apple TT spec.<br>
      ___</p>
      <p>Thanks, Ken. I remember now the three-band placeholder. I did try a .notdef glyph based on this with a superimposed question mark, but it was too messy at small sizes.</p>
