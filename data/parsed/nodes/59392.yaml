    html: |-
      <p><cite>Otherwise it’s just a highlighted blank space..</cite></p>
      <p>For entire missing fonts, it seems ID checks for a <em>reasonable</em> match -- the same Unicode in its default font (Myriad?), or in a font matching the name but not the style. A missing glyph in an otherwise good font usually displays the notdef glyph.</p>
      <p>Pre-CS4 InDesign, it used to be a matter of carefully examining the document (in InDesign), but hip-hip-hooray! CS4 <em>finally</em> marks 'missing glyphs' as an error in its live preflight.</p>
