      <p>OpenType (and TrueType) fonts are designed to be fairly self-contained. Depending on external resources, such as the rendering of the ".notdef" glyph goes against this, though some clients may choose to implement their own handling of ".notdef" situations. This is also the reason why the mapping from character codes to glyphs are included in the fonts themselves, in the form of the 'cmap' table.</p>
      <p>Dr. Ken Lunde<br>
      Senior Computer Scientist, CJKV Type Development<br>
      Adobe Systems Incorporated<br>
      <a href="mailto:lunde@adobe.com">lunde@adobe.com</a></p>
