    html: <p>Really? My impression is that Jannon was doing with his romans something like Granjon and his C17th Dutch imitators did with italics, pushing each letter a bit off balance in order to render the precarious overall balance of the whole alphabet pleasurable and readable. I agree that Simoncini Garamond has an ugly a, but Storm Jannon's is much better, and his is apparently the most accurate revival. I'd like to find out more about Jannon - does anyone know of a really good reproduction or analysis?</p>
