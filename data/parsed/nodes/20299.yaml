      <p>Hi Justin,<br>
      Simoncini Garamond is, as perhaps you know, based on the work of Jean Jannon rather than Claude Garamond. Jannon is surprisingly well-served by modern revivals: Storm Jannon, Lanston Garamont and Monotype Garamond are all excellent, and there are others too. Jannon was a great type designer, if anything somewhat underrated. His work seems to me the most beautiful of the Baroque period; full of subtle distortions, it is sophisticated rather than serene, polished rather than pure. </p>
      <p>Claude Garamond himself has a great reputation, and is well-served by Adobe Garamond Premier Pro. He apparently designed his roman working from a copy of <cite>De Aetna</cite>, set in the Italian Francesco Griffo's half-complete final roman; rather suspiciously, he consistently chose the most unusual of Griffo's variant forms as his model, though he also eliminated most of Griffo's structual quirks and reduced his serifs, leaving what seems to me a less interesting kind of type. I like his italics better; they are revived in Stempel Garamond.</p>
