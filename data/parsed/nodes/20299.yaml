    <p>Hello!</p>
    <p>I discovered this wonderful online community recently, and figured I would make my first post. I am currently a student studying graphic design, and have a quick question regarding a specific typeface.</p>
    <p>This semester in school, we worked with Simoncini Garamond for a study. I found this typeface to be very beautiful, and a very distinctive revival of Garamond. I've been trying to research its history to learn more about this typeface, but have not been able to find much information. I looked in one of my textbooks, The Elements of Typographic Style, written by Robert Bringhurst, and all he mentions about this typeface is that it was designed by Francesco Simoncini in 1958. Does anyone know more about this typeface?</p>
    <p>Also, I was just curious what your favorite revival of Garamond may be. I'm glad I have found a site where one can converse to other type enthusiasts!</p>
    <p>Justin Clapp</p>
  html_clean: |-
