      <p>&gt; If type is your bag…</p>
      <p>I love type mainly because I could never write good, or draw, and it allows me to make things that please my eye. I have come to appreciate well-made fonts, and love all kinds of different letter styles, but I can’t imagine having the patience to actually make a nice one.</p>
      <p>Anyway, type as it relates to design would be of more interest to me than designing type (but God bless the type designers!)<br>
      : )</p>
