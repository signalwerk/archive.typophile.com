    <p>I noticed that in every time slot there was a class that sounded interesting. </p>
    <p><a href="http://www.howconference.com/">http://www.howconference.com/</a></p>
    <p>I was wondering if anyone here has been to one and felt they got their $1,100 out of it? Someone in another group said they didn’t learn anything they didn’t already know, but I don’t know anything…Chank is the only Type name I remember seeing on the schedule.</p>
    <p>(I know I’d like to do some photography in Vegas and haven’t been in 25 years)</p>
