      <p>I think those are nice lowecase sketches. Somehow I feel that the ascenders and descenders are a bit long. It's most apparent in the 'g' and 'y'. But making them shorter is also problematic, because usually the ascenders and descenders are longer than the capitals. So the 'g' and 'y' might also be caused by the shape of the characters. And I notice that the top of the 'y' overshoots, which does stick out a bit.</p>
      <p>I like the lowercase 'w' and 'v' alot. The 'x' seems to be too narrow. On the 'd p q' (and maybe the 'a' as well), the place where the bowl joins with the stem, the triangular 'gap' on the short terminal looks a bit crammed. Look at your 'u', that looks better in my opinion, more white space is left. The 'e' is placed too low; the bottom overshoot is too large. Maybe you can also check how the 'e' looks if the crossbar is placed slightly lower. I'm not a big fan of the 'r', it might be too wide. And maybe try to make the lowercase 'L' more different from the capital 'i'. Or it might get confusing if you have those characters in one word, like 'Illustrator'.</p>
