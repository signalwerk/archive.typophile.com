      <p>I like it overall.  Directions for improvement:</p>
      <p>The biggest problem is that round shapes are not taller than square ones. In other words, the O should extend slightly above and slightly below the top and the bottom of the E. Otherwise the round shapes will look too small. </p>
      <p>You could invert the height of the center horizontals in some letters - for instance, have the horizontal of the A, and the join in the Y, and the depth of the center point in the M, closer to the bottom.  The horizontal in the R is correctly lower than the other letters, but it's close enough to the others that it looks like it might be an accident. </p>
      <p>You could play with miter joins as well as round joins. I'd consider the M and N with miter joins, or B, D, and E with round joins at the bottom and miter joins at the top.</p>
      <p>The tail on the Q looks like it was copied and pasted from part of another letter.  Give it some personality. </p>
      <p>I like the S like it is.</p>
      <p>Hope this helps.</p>
      <p>-matt</p>
