      <p>Good, I'm glad it was clear. My English isn't too bad, but it was late at night, and when I'm tired my English suddenly worsens badly. ;)</p>
      <p>I think optical the correction on the X works fine. It's hardly noticable, which is the way it should be. But that's stating the obvious.</p>
      <p>One detail that stands out at the moment, is that some characters have rounded corners, some have rounded and sharp corners, and some only have sharp corners. It doesn't <em>really</em> bother me, but it does stick out a bit here and there.</p>
      <p>About the S, what if you make the top terminal extend a bit more to the right? It does seem a bit heavy on the left. Also it looks like the spine is thinner then the two hooks (what are those things called anyway, they're not bowls or shoulders, but I digress) which may be imbalancing the shape a bit, since the weight is usually placed on the spine. Eventhough contrast is pretty much non existent in your typeface, it might help if you move the weight that exists to the spine. Also the bottom terminal is very different from all the other terminals, as that one flares out wider (which the 3 and the 5 don't do, eventhough the shapes are somewhat similar).</p>
      <p>I'm not sure about the tail of the Q. It looks pleasingly peculiar, but it doesn't really seem to belong. And it is it me, or is the 'V' awfully narrow?</p>
      <p>Keep it up.</p>
