    html: |-
      <p>The font has an S that looks like amateur work, so I looked at free Sans fonts at Dafont. One called <a class="freelinking external" href="http://www.dafont.com/traffic-01-06.font?fpp=50&amp;text=BLAST+OFF" rel="nofollow">Traffic</a> has six versions including one Traffic1_0 that could look very close if you use outlining and layering to create the 3D effect.</p>
      <p>- Mike Yanega</p>
