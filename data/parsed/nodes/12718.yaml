      <p>&gt; When you remove the [red] slipcase, the image of Xeno<br>
      &gt; changes from friendly hound to snarling attack dog. </p>
      <p>Interesting technique. Some early black-and-white movies (such as one of the early Dr. Jekyll and Mr. Hyde movies) used red/green makeup and red/green lights to make a character's appearance change in real time. Since it was a b&amp;w movie the audience couldn't see the color change.</p>
