      <p>Don’t know anything about the Dutch book, but the other book referenced is simply titled Sagmeister, written by Peter Hall, and published by Booth-Clibborn Editions (2001). </p>
      <p>It features a red plastic slipcase that, when on the book, displays an image of a happy German Shepard named Xeno. When you remove the slipcase, the image of Xeno changes from friendly hound to snarling attack dog. You can see it here:<br>
      <a href="http://designblog.rietveldacademie.nl/?tag=dog" title="http://designblog.rietveldacademie.nl/?tag=dog">http://designblog.rietveldacademie.nl/?tag=dog</a></p>
