      <p>Colored cellophane is easy to find in craft stores now.</p>
      <p>From what I remember of the cheap "magic window" stuff, all you need is a pure red for the obscuring pattern and a light cyan for the hidden print. Both should be screened if possible. That way, the eye doesn't pick up telltale outlines because all it can see are dots.</p>
