    <p>i am interested in trying out a technique whereby one would use a filter to reveal a message from an overlay of coloured type, a little like the 3d glasses principle.</p>
    <p>does anyone have any idea what the print process is for this, for example which pantones are recommended, where to get the filters etc...</p>
    <p>i have found a printers that can do this, but it is not a big run and i don't have the budget. can anyone help?</p>
