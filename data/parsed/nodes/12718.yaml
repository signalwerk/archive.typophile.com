    html: |-
      <p>Back in the 1950s, if I lost the glasses that came with a 3D comic book, I could make my own with lollipop wrappers (cherry and grape -- worked pretty well, actually). Many years later, when a local TV station broadcast "Creature from the Black Lagoon" in 3D, I made my own glasses (and those for several guests at a 3d TV party) from theatrical lighting gels. The gels are more readily available at stage lighting companies (check the Yellow Pages), are consistent in color and are reasonably priced.</p>
      <p>Printing process is not important -- good-quality color copies will work as well as printing, but the exact colors you use will probably have to be determined by trial and error. In my limited experience of goofing around with 3D drawing, I found that lighter shades or red and blue work better at "disappearing" when the appropriate gel is used.</p>
