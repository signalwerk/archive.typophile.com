      <p>Yes, besides the recent digital Monticello specimen (which I also have, thanks to Andy Crewdson - I hope he resurfaces one day...), Lawson* refers to the #1, and Updike has a passing reference too (look under "Oxford"). So I stand corrected - my bad. There was a "spike" in my memory about the numbering of the B&amp;R stuff, and I think it was due to two things: the #1 was the second font they made (or at least finished); the #2 is listed first in the 1812, while the #1 is listed second. And I think I remember reading some author wondering about the preculiar numbering of the B&amp;R #1... but at this point I think I'll give my memory the short vacation it apparently needs.</p>
      <p>* Maxim's "Wilson" slip just now must be due to another Scotch designer, Alexander Wilson; and/or the really good Scotch design from The Foundry by that name.</p>
