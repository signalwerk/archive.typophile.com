      <p>Many typefaces that <a href="/web/20150123121527/http://typophile.com/wiki/Matthew%20Carter" class="freelinking" rel="nofollow">Matthew Carter</a>, the designer of Georgia, did in the last twenty years are, in fact, Scotch Romans: Miller, in its many versions and varieties, and also Vincent, and Big Figgins, and Elephant. And one, lesser known but exquisite, typeface he designed a couple of years ago for Princeton University Press, a new, digital, version of <a href="https://web.archive.org/web/20150123121527/http://www.creativepro.com/story/feature/20027.html" rel="nofollow">Linotype Monticello</a> (né Binny &amp; Ronaldson's "Pica Roman No. 1"), which is yet another Scotch Roman.</p>
      <p>Will, you're right: Lawson's coverage of Monotype Bell, ATF Ofxord, Linotype Monticello, and the whole [sub?]category of Scoth Romans (in his <em>Anatomy of a Typeface</em>) is probably the best there is...</p>
