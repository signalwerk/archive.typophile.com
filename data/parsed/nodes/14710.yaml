    html: <p>Actual size photos, 300 dpi. James Mosley photographed the entire 1827 Imperial Letter-Foundery Specimen for me which I include complete (at the suggestion of Matthew Carter). I also include 4 pages from Miller 1813, 3 from Wilson of 1812, a Fry broadside, 4 pp from the Wood &amp; Sharwood specimen of 1838, a couple of broadsides, and a couple of surprise showings (previously unpublished -- well, they are all previously unpublished, I mean previously unknown) of the Bell types, artwork for the Porson greek, a page of Porson and a page showing the Sarcophagus Greek, which I am attributing to Austin.</p>
