    <p>i've been reading '<a href="/web/20150123121527/http://typophile.com/wiki/anatomy%20of%20a%20typeface" class="freelinking" rel="nofollow">anatomy of a typeface</a>' and just got to the <a href="/web/20150123121527/http://typophile.com/wiki/Caledonia" class="freelinking" rel="nofollow">Caledonia</a> chapter. i find Caledonia so wonderful. i couldnt put it into words. but the book mentions the face was created based on the idea of improving or refurbishing <a href="/web/20150123121527/http://typophile.com/wiki/Scotch%20Roman" class="freelinking" rel="nofollow">Scotch Roman</a>.</p>
    <p>i was wondering if anyone had some good links or some good info on Scotch Roman...i'm thinking something more about it's history and how it came about. 'anatomy...' seems very brief when talking about Scotch Roman</p>
    <p>thanks<br>
    will</p>
