      <p>I know this discussion was in 2005 but you may still be interested in pursuing it. James Mosley wrote a piece called "Scotch Roman: What it is and how it got its name" in Ampersand, quarterly journal of the pacific center for book arts, vol 17, nos 3 &amp; 4, 1986. i believe binny &amp; ronaldson type was modeled after the Bell &amp; Stephenson type (also by Austin but much earlier than the Scotch faces). Monticello &amp; Oxford are based on that earlier style, rather than Scotch. I have a chapter on the relation between Austin and the two Scotch founders, Wilson of Glasgow and Miller of Edinburgh in my forthcoming book on Richard Austin. The first showing of the new Scotch type was in 1811 (Edinburgh) &amp; 1812 (Glasgow). There was an 1809 specimen but it is now lost.<br>
      (Alastair Johnston)</p>
