      <p>Many typefaces that <a href="/node/13520" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Matthew Carter</a>, the designer of Georgia, did in the last twenty years are, in fact, Scotch Romans: Miller, in its many versions and varieties, and also Vincent, and Big Figgins, and Elephant. And one, lesser known but exquisite, typeface he designed a couple of years ago for Princeton University Press, a new, digital, version of <a href="http://www.creativepro.com/story/feature/20027.html">Linotype Monticello</a> (né Binny &amp; Ronaldson's "Pica Roman No. 1"), which is yet another Scotch Roman.</p>
      <p>Will, you're right: Lawson's coverage of Monotype Bell, ATF Ofxord, Linotype Monticello, and the whole [sub?]category of Scoth Romans (in his <em>Anatomy of a Typeface</em>) is probably the best there is...</p>
