    html: |-
      <p>The fact that some of these so-called warez sites actually post the amount the different libraries are worth—often saying such things as "$20,000 in fonts"—leaves me to believe, at least insofar as warez sites are concerned, that they know very well the amount of money which they are "saving".</p>
      <p>I do think students do have a certain period clouded by naivety. But teachers need to be the bringer of reality on that score. They must do their part in educating the students correctly. The teachers who share fonts are not doing their students any favors at all. (Neither to the schools.)</p>
