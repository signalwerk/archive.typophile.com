    html: |-
      <p><em>Is the massive sharing of commercial film, television and music files predicated on ignorance of their value?</em></p>
      <p>Yes. People (present company excluded, of course) have no concept of what anything is worth.<br>
      Blame the Wal-Mart <a href="https://web.archive.org/web/20150124161304/http://www.fastcompany.com/magazine/77/walmart.html" rel="nofollow">gallon-of-pickles,</a> executive compensation packages, and font bundling.</p>
      <p>But really, what does it matter what anything's worth? Smart people are the ones who get as much as possible for as little as possible, without getting caught, so why pay for something if you don't have to? Why bother to even think about what it's worth? </p>
      <p>I was talking about fonts with a freelance graphic designer I bumped into at a party, and asked him where he got his from. He said a buddy of his gave him a CD full. I'm pretty sure he had no idea how many fonts there were on it, or what it would cost to licence them, and didn't care. He knew I was a type designer but it didn't phase him--probably didn't make the connection that he may have been using my fonts for free.</p>
