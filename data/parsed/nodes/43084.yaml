      <p>"Is the massive sharing of commercial film, television and music files predicated on ignorance of their value?"</p>
      <p>Let's not presume that the general public has anywhere near the awareness of type that they have of film and music media. The general idea in the states is that those media do have value, but that some people enjoy somehow getting free access to them. By contrast, fonts are just there, they grow on trees or are made by machines, and have no value <strong>because</strong> you can get them for free. Note: I'm not saying this difference exists, I'm saying the attitude, and the awareness it comes from, is very different. Do you not see that?</p>
