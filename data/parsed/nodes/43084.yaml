      <p><em>If you follow any of the warez sites you will know that anyone who comes out against software sharing is seen as the enemy.</em></p>
      <p>Right. If you are victimized, it's OK to say "please don't hit me again", but anything stronger is asking for more beats--because you can't rely on the authorities to protect you. Hence the softly-softly tactic. It's sad, but what else can you do? It would be unrealistic to imagine that a well-publicized anti-piracy campaign with industry-wide support would have any effect, seeing what has happened with music downloads. </p>
      <p>Another approach is to ignore the swarm of gnats, and make a better product that people will want to buy rather than rip off. And write easier-to-understand EULAS. And provide consumer education. But all these are happening too, and no doubt pirates find the better products to their liking, and the attempts at reforming their mind-set very amusing.</p>
      <p>The problem is intractable, as DTP is predicated on easy-to-copy font formats.</p>
