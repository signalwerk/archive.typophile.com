      <p>Greetings,</p>
      <p>I am flattered by all this attention, FDRC is a collective of foundries, individuals and others concerned that the DCMA laws that apply to commercial software are also being applied to fonts. We have an confidential advisory board that helps further our mission and I am the face behind the curtain. If you have any questions, would like to use our services or report a shared commercial font, please do not hestiate to contact me directly either by email <a href="https://web.archive.org/web/20150124161304/mailto:janet@fdrc.org">janet@fdrc.org</a> or clicking on the link on our site: <a href="https://web.archive.org/web/20150124161304/mailto:piracy@fdrc.org">piracy@fdrc.org</a>. </p>
      <p>All my best,<br>
      Janet Moore<br>
      FDRC</p>
