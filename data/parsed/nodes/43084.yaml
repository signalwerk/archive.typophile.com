      <p>FWIW</p>
      <p>FDRC is a legitimate organization and from what I understand they are only interested in protecting their work. Being that they are a collective of foundries, I understand that they are not out to do anything more than protect their own work. I don't see how this can be seen as something bad.</p>
      <p>If you follow any of the warez sites you will know that anyone who comes out against software sharing is seen as the enemy. I've heard stories of people who have been attacked (not physically mind you) because of it. I would guess the privacy is necessary because of this. I'd assume the same of the foundries.</p>
      <p>I don't think FDRC should be seen as anything more than people trying to protect their work.</p>
