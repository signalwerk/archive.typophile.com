    html: |-
      <p>[[http://www.linotype.com/48344/helveticaworld-family.html?viewmode=family&amp;id=48344&amp;name=helveticaworld&amp;subviewmode=&amp;#|Helvetica World]] supports (common) Latin, Cyrillic, Greek, Hebrew, and Arabic.</p>
      <p>Andreas Stötzner's <a class="freelinking external" href="http://www.signographie.de/cms/front_content.php?idart=215">Andron Mega Corpus</a> covers (extensive) Latin (incl. IPA), Greek, Cyrillic, Old Italic, Coptic, Ogham, Runic, and Gothic scripts.</p>
      <p>The <a class="freelinking external" href="http://dejavu-fonts.org/wiki/index.php?title=Main_Page">DejaVu fonts</a> do (extensive) Latin (incl. IPA), Greek, Cyrillic, Georgian, and some Armenian, Hebrew, N'ko, Tifinagh, Lao, Canadian Aboriginal Syllabics, Ogham, and Arabic, but the quality varies from script to script and from glyph to glyph.</p>
      <p>Why do you ask?</p>
