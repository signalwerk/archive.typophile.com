    <p>I'm looking for a super thin, gestural (flowing), fun and perhaps somewhat feminine display typeface that screams THREAD. Y'know, like yarn but skinnier.</p>
    <p>Most of my collection is serious Modernist business, so this is a little out of my experience. Any suggestions greatly appreciated!</p>
    <p>Thanks,<br>
    B. Electro</p>
