    html: <p>"So, would it be fair to say clients (particularly those with a knowledge of pritning processes) would prefer something that's been pressed as opposed to digitally printed?" <br> <br>I think that's too broad of a statement. Clients come in all shapes and sizes ;o) <br> <br>A lot of our clients were actually other design firms that, obviously, knew of printing methods and media.  <br> <br>That said, we also had a lot of wedding/event invite type stuff where people were, IMHO, looking for something more unique. Not necessarily in look, but in terms of production. ie, it added a bit of perceived value to the piece when there was that tactile response (the impression of the type, the thicker paper stock, etc.) We had to hit the paper hard because people wanted to emphasize the fact that it was letterpressed. True letterpress shouldn't really advertise the fact that it was letterpressed. <br> <br>Also, folks just found it fun to dig through the type cabinents. <br> <br>"Also, when Microsoft was founded how substantially did this affect graphic design?" <br> <br>In terms of producing work, not at all. <br> <br>" Also why was the introduction the apple so popular?" <br> <br>Because it was unlike anything else at the time. It had a mouse, you moved the mouse and it did things on screen. The original apps were geared toward the visual arts. It had the first set of fonts that weren't monospaced, etc.</p>
