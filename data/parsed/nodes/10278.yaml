    html: "<p>\"It seems like such a broad question!\" <br> <br>Well, yea, I completely agree...hence my original comment. ;O) <br> <br> \"Why have we seen a return to the handmade over recent years?\"  <br> <br>I'd say a) people are nostalgic and b) the dot-com bubble was the pinnacle of digital everything...graphics, music, internet, PDAs, etc. and had no place to go but down. <br> <br>In terms of personal work, I used to work here: <br> <br><a href=\"http://www.blincpublishing.com\" target=\"_blank\">http://www.blincpublishing.com</a> <br> <br>which, at the time, was a small web firm + letterpress printing shop. A nice mix. I guess I'd say that affected my work by giving me the motivation and tools to easily experiment outside of the computer. Granted, a lot of what we did there ended up with the letterpressed aesthetic, which for us was a nice selling point.</p>"
    html_clean: "<p>\"It seems like such a broad question!\" <br> <br>Well, yea, I completely agree...hence my original comment. ;O) <br> <br> \"Why have we seen a return to the handmade over recent years?\"  <br> <br>I'd say a) people are nostalgic and b) the dot-com bubble was the pinnacle of digital everything...graphics, music, internet, PDAs, etc. and had no place to go but down. <br> <br>In terms of personal work, I used to work here: <br> <br><a href=\"http://www.blincpublishing.com\" target=\"_blank\" class=\"link-external\">http://www.blincpublishing.com</a> <br> <br>which, at the time, was a small web firm + letterpress printing shop. A nice mix. I guess I'd say that affected my work by giving me the motivation and tools to easily experiment outside of the computer. Granted, a lot of what we did there ended up with the letterpressed aesthetic, which for us was a nice selling point.</p>"
