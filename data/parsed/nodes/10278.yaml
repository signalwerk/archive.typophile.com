    html: <p>Well I managed to write the introduction to my essay, only another 2000+ words to go! I managed to get an extension until Monday, though. <br> <br>Why have we seen a return to the handmade over recent years? <br> <br>I recently read that the average graphic designer spends about seventy five percent of his or her time working in front of a Mac. I�m not entirely sure how accurate this statement is and it certainly can be argued that every designer works in a different way to the next, yet the point remains that however much time is spent rectifying spacial errors in Quark, or attempting to attain the correct white balance in Photoshop, it is a significantly greater amount of time than thirty years ago. <br>	The last monotype composing machine was built thirty years ago in 1975, the same year Microsoft was formed. From then on, the use of computers within the field of graphic arts has rapidly increased, however it was not until the introduction of the Apple Macintosh and �wysiwyg� interfaces in 1984 that computers began to really realise their potential. Primarily many designers were sceptical as, in terms of quality, the end results being produced by early systems were inferior to traditional printing methods such as letterpress, in the case of typography. The introduction of Apple�s �what-you-see-is-what-you-get� system replaced the need for complex  programming skills. For the first time a computer system was available that was equipped to cater for the needs of one working within the visual arts. For the the first time the work under production could be viewed on screen, added to this was the introduction of the mouse, which enabled the designer to manipulate their work on screen whilst it was being made. For the first time technology was challenging traditional graphic design processes. <br>	As technology and digital printing methods continue to improve and evolve it could be argued that the existence of traditional printing and mark making  is now constantly going to be under threat and that the threat will cease to subside. With this in mind why is it that, especially in recent years, we have seen a return to the handmade? If traditional techniques no longer assimilates to quality then what purpose do they serve? <br> <br>I also have to do an animation by Friday..why do I always leave things to the last minute?!</p>
