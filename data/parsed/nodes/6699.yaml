    html: <p>Stephen Coles, <br> <br>I appreciate the your link to my Bodoni 26. <a href="http://lanstontype.com/GiampaWonders.html" target="_blank">http://lanstontype.com/GiampaWonders.html</a> <br><a href="http://lanstontype.com/Bodoni26.html" target="_blank">http://lanstontype.com/Bodoni26.html</a> <br> <br>Just for the record. I do not agree with Bradbury's concept of one alphabet. I designed Bodoni 26 for commercial purposes. In that regard it has served the Lanston Type Company very well. Personally I find the Finnish transitional type designs of far more interest than "grinding Bradbury's axe". <br> <br>I predict Finnish transitional types would be commercially doomed. <br> <br>Although Bodoni 26 is a great success it my speculation that it's popularity is because of its' utility and novelty, not for a profound sympathy towards the politics. As Nick would say, "it is a happy accident".</p>
