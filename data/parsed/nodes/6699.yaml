  - id: 46841
    user: 1262
    date: 2004-09-17T14:11:00
    date_raw: 17.Sep.2004 2.11pm
    votes: null
    html: <p>Do you mean didn't uncial precede unicase? As terms, yes, but since uncial lettering has a single case that includes forms that relate to both preceding majuscule and later miniscule forms, I'm wondering if it would be considered a subset of a more general classification of unicase alphabets, which also includes other single-case, non-uncial designs. Or is there some significant difference between uncial and unicase. For example, would anyone consider deliberate intent, i.e. rejection of bicameral norms, as a fundamental criterion for unicase? If so, that would limit the unicase category to designs that historically follow the establishment of the bicameral alphabet as the normal way of writing the Latin script.</p>
