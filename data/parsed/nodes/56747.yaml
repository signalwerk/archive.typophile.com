    html: <p>The gold outline makes <em>Professional</em> tough to decipher, but <em>Reg Harris (Cycles) Ltd.</em> is done in the style of Edward Johnston’s 1916 alphabet for the London Underground, and <em>England</em> looks like the same thing, but slightly bolder and more condensed.</p>
