  html: |-
    <p>Hi,</p>
    <p>I am restoring an old Reg Harris bicycle and am recreating the transfers. I’ve artworked most of them now, but am having problems identifying the fonts (have spent rather too long looking and can’t really see the wood for the tree...)</p>
    <p>The first font is for the model name (Record in my case, but I believe it’s the same as this one): </p>
    <p></p><div class="imageWrap"><img src="/files/Reg_Pro_toptube_decal_3973.JPG"></div><p></p>
    <p>The second font is from the crest on the seat tube (“Reg Harris Cycles Ltd England”), this one is driving me particularly crazy because I’m sure it’s obvious, but I can’t seem to get it (it’s a basic grotesk of some sort...)</p>
    <p></p><div class="imageWrap"><img src="/files/Reg_Pro_seattube_decal_1_5721.JPG"></div><p></p>
    <p>Many thanks in advance for all help,</p>
    <p>Crispin Jones</p>
