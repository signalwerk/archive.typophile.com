    <p>Font has a set of glyphs in Supplementary Multilingual Plane - above BMP.<br>
    I made some ligatures and here is my headache. FontLab demo shows all ligatures, InDesign too. I'm looking for any simple application which works with this font (=supports ligatures). Very nice BabelPad shows only f_i ligature but not the rest (these important).<br>
    Any hints? The font will be used by a small community of poor people so InD is not an option.</p>
