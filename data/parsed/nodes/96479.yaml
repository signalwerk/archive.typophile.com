    html: |-
      <p>Ooh, Chakma. How cool is that!</p>
      <p>The problem you will run into is that Chakma, like other Abugidas, is a 'complex script' in text processing terms, so the expectation for OpenType will be that it requires layout engine assistance. What this means is that a lot of software will simply not apply OpenType Layout features to Chakma characters without the presence of such a layout engine. The behaviour you are seeing in InDesign is uncommon, in that Adobe's fallback for characters that its layout engines don't recognise as belonging to a particular supported script get generic OT feature shaping. Unfortunately, this might only help you in the short term, because if/when Adobe do get around to supporting Chakma your current implementation will likely be incompatible with (as yet unspecified) requirements for fonts to work with the layout engine.</p>
      <p>Generally speaking, Microsoft leads the way in defining shaping engine behaviour for complex scripts and fonts. It is possible that someone at MS is working on Chakma, or that it might be bolted onto one of the existing shaping engines for related scripts. On the other hand, like other organisations, they tend to set priorities by numbers of users, so Chakma might be very low on the list of things to implement.</p>
