    date_raw: 19 Sep 2012 — 2:27pm
    votes: null
    html: <p>By the way, I would expect ligation of signs in this way to be handled by one of the non-discretionary features, unless you want users to be able to disable the ligation. In the absence of a Chakma spec, I would use the 'ccmp' feature, but note that this is normally applied before any other shaping except language-specific variants of basic characters.</p>
