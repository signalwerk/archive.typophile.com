  html: |-
    <p>Is it possible to have ligatures that work only in selected style sets?</p>
    <p>I have a script font that has a style set with an alternate r, but certain combinations need to be ligated - wr and cr in the example below. I only want the alternate style ligatures to appear in the style set. Can this be done?</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Ssligs_6659.jpg"></div><p></p>
    <p>The way wr and cr should appear is the bottom image.</p>
    <p>Thanks.</p>
      <div class="forum-topic-navigation clear-block">
