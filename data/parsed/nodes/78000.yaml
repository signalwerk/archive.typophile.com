    html: |-
      <p>Now that Nick's problem is resolved, I have a question: What is the argument against just putting the whole thing in a stylistic set? Ordering within the set would be important, but after substituting the individual glyphs, why not just go ahead and substitute the ligatures right there?</p>
      <p>If you remember Wilson Greek, it came with an extensive set of ligatures -- I suppose you would call them historical ligatures. I built several stylistic sets, beginning with the most commonly seen ligatures (in, say, ss05), and making new sets with an ever-increasing number included. The thinking was that most authors wouldn't want all the ligatures; some are pretty obtuse.</p>
      <p>It worked fine. I'll allow this is only for our in-house composition &amp; not a for-sale font that has to work on numerous applications programs. Was that the only reason to involve the liga feature?</p>
      <p>* * *</p>
      <p>Example from the Wilson Greek</p>
      <p>feature ss10 {<br>
      sub alpha' iota' @ENDS by alpha_iota.terminal;<br>
      sub alpha' uni1F77' @ENDS by alpha_uni1F77.terminal;<br>
      sub alpha' sigma' @ENDS by alpha_sigmafinal;<br>
      sub uni1F70' sigma' @ENDS by uni1F70_sigmafinal;<br>
      sub alpha iota by alpha_iota;<br>
      sub alpha sigmafinal by alpha_sigmafinal;<br>
      sub uni1F70 sigmafinal by uni1F70_sigmafinal;<br>
      sub alpha uni1F30 by alpha_uni1F30;<br>
      sub alpha uni1F31 by alpha_uni1F31;<br>
      sub alpha uni1F32 by alpha_uni1F32;<br>
      sub alpha uni1F33 by alpha_uni1F33;<br>
      sub alpha uni1F34 by alpha_uni1F34;<br>
      sub alpha uni1F35 by alpha_uni1F35;<br>
      sub alpha uni1F36 by alpha_uni1F36;<br>
      sub alpha uni1F37 by alpha_uni1F37;<br>
      sub alpha uni1F76 by alpha_uni1F76;<br>
      sub alpha uni1F77 by alpha_uni1F77;<br>
      sub alpha uni1FD3 by alpha_uni1FD3;<br>
      sub alpha uni1FD6 by alpha_uni1FD6;<br>
      sub alpha upsilon by alpha_upsilon;<br>
      sub alpha uni1F7B by alpha_uni1F7B;<br>
      sub alpha uni1FE6 by alpha_uni1FE6;<br>
      sub alpha uni1F50 by alpha_uni1F50;<br>
      sub alpha uni1F51 by alpha_uni1F51;<br>
      sub alpha uni1F54 by alpha_uni1F54;<br>
      sub alpha uni1F56 by alpha_uni1F56;<br>
      } ss10;</p>
