    date: 2011-01-18T10:15:00
    votes: null
    html: <p>Hello Charles, there is no argument against this. It depends on which kind of behavior you intend to achieve. So if you, as designer of a typeface, think that certain ligatures are essential part of a specific Stylistic Set, then you should include them there. If you consider the stylistic alternates as being independent of ligatures that involve these alternates, and want typographers to choose alternates and ligatures (whichever default or alternate shapes they may have) separatedly, you should deal with alternates in a Stylistic Set feature and with ligatures in the Ligatures feature.</p>
