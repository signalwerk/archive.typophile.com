    html: |-
      <p>Sure it can be done.</p>
      <p>in ss01:</p>
      <p>sub r by r.ss01;</p>
      <p>in liga:</p>
      <p>sub c r.ss01 by c_r.ss01;</p>
      <p>The order of features is important. This only works if ss01 comes before liga, as it is in your screenshot.</p>
