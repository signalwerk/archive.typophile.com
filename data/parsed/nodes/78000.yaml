    html: <p>Now all ligatures work except rr. Could it be because it is two r's? It follows the same method as all the other ligs.</p>
  - id: 447787
    user_id: 8664
    user_name: k.l.
    user_path: null
    user_image: /files/pictures/picture-8664.jpg
    date_raw: 17 Jan 2011 — 4:31am
    date: 2011-01-17T04:31:00
    votes: null
    html: |-
      <p>If you followed Jens' logic, then your <em>ss01</em> feature already has replaced <em>all</em> "r"s by "r.ss01"s. This means that<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<em>sub r r.ss01 by r_r.ss01;</em><br>
      would not work because there is no "r" left in the glyph string handed over to the <em>ss01</em> feature. Instead you need to replace two consecutive "r.ss01"s<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<em>sub r.ss01 r.ss01 by r_r.ss01;</em></p>
