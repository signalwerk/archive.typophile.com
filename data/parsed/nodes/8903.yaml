    <p>Hi guys, <br> <br>I'm looking for a program that allows me to create or modify fonts. The problem is that one of the fonts I want to modify is a Japanese font and has nearly 16000 glyphs in it. <br> <br>First I tried the shareware version of Font Creator, but it seemed real slow, I tried moving the japanese characters to another font, and 10 minutes later, it was still frozen and windows would say the program was not responding anymore, so I just gave up. <br> <br>Fontographer wouldn't even open the file, saying there was not enough memory to perform the operation. <br> <br>I also heard of another program called FontLab, it looks really nice (and really expensive too), but I read that you cannot save fonts with more than 6400 glyphs in them.  <br> <br>Does anyone know of a good program that can handle big fonts like that?  <br> <br>Renn.</p>
