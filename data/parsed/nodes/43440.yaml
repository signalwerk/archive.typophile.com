    <p>I'm designing a small portfolio handbook for myself.<br>
    I need advice on measures of a well formatted graphical handbook.</p>
    <p>I'm thinking something around 155mm x 190mm<br>
    matte paper, cover 280 g/m2, pages 170g/m2, Stitched.</p>
    <p>What do you suggest?</p>
    <p>Cheers</p>
