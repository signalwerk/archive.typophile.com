      <p>roballoo:</p>
      <p>I'm sure the humour of this isn't lost on you: you used TNR on a resume for a *design* position. In any case, Arial would probably have been an even worse choice. At least TNR is an original, though drawing from a tradition which includes Plantin, I believe. Arial, however, is a poorly-executed knockoff of Helvetica and is universally hated in the design world.</p>
      <p>I've never applied for a design position - it isn't my field, although I feel that nearly all written matter should be "designed" to some degree. Just good typography. I suspeect that you'd be better off investing in some quality fonts from houses such as, say, Underware, Porchez Typefonderie, etc. StormType is another producer of great fonts that can cover all your needs quite easily.</p>
