      <p>Consider telling us what kind of position you're applying for. No typeface is suitable for every industry.</p>
      <p>If you're looking for warm and distinguished, consider Galliard. It is familiar to the reader, yet in another league, and the italic is individual.</p>
      <p>Arrus is also a good choice, graceful and warm.</p>
