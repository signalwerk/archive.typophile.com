      <p>My wife's just getting her resume together for a teaching gig, so I've been helping her out.</p>
      <p>Due to the fact that many places want to receive resumes in Microsoft Word format, I opted for Georgia for headers and Verdana for body copy. Looks pretty good on any computer.</p>
      <p>Any thoughts?<br>
      --Michael.</p>
