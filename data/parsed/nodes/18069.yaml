    <p>Hello again, everyone. I'm designing my resume, and I'd appreciate some input about serif/sans serif font choices.</p>
    <p>The impression I want to give: warm, yet distinguished. Nothing cold or sterile. </p>
    <p>My ideas so far: </p>
    <p>1. Dolly paired with Auto (or Formata?)<br>
    2. Freight Text Medium paired with Freight Sans</p>
    <p>I'm leaning toward using Dolly, at least. I'd love to see just how much mileage I can get out of that beauty, but I'm open to all suggestions.</p>
    <p>Thanks.</p>
