    html: "<p>Drew, the concentric circles seem <br>to be fighting for attention on all the versions <br>except the first one. I like that one best. <br> <br>suggestions: <br> <br>* maybe a less tall, condensed version of Knockout? <br>* play with the ampersand, both in weight and design. <br>* look at the structure of the two trees and see if you <br>can somehow harmoniously tie them together. <br>* look at the leaves of the two trees and see if there's <br>some distinction or connection. <br>* check out some more woodtype for inspiration, too. <br>I think we had some good Woodtype links posted here, <br>but I can't remember exactly where. <br> <br>bj <br> <br> <br> <br>  <br></p>"
