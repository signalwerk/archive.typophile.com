  html: <p>Hi everyone <br> <br>I'm working on a logo for my new site, oakandelm.org .. The name doesn't have much meaning to it, I just thought it was cool.. So why not a cool logo with some meaning? I've been messing around with different ways of interpreting a tree trunk. For my type, I chose 'Knockout' because it resembles the kind of type I think of when I hear " wood type "  <br> <br>Any comments / suggestions would be greatly appreciated! <br> <br>-Drew <br><img src="http://www.typophile.com/forums/messages/29/19252.gif" alt="logo concepts"> <br> <br> <br></p>
  html_clean: <p>Hi everyone <br> <br>I'm working on a logo for my new site, oakandelm.org .. The name doesn't have much meaning to it, I just thought it was cool.. So why not a cool logo with some meaning? I've been messing around with different ways of interpreting a tree trunk. For my type, I chose 'Knockout' because it resembles the kind of type I think of when I hear " wood type "  <br> <br>Any comments / suggestions would be greatly appreciated! <br> <br>-Drew <br><img src="http://www.typophile.com/forums/messages/29/19252.gif" alt="logo concepts"> <br> <br> <br></p>
