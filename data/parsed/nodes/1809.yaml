    html: <p>I really like the core concept here. I agree with both bj and drew about searching out some alternative type specimens. I also second bj's motion to really examine the relationship between the Oak and Elm trees (i.e. bark, leaves, etc.). Currently, it looks like you have one of the same issues I had a couple of months ago when I was designing my logo</p>
