    html: |-
      <p>The N is from the 'CheapProFonts' updated version of the font. It has this 'N', which LOOKS like an 'N', unlike the original. The new version also modifies a few other characters, including the M, m, n, and  t.</p>
      <p>Krizia Uomo was created by Levi (Levente) Halmos. It has since been expanded upon, with his approval by someone else, and renamed to Krizia Amo in a commercial version (US$10) with 353 glyphs  and an unbelievable 16, 459 kerning pairs! As seen here:<br>
      <a href="http://www.cheapprofonts.com/Krizi_Amo_Pro" title="http://www.cheapprofonts.com/Krizi_Amo_Pro">http://www.cheapprofonts.com/Krizi_Amo_Pro</a></p>
      <p> - Herb VB</p>
