    <p>I'm in the process of redesigning my portfolio and I would like to find a suitable body text font to pair with <a href="http://www.fontspring.com/fonts/fontsite/anaconda" rel="nofollow">Anaconda</a>. Or perhaps you could recommend a better font with the same look and feel?<br>
    Till now I have this, with Franklin Gothic and Eurofont: </p><div class="imageWrap"><img src="http://typophile.com/files/test_3618.jpg"></div><br>
    Any thoughts?<p></p>
