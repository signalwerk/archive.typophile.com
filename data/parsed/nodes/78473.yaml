    html: |-
      <p>Thank you both. Yes, there is a reason for using a condensed font. The layout and the fonts need to feel...well, quaint. And I like the rigor and structure that Anaconda has, as to me it seems to suggest exactly that: old style without being antiquated, strong, encased in a well fitting suit. I don't think a sans font would cut it for headlines in this case - or at least I haven't seen yet a sans serif that is as rigorous and structured and befits that atmosphere that I'm trying to create.<br>
      Nick Shinn, that's a wonderful font.I did some tests with the generated samples from myfonts and I think the regular width would look better though. The extended feels a bit overwhelming for some reason - though perhaps that's because the paragraphs won't be very wide, 500 px maximum(yes, this is for the web). But I might be wrong since my background is in front-end dev and not in typography.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/test_5240.jpg"></div><br>
      Any thoughts?<p></p>
      <p>Thanks again for your time and patience.</p>
