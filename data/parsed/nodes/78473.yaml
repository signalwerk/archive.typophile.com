      <p>This is for web?</p>
      <p>Be sure to check Beaufort's rendering in Windows both with Standard (Greyscale) rendering and Cleartype rendering.</p>
      <p>I don't think Franklin Gothic is that bad here, so I'll suggest a couple of others in the same vein:<br>
      FF Bau from FontFont shares the static skeleton (structure) with Anaconda, and is available for @font-face embedding in a properly hinted Web version. The same goes for Benton Sans from Font Bureau.</p>
