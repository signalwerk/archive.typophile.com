      <p>Thank you. FF Bau is a bit too strong, in my opinion. I want the text to be readable, but I still want the headers to catch one's attention. I am afraid that with too many strong elements the user won't be able to focus on anything. However you gave me the idea(well, indirectly) to search for a pair at the same font house and I found Flanders. I keep looking at it and I think I might have a winner here, though I wish it was just a tad more extended.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/test_6000.jpg"></div><br>
      Perhaps someone knows of a similar font in an extended version?<p></p>
