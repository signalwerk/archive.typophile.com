    html: |-
      <p>The body faces you have chosen are very middling, in terms of weight, proportion, and style (although the Eurostile does have a bit of personality).<br>
      Therefore, they are not sufficiently extreme to counterpoint the heading, which is highly condensed, finely detailed, high contrast, and mannered.<br>
      Overall, the effect is one-sided, not balanced.<br>
      I recommend Beaufort Extended (my own faces always come to mind, for some reason :-)<br>
      It holds its own against the extremism of Anaconda, by being extended in proportion (contrary), finely detailed in serif finish (similar), low contrast (contrary), and somewhat mannered (similar).<br>
      <a href="http://new.myfonts.com/fonts/shinn/beaufort/extended/" title="http://new.myfonts.com/fonts/shinn/beaufort/extended/">http://new.myfonts.com/fonts/shinn/beaufort/extended/</a></p>
      <p>I also think one has to have a reason for using a condensed face. Often the layout calls for it.<br>
      If that is not the case, then a pairing with an extended face seems reasonable.</p>
