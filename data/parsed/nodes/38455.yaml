      <p>I came into being a graphic artist through the back door — working in a print shop. I started out as a pressman, but that job doing paste-up and mechanicals looked a whole more interesting, not to mention cleaner.</p>
      <p>Once I managed to finagle my way into that one-man department, I began to teach myself by reading whatever I could find on type and design. I then took the approach Nick speaks of: I would see old and new printed pieces that I liked, and then would go about duplicating them. I learned a lot about type that way. </p>
      <p>I was quite content doing that for a while, but fortunately, one of our more savvy press-ready clients came into the back of the shop one day and saw my stuff hanging on the wall, and said “You don’t belong here...you need to be in a graphics house.” Thus my careeer was born.</p>
      <p>So even if that print job pays less, it might be worth it to find a way to work there.</p>
