      <p>There must be some “old paper” stores in town.<br>
      Often comic book stores have old magazines, and many second-hand and antique stores have a few old printed pieces.<br>
      The thing about the old printed pieces is that they’re from the pre-digital era, so the technology and fonts don’t match exactly, and trying to create a facsimile digitally will always require a lot of “massaging” — you really have to look hard to see just what the spacing is like, and fiddle with things like tracking, justification settings, maybe even kerning and horizontal scaling, to get the text to break in the same places, and it is this difficulty which will sharpen your eye and typesetting skills.</p>
