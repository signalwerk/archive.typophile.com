    <p>i guys,</p>
    <p>I just joined this forum and I am very interested to learn more about typography and design composition.<br>
    I tried to post it on the typography section but there was like almost no one at there :( so, I hope you guys don’t mind that I post it here </p>
    <p>FYI, I was a student in graphic design program but I dropped out after my first year because I just don’t have enough money to continue so, while I am trying to save the money, I was thinking to keep on practice because I am still not very clear when to stop or dram the line what is good enough.</p>
    <p>I have few books about typography from my class textbook<br>
    The Elements of Typographic Style by Robert Bringhurst<br>
    Thinking with Type by Ellen Lupton<br>
    Typography Workbook: A Real-World Guide to Using Type in Graphic Design by Timothy Samara<br>
    The Ten Commandments of Typography by Paul Felton and Jonathan Barnbrook<br>
    Lay Out Work Book<br>
    Designer and The Grid </p>
    <p>but I need to say that I am not very book person :(</p>
    <p>I am just wondering what is the best practice for me to do it daily?<br>
    I am more than willing to make a commitment to my self to sit for 2-3 hours every single day and only to play around with typography and design composition (I have two jobs).<br>
    Btw, I tried to read a book about grid system but I think its a bit avanced for me because I don’t really get it. </p>
    <p>For my future goal, I just want to work around typography, publication,web/motion and branding. My current goal is want to have a better handle of kerning, spacing, and choosing the right combination of font type for poster design and understand better design composition in print media .</p>
    <p>Plus, I want to learn how I can create my own type face. I tried to sketched some font type then, I scanned it and trace few of them at illustrator but then, what’s next for me.<br>
    I am quite clueless </p>
    <p>I was thinking to took some words from magazine articles/lyrics, type it manually, and play around so, I can have better handle at spacing and kerning but I dunno.</p>
    <p>by the way, is they any some kind of online courses (small budget) for typography?</p>
    <p>thanks guys</p>
