    <p>Hi all, this is my first post, so I hope I'm doing everything right.</p>
    <p>My late grandmother had this book entitled "Humorous Poetry", and since there's no copyright / colophon, I'd be really interested in help in finding more about the book and the typeface used for the body copy. The book is a collection of poetry (from Chaucher and the like)... I found an <a href="http://www.archive.org/details/humorouspoetryof00part" rel="nofollow">archived copy of it</a>, with the copyright date (mine has the copyright page missing) at c.1884. Can I assume this was (or close to) the publication date?</p>
    <p>I've attached a specimen of the font and I also included a photo of the cover for interest's sake. The floral capitals and embellishments on the cover are really neat.</p>
    <p>Thanks!</p>
