    html: |-
      <p>You're right Jan...</p>
      <p>These additional identifying characteristics check out for Caslon:<br>
      1. cropped apex on 'A' (harder to make out in the metal version, but I assume it's there)<br>
      2. bowl curve of the 'p' overlaps the stem (although I'm not sure that's unique to Caslon)<br>
      3. long serifs on the middle arm of 'E'<br>
      4. large loop on italic 'k'</p>
      <p>There are others but I'm sold.</p>
      <p>Thanks for making me look a little harder :)</p>
      <p>--Kelsey</p>
