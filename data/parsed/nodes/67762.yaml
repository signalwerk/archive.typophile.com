      <p>My guess was more Baskerville or a related face. The italics are particular. For example...</p>
      <p><a href="http://www.fontshop.com/fonts/singles/linotype/baskerville_classico_italic/?&amp;sample_text=John%20Gilpin&amp;update=0" title="http://www.fontshop.com/fonts/singles/linotype/baskerville_classico_italic/?&amp;sample_text=John%20Gilpin&amp;update=0">http://www.fontshop.com/fonts/singles/linotype/baskerville_classico_ital...</a></p>
      <p>The proportions are not 100% but one differentiator with Caslon is the lower case h. In Baskerville it ends out, in Caslon it ends in.</p>
      <p>I would also note that so many Caslon/Baskerville faces do not carry the classic italics but have modernized them considerably. Go for the old ones - they're delightful!</p>
      <p>--Kelsey</p>
