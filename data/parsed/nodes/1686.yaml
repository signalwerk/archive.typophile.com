    html: "<p>&gt;kids, in particular, are encouraged not to think, by their peers <br> <br>William, as long as that's just a gross generalization (I assume <i>most</i> comments on internet discussion boards are of that type) then I actually agree with Hrant (or John? who said that?) on that one. <br> <br>I tended to hang out with the smarter kids rather than the jarheads in school - but over-all I felt that the pressure to be dumb was there, even if it was intangible and slippery. <br> <br>In high school, they want you to be a football star; in college they want you to study buisness, law, medicine, etc. <br> <br>If nothing else, as a kid I found that schools actually made it <i>hard</i> to excel. My mom had to pick me up at middle school, drive me down the road to the high school, wait for an hour, then drive me back to middle school - all so I could take geometry. they don't even offer the opportunity for kids to move ahead - everyone's expected to be the same cow in the same corral. In high school I had to take night classes at a community college, just because American high schools don't offer enough maths. [edit: darn it's hard to be a nerd in this country] <br> <br>The problem is deep and, as you rightly say, <i>not necessarily all it seems on the surface</i>.</p>"
