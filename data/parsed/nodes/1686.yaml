    html: "<p>Oi. Cross-posted. <br> <br>&gt;'Conjectures and Refutations'  <br> <br>I'll be picking that one up this week. Thanks. <br> <br>[disclaimer: I'm not a real linguist, but I play one on the internet] <br> <br>I don't think that linguistics got much from Wittgenstein. Certainly not from the whole 'picture theory' bit. But the later stuff - the 'ordinary language' stuff - has it's impact. Even if every linguist isn't proclaiming the name of Wittgenstein.  <br> <br>I don't think much from the early 20th century has much impact on contemporary linguistics - not even the 'proper linguists' like Bloomfield and Sapir. Transformational synatx and generative semantics didn't really come about until the 1950s - and that's more or less the [general] model for what people are doing now. <br> <br>The ideas of people like J L Austin are pretty well respected and, as far as I'm aware, they deal with similar things to later Wittgenstein (e.g., <i>Philosophical Investigations</i>). It's still the whole 'ordinary language' idea. And, like <a href=\"http://www.amazon.com/exec/obidos/tg/detail/-/0674411528/qid=1066178604/sr=1-1/ref=sr_1_1/002-1579554-2009616?v=glance&amp;s=books\" target=\"_blank\"> Austin's book</a> says, they're both dealing with how language really works, and how we do things with it. But those ideas are all from around the 1950s - the birth of modern linguistics. <br> <br>That's my understanding, for whatever it may be worth. <br> <br>Incidentally, I enjoyed <i>Wittgenstein's Poker</i>, but I did feel like Popper got the crappy end of the stick. \"LW is a charismatic &amp; powerful thinker full of prescient thoughts while EP is a snivelling twat clutching the skirts of Russell.\" Somehow I doubt it was quite like that :-/ <br> <br>Stanley Cavell actually has an <a href=\"http://www.amazon.com/exec/obidos/tg/detail/-/0631192719/qid=1066180376/sr=1-4/ref=sr_1_4/002-1579554-2009616?v=glance&amp;s=books\" target=\"_blank\"> essay about another philosophical argument</a> - this one between Austin and Derrida (ordinary language vs. infinite slippage or whatever). Shamefully it's another book I have on the shelf and haven't read. Might be a real gem in this conversation.</p>"
