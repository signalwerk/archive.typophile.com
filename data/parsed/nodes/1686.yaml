    html: <p>&gt;I would like to read more about it <br> <br>Good call. I should too. Speaking merely from personal experience isn't a very powerful or compelling method. <br> <br>&gt;is a dead end path in philosophy.  <br> <br>Point taken. At this point, I believe that if I was a philosopher instead of a painter-cum-printer-cum-linguist-cum-journalist-cum-typographer I wouldn't think that Wittgenstein was as interesting as I do. Though I do still think that Wittgenstein and Austin had some ideas that influence how we understand the semantics of everyday language today. Something I'll have to think/read more about surely.</p>
