    html: "<p>Very much orthoganal to the discussion, but a short, interesting and surprisingly entertaining read: Geoffrey Hill makes good play with Austin's ideas in his essay on Ezra Pound and the culpability of poetry, 'Our word is our bond' in <i>The Lords of Limit.</i></p>"
