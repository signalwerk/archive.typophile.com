    html: <p>Hrant, I didn't take up John H.'s comment as I didn't have time, and this thread isn't about it. But I will comment.  <br> <br>Non-Americans pontificating about America - and I include John Hudson here - often miss large parts of the picture.  <br> <br>It is perfectly true that the American mass entertainment media pander to the lowest instincts of people, including flattering the average consumer by assuring them that everone more intelligent or learned is contemptible in some way or other.  <br> <br>But they sometimes also rise above such pandering and do wonderful stuff. And, more important, America is not to be identified with the American mass media.  <br> <br>Many parents and teachers are constantly waging intellectual battle against the debased tone of the mass entertainment media. And there are huge communities of thoughtful people that totally ignore such drivel. They are vibrant and vital and behind the most dynamic economy in the world.  <br> <br>Judging America only by the mass media is like those people outside the US 50 years ago who used to think that we were full of cowboys, Indians, and rich people in mansions - because that is who was in the movies.  <br> <br>Of course there is anti-intellectualism here, and it is a despicable American tradition.  <br> <br>A pretty accurate assessment was given by Alistair Cook, who observed the US through British eyes for most of the last century. He said that in the US there was a constant struggle between forces that were powerfully creating a better society, and forces that were causing the decay of civilization. The last time I heard him on TV (5 or more years ago) he thought that the forces of decay might be getting the upper hand. <br> <br>I think it is a pretty near thing.   </p>
