    html: "<p>Is the UK part of Europe? <br> <br>I agree, from my limited and largely anecdotal knowledge, that the situation in European universities and colleges is not so dire as it is over here, but there was a period of creeping American influence at least in UK universities, although this may have abated. It seems to me to be a cultural issue: not so much the ideas but the implementation of ideas within a particular framework. Matha noted in the previous discussion that the French educational system was quite conservative, despite having produced so many radical thinkers. This is a cultural difference between French and American academia, and indicates why the same radical ideas might have a different impact in different countries.</p>"
