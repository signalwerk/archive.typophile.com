    html: <p>[ducking for cover as I enter the thread] <br> <br>Has anyone read Alan Bloom's <a href="http://www.amazon.com/exec/obidos/ASIN/0671657151/qid=1066168854/sr=2-1/ref=sr_2_1/002-1579554-2009616" target="_blank"> Closing of the American Mind</a>? It's somewhat dated by now, but does it have any relevance to this entire discussion? Frankly, I've not read it - I picked up a copy in grad school and it's been gathering dust since. I'm thinking it might be the time to break the spine finally... <br> <br>As far as the current discussion goes though, I'm sure that Dan's right - that there are exceptions in various institutions throughout America - but in my mind Hrant's insight that <i>overall trends are more relevant than exceptions</i> is a good one. <br> <br>I, fortunately or unfortunately, spent two years at the University of Chicago and I wouldn't count it as one of the "exceptions". Seemed plagued by quasi-French-intellectualism. Of course that's a blanket statement which isn't meant to discount everyone there - Jim McCawley (r.i.p.) was perhaps the most amazing thinker I've come into contact with. Always seemed to eschew whichever current trends and styles happened to prevail. After all, who needs Optimality Theory or Minimalism or Government &amp; Binding, when you can have The Syntactic Phenomena of English :-) <br> <br>I must say that I'm disturbed at myself for feeling I have to put disclaimers like that after my (obviously) generalized comments. </p>
