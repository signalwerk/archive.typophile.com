    html: "<p>William: <i>Non-Americans pontificating about America - and I include John Hudson here - often miss large parts of the picture.</i> <br> <br>I do hope I wasn't pontificating, and my agreement with Hrant regarding American anti-intellectualism was heavily qualified by observation of other cultures within the USA. I don't think I said much more than what you report Alistair Cooke saying: 'the forces of decay might be getting the upper hand'. Only a fool would assume that mass media youth culture represents all American culture, but it is important to guage the extent of its impact, which is <i>very</i> considerable. But we're getting away from John Butler's original question regarding academia. <br> <br>Yes, English departments seem to be the worst afflicted, but as reported in the previous thread, even disciplines like geography have accepted the critical theory approach to epistemology. Yes, we all had a good chuckle when physicist Alan Sokal's hoax 'Transgressing the Boundaries: Toward a Transformative Hermeneutics of Quantum Gravity' was accepted for publication in a humanities journal. I was less amused last year when Igor and Grichka Bogdanov successfully published <a href=\"http://golem.ph.utexas.edu/~distler/blog/archives/000017.html\">four physics papers</a> that peer reviewers admitted were incomprehensible and probably  nonsense. But that was in France. <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\"> Over to you Matha.</p>"
