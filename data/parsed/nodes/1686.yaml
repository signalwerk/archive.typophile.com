    html: "<p>On anti-intellectualism in American high schools: <br> <br>Well, on this point I'm prepared to admit that I am wrong about how dominant the anti-intellectual attitude is - but not quite yet. I would like to read more about it, because it doesn't correspond to my experience or that of my children.  <br> <br>If you were in the South - the South does have a reputation for not having the greatest of schools.  <br> <br>My point is if you have friends who are academically good and you have mutual respect with them, the carping of others doesn't affect you much.  <br> <br>If you went to U. of Chicago you were first rate academically, and you may have had the misfortune of not having peers in your high school. <br> <br>My son, for instance, went to a magnet high school for science, such as exists in some major urban areas, and they had as much math as almost any kid could handle. <br> <br>On Wittgenstein (and Austin): <br> <br>It may be that some stuff that they said in linguistics was valuable, though I haven't heard what it is. Their idea that by analysing ordinary language you would disolve philosophical problems was wrong, and that is the heart of their philosophy.  <br> <br>Incidentally, I am not denying that Wittgenstein was a genius and powerful writer. It just that he was fundamentally wrong, and is a dead end path in philosophy.    <br> <br> <br> <br></p>"
