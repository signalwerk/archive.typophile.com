    html: <p>&gt;some amount of salt during reading. <br> <br>Well, since you encourage me I'll be blunt. Wittgenstein made philosophy into a pointless academic game. As I understand it - and you doubtless know more here - the linguists didn't find him particularly innovative in so far as he got on their territory.  <br> <br>The authors of 'Wittgenstein's Poker' in my view did a great disservice to Popper by assuming the conventional view of Wittgenstein as great, so Popper couldn't be right. Incidentally, I think the two authors probably disagree because there are contradictions left the text.  <br> <br>Also by not understanding rightly the poker incident they ended up accusing Popper of lying, which really is not so plausible if you understand really what was going on.  <br> <br>Popper is the real thing - a powerful, innovative thinker on important issues. If you read those amazing essays in 'Conjectures and Refutations' you will see what I mean.  <br> <br> <br> <br> </p>
