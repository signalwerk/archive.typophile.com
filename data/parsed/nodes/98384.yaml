      <p>Oded mentioned Solomon Birnbaum's classic work on Hebrew palaeography. If this is an area of interest, there is now a number of substantial works on the development of mediaeval Hebrew script. Searches on 'mediaeval hebrew manuscript' should come up with good resources.</p>
      <p>Recently, I obtained a copy of Izzy Pludwinski's _Mastering Hebrew Calligraphy_, which seems to me a very good introduction, showing both norms and variations for the principal styles, and a good chapter on how to analyse historical styles.</p>
