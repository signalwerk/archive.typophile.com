    html: <p>The article on the recent history of Hebrew type by Misha Beletsky in the book Language, Culture, Type is a must-read. Ada Yardeni's book <a class="freelinking external" href="http://www.amazon.com/The-Book-Hebrew-Script-Palaeography/dp/1584560878" rel="nofollow">The Book of Hebrew Script</a> is a review of the whole scribal history of different hands. I'm sure there is a lot in Hebrew [Yardeni's book is originally in Hebrew], but my Hebrew is not good enough to have read that literature. There is a lot now on Pinterest also.</p>
