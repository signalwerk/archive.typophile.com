    html: |-
      <p>My additions to the list:</p>
      <p>L.F. Toby. The Art of Hebrew Lettering. (כתב אמנותי עברי.) , Rolf Schuster, Holon, Israel, 1973 (first ed. 1951).</p>
      <p>Spitzer, Moshe. The Development of Hebrew Lettering.  Offprint from Ariel, A Review of Arts and Letters in Israel. No. 37, 1974. (Printed for The Typophiles, New York.)</p>
      <p>The Hebrew Book, Keter Publishing House Jerusalem Ltd. / Leon Amiel Publisher, 1975.</p>
      <p>Marks, Kara. The Handbook of Hebrew Calligraphy. Jason Aronson Inc. 1990.</p>
      <p>Berry, John D. (Ed.).Language Culture Type. ATypI / Graphis. 2002. See the article Ẓvi Nerkiss and Hebrew Type Design by Misha Beletsky.</p>
      <p>I would recommend all of these highly. I have also read and would recommend most of what was posted by Oded Ezer.</p>
      <p>You can also find other books about Hebrew calligraphy. This knowledge will come in handy in type design, giving you a deeper understanding of the letters. Also reading about type design for other languages (and practicing some of these) will help when you get back to Hebrew. Hope this helps!</p>
