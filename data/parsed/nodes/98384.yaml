      <p>An essential book on Hebrew type and design is by Ismar David. Anyone who seeks great books on Hebrew type and design should get it.  My copy belongs to Ari Davidoff (I lost my copy); Ari, you'll get back soon.</p>
      <p>Another great collection is by his main "secretary", xxx xxx (I forget her name now), and type expert, Sol Malkoff. I will post it soon. The collection is like Ismar David's book: great Hebrew type samplers, some from wood type. Many of Hebrew wood designs have been lost. So, this collection is very important. Also, great articles by Malkoff.</p>
