    html: |-
      <p>TypeTool doesn't allow to create new empty glyph slots, but it can be done using a little trick.</p>
      <p>Copy and then paste any existing glyph. TT will ask if you want to keep the replaced glyph. Do so, and the glyph will be added to the font, the glyph name being suffixed ".001". Then rename the new glyphs as needed, in your example you would need d.ordn, h.ordn, n.ordn, r.ordn, s.ordn, t.ordn and/or their uppercase counterparts D.ordn &amp;c.</p>
      <p>You cannot write the OT feature code to switch to ordinals in TypeTool, but you could add the features using Adobe FDK later.</p>
      <p>Cheers,<br>
      Jens.</p>
