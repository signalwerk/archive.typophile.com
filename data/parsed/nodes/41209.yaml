    html: |-
      <p>Of course you can add new glyph slots in TypeTool. Just open your current .enc (Encoding) file in a plain-text editor (or make a new copy of that file first) and add the glyphnames you need. Restart TypeTool and the glyph slots will be available. </p>
      <p>You can use the free Microsoft VOLT or Adobe FDK for OpenType tools to add OpenType Layout features to your font. </p>
      <p>The FontLab Studio 5 user manual (and I think also the TypeTool manual) contains a section on glyph naming and encoding. </p>
      <p>Regards,<br>
      A.</p>
