  html: |-
    <p>I'd like to add ordinal capitals to my font, but I can't find where they are put in TypeTool 3's font table. They can either be set glyphs - ST, ND, RD, TH etc. or a full set of superscript letters - A to Z. I only need uppercase as my font is a titling face.</p>
    <p>I've tried all the default layouts. For the most of the work I've been using Adobe OT PS standard names (CFF) as I want to output to OpenType.</p>
    <p>Perhaps it's not possible to add the ordinal caps in TypeTool which has basic OpenType table support. Can I not add custom glyphs?</p>
    <p>Anybody else come up against this, or overcome it in TypeTool?</p>
