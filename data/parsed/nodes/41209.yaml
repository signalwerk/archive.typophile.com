      <p>Good stuff! Thanks Jens. I've actually noticed that new slots get created this way having deleted a few erroneous ones that appeared at the end of the set. I didn't think they'd be what I needed for this. I'll try this later on today.</p>
      <p>I wonder if there's a guide/resource for the correct glyph names anywhere? There are a few I might consider adding if I had a set of names.</p>
      <p>Mark.</p>
