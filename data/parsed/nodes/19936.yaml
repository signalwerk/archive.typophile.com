    html: |-
      <p>Looks like someone did a little work on Apple's <a href="http://www.myfonts.com/fonts/apple/capitals/" target="new" rel="nofollow">Capitals</a> since it defies convention of typical handtooled typefaces.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/capitals_georgia_4534.png"></div><p></p>
      <p>Take for instance ITC Century Handtooled. Notice where the inline is on the right diagonal stroke of the cap A.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/ITC_cent-handtld_6166.png"></div><p></p>
      <p>Now, why would a type designer put the inline on the <em>THIN</em> stroke of the cap A????<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/georgia_detail_4595.png"></div><p></p>
