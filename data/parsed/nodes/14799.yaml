      <p>Kyle,</p>
      <p>Thanks. There will be a tad bit of overprinting happening, but I'm going to discuss this in depth with the printer. He's a two-color specialist and I trust his opinion.</p>
      <p>When I flatten transparecy however, the colors go haywire. In overprint preview they are much closer to the pantone chips. I wanted to be able to replicate that for on screen viewing by Typophiles and client.</p>
      <p>I ended up doing it the hard way: taking a screen capture as PNG and then cropping the canvas in Photoshop. Yuck. Anyway, the result is in this thread where I'm currently soliciting feedback:</p>
      <p><a href="http://typophile.com/node/14500" title="http://typophile.com/node/14500">http://typophile.com/node/14500</a></p>
      <p>Swintex,</p>
      <p>Same was true for Web Export. While the overprints/transparencies were there, the colors just looked WAY off.</p>
