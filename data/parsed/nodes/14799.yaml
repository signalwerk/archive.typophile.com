  html: |-
    <p>Hi -- Just setting up overprinting options in Illustrator CS2 and viewing them with Overprint Preview. Is there a way to export these so I can post them to Typophile and still retain the overprint effects?</p>
    <p> -t</p>
  html_clean: |-
    <p>Hi -- Just setting up overprinting options in Illustrator CS2 and viewing them with Overprint Preview. Is there a way to export these so I can post them to Typophile and still retain the overprint effects?</p>
    <p> -t</p>
comments:
