    html: |-
      <p>What you need to do is make a copy, then 'flatten transparency'. When you do, uncheck the 'preserve overprint' option. This will give you a CMYK conversion of what Illustrator thinks the overprint will look like.</p>
      <p>One word of caution: If you are actually going to be overprinting solid inks, you might not want to take the 'illustrator' preview of that to seriously. Its very hard to simulate something the mixing of the inks. Although, it can serve many other purposes.</p>
