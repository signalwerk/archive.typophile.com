    html: <p>On am Mac you can access these characters from the Character Pallette in the Keyboard menu (usually displayed as a little flag in the menu bar). select from the popup menus in the pallette View&gt;Glyph and Font&gt;whatever font you're trying to access these hidden glyphs from. Then scroll through the display frame and double click on the character you want to enter into your active text insertion point on the next window below. Entering characters this way can crash some older programs, but works fine with Text Edit. Sometimes you can copy/paste from there, but that won't always work with some other programs. They can be fussy..</p>
