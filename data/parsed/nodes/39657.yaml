  html: |-
    <p>In PoeticaStd and several other OpenType Adobe fonts I've been looking at lately, there are several glyphs that have no Unicode mapping (they aren't listed in the font's internal 'cmap' table)</p>
    <p>For instance, glyph index 977 (0x3D1) has no Unicode mapping. The only reason I'm aware that it exists is because I was looking up the glyph indexes in the OpenType 'ordn' feature and it lists index 977 as a replacement for index 66 (which has a Unicode mapping of U+0061).</p>
    <p>So I guess my question is, is there any way (outside of InDesign or other OpenType 'aware' programs) that I can type in a keystroke and access this glyph?  Or perhaps it's intentional that these glyphs aren't allowed to be accessed that way?</p>
    <p>Thanks for any help!</p>
