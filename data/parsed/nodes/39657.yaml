      <p>Unfortunately, the Windows CharMap utility only shows glyphs which are mapped/accessible by a Unicode character (or by a character in a specific encoding).</p>
      <p>What I'm specifically referring to is how to access glyphs which have no character mapping defined in the OpenType font.</p>
