    <p>The organisers committee of the New Cyrillic 2012 type competition has announced extended submission date. They are glad to receive participants works up to 31 December 2012 23:59 Moscow Time.</p>
    <p>New Cyrillic 2012 is a Cyrillic type competition for young type designers (under 35 years old). The total prize fund for 3 places 600&nbsp;000 Russian roubles (€15&nbsp;000). More information, submission details could be found at <a class="freelinking external" href="http://newcyrillic.ru" rel="nofollow">http://newcyrillic.ru</a></p>
    <p><img src="http://ic.pics.livejournal.com/type_family/9418597/463/463_original.jpg" alt="new cyrillic 2012"></p>
