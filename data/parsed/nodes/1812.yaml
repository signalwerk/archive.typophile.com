    html: <p><i>&gt; Can you point me in the direction of any others that  <br>are similar?</i> <br> <br>I don't know if you've heard of Herman Zapf's <a href="http://www.myfonts.com/products/linotype/zapfino-cd/" target="_blank"> Zapfino</a>. <br>This is about the closest you'll get to digital calligraphy  <br>this elaborate.</p>
