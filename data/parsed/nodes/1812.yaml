    date: 2003-10-26T10:03:00
    date_raw: 26.Oct.2003 10.03am
    votes: null
    html: <p>It is almost certainly not a font, but hand lettered. The o and v link together as a ligature in a unique way, and the e is clearly designed to only work at the end of a word, and the L is one that could only work at the beginning of a word. <br> <br>It would be possible to do something like this in an OpenType font, but only a couple of OpenType script typefaces have been done that are so elaborate, and this isn't one of them. <br> <br>Regards, <br> <br>T</p>
