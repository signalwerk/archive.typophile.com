      <p>I think I speak for everyone when I say that it's quite difficult to respond to your many in-depth questions given how little developed the typeface is right now. The image you've shown is very crude and it's very hard to imagine what this typeface would look like in the end. There are needs for almost any type of face, but I would go ahead and rough this out much further before presenting it for such specific critique.</p>
      <p>Best of luck.</p>
