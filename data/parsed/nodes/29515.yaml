    html: <p>I have a compaq presario V2000, AMD sempron notebook with XP. I only had 512mb of ram with shared video memory and Fontographer 4.1 ran fine. I just added a 1G memory stick so I now show 1.12G of ram and Fontographer still runs fine. Maybe, if you install and run F4.1 with 512 and then add memory, it will still work. Perhaps, someone else can try.</p>
