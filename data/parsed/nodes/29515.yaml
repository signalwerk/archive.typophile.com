  html: <p>is there any way to get <a href="/wiki/fontographer" class="freelinking">fontographer</a> 4.1 installed properly on a windows xp pro sp2 os.  i keep geting an error message that the program cannot be initialized - not enough memory.  the machine has 1 gig of memory more than twice that of my 98 machine.  there was no problem installing it on that.</p>
