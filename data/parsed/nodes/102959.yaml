      <p>Bill: <em>A different issue, but which is illustrative, is that I read that native Hebrew speakers and readers have a 'root form' area in the brain. I would imagine that this is also true in other Semitic languages.</em></p>
      <p>Yes. Arabic, like Hebrew, has a triconsonantal root system for most nouns and verbs. This presumably is one of the reasons why abjad systems works fairly well for Semitic languages: one can easily identify words of a shared root by their consonant sequences independent of intermediary vowels, which may be either absent or written as marks around the consonants.</p>
