      <p>Having now read some of the article, my main concerns are with the form of Arabic used to display the word stimuli to participants. This isn't entirely clear from the article description, and no illustration is provided of the actual stimuli as presented. But this table shows examples of the different classes of stimuli words, and my concern is that this also represents the form of Arabic shown to participants in the experiment.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/stimuli_5371.png"></div><p></p>
      <p>Now, because the experiment is comparing results for stimuli within a single style of Arabic text, the fact that this is a very flat font using Simplified Arabic forms that fails to represent traditional Arabic letter shaping and joining behaviour isn't necessarily problematic in terms of what the researchers were testing for. More problematic, I think, is the very poor spacing shown in this table, in particular the lack of kerning for non-connecting pairs in the PCw and NCw examples. If this accurately represents the stimuli as shown to participants, then the test may have a significant flaw, because the words as thus displayed are abnormal, and do not reflect normal written or good quality typographic practice. Of course, Arab readers are sometimes presented with text that lacks kerning, just as English readers are, but finding a significant advantage for Cw stimuli in badly spaced text is not the same as finding a general advantage.</p>
      <p>[Spacing is also very bad within the Cw stimuli as shown in the table. Basically, this is a very bad font. But since the nature of the spacing problems affect connecting and non-connecting sequences in different ways, I don't think they cancel each other out.]</p>
