      <p>I would be shocked if they used "bouma". I would also be surprised to see psychology researchers successfully extrapolate the findings to practical type design decisions. That's our job.  :-)</p>
      <p>If reading connected Arabic is indeed faster* than disconnected Arabic -especially for skilled readers- I feel even more confident that what I call boumas are the key to reading (as opposed to Larson's parallel letterwise decipherment). But "confident" does not mean "dead sure".</p>
