      <p>Good news. Not at all surprising.  :-)</p>
      <p>The way this fits into my own model of reading is that compound shapes -even though they are harder to extract the constituent letters from- are "closer" to the content being conveyed, hence more efficient. And we can handle many more shapes than the few dozen of most writing systems.</p>
      <p>Specifically concerning ligation, I mentioned such potential benefits as part of my "Designers of the World, Ligate!" talk at the Thessaloniki conference of 2004, and on Typophile even previous to that.</p>
      <p>hhp</p>
