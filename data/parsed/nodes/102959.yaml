    html: <p>No, Ben, it isn't using a disconnected variant of the Arabic script, it is comparing Arabic words in which all the letters are connected with those in which only some letters are connected and those in which no letters are connected. This is a natural phenomenon within the normal Arabic orthography, arising from the fact that some Arabic letters only join on the right side, so exist only in isolated and final forms. [This is why the common statement one encounters that the shape of an Arabic letter depends on its position in a word is not accurate. The shape of an Arabic letter depends on its immediate adjacency.]</p>
