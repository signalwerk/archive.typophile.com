      <p>I don't know Arabic script, but I think it is possible that in a script whose basic form is connected, like Arabic, or in a different way various Indic scripts, is read most easily in a connected form. But it may also be that one whose basic form is unconnected, like latin or Hebrew, is read most easily unconnected. At least to me all latin cursive forms are less readable than the separate ones. —And I think that ligatures in an unconnected script are a compromise. </p>
      <p>The brain is quite capable of developing a different processing structure for a different script. A different issue, but which is illustrative, is that I read that native Hebrew speakers and readers have a 'root form' area in the brain. I would imagine that this is also true in other Semitic languages. In English, which has roots from many different languages, we generally don't have an awareness of roots. </p>
      <p>By the way, I don't see why the 'bouma' in Hebrew has to be any worse than English. Or Chinese. At least in Peter's conception, the visual word form is a matter of the pattern of 'role units', salient features of letters, across the word, not simply external envelope. </p>
      <p>Chinese children learning a few characters a day through elementary school, in a language they already understand aurally, is not a huge difficulty, though it takes diligence. And they tell me that after the first 2000 it gets easier. Trying to learn both language and characters as an adult is unfortunately extremely time consuming. So my impression is that the literacy barrier is much higher for adult foreigners than natives.</p>
