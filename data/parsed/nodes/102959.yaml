      <p>[Hrant] <em>[…] if we -consistently- used an "st" ligature in "quest" but not one in "guest", that would help […] </em></p>
      <p>[John Hudson] <em>Can we please stop talking about boumas as if they're something that exist in a script or in a typeface. A bouma is a perceptual unit: it exists in the perception, not in the thing perceived. </em></p>
      <p>If we take our cue from the Arabic, a better strategy for diverging the boumas might be to ligature the &gt;gu&lt; bigram in &gt;guest&lt; at the top between the &gt;g&lt; and &gt;u&lt; and to extend to right the bottom serif on the descender of the &gt;q&lt; in &gt;quest&lt; so it undercuts the u. One could also extend the left-side of the tail of the g to the right. The perturbation at the left end of the word would cue the visual system to where the distinguishing visual information lies.</p>
      <p>I do think boumas are real, and that in immersive reading the visual system uses them. A word is a spatially bounded map — bou[nded]ma[p] — of prototypically structured sub-letter shapes or letter-shape primitives. I like to call these letter-shape primitives role-units. Ascenders, descenders, bowls and counters are role-units. The composite shape to the left of the stem in the u is a role-unit. The angular components of the x are role-units. It seems likely to me that the surface form of a role-unit in a letter in a typeface in a script can be modified while it’s prototypical or deep-structure is kept.</p>
