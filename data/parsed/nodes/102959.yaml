      <p>Peter: <em>Although meaning relations in western languages don't work on a system of shared consonantal roots, readers of the western alphabetic scripts can more easily identify words when vwls are left out than they can when only _o_e_s are written.</em></p>
      <p>I think that is simply an observation that language is predominantly a consonantal affair, which makes sense because we can produce more clearly distinct consonant phonemes than vowels, and consonants sounds are fairly precise while vowel sounds are fluid. If we had vocal systems that worked the other way round, so favoured vowel sequences as the main means of distinguishing words, we would presumably have developed writing systems with more vowel signs, and would find vowel-only writing to be easier to read than consonant-only writing.</p>
