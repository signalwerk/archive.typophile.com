      <p>William, note that the connections in Latin are mostly brute-force, while in Arabic they generally affect the shape of the letter, thus effectively providing more information.</p>
      <p>To repeat something I've said now and again: aesthetic ligation is irrelevant to reading, but judicious ligation intended to reinforce/diverge boumas can help. The example I like to give is this: if we -consistently- used an "st" ligature in "quest" but not one in "guest", that would help.</p>
      <blockquote><p>I don't see why the 'bouma' in Hebrew has to be any worse than English.</p></blockquote>
      <p>It's because the farther from the fovea a bouma occurs (noting the/my view that more than half of reading happens in the parafovea) the blurrier it gets, which makes internal information less important than envelope information. This is by far the biggest reason I can think of for the Latin x-height to be too large sometimes, and for all-caps text to be harder to read.</p>
      <p>So yes, it's not only external envelopes that matter, but those do play a big role.</p>
      <p>hhp</p>
