      <p>John, assuming that font is in fact the one used in the actual experiments:<br>
      - It's actually the sort of thing most Arabic readers see most of the time. Well, not the poor spacing as much but the "flatness". Back when I was still living in Lebanon -typographically the most advanced Arab nation- newspapers, textbooks, etc. mostly used that style, and I think that's still mostly true. So saying the font might invalidate the results I don't think makes sense.<br>
      - I would say that the bad typography -especially the spacing- can only <em>reinforce</em> the findings! If as you say "properly" set Arabic is more readable (which I agree in terms of spacing but am less sure in terms of "script grammar") then the idea that boumas bypass letterwise decipherment (where necessary/possible) can only be helped with better typesetting.</p>
      <p>BTW was the reading in the experiment foveal only, or what I might call "full-spectrum"? If it was the former then Peter's view that we read boumas even in the fovea becomes stronger (and Larson's view becomes even weaker).</p>
      <blockquote><p>I'd imagine any script is less readable when its orthography is corrupted.</p></blockquote>
      <p>Not necessarily. I think the letterwise-decipherment model says that when the letters are individually decipherable (since people do know them individually) reading should not suffer. Note that any Arabic letter does occur in normal text disconnected on both sides.</p>
      <p>Also, if the experiment was foveal-only, we're not really talking about "readable", but more like "decipherable". But if boumas are showing up even in mere decipherment, they must be running rampant in immersive reading.</p>
      <p>hhp</p>
