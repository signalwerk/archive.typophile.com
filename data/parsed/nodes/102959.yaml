      <p>In the concluding discussion of the paper, the authors note that </p>
      <blockquote><p>Another factor that might explain these results are the differences in the physical shape of the orthographic patterns of the written words. Indeed, the Cw have no spaces between the letters while such spaces exist inside the NCw. These spaces may contribute, at least partly, to the time consumption during the visual processing of the NCw, due for instance to longer gaze duration (Roman and Pavard 1987), higher number of fixation/saccades etc.</p></blockquote>
      <p>In other words, they acknowledge that their results may be affected by the internal spaces in the non-connected sequences, although they do not register that the size of these spaces might be a factor. They go on, rightly, to suggest that this would need to be independently tested using eye tracking methodology. They also suggest that differences in spatial frequency between connected and unconnected sequences might be a factor:</p>
      <blockquote><p>...it is possible to assume that NCw words are of a higher SF than Cw words and thus at least some of these differences might be explained by such physical differences.</p></blockquote>
      <p>And this is the actual conclusion drawn by the authors of the study:</p>
      <blockquote><p>The data presented here show for the first time that words’ connectivity does not impact negatively reading and word recognition processes in skilled readers of Arabic. Our analysis shows that processing connected letter forms, which are standard and inevitable in written Arabic, does not present any particular difficulty. However, further research still needed to investigate how the effects observed here compare really to word frequency and to spatial frequency effects among readers of Arabic.</p></blockquote>
      <p>In other words, their results show that connected script does not have a negative impact on word recognition for experienced readers -- and that is really interesting and contrary to much prediction or assumption --, but the apparent positive advantage <em>cannot</em> be definitely explained as a result of connectivity independent of other factors.</p>
