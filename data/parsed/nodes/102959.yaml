      <p>Peter: <em>...prototypically structured sub-letter shapes or letter-shape primitives. I like to call these letter-shape primitives role-units. Ascenders, descenders, bowls and counters are role-units.</em></p>
      <p>Part of the genius of the Perso-Arabic script is that it classifies some sub-letter shapes as preservable and some as dispensable, such that the graphotactics of Arabic writing largely involve replacing the dispensable parts of letters with connecting strokes that join together the preservable parts. A large number of Arabic letters, in their isolated forms, consist of a preservable initial shape and a dispensable tail. When the letters are joined, the tail stroke is replaced with a connecting stroke. This is the general rule; there are, of course, exceptions, some particular to individual styles and mostly involving cursive construction of dual-joining (medial) forms. So for example, the general pattern can be observed in the graphotactics of isolated, initial and final ع, but the medial form represents a cursive construction derived from the preservable part but visually disinct in result.<br>
      ____</p>
      <p>PS. Simplified Arabic can be analysed as applying the general pattern more strictly, such that many of the cursive formations of medial letters are replaced by straight duplications of the initial form preservable part.</p>
