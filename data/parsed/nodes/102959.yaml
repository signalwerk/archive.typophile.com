      <p><a class="freelinking external" href="http://clic.ub.edu/sites/default/files/pagines/IOVS%20%282012%29%2053%289%29%205452-5461.pdf" rel="nofollow">Here</a> is a pretty interesting effort to compare reading speeds in different languages, including those with latin script and Hebrew, Arabic, Chinese and Japanese. It turns out to be a bear of a problem. </p>
      <p>The authors compare rates of reading letters, words, syllables, and whole texts. The problem is that some languages have a lot more letters (Finnish) or syllables. So, for example, English and Spanish seem to be at the top for words per minute, but Chinese, which is slow in words per minute, is faster for reading a whole text, because of the economy of Chinese in terms of words needed to express the same thought—it's not a conjugated language, for a start. </p>
      <p>I don't know what to make of this. There do seem to be differences in decoding text, but their influence may be swamped by other factors. It may be that the cognitive constraints are much more significant than visual decoding ones.</p>
