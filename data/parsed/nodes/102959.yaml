      <p>@John Hudson:<br>
      <cite>The authors of <strong>that</strong> study explained this result in terms of the complexity of the Arabic orthography. Since they're cognitive psychologists, I doubt if they have any problem realising how powerful our brains are, and they don't appear to have a bias towards 'looking more western': they were comparing two Semitic scripts.</cite></p>
      <p>I find that conclusion highly unwarranted. If Hebrew shares a characteristic with English/Swedish/French and so on that Arabic does not, a bias towards the Latin script as the paradigm for writing systems would also favor those Semitic scripts which more closely resemble it.</p>
      <p>And researchers are biased towards easily testable and falsifiable explanations which don't involve attributing mysterious powers to the human brain.</p>
      <p>My biases tell me that the bouma is likely to be the source of the observed phenomenon, and they also tell me that a short learning curve is <em>also</em> an important virtue in a script. (The Chinese script does inflate the cost of mass literacy so that it's only achievable by First World countries like Japan; that, at least, is indisputable. Or is it? In some quarters, claims by the People's Republic to have achieved universal literacy are accepted.) Thus, even if the Arabic script is superior for the skilled reader, it's not sufficient reason to switch.</p>
      <p>At least, the Turks switched to the Latin script, which, because it has lowercase with ascenders and descenders, also has quite a bit of bouma in its words. </p>
      <p>Yet, both the Jewish people and those Asians influenced by Chinese culture have been distinguished by their success, even under adverse conditions. Despite Hebrew being low on bouma and legibility, and Chinese being low on bouma and having a high learning curve. As I've noted, I think the <em>bar mitzvah</em> and the Imperial civil service examinations are the explanation - in both cases, literacy is tied in with cultural identity, and so sitting still for education conflicts less with the emotions of the hot-blooded youth.</p>
