  html: |-
    <p>I know I've seen this before but I can't pin it down. It's geometric but the bold pointy A, M, and N rule out Futura or FB Nobel. The G is pretty close to Verlag Bold, but the D is slightly angled in Verlag. Is it Neutraface No. 2? A different Nobel?</p>
    <p>Sorry about size of samples, it's all I got in the email sample.</p>
