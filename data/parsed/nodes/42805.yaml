    <p>Hi guys,</p>
    <p>we are about to create a new identity for a new luxury website named<br>
    “LOXORIA”. Right now we are in the search for an adequate font for<br>
    our logo to represent the luxurious philosophy.</p>
    <p>How do you think about <a class="freelinking-external" href="https://web.archive.org/web/20080709012509/http://www.fontshop.com/fonts/singles/linotype/optima_demi_bold/?sample_text=LOXORIA">Optima</a>,<br>
    <a class="freelinking-external" href="https://web.archive.org/web/20080709012509/http://www.fontshop.com/fonts/singles/monotype/perpetua_titling/?sample_text=LOXORIA">Perpetua Titling</a>, <a class="freelinking-external" href="https://web.archive.org/web/20080709012509/http://www.fontshop.com/fonts/singles/fontfont/ff_meta_serif_book/?sample_text=LOXORIA">Meta Serif</a> or <a class="freelinking-external" href="https://web.archive.org/web/20080709012509/http://www.fontshop.com/fonts/singles/fontfont/ff_utility_ot_regular/?sample_text=LOXORIA">FF Utility</a>?</p>
    <p>Other suggestions?</p>
    <p>The content and concept of the site can be compared with<br>
    <a class="freelinking-external" href="https://web.archive.org/web/20080709012509/http://www.robbreport.com/">Robb Report</a></p>
    <p>Thanks for you help. Best regards, Franz</p>
