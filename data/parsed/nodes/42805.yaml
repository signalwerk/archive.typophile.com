      <p>“There is no additional charge for companies under $5 million (US Dollars) in annual gross revenue. If the logo has a specific application for a business within another company, then use the estimated gross revenue for that venture. For example a logo for a major motion picture would be priced on the movie gross, not the studio gross.<br>
      $5 million to $10 million: $5000<br>
      $10 million to $50 million: $10,000<br>
      $50 million and over: $15,000”</p>
