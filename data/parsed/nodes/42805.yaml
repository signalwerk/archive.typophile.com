      <p>I’d say the most expensive typeface you can buy would sum up ’luxury’ regardless of what it actually looks like.</p>
      <p>Maybe have a custom typeface design commissioned, cast it in gold, letterpress print it, then use THAT as the logo.</p>
      <p>“but the licensing fee that has to be paid for using their fonts for a logo. It is about US$ 2,500 to 3,000 dollars.”</p>
      <p>Hmm...that’s unusual, isn’t it?</p>
      <p>That said, I went and dug out the info on their site:</p>
      <p><a href="https://web.archive.org/web/20080709012509/http://www.houseind.com/index.php?page=licensing&amp;section=pricing" title="http://www.houseind.com/index.php?page=licensing&amp;section=pricing">http://www.houseind.com/index.php?page=licensing&amp;section=pricing</a></p>
      <p>It appears that your company has to bring in at least 5 million annually before you have to pay a license for use in a logo, starting at 5k.</p>
      <p>I do find that a bit of an odd contingency.</p>
