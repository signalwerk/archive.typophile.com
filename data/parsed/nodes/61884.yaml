      <p>Which version of Indesign? CS4 allows positioning of InDesign documents within InDesign. So if I get you right, you could make one "container" document with a frame that respects the printer margins, &amp; position your original document inside that, like you would an image, scaled to 95% or whatever. Then export new PDF, voilà.</p>
      <p>That, or select everything, group, and scale while holding down the Shift and Apple keys (dunno how that works on Windows – probably with Ctrl?). That even scales down type, too.</p>
