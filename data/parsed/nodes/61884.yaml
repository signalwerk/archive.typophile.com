      <p>In my opinion, keep the document with your original dimensions in InDesign. And while exporting the PDF go to Mark and Bleed options and enable crop and bleed marks.</p>
      <p>So, when you print the document with manual settings you will automatically get bleeding margins on all the sides, which you can cut &amp; implement later on.</p>
      <p>NitinGarg, Communication Designer. / <a href="http://designjunction.in" title="http://designjunction.in">http://designjunction.in</a></p>
