      <p>@evanbrog:</p>
      <p>Setup and finish the version with bleeds and print the final design to PDF with marks and bleeds. Open a copy of that PDF in Acrobat Pro and select 'Crop Pages' from the 'Document' menu. Select the option to show the 'trimbox'. This will automatically set the margins in cropping area. Click OK to crop.</p>
      <p>With the PDF now cropped to the trim size you can print from Acrobat with 'Page Scaling' set to 'Fit the Printable Area'. Any scaling that is required will be handled automatically.</p>
