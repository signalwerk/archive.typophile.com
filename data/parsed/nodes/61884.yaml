    <p>I got a problemo..</p>
    <p>I have tons and tons of flyers I need to create. Some might be professionally printed, with a bleed. Some might be printed manually on normal, desktop inkjets, and so they will not need a bleed.</p>
    <p>Is there a practical way to scale a document that I've created in InDesign so that it prints on a normal printer within its standard margins? </p>
    <p>I don't think it's practical to redesign every piece for two purposes, there are too many. Can I convert the fonts to outline in InDesign and scale the whole thing as a group, so that it will print on the inkjets? (I would, in this case, create a background under all the other elements at the final size necessary).</p>
    <p>Or export the bleed-version as a PDF, and scale it down 95% or so in Photoshop and re-save it?</p>
    <p>I'm not so concerned with a difference between the elements and their closeness to the edge between versions, just that everything looks good &amp; crisp.</p>
