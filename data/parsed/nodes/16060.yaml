    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/17745" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Designers</a>&nbsp;: Robert&nbsp;Slimbach</strong></p>
    <p>Robert Slimbach (1956-) is the award-winning designer of many typefaces. He started his career in the early 1980s with Autologic. He then did freelance type design for a couple of years, producing <span class="caps">ITC</span> Slimbach and <span class="caps">ITC</span> Giovanni. All his work since then has been for <a href="/node/16058" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Adobe Systems</a>. A brief biographical article about Slimbach can be found from the <a href="http://store.adobe.com/type/typedesign/slimbach.html"> Adobe&nbsp;website.</a> </p>
    <p>Among his designs are:<br>
    Adobe Garamond <a href="http://store.adobe.com/type/browser/P/P_1737.html">Premier Pro</a> and <a> Premier Pro Opticals</a><br><a href="http://store.adobe.com/type/browser/P/P_1725.html">Caflisch Script Pro</a><br><a href="http://store.adobe.com/type/browser/P/P_1062.html"><span class="caps">ITC</span> Giovanni Std</a><br><a href="http://store.adobe.com/type/browser/P/P_1081.html"><span class="caps">ITC</span> Slimbach Std</a><br>
    Adobe Kepler <a>Text</a> and <a href="http://store.adobe.com/type/browser/P/P_1431.html">Opticals</a><br><a href="http://store.adobe.com/type/browser/P/P_1706.html">Adobe Myriad Pro</a><br><a href="http://store.adobe.com/type/browser/P/P_1439.html">Adobe Poetica Std</a><br>
    Adobe Sanvito Pro <a href="http://store.adobe.com/type/browser/P/P_1730.html">Text</a> and <a href="http://store.adobe.com/type/browser/P/P_1731.html">Opticals</a><br>
    Adobe Utopia Std <a href="http://store.adobe.com/type/browser/P/P_1414.html">Text</a> and <a href="http://store.adobe.com/type/browser/P/P_1415.html">Opticals</a><br>
    Adobe Warnock Pro <a href="http://store.adobe.com/type/browser/P/P_1709.html">Text</a> and <a href="http://store.adobe.com/type/browser/P/P_1710.html">Opticals</a><br>
    Adobe Jenson Pro <a>Text</a> and <a href="http://store.adobe.com/type/browser/P/P_1716.html">Opticals</a><br>
    Cronos <a href="http://store.adobe.com/type/browser/P/P_1733.html">Text</a> and <a href="http://store.adobe.com/type/browser/P/P_1734.html">Opticals</a><br>
    Adobe Brioso Pro <a>Text</a>, <a href="http://store.adobe.com/type/browser/P/P_1504.html">Opticals</a> and <a href="http://store.adobe.com/type/browser/P/P_1505.html">Poster</a></p>
    <p><em>Upcoming Typefaces</em><br><a href="http://typophile.com/node/30223">Arno Pro</a><br><a href="http://blogs.adobe.com/jnack/2006/12/whats_up_with_the_icon.html">Gauge</a></p>
    <p><a href="http://en.wikipedia.org/wiki/Robert_Slimbach">Robert Slimbach on&nbsp;Wikipedia</a></p>
