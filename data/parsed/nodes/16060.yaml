    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Designers" class="freelinking" rel="nofollow">Designers</a> : Robert Slimbach</strong></p>
    <p>Robert Slimbach (1956-) is the award-winning designer of many typefaces. He started his career in the early 1980s with Autologic. He then did freelance type design for a couple of years, producing ITC Slimbach and ITC Giovanni. All his work since then has been for <a href="/wiki/Adobe%20Systems" class="freelinking" rel="nofollow">Adobe Systems</a>. A brief biographical article about Slimbach can be found from the <a href="http://store.adobe.com/type/typedesign/slimbach.html" rel="nofollow"> Adobe website.</a> </p>
    <p>Among his designs are:<br>
    Adobe Garamond <a href="http://store.adobe.com/type/browser/P/P_1737.html" rel="nofollow">Premier Pro</a> and <a> Premier Pro Opticals</a><br>
    <a href="http://store.adobe.com/type/browser/P/P_1725.html" rel="nofollow">Caflisch Script Pro</a><br>
    <a href="http://store.adobe.com/type/browser/P/P_1062.html" rel="nofollow">ITC Giovanni Std</a><br>
    <a href="http://store.adobe.com/type/browser/P/P_1081.html" rel="nofollow">ITC Slimbach Std</a><br>
    Adobe Kepler <a>Text</a> and <a href="http://store.adobe.com/type/browser/P/P_1431.html" rel="nofollow">Opticals</a><br>
    <a href="http://store.adobe.com/type/browser/P/P_1706.html" rel="nofollow">Adobe Myriad Pro</a><br>
    <a href="http://store.adobe.com/type/browser/P/P_1439.html" rel="nofollow">Adobe Poetica Std</a><br>
    Adobe Sanvito Pro <a href="http://store.adobe.com/type/browser/P/P_1730.html" rel="nofollow">Text</a> and <a href="http://store.adobe.com/type/browser/P/P_1731.html" rel="nofollow">Opticals</a><br>
    Adobe Utopia Std <a href="http://store.adobe.com/type/browser/P/P_1414.html" rel="nofollow">Text</a> and <a href="http://store.adobe.com/type/browser/P/P_1415.html" rel="nofollow">Opticals</a><br>
    Adobe Warnock Pro <a href="http://store.adobe.com/type/browser/P/P_1709.html" rel="nofollow">Text</a> and <a href="http://store.adobe.com/type/browser/P/P_1710.html" rel="nofollow">Opticals</a><br>
    Adobe Jenson Pro <a>Text</a> and <a href="http://store.adobe.com/type/browser/P/P_1716.html" rel="nofollow">Opticals</a><br>
    Cronos <a href="http://store.adobe.com/type/browser/P/P_1733.html" rel="nofollow">Text</a> and <a href="http://store.adobe.com/type/browser/P/P_1734.html" rel="nofollow">Opticals</a><br>
    Adobe Brioso Pro <a>Text</a>, <a href="http://store.adobe.com/type/browser/P/P_1504.html" rel="nofollow">Opticals</a> and <a href="http://store.adobe.com/type/browser/P/P_1505.html" rel="nofollow">Poster</a></p>
    <p><em>Upcoming Typefaces</em><br>
    <a href="http://typophile.com/node/30223" rel="nofollow">Arno Pro</a><br>
    <a href="http://blogs.adobe.com/jnack/2006/12/whats_up_with_the_icon.html" rel="nofollow">Gauge</a></p>
    <p><a href="http://en.wikipedia.org/wiki/Robert_Slimbach" rel="nofollow">Robert Slimbach on Wikipedia</a></p>
