      <p>My <a href="http://www.adobe.com/type/browser/landing/hypatia/hypatia.html" rel="nofollow">Hypatia Sans</a> is a humanist/geometric sans which has a slanted "e" as an alternate. If you're using InDesign CS2/CS3 this can be accessed by applying stylistic set #7. (Hypatia Sans is currently available only as a registration incentive for Creative Suite 3 apps.)</p>
      <p>Cheers,</p>
