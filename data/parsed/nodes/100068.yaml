      <p>I'm not sure if you are still looking for a critique, but here is mine. </p>
      <p>At first glance the font didn't  impress me, but the more I looked at it the more I liked it. I like that the K is so much wider than the R and P, and that the bottom of the R sticks out further than the top. I think that is what gives it it's quiet and simple charm. My only problem is the W, every time I read through your samples it stops me, it just seems to heavy. I don't know how to solve it, lucky for me that is the designers job.</p>
      <p>I wish my first font would have turned out this nice. I would really love to see the finished version.</p>
