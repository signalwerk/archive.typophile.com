    html: |-
      <p>To me, Veneer and <a class="freelinking external" href="http://www.myfonts.com/search/alternate+gothic" rel="nofollow">Alternate Gothic</a>/<a class="freelinking external" href="http://www.myfonts.com/fonts/linotype/trade-gothic" rel="nofollow">Trade Gothic</a> Condensed Bold (no.20) share the same design backbone.<br>
      Alternatives:<br>
      - Rounded: <a class="freelinking external" href="http://www.myfonts.com/fonts/linotype/trade-gothic-next-soft-rounded" rel="nofollow">Trade Gothic Next Soft Rounded</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/fontbureau/garage-gothic" rel="nofollow">Garage Gothic</a> (/R off), <a class="freelinking external" href="http://lineto.com/The+Fonts/Font+Categories/Text+Fonts/Brauer+Neue" rel="nofollow">Brauer Neue</a> (/R off), <a class="freelinking external" href="http://www.youworkforthem.com/product.php?sku=T0020" rel="nofollow">Ultramagnetic</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/t26/vinyl" rel="nofollow">Vinyl</a>, <a class="freelinking external" href="http://www.hypefortype.com/colaba.html" rel="nofollow">Colaba</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/fontfont/ff-cst-berlin-east" rel="nofollow">Cst Berlin East</a><br>
      - Not rounded: <a class="freelinking external" href="http://www.myfonts.com/search/verb" rel="nofollow">Verb</a> (same foundry), <a class="freelinking external" href="http://www.myfonts.com/fonts/fontbureau/benton-sans" rel="nofollow">Benton Sans</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/fontbureau/griffith-gothic" rel="nofollow">Griffith Gothic</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/fontbureau/pennsylvania" rel="nofollow">Pennsylvania</a> (/R off), <a class="freelinking external" href="http://www.myfonts.com/fonts/wordshape/stacker" rel="nofollow">Stacker</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/capearcona/ca-normal" rel="nofollow">CA Normal</a>, <a class="freelinking external" href="http://www.stevenbonner.com/projects/langdon" rel="nofollow">Langdon</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/dizajndesign/komu" rel="nofollow">Komu B</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/fontfont/cst-berlin-west" rel="nofollow">Cst Berlin West</a></p>
