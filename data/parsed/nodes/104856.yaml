    html: |-
      <p>To me, Veneer and <a href="http://www.myfonts.com/search/alternate+gothic" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Alternate Gothic</a>/<a href="http://www.myfonts.com/fonts/linotype/trade-gothic" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Trade Gothic</a> Condensed Bold (no.20) share the same design backbone.<br>
      Alternatives:<br>
      - Rounded: <a href="http://www.myfonts.com/fonts/linotype/trade-gothic-next-soft-rounded" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Trade Gothic Next Soft Rounded</a>, <a href="http://www.myfonts.com/fonts/fontbureau/garage-gothic" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Garage Gothic</a> (/R off), <a href="http://lineto.com/The+Fonts/Font+Categories/Text+Fonts/Brauer+Neue" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Brauer Neue</a> (/R off), <a href="http://Ultramagnetic" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://Ultramagnetic</a>, <a href="http://www.myfonts.com/fonts/t26/vinyl" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Vinyl</a>, <a href="http://www.hypefortype.com/colaba.html" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Colaba</a>, <a href="http://www.myfonts.com/fonts/fontfont/ff-cst-berlin-east" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Cst Berlin East</a><br>
      - Not rounded: <a href="http://www.myfonts.com/search/verb" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Verb</a> (same foundry), <a href="http://www.myfonts.com/fonts/fontbureau/benton-sans" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Benton Sans</a>, <a href="http://www.myfonts.com/fonts/fontbureau/griffith-gothic" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Griffith Gothic</a>, <a href="http://www.myfonts.com/fonts/fontbureau/pennsylvania" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Pennsylvania</a> (/R off), <a href="http://www.myfonts.com/fonts/wordshape/stacker" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Stacker</a>, <a href="http://www.myfonts.com/fonts/capearcona/ca-normal" title="Click to visit an external URL." class="freelink freelink-external freelink-external">CA Normal</a>, <a href="http://www.stevenbonner.com/projects/langdon" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Langdon</a>, <a href="http://www.myfonts.com/fonts/dizajndesign/komu" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Komu B</a>, <a href="http://www.myfonts.com/fonts/fontfont/cst-berlin-west" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Cst Berlin West</a></p>
