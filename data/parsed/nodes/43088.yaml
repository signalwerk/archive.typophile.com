    <p>hello,<br>
    after 10.000 b.c., i wished to see a more accurate movie about the stone age,<br>
    and ended up seeing one million years b.c. (supline: this is the way it was)^^<br>
    i really enjoyed the movie, theres half-naked women, no dialogue at all,<br>
    an harryhausens famous stopmotion animation.</p>
    <p>i also really liked the opening credits.<br>
    they used a very bold font, which i suppose is custom made,<br>
    and also a more normal typeface, which is perhaps widely used,<br>
    well i couldn’t identify.</p>
    <p>but anyway i am more interested in the bold font.<br>
    does anybody know anything about it, please let me know.<br>
    or if you got anything else to say about this font and my taste,<br>
    let me know as well.</p>
    <p>ps<br>
    10.000 bc sucked. very much. but it was still fun!</p>
