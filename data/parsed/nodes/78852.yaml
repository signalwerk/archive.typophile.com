    <p>As a typography fan who has never had any exposure to "real" fonts, I’d quite like to take a course to learn a bit about letterpress printing. I was wondering if any typophiles have been to (or even run!) any courses in London or SE England and could give me some recommendations?</p>
    <p>Looking around on the web, there are two lists, one on <a class="freelinking external" href="http://www.letterpressalive.co.uk/" rel="nofollow">Letterpress Alive!</a> and one on <a class="freelinking external" href="http://britishletterpress.co.uk/printing-today/learning-more/letterpress-courses-and-tuition/" rel="nofollow">British Letterpress</a> but a great many of those links seem to be out-of-date and many of the institutions or presses don’t seem to be running anything anymore.</p>
    <p>Some possibilities include the <a class="freelinking external" href="http://printworkshop.stbridefoundation.org/" rel="nofollow">St Bride Institute</a>,  <a class="freelinking external" href="http://www.harringtonandsquires.co.uk/workshop.htm" rel="nofollow">Harrington and Squires</a> and the <a class="freelinking external" href="http://inkspotpress.co.uk/" rel="nofollow">Ink Spot Press</a> in Brighton but I wonder if there are any more which I haven’t been able to find? I am fairly flexible about what I do (although I’d prefer to work with metal type than polymer); as a complete beginner, I’m mostly after a general introductory course.</p>
    <p>Thanks in advance!</p>
    <p>-Jacob</p>
