      <p>Following the suggestions here, I spent this weekend at the St Bride Institute on an “intensive” course run by Richard Lawrence which was excellent fun. Richard was very kind in allowing us pretty much a free rein to do / try everything we wanted and answered no end of questions thrown at him.</p>
      <p>We started by doing some 1x1 inch lino prints on an Adana and proofing press and then moved on to setting and printing our names in type. That was followed by an attempt at a collaborative poster with a block of justified text decorated with some more lino prints, which ended up being a little over-ambitious and only just being completed at the end of the next day...</p>
      <p>Apart from that, we all got on with printing other things that interested us: posters in large wooden type, business cards, dinner invitations, note-cards, beer mats and the like were all printed in increasingly dramatic colours, so I think I have a certain feel for the basics in quite a few areas, if not quite a detailed understanding of anything in particular.</p>
      <p>If they continue to run these courses with about 6 participants then St Bride Institute’s print room provides plenty of space and enough presses for no one to have to wait too long to use anything. I was a little disappointed that there wasn’t more metal type to play with, though there is a huge amount of Perpetua and enough Univers and Fourier to set most things in, along with lots of odds-and-ends of decorative type and scripts. There is also a great selection of old wooden type which is good for immediate gratification!</p>
      <p>Anyway, I would thoroughly recommend the course to any type fans. Line-spacing is so much more obvious now having deal with leading which was strips of lead, and it really made me understand why, for instance, so fewer fonts were used historically in any given document: each one you add means you have to get another case and it adds so much hassle! I also hadn’t expected it to be so time consuming setting the type (and how easy it is to knock them over...), although you pick up the layout of the case pretty quickly and justification was much easier than I expected.</p>
