      <p>According to the <a class="freelinking external" href="http://www.artlebedev.com/everything/optimus/" rel="nofollow">Optimus Maximus</a> website, they have been shipping their keyboard since March of 2007. It's <em>very</em> pricey (just under $1700!), but if it works as advertised it would be just the ticket for people who work in multiple languages or who want lots of keyboard shortcuts for programs they use heavily. Take at look at the screenshot from their site showing a keyboard configured for Photoshop.</p>
