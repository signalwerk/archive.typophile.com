    <div class="info">Submitted by <a href="/user/108" title="View user profile.">Miss Tiffany</a> : 1.Sep.2009 4.22pm </div>
      <p>For Immediate Release:<br>
    Buffalo, NY- September 1st, 2009</p>
    <p>P22 proudly announces Huffer Pro, a new font designed by Terry Wudenbachs<br>
    for the International House of Fonts.</p>
    <p></p><div class="imageWrap"><img src="/files/HufferPoster_4310.jpg"></div><p></p>
    <p>Huffer is a chunky and irregular sans-serif font (with a few serifs) that<br>
    simulates the look of letters crudely cut out of paper. The basic letters<br>
    were originally inspired by an early 1970s instructional filmstrip dealing<br>
    with the dangers of glue sniffing. Further inspiration came from other<br>
    sources of 1960s display lettering. The lower case is almost as tall as the<br>
    upper case allowing for a mix and match between cases to achieve a more<br>
    lively display effect. Huffer Pro includes ligatures and Cyrillic and<br>
    Central European character sets with a total of over 500 glyphs.</p>
    <p><a href="http://www.p22.com/ihof/huffer.html" title="http://www.p22.com/ihof/huffer.html">http://www.p22.com/ihof/huffer.html</a></p>
    <p>Introductory offer through September 30th.</p>
    <p>You can now follow P22 on Twitter.com:<br>
    <a href="http://www.twitter.com/P22TypeFoundry" title="http://www.twitter.com/P22TypeFoundry">http://www.twitter.com/P22TypeFoundry</a><br>
    ————————————————————————<br>
    Become a fan of P22 on Facebook:<br>
    <a href="http://www.facebook.com/pages/P22-type-foundry/11128622951" title="http://www.facebook.com/pages/P22-type-foundry/11128622951">http://www.facebook.com/pages/P22-type-foundry/11128622951</a><br>
    ————————————————————————</p>
