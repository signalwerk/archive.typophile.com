      <p>Jan,  Tophy's native tongue is French - and I think he did great in trying to express what he is after. He may not have posted a picture the regular way -- but has posted to where you can see the sample. This is a person who sincerely is asking for help. By the way, I've tried to put his image up -- and though it is a 600 pixel wide .jpg in RGB - and it says it's uploaded - it just isn't previewing...</p>
      <p>And Steve - thank you for trying. The "S" is not the same. The closest any of us at WTF came was Imago (from dafont.com) who thought Magistral was close. I wonder if the original typositor for Harry had alternatives - I'll have to check... probably did! In my old book Harry was called Blotto Black, a main S and two alternatives, but none of them looked like the sample... shucks.</p>
