      <p>Wow, thanks to all, and to Stephen Coles.<br>
      I wasn't sure that the original designer of the title ANATANE simply used a font<br>
      or if he mixed a few and redesigned some letters, now it shows.</p>
      <p>I guess it's a mix of Harry Obese and some very heavy sans serif (Futura XBlack,  Antique Olive North redesigned... ?) for the N, D and K,<br>
      the S comes from another thing...<br>
      OK, at least, we know where to start from, and that all letters are from the same font.</p>
      <p>Thanks again.</p>
      <p>To Jan,<br>
      i know how to post an image, no problem, but i'm new on this forum, and i just couldn't find the way to visualize an image coming from a MyFonts page,<br>
      as we usually write the tags [img].... [/img] to show an image coming from another web page.<br>
      Plus, my home computer is a MacOs 9.2, Mozilla 1.31, which doesn't support the Attach image button, and decided to quit when i touched it ! That's why i wrote the link.  </p>
      <p>;)</p>
      <p><a href="http://tophy52.free.fr" rel="nofollow">Tophy52</a></p>
