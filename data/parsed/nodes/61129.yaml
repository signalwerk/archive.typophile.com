    html: |-
      <p>Unfortunately, getting useful information out of Apple about the nature of Font Book errors is sometimes challenging....especially around the time of a new Mac OS Release :-)</p>
      <p>I've had similar experience with TTCs under 10.5: some are okay, some raise vague errors like "missing OpenType data" with no detail as to what is missing, and there does not seem to be any publicly-accessible documentation on the errors.</p>
      <p>One possibility: are the TTCs you're testing all "large" (many glyphs)? At one time I was going to look into the possibility of a format 2 'post' table with name indices &gt;= 32768 being an issue, based on a very strict interpretation of the OpenType spec ("Index numbers 32768 through 65535 are reserved for future use") but I never chased that down to confirm.</p>
