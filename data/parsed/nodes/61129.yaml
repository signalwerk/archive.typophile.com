    html: |-
      <p>It took a while to track this down. As documented in the OpenType and Open Font Format specs* the CFF rasterizer we include in Windows does not support CFF TTC's. However other implementations (such as Mac OS) are certainly free to support them.</p>
      <p>*See <a href="http://www.microsoft.com/typography/otspec/otff.htm" title="http://www.microsoft.com/typography/otspec/otff.htm">http://www.microsoft.com/typography/otspec/otff.htm</a></p>
      <p>"The CFF rasterizer does not currently support TTC files."</p>
      <p>Scroll down to the section "TrueType Collections" third paragraph immediately before the sub-section "The TTC File Structure".</p>
