  html: <p>Hello. I need some help identifying a font name which was found when researching possibilites for wedding invitations. I am frustrated because the company (regency thermographics) only displays the font number (#345), but no name. It seems unique because the lower case letters are just smaller versions of the uppercase. Any help is much appreciated!  <br> <br>(another question - do stationary companies intentionally omit the font name so customers wont <br>copy? thanks again!) <br> <br> <br><img src="http://www.typophile.com/forums/messages/83/70694.gif" alt="#345"></p>
