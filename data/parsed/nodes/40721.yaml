    html: |-
      <p>Insignia doesn't seem nearly bold enough to match...<br>
      I've kind of felt that it was a weird cross between <a class="freelinking external" href="http://www.terminaldesign.com/CustomFonts/Fonts/VFSans/" rel="nofollow">VF Sans</a> and the R and S of Gotham. I am referring to the R in Focus Features, which I forgot to upload.</p><div class="imageWrap"><img src="http://typophile.com/files/Focus-logos-300dpi_3814.jpg"></div><p></p>
