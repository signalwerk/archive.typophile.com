    user_name: eriks
    user_path: null
    date_raw: 10 Jan 2008 — 10:35am
    date: 2008-01-10T10:35:00
    votes: null
    html: <p>FILMINFOCUS is Neville Brody’ s Insignia, with the cross-stoke removed from the F. Or perhaps there is an alternate F in there. Haven't got time to check. It's a Linotype font - some Akzidenz Grotesk (see the S) with some Avantgarde for geometric purposes. The tagline is just Futura Bold.</p>
