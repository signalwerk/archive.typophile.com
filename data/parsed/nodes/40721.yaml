    html: <p>I puzzled over this while waiting in a theater lobby recently. (It was printed on the side of a large display for a film.) I don't know what it is either (if it is a font). I suspect it is a custom or modified font to match the FOCUS logo. (I thought the FOCUS logo was AG Old Face, but it's not.)  (Incidentally, the Neutraface M is slightly splayed, too.) (Sorry about all the parenthetical remarks.)</p>
