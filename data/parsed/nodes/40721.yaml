      <p>I think the M in Insignia is wrong too. Here is a sample setting of <a href="http://www.fontshop.com/fonts/singles/font_bureau/eagle_book/?sample_text=FILMINFOCUS&amp;sample_size=36&amp;acs_p=1&amp;acs_pt=24&amp;acs=1" rel="nofollow">Eagle Book</a>. All it needs to match is to shorten the lower arm of the F.</p>
      <p>- Mike Yanega</p>
