  html: |-
    <p>I'm bidding on a bespoke headline type for an Irish client, who may need to use it for bilingual Irish/English texts. While the original plan was for an all-caps titling face, I've realized that all-caps setting in Irish sometimes requires the use of lowercase letters. For instance, HISTORY OF IRELAND is rendered STAIR NA hÉIREANN, with a lowercase /h/.</p>
    <p>Can anyone tell me what lowercase letters are needed to make an all-caps typeface usable in Irish? Do I need to draw lowercase for the whole Irish alphabet (i.e., a á b c d e é f g h i í l m n o ó p r s t u ú)? In fact, given the existence of loan words that use non-Irish Latin letters, does any Irish-capable typeface need a full Latin lowercase?</p>
    <p>FWIW, the typeface is meant to be a modern Latin, not a traditional Irish/Gaelic letter. And any Irish set in it would be modern Irish.</p>
