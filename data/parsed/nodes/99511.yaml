    html: |-
      <p>Jack, in Irish orthography certain prefixed letters are not capitalised in mixed-case text; rather, the initial letter of the root word is. So, in Max's example, the mixed-case version would be 'hÉireann'. The h in this case indicates an aspirated pronunciation, presumably triggered by the preceding vowel.* In order to maintain this orthographic distinction in all-caps text, the prefixed letter conventionally either remains lowercase or, in some typography and signage, may be a smallcap. In an all-caps typeface, my inclination would be to either go for the smallcap option or ensure that the nominally lowercase forms are designed to harmonise in all-caps settings by adjusting their proportions and weight and perhaps employing bilateral serifs on ascenders.<br>
      ____</p>
      <p>* I'm intrigued by the different ways in which languages evolve means to deal with successive vowel sounds across word breaks. Irish aspirates the second vowel: <em>na hÉireann</em> rather than <em>na Éireann</em>. French tends to elide the first vowel: <em>l’école</em> rather than <em>la école</em>. In spoken English, vowels are also elided quite often, but not usually in writing, and British English has the delightful insistence that aspiration sometimes isn't enough: <em>an history</em> rather than <em>a history</em>.</p>
