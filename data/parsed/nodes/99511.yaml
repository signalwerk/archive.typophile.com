      <p>Once it was explained that these small letters were <strong>prefixed</strong>, I had something to try Googling with (Irish prefixed orthography). I found a page on Irish pronunciation that had many such letters in one section, on a phenomenon called <em>eclipsis</em>. That may be too specific, as it may not be the only reason for such letters, but it may be useful in turning up more comprehensive detail.</p>
      <p>Hmm. Apparently eclipsis occurs a lot, and it's only when it is not expected that a prothetic consonant is added (sometimes also called a prosthetic consonant, and apparently not just when one's spelling checker alters it behind one's back - that's a legitimate alternate name).</p>
