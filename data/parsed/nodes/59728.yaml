      <p>Who are your client's customers? It seems to me that women who buy beauty products want to look youthful, so I'd advise you to stay away from anything that says <em>old</em>, such as typographic allusions to the 18th Century.</p>
      <p>If this is a mostly web-based business, it won't cost any more to use color, and this type of product calls out for a logo with soft, warm colors.</p>
      <p>Why did they pick the name PowderHouse? Were they thinking of the "powder houses" where armies used to store gunpowder? If so, maybe they have more of a punk aesthetic in mind, an <em>explosion</em> of color. It's a question I'd ask if it were my client.</p>
