    <p>Dear Typophile Associates,</p>
    <p>I would like your comments on the attached PowderHouse Logo.</p>
    <p>PowderHouse will be mostly web based; products for women (beauty and accessories). I researched Fournier and Fontanges and was influenced by Fournier, the powdered wig era...I found a comment "The hairdos are as high as a house". So I combined soft and hard, old and modern.</p>
    <p>Thank you for your comments.</p>
    <p>Best regards,<br>
    Judy</p>
