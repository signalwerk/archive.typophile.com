    <p><img src="http://www.typophile.com/forums/messages/4100/54080.jpg" alt="Proposed Corporate Mark "> <br>Hey all. I'm in the process of developing an identity for a visual communications company. Its decided name is 'LI' which is an abbr. of Lindborg. I've chosen to stick to a typographical sollution for the logo, but I'm open for suggestions. Any feedback is welcome. <br> <br>Cheers!</p>
