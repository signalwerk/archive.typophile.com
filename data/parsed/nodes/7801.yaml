    html: <p><img src="http://www.typophile.com/forums/messages/4100/54133.jpg" alt="v.02"> <br>Greatful for all that info! Cheers! It sure will be 'Communications'. Just a small mistake. Thanks for pointing it out tho.  <br> <br>I've tweaked it a bit, making the I lowercase. I feels it makes it a bit more playful, and hopefully it will make it less corporate, I want to express/communicate 'playfulness' through the use of typography. Does it work? I feel the letter almost become 'figure-like'. Does it need balancing? <br> <br>S.</p>
