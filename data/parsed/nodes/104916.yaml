      <p>&gt; the silver will be a foil block and the ink black<br>
      &gt; I think the contrast will be about the same.</p>
      <p>But most foils are reflective to some degree, and their brightness will vary depending on what they are reflecting. A matte foil might help but I'm not sure it'll create the effect you're after.</p>
