    html: |-
      <p>To me, I would prefer a more structural approach, and you are very close.<br>
      1. Shift the word "THE" left until the E aligns vertically with the L in WEALTH.<br>
      2. Shift the word REPORT a tad right until the vertical stem of R in it aligns with the vertical stem of T above it in WEALTH;<br>
      3. shift 2014 a tad right until the vertical stem of the 4 aligns with the vertical stem of the R above it in REPORT.</p>
      <p>This will also make it feel a bit more like a table as in balance sheet.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/TWR2014_4066.png"></div><p></p>
