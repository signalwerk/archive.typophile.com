      <p>Much better, but I ﬁnd the reversal of this style disconcerting, as I’m reading the “shadows” as foreground, not the implied type face, which draws attention to the thin edges as if they are serifs, which seems strange in a sans face; the effect is especially strong in “T”, “2” and “1”.</p>
      <p>Also, I’ve always preferred the illumination to come from top left. I believe that is the standard.</p>
