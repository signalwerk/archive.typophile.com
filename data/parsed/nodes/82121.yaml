    <p>A student of mine has this query that I thought Typophiles might be able to help with:</p>
    <p>- - -<br>
    For my current final paper, I have chosen to evaluate the life and printing/publishing legacy of Aldus Manutius, including his innovations in the way of printing Greek script during the early 1500s.</p>
    <p>While researching this topic, I came across a claim from the work <em>In Aedibvs Aldi: The Legacy of Aldus Manutius and His Press</em> that it was a system of “vertical kerning,” among other typeface enhancements, which allowed Aldus to produce a successful Greek type.  In addressing Aldus’s application for Privileges to the Venetian authorities, the book states,</p>
    <p>“In justification for this application, Aldus mentions somewhat mysteriously ‘two new methods’ which he has invented for the printing of Greek.  What these new methods were is not entirely understood...Barker...believes that the two methods mentioned were the vertical kerning of the letters and the system of using separate sorts of accents and letters.” (p. 34)</p>
    <p>Earlier on, the source describes the physical attributes of the effect of this “vertical kerning” on printing Greek type with all breath and accent marks, stating: </p>
    <p>“One important problem this first font had was that Aldus’s system of vertical kerning frequently produced ‘collisions’ between ascending and descending letters in adjoining lines.  The first solution to this problem was to expand the amount of space between lines, but as Aldus continued to develop his presswork other improvements were made.” (pg. 31)</p>
    <p>Although I have a mental picture of what this “vertical kerning” may have looked like, I haven’t been able to find any illustrations of the process, and I am therefore shaky in my description of it.    </p>
    <p>If there is anyone out there who can act as a reliable source, or has access to a reliable source which illustrates and explains vertical kerning in more detail, I would be very grateful for your help.  Any illustrations of vertical kerning being used for greek type would be welcomed as well.  I find this topic fascinating, and this is a piece of my research puzzle that I really need to solve to bring the topic together.</p>
    <p>Here is the citation for the book I’ve been using:</p>
    <p>Angerhofer, Paul J., Mary Ann Addy Maxwell, Robert L. Maxwell, and Pamela Barrios. <em>In Aedibvs Aldi: The Legacy of Aldus Manutius and His Press</em>. Provo: Brigham Young University, 1995.</p>
    <p>I look forward to reading your responses!</p>
