      <p>I thought of another way to do this which would have been even easier than my first conjecture.</p>
      <p>Suppose that we set every other line of text on a page and then places a slug the exact height of whatever text plus leading they used.  (perhaps just stacked as John indicates from his reading). We then print even lines as form one and odd lines as form two.  This would allow for the mortising in of the accents in the slugged line either to mark the the text on the following line of form one or to appear where they would need to be for the 2nd form when those lines were printed?  Since the accents were not perfectly aligned in several cases, this could indicate either a small missed measure or miscut of the slug to fit the accented glyphs?</p>
      <p>This eliminates all of the tweezer work and packing changes but adds the time to slug and space the accented lines.</p>
