      <p>Mark,<br>
      If I were to do it, I would first run the 1st form as text without accents. Then I would tweezer out only the base glyphs to be accented and replace them with glyphs of accents only but a bit higher than type high--perhaps drop a spacer into the vacated slot to raise the accent above the rest. Next, I would add one 3pt (or whatever) slug from above the form which would shift the accented form  down the needed amount.  I would then reduce the packing to allow for the higher type position. Then run the second form.<br>
       This would be "vertical kerning" because I would have shifted the accents closer to the base letters without worry of decenders above.  This method is not much different than two color letterpress where the first form may be a table of figures or text in one color; then followed y a 2nd color form of rules set to the same leading and measure with a slug inserted to shift the form so the rules hit between lines of the first form.  There would be no need to make any adjustments to type height or packing with this though.</p>
      <p>This method would require the casting of all polytonic accents and breathing marks at the exact widths of each of the base letters which receive accents (they could even have been cast taller than type-high to eliminate the need for the spacers).  This is a much smaller number than the entire Greek alphabet because many glyphs are never accented. Perispomeni have very few host glyphs, for example.<br>
      The amount of pressure and inking required for such a sparse setting as the 2nd form would be less than a full block of text so doubling of the lower dropped base glyphs would be unlikely.</p>
