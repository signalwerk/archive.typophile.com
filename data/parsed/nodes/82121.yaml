      <p>Part of Burnhill’s analysis of Adline norms relies on misprints in which the top or bottom edge of a sort makes a visible impression, e.g. because of grit on the type bed as Chris describes. Such accidents enabled Burnhill to accurately measure the body height of Aldine sorts and, among other things, confirm that no leading strips were used: interline spacing was determined directly by the body height with what we might now call ‘built-in leading’.</p>
      <p>The method suggested by Nick, with decomposed accents fitted to mortised bodies, could have been done, but I’m not aware of any physical evidence for it, and I don't think it would have been efficient. Burnhill suggests that accents were kerned off narrow sorts following the letter or, in some cases, on either side of a letter, which explains the inconsistent spacing between tone and breathing marks. This technique preserves the standard horizontal composition of sorts, without introducing a new class of mortised bases and vertically composed elements.</p>
      <p>More controversially to my mind, Burnhill’s composition reconstructions suggest that at least some ligatures were composed of what we would think of a contextual variants. I'm willing to believe that it might have been the case, but I'm not sure whether the physical evidence supports it. Certainly, subsequent generations of renaissance Greek printers using Granjon’s types and those derived from them, did not do this, and the catalogue of Greek sorts from Enschedé and Oxford show precomposed ligature sorts. The trouble I have believing that the Aldine books were composed using contextual variants in this way stems from just how difficult this is for the compositor. It is something that we can do today because we have computers to perform the lookups for us, and they don't get tired and they don't get sloppy. The only handset type system I am aware of that definitely did use contextual variants— Mühendisoğlu’s Ottoman Arabic type—proved to be overwhelmingly difficult for compositors: even within a single book the quality of the typesetting degrades, with more and more mistakes being made.</p>
      <p>[By the way, if anyone comes across examples of Greek capital letters with tone/breathing marks on their left, i.e. the ‘standard’ position, prior to the 19th Century, please let me know.]</p>
