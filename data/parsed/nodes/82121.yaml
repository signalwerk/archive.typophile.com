      <p><em>Is he showing parts of glyphs mortised into the line above or are there 3 piece on two lines?</em></p>
      <p>Not motised; rather, a classic kern, i.e. an unsupported part of a glyph overhanging the edge of one piece of type to rest on top of the face of an adjacent piece. Mark’s illustration of an italic f shows the common horizontal kern; what Aldus appears to have done is the vertical equivalent.</p>
