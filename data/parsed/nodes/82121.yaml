      <p>More from my student:</p>
      <p>- - -</p>
      <blockquote><p>"One question I had was: if the crashing was solved at first by adding leading, doesn't that make all the trouble of vertical kerning pointless? I wonder what the "other improvements" to solve the crashing were.  Are there other scripts/writing systems with which vertical kerning has been tried (in metal types)?"</p></blockquote>
      <p>I have both the Barker and Angerhofer sources, and Angerhofer is the only one which addresses the first issue.  As I quoted before, Angerhofer states, "The first solution to this problem (the collisions) was to expand the amount of space between lines, but as Aldus continued to develop his presswork other improvements were made" (pg. 31).  This indicates as well to me that more leading was the obvious answer to this problem.  Barker doesn't address the collisions at all,  but to answer the second question, he does state that this method had been used before: </p>
      <p>"Neither of these was wholly new: vertical kerning had long been in use, if not for Greek type; separate accents had been used with conspicuous success in the Vicenza Chrysoloras.  But if these were the two 'methods' that Aldus intended to protect. What counted, as far as the privilege was concerned, is that neither had been used before for the printing of Greek <em>in Venice</em>." (Barker, pg. 93)</p>
      <p>Barker, Nicolas.  <em>Aldus Manutius and the Development of Greek Script &amp; Type in the Fifteenth Century</em>.  New York: Fordham University Press, 1992.</p>
