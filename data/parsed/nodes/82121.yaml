      <p>Here is a scan of Peter Burnhill’s compositor’s view reconstruction of a portion of Lascaris’ <em>Erotemata</em> of 1495, a primer of Greek grammar. One of the interesting aspects of this project, to which Burnhill draws attention, is that Griffo’s type for it is deliberately a handwriting font, designed as a model for the student to follow in learning to write Greek. Another, and crucial aspect, is that Griffo was obliged to fit this Greek into the body height (matrix mould aperture) of an existing Latin type selected for the composition of the explanatory Latin text; Burnhill’s analysis of the implications of this constraint is central to his reconstruction of Griffo’s solution.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/burnhilllascaris_5010.jpg"></div><p></p>
