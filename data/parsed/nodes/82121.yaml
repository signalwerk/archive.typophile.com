      <p>Craig, I strongly recommend that your student read Peter Burnhill’s <a href="http://www.hyphenpress.co.uk/books/978-0-907259-19-0" rel="nofollow"><em>Type spaces: in-house norms in the typography of Aldus Manutius</em></a>. Burnhill’s detailed analysis of Adline microtypography includes an attempt to reconstruct the underlying arrangement of sorts from measurement of the printed page, as shown in <a href="http://www.hyphenpress.co.uk/images/spreads/77/large/typespaces_pp80-81.jpg" rel="nofollow">this image</a>. On the right hand page, you can see (compositor’s view, upside down and backwards), the descenders of some letters sitting on top of the body of letter and spacing sorts in the next line. This is what I would understand by ‘vertical kerning’.</p>
      <p>[In other words, what Mark Simonson said.]</p>
