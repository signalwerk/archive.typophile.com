      <p>My guess as to what was meant would be very simple: to allow accents to be placed above lowercase letters, without the need for making type slugs bearing every combination, Aldus went and turned the <em>ascenders</em>, not the descenders, into kerns. And, for capital letters, the space between cap height and x-height to boot.</p>
      <p>That would have indeed allowed collisions with descenders in the absence of adequate leading.</p>
      <p>But that wasn't what was requested - instead, some actual evidence that Aldus Manutilus actually did it that way, instead of some other way, some source with more details than the phrase "vertical kerning", was requested. And, indeed, the illustration from Burnhill shows that <em>he</em> was indeed thinking of the descenders being kerns.</p>
      <p>Now, all we have to do for the OP is find out if <em>Barker</em> thought the same way.</p>
      <p>Ah.</p>
      <p>"Aldus Manutilus and the Development of Greek Script &amp; Type in the Fifteenth Century", by Nicolas Barker, Fordham University Press, says on page 85...</p>
      <p>that vertical kerning was not used with Type 2 (mostly used as a small supplementary type), Type 1 not being part of the Google Books preview,</p>
      <p>and as for Type 3,</p>
      <p>"Raised spaces again show that a third, even more revolutionary, but far simpler, solution was now introduced to deal with the problems of composing separate accents. This involved a reversion to kerning, in this way: the nominal gauge of the type, 4.2 mm, remained constant, but the letters were cast on a 3.15 mm body, kerning equally (up to about 1.6 mm) at head and foot; the accents were cast on a 1.05 mm body, occupying the appearing space between their proper line and the line above. The relative rarity of kerning sorts made collisions much less frequent than in the first version of Type 1:"</p>
      <p>so Type 1 did have vertical kerning of some sort.</p>
      <p>... so one just has to turn back nine pages from page 93 to page 84, and the mysteries should all be revealed.</p>
