      <p>For all we know, Aldus may have stepped the type blocks of accentable letters, putting a shelf in the extender area, on which shallow-bodied accents sat.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/kern_greek_3689.png"></div><p></p>
      <p>Really tall diacritics (stacked, eg. psili with perispomeni) could have bridged lines, which would be vertical kerning.</p>
      <p>With this method, it wouldn't be necessary to pack the gaps left for accents, in non-accented letters, with spacing material—which would be necessary if separate accents and letters were all the same body depth.</p>
