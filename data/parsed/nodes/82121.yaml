      <p>John: That's almost exactly what I was picturing, except that it's the descenders that are kerned instead of the accents.</p>
      <p>Nick: If anything that would be mortised type, not kerned type.</p>
      <p>Chris: I remember hearing that designer and typographer Mo Leibowitz used that method in order to get tighter letter spacing and negative leading with metal type. Pretty time-consuming and tricky, I imagine. It's more or less what we call kerning nowadays (exceptions to standard spacing), but that's not something that would have been described as kerning in the metal type era.</p>
      <p>(The term "kerning" has drifted so far from its original meaning that many young designers seem to think it means the same thing as "spacing".)</p>
