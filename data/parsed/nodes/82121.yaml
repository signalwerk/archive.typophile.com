      <p>I haven't read either book and don't know much about Aldus' Greek type, but I think I can envision what's being described. If the diacritics are on separate sorts from the letters, then the bodies that the vowels and rho were cast on must have been shortened above and in some cases below to leave space for the diacritic sorts to be inserted. Presumably it's these spaces where the body is shorter than usual that are the "vertical kerning" referred to. In practice, for dealing with eta and some ligatures, you might need to have some diacritic space below/above adjoining letters as well.</p>
      <p>So he would be casting at least some of the letters without ascenders on a body that extends up only to just above x-height, and casting at least some of the letters without descenders on a body that extends only just below baseline. But then for tightening up you would probably want small leads to fill in the gaps between x-height and ascender height (and between baseline and descent) for sequences without diacritics.</p>
      <p>This doesn't seem like the simplest way of casting Greek type, but I suppose it would keep the type case down to a reasonable size.</p>
      <p>ETA: <a class="freelinking external" href="http://net.lib.byu.edu/aldine/ald15lf1.jpg" rel="nofollow">This example of Aldus' Greek</a> uses an eta without descender, which solves the problem of placing iota subscripts without requiring any space under the preceding letter. And I don't see any ligatures that would cause diacritics above the letter to be displaced horizontally either.</p>
