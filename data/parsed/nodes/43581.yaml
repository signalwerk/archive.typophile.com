    <p>Hey There! I’m looking for some possibly life changing advice, so I’d greatly appreciate it if you could read my post and offer whatever thoughts you may have. Thanks in advance!</p>
    <p>Let me give you a quick run down on my life.</p>
    <p>I’m 20. After high-school I went to university for graphic design, but hating it, I dropped out after only the first year. For the next two years [to present], I’ve worked as a freelance web-designer. Now I’m thinking about the future. Freelance is unstable. I’d like to find work with a studio, but I have no idea how, where to begin, or whether I am qualified or skilled enough.</p>
    <p>I’ll link you to my portfolio so you can keep it in mind as you read the rest.<br>
    <a href="https://web.archive.org/web/20080709010042/http://www.skywide.net/" title="www.skywide.net">www.skywide.net</a></p>
    <p>My question to you is: How does one go about finding their first full-time graphic design job?</p>
    <p>I have no full-time working experience. My resume consists of a scattering of freelance positions with a variety of individuals, organizations, and a few running overflow agreements with some local studios. I do have a few strong references.</p>
    <p>Is it generally accepted that studios/organizations only hire people who’ve completed university or college programs?</p>
    <p>Perhaps I need to do some sort of internship?</p>
    <p>Please take a look at my website and offer honest feedback. Do I even stand a chance? Is my portfolio varied enough? Is it what employers are looking for?</p>
    <p>Really, whatever advice you have to give would probably be helpful.</p>
    <p>I have little interest in going back to university to complete my design degree [citing reasons such as insane tuition costs, lack of actual learning.], but it is an option...</p>
    <p>Thanks,<br>
    Blake</p>
