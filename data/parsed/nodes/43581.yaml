      <p>Okay, I’m only two years out of school, so take my advice with a grain of salt:</p>
      <p>I’d say you have a good start, especially considering you have almost no formal training. The majority of your work looks pretty “safe,” and seems to be very ad-company-ish, but there is obviously a lot of thought going into them. I would be curious to know in what capacity and how much of these websites are yours, and how much other team members contributed. I particularly like the design on “warfare grounds” and theillest.com, as they seem to have a little more personality.</p>
      <p>I have a hard time saying don’t go to school, but you may be okay. I’m not nearly in a position to tell you what employers are looking for, but I would have to say most creative firms have a “proof is in the pudding” philosophy. A BFA from RISD would certainly help your resumé, but I think what matters most is your portfolio. Depending on what languages of code you know, that will help bolster you as well. Java and Flash Actionscripting are a huge plus, but maybe you should here from someone who isn’t a print designer...</p>
      <p>If you are an AIGA member, they have excellent networking events. Creative hotlist and coroflot.com may be good places to start looking for jobs as well.</p>
