      <p>AIGA: American Institute of Graphic Arts. They have annual dues of about $310, which may be a little steep on a tight budget, but like I said, they have great networking events, discounts on admission to some galleries/museums, great lectures as well as some exclusive job listings (aiga.org).</p>
      <p>James is right, if you have all that coding skill, you should find a job relatively easily, at least compared to a print designer.</p>
      <p>Best of luck!</p>
