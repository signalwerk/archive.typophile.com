    <p>Do you love a FontFont face or an OurType font? Wouldn't you like to get it for free…? Declare your love for it and you might!<br>
    And hurry! Only half a day left on the contest! You can join three times! We need at least fifty to make it count!</p>
    <p>{This is <a class="freelinking external" href="http://fontfeed.com/archives/valentype-2009/" rel="nofollow">the “briefing”</a>; this is <a class="freelinking external" href="http://fontfeed.com/archives/valentype-2009-the-gallery/" rel="nofollow">the gallery</a>.}</p>
    <p>Good luck! ;)</p>
