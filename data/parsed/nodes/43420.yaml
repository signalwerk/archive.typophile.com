    html: |-
      <p><cite>The way it stands at the moment, if a designer receives text that is set in upper and lower case, and wishes to set it in all lower case style, the capitals will need re-keying. As a user interface issue, what do you think would be the best way to implement “all lower case”?</cite></p>
      <p>Well, no, they wouldn't need re-keying, you just need software that does the case conversion - or you could use a script or something.</p>
      <p>As for how one implements it in UI, it is a case conversion and should be in the same place as other case conversions in the UI. For example, in Adobe InDesign, it is under Type &gt; Change Case &gt; lowercase, right next to the UPPERCASE, Title Case and Sentence case options.</p>
      <p>Cheers,</p>
      <p>T</p>
