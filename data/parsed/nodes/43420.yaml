      <p>Nick: <em>Germans pioneered the use of all-lowercase text, a style which is becoming increasingly used in all kinds of general media perused by a wider selection of the population than the “concrete poets, avant-gardists, teenagers and wankers”.</em></p>
      <p>I don't necessarily exclude the designers of tomorrow morning's recycling from the category of wankers. The flood of this stuff now washes over consciousness so quickly that individually it doesn't even constitute 'ephemera' anymore; the air has more substance.</p>
      <p>What graphic designers do to make a desperate grab for the over-a-hurried-breakfast attention of newspaper readers is entirely irrelevant to issues of character encoding. Once again: the Latin script is bicameral; the two cases are commonly used in such a way that the distinction carries semantics information; this semantic information should not be lost in plain text input, storage and interchange; ergo a plain text encoding standard needs to encode the case distinction. Numerals, on the other hand, are only stylistically bicameral, in that there is no independent semantic difference between a lining numeral and an oldstyle numeral; ergo, a plain text encoding standard does not need to encode the case distinction, any more than it needs to encode the distinction between roman and italic (and don't try citing math alphanumeric characters to me, because they do have distinct semantics in the orthography of mathematics, which is not the orthography of natural language).</p>
