      <p>John, once again, the issue I am raising is not what is right or wrong if one reduces the complexities to a bicameral duality, but what is useful to typographers.</p>
      <p>From your ivory tower, you may wish to blow off marketing designers as a bunch of vaporous wankers, but they are the people who use the types we make.</p>
      <p>All-lower-case setting is more widespread than in adland; perhaps it is just laziness (which is nonetheless a legitimate engine of change), but it may also signify something else.</p>
      <p>The way it stands at the moment, if a designer receives text that is set in upper and lower case, and wishes to set it in all lower case style, the capitals will need re-keying. As a user interface issue, what do you think would be the best way to implement "all lower case"?</p>
