    html: |-
      <p>John: "...what they don’t want is all-lowercase text."<br>
      Agreed, and it's why I always say, the caps, are the default case. So why is it so easy to say 'they' want all uppercase figures? with the bottom line being, if it ain't in unicode, it's being phased out. Your and Adam's, (and my) names for our precious glyphs, are helping the phase-out process. Future apps are going to have to track down the meaning of glyphs, with only the feature tables to guide them, I guess...</p>
      <p>"But it seems very obvious to me that there are two perfectly legitimate ways in which to analyse numeral styles..."<br>
      Don't be confused by the many wonderful 'tweeners of some kind. These 'tween numbers were, and are often, compromises or following compromises, to a fashion statement of 'numerical superiority' and little else. Or maybe 'the one legitimate way' to analyze numeral styles's, from the user out. Users, want one kind with uppercase, another kind with lowercase, and sometimes, they want figures being for themselves and not another case. These narrowed, tabular figures, are what most users get barfed on their documents for all cases.  There are uppercase figures, lowercase figures, and figure figures, and 'we' should pull together on that, and get it to being the 'established typographic fact' it is, so that developers can develop to it, and not the confusing Nick/Indesign interface, no offence intended. </p>
      <p>Cheers!</p>
