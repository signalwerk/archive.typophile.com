    html: |-
      <p>Thank you for the suggestions. Some of the peculiarities are from the rules I gave myself at the start. All the shapes are made from circles or parts of circles, and vertical and horizontal lines. As a result, there are no diagonals anywhere... which means sloping the s would break the rules... but if keeping with the rules means I have an s that looks like an r, then I have no choice but to break them!</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/s_4942.png"></div><p></p>
      <p>How's this? I think it looks more s-like. I thought sloping it would ruin the linking between letters, but it works out. I updated the specimen to the new s.</p>
      <p>mk2: I made the current r the way it is because I had designed one and thought it looked too much like an n:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/rr_3564.png"></div><p></p>
      <p>Maybe the old one (in red) is okay, and I've just been looking at all this too long?</p>
      <p>I agree with what you say about the c and the v. I think I'm going to do something like what I did with the s.</p>
      <p>I previously attempted to make a regular z, but I couldn't figure out how to squeeze in two horizontals and a diagonal into the space of the x-height, so I made a cursive z. The x was the last letter I made, it was really tricky, for the same reason, but I think I can use it to make a regular z. I'll have to work on that.</p>
