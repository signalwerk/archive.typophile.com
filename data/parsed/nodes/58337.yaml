    html: |-
      <p>'r' --- look more like a small-cap 'R'.</p>
      <p>'v' --- I think you should make it like a regular 'v', like down pointing arrow (excuse my english).</p>
      <p>'x' --- I think top left side would be better if rounded.</p>
      <p>'z' --- try a regular 'z'.</p>
      <p>'?' --- imagine how it looks when put beside an uppercase letter, it needs to be wider.</p>
      <p>'c' --- I think top right side would be better if rounded.</p>
      <p>'s' --- I'm agree with Cerulian.</p>
      <p>PS: It's your typeface, and this is just my humble opinion. :D</p>
