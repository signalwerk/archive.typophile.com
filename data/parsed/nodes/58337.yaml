    html: <p>There you go. The s updated in the pdf looks different than the s in the little red image; I much prefer the one in the image. I don't really see significant problems with the other characters mentioned, but if you're looking for r alternatives, one possibility would be to eliminate the left vertical stroke altogether. And your current z would be improved by retracting the middle left so it's not as long as the top.</p>
