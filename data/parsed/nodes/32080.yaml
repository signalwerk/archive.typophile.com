  html: |-
    <p>The “Schnorkel” was a term coined by Gary Munch during the TDC Cyrillic Weekend seminar to address the outreaching arm of the V-like character in some Cyrillic languages.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/schnork3_3684.png"></div><p></p>
    <p>It was a humorous poke derived from the snorkel used in diving gear.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/schnork_4161.png"></div><p></p>
