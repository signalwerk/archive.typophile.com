      <p>I searched in Part 14 (Distressed Scripts) of the Script Guide and found a few candidates for similar fonts to start with: <a class="freelinking external" href="http://new.myfonts.com/search/pious+henry/fonts/" rel="nofollow">Pious Henry</a> is one, and <a class="freelinking external" href="http://new.myfonts.com/fonts/letraset/carumba/" rel="nofollow">Carumba</a> is another. There were lots of possibilities, but I didn't see this exact font. It's hard to know how much massaging it got to end up like your sample.</p>
      <p>- Mike Yanega</p>
