      <p>Unfortunately, none of the faces I’ve checked the various styles against are perfect matches. It’s like, “Futura, but not quite; Akzidenz, but not quite; Avant Garde, but not quite; etc”.</p>
      <p>I’ve even gone far enough to check against fonts, like Proxima, that have a very low likelihood of having been used for signage old enough to look this weathered.</p>
