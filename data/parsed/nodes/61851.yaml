    <p>I saw this signage at an auto shop in the LA area. At first glance I thought it was Akzidenz, but there are some noticeable differences that give it a Futura look as well. And if that weren’t tricky enough, the numerals have the flavor of Avant Garde.</p>
    <p>The closest thing I could think of off the top of my head was Nobel, but that’s not quite it. Any ideas?</p>
    <p></p><div class="imageWrap"><img src="/files/sans_5845.jpeg"></div><p></p>
