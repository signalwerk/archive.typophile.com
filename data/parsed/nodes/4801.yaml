    html: <p>Custom, certainly. Closest fonts I know are <a href="http://www.fontshop.com/fonts/downloads/club_21/frieze_ot/">Frieze</a> and <a href="http://www.fontshop.com/fonts/singles/creative_alliance/sassoon_infant_by_linotype_dotted/">Sassoon Dotted</a>, but these don't have the rigid structure of the Care logo. If you want a similar look, I'd follow the midline of a linear serif with dots.</p>
