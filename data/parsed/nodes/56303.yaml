      <p>There is a nice list of all Ludlow fonts in Mac McGrew's American Typefaces of the 20th Century. </p>
      <p>This one is Eusebius Open, by Robert Hunter Middleton, 1929, based on Eusebius, by Middleton's teacher Ernst Detterer, 1923. Eusebius is Ludlow's version of Jenson. Lovely.</p>
