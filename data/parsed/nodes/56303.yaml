  html: |-
    <p>As you might know, I am supporting a german font collection with scans and informations about foundry, first year of production and artist:<br>
    <a href="http://www.bleisetzer.de/cms/front_content.php?idcat=41" title="http://www.bleisetzer.de/cms/front_content.php?idcat=41">http://www.bleisetzer.de/cms/front_content.php?idcat=41</a></p>
    <p>Now we started production of lead lines with a Ludlow and we got 1,2 tons of matrizes. I have the scanned character sets and I have a text sample of each font we own. But no idea about first year of production and artist.</p>
    <p>Shall I show all Ludlow fonts we got in a directory of above listet font collection? Would it make sense? Or is it easy enough for someone who's interested, to buy a Ludlow specimen?</p>
    <p>Georg</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Eusebius_Open_1_6436.jpg"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/Eusebius_Open_2_6490.jpg"></div><p></p>
