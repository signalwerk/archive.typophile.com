      <p>Georg, I'd sure like to see samples of these typefaces. There must be some I would like to add as images for my Serif Guide. Will you plan to make samples to show on your web site? That would be a fantastic resource, because even though McGrew's book may have a list, the images in the book are not printed on high quality paper.</p>
      <p>By the way, we once ID'd Helga (I think that was the typeface name), but I never got an image of it that I could use in the Guide. Perhaps you could e-mail me about that one?</p>
      <p>- Mike Yanega</p>
