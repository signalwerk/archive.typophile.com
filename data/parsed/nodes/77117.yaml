    <p>Hello Typophile. Long time lurker, first time poster.</p>
    <p>I need to create a banner for a band's myspace and website. They're bluesy, contemporary, and young. They have this older kick ass soul singer. The name is "Brownish Black." Any suggestions? Ideally with the "B" being the main feature.</p>
    <p>Thanks!<br>
    Rollin</p>
