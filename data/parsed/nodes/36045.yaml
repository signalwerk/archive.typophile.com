    html: |-
      <p>In the first two examples, the left-hand diagonal joins the right-hand one near the top.  In the third example, the left diagonal is two strokes, almost like in a 'k', and in the fourth, it's a very reduced bowl. To my eye, these details distinguish these four 'a' styles from a lambda.  </p>
      <p>The fundamental characteristic of lambda is the two diagonal strokes, the left one meeting the right at about its halfway point.  This is what makes your 'a' look like lambda, and it doesn't have any other details that make it look less like lambda.</p>
      <p>Of course, do what you like.  I still think the font looks great. :)</p>
