    html: |-
      <p>Thank you very much, Matt.</p>
      <p>I just made a small research for greek types and what I saw is that minuscule 'lambda' always have an accender. Something like a rotated 'y'. So, in the situation when we isolate my latter 'a' I agree with you that it looks like a lambda, but when we see it in a text (context), I think it is difficult not to read it as an 'a'. I was really thinking about that, so I made what could be a minuscule lambda in this typographic style. Please, tell me what you think about it.</p><div class="imageWrap"><img src="http://typophile.com/files/roman-greek_4781.gif"></div><p></p>
