    html: <p>There is no precedent in the other letters for the points at the top of the M to be sharp. Either introduce the sharp somewhere else, or shave the tops off the M. I'd say that the S has more flavor than the other characters. Either calm down the S or make the other characters move a little more. By itself, the S is pretty cool. The top of the R needs to be different from the P. The C is beautiful.</p>
