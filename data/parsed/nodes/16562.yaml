      <p>Koleslaw: There are lots of other "hip-hop" inspired fonts out there, none of which are very notable as of yet. I suggest you avoid looking at any of them for reference.</p>
      <p>This one is an okay stab at it all, however I suggest a little more research on the topic of graffiti "handstyles." You have some good weight going on here, but I think its overall shapes are too "safe" to be associated with hip-hop. I would love to see more contrast in the line weight. </p>
      <p>Graffiti has some distinct explorations in its glyphs; fueled by the tool, speed, individuality, influence, and lack of knowledge when it comes to traditional lettering (I feel this is a positive thing). A good hand came from refining your alphabet till its quirky characteristics matched stylistically, but not in a modular sense. </p>
      <p>Try holding your marker at a higher degree, maybe 45?</p>
      <p>The "S" is a little troubling compared to the rest also.</p>
      <p>Hope that helps</p>
