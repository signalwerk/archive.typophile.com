      <p>Wes, I agree that this is a "safe" execution. It's intentional- hence, the "hint" of graffiti flavor. I want this first to be legible- unlike most of the existing graffiti fonts out there. Ironic, huh? I'm trying to push the limits- to keep just an ounce that spontaneous drawn quality and ride the fine line that keeps it close to traditional letterforms. In the end, it's more graffiti-inspired than graffiti itself.</p>
      <p>I'm seeing this being used in print at small sizes, which is why i decided to go more monoweight with it.</p>
      <p>So now, ignoring the mentioned graffiti aspect of this, and considering the attractiveness of the letterforms, any other critiques? Good point about the "S." Thanks for your comments!</p>
