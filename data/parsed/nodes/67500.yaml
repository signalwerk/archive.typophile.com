    <p>I don't know what to look for in a printer - and a search didn't show any results (how can that be?), so I'll ask here. A printer I've been recommended is Samsung CLP-310N, but I have no idea if this is a good printer.</p>
    <p>I want a printer that gives good results with printing text, but also good enough results with printing some graphics/photos.</p>
    <p>I'm gratful of any recommendations and help on this topic.</p>
