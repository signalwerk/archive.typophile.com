      <p>@ Tor</p>
      <p>As you can see <strong><a href="http://www.druckerchannel.de/artikel.php?ID=2332&amp;seite=10&amp;t=textdruckqualitaet_und_tempo" rel="nofollow">here</a></strong>, the Samsung CLP-310N prints text too fat – in total contradiction to the Samsung monochrome printers. And this matches with what a acquaintance of mine has said about that Samsung. I really think, that these pictures taken with a microscope, are meaningful. And I doubt, that you can get a good color laser printer for the price of the Samsung CLP-310N. Printing text and pictures in high quality is actually impossible in that league.</p>
