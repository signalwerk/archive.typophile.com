    html: <p>It was a toss-up for me between Brother and Epson. I finally ended up with one of the new, sleek black Epson Colorio models. The Mac drivers seem solid, and having six inks lets you print photos more nicely. The advantage with Brother printers was (IIRC) their special ink that doesn't make the paper soggy, and handling of larger paper sizes.</p>
