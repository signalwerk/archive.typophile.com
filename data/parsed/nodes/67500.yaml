      <p><a href="http://typophile.com/node/33734" title="http://typophile.com/node/33734">http://typophile.com/node/33734</a></p>
      <p>I posted the link to the German Forum <strong><a>Druckerchannel</a></strong> in that thread. HP printers have a tendency to print too thin. My Samsung prints relatively close to the outline, but it looks a bit too thin. And the a printed with almost all HP monochrome printers looks much thinner. Just compare the photos taken with a microscope from the printed Palatino letter a with the original outline. I would not buy one of the HP printers, that were tested on Druckerchannel. Samsung or Brother. Maybe Lexmark, because of the resistance of the toner against mechanical influences like folding the paper.</p>
    html_clean: |-
