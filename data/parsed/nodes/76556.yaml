      <p>Another way of explaining it:</p>
      <p>You don't refer to characters in text by that kind of decimal codepage-based encoding without also specifying what encoding you're using. Generally, you don't use such encodings at all, but Unicode instead. OS-level machinery will translate Unicode into the appropriate OS-specific codepages for older apps that are using codepages, so the font creator doesn't have to worry about it. The main point of ever looking at those old codepages, for somebody building a font today, is for ensuring that you are covering all the encoded characters in a given codepage.</p>
      <p>Cheers,</p>
      <p>T</p>
