    <p>I am looking for a way to label fonts using a particular Unicode position. (This is for testing web fonts - testing exactly which font file in the @font-face stack the browser is displaying. In other words, is it the EOT, the WOFF, the SVG, the Data URI - which one is the browser using?)</p>
    <p>The question is: Which Unicode position to use for this purpose? (Latin-centric.)</p>
    <p>The main boundary condition is that there be a near zero chance of conflict with a glyph that already exists in the font. And if there is a conflict, that there be no unwanted side effects stemming from simply replacing it with the marking glyph.</p>
    <p>Right now, the best candidate seems to be the Apple logo from the MacRoman codepage with a position in the Private Use area, Unicode 63743 (U+F8FF).</p>
    <p>Anybody see a problem with this?</p>
    <p>Anybody have a better idea?</p>
    <p>Thanks,</p>
    <p>Rich</p>
