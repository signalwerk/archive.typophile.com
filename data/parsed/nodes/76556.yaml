      <p>@ Richard</p>
      <p>I did not read the whole thread, so someone may already have said it: You only want to know, which format is used – eot, woff and so on? And you want to store that information as a character in the font, in which the page normally is displayed? Why don’t you simply provide fonts on the first place of each font stack, that contain only that key character? Then you had not to replace the character in each of the fonts, that you want to test, but you only had to create a few test fonts.</p>
      <p>Example for woff and eot: The page shall be displayed in Charter and you have embedded Charter.woff and Charter.eot. Additionally you embed fonts, that are called Woff.woff and Eot.eot. The font Woff.woff contains the letter W and the font Eot.eot the letter E on the position of the apple for example. And your stack would be "font-family: Woff, Eot, Charter". In the stack they should be in the same order, in which they are embedded. (Or in the other way around, if it also cascades.)</p>
      <p>Clear, what I mean? You don’t mark all web fonts, that you want to test, but only a few test fonts (very small files), that you additionally provide in the stack.</p>
