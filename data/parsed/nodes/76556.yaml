      <p>Apple's restrictions may apply to the use of the Apple logo, i.e. both the actual drawing of the apple, and, possibly, the glyph name "apple". They most certainly don't apply to a use of any particular codepoint. </p>
      <p>Indeed, quite a few font vendors have been using U+F8FF to put a vendor sign there. So this seems to be good practice. Rather than using the glyph name "apple", I recommend to use the glyph name "uniF8FF", which will keep your hands 100% clean.</p>
