      <p>Oh, I see. Essentially, what you're asking for is a glyph that, in a way, should be unique in every font file (even format). Interesting concept. I've never thought about this in that way. </p>
      <p>I doubt the industry will ever agree on a "standard practice" here. This would involve a rather different workflow: you'd need separate fonts that you feed into the WOFF and EOT conversion workflow. I doubt many people will do that. </p>
      <p>That having said that, the entire Private Use Area is at your disposal. U+F8FF could be one candidate, a neighbor codepoint (e.g. U+F8FE) or perhaps the very first PUA codepoint (U+E000) could be other candidates. But the point obviously is that PUA is, by definition, private. So not much chance to get it adopted as an industry-wide standard practice. </p>
      <p>Also, I doubt that you'd really need to include such character is every single webfont that is shipping, right? It's enough to produce a set of test fonts which all have a different glyph in the same codepoint. Actually, this is something I might have a chance to get around doing. </p>
      <p>Best,<br>
      Adam</p>
