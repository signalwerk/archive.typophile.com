      <p>Thanks for the explanation, Thomas. It was clear that there was a codepage to Unicode mapping layer somewhere and that codepages, at least today, are little more than language-specific character lists. (Correct me if wrong.)</p>
      <p>Adding to the confusion in the world of web development is the charset property like:</p>
      <p>&lt;meta http-equiv="Content-Type" content="text/html; charset=ISO-8859-1"&gt;</p>
      <p>which probably only one web dev in 10,000 understands other than, "Well, it's something you *have* to include on the page." (But that, on desktop browsers, at least, you can easily override with other selections. Adding to the confusion.)</p>
      <p>In English language pages, I've seen the recommendations morph over the years from Windows1252 to ISO 8859-1 (still used on the W3C's online docs), to landing, ultimately, with utf-8 which today looks like the final stop on the codepage train.</p>
      <p>Thanks.</p>
      <p>Rich</p>
