      <p>But the upside-down exclamation mark is a normal punctuation sign in Spanish! It's used at the beginning of an exclamation sentence, while the "normal" exclamation mark is used at the end. The reversed question mark and the regular question mark are used the same way: <cite>¡Hola! ¿Qué?</cite></p>
      <p>That's the thing with valid Unicode characters: using them for something other than they are intended may cause you more trouble than it's worth. The Private Use Area is best for all sorts of non-standard use. </p>
      <p>Best,<br>
      Adam</p>
