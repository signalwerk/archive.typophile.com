      <p><em>...codepages, at least today, are little more than language-specific character lists. (Correct me if wrong.)</em></p>
      <p>Yes, but note that it is strongly recommended to include at least one complete Windows 8-bit codepage in every font, and to accurately identify this codepage in the OS/2 table codepage range. MS Office apps still make use of text libraries that perform font switching based on codepage support. If a font does not support at least one codepage, it might not work at all in some MS apps.</p>
      <p>[This is true even if the intended script support for the font is something that never had a Windows 8-bit codepage defined, e.g. Devanagari. So when we make a font for such a script we include support for the Win CP 1252 Latin.]</p>
