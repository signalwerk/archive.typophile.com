      <p>My understanding is that Apple, inc. objects to font developers putting an Apple, inc. logo in the U+F8FF position unless the font in question is licensed for distribution by Apple, inc., but I cannot provide a citation for that.</p>
      <p>Since that position is in the Private Use Area, according to Unicode rules you can put whatever you want in there. That's what the PUA is for. But, since it is part of the MacRoman encoding, there is somewhat of a compulsion to fill the slot. Some font developers use that spot for a foundry logo or signature glyph of various sorts, or an apple dingbat that doesn't resemble the Apple, inc. logo. Also, U+F8FF is claimed by the <a class="freelinking external" href="http://www.evertype.com/standards/csur/klingon.html" rel="nofollow">Conscript Unicode Registry</a> for the end of the Klingon script range.</p>
      <p>You may wish to choose a different PUA position for your test glyph if these potential conflicts will interfere with your experiment.</p>
