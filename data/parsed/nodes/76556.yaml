      <p>@tp</p>
      <p>I'm looking for an across-the-board standard way to query which file has been parsed and is on display in the browser. With any font at any time. (Or at least the ones that have this marking glyph included.) Not just for a test suite, but standard practice.<br>
      Just a way to visually double-check that what you think is happening, is indeed happening.</p>
