      <p>Unless I am mistaken, for the most part, are not the various encoding tables relevant only to legacy systems nowadays, being largely supplanted by Unicode on modern computers? The MacRoman encoding I take as a guideline for the subset of Unicode glyph slots to fill in a minimally complete font, in union with Latin-1, Latin-0, and Windows ANSI to form a basic Western Latin plus extras that most computers expect, then encode the finished font as Unicode. There are both an O diaresis and ellipsis in the result, and I don't let the position in the table bother me as it doesn't seem to bother the computers.</p>
      <p>Of course for your specialized application all this that doesn't matter to me may mean a great deal to you. My apologies if I'm misunderstanding.</p>
