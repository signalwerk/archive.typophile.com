      <p>Related to my question on this thread is:</p>
      <p>In comparing various codepages I've noticed that, because of conflicting assignments between common codepages such as MacRoman and ANSI, certain positions seem to be, in effect, dead.<br>
      For example, #133 -<br>
      In MacRoman it's O diaresis<br>
      In ANSI it's a horizontal ellipsis</p>
      <p>Ok, so which is it? Or, in practice, neither?</p>
      <p>There are quite a few conflicts in the range 128 through 159. I notice the Windows Glyph List (WGL4) just bypasses them - they're not included. (And the equivalents for some of them exist elsewhere in Unicode.)</p>
      <p>I'd be interested in knowing how different font makers handle this. What do <em>you</em> put in these spots? Are they wildcards? Discretional? Left empty?</p>
      <p>Grateful for any input.</p>
      <p>Rich</p>
