      <p>I see that none of the examples has tried as hard as IBM did with Bookface Academic, or Diplomat (not available for Selectrics in the U.S., but it was available for U.K. typewriters) to be a monospaced typeface that doesn't look like a monospace typeface.</p>
      <p>Of course, trying to make a monospace version of a traditional Roman typeface <em>does</em> run the very strong risk of making a monospace typeface that looks even worse than one that doesn't do that, but IBM in those two examples seems to have managed fairly well.</p>
      <p>If you scroll down, you can see a little bit of Diplomat on <a href="http://munk.org/typecast/2011/04/25/1964-nomda-blue-book-ibm-font-styles/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">this page</a>.</p>
