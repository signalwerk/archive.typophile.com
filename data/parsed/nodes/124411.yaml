      <p>PragmataPro: <a href="http://www.fsd.it/fonts/pragmatapro.htm">http://www.fsd.it/fonts/pragmatapro.htm</a></p>
      <p>Before, I used Source Code Pro and then later Input. On my screen, at least, its rendering seems crisper. I know little about font rendering, but perhaps its narrow width with tight curves helps with this. Also, compared to the other two, scanning words is easier yet it is still easy to descern crucial details such as punctuation.</p>
