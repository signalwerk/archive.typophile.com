      <p><em>The book is very heavy, throwing its views at the reader</em></p>
      <p>But how can a girly font be so butch?<br>
      Surely it is not the font itself which is overtly heavy or sexual, these are attributes which are created by the book designer, exploiting content and context to invest the typeface with these qualities.</p>
      <p><em>That’s to say, simply changing the appearance of letters, spacing them further, making them bold, stretching them, would change the effect that the word had on the receiver and how the poem should be structured, </em></p>
      <p>These are not primarily typeface qualities, but layout qualities. </p>
      <p>***</p>
      <p>According to Saussure, the sign is completely arbitrary, i.e. there is no necessary connection between the sign and its meaning.<br>
      And so the shape of the Latin "p" signifies the sound "p" to me, but in the Greek script if signifies the sound "r". (Sorry, I would express that in phonetics if I knew how.)<br>
      The same is true for typefaces. A particular glyph in a typeface can signify different qualities to different typographers, and many things to readers, depending on how the typographer sets the face.<br>
      This is not to deny that there are broad clichés which everyone is "supposed" to get, but from a deconstructive perspective, these connotations are primarily dependent on the identity of the reader. </p>
      <p>[Sorry, this is out of order, I should have added that as a second post.]</p>
