      <p><em>Admittedly, most were “display” faces, but the same principle, I feel, works its way all the way down to the text faces.</em></p>
      <p>But surely this absence/presence of personality is the very distinction between the way that text and display types work? Readers can spot the personalities in display types, for they have the kind of noticeable idiosyncracies that are removed from text faces, both because one wants these to have a broad and generic usage and not filter the neutrality of prose that is objectively written, or imply character when called upon in successive paragraphs to represent quotes from quite different people; and secondly because peculiarities are considered to draw attention to themselves and disrupt the immersive reading experience. If the faces presented to the readers had been Minion, Times, Utopia, Quadraat, etc., I doubt the spread of personalities would have been so broad and obvious, and suspect that such traditional serifed faces would have all suggested the character of someone who is serious, bookish, and old-fashioned.</p>
