      <p>Let's talk children's books for a minute. One might think that Century Schoolbook is a boring mechanical typeface designed to help us learn how to read, and that other "childlike" faces, like Comic Sans, for example, exude silliness. What's neat about this is the irony  found in Dr. Seuss books, where the mechanical Century Schoolbook is used to illustrate very silly text, and therefore this mechanical typeface assumes a silly personality, and makes learning "fun." Maybe. At least that's how it worked for me, and that's why I still love Century Schoolbook so much. This goes along with the context theory. It is also very probable that most people's first exposure to Century Schoolbook is not in a Dr. Seuss book, but rather in a very dry mathematics text book, and for those poor folks, Century Schoolbook might forever be associated with dullness.</p>
      <p>So this begs the question, "How much does a typeface's first impression figure in to its lasting personality in a person's mind?"</p>
