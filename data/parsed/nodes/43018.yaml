      <p>It's important to note that both Pierce and Saussurean's terminology is not necessarily referring to written language.  Pierce's can be expanded to it, but Saussurean was looking exclusively at the aural v semantic distinction.  Natural languages are spoken first and written later and a lot of his research was focused on earlier prerecorded languages so it was all worked out via how the languages would have been said.  So, while for instance (using Japanese as an example), 木 means tree, 林 wood, and 森 forest, the words for these are not simply "ki", "kiki" and "kikiki" rather "ki", "rin" and "mori" (I looked up the pronunciations, they might be off, I welcome corrections), which have very little in common, although their graphic and semantic representations do link them, their aural components are quite different and unrelated with their meaning.</p>
      <p><em>«El futuro es una línea tan fina que apenas nos damos cuenta de pintarla nosotros mismos». (La Luz Oscura, por Javier Guerrero)</em></p>
