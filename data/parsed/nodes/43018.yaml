      <p>Being able to describe a difference accurately and being affected by a difference are two different things. While I will certainly concede that the non-type professional  reader will not be able to describe much about differences in type, they may still be affected by it and not perceive why. The type is just part of the whole communication piece. The type's success or failure to take part in the communication is subject to how well the whole job was done, writing, concept, layout, placement, delivery method, and audience. The skill of the graphic designer or typographer will make or break it. If you have great tires on a racecar that breaks down in a race you won't win or even know if the tires would have done their job well.</p>
      <p>ChrisL</p>
