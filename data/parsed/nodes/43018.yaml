      <p>C. S. Pierce's semiotics, rather than semiotics in the Saussurean vein, might be more applicable to type design. Pierce talks about some signs being "symbols" which, like Saussure's sign, are related to the signified only arbitrarily or conventionally -- but there are also "icons" which share resemblance with their signifieds and "indices" which share a more direct relationship (e.g. causal) with their signifieds.<br>
      So in <a class="freelinking external" href="http://en.wikipedia.org/wiki/Semiotic_elements_and_classes_of_signs_%28Peirce%29#II._Icon.2C_index.2C_symbol" rel="nofollow">Pierce's terms</a> (as I understand them):</p>
      <p>the letters d-o-g are a symbol of /dog/<br>
      a drawing of a dog is an icon of /dog/<br>
      a pawprint of a dog is an index of /dog/</p>
      <p>In which way might type design be read as a sign? I can imagine arguments for all three.</p>
