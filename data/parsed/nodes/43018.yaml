      <p>Dezcom said it best.  To put it as my old new (heh) media professor would say it, "People can understand design language without being able to speak it".  That is, in a horror film, while people might not be able to explain why the tremolo strings in heightens the tension (other than that it's a common feature in such films), they receive the intended effect.  Film is full of such examples, and type is the same way.</p>
      <p>For my masters thesis (non-type related) I had to read a book which to be as a guy was rather disgusting (something about women and liberation of women through their bodies) and something about the font was bothering me too.  It was a very feminine font, and while I think the majority of the population would get that, they might not be able to explain why it was like that.  For women I supose it would make the text more inviting, for men, well, that much more repulsive (seriously, printing a book with an x-height at 90% of your ascender/cap height?).</p>
      <p><em>«El futuro es una línea tan fina que apenas nos damos cuenta de pintarla nosotros mismos». (La Luz Oscura, por Javier Guerrero)</em></p>
