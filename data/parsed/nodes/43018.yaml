    <p>Hi fellow type addicts.</p>
    <p>I am doing a Research Project for my honors in Communication Design and I am interested in looking closely at some typefaces, and the messages they carry. After watching "typomania" from Erik Spiekermanns blog, I have become rather interested in the subject, investigating  the kind of message a certain type style carries.<br>
    I am wondering if you can help me for a list of some decent research material for this topic, be it articles, videos, pdfs, books etc.</p>
    <p>Thanks in advance!</p>
