    html: <p>I definitely agree with Nick that most people aren't going to be able to tell Univers from Helvetica, or even Garamond from Times New Roman. The general population doesn't think too much about type, but has an innate feel for its various connotations. With Nick's script example, I'd say your average person could break scripts down into smaller groupings -- fancy wedding scripts, handwritten cursive, 50s brush scripts -- but wouldn't be able to talk much about the finer points of what differentiated them. And if you asked them to look at a bunch of fonts that all qualified as ornate Spencerian scripts, or "wedding scripts," they'd have a hard time telling the difference. Almost everyone would have no trouble picking out their favorite, though -- very few could articulate why, but that never prevents people from having strong opinions.</p>
