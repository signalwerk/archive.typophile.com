      <p><em>Nick, do you not think that type of different styles has different connotations, in regards to the nature of the product it is placed on.</em></p>
      <p>No, not for the reader.<br>
      But it does have connotations for the typographer, which provide ideas for the way in which the type may be set, and the layout arranged, interacting with the other elements.<br>
      It's only when all the design variables are determined that the piece as a whole acquires a meaning that can effect the reader.</p>
      <p>For instance, the same typeface may look old-fashioned or trendy, depending on what kind of a project its used in, and how it's set.<br>
      A typeface that looks friendly and inviting can become menacing, by increasing its size and reducing its leading, or changing its colour or tone.</p>
      <p>If typefaces have "product connotations", how is it that so many typefaces can be used for many different kinds of products and readerships?</p>
