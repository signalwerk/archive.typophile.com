      <p>Oh I agree.  As a display font, or titling font, or even heading font it would have been far better for the book.  But, I think it was chosen for that reason.  The book is very heavy, throwing its views at the reader, and setting the entire book in such a font greatly aided it.</p>
      <p>I'm sure to the average reader it was far more of a subtle effect.  But, certain subtleties are lost on me.  </p>
      <p>In any case, back on the main topic, another thing that Victor may want to look comes out of the poetry world and highly relevant the discussion.  Summed up, "traditional" poetry is composed on two components: the aural and semantic.  Individuals words were only perceived to have these two qualities.  Two words could have the same semantic value, but they were unique in their aural.  However, starting in the <em>Vanguardismo</em> period (I put it in Spanish because avant-garde in English has different meanings and connotations) at the beginnings of the 1900s, views changed.  Words were then seen as having three components: the aural, semantic, and <em>graphic</em>.  That's to say, simply changing the appearance of letters, spacing them further, making them bold, stretching them, would change the effect that the word had on the receiver and how the poem should be structured, so that two words with the same semantic and aural components (which would have been identical in traditional views) could be radically different.  Iberian America is quite well known for its concrete poetry which is almost a direct result of this view. </p>
      <p>Needless to say, these ideas are quite important to typography folk.  You see it on this forum when people ask the best way to set the word "Exclusive" (I think that was the business IIRC) so that it would give off that feeling.  If it's set in Comic Sans, it becomes a joke.  In another face, antiquated.  Another, modern and hip.  But it's not the name or word or the spelling of the word that gives off that feeling rather it's the font.  In logos it's far more pronounced as it's a single word, but in body text it can be much the same.</p>
      <p>PS Some other good poets in this vain include José Juan Tablada, Carlos Oquenda de Amat, Roberto Hidalgo, and the Oswald de Andrade (and the rest of the Andrade family).</p>
      <p><em>«El futuro es una línea tan fina que apenas nos damos cuenta de pintarla nosotros mismos». (La Luz Oscura, por Javier Guerrero)</em></p>
