      <p></p><div class="imageWrap"><img src="http://typophile.com/files/graphic-01_6116.jpg"></div><br>
    Elk Grove Village, IL -- March 20, 2009 -- Ascender Corporation, a leading provider of advanced font products, today announced font software distribution agreements with four international type foundries. The font collections of Boutros International, Outras Fontes, Typodermic and URW++ feature high quality OpenType and TrueType fonts in a wide range of styles and with significant language support. These 3000 new fonts expand upon the rich selection of fonts that Ascender offers to its broad range of customers.<p></p>
    <p>The fonts are are all available immediately from the <a href="http://www.AscenderFonts.com" title="www.AscenderFonts.com">www.AscenderFonts.com</a> website.</p>
    <p>"We are proud to partner with these respected developers and to offer their font collections to both hardware and software developers and to the many creative professionals that visit our sites," said Ira Mirochnick, president of Ascender. "Each of the font collections brings unique attributes and fresh designs which we believe our customers will find appealing," he added.</p>
    <p>Ascender offers both its own fonts and the fonts it licenses from other type foundries to hardware manufacturers and software developers who require fonts to include with a product. Ascender provides multilingual fonts, user interface fonts and custom fonts for the OEM market. The new fonts from these four international type foundries will expand the font selection available to Ascender's OEM and ISV customers.</p>
    <p>Ascender also sells fonts directly to end users from its <a href="http://www.AscenderFonts.com" title="www.AscenderFonts.com">www.AscenderFonts.com</a> font website. The site features a wide range of type styles from distinctive text fonts and elegant script fonts to fashionable display fonts. AscenderFonts.com offers both OpenType and TrueType fonts with a broad selection of language and character set support. The fonts can be downloaded and installed into Windows, Mac OS X and other personal computer systems.</p>
    <p>About the Type Foundries:<br>
    Boutros International<br>
    Boutros International, headed by Mourad and Arlette Boutros, has led the field of Arabic creativity, typography, calligraphy and design for more than 40 years. The Boutros collection of Arabic fonts were created in harmony with Latin serif and sans serif typefaces. Boutros fonts feature traditional and modern design styles in various weights and type styles. This provides designers with a range of creative uses from body text to headlines and decorations. All Boutros Arabic fonts require software with support for right-to-left writing systems, such as Microsoft Office for Windows or Adobe Creative Suite Middle Eastern edition.</p>
    <p>Outras Fontes<br>
    Outras Fontes was founded in 2006 and is based in Rio de Janeiro, Brazil. Outras Fontes, which means "other fonts", is an independent digital type foundry managed by Ricardo Esteves Gomes. Mr. Gomes is a talented graphic and type designer and researcher. Outras Fontes strives to capture the creativity, diversity and beauty of the Brazilian people and bring new type designs to the typographic community around the world.</p>
    <p>Typodermic<br>
    Typodermic is the commercial type foundry of the prolific type designer, Ray Larabie. In 1995 Ray started creating and his first digital fonts and in 2001 established Typodermic to sell his commercial fonts. Typodermic fonts feature a fresh and exciting array of styles. Ascender offers all of the original Ray Larabie and Typodermic fonts for purchase &amp; download by end-users and for licensing to software &amp; hardware developers. Ascender can also modify and customize any of the Larabie and Typodermic fonts as required by customers.</p>
    <p>URW++<br>
    URW++ is based in Hamburg, Germany and has a rich history in type design and production. Founded in 1995, URW ++ is the successor of the company URW Software &amp; Type GmbH, a pioneer in digital font production and the inventor of the Ikarus outline type technology. Today the URW++ team has 15 highly sophisticated and experienced international type experts, both in design and production. They specialize in OpenType fonts with extensive character sets, including support for Western and Eastern European markets, and with Greek and Cyrillic as well. The URW++ font collection has an impressive mix of classic and modern designs, and new and fresh typefaces from their type studio. Their profonts library features a large collection of beautiful script fonts with extensive OpenType typographic including ligatures, stylistic alternates and swashes.</p>
    <p>About Ascender:<br>
    Ascender Corporation is a leading provider of advanced font products. Ascender's founders are font industry experts and have been involved in developing many of the most important and influential fonts used in computers, mobile devices, consumer electronics and software products. Ascender provides multilingual, custom font development for a wide range of customers including creative professionals, enterprises, software developers and hardware manufacturers. Ascender also provides an extensive collection of TrueType &amp; OpenType fonts for download to graphic designers and consumers through its font websites, including <a href="http://www.AscenderFonts.com" title="www.AscenderFonts.com">www.AscenderFonts.com</a>.</p>
    <p>Contact: Bill Davis<br>
    Ascender Corporation<br>
    25 Northwest Point Blvd, Suite 225, Elk Grove Village, IL 60007 USA<br>
    Phone: (847) 357 0730<br>
    Fax: (847) 357 0731<br>
    English: <a href="http://www.ascendercorp.com" title="http://www.ascendercorp.com">http://www.ascendercorp.com</a><br>
    German: <a href="http://www.ascendercorp.de" title="http://www.ascendercorp.de">http://www.ascendercorp.de</a></p>
