    html: "<p>And finally, for your amusement. This has been kicking around the hard drive for some time now. <br> <br> <br>Meanwhile, for your amusement: <br> <br> <br> The NATO phonetic alphabet: <br> <br> Alpha Bravo Charlie Delta Echo Foxtrot Golf Hotel India <br> Juliet Kilo Lima Mike November Oscar Papa Quebec Romeo <br> Sierra Tango Uniform Victor Whiskey Xray Yankee Zulu <br> <br> <br> From a Swedish (also from a Dutch) telephone directory: <br> <br> Alfred Benjamin Charles David Edward Frederick George Harry <br> Isaac Jack King London Mary Nellie Oliver Peter Queen Robert <br> Samuel Tommy Uncle Victor William Xray Yellow Zebra. <br> <br> <br> The ARRL (American Radio Relay League) version: <br> <br> Adam Baker Charlie David Edward Frank George Henry Ida John <br> King Lewis Mary Nancy Otto Peter Queen Robert Susan Thomas <br> Union Victor William X-ray Young Zebra <br> <br> [also Adam Boy (?)] <br> <br> <br> From a book entitled \"The Complete Morse Instructor...\" (1944): <br> <br> able baker charlie dog easy fox george how item jig king love <br> mike nan oboe peter queen roger sugar tare uncle victor william <br> x-ray yoke zebra <br> <br> [This one seems to have undergone quite a lot of evolution. <br>  Entries also cited: cast, hypo, inter, negat, over, prep ] <br> <br> <br> From a Dutch telephone directory: <br> <br> Amsterdam Baltimore Casablanca Danemark Edison Florida Gallipoli <br> Havana Italia Jerusalem Kilogramme Liverpool Madagascar New York <br> Oslo Paris Quebec Roma Santiago Tripoli Uppsala Valencia <br> Washington Xantippe Yokohama Zurich <br> <br> [Perhaps 'international' more than 'English'] <br> <br> <br> ***** FRENCH ***** <br> <br> Contributor: Erik Tjong Kim Sang  <br> <br> anatole bernard cécile denise émile françcois g'erard <br> henri isidore jean kléber louis marcel nicole oscar pierre <br> quital robert suzanne thérèse ursule victor wagon xavier <br> yvonne zoé <br> <br> <br> ***** GERMAN ***** <br> <br> [two slightly different versions] <br> <br> Contributor: <a href=\"mailto:mrosa@eso.org\">mrosa@eso.org</a> (Michael Rosa) <br> <br> Anton Berta Caesar Dora Emil Friedrich Gustav Heinrich Ida <br> Julius Karl Ludwig Martha Nordpol Otto Paula Quelle Richard <br> Siegfried Theodor Ulrich Viktor Wilhelm Xanthippe Ypsilon <br> Zeppelin <br> <br> Umlaut: Ärger Ödipus Übel <br> <br> More recent replacements: Konrad Zacharias <br> <br> <br> Contributor: Erik Tjong Kim Sang  <br> <br> anton bertha cäsar dora emil friederich gustav heinrich ida <br> julius kaufmann ludwig martha nordpol otto paula quelle <br> richard samuel theodor ulrich viktor wilhelm xanthippe <br> ypsilon zacharias <br> <br> ä           ärger <br> ch           charlotte <br> ö           ökonom <br> sch          schule <br> ü           übermut <br> <br> <br> ***** DUTCH and FLEMISH ***** <br> <br> Contributor: Erik Tjong Kim Sang  <br> <br>    Dutch     Flemish <br> a  anna      arthur <br> b  bernhard  brussel <br> c  cornelis  carolina <br> d  dirk      desire <br> e  eduard    emiel <br> f  ferdinand frederik <br> g  gerard    gustaaf <br> h  hendrik   hendrik <br> i  izaak     isidoor <br> j  jan       jozef <br> k  karel     kilogram <br> l  lodewijk  leopold <br> m  marie     maria <br> n  nico      napoleon <br> o  otto      oscar <br> p  pieter    piano <br> q  quotient  qualite <br> r  rudolf    robert <br> s  simon     sofie <br> t  teunis    telefoon <br> u  utrecht   ursula <br> v  victor    victor <br> w  willem    waterloo <br> x  xantippe  xavier <br> ij ijmuiden  - <br> y  ypsilon   yvonne <br> z  zaandam   zola <br> <br> <br> ***** ITALIAN ***** <br> <br> Contributor: <a href=\"mailto:ebuie@sed.csc.com\">ebuie@sed.csc.com</a>     (Elizabeth Buie) <br>              <a href=\"mailto:ebuie@starlab.csc.com\">ebuie@starlab.csc.com</a> <br> <br> Ancona, Bologna, Como, Domodossola, Empoli, Firenze, Genova, <br> Imola, Livorno, Milano, Napoli, Otranto, Pisa/Palermo, <br> Quartomiglio, Roma, Savona/Siena, Torino, Udine, Venezia, <br> Zara. <br> <br> Cities represent the letters of the Italian alphabet.  In addition, <br> there are five other letters that are used in loan words from other <br> languages but that are not part of the Italian alphabet: <br> <br> <br> J = Jolly <br> K = Kappa <br> W = Wagner <br> X = Xilofono <br> Y = York <br> <br> <br> ***** SWEDISH ***** <br> <br> Contributors: <a href=\"mailto:simon@dront.nada.kth.se\">simon@dront.nada.kth.se</a> (Simon Tardell) <br>               Jonas Wallgren  <br> <br> Adam, Bertil, Cesar, David, Erik, Filip, Gustav, Helge, <br> Ivar, Johan, Kalle, Ludvig, Martin, Niklas, Olof, Petter, <br> Quintus, Rudolf, Sigurd, Tore, Urban, Viktor, Wilhelm, <br> Xerxes, Yngve, Zäta, Åke, Ärlig, Östen. <br> <br> NB that W does not belong to the Swedish alphabet <br> (it is merely considered a graphical variant of V). <br> <br> <br> ***** FINNISH ***** <br> <br> Contributor: Jukka Rahkonen  <br> <br> Aarne Bertta Celcius Daavid Eemeli Faarao Gideon Heikki Iivari <br> Jussi Kalle Lauri Matti Niilo Otto Paavo Kuu Risto Sakari Tyyne <br> Urho Ville Viski Äksä Yrjö Tseta Åke Äiti Öljy</p>"
