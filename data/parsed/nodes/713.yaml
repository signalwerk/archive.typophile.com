  html: <p> OK, this has at least one instance of each letter in uppercase and lowercase. <br> <br>Alec Beverly Caleb David Egbert Fred Gordon Howard <br>Imogene Jasper Katja Lyle Monique Nigel Ozwald <br>Philip Quentin Rex Svenja Tiffany Udo Viggo <br>William Xander Yeardley Zeke <br> <br>Now I just need Icelandic names starting with and containing Eth and Thorn, and one German first name containing eszet, and I'll have a finished list. Anyone here know Icelandic? </p>
