    html: <p> Hey Sigurarm, thanks for the info! <br> <br>The uppercase Icelandic Eth looks pretty close to a D, so that's OK, but I would like to find a few names with the lowercase eth as one of the other letters. I love the lowercase eth. It's like a partial differential having a bad hair day. <br> <br>I don't want to worry about including all the diacritics just yet. Maybe one instance of each kind of mark (tilde, ring, accents, hungarumlaut, and whatnot) later on. Right now I just want a good exemplar for all the Latin "main" letters. Eszet is technically a ligature, so I might drop it from consideration for now. </p>
