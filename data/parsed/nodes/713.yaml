    html: <p> Jonathan Hoefler tells an interesting story that he was in the middle of a project of creating swashes for Hoefler Text and he was trying to design a capital swash Eth. Some icelandic poet set him straight -- according to the poet there are NO words that begin with Eth in icelandic, as Sigurdur alluded to. <br> <br>(No, we're not pals -- I sat in on his lecture when he and T F-J were in Minneapolis recently) </p>
