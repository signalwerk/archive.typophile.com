  html: <p>Hi out there, <br> <br>Below is a concept for updating an identity (Donovans) that for the past thirty years has used a scripty like font in a couple variations. Here's their website to see the logo in action http://www.donovans.ca (we didn't design the site). In one of the initial meetings with Donovans, they mentioned that wanted to explore a totally different direction b/c they are moving to a new location and it wasn't bold enough when contained in logo soup.  <br> <br>Donovans is a women's clothing store that caters to the thirty-five to fifty year old professional. Similar stores would include Lord &amp; Taylor and Marshal Fields. Part of my inspiration came from http://www.miumiu.com/ and http://www.jjill.com where the logotypes visually seemed pretty interesting.  <br> <br>Unfortunately, in the end they felt they had too much equity in the script and decided that is where the energy should be spent in making it better. Too bad, but I guess that's why design is considered a business rather than art. As a critique visually, any comments? <br> <br>Thanks, <br>Michael <br> <br><img src="http://www.typophile.com/forums/messages/29/1400.gif" alt="surtees_donovans.gif"></p>
  html_clean: <p>Hi out there, <br> <br>Below is a concept for updating an identity (Donovans) that for the past thirty years has used a scripty like font in a couple variations. Here's their website to see the logo in action http://www.donovans.ca (we didn't design the site). In one of the initial meetings with Donovans, they mentioned that wanted to explore a totally different direction b/c they are moving to a new location and it wasn't bold enough when contained in logo soup.  <br> <br>Donovans is a women's clothing store that caters to the thirty-five to fifty year old professional. Similar stores would include Lord &amp; Taylor and Marshal Fields. Part of my inspiration came from http://www.miumiu.com/ and http://www.jjill.com where the logotypes visually seemed pretty interesting.  <br> <br>Unfortunately, in the end they felt they had too much equity in the script and decided that is where the energy should be spent in making it better. Too bad, but I guess that's why design is considered a business rather than art. As a critique visually, any comments? <br> <br>Thanks, <br>Michael <br> <br><img src="http://www.typophile.com/forums/messages/29/1400.gif" alt="surtees_donovans.gif"></p>
