    html: <p> It's amazing. I thought, as did Michael, along  <br>those same lines ... ergo 'the discriminate  <br>dominatrix.'  <br> <br>one of the problems I can see is that you've a few too <br> many typographic/graphic tricks going on for such a  <br>small word. The 'S'seems foreign and too open. the 'V' and  <br>the 'A' seem foreign as well... or maybe it should be said  <br>that the "ONO .. N" are one family, the "VA" are another,  <br>the "S" a third and the "D" a fourth. I like the idea behind  <br>the "D", but then the trick is gone and it is all monoline  <br>and round then it is monoline and sharp and so on.  <br>Could you incorporate the trick of the "D" somewhat in  <br>the "N"s? I think the "D" is strong, but because of how  <br>strong it is, visually, it is alienating the other characters. <br> <br>after reading this ... "trick" is too strong a word. "style"  <br>suits my thoughts more. </p>
