    html: |-
      <p>Most likely custom. One-off signs like this were still mainly a hand craft in the 60s. The <strong>P</strong> and the <strong>R</strong> are relatively wider than all the other characters, suggesting the designer was drawing inspiration from more than one alphabet. </p>
      <p>The <strong>P</strong> and the <strong>R</strong> are close to Friz Quadrata, but that font wasn't designed until 1973, so if this sign really dates back to the 60s, your hunch about Albertus is right on.</p>
