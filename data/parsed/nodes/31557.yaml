    <p>Hi folks,<br>
    This sample shows what at first seems to be a hand-printed ad, but closer inspection shows that it is a font with 2 or 3 variations of most letters (some might be part of ligatures). This screams OpenType, but so far the only hand-printing font I know like this is <a href="http://www.myfonts.com/fonts/madtype/casino-hand/" rel="nofollow">Casino Hand</a> by Matt Desmond. The thing that makes this work so well is that the lettering looks so natural.</p>
    <p>Does anyone recognize it? I wonder if the 'cheap, easy-to-make hand-printed fonts' have just moved into the world of OpenType.</p>
    <p>Thanks,<br>
    - Mike</p>
