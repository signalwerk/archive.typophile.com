      <p>This is mailnly to bump this one back into visibility. I found a similar-looking font in Chank's GFY Handwriting Fontpak, called <a href="http://www.myfonts.com/fonts/chank/gfy-handwriting-fontpak/gfyjeanna-regular/" rel="nofollow">GFYJeanna</a>, which comes in an OpenType version, but the character maps give little idea of more than a few optional characters. It's only similar stylistically -- no letters are identical to my sample. I'm hoping someone knows of another casual OpenType hand-printed font.</p>
      <p>- Mike Yanega</p>
