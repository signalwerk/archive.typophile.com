      <p>Thanks David, for alerting me to a new foundry, but in looking at their planned font offerings, there's nothing similar to this casual script printing style. There are an increasing number of OpenType fonts coming on the market, but I'm looking for something besides Casino Hand that looks hand-made, and contemporary, like the sample.</p>
      <p>- Mike Yanega</p>
