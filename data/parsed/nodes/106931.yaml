  html: <p>Annoying, but seems harmless... font designed in TypeTool 3 and FDK 2.5 on Win 7. There's a similar issue with the League of Movable Type's Linden Hill (but its icon shows a sigma, square root, notequal). My guess is something to do with codepages. TIA</p>
