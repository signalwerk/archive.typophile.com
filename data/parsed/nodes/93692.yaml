    html: "<p>Even if I'm clearly not sure it's not a typeface, here are some similars: <a class=\"freelinking external\" href=\"http://www.myfonts.com/search/neuropol\" rel=\"nofollow\">Neuropol</a> (mixing all Neuropol could get you pretty close, using for instance horizontally mirrored /m for /w), <a class=\"freelinking external\" href=\"http://www.myfonts.com/fonts/linotype/eurostile-candy/\" rel=\"nofollow\">Eurostile Candy</a>, <a class=\"freelinking external\" href=\"http://www.myfonts.com/fonts/phatphonts/equaliser/\" rel=\"nofollow\">Equaliser</a></p>"
