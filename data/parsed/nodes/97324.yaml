  html: |-
    <p>The company I'm trying to help has either lost or was never given the original eps/psd for their logo.  Logo's about 6yrs old I believe, and the designer was out of Quebec.  I've included both the English and French versions.</p>
    <p>There appear to be at least two fonts being used here, one for "STEEL" and one for "Plus Network Inc".  Possibly three - I'm not sure the "S" and "TEEL" come from the same font.</p>
    <p>For "STEEL", WhatTheFont gave me Snv D Extra Cond as the best match, but it doesn't quite match up for line thickness, length of the middle bar on the "e", etc.</p>
    <p>Thanks much for taking a look!</p>
