      <p>Dear Ali Moshref!<br>
      First of all I am grateful to you liking my work.<br>
      As for as the style of dot/Nuqta is concern I think the style shown by you in picture is actually a Shikasta Style not a Nastlique Style.</p>
      <p>My father is Internationally award holder calligrapher in Nastalique type of Calligraphy. So, He knows very well that which type of dot is used in Nastalique font.</p>
      <p>even then I will discuss this matter with my father...!<br>
      Thanks again...!</p>
