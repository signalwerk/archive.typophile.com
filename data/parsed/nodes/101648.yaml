    <div class="imageWrap"><img src="http://typophile.com/files/iqbal shair_5882.gif"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/quran sora_5433.gif"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/zishan shair_3907.gif"></div><p></p>
