      <p>Well you hardly mentioned anything about the nature of your client so you're really just deferring to our personal taste, which is even less relevant than your own. Use the font that says what it needs to say.</p>
      <p>That said, I think Vielzweck in a medium weight has a structural feel that would suit an industrial design firm and is also hip looking.</p>
      <p>Or just use DIN. No designer will ever reject DIN Schriften.</p>
