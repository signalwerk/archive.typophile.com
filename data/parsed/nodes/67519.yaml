  html: |-
    <p>I'm trying to decide, in order to make a recommendation, between 2 typefaces my client has picked as favorites. The client is a pretty hip industrial design firm that designs and builds department store displays. The project is an updated website, I'm the developer (with a little design in my background). I'm assisting in the visual design of the site and we're doing a bit of design back and forth. So, there's 2 faces that my client really likes, one option is PTL Vielzweck, the other is FF Max. </p>
    <p>I think I'm torn between what I like personally and what might suit them. I feel FF Max has a dated feel already and wouldn't work that great in small sizes on screen. I really like DIN, so I'm digging Vielzweck, which I think would really stand the test of time and taste, but maybe it's too plain and lacks 'style'. I guess I should mention when my client did the initial layout he used screen grabs of FF Max, so he might be leaning that way.</p>
    <p>What do you think, should I let my own taste determine?<br>
    Is this the type of thing it's fair to ask of a Design forum here at Typophile? </p>
    <p>Thanks. Kind regards,<br>
    Dave</p>
