      <p>Thanks to both of you. Bill, you're right about not mentioning about the nature of my client. 'pretty hip' isn't a very good descriptor.  He does like to change their logo alot, which I kinda like... maybe a better question would have been along the lines of something more technical, not sure. </p>
      <p>Anyway, I really like the Vielzweck, didn't know the translation was mutlipurpose, pretty neat! I started some design with DIN and then when I came back here and read your posts I thought, heck I'm buying Vielzweck. If they don't wanna use it I'll use it for something else. In addition to the good feeling I get buying type I'm digging the Open Type these days.</p>
      <p>I'm doing some work with Vielzweck and thinking about a nice compliment for text. I saw someone posting about Hunter and Caecilia or another slab serif with Gotham. I have a feeling the same might hold true for Vielzweck. Any suggestions or technical tips for choosing a second typeface? I've read contrast is key. Maybe seriffed, with a light feel and italic?</p>
      <p>Thanks again.</p>
