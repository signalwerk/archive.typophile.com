    <p>Hi everyone,</p>
    <p>I'm new here. I'm redesigning the 7th edition of my book How to Cheat in Photoshop, which is set in Rotis (yes, yes, yes, I know, but the first edition came out in 2001 and I haven't got around to changing it since).</p>
    <p>So I looked around for a suitable caption/headline font - the captions are all sans - and wanted a spurless sans because it appeals to me. I'd just about settled on Daxline, which has the look I'm after, when I came across a discussion of it here (from 5 years ago) which mentioned Karbon.</p>
    <p>I've checked out Karbon, and I really like it. But I also like Daxline.</p>
    <p>I've made a mistake buying fonts before, ending up with poor letter and word spacing and no decent kerning pairs. Does anyone have hands-on experience of these two? Can you vouch for them? And, the tricky question: which should I choose?</p>
    <p>Also - as a secondary matter - can anyone recommend a good serif font to go with them, for the longer pieces in the book?</p>
    <p>Thanks</p>
    <p>Steve</p>
