    html: |-
      <p>I'm not sure if it was ever a commercially available font since it was a promotional ad for Suddler &amp; Hennessey (Lubalin was once their VP/Creative Director) and may have been one of their unique headline film fonts.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/herb_lubalin_116_4154.JPG"></div><br>
      The closest re-appearance of the face I found was Lubalin's "oh! ah!" letterhead design (featured in U&amp;lc) which was actually handlettered by <a href="/wiki/Tony%20Di%20Spigna" class="freelinking" rel="nofollow">Tony Di Spigna</a>.<p></p>
