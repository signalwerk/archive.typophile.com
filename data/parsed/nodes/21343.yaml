    html: |-
      <p>Hi Sandro</p>
      <p>Yes, I too am proud to be a Neutraphile. You can find the original source <a href="https://web.archive.org/web/20191008161407/http://www.neutra.org/index.html">right here.</a></p>
      <p>Wouldn't it be cool if you could buy the typeface there too?</p>
      <p>The good people at House Industries recently sent me their current lovely poster which of course, has samples of Neutraface. I assume you know all about <a href="https://web.archive.org/web/20191008161407/http://www.houseind.com/index.php?page=showfont&amp;id=18">their site.</a> </p>
      <p>Taschen have a lovely and enormous hardback book – a monograph about Neutra himself and I think the lettering features in the book, but I'm not sure. There is also the <a href="https://web.archive.org/web/20191008161407/http://www.taschen.com/pages/en/catalogue/books/architecture/all/facts/03650.htm">paperback.</a></p>
      <p>And finally you could try looking at <a href="https://web.archive.org/web/20191008161407/http://www.houseandgarden.com/"> House &amp; Garden magazine</a> because I think Neutraface got used for their big redesign – again I don't know who did this work or how recently, but the type sure looks nice.</p>
