  html: <p>It almost looks like a version of <a href="http://www.fonts.com/findfonts/detail.asp?pid=204592" target="_blank">Bandolero</a> that has been customized by effectively flipping some of the letters (i.e. the openings are now on the bottom, rather than the tops of the stems). <br> <br>This may be nothing more than a coincidental resemblance, however.</p>
