      <p>Based on those screen shots:</p>
      <p>Probably what follows is worthless, I don't really know what I'm doing, but this has worked for me (with fonts small enough that FontLab can handle them) when there were naming issues.</p>
      <p>First thing I would do, without knowing why -- just because it has worked -- is to click on the big red "X" in the Additional Open Types dialog panel. That resets things. Let FontLab build what it wants.</p>
      <p>And as a note, I'd watch the parentheses in the copyright information panel. With PostScript Type 1 &amp; Windows, anyway, they are invalid -- you need to use the escape characters -- \(C\).</p>
      <p>Save it as a .vfb.</p>
      <p>Now, export it as whatever it is (TrueType? PostScript?). Maybe even use an OpenType format. </p>
      <p>Problem is, you might solve one issue &amp; create others by doing this.</p>
