      <p>This may have something to do with it:</p>
      <p><a href="http://support.microsoft.com/kb/295062" title="http://support.microsoft.com/kb/295062">http://support.microsoft.com/kb/295062</a></p>
      <p>Particularly in light of:</p>
      <p><em>Microsoft Office does not support custom fonts. This includes any fonts that were manipulated by a font or typography program.</em></p>
      <p>Is FontForge leaving telltale metadata that is being picked up by word? Have you tried opening the saved file with TTX and running a search? Also, if the naming metadata does not conform to Word standards this could be causing problems. It might be worth checking <a class="freelinking external" href="http://forum.fontlab.com/index.php?topic=313.0" rel="nofollow">Adam Twardoch's updated naming guide</a>.</p>
