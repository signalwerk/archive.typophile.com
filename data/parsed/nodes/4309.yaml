  html: <p>As a lark I'm  making my own fake dictionary entries in Photoshop. For authenticity's sake I'm trying to use all the pronunciation symbols (&amp;#601; [schwa], &amp;#331; [ng], etc.) and finding a font that has full support is frustrating.  Right now I'm just using Times New Roman, but it's not quite right, though it has support for some of the symbols. Anyone know any better fonts out there to make a good Oxford English Dictionary spoof?</p>
