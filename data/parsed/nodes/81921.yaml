    <p>Hiya folks. I need some help identifying this font to reproduce a client's original artwork for T-shirt printing. Any help would be greatly appreciated.</p>
    <p>Of note is the shape of the little hook in the "r", and the way the terminals of the legs have those weird creases into the serifs.</p>
