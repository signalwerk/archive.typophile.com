  html: |-
    <p>I have a problem with a .otf font in Windows. I has been used in different MS Office applications where it worked fine until today, where it stopped working – I don't have more information from the client than this font preview image attached. They've tried to remove the font and reinstall it – still not working. The fact that it used to work but suddenly not, seems strange to me...</p>
    <p>Any clues?</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/image001_6438.jpg"></div><p></p>
