    html: <p>What you call “wedding fonts” are usually referred to as “formal scripts”. Look for “casual scripts” or “brush scripts” such as <a href="https://www.fontfont.com/fonts/masala-script?aid=2" rel="nofollow">FF Masala Script</a>, <a href="https://www.fontfont.com/fonts/market?aid=2" rel="nofollow">FF Market</a>, <a href="http://www.myfonts.com/fonts/mika-melvas/signalist/?refby=typographica" rel="nofollow">Signalist</a>, <a href="http://www.myfonts.com/fonts/sudtipos/hipster-script-pro/?refby=typographica" rel="nofollow">Hipster Script</a>, <a href="http://www.houseind.com/fonts/signpainterfontkit/viewfonts" rel="nofollow">House Script</a>, <a href="http://www.myfonts.com/fonts/underware/bello/?refby=typographica" rel="nofollow">Bello</a>, <a href="http://www.myfonts.com/fonts/filmotype/lucky/?refby=typographica" rel="nofollow">Filmotype Lucky</a>, and <a href="http://www.myfonts.com/fonts/sideshow/coffee-service/?refby=typographica" rel="nofollow">Coffee Service</a>.</p>
    html_clean: <p>What you call “wedding fonts” are usually referred to as “formal scripts”. Look for “casual scripts” or “brush scripts” such as <a href="https://www.fontfont.com/fonts/masala-script?aid=2" rel="nofollow" class="link-external">FF Masala Script</a>, <a href="https://www.fontfont.com/fonts/market?aid=2" rel="nofollow" class="link-external">FF Market</a>, <a href="http://www.myfonts.com/fonts/mika-melvas/signalist/?refby=typographica" rel="nofollow" class="link-external">Signalist</a>, <a href="http://www.myfonts.com/fonts/sudtipos/hipster-script-pro/?refby=typographica" rel="nofollow" class="link-external">Hipster Script</a>, <a href="http://www.houseind.com/fonts/signpainterfontkit/viewfonts" rel="nofollow" class="link-external">House Script</a>, <a href="http://www.myfonts.com/fonts/underware/bello/?refby=typographica" rel="nofollow" class="link-external">Bello</a>, <a href="http://www.myfonts.com/fonts/filmotype/lucky/?refby=typographica" rel="nofollow" class="link-external">Filmotype Lucky</a>, and <a href="http://www.myfonts.com/fonts/sideshow/coffee-service/?refby=typographica" rel="nofollow" class="link-external">Coffee Service</a>.</p>
