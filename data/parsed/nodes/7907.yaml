  date_raw: 29 Nov 2004 — 1:42pm
  votes: null
  html: "<p>I'm in the early stages of redesigning the logo and general identity (letterhead, business cards, potentially other pieces) for a small law firm. <br> <br>They are trimming their name down to two of the founding partners, as they've been calling themselves by that name for a while now anyway. They're a smaller firm that gives large firm service at a lower rate. They're also know for their friendliness and approachability. However, they are conservative and traditional in their look, which they'd like to lean towards. <br> <br>Right now, I'm in the early type-choice phase (since they want a logotype, no mark). This is the final set I've narrowed it down to. I plan to use the logotype, along with one or two 'classic' design devices (a rule, a solid box, etc.), to keep their collateral sharp and clean. What I'm looking for at this stage is reactions to the type, either good or bad. I'm gathering impressions to help me choose the 2 or 3 I'll work with. <br> <br>Any thoughts/impressions are greatly appreciated. <br> <br><img src=\"http://www.typophile.com/forums/messages/29/54699.gif\" alt=\"Kraut Harris set 03\"> <br> <br>One note: I'm leaning away from the version with the rule in the middle. Another designer and I believe it makes their names look like an abstract brand, rather than two names, and encourages people to add an 'and' in the middle. Also, any 'crud' on the logos come from online type previewers, it's not in the design. <br> <br>Thanks.</p>"
  html_clean: "<p>I'm in the early stages of redesigning the logo and general identity (letterhead, business cards, potentially other pieces) for a small law firm. <br> <br>They are trimming their name down to two of the founding partners, as they've been calling themselves by that name for a while now anyway. They're a smaller firm that gives large firm service at a lower rate. They're also know for their friendliness and approachability. However, they are conservative and traditional in their look, which they'd like to lean towards. <br> <br>Right now, I'm in the early type-choice phase (since they want a logotype, no mark). This is the final set I've narrowed it down to. I plan to use the logotype, along with one or two 'classic' design devices (a rule, a solid box, etc.), to keep their collateral sharp and clean. What I'm looking for at this stage is reactions to the type, either good or bad. I'm gathering impressions to help me choose the 2 or 3 I'll work with. <br> <br>Any thoughts/impressions are greatly appreciated. <br> <br><img src=\"http://www.typophile.com/forums/messages/29/54699.gif\" alt=\"Kraut Harris set 03\"> <br> <br>One note: I'm leaning away from the version with the rule in the middle. Another designer and I believe it makes their names look like an abstract brand, rather than two names, and encourages people to add an 'and' in the middle. Also, any 'crud' on the logos come from online type previewers, it's not in the design. <br> <br>Thanks.</p>"
