    html: <p>Chris, I'm from the pre-computer generation. We cut out teeth on process as much as color and composition. A good example is you take a paper with a huge texture and heat stamp it, it becomes slick where you stamped it and if you put a pastel coating before heat stamping it added a tint of color. These processes are being forgotten with the computers. Sometimes the simple applications that a printer or engraver can add can radically change how a piece looks. Run that gold stamp by the client. You probably could get samples of gold stamping from paper companies or your printer.</p>
    html_clean: <p>Chris, I'm from the pre-computer generation. We cut out teeth on process as much as color and composition. A good example is you take a paper with a huge texture and heat stamp it, it becomes slick where you stamped it and if you put a pastel coating before heat stamping it added a tint of color. These processes are being forgotten with the computers. Sometimes the simple applications that a printer or engraver can add can radically change how a piece looks. Run that gold stamp by the client. You probably could get samples of gold stamping from paper companies or your printer.</p>
