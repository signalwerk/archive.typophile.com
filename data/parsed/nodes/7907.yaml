    html: <p>I think the line actually helps separate and define the two partner names. These names are not the most identifiable last names ever, and could easily misunderstood to be arbitrary brand names. A line element or something makes it feel like a lawfirm with partners, something that people are familiar with, without the and or ampersand, and I honestly don't think people would just place an and in there when reading it, particularly if that's now how they present themselves (on phone, on conversation). <br> <br>With that said, I think whitman caps is a good looking direction.  <br> <br>Aaron</p>
