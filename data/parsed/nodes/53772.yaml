      <p>Tschichold worked on another stencil typeface which was never published. It will be offered soon under the name "Ivan Stencil".<br>
      You can find drawings and drafts from 1929 from Tschichlods work on the stencil type in the book of Christopher Burke, "Active literature – Jan Tschichold and New Typography", Hyphen Press, London, on page 162-165.</p>
