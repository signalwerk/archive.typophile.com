      <p><cite>"What is the reasoning for having ascenders exceed caps height"</cite><br>
      In addition to the differentiation issue Nick mentioned, it might help to think of it the other way round. The ascenders (and descenders) and their relation to x-height determine the vertical proportions in the lowercase – which is what people will usually read (in text fonts at least), so I'd suspect those should be determined first. The caps are somewhat independent of this relation, and can be shorter than the ascenders. This can make sense if you're looking at languages like German, which use a lot of caps, and you might want the caps to stick out less. Especially if for instance your font is rather wide, caps at full ascender height might look too massive (since caps quite often enclose space [like an "O"], whereas most ascenders are just sticks).</p>
