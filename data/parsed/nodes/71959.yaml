    html: "<p>1. I am not a professional, but here are a few assumptions: Tall capitals dominate a letter string in contradiction to tall ascenders. It is easier to recognize taller ascenders, if they follow a capital. I think, they can improve the rhythm of the text. And probably they offer more flexibility with regard to the design of the bowls (in b and d), because the bowl should not dominate these letters. But maybe the ascender height is even more important with regard to the design of the f. Furthermore I assume, that they can slightly (!) improve the gray value in case of relatively long lines (and big line spacing).</p>"
