      <p>Mike,</p>
      <p>Small Caps are generally taller than x-height. Petite Caps are the size of x-height.<br>
      There are also Quad- and Medium– Caps (according to Maxim Zhukov)</p>
      <p>Nick, </p>
      <p>For this reason Cyrillic typographers manually increase the Small Caps' size.<br>
      I designed a Cyrillic typeface with an additional stylistic set that has taller Small Caps (85% compared to 80% of Cap Height).<br>
      But it needs to be used with caution and cannot be used in multilingual texts.</p>
