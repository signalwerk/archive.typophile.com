    html: |-
      <p>1. It certainly helps in words like Illusion. Of course, <a href="http://typophile.com/node/18300" rel="nofollow">the other way around</a> works too.</p>
      <p>2. Don't know. But consider Greek, which didn't traditionally have Italic, or German, which didn't traditionally have Bold, but used letterspacing for emphasis.</p>
      <p>3. It's more than just "some". I haven't done a survey, but it may be the other way around. In my own case, I always make small caps taller than x-height. The reason is two-fold: firstly to disambiguate C, O, S, U, V, W and X (even more in Cyrillic), and secondly so that acronyms really do stand out in U&amp;lc text -- small caps need to be taller, because lower case includes extenders. </p>
      <p>In typography, aesthetics isn't "just", it's functional on many levels; visual ergonomics, if you will.</p>
      <p>(BTW Mike, a couple is generally considered to be two, but whatever turns you on :-)</p>
