      <p>Note that Jenson's face had massive ascender-height capitals, but Griffo made the improvement soon after ("Bembo" the typeface).<br>
      550 years ago.</p>
      <p>However, the modern style put caps at ascender height, 200 years ago.</p>
      <p>So, a different strategy for oldstyle and modern.</p>
      <p>Carter's Olympian was the first 20th century news font to have ascenders taller than caps.<br>
      This trend has continued, and now faces like H&amp;FJ's Chronicle leverage this effect mightily.</p>
