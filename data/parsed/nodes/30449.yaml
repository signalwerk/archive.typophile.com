      <p>&gt; I agree; it looks good, but with strokes too thin. </p>
      <p>I have thought about making it with slightly less contrast. On the other hand, I believe that it's the high contrast that gives Didone their elegance. So the balance is rather difficult to strike. Most nineteenth century french books I have come across are also using this high contrast, if not higher.</p>
      <p>I agree with the comments on the lower case 's', the numbers and mathematical operators which I have not given enough thought too yet.</p>
      <p>Finial-less finials is indeed one of the ideas behind this font and it took me hours and hours of tests to find something that worked.</p>
