    <p>Hello,</p>
    <p>I am a newly registered used and I need your criticisms, your advice and your help.<br>
    I wanted a Didone font that I could use in my PhD thesis which has to be double spaced.<br>
    I could not find it. So I set out to design one, based on a 1930s Hachette book that I have. I chose a very high x-height to fill the page, and a very vertical and symetrical design. </p>
    <p>Let me know what you think. I shall be eternally grateful.</p>
    <p>David</p>
