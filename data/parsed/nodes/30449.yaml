    html: |-
      <p>I must agree with quincunx regarding his observations on your font's contrast. If you aspire to use this font for the composition of legible text you may consider making the contrast somewhat less extreme, at least for body sizes. It would be nice if your italics were true italics and not just a slanted roman. I also found your puntuation to be a bit on the thin side. It might be worth spending some time to differentiate your apostrophes and quotation marks because they look a bit like the generic quotes many typographers love to hate.</p>
      <p>On the plus side the overall design seems quite fresh and has a nice rhythm to it. Congrats for an interesting first effort.</p>
