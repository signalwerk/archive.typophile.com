      <p>It looks good, at first glance. However, I wouldn't think this as a text face, to be honest. The contrast between the strokes is so large. And the thinnest strokes are quite thin, almost gets eaten away by the white of the page.<br>
      So I think it could use some tweaking here and there.</p>
