    html: |-
      <p>This is pretty cool. Just a few suggestions:</p>
      <p>The serifs on your lc 's' are out of place with every other lc letter. I'd recommend using a solution similar to your lc 'c' for this.</p>
      <p>The bracketed slabs in the UC look a little too thick compared to the non-bracketed ones. You should thin them very slightly to make up for the extra ink in the bracket.</p>
      <p>Like the others have said, you should take a look at a lot of your curves and make them a little smoother.</p>
      <p>I love the Registered and Copyright signs. They match the font well, and if someone using the font doesn't like them, they can substitute the good old Franklin-Gothic-in-a-circle variety. My only suggestion is to make them a little smaller.</p>
      <p>Keep posting your progress.</p>
      <p> - Lex</p>
