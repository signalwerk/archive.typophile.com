    html: |-
      <p>Had a moment to check the specimen out a bit more closely.<br>
      I think your numerals are a bit.. weird all toghether, exept from the zero, 1, 5 and 8. I agree on the 's' part, odd curves. Openings need to be larger and rounder. Like in the uppercase version.<br>
      I'm not sure about the Registered and Copyright signs, that they are in an O or an extended zero. But it might work. Grave and acute signs are not too recognizable, maybe make a bit more slanted? The Euro sign too bold. Question mark too small.<br>
      And some of your curves are bumpy, like the ampersand and the section character, for example.<br>
      But my curves are off a bit as well sometimes, so I won't say too much about that.</p>
      <p>I like the general shapes of the alphabet though. Like the lc y and a.<br>
      It just needs a bit more love. ;)</p>
