    date: 2007-01-08T15:22:00
    votes: null
    html: <p>I agree; it looks good, but with strokes too thin. All your alphabet seems to work pretty well, except probably the s, where the problem is the rightmost spot, where the thick flows into thin. Too angular. Also, M too thin and S too wide. Your numbers don't flow as well as the alphabet. Especially compare your 9 and 6 to your zero, which looks better. 3 and 2 are stilted; 4 too bold. Also, I think your question mark ought to be wider, as well as the ampersand. Euro too bold, yen could go with two lines just as well. Your mathematical operators are too weird; in type, normalcy is often a virtue. The tildes in the approximation sign are annoyingly asymetrical. Also, I don't understand your single-quote scheme--why isn't the left one like the corresponding double quote? The font, though, besides this stuff, is very interesting, especially with the finial-less finials, and the straight y, and I like it.</p>
