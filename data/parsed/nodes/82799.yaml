    <p>Hi,</p>
    <p>I have two questions concerning the typeface the upper part of the text, i.e. "NO.357 | L.17", is set in:</p>
    <p> 1. My best guess is that it is Didot. Am I right?</p>
    <p> 2. Irrespective of the answer to the first question, what keyword should I be using when searching for typefaces with lines running through the strokes of characters as in this sample? I thought "shaded" would be a good starting point, and it indeed got me some good results. Could you suggest any other keywords that will get me typefaces similar to the one used in the image?</p>
    <p>Thanks.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/theurel-thomas-identity-8_3569.jpg"></div><p></p>
