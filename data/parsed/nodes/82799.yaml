      <p>Looks like Engravers to me..the "Lune A Veirnes" might be Didot..but my guess is Bodoni. </p>
      <p>Shaded? There are only a few typefaces that have this..but it's not hard to do it yourself in a graphics editing programme. I believe The Font Feed has a tutorial.</p>
