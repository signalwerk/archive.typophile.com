      <p>thanks, simon!</p>
      <p>i've made an evaluation version of the font with cyrillic AND latin characters. i'm using this version to fix the kerning problems. this release includes the information, that the typeface is designed by Otl Aicher.</p>
      <p>even if there were no latin characters the credits would be the same - not me, but this great designer "invented" the typeface. i just added the cyrillic letters.</p>
      <p>may be the subject line is misleading, but for me the problem is not exactly about designer's ethics.</p>
      <p>if the Rotis typeface was published as an Open source project, there would be no problem at all. but it is commercial product - as far as i know adobe and monotype sell it.</p>
      <p>i don't want to break their license, but their product miss the cyrillic alphabet. and even if they add cyrillic language, it would be not exactly the bulgarian cyrillic letters. there are small differences between glyphs in russian (for example) and bulgarian cyrillic.</p>
      <p>i don't want to make money from this. if my version meets their requirements i will let them incorporate my cyrillic. but i doubt about this :)</p>
      <p>yes, you're right - it would be ethically and lawfully ok, if i make a font with only cyrillic letters, BUT the world is moving toward Unicode, when one font can include all the languages. it is silly to have this conflict between technology and law.</p>
      <p>sorry about the long posting - i've been just thinking loudly :)) and sorry about my poor english</p>
