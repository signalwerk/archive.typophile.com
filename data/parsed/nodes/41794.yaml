    votes: null
    html: <p>Your dilemma is not unusual. Typically I think first port of call would be the font’s EULA. Does it permit personal-use modifications. If not then the second port of call would be the font vendor – are they interested in taking your Cyrillics and/or legitimizing your design? After exhausting these options you get onto the more shaky ground. Re-using the Latin outlines is a no-no, as is using the trademarked name – beyond that could you legitimately redraw the Latins as some kind of revival? Read John Downer’s Emigre article on revivals and also check out the typophile thread on Raph’s Centaur revival. My guess is that Rotis is too recent a design for a revival to be seen as legitimate by the type community.</p>
