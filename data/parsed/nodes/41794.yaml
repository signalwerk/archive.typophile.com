    <p>Hi all! I'm quite new on this site. I've browsed in this section, but didn't found a direct answer to my question, so... thank you in advance :)</p>
    <p>The case:</p>
    <p>I felt in love with one typeface - Rotis, particularly - Rotis Semi Serif. I've made the cyrillic letters (the ones on the picture).</p>
    <p>The question:</p>
    <p>With all my I respect to Otl Aicher... can I or the people I gave the font use it legally?</p>
