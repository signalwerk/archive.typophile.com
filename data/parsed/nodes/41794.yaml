      <p>In order to make sure (and I would have done this before I set down to do the work :-), I would contact the guys who "own" the font, i.e. are said to have the copyright. I am not quite sure, but I think there is a version from Adobe and one from Monotype, the latter being the the original version, I believe.</p>
      <p>I personally think that the font will probably still be copyrighted (as software), but the design - I agree with Uli (wow!) - is probably not patented anymore, if it ever was (strange that Agfa should forget about something that important). So if you create a cyrillic design and pack it into a new font, than there should be no problem. However, the name may be a registered trademark - you might want to give this type a different name - something like Cyrillic Rotislike, or some such thing :-)) I am quite sure Monotype did NOT forget about this!!! :-))</p>
