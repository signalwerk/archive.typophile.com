      <p>What kind of vinyl are you using?  Some are easier than others....  :-)  You want to make sure your horizontal cuts are perfect, and if you get access to a laser level, it will be of great assistance.</p>
      <p>I wouldn't set anything smaller than 12/16 (unless it's some sort of reference number of a picture from an outside source) and the top of the label no higher than a meter/40", otherwise you will alienate people with bifocals.</p>
