    html: |-
      <p>Hey! Here is something I actually know about.<br>
      Unfortunately much of it has been said aready.</p>
      <p>let's see... where to start...</p>
      <p>OK, I assume you'll be applying these to interior walls. Make sure the paint on the walls has dried thoroughly and that the surface is grease free.</p>
      <p>As for text, anything smaller than 18pt I really wouldn't recommend, but consider the typical viewing distance and adjust accordingly. Sometimes you have to go smaller.</p>
      <p>When weeding text that is less than a half inch high:<br>
      first only pull out the counters from the letters,<br>
      then make cuts through the vinyl, but not the release liner, between the lines of text.<br>
      Apply transfer tape over the text block, including the remaining waste vinyl (being careful to apply smoothly with no bubbles or wrinkles) and remove the release liner.</p>
      <p>Lay the transfer tape with the vinyl letters on your table, adhesive side up.<br>
      Now, carefully remove the waste vinyl line by line.</p>
      <p>Replace the release liner on the exposed adhesive until reeady to mount.</p>
