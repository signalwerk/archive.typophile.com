    <p>I'm helping a friend with a photographic exhibition, laying up all the text for the wall of the gallery.</p>
    <p>I have to set the type in Helvetica Neue. It will be black on a white wall.</p>
    <p>Are there any special tips/tricks to this?</p>
    <p>What would be the smallest point size?</p>
    <p>Is applying the Vinyl tricky?</p>
    <p>Any help would be greatly appreciated</p>
