    html: |-
      <p>If the letters are cut on a vinyl cutting machine from a sign shop no problems. You can do the layout in vector format and they will cut it exactly like you laid it out.<br>
      They can pretty well cut any size but what is more important what is a good readable size from a given distance.<br>
      Have the sign shop "weed out" the background and apply a large sheet of premask.<br>
      This premask can hold all the lines or block of copy together so you can apply it all at once.<br>
      Ask the sign shop for help and they will teach you the tricks on how to apply it.</p>
      <p>Good luck<br>
      Gerry</p>
