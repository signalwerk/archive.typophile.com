    <p></p><div class="imageWrap"><img src="http://typophile.com/files/typ_idm_040zennua3sa0z_main_pic_1252537862_5926.jpg"></div><p></p>
    <p>Chronicle Books Design is hosting "5 Speakers / 5 Minutes / 5 Questions"; an evening of design-minded conversation and drinks, featuring five bloggers currently reporting on our visual world:</p>
    <p>1 <strong>Dave Cuzner</strong> / <a href="http://grainedit.com" title="http://grainedit.com">http://grainedit.com</a><br>
    GrainEdit is focused on classic design work from the 1950s-1970s and contemporary designers that draw inspiration from that time period.</p>
    <p>2 <strong><a href="http://josephpemberton.com" rel="nofollow">Joe Pemberton</a></strong> / <a href="http://www.typophile.com" title="http://www.typophile.com">http://www.typophile.com</a><br>
    Typophile is the end all, be all internet forum for typography lovers. It's a "gig" owned by Punchcut. </p>
    <p>3 <strong>Suzanne LaGasa</strong> / <a href="http://www.chroniclebooks.com/blog/?cat=41" title="http://www.chroniclebooks.com/blog/?cat=41">http://www.chroniclebooks.com/blog/?cat=41</a><br>
    Design Desk is the regular feature on Chronicles' blog written by the in-house designers. </p>
    <p>4 <strong>Lauren Smith and Derek Fagerstrom</strong> / <a href="http://smartsandcrafts.com" title="http://smartsandcrafts.com">http://smartsandcrafts.com</a><br>
    Smarts&amp;Crafts is the blog component of the Curiosity Shoppe, an impeccably curated store focused on all things crafty, arty, or well designed. </p>
    <p>5 <strong>David Pescovitz</strong> / <a href="http://boingboing.net" title="http://boingboing.net">http://boingboing.net</a><br>
    A moderated culture blog whose main contributors were or are still involved with Wired magazine.</p>
