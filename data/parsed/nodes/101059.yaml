      <p>It's a lovely illustrated mark. I think the issues I see first have to do with the composition and balance more than typeface, although I agree with the above comment. The text is too small and flat for the mark, and being below it is not helping the balance because it makes the mark seem heavy and overpowering. I would try to set the text to the right and make it a lot larger. Maybe explore some small decorative terminals like <a href="http://www.myfonts.com/fonts/hvdfonts/pluto/" title="http://www.myfonts.com/fonts/hvdfonts/pluto/">http://www.myfonts.com/fonts/hvdfonts/pluto/</a> or <a href="http://www.myfonts.com/fonts/laura-worthington/mandevilla/" title="http://www.myfonts.com/fonts/laura-worthington/mandevilla/">http://www.myfonts.com/fonts/laura-worthington/mandevilla/</a></p>
      <p>Lovely start with that great mark!</p>
