    html: |-
      <p>The font seems to fight with the artwork. The uniform stroke weight and sharp edges are at odds with the graceful lines of the drawing, and the elliptical shapes of the <strong>a</strong> and <strong>e</strong> are jarring below the round shape. I would use something softer, with a bit of variation in the stroke weight and flared or rounded stroke ends. Maybe something with a little of the Art Nouveau/Art Deco feel of the artwork.</p>
      <p>Personally, I am a Goudy disciple when it comes to letterspacing lowercase, but <em>chacun à son goût</em>.</p>
