    html: |-
      <p>Thanks for the rapid reply Mojo,<br>
      While the input on stroke weight and collision of shapes are appreciated for their pinpoint accuracy (I'll try to soften it up a bit and get back to you all), I personally don't know of any Goudy fonts that fall into the "contemporary, fresh and modern" category.<br>
      It's important to me to contrast the softness and grace of the logo with a bit of modernist or contemporary freshness so that the branding from then forward can aspire toward something fresh (apologies for the lack of a less buzzy). My hope was to use an updated version of early 20th century wide-set gothics (i was thinking a thin-weight extended-width Gotham, or <a class="freelinking external" href="http://www.myfonts.com/fonts/sweet/sans-pro/" rel="nofollow">Sweet Sans Pro</a>), and the packaging will eventually lean towards a Japanese aesthetic.</p>
      <p>that said, if you've got a font recommendation to save me from myself, I'd be quite thankful.</p>
      <p>sincerely,<br>
      Nathan</p>
