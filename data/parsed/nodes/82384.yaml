    <p>“onlliinnee” is meant to be an opensource foss operating system.  It<br>
    is meant to be free os and a linux based distro.  What is meant to be<br>
    different and planned about onlliinnee is:  only unique fonts,<br>
    software, development, a specific website home page on the browser,<br>
    startup screen connects to video website/s,  related with model<br>
    railroad / railway, diecasting and ‘automation over internet<br>
    protocol’ (AOIP) especially Rail Model AOIP (RMAOIP)  and is for Srila<br>
    Prabhupada: the always on eternal spiritual initiating and education<br>
    guru. Regarding any questions about this, send message to: identi.ca/<br>
    onlliinnee (after joining identi.ca)</p>
    <p><a href="http://www.onlliinnee.net" title="www.onlliinnee.net">www.onlliinnee.net</a></p>
    <p>p.s.<br>
    For some "onlliinnee" gear (t-shirt, cap, jersey, time piece etc)<br>
    <a href="http://www.cafepress.com/onlliinnee" title="http://www.cafepress.com/onlliinnee">http://www.cafepress.com/onlliinnee</a></p>
    <p>copyright 2011 onlliinnee.  all rights reserved worldwide.</p>
