    html: "<p>I'm not following you, I swear! I sort of live here...  :-&gt; <br> <br>Delivering hand-made grayscale fonts is a tricky business - I know because I tried for over six years! Then Ultrafonts came on the scene and made it possible - I'll explain below. But first the reasons why it's so tricky: the FON format doesn't support grayscale (it also doesn't support extended encodings BTW), and while the TT format is supposed to allow embedded grayscale bitmaps (for which you can use BitFonter - not a cheap program though) I could never get it to actually work. And then there's the Mac side, which no longer supports any bitmap formats of any kind... <br> <br>So in the end the only robust way of delivering hand-made grayscale fonts is to make pixelfonts: outline fonts that have funny blocky patterns that render out the desired grays at the right pixel locations when used at a certain size. And making these fonts is no picnic; you can try to do it yourself, but I'd advise against it. Much better would be to sign up as a developer at Ultrafonts.com, which is what I did. They have a converter that takes a filled Photoshop template and spits out a grayscale TT pixelfont, but as a result you have to share any sales profits with them. You might not be interested in more than just using the end result yourself, but know that they would expect a finished font that can be sold retail. Alternatively you might talk them into a no-strings-attached per-conversion fee; but I doubt it will be $40... <br> <br>If you're not dead-set on doing your own design, here's another idea: as you know I'm considering making a monospaced version of Mana. If you can wait let's say a couple of months, and you're willing to pay me the $40 to speed up the development, I'll make you a Manamono-13 Bold, and you can start coding in high style. <br> <br>hhp</p>"
