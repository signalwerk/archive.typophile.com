    html: "<p>hrant: Shouldn't that be Baskervill<i>a</i> TMF? And does the TMF stand for \"TeX Metafont\"? If so, you're a brave soul. <br> <br>More on topic, I met with Norm Megill of <a href=\"http://www.metamath.org/\">Metamath</a> fame recently. He has done a rather impressive bitmap math font for his project, but has been thinking along the lines of a hand-built grayscale font (likely delivered through one PNG file for each glyph). He may well be willing to do it himself, but could probably use some guidance re tools and the like. Or, if someone wanted to help draw, that would be even better.</p>"
