    html: "<p>Do you mean the ending should be an \"a\" to avoid lawsuits? If so: <br>1) Isn't the name way beyond being trademarked? Please do correct me if I'm wrong. Please! <br>2) I don't think changing one letter would help.  :-/ <br> <br>TMF = The MicroFoundry. At least I hope so! BTW, it would have been \"TMF Baskerville\" but that would throw off human menu scanning. Or is there a way around that? <br> <br>&gt; delivered through one PNG file for each glyph <br> <br>I did that six years ago, with a beta of Mana-16. But I used GIFs, which end up smaller, although they don't have the -admittedly quite relevant- provision for embedding a gamma profile.* It was great because no plug-in was needed, and I had a converter that took ASCII text and converted it into really long strings of image declarations.** But you know what the major impediment was in the end? The size of the actual resultant HTML file!  :-/ <br> <br>* Assuming that's even supported though. And some browsers don't seem to like PNG. <br> <br>** And you could still have a seprate real-text version for searching. <br> <br>What does his font look like? <br>Like I've explained before, the only real way to deliver a grayscale pixelfont is via UPF*. <br>BTW, in this case not \"draw\", but \"paint\".  :-) <br> <br>* Unless you're crazy enough to superhint an outline font for grayscale! Theoretically possible - never been done. <br> <br>hhp</p>"
