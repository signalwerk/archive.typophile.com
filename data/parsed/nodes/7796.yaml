  html: <p>In a recent search to find something better than Courier New for programming, I came upon this thread... <br> <br><a href="http://typographi.com/000744.php" target="_blank">http://typographi.com/000744.php</a> <br> <br>I tried some 40 odd fonts and found that I like Bitstream Vera Mono at 9pt very much. However, I would like to modify the font in a few ways, just slightly. I found very little free or cheap tools to do so. I found one called Softy... <br> <br><a href="http://users.breathe.com/l-emmett/" target="_blank">http://users.breathe.com/l-emmett/</a> <br> <br>Using Softy I turned Vera Mono 9pt into a bitmap font so I could easily edit it. This is great! However, I noticed that on my (Windows) box TT fonts are nicely anti-aliased while bitmap fonts are not. Softy only does B&amp;W. I tried the FONmaker demo and the bitmap fonts it created were not anti-aliased either. <br> <br>Is it possible to rasterize TT fonts into anti-aliased bitmaps fonts? What program would allow me to do this conversion? What can I use to easily modify the bitmap font? <br> <br>I'm only really planning to modify this one font for my programming, since I stare at it some 10 hours a day. I have little artist skill and highly doubt I will be doing anything else with fonts. Because of this, I don't really want to spend $100+ for a program that does what I need plus much more. I think $30-$40 is reasonable for what I want. I would pay someone if they could help! However, I would like to be able to edit the grayscale font myself, so I don't have to keep bugging someone for any small changes I may want down the road.</p>
  html_clean: <p>In a recent search to find something better than Courier New for programming, I came upon this thread... <br> <br><a href="http://typographi.com/000744.php" target="_blank" class="link-external">http://typographi.com/000744.php</a> <br> <br>I tried some 40 odd fonts and found that I like Bitstream Vera Mono at 9pt very much. However, I would like to modify the font in a few ways, just slightly. I found very little free or cheap tools to do so. I found one called Softy... <br> <br><a href="http://users.breathe.com/l-emmett/" target="_blank" class="link-external">http://users.breathe.com/l-emmett/</a> <br> <br>Using Softy I turned Vera Mono 9pt into a bitmap font so I could easily edit it. This is great! However, I noticed that on my (Windows) box TT fonts are nicely anti-aliased while bitmap fonts are not. Softy only does B&amp;W. I tried the FONmaker demo and the bitmap fonts it created were not anti-aliased either. <br> <br>Is it possible to rasterize TT fonts into anti-aliased bitmaps fonts? What program would allow me to do this conversion? What can I use to easily modify the bitmap font? <br> <br>I'm only really planning to modify this one font for my programming, since I stare at it some 10 hours a day. I have little artist skill and highly doubt I will be doing anything else with fonts. Because of this, I don't really want to spend $100+ for a program that does what I need plus much more. I think $30-$40 is reasonable for what I want. I would pay someone if they could help! However, I would like to be able to edit the grayscale font myself, so I don't have to keep bugging someone for any small changes I may want down the road.</p>
