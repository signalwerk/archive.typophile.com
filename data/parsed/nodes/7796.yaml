    html: "<p>I don't want to show it just yet. I need to be close enough to finish it so nobody can copy and release it before me. Bitmap fonts are WYSIWYS: What You See Is What You Swipe! :-)  And they don't enjoy any copyright protection whatsoever. What I can tell you is that it's 14 pixels (with tall ascenders), it will have a demi weight, and it has somewhat pronounced width differences between some key characters. And of course massive kerning. And it's called Atanasia. Can you figure out why? <br> <br>Fonts I definitely intend to finish: <br>Grayscale Bitmap: 3 (the rest of Mana, Coda, Atanasia*) <br>Outline: 2 (Patria, Baskerville TMF) <br>But maybe another half-dozen tentative things. <br>And some font programming jobs (which pay way better than retail). <br>So about average? Dunno. Maybe we need a \"Spill the Beans\" thread... <br> <br>* I can't believe I'm falling for the pedestrian ending-in-\"a\" trap... <br> <br>hhp</p>"
