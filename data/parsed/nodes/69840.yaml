    html: <p>One reason a letter might not be symmetrical is just by chance… at least with FontLab Studio where all nodes have to sit on whole coordinates what I've found is you can draw a circle using the shape tool and it can randomly draw out to be an even height/width when it needs to be at odd dimensions… so that the center nodes rest on the odd coordinate and either side is even… the more you scale said shapes up and down the more things can potentially become distorted… depending on the scaling and UPM size. You can see what I mean by drawing a few circles/shapes with 1000 or lower UPM and scaling it at extremes then doing a horizontal/vertical axis mirroring to see the symmetry get thrown off.</p>
