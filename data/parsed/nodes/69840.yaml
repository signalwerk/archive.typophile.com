      <p><cite>I personally would move the topmost node of the inner contour down by a unit or maybe even two</cite></p>
      <p>Yeah, I think I see it too. And it's not only the top curve, the right one too looks slightly thinner next to its left counterpart. Do you see it?</p>
      <p>However, if you look at the three "well known" /o/'s I examined, you'll notice that the middle one has a thinner bottom curve, while the right one has a thinner top curve. I wonder if that means anything.</p>
      <p>Bendy,</p>
      <p><cite>To optically centre black parts of a glyph we raise them slightly above the geometric centre; here we might find the opposite works because we're dealing with a counterspace?</cite></p>
      <p>Never crossed my mind, I think you've got a point!</p>
      <p>Mike Jarboe,</p>
      <p>I don't think you can actually attribute unsymmetries to rounding errors; they're too sharp for that.</p>
