    html: |-
      <p>Well, I've examined more professional fonts, and none had a perfectly symmetrical /o/. </p>
      <p>Why is it so, then? I mean, at least since fonts are being designed using computers, it's easier and more natural to create symmetrical /o/'s. So if they're not, there must be a reason, wouldn't you say?</p>
      <p>Perhaps most type designers don't even start with symmetrical /o/'s? But how do they start, then?</p>
      <p>I'd be grateful if other type designers could reflect on their experience with designing /o/'s.</p>
