      <p>Interesting question. I agree with Nina about the top right curve, and I usually draw it with emphasis there, and slightly raise the right hand extrema too. I suspect my /o/s are very unsymmetrical as I draw them by eye without any kind of flipping or rotating. I start by drawing two ellipses then push and pull the nodes and BCPs manually without measuring until it clicks. </p>
      <p>Nina, I wonder about your second point. I wonder if it's something to do with reverse optical centring. To optically centre black parts of a glyph we raise them slightly above the geometric centre; here we might find the opposite works because we're dealing with a counterspace? I'll check out the fonts I've designed later to see if I've corrected the o this way.</p>
