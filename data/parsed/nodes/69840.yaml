      <p>Very interesting comments, everyone.</p>
      <p>nina,</p>
      <p><cite>the top-right segment of curves such as in the "D", but actually also the "O"/"o", may need to be a bit more pronounced, otherwise they can look deflated or even slightly backslanted</cite></p>
