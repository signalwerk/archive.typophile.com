      <p>One general thing I learned at lettering class back in design school is that the top-right segment of curves such as in the "D", but actually also the "O"/"o", may need to be a bit more pronounced, otherwise they can look deflated or even slightly backslanted. Not sure why this is. But like with all optical corrections, trust your eye; and it might be easier to stop staring at that "o", move on to other glyphs, view the "o" in context and if it rubs you the wrong way, then correct it. Not so much because others do it, but because you can see why.</p>
      <p>One thing I've been wondering about for a while: To my eye, in symmetrical "o"s the top curve (near the x-height) tends to look very slightly thinner than the horizontal bit at the bottom, near the baseline. I have no idea why this is, and it depends a lot on the design at hand, but in your "o", I personally would move the topmost node of the inner contour down by a unit or maybe even two. I'd be curious if others see this too. (There are some fonts that do this correction, like Helvetica (1 unit in the Regular), or National (2 units).)<br>
      I'm not an expert at this, BTW, so take with salt.</p>
