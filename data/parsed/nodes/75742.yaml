  html: |-
    <p>I'm designing a website and downloadable pdfs of knitting patterns. I used archer and gotham for headline and subcategories respectively for online and pdfs. I used arial for body copy online. what font to use for body copy on pdfs? I know arial is based on helvetica, but it looks much too wide, and narrow much too narrow. I like gill sans but the number "1"s look like lower case "L"s. yuck.<br>
    anyone have any advice? thank you!</p>
