    html: <p>The most important thing about a font is not if it has ligatures or not. If it does have them then you aught to ask - is this better than not having them - eg is this an improvement? And if it doesn’t, does it suffer from not having them? There are plenty of fonts that have poorly designed ligatures so having ligatures and even larger numbers of ligatures are not a mark of quality per se. Quality has to do with if the font supports reading - this applies to the ligatures as much as any other aspect. Learning which fonts support reading &amp; which ones don’t can take time. The other relevant question has to do with the tone struck by the font when set in text. Of course a good fit with the paper to be used in the book is an issue too.</p>
