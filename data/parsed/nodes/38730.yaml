    html: <p>I must admit ligatures, especially historical forms like st-ligs etc. seem to ba a bit of a flovor of the month/year thing to me, especially since OT. I agree with Eben, ligatures do not improve legibility/readability per se. It’s just that some faces actually need them to set properly, some don’t (which in return doesn’t make either better than the other, per se). To me Ligatures just seem to be a bit of an overestimated topic as of late. Like Eben, i’d choose a typeface rather going by things like content, style, tone/color, and yes, sometimes by era. If you’ve come that far, then you can still look if the font actually includes all the ligatures you might need and if thery’re well drawn. To me giving the sheer number of ligatures first priority in chosing a typeface is like bying a car just because it features an ashtray while others don’t.</p>
