    <p>Hi,</p>
    <p>I’m starting thinking my question are boring but I’m curious and new in the (fantastic) world of typography.</p>
    <p>So, my last question concerned the choose of a typeface for a novel book body. Now I’m asking how much the ligatures are important in a book.</p>
    <p>Can ligatures influence the choose of a font?<br>
    I just found the font “Esta” (“Esta ligatures”) with a large number of ligatures (e.g. for s+h, s+t, s+k, f+r, f+y etc. etc. etc.).</p>
    <p>Do you know other typefaces with similar range of ligatures, suitable for a novel book body?</p>
    <p>Thanks</p>
