      <p>yes, it is Haptic, or what Haptic used to be. Their lead agency DDB Melbourne and atf.com.au modified it without my consent, even though the EULA states that this is not allowed. I contacted them about it, but neiter DDB nor ATF have answered my mails. I am quite unsure what I can actually do about it, since they are ignoring me. They changed some design features (cut off the italic f and the bottom bar of the regular one ...) and the name and I don't know how they are distributing the new font around. Any ideas what I could do?</p>
      <p>Thanks<br>
      Henning</p>
