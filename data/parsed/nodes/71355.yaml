      <p>Henning, I concur with Stephen.</p>
      <p>Some agencies take liberties with fonts, because they don't know any better. But they should, if they are playing in the big league, with blue-chip clients who are paying them big bucks and expecting them to be copacetic with regards to intellectual property.</p>
      <p>(I have had agency art directors approach me on several occasions, asking if I would adapt a third-party font for a client of theirs, and have had to explain the legalities involved.)</p>
