      <p>I agree with jason’s assessment, particularly regarding the graphic/text relationship.<br>
      Although I might suggest the translucent graphic BEHIND the text instead of in front.<br>
       You may also rethink the elements in the open column to the left. I get the feeling that by rrunning the author credit at the top of the column and the one column photo at the bottom, you’re negating the openness of the layout. Instead, it might be worth trying to group the author credits and the secondary image closer together, and letting the free space fall to the bottom left. It will really open the page up more.</p>
      <p></p><div class="imageWrap"><img src="/files/strana_6637.jpg"></div><p></p>
