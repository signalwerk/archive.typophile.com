      <p>With strana-velky-foto.jpg you reveal one of the problems of including the graphic by changing text color: as the columns rewrap, the shape can get distorted. I don’t much care for changing the text color as it also introduces readability issues, but if you must do it try overlaying a translucent graphic object over the text instead of changing the text color. With that, you’ll run into the problem of a few letters being only partially changed, but you will save a lot of time over resetting the text color letter by letter.</p>
      <p>That being said, it isn’t a bad layout, but it is indeed a rather boring one, more appropriate to a serious medical journal than a lifestyle magazine.</p>
