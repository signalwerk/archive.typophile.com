    html: <p>I agree with Chuck re the rivers of space caused by not hyphenating. This, in narrow justified text columns is very unsightly. Actually I don’t care for the male/female symbol behind or in front of text at all. It takes away from the text and meaning. It is simply too obtrusive. Why not a little symbol, light in color, in the open column under the caption or at bottom of page. Does it have to be so obvious?</p>
