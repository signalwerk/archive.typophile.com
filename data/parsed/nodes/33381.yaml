    <p>Hi, I am new here, so please have patience ;) thanks</p>
    <p>My company would like to start a new magazine. It will be readable from both sides - one half is for men and one half for women. You have to turn it around and upside down to view the other side (if you understand what I mean).<br>
    Anyway. I am something like a manager of this project and our “art director” sucks. I tried to find some solution, because we are close to deadline. I know that it also sucks (but believe me - it is better). I am not graphic and there is no typography involved, but I hope, that you will help me to improve the general image and the “face” of the magazine and layout...</p>
    <p>Here are first three pages, that will be used for text-type pages</p>
    <p><a href="http://ahasver.wz.cz/strana-plain.jpg">http://ahasver.wz.cz/strana-plain.jpg</a><br>
    <a href="http://ahasver.wz.cz/strana-foto.jpg">http://ahasver.wz.cz/strana-foto.jpg</a><br>
    <a href="http://ahasver.wz.cz/strana-velky-foto.jpg">http://ahasver.wz.cz/strana-velky-foto.jpg</a></p>
    <p>thanks for any suggestions</p>
