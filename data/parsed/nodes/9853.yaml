    html: "<p>I took my time to try couple things, but I still face the same problem. <br> <br>When installing the first new font (generated as Type 1, single master) the font didn't show up in the font menu in Illustrator, After Effects. However, with Freehand, Motion, FCP HD/Live Type - the font showed up in the alphabetical order. The day after, the font showed up with all applications, but with Illustrator and After Effects - at the bottom of the list. <br> <br>By kerning issue/problem I do mean that the letters are too apart with some applications, and with others - not. <br> <br>After reading your last post I tried a couple of things: <br> <br>1. I generated another font (Type 1, single master) - this time the font showed up with all applications - in the alphabetical order, but still the kerning issue remains. <br> <br>2. I generated just \"plain\" Type 1 (another new font, and not using the Blend mode - MM) and had the same problem as described above. <br> <br>3. I generated another new font as Open Type(PS), and this time the kerning issue with Illustrator disappeared. Freehand remains with the kerning issue as before. Motion - the kerning working fine. FCP HD/Live Type - the kerning issue remains the same. <br> <br>In each case I installed the font only one time!!! After facing this problem I didn't remove the font and install it again. <br>In each case I installed a new different font. <br> <br>any ideas?</p>"
