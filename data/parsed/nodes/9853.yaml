    date: 2005-03-21T18:00:00
    date_raw: 21 Mar 2005 — 6:00pm
    votes: null
    html: "<p>I'm having trouble following your description. Which do you mean: <br> <br>Kerning works in FCP/Live Type, but not in Illustrator and Freehand, <br> <br>or... <br> <br>Kerning works in all of these, but in Illustrator and Freehand it makes the kerned pairs move apart instead, <br> <br>or...? <br> <br>In general, I would suggest checking the kerning pairs in the generated \"single master\" font.  <br> <br>It's also possible, if you've been generating and testing the same font repeatedly, that Illustrator, for example, may be confused because it \"remembers\" the earlier version of the font. <br> <br>If this is the case, you can force Illustrator to \"forget\" about the font by doing this: <br> <br>1. Quit Illustrator. <br>2. Uninstall the font. <br>3. Start Illustrator, then quit Illustrator. <br>4. Install the font again. <br> <br>Now when you start Illustrator again, it will treat the font as if was new. If this was what was causing the problem, it should fix it. If you still have the problem, then it's something else. <br> <br>(As an added measure, you may want to clear your system font caches between steps 2 and 3. I don't think this is absolutely necessary, though it may help.) <br> <br>Freehand may respond to similar therapy, but I don't currently have it installed, so I haven't tested it and don't know if the diagnosis would even be the same. Could be, though.</p>"
    html_clean: "<p>I'm having trouble following your description. Which do you mean: <br> <br>Kerning works in FCP/Live Type, but not in Illustrator and Freehand, <br> <br>or... <br> <br>Kerning works in all of these, but in Illustrator and Freehand it makes the kerned pairs move apart instead, <br> <br>or...? <br> <br>In general, I would suggest checking the kerning pairs in the generated \"single master\" font.  <br> <br>It's also possible, if you've been generating and testing the same font repeatedly, that Illustrator, for example, may be confused because it \"remembers\" the earlier version of the font. <br> <br>If this is the case, you can force Illustrator to \"forget\" about the font by doing this: <br> <br>1. Quit Illustrator. <br>2. Uninstall the font. <br>3. Start Illustrator, then quit Illustrator. <br>4. Install the font again. <br> <br>Now when you start Illustrator again, it will treat the font as if was new. If this was what was causing the problem, it should fix it. If you still have the problem, then it's something else. <br> <br>(As an added measure, you may want to clear your system font caches between steps 2 and 3. I don't think this is absolutely necessary, though it may help.) <br> <br>Freehand may respond to similar therapy, but I don't currently have it installed, so I haven't tested it and don't know if the diagnosis would even be the same. Could be, though.</p>"
