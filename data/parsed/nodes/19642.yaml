      <p>The letters have a very energetic and very American feel to them. Good, if that's what you're aming for.  The Q is weak, very obviously constructed from the O, which doesn't necessarily make sense for cursive. The Z seems a bit awkward.</p>
      <p>BUT: A script alphabet without lower case is of extremely limited use. What do you have in mind? Decorative initials? You don't seriously contemplate using this in all caps, do you?</p>
