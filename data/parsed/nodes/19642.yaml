    html: |-
      <p>Jill,<br>
      It seems as though the script you are doing would be hard to cut and read in stone.  Also, script capitals are tough to read anyway.  Script needs a lower case in my opinion. Do you have photos of the grave stones you saw?  I would be curious to see how it worked carved in stone.</p>
      <p>What you have going is a loose spontaneous looking hand.  You might think of it as an informal script somewhere between Pauls more formal "Zaner" and Christian's more personal "Dear Sarah" It needs either some real refinement or to become more casual to find its place.</p>
      <p>ChrisL</p>
