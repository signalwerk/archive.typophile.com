    date_raw: 26 October 2006 - 10:47am
    votes: 0
    html: |-
      <p>You might have to adjust a few lines before you can use it. If you want to make center lines from a font, you'll have to copy the letters, erase everything but one outer stroke, paste it, erase everything but the other outer stroke (this is where you might have to do some adjusting like linking to separate parts from one stroke to make sure you get the 2 outer strokes) &amp; thenuse the blend tool (set it to one step).<br>
      The copy/paste thing is needed because you can't use the blend tool on a single object &amp; even if you cut a path, Illustrator will still see it as one object.</p>
    html_clean: |-
      <p>You might have to adjust a few lines before you can use it. If you want to make center lines from a font, you'll have to copy the letters, erase everything but one outer stroke, paste it, erase everything but the other outer stroke (this is where you might have to do some adjusting like linking to separate parts from one stroke to make sure you get the 2 outer strokes) &amp; thenuse the blend tool (set it to one step).<br>
