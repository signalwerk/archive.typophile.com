    html: |-
      <p>The original typeface is an Art Nouveau one shown in the Petzendorfer book from Dover Books. The typeface name was "Pretorian" from the London firm of P. M. Shanks &amp; Sons. </p>
      <p>Intellecta Design has a font based on this called <a class="freelinking external" href="http://www.myfonts.com/fonts/intellecta/pretoria-gross/?refby=bowfin" rel="nofollow">Pretoria Gross</a>, which includes various ornamental treatments using the letters, as well as the plain black and outline versions of the typeface.</p>
      <p>Another is called <a class="freelinking external" href="http://www.myfonts.com/fonts/dtptypes/pretorian-dt/?refby=bowfin" rel="nofollow">Pretorian DT</a> by DTP Types. It has 4 versions.</p>
      <p>FontBank had a version called "Vivian", and Serials (or whatever they are called now) had a family called "Pretoria".</p>
      <p>- Mike Yanega</p>
