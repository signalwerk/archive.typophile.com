      <p>My comment about the lowercase i wasn't about the serif, but about the corners. Some are square, and some are slightly rounded (the lowercase l is the same way). You should probably pick one and be consistent throughout all the characters.</p>
      <p>As far as the p, d, b, and q, I guess I shouldn't have said "match."  They just need some more cohesiveness. They don't look like they all go together yet. Think of the curves like siblings. They don't look alike, but you should be able to tell they're related.</p>
      <p>The bottom of the bowl of the p is flat, but the b curves up just a hair. The d curves up, but it's uneven. The q curves up the most, and to me, is the nicest looking. All those curves don;t have to be identical, but they should share the same DNA.</p>
      <p>The r still seems too short, and the t just looks awkward. It seems odd having the crossbar below the x height.</p>
      <p>You could use the a similar stem on the j (which is quite nice) for the t, and make it taller.</p>
      <p>Have you started on your uppercase yet? I think when you do, you'll find that the ascenders on these lowercase characters are too low.</p>
