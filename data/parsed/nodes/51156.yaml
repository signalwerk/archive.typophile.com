      <p>Thank you for your input. I'm glad you liked the lc a.</p>
      <p>I wasn't actually aware that glyphs with curves at the base should cross over the line, but now that you've said it, it does look off if, for example, the lc o just sits on the baseline.</p>
      <p>Now that you've mentioned it, the r should be a wee bit taller. I'm also aware that there are smoothness flaws in the lc b, d, q, and p. Will work on that asap. The lc i has some semi-serif qualities, and that is intentional. I tried a normal lc i before but it was too boring for my taste. I don't know if I should follow that pattern for the lc l, though.</p>
      <p>I'm unsure about your last point though. I want to retain the upper stem of r, n, and p for a distinct look, yet I don't want to copy that over to d, b, and q. I was actually thinking of an mirrored d for the lc b but I figured that would be too lazy of me. Haha. And it looked awkward anyway. So being aware of that, I tried to make differences with d and b. Now, lc p is derived from d and n, while q is from b (just a mirror). That's why, I think, the curves don't match.</p>
      <p>Again, thank you for your comment. It helped a lot.</p>
