      <p>Very nice for a first try. I like the lowercase a, and the little curved corners at the tops of the ascenders.</p>
      <p>A few  things I noticed:</p>
      <p>* The bottom of the o, p, and q don't overshoot the baseline (the d does).</p>
      <p>* the bottom of the bowl of the d could be smoother</p>
      <p>* I'm not sure if it's intentional or not, but the i has some square corners an some slightly rounded corners</p>
      <p>* the r needs to be taller</p>
      <p>* the curves n the p don't match the b, d, and q. Maybe it needs to be a bit wider?</p>
