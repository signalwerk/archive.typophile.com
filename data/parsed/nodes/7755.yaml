  html: <p>Has anyone seen any nice layout for typesetting long lists...I am working on a book that has a "101 ways to" section and it just lists and lists and lists (101 times). The lines are fairly short, though a few of them straddle two lines. <br> <br>I'm looking for some inspiration...Has anyone seen anything nice out there? <br> <br>My measure is about 24 picas.</p>
