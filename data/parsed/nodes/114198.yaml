      <p>Similar: <a class="freelinking external" href="http://www.myfonts.com/fonts/lettering-inc/directors-gothic/?refby=bowfin" rel="nofollow">Director's Gothic</a>. The A could be made with inverted V, but the numerals are not exactly the same. Old Image Club font <a class="freelinking external" href="http://www.myfonts.com/fonts/imageclub/pacifica-condensed/?refby=bowfin" rel="nofollow">Pacifica Condensed</a> has the A, but is more squared.</p>
      <p>Could be custom design for the phone app.</p>
      <p>- Mike Yanega</p>
