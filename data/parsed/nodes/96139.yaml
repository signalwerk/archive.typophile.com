    <p>I am building a font in FontLab. When using codepages certain characters are not named as they used to be, ie. Kcommaaccent is now uni0136, and all other commaaccent glyphs are not 'named' in the font or glyph window either. Why has this changed, have I accidentally changed preferences somehow?</p>
    <p>Any answers welcome. Thanks.</p>
