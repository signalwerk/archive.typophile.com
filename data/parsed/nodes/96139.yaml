    html: |-
      <blockquote><p>Why the change?</p></blockquote>
      <p>As mentioned, apparently an issue with Mac OS X. Adam goes into more detail here:<br>
      <a href="http://www.typophile.com/node/36473#comment-223275" title="http://www.typophile.com/node/36473#comment-223275">http://www.typophile.com/node/36473#comment-223275</a></p>
      <blockquote><p>Edit: And how do I restore it?</p></blockquote>
      <p>To get the automatic-component function working with the new names, you could add some definitions to the alias.dat file (which apparently was not updated to reflect the changes to the encoding tables). Add lines for commaaccent characters such as:</p>
      <pre>uni0122 G+commaccent
      uni0136 K+commaaccent
      uni013B L+commaaccent
      </pre><p>
      The file is in FL's global Data folder— try <code>/Library/Application Support/FontLab/Data</code> on Mac, or <code>\My Documents\FontLab\Shared\Data</code> on Windows, or just run a search.</p>
