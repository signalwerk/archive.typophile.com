    html: <p>I lived in SLO when they put up those signs. It was my impression that it was judged a lovely looking typeface (and, I suppose that it is a reasonable display typeface) that evokes the historical significance of Mission San Luis Obispo de Tolosa. The city apparently didn't put any thought into actual readability concerns (particularly while driving). The end result is... regrettable.</p>
