    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a>: <a href="/wiki/Writers" class="freelinking" rel="nofollow">Writers</a>: Stanley Morison</strong></p>
    <p>Temperamental typographical advisor to the <a href="/wiki/Monotype%20corporation" class="freelinking" rel="nofollow">Monotype corporation</a> and opinionated type historian and theoretician. Designer of <a href="/wiki/Times%20New%20Roman" class="freelinking" rel="nofollow">Times New Roman</a> which, along with <a href="/wiki/Helvetica" class="freelinking" rel="nofollow">Helvetica</a> and <a href="/wiki/Univers" class="freelinking" rel="nofollow">Univers</a>, probably holds the honor of being the most well-known typeface of the <a href="/wiki/20th%20century" class="freelinking" rel="nofollow">20th century</a>. <a href="/wiki/Times%20New%20Roman" class="freelinking" rel="nofollow">Times New Roman</a> was his only type design, and the story of its development is told in <a href="/wiki/Walter%20Tracy" class="freelinking" rel="nofollow">Walter Tracy</a>'s <cite><a href="/wiki/Letters%20of%20Credit" class="freelinking" rel="nofollow">Letters of Credit</a></cite>. His most well-known book is <cite><a href="/wiki/A%20Tally%20of%20Types" class="freelinking" rel="nofollow">A Tally of Types</a></cite>, which is no longer an indispensable reference, but is still one of the most entertaining reads out there to the typographically inclined.</p>
    <p>Bibliography:</p>
    <p>‘Towards An Ideal Type’, <em><a href="/wiki/The%20Fleuron" class="freelinking" rel="nofollow">The Fleuron</a></em> Number 2 (London: St. Stephen’s House, 1924) pp. 57-75<br>
    ‘Towards An Ideal Italic’, <em><a href="/wiki/The%20Fleuron" class="freelinking" rel="nofollow">The Fleuron</a></em> Number 5 (Cambridge: The University Press, 1926) pp. 93-129<br>
    ‘The Story of Gill Sans’, <em><a href="/wiki/The%20Monotype%20Recorder" class="freelinking" rel="nofollow">The Monotype Recorder</a></em> Volume 34, Number 4 (London: The Monotype Corporation Limited, Winter 1935-6) pp. i-viii</p>
