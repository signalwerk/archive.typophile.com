  html: |-
    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>: <a href="/node/31465" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Writers</a>: Stanley&nbsp;Morison</strong></p>
    <p>Temperamental typographical advisor to the <a href="/node/add/wiki?edit%5Btitle%5D=Monotype%20corporation" title="Create node &quot;Monotype corporation&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Monotype corporation</a> and opinionated type historian and theoretician. Designer of <a href="/node/14705" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Times New Roman</a> which, along with <a href="/node/13514" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Helvetica</a> and <a href="/node/13516" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Univers</a>, probably holds the honor of being the most well-known typeface of the <a href="/node/add/wiki?edit%5Btitle%5D=20th%20century" title="Create node &quot;20th century&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">20th century</a>. <a href="/node/14705" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Times New Roman</a> was his only type design, and the story of its development is told in <a href="/node/13498" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Walter Tracy</a>’s <cite><a href="/node/41912" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Letters of Credit</a></cite>. His most well-known book is <cite><a href="/node/14742" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">A Tally of Types</a></cite>, which is no longer an indispensable reference, but is still one of the most entertaining reads out there to the typographically&nbsp;inclined.</p>
    <p>Bibliography:</p>
    <p>‘Towards An Ideal Type’, <em><a href="/node/add/wiki?edit%5Btitle%5D=The%20Fleuron" title="Create node &quot;The Fleuron&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">The Fleuron</a></em> Number 2 (London: St. Stephen’s House, 1924) pp. 57-75<br>
    ‘Towards An Ideal Italic’, <em><a href="/node/add/wiki?edit%5Btitle%5D=The%20Fleuron" title="Create node &quot;The Fleuron&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">The Fleuron</a></em> Number 5 (Cambridge: The University Press, 1926) pp. 93-129<br>
    ‘The Story of Gill Sans’, <em><a href="/node/add/wiki?edit%5Btitle%5D=The%20Monotype%20Recorder" title="Create node &quot;The Monotype Recorder&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">The Monotype Recorder</a></em> Volume 34, Number 4 (London: The Monotype Corporation Limited, Winter 1935-6) pp.&nbsp;i-viii</p>
