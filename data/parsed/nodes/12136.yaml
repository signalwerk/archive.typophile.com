    <p>Temperamental typographical advisor to the <a href="/node/add/wiki?edit%5Btitle%5D=Monotype%20corporation" title="Create node &quot;Monotype corporation&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">Monotype corporation</a> and opinionated type historian and theoretician. Designer of <a href="/node/14705/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Times New Roman</a> which, along with <a href="/node/13514/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Helvetica</a> and <a href="/node/13516/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Univers</a>, probably holds the honor of being the most well-known typeface of the <a href="/node/add/wiki?edit%5Btitle%5D=20th%20century" title="Create node &quot;20th century&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">20th century</a>. <a href="/node/14705/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Times New Roman</a> was his only type design, and the story of its development is told in <a href="/node/13498/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Walter Tracy</a>’s <cite><a href="/node/41912/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Letters of Credit</a></cite>. His most well-known book is <cite><a href="/node/14742/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">A Tally of Types</a></cite>, which is no longer an indispensable reference, but is still one of the most entertaining reads out there to the typographically&nbsp;inclined.</p>
