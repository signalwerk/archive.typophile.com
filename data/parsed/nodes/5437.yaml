    html: "<p>Sally -- I may have been a little unclear, English is not my native language. <br> <br>What I meant: 'THE' was a *font*, the rest was calligraphy. And I thought that 'THE', being just three letters, looked out of place with the rest. And should be executed as calligraphy as well, to be in harmony with the rest. Another way of looking at it, if you were to keep the font, you would need more letters, say 'THE RESTAURANT' or similar length. Then it would be strong enough to play a role in a font/calligraphy contrast. <br> <br>Then I said (and you didn't understand this): while calligraphing the word 'THE' you can *still* make it capitals, and make it upright (regular) (not slanted), depending of what's looking good. <br> <br>Haven't said so yet, but I think you're a skilled calligrapher. <br> <br>And I think getting rid of the pictoral element I saw in your first posting was an improvement. <br> <br>Going to London for three days now, see you later. <br> <br>-- <br>S</p>"
