  html: "<p>i am pretty new to typofile--there are some great threads with tons of feedback! <br> <br>so far i haven't had too many \"bites\" on what I have posted, but I try again, welcoming any thoughts/ideas/suggestions. . . . <br> <br>I am working on a restaurant logo that I would love some feedback on . . . <br> <br>The interior is half brick (hence the name) and the other walls have impressionistic european wall murals (which is where the window inspiration came from in the top example). <br> <br>what i want to convey: <br>unique elegance <br>sophisticated, but cozy <br>excellent dining experience <br> <br><img src=\"http://www.typophile.com/forums/messages/29/39682.gif\" alt=\"\"> <br> <br>Any thoughts? <br> <br>Thanks in advance for taking the time to give me your input! <br> <br></p>"
