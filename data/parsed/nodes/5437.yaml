    html: <p>Yes, 'the' needs a little more weight, if the marks has got to be printed in small sizes. <br> <br>Determine what is the 'worst case' as regards to small size and printing on coarse materials. (Paper napkin?) Then look at the counters of 'h' and 'e' ... do you want them to be filled when printing very small sizes? No? Well, then you have an indication of just how big and how heavy the 'the' should be. (But as Scott says, it shouldn't be very much). <br> <br>Have you considered/tried a capital-T in 'the'? It certainly would fit in with the rest as regards to style (calligraphy, old times and so on). Moreover, it wouldn't add some weight to the element. But then again, maybe it doesn't work -- but it think it should be tried, before you declare the design finished. <br> <br>Looks nice now, positive as well as negative. I can just imagine it applied to signage, matchboxes, menues and so on. <br> <br>-- <br>S</p>
