      <p>The real tool for this is <a href="/wiki/Letterror" class="freelinking" rel="nofollow">Letterror</a>'s <a href="/wiki/Superpolator" class="freelinking" rel="nofollow">Superpolator</a>. You can have an infinite amount of axis there, even axis for just one glyph in a font. Anything could be given an axis, including everything you mentioned in your post.</p>
      <p>The "designer" would have to generate the instances into a font though before it could be used in an application.</p>
      <p>Superpolator requires a super dose of <a href="/wiki/Python" class="freelinking" rel="nofollow">Python</a> knowledge. But if you want to do anything with type &amp; programming, Python is the language to learn. I'm surprised that Luc Devroye hasn't realized this yet.</p>
      <p>As far as I know, Meta[insert second word here] is so, so dead. Or, if it was ever alive, it was never really intertwined with the type or graphic design communities, <a href="/wiki/Hermann%20Zapf" class="freelinking" rel="nofollow">Hermann Zapf</a> being a notable exception.</p>
      <p>I wish that I knew Python. Someday, I will try to start with it.</p>
      <p>__<br>
      <a href="http://www.typeoff.de" title="www.typeoff.de">www.typeoff.de</a></p>
