    html: <p>You should check out Metafont and Metafog, two technologies that explore some of the possibilities of generative type design (they're pretty technology-driven, though, being more or less programming languages that generate high-resolution bitmap fonts). There's also FontStudio / FontChameleon, although those are long-dead by now. Practically speaking, nobody's really figured out an effective way to manage the complexity of algorithmically modifying fonts on the fly, at least not in any particularly freeform way. <a href="http://www-cgrl.cs.mcgill.ca/~luc/fontsoftware.html" rel="nofollow">Luc Devroye's font software page</a> has lots of links worth exploring.</p>
