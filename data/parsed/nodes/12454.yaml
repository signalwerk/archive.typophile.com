      <p>superpolator looks pretty interesting. however it seems to interpolate the glyphs from existing glyphs to create new ones. Am I misunderstanding how it works? I'm thinking of an interface that would start from zero, with no existing typefaces whatsoever. </p>
      <p>essentially it would be a multiple master with no masters. just multiples ; )</p>
      <p>granted, this would require extensive collaboration between a very talented coder and a very talented type designer to establish the parameters and devise a way to make it work.</p>
      <p>I don't know if somethin glike that could be used as a tool to design a finished face. it would have to be pretty sophisticated. it could maybe be used as a a quick way to start typefaces, like making a “blank” within certain parameters, getting some rough issues down. then the designer could go in and do the fine tuning. It doesn't seem like a lot of the parameters would be all that hard to specify, though.</p>
      <p>dan, why is python the language to learn for type?</p>
