      <p>The other answer is that Just van Rossum, principal of <a href="/wiki/LettError" class="freelinking" rel="nofollow">LettError</a>, programmer of <a href="/wiki/RoboFog" class="freelinking" rel="nofollow">RoboFog</a> and <a href="/wiki/RoboFab" class="freelinking" rel="nofollow">RoboFab</a>, and general wizard font hacker, is the brother of Guido van Rossum, the designer and lead developer of Python.</p>
      <p>Hackers call this a "<a href="http://www.jargon.net/jargonfile/h/hystericalreasons.html" rel="nofollow">hysterical raisin</a>". Python is no better, nor no worse, for doing font hacking than any of the other x billion object-oriented functional scripting languages, like Ruby or Perl.</p>
