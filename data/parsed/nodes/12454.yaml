    <p>How far has modular typeface design been explored (in the digital sense)? I guess Multiple Master fonts are along those lines, where you can specify weight and width, but has this been pushed further?</p>
    <p>It seems that with digital type, this could be explored with some interesting results. In MM, you started with a basic syle, right. But could you start with a totally blank slate and build a typeface based on given parameters? Beyond weight and width you could specify presence of serifs or not, type of serifs, bracketing, stroke axis, stylistic elements (humanistic, neoclassical, geometric).</p>
    <p>Elements on a particular glyph could be specified, and then related elements on other letters would reflect the change. I'm sure some kind of optical engine could be written to even out weight and color of the type.</p>
    <p>I guess this would start to move into typeface design by a computer, which is a bit of heresy. But the implications could be interesting. </p>
    <p>If there is something out there I'd like to learn more.</p>
    <p>and if there isn't, maybe we could do it</p>
