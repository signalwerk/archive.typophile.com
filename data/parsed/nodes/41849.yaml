      <p>I disagree. Condensed fonts (and lots of compressed) are not a compromise. That's a generalization. ;^) Unless I misunderstood what you meant.</p>
      <p>David Berlow. To name one grand master of designing compressed and condensed fonts. Christian Schwartz, Jonathan Hoefler, Tobias Frere-Jones, and Cyrus Highsmith. Just a short list of people who have designed companion widths for their fonts.</p>
      <p>Good point about compressed being good for display. I've used compressed in display and then condensed for smaller text before and I find that to work well if I want to maintain some sort of continuity of style.</p>
