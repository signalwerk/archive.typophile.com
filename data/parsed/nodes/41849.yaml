    html: |-
      <p>I find that the relative character proportions of the normal need to be modified for the other scalings. So characters that are relatively narrow in the normal need to be widened, relatively, in the extended, because one doesn't want narrow-looking characters in an extended style. And vice versa for the condensed.</p>
      <p>You can see this principal in Futura:<br><img src="/sites/default/files/old-images/CE_6697.jpg"></p>
      <p>So in general, condensed and extended styles have a greater homogeneity of glyph width than the normal proportion of type.</p>
      <p>With the popularity of semi-condensed sans faces, we're seeing more typography with even-width letterforms.</p>
