      <p><cite>What would make me want to choose an extended or compressed style over a standard one?</cite></p>
      <p>I use condensed fonts as headings on a daily basis. They save space and can be really eyecatching, especially those quirky old condensed gothic and grotesque designs. Condensed type can also be a lifeline when designing for writers who simply do not understand concepts like brevity or understatement. For example, Today I used Pill Gothic 300mg to deal with a postcard and a half-page magazine ad that could not contain the text in the 600mg width.</p>
