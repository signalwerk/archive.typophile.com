    html: <p>Every face is different, but I've used helve condensed for setting warnings and other dense info on the back of packages. In this case condensed is still legible. Compressed usually means you've got some extra weight as well and probably need to use this for display work. So maybe you could generalize that condensed should be legible at smaller sizes, but not compressed.</p>
