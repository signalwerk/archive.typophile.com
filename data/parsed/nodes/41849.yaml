    <p>I have a friend that arbitrarily uses extended and condensed fonts all the time.</p>
    <p>What is the difference between condensed and compressed? Are there rules to when and where to use these versions of a font? I don't believe I've ever had the inclination to use these versions, but when I see my friend's work I know it's out of place. I can't really make a good argument for or against his use of these styles.</p>
    <p>Can someone enlighten me?</p>
