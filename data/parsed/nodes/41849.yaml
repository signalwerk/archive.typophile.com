      <p><em>What would make me want to choose an extended or compressed style over a standard one? </em></p>
      <p>The proportion of the page may have something to do with it, and the constraints of copyfitting in a specific layout. The classic example is the headline that was being left open for a one-column story in a newspaper, on the result of a motor race. The winner was "Rickenbacker in a Duesenburg" (or something like like that), hence the need for ultra-squished fonts.</p>
