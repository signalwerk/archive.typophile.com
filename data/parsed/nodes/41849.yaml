    html: <p>I don't think you can make grand generalizations, but condensed fonts almost all look like a compromise to me. There are times when they are handy though, like setting in a narrow column or on the front of a can or other cylindrical object. I usually look for a face that is somewhat narrow to start with, rather than using a condensed version. Compressed versions will often close up at smaller sizes. But then I'm just a regular freelance designer as well.</p>
