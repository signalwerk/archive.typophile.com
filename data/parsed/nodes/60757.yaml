    <div class="info">Submitted by <a href="/user/108" title="View user profile.">Miss Tiffany</a> : 7.Aug.2009 3.00pm </div>
      <p>For Immediate Release:<br>
    Buffalo, NY- August 7th, 2009</p>
    <p>P22 proudly announces two new fonts, Coda and Mai, from Norwegian type<br>
    designer Torleiv Sverdrup for the International House of Fonts.</p>
    <p>The Coda Family is a simple but decorative and controlled sans serif<br>
    design. Coda literally means tale (Italian, from latin cauda) and refers to<br>
    the way the letters h, m and n stretch below the writing line towards the<br>
    end of a sentence or before a final stop. Coda Pro is an elegant and<br>
    contemporary font suited for display purposes. </p>
    <p><a href="http://p22.com/ihof/coda.html" title="http://p22.com/ihof/coda.html">http://p22.com/ihof/coda.html</a></p>
    <p>The Mai Family is a new transitional antiqua that features ligatures, Small<br>
    Caps and full Central European support. Mai's classic design is understated<br>
    enough to be used for long running text applications yet includes unique<br>
    characters suitable for design purposes. It is the Norwegian name for the<br>
    month of May.</p>
    <p><a href="http://p22.com/ihof/mai.html" title="http://p22.com/ihof/mai.html">http://p22.com/ihof/mai.html</a></p>
    <p>Introductory offer through August 31st<br>
    ------------------------------------------------<br>
    You can now follow P22 on Twitter.com:<br>
    <a href="http://www.twitter.com/P22TypeFoundry" title="http://www.twitter.com/P22TypeFoundry">http://www.twitter.com/P22TypeFoundry</a><br>
    ------------------------------------------------<br>
    Become a fan of P22 on Facebook:<br>
    <a href="http://www.facebook.com/pages/P22-type-foundry/11128622951" title="http://www.facebook.com/pages/P22-type-foundry/11128622951">http://www.facebook.com/pages/P22-type-foundry/11128622951</a><br>
    ------------------------------------------------<br>
    Best Regards!<br>
    P22<br>
    <a href="http://www.p22.com" title="www.p22.com">www.p22.com</a></p>
