      <p>Two potential issues with continuous text reading are what I call “track-back” and “drift”. </p>
      <p>Track-back refers to the activity of moving from the end of one line to the beginning of the next line. Ideally this happens smoothly, effortlessly, accurately, without distraction, without losing your place, without needing to look back up to recall the end of the previous line, etc. </p>
      <p>Long line lengths can undermine track-back  — all the eye-turning/head-turning sorts of things mentioned. </p>
      <p>Drift refers to the phenomenon of accidentally slipping from one line to the next, mid-line. One of the most common culprits in drift is excessive word-spacing. When the word space approaches the distance between lines, then drift becomes more likely. Short line lengths (justified) generally lead to greater extremes of word spacing and can become susceptible to drift.</p>
      <p>All of this is in the context of continuous text reading — where the text/content generally has narrative linearity, momentum, forward motion.</p>
      <p>Poetry happens in a different mental time/space. It is a different typographic animal.</p>
      <p><cite> &gt; Poets determine [poetry] line length, not typographers.</cite></p>
      <p>Precisely.</p>
      <p>— K.</p>
