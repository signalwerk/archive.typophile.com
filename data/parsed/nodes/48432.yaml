      <p>I heard Bill Hill of Microsoft at last year’s TypeCon say that the reason the 66 character limit works is that beyond that you have to turn your head, not just your eyes. And that slows you down—or maybe because it more likely you will have to look twice for the next line, but I don’t remember exactly.</p>
      <p>&gt;can it really be blamed for long line lengths being the standard? </p>
      <p>Well somewhat. Microsoft chose a condensed face—Times New Roman—as its default, knowing most people are going to be printing on letter sized paper or A4. With typewriters, Courier was designed so it would give the 66 character length on letter sized paper; Times New Roman at 12 point is way more. Given that these paper sizes are standard, I’m not sure that there is a general best solution, but the choice of Times New Roman—a great typeface in other settings—exacerbated the problem.</p>
