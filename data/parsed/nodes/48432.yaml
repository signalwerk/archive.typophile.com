    <p>I’m a designer for a poetry chapbook press and I’m constantly running into manuscripts that have been influenced to ungainly effect by the specter of MS Word’s preset. </p>
    <p>I remember reading in Bringhurst that the 66 character line is the ideal length for continuous reading, but does this even apply to poetry? Have there been studies that backup this notion? I feel that I can’t really make suggestions unless there is some research to back this up. </p>
    <p>Is it presumptuous of the designer to suggest a slightly modified textblock that might improve the overall readability of the work? Doesn’t it seem wrong that a word processor should be the palette for a book that is a work of art?</p>
    <p>Disclaimer: I’m a poet who wasn’t aware of things like this before I became a designer so I understand why it isn’t necessarily intuitive to be thinking of the dimensions of the book when composing. Am I just griping? Down with legal size asfjd;lasfj!!1!</p>
