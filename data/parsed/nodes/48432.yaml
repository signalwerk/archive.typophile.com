      <p>“Poets determine line length, not typographers.”</p>
      <p>I agree with this in principle but when I see most formal variation dominated by the same Word preset it makes my head hurt. I’ve done an MFA in poetry and worked for literary magazines and it was often very apparent when the poem was composed for an 8.5 x 11 page without any preexisting aesthetic consideration (just one of wanting to use the “whole” page). I’ve talked with poets about this and many say they just open Word and go. </p>
      <p>I know it sounds silly to ask for science to speak to poetry, but its just as bad to ask a word processor to do the same.</p>
