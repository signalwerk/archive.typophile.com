      <p>I love Whitman’s long lines btw.</p>
      <p>This is more pointed to poets who employ dramatic use of white space and want to preserve each page as is from .doc to print. In the setting of a literary magazine, where page dimensions are fixed, this is often unrealistic, no? Not many can afford to produce <a href="http://www.voltpoetry.com/html/about.html">Volt</a>.</p>
      <p>I encourage poets to make aesthetic use of white space but not from the standpoint of the arbitrary hegemonic preset!</p>
      <p>I can see how this can come off as whiny but I think its in the interest of producing better work for all involved.</p>
