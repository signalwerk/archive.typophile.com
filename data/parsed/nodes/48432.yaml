      <p>The ~66 character line recommendation is for continuous reading at average text sizes (10-12 points) with reasonable leading. It’s related to saccades, the tiny eye movements across the line as one reads. Too many saccades on a single line causes discomfort and head turning, which distracts the reader, too few and the reader gets annoyed at dropping to the next line so quickly. IIRC Unger covers this in <em> While You Are Reading</em> which has a monster bibliography.</p>
      <p>Anyway, I would hope that good poets wouldn’t be composing in a word processor to begin with. If Neal Stephenson can write with a Mont Blanc than poets can.</p>
