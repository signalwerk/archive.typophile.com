      <p>To continue with the Lorca observation, it seems to me that poets (not just of the concrete variety) have long been aware of the effect of layout on printed verse, and follow the general maxim that the longer a poem, the longer the line lengths, and the more the look of prose. It’s a question of pleasant proportion in the document, as much as any purely literary concern.</p>
      <p>Blake’s <em>Songs</em> and his <em>Prophecies</em> are an extreme example. But even Eliot follows the principle: <em>The Hollow Men</em>, for instance, has shorter line lengths than <em>The Waste Land.</em></p>
      <p>Another factor may be whether the verse is meant for silent visual reading, or to be listened to, the difference being that within the three-second span of conscious apprehension, many more words can be held by eye than ear. The relationship between temporal duration and speech/verse is discussed by Ernst Pöppel (originator of the 3-second theory) in <em>Mindworks.</em></p>
