    <p>These letters are from the Yale University School of Medicine logo. I pulled out the most  distinctive glyphs (characteristic characters?) for viewing here in TP.</p>
    <p>I can't get a vector version of their logo for a sponsorship. I've got a huge gif, and, at its size, would work fine, but it's not anti-aliased, as you can see in the extraction.</p>
    <p>FYI, I already ran this through WTF in various ways, to no avail.</p>
    <p>Thanks in advance!</p>
