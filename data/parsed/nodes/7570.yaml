    html: <p>Raph, it just occurred to me that if drawing with your curves is as sweet as John Whipple says, they may have an application in Illustrator and other drawing programs, which is a huge market compared to font development. <br> <br>So for that purpose you might want to rethink about filing a patent. Then you could explore the market as an add on in Illustrator or other drawing programs. Traditionally draftsmen did use 'French curves', and Illustrator does have a spiral drawing tool, but I suspect not at all as useful and easy to use as yours, with your 'spinners', though I haven't used either one.  <br> <br>Also again on terminology, I think that you could say that 'Levien' curves are sections of the Cornu spiral selected or drawn using your methodology. Ok, it is better if someone else, such as the buyer of your stuff, makes the choice of terminology, but here it is from a third disinterested party as a suggestion.</p>
