      <p>Sorry to bombard you all with techy stuff. This will be the last one today, I promise. <img src="https://web.archive.org/web/20150124043958im_/http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> <br> <br>Part of my last patch makes no sense at all. What was I thinking? It doesn't even stop the thing from crashing when you overlap knots, you just have to overlap three consecutive knots rather than two! <br> <br>Here's my current diff. It includes a *slightly* saner fix for the overlapping issue. (If two points coincide, surreptitiously give the second one a very very gentle nudge.) Also it detects if the rendering is obviously going to diverge, and yells &amp; backs off. This doesn't address the real problem at all, but does stop it from actually crashing. <br> <br></p>
