    html: <p>Raph, <br> <br>I am not a lawyer, but I believe you would be protected under <a href="https://web.archive.org/web/20150124043958/http://assembler.law.cornell.edu/uscode/html/uscode35/usc_sec_35_00000102----000-.html"> U.S.C. Title 35, Chapter 10, Section 102</a>. <br> <br>Especially, arguing that this forum is a publication. And can be reliably dated. It's different, if I'm not mistaken, in Europe where the prize is won by the first to patent and not by the first to invent. <br> <br>So even if someone did start making the software based off of your work, you can make a big stink and at least get the credit you deserve. <br> <br>Again, I'm not a lawyer. My legal advice should be taken with a grain or two of salt. Then again, I may bill you for the legal advice anyway.</p>
