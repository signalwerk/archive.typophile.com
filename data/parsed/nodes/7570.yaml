    votes: null
    html: "<p>I suspect Thomas was simply saying: Don't get your hopes up too much. <br>Such a cautious approach is something natural to me too - on the other hand that's probably why you'll end up releasing some great and useful font editing software (or at least utility) and I won't. Good luck! <br> <br>&gt; font designers will flock to Cornu curves and refuse to go back <br> <br>If it's <i>that</i> much better, many people might indeed gladly give up the comforts of what they're used to. But note how much general resistance there is to switching from Fontographer to FontLab, even though almost everybody agrees/admits that the latter is much better in almost every way; and the difference between them is probably less than the difference between either and Cornu spline editing!  :-/ <br> <br>It seems to me that a good tactic in terms of getting a solid initial base of users would be to target people who are still using Fontographer, but have developed the need to switch to something else (FontLab being the most obvious choice). Since this group of people has already given in to the idea of change, they might very well form your best user foundation. And there are a lot of them, as evidenced by the demand for Cabarga's FontLab quickie-learning book. <br> <br>hhp</p>"
