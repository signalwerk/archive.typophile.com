  - id: 51483
    user: 4406
    date: 2004-11-16T21:46:00
    date_raw: 16 Nov 2004 — 9:46pm
    votes: null
    html: "<p>Sergej: thanks for your comments. I appreciate negative feedback as much as positive. Well, <i>almost</i> as much :<a href=\"https://web.archive.org/web/20150124043958/http://levien.com/\"></a>) <br> <br>Here's the deal about straight-to-curve transitions. The Cornu spiral can do a very good job with them, but my program does not <i>yet</i> automatically find the curve parameters to fit this case. You can fit by hand if you're willing to do some nudging of points (and perhaps add an additional knot or two beyond what Sergei had), but ultimately my feeling is that this is something the computer should be able to solve for you. <br> <br>My sense is that Ikarus got the UI issues about right. In addition to the curve and corner points present in my code now, Ikarus also has the concept of a \"tangent point\", which is used primarily to join straights to curves. I'm pretty sure that I'll add that third knot type, with behavior similar (probably not identical) to Ikarus. <br> <br>That said, the mathematics of the straight/curve transition are devilishly difficult. I have about a couple dozen papers printed out now that directly address the problem of fitting a smooth interpolating spline, but none really address the issue of a straight/curve transition directly. The best result I've seen so far is Moreton's work with MVC's (minimum variation of curvature)</p>"
    html_clean: "<p>Sergej: thanks for your comments. I appreciate negative feedback as much as positive. Well, <i>almost</i> as much :<a href=\"https://web.archive.org/web/20150124043958/http://levien.com/\" class=\"link-external\"></a>) <br> <br>Here's the deal about straight-to-curve transitions. The Cornu spiral can do a very good job with them, but my program does not <i>yet</i> automatically find the curve parameters to fit this case. You can fit by hand if you're willing to do some nudging of points (and perhaps add an additional knot or two beyond what Sergei had), but ultimately my feeling is that this is something the computer should be able to solve for you. <br> <br>My sense is that Ikarus got the UI issues about right. In addition to the curve and corner points present in my code now, Ikarus also has the concept of a \"tangent point\", which is used primarily to join straights to curves. I'm pretty sure that I'll add that third knot type, with behavior similar (probably not identical) to Ikarus. <br> <br>That said, the mathematics of the straight/curve transition are devilishly difficult. I have about a couple dozen papers printed out now that directly address the problem of fitting a smooth interpolating spline, but none really address the issue of a straight/curve transition directly. The best result I've seen so far is Moreton's work with MVC's (minimum variation of curvature)</p>"
  - id: 51484
    user: 4406
    date: 2004-11-17T01:20:00
    date_raw: 17 Nov 2004 — 1:20am
    votes: null
    html: "<p>Here are some screenshots to demonstrate the point I was making in the previous post. I traced a 36 point Century Catalogue A, scanned at 1200dpi. Here's the original scan: <br> <br><img src=\"https://web.archive.org/web/20150124043958im_/http://www.typophile.com/forums/messages/30/53804.gif\" alt=\"raw scan\"> <br> <br>Here's the resulting outline without knots or background image. For this trace I chose sharp corners. <br> <br><img src=\"https://web.archive.org/web/20150124043958im_/http://www.typophile.com/forums/messages/30/53805.gif\" alt=\"trace outline\"> <br> <br>Here's the outline (with knots) superimposed over the reference image: <br> <br><img src=\"https://web.archive.org/web/20150124043958im_/http://www.typophile.com/forums/messages/30/53806.gif\" alt=\"outline over background\"> <br> <br>And finally just the outline and knots: <br> <br><img src=\"https://web.archive.org/web/20150124043958im_/http://www.typophile.com/forums/messages/30/53807.gif\" alt=\"outline with knots\"> <br> <br>Each round corner is accomplished with three knots. Placing the knots so that the two on the end have the right tangent (coinciding with chord to next knot) and curvature (zero) takes some patience. That's the part I'd like to have a better UI for.</p>"
    html_clean: "<p>Here are some screenshots to demonstrate the point I was making in the previous post. I traced a 36 point Century Catalogue A, scanned at 1200dpi. Here's the original scan: <br> <br><img src=\"https://web.archive.org/web/20150124043958im_/http://www.typophile.com/forums/messages/30/53804.gif\" alt=\"raw scan\"> <br> <br>Here's the resulting outline without knots or background image. For this trace I chose sharp corners. <br> <br><img src=\"https://web.archive.org/web/20150124043958im_/http://www.typophile.com/forums/messages/30/53805.gif\" alt=\"trace outline\"> <br> <br>Here's the outline (with knots) superimposed over the reference image: <br> <br><img src=\"https://web.archive.org/web/20150124043958im_/http://www.typophile.com/forums/messages/30/53806.gif\" alt=\"outline over background\"> <br> <br>And finally just the outline and knots: <br> <br><img src=\"https://web.archive.org/web/20150124043958im_/http://www.typophile.com/forums/messages/30/53807.gif\" alt=\"outline with knots\"> <br> <br>Each round corner is accomplished with three knots. Placing the knots so that the two on the end have the right tangent (coinciding with chord to next knot) and curvature (zero) takes some patience. That's the part I'd like to have a better UI for.</p>"
