  - id: 51471
    user: 4406
    date: 2004-11-16T13:10:00
    date_raw: 16 Nov 2004 — 1:10pm
    votes: null
    html: "<p>Thanks everybody for all the awesome feedback, especially the screenshots and patches! <br> <br>Robin: you'll be happy to know that my current working codebase can insert and delete knots. I'll probably make another release later today. Your 'E' generally looks good, but definitely has more knots than it needs. Here's a <a href=\"https://web.archive.org/web/20150124043958/http://casper.ghostscript.com/~raph/spiro.png\">screenshot</a> of the lowercase 72pt metal Centaur 'e' I'm working on. <br> <br>Hrant: I think it's best to enforce the extrema in the conversion from high-res outlines to the specific font format. Of course, you're going to get quantization error when you do so, but I don't see any good way to avoid that. Side note: does anyone know of a downside to using 4096/em when generating TT outlines? (With Type1, you can cheat on the precision by using the div operator) <br> <br>The OSX port is coming along (right now it can load files and display outlines, but not yet edit them interactively). The last few days, I've been giving more attention to much needed UI improvements, though. I've been tracing 72pt metal Centaur miniscules, which is of course a pretty good real-world test. I'm also willing to do the Windows port myself, but coding <i>does</i> take time. If someone with good Win32 coding skills wants to volunteer, I'll gratefully accept. <br> <br>Last but not least: I've tentatively chosen the name \"Spiro\" for the project. At least it's an improvement over \"ppedit\".</p>"
    html_clean: "<p>Thanks everybody for all the awesome feedback, especially the screenshots and patches! <br> <br>Robin: you'll be happy to know that my current working codebase can insert and delete knots. I'll probably make another release later today. Your 'E' generally looks good, but definitely has more knots than it needs. Here's a <a href=\"https://web.archive.org/web/20150124043958/http://casper.ghostscript.com/~raph/spiro.png\" class=\"link-external\">screenshot</a> of the lowercase 72pt metal Centaur 'e' I'm working on. <br> <br>Hrant: I think it's best to enforce the extrema in the conversion from high-res outlines to the specific font format. Of course, you're going to get quantization error when you do so, but I don't see any good way to avoid that. Side note: does anyone know of a downside to using 4096/em when generating TT outlines? (With Type1, you can cheat on the precision by using the div operator) <br> <br>The OSX port is coming along (right now it can load files and display outlines, but not yet edit them interactively). The last few days, I've been giving more attention to much needed UI improvements, though. I've been tracing 72pt metal Centaur miniscules, which is of course a pretty good real-world test. I'm also willing to do the Windows port myself, but coding <i>does</i> take time. If someone with good Win32 coding skills wants to volunteer, I'll gratefully accept. <br> <br>Last but not least: I've tentatively chosen the name \"Spiro\" for the project. At least it's an improvement over \"ppedit\".</p>"
