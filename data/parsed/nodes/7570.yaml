    html: <p>I followed your original thread on this closely, and have given it a lot of thought. As an editing/development environment, I think something based on Cornu curves is a great idea. One fundamental problem that plagues PostScript style outlines is that it is difficult to get a nice smooth transition from a straight to a curve. Working with a Cornu curve (a.k.a. Cornu spiral) would seem to be a great way to deal with that. <br> <br>That being said, making your own editor for this is really not a great solution for most font developers--though it makes a great proof of concept. The idea would need to be adopted by mainstream font editing applications such as FontLab and DTL FontMaster. <br> <br>I for one would be happy to play with a prototype editor once you get turnkey installation for Mac or Windows, and would probably strongly encourage the font editor folks to look at it. <br> <br>Regards, <br> <br>T</p>
