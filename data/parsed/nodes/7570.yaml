    html: <p><i>But note how much general resistance there is to switching from Fontographer to FontLab...</i> <br> <br>Two years ago, I would have said that was the case, because many people who were familiar with Fontographer wanted similar drawing tools in FontLab, which they now have. Since FontLab 4.6 was released, almost everyone I know has switched to it, except for a few die-hard FontStudio fans. There seems to me now very little resistance to switching from Fontographer to FontLab.</p>
