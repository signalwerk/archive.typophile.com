  - id: 51446
    user: 909
    date: 2004-11-12T13:46:00
    date_raw: 12 Nov 2004 — 1:46pm
    votes: null
    html: <p>Raph, <br> <br>Glad I was able to explain myself better. I really don't want to discourage you from developing your ideas, certainly hope you get credited for them, and really wasn't trying to be condescending. I was just trying to explain why it is that I'd need them in FontLab to be useful to me personally, and why a lot of the professional type dev community would probably be thinking the same way. <br> <br>Honestly, this is one of the couple of coolest new ideas I've heard for type development tools in this decade. Please forgive me for wanting it to be integrated into the tools I use daily.  <img src="https://web.archive.org/web/20150124043958im_/http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> <br> <br>That being said, I think that both Hrant and John are right. On the one hand, the pro type dev community has really come around to FontLab lately. On the other hand, there are still a lot of people using Fontographer, especially those who don't do this full time, or are strictly doing the glyph design part of things and not final production. <br> <br>Finally, although diversity and competition is good, I have difficulty imagining that either FontForge or a brand-new-from-scratch program is going to be really competitive with FontLab any time soon. I'm just thinking that it's a ton of work and a certain amount of polishing time that is needed, and that it's not feasible to get there in just a year or two. <br> <br>Regards, <br> <br>T</p>
