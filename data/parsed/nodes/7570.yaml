ch as OpenType, so that in the worst case people who develop the font as Cornu curves will have to do follow-on work in a standard tool. <br> <br>For just drawing curves, such a batch converter should work fine, but to take advantage of the planned optical scaling and meta capabilities (such as continuously varying extender length), it will by necessity \"freeze\" these parameters into the curve. <br> <br>Having you as a champion of these ideas could be a <i>very</i> good thing. Hopefully I can allay some of your concerns about getting trapped into an unsupported file format, and you can allay some of my concerns about recognition, and to make sure that the full package of ideas including optical scaling has a chance to live, rather than being crushed by a \"good enough\" hack of the Cornu curve into legacy font tools. <br> <br>I'll probably prepare a native OSX Carbon demo some time in the next couple of weeks. I'm sure we will pick up this discussion after you get a chance to play with it - assuming my experience is representative, font designers will flock to Cornu curves and refuse to go back to the bad old days of Beziers.</p>"
