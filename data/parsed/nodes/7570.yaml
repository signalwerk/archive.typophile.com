    html: "<p>Laurence: is it possible you don't have /sw/bin in your path? Fink requires you to run /sw/bin/pathsetup.sh or the moral equivalent. <br> <br>Assuming you've already got that covered and it is another problem, try the <a href=\"https://web.archive.org/web/20150124043958/http://casper.ghostscript.com/~raph/ppedit-pantherbin.tar.gz\">binary</a> I compiled. It will probably work better if you run it from inside an xterm than from Terminal.app. <br> <br>hrant: I'm not deeply familiar with that API, but an off-the-top-of-my-head guess is that it would be fairly straightforward to write a batch converting tool, but probably not easy at all to integrate it at the level of the interactive curve editor. <br> <br>Thomas: I'm glad you're interested in the Cornu curves; obviously you've got a lot of sway in the community. That said, perhaps you could enlighten me exactly how I benefit from having the \"mainstream font editors\" appropriate my ideas. There's a lot more that I want to do besides the Cornu curve, including optical scaling and revisiting Metafont-like controls. The only way I can see not to be at the mercy of developers in a somewhat marginal niche is to code it myself, possibly with collaboration from the free software world.</p>"
    html_clean: "<p>Laurence: is it possible you don't have /sw/bin in your path? Fink requires you to run /sw/bin/pathsetup.sh or the moral equivalent. <br> <br>Assuming you've already got that covered and it is another problem, try the <a href=\"https://web.archive.org/web/20150124043958/http://casper.ghostscript.com/~raph/ppedit-pantherbin.tar.gz\" class=\"link-external\">binary</a> I compiled. It will probably work better if you run it from inside an xterm than from Terminal.app. <br> <br>hrant: I'm not deeply familiar with that API, but an off-the-top-of-my-head guess is that it would be fairly straightforward to write a batch converting tool, but probably not easy at all to integrate it at the level of the interactive curve editor. <br> <br>Thomas: I'm glad you're interested in the Cornu curves; obviously you've got a lot of sway in the community. That said, perhaps you could enlighten me exactly how I benefit from having the \"mainstream font editors\" appropriate my ideas. There's a lot more that I want to do besides the Cornu curve, including optical scaling and revisiting Metafont-like controls. The only way I can see not to be at the mercy of developers in a somewhat marginal niche is to code it myself, possibly with collaboration from the free software world.</p>"
  - id: 51442
    user: 909
    date: 2004-11-09T21:44:00
    date_raw: 9 Nov 2004 — 9:44pm
    votes: null
    html: "<p>Raph: <br> <br>It depends on your objectives. I can understand why you might not be interested in the mainstream font editors using your ideas without you controlling/directing the implementation. <br> <br>My own interest in supporting this technology would be to have it really mainstream and something I could rely on. If it's not in mainstream tools, and requires storing the master outlines in what is essentially a non-standard format, then my interest becomes largely academic. I don't think I would want to risk ending up with my outline data in an unsupported format that I can't get at, some years down the road. Not everyone will feel the same way, of course, but I imagine a lot of folks will. <br> <br>Maybe you can get more out of this yourself if you develop it all on your own. But there probably isn't a lot \"in it for you\" no matter how you play it. Font editing tools is not a very profitable area to go into. <br> <br>If it's more a matter of control rather than profit, then maybe something like teaming up with the FontForge folks is the best way to go. <br> <br>Best of luck with it, no matter what you decide to do. It is a really interesting idea. <br> <br>Regards, <br> <br>T</p>"
    html_clean: "<p>Raph: <br> <br>It depends on your objectives. I can understand why you might not be interested in the mainstream font editors using your ideas without you controlling/directing the implementation. <br> <br>My own interest in supporting this technology would be to have it really mainstream and something I could rely on. If it's not in mainstream tools, and requires storing the master outlines in what is essentially a non-standard format, then my interest becomes largely academic. I don't think I would want to risk ending up with my outline data in an unsupported format that I can't get at, some years down the road. Not everyone will feel the same way, of course, but I imagine a lot of folks will. <br> <br>Maybe you can get more out of this yourself if you develop it all on your own. But there probably isn't a lot \"in it for you\" no matter how you play it. Font editing tools is not a very profitable area to go into. <br> <br>If it's more a matter of control rather than profit, then maybe something like teaming up with the FontForge folks is the best way to go. <br> <br>Best of luck with it, no matter what you decide to do. It is a really interesting idea. <br> <br>Regards, <br> <br>T</p>"
  - id: 51443
    user: 4406
    date: 2004-11-12T11:40:00
    date_raw: 12 Nov 2004 — 11:40am
    votes: null
    html: "<p>Thomas: <br> <br>Thanks for your clear explanation of your concerns in adopting a new technology. In the free software community, we also have concerns about becoming dependent on proprietary formats. This is one reason, for example, why we have enthusiastically adopted PDF but not Flash. <br> <br>I'm not 100% sure what my objectives are. As you say, it's very unlikely that anybody can become rich developing new font technology. At this point, I'm more concerned with recognition than making money off the idea. <br> <br>There's one specific outcome I would like to avoid, though. I would be very disappointed if one of the major font editor developers introduced Cornu curves into their product without credit to me. Since I haven't pursued a patent or anything, there is no legal reason not to. <br> <br>I must admit that when I first read your 8 Nov comment, I was rubbed the wrong way by what I read as condescention: \"it's ok  for you to play with these curves, but when it comes to using them in the real world, you better leave that to the big guys.\" I'm sure that's not what you meant to convey, so I'll try to stay focussed on the concrete issues. <br> <br>As far as the risks of being locked into a proprietary format, I feel there are three things I can do: <br> <br>* Fully document the file format and the underlying algorithms to process it. This part is easy, as I am writing up the ideas in a PhD thesis, and I am designing the file format to be particularly easy to parse and manipulate. <br> <br>* Release the core code as free software, guaranteeing that it will stay alive so long as there is interest in the community. I am seriously considering releasing the code in a hybrid model, where the Linux version is truly free software, but the Win32 and Mac versions have proprietary UI code, including refinements such as making cut/paste interact transparently with apps such as Illustrator. <br> <br>* Develop batch converters to standard file formats such as OpenType, so that in the worst case people who develop the font as Cornu curves will have to do follow-on work in a standard tool. <br> <br>For just drawing curves, such a batch converter should work fine, but to take advantage of the planned optical scaling and meta capabilities (such as continuously varying extender length), it will by necessity \"freeze\" these parameters into the curve. <br> <br>Having you as a champion of these ideas could be a <i>very</i> good thing. Hopefully I can allay some of your concerns about getting trapped into an unsupported file format, and you can allay some of my concerns about recognition, and to make sure that the full package of ideas including optical scaling has a chance to live, rather than being crushed by a \"good enough\" hack of the Cornu curve into legacy font tools. <br> <br>I'll probably prepare a native OSX Carbon demo some time in the next couple of weeks. I'm sure we will pick up this discussion after you get a chance to play with it - assuming my experience is representative, font designers will flock to Cornu curves and refuse to go back to the bad old days of Beziers.</p>"
