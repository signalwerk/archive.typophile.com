    html: <p>You are welcome, Raph. I took your advice to heart, but eventually <a href="http://dreamer.nitro.dk/temp/ppedit-drive3.png">my patience run out</a>. Ahem. <br> <br>On a second attempt I got <a href="http://dreamer.nitro.dk/temp/ppedit-drive4.png">what I wanted</a>. (This particular serif style is one I might use for my typeface.) Once you know where to put points the contour shaping becomes manageable and not as hard as it seems at first, but the current approach is still unnecessarily painful. As you say, there needs to be a third knot type. That said, I don't see the advantage of using your curves instead of Bezier's in this particular case. Do you? (I'll try drawing letter U later.) <br> <br>I think your curves have interesting dynamics. If you have a series of points and you change one, the curve changes between them all. Reminds me of wave propagation. With Bezier curves one is used to the curve between neighbouring points to stay the same. With quadratic curves also the neighbours are effected. So, the results of drawing with your curves are harder to predict, though I'm not saying that I don't like it that way. Predictability is overrated anyway. Another thing is that one doesn't have to worry about curves not being round. That's what I referred to when I said drawing the same D in FontLab felt kind of lame. This is a very nice property. So, yes, I agree with your original statement that it's faster to make </p>
