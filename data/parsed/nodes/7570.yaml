    html: <p><i>...may have an application in Illustrator and other drawing programs, which is a huge market compared to font development.</i> <br> <br>This is oh so very true. Developing this even as plugin for Illustrator would be cool or (keeping it Free) an extension on Inkscape's tools would be awesome. <br> <br>Levien curves definitely, and can your university help you secure a patent or is that crazy talk? <br> <br>I like B-Spline tools like the one in Expressions 3 (Formerly Creature House now M$ free download). Clicking three points is the same model. This also has a Bezier Pen and a "Polyline" pen which is a combo straight-segment and B-Spline tool. <br> <br>Illustrator's spiral tool is okay, but I haven't really used it much. It draws spirals only, as distinct from crurves derived from spirals. Drawing spirals is easier in ppedit (please change the name... ;-)) and S curves and curves that are sections of ovals.  <br> <br>Oh and I meant 'rooted' or 'full screen' mode in my earlier post. <br> <br>Jon</p>
