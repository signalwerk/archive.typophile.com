  date_raw: 7 Nov 2004 — 11:34pm
  votes: null
  html: <p>If you're nutty enough to be running on a Linux or Mac OSX system with Fink, you can try out a rough prototype of my Cornu-based curve editor. Download the tarball <a href="https://web.archive.org/web/20150124043958/http://casper.ghostscript.com/~raph/ppedit.tar.gz">here</a> and build using "make". <br> <br>My experience so far has been great - it seems way faster to make good curves than Bezier-based tools. It's similar in spirit to Ikarus, but seems to require about half as many points (at least based on the IkarusMaster demo I tried from DTL). <br> <br>I'm hacking on a native OSX port now, and could probably have my arm twisted to make a Windows one as well. I make no promises as to when these will be done, as this is very much a spare time project. <br> <br>If you do manage to play with it, I'd love to hear your feedback, or post your preference for what platform[s] you'd like to see it ported to. If I do the Windows one, I'll probably want to use GDI+, which is only supported natively on XP (there is a DLL for earlier Windows versions, but I'm not sure how well it works). I'm also tempted to use the HIView compositing feature of Mac OSX, which would make it require 10.2 or higher.</p>
  html_clean: <p>If you're nutty enough to be running on a Linux or Mac OSX system with Fink, you can try out a rough prototype of my Cornu-based curve editor. Download the tarball <a href="https://web.archive.org/web/20150124043958/http://casper.ghostscript.com/~raph/ppedit.tar.gz" class="link-external">here</a> and build using "make". <br> <br>My experience so far has been great - it seems way faster to make good curves than Bezier-based tools. It's similar in spirit to Ikarus, but seems to require about half as many points (at least based on the IkarusMaster demo I tried from DTL). <br> <br>I'm hacking on a native OSX port now, and could probably have my arm twisted to make a Windows one as well. I make no promises as to when these will be done, as this is very much a spare time project. <br> <br>If you do manage to play with it, I'd love to hear your feedback, or post your preference for what platform[s] you'd like to see it ported to. If I do the Windows one, I'll probably want to use GDI+, which is only supported natively on XP (there is a DLL for earlier Windows versions, but I'm not sure how well it works). I'm also tempted to use the HIView compositing feature of Mac OSX, which would make it require 10.2 or higher.</p>
