    date_raw: 16 Nov 2004 — 12:33pm
    votes: null
    html: <p>I'm not sure that my miserably amateurish drawing demonstrates anything more interesting than my lack of skill, but I just had a quick bash at tracing a bitmap scan; specifically <a href="https://web.archive.org/web/20150124043958/http://www.typophile.com/forums/messages/30/48138.jpg">this</a> 60pt Centaur 'E' posted by Raph to his <a href="https://web.archive.org/web/20150124043958/http://www.typophile.com/forums/messages/30/48092.html">Digitization Quality</a> thread. <br> <br>The current incarnation of ppedit doesn't let you delete knots or add new ones in the middle, so I stuck with the knots I generated with a quick click round the outline, and pulled them around a bit. <br> <br>Here it is, with/without the background/knots. <br> <br><img src="https://web.archive.org/web/20150124043958im_/http://www.typophile.com/forums/messages/30/53762.gif" alt=""> <br><img src="https://web.archive.org/web/20150124043958im_/http://www.typophile.com/forums/messages/30/53763.gif" alt=""> <br><img src="https://web.archive.org/web/20150124043958im_/http://www.typophile.com/forums/messages/30/53764.gif" alt=""></p>
