    html: "<p>William: <br> <br>I did consider patenting the idea, but basically decided that the return probably wouldn't outweigh the costs. In my experience, getting companies to license technology is very much an uphill battle. I've had some success with my screening technologies, but there's an area where big printer companies invest millions of dollars each to develop the technology in-house, and my stuff is just as good and well within reach of smaller companies. But when it comes to licensing technology that breaks truly new ground (for example, my algorithm for suppressing moire using conventional dot shapes), I've had basically no success at all. <br> <br>Of course, I could be passing up the opportunity to become fabulously wealthy off the idea, in which case I'll just have to file it with all the other missed opportunities :<a href=\"https://web.archive.org/web/20150124043958/http://localhost/\"></a>)</p>"
