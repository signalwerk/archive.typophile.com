    html: |-
      <p>Having the e be a rotation of the a (or vice versa) is a neat idea that is totally not working here. "hamburgefons" is an eyesore as a result. I think, at the very least, the counters need to be larger in order for those letterforms to work. The top of the Q feels sawn off rather than flattened. The figures are ungainly. They either need to be smoothed out or made more geometric; they're lumpy now. I like the g, m, and w. Is the x supposed to be leaning to the right?</p>
      <p>Right now it feels more like <a href="/wiki/Eurostile" class="freelinking" rel="nofollow">Eurostile</a>, <a href="/wiki/Microgramma" class="freelinking" rel="nofollow">Microgramma</a>, or <a href="/wiki/Bank%20Gothic" class="freelinking" rel="nofollow">Bank Gothic</a> more than a <a href="/wiki/didone" class="freelinking" rel="nofollow">didone</a>, mostly because the curves of the bowls and lobes undercuts the contrast in the strokes. It also feels a little like <a href="/wiki/Peignot" class="freelinking" rel="nofollow">Peignot</a>, with the unusual variations in heights and letterforms. I think what it really needs is to have a coat of consistency slapped over it, and then see what direction you want to take it. It's not boring, but it has no idea what it wants to be when it grows up.</p>
