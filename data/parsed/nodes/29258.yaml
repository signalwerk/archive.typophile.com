    <p>With apologies for the plug, I’ll pop my head over the parapet to announce that on Thursday 30 November the Department of Typography is holding an Open Day for people interested in our MA programmes (there’s five: three practice-based, two exclusively academic; see <a href="http://www.rdg.ac.uk/typography/" title="http://www.rdg.ac.uk/typography/">http://www.rdg.ac.uk/typography/</a> ). If you are interested, get in touch with me and I will pass on further details. </p>
    <p>Although there will be another Open Day in the spring, anybody interested in investigating funding support options needs to start work on applying soon.</p>
