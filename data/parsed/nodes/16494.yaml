  html: <p>Could anybody please explain to me why helvetica has a double storey a but single storey g? I am sure there are other typefaces that might do this but helvetica is so widely used I wondered why it is like that. I have been trying to find out the whole storey (!) of the lower case a and g as they seem to be the only two letters that have a commonly accepted alternate that all english readers recognise without problem, and maybe without even noticing. Thank you.</p>
