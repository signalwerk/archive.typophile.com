    html: <p>I believe the one story g and two story a are an influence of black letter on Akzidenz Grotesque. The black letters seem to always have a more or less one story g (a hair line closes it), and often a two story a. The English Johnston, with Underground and the American Benton, with Franklin, did the two story g because of no blackletter influence.</p>
