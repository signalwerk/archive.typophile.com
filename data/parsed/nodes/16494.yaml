    html: |-
      <p>My old 1958 Encyclopedia of Typefaces says that grotesks that follow the German or continental model use a single storey 'g' while grotesques that follow the traditional English pattern use a double storey 'g'. This difference is the basis of grotesque (double storey) and neo-grotesque (single storey) as separate classifications (see the BS:2961 in the back of Rookledges Typefinder). The double storey version is older - essentially 19th century, rather than mid-20th century.</p>
      <p>Yes its true that AG set the norm for German grotesks (see also Venus, Folio, Reform Grotesk et al) but I have also seen that variant of AG that includes a single storey 'a'...</p>
