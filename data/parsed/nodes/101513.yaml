  html: |-
    <p>I've been asked to slightly tweak an existing wordmark for a flooring company in Indianapolis, Indiana, but the files provided are flattened (non-vector) tifs and jpgs. If this wordmark isn't a custom typeface, I'd rather adjust it by buying the typeface and re-typesetting it in Illustrator so that the client has the editable artwork moving forward for all usages. </p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/kermans_5487.jpg"></div><p></p>
    <p>Look familiar to anyone? I tried a few type identifiers online, but none came up with results that matched this wordmark. I'm guessing because there were limited characters available for me to comment on with their widgets.</p>
    <p>If it's useful, you can also view their logo in play on their current website: <a href="http://www.kermans.com" title="http://www.kermans.com">http://www.kermans.com</a></p>
    <p>Thanks, in advance, for any help.</p>
